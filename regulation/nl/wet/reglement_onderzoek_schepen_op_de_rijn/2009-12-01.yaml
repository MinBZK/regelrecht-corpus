            Opmerkingen:
            1 Voor apparaten met een hoge warmte-ontwikkeling: IP 12.
            2 Indien het apparaat zelf niet aan de minimum beschermingsgraad voldoet, moet de plaats van opstelling de
      minimum beschermingsgraad volgens de tabel hebben.
            3 Erkend veilige elektrische inrichting, bijvoorbeeld
            a. volgens de Europese Norm EN 50014: 1997; 50015: 1998; 50016: 2002; 50017: 1998; 50018: 2000; 50019: 2000
      en 50020: 2002 of
            b. de overeenkomstige IEC-Publicaties 60079 in de versies geldig op 1 oktober 2003
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.03
  - number: '9.04'
    text: |-
      In ruimten waarin zich explosieve gassen of gasmengsels kunnen ophopen, zoals accumulatorenruimten en ruimten
      voor opslag van licht ontvlambare stoffen, zijn slechts erkend veilige elektrische inrichtingen (voldoende veilig
      voor gebruik in een gegeven explosiegevaarlijke omgeving) toegestaan. In deze ruimten mogen geen schakelaars voor
      verlichting en voor andere elektrische apparaten zijn geïnstalleerd. De beschermingsgraad tegen explosies moet zijn
      afgestemd op de eigenschappen met betrekking tot explosiegevaar van de voorkomende explosieve gassen en gasmengsels
      (explosiegroep, temperatuurklasse).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.04
  - number: 9.05.1
    text: Voor installaties met spanningen boven 50 V is aarding noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.05
  - number: 9.05.2
    text: |-
      De bij het normale bedrijf niet onder spanning staande metalen delen die voor aanraking toegankelijk zijn, zoals
      fundaties en omhulsels van machines, apparaten en verlichting, moeten afzonderlijk zijn geaard, voor zover zij niet
      door hun bevestiging elektrisch geleidend met de scheepsromp zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.05
  - number: 9.05.3
    text: |-
      De omhulsels van verplaatsbare en draagbare apparaten moeten door middel van een extra ader die bij het normale
      bedrijf geen stroom voert en die in de voedingskabel is opgenomen, zijn geaard. Dit geldt niet bij het gebruik
      van een beschermingstransformator en voor apparaten waarvan de omhulsels bestaan uit isolatiemateriaal (dubbel
      geïsoleerd).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.05
  - number: 9.05.4
    text: |-
      De doorsnede van de aardleiding moet tenminste gelijk zijn aan de waarde zoals aangegeven in de onderstaande tabel:







                    Doorsnede van de stroomgeleider [mm2]


                    Minimum doorsnede van de aardleiding





                    In geïsoleerde kabels [mm2]


                    Separate kabels [mm2]






                    0,5 t/m 4


                    gelijk aan de doorsnede van de stroomgeleider


                    4




                    > 4 t/m 16


                    gelijk aan de doorsnede van de stroomgeleider


                    gelijk aan de doorsnede van de stroomgeleider




                    > 16 t/m 35


                    16


                    16




                    > 35 t/m 120


                    gelijk aan de halve doorsnede van de stroomgeleider


                    gelijk aan de halve doorsnede van de stroomgeleider




                    > 120


                    70


                    70
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.05
  - number: 9.06.1
    text: |-
      Spanningen mogen de volgende waarden niet overschrijden:








                    Soort van installatie


                    Ten hoogste toegestane spanning bij





                    Gelijkstroom


                    Wisselstroom


                    Draaistroom






                    a. Kracht- en verwarmingsinstallaties met inbegrip van de wandcontactdozen voor algemeen gebruik


                    250 V


                    250 V


                    500 V




                    b. Installaties voor verlichting, communicatie en signalering met inbegrip van de wandcontactdozen
      voor algemeen gebruik


                    250 V


                    250 V


                    –




                    c. Wandcontactdozen voor de voeding van apparaten die bij het gebruik in de hand worden gehouden en
      die op het open dek of in nauwe of vochtige ruimten, met uitzondering van ketels of tanks, worden gebruikt:







                    1. Algemeen


                    50 V1


                    50 V1


                    –




                    2. Met een beschermingstransformator die slechts één apparaat voedt


                    –


                    250 V2


                    –




                    3. Bij gebruik van apparaten die dubbel geïsoleerd zijn uitgevoerd


                    250 V


                    250 V


                    –




                    4. Bij gebruik van aardlekschakelaars ≤ 30 m A


                    –


                    250 V


                    500 V




                    d. Verplaatsbare verbruikers zoals elektrische installaties van containers, aangehangen motoren,
      verplaatsbare ventilatoren of pompen, die normaal wanneer zij worden gebruikt niet worden verplaatst en waarvan de
      voor aanraking toegankelijke geleiders door een aardleiding in de aansluitkabel zijn geaard en die verder door hun
      opstelling of door een extra geleider met de scheepsromp zijn verbonden


                    250 V


                    250 V


                    500 V




                    e. Wandcontactdozen voor de voeding van handgereedschappen, die in ketels en tanks worden gebruikt


                    50 V1


                    50 V1


                    –




           Opmerking: 1 Indien deze spanning vanuit een net met hogere spanning wordt verkregen moet een galvanische
      scheiding (veiligheidstransformator) worden toegepast. 2 De secundaire stroomkring moet geheel van aarde zijn
      geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.06
  - number: 9.06.2
    text: 'Met inachtneming van de noodzakelijke veiligheidsmaatregelen zijn hogere spanningen toegestaan:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.06
  - number: 9.06.2.a
    text: voor krachtinstallaties waarvan het vermogen zulks vereist;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.06
  - number: 9.06.2.b
    text: voor speciale inrichtingen, zoals radio-installaties en ontstekingsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.06
  - number: 9.07.1
    text: 'Voor gelijkstroom en 1-fase wisselstroom zijn de volgende verdeelsystemen toegestaan:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.1.a
    text: twee geleiders waarvan één is geaard (L1/N/PE);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.1.b
    text: |-
      één geleider met terugleiding naar de scheepsromp, alleen voor plaatselijk begrensde installaties, zoals
      startinstallaties van een verbrandingsmotor en kathodische corrosiebescherming (L1/PEN);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.1.c
    text: twee geleiders geïsoleerd van de scheepsromp (L1/L2/PE).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.2
    text: 'Voor draaistroom (3-fasen wisselstroom) zijn de volgende verdeelsystemen toegestaan:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.2.a
    text: vier geleiders met geaard sterpunt zonder terugleiding via de scheepsromp (L1/L2/L3/N/PE) = (TN-S-Net) of (TT-Net);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.2.b
    text: drie geleiders geïsoleerd van de scheepsromp (L1/L2/L3/PE) = (IT-Net);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.2.c
    text: |-
      drie geleiders met geaard sterpunt en terugleiding via de scheepsromp, echter niet voor eindstroomkringen (L1/L2/
      L3/PEN).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.07.3
    text: Toepassing van andere systemen kan door de Commissie van Deskundigen worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.07
  - number: 9.08.1
    text: |-
      Voedingskabels van het walnet en andere externe netten naar het boordnet moeten aan boord door middel van vast
      aangebrachte klemmen of door een vast aangebrachte stekkerinrichting kunnen worden aangesloten. Kabelverbindingen
      mogen niet op trek worden belast.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.2
    text: |-
      De scheepsromp moet bij een aansluitspanning van meer dan 50 V doelmatig kunnen worden geaard. Aardaansluitingen
      moeten duidelijk gekenmerkt zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.3
    text: |-
      Schakelinrichtingen van de aansluitingen moeten zodanig zijn ingericht dat parallelbedrijf van de
      boordnetgeneratoren met het walnet of andere externe netten wordt vermeden. Een kortstondig parallelbedrijf ten
      behoeve van omschakelen zonder spanningsonderbreking van de systemen is toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.4
    text: De aansluiting moet tegen kortsluiting en overbelasting zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.5
    text: Op het hoofdschakelbord moet zijn aangegeven of de aansluiting onder spanning staat.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.6
    text: |-
      Teneinde bij gelijkspanning de polariteit en bij draaistroom de fasevolgorde van het walnet of van andere externe
      netten met die van het boordnet te kunnen vergelijken, moet een aanwijsinrichting zijn geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.7
    text: 'Bij de aansluiting moet met een opschrift zijn aangegeven:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.7.a
    text: de te treffen maatregelen voor het tot stand brengen van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.08.7.b
    text: de stroomsoort, de nominale spanning en, bij wisselstroom, bovendien de frequentie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.08
  - number: 9.09.1
    text: |-
      Indien aan andere vaartuigen stroom wordt geleverd, moet daarvoor een afzonderlijke aansluitinrichting aanwezig
      zijn. Indien contactstekkerinrichtingen worden gebruikt die geschikt zijn voor een nominale stroom van meer dan
      16 A, moet zijn gewaarborgd dat het aansluiten of het verbreken van de aansluiting alleen in stroomloze toestand
      kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.09
  - number: 9.09.2
    text: Kabelverbindingen mogen niet op spanning worden belast.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.09
  - number: 9.09.3
    text: Artikel 9.08, derde tot en met zevende lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.09
  - number: 9.10.1
    text: |-
      Generatoren, motoren en hun aansluitkasten moeten voor inspecties, metingen en reparaties toegankelijk
      zijn. De beschermingsgraad moet in overeenstemming zijn met de plaats van opstelling zoals aangegeven in
      [artikel 9.03][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel9
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.10.2
    text: |-
      Generatoren, die worden aangedreven door de hoofdmotor, de schroef-as of een voor andere doeleinden bestemd
      hulpaggregaat, moeten voor de onder bedrijfsomstandigheden optredende toerentalvariaties geschikt zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.10
  - number: 9.11.1
    text: |-
      Accumulatoren moeten zodanig zijn opgesteld, dat zij toegankelijk zijn en niet kunnen verschuiven tengevolge van
      de scheepsbewegingen. Zij mogen niet zijn opgesteld op plaatsen waar zij aan overmatige hitte, extreme koude,
      sproeiwater of dampen zijn blootgesteld. Zij mogen niet zijn opgesteld in stuurhuizen, verblijven en laadruimen.
      Dit geldt echter niet voor voor accumulatoren in draagbare apparatuur alsmede voor accumulatoren die worden geladen
      met een vermogen van minder dan 0,2 kW.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
  - number: 9.11.2
    text: |-
      Accumulatoren die worden geladen met een een vermogen van meer dan 2,0 kW (berekend uit de maximale laadstroom
      en de nominale spanning van de batterij, met inachtname van de laadkarakteristiek van de laadinrichting), moeten
      in een speciale ruimte zijn ondergebracht. Bij opstelling aan dek is het voldoende indien zij in een kast zijn
      geplaatst. Accumulatoren die worden geladen met een vermogen tot 2,0 kW of minder mogen ook benedendeks in een
      kast of kist zijn opgesteld. Zij mogen ook open in de machinekamer of een andere goed geventileerde ruimte zijn
      geplaatst, mits zij zijn beschermd tegen vallende voorwerpen en druipwater.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
  - number: 9.11.3
    text: |-
      De binnenzijde van alle voor accumulatoren bestemde ruimten, kasten of kisten, alsmede rekken en andere onderdelen,
      moeten tegen de schadelijke inwerking van electrolyt zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
  - number: 9.11.4
    text: |-
      Gesloten ruimten, kasten of kisten, waarin accumulatoren zijn opgesteld, moeten doelmatig kunnen worden
      geventileerd. Een mechanische ventilatie moet zijn aangebracht indien het laadvermogen groter is dan 2 kW voor
      nikkel-cadmium accumulatoren en groter is dan 3 kW voor lood accumulatoren. De luchttoevoer aan de onderzijde
      en de luchtafvoer aan de bovenzijde moeten zodanig zijn dat een goede afvoer van de gassen is gewaarborgd. De
      ventilatiekanalen mogen geen inrichtingen zoals afsluitinrichtingen bevatten die de vrije doorgang van de lucht
      belemmeren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
  - number: 9.11.5
    text: |-
      De vereiste hoeveelheid lucht Q in m3 per uur moet worden berekend volgens de formule: Q = 0,11 · l · n [m3/
      u]. Daarbij betekent: l = 25% van de maximale stroom van de laadinrichting in A; n = het aantal cellen. Voor
      accumulatoren die in een bufferschakeling met het boordnet zijn opgenomen kan door de Commissie van Deskundigen
      op grond van de laadkarakteristiek van de laadinrichting een andere berekeningsmethode voor de benodigde
      luchthoeveelheid worden toegelaten voor zover deze berust op voorschriften van een erkend classificatiebureau of
      daartoe in aanmerking komende normen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
  - number: 9.11.6
    text: |-
      Bij natuurlijke ventilatie moet de doorsnede van de ventilatiekanalen zo groot zijn dat bij een luchtsnelheid van
      0,5 m/s de vereiste luchthoeveelheid wordt opgebracht. De doorsnede moet echter voor lood accumulatoren tenminste
      80 cm2 en voor nikkel-cadmium accumulatoren ten minste 120 cm2 bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
  - number: 9.11.7
    text: |-
      Bij mechanische ventilatie moet, bij voorkeur, een afzuigventilator worden gebruikt waarvan de motor niet in de
      gas- of luchtstroom mag zijn geplaatst. Deze ventilator moet zodanig zijn uitgevoerd dat geen vonkvorming bij
      aanraking van een waaier met het ventilatorhuis en geen elektrostatische oplading kunnen optreden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
  - number: 9.11.8
    text: |-
      Op de deuren of deksels van ruimten, kasten of kisten voor accumulatoren moet een teken ‘vuur, open licht en roken
      verboden’ met een diameter van ten minste 10 cm, overeenkomstig [schets 2 van bijlage I][ref1], zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.11
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 9.12.1
    text: 'Schakelborden:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.1.a
    text: |-
      Apparaten, schakelaars, veiligheden en instrumenten in schakelborden moeten overzichtelijk zijn gerangschikt en ten
      behoeve van onderhoud en reparatie toegankelijk zijn. Aansluitklemmen voor spanningen tot en met 50 V en die voor
      spanningen boven 50 V moeten van elkaar gescheiden zijn aangebracht en doelmatig zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.1.b
    text: |-
      Op de schakelborden moeten naamplaatjes voor alle schakelaars en apparaten met de aanduiding van de stroomkring
      zijn aangebracht. Veiligheden moeten met de nominale stroomsterkte en de stroomkring zijn aangeduid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.1.c
    text: |-
      Indien zich achter de deuren apparaten met een bedrijfsspanning van meer dan 50 V bevinden, moeten de onder
      spanning staande delen van deze apparaten tegen onvoorzien aanraken bij geopende deuren zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.1.d
    text: |-
      Materialen van schakelborden moeten mechanisch sterk, duurzaam, moeilijk ontvlambaar, zelf dovend en niet
      hygroscopisch zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.1.e
    text: |-
      Zijn in schakelkasten kortsluitveiligheden van het type ‘mespatroon’ ingebouwd dan moeten in de nabijheid van deze
      schakelkasten hulpmiddelen en middelen voor de bescherming van personen aanwezig zijn om deze te kunnen vervangen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.2
    text: 'Schakelaars, beveiligingen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.2.a
    text: |-
      Generator- en afgaande groepen moeten in elke niet geaarde geleider tegen kortsluiting en overbelasting
      beveiligd zijn. Daartoe kunnen schakelaars met kortsluit- en maximaalschakelaars of smeltveiligheden worden
      gebruikt. Stroomkringen van de elektrische aandrijving van stuurinrichtingen, alsmede de stuurstroomkringen
      van stuurinrichtingen, mogen alleen tegen kortsluiting zijn beveiligd. Indien schakelaars met een thermische
      uitschakelinrichting worden toegepast, moeten de thermische uitschakelinrichtingen buiten bedrijf zijn gesteld of
      op ten minste tweemaal de nominale stroom zijn afgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.2.b
    text: |-
      De afgaande groepen van het hoofdschakelbord van meer dan 16 A moeten van last- of maximaalschakelaars zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.2.c
    text: |-
      Verbruikers die voor de voortstuwing, de stuurinrichting, de roerstandaanwijzer, de navigatie en de
      beveiligingssystemen noodzakelijk zijn, alsmede de verbruikers met een nominale stroom van meer dan 16 A, moeten
      via afzonderlijke stroomkringen worden gevoed.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.2.d
    text: |-
      Stroomkringen van verbruikers die voor de voortstuwing en het manoeuvreren noodzakelijk zijn, moeten direct van het
      hoofdschakelbord worden gevoed.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.2.e
    text: |-
      Schakelinrichtingen moeten volgens hun nominale stroom, hun thermische en dynamische sterkte alsmede hun
      schakelvermogen worden gekozen. Schakelaars moeten alle onder spanning staande geleiders gelijktijdig schakelen. De
      stand moet duidelijk te onderscheiden zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.2.f
    text: |-
      Smeltveiligheden moeten van het gesloten type zijn en uit keramisch of gelijkwaardig materiaal bestaan. Zij moeten
      zonder aanrakingsgevaar voor personen kunnen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.3
    text: 'Meet- en controle-inrichtingen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.3.a
    text: |-
      Voor generator-, accumulator- en verdeelstroomkringen moeten meet- en controle-inrichtingen aanwezig zijn, voor
      zover dit voor een veilig bedrijf van de installatie noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.3.b
    text: |-
      Niet geaarde netten met een spanning boven 50 V moeten van een doelmatige aardfoutbewakingsinrichting met zowel een
      optisch als een akoestisch alarmsignaal zijn voorzien. Voor secundaire inrichtingen, zoals stuurstroomschakelingen,
      kan hiervan worden afgezien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.4
    text: 'Opstelling van schakelborden:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.4.a
    text: |-
      Schakelborden moeten in goed toegankelijke en goed geventileerde ruimten zijn opgesteld, zodanig dat zij tegen
      waterschade en mechanische beschadigingen zijn beschermd. Pijpleidingen en ventilatiekokers moeten zodanig zijn
      geplaatst, dat schakelborden bij lekkages geen gevaar lopen. Indien de ligging in de nabijheid van schakelborden
      niet vermeden kan worden, mogen de pijpen aldaar geen losneembare koppelingen hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.4.b
    text: |-
      Kasten en nissen waarin open schakelinrichtingen zijn ondergebracht, moeten uit moeilijk ontvlambaar materiaal
      bestaan, dan wel door een bekleding van metaal of een ander niet brandbaar materiaal zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: 9.12.4.c
    text: |-
      Bij spanningen boven 50 V moeten aan de bedieningszijde van het hoofdschakelbord isolerende roosters of matten
      liggen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.12
  - number: '9.13'
    text: |-
      Voor oliebranderinstallaties, brandstofpompen, brandstofseparatoren en machinekamerventilatoren moeten buiten de
      opstellingsruimten noodstopschakelaars op een centrale plaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.13
  - number: 9.14.1
    text: Kabelinvoeren van apparaten moeten passend zijn voor de afmetingen en het type van de aan te sluiten kabels.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.14
  - number: 9.14.2
    text: |-
      Wandcontactdozen van verdeelsystemen met van elkaar afwijkende spanningen of frequenties moeten van verschillende
      uitvoering zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.14
  - number: 9.14.3
    text: |-
      Schakelaars moeten alle niet geaarde geleiders van een stroomkring gelijktijdig schakelen. Bij niet geaarde
      netten zijn in stroomkringen van de verlichting voor verblijven, uitgezonderd was-, bad- en overige natte ruimten,
      eenpolige schakelaars toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.14
  - number: 9.14.4
    text: |-
      Bij stroomsterkten van meer dan 16 A moeten de wandcontactdozen zodanig met een schakelaar worden vergrendeld, dat
      noch het insteken, noch het uittrekken van de stekker mogelijk is wanneer de contactbussen van de contactdoos onder
      spanning staan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.14
  - number: 9.15.1
    text: |-
      Kabels moeten moeilijk ontvlambaar, zelfdovend en bestendig tegen water en olie zijn. In de verblijven kan de
      toepassing van andere kabeltypen worden toegestaan, mits deze kabels doelmatig zijn beschermd, moeilijk ontvlambaar
      en zelfdovend zijn. Als testprocedure voor het vaststellen van het moeilijk ontvlambaar zijn van elektrische kabels
      worden erkend:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.1.a
    text: 'de internationale normen IEC 60332-1 : 1993, IEC 60332-3 : 2000, en'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.1.b
    text: gelijkwaardige voorschriften van één der Rijnoeverstaten of België.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.2
    text: Voor kracht- en verlichtingsinstallaties moeten de aders van de kabels een doorsnede van tenminste 1,5 mm2 hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.3
    text: Metalen bewapeningen en mantels van kabels mogen voor het normale bedrijf niet als geleider of aardleiding dienen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.4
    text: |-
      Metalen bewapeningen en mantels van kabels van kracht- en verlichtingsinstallaties moeten tenminste aan één der
      einden zijn geaard.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.5
    text: |-
      De doorsnede van de geleiders moet in overeenstemming zijn met de ten hoogste toegestane geleidertemperatuur
      (stroombelastbaarheid) alsmede met het toelaatbare spanningsverlies. Dit spanningsverlies, optredend tussen het
      hoofdschakelbord en het meest ongunstige punt van de installatie, mag bij verlichtingsinstallaties niet meer dan 5%
      en voor kracht- en verwarmingsinstallaties niet meer dan 7% van de nominale spanning bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.6
    text: Kabels moeten tegen het gevaar van mechanische beschadigingen zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.7
    text: |-
      De bevestiging der kabels moet zodanig zijn, dat eventuele belastingen op trek binnen de toelaatbare grenzen
      blijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.8
    text: |-
      De doorvoeringen van kabels door schotten of dekken mogen de sterkte, dichtheid en brandwerende eigenschappen van
      de schotten of de dekken niet nadelig beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.9
    text: |-
      De uiteinden en verbindingen van alle leidingen moeten zo zijn vervaardigd dat de oorspronkelijke elektrische,
      mechanische, brandwerende en desvereist brandbestendige eigenschappen van de kabel gehandhaafd blijven. Het aantal
      kabelverbindingen moet tot een minimum worden beperkt
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.15.10
    text: |-
      Kabels die naar beweegbare stuurhuizen worden gevoerd moeten voldoende buigzaam zijn en van een isolatie zijn
      voorzien die voldoende buigzaam blijft tot een temperatuur van –20 °C, alsmede bestand zijn tegen de inwerking van
      dampen, ultraviolette straling, ozon en dergelijke.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.15
  - number: 9.16.1
    text: |-
      Verlichtingsarmaturen moeten zodanig zijn aangebracht, dat brandbare voorwerpen of constructiedelen niet door de
      uitgestraalde warmte in brand kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.16
  - number: 9.16.2
    text: |-
      De verlichtingsarmaturen op het open dek moeten zodanig zijn geplaatst, dat de waarneembaarheid van de
      navigatieverlichting niet nadelig wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.16
  - number: 9.16.3
    text: |-
      Indien in een machinekamer of een ketelruim twee of meer lichtpunten zijn aangebracht, moeten deze over ten minste
      twee stroomkringen zijn verdeeld. Dit geldt eveneens voor ruimten waarin koelmachines, hydraulische inrichtingen of
      elektromotoren zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.16
  - number: 9.17.1
    text: |-
      Schakelborden voor navigatielantaarns moeten in het stuurhuis zijn geïnstalleerd. Zij moeten door een aparte kabel
      vanaf het hoofdschakelbord worden gevoed of door twee van elkaar onafhankelijke onderverdelingen kunnen worden
      verzorgd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.17
  - number: 9.17.2
    text: |-
      Elke navigatielantaarn moet vanaf het navigatieschakelbord afzonderlijk gevoed, beveiligd en geschakeld kunnen
      worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.17
  - number: 9.17.3
    text: |-
      Het uitvallen van de controle-inrichtingen als bedoeld in [artikel 7.05, tweede lid][ref1], mag de werking van de
      bijbehorende navigatielantaarns niet nadelig beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel7
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.17
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '7'
        hoofdstuk: '7'
  - number: 9.17.4
    text: |-
      Dicht bijeen geplaatste, bij elkaar behorende navigatielantaarns mogen gemeenschappelijk worden gevoed, beveiligd
      en geschakeld. De controle-inrichting moet dan echter het uitvallen van één der lantaarns kunnen signaleren. Twee
      in één armatuur boven elkaar geplaatste navigatielantaarns mogen niet gelijktijdig ingeschakeld kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.17
  - number: '9.18'
    text: '[Vervallen per 01-01-2006]'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.18
  - number: '9.19'
    text: |-
      Alarm- en beveiligingssystemen voor controle en beveiliging van werktuigbouwkundige inrichtingen moeten aan de
      volgende voorwaarden voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.19
  - number: 9.19.a
    text: |-
      Alarmsystemen: Alarmsystemen moeten zodanig worden uitgevoerd, dat fouten in het alarmsysteem niet tot uitval
      van het te controleren werktuig of de te controleren installatie kunnen leiden. Binaire gevers moeten volgens het
      ruststroomprincipe of als bewaakt arbeidsstroomprincipe zijn uitgevoerd. Optische alarmsignalen moeten zichtbaar
      blijven totdat de desbetreffende storing is opgeheven. Een geaccepteerd alarmsignaal moet onderscheiden kunnen
      worden van een niet geaccepteerd alarmsignaal. Elk alarmsignaal moet ook akoestisch worden gemeld. Akoestische
      alarmsignalen moeten kunnen worden uitgeschakeld. Door het uitschakelen van een akoestisch alarmsignaal mag het
      inwerkingtreden van een door nieuwe oorzaken geactiveerd alarmsignaal niet worden verhinderd. Bij alarminstallaties
      met minder dan 5 meetpunten kan hiervan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.19
  - number: 9.19.b
    text: |-
      Beveiligingssystemen: Beveiligingssystemen moeten zodanig worden uitgevoerd, dat zij voor het bereiken van kritieke
      bedrijfstoestanden de bedreigde installatie uitschakelen, reduceren of op een permanent bezette post daartoe
      oproepen. Binaire gevers moeten volgens het arbeidsstroomprincipe zijn uitgevoerd. Indien beveiligingssystemen
      niet van een eigen controlesysteem zijn voorzien, moet het funktioneren van deze systemen kunnen worden getest.
      Beveiligingssystemen moeten onafhankelijk van andere systemen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.19
  - number: 9.20.1
    text: |-
      Algemeen De in het tweede lid gestelde testvoorwaarden zijn uitsluitend van toepassing op elektronische apparaten
      die voor stuurinrichtingen en machine-installaties voor de voortbeweging van het vaartuig, met inbegrip van de
      daarbij behorende randapparatuur, benodigd zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2
    text: Testvoorwaarden
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2.a
    text: |-
      De volgende testbelastingen mogen niet leiden tot schade aan of verkeerd functioneren van elektronische apparaten.
      De tests overeenkomstig de desbetreffende internationale normen (zoals IEC publicatie 60092-504: 2001) moeten,
      met uitzondering van de koudetest, met een ingeschakeld apparaat worden uitgevoerd, waarbij de functie moet worden
      getest.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2.b
    text: |-
      Spannings- en frequentieafwijkingen:










                        Afwijkingen





                        eenheid


                        blijvend


                        kortstondig






                        Algemeen


                        frequentie


                        ± 5%


                        ± 10% 5 s





                        spanning


                        ± 10%


                        ± 20% 1,5 s




                        Accumulatorwerking


                        spanning


                        + 30%/– 25%
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2.c
    text: |-
      Warmtetest: Het te testen apparaat wordt binnen een half uur tot op 55 °C opgewarmd en wordt na het bereiken van
      deze temperatuur gedurende 16 uren op deze temperatuur gehouden. Aansluitend wordt een functietest uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2.d
    text: |-
      Koudetest: Het te testen apparaat wordt in uitgeschakelde toestand tot op –25 °C afgekoeld en gedurende twee uren
      op deze temperatuur gehouden. Aansluitend wordt de temperatuur tot op 0 °C verhoogd en een functietest uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2.e
    text: |-
      Trillingstest: Trillingstests moeten bij de resonantiefrequentie van het apparaat of het onderdeel in de drie
      richtingsassen voor de duur van telkens 90 minuten worden uitgevoerd. Indien geen bijzondere resonantie wordt
      geconstateerd, vindt de trillingstest plaats bij 30 Hz. De trillingstest wordt uitgevoerd met een sinusvormige
      slingering tussen de volgende grenzen: Algemeen: f = 2,0 tot 13,2 Hz; a = ± 1 mm (amplitude a = ½ slingerbreedte)
      f = 13,2 Hz tot 100 Hz: versnelling ± 0,7 g. Apparaten voor montage op dieselmotoren of stuurmachines moeten
      als volgt worden getest: f = 2,0 tot 25 Hz; a = ± 1,6 mm (amplitude a = ½ slingerbreedte) f = 25 Hz tot 100 Hz;
      versnelling ± 4 g. Voelers voor montage in uitlaatgassenleidingen van dieselmotoren kunnen worden blootgesteld aan
      beduidend hogere belastingen. Hiermee moet bij de tests rekening worden gehouden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2.f
    text: |-
      Tests van de elektromagnetische verdraagbaarheid moeten op basis van IEC publicatie 61000-4-2: 1995, 61000-4-3:
      2002, 61000-4-4: 1995, met het testniveau 3 worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: 9.20.2.g
    text: |-
      Het bewijs dat de apparaten voldoen aan deze testvoorwaarden, moet door de fabrikant worden geleverd. Als bewijs
      geldt ook een verklaring van een erkend classificatiebureau.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.20
  - number: '9.21'
    text: |-
      Elektrische en elektronische installaties mogen niet door elektromagnetische verstoringen in hun functioneren
      worden gehinderd. Algemene maatregelen dienen betrekking te hebben op:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.21
  - number: 9.21.a
    text: de ontkoppeling van de overdrachtswegen tussen de storingsbron en het aan storing bloot staande apparaat;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.21
  - number: 9.21.b
    text: het onderdrukken van de stooroorzaken van de storingsbron;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.21
  - number: 9.21.c
    text: de vermindering van de stoorgevoeligheid van het aan storing blootstaande apparaat.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.21
  - number: 10.01.1
    text: |-
      Schepen die voor het vervoer van goederen zijn bestemd, met uitzondering van zeeschipbakken met een lengte L van
      ten hoogste 40 m, moeten zijn uitgerust met boegankers, waarvan de totale massa P wordt berekend met behulp van
      de volgende formule: *p = k · B · T [kg]*. In deze formule betekent: k: een coëfficiënt die rekening houdt met de
      verhouding tussen de lengte L en de breedte B en met het soort vaartuig: Voor duwbakken wordt k gelijkgesteld aan
      c; c: een ervaringscoëfficiënt overeenkomstig de volgende tabel:






                    Laadvermogen


                    Ervaringscoëfficiënt c






                    t/m 400 t


                    45




                    > 400 t/m 650 t


                    55




                    > 650 t/m 1000 t


                    65




                    > 1000 t


                    70




           De Commissie van Deskundigen kan toestaan dat op schepen met een laadvermogen van ten hoogste 400 ton, die
      vanwege hun constructie en bestemming slechts op bepaalde korte riviergedeelten worden ingezet, voor de boegankers
      slechts ⅔ van de totale massa P vereist is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.2
    text: |-
      Passagiersschepen en schepen die niet bestemd zijn voor goederenvervoer, met uitzondering van duwboten, moeten
      zijn uitgerust met boegankers waarvan de totale massa P volgens de volgende formule wordt berekend: *p = k · B ·
      T [kg]*. Voor passagiersschepen die zijn bestemd om benedenstrooms van km 855 (Emmerich) te varen wordt de totale
      massa P echter berekend volgens de formule: *p = k · B · T + 4Af[kg]*. In deze formules betekent: k: de coëfficiënt
      als bedoeld in het eerste lid; bij het vaststellen van de ervaringscoëfficiënt c moet evenwel de in het certificaat
      van onderzoek vermelde waterverplaatsing in m3 in plaats van het laadvermogen in aanmerking worden genomen; Af: het
      frontale windvangend oppervlak in m2.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.3
    text: |-
      Schepen als bedoeld in het eerste lid, waarvan de grootste lengte L niet meer dan 86 m bedraagt, moeten zijn
      uitgerust met hekankers waarvan de totale massa 25% bedraagt van de massa P. Schepen waarvan de grootste lengte L
      meer dan 86 m bedraagt moeten echter zijn uitgerust met hekankers waarvan de totale massa 50% bedraagt van de massa
      P als bedoeld in het eerste of het tweede lid. Geen hekankers behoeven te hebben:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.3.a
    text: |-
      schepen waarvoor de totale massa van de hekankers minder dan 150 kg zou bedragen; voor schepen als bedoeld in het
      eerste lid, laatste alinea, moet daarbij worden uitgegaan van de gereduceerde massa van het boeganker;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.3.b
    text: duwbakken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.4
    text: |-
      Schepen die zijn bestemd voor het voortbewegen van hechte samenstellen met een lengte L van niet meer dan 86 m
      moeten zijn uitgerust met hekankers waarvan de totale massa 25% bedraagt van de grootste massa P die overeenkomstig
      het eerste lid wordt berekend voor de in het certificaat van onderzoek toegestane samenstellingen (als nautische
      eenheid beschouwd). Schepen die zijn bestemd voor het voortbewegen in afvaart van hechte samenstellen met een
      lengte L van meer dan 86 m moeten zijn uitgerust met hekankers waarvan de totale massa 50% bedraagt van de grootste
      massa P die overeenkomstig het eerste lid wordt berekend voor de in het certificaat van onderzoek toegestane
      samenstellingen (als nautische eenheid beschouwd).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.5
    text: |-
      De volgens het eerste tot en met het vierde lid berekende massa’s van de ankers mogen bij bepaalde bijzondere
      ankers worden verminderd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.6
    text: |-
      De voor boegankers voorgeschreven totale massa P kan worden verdeeld over één of twee ankers. De totale massa
      mag 15% minder zijn, indien het schip slechts met één boeganker is uitgerust en de ankerkluis zich op hart schip
      bevindt. De voor hekankers voorgeschreven totale massa P mag bij duwboten en schepen met een lengte L van meer
      dan 86 m worden verdeeld over één of twee ankers. De massa van het lichtste anker mag niet minder dan 45% van deze
      totale massa bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.7
    text: Gietijzeren ankers zijn niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.8
    text: Op ieder anker moet de massa duurzaam in letters en cijfers in reliëf zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.9
    text: Voor ankers met een massa van meer dan 50 kg zijn ankerlieren vereist.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.10
    text: 'Boegankerkettingen moeten ten minste de volgende lengte hebben:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.10.a
    text: 40 m voor schepen met een lengte L van 30 m of minder;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.10.b
    text: 10 m meer dan de lengte L van het schip, wanneer deze tussen 30 en 50 m ligt;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.10.c
    text: 60 m voor schepen met een lengte L van meer dan 50 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.11
    text: 'De minimumbreeksterkte R van een ankerketting wordt met behulp van de volgende formules berekend:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.11.a
    text: 'bij ankers met een massa tot en met 500 kg: R = 0,35 · P'' [kN];'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.11.b
    text: 'bij ankers met een massa van meer dan 500 t/m 2000 kg:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.11.c
    text: |-
      bij ankers met een massa van meer dan 2000 kg: R = 0,25 · P' [kN]. In deze formules betekent: P': de overeenkomstig
      het eerste tot en met het vierde lid en het zesde lid bepaalde theoretische massa van het betreffende anker. De
      breeksterkte van de ankerkettingen wordt bepaald aan de hand van de daarvoor in één der Oeverstaten of België
      geldende normen. Indien zwaardere ankers worden gekozen dan in het eerste tot en met het zesde lid beschreven,
      wordt de minimum breeksterkte van de ankerketting bepaald aan de hand van de gegeven grotere massa.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.12
    text: |-
      Indien zwaardere ankers worden gekozen dan in het eerste tot en met het zesde lid beschreven, wordt de minimum
      breeksterkte van de ankerketting bepaald aan de hand van de gegeven grotere massa. Indien dergelijke zwaardere
      ankers en de bijbehorende sterkere ankerkettingen aan boord zijn, moeten desondanks in het certificaat van
      onderzoek de massa’s en de minimum breeksterkte worden ingevuld die zijn voorgeschreven op grond van het eerste tot
      en met zesde lid en het elfde lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.13
    text: |-
      De verbindingsdelen (wartels) tussen het anker en de ketting moeten bestand zijn tegen een trekkracht die 20%
      groter is dan de breeksterkte van de dienovereenkomstige ketting.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.01.14
    text: |-
      Het gebruik van trossen of kabels in plaats van kettingen is toegestaan. Deze moeten dezelfde breeksterkte hebben
      die voor de kettingen is voorgeschreven, maar hun lengte moet 20% meer bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.01
  - number: 10.02.1
    text: |-
      De volgende in het [Rijnvaartpolitiereglement][ref1] bedoelde uitrustingsstukken moet ten minste aanwezig zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 10.02.1.a
    text: marifooninstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.1.b
    text: |-
      apparaten en installaties die nodig zijn voor het geven van de voorgeschreven licht- en geluidsseinen, alsmede voor
      het voeren en tonen van de optische tekens;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.1.c
    text: |-
      onafhankelijk van het aan boord aanwezige elektriciteitsnet werkende lichten ter vervanging van de voor het
      stilliggen voorgeschreven lichten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.1.d
    text: een brandbestendig verzamelreservoir met deksel voor oliehoudende poetslappen dat als zodanig is aangeduid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.1.e
    text: |-
      een apart brandbestendig verzamelreservoir voor het overig vast klein chemisch afval en een brandbestendig
      reservoir met deksel voor vloeibaar klein chemisch afval als bedoeld in het Rijnvaartpolitiereglement dat telkens
      als zodanig is aangeduid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.1.f
    text: een brandbestendig verzamelreservoir met deksel voor slops dat als zodanig is aangeduid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2
    text: 'Voorts moeten ten minste aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.a
    text: 'stalen trossen voor het meren:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.a._bis
    text: |-
      Ieder schip moet zijn uitgerust met 3 stalen trossen voor het meren. De minimum lengte daarvan moet bedragen: *
      1ste tros: L + 20 m, echter niet meer dan 100 m, * 2de tros: 2/3 van de eerste tros, * 3de tros: 1/3 van de eerste
      tros. Bij schepen met een lengte L van minder dan 20 m kan de kortste tros achterwege blijven. Deze trossen moeten
      berekend zijn op een minimum breeksterkte Rs die met behulp van de volgende formule wordt vastgesteld: * voor L × B
      × T tot 1000 m3: * voor L × B × T groter dan 1000 m3:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.b
    text: |-
      trossen voor het slepen: Sleepboten moeten zijn uitgerust met een bij hun functie passend aantal trossen. De
      hoofdtros moet echter ten minste 100 m lang zijn en een breeksterkte hebben in kN die overeenkomt met ten minste
      een derde van het totale vermogen in kW van de voortstuwingsmotor(en). Motorschepen en duwboten die mogen slepen
      moeten ten minste zijn uitgerust met een sleeptros van 100 m lengte, waarvan de breeksterkte in kN overeenkomt met
      ten minste een kwart van het totale vermogen in kW van de voortstuwingsmotor(en);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.c
    text: een werplijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.d
    text: |-
      een loopplank, ten minste 0,40 m breed en ten minste 4 m lang, waarvan de zijkanten door een lichte streep zijn
      gemarkeerd; deze loopplank moet van een leuning zijn voorzien. Voor kleine schepen kan de Commissie van Deskundigen
      kortere loopplanken toelaten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.e
    text: een bootshaak;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.f
    text: |-
      een geschikte verbandtrommel met een inhoud overeenkomstig een norm van één der Rijnoeverstaten of van België. De
      verbandtrommel moet in een verblijf of in het stuurhuis worden bewaard en zo zijn opgeborgen dat hij indien nodig
      gemakkelijk en zeker kan worden bereikt. Indien verbandtrommels aan het zicht zijn onttrokken moet de afdekking
      zijn gemarkeerd met een symbool voor verbandtrommels overeenkomstig [schets 8 van bijlage I][ref1] met een lengte
      van de zijde van tenminste 10 cm;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 10.02.2.g
    text: een verrekijker, 7 × 50 of een grotere lensdiameter;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.h
    text: een bord met aanwijzingen betreffende het redden en het bijbrengen van drenkelingen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.2.i
    text: een vanuit de stuurstand bedienbare schijnwerper.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.02.3
    text: |-
      Op schepen waarvan de hoogte van het boord boven de waterlijn bij ledig schip meer dan 1,50 m bedraagt moet een
      buitenboordtrap of -ladder aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.02
  - number: 10.03.1
    text: |-
      Op de volgende plaatsen moet telkens één draagbaar blustoestel overeenkomstig de Europese norm EN 3:1996, aanwezig
      zijn:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.1.a
    text: in het stuurhuis;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.1.b
    text: in de nabijheid van iedere toegang van het dek naar de verblijven;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.1.c
    text: |-
      in de nabijheid van iedere toegang tot niet van de verblijven uit toegankelijke bedrijfsruimten waarin zich
      verwarmings-, kook-, of koelinstallaties bevinden, die op vaste of vloeibare brandstoffen werken dan wel op
      vloeibaar gas;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.1.d
    text: bij iedere toegang tot machinekamers of ketelruimen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.1.e
    text: |-
      op een geschikte plaats benedendeks in de machinekamers, wanneer het motorvermogen in totaal meer dan 100 kW
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.2
    text: |-
      Als draagbare blustoestellen, voorgeschreven in het eerste lid, mogen slechts poederblussers worden gebruikt met
      een inhoud van ten minste 6 kg dan wel andere draagbare blustoestellen met eenzelfde bluscapaciteit. Zij moeten
      geschikt zijn voor de brandklassen A, B en C alsmede voor het blussen van branden in elektrische installaties tot
      1000 V.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.3
    text: |-
      Daarnaast mogen poederblussers, blussers met vloeibare inhoud of schuimblussers worden gebruikt indien deze
      ten minste geschikt zijn voor die brandklasse, welke in de ruimte waarvoor het toestel bestemd is het meest
      waarschijnlijk relevant is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.4
    text: |-
      Draagbare blustoestellen die als blusmiddel CO bevatten mogen slechts voor het blussen van branden in keukens en
      elektrische inrichtingen worden aangewend. De inhoud van deze blustoestellen mag niet meer bedragen dan 1 kg voor
      iedere 15 m3 van de ruimte waarin zij worden bewaard en gebruikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.5
    text: |-
      Draagbare blustoestellen moeten ten minste iedere twee jaar worden gekeurd. Hiervan moet een verklaring worden
      afgegeven, ondertekend door degene die de keuring heeft verricht, en waarin de datum van de keuring is aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
  - number: 10.03.6
    text: |-
      Wanneer draagbare blustoestellen door hun wijze van opstelling aan het gezicht zijn onttrokken moet de bedekking
      of afscherming zijn voorzien van een teken ‘brandblusapparaat’ met een lengte van de zijde van ten minste 10 cm,
      overeenkomstig [schets 3 van bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 10.03a.1
    text: |-
      In verblijven, stuurhuizen en passagiersruimten mogen, ter bescherming van deze ruimten, slechts geschikte,
      automatisch werkende sprinklerinstallaties als vast ingebouwde brandblusinstallaties worden geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.2
    text: Deze installaties mogen slechts door deskundige bedrijven worden ingebouwd of omgebouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.3
    text: Deze installaties moeten van staal of van gelijkwaardig niet brandbaar materiaal zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.4
    text: |-
      Deze installaties moeten over de oppervlakken van de grootste te beschermen ruimte ten minste een hoeveelheid water
      van 5 l/m2 per minuut kunnen sproeien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.5
    text: |-
      Installaties die een kleinere hoeveelheid water sproeien moeten beschikken over een typegoedkeuring op grond van
      de IMO-Resolutie A.800 (19) dan wel van een andere door de Centrale Commissie voor de Rijnvaart erkende norm. De
      typegoedkeuring wordt uitgevoerd door een erkend classificatiebureau of door een gemachtigde testinstelling. De
      gemachtigde testinstelling moet voldoen aan de Europese normen inzake de algemene eisen aan de kundigheid van test-
      en kalibreerlaboratoria (EN ISO/IEC 17025: 2000).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.6
    text: 'De installaties moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.6.a
    text: voor ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.6.b
    text: voor hernieuwde ingebruikstelling na in werking te zijn geweest;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.6.c
    text: na verandering of reparatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.6.d
    text: met regelmaat tenminste elke twee jaar,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.7
    text: |-
      Bij de keuring, bedoeld in het zesde lid, moet de deskundige controleren of de installaties aan de eisen van dit
      artikel voldoen. De keuring moet tenminste bestaan uit:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.7.a
    text: inspectie van de buitenkant van de installatie als geheel;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.7.b
    text: controle van de bedrijfszekerheid van de veiligheidssystemen en de sproeikoppen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.7.c
    text: controle van het systeem van druktanks en pompen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.8
    text: |-
      Betreffende de keuring moet een verklaring worden opgesteld die door de deskundige wordt ondertekend en waarin de
      datum van de keuring is vermeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03a.9
    text: Het aantal van de aanwezige installaties moet in het certificaat van onderzoek worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03a
  - number: 10.03b.1
    text: |-
      Blusmiddelen In machinekamers, ketelruimen en pompkamers mogen, ter bescherming van deze ruimten, in vast
      ingebouwde brandblusinstallaties de volgende blusmiddelen worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.1.a
    text: CO (koolstofdioxide);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.1.b
    text: HFC-227ea (heptafluorpropaan);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.1.c
    text: IG-541 (52% stikstof, 40% argon, 8% koolstofdioxide);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.1.d
    text: FK-5-1-12 (Dodecafluoro-2-methylpentane-3-on).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.2
    text: Ventilatie, luchtaanzuiging
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.2.a
    text: |-
      Verbrandingslucht voor de voor de vaart benodigde verbrandingsmotoren mag niet worden aangezogen uit door vast
      ingebouwde brandblusinstallaties te beschermen ruimten. Dit is niet van toepassing wanneer er twee van elkaar
      onafhankelijke, gasdicht gescheiden hoofdmachinekamers aanwezig zijn dan wel er naast de hoofdmachinekamer
      een boegbesturingsaandrijving in een aparte machinekamer beschikbaar is, waardoor ingeval van brand in de
      hoofdmachinekamer het voortbewegen op eigen kracht wordt verzekerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.2.b
    text: |-
      Een mechanische ventilatie van de te beschermen ruimte, indien aanwezig, moet bij het inwerking stellen van de
      brandblusinstallatie automatisch worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.2.c
    text: |-
      Er moeten middelen beschikbaar zijn waarmee alle openingen, waardoor lucht zou kunnen toetreden tot, dan wel gas
      zou kunnen ontsnappen uit de te beschermen ruimte, snel kunnen worden gesloten. De gesloten toestand moet duidelijk
      herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.2.d
    text: |-
      De lucht die via de overdrukventielen uit in de machinekamers geïnstalleerde persluchthouders stroomt moet naar
      buiten worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.2.e
    text: |-
      De bij het binnenstromen van het blusmiddel ontstane over- of onderdruk mag de essentiële onderdelen van de te
      beschermen ruimte niet vernielen. De compensatie van de druk moet zonder gevaar kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.2.f
    text: |-
      Beschermde ruimten moeten beschikken over een mogelijkheid om het blusmiddel en het brandgas af te zuigen. Indien
      afzuiginrichtingen aanwezig zijn, mogen deze tijdens het blussen niet kunnen worden ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.3
    text: |-
      Brandmeldinstallatie De te beschermen ruimte moet voorzien zijn van een doelmatige brandmeldinstallatie. De
      brandmelding moet in het stuurhuis, in de verblijven en in de te beschermen ruimte kunnen worden waargenomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.4
    text: Pijpleidingensysteem
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.4.a
    text: |-
      Het blusmiddel moet door een vast geïnstalleerd pijpleidingenstelsel naar de te beschermen ruimte worden toegevoerd
      en daarin worden verdeeld. In de te beschermen ruimte moeten de pijpleidingen en de daarbij behorende armaturen
      van staal zijn vervaardigd. Dit geldt niet voor de aansluitleidingen van de houders en de compensatoren indien
      de daarvoor gebruikte materialen met betrekking tot brand over gelijkwaardige eigenschappen beschikken. De
      pijpleidingen moeten zowel in- als uitwendig tegen corrosie beschermd zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.4.b
    text: |-
      De sproeikoppen moeten zodanig van afmeting zijn en zodanig zijn aangebracht dat het blusmiddel gelijkmatig wordt
      verdeeld. In het bijzonder moet het blusmiddel ook onder de vloerplaten werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5
    text: Inrichting voor het inwerking stellen
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.a
    text: Brandblusinstallaties die automatisch in werking worden gesteld zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.b
    text: |-
      De brandblusinstallatie moet vanaf een geschikte plaats buiten de te beschermen ruimte in werking kunnen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.c
    text: |-
      Inrichtingen voor het in werking stellen moeten zodanig zijn geïnstalleerd dat ze ook in geval van brand kunnen
      worden bediend en dat, in het geval van een beschadiging als gevolg van brand of explosie in de te beschermen
      ruimte, de daarvoor benodigde hoeveelheid blusmiddel nog kan worden toegevoerd. Niet mechanische inrichtingen voor
      het inwerking stellen moeten door twee verschillende van elkaar onafhankelijke energiebronnen worden gevoed. Deze
      energiebronnen moeten zich buiten de te beschermen ruimte bevinden. Leidingen voor de aansturing in de beschermde
      ruimte moeten zodanig zijn uitgevoerd, dat zij ingeval van brand tenminste gedurende 30 minuten kunnen blijven
      functioneren. Elektrische leidingen voldoen aan deze eis indien zij voldoen aan de norm IEC 60331-21, uitgave 1999.
      Wanneer inrichtingen voor het inwerking stellen door hun wijze van opstelling aan het gezicht zijn onttrokken moet
      de bedekking of afscherming zijn voorzien van een teken ‘brandblusinstallatie’ met een lengte van de zijde van ten
      minste 10 cm, overeenkomstig [schets 6 van bijlage I][ref1], alsmede van de volgende tekst in rode letters op witte
      ondergrond: ‘Feuerlöscheinrichtung Installation d’extinction Brandblusinstallatie’.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 10.03b.5.d
    text: |-
      Indien de brandblusinstallatie bedoeld is voor het beschermen van meerdere ruimten, moeten de inrichtingen voor het
      in werking stellen voor iedere ruimte gescheiden en duidelijk zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.e
    text: |-
      Bij iedere inrichting voor het in werking stellen moet een gebruiksaanwijzing in het Duits, het Frans en het
      Nederlands duidelijk zichtbaar en duurzaam uitgevoerd zijn aangebracht. Deze moet met name informatie bevatten
      inzake
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.e.aa
    text: het in werking stellen van de brandblusinstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.e.bb
    text: de noodzaak van de controle dat alle personen de te beschermen ruimte hebben verlaten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.e.cc
    text: |-
      de handelwijze van de bemanning bij het in werking stellen en bij het betreden van de te beschermen ruimte na het
      in werking stellen of blussen in het bijzonder uit oogpunt van mogelijk voorkomen van gevaarlijke substanties;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.e.dd
    text: de handelwijze van de bemanning in het geval van een storing in de brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.5.f
    text: |-
      De gebruiksaanwijzing moet er op wijzen dat vóór het inwerking stellen van de brandblusinstallatie de in de ruimte
      aanwezige verbrandingsmotoren die lucht aanzuigen uit de te beschermen ruimte buiten bedrijf moeten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.6
    text: Waarschuwingssysteem
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.6.a
    text: Vast ingebouwde brandblusinstallaties moeten zijn voorzien van een waarschuwingssysteem.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.6.b
    text: |-
      Het waarschuwingssysteem moet automatisch gaan werken bij de eerste handeling voor het in werking stellen van
      de brandblusinstallatie. Het waarschuwingssignaal moet gedurende een redelijke tijd vóór het vrijkomen van het
      blusmiddel klinken en mag niet kunnen worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.6.c
    text: |-
      De waarschuwingssignalen moeten in de te beschermen ruimten alsmede bij iedere toegang daartoe duidelijk
      zichtbaar zijn en ook onder de bedrijfsomstandigheden, waarbij aldaar het meeste geluid wordt geproduceerd,
      duidelijk hoorbaar zijn. Zij moeten in de te beschermen ruimte duidelijk van alle andere akoestische en optische
      waarschuwingssignalen te onderscheiden zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.6.d
    text: |-
      De akoestische waarschuwingssignalen moeten, ook wanneer de verbindingsdeuren gesloten zijn, onder de
      bedrijfsomstandigheden waarbij aldaar het meeste geluid wordt geproduceerd in de ernaast gelegen ruimten duidelijk
      hoorbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.6.e
    text: |-
      Indien het waarschuwingssysteem niet van een eigen controlesysteem terzake van kortsluiting, draadbreuk en
      spanningsvermindering is voorzien, moet het functioneren ervan kunnen worden getest.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.6.f
    text: |-
      Bij iedere ingang van een ruimte, die met blusmiddel kan worden gevuld, moet duidelijk zichtbaar een bord zijn
      aangebracht met daarop in rode letters op witte ondergrond de volgende tekst: ‘Vorsicht, Feuerlöscheinrichtung! Bei
      Ertönen des Warnsignals (Beschreibung des Signals) den Raum sofort verlassen! Attention, installation d’extinction
      d’incendie! Quitter immédiatement ce local au signal (description du signal)! Let op, brandblusinstallatie! Bij het
      in werking treden van het alarmsignaal (omschrijving van het signaal) deze ruimte onmiddellijk verlaten!’.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.7
    text: Drukhouders, armaturen en persleidingen
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.7.a
    text: |-
      Drukhouders, armaturen en persleidingen moeten voldoen aan de in één der Rijnoeverstaten of België gelden
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.7.b
    text: Drukhouders moeten volgens de indicaties van de fabrikant zijn geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.7.c
    text: Drukhouders, armaturen en persleidingen mogen niet in verblijven geïnstalleerd zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.7.d
    text: De temperatuur in de kasten of ruimten waarin drukhouders zijn opgesteld mag niet meer bedragen dan 50 °C.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.7.e
    text: |-
      Kasten of ruimten aan dek moeten vast aan het dek bevestigd zijn en voorzien zijn van ventilatieopeningen, die zo
      zijn aangebracht dat, in geval de drukhouders niet dicht zijn, geen ontsnappend gas in het binnenste van het schip
      kan doordringen. Directe verbindingen met andere ruimten zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.8
    text: |-
      Hoeveelheid van het blusmiddel Indien de hoeveelheid blusmiddel bedoeld is voor het beschermen van meer dan één
      ruimte, behoeft de totale hoeveelheid van het beschikbare blusmiddel niet meer te zijn dan de hoeveelheid die nodig
      is voor de grootste te beschermen ruimte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9
    text: Installatie, controle en documentatie
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.a
    text: |-
      De installatie mag slechts worden geïnstalleerd of omgebouwd door een bedrijf dat deskundig is op het gebied van
      brandblusinstallaties. De documentatie (folders met gegevens van het product en met de veiligheidsgegevens) van de
      fabrikant van het blusmiddel en de fabrikant van de installatie moeten in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.b
    text: 'De installatie moet:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.b.aa
    text: voor ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.b.bb
    text: voor hernieuwde ingebruikstelling na in werking te zijn geweest;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.b.cc
    text: na verandering of reparatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.b.dd
    text: met regelmaat tenminste elke twee jaar,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.c
    text: Bij de keuring moet de deskundige controleren of de installatie aan de eisen van dit hoofdstuk voldoet.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d
    text: 'De keuring moet tenminste betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d.aa
    text: uitwendige inspectie van de installatie als geheel,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d.bb
    text: test van de pijpleidingen op hun dichtheid,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d.cc
    text: controle van de bedrijfszekerheid van de bedieningssystemen en de systemen voor het in werking stellen,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d.dd
    text: controle van de druk in de houders alsmede de inhoud daarvan,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d.ee
    text: controle van de dichtheid en van de afsluitinrichtingen van de te beschermen ruimte,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d.ff
    text: test van het brandmeldingssysteem, alsmede
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.d.gg
    text: test van het waarschuwingssysteem.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.e
    text: |-
      Inzake de keuring moet een door de deskundige ondertekende verklaring worden opgesteld waaruit de datum van de
      keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.9.f
    text: |-
      Het aantal aanwezige vast ingebouwde brandblusinstallaties moet in het certificaat van onderzoek worden
      aangetekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.10
    text: |-
      Brandblusinstallaties met CO Brandblusinstallaties die met CO als blusmiddel werken moeten, behalve aan de eisen,
      bedoeld in het eerste tot en met negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.10.a
    text: |-
      CO-houders moeten buiten de te beschermen ruimte in een van de overige ruimten gasdicht gescheiden ruimte of
      kast zijn ondergebracht. De deuren van de ruimten waar ze opgesteld zijn of van de kasten moeten naar buiten
      openen, afsluitbaar zijn en aan de buitenkant zijn voorzien van een teken ‘Waarschuwing voor algemeen gevaar’
      overeenkomstig [schets 4 van bijlage I][ref1] met een hoogte van tenminste 5 cm alsmede van het bijkomend opschrift
      ‘CO’ in dezelfde kleur en met dezelfde hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 10.03b.10.b
    text: |-
      De benedendekse ruimten waar CO-houders zijn opgesteld mogen slechts van buitenaf toegankelijk zijn. Deze ruimten
      moeten over een eigen, van de andere ventilatiesystemen aan boord volledig gescheiden, voldoende kunstmatige
      ventilatie met afzuigkanalen beschikken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.10.c
    text: |-
      De vulgraad van met CO gevulde houders mag niet meer zijn dan 0,75 kg/l. Voor het volume van het uitgestroomde CO-
      gas moet worden uitgegaan van 0,56 m3/kg.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.10.d
    text: |-
      De hoeveelheid CO-gas benodigd voor het beschermen van een ruimte moet ten minste 40% van de bruto inhoud van die
      ruimte bedragen. Deze hoeveelheid moet binnen 120 seconden kunnen worden toegevoerd. Het moet controleerbaar zijn
      of het gas is toegevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.10.e
    text: |-
      Het openen van de ventielen van de houders en het bedienen van het ventiel waardoor het gas uitstroomt moet door
      gescheiden handelingen geschieden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.10.f
    text: |-
      De redelijke tijd, bedoeld in het zesde lid, onder b, moet tenminste 20 seconden bedragen. De vertraging tot aan
      het vrijkomen van het CO-gas moet zijn gegarandeerd door een betrouwbare inrichting.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11
    text: |-
      Brandblusinstallaties met HFC-227ea Brandblusinstallaties die werken met HFC-227ea als blusmiddel moeten, behalve
      aan de eisen, bedoeld in het eerste tot en met negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.a
    text: |-
      Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.b
    text: |-
      Iedere houder die HFC-227ea bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukbeveiliging. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.c
    text: Iedere houder moet zijn uitgerust met een inrichting waardoor de gasdruk kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.d
    text: |-
      De vulgraad van de houders mag niet meer zijn dan 1,15 kg/l. Voor het volume van het uitgestroomde HFC-227ea moet
      worden uitgegaan van 0,1374 m3/kg.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.e
    text: |-
      De hoeveelheid HFC-227ea voor de te beschermen ruimte moet tenminste 8% van het bruto volume van die ruimte
      bedragen. Deze hoeveelheid moet binnen 10 seconden toegevoerd zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.f
    text: |-
      De houders van HFC-227ea moeten voorzien zijn van een controlesysteem van de druk dat bij een ontoelaatbaar verlies
      van drijfgas een akoestisch en optisch alarmsignaal in het stuurhuis in werking stelt. Wanneer er geen sprake is
      van een stuurhuis moet het alarmsignaal buiten de te beschermen ruimte in werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.g
    text: Na het uitstromen van het blusmiddel mag de concentratie in de te beschermen ruimte niet groter zijn dan 10,5%.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.11.h
    text: De brandblusinstallatie mag geen enkel onderdeel uit aluminium bevatten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.12
    text: |-
      Brandblusinstallaties met IG-541 Brandblusinstallaties die werken met IG-541 als blusmiddel moeten, behalve aan de
      eisen, bedoeld in het eerste tot en met negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.12.a
    text: |-
      Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.12.b
    text: |-
      Iedere houder die IG-541 bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukbeveiliging. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.12.c
    text: Iedere houder moet zijn uitgerust met een inrichting waarmee de gasdruk kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.12.d
    text: De druk waaronder de houders zijn gevuld mag bij +15 °C niet meer bedragen dan 200 bar.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.12.e
    text: |-
      De hoeveelheid IG-541 voor de te beschermen ruimte moet tenminste 44% en niet meer dan 50% van het bruto volume van
      die ruimte bedragen. Deze hoeveelheid moet binnen 120 seconden toegevoerd zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13
    text: |-
      FK-5-1-12 – brandblusinstallaties Brandblusinstallaties die werken met FK-5-1-12 moeten behalve aan de eisen,
      bedoeld in het eerste tot en met het negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13.a
    text: |-
      Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13.b
    text: |-
      Iedere houder die FK-5-1-12 en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukbeveiliging. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van de brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13.c
    text: Iedere houder moet zijn uitgerust met een inrichting waarmee de gasdruk kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13.d
    text: |-
      De vulgraad van de houders mag niet meer zijn dan 1,00 kg/l. Voor het specifieke volume van het uitgestroomde FK-5-
      1-12 moet 0,0719 m3/kg genomen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13.e
    text: |-
      Het volume FK-5-1-12 in de te beschermen ruimte moet minstens 5,5% van het bruto volume van die ruimte bedragen.
      Deze hoeveelheid moet binnen 10 seconden toegevoerd zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13.f
    text: |-
      De houders FK-5-1-12 moeten voorzien zijn van een controlesysteem van de druk dat bij een ontoelaatbaar verlies van
      drijfgas een akoestisch en optisch alarmsignaal in het stuurhuis in werking stelt. Wanneer er geen sprake is van
      een stuurhuis moet het alarmsignaal buiten de te beschermen ruimte in werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03b.13.g
    text: Na het uitstromen van het blusmiddel mag de concentratie in de te beschermen ruimte niet groter zijn dan 10,0%.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03b
  - number: 10.03c
    text: |-
      Voor de bescherming van objecten zijn vast geïnstalleerde brandblusinstallaties slechts toegestaan op grond van
      aanbevelingen van de Centrale Commissie van de Rijnvaart.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.03c
  - number: 10.04.1
    text: 'De volgende vaartuigen moeten met een bijboot overeenkomstig de Europese norm EN 1914: 1997, zijn uitgerust:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.04
  - number: 10.04.1.a
    text: motorschepen en sleepschepen met een laadvermogen van meer dan 150 t;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.04
  - number: 10.04.1.b
    text: sleepboten en duwboten met een waterverplaatsing van meer dan 150 m3;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.04
  - number: 10.04.1.c
    text: drijvende werktuigen; en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.04
  - number: 10.04.1.d
    text: passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.04
  - number: 10.04.2
    text: |-
      Bijboten moeten binnen 5 minuten, te rekenen vanaf de eerste daartoe noodzakelijke handeling, door één persoon
      veilig te water kunnen worden gelaten. Indien zij door middel van een door een motor aangedreven inrichting te
      water worden gelaten, moet deze zo zijn ingericht dat uitvallen van de energietoevoer het snel en veilig te water
      laten niet kan verhinderen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.04
  - number: 10.04.3
    text: Opblaasbare bijboten moeten zijn getest overeenkomstig de indicaties van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.04
  - number: 10.05.1
    text: |-
      Aan boord van vaartuigen moeten ten minste drie reddingsboeien aanwezig zijn, die - aan de Europese norm EN 14
      144 : 2003 of
        - aan Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (Solas 1974), Hoofdstuk III,
      Regel 7.1, en aan de internationale code betreffende de reddingsmiddelen (LSA), paragraaf 2.1 voldoen. Ze moeten
      zich in gebruiksklare toestand op vaste en daarvoor geschikte plaatsen aan dek bevinden en mogen niet zijn
      vastgemaakt aan de houders. Ten minste één reddingsboei moet zich in de onmiddellijke nabijheid van het stuurhuis
      bevinden en deze moet zijn voorzien van een automatisch ontbrandend licht, gevoed door batterijen, dat in het water
      niet kan uitgaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.05
  - number: 10.05.2
    text: |-
      Aan boord van vaartuigen moet zich voor ieder zich regelmatig aan boord bevindend persoon een voor hem persoonlijk
      geschikt, automatisch opblaasbaar zwemvest, dat voldoet aan de Europese normen EN 395 : 1998, EN 396 : 1998, EN ISO
      12402-3 : 2006 of EN ISO 12402-4 : 2006, onder handbereik bevinden. Voor kinderen zijn ook harde zwemvesten, die
      aan deze normen voldoen, toegelaten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.05
  - number: 10.05.3
    text: Zwemvesten moeten zijn getest overeenkomstig de indicaties van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel10.05
  - number: 11.01.1
    text: |-
      Vaartuigen moeten zodanig zijn gebouwd, ingericht en uitgerust, dat personen daarop veilig kunnen werken en zich
      verplaatsen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.01
  - number: 11.01.2
    text: |-
      De voor het werk aan boord noodzakelijke en vast opgestelde voorzieningen moeten zodanig zijn ingericht, opgesteld
      en beveiligd, dat ze gemakkelijk en zonder gevaar bediend, gebruikt en onderhouden kunnen worden. Zo nodig moeten
      bewegende en hete delen van beschermende inrichtingen zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.01
  - number: 11.02.1
    text: |-
      Dekken en gangboorden moeten vlak zijn en moeten vrij zijn van obstakels waarover men kan struikelen; ze moeten
      zodanig zijn uitgevoerd dat er geen water op kan blijven staan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.02
  - number: 11.02.2
    text: |-
      Dekken alsmede gangboorden, machinekamervloeren, bordessen, trappen en de bolderdeksels in de gangboorden moeten
      veiligheid bieden tegen uitglijden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.02
  - number: 11.02.3
    text: |-
      Bolderdeksels in de gangboorden en hindernissen in de verkeerswegen, zoals bijvoorbeeld randen van traptreden,
      moeten in een met het omgevende dek contrasterende kleur zijn geverfd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.02
  - number: 11.02.4
    text: |-
      Buitenkanten van de dekken en de werkplekken, waarbij de valhoogte meer dan 1 m kan bedragen, moeten zijn voorzien
      van een verschansing of den van elk ten minste 0,70 m hoogte of van relingen die voldoen aan de Europese norm EN
      711 : 1995, die bestaan uit een handreling, een tussenroede op kniehoogte en een voetlijst. Bij gangboorden moet
      een voetlijst en een doorlopende handreling aan de dennenboom zijn aangebracht. De handreling aan de dennenboom kan
      achterwege worden gelaten, indien het gangboord voorzien is van een niet neerklapbare reling.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.02
  - number: 11.02.5
    text: |-
      Voor werkplekken, waar de valhoogte meer dan 1 meter bedraagt, kan de Commissie van Deskundigen geschikte
      inrichtingen en uitrustingen ten behoeve van het veilig werken eisen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.02
  - number: '11.03'
    text: Werkplekken moeten zo groot zijn dat iedere persoon die er werkt voldoende bewegingsvrijheid heeft.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.03
  - number: 11.04.1
    text: |-
      De vrije breedte van het gangboord moet ten minste 0,60 m bedragen. Op de plaats van bepaalde ingebouwde
      noodzakelijke constructies (zoals afsluiters voor dekwasleidingen) behoeft dit slechts 0,50 m te zijn en bij
      bolders en klampen 0,40 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.04
  - number: 11.04.2
    text: |-
      De vrije breedte van het gangboord kan tot een hoogte van 0,90 m daarboven tot 0,54 m beperkt blijven wanneer de
      vrije breedte in het gedeelte daarboven tussen de buitenkant van de scheepshuid en de binnenkant van de opening
      van het laadruim ten minste 0,65 m bedraagt. In dit geval kan de vrije breedte van het gangboord tot 0,50 m beperkt
      blijven, indien aan de buitenkant van het gangboord een reling is aangebracht als voorziening tegen overboord
      vallen van personen, die voldoet aan de Europese norm EN 711 : 1995. Deze reling behoeft niet te zijn aangebracht
      op schepen met een lengte van 55 m of minder die slechts verblijven op het achterschip hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.04
  - number: 11.04.3
    text: Het eerste en tweede lid gelden tot een hoogte van 2,00 m boven het gangboord.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.04
  - number: 11.05.1
    text: 'Bij gangen, toegangen en doorgangen, die door personen of voor het verplaatsen van goederen worden gebruikt, moet:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.05.1.a
    text: voor de toegangsopeningen voldoende plaats zijn voor onbelemmerde beweging;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.05.1.b
    text: |-
      de vrije breedte van de doorgangen overeenkomen met de bestemming van de werkplekken, maar ten minste 0,60 m
      bedragen. Bij schepen met een breedte van niet meer dan 8 m behoeft de breedte van de doorgangen slechts 0,50 m
      te bedragen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.05.1.c
    text: de vrije hoogte van de doorgangen inclusief de hoogte van de drempels ten minste 1,90 m bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.05.2
    text: |-
      Deuren moeten van beide zijden zonder gevaar geopend en gesloten kunnen worden. Ze moeten zodanig zijn uitgevoerd
      dat zij niet onopzettelijk open of dicht kunnen gaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.05.3
    text: |-
      In- en uitgangen en gangen die hoogteverschillen van meer dan 0,50 m hebben moeten zijn voorzien van adequate
      trappen, ladders of klimtreden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.05.4
    text: |-
      Wanneer het hoogteverschil bij permanent bezette werkplekken meer dan 1,00 m bedraagt, moeten er trappen zijn. Dit
      geldt niet voor nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.05.5
    text: |-
      Bij schepen met laadruimen moet ten minste bij ieder uiteinde van ieder laadruim een vast ingebouwde
      klimvoorziening aanwezig zijn. In afwijking hiervan behoeft geen vast ingebouwde klimvoorziening aanwezig te zijn
      indien er tenminste twee draagbare ruimladders aanwezig zijn die bij een hellingshoek van 60° met tenminste drie
      treden tot boven de rand van het luik moeten reiken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.05
  - number: 11.06.1
    text: |-
      Het aantal, de constructie en de afmetingen van de uitgangen met inbegrip van de nooduitgangen moeten overeenkomen
      met de bestemming en de grootte van de ruimten. Wanneer één van deze uitgangen een nooduitgang is, moet die
      duidelijk als zodanig zijn aangeduid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.06
  - number: 11.06.2
    text: |-
      Nooduitgangen of als nooduitgang dienende vensters of bovenlichten moeten een vrije opening van ten minste 0,36 m2
      hebben, waarbij de kortste zijde ten minste 0,50 m moet bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.06
  - number: 11.07.1
    text: |-
      Trappen en ladders moeten veilig zijn bevestigd. Trappen moeten ten minste 0,60 m breed zijn; de vrije breedte
      tussen de handrelingen moet ten minste 0,60 m bedragen; de diepte van de treden mag niet minder zijn dan 0,15
      m; het oppervlak van de treden moet veiligheid bieden tegen uitglijden; trappen met meer dan drie treden moeten
      handrelingen hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.07
  - number: 11.07.2
    text: |-
      Ladders en klimtreden moeten een vrije breedte van ten minste 0,30 m hebben; de afstand tussen de sporten mag niet
      meer dan 0,30 m bedragen; de afstand van de sporten tot constructiedelen moet ten minste 0,15 m zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.07
  - number: 11.07.3
    text: Ladders en klimtreden moeten van boven herkenbaar zijn en met handgrepen boven de uitgangsopeningen zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.07
  - number: 11.07.4
    text: |-
      Aanleunladders moeten ten minste 0,40 m en onderaan ten minste 0,50 m breed zijn; ze moeten kunnen worden beveiligd
      tegen kantelen en wegglijden; de sporten moeten vast in de boom zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.07
  - number: 11.08.1
    text: |-
      Binnen in het schip gelegen werkplekken moeten naar grootte, inrichting en indeling zijn aangepast aan de daar
      te verrichten werkzaamheden en voldoen aan de eisen inzake hygiëne en veiligheid. Ze moeten voldoende en niet
      verblindend kunnen worden verlicht en voldoende kunnen worden geventileerd; zo nodig moeten zij zijn voorzien van
      verwarmingsapparaten die een redelijke temperatuur waarborgen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.08
  - number: 11.08.2
    text: |-
      Vloeren van binnen in het schip gelegen werkplekken moeten vast zijn, duurzaam uitgevoerd, en veiligheid bieden
      tegen struikelen en uitglijden. Openingen in dekken en vloeren moeten in geopende toestand een beveiliging hebben
      tegen het gevaar van vallen. Vensters en bovenlichten moeten zodanig zijn uitgevoerd en gesitueerd dat ze zonder
      gevaar kunnen worden bediend en gereinigd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.08
  - number: 11.09.1
    text: |-
      De werkplekken moeten zodanig zijn gelegen, ingericht en ontworpen dat de werknemers niet aan het gevaar van
      trillingen zijn blootgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.09
  - number: 11.09.2
    text: |-
      Permanent gebruikte werkruimten moeten bovendien zodanig zijn gebouwd en geïsoleerd tegen geluid dat de veiligheid
      en de gezondheid van de werknemers niet door geluidshinder in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.09
  - number: 11.09.3
    text: |-
      Voor werknemers die dagelijks aan een geluidsdruk van meer dan 85 dB(A) worden blootgesteld, moeten
      persoonlijke gehoorbeschermingsmiddelen aanwezig zijn. Werkplekken waar deze waarden meer zijn dan 90 dB(A)
      moeten zijn voorzien van een teken ‘gehoorbescherming verplicht’ met een diameter van ten minste 10 cm,
      overeenkomstig [schets 7 van bijlage I][ref1], waarin wordt gewezen op de plicht tot het gebruiken van deze
      gehoorbeschermingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 11.10.1
    text: |-
      Luiken moeten gemakkelijk bereikt en veilig bewogen kunnen worden. Delen van luiken met een gewicht van meer dan
      40 kg moeten bovendien schuifbaar of neerklapbaar zijn of zodanig zijn ingericht dat zij mechanisch kunnen worden
      opgetild. Luiken die met behulp van hefwerktuigen worden bewogen, moeten zijn voorzien van adequate en gemakkelijk
      toegankelijke inrichtingen voor het vastmaken van de aanslagmiddelen. Op luiken of schaarstokken die niet
      uitwisselbaar zijn moet duidelijk het luik waarbij ze behoren en de exacte plaats daarop zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.10
  - number: 11.10.2
    text: |-
      Luiken moeten beveiligd kunnen worden tegen oplichten door wind en laadinrichtingen. Schuifluiken moeten zijn
      voorzien van vergrendelingen die onopzettelijke beweging in de lengterichting met meer dan 0,40 m verhinderen;
      zij moeten in hun uiterste stand kunnen worden vastgezet. Er moeten geschikte inrichtingen aanwezig zijn voor het
      bevestigen van opgestapelde luiken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.10
  - number: 11.10.3
    text: |-
      Bij mechanisch bediende luiken moet de energietoevoer na het loslaten van de bedieningsschakelaar automatisch
      worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.10
  - number: 11.10.4
    text: |-
      Luiken moeten de te verwachten belasting, begaanbare luiken ten minste 75 kg, als puntlast kunnen opnemen. Niet
      begaanbare luiken moeten als zodanig zijn aangeduid. Op luiken die bestemd zijn voor het dragen van deklast moet
      de toegelaten belasting in t/m2 staan aangeduid. Indien voor het bereiken van de toegelaten belasting stutten nodig
      zijn, moet daarop op een geschikte plaats worden gewezen; in dat geval moeten tekeningen voor dit doel aan boord
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.10
  - number: 11.11.1
    text: |-
      Lieren moeten zodanig zijn ingericht dat veilig werken mogelijk is. Ze moeten voorzieningen hebben die het
      onopzettelijk teruglopen van de last verhinderen. Lieren die geen automatische rem hebben moeten zijn uitgerust met
      een op de trekkracht berekende rem.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.11
  - number: 11.11.2
    text: |-
      Lieren die met de hand worden bediend moeten zijn voorzien van inrichtingen die het terugslaan van de zwengels
      verhinderen. Lieren die zowel met de hand als mechanisch kunnen worden bediend moeten zodanig zijn ingericht dat de
      mechanische aandrijving niet het handmechanisme in werking kan stellen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.11
  - number: 11.12.1
    text: |-
      Kranen moeten volgens de regels van de techniek zijn gebouwd. De tijdens het in bedrijf zijn optredende krachten
      moeten veilig worden overgebracht op de scheepsconstructie; zij mogen de stabiliteit niet in gevaar brengen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.2
    text: 'Op elke kraan moet een fabriekslabel met de volgende gegevens zijn aangebracht:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.2.a
    text: naam en adres van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.2.b
    text: het EG-kenteken met vermelding van het bouwjaar;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.2.c
    text: aanduiding van de serie of het type;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.2.d
    text: eventueel serienummer.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.3
    text: |-
      Op elke kraan moet de ten hoogste toelaatbare belasting duurzaam en duidelijk zichtbaar zijn aangebracht. Bij
      kranen waarvan de bedrijfslast niet meer bedraagt dan 2000 kg hoeft alleen de ten hoogste toelaatbare bedrijfslast
      bij de grootste vlucht van de kraan duurzaam en duidelijk zichtbaar te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.4
    text: |-
      Ter voorkoming van het gevaar van persoonlijk letsel moeten beschermende voorzieningen aanwezig zijn. De buitenste
      delen van de kraan moeten ten opzichte van alle delen van de omgeving van de kraan een veiligheidsafstand naar
      boven, beneden en naar opzij van ten minste 0,50 m hebben. De veiligheidsafstand naar opzij is buiten het gebied
      waar gewerkt en gelopen wordt niet noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.5
    text: |-
      Kranen die mechanisch worden aangedreven moeten kunnen worden beschermd tegen gebruik door onbevoegden. Ze mogen
      slechts aan de voor de kraan voorziene bedieningsinrichting in werking kunnen worden gesteld. De bedieningsorganen
      moeten automatisch in de stopstand terugkeren (schakelaar die niet automatisch in de in werking gestelde stand
      blijft); duidelijk zichtbaar moet zijn in welke richting zij functioneren. Bij het uitvallen van de aandrijfenergie
      mag de last niet automatisch kunnen teruglopen. Onopzettelijke kraanbewegingen moeten worden voorkomen. De
      opwaartse beweging van het hijsmiddel en de overschrijding van de bedrijfslast moeten door adequate voorzieningen
      zijn beperkt. De neerwaartse beweging van het hijsmiddel moet beperkt zijn wanneer bij het voorziene gebruik
      van de kraan, op het moment dat het hijsmiddel wordt bevestigd aan de last, minder dan twee wikkelingen van de
      hijskabel op de liertrommel over zijn. Na het aanspreken van de automatische (beveiligings-)voorzieningen, moet de
      respectieve tegengestelde beweging nog mogelijk zijn. De breeksterkte van draadkabels voor het lopende werk moet
      ten minste het vijfvoudige van de maximaal toelaatbare kabeltreksterkte bedragen. De constructie van de draadkabel
      moet onberispelijk zijn en moet geschikt zijn voor het gebruik bij kranen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.6
    text: |-
      Voor de eerste ingebruikneming en voor het opnieuw in gebruik nemen na ingrijpende wijzigingen dient de
      aanwezigheid van voldoende stevigheid en stabiliteit rekenkundig en door een belastingsproef aan boord te worden
      aangetoond. Voor kranen waarvan de bedrijfslast niet meer bedraagt dan 2000 kg kan de deskundige beslissen het
      rekenkundige bewijs geheel of gedeeltelijk te vervangen door een proef met het 1,25-voudige van de bedrijfslast die
      over het hele werkgebied wordt uitgevoerd. De in de eerste of tweede alinea bedoelde keuring moet door een door de
      Commissie van Deskundigen erkende deskundige worden verricht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.7
    text: |-
      Kranen dienen regelmatig, echter ten minste eens in de twaalf maanden, door een deskundige te worden onderzocht.
      Hierbij dient door visuele controle en controle van het functioneren te worden vastgesteld dat de kraan veilig is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.8
    text: |-
      Uiterlijk om de 10 jaar na de keuring dient de kraan opnieuw door een door de Commissie van Deskundigen erkende
      deskundige te worden getest.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.9
    text: |-
      Kranen waarvan de bedrijfslast meer dan 2000 kg bedraagt, die dienen voor de overslag van vracht, of die aan boord
      van bokken, pontons en andere drijvende werktuigen of schepen bestemd voor bouwwerkzaamheden zijn opgesteld, moeten
      bovendien voldoen aan de voorschriften van een Oeverstaat of van België.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.10
    text: 'Voor alle kranen moeten ten minste de volgende bescheiden aan boord aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.10.a
    text: |-
      de gebruiksaanwijzing van de fabrikant van de kraan. Deze moet ten minste de volgende gegevens bevatten: -
      toepassing en functie van de bedieningsorganen;
        - maximaal toelaatbare bedrijfslast overeenkomstig de vlucht;
        - maximaal toelaatbare helling van de kraan;
        - handleiding voor montage en onderhoud;
        - richtlijnen voor de regelmatige controles;
        - algemene technische gegevens.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: 11.12.10.b
    text: de verklaring over uitgevoerde testen als bedoeld in het zesde, zevende, achtste of negende lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.12
  - number: '11.13'
    text: |-
      Ten behoeve van de opslag van brandbare vloeistoffen met een vlampunt van minder dan 55 °C moet zich aan dek
      een geventileerde kast van onbrandbaar materiaal bevinden. De buitenkant daarvan moet zijn voorzien van een
      teken ‘Vuur, open licht en roken verboden’ met een lengte van de zijde van ten minste 10 cm, overeenkomstig
      [schets 2 van bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 12.01.1
    text: |-
      Schepen moeten voor de gewoonlijk aan boord verblijvende personen, althans ten minste voor de minimum bemanning,
      voorzien zijn van verblijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.01
  - number: 12.01.2
    text: |-
      Verblijven moeten zodanig zijn gebouwd, ingericht en uitgerust dat zij voldoen aan de eisen met betrekking tot de
      veiligheid, de gezondheid en het welzijn van de personen aan boord. Zij moeten gemakkelijk en veilig toegankelijk
      zijn, alsmede voldoende geïsoleerd zijn tegen kou en warmte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.01
  - number: 12.01.3
    text: |-
      De Commissie van Deskundigen kan afwijkingen van dit hoofdstuk toestaan indien de veiligheid en gezondheid van de
      personen aan boord op andere wijze zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.01
  - number: 12.01.4
    text: |-
      De Commissie van Deskundigen vermeldt in het certificaat van onderzoek beperkingen van de exploitatiewijze of van
      de soort bedrijfsvoering van het schip die zijn vereist op grond van afwijkingen als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.01
  - number: 12.02.1
    text: |-
      Verblijven moeten, ook wanneer de deuren gesloten zijn, voldoende kunnen worden geventileerd; bovendien moeten de
      woonruimten voldoende daglicht verkrijgen en zo mogelijk uitzicht naar buiten hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.2
    text: |-
      Verblijven moeten, indien zij niet op dekhoogte toegankelijk zijn en het hoogteverschil meer dan 0,30 m bedraagt,
      via trappen toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.3
    text: In het voorschip mogen de vloeren niet lager dan 1,20 m onder het vlak van de grootste inzinking liggen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.4
    text: |-
      Woon- en slaapruimten moeten ten minste twee zover mogelijk van elkaar verwijderde uitgangen hebben, die als
      vluchtwegen dienen. Eén uitgang kan als nooduitgang zijn geconstrueerd. De eerste zin geldt niet voor ruimten
      waarvan de uitgang rechtstreeks naar het dek leidt of naar een gang die als vluchtweg dient, voor zover deze
      gang twee van elkaar verwijderd liggende uitgangen heeft naar bak- en stuurboord. Nooduitgangen, waartoe ook
      bovenlichten en ramen kunnen behoren, moeten een vrije opening van ten minste 0,36 m2 hebben, een kleinste zijde
      van ten minste 0,50 m hebben en een snelle evacuatie in geval van nood mogelijk maken. De isolering en de bekleding
      van oppervlakken van de vluchtwegen moeten van moeilijk ontvlambaar materiaal zijn gemaakt en het gebruik van de
      vluchtwegen moet door adequate maatregelen zoals ladders of klimtreden te allen tijde zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.5
    text: |-
      Verblijven moeten zijn beschermd tegen ontoelaatbare geluidshinder en trillingen. De ten hoogste toegelaten niveaus
      van de geluidsdruk zijn:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.5.a
    text: 'in woonruimten: 70 dB(A);'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.5.b
    text: 'in slaapruimten: 60 dB(A).'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.6
    text: In verblijven mag de stahoogte niet minder zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.7
    text: In de regel moeten de schepen ten minste één van de slaapruimte afgescheiden woonruimte hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.8
    text: |-
      In woonruimten mag het vrije vloeroppervlak niet minder zijn dan 2 m2 per persoon, maar moet dit in totaal ten
      minste 8 m2 zijn. De oppervlakte bezet met verplaatsbaar meubilair, zoals tafels en stoelen, maakt deel uit van de
      vrije oppervlakte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.9
    text: Elke woon- of slaapruimte moet een inhoud van ten minste 7,00 m3 hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.10
    text: |-
      In woonruimten bedraagt het minimale luchtvolume 3,50 m3 per persoon. In slaapruimten moet het luchtvolume voor de
      eerste persoon ten minste 5,00 m3 bedragen, voor iedere verdere persoon moet nog eens ten minste 3,00 m3 aanwezig
      zijn (het volume van het meubilair dient daarvan te worden afgetrokken). Slaapruimten mogen slechts voor ten
      hoogste twee personen bestemd zijn. De bedden moeten ten minste 0,30 m boven de vloer zijn aangebracht. Indien het
      stapelbedden betreft, moet boven elk bed een vrije ruimte van ten minste 0,60 m hoogte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.11
    text: |-
      Deuren moeten een opening hebben waarvan de bovenkant ten minste 1,90 m boven het dek of de vloer ligt en
      zij moeten een vrije breedte van ten minste 0,60 m hebben. De voorgeschreven hoogte mag door het aanbrengen
      van schuifkappen of luiken worden bereikt. Deuren moeten van beide kanten naar buiten kunnen worden geopend.
      Deurdrempels mogen ten hoogste 0,40 m hoog zijn. Bovendien moeten andere veiligheidsvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.12
    text: 'Trappen moeten vast aangebracht en veilig begaanbaar zijn. Dit is het geval wanneer:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.12.a
    text: zij ten minste 0,60 m breed zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.12.b
    text: de treden ten minste 0,15 m diep zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.12.c
    text: de treden een antisliplaag hebben, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.12.d
    text: trappen met meer dan drie treden zijn voorzien van ten minste een handgreep of leuning.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.02.13
    text: |-
      Leidingen voor gevaarlijke gassen en gevaarlijke vloeistoffen, in het bijzonder als ze onder een zodanig hoge
      druk staan dat een lek personen in gevaar zou kunnen brengen, mogen niet zijn aangelegd in de verblijven en in
      de daarheen leidende gangen. Dit geldt niet voor leidingen voor stoomsystemen en hydraulische systemen die zijn
      ondergebracht in een metalen beschermkoker en voor vast aangelegde leidingen van vloeibaar-gasinstallaties voor
      huishoudelijk gebruik.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.02
  - number: 12.03.1
    text: 'Schepen met verblijven moeten ten minste over de volgende sanitaire voorzieningen beschikken:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.03
  - number: 12.03.1.a
    text: een toilet per wooneenheid of per zes bemanningsleden. Dit toilet moet van frisse lucht kunnen worden voorzien;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.03
  - number: 12.03.1.b
    text: |-
      een wasbak met afvoer en met drinkwateraansluiting voor koud en warm water per wooneenheid of per vier
      bemanningsleden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.03
  - number: 12.03.1.c
    text: een douche of badkuip met drinkwateraansluiting voor koud en warm water per wooneenheid of per zes bemanningsleden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.03
  - number: 12.03.2
    text: |-
      Sanitaire voorzieningen moeten zich in de directe nabijheid van de woonruimten bevinden. Toiletten mogen geen
      rechtstreekse verbinding hebben met de keukens, eetruimten of woonkeukens.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.03
  - number: 12.03.3
    text: |-
      Toiletruimten moeten een grondoppervlak van ten minste 1,00 m2 hebben. Daarbij moet de breedte ten minste 0,75 m
      en de lengte ten minste 1,10 m bedragen. Toiletruimten in hutten voor maximaal twee personen mogen kleiner zijn.
      Indien zich een wasgelegenheid en/of douche in de toiletruimte bevindt, moet het grondoppervlak met ten minste het
      oppervlak van de wasbak en/of de douchebak (of eventueel van de badkuip) zijn vergroot.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.03
  - number: 12.04.1
    text: Keukens mogen gecombineerd zijn met woonruimten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.04.2
    text: 'Keukens moeten uitgerust zijn met:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.04.2.a
    text: kookgerei;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.04.2.b
    text: spoelbak met afvoer;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.04.2.c
    text: installatie voor de drinkwatervoorziening;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.04.2.d
    text: koelkast;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.04.2.e
    text: voldoende berg-, werk- en voorraadruimte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.04.3
    text: |-
      Eetruimten in woonkeukens moeten voldoende zijn voor het aantal bemanningsleden dat deze ruimten gewoonlijk
      gelijktijdig gebruikt. De breedte van de zitplaatsen mag niet minder dan 0,60 m bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.04
  - number: 12.05.1
    text: |-
      Schepen waarop zich verblijven bevinden moeten van een drinkwaterinstallatie zijn voorzien. Op de vulopeningen van
      de drinkwatertanks en de drinkwaterslangen dient te zijn vermeld dat zij uitsluitend voor drinkwater zijn bestemd.
      Vulaansluitingen voor drinkwater moeten boven het dek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.2
    text: 'Drinkwaterinstallaties moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.2.a
    text: van binnen uit corrosiebestendig en fysiologisch ongevaarlijk materiaal bestaan;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.2.b
    text: zijn samengesteld zonder leidinggedeelten waarin een regelmatige doorstroming niet is gegarandeerd, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.2.c
    text: tegen overmatige verhitting zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.3
    text: 'Drinkwatertanks moeten bovendien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.3.a
    text: |-
      een capaciteit hebben van ten minste 150 l per gewoonlijk aan boord verblijvende persoon, maar ten minste per
      bemanningslid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.3.b
    text: een adequaat afsluitbare opening hebben voor het schoonmaken van de binnenkant;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.3.c
    text: een inrichting voor het aanwijzen van de inhoud hebben; en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.3.d
    text: |-
      aansluitingen hebben voor beluchten en ontluchten, die afvoeren in de open lucht of die van adequate filters zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.4
    text: |-
      Drinkwatertanks mogen geen wanden gemeen hebben met andere tanks. Drinkwaterleidingen mogen niet door tanks lopen
      die andere vloeistoffen bevatten. Verbindingen tussen het drinkwatersysteem en andere pijpleidingen zijn niet
      toegestaan. Pijpleidingen voor gas of andere vloeistoffen dan drinkwater mogen niet door drinkwatertanks lopen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.05.5
    text: |-
      Drukvaten voor drinkwater mogen slechts met niet verontreinigde perslucht worden bediend. Indien de perslucht
      afkomstig is van compressoren, moeten vlak vóór de drukvaten voor drinkwater geschikte luchtfilters en
      olieafscheiders zijn aangebracht, tenzij het drinkwater door een membraan van de perslucht is gescheiden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.05
  - number: 12.06.1
    text: |-
      Verblijven moeten overeenkomstig hun doel kunnen worden verwarmd. De verwarmingen moeten berekend zijn op de
      heersende weersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.06
  - number: 12.06.2
    text: |-
      Woon- en slaapruimten moeten – ook bij gesloten deuren – voldoende kunnen worden geventileerd. De toevoer en afvoer
      van lucht moeten onder alle klimatologische omstandigheden voldoende luchtcirculatie mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.06
  - number: 12.06.3
    text: |-
      Verblijven moeten zodanig zijn ingericht en uitgevoerd dat voor zover mogelijk wordt voorkomen dat verontreinigde
      lucht uit andere afdelingen van het schip, zoals machinekamers of laadruimen, binnendringt; bij geforceerde
      ventilatie dienen de inlaatopeningen zodanig te worden aangebracht dat ze aan bovengenoemde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.06
  - number: 12.07.1
    text: |-
      Ieder aan boord verblijvend bemanningslid moet over een eigen bed en een eigen afsluitbare klerenkast beschikken.
      Het bed moet ten minste een binnenmaat van 2,00 bij 0,90 m hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.07
  - number: 12.07.2
    text: Buiten de slaapruimten dient te zijn voorzien in adequate gelegenheden voor het bewaren en drogen van werkkleding.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.07
  - number: 12.07.3
    text: |-
      Alle ruimten moeten elektrisch kunnen worden verlicht. Extra lampen voor gasvormige of vloeibare brandstoffen
      zijn slechts in woonruimten toegestaan. Verlichtingsvoorzieningen met vloeibare brandstof moeten van metaal zijn
      vervaardigd en mogen slechts op brandstoffen werken waarvan het vlampunt boven 55 °C ligt of op handelspetroleum.
      Ze moeten zodanig zijn opgesteld of aangebracht dat er geen brandgevaar bestaat.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel12.07
  - number: 13.01.1
    text: |-
      Op verwarmings-, kook- en koelinstallaties die werken op vloeibaar gas zijn de voorschriften van
      [hoofdstuk 14][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '14'
  - number: 13.01.2
    text: |-
      Verwarmings-, kook- en koelinstallaties met toebehoren moeten zo zijn uitgevoerd en opgesteld dat zij ook bij
      oververhitting geen gevaar opleveren; ze moeten zijn beveiligd tegen onopzettelijk kantelen of verschuiven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.01
  - number: 13.01.3
    text: |-
      De in het tweede lid genoemde installaties mogen niet worden opgesteld in ruimten waar stoffen met een vlampunt
      onder 55 °C worden opgeslagen of gebruikt. Afvoerleidingen van de installaties mogen niet door deze ruimten lopen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.01
  - number: 13.01.4
    text: De voor de verbranding noodzakelijke luchttoevoer moet zijn zekergesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.01
  - number: 13.01.5
    text: |-
      Verwarmingsapparaten moeten vast verbonden zijn met schoorstenen. Deze schoorstenen moeten in goede staat zijn
      en zijn voorzien van geschikte kappen of tegen wind beschermd zijn. Zij moeten zodanig zijn aangelegd dat zij
      gereinigd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.01
  - number: 13.02.1
    text: |-
      Wanneer verwarmings-, kook- en koelinstallaties op vloeibare brandstoffen werken, mogen alleen brandstoffen met een
      vlampunt boven 55 °C worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.02
  - number: 13.02.2
    text: |-
      In afwijking van het eerste lid kunnen kooktoestellen en van pitbranders voorziene verwarmings- en koeltoestellen
      die op handelspetroleum werken worden toegestaan in verblijven en stuurhuizen, mits de inhoud van hun reservoir
      niet meer bedraagt dan 12 liter.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.02
  - number: 13.02.3
    text: 'Met pitbranders uitgeruste installaties moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.02
  - number: 13.02.3.a
    text: |-
      een metalen brandstoftank met een afsluitbare vulopening hebben, die geen zacht gesoldeerde naden heeft onder de
      hoogste vulstand en die zo is gebouwd en aangebracht dat hij niet onopzettelijk kan opengaan of leeglopen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.02
  - number: 13.02.3.b
    text: zonder behulp van een andere brandbare vloeistof kunnen worden ontstoken, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.02
  - number: 13.02.3.c
    text: zo zijn opgesteld dat de verbrandingsgassen veilig worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.02
  - number: 13.03.1
    text: |-
      Oliekachels met verdampingsbranders en oliestookinstallaties met verstuivingsbranders moeten volgens de algemeen
      erkende regels van de techniek zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.03
  - number: 13.03.2
    text: |-
      Indien een oliekachel met een verdampingsbrander of een oliestookinstallatie met een verstuivingsbrander in een
      machinekamer is opgesteld, moet de luchttoevoer voor het verwarmingsapparaat en de motoren zodanig zijn dat het
      verwarmingsapparaat en de motoren onafhankelijk van elkaar, probleemloos en veilig kunnen functioneren. Indien
      nodig moeten afzonderlijke luchttoevoerkokers aanwezig zijn. De opstelling van het apparaat moet zodanig zijn dat
      een eventueel uit de verbrandingsruimte terugslaande vlam niet met andere delen van de machinekamerinstallatie in
      aanraking kan komen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.03
  - number: 13.04.1
    text: |-
      Oliekachels met verdampingsbranders moeten zonder behulp van andere brandbare vloeistoffen kunnen worden
      aangestoken. Zij moeten zijn aangebracht boven een metalen lekbak van zodanige omvang dat alle kachelonderdelen
      waarin olie aanwezig kan zijn zich boven deze bak bevinden. De inhoud van de lekbak mag niet minder dan 2 liter en
      de randhoogte niet minder dan 20 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.2
    text: |-
      Voor oliekachels met verdampingsbranders die in de machinekamer zijn opgesteld moet de randhoogte van de in het
      eerste lid bedoelde lekbak ten minste 200 mm bedragen. De onderkant van de brander moet boven de bovenrand van de
      lekbak liggen. Bovendien moet de bovenrand van de lekbak ten minste 100 mm boven de vloerplaat uitsteken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.3
    text: |-
      Oliekachels met verdampingsbranders moeten van een geschikte brandstofregelaar zijn voorzien, die bij elke
      ingestelde stand een praktisch gelijkblijvende olietoevoer naar de brander waarborgt en bij eventueel uitdoven van
      de vlam de brandstoftoevoer afsluit. De brandstofregelaar is als geschikt te beschouwen als deze ook bij trillingen
      en bij slagzij tot 12° probleemloos functioneert en, behalve van een vlotter voor de regulering van het niveau, is
      voorzien van:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.3.a
    text: |-
      een tweede vlotter, die bij het overschrijden van het toelaatbare olieniveau de toevoer van brandstof veilig en
      betrouwbaar afsluit, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.3.b
    text: een overloopleiding, mits de olie-opvangbak ten minste de inhoud van de verbruikstank kan bevatten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.4
    text: 'Indien de brandstoftank gescheiden is van de oliekachel met verdampingsbrander:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.4.a
    text: mag deze tank niet hoger zijn geplaatst dan volgens de gebruiksaanwijzing van de fabrikant is toegestaan;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.4.b
    text: moet de tank zodanig zijn geplaatst dat deze tegen ontoelaatbare verwarming is beschermd;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.4.c
    text: moet de brandstoftoevoer vanaf het dek kunnen worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: 13.04.5
    text: |-
      De schoorstenen van oliekachels met natuurlijke trek moeten zijn voorzien van een inrichting die terugslag van de
      trek verhindert.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.04
  - number: '13.05'
    text: 'Oliestookinstallaties met verstuivingsbranders moeten met name aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.05
  - number: 13.05.a
    text: Vóór het begin van de olietoevoer moet voldoende ventilatie van de verbrandingsruimte zijn gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.05
  - number: 13.05.b
    text: De brandstoftoevoer moet door een thermostatische regelaar worden geregeld;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.05
  - number: 13.05.c
    text: De ontsteking moet elektrisch of met een waakvlam geschieden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.05
  - number: 13.05.d
    text: Er moet een inrichting aanwezig zijn die bij het uitdoven van de vlam de brandstoftoevoer automatisch afsluit;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.05
  - number: 13.05.e
    text: |-
      De hoofdschakelaar moet zijn aangebracht op een gemakkelijk toegankelijke plaats buiten de ruimte waar de
      installatie staat opgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.05
  - number: '13.06'
    text: |-
      Luchtverhitters waarbij de verwarmingslucht onder druk rondom een verbrandingskamer naar een verdeelsysteem of een
      ruimte wordt geleid moeten aan de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.a
    text: |-
      Indien de brandstof onder druk wordt verstoven, moet de toevoer van de verbrandingslucht door middel van een
      ventilator geschieden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.b
    text: |-
      Voordat de brander kan worden ontstoken, moet de verbrandingskamer goed geventileerd zijn. Dit kan ook gebeuren
      door het nalopen van de verbrandingsluchtventilator;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.c
    text: |-
      De brandstoftoevoer moet automatisch worden gesloten, wanneer - het vuur uitdooft;
        - geen voldoende toevoer van verbrandingslucht aanwezig is;
        - de verhitte lucht een eerder ingestelde temperatuur overschrijdt, of
        - de stroomvoorziening van de veiligheidsinrichtingen uitvalt. In deze gevallen mag de brandstoftoevoer na te zijn
      gesloten niet weer automatisch starten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.d
    text: |-
      De ventilatoren voor verbrandingslucht en verwarmingslucht moeten kunnen worden uitgeschakeld buiten de ruimte
      waarin het verwarmingsapparaat is opgesteld;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.e
    text: |-
      Indien de verwarmingslucht van buitenaf wordt aangezogen, moeten de aanzuigopeningen zo hoog mogelijk boven het dek
      liggen. De uitvoering daarvan moet spatwater- en regendicht zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.f
    text: De leidingen voor de verwarmingslucht moeten van metaal zijn vervaardigd;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.g
    text: De uitgangsopeningen voor de verwarmingslucht mogen niet volledig gesloten kunnen worden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.h
    text: De bij lekkage vrijkomende brandstof mag zich niet tot in de leidingen voor de verwarmingslucht kunnen verspreiden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.06.i
    text: Luchtverhitters mogen hun verwarmingslucht niet uit een machinekamer kunnen aanzuigen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.06
  - number: 13.07.1
    text: |-
      Verwarmingsapparaten die op vaste brandstoffen werken moeten zodanig op een metalen plaat met een opstaande
      rand staan dat gloeiende brandstoffen of hete as niet buiten deze plaat kunnen geraken. Dit is niet vereist in
      ruimten die zijn gebouwd van onbrandbaar materiaal en die uitsluitend zijn bestemd voor het onderbrengen van een
      verwarmingsketel.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.07
  - number: 13.07.2
    text: |-
      De met vaste brandstoffen verwarmde ketels moeten zijn voorzien van thermostatische regelaars, die de voor de
      verbranding noodzakelijke luchttoevoer regelen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.07
  - number: 13.07.3
    text: |-
      In de nabijheid van ieder verwarmingsapparaat moeten middelen aanwezig zijn waarmee de as gemakkelijk kan worden
      afgekoeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.07
  - number: '13.08'
    text: '[Door vernummering vervallen.]'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel13.08
  - number: 14.01.1
    text: |-
      Vloeibaargasinstallaties bestaan in hoofdzaak uit een flessenkast met één of meer gasflessen, één of meer
      drukregelaars, een distributienet en gebruiksapparaten. Reserveflessen en lege flessen die zich niet in de
      flessenkast bevinden zijn geen delen van een vloeibaargasinstallatie. [Artikel 14.05][ref1] is hierop van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.01.2
    text: De installaties mogen slechts op handelspropaan werken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.01
  - number: 14.02.1
    text: |-
      Vloeibaargasinstallaties moeten in al hun onderdelen geschikt zijn voor het gebruik van propaan en deugdelijk zijn
      uitgevoerd en opgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.02
  - number: 14.02.2
    text: |-
      Vloeibaargasinstallaties mogen slechts worden gebruikt voor huishoudelijke doeleinden in de verblijven en in het
      stuurhuis, alsmede voor overeenkomstige doeleinden op passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.02
  - number: 14.02.3
    text: |-
      Er kunnen zich aan boord verschillende afzonderlijke vloeibaargasinstallaties bevinden. Een en dezelfde installatie
      mag niet worden gebruikt voor verblijven die door een ruim of een vaste tank zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.02
  - number: 14.02.4
    text: In de machinekamer mag zich geen onderdeel van de vloeibaargasinstallatie bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.02
  - number: 14.03.1
    text: |-
      Toegestaan zijn uitsluitend flessen waarvan de toegelaten vulmassa ligt tussen 5 en 35 kg. Voor passagiersschepen
      kan de Commissie van Deskundigen flessen met een hoger vulgewicht toestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.03
  - number: 14.03.2
    text: |-
      De flessen moeten voldoen aan de voorschriften die in één der Oeverstaten of België van kracht zijn. Zij moeten
      zijn voorzien van het officiële stempel ten bewijze van de keuring op basis van de voorgeschreven beproevingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.03
  - number: 14.04.1
    text: |-
      Aangesloten flessen moeten aan dek zijn opgesteld in een al dan niet ingebouwde flessenkast buiten de verblijven
      en wel zodanig dat het zich verplaatsen aan boord niet wordt gehinderd. De flessenkast mag echter niet op het voor-
      of achterschip tegen de verschansing zijn opgesteld. De flessenkast mag alleen dan in de bovenbouw zijn ingebouwd,
      wanneer zij gasdicht is ten opzichte daarvan en wanneer zij slechts naar de buitenzijde kan worden geopend. Zij
      moet zo zijn ingericht dat de distributieleidingen naar de plaatsen van verbruik zo kort mogelijk zijn. Er mogen
      slechts zo veel flessen voor gelijktijdige afname zijn aangesloten als de verbruiksinstallatie vereist. In geval
      van meer dan één fles moet in elk geval gebruik worden gemaakt van een omschakel- of afsluitinrichting. Per
      flessenkast mogen ten hoogste vier flessen worden aangesloten. Met inbegrip van de reserveflessen mogen zich per
      flessenkast niet meer dan zes flessen aan boord bevinden. Op passagiersschepen met keukens of kantines voor de
      passagiers mogen ten hoogste zes flessen worden aangesloten. Met inbegrip van de reserveflessen mogen zich per
      flessenkast niet meer dan negen flessen aan boord bevinden. De drukregelaar, of in geval van een drukregeling in
      twee trappen, de eerste drukregelaar, moet zich in dezelfde kast bevinden als de flessen en vast zijn ingebouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.04
  - number: 14.04.2
    text: |-
      Aangesloten flessen moeten zodanig zijn geplaatst dat in geval van lekkage ontsnappend gas uit de flessenkast in de
      open lucht kan afvloeien, zonder dat daarbij enig gevaar bestaat dat gas doordringt in het inwendige van het schip
      of in aanraking kan komen met een ontstekingsbron.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.04
  - number: 14.04.3
    text: |-
      Flessenkasten moeten zijn vervaardigd van moeilijk ontvlambaar materiaal en door aan de beneden- en bovenzijde
      aangebrachte openingen voldoende worden geventileerd. De flessen moeten staande zijn opgesteld en niet kunnen
      omvallen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.04
  - number: 14.04.4
    text: |-
      De flessenkast moet zodanig zijn ingericht en opgesteld dat de temperatuur van de flessen niet boven 50 °C kan
      stijgen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.04
  - number: 14.04.5
    text: |-
      Aan de buitenzijde van de flessenkast moet het opschrift ‘vloeibaar gas’ en een teken ‘vuur, open licht en roken
      verboden’ met een diameter van ten minste 10 cm, overeenkomstig schets 2 van [bijlage I][ref1], zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: '14.05'
    text: |-
      Reserveflessen en lege flessen die zich niet in de flessenkast bevinden moeten buiten de verblijven en het
      stuurhuis in een overeenkomstig [artikel 14.04][ref1] uitgevoerde kast zijn opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.06.1
    text: |-
      De gebruiksapparaten mogen slechts op de flessen worden aangesloten door middel van een distributienet dat is
      voorzien van één of meer drukregelaars, die de gasdruk verlagen tot de gebruiksdruk. Deze drukvermindering kan
      in één of twee trappen worden bewerkstelligd. Alle drukregelaars moeten op een bepaalde druk overeenkomstig
      [artikel 14.07][ref1] zijn afgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.06.2
    text: |-
      De laatste drukregelaar moet zijn voorzien van, dan wel worden gevolgd door een inrichting waardoor het
      distributienet automatisch is beveiligd tegen overdruk, wanneer de drukregelaar onvoldoende zou functioneren.
      Gewaarborgd moet zijn dat in geval van een lek uit deze veiligheidsvoorziening ontsnappend gas in de open
      lucht wordt afgevoerd en niet in het inwendige van het schip kan doordringen of in aanraking kan komen met een
      ontstekingsbron; zo nodig moet daartoe een afzonderlijke leiding worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.06
  - number: 14.06.3
    text: Veiligheidsventielen en afblaasleidingen moeten tegen het binnendringen van water zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.06
  - number: 14.07.1
    text: |-
      Bij een drukregeling in twee trappen mag de waarde van de middeldruk niet meer bedragen dan 2,5 bar boven de
      heersende atmosferische druk.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.07
  - number: 14.07.2
    text: |-
      De einddruk van het gas bij het verlaten van de laatste drukregelaar mag niet meer bedragen dan 0,05 bar boven de
      heersende atmosferische druk, waarbij een speling van 10% is toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.07
  - number: 14.08.1
    text: |-
      Leidingen moeten uit vast aangelegde stalen of koperen pijpen bestaan. Aansluitleidingen aan de flessen moeten
      evenwel bestaan uit voor propaan geschikte hoge-drukslangen of spiraalvormige pijpen. Gebruiksapparaten die niet
      vast zijn ingebouwd mogen echter zijn aangesloten door middel van geschikte slangen met een lengte van ten hoogste
      1 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.08
  - number: 14.08.2
    text: |-
      Leidingen moeten bestand zijn tegen alle aan boord bij normale bedrijfsomstandigheden optredende invloeden,
      met name wat corrosie en sterkte betreft, en door hun eigenschappen en opstelling voldoende gastoevoer naar de
      gebruiksapparaten met betrekking tot hoeveelheid en druk verzekeren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.08
  - number: 14.08.3
    text: |-
      Pijpleidingen moeten zo weinig mogelijk koppelingen bevatten. De pijpen en koppelingen moeten gasdicht zijn en bij
      alle trillingen en uitzettingen waaraan zij kunnen worden blootgesteld gasdicht blijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.08
  - number: 14.08.4
    text: |-
      Pijpleidingen moet goed toegankelijk, behoorlijk bevestigd en overal op die plaatsen beschermd zijn, waar gevaar
      van stoten of wrijvingen bestaat, vooral bij de doorvoeringen door stalen schotten of metalen wanden. Stalen pijpen
      moeten over hun gehele uitwendige oppervlakte corrosiebestendig zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.08
  - number: 14.08.5
    text: |-
      Flexibele leidingen en de koppelingen daarvan moeten bestand zijn tegen alle aan boord bij normale
      bedrijfsomstandigheden optredende invloeden. Zij moeten bovendien zo zijn aangelegd dat zij niet onder spanning
      staan, niet ontoelaatbaar worden verwarmd en over hun gehele lengte kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.08
  - number: 14.09.1
    text: Het gehele distributienet moet door een steeds gemakkelijk en snel te bereiken hoofdkraan kunnen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.09
  - number: 14.09.2
    text: |-
      Ieder gebruiksappparaat moet aan een aftakking zijn geplaatst die door middel van een afzonderlijke kraan kan
      worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.09
  - number: 14.09.3
    text: Kranen moeten beschermd tegen weersinvloeden en stoten zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.09
  - number: 14.09.4
    text: |-
      Achter elke drukregelaar moet een testaansluiting zijn aangebracht. Door middel van een kraan moet zijn gewaarborgd
      dat de drukregelaar bij een test niet aan de testdruk wordt blootgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.09
  - number: 14.10.1
    text: |-
      Er mogen slechts gebruiksapparaten worden geïnstalleerd die in één van de Oeverstaten of België voor propaan zijn
      toegelaten. Zij moeten van inrichtingen zijn voorzien waardoor het uitstromen van gas bij het uitgaan van zowel de
      branders als de waakvlam geheel wordt verhinderd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.10
  - number: 14.10.2
    text: |-
      Elk gebruiksapparaat moet zodanig zijn opgesteld en aangesloten dat het niet kan omvallen of onopzettelijk
      verschuiven en dat onopzettelijk losraken van de aansluitleidingen niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.10
  - number: 14.10.3
    text: |-
      Verwarmingstoestellen, geisers en koelkasten moeten zijn voorzien van een leiding waardoor verbrandingsgassen in de
      open lucht worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.10
  - number: 14.10.4
    text: |-
      Gebruiksapparaten mogen slechts in het stuurhuis zijn opgesteld, wanneer deze zo is gebouwd dat eventueel
      ontsnappend gas niet vanuit het stuurhuis in de lager gelegen gedeelten van het schip, met name via doorvoeringen
      van de afstandbedieningen in de machinekamer, kan doordringen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.10
  - number: 14.10.5
    text: |-
      Gebruiksapparaten mogen in slaapruimten slechts worden opgesteld, wanneer de verbranding onafhankelijk van de in
      deze ruimte aanwezige lucht plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.10
  - number: 14.10.6
    text: |-
      Gebruiksapparaten waarvan de verbranding afhankelijk van de in de ruimte aanwezige lucht plaatsvindt moeten in een
      ruimte van voldoende afmeting zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.10
  - number: 14.11.1
    text: |-
      De ventilatie in de ruimten, waarin gebruiksapparaten zijn opgesteld waarvan de verbranding afhankelijk van de in
      de ruimte aanwezige lucht plaatsvindt, moet zijn verzekerd door ventilatie-openingen van voldoende afmetingen, elk
      echter met een vrije doorsnede van ten minste 150 cm2.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.11
  - number: 14.11.2
    text: Ventilatie-openingen mogen geen afsluitinrichtingen hebben en niet in verbinding staan met nachtverblijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.11
  - number: 14.11.3
    text: |-
      Afvoerkanalen moeten zo zijn uitgevoerd dat de verbrandingsgassen afdoende worden afgevoerd. Zij moeten
      bedrijfszeker en onbrandbaar zijn. Ventilatoren voor de luchtverversing van verblijven mogen de afvoer niet nadelig
      beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.11
  - number: '14.12'
    text: |-
      Op een geschikte plaats aan boord moet een gebruiksaanwijzing zijn aangebracht; hierop moeten ten minste
      de volgende opschriften voorkomen: - ‘De afsluitkranen van de flessen, die niet op het distributienet zijn
      aangesloten, moeten zijn gesloten, zelfs wanneer de flessen geacht worden leeg te zijn.’
        - ‘De slangen moeten worden vervangen, zodra hun toestand dit noodzakelijk maakt.’
        - ‘Alle gebruiksapparaten moeten zijn aangesloten, tenzij de bijbehorende toevoerleidingen zijn gesloten.’
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.12
  - number: '14.13'
    text: |-
      Vóór de ingebruikneming van een vloeibaargasinstallatie, na iedere verandering of reparatie en bij iedere
      vernieuwing van de in [artikel 14.15][ref1] bedoelde aantekening moet de gehele installatie worden gekeurd door een
      deskundige die als zodanig door de Commissie van Deskundigen is erkend. Deze deskundige moet bij de keuring nagaan
      of de installatie in overeenstemming is met dit hoofdstuk. Hij moet aan de Commissie van Deskundigen een verslag
      van de keuring uitbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.13
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: '14.14'
    text: 'Het beproeven van de installatie moet onder de volgende voorwaarden geschieden:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
  - number: 14.14.1
    text: |-
      Pijpleidingen voor de middeldruk tussen de in [artikel 14.09, vierde lid][ref1], bedoelde kraan van de eerste
      drukregelaar en de kranen voor de laatste drukregelaars:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.14.1.a
    text: |-
      een sterktebeproeving uitgevoerd met lucht, met een inert gas of met een vloeistof, onder een druk van 20 bar boven
      de heersende atmosferische druk;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
  - number: 14.14.1.b
    text: |-
      een beproeving van de luchtdichtheid, uitgevoerd met lucht of met een inert gas, onder een druk van 3,5 bar boven
      de heersende atmosferische druk.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
  - number: 14.14.2
    text: |-
      Pijpleidingen onder de bedrijfsdruk tussen de in [artikel 14.09, vierde lid][ref1], bedoelde kraan van de
      enige drukregelaar of de drukregelaar van de laatste trap en de kranen voor de gebruiksapparaten: Beproeving
      van de luchtdichtheid, uitgevoerd met lucht of met een inert gas, onder een druk van 1 bar boven de heersende
      atmosferische druk.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.14.3
    text: |-
      Leidingen tussen de in [artikel 14.09, vierde lid][ref1], bedoelde kraan van de enige drukregelaar of van
      de drukregelaar van de laatste trap en de bedieningsarmaturen van de gebruiksapparaten: Beproeving van de
      luchtdichtheid onder een druk van 0,15 bar boven de heersende atmosferische druk.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.14.4
    text: |-
      Bij de beproevingen, bedoeld in het eerste lid, onder b, het tweede en het derde lid, worden de leidingen als dicht
      beschouwd, wanneer de testdruk na een voor aanpassing aan de temperatuur voldoende wachttijd en een aansluitende
      beproevingsduur van 10 minuten niet daalt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
  - number: 14.14.5
    text: |-
      De aansluitingen aan de flessen, de verbindingsstukken en de armaturen die onder flessendruk staan, alsmede de
      aansluiting van de regelaar aan de gebruiksleiding: Beproeving onder bedrijfsdruk van de luchtdichtheid met een
      schuimvormend middel.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
  - number: 14.14.6
    text: |-
      Gebruiksapparaten moeten bij de nominale belasting in gebruik worden genomen en worden gecontroleerd op goed
      branden bij verschillende instellingen van de regelknop. De ontstekingsbeveiligingen moeten op hun goede werking
      worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
  - number: 14.14.7
    text: |-
      Na de in het zesde lid bedoelde controle moet voor ieder gebruiksapparaat dat aan een afvoergassenleiding is
      aangesloten, na vijf minuten functioneren bij nominale belasting met gesloten ramen en deuren en in werking zijnde
      ventilatieinrichtingen, worden gecontroleerd of verbrandingsgassen naar buiten uittreden. Wanneer het ontsnappen
      van verbrandingsgassen niet van voorbijgaande aard is, moet onmiddellijk de oorzaak worden opgespoord. Het apparaat
      mag niet voor gebruik worden vrijgegeven, voordat alle gebreken zijn hersteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.14
  - number: 14.15.1
    text: |-
      Voor elke vloeibaargasinstallatie die in overeenstemming is met dit hoofdstuk moet een aantekening worden geplaatst
      in het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.15
  - number: 14.15.2
    text: |-
      Deze aantekening wordt door de Commissie van Deskundigen geplaatst na de in [artikel 14.13][ref1] bedoelde keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 14.15.3
    text: |-
      De geldigheidsduur van de aantekening bedraagt ten hoogste drie jaar. Vóór iedere vernieuwing dient een nieuwe
      keuring overeenkomstig [artikel 14.13][ref1] plaats te vinden. Bij wijze van uitzondering kan de Commissie van
      Deskundigen op een met redenen omkleed verzoek van de eigenaar of zijn vertegenwoordiger de geldigheidsduur
      van de aantekening met ten hoogste drie maanden verlengen, zonder dat eerst een keuring overeenkomstig
      [artikel 14.13][ref2] heeft plaatsgehad. Deze verlenging wordt in het certificaat van onderzoek aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel14.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 15.01.1
    text: 'De volgende artikelen zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
  - number: 15.01.1.a
    text: |-
      [artikel 3.02, eerste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '3'
        hoofdstuk: '3'
  - number: 15.01.1.b
    text: |-
      [artikelen 4.01 tot en met 4.03][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel4
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
  - number: 15.01.1.c
    text: |-
      [artikel 8.08, tweede lid, tweede volzin, en zevende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
  - number: 15.01.1.d
    text: |-
      [artikel 9.14, derde lid, tweede alinea][ref1], bij nominale spanningen van meer dan 50V.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel9
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.01.2
    text: 'De volgende installaties zijn op passagiersschepen verboden:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
  - number: 15.01.2.a
    text: |-
      Lampen die werken op vloeibaar gas en vloeibare brandstof als bedoeld in
      [artikel 12.07, derde lid, tweede zin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel12
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '12'
        hoofdstuk: '12'
  - number: 15.01.2.b
    text: |-
      Met pitbranders uitgeruste installaties als bedoeld in [artikel 13.02, tweede en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel13
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '13'
        hoofdstuk: '13'
  - number: 15.01.2.c
    text: |-
      Oliekachels met verdampingsbranders als bedoeld in [artikel 13.04][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel13
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '13'
        hoofdstuk: '13'
  - number: 15.01.2.d
    text: |-
      Verwarmingsapparaten en verwarmingsketels als bedoeld in [artikel 13.07][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel13
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '13'
        hoofdstuk: '13'
  - number: 15.01.2.e
    text: |-
      Vloeibaargasinstallaties als bedoeld in [hoofdstuk 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '14'
  - number: 15.01.3
    text: |-
      Schepen, die niet van eigen mechanische middelen tot voortbeweging zijn voorzien, kunnen niet tot het vervoer van
      passagiers worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
  - number: 15.01.4
    text: |-
      Op passagiersschepen moeten ruimten beschikbaar zijn voor mensen met een beperkte mobiliteit, die aan de in dit
      hoofdstuk genoemde bepalingen voldoen. In geval de toepassing van de in dit hoofdstuk genoemde bepalingen, die te
      maken hebben met het rekening houden met de bijzondere veiligheidsbehoeften van personen met beperkte mobiliteit,
      praktisch moeilijk uitvoerbaar is of onevenredig hoge kosten veroorzaakt, kan de Commissie van Deskundigen op grond
      van aanbevelingen van de Centrale Commissie voor de Rijnvaart afwijkingen van deze voorschriften toestaan. Deze
      afwijkingen moeten in het certificaat van onderzoek worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.01
  - number: 15.02.1
    text: |-
      Bij een onderzoek overeenkomstig [artikel 2.09][ref1] wordt de dikte van de scheepshuid van stalen
      passagiersschepen als volgt vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 15.02.1.a
    text: |-
      De minimale dikte t van de bodem-, kim- en zijbeplating van de scheepshuid van passagiersschepen wordt bepaald
      volgens de grootste waarde van de volgende formules: Daarbij betekent: f = 1 + 0,0013· (a – 500); a = spantafstand
      in de lengte of de breedte [mm]; bij een kleinere spantafstand dan 400 mm moet a = 400 mm worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.1.b
    text: |-
      De uit onderdeel a voortvloeiende minimale waarde voor de plaatdikte behoeft niet te worden gehaald, wanneer de
      toegestane waarde op basis van een rekenkundig bewijs voor de voldoende sterkte van de scheepsromp (langs- en
      dwarssterkte als ook plaatselijke sterkte) is vastgelegd en dit uit een verklaring blijkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.1.c
    text: |-
      Op geen enkele plaats van de scheepshuid mag de volgens onderdeel a of onderdeel b berekende waarde minder zijn dan
      3 mm.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.1.d
    text: |-
      Platen moeten worden vervangen, wanneer de dikte van de bodem-, kim- of zijplaten niet langer de volgens onderdelen
      a of b, in samenhang met onderdeel c, vastgestelde minimale waarde heeft.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.2
    text: |-
      Het aantal en de indeling van de schotten moeten zodanig zijn gekozen dat het schip in lekke toestand volgens
      de standaarden van [artikel 15.03, zevende tot en met dertiende lid][ref1], kan blijven drijven. Ieder deel van
      de interne constructie, die de functionaliteit van de indeling van het schip beïnvloedt, moet waterdicht en zo
      geconstrueerd zijn, dat de integriteit van de indeling in stand blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.02.3
    text: |-
      De afstand tussen het aanvaringsschot en de voorloodlijn mag niet kleiner zijn dan 0,04 L en niet groter dan 0,04 L
      + 2 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.4
    text: |-
      In een dwarsschot mag een sprong of nis voorkomen, mits alle delen van de sprong of nis binnen de veilige zone
      zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.5
    text: |-
      De schotten die bij de lekberekening als bedoeld in [artikel 15.03, zevende tot en met dertiende lid][ref1],
      in aanmerking zijn genomen, moeten waterdicht zijn en tot boven het schottendek opgetrokken zijn. Ontbreekt het
      schottendek, dan moeten zij tenminste 0,20 m boven de indompelingsgrenslijn zijn opgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.02.6
    text: |-
      Het aantal openingen in deze schotten moet zo gering worden gehouden als vanwege de bouwwijze en voor de normale
      bedrijfsvoering van het schip toelaatbaar is. Openingen en doorvoeringen mogen de waterdichte functie van de
      schotten niet nadelig beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.7
    text: In het aanvaringsschot zijn openingen en deuren niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.8
    text: |-
      In schotten als bedoeld in het vijfde lid die machinekamers van passagiersruimten of woonruimten voor het
      boordpersoneel scheiden, zijn deuren niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.9
    text: |-
      Met de hand te bedienen deuren in schotten als bedoeld in het vijfde lid die niet op afstand bediend kunnen worden,
      zijn slechts toegestaan buiten de voor passagiers bestemde plaatsen. Zij moeten:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.9.a
    text: voortdurend gesloten blijven en mogen slechts voor passage kortstondig worden geopend;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.9.b
    text: snel en veilig door geschikte inrichtingen gesloten kunnen worden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.9.c
    text: 'aan beide zijden voorzien zijn van het opschrift: ‘Deur na doorgang direct sluiten’.'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.10
    text: 'Deuren in schotten als bedoeld in het vijfde lid die langdurig open staan moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.10.a
    text: |-
      Zij moeten ter plaatse aan beide zijden van het schot en vanaf een goed toegankelijke plaats boven het schottendek
      kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.10.b
    text: |-
      Na sluiting door afstandsbediening moeten de deuren ter plaatse opnieuw kunnen worden geopend en op veilige wijze
      worden gesloten. Het afsluitproces mag met name niet door tapijten of drempels gehinderd worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.10.c
    text: |-
      De duur van het sluiten door afstandsbediening moet ten minste 30 seconden bedragen, maar mag niet meer bedragen
      dan 60 seconden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.10.d
    text: Tijdens het sluiten moet bij de deur automatisch een akoestisch alarmsignaal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.10.e
    text: |-
      Gewaarborgd moet zijn dat het bedienen van deur en het alarmsignaal ook onafhankelijk van het boordnet kunnen
      geschieden. Ter plaatse van de afstandsbediening moet een inrichting aanwezig zijn die aangeeft of de deur open dan
      wel gesloten is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.11
    text: |-
      Alle deuren in schotten als bedoeld in het vijfde lid en hun bedieningsinrichtingen moeten in de veilige zone
      liggen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.12
    text: |-
      In het stuurhuis moet een alarminstallatie aanwezig zijn, die aangeeft welke deur in schotten als bedoeld in het
      vijfde lid geopend is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.13
    text: |-
      Pijpleidingen met open uitmondingen en ventilatiekanalen moeten zo zijn aangelegd, dat daardoor bij elke
      lektoestand geen water naar andere ruimten of tanks kan stromen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.13.a
    text: |-
      Wanneer verschillende afdelingen door middel van pijpleidingen of ventilatiekanalen met elkaar in open verbinding
      staan, moeten deze op een geschikte plaats tot boven de ongunstigste lastlijn in lekke toestand worden geleid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.13.b
    text: |-
      Pijpleidingen behoeven niet aan onderdeel a te voldoen, wanneer op de doorboorde schotten afsluiters zijn
      aangebracht, die van boven het schottendek op afstand kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.13.c
    text: |-
      Wanneer een pijpleidingsysteem in een afdeling geen open uitmonding heeft, wordt de pijpleiding bij beschadiging
      van deze afdeling als onbeschadigd beschouwd, wanneer zij binnen de veilige zone loopt en de afstand tot de
      scheepsbodem meer dan 0,50 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.14
    text: |-
      Afstandsbedieningen van deuren in schotten als bedoeld in het tiende lid en afsluitmechanismen als bedoeld in het
      dertiende lid, onder b, boven het schottendek moeten als zodanig duidelijk gemarkeerd zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.15
    text: Bij een dubbele bodem moet de hoogte daarvan en bij dubbele wanden de breedte daarvan tenminste 0,60 m bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
  - number: 15.02.16
    text: |-
      Vensters mogen onder de indompelingsgrenslijn liggen, wanneer zij waterdicht zijn, niet geopend kunnen worden, een
      voldoende sterkte bezitten en voldoen aan [artikel 15.06, veertiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.03.1
    text: |-
      De aanvrager moet het bewijs van voldoende stabiliteit van het onbeschadigde schip leveren met een berekening die
      is gebaseerd op de resultaten van het toepassen van een standaard van voldoende stabiliteit van het onbeschadigde
      schip. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij aan trim en inzinking geen vaste waarden
      zijn toegekend. De gegevens van het lege schip waarop de stabiliteitsberekeningen zijn gebaseerd moeten door een
      hellingproef worden berekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.2
    text: 'De intactstabiliteit moet voor de volgende standaard beladingcondities worden aangetoond:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.2.a
    text: bij het begin van de vaart 100% passagiers; 98% brandstof en drinkwater; 10% afvalwater;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.2.b
    text: tijdens de vaart 100% passagiers, 50% brandstof en drinkwater, 50% afvalwater;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.2.c
    text: bij het eind van de vaart 100% passagiers, 10% brandstof en drinkwater, 98% afvalwater;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.2.d
    text: leeg schip geen passagiers, 10% brandstof en drinkwater, geen afvalwater.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3
    text: |-
      Het bewijs van voldoende stabiliteit van het onbeschadigde schip via een berekening moet worden geleverd met
      toepassing van de volgende eisen voor voldoende stabiliteit van het onbeschadigde schip en voor de in het tweede
      lid, onder a tot en met d, genoemde standaard beladingcondities:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.a
    text: |-
      De maximale oprichtende arm van statische stabiliteit h moet bij een slagzij van φ≥ (φ + 3°) optreden en moet ten
      minste 0,20 m bedragen. Wanneer φ < φ is moet de oprichtende arm van statische stabiliteit bij een hoek van het
      onder water komen φ ten minste 0,20 m bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.b
    text: De hoek van het onderwater komen φ mag niet kleiner zijn dan (φ + 3°).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.c
    text: |-
      Het vlak A onder de kromme van de oprichtende arm van statische stabiliteit moet, afhankelijk van de positie van φ
      en φ tenminste de volgende waarden bereiken:








                        Geval



                        φ


                        A






                        1


                        φ ≥ 15° of φ≥ 15°


                        φ≤ φ


                        0,05 m·rad tot aan kleinste van de hoeken φ of φ




                        2


                        15° < φ < 30°


                        0,035 + 0,001*(30 – φ) m·rad tot aan de hoek φ




                        3


                        15° < φ < 30°


                        φ > φ


                        0,035 + 0,001*(30 – φ) m·rad tot aan de hoek φ




                        4


                        φ ≥ 30° en φ≥ 30°


                        0,035 m·rad tot aan de hoek φ = 30°




               Daarbij betekent:






                        h


                        de maximale oprichtende arm van statische stabiliteit




                        φ


                        de hoek van de slagzij




                        φ


                        de hoek van het onderwater komen, dat wil zeggen de hoek van de slagzij waarbij de openingen in
      de scheepsromp, in de opbouwen of dekhuizen, die niet waterdicht gesloten kunnen worden, onderwater komen te staan




                        φ


                        de maximale hoek van de slagzij als bedoeld onder e




                        φ


                        de hoek van de slagzij waarbij sprake is van de maximale oprichtende arm van statische
      stabiliteit




                        A


                        vlakken onder de kromme van de oprichtende arm van statische stabiliteit
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.d
    text: |-
      De metacentrische hoogte bij het begin van GM, gecorrigeerd in verband met het effect van de vrije oppervlakken in
      vloeistoftanks, mag niet minder bedragen dan 0,15 m;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.e
    text: 'De hoek van de slagzij φ mag in de beide hiernavolgende gevallen niet meer bedragen dan 12°:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.e.aa
    text: op basis van het kenterende moment tengevolge van personen en wind als bedoeld in het vierde en vijfde lid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.e.bb
    text: |-
      op basis van het kenterende moment tengevolge van personen en het draaien van het schip als bedoeld in het vierde
      en zesde lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.f
    text: |-
      Het resterende vrijboord mag bij een kenterend moment tengevolge van personen, wind en het draaien van het schip
      als bedoeld in het vierde, vijfde en zesde lid, niet minder bedragen dan 0,2 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.3.g
    text: |-
      De resterende veiligheidsafstand moet voor schepen met vensters, of andere openingen in de scheepshuid die beneden
      het schottendek zijn gelegen en die niet waterdicht gesloten zijn, tenminste 0,1 m bedragen uitgaande van de drie
      kenterende momenten, bedoeld in onderdeel f.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.4
    text: |-
      Het kenterende moment tengevolge van een concentratie van personen (M) op één plaats moet op grond van de volgende
      formule als volgt worden berekend: In deze formule betekent:






                    P =


                    totale massa van personen aan boord in [t], te berekenen uit de som van het ten hoogste
      toegelaten aantal passagiers en het maximale aantal van het boordpersoneel en de bemanning onder normale
      bedrijfsomstandigheden onder aanname van een gemiddelde massa van 0,075 t per persoon




                    y =


                    zijdelingse afstand van het zwaartepunt van de massa van personen P vanaf de middellijn van het schip
      in [m]




                    g =


                    acceleratie van de zwaartekracht (g = 9,81 m/s2)




                    P =


                    massa van de op een vlak A verzamelde personen volgens:




                    P =


                    n· 0,075·A[t]







                    Daarbij betekent in deze formule:




                    A =


                    vlak, waarop zich personen bevinden in [m2]




                    n =


                    aantal personen per vierkante meter bij:




                    n =


                    3,75, in geval van vrije dekoppervlakken en vlakken met verplaatsbaar meubilair; in geval van vlakken
      met vast ingebouwde zitplaatsen zoals banken, moet n worden berekend onder aanname van een zitbreedte van 0,45 m en
      een zitdiepte van 0,75 m per persoon




                    y =


                    zijdelingse afstand van het vlakzwaartepunt van het vlak A vanaf de middellijn van het schip in [m]




           De berekening moet worden uitgevoerd zowel voor een concentratie van personen aan stuurboord als voor
      een concentratie aan bakboord. De verdeling van personen moet de meest ongunstige zijn vanuit het oogpunt van
      stabiliteit. Ingeval er hutten aanwezig zijn moet voor de berekening van het moment van personen ervan worden
      uitgegaan dat deze niet bezet zijn. Voor de berekening van beladen situaties moet het middelpunt van de zwaarte van
      een persoon worden genomen op 1 m boven het laagste punt van het betreffende dek op 0,5 L zonder rekening te houden
      met een verlaging of verhoging in het dek of de kromming van het dek en onder aanname van een massa van 0,075
      per persoon. Een gedetailleerde vaststelling van de vlakken aan dek, die door personen bezet zijn, kan achterwege
      blijven, indien de volgende waarden worden toegepast:






                    P =


                    1,1· F· 0,075 in het geval van schepen voor dagtochten
                    1,5· F· 0,075 in het geval van hotelschepen
                    In deze formules betekent:
                    F = het ten hoogste aan boord toegelaten aantal passagiers;
                    y = B/2 in [m]
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.5
    text: |-
      Het moment tengevolge van wind (M) moet als volgt worden berekend: M = p·A· (I + T/2) [kNm] In deze formule
      betekent: p = specifieke winddruk van 0,25 kN/m2; A = zijdelings oppervlak van het schip boven het vlak van de
      inzinking in [m2] die overeenkomt met de betreffende beladingstoestand; l = afstand van het zwaartepunt van het
      zijdelingse vlak A tot het vlak van de inzinking in m die overeenkomt met de betreffende beladingstoestand in [m].
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.6
    text: |-
      Het moment tengevolge van de centrifugale kracht (M), veroorzaakt door het draaien van het schip, moet als volgt
      worden berekend: M = c· C· v2· D/L·(KG – T/2) [kNm] In deze formule betekent: c = coëfficiënt van 0,45; C = de
      blokcoëfficiënt (indien niet bekend moet hiervoor 1,0 worden aangenomen); v = grootste snelheid van het schip in m/
      s; KG = afstand van het zwaartepunt tot de bovenkant van de kiel in m. In geval het passagierschip is uitgerust met
      een aandrijfsysteem overeenkomstig [artikel 6.06][ref1] moet M worden afgeleid uit beproevingen op ware grootte dan
      wel met modellen, hetzij op basis van daarmee overeenkomende berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel6
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '6'
        hoofdstuk: '6'
  - number: 15.03.7
    text: |-
      De aanvrager moet met een berekening, die berust op de procedure van het wegvallen van het drijfvermogen, aantonen
      dat de lekstabiliteit van het schip voldoende is. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij
      aan trim en inzinking geen vaste waarden zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.8
    text: |-
      Het drijfvermogen in lekke toestand moet voor de in het tweede lid bedoelde standaard beladingcondities worden
      aangetoond. Hierbij moet voor drie tussenstadia van het volstromen (25%, 50% en 75% van de eindtoestand van
      het volgestroomd zijn) en voor de eindtoestand van het volgelopen zijn aan het rekenkundig bewijs van voldoende
      stabiliteit zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.9
    text: |-
      Passagiersschepen moeten voldoen aan de 1-compartimentstatus en aan de 2-compartimentstatus. De volgende indicaties
      moeten voor het geval van een lekke toestand in acht worden genomen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.9.a
    text: |-
      Voor de 1-compartimentstatus kunnen de schotten als onbeschadigd worden beschouwd, wanneer de onderlinge afstand
      tussen twee aangrenzende schotten groter is dan de lengte van het lek. Langsschotten die zich op een afstand
      van minder dan B/3 ten opzichte van de scheepshuid bevinden, gemeten in een rechte hoek ten opzichte van de
      scheepsmiddellijn in het vlak van de grootste inzinking, mogen in de berekening niet worden meegenomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.9.b
    text: |-
      Voor de 2-compartimentstatus wordt ieder schot dat is gelegen binnen het gebied waar het lek van invloed is
      als beschadigd aangemerkt. Dit betekent dat de plaats van de schotten zodanig moet worden gekozen, dat het
      passagiersschip na het volstromen van twee of meer aangrenzende compartimenten in de langsrichting nog kan blijven
      drijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.9.c
    text: |-
      Het laagste punt van iedere niet waterdichte opening (bijvoorbeeld van deuren, vensters, luiken) moet bij de
      eindtoestand van het volgestroomd zijn tenminste 0,10 m boven de lastlijn in lekke toestand liggen. Het schottendek
      mag bij de eindtoestand van het volstromen niet onder water komen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.9.d
    text: |-
      Er wordt met een permeabiliteit van 95% rekening gehouden. Wordt door een berekening aangetoond, dat de gemiddelde
      permeabiliteit van een compartiment kleiner is dan 95%, dan kan de berekende waarde worden aangehouden. De volgende
      waarden moeten tenminste worden bereikt: - verblijfsruimten 95%;
        - machinekamers en ketelruimen 85%;
        - bagage- en voorraadruimten 75%;
        - dubbele bodems, brandstoftanks, ballasttanks en andere tanks, al naar gelang deze tanks uit hoofde van hun
      bestemming bij het in het vlak van de grootste inzinking liggende schip als vol of leeg moeten worden aangenomen 0
      of 95%.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.9.e
    text: |-
      Ingeval een lek van kleinere omvang als hierboven aangegeven leidt tot ongunstiger verhoudingen met betrekking tot
      slagzij of verlies aan metacentrische hoogte, moet een zodanig lek bij de berekening worden betrokken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.10
    text: 'Bij alle tussenstadia van het vollopen als bedoeld in het achtste lid moet aan de volgende criteria worden voldaan:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.10.a
    text: |-
      de hoek van de slagzij φ van de evenwichtssituatie van het betreffende tussenstadium mag niet meer bedragen dan
      15°;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.10.b
    text: |-
      afgezien van de slagzij vanuit de evenwichtssituatie van het betreffende tussenstadium moet het positieve bereik
      van de kromme van de armen van statische stabiliteit een oprichtende arm van statische stabiliteit aangeven van GZ
      ≥ 0,02 m, voordat de eerste onbeschermde opening onder water komt dan wel een hoek van de slagzij φ van 25° bereikt
      wordt;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.10.c
    text: |-
      niet waterdichte openingen mogen niet onder water komen voordat de slagzij vanuit de evenwichtssituatie van het
      betreffende tussenstadium is bereikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.10.d
    text: |-
      Voor de berekening van het effect van de vrije oppervlakken bij alle tussenstadia van het volstromen wordt
      uitgegaan van het bruto grondvlak van de beschadigde ruimten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.11
    text: |-
      Bij de eindtoestand van het volgestroomd zijn moet aan de volgende criteria worden voldaan met inachtneming van het
      kenterende moment, bedoeld in het vierde lid:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.11.a
    text: de hoek van de slagzij φ mag niet meer bedragen dan 10°;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.11.b
    text: |-
      afgezien van de evenwichtssituatie moet het positieve bereik van de kromme van armen van statische stabiliteit een
      oprichtende arm van statische stabiliteit aangeven van GZ≥ 0,02 m gecombineerd met een vlak A ≥ 0,0025 m∙rad. Deze
      minimumwaarden van de stabiliteit moeten worden bereikt tot aan het onder water komen van de eerste onbeschermde
      opening of in ieder geval vóór het bereiken van een hoek van de slagzij van 25°; Daarbij betekent






                        φ


                        de hoek van de slagzij bij het volledig onderwater komen met inachtneming van het moment als
      bedoeld in het vierde lid;




                        φ


                        de hoek van de afnemende stabiliteit dan wel de hoek waarbij de eerste onbeschermde opening onder
      water komt, of 25°; de kleinste van deze waarden moet worden aangehouden;




                        GZ


                        de resterende oprichtende arm van statische stabiliteit bij volledig onder water komen met
      inachtneming van het kenterende moment als bedoeld in het vierde lid;




                        GZ


                        het moment van de arm van statische stabiliteit resulterend uit het moment als bedoeld in het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.11.c
    text: |-
      niet waterdichte openingen mogen niet onder water komen voordat de evenwichtssituatie is bereikt. Ingeval dat
      dergelijke openingen onder water komen voordat dit punt is bereikt moeten de ruimten die daarmee in verbinding
      staan bij de berekening van de lekstabiliteit als volgestroomd worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.12
    text: |-
      Afsluitvoorzieningen van openingen die waterdicht afsluitbaar moeten zijn, moeten als zodanig duidelijk gemarkeerd
      worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.13
    text: |-
      Wanneer doorstroomopeningen in de langsschotten worden voorzien ten behoeve van vermindering van asymmetrisch
      volstromen, moeten deze aan de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.13.a
    text: Voor de berekening van het uit dwarsrichting volstromen moet de IMO resolutie A. 266 (VIII) worden toegepast;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.13.b
    text: ze moeten automatisch functioneren;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.13.c
    text: ze mogen niet van afsluitmechanismen zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.03.13.d
    text: de tijd die nodig is voor een volledige vereffening mag niet meer bedragen dan 15 minuten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.03
  - number: 15.04.1
    text: 'De veiligheidsafstand moet ten minste gelijk zijn aan de som van:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
  - number: 15.04.1.a
    text: |-
      de extra zijdelingse inzinking die, gemeten langs de scheepshuid, ontstaat door de toelaatbare slagzij, bedoeld in
      [artikel 15.03, derde lid, onder e][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.04.1.b
    text: |-
      de resterende veiligheidsafstand, bedoeld in [artikel 15.03, derde lid, onder g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.04.2
    text: 'Het vrijboord moet ten minste gelijk zijn aan de som van:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
  - number: 15.04.2.a
    text: |-
      de extra zijdelingse inzinking die door de volgens [artikel 15.03, derde lid, onder e][ref1], berekende slagzij,
      gemeten langs de scheepshuid, ontstaat, en


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.04.2.b
    text: |-
      het resterende vrijboord, bedoeld in [artikel 15.03, derde lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.04.3
    text: |-
      Het vlak van de grootste inzinking moet zodanig worden vastgesteld dat zowel de veiligheidsafstand als bedoeld in
      het eerste lid als het vrijboord als bedoeld in het tweede lid als de [artikelen 15.02][ref1] en [15.03][ref2] in
      acht zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.04.4
    text: |-
      De Commissie van Deskundigen kan uit veiligheidsoverwegingen een grotere veiligheidsafstand of een groter vrijboord
      bepalen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.04
  - number: 15.05.1
    text: |-
      De Commissie van Deskundigen bepaalt het ten hoogste toegelaten aantal passagiers en tekent dit in het certificaat
      van onderzoek aan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.05
  - number: 15.05.2
    text: 'Het ten hoogste toegelaten aantal passagiers mag niet meer zijn dan:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.05
  - number: 15.05.2.a
    text: |-
      het aantal passagiers waarvoor een verzamelruimte, bedoeld in [artikel 15.06, achtste lid][ref1], is aangetoond;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.05.2.b
    text: |-
      het aantal passagiers waarvoor de stabiliteitsberekening, bedoeld in [artikel 15.03][ref1], is uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.05.2.c
    text: het aantal beschikbare bedden voor passagiers op hotelschepen, die voor reizen met overnachting worden ingezet.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.05
  - number: 15.05.3
    text: |-
      Voor hotelschepen die ook als schip voor dagtochten worden ingezet moet het aantal passagiers zowel voor een schip
      voor dagtochten als voor een hotelschip worden berekend en in het certificaat van onderzoek worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.05
  - number: 15.05.4
    text: |-
      Het ten hoogste toegelaten aantal passagiers moet aan boord op een opvallende plaats duidelijk leesbaar worden
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.05
  - number: 15.06.1
    text: 'Passagiersverblijven moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.1.a
    text: |-
      zich op alle dekken achter het vlak van het aanvaringsschot en, voorzover ze onder het schottendek zijn gelegen,
      vóór het vlak van het achterpiekschot bevinden, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.1.b
    text: gasdicht gescheiden zijn van machinekamers en ketelruimen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.2
    text: |-
      Kasten als bedoeld in [artikel 11.13][ref1] en ruimten voor brandbare vloeistoffen moeten zich buiten het gebied
      bestemd voor passagiers bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel11
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '11'
        hoofdstuk: '11'
  - number: 15.06.3
    text: 'Aantal en breedte van uitgangen van passagiersverblijven moeten aan de volgende voorwaarden voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.3.a
    text: |-
      Verblijven of groepen van verblijven die voor 30 of meer passagiers zijn bestemd of ingericht, dan wel voor 12 of
      meer passagiers bedden bieden, moeten ten minste twee uitgangen hebben. Op schepen voor dagtochten mag één van deze
      twee uitgangen door twee nooduitgangen worden vervangen. Ruimten met uitzondering van hutten dan wel groepen van
      ruimten, die slechts één uitgang hebben, moeten tenminste één nooduitgang hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.3.b
    text: |-
      Indien zich verblijven onder het schottendek bevinden, mag één van de uitgangen een waterdichte deur in een schot,
      bedoeld in [artikel 15.02, tiende lid][ref1], zijn die toegang geeft tot een aangrenzende afdeling van waaruit het
      hoger gelegen dek rechtstreeks kan worden bereikt. De andere uitgang moet direct of, wanneer dit overeenkomstig
      onderdeel a is toegestaan, als nooduitgang naar het schottendek dan wel naar buiten leiden. Dit geldt niet voor de
      afzonderlijke hutten.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.06.3.c
    text: |-
      Uitgangen, bedoeld onder a en b, moeten doelmatig zijn aangebracht en een vrije breedte van tenminste 0,80 m en een
      vrije hoogte van tenminste 2,00 m hebben. Bij deuren van hutten voor passagiers en andere kleine verblijven mag de
      vrije breedte worden verminderd tot 0,70 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.3.d
    text: |-
      Bij verblijven of groepen van verblijven die voor meer dan 80 passagiers zijn bestemd moet het totaal van de
      breedte van alle uitgangen die voor passagiers zijn bestemd, en door hen in geval van nood moeten worden gebruikt,
      tenminste 0,01 m per passagier bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.3.e
    text: |-
      Indien het aantal passagiers voor de totale breedte van alle uitgangen maatgevend is, moet de breedte van elke
      uitgang ten minste 0,005 m per passagier bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.3.f
    text: |-
      Nooduitgangen moeten een kleinste zijdelingse lengte van tenminste 0,60 m hebben of een minimale diameter van 0,70
      m. Zij moeten kunnen worden geopend in de vluchtrichting en aan beide zijden zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.3.g
    text: |-
      Uitgangen van verblijven die zijn bestemd om gebruikt te worden door personen met beperkte mobiliteit, moeten een
      vrije breedte hebben van tenminste 0,90 m. Uitgangen die gewoonlijk worden gebruikt voor het aan- of van boord gaan
      van personen met beperkte mobiliteit, moeten over een vrije breedte beschikken van 1,50 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.4
    text: 'Deuren van passagiersverblijven moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.4.a
    text: |-
      Met uitzondering van deuren die naar verbindingsgangen leiden, moeten ze naar buiten opengaan of als schuifdeuren
      zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.4.b
    text: Hutdeuren moeten zodanig zijn uitgevoerd dat zij te allen tijde ook van buitenaf kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.4.c
    text: Automatische deuren moeten wanneer de aandrijfenergie uitvalt gemakkelijk kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.4.d
    text: |-
      Bij deuren die zijn bestemd om gebruikt te worden door personen met beperkte mobiliteit moet aan de zijde waarnaar
      de deur opengaat een zijdelingse afstand bestaan tussen binnenkant van de deurpost aan de kant van het slot en de
      naburige loodrecht op het vlak van de deur aangebrachte wand van tenminste 0,60 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5
    text: 'Verbindingsgangen moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5.a
    text: |-
      Zij moeten een vrije breedte hebben van ten minste 0,80 m. Wanneer zij naar ruimten leiden die voor meer dan 80
      passagiers zijn voorzien, moeten zij aan de in het derde lid, onderdeel d en e, bedoelde vereisten ten aanzien van
      de breedte van de naar de verbindingsgangen leidende uitgangen voldoen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5.b
    text: Hun vrije hoogte mag niet minder zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5.c
    text: |-
      Verbindingsgangen die zijn bestemd voor het gebruik door personen met een beperkte mobiliteit moeten een vrije
      breedte hebben van minstens 1,30 m. Verbindingsgangen met een breedte van meer dan 1,50 m moeten aan beide zijden
      van een handrail zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5.d
    text: |-
      Indien slechts één verbindingsgang of -trap naar een voor passagiers bestemde ruimte leidt, moet de vrije breedte
      daarvan tenminste 1,00 m bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5.e
    text: Verbindingsgangen mogen geen treden of niveauverschillen hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5.f
    text: Zij mogen alleen naar vrije dekken, ruimten of trappen leiden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.5.g
    text: Doodlopende gedeelten van verbindingsgangen mogen niet langer dan twee meter zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.6
    text: 'Vluchtwegen moeten behalve aan het vijfde lid aan de volgende voorwaarden voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.6.a
    text: |-
      Bij de inrichting van trappen, uitgangen en nooduitgangen moet ingecalculeerd zijn dat bij brand in een willekeurig
      verblijf alle andere verblijven verlaten kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.6.b
    text: Vluchtwegen moeten de kortste weg volgen naar verzamelruimten als bedoeld in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.6.c
    text: Vluchtwegen mogen niet door machinekamers en keukens leiden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.6.d
    text: In vluchtwegen mogen geen gangen met klimtreden, ladders en dergelijke zijn ingebouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.6.e
    text: |-
      Deuren in vluchtwegen moeten zodanig zijn gebouwd dat ze geen inbreuk maken op de minimale breedte van vluchtwegen
      als bedoeld in het vijfde lid, onder a of d.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.6.f
    text: |-
      Vluchtwegen en nooduitgangen moeten duidelijk zijn gemarkeerd. De markeringen moeten door de noodverlichting worden
      aangestraald.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.7
    text: Vluchtwegen en nooduitgangen moeten beschikken over een geschikt veiligheidsgeleidesysteem.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8
    text: 'Voor alle personen aan boord moeten verzamelruimten beschikbaar zijn, die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.a
    text: |-
      De totale oppervlakte (A van de verzamelruimten moet tenminste voldoen aan de volgende waarde: Schepen voor
      dagtochten A = 0,35 · F [m2] Hotelschepen A = 0,45 · F [m2] In deze formule betekent: F ten hoogste toegelaten
      aantal passagiers aan boord.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.b
    text: Iedere individuele verzamel- en evacuatieruimte moet groter zijn dan 10 m2.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.c
    text: De verzamelruimten moeten vrij zijn van zowel losstaand als vast meubilair.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.d
    text: |-
      Indien zich in een ruimte, waarin een verzamelruimte aangewezen is, verplaatsbaar meubilair bevindt, moet dit
      voldoende zijn beveiligd tegen verschuiven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.e
    text: |-
      Indien zich in een ruimte, waarin een verzamelruimte aangewezen is, vast ingebouwde zitplaatsen bevinden, behoeft
      het aantal personen waarvoor de ruimte geschikt is bij de berekening van het totaal van de oppervlakken van de in
      onderdeel a bedoelde verzamelruimten niet in acht te worden genomen. Het aantal personen waarvoor in een ruimte
      vast ingebouwde zitplaatsen zijn voorzien mag echter niet groter zijn dan het aantal personen waarvoor in dezelfde
      ruimte verzamelruimten beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.f
    text: Vanuit de evacuatieruimten moeten de reddingsmiddelen eenvoudig toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.g
    text: Een veilige evacuatie van personen vanuit de evacuatieruimten moet aan beide zijden van het schip mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.h
    text: De verzamelruimten moeten boven de indompelingsgrenslijn liggen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.i
    text: |-
      De verzamel- en evacuatieruimten moeten in het veiligheidsplan als zodanig worden aangegeven en aan boord worden
      gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.j
    text: De voorschriften, bedoeld onder d en e, gelden eveneens voor open dekken waarop verzamelruimten zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.k
    text: |-
      Indien geëigende gemeenschappelijke reddingsmiddelen aan boord aanwezig zijn, behoeft het aantal personen, waarvoor
      zij geschikt zijn, bij de berekening van het totaaloppervlak van de verzamelruimten, bedoeld onder a, niet in acht
      te worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.8.l
    text: |-
      Het totaaloppervlak, bedoeld onder a, moet echter voor alle gevallen, waarbij een reductie overeenkomstig de
      onderdelen e, j en k wordt toegepast, voor tenminste 50% van het ten hoogste toegelaten aantal passagiers aan boord
      toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9
    text: 'Trappen in het gedeelte voor passagiers en hun portalen moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.a
    text: 'overeenkomstig de Europese norm EN 13056: 2000, zijn gebouwd;'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.b
    text: |-
      een vrije breedte van tenminste 0,80 m hebben dan wel, wanneer zij naar verbindingsgangen of trappen leiden die
      door meer dan 80 passagiers worden gebruikt, van tenminste 0,01 m per passagier;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.c
    text: |-
      een vrije breedte van minstens 1,00 m hebben, wanneer zij naar een voor passagiers bestemde ruimte leiden, die
      slechts over deze verbindingstrap toegankelijk is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.d
    text: |-
      zich in de veilige zone bevinden voorzover aan iedere zijde van het schip in dezelfde ruimte niet tenminste één
      trap beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.e
    text: |-
      bovendien, indien zij zijn bestemd voor het gebruik door personen met beperkte mobiliteit, aan de volgende eisen
      voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.e.aa
    text: De helling van de trappen mag niet steiler zijn dan 38°.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.e.bb
    text: De trappen moeten een vrije breedte hebben van minstens 0,90 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.e.cc
    text: Wenteltrappen zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.e.dd
    text: Trappen mogen niet in dwarsrichting in het schip zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.e.ee
    text: |-
      De leuningen van trappen moeten aan het begin en het eind van een horizontale uitloop van 0,30 m zijn voorzien
      zodanig, dat zij doorgang voorlangs niet bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.9.e.ff
    text: |-
      Leuningen en voorkanten tenminste van de eerste en de laatste trede alsook de vloerbedekking aan de uiteinden van
      de trap moeten wat de kleur betreft contrasteren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.10
    text: 'De voor passagiers bestemde, niet afgesloten delen van de dekken moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.10.a
    text: |-
      Zij moeten door een vaste verschansing van tenminste 1,00 m hoogte of een reling volgens de Europese norm EN 711 :
      1995, bouwwijze PF, PG of PZ, zijn omgeven. Verschansing en relingen van dekken die zijn bestemd voor het gebruik
      door personen met beperkte mobiliteit moeten een hoogte hebben van tenminste 1,10 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.10.b
    text: |-
      Openingen en inrichtingen voor embarkeren en debarkeren en voor laden en lossen moeten kunnen worden beveiligd
      en een vrije breedte hebben van tenminste 1,00 m. Openingen die gewoonlijk worden gebruikt voor embarkeren en
      debarkeren van personen met beperkte mobiliteit moeten een vrije breedte hebben van tenminste 1,50 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.10.c
    text: |-
      Indien de openingen en inrichtingen voor embarkeren en debarkeren niet vanuit het stuurhuis te zien zijn, moeten er
      optische of elektronische hulpmiddelen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.11
    text: |-
      De gedeelten van het schip die niet voor passagiers zijn bestemd, met name de toegangen tot het stuurhuis, tot
      de lieren en tot de machinekamers, moeten voor het betreden door onbevoegden kunnen worden beveiligd. Bij deze
      toegangen moet bovendien op een opvallende plaats een teken overeenkomstig schets 1 van [bijlage I][ref1] zijn
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 15.06.12
    text: |-
      Loopplanken moeten overeenkomstig de Europese norm EN 114206 : 2003, zijn vervaardigd. In afwijking van
      [artikel 10.02, tweede lid, onder d][ref1], mag hun lengte minder dan 4 m bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.06.13
    text: |-
      Doorgangsruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit moeten een vrije breedte
      van tenminste 1,30 m hebben en vrij zijn van drempels en opstaande randen die een hoogte van 0,025 m te boven
      gaan. Wanden van doorgangsruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit moeten zijn
      voorzien van handrelingen op een hoogte van 0,90 m boven de vloer.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.14
    text: |-
      Glazen deuren, glazen wanden van doorgangsruimten en vensterruiten moeten van voorgespannen glas of van gelaagd
      glas zijn vervaardigd. Zij mogen ook van kunststof zijn vervaardigd, indien dit uit een oogpunt van brandveiligheid
      toelaatbaar is. Doorzichtige deuren en tot aan de vloer doorlopende doorzichtige wanden van doorgangsruimten moeten
      opvallend zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.15
    text: |-
      Opbouwen die volledig of waarvan de daken uit panoramaruiten bestaan mogen slechts van materiaal zijn vervaardigd
      dat ingeval van schade de kans op verwonding van personen aan boord zo klein mogelijk houdt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.16
    text: |-
      Drinkwaterinstallaties moeten tenminste aan de eisen van [artikel 12.05][ref1] voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel12
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '12'
        hoofdstuk: '12'
  - number: 15.06.17
    text: |-
      Er moeten toiletten voor passagiers beschikbaar zijn. Tenminste één toilet moet volgens een betreffende norm
      of voorschrift van een van de Rijnoeverstaten of België voor het gebruik door personen met beperkte mobiliteit
      uitgevoerd zijn en via een passagiersverblijf dat is bestemd voor het gebruik door personen met beperkte mobiliteit
      te bereiken zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.18
    text: |-
      Hutten die geen venster hebben dat geopend kan worden moeten zijn aangesloten op een airconditioning- of
      ventilatiesysteem.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.06.19
    text: Op verblijven waarin bemanning of boordpersoneel is ondergebracht is dit artikel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.06
  - number: 15.07.1
    text: |-
      Behalve met het hoofd voortstuwingssysteem moet het schip zijn uitgerust met een tweede onafhankelijk
      voortstuwingssysteem, dat garandeert dat het schip bij uitval van het hoofd voortstuwingssysteem zich op eigen
      kracht kan voortbewegen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.07
  - number: 15.07.2
    text: |-
      Het tweede onafhankelijke voortstuwingssysteem moet zich in een aparte machinekamer bevinden.
      Wanneer de beide machinekamers gemeenschappelijke scheidingsvlakken hebben moet deze overeenkomstig
      [artikel 15.11, tweede lid][ref1], gebouwd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.08.1
    text: |-
      Ieder passagiersschip moet beschikken over een interne spreekverbinding als bedoeld in [artikel 7.08][ref1]. Deze
      moet bovendien de bedrijfsruimten en – voor zover daar geen directe communicatiemogelijkheid vanuit het stuurhuis
      aanwezig is – de plaatsen voor het embarkeren van passagiers en de verzamelruimten voor passagiers als bedoeld in
      [artikel 15.06, achtste lid][ref2], omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.08.2
    text: |-
      Alle passagiersverblijven moeten met een luidsprekerinstallatie bereikt kunnen worden. De installatie moet zo
      gedimensioneerd zijn dat de overgebrachte informatie duidelijk van achtergrondlawaai kan worden onderscheiden.
      Voorzover er een directe communicatiemogelijkheid vanuit het stuurhuis naar het passagiersgedeelte aanwezig is,
      behoeft er aldaar geen luidspreker beschikbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3
    text: 'Er moet een alarmsysteem aanwezig zijn. Deze moet bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.a
    text: |-
      een alarminstallatie waarmee passagiers, bemanningsleden en leden van het boordpersoneel de leiding van het schip
      en de bemanning kunnen alarmeren. Dit alarm mag slechts klinken in de ruimten bestemd voor de scheepsleiding en
      voor de bemanning en mag slechts door de scheepsleiding kunnen worden afgezet. Dit alarm moet tenminste op de
      volgende plaatsen kunnen worden aangezet:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.a.aa
    text: in iedere hut;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.a.bb
    text: |-
      in gangen, liften en trappenhuizen, zodanig dat de afstand naar de dichtstbijzijnde schakelaar ten hoogste 10 m
      bedraagt, terwijl er tenminste één schakelaar per waterdichte afdeling moet zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.a.cc
    text: in de salons, eetzalen en vergelijkbare dagverblijven;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.a.dd
    text: in toiletten die zijn bestemd voor het gebruik van personen met beperkte mobiliteit;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.a.ee
    text: in machinekamers, keukens en vergelijkbare ruimten waar brand mogelijk is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.a.ff
    text: in koelruimten en overige opslagruimten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.b
    text: |-
      een alarminstallatie waarmee de scheepsleiding de passagiers kan waarschuwen. Dit alarm moet duidelijk en zonder
      dat verwarring mogelijk is waarneembaar zijn in alle ruimten die toegankelijk zijn voor passagiers. Het moet
      ingeschakeld kunnen worden vanuit het stuurhuis en vanaf een plaats die constant door het personeel wordt bezet.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.3.c
    text: |-
      een alarminstallatie waarmee de scheepsleiding, bedoeld in [artikel 7.09, eerste lid][ref1], de bemanning en het
      boordpersoneel kan waarschuwen. Deze alarminstallatie moet eveneens functioneren in de verblijfsruimten voor het
      boordpersoneel, de koelruimten en andere opslagruimten. De alarmschakelaars moeten beschermd zijn tegen ongewild
      gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel7
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '7'
        hoofdstuk: '7'
  - number: 15.08.4
    text: Iedere waterdichte afdeling moet zijn uitgerust met een bilge alarm.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.5
    text: Er moeten twee gemotoriseerde lenspompen aan boord beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.6
    text: Een lenssysteem met vast geïnstalleerde lensleidingen moet beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.7
    text: Koelruimten moeten, ook wanneer de deur afgesloten is, van binnen uit kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.8
    text: |-
      Indien zich onderdelen van in kasten opgestelde CO-installaties in onderdeks gesitueerde ruimten bevinden, moeten
      deze zijn voorzien van een automatische ventilatie, die automatisch in werking treedt bij het openen van de deur of
      van het luik van deze ruimte. De ventilatieschachten moeten reiken tot op 0,05 m van de bodem van deze ruimte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
  - number: 15.08.9
    text: |-
      Behalve de verbandtrommel, bedoeld in [artikel 10.02, tweede lid, onder f][ref1], moeten er verdere verbandtrommels
      in voldoende aantal aanwezig zijn. De verbandtrommels en de plaats waar ze opgeborgen zijn moeten voldoen aan de
      eisen van [artikel 10.02, tweede lid, onder f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.09.1
    text: |-
      Behalve de in [artikel 10.05, eerste lid][ref1], genoemde reddingsboeien moeten op alle voor passagiers bestemde,
      niet gesloten delen van de dekken aan beide zijden van het schip reddingsboeien die voldoen: - aan de Europese norm
      EN 14 144 : 2003; of
        - aan het Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (Solas 1974), Hoofdstuk
      III, Regel 7.1, en aan de internationale code betreffende de reddingsmiddelen (LSA), paragraaf 2.1, op een afstand
      van telkens niet meer dan 20 m uit elkaar beschikbaar zijn. De ene helft van alle voorgeschreven reddingsboeien
      moet zijn voorzien van een drijvende lijn die tenminste 30 m lang moet zijn en een doorsnede van 8 tot 11 mm moet
      hebben. De andere helft van de voorgeschreven reddingsboeien moet zijn voorzien van een automatisch ontbrandend
      licht, gevoed door batterijen, dat in het water niet kan uitgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.09.2
    text: |-
      Behalve de reddingsboeien als bedoeld in het eerste lid moeten: voor alle leden van het boordpersoneel individuele
      reddingsmiddelen als bedoeld in [artikel 10.05, tweede lid][ref1], onder handbereik beschikbaar zijn; voor de
      leden van het boordpersoneel die geen taak volgens de veiligheidsrol hebben, zijn ook harde of halfautomatisch
      opblaasbare zwemvesten als bedoeld in [artikel 10.05, tweede lid][ref2], toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.09.3
    text: |-
      Passagiersschepen moeten over geschikte inrichtingen beschikken die personen op een veilige manier van boord in
      ondiep water, aan de oever of aan boord van een ander vaartuig kan brengen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.4
    text: |-
      Behalve de reddingsmiddelen als bedoeld in het eerste en tweede lid moeten voor in totaal 100% van het ten hoogste
      toegelaten aantal passagiers individuele reddingsmiddelen als bedoeld in [artikel 10.05, tweede lid][ref1],
      aanwezig zijn, waarbij ook harde of halfautomatisch opblaasbare zwemvesten als bedoeld in
      [artikel 10.05, tweede lid][ref2], zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.09.5
    text: (vervallen)
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.6
    text: |-
      Extra gemeenschappelijke reddingsmiddelen zijn uitrustingsstukken die het mogelijk maken meerdere personen die zich
      te water bevinden drijvende te houden. Zij moeten:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.6.a
    text: over een opschrift beschikken waaruit de bestemming blijkt en het aantal personen waarvoor ze geschikt zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.6.b
    text: een drijfvermogen in zoet water hebben van ten minste 100 N per persoon;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.6.c
    text: |-
      van geschikt materiaal zijn vervaardigd en resistent zijn voor olie en van olie afgeleide producten, alsmede tegen
      temperaturen tot en met 50 °C;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.6.d
    text: |-
      drijvend een stabiele ligging kunnen innemen en behouden en voorzien zijn van geschikte middelen om zich vast te
      houden voor het aangegeven aantal personen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.6.e
    text: |-
      een fluorescerende oranje kleur hebben dan wel duurzaam aangebrachte fluorescerende naar alle zijden zichtbare
      vlakken hebben van tenminste 100 cm2; en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.6.f
    text: |-
      vanaf de plaats waar ze opgesteld zijn door één persoon snel en veilig over boord kunnen worden gezet dan wel van
      zelf boven drijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.7
    text: 'Opblaasbare gemeenschappelijke reddingsmiddelen moeten bovendien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.7.a
    text: uit ten minste twee gescheiden luchtkamers bestaan;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.7.b
    text: bij het in het water belanden zich automatisch opblazen of door handbediening kunnen worden opgeblazen; en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.7.c
    text: |-
      bij iedere mogelijke belasting, ook wanneer slechts de helft van de luchtkamers is opgeblazen, drijvend een
      stabiele ligging innemen en behouden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.8
    text: |-
      Reddingsmiddelen moeten aan boord zodanig zijn ondergebracht dat zij als het nodig is gemakkelijk en veilig kunnen
      worden bereikt. Aan het gezicht onttrokken depots moeten duidelijk zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.9
    text: Reddingsmiddelen moeten zijn getest volgens de indicaties van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.10
    text: De bijboot moet zijn uitgerust met een motor en met een verstelbare schijnwerper.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.09.11
    text: Er moet een geschikte draagbaar beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.09
  - number: 15.10.1
    text: Voor de verlichting zijn slechts elektrische installaties toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.2
    text: |-
      [Artikel 9.16, derde lid][ref1], geldt bovendien ook voor gangen en ruimten waar passagiers verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel9
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.10.3
    text: |-
      Een voldoende verlichting alsmede een noodverlichting moet voor tenminste de volgende ruimten en plaatsen aanwezig
      zijn:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.a
    text: plaatsen waar reddingsmiddelen worden bewaard en waar zij normaal voor het gebruik worden gereedgemaakt;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.b
    text: |-
      vluchtwegen, instapplaatsen voor passagiers met inbegrip van loopplanken, toe- en uitgangen, verbindingsgangen,
      liften en trappen van verblijven, hutten en woonruimten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.c
    text: markeringen van de vluchtwegen en nooduitgangen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.d
    text: overige ruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.e
    text: bedrijfsruimten, machinekamers en roermachinekamers en de uitgangen daarvan;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.f
    text: stuurhuis;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.g
    text: ruimte voor de noodkrachtbron;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.h
    text: plaatsen waar zich blustoestellen en de bediening van brandblusinstallaties bevinden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.3.i
    text: plaatsen waar de passagiers, het boordpersoneel en de bemanning zich in noodgevallen verzamelen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4
    text: |-
      Er moet een noodstroominstallatie aanwezig zijn, die bestaat uit een noodstroombron en noodschakelbord en die bij
      uitval van de voeding de stroomvoorziening van de volgende elektrische inrichtingen kan overnemen; zij moet in
      staat zijn deze gelijktijdig te voeden, voor zover deze inrichtingen niet van een eigen stroombron zijn voorzien:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.a
    text: navigatielantaarns;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.b
    text: installaties voor geluidsseinen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.c
    text: noodverlichting als bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.d
    text: marifooninstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.e
    text: alarm- en luidsprekerinstallaties en installaties voor de interne communicatie aan boord;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.f
    text: |-
      schijnwerpers als bedoeld in [artikel 10.02, tweede lid, onder i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.10.4.g
    text: brandmeldinstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.h
    text: overige veiligheidsinstallaties zoals automatische sprinklerinstallaties of brandbluspompen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.4.i
    text: |-
      liften en hefinrichtingen als bedoeld in [artikel 15.06, negende lid, tweede zin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.10.5
    text: De lichtbronnen voor de noodverlichting moeten als zodanig zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.6
    text: |-
      De noodstroominstallatie moet zijn aangebracht buiten de hoofdmachinekamer, buiten de ruimte waarin de
      energiebronnen als bedoeld in [artikel 9.02, eerste lid][ref1], ondergebracht zijn en buiten de ruimte
      waarin het hoofdschakelbord staat opgesteld en van deze ruimten door scheidingsvlakkenals bedoeld in
      [artikel 15.11, tweede lid][ref2], zijn gescheiden. Kabels die elektrische installaties in noodgevallen voeden,
      moeten zodanig zijn ingebouwd en doorgeleid dat de continuïteit van de voeding van deze installaties in geval van
      brand en overstroming gehandhaafd blijft. In ieder geval mogen deze kabels niet door de hoofdmachinekamer, door
      keukens of door ruimten geleid worden waarin de elektrische hoofdenergiebron en de daarbij behorende uitrusting
      staan, behalve in zoverre als het nodig is om ook deze ruimte van een noodstroominstallatie te voorzien. De
      noodstroominstallatie moet ofwel zijn opgesteld boven de indompelingsgrenslijn, ofwel zo ver verwijderd van de
      energiebronnen, bedoeld in [artikel 9.02, eerste lid][ref3], dat hij in het geval van een lekke toestand als
      bedoeld in [artikel 15.03, negende lid][ref4], niet tegelijkertijd als deze energiebronnen onder water komt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '9'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.10.7
    text: 'Als noodstroombron zijn toegelaten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.7.a
    text: |-
      aggregaten met een eigen onafhankelijke brandstofvoorziening en onafhankelijk koelsysteem, die bij het uitvallen
      van het hoofdnet automatisch moeten aanlopen en binnen 30 seconden de stroomvoorziening automatisch moeten kunnen
      overnemen, dan wel, indien zij zich bevinden in de onmiddellijke nabijheid van het stuurhuis of een andere plaats
      waar voortdurend leden van de bemanning aanwezig zijn, met de hand kunnen worden gestart;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.7.b
    text: |-
      accumulatoren, die bij uitvallen van het hoofdnet automatisch de stroomvoorziening overnemen, dan wel, indien zij
      zich in de onmiddellijke nabijheid van het stuurhuis of een andere plaats waar voortdurend leden van de bemanning
      aanwezig zijn, met de hand kunnen worden ingeschakeld. Zij moeten in staat zijn om de aangegeven installaties
      gedurende de voorgeschreven tijd zonder oplading en zonder ontoelaatbaar spanningsverlies te voeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.8
    text: |-
      De voor de noodstroomvoorziening benodigde bedrijfsduur wordt bepaald naar gelang het gebruiksdoel van het
      passagiersschip, maar mag niet minder dan 30 minuten bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.10.9
    text: |-
      De isolatie weerstanden en de aarding van de elektrische systemen moeten worden getest tijdens de onderzoeken,
      bedoeld in [artikel 2.09][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 15.10.10
    text: |-
      De energiebronnen, bedoeld in [artikel 9.02, eerste lid][ref1], moeten onafhankelijk van elkaar zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel9
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.10.11
    text: |-
      Storingen in de hoofd- of noodstroominstallatie mogen geen aanleiding kunnen zijn tot onderlinge beïnvloeding van
      de bedrijfszekerheid van de inrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.10
  - number: 15.11.1
    text: |-
      De technische geschiktheid van materialen en onderdelen op het gebied van brandbescherming moet worden vastgesteld
      door een geaccrediteerd testinstituut op grond van geschikte testmethoden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.a
    text: 'Het testinstituut moet voldoen aan:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.a.aa
    text: de code voor brandtestmethoden of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.a.bb
    text: |-
      de Europese norm EN ISO/IEC 17025 : 2000, inzake de algemene eisen aan de kundigheid van test- en
      kalibreerlaboratoria.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.b
    text: 'Erkend als testmethoden ten behoeve van het vaststellen van de onbrandbaarheid van materialen zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.b.aa
    text: bijlage 1, deel 1, van de code voor brandtestmethoden en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.b.bb
    text: gelijkwaardige voorschriften van één der Rijnoeverstaten of België.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.c
    text: 'Erkend als testmethoden ten behoeve van het vaststellen van het moeilijk ontvlambaar zijn van materialen zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.c.aa
    text: |-
      de voor de verschillende punten van toepassing zijnde eisen van bijlage 1, deel 5 (ontvlambaarheidstest van het
      oppervlak), deel 6 (test van dekbedekking), deel 7 (test van stofferingen en kunststoffen), deel 8 (test van
      gestoffeerd meubilair) en deel 9 (test van onderdelen van beddengoed) van de code voor brandtestmethoden en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.c.bb
    text: gelijkwaardige voorschriften van één der Rijnoeverstaten of België.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.d
    text: 'Erkend als testmethoden ten behoeve van het vaststellen van brandbestendigheid zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.d.aa
    text: Bijlage 1, derde deel, van de code voor brandtestmethoden en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.d.bb
    text: gelijkwaardige voorschriften van één der Rijnoeverstaten of België.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.1.e
    text: |-
      De Commissie van Deskundigen kan in overeenstemming met de code voor brandtestmethoden een test voor een model
      scheidingsvlak voorschrijven teneinde zeker te stellen dat aan de voorschriften inzake weerstandsvermogen en
      temperatuurverhoging, bedoeld in het tweede lid, is voldaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2
    text: Scheidingsvlakken
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.a
    text: 'Scheidingsvlakken van ruimten moeten worden uitgevoerd in overeenstemming met de volgende tabellen:'
