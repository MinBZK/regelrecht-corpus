    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.12
  - number: 23.12.7
    text: |-
      De in het tweede lid voorgeschreven minimum-bemanning (stoomschepen voor dagtochten) in de groep 2,
      exploitatiewijze A1, standaard S1, kan voor de ononderbroken duur van ten hoogste drie maanden in een
      kalenderjaar met een lichtmatroos, die een schippersschool bezoekt, worden verminderd. Opeenvolgende periodes
      met een verminderde bemanning moeten met een periode van minimaal één maand worden onderbroken. Het bezoek aan
      de schippersschool moet worden aangetoond met een verklaring van de schippersschool, die zich aan boord moet
      bevinden en waarin de tijden van het schoolbezoek zijn aangegeven. Deze bepalingen zijn niet van toepassing op de
      lichtmatroos, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.12
  - number: 23.12.8
    text: |-
      De in het eerste lid voorgeschreven minimum-bemanning (hotelschepen) in de groep 3, exploitatiewijze A1, standaard
      S1, kan voor de ononderbroken duur van ten hoogste drie maanden in een kalenderjaar met een lichtmatroos, die een
      schippersschool bezoekt, worden verminderd. Opeenvolgende periodes met een verminderde bemanning moeten met een
      periode van minimaal één maand worden onderbroken. Het bezoek aan de schippersschool moet worden aangetoond met
      een verklaring van de schippersschool, die zich aan boord moet bevinden en waarin de tijden van het schoolbezoek
      zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.12
  - number: 23.13.1
    text: |-
      Wanneer de uitrusting van een motorschip, een duwboot, een hecht samenstel, een andere hechte samenstelling of een
      passagiersschip niet voldoet aan de standaard S1, bedoeld in [artikel 23.09, eerste lid][ref1], dient de minimum-
      bemanning, bedoeld in de [artikelen 23.10][ref2], [23.11][ref3] of [23.12][ref4], te worden verhoogd


