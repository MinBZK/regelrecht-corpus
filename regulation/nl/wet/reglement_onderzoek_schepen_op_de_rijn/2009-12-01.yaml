  - number: 24.02.2
    text: |-
      In de onderstaande tabel betekent: - ‘N.V.O.’: het voorschrift is niet van toepassing op reeds in bedrijf zijnde
      vaartuigen, tenzij de betreffende delen worden vervangen of omgebouwd, dat wil zeggen dat dit voorschrift slechts
      van toepassing is op Nieuwbouw, bij Vervanging of bij Ombouw van de betreffende delen of sectoren. Worden bestaande
      delen vervangen door delen welke in technische zin en bouwwijze gelijk zijn, dan wordt dit niet beschouwd als
      vervanging ‘V’ volgens deze overgangsbepalingen.
        - ‘Verlenging certificaat’: aan het voorschrift moet zijn voldaan bij de eerstvolgende verlenging van de
      geldigheidsduur van het certificaat van onderzoek na de daarop aangegeven datum.
