  - number: 20.01.5.d
    text: |-
      Van [hoofdstuk 8][ref1]: [artikel 8.03, derde lid][ref2], indien vanuit het stuurhuis een inrichting om
      de motor automatisch te stoppen kan worden uitgeschakeld, en de [artikelen 8.05, dertiende lid][ref3],
      [8.08, tiende lid][ref4], [8.09, eerste en tweede lid][ref5], en [8.10][ref6]. Een verzegeling van de
      afsluitorganen overeenkomstig [artikel 8.06, tiende lid][ref7], wordt geacht overeen te komen met het afsluiten
      van de afsluitorganen in het lenssysteem, via welke het oliehoudende water overboord kan worden gepompt. De
      sleutel of sleutels daarvan moeten op een centrale als zodanig gekenmerkte plaats worden bewaard. Een bewakings-
      en controlesysteem voor olielozingen, overeenkomstig voorschrift 16 van het MARPOL-verdrag 73/78, wordt geacht
      overeen te komen met het verzegelen van het afsluitorgaan overeenkomstig [artikel 8.08, tiende lid][ref8]. De
      aanwezigheid van een bewakings- en controlesysteem moet door een internationaal document inzake de voorkoming van
      verontreiniging van de zee overeenkomstig het MARPOL-verdrag 73/78 worden aangetoond. Blijkt uit het IOPP document,
      bedoeld in het derde lid, of uit het nationale door de vlaggenstaat afgegeven document, bedoeld in het vierde
      lid, dat het schip voorzien is van opslagtanks waarin al het aan boord aanwezige oliehoudende bilgewater en alle
      olieresten kunnen worden verzameld, dan wordt geacht dat aan [artikel 8.09, tweede lid][ref9], is voldaan;


