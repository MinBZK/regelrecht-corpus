  - number: '23.14'
    text: |-
      De Commissie van Deskundigen stelt voor de vaartuigen waarop de [artikelen 23.10 tot en met 23.12][ref1] niet
      van toepassing zijn, zoals sleepboten, sleepschepen en drijvende werktuigen, vast welke bemanning zich tijdens de
      vaart aan boord moet bevinden, naar gelang hun afmetingen, bouwwijze, inrichting en bestemming. Ten aanzien van
      bunkerschepen, die slechts op korte riviergedeelten ingezet mogen worden, kan de Commissie van Deskundigen een
      minimum-bemanning voorschrijven die afwijkt van [artikel 23.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel23
