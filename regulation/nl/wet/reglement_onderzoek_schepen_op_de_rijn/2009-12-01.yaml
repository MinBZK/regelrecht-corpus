  - number: 19.02.4
    text: |-
      [artikel 9.01, eerste lid][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel9
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
