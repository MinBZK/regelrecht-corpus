    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '13'
  - number: 21.02.2.f
    text: |-
      van [hoofdstuk 14][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '14'
  - number: 21.02.2.f.1°
    text: |-
      [artikel 14.12][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 21.02.2.f.2°
    text: |-
      [artikel 14.13][ref1], waarbij de keuring na ingebruikneming van de vloeibaargasinstallatie overeenkomstig de eisen
      van de richtlijn geschiedt en aan de Commissie van Deskundigen hierover een verslag van de keuring moet worden
      uitgebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 21.02.2.f.3°
    text: |-
      de [artikelen 14.14][ref1] en [14.15][ref2] met dien verstande, dat de vloeibaargasinstallatie aan de eisen van de
      richtlijn moet beantwoorden;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 21.02.2.f.4°
    text: |-
      [hoofdstuk 14][ref1] in zijn geheel, indien de vloeibaargasinstallatie wordt ingebouwd nadat het pleziervaartuig in
      het verkeer is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '14'
  - number: '21.03'
    text: |-
      [Hoofdstuk 23][ref1] is niet van toepassing. De bemanning moet ten minste bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '23'
  - number: 21.03.a
    text: |-
      een schipper die houder is van het patent, vereist ingevolge het [Patentreglement Rijn][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.03
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: 21.03.b
    text: een persoon die in staat is te helpen bij het manoeuvreren met het schip.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel21.03
  - number: 22.01.1
    text: |-
      Indien volgens het [Rijnvaartpolitiereglement][ref1] voor schepen die containers vervoeren stabiliteitsbescheiden
      zijn vereist, is dit hoofdstuk van toepassing. De stabiliteitsbescheiden moeten door een Commissie van Deskundigen
      worden geverifieerd en van haar waarmerk worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 22.01.2
    text: |-
      De stabiliteitsbescheiden moeten de schipper begrijpelijke informatie bieden over de stabiliteit van het schip in
      elke voorkomende beladingstoestand. De stabiliteitsbescheiden moeten ten minste bevatten:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
  - number: 22.01.2.a
    text: |-
      gegevens betreffende de toelaatbare stabiliteitscoëfficiënten, de toegestane of de toegestane zwaartepuntshoogten
      van de lading;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
  - number: 22.01.2.b
    text: gegevens betreffende de ruimten die met ballastwater kunnen worden gevuld;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
  - number: 22.01.2.c
    text: formulieren voor de stabiliteitscontrole;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
  - number: 22.01.2.d
    text: een berekeningsvoorbeeld of handleiding voor de schipper.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
  - number: 22.01.3
    text: |-
      Indien containers op een schip naar keuze al dan niet vastgezet kunnen worden vervoerd, zijn voor het vervoer van
      niet-vastgezette en voor het vervoer van vastgezette containerladingen afzonderlijke berekeningsmethoden vereist
      voor het bewijs van stabiliteit.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
  - number: 22.01.4
    text: |-
      Een containerlading geldt alleen als vastgezet wanneer de afzonderlijke containers door middel van geleiders
      of spaninrichtingen hecht met de scheepsromp zijn verbonden en zij tijdens het varen niet van plaats kunnen
      veranderen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.01
  - number: 22.02.1
    text: |-
      Voor niet-vastgezette containers moet bij elke berekeningsmethode om de stabiliteit van het schip vast te stellen
      van de volgende criteria worden uitgegaan:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.1.a
    text: De metacentrumhoogte mag niet minder zijn dan 1,00 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.1.b
    text: |-
      Onder de gelijktijdige invloed van de middelpuntvliedende kracht bij het draaien van het schip, de winddruk en de
      vrije vloeistofoppervlakken mag de optredende slagzij niet meer zijn dan 5° en mag de zijde van het dek niet in het
      water komen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.1.c
    text: |-
      De arm van het moment veroorzaakt door de middelpuntvliedende kracht bij het draaien van het schip wordt berekend
      volgens de formule: In deze formule betekent: C coëfficiënt c = 0,04 [s2/m]; v de grootste snelheid van het schip
      ten opzichte van het water [m/s]; de hoogte van het gewichtszwaartepunt van het geladen schip boven de basis [m];
      T' de diepgang van het geladen schip [m].
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.1.d
    text: |-
      De arm van het moment veroorzaakt door de winddruk wordt berekend volgens de formule: In deze formule betekent:
      C coëfficiënt (C = 0,025) [t/m2]; A' het lateraal oppervlak van het geladen schip boven water [m2]; D' het
      deplacement van het geladen schip [t]; I de afstand van het zwaartepunt van het lateraal oppervlak A' boven de
      waterlijn [m]; T' de diepgang van het geladen schip [m].
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.1.e
    text: |-
      De arm van het moment veroorzaakt door de vrije vloeistofoppervlakken van regen- en restwater in het laadruim of
      de dubbele bodem wordt berekend volgens de formule: In deze formule betekent: c coëfficiënt (c = 0,015) [t/m2] b
      de breedte van het desbetreffende ruim of ruimgedeelte [m]; l de lengte van het desbetreffende ruim of ruimgedeelte
      [m]; D' het deplacement van het geladen schip [t].
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.1.f
    text: Voor elke beladingstoestand moet met de halve voorraad aan brandstof en drinkwater worden gerekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.2
    text: |-
      De stabiliteit van een met niet-vastgezette containers geladen schip wordt geacht voldoende te zijn wanneer
      de aanwezige gelijk aan of kleiner is dan volgens de volgende formules. Daarbij moet worden berekend voor
      verschillende verplaatsingen over het gehele diepgangsbereik.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.2.a
    text: Voor mag geen kleinere waarde dan (11,5 worden genomen 11,5 = 1/tan5°).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.2.b
    text: |-
      De kleinere waarde voor uit de formule a of b is doorslaggevend. In deze formules betekent: de maximaal toelaatbare
      hoogte van het gewichtszwaartepunt van het geladen schip boven de basis [m]; de hoogte van het metacentrum boven
      de basis [m] volgens de benaderingsformule in het derde lid; F het voorhanden vrijboord op ½ van de lengte L [m];
      Z coëfficiënt voor de middelpuntvliedende kracht bij het draaien van het schip v de grootste snelheid van het
      schip ten opzichte van het water [m/s]; T gemiddelde diepgang [m]; h de arm van het moment veroorzaakt door de
      zijdelingse winddruk als bedoeld in het eerste lid, onder d [m]; h som van de momenten veroorzaakt door de vrije
      vloeistofoppervlakken als bedoeld in het eerste lid, onder e [m].
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.3
    text: |-
      Benaderingsformule voor Indien geen carènediagram ter beschikking is, kan voor de berekening volgens het tweede
      lid en artikel 22.03, tweede lid, de waarde van KM met behulp van bijvoorbeeld de onderstaande benaderingsformules
      worden berekend:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.3.a
    text: voor schepen met een pontonvorm
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.02.3.b
    text: voor andere schepen
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.02
  - number: 22.03.1
    text: |-
      Voor vastgezette containers moet bij elke berekeningsmethode om de stabiliteit van het schip vast te stellen van de
      volgende criteria worden uitgegaan:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: 22.03.1.a
    text: De metacentrumhoogte mag niet minder zijn dan 0,50 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: 22.03.1.b
    text: |-
      Onder de gelijktijdige invloed van de middelpuntvliedende kracht bij het draaien van het schip, de winddruk en de
      vrije vloeistofoppervlakken mag geen opening van de scheepsromp onder water komen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: 22.03.1.c
    text: |-
      De armen van de momenten veroorzaakt door de middelpuntvliedende kracht bij het draaien van het
      schip, door de winddruk en de vrije vloeistofoppervlakken worden berekend volgens de formules van
      [artikel 22.02, eerste lid onder c, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel22
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.03.1.d
    text: Voor elke beladingstoestand moet met de halve voorraad aan brandstof en drinkwater worden gerekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: 22.03.2
    text: |-
      De stabiliteit van een met vastgezette containers geladen binnenschip wordt geacht voldoende te zijn, wanneer
      de aanwezige waarde gelijk aan of kleiner is dan volgens de volgende formules. Daarbij moet worden berekend voor
      verschillende verplaatsingen over het gehele diepgangsbereik. a. Voor mag geen kleinere waarde dan 6,6 worden
      genomen en voor geen kleinere waarde dan 0. De kleinere waarde voor uit de formule a of b is doorslaggevend. In de
      formules betekent: l het dwarstraagheidsmoment van de waterlijn bij T [m4], overeenkomstig de benaderingsformule
      van het derde lid; i het dwarstraagheidsmoment van de waterlijn evenwijdig aan de basis bij een diepgang van T +
      ⅔ F' [m4]; de waterverplaatsing van het schip bij T [m3]; F' het denkbeeldige vrijboord , waarbij de kleinste van
      de beide waarden dient te worden genomen; a. verticale afstand van de onderkant van de bij een helling het eerst
      onder water komende opening tot de waterlijn in rechte stand van het schip [m]; b. de afstand van deze opening
      tot hart schip [m]; H' de denkbeeldige hoogte in de zijde q de som der inhouden van dekhuizen, luiken, trunks en
      andere opbouwen tot een hoogte van maximaal 1,00 m boven H, of tot de laagste opening van de desbetreffende ruimte,
      waarbij de kleinste waarde kleiner maatgevend is. Ruimten gelegen op minder dan 0,05 L van de scheepseinden blijven
      buiten beschouwing [m3].
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: 22.03.3
    text: |-
      Benaderingsformule voor l. Indien geen carènediagram ter beschikking is, kan voor de berekening volgens het tweede
      lid de waarde van het dwarstraagheidsmoment van de waterlijn l met behulp van de onderstaande benaderingsformules
      worden berekend:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: 22.03.3.a
    text: 'voor schepen met een pontonvorm:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: 22.03.3.b
    text: 'voor andere schepen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.03
  - number: '22.04'
    text: |-
      De methode voor de stabiliteitsbeoordeling kan aan de in [artikel 22.01, tweede lid][ref1], bedoelde bescheiden
      worden ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel22
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '22'
        hoofdstuk: '22'
  - number: 22a.01
    text: |-
      Onverminderd artikel 2.03, derde lid, moet de Commissie van Deskundigen die uiteindelijk het certificaat van
      onderzoek moet afgeven, door de eigenaar of zijn vertegenwoordiger vóór het begin van de bouw (nieuwbouw of
      verlenging van een reeds in bedrijf zijnd vaartuig) van vaartuigen met een lengte L van meer dan 110 m met
      uitzondering van zeeschepen, hiervan op de hoogte worden gesteld. Deze Commissie van Deskundigen voert tijdens
      de bouwperiode onderzoeken uit. Zij kan hiervan afzien wanneer vóór het begin van de bouw een verklaring van een
      erkend classificatiebureau wordt overgelegd waarin het verklaart dat het op de bouw toeziet.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.01
  - number: 22a.02
    text: |-
      Op vaartuigen met een lengte L van meer dan 110 m zijn, behalve Deel II, de artikelen 22a.03 tot en met 22a.05
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.02
  - number: 22a.03
    text: |-
      De voldoende sterkte van de scheepsromp als bedoeld in artikel 3.02, eerste lid, onder a, (sterkte in langs-
      en dwarsrichting alsmede plaatselijke sterkte) moet worden aangetoond door een verklaring van een erkend
      classificatiebureau.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.03
  - number: 22a.04.1
    text: |-
      Op vaartuigen met een lengte L van meer dan 110 m, met uitzondering van passagiersschepen, zijn de leden 2 tot en
      met 9 van toepassing.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.2
    text: |-
      De voldoende stabiliteit met inbegrip van de lekstabiliteit moet voor de ongunstigste beladingstoestand worden
      aangetoond. De basisgegevens voor de stabiliteitsberekening – ledig scheepsgewicht en ligging gewichtszwaartepunt –
      moeten worden bepaald door: - een hellingproef; of
        - door een gedetailleerde gewichtsberekening. Hierbij moet het ledig scheepsgewicht door een diepgangsmeting aan
      boord van het vaartuig worden gecontroleerd, waarbij het met behulp van de gewichtsberekening verkregen gewicht
      niet meer dan ± 5% van het met behulp van de diepgangscontrole verkregen scheepsgewicht mag afwijken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.3
    text: |-
      Het drijfvermogen in lekke toestand moet voor het vol beladen vaartuig worden aangetoond. Hierbij moet voor de
      kritische stadia tijdens het vervullen, en voor de eindtoestand van het vervuld zijn, het rekenkundig bewijs van
      voldoende stabiliteit worden geleverd. Treden in stadia tijdens het vervullen negatieve stabiliteitswaarden op,
      dan kunnen zij door de bevoegde autoriteit worden geaccepteerd indien voor opvolgende stadia tijdens het vervullen
      voldoende **stabiliteit wordt aangetoond.**
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.4
    text: 'Voor de lekke toestand moeten de volgende uitgangspunten in acht worden genomen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.4.a
    text: |-
      Omvang van de schade aan een scheepszijde: langsscheeps: ten minste 0,10 L, dwarsscheeps: 0,59 m, verticaal: vanaf
      de basis naar boven onbegrensd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.4.b
    text: |-
      Omvang van de schade aan de scheepsbodem: langsscheeps: ten minste 0,10 L, dwarsscheeps: 3,00 m, verticaal: vanaf
      de basis naar boven 0,39 m, lensput uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.4.c
    text: |-
      Alle in de beschadigde zone aanwezige schotten zijn als lek te beschouwen, dat wil zeggen dat de schotindeling
      zo gekozen moet zijn dat het vaartuig ook bij het vervuld raken van twee of meer direct achter elkaar liggende
      afdelingen blijft drijven. Voor de hoofdmachinekamer behoeft slechts het drijfvermogen aangetoond te worden voor
      de ééncompartimentsstandaard, d.w.z. machinekamer eindschotten worden als niet beschadigd beschouwd. Bij een
      bodembeschadiging moeten ook dwarsscheeps naast elkaar liggende afdelingen als vervuld worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.4.d
    text: |-
      Permeabiliteit Er moet met een permeabiliteit van 95% worden gerekend. In afwijking hiervan mag met de volgende
      permeabiliteit worden gerekend:






                        – Machinekamers en bedrijfsruimten


                        85%




                        – Dubbele bodems, brandstoftanks, ballasttanks enz. al naar gelang deze tanks


                        0 of 95%




               uit hoofde van hun bestemming bij het in het vlak van de grootste inzinking liggende vaartuig als vol
      of leeg moeten worden aangenomen Wordt met behulp van een berekening aangetoond dat in een of andere afdeling de
      gemiddelde permeabiliteit kleiner is, dan kan de berekende waarde worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.4.e
    text: |-
      De onderzijde van niet waterdicht afsluitbare openingen (bijv. van deuren, ramen, toegangsluiken) moet in de
      eindtoestand van het vervuld zijn ten minste 100 mm boven het vlak van inzinking liggen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.5
    text: 'De stabiliteit in lekke toestand is voldoende, indien op basis van de uitgangspunten in het vierde lid:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.5.a
    text: |-
      in de eindtoestand van het vervuld raken de resterende veiligheidsafstand niet minder bedraagt dan 100 mm en de
      slagzij van het vaartuig niet groter is dan 5°; of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.5.b
    text: |-
      berekeningen volgens het Reglement voor het vervoer van gevaarlijke stoffen over de Rijn (ADNR) in deel 9
      voorgeschreven methode voor lekberekeningen een positieve uitkomst hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.6
    text: |-
      Indien dwars- of overloopopeningen ter vermindering van de asymmetrie worden aangebracht moet het evenwicht binnen
      15 minuten worden bereikt, indien in de tussenliggende stadia lekstabiliteitswaarden, die voldoende zijn, worden
      aangetoond.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.7
    text: |-
      Indien openingen, waardoor onbeschadigde afdelingen alsnog vol kunnen lopen, waterdicht kunnen worden afgesloten,
      dan moeten deze afsluitinrichtingen overeenkomstig hun gebruikseisen van opschriften zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.8
    text: |-
      Het rekenkundig bewijs als bedoeld in het tweede tot en met vijfde lid wordt geacht te zijn geleverd wanneer
      lekstabiliteitsberekeningen, bedoeld in het Reglement voor het vervoer van gevaarlijke stoffen over de Rijn (ADNR),
      deel 9, met een positief resultaat worden overlegd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.04.9
    text: |-
      Indien het noodzakelijk is om aan de voorwaarden van lid 2 of 3 te voldoen moet het vlak van de grootste inzinking
      opnieuw worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.04
  - number: 22a.05.1
    text: 'Vaartuigen met een lengte L van meer dan 110 m moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.1.a
    text: |-
      beschikken over een meerschroefsaandrijving met tenminste twee van elkaar onafhankelijke aandrijfmotoren met
      eenzelfde vermogen en een vanuit het stuurhuis bedienbare boegschroefinstallatie die ook werkt indien het
      vaartuig niet geladen is, of beschikken over een enkelschroefsaandrijving en een vanuit het stuurhuis bedienbare
      boegschroefinstallatie. De boegschroefinstallatie moet voorzien zijn van een eigen energieverzorging, ook werken
      indien het vaartuig niet geladen is en bij uitval van de hoofdaandrijving het voortbewegen op eigen kracht mogelijk
      maken;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.1.b
    text: beschikken over een radarinstallatie met bochtaanwijzer als bedoeld in artikel 7.06, eerste lid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.1.c
    text: beschikken over een vast ingebouwde lensinrichting als bedoeld in artikel 8.08;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.1.d
    text: voldoen aan de eisen van artikel 23.09, eerste lid, onderdeel 1.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.2
    text: |-
      Vaartuigen, met uitzondering van passagiersschepen, met een lengte L van meer dan 110 m, die bovenstrooms van
      Mannheim willen varen, moeten bovendien:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.2.a
    text: |-
      in geval van averij in het middelste derde deel van het waartuig kunnen worden gedeeld, zonder dat de inzet van
      zwaar bergingsmaterieel noodzakelijk is. De gedeelde stukken van het vaartuig moeten na het delen kunnen blijven
      drijven;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.2.b
    text: |-
      een document van een erkend classificatiebureau overleggen, waarmee het drijfvermogen, de trimsituatie en de
      stabiliteit van de gedeelde stukken van het schip worden aangetoond; hieruit dient tevens te blijken vanaf welke
      beladingstoestand het drijfvermogen van de beide delen niet meer gewaarborgd is. Het document moet aan boord
      aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.2.c
    text: |-
      als dubbelwandig schip volgens het Reglement voor het vervoer van gevaarlijke stoffen over de Rijn (ADNR) zijn
      gebouwd. Motorschepen moeten aan de nummers 9.10.91 tot en met 9.10.95 en tankschepen aan de nummers 9.3.2.11.7 en
      9.3.2.13 tot en met 9.3.2.15 van deel 9 van het ADNR voldoen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.2.d
    text: beschikken over een meerschroefsaandrijving overeenkomstig het eerste lid, onder a, eerste alinea;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.2.e
    text: |-
      een notitie in het certificaat van onderzoek onder punt 52 hebben, dat zij voldoen aan de bijzondere eisen
      overeenkomstig de onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.3
    text: |-
      Passagiersschepen met een lengte L van meer dan 110 m, die bovenstrooms van Mannheim willen varen, moeten,
      behoudens het eerste lid:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.3.a
    text: |-
      onder toezicht van een erkend classificatiebureau voor de hoogste klasse daarvan zijn gebouwd of omgebouwd. Dit
      moet worden bevestigd door een document van het classificatiebureau. De lopende klasse is niet vereist;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.3.b
    text: |-
      een dubbele bodem met een hoogte van tenminste 600 mm hebben, en een schotindeling hebben die garandeert dat het
      schip bij vollopen van twee willekeurige, naast elkaar gelegen waterdichte compartimenten niet inzinkt tot onder de
      indompelingsgrenslijn en er een resterende veiligheidsafstand van 100 mm blijft bestaan, of een dubbele bodem met
      een hoogte van tenminste 600 mm hebben, en een dubbele romp met een afstand tussen de buitenwand van het schip en
      het langsschot van tenminste 800 mm hebben;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.3.c
    text: |-
      beschikken over een meerschroefsaandrijving met tenminste twee van elkaar onafhankelijke aandrijfmotoren met
      eenzelfde vermogen en een vanuit het stuurhuis bedienbare boegschroefinstallatie die zowel in de lengte- als
      dwarsrichting werkt;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.3.d
    text: de hekankers van uit het stuurhuis direct kunnen presenteren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22a.05.3.e
    text: |-
      een notitie in het certificaat van onderzoek onder punt 52 hebben, dat zij voldoen aan de bijzondere eisen
      overeenkomstig de onderdelen a tot en met d
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22a.05
  - number: 22b.01.1
    text: Snelle schepen mogen niet gebouwd zijn als hotelschepen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.01
  - number: 22b.01.2
    text: 'De volgende inrichtingen zijn op snelle schepen verboden:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.01
  - number: 22b.01.2.a
    text: met pitbranders uitgeruste inrichtingen, bedoeld in artikel 13.02;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.01
  - number: 22b.01.2.b
    text: oliekachels met verdampingsbranders, bedoeld in de artikelen 13.03 en 13.04;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.01
  - number: 22b.01.2.c
    text: verwarmingsapparaten met vaste brandstoffen, bedoeld in artikel 13.07;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.01
  - number: 22b.01.2.d
    text: vloeibaargasinstallaties als bedoeld in hoofdstuk 14.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.01
  - number: 22b.02.1
    text: |-
      Onverminderd artikel 2.03 moeten snelle schepen worden gebouwd onder toezicht en volgens de toepasselijke
      voorschriften van een erkend classificatiebureau, dat beschikt over bijzondere regels voor snelle schepen, en door
      dat bureau geclassificeerd zijn. De klasse moet worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.02
  - number: 22b.02.2
    text: |-
      In afwijking van artikel 2.06 bedraagt de geldigheidsduur van de certificaten van onderzoek, die volgens dit
      hoofdstuk zijn afgegeven ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.02
  - number: 22b.03.1
    text: |-
      Onverminderd het tweede lid en artikel 22b.02, tweede lid, gelden voor snelle schepen de hoofdstukken 3 tot en met
      15 met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.1.a
    text: artikel 3.04, zesde lid, tweede alinea;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.1.b
    text: artikel 8.08, tweede lid, tweede zin;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.1.c
    text: artikel 11.02, vierde lid, tweede en derde zin;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.1.d
    text: artikel 12.02, vierde lid, tweede zin;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.1.e
    text: artikel 15.06, derde lid, onderdeel a, tweede zin.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.2
    text: |-
      In afwijking van artikel 15.02, negende lid, en artikel 15.15, zevende lid, moeten alle deuren in schotten op
      afstand kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.3
    text: |-
      In afwijking van artikel 6.02, eerste lid, moet bij uitvallen of storing van de aandrijving van de stuurmachine
      onverwijld een tweede onafhankelijke aandrijving van de stuurmachine dan wel een handaandrijving in werking worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.03.4
    text: Behalve de eisen van deel II gelden voor snelle schepen de artikelen 22b.04 tot en met 22b.12.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.03
  - number: 22b.04
    text: |-
      Voor het ten hoogste aan boord toegelaten aantal passagiers moeten zitplaatsen beschikbaar zijn. Zitplaatsen moeten
      van veiligheidsgordels voorzien zijn. Veiligheidsgordels kunnen achterwege blijven indien een geschikte bescherming
      tegen stoten aanwezig is, dan wel wanneer zij volgens de HSC Code 2000, hoofdstuk 4, onderdeel 6, niet vereist
      zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.04
  - number: 22b.05
    text: In afwijking van de artikelen 4.02 en 4.03 moet het vrijboord ten minste 500 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.05
  - number: 22b.06
    text: In het geval van snelle schepen moet de aanwezigheid van
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.06
  - number: 22b.06.a
    text: |-
      eigenschappen wat betreft drijfvermogen en stabiliteit, de veiligheid van het schip tijdens het varen met
      waterverplaatsing zowel in onbeschadigde toestand als in lekke toestand waarborgen,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.06
  - number: 22b.06.b
    text: |-
      stabiliteitseigenschappen en stabiliseringssystemen, de veiligheid van het schip tijdens het bedrijf met dynamisch
      draagvermogen en in de overgangsfase waarborgen,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.06
  - number: 22b.06.c
    text: |-
      stabiliteitseigenschappen tijdens het bedrijf met dynamisch draagvermogen en in de overgangsfase, het voor het
      schip mogelijk maken op veilige wijze de overgang te maken naar het varen met waterverplaatsing bij een eventueel
      niet functioneren van het systeem in voldoende mate worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.06
  - number: 22b.07.1
    text: Inrichting
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.1.a
    text: |-
      In afwijking van artikel 7.01, eerste lid, moet het stuurhuis zo worden ingericht, dat zowel de roerganger als een
      tweede lid van de bemanning tijdens de vaart steeds hun taken kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.1.b
    text: |-
      De stuurstand moet zo worden ingericht, dat de onder a genoemde personen daar hun werkplek hebben. De inrichtingen
      voor de navigatie, het manoeuvreren, de controle, het uitwisselen van berichten en de overige apparaten die voor
      het bedrijf van belang zijn moeten zo dicht bij elkaar zijn opgesteld, dat zowel de roerganger als een tweede lid
      van de bemanning over alle noodzakelijke informatie kan beschikken om indien nodig zittend alle uitrustings- en
      bedieningsinrichtingen te kunnen bedienen. In ieder geval moet:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.1.b.aa
    text: de stuurstand van de roerganger zijn uitgevoerd als éénmansstuurstelling voor het varen op radar,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.1.b.bb
    text: |-
      het tweede lid van de bemanning op zijn werkplek beschikken over een eigen radarbeeld (slave) en vanaf zijn
      werkplek in staat zijn in te grijpen in de uitwisseling van berichten en in de aandrijving van het schip.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.1.c
    text: |-
      De onder a vermelde personen moeten, ook indien de veiligheidsgordels normaal zijn gesloten, in staat zijn de
      inrichtingen, bedoeld onder b, zonder belemmering te bedienen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.2
    text: Vrij zicht
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.2.a
    text: |-
      In afwijking van artikel 7.02, tweede lid, mag de dode hoek vanaf een zittende positie en bij elke
      beladingstoestand niet meer bedragen dan één scheepslengte voor de boeg.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.2.b
    text: |-
      In afwijking van artikel 7.02, derde lid, mag de som van de sectoren zonder vrij gezichtsveld van recht vooruit tot
      22,5° achterlijker dan dwars aan iedere zijde niet meer dan 20° bedragen. Iedere afzonderlijke sector zonder vrij
      gezichtsveld mag niet meer bedragen dan 5°. De sector met vrij zicht tussen twee sectoren zonder vrij gezichtsveld
      mag niet minder bedragen dan 10°.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.3
    text: |-
      Instrumenten De instrumentenpanelen voor de bediening en de controle van de in artikel 22b.11 genoemde installaties
      moeten gescheiden op een duidelijk herkenbare plaats binnen het stuurhuis zijn aangebracht. Dit geldt in voorkomend
      geval ook voor inrichtingen voor het te water laten van gemeenschappelijke reddingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.4
    text: |-
      Verlichting In zones of bij onderdelen van de uitrusting, die tijdens het bedrijf verlicht moeten zijn, moet rood
      licht worden toegepast.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.5
    text: |-
      Vensters Reflecties moeten vermeden worden. Er moeten inrichtingen ter vermijding van verblinding door zonlicht
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.07.6
    text: Oppervlaktematerialen In het stuurhuis moeten reflecties door oppervlaktematerialen vermeden worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.07
  - number: 22b.08
    text: 'Snelle schepen moeten zijn uitgerust met:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.08
  - number: 22b.08.a
    text: een radarinstallatie en een bochtaanwijzer, bedoeld in artikel 7.06, eerste lid, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.08
  - number: 22b.08.b
    text: |-
      individuele reddingsmiddelen, die direct kunnen worden bereikt, overeenkomstig de Europese norm EN 395: 1998, voor
      het ten hoogste toegelaten aantal personen aan boord.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.08
  - number: 22b.09.1
    text: |-
      Algemeen Voor het publiek toegankelijke ruimten en verblijven en de uitrusting daarvan moeten zo zijn uitgevoerd
      dat personen bij normaal gebruik niet kunnen worden verwond bij een normale start of stop, dan wel bij een
      noodstart of noodstop, noch bij manoeuvreren onder normale vaaromstandigheden dan wel bij motoruitval of een
      stuurfout.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.09
  - number: 22b.09.2
    text: Communicatie
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.09
  - number: 22b.09.2.a
    text: |-
      Passagiersschepen moeten, ten behoeve van informatieverstrekking over veiligheidsmaatregelen, zijn uitgerust met
      optische en akoestische inrichtingen, die door alle passagiers gezien en gehoord kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.09
  - number: 22b.09.2.b
    text: |-
      De schipper moet in staat zijn om met behulp van de onder a bedoelde inrichtingen aanwijzingen aan de passagiers
      te geven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.09
  - number: 22b.09.2.c
    text: |-
      Voor iedere passagier moeten in de nabijheid van zijn zitplaats aanwijzingen voor noodsituaties voorhanden zijn,
      met inbegrip van een overzichtsschets van het schip waarop alle uitgangen, evacuatieroutes, nooduitrusting,
      reddingsmiddelen alsmede het gebruik van de zwemvesten duidelijk zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.09
  - number: 22b.10
    text: 'Vluchtwegen en evacuatieroutes moeten voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.10
  - number: 22b.10.a
    text: |-
      Een gemakkelijke, veilige en snelle toegang vanuit de stuurstand naar de voor het publiek toegankelijke ruimten en
      verblijven moet zijn gegarandeerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.10
  - number: 22b.10.b
    text: De vluchtwegen naar de nooduitgangen moeten duidelijk en duurzaam zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.10
  - number: 22b.10.c
    text: |-
      Alle uitgangen moeten voldoende gemarkeerd zijn. Het functioneren van het openingsmechanisme moet van buiten en van
      binnen duidelijk zijn te herkennen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.10
  - number: 22b.10.d
    text: De vluchtwegen en nooduitgangen moeten over een geschikt veiligheidsgeleidesysteem beschikken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.10
  - number: 22b.10.e
    text: Naast de uitgangen moet voldoende ruimte voor een lid van de bemanning aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.10
  - number: 22b.11.1
    text: |-
      Gangen, voor het publiek toegankelijke ruimten en verblijven, alsmede keukens en machinekamers moeten zijn
      aangesloten op een doelmatige brandmeldinstallatie. De aanwezigheid van een brand en de plaats daarvan moeten
      automatisch op een permanent door het scheepspersoneel bezette plaats worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.11
  - number: 22b.11.2
    text: Machinekamers moeten zijn voorzien van een vast ingebouwde brandblusinstallatie, bedoeld in artikel 10.03b.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.11
  - number: 22b.11.3
    text: |-
      Voor het publiek toegankelijke ruimten en verblijven en de daarbij horende vluchtwegen moeten zijn uitgerust met
      een automatisch werkende vaste brandblusinstallatie, bedoeld in artikel 10.03a. Bluswater moet snel en direct naar
      buiten kunnen worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.11
  - number: 22b.12
    text: |-
      Snelle schepen als bedoeld in artikel 1.01, onderdeel 20a, die op 31 maart 2003 beschikken over een geldig
      certificaat van onderzoek, moeten voldoen aan de volgende voorschriften van dit hoofdstuk:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.12
  - number: 22b.12.a
    text: |-
      bij verlenging van het certificaat van onderzoek aan de artikelen 22b.01, 22b.04, 22b.08, 22b.09, 22b.10 en 22b.11,
      eerste lid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.12
  - number: 22b.12.b
    text: op 1 april 2013 aan de artikelen 22b.07, eerste, derde, vierde, vijfde en zesde lid;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.12
  - number: 22b.12.c
    text: op 1 januari 2023 aan de overige voorschriften.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel22b.12
  - number: 23.01.1
    text: |-
      De bemanning die zich krachtens het [Rijnvaartpolitiereglement][ref1] aan boord moet bevinden van schepen die de
      Rijn bevaren dient voor alle exploitatiewijzen in overeenstemming te zijn met de voorschriften van dit hoofdstuk.
      De voor de desbetreffende exploitatiewijze en vaartijd voorgeschreven bemanning moet zich tijdens de vaart
      voortdurend aan boord bevinden. Het is niet toegestaan zonder de voorgeschreven bemanning te vertrekken. Wanneer
      door onvoorziene omstandigheden (bijvoorbeeld ziekte, ongeval, bevel van een bevoegde autoriteit) tijdens de
      vaart ten hoogste één lid van de voorgeschreven bemanning uitvalt, mogen de schepen niettemin hun reis voortzetten
      tot de eerstvolgende geschikte aanlegplaats in de richting waarin gevaren wordt – passagiersschepen tot het
      eindpunt van de reis van die dag –, indien zich aan boord een persoon bevindt die houder is van een patent voor
      het riviergedeelte waarop hij vaart, alsmede nog een lid van de voorgeschreven bemanning. De persoon die belast
      is met het toezicht op en de verzorging van zich aan boord bevindende kinderen jonger dan zes jaar mag geen lid
      van de minimum-bemanning zijn, tenzij er maatregelen zijn getroffen om de veiligheid van de kinderen ook zonder
      voortdurend toezicht te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.01
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 23.01.2
    text: |-
      Elke Oeverstaat of België kan bepalen, dat zijn voorschriften betreffende de arbeidsbescherming van toepassing zijn
      op de Rijnschepen die in die staat zijn ingeschreven. Niet in een register ingeschreven schepen zijn onderworpen
      aan de voorschriften van die Oeverstaat of België waarin het bedrijf of de eigenaar zijn hoofdzetel of wettelijke
      domicilie heeft. In afwijking hiervan kunnen de bevoegde autoriteiten van de Oeverstaten of België bilateraal
      overeenkomen, dat bepaalde schepen die in de ene staat zijn ingeschreven zijn onderworpen aan de voorschriften van
      de andere staat. Zwangere vrouwen en kraamvrouwen mogen geen deel uitmaken van de bemanning gedurende ten minste 14
      weken, waarvan ten minste 6 weken voor en 7 weken na de bevalling.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.01
  - number: 23.01.3
    text: |-
      Voor de toepassing van de [artikelen 23.05][ref1], [23.06][ref2] en [23.08][ref3] dient tevens rekening te worden
      gehouden met vaar- en rusttijden vervuld buiten het toepassingsgebied van dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '23'
        hoofdstuk: '23'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '23'
        hoofdstuk: '23'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '23'
        hoofdstuk: '23'
  - number: 23.01.4
    text: |-
      Als één jaar vaartijd gelden 180 effectieve vaardagen in de binnenvaart. Binnen een periode van 365 opeenvolgende
      dagen kunnen maximaal 180 dagen als vaartijd worden meegerekend. 250 Vaardagen in de zee- of kustvaart dan wel de
      visserij gelden als één jaar vaartijd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.01
  - number: 23.02.1
    text: |-
      De leden van de bemanning kunnen zijn: deksman, lichtmatroos (scheepsjongen), matroos, matroos-motordrijver,
      volmatroos, stuurman, schipper, machinist.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2
    text: 'De bekwaamheidseisen voor de leden van de bemanning zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.1
    text: voor de deksman ten minste 16 jaar zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.2
    text: |-
      voor de lichtmatroos (scheepsjongen) ten minste 15 jaar zijn en in het bezit zijn van een leerovereenkomst die
      voorziet in het bezoeken van een vakschool voor schippers of het volgen van een schriftelijke cursus die door de
      bevoegde autoriteit is erkend en opleidt voor een gelijkwaardig diploma;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.3
    text: 'voor de matroos:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.3.a)
    text: |-
      ten minste 17 jaar zijn en - met goed gevolg de in lid 2.2 genoemde opleiding hebben afgesloten of
        - een met goed gevolg afgelegd eindexamen aan een vakschool voor schippers of
        - met goed gevolg een door een bevoegde autoriteit erkend examen matroos hebben afgelegd, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.3.b)
    text: |-
      ten minste 19 jaar zijn en een vaartijd als lid van een dekbemanning van ten minste drie jaren hebben, waarvan
      ten minste één jaar in de binnenvaart en twee jaren in de binnenvaart, dan wel in de zee- of kustvaart dan wel de
      visserij vervuld zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.4
    text: 'voor de matroos-motordrijver:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.4.a)
    text: |-
      de bekwaamheid als matroos hebben en met goed gevolg een door de bevoegde autoriteit erkend examen matroos-
      motordrijver hebben afgelegd, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.4.b)
    text: |-
      een vaartijd hebben van ten minste 1 jaar als matroos op een binnenschip met eigen mechanische middelen tot
      voortbeweging en elementaire kennis op het gebied van motoren bezitten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.5
    text: 'voor de volmatroos:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.5.a)
    text: |-
      een vaartijd van ten minste één jaar als matroos in de binnenvaart en - met goed gevolg de in onderdeel 2.2
      genoemde opleiding hebben afgerond of
        - een met goed gevolg afgelegd eindexamen aan een vakschool voor schippers of
        - met goed gevolg een door een bevoegde autoriteit erkend examen matroos hebben afgelegd, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.5.b)
    text: |-
      met goed gevolg een examen hebben afgelegd van een driejarige opleiding als bedoeld in onderdeel 2.2 of een met
      goed gevolg afgelegd eindexamen na een driejarige opleiding aan een vakschool voor schippers, indien in deze
      opleiding ten minste één jaar vaartijd in de binnenvaart is opgenomen, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.5.c)
    text: |-
      een vaartijd in de binnenvaart van ten minste één jaar als matroos, bedoeld in onderdeel 2.3, onderdeel b, en
      een met goed gevolg afgelegd praktijkexamen als bedoeld in bijlage C, lid 3.1, van het Patentreglement Rijn onder
      toepassing van de richtlijn, bedoeld in [artikel 1.05 van het Patentreglement Rijn][ref1], ter uitvoering van het
      examen, of


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
    references:
      - id: ref1
        bwb_id: BWBR0026045
        artikel: '1'
  - number: 23.02.2.2.5.d)
    text: een vaartijd in de binnenvaart van ten minste twee jaar als matroos, bedoeld in onderdeel 2.3, onder b;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.6
    text: 'voor de stuurman:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.6.a)
    text: |-
      een vaartijd in de binnenvaart hebben van ten minste één jaar als volmatroos of van ten minste drie jaar als
      matroos, bedoeld in onderdeel 2.3, onder b, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.6.b)
    text: |-
      het bezit van een vaarbewijs, afgegeven op grond van [richtlijn nr. 96/50/EG](31996L0050) van de Raad van de
      Europese Unie van 23 juli 1996 betreffende de harmonisatie van de voorwaarden voor de afgifte van nationale
      vaarbewijzen voor binnenvaartuigen welke bij het goederen- en personenvervoer in de Gemeenschap gebruikt worden
      (PbEG L 235), of van een vaarbewijs als bedoeld in Bijlage I van [richtlijn nr. 91/672/EEG](31991L0672) van de Raad
      van de Europese Gemeenschappen van 16 december 1991 inzake de wederzijdse erkenning van de nationale vaarbewijzen
      voor het besturen van schepen in het goederen- en personenvervoer over de binnenwateren (PbEG L 373), of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.6.c)
    text: |-
      een vaartijd in de binnenvaart van ten minste vier jaar en het bezit van een aan het grote patent gelijkwaardig
      bevoegdheidsbewijs voor het voeren van een schip op binnenwateren van een lidstaat van de Centrale Commissie voor
      de Rijnvaart, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.6.d)
    text: |-
      een vaartijd in de binnenvaart van ten minste 4 jaar en het bezit van een aan het grote patent gelijkwaardig
      bevoegdheidsbewijs voor het voeren van een schip op andere binnenwateren dat door de Centrale Commissie voor de
      Rijnvaart ingevolge [artikel 3.05, derde lid, van het Patentreglement Rijn][ref1] is erkend;


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
    references:
      - id: ref1
        bwb_id: BWBR0026045
        artikel: '3'
  - number: 23.02.2.2.7
    text: |-
      voor de schipper: houder zijn van het patent, afgegeven overeenkomstig het [Patentreglement Rijn][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: 23.02.2.2.8
    text: 'voor de machinist:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.8.a)
    text: |-
      ten minste 18 jaar zijn en met goed gevolg een eindexamen hebben afgelegd voor een opleiding op het gebied van
      motoren en werktuigkunde, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.02.2.2.8.b)
    text: |-
      ten minste 19 jaar zijn en een vaartijd hebben van ten minste 2 jaren als matroos-motordrijver op een binnenschip
      met eigen mechanische middelen tot voortbeweging.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.02
  - number: 23.03.1
    text: |-
      Voor de lichamelijke geschiktheid voor het beroep gelden de eisen overeenkomstig de [bijlagen B1][ref1] en
      [B2 van het Patentreglement Rijn][ref2]. Deze moet worden aangetoond voor de eerste afgifte van het dienstboekje
      door:


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0026045
      - id: ref2
        bwb_id: BWBR0026045
  - number: 23.03.1.a
    text: |-
      een medische verklaring bedoeld in [bijlage B2 van het Patentreglement Rijn][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: 23.03.1.b
    text: |-
      een overeenkomstig [artikel 2.11, derde lid, van het Patentreglement Rijn][ref1] erkende


      [ref1]: https://wetten.overheid.nl/BWBR0026045#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0026045
        artikel: '2'
  - number: 23.03.1.b.aa
    text: Medische verklaring, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
  - number: 23.03.1.b.bb
    text: Geldig vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
  - number: 23.03.2
    text: |-
      De eisen voor ogen en oren, bedoeld in [bijlage B1 van het Patentreglement Rijn][ref1], zijn niet van toepassing
      voor de functie van machinist.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: 23.03.3
    text: |-
      Het bewijs van geschiktheid, bedoeld in het eerste en het tweede lid, dient binnen 3 maanden na het bereiken van de
      leeftijd van 65 jaar en daarna jaarlijks te worden vernieuwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
  - number: 23.03.4
    text: |-
      Indien een bevoegde autoriteit twijfels heeft omtrent de lichamelijke geschiktheid van een bemanningslid, kan zij
      om een medische keuring verzoeken. Het bemanningslid draagt slechts de daaruit voortvloeiende kosten wanneer de
      twijfels gegrond zijn gebleken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.03
  - number: 23.04.1
    text: |-
      Het dienstboekje bevat enerzijds gegevens van algemene aard, zoals de medische verklaringen en de bekwaamheid van
      de houder, bedoeld in [artikel 23.02][ref1], en anderzijds de specifieke gegevens betreffende de afgelegde reizen.
      De plaatselijk bevoegde autoriteit is verantwoordelijk voor het invullen van de gegevens van algemene aard alsmede
      voor de afstempeling ter controle. Zij kan daartoe het overleggen van vaartijdenboeken dan wel uittreksels daarvan
      of van andere relevante bescheiden verlangen. Zij mag slechts die reizen van een afstempeling voorzien die niet
      ouder zijn dan 15 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '23'
        hoofdstuk: '23'
  - number: 23.04.2
    text: |-
      Elk lid van de bemanning moet in het bezit zijn van een persoonlijk dienstboekje overeenkomstig het model van
      [bijlage F][ref1] dan wel in het bezit zijn van een ander door de Centrale Commissie voor de Rijnvaart als
      gelijkwaardig erkend dienstboekje. Deze persoon wordt als houder van het dienstboekje aangemerkt. De houder moet
      het dienstboekje:


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 23.04.2.a)
    text: bij de eerste indiensttreding aan boord overhandigen aan de schipper, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
  - number: 23.04.2.b)
    text: |-
      telkens binnen een periode van 12 maanden te rekenen vanaf de datum van afgifte, ten minste éénmaal overleggen en
      laten afstempelen zoals bedoeld in het eerste lid door een plaatselijk bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
  - number: 23.04.3
    text: 'De schipper is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
  - number: 23.04.3.a)
    text: |-
      het regelmatig invullen in het dienstboekje van alle gegevens overeenkomstig de aanwijzingen en instructies voor
      het bijhouden vermeld in [bijlage F][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 23.04.3.b)
    text: |-
      het veilig in het stuurhuis bewaren van het dienstboekje tot aan het eind van het dienstverband, arbeidscontract
      dan wel andere regeling;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
  - number: 23.04.3.c)
    text: het te allen tijde op verzoek van de houder onverwijld teruggeven van het dienstboekje.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
  - number: 23.04.4
    text: |-
      Bij leden van de bemanning die in het bezit zijn van een groot patent als bedoeld in [bijlage A1][ref1] dan wel
      van een voorlopig groot patent als bedoeld in [bijlage A2 van het Patentreglement Rijn][ref2] geldt dit patent
      als dienstboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
      [ref2]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
    references:
      - id: ref1
        bwb_id: BWBR0026045
      - id: ref2
        bwb_id: BWBR0026045
  - number: 23.04.5
    text: 'De bekwaamheid voor een functie aan boord moet te allen tijde kunnen worden aangetoond:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
  - number: 23.04.5.a)
    text: |-
      door de schipper door middel van het patent dat overeenkomstig het [Patentreglement Rijn][ref1] wordt vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: 23.04.5.b)
    text: door de overige leden van de bemanning door middel van het dienstboekje of een patent als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.04
  - number: 23.05.1
    text: |-
      Men onderscheidt de volgende exploitatiewijzen: A1:. vaart van ten hoogste 14 uren; A2:. vaart van ten hoogste 18
      uren; B:. vaart van ten hoogste 24 uren; telkens binnen een tijdvak van 24 uur.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.05
  - number: 23.05.2
    text: |-
      Bij exploitatiewijze A1 mag de vaart eenmaal per week tot ten hoogste 16 uren worden verlengd, indien de vaartijd
      kan worden aangetoond met de registraties van een goed functionerende tachograaf van een type dat overeenkomstig
      bijlage H is goedgekeurd door de bevoegde autoriteit van een Oeverstaat of van België en wanneer er behalve de
      schipper nog een bemanningslid in de bemanning is opgenomen met de bevoegdheid van stuurman.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.05
  - number: 23.05.3
    text: |-
      Een schip dat op de onder A1, onderscheidenlijk A2 bedoelde wijze wordt geëxploiteerd moet de vaart gedurende 8,
      onderscheidenlijk 6 aaneengesloten uren onderbreken, te weten:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.05
  - number: 23.05.3.a)
    text: in de exploitatiewijze A1 tussen 22.00 en 06.00 uur, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.05
  - number: 23.05.3.b)
    text: in de exploitatiewijze A2 tussen 23.00 en 05.00 uur.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.05
  - number: 23.06.1
    text: |-
      Bij exploitatiewijze A1 heeft elk bemanningslid recht op een ononderbroken rusttijd van 8 uren buiten de vaartijd
      per tijdvak van 24 uren, gerekend vanaf het eind van elke rusttijd van 8 uren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.06
  - number: 23.06.2
    text: |-
      Bij exploitatiewijze A2 heeft elk bemanningslid recht op een rusttijd van 8 uren, waarvan 6 uren ononderbroken
      buiten de vaartijd per tijdvak van 24 uren, gerekend vanaf het einde van elke rusttijd van 6 uren. Voor
      bemanningsleden onder de 18 jaar moet een ononderbroken rusttijd van 8 uren worden aangehouden waarvan 6 uren
      buiten de vaartijd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.06
  - number: 23.06.3
    text: |-
      Bij exploitatiewijze B heeft elk bemanningslid recht op een rusttijd van 24 uren per tijdvak van 48 uren, waarvan
      er ten minste 2 maal 6 uren ononderbroken moeten zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.06
  - number: 23.06.4
    text: |-
      Gedurende zijn verplichte rusttijd mag een bemanningslid niet worden verplicht tot enige taak, met inbegrip van
      toezicht houden of zich beschikbaar houden. De wacht en het toezicht zoals bedoeld in de politievoorschriften voor
      stilliggende vaartuigen worden niet beschouwd als taak in de zin van dit lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.06
  - number: 23.06.5
    text: |-
      Bepalingen in de arbeidsvoorschriften of collectieve arbeidsovereenkomsten die voorzien in een langere duur van de
      rusttijden blijven onverminderd van kracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.06
  - number: 23.07.1
    text: |-
      In afwijking van [artikel 23.05, eerste en derde lid][ref1], is een wisseling of herhaling van exploitatiewijze
      slechts mogelijk met inachtneming van het tweede tot met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '23'
        hoofdstuk: '23'
  - number: 23.07.2
    text: 'Van exploitatiewijze A1 mag slechts dan naar exploitatiewijze A2 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.2.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.2.b)
    text: |-
      de voor exploitatiewijze A2 bestemde bemanningsleden direct vóór de wisseling een rusttijd van 8 uren, waarvan
      6 uren buiten de vaartijd, in acht genomen en aangetoond hebben en de voor exploitatiewijze A2 voorgeschreven
      versterking zich aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.3
    text: 'Van exploitatiewijze A2 mag slechts dan naar exploitatiewijze A1 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.3.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.3.b)
    text: |-
      de voor exploitatiewijze A1 bestemde bemanningsleden direct vóór de wisseling een ononderbroken rusttijd van 8 uren
      buiten de vaartijd in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.4
    text: 'Van exploitatiewijze B mag slechts dan naar exploitatiewijze A1 of A2 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.4.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.4.b)
    text: |-
      de voor exploitatiewijze A1, onderscheidenlijk A2 bestemde bemanningsleden direct vóór de wisseling een
      ononderbroken rusttijd van 8, onderscheidenlijk 6 uren in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.5
    text: 'Van exploitatiewijze A1 of A2 mag slechts dan naar exploitatiewijze B worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.5.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.5.b)
    text: |-
      de voor exploitatiewijze B bestemde bemanningsleden direct vóór de wisseling een ononderbroken rusttijd van 8,
      onderscheidenlijk 6 uren buiten de vaartijd in acht genomen en aangetoond hebben en de voor exploitatiewijze B
      voorgeschreven versterking zich aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.6
    text: |-
      Een schip kan onmiddellijk in aansluiting op de exploitatiewijze A1 of A2 voor een verdere A1 of A2 worden ingezet,
      indien een voltallige uitwisseling van de bemanning heeft plaatsgevonden en de nieuwe bemanningsleden onmiddellijk
      voorafgaand aan de verdere exploitatiewijze A1 en A2 een ononderbroken rusttijd van 8, onderscheidenlijk 6 uren
      buiten de vaartijd in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
  - number: 23.07.7
    text: |-
      Het bewijs van een rusttijd van 8, onderscheidenlijk 6 uren wordt aangetoond met een verklaring als bedoeld in
      [bijlage K][ref1] of door een kopie van de pagina met aantekeningen van de vaar-, onderscheidenlijk rusttijden uit
      het vaartijdenboek van het schip, waarop de laatste reis van het bemanningslid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 23.08.1
    text: |-
      Aan boord van elk schip, met uitzondering van sleep- en duwboten die slechts in havens verkeren, onbemande
      duwbakken, overheidsschepen en pleziervaartuigen, moet zich in de stuurhut een vaartijdenboek bevinden
      overeenkomstig het model van [bijlage E][ref1]. Dit boek dient te worden bijgehouden overeenkomstig de daarin
      vervatte aanwijzingen. De schipper is verantwoordelijk voor de aanwezigheid van het vaartijdenboek en de
      aantekeningen die daarin moeten worden gemaakt. Het eerste vaartijdenboek, waarop het nummer 1, de naam van
      het schip en het officiële scheepsnummer dienen te staan, moet worden afgegeven door de autoriteit die het
      certificaat van onderzoek aan het schip heeft uitgereikt. Onderdeel 2 van de aanwijzingen voor het bijhouden van
      het vaartijdenboek, volgens welk per reis kan worden volstaan met één schema voor het aantekenen van de rusttijden,
      geldt slechts voor bemanningsleden in de exploitatiewijze B. In de exploitatiewijze A1 en in de exploitatiewijze
      A2 moeten het begin en het einde van de rusttijd van elk bemanningslid iedere dag gedurende de reis worden
      aangetekend. De na een wisseling van de exploitatiewijze noodzakelijke aantekeningen moeten op een nieuwe bladzijde
      van het vaartijdenboek worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 23.08.2
    text: |-
      Alle latere vaartijdenboeken mogen worden afgegeven door een plaatselijk bevoegde autoriteit, die het van
      een volgnummer voorziet; zij kunnen evenwel slechts worden afgegeven tegen overlegging van het voorgaande
      vaartijdenboek. Het voorgaande vaartijdenboek moet worden voorzien van de onuitwisbare aantekening ‘ongeldig’ en
      dient aan de schipper te worden teruggegeven. Het overhandigen van het nieuwe vaartijdenboek kan geschieden op
      vertoon van het document, bedoeld in het vierde lid. De exploitant van het schip moet er voor zorg dragen, dat het
      voorafgaande vaartijdenboek binnen 30 dagen na de afgiftedatum van het nieuwe vaartijdenboek, die op het document,
      bedoeld in het vierde lid, door de bevoegde autoriteit geregistreerd is, door dezelfde bevoegde autoriteit
      onuitwisbaar ongeldig verklaard wordt. De exploitant van het schip moet er bovendien voor zorgen, dat daarna het
      vaartijdenboek weer aan boord wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.08
  - number: 23.08.3
    text: |-
      Het ongeldig verklaarde vaartijdenboek moet gedurende zes maanden na de laatste aantekening aan boord worden
      bewaard.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.08
  - number: 23.08.4
    text: |-
      Bij de afgifte van het eerste vaartijdenboek overeenkomstig het eerste lid bevestigt de autoriteit, die het eerste
      vaartijdenboek uitreikt, deze afgifte door middel van een verklaring waarop de naam van het schip, het officiële
      scheepsnummer, het nummer van het vaartijdenboek en de datum van afgifte zijn vermeld. Deze verklaring dient aan
      boord te worden bewaard en op verzoek te worden getoond. De afgifte van latere vaartijdenboeken overeenkomstig het
      tweede lid moet door de bevoegde autoriteit op de verklaring worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.08
  - number: 23.08.5
    text: De registraties van de tachografen moeten gedurende zes maanden na de laatste registratie aan boord worden bewaard.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.08
  - number: 23.08.6
    text: |-
      Bij een aflossing of versterking van de bemanning als bedoeld in [artikel 23.07][ref1] moet voor ieder nieuw
      bemanningslid een verklaring als bedoeld in [bijlage K][ref2] of een kopie van de pagina met de aantekeningen
      van de vaar-, onderscheidenlijk rusttijden uit het vaartijdenboek van het schip, waarop de laatste reis van het
      bemanningslid heeft plaatsgevonden, voorhanden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '23'
        hoofdstuk: '23'
      - id: ref2
        bwb_id: BWBR0025973
  - number: 23.09.1
    text: |-
      Onverminderd de overige bepalingen van dit reglement moeten motorschepen, duwboten, duwstellen en
      passagiersschepen, die met een minimum-bemanning worden geëxploiteerd, aan de volgende voorschriften voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1
    text: Standaard S1
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.a)
    text: |-
      De voortstuwingsinstallaties moeten zo zijn ingericht, dat de verandering van de vaarsnelheid en de omkering van de
      richting van de stuwkracht van de schroef vanaf de stuurstelling kunnen geschieden. De hulpmotoren die nodig zijn
      bij het varen met het schip moeten vanaf de stuurstelling kunnen worden aan- en afgezet, tenzij dit automatisch
      geschiedt, dan wel deze motoren gedurende elke reis ononderbroken in bedrijf zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.b)
    text: |-
      Het kritieke peil van de temperatuur van het koelwater van de hoofdmotoren, van de druk van de smeerolie van
      de hoofdmotoren en de transmissie, van de oliedruk en de luchtdruk van de omkeerinrichting van de hoofdmotoren,
      de keerkoppeling of de schroeven en van het bilgewater in de hoofdmachinekamer moet worden aangegeven door
      installaties die in het stuurhuis akoestische en optische alarmsignalen in werking stellen. De akoestische
      alarmsignalen mogen in één akoestisch apparaat verenigd zijn. Zij mogen worden uitgeschakeld zodra de storing
      is vastgesteld. De optische alarmsignalen mogen pas worden uitgeschakeld, nadat de desbetreffende storingen zijn
      verholpen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.c)
    text: De brandstoftoevoer en de koeling van de hoofdmotoren dienen automatisch te geschieden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.d)
    text: |-
      De bediening van de stuurinrichting moet zelfs bij de grootste toegelaten inzinking door één persoon zonder
      bijzondere krachtsinspanning kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.e)
    text: |-
      De bij het [Rijnvaartpolitiereglement][ref1] voorgeschreven optische tekens en geluidsseinen van varende schepen
      dienen vanaf de stuurstelling te kunnen worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 23.09.1.1.1.f)
    text: |-
      Indien geen rechtstreeks contact mogelijk is tussen de stuurstelling en het voorschip, het achterschip, de
      verblijven en de machinekamer, dient een spreekverbinding te zijn aangebracht. Voor contact met de machinekamer
      mogen in plaats van een spreekverbinding optische en akoestische signalen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.g)
    text: (Vervallen).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.h)
    text: (Vervallen).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.i)
    text: |-
      De kracht die nodig is om zwengels en soortgelijke draaibare voorzieningen van hefwerktuigen te bedienen mag niet
      meer dan 160 N bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.j)
    text: De in het certificaat van onderzoek vermelde sleeplieren dienen door een motor te worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.k)
    text: De lenspompen en de dekwaspompen dienen door een motor te worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.l)
    text: De voornaamste bedieningsinrichtingen en controle-instrumenten dienen ergonomisch te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.1.m)
    text: |-
      De krachtens [artikel 6.01, eerste lid][ref1], vereiste inrichtingen dienen vanaf de stuurstelling te kunnen worden
      bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel6
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '6'
        hoofdstuk: '6'
  - number: 23.09.1.1.2
    text: Standaard S2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.2.a)
    text: |-
      voor alleen varende motorschepen: Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare
      boegschroefinstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.2.b)
    text: |-
      voor motorschepen, die gekoppelde vaartuigen voortbewegen: Standaard S1 en bovendien een uitrusting met een vanuit
      de stuurhut bedienbare boegschroefinstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.2.c)
    text: |-
      voor motorschepen, die een duwstel, bestaande uit het motorschip en een vaartuig ervoor, voortbewegen: Standaard S1
      en bovendien een uitrusting met hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is echter niet
      vereist, wanneer het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust, die vanuit de
      stuurhut van het duwende motorschip te bedienen is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.2.d)
    text: |-
      voor duwboten, die een duwstel voortbewegen: Standaard S1 en bovendien een uitrusting met hydraulisch of elektrisch
      aangedreven koppellieren. Deze uitrusting is echter niet vereist, wanneer het vaartuig aan de kop van het duwstel
      met een boegschroefinstallatie is uitgerust, die vanuit de stuurhut van het duwende duwboot te bedienen is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.1.1.2.e)
    text: |-
      voor passagiersschepen: Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare
      boegschroefinstallatie. Deze uitrusting is echter niet vereist, indien de voortstuwingsinstallatie en de
      stuurinrichting van het passagiersschip gelijkwaardige manoeuvreereigenschappen waarborgen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.09.2
    text: |-
      Het voldoen of niet voldoen aan de voorschriften, bedoeld in het eerste lid, wordt door de Commissie van
      Deskundigen in het certificaat van onderzoek onder nummer 47 gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.09
  - number: 23.10.1
