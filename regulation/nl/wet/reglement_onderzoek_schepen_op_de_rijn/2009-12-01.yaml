  - number: '19.02'
    text: 'Op kanaalspitsen zijn van toepassing:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.1
    text: |-
      de [artikelen 3.01][ref1], [3.02, tweede lid][ref2], [3.03, tweede tot en met vierde en zesde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel3
