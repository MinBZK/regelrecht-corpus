  - number: 23.10.2
    text: |-
      De in het eerste lid voorgeschreven matrozen mogen door lichtmatrozen worden vervangen, die een minimum-leeftijd
      van 17 jaar hebben bereikt, zich ten minste in het derde leerjaar bevinden en een jaar vaartijd in de binnenvaart
      kunnen aantonen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.10
  - number: 23.10.3
    text: De in het eerste lid voorgeschreven minimum-bemanning
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.10
  - number: 23.10.3.a)
    text: in groep 2, exploitatiewijze A1, Standaard S2, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.10
  - number: 23.10.3.b)
    text: in groep 3, exploitatiewijze A1, Standaard S1,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.10
  - number: 23.11.1
    text: |-
      De minimum-bemanning van hechte samenstellen en andere hechte samenstellingen bestaat uit:
















                    Groep


                    Bemanningsleden



