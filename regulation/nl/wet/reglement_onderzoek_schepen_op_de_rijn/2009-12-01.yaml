  - number: 1.02.1
    text: 'Dit reglement is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.1.a
    text: schepen met een lengte van 20 m of meer;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.1.b
    text: schepen waarvan het volume, berekend uit het produkt L * B * T, 100 m³ of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.2
    text: 'Ongeacht het in het eerste lid bepaalde is dit reglement van toepassing op alle:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.2.a
    text: |-
      sleep- en duwboten die zijn bestemd om de in het eerste lid bedoelde schepen of drijvende werktuigen te slepen, te
      duwen of langszijde gekoppeld mede te voeren;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.2.b
    text: schepen die beschikken over een certificaat van goedkeuring als bedoeld in het ADNR;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.2.c
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.2.d
    text: drijvende werktuigen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
  - number: 1.02.3
    text: |-
      Dit reglement is niet van toepassing op veerponten als bedoeld in het [Rijnvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: '1.03'
    text: |-
      De in [artikel 1.02, eerste en tweede lid][ref1], bedoelde vaartuigen moeten zijn voorzien van een certificaat van
      onderzoek dat is afgegeven door een Commissie van Deskundigen, die door één der Oeverstaten of België is ingesteld,
      of van een door de Centrale Commissie van de Rijnvaart als gelijkwaardig erkend certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '1'
        hoofdstuk: '1'
  - number: '1.04'
    text: |-
      Voor kanaalspitsen die slechts de Rijn tussen Basel (Mittlere Rheinbrücke) en de sluizen te Iffezheim (met inbegrip
      van de meest benedenstrooms gelegen voorhaven) bevaren, volstaat in plaats van het certificaat van onderzoek een
      door een Commissie van Deskundigen van één der Oeverstaten of België afgegeven certificaat, waaruit de geschiktheid
      voor de vaart op dit riviergedeelte blijkt. In dit geval moeten zij voldoen aan [hoofdstuk 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk19
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '19'
  - number: '1.05'
    text: |-
      Voor zeeschepen wordt het certificaat van onderzoek volgens [bijlage B][ref1], indien zij niet van dit certificaat
      zijn voorzien, vervangen door een certificaat volgens [bijlage G][ref2], waaruit de geschiktheid voor de vaart op
      de Rijn blijkt. In dit geval moeten zij voldoen aan [hoofdstuk 20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0025973
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk20
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
      - id: ref2
        bwb_id: BWBR0025973
      - id: ref3
        bwb_id: BWBR0025973
        hoofdstuk: '20'
  - number: '1.06'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen, wanneer het voor een
      aanpassing aan de technische ontwikkeling van de binnenscheepvaart noodzakelijk wordt geacht om in dringende
      gevallen afwijkingen van dit reglement toe te laten dan wel proefnemingen mogelijk te maken, waardoor de veiligheid
      en de vlotte afwikkeling van het scheepvaartverkeer niet worden benadeeld. Deze voorschriften van tijdelijke
      aard worden door de bevoegde autoriteit gepubliceerd en hebben een geldigheidsduur van ten hoogste drie jaren.
      Zij worden in alle Oeverstaten en in België op hetzelfde tijdstip in werking gesteld en worden onder dezelfde
      voorwaarden buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.06
  - number: 1.07.1
    text: |-
      In het belang van een eenvoudige en uniforme toepassing van dit reglement kan de Centrale Commissie voor de
      Rijnvaart richtlijnen voor de Commissies van Deskundigen vaststellen. De Commissies van Deskundigen worden van deze
      richtlijnen in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.07
  - number: 1.07.2
    text: |-
      In het belang van een eenvoudige en uniforme toepassing van [hoofdstuk 23][ref1] kan de Centrale Commissie voor
      de Rijnvaart richtlijnen voor de terzake van dat hoofdstuk bevoegde autoriteiten vaststellen. Deze bevoegde
      autoriteiten worden van deze richtlijnen in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '23'
  - number: 1.07.3
    text: |-
      De Commissies van Deskundigen en de ter zake van [hoofdstuk 23][ref1] bevoegde autoriteiten dienen zich aan deze
      richtlijnen te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel1.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '23'
  - number: 2.01.1
    text: |-
      In bepaalde daarvoor in aanmerking komende havens zijn door de Oeverstaten en België Commissies van Deskundigen
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.01
  - number: 2.01.2
    text: |-
      De Commissies van Deskundigen bestaan uit een voorzitter en deskundigen. Als deskundigen maken van iedere Commissie
      ten minste deel uit:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.01
  - number: 2.01.2.a
    text: een ambtenaar van het bevoegd gezag op het gebied van de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.01
  - number: 2.01.2.b
    text: een deskundige op het gebied van de bouw van binnenschepen en hun machines,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.01
  - number: 2.01.2.c
    text: |-
      een nautisch deskundige die in het bezit is van het grote patent als bedoeld in het [Patentreglement Rijn][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.01
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: 2.01.3
    text: |-
      De voorzitter en de deskundigen van elke Commissie worden benoemd door de autoriteiten van de staat waartoe de
      Commissie behoort. De voorzitter en de deskundigen dienen bij de aanvaarding van hun functie schriftelijk te
      verklaren dat zij deze in alle onpartijdigheid zullen vervullen. Van ambtenaren wordt een dergelijke verklaring
      niet geëist.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.01
  - number: 2.01.4
    text: |-
      De Commissies van Deskundigen kunnen zich onder de voorwaarden, zoals door elk der betrokken staten zullen worden
      vastgesteld, doen bijstaan door gespecialiseerde deskundigen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.01
  - number: 2.02.1
    text: |-
      De eigenaar van een vaartuig of zijn vertegenwoordiger die een onderzoek hiervan wenst, moet bij de Commissie
      van Deskundigen van zijn keuze een aanvraag indienen volgens het model van [bijlage A][ref1]. De Commissie van
      Deskundigen stelt vast welke bescheiden moeten worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.02.2
    text: |-
      De eigenaar van een vaartuig, waarop dit reglement niet van toepassing is, of zijn vertegenwoordiger, kan een
      certificaat van onderzoek aanvragen. Aan deze aanvraag dient gevolg te worden gegeven wanneer het schip voldoet aan
      de bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.02
  - number: 2.03.1
    text: |-
      De eigenaar of zijn vertegenwoordiger moet het vaartuig leeg, schoongemaakt en met volledige uitrusting voor
      onderzoek aanbieden. Hij is verplicht bij het onderzoek de noodzakelijke hulp te verlenen, bijv. een geschikte boot
      met personeel ter beschikking te stellen, en die delen van de romp of van de installaties bloot te leggen, die niet
      direct toegankelijk of zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.03
  - number: 2.03.2
    text: |-
      De Commissie van Deskundigen moet bij het eerste onderzoek het schip op het droge bezichtigen. Bezichtiging op het
      droge kan achterwege blijven wanneer een klassecertificaat of een verklaring van een erkend classificatiebureau,
      volgens welke de bouw voldoet aan de daardoor gehanteerde voorschriften, wordt overgelegd. Bij aanvullende of
      bijzondere onderzoeken kan de Commissie van Deskundigen een bezichtiging op het droge verlangen. De Commissie van
      Deskundigen moet bij het eerste onderzoek van motorschepen en samenstellen, alsmede bij essentiële veranderingen in
      de voortstuwingsinstallatie of de stuurinrichting proefvaarten doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.03
  - number: 2.03.3
    text: |-
      De Commissie van Deskundigen kan extra bezichtigingen en proefvaarten doen plaatsvinden en nadere bewijzen
      verlangen. Dit geldt tevens tijdens de bouw.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.03
  - number: 2.04.1
    text: |-
      Wanneer de Commissie van Deskundigen op grond van het onderzoek van een vaartuig vaststelt dat dit beantwoordt aan
      de voorschriften van dit reglement met betrekking tot bouw, inrichting en uitrusting, geeft zij aan de aanvrager
      een certificaat van onderzoek volgens het model van [bijlage B][ref1] af.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.04.2
    text: |-
      Ingeval de Commissie van Deskundigen weigert een certificaat van onderzoek af te geven, moet zij dit aan de
      aanvrager gemotiveerd schriftelijk mededelen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.04
  - number: 2.04.3
    text: |-
      De onderscheidingsletters van de Commissie van Deskundigen en het volgnummer van het certificaat van onderzoek
      moeten onuitwisbaar in Latijnse letters en Arabische cijfers van ten minste 2 cm hoogte zijn aangebracht op een
      goed zichtbare plaats, die in het certificaat van onderzoek is vermeld, op een vast gedeelte van het schip dat is
      beschermd tegen stoten en dat slechts in geringe mate onderhevig is aan slijtage.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.04
  - number: 2.05.1
    text: 'De Commissie van Deskundigen kan een voorlopig certificaat afgeven voor:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
  - number: 2.05.1.a
    text: |-
      vaartuigen die, teneinde een certificaat van onderzoek te verkrijgen, een reis willen ondernemen naar een Commissie
      van Deskundigen van hun keuze;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
  - number: 2.05.1.b
    text: |-
      vaartuigen die, wegens één van de in de [artikelen 2.07][ref1], [2.13][ref2], eerste lid, of [2.14][ref3] bedoelde
      gevallen, tijdelijk niet van hun certificaat van onderzoek zijn voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.05.1.c
    text: vaartuigen waarvan het certificaat van onderzoek na het onderzoek nog in behandeling is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
  - number: 2.05.1.d
    text: |-
      vaartuigen waarbij niet aan alle voorwaarden voor de afgifte van een certificaat van onderzoek overeenkomstig
      [bijlage B][ref1] of een certificaat overeenkomstig [bijlage G][ref2] wordt voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
      - id: ref2
        bwb_id: BWBR0025973
  - number: 2.05.1.e
    text: |-
      vaartuigen die zodanige schade hebben geleden dat de staat waarin zij verkeren niet meer overeenstemt met het in
      het certificaat van onderzoek gestelde;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
  - number: 2.05.1.f
    text: |-
      drijvende inrichtingen en drijvende voorwerpen, in het geval dat de voor de toepassing van
      [artikel 1.21, eerste lid, van het Rijnvaart-politiereglement][ref1] bevoegde autoriteit de vergunning voor een
      bijzonder transport afhankelijk stelt van het hebben van een voorlopig certificaat van onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '1'
  - number: 2.05.1.g
    text: |-
      vaartuigen waarvoor een Commissie van Deskundigen gelijkwaardige voorzieningen als bedoeld in
      [artikel 2.19, tweede lid][ref1], toestaat, voor die gevallen waarvoor de Centrale Commissie voor de Rijnvaart nog
      geen aanbeveling heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.05.2
    text: |-
      Het voorlopige certificaat van onderzoek wordt volgens het model van [bijlage D][ref1] afgegeven, wanneer de
      deugdelijkheid van het vaartuig, de drijvende inrichting of het drijvende voorwerp voor de vaart voldoende
      gewaarborgd wordt geacht. Het moet de voorwaarden bevatten die door de Commissie van Deskundigen nodig worden
      geacht en is geldig:


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.05.2.a
    text: |-
      in de in het eerste lid, onder a en d tot en met f, bedoelde gevallen voor één bepaalde reis, te maken binnen een
      redelijke termijn, die ten hoogste één maand mag zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
  - number: 2.05.2.b
    text: in de in het eerste lid, onder b en c, bedoelde gevallen gedurende een redelijke termijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
  - number: 2.05.2.c
    text: |-
      in de in het eerste lid, onder g, genoemde gevallen gedurende zes maanden. Deze termijn mag slechts worden verlengd
      met toestemming van de Centrale Commissie voor de Rijnvaart.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.05
  - number: 2.06.1
    text: |-
      De geldigheidsduur van de volgens de bepalingen van dit reglement opgemaakte certificaten van onderzoek bedraagt
      ingeval van nieuwbouw:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.06
  - number: 2.06.1.a
    text: 5 jaren voor passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.06
  - number: 2.06.1.b
    text: 10 jaren voor alle andere vaartuigen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.06
  - number: 2.06.2
    text: |-
      Voor vaartuigen die reeds vóórdat het onderzoek plaatsvindt in bedrijf waren, wordt de geldigheidsduur van het
      certificaat van onderzoek voor elk geval afzonderlijk, afhankelijk van de uitkomsten van het onderzoek, door de
      Commissie van Deskundigen bepaald. Deze geldigheidsduur mag evenwel niet langer zijn dan bij het eerste lid is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.06
  - number: 2.07.1
    text: |-
      Elke verandering van naam, overgang van de eigendom, iedere hermeting van een vaartuig alsmede elke wijziging
      van het officiële scheepsnummer, van de te boekstelling of van de thuishaven moet door de eigenaar of zijn
      vertegenwoordiger ter kennis worden gebracht van een Commissie van Deskundigen. Hij moet daarbij tevens het
      certificaat van onderzoek aan deze Commissie ter wijziging voorleggen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.07
  - number: 2.07.2
    text: |-
      Alle aantekeningen in of wijzigingen van het certificaat van onderzoek, voorzien in dit reglement, in het
      [Rijnvaartpolitiereglement][ref1] en in andere, in gemeen overleg door de Oeverstaten en België vastgestelde
      bepalingen, kunnen door iedere Commissie van Deskundigen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.07
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 2.07.3
    text: |-
      Wanneer een Commissie van Deskundigen in het certificaat een wijziging aanbrengt of daarin een aantekening stelt,
      moet zij daarvan kennis geven aan de Commissie die het betrokken certificaat heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.07
  - number: 2.08.1
    text: |-
      Na iedere ingrijpende verandering of reparatie van een vaartuig die van invloed is op de hechtheid van de bouw,
      de vaar- of manoeuvreereigenschappen of op de kenmerkende eigenschappen moet het vaartuig, voor het weer in de
      vaart komt, aan een Commissie van Deskundigen worden aangeboden, teneinde aan een bijzonder onderzoek te worden
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.08
  - number: 2.08.2
    text: |-
      De Commissie van Deskundigen die het bijzonder onderzoek verricht, stelt, afhankelijk van de resultaten van dit
      onderzoek, de geldigheidsduur van het certificaat van onderzoek vast. Deze periode mag niet langer zijn dan de
      lopende geldigheidsduur van het certificaat van onderzoek. De geldigheidsduur wordt aangetekend in het certificaat
      van onderzoek en dient ter kennis te worden gebracht van de Commissie van Deskundigen die het certificaat heeft
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.08
  - number: 2.09.1
    text: |-
      Vóór afloop van de geldigheidsduur van het certificaat van onderzoek moet het vaartuig aan een aanvullend onderzoek
      worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.09
  - number: 2.09.2
    text: |-
      Bij wijze van uitzondering kan de Commissie van Deskundigen op een met redenen omkleed verzoek van de eigenaar of
      zijn vertegenwoordiger de geldigheidsduur van het certificaat van onderzoek zonder aanvullend onderzoek met ten
      hoogste één jaar verlengen. Deze verlenging wordt schriftelijk gegeven en moet zich aan boord van het vaartuig
      bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.09
  - number: 2.09.3
    text: |-
      De Commissie van Deskundigen die het aanvullend onderzoek verricht, stelt afhankelijk van de resultaten daarvan
      de nieuwe geldigheidsduur van het certificaat vast. Hierbij wordt [artikel 2.06][ref1] in acht genomen. De
      geldigheidsduur wordt aangetekend in het certificaat van onderzoek en dient ter kennis te worden gebracht van de
      Commissie van Deskundigen die het certificaat heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.09.4
    text: |-
      Indien in plaats van verlenging van de geldigheidsduur het certificaat van onderzoek door een nieuw certificaat
      wordt vervangen, dient het oude certificaat te worden teruggezonden aan de Commissie van Deskundigen die het heeft
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.09
  - number: '2.10'
    text: |-
      De eigenaar van een vaartuig of zijn vertegenwoordiger kan op elk moment om een vrijwillig onderzoek verzoeken. Aan
      dit verzoek om een onderzoek dient gevolg te worden gegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.10
  - number: 2.11.1
    text: |-
      Wanneer een der bevoegde autoriteiten, belast met de zorg voor de veiligheid van de scheepvaart op de Rijn, van
      mening is dat een vaartuig gevaar kan opleveren voor de zich aan boord bevindende personen of voor de scheepvaart,
      kan zij gelasten dat het vaartuig door een Commissie van Deskundigen wordt onderzocht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.11
  - number: 2.11.2
    text: |-
      De eigenaar van het vaartuig draagt slechts dan de kosten van het onderzoek, wanneer de Commissie van Deskundigen
      erkent dat de mening van de in het eerste lid bedoelde autoriteit gegrond is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.11
  - number: 2.12.1
    text: |-
      De Commissie van Deskundigen kan er geheel of gedeeltelijk van afzien te onderzoeken of een vaartuig voldoet aan
      de bepalingen van [Deel II][ref1] en van [artikel 23.09][ref2] voor zover uit een geldige verklaring, afgegeven
      door een classificatiebureau dat door de regeringen van alle Oeverstaten en van België is erkend, blijkt dat het
      vaartuig geheel of gedeeltelijk aan die bepalingen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0025973
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '23'
        hoofdstuk: '23'
  - number: 2.12.2
    text: |-
      Een verklaring van een classificatiebureau, dan wel – voor zover dit volgens dit reglement voor bepaalde onderdelen
      van de uitrusting is toegelaten – van een andere instantie, mag door de bevoegde autoriteit slechts dan worden
      erkend, indien dat classificatiebureau of die andere instantie verklaart dat het de bepalingen van de richtlijnen
      bedoeld in [artikel 1.07][ref1] in acht heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.13.1
    text: |-
      Wanneer een Commissie van Deskundigen tijdens een onderzoek bemerkt dat een vaartuig of de uitrusting daarvan
      ernstige gebreken vertoont, en dat daardoor de veiligheid van de zich aan boord bevindende personen of de
      scheepvaart in gevaar wordt gebracht, dient het certificaat te worden ingehouden en dient de Commissie die
      het heeft afgegeven hiervan onverwijld in kennis te worden gesteld. Bij duwbakken en schepen bestemd voor
      bouwwerkzaamheden dient ook de in het [Rijnvaartpolitiereglement][ref1] voorgeschreven metalen plaat te worden
      ingehouden. Wanneer de Commissie van Deskundigen heeft geconstateerd dat de gebreken zijn verholpen wordt het
      certificaat aan de eigenaar of zijn vertegenwoordiger teruggegeven. Dit constateren en de teruggave van het
      certificaat kunnen op verzoek van de eigenaar of zijn vertegenwoordiger door tussenkomst van een andere Commissie
      geschieden. Wanneer de Commissie van Deskundigen die het certificaat heeft ingehouden vermoedt dat de gebreken niet
      binnen afzienbare tijd worden verholpen, wordt het certificaat gezonden aan de Commissie van Deskundigen die het
      heeft afgegeven of, in geval van verlenging, die het het laatst heeft verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 2.13.2
    text: |-
      Wanneer een vaartuig definitief is opgelegd of gesloopt, moet de eigenaar het certificaat terugzenden aan de
      Commissie van Deskundigen die het heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.13
  - number: 2.14.1
    text: |-
      Wanneer een certificaat van onderzoek verloren is gegaan, moet hiervan kennis worden gegeven aan de Commissie van
      Deskundigen die het heeft afgegeven. Deze Commissie geeft dan een duplicaat van het certificaat af, dat als zodanig
      is gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Wanneer een certificaat van onderzoek onleesbaar of om enige andere reden onbruikbaar is geworden, moet de eigenaar
      van het vaartuig of zijn vertegenwoordiger het certificaat terugzenden aan de Commissie van Deskundigen die het
      heeft afgegeven; deze geeft dan een duplicaat af, overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.14
  - number: 2.15.1
    text: |-
      Onverminderd [artikel 2.11, tweede lid][ref1], draagt de eigenaar van een vaartuig of zijn vertegenwoordiger de
      kosten die voortvloeien uit het onderzoek en de afgifte van het certificaat van onderzoek, overeenkomstig het
      geldende tarief, dat door elk der Oeverstaten en België wordt vastgesteld. Er mag hierbij geen onderscheid worden
      gemaakt uit hoofde van het land van teboekstelling van het vaartuig of de nationaliteit of woonplaats van de
      eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.15.2
    text: |-
      De Commissie van Deskundigen kan vóór het onderzoek een voorschot verlangen dat niet hoger mag zijn dan het
      vermoedelijke bedrag van de kosten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.15
  - number: '2.16'
    text: |-
      De Commissie van Deskundigen kan personen, die kunnen aantonen daar om gegronde redenen belang bij te hebben,
      kennis laten nemen van de inhoud van het certificaat van onderzoek van een vaartuig, en op hun kosten als zodanig
      aangeduide uittreksels of gewaarmerkte afschriften van het certificaat verstrekken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.16
  - number: 2.17.1
    text: |-
      De Commissies van Deskundigen geven de door hen afgegeven certificaten een volgnummer. Zij houden een register bij
      van alle door hen afgegeven certificaten overeenkomstig [bijlage C][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.17.2
    text: |-
      De Commissies van Deskundigen bewaren de minuut of een afschrift van elk certificaat dat zij hebben afgegeven.
      Daarop tekenen zij alle aantekeningen en wijzigingen, alsmede ongeldigheidsverklaringen en vervangingen van de
      certificaten aan en actualiseren zij volgens het eerste lid de registratie dienovereenkomstig.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.17
  - number: 2.17.3
    text: |-
      Ter uitvoering van de bestuursrechtelijke maatregelen op het gebied van de scheepvaart wordt aan de bevoegde
      autoriteiten van de Rijnoeverstaten en België, van de lidstaten van de Europese Unie en, voorzover een
      gelijkwaardige gegevensbescherming is gewaarborgd, aan de bevoegde autoriteiten van derde landen op grond van
      bestuursrechtelijke overeenkomsten het recht tot inzage in de registratie overeenkomstig [bijlage C][ref1]
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.18.1
    text: |-
      Het uniek Europees scheepsidentificatienummer (ENI), hierna Europees scheepsnummer genoemd, bestaat uit 8 Arabische
      cijfers overeenkomstig [bijlage L][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.18.2
    text: |-
      De Commissie van Deskundigen die het certificaat van onderzoek afgeeft voor een vaartuig, vult op dit certificaat
      het Europees scheepsnummer in. Dit nummer wordt, voorzover het vaartuig op het moment van de afgifte van het
      certificaat van onderzoek nog niet over een Europees scheepsnummer beschikt, door de bevoegde autoriteit van
      het land waarin zijn plaats van teboekstelling of zijn thuishaven is gelegen, toegekend. Indien geen Europees
      scheepsnummer kan worden toegekend aan een vaartuig in het land van zijn registratie of van zijn thuishaven,
      wordt het Europese scheepsnummer dat op het certificaat van onderzoek moet worden ingevuld, toegekend door de
      bevoegde autoriteit van de staat waarin de Commissie van Deskundigen is gevestigd die dit certificaat afgeeft. Deze
      bepalingen zijn niet van toepassing op zeeschepen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.18
  - number: 2.18.3
    text: |-
      Aan een vaartuig kan slechts één Europees scheepsnummer worden afgegeven. Het Europees scheepsnummer wordt slechts
      eenmalig toegekend en verandert tijdens de gehele levensduur van het vaartuig niet.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.18
  - number: 2.18.4
    text: |-
      De eigenaar van het vaartuig of zijn vertegenwoordiger moet de toekenning van het
      Europees scheepsnummer bij de bevoegde autoriteit aanvragen. Bij schepen zoals bedoeld in
      [artikel 2.01, eerste lid, onder c, van het Rijnvaartpolitiereglement][ref1] moet hij tevens het Europees
      scheepsnummer, dat in het certificaat van onderzoek is ingevuld, daarop doen aanbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '2'
  - number: 2.18.5
    text: |-
      De Rijnoeverstaten en België brengen de autoriteiten die bevoegd zijn tot het afgeven van een Europees
      scheepsnummer ter kennis van het secretariaat van de Centrale Commissie. het secretariaat van de Centrale Commissie
      voor Rijnvaart houdt een register bij van deze autoriteiten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.18
  - number: 2.18.6
    text: |-
      Elke in het vijfde lid bedoelde autoriteit treft de noodzakelijke maatregelen, om alle tot het afgeven van de
      Europese scheepsnummers bevoegde autoriteiten over ieder nieuw door haar afgegeven Europees scheepsnummer evenals
      over de ter identificatie van het vaartuig vereiste gegevens te informeren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.18
  - number: 2.19.1
    text: |-
      Wanneer in de bepalingen van [Deel II][ref1] wordt bepaald dat op een vaartuig bepaalde materialen, inrichtingen of
      uitrustingsstukken moeten worden gebruikt of aan boord moeten zijn, of dat bepaalde bouwkundige maatregelen moeten
      worden getroffen of bepaalde opstellingen moeten worden aangehouden, kan de Commissie van Deskundigen de toepassing
      of de aanwezigheid aan boord van dit vaartuig van andere materialen, inrichtingen of uitrustingsstukken toestaan,
      dan wel dat andere bouwkundige maatregelen worden getroffen of dat andere opstellingen worden aangehouden, mits
      deze op grond van aanbevelingen van de Centrale Commissie voor de Rijnvaart als gelijkwaardig zijn erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.19.2
    text: |-
      Wanneer de Centrale Commissie voor de Rijnvaart nog geen aanbeveling met betrekking tot een gelijkwaardigheid als
      bedoeld in het eerste lid heeft gedaan, kan de Commissie van Deskundigen een voorlopig certificaat van onderzoek
      afgeven. De bevoegde autoriteiten stellen de Centrale Commissie voor de Rijnvaart binnen een maand na afgifte van
      het voorlopig certificaat overeenkomstig [artikel 2.05, eerste lid onder g][ref1], in kennis van de naam en het
      officiële scheepsnummer van het vaartuig, van de aard van de afwijking, alsmede van het land waarin het vaartuig is
      teboekgesteld of waarin zijn thuishaven is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.19.3
    text: |-
      Bij wijze van proef en voor een beperkte tijdsduur kan een Commissie van Deskundigen op grond van een aanbeveling
      van de Centrale Commissie voor de Rijnvaart voor een vaartuig met nieuwe technische voorzieningen die afwijken van
      de bepalingen van [Deel II][ref1] een certificaat van onderzoek afgeven, voor zover deze nieuwe voorzieningen een
      voldoende veiligheid bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.19.4
    text: |-
      De in het eerste en derde lid genoemde gelijkwaardigheden en afwijkingen dienen in het certificaat van onderzoek te
      worden ingevuld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel2.19
  - number: '3.01'
    text: Schepen moeten volgens goed scheepsbouwgebruik zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.01
  - number: 3.02.1
    text: |-
      De sterkte van de scheepsromp moet zodanig zijn dat zij in overeenstemming is met de belasting waaraan de romp
      onder normale omstandigheden is blootgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.02.1.a
    text: |-
      Bij nieuwbouw van een schip en bij verbouwingen waardoor de sterkte van het schip kan worden beïnvloed, dient
      door berekeningen te worden aangetoond dat de scheepsromp sterk genoeg is. Dit is niet nodig, indien een
      klassecertificaat of een verklaring van een erkend classificatiebureau wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.02.1.b
    text: |-
      Bij onderzoeken als bedoeld in artikel 2.09 moeten de minimale diktes van de bodem-, kim- en zijbeplating van de
      scheepshuid overeenkomstig de volgende methode worden gecontroleerd: Bij schepen die van staal zijn gebouwd moet
      als minimale dikte t de grootste van de aan de hand van de volgende formules vastgestelde waarden worden genomen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.02.1.b.1
    text: |-
      Voor schepen met een lengte van meer dan 40 m: t = f · b · c (2,3 + 0,04 L) [mm] voor schepen met een lengte van 40
      m of minder: t = f · b · c (1,5 + 0,06 L) [mm], echter ten minste 3,0 mm.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.02.1.b.2
    text: |-
      Voor schepen ongeacht de lengte: t = 0,005 · a √ T [mm] In deze formules betekent:






                            a =


                            spantafstand in [mm];








                            f =


                            factor voor spantafstand:





                            f = 1 voor a ≤ 500 mm





                            f = 1 + 0,0013 (a – 500) voor a > 500 mm;








                            b =


                            factor voor bodem- en zijbeplating of kimbeplating:





                            b = 1,0 voor bodem- en zijbeplating





                            b = 1,25 voor kimbeplating.




                   Bij de berekening van de minimumdikte van de kimbeplating kan voor de factor voor de spantafstand
      worden uitgegaan van f = 1. De minimumdikte van de kimbeplating mag echter in geen geval minder zijn dan die van de
      bodem- en zijbeplating.






                            c =


                            factor voor bouwwijze:





                            c = 0,95 voor schepen met een dubbele bodem en zijtanks, waarvan het laadruimlangsschot in de
      zijde verticaal onder de denneboom is geplaatst





                            c = 1,0 voor schepen met een andere bouwwijze.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.02.1.c
    text: |-
      De minimale plaatdikte die met de in onderdeel b vermelde formules is berekend mag bij schepen die in langsrichting
      zijn gebouwd en die van een dubbele bodem en zijtanks zijn voorzien zoveel minder zijn als door een erkend
      classificatiebureau is vastgesteld en gedocumenteerd nadat de voldoende sterkte van de scheepsromp rekenkundig
      is aangetoond. Vernieuwing van de beplating is noodzakelijk wanneer de dikte van bodem- of zijbeplating minder is
      dan de aldus vastgestelde waarde. De volgens bovenstaande methode vastgestelde waarden voor de minimumdikten van
      de beplating van de scheepshuid zijn grenswaarden bij een normale en gelijkmatige slijtage onder de voorwaarde
      dat scheepsbouwstaal is gebruikt en dat de inwendige constructiedelen, zoals spanten, bodemvrangen en hoofd-,
      langs- en dwarsverbanddelen zich in goede staat bevinden en dat het casco geen schade heeft opgelopen die wijst
      op overbelasting van de romp in langsscheepse richting. Indien de werkelijke waarden lager zijn dan de berekende
      waarden, moeten de desbetreffende platen worden vervangen of gerepareerd. Plaatselijke kleine, dunnere plekken
      kunnen worden toegestaan tot een afwijking van ten hoogste 10% van de minimumdikte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.02.2
    text: |-
      Indien voor de scheepsromp een ander materiaal dan staal wordt gebruikt, moet met een berekening worden aangetoond
      dat de sterkte (sterkte in langs- en dwarsrichting alsmede plaatselijke sterkte) tenminste overeenkomt met
      die, welke bij het gebruik van staal met inachtneming van de minimale diktes als bedoeld in het eerste lid zou
      zijn geresulteerd. Indien een klassecertificaat dan wel een verklaring van een erkend classificatiebureau wordt
      overgelegd kan deze berekening achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.02.3
    text: De stabiliteit van de schepen moet in overeenstemming zijn met het doel waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.02
  - number: 3.03.1
    text: |-
      De volgende waterdichte schotten, die reiken tot tegen het dek of, wanneer er geen dek is, tot aan de bovenkant van
      het scheepsboord, moeten tenminste zijn aangebracht:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.1.a
    text: |-
      een aanvaringsschot op een redelijke afstand van de voorsteven, zodanig dat bij vollopen van de vóór het
      aanvaringsschot gelegen waterdichte afdeling het drijfvermogen van het beladen schip behouden blijft en dat een
      resterende veiligheidsafstand van 100 mm in stand blijft. Aan deze eis wordt geacht te zijn voldaan indien het
      aanvaringsschot op een afstand tussen 0,04 L en 0,04 L + 2 m, gemeten vanaf de voorloodlijn, is aangebracht.
      Indien deze afstand meer is dan 0,04 L + 2m moet het voldoen aan deze eis rekenkundig worden aangetoond. De afstand
      mag tot 0,03 L worden gereduceerd. In dat geval moet rekenkundig worden aangetoond dat aan de bovengenoemde eis
      kan worden voldaan, wanneer de vóór het aanvaringsschot gelegen waterdichte afdeling alsmede de direct daaraan
      grenzende afdelingen samen zijn volgelopen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.1.b
    text: een achterpiekschot op een redelijke afstand van de achtersteven bij schepen met een lengte van meer dan 25 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.2
    text: |-
      Verblijven alsmede voor de veiligheid van het schip en van de bedrijfsvoering noodzakelijke inrichtingen mogen zich
      niet vóór het vlak van het aanvaringsschot bevinden. Dit geldt niet voor ankerinrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.3
    text: |-
      Verblijven, machinekamers en ketelruimen, alsmede de daarbij behorende werkruimten, moeten van de laadruimen zijn
      gescheiden door middel van waterdichte schotten die reiken tot tegen het dek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.4
    text: |-
      Verblijven moeten van de machinekamers en ketel- en laadruimen gasdicht zijn gescheiden en rechtstreeks van het
      dek af toegankelijk zijn. Wanneer een dergelijke toegang niet aanwezig is, moet een extra nooduitgang rechtstreeks
      toegang geven tot het dek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.5
    text: |-
      In de bij het eerste en derde lid voorgeschreven schotten en de in het vierde lid bedoelde begrenzing van ruimten
      mogen zich geen openingen bevinden. Deuren in het achterpiekschot en openingen voor de doorvoering van assen,
      leidingen enz. zijn evenwel toegestaan, wanneer zij zodanig zijn uitgevoerd dat de doelmatigheid van deze schotten
      en van de begrenzing van ruimten onverlet blijft. Deuren in het achterpiekschot zijn alleen toegestaan, indien door
      middel van afstandsbewaking in het stuurhuis kan worden vastgesteld of zij gesloten dan wel geopend zijn en indien
      aan beide zijden goed leesbaar het volgende opschrift is aangebracht: ‘Deur steeds onmiddellijk na het openen weer
      sluiten’.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.6
    text: |-
      Openingen waarlangs water wordt in- of uitgelaten, alsmede de aangesloten leidingen moeten zo geconstrueerd zijn
      dat onopzettelijk binnendringen van water in de scheepsromp niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.03.7
    text: Een voorschip moet zodanig gebouwd zijn dat ankers noch geheel, noch gedeeltelijk buiten de scheepshuid uitsteken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.03
  - number: 3.04.1
    text: |-
      De ruimten waarin machine-installaties of ketels, alsmede hun toebehoren zijn opgesteld, moeten zodanig uitgerust
      en ingericht zijn dat bediening, toezicht en onderhoud van de zich aldaar bevindende installaties gemakkelijk en
      zonder gevaar kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.2
    text: |-
      Bunkers voor vloeibare brandstof of smeerolie mogen met ruimten bestemd voor passagiers en met verblijven geen
      begrenzingsvlakken gemeen hebben die bij normaal bedrijf onder de statische druk van de vloeistof staan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.3
    text: |-
      Wanden, dekken en deuren van de machinekamers, ketelruimen en bunkers moeten van staal of een ander gelijkwaardig
      onbrandbaar materiaal zijn gemaakt. Isolaties in machinekamers moeten zijn beschermd tegen het binnendringen van
      olie en oliedampen. Alle openingen in wanden, dekken en deuren van machinekamers, ketelruimen en bunkers moeten
      van buitenaf kunnen worden gesloten. De afsluitinrichtingen moeten van staal of een ander gelijkwaardig onbrandbaar
      materiaal zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.4
    text: |-
      Machinekamers, ketelruimen en andere ruimten waarin zich brandbare of giftige gassen kunen ontwikkelen, moeten
      voldoende kunnen worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.5
    text: |-
      De trappen en ladders die toegang geven tot machinekamers, ketelruimen en bunkers moeten vast zijn aangebracht en
      zijn gemaakt van staal of van een ander stootvast en onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.6
    text: |-
      Machinekamers en ketelruimen moeten twee uitgangen hebben, waarvan er een als nooduitgang mag zijn uitgevoerd. Van
      een tweede uitgang kan worden afgezien, indien:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.6.a
    text: |-
      het grondvlak (gemiddelde lengte * gemiddelde breedte ter hoogte van de vloerplaten) van een machinekamer of
      ketelruim in totaal niet meer bedraagt dan 35 m2,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.6.b
    text: |-
      de vluchtweg vanaf iedere standplaats waar bedieningshandelingen of onderhoudswerkzaamheden moeten worden
      uitgevoerd tot aan de uitgang, of tot aan het voetpunt van de trap bij de uitgang die naar buiten leidt, niet meer
      bedraagt dan 5 m, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 3.04.6.c
    text: |-
      bij de plaats van onderhoud die het verst verwijderd is van de uitgang een draagbaar blustoestel aanwezig is, en
      wel in afwijking van [artikel 10.03, eerste lid onder e][ref1], ook indien de geïnstalleerde motorcapaciteit 100 kW
      of minder bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 3.04.7
    text: |-
      Het ten hoogste toegestane niveau van de geluidsdruk in de machinekamers bedraagt 110 dB(A). De meetpunten moeten
      worden gekozen met inachtneming van de noodzakelijke onderhoudswerkzaamheden tijdens het normale bedrijf van de
      installaties.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel3.04
  - number: 4.01.1
    text: De veiligheidsafstand moet ten minste 300 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.01
  - number: 4.01.2
    text: |-
      De veiligheidsafstand van schepen waarvan de openingen niet spatwater- en regendicht kunnen worden afgesloten en
      van schepen die met open laadruimen varen, moet zóveel worden verhoogd dat elk van deze openingen ten minste 500 mm
      van het vlak van de grootste inzinking is verwijderd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.01
  - number: 4.02.1
    text: Het vrijboord bedraagt voor schepen met een doorlopend dek zonder zeeg en zonder bovenbouw 150 mm.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.02
  - number: 4.02.2
    text: |-
      Bij schepen met zeeg en bovenbouw wordt het vrijboord berekend volgens de formule: In deze formule betekent: α de
      correctie-coëfficiënt, waarin met alle aanwezige bovenbouwen rekening wordt gehouden; β de correctie-coëfficiënt
      voor de invloed van de voorste zeeg, veroorzaakt door de aanwezigheid van bovenbouwen in het voorste vierde deel
      van de scheepslengte L; β de correctie-coëfficiënt voor de invloed van de achterste zeeg, veroorzaakt door de
      aanwezigheid van bovenbouwen in het achterste vierde deel van de scheepslengte L; Se de in rekening te brengen
      voorste zeeg in mm; Se de in rekening te brengen achterste zeeg in mm.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.02
  - number: 4.02.3
    text: |-
      De coëfficiënt wordt berekend volgens de formule: In deze formule betekent: le de in rekening te brengen lengte
      van een bovenbouw in m op de middelste helft van de scheepslengte L; le de in rekening te brengen lengte van
      een bovenbouw in m in het voorste vierde deel van de scheepslengte L; le de in rekening te brengen lengte van
      een bovenbouw in m in het achterste vierde deel van de scheepslengte L. De in rekening te brengen lengte van
      een bovenbouw wordt berekend volgens de volgende formules: In deze formules betekent: l de werkelijke lengte
      van de desbetreffende bovenbouw in m; b de breedte van de desbetreffende bovenbouw in m; B de breedte van het
      schip in m, gemeten op de buitenkant van de huidbeplating ter hoogte van het dek, gemeten op de halve lengte van
      de desbetreffende bovenbouw; h de hoogte van de desbetreffende bovenbouw in m. Voor luikhoofden wordt h evenwel
      berekend door de hoogte van de luikhoofden met de halve veiligheidsafstand overeenkomstig [artikel 4.01][ref1] te
      verminderen. Voor h wordt in geen geval een hogere waarde dan 0,36 m aangenomen. Wanneer het quotiënt van b en B
      of van b en B kleiner is dan 0,6 moet de in rekening te brengen lengte van de bovenbouw le gelijk aan nul worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel4
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.02.4
    text: 'De coëfficiënten β en β worden volgens de volgende formules berekend:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.02
  - number: 4.02.5
    text: |-
      De respectievelijk in rekening te brengen voorste en achterste zeeg Se en Se wordt volgens de volgende formules
      berekend: 'Se = s · p, Se = s · p. In deze formules betekent: S de werkelijke zeeg in het voorschip in mm; voor S'
      mag echter geen grotere waarde dan 1000 mm worden aangenomen; S de werkelijke zeeg in het achterschip in mm; voor
      S mag echter geen grotere waarde dan 500 mm worden aangenomen; p een coëfficiënt, die volgens de volgende formule
      wordt berekend: Hierin is × de van het scheepseinde af gemeten abscis tot het punt waar de zeeg gelijk is aan 0,25
      S of 0,25 S (zie onderstaande schets): Voor de coëfficiënt p mag echter geen waarde groter dan 1 worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.02
  - number: 4.02.6
    text: Wanneer de waarde van β.Se groter is dan die van β.Se wordt in plaats van de waarde van β.Se die van β.Se genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.02
  - number: '4.03'
    text: |-
      Rekening houdende met de vermindering overeenkomstig [artikel 4.02][ref1] mag het kleinste vrijboord niet minder
      dan 0 mm bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel4
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.04.1
    text: |-
      Het vlak van de grootste inzinking moet zo worden vastgesteld dat aan de voorschriften omtrent het kleinste
      vrijboord en aan die omtrent de kleinste veiligheidsafstand wordt voldaan. De Commissie van Deskundigen kan echter
      uit veiligheidsoverwegingen een groter vrijboord, dan wel een grotere veiligheidsafstand vaststellen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: 4.04.2
    text: Het vlak van de grootste inzinking wordt door goed zichtbare en onuitwisbare inzinkingsmerken aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: 4.04.3
    text: |-
      De inzinkingsmerken bestaan uit een rechthoek met horizontale zijden van 300 mm en verticale zijden van 40 mm,
      waarvan de basis samenvalt met het vlak van de toegelaten grootste inzinking. Andersoortige inzinkingsmerken dienen
      een dergelijke rechthoek te bevatten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: 4.04.4
    text: |-
      Schepen moeten ten minste drie paar inzinkingsmerken hebben, waarvan één paar ongeveer midscheeps en de twee andere
      op ongeveer 1/6 van de lengte L achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn aangebracht.
      Evenwel kan:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: 4.04.4.a
    text: |-
      bij schepen waarvan de lengte L minder dan 40 m bedraagt, met twee paar merken worden volstaan, die op ¼ van de
      lengte L achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: 4.04.4.b
    text: |-
      bij schepen die niet zijn bestemd voor het vervoer van goederen, met één paar merken worden volstaan, dat ongeveer
      midscheeps moet zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: 4.04.5
    text: |-
      De ingevolge een nieuw onderzoek ongeldig geworden inzinkingsmerken of aanduidingen moeten onder toezicht
      van de Commissie van Deskundigen worden verwijderd of als ongeldig worden gekenmerkt. Onduidelijk geworden
      inzinkingsmerken mogen alleen onder toezicht van een Commissie van Deskundigen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: 4.04.6
    text: |-
      Wanneer het schip overeenkomstig het van kracht zijnde verdrag nopens de meting van binnenschepen is gemeten en de
      ijkmerken in hetzelfde vlak liggen als de in dit reglement voorgeschreven inzinkingsmerken, gelden deze ijkmerken
      ook als inzinkingsmerken; daaromtrent wordt een aantekening geplaatst in het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.04
  - number: '4.05'
    text: |-
      Wanneer het vlak van de grootste inzinking is vastgesteld onder de voorwaarde dat de laadruimen spatwater- en
      regendicht moeten kunnen worden gesloten en de afstand tussen het vlak van de grootste inzinking en de bovenrand
      van de denneboom minder dan 500 mm bedraagt, moet de ten hoogste toegelaten inzinking voor de vaart met open
      laadruimen worden vastgesteld. In het certificaat van onderzoek moet dan worden ingevuld: ‘Wanneer de luiken van
      de laadruimen geheel of gedeeltelijk zijn geopend, mag het schip ten hoogste tot ... mm onder de inzinkingsmerken
      zijn beladen.’
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.05
  - number: 4.06.1
    text: |-
      Elk schip waarvan de diepgang meer dan 1 m kan bereiken moet aan het achterschip aan iedere zijde van een
      diepgangsschaal zijn voorzien; aanvullende diepgangsschalen zijn toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.06
  - number: 4.06.2
    text: |-
      Het nulpunt van iedere diepgangsschaal moet loodrecht daaronder liggen in een vlak evenwijdig aan het vlak van
      de grootste inzinking, dat door het laagste punt van de scheepsromp gaat of van de kiel, wanneer deze aanwezig
      is. De afstand loodrecht boven het nulpunt moet in decimeters zijn ingedeeld. Deze indeling moet vanaf het vlak
      voor de waterlijn bij ledig schip tot 100 mm boven het vlak van de grootste inzinking op iedere diepgangsschaal
      door ingehakte of ingeslagen merken zijn aangebracht. Deze indeling moet voorts in de vorm van goed zichtbare,
      afwisselend in twee verschillende kleuren geschilderde stroken zijn aangeduid. De indeling moet naast de schaal ten
      minste bij elke 5 decimeter, alsmede aan het boveneinde, door cijfers zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.06
  - number: 4.06.3
    text: |-
      De twee achterste ijkschalen, die met toepassing van het in [artikel 4.04, zesde lid][ref1], genoemde verdrag
      zijn aangebracht, kunnen als diepgangsschalen dienst doen, mits zij overeenkomstig bovenstaande voorschriften zijn
      ingedeeld; in voorkomend geval moeten de cijfers voor de diepgang zijn toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel4
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel4.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
  - number: '5.01'
    text: |-
      Schepen en samenstellen moeten over voldoende vaar- en manoeuvreereigenschappen beschikken: Schepen zonder eigen
      mechanische middelen tot voortbeweging die bestemd zijn om gesleept te worden, moeten voldoen aan de bijzondere
      eisen van de Commissie van Deskundigen; Schepen met eigen mechanische middelen tot voortbeweging en samenstellen
      moeten voldoen aan de [artikelen 5.02 tot en met 5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.02.1
    text: |-
      De vaar- en manoeuvreereigenschappen dienen door proefvaarten te worden aangetoond. Daarbij dient te worden
      vastgesteld:






                    snelheid (vooruitvaren)


                    (art. 5.06);




                    stopeigenschappen


                    (art. 5.07);




                    achteruitvaareigenschappen


                    (art. 5.08);




                    uitwijkeigenschappen


                    (art. 5.09);




                    keereigenschappen


                    (art. 5.10).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.02
  - number: 5.02.2
    text: |-
      De Commissie van Deskundigen kan geheel of gedeeltelijk afzien van proefvaarten, wanneer op andere wijze wordt
      aangetoond dat aan de eisen wat betreft vaar- en manoeuvreereigenschappen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.02
  - number: 5.03.1
    text: |-
      De in [artikel 5.02][ref1] bedoelde proefvaarten dienen in de door de bevoegde autoriteiten aangewezen vakken van
      de Rijn of van andere binnenwateren te worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.03.2
    text: |-
      Deze proefvaarttrajecten moeten zich bevinden in zo recht mogelijke vakken met een lengte van ten minste 2 km en
      voldoende breedte in stromend of stil water en moeten zijn voorzien van duidelijk herkenbare markeringen om de
      positie van het schip vast te kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.03
  - number: 5.03.3
    text: |-
      De hydrologische gegevens, zoals waterdiepte, vaarwaterbreedte en gemiddelde stroomsnelheid in het vaarwater bij
      verschillende waterstanden moeten door de Commissie van Deskundigen kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.03
  - number: '5.04'
    text: |-
      Schepen en samenstellen die bestemd zijn voor het vervoer van goederen moeten voor de proefvaarten zo mogelijk
      gelijklastig en ten minste voor 70% zijn beladen. Wanneer de proefvaart met minder lading wordt uitgevoerd, moet de
      toelating voor wat betreft de afvaart tot deze belading worden beperkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.04
  - number: 5.05.1
    text: |-
      Bij de proefvaarten mogen geen ankers worden gebruikt, maar wel alle in het certificaat van onderzoek, onder 34 en
      52, ingevulde inrichtingen die vanuit de stuurstelling te bedienen zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.05
  - number: 5.05.2
    text: |-
      Bij opdraaimanoeuvres als bedoeld in [artikel 5.10][ref1] mogen echter de boegankers worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.06.1
    text: |-
      Schepen en samenstellen moeten een snelheid ten opzichte van het water van ten minste 13 km/u kunnen bereiken. Dit
      geldt niet voor duwboten indien zij alleen varen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.06
  - number: 5.06.2
    text: |-
      Voor schepen en samenstellen die slechts op de reden en in de havens varen kan de Commissie van Deskundigen
      afwijkingen toestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.06
  - number: 5.06.3
    text: |-
      De Commissie van Deskundigen gaat na of het vaartuig in onbeladen toestand een snelheid ten opzichte van het water
      van 40 km/u kan overschrijden. Is dit het geval dan moet in het certificaat van onderzoek onder nummer 52 worden
      vermeld: ‘Het vaartuig is in staat een snelheid van 40 km/u ten opzichte van het water te overschrijden.’
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.06
  - number: 5.07.1
    text: |-
      Schepen en samenstellen moeten tijdig kop vóór kunnen stilhouden en moeten tegelijkertijd voldoende bestuurbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.07
  - number: 5.07.2
    text: |-
      Bij schepen en samenstellen met een lengte L van 86 m of minder en een breedte van 22,90 m of minder kunnen deze
      stop-eigenschappen worden vervangen door de keer-eigenschappen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.07
  - number: 5.07.3
    text: |-
      De stop-eigenschappen dienen door stopmanoeuvres op één der in [artikel 5.03][ref1] bedoelde proefvaartvakken en de
      keer-eigenschappen door opdraaimanoeuvres als bedoeld in [artikel 5.10][ref2] te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.08'
    text: |-
      Wanneer de in [artikel 5.07][ref1] genoemde noodzakelijke stopmanoeuvre in stilstaand water wordt uitgevoerd, dient
      tevens een achteruitvaarproef te worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.09'
    text: |-
      Schepen en samenstellen moeten tijdig kunnen uitwijken. De uitwijkeigenschappen dienen te worden aangetoond door
      uitwijkmanoeuvres op één der in [artikel 5.03][ref1] bedoelde proefvaartvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.10'
    text: |-
      Schepen en samenstellen met een lengte van 86 m of minder en een breedte van 22,90 m of minder moeten tijdig kunnen
      keren. Deze keereigenschappen kunnen door de in [artikel 5.07][ref1] bedoelde stop-eigenschappen worden vervangen.
      De keereigenschappen dienen door opdraaimanoeuvres te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: 6.01.1
    text: |-
      Schepen moeten zijn voorzien van een betrouwbaar werkende stuurinrichting waarmee ten minste de in
      [hoofdstuk 5][ref1] bedoelde manoeuvreereigenschappen worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '5'
  - number: 6.01.2
    text: |-
      Werktuiglijk aangedreven stuurinrichtingen moeten zodanig zijn uitgevoerd dat het roer niet onvoorzien van stand
      kan veranderen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.01
  - number: 6.01.3
    text: |-
      De gehele stuurinrichting moet voor een permanente slagzij van het schip tot 15° en omgevingstemperaturen van –
      20 °C tot + 50 °C geschikt zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.01
  - number: 6.01.4
    text: |-
      De afzonderlijke onderdelen van de stuurinrichting moeten qua sterkte zodanig zijn geconstrueerd dat alle onder
      normale omstandigheden daarop inwerkende krachten goed kunnen worden opgenomen. De van buitenaf op het roer
      inwerkende krachten mogen het functioneren van de stuurmachine en zijn aandrijving niet beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.01
  - number: 6.01.5
    text: |-
      Stuurinrichtingen moeten een mechanisch aangedreven stuurmachine hebben wanneer de voor de bediening van het roer
      te leveren krachten dit vereisen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.01
  - number: 6.01.6
    text: |-
      Stuurmachines met een mechanische aandrijving moeten een beveiliging tegen overbelasting hebben die het door de
      aandrijving uitgeoefende koppel begrenst.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.01
  - number: 6.01.7
    text: |-
      Asdoorvoeringen van roerkoningen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen naar
      buiten kunnen treden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.01
  - number: 6.02.1
    text: |-
      Bij stuurmachines met mechanische aandrijving moet een tweede onafhankelijke aandrijving of een extra
      handaandrijving beschikbaar zijn. In geval van uitval of storing van de aandrijving moet binnen 5 seconden de
      tweede onafhankelijke aandrijving of de handaandrijving in werking kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.02
  - number: 6.02.2
    text: |-
      Wanneer het inschakelen van de tweede aandrijving of van de handaandrijving niet automatisch geschiedt, moet de
      roerganger deze met één enkele handeling onmiddellijk, snel en eenvoudig kunnen inschakelen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.02
  - number: 6.02.3
    text: |-
      Ook wanneer de tweede aandrijving of de handaandrijving in werking is, moeten de in [hoofdstuk 5][ref1] bedoelde
      manoeuvreereigenschappen kunnen worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '5'
  - number: 6.03.1
    text: Aan de hydraulische aandrijfinstallatie van de stuurmachine mogen geen andere verbruikers zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.03.2
    text: |-
      De tanks voor het hydraulische systeem dienen te zijn uitgerust met een niveaualarmsysteem, dat het dalen van het
      olieniveau beneden de voor het veilig kunnen functioneren laagst toegestane stand controleert.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.03.3
    text: |-
      De afmetingen, constructie en plaatsing van de pijpleidingen moeten beschadigingen door mechanische invloeden of
      vuur zo veel mogelijk uitsluiten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.03.4
    text: Hydraulische slangen
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.03.4.a
    text: |-
      zijn slechts toegestaan wanneer het gebruik daarvan in verband met het verminderen van trillingen of de
      bewegingsvrijheid van de componenten absoluut noodzakelijk is,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.03.4.b
    text: moeten ten minste zijn berekend op de ten hoogste toegelaten werkdruk,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.03.4.c
    text: moeten uiterlijk om de tien jaar worden vernieuwd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.03.5
    text: |-
      Hydraulische cilinders, pompen, en motoren evenals elektrische motoren moeten uiterlijk om de acht jaar door een
      deskundig bedrijf worden gecontroleerd en indien noodzakelijk gereviseerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.03
  - number: 6.04.1
    text: Stuurinrichtingen met twee mechanische aandrijvingen moeten beschikken over twee energiebronnen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.04
  - number: 6.04.2
    text: |-
      Wanneer de tweede energiebron van een stuurmachine met mechanische aandrijving tijdens de vaart niet continu kan
      worden gebruikt, moet de voor het starten daarvan benodigde tijd door een buffersysteem van voldoende capaciteit
      worden overbrugd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.04
  - number: 6.04.3
    text: Bij elektrische energiebronnen mogen uit de toevoer van de stuurinrichtingen geen andere verbruikers worden gevoed.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.04
  - number: 6.05.1
    text: Het handstuurwiel mag niet meegedraaid kunnen worden door een mechanische aandrijving.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.05
  - number: 6.05.2
    text: |-
      Terugslag van het stuurwiel moet bij automatisch inschakelen van de handaandrijving bij iedere stand van het roer
      zijn verhinderd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.05
  - number: 6.06.1
    text: |-
      Indien bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroefinstallaties de afstandsbediening
      voor de verandering van de richting van de stuwkracht elektrisch, hydraulisch of pneumatisch is, dan moeten
      vanaf de stuurstelling tot de propeller- of straalinstallatie twee van elkaar onafhankelijke besturingssystemen
      aanwezig zijn die voldoen aan de in de [artikelen 6.01 tot en met 6.05][ref1] genoemde eisen. Dit is niet van
      toepassing indien het gebruik van dergelijke installaties niet noodzakelijk is om te kunnen voldoen aan de
      manoeuvreereigenschappen bedoeld in [hoofdstuk 5][ref2], dan wel uitsluitend voor de stopproef.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0025973
        hoofdstuk: '5'
  - number: 6.06.2
    text: |-
      Indien twee of meer van elkaar onafhankelijke roerpropeller-, waterstraal- of cycloïdaalschroefinstallaties
      aanwezig zijn, is het tweede besturingssysteem niet vereist indien het schip bij het uitvallen van één van deze
      installaties manoeuvreerbaar blijft overeenkomstig [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '5'
  - number: 6.07.1
    text: |-
      De stand van het roer moet bij de stuurstelling duidelijk zichtbaar zijn. Elektrische roerstandaanwijzers moeten
      een eigen voeding hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.07
  - number: 6.07.2
    text: 'De stuurstelling moet voor de volgende gevallen van een optisch en akoestisch alarmsignaal zijn voorzien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.07
  - number: 6.07.2.a
    text: |-
      vermindering van het oliepeil van de tanks voor het hydraulische systeem als bedoeld in
      [artikel 6.03, tweede lid][ref1], en van de werkdruk van het hydraulische systeem;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel6
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.07.2.b
    text: het uitvallen van de voeding van de elektrische besturingsenergie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.07
  - number: 6.07.2.c
    text: het uitvallen van de voeding van de elektrische energie ten behoeve van de aandrijving;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.07
  - number: 6.07.2.d
    text: het uitvallen van de stuurautomaat;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.07
  - number: 6.07.2.e
    text: het uitvallen van de voorgeschreven buffersystemen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.07
  - number: 6.08.1
    text: |-
      Stuurautomaten en de onderdelen ervan moeten voldoen aan [artikel 9.20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel9
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '9'
        hoofdstuk: '9'
  - number: 6.08.2
    text: |-
      Een groen lampje in de stuurstelling moet aangeven dat de stuurautomaat voor gebruik gereed is. Uitval,
      ontoelaatbare afwijkingen van de spanning van de voeding en ontoelaatbare daling van de rotatiefrequentie van de
      gyroscoop moeten worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.08
  - number: 6.08.3
    text: |-
      Wanneer er naast de stuurautomaat nog andere besturingssystemen aanwezig zijn, moet bij de stuurstelling duidelijk
      te zien zijn welk systeem is ingeschakeld. De omschakeling van het ene systeem naar het andere moet onmiddellijk
      kunnen geschieden. Storingen van stuurautomaten mogen het betrouwbaar functioneren van de stuurinrichting niet
      kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.08
  - number: 6.08.4
    text: De voeding van de elektrische energie van de stuurautomaat moet onafhankelijk zijn van andere verbruikers.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.08
  - number: 6.08.5
    text: |-
      De in stuurautomaten gebruikte gyroscopen, sensoren of bochtaanwijzers moeten voldoen aan de minimumeisen van
      de ‘Voorschriften omtrent de minimumeisen en keuringsvoorwaarden voor bochtaanwijzers in de Rijnvaart’, die zijn
      opgenomen in [bijlage 1.7 van de regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.08
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 6.09.1
    text: |-
      De correcte installatie van de stuurinrichting dient door een Commissie van Deskundigen te worden gekeurd. Daartoe
      kan de Commissie van Deskundigen om de volgende bescheiden vragen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.1.a
    text: Beschrijving van de stuurinrichting;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.1.b
    text: Bouwtekeningen en gegevens over de aandrijvingen van de stuurmachine en de besturing;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.1.c
    text: Gegevens over de stuurmachine;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.1.d
    text: Schakelschema voor de elektrische installatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.1.e
    text: Beschrijving van de stuurautomaat;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.1.f
    text: Gebruiksaanwijzing van de installatie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.2
    text: |-
      Bij een proefvaart dient de werking van de stuurinrichting als geheel te worden gekeurd. Bij stuurautomaten dient
      te worden getest of op veilige wijze een rechte koers wordt gehouden en of op veilige wijze in bochten wordt
      gevaren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.3
    text: 'Werktuiglijk aangedreven stuurinrichtingen moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.3.a
    text: vóór de eerste ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.3.b
    text: na uitvallen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.3.c
    text: na verandering of reparatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.3.d
    text: met regelmaat tenminste elke drie jaar door een deskundige worden gekeurd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.4
    text: 'De keuring moet tenminste bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.4.a
    text: |-
      controle op het overeenstemmen met de goedgekeurde bouwtekeningen en bij terugkerende testen, of veranderingen in
      de stuurinrichting hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.4.b
    text: controle op de goede werking van de stuurinrichting met alle bedrijfsmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.4.c
    text: |-
      visuele controle en controle op de dichtheid van de hydraulische delen van de installaties, in het bijzonder
      ventielen, pijpleidingen, hydraulische slangen, cilinders, pompen en filters;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.4.d
    text: |-
      visuele controle van de elektrische delen van de installaties, in het bijzonder relais, elektrische motoren en
      veiligheidsinstallaties;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.4.e
    text: controle van de optische en akoestische controle-instrumenten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 6.09.5
    text: |-
      Betreffende de keuring moet een verklaring worden opgesteld die door de deskundige wordt ondertekend en waarin de
      datum van de keuring is vermeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel6.09
  - number: 7.01.1
    text: |-
      Stuurhuizen moeten zodanig zijn ingericht dat de roerganger zijn werkzaamheden tijdens de vaart te allen tijde
      kan verrichten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.01
  - number: 7.01.2
    text: |-
      Tijdens het normale bedrijf van het schip mag het niveau van de geluidsdruk voortgebracht door het schip bij de
      stuurstelling ter hoogte van het hoofd van de roerganger niet hoger zijn dan 70 dB(A).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.01
  - number: 7.01.3
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar moet de roerganger zijn werkzaamheden zittend kunnen
      verrichten en moeten alle voor het voeren van het schip noodzakelijke signalerings- en controle-instrumenten en de
      bedieningsapparatuur zodanig zijn gerangschikt dat de roerganger ze tijdens de vaart gemakkelijk kan observeren en
      bedienen zonder daarbij zijn plaats te hoeven verlaten en zonder het radarbeeld uit het oog te verliezen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.01
  - number: 7.02.1
    text: Het uitzicht vanaf de stuurstelling moet naar alle zijden voldoende vrij zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.02
  - number: 7.02.2
    text: |-
      De dode hoek voor de boeg van het lege schip met halve voorraden en zonder ballast mag voor de roerganger niet meer
      dan 250 m zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.02
  - number: 7.02.3
    text: |-
      Het vrije gezichtsveld vanaf de plaats waar de roerganger zich gewoonlijk bevindt moet ten minste 240° van de
      horizon bedragen. Daarvan moet een gezichtsveld van ten minste 140° binnen de voorste halve cirkel liggen. In de
      normale zicht as van de roerganger mogen zich geen vensterstijlen, steunen of opbouwen bevinden. Indien, ook in het
      geval van een vrij gezichtsveld van 240° of meer, geen voldoende vrij uitzicht naar achteren gewaarborgd is, kan de
      Commissie van Deskundigen andere maatregelen eisen, zoals de inbouw van optische hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.02
  - number: 7.02.4
    text: |-
      Door adequate middelen moet zijn gewaarborgd dat onder alle weersomstandigheden door de voorruiten helder zicht
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.02
  - number: 7.02.5
    text: In stuurhuizen gebruikte ruiten moeten een minimale lichtdoorlaatbaarheid van 75% hebben.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.02
  - number: 7.03.1
    text: |-
      De voor het voeren van een schip noodzakelijke bedieningsapparatuur moet gemakkelijk kunnen worden bediend. De
      stand waarin zij zijn gebracht moet duidelijk herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.03.2
    text: |-
      Controle-instrumenten moeten gemakkelijk kunnen worden afgelezen; zij moeten traploos regelbaar kunnen worden
      verlicht. Lichtbronnen mogen niet storen of de zichtbaarheid van de controle-instrumenten beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.03.3
    text: Er moet een inrichting voor het controleren van de signaallampjes aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.03.4
    text: |-
      Of een inrichting in werking is, moet duidelijk zichtbaar zijn. Wanneer dit door een signaallampje wordt
      aangegeven, moet dit groen zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.03.5
    text: |-
      Storingen of het uitvallen van inrichtingen waarvan controle verplicht is, dient door rode signaallampjes te worden
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.03.6
    text: |-
      Wanneer één van de rode signaallampjes gaat branden moet een akoestisch signaal klinken. Voor de verschillende
      lampjes kan hetzelfde akoestische alarmsignaal worden gegeven. Het geluidsniveau van dit signaal moet ten minste 3
      dB(A) meer bedragen dan het maximaal heersende geluidsniveau ter plaatse van de stuurstelling.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.03.7
    text: |-
      Het akoestische signaal moet kunnen worden uitgezet na het constateren van het uitvallen of van de storing. Dit
      mag geen nadelige invloed hebben op het functioneren van het signaal voor andere storingen. De rode signaallampjes
      mogen echter pas na het verhelpen van de storing uitgaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.03.8
    text: |-
      De signalerings- en controle-instrumenten moeten bij het uitvallen van de voeding automatisch op een andere
      energiebron worden geschakeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.03
  - number: 7.04.1
    text: |-
      De bediening en de controle van de voortstuwingsmotoren en van de stuurinrichtingen moet vanaf de stuurstelling
      mogelijk zijn. Voortstuwingsmotoren die zijn voorzien van een vanaf de stuurstelling bedienbare koppeling, of die
      een vanaf de stuurstelling bedienbare verstelbare schroef aandrijven, hoeven slechts in de machinekamer aan- en
      uitgezet te kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.04.2
    text: |-
      De bediening van elke voortstuwingsmotor moet kunnen geschieden door één enkele hefboom. De hefboom moet volgens
      een cirkelboog, welke zich bevindt in een verticaal vlak dat nagenoeg evenwijdig is aan de lengte-as van het schip
      kunnen worden bewogen. Het verplaatsen van deze hefboom in de richting van het voorschip moet het schip vooruit
      doen varen, terwijl verplaatsing van de hefboom in de richting van het achterschip het schip achteruit doet varen.
      Aan weerszijde van de nulstand van de hefboom vindt het koppelen of omkeren plaats. In de nulstand moet de hefboom
      vanzelf blijven staan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.04.3
    text: |-
      De richting van de door de aandrijving op het schip werkende stuwingskracht alsmede het toerental van de schroeven
      of stuwingsmotoren moet worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.04.4
    text: |-
      De in de [artikelen 6.07, tweede lid][ref1], [8.03, tweede lid][ref2] en [8.05, dertiende lid][ref3],
      voorgeschreven signalerings- en controle-instrumenten moeten in de stuurstelling zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel8
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.04.5
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar moet de besturing van het schip plaats vinden door middel
      van een hefboom. Deze hefboom moet gemakkelijk met de hand bediend kunnen worden. De hoek van de hefboom moet
      overeenkomen met de stand van de roerbladen ten opzichte van de lengte-as van het schip. De hefboom moet in
      onverschillig welke positie kunnen worden losgelaten, zonder dat dan de stand van de roerbladen verandert. De
      nulstand van de hefboom moet duidelijk voelbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.04.6
    text: |-
      Wanneer het schip is voorzien van koproeren of bijzondere roeren (b.v. voor achteruitvaren), moeten deze bij
      éénmansstuurstellingen voor het varen op radar door speciale hefbomen kunnen worden bediend, die aan de in het
      vijfde lid genoemde toepasselijke eisen voldoen. Dit geldt ook wanneer bij samenstellen de roerinstallaties van
      andere vaartuigen dan het voor het voeren van het samenstel gebruikte vaartuig worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.04.7
    text: |-
      Bij het gebruik van stuurautomaten moet het bedieningsorgaan voor het instellen van de draaisnelheid in elke
      willekeurige positie kunnen worden losgelaten zonder dat daardoor de ingestelde draaisnelheid verandert. Het
      bedieningsorgaan moet een zodanige zwenkhoek hebben dat voldoende nauwkeurigheid van de instelling is gewaarborgd.
      De nulstand moet voelbaar van andere standen zijn te onderscheiden. De schaalverdeling moet traploos regelbaar
      kunnen worden verlicht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.04.8
    text: |-
      Inrichtingen voor afstandsbediening van de gehele stuurinrichting moeten vast ingebouwd zijn en zodanig zijn
      geïnstalleerd dat de gekozen vaarrichting duidelijk zichtbaar is. Wanneer zij uitgeschakeld kunnen worden, moeten
      zij voorzien zijn van een aanwijzer die aangeeft of de inrichting ‘aan’ of ‘uit’ is. De opstelling en bediening
      van de verschillende onderdelen van deze inrichtingen moeten overeenkomen met de functie daarvan. Voor aanvullende
      installaties van de stuurinrichting, zoals boegschroefinstallaties, zijn niet vast ingebouwde afstandsbedieningen
      toegestaan wanneer door een prioriteitsschakeling in het stuurhuis de bediening van de aanvullende installatie te
      allen tijde kan worden overgenomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.04.9
    text: |-
      Bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroefinstallaties zijn gelijkwaardige
      bedieningsapparatuur en signalerings- en controle-instrumenten toegestaan. Voor deze installaties zijn het
      eerste tot en met achtste lid met inachtneming van de bijzondere kenmerken en de gekozen opstelling van de
      genoemde actieve stuurinrichtingen en de stuwingsinrichtingen van overeenkomstige toepassing. Naar analogie
      van het tweede lid, moet voor iedere installatie de bediening door middel van een hefboom plaats kunnen vinden,
      die volgens een cirkelboog welke zich bevindt in een verticaal vlak dat nagenoeg evenwijdig is aan de richting
      van de stuwingskracht van de installatie, moet kunnen worden bewogen. Uit de positie van de hefboom moet voor
      iedere installatie de richting van de van de op het schip werkende stuwingskracht worden aangegeven. Voorzover
      roerpropeller- of cycloïdaalschroefinstallaties niet door middel van een hefboom worden bediend, kan de Commissie
      van Deskundigen afwijkingen op de voorschriften van het tweede lid toestaan. De afwijkingen moeten door de
      Commissie van Deskundigen worden ingeschreven onder punt 52 van het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.04
  - number: 7.05.1
    text: |-
      Navigatielichten moeten aan de eisen voldoen van de voorschriften omtrent de kleur en de sterkte der
      lichten alsmede omtrent de goedkeuring der navigatielantaarns voor de Rijnvaart, die zijn opgenomen in
      [bijlage 1.5 van de regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 7.05.2
    text: |-
      Voor zover de controle van de navigatielichten niet rechtstreeks vanuit het stuurhuis mogelijk is, moeten
      ter controle van deze lichten in het stuurhuis stroomaanwijslampen of gelijkwaardige inrichtingen, zoals
      controlelampjes, zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.05
  - number: 7.05.3
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar moeten ter controle van de navigatielichten en de lichtseinen
      controlelampen in de stuurstelling zijn ingebouwd. De schakelaars van de navigatielichten moeten in of vlakbij
      de daarbij behorende controlelampen zijn aangebracht en daar duidelijk bij behoren. De groepering en de kleur van
      de controlelampen van de navigatielichten en de lichtseinen moeten overeenkomen met de werkelijke opstelling en
      de kleur van de ingeschakelde navigatielichten en de lichtseinen. Het niet-functioneren van een navigatielicht of
      lichtsein moet het uitgaan van de overeenkomstige controlelamp tot gevolg hebben dan wel op andere wijze door de
      betreffende controlelamp worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.05
  - number: 7.05.4
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar dient de bediening van de geluidsseinen met de voet te kunnen
      geschieden. Dit geldt niet voor het in het [Rijnvaartpolitiereglement][ref1] bedoelde ‘blijf weg’-sein.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.05
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 7.06.1
    text: |-
      De radarinstallatie en de bochtaanwijzer moeten overeenkomen met een door de bevoegde autoriteit toegelaten type.
      Aan de voorschriften van [bijlagen 1.6][ref1] en [1.7 van de regeling][ref2] moet zijn voldaan. Inland ECDIS
      apparaten, die in de navigatiemodus kunnen worden gebruikt, worden beschouwd als radarinstallaties. Zij moeten
      tevens voldoen aan de eisen van Inland ECDIS. De bochtaanwijzer moet vóór de roerganger in diens gezichtsveld zijn
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
      [ref2]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.06
    references:
      - id: ref1
        bwb_id: BWBR0025958
      - id: ref2
        bwb_id: BWBR0025958
  - number: 7.06.2
    text: 'Bij éénmansstuurstellingen voor het varen op radar:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.06
  - number: 7.06.2.a
    text: mag het radarscherm niet wezenlijk buiten de blikrichting van de roerganger vallen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.06
  - number: 7.06.2.b
    text: |-
      moet het radarbeeld zonder kap of scherm, ongeacht de buiten het stuurhuis heersende lichtomstandigheden, duidelijk
      zichtbaar zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.06
  - number: 7.06.2.c
    text: moet de bochtaanwijzer direct boven of onder het radarbeeld zijn geplaatst of hierin zijn geïntegreerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.06
  - number: 7.07.1
    text: |-
      Op schepen met een éénmansstuurstelling voor het varen op radar moet voor het schip- -schipverkeer en de nautische
      informatie het ontvangen door een luidspreker en het zenden door een vast opgestelde microfoon geschieden. Het
      overschakelen van ‘ontvangen’ naar ‘zenden’ moet door middel van drukknoppen geschieden. In geen geval mag de
      microfoon van dit verkeer voor verbindingen van het openbaar verkeer kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.07
  - number: 7.07.2
    text: |-
      Wanneer een schip met een éénmansstuurstelling voor het varen op radar is uitgerust met een marifooninstallatie
      bestemd voor het openbaar verkeer, moet de ontvangst daarvan vanaf de zitplaats van de roerganger mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.07
  - number: 7.07.3
    text: |-
      De Inland AIS-apparatuur moet van een type zijn dat voor de Rijn is goedgekeurd door de bevoegde autoriteit
      van één van de Oeverstaten of van België op grond van de teststandaard (besluit 2007-I-15). Aan de in
      [bijlage N, deel I][ref1], vermelde voorschriften omtrent de inbouw en de controle van het functioneren van Inland
      AIS-apparatuur moet worden voldaan. De teststandaard en de lijsten van de overeenkomstig [Bijlage N][ref2] of op
      grond van als gelijkwaardig erkende typegoedkeuringen toegelaten AIS-appartauur worden door de Centrale Commissie
      gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
      - id: ref2
        bwb_id: BWBR0025973
  - number: '7.08'
    text: |-
      Aan boord van schepen met een éénmansstuurstelling voor het varen op radar moet een interne spreekverbinding
      aanwezig zijn. Vanaf de stuurstelling moeten de volgende spreekverbindingen tot stand kunnen worden gebracht:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.08
  - number: 7.08.a
    text: met het voorschip van het schip of het voorste gedeelte van het samenstel;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.08
  - number: 7.08.b
    text: |-
      met het achterschip van het schip of het achterste gedeelte van het samenstel, indien geen directe communicatie
      daarmee vanaf de stuurstelling mogelijk is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.08
  - number: 7.08.c
    text: met het verblijf of de verblijven van de bemanning;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.08
  - number: 7.08.d
    text: met de hut van de schipper.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.08
  - number: 7.09.1
    text: |-
      Er moet een onafhankelijke alarminstallatie aanwezig zijn, waarmee de verblijven, de machinekamers en eventueel
      aparte pompkamers kunnen worden bereikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.09
  - number: 7.09.2
    text: |-
      De roerganger moet een schakelaar ‘AAN/UIT’ voor de bediening van het alarmsein binnen zijn bereik hebben. Voor
      dit sein mag geen schakelaar worden gebruikt die, wanneer men hem loslaat, automatisch in de stand ‘UIT’ kan
      terugspringen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.09
  - number: 7.09.3
    text: |-
      Het geluidsniveau van het alarmsignaal moet in de verblijven ten minste 75 dB (A) bedragen. In de machine- en
      pompkamers moet een overal goed waarneembaar, rondom zichtbaar knipperlicht als alarmsignaal aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.09
  - number: '7.10'
    text: Stuurhuizen moeten zijn voorzien van een doeltreffende en regelbare verwarming en ventilatie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.10
  - number: '7.11'
    text: |-
      Op schepen en samenstellen met een éénmansstuurstelling voor het varen op radar waarvan de lengte L meer dan 86 m
      of de breedte B meer dan 22,90 m bedraagt, moet de roerganger de hekankers vanaf zijn plaats kunnen presenteren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.11
  - number: '7.12'
    text: |-
      In de hoogte verstelbare stuurhuizen moeten zijn voorzien van een noodinrichting waarmee deze kunnen worden
      neergelaten. Telkens wanneer het stuurhuis in een lagere stand wordt gezet, moet automatisch een akoestisch
      waarschuwingssignaal duidelijk waarneembaar zijn. Dit geldt niet wanneer door adequate bouwkundige maatregelen
      geen gevaar bestaat voor verwondingen ten gevolge van de verstelling van de hoogte. In alle hoogtestanden moet het
      mogelijk zijn het stuurhuis zonder gevaar te verlaten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.12
  - number: '7.13'
    text: |-
      Wanneer een schip voldoet aan de in de [artikelen 7.01][ref1], [7.04 tot en met 7.08][ref2] en [7.11][ref3]
      bedoelde voorschriften voor schepen met een éénmansstuurstelling voor het varen op radar, moet in het certificaat
      van onderzoek worden aangetekend: ‘Goedgekeurd voor het voeren van het schip met behulp van radar door één
      persoon’.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel7
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.01.1
    text: Werktuigen alsmede de bijbehorende installaties moeten vakkundig zijn ontworpen, uitgevoerd en geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.01
  - number: 8.01.2
    text: |-
      Installaties die controle vereisen zoals stoomketels, andere drukvaten, alsmede hun toebehoren en liften moeten
      voldoen aan de voorschriften van één der Oeverstaten of van België.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.01
  - number: 8.01.3
    text: Er mogen alleen verbrandingsmotoren worden geïnstalleerd die brandstoffen gebruiken met een vlampunt boven 55 °C.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.01
  - number: 8.02.1
    text: |-
      Machine-installaties moeten zo zijn ingericht en opgesteld, dat zij voor bediening en onderhoud voldoende
      toegankelijk zijn en personen, die ze moeten bedienen of onderhouden, niet in gevaar kunnen worden gebracht. Zij
      moeten kunnen worden beveiligd tegen onopzettelijke inbedrijfstelling.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.02
  - number: 8.02.2
    text: |-
      Aan de hoofd- en hulpmotoren alsmede de stoomketels en drukvaten moeten beschermende inrichtingen zijn aangebracht;
      hetzelfde geldt voor hun toebehoren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.02
  - number: 8.02.3
    text: |-
      Aandrijvingen voor de pers- en zuigventilatoren moeten in geval van nood ook buiten de ruimte waar zij zich
      bevinden en buiten de machinekamer uitgeschakeld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.02
  - number: 8.02.4
    text: |-
      Waar het noodzakelijk is moeten verbindingen van leidingen voor brandstof, smeerolie en oliën, die in
      krachtoverbrengings-, schakel-, aandrijf- en verwarmingssystemen worden gebruikt, afgeschermd of op andere
      geschikte wijze zijn beschermd, om te vermijden dat deze vloeibare stoffen op hete vlakken in de afzuigkanalen
      van de machines of andere ontstekingsbronnen sproeien of uitlopen. Het aantal verbindingen in deze
      pijpleidingensystemen moet tot een minimum worden beperkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.02
  - number: 8.02.5
    text: |-
      Niet ingebouwde hogedrukbrandstofleidingen van dieselmotoren tussen de hogedrukbrandstofpompen en de
      inspuitsystemen moeten door een mantelbuissysteem worden beschermd, dat in geval van een lek in de hogedrukleiding,
      de uitlopende brandstof opvangt. In het mantelbuissysteem moet een lekbak zijn voorzien alsook inrichtingen die een
      alarmsignaal geven in geval van lekkage aan een brandstofleiding; voor machines met slechts twee cilinders is dit
      alarmsysteem echter niet vereist. Bij machines voor ankerlieren en spillen op open dek zijn geen mantelbuissystemen
      vereist.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.02
  - number: 8.02.6
    text: |-
      Isolaties van machineonderdelen moeten in overeenstemming zijn met [artikel 3.04, derde lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '3'
        hoofdstuk: '3'
  - number: 8.03.1
    text: |-
      De aandrijving van een schip moet op betrouwbare en snelle wijze aangezet, gestopt en van vooruit op achteruit of
      andersom gezet kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.03.2
    text: Het kritieke peil van
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.03.2.a
    text: de temperatuur van het koelwater van de voortstuwingsmotoren;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.03.2.b
    text: de druk van de smeerolie van de voortstuwingsmotoren en de transmissie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.03.2.c
    text: de olie- en luchtdruk van de omkeerinrichting van de voortstuwingsmotoren, de keerkoppeling of de schroeven;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.03.3
    text: |-
      Bij schepen met slechts één voortstuwingsmotor mag, behalve ingeval van overtoeren, de motor niet automatisch
      worden stopgezet.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.03.4
    text: |-
      Bij schepen met slechts één voortstuwingsmotor mag deze slechts zijn uitgerust met een inrichting voor automatische
      reductie van het toerental indien een automatische reductie van het toerental in het stuurhuis optisch en
      akoestisch wordt aangegeven en de inrichting voor reductie van het toerental vanaf de stuurstand kan worden
      uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.03.5
    text: |-
      Doorvoeringen van assen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen naar buiten
      kunnen treden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.03
  - number: 8.04.1
    text: Uitlaatgassen moeten volledig naar buitenboord worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.04
  - number: 8.04.2
    text: |-
      Het binnendringen van uitlaatgassen in de verschillende ruimten van het schip moet door doelmatige maatregelen zijn
      verhinderd. Uitlaatgassenleidingen die door verblijven of het stuurhuis gaan, moeten in die ruimten zijn voorzien
      van een gasdichte mantel. De ruimte tussen de uitlaatgassenleiding en de mantel moet in verbinding staan met de
      open lucht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.04
  - number: 8.04.3
    text: Uitlaatgassenleidingen moeten zodaning zijn aangelegd en beschermd dat zij geen brand kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.04
  - number: 8.04.4
    text: |-
      In de machinekamer moeten uitlaatgassenleidingen voldoende geïsoleerd of gekoeld zijn. Buiten de machinekamer kan
      een beveiliging tegen aanraken voldoende zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.04
  - number: 8.05.1
    text: |-
      Vloeibare brandstoffen moeten zijn opgeslagen in tot de scheepsromp behorende of vast in het schip bevestigde tanks
      van staal of, wanneer dit wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid
      gelijkwaardig materiaal. Dit geldt niet voor tanks van hulpaggregaten met een inhoud van maximaal 12 l, die
      van fabriekswege hecht met deze zijn verbonden. Brandstoftanks mogen geen begrenzingsvlakken gemeen hebben met
      drinkwaterreservoirs.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.2
    text: |-
      Deze tanks, alsmede brandstofleidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd en ingericht
      dat zich geen brandstof of brandstofdampen onopzettelijk in het inwendige van het schip kunnen verspreiden.
      Afsluitinrichtingen op brandstoftanks, die dienen voor het ontnemen van brandstof of voor de afwatering, moeten
      zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.3
    text: Voor het aanvaringsschot mag zich geen brandstoftank bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.4
    text: Brandstoftanks en hun appendages mogen niet direct boven motoren of uitlaatgassenleidingen zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.5
    text: De vulopeningen van brandstoftanks moeten duidelijk zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.6
    text: |-
      De vulleidingen van brandstoftanks moeten aan dek uitmonden, met uitzondering van die der dagtanks. De vulleidingen
      moeten voorzien zijn van een aansluitkoppeling volgens de Europese norm EN 12 827. Deze tanks moeten zijn voorzien
      van een ontluchtingsleiding die bovendeks in de open lucht uitmondt en zo zijn ingericht dat geen water kan
      binnendringen. De doorsnede van deze ontluchtingsleiding moet ten minste 1,25 maal zo groot zijn als de doorsnede
      van de vulleiding. Indien tanks voor brandstoffen met elkaar in verbinding staan, moet de doorsnede van de
      verbindingsleiding ten minste 1,25 maal zo groot zijn als de doorsnede van de vulleiding.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.7
    text: |-
      De uitgaande leidingen voor vloeibare brandstoffen moeten onmiddellijk bij de tanks zijn voorzien van een
      snelsluitklep, die van het dek af kan worden bediend, ook wanneer de betrokken ruimten zijn gesloten. Wanneer
      de bedieningsinrichting door de wijze van opstelling aan het gezicht is onttrokken, hoeft de bedekking of de
      afscherming niet afsluitbaar te zijn. De bedieningsinrichting moet met een rode kleur zijn gemarkeerd. Wanneer
      de inrichting door de wijze van opstelling aan het gezicht is onttrokken moet de bedekking of afscherming zijn
      voorzien van een teken ‘snelsluitklep van de tank’ met een lengte van de zijde van ten minste 10 cm, overeenkomstig
      [schets 9 van bijlage I][ref1]. De eerste zin geldt niet voor brandstoftanks die rechtstreeks aan de motor zijn
      aangebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8.05.8
    text: |-
      Brandstofleidingen, hun verbindingen, afdichtingen en appendages moeten zijn vervaardigd uit materiaal dat bestand
      is tegen de te verwachten mechanische, chemische en thermische belasting. Brandstofleidingen mogen niet onderhevig
      zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte gecontroleerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.9
    text: |-
      Brandstoftanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting moet tot aan de hoogste
      vulstand afleesbaar zijn. De peilglazen moeten tegen beschadigingen zijn beschermd, aan de onderkant zijn voorzien
      van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn gevoerd, boven de hoogste
      vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet vervormen. De peilkokers
      moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim eindigen, moeten zijn voorzien
      van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.10.a
    text: |-
      Brandstoftanks moeten door geschikte technische inrichtingen aan boord, die in het certificaat van onderzoek onder
      nummer 52 moeten worden vermeld, zijn beveiligd tegen het uitstromen van brandstof tijdens het bunkeren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.10.b
    text: |-
      Wanneer brandstof wordt ingenomen van bunkerstations die door hun eigen technische inrichtingen tegen het
      uitstromen van brandstof aan boord tijdens het bunkeren beveiligd zijn, is het uitrustingsvoorschrift, bedoeld in
      onderdeel a en in het elfde lid, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.11
    text: |-
      Indien brandstoftanks zijn uitgerust met een automatische uitschakelinrichting, moeten de meetelementen bij
      een tankvulstand van 97% het bunkeren onderbreken; deze inrichtingen moeten voldoen aan de maatstaf ‘failsafe’.
      Indien het meetelement een elektrisch contact in werking stelt, dat in de vorm van een binair signaal de van het
      bunkerstation afkomstige en gevoede stroomkring kan onderbreken, moet het signaal naar het bunkerstation kunnen
      worden overgebracht via een waterdichte apparatenstekker van een koppelingsinrichting volgens de internationale
      norm IEC 60309-1: 1999 voor gelijkstroom van 40 tot en met 50 V, kleur wit, geleidingsnok 10 uur.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.12
    text: Tanks voor brandstoffen moeten zijn voorzien van afsluitbare openingen voor reiniging en inspectie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.05.13
    text: |-
      Brandstoftanks die onmiddellijk aan de voortstuwingsmotoren en aan de voor de vaart noodzakelijke andere motoren
      zijn aangesloten, moeten zijn voorzien van een inrichting waardoor zowel optisch als akoestisch in het stuurhuis
      wordt aangegeven dat de hoeveelheid brandstof in de tank niet meer voldoende is voor een veilige voortzetting van
      de vaart.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.05
  - number: 8.06.1
    text: |-
      Smeerolie moet zijn ondergebracht in tot de scheepsromp behorende of vast in het schip bevestigde tanks van staal
      of, wanneer dit wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid gelijkwaardig
      materiaal. Dit geldt niet voor tanks met een inhoud van maximaal 25 l. Smeerolietanks mogen geen begrenzingsvlakken
      gemeen hebben met drinkwaterreservoirs.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.06
  - number: 8.06.2
    text: |-
      Smeerolietanks, alsmede de daartoe behorende leidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd en
      ingericht dat zich geen smeerolie of smeeroliedampen onopzettelijk in het inwendige van het schip kan verspreiden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.06
  - number: 8.06.3
    text: Voor het aanvaringsschot mogen zich geen smeerolietanks bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.06
  - number: 8.06.4
    text: Smeerolietanks en hun appendages mogen niet direct boven motoren of uitlaatgassenleidingen zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.06
  - number: 8.06.5
    text: De vulopeningen van smeerolietanks moeten duidelijk zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.06
  - number: 8.06.6
    text: |-
      Smeerolieleidingen, hun verbindingen, afdichtingen en appendages moeten zijn vervaardigd uit materiaal dat bestand
      is tegen de te verwachten mechanische, chemische en thermische belasting. De leidingen mogen niet onderhevig zijn
      aan schadelijke invloeden van warmte en moeten over hun volle lengte gecontroleerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.06
  - number: 8.06.7
    text: |-
      Smeerolietanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting moet afleesbaar zijn tot
      aan de hoogste vulstand. De peilglazen moeten tegen beschadigingen zijn beschermd, aan de onderkant zijn voorzien
      van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn gevoerd, boven de hoogste
      vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet vervormen. De peilkokers
      moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim eindigen, moeten zijn voorzien
      van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.06
  - number: 8.07.1
    text: |-
      Olie die in krachtoverbrengingsystemen, schakel- , voortstuwings- en verwarmingssystemen wordt gebruikt moet zijn
      ondergebracht in tot de scheepsromp behorende of vast in het schip bevestigde tanks van staal of, wanneer dit
      wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid gelijkwaardig materiaal.
      Dit geldt niet voor tanks met een inhoud van maximaal 25 l. Tanks als bedoeld in de eerste volzin mogen geen
      begrenzingsvlakken gemeen hebben met drinkwaterreservoirs.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.07
  - number: 8.07.2
    text: |-
      De in het eerste lid bedoelde tanks evenals hun leidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd
      en ingericht dat zich noch bovengenoemde olie noch oliedampen onopzettelijk in het inwendige van het schip kan
      verspreiden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.07
  - number: 8.07.3
    text: Voor het aanvaringsschot mogen zich geen in het eerst lid bedoelde tanks bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.07
  - number: 8.07.4
    text: |-
      De in het eerste lid bedoelde tanks en hun appendages mogen niet zijn geplaatst boven motoren of
      uitlaatgassenleidingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.07
  - number: 8.07.5
    text: De vulopeningen van de in het eerste lid bedoelde tanks moeten duidelijk zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.07
  - number: 8.07.6
    text: |-
      De leidingen voor als in het eerste lid bedoelde olie, hun verbindingen, afdichtingen en appendages moeten zijn
      vervaardigd uit materiaal dat bestand is tegen de te verwachten mechanische, chemische en thermische belasting.
      De leidingen mogen niet onderhevig zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte
      gecontroleerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.07
  - number: 8.07.7
    text: |-
      De in het eerste lid bedoelde tanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting
      moet afleesbaar zijn tot aan de hoogste vulstand. De peilglazen moeten tegen beschadigingen zijn beschermd, aan
      de onderkant zijn voorzien van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn
      gevoerd, boven de hoogste vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet
      vervormen. De peilkokers moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim
      eindigen, moeten zijn voorzien van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.07
  - number: 8.08.1
    text: |-
      Iedere waterdichte afdeling moet afzonderlijk kunnen worden gelenst. Dit geldt niet voor waterdichte afdelingen die
      tijdens de vaart gewoonlijk luchtdicht zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.2
    text: |-
      Op schepen waarvoor een bemanning is voorgeschreven, moeten twee onafhankelijk van elkaar werkende lenspompen
      aanwezig zijn, die niet in dezelfde ruimte mogen staan, en waarvan er ten minste één door een motor wordt
      aangedreven. Indien deze schepen echter een motorvermogen hebben van minder dan 225 kW of een laadvermogen
      van minder dan 350 t, dan wel, in geval van schepen die niet bestemd zijn voor het vervoer van goederen, een
      waterverplaatsing van minder dan 250 m3, is een hand- of motorlenspomp voldoende. Elk der voorgeschreven pompen
      moet voor elke waterdichte afdeling te gebruiken zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.3
    text: |-
      De minimale capaciteit Q van de eerste lenspomp moet worden berekend volgens de volgende formule: d moet worden
      berekend volgens de volgende formule: De minimale capaciteit Q van de tweede lenspomp moet worden berekend volgens
      de volgende formule: d moet worden berekend volgens de volgende formule: De afmeting d behoeft echter niet groter
      te zijn dan de afmeting d. Bij het berekenen van Q heeft l betrekking op de langste waterdichte afdeling. In deze
      formules betekent: l: de lengte van de desbetreffende waterdichte afdeling in [m]; d: de rekenkundige inwendige
      diameter van de hoofdlensleiding in [mm]; d: de rekenkundige inwendige diameter van de aftakking van de lensleiding
      in [mm].
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.4
    text: |-
      Indien de lenspompen zijn aangesloten op een lenssysteem moet de inwendige diameter van de lensleidingen ten minste
      afmeting d hebben, in mm, en de inwendige diameter van de aftakkingen ten minste afmeting d, in mm. Voor schepen
      met een lengte L van minder dan 25 m mogen de afmetingen d en d worden verminderd tot 35 mm.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.5
    text: Er zijn slechts zelfaanzuigende lenspompen toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.6
    text: |-
      In iedere lensbare afdeling met een vlakke bodem en een breedte van meer dan 5 m moet zich aan stuurboord en aan
      bakboord tenminste één lenskorf bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.7
    text: |-
      De achterpiek mag door middel van een gemakkelijk toegankelijke, zelfsluitende aftapinrichting, die naar de
      machinekamer loopt, gelenst kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.8
    text: |-
      De aftakkingen van de leidingen van afzonderlijke afdelingen moeten door een vastzetbare terugslagklep aan de
      hoofdlensleiding zijn aangesloten. Afdelingen of andere ruimten, die als ballastruimten dienen, behoeven slechts
      via een afsluiter aan het lenssysteem te zijn aangesloten. Dit geldt niet voor laadruimen die zijn ingericht voor
      het opnemen van ballast. Het vullen van dergelijke laadruimen met ballastwater moet door een van de lensleiding
      gescheiden, vast geïnstalleerde ballastleiding of door aftakkingen geschieden, die als flexibele leidingen of door
      middel van beweegbare tussenstukken met de hoofdlensleiding kunnen worden verbonden. Bodemkleppen zijn hiervoor
      niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.9
    text: Vullingen van laadruimen moeten zijn voorzien van peilmogelijkheden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.10
    text: |-
      Indien een lensinrichting is uitgevoerd met vast aangebrachte leidingen, moeten de lensleidingen van de bilgen
      die voor het verzamelen van oliehoudend water zijn bestemd, zijn voorzien van door een Commissie van Deskundigen
      in gesloten stand verzegelde afsluiters. Het aantal en de plaats van deze afsluiters moeten worden vermeld in het
      certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.08.11
    text: |-
      Het afgesloten zijn moet worden beschouwd als gelijkwaardig aan een verzegeling als bedoeld in het tiende lid. De
      sleutel of sleutels van de sloten van de afsluitinrichtingen moeten overeenkomstig gekenmerkt op een gemakkelijk
      toegankelijke en aangeduide plaats in de machinekamer worden bewaard.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.08
  - number: 8.09.1
    text: |-
      Het tijdens het bedrijf van een schip vrijkomend oliehoudend water moet aan boord kunnen worden verzameld. In dit
      verband wordt de machinekamer-bilge aangemerkt als verzamelruimte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.09
  - number: 8.09.2
    text: |-
      Voor het verzamelen van afgewerkte olie moeten in de machinekamer(s) één of meer speciaal daarvoor bestemde
      reservoirs zijn aangebracht die ten minste 1,5 keer de hoeveelheid afgewerkte olie uit de carters van alle
      ingebouwde verbrandingsmotoren en tandwielkasten, alsmede de hoeveelheid hydraulische olie afkomstig uit de
      hydraulische olietanks, kunnen bevatten. Aansluitingen voor het leeghalen van deze reservoirs moeten voldoen aan de
      Europese norm EN 1305: 1996.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.09
  - number: 8.09.3
    text: |-
      Voor schepen die slechts worden ingezet op korte trajecten kan de Commissie van Deskundigen ontheffing verlenen van
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.09
  - number: 8.10.1
    text: |-
      Het door een varend schip voortgebrachte geluid, in het bijzonder de door het aanzuigen van lucht en door de
      uitlaat van de motoren veroorzaakte geluiden, moet met daartoe geschikte middelen worden gedempt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.10
  - number: 8.10.2
    text: |-
      Het door een varend schip voortgebrachte geluid mag op 25 m afstand zijdelings van de scheepswand niet meer
      bedragen dan 75 dB(A).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.10
  - number: 8.10.3
    text: |-
      Bij stilliggende schepen mag het geluid, behalve tijdens het laden en lossen, op 25 m afstand zijdelings van de
      scheepswand niet meer bedragen dan 65 dB(A).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8.10
  - number: 8a.01
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *motor:* een motor die werkt volgens het principe van de
      compressieontsteking (dieselmotor);
        - *typegoedkeuring:* de beslissing waardoor de bevoegde autoriteit verklaart dat een motortype, een motorfamilie of
      een motorgroep aan de technische voorschriften van dit hoofdstuk voldoet wat betreft het niveau van de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes uit de motor(en);
        - *inbouwkeuring:* de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een vaartuig
      ingebouwde motor, met inbegrip van eventuele na de typegoedkeuring aangebrachte wijzigingen en/of afstellingen,
      voldoet aan de technische voorschriften van dit hoofdstuk wat betreft het niveau van de uitstoot van schadelijke
      gassen en luchtverontreinigende deeltjes;
        - *tussentijdse keuring:* de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een
      vaartuig in gebruik zijnde motor, met inbegrip van eventuele na de inbouwkeuring aangebrachte wijzigingen en/of
      afstellingen, voldoet aan de technische voorschriften van dit hoofdstuk wat betreft het niveau van de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes;
        - *bijzondere keuring:* de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een vaartuig
      in gebruik zijnde motor na iedere belangrijke wijziging nog aan de technische voorschriften van dit hoofdstuk
      voldoet wat betreft het niveau van de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes;
        - *motortype:* een groepering van motoren die met betrekking tot de essentiële motorkenmerken vermeld in bijlage J,
      deel II, aanhangsel 1, niet verschillend zijn; er dient tenminste één eenheid van een motortype te zijn gebouwd;
        - *motorfamilie:* een door de fabrikant vastgestelde en door de bevoegde autoriteit type goedgekeurde groepering
      van motoren, die vanwege hun ontwerp naar verwachting vergelijkbare eigenschappen hebben wat betreft het niveau van
      de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes, en die aan de voorschriften van dit hoofdstuk
      voldoen;
        - *motorgroep:* een door de fabrikant vastgestelde en door de bevoegde autoriteit goedgekeurde groepering van
      motoren, die vanwege hun ontwerp naar verwachting vergelijkbare eigenschappen hebben wat betreft het niveau van de
      uitstoot van schadelijke gassen en luchtverontreinigende deeltjes, en die aan de voorschriften van dit hoofdstuk
      voldoen, waarbij een afstelling of een wijziging van afzonderlijke motoren na de typegoedkeuring toegelaten is
      binnen vastgelegde grenzen;
        - *basismotor:* een uit een motorfamilie of motorgroep geselecteerde motor die voldoet aan de voorschriften van
      bijlage J, deel I, onderdeel 5
        - *nominaal vermogen:* het netto vermogen van de motor bij nominaal toerental en volle belasting;
        - *fabrikant:* de persoon of organisatie die tegenover de bevoegde autoriteit verantwoordelijk is voor alle
      aspecten van de typegoedkeuringsprocedure en voor de conformiteit van de produktie. Het is niet noodzakelijk dat
      deze persoon of organisatie rechtstreeks betrokken is bij alle fasen van de bouw van de motor. Indien de motor pas
      na zijn oorspronkelijke fabricage door veranderingen en aanvullingen wordt aangepast voor gebruik op een vaartuig
      in de zin van dit hoofdstuk, is de fabrikant normalerwijs de persoon of de organisatie die deze veranderingen of
      aanvullingen heeft uitgevoerd;
        - *inlichtingenformulier:* het formulier, bedoeld in bijlage J, deel II, waarin staat vermeld welke gegevens door
      de aanvrager moeten worden verstrekt;
        - *informatiedossier:* het geheel van gegevens, tekeningen, foto’s en andere bescheiden die de aanvrager
      overeenkomstig de eisen van het inlichtingenformulier aan de technische dienst of de bevoegde autoriteit moet
      verstrekken;
        - *informatiepakket:* het informatiedossier plus alle testrapporten en andere documenten die de technische dienst
      of de bevoegde autoriteit tijdens de uitvoering van hun taken aan het informatiedossier hebben toegevoegd;
        - *certificaat van typegoedkeuring:* het document, bedoeld in bijlage J, deel III, waarin de bevoegde autoriteit de
      typegoedkeuring vaststelt;
        - *proces-verbaal van de motorkenmerken:* het document, bedoeld in bijlage J, deel VIII, waarin alle kenmerken van
      de motor, met inbegrip van de onderdelen (componenten) en afstellingen die een weerslag hebben op het niveau van
      de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes evenals alle veranderingen daarvan, vastgelegd
      zijn;
        - *inlichtingenformulier van de fabrikant ter controle van de componenten betrekking hebbend op de uitlaatgassen
      en de motorkenmerken:* het document, bedoeld in artikel 8a.11, derde lid, ten behoeve van inbouwkeuringen,
      tussentijdse keuringen dan wel bijzondere keuringen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.01
  - number: 8a.02.1
    text: |-
      Dit hoofdstuk is van toepassing op alle motoren met een nominaal vermogen (PN) gelijk aan of groter dan 19 kW, die
      geïnstalleerd zijn aan boord van vaartuigen of die ingebouwd zijn in zich aan boord bevindende werktuigen, voor
      zover ze niet vallen onder de desbetreffende richtlijnen van de Europese Gemeenschap met betrekking tot de uitstoot
      van schadelijke gassen en luchtverontreinigende deeltjes.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.2
    text: |-
      De uitstoot van deze motoren van koolmonoxide (CO), koolwaterstoffen (HC), stikstofoxide (NO) en van deeltjes (PT)
      mag, met betrekking tot het nominale toerental n, de volgende waarden niet overschrijden:









                    P
                    [kW]


                    CO
                    [g/kWh]


                    HC
                    [g/kWh]


                    NO
                    [g/kWh]


                    PT
                    [g/kWh]






                    19 ≤ P < 37


                    5,5


                    1,5


                    8,0


                    0,8




                    37 ≤ P < 75


                    5,0


                    1,3


                    7,0


                    0,4




                    75 ≤ P < 130


                    5,0


                    1,0


                    6,0


                    0,3




                    130 ≤ P < 560


                    3,5


                    1,0


                    6,0


                    0,2




