    text: |-
      Vaartuigen waarvan de kiel is gelegd op 1 april 1976 of daarvóór moeten, behalve aan [artikel 24.02][ref1],
      voldoen aan de hierna genoemde bepalingen. In de onderstaande tabel betekent: - ‘V.O.’: het voorschrift is niet van
      toepassing op reeds in bedrijf zijnde vaartuigen, tenzij de betreffende delen worden vervangen of omgebouwd, dat
      wil zeggen dat dit voorschrift slechts van toepassing is bij Vervanging of bij Ombouw van de betreffende delen of
      sectoren. Worden bestaande delen vervangen door delen welke in technische zin en bouwwijze gelijk zijn, dan wordt
      dit niet beschouwd als vervanging ‘V’ volgens deze overgangsbepalingen.
        - ‘Verlenging certificaat’: aan het voorschrift moet zijn voldaan bij de eerstvolgende verlenging van de
      geldigheidsduur van het certificaat van onderzoek na de daarop aangegeven datum.
