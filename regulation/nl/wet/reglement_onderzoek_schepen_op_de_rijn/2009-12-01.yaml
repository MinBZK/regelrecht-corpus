        bwb_id: BWBR0025973
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025973
        hoofdstuk: '6'
  - number: 18.03.1.c
    text: |-
      [Artikel 10.02, tweede lid onder a en b][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.03.1.d
    text: |-
      De Commissie van Deskundigen kan van de toepassing van de overige bepalingen met betrekking tot de bouw, inrichting
      en uitrusting uitzonderingen toelaten, voor zover in het betreffende geval een zelfde mate van veiligheid is
      aangetoond.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
  - number: 18.03.2
    text: 'De Commissie van Deskundigen kan afzien van de toepassing van de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
  - number: 18.03.2.a
    text: |-
      [Artikel 8.08, tweede tot en met achtste lid][ref1], wanneer geen bemanning is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
  - number: 18.03.2.b
    text: |-
      [Artikel 10.01, eerste en derde lid][ref1], wanneer het schip bestemd voor bouwwerkzaamheden door
      middel van werkankers of palen veilig kan worden verankerd. Een schip bestemd voor bouwwerkzaamheden
      met eigen mechanische middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in
      [artikel 10.01, eerste lid][ref2], waarbij de coëfficiënt k = 45 en voor T de kleinste hoogte aan de zijde wordt
      aangenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.03.2.c
    text: |-
      [Artikel 10.02, eerste lid onder c][ref1], wanneer het schip bestemd voor bouwwerkzaamheden niet over eigen
      mechanische middelen tot voortbeweging beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.04.1
    text: |-
      Indien een schip bestemd voor bouwwerkzaamheden als spoel- en klepbak wordt geëxploiteerd moet de
      veiligheidsafstand buiten het laadruim ten minste 300 mm en het vrijboord ten minste 150 mm bedragen. De Commissie
      van Deskundigen kan een kleiner vrijboord toestaan, wanneer rekenkundig is bewezen dat de stabiliteit bij belading
      met een dichtheid van 1,5 t/m3 voldoende is en er geen zijde van het dek in het water komt. De invloed van
      vloeibaar gemaakte lading moet daarbij in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.04
  - number: 18.04.2
    text: |-
      Voor een schip bestemd voor bouwwerkzaamheden dat niet onder het eerste lid valt zijn de [artikelen 4.01][ref1] en
      [4.02][ref2] van overeenkomstige toepassing. Daarbij kan de Commissie van Deskundigen voor de veiligheidsafstand en
      voor het vrijboord afwijkende waarden vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel4
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
  - number: '18.05'
    text: Schepen bestemd voor bouwwerkzaamheden hoeven niet met een bijboot te zijn uitgerust, indien
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.05
  - number: 18.05.a
    text: ze niet zijn uitgerust met mechanische middelen tot voortbeweging, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.05
  - number: 18.05.b
    text: op het werkterrein een andere bijboot beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.05
  - number: '19.01'
    text: |-
      Op kanaalspitsen, die de Rijn slechts tussen Basel (Mittlere Rheinbrücke) en de sluizen te Iffezheim met
      inbegrip van de meest benedenstrooms gelegen voorhaven bevaren, zijn voor wat betreft bouw en uitrusting de
      [artikelen 19.02][ref1] en [19.03][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel19
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.01
    references:
