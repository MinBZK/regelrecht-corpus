  - number: '19.03'
    text: |-
      [Hoofdstuk 23][ref1] is niet van toepassing. De bemanning moet ten minste bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk23
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '23'
  - number: 19.03.a
    text: |-
      een schipper die houder is van het kanaalspitsenpatent als bedoeld in het [Patentreglement Rijn][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.03
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: 19.03.b
    text: een persoon die ten minste 16 jaar oud is en die in staat is te helpen bij het manoeuvreren met het schip.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.03
  - number: 20.01.1
    text: |-
      Zeeschepen, waarop het op 1 november 1974 te Londen tot stand gekomen Internationaal verdrag voor de beveiliging
      van mensenlevens op zee, 1974, met Bijlagen (Trb. 1977, 77) (SOLAS-verdrag), danwel het op 5 april 1966 te Londen
      tot stand gekomen Internationaal verdrag betreffende de uitwatering van schepen, 1966, (Trb. 1966, 275) van
      toepassing is, moeten in het bezit zijn van het betreffende geldige internationale document.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel20.01
  - number: 20.01.2
    text: |-
      Zeeschepen, waarop het SOLAS-verdrag danwel het Internationaal verdrag betreffende de uitwatering van schepen niet
      van toepassing is, moeten in het bezit zijn van de documenten en voorzien zijn van de vrijboordmerken die volgens
      het recht van de vlaggestaat zijn voorgeschreven en die wat betreft bouw, inrichting en uitrusting aan de eisen
      van de genoemde verdragen voldoen of een vergelijkbaar niveau van veiligheid op enigerlei andere wijze kunnen
      garanderen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel20.01
  - number: 20.01.3
    text: |-
      Zeeschepen, waarop het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van
      verontreiniging door schepen, met Protocollen en bijlagen (Trb. 1975, 147), zoals gewijzigd door het op 17 februari
      1978 te Londen tot stand gekomen Protocol van 1978 bij dat verdrag, met Bijlage (Trb. 1978, 188) (MARPOL-verdrag),
      van toepassing is, moeten in het bezit zijn van een geldig internationaal document inzake de voorkoming van
      verontreiniging van de zee (IOPP document).
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel20.01
  - number: 20.01.4
    text: |-
      Zeeschepen, waarop het MARPOL-verdrag niet van toepassing is, moeten in het bezit zijn van een overeenkomstig
      document dat volgens het recht van de vlaggestaat is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel20.01
  - number: 20.01.5
    text: 'Voorts gelden:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel20.01
  - number: 20.01.5.a
    text: |-
      [Hoofdstuk 5][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
