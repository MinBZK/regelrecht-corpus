  - number: '2.06'
    text: |-
      1 De geldigheidsduur van de volgens de bepalingen van dit reglement opgestelde certificaten van onderzoek bedraagt
      in geval van nieuwbouw:

      a) 5 jaren voor passagiersschepen en snelle schepen;

      b) 10 jaren voor alle andere vaartuigen.

      In met redenen omklede gevallen kan de Commissie van deskundigen een kortere geldigheidsduur bepalen. De
      geldigheidsduur wordt in het certificaat aangetekend.

      2 Voor vaartuigen die reeds voordat het onderzoek plaatsvindt in bedrijf waren, wordt de geldigheidsduur van het
      certificaat van onderzoek voor elk geval afzonderlijk, afhankelijk van de uitkomsten van het onderzoek, door de
      Commissie van deskundigen bepaald. Deze geldigheidsduur mag evenwel niet langer zijn dan bij het eerste lid is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.06
  - number: '2.07'
    text: |-
      1 Elke verandering van naam, overgang van de eigendom, iedere hermeting van een vaartuig alsmede elke wijziging van
      de teboekstelling of van de thuishaven moet door de eigenaar of zijn vertegenwoordiger ter kennis worden gebracht
      van een Commissie van deskundigen. Hij moet daarbij tevens het certificaat van onderzoek aan deze Commissie ter
      wijziging voorleggen.

      2 Alle aantekeningen in of wijzigingen van het certificaat van onderzoek, voorzien in dit reglement, in het
      [Rijnvaartpolitiereglement][ref1] en in andere, in gemeen overleg door de Rijnoeverstaten en België vastgestelde
      bepalingen, kunnen door iedere Commissie van deskundigen worden aangebracht.

      3 Wanneer een Commissie van deskundigen in het certificaat een wijziging aanbrengt of daarin een aantekening stelt,
      moet zij daarvan kennisgeven aan de Commissie van deskundigen die het betrokken certificaat heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.07
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: '2.08'
    text: |-
      1 Na iedere wezenlijke verandering of reparatie van een vaartuig die van invloed is op de hechtheid van de bouw,
      de vaar- of manoeuvreereigenschappen of op de kenmerkende eigenschappen moet het vaartuig, voor het weer in de
      vaart komt, aan een Commissie van deskundigen worden aangeboden, teneinde aan een bijzonder onderzoek te worden
      onderworpen.

      2 De Commissie van deskundigen die het bijzonder onderzoek verricht, stelt, afhankelijk van de resultaten van dit
      onderzoek, de geldigheidsduur van het certificaat van onderzoek vast. Deze periode mag niet langer zijn dan de
      lopende geldigheidsduur van het certificaat van onderzoek.

      De geldigheidsduur wordt aangetekend in het certificaat van onderzoek en dient ter kennis te worden gebracht van de
      Commissie van deskundigen die het certificaat heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.08
  - number: '2.09'
    text: |-
      1 Vóór afloop van de geldigheidsduur van het certificaat van onderzoek moet het vaartuig aan een periodiek
      onderzoek worden onderworpen.

      2 Bij wijze van uitzondering kan de Commissie van deskundigen op een met redenen omkleed verzoek van de eigenaar
      of zijn vertegenwoordiger de geldigheidsduur van het certificaat van onderzoek zonder periodiek onderzoek met ten
      hoogste één jaar verlengen. Deze verlenging wordt schriftelijk gegeven en moet zich aan boord van het vaartuig
      bevinden.

      3 De Commissie van deskundigen die het periodiek onderzoek verricht, stelt afhankelijk van de resultaten daarvan de
      nieuwe geldigheidsduur van het certificaat van onderzoek vast. Hierbij wordt [artikel 2.06][ref1] in acht genomen.
      De geldigheidsduur wordt aangetekend in het certificaat van onderzoek en dient ter kennis te worden gebracht van de
      Commissie van deskundigen die het certificaat heeft afgegeven.

      4 Indien in plaats van verlenging van de geldigheidsduur het certificaat van onderzoek door een nieuw certificaat
      wordt vervangen, dient het oude certificaat van onderzoek te worden teruggezonden aan de Commissie van deskundigen
      die het heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2.06
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.09
    references:
