  - number: '2.22'
    text: |-
      1 De bevoegde autoriteit voor het toelaten van boorzuiveringsinstallaties  stuurt

      a) bij iedere wijziging aan de andere bevoegde autoriteiten een lijst van de boordzuiveringsinstallatietypes (met
      de overeenkomstig [bijlage 7, onderdeel V, van ES-TRIN](onbekend) vermelde gegevens), waarvan de goedkeuringen in
      de betrokken periode door haar zijn verleend, geweigerd of ingetrokken;

      b) op verzoek van een andere bevoegde autoriteit aan deze autoriteit

      aa) een kopie van het certificaat van typegoedkeuring van het boordzuiveringsinstallatietype, al dan niet met het
      informatiepakket, van ieder boordzuiveringsinstallatietype waarvoor zij een goedkeuring heeft verleend, geweigerd
      of ingetrokken, en zo nodig

      bb) de lijst van boordzuiveringsinstallaties die zijn vervaardigd in overeenstemming met de verleende
      typegoedkeuringen, omschreven in [artikel 18.05, derde lid, van ES-TRIN][ref1], met de gegevens bedoeld in [bijlage
      7, onderdeel VI, van ES-TRIN](onbekend).

      2 Elke voor het toelaten bevoegde autoriteit zendt jaarlijks en bovendien bij ontvangst van een daartoe strekkend
      verzoek een kopie van het in [bijlage 7, onderdeel VII, van ESTRIN](onbekend) bedoelde gegevensformulier
      betreffende boordzuiveringsinstallatietypes die sinds de laatste kennisgeving zijn goedgekeurd aan het secretariaat
      van de Centrale Commissie voor de Rijnvaart.

      1 Het onderhavige lid blijft tot 1 januari 2020 van kracht. Vanaf die datum zullen met betrekking tot de
      binnenschepen de voorschriften van Verordening (EU) 2016/1628 in werking treden.

      3 De bevoegde autoriteiten stellen elkaar binnen één maand in kennis van de intrekking van een typegoedkeuring
      en van de redenen daarvoor en stellen tegelijkertijd het secretariaat van de Centrale Commissie voor de Rijnvaart
      daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18.05
