  - number: '1.06'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen met een geldigheidsduur
      van ten hoogste drie jaren, wanneer het noodzakelijk wordt geacht om:

      a) in dringende gevallen afwijkingen van dit reglement toe te laten, dan wel

      b) proefnemingen mogelijk te maken, waarbij de veiligheid en de vlotte afwikkeling van het scheepvaartverkeer niet
      worden aangetast.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel1.06
  - number: '1.07'
    text: |-
      1 In het belang van een eenvoudige en uniforme toepassing van dit reglement kan de Centrale Commissie voor de
      Rijnvaart dienstinstructies voor de Commissies van deskundigen en de volgens dit reglement bevoegde autoriteiten
      vaststellen. De Commissies van deskundigen en de bevoegde autoriteiten worden van deze dienstinstructie in kennis
      gesteld.

      2 De Commissies van deskundigen en de bevoegde autoriteiten dienen zich aan deze dienstinstructie te houden.

      3 De instructies overeenkomstig [ES-TRIN][ref1] voor de toepassing van ES-TRIN gelden als dienstinstructies in de
      zin van het Reglement onderzoek schepen op de Rijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel1.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: '2.01'
    text: |-
      1 In bepaalde daarvoor in aanmerking komende havens zijn door de Rijnoeverstaten en België Commissies van
      deskundigen ingesteld.

      2 De Commissies van deskundigen bestaan uit een voorzitter en erkend deskundigen.

      Als erkend deskundigen maken van iedere Commissie van deskundigen ten minste deel uit:

      a) een personeelslid van het bevoegd gezag op het gebied van de scheepvaart;

      b) een erkend deskundige op het gebied van de bouw van binnenschepen en hun machines;

      c) een erkend nautisch deskundige die in het bezit is van een binnenvaartschipperspatent dat het voeren van het
      schip dat onderzocht moet worden toestaat;

      d) bij het onderzoek van traditionele vaartuigen een erkend deskundige voor traditionele vaartuigen.

      3 De voorzitter en de erkend deskundigen van elke Commissie van deskundigen worden benoemd door de autoriteiten van
      de staat die de Commissie van deskundigen heeft ingesteld.

      De voorzitter en de erkend deskundigen dienen bij de aanvaarding van hun functie schriftelijk te verklaren dat zij
      deze in alle onpartijdigheid zullen vervullen. Van ambtenaren wordt een dergelijke verklaring niet geëist.

      4 De Commissies van deskundigen kunnen zich onder de voorwaarden, zoals door elk der betrokken staten zullen worden
      vastgesteld, laten bijstaan door gespecialiseerde erkend deskundigen.

      5 De Centrale Commissie voor de Rijnvaart zorgt voor het bijhouden en het publiceren van een lijst van de
      Commissies van deskundigen.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.01
  - number: '2.02'
    text: |-
      1 De eigenaar van een vaartuig of zijn vertegenwoordiger die een onderzoek hiervan wenst, moet bij de Commissie
      van deskundigen van zijn keuze een aanvraag indienen volgens het model van [bijlage A][ref1]. De Commissie van
      deskundigen stelt vast welke bescheiden moeten worden overgelegd.

      2 De eigenaar van een vaartuig, waarop dit reglement niet van toepassing is, of zijn vertegenwoordiger, kan een
      certificaat van onderzoek aanvragen. Aan deze aanvraag dient gevolg te worden gegeven wanneer het vaartuig voldoet
      aan de bepalingen van dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: '2.03'
    text: |-
      1 De eigenaar of zijn vertegenwoordiger moet het vaartuig leeg, schoongemaakt en met volledige uitrusting voor
      onderzoek aanbieden. Hij is verplicht bij het onderzoek de noodzakelijke hulp te verlenen, bijv. een geschikte boot
      met personeel ter beschikking te stellen, en die delen van de romp of van de installaties bloot te leggen, die niet
      direct toegankelijk of zichtbaar zijn.

      2 De Commissie van deskundigen moet bij het eerste onderzoek het vaartuig op het droge bezichtigen.
      Bezichtiging op het droge kan achterwege blijven wanneer een klassecertificaat of een verklaring van een erkend
      classificatiebureau, volgens welke de bouw voldoet aan de daardoor gehanteerde voorschriften, wordt overgelegd.
      Bij periodieke of bijzondere onderzoeken kan de Commissie van deskundigen een bezichtiging op het droge
      verlangen. De Commissie van deskundigen moet bij het eerste onderzoek van vaartuig met eigen mechanische middelen
      en samenstellen, alsmede bij essentiële veranderingen in de voortstuwingsinstallatie of de stuurinrichting
      proefvaarten doen plaatsvinden.

      3 De Commissie van deskundigen kan extra bezichtigingen en proefvaarten doen plaatsvinden en nadere bewijzen
      verlangen. Dit geldt tevens tijdens de bouw.

      4 Onverminderd het derde lid, moet de Commissie van deskundigen die uiteindelijk het certificaat van onderzoek
      moet afgeven, door de eigenaar of zijn vertegenwoordiger vóór het begin van de bouw (nieuwbouw of verlenging
      van een reeds in bedrijf zijnde vaartuig) van vaartuigen met een lengte L van meer dan 110 m met uitzondering
      van zeeschepen, hiervan op de hoogte worden gesteld. Deze Commissie van deskundigen voert tijdens de bouwperiode
      onderzoeken uit. Zij kan hiervan afzien wanneer vóór het begin van de bouw een verklaring van een erkend
      classificatiebureau wordt overgelegd waarin het verklaart dat het op de bouw toeziet.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.03
  - number: '2.04'
    text: |-
      1 Wanneer de Commissie van deskundigen op grond van het onderzoek van een vaartuig vaststelt dat dit beantwoordt
      aan de bepalingen van dit reglement en de bepalingen van [ES-TRIN][ref1], geeft zij aan de aanvrager een
      certificaat van onderzoek volgens het model van [bijlage 3, onderdeel I, van ES-TRIN](onbekend) af.

      2 De Commissie van deskundigen controleert bij afgifte van een certificaat van onderzoek of aan het desbetreffende
      vaartuig niet reeds een geldig certificaat is afgegeven, zoals bedoeld in [artikel 1.04][ref2].

      3 Ingeval de Commissie van deskundigen weigert een certificaat van onderzoek af te geven, moet zij dit aan de
      aanvrager gemotiveerd schriftelijk mededelen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel1.04
