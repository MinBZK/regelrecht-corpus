  - number: '2.13'
    text: |-
      1 Wanneer de Commissie van deskundigen tijdens een onderzoek bemerkt dat een vaartuig of de uitrusting
      daarvan ernstige gebreken vertoont, en dat daardoor de veiligheid van de zich aan boord bevindende personen
      of de scheepvaart in gevaar wordt gebracht, dient het certificaat te worden ingehouden en dient de Commissie
      die het heeft afgegeven hiervan onverwijld in kennis te worden gesteld. Bij duwbakken dient ook de in
      [artikel 1.10, tweede lid, van het Rijnvaartpolitiereglement][ref1] voorgeschreven metalen plaat te worden
      ingehouden.

      Wanneer de Commissie van deskundigen heeft geconstateerd dat de gebreken zijn verholpen, wordt het certificaat aan
      de eigenaar of zijn vertegenwoordiger teruggegeven.

      Dit constateren en de teruggave van het certificaat kunnen op verzoek van de eigenaar of zijn vertegenwoordiger
      door tussenkomst van een andere Commissie geschieden.

      Wanneer de Commissie van deskundigen die het certificaat heeft ingehouden, vermoedt dat de gebreken niet binnen
      afzienbare tijd worden verholpen, wordt het certificaat gezonden aan de Commissie van deskundigen die het heeft
      afgegeven of het laatst heeft verlengd.

      2 Wanneer een vaartuig definitief is opgelegd of gesloopt, moet de eigenaar het certificaat terugzenden aan de
      Commissie van deskundigen die het heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel1.10
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '1.10'
  - number: '2.14'
    text: |-
      1 Wanneer een certificaat van onderzoek verloren is gegaan, moet hiervan kennis worden gegeven aan de Commissie van
      deskundigen die het heeft afgegeven. Deze Commissie geeft dan een duplicaat van het certificaat van onderzoek af,
      dat als zodanig is gewaarmerkt.

      2 Wanneer een certificaat van onderzoek onleesbaar of om enige andere reden onbruikbaar is geworden, moet de
      eigenaar van het vaartuig of zijn vertegenwoordiger het certificaat van onderzoek terugzenden aan de Commissie van
      deskundigen die het heeft afgegeven; deze geeft dan een duplicaat af, overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.14
  - number: '2.15'
    text: |-
      1 Onverminderd [artikel 2.11, tweede lid][ref1], draagt de eigenaar van een vaartuig of zijn vertegenwoordiger
      de kosten die voortvloeien uit het onderzoek en de afgifte van het certificaat van onderzoek, overeenkomstig het
      geldende tarief, dat door elk der Rijnoeverstaten en België wordt vastgesteld. Er mag hierbij geen onderscheid
      worden gemaakt uit hoofde van het land van teboekstelling van het vaartuig of de nationaliteit of woonplaats van
      de eigenaar.

      2 De Commissie van deskundigen kan vóór het onderzoek een voorschot verlangen dat niet hoger mag zijn dan het
      vermoedelijke bedrag van de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2.11'
        hoofdstuk: '2'
  - number: '2.16'
    text: |-
      De Commissie van deskundigen kan personen, die kunnen aantonen daar om gegronde redenen belang bij te hebben,
      kennis laten nemen van de inhoud van het certificaat van onderzoek van een vaartuig, en op hun kosten als zodanig
      aangeduide uittreksels of gewaarmerkte afschriften van het certificaat verstrekken.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 De Commissies van deskundigen geven de door hen afgegeven certificaten een volgnummer. Zij houden een register
      bij van alle door hen afgegeven certificaten overeenkomstig [bijlage 3, onderdeel VI, van ES-TRIN](onbekend).

      2 De Commissies van deskundigen bewaren de minuut of een afschrift van elk certificaat dat zij hebben afgegeven.
      Daarop tekenen zij alle aantekeningen en wijzigingen, alsmede ongeldigheidsverklaringen en vervangingen van de
      certificaten aan en actualiseren zij volgens het eerste lid de registratie dienovereenkomstig.

      3 Ter uitvoering van de bestuursrechtelijke maatregelen op het gebied van de scheepvaart en ter toepassing van de
      [artikelen 2.02 tot en met 2.15][ref1] wordt aan de bevoegde autoriteiten van de Rijnoeverstaten en België, van
      de lidstaten van de Europese Unie en, voor zover een gelijkwaardige gegevensbescherming is gewaarborgd, aan de
      bevoegde autoriteiten van derde landen op grond van bestuursrechtelijke overeenkomsten het recht tot inzage in de
      registratie zoals bedoeld in het eerste lid verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2.02
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2.02'
        hoofdstuk: '2'
  - number: '2.18'
    text: |-
      1 De Rijnoeverstaten en België zorgen ervoor dat ieder vaartuig overeenkomstig dit reglement en [ES-TRIN][ref1] een
      uniek Europees scheepsidentificatienummer (ENI-nummer) wordt toegekend.

      2 Ieder vaartuig heeft slechts één ENI-nummer dat gedurende zijn hele levensduur onveranderd blijft.

      3 Het ENI-nummer bestaat uit acht Arabische cijfers overeenkomstig [bijlage 1 van ESTRIN](onbekend).

      4 De Commissie van deskundigen die het certificaat van onderzoek afgeeft voor een vaartuig, vult op dit certificaat
      het ENI-nummer in. Dit nummer wordt, voor zover het vaartuig op het moment van de afgifte van het certificaat
      van onderzoek nog niet over een ENI-nummer beschikt, door de bevoegde autoriteit van de staat waarin zijn plaats
      van teboekstelling of zijn thuishaven is gelegen, toegekend. Indien geen ENI-nummer kan worden toegekend aan een
      vaartuig in het land van zijn teboekstelling of van zijn thuishaven, wordt het ENI-nummer dat op het certificaat
      van onderzoek moet worden ingevuld, toegekend door de bevoegde autoriteit van de staat waarin de Commissie van
      deskundigen is gevestigd die dit certificaat afgeeft. Deze bepalingen zijn niet van toepassing op zeeschepen.

      5 De eigenaar van het vaartuig of zijn vertegenwoordiger moet de toekenning van het ENI-nummer bij de bevoegde
      autoriteit aanvragen. Hij moet tevens het ENI-nummer, dat in het certificaat van onderzoek is ingevuld, daarop
      doen aanbrengen.

      6 De Rijnoeverstaten en België brengen de namen en contactgegevens van de autoriteiten die bevoegd zijn tot het
      afgeven van een ENI-nummer evenals de wijziging van die gegevens ter kennis van het secretariaat van de Centrale
      Commissie. Het secretariaat van de Centrale Commissie voor Rijnvaart houdt een register bij van deze autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: '2.19'
    text: |-
      1 De Rijnoeverstaten en België zorgen ervoor dat de bevoegde instanties voor ieder vaartuig waarvoor een
      certificaat van onderzoek werd aangevraagd of afgegeven onverwijld de volgende informatie krachtens Richtlijn (EU)
      2016/1629 in de EHDB invoeren:

      a) de gegevens ter identificatie en beschrijving van het vaartuig overeenkomstig [bijlage 2 van ES-TRIN](onbekend);

      b) de gegevens betreffende de afgegeven, vernieuwde, vervangen en ingetrokken certificaten van onderzoek, en
      betreffende de Commissie van deskundigen die het certificaat van onderzoek afgeeft;

      c) een digitale kopie van alle door de Commissies van deskundigen afgegeven certificaten;

      d) de gegevens over alle afgewezen of lopende aanvragen voor certificaten van onderzoek; en

      e) alle veranderingen van de in de punten b tot en met d bedoelde gegevens.

      2 De in het eerste lid bedoelde gegevens kunnen worden verwerkt door de bevoegde instanties van de lidstaten van de
      Europese Unie, de Rijnoeverstaten en België en derde landen die zijn belast met taken in verband met de toepassing
      van Richtlijn (EU) 2016/1629 en van [Richtlijn 2005/44/EG](32005L0044) voor de volgende doeleinden:

      a) toepassen van Richtlijn (EU) 2016/1629 en van [Richtlijn 2005/44/EG](32005L0044);

      b) waarborgen van binnenscheepvaart- en infrastructuurbeheer;

      c) vrijwaren of handhaven van de veiligheid van de scheepvaart;

      d) verzamelen van statistische gegevens.

      3 Elke verwerking van persoonsgegevens door de Rijnoeverstaten en België vindt plaats overeenkomstig het recht van
      de Europese Unie inzake de bescherming van persoonsgegevens, met name Verordening (EU) 2016/679.

      4 De bevoegde autoriteit van een van de Rijnoeverstaten of van België kan persoonsgegevens overdragen aan een derde
      land of een internationale organisatie, mits die overdracht uitsluitend per geval plaatsvindt en aan de voorwaarden
      van Verordening (EU) 2016/679 en met name die opgenomen in hoofdstuk V, is voldaan. De Rijnoeverstaten en België
      waarborgen dat de overdracht noodzakelijk is voor de in het tweede lid bedoelde doeleinden. De Rijnoeverstaten en
      België waarborgen dat het derde land of de internationale organisatie de gegevens niet overdraagt aan een ander
      derde land of een andere internationale organisatie, tenzij dat land of die internationale organisatie hiervoor
      uitdrukkelijke schriftelijke toestemming heeft verkregen en voldoet aan de door de bevoegde instantie van de
      Rijnoeverstaten en België gestelde voorwaarden.

      5 De bevoegde autoriteit zorgt ervoor dat de gegevens betreffende een vaartuig uit de in het eerste lid bedoelde
      databank worden gewist wanneer dit vaartuig wordt gesloopt.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.19
  - number: '2.20'
    text: |-
      1 Wanneer in de bepalingen van [ES-TRIN][ref1] wordt bepaald dat op een vaartuig bepaalde materialen, inrichtingen
      of uitrustingsstukken moeten worden gebruikt of aan boord moeten zijn, of dat bepaalde bouwkundige maatregelen
      moeten worden getroffen of bepaalde opstellingen moeten worden aangehouden, kan de Commissie van deskundigen de
      toepassing of de aanwezigheid aan boord van dit vaartuig van andere materialen, inrichtingen of uitrustingsstukken
      toestaan, dan wel dat andere bouwkundige maatregelen worden getroffen of dat andere opstellingen worden
      aangehouden, mits deze op grond van aanbevelingen van de Centrale Commissie voor de Rijnvaart als gelijkwaardig
      zijn erkend.

      2 Indien de toepassing:

      a) van de in [hoofdstuk 19 van ES-TRIN][ref2] genoemde bepalingen, die te maken hebben met het rekening houden met
      de bijzondere veiligheidsbehoeften van personen met beperkte mobiliteit, of

      b) van de in [hoofdstuk 32 van ES-TRIN][ref3] genoemde bepalingen na afloop van de overgangsbepalingen in de
      praktijk moeilijk uitvoerbaar is of onevenredig hoge kosten met zich brengt, kan de Commissie van deskundigen op
      grond van aanbevelingen van de Centrale Commissie voor de Rijnvaart afwijkingen van deze voorschriften toestaan.
      Deze afwijkingen moeten in het certificaat van onderzoek worden aangetekend.

      3 Bij wijze van proef en voor een beperkte tijdsduur kan een Commissie van deskundigen op grond van een aanbeveling
      van de Centrale Commissie voor de Rijnvaart voor een vaartuig met nieuwe technische voorzieningen die afwijken
      van de technische voorschriften van [ES-TRIN][ref4] een certificaat van onderzoek afgeven, voor zover deze nieuwe
      voorzieningen een voldoende veiligheid bieden.

      4 De bevoegde autoriteiten informeren het secretariaat van de Centrale Commissie voor de Rijnvaart binnen één maand
      over de afgifte van een gelijkwaardigheid en afwijking.

      5 De in het eerste lid tot derde lid en zesde lid genoemde gelijkwaardigheden en afwijkingen dienen in het
      certificaat van onderzoek te worden aangetekend.

      6 Op vaartuigen die worden omgebouwd tot schepen met een lengte van meer dan 110m mag de Commissie van deskundigen
      [hoofdstuk 32 van ES-TRIN][ref5] slechts toepassen op grond van bijzondere aanbevelingen van de Centrale Commissie
      voor de Rijnvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk19
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk32
      [ref4]: https://wetten.overheid.nl/BWBR0041395
      [ref5]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk32
