  - number: '1.02'
    text: |-
      1 Dit reglement is van toepassing op de volgende vaartuigen:

      a) schepen met een lengte (*L*) van 20 m of meer;

      b) schepen waarvan het volume, berekend uit het product lengte (*L*), breedte (*B*) en diepgang (*T*), 100 m³ of
      meer bedraagt.

      2 Bovendien is dit reglement van toepassing op alle:

      a) sleep- en duwboten die zijn bestemd om de in het eerste lid bedoelde schepen of drijvende werktuigen te slepen,
      te duwen of langszijde gekoppeld mede te voeren;

      b) schepen die beschikken over een certificaat van goedkeuring als bedoeld in het ADN;

      c) passagiersschepen;

      d) drijvende werktuigen.

      3 Dit reglement is niet van toepassing op veerponten als bedoeld in het [Rijnvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel1.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: '1.03'
    text: |-
      Vaartuigen, drijvende inrichtingen of drijvend voorwerpen, waarvoor een certificaat van onderzoek opgesteld moet
      worden, moeten aan de bepalingen van dit reglement en aan de eisen van [ES-TRIN][ref1] voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel1.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: '1.04'
    text: |-
      Op de in [artikel 1.02, eerste en tweede lid][ref1], bedoelde vaartuigen moeten

      a) een certificaat van onderzoek, dat door een Commissie van deskundigen, die door één der Rijnoeverstaten of
      België overeenkomstig de bepalingen van dit reglement is afgegeven,

      of

      b) een door de Centrale Commissie van de Rijnvaart als gelijkwaardig erkend certificaat aan boord aanwezig zijn.

      Het certificaat van onderzoek wordt opgesteld overeenkomstig het model dat in [bijlage 3, onderdeel I, van ES-TRIN]
      (onbekend) is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel1.02
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel1.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '1.02'
        hoofdstuk: '1'
  - number: '1.05'
    text: |-
      1 Op zeeschepen, waarop het Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (SOLAS
      1974) dan wel het Internationaal Verdrag van 1966 betreffende de uitwatering van schepen van toepassing is, moet
      het betreffende geldige internationale document aan boord aanwezig zijn.

      2 Zeeschepen, waarop SOLAS 1974 dan wel het Internationaal verdrag betreffende de uitwatering van schepen niet
      van toepassing is, moeten voorzien zijn van de desbetreffende documenten en van de vrijboordmerken die volgens het
      recht van de vlaggenstaat zijn voorgeschreven en die wat betreft bouw, inrichting en uitrusting aan de eisen van de
      genoemde verdragen voldoen of een vergelijkbaar niveau van veiligheid op enigerlei andere wijze kunnen garanderen.

      3 Op zeeschepen, waarop het Internationaal Verdrag van 1973 ter voorkoming van verontreiniging door schepen (MARPOL
      73) van toepassing is, moet een geldig internationaal document inzake de voorkoming van verontreiniging van de zee
      (IOPP document) aan boord aanwezig zijn.

      4 Op zeeschepen, waarop MARPOL 73 niet van toepassing is, moet een overeenkomstig document dat volgens het recht
      van de vlaggenstaat is voorgeschreven aan boordaanwezig zijn.

      5 Op zeeschepen en drijvende werktuigen die zijn toegelaten om te worden gebruikt aan de kust of op zee moet
      het geldige certificaat als bedoeld in [bijlage 3, onderdeel IV, van ES-TRIN](onbekend) aan boord aanwezig zijn,
      indien het geldige certificaat van onderzoek als bedoeld in bijlage 3, onderdeel I, van ES-TRIN niet aan boord
      aanwezig is. Daarbij dient bij drijvende werktuigen aan [hoofdstuk 25 van ESTRIN][ref1] ook met inachtneming van
      [hoofdstuk 22 van ES-TRIN][ref2] te zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk25
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk22
