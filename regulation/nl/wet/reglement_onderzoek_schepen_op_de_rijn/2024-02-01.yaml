      1 Voor bepaalde onderdelen en uitrustingen van de vaartuigen wordt het voldoen aan de vereisten vastgesteld met
      door de bevoegde autoriteiten afgegeven typegoedkeuringen.

      Deze onderdelen en uitrustingen, de vereisten alsmede de procedures voor de afgifte van de typegoedkeuringen zijn
      in [ES-TRIN][ref1] vastgelegd.

      2 De bevoegde autoriteiten kennen aan elke typegoedkeuring een nummer toe. Dit nummer begint met de letter R. De
      voorschriften inzake de samenstelling van de typegoedkeuringsnummers en inzake de markering van de uitrustingen en
      onderdelen met deze nummers zijn in [ES-TRIN][ref2] vastgelegd.

      3 De lidstaten stellen de Centrale Commissie voor de Rijnvaart in kennis van de door hen aangewezen bevoegde
      autoriteiten.

      4 De bevoegde autoriteiten stellen de Centrale Commissie voor de Rijnvaart in kennis van de door hen op grond van
      typegoedkeuringen toegelaten uitrustingen en onderdelen alsmede van de door hen voor de inbouw of het vervangen van
      deze uitrustingen en onderdelen erkende gespecialiseerde bedrijven.

      5 De Centrale Commissie voor de Rijnvaart publiceert:

      a) de lijsten van de voor de afgifte van typegoedkeuringen bevoegde autoriteiten en de in dit kader erkende
      technische diensten;

      b) de lijsten van de krachtens de op grond van dit reglement afgegeven typegoedkeuringen en krachtens de als
      gelijkwaardig erkende typegoedkeuringen toegelaten onderdelen en uitrustingen;

      c) de lijsten van de voor de inbouw of het vervangen van de toegelaten onderdelen en uitrustingen erkende
      gespecialiseerde bedrijven.

      6 De typegoedkeuringen voor uitrustingen krachtens Richtlijn (EU) 2016/1629 zijn gelijkwaardig aan de
      eerdergenoemde typegoedkeuringen.

      7 Het tweede tot en met zesde lid gelden niet voor vast ingebouwde brandblusinstallaties


