  - number: '2.05'
    text: |-
      1 De Commissie van deskundigen kan een voorlopig certificaat afgeven voor:

      a) vaartuigen die met toestemming van de Commissie van deskundigen naar een bepaalde plaats willen varen om een
      certificaat van onderzoek te verkrijgen;

      b) vaartuigen waarvan het certificaat van onderzoek verloren, beschadigd of tijdelijk ingetrokken is, zoals bedoeld
      in de [artikelen 2.07][ref1] of [2.13, eerste lid][ref2];

      c) vaartuigen waarvan het certificaat van onderzoek na een inspectie met positief resultaat wordt voorbereid;

      d) vaartuigen die niet aan alle voorwaarden voor het verkrijgen van een certificaat van onderzoek voldoen;

      e) vaartuigen die zodanige schade hebben geleden dat de staat waarin zij verkeren niet meer overeenstemt met
      hetgeen in het certificaat van onderzoek is gesteld;

      f) drijvende inrichtingen en drijvende voorwerpen, in het geval dat de voor de toepassing van
      [artikel 1.21, eerste lid, van het Rijnvaartpolitiereglement][ref3] bevoegde autoriteiten de vergunning voor een
      bijzonder transport afhankelijk stelt van het verkrijgen van een voorlopig certificaat van onderzoek;

      g) vaartuigen waarvoor de Commissie van deskundigen een gelijkwaardigheid als bedoeld in
      [artikel 2.20, eerste tot derde lid][ref4], toestaat, voor de gevallen waarvoor de Centrale Commissie voor de
      Rijnvaart nog geen aanbeveling heeft gedaan.

      2 Het voorlopige certificaat van onderzoek wordt volgens het model van [bijlage 3, onderdeel II, van ES-TRIN]
      (onbekend) afgegeven, wanneer de deugdelijkheid van het vaartuig, de drijvende inrichting of het drijvende voorwerp
      voor de vaart voldoende gewaarborgd wordt geacht.

      3 Het voorlopige certificaat van onderzoek moet de voorwaarden bevatten die door de Commissie van deskundigen nodig
      worden geacht en is geldig:

      a) in de in het eerste lid, onder a en d tot en met f, bedoelde gevallen voor één bepaalde reis, te maken binnen
      een redelijke termijn, die ten hoogste één maand mag zijn;

      b) in de in het eerste lid, onder b en c, bedoelde gevallen gedurende een redelijke termijn;

      c) in de in het eerste lid, onder g, genoemde gevallen gedurende zes maanden. Deze termijn mag slechts worden
      verlengd met toestemming van de Centrale Commissie voor de Rijnvaart.

      4 De bevoegde autoriteit stelt de Centrale Commissie voor de Rijnvaart binnen een maand na afgifte van het
      voorlopig certificaat overeenkomstig het eerste lid, onderdeel g, in kennis van de naam en het Europees
      scheepsidentificatienummer van het vaartuig, van de aard van de afwijking, alsmede van het land waarin het vaartuig
      is teboekgesteld of waarin zijn thuishaven is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2.07
