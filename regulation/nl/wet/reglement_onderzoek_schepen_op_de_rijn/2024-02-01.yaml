        artikel: '2.06'
        hoofdstuk: '2'
  - number: '2.10'
    text: |-
      De eigenaar van een vaartuig of zijn vertegenwoordiger kan op elk moment om een vrijwillig onderzoek verzoeken. Aan
      dit verzoek om een onderzoek dient gevolg te worden gegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Wanneer een der bevoegde autoriteiten, belast met de zorg voor de veiligheid van de scheepvaart op de Rijn, van
      mening is dat een vaartuig gevaar kan opleveren voor de zich aan boord bevindende personen of voor de scheepvaart,
      kan zij gelasten dat het vaartuig door een Commissie van deskundigen wordt onderzocht.

      2 De eigenaar van het vaartuig draagt slechts dan de kosten van het onderzoek, wanneer de Commissie van deskundigen
      erkent dat de mening van de in het eerste lid bedoelde autoriteit gegrond is.
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 De Commissie van deskundigen kan er geheel of gedeeltelijk van afzien te onderzoeken of een vaartuig voldoet aan
      de in [ES-TRIN][ref1] voorgeschreven bepalingen, voor zover uit een geldige verklaring, afgegeven door een erkend
      classificatiebureau, blijkt dat het vaartuig geheel of gedeeltelijk aan die bepalingen voldoet.

      2 Een verklaring van een erkend classificatiebureau, dan wel – voor zover dit volgens dit reglement voor bepaalde
      onderdelen van de uitrusting is toegelaten – van een technische dienst, mag door de bevoegde autoriteit slechts dan
      worden erkend, indien dat erkend classificatiebureau of die andere instantie verklaart dat het de bepalingen van de
      instructies van [ES-TRIN][ref2] in acht heeft genomen.

      3 Voor de toepassing van [ES-TRIN][ref3] kunnen technische diensten niet gelegen in de Rijnoeverstaten, België of
      de lidstaten van de Europese Unie slechts op aanbeveling van de Centrale Commissie voor de Rijnvaart worden erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0041395
      [ref3]: https://wetten.overheid.nl/BWBR0041395
