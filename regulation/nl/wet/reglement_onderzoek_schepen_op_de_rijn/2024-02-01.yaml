articles:
  - number: '1.01'
    text: |-
      In dit reglement wordt verstaan onder:

      1. *‘vaartuig’:* een schip of een drijvend werktuig;

      2. *‘schip’:* een binnenschip of een zeeschip;

      3. *‘binnenschip’:* een schip dat uitsluitend of overwegend bestemd is voor de vaart op de binnenwateren;

      4. *‘zeeschip’:* een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe is bestemd;

      5. *‘sleepboot’:* een schip dat speciaal is gebouwd om te slepen;

      6. *‘duwboot’:* een schip dat speciaal is gebouwd voor het voortbewegen van een duwstel;

      7. *‘duwbak’:* een schip dat is bestemd voor het vervoer van goederen en gebouwd of in het bijzonder geschikt is
      om te worden geduwd zonder eigen mechanische middelen tot voortbeweging, dan wel met eigen mechanische middelen
      tot voortbeweging die slechts verplaatsingen over kleine afstanden toelaten, wanneer het geen deel uitmaakt van
      een duwstel;

      8. *‘passagiersschip’:* een schip voor dagtochten of een hotelschip dat is gebouwd en ingericht voor het vervoer
      van meer dan 12 passagiers;

      9. *‘schip voor dagtochten’:* een passagiersschip waarop zich geen hutten bevinden voor overnachting van
      passagiers;

      10. *‘hotelschip’:* een passagiersschip waarop zich hutten bevinden voor overnachting van passagiers;

      11. *‘snel schip’:* een schip met eigen mechanische middelen tot voortbeweging dat een snelheid ten opzichte van
      het water kan bereiken van meer dan 40 km/u;

      12. *‘drijvend werktuig’:* een drijvend bouwsel waarop zich werkinstallaties bevinden, zoals kranen, baggermolens,
      hei-installaties of elevatoren;

      13. *‘drijvende inrichting’* een drijvend bouwsel dat vanwege zijn bestemming in de regel niet wordt verplaatst,
      zoals een badinrichting, een dok, een steiger of een botenhuis;

      14. *‘drijvend voorwerp’* een vlot, alsmede een ander voorwerp of samenstel van voorwerpen dat geschikt is gemaakt
      om te varen en dat geen schip, drijvend werktuig of drijvende inrichting is;

      15. *‘samenstel’:* een hecht samenstel of een sleep;

      16. *‘formatie’:* vorm van de samenstelling van een samenstel;

      17. *‘hecht samenstel’:* een duwstel of een gekoppeld samenstel;

      18. *‘duwstel’:* een hecht samenstel van vaartuigen, waarvan er ten minste één is geplaatst vóór het vaartuig
      met motoraandrijving dat dient voor het voortbewegen van het samenstel, dan wel voor de beide vaartuigen met
      motoraandrijving die dienen voor het voortbewegen van het samenstel en die worden aangeduid als ‘duwboot’ of
      ‘duwboten’.Hieronder wordt ook verstaan een duwstel dat is samengesteld uit een duwend en een geduwd vaartuig
      waarvan de koppelingen een beheerst knikken mogelijk maken;

      19. *‘gekoppeld samenstel’:* een samenstel van langszijde van elkaar vastgemaakte vaartuigen, waarvan er geen is
      geplaatst vóór het vaartuig met motoraandrijving dat dient voor het voortbewegen van het samenstel;

      20. *‘sleep’:* een samenstel van één of meer vaartuigen, drijvende inrichtingen of drijvende voorwerpen, dat wordt
      gesleept door één of meer tot het samenstel behorende vaartuigen met motoraandrijving;

      21. *‘lengte’ of ‘L’:* de grootste lengte van de scheepsromp in m, het roer en de boegspriet niet inbegrepen;

      22. *‘breedte’ of ‘B’:* de grootste breedte van de scheepsromp in m, gemeten op de buitenkant van de huidbeplating
      (schoepraderen, schuurlijsten en dergelijke niet inbegrepen);

      23. *‘diepgang’ of ‘T’:* de verticale afstand in m tussen het laagste punt van de scheepsromp, zonder rekening te
      houden met de kiel of andere vaste onderdelen, en het vlak van de grootste inzinking van het schip;

      24. *‘erkend classificatiebureau’:* een classificatiebureau dat is erkend door alle Rijnoeverstaten en België, te
      weten: DNV, Bureau Veritas (BV) en Lloyd’s Register (LR);

      25. *‘ES-TRIN’:* ES-TRIN als bedoeld in [artikel 1.1 van de Binnenvaartregeling][ref1]. Voor de toepassing van ES-
      TRIN wordt voor het begrip ‘lidstaat’ gelezen ‘een van de Rijnoeverstaten of België’.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0025973/2024-02-01#Artikel1.01
    references:
