---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_onderzoek_schepen_op_de_rijn
regulatory_layer: WET
publication_date: '2021-10-05'
valid_from: '2018-10-07'
bwb_id: BWBR0025973
url: https://wetten.overheid.nl/BWBR0025973/2018-10-07
articles:
  - number: '1.01'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.1
    text: '*‘vaartuig’:* een schip of een drijvend werktuig;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.2
    text: '*‘schip’:* een binnenschip of een zeeschip;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.3
    text: '*‘binnenschip’:* een schip dat uitsluitend of overwegend bestemd is voor de vaart op de binnenwateren;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.4
    text: '*‘zeeschip’:* een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe is bestemd;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.5
    text: '*‘sleepboot’:* een schip dat speciaal is gebouwd om te slepen;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.6
    text: '*‘duwboot’:* een schip dat speciaal is gebouwd voor het voortbewegen van een duwstel;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.7
    text: |-
      *‘duwbak’:* een schip dat is bestemd voor het vervoer van goederen en gebouwd of in het bijzonder geschikt is om
      te worden geduwd zonder eigen mechanische middelen tot voortbeweging, dan wel met eigen mechanische middelen tot
      voortbeweging die slechts verplaatsingen over kleine afstanden toelaten, wanneer het geen deel uitmaakt van een
      duwstel;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.8
    text: |-
      *‘passagiersschip’:* een schip voor dagtochten of een hotelschip dat is gebouwd en ingericht voor het vervoer van
      meer dan 12 passagiers;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.9
    text: '*‘schip voor dagtochten’:* een passagiersschip waarop zich geen hutten bevinden voor overnachting van passagiers;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.10
    text: '*‘hotelschip’:* een passagiersschip waarop zich hutten bevinden voor overnachting van passagiers;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.11
    text: |-
      *‘snel schip’:* een schip met eigen mechanische middelen tot voortbeweging dat een snelheid ten opzichte van het
      water kan bereiken van meer dan 40 km/u;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.12
    text: |-
      *‘drijvend werktuig’:* een drijvend bouwsel waarop zich werkinstallaties bevinden, zoals kranen, baggermolens, hei-
      installaties of elevatoren;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.13
    text: |-
      *‘drijvende inrichting’* een drijvend bouwsel dat vanwege zijn bestemming in de regel niet wordt verplaatst, zoals
      een badinrichting, een dok, een steiger of een botenhuis;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.14
    text: |-
      *‘drijvend voorwerp’* een vlot, alsmede een ander voorwerp of samenstel van voorwerpen dat geschikt is gemaakt om
      te varen en dat geen schip, drijvend werktuig of drijvende inrichting is;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.15
    text: '*‘samenstel’:* een hecht samenstel of een sleep;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.16
    text: '*‘formatie’:* vorm van de samenstelling van een samenstel;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.17
    text: '*‘hecht samenstel’:* een duwstel of een gekoppeld samenstel;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.18
    text: |-
      *‘duwstel’:* een hecht samenstel van vaartuigen, waarvan er ten minste één is geplaatst vóór het vaartuig
      met motoraandrijving dat dient voor het voortbewegen van het samenstel, dan wel voor de beide vaartuigen met
      motoraandrijving die dienen voor het voortbewegen van het samenstel en die worden aangeduid als ‘duwboot’ of
      ‘duwboten’.Hieronder wordt ook verstaan een duwstel dat is samengesteld uit een duwend en een geduwd vaartuig
      waarvan de koppelingen een beheerst knikken mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.19
    text: |-
      *‘gekoppeld samenstel’:* een samenstel van langszijde van elkaar vastgemaakte vaartuigen, waarvan er geen is
      geplaatst vóór het vaartuig met motoraandrijving dat dient voor het voortbewegen van het samenstel;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.20
    text: |-
      *‘sleep’:* een samenstel van één of meer vaartuigen, drijvende inrichtingen of drijvende voorwerpen, dat wordt
      gesleept door één of meer tot het samenstel behorende vaartuigen met motoraandrijving;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.21
    text: '*‘lengte’ of ‘L’:* de grootste lengte van de scheepsromp in m, het roer en de boegspriet niet inbegrepen;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.22
    text: |-
      *‘breedte’ of ‘B’:* de grootste breedte van de scheepsromp in m, gemeten op de buitenkant van de huidbeplating
      (schoepraderen, schuurlijsten en dergelijke niet inbegrepen);
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.23
    text: |-
      *‘diepgang’ of ‘T’:* de verticale afstand in m tussen het laagste punt van de scheepsromp, zonder rekening te
      houden met de kiel of andere vaste onderdelen, en het vlak van de grootste inzinking van het schip;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.24
    text: |-
      *‘erkend classificatiebureau’:* een classificatiebureau dat is erkend door alle Rijnoeverstaten en België, te
      weten: DNV GL, Bureau Veritas (BV) en Lloyd’s Register (LR);
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
  - number: 1.01.25
    text: |-
      *‘ES-TRIN’:* [Europese standaard tot vaststelling van de technische voorschriften voor binnenschepen][ref1],
      in de editie 2017/1. Voor de toepassing van ESTRIN moet het begrip ‘lidstaat’ worden opgevat als een van de
      Rijnoeverstaten of België.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 1.02.1
    text: 'Dit reglement is van toepassing op de volgende vaartuigen:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.1.a)
    text: schepen met een lengte (*L*) van 20 m of meer;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.1.b)
    text: |-
      schepen waarvan het volume, berekend uit het product lengte (*L*), breedte (*B*) en diepgang (*T*), 100 m³ of meer
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.2
    text: 'Bovendien is dit reglement van toepassing op alle:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.2.a)
    text: |-
      sleep- en duwboten die zijn bestemd om de in het eerste lid bedoelde schepen of drijvende werktuigen te slepen, te
      duwen of langszijde gekoppeld mede te voeren;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.2.b)
    text: schepen die beschikken over een certificaat van goedkeuring als bedoeld in het ADN;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.2.c)
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.2.d)
    text: drijvende werktuigen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
  - number: 1.02.3
    text: |-
      Dit reglement is niet van toepassing op veerponten als bedoeld in het [Rijnvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: '1.03'
    text: |-
      Vaartuigen, drijvende inrichtingen of drijvend voorwerpen, waarvoor een certificaat van onderzoek opgesteld moet
      worden, moeten aan de bepalingen van dit reglement en aan de eisen van [ES-TRIN][ref1] voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: '1.04'
    text: |-
      Op de in [artikel 1.02, eerste en tweede lid][ref1], bedoelde vaartuigen moeten


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.04.a)
    text: |-
      een certificaat van onderzoek, dat door een Commissie van deskundigen, die door één der Rijnoeverstaten of België
      overeenkomstig de bepalingen van dit reglement is afgegeven, of
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.04
  - number: 1.04.b)
    text: |-
      een door de Centrale Commissie van de Rijnvaart als gelijkwaardig erkend certificaat aan boord aanwezig zijn. Het
      certificaat van onderzoek wordt opgesteld overeenkomstig het model dat in [bijlage 3, onderdeel I, van ES-TRIN]
      (onbekend) is opgenomen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.04
  - number: 1.05.1
    text: |-
      Op zeeschepen, waarop het Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (SOLAS 1974)
      dan wel het Internationaal Verdrag van 1966 betreffende de uitwatering van schepen van toepassing is, moet het
      betreffende geldige internationale document aan boord aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.05
  - number: 1.05.2
    text: |-
      Zeeschepen, waarop SOLAS 1974 dan wel het Internationaal verdrag betreffende de uitwatering van schepen niet van
      toepassing is, moeten voorzien zijn van de desbetreffende documenten en van de vrijboordmerken die volgens het
      recht van de vlaggenstaat zijn voorgeschreven en die wat betreft bouw, inrichting en uitrusting aan de eisen van de
      genoemde verdragen voldoen of een vergelijkbaar niveau van veiligheid op enigerlei andere wijze kunnen garanderen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.05
  - number: 1.05.3
    text: |-
      Op zeeschepen, waarop het Internationaal Verdrag van 1973 ter voorkoming van verontreiniging door schepen (MARPOL
      73) van toepassing is, moet een geldig internationaal document inzake de voorkoming van verontreiniging van de zee
      (IOPP document) aan boord aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.05
  - number: 1.05.4
    text: |-
      Op zeeschepen, waarop MARPOL 73 niet van toepassing is, moet een overeenkomstig document dat volgens het recht van
      de vlaggenstaat is voorgeschreven aan boordaanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.05
  - number: 1.05.5
    text: |-
      Op zeeschepen en drijvende werktuigen die zijn toegelaten om te worden gebruikt aan de kust of op zee moet het
      geldige certificaat als bedoeld in [bijlage 3, onderdeel IV, van ES-TRIN](onbekend) aan boord aanwezig zijn,
      indien het geldige certificaat van onderzoek als bedoeld in bijlage 3, onderdeel I, van ES-TRIN niet aan boord
      aanwezig is. Daarbij dient bij drijvende werktuigen aan [hoofdstuk 25 van ESTRIN][ref1] ook met inachtneming van
      [hoofdstuk 22 van ES-TRIN][ref2] te zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk25
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk22
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '25'
      - id: ref2
        bwb_id: BWBR0041395
        hoofdstuk: '22'
  - number: 1.06.1
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard met een geldigheidsduur van
      ten hoogste drie jaren vaststellen, wanneer het voor een aanpassing aan de technische ontwikkeling van de
      binnenscheepvaart noodzakelijk wordt geacht
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.06
  - number: 1.06.1.a)
    text: in dringende gevallen afwijkingen van dit reglement toe te laten, of
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.06
  - number: 1.06.1.b)
    text: |-
      proefnemingen waardoor de veiligheid en de vlotte afwikkeling van het scheepvaartverkeer niet worden benadeeld
      mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.06
  - number: 1.06.2
    text: |-
      Deze tijdelijke voorschriften worden in alle Rijnoeverstaten en België op hetzelfde tijdstip in werking gesteld en
      worden onder dezelfde voorwaarden buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.06
  - number: 1.07.1
    text: |-
      In het belang van een eenvoudige en uniforme toepassing van dit reglement kan de Centrale Commissie voor de
      Rijnvaart dienstinstructies voor de Commissies van deskundigen en de volgens dit reglement bevoegde autoriteiten
      vaststellen. De Commissies van deskundigen en de bevoegde autoriteiten worden van deze dienstinstructie in kennis
      gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.07
  - number: 1.07.2
    text: De Commissies van deskundigen en de bevoegde autoriteiten dienen zich aan deze dienstinstructie te houden.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.07
  - number: 1.07.3
    text: |-
      De instructies overeenkomstig [ES-TRIN][ref1] voor de toepassing van ES-TRIN gelden als dienstinstructies in de zin
      van het Reglement onderzoek schepen op de Rijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel1.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.01.1
    text: |-
      In bepaalde daarvoor in aanmerking komende havens zijn door de Rijnoeverstaten en België Commissies van deskundigen
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.2
    text: |-
      De Commissies van deskundigen bestaan uit een voorzitter en erkend deskundigen. Als erkend deskundigen maken van
      iedere Commissie van deskundigen ten minste deel uit:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.2.a)
    text: een personeelslid van het bevoegd gezag op het gebied van de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.2.b)
    text: een erkend deskundige op het gebied van de bouw van binnenschepen en hun machines;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.2.c)
    text: |-
      een erkend nautisch deskundige die in het bezit is van een binnenvaartschipperspatent dat het voeren van het schip
      dat onderzocht moet worden toestaat;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.2.d)
    text: bij het onderzoek van traditionele vaartuigen een erkend deskundige voor traditionele vaartuigen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.3
    text: |-
      De voorzitter en de erkend deskundigen van elke Commissie van deskundigen worden benoemd door de autoriteiten van
      de staat die de Commissie van deskundigen heeft ingesteld. De voorzitter en de erkend deskundigen dienen bij de
      aanvaarding van hun functie schriftelijk te verklaren dat zij deze in alle onpartijdigheid zullen vervullen. Van
      ambtenaren wordt een dergelijke verklaring niet geëist.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.4
    text: |-
      De Commissies van deskundigen kunnen zich onder de voorwaarden, zoals door elk der betrokken staten zullen worden
      vastgesteld, laten bijstaan door gespecialiseerde erkend deskundigen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.01.5
    text: |-
      De Centrale Commissie voor de Rijnvaart zorgt voor het bijhouden en het publiceren van een lijst van de Commissies
      van deskundigen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.01
  - number: 2.02.1
    text: |-
      De eigenaar van een vaartuig of zijn vertegenwoordiger die een onderzoek hiervan wenst, moet bij de Commissie
      van deskundigen van zijn keuze een aanvraag indienen volgens het model van [bijlage A][ref1]. De Commissie van
      deskundigen stelt vast welke bescheiden moeten worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 2.02.2
    text: |-
      De eigenaar van een vaartuig, waarop dit reglement niet van toepassing is, of zijn vertegenwoordiger, kan een
      certificaat van onderzoek aanvragen. Aan deze aanvraag dient gevolg te worden gegeven wanneer het vaartuig voldoet
      aan de bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.02
  - number: 2.03.1
    text: |-
      De eigenaar of zijn vertegenwoordiger moet het vaartuig leeg, schoongemaakt en met volledige uitrusting voor
      onderzoek aanbieden. Hij is verplicht bij het onderzoek de noodzakelijke hulp te verlenen, bijv. een geschikte boot
      met personeel ter beschikking te stellen, en die delen van de romp of van de installaties bloot te leggen, die niet
      direct toegankelijk of zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.03
  - number: 2.03.2
    text: |-
      De Commissie van deskundigen moet bij het eerste onderzoek het vaartuig op het droge bezichtigen. Bezichtiging
      op het droge kan achterwege blijven wanneer een klassecertificaat of een verklaring van een erkend
      classificatiebureau, volgens welke de bouw voldoet aan de daardoor gehanteerde voorschriften, wordt overgelegd.
      Bij periodieke of bijzondere onderzoeken kan de Commissie van deskundigen een bezichtiging op het droge
      verlangen. De Commissie van deskundigen moet bij het eerste onderzoek van vaartuig met eigen mechanische middelen
      en samenstellen, alsmede bij essentiële veranderingen in de voortstuwingsinstallatie of de stuurinrichting
      proefvaarten doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.03
  - number: 2.03.3
    text: |-
      De Commissie van deskundigen kan extra bezichtigingen en proefvaarten doen plaatsvinden en nadere bewijzen
      verlangen. Dit geldt tevens tijdens de bouw.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.03
  - number: 2.03.4
    text: |-
      Onverminderd het derde lid, moet de Commissie van deskundigen die uiteindelijk het certificaat van onderzoek
      moet afgeven, door de eigenaar of zijn vertegenwoordiger vóór het begin van de bouw (nieuwbouw of verlenging
      van een reeds in bedrijf zijnde vaartuig) van vaartuigen met een lengte L van meer dan 110 m met uitzondering
      van zeeschepen, hiervan op de hoogte worden gesteld. Deze Commissie van deskundigen voert tijdens de bouwperiode
      onderzoeken uit. Zij kan hiervan afzien wanneer vóór het begin van de bouw een verklaring van een erkend
      classificatiebureau wordt overgelegd waarin het verklaart dat het op de bouw toeziet.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.03
  - number: 2.04.1
    text: |-
      Wanneer de Commissie van deskundigen op grond van het onderzoek van een vaartuig vaststelt dat dit beantwoordt aan
      de bepalingen van dit reglement en de bepalingen van [ES-TRIN][ref1], geeft zij aan de aanvrager een certificaat
      van onderzoek volgens het model van [bijlage 3, onderdeel I, van ES-TRIN](onbekend) af.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.04.2
    text: |-
      De Commissie van deskundigen controleert bij afgifte van een certificaat van onderzoek of aan het desbetreffende
      vaartuig niet reeds een geldig certificaat is afgegeven, zoals bedoeld in [artikel 1.04][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.04.3
    text: |-
      Ingeval de Commissie van deskundigen weigert een certificaat van onderzoek af te geven, moet zij dit aan de
      aanvrager gemotiveerd schriftelijk mededelen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.04
  - number: 2.05.1
    text: 'De Commissie van deskundigen kan een voorlopig certificaat afgeven voor:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.1.a)
    text: |-
      vaartuigen die met toestemming van de Commissie van deskundigen naar een bepaalde plaats willen varen om een
      certificaat van onderzoek te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.1.b)
    text: |-
      vaartuigen waarvan het certificaat van onderzoek verloren, beschadigd of tijdelijk ingetrokken is, zoals bedoeld in
      de [artikelen 2.07][ref1] of [2.13, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.05.1.c)
    text: vaartuigen waarvan het certificaat van onderzoek na een inspectie met positief resultaat wordt voorbereid;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.1.d)
    text: vaartuigen die niet aan alle voorwaarden voor het verkrijgen van een certificaat van onderzoek voldoen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.1.e)
    text: |-
      vaartuigen die zodanige schade hebben geleden dat de staat waarin zij verkeren niet meer overeenstemt met hetgeen
      in het certificaat van onderzoek is gesteld;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.1.f)
    text: |-
      drijvende inrichtingen en drijvende voorwerpen, in het geval dat de voor de toepassing van
      [artikel 1.21, eerste lid, van het Rijnvaartpolitiereglement][ref1] bevoegde autoriteiten de vergunning voor een
      bijzonder transport afhankelijk stelt van het verkrijgen van een voorlopig certificaat van onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '1'
  - number: 2.05.1.g)
    text: |-
      vaartuigen waarvoor de Commissie van deskundigen een gelijkwaardigheid als bedoeld in
      [artikel 2.20, eerste tot derde lid][ref1], toestaat, voor de gevallen waarvoor de Centrale Commissie voor de
      Rijnvaart nog geen aanbeveling heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.05.2
    text: |-
      Het voorlopige certificaat van onderzoek wordt volgens het model van [bijlage 3, onderdeel II, van ES-TRIN]
      (onbekend) afgegeven, wanneer de deugdelijkheid van het vaartuig, de drijvende inrichting of het drijvende voorwerp
      voor de vaart voldoende gewaarborgd wordt geacht.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.3
    text: |-
      Het voorlopige certificaat van onderzoek moet de voorwaarden bevatten die door de Commissie van deskundigen nodig
      worden geacht en is geldig:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.3.a)
    text: |-
      in de in het eerste lid, onder a en d tot en met f, bedoelde gevallen voor één bepaalde reis, te maken binnen een
      redelijke termijn, die ten hoogste één maand mag zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.3.b)
    text: in de in het eerste lid, onder b en c, bedoelde gevallen gedurende een redelijke termijn;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.3.c)
    text: |-
      in de in het eerste lid, onder g, genoemde gevallen gedurende zes maanden. Deze termijn mag slechts worden verlengd
      met toestemming van de Centrale Commissie voor de Rijnvaart.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.05.4
    text: |-
      De bevoegde autoriteit stelt de Centrale Commissie voor de Rijnvaart binnen een maand na afgifte van het
      voorlopig certificaat overeenkomstig het eerste lid, onderdeel g, in kennis van de naam en het Europees
      scheepsidentificatienummer van het vaartuig, van de aard van de afwijking, alsmede van het land waarin het vaartuig
      is teboekgesteld of waarin zijn thuishaven is gelegen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.05
  - number: 2.06.1
    text: |-
      De geldigheidsduur van de volgens de bepalingen van dit reglement opgestelde certificaten van onderzoek bedraagt in
      geval van nieuwbouw:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.06
  - number: 2.06.1.a)
    text: 5 jaren voor passagiersschepen en snelle schepen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.06
  - number: 2.06.1.b)
    text: 10 jaren voor alle andere vaartuigen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.06
  - number: 2.06.2
    text: |-
      Voor vaartuigen die reeds voordat het onderzoek plaatsvindt in bedrijf waren, wordt de geldigheidsduur van het
      certificaat van onderzoek voor elk geval afzonderlijk, afhankelijk van de uitkomsten van het onderzoek, door de
      Commissie van deskundigen bepaald. Deze geldigheidsduur mag evenwel niet langer zijn dan bij het eerste lid is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.06
  - number: 2.07.1
    text: |-
      Elke verandering van naam, overgang van de eigendom, iedere hermeting van een vaartuig alsmede elke wijziging van
      de teboekstelling of van de thuishaven moet door de eigenaar of zijn vertegenwoordiger ter kennis worden gebracht
      van een Commissie van deskundigen. Hij moet daarbij tevens het certificaat van onderzoek aan deze Commissie ter
      wijziging voorleggen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.07
  - number: 2.07.2
    text: |-
      Alle aantekeningen in of wijzigingen van het certificaat van onderzoek, voorzien in dit reglement, in het
      [Rijnvaartpolitiereglement][ref1] en in andere, in gemeen overleg door de Rijnoeverstaten en België vastgestelde
      bepalingen, kunnen door iedere Commissie van deskundigen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.07
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 2.07.3
    text: |-
      Wanneer een Commissie van deskundigen in het certificaat een wijziging aanbrengt of daarin een aantekening stelt,
      moet zij daarvan kennisgeven aan de Commissie van deskundigen die het betrokken certificaat heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.07
  - number: 2.08.1
    text: |-
      Na iedere wezenlijke verandering of reparatie van een vaartuig die van invloed is op de hechtheid van de bouw,
      de vaar- of manoeuvreereigenschappen of op de kenmerkende eigenschappen moet het vaartuig, voor het weer in de
      vaart komt, aan een Commissie van deskundigen worden aangeboden, teneinde aan een bijzonder onderzoek te worden
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.08
  - number: 2.08.2
    text: |-
      De Commissie van deskundigen die het bijzonder onderzoek verricht, stelt, afhankelijk van de resultaten van dit
      onderzoek, de geldigheidsduur van het certificaat van onderzoek vast. Deze periode mag niet langer zijn dan de
      lopende geldigheidsduur van het certificaat van onderzoek. De geldigheidsduur wordt aangetekend in het certificaat
      van onderzoek en dient ter kennis te worden gebracht van de Commissie van deskundigen die het certificaat heeft
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.08
  - number: 2.09.1
    text: |-
      Vóór afloop van de geldigheidsduur van het certificaat van onderzoek moet het vaartuig aan een periodiek onderzoek
      worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.09
  - number: 2.09.2
    text: |-
      Bij wijze van uitzondering kan de Commissie van deskundigen op een met redenen omkleed verzoek van de eigenaar
      of zijn vertegenwoordiger de geldigheidsduur van het certificaat van onderzoek zonder periodiek onderzoek met ten
      hoogste één jaar verlengen. Deze verlenging wordt schriftelijk gegeven en moet zich aan boord van het vaartuig
      bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.09
  - number: 2.09.3
    text: |-
      De Commissie van deskundigen die het periodiek onderzoek verricht, stelt afhankelijk van de resultaten daarvan de
      nieuwe geldigheidsduur van het certificaat van onderzoek vast. Hierbij wordt [artikel 2.06][ref1] in acht genomen.
      De geldigheidsduur wordt aangetekend in het certificaat van onderzoek en dient ter kennis te worden gebracht van de
      Commissie van deskundigen die het certificaat heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.09.4
    text: |-
      Indien in plaats van verlenging van de geldigheidsduur het certificaat van onderzoek door een nieuw certificaat
      wordt vervangen, dient het oude certificaat van onderzoek te worden teruggezonden aan de Commissie van deskundigen
      die het heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.09
  - number: '2.10'
    text: |-
      De eigenaar van een vaartuig of zijn vertegenwoordiger kan op elk moment om een vrijwillig onderzoek verzoeken. Aan
      dit verzoek om een onderzoek dient gevolg te worden gegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.10
  - number: 2.11.1
    text: |-
      Wanneer een der bevoegde autoriteiten, belast met de zorg voor de veiligheid van de scheepvaart op de Rijn, van
      mening is dat een vaartuig gevaar kan opleveren voor de zich aan boord bevindende personen of voor de scheepvaart,
      kan zij gelasten dat het vaartuig door een Commissie van deskundigen wordt onderzocht.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.11
  - number: 2.11.2
    text: |-
      De eigenaar van het vaartuig draagt slechts dan de kosten van het onderzoek, wanneer de Commissie van deskundigen
      erkent dat de mening van de in het eerste lid bedoelde autoriteit gegrond is.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.11
  - number: 2.12.1
    text: |-
      De Commissie van deskundigen kan er geheel of gedeeltelijk van afzien te onderzoeken of een vaartuig voldoet aan
      de in [ES-TRIN][ref1] en in [hoofdstuk 8a][ref2] van dit reglement voorgeschreven bepalingen, voor zover uit een
      geldige verklaring, afgegeven door een erkend classificatiebureau, blijkt dat het vaartuig geheel of gedeeltelijk
      aan die bepalingen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk8A
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
      - id: ref2
        bwb_id: BWBR0025973
        hoofdstuk: 8A
  - number: 2.12.2
    text: |-
      Een verklaring van een erkend classificatiebureau, dan wel – voor zover dit volgens dit reglement voor bepaalde
      onderdelen van de uitrusting is toegelaten – van een technische dienst, mag door de bevoegde autoriteit slechts dan
      worden erkend, indien dat erkend classificatiebureau of die andere instantie verklaart dat het de bepalingen van de
      instructies van [ES-TRIN][ref1] in acht heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.12.3
    text: |-
      Voor de toepassing van [ES-TRIN][ref1] kunnen technische diensten niet gelegen in de Rijnoeverstaten, België of de
      lidstaten van de Europese Unie slechts op aanbeveling van de Centrale Commissie voor de Rijnvaart worden erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.13.1
    text: |-
      Wanneer de Commissie van deskundigen tijdens een onderzoek bemerkt dat een vaartuig of de uitrusting daarvan
      ernstige gebreken vertoont, en dat daardoor de veiligheid van de zich aan boord bevindende personen of
      de scheepvaart in gevaar wordt gebracht, dient het certificaat te worden ingehouden en dient de Commissie
      die het heeft afgegeven hiervan onverwijld in kennis te worden gesteld. Bij duwbakken dient ook de in
      [artikel 1.10, tweede lid, van het Rijnvaartpolitiereglement][ref1] voorgeschreven metalen plaat te worden
      ingehouden. Wanneer de Commissie van deskundigen heeft geconstateerd dat de gebreken zijn verholpen, wordt het
      certificaat aan de eigenaar of zijn vertegenwoordiger teruggegeven. Dit constateren en de teruggave van het
      certificaat kunnen op verzoek van de eigenaar of zijn vertegenwoordiger door tussenkomst van een andere Commissie
      geschieden. Wanneer de Commissie van deskundigen die het certificaat heeft ingehouden, vermoedt dat de gebreken
      niet binnen afzienbare tijd worden verholpen, wordt het certificaat gezonden aan de Commissie van deskundigen die
      het heeft afgegeven of het laatst heeft verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel1
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '1'
  - number: 2.13.2
    text: |-
      Wanneer een vaartuig definitief is opgelegd of gesloopt, moet de eigenaar het certificaat terugzenden aan de
      Commissie van deskundigen die het heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.13
  - number: 2.14.1
    text: |-
      Wanneer een certificaat van onderzoek verloren is gegaan, moet hiervan kennis worden gegeven aan de Commissie van
      deskundigen die het heeft afgegeven. Deze Commissie geeft dan een duplicaat van het certificaat van onderzoek af,
      dat als zodanig is gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.14
  - number: 2.14.2
    text: |-
      Wanneer een certificaat van onderzoek onleesbaar of om enige andere reden onbruikbaar is geworden, moet de
      eigenaar van het vaartuig of zijn vertegenwoordiger het certificaat van onderzoek terugzenden aan de Commissie van
      deskundigen die het heeft afgegeven; deze geeft dan een duplicaat af, overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.14
  - number: 2.15.1
    text: |-
      Onverminderd [artikel 2.11, tweede lid][ref1], draagt de eigenaar van een vaartuig of zijn vertegenwoordiger de
      kosten die voortvloeien uit het onderzoek en de afgifte van het certificaat van onderzoek, overeenkomstig het
      geldende tarief, dat door elk der Rijnoeverstaten en België wordt vastgesteld. Er mag hierbij geen onderscheid
      worden gemaakt uit hoofde van het land van teboekstelling van het vaartuig of de nationaliteit of woonplaats van
      de eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.15.2
    text: |-
      De Commissie van deskundigen kan vóór het onderzoek een voorschot verlangen dat niet hoger mag zijn dan het
      vermoedelijke bedrag van de kosten.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.15
  - number: '2.16'
    text: |-
      De Commissie van deskundigen kan personen, die kunnen aantonen daar om gegronde redenen belang bij te hebben,
      kennis laten nemen van de inhoud van het certificaat van onderzoek van een vaartuig, en op hun kosten als zodanig
      aangeduide uittreksels of gewaarmerkte afschriften van het certificaat verstrekken.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.16
  - number: 2.17.1
    text: |-
      De Commissies van deskundigen geven de door hen afgegeven certificaten een volgnummer. Zij houden een register bij
      van alle door hen afgegeven certificaten overeenkomstig [bijlage 3, onderdeel VI, van ES-TRIN](onbekend).
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.17
  - number: 2.17.2
    text: |-
      De Commissies van deskundigen bewaren de minuut of een afschrift van elk certificaat dat zij hebben afgegeven.
      Daarop tekenen zij alle aantekeningen en wijzigingen, alsmede ongeldigheidsverklaringen en vervangingen van de
      certificaten aan en actualiseren zij volgens het eerste lid de registratie dienovereenkomstig.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.17
  - number: 2.17.3
    text: |-
      Ter uitvoering van de bestuursrechtelijke maatregelen op het gebied van de scheepvaart en ter toepassing van de
      [artikelen 2.02 tot en met 2.15][ref1] wordt aan de bevoegde autoriteiten van de Rijnoeverstaten en België, van
      de lidstaten van de Europese Unie en, voor zover een gelijkwaardige gegevensbescherming is gewaarborgd, aan de
      bevoegde autoriteiten van derde landen op grond van bestuursrechtelijke overeenkomsten het recht tot inzage in de
      registratie zoals bedoeld in het eerste lid verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.18.1
    text: |-
      De Rijnoeverstaten en België zorgen ervoor dat ieder vaartuig overeenkomstig dit reglement en [ES-TRIN][ref1] een
      uniek Europees scheepsidentificatienummer (ENI-nummer) wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.18.2
    text: Ieder vaartuig heeft slechts één ENI-nummer dat gedurende zijn hele levensduur onveranderd blijft.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.18
  - number: 2.18.3
    text: Het ENI-nummer bestaat uit acht Arabische cijfers overeenkomstig [bijlage 1 van ESTRIN](onbekend).
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.18
  - number: 2.18.4
    text: |-
      De Commissie van deskundigen die het certificaat van onderzoek afgeeft voor een vaartuig, vult op dit certificaat
      het ENI-nummer in. Dit nummer wordt, voor zover het vaartuig op het moment van de afgifte van het certificaat
      van onderzoek nog niet over een ENI-nummer beschikt, door de bevoegde autoriteit van de staat waarin zijn plaats
      van teboekstelling of zijn thuishaven is gelegen, toegekend. Indien geen ENI-nummer kan worden toegekend aan een
      vaartuig in het land van zijn teboekstelling of van zijn thuishaven, wordt het ENI-nummer dat op het certificaat
      van onderzoek moet worden ingevuld, toegekend door de bevoegde autoriteit van de staat waarin de Commissie van
      deskundigen is gevestigd die dit certificaat afgeeft. Deze bepalingen zijn niet van toepassing op zeeschepen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.18
  - number: 2.18.5
    text: |-
      De eigenaar van het vaartuig of zijn vertegenwoordiger moet de toekenning van het ENI-nummer bij de bevoegde
      autoriteit aanvragen. Hij moet tevens het ENI-nummer, dat in het certificaat van onderzoek is ingevuld, daarop
      doen aanbrengen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.18
  - number: 2.18.6
    text: |-
      De Rijnoeverstaten en België brengen de namen en contactgegevens van de autoriteiten die bevoegd zijn tot het
      afgeven van een ENI-nummer evenals de wijziging van die gegevens ter kennis van het secretariaat van de Centrale
      Commissie. Het secretariaat van de Centrale Commissie voor Rijnvaart houdt een register bij van deze autoriteiten.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.18
  - number: 2.19.1
    text: |-
      De Rijnoeverstaten en België zorgen ervoor dat de bevoegde instanties voor ieder vaartuig waarvoor een certificaat
      van onderzoek werd aangevraagd of afgegeven onverwijld de volgende informatie krachtens Richtlijn (EU) 2016/1629 in
      de EHDB invoeren:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.1.a)
    text: de gegevens ter identificatie en beschrijving van het vaartuig overeenkomstig [bijlage 2 van ES-TRIN](onbekend);
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.1.b)
    text: |-
      de gegevens betreffende de afgegeven, vernieuwde, vervangen en ingetrokken certificaten van onderzoek, en
      betreffende de Commissie van deskundigen die het certificaat van onderzoek afgeeft;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.1.c)
    text: een digitale kopie van alle door de Commissies van deskundigen afgegeven certificaten;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.1.d)
    text: de gegevens over alle afgewezen of lopende aanvragen voor certificaten van onderzoek; en
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.1.e)
    text: alle veranderingen van de in de punten b tot en met d bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.2
    text: |-
      De in het eerste lid bedoelde gegevens kunnen worden verwerkt door de bevoegde instanties van de lidstaten van de
      Europese Unie, de Rijnoeverstaten en België en derde landen die zijn belast met taken in verband met de toepassing
      van Richtlijn (EU) 2016/1629 en van [Richtlijn 2005/44/EG](32005L0044) voor de volgende doeleinden:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.2.a)
    text: toepassen van Richtlijn (EU) 2016/1629 en van [Richtlijn 2005/44/EG](32005L0044);
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.2.b)
    text: waarborgen van binnenscheepvaart- en infrastructuurbeheer;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.2.c)
    text: vrijwaren of handhaven van de veiligheid van de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.2.d)
    text: verzamelen van statistische gegevens.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.3
    text: |-
      Elke verwerking van persoonsgegevens door de Rijnoeverstaten en België vindt plaats overeenkomstig het recht van de
      Europese Unie inzake de bescherming van persoonsgegevens, met name Verordening (EU) 2016/679.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.4
    text: |-
      De bevoegde autoriteit van een van de Rijnoeverstaten of van België kan persoonsgegevens overdragen aan een derde
      land of een internationale organisatie, mits die overdracht uitsluitend per geval plaatsvindt en aan de voorwaarden
      van Verordening (EU) 2016/679 en met name die opgenomen in hoofdstuk V, is voldaan. De Rijnoeverstaten en België
      waarborgen dat de overdracht noodzakelijk is voor de in het tweede lid bedoelde doeleinden. De Rijnoeverstaten en
      België waarborgen dat het derde land of de internationale organisatie de gegevens niet overdraagt aan een ander
      derde land of een andere internationale organisatie, tenzij dat land of die internationale organisatie hiervoor
      uitdrukkelijke schriftelijke toestemming heeft verkregen en voldoet aan de door de bevoegde instantie van de
      Rijnoeverstaten en België gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.19.5
    text: |-
      De bevoegde autoriteit zorgt ervoor dat de gegevens betreffende een vaartuig uit de in het eerste lid bedoelde
      databank worden gewist wanneer dit vaartuig wordt gesloopt.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.19
  - number: 2.20.1
    text: |-
      Wanneer in de bepalingen van [ES-TRIN][ref1] wordt bepaald dat op een vaartuig bepaalde materialen, inrichtingen of
      uitrustingsstukken moeten worden gebruikt of aan boord moeten zijn, of dat bepaalde bouwkundige maatregelen moeten
      worden getroffen of bepaalde opstellingen moeten worden aangehouden, kan de Commissie van deskundigen de toepassing
      of de aanwezigheid aan boord van dit vaartuig van andere materialen, inrichtingen of uitrustingsstukken toestaan,
      dan wel dat andere bouwkundige maatregelen worden getroffen of dat andere opstellingen worden aangehouden, mits
      deze op grond van aanbevelingen van de Centrale Commissie voor de Rijnvaart als gelijkwaardig zijn erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.20.2
    text: 'Indien de toepassing:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
  - number: 2.20.2.a)
    text: |-
      van de in [hoofdstuk 19 van ES-TRIN][ref1] genoemde bepalingen, die te maken hebben met het rekening houden met de
      bijzondere veiligheidsbehoeften van personen met beperkte mobiliteit, of


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk19
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '19'
  - number: 2.20.2.b)
    text: |-
      van de in [hoofdstuk 32 van ES-TRIN][ref1] genoemde bepalingen na afloop van de overgangsbepalingen in de praktijk
      moeilijk uitvoerbaar is of onevenredig hoge kosten met zich brengt, kan de Commissie van deskundigen op grond
      van aanbevelingen van de Centrale Commissie voor de Rijnvaart afwijkingen van deze voorschriften toestaan. Deze
      afwijkingen moeten in het certificaat van onderzoek worden aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk32
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '32'
  - number: 2.20.3
    text: |-
      Bij wijze van proef en voor een beperkte tijdsduur kan een Commissie van deskundigen op grond van een aanbeveling
      van de Centrale Commissie voor de Rijnvaart voor een vaartuig met nieuwe technische voorzieningen die afwijken
      van de technische voorschriften van [ES-TRIN][ref1] een certificaat van onderzoek afgeven, voor zover deze nieuwe
      voorzieningen een voldoende veiligheid bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.20.4
    text: |-
      De bevoegde autoriteiten informeren het secretariaat van de Centrale Commissie voor de Rijnvaart binnen één maand
      over de afgifte van een gelijkwaardigheid en afwijking.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
  - number: 2.20.5
    text: |-
      De in het eerste lid tot derde lid en zesde lid genoemde gelijkwaardigheden en afwijkingen dienen in het
      certificaat van onderzoek te worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
  - number: 2.20.6
    text: |-
      Op vaartuigen die worden omgebouwd tot schepen met een lengte van meer dan 110m mag de Commissie van deskundigen
      [hoofdstuk 32 van ES-TRIN][ref1] slechts toepassen op grond van bijzondere aanbevelingen van de Centrale Commissie
      voor de Rijnvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk32
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '32'
  - number: 2.21.1
    text: |-
      Voor bepaalde onderdelen en uitrustingen van de vaartuigen wordt het voldoen aan de vereisten vastgesteld met door
      de bevoegde autoriteiten afgegeven typegoedkeuringen. Deze onderdelen en uitrustingen, de vereisten alsmede de
      procedures voor de afgifte van de typegoedkeuringen zijn in [ES-TRIN][ref1] vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.21.2
    text: |-
      De bevoegde autoriteiten kennen aan elke typegoedkeuring een nummer toe. Dit nummer begint met de letter R. De
      voorschriften inzake de samenstelling van de typegoedkeuringsnummers en inzake de markering van de uitrustingen en
      onderdelen met deze nummers zijn in [ES-TRIN][ref1] vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 2.21.3
    text: |-
      De lidstaten stellen de Centrale Commissie voor de Rijnvaart in kennis van de door hen aangewezen bevoegde
      autoriteiten.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.4
    text: |-
      De bevoegde autoriteiten stellen de Centrale Commissie voor de Rijnvaart in kennis van de door hen op grond van
      typegoedkeuringen toegelaten uitrustingen en onderdelen alsmede van de door hen voor de inbouw of het vervangen van
      deze uitrustingen en onderdelen erkende gespecialiseerde bedrijven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.5
    text: 'De Centrale Commissie voor de Rijnvaart publiceert:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.5.a)
    text: |-
      de lijsten van de voor de afgifte van typegoedkeuringen bevoegde autoriteiten en de in dit kader erkende technische
      diensten;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.5.b)
    text: |-
      de lijsten van de krachtens de op grond van dit reglement afgegeven typegoedkeuringen en krachtens de als
      gelijkwaardig erkende typegoedkeuringen toegelaten onderdelen en uitrustingen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.5.c)
    text: |-
      de lijsten van de voor de inbouw of het vervangen van de toegelaten onderdelen en uitrustingen erkende
      gespecialiseerde bedrijven.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.6
    text: |-
      De typegoedkeuringen voor uitrustingen krachtens Richtlijn (EU) 2016/1629 zijn gelijkwaardig aan de eerdergenoemde
      typegoedkeuringen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.7
    text: Het tweede tot en met zesde lid gelden niet voor vast ingebouwde brandblusinstallaties
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
  - number: 2.21.8.1
    text: |-
      In afwijking van het eerste tot en met zesde lid is voor verbrandingsmotoren [hoofdstuk 8a][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk8A
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: 8A
  - number: 2.22.1
    text: De bevoegde autoriteit voor het toelaten van boorzuiveringsinstallaties  stuurt
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.22
  - number: 2.22.1.a)
    text: |-
      bij iedere wijziging aan de andere bevoegde autoriteiten een lijst van de boordzuiveringsinstallatietypes (met de
      overeenkomstig [bijlage 7, onderdeel V, van ES-TRIN](onbekend) vermelde gegevens), waarvan de goedkeuringen in de
      betrokken periode door haar zijn verleend, geweigerd of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.22
  - number: 2.22.1.b)
    text: op verzoek van een andere bevoegde autoriteit aan deze autoriteit
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.22
  - number: 2.22.1.b).aa)
    text: |-
      een kopie van het certificaat van typegoedkeuring van het boordzuiveringsinstallatietype, al dan niet met het
      informatiepakket, van ieder boordzuiveringsinstallatietype waarvoor zij een goedkeuring heeft verleend, geweigerd
      of ingetrokken, en zo nodig
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.22
  - number: 2.22.1.b).bb)
    text: |-
      de lijst van boordzuiveringsinstallaties die zijn vervaardigd in overeenstemming met de verleende
      typegoedkeuringen, omschreven in [artikel 18.05, derde lid, van ES-TRIN][ref1], met de gegevens bedoeld in [bijlage
      7, onderdeel VI, van ES-TRIN](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
  - number: 2.22.2
    text: |-
      Elke voor het toelaten bevoegde autoriteit zendt jaarlijks en bovendien bij ontvangst van een daartoe strekkend
      verzoek een kopie van het in [bijlage 7, onderdeel VII, van ESTRIN](onbekend) bedoelde gegevensformulier
      betreffende boordzuiveringsinstallatietypes die sinds de laatste kennisgeving zijn goedgekeurd aan het secretariaat
      van de Centrale Commissie voor de Rijnvaart. 1 Het onderhavige lid blijft tot 1 januari 2020 van kracht. Vanaf die
      datum zullen met betrekking tot de binnenschepen de voorschriften van Verordening (EU) 2016/1628 in werking treden.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.22
  - number: 2.22.3
    text: |-
      De bevoegde autoriteiten stellen elkaar binnen één maand in kennis van de intrekking van een typegoedkeuring en van
      de redenen daarvoor en stellen tegelijkertijd het secretariaat van de Centrale Commissie voor de Rijnvaart daarvan
      in kennis.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel2.22
  - number: 8a.01
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.1
    text: '*‘motor’:* een motor die werkt volgens het principe van de compressieontsteking (dieselmotor);'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.2
    text: |-
      *‘typegoedkeuring’:* de beslissing waardoor de bevoegde autoriteit verklaart dat een motortype, een motorfamilie of
      een motorgroep aan de technische voorschriften van dit hoofdstuk voldoet wat betreft het niveau van de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes uit de motor(en);
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.3
    text: |-
      *‘inbouwkeuring’:* de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een vaartuig
      ingebouwde motor, met inbegrip van eventuele na de typegoedkeuring aangebrachte wijzigingen en/of afstellingen,
      voldoet aan de technische voorschriften van dit hoofdstuk wat betreft het niveau van de uitstoot van schadelijke
      gassen en luchtverontreinigende deeltjes;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.4
    text: |-
      *‘tussentijdse keuring’:* de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een
      vaartuig in gebruik zijnde motor, met inbegrip van eventuele na de inbouwkeuring aangebrachte wijzigingen en/of
      afstellingen, voldoet aan de technische voorschriften van dit hoofdstuk wat betreft het niveau van de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.5
    text: |-
      *‘bijzondere keuring’:* de procedure waarbij door de bevoegde autoriteit wordt gewaarborgd dat de in een vaartuig
      in gebruik zijnde motor na iedere belangrijke wijziging nog aan de technische voorschriften van dit hoofdstuk
      voldoet wat betreft het niveau van de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.6
    text: |-
      *‘motortype’:* een groepering van motoren die met betrekking tot de essentiële motorkenmerken vermeld in
      [bijlage J][ref1], deel II, aanhangsel 1, niet verschillend zijn; er dient ten minste één eenheid van een motortype
      te zijn gebouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.01.7
    text: |-
      *‘motorfamilie’:* een door de fabrikant vastgestelde en door de bevoegde autoriteit type goedgekeurde groepering
      van motoren, die vanwege hun ontwerp naar verwachting vergelijkbare eigenschappen hebben wat betreft het niveau van
      de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes, en die aan de voorschriften van dit hoofdstuk
      voldoen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.8
    text: |-
      *‘motorgroep’:* een door de fabrikant vastgestelde en door de bevoegde autoriteit goedgekeurde groepering van
      motoren, die vanwege hun ontwerp naar verwachting vergelijkbare eigenschappen hebben wat betreft het niveau van de
      uitstoot van schadelijke gassen en luchtverontreinigende deeltjes, en die aan de voorschriften van dit hoofdstuk
      voldoen, waarbij een afstelling of een wijziging van afzonderlijke motoren na de typegoedkeuring toegelaten is
      binnen vastgelegde grenzen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.9
    text: |-
      *‘basismotor’:* een uit een motorfamilie of motorgroep geselecteerde motor die voldoet aan de voorschriften van
      [bijlage J][ref1], deel I, onderdeel 5;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.01.10
    text: '*‘nominaal vermogen’:* het netto vermogen van de motor bij nominaal toerental en volle belasting;'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.11
    text: |-
      *‘fabrikant’:* de persoon of organisatie die tegenover de bevoegde autoriteit verantwoordelijk is voor alle
      aspecten van de typegoedkeuringsprocedure en voor de conformiteit van de productie. Het is niet noodzakelijk dat
      deze persoon of organisatie rechtstreeks betrokken is bij alle fasen van de bouw van de motor. Indien de motor pas
      na zijn oorspronkelijke fabricage door veranderingen en aanvullingen wordt aangepast voor gebruik op een vaartuig
      in de zin van dit hoofdstuk, is de fabrikant normalerwijs de persoon of de organisatie die deze veranderingen of
      aanvullingen heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.12
    text: |-
      *‘inlichtingenformulier’:* het formulier, bedoeld in [bijlage J][ref1], deel II, waarin staat vermeld welke
      gegevens door de aanvrager moeten worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.01.13
    text: |-
      *‘informatiedossier’:* het geheel van gegevens, tekeningen, foto’s en andere bescheiden die de aanvrager
      overeenkomstig de eisen van het inlichtingenformulier aan de technische dienst of de bevoegde autoriteit moet
      verstrekken;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.14
    text: |-
      *‘informatiepakket’:* het informatiedossier plus alle testrapporten en andere documenten die de technische dienst
      of de bevoegde autoriteit tijdens de uitvoering van hun taken aan het informatiedossier hebben toegevoegd;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
  - number: 8a.01.15
    text: |-
      *‘certificaat van typegoedkeuring’:* het document, bedoeld in [bijlage J][ref1], deel III, waarin de bevoegde
      autoriteit de typegoedkeuring vaststelt;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.01.16
    text: |-
      *‘proces-verbaal van de motorkenmerken’:* het document, bedoeld in [bijlage J][ref1], deel VIII, waarin alle
      kenmerken van de motor, met inbegrip van de onderdelen (componenten) en afstellingen die een weerslag hebben op het
      niveau van de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes evenals alle veranderingen daarvan,
      vastgelegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.01.17
    text: |-
      *‘Inlichtingenformulier van de fabrikant ter controle van de componenten betrekking hebbend op de uitlaatgassen en
      de motorkenmerken’:* het document, bedoeld in [artikel 8a.11, derde lid][ref1], ten behoeve van inbouwkeuringen,
      tussentijdse keuringen dan wel bijzonder keuringen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8a.02.1
    text: |-
      Dit hoofdstuk is van toepassing op alle motoren met een nominaal vermogen (PN) gelijk aan of groter dan 19 kW, die
      geïnstalleerd zijn aan boord van vaartuigen of die ingebouwd zijn in zich aan boord bevindende werktuigen, voor
      zover ze niet vallen onder de desbetreffende reglementen of richtlijnen van de Europese Unie met betrekking tot
      de uitstoot van schadelijke gassen en luchtverontreinigende deeltjes. Indien de motoren voldoen aan de eisen van
      verordening (EU) 2016/1628, is dit hoofdstuk niet van toepassing. Indien de motoren voldoen aan de eisen van dit
      hoofdstuk, is [hoofdstuk 9 van ES-TRIN][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '9'
  - number: 8a.02.2
    text: |-
      De uitstoot van deze motoren van koolmonoxide (CO), koolwaterstoffen (HC), stikstofoxide (NOx) en van deeltjes (PT)
      mag, met betrekking tot het nominale toerental n, de volgende waarden niet overschrijden:









                    P
                    [kW]


                    CO
                    [g/kWh]


                    HC
                    [g/kWh]


                    NO
                    [g/kWh]


                    PT
                    [g/kWh]






                    19 ≤ P < 37


                    5,5


                    1,5


                    8,0


                    0,8




                    37 ≤ P < 75


                    5,0


                    1,3


                    7,0


                    0,4




                    75 ≤ P < 130


                    5,0


                    1,0


                    6,0


                    0,3




                    130 ≤ P < 560


                    3,5


                    1,0


                    6,0


                    0,2




                    P ≥ 560


                    3,5


                    1,0


                    n ≥ 3.150 min-1 = 6,0
                    n < 3.150 min-1 = 45 • n(-0,2) - 3
                    n < 343 min-1 = 11,0


                    0,2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
  - number: 8a.02.3
    text: |-
      Het voldoen aan de voorschriften, bedoeld in het tweede lid, wordt voor een motortype, een motorfamilie of een
      motorgroep vastgesteld door middel van een typegoedkeuring. De typegoedkeuring wordt vastgelegd in een certificaat
      van typegoedkeuring. De eigenaar of zijn gevolmachtigde moet een kopie van het certificaat van typegoedkeuring
      voegen bij de aanvraag van het onderzoek, bedoeld in [artikel 2.02][ref1]. Een kopie van het certificaat van
      typegoedkeuring en een kopie van het proces-verbaal van de motorkenmerken moeten zich aan boord bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.02.4.a)
    text: |-
      Na de inbouw van de motor aan boord, maar voor zijn ingebruikstelling, moet een inbouwkeuring worden uitgevoerd.
      Deze keuring, die deel uitmaakt van het eerste onderzoek van het vaartuig of van een bijzonder onderzoek naar
      aanleiding van de inbouw van de betreffende motor, leidt ofwel tot het inschrijven van de motor in het eerste af te
      geven certificaat van onderzoek ofwel tot een wijziging van het bestaande certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
  - number: 8a.02.4.b)
    text: |-
      De Commissie van deskundigen kan van een inbouwkeuring, bedoeld in onderdeel a), afzien indien een motor waarvan
      het nominale vermogen PN minder dan 130 kW bedraagt, wordt vervangen door een motor met eenzelfde typegoedkeuring.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
  - number: 8a.02.5
    text: |-
      Periodieke keuringen van de motor moeten worden uitgevoerd in het kader van het aanvullend onderzoek, bedoeld in
      [artikel 2.09][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel2
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.02.6
    text: |-
      Na elke belangrijke wijziging van een motor, die een invloed heeft op de uitstoot van schadelijke gassen en
      luchtverontreinigende deeltjes, moet altijd een bijzondere keuring plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
  - number: 8a.02.7
    text: |-
      De nummers van de typegoedkeuringen en de identificatienummers van alle aan boord van een vaartuig geïnstalleerde
      motoren, die onder de bepalingen van dit hoofdstuk vallen, moeten door de Commissie van deskundigen worden
      ingeschreven onder punt 52 van het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
  - number: 8a.02.8
    text: |-
      De bevoegde autoriteit kan zich voor de vervulling van taken, bedoeld in dit hoofdstuk, doen bijstaan door een
      technische dienst.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.02
  - number: 8a.03.1
    text: |-
      Een aanvraag van een typegoedkeuring van een motortype, een motorfamilie of een motorgroep moet door de fabrikant
      bij de bevoegde autoriteit worden ingediend. Bij de aanvraag moeten een informatiedossier, het ontwerp van een
      proces-verbaal van de motorkenmerken en het ontwerp van een inlichtingenformulier van de fabrikant ter controle
      van de componenten betrekking hebbend op de uitlaatgassen en de motorkenmerken worden gevoegd. De fabrikant moet
      voor de typekeuringen een motor, die voldoet aan de essentiële kenmerken vermeld in [bijlage J][ref1], deel II,
      aanhangsel 1, demonstreren.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.03.2
    text: |-
      Indien de bevoegde autoriteit, in het geval van een aanvraag van een typegoedkeuring van een motorfamilie of van
      een motorgroep, vaststelt dat de ingediende aanvraag met betrekking tot de geselecteerde basismotor voor de in
      [bijlage J][ref1], deel II, aanhangsel 2, beschreven motorfamilie of motorgroep niet representatief is, moet een
      andere, en eventueel een extra, basismotor, die door de bevoegde autoriteit wordt aangewezen, ten behoeve van de
      goedkeuring, bedoeld in het eerste lid, ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.03.3
    text: |-
      Een aanvraag van een typegoedkeuring voor een motortype, een motorfamilie of een motorgroep mag bij niet meer dan
      één bevoegde autoriteit worden ingediend. Voor ieder goed te keuren motortype, motorfamilie of motorgroep moet een
      afzonderlijke aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.03
  - number: 8a.04.1
    text: |-
      De bevoegde autoriteit, waarbij de aanvraag wordt ingediend, verleent de typegoedkeuring voor alle motortypes,
      motorfamilies of motorgroepen die overeenstemmen met de gegevens van de informatiedossiers en aan de voorschriften
      van dit hoofdstuk voldoen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
  - number: 8a.04.2
    text: |-
      De bevoegde autoriteit vult voor ieder motortype en iedere motorfamilie of motorgroep waarvoor zij goedkeuring
      verleent alle desbetreffende onderdelen van het certificaat van typegoedkeuring in, waarvan het model is opgenomen
      in [bijlage J][ref1], deel III; zij stelt de inhoudsopgave van het informatiepakket op of verifieert deze. De
      certificaten van typegoedkeuring moeten worden genummerd volgens het systeem aangegeven in bijlage J, deel IV. Het
      ingevulde certificaat van typegoedkeuring en de daarbij behorende bijlagen worden aan de aanvrager toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.04.3
    text: |-
      Indien de goed te keuren motor zijn functie slechts vervult of bijzondere kenmerken slechts vertoont in combinatie
      met andere onderdelen van het vaartuig waarin hij zal worden ingebouwd, en om die reden de naleving van één of
      meer eisen slechts kan worden geverifieerd wanneer de goed te keuren motor in combinatie met andere echte of
      gesimuleerde onderdelen van het vaartuig functioneert, moet de geldigheid van de typegoedkeuring van deze motor
      (motoren) dienovereenkomstig worden beperkt. In dergelijke gevallen moeten in het certificaat van typegoedkeuring
      van een motortype, van een motorfamilie of van een motorgroep de eventuele beperkingen in het gebruik alsmede
      eventuele voorwaarden waaraan bij montage moet worden voldaan, worden vermeld.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
  - number: 8a.04.4
    text: 'Elke bevoegde autoriteit zendt:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
  - number: 8a.04.4.a)
    text: |-
      bij iedere wijziging aan de andere bevoegde autoriteiten een lijst, die de in [bijlage J][ref1], deel V, vermelde
      gegevens bevat, van de goedkeuringen van de motortypes, de motorfamilies en de motorgroepen die zij in de betrokken
      periode heeft verleend, geweigerd of ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.04.4.b)
    text: op verzoek van een andere bevoegde autoriteit
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
  - number: 8a.04.4.b).aa)
    text: |-
      een kopie van het certificaat van typegoedkeuring van het motortype, de motorfamilie of de motorgroep al dan niet
      met het informatiepakket van ieder motortype en iedere motorfamilie of motorgroep waarvoor zij goedkeuring heeft
      verleend, geweigerd of ingetrokken, en zo nodig
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
  - number: 8a.04.4.b).bb)
    text: |-
      de lijst van de motoren die zijn geproduceerd in overeenstemming met de verleende typegoedkeuringen, omschreven in
      artikel 8a.06, derde lid, met de gegevens, bedoeld in [bijlage J][ref1], deel VI.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.04.5
    text: |-
      Elke bevoegde autoriteit zendt jaarlijks en bovendien bij ontvangst van een daartoe strekkend verzoek aan het
      secretariaat van de Centrale Commissie voor de Rijnvaart een kopie van het in [bijlage J][ref1], deel VII,
      bedoelde technische gegevensformulier betreffende de motortypes, motorfamilies en motorgroepen die sinds de laatste
      kennisgeving zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.05.1
    text: |-
      De bevoegde autoriteit, die de typegoedkeuring heeft verleend, moet de nodige maatregelen nemen om ervoor te zorgen
      dat zij in kennis wordt gesteld van iedere wijziging van de gegevens in het informatiepakket.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.05
  - number: 8a.05.2
    text: |-
      De aanvraag om wijziging of uitbreiding van een typegoedkeuring wordt uitsluitend ingediend bij de bevoegde
      autoriteit die de oorspronkelijke typegoedkeuring heeft verleend.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.05
  - number: 8a.05.3
    text: 'Indien in het informatiepakket vermelde gegevens worden gewijzigd, verstrekt de bevoegde autoriteit:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.05
  - number: 8a.05.3.a)
    text: |-
      indien nodig, de herziene bladzijden van het informatiepakket; op iedere herziene bladzijde moeten duidelijk de
      aard van de wijziging en de datum van de herziene versie zijn vermeld; bij iedere heruitgave van bladzijden moet
      ook de inhoudsopgave van het informatiepakket (dat bij het certificaat van typegoedkeuring is gevoegd) worden
      gewijzigd om deze in overeenstemming te brengen met de laatste stand van zaken;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.05
  - number: 8a.05.3.b)
    text: |-
      een herzien certificaat van typegoedkeuring (met een uitbreidingsnummer) indien de daarin voorkomende gegevens (met
      uitzondering van de bijlagen) zijn gewijzigd of indien de minimumeisen van dit hoofdstuk sinds de oorspronkelijke
      datum van de goedkeuring zijn veranderd; in dit herziene certificaat moeten duidelijk de reden voor de herziening
      en de datum van afgifte van de herziene versie worden vermeld.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.05
  - number: 8a.06.1
    text: |-
      De fabrikant brengt op iedere eenheid die conform de typegoedkeuring is geproduceerd de in [bijlage J][ref1], deel
      I, onderdeel 1, vastgestelde merktekens aan met inbegrip van het typegoedkeuringsnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.06.2
    text: |-
      Indien de typegoedkeuring overeenkomstig [artikel 8a.04, derde lid][ref1], beperkingen aan het gebruik bevat,
      moeten door de fabrikant bij iedere gefabriceerde eenheid gedetailleerde gegevens over deze beperkingen alsmede de
      volledige inbouwvoorschriften worden bijgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8a.06.3
    text: |-
      De fabrikant zendt op verzoek van de autoriteit die de typegoedkeuring heeft verleend binnen 45 dagen na het
      einde van ieder kalenderjaar, en onmiddellijk na ieder verder tijdstip dat door de autoriteit is vastgesteld,
      een lijst met de identificatienummers (serienummers) van alle motoren die conform de eisen van dit hoofdstuk zijn
      geproduceerd sinds de laatste lijst werd ingediend of sinds de datum waarop deze voorschriften voor het eerst van
      kracht werden. Indien het codesysteem van de motor daarover geen uitsluitsel geeft, moet deze lijst het verband
      aangeven tussen de identificatienummers en de daarbij behorende motortypes, de motorfamilies of de motorgroepen en
      de typegoedkeuringsnummers. Bovendien moet de lijst bijzondere gegevens bevatten indien de fabrikant niet langer
      een goedgekeurd motortype, een goedgekeurde motorfamilie of motorgroep produceert. Indien de bevoegde autoriteit
      niet verlangt dat deze lijst haar regelmatig wordt toegezonden, moet de fabrikant de geregistreerde gegevens
      gedurende ten minste 40 jaren bewaren.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.06
  - number: 8a.07.1
    text: |-
      Met gebruikmaking van de navolgende tabel gelden typegoedkeuringen overeenkomstig de Richtlijnen van de Europese
      Gemeenschap als gelijkwaardig aan de typegoedkeuringen overeenkomstig de voorwaarden en de bepalingen van dit
      hoofdstuk:







                    Doel van de motor


                    Richtlijn


                    Motorcategorie






                    Hoofdaandrijving van het schip


                    2004/26/EG


                    V




                    Hulpmotor met constant toerental


                    2004/26/EG


                    V




                    H, I, J, K




                    97/68/EG


                    D, E, F, G




                    Hulpmotor met variabel toerental en variabele belasting


                    2004/26/EG


                    V




                    H, I, J, K
                    L, M, N, P
                    Q, R
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.07
  - number: 8a.07.2
    text: |-
      De Centrale Commissie voor de Rijnvaart kan de gelijkwaardigheid erkennen van andere overeenstemmende normen
      vastgelegd in internationale regelingen, dan wel in voorschriften van de Rijnoeverstaten of België of van een derde
      land met de voorwaarden en de bepalingen van dit hoofdstuk inzake de typegoedkeuringen van motoren.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.07
  - number: 8a.08.1
    text: |-
      De bevoegde autoriteit die een typegoedkeuring verleent, zorgt ervoor dat de identificatienummers van de motoren
      die overeenkomstig de voorschriften van dit hoofdstuk zijn geproduceerd, zo nodig in samenwerking met de andere
      bevoegde autoriteiten, worden geregistreerd en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.08
  - number: 8a.08.2
    text: |-
      Een bijkomende controle van de identificatienummers kan plaats vinden bij gelegenheid van de controle van de
      conformiteit van de productie, bedoeld in [artikel 8a.09][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8a.08.3
    text: |-
      Met betrekking tot de controle van de identificatienummers verstrekken de fabrikant of zijn in de Rijnoeverstaten
      en België gevestigde agenten op verzoek van de bevoegde autoriteit onverwijld alle benodigde gegevens
      betreffende de cliënten alsook de identificatienummers van de motoren, waarvan is medegedeeld dat zij conform
      [artikel 8a.06, derde lid][ref1], zijn geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8a.08.4
    text: |-
      Indien een fabrikant, na een verzoek daartoe van de bevoegde autoriteit, niet in staat is de in artikel
      8a.06 bedoelde voorschriften na te komen, kan de goedkeuring voor het betreffende motortype of de betreffende
      motorfamilie of motorgroep worden ingetrokken. Daarvan wordt kennisgegeven volgens de procedure overeenkomstig
      [artikel 8a.10, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8a.09.1
    text: |-
      De bevoegde autoriteit, die een typegoedkeuring verleent, vergewist er zich van tevoren van, zo nodig in
      samenwerking met de andere bevoegde autoriteiten, dat de met betrekking tot [bijlage J][ref1], deel I, onderdeel
      4, passende voorzorgsmaatregelen zijn getroffen om een doeltreffende controle van de conformiteit van de productie
      te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.09.2
    text: |-
      De bevoegde autoriteit, die een typegoedkeuring heeft verleend, vergewist er zich van, zo nodig in samenwerking
      met de andere bevoegde autoriteiten, dat de [bijlage J][ref1], deel I, onderdeel 4 in het eerste lid bedoelde
      voorzorgsmaatregelen nog steeds afdoende zijn en elke geproduceerde motor die krachtens dit hoofdstuk van
      een typegoedkeuringsnummer is voorzien nog steeds beantwoordt aan de beschrijving die in het certificaat van
      typegoedkeuring, en de daarbij behorende bijlagen inzake het goedgekeurde motortype, de goedgekeurde motorfamilie
      of motorgroep is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8a.10.1
    text: |-
      Er is sprake van non-conformiteit met het goedgekeurde motortype, de goedgekeurde motorfamilie of de goedgekeurde
      motorgroep, indien er afwijkingen worden vastgesteld van de kenmerken in het certificaat van typegoedkeuring of
      eventueel in het informatiepakket, indien deze afwijkingen niet door de bevoegde autoriteit die de typegoedkeuring
      heeft verleend zijn toegestaan op grond van [artikel 8a.05, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8a.10.2
    text: |-
      Indien de bevoegde autoriteit, die een typegoedkeuring heeft verleend, vaststelt dat motoren, die van een
      certificaat van conformiteit of van een goedkeuringsmerk zijn voorzien, niet conform zijn met het motortype, de
      motorfamilie of de motorgroep waaraan zij de goedkeuring heeft verleend, neemt zij de nodige maatregelen om ervoor
      te zorgen dat de in productie zijnde motoren opnieuw in overeenstemming worden gebracht met het goedgekeurde
      motortype, de goedgekeurde motorfamilie of motorgroep. De bevoegde autoriteit, die de non-conformiteit heeft
      vastgesteld, stelt de andere bevoegde autoriteiten en het secretariaat van de Centrale Commissie voor de Rijnvaart
      in kennis van de genomen maatregelen, die kunnen leiden tot de intrekking van de typegoedkeuring.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.10
  - number: 8a.10.3
    text: |-
      Indien een bevoegde autoriteit kan aantonen dat motoren die van een typegoedkeuringsnummer zijn voorzien niet
      conform zijn met het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep, kan zij de bevoegde
      autoriteit die de typegoedkeuring heeft verleend verzoeken te controleren of de in productie zijnde motoren conform
      zijn met het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep. De hiertoe vereiste maatregelen
      moeten binnen zes maanden na de datum van het verzoek worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.10
  - number: 8a.10.4
    text: |-
      De bevoegde autoriteiten stellen elkaar in kennis van en informeren het secretariaat van de Centrale Commissie voor
      de Rijnvaart binnen één maand over de intrekking van een typegoedkeuring en van de redenen daarvoor.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.10
  - number: 8a.11.1
    text: |-
      Bij gelegenheid van de inbouwkeuring, bedoeld in [artikel 8a.02, vierde lid][ref1], van de tussentijdse keuring,
      bedoeld in artikel 8a.02, vijfde lid, en van de bijzondere keuring, bedoeld in artikel 8a.02, zesde lid, verifieert
      de bevoegde autoriteit de feitelijke toestand van de motor met betrekking tot de onderdelen, de ijking en de
      afstellingen van de parameters zoals die in het proces-verbaal van de motorkenmerken zijn gespecificeerd. Indien
      een bevoegde autoriteit vaststelt dat een motor niet conform is met het goedgekeurde motortype, de goedgekeurde
      motorfamilie of motorgroep, kan zij eisen dat de conformiteit van de motor wordt hersteld, dat de typegoedkeuring,
      bedoeld in [artikel 8a.05][ref2], dienovereenkomstig wordt gewijzigd of dat metingen van de werkelijke uitstoot
      worden uitgevoerd. Indien de conformiteit van de motor niet wordt hersteld of indien de typegoedkeuring
      niet dienovereenkomstig wordt aangepast of indien de uitgevoerde metingen aantonen dat de uitstoot niet in
      overeenstemming is met de toegelaten grenswaarden, bedoeld in artikel 8a.02, tweede lid, weigert de bevoegde
      autoriteit de afgifte van een certificaat van onderzoek of trekt zij een eerder afgegeven certificaat van onderzoek
      in.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.11
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
      - id: ref2
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8a.11.2
    text: |-
      Bij motoren die uitgerust zijn met een systeem voor nabehandeling van de uitlaatgassen moet de werking van het
      bedoelde systeem ter gelegenheid van de inbouwkeuring, de tussentijdse keuring of de bijzondere keuring worden
      getest.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.11
  - number: 8a.11.3
    text: |-
      Die keuringen als bedoeld in het eerste lid geschieden aan de hand van het inlichtingenformulier van de fabrikant
      ter controle van de componenten betrekking hebbend op de uitlaatgassen en de motorkenmerken. In dit formulier, dat
      door de fabrikant wordt opgesteld en dat door een bevoegde autoriteit moet worden goedgekeurd, worden de onderdelen
      die betrekking hebben op de uitlaatgassen alsmede de instellingen en kenmerken gespecificeerd, bij toepassing
      waarvan kan worden uitgegaan van een onafgebroken inachtneming van de grenswaarden van het uitlaatgas. Daarin wordt
      ten minste vermeld:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.11
  - number: 8a.11.3.a)
    text: |-
      vermelding van het motortype van de motorfamilie of van de motorgroep daarbij het nominale vermogen en het nominale
      toerental specificerend;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.11
  - number: 8a.11.3.b)
    text: een lijst van componenten betrekking hebbend op de uitlaatgassen en de motorkenmerken;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.11
  - number: 8a.11.3.c)
    text: |-
      niet te verwarren merktekens om de toegelaten componenten betrekking hebbend op de uitlaatgassen te identificeren
      (bijv. nummers van onderdelen die zich op de componenten bevinden);
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.11
  - number: 8a.11.3.d)
    text: |-
      vermelding van de motorkenmerken die betrekking hebben op de uitlaatgassen zoals instellingsmogelijkheden van het
      injectiemoment, van de toegelaten temperatuur van het koelwater en van de maximale tegendruk van het uitlaatgas.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.11
  - number: 8a.12.1
    text: |-
      De Rijnoeverstaten en België delen aan de Centrale Commissie voor de Rijnvaart de namen en de adressen van de
      bevoegde autoriteiten en technische diensten mede, die verantwoordelijk zijn voor de uitvoering van dit hoofdstuk.
      De technische diensten moeten aan de Europese norm (EN ISO/IEC 1702: 2005) voldoen, met inachtneming van de
      volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.12
  - number: 8a.12.1.a)
    text: de fabrikanten van motoren kunnen niet als technische dienst worden erkend;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.12
  - number: 8a.12.1.b)
    text: |-
      voor de toepassing van dit hoofdstuk mag een technische dienst met toestemming van de bevoegde autoriteit gebruik
      maken van inrichtingen buiten zijn eigen testinstelling.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.12
  - number: 8a.12.2
    text: |-
      Technische diensten niet gelegen in de Rijnoeverstaten, België of de lidstaten van de Europese Unie kunnen slechts
      op aanbeveling van de Centrale Commissie voor de Rijnvaart worden erkend.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.12
  - number: 8a.13.1
    text: De voorschriften van hoofdstuk 8a gelden niet
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.13
  - number: 8a.13.1.a)
    text: voor motoren die vóór 1.1.2003 aan boord ingebouwd waren, en
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.13
  - number: 8a.13.1.b)
    text: |-
      voor vervangingsmotoren*, die tot en met 31.12.2011 aan boord van schepen, die op 1.1.2002 in bedrijf waren,
      geïnstalleerd worden.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8a.13
  - number: 8a.13.2
    text: |-
      In afwijking van [8a.02, tweede lid][ref1], voor motoren die vóór 1.7.2007 aan boord ingebouwd waren, gelden de
      grenswaarden van de volgende tabel:









                    P
                    [kW]


                    CO
                    [g/kWh]


                    HC
                    [g/kWh]


                    NO
                    [g/kWh]


                    PT
                    [g/kWh]






                    19 ≤ P < 37


                    6,5


                    1,3


                    9,2


