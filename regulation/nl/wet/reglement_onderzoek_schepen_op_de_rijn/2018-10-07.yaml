  - number: 8b.01.1
    text: |-
      In dit hoofdstuk wordt verstaan onder ‘voortstuwings- en hulpsystemen’ elk systeem dat brandstof gebruikt, met
      inbegrip van:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.1.a)
    text: brandstoftanks en tankaansluitingen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.1.b)
    text: gasverwerkingssystemen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.1.c)
    text: leidingen en afsluiters;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.1.d)
    text: motoren en turbines;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.1.e)
    text: besturings-, bewakings- en veiligheidssystemen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.2
    text: |-
      In afwijking van de [artikelen 8.01, derde lid][ref1], en
      [artikel 8.05 eerste, zesde, negende, elfde en twaalfde lid][ref2] en de bepalingen van [hoofdstuk 8a][ref3] mogen
      voortstuwings- en hulpsystemen die brandstoffen gebruiken met een vlampunt van 55 °C of minder op een vaartuig
      worden geïnstalleerd, mits aan de in dit hoofdstuk en [bijlage T][ref4] vermelde eisen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk8A
      [ref4]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0025973
        hoofdstuk: 8A
      - id: ref4
        bwb_id: BWBR0025973
  - number: 8b.01.3
    text: |-
      Voortstuwings- en hulpsystemen als bedoeld in het tweede lid moeten onder toezicht van de Commissie van deskundigen
      worden gebouwd en geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.4
    text: |-
      Voor het verrichten van taken uit hoofde van dit hoofdstuk kan de Commissie van deskundigen een beroep doen op een
      technische dienst als bedoeld in [artikel 8b.07][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8b
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8b
        hoofdstuk: 8b
  - number: 8b.01.5
    text: |-
      Vóór de eerste ingebruikstelling van een voortstuwings- of hulpsysteem als bedoeld in het tweede lid moeten de
      volgende bescheiden aan de Commissie van deskundigen worden voorgelegd:
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.5.a)
    text: |-
      een risicobeoordeling overeenkomstig [bijlage T][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8b.01.5.b)
    text: een beschrijving van het voortstuwings- of hulpsysteem;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.5.c)
    text: bouwtekeningen van het voortstuwings- of hulpsysteem;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.5.d)
    text: een diagram van de druk en temperatuur in het systeem;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.5.e)
    text: een gebruiksaanwijzing met alle procedures voor het gebruik van het systeem in de praktijk;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.01.5.f)
    text: |-
      een veiligheidsrol overeenkomstig [artikel 8b.03][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8b
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8b
        hoofdstuk: 8b
  - number: 8b.01.5.g)
    text: |-
      een kopie van de verklaring van keuring als bedoeld in [artikel 8b.02, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8b
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8b
        hoofdstuk: 8b
  - number: 8b.01.6
    text: Er moet een kopie van de in het vijfde lid genoemde bescheiden aan boord voorhanden zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.01
  - number: 8b.02.1
    text: 'Voortstuwings- en hulpsystemen die brandstoffen gebruiken met een vlampunt van55 °C of minder moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.1.a)
    text: vóór de eerste ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.1.b)
    text: na een verandering of reparatie;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.1.c)
    text: met regelmaat en ten minste eenmaal per jaar;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.2
    text: 'De keuringen als bedoeld in het eerste lid, onderdeel a en c, moeten ten minste bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.2.a)
    text: |-
      controle op het overeenstemmen van het voortstuwings- en hulpsysteem met de goedgekeurde bouwtekeningen, en bij een
      hernieuwde test, of er veranderingen in het voortstuwings- of hulpsysteem hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.2.b)
    text: |-
      indien noodzakelijk, controle op de goede werking van het voortstuwings- en hulpsysteem met alle
      bedrijfsmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.2.c)
    text: |-
      visuele controle en controle op de dichtheid van alle onderdelen van het systeem, in het bijzonder kleppen,
      pijpleidingen, slangen, cilinders, pompen en filters;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.2.d)
    text: visuele controle van de elektrische en elektronische delen van de installatie;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.2.e)
    text: controle van de besturings-, bewakings- en veiligheidssystemen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.3
    text: |-
      De keuringen als bedoeld in het eerste lid, onderdeel b, moeten de desbetreffende aspecten van het tweede lid
      bevatten.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.02.4
    text: |-
      Bij elke keuring als bedoeld in het eerste lid, moet een verklaring worden opgesteld waaruit de datum van de
      keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.02
  - number: 8b.03.1
    text: |-
      Op vaartuigen uitgerust met voortstuwings- of hulpsystemen die worden aangedreven met brandstoffen met een vlampunt
      van 55 °C of minder moet een veiligheidsrol aanwezig zijn. De veiligheidsrol moet instructies als bedoeld in het
      tweede lid en een veiligheidsplan als bedoeld in het derde lid van het vaartuig bevatten.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2
    text: 'Deze veiligheidsinstructies moeten ten minste de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2.a)
    text: de noodstop van het systeem;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2.b)
    text: |-
      maatregelen in geval van onopzettelijk vrijkomen van vloeibare of gasvormige brandstof, bij voorbeeld bij het
      bunkeren;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2.c)
    text: maatregelen in geval van brand of andere incidenten aan boord;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2.d)
    text: maatregelen in geval van aanvaring;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2.e)
    text: gebruik van de veiligheidsuitrusting;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2.f)
    text: activering van de alarminstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.2.g)
    text: evacuatieprocedures.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3
    text: 'Het veiligheidsplan moet ten minste de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.a)
    text: gevaarlijke zones;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.b)
    text: vluchtwegen, nooduitgangen en gasdichte ruimten;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.c)
    text: reddingsmiddelen en bijboten;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.d)
    text: blustoestellen, brandblusinstallaties en sprinklerinstallaties;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.e)
    text: alarmsystemen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.f)
    text: bedieningsapparatuur van noodstopschakelaars;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.g)
    text: brandkleppen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.h)
    text: noodstroominstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.i)
    text: schakelaars van ventilatiesystemen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.j)
    text: bedieningsapparatuur voor brandstoftoevoerleidingen;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.3.k)
    text: veiligheidsuitrusting.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.4
    text: 'De veiligheidsrol moet:'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.4.a)
    text: door de Commissie van deskundigen zijn gewaarmerkt, en;
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.03.4.b)
    text: duidelijk zichtbaar op één of meer daarvoor geëigende plaatsen aan boord zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.03
  - number: 8b.04.1
    text: |-
      De emissies van motoren of turbines mogen de in [artikel 8a.02][ref1] genoemde toepasselijke grenswaarden niet
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8a
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8a
        hoofdstuk: 8A
  - number: 8b.04.2
    text: |-
      Indien voor voortstuwings- en hulpsystemen aardgas als brandstof wordt gebruikt, gelden de waarden voor de
      koolwaterstoffen, niet voor methaan (CH4).
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.04
  - number: 8b.04.3
    text: |-
      Om aan te tonen dat aan het eerste lid wordt voldaan, moet bij de Commissie van deskundigen een rapport worden
      ingediend over de overeenkomstig de internationale ISO-standaard 8178-1: 2006 uitgevoerde proefbankmetingen van
      gas- en deeltjesemissies.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.04
  - number: 8b.04.4
    text: |-
      Er moeten geëigende maatregelen worden getroffen om de emissies van broeikasgassen tot een minimum te beperken. De
      maatregelen moeten in de documenten als bedoeld in [artikel 8b.01, vijfde lid, onderdeel b][ref1], worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8b
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8b
        hoofdstuk: 8b
  - number: 8b.05
    text: |-
      Bedrijfsruimten en systeemonderdelen moeten dusdanig gekenmerkt zijn dat duidelijk is voor welke brandstoffen zij
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.05
  - number: 8b.06
    text: |-
      In geval van een automatische uitschakeling van het voortstuwingssysteem of delen daarvan, moet het vaartuig op
      eigen kracht kunnen blijven voortbewegen.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.06
  - number: 8b.07.1
    text: 'De technische diensten moeten voldoen aan de Europese norm EN ISO 17020: 2012.'
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.07
  - number: 8b.07.2
    text: |-
      De fabrikanten en leveranciers van voortstuwings- en hulpsystemen of van delen van een dergelijke installatie
      kunnen niet als technische dienst worden erkend.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.07
  - number: 8b.07.3
    text: |-
      De technische dienst moet beschikken over de kennis van zaken die nodig is op grond van de in [bijlage T][ref1]
      genoemde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: 8b.07.4
    text: |-
      De controles en tests als bedoeld in [artikel 8b.01][ref1] en [8b.02][ref2] mogen door verschillende technische
      diensten worden verricht, op voorwaarde dat de in het derde lid bedoelde kennis hierbij voorhanden is.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel8b
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: 8b
        hoofdstuk: 8b
      - id: ref2
        bwb_id: BWBR0025973
        artikel: 8b
        hoofdstuk: 8b
  - number: 8b.07.5
    text: |-
      Buiten de Rijnoeverstaten en België gevestigde technische diensten kunnen slechts op aanbeveling van de Centrale
      Commissie voor de Rijnvaart worden erkend.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.07
  - number: 8b.07.6
    text: |-
      De Rijnoeverstaten en België delen het secretariaat van de Centrale Commissie voor de Rijnvaart de namen en
      adressen van de Commissies van deskundigen en technische diensten mee die verantwoordelijk zijn voor het verrichten
      van de in dit hoofdstuk beschreven taken. Het secretariaat publiceert deze gegevens op de website van de Centrale
      Commissie voor de Rijnvaart.
    url: https://wetten.overheid.nl/BWBR0025973/2018-10-07#Artikel8b.07
