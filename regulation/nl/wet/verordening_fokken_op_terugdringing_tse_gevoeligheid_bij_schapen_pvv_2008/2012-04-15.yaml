preamble:
  text: |-
    Gelet op de artikelen 17, 22, 55 en 108 van de Gezondheids- en welzijnswet voor dieren, artikel 99 van de Regeling
    preventie, bestrijding en monitoring van besmettelijke dierziekten en zoönosen en TSE’s (Stcrt. 2005, 120), als
    gewijzigd bij de Regeling van de Minister van Landbouw, Natuur en Voedselkwaliteit, TRCJZ/2008/1342, houdende
    wijziging van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten zoönosen en TSE’s in
    verband met vorderen medebewind PVV, de artikelen 13, 15 en 23 van de Landbouwwet en de artikelen 96, 97, 98, 100,
    derde lid, en 104 van de Wet op de bedrijfsorganisatie;

    Gelet op Verordening (EG) nr. 999/2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en
    uitroeiing van bepaalde overdraagbare spongiforme encephalopathieën (Pb L 147);

    Gelet op de Beschikking van de Commissie van 30 november 2007 tot goedkeuring van de door de lidstaten voor 2008
    en volgende jaren ingediende nationale jaarlijkse en meerjarenprogramma's en van de financiële bijdrage van de
    Gemeenschap voor de uitroeiing, bestrijding en bewaking van bepaalde dierziekten en zoönosen (Pb L 314);

    Gelet op de Beschikking van de raad van 26 juni 1990 betreffende bepaalde uitgaven op veterinair gebied (Pb L 224);

    Gezien Verordening (EG) nr. 70/2001 van de Commissie 12 januari 2001 betreffende de toepassing van de artikelen 87
    en 88 van het EG-Verdrag op staatssteun van kleine en middelgrote ondernemingen (Pb L 10);

    Gezien Verordening (EG) nr. 1857/2006 van de Commissie van 15 december 2006 betreffende de toepassing van de
    artikelen 87 en 88 van het EG-Verdrag op staatssteun van kleine en middelgrote ondernemingen die landbouwproducten
    produceren, en tot wijziging van verordening (EG) nr. 70/2001.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze verordening wordt verstaan onder:









                    a.


                    productschap:


                    het Productschap Vee en Vlees;




                    b.


                    bestuur:


                    het bestuur van het productschap;




                    c.


                    voorzitter:


                    de voorzitter van het productschap;




                    d.


                    [Verordening (EG) nr. 999/2001](32001R0999):


                    [Verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement en de Raad van 22 mei 2001
      houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare
      spongiforme encephalopathieën (Pb L 147);




                    e.


                    Beschikking 2007/782/EG:


                    Beschikking van de Commissie van 30 november 2007 tot goedkeuring van de door de lidstaten voor 2008
      en volgende jaren ingediende nationale jaarlijkse en meerjarenprogramma’s en van de financiële bijdrage van de
      Gemeenschap voor de uitroeiing, bestrijding en bewaking van bepaalde dierziekten en zoönosen (Pb L 314);




                    f.


                    fokprogramma:


                    het fokprogramma als bedoeld in [Verordening (EG) nr. 999/2001](32001R0999), in het bijzonder artikel
      6 bis;




                    g.


                    erkende instelling:


                    een krachtens het [Fokkerijbesluit][ref1] (Stb. 1994, 696) erkende organisatie die één of meer
      stamboeken of registers van schapen bijhoudt;




                    h.


                    fokkerijvereniging:


                    een groep houders van schapen, niet aangesloten bij een erkende instelling, verenigd in een
      organisatie met rechtspersoonlijkheid en die zich ten minste ten doel stelt het fokken gericht op het terugdringen
      van de TSE-gevoeligheid bij schapen;




                    i.


                    deelnemer:


                    een houder van schapen die participeert in een erkend fokprogramma;




                    j.


                    erkend laboratorium:


                    een laboratorium dat is erkend op grond van de Regeling erkenning en aanwijzing veterinaire
      laboratoria (houdende een erkenningensystematiek en aanwijzing van laboratoria op veterinair terrein) (Stcrt. 2006,
      37);




                    k.


                    genotyperingstest:


                    een bij een erkend laboratorium uitgevoerde analyse van bloed- of weefselmonsters ter bepaling van de
      aminozuren op, in ieder geval, de codons 136, 154, en 171 van het PrP gen van beide allelen;




                    l.


                    bedrijfscertificaat:


                    een certificaat ter bevestiging van een erkende TSE-resistente status van bepaalde koppels schapen,
      als bedoeld in bijlage VII, Hoofdstuk B, Deel 3, onder 1, [Verordening (EG) nr. 999/2001](32001R0999).




                    m.


                    Richtlijn 2009/470/EG:


                    Richtlijn van de Raad van 25 mei 2009 betreffende bepaalde uitgaven op veterinair gebied (PB L 155)






      2 De Gezondheidsdienst voor Dieren b.v., gevestigd te Deventer, wordt voor de toepassing van de
      [artikelen 16][ref2] en [17][ref3] gelijkgesteld aan een erkend laboratorium, zoals bedoeld in het eerste lid,
      onder j..


