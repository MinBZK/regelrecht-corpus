        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0024314
        artikel: '17'
        paragraaf: '5'
  - number: '17'
    text: |-
      1 De tegemoetkoming bedraagt de door het erkende laboratorium voor de genotyperingstest in rekening gebrachte
      kosten, met een maximum van het jaarlijks op grond van artikel 27, vijfde lid, onder b), van Richtlijn 2009/470/EG
      vastgestelde bedrag.

      2 Het subsidieplafond wordt door het bestuur bij besluit vastgesteld telkens na de jaarlijkse vaststelling van
      de financiële bijdrage van de Gemeenschap op grond van artikel 24, vijfde lid, van Beschikking 90/424/EEG van de
      Raad van 26 juni 1990 betreffende uitgaven op veterinair gebied. Indien de hoogte van de financiële bijdrage van
      de Commissie wordt gewijzigd, kan het bestuur bij besluit het eerder vastgestelde subsidieplafond wijzigen. De
      hiervoor bedoelde besluiten worden gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.

      3 De tegemoetkoming wordt op volgorde van aanvraag verstrekt tot het plafond, als bedoeld in het tweede lid, is
      bereikt.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel17
  - number: '18'
    text: |-
      1 De tegemoetkoming wordt door de voorzitter ingetrokken indien niet wordt voldaan aan het bepaalde in
      [artikel 16][ref1].

      2 Indien de tegemoetkoming door de voorzitter wordt ingetrokken of ten nadele van de deelnemer wordt gewijzigd
      overeenkomstig [artikel 4:48][ref2] onderscheidenlijk [4:49 van de Algemene wet bestuursrecht][ref3], kunnen de
      verstrekte bedragen overeenkomstig [artikel 4:57 van de Algemene wet bestuursrecht ][ref4]worden teruggevorderd
      en vermeerderd met de wettelijke rente over de periode vanaf de eerste uitbetaling tot aan het moment van algehele
      voldoening.

      3 De te betalen rente is de wettelijke rente zoals deze geldt op de laatste dag van de maand waarin de betaling van
      de tegemoetkoming heeft plaatsgevonden.

      4 Geen wettelijke rente is verschuldigd indien de oorzaak van het onverschuldigd betalen bij de voorzitter is
      gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel448
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel18
