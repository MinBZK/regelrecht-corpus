  - number: '2'
    text: |-
      1 Aan een erkende instelling en een fokkerijvereniging kan op aanvraag erkenning worden verleend van een door
      die erkende instelling of fokkerijvereniging opgesteld fokprogramma, gericht op het terugdringen van de TSE-
      gevoeligheid bij schapen.

      2 De erkenning, als bedoeld in het eerste lid, wordt verleend indien wordt voldaan aan:

      a. de eisen, gesteld in bijlage VII, hoofdstuk B, deel 1 en deel 2, bij [Verordening (EG) nr. 999/2001]
      (32001R0999), en,

      b. de eisen daaraan gesteld bij deze verordening.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel2
  - number: '3'
    text: |-
      1 Aan deelnemers kan op aanvraag erkenning worden verleend van de TSE-resistente status van bepaalde koppels
      schapen, als bedoeld in bijlage VII, hoofdstuk B, Deel 3, van [Verordening (EG) nr. 999/2001](32001R0999).

      2 De erkenning, als bedoeld in het eerste lid, wordt verleend indien wordt voldaan aan:

      a. de eisen, gesteld in bijlage VII, hoofdstuk B, deel 3 van [Verordening (EG) nr. 999/2001](32001R0999), en,

      b. de eisen daaraan gesteld bij deze verordening.

      3 Aan deelnemers, aan wie de in het eerste lid bedoelde erkenning is verleend, kan op aanvraag een
      bedrijfscertificaat worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel3
  - number: '4'
    text: |-
      Deelnemers kunnen op voet van de [artikelen 16][ref1] en [17][ref2] een tegemoetkoming krijgen in de kosten van
      genotyperingstesten, uitgevoerd in het kader van een erkend fokprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024314#Artikel17
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel4
    references:
      - id: ref1
