  - number: '19'
    text: |-
      1 De voorzitter kan besluiten dat afwijking van het bepaalde in Bijlage VII, Hoofdstuk B, Deel 2, onder 2,
      c) en d), van [Verordening (EG) nr. 999/2001](32001R0999) wordt toegestaan, indien de erkende instelling of
      fokkerijvereniging ten genoegen van de voorzitter aantoont dat de afwijking noodzakelijk is voor de bescherming van
      het ras of productiekenmerken.

      2 Aan een toegestane afwijking, als bedoeld in het eerste lid, kunnen voorschriften of voorwaarden worden
      verbonden. De toegestane afwijking kan onder beperkingen worden verleend.

      3 De toegestane afwijking kan te allen tijde door de voorzitter worden ingetrokken.

      4 Een toegestane afwijking wordt opgenomen in de overeenkomst, als bedoeld in [artikel 9][ref1].


