  - number: '15'
    text: |-
      De erkenning kan worden verleend voor de volgende typen bedrijven van deelnemers:









                  a.


                  Niveau I:


                  alle schapen op het bedrijf van de deelnemer hebben genotype ARR/ARR;




                  b.


                  Niveau II:


                  alle voor de fok of vermeerdering gebruikte rammen op het bedrijf van de deelnemer hebben genotype
      ARR/ARR;




                  c.


                  Niveau III:


                  op het bedrijf van de deelnemer zijn geen schapen aanwezig met een VRQ-allel;




                  d.


                  Niveau IV:


                  op het bedrijf van de deelnemer worden voor de fok of vermeerdering geen rammen gebruikt met een VRQ-
      allel.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel15
  - number: 15a
    text: |-
      1 Voor de verlening van de erkenning, als bedoeld in [artikel 3, eerste lid][ref1], en het bedrijfscertificaat, als
      bedoeld in artikel 3, derde lid, is een vergoeding verschuldigd.

      2 De hoogte van de vergoeding voor de erkenning en het bedrijfscertificaat wordt bij besluit van de voorzitter
      vastgesteld. Het besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.

      3 De erkenning wordt niet eerder verleend en het bedrijfscertificaat wordt niet eerder in handen gesteld van de
      aanvrager dan nadat de vergoeding aan de verlenende of uitgevende organisatie of instelling is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel3
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0024314
        artikel: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      1 De tegemoetkoming, als bedoeld in [artikel 4][ref1], wordt door de voorzitter overeenkomstig het bepaalde in de
      leden 2 tot en met 4, en [artikel 17][ref2] vastgesteld.

      2 Deelnemers ontvangen de tegemoetkoming op aanvraag, in de vorm van een korting op de kosten die het erkende
      laboratorium aan de deelnemer in rekening brengt terzake van de voor de deelnemer uitgevoerde genotyperingstest. De
      hoogte van de korting is gelijk aan de hoogte van de volgens [artikel 17][ref3] toe te kennen tegemoetkoming. Het
      erkende laboratorium vermeldt het in mindering gebrachte bedrag gespecificeerd op de factuur.

      3 Als aanvraag, bedoeld in het tweede lid, wordt aangemerkt de bij een erkend laboratorium ingediende aanvraag voor
      een genotyperingstest, voorzien van de schriftelijke verklaring van de deelnemer dat het een in het kader van een
      erkend fokprogramma uit te voeren genotyperingstest betreft.

      4 De in het tweede lid bedoelde aanvraag, terzake van een in een bepaald jaar uitgevoerde genotyperingstest, is
      uiterlijk op 15 januari van het daaropvolgende jaar ingediend.

      5 Ten behoeve van de uitvoering van het bepaalde in het derde lid, kan het bestuur een overeenkomst sluiten met de
      erkende laboratoria.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024314#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0024314#Artikel17
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel16
    references:
      - id: ref1
