  - number: '5'
    text: |-
      1 De erkenning, bedoeld in [artikel 2, eerste lid][ref1], wordt verleend door de voorzitter.

      2 Aan een erkenning kunnen nadere voorschriften of voorwaarden worden verbonden. Een erkenning kan onder
      beperkingen worden verleend.

      3 De in het eerste lid bedoelde erkenning wordt door de voorzitter ingetrokken indien blijkt dat niet langer aan de
      voorschriften of voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel2
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024314
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De erkende instelling of fokkerijvereniging draagt er zorg voor dat zij een gegevensbank, als bedoeld in
      bijlage VII, hoofdstuk B, deel 1, onder 2, van [Verordening (EG) nr. 999/2001](32001R0999), ter beschikking heeft,
      waarin de schapen van deelnemers op individueel niveau en per bedrijf geregistreerd zijn en waarin mutaties in de
      schapenstapel actueel en volledig worden bijgehouden.

      2 In de in het eerste lid bedoelde gegevensbank worden ten minste de gegevens opgenomen, als opgenomen in bijlage
      VII, hoofdstuk B, deel 1, onder 2, van [Verordening (EG) nr. 999/2001](32001R0999).
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel6
  - number: '7'
    text: |-
      1 De erkende instelling of fokkerijvereniging draagt zorg voor een uniform certificatiesysteem, als bedoeld in
      bijlage VII, hoofdstuk B, deel 1, onder 3, van [Verordening (EG) nr. 999/2001](32001R0999).

      2 De erkende instelling of fokkerijvereniging zorgt ervoor dat het certificatiesyteem tevens de datum van
      certificering en, indien het genotype is gebaseerd op een genotyperingstest, de naam van het laboratorium dat
      de genotyperingstest heeft uitgevoerd, bevat. De gegevens uit het certificatiesysteem worden desgevraagd aan het
      productschap verstrekt.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel7
  - number: '8'
    text: |-
      De genotypering van bloed en andere ten behoeve van het fokprogramma verzamelde weefsels, als bedoeld in bijlage
      VII, hoofdstuk B, deel 1, onder 5, van [Verordening (EG) nr. 999/2001](32001R0999), wordt verricht door een erkend
      laboratorium.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel8
  - number: '9'
    text: |-
      Deelnemers hebben met een erkende instelling of fokkerijvereniging een overeenkomst gesloten, die minimaal de
      eisen, als opgenomen in bijlage VII, hoofdstuk B, deel 2, onder 2, van [Verordening (EG) nr. 999/2001](32001R0999),
      bevat.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel9
  - number: '10'
    text: |-
      Een erkende instelling of fokkerijvereniging rapporteert jaarlijks vóór 1 februari aan de voorzitter over:

      a. de resultaten van de genotyperingen, onderscheiden naar geslacht (ooi of ram) en leeftijd (< 1 jaar of > 1
      jaar);

      b. de resultaten van de steekproeven, als bedoeld in Bijlage VII, hoofdstuk B, deel 1, onder 4, van [Verordening
      (EG) nr. 999/2001](32001R0999) ;

      c. het aantal bij de erkende instelling of fokkerijvereniging aangesloten deelnemers.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel10
  - number: '11'
    text: |-
      1 De aanvraag voor erkenning van een fokprogramma, als bedoeld in [artikel 2][ref1], wordt ingediend bij de
      voorzitter en gaat vergezeld van ten minste de volgende gegevens:

      a. de naam van de erkende instelling of fokkerijvereniging;

      b. het ras van de schapen;

      c. per ras het aantal in het stamboek van de erkende instelling geregistreerde schapen, dan wel de bij de
      fokkerijvereniging ingeschreven schapen, opgesplitst naar rammen en ooien;

      d. het fokprogramma waarvan de erkende instelling of fokkerijvereniging erkenning aanvraagt.

      2 Het bestuur stelt bij besluit ten behoeve van de aanvraag een model formulier met toelichting vast.

      3 Het in het tweede lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel2
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024314
        artikel: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 De aanvraag wordt zo spoedig mogelijk, maar uiterlijk op 31 mei van het betreffende jaar ingediend bij de
      voorzitter.

      2 Voor het jaar 2008 geldt dat de in het eerste lid bedoelde periode is verlengd tot en met 31 juli 2008.

      3 De voorzitter bevestigt de ontvangst van de aanvraag schriftelijk.
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel12
  - number: '13'
    text: |-
      1 De erkenning, als bedoeld in [artikel 3][ref1], wordt op aanvraag door het bestuur verleend. Hiertoe
      gemandateerde instellingen dragen namens het bestuur zorg voor de verlening van de erkenning. De mandatering
      geschiedt bij afzonderlijk besluit.

      2 Bij het in het eerste lid bedoelde besluit stelt het bestuur de bij de verlening van de erkenning in acht te
      nemen voorschriften vast en wijst het bestuur de functionarissen van de instellingen aan die worden gemandateerd om
      de erkenning te verlenen.

      3 Aan een erkenning kunnen nadere voorschriften of voorwaarden worden verbonden. Een erkenning kan onder
      beperkingen worden verleend.

      4 De in het eerste lid bedoelde erkenning wordt ingetrokken indien niet langer aan de voorschriften of voorwaarden
      wordt voldaan.

      5 Het in het eerste lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel3
    url: https://wetten.overheid.nl/BWBR0024314/2012-04-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024314
        artikel: '3'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 Het bedrijfscertificaat, als bedoeld in [artikel 3, derde lid][ref1], wordt door het bestuur uitgegeven. De in
      [artikel 13, eerste lid][ref2], bedoelde gemandateerde instellingen dragen namens het bestuur zorg voor de uitgifte
      van het bedrijfscertificaat.

      2 Het in het eerste lid bedoelde bedrijfscertificaat wordt ingetrokken indien niet langer aan de voorschriften of
      voorwaarden wordt voldaan.

      3 Bij het in [artikel 13, eerste lid][ref3], bedoelde besluit stelt het bestuur een model bedrijfscertificaat vast
      en wijst het bestuur de functionarissen van de instellingen aan die worden gemandateerd om het bedrijfscertificaat
      uit te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0024314#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024314#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0024314#Artikel13
