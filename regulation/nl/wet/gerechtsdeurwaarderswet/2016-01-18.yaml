    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012197/2016-01-18#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
