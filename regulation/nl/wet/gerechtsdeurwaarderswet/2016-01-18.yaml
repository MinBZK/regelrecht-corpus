    url: https://wetten.overheid.nl/BWBR0012197/2016-01-18#Artikel1
  - number: 1.i
    text: |-
      de KBvG: de Koninklijke Beroepsorganisatie van Gerechtsdeurwaarders, bedoeld in [artikel 56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel56
    url: https://wetten.overheid.nl/BWBR0012197/2016-01-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012197
