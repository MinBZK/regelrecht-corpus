  - number: 1a.1
    text: |-
      Er is een register voor gerechtsdeurwaarders, waarnemend gerechtsdeurwaarders, toegevoegd gerechtsdeurwaarders en
      kandidaat-gerechtsdeurwaarders, dat wordt beheerd door het bestuur van de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel1a
  - number: 1a.2
    text: |-
      In het register wordt iedere gerechtsdeurwaarder, waarnemend gerechtsdeurwaarder, toegevoegd gerechtsdeurwaarder en
      kandidaat-gerechtsdeurwaarder opgenomen onder vermelding van diens naam en plaats en datum van geboorte.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel1a
  - number: 1a.3
    text: |-
      In het register worden ten aanzien van de daarin geregistreerde personen, voor zover van toepassing, tevens de
      volgende gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel1a
  - number: 1a.3.a
    text: de benoeming van de gerechtsdeurwaarder, zijn ontslag of overlijden;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel1a
  - number: 1a.3.b
    text: |-
