  - number: 1a.4
    text: |-
      Onze Minister, het Bureau, de kamer voor gerechtsdeurwaarders en het gerechtshof Amsterdam, hebben ten behoeve van
      hun taakvervulling op grond van deze wet onbeperkte inzage.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel1a
  - number: 1a.5
    text: |-
      Het register ligt voor een ieder ter inzage, met uitzondering van de gegevens betreffende: - de plaats en datum van
      geboorte van de ingeschrevene;
        - de gegrondverklaring van een klacht zonder oplegging van een maatregel;
        - de tuchtrechtelijke maatregelen van de waarschuwing, berisping of boete op grond van
      [artikel 43, tweede lid, onderdelen a, b en c][ref1], tenzij toepassing is gegeven aan artikel 43, vierde lid;
        - de tuchtrechtelijke maatregelen van [artikel 49, eerste lid][ref2], voor zover een waarschuwing, berisping of
      boete is opgelegd; en
        - de maatregelen die zijn opgelegd op grond van [artikel 30b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel30b
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: 30b
        hoofdstuk: IV
        paragraaf: '1'
  - number: 1a.6
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de toepassing van het tweede
      en derde lid, de inrichting van het register, de wijze waarop het wordt beheerd, de inzage in het register en
      het verstrekken van gegevens uit het register door het bestuur van de KBvG. Het bestuur van de KBvG verstrekt op
      verzoek een gewaarmerkt afschrift of uittreksel tegen kostprijs.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel1a
  - number: '2.1'
    text: |-
      De gerechtsdeurwaarder is belast met de taken die bij of krachtens de wet, al dan niet bij uitsluiting van
      ieder ander, aan deurwaarders onderscheidenlijk gerechtsdeurwaarders zijn opgedragen of voorbehouden. De
      gerechtsdeurwaarder is in het bijzonder belast met:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: 2.1.a
    text: het doen van dagvaardingen en andere betekeningen, behorende tot de rechtsingang of de instructie van gedingen;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: 2.1.b
    text: het doen van gerechtelijke aanzeggingen, bekendmakingen, protesten en verdere exploten;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: 2.1.c
    text: |-
      ontruimingen, beslagen, executoriale verkopingen, gijzelingen en andere handelingen, behorende tot of vereist voor
      de uitvoering van executoriale titels dan wel voor de bewaring van rechten;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: 2.1.d
    text: |-
      het doen van protesten van non-acceptatie of non-betaling van wissels, orderbiljetten en dergelijke en het opmaken
      van een akte van interventie aan de voet van het protest;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: 2.1.e
    text: |-
      het ambtelijk toezicht bij vrijwillige openbare verkopingen van roerende lichamelijke zaken bij opbod, bij opbod en
      afslag, of bij afslag.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: '2.2'
    text: Bij algemene maatregel van bestuur worden de in het eerste lid bedoelde ambtshandelingen omschreven.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: '2.3'
    text: Onder ambtshandelingen worden mede verstaan de werkzaamheden die rechtstreeks daarmee samenhangen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
  - number: '2.4'
    text: |-
      De [hoofdstukken 3][ref1] en [4 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing op
      ambtshandelingen en de weigering deze te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '4'
  - number: '3.1'
    text: De gerechtsdeurwaarder is bevoegd tot het verrichten van ambtshandelingen op het grondgebied van Nederland.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: '3.2'
    text: 'De gerechtsdeurwaarder is niet bevoegd tot het verrichten van ambtshandelingen ten behoeve van of gericht tegen:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: 3.2.a
    text: |-
      zichzelf, zijn echtgenoot, geregistreerde partner of een persoon met wie hij een duurzame relatie onderhoudt en
      samenwoont;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: 3.2.b
    text: zijn bloed- of aanverwanten, in rechte lijn onbepaald en in de zijlijn tot en met de derde graad;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: 3.2.c
    text: |-
      een natuurlijke persoon, niet zijnde een gerechtsdeurwaarder, of rechtspersoon, waarvan de aandelen niet
      volledig in het bezit zijn van een gerechtsdeurwaarder, die direct of indirect aandelen bezit van of de
      functie van directeur vervult in de rechtspersoon die het kantoor houdt van waaruit de gerechtsdeurwaarder zijn
      ambtshandelingen verricht.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: '3.3'
    text: 'De gerechtsdeurwaarder is niet bevoegd tot het verrichten van ambtshandelingen ten behoeve van of gericht tegen:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: 3.3.a
    text: |-
      de bloed- en aanverwanten van een persoon met wie hij een duurzame relatie onderhoudt en samenwoont, in rechte lijn
      onbepaald en in de zijlijn tot en met de derde graad;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: 3.3.b
    text: |-
      een rechtspersoon waarvan hij weet of had behoren te weten dat een van de personen, bedoeld in het tweede lid,
      onderdeel a, dan wel een van hun bloed of aanverwanten in rechte lijn daarin een meerderheid van de aandelen bezit
      of de functie van directeur vervult.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: '3.4'
    text: Ambtshandelingen, verricht in strijd met het tweede of derde lid, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3
  - number: 3a.1
    text: |-
      De gerechtsdeurwaarder die opdracht ontvangt tot het verrichten van een ambtshandeling stelt, indien hij
      redelijkerwijs rekening moet houden met de mogelijkheid dat het verrichten daarvan in strijd is met de
      volkenrechtelijke verplichtingen van de Staat, Onze Minister aanstonds van de ontvangen opdracht in kennis, op de
      wijze als bij ministeriële regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3a
  - number: 3a.2
    text: |-
      Onze Minister kan een gerechtsdeurwaarder aanzeggen dat een ambtshandeling die aan hem is of zal worden opgedragen,
      dan wel door hem reeds is verricht, in strijd is met de volkenrechtelijke verplichtingen van de Staat.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3a
  - number: 3a.3
    text: |-
      Een aanzegging kan uitsluitend ambtshalve geschieden. In verband met de vereiste spoed kan een aanzegging mondeling
      geschieden, in welk geval zij onverwijld schriftelijk wordt bevestigd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3a
  - number: 3a.4
    text: Van de aanzegging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3a
  - number: 3a.5
    text: |-
      Is op het tijdstip waarop de gerechtsdeurwaarder een aanzegging ontvangt als bedoeld in het tweede lid, de
      ambtshandeling nog niet verricht, dan heeft de aanzegging ten gevolge dat de gerechtsdeurwaarder niet bevoegd is
      tot het verrichten van deze ambtshandeling. Een ambtshandeling die is verricht in strijd met de eerste volzin is
      nietig.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3a
  - number: 3a.6
    text: |-
      Is op het tijdstip waarop de gerechtsdeurwaarder een aanzegging ontvangt als bedoeld in het tweede lid, de
      ambtshandeling reeds verricht en behelsde deze een beslagexploot, dan betekent hij deze aanzegging aanstonds aan
      degene aan wie het exploot is gedaan, heft het beslag op en maakt de gevolgen daarvan ongedaan. De kosten van de
      betekening van de aanzegging komen ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3a
  - number: 3a.7
    text: |-
      De voorzieningenrechter kan, rechtdoende in kort geding, de gevolgen van de aanzegging, bedoeld
      in het vijfde lid, eerste volzin, en de verplichtingen, bedoeld in het zesde lid, opheffen,
      onverminderd de bevoegdheid van de gewone rechter. Indien de ambtshandeling een beslag behelst is
      [artikel 438, vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel438
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '438'
  - number: '4.1'
    text: |-
      Een gerechtsdeurwaarder wordt benoemd bij koninklijk besluit. In het besluit wordt de plaats van vestiging
      aangegeven. Hij mag zijn werkzaamheden als gerechtsdeurwaarder eerst aanvangen nadat hij is ingeschreven in het
      gerechtsdeurwaardersregister.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel4
  - number: '4.2'
    text: |-
      Tot het voeren van de titel van gerechtsdeurwaarder is uitsluitend bevoegd degene die als zodanig is ingeschreven
      in het gerechtsdeurwaardersregister en die niet geschorst of ontslagen is.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel4
  - number: '5'
    text: 'Tot gerechtsdeurwaarder is slechts benoembaar degene die:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
  - number: 5.a
    text: |-
      de Nederlandse nationaliteit bezit of de nationaliteit van een andere lidstaat van de Europese Unie, van een
      overige staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of van de Zwitserse
      Bondsstaat;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
  - number: 5.b
    text: |-
      met goed gevolg een door Onze Minister erkende opleiding ter voorbereiding op het beroep van gerechtsdeurwaarder
      heeft doorlopen;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
  - number: 5.c
    text: |-
      de stage, bedoeld in [artikel 25, tweede lid][ref1], heeft doorlopen;


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: 5.d
    text: de Nederlandse taal in voldoende mate beheerst voor een goede uitoefening van het ambt van gerechtsdeurwaarder;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
  - number: 5.e
    text: |-
      in de hoedanigheid van toegevoegd gerechtsdeurwaarder of kandidaat-gerechtsdeurwaarder gedurende het jaar
      voorafgaande aan zijn verzoek tot benoeming gemiddeld ten minste 21 uur per week werkzaam is geweest;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
  - number: 5.f
    text: |-
      in het bezit is van een ondernemingsplan dat voldoet aan de voorwaarden van [artikel 6, eerste lid][ref1], alsmede
      van het advies, bedoeld in artikel 6, tweede lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel6
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 5.g
    text: |-
      in het bezit is van een verklaring omtrent het gedrag afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1] en die niet ouder is dan drie maanden, dan wel indien
      betrokkene niet de Nederlandse nationaliteit bezit, een met een verklaring omtrent het gedrag gelijk te stellen
      verklaring afgegeven door het daartoe bevoegde gezag in de staat van herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '6.1'
    text: |-
      Het ondernemingsplan, bedoeld in [artikel 5][ref1], is zodanig opgesteld dat daaruit in ieder geval blijkt:


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 6.1.a
    text: |-
      dat de verzoeker over voldoende financiële middelen beschikt om een kantoor te houden dat in overeenstemming is met
      de eisen van het ambt; en
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: 6.1.b
    text: dat op redelijke gronden mag worden verwacht dat na drie jaren de praktijk kostendekkend kan worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: '6.2'
    text: |-
      Over het ondernemingsplan wordt advies uitgebracht door een door Onze Minister te benoemen Commissie van
      deskundigen. De Commissie is bevoegd in verband met het onderzoek van het ondernemingsplan inlichtingen in te
      winnen bij de KBvG en het Bureau. Het advies wordt als bijlage bij het ondernemingsplan gevoegd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: '6.3'
    text: Het secretariaat van de Commissie van deskundigen berust bij het Bureau.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: '6.4'
    text: |-
      Voor de advisering over het ondernemingsplan door de Commissie van deskundigen worden aan de verzoeker kosten in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: '6.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: 6.5.a
    text: het ondernemingsplan;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: 6.5.b
    text: de samenstelling en de werkwijze van de Commissie van deskundigen;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: 6.5.c
    text: de wijze waarop de kosten van de advisering worden berekend.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel6
  - number: '7.1'
    text: |-
      Degene die voor benoeming tot gerechtsdeurwaarder in aanmerking wenst te komen dient bij Onze Minister een
      daartoe strekkend verzoek in, met opgave van de plaats waarin hij voornemens is zich als gerechtsdeurwaarder
      te vestigen. Bij het verzoek legt hij bewijsstukken over waaruit blijkt dat hij voldoet aan de voorwaarden van
      [artikel 5][ref1], daaronder begrepen het ondernemingsplan. In het verzoek doet hij tevens opgave van het kantoor
      of de kantoren waar de gerechtsdeurwaarder onder wiens verantwoordelijkheid hij ambtshandelingen heeft verricht
      werkzaam was.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Onze Minister zendt een afschrift van het verzoek met de bijlagen aan het bestuur van de KBvG en het Bureau,
      met het verzoek hem uiterlijk binnen drie maanden in kennis te stellen van eventuele aan hem bekende feiten of
      omstandigheden, welke naar zijn oordeel tot weigering van het verzoek zouden kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel7
  - number: '7.3'
    text: |-
      Een benoeming kan uitsluitend worden geweigerd indien aan één of meer van de in [artikel 5][ref1] genoemde
      voorwaarden niet is voldaan of wanneer er, gelet op de antecedenten van de verzoeker, een gegronde vrees bestaat
      dat de gerechtsdeurwaarder na benoeming zal handelen of nalaten in strijd met het bij of krachtens de wet bepaalde
      of anderszins het aanzien of de vervulling van het gerechtsdeurwaardersambt wordt geschaad of belemmerd. Een
      beschikking tot weigering van een benoeming wordt gegeven door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7.4'
    text: Op het verzoek wordt beslist binnen vier maanden na ontvangst ervan.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel7
  - number: '8'
    text: |-
      In afwijking van [artikel 8:4, derde lid, onderdeel a, van de Algemene wet bestuursrecht](onbekend) kan een
      belanghebbende tegen een besluit tot benoeming tot gerechtsdeurwaarder beroep instellen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel8
  - number: '9.1'
    text: |-
      De gerechtsdeurwaarder legt binnen twee maanden na de dagtekening van zijn benoeming ter openbare terechtzitting
      voor de rechtbank van het arrondissement waarin de plaats van vestiging is gelegen de navolgende eed of belofte
      af: «Ik zweer (beloof) getrouwheid aan de Koning en de [Grondwet][ref1].» «Ik zweer (beloof), dat ik mij zal
      gedragen naar de wetten en voorschriften op mijn ambt van toepassing en dat ik mijn taak eerlijk en nauwgezet zal
      uitvoeren.» «Voorts zweer (verklaar) ik, dat ik, om tot gerechtsdeurwaarder te worden benoemd, direct of indirect
      aan niemand, onder welke naam of welk voorwendsel ook, enige giften of gaven beloofd of afgegeven heb, noch beloven
      of afgeven zal».


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '9.2'
    text: |-
      Wanneer de eed of belofte, bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst van de eed
      of belofte als volgt: «Ik swar (ûnthjit) trou oan de Kening en de Grûnwet.» «Ik swar (ûnthjit), dat ik my hâlde
      en drage sil neffens de wetten en foarskriften sa’t dy op myn amt fan tapassing binne en dat ik myn taak earlik en
      sekuer útfiere sil.» «Fierders swar (ferklearje) ik, dat ik, om ta gerjochtsdoarwarder beneamd te wurden, midlik of
      streekrjocht oan gjinien, ûnder wat namme of wat útwynsel ek, likefolle hokker jeften of geskinken tasein of ôfjûn
      haw, noch tasizze of ôfjaan sil».
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de eed of belofte niet binnen de in het eerste lid bedoelde termijn is afgelegd, vervalt de benoeming. Onze
      Minister kan de in het eerste lid bedoelde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel9
  - number: '9.4'
    text: |-
      De griffier van de rechtbank geeft ter zitting een proces-verbaal van het afleggen van de eed of belofte af aan
      de gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel9
  - number: '9.5'
    text: |-
      De gerechtsdeurwaarder laat zich terstond na het afleggen van de eed of belofte inschrijven in het
      gerechtsdeurwaardersregister, onder overlegging van het proces-verbaal bedoeld in het vierde lid en onder
      deponering van zijn handtekening en paraaf.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel9
  - number: '10.1'
    text: |-
      De plaats van vestiging van een gerechtsdeurwaarder kan, met instemming van de betrokkene, door Onze Minister
      worden gewijzigd bij een beschikking waarbij tevens de datum van ingang wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel10
  - number: '10.2'
    text: |-
      De gerechtsdeurwaarder die zich in een andere plaats wenst te vestigen, richt daartoe een verzoek tot Onze
      Minister. Hij doet daarbij opgave van de gemeente waar hij voornemens is zich te vestigen. Bij dit verzoek
      legt hij een ondernemingsplan over als bedoeld in [artikel 6, eerste lid][ref1], betrekking hebbend op de
      plaats waar hij voornemens is zich te vestigen, alsmede het advies, bedoeld in het tweede lid van dat artikel.
      [Artikel 7, tweede en vierde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel7
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.3'
    text: |-
      Het verzoek kan uitsluitend worden geweigerd indien het bij het verzoek overgelegde ondernemingsplan niet voldoet
      aan de voorwaarden van [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel6
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11'
    text: |-
      De gerechtsdeurwaarder is te allen tijde verplicht in het gehele arrondissement waarin zijn plaats van vestiging is
      gelegen dan wel, indien het arrondissement meer dan één provincie omvat, in het deel van het arrondissement dat is
      gelegen in de provincie waarin zijn plaats van vestiging is gelegen de ambtshandelingen waartoe hij bevoegd is, te
      verrichten wanneer hierom wordt verzocht, tenzij:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel11
  - number: 11.a
    text: met het oog op zijn persoonlijke omstandigheden dit redelijkerwijs niet van hem kan worden verlangd, of
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel11
  - number: 11.b
    text: |-
      de verzoeker niet bereid is het krachtens deze wet door de gerechtsdeurwaarder aan hem gevraagde voorschot voor het
      verrichten van ambtshandelingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel11
  - number: '12.1'
    text: |-
      Indien zich omstandigheden voordoen als bedoeld in [artikel 11, onderdeel a][ref1], treft de gerechtsdeurwaarder,
      voor zover dit in zijn vermogen ligt, de nodige maatregelen om te verzekeren dat desverlangd in het verrichten van
      de ambtshandelingen ter plaatse kan worden voorzien. De gerechtsdeurwaarder kan daartoe Onze Minister verzoeken,
      een waarnemer te benoemen. Hij kan daartoe een waarnemer aanbevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel11
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '12.2'
    text: |-
      Wanneer de gerechtsdeurwaarder gedurende meer dan dertig dagen verhinderd is zijn ambt te vervullen, stelt hij
      Onze Minister hiervan in kennis, onder mededeling van de maatregelen, bedoeld in het eerste lid, die hij heeft
      getroffen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel12
  - number: 12a.1
    text: |-
      De gerechtsdeurwaarder oefent zijn ambt in onafhankelijkheid uit. De gerechtsdeurwaarder mag zijn ambt niet
      uitoefenen in enig verband waardoor zijn onafhankelijkheid wordt of kan worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel12a
  - number: 12a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel12a
  - number: 12a.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel12a
  - number: '13'
    text: |-
      Bij het verrichten van ambtshandelingen is de gerechtsdeurwaarder verplicht zich desverlangd te legitimeren door
      middel van een door Onze Minister afgegeven legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel13
  - number: '14'
    text: |-
      Alvorens over te gaan tot de executie van een executoriale titel tot ontruiming van onroerende zaken, van een
      woonwagen of woonschip, geeft de gerechtsdeurwaarder aan burgemeester en wethouders van de gemeente waarbinnen de
      ontruiming zal plaats hebben, zo spoedig mogelijk kennis van het tijdstip waarop hij tot executie zal overgaan.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel14
  - number: '15.1'
    text: |-
      Het exploot van de gerechtsdeurwaarder dient duidelijk, in onafgebroken samenhang, zonder niet gangbare afkortingen
      en in overeenstemming met de terzake geldende wettelijke voorschriften te zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel15
  - number: '15.2'
    text: Een exploot is gedateerd en ondertekend door de gerechtsdeurwaarder. De dagtekening geschiedt in letters.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel15
  - number: '15.3'
    text: |-
      Aan de voet van het exploot worden de kosten, bedoeld in de [artikelen 240][ref1] en
      [434a van het Wetboek van Burgerlijke Rechtsvordering][ref2], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel434a
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '240'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 434a
  - number: '15.4'
    text: |-
      Een gerechtsdeurwaarder verstrekt desgevraagd het origineel van het exploot aan degene op wiens verzoek hij de
      ambtshandeling heeft verricht. Van ieder exploot bewaart hij een afschrift ten behoeve van zijn administratie.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel15
  - number: '16.1'
    text: |-
      De gerechtsdeurwaarder houdt een kantoor dat in zijn plaats van vestiging is gelegen. Hij is verplicht een goed
      raadpleegbaar register en repertorium te bewaren.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel16
  - number: '16.2'
    text: |-
      Op verzoek van een gerechtsdeurwaarder kan Onze Minister, gehoord de Commissie van deskundigen, bedoeld in
      [artikel 6][ref1], hem toestaan om elders een nevenkantoor te vestigen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel6
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      De gerechtsdeurwaarder is verplicht zowel ten aanzien van zijn werkzaamheden als zodanig als ten aanzien van
      zijn kantoorvermogen een administratie te voeren, waaruit te allen tijde op eenvoudige wijze zijn rechten en
      verplichtingen kunnen worden gekend. Hij is tevens verplicht ten aanzien van zijn privé-vermogen, daaronder
      mede begrepen het vermogen van een gemeenschap van goederen waarin hij is gehuwd of waarin hij een geregistreerd
      partnerschap is aangegaan, een administratie te voeren. De gerechtsdeurwaarder moet jaarlijks zowel ten aanzien
      van zijn kantoorvermogen als ten aanzien van zijn privé-vermogen een balans opmaken en, voor wat betreft de
      kantoorwerkzaamheden, een staat van baten en lasten.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: '17.2'
    text: |-
      De administratie ten aanzien van zijn werkzaamheden als zodanig, bedoeld in het eerste lid, heeft betrekking op de
      ambtshandelingen alsmede op de andere werkzaamheden, bedoeld in [artikel 20][ref1], welke de gerechtsdeurwaarder
      verricht. De administratie met betrekking tot de ambtshandelingen omvat onder meer een register en een repertorium.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel20
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: '17.3'
    text: |-
      Het register omvat, in volgorde van dagtekening, de afschriften van de door de gerechtsdeurwaarder opgemaakte of
      ondertekende exploten, processen-verbaal, akten en verklaringen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: '17.4'
    text: |-
      Het repertorium wordt van dag tot dag bijgehouden en bevat met betrekking tot alle door de gerechtsdeurwaarder
      uitgebrachte exploten:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: 17.4.a
    text: de dagtekening van het exploot,
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: 17.4.b
    text: de aard van het exploot,
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: 17.4.c
    text: de naam van ten minste een der betrokken partijen, en
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: 17.4.d
    text: de kosten van het exploot.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: '17.5'
    text: |-
      Bij verordening worden regels gesteld met betrekking tot de wijze waarop de kantoor- en privé-administratie worden
      ingericht en bijgehouden.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel17
  - number: '18.1'
    text: |-
      De gerechtsdeurwaarder is verplicht de stukken en afschriften betreffende zijn kantooradministratie gedurende
      de in [artikel 10, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] bedoelde termijn te bewaren.
      [Artikel 10, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '10'
  - number: '18.2'
    text: |-
      De gerechtsdeurwaarder is verplicht van de tot zijn register behorende stukken, tegen betaling van de bij
      ministeriële regeling vast te stellen kosten, op hun verlangen expedities of uittreksels af te geven aan hen
      die ten tijde van het opmaken van de akte of de betekening daarvan, hetzij het origineel, hetzij een afschrift
      hebben ontvangen, of aan hun rechtsopvolgers onder algemene of bijzondere titel. In geval een derde-beslagene een
      elektronisch afschrift heeft ontvangen, geschiedt deze afgifte kosteloos. De expedities of uittreksels worden bij
      de afgifte daarvan als zodanig gewaarmerkt en door de gerechtsdeurwaarder die deze afgeeft gedagtekend en getekend.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel18
  - number: '18.3'
    text: |-
      In geval van overlijden, een wijziging van de plaats van vestiging als bedoeld in [artikel 10, vierde lid][ref1],
      dan wel ontslag, dragen de gerechtsdeurwaarder of zijn erfgenamen de tot de administratie behorende stukken die
      krachtens het eerste lid nog moeten worden bewaard, over aan de waarnemend gerechtsdeurwaarder of aan een door Onze
      Minister aan te wijzen bewaarder. Het tweede lid is van overeenkomstige toepassing op degene aan wie de stukken
      zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel10
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.4'
    text: Het eerste lid is van overeenkomstige toepassing op de privé-administratie van de gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel18
  - number: '19.1'
    text: |-
      De gerechtsdeurwaarder is verplicht bij een bank als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] een of meer bijzondere rekeningen aan te houden op
      zijn naam met vermelding van zijn hoedanigheid, die uitsluitend bestemd zijn voor gelden, die hij in verband met
      zijn werkzaamheden als zodanig ten behoeve van derden onder zich neemt. Gelden die aan de gerechtsdeurwaarder
      in verband met zijn werkzaamheden als zodanig ten behoeve van derden worden toevertrouwd, moeten op die rekening
      worden gestort. De bovenbedoelde bank voegt de over de gelden gekweekte rente toe aan het saldo van de bijzondere
      rekening. Indien deze gelden abusievelijk op een andere rekening van de gerechtsdeurwaarder zijn gestort of indien
      ten onrechte gelden op de bijzondere rekening zijn gestort, is de gerechtsdeurwaarder verplicht deze onverwijld op
      de juiste rekening te storten. Hetzelfde geldt indien de gelden rechtstreeks in handen van de gerechtsdeurwaarder
      zijn gesteld. Indien meer gerechtsdeurwaarders in een maatschap samenwerken, kan de bijzondere rekening ten name
      van die gerechtsdeurwaarders tezamen, de maatschap of de vennootschap worden gesteld. De gerechtsdeurwaarder
      vermeldt het nummer van de bijzondere rekening op zijn briefpapier.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '19.2'
    text: |-
      De gerechtsdeurwaarder is bij uitsluiting bevoegd tot het beheer en de beschikking over de bijzondere rekening. De
      gerechtsdeurwaarder kan met een rechthebbende overeenkomen om zijn aandeel in het saldo van de bijzondere rekening
      periodiek uit te keren. Hij kan aan een onder zijn verantwoordelijkheid werkzame persoon volmacht verlenen. Ten
      laste van deze rekening mag hij slechts betalingen doen in opdracht van een rechthebbende. Vorderingen van de
      gerechtsdeurwaarder uit hoofde van voor de rechthebbende verrichte werkzaamheden komen van rechtswege in mindering
      op het aandeel van de rechthebbende in het saldo, zodra zij aan de rechthebbende zijn opgegeven. Wordt de vordering
      betwist, dan kan de gerechtsdeurwaarder de in het vierde lid bedoelde uitkering van het saldo tot het betwiste
      bedrag opschorten, totdat vaststaat wat de rechthebbende uit hoofde van deze werkzaamheden verschuldigd is. Voor
      de hem uit hoofde van zijn werkzaamheden voor de rechthebbende toekomende bedragen, is de gerechtsdeurwaarder zelf
      rechthebbende in het saldo, onverminderd het bepaalde in de laatste volzin van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
  - number: '19.3'
    text: |-
      Het vorderingsrecht voortvloeiende uit de bijzondere rekening behoort toe aan de gezamenlijke rechthebbenden.
      Het aandeel van iedere rechthebbende wordt berekend naar evenredigheid van het bedrag dat te zijnen behoeve op
      de bijzondere rekening is gestort. De gerechtsdeurwaarder of, indien het een gezamenlijke rekening als bedoeld
      in het eerste lid, zesde volzin betreft, iedere gerechtsdeurwaarder, is verplicht een tekort in het saldo van de
      bijzondere rekening terstond aan te vullen, en hij is ter zake daarvan aansprakelijk, tenzij hij aannemelijk kan
      maken dat hem ter zake van het ontstaan van het tekort geen verwijt treft.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
  - number: '19.4'
    text: |-
      Een rechthebbende heeft voor zover uit de aard van zijn recht niet anders voortvloeit, te allen tijde recht op
      uitkering van zijn aandeel in het saldo van de bijzondere rekening. Is het saldo van de bijzondere rekening niet
      toereikend om aan iedere rechthebbende het bedrag van zijn aandeel uit te keren, dan mag de gerechtsdeurwaarder
      aan de rechthebbende slechts zoveel uitkeren als in verband met de rechten van de andere rechthebbenden mogelijk
      is. In dat geval wordt het saldo onder de rechthebbenden verdeeld naar evenredigheid van ieders aandeel, met
      dien verstande dat, indien een gerechtsdeurwaarder zelf rechthebbende is, hem slechts wordt toegedeeld hetgeen
      overblijft, nadat de andere rechthebbenden het hun toekomende hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
  - number: '19.5'
    text: |-
      Er kan geen derdenbeslag worden gelegd onder de in het eerste lid bedoelde bank op het aandeel van een
      rechthebbende in de bijzondere rekening. Is onder de gerechtsdeurwaarder derdenbeslag gelegd op het aandeel
      van een rechthebbende in de bijzondere rekening, dan kan de gerechtsdeurwaarder die overeenkomstig de
      [artikelen 476a][ref1] en [477 van het Wetboek van Burgerlijke Rechtsvordering][ref2] verklaring heeft gedaan
      of die is veroordeeld overeenkomstig [artikel 477a van dat wetboek][ref3], zonder opdracht van de rechthebbende
      overeenkomstig de verklaring of veroordeling betalen aan de executant.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel477
      [ref3]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 476a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '477'
      - id: ref3
        bwb_id: BWBR0001827
  - number: '19.6'
    text: |-
      Rechtshandelingen verricht in strijd met de bepalingen van dit artikel zijn vernietigbaar. De vernietigingsgrond
      kan worden ingeroepen door iedere rechtstreeks belanghebbende. Rechten, door derden te goeder trouw anders dan om
      niet verkregen op gelden die het voorwerp waren van de vernietigde rechtshandeling, worden geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
  - number: '19.7'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze van berekening en uitkering van de
      rente van de op de bijzondere rekening gestorte gelden. Beneden een bij de regeling te bepalen bedrag is geen rente
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
  - number: '19.8'
    text: Van de bepalingen van dit artikel en van de in het zevende lid bedoelde regels kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19
  - number: 19a
    text: |-
      Bij regeling van Onze Minister kan aan gerechtsdeurwaarders de plicht worden opgelegd tot het doen van een melding
      aan het Bureau indien er zich in de regeling aan te duiden gebeurtenissen voordoen die aanmerkelijke nadelige
      gevolgen kunnen hebben voor de financiële positie van een gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel19a
  - number: '20.1'
    text: |-
      Andere werkzaamheden dan die, bedoeld in [artikel 2][ref1], verricht de gerechtsdeurwaarder slechts indien dit
      de goede en onafhankelijke vervulling van zijn ambt, dan wel het aanzien daarvan, niet schaadt of belemmert. Voor
      zover de gerechtsdeurwaarder bij het verrichten van andere werkzaamheden gelden voor derden onder zich heeft of
      krijgt, is [artikel 19][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel19
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
  - number: '20.2'
    text: |-
      Met het oog op de belangen, bedoeld in het eerste lid, kunnen bij algemene maatregel van bestuur met betrekking tot
      het verrichten van bepaalde werkzaamheden regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: '20.3'
    text: |-
      Bij algemene maatregel van bestuur kan het verrichten van bepaalde werkzaamheden worden verboden, behoudens indien
      het betreft:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: 20.3.a
    text: |-
      het optreden als proces- of rolgemachtigde en het verlenen van rechtsbijstand in en buiten rechte, overeenkomstig
      hetgeen daaromtrent bij of krachtens de wet is bepaald;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: 20.3.b
    text: het optreden als curator of bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: 20.3.c
    text: het innen van gelden voor derden;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: 20.3.d
    text: het verrichten van inventarisaties en taxaties;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: 20.3.e
    text: |-
      het opmaken van een schriftelijke verklaring betreffende door de gerechtsdeurwaarder persoonlijk waargenomen feiten
      van stoffelijke aard;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: 20.3.f
    text: |-
      de uitoefening van het veilinghoudersbedrijf, met dien verstande dat de ambtshandelingen, bedoeld in
      [artikel 2, eerste lid, onderdeel e][ref1], daarin niet mogen worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel2
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.4'
    text: |-
      De gerechtsdeurwaarder doet opgave aan het bestuur van de KBvG van het aanvaarden en beëindigen van een al dan niet
      bezoldigde nevenbetrekking en van andere werkzaamheden anders dan genoemd in het derde lid. De gerechtsdeurwaarder
      draagt er zorg voor dat hetgeen hierover in het gerechtsdeurwaardersregister wordt bijgehouden actueel is.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel20
  - number: '21'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het betalen van voorschotten op hetgeen
      door de opdrachtgever aan de gerechtsdeurwaarder verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel21
  - number: '22'
    text: |-
      De gerechtsdeurwaarder is verplicht een rekening ter zake van een aan hem toevertrouwde zaak op te maken,
      waaruit duidelijk blijkt op welke wijze het in rekening gebrachte is berekend en of het betrekking heeft op
      ambtshandelingen of op andere werkzaamheden, als bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel20
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: '23.1'
    text: |-
      Ingeval van ontslag dan wel indien de ter plaatse benoemde gerechtsdeurwaarder door ziekte, afwezigheid of
      schorsing zijn ambt niet kan vervullen, kan Onze Minister voor bepaalde tijd een waarnemend gerechtsdeurwaarder
      benoemen. Alvorens tot benoeming van een waarnemend gerechtsdeurwaarder over te gaan, wint Onze Minister advies in
      bij het bestuur van de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: '23.2'
    text: 'Tot waarnemend gerechtsdeurwaarder kunnen worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: 23.2.a
    text: een gerechtsdeurwaarder;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: 23.2.b
    text: |-
      een persoon die voldoet aan de vereisten voor benoeming tot gerechtsdeurwaarder, met uitzondering van de vereisten
      genoemd in [artikel 5, onderdelen e en f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 23.2.c
    text: |-
      in geval van ontslag wegens het bereiken van de leeftijd van zeventig jaar, de ontslagene zelf, doch niet voor
      langer dan één jaar.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: '23.3'
    text: |-
      Een persoon als bedoeld in het tweede lid, onderdeel b, die voor de eerste maal tot waarnemend gerechtsdeurwaarder
      wordt benoemd, legt zo spoedig mogelijk na zijn benoeming ter openbare terechtzitting voor de rechtbank van het
      arrondissement waarin de plaats van vestiging is gelegen, de navolgende eed of belofte af: «Ik zweer (beloof)
      getrouwheid aan de Koning en de [Grondwet][ref1].» «Ik zweer (beloof), dat ik mij zal gedragen naar de wetten en
      voorschriften op mijn ambt van toepassing en dat ik mijn taak eerlijk en nauwgezet zal uitvoeren.»


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '23.4'
    text: |-
      Wanneer de eed of belofte, bedoeld in het derde lid, in de Friese taal wordt afgelegd, luidt de tekst van de eed
      of belofte als volgt: «Ik swar (ûnthjit) trou oan de Kening en de Grûnwet.» «Ik swar (ûnthjit), dat ik my hâlde
      en drage sil neffens de wetten en foarskriften sa’t dy op myn amt fan tapassing binne en dat ik myn taak earlik en
      sekuer útfiere sil.»
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: '23.5'
    text: |-
      [Artikel 9, vierde en vijfde lid][ref1], zijn van overeenkomstige toepassing op de aflegging van de eed of belofte
      door een waarnemend gerechtsdeurwaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel9
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23.6'
    text: 'De waarneming eindigt:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: 23.6.a
    text: door ontslag door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: 23.6.b
    text: doordat de waargenomen gerechtsdeurwaarder, na kennisgeving daarvan aan Onze Minister, zijn ambtsvervulling hervat;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: 23.6.c
    text: door verloop van de termijn waarvoor de waarnemend gerechtsdeurwaarder werd benoemd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel23
  - number: '24.1'
    text: |-
      Een waarnemend gerechtsdeurwaarder heeft dezelfde rechten en verplichtingen als een gerechtsdeurwaarder. De
      gerechtsdeurwaarder die wordt waargenomen, hindert de waarneming niet.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
  - number: '24.2'
    text: |-
      Onverminderd het bepaalde in [artikel 3, tweede tot en met vierde lid][ref1] en [artikel 3a][ref2], is de
      waarnemend gerechtsdeurwaarder bevoegd een verzoek tot het verrichten van ambtshandelingen dat was gericht tot
      de waar te nemen gerechtsdeurwaarder of waarnemend gerechtsdeurwaarder, uit te voeren. Hij stelt verzoeker op de
      hoogte van de waarneming.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel3a
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: 3a
        hoofdstuk: II
        paragraaf: '1'
  - number: '24.3'
    text: |-
      Het tweede lid is na beëindiging van de waarneming van overeenkomstige toepassing op de waargenomen
      gerechtsdeurwaarder met betrekking tot aan de waarnemend gerechtsdeurwaarder gerichte verzoeken tot het verrichten
      van ambtshandelingen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
  - number: '24.4'
    text: |-
      De waar te nemen gerechtsdeurwaarder verschaft de waarnemend gerechtsdeurwaarder toegang tot zijn administratie
      voor zover dit noodzakelijk is voor het vervullen van de waarneming.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
  - number: '24.5'
    text: |-
      Bij waarneming in geval van ziekte of afwezigheid kan de waarnemend gerechtsdeurwaarder, in afwijking van
      [artikel 17][ref1], in overeenstemming met de waar te nemen gerechtsdeurwaarder diens administratie voortzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel17
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
  - number: '24.6'
    text: De kosten van de waarneming komen ten laste van de waargenomen gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
  - number: '24.7'
    text: |-
      Na beëindiging van de waarneming is het vierde lid van overeenkomstige toepassing op de gewezen waarnemend
      gerechtsdeurwaarder ten opzichte van de waargenomen gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
  - number: '24.8'
    text: |-
      Bij het verrichten van ambtshandelingen vermeldt de waarnemend gerechtsdeurwaarder zijn hoedanigheid. Behalve in
      geval van ontslag, vermeldt hij naast zijn eigen naam en voornamen, de naam, voornamen en plaats van vestiging van
      de gerechtsdeurwaarder waarvoor hij waarneemt.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel24
  - number: '25.1'
    text: |-
      Kandidaat-gerechtsdeurwaarder is degene die met goed gevolg een door Onze Minister erkende opleiding ter
      voorbereiding op het beroep van gerechtsdeurwaarder heeft doorlopen, en ten behoeve van de stage is toegevoegd op
      grond van het derde lid en onder verantwoordelijkheid en toezicht van een gerechtsdeurwaarder bij hem werkzaam is
      op kantoor.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25
  - number: '25.2'
    text: |-
      Een kandidaat-gerechtsdeurwaarder doorloopt, teneinde voldoende werkervaring op te doen, een stage van een jaar. In
      geval van werkzaamheid in deeltijd wordt de vereiste duur van de stage naar evenredigheid verlengd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25
  - number: '25.3'
    text: |-
      Een gerechtsdeurwaarder voegt een kandidaat-gerechtsdeurwaarder, met goedkeuring van Onze Minister, als zodanig aan
      zich toe. De goedkeuring van Onze Minister wordt steeds verleend voor de periode van maximaal een jaar.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25
  - number: '25.4'
    text: |-
      Bij verordening worden regels gesteld met betrekking tot de inrichting van de stage, de beoordeling van de
      werkzaamheden van de kandidaat-gerechtsdeurwaarder, verdere kwalificaties in het kader van de beroepsbekwaamheid
      en de rechten en verplichtingen van de kandidaat-gerechtsdeurwaarder en de gerechtsdeurwaarder aan wie hij is
      toegevoegd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25
  - number: 25a.1
    text: |-
      Een erkenning van een opleiding als bedoeld in [artikel 25, eerste lid][ref1], wordt alleen verleend indien het
      opleidingsplan van een instelling aan bij of krachtens algemene maatregel van bestuur gestelde eisen voldoet. Deze
      eisen kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: 25a.1.a
    text: de duur en de inrichting van de opleiding, waaronder de opleidingsstage;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.1.b
    text: de toelating tot de opleiding;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.1.c
    text: de organisatie en exploitatie van de opleiding;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.1.d
    text: de examens en de rechtsbescherming van de cursisten; en
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.1.e
    text: het in rekening brengen van een financiële bijdrage aan degene die de opleiding volgt.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.2
    text: 'De erkenning kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.2.a
    text: de erkenning is verleend op grond van onjuiste gegevens;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.2.b
    text: de opleider geen of onvoldoende uitvoering geeft aan het opleidingsplan; of
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.2.c
    text: de opleider niet voldoet aan de bij of krachtens wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aanvraag van een
      erkenning en de besluitvorming daarover. Bij of krachtens algemene maatregel van bestuur kan een commissie worden
      ingesteld die belast is met de behandeling van beroepschriften van cursisten en stagiairs en met advisering over
      de opleiding.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25a
  - number: 25b.1
    text: |-
      Het verzoek om goedkeuring van de toevoeging van een kandidaat-gerechtsdeurwaarder, bedoeld in
      [artikel 25, derde lid][ref1], wordt gedaan door de gerechtsdeurwaarder en de beoogd kandidaat-gerechtsdeurwaarder
      gezamenlijk en bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: 25b.1.a
    text: de naam, voornamen en datum van geboorte van de beoogd kandidaat-gerechtsdeurwaarder;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25b
  - number: 25b.1.b
    text: de naam, voornamen en plaats van vestiging van de gerechtsdeurwaarder;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25b
  - number: 25b.1.c
    text: |-
      indien de beoogd kandidaat-gerechtsdeurwaarder reeds eerder als kandidaat-gerechtsdeurwaarder werkzaam was: het
      tijdvak van deze werkzaamheden en de naam en de plaats van vestiging van de gerechtsdeurwaarder aan wie hij laatst
      was toegevoegd;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25b
  - number: 25b.1.d
    text: |-
      een verklaring van het bestuur van de KBvG, waaruit blijkt of aan de beoogd kandidaat-gerechtsdeurwaarder,
      respectievelijk de gerechtsdeurwaarder aan wie wordt toegevoegd, dan wel eerder was toegevoegd, een maatregel als
      bedoeld in de [artikelen 43][ref1] of [49][ref2] is opgelegd, en zo ja, welke.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel49
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 25b.2
    text: |-
      Een kandidaat-gerechtsdeurwaarder kan slechts als zodanig worden aangewezen indien hij in het bezit is van een
      verklaring omtrent het gedrag, afgegeven volgens de Wet justitiële en strafvorderlijke gegevens en die niet ouder
      is dan drie maanden, dan wel indien betrokkene niet de Nederlandse nationaliteit bezit, een met een verklaring
      omtrent het gedrag gelijk te stellen verklaring afgegeven door het daartoe bevoegde gezag in de staat van herkomst.
      [Artikel 5, onderdeel d][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 25b.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het aantal kandidaat-
      gerechtsdeurwaarders dat gelijktijdig onder verantwoordelijkheid van één gerechtsdeurwaarder werkzaam kan zijn.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25b
  - number: 25c.1
    text: |-
      De kandidaat-gerechtsdeurwaarder kan namens en onder verantwoordelijkheid en toezicht van de gerechtsdeurwaarder op
      wiens kantoor hij werkzaam is, de ambtshandelingen verrichten waartoe deze bevoegd is.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25c
  - number: 25c.2
    text: |-
      De [artikelen 3, tweede en derde lid][ref1], [13][ref2], [15][ref3] en [20][ref4] zijn van overeenkomstige
      toepassing op de kandidaat-gerechtsdeurwaarder. [Artikel 23, derde lid][ref5], is van overeenkomstige toepassing
      op de kandidaat-gerechtsdeurwaarder, met dien verstande dat de navolgende eed of belofte wordt afgelegd: «Ik zweer
      (beloof) getrouwheid aan de Koning en de Grondwet.» «Ik zweer (beloof), dat ik mij zal gedragen naar de wetten
      en voorschriften op het ambt van gerechtsdeurwaarder van toepassing en dat ik mijn taak eerlijk en nauwgezet zal
      uitvoeren.»


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0012197#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0012197#Artikel23
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0012197
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0012197
        artikel: '23'
        hoofdstuk: III
        paragraaf: '1'
  - number: 25c.3
    text: |-
      Wanneer de eed of belofte, bedoeld in het tweede lid, in de Friese taal wordt afgelegd, luidt de tekst van de eed
      of belofte als volgt: «Ik swar (ûnthjit) trou oan de Kening en de Grûnwet.» «Ik swar (ûnthjit), dat ik my hâlde en
      drage sil neffens de wetten en foarskriften sa’t dy op it amt fan gerjochtsdoarwarder fan tapassing binne en dat ik
      myn taak earlik en sekuer útfiere sil.»
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25c
  - number: 25c.4
    text: |-
      [Artikel 9, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op de aflegging van de eed of belofte
      door een kandidaat-gerechtsdeurwaarder. Hij mag zijn werkzaamheden eerst aanvangen nadat hij is ingeschreven in het
      gerechtsdeurwaardersregister.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel9
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 25c.5
    text: |-
      Bij het verrichten van ambtshandelingen vermeldt de kandidaat-gerechtsdeurwaarder naast zijn naam, voornamen en
      hoedanigheid, de naam, voornamen en plaats van vestiging van de gerechtsdeurwaarder aan wie de goedkeuring bedoeld
      in [artikel 25, derde lid][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: 25c.6
    text: |-
      De kandidaat-gerechtsdeurwaarder verricht geen ambtshandelingen indien voor de gerechtsdeurwaarder een waarnemend
      gerechtsdeurwaarder is benoemd, tenzij de waarnemend gerechtsdeurwaarder hem, na kennisgeving aan Onze Minister,
      toestemming heeft verleend om onder verantwoordelijkheid van de waarnemend gerechtsdeurwaarder zijn werkzaamheden
      als kandidaat-gerechtsdeurwaarder voort te zetten.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel25c
  - number: '26.1'
    text: |-
      De [artikelen 25][ref1], [25b][ref2], [25c][ref3] en [29][ref4] zijn van overeenkomstige toepassing bij een
      stageverplichting in het kader van de in artikel 25, eerste lid, bedoelde opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel25c
      [ref4]: https://wetten.overheid.nl/BWBR0012197#Artikel29
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: 25b
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: 25c
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012197
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Iedere gerechtsdeurwaarder werkt naar vermogen mee aan de in het eerste lid genoemde stageverplichting. Het bestuur
      van de KBvG kan gerechtsdeurwaarders aanwijzen die de zorg dragen voor een stageplek voor gegadigden, tenzij dit
      voor de desbetreffende gerechtsdeurwaarder een onredelijke last zou vormen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel26
  - number: '26.3'
    text: |-
      Degene die aan een gerechtsdeurwaarder wordt toegevoegd ten behoeve van de stageverplichting in het kader van de
      in [artikel 25, eerste lid][ref1], bedoelde opleiding, mag zich kandidaat-gerechtsdeurwaarder noemen en is voor
      de duur van de toevoeging onderworpen aan het toezicht en tuchtrecht zoals dat voor kandidaat-gerechtsdeurwaarders
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: '27.1'
    text: |-
      Een gerechtsdeurwaarder kan, met goedkeuring van Onze Minister, een op grond van [artikel 5][ref1] benoembare
      persoon, aanwijzen als een aan hem toegevoegd gerechtsdeurwaarder. De toegevoegd gerechtsdeurwaarder is bij de
      gerechtsdeurwaarder aan wie hij is toegevoegd, werkzaam op kantoor en kan onder verantwoordelijkheid en toezicht
      van deze gerechtsdeurwaarder namens hem de ambtshandelingen verrichten waartoe deze bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27.2'
    text: Het aantal toegevoegd gerechtsdeurwaarders per gerechtsdeurwaarder bedraagt ten hoogste drie.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel27
  - number: '27.3'
    text: |-
      De [onderdelen e en f in artikel 5][ref1] zijn niet van toepassing in geval van een aanwijzing als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27.4'
    text: Een toegevoegd gerechtsdeurwaarder wordt aan niet meer dan twee gerechtsdeurwaarders gelijktijdig toegevoegd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel27
  - number: '28.1'
    text: |-
      De [artikelen 3, tweede en derde lid][ref1], [13][ref2], [15][ref3] en [20][ref4] zijn van overeenkomstige
      toepassing op de toegevoegd gerechtsdeurwaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0012197#Artikel20
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0012197
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: '28.2'
    text: |-
      [Artikel 23, derde lid][ref1], is van overeenkomstige toepassing op de toegevoegd gerechtsdeurwaarder die
      nog niet eerder is toegevoegd, met dien verstande dat de navolgende eed of belofte wordt afgelegd: «Ik zweer
      (beloof) getrouwheid aan de Koning en de Grondwet.» «Ik zweer (beloof), dat ik mij zal gedragen naar de wetten
      en voorschriften op het ambt van gerechtsdeurwaarder van toepassing en dat ik mijn taak eerlijk en nauwgezet zal
      uitvoeren.»


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel23
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '23'
        hoofdstuk: III
        paragraaf: '1'
  - number: '28.3'
    text: |-
      Wanneer de eed of belofte, bedoeld in het tweede lid, in de Friese taal wordt afgelegd, luidt de tekst van de eed
      of belofte als volgt: «Ik swar (ûnthjit) trou oan de Kening en de Grûnwet.» «Ik swar (ûnthjit), dat ik my hâlde en
      drage sil neffens de wetten en foarskriften sa’t dy op it amt fan gerjochtsdoarwarder fan tapassing binne en dat ik
      myn taak earlik en sekuer útfiere sil.»
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel28
  - number: '28.4'
    text: |-
      [Artikel 9, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op de aflegging van de eed of belofte
      door een toegevoegd gerechtsdeurwaarder. Hij mag zijn werkzaamheden eerst aanvangen nadat hij is ingeschreven in
      het gerechtsdeurwaardersregister.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel9
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '28.5'
    text: |-
      Bij het verrichten van ambtshandelingen vermeldt de toegevoegd gerechtsdeurwaarder naast zijn naam, voornamen en
      hoedanigheid, de naam, voornamen en plaats van vestiging van de gerechtsdeurwaarder aan wie hij is toegevoegd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel28
  - number: '28.6'
    text: |-
      De toegevoegd gerechtsdeurwaarder verricht geen ambtshandelingen indien voor de gerechtsdeurwaarder een waarnemend
      gerechtsdeurwaarder is benoemd, tenzij de waarnemend gerechtsdeurwaarder hem, na kennisgeving aan Onze Minister,
      toestemming heeft verleend om onder verantwoordelijkheid van de waarnemend gerechtsdeurwaarder zijn werkzaamheden
      als toegevoegd gerechtsdeurwaarder voort te zetten.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel28
  - number: '29.1'
    text: |-
      De toevoeging bedoeld, in [artikel 25, derde lid][ref1], of [artikel 27, eerste lid][ref2], eindigt van
      rechtswege:


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel27
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '27'
        hoofdstuk: III
        paragraaf: '2'
  - number: 29.1.a
    text: |-
      door opzegging dan wel het eindigen van de arbeidsovereenkomst van de kandidaat-gerechtsdeurwaarder of de
      toegevoegd gerechtsdeurwaarder of schorsing in zijn werkzaamheden door zijn werkgever;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: 29.1.b
    text: |-
      met ingang van de eerstvolgende maand na het bereiken van de 70-jarige leeftijd door de kandidaat-
      gerechtsdeurwaarder, toegevoegd gerechtsdeurwaarder of gerechtsdeurwaarder;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: 29.1.c
    text: |-
      door de onherroepelijke oplegging van de maatregel van ontzetting uit het ambt, ontslag of overlijden van de
      gerechtsdeurwaarder; of
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: 29.1.d
    text: door benoeming van de kandidaat-gerechtsdeurwaarder of toegevoegd gerechtsdeurwaarder tot gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: '29.2'
    text: |-
      De toevoeging wordt opgeschort met het ingaan van de schorsing van de gerechtsdeurwaarder in de uitoefening van het
      ambt. Indien voor de geschorste gerechtsdeurwaarder een waarnemend gerechtsdeurwaarder wordt benoemd kan hij diens
      kandidaat-gerechtsdeurwaarder of toegevoegd gerechtsdeurwaarder, na kennisgeving aan Onze Minister, toestemming
      geven ambtshandelingen te verrichten. Indien de waarnemend gerechtsdeurwaarder gedurende de duur van de schorsing
      komt te overlijden of wordt ontslagen, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: '29.3'
    text: 'Onze Minister kan de goedkeuring van de toevoeging intrekken:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: 29.3.a
    text: op verzoek van de kandidaat-gerechtsdeurwaarder of toegevoegd gerechtsdeurwaarder, of
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: 29.3.b
    text: |-
      indien er sprake is van andere omstandigheden dan bedoeld in het eerste lid waardoor niet langer wordt voldaan aan
      de voorwaarden voor toevoeging.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: '29.4'
    text: |-
      Indien zich feiten of omstandigheden voordoen die ingevolge het eerste lid leiden tot beëindiging van de toevoeging
      van rechtswege of ingevolge het derde lid grond kunnen vormen voor intrekking van de goedkeuring van de toevoeging,
      doen de gerechtsdeurwaarder en kandidaat-gerechtsdeurwaarder of de toegevoegd gerechtsdeurwaarder daarvan
      onverwijld mededeling aan de KBvG, Onze Minister en het Bureau.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel29
  - number: '30'
    text: |-
      Het toezicht op de naleving door de gerechtsdeurwaarder, de waarnemend gerechtsdeurwaarder, toegevoegd
      gerechtsdeurwaarder en kandidaat-gerechtsdeurwaarder van het bepaalde bij of krachtens deze wet, wordt uitgeoefend
      door het Bureau.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel30
  - number: 30a.1
    text: |-
      De bij besluit van het bestuur van het Bureau aangewezen personen die werkzaam zijn bij het Bureau, zijn belast met
      het houden van toezicht op de naleving van het bepaalde bij of krachtens deze wet. Van dat besluit wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel30a
  - number: 30a.2
    text: |-
      In aanvulling op [artikel 5:17 van de Algemene wet bestuursrecht][ref1] is een toezichthouder als bedoeld in het
      eerste lid bevoegd om inzage te vorderen in persoonlijke gegevens en bescheiden, voor zover deze betrekking hebben
      op de persoonlijke financiële administratie van de gerechtsdeurwaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 30b.1
    text: |-
      Indien het Bureau bij de uitoefening van het toezicht van feiten of omstandigheden blijkt die naar zijn
      oordeel grond opleveren voor het opleggen van een tuchtmaatregel, kan het een klacht indienen bij de kamer voor
      gerechtsdeurwaarders, tenzij toepassing wordt gegeven aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel30b
  - number: 30b.2
    text: |-
      Het Bureau kan voor de overtreding van het bepaalde bij of krachtens de [artikelen 17, eerste of vijfde lid][ref1],
      [19a][ref2], en [31, eerste lid][ref3], de overtreder een bestuurlijke boete en een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel31
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: 19a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 30b.3
    text: |-
      De bestuurlijke boete bedraagt ten hoogste het bedrag van de geldboete van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 30b.4
    text: |-
      Een bestuurlijke boete wordt niet opgelegd indien tegen de overtreder vanwege dezelfde gedraging een klacht bij de
      kamer voor gerechtsdeurwaarders is ingediend.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel30b
  - number: '31.1'
    text: |-
      De gerechtsdeurwaarder is verplicht de in [artikel 17, eerste lid][ref1], bedoelde stukken,
      vergezeld van een verslag van het onderzoek daarover van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], dat voor wat betreft de jaarrekening van
      het kantoor ten minste een beoordelingskarakter draagt, binnen zes maanden na afloop van elk boekjaar in te dienen
      bij het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '31.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende de wijze van indiening en de inhoud van het
      verslag, bedoeld in het eerste lid, alsmede de inhoud en wijze van verstrekking van overige gegevens aan het
      Bureau.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel31
  - number: '32'
    text: |-
      Het Bureau is belast met het doen van elk onderzoek naar de kantoor- en privé-administratie van
      de gerechtsdeurwaarder waartoe de voorzitter van de kamer van gerechtsdeurwaarders overeenkomstig
      [artikel 34, zesde lid][ref1], opdracht geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel34
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '33.1'
    text: |-
      Het Bureau verschaft aan de Commissie van deskundigen, bedoeld in [artikel 6, tweede lid][ref1], desverlangd
      inlichtingen in verband met het onderzoek van het ondernemingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel6
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '33.2'
    text: |-
      Het bestuur van de KBvG is verplicht een ieder met een redelijk belang, in verband met het opstellen van
      een ondernemingsplan als bedoeld in [artikel 5][ref1], desverlangd inlichtingen te verschaffen over door
      gerechtsdeurwaarders verrichte ambtshandelingen. Bij algemene maatregel van bestuur kan worden bepaald dat het
      Bureau het bestuur van de KBvG de hiervoor benodigde gegevens verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 33a.1
    text: |-
      Indien de continuïteit van de praktijk van een gerechtsdeurwaarder vanwege de wijze van bedrijfsvoering in gevaar
      dreigt te komen, kan door de voorzitter van de kamer voor gerechtsdeurwaarders, ambtshalve, naar aanleiding
      van een klacht, dan wel op verzoek van de KBvG of het Bureau, na verhoor of – bij het niet verschijnen van de
      gerechtsdeurwaarder – na behoorlijke oproeping daartoe van de gerechtsdeurwaarder, voor een periode van maximaal
      een jaar een stille bewindvoerder worden benoemd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel33a
  - number: 33a.2
    text: |-
      De stille bewindvoerder geeft de gerechtsdeurwaarder advies en begeleiding bij zijn bedrijfsvoering en is tevens
      bevoegd om daaromtrent bindende aanwijzingen aan de gerechtsdeurwaarder te geven.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel33a
  - number: 33a.3
    text: Bij de benoeming wordt een honorarium vastgesteld dat ten laste komt van de gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel33a
  - number: 33a.4
    text: |-
      De voorzitter van de kamer voor gerechtsdeurwaarders kan instructies geven aan de stille bewindvoerder met
      betrekking tot de bewindvoering.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel33a
  - number: 33a.5
    text: |-
      De voorzitter van de kamer voor gerechtsdeurwaarders kan de bewindvoering te allen tijde opschorten of beëindigen,
      al dan niet op verzoek van de gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel33a
  - number: '34.1'
    text: |-
      De gerechtsdeurwaarder, waarnemend gerechtsdeurwaarder, toegevoegd gerechtsdeurwaarder, kandidaat-
      gerechtsdeurwaarder en degene die is toegevoegd in het kader van de stageverplichting bij de in
      [artikel 25, eerste lid][ref1], bedoelde opleiding, zijn aan tuchtrechtspraak onderworpen ter zake van enig
      handelen of nalaten in strijd met enige bij of krachtens deze wet gegeven bepaling en ter zake van enig handelen of
      nalaten dat een behoorlijk gerechtsdeurwaarder, waarnemend gerechtsdeurwaarder, toegevoegd gerechtsdeurwaarder of
      kandidaat-gerechtsdeurwaarder niet betaamt.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: '34.2'
    text: |-
      De tuchtrechtspraak wordt in eerste aanleg uitgeoefend door een kamer voor gerechtsdeurwaarders. De kamer voor
      gerechtsdeurwaarders is gevestigd te Amsterdam. Zij kan ook buiten de vestigingsplaats zitting houden.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34
  - number: '34.3'
    text: |-
      De tuchtrechtspraak wordt in hoger beroep uitgeoefend door het gerechtshof Amsterdam. Tegen beslissingen van het
      gerechtshof is geen hogere voorziening toegelaten, behoudens cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34
  - number: '34.4'
    text: |-
      Een lid dan wel plaatsvervangend lid van de kamer voor gerechtsdeurwaarders die gerechtsdeurwaarder is,
      wordt ingeval tegen hem een klacht is ingediend onderscheidenlijk een verzoek is gedaan als bedoeld in
      [artikel 37, tweede lid][ref1], vervangen door een door de president van het gerechtshof Amsterdam aan te wijzen
      ander lid dan wel plaatsvervangend lid, door Onze Minister benoemd op grond van [artikel 35, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel35
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '34.5'
    text: |-
      Degene die op grond van [artikel 51][ref1] is geschorst of op grond van [artikel 52][ref2] is ontslagen, dan wel
      degene van wie de toevoeging is beëindigd, blijft aan de tuchtrechtspraak onderworpen ter zake van enig handelen of
      nalaten als bedoeld in het eerste lid, gedurende de tijd dat hij werkzaam was als gerechtsdeurwaarder, toegevoegd
      gerechtsdeurwaarder, kandidaat-gerechtsdeurwaarder of toegevoegd in het kader van de stageverplichting bij de in
      [artikel 25, eerste lid][ref3], bedoelde opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '51'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '52'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: '34.6'
    text: |-
      De voorzitter van de kamer voor gerechtsdeurwaarders kan, indien hij zulks in het belang van het onderzoek
      wenselijk acht, het Bureau opdragen een onderzoek in te stellen en hem van zijn bevindingen verslag uit te brengen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34
  - number: 34a.1
    text: |-
      De kamer voor gerechtsdeurwaarders stelt jaarlijks een jaarverslag op alsmede een begroting van de in het
      daaropvolgende jaar te verwachten inkomsten en uitgaven met betrekking tot de uitvoering van de bij of krachtens
      deze wet opgedragen taken en daaruit voortvloeiende werkzaamheden op het terrein van de tuchtrechtspraak. De
      begrotingsposten worden van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: 34a.2
    text: |-
      Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar waarmee Onze Minister heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: 34a.3
    text: |-
      De kamer voor gerechtsdeurwaarders zendt de begroting voor een door Onze Minister te bepalen tijdstip voorafgaande
      aan het begrotingsjaar ter instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: 34a.4
    text: |-
      Onze Minister stemt niet in met de begroting dan nadat de KBvG is gehoord. De instemming kan worden onthouden
      wegens strijd met het recht of het algemeen belang. Ingeval van gebleken strijdigheid wordt instemming niet
      onthouden dan nadat de kamer voor gerechtsdeurwaarders in de gelegenheid is gesteld de begroting aan te passen,
      binnen een door Onze Minister te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: 34a.5
    text: |-
      Wanneer Onze Minister niet met de begroting heeft ingestemd vóór 1 januari van het jaar waarop deze betrekking
      heeft, kan de kamer voor gerechtsdeurwaarders, in het belang van een juiste uitvoering van zijn taak, voor het
      aangaan van verplichtingen en het verrichten van uitgaven beschikken over ten hoogste drie twaalfde gedeelten van
      de bedragen die bij de overeenkomstige onderdelen in de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: 34a.6
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en
      begrote baten en lasten dan wel inkomsten en uitgaven, doet de kamer voor gerechtsdeurwaarders daarvan onverwijld
      mededeling aan Onze Minister onder vermelding van de oorzaak en de verwachte omvang van de verschillen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: 34a.7
    text: |-
      De kamer voor gerechtsdeurwaarders zendt het jaarverslag voor een door Onze Minister te bepalen tijdstip aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: 34a.8
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de inrichting van de begroting en de inhoud van het
      jaarverslag.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel34a
  - number: '35.1'
    text: |-
      De kamer voor gerechtsdeurwaarders bestaat uit vijf leden, onder wie de voorzitter, en tien plaatsvervangende
      leden, onder wie twee of meer plaatsvervangend voorzitters.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel35
  - number: '35.2'
    text: |-
      Onze Minister benoemt drie leden, onder wie de voorzitter, alsmede zes plaatsvervangende leden, onder wie de
      plaatsvervangend voorzitters, uit voor het leven benoemde leden van de rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel35
  - number: '35.3'
    text: |-
      Onze Minister benoemt, de voorzitter van de kamer voor gerechtsdeurwaarders gehoord, twee leden en vier
      plaatsvervangende leden uit de in [artikel 56][ref1] genoemde leden van de KBvG, met uitzondering van degenen die
      zijn toegevoegd in het kader van de stageverplichting bij de in [artikel 25, eerste lid][ref2] bedoelde opleiding,
      op aanbeveling van de KBvG. De aanbeveling omvat voor iedere benoeming ten minste drie namen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '56'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: '35.4'
    text: |-
      De leden en de plaatsvervangende leden worden benoemd voor vier jaren; zij zijn bij hun aftreden eenmaal
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel35
  - number: '35.5'
    text: |-
      Het lidmaatschap van de kamer voor gerechtsdeurwaarders is onverenigbaar met het lidmaatschap van het bestuur van
      de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel35
  - number: '35.6'
    text: |-
      De daartoe door het bestuur van de rechtbank Amsterdam aangewezen gerechtsambtenaren, rechters in opleiding, senior
      gerechtsauditeurs en gerechtsauditeurs verrichten de werkzaamheden die bij of krachtens de wet aan de secretaris
      zijn opgedragen. Voor het verrichten van deze werkzaamheden kan hij zich met toestemming van de voorzitter doen
      vervangen door een andere door het bestuur van de rechtbank Amsterdam aangewezen gerechtsambtenaar, rechter in
      opleiding, senior-gerechtsauditeur of gerechtsauditeur.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel35
  - number: '35.7'
    text: |-
      De reis- en verblijfskosten van de voorzitter, de plaatsvervangend voorzitter, de leden, de plaatsvervangende leden
      en de secretaris komen ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel35
  - number: '36.1'
    text: |-
      De voorzitter, de leden, de plaatsvervangende leden en de secretaris van de kamer voor gerechtsdeurwaarders zijn
      verplicht tot geheimhouding van de gegevens waarover zij bij de uitoefening van hun taak de beschikking krijgen
      en waarvan zij het vertrouwelijke karakter kennen of redelijkerwijs moeten vermoeden, behoudens voor zover enig
      wettelijk voorschrift hen tot mededeling verplicht of uit hun ambt de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel36
  - number: '36.2'
    text: |-
      Het bepaalde in de [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2],
      [46d, tweede lid][ref3], [46f][ref4], [46i][ref5] met uitzondering van het eerste lid,
      onderdeel c, [46j][ref6], [46l, eerste en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref10] is van overeenkomstige toepassing ten aanzien van de
      leden en de plaatsvervangende leden van de kamer voor gerechtsdeurwaarders.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46ca
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '36.3'
    text: |-
      Het lidmaatschap van de kamer voor gerechtsdeurwaarders van leden en plaatsvervangend leden vervalt van rechtswege
      indien zij ophouden te voldoen aan de vereisten voor benoeming.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel36
  - number: '36.4'
    text: |-
      De [artikelen 13a][ref1], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref2], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref3] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van de leden en de plaatsvervangende leden van de kamer voor gerechtsdeurwaarders, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel13c
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0001830
        artikel: 13b
      - id: ref3
        bwb_id: BWBR0001830
        artikel: 13c
  - number: 36.4.a
    text: |-
      voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van de kamer voor gerechtsdeurwaarders; en
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel36
  - number: 36.4.b
    text: |-
      de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref1], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
  - number: '37.1'
    text: |-
      Aan de behandeling en de beslissing van tuchtzaken wordt op straffe van nietigheid deelgenomen door ten minste twee
      leden of plaatsvervangende leden, onder wie de voorzitter of de plaatsvervangend voorzitter, door Onze Minister
      benoemd op grond van [artikel 35, tweede lid, en een lid][ref1] of plaatsvervangend lid, door Onze Minister benoemd
      op grond van [artikel 35, derde lid][ref2]. Indien de voorzitter of plaatsvervangend voorzitter door na aanvang van
      de zaak opgekomen omstandigheden is verhinderd, kan deze worden vervangen door een op grond van artikel 35, tweede
      lid, door Onze Minister benoemd lid of plaatsvervangend lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel35
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '37.2'
    text: |-
      De kamer voor gerechtsdeurwaarders neemt een tegen een gerechtsdeurwaarder gerezen bezwaar in behandeling
      hetzij op verzoek van Onze Minister, hetzij op een bij de kamer ingediende klacht. Een verzoek van Onze
      Minister of een klacht wordt schriftelijk en met redenen omkleed ingediend bij de voorzitter van de kamer voor
      gerechtsdeurwaarders. Indien de klager daarom verzoekt, is de secretaris hem behulpzaam bij het op schrift
      stellen van de klacht. Indien de klacht wordt ingediend na verloop van drie jaren na de dag waarop de klager heeft
      kennisgenomen of redelijkerwijs kennis heeft kunnen nemen van het handelen of nalaten van de gerechtsdeurwaarder
      waarop de klacht betrekking heeft, wordt de klacht door de voorzitter niet-ontvankelijk verklaard. De beslissing
      tot niet-ontvankelijkverklaring blijft achterwege indien de gevolgen van het handelen of nalaten redelijkerwijs pas
      nadien bekend zijn geworden. In dat geval verloopt de termijn voor het indienen van een klacht een jaar na de datum
      waarop de gevolgen redelijkerwijs als bekend geworden zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.3'
    text: |-
      Voordat een tegen een gerechtsdeurwaarder gerezen bezwaar in behandeling wordt genomen op grond van een bij de
      kamer ingediende klacht, heft de secretaris van de kamer voor gerechtsdeurwaarders een griffierecht van € 50. Het
      griffierecht komt ten bate van de kamer voor gerechtsdeurwaarders.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.4'
    text: |-
      De secretaris wijst de klager op de verschuldigdheid van het griffierecht en deelt hem mee dat het verschuldigde
      bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn bijgeschreven op het daartoe
      bekend gemaakte bankrekeningnummer.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.5'
    text: |-
      Indien het griffierecht niet binnen de in het vierde lid bedoelde termijn is bijgeschreven op het daartoe bekend
      gemaakte bankrekeningnummer, dan wordt de klacht niet- ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.6'
    text: |-
      Indien een klacht in der minne is geschikt ingevolge het tiende lid, kan als onderdeel van de minnelijke schikking
      door partijen worden bepaald dat het door de klager betaalde griffierecht wordt vergoed door de betrokken
      gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.7'
    text: |-
      Indien de klacht geheel of gedeeltelijk gegrond wordt verklaard, wordt het door de klager betaalde griffierecht
      vergoed door de betrokken gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.8'
    text: 'In afwijking van het derde lid, wordt geen griffierecht geheven indien het verzoek of de klacht afkomstig is van:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: 37.8.a
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: 37.8.b
    text: het Bureau; of
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: 37.8.c
    text: de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.9'
    text: |-
      Onze Minister kan het in het derde lid bedoelde bedrag wijzigen voor zover de consumentenprijsindex daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.10'
    text: |-
      Indien de voorzitter van oordeel is dat een klacht onderscheidenlijk een verzoek vatbaar is voor minnelijke
      schikking, roept hij de klager onderscheidenlijk Onze Minister en de betrokken gerechtsdeurwaarder op ten einde een
      zodanige schikking te beproeven.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.11'
    text: |-
      Indien de klacht zich naar het oordeel van de voorzitter daartoe leent en uit de klacht blijkt dat deze nog niet
      is voorgelegd aan de geschillencommissie, bedoeld in [artikel 57, derde lid][ref1], kan de voorzitter besluiten
      de behandeling van de klacht te schorsen, en de klager in de gelegenheid stellen het geschil voor te leggen aan de
      geschillencommissie. Tegen de beslissing is geen voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel57
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '57'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '37.12'
    text: |-
      Indien de klacht onderscheidenlijk het verzoek, bedoeld in het derde lid, niet in der minne wordt opgelost en het
      geschil, bedoeld in het vierde lid, niet naar tevredenheid van beide partijen wordt opgelost, brengt de voorzitter
      de klacht ter kennis van de kamer voor gerechtsdeurwaarders.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '37.13'
    text: |-
      De leden van de kamer voor gerechtsdeurwaarders kunnen zich verschonen en kunnen worden gewraakt, indien er te
      hunnen aanzien feiten of omstandigheden bestaan waardoor in het algemeen de rechterlijke onpartijdigheid schade zou
      kunnen lijden. [Titel IV van het Vierde Boek van het Wetboek van Strafvordering](onbekend) is van overeenkomstige
      toepassing, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: 37.13.a
    text: |-
      in plaats van het openbaar ministerie en de verdachte Onze Minister, de gerechtsdeurwaarder en de klager een
      verzoek om wraking kunnen doen;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: 37.13.b
    text: |-
      deze voordracht mondeling of schriftelijk uiterlijk bij de aanvang van de behandeling moet worden gedaan, tenzij de
      feiten of omstandigheden die aan het verzoek ten grondslag liggen eerst in de loop van de behandeling ontstaan of
      bekend worden en
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: 37.13.c
    text: |-
      degene die met de andere leden van de kamer voor gerechtsdeurwaarders over wraking zal beslissen, wordt aangewezen
      uit de niet met de behandeling van de zaak belaste leden en plaatsvervangende leden van de kamer.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel37
  - number: '38.1'
    text: |-
      De kamer voor gerechtsdeurwaarders is bevoegd, al dan niet op verzoek van Onze Minister, het bestuur van de
      KBvG of het Bureau, een gerechtsdeurwaarder tegen wie een ernstig vermoeden is gerezen dat hij een van de in
      [artikel 34, eerste lid][ref1], bedoelde handelingen of verzuimen heeft gepleegd, in afwachting van een beslissing
      hierover te schorsen voor een periode van ten hoogste zes maanden. Zij kan deze periode eenmaal verlengen voor ten
      hoogste zes maanden of totdat een beslissing tot voordracht tot ontslag onherroepelijk is geworden. De kamer voor
      gerechtsdeurwaarders kan steeds de schorsing opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel34
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '38.2'
    text: |-
      De secretaris van de kamer voor gerechtsdeurwaarders stelt Onze Minister, het bestuur van de KBvG of het Bureau en
      de betrokken gerechtsdeurwaarder onverwijld in kennis van een schorsing als bedoeld in het eerste lid en van een
      beslissing tot verlenging dan wel de opheffing daarvan.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel38
  - number: '38.3'
    text: Over het voornemen tot schorsing wordt de betrokken gerechtsdeurwaarder gehoord.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel38
  - number: '38.4'
    text: |-
      Ingeval de kamer voor gerechtsdeurwaarders naar aanleiding van de in [artikel 34, eerste lid][ref1], bedoelde
      handelingen of verzuimen beslist tot het opleggen van een schorsing gedurende een bepaalde termijn, kan zij de
      periode van schorsing ingevolge het eerste lid in mindering brengen op die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel34
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '38.5'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien tegen een gerechtsdeurwaarder een strafrechtelijke
      vervolging ter zake van een misdrijf is ingesteld en het misdrijf mede het uitoefenen van het ambt van
      gerechtsdeurwaarder raakt.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel38
  - number: '38.6'
    text: |-
      Binnen dertig dagen na de mededeling, bedoeld in het tweede lid, kan Onze Minister, het bestuur van de KBvG, het
      Bureau of de betrokken gerechtsdeurwaarder daartegen bij met redenen omkleed beroepschrift beroep instellen bij het
      gerechtshof Amsterdam. Het beroep schorst de beslissing waartegen het is gericht niet.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel38
  - number: '39.1'
    text: |-
      De voorzitter kan zonder nader onderzoek door de kamer voor gerechtsdeurwaarders kennelijk niet-ontvankelijke en
      kennelijk ongegronde klachten alsmede klachten die naar zijn oordeel van onvoldoende gewicht zijn, bij met redenen
      omklede beslissing afwijzen. Van de beslissing van de voorzitter doet de secretaris onverwijld mededeling aan de
      klager en aan de betrokken gerechtsdeurwaarder. Het afschrift van de beslissing gaat vergezeld van de mededeling
      van de termijn waarbinnen en de wijze waarop verzet kan worden gedaan. Tegen de terkennisbrenging van de klacht
      staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel39
  - number: '39.2'
    text: |-
      Tegen de beslissing van de voorzitter tot afwijzing van een klacht kan de klager binnen veertien dagen na
      verzending van de kennisgeving schriftelijk verzet doen bij de kamer voor gerechtsdeurwaarders.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel39
  - number: '39.3'
    text: |-
      Ten gevolge van het verzet vervalt de beslissing, tenzij de kamer voor gerechtsdeurwaarders het verzet niet-
      ontvankelijk of ongegrond verklaart. De kamer voor gerechtsdeurwaarders kan het verzet niet niet-ontvankelijk of
      ongegrond verklaren dan na de klager en, zo nodig, de betrokken gerechtsdeurwaarder in de gelegenheid te hebben
      gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel39
  - number: '39.4'
    text: |-
      De beslissing op het verzet is met redenen omkleed. Tegen de beslissing staat geen rechtsmiddel open. Van de
      beslissing wordt schriftelijk kennis gegeven aan de klager en aan de betrokken gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel39
  - number: '40.1'
    text: |-
      Indien [artikel 39, eerste lid][ref1], geen toepassing vindt of het verzet gegrond is verklaard, zendt de
      secretaris zo spoedig mogelijk een afschrift van het klaagschrift en de daarbij gevoegde bescheiden aan de
      betrokken gerechtsdeurwaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel39
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '39'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '40.2'
    text: |-
      Binnen een maand na dagtekening van de verzending van de in het eerste lid bedoelde bescheiden kan de betrokken
      gerechtsdeurwaarder een verweerschrift indienen; de voorzitter kan deze termijn op verzoek verlengen. De secretaris
      zendt afschrift van dit geschrift aan de klager.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel40
  - number: '40.3'
    text: |-
      De voorzitter is bevoegd aan de betrokken gerechtsdeurwaarder te vragen binnen een door hem te bepalen termijn
      schriftelijke inlichtingen te verschaffen en onder hem berustende of te zijner beschikking staande bescheiden, al
      dan niet in gewaarmerkt afschrift, en voorwerpen in te zenden.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel40
  - number: '41.1'
    text: |-
      De voorzitter bepaalt het tijdstip voor de behandeling ter zitting van de zaak. De secretaris roept de betrokken
      gerechtsdeurwaarder en de klager ten minste tien dagen van tevoren schriftelijk op voor het tijdstip van
      behandeling.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel41
  - number: '41.2'
    text: |-
      Wordt op de zitting de behandeling van de zaak voor een bepaalde tijd uitgesteld of geschorst, dan wordt geen
      nieuwe kennisgeving als bedoeld in het eerste lid gedaan.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel41
  - number: '41.3'
    text: |-
      De behandeling ter zitting van de kamer voor gerechtsdeurwaarders geschiedt in het openbaar. De kamer voor
      gerechtsdeurwaarders kan om gewichtige redenen bevelen, dat de behandeling geheel of gedeeltelijk met gesloten
      deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel41
  - number: '41.4'
    text: |-
      De betrokken gerechtsdeurwaarder en de klager kunnen zich doen bijstaan of zich doen vertegenwoordigen door een
      gemachtigde.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel41
  - number: '41.5'
    text: |-
      De kamer voor gerechtsdeurwaarders kan weigeren bepaalde personen, die geen advocaat zijn, als raadsman toe te
      laten. Bij zodanige weigering houdt de kamer de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel41
  - number: '41.6'
    text: |-
      De secretaris van de kamer voor gerechtsdeurwaarders stelt de betrokken gerechtsdeurwaarder en de klager, alsmede
      hun gemachtigden dan wel degenen die hen bijstaan, tijdig tevoren in de gelegenheid om van de op de zaak betrekking
      hebbende stukken kennis te nemen. Met betrekking tot de voor de verstrekking van afschriften of uittreksels in
      rekening te brengen vergoedingen en met betrekking tot kosteloze verstrekkingen is het terzake bepaalde bij of
      krachtens de [Wet griffierechten burgerlijke zaken][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '41.7'
    text: |-
      Aan de betrokken gerechtsdeurwaarder en de klager of hun gemachtigden en aan degenen die hen bijstaan wordt de
      gelegenheid gegeven het woord te voeren en hun standpunt toe te lichten.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel41
  - number: '42.1'
    text: |-
      De kamer voor gerechtsdeurwaarders kan getuigen en deskundigen oproepen en horen. Het horen van getuigen en
      deskundigen kan ook aan één der leden van de kamer worden opgedragen. Ieder die als getuige of deskundige is
      opgeroepen, is verplicht aan de oproeping gevolg te geven. Hij is voorts verplicht op de gestelde vragen te
      antwoorden, onderscheidenlijk de van hem gevorderde diensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel42
  - number: '42.2'
    text: |-
      Op verzoek van de kamer voor gerechtsdeurwaarders doet de officier van justitie hen dagvaarden. De betrokkene is
      verplicht na dagvaarding te verschijnen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel42
  - number: '42.3'
    text: |-
      Verschijnt een getuige of een deskundige op de dagvaarding niet, dan doet de officier van
      justitie op verzoek van de kamer hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.
      [Artikel 6:1:5 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '42.4'
    text: |-
      De [artikelen 290][ref1] en [292, eerste en vierde lid][ref2], onderscheidenlijk
      [299 van het Wetboek van Strafvordering][ref3] zijn van overeenkomstige toepassing met betrekking tot het horen van
      een getuige onderscheidenlijk een deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel292
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel299
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '290'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '292'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '299'
  - number: '42.5'
    text: |-
      Ten aanzien van getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '42.6'
    text: |-
      De getuigen en deskundigen ontvangen indien zij dit wensen op vertoon van hun oproeping of dagvaarding
      schadeloosstelling, door de voorzitter van de kamer voor gerechtsdeurwaarders te begroten overeenkomstig het bij of
      krachtens de [Wet griffierechten burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '43.1'
    text: |-
      De beslissing van de kamer voor gerechtsdeurwaarders betreffende een tegen een gerechtsdeurwaarder gerezen bezwaar
      strekt tot niet-ontvankelijkverklaring, ongegrondverklaring of gegrondverklaring van het bezwaar. De beslissing is
      met redenen omkleed en wordt in het openbaar uitgesproken, alles op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: '43.2'
    text: |-
      Indien de kamer voor gerechtsdeurwaarders het bezwaar geheel of gedeeltelijk gegrond verklaart, kan zij de
      navolgende maatregelen opleggen:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: 43.2.a
    text: een waarschuwing;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: 43.2.b
    text: een berisping;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: 43.2.c
    text: een geldboete;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: 43.2.d
    text: |-
      de ontzegging van de bevoegdheid tot het aanwijzen van een toegevoegd gerechtsdeurwaarder of kandidaat-
      gerechtsdeurwaarder, voor bepaalde of onbepaalde duur;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: 43.2.e
    text: de schorsing in de uitoefening van het ambt voor de duur van ten hoogste één jaar;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: 43.2.f
    text: de ontzetting uit het ambt.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: '43.3'
    text: De kamer voor gerechtsdeurwaarders kan het bezwaar ook gegrond verklaren zonder oplegging van een maatregel.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: '43.4'
    text: |-
      De maatregel van een geldboete kan gelijktijdig worden opgelegd met een andere maatregel. Bij de beslissing tot
      oplegging van een maatregel als bedoeld in het tweede lid kan worden bepaald dat deze wordt openbaar gemaakt op een
      daarbij voorgeschreven wijze, indien enig door [artikel 34, eerste lid][ref1], beschermd belang dat vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel34
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '43.5'
    text: |-
      Tot de tenuitvoerlegging van een maatregel wordt eerst overgegaan na het onherroepelijk worden van de beslissing of
      op een in de beslissing bepaald later tijdstip.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: '43.6'
    text: |-
      De geldboete, bedoeld het tweede lid, onderdeel c, bedraagt ten hoogste het bedrag van de vierde categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1]. Een beslissing tot oplegging van
      een geldboete bepaalt de termijn waarbinnen deze moet zijn voldaan. Op verzoek van de gerechtsdeurwaarder kan de
      voorzitter de termijn verlengen. Wordt de boete niet binnen de gestelde termijn voldaan, dan kan de kamer voor
      gerechtsdeurwaarders ambtshalve beslissen de gerechtsdeurwaarder, na hem in de gelegenheid te hebben gesteld te
      worden gehoord, op deze grond een of meer maatregelen als bedoeld in het tweede lid op te leggen. De opgelegde
      boete komt ten bate van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '43.7'
    text: |-
      De secretaris van de kamer voor gerechtsdeurwaarders zendt haar beslissing onverwijld schriftelijk aan Onze
      Minister, het bestuur van de KBvG, het Bureau, de betrokken gerechtsdeurwaarder en de klager. De kamer kan in haar
      beslissing bepalen, dat aan de klager slechts kennis wordt gegeven van dat deel van de beslissing dat voor hem van
      belang is.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: '43.8'
    text: |-
      In het geval waarin de kamer voor gerechtsdeurwaarders de ontzetting uit het ambt gelast, bepaalt zij tevens de
      termijn waarbinnen betrokkene niet tot waarnemer kan worden benoemd of aan een gerechtsdeurwaarder kan worden
      toegevoegd. Deze termijn bedraagt maximaal tien jaren.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
  - number: '43.9'
    text: |-
      [Artikel 195 van het Wetboek van Strafrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel195
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '195'
  - number: 43a.1
    text: |-
      Indien een klacht geheel of gedeeltelijk gegrond wordt verklaard en een maatregel wordt opgelegd als bedoeld in
      [artikel 43, tweede lid][ref1], kan de uitspraak tevens inhouden een veroordeling van de gerechtsdeurwaarder in:


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel43
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 43a.1.a
    text: de kosten die de klager in verband met de behandeling van de klacht redelijkerwijs heeft moeten maken; en
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43a
  - number: 43a.1.b
    text: de overige kosten die in verband met de behandeling van de zaak zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43a
  - number: 43a.2
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing voor zover de klacht is ingediend door Onze Minister, het
      Bureau of de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43a
  - number: 43a.3
    text: |-
      In geval van een veroordeling in de kosten als bedoeld in het eerste lid, onderdeel a, ten behoeve van de klager
      een toevoeging is verleend krachtens de [Wet op de rechtsbijstand][ref1], wordt het bedrag van die kosten betaald
      aan de rechtsbijstandverlener. De rechtsbijstandverlener stelt de klager zoveel mogelijk schadeloos voor de
      door deze voldane eigen bijdrage. De rechtsbijstandverlener doet aan de raad voor rechtsbijstand opgave van een
      kostenvergoeding door beklaagde. In geval ten behoeve van de klager geen toevoeging is verleend, worden de kosten
      betaald aan de klager.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 43a.4
    text: |-
      Op een veroordeling in de kosten als bedoeld in het eerste lid, onderdeel b, is het bepaalde in
      [artikel 43, zesde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel43
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 43a.5
    text: |-
      De vergoeding van de kosten als bedoeld in het eerste lid, onderdeel b, wordt in mindering gebracht op de in
      [artikel 78][ref1] bedoelde kosten die samenhangen met tuchtrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel78
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '78'
        hoofdstuk: VI
        paragraaf: '5'
  - number: 43b.1
    text: |-
      De beslissing tot het opleggen van een geldboete of een proceskostenveroordeling levert een executoriale titel op,
      die met toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 43b.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de tenuitvoerlegging van de beslissing,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel43b
  - number: '44'
    text: |-
      De [artikelen 40 tot en met 43b][ref1] zijn van overeenkomstige toepassing op de behandeling van een bezwaar tegen
      een gerechtsdeurwaarder op verzoek van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel40
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '45.1'
    text: |-
      Tegen een beslissing van de kamer voor gerechtsdeurwaarders inzake een tegen een gerechtsdeurwaarder gerezen
      bezwaar kan door Onze Minister, de betrokken gerechtsdeurwaarder of de klager binnen dertig dagen na dagtekening
      van de schriftelijke kennisgeving, bedoeld in [artikel 43, zevende lid][ref1], bij met redenen omkleed
      beroepschrift, hoger beroep worden ingesteld bij het gerechtshof Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel43
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '45.2'
    text: |-
      Het beroepschrift wordt ingediend bij de griffier van het gerechtshof tezamen met een afschrift van de beslissing
      waartegen het beroep is gericht.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
  - number: '45.3'
    text: Het beroep wordt behandeld door een kamer van het gerechtshof, belast met de behandeling van burgerlijke zaken.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
  - number: '45.4'
    text: |-
      De leden van het gerechtshof kunnen zich verschonen en kunnen worden gewraakt, indien er te hunnen aanzien feiten
      of omstandigheden bestaan, waardoor in het algemeen de rechterlijke onpartijdigheid schade zou kunnen lijden.
      [Titel IV van het Vierde Boek van het Wetboek van Strafvordering](onbekend) is van overeenkomstige toepassing met
      dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
  - number: 45.4.a
    text: |-
      in plaats van het openbaar ministerie en de verdachte Onze Minister, de gerechtsdeurwaarder en de klager een
      verzoek om wraking kunnen doen;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
  - number: 45.4.b
    text: |-
      deze voordracht mondeling of schriftelijk uiterlijk bij de aanvang van de behandeling moet worden gedaan, tenzij de
      feiten of omstandigheden die aan het verzoek ten grondslag liggen eerst in de loop van de behandeling ontstaan of
      bekend worden en
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
  - number: 45.4.c
    text: |-
      degene die met de andere leden van het gerechtshof over wraking zal beslissen, wordt aangewezen uit de niet met de
      behandeling van de zaak belaste leden en plaatsvervangende leden van het hof.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
  - number: '45.5'
    text: Door het beroep wordt de tenuitvoerlegging van de opgelegde maatregel geschorst.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
  - number: '45.6'
    text: |-
      [Artikel 38][ref1] is van overeenkomstige toepassing gedurende de behandeling van het hoger beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel38
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '46.1'
    text: |-
      De griffier geeft zo spoedig mogelijk kennis van het beroep onder toezending van een afschrift van het
      beroepschrift, aan de kamer voor gerechtsdeurwaarders alsmede aan Onze Minister onderscheidenlijk de
      gerechtsdeurwaarder of de klager, voor zover het beroep niet door hem is ingesteld.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel46
  - number: '46.2'
    text: |-
      De kamer voor gerechtsdeurwaarders doet binnen drie weken na ontvangst van de kennisgeving, bedoeld in het eerste
      lid, de stukken die op de zaak betrekking hebben, toekomen aan het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel46
  - number: '47'
    text: |-
      Op de behandeling van het hoger beroep is het bepaalde bij en krachtens de
      [artikelen 37, derde tot en met vijfde lid en zevende tot en met negende lid][ref1],
      [40, tweede en derde lid][ref2], en [41 tot en met 43b][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel41
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '48.1'
    text: |-
      Het gerechtshof bevestigt de beslissing van de kamer voor gerechtsdeurwaarders, hetzij met overneming, hetzij met
      verbetering van de gronden, of doet met gehele of gedeeltelijke vernietiging van de beslissing, hetgeen de kamer
      voor gerechtsdeurwaarders had behoren te doen. De beslissing van het gerechtshof is met redenen omkleed en wordt in
      het openbaar uitgesproken, alles op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel48
  - number: '48.2'
    text: |-
      Indien het gerechtshof een beslissing van de kamer voor gerechtsdeurwaarders tot niet-ontvankelijkheid vernietigt,
      wordt de zaak ter verdere behandeling teruggezonden aan de kamer voor gerechtsdeurwaarders.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel48
  - number: '48.3'
    text: |-
      Indien alleen de betrokken gerechtsdeurwaarder hoger beroep heeft ingesteld, kan het gerechtshof alleen met
      eenparigheid van stemmen de opgelegde maatregel verzwaren.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel48
  - number: '48.4'
    text: |-
      De griffier zendt onverwijld afschrift van de beslissing van het gerechtshof aan de kamer voor
      gerechtsdeurwaarders, aan Onze Minister, het bestuur van de KBvG, het Bureau, de betrokken gerechtsdeurwaarder en
      aan de klager.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel48
  - number: '48.5'
    text: |-
      De griffier zendt zo spoedig mogelijk afschrift van een beslissing als bedoeld in het tweede lid, aan de kamer voor
      gerechtsdeurwaarders, onder medezending van de op de zaak betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel48
  - number: '49.1'
    text: 'Het bepaalde in dit hoofdstuk ten aanzien van een gerechtsdeurwaarder is van overeenkomstige toepassing op een:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel49
  - number: 49.1.a
    text: |-
      waarnemend gerechtsdeurwaarder met dien verstande dat, ingeval jegens hem een bezwaar geheel of gedeeltelijk
      gegrond wordt verklaard, hij tevens als waarnemer in de uitoefening van het ambt kan worden geschorst voor bepaalde
      duur.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel49
  - number: 49.1.b
    text: |-
      een toegevoegd gerechtsdeurwaarder of een kandidaat-gerechtsdeurwaarder en degene die is toegevoegd in het kader
      van de stageverplichting bij de in [artikel 25, eerste lid][ref1], bedoelde opleiding, met dien verstande dat,
      ingeval jegens hem een bezwaar geheel of gedeeltelijk gegrond wordt verklaard, de tuchtmaatregelen als bedoeld
      in [artikel 43, tweede lid, onderdelen a, b en c][ref2], kunnen worden opgelegd, alsmede de tuchtmaatregel van
      ontzegging van de bevoegdheid om als toegevoegd gerechtsdeurwaarder of kandidaat-gerechtsdeurwaarder op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel43
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Bij de beslissing waarin de ontzegging van de bevoegdheid om als toegevoegd gerechtsdeurwaarder of kandidaat-
      gerechtsdeurwaarder op te treden wordt gelast, wordt tevens de termijn waarbinnen betrokkene niet tot waarnemer
      kan worden benoemd of aan een gerechtsdeurwaarder kan worden toegevoegd bepaald. Deze termijn bedraagt maximaal
      tien jaren.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel49
  - number: '50.1'
    text: |-
      Een gerechtsdeurwaarder of waarnemend gerechtsdeurwaarder die is geschorst, is niet bevoegd tot het verrichten van
      enige ambtshandeling, uit welken hoofde ook. Het is hem gedurende de schorsing verboden zijn ambtstitel te voeren
      of te vermelden bij enige werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel50
  - number: '50.2'
    text: Schorsing kan grond opleveren voor ontslag uit een benoeming tot waarnemend gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel50
  - number: '51'
    text: 'Een gerechtsdeurwaarder of waarnemend gerechtsdeurwaarder is van rechtswege geschorst:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel51
  - number: 51.a
    text: wanneer hij rechtens van zijn vrijheid is beroofd;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel51
  - number: 51.b
    text: indien hem surséance van betaling is verleend en gedurende zijn faillissement;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel51
  - number: 51.c
    text: indien hij onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel51
  - number: 51.d
    text: indien zijn goederen onder bewind zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel51
  - number: 51.e
    text: indien ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel51
  - number: '52.1'
    text: |-
      De gerechtsdeurwaarder is met ingang van de eerstvolgende maand na het bereiken van de leeftijd van zeventig jaar
      van rechtswege ontslagen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: '52.2'
    text: 'De gerechtsdeurwaarder wordt bij koninklijk besluit ontslag verleend:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: 52.2.a
    text: op zijn verzoek;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: 52.2.b
    text: |-
      op een onherroepelijk geworden beslissing tot ontzetting uit het ambt als bedoeld in
      [artikel 43, tweede lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel43
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 52.2.c
    text: |-
      indien hij niet langer de Nederlandse nationaliteit bezit, of de nationaliteit van een andere lidstaat van de
      Europese Unie, van een overige staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of van de Zwitserse Bondsstaat.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: '52.3'
    text: 'De gerechtsdeurwaarder kan ontslag worden verleend bij besluit van Onze Minister op grond van:'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: 52.3.a
    text: een onherroepelijk geworden rechterlijke uitspraak, waarbij hij onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: 52.3.b
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: 52.3.c
    text: een onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: 52.3.d
    text: faillissement, surséance van betaling of toepassing van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: 52.3.e
    text: |-
      blijvende ongeschiktheid voor de vervulling van het ambt van gerechtsdeurwaarder, uit hoofde van ziekte of
      gebreken.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: '52.4'
    text: Het ontslag van een gerechtsdeurwaarder houdt tevens zijn ontslag in als waarnemend gerechtsdeurwaarder.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel52
  - number: '53.1'
    text: |-
      Tegen een besluit tot ontslag als bedoeld in [artikel 52, derde lid][ref1], kan de gerechtsdeurwaarder binnen
      één maand na dagtekening van het besluit, bij met redenen omkleed geschrift, in te dienen bij de secretaris van
      de kamer voor gerechtsdeurwaarders, beroep instellen bij de kamer voor gerechtsdeurwaarders, op grond dat dit
      onrechtmatig is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel52
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '52'
        hoofdstuk: V
  - number: '53.2'
    text: |-
      De secretaris van de kamer voor gerechtsdeurwaarders doet Onze Minister onverwijld een afschrift toekomen van het
      beroepschrift.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel53
  - number: '53.3'
    text: |-
      Op de behandeling van het beroepschrift zijn de [artikelen 40, tweede en derde lid][ref1], [41][ref2] en [42][ref3]
      van toepassing. [Hoofdstuk 6 van de Algemene wet bestuursrecht][ref4] vindt geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '6'
  - number: '53.4'
    text: |-
      De kamer voor gerechtsdeurwaarders verklaart het beroep niet-ontvankelijk, ongegrond of gegrond. Bij
      gegrondverklaring vernietigt zij het besluit waartegen het beroep was ingesteld. De beslissing van de kamer is met
      redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel53
  - number: '53.5'
    text: |-
      De secretaris van de kamer voor gerechtsdeurwaarders stelt Onze Minister en de betrokken gerechtsdeurwaarder
      onverwijld in kennis van de beslissing van de kamer voor gerechtsdeurwaarders.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel53
  - number: '54.1'
    text: |-
      Binnen een maand na dagtekening van de kennisgeving, bedoeld in [artikel 53, vijfde lid][ref1], kunnen de betrokken
      gerechtsdeurwaarder en Onze Minister bij met redenen omkleed geschrift, in te dienen bij de griffier, tegen de
      beslissing van de kamer voor gerechtsdeurwaarders hoger beroep instellen bij het gerechtshof Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel53
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '53'
        hoofdstuk: V
  - number: '54.2'
    text: |-
      Op de behandeling van het hoger beroep zijn de [artikelen 40, tweede en derde lid][ref1], [41][ref2],
      [42][ref3], [45, tweede tot en met vierde lid][ref4], en [46][ref5] van overeenkomstige toepassing.
      [Hoofdstuk 6 van de Algemene wet bestuursrecht][ref6] vindt geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0012197#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0012197#Artikel46
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012197
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0012197
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0005537
        hoofdstuk: '6'
  - number: '54.3'
    text: |-
      Het gerechtshof bevestigt de beslissing van de kamer voor gerechtsdeurwaarders, hetzij met overneming, hetzij met
      verbetering van de gronden, of doet met gehele of gedeeltelijke vernietiging van de beslissing, hetgeen de kamer
      voor gerechtsdeurwaarders had behoren te doen. [Artikel 48][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel48
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '55'
    text: |-
      Een besluit tot ontslag als bedoeld in [artikel 52, derde lid][ref1], treedt niet in werking voordat het
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel52
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '52'
        hoofdstuk: V
  - number: '56'
    text: |-
      De Koninklijke Beroepsorganisatie van Gerechtsdeurwaarders is een openbaar lichaam in de zin van
      [artikel 134 van de Grondwet][ref1]. Alle in Nederland gevestigde gerechtsdeurwaarders, waarnemend
      gerechtsdeurwaarders , toegevoegd gerechtsdeurwaarders, kandidaat-gerechtsdeurwaarders en degenen die zijn
      toegevoegd in het kader van de stageverplichting bij de in [artikel 25, eerste lid][ref2], bedoelde opleiding zijn
      leden van de KBvG. De KBvG is gevestigd te ’s-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel25
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: '57.1'
    text: De KBvG heeft tot taak de bevordering van een goede beroepsuitoefening door de leden en van hun vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel57
  - number: '57.2'
    text: |-
      Bij verordening worden beroeps- en gedragsregels van de leden van de KBvG vastgesteld. Tevens kunnen bij
      verordening regels worden gesteld betreffende de bevordering van de vakbekwaamheid van de leden en de kwaliteit van
      de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel57
  - number: '57.3'
    text: |-
      Bij verordening worden regels gesteld betreffende de inrichting van een algemene klachten- en geschillenregeling
      voor gerechtsdeurwaarders, waaronder de instelling van een geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel57
  - number: 57a.1
    text: |-
      De KBvG is verantwoordelijk voor het uitvoeren van kwaliteitstoetsen bij haar leden. De kwaliteitstoetsen worden
      verricht door deskundigen die zijn aangewezen door het bestuur van de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel57a
  - number: 57a.2
    text: |-
      Op het verrichten van de kwaliteitstoetsen en de krachtens het eerste lid aangewezen personen, zijn de
      [artikelen 5:12][ref1], [5:13][ref2], [5:14][ref3], [5:15, eerste en derde lid][ref4], [5:16][ref5], [5:17][ref6],
      [5:18][ref7] en [5:20, eerste lid, van de Algemene wet bestuursrecht][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 57a.3
    text: |-
      Bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] kunnen worden verwerkt door de
      krachtens het eerste lid aangewezen deskundigen, voor zover deze gegevens noodzakelijk zijn voor de doelmatige en
      doeltreffende uitvoering van kwaliteitstoetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 57a.4
    text: Bij verordening worden nadere regels gesteld betreffende het verrichten van de kwaliteitstoetsen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel57a
  - number: '58'
    text: De KBvG heeft een bestuur, een ledenraad en een algemene ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel58
  - number: '59'
    text: De KBvG houdt een bureau in stand, dat het bestuur bijstaat in de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel59
  - number: '60.1'
    text: |-
      Het bestuur is belast met de algemene leiding van de KBvG en met de uitoefening van haar in [artikel 57][ref1]
      omschreven taken, alsmede met het beheer en de beschikking over haar vermogen. Het geeft voorts algemene leiding
      aan het bureau van de KBvG en regelt zijn werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel57
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '57'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '60.2'
    text: Het bestuur kan nadere regels stellen betreffende zijn werkwijze en die van het bureau.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel60
  - number: '60.3'
    text: |-
      Het bestuur stelt jaarlijks een verslag op over zijn werkzaamheden ten behoeve van de algemene ledenvergadering en
      zendt dit om advies aan de ledenraad. Het brengt het verslag ter kennis van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel60
  - number: '60.4'
    text: |-
      Het bestuur stelt jaarlijks een verantwoording op van zijn financieel beleid alsmede een begroting voor het komende
      boekjaar, met toelichting, en zendt deze stukken om advies aan de ledenraad.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel60
  - number: '61.1'
    text: |-
      Het bestuur bestaat uit een oneven aantal van ten minste vijf leden. De samenstelling van het bestuur
      weerspiegelt zoveel mogelijk de verhouding binnen de algemene ledenvergadering tussen gerechtsdeurwaarders en
      toegevoegd gerechtsdeurwaarders of kandidaat-gerechtsdeurwaarders. De voorzitter en zijn plaatsvervanger zijn
      gerechtsdeurwaarders.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel61
  - number: '61.2'
    text: |-
      De leden worden benoemd voor een termijn van drie jaren en kunnen na aftreden terstond voor eenzelfde termijn
      eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel61
  - number: '61.3'
    text: |-
      Het bestuur vertegenwoordigt de KBvG. Daartoe zijn ook gezamenlijk bevoegd de voorzitter of de plaatsvervangend
      voorzitter en een van de andere leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel61
  - number: '62'
    text: |-
      De voorzitter van het bestuur van de KBvG is in die hoedanigheid belast met de leiding van de vergadering van de
      algemene ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel62
  - number: '63.1'
    text: |-
      De ledenraad bestaat uit vijftien leden. De gekozen leden vormen een afspiegeling van de binnen de
      beroepsgroep bestaande verhouding tussen gerechtsdeurwaarders en toegevoegd gerechtsdeurwaarders of kandidaat-
      gerechtsdeurwaarders. Ieder lid heeft een plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel63
  - number: '63.2'
    text: |-
      De gewone leden en hun plaatsvervangers worden door de algemene ledenvergadering gekozen voor een termijn van drie
      jaren en zij zijn herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel63
  - number: '64'
    text: |-
      De ledenraad heeft de zorg voor de vaststelling van het algemene beleid van de KBvG en treedt daartoe zonodig in
      overleg met het bestuur. Het bestuur stelt de ledenraad desgevraagd of eigener beweging in kennis van alle gegevens
      die voor het algemeen beleid van de KBvG van belang kunnen zijn, in het bijzonder gegevens betreffende zaken die
      het bestuur in uitvoering of behandeling heeft of die het in voorbereiding of onderzoek heeft genomen. De ledenraad
      is bevoegd het bestuur te allen tijde inlichtingen te vragen of onderzoek op te dragen betreffende onderwerpen die
      voor de bepaling van het beleid der KBvG van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel64
  - number: '65'
    text: De ledenraad is belast met het vaststellen van verordeningen van de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel65
  - number: '66'
    text: |-
      De ledenraad overlegt met het bestuur over de voorstellen van verordeningen van de KBvG, na daarover het advies van
      de algemene ledenvergadering te hebben ingewonnen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel66
  - number: '67.1'
    text: |-
      De ledenraad benoemt het bestuur van de KBvG en kan, met inachtneming van [artikel 61][ref1], het aantal der leden
      daarvan bepalen. De ledenraad benoemt de voorzitter en zijn plaatsvervanger uit de leden van het bestuur voor een
      termijn van drie jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel61
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '61'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '67.2'
    text: Het lidmaatschap van het bestuur is niet verenigbaar met het lidmaatschap van de ledenraad.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel67
  - number: '67.3'
    text: De ledenraad kan nadere regels vaststellen betreffende de benoeming en het aftreden van de leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel67
  - number: '68'
    text: |-
      De ledenraad oefent toezicht uit op het bestuur en hij kan de leden daarvan in hun functie schorsen of ontslaan,
      indien hij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel68
  - number: '69'
    text: |-
      De ledenraad brengt aan de jaarlijkse algemene ledenvergadering advies uit over het verslag van de werkzaamheden
      van het bestuur alsmede over de verantwoording van het financieel beleid, de ontwerp-begroting van de KBvG voor het
      komende jaar en de daarbij behorende toelichtingen, na deze stukken te hebben onderzocht.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel69
  - number: '70'
    text: |-
      De leden van de ledenraad kunnen door de algemene vergadering worden geschorst of ontslagen, indien zij het
      vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel70
  - number: '71'
    text: |-
      Het bestuur van de KBvG roept de ledenraad tenminste een maal per jaar bijeen om te beraadslagen over de in
      [artikel 69][ref1] bedoelde stukken. Andere vergaderingen worden bijeen geroepen zo dikwijls als het bestuur zulks
      nodig acht en voorts indien ten minste zes leden van de raad het bestuur schriftelijk daarom verzoeken, met opgave
      van de te behandelen onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel69
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '69'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '72'
    text: |-
      De vergaderingen van de ledenraad zijn openbaar. Er wordt met gesloten deuren vergaderd indien de voorzitter, de
      aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien ten minste acht leden
      van de raad daarom verzoeken. De leden van het bestuur van de KBvG, de directeur van het bureau van de KBvG en de
      secretarissen kunnen de besloten vergaderingen bijwonen, tenzij de ledenraad anders beslist. Over de toelating van
      andere personen beslist de ledenraad. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de ledenraad anders beslist.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel72
  - number: '73.1'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de benoeming en het aftreden van de leden, en voorts
      betreffende zijn werkzaamheid, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergadering
      wordt gestemd, alsmede de wijze waarop aan de leden van de KBvG kennis wordt gegeven van zijn besluiten.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel73
  - number: '73.2'
    text: Bij verordening kunnen nadere regels worden gesteld omtrent de inrichting van de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel73
  - number: '74'
    text: |-
      Het bestuur van de KBvG roept jaarlijks een algemene ledenvergadering bijeen. Buitengewone ledenvergaderingen
      worden bijeengeroepen zo dikwijls het bestuur zulks nodig acht en voorts indien de ledenraad of tenminste
      vijfentwintig leden van de KBvG het bestuur schriftelijk daarom verzoeken met opgave van de te behandelen
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel74
  - number: '75'
    text: |-
      De vergadering van de algemene ledenvergadering is openbaar. Er wordt met gesloten deuren vergaderd indien de
      voorzitter, de aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien tenminste
      twintig aanwezige leden daarom verzoeken. De leden van het bestuur, de directeur van het bureau van de KBvG en de
      secretarissen wonen de besloten vergadering bij, tenzij de vergadering anders beslist. Over de toelating van andere
      personen beslist de vergadering. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de vergadering anders beslist.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel75
  - number: '76'
    text: |-
      De algemene ledenvergadering beraadslaagt en beslist zonodig over het verslag van de werkzaamheden van het
      bestuur van de KBvG, alsmede over de financiële verantwoording, het verslag van de accountant, bedoeld in
      [artikel 79, tweede lid][ref1], de ontwerp-begroting voor het komende jaar en de daarbij behorende toelichtingen
      alsmede de over deze stukken door de ledenraad uitgebrachte adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel79
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '79'
        hoofdstuk: VI
        paragraaf: '5'
  - number: '77'
    text: |-
      Op voorstel van het bestuur van de KBvG stelt de algemene ledenvergadering nadere regels vast betreffende haar
      werkwijze, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergaderingen wordt gestemd, de
      wijze waarop te behandelen stukken of onderwerpen ter kennis worden gebracht van de leden, alsmede de wijze waarop
      haar besluiten aan de leden van de KBvG ter kennis worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel77
  - number: '78.1'
    text: |-
      De KBvG draagt alle kosten die uit de uitvoering van de haar door deze wet opgedragen taken voortvloeien. De
      kosten die samenhangen met de uitoefening van het bij of krachtens deze wet geregelde toezicht en ten laste komen
      van de Staat worden door de KBvG vergoed aan de Staat. De KBvG vergoedt eveneens de kosten die samenhangen met
      de uitoefening van de bij of krachtens deze wet geregelde tuchtrechtspraak en ten laste komen van de Staat. Ter
      dekking van deze kosten kan zij van de leden jaarlijks bijdragen heffen. De algemene ledenvergadering stelt,
      op voorstel van het bestuur, de hoogte van de bijdragen voor het boekjaar vast. Het bedrag daarvan kan voor
      verschillende categorieën van leden verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel78
  - number: '78.2'
    text: |-
      Bij verordening kunnen regels worden gesteld over de doorberekening van de kosten die de KBvG maakt in verband met
      de uitoefening van toezicht en tuchtrechtspraak aan haar leden.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel78
  - number: '79.1'
    text: |-
      Het boekjaar van de KBvG wordt vastgesteld door het bestuur. Vóór de aanvang van het boekjaar stelt de algemene
      ledenvergadering de begroting vast. Het bestuur dient daartoe een ontwerpbegroting in, vergezeld van de nodige
      toelichting en een advies van de ledenraad. Het ontwerp wordt door het bestuur, ten minste twee weken vóór de
      behandeling daarvan door de algemene ledenvergadering, op elektronische wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel79
  - number: '79.2'
    text: |-
      Het bestuur wijst telkens voor elk boekjaar een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] aan die is belast met de controle op de
      financiële verantwoording, bestaande uit een balans, een staat van baten en lasten en een toelichting. Deze brengt
      binnen drie maanden na afloop van het boekjaar daarover verslag uit aan het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '79.3'
    text: |-
      Binnen acht maanden na de afloop van het boekjaar legt het bestuur de financiële verantwoording met het daarover
      door de accountant uitgebrachte verslag aan de ledenraad over. De ledenraad brengt na onderzoek van deze stukken
      daarover verslag uit aan de algemene ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel79
  - number: '79.4'
    text: |-
      De vaststelling van de financiële verantwoording door de algemene ledenvergadering houdt tevens in décharge van het
      bestuur terzake.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel79
  - number: '80.1'
    text: |-
      Verordeningen worden slechts vastgesteld met betrekking tot onderwerpen waarvan deze wet regeling of nadere
      regeling bij verordening voorschrijft.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel80
  - number: '80.2'
    text: |-
      Verordeningen bevatten geen verplichtingen of voorschriften die niet strikt noodzakelijk zijn voor verwezenlijking
      van het doel dat met de verordening wordt beoogd en beperken niet onnodig de marktwerking.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel80
  - number: '80.3'
    text: |-
      Voorstellen van verordeningen worden aan de ledenraad gedaan door het bestuur of door ten minste vijf leden
      van de ledenraad. Alvorens een ontwerp-verordening bij de ledenraad in te dienen kan het bestuur de kamer voor
      gerechtsdeurwaarders uitnodigen haar oordeel kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel80
  - number: '80.4'
    text: De verordeningen van de KBvG zijn slechts verbindend voor haar leden en haar organen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel80
  - number: '80.5'
    text: |-
      Een verordening kan aan het bestuur van de KBvG de bevoegdheid toekennen tot het geven van nadere regels
      betreffende het in de verordening behandelde onderwerp.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel80
  - number: '81'
    text: |-
      Het voorstel van een verordening, wordt met een toelichting ten minste twee maanden vóór de dag waarop de ledenraad
      daarover beraadslaagt ter kennis gebracht van de leden van de KBvG. De algemene ledenvergadering brengt haar
      advies omtrent het voorstel ten minste drie weken vóór de dag waarop daarover wordt beraadslaagd ter kennis van
      de ledenraad.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel81
  - number: '82.1'
    text: |-
      Een verordening behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden wegens strijd met het
      recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel82
  - number: '82.2'
    text: |-
      Een verordening wordt, nadat zij is goedgekeurd, door de zorg van het bestuur van de KBvG bekend gemaakt door
      plaatsing in de Staatscourant. De verordening verbindt niet dan nadat zij is bekend gemaakt. Zij treedt in werking
      met ingang van de eerste dag van de tweede maand na die van de dag van de bekendmaking of zoveel eerder als zij
      zelf bepaalt, met dien verstande dat tussen de dag van de bekendmaking en die van de inwerkingtreding ten minste
      een termijn van tien dagen moet liggen.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel82
  - number: '83'
    text: |-
      Besluiten van de ledenraad, van het bestuur of van andere organen van de KBvG, niet zijnde een verordening die op
      grond van [artikel 82][ref1] rechtsgeldig tot stand is gekomen, kunnen bij koninklijk besluit worden vernietigd.
      Onverminderd [artikel 10:39 van de Algemene wet bestuursrecht][ref2] kan een besluit niet worden vernietigd, indien
      zes maanden zijn verstreken nadat het is bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '84'
    text: |-
      De KBvG verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel84
  - number: '85'
    text: |-
      Onze Minister zendt binnen vijf jaren na de inwerkingtreding van deze wet en vervolgens telkens na vier jaren aan
      de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de KBvG.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel85
  - number: '86.2'
    text: |-
      Aanstellingen tot gerechtsdeurwaarder, benoemingen tot waarnemend gerechtsdeurwaarder alsmede goedkeuringen van een
      aanwijzing tot toegevoegd kandidaat-gerechtsdeurwaarder, gedaan ingevolge het in het eerste lid bedoelde artikel,
      worden beschouwd als onderscheidenlijk benoemingen en goedkeuringen gedaan ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel86
  - number: '87.2'
    text: |-
      Het bij of krachtens die titel bepaalde blijft echter van toepassing met betrekking tot de vergoeding van
      ambtshandelingen welke voordien zijn verricht.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel87
  - number: '92'
    text: |-
      Onverminderd de mogelijkheid van ontslag om andere redenen worden gerechtsdeurwaarders die op het tijdstip van
      inwerkingtreding van deze wet zijn benoemd, in afwijking van [artikel 52, eerste lid][ref1], zoals dat luidde op
      het moment waarop het in werking trad, gedurende tien jaren na inwerkingtreding van deze wet van rechtswege ontslag
      verleend op de eerste dag van de maand volgend op die waarin zij de leeftijd van 70 jaren hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel52
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '52'
        hoofdstuk: V
  - number: '93.1'
    text: |-
      De vereniging genaamd Koninklijke Vereniging van Gerechtsdeurwaarders en gevestigd te Amsterdam wordt van
      rechtswege ontbonden op het tijdstip van inwerkingtreding van deze wet en wordt van rechtswege onder algemene titel
      opgevolgd door de KBvG. Het bestuur van de KBvG is bevoegd tot het nemen van alle maatregelen en beslissingen die
      uit de rechtsopvolging voortvloeien.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel93
  - number: '93.2'
    text: |-
      Onze Minister wijst, na daarover het gevoelen van de Koninklijke Vereniging van Gerechtsdeurwaarders te hebben
      ingewonnen, de personen aan die na de inwerkingtreding van de wet als voorzitter of als lid zitting hebben in
      het bestuur van de KBvG en de ledenraad voor een termijn van ten hoogste negentig dagen. Binnen die termijn geeft
      de ledenraad uitvoering aan [artikel 67, eerste lid][ref1], en geeft de algemene ledenvergadering uitvoering aan
      [artikel 63, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel63
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '67'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '63'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '94'
    text: |-
      Onze Minister kan de verordeningen als bedoeld in de [artikelen 17, vijfde lid][ref1], [57, tweede lid][ref2], en
      [73][ref3], voor de eerste maal als ministeriële regeling vaststellen, voor zover deze, naar het oordeel van Onze
      Minister, op de datum van inwerkingtreding van deze artikelen, in werking dienen te treden. Zij blijven, behoudens
      eerdere intrekking door Onze Minister, van kracht totdat zij bij verordening zijn ingetrokken en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel73
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '17'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '57'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '73'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '95'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende onderdelen
      en artikelen verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel95
  - number: '96'
    text: 'Deze wet wordt aangehaald als: Gerechtsdeurwaarderswet.'
    url: https://wetten.overheid.nl/BWBR0012197/2023-05-01#Artikel96
