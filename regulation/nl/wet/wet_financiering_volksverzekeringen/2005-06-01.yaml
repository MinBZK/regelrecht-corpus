  - number: 10a
    text: |-
      1 De premie voor de algemene ouderdomsverzekering bedraagt ten hoogste 18,25 procent.

      2 Onze Minister stelt het premiepercentage vast voor de algemene ouderdomsverzekering.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel10a
  - number: 10b
    text: |-
      1 Onze Minister kan bedragen vaststellen die als rijksbijdrage ten gunste komen van het Ouderdomsfonds.

      2 Onze Minister besluit jaarlijks of in het desbetreffende jaar een rijksbijdrage ten gunste van het Ouderdomsfonds
      komt.

      3 De omvang van een ten gunste van het Ouderdomsfonds komende rijksbijdrage wordt door Onze Minister bepaald.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel10b
  - number: '11'
    text: |-
      1 Bij ministeriële regeling wordt het premiepercentage voor de [Algemene nabestaandenwet][ref1] vastgesteld.

      2 Bij ministeriële regeling wordt door Onze Minister van Volksgezondheid, Welzijn en Sport in overeenstemming met
      Onze Minister het percentage voor de algemene verzekering bijzondere ziektekosten vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '12'
    text: |-
      Indien een wijziging van een premiepercentage ingaat op een ander tijdstip dan met ingang van 1 januari, wordt bij
      ministeriële regeling, in overeenstemming met Onze Minister van Financiën en indien het de premie voor de algemene
      verzekering bijzondere ziektekosten betreft mede in overeenstemming met Onze Minister van Volksgezondheid, Welzijn
      en Sport, een gemiddeld premiepercentage vastgesteld voor door Onze Minister aan te wijzen gevallen en tijdvakken.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel12
  - number: '13'
    text: De rijksbelastingdienst heft de premie voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel13
  - number: '14'
    text: |-
      De premie voor de volksverzekeringen wordt, onverminderd het bepaalde in [artikel 15][ref1] en onder
      verrekening van krachtens dat artikel geheven premie, bij wege van aanslag geheven met overeenkomstige
      toepassing van de voor de heffing van de inkomstenbelasting geldende regels, met uitzondering van
      [artikel 3 154 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.154
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3.154'
  - number: '15'
    text: |-
      1 Voor zoveel de premieplichtige aan de loonbelasting is onderworpen, wordt de premie voor de volksverzekeringen
      bij wijze van inhouding geheven met overeenkomstige toepassing van de voor de heffing van de loonbelasting geldende
      regels.

      2 Voor zoveel de premieplichtige aan de loonbelasting is onderworpen ingevolge
      [artikel 5a van de Wet op de loonbelasting 1964][ref1], is het eerste lid niet van toepassing.

      3 Bij ministeriële regeling kunnen voor daarbij aan te wijzen gevallen berekeningsvoorschriften worden vastgesteld
      aan de hand waarvan uit de in het tweede lid, van [artikel 25 van de Wet op de loonbelasting 1964][ref2], bedoelde
      tabellen het bedrag van de premie voor de volksverzekeringen wordt afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '25'
  - number: '16'
    text: |-
      1 De rijksbelastingdienst vordert de premie voor de volksverzekeringen in.

      2 Ten aanzien van de invordering van de ingevolge deze wet verschuldigde premie zijn, naar gelang
      [artikel 14][ref1] dan wel [artikel 15][ref2] van toepassing is, de regels geldende voor de invordering van de
      inkomstenbelasting onderscheidenlijk de loonbelasting van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel15
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel16
    references:
