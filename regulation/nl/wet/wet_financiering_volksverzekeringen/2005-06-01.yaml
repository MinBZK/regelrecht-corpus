  - number: 2a
    text: |-
      Voor de toepassing van hetgeen bij of krachtens deze wet is bepaald, wordt onder de premie
      voor de volksverzekeringen niet begrepen de nominale premie die de verzekerde ingevolge
      [artikel 17 van de Algemene Wet Bijzondere Ziektekosten][ref1] aan het ziekenfonds, de ziektekostenverzekeraar of
      het uitvoerend orgaan verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel17
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '17'
  - number: '3'
    text: |-
      Voor de toepassing van hetgeen bij of krachtens deze wet is bepaald, wordt verstaan onder verzekerde degene die in
      de zin van de volksverzekeringen verplicht verzekerd is.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van hetgeen bij of krachtens deze wet is bepaald, wordt onder "Onze Minister" verstaan: Onze
      Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel4
  - number: '5'
    text: |-
      Overeenkomstig hetgeen bij of krachtens deze wet is bepaald, worden de lasten van de volksverzekeringen en de
      vrijwillige verzekeringen gefinancierd met premie en met rijksbijdragen.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel5
  - number: '6'
    text: Premieplichtig voor de volksverzekeringen is de verzekerde.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel6
  - number: '7'
    text: De maatstaf voor de heffing van de premie voor de volksverzekeringen is het premie-inkomen van de premieplichtige.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel7
  - number: '8'
    text: |-
      Voor de heffing van de premie voor de volksverzekeringen bij wege van aanslag wordt onder premie-
      inkomen verstaan het belastbare inkomen uit werk en woning, bepaald volgens de regels van
      [hoofdstuk 3 van de Wet inkomstenbelasting 2001][ref1]. De toerekening van de gemeenschappelijke
      inkomensbestanddelen van de premieplichtige en zijn partner geschiedt overeenkomstig
      [artikel 2.17 van de Wet inkomstenbelasting 2001][ref2]. In het geval de premieplichtige en zijn partner beiden
      belastingplichtig zijn, geldt de gemaakte keuze, bedoeld in [artikel 2.17, tweede lid, van die wet][ref3], zowel
      voor de heffing van de inkomstenbelasting als voor de heffing van de premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2.17
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
      - id: ref2
