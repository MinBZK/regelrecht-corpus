  - number: '31'
    text: |-
      1 Er is een Spaarfonds AOW.

      2 Het Spaarfonds AOW is een begrotingsfonds als bedoeld in
      [artikel 9, eerste lid, van de Comptabiliteitswet 2001][ref1].

      3 De ontvangsten van het Spaarfonds AOW worden gevormd door bijdragen ten laste van de begroting van het Ministerie
      van Sociale Zaken en Werkgelegenheid en door renten op het saldo van het fonds.

      4 De uitgaven van het Spaarfonds AOW strekken ter bekostiging van lasten van de algemene ouderdomsverzekering.

      5 Onze Minister beheert de begroting van het Spaarfonds AOW.

      6 In afwijking van de [artikelen 2, derde lid][ref2], en [52, eerste lid, van de Comptabiliteitswet 2001][ref3]
      worden de begroting en de financiële verantwoording van het fonds uitsluitend op kasbasis gepresenteerd.

      7 Het gerealiseerde batig saldo van het Spaarfonds AOW van enig jaar wordt ten gunste gebracht van de begroting van
      het Spaarfonds AOW van het daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel52
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0013891
        artikel: '52'
  - number: '32'
    text: |-
      1 Jaarlijks komt een bijdrage als bedoeld in [artikel 31, derde lid][ref1], ten gunste van het Spaarfonds AOW.

      2 De omvang van elke ten gunste van het Spaarfonds AOW komende bijdrage wordt door Onze Minister in overeenstemming
      met Onze Minister van Financiën bepaald.

      3 In het jaar 1999 komt een bijdrage ten gunste van het Spaarfonds AOW die ten minste f 250 miljoen hoger is dan de
      als bijdragen voor de jaren 1997 en 1998 vastgestelde bedragen.

      4 In elk volgend jaar wordt een bijdrage ten gunste van het Spaarfonds AOW gebracht die ten minste € 113 445 054
      hoger is dan het bedrag dat in het jaar, voorafgaande aan het desbetreffende jaar, ten minste ten gunste van het
      Spaarfonds AOW diende te worden gebracht.

      5 Het in het Spaarfonds aanwezige saldo wordt rentedragend in 's Rijks schatkist aangehouden.

      6 Onze Minister van Financiën stelt jaarlijks de rente vast die over het saldo van het Spaarfonds AOW wordt
      vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel31
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '31'
        hoofdstuk: IV
  - number: '33'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën besluiten vanaf het jaar 2020 uit het
      Spaarfonds AOW lasten van de algemene ouderdomsverzekering te betalen.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel33
  - number: '34'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot dekking
      van de uitgaven, bedoeld in [artikel 35, tweede lid][ref1], in de vorm van een Algemeen Arbeidsongeschiktheidsfonds
      dat deel uitmaakt van het Uitvoeringsinstituut werknemersverzekeringen.

      2 Het beheer en de administratie in de vorm van een Algemeen Arbeidsongeschiktheidsfonds, bedoeld in
      het eerste lid, eindigen met ingang van de dag, gelegen vier jaar na de dag van inwerkingtreding van de
      [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008658
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '35'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0008658
  - number: '35'
    text: |-
      1 Ten gunste van het Algemeen Arbeidsongeschiktheidsfonds komen:

      a. de premies voor de algemene arbeidsongeschiktheidsverzekering en voor de vrijwillige algemene
      arbeidsongeschiktheidsverzekering;

      b. de boeten, bedoeld in artikel 20*a* van de Algemene Arbeidsongeschiktheidswet;

      c. de bedragen, verhaald op grond van artikel 57, zesde lid, van de Algemene Arbeidsongeschiktheidswet;

      d.

      e. de geldelijke bijdrage, bedoeld in artikel 5, eerste lid, van de Wet arbeid gehandicapte werknemers (*Stb.*
      1986, 300).

      2

      3 Bij algemene maatregel van bestuur kan worden bepaald dat andere bedragen dan als bedoeld in het tweede lid
      uit het Algemeen Arbeidsongeschiktheidsfonds worden betaald, voor zover deze andere bedragen betrekking hebben op
      lasten uit hoofde van de Algemene Arbeidsongeschiktheidswet.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel35
  - number: '38'
    text: |-
      Het College voor zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref1], verder te noemen: het College
      zorgverzekeringen beheert en administreert afzonderlijk een Algemeen Fonds Bijzondere Ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '39'
    text: |-
      1 Ten gunste van het Algemeen Fonds Bijzondere Ziektekosten komen:

      a. de premie voor de algemene verzekering bijzondere ziektekosten en voor de vrijwillige verzekering bijzondere
      ziektekosten;

      b. de inkomsten, die in verband met de algemene verzekering bijzondere ziektekosten voortvloeien uit internationale
      overeenkomsten;

      c. de bijdragen in de kosten van verstrekkingen welke op grond van
      [artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1], dan wel in voorkomend geval op grond
      van [artikel 6, vierde lid, in verbinding met het derde lid, van die wet][ref2] worden betaald door of namens de
      verzekerde, dan wel, in voorkomend geval, door het ingevolge een wettelijke regeling tot betaling van zodanige
      bijdragen bevoegde orgaan dat uitkeringen of pensioenen uit hoofde van die regeling aan die verzekerde betaalbaar
      stelt;

      d. de bijdrage in de kosten van de heffingskortingen, bedoeld in [artikel 44a][ref3].

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan jaarlijks een bijdrage verlenen aan het Algemeen
      Fonds Bijzondere Ziektekosten tot het bedrag dat daarvoor in de wet tot vaststelling van de begroting
      voor zijn ministerie voor dat jaar is toegestaan. De bijdrage wordt betaald in gelijke maandelijkse delen.
      [Artikel 14a, derde lid, van de Ziekenfondswet][ref4] is van overeenkomstige toepassing.

      3 Uit het Algemeen Fonds Bijzondere Ziektekosten worden betaald:

      a. de gehele of gedeeltelijke kosten van de algemene verzekering bijzondere ziektekosten en van de vrijwillige
      verzekering bijzondere ziektekosten;

      b. de uitgaven voor deze verzekering, voortvloeiende uit overeenkomsten, waaronder begrepen internationale
      overeenkomsten;

      c. de uitgaven die in verband met die verzekering voortvloeien uit enige andere wettelijke regeling dan de
      [Algemene Wet Bijzondere Ziektekosten][ref5];

      d. bijdragen aan onze Minister van Justitie in verband met diens financiële verantwoordelijkheid bedoeld in
      [artikel 6, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref6];

      e. bijdragen aan Onze Minister van Defensie ingevolge
      [artikel 7, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref7];

      f. uitgaven ten behoeve van subsidies, verstrekt ingevolge [artikel 1p van de Ziekenfondswet][ref8], voor zover
      zulks ingevolge dat artikel is bepaald;

      g. de uitgaven, bedoeld in [artikel 10, vierde lid][ref9], en [artikel 34 van de Wet op de orgaandonatie][ref10].

      4 Uit het Algemeen Fonds Bijzondere Ziektekosten kunnen middelen worden gebruikt voor het vormen en in stand houden
      van een reserve. Bij ministeriële regeling kunnen door Onze Minister van Volksgezondheid, Welzijn en Sport, in
      overeenstemming met Onze Minister met betrekking tot de vorige volzin nadere regels worden gesteld.

      5 Onverminderd het bepaalde in het tweede lid wordt jaarlijks aan het Algemeen Fonds Bijzondere Ziektekosten een
      bijdrage verleend voor de uitvoering van de Regeling Ziekenfondsraad Abortusklinieken 1992 dan wel de regeling die
      ingevolge [artikel 1p van de Ziekenfondswet][ref11] ter vervanging van die regeling is vastgesteld. Op de bijdrage
      worden voorschotten verleend. De bijdrage voor enig jaar is gelijk aan het saldo van de uitgaven en ontvangsten in
      het desbetreffende jaar met betrekking tot de uitvoering van de bedoelde regeling, voor zover door Onze Minister
      van Volksgezondheid, Welzijn en Sport aanvaard. Het College zorgverzekeringen neemt een specificatie van de
      ontvangsten en uitgaven op in het financieel verslag, bedoeld in [artikel 1s van de Ziekenfondswet][ref12]. Onze
      Minister voornoemd stelt de bijdrage uiterlijk drie maanden na ontvangst van het financieel verslag vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
