        artikel: '2.17'
  - number: '9'
    text: |-
      Voor de heffing van de premie voor de volksverzekeringen bij wijze van inhouding wordt onder premie-inkomen
      verstaan het belastbare loon in de zin van de [Wet op de loonbelasting 1964][ref1] met uitzondering van
      eindheffingsbestanddelen als bedoeld in [artikel 31, tweede lid, onderdelen f en g, van die wet][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '10'
    text: |-
      1 De premie voor de volksverzekeringen wordt vastgesteld op een percentage van het premie-inkomen. Het in de
      eerste zin bedoelde percentage is het totaal van het percentage, genoemd in [artikel 10a, tweede lid][ref1], en de
      percentages die op grond van [artikel 11][ref2] worden vastgesteld.

      2 In afwijking van het eerste lid is geen premie voor de algemene ouderdomsverzekering verschuldigd met ingang van
      de eerste dag van de maand waarin de verzekerde de leeftijd van 65 jaar zal bereiken.

      3 De verschuldigde premie voor de volksverzekeringen is de premie voor de volksverzekeringen verminderd met de voor
      de premieplichtige toepasselijke heffingskorting voor de volksverzekeringen.

      4 De heffingskorting voor de volksverzekeringen is de som van:

      a. indien betrokkene premieplichtig is voor de algemene ouderdomsverzekering: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref3] berekende heffingskorting voor de algemene
      ouderdomsverzekering;

      b. indien betrokkene premieplichtig is voor de nabestaandenverzekering: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref4] berekende heffingskorting voor de nabestaandenverzekering;

      c. indien betrokkene premieplichtig is voor de algemene verzekering bijzondere ziektekosten: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref5] berekende heffingskorting voor de algemene verzekering
      bijzondere ziektekosten.

      5 Indien de premie voor de volksverzekeringen bij wijze van inhouding wordt geheven,
      worden voor de toepassing van het vierde lid de heffingskortingen, genoemd in
      [artikel 8.2 van de Wet inkomstenbelasting 2001][ref6], die geen deel uitmaken van de standaardloonheffingskorting,
      bedoeld in [artikel 21c van de Wet op de loonbelasting 1964][ref7], geacht geen deel uit te maken van de
      standaardheffingskorting, bedoeld in [artikel 8.2 van de Wet inkomstenbelasting 2001][ref8].

      6 Het premie-inkomen wordt tot geen hoger bedrag in aanmerking genomen dan het als tweede vermelde bedrag in kolom
      II van de tarieftabel in [artikel 2.10 van de Wet inkomstenbelasting 2001][ref9].

      7 In geval [artikel 26b van de Wet op de loonbelasting 1964][ref10] van toepassing is, wordt de in dat artikel
      bedoelde werknemer geacht premieplichtig te zijn. Ten aanzien van deze werknemer wordt het in het eerste lid
      bedoelde percentage toegepast op het loon in de zin van de [Wet op de loonbelasting 1964][ref11].


