        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: '17'
    text: |-
      Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport nadere regels worden gesteld met betrekking tot hetgeen in de paragrafen 1 tot en
      met 5 is bepaald.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel17
  - number: '18'
    text: |-
      1 Indien een premieplichtige nalatig is gebleven over een bepaald jaar de op aanslag verschuldigde premie voor de
      volksverzekeringen te betalen, houdt de Sociale verzekeringsbank daarvan aantekening indien zij beslist dat van een
      schuldig nalaten sprake is.

      2 Een premieplichtige is schuldig nalatig indien hij nalaat de door hem op aanslag verschuldigde premie voor de
      volksverzekeringen te betalen. Voor zover de premieplichtige kan aantonen dat er omstandigheden aanwezig zijn
      op grond waarvan het niet betalen van de premie hem niet toegerekend kan worden, wordt afgezien van het schuldig
      nalatig stellen van de premieplichtige.

      3 In afwijking van het tweede lid, wordt van het schuldig nalatig stellen niet afgezien indien:

      a. de aanslag voor de premie voor de volksverzekeringen ambtshalve is vastgesteld omdat de premieplichtige geen of
      onvoldoende medewerking heeft verleend bij het vaststellen van het premie-inkomen;

      b. de premie voor de volksverzekeringen niet of niet geheel kan worden ingevorderd omdat is nagelaten te voldoen
      aan de krachtens de [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref1], [66][ref2] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] geldende verplichtingen; of

      c. de premieplichtige de bekendmaking van de beschikking met betrekking tot het stellen van een aantekening
      als bedoeld in het eerste lid bemoeilijkt of onmogelijk maakt omdat is nagelaten te voldoen aan de
      krachtens de [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref4], [66][ref5] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref6] geldende verplichtingen.

      4 Indien in het geval, waarin een aantekening is gesteld, de verzekerde binnen vijf jaren na de kennisgeving van
      die aantekening de op de in het eerste lid bedoelde aanslag verschuldigd gebleven premie voor de volksverzekeringen
      geheel of gedeeltelijk betaalt, wordt die betaling achtereenvolgens toegerekend aan:

      a. de kosten verbonden aan de invordering;

      b. de invorderingsrente;

      c. de verschuldigd gebleven inkomstenbelasting en de premie, verschuldigd gebleven voor de algemene verzekering
      bijzondere ziektekosten en de nabestaandenverzekering;

      d. een opslag van 5% op de premie, verschuldigd gebleven voor de algemene ouderdomsverzekering;

      e. de premie, verschuldigd gebleven voor de algemene ouderdomsverzekering.

      5 In het geval, bedoeld in het vierde lid, wordt voor zover de voor de algemene ouderdomsverzekering verschuldigd
      gebleven premie alsnog is betaald, de aantekening doorgehaald. De premieplichtige wordt geacht over het betrokken
      tijdvak in zoverre niet schuldig nalatig te zijn geweest.

      6 Aan de belanghebbende wordt bij brief met ontvangstbevestiging kennis gegeven van een beslissing met betrekking
      tot het stellen van een aantekening als bedoeld in het eerste lid dan wel tot het doorhalen van een zodanige
      aantekening. De Sociale verzekeringsbank bewaart de bewijsstukken van de verzending van het besluit.

      7 Bij ministeriële regeling kunnen met betrekking tot het bepaalde in dit artikel nadere regels worden gesteld.


