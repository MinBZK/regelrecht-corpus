preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bepalingen betreffende de financiering ingevolge
    de volksverzekeringen te herzien naar aanleiding van het rapport van de commissie tot vereenvoudiging van de
    loonbelasting en de inkomstenbelasting en deze bepalingen in een afzonderlijke wet onder te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van hetgeen bij of krachtens deze wet is bepaald, wordt verstaan onder:

      a. volksverzekeringen: de verzekeringen, bedoeld in de onderdelen *b* tot en met *e*;

      b. algemene ouderdomsverzekering: de verzekering, bedoeld in [artikel 6 van de Algemene Ouderdomswet][ref1];

      c. nabestaandenverzekering: de verzekering, bedoeld in [artikel 13 van de Algemene nabestaandenwet][ref2];

      d. algemene verzekering bijzondere Ziektekosten: de verzekering, bedoeld in
      [artikel 5 van de Algemene Wet Bijzondere Ziektekosten][ref3];

      e. algemene arbeidsongeschiktheidsverzekering: de verzekering, bedoeld in artikel 4 van de Algemene
      Arbeidsongeschiktheidswet, zoals deze verzekering gold tot de dag van de inwerkingtreding van de
      [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref4];

      f. Algemene Arbeidsongeschiktheidswet: de Algemene Arbeidsongeschiktheidswet en de daarop berustende
      bepalingen, zoals die wet en die bepalingen luidden op de dag voorafgaand aan de inwerkingtreding van de
      [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref5];

      g. Spaarfonds AOW: het Spaarfonds AOW, bedoeld in [artikel 31][ref6].


