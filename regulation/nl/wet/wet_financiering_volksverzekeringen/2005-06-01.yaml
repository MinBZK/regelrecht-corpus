      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0002614
  - number: '41'
    text: |-
      1 Het College zorgverzekeringen houdt de financiële middelen die deel uitmaken van het Algemeen Fonds Bijzondere
      Ziektekosten, in rekening-courant bij Onze Minister van Financiën.

      2 Het College zorgverzekeringen kan, voor de uitvoering van zijn wettelijke taken, beschikken over de financiële
      middelen die hij in rekening-courant bij Onze Minister van Financiën houdt.

      3 In afwijking van het eerste lid kan het College zorgverzekeringen een deel van de in het eerste lid bedoelde
      financiële middelen buiten de in het eerste lid bedoelde rekening-courant houden.

      4 Onze Minister van Financiën stelt in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport,
      na overleg met het College zorgverzekeringen, de omvang van het in het derde lid bedoelde deel van de financiële
      middelen vast.

      5 Bij een tekort aan financiële middelen maakt het College zorgverzekeringen gebruik van de kredietfaciliteiten die
      door Onze Minister van Financiën worden verleend.

      6 Onze Minister van Financiën informeert dagelijks het College zorgverzekeringen ten aanzien van de rekening-
      courant in elk geval met betrekking tot:

      a. de slotstanden per dag;

      b. alle dagelijks geboekte mutaties of transacties in de rekening-courant.

      7 Het College zorgverzekeringen informeert Onze Minister van Financiën ten aanzien van de rekening-courant, in elk
      geval met betrekking tot de prognoses van de saldi van de rekening-courant.

      8 Onze Minister van Financiën brengt voor het beheer van de rekening-courant geen kosten in rekening.

      9 Onze Minister van Financiën stelt in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport,
      na overleg met het College zorgverzekeringen, regels omtrent de rente die over de saldi van de in het eerste lid
      bedoelde rekening-courant wordt vergoed onderscheidenlijk in rekening wordt gebracht.

      10 Onze Minister van Financiën kan in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, na
      overleg met het College zorgverzekeringen, regels stellen omtrent het eerste, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel41
  - number: '43'
    text: |-
      De invorderingsrente en de heffingsrente op grond van de [Invorderingswet 1990][ref1] onderscheidenlijk op grond
      van de [Algemene Wet inzake Rijksbelastingen][ref2] (*Stb.* 1959, 301) komen ten laste en ten gunste van de
      fondsen, waarin de premie moet worden gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002320
  - number: '44'
    text: |-
      Door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Financiën kunnen bij
      ministeriële regeling regels gesteld worden met betrekking tot de afdracht van de premie voor de volksverzekeringen
      door de rijksbelastingdienst aan de betrokken fondsen.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel44
  - number: 44a
    text: |-
      1 Ten gunste van het Ouderdomsfonds, het Nabestaandenfonds en het Algemeen Fonds Bijzondere Ziektekosten wordt
      jaarlijks ten laste van het Rijk een bijdrage in de kosten van de heffingskortingen toegekend.

      2 De bijdrage in de kosten van de heffingskortingen per fonds wordt bij ministeriële regeling jaarlijks vastgesteld
      volgens de formule:

      BIKK = (BIKK + A*K)*K/K

      waarbij: BIKK = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in een bepaald jaar;

      BIKK = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in het voorafgaande jaar;

      A = het aandeel van de premie ten gunste van het fonds in het gecombineerde heffingspercentage, bedoeld in
      [artikel 8.1, onderdeel c, van de Wet inkomstenbelasting 2001][ref1], in het jaar waarvoor de bijdrage wordt
      toegekend, verminderd met het aandeel in het daaraan voorafgaande jaar;

      K = de door Onze Minister van Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Ministers van Financiën
      en van Volksgezondheid, Welzijn en Sport bij ministeriële regeling bekendgemaakte geraamde totale kosten voor de
      heffingskortingen in het jaar waarvoor de bijdrage wordt toegekend;

      K = de door Onze Minister van Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Ministers van Financiën
      en van Volksgezondheid, Welzijn en Sport bij ministeriële regeling bekendgemaakte geraamde totale kosten voor de
      heffingskortingen in het jaar voorafgaand aan het jaar waarvoor de bijdrage wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8.1'
  - number: '46'
    text: |-
      Degene, die is toegelaten tot de vrijwillige verzekering, bedoeld in [hoofdstuk III][ref1] van deze wet, is
      verplicht aan de Sociale verzekeringsbank of het Uitvoeringsinstituut werknemersverzekeringen onverwijld uit eigen
      beweging mededeling te doen van alle feiten en omstandigheden, waarvan het hem redelijkerwijs duidelijk is, dat zij
      van invloed zijn op de hoogte van de verschuldigde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004538
        hoofdstuk: III
  - number: '47'
    text: |-
      De Sociale verzekeringsbank, het Uitvoeringsinstituut werknemersverzekeringen, het College zorgverzekeringen, het
      College toezicht, de organen, betrokken bij de uitvoering van de algemene verzekering bijzondere ziektekosten,
      de belastingdienst, het Centraal Planbureau en het Centraal Bureau voor de Statistiek zijn verplicht desgevraagd
      aan elkaar, aan het College zorgverzekeringen, aan het College toezicht en aan Onze Minister, Onze Minister
      van Financiën en Onze Minister van Volksgezondheid, Welzijn en Sport kosteloos de opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel47
  - number: '48'
    text: |-
      In afwijking van [artikel 7:2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende in een
      bezwaarschriftprocedure ten aanzien van een besluit inzake de verschuldigde premie te betalen voor een vrijwillige
      verzekering gehoord op zijn verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel72
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:2
  - number: '49'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen respectievelijk de Sociale verzekeringsbank binnen dertien weken na
      ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: '51'
    text: |-
      Een belanghebbende kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen besluiten
      van het College zorgverzekeringen, genomen krachtens [artikel 40, eerste of derde lid][ref1], alsmede tegen
      besluiten van het College toezicht, genomen krachtens [artikel 40, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel40
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel51
