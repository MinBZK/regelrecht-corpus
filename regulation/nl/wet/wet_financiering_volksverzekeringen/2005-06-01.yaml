  - number: 29a
    text: |-
      Onze Minister stelt een keer per jaar een prognose op van de benodigde middelen tot dekking van de lasten van de
      algemene ouderdomsverzekering voor de eerstkomende tien jaren, waarbij onderscheid wordt gemaakt naar de opbrengst
      van de premies voor de algemene ouderdomsverzekering, de rijksbijdragen, bedoeld in [artikel 10b][ref1], en de
      ontvangsten en uitgaven van het Spaarfonds AOW, bedoeld in [artikel 31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel31
