  - number: 18a
    text: |-
      Het beroep kan niet zijn gegrond op het verweer dat de aanslag ten onrechte of tot een te hoog bedrag is
      vastgesteld. Het beroep kan slechts dan zijn gegrond op het verweer dat de aanslag niet is ontvangen, indien
      belanghebbende aannemelijk kan maken dat hij de aanslag nimmer ontvangen heeft en dat er geen omstandigheden zijn
      op grond waarvan het niet ontvangen van de aanslag hem kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel18a
  - number: '19'
    text: |-
      1 Van verplichtingen welke bij of krachtens dit hoofdstuk zijn opgelegd, wordt op zijn verzoek ontheven:

      a. degene, die gemoedsbezwaren heeft tegen één of meer volksverzekeringen;

      b. de rechtspersoon, waarbij natuurlijke personen zijn betrokken die bezwaren hebben als bedoeld in onderdeel a.

      2 Een ontheffing wordt verleend door de Sociale verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel19
  - number: '20'
    text: |-
      Indien een ontheffing is verleend in het kader van één of meer volksverzekeringen, wordt voor geen van
      de volksverzekeringen premie geheven, doch vindt voor al die verzekeringen heffing van premievervangende
      inkomstenbelasting of premievervangende loonbelasting plaats, aldus dat:

      a. van degene, van wie anders premie voor de volksverzekeringen zou worden geheven bij wege van aanslag,
      inkomstenbelasting wordt geheven tot het bedrag van die premies;

      b. van degene, van wie anders premie voor de volksverzekeringen zou zijn geheven bij wijze van inhouding,
      loonbelasting wordt ingehouden tot het bedrag van die premie.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel20
  - number: '21'
    text: |-
      1 De belasting die op grond van [artikel 20][ref1] wordt geheven in plaats van de premie voor de volksverzekeringen
      wordt voor de toepassing van dit hoofdstuk en voor de toepassing van de [Wet inkomstenbelasting 2001][ref2],
      de [Wet op de loonbelasting 1964][ref3] en de [Invorderingswet 1990][ref4] beschouwd als premie voor die
      verzekeringen.

      2 Voor de persoon van wie als gevolg van een ontheffing als bedoeld in [artikel 19][ref5] premievervangende
      belasting wordt geheven of ingehouden wordt een heffingskorting toegepast die wordt vastgesteld overeenkomstig
      de op grond van [artikel 10, vierde lid][ref6], voor een premieplichtige voor de volksverzekeringen toepasselijke
      heffingskorting voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel20
