  - number: '40'
    text: |-
      1 Het College zorgverzekeringen doet jaarlijks uitkeringen uit het Algemeen Fonds Bijzondere
      Ziektekosten ter dekking van de noodzakelijke uitgaven, gedaan voor de uitvoering van de in de
      [Algemene Wet Bijzondere Ziektekosten][ref1] geregelde verzekering, volgens bij of krachtens algemene maatregel van
      bestuur te stellen regelen.

      2 Het College van toezicht op de zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref2], verder te
      noemen: het College toezicht, is bevoegd vast te stellen dat uitgaven niet verantwoord waren voorzover
      deze door hem niet noodzakelijk worden geacht voor de uitvoering van de verzekering ingevolge de
      [Algemene Wet Bijzondere Ziektekosten][ref3]. Met de uitkeringen, bedoeld in het eerste lid, evenals met de daarmee
      verkregen opbrengsten worden geen uitgaven gedekt waarvan het College toezicht heeft vastgesteld dat zij niet
      verantwoord waren, tenzij het College toezicht anders besluit.

      3 Op de uitkeringen, bedoeld in het eerste lid, kunnen voorschotten worden verleend overeenkomstig door het College
      zorgverzekeringen te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel40
    references:
