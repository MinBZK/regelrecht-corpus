  - number: '22'
    text: |-
      Wanneer de Sociale verzekeringsbank een ontheffing verleent of intrekt, doet zij daarvan mededeling aan de
      inspecteur, onder wie de betrokkene krachtens [artikel 3, tweede lid, van de Algemene wet inzake rijksbelastingen]
      (onbekend) ressorteert voor de heffing van de inkomstenbelasting.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel22
  - number: '23'
    text: |-
      Ten laste van het Rijk komt de premie voor de volksverzekeringen, voor zover die ingevolge een ontheffing als
      bedoeld in [artikel 19][ref1] niet wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel19
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '19'
        hoofdstuk: II
        paragraaf: '8'
  - number: '24'
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels gesteld worden met betrekking tot het bepaalde in deze paragraaf.

      2 Deze regels betreffen:

      a. de voorwaarden, waaronder een ontheffing wordt verleend;

      b. de verdere gevolgen, die voor de toepassing van deze wet aan een ontheffing zijn verbonden;

      c. de gevallen, waarin een ontheffing wordt ingetrokken; en

      d. de gevolgen, die voor de toepassing van deze wet aan een intrekking van een ontheffing zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel24
  - number: '25'
    text: |-
      1 Degene, die is toegelaten tot de vrijwillige algemene ouderdomsverzekering, de vrijwillige
      nabestaandenverzekering, of de vrijwillige verzekering bijzondere ziektekosten, is voor die verzekeringen een
      premie verschuldigd volgens het bij of krachtens algemene maatregel van bestuur te bepalen tarief.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel25
  - number: '26'
    text: |-
      1 De verschuldigde premie voor de vrijwillige algemene ouderdomsverzekering, of de vrijwillige
      nabestaandenverzekering, of de vrijwillige verzekering bijzondere ziektekosten wordt in rekening gebracht en geïnd
      door de Sociale verzekeringsbank.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      vaststelling van de in rekening te brengen premie en de inning.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel26
  - number: '27'
    text: |-
      1 De premie wordt betaald aan het orgaan, dat de in rekening te brengen premie vaststelt, op de wijze en het
      tijdstip, door dat orgaan aangegeven.

      2 Een schuld aan premie voor een vrijwillige verzekering valt buiten de nalatenschap van degene, die tot die
      verzekering was toegelaten. De schuld moet worden betaald door degene, die krachtens de betrokken vrijwillige
      verzekering prestaties ontvangt.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de betaling van de
      premie voor de vrijwillige algemene ouderdomsverzekering, de vrijwillige nabestaandenverzekering, of de vrijwillige
      verzekering bijzondere ziektekosten.
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel27
  - number: '28'
    text: |-
      1 De Sociale verzekeringsbank beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven,
      bedoeld in [artikel 29, tweede lid][ref1], in de vorm van een Ouderdomsfonds dat deel uitmaakt van de Sociale
      verzekeringsbank.

      2 De Sociale verzekeringsbank beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven,
      bedoeld in [artikel 30, tweede lid][ref2] in de vorm van een Nabestaandenfonds dat deel uitmaakt van de Sociale
      verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel30
    url: https://wetten.overheid.nl/BWBR0004538/2005-06-01#Artikel28
