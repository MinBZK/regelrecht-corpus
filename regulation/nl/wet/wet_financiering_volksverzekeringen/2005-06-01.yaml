  - number: '2'
    text: |-
      Voor de toepassing van hetgeen bij of krachtens deze wet is bepaald, wordt verstaan onder:

      a. vrijwillige verzekeringen: de verzekeringen, bedoeld in de onderdelen *b* tot en met *e*;

      b. vrijwillige algemene ouderdomsverzekering: de verzekering, bedoeld in
      [hoofdstuk IV van de Algemene Ouderdomswet][ref1];

      c. vrijwillige nabestaandenverzekering: de verzekering, bedoeld in
      [hoofdstuk 5 van de Algemene nabestaandenwet][ref2];

      d. vrijwillige algemene arbeidsongeschiktheidsverzekering: de verzekering, bedoeld in artikel 59a van de
      Algemene Arbeidsongeschiktheidswet, zoals deze verzekering gold tot de dag van de inwerkingtreding van de
      [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref3];

      e. vrijwillige verzekering bijzondere ziektekosten: de verzekering, bedoeld in
      [artikel 32a van de Algemene Wet Bijzondere Ziektekosten][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#HoofdstukIV
