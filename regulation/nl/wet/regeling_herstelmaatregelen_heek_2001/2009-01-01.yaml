preamble:
  text: |-
    Gelet op verordening (EG) 1162/2001 van de Commissie van de Europese Gemeenschappen van 14 juni 2001 tot
    vaststelling van maatregelen voor het herstel van het heekbestand in ICES-deelgebieden III, IV, V, VI en VII en
    in ICES-sectoren VIIIa, b, d, e en van daarmee samenhangende bepalingen inzake de controle op de activiteiten van
    vissersvaartuigen (PbEG L 159);

    Gelet op de artikelen 3 en 4 van het Reglement zee- en kustvisserij 1977;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012585/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. verordening: [Verordening (EG) nr. 1162/2001](32001R1162) van de Commissie van de Europese Gemeenschappen van
      14 juni 2001 tot vaststelling van maatregelen voor het herstel van het heekbestand in ICES-deelgebieden III, IV,
      V, VI en VII en in ICES-sectoren VIIIa, b, d, e en van daarmee samenhangende bepalingen inzake de controle op de
      activiteiten van vissersvaartuigen (PbEG L 159);

      b. [verordening nr. 494/2002](32002R0494): [Verordening (EG) nr. 494/2002](32002R0494) van de Commissie van de
      Europese Gemeenschappen van 19 maart 2002 tot vaststelling van aanvullende technische maatregelen voor het herstel
      van het heekbestand in de ICES-deelgebieden III, IV, V, VI en VII en in de ICES-sectoren VIIIa, b, d, e (PbEG
      L 77).
    url: https://wetten.overheid.nl/BWBR0012585/2009-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden:

      a. in de gebieden, genoemd in artikel 6, eerste lid, van de verordening sleepnetten met een maaswijdte van 70 mm
      tot 90 mm aan boord te houden of te gebruiken;

      b. in de gebieden, genoemd in artikel 5, eerste lid, van de verordening bodemtrawls als bedoeld in artikel 6,
      tweede lid, van verordening aan boord te houden of te gebruiken;

      tenzij dit vistuig is geborgen overeenkomstig artikel 20, eerste lid, van [verordening (EEG) nr. 2847/93]
      (31993R2847) van de Raad van de Europese Gemeenschappen van 12 oktober 1993 tot

      invoering van een controleregeling voor het gemeenschappelijk visserijbeleid (PbEG L 261).

      2 Het eerste lid is niet van toepassing:

      a. op vissersvaartuigen waar een waarnemer als bedoeld in artikel 6, eerste en tweede lid, van de verordening aan
      boord is gedurende de gehele visreis, of

      b. indien met het desbetreffende vissersvaartuig vanaf het moment van inwerkingtreding van deze regeling vijf
      visreizen, in het geval van visserij als bedoeld in het eerste lid, onderdeel a, en tien visreizen, in het geval
      van visserij als bedoeld in het eerste lid, onderdeel b, zijn gemaakt met een waarnemer aan boord.

      3 De in het vorige lid bedoelde waarnemer handelt overeenkomst artikel 6, vierde lid, van de verordening.

      4 De kapitein van een vissersvaartuig die voornemens is de visserij uit te oefenen in de gebieden, bedoeld in het
      eerste lid, met het in dat artikellid genoemde vistuig:

      a. meldt zich ten minste twee werkdagen voor aanvang van de visreis bij de Directeur Visserij van het Ministerie
      van Landbouw, Natuurbeheer en Visserij ten behoeve van het toewijzen van een waarnemer als bedoeld in het derde
      lid en

      b. handelt overeenkomstig het bepaalde in artikel 6, vijfde lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0012585/2009-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden heek gemengd of gecombineerd met andere mariene organismen aan boord van een vissersvaartuig
      te houden.

      2 De kapitein van een vissersvaartuig die heek aan boord houdt, handelt overeenkomstig het bepaalde in artikel 10,
      tweede lid, en 11 van de verordening.
    url: https://wetten.overheid.nl/BWBR0012585/2009-01-01#Artikel3
  - number: 3a
    text: |-
      Het is verboden in de gebieden, bedoeld in artikel 1 van de verordening, heek aan boord te houden van een
      vissersvaartuig waarop een sleepnet met een maaswijdte van 55 tot 99 mm aan boord wordt gehouden of wordt gebruikt
      indien de hoeveelheid heek meer dan 20% uitmaakt van de totale hoeveelheid mariene organismen aan boord, tenzij het
      een vissersvaartuig betreft met een lengte over alles van minder dan 12 meter, dat binnen 24 uur terugkeert naar de
      laatste haven waaruit het is vertrokken.
    url: https://wetten.overheid.nl/BWBR0012585/2009-01-01#Artikel3a
  - number: 3b
    text: |-
      1 Het is verboden

      a. een kuil of een tunnel van een sleepnet als bedoeld in artikel 3, onderdeel a, van de verordening aan boord
      te houden van een vissersvaartuig of te gebruiken in de gebieden, bedoeld in artikel 1 van de verordening, met
      uitzondering van ICES-deelgebieden V en VI;

      b. bodemsleepnetten als bedoeld in artikel 3, onderdelen b, c en d, van de verordening aan boord te houden van een
      vissersvaartuig of te gebruiken in de gebieden, bedoeld in artikel 1 van de verordening;

      c. boomkorren als bedoeld in artikel 4 van de verordening aan boord te houden van een vissersvaartuig of te
      gebruiken in de gebieden, bedoeld in artikel 1 van de verordening;

      d. sleepnetten met een maaswijdte tussen 55 en 99 mm aan boord te houden van een vissersvaartuig of te gebruiken in
      de gebieden, bedoeld in artikel 5, eerste lid, onderdelen a en b, van de verordening;

      e. staand vistuig met een maaswijdte van minder dan 120 mm aan boord te houden van een vissersvaartuig of te
      gebruiken in de gebieden, bedoeld in artikel 5, eerste lid, onderdeel a, van de verordening;

      f. staand vistuig met een maaswijdte van minder dan 100 mm aan boord te houden van een vissersvaartuig of te
      gebruiken in de gebieden, bedoeld in artikel 5, eerste lid, onderdeel b, van de verordening;

      tenzij dit vistuig is geborgen overeenkomstig artikel 20, eerste lid, van [verordening (EEG) nr. 2847/93]
      (31993R2847) van de Raad van de Europese Gemeenschappen van 12 oktober 1993 tot invoering van een controleregeling
      voor het gemeenschappelijk visserijbeleid (PbEG L 261).

      2 Het eerste lid, onderdeel d, is niet van toepassing, indien in overeenstemming met artikel 6 van [verordening
      nr. 494/2002](32002R0494) of onderdeel 12.1 van bijlage III van de verordening van 19 december 2008 van de Raad
      van de Europese Unie tot vaststelling, voor 2009, van de vangstmogelijkheden voor sommige visbestanden en groepen
      visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met
      vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen voorschriften,
      wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0012585/2009-01-01#Artikel3b
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012585/2009-01-01#Artikel4
