      - id: ref12
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref13
        bwb_id: BWBR0008365
        artikel: 46o
  - number: 5.6.a
    text: bij ontslag, anders dan eervol, uit de militaire dienst, of
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: 5.6.b
    text: |-
      bij ontslag uit de militaire dienst ter zake van onbekwaamheid of ongeschiktheid anders dan uit hoofde van een
      ziekte of een gebrek, en dat mede schorsing plaats heeft indien het militaire lid in zijn militaire ambt is
      geschorst.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: 5a
    text: |-
      [Artikel 66, vijfde lid, van de Wet op de rechterlijke organisatie][ref1] is van overeenkomstige toepassing ten
      aanzien van een militair lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel66
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '66'
  - number: 5b
    text: |-
      Aan de militaire leden wordt een vergoeding toegekend met overeenkomstige toepassing van de regels die gelden voor
      de rechters-plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5b
  - number: '6'
    text: |-
      In afwijking van [artikel 8:12 van de Algemene wet bestuursrecht][ref1] kan de rechtbank ook aan de commandant
      van de bodem waarop of het korps of de inrichting waarbij de betrokken militaire ambtenaar dient of heeft gediend,
      opdragen het vooronderzoek of een gedeelte daarvan te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '7'
    text: |-
      Indien tijdens de behandeling van een beroep blijkt, dat een samenhangend strafrechtelijk onderzoek of een
      tuchtproces ingevolge de [Wet militair tuchtrecht][ref1] aanhangig is, wordt de behandeling, tenzij het beroep
      tegen een voorloopige voorziening is gericht, tot na afloop van dat onderzoek of dat tuchtproces geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: '8'
    text: |-
      Een uitspraak van den strafrechter, in kracht van gewijsde gegaan, of ingevolge de [Wet militair tuchtrecht][ref1]
      in beroep gewezen, waarbij de militaire ambtenaar aan eenig feit is schuldig verklaard, geldt in een militaire
      ambtenarenzaak als bewijs van dat feit.


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: '9.1'
    text: |-
      De militaire ambtenaar die zich bezwaard voelt over een van een militaire meerdere als bedoeld in
      [artikel 67 van het Wetboek van Militair Strafrecht][ref1] ontvangen bevel, dan wel meent van een zodanige
      meerdere een krenkende of onbillijke behandeling te hebben ondervonden, kan daarover in afwijking van
      [artikel 9:8, eerste lid, onder b, van de Algemene wet bestuursrecht][ref2] binnen zes weken schriftelijk
      een met redenen omklede klacht indienen bij de tot straffen bevoegde militaire meerdere, bedoeld in
      [artikel 49 van de Wet militair tuchtrecht][ref3] onder wiens rechtstreeks bevel degene, tegen wie de klacht is
      gericht, is gesteld dan wel bij een door Onze Minister aangewezen functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel49
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '49'
  - number: '9.2'
    text: Geen klacht kan worden ingediend over besluiten of handelingen ter uitvoering van de Wet militair tuchtrecht.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Op de behandeling van de klacht zijn de [afdelingen 9.1.2][ref1] en [9.1.3 van de Algemene wet bestuursrecht][ref2]
      van overeenkomstige toepassing, met dien verstande dat in afwijking van
      [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref3] de klacht binnen twaalf weken wordt afgehandeld
      indien de klager dan wel de militaire meerdere tegen wie het klaagschrift is gericht dan wel getuigen zich om
      redenen van dienst buiten Nederland bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 9.1.3
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '9.4'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel9
  - number: '10'
    text: |-
      [Titel II van de Ambtenarenwet 1929][ref1] vindt op de militaire ambtenaren overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '11'
    text: |-
      [Artikel 4:8 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op beschikkingen inzake
      functietoewijzing, bevordering en aanwijzing voor het volgen van een opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '12'
    text: |-
      Voor zover deze onderwerpen niet reeds bij of krachtens de wet zijn geregeld, worden voor de militaire ambtenaren
      bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.b
    text: het onderzoek naar de geschiktheid en bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.c
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.d
    text: bevordering;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.e
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.f
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.g
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.h
    text: verlof;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.i
    text: gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.j
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.k
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.l
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.m
    text: bezoldiging en overige militaire inkomsten;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.n
    text: wachtgeld;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.o
    text: overige rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.p
    text: |-
      de wijze, waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gepleegd over aangelegenheden van algemeen belang voor de rechtstoestand van militaire ambtenaren, alsmede de
      gevallen waarin overeenstemming in dat overleg dient te worden bereikt;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
  - number: 12.q
    text: |-
      de gevallen waarin berichten inzake de rechtspositie van de ambtenaar in afwijking van
      [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1] uitsluitend elektronisch verzonden behoeven te
      worden en de voorwaarden die daarbij in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 12bis
    text: |-
      Het bevoegd gezag en de militaire ambtenaar zijn verplicht zich als een goed werkgever en een goed militair
      ambtenaar te gedragen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12bis
  - number: 12ter.1
    text: |-
      Onze Minister voert een integriteitsbeleid dat is gericht op het bevorderen van goed ambtelijk handelen en dat in
      ieder geval aandacht besteedt aan het bevorderen van integriteitsbewustzijn en aan het voorkomen van misbruik van
      bevoegdheden, belangenverstrengeling en discriminatie.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12ter
  - number: 12ter.2
    text: |-
      Onze Minister zorgt ervoor dat het integriteitsbeleid een vast onderdeel uitmaakt van het personeelsbeleid in ieder
      geval door integriteit in functioneringsgesprekken en werkoverleg aan de orde te stellen en door het aanbieden van
      scholing en vorming op het gebied van integriteit.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12ter
  - number: 12ter.3
    text: Onze Minister draagt zorg voor de totstandkoming van een gedragscode voor goed ambtelijk handelen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12ter
  - number: 12ter.4
    text: |-
      Onze Minister stelt in overeenstemming met de Tweede Kamer vast op welke wijze jaarlijks verantwoording wordt
      afgelegd over het gevoerde integriteitsbeleid en over de naleving van de gedragscode.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12ter
  - number: 12quater.1
    text: |-
      Voor zover deze onderwerpen niet bij of krachtens de wet zijn geregeld, worden voor de militaire ambtenaren bij of
      krachtens algemene maatregel van bestuur voorschriften vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quater.1.a
    text: de verplichte aflegging van de eed of belofte door de militaire ambtenaar bij zijn aanstelling;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quater.1.b
    text: |-
      de melding en de registratie van nevenwerkzaamheden die de belangen van de dienst voor zover deze in verband staan
      met de functievervulling, kunnen raken;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quater.1.c
    text: |-
      de openbaarmaking van krachtens onderdeel b geregistreerde nevenwerkzaamheden van militaire ambtenaren in een
      functie waarvoor ter bescherming van de integriteit van de openbare dienst openbaarmaking van nevenwerkzaamheden
      noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quater.1.d
    text: |-
      het verbieden van nevenwerkzaamheden waardoor de goede vervulling van de functie of de goede functionering van
      de openbare dienst, voor zover deze in verband staat met de functievervulling, niet in redelijkheid zou zijn
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quater.1.e
    text: |-
      de melding van financiële belangen respectievelijk van het bezit van en transacties in effecten, die de belangen
      van de dienst voor zover deze in verband staan met de functievervulling, kunnen raken voor militaire ambtenaren
      aangesteld in een functie waaraan in het bijzonder het risico van financiële belangenverstrengeling of het risico
      van oneigenlijk gebruik van koersgevoelige informatie verbonden is;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quater.1.f
    text: |-
      een procedure voor het omgaan met bij een militaire ambtenaar levende vermoedens van misstanden binnen de
      organisatie waar hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quater.2
    text: |-
      De militaire ambtenaar die te goeder trouw de bij hem levende vermoedens van misstanden meldt volgens de procedure,
      bedoeld in het eerste lid onder f, zal als gevolg van het melden van die vermoedens geen nadelige gevolgen voor
      zijn rechtspositie ondervinden tijdens en na het volgen van die procedure.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quater
  - number: 12quinquies
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ten behoeve van het reguleren van de instroom, doorstroom en
      uitstroom van militair personeel regels gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quinquies
  - number: 12quinquies.a
    text: maximum leeftijden voor een aanstelling als militair ambtenaar en voor functietoewijzing;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quinquies
  - number: 12quinquies.b
    text: het maximum aantal jaren dat een militair ambtenaar in een rang mag dienen;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quinquies
  - number: 12quinquies.c
    text: het maximum aantal militaire ambtenaren dat een bepaalde rang mag bekleden;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quinquies
  - number: 12quinquies.d
    text: |-
      het verlenen van ontslag aan militaire ambtenaren wegens het bereiken of overschrijden van een voor de individuele
      militair te bepalen leeftijd, gelegen vóór de leeftijd van vijfenzestig jaar.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12quinquies
  - number: 12a.1
    text: |-
      De militaire ambtenaar dient zich te onthouden van het openbaren van gedachten of gevoelens dan wel de uitoefening
      van het recht tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze rechten de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met
      zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12a
  - number: 12a.2
    text: 'Het eerste lid is, voor wat betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:'
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12a
  - number: 12a.2.a
    text: |-
      een politieke groepering waarvan de naam of aanduiding is ingeschreven overeenkomstig de [artikelen G1][ref1] of
      [G2 van de Kieswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: 12a.2.b
    text: |-
      een politieke groepering waarvan de naam of aanduiding is ingeschreven overeenkomstig
      [artikel G3 van de Kieswet][ref1], en die, indien na de inschrijving verkiezingen zijn gehouden voor de
      gemeenteraden, aan de laatst gehouden verkiezingen heeft deelgenomen; of


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 12a.2.c
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12a
  - number: 12a.3
    text: |-
      De militaire ambtenaar is verplicht tot geheimhouding van enig gegeven, de dienst betreffende, tegenover een ieder
      die tot kennisneming daarvan niet bevoegd is, voor zover die verplichting uit de aard der zaak volgt.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12a
  - number: 12b
    text: |-
      De militaire ambtenaar is niet gehouden tot dienstverrichting op voor hem op grond van zijn godsdienst of
      levensovertuiging geldende feest- en rustdagen, tenzij het dienstbelang dit onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12b
  - number: 12c.1
    text: |-
      Een militair ambtenaar, die een functie in een publiekrechtelijk college, waarin hij is benoemd of verkozen, gezien
      de omvang van de daaruit voortvloeiende werkzaamheden niet gelijktijdig kan vervullen met zijn functie, wordt in
      verband daarmee op non-activiteit gesteld, tenzij de belangen van de dienst vorderen dat zulks niet geschiedt.
      Betreffende het doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12c
  - number: 12c.2
    text: |-
      Indien de militaire ambtenaar in verband met een functie in een publiekrechtelijk college, waarin hij is benoemd
      of verkozen, niet op non-activiteit is gesteld, wordt hem voor het bijwonen van vergaderingen en zittingen van dit
      college en voor het verrichten van daaruit voortvloeiende werkzaamheden ten behoeve van dit college buitengewoon
      verlof verleend, tenzij de belangen van de dienst vorderen dat het verlof niet wordt verleend. Betreffende het
      doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12c
  - number: 12c.3
    text: |-
      Aan de militaire ambtenaar wordt, tenzij de belangen van de dienst vorderen dat het verlof niet wordt verleend,
      buitengewoon verlof verleend voor aan te wijzen activiteiten van of voor een vereniging van militairen
      overeenkomstig regels te stellen bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12c
  - number: 12d.1
    text: |-
      De militaire ambtenaar is verplicht zich tijdens het verblijf in een gebouw, luchtvaartuig of voertuig alsmede op
      een vaartuig of een terrein, dat in gebruik is bij of ten behoeve van de krijgsmacht of dat de militaire ambtenaar
      tot verblijf of gebruik dient bij de vervulling van zijn taak in internationaal verband, te onderwerpen aan een in
      het belang van de dienst door het bevoegd gezag gelast onderzoek aan zijn lichaam of zijn kleding of van zijn daar
      aanwezige goederen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.2
    text: |-
      De militair ambtenaar is verplicht, indien dit noodzakelijk is in het belang van de veiligheid of van een goede
      vervulling van de taak van de krijgsmacht, zich te onderwerpen aan een onderzoek van zijn urine of adem.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.3
    text: 'Het in het tweede lid bedoelde onderzoek dient uitsluitend ter vaststelling van:'
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.3.a
    text: |-
      de aanwezigheid van gedragsbeïnvloedende middelen als bedoeld in de bij de [Opiumwet][ref1] behorende lijsten I
      en II


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0001941
  - number: 12d.3.b
    text: |-
      voor de militair die dienst doet of behoort te doen: een alcoholgehalte van zijn adem van meer dan 220 microgram
      alcohol per liter uitgeademde lucht.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.4
    text: |-
      Het bevoegd gezag, op wiens last het in het eerste en tweede lid bedoelde onderzoek plaats heeft, neemt de nodige
      maatregelen ten einde daarbij een onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.5
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld met betrekking tot het in het tweede en derde lid
      bedoelde onderzoek. Deze regels betreffen in ieder geval de wijze waarop het onderzoek wordt verricht en het recht
      van de militair ambtenaar om:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.5.a
    text: de uitslag van het onderzoek te vernemen;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.5.b
    text: |-
      naar aanleiding van het onderzoek bedoeld in het derde lid onder a, een hernieuwd onderzoek van afgestane urine te
      laten plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12d.5.c
    text: |-
      naar aanleiding van het onderzoek bedoeld in het derde lid onder b, zijn bloed te laten onderzoeken op een
      alcoholgehalte van meer dan 0,5 milligram per milliliter bloed.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12d
  - number: 12e
    text: |-
      Het is de militaire ambtenaar in werkelijke dienst verboden, anders dan met toestemming of in opdracht van Onze
      Minister, te reizen naar dan wel te verblijven in:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12e
  - number: 12e.a
    text: |-
      bij koninklijk besluit aangewezen landen, waarin het verblijf door een militair ambtenaar in werkelijke dienst een
      bijzonder risico voor de veiligheid of andere gewichtige belangen van de Staat of zijn bondgenoten kan opleveren;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12e
  - number: 12e.b
    text: een land of landsdeel waar feitelijk een gewapend conflict bestaat.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12e
  - number: 12f
    text: |-
      Een gewezen militair ambtenaar, die op het tijdstip van ingang van zijn eervol ontslag tenminste vijftien jaar
      tot het beroeps- of reserve-personeel heeft behoord, behoudt de status van militair ten aanzien van door Onze
      Minister te bepalen voorrechten, zulks tenzij hij van rechtswege is ontslagen of zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen. Bij de bepaling van de termijn van vijftien jaar telt mee de tijd, die
      betrokkene als dienstplichtige in werkelijke dienst heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12f
  - number: 12g.1
    text: |-
      Voor de aanstelling als militair ambtenaar komt, tenzij bij of krachtens algemene maatregel van bestuur anders
      wordt bepaald, slechts in aanmerking degene die Nederlander is.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12g
  - number: 12g.2
    text: |-
      Aan de militaire ambtenaar kan eervol ontslag worden verleend, indien hij op grond van het bepaalde in
      [artikel 5, derde lid][ref1], of [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een
      vertrouwensfunctie moet worden ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '10'
  - number: 12g.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter zake van het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12g
  - number: 12h.1
    text: |-
      Aan de militair ambtenaar in werkelijke dienst wordt gezondheidszorg verleend door of vanwege de militair
      geneeskundige dienst. De militair ambtenaar in werkelijke dienst is gehouden zich tot het voor hem aangewezen
      medisch zorgteam te wenden ter verkrijging van gezondheidszorg. Indien zulks onmogelijk is, kan de militair zich
      wenden tot een ander onderdeel van de militair geneeskundige dienst of tot een civiele arts, waarvan hij vanwege de
      noodzaak tot voortdurend zicht op de inzetbaarheid mededeling doet aan het voor hem aangewezen zorgteam.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.2
    text: |-
      De militair in werkelijke dienst is verplicht de maatregelen in acht te nemen die door Onze Minister worden
      voorgeschreven ter bescherming van de gezondheid van de militair of die van anderen, zulks onverminderd de
      wettelijke mogelijkheden ten aanzien van bepaalde maatregelen van die verplichting te worden ontheven. De militair
      in werkelijke dienst is in geval van ziekte of gebrek verplicht zich te houden aan de voorschriften van de
      verantwoordelijk militair arts. Hij is evenwel niet verplicht zich te onderwerpen aan een ingreep van heelkundige
      aard of een andere kunstbewerking.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.3
    text: |-
      De militair in werkelijke dienst is verplicht zich te onderwerpen aan en zijn medewerking te verlenen aan een
      geneeskundig of tandheelkundig onderzoek door of vanwege het voor hem aangewezen medisch zorgteam:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.3.a
    text: |-
      indien hij in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn gezondheid
      blootstaat, dan wel voor een goede vervulling van die werkzaamheden aan bijzondere gezondheidseisen moet voldoen;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.3.b
    text: |-
      wanneer Onze Minister dit noodzakelijk acht in verband met toelating tot een opleiding, plaatsing in een andere
      functie, plaatsing bij bepaalde onderdelen of in bepaalde gebieden;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.3.c
    text: |-
      indien door zijn commandant op goede gronden wordt verondersteld dat zijn lichamelijke of geestelijke gesteldheid
      een beletsel vormt om naar behoren dienst te verrichten;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.3.d
    text: bij beëindiging van het verblijf in werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.4
    text: |-
      De militair in werkelijke dienst is verplicht zich te onderwerpen en zijn medewerking te verlenen aan een
      geneeskundig of tandheelkundig onderzoek indien Onze Minister op goede gronden van oordeel is, dat de militair:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.4.a
    text: |-
      langdurig of blijvend ongeschikt is voor de vervulling de functie of de groep van functies waarvoor de militair
      is bestemd;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.4.b
    text: blijvend ongeschikt is voor de vervulling van de militaire dienst.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.5
    text: |-
      Ten behoeve van de gezondheidszorg maken de tot het medisch zorgteam behorende zorgverleners gebruik van de in het
      geïntegreerd militair geneeskundig dossier beschikbare medische gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.6
    text: |-
      Een daartoe aangewezen militaire arts van het medisch zorgteam adviseert na overleg met de militair de commandant
      desgevraagd dan wel op eigen initiatief en ongeacht de toestemming van de militair over diens inzetbaarheid.
      Daarbij wordt geen inhoudelijke geneeskundige informatie verstrekt.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12h.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verwerking van
      persoonsgegevens en medische gegevens die de gezondheid van militairen betreffen door of ten behoeve van het
      medisch zorgteam en omtrent verplichtingen van militaire artsen en overig tot de militair geneeskundige dienst
      behorend personeel die het registreren, kennisnemen en overdragen van medische gegevens met betrekking tot de
      militair betreffen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12h
  - number: 12i.1
    text: Het is de militair ambtenaar in werkelijke dienst niet toegestaan om deel te nemen aan een staking.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12i
  - number: 12i.2
    text: |-
      Het is de militair ambtenaar in werkelijke dienst toegestaan om deel te nemen aan andere vormen van collectieve
      actie tenzij deelname aan die collectieve actie de operationele inzet van de krijgsmacht kan verstoren of
      belemmeren.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12i
  - number: 12i.3
    text: |-
      Het is de ambtenaar in de zin van [artikel 1 van de Ambtenarenwet][ref1] die is aangesteld bij het ministerie van
      Defensie toegestaan deel te nemen aan een staking of andere vormen van collectieve actie, tenzij de deelname aan
      die staking of collectieve actie de operationele inzet van de krijgsmacht kan verstoren of belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
  - number: 12j.1
    text: |-
      De militair ambtenaar is gehouden tot het naar beste vermogen uitvoeren van de hem in het belang van de
      taakuitoefening van de krijgsmacht opgedragen werkzaamheden en diensten.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12j
  - number: 12j.2
    text: Hij kan in het belang van die taakuitoefening overal ter wereld worden ingezet.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12j
  - number: 12j.3
    text: |-
      De militair ambtenaar kan voor het verrichten van de hem opgedragen werkzaamheden worden gesteld onder een
      functionaris die niet behoort tot het militaire personeel van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12j
  - number: 12j.4
    text: |-
      De militair ambtenaar in werkelijke dienst kan worden verplicht, wanneer naar het oordeel van Onze Minister
      het algemeen belang dit vordert, tijdelijk andere werkzaamheden te verrichten dan die welke uit de militaire
      hoedanigheid voortvloeien. Hij kan echter niet worden verplicht werkzaamheden te verrichten in plaats van stakers
      of uitgeslotenen, tenzij het werkzaamheden betreft die naar het oordeel van Onze Minister geen uitstel gedogen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12j
  - number: 12j.5
    text: |-
      Indien militairen worden verplicht tot het verrichten van werkzaamheden als bedoeld in het vierde lid kan Onze
      Minister een militair ambtenaar in werkelijke dienst, die bestuurslid of kaderlid is van een vakorganisatie van
      overheidspersoneel, op diens aanvraag tijdelijk van deze verplichting ontheffen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12j
  - number: 12k.1
    text: |-
      Aan een aanstelling als militair ambtenaar bij het beroepspersoneel is de verplichting verbonden om een bij of
      krachtens algemene maatregel van bestuur te bepalen termijn, doch ten hoogste gedurende de initiële opleiding en
      aansluitend een periode van vier jaar, deel uit te blijven maken van het beroepspersoneel.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12k
  - number: 12k.2
    text: In afwijking van het eerste lid is aan een aanstelling als militair ambtenaar met de bestemming
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12k
  - number: 12k.2.a
    text: |-
      tot het volgen van de meerjarige opleiding tot officier, de verplichting verbonden om gedurende de opleiding en
      aansluitend een periode van zeven jaar deel uit te blijven maken van het beroepspersoneel;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12k
  - number: 12k.2.b
    text: |-
      tot het volgen van een opleiding tot vlieger, de verplichting verbonden gedurende de opleiding en aansluitend een
      periode van tien jaar deel uit te blijven maken van het beroepspersoneel.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12k
  - number: 12k.3
    text: |-
      Aan een aanwijzing, op aanvraag van een militair ambtenaar in werkelijke dienst, voor het volgen van een opleiding
      waarbij de militair ambtenaar wordt vrijgesteld van werkzaamheden en diensten als militair, kan door Onze Minister
      de verplichting worden verbonden om een periode van ten hoogste twee maal de periode dat hij is vrijgesteld deel te
      blijven uitmaken van het beroepspersoneel.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12k
  - number: 12l.1
    text: |-
      Aan een aanstelling als militair ambtenaar bij het reservepersoneel is de verplichting verbonden om gedurende de
      initiële opleiding en aansluitend een periode van vier jaar, deel te blijven uitmaken van het reservepersoneel.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12l
  - number: 12l.2
    text: |-
      Militaire ambtenaren, aangesteld bij het reservepersoneel, kunnen door Onze Minister worden opgeroepen om in
      werkelijke dienst te komen:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12l
  - number: 12l.2.a
    text: |-
      voor de gevallen waarin en voor zo lang als zij daartoe bij hun aanstelling een verplichting op zich hebben
      genomen;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12l
  - number: 12l.2.b
    text: |-
      in geval van buitengewone omstandigheden, zolang Onze Minister dit vanwege die buitengewone omstandigheden nodig
      oordeelt;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12l
  - number: 12l.3
    text: |-
      Onze Minister kan aan militaire ambtenaren, aangesteld bij het reservepersoneel, op hun aanvraag toestemming
      verlenen om buiten de tijd dat zij verplicht zijn tot werkelijke dienst, onbezoldigd in werkelijke dienst te komen
      of te blijven.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12l
  - number: 12l.4
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het in werkelijke dienst oproepen of
      toestaan in werkelijke dienst te komen van reservepersoneel.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12l
  - number: 12m
    text: |-
      Een ontslagaanvraag van een militair ambtenaar kan worden afgewezen en een reeds verleend, doch nog niet ingegaan,
      ontslag kan worden ingetrokken of opgeschort:
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12m
  - number: 12m.a
    text: |-
      gedurende de tijd waarin naar het oordeel van Onze Minister, in overeenstemming met het gevoelen van de
      Ministerraad, het landsbelang wegens een bijzondere situatie vordert dat het ontslag niet wordt verleend;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12m
  - number: 12m.b
    text: |-
      gedurende een periode waarin op de militair ambtenaar de verplichting rust om te blijven behoren tot het
      beroepspersoneel of het reservepersoneel;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12m
  - number: 12m.c
    text: |-
      Indien de beoogde datum van ingang van het ontslag valt binnen de tijd dat de militair ambtenaar deelneemt aan een
      inzet buiten Nederland in het kader van internationale overeenkomsten of andere verplichtingen die door Nederland
      zijn aangegaan, of binnen een periode van drie maanden voorafgaande aan de vermoedelijke datum van uitzending.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12m
  - number: 12m.d
    text: |-
      Indien onze Minister overweegt de militair ambtenaar te ontslaan om een reden die aanleiding geeft tot ontslag
      zonder het predikaat «eervol»;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12m
  - number: 12m.e
    text: in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel12m
  - number: '16'
    text: |-
      De artikelen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat voor verschillende artikelen
      verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel16
  - number: '17'
    text: |-
      Deze wet kan worden aangehaald als "Militaire Ambtenarenwet" met bijvoeging van het jaartal van het *Staatsblad*,
      waarin zij wordt afgekondigd.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel17
