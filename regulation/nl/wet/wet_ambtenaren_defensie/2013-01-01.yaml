        artikel: 46i
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref11
