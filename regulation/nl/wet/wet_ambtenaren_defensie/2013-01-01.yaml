$id: wet_ambtenaren_defensie
regulatory_layer: WET
publication_date: '2023-06-07'
valid_from: '2013-01-01'
bwb_id: BWBR0001952
url: https://wetten.overheid.nl/BWBR0001952/2013-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat regelen betreffende den rechtstoestand van de militaire ambtenaren van
    zee- en landmacht behooren te worden gesteld;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.a
    text: |-
      *militaire ambtenaren:* zij, die zijn aangesteld bij het beroepspersoneel van de krijgsmacht of bij het
      reservepersoneel van de krijgsmacht om in militaire openbare dienst werkzaam te zijn,
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.b
    text: '*werkelijke dienst:* de tijd gedurende welke de militair ambtenaar'
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.b.1
    text: |-
      is aangesteld bij het beroepspersoneel van de krijgsmacht en hij niet op non-activiteit is gesteld en hem geen
      buitengewoon verlof van lange duur is verleend;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.b.2
    text: is aangesteld bij het reservepersoneel van de krijgsmacht en hij als zodanig feitelijk onder de wapenen is,
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.c
    text: |-
      *buitengewone omstandigheden:* een uitzonderingstoestand als bedoeld in
      [artikel 1 van de Coördinatiewet uitzonderingstoestanden][ref1] dan wel andere omstandigheden die naar het oordeel
      van Onze Minister toepassing van buitengewone bevoegdheden op grond van deze wet noodzakelijk maken,


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel1
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '1'
  - number: 1.1.d
    text: '*Onze Minister:* Onze Minister van Defensie,'
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.e
    text: |-
      *militaire gezondheidszorg:* het geheel aan maatregelen, voorzieningen en verstrekkingen verleend door of
      vanwege de militair geneeskundige dienst ten behoeve van het behoud, herstel en bevordering van de gezondheid en
      inzetbaarheid van de militair,
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.f
    text: |-
      *militair geneeskundige dienst:* het geheel van instanties en eenheden binnen de krijgsmacht, belast met het
      verlenen van militaire gezondheidszorg,
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.g
    text: |-
      *geïntegreerde gezondheidszorg:* het samenhangend stelsel van preventieve, curatieve met inbegrip van
      huisartsgeneeskundige, bepaalde bedrijfsgeneeskundige en operationeel geneeskundige activiteiten verricht door een
      eerstelijns medisch zorgteam voor het verlenen van militaire gezondheidszorg,
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.h
    text: |-
      *algemeen militair arts (AMA):* een tot de militair geneeskundige dienst behorende militaire arts, opgeleid tot
      of in staat geacht tot het toepassen van de basiskennis en -vaardigheden van de geïntegreerde gezondheidszorg,
      opgenomen in het register van algemeen militaire artsen,
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.i
    text: |-
      *medisch zorgteam:* een functioneel team, bestaande uit één of meer algemeen militaire artsen, tenminste één
      geregistreerd huisarts en één geregistreerd bedrijfsarts van de militair geneeskundige dienst, belast met het
      verlenen van geïntegreerde gezondheidszorg aan de aan dit team toegewezen militairen,
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1.1.j
    text: |-
      *geïntegreerd militair geneeskundig dossier:* het geheel aan eerstelijns geneeskundige gegevens omtrent een
      militair ten behoeve van het verlenen van geïntegreerde gezondheidszorg door een medisch zorgteam.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: '1.2'
    text: |-
      In deze wet wordt, voorzover hun belang daarmee is gemoeid of dit uit de vroegere rechtsbetrekking volgt, mede
      verstaan onder *militaire ambtenaren:* gewezen militaire ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1
  - number: 1a.1
    text: Tot militair ambtenaar kunnen worden aangesteld zij die de leeftijd van 18 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Zij die de leeftijd van 17 jaar hebben bereikt kunnen met schriftelijke instemming van hun wettelijke
      vertegenwoordigers worden aangesteld als aspirant-militair ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1a
  - number: 1a.3
    text: |-
      Aan aspirant-militaire ambtenaren wordt geen functie toegewezen. Zij worden niet ingezet in buitengewone
      omstandigheden, voor vredes- of humanitaire operaties of voor enige vorm van gewapende dienst.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1a
  - number: 1a.4
    text: |-
      De periode van aanstelling als aspirant-militair ambtenaar maakt in zijn geheel deel uit van de proeftijd voor een
      aanstelling als militair ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1a
  - number: 1a.5
    text: |-
      Een aanstelling als aspirant-militair ambtenaar gaat over in een aanstelling als militair ambtenaar als de
      aspirant-militair ambtenaar daarmee na het bereiken van de leeftijd van 18 jaar schriftelijk instemt.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1a
  - number: 1b
    text: |-
      Voor zover dit met het oog op de goede uitvoering van de operationele taken van krijgsmacht noodzakelijk is, kan
      Onze Minister in buitengewone omstandigheden afwijken van hetgeen bij of krachtens deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel1b
  - number: '3.1'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een bezwaar- of beroepschrift dertien weken, indien de belanghebbende zich om redenen van dienst buiten Nederland
      bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '3.2'
    text: |-
      In afwijking van [artikel 8:55, eerste lid, derde volzin, van de Algemene wet bestuursrecht][ref1] bedraagt de
      termijn voor het indienen van een verzetschrift dertien weken, indien de belanghebbende zich om redenen van dienst
      buiten Nederland bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '3.3'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] bedraagt de beslistermijn zes
      maanden, indien een of meer belanghebbenden, getuigen of deskundigen zich om redenen van dienst buiten Nederland
      bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '3.4'
    text: |-
      Indien dringende redenen van operationele aard verhinderen dat binnen de in het derde lid bedoelde termijn wordt
      beslist, kan deze termijn ten hoogste twee keer met drie maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel3
  - number: '5.1'
    text: |-
      De [eerste volzin van artikel 54, derde lid, van de Wet op de rechterlijke organisatie][ref1] is van
      overeenkomstige toepassing indien beroep is ingesteld door nagelaten betrekkingen of rechtverkrijgenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel54
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '54'
  - number: '5.2'
    text: |-
      Tot militair lid zijn alleen benoembaar zij die Nederlander en militair ambtenaar of eervol ontslagen militair
      ambtenaar zijn.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: '5.3'
    text: 'Zij mogen niet:'
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: 5.3.a
    text: sedert meer dan zes jaar uit de militaire dienst zijn ontslagen;
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: 5.3.b
    text: |-
      deel uitmaken van het bestuur of in dienst zijn van een vereniging van militairen. Onder vereniging van militairen
      is voor de toepassing van deze bepaling een verband van verenigingen en een onderdeel van een vereniging begrepen.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: '5.4'
    text: |-
      Een militair lid wordt door Onze Minister benoemd voor de tijd van vier jaren. Het lid is bij zijn aftreden eenmaal
      herbenoembaar. Op zijn verzoek wordt het lid door Onze Minister ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: '5.5'
    text: |-
      In geval van gelijktijdige benoeming geldt als oudstbenoemde het lid wiens naam in het benoemingsbesluit het eerst
      is vermeld en zo vervolgens. Heeft de benoeming plaats gehad bij verschillende besluiten van gelijke datum, dan
      wordt het laagst genummerde besluit geacht het eerst te zijn genomen en zo vervolgens.
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
  - number: '5.6'
    text: |-
      Ten aanzien van een militair lid zijn de [artikelen 46c][ref1], [46d][ref2], [46e][ref3], [46f][ref4], [46g][ref5],
      [46i, met uitzondering van het eerste lid, onderdeel c][ref6], [46j][ref7], [46l][ref8], [46m][ref9], [46o][ref10]
      en [46p van de Wet rechtspositie rechterlijke ambtenaren][ref11] van overeenkomstige toepassing, met dien verstande
      dat voor de overeenkomstige toepassing van [artikel 46j][ref12] onderscheidenlijk [artikel 46o, tweede lid][ref13],
      onder functionele autoriteit wordt verstaan: bestuur onderscheidenlijk president van het gerecht, met dien
      verstande dat mede ontslag wordt verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
      [ref12]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref13]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0001952/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
