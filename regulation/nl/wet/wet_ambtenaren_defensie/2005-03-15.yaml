publication_date: '2023-06-07'
valid_from: '2005-03-15'
bwb_id: BWBR0001952
url: https://wetten.overheid.nl/BWBR0001952/2005-03-15
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat regelen betreffende den rechtstoestand van de militaire ambtenaren van
    zee- en landmacht behooren te worden gesteld;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Militaire ambtenaren zijn zij, die zijn aangesteld in militaire openbare dienst om bij de zeemacht, de landmacht of
      de luchtmacht werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel1
  - number: '1.2'
    text: |-
      Onder militaire ambtenaren begrijpt deze wet mede het reserve-personeel van de zeemacht, de landmacht en de
      luchtmacht hetwelk niet valt onder het voorgaande lid.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel1
  - number: '1.3'
    text: Tenzij het tegendeel blijkt, zijn in deze wet onder militaire ambtenaren gewezen militaire ambtenaren begrepen.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van deze wet wordt onder werkelijke dienst verstaan: de tijd gedurende welke de militaire
      ambtenaar:
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel1
  - number: 1.4.a
    text: |-
      is aangesteld bij het beroepspersoneel van de zeemacht, de landmacht of de luchtmacht en hij niet op non-activiteit
      is gesteld en hem geen buitengewoon verlof van lange duur is verleend;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel1
  - number: 1.4.b
    text: |-
      behoort tot het reserve-personeel van de zeemacht, de landmacht of de luchtmacht en als zodanig feitelijk onder de
      wapenen is.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel1
  - number: '1.5'
    text: 'Voor de toepassing van deze wet wordt verstaan onder Onze Minister: Onze Minister van Defensie.'
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel1
  - number: '3.1'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een bezwaar- of beroepschrift dertien weken, indien de belanghebbende zich om redenen van dienst buiten Nederland
      bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '3.2'
    text: |-
      In afwijking van [artikel 8:55, eerste lid, derde volzin, van de Algemene wet bestuursrecht][ref1] bedraagt de
      termijn voor het indienen van een verzetschrift dertien weken, indien de belanghebbende zich om redenen van dienst
      buiten Nederland bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '3.3'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] bedraagt de beslistermijn zes
      maanden, indien een of meer belanghebbenden, getuigen of deskundigen zich om redenen van dienst buiten Nederland
      bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '3.4'
    text: |-
      Indien dringende redenen van operationele aard verhinderen dat binnen de in het derde lid bedoelde termijn wordt
      beslist, kan deze termijn ten hoogste twee keer met drie maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel3
  - number: '4'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te 's-Gravenhage bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '5.1'
    text: |-
      De [eerste volzin van artikel 54, tweede lid, van de Wet op de rechterlijke organisatie][ref1] is van
      overeenkomstige toepassing indien beroep is ingesteld door nagelaten betrekkingen of rechtverkrijgenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel54
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '54'
  - number: '5.2'
    text: 'Tot militair lid zijn alleen benoembaar zij die:'
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: 5.2.a
    text: |-
      Nederlander en militair ambtenaar of eervol ontslagen militair ambtenaar van de zeemacht, de landmacht of de
      luchtmacht zijn;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: 5.2.b
    text: voor de aanvang van het lopende kalenderjaar de leeftijd van 25 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: '5.3'
    text: 'Zij mogen niet:'
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: 5.3.a
    text: sedert meer dan zes jaar uit de militaire dienst zijn ontslagen;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: 5.3.b
    text: |-
      deel uitmaken van het bestuur of in dienst zijn van een vereniging van militairen. Onder vereniging van militairen
      is voor de toepassing van deze bepaling een verband van verenigingen en een onderdeel van een vereniging begrepen.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: '5.4'
    text: |-
      Een militair lid wordt door Onze Minister benoemd voor de tijd van vier jaren. Het lid is bij zijn aftreden eenmaal
      herbenoembaar. Op zijn verzoek wordt het lid door Onze Minister ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: '5.5'
    text: |-
      In geval van gelijktijdige benoeming geldt als oudstbenoemde het lid wiens naam in het benoemingsbesluit het eerst
      is vermeld en zo vervolgens. Heeft de benoeming plaats gehad bij verschillende besluiten van gelijke datum, dan
      wordt het laagst genummerde besluit geacht het eerst te zijn genomen en zo vervolgens.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: '5.6'
    text: |-
      Ten aanzien van een militair lid zijn de [artikelen 46c][ref1], [46d][ref2], [46e][ref3], [46f][ref4],
      [46g, eerste tot en met het vierde lid][ref5], [46i, met uitzondering van het eerste lid, onderdeel c][ref6],
      [46j][ref7], [46l][ref8], [46m][ref9], [46o][ref10] en [46p van de Wet rechtspositie rechterlijke ambtenaren][ref11]
      van overeenkomstige toepassing, met dien verstande dat mede ontslag wordt verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46e
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46g
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref11
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 5.6.a
    text: bij ontslag, anders dan eervol, uit de militaire dienst, of
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: 5.6.b
    text: |-
      bij ontslag uit de militaire dienst ter zake van onbekwaamheid of ongeschiktheid anders dan uit hoofde van een
      ziekte of een gebrek, en dat mede schorsing plaats heeft indien het militaire lid in zijn militaire ambt is
      geschorst.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5
  - number: 5a.1
    text: |-
      Alvorens zijn ambt te aanvaarden, legt het militaire lid de eden of verklaring en beloften af die voor rechterlijke
      ambtenaren zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5a
  - number: 5a.2
    text: De beëdiging geschiedt ten overstaan van de president.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5a
  - number: 5b
    text: |-
      Aan de militaire leden wordt een vergoeding toegekend met overeenkomstige toepassing van de regels die gelden voor
      de rechters-plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel5b
  - number: '6'
    text: |-
      In afwijking van [artikel 8:12 van de Algemene wet bestuursrecht][ref1] kan de rechtbank ook aan de commandant
      van de bodem waarop of het korps of de inrichting waarbij de betrokken militaire ambtenaar dient of heeft gediend,
      opdragen het vooronderzoek of een gedeelte daarvan te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '7'
    text: |-
      Indien tijdens de behandeling van een beroep blijkt, dat een samenhangend strafrechtelijk onderzoek of een
      tuchtproces ingevolge de [Wet militair tuchtrecht][ref1] aanhangig is, wordt de behandeling, tenzij het beroep
      tegen een voorloopige voorziening is gericht, tot na afloop van dat onderzoek of dat tuchtproces geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: '8'
    text: |-
      Een uitspraak van den strafrechter, in kracht van gewijsde gegaan, of ingevolge de [Wet militair tuchtrecht][ref1]
      in beroep gewezen, waarbij de militaire ambtenaar aan eenig feit is schuldig verklaard, geldt in een militaire
      ambtenarenzaak als bewijs van dat feit.


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: '9.1'
    text: |-
      De militaire ambtenaar die zich bezwaard voelt over een van een militaire meerdere als bedoeld in
      [artikel 67 van het Wetboek van Militair Strafrecht][ref1] ontvangen bevel, dan wel meent van een zodanige
      meerdere een krenkende of onbillijke behandeling te hebben ondervonden, kan daarover in afwijking van
      [artikel 9:8, eerste lid, onder b, van de Algemene wet bestuursrecht][ref2] binnen zes weken schriftelijk
      een met redenen omklede klacht indienen bij de tot straffen bevoegde militaire meerdere, bedoeld in
      [artikel 49 van de Wet militair tuchtrecht][ref3] onder wiens rechtstreeks bevel degene, tegen wie de klacht is
      gericht, is gesteld dan wel bij een door Onze Minister aangewezen functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel49
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '49'
  - number: '9.2'
    text: Geen klacht kan worden ingediend over besluiten of handelingen ter uitvoering van de Wet militair tuchtrecht.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel9
  - number: '9.3'
    text: |-
      Op de behandeling van de klacht zijn de [afdelingen 9.1.2][ref1] en [9.1.3 van de Algemene wet bestuursrecht][ref2]
      van overeenkomstige toepassing, met dien verstande dat in afwijking van
      [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref3] de klacht binnen twaalf weken wordt afgehandeld
      indien de klager dan wel de militaire meerdere tegen wie het klaagschrift is gericht dan wel getuigen zich om
      redenen van dienst buiten Nederland bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 9.1.3
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '9.4'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel9
  - number: '10'
    text: |-
      [Titel II van de Ambtenarenwet 1929][ref1] vindt op de militaire ambtenaren overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '11'
    text: |-
      [Artikel 4:8 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op beschikkingen inzake
      functietoewijzing, bevordering en aanwijzing voor het volgen van een opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '12.1'
    text: |-
      Voor zover deze onderwerpen niet reeds bij of krachtens de wet zijn geregeld, worden voor de militaire ambtenaren
      bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.b
    text: het onderzoek naar de geschiktheid en bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.c
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.d
    text: bevordering;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.e
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.f
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.g
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.h
    text: verlof;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.i
    text: gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.j
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.k
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.l
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.m
    text: bezoldiging en overige militaire inkomsten;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.n
    text: wachtgeld;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.o
    text: |-
      de melding en de registratie van nevenwerkzaamheden die de belangen van de dienst voor zover deze in verband staan
      met de functievervulling, kunnen raken;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.p
    text: |-
      het verbieden van nevenwerkzaamheden waardoor de goede vervulling van de functie of de goede functionering van
      de openbare dienst, voor zover deze in verband staat met de functievervulling, niet in redelijkheid zou zijn
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.q
    text: |-
      de openbaarmaking van de krachtens onderdeel o geregistreerde nevenwerkzaamheden van militaire ambtenaren die
      een functie vervullen waarvoor ter bescherming van de integriteit van de openbare dienst openbaarmaking van de
      nevenwerkzaamheden noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.r
    text: |-
      een procedure voor het omgaan met bij een militaire ambtenaar levende vermoedens van misstanden binnen de
      organisatie waar hij werkzaam is;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.s
    text: overige rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12.1.t
    text: |-
      de wijze, waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gepleegd over aangelegenheden van algemeen belang voor de rechtstoestand van militaire ambtenaren, alsmede de
      gevallen waarin overeenstemming in dat overleg dient te worden bereikt.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: '12.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor militaire ambtenaren die een functie vervullen waaraan
      in het bijzonder het risico van financiële belangenverstrengeling of het risico van oneigenlijk gebruik van
      koersgevoelige informatie verbonden is, voorschriften vastgesteld betreffende de melding van financiële belangen
      respectievelijk van het bezit van en transacties in effecten, die de belangen van de dienst voor zover deze in
      verband staan met de functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12
  - number: 12a.1
    text: |-
      De militaire ambtenaar dient zich te onthouden van het openbaren van gedachten of gevoelens dan wel de uitoefening
      van het recht tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze rechten de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met
      zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12a
  - number: 12a.2
    text: 'Het eerste lid is, voor wat betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:'
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12a
  - number: 12a.2.a
    text: |-
      een politieke groepering waarvan de naam of aanduiding is ingeschreven overeenkomstig de [artikelen G1](onbekend)
      of [G2 van de Kieswet](onbekend);
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12a
  - number: 12a.2.b
    text: |-
      een politieke groepering waarvan de naam of aanduiding is ingeschreven overeenkomstig [artikel G3 van de Kieswet]
      (onbekend), en die, indien na de inschrijving verkiezingen zijn gehouden voor de gemeenteraden, aan de laatst
      gehouden verkiezingen heeft deelgenomen; of
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12a
  - number: 12a.2.c
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12a
  - number: 12a.3
    text: |-
      De militaire ambtenaar is verplicht tot geheimhouding van enig gegeven, de dienst betreffende, tegenover een ieder
      die tot kennisneming daarvan niet bevoegd is, voor zover die verplichting uit de aard der zaak volgt.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12a
  - number: 12a.4
    text: |-
      De militaire ambtenaar die te goeder trouw de bij hem levende vermoedens van misstanden uit volgens de procedure,
      bedoeld in [artikel 12, eerste lid, onder r][ref1], zal als gevolg van het uiten van die vermoedens geen nadelige
      gevolgen voor zijn rechtspositie ondervinden tijdens en na het volgen van die procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '12'
  - number: 12b
    text: |-
      De militaire ambtenaar is niet gehouden tot dienstverrichting op voor hem op grond van zijn godsdienst of
      levensovertuiging geldende feest- en rustdagen, tenzij het dienstbelang dit onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12b
  - number: 12c.1
    text: |-
      Een militair ambtenaar, die een functie in een publiekrechtelijk college, waarin hij is benoemd of verkozen, gezien
      de omvang van de daaruit voortvloeiende werkzaamheden niet gelijktijdig kan vervullen met zijn functie, wordt in
      verband daarmee op non-activiteit gesteld, tenzij de belangen van de dienst vorderen dat zulks niet geschiedt.
      Betreffende het doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12c
  - number: 12c.2
    text: |-
      Indien de militaire ambtenaar in verband met een functie in een publiekrechtelijk college, waarin hij is benoemd
      of verkozen, niet op non-activiteit is gesteld, wordt hem voor het bijwonen van vergaderingen en zittingen van dit
      college en voor het verrichten van daaruit voortvloeiende werkzaamheden ten behoeve van dit college buitengewoon
      verlof verleend, tenzij de belangen van de dienst vorderen dat het verlof niet wordt verleend. Betreffende het
      doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12c
  - number: 12c.3
    text: |-
      Aan de militaire ambtenaar wordt, tenzij de belangen van de dienst vorderen dat het verlof niet wordt verleend,
      buitengewoon verlof verleend voor aan te wijzen activiteiten van of voor een vereniging van militairen
      overeenkomstig regels te stellen bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12c
  - number: 12d.1
    text: |-
      De militaire ambtenaar is verplicht zich tijdens het verblijf in een gebouw, luchtvaartuig of voertuig alsmede op
      een vaartuig of een terrein, dat in gebruik is bij of ten behoeve van de krijgsmacht of dat de militaire ambtenaar
      tot verblijf of gebruik dient bij de vervulling van zijn taak in internationaal verband, te onderwerpen aan een in
      het belang van de dienst door het bevoegd gezag gelast onderzoek aan zijn lichaam of zijn kleding of van zijn daar
      aanwezige goederen.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12d
  - number: 12d.2
    text: |-
      Het bevoegd gezag, op wiens last het in het vorige lid bedoelde onderzoek plaats heeft, neemt de nodige maatregelen
      ten einde daarbij een onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12d
  - number: 12e
    text: |-
      Het is de militaire ambtenaar in werkelijke dienst verboden, anders dan met toestemming of in opdracht van Onze
      Minister, te reizen naar dan wel te verblijven in:
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12e
  - number: 12e.a
    text: |-
      bij koninklijk besluit aangewezen landen, waarin het verblijf door een militair ambtenaar in werkelijke dienst een
      bijzonder risico voor de veiligheid of andere gewichtige belangen van de Staat of zijn bondgenoten kan opleveren;
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12e
  - number: 12e.b
    text: een land of landsdeel waar feitelijk een gewapend conflict bestaat.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12e
  - number: 12f
    text: |-
      Een gewezen militair ambtenaar, die op het tijdstip van ingang van zijn eervol ontslag tenminste vijftien jaar
      tot het beroeps- of reserve-personeel heeft behoord, behoudt de status van militair ten aanzien van door Onze
      Minister te bepalen voorrechten, zulks tenzij hij van rechtswege is ontslagen of zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen. Bij de bepaling van de termijn van vijftien jaar telt mee de tijd, die
      betrokkene als dienstplichtige in werkelijke dienst heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12f
  - number: 12g.1
    text: |-
      Voor de aanstelling als militair ambtenaar komt, tenzij bij of krachtens algemene maatregel van bestuur anders
      wordt bepaald, slechts in aanmerking degene die Nederlander is.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12g
  - number: 12g.2
    text: |-
      Aan de militaire ambtenaar kan eervol ontslag worden verleend, indien hij op grond van het bepaalde in
      [artikel 5, derde lid][ref1], of [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een
      vertrouwensfunctie moet worden ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '10'
  - number: 12g.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter zake van het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel12g
  - number: '16'
    text: |-
      De artikelen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat voor verschillende artikelen
      verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel16
  - number: '17'
    text: |-
      Deze wet kan worden aangehaald als "Militaire Ambtenarenwet" met bijvoeging van het jaartal van het *Staatsblad*,
      waarin zij wordt afgekondigd.
    url: https://wetten.overheid.nl/BWBR0001952/2005-03-15#Artikel17
