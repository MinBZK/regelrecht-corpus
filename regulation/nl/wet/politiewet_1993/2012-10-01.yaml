  - number: '2'
    text: |-
      De politie heeft tot taak in ondergeschiktheid aan het bevoegde gezag en in overeenstemming met de geldende
      rechtsregels te zorgen voor de daadwerkelijke handhaving van de rechtsorde en het verlenen van hulp aan hen die
      deze behoeven.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel2
  - number: '3'
    text: |-
      1 Ambtenaren van politie in de zin van deze wet zijn:

      a. ambtenaren, aangesteld voor de uitvoering van de politietaak;

      b. ambtenaren, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de
      politie;

      c. vrijwillige ambtenaren, aangesteld voor de uitvoering van de politietaak.

      2 Onder ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, worden mede begrepen: de
      bijzondere ambtenaren van politie, bedoeld in [artikel 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '43'
        hoofdstuk: VII
  - number: '4'
    text: |-
      De politie bestaat uit 25 regionale politiekorpsen, één Korps landelijke politiediensten en de bijzondere
      ambtenaren van politie, bedoeld in [artikel 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '43'
        hoofdstuk: VII
  - number: '5'
    text: |-
      1 Bij algemene maatregel van bestuur op voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken en
      Koninkrijksrelaties worden regels gegeven over de taken die kunnen worden uitgevoerd door vrijwillige ambtenaren.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid treedt niet eerder in werking dan drie maanden
      na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt door Onze Ministers
      onverwijld mededeling gedaan aan de beide Kamers der Staten-Generaal onder overlegging van de over het ontwerp
      uitgebrachte adviezen.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel5
  - number: '6'
    text: |-
      1 Aan de Koninklijke marechaussee zijn, onverminderd het bepaalde bij of krachtens andere wetten, de volgende
      politietaken opgedragen:

      a. het waken voor de veiligheid van de leden van het Koninklijk Huis, in samenwerking met andere daartoe aangewezen
      organen;

      b. de uitvoering van de politietaak ten behoeve van Nederlandse en andere strijdkrachten, alsmede internationale
      militaire hoofdkwartieren, en ten aanzien van tot die strijdkrachten en hoofdkwartieren behorende personen;

      c. de uitvoering van de politietaak op de luchthaven Schiphol en op de andere door Onze Ministers van Justitie, van
      Binnenlandse Zaken en Koninkrijksrelaties en van Defensie aangewezen luchtvaartterreinen, alsmede de beveiliging
      van de burgerluchtvaart;

      d. de verlening van bijstand alsmede de samenwerking met de politie krachtens deze wet, daaronder begrepen de
      assistentieverlening aan de politie bij de bestrijding van grensoverschrijdende criminaliteit;

      e. de uitvoering van de politietaak op plaatsen onder beheer van Onze Minister van Defensie, op verboden plaatsen
      die krachtens de [Wet bescherming staatsgeheimen][ref1] (*Stb.* 1951, 92) ten behoeve van de landsverdediging zijn
      aangewezen, alsmede op het terrein van de ambtswoning van Onze Minister-President;

      f. de uitvoering van de bij of krachtens de [Vreemdelingenwet 2000][ref2] opgedragen taken, waaronder begrepen
      de bediening van de daartoe door Onze Minister van Justitie aangewezen doorlaatposten en het, voor zover in dat
      verband noodzakelijk, uitvoeren van de politietaak op en nabij deze doorlaatposten, alsmede het verlenen van
      medewerking bij de aanhouding of voorgeleiding van een verdachte of veroordeelde;

      g. de bestrijding van mensensmokkel en van fraude met reis- en identiteitsdocumenten;

      h. het in opdracht van Onze Minister van Justitie en van Defensie ten behoeve van De Nederlandsche Bank N.V.
      verrichten van beveiligingswerkzaamheden.

      2 Onder personen die behoren tot de andere strijdkrachten en internationale hoofdkwartieren, bedoeld in het
      eerste lid, onder *b*, worden mede begrepen personen, voor zover aangewezen bij algemene maatregel van bestuur op
      voordracht van Onze Minister van Defensie.

      3 Onze Minister van Justitie kan de commandant van de Koninklijke marechaussee de nodige algemene en bijzondere
      aanwijzingen geven, voorzover het betreft:

      a. de uitoefening van de taken, bedoeld in het eerste lid, onder a en h;

      b. het waken voor de veiligheid van door Onze Minister van Justitie aangewezen personen als bedoeld in het eerste
      lid, onder b;

      c. de uitoefening van de taak, bedoeld in het eerste lid, onder c, ten behoeve van de strafrechtelijke handhaving
      van de rechtsorde en de beveiliging van de burgerluchtvaart;

      d. de bewaking en beveiliging van de ambtswoning van Onze Minister-President, bedoeld in het eerste lid, onder e.

      4 Hoewel bevoegd tot de opsporing van alle strafbare feiten, onthoudt de militair van de Koninklijke marechaussee
      die is aangewezen krachtens [artikel 141 van het Wetboek van Strafvordering][ref3], zich van optreden anders dan in
      het kader van de uitoefening van zijn politietaken, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002074
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
