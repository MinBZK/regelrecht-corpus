  - number: '53'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan aan een korpsbeheerder de nodige aanwijzingen
      ten aanzien van het beheer geven, indien het belang van het beheer van de politie dit eist. De aanwijzingen worden
      schriftelijk gegeven en na overleg met de korpsbeheerder.

      2 Onverminderd het eerste lid, en de [artikelen 46][ref1], [47][ref2] en [47a][ref3], kunnen in bijzondere gevallen
      waarin onverwijld een voorziening moet worden getroffen betreffende de samenwerking tussen regionale politiekorpsen
      of de samenwerking tussen regionale politiekorpsen en het Korps landelijke politiediensten ten aanzien van
      de strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie,
      aanwijzingen worden gegeven door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met
      Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel47a
