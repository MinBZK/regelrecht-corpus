        hoofdstuk: IV
  - number: '18'
    text: |-
      1 De commissaris van de Koning ziet toe dat de politie in zijn ambtsgebied haar taak de openbare orde te handhaven
      en hulp te verlenen naar behoren vervult.

      2 Hij ziet eveneens toe op een juiste vervulling van de taak ter handhaving van de openbare orde die de Koninklijke
      marechaussee op grond van deze wet uitvoert.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel18
  - number: '19'
    text: |-
      1 Het College van procureurs-generaal ziet toe dat de politie haar taak met betrekking tot de strafrechtelijke
      handhaving van de rechtsorde en haar taken ten dienste van de justitie naar behoren vervult.

      2 Het College van procureurs-generaal ziet eveneens toe op een juiste vervulling van de taken die de Koninklijke
      marechaussee ten behoeve van de strafrechtelijke handhaving van de rechtsorde, dan wel ten dienste van de justitie,
      op grond van deze wet uitvoert of verricht.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel19
  - number: '20'
    text: |-
      1 De commissaris van de Koning en het College van procureurs-generaal plegen regelmatig met elkaar overleg over de
      taakuitoefening van de politie en de Koninklijke marechaussee in het ambtsgebied van de betrokken commissaris van
      de Koning. Zij verstrekken elkaar de gewenste inlichtingen.

      2 De burgemeester en de officier van justitie verstrekken aan de commissaris van de Koning en aan het College van
      procureurs-generaal, met betrekking tot de politie en de vervulling van haar taak, de gewenste inlichtingen en doen
      hun ook ongevraagd mededeling van hetgeen ter zake van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel20
  - number: '21'
    text: |-
      1 Het Nederlandse grondgebied is verdeeld in 25 regio’s overeenkomstig de bij deze wet behorende bijlage. Deze
      bijlage kan, voor zover het de grenzen van de regio’s en de naamgeving van de daarin voorkomende gemeenten betreft,
      bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      worden gewijzigd. Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties kunnen regels worden gegeven over de overgang van personeel, vermogensrechten, rechtsgedingen
      of andere rechten en verplichtingen, alsmede over de overgang van archieven indien een wijziging van de grenzen van
      de regio’s daartoe aanleiding geeft.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid, tweede volzin, treedt niet eerder in werking
      dan drie maanden na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties onverwijld mededeling gedaan aan de beide Kamers
      der Staten-Generaal onder overlegging van de over het ontwerp van de algemene maatregel van bestuur uitgebrachte
      adviezen.

      3 In elke regio is een regionaal politiekorps.

      4 De regio is rechtspersoon.

      5 De regio heeft haar zetel in de gemeente die in de bijlage, genoemd in het eerste lid, als zodanig voor elke
      regio is aangewezen.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel21
  - number: '22'
    text: |-
      1 De regio wordt bestuurd door het regionale college overeenkomstig de [artikelen 30][ref1] en [31][ref2].

      2 Het regionale college bestaat uit de burgemeesters van de gemeenten in de regio en de hoofdofficier van justitie.
      Aan de vergaderingen van het regionale college wordt tevens deelgenomen door de korpschef.

      3 Voorzitter van het regionale college is de korpsbeheerder. Hij vertegenwoordigt de regio in en buiten rechte.

      4 Op de burgemeesters, bedoeld in het tweede lid, is [artikel 180 van de Gemeentewet][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel180
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '30'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '180'
  - number: '23'
    text: |-
      1 In elke regio is een korpsbeheerder die bij koninklijk besluit op voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties, gehoord het regionale college, wordt benoemd en herbenoemd uit de burgemeesters van
      de gemeenten in de regio voor een periode van zes jaar.

      2 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kunnen nadere regels worden gegeven omtrent de bij de benoeming te volgen procedure.

      3 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties worden regels gegeven omtrent de rechtspositie van de korpsbeheerder.

      4 Het regionale college wijst in overeenstemming met de korpsbeheerder een burgemeester van een gemeente in de
      regio aan die de korpsbeheerder bij afwezigheid, belet of ontstentenis vervangt.

      5 De korpsbeheerder kan bij koninklijk besluit op voordracht van Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties worden geschorst en ontslagen, in ieder geval als de doelstellingen, bedoeld in
      [artikel 43b][ref1], niet of in onvoldoende mate zijn of worden verwezenlijkt.

      6 In geval van schorsing of ontslag van de korpsbeheerder kan in bijzondere omstandigheden bij koninklijk besluit
      op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een waarnemend korpsbeheerder worden
      benoemd voor wie niet de vereisten gelden, bedoeld in het eerste lid.

      7 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vraagt ter zake van de benoeming, de
      herbenoeming, de schorsing en het ontslag van de korpsbeheerder, alsmede omtrent de benoeming van een waarnemend
      korpsbeheerder, advies aan de commissaris van de Koning, die volgens bij de ambtsinstructie, bedoeld in
      [artikel 182 van de Provinciewet][ref2], gegeven regels advies uitbrengt, en, door tussenkomst van Onze Minister
      van Justitie, aan het College van procureurs-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel182
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel23
