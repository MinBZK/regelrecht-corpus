  - number: '61'
    text: |-
      1 Het regionale college stelt, op voorstel van de korpsbeheerder, nadere regels vast over de behandeling van
      klachten over gedragingen van ambtenaren van politie van het regionale politiekorps.

      2 In de regels, bedoeld in het eerste lid, wordt voorzien in:

      a. de instelling van een commissie, bestaande uit onafhankelijke leden, die op de wijze in de regeling te bepalen
      is belast met de behandeling van en advisering over in de regeling aangewezen categorieën van klachten waarbij zo
      nodig aandacht wordt geschonken aan de in onderdeel c genoemde aspecten;

      b. de registratie van de mondeling en schriftelijk ingediende klachten en, indien beschikbaar, de daarop genomen
      beslissingen, alsmede

      c. een jaarlijkse publicatie van de geregistreerde klachten en beslissingen, waarin wordt aangegeven in hoeverre
      bepaalde klachten wijzen op structurele tekortkomingen in het functioneren van de politie en waarin, zo nodig,
      aandacht wordt geschonken aan de middelen om deze tekortkomingen op te heffen.

      3 [Afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de behandeling van klachten als
      bedoeld in het tweede lid, onder a. Indien een commissie over de klacht zal adviseren, deelt de korpsbeheerder dit,
      in afwijking van [artikel 9:15, eerste lid van de Algemene wet bestuursrecht][ref2], zo spoedig mogelijk aan de
      indiener van de klacht mede.

      4 De korpsbeheerder draagt zorg voor de bekendmaking van de regels, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel915
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel61
