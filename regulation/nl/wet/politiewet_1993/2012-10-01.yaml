  - number: '12'
    text: |-
      1 Indien de politie in een gemeente optreedt ter handhaving van de openbare orde en ter uitvoering van de
      hulpverleningstaak, staat zij onder gezag van de burgemeester.

      2 De burgemeester kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling van de in
      het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel12
  - number: '13'
    text: |-
      1 Indien de politie optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten dienste
      van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier van justitie.

      2 De officier van justitie kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling
      van de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel13
  - number: '14'
    text: |-
      De burgemeester en de officier van justitie overleggen regelmatig tezamen met het hoofd van het territoriale
      onderdeel van het regionale politiekorps, binnen welks grondgebied de gemeente geheel of ten dele valt, en, zo
      nodig, met de korpschef, over de taakuitvoering van de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel14
  - number: '15'
    text: |-
      1 Voor zover de Koninklijke marechaussee optreedt ter handhaving van de openbare orde staat zij onder gezag van
      de burgemeester. Voor zover zij optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht
      ten dienste van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier van
      justitie. Het hoofd van het onderdeel van de Koninklijke marechaussee neemt alsdan aan het in [artikel 14][ref1]
      bedoelde overleg deel op de wijze als daar is aangegeven.

      2 Het eerste lid is van overeenkomstige toepassing op de militair van enig ander onderdeel van de krijgsmacht,
      indien hij bijstand verleent aan de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel14
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '14'
        hoofdstuk: IV
  - number: 15a
    text: |-
      1 Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie gezamenlijk kunnen objecten en
      diensten aanwijzen waarvan bewaking of beveiliging door de politie noodzakelijk is in het belang van de veiligheid
      van de Staat of de betrekkingen van Nederland met andere mogendheden, dan wel met het oog op zwaarwegende belangen
      van de samenleving.

      2 De burgemeester draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voorzover dat
      geschiedt ter handhaving van de openbare orde.

      3 De officier van justitie draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voorzover
      dat geschiedt ter strafrechtelijke handhaving van de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel15a
  - number: '16'
    text: |-
      1 De commissaris van de Koning geeft, indien een ordeverstoring van meer dan plaatselijke betekenis dan wel
      ernstige vrees voor het ontstaan van zodanige ordeverstoring zulks noodzakelijk maakt, de burgemeesters in de
      provincie zoveel mogelijk na overleg met hen, de nodige aanwijzingen met betrekking tot het door hen ter handhaving
      van de openbare orde te voeren beleid.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan de commissarissen van de Koning, de burgemeesters
      en, in geval van een situatie als bedoeld in [artikel 39 van de Wet veiligheidsregio’s][ref1], de voorzitter van
      een veiligheidsregio, zoveel mogelijk na overleg met hen, algemene en bijzondere aanwijzingen geven met betrekking
      tot de handhaving van de openbare orde, voorzover dat noodzakelijk is in het belang van de veiligheid van de
      Staat of de betrekkingen van Nederland met andere mogendheden, dan wel met het oog op zwaarwegende belangen van
      de samenleving.

      3 De in het eerste en tweede lid bedoelde aanwijzingen worden zo enigszins mogelijk schriftelijk gegeven.

      4 De in het tweede lid bedoelde aanwijzingen aan de burgemeesters worden zoveel mogelijk gegeven door tussenkomst
      van de commissaris van de Koning. Indien dit niet mogelijk is, wordt hij zo spoedig mogelijk daarvan in kennis
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '17'
    text: |-
      1 Ten behoeve van de toepassing van de [artikelen 15a, tweede lid][ref1], en [16][ref2] verstrekken de
      burgemeesters, de commissarissen van de Koning en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      elkaar de gewenste inlichtingen.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels geven ter uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel16
