      2 Onze Minister van Justitie stelt de regels, bedoeld in [artikel 61, eerste lid][ref2], vast ten aanzien van
      klachten over het optreden van bijzondere ambtenaren van politie als bedoeld in [artikel 43][ref3].

      3 [Artikel 61, tweede tot en met vierde lid][ref4], is van overeenkomstige toepassing.


