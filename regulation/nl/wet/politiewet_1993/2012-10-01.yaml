  - number: '48'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels geven over de informatie- en
      communicatievoorzieningen van en het gebruik daarvan door de politie, alsmede over de informatiebeveiliging door de
      politie. Voor zover deze regels van belang zijn voor de uitvoering van de politietaken bedoeld in [artikel 6][ref1]
      kunnen zij, in overeenstemming met Onze Minister van Defensie, mede worden gegeven ten aanzien van de Koninklijke
      marechaussee.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan de politiekorpsen frequenties toewijzen voor de
      overdracht van gegevens door middel van daartoe aangewezen informatie- en communicatievoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel6
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel48
