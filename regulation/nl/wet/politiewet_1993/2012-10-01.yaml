  - number: '70'
    text: |-
      1 De Politiewet (*Stb.* 1989, 223) en de Wet tijdelijke voorzieningen reorganisatie politiebestel (*Stb.* 1991,
      674) worden ingetrokken.

      2 Totdat terzake bij de wet een voorziening zal zijn getroffen, blijven Hoofdstuk VII van de Politiewet, bedoeld in
      het eerste lid, en de daarop berustende bepalingen van kracht, met dien verstande dat

      a. voor "gemeentepolitie" wordt gelezen: regionale politiekorpsen,

      b. voor "het Korps Rijkspolitie" wordt gelezen: het Korps landelijke politiediensten, en

      c. voor "ambtenaren van gemeente- en rijkspolitie" wordt gelezen: ambtenaren van politie.

      3 Tot een bij koninklijk besluit te bepalen tijdstip blijven het
      [Besluit sociaal beleidskader reorganisatie politiebestel][ref1] en het
      [Besluit vergoeding reorganisatiekosten politie][ref2] van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005607
      [ref2]: https://wetten.overheid.nl/BWBR0005911
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005607
      - id: ref2
        bwb_id: BWBR0005911
