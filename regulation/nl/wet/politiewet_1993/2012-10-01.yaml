  - number: '9'
    text: |-
      1 Bij algemene maatregel van bestuur op voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken
      en Koninkrijksrelaties wordt, in overeenstemming met Onze Minister van Defensie voor zover het de Koninklijke
      marechaussee betreft, een ambtsinstructie voor de politie en voor de Koninklijke marechaussee vastgesteld.

      2 Indien de militair van enig ander onderdeel van de krijgsmacht optreedt bij de uitvoering van zijn in de
      [artikelen 59][ref1] en [60][ref2] omschreven taken is de ambtsinstructie van toepassing.

      3 In de ambtsinstructie worden regels gegeven ter uitvoering van de [artikelen 7][ref3] en [8][ref4].

      4 Bij algemene maatregel van bestuur of krachtens algemene maatregel van bestuur bij ministeriële regeling
      worden regels gegeven omtrent maatregelen waaraan rechtens van hun vrijheid beroofde personen met het oog op
      hun insluiting kunnen worden onderworpen, voor zover dit noodzakelijk is in het belang van hun veiligheid of de
      veiligheid van anderen. De algemene maatregel van bestuur wordt vastgesteld op voordracht van Onze Ministers van
      Justitie, en van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister van Defensie voor
      zover het de Koninklijke marechaussee betreft.

      5 Het vierde lid is van overeenkomstige toepassing op personen, die ten behoeve van de hulpverlening aan hen zijn
      ondergebracht bij de politie of de Koninklijke marechaussee.

      6 De ambtenaren die door Onze Minister van Justitie zijn aangewezen voor het vervoer van rechtens van hun vrijheid
      beroofde personen, kunnen de bevoegdheden, bedoeld in [artikel 8, eerste en derde lid][ref5], uitoefenen, dan wel
      de maatregelen, bedoeld in het vierde lid, treffen, voor zover dit noodzakelijk is met het oog op de voorkoming
      van het zich onttrekken van de te vervoeren persoon aan het op hem uitgeoefende toezicht. De eerste volzin is
      van toepassing voor zover de rechtens van hun vrijheid beroofde personen zijn ondergebracht bij de politie of de
      Koninklijke marechaussee.


