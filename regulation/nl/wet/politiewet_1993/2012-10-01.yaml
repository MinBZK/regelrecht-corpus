        bwb_id: BWBR0006299
        artikel: 60b
        hoofdstuk: IXa
  - number: 60b
    text: |-
      1 Behoeft de Koninklijke marechaussee bijstand van politiekorpsen voor de handhaving van de openbare orde,
      dan richt Onze Minister van Defensie op aanvrage van de burgemeester een verzoek daartoe aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.

      2 Indien bijstand van regionale politiekorpsen nodig is, verstrekt Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties de nodige opdrachten aan de betrokken korpsbeheerders en stelt Onze Ministers van Defensie en
      van Justitie daarvan in kennis.

      3 Indien bijstand van het Korps landelijke politiediensten nodig is, treft Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties de nodige voorzieningen en stelt Onze Ministers van Defensie en van Justitie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel60b
  - number: 60c
    text: |-
      1 Behoeft de Koninklijke marechaussee bijstand van politiekorpsen voor de strafrechtelijke handhaving van de
      rechtsorde, dan wel voor het verrichten van taken ten dienste van de justitie, dan richt Onze Minister van Defensie
      op aanvrage van de officier van justitie een verzoek daartoe aan het College van procureurs-generaal.

      2 Indien bijstand van regionale politiekorpsen nodig is, verstrekt het College van procureurs-generaal aan
      de betrokken korpsbeheerders de nodige opdrachten en stelt Onze Ministers van Justitie, van Defensie en van
      Binnenlandse Zaken en Koninkrijksrelaties daarvan in kennis.

      3 Indien bijstand van het Korps landelijke politiediensten nodig is, brengt het College van procureurs-generaal
      de aanvrage van Onze Minister van Defensie om bijstand ter kennis van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, die de nodige voorzieningen treft en Onze Ministers van Defensie en van Justitie en het
      College van procureurs-generaal daarvan in kennis stelt.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel60c
  - number: 60d
    text: |-
      1 Behoeft de Koninklijke marechaussee bijstand van regionale politiekorpsen bij de uitoefening van de taken die
      zij op grond van [artikel 6, derde lid][ref1], verricht onder verantwoordelijkheid van Onze Minister van Justitie,
      dan verstrekt Onze Minister van Justitie, in overeenstemming met Onze Minister van Defensie en na overleg met het
      college van procureurs-generaal, aan de betrokken korpsbeheerders de nodige opdrachten.

      2 Behoeft de Koninklijke marechaussee bijstand van het Korps landelijke politiediensten bij de uitoefening van de
      taken die zij op grond van [artikel 6, derde lid][ref2], verricht onder verantwoordelijkheid van Onze Minister van
      Justitie, dan treft Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, op verzoek van Onze Minister van
      Justitie in overeenstemming met Onze Minister van Defensie, de nodige voorzieningen.

      3 [Artikel 6, derde lid][ref3], is van overeenkomstige toepassing ten aanzien van de korpschef van een regionaal
      politiekorps, onderscheidenlijk de korpschef van het Korps landelijke politiediensten, voorzover dat korps bijstand
      verleent aan de Koninklijke marechaussee als bedoeld in het eerste lid, onderscheidenlijk tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel6
