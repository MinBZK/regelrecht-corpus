        bwb_id: BWBR0006299
        artikel: '25'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '52'
        hoofdstuk: VIII
  - number: '27'
    text: |-
      1 De korpsbeheerder en de hoofdofficier van justitie overleggen regelmatig tezamen met de korpschef.

      2 Het in het eerste lid bedoelde overleg vindt in elk geval plaats over:

      a. het ontwerp van de organisatie, de formatie, de begroting, de jaarrekening, het beleidsplan en het jaarverslag
      voor het regionale politiekorps;

      b. de uitvoering van het beleidsplan en de verwezenlijking van de doelstellingen, bedoeld in [artikel 43b][ref1].

      3 De korpsbeheerder en de hoofdofficier van justitie, alsmede de korpschef, verschaffen elkaar de gewenste
      inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
  - number: '28'
    text: |-
      1 De korpsbeheerder stelt in overeenstemming met de hoofdofficier van justitie en met inachtneming van
      [artikel 43b, derde en vierde lid][ref1], tenminste eenmaal in de vier jaar het ontwerp van het beleidsplan en
      jaarlijks het ontwerp van de organisatie, de formatie, de begroting, de jaarrekening en het jaarverslag voor het
      regionale politiekorps op. Voorafgaand aan het opstellen van het ontwerp van het beleidsplan, bedoeld in de eerste
      volzin, worden de gemeenteraden in de regio gehoord over de lokale prioriteiten in hun gemeenten.

      2 De in het eerste lid bedoelde stukken worden onverwijld ter kennis gebracht van de gemeenteraden in de regio, de
      commissaris van de Koning en het College van procureurs-generaal en ter vaststelling toegezonden aan het regionale
      college.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
  - number: '29'
    text: |-
      Indien de korpsbeheerder en de hoofdofficier van justitie niet met elkaar tot overeenstemming kunnen komen over de
      in [artikel 28, eerste en tweede lid][ref1], bedoelde stukken, legt de korpsbeheerder dit verschil van zienswijze
      schriftelijk voor aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties die alsdan, in overeenstemming
      met Onze Minister van Justitie, beslist. De korpsbeheerder brengt de stukken in overeenstemming met de beslissing
      van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel28
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '28'
        hoofdstuk: V
  - number: '30'
    text: |-
      1 Onverminderd [artikel 43d][ref1], legt de korpsbeheerder over het door hem gevoerde beheer van het regionale
      politiekorps verantwoording af aan het regionale college.

      2 De korpsbeheerder en de hoofdofficier van justitie, alsmede, indien daartoe door de korpsbeheerder uitgenodigd,
      de korpschef, geven, zo nodig vertrouwelijk, mondeling of schriftelijk de door een of meer leden van het regionale
      college gevraagde inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43d
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43d
        hoofdstuk: VIII
  - number: '31'
    text: |-
      1 Het regionale college stelt tenminste eenmaal in de vier jaar het beleidsplan en jaarlijks de organisatie, de
      formatie, de begroting, de jaarrekening, en het jaarverslag voor het regionale politiekorps vast. Onverminderd de
      zeggenschap van het bevoegd gezag is de korpsbeheerder eindverantwoordelijk voor de uitvoering van het beleidsplan.

      2 Zodra het beleidsplan en het jaarverslag, bedoeld in het eerste lid, zijn vastgesteld, zendt de korpsbeheerder
      deze aan Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie alsmede aan de gemeenteraden
      in de regio, de commissaris van de Koning en het College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel31
  - number: '32'
    text: |-
      1 De korpsbeheerder, dan wel de hoofdofficier van justitie kan tegen de vaststelling van de stukken, bedoeld in
      [artikel 31, eerste lid][ref1],, administratief beroep instellen bij de commissaris van de Koning. Deze beslist
      in overeenstemming met het College van procureurs-generaal op het beroep. De korpsbeheerder brengt de stukken in
      overeenstemming met het besluit van de commissaris van de Koning.

      2 Indien de commissaris van de Koning en het College van procureurs-generaal niet tot overeenstemming komen over
      de beslissing op het beroep, treden Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister
      van Justitie in de plaats van de commissaris van de Koning, respectievelijk het College van procureurs-generaal.
      De korpsbeheerder brengt de stukken in overeenstemming met het besluit van Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.

      3 Bij de ambtsinstructie, bedoeld in [artikel 182 van de Provinciewet][ref2], worden nadere regels gegeven over de
      taken van de commissaris van de Koning, bedoeld in het eerste en tweede lid.

      4 [Artikel 7:24, eerste lid, van de Algemene wet bestuursrecht][ref3] is niet van toepassing.
      [Artikel 7:25 van de Algemene wet bestuursrecht][ref4] is niet van toepassing voor zover het het beroepsorgaan
      verplicht een nieuw besluit te nemen.

      5 In spoedeisende gevallen kan de korpsbeheerder, in overeenstemming met de hoofdofficier van justitie, zolang
      niet op het beroep is beslist, een voorlopige voorziening treffen, waarbij zo nodig wordt afgeweken van het
      besluit van het regionale college. Deze voorziening komt te vervallen zodra de stukken in overeenstemming zijn
      gebracht met het besluit van de commissaris van de Koning onderscheidenlijk Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties. Van de inhoud van de voorlopige voorziening wordt onverwijld aan het regionale college kennis
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel182
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel724
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel725
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel32
