  - number: '64'
    text: |-
      1 De korpsbeheerder van het regionale politiekorps waarbij de ambtenaar van politie is aangesteld over wiens
      gedraging een klacht is ingediend, draagt zorg voor de behandeling van deze klacht.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties draagt zorg voor de behandeling van een klacht die is
      ingediend over een gedraging van een ambtenaar van het Korps landelijke politiediensten.

      3 Onze Minister van Justitie draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van
      een bijzonder ambtenaar van politie.

      4 Onze Minister van Defensie draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van
      een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel van de krijgsmacht, bij de uitvoering
      van zijn in deze wet omschreven taken.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel64
  - number: '65'
    text: |-
      1 Een klacht over een gedraging van een ambtenaar van politie of van een militair van de Koninklijke marechaussee
      dan wel van enig ander onderdeel van de krijgsmacht, bij de uitvoering van zijn in deze wet omschreven taken, wordt
      ingediend bij de korpsbeheerder binnen wiens regio de gedraging waarover wordt geklaagd, heeft plaatsgevonden.

      2 Een klacht over een gedraging van een ambtenaar van het Korps landelijke politiediensten kan ook worden ingediend
      bij Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      3 Een klacht over een gedraging van een bijzonder ambtenaar van politie kan ook worden ingediend bij Onze Minister
      van Justitie.

      4 Een klacht over een gedraging van een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel
      van de krijgsmacht, bij de uitvoering van zijn in deze wet omschreven taken, kan ook worden ingediend bij Onze
      Minister van Defensie.

      5 De korpsbeheerder, bedoeld in het eerste lid, draagt zorg voor een onverwijlde doorzending van een klacht
      over het optreden van een ambtenaar van politie die is aangesteld bij een ander regionaal politiekorps, aan de
      korpsbeheerder van dat regionale politiekorps. Een klacht als bedoeld in het tweede, derde en vierde lid wordt
      onverwijld doorgezonden aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze Minister van
      Justitie, onderscheidenlijk Onze Minister van Defensie.

      6 Tenzij reeds naar tevredenheid van de klager aan diens klacht tegemoet is gekomen, wordt van de klacht onverwijld
      na de ontvangst ervan, afschrift gezonden aan de burgemeester van de gemeente waar de gedraging waarover wordt
      geklaagd, heeft plaatsgevonden, alsmede aan de hoofdofficier van justitie van de regio binnen welke de gemeente is
      gelegen waar de gedraging waarover wordt geklaagd, heeft plaatsgevonden. De burgemeester en de hoofdofficier van
      justitie worden in de gelegenheid gesteld over de klacht advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel65
  - number: '66'
    text: |-
      In afwijking van [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt de klacht afgehandeld
      binnen tien weken of, indien een commissie als bedoeld in [artikel 61, tweede lid, onder a][ref2], is belast met de
      behandeling van en advisering over de klacht, binnen veertien weken na de ontvangst van het klaagschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel911
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel61
