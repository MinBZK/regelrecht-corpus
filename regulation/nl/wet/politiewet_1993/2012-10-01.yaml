  - number: '51'
    text: |-
      Bij algemene maatregel van bestuur worden op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties regels gegeven over de rangen van de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel51
  - number: '52'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      wordt bepaald welke andere ambtenaren van politie dan die bedoeld in de [artikelen 25, eerste en derde lid][ref1],
      en [42][ref2] worden benoemd, bevorderd, geschorst en ontslagen bij koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel25
