  - number: 53a
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties heeft met het oog op een goede taakuitvoering door de
      politie en een doelmatig en effectief beheer van de politiekorpsen de bevoegdheid tot:

      a. het toetsen van de wijze waarop de beheerders van de politiekorpsen voorzien in de kwaliteit van de
      taakuitvoering, de resultaten en het beheer van de politie;

      b. het toetsen van specifieke onderdelen van de taakuitvoering dan wel het beheer van de politie;

      c. het verrichten van onderzoek, indien daar in bijzondere gevallen reden toe is, naar ingrijpende
      gebeurtenissen waarbij de politie betrokken is, tenzij de Onderzoeksraad voor veiligheid, bedoeld in
      [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], naar het desbetreffende voorval een onderzoek
      instelt;

      d. het verrichten van onderzoek, indien in andere bijzondere gevallen dan die, bedoeld
      onder c, dit nodig wordt geoordeeld, tenzij de Onderzoeksraad voor veiligheid, bedoeld in
      [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref2], naar het desbetreffende voorval een onderzoek
      instelt;

      e. het toezicht op de kwaliteit van de politieopleidingen en de examinering.

      2 De werkzaamheden die in het kader van het eerste lid, onder a en b, worden uitgevoerd, worden jaarlijks door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie
      vastgesteld.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties oefent de bevoegdheid, genoemd in het eerste lid,
      onder c, en die, genoemd in het eerste lid, onder d, uit na overleg onderscheidenlijk in overeenstemming met Onze
      Minister van Justitie.

      4 De bevoegdheid, genoemd in het eerste lid, onder c, en die, genoemd in het eerste lid, onder d, komen eveneens
      toe aan onze Minister van Justitie, indien de ingrijpende gebeurtenissen onderscheidenlijk de andere bijzondere
      gevallen betrekking hebben op de taakuitvoering door de politie in het kader van de strafrechtelijke handhaving van
      de rechtsorde, dan wel de taken ten dienste van de justitie. Hij oefent de bevoegdheid, genoemd in het eerste lid,
      onder c, en die, genoemd in het eerste lid, onder d, uit na overleg onderscheidenlijk in overeenstemming met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      5 De Inspectie Openbare Orde en Veiligheid, bedoeld in [artikel 57 van de Wet veiligheidsregio’s][ref3], is
      belast met de werkzaamheden die in het kader van het eerste en het vierde lid worden uitgevoerd.

      6 De beheerders van de politiekorpsen verlenen Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      respectievelijk Onze Minister van Justitie de door deze verlangde ondersteuning bij de uitvoering van de
      werkzaamheden in het kader van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017613#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027466#Artikel57
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel53a
