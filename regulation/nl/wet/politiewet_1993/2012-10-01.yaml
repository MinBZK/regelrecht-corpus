  - number: '7'
    text: |-
      1 De ambtenaar van politie is bevoegd zijn taak uit te oefenen in het gehele land.

      2 Hoewel bevoegd in het gehele land, onthoudt de ambtenaar van politie zich van optreden buiten zijn gebied van
      aanstelling, tenzij ingevolge regels, gesteld bij of krachtens de wet, dan wel in opdracht of met toestemming van
      het bevoegde gezag over de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel7
  - number: '8'
    text: |-
      1 De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak is bevoegd in de rechtmatige
      uitoefening van zijn bediening geweld te gebruiken, wanneer het daarmee beoogde doel dit, mede gelet op de aan het
      gebruik van geweld verbonden gevaren, rechtvaardigt en dat doel niet op een andere wijze kan worden bereikt. Aan
      het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.

      2 De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak heeft toegang tot elke plaats,
      voor zover dat voor het verlenen van hulp aan hen die deze behoeven, redelijkerwijs nodig is.

      3 De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak is bevoegd tot het onderzoek aan
      de kleding van personen bij de uitoefening van een hem wettelijk toegekende bevoegdheid of bij een handeling ter
      uitvoering van de politietaak, indien uit feiten of omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor
      hun leven of veiligheid, die van de ambtenaar zelf of van derden en dit onderzoek noodzakelijk is ter afwending van
      dit gevaar.

      4 De officier van justitie of de hulpofficier van justitie voor wie aangehouden of rechtens van hun vrijheid
      beroofde verdachten of veroordeelden worden geleid, is bevoegd te bepalen dat deze aan hun lichaam zullen worden
      onderzocht, indien uit feiten of omstandigheden blijkt dat gevaar dreigt voor hun leven of veiligheid of die van de
      ambtenaar zelf en dit onderzoek noodzakelijk is ter afwending van dit gevaar.

      5 De uitoefening van de bevoegdheden, bedoeld in het eerste tot en met vierde lid, dient in verhouding tot het
      beoogde doel redelijk en gematigd te zijn.

      6 Het eerste tot en met het vijfde lid zijn tevens van toepassing op de militair van de Koninklijke marechaussee,
      indien hij optreedt in de rechtmatige uitoefening van zijn bediening, en op de militair van enig ander onderdeel
      van de krijgsmacht die op grond van deze wet bijstand verleent aan de politie.

      7 Onze Minister van Justitie kan bepalen, dat de in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1] bedoelde buitengewone opsporingsambtenaren,
      voor zover door hem hetzij in persoon hetzij per categorie of eenheid aangewezen, de bevoegdheden omschreven in
      het eerste en derde lid kunnen uitoefenen. Alsdan wordt met overeenkomstige toepassing van [artikel 9][ref2] een
      ambtsinstructie voor hen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel9
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel8
