  - number: 48a
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan bij ministeriële regeling eisen stellen aan
      bekwaamheid van de ambtenaren van politie.

      2 Indien de aard van de werkzaamheden van de politie ten behoeve van de strafrechtelijke handhaving van de
      rechtsorde en de taken ten dienste van de justitie specifieke vaardigheid of kennis vereist, kunnen Onze Ministers
      van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie bij ministeriële regeling eisen vaststellen waaraan
      de met die werkzaamheden belaste ambtenaren van politie moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel48a
  - number: 48b
    text: |-
      1 Het regionale politiekorps registreert gegevens voor door Onze Ministers van Justitie en van Binnenlandse Zaken
      en Koninkrijksrelaties te bepalen doeleinden en door hen te bepalen categorieën dan wel in door hen aan te wijzen
      wettelijk geregelde registers en verstrekt deze gegevens aan door hen aan te wijzen personen en instanties,
      onverminderd het bepaalde bij of krachtens de [Wet politiegegevens][ref1].

      2 Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen bepalen dat in door hen aan
      te wijzen registers geen andere dan de in het eerste lid bedoelde gegevens worden geregistreerd en dat door hen aan
      te wijzen categorieën van gegevens in geen andere dan door hen aan te wijzen registers worden geregistreerd.

      3 Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels geven over de wijze
      waarop de gegevens, bedoeld in het eerste lid, worden geregistreerd, verwijderd dan wel verstrekt en op welke wijze
      bestandsvergelijking met die gegevens plaatsvindt.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ter uitvoering van het derde lid nadere regels
      geven over de schrijfwijze, classificatie of codering van gegevens en de samenstelling van de gegevens in de vorm
      van berichten.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: '49'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties geeft bij ministeriële regeling regels over de
      bewapening, de uitrusting en de kleding van de politie.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt in overeenstemming met Onze Minister van
      Justitie eisen vast waaraan de bewapening van de politie in verband met de taakuitvoering moet voldoen.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel49
  - number: 49a
    text: |-
      De opleidingen voor ambtenaren van politie worden verzorgd door het Landelijk selectie- en opleidingsinstituut
      politie, Politie onderwijs- en kenniscentrum.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel49a
  - number: '50'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties worden voor de politie regels gegeven over de onderwerpen, genoemd in
      [artikel 125, eerste lid][ref1], en [artikel 125quinquies, eerste lid van de Ambtenarenwet][ref2].

      2 Voor de toepassing van de [Wet veiligheidsonderzoeken][ref3] bij de politie wordt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties aangemerkt als Onze Minister, bedoeld in
      [artikel 1, eerste lid, onder c, van de Wet veiligheidsonderzoeken][ref4].

      3 De ambtenaar van politie die te goeder trouw de bij hem levende vermoedens van misstanden meldt volgens de
      op grond van het eerste lid vast te stellen regels voor het omgaan met bij een ambtenaar levende vermoedens van
      misstanden binnen de organisatie waar hij werkzaam is, zal als gevolg van het melden van die vermoedens geen
      nadelige gevolgen voor zijn rechtspositie ondervinden tijdens en na het volgen van die procedure.

      4 Het tot aanstelling bevoegd gezag van ambtenaren van politie,

      a. voert een integriteitsbeleid dat is gericht op het bevorderen van goed ambtelijk handelen en dat in ieder geval
      aandacht besteedt aan het bevorderen van integriteitsbewustzijn en aan het voorkomen van misbruik van bevoegdheden,
      belangenverstrengeling en discriminatie;

      b. zorgt ervoor dat het integriteitsbeleid een vast onderdeel uitmaakt van het personeelsbeleid in ieder geval door
      integriteit in functioneringsgesprekken en werkoverleg aan de orde te stellen en door het aanbieden van scholing en
      vorming op het gebied van integriteit;

      c. draagt zorg voor de totstandkoming van een gedragscode voor goed ambtelijk handelen;

      d. stelt in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vast op welke
      wijze jaarlijks verantwoording wordt afgelegd over het gevoerde integriteitsbeleid en over de naleving van de
      gedragscode.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125quinquies
      [ref3]: https://wetten.overheid.nl/BWBR0008277
      [ref4]: https://wetten.overheid.nl/BWBR0008277#Artikel1
