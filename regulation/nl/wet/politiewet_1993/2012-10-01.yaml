  - number: '46'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels geven over de samenwerking tussen
      regionale politiekorpsen of tussen regionale politiekorpsen en het Korps landelijke politiediensten.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan in overeenstemming met Onze Minister van Defensie
      regels geven over de samenwerking van de regionale politiekorpsen of het Korps landelijke politiediensten met de
      Koninklijke marechaussee.

      3 Indien de regels, bedoeld in het eerste en tweede lid, voorschriften bevatten die ten behoeve van de
      strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie moeten
      worden gesteld, worden zij gegeven door Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van
      Justitie gezamenlijk, onderscheidenlijk door Onze voornoemde Ministers en Onze Minister van Defensie gezamenlijk.

      4 Alvorens de regels, bedoeld in het eerste en tweede lid, worden gegeven, kunnen de korpsbeheerders worden
      gehoord.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel46
  - number: '47'
    text: |-
      1 Regio's, dan wel regio's tezamen met het Rijk ten behoeve van het Korps landelijke politiediensten, kunnen een
      voorziening tot samenwerking treffen ter bevordering van een doelmatig beheer van de politie. Een voorziening tot
      samenwerking wordt voor de regio die het aangaat getroffen door de korpsbeheerder na instemming van het regionale
      college en voor het Rijk door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Aan een voorziening tot samenwerking kunnen tevens deelnemen het Rijk, vertegenwoordigd door Onze Minister die
      het aangaat ten behoeve van de onder hem ressorterende diensten, of andere rechtspersonen voor zover die diensten
      of rechtspersonen een publiekrechtelijke taak uitoefenen op het terrein van politie, justitie of veiligheid en hun
      deelname van belang is voor de samenwerking tussen de politie en die diensten of rechtspersonen.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regio's tot deelname aan een voorziening tot
      samenwerking verplichten indien een zwaarwegend belang van het beheer van de politie dit vereist.

      4 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties worden regels gegeven over:

      a. de totstandkoming, inrichting en bekendmaking van en de informatieverstrekking over een voorziening tot
      samenwerking en

      b. de toepassing van het derde lid.

      5 Onder het treffen van een voorziening tot samenwerking wordt tevens verstaan het wijzigen of opheffen van dan wel
      het toetreden tot of uittreden uit die voorziening.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel47
  - number: 47a
    text: |-
      1 Bij een voorziening tot samenwerking als bedoeld in [artikel 47][ref1] kan, onverminderd de zeggenschap van het
      bevoegd gezag, een publiekrechtelijke rechtspersoon worden ingesteld indien dit vanwege de aard van de samenwerking
      aangewezen moet worden geacht.

      2 Een voorziening tot samenwerking waarbij een publiekrechtelijke rechtspersoon wordt ingesteld, alsmede de
      wijziging of opheffing van dan wel de toetreding tot of uittreding uit die voorziening, behoeft de goedkeuring van
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Goedkeuring kan worden onthouden wegens strijd met het
      recht of het belang van het beheer van of de taakuitvoering door de politie.

      3 Bij of krachtens algemene maatregel van bestuur worden met betrekking tot de in het eerste lid bedoelde
      rechtspersonen regels gegeven over:

      a. de taken, bevoegdheden, inrichting, informatiebeveiliging, financiële middelen en de bewaring en het beheer van
      archiefbescheiden van de rechtspersoon;

      b. de taken, bevoegdheden, werkwijze, benoeming en samenstelling van en de verantwoording en informatieverstrekking
      door de organen van de rechtspersoon, en

      c. het verlenen van medewerking door de deelnemers aan de voorziening tot samenwerking aan de uitvoering van
      besluiten van het bestuur van de rechtspersoon en het ten laste van die deelnemers uitvoeren of doen uitvoeren
      van besluiten.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan aan het bestuur van een krachtens het eerste
      lid ingestelde rechtspersoon aanwijzingen geven, indien het belang van het beheer van de politie dan wel de
      samenwerking van de politie met andere organisaties met een publiekrechtelijke taak op het terrein van politie,
      justitie of veiligheid dit vereist. De aanwijzingen worden schriftelijk gegeven en na overleg met het bestuur.

      5 Bij koninklijk besluit, op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, kan worden
      bepaald dat bij dat besluit aan te wijzen ambtenaren van politie, die op de dag voorafgaand aan de datum waarop
      krachtens het eerste lid een rechtspersoon is ingesteld in dienst zijn van een regio of het Rijk, op de datum van
      instelling van rechtswege overgaan naar die rechtspersoon.

      6 De regels gesteld bij of krachtens de [artikelen 45, vierde lid][ref2], [50][ref3] en [53c][ref4] zijn van
      overeenkomstige toepassing op een krachtens het eerste lid ingestelde rechtspersoon, onderscheidenlijk het
      personeel dan wel het bestuur daarvan. Bij algemene maatregel van bestuur kunnen over deze toepassing nadere regels
      worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0006299#Artikel53c
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel47a
