  - number: 53c
    text: |-
      De beheerders van de politiekorpsen verstrekken aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      alle informatie over de wijze waarop zij zorg dragen voor de kwaliteit van hun taakuitvoering, de resultaten en
      het beheer van de politiekorpsen. Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, voorzover het de strafrechtelijke handhaving van de rechtsorde dan
      wel de vervulling van taken ten dienste van de justitie betreft in overeenstemming met Onze Minister van Justitie
      kunnen regels worden gegeven over het in de vorige volzin bepaalde, alsmede over de wijze waarop de beheerders
      van politiekorpsen zorg dragen voor de kwaliteit van hun taakuitvoering, de resultaten en het beheer van de
      politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel53c
  - number: '54'
    text: |-
      1 Behoeft een regionaal politiekorps bijstand van andere politiekorpsen voor de handhaving van de openbare orde,
      dan richt de korpsbeheerder op aanvrage van de burgemeester een verzoek daartoe aan de commissaris van de Koning.

      2 De commissaris van de Koning pleegt alvorens te beslissen overleg met de korpsbeheerders die de bijstand moeten
      verlenen en met het College van procureurs-generaal. De korpsbeheerders verlenen de gevraagde bijstand.

      3 Is het voor de commissaris van de Koning niet mogelijk met de in zijn ambtsgebied beschikbare politie aan
      een aanvrage van een korpsbeheerder om bijstand te voldoen, dan geeft hij daarvan kennis aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. Deze verstrekt alsdan, door tussenkomst van de betrokken commissarissen
      van de Koning, de nodige opdrachten aan de betrokken korpsbeheerders van regionale politiekorpsen en stelt Onze
      Minister van Justitie daarvan in kennis. Indien bijstand van het Korps landelijke politiediensten nodig is, treft
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nodige voorzieningen en stelt Onze Minister van
      Justitie en de commissaris van de Koning daarvan in kennis.

      4 Van beslissingen als bedoeld in het tweede lid worden Onze Ministers van Binnenlandse Zaken en
      Koninkrijksrelaties en van Justitie zo spoedig mogelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel54
  - number: '55'
    text: |-
      Indien de commissaris van de Koning onderscheidenlijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      zijn bevoegdheid, bedoeld in [artikel 16, eerste onderscheidenlijk tweede lid][ref1], uitoefent, kan hij in
      afwijking van [artikel 54][ref2] voorzien in de bijstand aan regionale politiekorpsen of onderdelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel54
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '54'
        hoofdstuk: IX
  - number: '56'
    text: |-
      1 Behoeft een regionaal politiekorps bijstand van andere politiekorpsen voor de strafrechtelijke handhaving van
      de rechtsorde, dan wel voor het verrichten van taken ten dienste van de justitie, dan richt de korpsbeheerder op
      aanvrage van de officier van justitie een verzoek daartoe aan het College van procureurs-generaal.

      2 Het College van procureurs-generaal pleegt alvorens te beslissen overleg met de korpsbeheerders die de
      bijstand moeten verlenen en met de betrokken commissaris van de Koning. De korpsbeheerders verlenen de gevraagde
      bijstand. Indien bijstand van het Korps landelijke politiediensten nodig is, brengt het College van procureurs-
      generaal de aanvrage van de korpsbeheerder om bijstand ter kennis van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, die de nodige voorzieningen treft en het College van procureurs-generaal daarvan in kennis
      stelt.

      3 Van beslissingen als bedoeld in het tweede lid worden Onze Ministers van Justitie en van Binnenlandse Zaken en
      Koninkrijksrelaties zo spoedig mogelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel56
  - number: '57'
    text: |-
      1 Behoeft het Korps landelijke politiediensten bijstand van regionale politiekorpsen voor de handhaving van
      de openbare orde, dan verstrekt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties op aanvrage van de
      burgemeester door tussenkomst van de betrokken commissarissen van de Koning, aan de betrokken korpsbeheerders de
      nodige opdrachten.

      2 Behoeft het Korps landelijke politiediensten bijstand van regionale politiekorpsen voor de strafrechtelijke
      handhaving van de rechtsorde, dan wel voor het verrichten van taken ten dienste van de justitie, dan richt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties op aanvrage van de officier van justitie een verzoek daartoe
      aan het College van procureurs-generaal dat alsdan aan de betrokken korpsbeheerders de nodige opdrachten verstrekt
      en Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties daarvan in kennis stelt.

      3 Behoeft het Korps landelijke politiediensten bijstand van regionale politiekorpsen bij de uitoefening van
      de taak, bedoeld in [artikel 38, eerste lid, onder c][ref1], dan verstrekt Onze Minister van Justitie, in
      overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, gehoord het College van
      procureurs-generaal, aan de betrokken korpsbeheerders de nodige opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
        hoofdstuk: VI
  - number: '58'
    text: |-
      1 In bijzondere gevallen kan bijstand worden verleend door de Koninklijke marechaussee.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft bijstand ter handhaving van de
      openbare orde, onderscheidenlijk Onze Minister van Justitie, indien het betreft bijstand voor de strafrechtelijke
      handhaving van de rechtsorde dan wel voor het verrichten van taken ten dienste van de justitie, bepaalt, na overleg
      met Onze Minister van Defensie, of bijstand wordt verleend.

      3 Indien bijstand moet worden verleend, bepaalt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      onderscheidenlijk Onze Minister van Justitie in overeenstemming met Onze Minister van Defensie op welke wijze de
      bijstand wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel58
  - number: '59'
    text: |-
      1 Kan ook op grond van [artikel 58][ref1] niet in de behoefte aan bijstand ter handhaving van de openbare orde of
      bijstand voor de strafrechtelijke handhaving van de rechtsorde, dan wel voor het verrichten van taken ten dienste
      van de justitie, worden voorzien, dan kan bijstand worden verleend door andere onderdelen van de krijgsmacht.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, onderscheidenlijk Onze Minister van Justitie,
      bepaalt, in overeenstemming met Onze Minister van Defensie, op welke wijze de bijstand zal worden verleend. Daarbij
      worden tevens nadere regels of beleidsregels gegeven over de uitoefening van bevoegdheden krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel58
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '58'
        hoofdstuk: IX
  - number: '60'
    text: |-
      1 Er zijn bijstandseenheden, bestaande uit personeel van de politie, onderscheidenlijk de Koninklijke marechaussee
      en andere onderdelen van de krijgsmacht. Deze eenheden worden belast met door Onze Ministers van Binnenlandse Zaken
      en Koninkrijksrelaties, van Justitie en van Defensie aan te wijzen bijzondere onderdelen van de politietaak.

      2 Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties, van Justitie en van Defensie bepalen op welke
      wijze de bijstandseenheden worden ingezet. Daarbij worden tevens nadere regels of beleidsregels gegeven over de
      uitoefening van bevoegdheden krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel60
  - number: 60a
    text: |-
      In bijzondere gevallen kan door politiekorpsen bijstand worden verleend aan de Koninklijke marechaussee, met
      inachtneming van de [artikelen 60b tot en met 60d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel60b
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel60a
    references:
