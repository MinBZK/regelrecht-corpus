preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de bestaande Politiewet te vervangen door een
    nieuwe wettelijke regeling voor de taak, de organisatie en het beheer van de politie en het gezag waaraan zij
    ondergeschikt is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. regio: politieregio;

      b. regionale college: het college bedoeld in [artikel 22][ref1];

      c. korpsbeheerder: de burgemeester, bedoeld in [artikel 23, eerste lid][ref2], of de waarnemend korpsbeheerder,
      bedoeld in [artikel 23, zesde lid][ref3];

      d. korpschef: de korpschef, bedoeld in [artikel 24][ref4], onderscheidenlijk 38;

      e. commissaris van de Koning: de commissaris van de Koning in de provincie waarin de regio geheel of nagenoeg
      geheel is gelegen;

      f. hoofd van het landelijk parket: de hoofdofficier van justitie, bedoeld in
      [artikel 137, tweede lid, van de Wet op de rechterlijke organisatie][ref5];

      g. taken ten dienste van de justitie:

      1°. de uitvoering van wettelijke voorschriften waarmee Onze Minister van Justitie is belast;

      2°. de administratiefrechtelijke afdoening van inbreuken op wettelijke voorschriften, voor zover in die
      voorschriften het toezicht op de uitvoering van de politietaak is opgedragen aan het openbaar ministerie;

      3°. de betekening van gerechtelijke mededelingen in strafzaken, het vervoer van rechtens van hun vrijheid beroofde
      personen, en de dienst bij de gerechten.

      2 In deze wet en de daarop berustende bepalingen wordt onder strafrechtelijke handhaving van de rechtsorde mede
      verstaan: het waken voor de veiligheid van personen.

      3 Als hoofdofficier van justitie in de zin van deze wet treedt op de hoofdofficier van justitie dan wel de
      fungerend hoofdofficier van justitie. Indien in een arrondissement twee regio’s zijn gelegen, bepaalt Onze Minister
      van Justitie voor welke regio de hoofdofficier van justitie en voor welke regio de fungerend hoofdofficier van
      justitie optreedt. In geval van afwezigheid, belet of ontstentenis van de fungerend hoofdofficier van justitie
      wordt hij vervangen door de hoofdofficier van justitie.


