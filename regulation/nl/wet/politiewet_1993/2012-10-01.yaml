  - number: 8a
    text: |-
      1 Een ambtenaar van politie aangesteld voor de uitvoering van de politietaak, is bevoegd tot het vorderen van
      inzage van een identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] van
      personen, voor zover dat redelijkerwijs noodzakelijk is voor de uitoefening van de politietaak.

      2 Gelijke bevoegdheid komt toe aan de buitengewoon opsporingsambtenaar als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref2], voor zover dat redelijkerwijs noodzakelijk is
      voor de uitoefening van zijn taak.

      3 Gelijke bevoegdheid komt toe aan de militair van de Koninklijke marechaussee, voor zover dat redelijkerwijs
      noodzakelijk is voor de uitoefening van zijn politietaak, bedoeld in [artikel 6, eerste lid][ref3], en aan
      de militair van de Koninklijke marechaussee of van enig ander onderdeel van de krijgsmacht die op grond van
      [artikel 58, eerste lid][ref4], onderscheidenlijk [artikel 59, eerste lid][ref5], bijstand verleent aan de politie.


