        artikel: '38'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '38'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '38'
        hoofdstuk: VI
  - number: 38b
    text: |-
      1 Het Korps landelijke politiediensten registreert gegevens voor door Onze Ministers van Justitie en van
      Binnenlandse Zaken en Koninkrijksrelaties te bepalen doeleinden en door hen te bepalen categorieën dan wel in door
      hen aan te wijzen wettelijk geregelde registers en verstrekt deze gegevens aan door hen aan te wijzen personen en
      instanties, onverminderd het bepaalde bij of krachtens de [Wet politiegegevens][ref1].

      2 Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen bepalen dat in door hen aan
      te wijzen registers geen andere dan de in het eerste lid bedoelde gegevens worden geregistreerd en dat door hen aan
      te wijzen categorieën van gegevens in geen andere dan door hen aan te wijzen registers worden geregistreerd.

      3 Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels geven over de wijze
      waarop de gegevens, bedoeld in het eerste lid, worden geregistreerd, verwijderd dan wel verstrekt en op welke wijze
      bestandsvergelijking met die gegevens plaatsvindt.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ter uitvoering van het derde lid nadere regels
      geven over de schrijfwijze, classificatie of codering van gegevens en de samenstelling van de gegevens in de vorm
      van berichten.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 38c
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt ten minste eenmaal in de vier jaar in
      overeenstemming met het hoofd van het landelijk parket het ontwerp van het beleidsplan voor het Korps landelijke
      politiediensten op. In het beleidsplan wordt in ieder geval aangegeven met welke personele en financiële middelen
      wordt beoogd het plan en zijn onderdelen te verwezenlijken.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt jaarlijks in overeenstemming met het hoofd van
      het landelijk parket het ontwerp van het jaarverslag voor het Korps landelijke politiediensten op.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel38c
  - number: 38d
    text: |-
      Indien het hoofd van het landelijk parket en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      niet met elkaar tot overeenstemming kunnen komen over de in [artikel 38c][ref1] bedoelde stukken legt de
      eerstgenoemde dit verschil van zienswijze door tussenkomst van het College van procureurs-generaal schriftelijk
      voor aan Onze Minister van Justitie die alsdan, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38c
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 38c
        hoofdstuk: VI
  - number: '39'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt in overeenstemming met Onze Minister van
      Justitie ten minste eenmaal in de vier jaar het beleidsplan en jaarlijks de organisatie, de formatie, de begroting,
      de jaarrekening en het jaarverslag voor het Korps landelijke politiediensten vast.

      2 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      in overeenstemming met Onze Minister van Financiën kunnen op het Korps landelijke politiediensten van toepassing
      zijnde comptabele regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel39
  - number: 41a
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het hoofd van het landelijk parket overleggen
      regelmatig tezamen met de korpschef over de uitvoering van het beleidsplan.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het hoofd van het landelijk parket, alsmede de
      korpschef, verschaffen elkaar de gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel41a
  - number: '42'
    text: |-
      1 De korpschef wordt benoemd, geschorst, en ontslagen bij koninklijk besluit op voordracht van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie, het hoofd van het
      landelijk parket gehoord.

      2 Het eerste lid is van overeenkomstige toepassing op bij algemene maatregel van bestuur op voordracht van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen ambtenaren van politie die deel uitmaken van
      de leiding van het Korps landelijke politiediensten.

      3 De overige ambtenaren van het Korps landelijke politiediensten worden, onverminderd [artikel 52][ref1],
      benoemd, bevorderd, geschorst en ontslagen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      met dien verstande dat plaatsing van ambtenaren van politie die uitsluitend of in hoofdzaak belast zijn met
      de strafrechtelijke handhaving van de rechtsorde dan wel het verrichten van taken ten dienste van de justitie,
      niet geschiedt dan na overleg met het hoofd van het landelijk parket. Indien de taakvervulling van een zodanige
      ambtenaar van politie dit naar het oordeel van het hoofd van het landelijk parket noodzakelijk maakt, draagt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties voor vervanging zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel52
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '52'
        hoofdstuk: VIII
  - number: 42a
    text: |-
      1 Onze Minister van Justitie kan, indien hij dit nodig acht in verband met de uitvoering van de taken bedoeld in
      [artikel 38, eerste lid, onder a tot en met c][ref1], daarvoor in aanmerking komende bestuursorganen schriftelijk
      opdragen de noodzakelijke medewerking te verlenen om door hem aangewezen personen tijdelijk van een aan te nemen
      identiteit te voorzien.

      2 De voor de bestuursorganen geldende wettelijke voorschriften ter zake van de verlangde werkzaamheden blijven,
      voorzover deze in de weg staan aan het verrichten van die werkzaamheden, buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
        hoofdstuk: VI
  - number: '43'
    text: |-
      1 Het College van procureurs-generaal beschikt ten behoeve van door Onze Minister van Justitie, na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, aan te wijzen taken over bijzondere ambtenaren van politie
      en ambtenaren van politie, bedoeld in [artikel 3, eerste lid, onder b][ref1].

      2 Onze Minister van Justitie is belast met het beheer van de ambtenaren van politie, bedoeld in het eerste lid.
      Deze ambtenaren van politie worden, onverminderd [artikel 52][ref2], benoemd, bevorderd, geschorst en ontslagen
      door Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel52
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '52'
        hoofdstuk: VIII
  - number: 43a
    text: |-
      1 Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie stellen ten minste eenmaal in de
      vier jaar de hoofdlijnen vast met betrekking tot het te voeren beleid ten aanzien van de taakuitvoering van de
      politie en het te voeren beheer van de politie voor de eerstkomende vier jaar.

      2 Zodra de hoofdlijnen, bedoeld in het eerste lid, zijn vastgesteld, doen Onze Ministers van Binnenlandse Zaken
      en Koninkrijksrelaties en van Justitie hiervan mededeling door overlegging ervan aan de Staten-Generaal en
      door toezending ervan aan de regionale colleges, de korpsbeheerders, het College van procureurs-generaal, de
      hoofdofficieren van justitie en de korpschefs.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43a
  - number: 43b
    text: |-
      1 Op basis en binnen het kader van de hoofdlijnen, bedoeld in [artikel 43a, eerste lid][ref1], stellen Onze
      Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie, met inachtneming van de omstandigheden
      van de betrokken regio, ten minste eenmaal in de vier jaar voor iedere regio landelijke doelstellingen vast ter
      verwezenlijking van voornoemde hoofdlijnen.

      2 Alvorens de doelstellingen worden vastgesteld, stellen Onze Ministers van Justitie en van Binnenlandse Zaken en
      Koninkrijksrelaties daarvan een ontwerp op. Voor zover het de strafrechtelijke handhaving van de rechtsorde betreft
      dan wel de vervulling van taken ten dienste van de justitie, wint Onze Minister van Justitie vooraf het advies
      in van het College van procureurs-generaal. De betrokken korpsbeheerder wordt in de gelegenheid gesteld omtrent
      dit ontwerp aan Onze Ministers advies uit te brengen, in overeenstemming met de hoofdofficier van justitie en na
      overleg met het regionale college.

      3 In het beleidsplan, bedoeld in [artikel 31][ref2], wordt aangegeven op welke wijze wordt beoogd de doelstellingen
      te verwezenlijken.

      4 De resultaten die in het voorafgaande jaar zijn behaald met de verwezenlijking van de doelstellingen, maken deel
      uit van het jaarverslag, bedoeld in [artikel 31][ref3].

      5 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt in overeenstemming met Onze Minister van
      Justitie bij ministeriële regeling regels over de uitvoering van het tweede, derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel31
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43a
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
  - number: 43c
    text: |-
      Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie voeren periodiek overleg met
      de korpsbeheerders en de hoofdofficieren van justitie over de verwezenlijking van de hoofdlijnen, bedoeld in
      [artikel 43a, eerste lid][ref1], en de doelstellingen, bedoeld in [artikel 43b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43a
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
  - number: 43d
    text: |-
      Onverminderd de zeggenschap van het bevoegd gezag legt de korpsbeheerder over de verwezenlijking van de
      doelstellingen, bedoeld in [artikel 43b][ref1], door het regionale politiekorps verantwoording af aan Onze
      Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43d
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
  - number: 43e
    text: |-
      1 Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie doen periodiek onderzoek naar de
      verwezenlijking van de doelstellingen, bedoeld in [artikel 43b][ref1].

      2 De korpsbeheerder verstrekt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties alle informatie
      over de wijze waarop uitvoering wordt gegeven aan de verwezenlijking van de doelstellingen, bedoeld in
      [artikel 43b][ref2]. Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie kunnen hierover nadere
      regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43e
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
  - number: 43f
    text: |-
      Indien aannemelijk is dat de doelstellingen, bedoeld in [artikel 43b][ref1], niet of in onvoldoende mate zijn
      of worden verwezenlijkt, kunnen Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie na
      overleg met de korpsbeheerder een bijzonder onderzoek doen instellen bij een regionaal politiekorps door een door
      Onze Ministers aan te wijzen deskundige. De deskundige rapporteert aan Onze Ministers van Binnenlandse Zaken en
      Koninkrijksrelaties en van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
  - number: 43g
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ten aanzien van de uitvoering van de
      doelstellingen, bedoeld in [artikel 43b][ref1], de nodige aanwijzingen geven aan de korpsbeheerder, indien naar
      het oordeel van Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie de doelstellingen
      niet of in onvoldoende mate zijn of worden verwezenlijkt. Indien de doelstellingen betrekking hebben op de
      strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie, worden
      de aanwijzingen gegeven in overeenstemming met Onze Minister van Justitie. De aanwijzingen worden schriftelijk
      gegeven en na overleg met de korpsbeheerder. De korpsbeheerder brengt, voorzover nodig, de stukken, bedoeld in
      [artikel 31, eerste lid][ref2], in overeenstemming met de aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43b
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel31
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel43g
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43b
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
  - number: '44'
    text: |-
      1 Met het oog op de kosten van de politie worden jaarlijks door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties aan de regio’s bijdragen beschikbaar gesteld.

      2 Indien blijkt dat voor een regio de middelen aanmerkelijk tekort zullen schieten om in de noodzakelijke behoeften
      te voorzien, kan door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan de regio een aanvullende
      bijdrage beschikbaar worden gesteld.

      3 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties in overeenstemming met Onze Minister van Financiën worden regels gegeven over de wijze waarop
      het eerste en tweede lid worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel44
  - number: '45'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties worden regels gegeven over het beheer van de regionale politiekorpsen.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt de maximale formatie van de leiding van de
      regionale politiekorpsen vast.

      3 De betrokken korpsbeheerders verstrekken aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties alle
      informatie over het beheer van de regionale politiekorpsen, die hij nodig heeft. Bij of krachtens de algemene
      maatregel van bestuur, bedoeld in het eerste lid, worden ter zake nadere regels gegeven.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt toezicht op het financiële beheer van de
      regionale politiekorpsen. De [artikelen 203][ref1], [205 tot en met 211 van de Gemeentewet][ref2] zijn daarbij van
      overeenkomstige toepassing. Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties worden over deze toepassing nadere, zo nodig afwijkende regels gegeven.

      5 In aanvulling op [artikel 203 van de Gemeentewet][ref3], kan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, in overeenstemming met Onze Minister van Justitie, bepalen dat de begroting of het beleidsplan
      voor het regionale politiekorps alsmede de daarop betrekking hebbende wijzigingen goedkeuring behoeven, indien niet
      aannemelijk is dat voldoende waarborgen bestaan dat de doelstellingen, bedoeld in [artikel 43b][ref4], door het
      regionale politiekorps zullen worden verwezenlijkt.

      6 In aanvulling op [artikel 206 van de Gemeentewet][ref5] kan goedkeuring aan de begroting of het beleidsplan door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister van Justitie,
      worden onthouden, indien onvoldoende waarborgen bestaan dat de doelstellingen, bedoeld in [artikel 43b][ref6], door
      het regionale politiekorps zullen worden verwezenlijkt.

      7 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gegeven betreffende
      het vermogen van de regio’s. Indien een regio niet voldoet aan deze regels kan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties besluiten tot vermindering van de bijdragen die aan de desbetreffende regio op grond van
      [artikel 44, eerste lid][ref7], beschikbaar worden gesteld.

      8 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gegeven over de zorg voor en
      de bewaring van de archiefbescheiden van de regio. [Artikel 32, tweede lid, van de Archiefwet 1995][ref8] en de
      [artikelen 124][ref9], [124a][ref10] en [124c tot en met 124i van de Gemeentewet][ref11] zijn van overeenkomstige
      toepassing, met dien verstande dat de archiefbewaarplaats van de gemeente waar de regio haar zetel heeft, mede is
      bestemd voor de bewaring van de archiefbescheiden van de regio.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
