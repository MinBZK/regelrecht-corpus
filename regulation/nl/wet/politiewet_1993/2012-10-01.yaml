  - number: '10'
    text: |-
      Alle ambtenaren, belast met een politietaak, verlenen elkaar wederkerig de nodige hulp en betrachten bij
      voortduring een eendrachtige samenwerking bij het uitvoeren van die taak. Zij verlenen elkaar zoveel mogelijk de
      gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel10
  - number: '11'
    text: |-
      1 Zij die op grond van [artikel 141, onder d][ref1] en [artikel 142 van het Wetboek van Strafvordering][ref2] tot
      opsporing van strafbare feiten bevoegd zijn, werken samen met de politie.

      2 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Justitie, in overeenstemming
      met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, kunnen regels worden gegeven
      over de samenwerking van de politie met de buitengewone opsporingsambtenaren, bedoeld in
      [artikel 142 van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel142
