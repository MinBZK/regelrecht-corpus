  - number: '33'
    text: |-
      1 Het regionale college stelt regels vast over zijn werkwijze.

      2 De in het eerste lid bedoelde regels bepalen in elk geval de minimum-termijn waarop de vergaderingen van
      het regionale college worden uitgeschreven en het vereiste aantal leden dat aanwezig moet zijn om rechtsgeldig
      besluiten te nemen, alsmede de gevallen waarin de besluitvorming schriftelijk dan wel mondeling geschiedt.

      3 Bij het staken van de stemmen in het college geeft die van de korpsbeheerder de doorslag.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel33
  - number: '34'
    text: |-
      1 De vergaderingen van het regionale college zijn openbaar. De voorzitter is bevoegd de deuren te sluiten, indien
      dit uit een oogpunt van de bescherming van de persoonlijke levenssfeer of op gronden, ontleend aan het algemeen
      belang, wenselijk wordt geacht.

      2 De besluiten van het college en de verslagen van de vergaderingen van het regionale college worden ter kennis
      gebracht van de gemeenteraden in de regio.

      3 Indien een gemeenteraad van oordeel is, dat een besluit van het regionale college op onaanvaardbare wijze
      afbreuk doet aan het belang van een goede vervulling van de politietaak in zijn gemeente, kan de gemeenteraad
      tegen dat besluit administratief beroep instellen bij de commissaris van de Koning. Het beroepschrift wordt
      ingediend door tussenkomst van de korpsbeheerder. [Artikel 32, eerste lid, tweede en derde volzin][ref1],
      alsmede het tweede en derde lid van [dat artikel][ref2] zijn alsdan van toepassing. Het in het
      [eerste en tweede lid van artikel 32][ref3] bedoelde besluit bepaalt het tijdstip waarop het besluit van het
      regionale college uiterlijk moet zijn aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel32
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '32'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '32'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '32'
        hoofdstuk: V
  - number: '35'
    text: |-
      1 Het regionale politiekorps bestaat uit functionele en territoriale onderdelen. De territoriale onderdelen kunnen
      een of meer gemeenten in de regio omvatten; zij kunnen ook delen van gemeenten omvatten.

      2 De grenzen van de territoriale onderdelen worden bepaald door het regionale college op voorstel van de
      korpsbeheerder, in overeenstemming met de hoofdofficier van justitie, de betrokken burgemeesters gehoord.
      Indien het territoriale onderdeel twee of meer gemeenten omvat, dan wel afwijkt van de gemeentegrenzen in de
      regio, dienen de betrokken burgemeesters hiermede in te stemmen. Voor zover de betrokken burgemeesters niet
      instemmen met het besluit van het regionale college, kunnen zij daartegen administratief beroep instellen
      bij de commissaris van de Koning. Het beroepschrift wordt ingediend door tussenkomst van de korpsbeheerder.
      [Artikel 32, eerste lid, tweede en derde volzin][ref1], alsmede het tweede en derde lid van dat artikel zijn alsdan
      van toepassing.

      3 Het hoofd van een territoriaal onderdeel wordt aangewezen door de korpsbeheerder in overeenstemming met de
      hoofdofficier van justitie en na verkregen instemming van de burgemeester of - bij een onderdeel dat meer gemeenten
      of delen van gemeenten omvat - de burgemeesters van de betrokken gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel32
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '32'
        hoofdstuk: V
  - number: '37'
    text: |-
      1 Plaatsing van ambtenaren van politie bij een territoriaal onderdeel geschiedt niet dan na overleg met de
      burgemeester. Indien de taakvervulling van een ambtenaar van politie dit naar het oordeel van de burgemeester of -
      bij een onderdeel dat meer gemeenten of delen van gemeenten omvat - van de burgemeesters van de betrokken gemeenten
      noodzakelijk maakt, draagt de korpsbeheerder voor vervanging zorg.

      2 Plaatsing bij een functioneel of territoriaal onderdeel van ambtenaren van politie die uitsluitend of in
      hoofdzaak belast zijn met de strafrechtelijke handhaving van de rechtsorde dan wel het verrichten van taken ten
      dienste van de justitie, geschiedt niet dan na overleg met de hoofdofficier van justitie. Indien de taakvervulling
      van een zodanige ambtenaar van politie dit naar het oordeel van de hoofdofficier van justitie noodzakelijk maakt,
      draagt de korpsbeheerder voor vervanging zorg.
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel37
  - number: '38'
    text: |-
      1 Er is een Korps landelijke politiediensten. Onverminderd de taakuitvoering van regionale politiekorpsen, is het
      Korps landelijke politiediensten belast met:

      a. de landelijke en specialistische uitvoering van politietaken, in samenwerking met de regionale politiekorpsen,
      de Koninklijke marechaussee en de in [artikel 11, eerste lid][ref1], bedoelde personen;

      b. het verzamelen, registreren, bewerken, beheren, analyseren en verstrekken van informatie en het verrichten van
      andere ondersteunende werkzaamheden ten behoeve van de taakuitvoering van de onder a genoemde organen en personen,
      en de andere bij de strafrechtelijke handhaving van de rechtsorde betrokken organen, alsmede de internationale
      uitwisseling van informatie en de landelijke voorlichting aan particulieren;

      c. het waken voor de veiligheid van leden van het Koninklijk Huis en andere door Onze Minister van Justitie
      aangewezen personen.

      2 Bij algemene maatregel van bestuur op voordracht van Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties
      en van Justitie kan een nadere aanduiding van de werkzaamheden, bedoeld in het eerste lid, worden gegeven. Een
      dergelijke algemene maatregel van bestuur treedt niet eerder in werking dan drie maanden na de datum van uitgifte
      van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt door Onze Ministers onverwijld mededeling
      gedaan aan de beide Kamers der Staten-Generaal onder overlegging van de over het ontwerp van de algemene maatregel
      van bestuur uitgebrachte adviezen.

      3 Het beheer van het Korps landelijke politiediensten berust bij Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, die daartoe wordt bijgestaan door de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel11
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '11'
        hoofdstuk: III
  - number: 38a
    text: |-
      1 Onze Minister van Justitie kan de korpschef van het Korps landelijke politiediensten voorzover het de uitoefening
      van de taak, bedoeld in [artikel 38, eerste lid, onder a en b][ref1], door het daartoe bestemde onderdeel of
      daartoe bestemde onderdelen betreft, de nodige algemene en bijzondere aanwijzingen geven, voorzover de politie
      optreedt bij of krachtens de wet of op grond van een verdrag of een besluit van een volkenrechtelijke organisatie
      onder verantwoordelijkheid van Onze Minister van Justitie.

      2 De bevoegdheid, bedoeld in het eerste lid, komt eveneens toe aan Onze Minister van Justitie, met betrekking tot
      de taak, bedoeld in [artikel 38, eerste lid, onder c][ref2], en andere taken die als zodanig zijn aangewezen door
      Onze Minister van Justitie in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      3 Indien een regionaal politiekorps of de Koninklijke marechaussee bijstand verleent aan het Korps landelijke
      politiediensten ten behoeve van de uitvoering van de taak, bedoeld in [artikel 38, eerste lid, onder c][ref3],
      kan Onze Minister van Justitie, voorzover het de uitvoering van die bijstandstaak betreft, aan de korpschef van
      het regionale politiekorps, onderscheidenlijk de commandant van de Koninklijke marechaussee, de nodige algemene en
      bijzondere aanwijzingen geven.

      4 De korpschef verstrekt gevraagd en ongevraagd aan Onze Minister van Justitie de inlichtingen die deze nodig heeft
      met het oog op de strafrechtelijke handhaving van de rechtsorde en de uitvoering van de taken ten dienste van de
      justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0006299/2012-10-01#Artikel38a
    references:
      - id: ref1
