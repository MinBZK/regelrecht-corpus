$id: politiewet_1993
regulatory_layer: WET
publication_date: '2009-02-19'
valid_from: '2002-12-01'
bwb_id: BWBR0006299
url: https://wetten.overheid.nl/BWBR0006299/2002-12-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de bestaande Politiewet te vervangen door een
    nieuwe wettelijke regeling voor de taak, de organisatie en het beheer van de politie en het gezag waaraan zij
    ondergeschikt is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: 1.1.a
    text: 'regio: politieregio;'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: 1.1.b
    text: |-
      regionale college: het college bedoeld in [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel22
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '22'
        hoofdstuk: V
  - number: 1.1.c
    text: |-
      korpsbeheerder: de burgemeester, bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel23
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '23'
        hoofdstuk: V
  - number: 1.1.d
    text: |-
      korpschef: de korpschef, bedoeld in [artikel 24][ref1], onderscheidenlijk 38;


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel24
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '24'
        hoofdstuk: V
  - number: 1.1.e
    text: |-
      commissaris van de Koning: de commissaris van de Koning in de provincie waarin de regio geheel of nagenoeg geheel
      is gelegen;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: 1.1.f
    text: |-
      hoofd van het landelijk parket: de hoofdofficier van justitie, bedoeld in
      [artikel 137, tweede lid, van de Wet op de rechterlijke organisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel137
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '137'
  - number: 1.1.g
    text: 'taken ten dienste van de justitie:'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: 1.1.g.1°
    text: de uitvoering van wettelijke voorschriften waarmee Onze Minister van Justitie is belast;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: 1.1.g.2°
    text: |-
      de administratiefrechtelijke afdoening van inbreuken op wettelijke voorschriften, voor zover in die voorschriften
      het toezicht op de uitvoering van de politietaak is opgedragen aan het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: 1.1.g.3°
    text: |-
      de betekening van gerechtelijke mededelingen in strafzaken, het vervoer van rechtens van hun vrijheid beroofde
      personen, en de dienst bij de gerechten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: '1.2'
    text: |-
      Als hoofdofficier van justitie in de zin van deze wet treedt op de hoofdofficier van justitie dan wel de fungerend
      hoofdofficier van justitie. Indien in een arrondissement twee regio’s zijn gelegen, bepaalt Onze Minister van
      Justitie voor welke regio de hoofdofficier van justitie en voor welke regio de fungerend hoofdofficier van justitie
      optreedt. In geval van afwezigheid, belet of ontstentenis van de fungerend hoofdofficier van justitie wordt hij
      vervangen door de hoofdofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel1
  - number: '2'
    text: |-
      De politie heeft tot taak in ondergeschiktheid aan het bevoegde gezag en in overeenstemming met de geldende
      rechtsregels te zorgen voor de daadwerkelijke handhaving van de rechtsorde en het verlenen van hulp aan hen die
      deze behoeven.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel2
  - number: '3.1'
    text: 'Ambtenaren van politie in de zin van deze wet zijn:'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel3
  - number: 3.1.a
    text: ambtenaren, aangesteld voor de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel3
  - number: 3.1.b
    text: |-
      ambtenaren, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de
      politie;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel3
  - number: 3.1.c
    text: vrijwillige ambtenaren, aangesteld voor de uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel3
  - number: '3.2'
    text: |-
      Onder ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, worden mede begrepen: de bijzondere
      ambtenaren van politie, bedoeld in [artikel 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '43'
        hoofdstuk: VII
  - number: '4'
    text: |-
      De politie bestaat uit 25 regionale politiekorpsen, één Korps landelijke politiediensten en de bijzondere
      ambtenaren van politie, bedoeld in [artikel 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '43'
        hoofdstuk: VII
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken en
      Koninkrijksrelaties worden regels gegeven over de taken die kunnen worden uitgevoerd door vrijwillige ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel5
  - number: '5.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid treedt niet eerder in werking dan drie maanden
      na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt door Onze Ministers
      onverwijld mededeling gedaan aan de beide Kamers der Staten-Generaal onder overlegging van de over het ontwerp
      uitgebrachte adviezen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel5
  - number: '6.1'
    text: |-
      Aan de Koninklijke marechaussee zijn, onverminderd het bepaalde bij of krachtens andere wetten, de volgende
      politietaken opgedragen:
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: 6.1.a
    text: |-
      het waken voor de veiligheid van de leden van het Koninklijk Huis, in samenwerking met andere daartoe aangewezen
      organen;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: 6.1.b
    text: |-
      de uitvoering van de politietaak ten behoeve van Nederlandse en andere strijdkrachten, alsmede internationale
      militaire hoofdkwartieren, en ten aanzien van tot die strijdkrachten en hoofdkwartieren behorende personen;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: 6.1.c
    text: |-
      de uitvoering van de politietaak op de luchthaven Schiphol en op de andere door Onze Ministers van Justitie, van
      Binnenlandse Zaken en Koninkrijksrelaties en van Defensie aangewezen luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: 6.1.d
    text: |-
      de verlening van bijstand alsmede de samenwerking met de politie krachtens deze wet, daaronder begrepen de
      assistentieverlening aan de politie bij de bestrijding van grensoverschrijdende criminaliteit;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: 6.1.e
    text: |-
      de uitvoering van de politietaak op plaatsen onder beheer van Onze Minister van Defensie, op verboden plaatsen
      die krachtens de [Wet bescherming staatsgeheimen][ref1] (*Stb.* 1951, 92) ten behoeve van de landsverdediging zijn
      aangewezen, alsmede op het terrein van de ambtswoning van Onze Minister-President;


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: 6.1.f
    text: |-
      de uitvoering van de bij of krachtens de [Vreemdelingenwet 2000][ref1] opgedragen taken, waaronder begrepen de
      bediening van de daartoe door Onze Minister van Justitie aangewezen doorlaatposten en het, voor zover in dat
      verband noodzakelijk, uitvoeren van de politietaak op en nabij deze doorlaatposten, alsmede het verlenen van
      medewerking bij de aanhouding of voorgeleiding van een verdachte of veroordeelde;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 6.1.g
    text: |-
      het in opdracht van Onze Minister van Justitie en van Defensie ten behoeve van De Nederlandsche Bank N.V.
      verrichten van beveiligingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: '6.2'
    text: |-
      Onder personen die behoren tot de andere strijdkrachten en internationale hoofdkwartieren, bedoeld in het eerste
      lid, onder *b*, worden mede begrepen personen, voor zover aangewezen bij algemene maatregel van bestuur op
      voordracht van Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister van Justitie kan de commandant van de Koninklijke marechaussee, voor zover het de uitoefening van de
      taak, bedoeld in het eerste lid, onder *c*, door het daarvoor bestemde onderdeel of de daarvoor bestemde onderdelen
      betreft, de nodige algemene en bijzondere aanwijzingen geven ten behoeve van de strafrechtelijke handhaving van de
      rechtsorde en de beveiliging van de burgerluchtvaart tegen terroristische aanslagen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
  - number: '6.4'
    text: |-
      De militair van de Koninklijke marechaussee die krachtens [artikel 141 van het Wetboek van Strafvordering][ref1]
      opsporingsbevoegdheid heeft, is, indien hij bij de uitoefening van zijn politietaken stuit op strafbare feiten,
      bevoegd tot optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '7.1'
    text: De ambtenaar van politie is bevoegd zijn taak uit te oefenen in het gehele land.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel7
  - number: '7.2'
    text: |-
      Hoewel bevoegd in het gehele land, onthoudt de ambtenaar van politie zich van optreden buiten zijn gebied van
      aanstelling, tenzij ingevolge regels, gesteld bij of krachtens de wet, dan wel in opdracht of met toestemming van
      het bevoegde gezag over de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel7
  - number: '8.1'
    text: |-
      De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak is bevoegd in de rechtmatige
      uitoefening van zijn bediening geweld te gebruiken, wanneer het daarmee beoogde doel dit, mede gelet op de aan het
      gebruik van geweld verbonden gevaren, rechtvaardigt en dat doel niet op een andere wijze kan worden bereikt. Aan
      het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel8
  - number: '8.2'
    text: |-
      De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak heeft toegang tot elke plaats,
      voor zover dat voor het verlenen van hulp aan hen die deze behoeven, redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel8
  - number: '8.3'
    text: |-
      De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak is bevoegd tot het onderzoek aan
      de kleding van personen bij de uitoefening van een hem wettelijk toegekende bevoegdheid of bij een handeling ter
      uitvoering van de politietaak, indien uit feiten of omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor
      hun leven of veiligheid, die van de ambtenaar zelf of van derden en dit onderzoek noodzakelijk is ter afwending van
      dit gevaar.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel8
  - number: '8.4'
    text: |-
      De officier van justitie of de hulpofficier van justitie voor wie aangehouden of rechtens van hun vrijheid beroofde
      verdachten of veroordeelden worden geleid, is bevoegd te bepalen dat deze aan hun lichaam zullen worden onderzocht,
      indien uit feiten of omstandigheden blijkt dat gevaar dreigt voor hun leven of veiligheid of die van de ambtenaar
      zelf en dit onderzoek noodzakelijk is ter afwending van dit gevaar.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel8
  - number: '8.5'
    text: |-
      De uitoefening van de bevoegdheden, bedoeld in het eerste tot en met vierde lid, dient in verhouding tot het
      beoogde doel redelijk en gematigd te zijn.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel8
  - number: '8.6'
    text: |-
      Het eerste tot en met het vijfde lid zijn tevens van toepassing op de militair van de Koninklijke marechaussee,
      indien hij optreedt in de rechtmatige uitoefening van zijn bediening, en op de militair van enig ander onderdeel
      van de krijgsmacht die op grond van deze wet bijstand verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel8
  - number: '8.7'
    text: |-
      Onze Minister van Justitie kan bepalen, dat de in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1]
      bedoelde buitengewone opsporingsambtenaren, voor zover door hem hetzij in persoon hetzij per categorie of
      eenheid aangewezen, de bevoegdheden omschreven in het eerste en derde lid kunnen uitoefenen. Alsdan wordt met
      overeenkomstige toepassing van [artikel 9][ref2] een ambtsinstructie voor hen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel9
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '9'
        hoofdstuk: III
  - number: '9.1'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken
      en Koninkrijksrelaties wordt, in overeenstemming met Onze Minister van Defensie voor zover het de Koninklijke
      marechaussee betreft, een ambtsinstructie voor de politie en voor de Koninklijke marechaussee vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de militair van enig ander onderdeel van de krijgsmacht optreedt bij de uitvoering van zijn in de
      [artikelen 59][ref1] en [60][ref2] omschreven taken is de ambtsinstructie van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel60
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '59'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '60'
        hoofdstuk: IX
  - number: '9.3'
    text: |-
      In de ambtsinstructie worden regels gegeven ter uitvoering van de [artikelen 7][ref1] en [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel8
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '8'
        hoofdstuk: III
  - number: '9.4'
    text: |-
      Bij algemene maatregel van bestuur of krachtens algemene maatregel van bestuur bij ministeriële regeling worden
      regels gegeven omtrent maatregelen waaraan rechtens van hun vrijheid beroofde personen met het oog op hun
      insluiting kunnen worden onderworpen, voor zover dit noodzakelijk is in het belang van hun veiligheid of de
      veiligheid van anderen. De algemene maatregel van bestuur wordt vastgesteld op voordracht van Onze Ministers van
      Justitie, en van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister van Defensie voor
      zover het de Koninklijke marechaussee betreft.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel9
  - number: '9.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op personen, die ten behoeve van de hulpverlening aan hen zijn
      ondergebracht bij de politie of de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel9
  - number: '9.6'
    text: |-
      De ambtenaren die door Onze Minister van Justitie zijn aangewezen voor het vervoer van rechtens van hun vrijheid
      beroofde personen, kunnen de bevoegdheden, bedoeld in [artikel 8, eerste en derde lid][ref1], uitoefenen, dan wel
      de maatregelen, bedoeld in het vierde lid, treffen, voor zover dit noodzakelijk is met het oog op de voorkoming
      van het zich onttrekken van de te vervoeren persoon aan het op hem uitgeoefende toezicht. De eerste volzin is
      van toepassing voor zover de rechtens van hun vrijheid beroofde personen zijn ondergebracht bij de politie of de
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel8
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '8'
        hoofdstuk: III
  - number: '10'
    text: |-
      Alle ambtenaren, belast met een politietaak, verlenen elkaar wederkerig de nodige hulp en betrachten bij
      voortduring een eendrachtige samenwerking bij het uitvoeren van die taak. Zij verlenen elkaar zoveel mogelijk de
      gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel10
  - number: '11.1'
    text: |-
      Zij die op grond van [artikel 142 van het Wetboek van Strafvordering][ref1] tot opsporing van strafbare feiten
      bevoegd zijn, werken samen met de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '11.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Justitie in overeenstemming met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels worden gegeven over de in het eerste lid
      bedoelde samenwerking.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de politie in een gemeente optreedt ter handhaving van de openbare orde en ter uitvoering van de
      hulpverleningstaak, staat zij onder gezag van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel12
  - number: '12.2'
    text: |-
      De burgemeester kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling van de in
      het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel12
  - number: '13.1'
    text: |-
      Indien de politie optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten dienste
      van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel13
  - number: '13.2'
    text: |-
      De officier van justitie kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling
      van de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel13
  - number: '14'
    text: |-
      De burgemeester en de officier van justitie overleggen regelmatig tezamen met het hoofd van het territoriale
      onderdeel van het regionale politiekorps, binnen welks grondgebied de gemeente geheel of ten dele valt, en, zo
      nodig, met de korpschef, over de taakuitvoering van de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel14
  - number: '15.1'
    text: |-
      Voor zover de Koninklijke marechaussee optreedt ter handhaving van de openbare orde staat zij onder gezag van de
      burgemeester. Voor zover zij optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht
      ten dienste van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier van
      justitie. Het hoofd van het onderdeel van de Koninklijke marechaussee neemt alsdan aan het in [artikel 14][ref1]
      bedoelde overleg deel op de wijze als daar is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel14
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '14'
        hoofdstuk: IV
  - number: '15.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de militair van enig ander onderdeel van de krijgsmacht, indien
      hij bijstand verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel15
  - number: '16.1'
    text: |-
      De commissaris van de Koning geeft, indien een ordeverstoring van meer dan plaatselijke betekenis dan wel ernstige
      vrees voor het ontstaan van zodanige ordeverstoring zulks noodzakelijk maakt, de burgemeesters in de provincie
      zoveel mogelijk na overleg met hen, de nodige aanwijzingen met betrekking tot het door hen ter handhaving van de
      openbare orde te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties geeft de commissarissen van de Koning en de
      burgemeesters, zoveel mogelijk na overleg met hen, de nodige aanwijzingen met betrekking tot het door hen ter
      handhaving van de openbare orde te voeren beleid, indien door een ordeverstoring de veiligheid van de Staat
      in gevaar komt, of de betrekkingen van Nederland met andere mogendheden, dan wel zwaarwegende belangen van
      de samenleving, kunnen worden geschaad. Gelijke bevoegdheid heeft Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties indien ernstige vrees voor het ontstaan van een zodanige ordeverstoring bestaat.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel16
  - number: '16.3'
    text: De in het eerste en tweede lid bedoelde aanwijzingen worden zo enigszins mogelijk schriftelijk gegeven.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel16
  - number: '16.4'
    text: |-
      De in het tweede lid bedoelde aanwijzingen aan de burgemeesters worden zoveel mogelijk gegeven door tussenkomst van
      de commissaris van de Koning. Indien dit niet mogelijk is, wordt hij zo spoedig mogelijk daarvan in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel16
  - number: '17.1'
    text: |-
      Ten behoeve van de toepassing van [artikel 16][ref1] verstrekken de burgemeesters, de commissarissen van de Koning
      en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties elkaar de gewenste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel16
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '16'
        hoofdstuk: IV
  - number: '17.2'
    text: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels geven ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel17
  - number: '18.1'
    text: |-
      De commissaris van de Koning ziet toe dat de politie in zijn ambtsgebied haar taak de openbare orde te handhaven en
      hulp te verlenen naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel18
  - number: '18.2'
    text: |-
      Hij ziet eveneens toe op een juiste vervulling van de taak ter handhaving van de openbare orde die de Koninklijke
      marechaussee op grond van deze wet uitvoert.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel18
  - number: '19.1'
    text: |-
      Het College van procureurs-generaal ziet toe dat de politie haar taak met betrekking tot de strafrechtelijke
      handhaving van de rechtsorde en haar taken ten dienste van de justitie naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel19
  - number: '19.2'
    text: |-
      Het College van procureurs-generaal ziet eveneens toe op een juiste vervulling van de taken die de Koninklijke
      marechaussee ten behoeve van de strafrechtelijke handhaving van de rechtsorde, dan wel ten dienste van de justitie,
      op grond van deze wet uitvoert of verricht.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel19
  - number: '20.1'
    text: |-
      De commissaris van de Koning en het College van procureurs-generaal plegen regelmatig met elkaar overleg over de
      taakuitoefening van de politie en de Koninklijke marechaussee in het ambtsgebied van de betrokken commissaris van
      de Koning. Zij verstrekken elkaar de gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel20
  - number: '20.2'
    text: |-
      De burgemeester en de officier van justitie verstrekken aan de commissaris van de Koning en aan het College van
      procureurs-generaal, met betrekking tot de politie en de vervulling van haar taak, de gewenste inlichtingen en doen
      hun ook ongevraagd mededeling van hetgeen ter zake van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel20
  - number: '21.1'
    text: |-
      Het Nederlandse grondgebied is verdeeld in 25 regio’s overeenkomstig de bij deze wet behorende bijlage. Deze
      bijlage kan, voor zover het de grenzen van de regio’s en de naamgeving van de daarin voorkomende gemeenten betreft,
      bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      worden gewijzigd. Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties kunnen regels worden gegeven over de overgang van personeel, vermogensrechten, rechtsgedingen
      of andere rechten en verplichtingen, alsmede over de overgang van archieven indien een wijziging van de grenzen van
      de regio’s daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel21
  - number: '21.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid, tweede volzin, treedt niet eerder in werking dan
      drie maanden na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt door Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties onverwijld mededeling gedaan aan de beide Kamers der Staten-
      Generaal onder overlegging van de over het ontwerp van de algemene maatregel van bestuur uitgebrachte adviezen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel21
  - number: '21.3'
    text: In elke regio is een regionaal politiekorps.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel21
  - number: '21.4'
    text: De regio is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel21
  - number: '22.1'
    text: |-
      De regio wordt bestuurd door het regionale college overeenkomstig de [artikelen 30][ref1] en [31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel31
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '30'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
  - number: '22.2'
    text: |-
      Het regionale college bestaat uit de burgemeesters van de gemeenten in de regio en de hoofdofficier van justitie.
      Aan de vergaderingen van het regionale college wordt tevens deelgenomen door de korpschef.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel22
  - number: '22.3'
    text: Voorzitter van het regionale college is de korpsbeheerder. Hij vertegenwoordigt de regio in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel22
  - number: '22.4'
    text: |-
      Op de burgemeesters, bedoeld in het tweede lid, is [artikel 180 van de Gemeentewet][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel180
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '180'
  - number: '23.1'
    text: |-
      De korpsbeheerder is de burgemeester van de gemeente die in de in [artikel 21][ref1] bedoelde bijlage als zodanig
      voor elke regio is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel21
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '21'
        hoofdstuk: V
  - number: '23.2'
    text: |-
      Het regionale college wijst in overeenstemming met de korpsbeheerder een burgemeester van een gemeente in de regio
      aan die de korpsbeheerder bij afwezigheid, belet of ontstentenis vervangt.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel23
  - number: '24'
    text: |-
      Het beheer van het regionale politiekorps berust bij de korpsbeheerder, die daartoe wordt bijgestaan door de
      korpschef.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel24
  - number: '25.1'
    text: |-
      De korpschef en het lid van de leiding dat in het bijzonder verantwoordelijk is voor de recherchefunctie, worden
      benoemd, geschorst en ontslagen bij koninklijk besluit op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel25
  - number: '25.2'
    text: |-
      De korpsbeheerder stelt voor de benoeming tot korpschef en het lid van de leiding dat in het bijzonder
      verantwoordelijk is voor de recherchefunctie, een aanbeveling op, gehoord de hoofdofficier van justitie en het
      regionale college. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vraagt ter zake advies aan de
      commissaris van de Koning, die volgens bij de ambtsinstructie, bedoeld in [artikel 182 van de Provinciewet][ref1],
      gegeven regels advies uitbrengt, en, door tussenkomst van Onze Minister van Justitie, aan het College van
      procureurs-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel182
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '182'
  - number: '25.3'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      wordt bepaald welke andere ambtenaren die deel uitmaken van de leiding van het regionale politiekorps, bij
      koninklijk besluit, op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, worden benoemd,
      geschorst of ontslagen. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel25
  - number: '26'
    text: |-
      Onverminderd de [artikelen 25][ref1] en [52][ref2] worden de ambtenaren van het regionale politiekorps benoemd,
      bevorderd, geschorst en ontslagen door de korpsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel52
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '25'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '52'
        hoofdstuk: VIII
  - number: '27.1'
    text: |-
      De korpsbeheerder en de hoofdofficier van justitie overleggen regelmatig tezamen met de korpschef over het beheer
      van het regionale politiekorps.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel27
  - number: '27.2'
    text: |-
      De korpsbeheerder en de hoofdofficier van justitie, alsmede de korpschef, verschaffen elkaar de gewenste
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel27
  - number: '28.1'
    text: |-
      De korpsbeheerder stelt jaarlijks in overeenstemming met de hoofdofficier van justitie het ontwerp van de
      organisatie, de formatie, de begroting, de jaarrekening, het beleidsplan en het jaarverslag voor het regionale
      politiekorps op.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel28
  - number: '28.2'
    text: |-
      De in het eerste lid bedoelde stukken worden onverwijld ter kennis gebracht van de gemeenteraden in de regio en ter
      vaststelling toegezonden aan het regionale college.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel28
  - number: '28.3'
    text: |-
      Het regionale college stelt regels vast over de wijze waarop de gemeenteraden in de regio bij de voorbereiding van
      de in het eerste lid bedoelde stukken worden betrokken.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel28
  - number: '29.1'
    text: |-
      Indien de hoofdofficier van justitie en de korpsbeheerder niet met elkaar tot overeenstemming kunnen komen over de
      in [artikel 28][ref1] genoemde stukken, legt de hoofdofficier van justitie dit verschil van zienswijze schriftelijk
      voor aan het College van procureurs-generaal. Het College van procureurs-generaal beslist in overeenstemming met de
      commissaris van de Koning. De korpsbeheerder brengt de stukken in overeenstemming met het besluit van het College
      van procureurs-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel28
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '28'
        hoofdstuk: V
  - number: '29.2'
    text: |-
      Indien het College van procureurs-generaal en de commissaris van de Koning niet tot overeenstemming komen over
      het te nemen besluit, wordt het verschil van zienswijze door het College van procureurs-generaal voorgelegd
      aan Onze Minister van Justitie die alsdan, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, beslist. Het College van procureurs-generaal brengt de stukken in overeenstemming met het
      besluit van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel29
  - number: '30.1'
    text: |-
      De korpsbeheerder legt over het door hem gevoerde beheer van het regionale politiekorps verantwoording af aan het
      regionale college.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel30
  - number: '30.2'
    text: |-
      De korpsbeheerder en de hoofdofficier van justitie, alsmede, indien daartoe door de korpsbeheerder uitgenodigd,
      de korpschef, geven, zo nodig vertrouwelijk, mondeling of schriftelijk de door een of meer leden van het regionale
      college gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel30
  - number: '31.1'
    text: |-
      Het regionale college stelt jaarlijks de organisatie, de formatie, de begroting, de jaarrekening, het beleidsplan
      en het jaarverslag voor het regionale politiekorps vast. Onverminderd de zeggenschap van het bevoegd gezag is de
      korpsbeheerder eindverantwoordelijk voor de uitvoering van het beleidsplan.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel31
  - number: '31.2'
    text: |-
      In het beleidsplan, bedoeld in het eerste lid, worden, met inachtneming van de omstandigheden van de
      betrokken regio, de landelijke beleidsthema's opgenomen die zijn neergelegd in het beleidsplan, bedoeld in
      [artikel 43a, eerste lid][ref1], en wordt aangegeven met welke personele en financiële middelen wordt beoogd de
      landelijke beleidsthema's in de regio te verwezenlijken.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43a
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43a
        hoofdstuk: VIII
  - number: '31.3'
    text: |-
      De resultaten die in het voorgaande jaar zijn behaald met de verwezenlijking van de landelijke beleidsthema's
      worden vermeld in het jaarverslag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel31
  - number: '31.4'
    text: |-
      Zodra het beleidsplan en het jaarverslag, bedoeld in het eerste lid, zijn vastgesteld, zendt de korpsbeheerder deze
      aan Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel31
  - number: '32.1'
    text: |-
      De korpsbeheerder, dan wel de hoofdofficier van justitie kan tegen de vaststelling van de stukken, bedoeld in
      [artikel 31, eerste lid][ref1],, administratief beroep instellen bij de commissaris van de Koning. Deze beslist
      in overeenstemming met het College van procureurs-generaal op het beroep. De korpsbeheerder brengt de stukken in
      overeenstemming met het besluit van de commissaris van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel31
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
  - number: '32.2'
    text: |-
      Indien de commissaris van de Koning en het College van procureurs-generaal niet tot overeenstemming komen over
      de beslissing op het beroep, treden Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister
      van Justitie in de plaats van de commissaris van de Koning, respectievelijk het College van procureurs-generaal.
      De korpsbeheerder brengt de stukken in overeenstemming met het besluit van Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel32
  - number: '32.3'
    text: |-
      Bij de ambtsinstructie, bedoeld in [artikel 182 van de Provinciewet][ref1], worden nadere regels gegeven over de
      taken van de commissaris van de Koning, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel182
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '182'
  - number: '32.4'
    text: |-
      [Artikel 7:24, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.
      [Artikel 7:25 van de Algemene wet bestuursrecht][ref2] is niet van toepassing voor zover het het beroepsorgaan
      verplicht een nieuw besluit te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '32.5'
    text: |-
      In spoedeisende gevallen kan de korpsbeheerder, in overeenstemming met de hoofdofficier van justitie, zolang niet
      op het beroep is beslist, een voorlopige voorziening treffen, waarbij zo nodig wordt afgeweken van het besluit
      van het regionale college. Deze voorziening komt te vervallen zodra de stukken in overeenstemming zijn gebracht
      met het besluit van de commissaris van de Koning onderscheidenlijk Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties. Van de inhoud van de voorlopige voorziening wordt onverwijld aan het regionale college kennis
      gegeven.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel32
  - number: '33.1'
    text: Het regionale college stelt regels vast over zijn werkwijze.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel33
  - number: '33.2'
    text: |-
      De in het eerste lid bedoelde regels bepalen in elk geval de minimum-termijn waarop de vergaderingen van het
      regionale college worden uitgeschreven en het vereiste aantal leden dat aanwezig moet zijn om rechtsgeldig
      besluiten te nemen, alsmede de gevallen waarin de besluitvorming schriftelijk dan wel mondeling geschiedt.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel33
  - number: '33.3'
    text: Bij het staken van de stemmen in het college geeft die van de korpsbeheerder de doorslag.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel33
  - number: '34.1'
    text: |-
      De vergaderingen van het regionale college zijn openbaar. De voorzitter is bevoegd de deuren te sluiten, indien dit
      uit een oogpunt van de bescherming van de persoonlijke levenssfeer of op gronden, ontleend aan het algemeen belang,
      wenselijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel34
  - number: '34.2'
    text: |-
      De besluiten van het college en de verslagen van de vergaderingen van het regionale college worden ter kennis
      gebracht van de gemeenteraden in de regio.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel34
  - number: '34.3'
    text: |-
      Indien een burgemeester en de gemeenteraad van oordeel zijn, dat een besluit van het regionale college op
      onaanvaardbare wijze afbreuk doet aan het belang van een goede vervulling van de politietaak in hun gemeente,
      kan de gemeenteraad in overeenstemming met de zienswijze van de burgemeester tegen dat besluit administratief
      beroep instellen bij de commissaris van de Koning. Het beroepschrift wordt ingediend door tussenkomst van de
      korpsbeheerder.[ Artikel 32, eerste lid, tweede en derde volzin][ref1], alsmede het tweede en derde lid van dat
      artikel zijn alsdan van toepassing. Het in het [eerste en tweede lid van artikel 32][ref2] bedoelde besluit bepaalt
      het tijdstip waarop het besluit van het regionale college uiterlijk moet zijn aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel32
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '32'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '32'
        hoofdstuk: V
  - number: '35.1'
    text: |-
      Het regionale politiekorps bestaat uit functionele en territoriale onderdelen. De territoriale onderdelen kunnen
      een of meer gemeenten in de regio omvatten; zij kunnen ook delen van gemeenten omvatten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel35
  - number: '35.2'
    text: |-
      De grenzen van de territoriale onderdelen worden bepaald door het regionale college op voorstel van de
      korpsbeheerder, in overeenstemming met de hoofdofficier van justitie, de betrokken burgemeesters gehoord.
      Indien het territoriale onderdeel twee of meer gemeenten omvat, dan wel afwijkt van de gemeentegrenzen in de
      regio, dienen de betrokken burgemeesters hiermede in te stemmen. Voor zover de betrokken burgemeesters niet
      instemmen met het besluit van het regionale college, kunnen zij daartegen administratief beroep instellen
      bij de commissaris van de Koning. Het beroepschrift wordt ingediend door tussenkomst van de korpsbeheerder.
      [Artikel 32, eerste lid, tweede en derde volzin][ref1], alsmede het tweede en derde lid van dat artikel zijn alsdan
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel32
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '32'
        hoofdstuk: V
  - number: '35.3'
    text: |-
      Het hoofd van een territoriaal onderdeel wordt aangewezen door de korpsbeheerder in overeenstemming met de
      hoofdofficier van justitie en na verkregen instemming van de burgemeester of - bij een onderdeel dat meer gemeenten
      of delen van gemeenten omvat - de burgemeesters van de betrokken gemeenten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel35
  - number: '36.1'
    text: |-
      In het beleidsplan voor het regionale politiekorps wordt aangegeven welke bevoegdheden met betrekking tot het
      beheer van een territoriaal onderdeel door de korpsbeheerder worden gedelegeerd aan de burgemeester of - bij een
      onderdeel dat meer gemeenten of delen van gemeenten omvat - aan de burgemeesters van de betrokken gemeenten; de
      uitoefening van deze bevoegdheden vindt plaats in overeenstemming met het regionale beleidsplan.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel36
  - number: '36.2'
    text: |-
      De zeggenschap over het territoriale onderdeel voor zover het betreft de inzet van personeel, materieel en middelen
      die op grond van de in [artikel 31, eerste lid][ref1], bedoelde stukken voor dat onderdeel zijn bestemd, berust bij
      de burgemeester of - bij een onderdeel dat meer gemeenten of delen van gemeenten omvat - bij de burgemeesters van
      de betrokken gemeenten. De zeggenschap wordt uitgeoefend in overeenstemming met het regionaal beleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel31
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
  - number: '37.1'
    text: |-
      Plaatsing van ambtenaren van politie bij een territoriaal onderdeel geschiedt niet dan na overleg met de
      burgemeester. Indien de taakvervulling van een ambtenaar van politie dit naar het oordeel van de burgemeester of -
      bij een onderdeel dat meer gemeenten of delen van gemeenten omvat - van de burgemeesters van de betrokken gemeenten
      noodzakelijk maakt, draagt de korpsbeheerder voor vervanging zorg.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel37
  - number: '37.2'
    text: |-
      Plaatsing bij een functioneel of territoriaal onderdeel van ambtenaren van politie die uitsluitend of in hoofdzaak
      belast zijn met de strafrechtelijke handhaving van de rechtsorde dan wel het verrichten van taken ten dienste van
      de justitie, geschiedt niet dan na overleg met de hoofdofficier van justitie. Indien de taakvervulling van een
      zodanige ambtenaar van politie dit naar het oordeel van de hoofdofficier van justitie noodzakelijk maakt, draagt de
      korpsbeheerder voor vervanging zorg.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel37
  - number: '38.1'
    text: |-
      Er is een Korps landelijke politiediensten. Onverminderd de taakuitvoering van regionale politiekorpsen, is het
      Korps landelijke politiediensten belast met:
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38
  - number: 38.1.a
    text: |-
      de landelijke en specialistische uitvoering van politietaken, in samenwerking met de regionale politiekorpsen, de
      Koninklijke marechaussee en de in [artikel 11, eerste lid][ref1], bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel11
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '11'
        hoofdstuk: III
  - number: 38.1.b
    text: |-
      het verzamelen, registreren, bewerken, beheren, analyseren en verstrekken van informatie en het verrichten
      van andere ondersteunende werkzaamheden ten behoeve van de taakuitvoering van de onder *a* genoemde organen
      en personen, en de andere bij de strafrechtelijke handhaving van de rechtsorde betrokken organen, alsmede de
      internationale uitwisseling van informatie en de landelijke voorlichting aan particulieren;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38
  - number: 38.1.c
    text: |-
      het waken voor de veiligheid van leden van het Koninklijk Huis en andere door het bevoegd gezag aangewezen
      personen;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38
  - number: 38.1.d
    text: |-
      de inkoop en verkoop van, alsmede overige facilitaire diensten inzake bewapening, kleding en uitrusting van de
      politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38
  - number: '38.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties
      en van Justitie kan een nadere aanduiding van de werkzaamheden, bedoeld in het eerste lid, worden gegeven. Een
      dergelijke algemene maatregel van bestuur treedt niet eerder in werking dan drie maanden na de datum van uitgifte
      van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt door Onze Ministers onverwijld mededeling
      gedaan aan de beide Kamers der Staten-Generaal onder overlegging van de over het ontwerp van de algemene maatregel
      van bestuur uitgebrachte adviezen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38
  - number: '38.3'
    text: |-
      Het beheer van het Korps landelijke politiediensten berust bij Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, die daartoe wordt bijgestaan door de korpschef.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38
  - number: 38a.1
    text: |-
      Onze Minister van Justitie kan de korpschef van het Korps landelijke politiediensten voorzover het de uitoefening
      van de taak, bedoeld in [artikel 38, eerste lid, onder a en b][ref1], door het daartoe bestemde onderdeel of
      daartoe bestemde onderdelen betreft, de nodige algemene en bijzondere aanwijzingen geven, voorzover de politie
      optreedt bij of krachtens de wet of op grond van een verdrag of een besluit van een volkenrechtelijke organisatie
      onder verantwoordelijkheid van Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
        hoofdstuk: VI
  - number: 38a.2
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, komt eveneens toe aan Onze Minister van Justitie, met betrekking tot de
      taak, bedoeld in [artikel 38, eerste lid, onder c][ref1], en andere taken die als zodanig zijn aangewezen door Onze
      Minister van Justitie in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
        hoofdstuk: VI
  - number: 38a.3
    text: |-
      De korpschef verstrekt gevraagd en ongevraagd aan Onze Minister van Justitie de inlichtingen die deze nodig
      heeft met het oog op de strafrechtelijke handhaving van de rechtsorde, de uitvoering van de taken ten dienste van
      de justitie en de beveiliging van de leden van het Koninklijk Huis en andere door het bevoegd gezag aangewezen
      personen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38a
  - number: 38b.1
    text: |-
      Het Korps landelijke politiediensten registreert gegevens voor door Onze Ministers van Justitie en van Binnenlandse
      Zaken en Koninkrijksrelaties te bepalen doeleinden en door hen te bepalen categorieën dan wel in door hen aan te
      wijzen wettelijk geregelde registers en verstrekt deze gegevens aan door hen aan te wijzen personen en instanties,
      onverminderd het bepaalde bij of krachtens de [Wet politieregisters][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: 38b.2
    text: |-
      Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen bepalen dat in door hen aan te
      wijzen registers geen andere dan de in het eerste lid bedoelde gegevens worden geregistreerd en dat door hen aan te
      wijzen categorieën van gegevens in geen andere dan door hen aan te wijzen registers worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38b
  - number: 38b.3
    text: |-
      Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels geven over de wijze
      waarop de gegevens, bedoeld in het eerste lid, worden geregistreerd, verwijderd dan wel verstrekt en op welke wijze
      bestandsvergelijking met die gegevens plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38b
  - number: 38b.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ter uitvoering van het derde lid nadere regels
      geven over de schrijfwijze, classificatie of codering van gegevens en de samenstelling van de gegevens in de vorm
      van berichten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38b
  - number: 38c
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt jaarlijks in overeenstemming met het hoofd van
      het landelijk parket het ontwerp van het beleidsplan en het jaarverslag voor het Korps landelijke politiediensten
      op. In het beleidsplan wordt in ieder geval aangegeven met welke personele en financiële middelen wordt beoogd het
      plan en zijn onderdelen te verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38c
  - number: 38d
    text: |-
      Indien het hoofd van het landelijk parket en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties niet met
      elkaar tot overeenstemming kunnen komen over het ontwerp van het beleidsplan, bedoeld in [artikel 38c][ref1], legt
      de eerstgenoemde dit verschil van zienswijze door tussenkomst van het College van procureurs-generaal schriftelijk
      voor aan Onze Minister van Justitie die alsdan, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38c
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 38c
        hoofdstuk: VI
  - number: '39.1'
    text: Er is een Raad voor het Korps landelijke politiediensten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel39
  - number: '39.2'
    text: |-
      De Raad stelt jaarlijks de organisatie, de formatie, de begroting, de jaarrekening, het beleidsplan en het
      jaarverslag voor het Korps landelijke politiediensten vast.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel39
  - number: '39.3'
    text: |-
      De Raad verstrekt Onze Ministers desgevraagd de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van beleidsvoornemens en voorgenomen wettelijke voorschriften, voor zover deze betrekking hebben op
      de taken en de taakvervulling van het Korps landelijke politiediensten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel39
  - number: '39.4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan aan de Raad bepaalde bevoegdheden met betrekking
      tot het beheer van het Korps landelijke politiediensten, onderscheidenlijk bepaalde politiediensten delegeren.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel39
  - number: '39.5'
    text: |-
      Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie verstrekken de Raad alle inlichtingen
      die hij met het oog op een goede vervulling van zijn taken behoeft.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel39
  - number: '40.1'
    text: |-
      De Raad voor het Korps landelijke politiediensten is samengesteld uit een voorzitter en ten hoogste acht overige
      leden. Onder deze leden zijn drie vertegenwoordigers uit kringen van het binnenlands bestuur en drie leden van het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '40.2'
    text: |-
      De voorzitter en overige leden van de Raad worden benoemd voor een termijn van drie jaar. Zij kunnen eenmaal voor
      een gelijke termijn worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '40.3'
    text: |-
      De voorzitter en overige leden van de Raad worden benoemd en ontslagen bij koninklijk besluit op voordracht van
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Voorzover het de benoeming van de leden van het
      openbaar ministerie betreft vindt de voordracht plaats in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '40.4'
    text: |-
      De Raad heeft voorts drie adviserende leden die worden benoemd uit de korpschefs van de regionale politiekorpsen,
      alsmede een adviserend lid dat wordt benoemd uit de kring van de Koninklijke marechaussee. Tevens kunnen zoveel
      adviserende leden worden benoemd als Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties dienstig oordeelt.
      Het tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '40.5'
    text: Aan de vergaderingen van de Raad wordt deelgenomen door de korpschef.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '40.6'
    text: De Raad stelt regels vast omtrent zijn werkwijze.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '40.7'
    text: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voorziet in het secretariaat van de Raad.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '40.8'
    text: |-
      Telkens binnen een termijn van zes jaren brengt de Raad een rapport uit aan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties, waarin de taakvervulling van de Raad aan een onderzoek wordt onderworpen. De Raad zendt een
      exemplaar van het rapport aan Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel40
  - number: '41.1'
    text: |-
      De organisatie, de begroting, de jaarrekening, de formatie, het beleidsplan en het jaarverslag voor het
      Korps landelijke politiediensten behoeven jaarlijks de instemming van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties. De instemming met het beleidsplan wordt gegeven in overeenstemming met Onze Minister van
      Justitie. Het jaarverslag wordt aan Onze Minister van Justitie gezonden.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel41
  - number: '41.2'
    text: |-
      Indien aan enige door de Raad vastgestelde beslissing geheel of gedeeltelijk instemming is onthouden, wordt de Raad
      daarover onverwijld ingelicht, onder gelijktijdige kennisgeving aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel41
  - number: '41.3'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      in overeenstemming met Onze Minister van Financiën kunnen op het Korps landelijke politiediensten van toepassing
      zijnde comptabele regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel41
  - number: 41a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het hoofd van het landelijk parket overleggen
      regelmatig tezamen met de korpschef over de uitvoering van het beleidsplan.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel41a
  - number: 41a.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het hoofd van het landelijk parket, alsmede de
      korpschef, verschaffen elkaar de gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel41a
  - number: '42.1'
    text: |-
      De korpschef wordt benoemd, geschorst, en ontslagen bij koninklijk besluit op voordracht van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie, het hoofd van het
      landelijk parket en de Raad voor het Korps landelijke politiediensten gehoord.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel42
  - number: '42.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op bij algemene maatregel van bestuur op voordracht van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen ambtenaren van politie die deel uitmaken van
      de leiding van het Korps landelijke politiediensten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel42
  - number: '42.3'
    text: |-
      De overige ambtenaren van het Korps landelijke politiediensten worden, onverminderd [artikel 52][ref1],
      benoemd, bevorderd, geschorst en ontslagen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      met dien verstande dat plaatsing van ambtenaren van politie die uitsluitend of in hoofdzaak belast zijn met
      de strafrechtelijke handhaving van de rechtsorde dan wel het verrichten van taken ten dienste van de justitie,
      niet geschiedt dan na overleg met het hoofd van het landelijk parket. Indien de taakvervulling van een zodanige
      ambtenaar van politie dit naar het oordeel van het hoofd van het landelijk parket noodzakelijk maakt, draagt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties voor vervanging zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel52
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '52'
        hoofdstuk: VIII
  - number: 42a.1
    text: |-
      Onze Minister van Justitie kan, indien hij dit nodig acht in verband met de uitvoering van de taken bedoeld in
      [artikel 38, eerste lid, onder a tot en met c][ref1], daarvoor in aanmerking komende bestuursorganen schriftelijk
      opdragen de noodzakelijke medewerking te verlenen om door hem aangewezen personen tijdelijk van een aan te nemen
      identiteit te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
        hoofdstuk: VI
  - number: 42a.2
    text: |-
      De voor de bestuursorganen geldende wettelijke voorschriften ter zake van de verlangde werkzaamheden blijven,
      voorzover deze in de weg staan aan het verrichten van die werkzaamheden, buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel42a
  - number: '43.1'
    text: |-
      Het College van procureurs-generaal beschikt ten behoeve van door Onze Minister van Justitie, na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, aan te wijzen taken over bijzondere ambtenaren van politie
      en ambtenaren van politie, bedoeld in [artikel 3, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
        hoofdstuk: II
  - number: '43.2'
    text: |-
      Onze Minister van Justitie is belast met het beheer van de ambtenaren van politie, bedoeld in het eerste lid. Deze
      ambtenaren van politie worden, onverminderd [artikel 52][ref1], benoemd, bevorderd, geschorst en ontslagen door
      Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel52
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '52'
        hoofdstuk: VIII
  - number: 43a.1
    text: |-
      Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie stellen ten minste eenmaal in de vier
      jaar een beleidsplan vast waarin de hoofdzaken van het beleid op rijksniveau met betrekking tot de politie en de
      landelijke beleidsthema's voor de politie in de eerstkomende vier jaar worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43a
  - number: 43a.2
    text: |-
      Zodra het beleidsplan, bedoeld in het eerste lid, is vastgesteld, doen Onze Ministers van Binnenlandse Zaken en
      Koninkrijksrelaties en van Justitie hiervan mededeling door overlegging van het beleidsplan aan de Staten-Generaal
      en door toezending ervan aan de regionale colleges, de korpsbeheerders, het College van procureurs-generaal, de
      hoofdofficieren van justitie en de korpschefs.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43a
  - number: 43b
    text: |-
      Jaarlijks stellen Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie de nadere uitwerking
      van het beleidsplan, bedoeld in [artikel 43a, eerste lid][ref1], voor het komende jaar vast en geven zij aan welke
      resultaten in het voorgaande jaar zijn behaald met de verwezenlijking van de landelijke beleidsthema's die zijn
      neergelegd in het beleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43a
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43a
        hoofdstuk: VIII
  - number: 43c
    text: |-
      Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie voeren periodiek overleg met de
      korpsbeheerders en de hoofdofficieren van justitie over de landelijke beleidsthema's.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43c
  - number: 43d.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ten aanzien van de uitvoering van de landelijke
      beleidsthema's de nodige aanwijzingen geven aan de korpsbeheerder indien in de betrokken regio geen of onvoldoende
      aandacht aan die uitvoering wordt gegeven. Indien de beleidsthema's betrekking hebben op de strafrechtelijke
      handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie, worden de aanwijzingen
      gegeven door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister
      van Justitie. De aanwijzingen worden schriftelijk gegeven en na overleg met de korpsbeheerder. De korpsbeheerder
      brengt, voorzover nodig, de stukken bedoeld in [artikel 31, eerste lid][ref1], in overeenstemming met de
      aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel31
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43d
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '31'
        hoofdstuk: V
  - number: 43d.2
    text: |-
      De korpsbeheerder verstrekt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties alle informatie over
      de wijze waarop uitvoering wordt gegeven aan de landelijke beleidsthema's. Bij of krachtens algemene maatregel van
      bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze
      Minister van Justitie kunnen regels worden gegeven over het in de eerste volzin bepaalde.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel43d
  - number: '44.1'
    text: |-
      Met het oog op de kosten van de politie worden jaarlijks door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties aan de regio’s bijdragen beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel44
  - number: '44.2'
    text: |-
      Indien blijkt dat voor een regio de middelen aanmerkelijk tekort zullen schieten om in de noodzakelijke behoeften
      te voorzien, kan door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan de regio een aanvullende
      bijdrage beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel44
  - number: '44.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties in overeenstemming met Onze Minister van Financiën worden regels gegeven over de wijze waarop
      het eerste en tweede lid worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel44
  - number: '45.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties worden regels gegeven over het beheer van de regionale politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel45
  - number: '45.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt de maximale formatie van de leiding van de
      regionale politiekorpsen vast.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel45
  - number: '45.3'
    text: |-
      De betrokken korpsbeheerders verstrekken aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties alle
      informatie over het beheer van de regionale politiekorpsen, die hij nodig heeft. Bij of krachtens de algemene
      maatregel van bestuur, bedoeld in het eerste lid, worden ter zake nadere regels gegeven.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel45
  - number: '45.4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt toezicht op het financiële beheer van de
      regionale politiekorpsen. De [artikelen 203][ref1], [205 tot en met 211 van de Gemeentewet][ref2] zijn daarbij van
      overeenkomstige toepassing. Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties worden over deze toepassing nadere, zo nodig afwijkende regels gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel205
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '205'
  - number: '45.5'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gegeven betreffende
      het vermogen van de regio’s. Indien een regio niet voldoet aan deze regels kan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties besluiten tot vermindering van de bijdragen die aan de desbetreffende regio op grond van
      [artikel 44, eerste lid][ref1], beschikbaar worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel44
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '44'
        hoofdstuk: VIII
  - number: '45.6'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gegeven over de
      zorg voor en de bewaring van de archiefbescheiden van de regio. De [artikelen 32, tweede lid][ref1],
      [33, eerste en derde lid][ref2], en [34 van de Archiefwet 1995][ref3] (*Stb.* 276) zijn van overeenkomstige
      toepassing, met dien verstande dat de archiefbewaarplaats van de gemeente waarvan de burgemeester korpsbeheerder
      is, mede is bestemd voor de bewaring van de archiefbescheiden van de regio.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel34
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0007376
        artikel: '34'
  - number: '46.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels geven over de samenwerking tussen regionale
      politiekorpsen. Alvorens deze regels worden vastgesteld kunnen de korpsbeheerders worden gehoord.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel46
  - number: '46.2'
    text: |-
      Indien de regels, bedoeld in het eerste lid, voorschriften bevatten die ten behoeve van de strafrechtelijke
      handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie moeten worden gesteld,
      worden zij gegeven door Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie gezamenlijk
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel46
  - number: '48.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels geven over de samenwerking tussen de
      regionale politiekorpsen en het Korps landelijke politiediensten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan in overeenstemming met Onze Minister van Defensie
      regels geven over de samenwerking van de regionale politiekorpsen of over de samenwerking van het Korps landelijke
      politiediensten met de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48
  - number: '48.3'
    text: |-
      Indien de regels, bedoeld in het eerste en tweede lid, voorschriften bevatten die ten behoeve van de
      strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie moeten
      worden gesteld, worden zij gegeven door Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van
      Justitie gezamenlijk, onderscheidenlijk door Onze voornoemde Ministers en Onze Minister van Defensie gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48
  - number: '48.4'
    text: Alvorens de regels, bedoeld in het eerste en tweede lid, worden gegeven, kunnen de korpsbeheerders worden gehoord.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48
  - number: 48a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan bij ministeriële regeling eisen stellen aan
      bekwaamheid van de ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48a
  - number: 48a.2
    text: |-
      Indien de aard van de werkzaamheden van de politie ten behoeve van de strafrechtelijke handhaving van de rechtsorde
      en de taken ten dienste van de justitie specifieke vaardigheid of kennis vereist, kunnen Onze Ministers van
      Binnenlandse Zaken en Koninkrijksrelaties en van Justitie bij ministeriële regeling eisen vaststellen waaraan de
      met die werkzaamheden belaste ambtenaren van politie moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48a
  - number: 48b.1
    text: |-
      Het regionale politiekorps registreert gegevens voor door Onze Ministers van Justitie en van Binnenlandse Zaken
      en Koninkrijksrelaties te bepalen doeleinden en door hen te bepalen categorieën dan wel in door hen aan te wijzen
      wettelijk geregelde registers en verstrekt deze gegevens aan door hen aan te wijzen personen en instanties,
      onverminderd het bepaalde bij of krachtens de [Wet politieregisters][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: 48b.2
    text: |-
      Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen bepalen dat in door hen aan te
      wijzen registers geen andere dan de in het eerste lid bedoelde gegevens worden geregistreerd en dat door hen aan te
      wijzen categorieën van gegevens in geen andere dan door hen aan te wijzen registers worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48b
  - number: 48b.3
    text: |-
      Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels geven over de wijze
      waarop de gegevens, bedoeld in het eerste lid, worden geregistreerd, verwijderd dan wel verstrekt en op welke wijze
      bestandsvergelijking met die gegevens plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48b
  - number: 48b.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ter uitvoering van het derde lid nadere regels
      geven over de schrijfwijze, classificatie of codering van gegevens en de samenstelling van de gegevens in de vorm
      van berichten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel48b
  - number: '49.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties geeft bij ministeriële regeling regels over de
      bewapening, de uitrusting en de kleding van de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel49
  - number: '49.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt in overeenstemming met Onze Minister van Justitie
      eisen vast waaraan de bewapening van de politie in verband met de taakuitvoering moet voldoen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel49
  - number: 49a
    text: |-
      De basisopleidingen en de door Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties
      aan te wijzen vervolgopleidingen van ambtenaren van politie worden verzorgd door het Landelijk selectie- en
      opleidingsinstituut politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel49a
  - number: '50.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties worden voor de politie regels gegeven over de onderwerpen, genoemd in
      [artikel 125, eerste lid, van de Ambtenarenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
  - number: '50.2'
    text: |-
      Voor de toepassing van de [Wet veiligheidsonderzoeken][ref1] bij de politie wordt Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties aangemerkt als Onze Minister, bedoeld in [artikel 1, onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '51'
    text: |-
      Bij algemene maatregel van bestuur worden op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties regels gegeven over de rangen van de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel51
  - number: '52'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      wordt bepaald welke andere ambtenaren van politie dan die bedoeld in de [artikelen 25, eerste en derde lid][ref1],
      en [42][ref2] worden benoemd, bevorderd, geschorst en ontslagen bij koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel42
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '25'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '42'
        hoofdstuk: VI
  - number: '53.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan aan een korpsbeheerder de nodige aanwijzingen ten
      aanzien van het beheer geven, indien het belang van het beheer van de politie dit eist. De aanwijzingen worden
      schriftelijk gegeven en na overleg met de korpsbeheerder.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53
  - number: '53.2'
    text: |-
      Onverminderd het eerste lid, en de [artikelen 46][ref1] en [48][ref2], kunnen in bijzondere gevallen waarin
      onverwijld een voorziening moet worden getroffen betreffende de samenwerking tussen regionale politiekorpsen
      of de samenwerking tussen regionale politiekorpsen en het Korps landelijke politiediensten ten aanzien van
      de strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken ten dienste van de justitie,
      aanwijzingen worden gegeven door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met
      Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel48
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '46'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '48'
        hoofdstuk: VIII
  - number: 53a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties heeft met het oog op een goede taakuitvoering door de
      politie en een doelmatig en effectief beheer van de politiekorpsen de bevoegdheid tot:
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.1.a
    text: |-
      het toetsen van de wijze waarop de beheerders van de politiekorpsen voorzien in de kwaliteit van de taakuitvoering,
      de resultaten en het beheer van de politie;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.1.b
    text: het toetsen van specifieke onderdelen van de taakuitvoering dan wel het beheer van de politie;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.1.c
    text: |-
      het verrichten van onderzoek, indien daar in bijzondere gevallen reden toe is, naar ingrijpende gebeurtenissen
      waarbij de politie betrokken is;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.1.d
    text: |-
      het verrichten van onderzoek, indien in andere bijzondere gevallen dan die, bedoeld onder c, dit nodig wordt
      geoordeeld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.2
    text: |-
      De werkzaamheden die in het kader van het eerste lid, onder a en b, worden uitgevoerd, worden jaarlijks door
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.3
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties oefent de bevoegdheid, genoemd in het eerste lid,
      onder c, en die, genoemd in het eerste lid, onder d, uit na overleg onderscheidenlijk in overeenstemming met Onze
      Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.4
    text: |-
      De bevoegdheid, genoemd in het eerste lid, onder c, en die, genoemd in het eerste lid, onder d, komen eveneens
      toe aan onze Minister van Justitie, indien de ingrijpende gebeurtenissen onderscheidenlijk de andere bijzondere
      gevallen betrekking hebben op de taakuitvoering door de politie in het kader van de strafrechtelijke handhaving
      van de rechtsorde, de taken ten dienste van de justitie, dan wel de beveiliging van leden van het Koninklijk Huis
      en andere door het bevoegd gezag aan te wijzen personen. Hij oefent de bevoegdheid, genoemd in het eerste lid,
      onder c, en die, genoemd in het eerste lid, onder d, uit na overleg onderscheidenlijk in overeenstemming met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53a.5
    text: |-
      Er is een Inspectie voor de politie. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wijst de
      ambtenaren van de Inspectie voor de politie aan, met dien verstande dat hij het hoofd aanwijst na overleg
      met Onze Minister van Justitie. De Inspectie voor de politie is, onder het gezag van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, belast met de werkzaamheden die in het kader van het eerste lid worden
      uitgevoerd, en onder het gezag van Onze Minister van Justitie, tevens belast met de werkzaamheden die in het
      kader van het vierde lid worden uitgevoerd. De Inspectie voor de politie rapporteert, gevraagd of ongevraagd,
      rechtstreeks aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Justitie. De
      [artikelen 5:12 tot en met 5:20 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing op de
      ambtenaren van de Inspectie voor de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 53a.6
    text: |-
      De beheerders van de politiekorpsen verlenen Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      respectievelijk Onze Minister van Justitie de door deze verlangde ondersteuning bij de uitvoering van de
      werkzaamheden in het kader van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53a
  - number: 53b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt jaarlijks een verslag van de werkzaamheden,
      bedoeld in [artikel 53a, eerste lid][ref1], aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel53a
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 53a
        hoofdstuk: VIII
  - number: 53c
    text: |-
      De beheerders van de politiekorpsen verstrekken aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      alle informatie over de wijze waarop zij zorg dragen voor de kwaliteit van hun taakuitvoering, de resultaten en
      het beheer van de politiekorpsen. Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, voorzover het de strafrechtelijke handhaving van de rechtsorde dan
      wel de vervulling van taken ten dienste van de justitie betreft in overeenstemming met Onze Minister van Justitie
      kunnen regels worden gegeven over het in de vorige volzin bepaalde, alsmede over de wijze waarop de beheerders
      van politiekorpsen zorg dragen voor de kwaliteit van hun taakuitvoering, de resultaten en het beheer van de
      politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53c
  - number: 53d.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties draagt zorg voor de landelijke informatie- en
      communicatievoorzieningen en het beheer daarvan voor de politie ten behoeve van de taakuitvoering door de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
  - number: 53d.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties draagt op verzoek van een of meer korpsbeheerders zorg
      voor informatie- en communicatievoorzieningen en het beheer daarvan, indien dit naar zijn oordeel noodzakelijk is
      voor de taakuitvoering van de politie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
  - number: 53d.3
    text: |-
      Indien dit naar zijn oordeel noodzakelijk is voor de samenwerking tussen de politie en de desbetreffende diensten
      of organisaties, draagt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zorg voor voorzieningen op het
      gebied van de informatie- en communicatiehuishouding en het beheer daarvan, op verzoek van
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
  - number: 53d.3.a
    text: Onze Minister die het aangaat ten behoeve van de onder hem ressorterende diensten;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
  - number: 53d.3.b
    text: |-
      een regionale brandweer als bedoeld in de [Brandweerwet 1985][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003764
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0003764
  - number: 53d.3.c
    text: |-
      een centrale post voor het ambulancevervoer als bedoeld in de [Wet ambulancevervoer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002757
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002757
  - number: 53d.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt voor de voorzieningen aan de regionale
      politiekorpsen en het Korps landelijke politiediensten, alsmede aan de diensten en organisaties, bedoeld in het
      derde lid, kostendekkende tarieven vast.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
  - number: 53d.5
    text: |-
      De Organisatie Informatie- en communicatietechnologie OOV is belast met de uitvoering van de werkzaamheden ten
      behoeve van de in het eerste tot en met het derde lid bedoelde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
  - number: 53d.6
    text: |-
      De voorschriften, vastgesteld bij of krachtens [artikel 50, eerste lid][ref1], zijn van overeenkomstige toepassing
      op de ambtenaren die werkzaam zijn bij de organisatie, bedoeld in het vijfde lid. Bij of krachtens algemene
      maatregel van bestuur kunnen daaromtrent nadere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel50
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '50'
        hoofdstuk: VIII
  - number: 53d.7
    text: |-
      De directeur alsmede de bij algemene maatregel van bestuur aangewezen ambtenaren, die werkzaam zijn bij de
      organisatie, bedoeld in het vijfde lid, worden bij koninklijk besluit benoemd, geschorst en ontslagen op voordracht
      van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel53d
  - number: '54.1'
    text: |-
      Behoeft een regionaal politiekorps bijstand van andere politiekorpsen voor de handhaving van de openbare orde, dan
      richt de korpsbeheerder op aanvrage van de burgemeester een verzoek daartoe aan de commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel54
  - number: '54.2'
    text: |-
      De commissaris van de Koning pleegt alvorens te beslissen overleg met de korpsbeheerders die de bijstand moeten
      verlenen en met het College. De korpsbeheerders verlenen de gevraagde bijstand.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel54
  - number: '54.3'
    text: |-
      Is het voor de commissaris van de Koning niet mogelijk met de in zijn ambtsgebied beschikbare politie aan een
      aanvrage van een korpsbeheerder om bijstand te voldoen, dan geeft hij daarvan kennis aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. Deze verstrekt alsdan, door tussenkomst van de betrokken commissarissen
      van de Koning, de nodige opdrachten aan de betrokken korpsbeheerders van regionale politiekorpsen en stelt Onze
      Minister van Justitie daarvan in kennis. Indien bijstand van het Korps landelijke politiediensten nodig is, treft
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nodige voorzieningen en stelt Onze Minister van
      Justitie en de commissaris van de Koning daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel54
  - number: '54.4'
    text: |-
      Van beslissingen als bedoeld in het tweede lid worden Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties
      en van Justitie zo spoedig mogelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel54
  - number: '55'
    text: |-
      Indien de commissaris van de Koning onderscheidenlijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      zijn bevoegdheid, bedoeld in [artikel 16, eerste onderscheidenlijk tweede lid][ref1], uitoefent, kan hij in
      afwijking van [artikel 54][ref2] voorzien in de bijstand aan regionale politiekorpsen of onderdelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel54
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '54'
        hoofdstuk: IX
  - number: '56.1'
    text: |-
      Behoeft een regionaal politiekorps bijstand van andere politiekorpsen voor de strafrechtelijke handhaving van
      de rechtsorde, dan wel voor het verrichten van taken ten dienste van de justitie, dan richt de korpsbeheerder op
      aanvrage van de officier van justitie een verzoek daartoe aan het College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel56
  - number: '56.2'
    text: |-
      Het College van procureurs-generaal pleegt alvorens te beslissen overleg met de korpsbeheerders die de bijstand
      moeten verlenen en met de betrokken commissaris van de Koning. De korpsbeheerders verlenen de gevraagde
      bijstand. Indien bijstand van het Korps landelijke politiediensten nodig is, brengt het College van procureurs-
      generaal de aanvrage van de korpsbeheerder om bijstand ter kennis van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, die de nodige voorzieningen treft en het College van procureurs-generaal daarvan in kennis
      stelt.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel56
  - number: '56.3'
    text: |-
      Van beslissingen als bedoeld in het tweede lid worden Onze Ministers van Justitie en van Binnenlandse Zaken en
      Koninkrijksrelaties zo spoedig mogelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel56
  - number: '57.1'
    text: |-
      Behoeft het Korps landelijke politiediensten bijstand van regionale politiekorpsen voor de handhaving van de
      openbare orde, dan verstrekt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties op aanvrage van de
      burgemeester door tussenkomst van de betrokken commissarissen van de Koning, aan de betrokken korpsbeheerders de
      nodige opdrachten.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel57
  - number: '57.2'
    text: |-
      Behoeft het Korps landelijke politiediensten bijstand van regionale politiekorpsen voor de strafrechtelijke
      handhaving van de rechtsorde, dan wel voor het verrichten van taken ten dienste van de justitie, dan richt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties op aanvrage van de officier van justitie een verzoek daartoe
      aan het College van procureurs-generaal dat alsdan aan de betrokken korpsbeheerders de nodige opdrachten verstrekt
      en Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties daarvan in kennis stelt.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel57
  - number: '58.1'
    text: In bijzondere gevallen kan bijstand worden verleend door de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel58
  - number: '58.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft bijstand ter handhaving van de
      openbare orde, onderscheidenlijk Onze Minister van Justitie, indien het betreft bijstand voor de strafrechtelijke
      handhaving van de rechtsorde dan wel voor het verrichten van taken ten dienste van de justitie, bepaalt, na overleg
      met Onze Minister van Defensie, of bijstand wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel58
  - number: '58.3'
    text: |-
      Indien bijstand moet worden verleend, bepaalt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      onderscheidenlijk Onze Minister van Justitie in overeenstemming met Onze Minister van Defensie op welke wijze de
      bijstand wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel58
  - number: '59.1'
    text: |-
      Kan ook op grond van [artikel 58][ref1] niet in de behoefte aan bijstand ter handhaving van de openbare orde of
      bijstand voor de strafrechtelijke handhaving van de rechtsorde, dan wel voor het verrichten van taken ten dienste
      van de justitie, worden voorzien, dan kan bijstand worden verleend door andere onderdelen van de krijgsmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel58
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '58'
        hoofdstuk: IX
  - number: '59.2'
    text: |-
      In dat geval bepaalt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, onderscheidenlijk Onze Minister
      van Justitie, in overeenstemming met Onze Minister van Defensie op welke wijze de bijstand zal worden verleend.
      Daarbij worden tevens nadere regels of beleidsregels gegeven over de uitoefening van bevoegdheden krachtens deze
      wet.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel59
  - number: '60.1'
    text: |-
      Er zijn bijstandseenheden, bestaande uit personeel van de politie, onderscheidenlijk de Koninklijke marechaussee en
      andere onderdelen van de krijgsmacht. Deze eenheden worden belast met door Onze Ministers van Binnenlandse Zaken en
      Koninkrijksrelaties, van Justitie en van Defensie aan te wijzen bijzondere onderdelen van de politietaak.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel60
  - number: '60.2'
    text: |-
      Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties, van Justitie en van Defensie bepalen op welke
      wijze de bijstandseenheden worden ingezet. Daarbij worden tevens nadere regels of beleidsregels gegeven over de
      uitoefening van bevoegdheden krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel60
  - number: '61.1'
    text: |-
      Het regionale college stelt, op voorstel van de korpsbeheerder, met inachtneming van dit hoofdstuk regels vast over
      de behandeling, het onderzoek en de afdoening van klachten over het optreden van ambtenaren van politie van het
      regionale politiekorps.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel61
  - number: '61.2'
    text: 'In de regels, bedoeld in het eerste lid, wordt voorzien in:'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel61
  - number: 61.2.a
    text: |-
      de instelling van een commissie, bestaande uit onafhankelijke leden, die op de wijze in de regeling te bepalen de
      korpsbeheerder kan adviseren over de afdoening van klachten;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel61
  - number: 61.2.b
    text: een termijn voor de afdoening van de klacht;
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel61
  - number: 61.2.c
    text: een registratie van de ingediende klachten en de daarop door de korpsbeheerder genomen beslissingen en
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel61
  - number: 61.2.d
    text: |-
      een periodieke publikatie van de in onderdeel *c* bedoelde gegevens, waarin wordt aangegeven of en in hoeverre
      bepaalde klachten wijzen op structurele tekortkomingen in het functioneren van de politie en waarin, zo nodig,
      aandacht wordt geschonken aan de middelen om deze tekortkomingen op te heffen.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel61
  - number: '61.3'
    text: De korpsbeheerder draagt zorg voor de openbaarmaking van deze regels.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel61
  - number: '62.1'
    text: |-
      De Raad voor het Korps landelijke politiediensten stelt, op voorstel van Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties, met inachtneming van dit hoofdstuk regels vast over de behandeling, het onderzoek en de
      afdoening van klachten over het optreden van ambtenaren van politie van het Korps landelijke politiediensten.
      Onze Minister van Justitie stelt zodanige regels vast ten aanzien van klachten over het optreden van bijzondere
      ambtenaren van politie, als bedoeld in [artikel 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '43'
        hoofdstuk: VII
  - number: '62.2'
    text: |-
      [Artikel 61, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel61
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '61'
        hoofdstuk: X
  - number: '63.1'
    text: |-
      Onze Minister van Defensie stelt met inachtneming van dit hoofdstuk regels vast over de behandeling, het onderzoek
      en de afdoening van klachten over het optreden van militairen van de Koninklijke marechaussee dan wel van enig
      ander onderdeel van de krijgsmacht, bij de uitvoering van hun in deze wet omschreven taken.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel63
  - number: '63.2'
    text: |-
      [Artikel 61, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel61
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '61'
        hoofdstuk: X
  - number: '64.1'
    text: |-
      Een klacht over het optreden van een ambtenaar van politie wordt ingediend bij de burgemeester van de gemeente waar
      de gedraging waarover wordt geklaagd, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel64
  - number: '64.2'
    text: |-
      Een klacht over het optreden van een ambtenaar van politie van het Korps landelijke politiediensten en van
      een bijzondere ambtenaar van politie kan ook worden ingediend bij Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, onderscheidenlijk Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel64
  - number: '64.3'
    text: |-
      Een klacht over het optreden van een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel van
      de krijgsmacht, kan ook worden ingediend bij Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel64
  - number: '64.4'
    text: |-
      De burgemeester, bedoeld in het eerste lid, draagt zorg voor een zo spoedig mogelijke doorzending van een
      klacht als bedoeld in het tweede en derde lid naar Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      onderscheidenlijk Onze Minister van Justitie, onderscheidenlijk Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel64
  - number: '64.5'
    text: |-
      Van elke klacht wordt na de ontvangst onverwijld afschrift gezonden aan de hoofdofficier van justitie van de regio
      binnen welke de gemeente is gelegen waar de gedraging waarover wordt geklaagd heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel64
  - number: '65.1'
    text: |-
      De burgemeester, bedoeld in [artikel 64, eerste lid][ref1], stelt een onderzoek in naar de klacht, indien deze
      betrekking heeft op een gedraging van een ambtenaar van politie van het territoriale onderdeel van het regionale
      politiekorps, waarin de gemeente geheel of ten dele gelegen is. De burgemeester doet van zijn bevindingen naar
      aanleiding van het door hem ingestelde onderzoek mededeling aan de korpsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel64
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '64'
        hoofdstuk: X
  - number: '65.2'
    text: |-
      In de overige gevallen draagt de burgemeester zorg voor een zo spoedig mogelijke doorzending van de klacht aan de
      korpsbeheerder van het regionale politiekorps waartoe de ambtenaar over wiens gedragingen wordt geklaagd, behoort,
      die alsdan een onderzoek instelt naar de klacht.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel65
  - number: '66'
    text: |-
      Een onderzoek naar een klacht, voor zover die betrekking heeft op een misdrijf, blijft achterwege zo lang ter
      zake een opsporingsonderzoek op bevel van de officier van justitie of een vervolging gaande is, dan wel een
      beklagprocedure als bedoeld in [artikel 12 van het Wetboek van Strafvordering][ref1] aanhangig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel12
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '12'
  - number: '70.1'
    text: |-
      De Politiewet (*Stb.* 1989, 223) en de Wet tijdelijke voorzieningen reorganisatie politiebestel (*Stb.* 1991, 674)
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel70
  - number: '70.2'
    text: |-
      Totdat terzake bij de wet een voorziening zal zijn getroffen, blijven Hoofdstuk VII van de Politiewet, bedoeld in
      het eerste lid, en de daarop berustende bepalingen van kracht, met dien verstande dat
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel70
  - number: 70.2.a
    text: 'voor "gemeentepolitie" wordt gelezen: regionale politiekorpsen,'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel70
  - number: 70.2.b
    text: 'voor "het Korps Rijkspolitie" wordt gelezen: het Korps landelijke politiediensten, en'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel70
  - number: 70.2.c
    text: 'voor "ambtenaren van gemeente- en rijkspolitie" wordt gelezen: ambtenaren van politie.'
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel70
  - number: '70.3'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven het
      [Besluit sociaal beleidskader reorganisatie politiebestel][ref1] en het
      [Besluit vergoeding reorganisatiekosten politie][ref2] van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005607
      [ref2]: https://wetten.overheid.nl/BWBR0005911
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005607
      - id: ref2
        bwb_id: BWBR0005911
  - number: '71'
    text: |-
      Onze Minister van Justitie zendt in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en
      de effecten van [hoofdstuk VI van deze wet][ref1] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0006299
        hoofdstuk: VI
  - number: '72'
    text: Deze wet treedt in werking op een bij of krachtens de wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel72
  - number: '73'
    text: |-
      Voor het tijdstip van plaatsing in het *Staatsblad* vervangt Onze Minister van Justitie de in deze wet voorkomende
      aanduiding "1993" door het jaartal van het *Staatsblad* waarin deze wet zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel73
  - number: '74'
    text: |-
      Deze wet kan worden aangehaald als Politiewet, met vermelding van het jaartal van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006299/2002-12-01#Artikel74
