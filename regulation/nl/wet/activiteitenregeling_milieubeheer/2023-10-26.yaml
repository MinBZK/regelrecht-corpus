  - number: 4.102d
    text: |-
      1 Ter uitvoering van [artikel 4.94a, eerste lid, van het besluit][ref1], past degene die de inrichting drijft:

      a. bij het toepassen van vluchtige organische stoffen in het vochtwater een zo laag als redelijkerwijs mogelijk
      gehalte aan vluchtige organische stoffen toe;

      b. maatregelen ten aanzien van de bedrijfsvoering toe, ter voorkoming van onnodige emissie van vluchtige organische
      stoffen bij het offsetdrukken en het reinigen van de hierbij gebruikte apparatuur.

      2 Ter uitvoering van [artikel 4.94a, eerste lid, van het besluit][ref2] stelt degene die de inrichting drijft
      een plan op ter reductie van het gebruik van isopropylalcohol of andere vluchtige organische stoffen die aan het
      vochtwater worden toegevoegd. Dit plan:

      a. bevat een beschrijving van de getroffen of te treffen maatregelen ter reductie van het gehalte aan
      isopropylalcohol of andere vluchtige organische stoffen in het vochtwater;

      b. gaat in op de mogelijkheid tot aanschaf van nieuwe persen, die het gehalte aan vluchtige organische stoffen in
      het vochtwater zo laag mogelijk maken;

      c. wordt tweejaarlijks geactualiseerd;

      d. is voor inzage door het bevoegd gezag beschikbaar.

      3 Indien de emissiereducerende maatregelen, bedoeld in het eerste of tweede lid, niet of in onvoldoende mate zijn
      getroffen, kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de
      motivering wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.94a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.94a
