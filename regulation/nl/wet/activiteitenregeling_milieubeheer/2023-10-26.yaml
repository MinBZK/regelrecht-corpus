  - number: '3.67'
    text: |-
      1 Een mestbassin is voorzien van een afdekking die is aangebracht op of in het bassin, aansluitend of, in het
      geval van een drijvende afdekking, nagenoeg aansluitend tegen de rand van het mestbassin en boven de drijfmest of
      het digestaat.

      2 Het eerste lid is niet van toepassing op een mestkelder.

      3 Het eerste lid is niet van toepassing op een ondergronds mestbassin, niet zijnde een mestkelder, indien dit
      bassin volledig is afgedekt door een gesloten constructie die als vloer kan fungeren.

      4 Het eerste tot en met derde lid zijn tot 1 januari 2018 niet van toepassing op een mestbassin dat is opgericht
      voor 1 juni 1987.

      5 In het geval, bedoeld in het vierde lid, wordt het mestbassin, zolang het niet is voorzien van een afdekking:

      a. uitsluitend op of nabij de onderkant van het mestbassin gevuld, en

      b. doelmatig gevuld, maar niet verder dan 0,20 meter onder de rand.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.67
  - number: '3.68'
    text: |-
      1 Een mestbassin en de afdekking ervan worden aangelegd overeenkomstig paragraaf 5.5 en de hoofdstukken 6 en 7 van
      BRL 2342.

      2 Een mestbassin, niet zijnde een ondergronds mestbassin, en de afdekking ervan zijn voorzien van een
      kwaliteitsverklaring mestbassin, waaruit blijkt dat het mestbassin en de afdekking zijn uitgevoerd overeenkomstig
      BRL 2342 en wat de referentieperiode mestbassins is. De kwaliteitsverklaring mestbassin is binnen de inrichting
      aanwezig.

      3 Een mestbassin dat, of een afdekking die visueel waarneembaar lek is of in een slechte staat verkeert, wordt
      terstond gerepareerd.

      4 In afwijking van het eerste tot en met het derde lid zijn een mestbassin en een afdekking die zijn opgericht voor
      1 januari 2013 uitgevoerd overeenkomstig de eisen die op het moment van oprichten van toepassing waren op grond van
      een vergunning dan wel het [Besluit akkerbouwbedrijven milieubeheer][ref1], het [Besluit mestbassins][ref2], het
      [Besluit landbouw milieubeheer][ref3] of het [Besluit melkrundveehouderijen milieubeheer][ref4].

      5 Een mestbassin en een afdekking als bedoeld in het vierde lid zijn voorzien van een door de installateur
      verstrekte verklaring waaruit blijkt dat het mestbassin en de afdekking zijn uitgevoerd overeenkomstig de eisen,
      bedoeld in het vierde lid, en welke referentieperiode mestbassins van toepassing is.

      6 Indien in de verklaring, bedoeld in het vijfde lid, geen referentieperiode mestbassins is vermeld, geldt gerekend
      van het moment van aanleg van het mestbassin de volgende referentieperiode mestbassins:

      a. 20 jaar voor een houten, betonnen of gemetseld mestbassin en betonnen afdekking;

      b. 10 jaar voor een metalen mestbassin en afdekking;

      c. 5 jaar voor een mestzak of een foliebassin;

      d. 5 jaar voor de taludbescherming van een foliebassin, of

      e. 10 jaar voor overige typen mestbassins en afdekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006449
