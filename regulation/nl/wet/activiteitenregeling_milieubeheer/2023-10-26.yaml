        afdeling: '5.7'
  - number: '5.83'
    text: |-
      In geval de aflevering van LPG plaatsvindt door middel van een LPG-afleverautomaat verkeert de in bedrijf gestelde
      LPG-afleverinstallatie in een zodanige toestand dat:

      a. indien er geen LPG wordt afgeleverd:

      1°. de op afstand bedienbare afsluiters zijn gesloten;

      2°. de pompmotor van het elektrische net is afgekoppeld;

      3°. de identificatie- en registratievoorziening voor gebruik gereed is;

      4°. de noodknop voor gebruik gereed is, en

      5°. de beveiligingsvoorzieningen voor gebruik gereed zijn;

      b. tijdens het afleveren van LPG:

      1°. de identificatie- en registratievoorziening zijn geactiveerd;

      2°. de op afstand bedienbare afsluiters zijn geopend;

      3°. de dodemansknop, als bedoeld in voorschrift 2.4.8 van PGS 16 is ingedrukt;

      4°. de pompmotor aan het elektrische net is gekoppeld;

      5°. de noodknop en de oproepinstallatie voor gebruik gereed zijn, en

      6°. de beveiligingsvoorzieningen voor gebruik gereed zijn;

      c. indien zich in het LPG-tankstation een incident of calamiteit voordoet:

      1°. de LPG-afleverinstallatie automatisch buiten bedrijf wordt gesteld en vergrendeld indien de automatisch
      werkende beveiligingsvoorzieningen zijn geactiveerd;

      2°. de LPG-afleverinstallatie automatisch buiten bedrijf wordt gesteld en vergrendeld indien de noodknop wordt
      bediend;

      3°. de indicatie van het buiten bedrijf of defect zijn van de LPG-afleverinstallatie voor de afnemer duidelijk
      zichtbaar wordt;

      4°. degene die een LPG-tankstation drijft of de toezichthoudende persoon, als bedoeld in
      [artikel 5.67, eerste lid][ref1], automatisch en in elk geval akoestisch wordt gealarmeerd wanneer de noodknop
      is bediend of de temperatuurgevoelige elementen in de panelen van de afleverzuil of de beveiliging tegen het niet
      gesloten zijn van de op afstand bedienbare afsluiters is geactiveerd, en

      5°. degene die een LPG-tankstation drijft of de toezichthoudende persoon kan worden gewaarschuwd door middel van
      de oproepinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.67
