  - number: '5.39'
    text: |-
      Ten behoeve van het verminderen van de emissie van benzinedamp naar de lucht als bedoeld in
      [artikel 5.53 van het besluit][ref1] wordt voldaan aan de [artikelen 5.40 tot en met 5.44][ref2].


