  - number: '3.92'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen dan wel voor zover
      dat niet mogelijk is het zoveel mogelijk beperken van de verontreiniging van het grondwater als bedoeld in
      [artikel 3.94, onder a en b, van het besluit][ref1] wordt bij het aanmaken of het transporteren via vaste leidingen
      van gewasbeschermingsmiddelen, biociden of bladmeststoffen ten minste voldaan aan het tweede tot en met vijfde lid.

      2 Vaste leidingen voor het transport van gewasbeschermingsmiddelen, biociden of bladmeststoffen of een oplossing
      daarvan, worden bovengronds gelegd.

      3 Mengsels of oplossingen van gewasbeschermingsmiddelen, biociden of bladmeststoffen worden aangemaakt in en vanuit
      speciaal daartoe bestemd vaatwerk.

      4 Het binnen een inrichting aanmaken van mengsels en oplossingen als bedoeld in het derde lid vindt plaats boven
      een bodembeschermende voorziening.

      5 Gemorste droge gewasbeschermingsmiddelen, biociden of bladmeststoffen worden terstond droog opgenomen en gemorste
      vloeibare gewasbeschermingsmiddelen, biociden of bladmeststoffen worden terstond geïmmobiliseerd en in een speciaal
      daartoe bestemd vat gebracht. Daartoe zijn voldoende materialen en absorberende middelen voor onmiddellijk gebruik
      aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.94
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.92
