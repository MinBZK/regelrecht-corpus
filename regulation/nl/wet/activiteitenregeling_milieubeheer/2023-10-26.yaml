        artikel: '4.55'
  - number: '4.67'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden bij het reinigen, lijmen en coaten van
      metalen het verwerken van lakken, verdunners en lijmen alsmede het coaten van metalen, het chemisch ontlakken en
      het reinigen van metalen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.67
  - number: '4.68'
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden stof en dampen die
      vrijkomen bij het aanbrengen van een emailleer- en een keramieklaag op metalen, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden stof en dampen
      die vrijkomen bij het aanbrengen van een metaallaag op metalen door middel van vlamspuiten en thermisch spuiten,
      doelmatig aan de bron afgezogen.

      3 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, vindt het schooperen plaats
      in een daarvoor bestemde en ingerichte gesloten kast, cabine of ruimte waar onderdruk heerst en optimale afzuiging
      plaatsvindt.

      4 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden emissies als bedoeld in het
      tweede en derde lid die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen
      50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.

      5 Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het vierde lid.

      6 Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder, worden de
      overeenkomstig het eerste lid afgezogen gassen en dampen, die op de buitenlucht worden geëmitteerd:

      a. ten minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd;
      of

      b. geleid door een doelmatige ontgeuringsinstallatie.

      7 Het zesde lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.

      8 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege slecht
      functioneren van de ontgeuringsinstallatie, vanwege onvoldoende verspreiding van afgezogen dampen, vanwege
      geuremissies die niet via de afzuiging worden afgevoerd of vanwege incidentele geurpieken in aanvulling op het
      vijfde lid overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref1] maatwerkvoorschriften stellen met
      betrekking tot:

      a. de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het zesde lid;

      b. de situering van de afvoerpijp;

      c. het voorkomen of beperken van diffuse geuremissies; of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      9 In afwijking van het zesde lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het achtste lid onvoldoende zijn om de overschrijding ongedaan te maken
      overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref2] maatwerkvoorschriften stellen met betrekking tot de
      aanwezigheid van een ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.

      10 Indien vanwege de omvang van het te bewerken object, als bedoeld in
      [artikel 4.57, tweede lid, van het besluit][ref3], het schooperen in de buitenlucht plaatsvindt worden emissies van
      stof die vrijkomen bij het schooperen van metalen in de buitenlucht, voorkomen, dan wel beperkt door het aanbrengen
      van doelmatige geheel gesloten omkappingen om het te behandelen werkstuk. Een omkapping bestaat uit doek, zeil of
      een ander stofdicht materiaal.

      11 Ten behoeve van het zoveel mogelijk voorkomen, dan wel tot een aanvaardbaar niveau beperken van stofhinder
      vanwege het in de buitenlucht schooperen van metalen kan het bevoegd gezag maatwerkvoorschriften stellen, ter
      uitwerking van het tiende lid.

      12 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref4], is het
      vierde lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref5] nodig is en voor zover de emissies als bedoeld in het vierde lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      13 In afwijking van het twaalfde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het vijfde lid
      stellen.

      14 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref6], is het
      zesde lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref7] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      15 In afwijking van het veertiende lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het achtste en
      negende lid stellen.


