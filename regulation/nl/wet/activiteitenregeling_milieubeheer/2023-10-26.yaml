                    na het eerste jaar:
                    – indien een monster aan de grenswaarden, bedoeld in artikel 3.5e, vierde lid, van het besluit
      voldoet: 4 per jaar
                    – indien een monster niet aan de grenswaarden, bedoeld in artikel 3.5e, vierde lid, van het besluit
      voldoet: 12 per jaar in het daarop volgende jaar




