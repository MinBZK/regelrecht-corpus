  - number: 3.4p
    text: |-
      1 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij een stof uit categorie A
      vrijkomt is [artikel 3.4o][ref1] van overeenkomstige toepassing.

      2 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij smeltslakgrit of mineraal
      straalmiddel wordt gebruikt, wordt de hulpconstructie als bedoeld in [artikel 3.4o][ref2] ook aan de bovenzijde
      afgesloten.

      3 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek, waarbij een stof uit categorie
      B vrijkomt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C2-techniek waarbij een stof uit
      categorie B wordt gebruikt, worden de zijwanden en de bovenzijde als bedoeld in het tweede lid, vloeistofdicht
      uitgevoerd.

      4 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij een stof uit categorie
      C vrijkomt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C2-techniek waarbij een stof uit
      categorie C wordt gebruikt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C3-techniek waarbij
      een stof uit categorie B wordt gebruikt, wordt in aanvulling op het derde lid tijdens de werkzaamheden gezorgd voor
      een permanente onderdruk in de hulpconstructie. In de daarbij geëmitteerde lucht bedraagt het stofgehalte niet meer
      dan 10 mg/Nm3, bepaald volgens NEN-EN 13284-1.

      5 Bij het uitvoeren van handelingen als bedoeld in het vierde lid kan tot en met 31 december 2020 NEN-ISO
      9096:2003+C1:2007: Emissie van stationaire bronnen – Bepaling van de concentratie aan vaste deeltjes, worden
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4o
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4o
