      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat
      niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het onderhouden en repareren van motoren, motorvoertuigen,
      spoorvoertuigen en andere gemotoriseerde apparaten en het proefdraaien van verbrandingsmotoren bij het werken met
      gevaarlijke stoffen ten minste aan het tweede en derde lid voldaan.

      2 Werkzaamheden waarbij vuur wordt gebruikt, worden niet verricht aan of in de onmiddellijke nabijheid van een
      brandstofreservoir of andere delen van een motor die brandstof bevatten. De brandstofreservoirs zijn, behoudens
      tijdens de aan de reservoirs te verrichten werkzaamheden, goed gesloten.

      3 Aan een tankwagen worden geen werkzaamheden verricht alvorens de zekerheid is verkregen dat geen gevaarlijke
      stoffen of brandbare vloeistoffen in de opslagtank aanwezig zijn.

      4 Het derde lid is niet van toepassing op de uitvoering van noodreparaties, mits:

      a. reparaties niet worden uitgevoerd aan de opslagtank zelf; en

      b. vooraf het bevoegd gezag en de brandweer zijn geïnformeerd over de soort gevaarlijke stof die in de opslagtank
      is opgeslagen en de eigenschappen ervan.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.95
  - number: '4.96'
    text: |-
      1 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden ten minste afgezogen dampen en
      gassen van een ruimte waarin vanwege onderhoud of reparatie van motoren, motorvoertuigen, spoorvoertuigen of andere
      gemotoriseerde apparaten, verbrandingsmotoren worden proefgedraaid, bovendaks afgevoerd, indien binnen 50 meter van
      een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op
      een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.

      2 Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, als bedoeld in het eerste lid.

      3 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref1], is het
      eerste lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref2] nodig is en voor zover de emissies als bedoeld in het eerste lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      4 In afwijking van het derde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het tweede lid stellen.


