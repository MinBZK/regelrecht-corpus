  - number: '4.113'
    text: |-
      1 Aan [artikel 4.119 van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen emissies die vrijkomen bij crematieprocessen worden gevoerd door een adsorptiemedium en filtrerende
      afscheider, welke combinatie geschikt is om aan [artikel 4.119 van het besluit][ref2] te voldoen; en

      b. het adsorptiemedium en filtrerende afscheider in goede staat van onderhoud verkeren, periodiek worden
      gecontroleerd en zo vaak als voor de goede werking nodig is, worden schoongemaakt en vervangen.

      2 Bij het ontwerp, de uitvoering en het onderhoud van het adsorptiemedium en de filtrerende afscheider, bedoeld
      in het eerste lid, is rekening gehouden met het voorkomen van dioxine- en furanenvorming in het filter, en het
      afvangen van de eventueel in de afgassen aanwezige dioxinen en furanen.

      3 Het afgevangen stof uit de filtrerende afscheider mag niet als crematie-as worden behandeld, maar wordt afgegeven
      aan een daartoe erkende inzamelaar.

      4 Bij de berekening van een emissieconcentratie wordt deze betrokken op een zuurstofgehalte van 11% onder
      normaalcondities en voor droog rookgas.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.119
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.119
