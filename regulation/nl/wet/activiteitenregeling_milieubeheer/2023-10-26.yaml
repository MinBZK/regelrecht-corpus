  - number: '2.12'
    text: |-
      1 Bij continue metingen is aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29, eerste lid, van het besluit][ref1], voldaan indien onder normale
      bedrijfsomstandigheden:

      a. het 24-uursgemiddelde voor een bepaalde stof de daarvoor geldende emissiegrenswaarde niet overschrijdt,
      waarbij het 24-uursgemiddelde wordt berekend van alle geldige metingen gedurende een periode van 24 uur waarin
      een oplosmiddeleninstallatie onder normale omstandigheden in bedrijf is, met uitzondering van het opstarten en
      stilleggen van de installatie en het onderhoud van de apparatuur, en

      b. geen van de uurgemiddelden hoger is dan 1,5 maal de emissiegrenswaarden.

      2 Bij periodieke metingen is aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29, eerste lid, van het besluit][ref2], voldaan indien bij die meting:

      a. het gemiddelde van alle meetresultaten onder normale omstandigheden de emissiegrenswaarden niet overschrijdt, en

      b. geen van de uurgemiddelden onder normale omstandigheden hoger is dan 1,5 maal de emissiegrenswaarden.

      3 Of aan de emissiegrenswaarden, bedoeld in [artikel 2.30, tweede lid, van het besluit][ref3] wordt voldaan,
      wordt vastgesteld op basis van de som van de massaconcentraties van de verschillende betrokken vluchtige
      organische stoffen. Of aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29, eerste lid, van het besluit][ref4] wordt voldaan, wordt vastgesteld
      op basis van de totale massa organische koolstof die wordt uitgestoten, tenzij in tabel 2.28a van het besluit
      anders is bepaald.

      4 Gasvolumes mogen worden toegevoegd om de afgassen af te koelen of te verdunnen indien dit technisch
      gerechtvaardigd is. De toegevoegde gasvolumes worden niet betrokken bij het vaststellen van de massaconcentratie
      van de verontreinigende stof in het afgas.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.29
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.29
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.30
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2.29
