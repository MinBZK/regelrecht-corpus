  - number: '3.44'
    text: |-
      1 Voor de toepassing van [paragraaf 3.4.3. van het besluit][ref1] en de [artikelen 3.42][ref2] en [3.43][ref3]
      worden als goederen waaruit vloeibare bodembedreigende stoffen kunnen lekken, in ieder geval aangemerkt:

      a. nat afval van het vegen van openbare straten en terreinen, markten en evenementen;

      b. nat afval van het legen van openbare afvalbakken en het opruimen van stranden;

      c. afval van het reinigen van havens, kanalen, sloten, grachten en vijvers;

      d. afval van het reinigen van riolen, kolken en gemalen;

      e. autowrakken of wrakken van tweewielige motorvoertuigen die vloeistoffen bevatten;

      f. onderdelen van autowrakken of wrakken van tweewielige motorvoertuigen die vloeistoffen bevatten;

      g. van buiten de inrichting afkomstige grond of baggerspecie waarvan de kwaliteit niet is vastgesteld op grond van
      [artikel 38 van het Besluit bodemkwaliteit][ref4];

      h. van buiten de inrichting afkomstige grond of baggerspecie waarvan de kwaliteit de waarden, bedoeld in de
      [artikelen 59][ref5] en [60, van het Besluit bodemkwaliteit][ref6] overschrijdt, tenzij die ter plaatse van de
      opslag voldoet aan [artikel 52 van dat besluit][ref7];

      i. afgedankte elektrische en elektronische apparatuur, waaruit vloeibare bodembedreigende
      stoffen kunnen lekken, uitgezonderd de apparatuur van particuliere huishoudens, bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Regeling afgedankte elektrische en elektronische apparatuur][ref8] die
      overeenkomstig de [artikelen 4][ref9] en [5][ref10] van die regeling is ingenomen;

      j. metalen met aanhangende olie of emulsie voorafgaand aan en tijdens scheiding;

      k. gebruikte oliefilters, oliehoudende poetsdoeken en gebruikt absorptiemateriaal;

      l. gebruikte oliedrukkabels;

      m. beschadigde transformatoren en uitgelekte transformatoren;

      n. beschadigde oliehoudende apparaten;

      o. betonproducten in bekisting, waaruit ontkistingsmiddelen kunnen lekken.

      2 Voor de toepassing van [artikel 3.43][ref11] worden onder goederen waaruit een significante hoeveelheid
      bodembedreigende stoffen kunnen uitlogen, in ieder geval verstaan:

      a. IBC-bouwstoffen als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref12];

      b. metalen met aanhangende olie of emulsie resterende na afscheiden van de olie of emulsie door centrifugeren of
      48 uur uitlekken;

      c. andere metalen dan aluminium, ijzer en roestvrij staal;

      d. teerhoudend dakafval;

      e. composieten van teerhoudend dakafval;

      f. dakgrind verkleefd met teer;

      g. strooizout;

      h. teerhoudend asfalt;

      i. straalgrit;

      j. geshredderd B- en C-hout;

      k. C-hout zonder KOMO-certificaat;

      l. gebruikte gepantserde papier-loodkabels;

      m. gebruikte papiergeïsoleerde grondkabels;

      n. droog afval van het vegen van openbare straten en terreinen, markten en evenementen;

      o. droog afval van het legen van openbare afvalbakken en het opruimen van stranden;

      p. restafval waarin vaste bodembedreigende stoffen die in een significante hoeveelheid kunnen uitlogen, kan
      voorkomen, tenzij toepassing is gegeven aan [artikel 2.14b van het besluit][ref13] of anderszins is geborgd dat
      dit deze stoffen niet bevat.


