  - number: 4.19a
    text: |-
      1 De [artikelen 4.13 tot en met 4.19][ref1] zijn niet van toepassing op het opslaan van vloeibare kunstmeststoffen
      in een bovengrondse opslagtank, dat plaatsvindt voor agrarische activiteiten.

      2 Het opslaan van vloeibare kunstmeststoffen in een bovengrondse opslagtank dat plaatsvindt voor agrarische
      activiteiten voldoet aan [artikel 4.19b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4.13
