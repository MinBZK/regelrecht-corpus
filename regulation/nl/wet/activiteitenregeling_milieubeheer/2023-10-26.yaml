  - number: 3.14b
    text: |-
      1 Ten behoeve van het akoestisch onderzoek, bedoeld in [artikel 3.14a][ref1], wordt bij de bepaling van de
      geluidsbelasting van een windturbine of een combinatie van windturbines rekening gehouden met:

      a. de over een kalenderjaar energetisch gemiddelde bronsterkte volgens de methode, bedoeld in hoofdstuk 3 van
      [bijlage 4][ref2], en met gebruikmaking van het door het KNMI aangeleverde langjarig gemiddelde windprofiel op
      ashoogte, tenzij wordt aangetoond dat gegevens beschikbaar zijn die een beter beeld geven van de geluidsemissie van
      de windturbine of een combinatie van windturbines;

      b. de invloed van de omgeving en de meteorologische omstandigheden op de geluidsoverdracht van de windturbine of
      een combinatie van windturbines naar het immissiepunt.

      2 Indien de vaststelling van de geluidsbelasting vanwege een windturbine of een combinatie van windturbines
      plaatsvindt op de gevel van een gevoelig gebouw, bevindt het immissiepunt zich op het punt van de gevel, waar de
      geluidsbelasting het hoogst is.

      3 Indien de vaststelling van de geluidsbelasting vanwege een windturbine of een combinatie van windturbines
      plaatsvindt op de grens van een gevoelig terrein, bevindt het immissiepunt zich op het punt van de grens waar de
      geluidsbelasting het hoogst is.

      4 Indien de geluidsbelasting van een windturbine of een combinatie van windturbines met andere geluidsbronnen wordt
      berekend, wordt de rekenregel, bedoeld in hoofdstuk 4 van [bijlage 4][ref3], toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.14a
      [ref2]: https://wetten.overheid.nl/BWBR0022830
      [ref3]: https://wetten.overheid.nl/BWBR0022830
