      1 [Artikel 2.11 van het besluit][ref1] is niet van toepassing op het opslaan van grond en baggerspecie als bedoeld
      in [artikel 35 van het Besluit bodemkwaliteit,][ref2] voor zover het opslaan van grond en baggerspecie binnen de
      inrichting eenmalig plaatsvindt.

      2 Het eerste lid van [artikel 2.11 van het besluit][ref3] is niet van toepassing op het opslaan van grond en
      baggerspecie als bedoeld in [artikel 35 van het Besluit bodemkwaliteit][ref4], voor zover het opslaan van grond en
      baggerspecie binnen de inrichting vaker dan eenmalig plaatsvindt.


