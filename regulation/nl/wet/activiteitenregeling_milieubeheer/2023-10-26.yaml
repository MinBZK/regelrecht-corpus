  - number: 3.27c
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.26a, onderdeel c, van het besluit][ref1] vindt:

      a. het opslaan van autowrakken voorafgaand aan het demonteren, en

      b. het aftappen van vloeistoffen en het demonteren van vloeistof bevattende onderdelen bij het demonteren van
      autowrakken,

      plaats boven een vloeistofdichte vloer of verharding.

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.26a, onderdeel c, van het besluit][ref2] vindt:

      a. het opslaan van wrakken van tweewielige motorvoertuigen voorafgaand aan het demonteren plaats boven een
      vloeistofdichte vloer of verharding, en

      b. het aftappen van vloeistoffen en het demonteren van vloeistof bevattende onderdelen bij het demonteren van
      wrakken van tweewielige motorvoertuigen plaats boven een bodembeschermende voorziening.

      3 Onderdeel a van het eerste en tweede lid, is niet van toepassing op het opslaan, bedoeld in dat onderdeel,
      indien:

      a. de wrakken bij ontvangst worden geïnspecteerd op lekkage van vloeibare bodembedreigende stoffen,

      b. de wrakken of onderdelen van wrakken waaruit vloeibare bodembedreigende stoffen lekken, worden opgeslagen boven
      een vloeistofdichte vloer of verharding of boven een lekbak,

      c. het opslaan van wrakken waaruit vloeibare bodembedreigende stoffen lekken, plaatsvindt boven een lekbak als
      bedoeld in onderdeel b en de vloeibare bodembedreigende stoffen in afwijking van [artikel 3.27d, tweede lid][ref3],
      uiterlijk binnen 24 uur na ontvangst van het wrak van het tweewielige motorvoertuig zijn afgetapt, en

      d. de wrakken waaruit geen vloeibare bodembedreigende stoffen lekken, worden opgeslagen boven een bodembeschermende
      voorziening.


