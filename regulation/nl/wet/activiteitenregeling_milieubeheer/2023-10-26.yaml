  - number: '3.1'
    text: |-
      Ter beperking van de nadelige gevolgen voor het milieu als bedoeld in
      [artikel 3.5, tweede lid, van het besluit][ref1] wordt het huishoudelijk afvalwater bij lozing in de bodem geleid
      door een infiltratievoorziening die zodanig wordt uitgevoerd en onderhouden, dat:

      a. het vanuit de zuiveringsvoorziening geloosde water in de infiltratievoorziening niet in direct contact met het
      grondwater komt,

      b. de infiltratievoorziening geen hinder veroorzaakt, en

      c. nadelige gevolgen voor de volksgezondheid worden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.5'
  - number: '3.2'
    text: |-
      Ter beperking van de nadelige gevolgen voor het milieu als bedoeld in
      [artikel 3.5, derde lid, van het besluit][ref1] wordt het huishoudelijk afvalwater geleid door een
      zuiveringsvoorziening die voldoet aan het bepaalde in de [artikelen 3.3][ref2] en [3.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3.3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.2
