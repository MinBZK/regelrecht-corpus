  - number: '5.45'
    text: |-
      Ten behoeve van het verminderen van de emissie van benzinedamp naar de lucht als bedoeld in de
      [artikelen 5.62][ref1] en [5.63 van het besluit][ref2] wordt voldaan aan de [artikelen 5.46 tot en met 5.54][ref3].


