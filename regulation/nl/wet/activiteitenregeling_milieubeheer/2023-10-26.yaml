  - number: '2.3'
    text: |-
      1 Dit artikel is slechts van toepassing indien binnen de inrichting een vloeistofkerende voorziening is toegepast
      als bodembeschermende voorziening, tenzij in deze regeling anders is bepaald.

      2 De controle, het onderhoud en het beheer van bodembeschermende voorzieningen wordt in eenduidige bedrijfsinterne
      procedures en werkinstructies ter bescherming van de bodem vastgelegd.

      3 In de bedrijfsinterne procedures en werkinstructies als bedoeld in het tweede lid is ten minste aangegeven op
      welke wijze:

      a. de staat en goede werking van bodembeschermende voorzieningen, verpakkingen en apparatuur waarin vloeibare
      bodembedreigende stoffen worden opgeslagen of getransporteerd, wordt gecontroleerd;

      b. er voor zorg wordt gedragen dat zo vaak als de omstandigheden daarom vragen inspecties op morsingen en lekkages
      plaatsvinden, en

      c. is gewaarborgd dat gemorste of gelekte stoffen direct worden opgeruimd.

      4 Degene die de inrichting drijft draagt er zorg voor dat de medewerkers die binnen de inrichting bodembedreigende
      activiteiten verrichten, op de hoogte zijn van de bedrijfsinterne procedures en werkinstructies als bedoeld in
      het tweede lid, dat deze worden nageleefd en binnen de inrichting zodanig aanwezig zijn dat een ieder daarvan op
      eenvoudige wijze kennis kan nemen.

      5 De controle, het onderhoud en het beheer van bodembeschermende voorzieningen vinden zodanig plaats dat
      vrijgekomen stoffen zijn verwijderd voordat deze in de bodem kunnen geraken.

      6 Morsingen en lekkages worden overeenkomstig de bedrijfsinterne procedures en werkinstructies als bedoeld in het
      tweede lid, verholpen en opgeruimd.

      7 Degene die de inrichting drijft draagt er zorg voor dat de in het kader van de bedrijfsinterne procedures en
      werkinstructies noodzakelijke absorptiemiddelen en andere materialen en middelen ter bescherming van de bodem
      binnen de inrichting in voldoende mate aanwezig zijn en dat er voldoende, in het gebruik van deze middelen,
      geïnstrueerd personeel aanwezig is.

      8 Bevindingen van controles van of onderhoud aan bodembeschermende voorzieningen, alsmede acties genomen na
      incidenten met bodembedreigende stoffen, die mogelijk hebben geleid tot een bodemverontreiniging, worden opgenomen
      in een logboek dat te allen tijde beschikbaar is voor het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel2.3
  - number: '2.4'
    text: |-
      1 Een bodembeschermende voorziening is zodanig uitgevoerd dat:

      a. gemorste of gelekte vloeibare bodembedreigende vloeistoffen effectief worden opgevangen en kunnen worden
      opgeruimd;

      b. er geen hemelwater op of in terecht kan komen, tenzij het hemelwater regelmatig van of uit de voorziening wordt
      verwijderd.

      2 Een bodembeschermende voorziening is bestand tegen de inwerking van de desbetreffende vloeibare bodembedreigende
      stoffen en de condities waaronder deze stoffen worden gebruikt of opgeslagen.

      3 Een lekbak waarin vloeibare bodembedreigende stoffen in verpakking of in een opslagtank wordt opgeslagen, heeft
      een opvangcapaciteit van ten minste 110% van de inhoud van de grootste verpakkingseenheid of opslagtank, met dien
      verstande dat de opvangcapaciteit ten minste 10% is van de inhoud van alle opgeslagen stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel2.4
  - number: '2.5'
    text: |-
      De bij deze regeling gestelde regels, die tot doel hebben te voldoen aan een verwaarloosbaar bodemrisico,
      zijn niet van toepassing op een bodembedreigende activiteit waarvoor het bevoegd gezag op grond van
      [artikel 2.9a van het besluit][ref1] met een maatwerkvoorschrift heeft bepaald dat een aanvaardbaar bodemrisico kan
      worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.9a
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel2.5
