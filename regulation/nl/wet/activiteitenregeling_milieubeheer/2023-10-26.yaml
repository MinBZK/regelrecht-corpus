  - number: '4.114'
    text: |-
      1 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de
      belasting van de bodem wordt bij het verstrooien van crematie-as op een strooiveld voldaan aan het tweede tot en
      met het negende lid.

      2 Verstrooiing van crematie-as geschiedt gelijkmatig en zodanig dat de as niet door verwaaiing buiten het terrein
      van de inrichting of het strooiveld terechtkomt of terecht kan komen.

      3 Indien er meer dan 90 maar minder dan 370 verstrooiingen per hectare per jaar plaatsvinden, worden de volgende
      maatregelen getroffen:

      a. het onderzoek naar de bodemkwaliteit, bedoeld in [artikel 2.11, eerste lid, van het besluit][ref1], vindt tevens
      plaats voordat een strooiveld in gebruik wordt genomen. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden nadat het strooiveld in gebruik is genomen, toegestuurd aan het bevoegd gezag;

      b. onverminderd [artikel 2.11, tweede en derde lid, van het besluit][ref2], wordt ten minste eenmaal per 25 jaar
      de bodemkwaliteit ter plaatse van het strooiveld bepaald. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden na uitvoering van het onderzoek toegestuurd aan het bevoegd gezag;

      c. de immissie van fosfaat naar de bodem wordt bepaald door middel van uitloogproeven. Deze proeven worden
      uitgevoerd op een representatief bodemmonster van het strooiveld. Deze bepaling wordt uiterlijk binnen drie maanden
      na oprichting van het strooiveld en daarna telkens tenminste eenmaal per 25 jaar verricht. De immissie is niet
      hoger dan 1.000 milligram per vierkante meter per jaar.

      4 Indien er meer dan 370 verstrooiingen per hectare per jaar plaatsvinden, worden de volgende maatregelen
      getroffen:

      a. het onderzoek naar de bodemkwaliteit, bedoeld in [artikel 2.11, eerste lid, van het besluit][ref3], vindt tevens
      plaats voordat een strooiveld in gebruik wordt genomen. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden nadat het strooiveld in gebruik is genomen, toegestuurd aan het bevoegd gezag;

      b. onverminderd [artikel 2.11, tweede en derde lid, van het besluit][ref4], wordt ten minste eenmaal per vijf jaar
      de bodemkwaliteit ter plaatse van het strooiveld bepaald. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden na uitvoering van het onderzoek toegestuurd aan het bevoegd gezag;

      c. de immissie van fosfaat naar de bodem wordt bepaald door middel van uitloogproeven. Deze proeven worden
      uitgevoerd op een representatief bodemmonster van het strooiveld. Deze bepaling wordt uiterlijk binnen drie maanden
      na oprichting van het strooiveld en daarna telkens tenminste eenmaal per vijf jaar verricht. De immissie is niet
      hoger dan 1.000 milligram per vierkante meter per jaar.

      5 Indien er meer dan 3200 verstrooiingen per hectare per jaar plaatsvinden, kan het bevoegd gezag
      maatwerkvoorschriften stellen ten aanzien van het voorkomen dan wel zoveel mogelijk beperken van de belasting van
      de bodem.

      6 De onderzoeken en rapporten, bedoeld in het derde en het vierde lid, worden uitgevoerd onderscheidenlijk
      opgesteld door een persoon of een instelling die daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref5].

      7 De bepaling van de onderzoeksstrategie bij de bepaling van de bodemkwaliteit, bedoeld in het derde en het vierde
      lid, gebeurt conform NEN 5740.

      8 Indien uit rapporten als bedoeld in het derde en het vierde lid blijkt dat de belasting van de bodem
      is toegenomen ten opzichte van de eerder vastgestelde kwaliteit van de bodem wordt overeenkomstig
      [artikel 2.11, vijfde lid, van het besluit][ref6], de bodemkwaliteit hersteld.

      9 Bij het gebruik van wisselvelden kan het bevoegd gezag bij maatwerkvoorschrift in afwijking van het derde lid,
      onderdelen b en c, en het vierde lid, onderdelen b en c, een afwijkende onderzoeksfrequentie voorschrijven voor het
      bepalen van de bodemkwaliteit en het bepalen van de immissie van fosfaat.

      10 Voor de toepassing van het derde tot en met het vijfde lid op de verstrooiing van crematie-as van dieren wordt
      de hoeveelheid asresten die vergelijkbaar is met de asresten afkomstig van de crematie van één volwassen mens
      aangemerkt als één verstrooiing.

      11 In afwijking van het derde lid, onderdelen b en c, geldt voor strooivelden die voor 1 januari 2010 in gebruik
      zijn genomen, dat het onderzoek naar de bodemkwaliteit en de bepaling van de immissie van fosfaat naar de bodem
      in ieder geval wordt uitgevoerd binnen 25 jaar nadat het strooiveld in gebruik is genomen, dan wel, indien het
      strooiveld voor 1 januari 1985 in gebruik is genomen, voor 1 juli 2010 en daarna telkens ten minste eenmaal per
      25 jaar.

      12 In afwijking van het vierde lid, onderdelen b en c, geldt voor strooivelden die voor 1 januari 2010 in gebruik
      zijn genomen, dat het onderzoek naar de bodemkwaliteit en de bepaling van de immissie van fosfaat naar de bodem
      in ieder geval wordt uitgevoerd binnen vijf jaar nadat het strooiveld in gebruik is genomen, dan wel, indien het
      strooiveld voor 1 januari 2005 in gebruik is genomen, voor 1 juli 2010 en daarna telkens ten minste eenmaal per
      vijf jaar.


