  - number: 4.20.1
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, wordt bij het opslaan van vloeibare koolzuur, argon, helium of stikstof in een
      bovengrondse stationaire opslagtank met een inhoud van meer dan 300 liter voldaan aan het tweede tot en met het
      vierde lid.

      2 Een opslagtank, bedoeld in het eerste lid, wordt gebruikt volgens de volgende onderdelen van PGS 9:

      a. voorschriften 3.3.1, 3.3.15;

      b. voorschrift 3.11.4;

      c. voorschrift 7.4.5.

      3 De opslagtank, bedoeld in het eerste lid, is geplaatst op minimaal de volgende afstand van de erfgrens:

      a. bij een opslagtank tot en met 10 kubieke meter: 1 meter;

      b. bij een opslagtank van meer dan 10 kubieke meter: 3 meter.

      4 In afwijking van het derde lid, onder b, kan het bevoegd gezag voor een bovengrondse stationaire opslagtank met
      vloeibare koolzuur, argon, helium of stikstof van meer dan 10 kubieke meter bij maatwerkvoorschrift een kleinere
      afstand ten opzichte van de erfscheiding voorschrijven.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.20.1
  - number: 4.20.2
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat
      niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het opslaan van vloeibare zuurstof in een bovengrondse stationaire
      opslagtank met een inhoud van meer dan 300 liter voldaan aan het tweede tot en met het achtste lid.

      2 Een buiten gebruik gestelde stationaire opslagtank wordt druk- en gasvrij gemaakt.

      3 Een opslagtank als bedoeld in het eerste lid wordt geplaatst op een ondergrond die uit onbrandbaar materiaal
      bestaat. Op plaatsen waar kans op verzakking bestaat, is een doelmatige fundering aangebracht. Een eventueel
      aangebrachte fundering of draagconstructie is vervaardigd uit materiaal dat een brand niet onderhoudt.

      4 Een uitpandige bovengrondse stationaire opslagtank met vloeibare zuurstof wordt gebruikt volgens de volgende
      onderdelen van PGS 9:

      a. [paragraaf 3.2][ref1], met uitzondering van [paragraaf 3.2.6][ref2];

      b. voorschriften 3.3.1, 3.3.2, 3.3.3 en 3.3.15;

      c. voorschriften 3.11.4;

      d. voorschriften 4.1.2 en 4.1.5;

      e. voorschrift 7.4.5.

      5 De inpandige stationaire opslagtank met vloeibare zuurstof wordt gebruikt volgens de voorschriften 3.13.3, 3.13.5
      en 3.13.14 van PGS 9.

      6 Het bevoegd gezag kan bij maatwerkvoorschrift andere veiligheidsafstanden vaststellen dan die volgen uit
      het vierde lid, onderdeel a, als een veilige opstelling wordt verkregen door het treffen van bijzondere
      veiligheidsmaatregelen die voldoen aan [paragraaf 3.2.6][ref3] van PGS 9.

      7 In afwijking van het vijfde lid kan het bevoegde gezag bij maatwerkvoorschrift andere eisen stellen aan de
      ondergrond van de opslagruimte.

      8 Het vierde lid, onderdeel a, is niet van toepassing op een bovengrondse stationaire opslagtank met vloeibare
      zuurstof die is geïnstalleerd voor [*1 januari 2017*] als wordt voldaan aan [paragraaf 4.3][ref4], met uitzondering
      van voorschrift 4.3.4.2, en paragraaf 4.4 van de Richtlijn PGS 9:1983 (7-2005), getiteld ‘Vloeibare zuurstof;
      Opslag van 0,45-100 m3’, zoals gepubliceerd op www.publicatiereeksgevaarlijkestoffen.nl.


