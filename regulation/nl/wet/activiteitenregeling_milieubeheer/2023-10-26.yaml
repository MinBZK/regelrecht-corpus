  - number: 4.49b
    text: |-
      Aan [artikel 4.31b, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen stofemissies die vrijkomen bij het wegen of mengen van rubbercompounds worden gevoerd door een
      filtrerende afscheider die geschikt is om aan [artikel 4.31b, eerste lid, van het besluit][ref2] te voldoen, en

      b. die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.31b
