  - number: '4.2'
    text: |-
      De verpakking van gevaarlijke stoffen, gevaarlijke afvalstoffen, vloeibare bodembedreigende stoffen en CMR-
      stoffen tegen normale behandeling bestand en is zodanig dat niets van de inhoud uit de verpakking onvoorzien kan
      ontsnappen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.2
  - number: '4.3'
    text: |-
      1 Gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking worden opgeslagen in een opslagvoorziening die is
      uitgevoerd en wordt gebruikt overeenkomstig de volgende onderdelen van PGS 15:

      a. paragraaf 3.1, met uitzondering van voorschrift 3.1.2;

      b. paragraaf 3.2, met uitzondering van voorschrift 3.2.13;

      c. de voorschriften 3.3.1 tot en met 3.3.3;

      d. de voorschriften 3.4.1 tot en met 3.4.8;

      e. de paragrafen 3.6, 3.7, 3.11 en 3.12;

      f. de voorschriften 3.13.1 en 3.13.2;

      g. voorschrift 3.14.1, en

      h. de paragrafen 3.15, 3.16, 3.18 en 3.19.1.

      2 Het eerste lid is niet van toepassing op:

      a. gevaarlijke stoffen in verpakking van de klassen 1, 4 of 7 van het ADR;

      b. gasflessen, spuitbussen, gaspatronen of aanstekers van de klasse 2 van het ADR;

      c. gevaarlijke stoffen in verpakking van de klasse 6.2 categorie I1 en I2 van het ADR;

      d. gevaarlijke stoffen in verpakking van de klasse 9 van het ADR, met uitzondering van de stoffen met
      classificatiecode M6 of M7 die het aquatisch milieu verontreinigen;

      e. CMR-stoffen, voor zover het metalen in vaste vorm, met uitzondering van poedervormige metalen betreft, of

      f. loodzuuraccu’s.

      3 De opslag van spuitbussen of gaspatronen, die aanwezig zijn als aanverwante stoffen als bedoeld in voorschrift
      3.1.4 van de PGS 15, voldoet aan [artikel 4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.3
    references:
      - id: ref1
