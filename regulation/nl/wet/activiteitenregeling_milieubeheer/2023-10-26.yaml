        bwb_id: BWBR0022762
        artikel: '3.169'
  - number: '4.1'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover
      dat niet mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan als bedoeld in [artikel 4.1, eerste lid, van het besluit][ref1]
      wordt bij de opslag van gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking, niet zijnde
      vuurwerk, andere ontplofbare stoffen, vaste kunstmeststoffen of organische peroxiden als bedoeld in
      [artikel 4a, onder d, van het besluit][ref2], ten minste voldaan aan de [artikelen 4.2 tot en met 4.9b][ref3]
      en [4.10, zesde lid][ref4].

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.1, zevende lid, van het besluit][ref5], wordt bij het opslaan van gevaarlijke stoffen in verpakking,
      vloeibare bodembedreigende stoffen in verpakking, afvalstoffen waaruit vloeibare bodembedreigende stoffen kunnen
      lekken en CMR-stoffen in verpakking, niet zijnde vuurwerk, andere ontplofbare stoffen, vaste kunstmeststoffen,
      of organische peroxiden als bedoeld in [artikel 4a, onder d, van het besluit][ref6], voldaan aan de
      [artikelen 4.2][ref7], [4.9][ref8], [4.9a][ref9], [4.9b][ref10] en [4.10][ref11].

      3 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van
      verontreiniging van het oppervlaktewater als bedoeld in [artikel 4.1, negende lid, van het besluit][ref12] wordt
      bij het boven oppervlaktewater opslaan van gevaarlijke stoffen in verpakking, vloeibare bodembedreigende stoffen
      in verpakking en CMR-stoffen in verpakking, niet zijnde vuurwerk, vaste kunstmeststoffen, organische peroxiden
      als bedoeld in [artikel 4a, onder d, van het besluit][ref13], asbest, gedemonteerde airbags en gordelspanners en
      andere ontplofbare stoffen voldaan aan de [artikelen 4.2][ref14], [4.9][ref15] en [4.10a][ref16].

      4 Van een voldoende brandwerende voorziening als bedoeld in
      [artikel 4.1, derde en vijfde lid, van het besluit][ref17], is in ieder geval sprake indien de wand een
      brandwerendheid van ten minste 60 minuten heeft, een hoogte heeft van twee meter en aan weerszijden van de
      opslagvoorziening een lengte heeft van ten minste twee meter, horizontaal gemeten vanaf de opslagvoorziening.

      5 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.1, zevende lid, van het besluit][ref18], wordt bij het opslaan van vloeibare kunstmeststoffen in
      verpakking in het kader van agrarische activiteiten als bedoeld in artikel 4.1, tiende lid, van het besluit,
      voldaan aan [artikel 4.10b][ref19].


