  - number: '3.104'
    text: |-
      1 Ten behoeve van het voorkomen, dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in de [artikelen 3.135][ref1] en [3.136 van het besluit][ref2]:

      a. wordt bij het slachten van dieren als bedoeld in [artikel 3.133, onder a, van het besluit][ref3] ten minste de
      vaste dierlijke mest die vrijkomt bij het slachten in afgesloten, lekvrije tonnen of bakken opgeslagen;

      b. worden afgezogen dampen en gassen van het broeien of koken van dierlijke bijproducten als bedoeld in
      [artikel 3.133, onder a, van het besluit][ref4], indien deze op de buitenlucht worden geëmitteerd:

      1°. ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen
      afgevoerd; of

      2°. geleid door een doelmatige ontgeuringsinstallatie.

      2 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissie die niet via
      de afzuiging wordt afgevoerd of incidentele geurpieken, in aanvulling op het eerste lid, onder b, overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref5], maatwerkvoorschriften stellen met betrekking tot:

      a. de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het eerste lid, onder b;

      b. de situering van de afvoerpijp;

      c. het voorkomen of beperken van diffuse geuremissies; of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      3 In afwijking van het eerste lid, onder b, kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar
      niveau overschrijdt en de bevoegdheden, bedoeld in het tweede lid, onvoldoende zijn om de overschrijding ongedaan
      te maken, overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref6] maatwerkvoorschriften stellen met
      betrekking tot de aanwezigheid van een ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen
      en gassen.

      4 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref7], is het
      eerste lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref8] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      5 In afwijking van het vierde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het tweede en derde
      lid stellen.


