  - number: '3.99'
    text: |-
      1 In een elektronisch monitoringsysteem als bedoeld in [artikel 3.125, vijfde lid, van het besluit][ref1] worden
      ieder uur de waarden van in ieder geval de volgende parameters geregistreerd:

      a. de zuurgraad van het waswater;

      b. de geleidbaarheid van het waswater in milliSiemens per centimeter;

      c. de spuiwaterproductie in kubieke meter;

      d. de drukval over het filterpakket in pascal;

      e. het elektriciteitsverbruik van de waswaterpomp in kilowatt uur.

      2 Van de parameters, genoemd in het eerste lid, onderdelen c en e, worden tevens de cumulatieve waarden
      geregistreerd.

      3 Het waswater van het luchtwassysteem is voorzien van een laagdebietalarmering die in werking treedt als het
      debiet van het waswater te laag is voor een goede werking van het luchtwassysteem.

      4 De geregistreerde waarden van de parameters worden gedurende ten minste vijf jaar binnen de inrichting bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.125
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.99
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3.125'
  - number: '3.100'
    text: |-
      1 Voor de registratie van de parameters, bedoeld in [artikel 3.125, vijfde lid, van het besluit][ref1] zijn
      doelmatige meetvoorzieningen aanwezig die voldoen aan het tweede tot en met vierde lid.

      2 Voor het meten van de spuiwaterproductie is per spuiwaterstroom in de spuileiding een elektromagnetische
      flowmeter geïnstalleerd.

      3 Ten minste eenmaal per zes maanden worden de EC-elektrode en de pH-elektrode gekalibreerd door een deskundige op
      het gebied van het kalibreren van elektrodes.

      4 Bewijzen van de kalibraties worden gedurende ten minste vijf jaar binnen de inrichting bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.125
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.100
    references:
