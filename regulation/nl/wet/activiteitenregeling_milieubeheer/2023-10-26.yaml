  - number: '5.2'
    text: |-
      1 Metingen ter bepaling van de emissies zijn representatief.

      2 Alle monitoringresultaten worden op zodanige wijze geregistreerd, verwerkt en gepresenteerd, dat het bevoegd
      gezag kan controleren of wordt voldaan aan de toepasselijke emissiegrenswaarden en andere voorschriften.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.2
  - number: '5.3'
    text: |-
      1 De emissieconcentratie van zwaveldioxide (SO), stikstofoxiden (NO), koolmonoxide (CO) en totaal stof van een
      grote stookinstallatie, wordt continu gemeten.

      2 In afwijking van het eerste lid wordt de emissieconcentratie van zwaveldioxide (SO), stikstofoxiden (NO),
      koolmonoxide (CO) en totaal stof van een stookinstallatie met een nominaal thermisch ingangsvermogen van minder dan
      100 MW:

      a. tot en met 16 augustus 2021 periodiek ten minste om de zes maanden gemeten;

      b. met ingang van 17 augustus 2021 periodiek ten minste om de zes maanden gemeten indien uit de geregistreerde
      emissierelevante parameters met een voldoende mate van zekerheid blijkt dat de rookgasreiniging of andere
      emissiereductietechnieken continu in bedrijf zijn en de betreffende emissiegrenswaarden niet worden overschreden.

      3 In afwijking van het eerste en tweede lid wordt de emissieconcentratie van totaal stof periodiek ten minste om de
      zes maanden gemeten, indien een grote stookinstallatie met aardgas wordt gestookt.

      4 In afwijking van het eerste en tweede lid is meting van zwaveldioxide (SO) niet verplicht en wordt de
      emissieconcentratie van zwaveldioxide (SO) bepaald op grond van de gehalten in de ingezette brandstoffen, indien:

      a. een grote stookinstallatie met aardgas wordt gestookt;

      b. een grote stookinstallatie met olie wordt gestookt en er geen uitrusting voor de ontzwaveling van afgas is;

      c. een grote stookinstallatie met biomassa wordt gestookt en de drijver van de inrichting kan aantonen dat die
      emissie in geen geval hoger is dan de toepasselijke emissiegrenswaarde.

      5 De emissieconcentratie kwik (Hg) wordt:

      a. ten minste om de zes maanden gemeten;

      b. bij op steenkool of bruinkool gestookte installaties waarop ingevolge het besluit geen emissiegrenswaarden van
      toepassing zijn, ten minste eens per jaar gemeten.

      6 De emissieconcentraties van ammoniak (NH), zoutzuur (HCl), waterstoffluoride (HF), formaldehyde en totaal
      organisch koolstof (CxHy) worden ten minste eens per jaar gemeten.

      7 In afwijking van het zesde lid wordt de emissieconcentratie van zoutzuur (HCl) ten minste om de zes maanden
      gemeten, indien er biomassa wordt gestookt.

      8 Wanneer procesbrandstoffen gechloreerde componenten bevatten wordt de emissieconcentratie van dioxinen en furanen
      om de zes maanden gemeten. Voor procesgassen waarin geen gechloreerde componenten aanwezig zijn, wordt geacht aan
      de emissiegrenswaarde te zijn voldaan.

      9 De emissieconcentraties in afvalwater afkomstig van de reiniging van afgassen, bedoeld in
      [artikel 5.12b van het besluit][ref1], worden ten minste maandelijks gemeten. Voor onopgeloste stoffen wordt
      gemeten in een steekmonster, voor de andere stoffen in een etmaalmonster. Daarnaast wordt continu het debiet, de pH
      en de temperatuur van het afvalwater gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.12b
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.3
