  - number: '4.84'
    text: |-
      1 Bij het lozen van afvalwater afkomstig van activiteiten in [§ 4.5.1 tot en met § 4.5.11 van het besluit][ref1]
      wordt ter beperking van het lozen van metalen en hulpstoffen ten minste voldaan aan het tweede tot en met het
      vierde lid.

      2 Degene die de inrichting drijft stelt gedragsvoorschriften op die zijn gericht op het voorkomen van nadelige
      gevolgen voor het milieu en een doelmatige afvoer van het bedrijfsafvalwater én draagt ervoor zorg dat de
      gedragsregels worden nageleefd.

      3 In de gedragsvoorschriften wordt ten minste aangegeven:

      a. wanneer en op welke wijze controle van installaties en onderdelen van de inrichting plaatsvindt, waarvan de
      werking van invloed kan zijn op het lozen van metalen en hulpstoffen;

      b. op welke wijze invulling wordt gegeven aan maatregelen die voortkomen uit de preventieve aanpak;

      c. op welke wijze de oversleep wordt beperkt;

      d. op welke wijze mogelijk te nemen procesgeïntegreerde maatregelen op haalbaarheid worden onderzocht en genomen;

      e. hoe wordt omgegaan met procesafvalwater en hoe dit doelmatig wordt verwerkt;

      f. indien ethyleendiaminetetra-acetaat wordt gebruikt, waarom dit noodzakelijk is voor het proces en welke
      maatregelen genomen worden om de emissies ervan te beperken;

      g. indien een chroomlaag elektrolytisch wordt aangebracht met behulp van een oplossing van chroom VI, welke
      maatregelen genomen worden om dit metaal terug te voeren uit het spoelwater naar het procesbad;

      h. indien er wordt gewerkt met cyanide, welke maatregelen genomen worden om cyanide terug te voeren uit het
      spoelwater naar het procesbad;

      i. indien perfluoroctaansulfonaten als hulpstof worden toegepast, welke maatregelen genomen worden om
      perfluoroctaansulfonaten terug te voeren uit het spoelwater naar het procesbad; en

      j. indien cadmium wordt verwerkt, welke maatregelen worden genomen om cadmium terug te voeren uit het spoelwater
      naar het procesbad en op welke wijze het afvalwater dat cadmium kan bevatten, separaat van het overige afvalwater,
      wordt verwerkt.

      4 Het bevoegd gezag kan indien het belang van de bescherming van het milieu daartoe noodzaakt maatwerkvoorschriften
      stellen ten aanzien van de invulling van de gedragsvoorschriften als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Paragraaf4.5.1
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84
    references:
      - id: ref1
        bwb_id: BWBR0022762
        paragraaf: 4.5.1
  - number: 4.84.1
    text: |-
      Ten behoeve van het voorkomen van emissies van dioxines en polycyclische aromatische koolwaterstoffen naar de
      lucht als bedoeld in [artikel 4.74.2, eerste lid, van het besluit][ref1], worden uitsluitend metalen gesmolten die
      voldoen aan de volgende criteria:

      a. het metaal voldoet aan de technische standaarden die gelden voor reguliere toepassing van het metaal;

      b. de soort legering en de verhouding van metalen in de legering is bekend en kan worden aangetoond;

      c. het metaal is zichtbaar vrij van olie, olie-emulsies, smeermiddelen of vet, met uitzondering van verwaarloosbare
      hoeveelheden die geen druppelvorming tot gevolg hebben;

      d. het ingezette materiaal bezit geen van de eigenschappen van bijlage III van de kaderrichtlijn afvalstoffen, met
      dien verstande dat de eigenschappen van het metaal zelf of metalen in de legering zelf niet relevant zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74.2
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84.1
