  - number: '3.106'
    text: |-
      Aan [artikel 3.141, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen stofemissies die vrijkomen bij het vervaardigen en bewerken van voedingsmiddelen of dranken waarbij
      voedingsmiddelen of grondstoffen daarvan worden gedroogd, gemalen, gebrand of geroosterd of waarbij goederen
      behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd, worden gevoerd door een filtrerende afscheider die
      geschikt is om aan [artikel 3.141, eerste lid, van het besluit][ref2] te voldoen; en

      b. die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.141
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.141
