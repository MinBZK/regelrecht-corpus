  - number: 3.7h
    text: |-
      1 Indien de concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), onverbrande koolwaterstoffen (CH,
      uitgedrukt in C) of totaal stof continu worden gemeten, wordt de uitworp tijdens het opstarten en stilleggen van de
      stookinstallatie niet meegerekend bij het bepalen of aan de desbetreffende emissiegrenswaarde wordt voldaan.

      2 Indien de concentratie aan stikstofoxiden (NO), zwaveldioxide (SO), onverbrande koolwaterstoffen (CH, uitgedrukt
      in C) of totaal stof continu wordt gemeten en de stookinstallatie is uitgerust met nageschakelde apparatuur die is
      bedoeld voor het verminderen van de emissie van de genoemde stoffen, wordt de uitworp tijdens perioden als bedoeld
      in [artikel 3.10g van het besluit][ref1], niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.10g
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7h
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 3.10g
  - number: 3.7i
    text: |-
      1 De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden
      worden berekend die getoetst worden aan een emissiegrenswaarde, is bij continue metingen niet groter dan de
      volgende percentages van de emissiegrenswaarde:

      a. zwaveldioxide (SO): 20;

      b. stikstofoxiden (NO): 20;

      c. totaal stof: 30; en

      d. onverbrande koolwaterstoffen (CH, uitgedrukt in C): 20.

      2 Bij continue metingen vindt toetsing aan de emissiegrenswaarden plaats op basis van het gemiddelde van de
      individuele waarnemingen, na aftrek van de waarde van het in het eerste lid bedoelde betrouwbaarheidsinterval.

      3 Indien in een dag meer dan drie uurgemiddelden ongeldig zijn wegens storing of onderhoud van het continu werkende
      meetsysteem, worden de metingen van die dag als ongeldig beschouwd. Indien in enig kalenderjaar de metingen van
      meer dan tien dagen ongeldig zijn, treft degene die de inrichting drijft passende maatregelen om de betrouwbaarheid
      van het continu werkende meetsysteem te verbeteren.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7i
  - number: 3.7j
    text: Van een meting of monstername als bedoeld in deze paragraaf wordt een rapport gemaakt volgens NEN-EN 15259.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7j
  - number: 3.7k
    text: |-
      1 Bij het spuien van een stoomketel van een stookinstallatie zijn ten minste de spuitank dan wel de andere
      geschikte voorziening en de leidingen waardoor het spuiwater wordt geleid bestand tegen de inwerking van het
      spuiwater.

      2 De spuitank, bedoeld in het eerste lid, is voorzien van een ontluchtingsleiding, die zodanig is bemeten, dat het
      bezwijken van de spuiketel door overdruk in de spuitank tijdens het spuien wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7k
  - number: 3.7l
    text: |-
      Het vullen en het legen van een stookinstallatie met vloeibare brandstof vindt plaats boven een bodembeschermende
      voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7l
  - number: 3.7m
    text: |-
      1 Een niet-gasgestookte stookinstallatie met een nominaal thermisch ingangsvermogen van:

      a. 20 kilowatt tot ten hoogste 100 kilowatt, wordt ten minste eenmaal per vier jaar gekeurd op veilig functioneren,
      optimale verbranding en energiezuinigheid;

      b. meer dan 100 kilowatt, wordt ten minste eenmaal per twee jaar gekeurd op veilig functioneren, optimale
      verbranding en energiezuinigheid.

      2 Een gasgestookte stookinstallatie met een nominaal thermisch ingangsvermogen van meer dan 100 kilowatt wordt ten
      minste eenmaal per vier jaar gekeurd op veilig functioneren, optimale verbranding en energiezuinigheid.

      3 Een keuring als bedoeld in het eerste of tweede lid wordt voor de eerste keer uitgevoerd binnen zes weken na
      ingebruikname.

      4 Een keuring als bedoeld in het eerste of tweede lid omvat mede:

      a. de afstelling van de verbranding;

      b. het systeem voor de toevoer van brandstof en verbrandingslucht;

      c. de afvoer van verbrandingsgassen;

      d. een meting van koolmonoxide (CO), gemeten voor de onder a genoemde afstelling, uitgedrukt in mg/Nm, bij een
      zuurstofpercentage zoals aangegeven in [artikel 3.10i, eerste lid, van het besluit][ref1], voor stookinstallaties
      met een nominaal thermisch ingangsvermogen van 1 MWth of meer, met dien verstande dat voor installaties in gebruik
      genomen voor 20 december 2018 deze verplichting geldt:

      1° vanaf 1 januari 2024, indien deze een nominaal thermisch ingangsvermogen van meer dan 5 MWth hebben;

      2° vanaf 1 januari 2029, indien deze een nominaal thermisch ingangsvermogen van 5 MWth of minder hebben.

      5 Aan het vierde lid, onderdeel d, wordt voor stookinstallaties als bedoeld in
      [artikel 3.7, tweede lid, onderdeel b, van het besluit][ref2], geacht te zijn voldaan, indien de drijver
      van de inrichting een meetrapport van de fabrikant kan overleggen van een CO-meting die is uitgevoerd aan de
      stookinstallatie of een stookinstallatie van hetzelfde merk en type, volgens de in het vierde lid, onderdeel d,
      genoemde eisen.

      6 Een keuring als bedoeld in het eerste of tweede lid wordt verricht door een bedrijf dat beschikt over een geldig
      certificaat dat is afgegeven door een instantie die door een accreditatie-instantie is geaccrediteerd om uitvoering
      te kunnen geven aan de Deelregeling voor stookinstallaties, onderdeel uitmakende van de Certificatieregeling
      voor het kwaliteitsmanagementsysteem ten behoeve van het uitvoeren van onderhoud en inspectie aan technische
      installaties, van de stichting SCIOS.

      7 Indien uit een keuring als bedoeld in het eerste of tweede lid blijkt dat de stookinstallatie onderhoud behoeft,
      vindt dat onderhoud binnen twee weken na de keuring plaats.

      8 Het verslag van de keuring, bedoeld in het eerste of tweede lid, ondertekend door degene die de keuring heeft
      verricht, ligt bij de stookinstallatie ter inzage van het bevoegd gezag en wordt voor een periode van ten minste
      zes jaar bewaard.

      9 Na uitvoering van onderhoud als bedoeld in het zevende lid ligt een bewijs van uitvoering van dat onderhoud,
      gedateerd en ondertekend door degene die het onderhoud heeft uitgevoerd, bij de stookinstallatie ter inzage van het
      bevoegd gezag.

      10 Indien een stookinstallatie bij keuring dan wel na uitvoering van onderhoud, als bedoeld in het zevende lid,
      voldoet aan de eisen voor veilig functioneren, optimale verbranding en energiezuinigheid, zorgt degene die de
      inrichting drijft ervoor dat de stookinstallatie wordt afgemeld in het afmeldsysteem van de stichting SCIOS.

      11 Voor stookinstallaties met een nominaal thermisch ingangsvermogen van 1 MWth of meer omvat het verslag en de
      afmelding als bedoeld in het achtste en tiende lid ten minste de volgende gegevens:

      a. naam en adres van de gebruiker;

      b. adres waar de stookinstallatie is opgesteld;

      c. unieke identificatie van de stookinstallatie;

      d. nominaal thermisch ingangsvermogen (MWth) van de stookinstallatie;

      e. type stookinstallatie, onderverdeeld naar gasmotor, dieselmotor, dual-fuelmotor, gasturbine, ketel, fornuis,
      droger, luchtverhitter en andere stookinstallatie;

      f. type gebruikte brandstoffen en het aandeel ervan, onderverdeeld naar vaste biomassa, houtpellets, andere vaste
      brandstof, gasolie, dieselolie, huisbrandolie, biodiesel, andere vloeibare brandstoffen, aardgas, propaangas,
      butaangas, vergistingsgas en andere gasvormige brandstoffen;

      g. datum ingebruikname;

      h. verwachte aantal jaarlijkse bedrijfsuren van de stookinstallatie en de gemiddelde belasting tijdens gebruik;

      i. sector waarin de stookinstallatie werkt of de inrichting waarin zij wordt gebruikt (viercijferige NACE-code);

      j. de datum en meetresultaten van de laatst uitgevoerde emissiemetingen alsmede de tijdens de keuring gemeten
      koolmonoxide- en zuurstofconcentratie;

      k. indien gebruik gemaakt wordt van de vrijstelling van de emissiegrenswaarden op grond van de 500-uursregeling,
      bedoeld in [artikel 3.7, tweede lid, onderdeel b, van het besluit][ref3], een door de gebruiker ondertekende
      verklaring dat de installatie niet meer dan 500 uur per kalenderjaar wordt ingezet;

      l. veranderingen in de stookinstallatie of bedrijfsvoering die hebben geleid tot een verandering in
      emissiegrenswaarde.

      12 De Minister van Infrastructuur en Waterstaat draagt zorg voor het in stand houden van een register met de
      gegevens, bedoeld in het elfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.10i
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.7
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7m
