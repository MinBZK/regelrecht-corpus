  - number: 4.102ec
    text: |-
      1 Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.94di van het besluit][ref1], worden gassen en dampen die vrijkomen bij:

      a. het mengen van oplosmiddelhoudende inkt en lak;

      b. drukpersen, lakkeer- en lamineermachines;

      c. het destilleren van oplosmiddelresten, of

      d. het spoelen van verpakkingen van oplosmiddelhoudende inkt, lak of lijm

      voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in [artikel 4.94di van het besluit][ref2], worden de afgezogen gassen en dampen, die
      naar de buitenlucht worden afgevoerd:

      a. ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen
      afgevoerd, of

      b. geleid door een doelmatige ontgeuringsinstallatie.

      3 Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      geurgevoelig object per hectare.

      4 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege
      het slecht functioneren van de ontgeuringsinstallatie, onvoldoende spreiding van afgezogen dampen,
      geuremissies die niet via de afzuiging worden afgevoerd of incidentele geurpieken, overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref3] in aanvulling op het tweede lid maatwerkvoorschriften stellen met
      betrekking tot:

      a. de uitvoering en het onderhoud van een ontgeuringsinstallatie;

      b. de situering van de afvoerpijp;

      c. het voorkomen of beperken van diffuse geuremissies, of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      5 In afwijking van het tweede lid, kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het vierde lid onvoldoende zijn om de overschrijding ongedaan te maken
      overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref4] maatwerkvoorschriften opstellen met betrekking tot
      de aanwezigheid van een ontgeuringsinstallatie of grotere afvoerhoogte van de afgezogen dampen en gassen.


