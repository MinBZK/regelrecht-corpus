  - number: '3.20'
    text: |-
      1 De in het EU-systeem voor dampretour fase-II gebruikte onderdelen geven geen aanleiding tot het optreden
      van brand of explosie van de bij het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer uit het
      brandstofreservoir van het motorvoertuig verdreven dampen die worden teruggevoerd in de ondergrondse opslagtank.

      2 Het EU-systeem voor dampretour fase-II is voorzien van op de juiste plaats(en) aangebrachte en doelmatig werkende
      vlamkerende voorziening(en).

      3 Het gebruikte EU-systeem voor dampretour fase-II verkeert in een goede staat en is vrij van scheuren, gaten en
      andere gebreken.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.20
  - number: '3.21'
    text: |-
      1 Een vaste afleverinstallatie voldoet bij het afleveren van vloeibare brandstof aan motorvoertuigen voor het
      wegverkeer of aan spoorvoertuigen aan de volgende onderdelen van PGS 28:

      a. de voorschriften 2.3.8, 2.3.11 en 2.3.13;

      b. de voorschriften 3.2.5 en 3.4.2 tot en met 3.4.11;

      c. voorschrift 4.5.8;

      d. de voorschriften 5.5.1 en 5.5.3, en

      e. de paragrafen 5.6 en 5.7.

      2 Bij het afleveren van lichte olie zonder toezicht is de vaste afleverinstallatie voorzien van een
      temperatuurgevoelig element dat voldoet aan voorschrift 2.3.12 van de PGS 28. Het temperatuurgevoelig element wordt
      eenmaal per twee jaar door een daartoe opgeleid persoon of opgeleide installateur op goede werking gecontroleerd.

      3 Met inachtneming van de opslagcapaciteit, de aard van de opgeslagen vloeistoffen en de aard van de inrichting
      wordt bij inrichtingen waar lichte olie wordt afgeleverd een noodplan opgesteld overeenkomstig bijlage C bij PGS
      28. Dit noodplan is aanwezig bij de inrichting overeenkomstig de voorschriften 6.2.2 en 6.2.3 van PGS 28.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.21
  - number: 3.21a
    text: |-
      In afwijking van [artikel 3.21][ref1] wordt bij het afleveren van vloeibare brandstof aan motorvoertuigen voor het
      wegverkeer of aan spoorvoertuigen, waarbij minder dan 25 kubieke meter per jaar wordt afgeleverd, voldaan aan de
      voorschriften 3.4.1, 3.4.4, 3.4.5 en 3.4.8 van PGS 30.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.21
