  - number: 3.102b
    text: |-
      1 Een installatie voor het:

      a. biologisch behandelen van dierlijke meststoffen voor of na het vergisten;

      b. opslaan van digestaat van het vergisten van dierlijke meststoffen, dat nog niet stabiel is;

      c. opslaan van vergistinggas, en

      d. bewerken en transporteren van vergistinggas,

      is voorzien van een kwaliteitsverklaring, waaruit blijkt dat de installatie bij oplevering voldoet aan de NTA 9766.
      In de kwaliteitsverklaring wordt een referentieperiode vastgesteld voor de geldigheid. De referentieperiode is ten
      hoogste 15 jaar.

      2 Ten minste vier weken voor het aflopen van de referentieperiode wordt beoordeeld of de installatie nog steeds
      voldoet aan de NTA 9766 en wordt een kwaliteitsverklaring afgegeven met referentieperiode.

      3 Indien de beoordeling, bedoeld in het tweede lid, ertoe leidt dat de kwaliteitsverklaring alleen afgegeven kan
      worden indien bepaalde reparaties of wijzigingen worden uitgevoerd, draagt degene die de inrichting drijft er zorg
      voor dat deze reparaties of wijzigingen onverwijld worden uitgevoerd.

      4 Indien voor een installatie of voorziening geen kwaliteitsverklaring als bedoeld in het tweede lid kan worden
      afgegeven, of de reparaties of wijzigingen bedoeld in het derde lid niet worden uitgevoerd, wordt de installatie
      buiten gebruik gesteld.

      5 In aanvulling op het eerste lid wordt een gaszak waarin vergistinggas wordt opgeslagen jaarlijks visueel
      geïnspecteerd op tekenen van verwering of slijtage en indien nodig gerepareerd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.102b
  - number: 3.102c
    text: |-
      1 De volgende activiteiten vinden plaats boven een bodembeschermende voorziening:

      a. het vergisten van dierlijke meststoffen;

      b. het opslaan van het restproduct van het vergisten van dierlijke meststoffen, zolang dat restproduct nog niet
      stabiel is, en

      c. het biologisch behandelen van dierlijke meststoffen voor of na het vergisten.

      2 In afwijking van het eerste lid is een geheel of gedeeltelijk ondergrondse voorziening voor de activiteiten,
      bedoeld in het eerste lid:

      a. vloeistofdicht, of

      b. aangelegd overeenkomstig BRL 2342.

      3 De vul- en aftappunten van een voorziening voor de activiteiten, bedoeld in het eerste lid, zijn geplaatst boven
      een vloeistofdichte vloer of verharding of boven of in een lekbak.

      4 Het bewerken van vergistinggas vindt plaats boven een bodembeschermende voorziening.

      5 [Artikel 2.11 van het besluit][ref1] is niet van toepassing op de activiteiten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.102c
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.11'
  - number: 3.102d
    text: |-
      1 Een installatie voor het vergisten van dierlijke meststoffen en het opslaan, bewerken en transporteren van
      vergistinggas is uitgevoerd in materialen die bestand zijn tegen de inwerking van dierlijke mest en vergistinggas.

      2 Bij de relevante delen van een installatie voor het vergisten van dierlijke meststoffen is een noodprocedure
      aanwezig waarin is opgenomen:

      a. een beschrijving van de handelingen die worden verricht bij ten minste de volgende incidenten:

      1°. een storing van de WKK-installatie of de installatie voor het bewerken van vergistinggas;

      2°. stroomuitval;

      3°. brand, en

      4°. het afgaan van de overdrukbeveiliging.

      b. een lijst van contactpersonen en instanties die worden gewaarschuwd.

      3 Indien vergistinggas wordt geodoriseerd met tetrahydrothiofeen is tevens onderdeel van de noodprocedure dat
      een incident waarbij tetrahydrothiofeen vrijkomt, wordt gemeld aan het bevoegd gezag, de brandweer en de lokale
      beheerder van het aardgasnet.

      4 Een installatie voor het vergisten van dierlijke meststoffen of het bewerken van vergistinggas wordt uitsluitend
      bediend door een persoon die over voldoende deskundigheid beschikt. Bij de installatie zijn bedieningsinstructies
      aanwezig.

      5 Indien vergistinggas via een leiding uit de inrichting wordt getransporteerd, is de installatie die het
      vergistinggas op de leiding brengt zo afgesteld dat bij een plotselinge drukval in de leiding de levering van
      biogas wordt stopgezet. In dat geval wordt de levering hervat indien is vastgesteld dat er geen problemen met de
      leiding zijn of deze zijn opgelost.

      6 Bovengrondse vergistinggasleidingen zijn beveiligd tegen aanrijden. Ondergrondse vergistinggasleidingen lopen
      niet onder gebouwen door. Vergistinggasleidingen zijn herkenbaar als zodanig gemerkt.

      7 Indien een installatie voor het vergisten van dierlijke meststoffen of een voorziening voor het opslaan of
      bewerken van vergistinggas buiten gebruik wordt gesteld, wordt eerst het restant vergistinggas uit de installatie
      verwijderd. Het vergistinggas wordt indien mogelijk nuttig toegepast en voor zover dat niet mogelijk is vernietigd
      of anders afgevoerd met zo min mogelijk gevaar voor mens en milieu. Zodra de installatie niet meer gasdicht is,
      wordt het overgebleven restproduct zo snel mogelijk uit de installatie verwijderd en gestabiliseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.102d
  - number: 3.102e
    text: |-
      1 Op een vast opgestelde opslagtank voor vloeibaar vergistinggas zijn de voorschriften 2.2.1, 2.2.3 tot en met
      2.2.6, 2.2.10, 2.2.13 tot en met 2.2.15 van PGS 33-1 van overeenkomstige toepassing.

      2 Bij het legen van de opslagtank zijn de voorschriften 3.3.1, 3.3.2, 3.3.6 tot en met 3.3.12, 5.5.1 tot en met
      5.5.6 van PGS 33-1 van overeenkomstige toepassing.

      3 Onverminderd het tweede lid wordt een vast opgestelde opslagtank voor vloeibaar vergistinggas geleegd met
      composietslangen. Bij het legen van de tank wordt potentiaalvereffening toegepast om statische oplading te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.102e
  - number: 3.102f
    text: De kooldioxide die vrijkomt bij het bewerken van vergistinggas wordt bovendaks en omhoog gericht afgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.102f
  - number: '3.103'
    text: |-
      1 Ten behoeve van het voorkomen, dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in [artikel 3.132 van het besluit][ref1], worden afgezogen dampen en gassen van het
      bereiden van voedingsmiddelen als bedoeld in [artikel 3.130, onder b, c en d, van het besluit][ref2] die naar de
      buitenlucht worden geëmitteerd:

      a. ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen bebouwing
      afgevoerd; of

      b. geleid door een doelmatige ontgeuringsinstallatie.

      2 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder, bedoeld in [artikel 3.132 van het besluit][ref3], worden dampen die vrijkomen bij het bereiden van
      voedingsmiddelen, bedoeld in [artikel 3.130, onder b, van het besluit][ref4], in een ruimte bij grillen, anders
      dan met houtskool, dan wel frituren of bakken in olie of vet, afgezogen en voordat zij in de buitenlucht worden
      afgevoerd, geleid door een doelmatig verwisselbaar of reinigbaar vetvangend filter.

      3 Het eerste en tweede lid zijn niet van toepassing indien het mogelijke effect van de geuremissie van
      de uittredende lucht van een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een
      bedrijventerrein met minder dan één gevoelig gebouw per hectare.

      4 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissies die niet
      via de afzuiging worden afgevoerd of incidentele geurpieken, in aanvulling op het eerste lid, overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref5], maatwerkvoorschriften stellen met betrekking tot:

      a. de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het eerste lid;

      b. de situering van het emissiepunt;

      c. het voorkomen of beperken van diffuse geuremissies; of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      5 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref6], is het
      eerste lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref7] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      6 In afwijking van het vijfde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld het vierde lid stellen.

      7 In afwijking van het vijfde lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt overeenkomstig [artikel 2.7a, tweede en derde lid, van het besluit][ref8] bij maatwerkvoorschrift
      bepalen dat het eerste lid wel van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.132
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.130
