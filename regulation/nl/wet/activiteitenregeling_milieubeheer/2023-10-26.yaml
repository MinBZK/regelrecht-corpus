  - number: 5.8a
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarden voor emissies naar water wordt voldaan, indien alle gemeten
      daggemiddelde concentraties in een jaar lager zijn dan de toepasselijke emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.8a
  - number: 5.8b
    text: |-
      1 Een grote stookinstallatie en de bijbehorende terreinen worden zodanig geëxploiteerd dat het ongeoorloofd en
      accidenteel vrijkomen van verontreinigende stoffen van rookgasreiniging op of in de bodem, het oppervlaktewater of
      het grondwater wordt voorkomen.

      2 Er is opvangcapaciteit voor de opvang van:

      a. wegvloeiend hemelwater dat verontreinigd is met afvalwater van rookgasreiniging;

      b. afvalwater van rookgasreiniging als gevolg van overlopen;

      c. water dat afkomstig is van brandbestrijding verontreinigd met afvalwater van rookgasreiniging.

      3 De opvangcapaciteit is zodanig dat het afvalwater van rookgasreiniging, voordat het wordt geloosd, kan worden
      onderzocht en behandeld.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.8b
  - number: '5.9'
    text: |-
      1 De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage van
      de meting als bedoeld in [artikel 5.29, eerste lid, van het besluit][ref1] voldoet aan de eisen in de
      [artikelen 5.10 tot en met 5.24][ref2].

      2 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 5.29, tweede lid, onder a, van het besluit][ref3], wordt
      voldaan aan [artikel 5.26][ref4].

      3 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 5.29, tweede lid, onder b, van het besluit][ref5], wordt voldaan aan [artikel 5.25][ref6], [5.28][ref7]
      en [5.29][ref8].

      4 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van
      verontreiniging van het oppervlaktewater als bedoeld in [artikel 5.29, tweede lid, onder c, van het besluit][ref9],
      wordt voldaan aan [artikel 5.28][ref10] en [5.29][ref11].

      5 Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in
      [artikel 5.29, tweede lid, onder d, van het besluit][ref12], wordt voldaan aan de [artikelen 5.25][ref13] en
      [5.27][ref14].

      6 Onder nominale capaciteit van een afvalverbrandings- of afvalmeeverbrandingsinstallatie wordt voor
      de toepassing van deze afdeling verstaan: gezamenlijke verbrandingscapaciteit van de ovens waaruit een
      afvalverbrandingsinstallatie of een afvalmeeverbrandingsinstallatie bestaat, zoals berekend door de fabrikant en
      bevestigd door de drijver van de inrichting, met inachtneming van de verbrandingswaarde van het afval, uitgedrukt
      als de hoeveelheid afval die per uur kan worden verbrand.


