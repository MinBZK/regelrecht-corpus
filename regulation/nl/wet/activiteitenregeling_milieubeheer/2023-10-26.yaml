  - number: 3.21b
    text: |-
      In de gevallen dat inpandig afleveren van lichte olie is toegestaan op grond van
      [artikel 3.20a, tweede, derde en vierde lid, van het besluit][ref1], is een vaste afleverinstallatie voor het
      inpandig afleveren van lichte olie voorzien van een thermische brandmelder die is aangesloten op een akoestisch
      signaal.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.20a
