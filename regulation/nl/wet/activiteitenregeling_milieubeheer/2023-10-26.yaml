      1 Het meten van de hoeveelheid drainagewater die wordt geloosd, bedoeld in
      [artikel 3.72, eerste lid, onderdeel c, van het besluit][ref1] vindt plaats bij een representatief lozingspunt.

      2 Het registreren van:

      a. de hoeveelheid voedingswater die wordt toegediend, bedoeld in
      [artikel 3.72, eerste lid, onderdeel a, van het besluit][ref2];

      b. de hoeveelheid drainagewater die wordt hergebruikt, bedoeld in
      [artikel 3.72, eerste lid, onderdeel b, van het besluit][ref3], en

      c. de hoeveelheid drainagewater die wordt geloosd, bedoeld in
      [artikel 3.72, eerste lid, onderdeel c, van het besluit][ref4],

      vindt per periode van vier weken plaats, beginnend op dag 1 van week 1.

      3 Het meten en registreren van het gehalte aan totaal stikstof en totaal fosfor in het te lozen drainagewater,
      bedoeld in [artikel 3.72, eerste lid, onderdeel d, van het besluit][ref5] vindt bij een representatief lozingspunt
      ten minste een keer per periode van dertien weken plaats, beginnend op dag 1 van week 1.

      4 De afwijking van de nauwkeurigheid van de instrumenten die worden gebruikt voor het meten van de hoeveelheid,
      bedoeld in het eerste lid, bedraagt ten hoogste tien procent.

      5 Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen aan de uitvoering van het meten of berekenen en
      registreren van de hoeveelheid:

      a. voedingswater die wordt toegediend, bedoeld in [artikel 3.72, eerste lid, onderdeel a, van het besluit][ref6];

      b. drainagewater die wordt hergebruikt, bedoeld in [artikel 3.72, eerste lid, onderdeel b, van het besluit][ref7],
      en

      c. drainagewater die wordt geloosd, bedoeld in [artikel 3.72, eerste lid, onderdeel c, van het besluit][ref8].

      6 Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen aan het meten en registreren, bedoeld in het derde
      lid.

      7 Om de behoefte van de gewassen, genoemd in [artikel 3.77][ref9] te bepalen, wordt per gewas of groep van gewassen
      met hetzelfde bemestingsniveau:

      a. ten minste eenmaal per kwartaal een representatief grondmonster genomen en de hoeveelheid totaal stikstof en
      totaal fosfor bepaald;

      b. de hoeveelheid toegediende meststoffen geregistreerd onder vermelding van de samenstelling van de meststof en de
      oppervlakte die wordt bemest, en

      c. de hoeveelheid toegediende totaal stikstof en totaal fosfor per oppervlakte-eenheid per jaar geregistreerd.

      8 Het verbruik aan totaal stikstof en totaal fosfor wordt uitgedrukt in kilogrammen totaal stikstof en totaal
      fosfor en berekend door voor iedere te onderscheiden samenstelling van de meststoffen het verbruik van totaal
      stikstof en totaal fosfor te berekenen en vervolgens de som van de uitkomsten van die berekeningen te nemen.


