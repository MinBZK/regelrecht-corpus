        artikel: '5.27'
  - number: '5.23'
    text: |-
      1 Voor zover het betreft een afvalverbrandingsinstallatie wordt aan
      [artikel 5.18, tweede lid, van het besluit][ref1] in ieder geval voldaan, indien:

      a. de afvalverbrandingsinstallatie op een zodanige wijze wordt geëxploiteerd dat een niveau van thermische
      behandeling wordt bereikt waarbij de totale hoeveelheid organische koolstof in de slakken en de bodemas minder
      bedraagt dan 3% van het droge gewicht van het materiaal, of het gloeiverlies van de slakken en de bodemas minder
      bedraagt dan 5% van het droge gewicht van het materiaal, zo nodig na voorbehandeling van het afval met passende
      technieken,

      b. de afvalverbrandingsinstallatie zodanig wordt uitgerust, gebouwd en geëxploiteerd dat, zelfs in de meest
      ongunstige omstandigheden, het bij het proces ontstane gas, na de laatste toevoer van verbrandingslucht, gedurende
      twee seconden op beheerste en homogene wijze wordt verhit tot ten minste 850° C, gemeten dichtbij de binnenwand
      of op een ander representatief punt van de verbrandingskamer, dan wel de temperatuur gedurende twee seconden tot
      ten minste 1100° C wordt opgevoerd, indien gevaarlijke afvalstoffen met een gehalte van meer dan 1% gehalogeneerde
      organische verbindingen, uitgedrukt in chloor, thermisch worden behandeld,

      c. elke verbrandingskamer van de afvalverbrandingsinstallatie wordt uitgerust met ten minste één hulpbrander,
      die automatisch wordt ingeschakeld wanneer de temperatuur van de verbrandingsgassen na de laatste toevoer van
      verbrandingslucht tot onder de op grond van onderdeel b vereiste temperatuur zakt,

      d. de hulpbrander ook tijdens de inwerkingstelling en de stillegging van de afvalverbrandingsinstallatie wordt
      gebruikt teneinde ervoor te zorgen dat de op grond van de onderdelen b en c vereiste temperatuur gedurende
      deze in werking stelling en stillegging steeds wordt gehandhaafd zolang zich onverbrande afvalstoffen in de
      verbrandingskamer bevinden,

      e. naar de hulpbrander geen brandstoffen worden toegevoerd die hogere emissies kunnen
      veroorzaken dan bij het stoken van gasolie voor de scheepvaart als omschreven in
      [artikel 1.1 van het Besluit brandstoffen luchtverontreiniging][ref2], vloeibaar gas of aardgas het geval is, en

      f. bij de exploitatie van de afvalverbrandingsinstallaties gebruik wordt gemaakt van een automatisch systeem
      dat de toevoer van afvalstoffen voorkomt totdat bij het in werking stellen de op grond van onderdeel b vereiste
      temperatuur is bereikt en wanneer de vereiste temperatuur niet gehandhaafd blijft.

      2 Voor zover het betreft een afvalmeeverbrandingsinstallatie, wordt aan
      [artikel 5.18, tweede lid, van het besluit][ref3] in ieder geval voldaan, indien:

      a. de afvalmeeverbrandingsinstallatie zodanig wordt ontworpen, uitgerust, gebouwd en geëxploiteerd dat, zelfs in de
      meest ongunstige omstandigheden, het door de meeverbranding van afvalstoffen ontstane gas gedurende twee seconden
      op beheerste en homogene wijze wordt verhit tot ten minste 850° C, dan wel de temperatuur gedurende twee seconden
      tot ten minste 1100° C opgevoerd, indien gevaarlijke afvalstoffen met een gehalte van meer dan 1% gehalogeneerde
      organische stoffen, uitgedrukt in chloor, worden meeverbrand, en

      b. bij de exploitatie van de afvalmeeverbrandingsinstallatie gebruik wordt gemaakt van een automatisch systeem
      dat de toevoer van afvalstoffen voorkomt totdat bij het in werking stellen de op grond van onderdeel a vereiste
      temperatuur is bereikt en wanneer de vereiste temperatuur niet gehandhaafd blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.18
      [ref2]: https://wetten.overheid.nl/BWBR0029909#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel5.18
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.23
    references:
