  - number: '4.9'
    text: |-
      1 Leidingen aangesloten op een verpakking met vloeibare gevaarlijke stoffen of vloeibare bodembedreigende stoffen:

      a. zijn bovengronds vast aangelegd of in een daartoe speciaal aangelegde goot vast aangelegd;

      b. zijn bestand tegen de daardoor getransporteerde stoffen en zijn vloeistofdicht uitgevoerd;

      c. worden periodiek gecontroleerd op vloeistofdichtheid.

      2 In elke aansluiting op verpakking met een inhoud van meer dan 200 liter gevaarlijke stoffen beneden het hoogste
      vloeistofniveau, is zo dicht mogelijk bij de wand een afsluiter geplaatst. De afsluiter is zodanig uitgevoerd dat
      duidelijk is te zien of de afsluiter is geopend dan wel is gesloten.

      3 Leidingen die beneden het hoogste vloeistofniveau zijn aangesloten en waarin door hevelwerking product uit de
      tank kan stromen, zijn voorzien van een anti-hevel voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.9
  - number: 4.9a
    text: |-
      1 In afwijking van [artikel 4.3 tot en met 4.9][ref1] zijn stationaire bovengrondse verpakkingen voor het
      opslaan van afgetapte vloeibare brandstoffen bij een autodemontagebedrijf, met de daarbij behorende leidingen
      en appendages, met een inhoud van ten hoogste 270 liter per verpakking, uitgevoerd en geïnstalleerd en worden
      gerepareerd of vervangen en beoordeeld overeenkomstig BRL K903, door een bedrijf dat op grond van die BRL daartoe
      is gecertificeerd.

      2 Het opslaan van afgetapte benzine of benzinemengels bij een autodemontagebedrijf in stationaire bovengrondse
      verpakkingen met de daarbij behorende leidingen en appendages voldoet aan de paragrafen 2.2.1 tot en met 2.2.3,
      2.2.5, 2.2.6, 3.1, 3.2.1, 5.2, 5.3.2, 5.4.2, 5.6, 5.7, 5.8, 6.2.2, 6.4.1 en 6.8. van PGS 31.

      3 Een ruimte waarin verpakkingen als bedoeld in het eerste lid worden opgeslagen, bevindt zich niet op een
      verdieping.

      4 Voor stationaire bovengrondse verpakkingen met de daarbij behorende leidingen en appendages gelden de keurings-
      en herkeuringstermijnen van tabel 4.9a.


