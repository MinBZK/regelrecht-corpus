  - number: '3.49'
    text: |-
      1 Aan [artikel 3.32, aanhef en onder a en b, van het besluit][ref1] wordt bij overslag van stuifgevoelige goederen
      in ieder geval voldaan indien:

      a. bij het laden en lossen in de open lucht de storthoogte wordt beperkt tot minder dan één meter,

      b. goederen uit de stuifklasse S2 en S4 van [bijlage 3 bij het besluit][ref2] afdoende worden bevochtigd, zo
      mogelijk vooraf, of

      c. de stofemissie van goederen uit de stuifklasse S2 en S4 van [bijlage 3 bij het besluit][ref3] tijdens het laden
      en lossen met een nevelgordijn wordt tegengegaan.

      2 Aan [artikel 3.38 van het besluit][ref4] wordt bij het vullen van een gesloten opslagruimte met goederen
      behorend tot de stuifklasse S1 en S2 van [bijlage 3 bij het besluit][ref5] in ieder geval voldaan indien het
      overstortpunt en daarmee de ruimte worden afgezogen, en de afgezogen luchtstroom wordt gevoerd door een filtrerende
      afscheider die in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als voor de goede
      werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.32
