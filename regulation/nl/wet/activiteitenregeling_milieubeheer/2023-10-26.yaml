  - number: '5.46'
    text: |-
      1 De aansluitingen en leidingen van een overslaginstallatie worden regelmatig en zoveel als redelijkerwijs nodig is
      op lekken gecontroleerd.

      2 In geval van een damplek worden de vulwerkzaamheden bij het laadportaal, bedoeld in
      [artikel 5.62 van het besluit][ref1] onderbroken.

      3 Op het laadportaal is een voorziening geplaatst om een onderbreking als bedoeld in het tweede lid tot stand te
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.62
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.46
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5.62'
  - number: '5.47'
    text: |-
      1 Het meten van dampen, bedoeld in [artikel 5.57 van het besluit][ref1], geschiedt gedurende een volle werkdag van
      ten minste zeven uur met normaal debiet.

      2 De metingen zijn continu of intermitterend.

      3 Intermitterende metingen vinden ten minste vier maal per uur plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.57
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.47
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5.57'
  - number: '5.48'
    text: |-
      Het totaal aan meetfouten als gevolg van de gebruikte apparatuur, het kalibratiegas en het toegepaste procedé
      bedraagt ten hoogste tien procent van de gemeten waarde.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.48
  - number: '5.49'
    text: De gebruikte apparatuur is ten minste in staat concentraties van ten hoogste 3 g/Nm3 te meten.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.49
  - number: '5.50'
    text: |-
      1 De vularm van het laadportaal heeft een vrouwelijke vloeistofaansluiting die gekoppeld kan worden aan een
      mannelijke API 1004-adapter van 101,6 mm op de tankwagen, overeenkomstig API1004.

      2 De dampopvangslang van het laadportaal heeft een vrouwelijke nok-groef-dampopvangaansluiting die gekoppeld kan
      worden aan een mannelijke nok-groef-adapter van 101,6 mm op de tankwagen, overeenkomstig API 1004.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.50
  - number: '5.51'
    text: |-
      1 Een laadportaal is voorzien van een overloopdetectiebedieningseenheid.

      2 Indien een laadportaal wordt verbonden met een tankwagen, geeft de overloopdetectiebedieningseenheid een
      faalveilig vultoelatingssignaal wanneer de compartimentsoverloopsensoren geen hoog peil signaleren.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.51
  - number: '5.52'
    text: |-
      1 De bedieningseenheid van het laadportaal is via een kabel waaraan een contrasteker is bevestigd, via een
      standaard 10-pens elektrische contactdoos, verbonden met de steker op de tankwagen.

      2 De bedieningseenheid van een vulportaal is geschikt voor zowel tweedraads thermistorsensoren, tweedraads optische
      sensoren, vijfdraads optische sensoren of gelijkwaardige sensoren op een tankwagen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.52
  - number: '5.53'
    text: |-
      1 Het laadportaal is via de gemeenschappelijke retourdraad van de overloopsensoren verbonden met een tankwagen.

      2 De retourdraad is via het chassis van een tankwagen verbonden met pen 10 van de steker.

      3 Pen 10 van de contrasteker is verbonden met de omsluiting van de bedieningseenheid.

      4 De omsluiting is verbonden met de aarding van het laadportaal.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.53
  - number: '5.54'
    text: |-
      1 Bij het ontwerp van de vloeistoflaad- en dampopvangvoorzieningen aan een laadportaal wordt uitgegaan van een
      verbindingssysteem dat voldoet aan de volgende eisen:

      a. de hoogte van de hartlijn van de vloeistofadapters bedraagt tussen 0,7 en 1,0 meter,

      b. indien de vloeistofadapters ongeladen zijn bedraagt de hartlijn ten hoogste 1,4 meter,

      c. indien de vloeistofadapters geladen zijn, bedraagt de hartlijn ten minste 0,5 meter,

      d. de horizontale afstand tussen de vloeistofadapters bedraagt ten minste 0,25 meter,

      e. de vloeistofadapters bevinden zich binnen een lengte van ten hoogste 2,5 meter,

      f. de dampopvangadapter bevindt zich bij voorkeur rechts van de vloeistofadapters op een hoogte van ten hoogste 1,5
      meter indien de vloeistofadapter ongeladen is en op ten minste 0,5 meter indien de vloeistofadapter geladen is, en

      g. de aarding of overloopdetectie bevindt zich rechts van de vloeistof- en dampopvangadapters op:

      1°. ten hoogste 1,5 meter indien de vloeistofadapter ongeladen is, of

      2°. ten minste 0,5 meter indien de vloeistofadapter geladen is.

      2 het verbindingssysteem, bedoeld in het eerste lid, bevindt zich geheel aan één zijde van de tankwagen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.54
  - number: '5.55'
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet de constructie, plaatsing en uitvoering van de LPG-afleverinstallatie ten
      minste aan de [artikelen 5.56 tot en met 5.62][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.56
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.55
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.56'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.56'
    text: |-
      1 Een LPG-reservoir is ondergronds dan wel ingeterpt geïnstalleerd.

      2 Een LPG-reservoir heeft een inhoud van ten minste 20 kubieke meter.

      3 In een LPG-reservoir wordt uitsluitend LPG opgeslagen.

      4 LPG wordt niet opgeslagen in een tijdelijk opgesteld LPG-reservoir.

      5 Het eerste lid geldt niet voor LPG-reservoirs die deel uitmaken van een LPG-tankstation waarvoor vóór 1 juli 1984
      een Hinderwetvergunning is verleend.

      6 Het tweede lid geldt niet voor LPG-reservoirs die deel uitmaken van een LPG-tankstation waarvoor vóór 1 juli 1984
      een Hinderwetvergunning is verleend en waarbinnen wegens onvoldoende ruimte het plaatsen van een LPG-reservoir met
      een inhoud van 20 kubieke meter niet mogelijk is. In het geval, bedoeld in de eerste volzin, is de inhoud van het
      reservoir niet kleiner dan die van het reservoir dat tot 1 juli 1984 aanwezig was.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.56
  - number: '5.57'
    text: LPG-reservoirs worden onderling niet gekoppeld dan wel voldoen aan voorschrift 4.9.14 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.57
  - number: '5.58'
    text: Een bovengronds LPG-reservoir voldoet aan de voorschriften 4.9.1 tot en met 4.9.5 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.58
  - number: '5.59'
    text: |-
      Een LPG-afleverinstallatie is voorzien van op afstand bedienbare afsluiters en is uitgevoerd overeenkomstig de
      voorschriften 4.7.1 tot en met 4.7.10 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.59
  - number: '5.60'
    text: |-
      Indien het terrein waar een reservoir is opgesteld, toegankelijk is voor het publiek, wordt rondom het LPG-
      reservoir een hekwerk geplaatst dat voldoet aan de voorschriften 4.9.6 tot en met 4.9.9 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.60
  - number: '5.61'
    text: Een LPG-afleverinstallatie wordt geplaatst overeenkomstig de voorschriften 4.6.1 tot en met 4.6.6 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.61
  - number: '5.62'
    text: |-
      Een LPG-afleverinstallatie is uitgevoerd overeenkomstig de voorschriften 2.3.3 tot en met 2.3.8, 2.4.1 tot en met
      2.4.11, 4.5.1 tot en met 4.5.10 en 4.8.1 tot en met 4.8.11 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.62
  - number: '5.63'
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt ten aanzien van keuringen, controle en onderhoud van de LPG-
      afleverinstallatie ten minste voldaan aan de [artikelen 5.64][ref1] en [5.65][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.64
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5.65
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.63
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.64'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5.65'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.64'
    text: |-
      Een LPG-afleverinstallatie wordt gekeurd, gecontroleerd en onderhouden overeenkomstig de voorschriften 3.3.1,
      3.3.2, 3.3.5 tot en met 3.3.8 en 5.2.1 tot en met 5.2.3 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.64
  - number: '5.65'
    text: |-
      1 Degene die een LPG-tankstation drijft, beschikt over een installatieboek, dat bestaat uit een bedrijfshandleiding
      en een logboek, en dat voldoet aan de voorschriften 3.4.2 en 3.4.3 van PGS 16.

      2 Een logboek bevat ten minste de gegevens, bedoeld in voorschrift 3.4.4 van PGS
      16, voor zover deze gegevens niet al zijn vermeld op het aantekenblad, bedoeld in
      [artikel 12e, tweede lid, van het Warenwetbesluit drukapparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12e
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.65
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12e
  - number: '5.66'
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoen de bedrijfsvoering ten aanzien van een LPG-afleverinstallatie en de in
      verband met de veiligheid te treffen voorzieningen ten minste aan de [artikelen 5.67 tot en met 5.77][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.67
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.66
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.67'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.67'
    text: |-
      1 Gedurende de openingstijden van een LPG-tankstation is een toezichthoudend persoon binnen de inrichting aanwezig.

      2 De toezichthoudende persoon, bedoeld in het eerste lid:

      a. is 18 jaar of ouder;

      b. heeft de beschikking over communicatiemiddelen, waaronder een op het openbaar netwerk aangesloten vast
      telefoontoestel en is in staat deze te bedienen;

      c. is op de hoogte van de bij normaal bedrijf in acht te nemen veiligheidsvoorschriften, vermeld in deze afdeling;

      d. is op de hoogte van de in geval van een incident of calamiteit noodzakelijk te verrichten handelingen, bedoeld
      in [artikel 5.68, derde lid][ref1], en

      e. is te allen tijde in staat om de instructies ingeval van een incident of calamiteit, uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.68
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.67
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.68'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.68'
    text: |-
      1 Binnen de inrichting zijn instructies in geval van calamiteiten of incidenten en het veiligheidsinformatieblad
      van LPG, bedoeld in artikel 31 van de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen
      aanwezig.

      2 Nabij de werkplek van de toezichthoudende persoon als bedoeld in [artikel 5.67, eerste lid][ref1], zijn de
      instructies ingeval van calamiteiten of incidenten duidelijk zichtbaar en leesbaar aangebracht.

      3 De instructies ingeval van calamiteiten of incidenten bevatten in elk geval de volgende aspecten:

      a. de instructies met betrekking tot het in veiligheid brengen van personen;

      b. de handelingen benodigd voor het herstellen van de veilige situatie;

      c. een actueel overzicht van namen en telefoonnummers van te waarschuwen instanties.

      4 Degene die een LPG-tankstation drijft, stelt de toezichthoudende persoon en het in het LPG-tankstation
      werkzame personeel bij de aanvang van de werkzaamheden en vervolgens jaarlijks op de hoogte van de aard en de
      gevaaraspecten van de LPG-afleverinstallatie, de te nemen maatregelen bij incidenten, de instructies bij incidenten
      en calamiteiten en het veiligheidsinformatieblad van LPG, bedoeld in artikel 31 van de EG-verordening registratie,
      evaluatie en autorisatie van chemische stoffen, en laat de betrokken personen een verklaring ondertekenen dat zij
      hiervan op de hoogte zijn gesteld.

      5 De ondertekende verklaringen worden in het logboek bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.67
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.68
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.67'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.69'
    text: |-
      1 De toezichthoudende persoon, bedoeld in [artikel 5.67, eerste lid][ref1], heeft vanaf de plaats waar de knop van
      de op afstand bedienbare sluiters zijn aangebracht goed zicht op het afleveren van de LPG.

      2 De aflevering van LPG is slechts mogelijk nadat de toezichthoudende persoon de afleverzuil hiertoe heeft
      vrijgegeven.

      3 Tijdens het afleveren van LPG bevindt de toezichthoudende persoon zich op de plaats waar de knop van de op
      afstand bedienbare sluiters te allen tijde kan worden bediend.

      4 De toezichthoudende persoon kan tijdens het afleveren van LPG zo nodig mondelinge instructies geven aan degene
      die de afleverzuil bedient. Indien nodig zijn hiervoor voorzieningen aangebracht.

      5 Indien een LPG-tankstation niet is geopend voor de aflevering van LPG staan de op afstand bedienbare afsluiters
      die zich bevinden tussen het LPG-reservoir en de afleverzuilen in de gesloten stand.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.67
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.69
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.67'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.70'
    text: |-
      Op een goed bereikbare en zichtbare plaats nabij een LPG-afleverinstallatie is een blustoestel aanwezig dat voldoet
      aan de voorschriften 4.9.10 en 4.9.11 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.70
  - number: '5.71'
    text: |-
      1 Ter plaatse van de afleverzuil en de opstelplaats van de LPG-tankwagen is voldoende verlichting aanwezig om de
      benodigde handelingen veilig te kunnen verrichten.

      2 Een LPG-tankstation is tijdens bedrijf dusdanig verlicht dat voldoende overzicht is gewaarborgd.

      3 Er wordt uitsluitend elektrische verlichting toegepast.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.71
  - number: '5.72'
    text: |-
      1 Op het verrichten van handelingen met betrekking tot het LPG-reservoir zijn de volgende voorschriften van PGS 16
      van toepassing:

      a. werkzaamheden aan het reservoir worden uitgevoerd overeenkomstig voorschrift 5.4.1;

      b. het ingassen onderscheidenlijk het ontgassen van het reservoir vindt plaats overeenkomstig de voorschriften
      5.4.2 en 5.4.3;

      c. een dompelpomp van het reservoir wordt verwisseld overeenkomstig voorschrift 5.4.4;

      d. een veerveiligheid van het reservoir wordt verwisseld overeenkomstig voorschrift 5.4.5.

      2 Het plaatsen, verplaatsen of verwijderen van het reservoir vindt uitsluitend plaats in vloeistofloze toestand
      door een bedrijf dat speciaal daarvoor is uitgerust.

      3 Het reservoir en de afsluiters voldoen aan voorschrift 4.7.11 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.72
  - number: '5.73'
    text: |-
      1 Het afleveren van LPG vindt uitsluitend plaats door middel van de afleverzuil.

      2 De afleverzuil levert uitsluitend LPG aan:

      a. brandstofreservoirs die uitsluitend dienen voor de berging van LPG, die speciaal zijn ingericht voor de
      aandrijving van motorvoertuigen en die zijn bevestigd aan deze voertuigen en die al dan niet mede zijn ingericht
      voor de voeding van verwarmingssystemen voor gebruik in motorvoertuigen op de weg en de aanhangers daarvan mits die
      verwarmingssystemen voldoen aan de eisen van de [Regeling voertuigen][ref1];

      b. het reservoir van de LPG-tankwagen, indien de LPG-afleverinstallatie leeg wordt gemaakt.

      3 Bij het afleveren van LPG is de vulsnelheid gelimiteerd tot 80 liter per minuut.


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.73
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: '5.74'
    text: Gasflessen en wisselreservoirs worden niet met LPG gevuld.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.74
  - number: '5.75'
    text: |-
      1 Op of aan de afleverzuil is een te allen tijde duidelijk leesbaar opschrift met ten minste 3 centimeter hoge
      letters aangebracht met de tekst:

      a. Motor afzetten;

      b. Roken en open vuur verboden, en

      c. Gasflessen vullen verboden.

      2 In afwijking van het eerste lid kunnen ook pictogrammen worden gebruikt die ten minste 3 centimeter hoog zijn en
      voldoen aan een vastgestelde internationale standaard.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.75
  - number: '5.76'
    text: |-
      1 De afleverslang wordt niet eerder aangekoppeld dan nadat de motor van het voertuig waaraan LPG wordt afgeleverd,
      buiten werking is gesteld.

      2 De motor van het voertuig waaraan LPG is afgeleverd, wordt niet eerder in werking gesteld dan nadat de
      afleverslang is afgekoppeld en is opgeborgen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.76
  - number: '5.77'
    text: |-
      Tijdens het afleveren van LPG wordt niet gerookt en is geen vuur binnen een afstand van 5 meter van de afleverzuil
      en afleverslang aanwezig.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.77
  - number: '5.78'
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt ten aanzien van aflevering door middel van een LPG-afleverautomaat ten minste
      voldaan aan de [artikelen 5.79 tot en met 5.84][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.79
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.78
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.79'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.79'
    text: |-
      1 [Artikel 5.67, eerste lid][ref1], en [artikel 5.69, eerste tot en met vierde lid][ref2], zijn niet van toepassing
      op een LPG-afleverautomaat.

      2 Indien LPG wordt afgeleverd door middel van een LPG-afleverautomaat is een toezichthoudend persoon, als bedoeld
      in [artikel 5.67, eerste lid][ref3], beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.67
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5.69
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel5.67
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.79
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5.67'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5.69'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '5.67'
        hoofdstuk: '5'
        paragraaf: 5.7.1
        afdeling: '5.7'
  - number: '5.80'
    text: |-
      Bij het afleveren van LPG zonder direct toezicht door middel van een LPG-afleverautomaat is de LPG-
      afleverinstallatie uitgevoerd overeenkomstig voorschrift 7.2.1 van PGS 16 en wordt voldaan aan de voorschriften
      7.2.2 en 7.2.3 van PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.80
  - number: '5.81'
    text: |-
      1 Aflevering van LPG door middel van een LPG-afleverautomaat geschiedt uitsluitend aan een afnemer die door degene
      die een LPG-tankstation drijft, is geregistreerd als toegelaten afnemer.

      2 Ten behoeve van die registratie tekent de afnemer een schriftelijke verklaring waaruit blijkt dat:

      a. de afnemer bekend is met en zich houdt aan de volgende instructies bij het afleveren van LPG:

      1°. op het terrein van de LPG-installatie wordt niet gerookt en wordt geen open vuur gemaakt;

      2°. de afleverslang wordt niet eerder aangekoppeld dan nadat de motor van het voertuig, waaraan LPG wordt
      afgeleverd, buiten werking is gesteld;

      3°. de motor van het voertuig waaraan LPG is afgeleverd, wordt niet eerder in werking gesteld dan nadat de
      afleverslang is afgekoppeld en is opgeborgen;

      4°. de slangverbinding wordt deugdelijk tot stand gebracht, waarbij geen andere hulpstukken worden toegepast dan de
      hulpstukken die door degene die een LPG-tankstation drijft, zijn verstrekt, en

      5°. slechts vaste in het motorvoertuig gemonteerde reservoirs als bedoeld in
      [artikel 5.73, tweede lid, onderdeel a][ref1], worden gevuld;

      b. de afnemer een praktijkinstructie heeft ontvangen voor het vullen van het reservoir van een voertuig met het
      afleversysteem van degene die een LPG-tankstation drijft;

      c. de afnemer slechts toestemming heeft voor persoonlijk gebruik van de LPG-afleverautomaat.

      3 De afnemer overlegt de verklaring aan degene die het LPG-tankstation drijft.

      4 Degene die een LPG-tankstation drijft, houdt een registratie bij van de door hem geaccepteerde afnemers en de
      door hen ondertekende verklaringen.

      5 Degene die een LPG-tankstation drijft, registreert van de afleveringen van LPG door middel van een LPG-
      afleverautomaat de volgende gegevens en bewaart deze ten minste gedurende twee weken in het logboek:

      a. registratiegegevens van de afnemer;

      b. datum en tijd van de aflevering, en

      c. de afgeleverde hoeveelheid LPG.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.73
