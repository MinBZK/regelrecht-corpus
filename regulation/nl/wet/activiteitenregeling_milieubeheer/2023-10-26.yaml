        bwb_id: BWBR0022762
        artikel: 4.74.7
  - number: 4.84a
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies:

      a. vindt het stralen van steen plaats:

      1°. in een daarvoor bestemde en ingerichte gesloten kast, cabine of ruimte; of

      2°. met gereedschap dat is uitgerust met een geïntegreerde stofafzuiginstallatie;

      b. vindt het trommelen van steen plaats in een gesloten installatie;

      c. wordt stofklasse S dat vrijkomt bij de mechanische bewerking van steen, voor zover dat redelijkerwijs
      mogelijk is, doelmatig aan de bron afgezogen, tenzij gebruik wordt gemaakt van natte werkmethoden die voldoen aan
      [artikel 4.84b, onderdeel a of c][ref1];

      d. vinden reiniging en ontstoffing van apparatuur en werkruimten plaats door gebruik te maken van natte
      werkmethoden of stofzuigers.

      2 Indien het redelijkerwijs niet mogelijk is te stralen als bedoeld in het eerste lid, onder a, vindt het stralen
      van steen plaats in een gesloten ruimte met gesloten deuren en ramen, waarbij wordt voorkomen dat bij het openen
      van deuren en ramen stof naar de buitenlucht vrijkomt.

      3 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen emissies die
      vrijkomen bij mechanische bewerking van steen en die naar de buitenlucht worden afgevoerd, bovendaks en omhoog
      gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een
      gevoelig gebouw op een gezoneerd industrieterrein, dan wel op een bedrijventerrein met minder dan één gevoelig
      gebouw per hectare.

      4 Het bevoegd gezag kan in het belang van de luchtkwaliteit en maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het derde lid.

      5 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref2], is het
      derde lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref3] nodig is en voor zover de emissies als bedoeld in het derde lid niet
      toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      6 In afwijking van het vijfde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het vierde lid
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4.84b
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
