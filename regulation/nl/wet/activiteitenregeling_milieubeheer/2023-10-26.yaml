  - number: '4.86'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat
      niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan en het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van verontreiniging van een oppervlaktewaterlichaam wordt bij het afleveren van vloeibare brandstoffen aan
      vaartuigen ten minste voldaan aan het tweede tot en met tiende lid.

      2 Het afleveren van vloeibare brandstoffen aan vaartuigen en het vullen van opslagtanks vindt uitsluitend plaats
      door of onder direct toezicht van deskundig personeel dat op de hoogte is van:

      a. de gevaarlijke eigenschappen van de brandstoffen,

      b. de absorptie- en hulpmiddelen, bedoeld in [artikel 4.78 van het besluit][ref1],

      c. het noodplan, bedoeld in het zevende lid, en

      d. de instructies, bedoeld in artikel 36 van [bijlage 3.8 bij de Binnenvaartregeling][ref2],

      en dat direct kan ingrijpen bij morsingen, incidenten en calamiteiten.

      3 Bij een op de wal geplaatste vaste afleverinstallatie voor het afleveren van vloeibare brandstoffen aan
      vaartuigen en bij het vulpunt van een bunkerstation indien dit vulpunt op de kant is gelegen, worden voorzieningen
      getroffen of maatregelen genomen om schade aan de afleverinstallatie en het vulpunt door aanrijdingen te voorkomen.

      4 Een op de wal geplaatste vaste afleverinstallatie voor het afleveren van vloeibare brandstoffen aan vaartuigen en
      een bunkerstation zijn zodanig gelegen, dat de bereikbaarheid voor passerende vaartuigen is gewaarborgd en een zo
      laag mogelijk aanvaringsrisico wordt bereikt.

      5 Een op de wal geplaatste vaste afleverinstallatie voldoet bij het afleveren van vloeibare brandstoffen aan
      vaartuigen aan de volgende onderdelen van PGS 28:

      a. de voorschriften 2.3.8, 2.3.11 en 2.3.12;

      b. de voorschriften 3.2.5, 3.4.4 en 3.4.6 tot en met 3.4.11, en

      c. de voorschriften 5.5.1, 5.5.3, 5.6.1, 5.6.2 en 5.7.1,

      waarbij voor ‘voertuig’ wordt gelezen ‘vaartuig’.

      6 Op een op de wal geplaatste vaste afleverinstallatie voor het afleveren van vloeibare brandstoffen aan vaartuigen
      zijn de artikelen 21, 35b, e, f, j en k, 36, 45, 46 en 47 van [bijlage 3.8 bij de Binnenvaartregeling][ref3] van
      overeenkomstige toepassing.

      7 Op verzoek van het bevoegd gezag stelt de houder van een inrichting waar vloeibare brandstof wordt afgeleverd aan
      vaartuigen aan de hand van de opslagcapaciteit, de aard van de opgeslagen producten en de aard van de inrichting
      een doelmatig noodplan op om:

      a. lekkage zo spoedig mogelijk te stoppen en gelekte brandstof op te ruimen,

      b. brand zo spoedig mogelijk onder controle te krijgen waarbij wordt aangegeven in welke gevallen zelf opgetreden
      wordt en in welke gevallen de brandweer wordt ingeschakeld,

      c. betrokken personen intern te alarmeren en indien nodig op te roepen,

      d. indien nodig de installatie stil te leggen of te ontruimen,

      e. hulpdiensten, omwonenden en bevoegd gezag te informeren, en

      f. zo nodig hulp te kunnen bieden aan degenen die zich op het bedrijfsterrein bevinden en aan omwonenden.

      8 Aan een schip dat gevaarlijke stoffen vervoert, bedoeld in
      [artikel 3.14, tweede en derde lid van het Rijnvaartpolitiereglement 1995][ref4], wordt geen vloeibare brandstof
      afgeleverd.

      9 Aan een schip dat gevaarlijke stoffen vervoert, bedoeld in
      [artikel 3.14, eerste lid van het Rijnvaartpolitiereglement 1995][ref5], wordt geen vloeibare brandstof afgeleverd
      indien de gevaarlijke stoffen gassen zijn.

      10 Bij een bunkerstation waar lichte olie wordt afgeleverd aan vaartuigen, wordt geen
      vloeibare brandstof afgeleverd aan een schip dat gevaarlijke stoffen vervoert, bedoeld in
      [artikel 3.14, eerste lid, van het Rijnvaartpolitiereglement 1995][ref6]


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.78
      [ref2]: https://wetten.overheid.nl/BWBR0025958
      [ref3]: https://wetten.overheid.nl/BWBR0025958
      [ref4]: https://wetten.overheid.nl/BWBR0006923#Artikel3.14
      [ref5]: https://wetten.overheid.nl/BWBR0006923#Artikel3.14
      [ref6]: https://wetten.overheid.nl/BWBR0006923#Artikel3.14
