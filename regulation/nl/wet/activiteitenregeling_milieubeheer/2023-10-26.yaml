  - number: '3.34'
    text: |-
      1 Een ondergrondse opslagtank met de daarbij behorende leidingen en appendages is uitgevoerd en geïnstalleerd en
      wordt gerepareerd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument
      door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit.

      2 Indien de ondergrondse opslagtank of de daarbij behorende leidingen of appendages van staal zijn, is een
      bodemweerstandsmeting uitgevoerd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref2] aangewezen
      normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit. Indien uit een
      bodemweerstandsmeting blijkt dat de specifieke elektrische weerstand van de bodem minder is dan 100 ohmmeter worden
      de opslagtank en de leidingen tegen corrosie beschermd door middel van een kathodische bescherming, aangebracht
      overeenkomstig het daartoe krachtens het Besluit bodemkwaliteit aangewezen normdocument door een bedrijf, dat
      daartoe beschikt over een erkenning op grond van dat besluit. De termijn waarbinnen de bodemweerstandsmeting wordt
      uitgevoerd is gelijk aan de keuringstermijn, bedoeld in [artikel 3.35, tweede lid][ref3].

      3 Een aansluitpunt van een vul- of leegzuigleiding wordt geplaatst boven of in een vulpuntmorsbak of boven een
      vloeistofdichte vloer of verharding. De oppervlakte van de vloeistofdichte vloer of verharding bij een vulpunt
      bedraagt ten minste 12 vierkante meter, bij voorkeur met een afmeting van 4 meter bij 3 meter.

      4 In afwijking van het eerste lid wordt een ondergrondse opslagtank met vloeibare brandstof waarvan het vulpunt
      is geïnstalleerd voor 1 februari 2003, uiterlijk 1 februari 2018 voorzien van een aansluitmogelijkheid voor het
      afvoeren van statische elektriciteit.

      5 Het derde lid is tot 1 december 2028 niet van toepassing op vloeistofdichte vloeren als bedoeld in dat lid die al
      bestonden voor 1 december 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
      [ref2]: https://wetten.overheid.nl/BWBR0022929
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3.35
