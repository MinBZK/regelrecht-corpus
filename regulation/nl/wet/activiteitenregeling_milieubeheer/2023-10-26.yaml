  - number: '3.116'
    text: |-
      1 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      bodemverontreiniging als bedoeld in [artikel 3.158 van het besluit][ref1] is, in het geval van buitenschietbanen,
      niet zijnde kleiduivenbanen, de kogelvanger opgesteld boven een bodembeschermende voorziening tenzij deze is
      uitgevoerd als zandkogelvanger met overkapping tegen inregenen.

      2 Een kleiduivenbaan waar met lood- of zinkhagelpatronen wordt geschoten of waar kleiduiven worden gebruikt of
      voorhanden zijn die de in tabel 3.116 aangegeven stoffen bevatten in concentraties die de daarbij aangegeven
      waarden te boven gaan, is voorzien van:

      a. een bodembeschermende voorziening;

      b. vangnetten of schermen langs het oppervlak waarop de bodembeschermende voorziening is aangebracht, indien delen
      van patronen of kleiduiven buiten dat oppervlak terecht kunnen komen.

      3 Restanten van patronen en kleiduiven die na het kleiduivenschieten achterblijven op een kleiduivenbaan worden
      periodiek verwijderd.

      4 De controle, het onderhoud en het beheer van de bodembeschermende voorziening, bedoeld in het tweede lid, worden
      in eenduidige bedrijfsinterne procedures en werkinstructies ter bescherming van de bodem vastgelegd.

      5 [Artikel 2.4, eerste lid, onder b][ref2], is niet van toepassing op een bodembeschermende voorziening als bedoeld
      in het eerste en tweede lid.


