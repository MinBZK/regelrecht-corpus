      1 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder worden bij het in werking hebben van een installatie voor het doorvoeren, bufferen of keren van
      rioolwater naar de buitenlucht afgevoerde dampen, waar binnen 50 meter van een emissiepunt een gevoelig gebouw,
      niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel bedrijventerrein met minder dan 1
      gevoelig gebouw per hectare, is gelegen, bovendaks en omhoog gericht afgevoerd.

      2 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege onvoldoende
      verspreiding van afgezogen dampen maatwerkvoorschriften stellen met betrekking tot het verhogen van de afvoerhoogte
      van de afgezogen dampen en gassen.

      3 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref1], is het
      eerste lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens artikel 1.10 van het besluit nodig is en voor zover er geen verandering van de inrichting plaatsvindt die
      leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      4 In afwijking van het derde lid kan het bevoegd gezag maatwerkvoorschriften stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.15
    references:
