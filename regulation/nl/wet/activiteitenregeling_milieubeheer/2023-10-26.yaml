  - number: '4.62'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het stralen van metalen waarbij
      vloeibare bodembedreigende stoffen worden gebruikt of kunnen vrijkomen, plaats boven een vloeistofdichte vloer
      of verharding.

      2 Indien bij de activiteit, bedoeld in het eerste lid, alleen vaste bodembedreigende stoffen vrijkomen dan vindt
      deze activiteit plaats boven een bodembeschermende voorziening.

      3 De activiteit, bedoeld in het eerste lid kan ook boven een andere bodembeschermende voorziening worden uitgevoerd
      indien deze activiteit wordt uitgevoerd als een gesloten proces.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.62
  - number: '4.63'
    text: |-
      In deze paragraaf wordt onder het reinigen van metalen niet verstaan het wassen van motorvoertuigen of carrosserie-
      onderdelen daarvan als bedoeld in [paragraaf 3.3.2][ref1] en het afspuiten van pleziervaartuigen als bedoeld in
      [paragraaf 4.6.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk3
