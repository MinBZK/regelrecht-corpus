  - number: '2.18'
    text: |-
      Bij het door middel van berekening bepalen van immissieconcentraties van zeer zorgwekkende stoffen in de
      buitenlucht als bedoeld in [artikel 2.4, zesde lid, onder c, van het besluit][ref1], bij inrichtingen:

      a. wordt gebruik gemaakt van gegevens met betrekking tot de:

      1°. fysieke kenmerken van de bron;

      2°. kenmerken van de emissie, en

      3°. kenmerken van de omgeving.

      b. worden de immissieconcentraties bepaald vanaf de grens van het terrein van de betreffende inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.4'
  - number: '2.19'
    text: |-
      1 Het door middel van berekening bepalen van de concentraties van zeer zorgwekkende stoffen, bedoeld in
      [artikel 2.18][ref1], vindt plaats volgens de standaardrekenmethode 3 Nieuw Nationaal Model, voor zover de
      desbetreffende situatie valt binnen het toepassingsgebied van die rekenmethode.

      2 Van de standaardrekenmethode 3 Nieuw Nationaal Model kan in overleg met het bevoegd gezag worden afgeweken mits
      de methode waarmee wordt afgeweken passend is en gelijkwaardig aan de standaardrekenmethode 3 Nieuw Nationaal
      Model.

      3 In situaties die buiten het toepassingsgebied van standaardrekenmethode 3 Nieuw Nationaal Model vallen, wordt in
      overleg met het bevoegd gezag een andere, passende methode toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2.18
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel2.19
