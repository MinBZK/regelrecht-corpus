  - number: 4.84d
    text: |-
      Aan [artikel 4.74f van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen emissies die vrijkomen bij het aanbrengen van lijmen, harsen of coatings op steen worden gevoerd
      door een filtrerende afscheider, die geschikt is om aan [artikel 4.74f van het besluit][ref2] te voldoen; en

      b. de filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74f
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74f
