  - number: '4.120'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat
      niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het gericht werken met biologische agentia in een laboratorium of
      praktijkruimte ten minste voldaan aan het tweede tot en met het vierde lid.

      2 Degene die de inrichting drijft, stelt gedragsvoorschriften op en treft voorzieningen die zijn gericht op het
      voorkomen van het vrijkomen van het biologisch agens en draagt ervoor zorg dat de gedragsvoorschriften worden
      nageleefd.

      3 De gedragsvoorschriften, bedoeld in het tweede lid, zijn te allen tijde voor inzage door het bevoegd gezag
      beschikbaar.

      4 Het bevoegd gezag kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan maatwerkvoorschriften stellen ten aanzien van:

      a. de ruimten waar gericht gewerkt wordt met een biologisch agens die is of wordt ingedeeld in groep 2 of een
      biologisch agens dat behoort tot een soort die is opgenomen in [bijlage 3][ref1];

      b. de invulling van gedragsvoorschriften en voorzieningen als bedoeld in het tweede lid.

      5 Voor de groepsindeling, bedoeld in het vierde lid, onder a, wordt aangesloten bij de indeling in risico-groepen
      van richtlijn nr. 2000/54/EG van het Europees Parlement en de Raad van 18 september 2000 betreffende de bescherming
      van de werknemers tegen de risico’s van blootstelling aan biologische agentia op het werk.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.120
