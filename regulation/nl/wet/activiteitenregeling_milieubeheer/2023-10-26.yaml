      1 Emissiemetingen aan grote stookinstallaties zijn verplicht:

      a. voor zover ingevolge het besluit emissiegrenswaarden van toepassing zijn;

      b. voor kwikemissies van met steenkool of bruinkool gestookte installaties.

      2 De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en
      rapportage van de meting, bedoeld in [artikel 5.13 van het besluit][ref1], voldoet aan de eisen in de
      [artikelen 5.2 tot en met 5.8a][ref2].


