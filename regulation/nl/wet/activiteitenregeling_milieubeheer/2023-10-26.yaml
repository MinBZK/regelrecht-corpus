      1 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, zoveel mogelijk beperken van de belasting
      van de bodem, bedoeld in [artikel 3.144, aanhef en onder b, van het besluit][ref1], wordt bij het schieten op een
      binnenschietbaan ten minste voldaan aan het tweede tot en met het derde lid.

      2 Indien bij het schieten hulzen van verschoten munitie vrijkomen, vindt het schieten plaats boven een
      bodembeschermende voorziening.

      3 De kogelvanger, bedoeld in [artikel 3.110, derde lid][ref2], is opgesteld boven een bodembeschermende
      voorziening.


