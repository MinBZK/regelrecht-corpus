  - number: 4.49c
    text: |-
      1 Stoffen als bedoeld in het [4.31b, tweede lid, van het besluit][ref1], die bij het mengen van rubbercompounds
      of het verwerken van rubber of thermoplastische kunststof worden toegepast en in ieder geval onder een
      minimalisatieverplichting vallen, zijn:

      a. benzyl butyl ftalaat (BBP);

      b. dibutyl ftalaat (DBP);

      c. di-ethyl hexyl ftalaat (DEHP);

      d. di-isobutyl ftalaat (DIBP).

      2 Op de stoffen, bedoeld in het eerste lid, is het bepaalde in de EG-verordening registratie, evaluatie en
      autorisatie van chemische stoffen onverminderd van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.31b
