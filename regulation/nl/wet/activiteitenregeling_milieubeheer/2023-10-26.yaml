  - number: '5.17'
    text: |-
      1 De resultaten van de overeenkomstig deze afdeling verrichte metingen worden herleid tot een massaconcentratie
      bij het genormaliseerde zuurstofgehalte, bedoeld in de [artikelen 5.19][ref1], [5.20][ref2] en
      [5.22 van het besluit][ref3], overeenkomstig de volgende formule:

      E = (21-O)/(21-O) x E, waarbij wordt verstaan onder:

      E = de berekende emissieconcentratie bij het genormaliseerde zuurstofgehalte

      E = de gemeten emissieconcentratie

      O = het genormaliseerde zuurstofgehalte

      O = het gemeten zuurstofgehalte

      2 In afwijking van het eerste lid mogen indien afvalstoffen in een met zuurstof verrijkte atmosfeer worden verbrand
      of meeverbrand, meetresultaten worden herleid tot een zuurstofgehalte waarvan de drijver van de afvalverbrandings-
      of afvalmeeverbrandingsinstallatie aantoont dat dit de bijzondere omstandigheden van het geval weergeeft.

      3 Indien de emissies in de lucht van stoffen, waarvoor bij [paragraaf 5.1.2 van het besluit][ref4]
      emissiegrenswaarden zijn gesteld, worden verminderd door behandeling van het afgas in een afvalverbrandings-
      of afvalmeeverbrandingsinstallatie waarin gevaarlijke afvalstoffen worden behandeld, geschiedt herleiding naar
      de in het eerste lid bedoelde zuurstofgehaltes alleen indien het in de desbetreffende periode voor de betrokken
      verontreinigende stof gemeten zuurstofgehalte hoger is dan het relevante genormaliseerde zuurstofgehalte.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.19
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5.20
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel5.22
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Paragraaf5.1.2
