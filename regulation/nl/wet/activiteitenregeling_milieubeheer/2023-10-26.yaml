  - number: 3.4r
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan vaste objecten die
      direct in contact staan met een oppervlaktewaterlichaam, omsluit de hulpconstructie in afwijking van de
      [artikelen 3.4l tot en met 3.4p][ref1] de ruimte waarin wordt gewerkt zoveel mogelijk.


