        artikel: 3.7b
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7d
    text: |-
      1 Bij een afzonderlijke meting als bedoeld in [artikel 3.7b][ref1] mag van een deelmeting een door een
      onafhankelijke en deskundige meetinstantie aangetoond 95%-betrouwbaarheidsinterval worden afgetrokken ten behoeve
      van de toetsing aan de emissiegrenswaarde, bedoeld in [artikel 3.7c, tweede lid][ref2].

      2 De waarde van het 95%-betrouwbaarheidsinterval, bedoeld in het eerste lid, is niet groter dan de volgende
      percentages van de emissiegrenswaarde voor:

      a. zwaveldioxide (SO): 20;

      b. stikstofoxiden (NO): 20;

      c. totaal stof: 30; en

      d. onverbrande koolwaterstoffen (CH, uitgedrukt in C): 20.

      3 In afwijking van het tweede lid, onderdeel c, is de waarde van het 95%-betrouwbaarheidsinterval voor totaal stof
      niet groter dan 40% van de emissiegrenswaarde voor totaal stof, voor zover het een stookinstallatie betreft met een
      nominaal thermisch ingangsvermogen kleiner dan 1 MWth.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.7b
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3.7c
