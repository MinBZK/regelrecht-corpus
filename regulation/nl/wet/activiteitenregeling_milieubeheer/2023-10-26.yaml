  - number: 3.71b
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan als bedoeld
      in [artikel 3.54d van het besluit][ref1], voldoet de opslag van gasolie in bovengrondse opslagtanks aan de
      [artikelen 3.71c tot en met 3.71h][ref2].

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.54d van het besluit][ref3] voldoet de opslag van smeerolie of afgewerkte olie in bovengrondse
      opslagtanks aan de [artikelen 3.71f][ref4] en [3.71h][ref5].

      3 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      verontreiniging van een oppervlaktewaterlichaam als bedoeld in [artikel 3.54d van het besluit][ref6] voldoet de
      opslag van gasolie, smeerolie of afgewerkte olie in bovengrondse opslagtanks boven een oppervlaktewaterlichaam aan
      de artikelen [3.71g][ref7] en [3.71h][ref8].


