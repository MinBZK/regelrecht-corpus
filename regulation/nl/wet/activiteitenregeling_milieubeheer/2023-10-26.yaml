  - number: 3.27f
    text: |-
      1 Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.26a van het besluit][ref1]
      voldoet de opslag van autowrakken of wrakken van tweewielige motorvoertuigen bij een inrichting waar autowrakken of
      wrakken van tweewielige motorvoertuigen worden gedemonteerd, aan het tweede tot en met zevende lid.

      2 Autowrakken of wrakken van tweewielige motorvoertuigen die nog niet zijn ontdaan van de stoffen, preparaten
      of producten, bedoeld in [artikel 3.27d, tweede lid][ref2], worden direct bij binnenkomst in de inrichting en in
      afwachting van verdere bewerking op een specifiek daarvoor aangewezen gedeelte van de inrichting opgeslagen en
      worden niet gestapeld.

      3 Autowrakken die nog niet zijn ontdaan van alle stoffen, preparaten of producten als bedoeld in
      [artikel 3.27d, vijfde lid][ref3], worden maximaal twee hoog, met een maximale hoogte van 4,5 meter, gestapeld op
      een daartoe aangewezen gedeelte van de inrichting, dan wel worden op een zodanige wijze in stellingen gestapeld dat
      deze gemakkelijk kunnen worden geïnspecteerd en gedemonteerd.

      4 Autowrakken waarvan de stoffen, preparaten of producten, bedoeld in [artikel 3.27d, tweede en vijfde lid][ref4],
      zijn afgetapt of gedemonteerd, worden uitsluitend rechtstreeks uit de inrichting afgevoerd naar een inrichting
      waarin zich een shredderinstallatie bevindt en waarin autowrakken worden gescheiden in direct als materiaal te
      recyclen metaalschroot en shredderafvalstoffen.

      5 In afwijking van het vierde lid is het toegestaan autowrakken die zijn ontdaan van de stoffen, preparaten en
      producten, bedoeld in [artikel 3.27d, tweede en vijfde lid][ref5], voordat ze overeenkomstig het vierde lid worden
      afgevoerd, ter beschikking te stellen aan een inrichting waar de autowrakken worden opgeslagen, mits de inrichting
      waar de autowrakken zijn gedemonteerd er zorg voor draagt dat een inrichting waar de autowrakken worden opgeslagen:

      a. geen demontagehandelingen of handelingen met de autowrakken verricht, waardoor de identiteit of de inhoud van de
      autowrakken niet meer herkenbaar is;

      b. de autowrakken afvoert naar een inrichting waar zich een shredderinstallatie als bedoeld in het vierde lid
      bevindt.

      6 In afwijking van het vierde lid is het toegestaan autowrakken die zijn ontdaan van de stoffen, preparaten en
      producten, bedoeld in [artikel 3.27d, tweede lid][ref6], voordat ze overeenkomstig het vierde lid worden afgevoerd,
      ter beschikking te stellen aan een instelling voor oefen- en opleidingsdoeleinden.

      7 Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van de stapelhoogte voor autowrakken als bedoeld
      in het derde lid.

      8 Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van het ter beschikking stellen van autowrakken
      aan een instelling voor oefen- en opleidingsdoeleinden als bedoeld in het zesde lid.


