  - number: '2.13'
    text: |-
      1 Bij de opzet van een reductieprogramma als bedoeld in [artikel 2.29, tweede lid, van het besluit][ref1], worden
      in ieder geval de volgende factoren betrokken:

      a. indien vervangingsproducten met weinig of geen oplosmiddelen nog in ontwikkeling zijn, heeft degene die een
      oplosmiddeleninstallatie drijft, extra tijd voor de uitvoer van het reductieprogramma;

      b. het referentiepunt voor de emissiebeperking komt zo goed mogelijk overeen met de emissie die het resultaat zou
      zijn als er geen beperkende maatregelen zouden worden genomen.

      2 Aan een gelijkwaardige emissiebeperking als bedoeld in [artikel 2.29, tweede lid, van het besluit][ref2]
      wordt bij een oplosmiddeleninstallatie waar voor het product een constant gehalte aan vaste stof kan worden
      aangenomen, in ieder geval voldaan indien de feitelijke emissie van oplosmiddelen, bepaald aan de hand van de
      oplosmiddelenboekhouding, kleiner is dan of gelijk is aan de beoogde emissie, die als volgt wordt berekend:

      a. bereken de jaarlijkse referentie-emissie als volgt:

      1°. bepaal de totale massa aan vaste stof in de hoeveelheid coating, inkt, lak of kleefstof die per jaar wordt
      gebruikt, waarbij onder vaste stof wordt verstaan elk materiaal in coating, inkt, lak en kleefstof dat vast wordt
      wanneer het water of de vluchtige organische stoffen zijn verdampt, en

      2°. vermenigvuldig de bepaalde massa vaste stof met de in tabel 2.13 vermelde toepasselijke
      vermenigvuldigingsfactor;

      b. vermenigvuldig de jaarlijkse referentie-emissie met het in tabel 2.13 vermelde toepasselijke reductiepercentage.

      3 De vermenigvuldigingsfactor, bedoeld in het tweede lid, mag voor een individuele oplosmiddeleninstallatie worden
      aangepast om rekening te houden met een aangetoonde stijging van het rendement bij het gebruik van vaste stoffen.


