  - number: 4.65a
    text: |-
      1 Aan [artikel 4.54a, derde lid, van het besluit][ref1] wordt, voor zover het betreft het schoonbranden van
      metalen waarbij gebruik wordt gemaakt van een elektrische oven, in ieder geval voldaan indien de uit de oven
      afgezogen dampen via condensatie of absorptie worden behandeld en teruggeleid naar de oven zonder dat een emissie
      naar de lucht optreedt.

      2 Aan [artikel 4.54a, derde lid, van het besluit][ref2] wordt, voor zover het betreft het schoonbranden van
      metalen waarbij gebruik wordt gemaakt van een gasgestookte oven met een capaciteit kleiner dan 5 ton te reinigen
      product, in ieder geval voldaan indien:

      a. de rookgassen uit de oven worden geleid door een naverbrander, die geschikt is om aan
      [artikel 4.54a, derde lid][ref3], te voldoen en zo is ingeregeld dat:

      1°. tot het einde van de cyclus de temperatuur ten minste 850°C is;

      2°. de naverbrander op temperatuur is voordat het schoonbranden begint;

      3°. de verblijftijd van de rookgassen ten minste twee seconden is, en

      4°. de emissieconcentratie van koolmonoxide niet meer dan 100 milligram per normaal kubieke meter is;

      b. de rookgassen alleen via de naverbrander uit de oven kunnen worden afgevoerd;

      c. het temperatuurverloop van oven en naverbrander continu geregistreerd wordt, en

      d. de oven en de naverbrander in goede staat van onderhoud verkeren, periodiek gecontroleerd worden en zo vaak als
      voor de goede werking nodig is, worden schoongemaakt en vervangen.

      3 Aan [artikel 4.54a, derde lid, van het besluit][ref4] wordt, voor zover het betreft het schoonbranden van
      metalen waarbij gebruik wordt gemaakt van een gasgestookte oven met een capaciteit groter dan of gelijk aan 5 ton
      te reinigen product, in ieder geval voldaan indien:

      a. de rookgassen uit de oven worden geleid door een naverbrander, die geschikt is om aan
      [artikel 4.54a, derde lid][ref5], te voldoen en zo is ingeregeld dat:

      1°. tot het einde van de cyclus de temperatuur ten minste 850°C is;

      2°. de naverbrander op temperatuur is voordat het schoonbranden begint;

      3°. de verblijftijd van de rookgassen ten minste twee seconden is, en

      4°. de emissieconcentratie van koolmonoxide niet meer dan 100 milligram per normaal kubieke meter is;

      b. de rookgassen alleen via de naverbrander uit de oven kunnen worden afgevoerd;

      c. het zuurstofpercentage in de rookgassen na de naverbrander ten minste 6% is;

      d. via beveiligingen is geborgd dat het schoonbranden niet kan starten indien de naverbrander niet werkt, en dat de
      naverbrander niet kan worden uitgeschakeld indien de oven in bedrijf is;

      e. de maximale belading van de oven is vastgesteld, en niet kan worden overschreden;

      f. de nabrandtijd van de naverbrander vast staat ingesteld op de waarde die in een controlemeting bij de maximale
      belading is vastgesteld en voldoende is om bij maximale belading alle dampen te verbranden;

      g. het temperatuurverloop van oven en naverbrander continu geregistreerd wordt;

      h. het zuurstofgehalte en het koolmonoxidegehalte van de rookgassen continu worden gemeten en geregistreerd, en

      i. de oven en de naverbrander in goede staat van onderhoud verkeren, ten minste een maal per twaalf maanden worden
      gecontroleerd en zo vaak als voor de goede werking nodig is, worden schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.54a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.54a
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4.54a
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel4.54a
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel4.54a
