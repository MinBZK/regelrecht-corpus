        artikel: '3.4'
        hoofdstuk: '3'
        paragraaf: 3.1.1
        afdeling: '3.1'
  - number: '3.3'
    text: |-
      1 Een zuiveringsvoorziening bestaat uit een septic tank:

      a. met een nominale inhoud van ten minste 6 kubieke meter,

      b. die voldoet aan NEN-EN 12566-1, en

      c. met een hydraulisch rendement van ten hoogste 10 gram, bepaald overeenkomstig annex B van NEN-EN 12566-1.

      2 Het eerste lid is niet van toepassing op een zuiveringsvoorziening die is geplaatst voor 1 januari 2009, indien
      die zuiveringsvoorziening bestaat uit een septic tank, die een nominale inhoud heeft van ten minste 6 kubieke meter
      en waarbij:

      a. de septic tank uit drie compartimenten bestaat;

      b. de nominale inhoud, in de stroomrichting, over de compartimenten is verdeeld in de verhouding twee staat tot één
      staat tot één;

      c. de scheidingswanden tussen de compartimenten van de septic tank ten minste 20 centimeter boven het waterniveau
      uitsteken;

      d. de instroomopening in het eerste compartiment van de septic tank zich ten minste 10 centimeter boven het
      waterniveau bevindt;

      e. de toevoerpijp ten minste 5 centimeter en ten hoogste 10 centimeter uit de binnenwand steekt;

      f. de doorstroomopeningen in scheidingswanden tussen de compartimenten van de septic tank zodanig zijn uitgevoerd,
      dat:

      1°. de doorvoer van bodemslib en drijflagen wordt voorkomen;

      2°. de gezamenlijke oppervlakte van de doorstroomopeningen per scheidingswand ten minste 100 vierkante centimeter
      en ten hoogste 400 vierkante centimeter bedraagt;

      3°. de bovenkant van de doorstroomopeningen ten minste 30 centimeter onder het waterniveau ligt, en

      4°. de onderkant van de doorstroomopeningen hoger ligt dan de helft van de waterhoogte gemeten vanaf de bodem van
      de septic tank;

      g. de afvoeropening van een septic tank voorzien is van een duikschot of een T-stuk zodat afvoer van bodemslib of
      drijflagen wordt voorkomen, en

      h. de waterhoogte in een septic tank ten minste 1,2 meter bedraagt en ten hoogste bedraagt:

      1°. 2,2 meter bij een inhoud van ten hoogste 10 kubieke meter;

      2°. 2,5 meter bij een inhoud van meer dan 10 kubieke meter.

      3 Indien afzonderlijke septic tanks als bedoeld in het tweede lid parallel zijn geschakeld, bedraagt de
      gezamenlijke nominale inhoud ten minste 6 kubieke meter en voldoet iedere tank afzonderlijk aan de voorschriften
      genoemd in het tweede lid, onderdelen a tot en met h.

      4 Opdeling van de septic tank, bedoeld in het tweede lid, in afzonderlijke in serie geschakelde tanks is
      toegestaan, mits de nominale inhoud van één compartiment niet over verschillende tanks is verdeeld. De
      afzonderlijke septic tanks gelden samen als één septic tank.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.3
  - number: '3.4'
    text: |-
      Een zuiveringsvoorziening

      a. is goed toegankelijk, en

      b. wordt zo vaak als voor de goede werking daarvan nodig is onderhouden.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.4
  - number: 3.4a
    text: |-
      1 Bij het in werking hebben van een zuiveringstechnisch werk verkeert de installatie in goede staat van onderhoud
      en worden bij onderhoudswerkzaamheden zodanige maatregelen getroffen dat geurhinder bij geurgevoelige objecten
      zoveel mogelijk wordt voorkomen dan wel voor zover dat niet mogelijk is tot een aanvaardbaar niveau wordt beperkt.

      2 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt maatwerkvoorschriften
      stellen waarin maatregelen als bedoeld in het eerste lid worden geconcretiseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.4a
  - number: 3.4b
    text: |-
      1 De geurbelasting, bedoeld in de
      [artikel 3.5b, eerste, tweede en vijfde tot en met het achtste lid, van het besluit][ref1], wordt bepaald met de
      rekenmethode van het Nieuw Nationaal Model (Uitgave 1998, ISBN 90-76323-003) of een daaraan gelijkwaardige methode.

      2 De geuremissie vanuit een zuiveringstechnisch werk is de som van de emissies door de verschillende
      procesonderdelen, uitgedrukt in odour units per seconde, die worden bepaald met behulp van de emissiefactoren,
      genoemd in [bijlage 5][ref2] bij deze regeling.

      3 Indien voor een procesonderdeel als bedoeld in het tweede lid geen emissiefactor is opgenomen in
      [bijlage 5][ref3], kan het bevoegd gezag bij maatwerkvoorschrift aanvullend geuronderzoek eisen, dat wordt
      uitgevoerd overeenkomstig NTA 9065.

      4 Het bevoegd gezag kan, indien de geurhinder als gevolg van het opslaan en verladen van slib een aanvaardbaar
      niveau overschrijdt en [artikel 3.5b, eerste, tweede en vijfde tot en met het achtste lid, van het besluit][ref4]
      niet toereikend zijn om de overschrijding ongedaan te maken, aanvullend maatwerkvoorschriften stellen met
      betrekking tot de technische voorzieningen in het zuiveringtechnisch werk en te treffen gedragsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.5b
      [ref2]: https://wetten.overheid.nl/BWBR0022830
      [ref3]: https://wetten.overheid.nl/BWBR0022830
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel3.5b
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.4b
