  - number: '3.71'
    text: |-
      1 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau
      beperken van geurhinder als bedoeld in [artikel 3.54 van het besluit][ref1] wordt bij het opslaan van vloeibare
      bijvoedermiddelen voldaan aan het tweede en derde lid.

      2 Het opslaan van vloeibare bijvoedermiddelen vindt plaats in een gesloten systeem.

      3 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt, overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref2] bij maatwerkvoorschrift eisen stellen aan:

      a. de aard van de bijvoedermiddelen;

      b. het gekoeld opslaan van de bijvoedermiddelen, of

      c. de situering van het opslaan van de bijvoedermiddelen ten opzichte van geurgevoelige objecten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.54
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
