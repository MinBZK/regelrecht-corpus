  - number: '3.7'
    text: |-
      1 De concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof en onverbrande koolwaterstoffen (CH,
      uitgedrukt in C) in het rookgas worden bepaald door continue of afzonderlijke meting.

      2 In afwijking van het eerste lid wordt de concentratie aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof
      en onverbrande koolwaterstoffen (CH, uitgedrukt in C) in het rookgas bepaald door continue meting, indien ter
      bestrijding van de uitworp rookgasreiniging of andere emissiereductietechnieken worden toegepast.

      3 In afwijking van het tweede lid kan worden volstaan met afzonderlijke metingen, indien een logboek van
      registraties wordt bijgehouden waaruit met een voldoende mate van zekerheid blijkt dat de rookgasreiniging
      of andere emissiereductietechnieken continu in bedrijf zijn en de betreffende emissiegrenswaarden niet worden
      overschreden.

      4 De concentraties van stoffen waarvoor emissiegrenswaarden zijn vastgesteld worden voor een vervangende
      stookinstallatie als bedoeld in [artikel 3.10h van het besluit][ref1] binnen vier weken na de inbedrijfstelling
      van die vervangende installatie bepaald door middel van een afzonderlijke meting.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.10h
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 3.10h
  - number: 3.7a
    text: |-
      1 Onverminderd de [artikelen 3.7][ref1] en [3.7e][ref2] worden voor het bepalen van de concentraties stoffen in het
      rookgas, representatieve metingen verricht.

      2 De bemonsteringen, analyses en metingen van de parameters die nodig zijn voor het bepalen van het voldoen aan de
      emissiegrenswaarden alsmede de andere metingen en berekeningen die zijn voorgeschreven, worden uitgevoerd volgens
      onderstaande normbladen:

      a. emissiemeting:

      1°. stikstofoxiden (NO): NEN-EN 14792;

      2°. zwaveldioxide (SO): NEN-EN 14791;

      3°. onverbrande koolwaterstoffen (CH): NEN-EN 12619;

      4°. totaal stof: NEN-EN 13284-1 of NEN-EN 13284-2;

      5°. zuurstof (O): NEN-EN 14789.

      b. monstername betreffende de onder a genoemde stoffen: NEN-EN 15259.

      3 Bij toepassing van de normbladen, bedoeld in het tweede lid, onder a, worden de regels voor de meetlocatie,
      bedoeld in NEN-EN 15259 toegepast.

      4 Het uitvoeren van afzonderlijke metingen, parallelmetingen en referentiemetingen geschiedt door een instantie die
      is geaccrediteerd door een accreditatie-instantie.

      5 In afwijking van het tweede lid, onder a, en het vierde lid, mag een afzonderlijke meting aan een
      middelgrote stookinstallatie vallend onder [§3.2.1 van het besluit][ref3] worden uitgevoerd overeenkomstig
      Scope 6 van de Deelregeling voor stookinstallaties, onderdeel uitmakende van de Certificatieregeling voor het
      kwaliteitsmanagementsysteem ten behoeve van de uitvoeren van onderhoud en inspecties aan technische installaties,
      van de stichting SCIOS, door een bedrijf dat beschikt over een geldig certificaat, afgegeven door een instantie die
      door een accreditatie-instantie is geaccrediteerd, om uitvoering te kunnen geven aan genoemde deelregeling.

      6 Bij het uitvoeren handelingen als bedoeld in het tweede lid, aanhef en onderdeel a, onder 1, 2 en 5 kunnen tot
      [1 april 2019] onderstaande normbladen worden toegepast:

      a. NEN-EN 14792:2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van massaconcentratie aan
      stikstofoxiden (NO) – Referentiemethode – Chemiluminescentie, december 2005,

      b. NEN-EN 14 791, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de massaconcentratie aan
      zwaveldioxide – Referentiemethode, november 2005, respectievelijk

      c. NEN-EN 14 789, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de volumeconcentratie
      van zuurstof (O) – Referentiemethode – Paramagnetisme, november 2005.

      7 Bij het uitvoeren van handelingen als bedoeld in het tweede lid, onderdeel a, onder 4, kunnen tot en met
      31 december 2020 NEN-EN 13284-1, 2001: Europese norm voor Emissies van stationaire bronnen – Bepaling van
      massaconcentratie van stof in lage concentraties – Deel 1: Manuele gravimetrische methode, december 2001 of NEN-
      EN 13284-2, 2004: Europese norm voor Emissies van stationaire bronnen – Bepaling van massaconcentratie van stof in
      lage concentraties – Deel 2: Geautomatiseerde meetsystemen, september 2004, worden toegepast.


