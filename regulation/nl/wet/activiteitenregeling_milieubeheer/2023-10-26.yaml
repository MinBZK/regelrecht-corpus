  - number: 4.84k
    text: |-
      Aan [artikel 4.74r van het besluit][ref1] wordt bij het breken van steenachtig materiaal in de buitenlucht in
      ieder geval voldaan indien het te breken materiaal door besproeiing vochtig wordt gehouden en de dosering van het
      sproeiwater zodanig is afgestemd op de behoefte dat hierbij geen afvalwater vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74r
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84k
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 4.74r
  - number: 4.84l
    text: |-
      Aan [artikel 4.74s, eerste lid, van het besluit][ref1] wordt bij het inpandig breken van steenachtig materiaal
      in ieder geval voldaan indien de via ontluchtingsopeningen ontwijkende lucht door een filtrerende afscheider wordt
      gevoerd die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede
      werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74s
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84l
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 4.74s
  - number: 4.84m
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies en het bevorderen van een
      doelmatige verspreiding van emissies naar de buitenlucht, bedoeld in [artikel 4.74s van het besluit][ref1], worden
      bij het inpandig breken van steenachtig materiaal de emissies overeenkomstig artikel 4.74s, tweede lid, van het
      besluit die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van
      een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      of op een bedrijventerrein met minder dan één gevoelig gebouw per hectare.

      2 Het bevoegd gezag kan in het belang van de luchtkwaliteit en maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de lucht, bedoeld in
      [artikel 4.74s, tweede lid, van het besluit][ref2].

      3 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref3], is het
      eerste lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref4] nodig is en voor zover de emissies als bedoeld in het eerste lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      4 In afwijking van het derde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het tweede lid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74s
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74s
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
