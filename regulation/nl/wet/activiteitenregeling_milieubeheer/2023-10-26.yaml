  - number: 3.27l
    text: |-
      1 Ten behoeve van het doelmatig verspreiden van emissies, het voorkomen, dan wel zoveel mogelijk beperken van
      geurhinder en het voorkomen dan wel zoveel mogelijk beperken van luchtverontreiniging door benzeen als bedoeld in
      [artikel 3.26e van het besluit][ref1], bij mechanische ventilatie in een parkeergarage die deel uitmaakt van een
      inrichting met ten minste 20 parkeerplaatsen:

      a. worden de aanzuigopeningen ten behoeve van de ventilatie in een verkeersluwe omgeving, of, indien dat niet
      mogelijk is, op ten minste vijf meter boven het straatniveau en buiten de beïnvloeding van de uitblaasopeningen
      aangebracht;

      b. wordt de uit de parkeergarage afgezogen lucht verticaal uitgeblazen op ten minste 5 meter boven het straatniveau
      of, indien binnen 25 meter van de uitblaasopening een gebouw is gelegen met een hoogste daklijn die meer dan vijf
      meter boven het straatniveau is gelegen, ten minste één meter boven de hoogste daklijn van dat gebouw;

      c. bedraagt de snelheid van de uitgeblazen lucht, gemeten bij de rand van de uitblaasopening, ten minste tien meter
      per seconde.

      2 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref2], is het
      eerste lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref3] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26e
