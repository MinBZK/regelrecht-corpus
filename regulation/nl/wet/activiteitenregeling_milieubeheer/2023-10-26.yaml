  - number: '2.11'
    text: |-
      1 Degene die een oplosmiddeleninstallatie drijft, meet continu of een afgaskanaal, waarop nabehandelingsapparatuur
      is aangesloten en die aan de uitlaatzijde gemiddeld in totaal meer dan 10 kilogram totaal organische koolstof
      per uur uitwerpt, voldoet aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29 van het besluit][ref1].

      2 In een oplosmiddeleninstallatie die gemiddeld in totaal minder dan 10 kilogram totaal organische koolstof per uur
      uitwerpt, voert degene die de oplosmiddeleninstallatie drijft, om de drie jaar metingen uit van totaal organische
      koolstof, waarbij gedurende elke meting ten minste drie meetresultaten worden geregistreerd.

      3 Metingen ter controle op de naleving van de emissiegrenswaarden zijn niet vereist indien nabehandelingsapparatuur
      niet noodzakelijk is om te voldoen aan het [besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.29
      [ref2]: https://wetten.overheid.nl/BWBR0022762
