  - number: 4.102c
    text: |-
      1 Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, worden gassen en dampen
      die vrijkomen bij het offsetdrukproces, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder, worden de overeenkomstig het eerste lid afgezogen dampen en gassen, indien deze op de buitenlucht
      worden geëmitteerd, ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen
      gebouwen afgevoerd.

      3 Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.

      4 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege onvoldoende
      verspreiding van afgezogen dampen, geuremissies die niet via de afzuiging worden afgevoerd of incidentele
      geurpieken in aanvulling op het tweede lid overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref1]
      maatwerkvoorschriften stellen met betrekking tot:

      a. de situering van de afvoerpijp;

      b. het voorkomen of beperken van diffuse geuremissies; of

      c. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      5 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref2], is het
      tweede lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref3] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      6 In afwijking van het vijfde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het vierde lid
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
