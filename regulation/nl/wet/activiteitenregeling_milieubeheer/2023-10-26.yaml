  - number: '3.120'
    text: |-
      Aan [artikel 3.165, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen stofemissies die vrijkomen bij het coaten van planten of onderdelen van planten door middel
      van het vernevelen met een nevelspuit en de emissies die vrijkomen bij het coaten door middel van het
      opbrengen van poeder, worden afgezogen en worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 3.165, eerste lid, van het besluit][ref2] te voldoen, en

      b. die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.165
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.165
