  - number: '3.36'
    text: |-
      1 Een kathodische bescherming wordt ten minste eens per jaar op zijn goede werking gecontroleerd overeenkomstig
      het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit.

      2 Plaatsen waar de uitwendige bekleding van de installatie is beschadigd en die niet kunnen worden gerepareerd,
      worden kathodisch beschermd indien de isolatieweerstand van de uitwendige bekleding groter is dan 25 kOhm per
      vierkante meter, bepaald volgens een daartoe krachtens het [Besluit bodemkwaliteit][ref2] aangewezen normdocument,
      door een instelling, die daartoe beschikt over een erkenning op grond van dat besluit.

      3 Indien uit de controle, bedoeld in het eerste lid, blijkt dat de kathodische bescherming niet goed functioneert,
      wordt deze direct hersteld overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref3] aangewezen
      normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit.

      4 Indien een ondergrondse opslagtank van staal of de daarbij behorende stalen leidingen of appendages niet
      zijn voorzien van een kathodische bescherming, wordt ten minste eens per jaar een stroomopdrukproef uitgevoerd
      overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref4] aangewezen normdocument door een
      instelling, die voor deze werkzaamheid beschikt over een erkenning op grond van dat besluit, tenzij beschadiging
      van de tankinstallatie door zwerfstromen niet te verwachten is.

      5 Bij een ondergrondse opslagtank van staal waarin vloeibare brandstof wordt opgeslagen, vindt jaarlijks
      een controle plaats op de aanwezigheid van water en bezinksel overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref5] aangewezen normdocument door een instelling, die voor deze werkzaamheid beschikt
      over een erkenning op grond van dat besluit.

      6 Indien tijdens de controle, bedoeld in het vijfde lid, water of bezinksel is aangetroffen, wordt dit terstond
      verwijderd. Van het verwijderde water worden de elektrische geleidbaarheid en de zuurgraad beoordeeld. Wanneer bij
      de derde opeenvolgende meting blijkt dat de zuurgraad en de elektrische geleidbaarheid van het in het bezinksel
      aangetroffen water buiten de normeisen vallen, wordt een inwendige inspectie van de ondergrondse opslagtank
      uitgevoerd. Indien een inwendige inspectie noodzakelijk is, wordt dit terstond gemeld aan het bevoegd gezag.

      7 In afwijking van het vijfde lid vindt de controle, bedoeld in dat lid, eenmaal per drie jaar plaats indien de
      opslagtank aantoonbaar is voorzien van een inwendige coating overeenkomstig BRL K779 en die coating is aangebracht
      door een bedrijf dat daartoe is gecertificeerd op basis van BRL K790.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
