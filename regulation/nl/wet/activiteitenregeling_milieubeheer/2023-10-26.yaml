  - number: '4.39'
    text: |-
      Aan [artikel 4.21, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen stofemissies die vrijkomen bij mechanische bewerking van hout, kurk, dan wel van houten,
      kurken of houtachtige voorwerpen worden gevoerd door een filtrerende afscheider, die geschikt is om aan
      [artikel 4.21, eerste lid van het besluit][ref2] te voldoen; en

      b. de filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


