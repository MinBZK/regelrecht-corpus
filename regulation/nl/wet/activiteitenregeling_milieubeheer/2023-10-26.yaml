  - number: 3.71d
    text: |-
      1 Een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages voor het opslaan van
      gasolie is geïnstalleerd en wordt onderhouden en gerepareerd overeenkomstig BRL K903 door een persoon of instelling
      die is gecertificeerd overeenkomstig die BRL. De opslagtank met de daarbij behorende leidingen en appendages
      wordt beoordeeld en goedgekeurd overeenkomstig BRL K903 door een persoon of instelling die is gecertificeerd
      overeenkomstig dat document.

      2 Ondergrondse leidingen inclusief appendages worden beoordeeld en goedgekeurd overeenkomstig AS 6800 door een
      persoon of instelling die beschikt over een erkenning overeenkomstig dat document.

      3 De opslagtank met de daarbij behorende leidingen en appendages wordt gecontroleerd overeenkomstig AS 6800 door
      een persoon of instelling die beschikt over een erkenning overeenkomstig dat document.

      4 Het opslaan van gasolie in een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en
      appendages voldoet aan de volgende onderdelen van PGS 30:

      a. de paragrafen 2.2 en 2.3;

      b. de voorschriften 2.4.3, 2.6.1, 2.6.3 tot en met 2.6.6 en 2.6.14, en

      c. paragraaf 4.2, met uitzondering van de voorschriften 4.2.3, 4.2.9, 4.2.12, 4.2.13, eerste volzin, 4.2.14 en
      tabel 4.1.

      5 Een opslagtank als bedoeld in het eerste lid bevindt zich niet op een verdieping.

      6 Het gebruik van een opslagtank waarin het opslaan, vullen en afleveren van gasolie plaatsvindt in een stationaire
      bovengrondse opslagtank met de daarbij behorende leidingen en appendages, voldoet aan de volgende onderdelen van
      PGS 30:

      a. voorschrift 3.2.4;

      b. de paragrafen 3.3, 3.5, 3.6, 5.2, 5.4, en

      c. de voorschriften 5.5.1, 5.5.2, 5.6.1, 5.6.3 en 5.6.4.

      7 Een stationaire bovengrondse opslagtank voor het inpandig opslaan van gasolie in een werkruimte, in een ruimte
      met een noodstroomaggregaat of onder een woning heeft een inhoud van ten hoogste 3 kubieke meter.

      8 Voor een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages gelden de keurings-
      en herkeuringstermijnen van tabel 3.71d.


