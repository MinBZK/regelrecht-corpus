  - number: 1.3c
    text: |-
      1 Onverminderd [artikel 1.3b][ref1] valt een stof in ieder geval in de stofcategorie zeer zorgwekkende stoffen,
      bedoeld in [artikel 1.1, derde lid, van het besluit][ref2] en [tabel 2.5 van het besluit][ref3] en is in ieder
      geval een zeer zorgwekkende stof als bedoeld in [artikel 2.3b, tweede lid, van het besluit][ref4], indien deze stof
      voorkomt op:

      a. bijlage VI van EG-verordening indeling, etikettering en verpakking van stoffen en mengsels, en is ingedeeld als
      carcinogeen, mutageen of reprotoxisch, categorie 1a of categorie 1b;

      b. de inventaris van geclassificeerde stoffen als bedoeld in artikel 42, eerste lid, van EG-verordening indeling,
      etikettering en verpakking van stoffen en mengsels, en is ingedeeld als carcinogeen, mutageen of reprotoxisch,
      categorie 1a of categorie 1b;

      c. de kandidatenlijst, bedoeld in artikel 59 van EG-verordening registratie, evaluatie en autorisatie van chemische
      stoffen;

      d. bijlage XIV van EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;

      e. bijlage I, II, III of IV van Verordening (EU) nr. 2019/1021 van het Europees Parlement en de Raad van 20 juni
      2019 betreffende persistente organische verontreinigende stoffen (PbEU 2019, L 169);

      f. de lijst van stoffen voor prioritaire actie die is vastgesteld op grond van artikel 6 van het op 22 september
      1992 te Parijs tot stand gekomen OSPAR Verdrag inzake de bescherming van het mariene milieu in het noordoostelijk
      deel van de Atlantische Oceaan, met Bijlagen en Aanhangsels (Trb. 1993, 16 en 141, 1998, 169, 2000, 74, 2001, 157,
      2008, 60 en 203, 2011, 231), of

      g. bijlage X van de kaderrichtlijn water, voor zover een stof in die bijlage is aangewezen als prioritaire
      gevaarlijke stof.

      2 Onverminderd het eerste lid valt een stof tevens in de stofcategorie zeer zorgwekkende stoffen en is tevens een
      zeer zorgwekkende stof als bedoeld in het eerste lid indien deze stof voldoet aan de vastgestelde wetenschappelijke
      criteria voor het bepalen van hormoonontregelende eigenschappen als bedoeld in:

      a. artikel 5, derde lid, van Verordening (EU) Nr. 528/2012 van het Europees Parlement en de Raad van 22 mei 2012
      betreffende het op de markt aanbieden en het gebruik van biociden (PbEU L167), of

      b. bijlage II, paragraaf 3.6.5, van Verordening (EG) Nr. 1107/2009 van het Europees Parlement en de Raad van
      21 oktober 2009 betreffende het op de markt brengen van gewasbeschermingsmiddelen en tot intrekking van de
      Richtlijnen 79/117/EEG en 91/414/EEG van de Raad (PbEU L 309).

      3 Een wijziging van de bijlagen, lijsten, inventaris dan wel criteria, bedoeld in het eerste en tweede lid,
      gaat voor de toepassing van het eerste lid gelden met ingang van de dag waarop aan de desbetreffende wijziging
      uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt een
      ander tijdstip wordt vastgesteld.


