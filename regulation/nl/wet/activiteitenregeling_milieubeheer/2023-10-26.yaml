      1 Ten behoeve van een evenredige verdeling van de stallucht over het aanstroomoppervlak van het filterpakket van
      het luchtwassysteem als bedoeld in [artikel 3.125, derde lid, van het besluit][ref1] wordt voldaan aan het tweede
      tot en met vijfde lid.

      2 Het doorstroomoppervlak van het luchtkanaal bedraagt ten minste een vierkante centimeter per kubieke meter lucht
      bij de maximale capaciteit van het luchtwassysteem.

      3 De afstand tussen de ventilatoren die de lucht uit het huisvestingssysteem zuigen en het filterpakket is ten
      minste drie meter.

      4 In afwijking van het derde lid bedraagt de vrije ruimte voor het filterpakket ten minste een meter als de
      ventilatoren na het filterpakket zijn geplaatst.

      5 Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van de afstand, bedoeld in het derde lid.

      6 Indien voor het filterpakket een reinigingsstap is geplaatst zonder filterpakket worden de afstanden, bedoeld in
      het derde en vierde lid, gemeten tot deze reinigingsstap.

      7 Het eerste tot en met zesde lid is niet van toepassing indien de drukkamer, bedoeld in
      [artikel 3.97, onder e][ref2], voor 1 januari 2013 in gebruik was en bouwkundige aanpassing van de drukkamer
      redelijkerwijs niet kan worden gevergd.


