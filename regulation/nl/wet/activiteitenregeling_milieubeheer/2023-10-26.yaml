  - number: 4.49e
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.31d van het besluit][ref1] vindt het:

      a. mengen van rubbercompounds;

      b. verwerken van rubber of thermoplastisch kunststof waarbij gebruik wordt gemaakt van een installatie met een
      olie- of koelvloeistofcircuit, of

      c. verwerken van polyesterhars, waaronder tevens wordt verstaan het reinigen van de daarbij gebruikte apparatuur,

      plaats boven een bodembeschermende voorziening.

      2 Bij de aanleg van de bodembeschermende voorziening voor het mengen van rubbercompounds, bedoeld in het eerste
      lid, onder a, wordt bijzondere aandacht besteed aan toevoer- en aftappunten van de menginstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.31d
