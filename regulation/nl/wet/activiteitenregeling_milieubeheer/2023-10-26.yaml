  - number: 3.27k
    text: |-
      Aan [artikel 3.26b, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. op jaarbasis minder dan 5000 autowrakken worden gedemonteerd, of

      b. de afgezogen emissies die vrijkomen bij het ontsteken van airbags en gordelspanners worden gevoerd door een
      filtrerende afscheider die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26b
