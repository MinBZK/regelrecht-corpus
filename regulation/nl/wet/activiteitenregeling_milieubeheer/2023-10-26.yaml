  - number: '3.6'
    text: |-
      1 Een meting als bedoeld in [artikel 3.10j van het besluit][ref1] voldoet aan de eisen in de
      [artikelen 3.7 tot en met 3.7j][ref2].

      2 Ten behoeve van het doelmatige beheer van afvalwater, bedoeld in [artikel 3.10k van het besluit][ref3] voldoet
      het spuien van een stoomketel aan [artikel 3.7k][ref4].

      3 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.10o van het besluit][ref5] voldoet een stookinstallatie aan [artikel 3.7l][ref6].

      4 Ten behoeve van keuring van en onderhoud op veilig functioneren, optimale verbranding en energiezuinigheid van
      een stookinstallatie als bedoeld in [artikel 3.10p van het besluit][ref7], voldoet een stookinstallatie aan de
      [artikelen 3.7m tot en met 3.7p][ref8].

      5 Het eerste lid is niet van toepassing op de uitstoot van totaal stof, stikstofoxiden (NO) of koolmonoxiden (CO),
      indien voldaan wordt aan [artikel 3.5][ref9].


