  - number: '4.11'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt theatervuurwerk opgeslagen in ten minste een brandveiligheidsopslagkast die
      voldoet aan de voorschriften 3.3.1 tot en met 3.3.3 van PGS 15. De brandwerendheid van de kast bedraagt ten minste
      60 minuten. De kast wordt niet afgezogen.

      2 Inbeslaggenomen vuurwerk met aan consumentenvuurwerk vergelijkbare eigenschappen dat wordt opgeslagen in
      politiebureaus wordt opgeslagen in ten minste een brandveiligheidsopslagkast die voldoet aan de voorschriften 3.3.1
      tot en met 3.3.3 van PGS 15. De brandwerendheid van de kast bedraagt ten minste 60 minuten. De kast wordt niet
      afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.11
  - number: '4.12'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt rookzwak kruit ten minste opgeslagen in een brandcompartiment. Binnen het
      brandcompartiment wordt het rookzwak kruit opgeslagen in vakken. De vakken zijn vervaardigd van 105 millimeter
      metselwerk voor de wanden, en 70 millimeter beton voor de horizontale verdeling. Per vak is maximaal 1 kilogram
      rookzwak kruit aanwezig in de standaardverpakking . Voor de vakken is minimaal 1 meter vrije ruimte aanwezig. De
      toegang tot het brandcompartiment bestaat uit een deur die 60 minuten brandwerend is, zelfsluitend is uitgevoerd,
      naar buiten opent en als drukontlasting kan fungeren.

      2 Het kruit, bedoeld in het eerste lid, wordt zodanig opgeslagen dat er minimaal 10 centimeter ruimte tussen de
      voorzijde van het vak en de voorzijde van de fles met rookzwak kruit aanwezig is.

      3 Het eerste lid en tweede lid, zijn van overeenkomstige toepassing op de opslag van zwart kruit met dien verstande
      dat van zwart kruit niet meer dan 250 gram per vak aanwezig is.

      4 Noodsignalen worden opgeslagen in een brandcompartiment dan wel in een brandveiligheidsopslagkast die voldoet aan
      de voorschriften 3.3.1 tot en met 3.3.3 van PGS 15. De brandwerendheid van de kast bedraagt ten minste 60 minuten.
      De kast wordt niet afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.12
  - number: 4.12a
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift het voorschrift 3.3.3 van PGS 15 niet van toepassing verklaren, mits
      aanvullende eisen worden gesteld aan de brandwerende voorzieningen of branddetectie of aan de aanwezigheid van
      deskundig personeel binnen de inrichting als bedoeld in voorschrift 3.14.1 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.12a
  - number: '4.13'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan als bedoeld
      in [artikel 4.6 van het besluit][ref1], voldoet de opslag van halfzware olie, polyesterhars, stoffen van klasse
      8 van het ADR verpakkingsgroep II en III zonder bijkomend gevaar, PER of stoffen van klasse 5.1 van het ADR in
      bovengrondse opslagtanks aan de [artikelen 4.14 tot en met 4.19b][ref2].

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.6 van het besluit][ref3], voldoet de opslag van vloeibare bodembedreigende stoffen als bedoeld in
      [artikel 4.4a, onder f, van het besluit][ref4], in een bovengrondse opslagtank aan [artikel 4.18][ref5].

      3 Ten behoeve van:

      a. het voorkomen dan wel, voor zover dat niet mogelijk, is het zoveel mogelijk beperken van verontreiniging van een
      oppervlaktewaterlichaam, bedoeld in [artikel 4.6 van het besluit][ref6]; en

      b. het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het
      zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de
      gevolgen hiervan, bedoeld in [artikel 4.6 van het besluit][ref7],

      voldoet de opslag van halfzware olie, stoffen van klasse 8 van het ADR verpakkingsgroep II en III zonder bijkomend
      gevaar, PER, stoffen van klasse 5.1 van het ADR, polyesterhars of andere vloeibare bodembedreigende stoffen, in een
      opslagtank boven een oppervlaktewaterlichaam aan [artikel 4.18a][ref8].


