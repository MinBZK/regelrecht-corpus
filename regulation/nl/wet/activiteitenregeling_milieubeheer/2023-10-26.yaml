  - number: '4.72'
    text: |-
      Aan [artikel 4.60, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de totale oppervlakte van de aanwezige beits- en etsbaden met eenzelfde werkzame badvloeistof minder bedraagt
      dan 3 vierkante meter, de temperatuur van de baden niet hoger is dan 50 graden Celsius en er geen agitatie van de
      vloeistof in de baden plaatsvindt; of

      b. de afgezogen emissies die vrijkomen bij het elektrolytisch of stroomloos beitsen en etsen
      van metalen worden gevoerd door een gaswasser of aërosol- of mistfilter die geschikt is om aan
      [artikel 4.60, eerste lid, van het besluit][ref2] te voldoen; en die gaswasser of aërosol- of mistfilter in goede
      staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede werking nodig is wordt
      schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.60
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.60
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.72
