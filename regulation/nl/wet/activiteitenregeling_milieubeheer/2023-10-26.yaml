  - number: 3.4q
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan spoorbruggen, bevat de
      hulpconstructie in afwijking van de [artikelen 3.4l tot en met 3.4p][ref1] aan de bovenzijde geen hulpconstructie
      en aan de in- en uitrijrichting geen zijwand en lopen de zijwanden maximaal twee meter boven het te behandelen deel
      van het object door.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4l
