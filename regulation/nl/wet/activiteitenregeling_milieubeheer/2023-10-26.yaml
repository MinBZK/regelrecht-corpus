        artikel: 3.16f
      - id: ref2
        bwb_id: BWBR0022762
        artikel: 3.16e
  - number: 3.16e
    text: |-
      1 Een installatie voor het verwarmen van wissels waarbij vloeibare bodembedreigende stoffen worden gebruikt, wordt
      uitgevoerd als een gesloten systeem.

      2 De controle, het onderhoud en het beheer van de wisselverwarmingseenheden, bedoeld in het eerste lid, zijn in
      eenduidige bedrijfsinterne procedures en werkinstructies ter bescherming van de bodem vastgelegd.

      3 In de bedrijfsinterne procedures en werkinstructies, bedoeld in het tweede lid, is ten minste aangegeven op welke
      wijze:

      a. de staat en goede werking van wisselverwarmingseenheden wordt gecontroleerd;

      b. er voor zorg wordt gedragen dat zo vaak als de omstandigheden daarom vragen inspecties op morsingen en lekkages
      plaatsvinden, en

      c. is gewaarborgd dat gemorste of gelekte stoffen direct worden opgeruimd.

      4 Degene die de inrichting drijft draagt er zorg voor dat de medewerkers die binnen de inrichting bodembedreigende
      activiteiten verrichten, op de hoogte zijn van de bedrijfsinterne procedures en werkinstructies, bedoeld in het
      tweede lid, dat deze worden nageleefd en binnen de inrichting zodanig aanwezig zijn dat een ieder daarvan op
      eenvoudige wijze kennis kan nemen.

      5 Morsingen en lekkages worden overeenkomstig de bedrijfsinterne procedures en werkinstructies, bedoeld in het
      tweede lid, verholpen en opgeruimd.

      6 Degene die de inrichting drijft draagt er zorg voor dat de in het kader van de bedrijfsinterne procedures
      en werkinstructies noodzakelijke absorptiemiddelen en andere materialen en middelen ter bescherming van de
      bodem binnen de inrichting in voldoende mate aanwezig zijn en dat er voldoende in het gebruik van deze middelen
      geïnstrueerd personeel aanwezig is.

      7 Bevindingen van controles van of onderhoud aan wisselverwarmingseenheden, alsmede acties genomen na incidenten
      met bodembedreigende stoffen, die mogelijk hebben geleid tot een bodemverontreiniging, worden opgenomen in een
      logboek dat te allen tijde beschikbaar is voor het bevoegd gezag.

      8 [Artikel 2.11 van het besluit][ref1] is niet van toepassing op wisselverwarmingseenheden die vloeibare
      bodembedreigende stoffen bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.16e
