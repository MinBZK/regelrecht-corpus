  - number: 3.7e
    text: |-
      1 Afzonderlijke metingen zijn representatief voor normale bedrijfsvoering met het brandstofmengsel dat de hoogste
      emissie zal opleveren.

      2 Een afzonderlijke meting bij een ketelinstallatie wordt verricht bij een belasting van meer dan 60 procent. Een
      afzonderlijke meting bij een dieselmotor, een gasmotor of een gasturbine, wordt verricht bij de hoogste belasting,
      waarbij deze continu kan worden bedreven.

      3 Een afzonderlijke meting bij een gasturbine, met een bijbehorende ketelinstallatie, wordt verricht bij een
      bijstook van ten hoogste 10% in de bijbehorende ketelinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7e
  - number: 3.7f
    text: |-
      1 Continue meting voor de bepaling van de concentratie van zwaveldioxide (SO), stikstofoxiden (NO), totaal stof of
      onverbrande koolwaterstoffen (CH, uitgedrukt in C) vindt plaats door:

      a. rechtstreekse continue meting van de concentratie in het rookgas, of

      b. continue meting van de parameters van de voor een stookinstallatie vastgestelde uitworpkarakteristiek.

      2 De kwaliteitsborging van de ter controle van de emissiegrenswaarden geïnstalleerde apparatuur en toegepaste
      uitworpkarakteristieken voldoen aan NEN-EN 14181. De resultaten van de in het kader van deze norm uitgevoerde
      jaarlijkse controlemetingen worden door degene die de inrichting drijft, ter beschikking van het bevoegd gezag
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7f
  - number: 3.7g
    text: |-
      Bij een continue meting als bedoeld in [artikel 3.7f][ref1] wordt aan een emissiegrenswaarde voldaan indien geen
      daggemiddelde die emissiegrenswaarde overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.7f
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7g
