      waarnemingen. Bij het bepalen van de meetonzekerheid wordt het gemiddelde van de deelmetingen, bedoeld in
      [artikel 2.22][ref1], gecorrigeerd voor het aantal deelmetingen. De meetonzekerheid wordt berekend als percentage
      van de grenswaarde.

      2 Voor de elementen, genoemd in tabel 2.23, bedraagt de maximale meetonzekerheid als percentage van de
