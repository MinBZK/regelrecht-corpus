    text: |-
      1 Aan de [artikelen 4.40, eerste lid][ref1], [4.41, eerste lid][ref2], en [4.42, eerste lid, van het besluit][ref3]
      wordt in ieder geval voldaan indien de afgezogen lucht afkomstig van alle klassen laswerkzaamheden wordt
      gerecirculeerd.

      2 Bij laswerkzaamheden klasse III wordt aan [artikel 4.40, eerste lid, van het besluit][ref4] in ieder geval
      voldaan indien per jaar niet meer dan 6.500 kilogram lastoevoegmateriaal en -elektroden wordt verbruikt. Op verzoek
      van het bevoegd gezag wordt aangetoond wat het jaarverbruik is aan lastoevoegmateriaal en -elektroden.

      3 Bij laswerkzaamheden klasse III wordt aan [artikel 4.40, eerste lid, van het besluit][ref5] in ieder geval
      voldaan indien:

      a. de afgezogen lasrook die vrijkomt voordat deze wordt afgevoerd, wordt gevoerd door een filtrerende afscheider of
      elektrostatisch filter, die geschikt is om aan [artikel 4.40, eerste lid, van het besluit][ref6] te voldoen; en

      b. die filtrerende afscheider of het elektrostatisch filter in goede staat van onderhoud verkeert, deze periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.

      4 Indien bij laswerkzaamheden klasse IV niet wordt gerecirculeerd als bedoeld in het eerste lid, wordt in ieder
      geval aan [artikel 4.40, eerste lid, van het besluit][ref7] voldaan, indien:

      a. de afgezogen lasrook die vrijkomt, voordat deze wordt afgevoerd, wordt gevoerd door een filtrerende afscheider
      of elektrostatisch filter die geschikt is om aan [artikel 4.40, eerste lid, van het besluit][ref8] te voldoen; en

      b. die filtrerende afscheider of elektrostatisch filter in goede staat van onderhoud verkeert, deze periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.

      5 Bij laswerkzaamheden klasse V, VI en VII waarbij roestvast gelast wordt met beklede elektroden of met MAG gevulde
      draad, of indien andere materialen gelast worden met gelegeerde elektrode of met gelegeerde gevulde draad, wordt
      aan de [artikelen 4.40, eerste lid][ref9], en [4.41, eerste lid, van het besluit][ref10] in ieder geval voldaan
      indien per jaar niet meer dan 200 kilogram lastoevoegmateriaal en -elektroden wordt gebruikt. Op verzoek van het
      bevoegd gezag wordt aangetoond wat het jaarverbruik is aan lastoevoegmateriaal en -elektroden.

      6 Bij laswerkzaamheden klasse V, VI en VII waarbij roestvast staal gelast wordt met beklede elektroden of met MAG
      gevulde draad, of indien andere materialen gelast worden met gelegeerde elektrode of met gelegeerde gevulde draad,
      wordt aan de [artikelen 4.40, eerste lid][ref11] en [4.41, eerste lid, van het besluit][ref12] in ieder geval
      voldaan indien:

      a. de afgezogen lasrook die vrijkomt voordat deze wordt afgevoerd, wordt gevoerd door een filtrerende
      afscheider of elektrostatisch filter die geschikt is om aan de [artikelen 4.40, eerste lid][ref13], en
      [4.41, eerste lid, van het besluit][ref14] te voldoen; en

      b. die filtrerende afscheider of het elektrostatisch filter in goede staat van onderhoud verkeert, deze periodiek
      wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.

      7 Bij laswerkzaamheden klasse V, VI en VII, waarbij met loodmenie geverfd staal wordt gelast en niet wordt
      gerecirculeerd als bedoeld in het eerste lid, wordt in ieder geval aan de [artikelen 4.40, eerste lid][ref15], en
      [4.41, eerste lid, van het besluit][ref16] voldaan indien:

      a. de afgezogen emissies van lood- en loodverbindingen die vrijkomen bij het lassen van met loodmenie
      geverfd staal worden gevoerd door een filtrerende afscheider of elektrostatisch filter die geschikt is om aan
      [artikel 4.42, eerste lid, van het besluit][ref17] te voldoen; en

      b. die filtrerende afscheider of het elektrostatisch filter in goede staat van onderhoud verkeert, deze periodiek
      wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.


