  - number: 3.37a
    text: |-
      1 Een betonnen constructie die geheel of gedeeltelijk ondergronds ligt en wordt gebruikt voor het opslaan van een
      vloeibare bodembedreigende stof is gemaakt van een betonklasse die aantoonbaar bestand is tegen de inwerking van de
      opgeslagen stof.

      2 De vul- en aftappunten van een betonnen constructie die geheel of gedeeltelijk ondergronds ligt en wordt
      gebruikt voor het opslaan van een vloeibare bodembedreigende stof zijn geplaatst boven een lekbak of boven een
      vloeistofdichte vloer of verharding.

      3 Een betonnen constructie die geheel of gedeeltelijk ondergronds ligt en wordt gebruikt voor het opslaan van
      een vloeibare bodembedreigende stof wordt jaarlijks leeggemaakt en visueel aan de binnenzijde geïnspecteerd. De
      toestand van de binnenzijde van de constructie wordt gefotografeerd of op een vergelijkbare manier vastgelegd,
      zodat de vergelijking met eerdere en latere inspecties gemaakt kan worden en wordt ten minste gedurende 6 jaar
      bewaard. Indien bij de inspectie verwering of beschadiging wordt geconstateerd, wordt de constructie gerepareerd
      voordat deze weer in gebruik wordt genomen.

      4 Uiterlijk 6 jaar na ingebruikname en vervolgens ten minste iedere 6 jaar wordt de visuele inspectie uitgevoerd
      door degene die de constructie heeft geplaatst of een andere door het bevoegd gezag geaccepteerde deskundige.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.37a
  - number: '3.38'
    text: |-
      1 Bij het opslaan van stoffen in ondergrondse opslagtanks van metaal of kunststof alsmede het vullen en legen van
      deze opslagtanks wordt voldaan aan de volgende onderdelen van PGS 28:

      a. de voorschriften 2.3.3 en 3.2.3 tot en met 3.2.5;

      b. de paragrafen 3.3 en 5.2;

      c. de voorschriften 5.7.2 en 5.7.3, en

      d. de voorschriften 6.2.6 en 6.2.8.

      2 Indien een ondergrondse opslagtank die gebruikt is voor opslag van afgewerkte olie gebruikt gaat worden voor
      het opslaan van een andere vloeistof dan afgewerkte olie vindt voor de wisseling van de opgeslagen vloeistof een
      beoordeling en goedkeuring van de opslagtank plaats overeenkomstig [artikel 3.35, eerste en tweede lid][ref1].

      3 Het legen van een ondergrondse opslagtank met afgewerkte olie vindt plaats overeenkomstig paragraaf 3.5 van PGS
      28.

      4 In afwijking van het eerste lid voldoet de opslag van een organisch oplosmiddel als bedoeld in
      [artikel 3.29, eerste lid, onderdelen c tot en met i, van het besluit][ref2] in ondergrondse opslagtanks alsmede
      het vullen en legen van deze opslagtanks aan de paragrafen 2.3 tot en met 2.3.2, 3.1, 3.2.1, 3.2.2, 5.2, 5.3.2,
      5.3.3, 5.4, 5.6, 6.2.2, 6.3 en 6.8 van PGS 31.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.35
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.29
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.38
