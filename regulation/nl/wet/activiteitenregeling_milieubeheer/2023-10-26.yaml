        artikel: 3.5b
  - number: 3.4c
    text: |-
      Ten behoeve van het realiseren van een aanvaardbaar bodemrisico voldoet het ontwerp- en aanlegproces van bassins,
      tanks en leidingen in de waterlijn vanaf het ontvangstwerk tot de selector of de beluchtingstank aan CUR/PBV-
      Aanbeveling 51 en CUR/PBV-Aanbeveling 65 met uitzondering van de eisen gesteld in de paragrafen 4.1, 5.1, 6.1.1, en
      6.1.2 van CUR/PBV-Aanbeveling 51, alsmede paragraaf 5.2.1 van de CUR/PBV-Aanbeveling 65.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.4c
  - number: 3.4d
    text: |-
      1 Ten behoeve van het realiseren van een aanvaardbaar bodemrisico gebeurt de controle op de lekdichtheid van de
      bedrijfsonderdelen van de zuiveringstechnische werken, bedoeld in [artikel 3.5a van het besluit][ref1], met een
      grondwatermonitoringssysteem dat bestaat uit:

      a. een horizontaal monitoringssysteem bij installaties aangelegd op of na 1 januari 2012,

      b. verticale peilbuizen bij installaties aangelegd voor die datum.

      2 In afwijking van het eerste lid kan gebruik worden gemaakt van geo-electrische metingen met een meetfrequentie
      van eenmaal per zes jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.5a
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.4d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 3.5a
  - number: 3.4e
    text: |-
      1 Het horizontaal monitoringssysteem, bedoeld in [artikel 3.4d, eerste lid, onder a][ref1], bestaat uit
      horizontale buizen die zich bevinden maximaal om de 30 meter.

      2 Indien binnen een afstand van 60 meter, gemeten van hart tot hart, meerdere bassins of tanks zijn gesitueerd,
      wordt een extra horizontale buis geplaatst.

      3 Indien bassins of tanks op meer dan 60 meter, gemeten van hart tot hart, van elkaar zijn gesitueerd, wordt om de
      30 meter een horizontale buis geplaatst.

      4 Bij de plaatsing van de horizontale buizen wordt rekening gehouden met de stroomrichting van het grondwater.

      5 De verticale peilbuizen, bedoeld in [artikel 3.4d, eerste lid, onder b][ref2], bevinden zich maximaal om de
      30 meter.

      6 Indien binnen een afstand van 60 meter, gemeten van hart tot hart, meerdere bassins of tanks zijn gesitueerd,
      wordt een extra verticale peilbuis geplaatst.

      7 Indien bassins of tanks op meer dan 60 meter, gemeten van hart tot hart, van elkaar zijn gesitueerd, wordt om de
      30 meter een verticale peilbuis geplaatst.

      8 De verticale peilbuis alsmede de plaatsing voldoet aan NEN 5766.

      9 De verticale peilbuizen worden benedenstrooms ten opzichte van de stroming van het grondwater geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4d
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4d
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.4e
