      1 Binnen de inrichting is een logboek of systeem aanwezig waarin de volgende zaken worden vastgelegd:

      a. de onderhouds- en controleresultaten, bedoeld in [artikel 4.112, negende lid][ref1], en de meetwaarden, bedoeld
      in artikel 4.112, achtste lid;

      b. de opgetreden storingen of andere onregelmatigheden die van invloed kunnen zijn op de luchtemissie, onder
      vermelding van de datum, het tijdstip en de aard van de storing alsmede de genomen acties om de storing ongedaan te
      maken en voor de toekomst te voorkomen;

      c. de gebruiksintensiteit van de strooivelden, bedoeld in [artikel 4.114, derde, vierde en vijfde lid][ref2];

      d. de rapporten, bedoeld in [artikel 4.114, derde en vierde lid][ref3].

      2 Het logboek is voor inzage door het bevoegd gezag beschikbaar.


