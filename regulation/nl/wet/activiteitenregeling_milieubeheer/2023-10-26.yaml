  - number: '3.108'
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 3.143 van het besluit][ref1], wordt stofklasse S dat vrijkomt bij het schieten op een binnenschietbaan,
      voor zover dat redelijkerwijs mogelijk is, doelmatig afgezogen.

      2 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht als bedoeld in
      [artikel 3.143 van het besluit][ref2], worden de afgezogen emissies die vrijkomen bij het schieten op een
      binnenschietbaan en die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen
      50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.

      3 Het bevoegd gezag kan in het belang van de luchtkwaliteit en maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.143
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.143
