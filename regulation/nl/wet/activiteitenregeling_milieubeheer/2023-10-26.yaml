      1 Ten behoeve van het voorkomen of beperken van slagschaduw en lichtschittering is de windturbine voorzien van
      een automatische stilstandvoorziening die de windturbine afschakelt indien slagschaduw optreedt ter plaatse van
      gevoelige objecten voor zover de afstand tussen de windturbine en de gevoelige objecten minder dan 12 maal de
      rotordiameter bedraagt en gemiddeld meer dan 17 dagen per jaar gedurende meer dan 20 minuten per dag slagschaduw
      kan optreden en voor zover zich in de door de slagschaduw getroffen uitwendige scheidingsconstructie van gevoelige
      gebouwen of woonwagens ramen bevinden. De afstand geldt van een punt op ashoogte van de windturbine tot de gevel
      van het gevoelige object.

      2 Een maatwerkvoorschrift ten behoeve van het voorkomen of beperken van hinder door slagschaduw dat voor een
      windturbine op 30 juni 2022 van kracht was op grond van een besluit krachtens [artikel 3.12, tweede lid][ref1],
      blijft van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.12
