  - number: '4.87'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico wordt een op de wal geplaatste vaste installatie
      voor het afleveren van vloeibare brandstoffen aan vaartuigen opgesteld boven een lekbak of een vloeistofdichte
      vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.87
  - number: 4.87a
    text: |-
      1 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      verontreiniging van een oppervlaktewaterlichaam wordt bij het afleveren van vloeibare brandstoffen aan vaartuigen
      voldaan aan het tweede tot en met het vijfde lid.

      2 Het afleveren van vloeibare brandstoffen aan vaartuigen vindt zodanig plaats dat morsen van brandstof zoveel
      mogelijk wordt voorkomen. De gemorste brandstof wordt direct opgenomen met daarvoor geschikte absorptiemiddelen.

      3 Het vulpistool of het uiteinde van de vulleiding van een installatie voor het afleveren van vloeibare
      brandstoffen aan vaartuigen op een bunkerstation wordt weggehangen boven een lekbak.

      4 Een installatie voor het afleveren van vloeibare brandstoffen aan vaartuigen wordt niet gebruikt voor het vullen
      van jerrycans en andere vaten met vloeibare brandstoffen.

      5 Het afleveren van vloeibare brandstoffen aan vaartuigen vanuit een op de wal geplaatste vaste afleverinstallatie
      vindt plaats met een vulleiding met overvulbeveiliging en automatisch uitschakelinrichting die het bunkeren bij een
      tankvulstand van 97% onderbreken of een vulpistool dat is voorzien van een automatisch afslagmechanisme.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.87a
  - number: 4.87b
    text: |-
      Indien blijkt dat bij het afleveren van vloeibare brandstoffen aan vaartuigen en het vullen van de beladingstanks
      van een bunkerstation de geurhinder een aanvaardbaar niveau overschrijdt, kan het bevoegd gezag overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref1] maatwerkvoorschriften stellen met betrekking tot de situering
      van de emissiepunten waar dampen van brandstof vrijkomen, of de toepassing van dampretourvoorzieningen of andere
      systemen om de dampen gericht af te zuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.87b
