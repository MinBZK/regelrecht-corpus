    text: |-
      1 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R4-techniek wordt de vloer van de
      hulpconstructie als bedoeld in [artikel 3.4m, eerste lid][ref1] vloeistofdicht uitgevoerd en wordt de
      hulpconstructie uitgebreid met zijwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 bij 0,4 millimeter,
      die aansluiten op de vloer en minimaal 1 meter boven het te behandelen deel van het object uitsteken.

      2 Bij het lozen van de in de hulpconstructie opgevangen vloeistof bedraagt het gehalte aan onopgeloste bestanddelen
      niet meer dan 50 milligram per liter.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4m
