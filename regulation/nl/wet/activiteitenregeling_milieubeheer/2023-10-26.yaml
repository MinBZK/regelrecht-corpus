  - number: 3.27h
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 3.26a van het besluit][ref1] wordt bij het demonteren van
      LPG-tanks en de opslag van de gedemonteerde LPG-tanks ten minste voldaan aan het tweede tot en met zesde lid.

      2 Het aftappen van LPG uit een LPG-tank bij een inrichting type B is niet toegestaan.

      3 Het demonteren van een LPG-tank geschiedt in de open lucht of in een goed geventileerde ruimte.

      4 De gedemonteerde LPG-tanks waarvan LPG nog niet is afgetapt, worden bij een inrichting type B ten minste eenmaal
      per zes maanden uit de inrichting afgevoerd.

      5 Bij een inrichting type B zijn maximaal 24 gedemonteerde LPG-tanks aanwezig, waarvan LPG nog niet is afgetapt.

      6 Gedemonteerde LPG-tanks waarvan LPG nog niet is afgetapt, worden als zodanig aangeduid en gescheiden opgeslagen
      van de LPG-tanks waarvan LPG is afgetapt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26a
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.27h
