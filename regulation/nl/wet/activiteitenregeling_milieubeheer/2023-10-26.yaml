  - number: '3.37'
    text: |-
      1 Een ondergrondse opslagtank met de daarbij behorende leidingen en appendages die is afgekeurd, wordt binnen acht
      weken na afloop van de termijn, bedoeld in [artikel 3.35, tweede lid][ref1], verwijderd.

      2 Degene die een ondergrondse opslagtank overeenkomstig het eerste lid verwijdert, verwijdert de ondergrondse
      opslagtank met de daarbij behorende leidingen en appendages binnen acht weken na het verstrijken van de
      keuringstermijn. Indien verwijdering als gevolg van de ligging redelijkerwijs niet kan worden gevergd wordt de
      ondergrondse opslagtank met de daarbij behorende leidingen en appendages binnen acht weken na het verstrijken van
      de keuringstermijn onklaar gemaakt.

      3 Het verwijderen of het onklaar maken van een ondergrondse opslagtank met de daarbij behorende leidingen
      en appendages geschiedt overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref2] aangewezen
      normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit en wordt ten minste
      tien dagen voor aanvang van de werkzaamheden schriftelijk gemeld aan het bevoegd gezag.

      4 Na het verwijderen of het onklaar maken van de ondergrondse opslagtank met de daarbij behorende leidingen en
      appendages wordt een door een bedrijf als bedoeld in het derde lid, opgestelde schriftelijke rapportage van het
      verwijderen of het onklaar maken binnen drie maanden na afronding van de werkzaamheden aan het bevoegd gezag
      overgelegd. In deze rapportage worden ten minste vermeld:

      a. het adres waar de opslagtank is gelegen met een nadere aanduiding van de situering;

      b. de vloeistoffen die in de opslagtank opgeslagen zijn geweest, en

      c. indien de opslagtank onklaar gemaakt is, de wijze van het onklaar maken en de toegepaste vulmassa.

      5 Voordat een ondergrondse opslagtank onklaar wordt gemaakt wordt deze inwendig gereinigd.

      6 Indien de ondergrondse opslagtank onklaar wordt gemaakt, wordt de ondergrondse opslagtank na het inwendig
      reinigen gevuld met een inerte vulmassa overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref3]
      aangewezen normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit en wordt
      het vulpunt verwijderd, dan wel worden andere maatregelen getroffen, die verder gebruik voorkomen.

      7 Het inwendig reinigen van een ondergrondse opslagtank vindt plaats overeenkomstig een krachtens het
      [Besluit bodemkwaliteit][ref4] aangewezen normdocument, door een instelling, die daartoe beschikt over een
      erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.35
      [ref2]: https://wetten.overheid.nl/BWBR0022929
      [ref3]: https://wetten.overheid.nl/BWBR0022929
