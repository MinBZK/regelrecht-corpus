  - number: 4.84h
    text: |-
      Aan [artikel 4.74j, tweede lid, van het besluit][ref1] wordt bij het doseren en mengen ten behoeve van de
      vervaardiging van betonmortel in ieder geval voldaan indien de via ontluchtingsopeningen ontwijkende lucht door een
      filtrerende afscheider wordt gevoerd die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo
      vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74j
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84h
    references:
