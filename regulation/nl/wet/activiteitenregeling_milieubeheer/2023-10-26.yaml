      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.109 van het besluit][ref1] wordt bij het composteren voldaan aan het tweede tot en met vierde lid.

      2 Indien binnen een periode van drie jaar gedurende een periode die langer is dan twee weken, maar korter dan
      negen maanden, op één plaats wordt gecomposteerd, is de composteringshoop in de periode van 1 november tot 1 maart
      afgedekt met vezeldoek, antiworteldoek of gelijkwaardig materiaal.

      3 Indien binnen een periode van drie jaar gedurende een periode die langer is dan negen maanden op één plaats wordt
      gecomposteerd, is de composteringshoop:

      a. in de periode van 1 september tot en met 31 maart afgedekt met vezeldoek, antiworteldoek of gelijkwaardig
      materiaal, en

      b. geplaatst boven een adsorberende laag met een dikte van ten minste 0,15 meter en een organische stofgehalte van
      ten minste 25%.

      4 Indien de composteringshoop wordt verwijderd, wordt de adsorberende laag, bedoeld in het derde lid, onderdeel b,
      eveneens verwijderd.


