    text: |-
      1 Onverminderd [artikel 3.49][ref1] wordt aan de [artikelen 3.38][ref2] en
      [3.32, aanhef en onder a en b, van het besluit][ref3] bij continu mechanisch transport van goederen behorend tot
      stofklasse S1 en S3 van bijlage 3 bij het besluit in ieder geval voldaan indien deze in een gesloten systeem worden
      getransporteerd, waarbij:

      a. de inlaat- en afwerpzijde van de transporteur zijn omkast, deze omkasting continu wordt afgezogen en het
      afgezogen stof zoveel mogelijk wordt teruggevoerd in de productstroom, of

      b. de inlaat- en afwerpzijde van de transporteur zijn voorzien van een afscherming in de vorm van
      windreductieschermen of sproeiers.

      2 Onverminderd [artikel 3.49][ref4] wordt aan de [artikelen 3.38, tweede lid, van het besluit][ref5] en
      [3.32, aanhef en onder a en b, van het besluit][ref6] bij continu mechanisch transport van goederen behorend tot
      stuifklasse S2 en S4 van [bijlage 3 bij het besluit][ref7] in ieder geval voldaan indien:

      a. goederen die in een open systeem worden getransporteerd zodanig worden bevochtigd, dat verstuiving wordt
      voorkomen, of

      b. open transportsystemen in de buitenlucht worden afgeschermd tegen windinvloeden door middel van langsschermen,
      dwarsschermen of halfronde overkappingen.

      3 Onverminderd [artikel 3.49][ref8] wordt aan de [artikelen 3.38][ref9] en
      [3.32, aanhef en onder a en b, van het besluit][ref10] bij continu mechanisch transport van goederen behorend tot
      stuifklasse S3 van bijlage 3 bij het besluit in ieder geval voldaan indien goederen in open transportsystemen in
      de buitenlucht worden afgeschermd tegen windinvloeden door middel van langsschermen, dwarsschermen of halfronde
      overkappingen.


