  - number: 3.71a
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 3.54b van het besluit][ref1] wordt bij het vullen van
      gasflessen voldaan aan het tweede tot en met het zesde lid.

      2 Bij het vullen van gasflessen is ten hoogste 300 liter aan gassen in flessen aanwezig.

      3 Het vullen van gasflessen met een waterinhoud van ten hoogste 5 liter waarbij wordt gevuld uit een gasfles met
      een maximale waterinhoud van 30 liter voldoet aan de voorschriften 4.1.3 tot en met 4.1.7, 4.1.9, 4.1.11 van de
      PGS 23.

      4 Het vullen van gasflessen als bedoeld in het derde lid vindt plaats op ten minste 5 meter van de erfgrens en op
      ten minste 15 meter van open vuur.

      5 Het vullen van gasflessen anders dan bedoeld in het derde lid voldoet aan de volgende onderdelen van de PGS 23:

      a. voorschrift 3.3.3;

      b. [paragraaf 3.5][ref2];

      c. [paragrafen 4.1.3 tot en met 4.2.3][ref3];

      d. [paragraaf 4.3][ref4].

      6 In afwijking van het vijfde lid kan het bevoegd gezag voor het vullen van gasflessen anders dan bedoeld in het
      derde lid bij maatwerkvoorschrift andere eisen stellen ten behoeve van het voorkomen van risico's voor de omgeving
      en ongewone voorvallen, dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico's voor
      de omgeving, de kans dat ongewone voorvallen zich voordoen en de gevolgen van ongewone voorvallen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.54b
