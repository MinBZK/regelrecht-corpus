  - number: 3.71i
    text: |-
      Aan [artikel 3.54g, eerste lid, onder a, van het besluit][ref1] wordt in een inrichting van de Nederlandse of
      bondgenootschappelijke krijgsmacht in ieder geval voldaan, indien:

      a. het opslaan van ontplofbare stoffen of voorwerpen voldoet aan de bepalingen 4101, 6101, 6103, 6105, eerste
      volzin, 6107, 6151, eerste en tweede lid, 6152, eerste tot en met derde lid, 6153, 6158 tot en met 6161, 6301, 6302
      en 6911 van de MP40-21;

      b. het voorhanden hebben van ontplofbare stoffen of voorwerpen op een opstelplaats voldoet aan de bepalingen 16103
      tot en met 16107 van de MP40-21;

      c. het onderhoud aan of de modificatie van ontplofbare stoffen of voorwerpen plaatsvindt volgens de bepalingen
      4101, 6101, 6103, 6105, eerste volzin, 6107, 6151, derde lid, 6152 eerste tot en met derde lid, 6153, 6158 tot en
      met 6161, 6301, 6302 en 12102 van de MP40-21, en

      d. incidenteel onderhoud of modificatie van ontplofbare stoffen of voorwerpen plaatsvindt volgens de bepalingen
      13403 en 13405 van de MP40-21.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.54
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.71i
