  - number: 3.27d
    text: |-
      1 Ten behoeve van:

      a. een doelmatig beheer van afvalstoffen als bedoeld in het [artikel 3.26a van het besluit][ref1],

      b. het voorkomen of beperken van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, bedoeld in [artikel 3.26a van het besluit][ref2], en

      c. het realiseren van een verwaarloosbaar bodemrisico, bedoeld in [artikel 3.26a van het besluit][ref3],

      wordt bij het bewerken van autowrakken of wrakken van tweewielige motorvoertuigen in een inrichting waar
      autowrakken of wrakken van tweewielige motorvoertuigen worden gedemonteerd, voldaan aan het tweede tot en met
      zevende lid.

      2 Zo spoedig mogelijk, doch uiterlijk binnen tien werkdagen na ontvangst van het autowrak of wrak van een
      tweewielig motorvoertuig, worden de volgende stoffen, preparaten of producten, indien aanwezig, afgetapt of
      gedemonteerd en opgeslagen:

      a. motorolie;

      b. transmissieolie;

      c. versnellingsbakolie;

      d. olie uit het differentieel;

      e. hydraulische olie;

      f. remvloeistoffen;

      g. koelvloeistoffen;

      h. ruitensproeiervloeistoffen;

      i. airconditioningsvloeistoffen;

      j. benzine;

      k. diesel;

      l. LPG-tank, inclusief LPG;

      m. accu, inclusief accuzuren;

      n. oliefilter;

      o. PCB/PCT-houdende condensatoren;

      p. batterijen; en

      q. ontplofbare onderdelen voor zover deze niet zijn geneutraliseerd, met uitzondering van elektrische airbags en
      gordelspanners.

      3 Restanten van vloeistoffen worden zo goed mogelijk uit leidingen afgetapt. De aftappunten worden na het aftappen
      afgesloten.

      4 Indien dat noodzakelijk is voor de recycling als product van gedemonteerde onderdelen kan in afwijking van
      het tweede lid worden afgezien van het aftappen van de oliën uit de in dat lid genoemde onderdelen en kan het
      oliefilter worden teruggeplaatst.

      5 Autowrakken worden binnen de inrichting ontdaan van de volgende stoffen, preparaten of producten:

      a. banden, glas en grote kunststofonderdelen, zoals bumpers, instrumentenborden en vloeistoftanks, indien deze
      materialen tijdens het shredderproces niet zodanig gescheiden worden dat ze als materiaal kunnen worden gerecycled;

      b. metalen onderdelen die koper, aluminium of magnesium bevatten indien deze metalen niet tijdens het
      shredderproces worden gescheiden;

      c. katalysatoren;

      d. onderdelen die lood, kwik, cadmium of zeswaardig chroom bevatten en als zodanig zijn voorzien van een
      aanduiding;

      e. elektrische airbags en gordelspanners, voor zover deze niet zijn geneutraliseerd.

      6 Een autowrak wordt niet op een zodanig wijze geplet, geknipt of anderszins mechanisch verkleind dat de identiteit
      of de inhoud daarvan niet meer herkenbaar is.

      7 Wrakken van tweewielige motorvoertuigen worden binnen de inrichting ontdaan van stoffen, preparaten of producten
      als bedoeld in het vijfde lid, onderdelen d en e.


