  - number: '3.25'
    text: |-
      1 Het afleveren van vloeibare brandstof aan motorvoertuigen voor het wegverkeer of aan spoorvoertuigen vindt plaats
      boven een vloeistofdichte vloer of verharding.

      2 De vloeistofdichte vloer of verharding, bedoeld in het eerste lid, is aangelegd overeenkomstig het daartoe
      krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een bedrijf, dat daartoe beschikt over
      een erkenning op grond van dat besluit en strekt zich, voor zover erfafscheidingen, gebouwen en andere fysieke
      begrenzingen dit toelaten, vanaf de afleverzuil uit over een afstand van ten minste de lengte van de afleverslang
      plus één meter, met een minimum van vijf meter. Indien de vloeistofdichte vloer of verharding zich daardoor zou
      uitstrekken tot over de openbare weg dan strekt deze vloer of verharding zich uit tot de openbare weg met dien
      verstande dat deze afstand niet minder bedraagt dan drie meter. In de laatste situatie is de afleverslang niet
      langer dan vier meter. Aan de zijde waar geen tankende voertuigen kunnen worden opgesteld strekt de vloeistofdichte
      vloer of verharding zich uit tot een afstand van ten minste één meter vanaf het hart van de afleverzuil.

      3 De afwateringssystemen van de vloeistofdichte vloer of verharding zijn vloeistofdicht uitgevoerd overeenkomstig
      het daartoe krachtens het [Besluit bodemkwaliteit][ref2] aangewezen normdocument, door een instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit. Terstond na de installatie en beproeving op dichtheid wordt
      de riolering afgedekt.

      4 Een afleverinstallatie is geplaatst boven een vloeistofdichte vloer of verharding. Doorvoeringen door en
      afsluitingen van deze vloeistofdichte vloer of verharding zijn eveneens vloeistofdicht.

      5 Gelekte vloeistoffen worden vanaf de vloeistofdichte vloer of verharding, bedoeld in het vierde lid, afgevoerd
      naar het afwateringssysteem of naar de in het eerste lid bedoelde vloeistofdichte vloer of verharding. Indien
      gebruik wordt gemaakt van afsluiters of terugslagkleppen zijn deze geplaatst boven een vloeistofdichte vloer of
      verharding.

      6 Pompeilanden en aanwezige doorvoeren zijn vloeistofdicht en zijn aangelegd overeenkomstig het daartoe krachtens
      het [Besluit bodemkwaliteit][ref3] aangewezen normdocument, door een instelling, die daartoe beschikt over een
      erkenning op grond van dat besluit.

      7 In afwijking van het eerste tot en met het zesde lid vindt het afleveren van vloeibare brandstof aan
      motorvoertuigen of aan spoorvoertuigen, waarbij minder dan 25 kubieke meter per jaar wordt afgeleverd, plaats boven
      een bodembeschermende voorziening.

      8 In afwijking van het tweede lid is een mobiele afleverinstallatie opgesteld op een vloeistofdichte vloer of
      verharding die reikt tot ten minste 1 meter buiten de projectie van de afleverinstallatie.

      9 Bij het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig wordt voldaan aan de volgende
      onderdelen:

      a. het spoorvoertuig staat zodanig opgesteld boven een vloeistofdichte vloer of verharding dat het vulpunt zich ten
      minste 1 meter van de rand van de vloeistofdichte vloer of verharding bevindt,

      b. de tankwagen staat bij het afleveren boven een bodembeschermende voorziening die aansluit op de vloeistofdichte
      vloer of verharding, en

      c. de afleverslang van de tankwagen komt niet buiten het geheel van de vloeistofdichte vloer of verharding en de
      bodembeschermende voorziening en kruist geen sporen.

      10 Op de vloeistofdichte vloer of verharding, bedoeld in het negende lid, zijn het derde tot en met het zesde lid
      van overeenkomstige toepassing.

      11 Het afleveren van ureum aan motorvoertuigen voor het wegverkeer of aan spoorvoertuigen vindt plaats boven
      de bodembeschermende voorziening die op grond van het eerste tot en met tiende lid is voorgeschreven voor het
      afleveren van vloeibare brandstof.

      12 Het derde lid is niet van toepassing totdat er een algehele renovatie van de tankinstallatie plaatsvindt waarbij
      de vloeistofdichte vloer of verharding wordt opengebroken of indien de afleverinstallatie wordt vervangen.


