  - number: 3.71e
    text: |-
      De opslag van gasolie in mobiele bovengrondse opslagtanks inclusief de bijbehorende leidingen en appendages,
      voldoet aan bijlage D van PGS 30.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.71e
  - number: 3.71f
    text: |-
      1 De opslag van gasolie, smeerolie en afgewerkte olie in bovengrondse opslagtanks vindt plaats boven een lekbak.

      2 Het eerste lid is niet van toepassing op een opslagtank die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie zijnde:

      a. een elektronisch lekdetectiesysteem volgens de BRL K910, dat ten minste eenmaal per jaar wordt beoordeeld en is
      goedgekeurd overeenkomstig BRL K903, door een bedrijf dat gecertificeerd is op grond van die BRL, of

      b. een lekdetectiepotsysteem volgens BRL K796, dat ten minste eenmaal per maand wordt gecontroleerd op goede
      werking. Bij het constateren van gebreken wordt het lekdetectiepotsysteem binnen een periode van een maand
      hersteld. Eenmaal per jaar wordt van de controle een aantekening in het installatieboek gemaakt.

      3 De vulpunten en aftappunten van een bovengrondse opslagtank met gasolie, smeerolie en afgewerkte olie zijn
      geplaatst boven een vloeistofdichte vloer of verharding of boven of in een lekbak.

      4 De opslagtank is voorzien van een overvulbeveiliging.

      5 Het vierde lid is niet van toepassing op een opslagtank voor afgewerkte olie die handmatig of onder vrij verval
      gevuld wordt.

      6 Boven de lekbak, bedoeld in het eerste lid, vindt geen opslag van andere gevaarlijke stoffen plaats, indien die
      kunnen reageren met de stoffen in de bovengrondse opslagtank.

      7 Een stalen opslagtank voor afgewerkte olie wordt minimaal eenmaal per jaar geleegd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.71f
  - number: 3.71g
    text: |-
      1 De opslag van gasolie, smeerolie en afgewerkte olie in bovengrondse opslagtanks boven een oppervlaktewaterlichaam
      vindt plaats boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en in staat is de bij
      normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen.

      2 Het eerste lid is niet van toepassing op een opslagtank die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie zijnde:

      a. een elektronisch lekdetectiesysteem volgens de BRL K910, dat ten minste eenmaal per jaar wordt beoordeeld en is
      goedgekeurd overeenkomstig BRL K903, door een bedrijf dat gecertificeerd is op grond van die BRL, of

      b. een lekdetectiepotsysteem volgens BRL K796, dat ten minste eenmaal per maand wordt gecontroleerd op goede
      werking. Bij het constateren van gebreken wordt het lekdetectiepotsysteem binnen een periode van een maand
      hersteld. Eenmaal per jaar wordt van de controle een aantekening in het installatieboek gemaakt.

      3 De vulpunten en aftappunten van een bovengrondse opslagtank met gasolie, smeerolie en afgewerkte olie boven een
      oppervlaktewaterlichaam zijn geplaatst boven of in een voorziening die zich rondom of onder de opgeslagen stoffen
      bevindt en die de bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen kan opvangen.

      4 De voorzieningen, bedoeld in het eerste en derde lid, zijn zodanig uitgevoerd dat:

      a. gemorste of gelekte vloeistoffen effectief worden opgevangen en kunnen worden opgeruimd;

      b. er geen hemelwater op of in terecht kan komen, tenzij het hemelwater regelmatig van of uit de voorziening wordt
      verwijderd.

      5 De voorzieningen, bedoeld in het eerste en derde lid, zijn bestand tegen de inwerking van de opgeslagen stoffen
      en de condities waaronder deze stoffen worden gebruikt of opgeslagen.

      6 De voorziening, bedoeld in het eerste lid, heeft een opvangcapaciteit van ten minste 10% van de inhoud van alle
      opgeslagen stoffen.

      7 De opslagtank is voorzien van een overvulbeveiliging.

      8 Het zevende lid is niet van toepassing op een opslagtank voor afgewerkte olie die handmatig of onder vrij verval
      wordt gevuld.

      9 Een opslagtank voor afgewerkte olie wordt minimaal eenmaal per jaar geleegd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.71g
  - number: 3.71h
    text: |-
      1 De [artikelen 3.71d][ref1], [3.71f][ref2] en [3.71g][ref3] zijn niet van toepassing op een bovengrondse
      opslagtank met gasolie, smeerolie of afgewerkte olie die niet op de vloer staat.

      2 Aan de in het eerste lid bedoelde bovengrondse opslagtanks die niet op de vloer staan, kan het bevoegd gezag
      ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, maatwerkvoorschriften stellen met betrekking tot de plaats, de constructie, de
      keuring, de bodem- en veiligheidsvoorzieningen van de opslagtank.


