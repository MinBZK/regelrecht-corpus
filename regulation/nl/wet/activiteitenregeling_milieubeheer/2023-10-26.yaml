  - number: 3.4m
    text: |-
      1 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R2-techniek dan wel
      conserveringswerkzaamheden worden uitgevoerd met behulp van een C1-techniek waarbij een stof uit categorie B wordt
      gebruikt, worden die werkzaamheden uitgevoerd boven een hulpconstructie waarvan de vloer stofdicht is, is voorzien
      van opstaande randen met een hoogte van ten minste 20 centimeter en voor zover mogelijk aan alle zijden uitsteekt
      buiten het te behandelen object.

      2 Indien conserveringswerkzaamheden worden uitgevoerd met behulp van een C1-techniek waarbij een stof uit categorie
      C wordt gebruikt en bij een windsnelheid hoger dan 8 meter per seconde, wordt de hulpconstructie als bedoeld in
      het eerste lid ten minste uitgebreid met zijwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 bij 0,4
      millimeter of zeilen, die aansluiten op de vloer en minimaal 1 meter boven het te behandelen deel van het object
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.4m
  - number: 3.4n
    text: |-
      1 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij een stof uit categorie A
      vrijkomt wordt in aanvulling op de maatregelen bedoeld in [artikel 3.4m, tweede lid][ref1], de hulpconstructie ook
      aan de bovenzijde afgesloten.

      2 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij een metallisch
      straalmiddel wordt gebruikt en een stof uit categorie B vrijkomt, worden de zijwanden en bovenafsluiting van de
      hulpconstructie als bedoeld in het eerste lid winddicht uitgevoerd.

      3 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek waarbij smeltslakgrit of een
      mineraal straalmiddel wordt gebruikt en een stof uit categorie B vrijkomt dan wel waarbij metallisch straalmiddel
      wordt gebruikt en een stof uit categorie C vrijkomt, wordt in aanvulling op het tweede lid tijdens de werkzaamheden
      gezorgd voor een permanente onderdruk in de hulpconstructie. In de daarbij geëmitteerde lucht mag het stofgehalte
      niet meer bedragen dan 10 mg/Nm3, bepaald volgens NEN-EN 13284-1.

      4 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij smeltslakgrit of een
      mineraal straalmiddel wordt gebruikt en een stof uit categorie C vrijkomt dan wel conserveringswerkzaamheden
      die worden uitgevoerd met behulp van een C3-techniek, waarbij een stof uit categorie C wordt gebruikt, worden
      in aanvulling op het derde lid, de zijwanden en bovenzijde van de hulpconstructie als bedoeld in het derde lid,
      stofdicht uitgevoerd.

      5 Bij het uitvoeren van handelingen als bedoeld in het derde en vierde lid kan tot en met 31 december 2020 NEN-
      ISO 9096:2003+C1:2007: Emissie van stationaire bronnen – Bepaling van de concentratie aan vaste deeltjes, worden
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4m
