  - number: '5.19'
    text: |-
      1 Geautomatiseerde meetsystemen worden ten minste eenmaal per jaar met behulp van parallelmetingen met de
      referentiemeetmethoden, bedoeld in [artikel 5.18][ref1], gecontroleerd.

      2 De drijver van de inrichting informeert het bevoegd gezag over de resultaten van de in het eerste lid bedoelde
      controle.

      3 De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden
      worden berekend die getoetst worden aan een emissiegrenswaarde, is bij continue metingen niet groter dan de
      volgende percentages van de emissiegrenswaarde voor de dagelijkse emissies:

      a. koolmonoxide: 10% van de emissiegrenswaarde of 5 mg/Nm3;

      b. zwaveldioxide (SO): 20% van de emissiegrenswaarde of 10 mg/Nm3;

      c. stikstofoxiden (NO): 20% van de emissiegrenswaarde of 14 mg/Nm3;

      d. totaal stof: 30% van de emissiegrenswaarde of 1,5 mg/Nm3;

      e. totaal organisch koolstof: 30% van de emissiegrenswaarde of 3 mg/Nm3;

      f. zoutzuur: 40% van de emissiegrenswaarde of 4 mg/Nm3;

      g. waterstoffluoride: 40% van de emissiegrenswaarde of 0,4 mg/Nm3.

      4 De gevalideerde halfuur- en daggemiddelden worden bij continue metingen vastgesteld op grond van de valide
      gemeten halfuurgemiddelden, na aftrek van de waarde van het in het derde lid vermelde 95%-betrouwbaarheidsinterval.

      5 Bij de bepaling van de totale concentratie van dioxinen en furanen worden de massaconcentraties van de
      in tabel 5.19 genoemde dioxinen en dibenzofuranen vóór het optellen met de in die tabel genoemde toxische
      equivalentiefactoren (teq) vermenigvuldigd.


