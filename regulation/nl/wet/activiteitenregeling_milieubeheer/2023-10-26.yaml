  - number: '4.53'
    text: |-
      Aan [artikel 4.35, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen emissies die vrijkomen bij het snijden van koper worden gevoerd door een filtrerende afscheider die
      geschikt is om aan [artikel 4.35, eerste lid, van het besluit][ref2] te voldoen; en

      b. die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.35
