      8 Het bevoegd gezag kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans
      dat ongewone voorvallen zich voordoen en de gevolgen hiervan, bij maatwerkvoorschrift het vierde lid niet van
      toepassing verklaren en toestaan dat een opslagtank zich op een verdieping bevindt.

      9 Bij maatwerkvoorschrift als bedoeld in het zevende lid kunnen eisen worden gesteld om de toegankelijkheid van de
      opslagtank voor de brandbestrijding te borgen.

      10 Het inpandig opslaan van halfzware olie als bedoeld in
      [artikel 4.4a, eerste lid, onderdeel c, van het besluit][ref1] is slechts toegestaan indien de volgende maatregelen
      zijn getroffen:

      a. de tankinstallatie is geaard en voorzien van potentiaalvereffening;

      b. de ontluchting is naar buiten op ten minste 5 meter hoogte en niet nabij openingen;

      c. een goede ventilatie van de opslagruimte volgens NPR 7910-1 is in werking;

      d. een waarschuwing of alarm treedt in werking indien de temperatuur in de opslagruimte boven het vlampunt van de
      vloeistof kan komen;

      e. een vlamdover met CE-markering is volgens NEN-EN-ISO 16852 en de ATEX-richtlijnen 137 en 95 geïnstalleerd;

      f. het vulpunt is buiten, en

      g. de opslagtank is voorzien van elektronische peilvoorziening of een handmatige peilvoorziening met een
      zelfsluitende peildop.

      11 Uitpandige opslag van halfzware olie als bedoeld in
      [artikel 4.4a, eerste lid, onderdeel c, van het besluit][ref2] is slechts toegestaan indien de volgende maatregelen
      zijn getroffen:

      a. de opslagtank is van kunststof of staal;

      b. de opslagtank is geplaatst in een niet-brandbare lekbak van staal of beton. Indien een stalen tank dubbelwandig
      is uitgevoerd is geen lekbak nodig;

      c. de tankinstallatie is geaard en voorzien van potentiaalvereffening;

      d. de ontluchting is op ten minste 5 meter boven maaiveld;

      e. een vlamdover met CE-markering is volgens NEN-EN-ISO 16852 en de ATEX-richtlijn geïnstalleerd;

      f. de vul-, zuig- en persleidingen zijn beveiligd tegen aanrijding;

      g. de opslagtank is voorzien van elektronische peilvoorziening of een handmatige peilvoorziening met een
      zelfsluitende peildop, en

      h. de tank is voorzien van lichte bekleding of van een verfsysteem.

      12 Indien een bovengrondse opslagtank voor halfzware olie of polyesterhars is geïnstalleerd voor het tijdstip van
      het van toepassing worden van [paragraaf 4.1.3][ref3] op de inrichting is het vijfde lid niet van toepassing tot
      het moment waarop de eerstvolgende keuring behoort plaats te vinden.

      13 Het bevoegd gezag kan aan een opslagtank als bedoeld in het twaalfde lid bij maatwerkvoorschrift eisen stellen
      om de toegankelijkheid van de opslagtank voor de brandbestrijding te borgen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.4a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.4a
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk4
