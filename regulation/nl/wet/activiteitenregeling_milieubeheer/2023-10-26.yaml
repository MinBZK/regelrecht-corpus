    text: |-
      1 Ter uitvoering van [artikel 4.94e, eerste lid, van het besluit][ref1] past degene die de inrichting drijft bij
      het lijmen, coaten en lamineren van papier of karton:

      a. maatregelen ten aanzien van de bedrijfsvoering toe ter voorkoming van onnodige emissie van vluchtige organische
