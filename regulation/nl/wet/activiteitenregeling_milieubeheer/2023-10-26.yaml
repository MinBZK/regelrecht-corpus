      1 Het fokken, houden of trainen van vogels of zoogdieren vindt plaats boven een vloeistofkerende voorziening.
      [Artikel 2.3][ref1] is daarbij niet van toepassing.

      2 Het eerste lid is niet van toepassing op het fokken, houden of trainen van vogels of zoogdieren in de buitenlucht
      indien uitwerpselen, voedselresten en dierlijke bijproducten regelmatig worden verwijderd.

      3 [Artikel 2.11][ref2] van het besluit is niet van toepassing op het fokken, houden en trainen van vogels en
      zoogdieren.


