      1 Bij het berekenen van de hoeveelheid aardgasequivalent, bedoeld in [bijlage 10a][ref1], [bijlage 10d][ref2] en
      [artikel 2.15, vijfde, zevende en negende lid, van het besluit][ref3] worden de volgende waarden gehanteerd:

      a. 1 liter huisbrandolie komt overeen met 1,2 Nm3 aardgasequivalent;

      b. 1 ton stookolie komt overeen met 1300 Nm3 aardgasequivalent;

      c. 1 ton steenkool komt overeen met 925 Nm3 aardgasequivalent;

      d. 1 liter vloeibaar propaan komt overeen met 0,73 Nm3 aardgasequivalent;

      e. 1 m3 niet-Gronings aardgas komt overeen met X m3 aardgasequivalent, waarbij X wordt berekend door de onderste
      verbrandingswaarde in MJ/m3 van het ingezette aardgas te delen door 31,65 MJ/m3;

      f. 1 GJ warmte komt overeen met 31,6 Nm3 aardgasequivalent;

      g. 1 liter diesel komt overeen met 1,13 Nm3 aardgasequivalent;

      h. 1 liter benzine komt overeen met 1,04 Nm3 aardgasequivalent;

      2 Indien een brandstof wordt gebruikt die niet is opgenomen in het eerste lid, wordt de hoeveelheid
      aardgasequivalent per eenheid bepaald door de onderste verbrandingswaarde van deze stof in MJ per eenheid gewicht
      of volume te delen door 31,65 MJ/Nm3.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
