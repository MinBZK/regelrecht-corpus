  - number: 3.14h
    text: |-
      1 Ten behoeve van het voorkomen of beperken van slagschaduw en lichtschittering wordt lichtschittering bij het
      in werking hebben van een windturbine zoveel mogelijk voorkomen of beperkt door toepassing van niet reflecterende
      materialen of coatinglagen op de betreffende onderdelen. Het meten van reflectiewaarden vindt plaats overeenkomstig
      NEN-EN-ISO 2813 of een daaraan ten minste gelijkwaardige meetmethode.

      2 Een maatwerkvoorschrift ten behoeve van het voorkomen of beperken van lichtschittering dat voor een windturbine
      op 30 juni 2022 van kracht was op grond van een besluit krachtens artikel 3.134, tweede lid, blijft van kracht.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.14h
  - number: 3.14i
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet een windturbine aan de veiligheidseisen opgenomen in:

      a. NEN-EN-IEC 61400-1;

      b. NEN-EN-IEC 61400-2;

      c. NEN-EN-IEC 61400-3.

      2 In afwijking van het eerste lid voldoet een windturbine die is opgericht voor 1 januari 2017 of dient ter
      vervanging van een windturbine die is opgericht voor 1 januari 2017 aan NEN-EN-IEC 61400-2:2006: Europese norm voor
      Windturbines – Deel 2: Ontwerp eisen van kleine windturbines, september 2006 of aan NVN 11400-0.

      3 Aan het eerste lid wordt voldaan indien voor de windturbine een certificaat is afgegeven door een certificerende
      instantie waaruit blijkt dat de windturbine voldoet aan deze regels. De certificerende instantie is geaccrediteerd
      voor het afgeven van certificaten, overeenkomstig de normen bedoeld in het eerste lid bij de Raad voor Accreditatie
      of bij een accrediterende instantie die erkend is door een andere staat, aangesloten bij de Multilateral Agreement
      on European Accreditation of Certification.

      4 In afwijking van het eerste, tweede en derde lid gelden ten aanzien van een windturbine die voor 1 december
      2001 is opgericht en waarvoor tot die datum een vergunning in werking en onherroepelijk was, de in die vergunning
      opgenomen voorschriften met betrekking tot de veiligheid van de installatie.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.14i
  - number: 3.14j
    text: |-
      Als voor een windturbine of een combinatie van windturbines ten behoeve van het voorkomen of beperken van
      geluidhinder op 30 juni 2022 een maatwerkvoorschrift van kracht was op grond van een besluit krachtens
      [artikel 3.14a, tweede lid][ref1], waarin een lagere waarde voor geluidhinder was vastgesteld teneinde rekening te
      houden met cumulatie van geluid als gevolg van een andere windturbine of een andere combinatie van windturbines,
      voldoet de windturbine of een combinatie van windturbines aan die lagere waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.14a
