  - number: 3.27e
    text: |-
      1 Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.26a van het besluit][ref1]
      voldoet de opslag van afgetapte of gedemonteerde stoffen, preparaten of producten bij een inrichting waar
      autowrakken of wrakken van tweewielige motorvoertuigen worden gedemonteerd, aan het tweede tot en met vijfde lid.

      2 Afgetapte of gedemonteerde stoffen, preparaten of producten als bedoeld in [artikel 3.27d, tweede lid][ref2],
      worden voor zover dat nodig is voor recycling als materiaal of product of nuttige toepassing afzonderlijk bewaard.

      3 Afgetapte of gedemonteerde stoffen, preparaten of producten als bedoeld in [artikel 3.27d, vijfde lid][ref3],
      worden op een zodanige wijze opgeslagen dat de mogelijkheden voor recycling als materiaal of product of nuttige
      toepassing niet worden geschaad.

      4 Niet voor recycling als product geschikte stoffen, preparaten of producten, waarvoor wel een mogelijkheid van
      recycling als materiaal of nuttige toepassing bestaat, worden gescheiden gehouden en gescheiden afgevoerd naar een
      inrichting met een milieuhygiënisch verantwoorde en doelmatige verwerkingsmogelijkheid.

      5 Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van de wijze van opslag van afgetapte of
      gedemonteerde stoffen, preparaten of producten als bedoeld in het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26a
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3.27d
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3.27d
