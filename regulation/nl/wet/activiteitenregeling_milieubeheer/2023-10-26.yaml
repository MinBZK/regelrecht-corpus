  - number: '4.8'
    text: |-
      1 De opslag van gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking in een voor het publiek
      toegankelijke verkoopruimte is brandveilig.

      2 Aan het eerste lid wordt voldaan indien gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking:

      a. zijn opgeslagen overeenkomstig de [artikelen 4.3][ref1], [4.4][ref2], [4.4a][ref3], [4.4b][ref4], [4.4c][ref5]
      en [4.4d][ref6], of

      b. niet in grotere hoeveelheden in een verkoopruimte zijn opgeslagen dan is aangegeven in tabel 4.8.

      3 Dit artikel is niet van toepassing op:

      a. verpakkingen met producten bestemd voor de persoonlijke verzorging, waaronder spuitbussen,

      b. alcoholhoudende dranken in consumentenverpakkingen, of

      c. gevaarlijke stoffen in verpakking van de klasse 9 van het ADR, zonder bijkomend gevaar.

      4 Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot een andere wijze van opslag dan genoemd
      in het tweede lid op basis van een door de inrichtinghouder ingediend uitgangspuntendocument met betrekking
      tot de bouwkundige, installatietechnische en organisatorische maatregelen, waarin is aangetoond dat de opslag
      van gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking in een voor het publiek toegankelijke
      verkoopruimte brandveilig is. Voordat de betreffende verkoopruimte in gebruik wordt genomen, is door een inspectie-
      instelling, die geaccrediteerd is door een accreditatie-instelling volgens NEN-EN-ISO/IEC 17020, door middel van
      een goedkeurend inspectierapport aangetoond dat de met het oog op de brandveiligheid getroffen voorzieningen en
      maatregelen zijn uitgevoerd overeenkomstig het uitgangspuntendocument. Dit inspectierapport is binnen de inrichting
      aanwezig.

      5 Een lekbak als bedoeld in tabel 4.8 is onbrandbaar en productbestendig en kan ten minste 100% van de daarboven
      opgeslagen vloeistoffen bevatten.


