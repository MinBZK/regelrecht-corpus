      De volgorde van lozen, bedoeld in [artikel 3.63, vierde lid, onderdeel b, van het besluit][ref1] is:

      a. huishoudelijk afvalwater;

      b. afvalwater afkomstig van het spuiten of schrobben van vloeren, niet zijnde vloeren van ruimten waar
      gewasbeschermingsmiddelen of biociden worden aangemaakt;

      c. spoelwater van filters van een waterdoseringsinstallatie;

      d. terugspoelwater van een ontijzeringsinstallatie;

      e. spoelwater van ionenwisselaars;

      f. afvalwater dat bloemvoorbehandelingsmiddelen uitsluitend op basis van actief chloor bevat;

      g. drainagewater afkomstig van een teelt waarbij gewassen op een bodem groeien die in verbinding staat met de
      ondergrond;

      h. drainwater;

      i. ketelspuiwater;

      j. afvalwater afkomstig van het wassen van in de kas geteelde groenteproducten;

      k. reinigingswater van leidingen, druppelaars en slangen die onderdeel uitmaken van het systeem waarmee
      voedingswater aan het gewas wordt toegediend;

      l. spoelwater van fusten;

      m. condenswater van warmtekrachtinstallaties;

      n. afvalwater afkomstig van het bij opkweekbedrijven doorspoelen van substraatblokken die bestemd zijn voor de
      opkweek van uitgangsmateriaal;

      o. condenswater van stoomleidingen en condensorwater van verwarmingsketels;

      p. ander afvalwater dan bedoeld in de onderdelen a tot en met o.


