      Aan [artikel 4.46 van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. het jaarlijks verbruik aan vloeimiddelen minder is dan 100 kilogram;

      b. de afgezogen gasvormige emissies die vrijkomen bij het solderen met vloeimiddelen die vluchtige
      organische stoffen bevatten worden gevoerd door een adsorptiefilter die geschikt is om aan
      [artikel 4.46 van het besluit][ref2] te voldoen, en het adsorptiefliter in goede staat van onderhoud verkeert,
      periodiek gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt; of

      c. de afgezogen gasvormige emissies die vrijkomen bij het solderen met zure vloeimiddelen, worden gevoerd door een
      gaswasser of een aërosol- of mistfilter die geschikt is om aan [artikel 4.46 van het besluit][ref3] te voldoen,
      en die gaswasser aërosol- of mistfilter in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo
      vaak als voor de goede werking nodig is, wordt schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.46
