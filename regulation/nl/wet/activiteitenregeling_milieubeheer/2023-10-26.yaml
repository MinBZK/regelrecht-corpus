        bwb_id: BWBR0022762
        artikel: 3.26a
  - number: 3.27i
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat
      niet mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan als bedoeld in het [artikel 3.26a van het besluit][ref1], wordt bij het
      neutraliseren van airbags of gordelspanners uit autowrakken of wrakken van tweewielige motorvoertuigen of de
      opslag van gedemonteerde airbags of gordelspanners binnen de inrichting tot een maximale hoeveelheid van 1000
      gedemonteerde airbags en gordelspanners, voldaan aan het tweede tot en met het twaalfde lid.

      2 Het neutraliseren van airbags en gordelspanners gebeurt overeenkomstig paragraaf 6 van NEN 7557.

      3 Het ontsteken van mechanische airbags wordt niet uitgevoerd bij een inrichting type A of type B.

      4 Na demontage worden de gedemonteerde airbags of gordelspanners, met uitzondering van de werkvoorraad, opgeslagen
      in een daarvoor bestemde, voor transport van gedemonteerde airbags en gordelspanners geschikte container of
      een voor opslag bestemde ruimte, die zodanig is uitgevoerd dat voldoende drukontlasting mogelijk is en waar de
      gedemonteerde airbags en gordelspanners gescheiden worden van de overige stoffen en materialen door middel van
      een afscheiding van gaas van voldoende sterkte bestaande uit staaldraad met een vrije opening van maximaal vijf
      centimeter dan wel door opslag in een separaat brandcompartiment.

      5 Gedemonteerde mechanische airbags en gordelspanners worden zodanig gescheiden van elkaar opgeslagen in een
      voorziening als bedoeld in het vierde lid dat de kans op onbedoeld activeren van deze airbags en gordelspanners
      zoveel mogelijk wordt beperkt.

      6 De ruimte, bedoeld in het vierde lid, bevindt zich op één centrale locatie binnen de inrichting, buiten bereik
      van onbevoegden.

      7 In en rondom de ruimte, bedoeld in het vierde lid, wordt geen open vuur gemaakt en wordt niet gerookt.

      8 Bij de entree van de ruimte, bedoeld in het vierde lid, is een markering aangebracht waarmee wordt aangegeven dat
      hier gedemonteerde airbags en gordelspanners zijn opgeslagen.

      9 De airbags worden met de afdekkap naar boven geplaatst.

      10 Elektrische airbags en gordelspanners worden niet aan statische lading blootgesteld indien de bekabeling, die
      direct gemonteerd is aan een airbag of gordelspanner, beschadigd is.

      11 Bij een inrichting type A of type B worden geen elektrische airbags of gordelspanners ontstoken die zodanig
      beschadigd zijn dat de airbags en gordelspanners niet op een veilige wijze in het autowrak kunnen worden
      geneutraliseerd.

      12 De airbags en gordelspanners, bedoeld in het tiende lid, worden gedemonteerd en worden na demontage afgevoerd
      naar een persoon als bedoeld in [artikel 10.37, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26a
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10.37
