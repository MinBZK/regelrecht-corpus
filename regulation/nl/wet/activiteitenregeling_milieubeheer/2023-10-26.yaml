  - number: '4.42'
    text: |-
      1 Ter uitvoering van [artikel 4.24, eerste lid van het besluit][ref1], past degene die de inrichting drijft:

      a. bij het coaten of lijmen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen:

      1°. maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen;

      2°. oplosmiddelarme producten en efficiënte applicatiemethoden toe.

      b. bij het reinigen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen:

      1°. maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen;

      2°. de volgende maatregelen in volgorde van opsomming toe:

      i. zoveel mogelijk droog reinigen;

      ii. indien reiniging niet op een droge manier kan plaatsvinden, wordt gebruik gemaakt van waterige middelen;

      iii. indien reiniging met waterige middelen technisch niet uitvoerbaar is, of niet kosteneffectief is, vindt
      het reinigen met organische oplosmiddelen plaats in procesbaden, die zijn uitgevoerd als een gesloten systeem.
      Indien gesloten systemen worden toegepast, wordt de in- en uitneemzone ten minste één minuut gesloten gehouden na
      beëindiging van het gebruik van de pomp- of persluchtinstallatie, ter beperking van de emissie naar de lucht;

      iv. indien reiniging niet mogelijk is in een gesloten systeem vanwege van technische onuitvoerbaarheid of omdat het
      niet kosteneffectief is, wordt gebruik gemaakt van hoogkokende niet-gehalogeneerde oplosmiddelen.

      2 Indien de emissiereducerende maatregelen als bedoeld in het eerste lid niet of in onvoldoende mate zijn
      getroffen, kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de
      motivering wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.24
