    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld
      [artikel 3.16f van het besluit][ref1] voldoet een wisselverwarmingsinstallatie aan [artikel 3.16e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.16f
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.16e
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.16d
    references:
