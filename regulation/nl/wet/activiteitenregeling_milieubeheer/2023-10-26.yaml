  - number: 3.27g
    text: |-
      1 Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.26a van het besluit][ref1] wordt
      bij de ontvangst van een autowrak bij een inrichting waar autowrakken worden gedemonteerd, voldaan aan het tweede
      tot en met vierde lid.

      2 Bij de ontvangst van een autowrak met een kenteken dat verstrekt is door een in een andere lidstaat van de
      Europese Unie daartoe aangewezen instantie, wordt desgevraagd aan degene die zich van dat autowrak ontdoet een
      certificaat van vernietiging als bedoeld in artikel 5, derde lid, van de autowrakkenrichtlijn afgegeven, waarin in
      ieder geval de volgende gegevens zijn opgenomen:

      a. de naam, het adres en de handtekening van degene die het certificaat van vernietiging afgeeft;

      b. de datum van afgifte van het certificaat van vernietiging;

      c. het kenteken van het autowrak, inclusief de kenletters van het land daarop;

      d. de categorie van voertuigen waartoe het autowrak behoort alsmede het merk en het model van het autowrak;

      e. het chassisnummer van het autowrak; en

      f. de naam, het adres, de nationaliteit en de handtekening van de eigenaar of houder van het afgegeven autowrak.

      3 Bij het certificaat van vernietiging wordt het bij het autowrak behorende kentekenbewijs gevoegd.

      4 Indien het bij het autowrak behorende kentekenbewijs niet aanwezig is, wordt dat op het certificaat van
      vernietiging aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26a
