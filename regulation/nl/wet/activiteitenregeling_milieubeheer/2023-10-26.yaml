  - number: '2.22'
    text: |-
      1 De concentraties van componenten in de afgassen worden bepaald door continue meting of afzonderlijke metingen
      onder procescondities die representatief zijn voor de normale bedrijfsvoering.

      2 De metingen bemonsteringen en analyses van de parameters die nodig zijn voor het bepalen of wordt voldaan aan de
      emissiegrenswaarden alsmede de andere metingen en berekeningen die zijn voorgeschreven, worden uitgevoerd volgens
      onderstaande normbladen:

      a. emissiemeting en analyse:

      1°. stikstofoxiden (NO): NEN-EN 14792;

      2°. stikstofoxiden (NO) continumeting: NEN-ISO 10849;

      3°. zwaveldioxide (SO): NEN-EN 14791;

      4°. onverbrande koolwaterstoffen (CH): NEN-EN 12619;

      5°. totaal stof: NEN-EN 13284-1 of NEN-EN 13284-2;

      6°. zuurstof (O): NEN-EN 14789;

      7°. chroom VI -verbindingen: ISO 16740;

      8°. zware metalen: NEN-EN 14385;

      9°. zoutzuur: NEN-EN 1911-1, 1911-2 en 1911-3;

      10°. waterstoffluoride: NEN-ISO 15713;

      11°. ammoniak: NEN 2826;

      12°. individuele gasvormige organische componenten: NPR-CEN/TS 13649;

      13°. dioxines en furanen: NEN-EN 1948 deel 1,2 en 3;

      14°. kwik: NEN-EN 13211;

      15°. waterdamp: NEN-EN 14790;

      16°. debiet: NEN-EN-ISO 16911 deel 1 en 2;

      b. meetlocatie, monstername en rapportage van de stoffen, genoemd onder a: NEN-EN 15259.

      c. kwaliteitsborging van continue metingen: NEN-EN 14181.

      3 Een afzonderlijke meting als bedoeld in het eerste lid bestaat uit drie deelmetingen van een half uur, tenzij een
      langere bemonsteringstijd voortvloeit uit de meetmethode of de representatieve wijze van bemonsteren. Het resultaat
      van de afzonderlijke emissiemeting is het gemiddelde van de deelmetingen, verminderd met de gerapporteerde
      meetonzekerheid of met een standaardwaarde voor de meetonzekerheid.

      4 Een continue meting vindt plaats door:

      a. een rechtstreekse continue meting van de concentratie in het afgas, of

      b. een continue meting van de parameters van de voor de installatie vastgestelde uitworpkarakteristiek.

      5 Het resultaat van een continue meting is de verzameling van half-uursgemiddelde of etmaalgemiddelden, verminderd
      met de gerapporteerde meetonzekerheid of met een standaardwaarde voor de meetonzekerheid.

      6 Bij het uitvoeren van handelingen als bedoeld in het tweede lid, onderdeel a, onder 12, kan tot 1 juli 2018 NEN-
      EN 13649 worden toegepast.

      7 Bij het uitvoeren van handelingen als bedoeld in het tweede lid, aanhef en onderdeel a, onder 1, 3, 6 en 15,
      kunnen tot [1 april 2019] onderstaande normbladen worden toegepast:

      a. NEN-EN 14792:2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van massaconcentratie aan
      stikstofoxiden (NO) – Referentiemethode – Chemiluminescentie, december 2005;

      b. NEN-EN 14 791, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de massaconcentratie aan
      zwaveldioxide – Referentiemethode, november 2005;

      c. NEN-EN 14 789, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de volumeconcentratie
      van zuurstof (O) – Referentiemethode – Paramagnetisme, november 2005, respectievelijk

      d. NEN-EN 14 790, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de waterdamp in
      leidingen, november 2005.

      8 Bij het uitvoeren van handelingen als bedoeld in het tweede lid, onderdeel a, onder 5, kunnen tot en met
      31 december 2020 NEN-EN 13284-1, 2001: Europese norm voor Emissies van stationaire bronnen – Bepaling van
      massaconcentratie van stof in lage concentraties – Deel 1: Manuele gravimetrische methode, december 2001 of NEN-
      EN 13284-2, 2004: Europese norm voor Emissies van stationaire bronnen – Bepaling van massaconcentratie van stof in
      lage concentraties – Deel 2: Geautomatiseerde meetsystemen, september 2004, worden toegepast.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel2.22
