      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het beitsen en etsen van metalen plaats
      boven een lekbak of een vloeistofdichte vloer of verharding.

      2 De activiteit bedoeld in het eerste lid kan ook boven een andere bodembeschermende voorziening worden uitgevoerd
      indien deze activiteit wordt uitgevoerd als een gesloten proces.

      3 Indien het beitsen of etsen van metalen plaatsvindt met behulp van een dompelbad dan is dat dompelbad opgesteld
      boven een lekbak of een vloeistofdichte vloer of verharding, die zich ten minste uitstrekt tot de oppervlakte van
      het dompelbad en het daarbij behorende uitlekgebied. Onder dit uitlekgebied wordt niet begrepen het gebied waar het
      metaalproduct wordt geplaatst nadat dit is afgespoeld met water of is gespoeld in een bad met water.

      4 Een dompelbad dat zich automatisch vult is voorzien van een doelmatige overvulbeveiliging of overloopbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.73
