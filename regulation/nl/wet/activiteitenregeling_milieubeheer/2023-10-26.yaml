  - number: '3.105'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.135 van het besluit][ref1] vindt het pekelen van dierlijke bijproducten en organen als bedoeld in
      [artikel 3.133, onder a en d, van het besluit][ref2] plaats boven een bodembeschermende voorziening.

      2 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      verontreiniging van een oppervlaktewaterlichaam en ter bescherming van de doelmatige werking van voorzieningen
      voor het beheer van afvalwater als bedoeld in [artikel 3.135 van het besluit][ref3] worden bij het pekelen van
      dierlijke bijproducten en organen, bedoeld in [artikel 3.133, onder a en d, van het besluit][ref4], ten minste de
      gemorste of gelekte stoffen zoveel mogelijk zonder verder toevoegen van water opgeruimd en afgevoerd als afvalstof
      en wordt zoveel mogelijk voorkomen dat deze stoffen in het afvalwater terecht kunnen komen. Deze werkwijze wordt
      opgenomen in de bedrijfsinterne procedures en werkinstructies, bedoeld in [artikel 2.3, tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.135
