  - number: 4.84.8
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.74.7, onderdeel b, van het besluit][ref1], vindt het smelten en gieten van metalen waarbij
      bodembedreigende stoffen worden gebruikt of kunnen vrijkomen, plaats boven een bodembeschermende voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74.7
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84.8
