    text: |-
      1 Aan [artikel 4.125, tweede lid, van het besluit][ref1] wordt in ieder geval voldaan indien het verbruik
      aan stoffen ingedeeld in de klassen gA1, gA2, gA3, gO1, gO2 en gO3 in kilogram per jaar lager is dan de in
      [artikel 2.6 van het besluit][ref2] voor de betreffende stofklasse genoemde vrijstellingsgrens en de som van de
      stoffen ingedeeld in de klassen gO1, gO2 en gO3 niet meer bedraagt dan 250 kilogram per jaar.

      2 Tevens wordt in ieder geval aan [artikel 4.125, tweede lid, van het besluit][ref3] voldaan indien:

      a. de afgezogen emissies die vrijkomen bij laboratoriumproeven met stoffen ingedeeld in de klassen gA1, gA2 en gA3
      worden gevoerd door een gaswasser, aërosolfilter of mistfilter die geschikt is om aan de emissieconcentratie-eisen
      genoemd in [artikel 4.125, tweede lid, van het besluit][ref4] te voldoen, en

      b. de gaswasser, aërosolfilter of mistfilter, bedoeld onder a, in goede staat van onderhoud verkeert, periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is wordt schoongemaakt, en

      c. de afgezogen emissies die vrijkomen bij laboratoriumproeven met stoffen ingedeeld in de klassen gO1, gO2 en gO3
      worden gevoerd door een adsorptiefilter die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en
      zo vaak als voor de goede werking nodig is, wordt schoongemaakt.


