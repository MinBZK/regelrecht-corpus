    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.23b, eerste lid, van het besluit][ref1] vindt het uitwendig wassen van motorvoertuigen, werktuigen of
      spoorvoertuigen plaats boven een vloeistofdichte vloer of verharding. De bij het wassen vrijkomende vloeistoffen
      lopen niet over de rand van de vloeistofdichte vloer of verharding.

      2 In afwijking van het eerste lid is het toegestaan motorvoertuigen, werktuigen en spoorvoertuigen te wassen in
      of op een mobiele wasinstallatie die zodanig is uitgevoerd dat vloeistoffen niet in de bodem kunnen geraken, met
      dien verstande dat een mobiele wasinstallatie niet langer dan zes maanden aaneengesloten op eenzelfde locatie is
      geplaatst.

      3 In afwijking van het eerste lid is het toegestaan om motorvoertuigen en werktuigen voor agrarische activiteiten,
      uitwendig te wassen boven een aaneengesloten bodemvoorziening, waarbij geen directe afvoer voor afvalwater en
      hemelwater van de aaneengesloten bodemvoorziening naar een oppervlaktewaterlichaam aanwezig is. De bij het wassen
      vrijkomende vloeistoffen lopen niet over de rand van de aaneengesloten bodemvoorziening.


