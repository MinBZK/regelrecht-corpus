  - number: '5.84'
    text: |-
      1 De LPG-afleverinstallatie wordt buiten bedrijf gesteld indien degene die een LPG-tankstation drijft of de
      toezichthoudende persoon, als bedoeld in [artikel 5.79, tweede lid][ref1]:

      a. niet in het LPG-tankstation aanwezig is;

      b. niet oproepbaar is, of

      c. niet binnen drie minuten ter plaatse van de LPG-afleverinstallatie aanwezig kan zijn.

      2 De LPG-afleverinstallatie blijft buiten bedrijf indien de beveiligingen in werking zijn geweest en de oorzaak
      daarvan nog niet is verholpen.

      3 Het buiten bedrijf zijn van de LPG-afleverinstallatie wordt op een voor de afnemer duidelijke zichtbare manier
      weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.79
