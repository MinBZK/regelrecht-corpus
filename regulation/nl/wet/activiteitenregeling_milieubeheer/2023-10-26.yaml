  - number: '3.119'
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, bedoeld in
      [artikel 3.167, onderdeel a, van het besluit][ref1], worden dampen en gassen die vrijkomen bij:

      a. het coaten of lijmen van planten of onderdelen van planten door middel van het vernevelen van vluchtige
      organische stoffen met een nevelspuit, of

      b. het coaten of lijmen van planten of onderdelen van planten door middel van het opbrengen van poeder, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder, bedoeld in [artikel 3.167, onderdeel d, van het besluit][ref2], worden de dampen en gassen die zijn
      afgezogen overeenkomstig het eerste lid en die in de buitenlucht worden geëmitteerd:

      a. ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen
      afgevoerd, of

      b. geleid door een doelmatige ontgeuringsinstallatie.

      3 Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.

      4 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege
      het slecht functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen,
      geuremissies die niet via de afzuiging worden afgevoerd of vanwege incidentele geurpieken, overeenkomstig
      [artikel 2.7a, tweede en derde lid, van het besluit][ref3] onverminderd het tweede lid bij maatwerkvoorschrift
      eisen stellen aan:

      a. de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het tweede lid, onderdeel b;

      b. de situering van de afvoerpijp;

      c. het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van diffuse geuremissies, of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      5 In afwijking van het tweede lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden, bedoeld in het vierde lid, onvoldoende zijn om de overschrijding ongedaan te maken
      overeenkomstig [artikel 2.7a, tweede en derde lid, van het besluit][ref4] bij maatwerkvoorschrift eisen stellen
      aan de aanwezigheid van een ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen
      voorschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.167
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.167
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
