  - number: 3.38a
    text: |-
      1 Een ondergrondse opslagtank met daarbij behorende leidingen en appendages is zodanig uitgevoerd dat bij het
      vullen van een ondergrondse opslagtank met lichte olie de uit die opslagtank verdreven dampen door een gasdichte
      retourleiding kunnen worden teruggevoerd naar het reservoir van de tankwagen die de lichte olie levert. Het systeem
      is zo ontworpen dat drukopbouw zoveel mogelijk wordt voorkomen. Indien een vacuümdrukklep wordt toegepast bedraagt
      de drukopbouw in het gehele systeem niet meer dan de openingsdruk van de desbetreffende klep. Deze openingsdruk
      bedraagt niet meer dan 3,92 kilopascal.

      2 Indien lichte olie wordt aangeleverd worden de uit de ondergrondse opslagtank verdreven dampen teruggevoerd met
      de voorziening, bedoeld in het eerste lid.

      3 De aansluitpunten van de vulleidingen en de dampretourleidingen zijn zodanig uitgevoerd dat verwisseling van de
      vulslang en de dampretourslang van en naar de tankwagen is uitgesloten.

      4 Het vullen van een ondergrondse opslagtank vindt niet plaats indien de dampretourleiding lek is.

      5 Het eerste tot en met vierde lid zijn niet van toepassing op een inrichting met een debiet van lichte olie van
      minder dan 100 kubieke meter per jaar.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.38a
  - number: '3.39'
    text: |-
      Voor de toepassing van [artikel 3.31, vijfde lid, van het besluit][ref1] worden onder inerte goederen, in ieder
      geval de volgende goederen verstaan, voor zover deze niet verontreinigd zijn met bodembedreigende stoffen:

      a. bouwstoffen als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref2] die binnen dat besluit toepasbaar
      zijn, uitgezonderd IBC-bouwstoffen als bedoeld in dat artikel;

      b. grond en baggerspecie als bedoeld in [artikel 39 van het Besluit bodemkwaliteit][ref3];

      c. A-hout en ongeshredderd B-hout;

      d. snoeihout;

      e. banden van voertuigen;

      f. autowrakken waaruit alle vloeistoffen zijn afgetapt bij een autodemontagebedrijf en wrakken van tweewielige
      motorvoertuigen waaruit alle vloeistoffen zijn afgetapt bij een demontagebedrijf voor tweewielige motorvoertuigen;

      g. straatmeubilair;

      h. tuinmeubilair;

      i. aluminium, ijzer, roestvrij staal;

      j. kunststof anders dan lege, ongereinigde verpakkingen van voedingsmiddelen, smeerolie, verf, lak of drukinkt,
      gewasbeschermingsmiddelen, biociden of gevaarlijke stoffen;

      k. kunststofgeïsoleerde kabels anders dan oliedrukkabels, gepantserde papier-loodkabels en papiergeïsoleerde
      grondkabels;

      l. papier en karton;

      m. textiel en tapijt;

      n. vlakglas.


