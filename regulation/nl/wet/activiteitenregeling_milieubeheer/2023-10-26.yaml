  - number: '4.10'
    text: |-
      1 Het opslaan van vloeibare gevaarlijke stoffen in verpakking, vloeibare bodembedreigende stoffen in verpakking en
      vloeibare CMR-stoffen in verpakking vindt plaats boven een vloeistofdichte vloer of verharding of een lekbak.

      2 Indien de opslag, bedoeld in het eerste lid, plaatsvindt in gesloten verpakking, die voldoet aan de daartoe
      gestelde eisen van de ADR of anderszins deugdelijk is, kan deze activiteit ook plaatsvinden boven een andere
      bodembeschermende voorziening .

      3 Het opslaan van vaste gevaarlijke stoffen in verpakking, vaste bodembedreigende stoffen in verpakking en vaste
      CMR-stoffen in verpakking vindt plaats boven een bodembeschermende voorziening.

      4 Het opslaan van een werkvoorraad aan gevaarlijke stoffen als bedoeld in voorschrift 3.1.3 van PGS 15 of
      bodembedreigende stoffen vindt plaats in een deugdelijke en gesloten verpakking die bestand is tegen de
      desbetreffende stof.

      5 In afwijking van het derde lid vindt het opslaan van vaste gevaarlijke afvalstoffen waaruit vloeibare
      bodembedreigende stoffen kunnen lekken, niet zijnde stukgoederen, plaats in een deugdelijke en gesloten verpakking
      of boven een lekbak.

      6 Het opslaan van een werkvoorraad aan brandbare vloeistoffen van meer dan 50 liter vindt plaats boven een lekbak.
      Deze lekbak is onbrandbaar en productbestendig en kan ten minste 100% van de daarboven opgeslagen vloeistoffen
      bevatten.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.10
  - number: 4.10a
    text: |-
      1 Het boven een oppervlaktewaterlichaam opslaan van gevaarlijke stoffen in verpakking, CMR-stoffen in verpakking
      en bodembedreigende stoffen in verpakking vindt plaats boven een voorziening die zich rondom of onder de opgeslagen
      stoffen bevindt en de bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen kan opvangen.

      2 Op de voorziening, bedoeld in het eerste lid, is [artikel 2.4][ref1] van overeenkomstige toepassing.

      3 Lege, ongereinigde verpakkingen van gevaarlijke stoffen, CMR-stoffen en vloeibare bodembedreigende stoffen
      die boven een oppervlaktewaterlichaam bovendeks aanwezig zijn, zijn aan de buitenkant schoon en goed gesloten of
      staan opgesteld boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en in staat is de bij
      normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen en zodanig is uitgevoerd dat er geen
      hemelwater op of in terecht kan komen.

      4 Gevaarlijke stoffen in verpakking, CMR-stoffen in verpakking en bodembedreigende stoffen in verpakking die boven
      een oppervlaktewaterlichaam bovendeks aanwezig zijn, staan opgesteld boven een doelmatig fysieke voorziening die
      vrijgekomen stoffen keert zolang als nodig is om met daarop afgestemde maatregelen te voorkomen dat deze stoffen
      in een oppervlaktewaterlichaam kunnen geraken. [Artikel 2.3, tweede tot en met het achtste lid][ref2], is van
      overeenkomstige toepassing.


