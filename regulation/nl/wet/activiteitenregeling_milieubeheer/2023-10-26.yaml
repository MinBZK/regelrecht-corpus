  - number: 4.10b
    text: |-
      1 De [artikelen 4.1 tot en met 4.10a][ref1] zijn niet van toepassing op het opslaan van vloeibare kunstmeststoffen
      in verpakking voor zover dat opslaan plaatsvindt voor agrarische activiteiten.

      2 Het opslaan van vloeibare kunstmeststoffen in verpakking voor zover dat plaatsvindt voor agrarische activiteiten,
      voldoet aan het derde tot en met zesde lid.

      3 Een verpakking die is gevuld met vloeibare kunstmeststoffen is geplaatst boven een ten minste vloeistofkerende
      vloer of in een vloeistofdichte lekbak die voldoende sterk is om weerstand te bieden aan de als gevolg van een
      lekkage optredende vloeistofdruk en bestand is tegen de in de verpakking opgeslagen stoffen.

      4 De vloeistofkerende vloer vormt samen met wanden, drempels of opstaande randen een vloeistofkerende
      opvangvoorziening.

      5 De inhoud van de opvangvoorziening, bedoeld in het vierde lid, of de lekbak, bedoeld in het derde lid, is ten
      minste gelijk aan de inhoud van de grootste opgeslagen verpakking, vermeerderd met 10% van de overige verpakkingen.

      6 De verpakking die is gevuld met een zuur is in een andere opvangvoorziening of lekbak geplaatst dan een
      verpakking die is gevuld met een basische stof.


