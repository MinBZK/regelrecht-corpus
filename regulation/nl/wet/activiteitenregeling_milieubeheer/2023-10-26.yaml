  - number: 4.19b
    text: |-
      1 Een opslagtank voor vloeibare kunstmeststoffen als bedoeld in [artikel 4.19a, tweede lid][ref1], is:

      a. van een voldoende stijfheid en sterkte om het gewicht van de opgeslagen vloeistof te dragen en om schadelijke
      vervorming als gevolg van overdruk bij vulling of overvulling te voorkomen;

      b. vloeistofdicht;

      c. voorzien van een ondersteunende constructie van onbrandbaar materiaal en van een doelmatige fundering op
      plaatsen waar een kans op verzakking bestaat;

      d. voor zover het het opslaan van zure kunstmeststoffen betreft, voorzien van een ontluchtingsleiding die uitmondt
      in de buitenlucht en die een open verbinding van de tank met de buitenlucht verzekert en niet in verbinding staat
      met een ontluchtingsleiding van een tank voor het opslaan van basische kunstmeststoffen;

      e. voor zover een niveau-aanwijzing of peilinrichting is aangebracht: zodanig ingericht dat het uitstromen van
      vloeistof uit de tank onmogelijk is;

      f. in elke aansluiting op een tank beneden het hoogste vloeistofniveau en in de toevoerleiding naar het
      verbruikstoestel, zo dicht mogelijk bij de tankwand, voorzien van een afsluiter, die zodanig is uitgevoerd dat
      duidelijk zichtbaar is of die geopend of gesloten is;

      g. voorzien van een overstortleiding met een diameter van vijftig millimeter, die uitmondt op vijf centimeter boven
      de bodem van de vloer of voorziening, bedoeld in onderdeel h;

      h. geplaatst boven een ten minste vloeistofkerende vloer of een vloeistofdichte lekbak, die voldoende sterk is om
      weerstand te bieden aan de als gevolg van een lekkage optredende vloeistofdruk en bestand is tegen de in de tanks
      opgeslagen stoffen;

      i. ten hoogste voor 95% gevuld;

      j. voorzien van duidelijk leesbare opschriften met de chemische naam en handelsnaam van het product dat in de tank
      is opgeslagen, de concentratie van dat product en de bijbehorende gevarensymbolen;

      k. voorzien van voorzieningen waardoor voorkomen wordt dat bij het vullen van een tank een verkeerde aansluiting
      wordt gemaakt, waardoor een ander product in de tank kan geraken dan waarvoor de tank bestemd is;

      l. voorzien van vulleidingen die op afschot liggen, aflopend naar de tank of die, indien dat om technische
      redenen niet mogelijk is, na het vullen worden doorgeblazen, die goed met een goed sluitende dop of afsluiter zijn
      afgesloten, behoudens tijdens het vullen van tanks, die zijn beschermd tegen mechanische beschadigingen en die
      voldoen aan onderdeel j, en

      m. voorzien van leidingen die bovengronds of in een daartoe speciaal aangelegde goot zijn gelegd.

      2 De vloeistofkerende vloer, bedoeld in het eerste lid, onder h, vormt samen met wanden, drempels of opstaande
      randen een vloeistofkerende opvangvoorziening.

      3 De inhoud van de opvangvoorziening, bedoeld in het tweede lid, of de lekbak, bedoeld in het eerste lid, onder h,
      is ten minste gelijk aan de tankinhoud, indien een tank in die voorziening is opgesteld.

      4 De inhoud van de opvangvoorziening of de lekbak is ten minste gelijk aan de inhoud van de grootste tank,
      vermeerderd met 10% van de gezamenlijke inhoud van de overige tanks, voor zover twee of meerdere tanks in die
      voorziening zijn opgesteld.

      5 Een tank voor de bewaring van een zuur is opgesteld in een andere opvangvoorziening of lekbak dan een tank voor
      bewaring van een basische stof.

      6 Bij dosering van kunstmeststoffen in doseervaten, wordt eerst voorgedoseerd met water, voordat de
      kunstmeststoffen worden toegevoegd.


