  - number: '5.37'
    text: |-
      Aan [artikel 5.46, eerste lid, onder b, van het besluit][ref1] wordt in ieder geval voldaan als de emissies van
      de droogtrommel en de installatie voor de productie van asfalt worden afgezogen en door een filtrerende afscheider
      worden gevoerd die in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als voor de
      goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.46
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.37
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5.46'
  - number: '5.38'
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies van vluchtige organische
      stoffen als bedoeld in [artikel 5.50, tweede lid, van het besluit][ref1], past degene die de inrichting drijft de
      volgende emissiereducerende maatregelen toe, tenzij deze niet kosteneffectief of niet technisch uitvoerbaar zijn:

      a. het reduceren van de vul- en ademverliezen van tanks met een vast dak door middel van het aanbrengen van
      inwendig drijvende dekken of gelijkwaardige voorzieningen bij tanks;

      b. het vervangen dan wel voorzien van een secundaire afdichting, van primaire afdichtingen in tanks met een
      drijvend dak om te bereiken dat de spleetbreedte over ten minste 95% van de omtrek van het dak niet meer bedraagt
      dan 3,2 mm;

      c. het condenseren of op andere wijze terugwinnen of vernietigen, met inachtneming van de samenhang in de
      benzineketen, van vrijkomende dampen als gevolg van de belading van lichters met vluchtige vloeistoffen op steigers
      waar een dampverwerkingsinstallatie aanwezig is;

      d. het condenseren of op andere wijze terugwinnen of vernietigen, met inachtneming van de samenhang in de
      benzineketen, van vrijkomende dampen als gevolg van belading van tankwagens en ketelwagens met vluchtige
      vloeistoffen met uitzondering van kerosine;

      e. het opstellen en uitvoeren van een programma van intensieve controle en onderhoud bij diffuse bronnen van
      emissies, zoals pompen of afsluiters, en het schoonmaken van tanks;

      f. het reduceren van de fakkelverliezen door middel van minimalisatie van bedrijfsstoringen, effectieve
      fakkelgasterugwinning of een schema van regelmatige controle op doorlatende afsluiters en veiligheidskleppen naar
      de fakkel;

      g. het invoeren van good-housekeeping en discipline bij drainoperaties;

      h. het reduceren van de lekverliezen langs aansluitingen en doorvoeringen van tanks met een uitwendig drijvend dak
      door het aanbrengen van pakkingen of moffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.50
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.38
