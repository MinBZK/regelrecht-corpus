  - number: '3.115'
    text: |-
      1 Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.156 van het besluit][ref1]
      voldoet een inrichting waar een gemeente gelegenheid biedt om grove huishoudelijke afvalstoffen achter te laten ten
      minste aan het tweede tot en met het vijfde lid.

      2 Bij een inrichting waar een gemeente gelegenheid biedt om grove huishoudelijke afvalstoffen achter te laten zijn
      voorzieningen aanwezig voor het gescheiden achterlaten van de volgende grove huishoudelijke afvalstoffen:

      a. afgedankte elektrische en elektronische apparatuur;

      b. asbest;

      c. C-hout;

      d. gasflessen, brandblussers en overige drukhouders;

      e. grond;

      f. A-hout en B-hout;

      g. banden van voertuigen;

      h. dakafval;

      i. geëxpandeerd polystyreenschuim;

      j. gemengd steenachtig materiaal, niet zijnde asfalt en niet zijnde gips;

      k. gips;

      l. grof tuinafval;

      m. harde kunststoffen;

      n. matrassen;

      o. metalen;

      p. papier en karton;

      q. textiel, niet zijnde tapijt; en

      r. vlakglas.

      3 Het tweede lid is niet van toepassing op grove huishoudelijke afvalstoffen die de inrichting niet inneemt. De
      inrichtinghouder zorgt er in dat geval voor dat bij de inrichting duidelijk is aangegeven waar de inwoners van de
      gemeente deze afvalstoffen wel kunnen aanbieden. Verder neemt de inrichtinghouder in dat geval in de procedures
      van acceptatie en controle bedoeld in [artikel 2.14b van het besluit][ref2] op hoe ervoor gezorgd wordt dat deze
      afvalstoffen niet worden ingenomen.

      4 Onverminderd [artikel 2.14b van het besluit][ref3] draagt de inrichtinghouder er zorg voor dat zoveel mogelijk
      wordt voorkomen dat afvalstoffen waarvoor specifieke voorzieningen aanwezig zijn in de voorziening voor het
      restafval worden gedeponeerd. De inrichtinghouder neemt in de procedures van acceptatie en controle bedoeld in
      artikel 2.14b van het besluit op hoe hier invulling aan gegeven wordt.

      5 De voorziening voor matrassen, bedoeld in het tweede lid, aanhef en onder n, wordt zo uitgevoerd dat de matrassen
      niet in contact komen met hemelwater.

      6 Bij maatwerkvoorschrift kan het bevoegd gezag toestaan dat een of meer van de voorzieningen, bedoeld in het
      tweede lid, onder f tot en met r, niet aanwezig zijn, op voorwaarde dat de inrichtinghouder op een redelijke in
      het voorschrift te stellen termijn via nascheiding of op andere wijze een zelfde niveau van afvalscheiding bereikt
      waarmee een zelfde niveau van recycling kan worden bereikt als bij het gescheiden houden conform het tweede lid.

      7 Bij maatwerkvoorschrift als bedoeld in het zesde lid kunnen voorwaarden worden gesteld aan de wijze van
      nascheiding of andere alternatieve verwerking en het overleggen van bescheiden hierover.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.156
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.14b
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.14b
