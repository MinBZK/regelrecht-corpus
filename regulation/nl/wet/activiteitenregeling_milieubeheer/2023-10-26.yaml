  - number: '5.43'
    text: |-
      Een tank met vast dak die voor 31 december 1995 in werking was of waarvoor voor 31 december 1995 een vergunning op
      grond van [artikel 8.1 van de Wet milieubeheer][ref1] is verleend:

      a. is verbonden met een dampterugwinningseenheid overeenkomstig [paragraaf 5.2.2 van het besluit][ref2], of

      b. heeft een inwendig drijvend dak met een primaire afdichting zodat in vergelijking met een vergelijkbare tank met
      vast dak zonder dampbeheersingsvoorzieningen ten minste 90 procent van de damp wordt vastgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Paragraaf5.2.2
