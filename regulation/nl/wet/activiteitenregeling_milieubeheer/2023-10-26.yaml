  - number: '3.121'
    text: |-
      Ten behoeve van het voorkomen van onnodige emissie van vluchtige organische stoffen als bedoeld in
      [artikel 3.166 van het besluit][ref1], past degene die de inrichting drijft bij het coaten of lijmen van planten of
      onderdelen van planten de volgende maatregelen toe:

      a. maatregelen ten aanzien van de bedrijfsvoering;

      b. oplosmiddelarme producten en efficiënte applicatiemethoden:

      1°. het coaten van droogbloemen volgens de dompelmethode plaatsvindt met volledig watergedragen verfbaden;

      2°. het coaten van snijbloemen volgens de optrekmethode plaatsvindt met volledig watergedragen verfbaden en met
      kleurstoffen of pigmenten die in Europa zijn toegelaten in de voedingsmiddelenindustrie;

      3°. het coaten van snijbloemen volgens de dompelmethode plaatsvindt met watergedragen verfbaden met maximaal
      15 volumeprocent vluchtige organische stoffen, bestaande uit kleurstoffen in vloeibare vorm, voor zover nodig
      uitvloeimiddelen, bevochtigingsmiddelen en anti-schuimmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.166
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.121
