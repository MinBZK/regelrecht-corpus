      1 In afwijking van [artikel 3.25, eerste tot en met achtste lid][ref1], kan het afleveren van vloeibare brandstof
      plaatsvinden boven een geomembraanbaksysteem, indien:

      a. de inrichting is gelegen binnen de bebouwde kom waarbij de afleverzuilen in één rij parallel aan de naastgelegen
      weg staan opgesteld en het afleveren uitsluitend aan de wegzijde op of aan de openbare weg plaatsvindt, of

      b. op basis van een onderzoek naar de grondmechanica dat vóór het aanbrengen van het geomembraanbaksysteem is
      uitgevoerd, is gebleken dat het aanbrengen van een vloeistofdichte vloer of verharding onevenredig hoge kosten met
      zich brengt.

      2 Een geomembraanbaksysteem als bedoeld in het eerste lid is aangelegd overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref2] aangewezen normdocument door een bedrijf, dat daartoe beschikt over een erkenning op
      grond van [dat besluit][ref3].

      3 Het tweede lid is niet van toepassing op een geomembraanbaksysteem dat voor 1 januari 2007 is aangelegd.


