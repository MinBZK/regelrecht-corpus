  - number: '5.82'
    text: |-
      1 Het in bedrijf stellen van een LPG-afleverinstallatie en het opheffen van de vergrendeling nadat het
      beveiligingssysteem heeft gewerkt, geschiedt uitsluitend door degene die een LPG-tankstation drijft of door de
      toezichthoudende persoon, als bedoeld in [artikel 5.79, tweede lid][ref1].

      2 Een LPG-afleverinstallatie is zodanig uitgevoerd dat het in bedrijf stellen slechts door de persoon, bedoeld in
      het eerste lid, kan geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.79
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.82
