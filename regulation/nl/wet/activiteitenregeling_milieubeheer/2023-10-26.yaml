    text: |-
      1 De rapportage bedoeld in [artikel 2.15, tweede lid, van het besluit][ref1] bevat in ieder geval:

      a. een aanduiding, het nummer waaronder de onderneming geregistreerd is bij de Kamer van Koophandel en het adres
      van de inrichting waar de rapportage betrekking op heeft;

      b. de onderneming waar de inrichting onderdeel van uitmaakt;

      c. de contactgegevens van degene die de inrichting drijft en degene die de rapportage voor de inrichting indient;

      d. het energieverbruik van de inrichting:

      1°. inclusief energie die door de inrichting zelf wordt geproduceerd en gebruikt;

      2°. gemeten over een heel kalenderjaar;

      3°. aan de hand van recente gegevens;

      4°. in kilowattuur (kWh) elektriciteit en kubieke meter (m3) aardgasequivalent;

      e. de randvoorwaarden, omschreven bij de maatregelen in [bijlage 10][ref2], waar de inrichting niet aan voldoet.

      2 De maatregelen bedoeld in [artikel 2.15, derde lid, van het besluit][ref3] zijn de maatregelen aangewezen in
      [bijlage 10][ref4].

      3 In afwijking van het eerste lid, onderdeel e, en het tweede lid zijn de in [bijlage 10c][ref5] aangewezen
      maatregelen van toepassing wanneer er sprake is van:

      a. een inrichting waarop [artikel 3.55 van het besluit][ref6] van toepassing is; of

      b. een inrichting waarop [artikel 3.75 van het besluit][ref7] van toepassing is en degene die de inrichting drijft
      gebruik maakt van het tarief, bedoeld in [artikel 60, eerste lid, van de Wet belastingen op milieugrondslag][ref8].


