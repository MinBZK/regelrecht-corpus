  - number: '5.10'
    text: |-
      1 Metingen ter bepaling van de emissies zijn representatief.

      2 Alle monitoringresultaten worden op zodanige wijze geregistreerd, verwerkt en gepresenteerd dat het bevoegd gezag
      kan controleren of wordt voldaan aan de toepasselijke emissiegrenswaarden en andere voorschriften.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.10
  - number: '5.11'
    text: |-
      1 De emissies in de lucht van de volgende stoffen worden continu gemeten:

      a. zwaveldioxide (SO), totaal organische koolstof, zoutzuur, koolmonoxide, totaal stof en stikstofoxiden (NO);

      b. waterstoffluoride, tenzij voor zoutzuur behandelingsstappen worden gevolgd die waarborgen dat de in de
      [artikelen 5.19][ref1], [5.20][ref2] en [5.22 van het besluit][ref3] voor zoutzuur opgenomen emissiegrenswaarden
      niet worden overschreden.

      2 In het geval voor zoutzuur behandelingsstappen worden gevolgd die voldoen aan het eerste lid, onder b, wordt
      periodiek ten minste tweemaal per jaar gemeten.

      3 In afwijking van het eerste lid wordt het gehalte zoutzuur, waterstoffluoride of zwaveldioxide (SO) periodiek ten
      minste om de zes maanden gemeten, of worden er geen metingen verricht, indien de drijver van de afvalverbrandings-
      of afvalmeeverbrandingsinstallatie kan aantonen dat die emissie in geen geval hoger is dan de toepasselijke
      emissiegrenswaarde.

      4 In afwijking van het eerste lid wordt de emissie van stikstofoxide (NO) van een afvalverbrandingsinstallatie
      periodiek ten minste om de zes maanden gemeten, indien:

      a. de afvalverbrandingsinstallatie een nominale capaciteit heeft van minder dan 6 ton per uur;

      b. vergunning is verleend of een ontvankelijke aanvraag om een vergunning is ingediend voor 28 december 2002 en de
      afvalverbrandingsinstallatie uiterlijk op 28 december 2004 in gebruik is genomen;

      c. degene die de afvalverbrandingsinstallatie drijft, aan de hand van informatie over de kwaliteit van het
      betreffende afval, de gebruikte technologieën en de resultaten van de monitoring van de emissies aantoont dat
      emissies van stikstofoxiden in geen geval de emissiegrenswaarden, bedoeld in [artikel 5.19 van het besluit][ref4],
      kunnen overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.19
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5.20
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel5.22
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel5.19
