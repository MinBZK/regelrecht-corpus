  - number: '3.42'
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van verontreiniging van het oppervlaktewater
      worden goederen die boven een oppervlaktewaterlichaam worden opgeslagen en waaruit vloeibare bodembedreigende
      stoffen kunnen lekken, opgeslagen boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en
      de bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen kan opvangen.

      2 Op de voorziening, bedoeld in het eerste lid, is [artikel 2.4][ref1] van overeenkomstige toepassing.

      3 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van verontreiniging van het oppervlaktewater
      staan goederen waaruit vloeibare bodembedreigende stoffen kunnen lekken en die boven het oppervlaktewater bovendeks
      aanwezig zijn, opgesteld:

      a. boven een voorziening die zich rondom of onder de opgeslagen goederen bevindt en in staat is en de bij normale
      bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen en zodanig is uitgevoerd dat er geen hemelwater
      op of in terecht kan komen, of

      b. boven een doelmatige fysieke voorziening die vrijgekomen stoffen keert zolang als nodig is om met
      daarop afgestemde maatregelen te voorkomen dat deze stoffen in een oppervlaktewaterlichaam kunnen geraken.
      [Artikel 2.3, tweede tot en met achtste lid][ref2], zijn van overeenkomstige toepassing, met dien verstande dat
      voor ‘bodem’ wordt gelezen ‘oppervlaktewaterlichaam’.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel2.3
