    text: |-
      Aan [artikel 4.94 van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. het gebruik van anti-smetpoeder minder bedraagt dan 500 kg per jaar; of

      b. de afgezogen stofemissies die vrijkomen bij vellenoffsetdrukpersen worden gevoerd door een filtrerende
      afscheider, die geschikt is om aan [artikel 4.94 van het besluit][ref2] te voldoen, in goede staat van onderhoud
      verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en
      vervangen.


