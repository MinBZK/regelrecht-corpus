  - number: '4.49'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.31 van het besluit][ref1] vindt bij het reinigen, coaten of lijmen van rubber, kunststof of rubber- of
      kunststofproducten het verwerken van lakken, verdunners en lijmen alsmede het reinigen, het chemisch ontlakken en
      het logen van rubber, kunststof of rubber- of kunststofproducten plaats boven een bodembeschermende voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.31
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.49
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4.31'
  - number: 4.49a
    text: |-
      1 Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.31b, vierde lid, van het besluit][ref1] wordt stofklasse S die vrijkomt bij het wegen of mengen van
      rubbercompounds, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van een doelmatige verspreiding van emissies naar de buitenlucht als bedoeld in
      [artikel 4.31b, vierde lid, van het besluit][ref2] worden emissies die vrijkomen bij het wegen of mengen van
      rubbercompounds of het verwerken van rubber, thermoplastische kunststof of polyesterhars, voor zover die worden
      afgezogen, bovendaks en omhoog gericht naar de buitenlucht afgevoerd, indien binnen 50 meter van een emissiepunt
      een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein of een bedrijventerrein met
      minder dan één gevoelig gebouw per hectare, is gelegen.

      3 Het bevoegd gezag kan, in het belang van de luchtkwaliteit en, maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.31b
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.31b
