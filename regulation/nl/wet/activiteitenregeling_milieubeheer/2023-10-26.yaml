  - number: '5.86'
    text: |-
      1 Tussen de LPG-afleverinstallatie of onderdelen daarvan en objecten binnen de inrichting worden ten minste de
      veiligheidsafstanden, genoemd in tabel 4 van PGS 16, in acht genomen.

      2 De voorschriften 4.2.1 tot en met 4.2.14 van PGS 16 zijn van toepassing op de veiligheidsafstanden tussen een
      LPG-afleverinstallatie of onderdelen daarvan en objecten binnen de inrichting.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.86
  - number: '5.87'
    text: |-
      De opstelplaats van de LPG-tankwagen voldoet aan de voorschriften 4.2.15 tot en met 4.2.23 en voorschrift 5.3.3 van
      PGS 16.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.87
