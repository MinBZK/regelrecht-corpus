  - number: '2.1'
    text: |-
      1 Een binnen de inrichting als bodembeschermende voorziening toegepaste vloeistofdichte vloer of verharding
      of geomembraanbaksysteem is overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument beoordeeld en goedgekeurd door een instelling, die daartoe beschikt over een erkenning op grond van
      dat besluit.

      2 Het eerste lid is niet van toepassing op een vloeistofdichte vloer of verharding die niet inspecteerbaar is als
      bedoeld in AS 6700. Een dergelijke voorziening wordt eens per zes jaar beoordeeld en goedgekeurd overeenkomstig een
      door het bevoegd gezag goedgekeurde wijze. Het vijfde lid is daarop van overeenkomstige toepassing.

      3 De eerste beoordeling en goedkeuring vindt in afwijking van het eerste lid, plaats binnen zes jaar na aanleg,
      indien de vloeistofdichte vloer of verharding, bedoeld in het eerste lid, is aangelegd overeenkomstig het daartoe
      krachtens het [Besluit bodemkwaliteit][ref2] aangewezen normdocument door een bedrijf dat daartoe beschikt over een
      erkenning op grond van dat besluit.

      4 Een vloeistofdichte vloer of verharding of een geomembraanbaksysteem wordt ten minste eens per zes jaar
      beoordeeld en goedgekeurd overeenkomstig het eerste lid.

      5 Degene die de inrichting drijft draagt zorg voor:

      a. reparatie en regelmatig onderhoud van de vloeistofdichte vloer of verharding en geomembraanbaksysteem
      overeenkomstig paragraaf 3.3 van deel 3 van de NRB, en

      b. een jaarlijkse controle van de bodembeschermende voorziening overeenkomstig [bijlage 6][ref3] behorende bij
      AS 6700.

      6 Een vloeistofdichte vloer of verharding of een geomembraanbaksysteem wordt opnieuw beoordeeld en goedgekeurd
      overeenkomstig het eerste lid, indien de reparatie, het regelmatig onderhoud of de controle, bedoeld in het vijfde
      lid, niet of niet overeenkomstig dat lid is uitgevoerd of indien een tijdens een controle geconstateerd gebrek niet
      is gerepareerd.

      7 Het eerste lid is niet van toepassing op een geomembraanbaksysteem dat voor 1 december 2001 is aangelegd en
      voldoet aan de volgende voorwaarden:

      a. de toegepaste folie is productbestendig, is gemaakt van hoge dichtheid polyetheen (HDPE) of folie van een
      gelijkwaardige kwaliteit, heeft een dikte van ten minste 1 mm en is gecertificeerd op grond van BRL K537;

      b. voor het geomembraanbaksysteem is een legplan voorhanden met een aanduiding van de lasnaden en doorvoeren, een
      Rol Testdata rapport, lasrapporten en een lasproefrapport;

      c. iedere zes maanden vindt een visuele controle plaats van de verharding die zich boven het geomembraanbaksysteem
      bevindt; bij constatering van een morsing van een grote hoeveelheid vloeibare brandstoffen vindt binnen drie
      maanden een bemonstering plaats van de peilbuizen als bedoeld in [artikel 2.2, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
