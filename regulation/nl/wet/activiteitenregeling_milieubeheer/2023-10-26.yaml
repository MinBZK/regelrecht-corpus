      9 Een dubbelwandige stationaire bovengrondse opslagtank van staal of kunststof met de daarbij behorende appendages
      en dubbelwandige leidingen wordt jaarlijks op de goede werking gecontroleerd.

      10 Bij de bovengrondse opslagtank, bedoeld in het eerste lid, vindt een jaarlijkse controle plaats:

      a. van de kathodische bescherming van ondergrondse leidingen;

      b. van de lekdetectie van de dubbelwandige leidingen. In afwijking van het eerste lid vindt deze controle plaats
      overeenkomstig BRL K903, door een bedrijf dat gecertificeerd is op grond van die BRL;

      c. van de aarding en de potentiaalvereffening van de vul- en dampretourleiding indien in de bovengrondse opslagtank
      vloeistoffen van PGS-klasse 1 en 2 zijn opgeslagen;

      d. op de aanwezigheid van water in een stalen bovengrondse opslagtank. In afwijking van het eerste lid kan de
      controle worden uitgevoerd door een daartoe getraind persoon, met een waterzoekpasta die wordt aangebracht op de
      peilstok.

      11 Een bovengrondse opslagtank wordt bij herkeuring inwendig gereinigd en beoordeeld door middel van betreding
      van de tank. Inwendige inspectie met behulp van een camera is toegestaan bij een volledig inwendig gecoate tank,
      indien deze inspectie wordt uitgevoerd overeenkomstig AS 6800. Indien bij herkeuring een bovengrondse opslagtank
      niet kan worden betreden of, indien toegestaan, middels een camera-inspectie inwendig geïnspecteerd kan worden,
      wordt de opslagtank afgekeurd. Het gebruik van de opslagtank is in geval van afkeuring toegestaan tot de uiterste
      herkeuringsdatum.

      12 Het bevoegd gezag kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen,
      dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans
      dat ongewone voorvallen zich voordoen en de gevolgen hiervan, bij maatwerkvoorschrift het vijfde lid niet van
      toepassing verklaren en toestaan dat een opslagtank zich op een verdieping bevindt.

      13 Bij een maatwerkvoorschrift als bedoeld in het twaalfde lid kunnen eisen worden gesteld om de toegankelijkheid
      van de opslagtank voor de brandbestrijding te borgen.

      14 In afwijking van het tiende lid vindt de controle, bedoeld in onderdeel d van dat lid, eenmaal per drie jaar
      plaats indien de opslagtank aantoonbaar is voorzien van een inwendige coating overeenkomstig BRL K779 en die
      coating is aangebracht door een bedrijf dat daartoe is gecertificeerd op basis van BRL K790.

      15 Indien tijdens de controle, bedoeld in het tiende lid, onderdeel d, water is aangetroffen, wordt dit terstond
      verwijderd. Van het verwijderde water worden de elektrische geleidbaarheid en de zuurgraad beoordeeld. Wanneer bij
      de derde opeenvolgende meting blijkt dat de zuurgraad en de elektrische geleidbaarheid van het aangetroffen water
      buiten de normeisen vallen, wordt een inwendige inspectie van de bovengrondse opslagtank uitgevoerd. Indien een
      inwendige inspectie noodzakelijk is, wordt dit terstond gemeld aan het bevoegd gezag.

      16 In afwijking van het elfde en vijftiende lid is een inwendige beoordeling of inwendige inspectie bij de keuring
      van een bovengrondse opslagtank niet noodzakelijk indien deze opslagtank dubbelwandig is uitgevoerd met een
      lekdetectiesysteem in de wand.

      17 Indien een bovengrondse opslagtank voor gasolie is geïnstalleerd voor het tijdstip van het van toepassing
      worden van [paragraaf 3.4.9][ref1] op de inrichting is het vijfde lid niet van toepassing tot het moment waarop de
      eerstvolgende keuring behoort plaats te vinden.

      18 Het bevoegd gezag kan aan een opslagtank als bedoeld in het zeventiende lid bij maatwerkvoorschrift eisen
      stellen om de toegankelijkheid van de opslagtank voor de brandbestrijding te borgen.


