  - number: 3.102a
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico, bedoel in
      [artikel 3.129h, onderdeel a, van het besluit][ref1] voldoet een installatie voor het vergisten van dierlijke
      meststoffen, het opslaan van het restproduct van het vergisten van dierlijke meststoffen, zolang dat restproduct
      nog niet stabiel is, het biologisch behandelen van dierlijke meststoffen voor of na het vergisten en het bewerken
      van vergistinggas ten minste aan de [artikelen 3.102b][ref2] en [3.102c][ref3].

      2 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in artikel 3.129h, onderdeel b, van het besluit wordt bij het vergisten
      van dierlijke meststoffen, het opslaan van het restproduct van het vergisten van dierlijke meststoffen, zolang dat
      restproduct nog niet stabiel is, het opslaan van vergistinggas, het bewerken en transporteren van vergistinggas ten
      minste voldaan aan de [artikelen 3.102b][ref4], [3.102d][ref5] en [3.102e][ref6].

      3 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, bedoeld in
      [artikel 3.129h, onderdeel c, van het besluit][ref7] voldoet een installatie voor het bewerken van vergistinggas
      ten minste aan [artikel 3.102f][ref8].


