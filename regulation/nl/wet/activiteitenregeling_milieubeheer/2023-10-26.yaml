  - number: 4.9b
    text: |-
      1 De ruimte waarin de verpakkingen, bedoeld in het eerste lid van [artikel 4.9a][ref1], zijn opgesteld voldoet aan
      het bepaalde bij of krachtens het tweede tot en met het zevende lid.

      2 De ruimte mag slechts door deskundig personeel geopend en betreden worden.

      3 De ruimte heeft doorvoeringen van de stortleiding, de leegzuigleiding en de ontluchtingsleiding, die aan de
      bovenzijde van de ruimte worden geprojecteerd.

      4 De peilleiding heeft geen doorvoering door de wand.

      5 De beveiligingscomponenten zoals brandsmeltkleppen en detonatiebeveiligingen zijn direct aan de buitenzijde van
      de ruimte bevestigd.

      6 De ruimte is met een potentiaal vereffening aangesloten aan de buitenzijde van de ruimte en is doorgelust aan het
      frame van de verpakkingen met de natuurlijk aanwezige metallische verbinding.

      7 Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van de situering van de verpakkingen, bedoeld
      in [artikel 4.9a][ref2].


