  - number: '4.91'
    text: |-
      1 Een vaste afleverinstallatie voldoet bij het afleveren van vloeibare brandstof anders dan aan motorvoertuigen
      voor het wegverkeer, spoorvoertuigen en vaartuigen aan de volgende onderdelen van PGS 28:

      a. de voorschriften 2.3.8, 2.3.11 en 2.3.13;

      b. de voorschriften 3.2.5 en 3.4.2 tot en met 3.4.11;

      c. voorschrift 4.5.8;

      d. de voorschriften 5.5.1 en 5.5.3, en

      e. de [paragrafen 5.6][ref1] en [5.7][ref2].

      2 Bij het afleveren van lichte olie zonder toezicht is de vaste afleverinstallatie voorzien van een
      temperatuurgevoelig element dat voldoet aan voorschrift 2.3.12 van PGS 28.


