  - number: '4.18'
    text: |-
      1 Het opslaan van vloeibare gevaarlijke stoffen of vloeibare bodembedreigende stoffen in bovengrondse opslagtanks
      vindt plaats boven een lekbak.

      2 Het eerste lid is niet van toepassing op een opslagtank die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie zijnde:

      a. een elektronisch lekdetectiesysteem volgens de BRL K910, dat ten minste eenmaal per jaar wordt beoordeeld en is
      goedgekeurd overeenkomstig BRL K903, door een bedrijf dat is gecertificeerd op grond van die BRL, of

      b. een lekdetectiepotsysteem volgens BRL K796, dat ten minste eenmaal per maand wordt gecontroleerd op goede
      werking. Bij het constateren van gebreken wordt het lekdetectiepotsysteem binnen een periode van een maand
      hersteld. Eenmaal per jaar wordt van de controle een aantekening in het installatieboek gemaakt.

      3 De vulpunten en aftappunten van een bovengrondse opslagtank met vloeibare gevaarlijke stoffen of bodembedreigende
      stoffen zijn geplaatst boven een vloeistofdichte vloer of verharding of boven of in een lekbak, of zijn uitgevoerd
      met een vulpunt morsbak.

      4 De opslagtank is voorzien van een overvulbeveiliging.

      5 Boven de lekbak, bedoeld in het eerste lid, vindt geen opslag van andere gevaarlijke stoffen plaats, indien die
      kunnen reageren met de stoffen in de bovengrondse opslagtank.

      6 Met het oog op de doelmatige werking van de voorzieningen voor het beheer van afvalwater is de vloeistofdichte
      bodemvoorziening, bedoeld in het derde lid, niet aangesloten op het vuilwaterriool, als in de bovengrondse
      opslagtank vloeistoffen worden opgeslagen van:

      a. ADR-klasse 5.1; of

      b. ADR-klasse 8, verpakkingsgroep II of III.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.18
  - number: 4.18a
    text: |-
      1 Het opslaan van vloeibare bodembedreigende stoffen in opslagtanks boven een oppervlaktewaterlichaam vindt
      plaats boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en in staat is de bij normale
      bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen.

      2 Het eerste lid is niet van toepassing op een opslagtank die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie zijnde:

      a. een elektronisch lekdetectiesysteem volgens de BRL K910, dat ten minste eenmaal per jaar wordt beoordeeld en is
      goedgekeurd overeenkomstig BRL K903, door een bedrijf dat is gecertificeerd op grond van die BRL ,of

      b. een lekdetectiepotsysteem volgens BRL K796, dat ten minste eenmaal per maand wordt gecontroleerd op goede
      werking. Bij het constateren van gebreken wordt het lekdetectiepotsysteem binnen een periode van een maand
      hersteld. Eenmaal per jaar wordt van de controle een aantekening in het installatieboek gemaakt.

      3 De vulpunten en aftappunten van een opslagtank met vloeibare bodembedreigende stoffen zijn geplaatst boven of
      in een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en die de bij normale bedrijfsvoering
      gemorste of wegspattende vloeistoffen kan op vangen.

      4 De voorzieningen, bedoeld in het eerste en derde lid, zijn zodanig uitgevoerd dat:

      a. gemorste of gelekte vloeibare bodembedreigende stoffen effectief worden opgevangen en kunnen worden opgeruimd;

      b. er geen hemelwater op of in terecht kan komen, tenzij het hemelwater regelmatig van of uit de voorziening wordt
      verwijderd.

      5 De voorzieningen, bedoeld in het eerste en derde lid, zijn bestand tegen de inwerking van de desbetreffende
      vloeibare bodembedreigende stoffen en de condities waaronder deze stoffen worden gebruikt of opgeslagen.

      6 De voorziening, bedoeld in het eerste lid, heeft een opvangcapaciteit van ten minste 10% van de inhoud van alle
      opgeslagen stoffen.

      7 De opslagtank is voorzien van een overvulbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.18a
  - number: '4.19'
    text: |-
      1 De [artikelen 4.15][ref1], [4.16][ref2] en [4.18][ref3] zijn niet van toepassing op een bovengrondse opslagtank
      met vloeibare gevaarlijke stoffen die niet op de vloer staat.

      2 Aan de in het eerste lid bedoelde bovengrondse opslagtanks die niet op de vloer staan, kan het bevoegd gezag
      maatwerkvoorschriften stellen ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen,
      dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans
      dat ongewone voorvallen zich voordoen en de gevolgen hiervan, aan de plaats, de constructie, de keuring, de bodem-
      en veiligheidsvoorzieningen van de opslagtank.


