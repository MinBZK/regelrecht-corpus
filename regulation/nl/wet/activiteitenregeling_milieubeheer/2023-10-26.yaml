  - number: '3.113'
    text: |-
      Ingevolge [artikel 1.11, tiende lid, van het besluit][ref1], bevat het rapport van een akoestisch onderzoek,
      bedoeld in artikel 1.11, derde lid, onder f, van het besluit, de volgende gegevens:

      a. een gedetailleerde beschrijving (naam, type, fabricaat) van de gemeten representatieve wapens en de gebruikte
      munitie (type en LOT-nummer);

      b. het totale aantal schoten van de representatieve gebruiksituatie voor de relevante wapencategorieën voor de
      relevante beoordelingsperioden;

      c. gebruikte meetapparatuur;

      d. een plattegrond van de meetsituatie (bijvoorbeeld: ligging baan, positie wapen, adres, omgeving geluidgevoelige
      bestemmingen, etc.) en een opgave van de beoordelingspunten (afstanden, microfoonhoogte, afstand tot de gevel,
      afmetingen van de ruimte);

      e. de meetwaarden voor L en L alsmede de energetische gemiddelde waarden;

      f. de beoordelingsniveaus per meetlocatie voor de relevante beoordelingsperioden;

      g. het gemeten achtergrondgeluidniveau per meetlocatie en beschrijving van de aard van de stoorgeluiden, en

      h. de weersomstandigheden indien metingen buiten zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.11
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.113
