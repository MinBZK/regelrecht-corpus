      1 Een emissiescherm als bedoeld in de [artikelen 3.79, zevende lid, onderdeel b, onder 2°][ref1], en
      [3.85, zesde lid, van het besluit][ref2] voldoet aan het tweede tot en met zesde lid.

      2 Het emissiescherm is aan de grond verankerd.

      3 Van het emissiescherm kunnen geen afdruipende spuitvloeistoffen in een oppervlaktewaterlichaam geraken.

      4 Het emissiescherm is vervaardigd van niet-doorlaatbaar materiaal of van gaas met een windreductie van ten minste
      50%.

      5 Het emissiescherm is ten minste van gelijke hoogte als die van het te bespuiten gewas op het perceel en als die
      van de hoogste in gebruik zijnde spuitdop.

      6 Het emissiescherm is met uitzondering van een doorrijscherm op de kopakker aaneengesloten.


