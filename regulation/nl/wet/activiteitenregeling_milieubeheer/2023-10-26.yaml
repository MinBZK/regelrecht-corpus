  - number: 3.27m
    text: |-
      Aan [artikel 3.26j, derde lid, van het besluit][ref1] wordt in ieder geval voldaan indien een plan voor het in
      ontvangst nemen en verder beheren van afvalstoffen de volgende elementen bevat:

      a. een beoordeling van de behoefte aan voorzieningen voor de ontvangst van afvalstoffen, gelet op de behoefte van
      de zeegaande pleziervaartuigen die gewoonlijk de jachthaven aandoen;

      b. een beschrijving van de voorzieningen voor de inzameling van afvalstoffen en de capaciteit daarvan;

      c. een beschrijving van de procedures voor de afgifte van de betrokken afvalstoffen;

      d. een beschrijving van de procedures voor het melden van vermeende tekortkomingen in de voorzieningen;

      e. een beschrijving van de procedures voor structureel overleg met havengebruikers, afvalverwerkers en andere
      betrokken partijen;

      f. een beschrijving van de soort en de te verwachten hoeveelheden afvalstoffen;

      g. een beschrijving van de methoden voor het registreren van het feitelijk gebruik van de voorzieningen voor de
      inzameling van afvalstoffen;

      h. een beschrijving van de wijze waarop ingezamelde afvalstoffen worden verwijderd; en

      i. vermelding van één of meerdere personen die verantwoordelijk zijn voor de uitvoering van het plan.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26j
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.27m
