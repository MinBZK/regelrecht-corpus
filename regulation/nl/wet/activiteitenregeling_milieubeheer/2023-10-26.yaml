      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover
      dat niet mogelijk, is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan, bedoeld in [artikel 4.9 van het besluit][ref1], voldoet
      de opslag in verpakking van stoffen van ADR klasse 5.2 type C of het gebruik of de opslag in verpakking van
      stoffen van ADR klasse 5.2, type D tot en met F, bedoeld in [artikel 4.8 van het besluit][ref2], aan de
      [artikelen 4.23 tot en met 4.27][ref3].

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.9 van het besluit][ref4], voldoet de opslag in verpakking van stoffen van ADR klasse 5.2 type C
      of het gebruik of de opslag in verpakking van stoffen van ADR klasse 5.2 type D tot en met F als bedoeld in
      [artikel 4.8 van het besluit][ref5], aan de [artikelen 4.23][ref6], [4.26][ref7] en [4.27][ref8].


