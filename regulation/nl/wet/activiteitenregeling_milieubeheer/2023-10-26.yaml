  - number: '3.33'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.30 van het besluit][ref1] wordt bij het opslaan van vloeibare brandstof, afgewerkte olie of bepaalde
      organische oplosmiddelen, bedoeld in [artikel 3.29, eerste lid, van het besluit][ref2] en bij het opslaan van
      vloeibare bodembedreigende stoffen, bedoeld in artikel 3.29, tweede lid, van het besluit in een ondergrondse
      opslagtank van metaal of kunststof voldaan aan de [artikelen 3.34 tot en met 3.37][ref3].

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.30 van het besluit][ref4] wordt bij het opslaan van vloeibare bodembedreigende stoffen, bedoeld
      in [artikel 3.29, tweede lid, van het besluit][ref5] in een betonnen constructie die geheel of gedeeltelijk
      ondergronds ligt, voldaan aan [artikel 3.37a][ref6].

      3 Ten behoeve van voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      luchtverontreiniging wordt bij het opslaan van lichte olie in een ondergrondse opslagtank voldaan aan
      [artikel 3.38a][ref7].

      4 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico of het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan als bedoeld in
      [artikel 3.30 van het besluit][ref8], wordt bij het opslaan van vloeibare brandstof, afgewerkte olie of bepaalde
      organische oplosmiddelen, bedoeld in [artikel 3.29, eerste lid, van het besluit][ref9] en bij het opslaan van
      vloeibare bodembedreigende stoffen, bedoeld in artikel 3.29, tweede lid, van het besluit in een ondergrondse
      opslagtank van metaal of kunststof voldaan aan [artikel 3.38][ref10].


