  - number: '3.9'
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt de uitvoering, opstelling en onderhoud van de technische installatie voor het
      reduceren van aardgasdruk, meten en regelen van aardgashoeveelheid of aardgaskwaliteit uitgevoerd overeenkomstig de
      voorschriften 8.1 tot en met 8.3.3, 9.1 tot en met 9.7, 10.1 tot en met 10.4 en 12.3 van NEN 1059.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.9
  - number: '3.10'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet de opslag van tetrahydrothiofeen in bovengrondse opslagtanks of condensaat
      in ondergrondse opslagtanks behorende bij een inrichting waar aardgasdruk wordt gereduceerd of aardgashoeveelheid
      wordt gemeten ten minste aan de richtlijn tankinstallaties (PBV Rapport P 107776 2004-01-12) of gelijkwaardig
      hieraan.

      2 Een opgestelde Risico Inventarisatie en -evaluatie als bedoeld in BRL K903 door een persoon of instelling die
      daartoe is gecertificeerd op grond van die BRL, waarin is aangetoond dat de installatie aan deze richtlijn voldoet
      en een verklaring van een geaccrediteerde certificatie-instelling dat het non-standaard-deel van de installatie is
      uitgevoerd overeenkomstig de Risico Inventarisatie en -evaluatie wordt binnen drie maanden na installatie aan het
      bevoegd gezag overlegd. In geval van relevante wijzigingen wordt deze procedure herhaald.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.10
  - number: '3.11'
    text: |-
      Deze paragraaf is van toepassing op het in werking hebben van een windturbine die geen deel uitmaakt van een
      windturbinepark.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.11
  - number: '3.12'
    text: |-
      1 Ten behoeve van het voorkomen of beperken van slagschaduw en lichtschittering is de windturbine voorzien van
      een automatische stilstandvoorziening die de windturbine afschakelt indien slagschaduw optreedt ter plaatse van
      gevoelige objecten voorzover de afstand tussen de windturbine en de gevoelige objecten minder dan 12 maal de
      rotordiameter bedraagt en gemiddeld meer dan 17 dagen per jaar gedurende meer dan 20 minuten per dag slagschaduw
      kan optreden en voorzover zich in de door de slagschaduw getroffen uitwendige scheidingsconstructie van gevoelige
      gebouwen of woonwagens ramen bevinden. De afstand geldt van een punt op ashoogte van de windturbine tot de gevel
      van het gevoelige object.

      2 Het bevoegd gezag kan met betrekking tot het in werking hebben van een windturbine aanvullend
      maatwerkvoorschriften stellen ten behoeve van het voorkomen of beperken van hinder door slagschaduw indien het
      eerste lid in een specifiek geval niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.12
  - number: '3.13'
    text: |-
      1 Ten behoeve van het voorkomen of beperken van slagschaduw en lichtschittering wordt lichtschittering bij het
      in werking hebben van een windturbine zoveel mogelijk voorkomen of beperkt door toepassing van niet reflecterende
      materialen of coatinglagen op de betreffende onderdelen. Het meten van reflectiewaarden vindt plaats overeenkomstig
      NEN-EN-ISO 2813 of een daaraan ten minste gelijkwaardige meetmethode.

      2 Het bevoegd gezag kan met betrekking tot het in werking hebben van een windturbine aanvullend
      maatwerkvoorschriften stellen ten behoeve van het voorkomen of beperken van hinder door lichtschittering indien het
      eerste lid in een specifiek geval niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.13
  - number: '3.14'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet een windturbine aan de veiligheidseisen opgenomen in:

      a. NEN-EN-IEC 61400-1;

      b. NEN-EN-IEC 61400-2;

      c. NEN-EN-IEC 61400-3.

      2 In afwijking van het eerste lid voldoet een windturbine die is opgericht voor *1 januari 2017* of dient ter
      vervanging van een windturbine die is opgericht voor *1 januari 2017* aan NEN-EN-IEC 61400-2:2006: Europese norm
      voor Windturbines – Deel 2: Ontwerp eisen van kleine windturbines, september 2006 of aan NVN 11400-0.

      3 Aan het eerste lid wordt voldaan indien voor de windturbine een certificaat is afgegeven door een certificerende
      instantie waaruit blijkt dat de windturbine voldoet aan deze regels. De certificerende instantie is geaccrediteerd
      voor het afgeven van certificaten, overeenkomstig de normen bedoeld in het eerste lid bij de Raad voor Accreditatie
      of bij een accrediterende instantie die erkend is door een andere staat, aangesloten bij de Multilateral Agreement
      on European Accreditation of Certification.

      4 In afwijking van het eerste, tweede en derde lid gelden ten aanzien van een windturbine die voor 1 december
      2001 is opgericht en waarvoor tot die datum een vergunning in werking en onherroepelijk was, de in die vergunning
      opgenomen voorschriften met betrekking tot de veiligheid van de installatie.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.14
  - number: 3.14a
    text: |-
      Het rapport van een akoestisch onderzoek, bedoeld in [artikel 1.11, derde lid, van het besluit][ref1], bevat de
      volgende gegevens:

      a. de naam van de opdrachtgever van het onderzoek;

      b. de naam van de instantie die het onderzoek heeft uitgevoerd;

      c. de datum van het onderzoek;

      d. de aanleiding en het doel van het onderzoek;

      e. de gegevens waarmee wordt aangetoond dat de betreffende situatie valt binnen het toepassingsbereik van de
      gebruikte methode;

      f. indien een andere methode dan die is opgenomen in deze regeling wordt gebruikt, wordt de noodzaak daarvan
      aangegeven en wordt de toegepaste methode beschreven en verantwoord;

      g. indien een rekenmethode wordt toegepast, alle ingevoerde gegevens en tevens de geraadpleegde
      windfrequentiegegevens;

      h. een of meer kaarten of tekeningen op een zodanige schaal dat een duidelijk beeld wordt gegeven van bestaande
      of voorgenomen windturbines en van gevoelige gebouwen of gevoelige terreinen waarop het akoestisch onderzoek
      betrekking heeft;

      i. de waarneempunten;

      j. de situering, akoestisch relevante dimensies en de aard van de doorgerekende geluidsbeperkende of afschermende
      maatregelen, zowel op oorspronkelijk kaartmateriaal als in de vorm van de geschematiseerde computerinvoer;

      k. de situering, akoestisch relevante dimensies en de aard van de overige geluidsreflecterende en -afschermende
      objecten of constructies;

      l. de scheidingslijn of scheidingslijnen tussen akoestisch harde en zachte bodemvlakken, met een aanduiding van de
      aard van de bodem;

      m. in akoestisch gecompliceerde situaties, een grafische weergave van de bij de berekeningen gehanteerde
      geometrische invoergegevens;

      n. de bestaande en toekomstige geluidsbelastingen vanwege een windturbine of een combinatie van windturbines van
      de gevel van een gevoelig object of van de grens van een gevoelig terrein voor de situatie waarin geen maatregelen
      zijn genomen ter vermindering van de geluidsemissie of ter beperking van de geluidsoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.11
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.14a
    references:
