  - number: 3.4f
    text: |-
      1 De achtergrondwaarden aan chemische zuurstofverbruik (CZV) en ammonium-stikstof (N-NH4) worden vastgesteld in het
      grondwater van een bovenstrooms geplaatste peilbuis.

      2 Eenmaal per kalenderjaar wordt een gefiltreerd monster dat genomen is uit het horizontaal monitoringssysteem of
      uit de peilbuizen geanalyseerd op CZV en N-NH4. Tussen opeenvolgende monsternames ligt ten minste elf maanden.

      3 De resultaten van deze analyses worden eenmaal per twee kalenderjaren gerapporteerd aan het bevoegd gezag. De
      rapportage vindt plaats binnen twee maanden na de laatste van de monsternames, bedoeld in het tweede lid.

      4 Indien de gemeten waarden meer dan 50% hoger zijn dan de achtergrondwaarden wordt binnen twee maanden een nieuw
      grondwatermonster uit het monitoringssysteem geanalyseerd, alsmede een grondwatermonster uit de bovenstrooms
      geplaatste peilbuis.

      5 Indien de gemeten waarden gedurende drie opeenvolgende waarnemingen gemiddeld meer dan 50% hoger zijn dan de
      achtergrondwaarden, wordt de meetfrequentie verhoogd naar twee monsters per jaar voor de desbetreffende peilbuis.
      Tussen opeenvolgende monsternames liggen ten minste vijf maanden.

      6 Meetwaardes die meer dan 50% hoger zijn dan de achtergrondwaarde, worden gerapporteerd aan het bevoegd gezag.

      7 Indien de gemeten waarden gedurende drie opeenvolgende waarnemingen gemiddeld meer dan 50% hoger zijn dan de
      achtergrondwaarden en de afwijking geweten kan worden aan bedrijfsmatige activiteiten:

      a. worden de daarna te nemen monsters geanalyseerd op de stoffen, genoemd in NEN 5740, en

      b. wordt in overleg met en met instemming van het bevoegd gezag een herstelplan opgesteld.

      8 Het plaatsen van de peilbuizen, de analyses van de grondwatermonsters en het opstellen van de rapporten, bedoeld
      in het eerste tot en met zevende lid, en in [artikel 3.4e][ref1], worden uitgevoerd door een persoon of een
      instelling die daartoe beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.4e
      [ref2]: https://wetten.overheid.nl/BWBR0022929
