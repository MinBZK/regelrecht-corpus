  - number: 4.84.7
    text: |-
      1 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden emissies als bedoeld in
      [artikel 4.74.7, onder a, van het besluit][ref1], bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van
      een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op
      een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.

      2 Het bevoegd gezag kan in het belang van de plaatselijke milieuomstandigheden met inachtneming van
      [artikel 2.4, achtste lid, van het besluit][ref2] maatwerkvoorschriften stellen aan de ligging en uitvoering van
      het afvoerpunt van de emissies naar de buitenlucht, bedoeld in [artikel 4.74.7, onder a, van het besluit][ref3].


