  - number: '2.2'
    text: |-
      1 Indien een geomembraanbaksysteem als bodembeschermende voorziening is toegepast, waarop op grond van
      [artikel 6.2][ref1] het [eerste lid van artikel 2.1][ref2] niet van toepassing is, worden twee grondwaterpeilbuizen
      geïnstalleerd overeenkomstig paragraaf 1.3 van bijlage 3 van deel 3 bij de NRB zodat bodemverontreiniging door
      vloeibare brandstoffen kan worden gesignaleerd.

      2 Indien stoffen als bedoeld in [artikel 3.29 van het besluit][ref3] worden opgeslagen in een ondergrondse
      opslagtank of betonnen constructie die geheel of gedeeltelijk ondergronds ligt, wordt per opslagtank of constructie
      ten minste één grondwaterpeilbuis geïnstalleerd overeenkomstig paragraaf 1.3 van bijlage 3 bij deel 3 van de NRB.
      Indien er meerdere opslagtanks of constructies zijn, wordt per groep van drie opslagtanks of constructies, die
      binnen tien meter van elkaar zijn gelegen, ten minste één grondwaterpeilbuis geïnstalleerd.

      3 Het tweede lid is niet van toepassing op een ondergrondse opslagtank, die:

      a. dubbelwandig is uitgevoerd met een systeem voor lekdetectie in de wand, of

      b. in een afgedekte betonnen bak is geplaatst met een systeem voor lekdetectie in deze bak die zich onder de
      opslagtank bevindt.

      Het systeem voor lekdetectie voldoet en wordt ten minste eenmaal per jaar beoordeeld en goedgekeurd overeenkomstig
      het daartoe krachtens het [Besluit bodemkwaliteit][ref4] aangewezen normdocument, door een persoon of instelling,
      die daartoe beschikt over een erkenning op grond van dat besluit.

      4 De grondwaterpeilbuizen als bedoeld in het eerste en tweede lid, worden zo vaak als de omstandigheden daartoe
      aanleiding geven, doch ten minste eens per jaar bemonsterd overeenkomstig NEN 5744. Bij bemonstering van
      grondwaterpeilbuizen bij een ondergrondse opslagtank met vloeibare brandstof of afgewerkte olie worden de monsters
      onderzocht op aanwezigheid van minerale oliecomponenten overeenkomstig NEN-EN-ISO 9377-2, vluchtige aromaten
      (BETX) volgens NEN-EN-ISO 15680 en, voor zover er sprake is van de opslag van lichte olie, tevens op MTBE en ETBE
      door een laboratorium, dat daartoe beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref5].
      Bij bemonstering van grondwaterpeilbuizen bij de opslag van pekel in een ondergrondse opslagtank of betonnen
      constructie die geheel of gedeeltelijk ondergronds ligt, worden de monsters op aanwezigheid van chloride onderzocht
      overeenkomstig NEN-EN-ISO 15682 door een laboratorium, dat daartoe beschikt over een erkenning op grond van het
      Besluit bodemkwaliteit. Bij bemonstering van grondwaterpeilbuizen bij een ondergrondse opslagtank met stoffen
      waarvoor geen NEN of ISO is vastgesteld voor het onderzoek naar de aanwezigheid daarvan, worden de monsters
      onderzocht volgens een methode die daarvoor geschikt is.

      5 De installatie van een grondwaterpeilbuis als bedoeld in het eerste en tweede lid, en de bemonstering als
      bedoeld in het vierde lid, vinden plaats door een bedrijf, dat daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref6].

      6 Degene die de inrichting drijft, zendt de gegevens van de bemonstering en analyse van de grondwaterpeilbuizen ten
      aanzien van de stoffen MTBE en ETBE, bedoeld in het vierde lid, terstond door aan het bestuursorgaan, bedoeld in
      [artikel 27, eerste lid, van de Wet bodembescherming][ref7], indien:

      a. de geanalyseerde waarde van de MTBE- of ETBE-verontreiniging hoger is dan 1 microgram per liter, voor zover de
      inrichting is gelegen in een grondwaterbeschermingsgebied;

      b. de geanalyseerde waarde van de MTBE- of ETBE-verontreiniging hoger is dan 15 microgram per liter, voor zover de
      inrichting is gelegen buiten een grondwaterbeschermingsgebied.

      7 Het eerste tot en met het zesde lid, zijn niet van toepassing ten aanzien van inrichtingen waar de gemiddeld
      laagste grondwaterstand zich meer dan vijf meter beneden het maaiveld bevindt. Indien deze inrichting echter
      is gelegen in een grondwaterbeschermingsgebied is er een systeem voor lekdetectie aanwezig dat voldoet en
      dat ten minste eenmaal per jaar wordt beoordeeld en goedgekeurd overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref8] aangewezen normdocument, door een persoon of instelling, die daartoe beschikt over
      een erkenning op grond van dat besluit.


