        bwb_id: BWBR0022762
        artikel: 4.74.3
  - number: 4.84.4
    text: |-
      Aan [artikel 4.74.4 van het besluit][ref1] wordt in ieder geval voldaan indien de afgezogen emissies die vrijkomen
      worden gevoerd door een gaswasser die in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo
      vaak als voor de goede werking nodig is, wordt schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74.4
