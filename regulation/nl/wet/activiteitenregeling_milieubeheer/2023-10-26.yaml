  - number: '5.8'
    text: |-
      1 Aan de van toepassing zijnde emissiegrenswaarde wordt, voor zover continu wordt gemeten, in ieder geval voldaan
      indien in een kalenderjaar:

      a. geen gevalideerd maandgemiddelde de toepasselijke emissiegrenswaarde overschrijdt;

      b. geen gevalideerd daggemiddelde 110% van de toepasselijke emissiegrenswaarde overschrijdt;

      c. 95% van alle gevalideerde uurgemiddelden over een jaar niet hoger is dan 200% van de toepasselijke
      emissiegrenswaarde.

      2 Voor de toepassing van het eerste lid worden niet meegerekend: meetuitkomsten, verkregen tijdens periodes waarin
      een stookinstallatie op grond van [artikel 5.10][ref1] of [5.11 van het besluit][ref2] in werking mag zijn,
      meetuitkomsten verkregen tijdens storingen in de apparatuur die de emissiereductie bewerkstelligt en meetuitkomsten
      verkregen tijdens periodes van opstarten en stilleggen.

      3 De periodes van opstarten en stilleggen worden bepaald in overeenstemming met uitvoeringsbesluit van de Commissie
      van 7 mei 2012 betreffende de vaststelling van opstart- en stilleggingsperioden voor de toepassing van de EU-
      richtlijn industriële emissies.

      4 Aan de van toepassing zijnde emissiegrenswaarde wordt, voor zover periodiek wordt gemeten, in ieder geval voldaan
      indien geen enkele gevalideerde meetuitkomst de emissiegrenswaarde overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.10
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5.11
