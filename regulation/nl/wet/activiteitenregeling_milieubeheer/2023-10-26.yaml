        bwb_id: BWBR0022762
        artikel: '3.125'
  - number: '3.101'
    text: |-
      In de gedragsvoorschriften, bedoeld in [artikel 3.125, zevende lid, van het besluit][ref1] wordt ten minste
      aangegeven:

      a. wanneer en op welke wijze de schoonmaak en het onderhoud van het luchtwassysteem door een deskundige op het
      gebied van luchtwassystemen zullen plaatsvinden;

      b. wanneer en op welke wijze de visuele controles en schoonmaak van het luchtwassysteem door de drijver van de
      inrichting zullen plaatsvinden;

      c. op welke wijze de waarden en instellingen van het luchtwassysteem die bepalend zijn voor de goede werking worden
      gecontroleerd, en

      d. welke maatregelen als bedoeld in [artikel 3.125, zesde lid, van het besluit][ref2] worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.125
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.125
