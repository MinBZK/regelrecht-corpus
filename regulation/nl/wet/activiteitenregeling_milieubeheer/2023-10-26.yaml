  - number: 4.102e
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het offsetdrukken het verwerken van
      inkten, verdunningsmiddelen, reinigingsmiddelen en toevoegmiddelen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.102e
  - number: 4.102ea
    text: |-
      1 Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.94de van het besluit][ref1], worden gassen en dampen die vrijkomen bij het heatsetdrogen, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in [artikel 4.94de van het besluit][ref2], worden de afgezogen gassen en dampen, die
      naar de buitenlucht worden afgevoerd, ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de
      uitmonding gelegen gebouwen afgevoerd.

      3 Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      geurgevoelig object per hectare.

      4 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege onvoldoende
      verspreiding van afgezogen dampen of gassen, met betrekking tot geuremissies die niet via de afzuiging worden
      afgevoerd of incidentele geurpieken overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref3] in aanvulling
      op het tweede lid maatwerkvoorschriften stellen inzake:

      a. de situering van de afvoerpijp;

      b. het voorkomen of beperken van diffuse geuremissies, of

      c. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      5 In afwijking van het tweede lid, kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het vierde lid onvoldoende zijn om de overschrijding ongedaan te maken
      overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref4] maatwerkvoorschriften opstellen met betrekking tot
      de aanwezigheid van een ontgeuringsinstallatie, of een grotere afvoerhoogte van de afgezogen dampen en gassen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.94de
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.94de
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
