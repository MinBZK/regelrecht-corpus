      1 Deze paragraaf is tot en met 30 juni 2025 van toepassing op het in werking hebben van een windturbine die deel
      uitmaakt van een windturbinepark waarvoor:

      a. uiterlijk op 30 juni 2021:

      1°. een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder e of onder i, van de Wet algemene bepalingen omgevingsrecht][ref1] is verleend; en

      2°. een omgevingsvergunning als bedoeld in [artikel 2.1, eerste lid, onder c, van die wet][ref2] is verleend
      dan wel een bestemmingsplan als bedoeld in [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref3],
      inpassingsplan als bedoeld in [artikel 3.26][ref4] of [3.28 van die wet][ref5] of beheersverordening als bedoeld in
      [artikel 3.38 van die wet][ref6] is vastgesteld, waarin in het windturbinepark wordt voorzien; en

      b. sinds 30 juni 2021 geen wijziging van kracht is geworden in de omgevingsvergunning, bedoeld onder a, onder 1°,
      of, voor zover dat op het windturbinepark betrekking had, het besluit, bedoeld onder b, onder 2°.

      2 Deze paragraaf is niet van toepassing op het in werking hebben van een windturbine als bedoeld in het eerste
      lid, vanaf het tijdstip waarop met betrekking tot de windturbine of het windturbinepark waarvan de windturbine deel
      uitmaakt, een wijziging van de omgevingsvergunning of het bestemmingsplan van kracht wordt.

      3 Bij de toepassing van deze paragraaf is [bijlage 4][ref7] van overeenkomstige toepassing met betrekking tot het
      doen van een melding voor het veranderen van een inrichting en het veranderen van de werking daarvan op grond van
      [artikel 1.10 van het besluit][ref8].


