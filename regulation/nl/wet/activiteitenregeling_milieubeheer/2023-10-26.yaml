      1 Ten behoeve van het voorkomen dan wel beperken van diffuse emissie en het bevorderen van de doelmatige
      verspreiding van emissies naar de buitenlucht worden ten minste bij het inpandig opslaan en overslaan van
      stuifgevoelige goederen de emissies, bedoeld in [artikel 3.38 van het besluit][ref1], die naar de buitenlucht
      worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een
      gevoelig gebouw is gelegen, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een
      bedrijventerrein met minder dan één gevoelig gebouw per hectare.

      2 Het bevoegd gezag kan in het belang van de luchtkwaliteit en maatwerkvoorschriften stellen met
      betrekking tot de ligging en uitvoering van het afvoerpunt van de emissies naar de lucht, bedoeld in
      [artikel 3.38 van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.38
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.38
