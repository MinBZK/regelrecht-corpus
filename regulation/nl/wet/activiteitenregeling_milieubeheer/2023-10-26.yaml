  - number: '3.48'
    text: |-
      1 Aan [artikel 3.38, tweede lid, van het besluit][ref1] wordt bij het mengen van goederen behorend tot de
      stuifklassen S1, S2, S3 of S4 van [bijlage 3 bij het besluit][ref2] in een gesloten ruimte in ieder geval voldaan
      indien de ruimte op onderdruk wordt gehouden en de afgezogen lucht door een filtrerende afscheider wordt gevoerd
      die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede werking nodig
      is, wordt schoongemaakt en vervangen.

      2 Aan [artikel 3.32, aanhef en onder a en b, van het besluit][ref3] wordt bij het mengen van goederen behorend tot
      de stuifklasse S2 en S4 van [bijlage 3 bij het besluit][ref4] in de buitenlucht in ieder geval voldaan indien bij
      het opbouwen en afgraven van een menghoop deze goederen worden bevochtigd.


