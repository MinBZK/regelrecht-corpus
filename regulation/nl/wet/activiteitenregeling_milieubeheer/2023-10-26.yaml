  - number: 4.20a
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet de opslag van propeen aan het tweede tot en met het zevende lid.

      2 Een opslagtank met propeen is, voor zover van toepassing, in overeenstemming met het
      [Warenwetbesluit drukapparatuur][ref1] en voldoet aan de hoofdstukken 2 en 4, met uitzondering van de paragrafen
      4.3 en 4.4 en aan de hoofdstukken 5 en 6 van PGS 19, met dien verstande dat een brandmuur niet is toegestaan.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat een brandmuur is toegestaan indien redelijkerwijs niet
      kan worden voldaan aan de interne veiligheidsafstanden uit de PGS 19. De brandmuur voldoet aan de paragrafen 4.2.4
      tot en met 4.2.7 en de voorschriften 4.8.5, 4.8.7 van de PGS 19.

      4 Een opslagtank met propeen met toebehoren, leidingen en andere installatieonderdelen wordt gekeurd, herkeurd en
      onderhouden overeenkomstig NEN-EN 12817 en NPR 2578.

      5 Van de bevindingen van de keuringen en herkeuringen, bedoeld in het derde lid, zijn binnen de inrichting
      gedagtekende verklaringen aanwezig of op een door het bevoegd gezag te stellen termijn beschikbaar gesteld, die
      zijn afgegeven door of namens degene die de keuringen of herkeuringen heeft uitgevoerd. Deze verklaringen zijn,
      evenals alle relevante informatie voor een juist gebruik van de installatie en rapportages van uitgevoerd onderhoud
      en uitgevoerde werkzaamheden, opgenomen of samengevat in een installatieboek.

      6 In afwijking van het tweede lid is voor een opslagtank met propeen die is geïnstalleerd voor 1 januari 2016 de
      interne veiligheidsafstand die gold tot die datum van toepassing indien die afstand kleiner is dan de afstand die
      volgt uit de PGS 19.

      7 In afwijking van het tweede en derde lid mag de afstand worden verkleind tot 3 meter voor opslagtanks die zijn
      geïnstalleerd voor 1 januari 2016, als er een brandmuur is geplaatst conform CPR 11-2 voorschrift 8.1.5 of als voor
      die datum met een berekening is aangetoond dat de warmtestraling op de opslagtank ten hoogste 10 kW per vierkante
      meter bedraagt.


