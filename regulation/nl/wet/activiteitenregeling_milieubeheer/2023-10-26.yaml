        artikel: 4.74.4
  - number: 4.84.5
    text: |-
      1 Aan [artikel 4.74.5, eerste lid, van het besluit][ref1], wordt in ieder geval voldaan indien de afgezogen
      emissies die vrijkomen, worden gevoerd door een filtrerende afscheider die in goede staat van onderhoud verkeert,
      periodiek wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.

      2 Het uitbreken of ontzanden van een gietstuk als bedoeld in [artikel 4.74.5, derde lid, van het besluit][ref2],
      vindt plaats in een gesloten ruimte met gesloten deuren en ramen waarbij wordt voorkomen dat bij het openen van
      deuren en ramen stof naar de buitenlucht vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74.5
