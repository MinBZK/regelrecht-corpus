      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 3.144, aanhef en onder a, van het besluit][ref1], wordt
      bij het schieten op een binnenschietbaan ten minste voldaan aan het tweede en derde lid.

      2 De constructie van een binnenschietbaan voldoet ten minste aan de in tabel 3.110 aangegeven maatvoering.

      3 Een binnenschietbaan heeft een doelmatige kogelvanger die ten minste voldoet aan de in tabel 3.110 aangegeven
      maatvoering.

      4 In afwijking van het tweede en derde lid kan het bevoegd gezag bij maatwerkvoorschrift eisen stellen ten aanzien
      van de constructie en de kogelvanger.


