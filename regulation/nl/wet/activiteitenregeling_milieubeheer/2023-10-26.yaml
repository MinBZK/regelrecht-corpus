  - number: '4.15'
    text: |-
      1 Een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages voor het opslaan van
      halfzware olie of polyesterhars, is geïnstalleerd en wordt onderhouden en gerepareerd overeenkomstig BRL K903,
      door een bedrijf dat op grond van die BRL daartoe is gecertificeerd. De opslagtank, bedoeld in de eerste volzin
      wordt beoordeeld en goedgekeurd overeenkomstig BRL K903, door een persoon of instelling die is gecertificeerd
      overeenkomstig dat document.

      2 Een stationaire bovengrondse opslagtank waarop een ondergrondse leiding is aangesloten voor het opslaan van
      stoffen van klasse 5.1 van het ADR of stoffen van de klasse 8 van het ADR, verpakkingsgroepen II en III zonder
      bijkomend gevaar, is geïnstalleerd en wordt onderhouden en gerepareerd overeenkomstig BRL K903, door een bedrijf
      dat op grond van die BRL daartoe is gecertificeerd. De opslagtank, bedoeld in de eerste volzin wordt beoordeeld
      en goedgekeurd overeenkomstig BRL K903, door een persoon of instelling die is gecertificeerd overeenkomstig dat
      document.

      3 Ondergrondse leidingen inclusief appendages worden beoordeeld en goedgekeurd overeenkomstig AS 6800 door een
      persoon of instelling die beschikt over een erkenning overeenkomstig dat document.

      4 Het opslaan van halfzware olie in een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en
      appendages voldoet aan de volgende onderdelen van PGS 30:

      a. de paragrafen 2.2 en 2.3;

      b. de voorschriften 2.4.3, 2.6.1, 2.6.3 tot en met 2.6.6 en 2.6.14, en

      c. paragraaf 4.2, met uitzondering van voorschrift 4.2.3 en tabel 4.1.

      5 Een opslagtank als bedoeld in het eerste lid voor het opslaan van halfzware olie of polyesterhars bevindt zich
      niet op een verdieping.

      6 Het gebruik van de installaties waarin het opslaan, vullen en afleveren van halfzware olie plaatsvindt in een
      stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages, voldoet aan de volgende
      onderdelen van PGS 30:

      a. voorschrift 3.2.4;

      b. de paragrafen 3.3, 3.5, 3.6, 5.2 en 5.4, en

      c. de voorschriften 5.5.1, 5.5.2, 5.6.1, 5.6.3 en 5.6.4.

      7 Voor een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages gelden de keurings-
      en herkeuringstermijnen van tabel 4.15.


