  - number: '3.114'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, bedoeld in [artikel 3.146 van het besluit][ref1], wordt bij het traditioneel
      schieten ten minste voldaan aan het vierde tot en met zevende lid.

      2 Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      belasting van de bodem, bedoeld in [artikel 3.146 van het besluit][ref2], wordt bij het traditioneel schieten
      voldaan aan het derde, vierde en zevende lid.

      3 Indien bij het schieten hulzen van verschoten munitie vrijkomen, vindt het schieten plaats boven een
      bodembeschermende voorziening.

      4 Het schieten vindt op zodanige wijze plaats dat alle afgeschoten kogels worden opgevangen in een voorziening. De
      voorziening is opgesteld boven een bodembeschermende voorziening.

      5 Gedurende de periode dat wordt geschoten bevinden zich geen personen of veediersoorten in de onveilige zone,
      uitgezonderd de schutter, de baancommandant en één of meerdere door de baancommandant aangewezen personen. De
      onveilige zone omvat de oppervlakte van een rechthoek van twee meter aan weerszijde van de voorziening waarin de
      afgeschoten kogels worden opgevangen, bedoeld in het vierde lid, bij acht meter. De zone bevindt zich aan de zijde
      waar op het doel wordt geschoten.

      6 In afwijking van het vijfde lid omvat de onveilige zone bij het schieten op een houten blok of knoest met kogels
      van kalibernummer 16 of kleiner de oppervlakte van een halve cirkel met een straal van 25 meter met het doel waarop
      wordt geschoten als middelpunt. De zone bevindt zich aan de zijde waar op het doel wordt geschoten.

      7 In afwijking van het vierde tot en met het zesde lid kan het bevoegd gezag bij de viering van festiviteiten
      maatwerkvoorschriften stellen ten behoeve van:

      a. het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de belasting van de
      bodem; en

      b. met betrekking tot de onveilige zone.

      8 De dagen of dagdelen waarop festiviteiten als bedoeld in het zevende lid plaatsvinden worden door het bevoegd
      gezag bij maatwerkvoorschrift aangewezen, met dien verstande dat het aantal aan te wijzen dagen of dagdelen niet
      meer dan twaalf per kalenderjaar bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.146
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.146
