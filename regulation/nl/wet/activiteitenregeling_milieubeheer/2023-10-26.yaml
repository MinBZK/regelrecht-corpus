  - number: '4.116'
    text: |-
      1 Ten behoeve van de bescherming van het milieu wordt bij het lozen van afvalwater afkomstig van een laboratorium
      of een praktijkruimte op het vuilwaterriool ten minste voldaan aan het tweede tot en met het vierde lid.

      2 Degene die de inrichting drijft, stelt gedragsvoorschriften op en treft voorzieningen die zijn gericht op
      het voorkomen van nadelige gevolgen voor het milieu van het lozen van afvalwater en draagt er zorg voor dat de
      gedragsvoorschriften worden nageleefd.

      3 De gedragsvoorschriften en voorzieningen, bedoeld in het tweede lid, geven ten minste uitwerking aan:

      a. de wijze waarop invulling wordt gegeven aan een inzamelsysteem voor bepaalde categorieën van stoffen en
      preparaten die niet mogen worden geloosd vanuit het oogpunt van doelmatig kunnen inzamelen en verwerken elders;

      b. de wijze waarop invulling wordt gegeven aan voorlichting van het personeel over het inzamelsysteem, bedoeld
      onder a;

      c. de wijze waarop invulling wordt gegeven aan maatregelen die voortkomen uit de preventieve aanpak;

      d. de inhoud van een registratiesysteem met betrekking tot de aanwezige stoffen.

      4 Het bevoegde gezag kan indien het belang van de bescherming van het milieu daartoe noodzaakt,
      maatwerkvoorschriften stellen ten aanzien van de invulling van de gedragsvoorschriften en voorzieningen, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.116
  - number: '4.117'
    text: |-
      1 Ten behoeve van het voorkomen dan wel beperken van diffuse emissies:

      a. past degene die de inrichting drijft maatregelen ten aanzien van de bedrijfsvoering toe ter voorkoming van
      onnodige emissie van stoffen naar de lucht;

      b. worden stof, rook en dampen die vrijkomen bij activiteiten in een laboratorium of praktijkruimte voor zover dat
      redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden voor zover het afgezogen
      emissies betreft die vrijkomen bij activiteiten in een laboratorium of praktijkruimte, die naar de buitenlucht
      worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig
      gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein met
      minder dan één gevoelig gebouw per hectare, is gelegen.

      3 Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.

      4 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref1], is het
      tweede lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref2] nodig is en voor zover de emissies als bedoeld in het tweede lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      5 In afwijking van het vierde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het derde lid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
