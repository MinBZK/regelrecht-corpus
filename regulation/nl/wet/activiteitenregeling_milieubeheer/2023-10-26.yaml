      1 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt of het bodemrisico
      niet verwaarloosbaar is als bedoeld in [artikel 3.169 van het besluit][ref1], bij maatwerkvoorschrift eisen dat
      uitwerpselen, voedselresten en dierlijke bijproducten met een bepaalde frequentie worden verwijderd uit een ruimte
      voor het fokken, houden of trainen van vogels of zoogdieren die geheel of gedeeltelijk in de open lucht ligt.

      2 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt, en maatwerk op grond
      van het eerste lid onvoldoende is om de overschrijding ongedaan te maken, bij maatwerkvoorschrift eisen stellen aan
      de uitvoering en ligging van een ruimte voor het fokken, houden of trainen van vogels of zoogdieren die geheel of
      gedeeltelijk in de open lucht ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.169
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.124
