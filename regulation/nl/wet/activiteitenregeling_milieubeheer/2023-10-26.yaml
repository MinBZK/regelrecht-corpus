  - number: 4.86a
    text: |-
      1 Onverminderd [artikel 4.86][ref1] voldoet een bunkerstation bij het afleveren van vloeibare brandstof aan
      vaartuigen ten minste aan:

      a. de volgende onderdelen van PGS 28:

      1°. de voorschriften 2.3.8, 2.3.11 en 2.3.12;

      2°. de voorschriften 3.4.4 en 3.4.6 tot en met 3.4.11, en

      3°. de voorschriften 5.5.1, 5.5.2, 5.5.3, 5.6.1, 5.6.2 en 5.7.1,

      waarbij voor ‘voertuig’ wordt gelezen ‘vaartuig’ en

      b. de artikelen 21, 35 aanhef en onder b, e, f, j, k, 36, 45, 46 en 47 van
      [bijlage 3.8 bij de Binnenvaartregeling][ref2].

      2 Het bevoegd gezag kan indien de technische staat van het bunkerstation onvoldoende is bij
      maatwerkvoorschrift eisen stellen die leiden tot een beschermingsniveau dat gelijkwaardig is aan
      [bijlage 3.8 bij de Binnenvaartregeling][ref3].

      3 Dit artikel is niet van toepassing op een bunkerstation dat beschikt over een certificaat als bedoeld in
      [artikel 6 van het Binnenvaartbesluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4.86
