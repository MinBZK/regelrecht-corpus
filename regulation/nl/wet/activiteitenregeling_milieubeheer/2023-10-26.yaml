  - number: 3.16f
    text: |-
      1 Voor het bijhouden van een registratie met betrekking tot het in werking hebben van een gesloten
      bodemenergiesysteem overeenkomstig [artikel 3.16n, eerste lid, onder a, van het besluit][ref1] worden tijdens de
      bedrijfsvoering van het systeem momentane metingen uitgevoerd met een nauwkeurigheid van ten minste 0,3°C en een
      frequentie van ten minste eenmaal per 15 minuten.

      2 Voor het bijhouden van een registratie met betrekking tot het in werking hebben van een gesloten
      bodemenergiesysteem overeenkomstig [artikel 3.16n, eerste lid, onder b, van het besluit][ref2] worden tijdens de
      bedrijfsvoering van het systeem momentane metingen uitgevoerd met een nauwkeurigheid van ten minste 5 % en een
      frequentie van ten minste eenmaal per 15 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.16n
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.16n
