  - number: '4.54'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden verspanende, spaanloze en thermische
      bewerkingen en mechanische eindafwerkingen van metalen, waarbij vloeibare bodembedreigende stoffen worden gebruikt,
      en het mechanisch verkleinen van metalen waarbij gebruik wordt gemaakt van een installatie met een oliecircuit
      plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.54
  - number: 4.54a
    text: |-
      Bij het lassen van metalen wordt de volgende klassenindeling, bedoeld in
      [artikel 4.40, tweede lid, van het besluit][ref1], aangehouden:

      a. Klasse I en II:

      − TIG-lassen, plasmalassen, druklassen, autogeen lassen en onder poederlassen van alle materialen met uitzondering
      van geverfde materialen.

      b. Klasse III:

      − Lassen met beklede elektroden van alle materialen met uitzondering van roestvast staal, beryllium- en
      vanadiumlegeringen en met uitzondering van geverfde materialen;

      − MAG-lassen met gevulde draad van alle materialen met uitzondering van roestvast staal en geverfde materialen;

      − MIG/MAG-lassen met massieve draad van alle materialen met uitzondering van koper-, berylliumen vanadiumlegeringen
      en met uitzondering van geverfde materialen.

      c. Klasse IV:

      Het lassen van geverfde materialen (met uitzondering van loodmenie) met behulp van één van de volgende technieken:

      − TIG-lassen (met uitzondering van aluminium), plasmalassen, druklassen, autogeenlassen, onder poeder lassen;

      − Lassen met beklede elektroden, MAG-lassen met gevulde draad en MIG/MAG-lassen met massieve draad.

      d. Klasse V, VI en VII:

      − Lassen met beklede elektroden, van de materialen: roestvast staal, vanadiumle geringen en berylliumlegeringen;

      − MAG-lassen met gevulde draad van de materialen: roestvast staal;

      − Lassen met gelegeerde elektrode of met gelegeerde gevulde draad;

      − MIG-lassen met gevulde draad of massieve draad van de materialen: koperlegeringen en beryllium- en
      vanadiumlegeringen;

      − Lassen met gevulde draad van de materialen: ongelegeerd en gelegeerd staal;

      − Lassen van de materialen: geverfd staal met loodmenie.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.40
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.54a
