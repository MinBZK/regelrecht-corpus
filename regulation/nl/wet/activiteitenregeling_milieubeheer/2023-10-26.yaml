  - number: '4.65'
    text: |-
      Aan [artikel 4.54, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen emissies die vrijkomen bij het coaten en lijmen van metalen voorwerpen door middel van
      vernevelen met een nevelspuit en de emissies die vrijkomen bij het coaten door middel van het opbrengen
      van poeder, worden afgezogen en worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.54, eerste lid, van het besluit][ref2] te voldoen; en

      b. die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.54
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.54
