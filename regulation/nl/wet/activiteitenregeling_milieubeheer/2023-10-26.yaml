  - number: '5.12'
    text: |-
      1 De emissie in de lucht van de volgende stoffen wordt periodiek ten minste om de zes maanden gemeten:

      a. antimoon;

      b. arseen;

      c. cadmium;

      d. chroom;

      e. dioxinen en furanen

      f. kobalt;

      g. koper;

      h. kwik;

      i. lood;

      j. mangaan;

      k. nikkel;

      l. thallium;

      m. vanadium.

      2 In afwijking van het eerste lid, wordt gedurende de eerste twaalf maanden dat een afvalverbrandings- of
      afvalmeeverbrandingsinstallatie in werking is, de emissie van de stoffen, genoemd in het eerste lid, periodiek ten
      minste om de drie maanden gemeten.

      3 In afwijking van het eerste lid wordt het gehalte antimoon, arseen, cadmium, chroom, kobalt, koper, kwik, lood,
      mangaan, nikkel, thallium en vanadium periodiek eenmaal in de twee jaar gemeten en wordt het gehalte dioxinen en
      furanen eenmaal per jaar gemeten indien de drijver van de afvalverbrandings- of afvalmeeverbrandingsinstallatie:

      a. aantoont dat de emissies in de lucht onder alle omstandigheden minder dan 50% bedragen van de van toepassing
      zijnde emissiegrenswaarden, of

      b. aantoont dat het te verbranden of mee te verbranden afval uitsluitend bestaat uit bepaalde gesorteerde brandbare
      fracties ongevaarlijk afval dat niet recycleerbaar is en aan de hand van informatie over de kwaliteit van het
      betreffende afval en over monitoring van de emissies aantoont dat de emissies in de lucht van de in het eerste lid
      genoemde stoffen onder alle omstandigheden aanmerkelijk lager liggen dan de toepasselijke emissiegrenswaarden.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.12
  - number: '5.13'
    text: |-
      1 Tot de continue metingen, bedoeld in [artikel 5.11][ref1], behoort tevens de meting van:

      a. het zuurstofgehalte;

      b. de temperatuur van de verbrandingskamer;

      c. de druk;

      d. het waterdampgehalte van het afgas, tenzij het als monster gebruikte afgas wordt gedroogd alvorens de emissies
      in de lucht worden geanalyseerd;

      e. de temperatuur van het afgas.

      2 De temperatuur van de verbrandingskamer wordt dicht bij de binnenwand gemeten of op een ander door de drijver
      van de afvalverbrandings- of afvalmeeverbrandingsinstallatie aangetoond representatief punt. De overige parameters
      worden gemeten nabij de plaats waar de emissiemetingen worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.11
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.13
