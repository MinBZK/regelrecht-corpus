      1 Het opslaan van polyesterhars of PER in een stationaire bovengrondse opslagtank met de daarbij behorende
      leidingen en appendages voldoet aan de

      volgende onderdelen van PGS 31:

      a. paragrafen 2.2.1 t/m 2.2.3, 2.2.5, 2.2.6;

      b. de voorschriften 2.3.4, 6.2.2, 6.4.9, en

      c. paragrafen 3.1, 3.2.1, 3.2.2, 5.2, 5.3.2, 5.3.3, 5.4, 5.6, 5.7, 5.8, 6.2.2, 6.4.1, 6.5 en 6.8.

      2 In afwijking van het eerste lid zijn voorschrift 2.2.4 en paragraaf 6.4.1 van PGS 31 tot het moment van
      inwerkingtreding van het [Besluit activiteiten leefomgeving][ref1] niet van toepassing op een bovengrondse
      opslagtank met PER die is geïnstalleerd voor 1 juli 2020.

      3 In afwijking van het eerste lid is paragraaf 6.5 van PGS 31 tot het tijdstip van inwerkingtreding van het
      [Besluit activiteiten leefomgeving][ref2] niet van toepassing op een bovengrondse opslagtank met polyesterhars die
      is geïnstalleerd voor 1 juli 2020.


