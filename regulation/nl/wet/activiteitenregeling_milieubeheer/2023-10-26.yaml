        bwb_id: BWBR0022762
        artikel: 4.74j
  - number: 4.84i
    text: |-
      1 Ter uitvoering van [artikel 4.74o, eerste lid, van het besluit][ref1], past degene die de inrichting drijft bij
      het op bekisting aanbrengen van ontkistingsmiddelen:

      a. maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissies van vluchtige organische
      stoffen;

      b. oplosmiddelarme producten en efficiënte applicatiemethoden toe.

      2 Indien de emissiereducerende maatregelen, bedoeld in het eerste lid, niet of in onvoldoende mate zijn getroffen,
      kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de motivering
      wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74o
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84i
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 4.74o
  - number: 4.84j
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.74p van het besluit][ref1] vindt:

      a. het op bekisting aanbrengen van ontkistingsmiddelen,

      b. het uitwassen van beton,

      plaats boven een vloeistofdichte vloer of verharding of een lekbak.

      2 Het eerste lid, aanhef en onderdeel a, is niet van toepassing op een inrichting waarvoor tot 1 januari
      2013 een vergunning onherroepelijk van kracht was en in die vergunning andere bodembeschermende voorzieningen
      of bodembeschermende maatregelen zijn voorgeschreven waarmee bij het aanbrengen van ontkistingsmiddelen een
      verwaarloosbaar bodemrisico wordt gelopen.

      3 Ten aanzien van een inrichting als bedoeld in het tweede lid blijven, in afwijking van het eerste lid, aanhef en
      onderdeel a, de voorschriften van de vergunning ten behoeve van het realiseren van een verwaarloosbaar bodemrisico
      bij het op bekisting aanbrengen van ontkistingsmiddelen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74p
