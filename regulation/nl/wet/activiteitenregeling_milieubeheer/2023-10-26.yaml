  - number: '4.14'
    text: |-
      1 Het opslaan van halfzware olie, polyesterhars, stoffen van klasse 8 van het ADR verpakkingsgroep II en III
      zonder bijkomend gevaar, PER of stoffen van klasse 5.1 van het ADR in bovengrondse opslagtanks vindt plaats in
      bovengrondse opslagtanks, die met de daarbij behorende leidingen en appendages naar hun aard en functie geschikt
      zijn voor de opslag van de desbetreffende stoffen.

      2 De bovengrondse opslagtanks en de daarbij behorende leidingen en appendages verkeren in goede staat.

      3 Het opslaan van halfzware olie, polyesterhars, stoffen van klasse 8 van het ADR verpakkingsgroep II en III zonder
      bijkomend gevaar, PER of stoffen van klasse 5.1 van het ADR in bovengrondse opslagtanks vindt op de vloer plaats.

      4 Het derde lid is niet van toepassing op een bovengrondse opslagtank met halfzware olie, polyesterhars, stoffen
      van klasse 8 van het ADR verpakkingsgroep II en III zonder bijkomend gevaar, PER of stoffen van klasse 5.1 van het
      ADR indien plaatsing op de vloer als gevolg van de constructie van de bijbehorende procesinstallatie niet mogelijk
      is.

      5 Het derde lid is niet van toepassing op een bovengrondse opslagtank die is geïnstalleerd voor de datum waarop
      [paragraaf 4.1.3][ref1] op de inrichting van toepassing werd en die niet op de vloer staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk4
