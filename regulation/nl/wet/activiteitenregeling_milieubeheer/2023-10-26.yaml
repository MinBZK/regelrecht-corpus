  - number: '4.6'
    text: |-
      1 [Artikel 4.3, eerste lid][ref1], is niet van toepassing op de volgende stoffen van klasse 3 van het ADR:

      a. alcoholhoudende dranken in consumentenverpakking;

      b. dieselolie, gasolie of lichte stookolie met een vlampunt tussen 60 graden Celsius en 100 graden Celsius, of

      c. verwarmde brandbare vloeistoffen met UN-nummer 3256.

      2 De [artikelen 4.3, eerste lid][ref2], [4.4][ref3], [4.4a, eerste tot een met vijfde lid][ref4], [4.4b][ref5] en
      [4.4c][ref6] zijn niet van toepassing op gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking:

      a. die tijdelijk worden opgeslagen overeenkomstig [artikel 4.7][ref7];

      b. die als werkvoorraad aanwezig zijn;

      c. die in vervoerseenheden aanwezig zijn;

      d. die in een verkoopruimte aanwezig zijn;

      e. die via leidingen zijn aangesloten op een installatie;

      f. zijnde gasflessen van de klasse 2 van het ADR met een totale waterinhoud van maximaal 125 liter;

      g. zijnde gewasbeschermingsmiddelen en biociden van in totaal maximaal 400 kg of liter, of

      h. die aanwezig zijn in hoeveelheden kleiner dan de in tabel 4.6 weergegeven hoeveelheden. Indien sprake is van
      stoffen uit verschillende klassen in hoeveelheden die kleiner zijn dan de in tabel 4.6 opgenomen ondergrens, wordt
      naar rato berekend of de ondergrens wordt overschreden.


