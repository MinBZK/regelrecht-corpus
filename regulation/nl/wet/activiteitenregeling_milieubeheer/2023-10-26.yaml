      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico, bedoeld in
      [artikel 3.167, onderdeel e, van het besluit][ref1] vindt het coaten en uitslaan van planten of onderdelen van
      planten met open verfbaden plaats boven een vloeistofdichte vloer.


