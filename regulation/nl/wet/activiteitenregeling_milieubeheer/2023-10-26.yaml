  - number: 3.7b
    text: |-
      1 Indien de concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof of onverbrande koolwaterstoffen
      (CH, uitgedrukt in C) afzonderlijk worden gemeten, wordt zodra een emissiegrenswaarde van toepassing is geworden,
      binnen vier weken nadien een afzonderlijke meting verricht.

      2 Onverminderd het eerste lid kan de meting van het rookgas van een stookinstallatie worden verricht voorafgaand
      aan het van toepassing worden van een emissiegrenswaarde.

      3 Indien de concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof of onverbrande koolwaterstoffen
      (CH, uitgedrukt in C) bij een gasturbine, een gasmotor of een dieselmotor afzonderlijk worden gemeten, wordt in
      aanvulling op het eerste lid, om de vier jaar een nieuwe afzonderlijke meting verricht.

      4 Indien door het veranderen van brandstof andere emissiegrenswaarden van toepassing worden, wordt binnen vier
      weken nadien een nieuwe afzonderlijke meting verricht. Het derde lid is van overeenkomstige toepassing.

      5 In aanvulling op het eerste lid en in afwijking van het derde lid worden:

      a. jaarlijks afzonderlijke metingen verricht aan een stookinstallatie met een nominaal thermisch ingangsvermogen
      groter dan 20 MWth die op of na 20 december 2018 in bedrijf is genomen;

      b. iedere drie jaar afzonderlijke metingen verricht aan een stookinstallatie met een nominaal thermisch
      ingangsvermogen van 1 MWth of meer en 20 MWth of minder die op of na 20 december 2018 in bedrijf is genomen;

      c. vanaf 2025 en vervolgens jaarlijks afzonderlijke metingen verricht aan een stookinstallatie met een nominaal
      thermisch ingangsvermogen groter dan 20 MWth die voor 20 december 2018 in bedrijf is genomen;

      d. vanaf 2025 en vervolgens iedere drie jaar afzonderlijke metingen verricht aan een stookinstallatie met een
      nominaal thermisch ingangsvermogen van meer dan 5 MWth en 20 MWth of minder die voor 20 december 2018 in bedrijf
      is genomen;

      e. vanaf 2030 en vervolgens iedere drie jaar afzonderlijke metingen verricht aan een stookinstallatie met een
      nominaal thermisch ingangsvermogen van 1 MWth of meer en 5 MWth of minder die voor 20 december 2018 in bedrijf
      is genomen.

      6 Het vijfde lid is niet van toepassing op stookinstallaties gelegen op een offshore olie- of gaswinningsplatform.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7b
  - number: 3.7c
    text: |-
      1 Een afzonderlijke meting als bedoeld in [artikel 3.7b][ref1] bestaat uit drie deelmetingen van ten minste
      vijftien minuten en ten hoogste dertig minuten.

      2 Indien geen van de deelmetingen, bedoeld in het eerste lid, de desbetreffende emissiegrenswaarde overschrijdt,
      wordt aan die emissiegrenswaarde voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.7b
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7c
