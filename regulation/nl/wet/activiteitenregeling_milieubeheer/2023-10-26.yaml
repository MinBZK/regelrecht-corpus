  - number: 4.25a
    text: |-
      Indien in deze paragraaf wordt verwezen naar PGS 15 kan het bevoegd gezag bij maatwerkvoorschrift eisen stellen aan
      het opslaan van gevaarlijke stoffen als bedoeld in deze paragraaf, voor zover toepassing van PGS 15 redelijkerwijs
      niet mogelijk is en de bescherming van het milieu zich daar niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.25a
  - number: '4.26'
    text: |-
      1 Het gebruik van stoffen van ADR klasse 5.2 type D tot en met F voldoet aan de voorschriften 8.1.4, 8.1.16 tot en
      met 8.1.19 en 8.2.5 van PGS 8.

      2 Het gebruik van vloeibare stoffen van ADR klasse 5.2 type D tot en met F vindt plaats boven een vloeistofdichte
      vloer of verharding.

      3 Het gebruik van vast stoffen van ADR klasse 5.2 type D tot en met F vindt plaats boven een bodembeschermende
      voorziening.

      4 Indien de werkvoorraad bestaat uit meer dan 25 liter vloeibare en tevens brandbare stoffen van ADR klasse 5.2
      type D tot en met F, staat de werkvoorraad opgesteld boven een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.26
  - number: '4.27'
    text: |-
      1 De verpakking van stoffen van ADR klasse 5.2 is tegen normale behandeling bestand en is zodanig dat niets van de
      inhoud uit de verpakking onvoorzien kan ontsnappen.

      2 Het opslaan van stoffen van ADR klasse 5.2 type C tot en met F in verpakking vindt plaats boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.27
  - number: '4.34'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, voldoet de opslag van vaste kunstmeststoffen ten minste aan het tweede tot en met
      vijfde lid.

      2 Indien in een inrichting meer dan 250 ton vaste kunstmeststoffen behorende tot de meststoffengroep 1.1, 1.2 of
      1.3 als bedoeld in PGS 7 wordt opgeslagen, is de opslagvoorziening bestemd voor de opslag van deze kunstmeststoffen
      uitgevoerd overeenkomstig:

      1°. de voorschriften genoemd in paragraaf 4.2 met uitzondering van de voorschriften 4.2.13 en 4.2.17;

      2°. de voorschriften genoemd in de paragrafen 5.2 en 6.1;

      3°. de voorschriften in paragraaf 7.2.2 met uitzondering van voorschrift 7.2.9;

      4°. de voorschriften van de paragrafen 8.1 en 9.1 tot en met 9.3 van de PGS 7. De opslagvoorziening bestemd voor de
      opslag van vaste kunstmeststoffen behorende tot de meststoffengroep 1.2 of 1.3 voldoet tevens aan de voorschriften
      genoemd in de paragrafen 4.3 en 8.2 van PGS 7.

      3 De opslag van nitraathoudende kunstmeststoffen in de buitenlucht is niet ongecontroleerd toegankelijk voor
      onbevoegden.

      4 Aan het derde lid is voldaan indien nitraathoudende kunstmeststoffen in een afsluitbare ruimte zijn opgeslagen.
      Deze ruimte is bij afwezigheid van toezicht met slot of sleutel of op een andere vergelijkbare wijze afgesloten.

      5 Bij diefstal van nitraathoudende kunstmeststoffen doet de drijver van de inrichting zo spoedig mogelijk aangifte
      bij de politie.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.34
  - number: '4.38'
    text: |-
      1 Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, wordt stofklasse S dat
      vrijkomt bij mechanische bewerking van hout, kurk, dan wel van houten, kurken of houtachtige voorwerpen, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen emissies die
      vrijkomen bij mechanische bewerking van hout, kurk, dan wel van houten, kurken of houtachtige voorwerpen en
      die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een
      emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein, dan
      wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare.

      3 Het bevoegd gezag kan in het belang van de luchtkwaliteit en maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het tweede lid.

      4 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref1], is het
      tweede lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref2] nodig is en voor zover de emissies als bedoeld in het tweede lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      5 In afwijking van het vierde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het derde lid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
