  - number: '3.82'
    text: |-
      Als referentietechnieken als bedoeld in [artikel 3.78a, eerste lid, onderdeel a][ref1], en
      [artikel 3.80, eerste lid, onderdeel b, en derde lid, onderdeel b, onder 1°, van het besluit][ref2] worden
      aangewezen:

      a. voor bespuiting van veldgewassen: een traditionele veldspuit voorzien van neerwaarts spuitende doppen
      overeenkomstig de BCPC-klassegrens fijn/midden of gelijkwaardige doppen binnen hetzelfde druppelgroottespectrum,
      waarbij de spuitdoppen zich ten hoogste 50 centimeter boven het te bespuiten oppervlak bevinden, met een afstand
      tussen de spuitdoppen op de spuitboom van 50 centimeter, met een spuitdruk van 3 bar, bij een rijsnelheid van 6,5
      kilometer per uur en met een spuitvolume van 300 liter per hectare;

      b. voor bespuiting van fruitteeltgewassen: een Munckhof dwarsstroomspuit voorzien van zijwaarts spuitende Albuz ATR
      lila spuitdoppen, met een spuitdruk van 7 bar, met luchtondersteuning in lage stand in de kale boom situatie (c.q.
      bij meting tot 1 mei) en vollucht luchtondersteuning in de volblad situatie (c.q. bij meting vanaf 1 mei), bij een
      rijsnelheid van 6,7 kilometer per uur en met een spuitvolume van 200 liter per hectare;

      c. voor bespuiting van hoge laanbomen: een axiaalspuit voorzien van zij- en opwaarts spuitende TeeJet TXB8003
      werveldoppen, met een spuitdruk van 8 bar, met vollucht luchtondersteuning en met een spuitvolume tussen 400 en 450
      liter per hectare;

      d. voor neerwaartse onkruidbestrijding in de boomteelt en fruitteelt: een onkruidspuit met een spuitboom voorzien
      van neerwaarts spuitende TeeJet XR11004 spuitdoppen waarbij de spuitdoppen zich ten hoogste 30 centimeter
      boven de grond bevinden, met een spuitdruk van 2 bar, met een afstand tussen de spuitdoppen op de spuitboom van
      30 centimeter, bij een rijsnelheid van 5 kilometer per uur en met een spuitvolume van 450 liter per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.78a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.80
