  - number: 4.94a
    text: |-
      1 In afwijking van [artikel 4.94, eerste tot en met zesde lid][ref1], kan het afleveren van vloeibare brandstof,
      anders dan aan motorvoertuigen voor het wegverkeer en vaartuigen, plaatsvinden boven een geomembraanbaksysteem,
      indien:

      a. de inrichting is gelegen binnen de bebouwde kom waarbij de afleverzuilen in een rij parallel aan de naastgelegen
      weg staan opgesteld en het afleveren uitsluitend aan de wegzijde op of aan de openbare weg plaatsvindt, of

      b. op basis van een onderzoek naar de grondmechanica dat voor het aanbrengen van het geomembraanbaksysteem is
      uitgevoerd, is gebleken dat het aanbrengen van een vloeistofdichte vloer of verharding onevenredig hoge kosten met
      zich meebrengt.

      2 Een geomembraanbaksysteem als bedoeld in het eerste lid is aangelegd overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref2] aangewezen normdocument door een bedrijf, dat daartoe beschikt over een erkenning op
      grond van dat besluit.


