  - number: 4.49d
    text: |-
      1 Ten behoeve van het voorkomen of, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken van
      de geurhinder, bedoeld in [artikel 4.31c van het besluit][ref1], past degene die de inrichting drijft de volgende
      emissiereducerende maatregelen met betrekking tot styreen toe, tenzij deze niet kosteneffectief of niet technisch
      uitvoerbaar zijn:

      a. toepassen van harsen met additieven die verdamping van styreen bij het uitharden beperken;

      b. toepassen van harsen met een verlaagd styreengehalte;

      c. toepassen van harsen waarin styreen deels is vervangen door dicyclopentadieen;

      d. spuittechnieken zonder persluchtondersteuning;

      e. toepassen van een lagedruk polyesterharsopbrengsysteem;

      f. overschakelen op een gesloten malsysteem;

      g. overschakelen op een vacuümfoliesysteem;

      h. afdekken van emmers en vaten;

      i. toepassen van gesloten leidingssystemen voor oplosmiddelen en hars; en

      j. toepassen van een nageschakelde techniek zoals cryocondensatie, thermische of katalytische naverbranding, een
      bioreactor of een zuurstofradicaalgenerator.

      2 Het eerste lid is niet van toepassing indien degene die de inrichting drijft aantoont dat de geurhinder beperkt
      blijft tot een aanvaardbaar niveau of dat het mogelijke effect van de styreenemissie beperkt blijft tot een
      gezoneerd industrieterrein of een bedrijventerrein met minder dan één geurgevoelig object per hectare.

      3 Het bevoegd gezag kan, indien blijkt dat bij het verwerken van polyesterhars ondanks de maatregelen,
      bedoeld in het eerste lid, de geurhinder een aanvaardbaar niveau overschrijdt overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref2] maatwerkvoorschriften stellen met betrekking tot:

      a. het niet in de buitenlucht verwerken van polyesterhars,

      b. de situering van de afvoerpijp,

      c. het voorkomen of beperken van diffuse emissies, of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      4 Het bevoegd gezag kan, indien blijkt dat bij het verwerken van polyesterhars ondanks de maatregelen bedoeld
      in het eerste lid, de geurhinder een aanvaardbaar niveau overschrijdt en de uitoefening van bevoegdheden,
      bedoeld in het derde lid, onvoldoende effect hebben om de overschrijding ongedaan te maken, overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref3] maatwerkvoorschriften stellen met betrekking tot de aanwezigheid
      van een ontgeuringsinstallatie of een grotere afvoerhoogte van de bij het verwerken van polyesterhars vrijkomende
      gassen en dampen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.31c
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
