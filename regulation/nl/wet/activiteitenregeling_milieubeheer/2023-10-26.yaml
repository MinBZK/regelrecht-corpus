  - number: '3.118'
    text: |-
      1 Het rapport van een akoestisch onderzoek, bedoeld in [artikel 1.11, derde lid, onderdeel g, van het besluit][ref1]
      voldoet aan [bijlage 9][ref2] en bevat de volgende gegevens:

      a. de naam van de opdrachtgever van het onderzoek;

      b. de naam van de instantie die het onderzoek heeft uitgevoerd;

      c. de datum van het onderzoek;

      d. de aanleiding en het doel van het onderzoek;

      e. de gegevens waarmee wordt aangetoond dat de betreffende situatie valt binnen het toepassingsbereik van de
      gebruikte methode;

      1°. een gedetailleerde beschrijving (naam, type, fabricaat) van de gemeten representatieve wapens en de gebruikte
      munitie (merk en type);

      2°. het totale aantal schoten van de representatieve gebruiksituatie voor de relevante wapencategorieën voor de
      relevante beoordelingsperioden;

      3°. een plattegrond van de akoestisch relevante dimensies en de aard van de doorgerekende geluidsbeperkende of
      afschermende maatregelen;

      4°. de meetwaarden voor LA en LA alsmede de energetische gemiddelde waarden;

      5°. het gemeten achtergrondgeluidniveau per meetlocatie en de beschrijving van de aard van de stoorgeluiden;

      6°. de weersomstandigheden indien metingen buiten zijn uitgevoerd;

      f. indien een andere methode dan die is opgenomen in bijlage 9 wordt gebruikt, wordt de noodzaak daarvan aangegeven
      en wordt de toegepaste methode beschreven en verantwoord;

      g. indien een rekenmethode wordt toegepast, alle ingevoerde gegevens en tevens de geraadpleegde
      windfrequentiegegevens;

      h. een of meer kaarten of tekeningen op een zodanige schaal dat een duidelijk beeld wordt gegeven van bestaande
      of voorgenomen buitenschietbanen en van gevoelige gebouwen of gevoelige terreinen waarop het akoestisch onderzoek
      betrekking heeft;

      i. de waarneempunten;

      j. de situering, akoestisch relevante dimensies en de aard van de doorgerekende geluidsbeperkende of afschermende
      maatregelen, zowel op het oorspronkelijke kaartmateriaal als in de vorm van de geschematiseerde computerinvoer;

      k. de situering, akoestisch relevante dimensies en de aard van de overige geluidsreflecterende en -afschermende
      objecten of constructies;

      l. de scheidingslijn of scheidingslijnen tussen akoestisch harde en zachte bodemvlakken, met een aanduiding van de
      aard van de bodem;

      m. in akoestisch gecompliceerde situaties, een grafische weergave van de bij de berekeningen gehanteerde
      geometrische invoergegevens;

      n. de geluidsbelasting van een buitenschietbaan op de gevel van een gevoelig object of van de grens van een
      gevoelig terrein uitgedrukt in B.

      2 In afwijking van het eerste lid, onderdeel e, onder 1°, kan voor militair gebruik worden volstaan met een
      beschrijving van het aantal wapens per representatieve categorie.

      3 Ten behoeve van het akoestisch onderzoek, bedoeld in [artikel 1.11, derde lid, van het besluit][ref3], wordt bij
      de bepaling van de geluidsbelasting van een buitenschietbaan rekening gehouden met:

      a. de over een kalenderjaar energetisch gemiddelde bronsterkten volgens de methode, bedoeld in
      [paragraaf 4.5 van bijlage 9][ref4], en met gebruikmaking van de gegevens uit het register, bedoeld in het achtste
      lid, en de op grond van bijlage 9 aangeleverde langjarig gemiddelde windprofielen, tenzij wordt aangetoond dat
      gegevens beschikbaar zijn die een gelijkwaardig of beter beeld geven van de geluidsemissie van de buitenschietbaan;

      b. de invloed van de omgeving en de meteorologische omstandigheden op de geluidsoverdracht van de buitenschietbaan
      naar het immissiepunt.

      4 Indien de vaststelling van de geluidsbelasting vanwege een buitenschietbaan plaatsvindt op de gevel van een
      gevoelig gebouw, bevindt het immissiepunt zich op het punt van de gevel, waar de geluidsbelasting het hoogst is.

      5 Indien de vaststelling van de geluidsbelasting vanwege een buitenschietbaan plaatsvindt op de grens van een
      gevoelig terrein, bevindt het immissiepunt zich op het punt van de grens waar de geluidsbelasting het hoogst is.

      6 Van de methode, bedoeld in [hoofdstuk 4 van bijlage 9][ref5], kan geheel of gedeeltelijk worden afgeweken indien
      aannemelijk wordt gemaakt dat de toe te passen afwijking:

      a. een belangrijke tijdbesparing of kostenbesparing oplevert en in de betreffende situatie nagenoeg even nauwkeurig
      is;

      b. in de betreffende situatie belangrijk nauwkeuriger is, of

      c. voldoende nauwkeurig is en de methode, bedoeld in [hoofdstuk 4 van bijlage 9][ref6], in de betreffende situatie
      niet leidt tot een voldoende representatieve geluidsbelasting.

      7 Indien de gegevens over het bronvermogen van een wapen- of munitiecombinatie niet of niet volledig beschikbaar
      zijn, wordt dit bepaald volgens de methode, bedoeld in [paragraaf 4.4 van bijlage 9][ref7]. Indien in het kader
      van de handhaving wordt beoordeeld of het bronvermogen overeenkomt met de in het akoestisch onderzoek gebruikte
      waarden, wordt de methode, bedoeld in paragraaf 4.5 van bijlage 9, toegepast.

      8 De Minister van Infrastructuur en Milieu draagt zorg voor het in stand houden van een register van brongegevens
      van wapen- en munitiecombinaties als bedoeld in [paragraaf 4.4 van bijlage 9][ref8]. Het bevoegd gezag heeft op
      aanvraag inzage in dit register.


