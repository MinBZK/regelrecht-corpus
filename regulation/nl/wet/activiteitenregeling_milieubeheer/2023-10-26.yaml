  - number: '2.14'
    text: |-
      Degene die een oplosmiddeleninstallatie drijft, voert een oplosmiddelenboekhouding waarmee:

      a. wordt aangetoond dat is voldaan aan:

      1°. de emissiegrenswaarden, diffuse-emissiegrenswaarden of de totale emissiegrenswaarden, bedoeld in de
      [artikelen 2.29, eerste, vierde en vijfde lid][ref1], en [2.30, tweede en derde lid, van het besluit][ref2], en

      2°. indien van toepassing, de eisen van het reductieprogramma, bedoeld in
      [artikel 2.29, tweede lid, van het besluit][ref3];

      b. de mogelijkheden voor emissiebeperking in de toekomst worden gespecificeerd, en

      c. informatie aan eenieder kan worden verstrekt over het verbruik en de emissie van oplosmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.29
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.30
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel2.29
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2.29'
