        artikel: 2.7a
  - number: '4.88'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat
      niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het afleveren van vloeibare brandstof en gecomprimeerd aardgas,
      anders dan aan motorvoertuigen voor het wegverkeer, spoorvoertuigen en vaartuigen, ten minste voldaan aan de
      [artikelen 4.91 tot en met 4.93a][ref1].

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico wordt bij het afleveren van vloeibare
      brandstof, anders dan aan motorvoertuigen voor het wegverkeer, spoorvoertuigen en vaartuigen, voldaan aan de
      [artikelen 4.91][ref2], [4.92][ref3], [4.92a][ref4], [4.94][ref5] en [4.94a][ref6].

      3 Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      luchtverontreiniging wordt bij het afleveren van lichte olie voldaan aan [artikel 4.89][ref7].


