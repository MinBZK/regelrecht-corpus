  - number: '5.20'
    text: |-
      1 Het uitvoeren van periodieke metingen en parallelmetingen geschiedt door een rechtspersoon die voor deze
      verrichtingen geaccrediteerd is door een accreditatie-instantie.

      2 Het bevoegd gezag wordt ten minste twee weken van tevoren op de hoogte gesteld van de datum en het tijdstip
      waarop een periodieke meting of een parallelmeting zal worden uitgevoerd.

      3 Indien een afzonderlijke meting of parallelmeting geen doorgang vindt, wordt het bevoegd gezag uiterlijk op de
      datum waarop de meting zou plaatsvinden, bedoeld in het tweede lid, hiervan op de hoogte gesteld.

      4 Een periodieke meting van zoutzuur, waterstoffluoride, zwaveldioxide (SO) of stikstofoxiden (NO) bestaat uit een
      serie van ten minste drie deelmetingen.

      5 De duur van een deelmeting bedraagt een half uur. Wanneer het meettechnisch niet mogelijk is de deelmeting in die
      tijd uit te voeren, mag de deelmeting ten hoogste twee uur bedragen.

      6 Periodieke metingen van kwik, de som van cadmium en thallium en de som van antimoon, arseen, chroom, kobalt,
      lood, mangaan, nikkel en vanadium bestaan uit één deelmeting over een bemonsteringsperiode van ten minste een half
      uur en ten hoogste 8 uur hoger.

      7 Een periodieke meting van dioxinen en furanen bestaat uit één deelmeting over een bemonsteringsperiode van ten
      minste 6 uur en ten hoogste 8 uur.

      8 De duur van een parallelmeting die wordt uitgevoerd ten behoeve van de verificatie van de meetapparatuur voor
      continue metingen, bedraagt ten minste een half uur.

      9 Bij periodieke metingen kan een door een rechtspersoon als bedoeld in het eerste lid aangetoonde
      95%-betrouwbaarheidsinterval op dezelfde wijze als [artikel 5.19, derde en vierde lid][ref1], worden
      verdisconteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.19
