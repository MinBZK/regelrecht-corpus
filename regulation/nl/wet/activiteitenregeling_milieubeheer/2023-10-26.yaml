      3 Bij de ondergrondse opslagtank, bedoeld in het eerste lid, vindt jaarlijks een controle plaats van:

      a. de lekdetectie van een dubbelwandige opslagtank en de dubbelwandige leidingen, en

      b. de aarding en de potentiaalvereffening van de vul- en dampretourleiding indien in de ondergrondse opslagtank
      vloeistoffen van PGS-klasse 1 en 2 zijn opgeslagen.

      4 Een ondergrondse opslagtank wordt bij herkeuring inwendig gereinigd en beoordeeld door middel van betreding van
      de tank. Inwendige inspectie met behulp van een camera is toegestaan bij een volledig inwendig gecoate tank, indien
      deze inspectie wordt uitgevoerd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref3] aangewezen
      normdocument. Indien bij herkeuring een ondergrondse opslagtank niet kan worden betreden of, indien toegestaan,
      middels een camera-inspectie inwendig geïnspecteerd kan worden, wordt de opslagtank afgekeurd. Het gebruik van de
      opslagtank is in geval van afkeuring toegestaan tot de uiterste herkeuringsdatum.

      5 In afwijking van het tweede lid wordt een ondergrondse opslagtank eenmaal per tien jaar herkeurd indien de
      ondergrondse opslagtank is gelegen in een grondwaterbeschermingsgebied.

      6 In afwijking van het tweede lid wordt een ondergrondse opslagtank met de daarbij behorende leidingen waarin
      afgewerkte olie is opgeslagen ten minste eenmaal per vijf jaar beoordeeld en gekeurd. De tank wordt daarbij ook
      inwendig beoordeeld.

      7 Een ondergrondse opslagtank waarvan het vermoeden bestaat dat deze lek is of in een slechte toestand verkeert,
      wordt terstond op dichtheid gecontroleerd.

      8 Een ondergrondse opslagtank waarin afgewerkte olie wordt opgeslagen, wordt ten minste eenmaal per jaar geleegd.

      9 Indien een beoordeling, controle, keuring of herkeuring als bedoeld in het eerste tot en met het zevende lid
      of als bedoeld in [artikel 3.36, zesde lid][ref4], leidt tot afkeuring van de ondergrondse opslagtank, wordt dit
      terstond gemeld aan het bevoegd gezag. Na de afkeuring wordt binnen acht weken het opslaan van vloeistoffen in de
      ondergrondse opslagtank beëindigd en wordt de vloeistof die zich in de opslagtank bevindt, verwijderd.

      10 In afwijking van het vierde en zesde lid en [artikel 3.36, zesde lid][ref5], is een inwendige beoordeling of
      inwendige inspectie bij de keuring van een ondergrondse opslagtank en van de leidingen niet noodzakelijk indien
      deze opslagtank of deze leidingen dubbelwandig zijn uitgevoerd met een lekdetectiesysteem in de wand.

      11 Een elektronisch lekdetectiesysteem voldoet aan de voorschriften 2.2.5 tot en met 2.2.7 van PGS 28.

      12 Het elfde lid is niet van toepassing op een ondergrondse opslagtank waarin een organisch oplosmiddel als bedoeld
      in [artikel 3.29, eerste lid, onderdelen c tot en met i][ref6], van het besluit is opgeslagen.


