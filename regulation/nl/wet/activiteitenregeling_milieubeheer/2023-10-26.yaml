      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden activiteiten in een laboratorium
      waarbij vloeibare bodembedreigende stoffen worden gebruikt of kunnen vrijkomen, plaats boven een bodembeschermende
      voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.121
