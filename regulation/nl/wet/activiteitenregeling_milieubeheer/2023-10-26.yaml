  - number: 3.7n
    text: |-
      1 De drijver van inrichting onderhoudt de ter controle van de emissiegrenswaarden geïnstalleerde apparatuur zodanig
      dat de goede werking van de apparatuur is gewaarborgd.

      2 Indien zich een storing voordoet in de apparatuur, bedoeld in het eerste lid:

      a. neemt de drijver van de inrichting onverwijld de nodige maatregelen tot opheffing van die storing, en

      b. brengt hij geen wijzigingen aan in het gebruik van de stookinstallatie, die een substantiële stijging van de
      uitworp van de te meten stof met zich kan brengen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.7n
  - number: 3.7o
    text: |-
      1 Voor het bepalen of wordt voldaan aan het urencriterium, genoemd in
      [artikel 3.7, tweede lid, onderdeel b, van het besluit][ref1], registreert degene die de inrichting drijft
      maandelijks het aantal draaiuren van de stookinstallatie.

      2 In afwijking van het eerste lid vindt registratie van het aantal draaiuren van een stookinstallatie gelegen op
      een offshore olie- of gaswinningsplatform minimaal halfjaarlijks plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.7
