    text: |-
      1 Een drukregistratievoorziening als bedoeld in [artikel 3.83, tweede en derde lid, van het besluit][ref1] voldoet
      aan het tweede tot en met achtste lid.

      2 Een drukregistratievoorziening bevat een druksensor waarvan de afwijking van de nauwkeurigheid ten hoogste 0,1
      bar bedraagt, bij een drukbereik van 0 tot 10 bar.

      3 Gedurende een tijdsduur van tenminste het laatste uur van een bespuiting vindt een actuele drukregistratie in de
      tijd plaats, met ten minste een waarneming per tien seconden.

      4 De drukregistratievoorziening treedt automatisch in werking bij het starten van de bespuiting en kan niet
      handmatig worden uitgezet.

      5 Registratie van de spuitdruk vindt alleen plaats op het moment van spuiten.

      6 De geregistreerde gegevens worden ten minste gedurende een uur bewaard.

      7 De drukregistratievoorziening geeft aan of de voorziening in werking is.

      8 De gegevens, bedoeld in het zesde lid, kunnen in het veld worden afgelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.83
