  - number: '3.41'
    text: |-
      1 Aan [artikel 3.32, aanhef en onder c, van het besluit][ref1] wordt bij het laden en lossen van schepen met inerte
      goederen voldaan indien:

      a. bij het laden en lossen van inerte goederen de afstand tussen wal en schip zo klein mogelijk is, en in ieder
      geval niet groter is dan 5 meter, of

      b. het schip, waarin of waaruit wordt overgeslagen, met de wal wordt verbonden door een ponton of een morsklep.

      2 Aan [artikel 3.32, aanhef en onder c, van het besluit][ref2] wordt bij het laden en lossen van schepen met andere
      goederen dan inerte goederen voldaan indien:

      a. bij het laden en lossen van gevaarlijke stoffen, CMR-stoffen en goederen waaruit vloeibare bodembedreigende
      stoffen kunnen lekken de afstand tussen wal en schip zo klein mogelijk is, en in ieder geval niet groter is dan
      1 meter,

      b. bij het laden en lossen van andere goederen dan inerte goederen, en dan de goederen, bedoeld onder a, de afstand
      tussen wal en schip zo klein mogelijk is, en in ieder geval niet groter is dan 2 meter, of

      c. het schip, waar in of uit wordt overgeslagen, met de wal wordt verbonden door een ponton of een morsklep.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.32
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.32
