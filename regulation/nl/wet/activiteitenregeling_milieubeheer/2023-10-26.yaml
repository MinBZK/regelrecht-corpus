  - number: '3.69'
    text: |-
      1 Een mestbassin en een afdekking worden overeenkomstig het daartoe in de [Regeling bodemkwaliteit][ref1]
      aangewezen normdocument beoordeeld en goedgekeurd door een persoon of instelling, die daartoe beschikt over een
      erkenning op grond van het [Besluit bodemkwaliteit][ref2].

      2 De beoordeling, bedoeld in het eerste lid, vindt plaats ten minste vier weken voor het aflopen van de
      referentieperiode mestbassins.

      3 Bij goedkeuring van een mestbassin en een afdekking wordt door de persoon of instelling, bedoeld in het eerste
      lid, een nieuwe referentieperiode mestbassins vastgesteld.

      4 Indien de goedkeuring, bedoeld in het derde lid, onder voorwaarden wordt gegeven, wordt binnen een termijn,
      gesteld door een persoon of instelling als bedoeld in het eerste lid, aan die voorwaarden voldaan.

      5 Indien de beoordeling, bedoeld in het eerste lid, leidt tot afkeuring en het mestbassin of de afdekking reparatie
      behoeft, draagt degene die de inrichting drijft zorg voor reparatie en wordt het mestbassin of de afdekking
      binnen een termijn, gesteld door een persoon of instelling als bedoeld in het eerste lid opnieuw ter beoordeling
      aangeboden.

      6 Indien reparatie als bedoeld in het vijfde lid niet plaatsvindt of een mestbassin of afdekking wordt afgekeurd en
      reparatie niet mogelijk is, wordt:

      a. van de afkeuring terstond melding gemaakt bij het bevoegd gezag;

      b. de drijfmest of het digestaat dat zich in het mestbassin bevindt onmiddellijk verwijderd, en

      c. het opslaan van drijfmest of digestaat in het mestbassin beëindigd.

      7 Het rapport van goedkeuring waarin een nieuwe referentieperiode mestbassins als bedoeld in het derde lid is
      opgenomen, is binnen de inrichting aanwezig.

      8 Het eerste tot en met zevende lid is niet van toepassing op een ondergronds mestbassin voorzien van een afdekking
      die als vloer kan fungeren.

      9 In afwijking van het eerste lid wordt een mestbassin, met uitzondering van een ondergronds mestbassin
      voorzien van een afdekking die als vloer kan fungeren, dat is opgericht voor 1 januari 2013 en waarvoor geen
      kwaliteitsverklaring mestbassin is afgegeven, gekeurd overeenkomstig het eerste tot en met het zevende lid, met
      dien verstande dat de keuring, gerekend vanaf het moment van aanleg van het mestbassin, plaatsvindt ten minste vier
      weken voor het aflopen van de volgende referentieperiode mestbassins:

      a. 20 jaar voor een houten, betonnen of gemetseld mestbassin en betonnen afdekking;

      b. 10 jaar voor een metalen mestbassin en afdekking;

      c. 5 jaar voor een mestzak of een foliebassin;

      d. 5 jaar voor de taludbescherming van een foliebassin, of

      e. 10 jaar voor overige typen mestbassins en afdekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0022929
