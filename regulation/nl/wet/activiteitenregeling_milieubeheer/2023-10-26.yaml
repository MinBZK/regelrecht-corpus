  - number: 3.27j
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies als bedoeld in het
      [artikel 3.26b, tweede lid, van het besluit][ref1], worden stof en gassen die vrijkomen bij het ontsteken van
      airbags of gordelspanners voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht als bedoeld in het
      [artikel 3.26b, tweede lid, van het besluit][ref2], worden stof en gassen, ontstaan bij het ontsteken van airbags
      of gordelspanners, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen
      50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.

      3 Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.

      4 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref3], is het
      eerste lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref4] nodig is en voor zover de emissies als bedoeld in het eerste lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      5 In afwijking van het vierde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het derde lid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26b
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.26b
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
