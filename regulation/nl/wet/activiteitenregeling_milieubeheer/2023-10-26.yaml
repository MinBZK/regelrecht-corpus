  - number: 3.71j
    text: |-
      1 Ten behoeve van het voorkomen van risico's voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico's voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in artikel 3.54g van het besluit worden stoffen van ADR-klasse 1.3, in
      een hoeveelheid van ten hoogste 50 kilogram, en stoffen van ADR-klasse 1.4, 1.5 of 1.6 bij een inrichting die in
      gebruik is bij de Nederlandse of een bondgenootschappelijke krijgsmacht opgeslagen:

      a. overeenkomstig de bepalingen 9201 tot en met 9208 en 11301 tot en met 11303 van de MP 40-21, of

      b. overeenkomstig [artikel 3.71i, onder a][ref1].

      2 In afwijking van het eerste lid wordt bij een inrichting die in gebruik is bij de Nederlandse of een
      bondgenootschappelijke krijgsmacht:

      a. tot maximaal 25 kilogram vuurwerk en in beslag genomen vuurwerk met aan consumentenvuurwerk vergelijkbare
      eigenschappen opgeslagen in ten minste een brandveiligheidsopslagkast als bedoeld in de voorschriften 3.3.1 tot en
      met 3.3.3 van PGS 15 met een brandwerendheid van ten minste 60 minuten;

      b. tot maximaal 50 kilogram noodsignalen van de ADR klasse 1.3, opgeslagen in een brandcompartiment dan wel
      in een brandveiligheidsopslagkast als bedoeld in de voorschriften 3.3.1 tot en met 3.3.3 van PGS 15 met een
      brandwerendheid van ten minste 60 minuten.

      3 In afwijking van het tweede lid kan het bevoegd gezag bij maatwerkvoorschrift het voorschrift 3.3.3 van PGS
      15 niet van toepassing verklaren, mits aanvullende eisen worden gesteld aan de brandwerende voorzieningen of
      branddetectie of aan de aanwezigheid van deskundig personeel binnen de inrichting als bedoeld in voorschrift 3.14.1
      van de PGS 15.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.71i
