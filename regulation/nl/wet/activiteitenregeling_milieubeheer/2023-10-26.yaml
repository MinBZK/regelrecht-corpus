      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.98 van het besluit][ref1] wordt bij het toepassen van gewasbeschermingsmiddelen of biociden in
      dompelbaden en douche-installaties ten minste voldaan aan het tweede tot en met zesde lid.

      2 Een dompelbad of een douche-installatie waarin wordt gewerkt met gewasbeschermingsmiddelen of biociden is
      opgesteld boven een lekbak of een vloeistofdichte vloer of verharding.

      3 Gedompelde producten en de tijdens het dompelen gebruikte emballage waar nog gewasbeschermingsmiddelen of
      biociden uit kunnen lekken, worden boven het dompelbad, een vloeistofdichte vloer of verharding of een lekbak
      bewaard.

      4 Gedouchte producten en de tijdens het douchen gebruikte emballage waar nog gewasbeschermingsmiddelen of biociden
      uit kunnen lekken, worden in de douche-installatie, boven een vloeistofdichte vloer of verharding of een lekbak
      bewaard.

      5 Een buitenopslag voor gedompelde of gedouchte producten of voor tijdens het dompelen gebruikte emballage is tegen
      inregenen beschermd.

      6 Het bevoegd gezag kan, indien het belang van de bescherming van de bodem daartoe noodzaakt, bij
      maatwerkvoorschrift eisen stellen aan de locatie en de opstelling van het dompelbad of de douche-installatie, de
      gedompelde of gedouchte producten en de emballage, bedoeld in het tweede tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.98
