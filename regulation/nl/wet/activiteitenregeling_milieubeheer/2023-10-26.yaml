  - number: 2.16e
    text: |-
      1 De rapportage bedoeld in [artikel 2.15, tiende lid, van het besluit][ref1] bevat in ieder geval:

      a. een aanduiding, het nummer waaronder de onderneming geregistreerd is bij de Kamer van Koophandel en het adres
      van de inrichting waar de rapportage betrekking op heeft;

      b. de onderneming waar de inrichting onderdeel van uitmaakt;

      c. de contactgegevens van degene die de inrichting drijft en degene die de rapportage voor de inrichting indient;

      d. een beschrijving van de locatie en activiteit;

      e. het energiegebruik van de inrichting:

      1°. inclusief energie die door de inrichting zelf wordt geproduceerd en gebruikt;

      2°. gemeten over een heel kalenderjaar;

      3°. aan de hand van recente gegevens;

      4°. in kilowattuur (kWh) elektriciteit en kubieke meter (m3) aardgasequivalent;

      f. een overzicht van de maatregelen ter verduurzaming van het energiegebruik, bedoeld in
      [artikel 2.15, eerste lid, van het besluit][ref2] die zijn getroffen;

      g. een overzicht van de maatregelen ter verduurzaming van het energiegebruik, bedoeld in
      [artikel 2.15, eerste lid, van het besluit][ref3] die nog niet zijn getroffen en het moment waarop de maatregelen
      naar verwachting zullen worden getroffen;

      h. een onderbouwing van het onderzoek naar de maatregelen ter verduurzaming van het energiegebruik, bedoeld in
      [artikel 2.15, eerste lid][ref4], waaronder in ieder geval:

      1°. een analyse van het energiegebruik;

      2°. een analyse van de productieapparatuur en installaties; en

      3°. een beschrijving van de structurele energiezorg.

      2 Het onderzoek is in overeenstemming met [bijlage 10b][ref5] uitgevoerd.

      3 Aan het eerste lid kan, voor de onderdelen waarvoor dat in [bijlage 10b][ref6] is aangegeven, invulling worden
      gegeven door het toepassen van:

      a. een energiebeheersysteem dat voldoet aan NEN-EN-ISO 50001;

      b. een milieubeheersysteem dat voldoet aan NEN-EN-ISO 14001 in combinatie met NEN-EN-ISO 14051.

      4 In aanvulling op het derde lid kan aan het eerste lid, voor de onderdelen waarvoor dat in [bijlage 10b][ref7] is
      aangegeven, invulling worden gegeven door de in bijlage 10b opgenomen keurmerken.

      5 Als gebruik wordt gemaakt van de in het derde of vierde lid opgenomen mogelijkheid om invulling te geven aan
      het eerste lid, wordt van het van toepassing zijnde energiebeheer-, milieubeheersysteem of keurmerk, daarvan als
      onderdeel van de rapportage een afschrift overgelegd.


