  - number: '3.65'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en ten behoeve van het voorkomen van de
      verontreiniging van een oppervlaktewaterlichaam als bedoeld in [artikel 3.48 van het besluit][ref1] wordt bij het
      opslaan van agrarische bedrijfsstoffen voldaan aan het tweede tot en met negende lid.

      2 Indien agrarische bedrijfsstoffen langer dan twee weken maar korter dan een half jaar op een onverhard oppervlak
      op een locatie worden opgeslagen, vindt het opslaan in elk geval plaats:

      a. boven een absorberende laag met een dikte van ten minste 0,15 meter en een organische stofgehalte van ten minste
      25%, en

      b. zodanig dat contact met hemelwater wordt voorkomen.

      3 Indien na het opslaan, bedoeld in het tweede lid, de opgeslagen agrarische bedrijfsstoffen worden verwijderd,
      wordt de absorberende laag eveneens verwijderd.

      4 Indien agrarische bedrijfsstoffen anders dan pluimveemest gedurende een half jaar of langer worden opgeslagen,
      vindt het opslaan plaats op ten minste een vloeistofkerende voorziening. [Artikel 2.3][ref2] is daarbij niet van
      toepassing.

      5 Bij het opslaan van agrarische bedrijfsstoffen anders dan gedroogde pluimveemest op een vloeistofkerende
      of vloeistofdichte voorziening worden vloeistoffen opgevangen in een opslagvoorziening die wordt aangelegd
      overeenkomstig paragraaf 5.5 en de hoofdstukken 6 en 7 van BRL 2342 en is de vloeistofkerende of vloeistofdichte
      voorziening zodanig aangelegd dat de vloeistof naar deze opslagvoorziening stroomt.

      6 In afwijking van het tweede tot en met vijfde lid zijn een absorberende laag als bedoeld in het tweede lid, een
      vloeistofkerende voorziening als bedoeld in het vierde lid en een opslagvoorziening als bedoeld in het vijfde lid
      niet vereist voor het opslaan van kuilvoer, indien het gehalte aan droge stof ten minste 40% bedraagt en de opslag
      zodanig is afgedekt dat contact met regenwater niet plaatsvindt.

      7 Het tweede tot en met zesde lid zijn niet van toepassing op het opslaan van in folie verpakte veevoederbalen.

      8 Indien pluimveemest op een locatie gedurende een half jaar of langer wordt opgeslagen, vindt het opslaan plaats
      boven een vloeistofkerende voorziening in een afgesloten ruimte met voldoende ventilatie. [Artikel 2.3][ref3] is
      daarbij niet van toepassing.

      9 Het tweede en derde lid zijn niet van toepassing op pluimveemest die in een afgedekte container wordt opgeslagen.

      10 Het tweede, vierde en vijfde lid zijn tot 1 januari 2027 niet van toepassing op de opslag van kuilvoer indien
      een voorziening voor het opslaan van kuilvoer in gebruik was voor 1 januari 2013.

      11 [Artikel 2.11, eerste tot en met negende lid, van het besluit][ref4] is niet van toepassing op het opslaan van
      agrarische bedrijfsstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.48
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel2.3
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel2.11
