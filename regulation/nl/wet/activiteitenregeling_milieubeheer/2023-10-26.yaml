  - number: '4.60'
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies vindt het stralen van metalen
      plaats:

      a. in een daarvoor bestemde en ingerichte gesloten kast, cabine of ruimte; of

      b. indien het redelijkerwijs niet mogelijk is te stralen als bedoeld in het eerste lid, onderdeel a, in een
      gesloten ruimte met gesloten deuren en ramen, waarbij wordt voorkomen dat bij het openen van deuren en ramen stof
      naar de buitenlucht vrijkomt.

      2 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden bij het stralen van metalen
      de stofemissies, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50
      meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.

      3 Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, als bedoeld in het tweede lid.

      4 Indien vanwege de omvang van het te stralen object, bedoeld in [artikel 4.49, tweede lid, van het besluit][ref1],
      het stralen in de buitenlucht plaatsvindt, worden emissies van stof die vrijkomen bij het stralen van metalen in
      de buitenlucht, voorkomen, dan wel beperkt door het toepassen van doelmatige stofvrije of stofarme straalmethodes,
      tenzij dit redelijkerwijs niet mogelijk is.

      5 Indien het toepassen van een doelmatige stofvrije of stofarme straaltechniek als genoemd in het vierde
      lid redelijkerwijs niet mogelijk is, wordt de emissie van stof tijdens straalwerkzaamheden in de buitenlucht
      gereduceerd door het plaatsen van een doelmatige omkapping van geschikt materiaal.

      6 Ten aanzien van het zoveel mogelijk voorkomen, dan wel tot een aanvaardbaar niveau beperken van stofhinder bij
      het stralen van metalen in de buitenlucht kan het bevoegd gezag maatwerkvoorschriften stellen, ter uitwerking van
      het vierde en vijfde lid.

      7 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref2], is het
      tweede lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref3] nodig is en voor zover de emissies als bedoeld in het tweede lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      8 In afwijking van het zevende lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het derde lid
      stellen.


