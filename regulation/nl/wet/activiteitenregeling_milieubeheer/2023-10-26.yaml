        paragraaf: 5.6.1
        afdeling: '5.6'
  - number: '5.40'
    text: |-
      1 De buitenwand en het uitwendige dak van een bovengrondse tank worden geschilderd in een kleur waarvan de
      totale stralingshittereflectie ten minste 70 procent bedraagt. Het schilderen vindt plaats bij een periodieke
      onderhoudsbeurt van de tank.

      2 Het eerste lid is niet van toepassing op een tank die verbonden is met een dampterugwinningseenheid die voldoet
      aan [paragraaf 5.2.2 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Paragraaf5.2.2
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.40
    references:
      - id: ref1
        bwb_id: BWBR0022762
        paragraaf: 5.2.2
  - number: '5.41'
    text: |-
      1 Een tank met een uitwendig drijvend dak is voorzien van een primaire afdichting dat de ringvormige ruimte tussen
      de tankwand en de buitenste rand van het drijvende dak afdicht, met daarboven een secundaire afdichting.

      2 De afdichtingen, bedoeld in het eerste lid, zijn zodanig ontworpen dat in vergelijking met een soortgelijke tank
      met vast dak zonder dampbeheersingsvoorzieningen ten minste 95 procent van de damp wordt vastgehouden.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.41
  - number: '5.42'
    text: |-
      Een opslaginstallatie die vanaf 31 december 1995 in werking is gebracht of waarvoor vanaf 31 december 1995 een
      vergunning op grond van [artikel 8.1 van de Wet milieubeheer][ref1] dan wel een omgevingsvergunning op grond van
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] is verleend
      en die onderdeel is van een terminal waarvoor dampterugwinning in [paragraaf 5.2.2 van het besluit][ref3] is
      voorgeschreven, is:

      a. een tank met een vast dak die overeenkomstig de [paragraaf 5.2.2 van het besluit][ref4] met de
      dampterugwinningseenheid is verbonden, of

      b. een tank met een uitwending of inwendig drijvend dak dat is voorzien van een primaire en secundaire afdichting
      als bedoeld in [artikel 5.41][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Paragraaf5.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Paragraaf5.2.2
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel5.41
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.42
