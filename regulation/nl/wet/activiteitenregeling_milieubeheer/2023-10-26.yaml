      1 Aan [artikel 3.105, vierde lid, onderdeel b, van het besluit][ref1] wordt in ieder geval voldaan indien de
      zuiveringsvoorziening voldoet aan het tweede tot en met het vierde lid.

      2 De zuiveringsvoorziening bestaat uit:

      a. voorzuivering met een lamellenfilter, en

      b. nazuivering met een ozoninstallatie en actief koolfilter.

      3 Indien bij het sorteren gebruik wordt gemaakt van ten hoogste 8 kubieke meter water:

      a. heeft het lamellenfilter een inhoud van ten minste 1,5 kubieke meter en een capaciteit van ten minste 2 kubieke
      meter per uur;

      b. heeft de ozoninstallatie een capaciteit van ten minste 1 kubieke meter per uur, is de contacttijd in de
      ozoninstallatie ten minste 30 minuten en wordt ten minste 20 gram ozon per kubieke meter te behandelen afvalwater
      toegevoegd, en

      c. is de contacttijd in het actief koolfilter ten minste 20 minuten.

      4 Indien bij het sorteren gebruikt wordt gemaakt van meer dan 8 en ten hoogste 16 kubieke meter water:

      a. heeft het lamellenfilter een inhoud van ten minste 6 kubieke meter en een capaciteit van ten minste 4 kubieke
      meter per uur;

      b. heeft de ozoninstallatie een capaciteit van ten minste 3 kubieke meter per uur, is de contacttijd in de
      ozoninstallatie ten minste 30 minuten en wordt ten minste 20 gram ozon per kubieke meter te behandelen afvalwater
      toegevoegd, en

      c. is de contacttijd in het actief koolfilter ten minste 20 minuten.


