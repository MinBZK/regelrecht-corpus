  - number: 3.71c
    text: |-
      1 De opslag van gasolie in bovengrondse opslagtanks vindt plaats in bovengrondse opslagtanks, die met de daarbij
      behorende leidingen en appendages naar hun aard en functie geschikt zijn voor de opslag van de desbetreffende
      stoffen.

      2 De bovengrondse opslagtanks en de daarbij behorende leidingen en appendages verkeren in goede staat.

      3 De opslag van gasolie in bovengrondse opslagtanks vindt op de vloer plaats.

      4 Het derde lid is niet van toepassing op een bovengrondse opslagtank met gasolie indien plaatsing op de vloer als
      gevolg van de constructie van de bijbehorende procesinstallatie niet mogelijk is.

      5 Het derde lid is niet van toepassing op een bovengrondse opslagtank die niet op de vloer staat, en:

      a. waarop op 31 december 2012 [paragraaf 4.1.3.1][ref1] van toepassing was en die is geïnstalleerd voor de datum
      waarop paragraaf 4.1.3.1 op de opslagtank van toepassing werd, of

      b. waarop op 31 december 2012 [paragraaf 4.1.3.1][ref2] niet van toepassing was en die is geïnstalleerd voor de
      datum waarop [paragraaf 3.4.9][ref3] op de opslagtank van toepassing werd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk3
