        bwb_id: BWBR0022762
        artikel: '6.43'
  - number: '3.16'
    text: |-
      1 Bij het in werking hebben van een installatie voor het doorvoeren, bufferen of keren van rioolwater verkeert
      de installatie in goede staat van onderhoud en worden bij onderhoudswerkzaamheden zodanige maatregelen getroffen
      dat geurhinder bij gevoelige gebouwen zoveel mogelijk wordt voorkomen dan wel als dit niet mogelijk is tot een
      aanvaardbaar niveau wordt beperkt.

      2 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt maatwerkvoorschriften
      stellen waarin maatregelen bedoeld in het eerste lid worden geconcretiseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.16
  - number: 3.16a
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat
      niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan beschikt degene die een inrichting met een natte koeltoren drijft over een
      risicoanalyse waarin is beschreven welke risico’s de natte koeltoren met zich meebrengt voor de omgeving alsmede
      over een legionella-beheersplan waarin de maatregelen zijn beschreven waarmee deze risico’s worden voorkomen, dan
      wel zoveel mogelijk worden beperkt. De drijver van de inrichting draagt er zorg voor dat het legionella-beheersplan
      wordt uitgevoerd.

      2 Bij de risicoanalyse, bedoeld in het eerste lid, worden in ieder geval de volgende risicofactoren betrokken:

      a. het risico op vermeerdering van legionellabacteriën in de koeltoren door:

      1°. de aard en kwaliteit van het water dat wordt gebruikt;

      2°. de temperatuur van het water;

      3°. de verblijfstijd van het water;

      4°. de stilstand van het water;

      5°. de aanwezigheid van biofilm en sediment;

      b. de bedrijfsvoering van de natte koeltoren;

      c. de effectiviteit van het waterbehandelingsprogramma met betrekking tot legionellabacteriën en biofilmvorming;

      d. de risico’s voor de omgeving, te bepalen volgens de risicocategorie-indeling in tabel 3.16a.


                Tabel 3.16a. Risicocategorie-indeling voor natte koeltorens






                        Risico categorie


                        Locatie natte koeltoren






                        1 (hoogste risico)


                        Natte koeltoren in de nabijheid (< 200 m) van een ziekenhuis, verpleeghuis of andere (medisch
      georiënteerde) zorginstelling waar mensen verblijven met een verminderd immuunsysteem




                        2


                        Natte koeltoren in de nabijheid (< 200 m) van verzorgingstehuizen, hotels of andere gebouwen
      waarin zich veel mensen bevinden




                        3


                        Natte koeltoren in de nabijheid (< 600 m) van een woonomgeving




                        4 (laagste risico)


                        Natte koeltoren die op afstand (> 600 m) staat van een woonomgeving






      3 Het legionella-beheersplan, bedoeld in het eerste lid, bevat naast een beschrijving van de maatregelen, bedoeld
      in dat lid, in ieder geval:

      a. een tekening of schema met de actuele indeling van de natte koeltoren;

      b. een beschrijving van de juiste en veilige werking van de natte koeltoren;

      c. een beschrijving van alle uit te voeren controles aan de natte koeltoren, inclusief de controle op de
      aanwezigheid van Legionella;

      d. een aanduiding van de waarden van de fysische, chemische en microbiologische parameters inclusief de
      concentratie aan legionellabacteriën in de natte koeltoren bij het bereiken waarvan maatregelen ter verbetering
      worden getroffen, alsmede een beschrijving van die maatregelen;

      e. een beschrijving van de maatregelen die worden genomen bij calamiteiten.

      4 De maatregelen, bedoeld in het eerste lid, zijn ten aanzien van het voorkomen of beperken van de risico’s voor de
      omgeving door legionellabacteriën bij het in bedrijf nemen en hebben van een natte koeltoren doeltreffend indien:

      a. het ontstaan en de verspreiding van waternevel zoveel mogelijk worden beperkt;

      b. de stilstand van water in leidingen, reservoirs en appendages zoveel mogelijk wordt vermeden;

      c. de natte koeltoren en het water dat zich daarin bevindt schoon zijn;

      d. de vermeerdering van legionellabacteriën zo veel mogelijk wordt beperkt door toepassing van
      waterbehandelingstechnieken;

      e. een juiste en veilige werking van de natte koeltoren conform de processpecificaties is gewaarborgd.

      5 De risicoanalyse wordt aangepast indien de omstandigheden binnen de inrichting of in de onmiddellijke nabijheid
      daarvan daartoe aanleiding geven.

      6 In het legionella-beheersplan, bedoeld in het eerste lid, wordt aantekening gemaakt van de
      onderhoudswerkzaamheden die worden verricht, de wijzigingen in de natte koeltoren of het onderhoud, de uitkomsten
      van controles die worden uitgevoerd, alsmede bijzonderheden over de werking van de natte koeltoren. Deze
      aantekeningen worden ten minste gedurende drie jaren bewaard.

      7 Het bevoegd gezag, kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen,
      dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans
      dat ongewone voorvallen zich voordoen en de gevolgen hiervan, maatwerkvoorschriften stellen ten aanzien van de
      invulling van het legionella-beheersplan, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.16a
  - number: 3.16b
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 3.16d, eerste lid, van het besluit][ref1] voldoet een
      koelinstallatie:

      a. met ammoniak als koudemiddel ten minste aan paragraaf 2.5, met uitzondering van voorschrift 2.5.6, hoofdstuk 5
      en hoofdstuk 8, met uitzondering van de paragrafen 8.3 en 8.6, van PGS 13;

      b. met koolwaterstoffen als koudemiddel ten minste aan paragraaf 5.7, hoofdstuk 7 en hoofdstuk 8, met uitzondering
      van de paragrafen 8.3 en 8.6 van NPR 7600;

      c. met kooldioxide als koudemiddel ten minste aan paragraaf 5.7, hoofdstuk 7 en hoofdstuk 8, uitgezonderd de
      paragrafen 8.3 en 8.6, van NPR 7601.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.16d
