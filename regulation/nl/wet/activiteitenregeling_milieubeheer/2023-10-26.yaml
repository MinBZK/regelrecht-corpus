  - number: '5.4'
    text: |-
      1 Tot de continue metingen, bedoeld in [artikel 5.3][ref1], behoort tevens de meting van:

      a. het zuurstofgehalte;

      b. de temperatuur;

      c. de druk;

      d. het waterdampgehalte van het afgas, tenzij het als monster gebruikte afgas wordt gedroogd alvorens de emissies
      in de lucht worden geanalyseerd.

      2 De resultaten van de overeenkomstig deze afdeling verrichte metingen worden herleid tot een massaconcentratie bij
      het genormaliseerde zuurstofgehalte, bedoeld in [artikel 5.3, vierde lid, van het besluit][ref2], overeenkomstig
      de volgende formule:

      E = (21-O)/(21-O) x E, waarbij wordt verstaan onder:

      E = de berekende emissieconcentratie bij het genormaliseerde zuurstofgehalte

      E = de gemeten emissieconcentratie

      O = het genormaliseerde zuurstofgehalte

      O = het gemeten zuurstofgehalte


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5.3
