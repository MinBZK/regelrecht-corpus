    text: |-
      1 Aan [artikel 2.15, eerste lid, van het besluit][ref1] wordt, door degene die de inrichting drijft, in ieder
      geval voldaan indien alle in [bijlage 10][ref2] opgenomen maatregelen ter verduurzaming van het energiegebruik zijn
      getroffen die op de inrichting van toepassing zijn, tenzij:

      a. [artikel 2.15, negende lid, onderdeel b, van het besluit][ref3] van toepassing is;

      b. er sprake is van een inrichting waarop [artikel 3.55 van het besluit][ref4] van toepassing is; of

      c. er sprake is van een inrichting waarop a[rtikel 3.75 van het beslui][ref5]t van
      toepassing is en degene die de inrichting drijft gebruik maakt van het tarief, bedoeld in
      [artikel 60, eerste lid, van de Wet belastingen op milieugrondslag][ref6].

      2 Aan [artikel 2.15, eerste lid, van het besluit][ref7] wordt, door degene die de inrichting drijft, in ieder geval
      voldaan indien alle in [bijlage 10c][ref8] opgenomen maatregelen ter verduurzaming van het energiegebruik zijn
      getroffen die op de inrichting van toepassing zijn en er sprake is van:

      a. een inrichting waarop [artikel 3.55 van het besluit][ref9] van toepassing is; of

      b. van een inrichting waarop [artikel 3.75 van het besluit][ref10] van toepassing
      is en degene die de inrichting drijft gebruik maakt van het tarief, bedoeld in
      [artikel 60, eerste lid, van de Wet belastingen op milieugrondslag][ref11].

      3 Het tweede lid is niet van toepassing wanneer [artikel 2.15, negende lid, onderdeel b, van het besluit][ref12]
      van toepassing is.


