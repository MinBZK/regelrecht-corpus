        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: '4.4'
    text: |-
      Spuitbussen, gaspatronen of aanstekers van de klasse 2 van het ADR worden opgeslagen in een opslagvoorziening die
      is uitgevoerd en wordt gebruikt overeenkomstig de volgende onderdelen van PGS 15:

      a. de voorschriften 3.1.1 en 3.1.3;

      b. de voorschriften 3.2.1 tot en met 3.2.10;

      c. de voorschriften 3.3.1 tot en met 3.3.3;

      d. de voorschriften 3.4.2 tot en met 3.4.8;

      e. de paragrafen 3.7, 3.11 en 3.12;

      f. de voorschriften 3.13.1 en 3.13.2;

      g. voorschrift 3.14.1;

      h. de paragrafen 3.15, 3.16, 3.18 en 3.19.1, en

      i. de paragrafen 7.3 en 7.4.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.4
  - number: 4.4a
    text: |-
      1 Gasflessen van de klasse 2 van het ADR worden opgeslagen in een opslagvoorziening die is uitgevoerd en wordt
      gebruikt overeenkomstig de volgende onderdelen van PGS 15:

      a. de voorschriften 3.1.1 en 3.1.3;

      b. de voorschriften 3.2.1, 3.2.2 en 3.2.4 tot en met 3.2.10;

      c. de voorschriften 3.4.10 en 3.4.11;

      d. paragraaf 3.7, met uitzondering van voorschrift 3.7.5;

      e. de paragrafen 3.11 tot en met 3.19.1, met uitzondering van voorschrift 3.14.2, en

      f. de voorschriften 6.1.2 en 6.1.3.

      2 Gasflessen van de klasse 2 van het ADR in een brandveiligheidsopslagkast worden opgeslagen overeenkomstig de
      volgende onderdelen van PGS 15:

      a. de voorschriften 6.2.1 en 6.2.2;

      b. de voorschriften 6.2.7 tot en met 6.2.17, en

      c. de voorschriften 6.3.2 tot en met 6.3.5.

      3 Het opslaan van gasflessen anders dan in een brandveiligheidsopslagkast voldoet aan paragraaf 6.2 van PGS 15.

      4 Het eerste, tweede en derde lid zijn niet van toepassing op gasflessen van de klasse 2 van het ADR met:

      a. warmte-isolerende bescherming voor het vervoer van sterkt gekoelde vloeibaar gemaakte gassen;

      b. kooldioxide met een doelmatige drukontlastvoorziening;

      c. kooldioxide bij horecagelegenheden, of

      d. brandblusmiddelen voor direct gebruik.

      5 Een opslagplaats voor de gasflessen, bedoeld in het vierde lid, is vanaf de buitenzijde als zodanig herkenbaar,
      op een duidelijke wijze gemarkeerd en niet voor onbevoegden toegankelijk.

      6 Gasflessen buiten een opslagvoorziening als bedoeld in het eerste lid voldoen aan de voorschriften 6.1.2, 6.2.10
      en 6.2.15 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.4a
  - number: 4.4b
    text: |-
      1 Gevaarlijke stoffen in verpakking van de klasse 4 van het ADR worden opgeslagen in een opslagvoorziening die is
      uitgevoerd en wordt gebruikt overeenkomstig de volgende onderdelen van PGS 15:

      a. paragraaf 3.1, met uitzondering van voorschrift 3.1.2;

      b. paragraaf 3.2, met uitzondering van voorschrift 3.2.13;

      c. de voorschriften 3.3.1 tot en met 3.3.3;

      d. de voorschriften 3.4.1 tot en met 3.4.8;

      e. de paragrafen 3.6, 3.7, 3.11 en 3.12;

      f. de voorschriften 3.13.1 en 3.13.2;

      g. voorschrift 3.14.1, en

      h. de paragrafen 3.15, 3.16, 3.18 en 3.19.1.

      2 Het opslaan van gevaarlijke stoffen in verpakking van de klasse 4 van het ADR anders dan in een
      brandveiligheidsopslagkast voldoet aan voorschrift 8.5.1 van PGS 15.

      3 Het opslaan van gevaarlijke stoffen in verpakking van de klasse 4.1 van het ADR anders dan in een
      brandveiligheidsopslagkast voldoet aan voorschrift 8.5.2 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.4b
  - number: 4.4c
    text: |-
      1 Gebruikte loodzuuraccu’s worden opgeslagen boven een vloeistofdichte vloer, verharding of lekbak.

      2 De vloeistofdichte vloer, verharding of lekbak, bedoeld in het eerste lid:

      a. is voldoende sterk om weerstand te bieden aan optredende vloeistofdruk als gevolg van een lekkage;

      b. heeft een oppervlak dat niet groter is dan 20 vierkante meter, en

      c. heeft een opvangcapaciteit die ten minste gelijk is aan de totale inhoud van de opgeslagen loodzuuraccu’s.

      3 Een loodzuuraccu staat rechtop.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.4c
  - number: 4.4d
    text: |-
      Indien in deze paragraaf wordt verwezen naar PGS 15 kan het bevoegd gezag bij maatwerkvoorschrift eisen stellen aan
      het opslaan van gevaarlijke stoffen als bedoeld in deze paragraaf, voor zover toepassing van PGS 15 redelijkerwijs
      niet mogelijk is en de bescherming van het milieu zich daar niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.4d
  - number: '4.5'
    text: |-
      In afwijking van de [artikelen 4.3 tot en met 4.4b][ref1] kan het bevoegd gezag voor inrichtingen die zijn
      opgericht voor 1 januari 2008 en waarvoor tot dat tijdstip een vergunning van kracht was, dan wel voorschriften
      golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref2], maatwerkvoorschriften
      stellen ten aanzien van de bouwkundige eisen zoals gesteld in voorschrift 3.2.2 van PGS 15. Het maatwerkvoorschrift
      kan uitsluitend minder strenge eisen aan de bouwkundige voorzieningen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.5
