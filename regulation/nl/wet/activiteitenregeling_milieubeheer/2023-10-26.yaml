  - number: '4.7'
    text: |-
      1 Tijdelijke opslag van gevaarlijke stoffen vindt plaats:

      a. in één of meer speciaal daarvoor bestemde opslagvoorzieningen, of

      b. in één of meer laad- en losgedeelten tijdens de aanwezigheid van een deskundige als bedoeld in voorschrift
      3.14.1 van PGS 15.

      2 Tijdelijke opslag van gevaarlijke stoffen als bedoeld in het eerste lid voldoet aan de volgende onderdelen van
      PGS 15:

      a. voorschrift 3.2.4;

      b. de voorschriften 3.4.2 tot en met 3.4.7 en 3.4.9;

      c. paragraaf 3.6;

      d. de voorschriften 3.7.1 tot en met 3.7.7;

      e. de paragrafen 3.10, 3.11 en 3.12;

      f. de voorschriften 3.13.1 en 3.13.2;

      g. voorschrift 3.14.1;

      h. de paragrafen 3.15, 3.16 en 3.18, en

      i. de voorschriften 5.4.2, 5.4.3 en 5.4.6 tot en met 5.4.9.

      3 In de opslagvoorziening, bedoeld in het eerste lid, onderdeel a, en in het laad- en losgedeelte, bedoeld in het
      eerste lid, onderdeel b, zijn geen stoffen aanwezig van:

      a. verpakkingsgroep I van het ADR;

      b. de klasse 1, 2 gevaarsetiket 2.3 en 7 van het ADR;

      c. de klasse 5.2 van het ADR, met uitzondering van gelimiteerde hoeveelheden tot 1.000 kg, of

      d. de klasse 6.2 van het ADR, met uitzondering van stoffen met UN-nummer 3291 en UN-nummer 3373.

      4 Het derde lid is van overeenkomstige toepassing op gasflessen.

      5 Onverminderd het tweede tot en met vierde lid voldoet de opslag, bedoeld in het eerste lid, onderdeel a, aan de
      voorschriften van paragraaf 5.5 van PGS15.

      6 Onverminderd het tweede tot en met vierde lid voldoet de opslag, bedoeld in het eerste lid, onderdeel b, aan de
      voorschriften van paragraaf 5.6 PGS 15.

      7 In afwijking van het vijfde en zesde lid is tot [1 oktober 2020] het tweede aandachtstreepje van de voorschriften
      5.5.2 en 5.6.5 van de PGS 15 niet van toepassing op een inrichting die is opgericht voor [1 oktober 2017]. De
      maximaal aanwezige hoeveelheid stoffen van ADR klasse 3 is in dat geval 2000 kg of liter per opslagvoorziening als
      bedoeld in dit artikel.
