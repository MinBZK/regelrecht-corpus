  - number: 3.4gb
    text: |-
      1 Voor de toepassing van dit artikel wordt onder ‘het te zuiveren stedelijk afvalwater’ verstaan: het aangevoerde
      stedelijk afvalwater voor eventuele vermenging met een of meer deelstromen die bij het zuiveringsproces vrijkomen
      en die op het zuiveringtechnisch werk worden teruggevoerd.

      2 De plaats van bemonstering wordt daar gekozen waar een zo representatief mogelijk beeld van de concentraties
      van de te bepalen parameters in het te zuiveren stedelijk afvalwater of in het na zuivering te lozen stedelijk
      afvalwater kan worden verkregen.

      3 Het te zuiveren stedelijk afvalwater wordt volumeproportioneel over een etmaal bemonsterd.

      4 Het na zuivering te lozen stedelijk afvalwater wordt, ingeval van een zuiveringtechnisch werk met een
      ontwerpcapaciteit van:

      a. meer dan 100.000 inwonerequivalenten: volumeproportioneel over een etmaal bemonsterd, of

      b. ten hoogste 100.000 inwonerequivalenten: volumeproportioneel dan wel tijdproportioneel over een etmaal
      bemonsterd.

      5 De na zuivering geloosde hoeveelheid stedelijk afvalwater wordt dagelijks bepaald.

      6 Het minimum aantal te nemen monsters per jaar is afhankelijk van de ontwerpcapaciteit in inwonerequivalenten van
      het zuiveringtechnisch werk en wordt met gelijkmatige tussenpozen verdeeld over het jaar genomen conform:

      a. tabel 3.4.gb1, met betrekking tot de vaststelling van de per zuiveringtechnisch werk te zuiveren en na zuivering
      geloosde hoeveelheid totaal stikstof en totaal fosfor;

      b. tabel 3.4gb2, met betrekking tot de vaststelling per zuiveringtechnisch werk van het na zuivering geloosde
      biochemisch zuurstofverbruik gedurende vijf dagen, het chemisch zuurstofverbruik en de geloosde hoeveelheid
      onopgeloste stoffen.


