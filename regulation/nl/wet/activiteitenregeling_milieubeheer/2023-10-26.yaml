  - number: '4.23'
    text: |-
      1 Opslag van stoffen van ADR klasse 5.2 type D tot en met F in verpakking voldoet in elk geval aan de voorschriften
      van de hoofdstukken 4, 7 en 10 en de voorschriften 8.1.3 tot en met 8.1.7, 8.1.9 tot en met 8.1.19 en 8.2.5 van
      PGS 8.

      2 Onverminderd het eerste lid worden stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een
      hoeveelheid kleiner dan 30 kilogram opgeslagen in een opslagvoorziening die ten minste voldoet aan de voorschriften
      5.4.1, 5.4.3 tot en met 5.4.6, 5.4.8 tot en met 5.4.10 en 5.4.12 van PGS 8.

      3 Onverminderd het eerste lid worden stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een
      hoeveelheid vanaf 30 kilogram en kleiner dan 150 kilogram opgeslagen in een opslagvoorziening die ten minste
      voldoet aan de voorschriften 5.5.1 tot en met 5.5.8 en 5.5.11 tot en met 5.5.13 van PGS 8.

      4 Onverminderd het eerste lid worden stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een
      hoeveelheid vanaf 150 kilogram en kleiner dan 1.000 kilogram opgeslagen in een opslagvoorziening die ten minste
      voldoet aan voorschriften 5.6.1 tot en met 5.6.11 en 5.6.15 tot en met 5.6.19 van PGS 8.

      5 In afwijking van het tweede tot en met het vierde lid voldoet een dagvoorraad- of aftapruimte waar stoffen van
      ADR klasse 5.2 maximaal 72 uur voorhanden zijn aan de voorschriften 5.8.2 tot en met 5.8.11 en 5.8.14 tot en met
      5.8.16 van PGS 8.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.23
  - number: '4.24'
    text: |-
      1 Een dagvoorraad- of aftapruimte waar stoffen van ADR klasse 5.2 maximaal 72 uur voor handen zijn en de opslag
      van stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een hoeveelheid vanaf 150 kilogram is
      overeenkomstig hoofdstuk 7 van PGS 8 zo uitgevoerd, dat de kans op brandoverslag zo klein mogelijk is.

      2 Aan het eerste lid wordt in elk geval voldaan als:

      a. de afstand van de opslagvoorziening tot interne objecten waar zich mensen bevinden ten minste tien meter
      bedraagt; en

      b. de afstand tot interne objecten waar zich over het algemeen geen mensen bevinden ten minste vijf meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.24
  - number: '4.25'
    text: |-
      1 [Artikel 4.23][ref1] is niet van toepassing op stoffen van ADR klasse 5.2 type D, E en F, waarvoor volgens het
      ADR temperatuurbeheersing niet is vereist, indien deze stoffen worden opgeslagen in een hoeveelheid van ten hoogste
      1.000 kilogram per opslagvoorziening, in verpakking als LQ en in een opslagvoorziening die is uitgevoerd en wordt
      gebruikt overeenkomstig de voorschriften 5.2.1 tot en met 5.2.4 van PGS 8 en de volgende onderdelen van PGS 15:

      a. paragraaf 3.1, met uitzondering van voorschrift 3.1.2;

      b. paragraaf 3.2, met uitzondering van voorschrift 3.2.13;

      c. de voorschriften 3.3.1 tot en met 3.3.3;

      d. de voorschriften 3.4.1 tot en met 3.4.8;

      e. de paragrafen 3.6, 3.7, 3.11 en 3.12;

      f. de voorschriften 3.13.1 en 3.13.2;

      g. voorschrift 3.14.1;

      h. de paragrafen 3.15, 3.16, 3.18 en 3.19.1, en

      i. de voorschriften 9.2.2 of voorschrift 9.2.3.

      2 Stoffen van ADR klasse 5.2, type C, waarvoor volgens het ADR temperatuurbeheersing niet is vereist, worden
      opgeslagen in een hoeveelheid van ten hoogste 1.000 kilogram per opslagvoorziening, in verpakking als LQ en in een
      opslagvoorziening die is uitgevoerd en wordt gebruikt overeenkomstig de voorschriften 5.2.1 tot en met 5.2.4 van
      PGS 8 en de volgende onderdelen van PGS 15:

      a. paragraaf 3.1, met uitzondering van voorschrift 3.1.2;

      b. paragraaf 3.2, met uitzondering van voorschrift 3.2.13;

      c. de voorschriften 3.3.1 tot en met 3.3.3;

      d. de voorschriften 3.4.1 tot en met 3.4.8;

      e. de paragrafen 3.6, 3.7, 3.11 en 3.12;

      f. de voorschriften 3.13.1 en 3.13.2;

      g. voorschrift 3.14.1;

      h. de paragrafen 3.15, 3.16, 3.18 en 3.19.1, en

      i. de voorschriften 9.2.2 of voorschrift 9.2.3.


