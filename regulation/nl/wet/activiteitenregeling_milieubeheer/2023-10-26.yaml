      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het onderhouden, repareren of behandelen
      van de oppervlakte en het deconserveren en het voorzien van een antiroestbehandeling van motoren, motorvoertuigen
      spoorvoertuigen, andere gemotoriseerde apparaten of onderdelen daarvan, waarbij vloeistoffen vrij kunnen komen, ten
      minste plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.97
  - number: '4.98'
    text: |-
      1 Ten behoeve van het voorkomen van milieuverontreiniging draagt degene die de inrichting drijft er bij het
      onderhouden, repareren en afspuiten van pleziervaartuigen ten minste zorg voor dat:

      a. binnen de inrichting gedragsvoorschriften aanwezig zijn, die zijn gericht op het voorkomen van
      milieuverontreiniging door de houders van pleziervaartuigen en ziet toe op de naleving daarvan. De
      gedragsvoorschriften bevatten in elk geval instructies ten aanzien van het uitvoeren van onderhoud en reparatie
      van pleziervaartuigen;

      b. machinaal schuren geschiedt met mechanische stofafzuiging waarbij het vrijkomende schuurstof in een stofzak
      wordt opgevangen.

      2 De gedragsvoorschriften als bedoeld in eerste lid onderdeel a, zijn binnen de inrichting zodanig aanwezig dat een
      ieder daarvan op eenvoudige wijze kennis kan nemen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.98
  - number: '4.99'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het onderhouden, repareren en
      afspuiten van pleziervaartuigen, het repareren, onderhouden en behandelen van de oppervlakte van pleziervaartuigen
      of onderdelen daarvan, waarbij vloeistoffen vrij kunnen komen, plaats boven een bodembeschermende voorziening.

      2 Het eerste lid is niet van toepassing indien deze werkzaamheden worden verricht binnen het vaartuig.

      3 Het op de wal met water onder hoge druk reinigen van de romp onder de waterlijn van een pleziervaartuig,
      geschiedt boven een vloeistofkerende vloer of verharding.

      4 Windwerende voorzieningen worden toegepast indien dat nodig is om verwaaien van afvalwater of afvalstoffen te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.99
  - number: '4.100'
    text: |-
      1 Ten behoeve van het voorkomen, dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder, worden afgezogen dampen en gassen van het zeefdrukken die op de buitenlucht worden geëmitteerd, ten
      minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen bebouwing, afgevoerd.

      2 Het eerste lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.

      3 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege
      onvoldoende verspreiding van afgezogen dampen, vanwege geuremissies die niet via de afzuiging
      worden afgevoerd of vanwege incidentele geurpieken in aanvulling op het eerste lid overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref1] maatwerkvoorschriften stellen met betrekking tot:

      a. de situering van de afvoerpijp;

      b. het voorkomen of beperken van diffuse geuremissies; of

      c. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      4 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref2], is het
      eerste lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref3] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      5 In afwijking van het vierde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het derde lid stellen.


