      1 Het meten van de hoeveelheid drainwater die wordt geloosd en de hoeveelheid voedingswater die wordt toegediend,
      bedoeld in [artikel 3.67, eerste lid, onderdeel a, van het besluit][ref1] vindt plaats bij ieder lozingspunt.

      2 Het registreren van de hoeveelheid drainwater die wordt geloosd en de hoeveelheid voedingswater die is
      toegediend, bedoeld in [artikel 3.67, eerste lid, onderdeel a, van het besluit][ref2] vindt plaats per periode van
      vier weken, beginnend op dag 1 van week 1.

      3 Het meten en registreren van het gehalte aan totaal stikstof en totaal fosfor, natrium en de geleidingswaarde in
      het drainwater, bedoeld in [artikel 3.67, eerste lid, onderdeel b, van het besluit][ref3] vindt ten minste een keer
      per periode van acht weken plaats, beginnend op dag 1 van week 1 en ten minste een keer in de weken 49 tot 52.

      4 De afwijking van de nauwkeurigheid van de instrumenten die worden gebruikt voor het meten van de hoeveelheden,
      bedoeld in het eerste lid, bedraagt ten hoogste tien procent.

