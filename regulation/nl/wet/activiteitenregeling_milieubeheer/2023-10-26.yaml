  - number: '3.46'
    text: |-
      1 Ten behoeve van het voorkomen dan wel beperken van geurhinder worden opgeslagen bederfelijke afvalstoffen voor
      zover het niet-houtachtige plantenresten betreft binnen 14 dagen na de aanvoer uit de inrichting afgevoerd, of
      verwerkt in een composteringsplaats.

      2 Dierlijke bijproducten die worden gebruikt voor activiteiten als bedoeld in artikel 17, eerste lid, en artikel
      18, eerste en tweede lid, van Verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober
      2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke
      bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (verordening dierlijke
      bijproducten) (PbEU L 2009, 300), worden opgeslagen in vaten of containers of in een afgesloten ruimte. Indien die
      dierlijke bijproducten niet binnen een werkdag worden verwerkt, worden ze bewaard bij een omgevingstemperatuur van
      ten hoogste 10°C.

      3 Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege de
      op- en overslag van niet-houtachtige plantenresten of dierlijke bijproducten, bedoeld in het tweede lid, bij
      maatwerkvoorschrift eisen stellen aan de locatie van de opslag, de afvoer- of verwerkingsfrequentie en de
      toegepaste opslagvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.46
  - number: '3.47'
    text: |-
      1 Aan [artikel 3.32, aanhef en onder a en b, van het besluit][ref1] wordt bij de buitenopslag van goederen
      behorend tot de stuifklasse S2 van [bijlage 3 bij het besluit][ref2] in ieder geval voldaan indien de stoffen door
      besproeiing vochtig worden gehouden.

      2 Aan [artikel 3.38, tweede lid, van het besluit][ref3] wordt bij opslag van goederen behorend tot de stuifklasse
      S1 en S2 van [bijlage 3 bij het besluit][ref4] in ieder geval voldaan indien afgezogen lucht door een filtrerende
      afscheider wordt gevoerd die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


