  - number: 4.102h
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het lijmen, coaten en lamineren van
      papier of karton het verwerken van lijmen en coatings plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.102h
  - number: 4.102i
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, wordt stofklasse S dat
      vrijkomt bij het mechanisch verkleinen van papier en karton en van papieren of kartonnen producten, voor zover dat
      redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden afgezogen emissies, die
      vrijkomen bij het mechanisch verkleinen van papier en karton en van papieren of kartonnen producten en die naar de
      buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een
      gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein
      met minder dan één gevoelig gebouw per hectare, is gelegen.

      3 Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.

      4 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref1], is het
      tweede lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref2] nodig is en voor zover de emissies als bedoeld in het tweede lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      5 In afwijking van het vierde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het derde lid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.102i
    references:
