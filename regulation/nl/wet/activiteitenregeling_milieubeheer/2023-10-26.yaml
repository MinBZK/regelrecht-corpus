      - id: ref2
        bwb_id: BWBR0022762
        artikel: 4.74f
  - number: 4.84e
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het aanbrengen van lijmen, harsen
      of coatings op steen het verwerken van lijmen, harsen, coatings en verdunningsmiddelen alsmede het aanbrengen van
      coatings op steen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84e
  - number: 4.84f
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico is een dompelbad waarin steen chemisch wordt
      behandeld, opgesteld boven een lekbak of een vloeistofdichte vloer of verharding, die zich ten minste uitstrekt tot
      de oppervlakte van het dompelbad en het daarbij behorende uitlekgebied. Onder dit uitlekgebied wordt niet begrepen
      het gebied waar het steen wordt geplaatst nadat dit is afgespoeld met water of is gespoeld in een bad met water.

      2 Een dompelbad dat zich automatisch vult, is voorzien van een doelmatige overvulbeveiliging of
      overloopbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84f
  - number: 4.84g
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies en het
      bevorderen van een doelmatige verspreiding van emissies naar de buitenlucht als bedoeld in
      [artikel 4.74j, derde lid, van het besluit][ref1], worden bij het doseren en mengen ten behoeve van de
      vervaardiging van betonmortel de emissies die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht
      afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig
      gebouw op een gezoneerd industrieterrein of op een bedrijventerrein met minder dan één gevoelig gebouw per hectare.

      2 Het bevoegd gezag kan in het belang van de luchtkwaliteit en maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de lucht.

      3 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref2], is het
      eerste lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref3] nodig is en voor zover de emissies als bedoeld in het eerste lid
      niet toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      4 In afwijking van het derde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het tweede lid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74j
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84g
    references:
