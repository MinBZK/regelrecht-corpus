  - number: '5.6'
    text: |-
      1 Geautomatiseerde meetsystemen worden ten minste eenmaal per jaar met behulp van parallelmetingen met de
      referentiemeetmethoden, bedoeld in [artikel 5.5][ref1], gecontroleerd.

      2 De drijver van de inrichting informeert het bevoegd gezag over de resultaten van de in het eerste lid bedoelde
      controle.

      3 De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden
      worden berekend die getoetst worden aan een emissiegrenswaarde, is bij continue metingen niet groter dan de
      volgende percentages van de emissiegrenswaarde:

      a. koolmonoxide: 10% van de emissiegrenswaarde;

      b. zwaveldioxide (SO): 20% van de emissiegrenswaarde;

      c. stikstofoxiden (NO): 20% van de emissiegrenswaarde;

      d. totaal stof: 30% van de emissiegrenswaarde.

      4 De gevalideerde uur- en daggemiddelden worden bij continue metingen vastgesteld op grond van de valide gemeten
      uurgemiddelden, na aftrek van de waarde van het in het derde lid vermelde 95%-betrouwbaarheidsinterval.

      5 Indien in een dag meer dan drie uurgemiddelden ongeldig zijn wegens storing of onderhoud van het continu werkende
      meetsysteem, worden de metingen van die dag als ongeldig beschouwd. Indien per jaar de metingen van meer dan
      tien dagen ongeldig zijn, worden passende maatregelen getroffen om de betrouwbaarheid van het continu werkende
      meetsysteem te verbeteren.

      6 Voor het bepalen van de totale concentratie van dioxinen en furanen is [artikel 5.19, vijfde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5.19
