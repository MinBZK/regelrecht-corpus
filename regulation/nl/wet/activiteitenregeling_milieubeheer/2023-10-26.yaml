  - number: '3.29'
    text: |-
      1 Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover
      dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan is een opslagtank met propaan die op een bouwplaats is opgesteld
      en is geïnstalleerd ten behoeve van bouwactiviteiten, voorzover van toepassing, in overstemming met het
      [Warenwetbesluit drukapparatuur][ref1] en voldoet de opslagtank met propaan voorts aan hoofdstuk 7 van PGS 19.

      2 Een opslagtank met propaan die anders dan op een bouwplaats is opgesteld of anders dan ten behoeve
      van bouwactiviteiten is geïnstalleerd, is, voor zover van toepassing, in overeenstemming met het
      [Warenwetbesluit drukapparatuur][ref2] en voldoet voorts aan de hoofdstukken 2 en 4, met uitzondering van de
      paragrafen 4.3 en 4.4, en aan de hoofdstukken 5 en 6 van PGS 19, met dien verstande dat een brandmuur niet is
      toegestaan.

      3 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat in afwijking van het tweede lid een brandmuur is
      toegestaan indien redelijkerwijs niet kan worden voldaan aan de interne veiligheidsafstanden uit de PGS 19. De
      brandmuur voldoet aan de paragrafen 4.2.4 tot en met 4.2.7 en de voorschriften 4.8.5, 4.8.7 van de PGS 19.

      4 In afwijking van het eerste en tweede lid is voor een opslagtank met propaan die is geïnstalleerd voor 1 januari
      2016 de interne veiligheidsafstand die gold tot die datum van toepassing indien die afstand kleiner is dan de
      afstand die volgt uit de PGS 19.

      5 In afwijking van het eerste en tweede lid mag de afstand worden verkleind tot 3 meter voor opslagtanks die
      zijn geïnstalleerd voor (de datum van inwerkingtreding van deze wijzigingsregeling) als er een brandmuur is
      geplaatst overeenkomstig CPR 11-2 voorschrift 8.1.5 of als voor die datum met een berekening is aangetoond dat de
      warmtestraling op de opslagtank ten hoogste 10 kW per vierkante meter bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
      [ref2]: https://wetten.overheid.nl/BWBR0010586
