  - number: '3.43'
    text: |-
      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het opslaan van goederen waaruit
      vloeibare bodembedreigende stoffen kunnen lekken, plaats boven een vloeistofdichte vloer of verharding of in
      gesloten verpakking, die voldoet aan de ADR-eisen voor vergelijkbare stoffen of anderszins deugdelijk is, boven een
      bodembeschermende voorziening.

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico worden goederen, waaruit in een significante
      hoeveelheid bodembedreigende stoffen kunnen uitlogen, en die niet vallen onder het eerste lid, en restafval dat
      dergelijke stoffen kan bevatten, opgeslagen boven een vloeistofdichte vloer of verharding.

      3 In afwijking van het tweede lid vindt de opslag plaats boven een bodembeschermende voorziening indien deze
      zodanig tegen inregenen is beschermd dat uitlogen wordt voorkomen.

      4 In afwijking van het tweede lid vindt de opslag van zink plaats boven een bodembeschermende voorziening, indien
      opslag overeenkomstig het derde lid redelijkerwijs niet mogelijk is.

      5 Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat voor de opslag van andere metalen dan zink het
      tweede lid niet van toepassing is, indien opslag conform het derde lid redelijkerwijs niet mogelijk is, de opslag
      plaatsvindt boven een bodembeschermende voorziening, en het belang van de bescherming van het milieu zich daartegen
      niet verzet.

      6 C-hout met KOMO-certificaat, grond en niet verpompbare baggerspecie, bedoeld en geschikt voor toepassing
      overeenkomstig het [Besluit bodemkwaliteit][ref1], die ter plaatse van de opslag niet voldoen aan de
      [artikelen 52][ref2], [59][ref3] of [60 van dat besluit][ref4], worden opgeslagen boven een bodembeschermende
      voorziening.

      7 Verpompbare baggerspecie, bedoeld en geschikt voor toepassing overeenkomstig het Besluit
      bodemkwaliteit, die ter plaatse van de opslag niet voldoet aan de [artikelen 52][ref5], [59][ref6] of
      [60 van het Besluit bodemkwaliteit][ref7] wordt opgeslagen in een foliebassin.

      8 Op het opslaan, bedoeld in het zevende lid, zijn de [artikelen 3.68][ref8] en [3.69][ref9] van overeenkomstige
      toepassing.


