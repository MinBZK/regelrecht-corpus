  - number: '3.35'
    text: |-
      1 Een ondergrondse opslagtank met de daarbij behorende leidingen en appendages van staal
      of van kunststof waarin vloeibare brandstof of een organisch oplosmiddel als bedoeld in
      [artikel 3.29, eerste lid, onderdelen c tot en met i, van het besluit][ref1] dan wel de stof, bedoeld in artikel
      3.29, tweede lid, van het besluit is opgeslagen, wordt beoordeeld en gecontroleerd overeenkomstig het daartoe
      krachtens het [Besluit bodemkwaliteit][ref2] aangewezen normdocument, door een persoon of instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit.

      2 Voor een ondergrondse opslagtank met de daarbij behorende leidingen en appendages gelden de keurings- en
      herkeuringstermijnen van tabel 3.35.


            Tabel 3.35







                    (Her)keuringstermijnen voor een ondergrondse opslagtank met de daarbij behorende leidingen en
      appendages voor vloeistoffen van PGS-klasse 1 tot en met PGS-klasse 4






