  - number: '5.7'
    text: |-
      1 Het uitvoeren van periodieke metingen als bedoeld in [artikel 5.3][ref1] en parallelmetingen als bedoeld in
      [5.6][ref2] geschiedt door een rechtspersoon die voor deze verrichtingen geaccrediteerd is door een accreditatie-
      instantie.

      2 Het bevoegd gezag wordt ten minste twee weken van tevoren op de hoogte gesteld van de datum en het tijdstip
      waarop een periodieke meting of een parallelmeting zal worden uitgevoerd.

      3 Indien een afzonderlijke meting of parallelmeting geen doorgang vindt, wordt het bevoegd gezag uiterlijk op de
      datum voor de meting, bedoeld in het tweede lid, hiervan op de hoogte gesteld.

      4 Een periodieke meting bestaat uit een serie van ten minste drie deelmetingen.

      5 De duur van een deelmeting bedraagt een half uur. Wanneer het meettechnisch niet mogelijk is de deelmeting in die
      tijd uit te voeren, mag de deelmeting ten hoogste twee uur bedragen.

      6 De duur van een parallelmeting die wordt uitgevoerd ten behoeve van de verificatie van de meetapparatuur voor
      continue metingen, bedraagt ten minste een half uur.

      7 Bij periodieke metingen kan een door een rechtspersoon als bedoeld in het eerste lid aangetoonde
      95%-betrouwbaarheidsinterval op dezelfde wijze als [artikel 5.6, derde en vierde lid][ref3], worden
      verdisconteerd.


