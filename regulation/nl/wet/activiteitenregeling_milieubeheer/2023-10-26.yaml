  - number: '3.5'
    text: |-
      1 Aan [artikel 3.10b van het besluit][ref1] wordt voor zover het betreft de uitstoot van totaal stof bij de
      verbranding van brandstof in vloeibare vorm in ieder geval voldaan indien het asgehalte van de brandstof in
      massaprocent lager is dan de toepasselijke emissie-eis gedeeld door 800 en door middel van een keuring als bedoeld
      in [artikel 3.7m][ref2] kan worden aangetoond dat de concentratie van koolstof-monoxide (CO) in het rookgas lager
      ligt dan 100 mg/Nm3.

      2 Aan [artikel 3.10b van het besluit][ref3] wordt voor zover het betreft de uitstoot van totaal stof bij de
      verbranding van hout, in ieder geval voldaan indien:

      a. de afgezogen stofemissies die vrijkomen worden gevoerd door een elektrostatische E-filter waarvan
      door middel van een rapport van de leverancier kan worden aangetoond dat aan de emissie-eis in
      [artikel 3.10b van het besluit][ref4] kan worden voldaan; en

      b. de elektrostatische E-filter in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.

      3 Aan [artikel 3.10b van het besluit][ref5] wordt voor zover het betreft de uitstoot van stikstofoxiden (NO) bij de
      verbranding van hout, in ieder geval voldaan indien:

      a. de inrichtinghouder een meetrapport van de leverancier kan overleggen waaruit blijkt dat aan de in
      [artikel 3.10b][ref6] opgenomen emissiegrenswaarde van het besluit kan worden voldaan; en

      b. in de ketelinstallatie het houttype wordt gestookt waarop het onder a bedoelde rapport is betrokken.

      4 Aan [artikel 3.10b van het besluit ][ref7]wordt, voor zover het betreft de uitstoot van stof bij de verbranding
      van biomassa en houtpellets geproduceerd uit biomassa, in een installatie tot 400kW, in ieder geval voldaan indien:

      a. de drijver van de inrichting een meetrapport van de leverancier kan overleggen waaruit blijkt dat aan de
      emissiegrenswaarden in dat artikel kan worden voldaan, en

      b. in de ketelinstallatie het type biomassa en houtpellets geproduceerd uit biomassa, wordt gestookt waarop het
      rapport, bedoeld in onderdeel a, betrekking heeft.


