        artikel: 3.20a
  - number: '3.22'
    text: |-
      1 Een mobiele afleverinstallatie voldoet bij het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer
      aan bijlage D van PGS 28.

      2 Bij het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig wordt voldaan aan de voorschriften
      3.4.4, 3.4.7, 3.4.8, 3.4.11, 5.6.2 en 5.6.3 van PGS 28.

      3 Indien het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig plaatsvindt met een afleverslang die
      is aangekoppeld via een vaste aansluiting wordt een overvulbeveiliging toegepast.

      4 Tijdens het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig is voortdurend een persoon aanwezig
      die de aflevering indien nodig kan beëindigen.

      5 Het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig op een spoorwegemplacement vindt uitsluitend
      plaats op een daarvoor door de drijver van de inrichting aangewezen tankplaats.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.22
  - number: '3.23'
    text: |-
      1 Voor zover de nominale compressorcapaciteit per compressor ten minste 14,3 Nm3 per uur bedraagt, voldoet een
      aardgas-afleverinstallatie bij het afleveren van gecomprimeerd aardgas aan motorvoertuigen voor het wegverkeer aan
      de volgende onderdelen van PGS 25:

      a. de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagraaf 5.1.6, eerste en tweede alinea, en de
      paragrafen 5.5 en 5.7 tot en met 5.11, met uitzondering van de subparagraaf 5.10.1,

      b. de paragrafen 6.1 en 6.2;

      c. de paragrafen 7.1 en 7.3 tot en met 7.7;

      d. de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en

      e. de hoofdstukken 9 tot en met 12, met uitzondering van paragraaf 11.4.

      2 Bij het inpandig afleveren van gecomprimeerd aardgas wordt voldaan aan de paragrafen 13.1, 13.2 en 13.4 van PGS
      25.

      3 Het eerste lid is niet van toepassing op een aardgas-afleverinstallatie voor gecomprimeerd aardgas die in werking
      was voor 1 december 2013 tot het moment waarop de aardgas-afleverinstallatie uitgebreid wordt gerenoveerd, voor
      wat betreft:

      a. de dimensionering van de afblaasveiligheid, bedoeld in paragraaf 5.3.2 van PGS 25;

      b. de gronddekking van ondergrondse leidingen, bedoeld in paragraaf 5.3.10 van PGS 25;

      c. de interne veiligheidsafstanden, bedoeld in paragraaf 5.5 van PGS 25;

      d. het temperatuurgevoelige element in de afleverzuil bij onbemand afleveren, bedoeld in paragraaf 5.11.1 van PGS
      25;

      e. de veiligheidsafsluiter voor het gasnet, bedoeld in paragraaf 5.11.1 van PGS 25;

      f. de bouwkundige eisen aan een bufferopslag, bedoeld in paragraaf 7.3 van PGS 25, en

      g. de uitstroomrichting van de afblaasleiding, bedoeld in paragraaf 9.4 van PGS 25,

      indien de afleverinstallatie volgens het eerste lid met deze voorzieningen is uitgevoerd.

      4 Indien het derde lid van toepassing is, voldoet de aardgas-afleverinstallatie voor gecomprimeerd aardgas aan dit
      artikel zoals dit luidde tot 1 december 2013, voor zover dit artikel betrekking heeft op de voorzieningen, bedoeld
      in derde lid, onderdelen a tot en met g.

      5 Het tweede lid is tot het moment waarop de aardgasinstallatie uitgebreid wordt gerenoveerd dan wel uiterlijk
      tot 1 december 2023 niet van toepassing op het inpandig afleveren van gecomprimeerd aardgas. Tot dat moment of die
      datum voldoet een inpandige aardgas-afleverinstallatie voor gecomprimeerd aardgas aan de eisen die daaraan tot de
      1 december 2013 bij maatwerkvoorschrift werden gesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.23
  - number: '3.24'
    text: |-
      1 Voor zover de nominale compressorcapaciteit per compressor minder dan 14,3 Nm3 per uur bedraagt, voldoet een
      aardgas-afleverinstallatie bij het afleveren van gecomprimeerd aardgas aan motorvoertuigen voor het wegverkeer aan
      het tweede tot en met vierde lid.

      2 Een installatie als bedoeld in het eerste lid, die is voorzien van meerdere compressoren waarvan de uitlaatzijden
      zijn gekoppeld, voldoet aan de volgende onderdelen van PGS 25:

      a. de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagrafen 5.1.1 en 5.1.6, eerste en tweede alinea,
      en de paragrafen 5.5 en 5.7 tot en met 5.11, met uitzondering van subparagraaf 5.10.1;

      b. de paragrafen 6.1 en 6.2;

      c. de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en

      d. de hoofdstukken 9 tot en met 12, met uitzondering van de paragrafen 11.4 en 12.2.

      3 Indien een installatie als bedoeld in het tweede lid is voorzien van een bufferopslag, voldoet de installatie
      tevens aan de paragrafen 7.1 en 7.3 tot en met 7.7 van PGS 25.

      4 Een installatie als bedoeld in het eerste lid, die niet is voorzien van compressoren die aan de uitlaatzijde zijn
      gekoppeld maar die is voorzien van een bufferopslag, voldoet aan de volgende onderdelen van PGS 25:

      a. de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagrafen 5.1.1 en 5.1.6, eerste en tweede alinea,
      en de paragrafen 5.5, 5.7 en 5.9 tot en met 5.11, met uitzondering van subparagraaf 5.10.1;

      b. paragraaf 7.1 en de paragrafen 7.3 tot en met 7.7;

      c. de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en

      d. de hoofdstukken 9 tot en met 12, met uitzondering van de paragrafen 9.1, 11.4 en 12.2.

      5 Het tweede, derde en vierde lid zijn niet van toepassing op een aardgas-afleverinstallatie voor gecomprimeerd
      aardgas die in werking was voor 1 december 2013 tot het moment waarop de aardgas-afleverinstallatie uitgebreid
      wordt gerenoveerd, voor wat betreft:

      a. de dimensionering van de afblaasveiligheid, bedoeld in paragraaf 5.3.2 van PGS 25;

      b. de gronddekking van ondergrondse leidingen, bedoeld in paragraaf 5.3.10 van PGS 25;

      c. de interne veiligheidsafstanden, bedoeld in paragraaf 5.5 van PGS 25;

      d. het temperatuurgevoelig element in de afleverzuil bij onbemand afleveren, bedoeld in paragraaf 5.11.1 van PGS
      25;

      e. de veiligheidsafsluiter voor het gasnet, bedoeld in paragraaf 5.11.1 van PGS 25;

      f. de bouwkundige eisen aan een bufferopslag, bedoeld in paragraaf 7.3 van PGS 25, en

      g. de uitstroomrichting van de afblaasleiding, bedoeld in paragraaf 9.4 van PGS 25,

      indien de afleverinstallatie volgens het tweede, derde en vierde lid met deze voorzieningen is uitgevoerd.

      6 Indien het vijfde lid van toepassing is, voldoet de aardgas-afleverinstallatie voor gecomprimeerd aardgas
      aan [artikel 3.23][ref1], zoals dat luidde voor 1 december 2013, voor zover dat artikel betrekking heeft op de
      voorzieningen, bedoeld in het vijfde lid, onderdelen a tot en met g.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3.23
