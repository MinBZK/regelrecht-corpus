    text: |-
      1 Ter uitvoering van [artikel 4.103e, eerste lid, van het besluit][ref1], past degene die de inrichting drijft bij
      het coaten, veredelen en lijmen van textiel, leer of bont:

      a. maatregelen toe ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen;

      b. oplosmiddelarme producten en efficiënte applicatiemethoden toe.

      2 Indien de emissiereducerende maatregelen, bedoeld in het eerste lid, niet of in onvoldoende mate zijn getroffen,
      kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de motivering
      wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.103e
