  - number: '4.112'
    text: |-
      1 Ten behoeve van het zo volledig mogelijk verbranden van rookgassen en het zo veel mogelijk beperken van het
      ontstaan van stikstofdioxiden, wordt bij het inwerking hebben van een crematieoven voldaan aan het tweede tot en
      met het negende lid.

      2 Een crematieoven is voorzien van een naverbrandingsruimte voorzien van een naverbrander, waarin de rookgassen uit
      de hoofdkamer worden naverbrand.

      3 Bij het in werking hebben van een crematieoven wordt de vorming van stikstofoxiden beperkt door het toepassen van
      een low-NO brander in de hoofdkamer van de oven en de naverbrander in de naverbrandingsruimte.

      4 In de naverbrandingsruimte, bedoeld in het tweede lid, vindt een zodanige menging van de rookgassen plaats dat
      deze zo volledig mogelijk worden verbrand.

      5 Op verzoek van het bevoegd gezag wordt aangetoond dat het ontwerp van de crematieoven zodanig is, dat onder
      normale bedrijfsomstandigheden de verblijftijd van de afgassen in de naverbrandingsruimte ten minste 1,5 seconde
      bedraagt bij een temperatuur van ten minste 800 graden Celsius.

      6 De temperatuur van de rookgassen in de naverbrandingsruimte wordt door middel van een brander boven de 800 graden
      Celsius gehouden. Hiertoe is de brander van een automatische regeling voorzien.

      7 Het zuurstofgehalte in de naverbrandingsruimte bedraagt ten minste 6%. Kortdurende onderschrijdingen van dit
      gehalte zijn toegestaan met dien verstande dat deze onderschrijdingen nooit langer dan één minuut duren en dat het
      zuurstofgehalte altijd boven de 3% blijft.

      8 De temperatuur en het zuurstofgehalte in de naverbrandingsruimte worden continu gemeten en geregistreerd.

      9 Uiterlijk zes maanden na in gebruikname van de installatie en daarna jaarlijks wordt de goede werking van de
      installatie gecontroleerd door een deskundige. Hierbij wordt ten minste de werking van de automatische regelingen
      en de continue meetapparatuur gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.112
  - number: 4.112a
    text: |-
      Aan [artikel 4.118a van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen stofemissies die vrijkomen bij crematieprocessen worden gevoerd door een afscheider die geschikt is
      om aan [artikel 4.118a van het besluit][ref2] te voldoen, en

      b. die afscheider in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als voor de goede
      werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.118a
