      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.31 van het besluit][ref1] worden dampen en gassen die vrijkomen bij:

      a. het reinigen, coaten of lijmen van kunststof en kunststof producten door middel van vernevelen van vluchtige
      organische stoffen met een nevelspuit;

      b. het coaten van kunststof en kunststof producten door middel van het opbrengen van poeder;

      c. het reinigen, coaten of lijmen van kunststof en kunststof producten met vluchtige organische stoffen door middel
      van dompeling in open of halfgesloten baden, uitgezonderd de toepassing van hoogkokende stoffen;

      d. het aansluitend aan voornoemde activiteiten, drogen dan wel uitharden van met vluchtige organische stoffen
      behandelde materialen dan wel het moffelen van materialen die zijn van voorzien van een poedercoating, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het voorkomen, dan wel tot een aanvaardbaar niveau beperken van stofhinder als bedoeld
      in [artikel 4.31 van het besluit][ref2], worden emissies van stofklasse S, waaronder coating-, lijm- of
      poederdeeltjes, die vrijkomen bij het uitpandig coaten en lijmen van kunststof en kunststof producten door middel
      van vernevelen met een nevelspuit, voorkomen, dan wel beperkt door het treffen van doelmatige afschermingen.

      3 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht als bedoeld in
      [artikel 4.31 van het besluit][ref3], worden de overeenkomstig het eerste lid, onderdeel b, afgezogen dampen en
      gassen, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van
      een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op
      een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.

      4 Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder als bedoeld in
      [artikel 4.31 van het besluit][ref4] worden de overeenkomstig het eerste lid onderdelen a, c en d, afgezogen
      dampen en gassen, die op de buitenlucht worden geëmitteerd:

      a. ten minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd;
      of

      b. geleid door een doelmatige ontgeuringsinstallatie.

      5 Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het derde lid.

      6 Het vierde lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.

      7 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege
      het slecht functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen,
      geuremissies die niet via de afzuiging worden afgevoerd of incidentele geurpieken overeenkomstig
      [artikel 2.7a, derde lid, van het besluit][ref5] in aanvulling op het vierde lid maatwerkvoorschriften stellen met
      betrekking tot:

      a. de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het vierde lid;

      b. de situering van de afvoerpijp;

      c. het voorkomen of beperken van diffuse geuremissies; of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      8 In afwijking van het vierde lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het zevende lid onvoldoende zijn om de overschrijding ongedaan te maken
      overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref6] maatwerkvoorschriften stellen met betrekking tot de
      aanwezigheid van een ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.

      9 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref7], is het
      derde lid niet van toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref8] nodig is en voor zover de emissies als bedoeld in het derde lid niet
      toenemen en de wijze van afvoer van die emissies naar de buitenlucht niet verandert.

      10 In afwijking van het negende lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het vijfde lid
      stellen.

      11 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref9], is het
      vierde lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref10] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      12 In afwijking van het elfde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het zevende en achtste
      lid stellen.


