      1 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.94di van het besluit][ref1] vindt bij het toepassen van verpakkingsdiepdruktechniek:

      a. het bedrukken, lakken of lamineren;

      b. het mengen van watergedragen inkt of lak, of

      c. het spoelen van verpakkingen van watergedragen inkt, lak of lijm,

      plaats boven een bodembeschermende voorziening.

      2 Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.94di van het besluit][ref2] vindt bij het toepassen van flexodruktechniek:

      a. het mengen van oplosmiddelhoudende inkt en lak;

      b. het destilleren van oplosmiddelresten, of

      c. het spoelen van verpakkingen van oplosmiddelhoudende inkt, lak of lijm,

      plaats boven een vloeistofdichte vloer of voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.94di
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.94di
