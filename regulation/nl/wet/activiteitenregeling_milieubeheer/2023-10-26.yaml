  - number: '5.21'
    text: |-
      1 Aan de van toepassing zijnde emissiegrenswaarden voor afvalverbrandingsinstallaties voor totaal stof, totaal
      organische koolstof, zoutzuur, waterstoffluoride en zwaveldioxide (SO) wordt in ieder geval voldaan, indien:

      a. geen van de daggemiddelden hoger is dan de bijbehorende emissiegrenswaarde, en

      b. 97% van de halfuurgemiddelden in één kalenderjaar de bijbehorende emissiegrenswaarde niet overschrijdt.

      2 Aan de emissiegrenswaarden voor afvalverbrandingsinstallaties voor stikstofoxiden (NO) wordt geacht te zijn
      voldaan, indien:

      a. geen van de daggemiddelden hoger is dan de bijbehorende emissiegrenswaarde,

      b. geen van de maandgemiddelden hoger is dan de bijbehorende emissiegrenswaarde, en

      c. 97% van de halfuurgemiddelden in één kalenderjaar de bijbehorende emissiegrenswaarde niet overschrijdt.

      3 Aan de van toepassing zijnde emissiegrenswaarden voor afvalverbrandingsinstallaties voor koolmonoxide wordt in
      ieder geval voldaan, indien:

      a. 97% van de daggemiddelden in één kalenderjaar de bijbehorende emissiegrenswaarde niet overschrijdt, en

      b. 95% van alle 10-minutengemiddelden in een willekeurige periode van 24 uur de bijbehorende emissiegrenswaarde
      niet overschrijdt.

      4 Aan de van toepassing zijnde emissiegrenswaarden voor afvalmeeverbrandingsinstallaties voor totaal stof, totaal
      organische koolstof, zoutzuur, waterstoffluoride, zwaveldioxide (SO), stikstofoxiden (NO) en koolmonoxide wordt in
      ieder geval voldaan, indien geen van de daggemiddelden hoger is dan de bijbehorende emissiegrenswaarde.

      5 Halfuurgemiddelden en tienminutengemiddelden worden bepaald binnen de tijd dat de verbrandingsinstallatie in
      werking is, met uitzondering van de voor de inwerkingstelling en stillegging van de afvalverbrandingsinstallatie
      benodigde tijd indien gedurende die tijd geen afvalstoffen worden verbrand.

      6 Bij de bepaling van het daggemiddelde worden ten hoogste vijf halfuurgemiddelden wegens defecten of onderhoud
      van het systeem voor continue metingen buiten beschouwing gelaten. Per kalenderjaar worden ten hoogste tien
      daggemiddelden wegens defecten of onderhoud van het systeem voor continue metingen buiten beschouwing gelaten.

      7 Indien continue metingen niet zijn vereist, wordt aan de toepasselijke emissiegrenswaarden voor zwaveldioxide
      (SO), stikstofoxiden, waterstoffluoride en zoutzuur in ieder geval voldaan, indien geen enkele gevalideerde
      meetuitkomst voor de betreffende stof de emissiegrenswaarde overschrijdt.

      8 Aan de van toepassing zijnde emissiegrenswaarden voor kwik, de som van cadmium en thallium, de som van antimoon,
      arseen, chroom, kobalt, lood, mangaan, nikkel en vanadium en dioxinen en furanen wordt in ieder geval voldaan,
      indien het gevalideerde resultaat van de periodieke metingen lager is dan de bijbehorende emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.21
  - number: '5.22'
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarden voor emissies naar water wordt in ieder geval voldaan, indien:

      a. bij metingen van de totale hoeveelheid onopgeloste bestanddelen 95% en 100% van de meetwaarden de toepasselijke
      emissiegrenswaarden niet overschrijdt,

      b. bij metingen van kwik, cadmium, thallium, arseen, lood, chroom, nikkel, zink, antimoon, kobalt, mangaan,
      vanadium en tin niet meer dan eenmaal per jaar de toepasselijke emissiegrenswaarden worden overschreden, of,
      indien meer dan twintig steekproeven per jaar worden uitgevoerd, bij niet meer dan 5% van deze steekproeven de
      emissiegrenswaarden van [artikel 5.27 van het besluit][ref1] worden overschreden, en

      c. bij metingen van dioxinen en furanen de emissiegrenswaarden niet worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.27
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.22
