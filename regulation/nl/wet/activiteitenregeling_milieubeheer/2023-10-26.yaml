  - number: '3.40'
    text: |-
      1 Aan [artikel 3.32, aanhef en onder c, van het besluit][ref1] wordt bij buitenopslag van goederen in ieder geval
      voldaan indien:

      a. op de laad- en loskade tot 2 meter uit de kaderand of oever geen opslag van goederen plaatsvindt, of

      b. er een deugdelijke keerwand aanwezig is en er geen product tussen de keerwand en de kade of oever ligt.

      2 Om te voldoen aan [artikel 3.32, aanhef en onder c, van het besluit][ref2] wordt bij het laden en lossen van
      schepen het schoonmaken van grijpers zo uitgevoerd dat overslagresten of spoelwater niet in het oppervlaktewater
      geraken.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.32
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.32
