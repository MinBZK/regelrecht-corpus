      2 Bij het uitvoeren van handelingen als bedoeld in het eerste lid, inzake zwaveldioxide (SO), zuurstof en waterdamp
      kunnen tot [1 april 2019] onderstaande normbladen worden toegepast:

      a. NEN-EN 14 791, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de massaconcentratie aan
      zwaveldioxide – Referentiemethode, november 2005,

      b. NEN-EN 14 789, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de volumeconcentratie
      van zuurstof (O) – Referentiemethode – Paramagnetisme, november 2005, respectievelijk

      c. NEN-EN 14 790, 2005: Europese norm voor Emissies van stationaire bronnen – Bepaling van de waterdamp in
      leidingen, november 2005.

      3 Bij het uitvoeren van handelingen als bedoeld in het eerste lid, inzake totaalstof kunnen tot en met 31 december
      2020 NEN-EN 13284-1, 2001: Europese norm voor Emissies van stationaire bronnen – Bepaling van massaconcentratie
      van stof in lage concentraties – Deel 1: Manuele gravimetrische methode, december 2001 of NEN-EN 13284-2, 2004:
      Europese norm voor Emissies van stationaire bronnen – Bepaling van massaconcentratie van stof in lage concentraties
      – Deel 2: Geautomatiseerde meetsystemen, september 2004 worden toegepast.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.35
  - number: '5.36'
    text: |-
      1 Geautomatiseerde meetsystemen worden ten minste eenmaal per jaar met behulp van parallelmetingen met de
      referentiemeetmethoden, bedoeld in [artikel 5.35][ref1], gecontroleerd.

      2 De drijver van de inrichting informeert het bevoegd gezag over de resultaten van de in het eerste lid bedoelde
      controle.

      3 Het uitvoeren van een periodieke meting, eenmalige metingen of parallelmetingen geschiedt door een rechtspersoon
      die voor deze verrichtingen geaccrediteerd is door een accreditatie-instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.35
