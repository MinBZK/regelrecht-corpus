        artikel: 4.74.2
  - number: 4.84.2
    text: |-
      Aan [artikel 4.74.2, tweede lid, van het besluit][ref1], wordt in ieder geval voldaan indien:

      a. bij het smelten van koper en koperlegeringen, aluminium en aluminiumlegeringen, zink en zinklegeringen, tin en
      tinlegeringen, de legering ten hoogste 2% lood bevat;

      b. bij het smelten van koper en koperlegeringen, aluminium en aluminiumlegeringen, zink en zinklegeringen, tin en
      tinlegeringen, de legering ten hoogste 5% lood bevat en de smeltoven ten hoogste 200 uur in bedrijf is;

      c. bij het smelten van koper en koperlegeringen, aluminium en aluminiumlegeringen, zink en zinklegeringen, tin en
      tinlegeringen, de legering ten hoogste 10% lood bevat en de smeltoven ten hoogste 100 uur in bedrijf is;

      d. de afgezogen emissies van lood die vrijkomen, worden gevoerd door een filtrerende afscheider die in goede
      staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt
      schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74.2
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84.2
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: 4.74.2
  - number: 4.84.3
    text: |-
      Aan [artikel 4.74.3 van het besluit][ref1] wordt in ieder geval voldaan indien de afgezogen emissies die vrijkomen,
      worden gevoerd door een filtrerende afscheider die in goede staat van onderhoud verkeert, periodiek wordt
      gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74.3
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.84.3
    references:
