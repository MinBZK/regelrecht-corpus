      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden bij het coaten, veredelen en lijmen van
      textiel, leer of bont het verwerken van lakken, verdunners en lijmen en het reinigen van spuitapparatuur plaats
      boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel4.104g
  - number: 4.104ga
    text: |-
      1 Bij het lozen van afvalwater afkomstig van het veredelen van textiel wordt ter beperking van het lozen van
      hulpstoffen als bedoeld in [artikel 4.103f van het besluit][ref1] ten minste voldaan aan het tweede tot en met het
      vierde lid.

      2 Degene die een inrichting drijft, stelt gedragsvoorschriften op die zijn gericht op het voorkomen van nadelige
      gevolgen voor het milieu en een doelmatige afvoer van het bedrijfsafvalwater en draagt er zorg voor dat de
      gedragsregels worden nageleefd.

      3 In de gedragsvoorschriften wordt ten minste aangegeven:

      a. wanneer en op welke wijze de controle van installaties en onderdelen van de inrichting plaatsvindt, waarvan de
      werking van invloed kan zijn op het lozen van hulpstoffen;

      b. op welke wijze invulling wordt gegeven aan maatregelen die voortkomen uit de preventieve aanpak;

      c. op welke wijze de oversleep tussen veredelingsbaden wordt beperkt;

      d. op welke wijze te nemen procesgeïntegreerde maatregelen op haalbaarheid worden onderzocht en genomen;

      e. hoe wordt omgegaan met procesafvalwater en hoe dit doelmatig wordt verwerkt.

      4 Het bevoegd gezag kan, indien het belang van de bescherming van het milieu daartoe noodzaakt, bij
      maatwerkvoorschrift eisen stellen aan de invulling van de gedragsvoorschriften als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.103f
