  - number: 3.16fa
    text: |-
      Het energierendement dat een gesloten bodemenergiesysteem behaalt bij de levering van warmte of koude aan een
      bouwwerk, wordt bepaald overeenkomstig de volgende formule:

      waarbij wordt verstaan onder:

      *Q*: de door het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid warmte per jaar in MWh;

      *Q*: de door het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid koude per jaar in MWh;

      *E*: de door het bodemenergiesysteem verbruikte hoeveelheid elektriciteit per jaar in MWh;

      *G*: de door het bodemenergiesysteem verbruikte hoeveelheid gas per jaar in MWh.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.16fa
  - number: 3.16g
    text: |-
      [Artikel 2.11 van het besluit][ref1] is niet van toepassing op het installeren en in werking hebben van een
      gesloten bodemenergiesysteem.


