  - number: '4.118'
    text: |-
      Aan [artikel 4.125, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. de afgezogen stofemissies die vrijkomen bij laboratoriumproeven worden gevoerd door een filtrerende afscheider
      of elektrostatische filterinstallatie die geschikt is om aan [artikel 4.125, eerste lid van het besluit][ref2] te
      voldoen; en

      b. die filtrerende afscheider of elektrostatisch filter in goede staat van onderhoud verkeert, deze periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.


