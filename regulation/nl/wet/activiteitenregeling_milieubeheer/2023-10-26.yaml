  - number: '3.107'
    text: |-
      1 Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies wordt stofklasse
      S dat vrijkomt bij het vervaardigen en bewerken van voedingsmiddelen of dranken als bedoeld in
      [artikel 3.141 van het besluit][ref1] waarbij voedingsmiddelen of grondstoffen daarvan worden gedroogd, gemalen,
      gebrand of geroosterd of waarbij goederen behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen
      emissies die vrijkomen bij het vervaardigen en bewerken van voedingsmiddelen of dranken als bedoeld in
      [artikel 3.141 van het besluit][ref2], waarbij voedingsmiddelen of grondstoffen daarvan worden gedroogd, gemalen,
      gebrand of geroosterd of waarbij goederen behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd en naar de
      buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een
      gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein
      met minder dan één gevoelig gebouw per hectare, is gelegen.

      3 Het bevoegd gezag kan in het belang van de luchtkwaliteit en maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.141
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3.141
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel3.107
