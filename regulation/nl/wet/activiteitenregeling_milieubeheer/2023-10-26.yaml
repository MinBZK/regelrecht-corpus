  - number: 4.84b
    text: |-
      Aan [artikel 4.74b van het besluit][ref1] wordt in ieder geval voldaan indien:

      a. mechanische bewerking van steen plaatsvindt met waterkoeling en de waterstraal of het watergordijn zodanig is
      gedimensioneerd dat geen zichtbare stofvorming optreedt; of

      b. de afgezogen stofemissies die vrijkomen bij mechanische bewerking van steen worden gevoerd door een filtrerende
      afscheider, die geschikt is om aan [artikel 4.74b van het besluit][ref2] te voldoen en in goede staat van onderhoud
      verkeert, periodiek wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en
      vervangen; of

      c. bij mechanische ruimteafzuiging gebruik wordt gemaakt van een waterwand die geschikt is om aan
      [artikel 4.74b van het besluit][ref3] te voldoen en in goede staat van onderhoud verkeert, periodiek wordt
      gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74b
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74b
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4.74b
