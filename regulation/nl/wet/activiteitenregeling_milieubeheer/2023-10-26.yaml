  - number: '5.85'
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt ten aanzien van afstanden van de LPG-afleverinstallatie tot objecten
      binnen de inrichting en eisen ten aanzien van de opstelplaats van de LPG-tankwagen ten minste voldaan aan de
      [artikelen 5.86][ref1] en [5.87][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.86
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5.87
