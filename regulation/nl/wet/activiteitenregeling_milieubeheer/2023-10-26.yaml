  - number: 4.84c
    text: |-
      1 Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, worden gassen en dampen
      die vrijkomen bij:

      a. het aanbrengen van lijmen, harsen en coatings op steen door middel van vernevelen met een nevelspuit,

      b. het aansluitend aan de onder a genoemde activiteiten drogen dan wel uitharden van met vluchtige organische
      stoffen behandelde materialen,

      voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.

      2 Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder, worden de
      overeenkomstig het eerste lid, onderdelen a en b, afgezogen gassen en dampen, indien deze op de buitenlucht worden
      geëmitteerd:

      a. ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen
      afgevoerd; of

      b. geleid door een doelmatige ontgeuringsinstallatie.

      3 Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.

      4 Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het
      slecht functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen gassen en dampen,
      geuremissies die niet via de afzuiging worden afgevoerd of incidentele geurpieken, in aanvulling op het tweede lid,
      overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref1] maatwerkvoorschriften stellen met betrekking tot:

      a. de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het tweede lid;

      b. de situering van de afvoerpijp;

      c. het voorkomen of beperken van diffuse geuremissies; of

      d. het beperken van incidentele geurpieken tot specifieke tijdstippen.

      5 In afwijking van het tweede lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het vierde lid onvoldoende zijn om de overschrijding ongedaan te maken
      overeenkomstig [artikel 2.7a, derde lid, van het besluit][ref2] maatwerkvoorschriften stellen met betrekking tot de
      aanwezigheid van een ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen gassen en dampen.

      6 Ten aanzien van inrichtingen waarvoor tot het tijdstip van het van toepassing worden van het besluit of een
      deel daarvan op een activiteit, op die inrichtingen, een vergunning in werking en onherroepelijk was, dan wel
      voorschriften golden op basis van een van de besluiten, genoemd in [artikel 6.43 van het besluit][ref3], is het
      tweede lid niet van toepassing, voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding
      krachtens [artikel 1.10 van het besluit][ref4] nodig is en voor zover er geen verandering van de inrichting
      plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige gebouwen.

      7 In afwijking van het zesde lid kan het bevoegd gezag maatwerkvoorschriften als bedoeld in het vierde en vijfde
      lid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2.7a
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6.43
      [ref4]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
