        artikel: '5.18'
  - number: '5.24'
    text: |-
      Bij de exploitatie van een afvalverbrandingsinstallatie en een afvalmeeverbrandingsinstallatie wordt gebruik
      gemaakt van een automatisch systeem dat voorkomt dat afvalstoffen worden toegevoerd wanneer uit continue
      metingen blijkt dat een emissiegrenswaarde wordt overschreden als gevolg van storingen of defecten aan de
      afgasreinigingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.24
  - number: '5.25'
    text: |-
      1 Het vervoer en de tussentijdse opslag van verbrandingsresiduen uit een afvalverbrandings- of
      afvalmeeverbrandingsinstallatie geschiedt op een zodanige wijze, dat wordt voorkomen dat de verbrandingsresiduen in
      het milieu terechtkomen.

      2 Voordat de methoden van verwijdering of hergebruik als materiaal van verbrandingsresiduen worden vastgesteld,
      worden passende tests uitgevoerd om na te gaan wat de fysische en chemische eigenschappen en het verontreinigend
      vermogen van de verschillende verbrandingsresiduen zijn. Deze analyse heeft betrekking op de totale oplosbare
      fractie en de oplosbare fractie zware metalen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.25
  - number: '5.26'
    text: |-
      Specifiek ziekenhuisafval wordt rechtstreeks en in hermetisch gesloten verpakking in de oven van een
      afvalverbrandings- of afvalmeeverbrandingsinstallatie geplaatst, zonder voorafgaande vermenging met andere
      categorieën van afvalstoffen overeenkomstig de afvalstoffenlijst.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.26
  - number: '5.27'
    text: |-
      Het beheer van een verbrandingsinstallatie is in handen van een natuurlijke persoon die bekwaam is om de
      verbrandingsinstallatie te beheren.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.27
  - number: '5.28'
    text: |-
      Het terrein van een afvalverbrandings- of afvalmeeverbrandingsinstallatie, met de bijbehorende terreinen voor
      de opslag van afval, wordt zodanig ontworpen en geëxploiteerd dat het ongeoorloofd en accidenteel vrijkomen van
      verontreinigende stoffen in de bodem, het oppervlaktewater of het grondwater wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.28
  - number: '5.29'
    text: |-
      1 Een afvalverbrandings- of afvalmeeverbrandingsinstallatie is voorzien van een vloeistofdicht bassin met voldoende
      capaciteit voor de opvang van:

      a. wegvloeiend verontreinigd hemelwater van het terrein;

      b. verontreinigd water dat het gevolg is van overlopen;

      c. verontreinigd water dat afkomstig is van brandbestrijding.

      2 De capaciteit van het bassin is zodanig dat het water, voordat het wordt geloosd, kan worden onderzocht en
      behandeld.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.29
  - number: '5.30'
    text: |-
      De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage
      van de meting, bedoeld in [artikel 5.38 van het besluit][ref1], voldoet aan de eisen in de
      [artikelen 5.31 tot en met 5.36][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.38
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5.31
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5.38'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5.31'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: '5.31'
    text: |-
      1 Metingen ter bepaling van de emissies zijn representatief.

      2 Alle monitoringresultaten worden op zodanige wijze geregistreerd, verwerkt en gepresenteerd dat het bevoegd gezag
      kan controleren of voldaan wordt aan de toepasselijke emissiegrenswaarden en andere voorschriften.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.31
  - number: '5.32'
    text: |-
      De meting van emissies in de lucht omvat:

      a. een continue meting van de emissieconcentratie van totaal stof afkomstig uit puntbronnen met een massastroom van
      ≥ 200g/uur;

      b. een eenmalige meting van de emissieconcentratie van totaal stof afkomstig uit puntbronnen met een massastroom
      van <200 g/uur;

      c. indien de IPPC-installatie gebruik maakt van het sulfaatproces: een continue meting van de emissieconcentratie
      van gasvormig zwaveldioxide (SO) en zwaveltrioxide (SO) afkomstig van de ontsluiting en roosting uit inrichtingen
      voor de concentratie van afvalzuren;

      d. indien de IPPC-installatie gebruik maakt van het chlorideproces:

      1°. een eenmalige meting van de emissieconcentratie van gasvormig zwaveldioxide en zwaveltrioxide;

      2°. een continue meting van de emissieconcentratie van chloor afkomstig uit de voornaamste bronnen;

      3°. om het jaar een periodieke meting van de emissieconcentratie van zoutzuur.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.32
  - number: '5.33'
    text: |-
      Op het punt waar het afvalwater wordt geloosd worden ten minste om de zes maanden periodieke metingen uitgevoerd
      van een met het debiet evenredige steekproef over een periode van 24 uur van:

      a. onopgeloste bestanddelen;

      b. ijzerverbindingen;

      c. sulfaat, indien de IPPC-installatie gebruik maakt van het sulfaatproces;

      d. chloride, indien de IPPC-installatie gebruik maakt van het chlorideproces;

      e. de zuurgraad (pH).
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.33
  - number: '5.34'
    text: |-
      Jaarlijks voor 1 maart wordt aan het bevoegd gezag opgave gedaan van de productie van titaandioxide over het
      daaraan voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0022830/2023-10-26#Artikel5.34
  - number: '5.35'
    text: |-
      1 De bemonsteringen, analyses en metingen van de parameters die nodig zijn om te bepalen of wordt voldaan aan de
      emissiegrenswaarden alsmede de andere metingen en berekeningen die zijn voorgeschreven, worden uitgevoerd volgens
      onderstaande normbladen:


