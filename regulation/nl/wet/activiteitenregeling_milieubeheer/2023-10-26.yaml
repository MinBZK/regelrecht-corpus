      2 De categorieën van afvalstoffen, bedoeld in [artikel 2.12, vijfde lid, van het besluit][ref3], zijn de
      categorieën in [bijlage 11][ref4].

      3 Onverminderd het tweede lid worden verschillende soorten afvalwater waarvan het lozen bij of krachtens het
      [besluit][ref5] op dezelfde wijze is toegestaan, gerekend tot dezelfde categorie.

      4 Het mengen van gevaarlijke afvalstoffen met niet gevaarlijke afvalstoffen, bedoeld in
