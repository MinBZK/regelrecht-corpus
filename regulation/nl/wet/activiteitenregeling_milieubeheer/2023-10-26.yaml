  - number: 3.27a
    text: |-
      1 Aan [artikel 3.23d, tweede lid, van het besluit][ref1] wordt in ieder geval voldaan indien de
      zuiveringsvoorziening voldoet aan het tweede tot en met vierde lid.

      2 De zuiveringsvoorziening bestaat uit:

      a. zuiveringsmateriaal in een deel van de zuiveringsvoorziening die zodanig is uitgevoerd en zodanig wordt
      onderhouden dat contact van het afvalwater met de bodem wordt voorkomen, en

      b. een bufferopslag en doseereenheid waarmee het afvalwater geleidelijk en gelijkmatig wordt verspreid over
      het oppervlak van het zuiveringsmateriaal en waardoor de capaciteit van de zuiveringsvoorziening niet wordt
      overschreden.

      3 De zuiveringsvoorziening is zodanig gedimensioneerd dat de capaciteit voldoende is voor de behandeling van de
      afvalwaterstroom die jaarlijks vrijkomt. Op verzoek van het bevoegd gezag wordt een berekening van de capaciteit
      van de zuiveringsvoorziening overgelegd.

      4 Indien het afvalwater dat wordt aangeboden aan de zuiveringsvoorziening meer dat 20 milligram olie per liter
      bevat, wordt het afvalwater voorafgaand aan de zuiveringsvoorziening geleid door een olieafscheider en slibvangput
      die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.23d
