  - number: '5.16'
    text: |-
      1 De volgende metingen worden op het punt, genoemd in [artikel 5.15, eerste lid][ref1], uitgevoerd:

      a. continue metingen van de zuurgraad (pH), de temperatuur en het debiet;

      b. dagelijkse steekproefmetingen van de totale hoeveelheid onopgeloste bestanddelen of metingen van een met het
      debiet evenredige representatieve steekproef over een periode van 24 uur;

      c. maandelijkse metingen van een met het debiet evenredige representatieve steekproef over een periode van 24 uur
      van kwik, cadmium, thallium, arseen, lood, chroom, koper, nikkel en zink;

      d. driemaandelijkse metingen van dioxinen en furanen gedurende de eerste bedrijfsperiode van twaalf maanden,
      gevolgd door zesmaandelijkse metingen.

      2 In een geval als bedoeld in [artikel 5.15, derde lid][ref2], verricht degene die de afvalverbrandings- of
      afvalmeeverbrandingsinstallatie drijft de metingen, bedoeld in het eerste lid:

      a. op de afvalwaterstroom van de afgasreinigingsprocessen vóór de uitmonding daarvan op de gezamenlijke
      afvalwaterzuiveringsinstallatie;

      b. op de andere afvalwaterstroom of -stromen vóór de uitmonding daarvan op de gezamenlijke
      afvalwaterzuiveringsinstallatie;

      c. op het punt waar het afvalwater na de zuivering wordt geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5.15
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5.15
