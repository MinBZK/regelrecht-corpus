      1 Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in
      [artikel 3.36, derde lid, van het besluit][ref1]:

      a. verricht een inrichting die overeenkomstig [artikel 3.27f, vijfde lid][ref2], autowrakken opslaat, met
      betrekking tot die autowrakken geen demontagehandelingen of handelingen, waardoor de identiteit of de inhoud van de
      autowrakken niet meer herkenbaar is.

      b. slaat een inrichting die overeenkomstig [artikel 3.27f, vijfde lid][ref3], autowrakken opslaat, niet meer dan:

      1°. 400 autowrakken op, indien de inrichting direct aan de kade is gelegen en de autowrakken via de kade worden
      vervoerd;

      2°. 50 autowrakken op, indien de inrichting niet direct aan een kade is gelegen.

      2 Het bevoegd gezag kan bij maatwerkvoorschrift een tijdelijke verhoging van de aantallen autowrakken, bedoeld in
      het eerste lid, onderdeel b, toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3.36
