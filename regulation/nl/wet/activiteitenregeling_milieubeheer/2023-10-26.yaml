  - number: '3.51'
    text: |-
      Onverminderd [artikel 3.49][ref1] wordt aan de [artikelen 3.38][ref2] en
      [3.32, aanhef en onder a en b, van het besluit][ref3] bij het overslaan van goederen behorend tot:

      a. stuifklasse S1 van [bijlage 3 bij het besluit][ref4] door middel van storttrechters in ieder geval voldaan
      indien de trechters zijn voorzien van een afzuiginrichting;

      b. stuifklasse S2 van [bijlage 3 bij het besluit][ref5] door middel van storttrechters in ieder geval voldaan
      indien de trechters zijn voorzien van een afzuiginrichting, of indien de goederen worden bevochtigd met behulp van
      een doelmatig werkende watersproei-installatie;

      c. stuifklasse S3 van [bijlage 3 bij het besluit][ref6] door middel van storttrechters in ieder geval voldaan
      indien de trechters zijn voorzien van doelmatige windreductieschermen;

      d. stuifklasse S4 van [bijlage 3 bij het besluit][ref7] door middel van storttrechters in ieder geval voldaan
      indien de goederen worden bevochtigd met behulp van een doelmatig werkende watersproei-installatie of indien de
      trechters zijn voorzien van doelmatige windreductieschermen.


