  - number: 3.4l
    text: |-
      1 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R1-techniek dan wel
      conserveringswerkzaamheden worden uitgevoerd waarbij geen stoffen uit categorie B of C worden gebruikt, behoeft,
      onverminderd [artikel 2.1][ref1], een eventueel aanwezige hulpconstructie geen voorzieningen te bevatten ter
      voorkoming van het lozen in een oppervlaktewaterlichaam.

      2 Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R1-, R2- of R3-techniek dan wel
      conserveringswerkzaamheden worden uitgevoerd waarbij geen stoffen uit categorie B of C worden gebruikt, en de
      afstand van het te behandelen deel van het oppervlak tot het wateroppervlak minder dan 50 centimeter bedraagt,
      behoeft, onverminderd [artikel 2.1][ref2], een eventueel aanwezige hulpconstructie geen voorzieningen te bevatten
      ter voorkoming van het lozen in een oppervlaktewaterlichaam.


