  - number: 6.11aa.1
    text: |-
      [Artikel 4.84j, aanhef en onder a][ref1], is niet van toepassing op een inrichting waarvoor onmiddellijk
      voorafgaand aan de inwerkingtreding van dat artikel een vergunning onherroepelijk van kracht was en in die
      vergunning andere bodembeschermende voorzieningen of bodembeschermende maatregelen zijn voorgeschreven waarmee bij
      het aanbrengen van ontkistingsmiddelen een verwaarloosbaar bodemrisico wordt gelopen.


