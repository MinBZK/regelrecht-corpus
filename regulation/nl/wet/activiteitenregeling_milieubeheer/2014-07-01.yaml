        afdeling: '4.1'
  - number: 6.10.3
    text: |-
      Op een stationaire bovengrondse opslagtank met halfzware olie die aanwezig is in een inrichting waar uitsluitend
      of in hoofdzaak agrarische activiteiten worden verricht en die is geïnstalleerd tussen 1 januari 2000 en 1 januari
      2007 is [artikel 4.15][ref1] niet van toepassing tot 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.10
