      [artikel 4.84j, aanhef en onder a][ref1], de voorschriften van de vergunning ten behoeve van het realiseren van
      een verwaarloosbaar bodemrisico bij het op bekisting aanbrengen van ontkistingsmiddelen van toepassing.


