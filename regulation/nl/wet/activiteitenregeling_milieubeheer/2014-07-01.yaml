  - number: 6.5ha.2
    text: |-
      Op een stationaire bovengrondse opslagtank met gasolie of afgewerkte olie die is geïnstalleerd voor 1 januari 2000
      is [artikel 3.71d][ref1] niet van toepassing tot 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5ha
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
  - number: 6.5ha.3
    text: |-
      Op een stationaire bovengrondse opslagtank met gasolie of afgewerkte olie die aanwezig is in een inrichting waar
      uitsluitend of in hoofdzaak agrarische activiteiten worden verricht en die is geïnstalleerd tussen 1 januari 2000
      en 1 januari 2007 is [artikel 3.71d][ref1] niet van toepassing tot 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5ha
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
  - number: 6.5ha.4
    text: |-
      Een opslagtank als bedoeld in het tweede en derde lid met de daarbij behorende leidingen en appendages voldoet tot
      1 januari 2015 aan de voorschriften 4.1.3, 4.2.4, 4.2.5, 4.2.7, 4.2.9, 4.2.10, 4.2.14, 4.3.3, 4.3.4, 4.3.6, 4.3.8,
      4.3.9, 4.3.11, 4.4.1, 4.4.3, 4.4.4, 4.4.7, 4.4.8, 4.5.1, 4.5.3, 4.5.9, 4.5.12 en de voorschriften in paragraaf
      4.6 van PGS 30. In afwijking van voorschrift 4.4.4 van PGS 30 hoeft een stationaire bovengrondse opslagtank met
      afgewerkte olie niet te worden gecontroleerd op de aanwezigheid van water.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5ha
  - number: 6.5ha.5
    text: |-
      [Artikel 3.71d, derde lid][ref1], is niet van toepassing op een bovengrondse opslagtank die is geïnstalleerd voor
      de datum waarop paragraaf 3.4.9 op de inrichting van toepassing werd en die niet op de vloer staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5ha
    references:
