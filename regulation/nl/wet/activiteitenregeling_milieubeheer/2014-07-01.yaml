        bwb_id: BWBR0022762
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '35'
  - number: 3.45.2
    text: |-
      Het eerste lid van [artikel 2.11 van het besluit][ref1] is niet van toepassing op het opslaan van grond en
      baggerspecie als bedoeld in [artikel 35 van het Besluit bodemkwaliteit][ref2], voor zover het opslaan van grond en
      baggerspecie binnen de inrichting vaker dan eenmalig plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '35'
  - number: 3.46.1
    text: |-
      Ten behoeve van het voorkomen dan wel beperken van geurhinder worden opgeslagen bederfelijke afvalstoffen voor
      zover het niet-houtachtige plantenresten betreft binnen 14 dagen na de aanvoer uit de inrichting afgevoerd, of
      verwerkt in een composteringsplaats.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.46
  - number: 3.46.2
    text: |-
      Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overstijgt vanwege de op- en
      overslag van niet-houtachtige plantenresten, maatwerkvoorschriften stellen aan de locatie van de opslag en de
      afvoerfrequentie van de plantenresten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.46
  - number: 3.47.1
    text: |-
      Aan [artikel 3.32, aanhef en onder a en b, van het besluit][ref1] wordt bij de buitenopslag van goederen behorend
      tot de stuifklasse S2 van bijlage 4.6 van de NeR in ieder geval voldaan indien de stoffen door besproeiing vochtig
      worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.47.2
    text: |-
      Aan [artikel 3.38, tweede lid, van het besluit][ref1] wordt bij opslag van goederen behorend tot de stuifklasse
      S1 en S2 van bijlage 4.6 van de NeR in ieder geval voldaan indien afgezogen lucht door een filtrerende afscheider
      wordt gevoerd die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede
      werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.48.1
    text: |-
      Aan [artikel 3.38, tweede lid, van het besluit][ref1] wordt bij het mengen van goederen behorend tot de
      stuifklassen S1, S2, S3 of S4 van bijlage 4.6 van de NeR in een gesloten ruimte in ieder geval voldaan indien de
      ruimte op onderdruk wordt gehouden en de afgezogen lucht door een filtrerende afscheider wordt gevoerd die in goede
      staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt
      schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.48.2
    text: |-
      Aan [artikel 3.32, aanhef en onder a en b, van het besluit][ref1] wordt bij het mengen van goederen behorend tot de
      stuifklasse S2 en S4 van bijlage 4.6 van de NeR in de buitenlucht in ieder geval voldaan indien bij het opbouwen en
      afgraven van een menghoop deze goederen worden bevochtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.49.1
    text: |-
      Aan [artikel 3.32, aanhef en onder a en b, van het besluit][ref1] wordt bij overslag van stuifgevoelige goederen in
      ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
