      wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.56
  - number: 4.57.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden stof en rook die
      vrijkomen bij het solderen van metalen, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.57
  - number: 4.57.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht worden voor zover het afgezogen emissies
      betreft, die vrijkomen bij het solderen van metalen, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog
      gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw
      op een gezoneerd industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare,
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.57
  - number: 4.57.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.57
  - number: '4.58'
    text: |-
      Aan de [artikelen 4.44, eerste lid][ref1], en [4.45 van het besluit][ref2] wordt in ieder geval voldaan indien:


