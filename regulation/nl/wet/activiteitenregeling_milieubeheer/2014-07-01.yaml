  - number: 3.4k.1
    text: |-
      Als stoffen als bedoeld in [artikel 3.6a, tweede lid, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.4k.1.a
    text: stoffen uit categorie A;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.1.b
    text: stoffen uit categorie B;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.1.c
    text: stoffen uit categorie C.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2
    text: 'Als stoffen uit categorie A worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2.a
    text: basalt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2.b
    text: beton en betonmortel;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2.c
    text: schoonmetselwerk;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2.d
    text: cementgebonden deklagen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2.e
    text: niet verduurzaamd hout;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2.f
    text: steenachtige ondergronden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.2.g
    text: metallische ondergronden met uitzondering van zink, tin, koper of legeringen van die metalen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.3
    text: 'Als stoffen uit categorie C worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.3.a
    text: koolteer of koolteerderivaten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.3.b
    text: lood- of chromaathoudende pigmenten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.3.c
    text: antifoulings;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.3.d
    text: andere verven op basis van cadmium, tin of kwik dan genoemd in de onderdelen a tot en met c van dit lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4k.4
    text: Als stoffen uit categorie B worden aangemerkt stoffen die niet zijn aangemerkt als stoffen uit categorie A of C.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4k
  - number: 3.4l.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R1-techniek dan wel conserveringswerkzaamheden
      worden uitgevoerd waarbij geen stoffen uit categorie B of C worden gebruikt, behoeft, onverminderd
      [artikel 2.1][ref1], een eventueel aanwezige hulpconstructie geen voorzieningen te bevatten ter voorkoming van het
      lozen in een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4l
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 3.4l.2
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R1-, R2- of R3-techniek dan wel
      conserveringswerkzaamheden worden uitgevoerd waarbij geen stoffen uit categorie B of C worden gebruikt, en de
      afstand van het te behandelen deel van het oppervlak tot het wateroppervlak minder dan 50 centimeter bedraagt,
      behoeft, onverminderd [artikel 2.1][ref1], een eventueel aanwezige hulpconstructie geen voorzieningen te bevatten
      ter voorkoming van het lozen in een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4l
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 3.4m.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R2-techniek dan wel conserveringswerkzaamheden
      worden uitgevoerd met behulp van een C1-techniek waarbij een stof uit categorie B wordt gebruikt, worden die
      werkzaamheden uitgevoerd boven een hulpconstructie waarvan de vloer stofdicht is, is voorzien van opstaande
      randen met een hoogte van ten minste 20 centimeter en voor zover mogelijk aan alle zijden uitsteekt buiten het te
      behandelen object.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4m
  - number: 3.4m.2
    text: |-
      Indien conserveringswerkzaamheden worden uitgevoerd met behulp van een C1-techniek waarbij een stof uit categorie
      C wordt gebruikt en bij een windsnelheid hoger dan 8 meter per seconde, wordt de hulpconstructie als bedoeld in
      het eerste lid ten minste uitgebreid met zijwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 bij 0,4
      millimeter of zeilen, die aansluiten op de vloer en minimaal 1 meter boven het te behandelen deel van het object
      uitsteken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4m
  - number: 3.4n.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij een stof uit categorie A
      vrijkomt wordt in aanvulling op de maatregelen bedoeld in [artikel 3.4m, tweede lid][ref1], de hulpconstructie ook
      aan de bovenzijde afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4n
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.4n.2
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij een metallisch
      straalmiddel wordt gebruikt en een stof uit categorie B vrijkomt, worden de zijwanden en bovenafsluiting van de
      hulpconstructie als bedoeld in het eerste lid winddicht uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4n
  - number: 3.4n.3
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek waarbij smeltslakgrit of een
      mineraal straalmiddel wordt gebruikt en een stof uit categorie B vrijkomt dan wel waarbij metallisch straalmiddel
      wordt gebruikt en een stof uit categorie C vrijkomt, wordt in aanvulling op het tweede lid tijdens de werkzaamheden
      gezorgd voor een permanente onderdruk in de hulpconstructie. In de daarbij geëmitteerde lucht mag het stofgehalte
      niet meer bedragen dan 10 mg/Nm3, bepaald volgens NEN/ISO 9096.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4n
  - number: 3.4n.4
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R3-techniek, waarbij smeltslakgrit of een
      mineraal straalmiddel wordt gebruikt en een stof uit categorie C vrijkomt dan wel conserveringswerkzaamheden
      die worden uitgevoerd met behulp van een C3-techniek, waarbij een stof uit categorie C wordt gebruikt, worden
      in aanvulling op het derde lid, de zijwanden en bovenzijde van de hulpconstructie als bedoeld in het derde lid,
      stofdicht uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4n
  - number: 3.4o.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R4-techniek wordt de vloer van de
      hulpconstructie als bedoeld in [artikel 3.4m, eerste lid][ref1] vloeistofdicht uitgevoerd en wordt de
      hulpconstructie uitgebreid met zijwanden van gaasnetten met een maaswijdte van ten hoogste 0,4 bij 0,4 millimeter,
      die aansluiten op de vloer en minimaal 1 meter boven het te behandelen deel van het object uitsteken.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4o
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.4o.2
    text: |-
      Bij het lozen van de in de hulpconstructie opgevangen vloeistof bedraagt het gehalte aan onopgeloste bestanddelen
      niet meer dan 50 milligram per liter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4o
  - number: 3.4p.1
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij een stof uit categorie A
      vrijkomt is [artikel 3.4o][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4p
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.4p.2
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij smeltslakgrit of mineraal
      straalmiddel wordt gebruikt, wordt de hulpconstructie als bedoeld in [artikel 3.4o][ref1] ook aan de bovenzijde
      afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4p
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.4p.3
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek, waarbij een stof uit categorie
      B vrijkomt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C2-techniek waarbij een stof uit
      categorie B wordt gebruikt, worden de zijwanden en de bovenzijde als bedoeld in het tweede lid, vloeistofdicht
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4p
  - number: 3.4p.4
    text: |-
      Indien reinigingswerkzaamheden worden uitgevoerd met behulp van een R5-techniek waarbij een stof uit categorie
      C vrijkomt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C2-techniek waarbij een stof uit
      categorie C wordt gebruikt of conserveringswerkzaamheden worden uitgevoerd met behulp van een C3-techniek waarbij
      een stof uit categorie B wordt gebruikt, wordt in aanvulling op het derde lid tijdens de werkzaamheden gezorgd voor
      een permanente onderdruk in de hulpconstructie. In de daarbij geëmitteerde lucht bedraagt het stofgehalte niet meer
      dan 10 mg/Nm3, bepaald volgens NEN/ISO 9096.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4p
  - number: 3.4q
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan spoorbruggen, bevat de
      hulpconstructie in afwijking van de [artikelen 3.4l tot en met 3.4p][ref1] aan de bovenzijde geen hulpconstructie
      en aan de in- en uitrijrichting geen zijwand en lopen de zijwanden maximaal twee meter boven het te behandelen deel
      van het object door.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4q
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.4r
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan vaste objecten die
      direct in contact staan met een oppervlaktewaterlichaam, omsluit de hulpconstructie in afwijking van de
      [artikelen 3.4l tot en met 3.4p][ref1] de ruimte waarin wordt gewerkt zoveel mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4r
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.4s
    text: |-
      Indien reinigingswerkzaamheden of conserveringswerkzaamheden worden uitgevoerd aan een vast object dat door
      het aanbrengen van een hulpconstructie beperkt stabiel wordt, omsluit de hulpconstructie in afwijking van de
      [artikelen 3.4l tot en met 3.4p][ref1] de ruimte waarin wordt gewerkt zoveel mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4s
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.5.1
    text: |-
      Aan de [artikelen 3.10][ref1] en [3.10a van het besluit][ref2] wordt voor zover het betreft de uitstoot van
      totaal stof bij de verbranding van brandstof in vloeibare vorm in ieder geval voldaan indien het asgehalte van de
      brandstof in massaprocent lager is dan de toepasselijke emissie-eis gedeeld door 800 en door middel van een keuring
      als bedoeld in [artikel 3.7m][ref3] kan worden aangetoond dat de concentratie van koolstof-monoxide (CO) in het
      rookgas lager ligt dan 100 mg/Nm3.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.5.2
    text: |-
      Aan de [artikelen 3.10a][ref1] en [3.10b van het besluit][ref2] wordt voor zover het betreft de uitstoot van totaal
      stof bij de verbranding van hout, in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.5.2.a
    text: |-
      de afgezogen stofemissies die vrijkomen worden gevoerd door een elektrostatische E-filter waarvan door middel
      van een rapport van de leverancier kan worden aangetoond dat aan de emissie-eisen in [artikel 3.10a][ref1] of
      [3.10b van het besluit][ref2] kan worden voldaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.5.2.b
    text: |-
      de elektrostatische E-filter in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Aan de [artikelen 3.10a][ref1] en [3.10b van het besluit][ref2] wordt voor zover het betreft de uitstoot van
      stikstofoxiden (NO) bij de verbranding van hout, in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.5.3.a
    text: |-
      de inrichtinghouder een meetrapport van de leverancier kan overleggen waaruit blijkt dat aan de in
      [artikel 3.10a][ref1] of [3.10b][ref2] opgenomen emissiegrenswaarden van het besluit kan worden voldaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.5.3.b
    text: in de ketelinstallatie het houttype wordt gestookt waarop het onder a bedoelde rapport is betrokken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Een meting als bedoeld in [artikel 3.10j van het besluit][ref1] voldoet aan de eisen in de
      [artikelen 3.7 tot en met 3.7j][ref2] en de [artikelen 3.7o][ref3] en [3.7p][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.6.2
    text: |-
      Ten behoeve van het doelmatige beheer van afvalwater, bedoeld in [artikel 3.10k van het besluit][ref1] voldoet het
      spuien van een stoomketel aan [artikel 3.7k][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.6.3
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.10o van het besluit][ref1] voldoet een stookinstallatie aan [artikel 3.7l][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.6.4
    text: |-
      Ten behoeve van keuring van en onderhoud op veilig functioneren, optimale verbranding en energiezuinigheid van
      een stookinstallatie als bedoeld in [artikel 3.10p van het besluit][ref1], voldoet een stookinstallatie aan de
      [artikelen 3.7m tot en met 3.7p][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.6.5
    text: |-
      Het eerste lid is niet van toepassing op de uitstoot van totaal stof, stikstofoxiden (NO) of koolmonoxiden (CO),
      indien voldaan wordt aan [artikel 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7.1
    text: |-
      De concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof en onverbrande koolwaterstoffen (CH,
      uitgedrukt in C) in het rookgas worden bepaald door continue of afzonderlijke meting.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7
  - number: 3.7.2
    text: |-
      In afwijking van het eerste lid, wordt de concentratie aan stikstofoxiden (NO) in het rookgas bepaald door continue
      meting, indien ter bestrijding van de uitworp van stikstofoxiden (NO) met rookgasinjectie van water of stoom, een
      inert materiaal dan wel ammoniak of ureum wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7
  - number: 3.7.3
    text: |-
      In afwijking van het tweede lid mag worden volstaan met afzonderlijke meting indien een logboek wordt bijgehouden
      waarin de hoeveelheid geïnjecteerde stoom of water, de hoeveelheid toegepast inert materiaal of de hoeveelheid
      toegevoegde ammoniak of ureum gedurende een kalenderjaar wordt bijgehouden en de betreffende emissiegrenswaarden
      niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7
  - number: 3.7.4
    text: |-
      De concentraties van stoffen waarvoor emissiegrenswaarden zijn vastgesteld worden voor een vervangende
      stookinstallatie als bedoeld in [artikel 3.10h van het besluit][ref1] binnen vier weken na de inbedrijfstelling
      van die vervangende installatie bepaald door middel van een afzonderlijke meting.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.7a.1
    text: |-
      Onverminderd [artikel 3.7][ref1] wordt voor het bepalen van de concentraties stoffen in het rookgas,
      representatieve metingen verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7a.2
    text: |-
      De bemonsteringen, analyses en metingen van de parameters die nodig zijn voor het bepalen van het voldoen aan de
      emissiegrenswaarden alsmede de andere metingen en berekeningen die zijn voorgeschreven, worden uitgevoerd volgens
      onderstaande normbladen:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.2.a
    text: 'emissiemeting:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.2.a.1°
    text: 'stikstofoxiden (NO): NEN-EN 14792;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.2.a.2°
    text: 'zwaveldioxide (SO): NEN-EN 14791;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.2.a.3°
    text: 'onverbrande koolwaterstoffen (CH): NEN-EN 12619;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.2.a.4°
    text: 'totaal stof: NEN-EN 13284-1 of NEN-EN 13284-2;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.2.a.5°
    text: 'zuurstof (O): NEN-EN 14789.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.2.b
    text: 'monstername betreffende de onder a genoemde stoffen: NEN-EN 15259.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.3
    text: |-
      Bij toepassing van de normbladen, bedoeld in het tweede lid, onder a, worden de regels voor de meetlocatie, bedoeld
      in NEN-EN 15259 toegepast.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.4
    text: |-
      Met de normbladen, bedoeld in het tweede lid, worden gelijkgesteld normbladen die worden gesteld in een andere
      lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en die een beschermingsniveau
      waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.5
    text: |-
      Het uitvoeren van afzonderlijke metingen, parallelmetingen en referentiemetingen geschiedt door een instantie die
      is geaccrediteerd door een accreditatie-instantie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7a.6
    text: |-
      In afwijking van het tweede en vijfde lid, mag een afzonderlijke meting ook worden uitgevoerd door een bedrijf
      dat beschikt over een geldig certificaat dat is afgegeven door een instantie die is geaccrediteerd door een
      accreditatie-instantie teneinde uitvoering te kunnen geven aan de van de ‘Certificatieregeling voor inspectie
      en onderhoud stookinstallaties’ onderdeel uitmakende «Beoordelingrichtlijn voor het uitvoeren van onderhoud en
      inspecties aan stookinstallaties, Scope 6» van de Stichting Certificatie Inspectie en Onderhoud Stookinstallaties,
      mits hij die meting uitvoert overeenkomstig Scope 6.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7a
  - number: 3.7b.1
    text: |-
      Indien de concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof of onverbrande koolwaterstoffen
      (CH, uitgedrukt in C) afzonderlijk wordt gemeten, wordt zodra een emissiegrenswaarde van toepassing is geworden,
      binnen vier weken nadien een afzonderlijke meting verricht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7b
  - number: 3.7b.2
    text: |-
      Indien de concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), totaal stof of onverbrande koolwaterstoffen
      (CH, uitgedrukt in C) bij een gasturbine, een gasmotor of een dieselmotor afzonderlijk worden gemeten, wordt in
      aanvulling op het eerste lid, om de vier jaar een nieuwe afzonderlijke meting verricht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7b
  - number: 3.7b.3
    text: |-
      Indien door het veranderen van brandstof andere emissiegrenswaarden van toepassing worden, wordt binnen vier weken
      nadien een nieuwe afzonderlijke meting verricht. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7b
  - number: 3.7c.1
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 3.7b][ref1] bestaat uit drie deelmetingen van ten minste vijftien
      minuten en ten hoogste dertig minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7c
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7c.2
    text: |-
      Indien geen van de deelmetingen, bedoeld in het eerste lid, de desbetreffende emissiegrenswaarde overschrijdt,
      wordt aan die emissiegrenswaarde voldaan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7c
  - number: 3.7c.3
    text: |-
      Indien één van de deelmetingen, bedoeld in het eerste lid, aangeeft dat een emissiegrenswaarde wordt overschreden,
      wordt de afzonderlijke meting herhaald binnen drie maanden na de laatste deelmeting van de afzonderlijke meting,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7c
  - number: 3.7c.4
    text: |-
      Indien één van de deelmetingen van de afzonderlijke meting, bedoeld in het derde lid, aangeeft dat de
      emissiegrenswaarde die aanleiding was voor de herhaalde afzonderlijke meting, wederom wordt overschreden, treft
      de drijver van de inrichting zodanige voorzieningen aan de stookinstallatie, dat verdere overschrijding van die
      emissiegrenswaarde wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7c
  - number: 3.7d.1
    text: |-
      Bij een afzonderlijke meting als bedoeld in [artikel 3.7b][ref1] mag van een meting een door een onafhankelijke en
      deskundige meetinstantie aangetoond 95%-betrouwbaarheidsinterval worden afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7d
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7d.2
    text: |-
      De waarde van het 95%-betrouwbaarheidsinterval, bedoeld in het eerste lid, is niet groter dan de volgende
      percentages van de emissiegrenswaarde voor:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7d
  - number: 3.7d.2.a
    text: 'zwaveldioxide (SO): 20;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7d
  - number: 3.7d.2.b
    text: 'stikstofoxiden (NO): 20;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7d
  - number: 3.7d.2.c
    text: 'totaal stof: 30; en'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7d
  - number: 3.7d.2.d
    text: 'onverbrande koolwaterstoffen (CH, uitgedrukt in C): 20.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7d
  - number: 3.7e.1
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 3.7b][ref1] bij een ketelinstallatie wordt verricht bij
      een belasting van meer dan 60 procent. Een afzonderlijke meting als bedoeld in [artikel 3.7a][ref2] bij een
      dieselmotor, een gasmotor of een gasturbine, wordt verricht bij de hoogste belasting, waarbij deze continu kan
      worden bedreven.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7e
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7e.2
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 3.7a][ref1] bij een gasturbine, met een bijbehorende
      ketelinstallatie, wordt verricht bij een bijstook van ten hoogste 10% in de bijbehorende ketelinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7e
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7e.3
    text: |-
      Onder belasting wordt in deze bepaling verstaan het deel van het thermische vermogen waarbij de stookinstallatie
      daadwerkelijk wordt bedreven.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7e
  - number: 3.7f.1
    text: |-
      Continue meting voor de bepaling van de concentratie van zwaveldioxide (SO), stikstofoxiden (NO), totaal stof of
      onverbrande koolwaterstoffen (CH, uitgedrukt in C) vindt plaats door:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7f
  - number: 3.7f.1.a
    text: rechtstreekse continue meting van de concentratie in het rookgas, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7f
  - number: 3.7f.1.b
    text: continue meting van de parameters van de voor een stookinstallatie vastgestelde uitworpkarakteristiek.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7f
  - number: 3.7f.2
    text: |-
      De kwaliteitsborging van de ter controle van de emissiegrenswaarden geïnstalleerde apparatuur en toegepaste
      uitworpkarakteristieken voldoen aan NEN-EN 14181, waarbij de kalibratie eens per vijf jaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7f
  - number: 3.7f.3
    text: |-
      Met het normblad, bedoeld in het tweede lid, worden gelijkgesteld normdocumenten die worden gesteld in een andere
      lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en die een beschermingsniveau
      waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7f
  - number: 3.7g
    text: |-
      Bij een continue meting als bedoeld in [artikel 3.7f][ref1] wordt aan een emissiegrenswaarde voldaan indien 100
      procent van de daggemiddelden die emissiegrenswaarde niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7g
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.7h.1
    text: |-
      Indien de concentraties aan stikstofoxiden (NO), zwaveldioxide (SO), onverbrande koolwaterstoffen (CH, uitgedrukt
      in C) of totaal stof continu worden gemeten, wordt de uitworp tijdens het opstarten en stilleggen van de
      stookinstallatie niet meegerekend bij het bepalen of aan de desbetreffende emissiegrenswaarde wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7h
  - number: 3.7h.2
    text: |-
      Indien de concentratie aan stikstofoxiden (NO), zwaveldioxide (SO), onverbrande koolwaterstoffen (CH, uitgedrukt
      in C) of totaal stof continu wordt gemeten en de stookinstallatie is uitgerust met nageschakelde apparatuur die is
      bedoeld voor het verminderen van de emissie van de genoemde stoffen, wordt de uitworp tijdens perioden als bedoeld
      in [artikel 3.10g van het besluit][ref1], niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7h
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.7i.1
    text: |-
      De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden worden
      berekend die getoetst worden aan een emissiegrenswaarde, is bij continue metingen niet groter dan de volgende
      percentages van de emissiegrenswaarde:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7i
  - number: 3.7i.1.a
    text: 'zwaveldioxide (SO): 20;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7i
  - number: 3.7i.1.b
    text: 'stikstofoxiden (NO): 20;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7i
  - number: 3.7i.1.c
    text: 'totaal stof: 30; en'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7i
  - number: 3.7i.1.d
    text: 'onverbrande koolwaterstoffen (CH, uitgedrukt in C): 20.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7i
  - number: 3.7i.2
    text: |-
      Bij continue metingen vindt toetsing aan de emissiegrenswaarden plaats op basis van het gemiddelde van de
      individuele waarnemingen, na aftrek van de waarde van het in het eerste lid bedoelde betrouwbaarheidsinterval.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7i
  - number: 3.7i.3
    text: |-
      Indien in een dag meer dan drie uurgemiddelden ongeldig zijn wegens storing of onderhoud van het continu werkende
      meetsysteem, worden de metingen van die dag als ongeldig beschouwd. Indien in enig kalenderjaar de metingen van
      meer dan tien dagen ongeldig zijn, treft degene die de inrichting drijft passende maatregelen om de betrouwbaarheid
      van het continu werkende meetsysteem te verbeteren.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7i
  - number: 3.7j
    text: |-
      Indien de emissie-eis is uitgedrukt bij ISO-luchtcondities worden gemeten emissies van stikstofoxiden (No) herleid
      volgens de volgende formule: E = Em * √(101,3/Pm) * (Tm/288) -1,53 * e19(Xm – 0,0063) waarbij wordt verstaan onder:
      E = emissie van stikstofoxiden herleid naar ISO-luchtcondities; Em = gemeten emissie van stikstofoxiden; Pm =
      gemeten atmosferische druk bij de inlaat van de compressor (kPa); Tm = temperatuur van de inlaatlucht (Kelvin); Xm
      = gemeten vochtgehalte van de inlaatlucht (in kg water per kg droge lucht).
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7j
  - number: 3.7k.1
    text: |-
      Bij het spuien van een stoomketel van een stookinstallatie zijn ten minste de spuitank dan wel de andere geschikte
      voorziening en de leidingen waardoor het spuiwater wordt geleid bestand tegen de inwerking van het spuiwater.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7k
  - number: 3.7k.2
    text: |-
      De spuitank, bedoeld in het eerste lid, is voorzien van een ontluchtingsleiding, die zodanig is bemeten, dat het
      bezwijken van de spuiketel door overdruk in de spuitank tijdens het spuien wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7k
  - number: 3.7l
    text: |-
      Het vullen en het legen van een stookinstallatie met vloeibare brandstof vindt plaats boven een bodembeschermende
      voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7l
  - number: 3.7m.1
    text: 'Een niet-gasgestookte stookinstallatie met een nominaal vermogen van:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7m
  - number: 3.7m.1.a
    text: |-
      20 kilowatt tot ten hoogste 100 kilowatt, wordt ten minste eenmaal per vier jaar gekeurd op veilig functioneren,
      optimale verbranding en energiezuinigheid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7m
  - number: 3.7m.1.b
    text: |-
      meer dan 100 kilowatt, wordt ten minste eenmaal per twee jaar gekeurd op veilig functioneren, optimale verbranding
      en energiezuinigheid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7m
  - number: 3.7m.2
    text: |-
      Een gasgestookte stookinstallatie met een nominaal vermogen van meer dan 100 kilowatt wordt ten minste eenmaal per
      vier jaar gekeurd op veilig functioneren, optimale verbranding en energiezuinigheid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7m
  - number: 3.7m.3
    text: |-
      Een keuring als bedoeld in het eerste of tweede lid omvat mede de afstelling voor de verbranding, het systeem voor
      de toevoer van brandstof en verbrandingslucht en de afvoer van verbrandingsgassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7m
  - number: 3.7m.4
    text: |-
      Een keuring als bedoeld in het eerste of tweede lid wordt verricht door een bedrijf dat beschikt over een geldig
      certificaat dat is afgegeven door een instantie die door een accreditatie-instantie is geaccrediteerd teneinde
      uitvoering te kunnen geven aan de van de ‘Certificatieregeling voor inspectie en onderhoud stookinstallaties’
      onderdeel uitmakende «Beoordelingrichtlijn voor het uitvoeren van onderhoud en inspecties aan stookinstallaties»
      van de Stichting Certificatie Inspectie en Onderhoud Stookinstallaties. Degene die de inrichting drijft vraagt van
      degene die een keuring verricht een door hem opgesteld en ondertekend verslag van die keuring, waaruit ten minste
      blijkt wanneer en door wie de keuring is verricht en de resultaten van de keuring.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7m
  - number: 3.7m.5
    text: |-
      Indien uit een keuring als bedoeld in het eerste of tweede lid blijkt dat de stookinstallatie onderhoud behoeft,
      vindt dat onderhoud binnen twee weken na de keuring plaats. Degene die de inrichting drijft vraagt van degene die
      het onderhoud verricht aan de stookinstallatie een door hem ondertekend bewijs waaruit blijkt wanneer, door wie en
      welk onderhoud is verricht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7m
  - number: 3.7n.1
    text: |-
      De drijver van inrichting onderhoudt de ter controle van de emissiegrenswaarden geïnstalleerde apparatuur zodanig
      dat de goede werking van de apparatuur is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7n
  - number: 3.7n.2
    text: 'Indien zich een storing voordoet in de apparatuur, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7n
  - number: 3.7n.2.a
    text: neemt de drijver van de inrichting onverwijld de nodige maatregelen tot opheffing van die storing, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7n
  - number: 3.7n.2.b
    text: |-
      brengt hij geen wijzigingen aan in het gebruik van de stookinstallatie, die een substantiële stijging van de
      uitworp van de te meten stof met zich kan brengen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7n
  - number: 3.7o
    text: Van een meting of monstername als bedoeld in deze afdeling wordt een rapport gemaakt volgens NEN-EN 15259.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7o
  - number: 3.7p.1
    text: |-
      De resultaten van de laatstelijk uitgevoerde metingen en andere gegevens, die nodig zijn om te kunnen beoordelen of
      in overeenstemming met het besluit of deze regeling wordt gehandeld, worden door degene die de inrichting drijft in
      de inrichting ter beschikking gehouden ten behoeve van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7p
  - number: 3.7p.2
    text: |-
      Het laatstelijk verstrekte verslag van een keuring en het laatstelijk verstrekte bewijs van verricht onderhoud,
      bedoeld in [artikel 3.7m, vierde en vijfde lid][ref1], worden door degene die de inrichting drijft in de
      inrichting ter beschikking gehouden ten behoeve van het bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.7p
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: '3.8'
    text: |-
      Deze paragraaf is van toepassing op het in werking hebben van een installatie voor het reduceren van aardgasdruk,
      meten en regelen van aardgashoeveelheid of aardgaskwaliteit als bedoeld in [artikel 3.11 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: '3.9'
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt de uitvoering, opstelling en onderhoud van de technische installatie voor het
      reduceren van aardgasdruk, meten en regelen van aardgashoeveelheid of aardgaskwaliteit uitgevoerd overeenkomstig
      de voorschriften 7.1 tot en met 7.3.2, 8.1 tot en met 8.8.2, 9.1 tot en met 9.4 en voorschrift 11.3 van NEN 1059 of
      daaraan gelijkwaardig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet de opslag van tetrahydrothiofeen in bovengrondse opslagtanks of condensaat
      in ondergrondse opslagtanks behorende bij een inrichting waar aardgasdruk wordt gereduceerd of aardgashoeveelheid
      wordt gemeten ten minste aan de richtlijn tankinstallaties (PBV Rapport P 107776 2004-01-12) of gelijkwaardig
      hieraan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Een opgestelde Risico Inventarisatie en -evaluatie overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een persoon of instelling, die daartoe beschikt over
      een erkenning op grond van dat besluit, waarin is aangetoond dat de installatie aan deze richtlijn voldoet en
      een verklaring van een geaccrediteerde certificatie-instelling dat het non-standaard-deel van de installatie is
      uitgevoerd overeenkomstig de Risico Inventarisatie en -evaluatie wordt binnen drie maanden na installatie aan het
      bevoegd gezag overlegd. In geval van relevante wijzigingen wordt deze procedure herhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: '3.11'
    text: |-
      Deze paragraaf is van toepassing op windturbines als bedoeld in [artikel 3.13 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.12.1
    text: |-
      Ten behoeve van het voorkomen of beperken van slagschaduw en lichtschittering is de windturbine voorzien van
      een automatische stilstandvoorziening die de windturbine afschakelt indien slagschaduw optreedt ter plaatse van
      gevoelige objecten voorzover de afstand tussen de windturbine en de gevoelige objecten minder dan 12 maal de
      rotordiameter bedraagt en gemiddeld meer dan 17 dagen per jaar gedurende meer dan 20 minuten per dag slagschaduw
      kan optreden en voorzover zich in de door de slagschaduw getroffen uitwendige scheidingsconstructie van gevoelige
      gebouwen of woonwagens ramen bevinden. De afstand geldt van een punt op ashoogte van de windturbine tot de gevel
      van het gevoelige object.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Het bevoegd gezag kan met betrekking tot het in werking hebben van een windturbine aanvullend maatwerkvoorschriften
      stellen ten behoeve van het voorkomen of beperken van hinder door slagschaduw indien het eerste lid in een
      specifiek geval niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Ten behoeve van het voorkomen of beperken van slagschaduw en lichtschittering wordt lichtschittering bij het in
      werking hebben van een windturbine zoveel mogelijk voorkomen of beperkt door toepassing van niet reflecterende
      materialen of coatinglagen op de betreffende onderdelen. Het meten van reflectiewaarden vindt plaats overeenkomstig
      NEN-EN-ISO 2813 of een daaraan ten minste gelijkwaardige meetmethode.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.13
  - number: 3.13.2
    text: |-
      Het bevoegd gezag kan met betrekking tot het in werking hebben van een windturbine aanvullend maatwerkvoorschriften
      stellen ten behoeve van het voorkomen of beperken van hinder door lichtschittering indien het eerste lid in een
      specifiek geval niet toereikend is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet een windturbine aan de veiligheidseisen opgenomen in:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14
  - number: 3.14.1.a
    text: NEN-EN-IEC 61400-2;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14
  - number: 3.14.1.b
    text: NVN 11400-0.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Aan het eerste lid wordt voldaan indien voor de windturbine een certificaat is afgegeven door een certificerende
      instantie waaruit blijkt dat de windturbine voldoet aan deze regels. De certificerende instantie is geaccrediteerd
      voor het afgeven van certificaten, overeenkomstig de normen bedoeld in het eerste lid bij de Raad voor Accreditatie
      of bij een accrediterende instantie die erkend is door een andere staat, aangesloten bij de Multilateral Agreement
      on European Accreditation of Certification.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14
  - number: 3.14a
    text: |-
      Het rapport van een akoestisch onderzoek, bedoeld in [artikel 1.11, derde lid, van het besluit][ref1], bevat de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
  - number: 3.14a.a
    text: de naam van de opdrachtgever van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.b
    text: de naam van de instantie die het onderzoek heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.c
    text: de datum van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.d
    text: de aanleiding en het doel van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.e
    text: |-
      de gegevens waarmee wordt aangetoond dat de betreffende situatie valt binnen het toepassingsbereik van de gebruikte
      methode;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.f
    text: |-
      indien een andere methode dan die is opgenomen in deze regeling wordt gebruikt, wordt de noodzaak daarvan
      aangegeven en wordt de toegepaste methode beschreven en verantwoord;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.g
    text: |-
      indien een rekenmethode wordt toegepast, alle ingevoerde gegevens en tevens de geraadpleegde
      windfrequentiegegevens;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.h
    text: |-
      een of meer kaarten of tekeningen op een zodanige schaal dat een duidelijk beeld wordt gegeven van bestaande
      of voorgenomen windturbines en van gevoelige gebouwen of gevoelige terreinen waarop het akoestisch onderzoek
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.i
    text: de waarneempunten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.j
    text: |-
      de situering, akoestisch relevante dimensies en de aard van de doorgerekende geluidsbeperkende of afschermende
      maatregelen, zowel op oorspronkelijk kaartmateriaal als in de vorm van de geschematiseerde computerinvoer;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.k
    text: |-
      de situering, akoestisch relevante dimensies en de aard van de overige geluidsreflecterende en -afschermende
      objecten of constructies;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.l
    text: |-
      de scheidingslijn of scheidingslijnen tussen akoestisch harde en zachte bodemvlakken, met een aanduiding van de
      aard van de bodem;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.m
    text: |-
      in akoestisch gecompliceerde situaties, een grafische weergave van de bij de berekeningen gehanteerde geometrische
      invoergegevens;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14a.n
    text: |-
      de bestaande en toekomstige geluidsbelastingen vanwege een windturbine of een combinatie van windturbines van de
      gevel van een gevoelig object of van de grens van een gevoelig terrein voor de situatie waarin geen maatregelen
      zijn genomen ter vermindering van de geluidsemissie of ter beperking van de geluidsoverdracht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14a
  - number: 3.14b.1
    text: |-
      Ten behoeve van het akoestisch onderzoek, bedoeld in [artikel 3.14a][ref1], wordt bij de bepaling van de
      geluidsbelasting van een windturbine of een combinatie van windturbines rekening gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.14b.1.a
    text: |-
      de over een kalenderjaar energetisch gemiddelde bronsterkte volgens de methode, bedoeld in hoofdstuk 3 van
      [bijlage 4][ref1], en met gebruikmaking van het door het KNMI aangeleverde langjarig gemiddelde windprofiel op
      ashoogte, tenzij wordt aangetoond dat gegevens beschikbaar zijn die een beter beeld geven van de geluidsemissie van
      de windturbine of een combinatie van windturbines;


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14b
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.14b.1.b
    text: |-
      de invloed van de omgeving en de meteorologische omstandigheden op de geluidsoverdracht van de windturbine of een
      combinatie van windturbines naar het immissiepunt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14b
  - number: 3.14b.2
    text: |-
      Indien de vaststelling van de geluidsbelasting vanwege een windturbine of een combinatie van windturbines
      plaatsvindt op de gevel van een gevoelig gebouw, bevindt het immissiepunt zich op het punt van de gevel, waar de
      geluidsbelasting het hoogst is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14b
  - number: 3.14b.3
    text: |-
      Indien de vaststelling van de geluidsbelasting vanwege een windturbine of een combinatie van windturbines
      plaatsvindt op de grens van een gevoelig terrein, bevindt het immissiepunt zich op het punt van de grens waar de
      geluidsbelasting het hoogst is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14b
  - number: 3.14b.4
    text: |-
      Indien de geluidsbelasting van een windturbine of een combinatie van windturbines met andere geluidsbronnen wordt
      berekend, wordt de rekenregel, bedoeld in hoofdstuk 4 van [bijlage 4][ref1], toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14b
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.14c
    text: |-
      Van de methode, bedoeld in hoofdstuk 3 van [bijlage 4][ref1], kan geheel of gedeeltelijk worden afgeweken indien
      aannemelijk wordt gemaakt dat de toe te passen afwijking:


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14c
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.14c.a
    text: |-
      een belangrijke tijdbesparing of kostenbesparing oplevert en in de betreffende situatie nagenoeg even nauwkeurig
      is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14c
  - number: 3.14c.b
    text: in de betreffende situatie belangrijk nauwkeuriger is, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14c
  - number: 3.14c.c
    text: |-
      voldoende nauwkeurig is en de methode, bedoeld in hoofdstuk 3 van [bijlage 4][ref1], in de betreffende situatie
      niet leidt tot een voldoende representatieve geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14c
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.14d.1
    text: |-
      Indien de gegevens over het, van de windsnelheid afhankelijke, bronvermogen van een windturbine of een combinatie
      van windturbines niet of niet volledig beschikbaar zijn, wordt dit bepaald volgens de methode, bedoeld in
      hoofdstuk 2 van [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14d
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.14d.2
    text: |-
      Indien in het kader van de handhaving wordt beoordeeld of het bronvermogen overeenkomt met de in het akoestisch
      onderzoek gebruikte waarden, wordt de methode, bedoeld in paragraaf 2.6 van [bijlage 4][ref1] toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14d
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.14e
    text: 'De drijver van de inrichting registreert de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14e
  - number: 3.14e.a
    text: |-
      de emissieterm L, bedoeld in onderdeel 3.4.1 van [bijlage 4][ref1], gebaseerd op de effectieve werking gedurende
      het afgelopen kalenderjaar, en


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14e
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.14e.b
    text: |-
      de voor de duur van een handhavingsmeting als bedoeld in paragraaf 2.6 van [bijlage 4][ref1] benodigde gegevens ter
      bepaling van de windsnelheid op ashoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.14e
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.15.1
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder worden bij het in werking hebben van een installatie voor het doorvoeren, bufferen of keren van
      rioolwater naar de buitenlucht afgevoerde dampen, waar binnen 50 meter van een emissiepunt een gevoelig gebouw,
      niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel bedrijventerrein met minder dan 1
      gevoelig gebouw per hectare, is gelegen, bovendaks en omhoog gericht afgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.15
  - number: 3.15.2
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege onvoldoende
      verspreiding van afgezogen dampen maatwerkvoorschriften stellen met betrekking tot het verhogen van de afvoerhoogte
      van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Bij het in werking hebben van een installatie voor het doorvoeren, bufferen of keren van rioolwater verkeert de
      installatie in goede staat van onderhoud en worden bij onderhoudswerkzaamheden zodanige maatregelen getroffen
      dat geurhinder bij gevoelige gebouwen zoveel mogelijk wordt voorkomen dan wel als dit niet mogelijk is tot een
      aanvaardbaar niveau wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16
  - number: 3.16.2
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt maatwerkvoorschriften
      stellen waarin maatregelen bedoeld in het eerste lid worden geconcretiseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16
  - number: 3.16a.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan beschikt degene die een inrichting met een natte koeltoren drijft over een
      risicoanalyse waarin is beschreven welke risico’s de natte koeltoren met zich meebrengt voor de omgeving alsmede
      over een legionella-beheersplan waarin de maatregelen zijn beschreven waarmee deze risico’s worden voorkomen, dan
      wel zoveel mogelijk worden beperkt. De drijver van de inrichting draagt er zorg voor dat het legionella-beheersplan
      wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2
    text: 'Bij de risicoanalyse, bedoeld in het eerste lid, worden in ieder geval de volgende risicofactoren betrokken:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.a
    text: 'het risico op vermeerdering van legionellabacteriën in de koeltoren door:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.a.1°
    text: de aard en kwaliteit van het water dat wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.a.2°
    text: de temperatuur van het water;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.a.3°
    text: de verblijfstijd van het water;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.a.4°
    text: de stilstand van het water;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.a.5°
    text: de aanwezigheid van biofilm en sediment;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.b
    text: de bedrijfsvoering van de natte koeltoren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.c
    text: de effectiviteit van het waterbehandelingsprogramma met betrekking tot legionellabacteriën en biofilmvorming;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.2.d
    text: |-
      de risico’s voor de omgeving, te bepalen volgens de risicocategorie-indeling in tabel 3.16a.
                Tabel 3.16a. Risicocategorie-indeling voor natte koeltorens






                        Risico categorie


                        Locatie natte koeltoren






                        1 (hoogste risico)


                        Natte koeltoren in de nabijheid (< 200 m) van een ziekenhuis, verpleeghuis of andere (medisch
      georiënteerde) zorginstelling waar mensen verblijven met een verminderd immuunsysteem




                        2


                        Natte koeltoren in de nabijheid (< 200 m) van verzorgingstehuizen, hotels of andere gebouwen
      waarin zich veel mensen bevinden




                        3


                        Natte koeltoren in de nabijheid (< 600 m) van een woonomgeving




                        4 (laagste risico)


                        Natte koeltoren die op afstand (> 600 m) staat van een woonomgeving
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.3
    text: |-
      Het legionella-beheersplan, bedoeld in het eerste lid, bevat naast een beschrijving van de maatregelen, bedoeld in
      dat lid, in ieder geval:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.3.a
    text: een tekening of schema met de actuele indeling van de natte koeltoren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.3.b
    text: een beschrijving van de juiste en veilige werking van de natte koeltoren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.3.c
    text: |-
      een beschrijving van alle uit te voeren controles aan de natte koeltoren, inclusief de controle op de aanwezigheid
      van Legionella;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.3.d
    text: |-
      een aanduiding van de waarden van de fysische, chemische en microbiologische parameters inclusief de concentratie
      aan legionellabacteriën in de natte koeltoren bij het bereiken waarvan maatregelen ter verbetering worden
      getroffen, alsmede een beschrijving van die maatregelen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.3.e
    text: een beschrijving van de maatregelen die worden genomen bij calamiteiten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.4
    text: |-
      De maatregelen, bedoeld in het eerste lid, zijn ten aanzien van het voorkomen of beperken van de risico’s voor de
      omgeving door legionellabacteriën bij het in bedrijf nemen en hebben van een natte koeltoren doeltreffend indien:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.4.a
    text: het ontstaan en de verspreiding van waternevel zoveel mogelijk worden beperkt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.4.b
    text: de stilstand van water in leidingen, reservoirs en appendages zoveel mogelijk wordt vermeden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.4.c
    text: de natte koeltoren en het water dat zich daarin bevindt schoon zijn;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.4.d
    text: |-
      de vermeerdering van legionellabacteriën zo veel mogelijk wordt beperkt door toepassing van
      waterbehandelingstechnieken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.4.e
    text: een juiste en veilige werking van de natte koeltoren conform de processpecificaties is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.5
    text: |-
      De risicoanalyse wordt aangepast indien de omstandigheden binnen de inrichting of in de onmiddellijke nabijheid
      daarvan daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.6
    text: |-
      In het legionella-beheersplan, bedoeld in het eerste lid, wordt aantekening gemaakt van de onderhoudswerkzaamheden
      die worden verricht, de wijzigingen in de natte koeltoren of het onderhoud, de uitkomsten van controles die worden
      uitgevoerd, alsmede bijzonderheden over de werking van de natte koeltoren. Deze aantekeningen worden ten minste
      gedurende drie jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16a.7
    text: |-
      Het bevoegd gezag, kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans
      dat ongewone voorvallen zich voordoen en de gevolgen hiervan, maatwerkvoorschriften stellen ten aanzien van de
      invulling van het legionella-beheersplan, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16a
  - number: 3.16b
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover
      dat niet mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan, bedoeld in [artikel 3.16d van het besluit][ref1], voldoet een
      ammoniakkoelinstallatie ten minste aan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.16b.a
    text: |-
      de minimale veiligheidsvoorzieningen in relatie tot de hoeveelheid ammoniak van PGS 13, paragraaf 2.2 tot en met
      2.5 en de hieraan gerelateerde functionele uitvoeringseisen uit PGS 13, hoofdstuk 4, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16b
  - number: 3.16b.b
    text: |-
      de voorschriften 3.2.5 tot en met 3.2.9, de voorschriften uit hoofdstuk 5, de voorschriften van paragrafen 8.2 tot
      en met 8.5, de voorschriften van paragrafen 8.7 tot en met 8.9 en de voorschriften uit hoofdstuk 9 van PGS 13.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16b
  - number: 3.16d
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld
      [artikel 3.16f van het besluit][ref1] voldoet een wisselverwarmingsinstallatie aan [artikel 3.16e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.16e.1
    text: |-
      Een installatie voor het verwarmen van wissels waarbij vloeibare bodembedreigende stoffen worden gebruikt, wordt
      uitgevoerd als een gesloten systeem.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.2
    text: |-
      De controle, het onderhoud en het beheer van de wisselverwarmingseenheden, bedoeld in het eerste lid, zijn in
      eenduidige bedrijfsinterne procedures en werkinstructies ter bescherming van de bodem vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.3
    text: |-
      In de bedrijfsinterne procedures en werkinstructies, bedoeld in het tweede lid, is ten minste aangegeven op welke
      wijze:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.3.a
    text: de staat en goede werking van wisselverwarmingseenheden wordt gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.3.b
    text: |-
      er voor zorg wordt gedragen dat zo vaak als de omstandigheden daarom vragen inspecties op morsingen en lekkages
      plaatsvinden, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.3.c
    text: is gewaarborgd dat gemorste of gelekte stoffen direct worden opgeruimd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.4
    text: |-
      Degene die de inrichting drijft draagt er zorg voor dat de medewerkers die binnen de inrichting bodembedreigende
      activiteiten verrichten, op de hoogte zijn van de bedrijfsinterne procedures en werkinstructies, bedoeld in het
      tweede lid, dat deze worden nageleefd en binnen de inrichting zodanig aanwezig zijn dat een ieder daarvan op
      eenvoudige wijze kennis kan nemen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.5
    text: |-
      Morsingen en lekkages worden overeenkomstig de bedrijfsinterne procedures en werkinstructies, bedoeld in het tweede
      lid, verholpen en opgeruimd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.6
    text: |-
      Degene die de inrichting drijft draagt er zorg voor dat de in het kader van de bedrijfsinterne procedures en
      werkinstructies noodzakelijke absorptiemiddelen en andere materialen en middelen ter bescherming van de bodem
      binnen de inrichting in voldoende mate aanwezig zijn en dat er voldoende in het gebruik van deze middelen
      geïnstrueerd personeel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.7
    text: |-
      Bevindingen van controles van of onderhoud aan wisselverwarmingseenheden, alsmede acties genomen na incidenten met
      bodembedreigende stoffen, die mogelijk hebben geleid tot een bodemverontreiniging, worden opgenomen in een logboek
      dat te allen tijde beschikbaar is voor het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
  - number: 3.16e.8
    text: |-
      [Artikel 2.11 van het besluit][ref1] is niet van toepassing op wisselverwarmingseenheden die vloeibare
      bodembedreigende stoffen bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 3.16f.1
    text: |-
      Voor het bijhouden van een registratie met betrekking tot het in werking hebben van een gesloten
      bodemenergiesysteem overeenkomstig [artikel 3.16n, eerste lid, onder a, van het besluit][ref1] worden tijdens de
      bedrijfsvoering van het systeem momentane metingen uitgevoerd met een nauwkeurigheid van ten minste 0,3°C en een
      frequentie van ten minste eenmaal per 15 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16f
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.16f.2
    text: |-
      Voor het bijhouden van een registratie met betrekking tot het in werking hebben van een gesloten
      bodemenergiesysteem overeenkomstig [artikel 3.16n, eerste lid, onder b, van het besluit][ref1] worden tijdens de
      bedrijfsvoering van het systeem momentane metingen uitgevoerd met een nauwkeurigheid van ten minste 5 % en een
      frequentie van ten minste eenmaal per 15 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16f
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.16fa
    text: |-
      Het energierendement dat een gesloten bodemenergiesysteem behaalt bij de levering van warmte of koude
      aan een bouwwerk, wordt bepaald overeenkomstig de volgende formule: waarbij wordt verstaan onder: *Q*: de
      door het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid warmte per jaar in MWh; *Q*: de door
      het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid koude per jaar in MWh; *E*: de door het
      bodemenergiesysteem verbruikte hoeveelheid elektriciteit per jaar in MWh; *G*: de door het bodemenergiesysteem
      verbruikte hoeveelheid gas per jaar in MWh.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16fa
  - number: 3.16g
    text: |-
      [Artikel 2.11 van het besluit][ref1] is niet van toepassing op het installeren en in werking hebben van een
      gesloten bodemenergiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.16g
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: '3.17'
    text: |-
      Deze paragraaf is van toepassing op een inrichting voor zover sprake is van het afleveren van vloeibare brandstof
      en gecomprimeerd aardgas, bedoeld in [artikel 3.17, eerste en tweede lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.17a
    text: |-
      Als testprocedure voor dampretour fase-II als bedoeld in [artikel 3.20, vierde lid, onder a, van het besluit][ref1],
      wordt aangewezen de Test Procedure voor Damp Retour Systemen in Benzinepompen voor Nederland van het NMi Certin
      van 1 februari 2011, dan wel een aan die testprocedure gelijkwaardige procedure, ter beoordeling door het bevoegd
      gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.17a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.18.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het afleveren van vloeibare brandstof ten minste voldaan aan de
      [artikelen 3.20 tot en met 3.22][ref1] en bij het afleveren van gecomprimeerd aardgas aan [artikel 3.23][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.18
