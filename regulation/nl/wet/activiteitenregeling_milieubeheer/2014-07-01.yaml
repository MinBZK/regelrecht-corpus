  - number: '3.106'
    text: |-
      Aan [artikel 3.141, vierde lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.106.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij het vervaardigen en bewerken van voedingsmiddelen of dranken waarbij
      voedingsmiddelen of grondstoffen daarvan worden gedroogd, gemalen, gebrand of geroosterd of waarbij goederen
      behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd, worden gevoerd door een filtrerende afscheider die
      geschikt is om aan [artikel 3.141, tweede lid, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.106.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.106
  - number: 3.107.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies wordt stofklasse
      S dat vrijkomt bij het vervaardigen en bewerken van voedingsmiddelen of dranken als bedoeld in
      [artikel 3.141 van het besluit][ref1] waarbij voedingsmiddelen of grondstoffen daarvan worden gedroogd, gemalen,
      gebrand of geroosterd of waarbij goederen behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.107.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen
      emissies die vrijkomen bij het vervaardigen en bewerken van voedingsmiddelen of dranken als bedoeld in
      [artikel 3.141 van het besluit][ref1], waarbij voedingsmiddelen of grondstoffen daarvan worden gedroogd, gemalen,
      gebrand of geroosterd of waarbij goederen behorend tot de stuifklasse S1, S2, S3 of S4 worden gemengd en naar de
      buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een
      gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein
      met minder dan één gevoelig gebouw per hectare, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.107.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.107
  - number: 3.108.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 3.143 van het besluit][ref1], wordt stofklasse S dat vrijkomt bij het schieten op een binnenschietbaan,
      voor zover dat redelijkerwijs mogelijk is, doelmatig afgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.108
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.108.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht als bedoeld in
      [artikel 3.143 van het besluit][ref1], worden de afgezogen emissies die vrijkomen bij het schieten op een
      binnenschietbaan en die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen
      50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.108
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.108.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.108
  - number: '3.109'
    text: |-
      Aan [artikel 3.143, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.109
    references:
