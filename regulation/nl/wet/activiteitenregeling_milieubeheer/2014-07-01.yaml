    text: |-
      de inlaat- en afwerpzijde van de transporteur zijn omkast, deze omkasting continu wordt afgezogen en het afgezogen
      stof zoveel mogelijk wordt teruggevoerd in de productstroom, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.50
  - number: 3.50.1.b
    text: |-
      de inlaat- en afwerpzijde van de transporteur zijn voorzien van een afscherming in de vorm van windreductieschermen
      of sproeiers.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.50
  - number: 3.50.2
    text: |-
      Onverminderd [artikel 3.49][ref1] wordt aan de [artikelen 3.38, tweede lid, van het besluit][ref2] en
      [3.32, aanhef en onder a en b, van het besluit][ref3] bij continu mechanisch transport van goederen behorend tot
      stuifklasse S2 en S4 van bijlage 4.6 van de NeR in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0022830
