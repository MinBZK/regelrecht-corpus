        - *PGS-klasse 1:* Vloeistoffen met een vlampunt lager dan 23 graden Celsius en een beginkookpunt hoger dan 35
      graden Celsius;
        - *PGS-klasse 2:* Vloeistoffen met een vlampunt hoger dan 23 graden Celsius en ten hoogste 55 graden Celsius;
        - *PGS-klasse 3:* Vloeistoffen met een vlampunt hoger dan 55 graden Celsius en ten hoogste 100 graden Celsius;
        - *PGS-klasse 4:* Vloeistoffen met een vlampunt hoger dan 100 graden Celsius;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel1.2
  - number: 1.2.2
    text: |-
      Bij de toepassing van het [besluit][ref1] wordt ten aanzien van de in het besluit opgenomen niet-publiekrechtelijke
      regelingen, voorschriften uit de NeR en de NRB de tekst in acht genomen als genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 1.3.1
    text: |-
      Als oppervlaktewaterlichamen die met het oog op het lozen geen bijzondere bescherming behoeven als bedoeld in
      [artikel 1.7, eerste lid, onderdeel b, van het besluit][ref1], worden aangewezen de in [bijlage 2][ref2] opgenomen
      oppervlaktewaterlichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022830
  - number: 1.3.2
    text: |-
      De in het eerste lid bedoelde aanwijzing beperkt zich tot het gedeelte van een oppervlaktewaterlichaam dat valt
      onder het beheer van de beheerder die bij het betreffende oppervlaktewaterlichaam in de bijlage vermeld staat.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel1.3
  - number: 1.3a
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om accreditatie als
      bedoeld in de [artikelen 3.10, tweede lid][ref3], [3.14, tweede lid][ref4], en [4.8, vierde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel1.3a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref5
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: '1.4'
    text: |-
      Als soorten biologische agentia als bedoeld in [artikel 1.14a, eerste lid, onder b, van het besluit][ref1], worden
      aangewezen de soorten die in [bijlage 3][ref2] zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022830
  - number: 2.1.1
    text: |-
      Een binnen de inrichting als bodembeschermende voorziening toegepaste vloeistofdichte vloer of verharding of
      geomembraanbaksysteem is overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument beoordeeld en goedgekeurd door een instelling, die daartoe beschikt over een erkenning op grond van
      dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.1.2
    text: |-
      Het eerste lid is niet van toepassing op een vloeistofdichte vloer of verharding die niet inspecteerbaar is als
      bedoeld in AS 6700. Een dergelijke voorziening wordt eens per zes jaar beoordeeld en goedgekeurd overeenkomstig een
      door het bevoegd gezag goedgekeurde wijze. Het vijfde lid is daarop van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
  - number: 2.1.3
    text: |-
      De eerste beoordeling en goedkeuring vindt in afwijking van het eerste lid, plaats binnen zes jaar na aanleg,
      indien de vloeistofdichte vloer of verharding, bedoeld in het eerste lid, is aangelegd overeenkomstig het daartoe
      krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een bedrijf dat daartoe beschikt over een
      erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.1.4
    text: |-
      Een vloeistofdichte vloer of verharding of een geomembraanbaksysteem wordt ten minste eens per zes jaar beoordeeld
      en goedgekeurd overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
  - number: 2.1.5
    text: 'Degene die de inrichting drijft draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
  - number: 2.1.5.a
    text: |-
      reparatie en regelmatig onderhoud van de vloeistofdichte vloer of verharding en geomembraanbaksysteem
      overeenkomstig paragraaf 3.3 van deel 3 van de NRB, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
  - number: 2.1.5.b
    text: een jaarlijkse controle van de bodembeschermende voorziening overeenkomstig bijlage 6 behorende bij AS 6700.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
  - number: 2.1.6
    text: |-
      Een vloeistofdichte vloer of verharding of een geomembraanbaksysteem wordt opnieuw beoordeeld en goedgekeurd
      overeenkomstig het eerste lid, indien de reparatie, het regelmatig onderhoud of de controle, bedoeld in het vijfde
      lid, niet of niet overeenkomstig dat lid is uitgevoerd of indien een tijdens een controle geconstateerd gebrek niet
      is gerepareerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Indien een geomembraanbaksysteem als bodembeschermende voorziening is toegepast, waarop op grond van
      [artikel 6.2][ref1] het [eerste lid van artikel 2.1][ref2] niet van toepassing is, worden twee grondwaterpeilbuizen
      geïnstalleerd overeenkomstig paragraaf 1.3 van bijlage 3 van deel 3 bij de NRB zodat bodemverontreiniging door
      vloeibare brandstoffen kan worden gesignaleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 2.2.2
    text: |-
      Indien stoffen als bedoeld in [artikel 3.29 van het besluit][ref1] is opgeslagen in een ondergrondse opslagtank
      wordt per opslagtank ten minste één grondwaterpeilbuis geïnstalleerd overeenkomstig paragraaf 1.3 van bijlage 3 van
      deel 3 bij de NRB. Indien er meerdere opslagtanks zijn dan wordt per groep van drie opslagtanks, die binnen tien
      meter van elkaar zijn gelegen, ten minste één grondwaterpeilbuis geïnstalleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 2.2.3
    text: 'Het tweede lid is niet van toepassing op een ondergrondse opslagtank, die:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
  - number: 2.2.3.a
    text: dubbelwandig is uitgevoerd met een systeem voor lekdetectie in de wand, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
  - number: 2.2.3.b
    text: |-
      in een afgedekte betonnen bak is geplaatst met een systeem voor lekdetectie in deze bak die zich onder de
      opslagtank bevindt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
  - number: 2.2.4
    text: |-
      De grondwaterpeilbuizen als bedoeld in het eerste en tweede lid, worden zo vaak als de omstandigheden daartoe
      aanleiding geven, doch ten minste eens per jaar bemonsterd overeenkomstig NEN 5744. Bij bemonstering van
      grondwaterpeilbuizen bij een ondergrondse opslagtank met vloeibare brandstof of afgewerkte olie worden de monsters
      onderzocht op aanwezigheid van minerale oliecomponenten overeenkomstig NEN-EN-ISO 9377-2, vluchtige aromaten (BETX)
      volgens NEN-EN-ISO 15680 en, voor zover er sprake is van de opslag van lichte olie, tevens op MTBE en ETBE door
      een laboratorium, dat daartoe beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref1]. Bij
      bemonstering van grondwaterpeilbuizen bij een ondergrondse opslagtank met pekel worden de monsters op aanwezigheid
      van chloride onderzocht overeenkomstig NEN-EN-ISO 15682 door een laboratorium, dat daartoe beschikt over een
      erkenning op grond van het Besluit bodemkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.2.5
    text: |-
      De installatie van een grondwaterpeilbuis als bedoeld in het eerste en tweede lid, en de bemonstering als bedoeld
      in het vierde lid, vinden plaats door een bedrijf, dat daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.2.6
    text: |-
      Degene die de inrichting drijft, zendt de gegevens van de bemonstering en analyse van de grondwaterpeilbuizen ten
      aanzien van de stoffen MTBE en ETBE, bedoeld in het vierde lid, terstond door aan het bestuursorgaan, bedoeld in
      [artikel 27, eerste lid, van de Wet bodembescherming][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel27
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '27'
  - number: 2.2.6.a
    text: |-
      de geanalyseerde waarde van de MTBE- of ETBE-verontreiniging hoger is dan 1 microgram per liter, voor zover de
      inrichting is gelegen in een grondwaterbeschermingsgebied;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
  - number: 2.2.6.b
    text: |-
      de geanalyseerde waarde van de MTBE- of ETBE-verontreiniging hoger is dan 15 microgram per liter, voor zover de
      inrichting is gelegen buiten een grondwaterbeschermingsgebied.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
  - number: 2.2.7
    text: |-
      Het eerste tot en met het zesde lid, zijn niet van toepassing ten aanzien van inrichtingen waar de gemiddeld
      laagste grondwaterstand zich meer dan vijf meter beneden het maaiveld bevindt. Indien deze inrichting echter
      is gelegen in een grondwaterbeschermingsgebied is er een systeem voor lekdetectie aanwezig dat voldoet aan BRL
      K910 en dat ten minste eenmaal per jaar wordt beoordeeld en goedgekeurd overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een persoon of instelling, die daartoe beschikt over
      een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.3.1
    text: |-
      Dit artikel is slechts van toepassing indien binnen de inrichting een vloeistofkerende voorziening is toegepast als
      bodembeschermende voorziening, tenzij in deze regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.2
    text: |-
      De controle, het onderhoud en het beheer van bodembeschermende voorzieningen wordt in eenduidige bedrijfsinterne
      procedures en werkinstructies ter bescherming van de bodem vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      In de bedrijfsinterne procedures en werkinstructies als bedoeld in het tweede lid is ten minste aangegeven op welke
      wijze:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.3.a
    text: |-
      de staat en goede werking van bodembeschermende voorzieningen, verpakkingen en apparatuur waarin vloeibare
      bodembedreigende stoffen worden opgeslagen of getransporteerd, wordt gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.3.b
    text: |-
      er voor zorg wordt gedragen dat zo vaak als de omstandigheden daarom vragen inspecties op morsingen en lekkages
      plaatsvinden, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.3.c
    text: is gewaarborgd dat gemorste of gelekte stoffen direct worden opgeruimd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Degene die de inrichting drijft draagt er zorg voor dat de medewerkers die binnen de inrichting bodembedreigende
      activiteiten verrichten, op de hoogte zijn van de bedrijfsinterne procedures en werkinstructies als bedoeld in
      het tweede lid, dat deze worden nageleefd en binnen de inrichting zodanig aanwezig zijn dat een ieder daarvan op
      eenvoudige wijze kennis kan nemen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.5
    text: |-
      De controle, het onderhoud en het beheer van bodembeschermende voorzieningen vinden zodanig plaats dat vrijgekomen
      stoffen zijn verwijderd voordat deze in de bodem kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Morsingen en lekkages worden overeenkomstig de bedrijfsinterne procedures en werkinstructies als bedoeld in het
      tweede lid, verholpen en opgeruimd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.7
    text: |-
      Degene die de inrichting drijft draagt er zorg voor dat de in het kader van de bedrijfsinterne procedures en
      werkinstructies noodzakelijke absorptiemiddelen en andere materialen en middelen ter bescherming van de bodem
      binnen de inrichting in voldoende mate aanwezig zijn en dat er voldoende, in het gebruik van deze middelen,
      geïnstrueerd personeel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.3.8
    text: |-
      Bevindingen van controles van of onderhoud aan bodembeschermende voorzieningen, alsmede acties genomen na
      incidenten met bodembedreigende stoffen, die mogelijk hebben geleid tot een bodemverontreiniging, worden opgenomen
      in een logboek dat te allen tijde beschikbaar is voor het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.3
  - number: 2.4.1
    text: 'Een bodembeschermende voorziening is zodanig uitgevoerd dat:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.4
  - number: 2.4.1.a
    text: gemorste of gelekte vloeibare bodembedreigende vloeistoffen effectief worden opgevangen en kunnen worden opgeruimd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.4
  - number: 2.4.1.b
    text: |-
      er geen hemelwater op of in terecht kan komen, tenzij het hemelwater regelmatig van of uit de voorziening wordt
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Een bodembeschermende voorziening is bestand tegen de inwerking van de desbetreffende vloeibare bodembedreigende
      stoffen en de condities waaronder deze stoffen worden gebruikt of opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Een lekbak waarin vloeibare bodembedreigende stoffen in verpakking of in een opslagtank wordt opgeslagen, heeft
      een opvangcapaciteit van ten minste 110% van de inhoud van de grootste verpakkingseenheid of opslagtank, met dien
      verstande dat de opvangcapaciteit ten minste 10% is van de inhoud van alle opgeslagen stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.4
  - number: '2.5'
    text: |-
      De bij deze regeling gestelde regels, die tot doel hebben te voldoen aan een verwaarloosbaar bodemrisico,
      zijn niet van toepassing op een bodembedreigende activiteit waarvoor het bevoegd gezag op grond van
      [artikel 6.10, eerste lid van het besluit][ref1] met een maatwerkvoorschrift heeft bepaald dat een aanvaardbaar
      bodemrisico kan worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '6'
  - number: 2.6.1
    text: 'Indien bij of krachtens het besluit verplichtingen gelden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.6
  - number: 2.6.1.a
    text: |-
      het uitvoeren van metingen, keuringen, controles of beoordelingen van of aan bodembeschermende voorzieningen,
      ondergrondse opslagtanks en daarbij behorende leidingen, appendages en kathodische bescherming, installaties
      of onderdelen van installaties, worden de resultaten daarvan ten minste tot aan het beschikbaar zijn van de
      resultaten van de eerstvolgende meting, keuring, controle of beoordeling maar ten minste gedurende drie jaar binnen
      de inrichting bewaard en ter inzage gehouden voor het bevoegd gezag of op een door het bevoegd gezag te stellen
      termijn beschikbaar gesteld;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.6
  - number: 2.6.1.b
    text: |-
      het aanleggen of installeren van bodembeschermende voorzieningen, ondergrondse opslagtanks en daarbij behorende
      leidingen, appendages en kathodische bescherming, installaties of onderdelen van installaties, worden de bewijzen
      van gecertificeerde aanleg en installatie binnen de inrichting bewaard en ter inzage gehouden voor het bevoegd
      gezag of op een door het bevoegd gezag te stellen termijn beschikbaar gesteld;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.6
  - number: 2.6.1.c
    text: |-
      het uitvoeren van bodem- en grondwateronderzoek, worden de resultaten van dat onderzoek binnen de inrichting
      bewaard en ter inzage gehouden voor het bevoegd gezag of op een door het bevoegd gezag te stellen termijn
      beschikbaar gesteld;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.6
  - number: 2.6.1.d
    text: |-
      het stellen van financiële zekerheid, wordt het schriftelijk bewijsstuk als bedoeld in [artikel 2.25][ref1] en
      [2.26 van het besluit][ref2] binnen de inrichting bewaard en ter inzage gehouden voor het bevoegd gezag of op een
      door het bevoegd gezag te stellen termijn beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.6.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder beschikbaar zijn en ter inzage houden mede verstaan: digitaal
      beschikbaar zijn en via elektronische weg ter inzage houden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.6
  - number: 2.9.1
    text: |-
      De categorieën van afvalstoffen, bedoeld in [artikel 2.12, vierde lid, van het besluit][ref1], waarin de
      afvalstoffen in ieder geval vergelijkbaar zijn wat betreft aard, samenstelling en concentratie, zijn de categorieën
      genoemd in de [bijlage bij de Regeling scheiden en gescheiden houden van gevaarlijke afvalstoffen](onbekend), en:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.9.1.a
    text: autowrakken die vloeistoffen of gevaarlijke stoffen bevatten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.b
    text: brandblussers groter dan 1 kilogram en gasflessen en overige drukhouders die gassen bevatten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.c
    text: LPG-tanks;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.d
    text: lege, ongereinigde verpakkingen van gevaarlijke stoffen;
