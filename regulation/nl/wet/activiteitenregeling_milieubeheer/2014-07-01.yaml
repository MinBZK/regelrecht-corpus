        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
  - number: 6.5i
    text: |-
      [Artikel 3.98][ref1] is niet van toepassing indien de drukkamer, bedoeld in [artikel 3.97, onder e][ref2], voor
      het tijdstip van inwerkingtreding van artikel 6.5i in gebruik was en bouwkundige aanpassing van de drukkamer
      redelijkerwijs niet kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5i
