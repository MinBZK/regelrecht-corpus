  - number: 4.102ed.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.94di van het besluit][ref1] vindt bij het toepassen van verpakkingsdiepdruktechniek:


