        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.8
        afdeling: '4.8'
  - number: 6.11a.2
    text: |-
      In afwijking van [artikel 4.114, vierde lid, onder b en c][ref1], geldt voor strooivelden die voor de datum van
      inwerkingtreding van dat artikel in gebruik zijn genomen, dat het onderzoek naar de bodemkwaliteit en de bepaling
      van de immissie van fosfaat naar de bodem in ieder geval wordt uitgevoerd binnen vijf jaar nadat het strooiveld
      in gebruik is genomen, dan wel, indien het strooiveld meer dan vijf jaar voor inwerkingtreding van dat artikel in
      gebruik is genomen, binnen zes maanden na inwerkingtreding van dat artikel, en daarna telkens tenminste eenmaal per
      vijf jaar.


