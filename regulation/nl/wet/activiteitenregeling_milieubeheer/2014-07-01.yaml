  - number: 4.102ef
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan als bedoeld in [artikel 4.94di van het besluit][ref1], vindt bij de
      toepassing van verpakkingsdiepdruktechniek de destillatie van oplosmiddelen plaats in een brandcompartiment. In
      dit brandcompartiment vindt geen opslag van of handelingen met gevaarlijke stoffen of brandbare goederen plaats,
      uitgezonderd opslag of handelingen die gericht is of zijn op destillatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
