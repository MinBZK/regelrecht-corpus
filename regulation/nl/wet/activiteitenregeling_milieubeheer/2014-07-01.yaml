  - number: 4.60.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies vindt het stralen van metalen
      plaats:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
  - number: 4.60.1.a
    text: in een daarvoor bestemde en ingerichte gesloten kast, cabine of ruimte; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
  - number: 4.60.1.b
    text: |-
      indien het redelijkerwijs niet mogelijk is te stralen als bedoeld in het eerste lid, onderdeel a, in een gesloten
      ruimte met gesloten deuren en ramen, waarbij wordt voorkomen dat bij het openen van deuren en ramen stof naar de
      buitenlucht vrijkomt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
  - number: 4.60.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden bij het stralen van metalen de
      stofemissies, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50
      meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
  - number: 4.60.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
  - number: 4.60.4
    text: |-
      Indien vanwege de omvang van het te stralen object, bedoeld in [artikel 4.49, tweede lid, van het besluit][ref1],
      het stralen in de buitenlucht plaatsvindt, worden emissies van stof die vrijkomen bij het stralen van metalen in
      de buitenlucht, voorkomen, dan wel beperkt door het toepassen van doelmatige stofvrije of stofarme straalmethodes,
      tenzij dit redelijkerwijs niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.60.5
    text: |-
      Indien het toepassen van een doelmatige stofvrije of stofarme straaltechniek als genoemd in het vierde lid
      redelijkerwijs niet mogelijk is, wordt de emissie van stof tijdens straalwerkzaamheden in de buitenlucht
      gereduceerd door het plaatsen van een doelmatige omkapping van geschikt materiaal.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
  - number: 4.60.6
    text: |-
      Ten aanzien van het zoveel mogelijk voorkomen, dan wel tot een aanvaardbaar niveau beperken van stofhinder bij
      het stralen van metalen in de buitenlucht kan het bevoegd gezag met inachtneming van de NeR maatwerkvoorschriften
      stellen, ter uitwerking van het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.60
  - number: '4.61'
    text: |-
      Aan [artikel 4.50, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.61
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.61.a
    text: |-
      de afgezogen stofemissies als bedoeld in [artikel 4.50, eerste lid, van het besluit][ref1] die vrijkomen bij
      het stralen van metalen worden gevoerd door een filtrerende afscheider of elektrostatische filterinstallatie die
      geschikt is om aan [artikel 4.50, eerste lid, van het besluit][ref2] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.61
    references:
