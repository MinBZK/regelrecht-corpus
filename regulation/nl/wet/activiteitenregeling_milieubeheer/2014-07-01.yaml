  - number: 3.45.1
    text: |-
      [Artikel 2.11 van het besluit][ref1] is niet van toepassing op het opslaan van grond en baggerspecie als bedoeld
      in [artikel 35 van het Besluit bodemkwaliteit,][ref2] voor zover het opslaan van grond en baggerspecie binnen de
      inrichting eenmalig plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.45
    references:
