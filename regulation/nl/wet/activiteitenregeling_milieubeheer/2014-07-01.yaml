        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.54.a
    text: de weegbunkers en overstortpunten gesloten uit te voeren,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.54
  - number: 3.54.b
    text: het neergeslagen stof in de overstortpunten regelmatig te verwijderen, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.54
  - number: 3.54.c
    text: de stortschoen af te zuigen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.54
  - number: 3.55.1
    text: |-
      Ten behoeve van het voorkomen dan wel beperken van diffuse emissie en het bevorderen van de doelmatige verspreiding
      van emissies naar de buitenlucht worden ten minste bij het inpandig opslaan en overslaan van stuifgevoelige
      goederen de emissies, bedoeld in [artikel 3.38 van het besluit][ref1], die naar de buitenlucht worden afgevoerd,
      bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw is gelegen,
      niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein met minder dan
      één gevoelig gebouw per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.55.2
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen met betrekking tot de ligging en uitvoering van het afvoerpunt van de emissies naar de lucht, bedoeld in
      [artikel 3.38 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.65.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en ten behoeve van het voorkomen van de
      verontreiniging van een oppervlaktewaterlichaam als bedoeld in [artikel 3.48 van het besluit][ref1] wordt bij het
      opslaan van agrarische bedrijfsstoffen voldaan aan het tweede tot en met negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.65.2
    text: |-
      Indien agrarische bedrijfsstoffen langer dan twee weken maar korter dan een half jaar op een onverhard oppervlak op
      een locatie worden opgeslagen, vindt het opslaan in elk geval plaats:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.2.a
    text: |-
      boven een absorberende laag met een dikte van ten minste 0,15 meter en een organische stofgehalte van ten minste
      25%, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.2.b
    text: zodanig dat contact met hemelwater wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.3
    text: |-
      Indien na het opslaan, bedoeld in het tweede lid, de opgeslagen agrarische bedrijfsstoffen worden verwijderd, wordt
      de absorberende laag eveneens verwijderd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.4
    text: |-
      Indien agrarische bedrijfsstoffen anders dan pluimveemest gedurende een half jaar of langer worden opgeslagen,
      vindt het opslaan plaats op ten minste een vloeistofkerende voorziening. [Artikel 2.3][ref1] is daarbij niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 3.65.5
    text: |-
      Bij het opslaan van agrarische bedrijfsstoffen anders dan gedroogde pluimveemest op een vloeistofkerende
      of vloeistofdichte voorziening worden vloeistoffen opgevangen in een opslagvoorziening die wordt aangelegd
      overeenkomstig paragraaf 5.5 en de hoofdstukken 6 en 7 van BRL 2342 en is de vloeistofkerende of vloeistofdichte
      voorziening zodanig aangelegd dat de vloeistof naar deze opslagvoorziening stroomt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.6
    text: |-
      In afwijking van het tweede tot en met vijfde lid zijn een absorberende laag als bedoeld in het tweede lid, een
      vloeistofkerende voorziening als bedoeld in het vierde lid en een opslagvoorziening als bedoeld in het vijfde lid
      niet vereist voor het opslaan van kuilvoer, indien het gehalte aan droge stof ten minste 40% bedraagt en de opslag
      zodanig is afgedekt dat contact met regenwater niet plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.7
    text: Het tweede tot en met zesde lid zijn niet van toepassing op het opslaan van in folie verpakte veevoederbalen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.8
    text: |-
      Indien pluimveemest op een locatie gedurende een half jaar of langer wordt opgeslagen, vindt het opslaan plaats
      boven een vloeistofkerende voorziening in een afgesloten ruimte met voldoende ventilatie. [Artikel 2.3][ref1] is
      daarbij niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 3.65.9
    text: Het tweede en derde lid zijn niet van toepassing op pluimveemest die in een afgedekte container wordt opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
  - number: 3.65.10
    text: |-
      [Artikel 2.11, eerste tot en met negende lid, van het besluit][ref1] is niet van toepassing op het opslaan van
      agrarische bedrijfsstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 3.66.1
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de emissie
      van ammoniak als bedoeld in [artikel 3.52, onder a, van het besluit][ref1] wordt bij het opslaan van drijfmest of
      digestaat voldaan aan de [artikelen 3.67 tot en met 3.69][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.66
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.6
        afdeling: '3.4'
  - number: 3.66.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.52, onder b, van het besluit][ref1] wordt bij het opslaan van drijfmest of digestaat voldaan aan de
      [artikelen 3.68 tot en met 3.70][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.66
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.6
        afdeling: '3.4'
  - number: 3.66.3
    text: |-
      [Artikel 2.11, eerste tot en met negende lid, van het besluit][ref1] is niet van toepassing op het opslaan van
      drijfmest of digestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.66
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 3.67.1
    text: |-
      Een mestbassin is voorzien van een afdekking die is aangebracht op of in het bassin, aansluitend of, in het geval
      van een drijvende afdekking, nagenoeg aansluitend tegen de rand van het mestbassin en boven de drijfmest of het
      digestaat.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.67
  - number: 3.67.2
    text: Het eerste lid is niet van toepassing op een mestkelder.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.67
  - number: 3.67.3
    text: |-
      Het eerste lid is niet van toepassing op een ondergronds mestbassin, niet zijnde een mestkelder, indien dit bassin
      volledig is afgedekt door een gesloten constructie die als vloer kan fungeren.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.67
  - number: 3.68.1
    text: |-
      Een mestbassin en de afdekking ervan worden aangelegd overeenkomstig paragraaf 5.5 en de hoofdstukken 6 en 7 van
      BRL 2342.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.68
  - number: 3.68.2
    text: |-
      Een mestbassin, niet zijnde een ondergronds mestbassin, en de afdekking ervan zijn voorzien van een
      kwaliteitsverklaring mestbassin, waaruit blijkt dat het mestbassin en de afdekking zijn uitgevoerd overeenkomstig
      BRL 2342 en wat de referentieperiode mestbassins is. De kwaliteitsverklaring mestbassin is binnen de inrichting
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.68
  - number: 3.68.3
    text: |-
      Een mestbassin dat, of een afdekking die visueel waarneembaar lek is of in een slechte staat verkeert, wordt
      terstond gerepareerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.68
  - number: 3.69.1
    text: |-
      Een mestbassin en een afdekking worden overeenkomstig het daartoe in de [Regeling bodemkwaliteit][ref1] aangewezen
      normdocument beoordeeld en goedgekeurd door een persoon of instelling, die daartoe beschikt over een erkenning op
      grond van het [Besluit bodemkwaliteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0023085
      - id: ref2
        bwb_id: BWBR0022929
  - number: 3.69.2
    text: |-
      De beoordeling, bedoeld in het eerste lid, vindt plaats ten minste vier weken voor het aflopen van de
      referentieperiode mestbassins.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.3
    text: |-
      Bij goedkeuring van een mestbassin en een afdekking wordt door de persoon of instelling, bedoeld in het eerste lid,
      een nieuwe referentieperiode mestbassins vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.4
    text: |-
      Indien de goedkeuring, bedoeld in het derde lid, onder voorwaarden wordt gegeven, wordt binnen een termijn, gesteld
      door een persoon of instelling als bedoeld in het eerste lid, aan die voorwaarden voldaan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.5
    text: |-
      Indien de beoordeling, bedoeld in het eerste lid, leidt tot afkeuring en het mestbassin of de afdekking reparatie
      behoeft, draagt degene die de inrichting drijft zorg voor reparatie en wordt het mestbassin of de afdekking
      binnen een termijn, gesteld door een persoon of instelling als bedoeld in het eerste lid opnieuw ter beoordeling
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.6
    text: |-
      Indien reparatie als bedoeld in het vijfde lid niet plaatsvindt of een mestbassin of afdekking wordt afgekeurd en
      reparatie niet mogelijk is, wordt:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.6.a
    text: van de afkeuring terstond melding gemaakt bij het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.6.b
    text: de drijfmest of het digestaat dat zich in het mestbassin bevindt onmiddellijk verwijderd, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.6.c
    text: het opslaan van drijfmest of digestaat in het mestbassin beëindigd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.7
    text: |-
      Het rapport van goedkeuring waarin een nieuwe referentieperiode mestbassins als bedoeld in het derde lid is
      opgenomen, is binnen de inrichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: 3.69.8
    text: |-
      Het eerste tot en met zevende lid is niet van toepassing op een ondergronds mestbassin voorzien van een afdekking
      die als vloer kan fungeren.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.69
  - number: '3.70'
    text: Het vul- en zuigpunt van een mestbassin bevindt zich boven een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.70
  - number: 3.71.1
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in [artikel 3.54 van het besluit][ref1] wordt bij het opslaan van vloeibare
      bijvoedermiddelen voldaan aan het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.71.2
    text: Het opslaan van vloeibare bijvoedermiddelen vindt plaats in een gesloten systeem.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71
  - number: 3.71.3
    text: |-
      Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt, met inachtneming van
      de NeR bij maatwerkvoorschrift eisen stellen aan:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71
  - number: 3.71.3.a
    text: de aard van de bijvoedermiddelen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71
  - number: 3.71.3.b
    text: het gekoeld opslaan van de bijvoedermiddelen, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71
  - number: 3.71.3.c
    text: de situering van het opslaan van de bijvoedermiddelen ten opzichte van geurgevoelige objecten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71
  - number: 3.71a.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 3.54b van het besluit][ref1] is in de vulplaats bij het
      vullen van gasflessen ten hoogste 300 liter aan gassen in flessen aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.71a.2
    text: Het vulstation voldoet aan paragraaf 8.2.1, 8.2.2 en 8.2.6, 11.1, 12.1 en bijlage III van PGS 23.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71a
  - number: 3.71b.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan als bedoeld
      in [artikel 3.54d van het besluit][ref1], voldoet de opslag van gasolie en afgewerkte olie in bovengrondse
      opslagtanks aan de [artikelen 3.71c tot en met 3.71h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
  - number: 3.71b.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.54d van het besluit][ref1] voldoet de opslag van smeerolie in bovengrondse opslagtanks aan de
      [artikelen 3.71f][ref2] en [3.71h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
  - number: 3.71b.3
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      verontreiniging van een oppervlaktewaterlichaam als bedoeld in [artikel 3.54d van het besluit][ref1] voldoet de
      opslag van gasolie, smeerolie of afgewerkte olie in bovengrondse opslagtanks boven een oppervlaktewaterlichaam aan
      de artikelen [3.71g][ref2] en [3.71h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
  - number: 3.71c.1
    text: |-
      De opslag van gasolie en afgewerkte olie in bovengrondse opslagtanks vindt plaats in bovengrondse opslagtanks,
      die met de daarbij behorende leidingen en appendages naar hun aard en functie geschikt zijn voor de opslag van de
      desbetreffende stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71c
  - number: 3.71c.2
    text: De bovengrondse opslagtanks en de daarbij behorende leidingen en appendages verkeren in goede staat.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71c
  - number: 3.71c.3
    text: De opslag van gasolie en afgewerkte olie in bovengrondse opslagtanks vindt op de vloer plaats.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71c
  - number: 3.71c.4
    text: |-
      Het derde lid is niet van toepassing op een bovengrondse opslagtank met gasolie of afgewerkte olie indien plaatsing
      op de vloer als gevolg van de constructie van de bijbehorende procesinstallatie niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71c
  - number: 3.71d.1
    text: |-
      Een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages voor het opslaan van
      gasolie en afgewerkte olie is uitgevoerd en geïnstalleerd en wordt gerepareerd of vervangen en beoordeeld of
      gecontroleerd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door
      een persoon of instelling, die daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.71d.2
    text: |-
      Het opslaan van gasolie en afgewerkte olie in een stationaire bovengrondse opslagtank met de daarbij behorende
      leidingen en appendages voldoet aan de volgende onderdelen van PGS 30:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.2.a
    text: de paragrafen 2.2 en 2.3;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.2.b
    text: de voorschriften 2.4.3, 2.6.1, 2.6.3 tot en met 2.6.6 en 2.6.14, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.2.c
    text: paragraaf 4.2, met uitzondering van de voorschriften 4.2.3, 4.2.9, 4.2.12, 4.2.13, eerste volzin, en tabel 4.1.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.3
    text: Een opslagtank als bedoeld in het eerste lid bevindt zich niet op een verdieping.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.4
    text: |-
      Het gebruik van een opslagtank waarin het opslaan, vullen en afleveren van gasolie en afgewerkte olie plaatsvindt
      in een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages, voldoet aan de
      volgende onderdelen van PGS 30:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.4.a
    text: voorschrift 3.2.4;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.4.b
    text: de paragrafen 3.3, 3.5, 3.6, 5.2, 5.4, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.4.c
    text: de voorschriften 5.5.1, 5.5.2, 5.6.1, 5.6.3 en 5.6.4.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.5
    text: |-
      Een stationaire bovengrondse opslagtank voor het inpandig opslaan van gasolie en afgewerkte olie in een werkruimte,
      in een ruimte met een noodstroomaggregaat of onder een woning heeft een inhoud van ten hoogste 3 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.6
    text: |-
      Voor een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages gelden de keurings-
      en herkeuringstermijnen van tabel 3.71d.
