  - number: 3.111.1
    text: |-
      Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, zoveel mogelijk beperken van de belasting
      van de bodem, bedoeld in [artikel 3.144, aanhef en onder b, van het besluit][ref1], wordt bij het schieten op een
      binnenschietbaan ten minste voldaan aan het tweede tot en met het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.111
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.111.2
    text: |-
      Indien bij het schieten hulzen van verschoten munitie vrijkomen, vindt het schieten plaats boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.111
  - number: 3.111.3
    text: |-
      De kogelvanger, bedoeld in [artikel 3.110, derde lid][ref1], is opgesteld boven een bodembeschermende voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.111
