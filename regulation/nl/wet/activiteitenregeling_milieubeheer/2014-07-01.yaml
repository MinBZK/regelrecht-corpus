    text: |-
      restafval waarin vaste bodembedreigende stoffen die in een significante hoeveelheid kunnen uitlogen, kan voorkomen,
      tenzij toepassing is gegeven aan [artikel 2.14b van het besluit][ref1] of anderszins is geborgd dat dit deze
      stoffen niet bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
