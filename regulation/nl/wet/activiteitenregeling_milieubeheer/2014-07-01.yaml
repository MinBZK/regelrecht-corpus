      zijn voorzien van een afzuiginrichting, of indien de goederen worden bevochtigd met behulp van een doelmatig
      werkende watersproei-installatie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.51
  - number: 3.51.c
