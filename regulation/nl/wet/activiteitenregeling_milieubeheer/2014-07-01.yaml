    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.59
  - number: 4.59.b
    text: |-
      de afgezogen gasvormige emissies die vrijkomen bij het solderen met vloeimiddelen die vluchtige organische stoffen
      bevatten worden gevoerd door een adsorptiefilter die geschikt is om aan [artikel 4.46 van het besluit][ref1] te
      voldoen, en het adsorptiefliter in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt; of


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.59
    references:
      - id: ref1
        bwb_id: BWBR0022762
