        afdeling: '4.1'
  - number: 4.13.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.6 van het besluit][ref1], voldoet de opslag van vloeibare bodembedreigende stoffen als bedoeld in
      [artikel 4.4a, onder e en f, van het besluit][ref2], in een bovengrondse opslagtank aan [artikel 4.18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.13
