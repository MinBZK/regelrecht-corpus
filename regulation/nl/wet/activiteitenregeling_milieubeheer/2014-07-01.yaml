        paragraaf: 4.1.5
        afdeling: '4.1'
  - number: 4.23.1
    text: |-
      Opslag van stoffen van ADR klasse 5.2 type D tot en met F in verpakking voldoet in elk geval aan de voorschriften
      van de hoofdstukken 4, 7 en 10 en de voorschriften 8.1.3 tot en met 8.1.7, 8.1.9 tot en met 8.1.19 en 8.2.5 van
      PGS 8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.23
  - number: 4.23.2
    text: |-
      Onverminderd het eerste lid worden stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een hoeveelheid
      kleiner dan 30 kilogram opgeslagen in een opslagvoorziening die ten minste voldoet aan de voorschriften 5.4.1,
      5.4.3 tot en met 5.4.6, 5.4.8 tot en met 5.4.10 en 5.4.12 van PGS 8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.23
  - number: 4.23.3
    text: |-
      Onverminderd het eerste lid worden stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een hoeveelheid
      vanaf 30 kilogram en kleiner dan 150 kilogram opgeslagen in een opslagvoorziening die ten minste voldoet aan de
      voorschriften 5.5.1 tot en met 5.5.8 en 5.5.11 tot en met 5.5.13 van PGS 8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.23
  - number: 4.23.4
    text: |-
      Onverminderd het eerste lid worden stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een hoeveelheid
      vanaf 150 kilogram en kleiner dan 1.000 kilogram opgeslagen in een opslagvoorziening die ten minste voldoet aan
      voorschriften 5.6.1 tot en met 5.6.11 en 5.6.15 tot en met 5.6.19 van PGS 8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.23
  - number: 4.23.5
    text: |-
      In afwijking van het tweede tot en met het vierde lid voldoet een dagvoorraad- of aftapruimte waar stoffen van ADR
      klasse 5.2 maximaal 72 uur voorhanden zijn aan de voorschriften 5.8.2 tot en met 5.8.11 en 5.8.14 tot en met 5.8.16
      van PGS 8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.23
  - number: 4.24.1
    text: |-
      Een dagvoorraad- of aftapruimte waar stoffen van ADR klasse 5.2 maximaal 72 uur voor handen zijn en de opslag
      van stoffen van ADR klasse 5.2 type D tot en met F in verpakking in een hoeveelheid vanaf 150 kilogram is
      overeenkomstig hoofdstuk 7 van PGS 8 zo uitgevoerd, dat de kans op brandoverslag zo klein mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.24
  - number: 4.24.2
    text: 'Aan het eerste lid wordt in elk geval voldaan als:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.24
  - number: 4.24.2.a
    text: |-
      de afstand van de opslagvoorziening tot interne objecten waar zich mensen bevinden ten minste tien meter bedraagt;
      en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.24
  - number: 4.24.2.b
    text: de afstand tot interne objecten waar zich over het algemeen geen mensen bevinden ten minste vijf meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.24
  - number: 4.25.1
    text: |-
      [Artikel 4.23][ref1] is niet van toepassing op stoffen van ADR klasse 5.2 type D, E en F, waarvoor volgens
      het ADR temperatuurbeheersing niet vereist is, indien deze stoffen worden opgeslagen in een hoeveelheid van ten
      hoogste 1.000 kilogram per opslagvoorziening, in verpakking als LQ en in een opslagvoorziening als bedoeld in
      [artikel 4.3, eerste lid][ref2], en overeenkomstig de voorschriften 9.2.2 en 9.2.3 van PGS 15.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.5
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.25.2
    text: |-
      Stoffen van ADR klasse 5.2 type C waarvoor volgens het ADR temperatuurbeheersing niet vereist is, worden
      opgeslagen in een hoeveelheid van ten hoogste 1.000 kilogram per opslagvoorziening, in verpakking als LQ en in een
      opslagvoorziening als bedoeld in [artikel 4.3, eerste lid][ref1], en overeenkomstig de voorschriften 9.2.2 en 9.2.3
      van PGS 15.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.26.1
    text: |-
      Het gebruik van stoffen van ADR klasse 5.2 type D tot en met F voldoet aan de voorschriften 8.1.4, 8.1.16 tot en
      met 8.1.19 en 8.2.5 van PGS 8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.26
  - number: 4.26.2
    text: |-
      Het gebruik van vloeibare stoffen van ADR klasse 5.2 type D tot en met F vindt plaats boven een vloeistofdichte
      vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.26
  - number: 4.26.3
    text: |-
      Het gebruik van vast stoffen van ADR klasse 5.2 type D tot en met F vindt plaats boven een bodembeschermende
      voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.26
  - number: 4.26.4
    text: |-
      Indien de werkvoorraad bestaat uit meer dan 25 liter vloeibare en tevens brandbare stoffen van ADR klasse 5.2 type
      D tot en met F, staat de werkvoorraad opgesteld boven een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.26
  - number: 4.27.1
    text: |-
      De verpakking van stoffen van ADR klasse 5.2 is tegen normale behandeling bestand en is zodanig dat niets van de
      inhoud uit de verpakking onvoorzien kan ontsnappen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.27
  - number: 4.27.2
    text: |-
      Het opslaan van stoffen van ADR klasse 5.2 type C tot en met F in verpakking vindt plaats boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.27
  - number: 4.34.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, voldoet de opslag van vaste kunstmeststoffen ten minste aan het tweede tot en met
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.2
    text: |-
      Indien in een inrichting meer dan 250 ton vaste kunstmeststoffen behorende tot de meststoffengroep 1.1, 1.2 of 1.3
      als bedoeld in PGS 7 wordt opgeslagen, is de opslagvoorziening bestemd voor de opslag van deze kunstmeststoffen
      uitgevoerd overeenkomstig:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.2.1°
    text: de voorschriften genoemd in paragraaf 4.2 met uitzondering van de voorschriften 4.2.13 en 4.2.17;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.2.2°
    text: de voorschriften genoemd in de paragrafen 5.2 en 6.1;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.2.3°
    text: de voorschriften in paragraaf 7.2.2 met uitzondering van voorschrift 7.2.9;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.2.4°
    text: |-
      de voorschriften van de paragrafen 8.1 en 9.1 tot en met 9.3 van de PGS 7. De opslagvoorziening bestemd voor de
      opslag van vaste kunstmeststoffen behorende tot de meststoffengroep 1.2 of 1.3 voldoet tevens aan de voorschriften
      genoemd in de paragrafen 4.3 en 8.2 van PGS 7.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.3
    text: |-
      De opslag van nitraathoudende kunstmeststoffen in de buitenlucht is niet ongecontroleerd toegankelijk voor
      onbevoegden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.4
    text: |-
      Aan het derde lid is voldaan indien nitraathoudende kunstmeststoffen in een afsluitbare ruimte zijn opgeslagen.
      Deze ruimte is bij afwezigheid van toezicht met slot of sleutel of op een andere vergelijkbare wijze afgesloten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.34.5
    text: |-
      Bij diefstal van nitraathoudende kunstmeststoffen doet de drijver van de inrichting zo spoedig mogelijk aangifte
      bij de politie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.34
  - number: 4.38.1
    text: |-
      Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, wordt stofklasse S dat
      vrijkomt bij mechanische bewerking van hout, kurk, dan wel van houten, kurken of houtachtige voorwerpen, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.38
  - number: 4.38.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen emissies die
      vrijkomen bij mechanische bewerking van hout, kurk, dan wel van houten, kurken of houtachtige voorwerpen en
      die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een
      emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein, dan
      wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.38
  - number: 4.38.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.38
  - number: '4.39'
    text: |-
      Aan [artikel 4.21, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.39.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij mechanische bewerking van hout, kurk, dan wel van houten,
      kurken of houtachtige voorwerpen worden gevoerd door een filtrerende afscheider, die geschikt is om aan
      [artikel 4.21, eerste lid van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.39.b
    text: |-
      de filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.39
  - number: 4.39a
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het verkleinen van hout, kurk, dan wel
      van houten, kurken of houtachtige voorwerpen waarbij gebruik wordt gemaakt van een installatie met een oliecircuit
      plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.39a
  - number: 4.40.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies worden dampen en gassen die
      vrijkomen bij:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.1.a
    text: |-
      het reinigen, coaten of lijmen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen door middel van
      vernevelen van vluchtige organische stoffen met een nevelspuit;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.1.b
    text: |-
      het coaten van hout, kurk dan wel houten, kurken of houtachtige voorwerpen door middel van het opbrengen van
      poeder;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.1.c
    text: |-
      het reinigen, coaten of lijmen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen met vluchtige
      organische stoffen door middel van dompeling in open of halfgesloten baden, uitgezonderd de toepassing van
      hoogkokende stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.1.d
    text: |-
      het aansluitend aan voornoemde activiteiten, drogen dan wel uitharden van met vluchtige organische stoffen
      behandelde materialen dan wel het moffelen van materialen die zijn voorzien van een poedercoating, voor zover dat
      redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.2
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van stofhinder, worden emissies van
      stofklasse S, waaronder coating-, lijm- of poederdeeltjes, die vrijkomen bij het uitpandig coaten of lijmen
      van hout, kurk dan wel houten, kurken of houtachtige voorwerpen door middel van vernevelen met een nevelspuit,
      voorkomen, dan wel beperkt door het treffen van doelmatige afschermingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.3
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de overeenkomstig het eerste
      lid, onderdeel b, afgezogen dampen en gassen, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht
      afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op
      een gezoneerd industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare,
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.4
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder worden de overeenkomstig
      het eerste lid, onderdelen a, c en d, afgezogen dampen en gassen, indien deze op de buitenlucht worden geëmitteerd:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.4.a
    text: |-
      ten minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd;
      of,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.4.b
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.5
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.6
    text: |-
      Het vierde lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.7
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissies die
      niet via de afzuiging worden afgevoerd of vanwege incidentele geurpieken in aanvulling op het vierde lid en met
      inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.7.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.7.b
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.7.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.7.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: 4.40.8
    text: |-
      In afwijking van het vierde lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar
      niveau overschrijdt en de bevoegdheden in het zevende lid onvoldoende zijn om de overschrijding ongedaan te
      maken, met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.40
  - number: '4.41'
    text: |-
      Aan [artikel 4.23, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.41.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij het coaten of lijmen van hout, kurk dan wel houten, kurken of
      houtachtige voorwerpen door middel van vernevelen met een nevelspuit en emissies die vrijkomen bij het coaten
      door middel van het opbrengen van poeder, worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.23, eerste lid, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.41.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.41
  - number: 4.42.1
    text: |-
      Ter uitvoering van [artikel 4.24, eerste lid van het besluit][ref1], past degene die de inrichting drijft:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.42.1.a
    text: 'bij het coaten of lijmen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.a.1°
    text: |-
      maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.a.2°
    text: oplosmiddelarme producten en efficiënte applicatiemethoden toe.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.b
    text: 'bij het reinigen van hout, kurk dan wel houten, kurken of houtachtige voorwerpen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.b.1°
    text: |-
      maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.b.2°
    text: 'de volgende maatregelen in volgorde van opsomming toe:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.b.2°.i
    text: zoveel mogelijk droog reinigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.b.2°.ii
    text: indien reiniging niet op een droge manier kan plaatsvinden, wordt gebruik gemaakt van waterige middelen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.b.2°.iii
    text: |-
      indien reiniging met waterige middelen technisch niet uitvoerbaar is, of niet kosteneffectief is, vindt het
      reinigen met organische oplosmiddelen plaats in procesbaden, die zijn uitgevoerd als een gesloten systeem.
      Indien gesloten systemen worden toegepast, wordt de in- en uitneemzone ten minste één minuut gesloten gehouden na
      beëindiging van het gebruik van de pomp- of persluchtinstallatie, ter beperking van de emissie naar de lucht;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.1.b.2°.iv
    text: |-
      indien reiniging niet mogelijk is in een gesloten systeem vanwege van technische onuitvoerbaarheid of omdat het
      niet kosteneffectief is, wordt gebruik gemaakt van hoogkokende niet-gehalogeneerde oplosmiddelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: 4.42.2
    text: |-
      Indien de emissiereducerende maatregelen als bedoeld in het eerste lid niet of in onvoldoende mate zijn getroffen,
      kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de motivering
      wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.42
  - number: '4.43'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het reinigen, coaten of lijmen van
      hout, kurk dan wel houten, kurken of houtachtige voorwerpen het verwerken van lakken, verdunners en lijmen alsmede
      het reinigen, het chemisch ontlakken en het logen van hout, kurk of houtachtige voorwerpen plaats boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.43
  - number: 4.44.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.27a, tweede lid, van het besluit][ref1] wordt stofklasse S dat vrijkomt bij mechanische bewerking van
      rubber, kunststof of rubber- of kunststofproducten, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de
      bron afgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.44
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.44.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht als bedoeld in
      [artikel 4.27a, tweede lid, van het besluit][ref1], worden de afgezogen emissies die vrijkomen bij mechanische
      bewerking van rubber, kunststof of rubber- of kunststofproducten die naar de buitenlucht worden afgevoerd,
      bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde
      een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig
      gebouw per hectare, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.44
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.44.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, als bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.44
  - number: '4.45'
    text: |-
      Aan [artikel 4.27a, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.45
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.45.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij mechanische bewerking van rubber, kunststof of rubber-
      of kunststofproducten worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.27a, eerste lid, van het besluit][ref1] te voldoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.45
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.45.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.45
  - number: 4.45a
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.27b, van het besluit][ref1], vindt het shredderen van rubber, kunststof of rubber- of
      kunststofproducten waarbij gebruik wordt gemaakt van een installatie met een olie- of koelvloeistofcircuit plaats
      boven een bodembeschermende voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.45a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.46.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.31 van het besluit][ref1] worden dampen en gassen die vrijkomen bij:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.46.1.a
    text: |-
      het reinigen, coaten of lijmen van kunststof en kunststof producten door middel van vernevelen van vluchtige
      organische stoffen met een nevelspuit;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.1.b
    text: het coaten van kunststof en kunststof producten door middel van het opbrengen van poeder;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.1.c
    text: |-
      het reinigen, coaten of lijmen van kunststof en kunststof producten met vluchtige organische stoffen door middel
      van dompeling in open of halfgesloten baden, uitgezonderd de toepassing van hoogkokende stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.1.d
    text: |-
      het aansluitend aan voornoemde activiteiten, drogen dan wel uitharden van met vluchtige organische stoffen
      behandelde materialen dan wel het moffelen van materialen die zijn van voorzien van een poedercoating, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.2
    text: |-
      Ten behoeve van het voorkomen, dan wel tot een aanvaardbaar niveau beperken van stofhinder als bedoeld
      in [artikel 4.31 van het besluit][ref1], worden emissies van stofklasse S, waaronder coating-, lijm- of
      poederdeeltjes, die vrijkomen bij het uitpandig coaten en lijmen van kunststof en kunststof producten door middel
      van vernevelen met een nevelspuit, voorkomen, dan wel beperkt door het treffen van doelmatige afschermingen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.46.3
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht als bedoeld in
      [artikel 4.31 van het besluit][ref1], worden de overeenkomstig het eerste lid, onderdeel b, afgezogen dampen en
      gassen, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van
      een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op
      een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.46.4
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder als bedoeld in
      [artikel 4.31 van het besluit][ref1] worden de overeenkomstig het eerste lid onderdelen a, c en d, afgezogen
      dampen en gassen, die op de buitenlucht worden geëmitteerd:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.46.4.a
    text: ten minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.4.b
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.5
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.6
    text: |-
      Het vierde lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.7
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissies die niet
      via de afzuiging worden afgevoerd of incidentele geurpieken met inachtneming van de NeR in aanvulling op het vierde
      lid maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.7.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.7.b
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.7.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.7.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: 4.46.8
    text: |-
      In afwijking van het vierde lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het zevende lid onvoldoende zijn om de overschrijding ongedaan te
      maken met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.46
  - number: '4.47'
    text: |-
