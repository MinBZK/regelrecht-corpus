  - number: 4.104.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico is bij het reinigen en wassen van textiel een
      textielreinigingsinstallatie voor het reinigen met PER opgesteld boven een vloeistofdichte vloer of verharding, die
      niet voor PER indringbaar is, of een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104
  - number: 4.104.2
    text: |-
      Een textielreinigingsinstallatie voor het reinigen met oplosmiddelen, niet zijnde PER is opgesteld boven een
      vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104
  - number: 4.104a.1
    text: |-
      Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, wordt stofklasse S dat
      vrijkomt bij het geautomatiseerd weven, spinnen en breien van textiel en het verkleinen van textiel en producten
      van textiel, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104a
  - number: 4.104a.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen emissies die
      vrijkomen bij het geautomatiseerd weven, spinnen en breien van textiel en het verkleinen van textiel en producten
      van textiel en die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen
      50 meter van een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig gebouw op een gezoneerd
      industrieterrein, dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104a
  - number: 4.104a.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104a
  - number: 4.104b
    text: |-
      Aan [artikel 4.103aa van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.104b.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij het geautomatiseerd weven, spinnen en breien van textiel en het
      verkleinen van textiel en producten van textiel worden gevoerd door een filtrerende afscheider, die geschikt is om
      aan [artikel 4.103aa van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.104b.b
    text: |-
      de filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104b
  - number: 4.104ba
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het verkleinen van textiel en
      producten van textiel waarbij gebruik wordt gemaakt van een installatie met een oliecircuit, plaats boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104ba
  - number: 4.104c.1
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht worden afgezogen dampen en gassen
      van een ruimte waarin textiel wordt gelast, bovendaks afgevoerd, indien binnen 50 meter van een emissiepunt
      een gevoelig gebouw is gelegen, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein of op een
      bedrijventerrein met minder dan één gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104c
  - number: 4.104c.2
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104c
  - number: 4.104d.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies worden dampen en gassen die
      vrijkomen bij:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.1.a
    text: het coaten en lijmen van textiel door middel van vernevelen van vluchtige organische stoffen met een nevelspuit;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.1.b
    text: |-
      het aansluitend aan de onder a genoemde activiteiten, drogen dan wel uitharden van met vluchtige organische stoffen
      behandelde materialen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.2
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder worden de overeenkomstig
      het eerste lid, onderdelen a en b, afgezogen dampen en gassen, die op de buitenlucht worden geëmitteerd:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.2.a
    text: |-
      ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd;
      of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.2.b
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.3
    text: |-
      Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.4
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissies die niet
      via de afzuiging worden afgevoerd of incidentele geurpieken met inachtneming van de NeR in aanvulling op het tweede
      lid maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.4.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.4.b
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.4.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.4.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104d.5
    text: |-
      In afwijking van het tweede lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het vierde lid onvoldoende zijn om de overschrijding ongedaan te
      maken met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104d
  - number: 4.104e
    text: |-
      Aan [artikel 4.103d van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.104e.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij het coaten en lijmen van textiel door middel van
      vernevelen met een nevelspuit worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.103d van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.104e.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104e
  - number: 4.104f.1
    text: |-
      Ter uitvoering van [artikel 4.103e, eerste lid, van het besluit][ref1], past degene die de inrichting drijft bij
      het lijmen en coaten van textiel:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104f
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.104f.1.a
    text: |-
      maatregelen toe ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104f
  - number: 4.104f.1.b
    text: oplosmiddelarme producten en efficiënte applicatiemethoden toe.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104f
  - number: 4.104f.2
    text: |-
      Indien de emissiereducerende maatregelen, bedoeld in het eerste lid, niet of in onvoldoende mate zijn getroffen,
      kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de motivering
      wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104f
  - number: 4.104g
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden bij het lijmen en coaten van textiel het
      verwerken van lakken, verdunners en lijmen en het reinigen van spuitapparatuur plaats boven een bodembeschermende
      voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104g
  - number: 4.104h
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico wordt bij het inwendig reinigen en ontsmetten
      van vrachtwagens en andere transportmiddelen het afvalwater van de vrachtwagen naar het afvoerpunt afgevoerd
      via een vloeistofdichte vloer of verharding, waarbij ervoor wordt gezorgd dat geen afvalwater buiten de vloer of
      voorziening terecht kan komen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104h
  - number: 4.104i.1
    text: |-
      Een zuiveringsvoorziening als bedoeld in [artikel 4.104c, tweede lid, van het besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104i
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.104i.1.a
    text: verwijdert ten minste 95% van de gewasbeschermingsmiddelen uit het afvalwater;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104i
  - number: 4.104i.1.b
    text: is goed toegankelijk, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104i
  - number: 4.104i.1.c
    text: wordt onderhouden zo vaak als voor de goede werking daarvan nodig is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104i
  - number: 4.104i.2
    text: |-
      Indien het afvalwater dat wordt aangeboden aan de zuiveringsvoorziening, bedoeld in het eerste lid, meer dat 20
      milligram olie per liter bevat, wordt het afvalwater voorafgaand aan de zuiveringsvoorziening geleid door een
      olieafscheider en slibvangput die voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104i
  - number: 4.104j.1
    text: |-
      Indien de zuiveringsvoorziening, bedoeld in [artikel 4.104c, tweede lid, van het besluit][ref1] de
      gewasbeschermingsmiddelen biologisch uit het afvalwater verwijdert, voldoet de zuiveringsvoorziening, onverminderd
      [artikel 4.104i][ref2], aan het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104j
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.1
        afdeling: '4.8'
  - number: 4.104j.2
    text: 'Een biologische zuiveringsvoorziening bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104j
  - number: 4.104j.2.a
    text: |-
      zuiveringsmateriaal in een deel van de zuiveringsvoorziening die zodanig is uitgevoerd en zodanig wordt onderhouden
      dat contact van het afvalwater met de bodem wordt voorkomen, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104j
  - number: 4.104j.2.b
    text: |-
      een bufferopslag en doseereenheid waarmee het afvalwater geleidelijk en gelijkmatig wordt verspreid over
      het oppervlak van het zuiveringsmateriaal en waardoor de capaciteit van de zuiveringsvoorziening niet wordt
      overschreden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104j
  - number: 4.104j.3
    text: |-
      De biologische zuiveringsvoorziening is zodanig gedimensioneerd dat de capaciteit voldoende is voor de behandeling
      van de afvalwaterstroom die jaarlijks vrijkomt. Op verzoek van het bevoegd gezag wordt een berekening van de
      capaciteit van de zuiveringsvoorziening overgelegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.104j
  - number: 4.109.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het met een acculader laden van een accu
      die vloeibare bodembedreigende stoffen bevat, plaats boven een bodembeschermende voorziening
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.109
  - number: 4.109.2
    text: |-
      [Artikel 2.11 van het besluit][ref1] is niet van toepassing op het met een acculader laden van een accu die
      vloeibare bodembedreigende stoffen bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.109
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 4.112.1
    text: |-
      Ten behoeve van het zo volledig mogelijk verbranden van rookgassen en het zo veel mogelijk beperken van het
      ontstaan van stikstofdioxiden, wordt bij het inwerking hebben van een crematieoven voldaan aan het tweede tot en
      met het negende lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.2
    text: |-
      Een crematieoven is voorzien van een naverbrandingsruimte voorzien van een naverbrander, waarin de rookgassen uit
      de hoofdkamer worden naverbrand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.3
    text: |-
      Bij het in werking hebben van een crematieoven wordt de vorming van stikstofoxiden beperkt door het toepassen van
      een low-NO brander in de hoofdkamer van de oven en de naverbrander in de naverbrandingsruimte.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.4
    text: |-
      In de naverbrandingsruimte, bedoeld in het tweede lid, vindt een zodanige menging van de rookgassen plaats dat deze
      zo volledig mogelijk worden verbrand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.5
    text: |-
      Op verzoek van het bevoegd gezag wordt aangetoond dat het ontwerp van de crematieoven zodanig is, dat onder normale
      bedrijfsomstandigheden de verblijftijd van de afgassen in de naverbrandingsruimte ten minste 1,5 seconde bedraagt
      bij een temperatuur van ten minste 800 graden Celsius.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.6
    text: |-
      De temperatuur van de rookgassen in de naverbrandingsruimte wordt door middel van een brander boven de 800 graden
      Celsius gehouden. Hiertoe is de brander van een automatische regeling voorzien.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.7
    text: |-
      Het zuurstofgehalte in de naverbrandingsruimte bedraagt ten minste 6%. Kortdurende onderschrijdingen van dit
      gehalte zijn toegestaan met dien verstande dat deze onderschrijdingen nooit langer dan één minuut duren en dat het
      zuurstofgehalte altijd boven de 3% blijft.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.8
    text: De temperatuur en het zuurstofgehalte in de naverbrandingsruimte worden continu gemeten en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.112.9
    text: |-
      Uiterlijk zes maanden na in gebruikname van de installatie en daarna jaarlijks wordt de goede werking van de
      installatie gecontroleerd door een deskundige. Hierbij wordt ten minste de werking van de automatische regelingen
      en de continue meetapparatuur gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.112
  - number: 4.113.1
    text: |-
      Aan [artikel 4.119 van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.113
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.113.1.a
    text: |-
      de afgezogen emissies die vrijkomen bij crematieprocessen worden gevoerd door een adsorptiemedium en filtrerende
      afscheider, welke combinatie geschikt is om aan [artikel 4.119 van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.113
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.113.1.b
    text: |-
      het adsorptiemedium en filtrerende afscheider in goede staat van onderhoud verkeren, periodiek worden gecontroleerd
      en zo vaak als voor de goede werking nodig is, worden schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.113
  - number: 4.113.2
    text: |-
      Bij het ontwerp, de uitvoering en het onderhoud van het adsorptiemedium en de filtrerende afscheider, bedoeld
      in het eerste lid, is rekening gehouden met het voorkomen van dioxine- en furanenvorming in het filter, en het
      afvangen van de eventueel in de afgassen aanwezige dioxinen en furanen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.113
  - number: 4.113.3
    text: |-
      Het afgevangen stof uit de filtrerende afscheider mag niet als crematie-as worden behandeld, maar wordt afgegeven
      aan een daartoe erkende inzamelaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.113
  - number: 4.113.4
    text: |-
      Bij de berekening van een emissieconcentratie wordt deze betrokken op een zuurstofgehalte van 11% onder
      normaalcondities en voor droog rookgas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.113
  - number: 4.114.1
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de belasting
      van de bodem wordt bij het verstrooien van crematie-as op een strooiveld voldaan aan het tweede tot en met het
      negende lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.2
    text: |-
      Verstrooiing van crematie-as geschiedt gelijkmatig en zodanig dat de as niet door verwaaiing buiten het terrein van
      de inrichting of het strooiveld terechtkomt of terecht kan komen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.3
    text: |-
      Indien er meer dan 90 maar minder dan 370 verstrooiingen per hectare per jaar plaatsvinden, worden de volgende
      maatregelen getroffen:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.3.a
    text: |-
      het onderzoek naar de bodemkwaliteit, bedoeld in [artikel 2.11, eerste lid, van het besluit][ref1], vindt tevens
      plaats voordat een strooiveld in gebruik wordt genomen. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden nadat het strooiveld in gebruik is genomen, toegestuurd aan het bevoegd gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 4.114.3.b
    text: |-
      onverminderd [artikel 2.11, tweede en derde lid, van het besluit][ref1], wordt ten minste eenmaal per 25 jaar
      de bodemkwaliteit ter plaatse van het strooiveld bepaald. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden na uitvoering van het onderzoek toegestuurd aan het bevoegd gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 4.114.3.c
    text: |-
      de immissie van fosfaat naar de bodem wordt bepaald door middel van uitloogproeven. Deze proeven worden uitgevoerd
      op een representatief bodemmonster van het strooiveld. Deze bepaling wordt uiterlijk binnen drie maanden na
      oprichting van het strooiveld en daarna telkens tenminste eenmaal per 25 jaar verricht. De immissie is niet hoger
      dan 1.000 milligram per vierkante meter per jaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.4
    text: 'Indien er meer dan 370 verstrooiingen per hectare per jaar plaatsvinden, worden de volgende maatregelen getroffen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.4.a
    text: |-
      het onderzoek naar de bodemkwaliteit, bedoeld in [artikel 2.11, eerste lid, van het besluit][ref1], vindt tevens
      plaats voordat een strooiveld in gebruik wordt genomen. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden nadat het strooiveld in gebruik is genomen, toegestuurd aan het bevoegd gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 4.114.4.b
    text: |-
      onverminderd [artikel 2.11, tweede en derde lid, van het besluit][ref1], wordt ten minste eenmaal per vijf jaar
      de bodemkwaliteit ter plaatse van het strooiveld bepaald. Een rapport met de resultaten van het onderzoek wordt
      uiterlijk binnen drie maanden na uitvoering van het onderzoek toegestuurd aan het bevoegd gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 4.114.4.c
    text: |-
      de immissie van fosfaat naar de bodem wordt bepaald door middel van uitloogproeven. Deze proeven worden uitgevoerd
      op een representatief bodemmonster van het strooiveld. Deze bepaling wordt uiterlijk binnen drie maanden na
      oprichting van het strooiveld en daarna telkens tenminste eenmaal per vijf jaar verricht. De immissie is niet hoger
      dan 1.000 milligram per vierkante meter per jaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.5
    text: |-
      Indien er meer dan 3200 verstrooiingen per hectare per jaar plaatsvinden, kan het bevoegd gezag
      maatwerkvoorschriften stellen ten aanzien van het voorkomen dan wel zoveel mogelijk beperken van de belasting van
      de bodem.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.6
    text: |-
      De onderzoeken en rapporten, bedoeld in het derde en het vierde lid, worden uitgevoerd onderscheidenlijk
      opgesteld door een persoon of een instelling die daartoe beschikt over een erkenning op grond van het
      [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.114.7
    text: |-
      De bepaling van de onderzoeksstrategie bij de bepaling van de bodemkwaliteit, bedoeld in het derde en het vierde
      lid, gebeurt conform NEN 5740.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.114.8
    text: |-
      Indien uit rapporten als bedoeld in het derde en het vierde lid blijkt dat de belasting van de bodem
      is toegenomen ten opzichte van de eerder vastgestelde kwaliteit van de bodem wordt overeenkomstig
      [artikel 2.11, vijfde lid, van het besluit][ref1], de bodemkwaliteit hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 4.114.9
    text: |-
      Bij het gebruik van wisselvelden kan het bevoegd gezag bij maatwerkvoorschrift in afwijking van het derde lid,
      onderdelen b en c, en het vierde lid, onderdelen b en c, een afwijkende onderzoeksfrequentie voorschrijven voor het
      bepalen van de bodemkwaliteit en het bepalen van de immissie van fosfaat.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.114
  - number: 4.115.1
    text: 'Binnen de inrichting is een logboek of systeem aanwezig waarin de volgende zaken worden vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.115
  - number: 4.115.1.a
    text: |-
      de onderhouds- en controleresultaten, bedoeld in [artikel 4.112, negende lid][ref1], en de meetwaarden, bedoeld in
      artikel 4.112, achtste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.115
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.8
        afdeling: '4.8'
  - number: 4.115.1.b
    text: |-
      de opgetreden storingen of andere onregelmatigheden die van invloed kunnen zijn op de luchtemissie, onder
      vermelding van de datum, het tijdstip en de aard van de storing alsmede de genomen acties om de storing ongedaan te
      maken en voor de toekomst te voorkomen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.115
  - number: 4.115.1.c
    text: |-
      de gebruiksintensiteit van de strooivelden, bedoeld in [artikel 4.114, derde, vierde en vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.115
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.8
        afdeling: '4.8'
  - number: 4.115.1.d
    text: |-
      de rapporten, bedoeld in [artikel 4.114, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.115
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.8
        afdeling: '4.8'
  - number: 4.115.2
    text: Het logboek is voor inzage door het bevoegd gezag beschikbaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.115
  - number: 4.116.1
    text: |-
      Ten behoeve van de bescherming van het milieu wordt bij het lozen van afvalwater afkomstig van een laboratorium of
      een praktijkruimte op het vuilwaterriool ten minste voldaan aan het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.116.2
    text: |-
      Degene die de inrichting drijft, stelt gedragsvoorschriften op en treft voorzieningen die zijn gericht op het
      voorkomen van nadelige gevolgen voor het milieu van het lozen van afvalwater en draagt er zorg voor dat de
      gedragsvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.116.3
    text: 'De gedragsvoorschriften en voorzieningen, bedoeld in het tweede lid, geven ten minste uitwerking aan:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.116.3.a
    text: |-
      de wijze waarop invulling wordt gegeven aan een inzamelsysteem voor bepaalde categorieën van stoffen en preparaten
      die niet mogen worden geloosd vanuit het oogpunt van doelmatig kunnen inzamelen en verwerken elders;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.116.3.b
    text: |-
      de wijze waarop invulling wordt gegeven aan voorlichting van het personeel over het inzamelsysteem, bedoeld onder
      a;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.116.3.c
    text: de wijze waarop invulling wordt gegeven aan maatregelen die voortkomen uit de preventieve aanpak;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.116.3.d
    text: de inhoud van een registratiesysteem met betrekking tot de aanwezige stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.116.4
    text: |-
      Het bevoegde gezag kan indien het belang van de bescherming van het milieu daartoe noodzaakt, maatwerkvoorschriften
      stellen ten aanzien van de invulling van de gedragsvoorschriften en voorzieningen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.116
  - number: 4.117.1
    text: 'Ten behoeve van het voorkomen dan wel beperken van diffuse emissies:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.117
  - number: 4.117.1.a
    text: |-
      past degene die de inrichting drijft maatregelen ten aanzien van de bedrijfsvoering toe ter voorkoming van onnodige
      emissie van stoffen naar de lucht;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.117
  - number: 4.117.1.b
    text: |-
      worden stof, rook en dampen die vrijkomen bij activiteiten in een laboratorium of praktijkruimte voor zover dat
      redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.117
  - number: 4.117.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden voor zover het afgezogen
      emissies betreft die vrijkomen bij activiteiten in een laboratorium of praktijkruimte, die naar de buitenlucht
      worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig
      gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein met
      minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.117
  - number: 4.117.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.117
  - number: '4.118'
    text: |-
      Aan [artikel 4.125, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.118
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.118.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij laboratoriumproeven worden gevoerd door een filtrerende afscheider
      of elektrostatische filterinstallatie die geschikt is om aan [artikel 4.125, eerste lid van het besluit][ref1] te
      voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.118
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.118.b
    text: |-
      die filtrerende afscheider of elektrostatisch filter in goede staat van onderhoud verkeert, deze periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.118
  - number: 4.119.1
    text: |-
      Aan [artikel 4.125, tweede lid, van het besluit][ref1] wordt in ieder geval voldaan indien het verbruik
      aan stoffen ingedeeld in de klassen gA1, gA2, gA3, gO1, gO2 en gO3 in kilogram per jaar lager is dan de in
      [artikel 2.6 van het besluit][ref2] voor de betreffende stofklasse genoemde vrijstellingsgrens en de som van de
      stoffen ingedeeld in de klassen gO1, gO2 en gO3 niet meer bedraagt dan 250 kilogram per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.119
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 4.119.2
    text: |-
      Tevens wordt in ieder geval aan [artikel 4.125, tweede lid, van het besluit][ref1] voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.119
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.119.2.a
    text: |-
      de afgezogen emissies die vrijkomen bij laboratoriumproeven met stoffen ingedeeld in de klassen gA1, gA2 en gA3
      worden gevoerd door een gaswasser, aërosolfilter of mistfilter die geschikt is om aan de emissieconcentratie-eisen
      genoemd in [artikel 4.125, tweede lid, van het besluit][ref1] te voldoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.119
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.119.2.b
    text: |-
      de gaswasser, aërosolfilter of mistfilter, bedoeld onder a, in goede staat van onderhoud verkeert, periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is wordt schoongemaakt, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.119
  - number: 4.119.2.c
    text: |-
      de afgezogen emissies die vrijkomen bij laboratoriumproeven met stoffen ingedeeld in de klassen gO1, gO2 en gO3
      worden gevoerd door een adsorptiefilter die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en
      zo vaak als voor de goede werking nodig is, wordt schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.119
  - number: 4.120.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het gericht werken met biologische agentia in een laboratorium of
      praktijkruimte ten minste voldaan aan het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.120
  - number: 4.120.2
    text: |-
      Degene die de inrichting drijft, stelt gedragsvoorschriften op en treft voorzieningen die zijn gericht op het
      voorkomen van het vrijkomen van het biologisch agens en draagt ervoor zorg dat de gedragsvoorschriften worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.120
  - number: 4.120.3
    text: |-
      De gedragsvoorschriften, bedoeld in het tweede lid, zijn te allen tijde voor inzage door het bevoegd gezag
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.120
  - number: 4.120.4
    text: |-
      Het bevoegd gezag kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan maatwerkvoorschriften stellen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.120
  - number: 4.120.4.a
    text: |-
      de ruimten waar gericht gewerkt wordt met een biologisch agens die is of wordt ingedeeld in groep 2 of een
      biologisch agens dat behoort tot een soort die is opgenomen in [bijlage 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.120
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 4.120.4.b
    text: de invulling van gedragsvoorschriften en voorzieningen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.120
  - number: 4.120.5
    text: |-
      Voor de groepsindeling, bedoeld in het vierde lid, onder a, wordt aangesloten bij de indeling in risico-groepen van
      richtlijn nr. 2000/54/EG van het Europees Parlement en de Raad van 18 september 2000 betreffende de bescherming van
      de werknemers tegen de risico’s van blootstelling aan biologische agentia op het werk.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.120
  - number: '4.121'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden activiteiten in een laboratorium
      waarbij vloeibare bodembedreigende stoffen worden gebruikt of kunnen vrijkomen, plaats boven een bodembeschermende
      voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.121
  - number: '5.1'
    text: |-
      De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage van de meting,
      bedoeld in [artikel 5.13 van het besluit][ref1], voldoet aan de eisen in de [artikelen 5.2 tot en met 5.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.1
        afdeling: '5.1'
  - number: 5.2.1
    text: Metingen ter bepaling van de emissies zijn representatief.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.2
  - number: 5.2.2
    text: |-
      Alle monitoringresultaten worden op zodanige wijze geregistreerd, verwerkt en gepresenteerd, dat het bevoegd gezag
      kan controleren of wordt voldaan aan de toepasselijke emissiegrenswaarden en andere voorschriften.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.2
  - number: 5.3.1
    text: |-
      De emissieconcentratie van zwaveldioxide (SO), stikstofoxiden (NO) en totaal stof van een grote stookinstallatie
      met een totaal nominaal thermisch ingangsvermogen van 100 MW of meer, wordt continu gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.2
    text: |-
      De emissieconcentratie van koolmonoxide van een met gasvormige brandstoffen gestookte grote stookinstallatie met
      een totaal nominaal thermisch ingangsvermogen van 100 MW of meer, wordt continu gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.3
    text: |-
      De emissieconcentratie van zwaveldioxide (SO), stikstofoxiden (NO) en totaal stof van een grote stookinstallatie
      en de emissieconcentratie van koolmonoxide van een met gas gestookte grote stookinstallaties, wordt periodiek
      tenminste om de zes maanden gemeten, tenzij op grond van het eerste of tweede lid continue meting is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.4
    text: |-
      In afwijking van het eerste lid wordt de emissieconcentratie van totaal stof periodiek tenminste om de zes maanden
      gemeten, indien een grote stookinstallatie met aardgas wordt gestookt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.5
    text: |-
      In afwijking van het eerste en derde lid is meting van zwaveldioxide (SO) niet verplicht en wordt de
      emissieconcentratie bepaald op grond van de gehalten in de ingezette brandstoffen, indien:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.5.a
    text: een grote stookinstallatie met aardgas wordt gestookt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.5.b
    text: een grote stookinstallatie met olie wordt gestookt en er geen uitrusting voor de ontzwaveling van afgas is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.5.c
    text: |-
      een grote stookinstallatie met biomassa wordt gestookt en de drijver van de inrichting kan aantonen dat die emissie
      in geen geval hoger is dan de toepasselijke emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.3.6
    text: |-
      Voor met steenkool of bruinkool gestookte installaties wordt de totale emissie van kwik periodiek ten minste één
      maal per jaar gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.3
  - number: 5.4.1
    text: |-
      Tot de continue metingen, bedoeld in [artikel 5.3][ref1], behoort tevens de meting van:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.1
        afdeling: '5.1'
  - number: 5.4.1.a
    text: het zuurstofgehalte;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.4
  - number: 5.4.1.b
    text: de temperatuur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.4
  - number: 5.4.1.c
    text: de druk;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.4
  - number: 5.4.1.d
    text: |-
      het waterdampgehalte van het afgas, tenzij het als monster gebruikte afgas wordt gedroogd alvorens de emissies in
      de lucht worden geanalyseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.4
  - number: 5.4.2
    text: |-
      De resultaten van de overeenkomstig deze afdeling verrichte metingen worden herleid tot een massaconcentratie bij
      het genormaliseerde zuurstofgehalte, bedoeld in [artikel 5.3, vierde lid, van het besluit][ref1], overeenkomstig
      de volgende formule: E = (21-O)/(21-O) x E, waarbij wordt verstaan onder: E = de berekende emissieconcentratie bij
      het genormaliseerde zuurstofgehalte E = de gemeten emissieconcentratie O = het genormaliseerde zuurstofgehalte O =
      het gemeten zuurstofgehalte


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.5.1
    text: |-
      De bemonsteringen, analyses en metingen van de parameters die nodig zijn om te bepalen of wordt voldaan aan de
      emissiegrenswaarden alsmede de andere metingen en berekeningen die in deze afdeling zijn voorgeschreven, worden
      uitgevoerd volgens onderstaande normbladen:
            Tabel 5.5






                    **Normbladen voor continue meting van emissies naar lucht**




                    Totaal stof


                    NEN-EN 13284-2




                    **Normbladen voor periodieke en parallelmetingen van emissies naar lucht**




                    Zwaveldioxide (SO)


                    NEN-EN 14791




                    Stikstofoxiden (NO)


                    NEN-EN 14792




                    Koolmonoxide


                    NEN-EN 15058




                    Totaal stof


                    NEN-EN 13284-1




                    Kwik


                    NEN-EN 13211




                    Zuurstof


                    NEN-EN 14789




                    Waterdamp


                    NEN-EN 14790




                    Debiet


                    ISO 10780




                    **Algemene normbladen voor kwaliteitsborging**




                    Kwaliteitsborging geautomatiseerde metingsystemen


                    NEN-EN 14181




                    Bekwaamheid laboratoria


                    NEN-EN-ISO/IEC 17025




                    Monsternamestrategie, meetdoel, -plan en -rapportage


                    NEN-EN 15259




                    Richtlijnen voor Predictive Emission Monitoring Systems (PEMS)


                    NTA 7379
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.5
  - number: 5.5.2
    text: |-
      Op de vaststelling van het zwavelgehalte van een brandstof is de [Regeling brandstoffen luchtverontreiniging][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029916
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0029916
  - number: 5.6.1
    text: |-
      Geautomatiseerde meetsystemen worden ten minste eenmaal per jaar met behulp van parallelmetingen met de
      referentiemeetmethoden, bedoeld in [artikel 5.5][ref1], gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.2
        afdeling: '5.1'
  - number: 5.6.2
    text: |-
      De drijver van de inrichting informeert het bevoegd gezag over de resultaten van de in het eerste lid bedoelde
      controle.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.6.3
    text: |-
      De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden worden
      berekend die getoetst worden aan een emissiegrenswaarde, is bij continue metingen niet groter dan de volgende
      percentages van de emissiegrenswaarde:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.6.3.a
    text: 'koolmonoxide: 10% van de emissiegrenswaarde;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.6.3.b
    text: 'zwaveldioxide (SO): 20% van de emissiegrenswaarde;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.6.3.c
    text: 'stikstofoxiden (NO): 20% van de emissiegrenswaarde;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.6.3.d
    text: 'totaal stof: 30% van de emissiegrenswaarde.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.6.4
    text: |-
      De gevalideerde uur- en daggemiddelden worden bij continue metingen vastgesteld op grond van de valide gemeten
      uurgemiddelden, na aftrek van de waarde van het in het derde lid vermelde 95%-betrouwbaarheidsinterval.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.6.5
    text: |-
      Indien in een dag meer dan drie uurgemiddelden ongeldig zijn wegens storing of onderhoud van het continu werkende
      meetsysteem, worden de metingen van die dag als ongeldig beschouwd. Indien per jaar de metingen van meer dan
      tien dagen ongeldig zijn, worden passende maatregelen getroffen om de betrouwbaarheid van het continu werkende
      meetsysteem te verbeteren.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.6
  - number: 5.7.1
    text: |-
      Het uitvoeren van periodieke metingen als bedoeld in [artikel 5.3][ref1] en parallelmetingen als bedoeld in
      [5.6][ref2] geschiedt door een rechtspersoon die voor deze verrichtingen geaccrediteerd is door een accreditatie-
      instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.1
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.2
        afdeling: '5.1'
  - number: 5.7.2
    text: |-
      Het bevoegd gezag wordt ten minste twee weken van tevoren op de hoogte gesteld van de datum en het tijdstip waarop
      een periodieke meting of een parallelmeting zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.7
  - number: 5.7.3
    text: |-
      Indien een afzonderlijke meting of parallelmeting geen doorgang vindt, wordt het bevoegd gezag uiterlijk op de
      datum voor de meting, bedoeld in het tweede lid, hiervan op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.7
  - number: 5.7.4
    text: Een periodieke meting bestaat uit een serie van ten minste drie deelmetingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.7
  - number: 5.7.5
    text: |-
      De duur van een deelmeting bedraagt een half uur. Wanneer het meettechnisch niet mogelijk is de deelmeting in die
      tijd uit te voeren, mag de deelmeting ten hoogste twee uur bedragen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.7
  - number: 5.7.6
    text: |-
      De duur van een parallelmeting die wordt uitgevoerd ten behoeve van de verificatie van de meetapparatuur voor
      continue metingen, bedraagt ten minste een half uur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.7
  - number: 5.7.7
    text: |-
      Bij periodieke metingen kan een door een rechtspersoon als bedoeld in het eerste lid aangetoonde
      95%-betrouwbaarheidsinterval op dezelfde wijze als [artikel 5.6, derde en vierde lid][ref1], worden
      verdisconteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1.2
        afdeling: '5.1'
  - number: 5.8.1
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarde wordt, voor zover continu wordt gemeten, in ieder geval voldaan
      indien in een kalenderjaar:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.8
  - number: 5.8.1.a
    text: geen gevalideerd maandgemiddelde de toepasselijke emissiegrenswaarde overschrijdt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.8
  - number: 5.8.1.b
    text: geen gevalideerd daggemiddelde 110% van de toepasselijke emissiegrenswaarde overschrijdt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.8
  - number: 5.8.1.c
    text: |-
      95% van alle gevalideerde uurgemiddelden over een jaar niet hoger is dan 200% van de toepasselijke
      emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Voor de toepassing van het eerste lid worden niet meegerekend: meetuitkomsten, verkregen tijdens periodes waarin
      een stookinstallatie op grond van [artikel 5.10][ref1] of [5.11 van het besluit][ref2] in werking mag zijn,
      meetuitkomsten verkregen tijdens storingen in de apparatuur die de emissiereductie bewerkstelligt en meetuitkomsten
      verkregen tijdens periodes van opstarten en stilleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.8.3
    text: |-
      De periodes van opstarten en stilleggen worden bepaald in overeenstemming met uitvoeringsbesluit van de Commissie
      van 7 mei 2012 betreffende de vaststelling van opstart- en stilleggingsperioden voor de toepassing van Richtlijn
      2010/75/EU van het Europees Parlement en de Raad inzake industriële emissies (2012/249/EU) (PbEU L 123).
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.8
  - number: 5.8.4
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarde wordt, voor zover periodiek wordt gemeten, in ieder geval voldaan
      indien geen enkele gevalideerde meetuitkomst de emissiegrenswaarde overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.8
  - number: 5.9.1
    text: |-
      De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage van
      de meting als bedoeld in [artikel 5.29, eerste lid, van het besluit][ref1] voldoet aan de eisen in de
      [artikelen 5.10 tot en met 5.24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: 5.9.2
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 5.29, tweede lid, onder a, van het besluit][ref1], wordt
      voldaan aan [artikel 5.26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
  - number: 5.9.3
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 5.29, tweede lid, onder b, van het besluit][ref1], wordt voldaan aan [artikel 5.25][ref2], [5.28][ref3]
      en [5.29][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
  - number: 5.9.4
    text: |-
      Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van
      verontreiniging van het oppervlaktewater als bedoeld in [artikel 5.29, tweede lid, onder c, van het besluit][ref1],
      wordt voldaan aan [artikel 5.28][ref2] en [5.29][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
  - number: 5.9.5
    text: |-
      Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in
      [artikel 5.29, tweede lid, onder d, van het besluit][ref1], wordt voldaan aan de [artikelen 5.25][ref2] en
      [5.27][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.5
        afdeling: '5.2'
  - number: 5.9.6
    text: |-
      Onder nominale capaciteit van een afvalverbrandings- of afvalmeeverbrandingsinstallatie wordt voor de
      toepassing van deze afdeling verstaan: gezamenlijke verbrandingscapaciteit van de ovens waaruit een
      afvalverbrandingsinstallatie of een afvalmeeverbrandingsinstallatie bestaat, zoals berekend door de fabrikant en
      bevestigd door de drijver van de inrichting, met inachtneming van de verbrandingswaarde van het afval, uitgedrukt
      als de hoeveelheid afval die per uur kan worden verbrand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.9
  - number: 5.10.1
    text: Metingen ter bepaling van de emissies zijn representatief.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Alle monitoringresultaten worden op zodanige wijze geregistreerd, verwerkt en gepresenteerd dat het bevoegd gezag
      kan controleren of wordt voldaan aan de toepasselijke emissiegrenswaarden en andere voorschriften.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.10
  - number: 5.11.1
    text: 'De emissies in de lucht van de volgende stoffen worden continu gemeten:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
  - number: 5.11.1.a
    text: zwaveldioxide (SO), totaal organische koolstof, zoutzuur, koolmonoxide, totaal stof en stikstofoxiden (NO);
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
  - number: 5.11.1.b
    text: |-
      waterstoffluoride, tenzij voor zoutzuur behandelingsstappen worden gevolgd die waarborgen dat de in de
      [artikelen 5.19][ref1], [5.20][ref2] en [5.22 van het besluit][ref3] voor zoutzuur opgenomen emissiegrenswaarden
      niet worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.11.2
    text: |-
      In het geval voor zoutzuur behandelingsstappen worden gevolgd die voldoen aan het eerste lid, onder b, wordt
      periodiek ten minste tweemaal per jaar gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
  - number: 5.11.3
    text: |-
      In afwijking van het eerste lid wordt het gehalte zoutzuur, waterstoffluoride of zwaveldioxide (SO) periodiek ten
      minste om de zes maanden gemeten, of worden er geen metingen verricht, indien de drijver van de afvalverbrandings-
      of afvalmeeverbrandingsinstallatie kan aantonen dat die emissie in geen geval hoger is dan de toepasselijke
      emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
  - number: 5.11.4
    text: |-
      In afwijking van het eerste lid wordt de emissie van stikstofoxide (NO) van een afvalverbrandingsinstallatie
      periodiek ten minste om de zes maanden gemeten, indien:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
  - number: 5.11.4.a
    text: de afvalverbrandingsinstallatie een nominale capaciteit heeft van minder dan 6 ton per uur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
  - number: 5.11.4.b
    text: |-
      vergunning is verleend of een ontvankelijke aanvraag om een vergunning is ingediend voor 28 december 2002 en de
      afvalverbrandingsinstallatie uiterlijk op 28 december 2004 in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
  - number: 5.11.4.c
    text: |-
      degene die de afvalverbrandingsinstallatie drijft, aan de hand van informatie over de kwaliteit van het betreffende
      afval, de gebruikte technologieën en de resultaten van de monitoring van de emissies aantoont dat emissies van
      stikstofoxiden in geen geval de emissiegrenswaarden, bedoeld in [artikel 5.19 van het besluit][ref1], kunnen
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.12.1
    text: 'De emissie in de lucht van de volgende stoffen wordt periodiek ten minste om de zes maanden gemeten:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.a
    text: antimoon;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.b
    text: arseen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.c
    text: cadmium;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.d
    text: chroom;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.e
    text: dioxinen en furanen
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.f
    text: kobalt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.g
    text: koper;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.h
    text: kwik;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.i
    text: lood;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.j
    text: mangaan;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.k
    text: nikkel;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.l
    text: thallium;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.1.m
    text: vanadium.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.2
    text: |-
      In afwijking van het eerste lid, wordt gedurende de eerste twaalf maanden dat een afvalverbrandings- of
      afvalmeeverbrandingsinstallatie in werking is, de emissie van de stoffen, genoemd in het eerste lid, periodiek ten
      minste om de drie maanden gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.3
    text: |-
      In afwijking van het eerste lid wordt het gehalte antimoon, arseen, cadmium, chroom, kobalt, koper, kwik, lood,
      mangaan, nikkel, thallium en vanadium periodiek eenmaal in de twee jaar gemeten en wordt het gehalte dioxinen en
      furanen eenmaal per jaar gemeten indien de drijver van de afvalverbrandings- of afvalmeeverbrandingsinstallatie:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.3.a
    text: |-
      aantoont dat de emissies in de lucht onder alle omstandigheden minder dan 50% bedragen van de van toepassing zijnde
      emissiegrenswaarden, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.12.3.b
    text: |-
      aantoont dat het te verbranden of mee te verbranden afval uitsluitend bestaat uit bepaalde gesorteerde brandbare
      fracties ongevaarlijk afval dat niet recycleerbaar is en aan de hand van informatie over de kwaliteit van het
      betreffende afval en over monitoring van de emissies aantoont dat de emissies in de lucht van de in het eerste lid
      genoemde stoffen onder alle omstandigheden aanmerkelijk lager liggen dan de toepasselijke emissiegrenswaarden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.12
  - number: 5.13.1
    text: |-
      Tot de continue metingen, bedoeld in [artikel 5.11][ref1], behoort tevens de meting van:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: 5.13.1.a
    text: het zuurstofgehalte;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.13
  - number: 5.13.1.b
    text: de temperatuur van de verbrandingskamer;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.13
  - number: 5.13.1.c
    text: de druk;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.13
  - number: 5.13.1.d
    text: |-
      het waterdampgehalte van het afgas, tenzij het als monster gebruikte afgas wordt gedroogd alvorens de emissies in
      de lucht worden geanalyseerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.13
  - number: 5.13.1.e
    text: de temperatuur van het afgas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.13
  - number: 5.13.2
    text: |-
      De temperatuur van de verbrandingskamer wordt dicht bij de binnenwand gemeten of op een ander door de drijver van
      de afvalverbrandings- of afvalmeeverbrandingsinstallatie aangetoond representatief punt. De overige parameters
      worden gemeten nabij de plaats waar de emissiemetingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.13
  - number: 5.14.1
    text: |-
      De verblijftijd, de minimumtemperatuur en het zuurstofgehalte van de afgassen worden vastgesteld op het moment dat
      de afvalverbrandings- of afvalmeeverbrandingsinstallatie in werking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.14
  - number: 5.14.2
    text: |-
      De verblijftijd, de minimumtemperatuur en het zuurstofgehalte van de afgassen worden tevens vastgesteld
      op het moment dat de afvalverbrandings- of afvalmeeverbrandingsinstallatie onder de meest ongunstige
      bedrijfsomstandigheden in werking is gesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.14
  - number: 5.15.1
    text: |-
      De emissiegrenswaarden voor water zijn van toepassing op het punt waar het bij de reiniging van afgassen
      ontstane afvalwater door de afvalverbrandings- of afvalmeeverbrandingsinstallatie wordt geloosd op een
      oppervlaktewaterlichaam.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.15
  - number: 5.15.2
    text: |-
      Wanneer het bij de reiniging van afgassen ontstane afvalwater buiten de afvalverbrandings- of
      afvalmeeverbrandingsinstallatie wordt gezuiverd in een zuiveringsinstallatie die uitsluitend voor de zuivering
      van dit type afvalwater is bestemd, mag bij het bepalen van de emissiegrenswaarden, bedoeld in het eerste lid,
      rekening worden gehouden met het effect van die zuiveringsinstallatie, op voorwaarde dat een equivalent niveau
      van bescherming van het milieu in zijn geheel wordt gewaarborgd en dat het niet leidt tot nadeligere gevolgen voor
      het milieu.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.15
  - number: 5.15.3
    text: |-
      Als het bij de reiniging van afgassen ontstane afvalwater tezamen met afvalwater afkomstig van een andere bron
      wordt gezuiverd, bepaalt degene die de afvalverbrandings- of afvalmeeverbrandingsinstallatie drijft aan de
      hand van passende massabalansberekeningen, met gebruikmaking van de resultaten van de metingen, bedoeld in de
      [artikelen 5.11][ref1], [5.12][ref2] en [5.13][ref3], het aandeel van de emissies in de uiteindelijk geloosde
      hoeveelheid afvalwater dat kan worden toegeschreven aan het bij de reiniging van afgassen ontstane afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: 5.16.1
    text: |-
      De volgende metingen worden op het punt, genoemd in [artikel 5.15, eerste lid][ref1], uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: 5.16.1.a
    text: continue metingen van de zuurgraad (pH), de temperatuur en het debiet;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
  - number: 5.16.1.b
    text: |-
      dagelijkse steekproefmetingen van de totale hoeveelheid onopgeloste bestanddelen of metingen van een met het debiet
      evenredige representatieve steekproef over een periode van 24 uur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
  - number: 5.16.1.c
    text: |-
      maandelijkse metingen van een met het debiet evenredige representatieve steekproef over een periode van 24 uur van
      kwik, cadmium, thallium, arseen, lood, chroom, koper, nikkel en zink;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
  - number: 5.16.1.d
    text: |-
      driemaandelijkse metingen van dioxinen en furanen gedurende de eerste bedrijfsperiode van twaalf maanden, gevolgd
      door zesmaandelijkse metingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
  - number: 5.16.2
    text: |-
      In een geval als bedoeld in [artikel 5.15, derde lid][ref1], verricht degene die de afvalverbrandings- of
      afvalmeeverbrandingsinstallatie drijft de metingen, bedoeld in het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: 5.16.2.a
    text: |-
      op de afvalwaterstroom van de afgasreinigingsprocessen vóór de uitmonding daarvan op de gezamenlijke
      afvalwaterzuiveringsinstallatie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
  - number: 5.16.2.b
    text: |-
      op de andere afvalwaterstroom of -stromen vóór de uitmonding daarvan op de gezamenlijke
      afvalwaterzuiveringsinstallatie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
  - number: 5.16.2.c
    text: op het punt waar het afvalwater na de zuivering wordt geloosd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.16
  - number: 5.17.1
    text: |-
      De resultaten van de overeenkomstig deze afdeling verrichte metingen worden herleid tot een massaconcentratie
      bij het genormaliseerde zuurstofgehalte, bedoeld in de [artikelen 5.19][ref1], [5.20][ref2] en
      [5.22 van het besluit][ref3], overeenkomstig de volgende formule: E = (21-O)/(21-O) x E, waarbij wordt
      verstaan onder: E = de berekende emissieconcentratie bij het genormaliseerde zuurstofgehalte E = de gemeten
      emissieconcentratie O = het genormaliseerde zuurstofgehalte O = het gemeten zuurstofgehalte


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.17.2
    text: |-
      In afwijking van het eerste lid mogen indien afvalstoffen in een met zuurstof verrijkte atmosfeer worden verbrand
      of meeverbrand, meetresultaten worden herleid tot een zuurstofgehalte waarvan de drijver van de afvalverbrandings-
      of afvalmeeverbrandingsinstallatie aantoont dat dit de bijzondere omstandigheden van het geval weergeeft.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.17
  - number: 5.17.3
    text: |-
      Indien de emissies in de lucht van stoffen, waarvoor bij [paragraaf 5.2 van het besluit][ref1]
      emissiegrenswaarden zijn gesteld, worden verminderd door behandeling van het afgas in een afvalverbrandings-
      of afvalmeeverbrandingsinstallatie waarin gevaarlijke afvalstoffen worden behandeld, geschiedt herleiding naar
      de in het eerste lid bedoelde zuurstofgehaltes alleen indien het in de desbetreffende periode voor de betrokken
      verontreinigende stof gemeten zuurstofgehalte hoger is dan het relevante genormaliseerde zuurstofgehalte.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0022762
        paragraaf: '5.2'
