    text: de mogelijkheden voor emissiebeperking in de toekomst worden gespecificeerd, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.14
  - number: 2.14.c
    text: informatie aan eenieder kan worden verstrekt over het verbruik en de emissie van oplosmiddelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.14
  - number: 2.15.1
    text: |-
      Een oplosmiddelenboekhouding als bedoeld in [artikel 2.14][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 2.15.1.a
    text: omvat een periode van twaalf maanden en wordt binnen dertien weken na afloop van die periode afgesloten, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.1.b
    text: voldoet aan het tweede tot en met het negende lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.2
    text: |-
      Ter controle op de naleving van een reductieprogramma als bedoeld in
      [artikel 2.29, tweede lid, van het besluit][ref1] wordt het oplosmiddelenverbruik berekend aan de hand van de
      volgende formule: V = I1 – O8.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.15.3
    text: |-
      Voor de berekening van de jaarlijkse referentie-emissie, bedoeld in [artikel 2.13, tweede lid][ref1], wordt de in
      coatings gebruikte hoeveelheid vaste stof bepaald overeenkomstig de formule, genoemd in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 2.15.4
    text: |-
      Ter controle op de naleving van een totale emissiegrenswaarde wordt de totale emissie berekend aan de hand van de
      volgende formule: E = F + O1.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.5
    text: |-
      Ter controle op de naleving van [artikel 2.30, derde lid, onder b, onder 2°, van het besluit][ref1] wordt de
      totale emissie van alle betrokken activiteiten bepaald en vergeleken met de totale emissie die zou zijn veroorzaakt
      als [artikel 2.29 van het besluit][ref2] voor elke activiteit afzonderlijk zou zijn nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.15.6
    text: |-
      Ter controle op de naleving van een diffuse emissiegrenswaarde wordt de diffuse emissie berekend aan de hand van
      een van de volgende formules:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.6.a
    text: F = I1 – O1 – O5 – O6 – O7 – O8, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.6.b
    text: F = O2 + O3 + O4 + O9.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.7
    text: |-
      De diffuse emissie wordt bepaald met behulp van een korte maar representatieve serie metingen of door
      middel van een gelijkwaardige berekeningsmethode. De bepaling behoeft niet te worden herhaald zolang de
      oplosmiddeleninstallatie niet wordt veranderd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.8
    text: |-
      De diffuse emissie wordt uitgedrukt als een percentage van de oplosmiddeleninput, berekend aan de hand van de
      volgende formule: I = I1 + I2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: 2.15.9
    text: |-
      Onder de in dit artikel genoemde symbolen wordt verstaan:






                    E


                    Totale emissie




                    F


                    Diffuse emissie




                    V


                    Verbruik




                    I


                    Input




                    I1


                    De hoeveelheid aangekochte organische oplosmiddelen als zodanig of in mengsels, die in het proces
      worden ingevoerd gedurende de termijn waarover de massabalans wordt bepaald.




                    I2


                    De hoeveelheid oplosmiddelenhergebruik. De teruggewonnen oplosmiddelen worden telkens meegerekend
      wanneer ze worden gebruikt om de activiteit uit te oefenen




                    O


                    Output




                    O1


                    De hoeveelheid vluchtige organische stoffen in de emissies via de schoorsteen




                    O2


                    Diffuse emissie van vluchtige organische stoffen in water, rekening houdend met de
      afvalwaterzuivering bij de berekening van O5




                    O3


                    Diffuse emissie van vluchtige organische stoffen in enig product, die als verontreiniging of als
      residu in de bij de activiteit vervaardigde producten achterblijft




                    O4


                    Diffuse emissie van vluchtige organische stoffen in de lucht




                    O5


                    Organische oplosmiddelen en/of organische verbindingen die door chemische of fysische reacties
      verloren gaan, met inbegrip van hoeveelheden organische oplosmiddelen die door verbranding, een andere zuivering
      van afgassen of door afvalwaterzuivering vernietigd worden of door adsorptie opgevangen worden, mits die niet bij
      O6, O7 of O8 worden meegerekend.




                    O6


                    Organische oplosmiddelen in ingezameld afval.




                    O7


                    Organische oplosmiddelen als zodanig of in mengsels die als een product met handelswaarde worden
      verkocht of bestemd zijn om te worden verkocht, met uitzondering van oplosmiddelen die vallen onder O3.




                    O8


                    De hoeveelheid organische oplosmiddelen, met inbegrip van organische oplosmiddelen in mengsels, die
      voor hergebruik is teruggewonnen maar niet opnieuw bij de activiteit wordt gebruikt en die niet onder O7 valt.




                    O9


                    De hoeveelheid vluchtige organische stoffen, die op andere wijze dan bedoeld onder O1 tot en met
      O8 vrijkomt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.15
  - number: '3.1'
    text: |-
      Ter beperking van de nadelige gevolgen voor het milieu als bedoeld in
      [artikel 3.5, tweede lid, van het besluit][ref1] wordt het huishoudelijk afvalwater bij lozing in de bodem geleid
      door een infiltratievoorziening die zodanig wordt uitgevoerd en onderhouden, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.1.a
    text: |-
      het vanuit de zuiveringsvoorziening geloosde water in de infiltratievoorziening niet in direct contact met het
      grondwater komt,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.1
  - number: 3.1.b
    text: de infiltratievoorziening geen hinder veroorzaakt, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.1
  - number: 3.1.c
    text: nadelige gevolgen voor de volksgezondheid worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      Ter beperking van de nadelige gevolgen voor het milieu als bedoeld in
      [artikel 3.5, derde lid, van het besluit][ref1] wordt het huishoudelijk afvalwater geleid door een
      zuiveringsvoorziening die voldoet aan het bepaalde in de [artikelen 3.3][ref2] en [3.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.1
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.1
        afdeling: '3.1'
  - number: '3.3'
    text: 'Een zuiveringsvoorziening bestaat uit een septic tank:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.3
  - number: 3.3.a
    text: met een nominale inhoud van ten minste 6 kubieke meter,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.3
  - number: 3.3.b
    text: die voldoet aan NEN-EN 12566-1, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.3
  - number: 3.3.c
    text: met een hydraulisch rendement van ten hoogste 10 gram, bepaald overeenkomstig annex B van NEN-EN 12566-1.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.3
  - number: '3.4'
    text: Een zuiveringsvoorziening
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4
  - number: 3.4.a
    text: is goed toegankelijk, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4
  - number: 3.4.b
    text: wordt zo vaak als voor de goede werking daarvan nodig is onderhouden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4
  - number: 3.4a.1
    text: |-
      Bij het in werking hebben van een zuiveringstechnisch werk verkeert de installatie in goede staat van onderhoud en
      worden bij onderhoudswerkzaamheden zodanige maatregelen getroffen dat geurhinder bij geurgevoelige objecten zoveel
      mogelijk wordt voorkomen dan wel voor zover dat niet mogelijk is tot een aanvaardbaar niveau wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4a
  - number: 3.4a.2
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt maatwerkvoorschriften
      stellen waarin maatregelen als bedoeld in het eerste lid worden geconcretiseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4a
  - number: 3.4b.1
    text: |-
      De geurbelasting, bedoeld in de [artikelen 3.5b, eerste en tweede lid][ref1] en
      [6.19b, tweede tot en met het vijfde lid van het besluit][ref2], wordt bepaald met de rekenmethode van het Nieuw
      Nationaal Model (Uitgave 1998, ISBN 90-76323-003) of een daaraan gelijkwaardige methode.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '6'
  - number: 3.4b.2
    text: |-
      De geuremissie vanuit een zuiveringstechnisch werk is de som van de emissies door de verschillende
      procesonderdelen, uitgedrukt in odour units per seconde, die worden bepaald met behulp van de emissiefactoren,
      genoemd in [bijlage 5][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.4b.3
    text: |-
      Indien voor een procesonderdeel als bedoeld in het tweede lid geen emissiefactor is opgenomen in [bijlage 5][ref1],
      kan het bevoegd gezag bij maatwerkvoorschrift aanvullend geuronderzoek eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0022830
  - number: 3.4b.4
    text: |-
      Het bevoegd gezag kan, indien de geurhinder als gevolg van het opslaan en verladen van slib
      een aanvaardbaar niveau overschrijdt en [artikel 3.5b, eerste en tweede lid][ref1], en
      [artikel 6.19b, tweede tot en met het vijfde lid, van het besluit][ref2] niet toereikend zijn om de overschrijding
      ongedaan te maken, aanvullend maatwerkvoorschriften stellen met betrekking tot de technische voorzieningen in het
      zuiveringtechnisch werk en te treffen gedragsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '6'
  - number: 3.4c
    text: |-
      Ten behoeve van het realiseren van een aanvaardbaar bodemrisico voldoet het ontwerp- en aanlegproces van bassins,
      tanks en leidingen in de waterlijn vanaf het ontvangstwerk tot de selector of de beluchtingstank aan CUR/PBV-
      Aanbeveling 51 en CUR/PBV-Aanbeveling 65 met uitzondering van de eisen gesteld in de paragrafen 4.1, 5.1, 6.1.1, en
      6.1.2 van CUR/PBV-Aanbeveling 51, alsmede paragraaf 5.2.1 van de CUR/PBV-Aanbeveling 65.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4c
  - number: 3.4d.1
    text: |-
      Ten behoeve van het realiseren van een aanvaardbaar bodemrisico gebeurt de controle op de lekdichtheid van de
      bedrijfsonderdelen van de zuiveringstechnische werken, bedoeld in [artikel 3.5a van het besluit][ref1], met een
      grondwatermonitoringssysteem dat bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.4d.1.a
    text: een horizontaal monitoringssysteem bij installaties aangelegd op of na 1 januari 2012,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4d
  - number: 3.4d.1.b
    text: verticale peilbuizen bij installaties aangelegd voor die datum.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4d
  - number: 3.4d.2
    text: |-
      In afwijking van het eerste lid kan gebruik worden gemaakt van geo-electrische metingen met een meetfrequentie van
      eenmaal per zes jaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4d
  - number: 3.4e.1
    text: |-
      Het horizontaal monitoringssysteem, bedoeld in [artikel 3.4d, eerste lid, onder a][ref1], bestaat uit horizontale
      buizen op een afstand van ten minste 30 meter van elkaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 3.4e.2
    text: |-
      Indien binnen een afstand van 60 meter, gemeten van hart tot hart, meerdere bassins of tanks zijn gesitueerd, wordt
      een extra horizontale buis geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
  - number: 3.4e.3
    text: |-
      Indien bassins of tanks op meer dan 60 meter, gemeten van hart tot hart, van elkaar zijn gesitueerd, wordt om de
      30 meter een horizontale buis geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
  - number: 3.4e.4
    text: Bij de plaatsing van de horizontale buizen wordt rekening gehouden met de stroomrichting van het grondwater.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
  - number: 3.4e.5
    text: |-
      De verticale peilbuizen, bedoeld in [artikel 3.4d, eerste lid, onder b][ref1], bevinden zich op een afstand van
      ten minste 30 meter van elkaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 3.4e.6
    text: |-
      Indien binnen een afstand van 60 meter, gemeten van hart tot hart, meerdere bassins of tanks zijn gesitueerd, wordt
      een extra verticale peilbuis geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
  - number: 3.4e.7
    text: |-
      Indien bassins of tanks op meer dan 60 meter, gemeten van hart tot hart, van elkaar zijn gesitueerd, wordt om de
      30 meter een verticale peilbuis geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
  - number: 3.4e.8
    text: De verticale peilbuis alsmede de plaatsing voldoet aan NEN 5766.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
  - number: 3.4e.9
    text: De verticale peilbuizen worden benedenstrooms ten opzichte van de stroming van het grondwater geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4e
  - number: 3.4f.1
    text: |-
      De achtergrondwaarden aan chemische zuurstofverbruik (CZV) en ammonium-stikstof (N-NH4) worden vastgesteld in het
      grondwater van een bovenstrooms geplaatste peilbuis.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.2
    text: |-
      Eenmaal per kalenderjaar wordt een gefiltreerd monster dat genomen is uit het horizontaal monitoringssysteem of uit
      de peilbuizen geanalyseerd op CZV en N-NH4. Tussen opeenvolgende monsternames ligt ten minste elf maanden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.3
    text: |-
      De resultaten van deze analyses worden eenmaal per twee kalenderjaren gerapporteerd aan het bevoegd gezag. De
      rapportage vindt plaats binnen twee maanden na de laatste van de monsternames, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.4
    text: |-
      Indien de gemeten waarden meer dan 50% hoger zijn dan de achtergrondwaarden wordt binnen twee maanden een nieuw
      grondwatermonster uit het monitoringssysteem geanalyseerd, alsmede een grondwatermonster uit de bovenstrooms
      geplaatste peilbuis.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.5
    text: |-
      Indien de gemeten waarden gedurende drie opeenvolgende waarnemingen gemiddeld meer dan 50% hoger zijn dan de
      achtergrondwaarden, wordt de meetfrequentie verhoogd naar twee monsters per jaar voor de desbetreffende peilbuis.
      Tussen opeenvolgende monsternames liggen ten minste vijf maanden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.6
    text: Meetwaardes die meer dan 50% hoger zijn dan de achtergrondwaarde, worden gerapporteerd aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.7
    text: |-
      Indien de gemeten waarden gedurende drie opeenvolgende waarnemingen gemiddeld meer dan 50% hoger zijn dan de
      achtergrondwaarden en de afwijking geweten kan worden aan bedrijfsmatige activiteiten:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.7.a
    text: worden de daarna te nemen monsters geanalyseerd op de stoffen, genoemd in NEN 5740, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.7.b
    text: wordt in overleg met en met instemming van het bevoegd gezag een herstelplan opgesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
  - number: 3.4f.8
    text: |-
      Het plaatsen van de peilbuizen, de analyses van de grondwatermonsters en het opstellen van de rapporten, bedoeld in
      het eerste tot en met zevende lid, en in [artikel 3.4e][ref1], worden uitgevoerd door een persoon of een instelling
      die daartoe beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4f
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0022929
  - number: 3.4g.1
    text: |-
      Indien de controle op de lekdichtheid, bedoeld in [artikel 3.4d][ref1], uitsluitend plaatsvindt via een
      grondwatermonitoringssysteem, worden ten minste één keer per 15 jaar de dilatatievoegen en onderlinge overgangen
      van bassins, tanks en leidingen visueel geïnspecteerd overeenkomstig AS 6700.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4g
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 3.4g.2
    text: |-
      De bevindingen worden vastgelegd in een logboek, dat in de inrichting aanwezig is of binnen een termijn die wordt
      gesteld door het bevoegd gezag voor deze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4g
  - number: 3.4ga
    text: |-
      Het bemonsteren van stedelijk afvalwater, het analyseren van de monsters en het beoordelen van de resultaten
      daarvan, bedoeld in [artikel 3.5g, eerste lid, van het besluit][ref1] vindt plaats overeenkomstig de
      [artikelen 3.4gb][ref2] en [3.4gc][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4ga
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 3.4gb.1
    text: |-
      Voor de toepassing van dit artikel wordt onder ‘het te zuiveren stedelijk afvalwater’ verstaan: het aangevoerde
      stedelijk afvalwater voor eventuele vermenging met een of meer deelstromen die bij het zuiveringsproces vrijkomen
      en die op het zuiveringtechnisch werk worden teruggevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.2
    text: |-
      De plaats van bemonstering wordt daar gekozen waar een zo representatief mogelijk beeld van de concentraties van de
      te bepalen parameters in het te zuiveren stedelijk afvalwater of in het na zuivering te lozen stedelijk afvalwater
      kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.3
    text: Het te zuiveren stedelijk afvalwater wordt volumeproportioneel over een etmaal bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.4
    text: |-
      Het na zuivering te lozen stedelijk afvalwater wordt, ingeval van een zuiveringtechnisch werk met een
      ontwerpcapaciteit van:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.4.a
    text: 'meer dan 100.000 inwonerequivalenten: volumeproportioneel over een etmaal bemonsterd, of'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.4.b
    text: 'ten hoogste 100.000 inwonerequivalenten: volumeproportioneel dan wel tijdproportioneel over een etmaal bemonsterd.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.5
    text: De na zuivering geloosde hoeveelheid stedelijk afvalwater wordt dagelijks bepaald.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.6
    text: |-
      Het minimum aantal te nemen monsters per jaar is afhankelijk van de ontwerpcapaciteit in inwonerequivalenten van
      het zuiveringtechnisch werk en wordt met gelijkmatige tussenpozen verdeeld over het jaar genomen conform:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.6.a
    text: |-
      tabel 3.4.gb1, met betrekking tot de vaststelling van de per zuiveringtechnisch werk te zuiveren en na zuivering
      geloosde hoeveelheid totaal stikstof en totaal fosfor;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.6.b
    text: |-
      tabel 3.4gb2, met betrekking tot de vaststelling per zuiveringtechnisch werk van het na zuivering geloosde
      biochemisch zuurstofverbruik gedurende vijf dagen, het chemisch zuurstofverbruik en de geloosde hoeveelheid
      onopgeloste stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.7
    text: |-
      Indien op grond van metingen aangetoond kan worden dat in het te zuiveren stedelijk afvalwater het gehalte aan
      nitriet- en nitraatstikstof voortdurend minder dan 1% is ten opzichte van het gehalte aan Kjeldahlstikstof, kan
      worden volstaan met de meting van het gehalte aan Kjeldahlstikstof in dat water.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gb.8
    text: De etmaalmonsters worden individueel geanalyseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gb
  - number: 3.4gc.1
    text: |-
      Het na zuivering te lozen stedelijk afvalwater voldoet aan de eisen, bedoeld in
      [artikel 3.5e, vijfde lid, van het besluit][ref1], indien voor iedere parameter afzonderlijk uit monsters van dat
      afvalwater blijkt dat het op de volgende wijze voldoet aan de grenswaarde voor de betreffende parameter:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gc
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.4gc.1.a
    text: |-
      voor de parameters biochemisch zuurstofverbruik, chemisch zuurstofverbruik en onopgeloste stoffen is het aantal
      monsters dat de grenswaarde van de betrokken parameter, genoemd in artikel 3.5e, vierde lid, van het besluit
      overschrijdt, niet hoger dan het in tabel 3.4gc opgenomen maximaal toegestaan aantal monsters.
