    text: de uitstroomrichting van de afblaasleiding, bedoeld in paragraaf 9.4 van PGS 25,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5aa
  - number: 6.5aa.2
    text: |-
