        - [Regeling amalgaamafscheiders tandartspraktijken milieubeheer][ref2]
        - [Regeling testmethoden amalgaamafscheiders tandartspraktijken milieubeheer][ref3]
        - [Aanwijzing vervangende tekst van Handleiding bodemsanering tankstations][ref4]
        - [Regeling slibvangputten en vet- of olie-afscheiders][ref5].


