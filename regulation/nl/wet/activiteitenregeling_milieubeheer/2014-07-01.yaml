  - number: 4.22.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.9 van het besluit][ref1], voldoet de opslag in verpakking van stoffen van ADR klasse 5.2 type C
      of het gebruik of de opslag in verpakking van stoffen van ADR klasse 5.2 type D tot en met F als bedoeld in
      [artikel 4.8 van het besluit][ref2], aan de [artikelen 4.23][ref3], [4.26][ref4] en [4.27][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel4
