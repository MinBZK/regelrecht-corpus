    text: |-
      Als spuitdoppen als bedoeld in
      [artikel 3.80, tweede lid, onderdeel a, onder 2°, en onderdeel b, onder 3°, van het besluit][ref1] worden
      aangewezen de in tabel 3.82 genoemde spuitdoppen voor zover deze worden gebruikt bij een spuitdruk die gelijk is
      aan of lager is dan de daarbij vermelde spuitdruk.
