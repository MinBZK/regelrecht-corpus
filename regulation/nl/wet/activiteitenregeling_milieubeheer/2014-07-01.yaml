    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.7
    text: |-
      Een dubbelwandige stationaire bovengrondse opslagtank van staal of kunststof met de daarbij behorende appendages en
      dubbelwandige leidingen wordt jaarlijks op de goede werking gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.8
    text: 'Bij de bovengrondse opslagtank, bedoeld in het eerste lid, vindt een jaarlijkse controle plaats:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.8.a
    text: van de kathodische bescherming van ondergrondse leidingen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.8.b
    text: van de lekdetectie van een dubbelwandige opslagtank en de dubbelwandige leidingen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.8.c
    text: |-
      van de aarding en de potentiaalvereffening van de vul- en dampretourleiding indien in de bovengrondse opslagtank
      vloeistoffen van PGS-klasse 1 en 2 zijn opgeslagen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.8.d
    text: |-
      op de aanwezigheid van water en bezinksel in een stalen bovengrondse opslagtank. Een jaarlijkse controle op de
      aanwezigheid van water en bezinksel is niet noodzakelijk indien vloeistoffen van PGS-klasse 4 in de bovengrondse
      tank zijn opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.9
    text: |-
      Een bovengrondse opslagtank wordt bij herkeuring inwendig gereinigd en beoordeeld door middel van betreding van
      de tank. Inwendige inspectie met behulp van een camera is toegestaan bij een volledig inwendig gecoate tank,
      indien deze inspectie wordt uitgevoerd overeenkomstig het daartoe krachtens het Besluit bodemkwaliteit aangewezen
      normdocument. Indien bij herkeuring een ondergrondse opslagtank niet kan worden betreden of, indien toegestaan,
      middels een camera-inspectie inwendig geïnspecteerd kan worden, wordt de opslagtank afgekeurd. Het gebruik van de
      opslagtank is in geval van afkeuring toegestaan tot de uiterste herkeuringsdatum.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.10
    text: |-
      Het bevoegd gezag kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan, bij maatwerkvoorschrift het derde lid niet van toepassing
      verklaren en toestaan dat een opslagtank zich op een verdieping bevindt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.11
    text: |-
      Bij een maatwerkvoorschrift als bedoeld in het tiende lid kunnen eisen worden gesteld om de toegankelijkheid van de
      opslagtank voor de brandbestrijding te borgen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.12
    text: |-
      In afwijking van het achtste lid vindt de controle, bedoeld in onderdeel d van dat lid, eenmaal per drie jaar
      plaats indien de opslagtank aantoonbaar is voorzien van een inwendige coating overeenkomstig BRL K779 en die
      coating is aangebracht door een bedrijf dat daartoe is gecertificeerd op basis van BRL K790.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.13
    text: |-
      Indien tijdens de controle, bedoeld in het achtste lid, onderdeel d, water of bezinksel is aangetroffen, wordt dit
      terstond verwijderd. Van het verwijderde water worden de elektrische geleidbaarheid en de zuurgraad beoordeeld.
      Wanneer bij de derde opeenvolgende meting blijkt dat de zuurgraad en de elektrische geleidbaarheid van het in
      het bezinksel aangetroffen water buiten de normeisen vallen, wordt een inwendige inspectie van de bovengrondse
      opslagtank uitgevoerd. Indien een inwendige inspectie noodzakelijk is, wordt dit terstond gemeld aan het bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.14
    text: |-
      In afwijking van het negende en dertiende lid is een inwendige beoordeling of inwendige inspectie bij de keuring
      van een bovengrondse opslagtank niet noodzakelijk indien deze opslagtank dubbelwandig is uitgevoerd met een
      lekdetectiesysteem in de wand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71d.15
    text: |-
      Het eerste tot en met het veertiende lid is niet van toepassing op het opslaan van afgewerkte olie van een
      gasgestookte warmtekrachtinstallatie waaraan geen stoffen zijn toegevoegd en welke geen lager vlampunt heeft dan 55
      graden celsius.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71d
  - number: 3.71e
    text: |-
      De opslag van gasolie in mobiele bovengrondse opslagtanks inclusief de bijbehorende leidingen en appendages,
      voldoet aan bijlage D van PGS 30.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71e
  - number: 3.71f.1
    text: De opslag van gasolie, smeerolie en afgewerkte olie in bovengrondse opslagtanks vindt plaats boven een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71f
  - number: 3.71f.2
    text: |-
      Het eerste lid is niet van toepassing op een opslagtank die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie dat ten minste eenmaal per jaar wordt beoordeeld en is goedgekeurd overeenkomstig het daartoe krachtens
      het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een persoon of instelling, die daartoe beschikt
      over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71f
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.71f.3
    text: |-
      De vulpunten en aftappunten van een bovengrondse opslagtank met gasolie, smeerolie en afgewerkte olie zijn
      geplaatst boven een vloeistofdichte vloer of verharding of boven of in een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71f
  - number: 3.71f.4
    text: De opslagtank en de vulleiding zijn voorzien van een overvulbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71f
  - number: 3.71f.5
    text: |-
      Het vierde lid is niet van toepassing op een opslagtank voor afgewerkte olie die handmatig of onder vrij verval
      gevuld wordt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71f
  - number: 3.71f.6
    text: |-
      Boven de lekbak, bedoeld in het eerste lid, vindt geen opslag van andere gevaarlijke stoffen plaats, indien die
      kunnen reageren met de stoffen in de bovengrondse opslagtank.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71f
  - number: 3.71g.1
    text: |-
      De opslag van gasolie, smeerolie en afgewerkte olie in bovengrondse opslagtanks boven een oppervlaktewaterlichaam
      vindt plaats boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en in staat is de bij
      normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71g.2
    text: |-
      Het eerste lid is niet van toepassing op een opslagtank die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie dat ten minste eenmaal per jaar wordt beoordeeld en is goedgekeurd overeenkomstig het daartoe krachtens
      het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een persoon of instelling, die daartoe beschikt
      over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.71g.3
    text: |-
      De vulpunten en aftappunten van een bovengrondse opslagtank met gasolie, smeerolie en afgewerkte olie boven een
      oppervlaktewaterlichaam zijn geplaatst boven of in een voorziening die zich rondom of onder de opgeslagen stoffen
      bevindt en die de bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen kan opvangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71g.4
    text: 'De voorzieningen, bedoeld in het eerste en derde lid, zijn zodanig uitgevoerd dat:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71g.4.a
    text: gemorste of gelekte vloeistoffen effectief worden opgevangen en kunnen worden opgeruimd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71g.4.b
    text: |-
      er geen hemelwater op of in terecht kan komen, tenzij het hemelwater regelmatig van of uit de voorziening wordt
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71g.5
    text: |-
      De voorzieningen, bedoeld in het eerste en derde lid, zijn bestand tegen de inwerking van de opgeslagen stoffen en
      de condities waaronder deze stoffen worden gebruikt of opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71g.6
    text: |-
      De voorziening, bedoeld in het eerste lid, heeft een opvangcapaciteit van ten minste 10% van de inhoud van alle
      opgeslagen stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71g.7
    text: De opslagtank en de vulleiding zijn voorzien van een overvulbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71g
  - number: 3.71h.1
    text: |-
      De [artikelen 3.71d][ref1], [3.71f][ref2] en [3.71g][ref3] zijn niet van toepassing op een bovengrondse opslagtank
      met gasolie, smeerolie of afgewerkte olie die niet op de vloer staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71h
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.9
        afdeling: '3.4'
  - number: 3.71h.2
    text: |-
      Aan de in het eerste lid bedoelde bovengrondse opslagtanks die niet op de vloer staan, kan het bevoegd gezag
      ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, maatwerkvoorschriften stellen met betrekking tot de plaats, de constructie, de
      keuring, de bodem- en veiligheidsvoorzieningen van de opslagtank.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.71h
  - number: 3.72.1
    text: 'Voor het meten van:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
  - number: 3.72.1.a
    text: |-
      de hoeveelheid drainwater, bedoeld in [artikel 3.67, eerste lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.72.1.b
    text: |-
      de hoeveelheid voedingswater, bedoeld in [artikel 3.72, eerste lid, onderdeel a, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.72.1.c
    text: |-
      de hoeveelheid drainagewater, bedoeld in [artikel 3.72, eerste lid, onderdeel b, van het besluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.72.1.d
    text: |-
      de hoeveelheid drainagewater, bedoeld in [artikel 3.72, eerste lid, onderdeel c, van het besluit][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.72.2
    text: |-
      Een volumemeter wordt ten minste eenmaal per drie jaar op de goede werking gecontroleerd en onderhouden door een
      deskundige op het gebied van volumemeters.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
  - number: 3.72.3
    text: Een bewijs van de controle en het onderhoud is binnen de inrichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
  - number: 3.72.4
    text: |-
      Het bevoegd gezag kan, indien het belang van de bescherming van het milieu daartoe noodzaakt, bij
      maatwerkvoorschrift eisen stellen aan de verzegeling van de volumemeter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.72
  - number: '3.73'
    text: |-
      De rapportage, bedoeld in de [artikelen 3.68, eerste lid][ref1], en [3.73, eerste lid, van het besluit][ref2] vindt
      plaats met gebruikmaking van het model dat is opgenomen in [bijlage 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0022830
  - number: '3.74'
    text: |-
      De volgorde van lozen, bedoeld in [artikel 3.63, vierde lid, onderdeel b, van het besluit][ref1] is:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.74.a
    text: huishoudelijk afvalwater;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.74
