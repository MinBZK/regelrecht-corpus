    text: |-
      goederen die in een open systeem worden getransporteerd zodanig worden bevochtigd, dat verstuiving wordt voorkomen,
      of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.50
  - number: 3.50.2.b
    text: |-
      open transportsystemen in de buitenlucht worden afgeschermd tegen windinvloeden door middel van langsschermen,
      dwarsschermen of halfronde overkappingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.50
  - number: 3.50.3
    text: |-
      Onverminderd [artikel 3.49][ref1] wordt aan de [artikelen 3.38][ref2] en
      [3.32, aanhef en onder a en b, van het besluit][ref3] bij continu mechanisch transport van goederen behorend tot
      stuifklasse S3 van bijlage 4.6 van de NeR in ieder geval voldaan indien goederen in open transportsystemen in
      de buitenlucht worden afgeschermd tegen windinvloeden door middel van langsschermen, dwarsschermen of halfronde
      overkappingen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3
