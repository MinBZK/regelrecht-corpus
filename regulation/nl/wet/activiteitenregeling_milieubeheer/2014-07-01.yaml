    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.s
    text: |-
      bouwstoffen, als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref1] die binnen dat besluit toepasbaar
      zijn, uitgezonderd IBC-bouwstoffen, cellenbeton, dakafval en asfalt;


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel1
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '1'
  - number: 2.9.1.t
    text: textiel;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.u
    text: verpakkingsglas;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.v
    text: vlakglas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.2
    text: |-
      In aanvulling op het eerste lid zijn de categorieën voor dakafval ontstaan bij werkzaamheden die buiten de
      inrichting zijn verricht door degene die de inrichting drijft:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.2.a
    text: teerhoudend dakafval;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.2.b
    text: bitumineus dakafval;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.2.c
    text: composiet dakafval, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.2.d
    text: dakgrind verkleefd met teer of bitumen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: '2.10'
    text: |-
      De monitoring van emissies, het opstellen van een reductieprogramma, het opstellen van een
      oplosmiddelenboekhouding en de emissiemetingen ter controle op de naleving van de emissiegrenswaarden, bedoeld in
      [artikel 2.32 van het besluit][ref1], voldoen aan de eisen gesteld in de [artikelen 2.11 tot en met 2.15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 2.11.1
    text: |-
      Degene die een oplosmiddeleninstallatie drijft, meet continu of een afgaskanaal, waarop nabehandelingsapparatuur
      is aangesloten en die aan de uitlaatzijde gemiddeld in totaal meer dan 10 kilogram totaal organische koolstof
      per uur uitwerpt, voldoet aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.11.2
    text: |-
      In een oplosmiddeleninstallatie die gemiddeld in totaal minder dan 10 kilogram totaal organische koolstof per uur
      uitwerpt, voert degene die de oplosmiddeleninstallatie drijft, om de drie jaar metingen uit van totaal organische
      koolstof, waarbij gedurende elke meting ten minste drie meetresultaten worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.11
  - number: 2.11.3
    text: |-
      Metingen ter controle op de naleving van de emissiegrenswaarden zijn niet vereist indien nabehandelingsapparatuur
      niet noodzakelijk is om te voldoen aan het [besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 2.12.1
    text: |-
      Bij continue metingen is aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29, eerste lid, van het besluit][ref1], voldaan indien onder normale
      bedrijfsomstandigheden:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.12.1.a
    text: |-
      het 24-uursgemiddelde voor een bepaalde stof de daarvoor geldende emissiegrenswaarde niet overschrijdt, waarbij
      het 24-uursgemiddelde wordt berekend van alle geldige metingen gedurende een periode van 24 uur waarin een
      oplosmiddeleninstallatie onder normale omstandigheden in bedrijf is, met uitzondering van het opstarten en
      stilleggen van de installatie en het onderhoud van de apparatuur, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
  - number: 2.12.1.b
    text: geen van de uurgemiddelden hoger is dan 1,5 maal de emissiegrenswaarden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Bij periodieke metingen is aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29, eerste lid, van het besluit][ref1], voldaan indien bij die meting:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.12.2.a
    text: het gemiddelde van alle meetresultaten onder normale omstandigheden de emissiegrenswaarden niet overschrijdt, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
  - number: 2.12.2.b
    text: geen van de uurgemiddelden onder normale omstandigheden hoger is dan 1,5 maal de emissiegrenswaarden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
  - number: 2.12.3
    text: |-
      Of aan de emissiegrenswaarden, bedoeld in [artikel 2.30, tweede lid, van het besluit][ref1] wordt voldaan,
      wordt vastgesteld op basis van de som van de massaconcentraties van de verschillende betrokken vluchtige
      organische stoffen. Of aan de emissiegrenswaarden, niet zijnde de diffuse-emissiegrenswaarden, en de totale
      emissiegrenswaarden, bedoeld in [artikel 2.29, eerste lid, van het besluit][ref2] wordt voldaan, wordt vastgesteld
      op basis van de totale massa organische koolstof die wordt uitgestoten, tenzij in tabel 2.28a van het besluit
      anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.12.4
    text: |-
      Gasvolumes mogen worden toegevoegd om de afgassen af te koelen of te verdunnen indien dit technisch gerechtvaardigd
      is. De toegevoegde gasvolumes worden niet betrokken bij het vaststellen van de massaconcentratie van de
      verontreinigende stof in het afgas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Bij de opzet van een reductieprogramma als bedoeld in [artikel 2.29, tweede lid, van het besluit][ref1], worden in
      ieder geval de volgende factoren betrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.13.1.a
    text: |-
      indien vervangingsproducten met weinig of geen oplosmiddelen nog in ontwikkeling zijn, heeft degene die een
      oplosmiddeleninstallatie drijft, extra tijd voor de uitvoer van het reductieprogramma;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
  - number: 2.13.1.b
    text: |-
      het referentiepunt voor de emissiebeperking komt zo goed mogelijk overeen met de emissie die het resultaat zou zijn
      als er geen beperkende maatregelen zouden worden genomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Aan een gelijkwaardige emissiebeperking als bedoeld in [artikel 2.29, tweede lid, van het besluit][ref1]
      wordt bij een oplosmiddeleninstallatie waar voor het product een constant gehalte aan vaste stof kan worden
      aangenomen, in ieder geval voldaan indien de feitelijke emissie van oplosmiddelen, bepaald aan de hand van de
      oplosmiddelenboekhouding, kleiner is dan of gelijk is aan de beoogde emissie, die als volgt wordt berekend:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 2.13.2.a
    text: 'bereken de jaarlijkse referentie-emissie als volgt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
  - number: 2.13.2.a.1°
    text: |-
      bepaal de totale massa aan vaste stof in de hoeveelheid coating, inkt, lak of kleefstof die per jaar wordt
      gebruikt, waarbij onder vaste stof wordt verstaan elk materiaal in coating, inkt, lak en kleefstof dat vast wordt
      wanneer het water of de vluchtige organische stoffen zijn verdampt, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
  - number: 2.13.2.a.2°
    text: vermenigvuldig de bepaalde massa vaste stof met de in tabel 2.13 vermelde toepasselijke vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
  - number: 2.13.2.b
    text: vermenigvuldig de jaarlijkse referentie-emissie met het in tabel 2.13 vermelde toepasselijke reductiepercentage.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.13
  - number: 2.13.3
    text: |-
      De vermenigvuldigingsfactor, bedoeld in het tweede lid, mag voor een individuele oplosmiddeleninstallatie worden
      aangepast om rekening te houden met een aangetoonde stijging van het rendement bij het gebruik van vaste stoffen.
            Tabel 2.13










