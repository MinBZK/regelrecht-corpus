    text: |-
      de afgezogen gasvormige emissies die vrijkomen bij het solderen met zure vloeimiddelen, worden gevoerd door een
      gaswasser of een aërosol- of mistfilter die geschikt is om aan [artikel 4.46 van het besluit][ref1] te voldoen,
      en die gaswasser aërosol- of mistfilter in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo
      vaak als voor de goede werking nodig is, wordt schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.59
