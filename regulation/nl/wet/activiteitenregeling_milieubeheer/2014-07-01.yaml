                  **Normbladen voor de bemonstering en analyse van afvalwater**




                  Bemonstering


                  NEN 6600-1




                  Ontsluiting


                  NEN-EN-ISO 15587




                  Onopgeloste bestanddelen


                  NEN-EN 872




                  Kwik


                  NEN-EN 1483




                  Cadmium, Thallium, Lood, Chroom, Koper, Nikkel, Zink Antimoon, Kobalt, Mangaan, Vanadium, Tin


                  NEN-EN-ISO 17294-2




                  Arseen


                  NEN-EN-ISO 17294-2
                  NEN-EN-ISO 11969




                  Zuurgraad (pH)


                  NEN-ISO 10523




                  Dioxinen en furanen


                  De analyse van dioxinen en furanen wordt uitgevoerd door middel van dubbelkoloms gaschromatografie
      (GC) gekoppeld aan massaspectrometrie (MS). Zowel de waterfase als de zwevende stof worden op dioxinen en furanen
      geanalyseerd. Voor het bepalen van de recovery van de analysetechniek wordt gebruik gemaakt van gelabelde interne
      standaards.




                  **Normblad Totale hoeveelheid organische koolstof in slakken en bodemas**




                  Totale hoeveelheid organische koolstof


                  BRL 2307




