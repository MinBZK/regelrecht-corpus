        artikel: '3'
  - number: 3.83.1
    text: |-
      Een waarschuwingssysteem als bedoeld in [artikel 3.80, tweede lid, onderdeel b, onder 1°, van het besluit][ref1]
      voldoet aan het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.83.2
    text: |-
      Het waarschuwingssysteem voorziet ten minste eenmaal per dag gedurende zes dagen per week in een advies over het
      bespuiten van het gewas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.83
  - number: 3.83.3
    text: 'Het advies is gebaseerd op:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.83
  - number: 3.83.3.a
    text: een berekening van de kans op infectie door botrytis op grond van de verwachte temperatuur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.83
  - number: 3.83.3.b
    text: de verwachte bladnatperiode, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.83
  - number: 3.83.3.c
    text: de gevoeligheid van het gewas voor botrytis.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.83
  - number: 3.83.4
    text: Het advies is tevens gebaseerd op een weersvoorspelling voor de regio waar de teelt plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.83
  - number: 3.84.1
    text: |-
      De testmethode, bedoeld in [artikel 3.83, tweede lid, onder b, van het besluit][ref1] waarmee het driftarme
      karakter van spuitdoppen wordt vastgesteld, voldoet aan de [artikelen 3.85 tot en met 3.89][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.84
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.84.2
    text: 'Aan de testmethode, bedoeld in het eerste lid, zijn in ieder geval gelijkwaardig:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.84
  - number: 3.84.2.a
    text: |-
      testmethoden op grond van het Local Environmental Risk Assesment for Pesticides Scheme gericht op de classificatie
      van driftreducerende technieken met twee of meer sterren door middel van LERAP-low drift star rating, uitgevoerd
      door het Silsoe Reseach Institute te Bedford en het Central of Science Laboratory te York, Verenigd Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.84
  - number: 3.84.2.b
    text: |-
      testmethoden op grond van de Richtlinien für die Prüfung von Planzenschutzmitteln und Planzenschutzgeräten
      Teil VII 1-2.3.3 Verfahren zur Eintragung von Planzenschutzgeräten in den Abschnitt Abtrift des Verzeichnisses
      Verlustmindernde Geräte' gericht op het onderscheiden van driftreducerende technieken in de driftreductieklasse van
      50% of meer, uitgevoerd door het Julius Kühn-Institut, Duitsland.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.84
  - number: 3.85.1
    text: |-
      De testmethode, bedoeld in [artikel 3.84][ref1] bestaat uit een test waarbij per spuitdop van een bepaald type en
      een bepaalde grootte gebruik wordt gemaakt van:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.85
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.85.1.a
    text: |-
      drie testdoppen die zijn geselecteerd overeenkomstig de in [artikel 3.86][ref1] beschreven procedure;


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.85
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.85.1.b
    text: |-
      een referentiedop zijnde de grensdop van de klasse fijn en midden volgens de British Crop Protection Council
      (BCPC)-klassificatie (31-030-F110 bij 3 bar) zoals deze is vastgesteld op 7 en 8 april 1997.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.85
  - number: 3.85.2
    text: Bij de test wordt leidingwater als spuitvloeistof gebruikt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.85
  - number: 3.86.1
    text: |-
      Per spuitdop van een bepaald type en een bepaalde grootte als bedoeld in [artikel 3.85, eerste lid][ref1], worden
      uit een willekeurige partij ongebruikte en onbeschadigde spuitdoppen tien doppen genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.86.2
    text: De vloeistofafgifte in liters per minuut van de doppen wordt gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.86
  - number: 3.86.3
    text: De mediaan van de vloeistofafgiftes wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.86
  - number: 3.86.4
    text: |-
      De drie doppen waarvan de vloeistofafgifte het dichtst bij de mediaan ligt, gelden als de testdoppen, bedoeld in
      [artikel 3.85, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.86
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.87.1
    text: |-
      De druppelgroottekarakteristieken DV10, DV50(VMD), DV90 en het volumepercentage V100 van de testdoppen en
      de referentiedop, bedoeld in [artikel 3.85][ref1], worden gemeten volgens de methode die is beschreven in
      [artikel 3.88][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.87
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.87.2
    text: |-
      Bij het meten wordt het door de producent aangegeven drukbereik van de doppen aangehouden. Binnen het drukbereik
      wordt in stappen van 0,5 bar gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.87
  - number: 3.87.3
    text: |-
      Bij het meten van de druppelgroottekarakteristieken van niet-standaard hydraulische spuitdoppen worden tevens de
      door de producent aangegeven driftarme instellingen van de dop aangehouden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.87
  - number: 3.87.4
    text: |-
      Bij het meten van de druppelgroottekarakteristieken van de referentiedop wordt een werkdruk van drie bar
      aangehouden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.87
  - number: 3.87.5
    text: |-
      Het meten van de druppelgroottekarakteristieken van de referentiedop vindt direct aansluitend op het meten van de
      druppelgroottekarakteristieken van de testdoppen plaats.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.87
  - number: 3.87.6
    text: |-
      Het meten van de druppelgroottekarakteristieken van de testdoppen en de referentiedop vindt plaats met dezelfde
      meetinstrumenten en meetinstellingen en onder dezelfde meetomstandigheden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.87
  - number: 3.88.1
    text: |-
      De druppelgroottekarakteristieken, bedoeld in [artikel 3.87][ref1], worden op een afstand van 0,35 meter of 0,50
      meter onder de uitstroomopening van de dop gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.88.2
    text: Tijdens het meten wordt een minimale meethoogte van 0,50 meter boven het grondoppervlak aangehouden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.3
    text: De doppen spuiten verticaal naar beneden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.4
    text: De spuitkegel wordt in ten minste vijf banen gescand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.5
    text: |-
      Het meetpatroon is zodanig ingericht dat de banen gelijkmatig zijn verdeeld over de breedte van de kegel en
      evenwijdig lopen aan de hoofdas van de elliptische doorsnede van de spuitkegel.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.6
    text: De middelste baan loopt door het centrum van de spuitkegel.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.7
    text: De banen bestrijken de hele horizontale kegeldoorsnede.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.8
    text: Indien het scannen baan voor baan wordt uitgevoerd, vinden baanwisselingen buiten de spuitkegel plaats.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.9
    text: De horizontale scansnelheid is niet hoger dan 5% van de gemiddelde verticale druppelsnelheid op meethoogte.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.10
    text: Het meten wordt zodanig uitgevoerd dat een representatief deel van de spuitkegel wordt bemonsterd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.11
    text: Aan het tiende lid wordt in elk geval voldaan, indien per dop 10.000 druppels zijn gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.12
    text: Per dop wordt driemaal gemeten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.13
    text: |-
      Het gemiddelde van de resultaten van de drie metingen wordt per druppelgroottekarakteristiek berekend en geldt als
      de waarde van de respectievelijke druppelgroottekarakteristieken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
  - number: 3.88.14
    text: |-
      Wanneer de meting van de druppelgroottekarakteristieken niet door een deskundig en onafhankelijk instituut als
      bedoeld in [artikel 3.83, tweede lid, onderdeel a, van het besluit][ref1] is uitgevoerd, beoordeelt dat instituut
      de juistheid van de meting aan de hand van de waarde, berekend overeenkomstig het dertiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.88
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: '3.89'
    text: |-
      Een spuitdop van een bepaald type en een bepaalde grootte als bedoeld in [artikel 3.85, eerste lid][ref1], waarvan
      het volumepercentage V100 bij een bepaalde spuitdruk lager is dan 50% van het volumepercentage V 100 van de met die
      dop geteste referentiedop, wordt voor die spuitdruk aangemerkt als driftarme dop.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.89
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: '3.90'
    text: |-
      Een keuringsverklaring als bedoeld in [artikel 3.83, tweede lid, onderdeel a, van het besluit][ref1] bevat in ieder
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.90.a
    text: een aanduiding van de merknaam, het type en de grootte van de testdoppen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.b
    text: |-
      een overzicht van de druppelgroottekarakteristieken van de testdoppen, gemeten overeenkomstig de
      [artikelen 3.87][ref1] en [3.88][ref2] en de daarbij gemeten referentiedop;


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.90.c
    text: 'een aanduiding van:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.c.1°
    text: de meetinstrumenten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.c.2°
    text: de meetinstellingen en meetomstandigheden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.c.3°
    text: het spuitdrukbereik in stappen van 0,5 bar, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.c.4°
    text: de driftarme instellingen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.d
    text: |-
      gegevens waaruit blijkt dat bij het meten van de testdoppen en de referentiedop de horizontale scansnelheid niet
      hoger is dan 5% van de gemiddelde verticale druppelsnelheid op meethoogte;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.e
    text: de locatie en de datum waarop het meten van de testdoppen en de referentiedop heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.90.f
    text: |-
      gegevens over de vloeistofafgifte van de doppen, gemeten overeenkomstig [artikel 3.86][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.90.g
    text: |-
      de naam van het deskundige, onafhankelijke instituut dat verantwoordelijk is voor de afgifte van de
      keuringsverklaring.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.90
  - number: 3.91.1
    text: |-
      Een drukregistratievoorziening als bedoeld in
      [artikel 3.83, derde lid, onderdeel a, en vierde lid, van het besluit][ref1] voldoet aan het tweede tot en met
      zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.91.2
    text: |-
      Een drukregistratievoorziening bevat een druksensor waarvan de afwijking van de nauwkeurigheid, bij een werkdruk
      van ten hoogste 8 bar, ten hoogste 0,2 bar bedraagt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
  - number: 3.91.3
    text: Een actuele drukregistratie vindt in de tijd plaats met ten minste een waarneming per tien seconden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
  - number: 3.91.4
    text: De geregistreerde gegevens worden ten minste gedurende een uur bewaard.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
  - number: 3.91.5
    text: De drukregistratievoorziening geeft aan of de voorziening in werking is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
  - number: 3.91.6
    text: 'Voor het aflezen van de gegevens, bedoeld in het vierde lid, is de drukregistratievoorziening voorzien van:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
  - number: 3.91.6.a
    text: een scherm, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
  - number: 3.91.6.b
    text: een USB-aansluiting.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.91
  - number: 3.92.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen dan wel voor zover
      dat niet mogelijk is het zoveel mogelijk beperken van de verontreiniging van het grondwater als bedoeld in
      [artikel 3.94, onder a en b, van het besluit][ref1] wordt bij het aanmaken of het transporteren via vaste leidingen
      van gewasbeschermingsmiddelen, biociden of bladmeststoffen ten minste voldaan aan het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.92.2
    text: |-
      Vaste leidingen voor het transport van gewasbeschermingsmiddelen, biociden of bladmeststoffen of een oplossing
      daarvan, worden bovengronds gelegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.92
  - number: 3.92.3
    text: |-
      Mengsels of oplossingen van gewasbeschermingsmiddelen, biociden of bladmeststoffen worden aangemaakt in en vanuit
      speciaal daartoe bestemd vaatwerk.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.92
  - number: 3.92.4
    text: |-
      Het binnen een inrichting aanmaken van mengsels en oplossingen als bedoeld in het derde lid vindt plaats boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.92
  - number: 3.92.5
    text: |-
      Gemorste droge gewasbeschermingsmiddelen, biociden of bladmeststoffen worden terstond droog opgenomen en gemorste
      vloeibare gewasbeschermingsmiddelen, biociden of bladmeststoffen worden terstond geïmmobiliseerd en in een speciaal
      daartoe bestemd vat gebracht. Daartoe zijn voldoende materialen en absorberende middelen voor onmiddellijk gebruik
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.92
  - number: 3.93.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, als bedoeld in [artikel 3.94, onder c, van het besluit][ref1] wordt bij de aanmaak
      en het gebruik van gewasbeschermingsmiddelen, biociden of bladmeststoffen ten minste voldaan aan het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.93.2
    text: |-
      Pompen, vaatwerk en leidingen voor het aanmaken en doseren van gewasbeschermingsmiddelen, biociden of
      bladmeststoffen staan niet in rechtstreekse vaste verbinding met een drinkwaterleiding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.93
  - number: 3.93.3
    text: |-
      Drinkwater dat wordt gebruikt voor het aanmaken van gewasbeschermingsmiddelen, biociden of bladmeststoffen wordt
      uitsluitend door middel van een onderbreektank aan de waterleiding onttrokken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.93
  - number: 3.94.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.98 van het besluit][ref1] wordt bij het toepassen van gewasbeschermingsmiddelen of biociden in
      dompelbaden en douche-installaties ten minste voldaan aan het tweede tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.94
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.94.2
    text: |-
      Een dompelbad of een douche-installatie waarin wordt gewerkt met gewasbeschermingsmiddelen of biociden is opgesteld
      boven een lekbak of een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.94
  - number: 3.94.3
    text: |-
      Gedompelde producten en de tijdens het dompelen gebruikte emballage waar nog gewasbeschermingsmiddelen of biociden
      uit kunnen lekken, worden boven het dompelbad, een vloeistofdichte vloer of verharding of een lekbak bewaard.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.94
  - number: 3.94.4
    text: |-
      Gedouchte producten en de tijdens het douchen gebruikte emballage waar nog gewasbeschermingsmiddelen of biociden
      uit kunnen lekken, worden in de douche-installatie, boven een vloeistofdichte vloer of verharding of een lekbak
      bewaard.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.94
  - number: 3.94.5
    text: |-
      Een buitenopslag voor gedompelde of gedouchte producten of voor tijdens het dompelen gebruikte emballage is tegen
      inregenen beschermd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.94
  - number: 3.94.6
    text: |-
      Het bevoegd gezag kan, indien het belang van de bescherming van de bodem daartoe noodzaakt, bij maatwerkvoorschrift
      eisen stellen aan de locatie en de opstelling van het dompelbad of de douche-installatie, de gedompelde of
      gedouchte producten en de emballage, bedoeld in het tweede tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.94
  - number: 3.95.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.109 van het besluit][ref1] wordt bij het composteren voldaan aan het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.95
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.95.2
    text: |-
      Indien binnen een periode van drie jaar gedurende een periode die langer is dan twee weken, maar korter dan negen
      maanden, op één plaats wordt gecomposteerd, is de composteringshoop in de periode van 1 november tot 1 maart
      afgedekt met vezeldoek, antiworteldoek of gelijkwaardig materiaal.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.95
  - number: 3.95.3
    text: |-
      Indien binnen een periode van drie jaar gedurende een periode die langer is dan negen maanden op één plaats wordt
      gecomposteerd, is de composteringshoop:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.95
  - number: 3.95.3.a
    text: |-
      in de periode van 1 september tot en met 31 maart afgedekt met vezeldoek, antiworteldoek of gelijkwaardig
      materiaal, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.95
  - number: 3.95.3.b
    text: |-
      geplaatst boven een adsorberende laag met een dikte van ten minste 0,15 meter en een organische stofgehalte van ten
      minste 25%.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.95
  - number: 3.95.4
    text: |-
      Indien de composteringshoop wordt verwijderd, wordt de adsorberende laag, bedoeld in het derde lid, onderdeel b,
      eveneens verwijderd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.95
  - number: 3.96.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.122 van het besluit][ref1] is de vloer van een dierenverblijf of een deel daarvan waaraan geen
      mestkelder is verbonden, ten minste vloeistofkerend uitgevoerd. [Artikel 2.3][ref2] is daarbij niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.96
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 3.96.2
    text: |-
      [Artikel 2.11, eerste tot en met negende lid, van het besluit][ref1] is niet van toepassing op een dierenverblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.96
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 3.97.1
    text: |-
      Voor het vastleggen van de capaciteit en de totale maximale ventilatiebehoefte, bedoeld in
      [artikel 3.125, tweede lid, van het besluit][ref1] is een opleveringsverklaring binnen de inrichting aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.97.2
    text: 'In de opleveringsverklaring, bedoeld in het eerste lid, zijn ten minste de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.a
    text: |-
      het maximale aantal landbouwhuisdieren per diercategorie per luchtwassysteem en de maximale ventilatiebehoefte van
      deze dieren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.b
    text: de maximale capaciteit van het luchtwassysteem in kubieke meter per uur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.c
    text: het aanstroomoppervlak van het filterpakket in vierkante meter;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.d
    text: de afmetingen, het volume en de samenstelling van het filterpakket;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.e
    text: de afmetingen van de drukkamer;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.f
    text: de drukval over het filterpakket in pascal;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.g
    text: het zuurverbruik in liters per dag in geval van een chemische wasstap;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.h
    text: het elektriciteitsverbruik van de waswaterpomp in kilowatt uur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.i
    text: het spuiwaterdebiet in liters per uur en de spuifrequentie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.97.2.j
    text: het waswaterdebiet in liters per uur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.97
  - number: 3.98.1
    text: |-
      Ten behoeve van een evenredige verdeling van de stallucht over het aanstroomoppervlak van het filterpakket van het
      luchtwassysteem als bedoeld in [artikel 3.125, derde lid, van het besluit][ref1] wordt voldaan aan het tweede tot
      en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.98
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.98.2
    text: |-
      Het doorstroomoppervlak van het luchtkanaal bedraagt ten minste een vierkante centimeter per kubieke meter lucht
      bij de maximale capaciteit van het luchtwassysteem.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.98
  - number: 3.98.3
    text: |-
      De afstand tussen de ventilatoren die de lucht uit het huisvestingssysteem zuigen en het filterpakket is ten minste
      drie meter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.98
  - number: 3.98.4
    text: |-
      In afwijking van het derde lid bedraagt de vrije ruimte voor het filterpakket ten minste een meter als de
      ventilatoren na het filterpakket zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.98
  - number: 3.98.5
    text: |-
      Indien voor het filterpakket een reinigingsstap is geplaatst zonder filterpakket worden de afstanden, bedoeld in
      het derde en vierde lid, gemeten tot deze reinigingsstap.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.98
  - number: 3.99.1
    text: |-
      In een elektronisch monitoringsysteem als bedoeld in [artikel 3.125, vijfde lid, van het besluit][ref1] worden
      ieder uur de waarden van in ieder geval de volgende parameters geregistreerd:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.99.1.a
    text: de zuurgraad van het waswater;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.99.1.b
    text: de geleidbaarheid van het waswater in milliSiemens per centimeter;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.99.1.c
    text: de spuiwaterproductie in kubieke meter;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.99.1.d
    text: de drukval over het filterpakket in pascal;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.99.1.e
    text: het elektriciteitsverbruik van de waswaterpomp in kilowatt uur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.99.2
    text: |-
      Van de parameters, genoemd in het eerste lid, onderdelen c en e, worden tevens de cumulatieve waarden
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.99.3
    text: |-
      Het waswater van het luchtwassysteem is voorzien van een debietmeting en een laagdebietalarmering die onmiddellijk
      in werking treedt als het debiet van het waswater te laag is voor een goede werking van het luchtwassysteem.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.99.4
    text: De geregistreerde waarden van de parameters worden gedurende ten minste vijf jaar binnen de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.99
  - number: 3.100.1
    text: |-
      Voor de registratie van de parameters, bedoeld in [artikel 3.125, vijfde lid, van het besluit][ref1] zijn
      doelmatige meetvoorzieningen aanwezig die voldoen aan het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.100
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.100.2
    text: |-
      Voor het meten van de spuiwaterproductie is per spuiwaterstroom in de spuileiding een elektromagnetische flowmeter
      geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.100
  - number: 3.100.3
    text: |-
      Ten minste eenmaal per zes maanden worden de EC-elektrode en de pH-elektrode gekalibreerd door een deskundige op
      het gebied van het kalibreren van elektrodes.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.100
  - number: 3.100.4
    text: Bewijzen van de kalibraties worden gedurende ten minste vijf jaar binnen de inrichting bewaard.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.100
  - number: '3.101'
    text: |-
      In de gedragsvoorschriften, bedoeld in [artikel 3.125, zevende lid, van het besluit][ref1] wordt ten minste
      aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.101
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.101.a
    text: |-
      wanneer en op welke wijze de schoonmaak en het onderhoud van het luchtwassysteem door een deskundige op het gebied
      van luchtwassystemen zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.101
  - number: 3.101.b
    text: |-
      wanneer en op welke wijze de visuele controles en schoonmaak van het luchtwassysteem door de drijver van de
      inrichting zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.101
  - number: 3.101.c
    text: |-
      op welke wijze de waarden en instellingen van het luchtwassysteem die bepalend zijn voor de goede werking worden
      gecontroleerd, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.101
  - number: 3.101.d
    text: |-
      welke maatregelen als bedoeld in [artikel 3.125, zesde lid, van het besluit][ref1] worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.101
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: '3.102'
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken van
      geurhinder als bedoeld in [artikel 3.129b, van het besluit][ref1] vindt het bereiden van brijvoer ten minste plaats
      in een gesloten ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.102
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.103.1
    text: |-
      Ten behoeve van het voorkomen, dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in [artikel 3.132 van het besluit][ref1], worden afgezogen dampen en gassen van het
      bereiden van voedingsmiddelen als bedoeld in [artikel 3.130, onder b, c en d, van het besluit][ref2] die naar de
      buitenlucht worden geëmitteerd:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.103.1.a
    text: |-
      ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen bebouwing
      afgevoerd; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.103.1.b
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.103.2
    text: |-
      Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder, bedoeld in [artikel 3.132 van het besluit][ref1], worden dampen die vrijkomen bij het bereiden van
      voedingsmiddelen, bedoeld in [artikel 3.130, onder b, van het besluit][ref2], in een ruimte bij grillen, anders
      dan met houtskool, dan wel frituren of bakken in olie of vet, afgezogen en voordat zij in de buitenlucht worden
      afgevoerd, geleid door een doelmatig verwisselbaar of reinigbaar vetvangend filter.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.103.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende
      lucht van een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met
      minder dan één gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.103.4
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissies die niet
      via de afzuiging worden afgevoerd of incidentele geurpieken, in aanvulling op het eerste lid, met inachtneming van
      de NeR, maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.103.4.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.103.4.b
    text: de situering van het emissiepunt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.103.4.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.103.4.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.103
  - number: 3.104.1
    text: |-
      Ten behoeve van het voorkomen, dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in de [artikelen 3.135][ref1] en [3.136 van het besluit][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.104.1.a
    text: |-
      wordt bij het slachten van dieren als bedoeld in [artikel 3.133, onder a, van het besluit][ref1] ten minste de
      vaste dierlijke mest die vrijkomt bij het slachten in afgesloten, lekvrije tonnen of bakken opgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.104.1.b
    text: |-
      worden afgezogen dampen en gassen van het broeien of koken van dierlijke bijproducten als bedoeld in
      [artikel 3.133, onder a, van het besluit][ref1], indien deze op de buitenlucht worden geëmitteerd:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.104.1.b.1°
    text: |-
      ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd;
      of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.104.1.b.2°
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.104.2
    text: |-
      Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissie die niet via
      de afzuiging wordt afgevoerd of incidentele geurpieken, in aanvulling op het eerste lid, onder b, met inachtneming
      van de NeR, maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.104.2.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het eerste lid, onder b;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.104.2.b
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.104.2.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.104.2.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.104.3
    text: |-
      In afwijking van het eerste lid, onder b, kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar
      niveau overschrijdt en de bevoegdheden, bedoeld in het tweede lid, onvoldoende zijn om de overschrijding ongedaan
      te maken, met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.104
  - number: 3.105.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.135 van het besluit][ref1] vindt het pekelen van dierlijke bijproducten en organen als bedoeld in
      [artikel 3.133, onder a en d, van het besluit][ref2] plaats boven een bodembeschermende voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.105
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.105.2
    text: |-
      Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      verontreiniging van een oppervlaktewaterlichaam en ter bescherming van de doelmatige werking van voorzieningen
      voor het beheer van afvalwater als bedoeld in [artikel 3.135 van het besluit][ref1] worden bij het pekelen van
      dierlijke bijproducten en organen, bedoeld in [artikel 3.133, onder a en d, van het besluit][ref2], ten minste de
      gemorste of gelekte stoffen zoveel mogelijk zonder verder toevoegen van water opgeruimd en afgevoerd als afvalstof
      en wordt zoveel mogelijk voorkomen dat deze stoffen in het afvalwater terecht kunnen komen. Deze werkwijze wordt
      opgenomen in de bedrijfsinterne procedures en werkinstructies, bedoeld in [artikel 2.3, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.105
