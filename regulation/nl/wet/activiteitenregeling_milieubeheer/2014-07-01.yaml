    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.3
    text: |-
      Een dubbelwandige ondergrondse opslagtank van staal met de daarbij behorende appendages en dubbelwandige leidingen
      wordt jaarlijks gecontroleerd op de goede werking.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.4
    text: 'Bij de ondergrondse opslagtank, bedoeld in het eerste lid, vindt jaarlijks een controle plaats van:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.4.a
    text: de lekdetectie van een dubbelwandige opslagtank en de dubbelwandige leidingen, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.4.b
    text: |-
      de aarding en de potentiaalvereffening van de vul- en dampretourleiding indien in de ondergrondse opslagtank
      vloeistoffen van PGS-klasse 1 en 2 zijn opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.5
    text: |-
      Een ondergrondse opslagtank wordt bij herkeuring inwendig gereinigd en beoordeeld door middel van betreding van de
      tank. Inwendige inspectie met behulp van een camera is toegestaan bij een volledig inwendig gecoate tank, indien
      deze inspectie wordt uitgevoerd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument. Indien bij herkeuring een ondergrondse opslagtank niet kan worden betreden of, indien toegestaan,
      middels een camera-inspectie inwendig geïnspecteerd kan worden, wordt de opslagtank afgekeurd. Het gebruik van de
      opslagtank is in geval van afkeuring toegestaan tot de uiterste herkeuringsdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.35.6
    text: |-
      In afwijking van het tweede lid wordt een ondergrondse opslagtank eenmaal per tien jaar herkeurd indien de
      ondergrondse opslagtank is gelegen in een grondwaterbeschermingsgebied.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.7
    text: |-
      In afwijking van het tweede lid wordt een ondergrondse opslagtank waarin afgewerkte olie is opgeslagen ten minste
      eenmaal per vijf jaar beoordeeld en gekeurd. De tank wordt daarbij ook inwendig beoordeeld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.8
    text: |-
      In afwijking van het vierde lid vindt de controle, bedoeld in [artikel 3.36, vijfde lid][ref1], eenmaal per drie
      jaar plaats indien de opslagtank aantoonbaar is voorzien van een inwendige coating overeenkomstig BRL K779 en die
      coating is aangebracht door een bedrijf dat daartoe is gecertificeerd op basis van BRL K790.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.35.9
    text: |-
      Een ondergrondse opslagtank waarvan het vermoeden bestaat dat deze lek is of in een slechte toestand verkeert,
      wordt terstond op dichtheid gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.10
    text: Een ondergrondse opslagtank waarin afgewerkte olie wordt opgeslagen, wordt ten minste eenmaal per jaar geleegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.35.11
    text: |-
      Indien een beoordeling als bedoeld in het eerste, vijfde of zevende lid of een controle als bedoeld in het
      eerste, vierde, achtste, negende lid of als bedoeld in [artikel 3.36, zesde lid][ref1], leidt tot afkeuring van
      de ondergrondse opslagtank, wordt dit terstond gemeld aan het bevoegd gezag. Na de afkeuring wordt binnen acht
      weken het opslaan van vloeistoffen in de ondergrondse opslagtank beëindigd en wordt de vloeistof die zich in de
      opslagtank bevindt, verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.35.12
    text: |-
      In afwijking van het vijfde, zevende lid en [artikel 3.36, zesde lid][ref1], is een inwendige beoordeling of
      inwendige inspectie bij de keuring van een ondergrondse opslagtank niet noodzakelijk indien deze opslagtank
      dubbelwandig is uitgevoerd met een lekdetectiesysteem in de wand.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.35.13
    text: Een elektronisch lekdetectiesysteem voldoet aan de voorschriften 2.2.5 tot en met 2.2.7 van PGS 28.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
  - number: 3.36.1
    text: |-
      Een kathodische bescherming wordt ten minste eens per jaar op zijn goede werking gecontroleerd overeenkomstig
      het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.36.2
    text: |-
      Plaatsen waar de uitwendige bekleding van de installatie is beschadigd en die niet kunnen worden gerepareerd,
      worden kathodisch beschermd indien de isolatieweerstand van de uitwendige bekleding groter is dan 25 kOhm per
      vierkante meter, bepaald volgens een daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument,
      door een instelling, die daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.36.3
    text: |-
      Indien uit de controle, bedoeld in het eerste lid, blijkt dat de kathodische bescherming niet goed functioneert,
      wordt deze direct hersteld overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.36.4
    text: |-
      Indien een ondergrondse opslagtank van staal of de daarbij behorende stalen leidingen of appendages niet zijn
      voorzien van een kathodische bescherming, wordt ten minste eens per jaar een stroomopdrukproef uitgevoerd
      overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een
      instelling, die voor deze werkzaamheid beschikt over een erkenning op grond van dat besluit, tenzij de specifieke
      elektrische weerstand van de bodem meer bedraagt dan 100 ohmmeter en beschadiging van de tankinstallatie door
      zwerfstromen niet te verwachten is.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.36.5
    text: |-
      Bij de ondergrondse opslagtank, bedoeld in [artikel 3.35, eerste lid][ref1], vindt jaarlijks een controle plaats op
      de aanwezigheid van water en bezinksel. Een jaarlijkse controle op de aanwezigheid van water en bezinksel is niet
      noodzakelijk indien vloeistoffen van PGS-klasse 4 in de ondergrondse opslagtank zijn opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.36.6
    text: |-
      Indien tijdens de controle, bedoeld in het vijfde lid, water of bezinksel is aangetroffen, wordt dit terstond
      verwijderd. Van het verwijderde water worden de elektrische geleidbaarheid en de zuurgraad beoordeeld. Wanneer bij
      de derde opeenvolgende meting blijkt dat de zuurgraad en de elektrische geleidbaarheid van het in het bezinksel
      aangetroffen water buiten de normeisen vallen, wordt een inwendige inspectie van de ondergrondse opslagtank
      uitgevoerd. Indien een inwendige inspectie noodzakelijk is, wordt dit terstond gemeld aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.36
  - number: 3.37.1
    text: |-
      Een ondergrondse opslagtank met de daarbij behorende leidingen en appendages die is afgekeurd, wordt binnen acht
      weken na afloop van de termijn, bedoeld in [artikel 3.35, tweede lid][ref1], verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.37.2
    text: |-
      Degene die een ondergrondse opslagtank overeenkomstig het eerste lid verwijdert, verwijdert de ondergrondse
      opslagtank met de daarbij behorende leidingen en appendages binnen acht weken na het verstrijken van de
      keuringstermijn. Indien verwijdering als gevolg van de ligging redelijkerwijs niet kan worden gevergd wordt de
      ondergrondse opslagtank met de daarbij behorende leidingen en appendages binnen acht weken na het verstrijken van
      de keuringstermijn onklaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
  - number: 3.37.3
    text: |-
      Het verwijderen of het onklaar maken van een ondergrondse opslagtank met de daarbij behorende leidingen
      en appendages geschiedt overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit en wordt ten minste
      tien dagen voor aanvang van de werkzaamheden schriftelijk gemeld aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.37.4
    text: |-
      Na het verwijderen of het onklaar maken van de ondergrondse opslagtank met de daarbij behorende leidingen en
      appendages wordt een door een bedrijf als bedoeld in het derde lid, opgestelde schriftelijke rapportage van het
      verwijderen of het onklaar maken binnen drie maanden na afronding van de werkzaamheden aan het bevoegd gezag
      overgelegd. In deze rapportage worden ten minste vermeld:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
  - number: 3.37.4.a
    text: het adres waar de opslagtank is gelegen met een nadere aanduiding van de situering;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
  - number: 3.37.4.b
    text: de vloeistoffen die in de opslagtank opgeslagen zijn geweest, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
  - number: 3.37.4.c
    text: indien de opslagtank onklaar gemaakt is, de wijze van het onklaar maken en de toegepaste vulmassa.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
  - number: 3.37.5
    text: Voordat een ondergrondse opslagtank onklaar wordt gemaakt wordt deze inwendig gereinigd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
  - number: 3.37.6
    text: |-
      Indien de ondergrondse opslagtank onklaar wordt gemaakt, wordt de ondergrondse opslagtank na het inwendig reinigen
      gevuld met een inerte vulmassa overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit en wordt het
      vulpunt verwijderd, dan wel worden andere maatregelen getroffen, die verder gebruik voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.37.7
    text: |-
      Het inwendig reinigen van een ondergrondse opslagtank vindt plaats overeenkomstig een krachtens het
      [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een instelling, die daartoe beschikt over een
      erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.38.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico of het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken
      van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan
      als bedoeld in [artikel 3.30 van het besluit][ref1], wordt bij het opslaan van stoffen als bedoeld in
      [artikel 3.29, onder a tot en met j, van het besluit][ref2] in ondergrondse opslagtanks alsmede het vullen en
      legen van deze opslagtanks voldaan aan de volgende onderdelen van PGS 28:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.38.1.a
    text: de voorschriften 2.3.3 en 3.2.3 tot en met 3.2.5;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.38
  - number: 3.38.1.b
    text: de paragrafen 3.3 en 5.2, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.38
  - number: 3.38.1.c
    text: de voorschriften 6.2.6 en 6.2.8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.38
  - number: 3.38.2
    text: |-
      Indien een ondergrondse opslagtank die gebruikt is voor opslag van afgewerkte olie gebruikt gaat worden voor
      het opslaan van een andere vloeistof dan afgewerkte olie vindt voor de wisseling van de opgeslagen vloeistof een
      beoordeling en goedkeuring van de opslagtank plaats overeenkomstig [artikel 3.35, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.38.3
    text: |-
      Met inachtneming van de opslagcapaciteit, de aard van de opgeslagen vloeistoffen en de aard van de inrichting wordt
      bij inrichtingen waar lichte olie wordt afgeleverd een noodplan opgesteld overeenkomstig bijlage C van PGS 28. Dit
      noodplan is aanwezig bij de inrichting overeenkomstig de voorschriften 6.2.2 en 6.2.3 van PGS 28.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.38
  - number: 3.38.4
    text: Het legen van een ondergrondse opslagtank met afgewerkte olie vindt plaats overeenkomstig paragraaf 3.5 van PGS 28.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.38
  - number: '3.39'
    text: |-
      Voor de toepassing van [artikel 3.31, vierde lid, van het besluit][ref1] worden onder inerte goederen, in ieder
      geval de volgende goederen verstaan, voor zover deze niet verontreinigd zijn met bodembedreigende stoffen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.39.a
    text: |-
      bouwstoffen als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref1] die binnen dat besluit toepasbaar
      zijn, uitgezonderd IBC-bouwstoffen als bedoeld in dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel1
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '1'
  - number: 3.39.b
    text: |-
      grond en baggerspecie als bedoeld in [artikel 39 van het Besluit bodemkwaliteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel39
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '39'
  - number: 3.39.c
    text: A-hout en ongeshredderd B-hout;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.d
    text: snoeihout;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.e
    text: banden van voertuigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.f
    text: |-
      autowrakken waaruit alle vloeistoffen zijn afgetapt bij een autodemontagebedrijf en wrakken van tweewielige
      motorvoertuigen waaruit alle vloeistoffen zijn afgetapt bij een demontagebedrijf voor tweewielige motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.g
    text: straatmeubilair;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.h
    text: tuinmeubilair;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.i
    text: aluminium, ijzer, roestvrij staal;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.j
    text: |-
      kunststof anders dan lege, ongereinigde verpakkingen van voedingsmiddelen, smeerolie, verf, lak of drukinkt,
      gewasbeschermingsmiddelen, biociden of gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.k
    text: |-
      kunststofgeïsoleerde kabels anders dan oliedrukkabels, gepantserde papier-loodkabels en papiergeïsoleerde
      grondkabels;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.l
    text: papier en karton;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.m
    text: textiel en tapijt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.39.n
    text: vlakglas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.39
  - number: 3.40.1
    text: |-
      Aan [artikel 3.32, aanhef en onder c, van het besluit][ref1] wordt bij buitenopslag van goederen in ieder geval
      voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.40.1.a
    text: op de laad- en loskade tot 2 meter uit de kaderand of oever geen opslag van goederen plaatsvindt, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.40
  - number: 3.40.1.b
    text: er een deugdelijke keerwand aanwezig is en er geen product tussen de keerwand en de kade of oever ligt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.40
  - number: 3.40.2
    text: |-
      Om te voldoen aan [artikel 3.32, aanhef en onder c, van het besluit][ref1] wordt bij het laden en lossen van
      schepen het schoonmaken van grijpers zo uitgevoerd dat overslagresten of spoelwater niet in het oppervlaktewater
      geraken.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.41.1
    text: |-
      Aan [artikel 3.32, aanhef en onder c, van het besluit][ref1] wordt bij het laden en lossen van schepen met inerte
      goederen voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.41.1.a
    text: |-
      bij het laden en lossen van inerte goederen de afstand tussen wal en schip zo klein mogelijk is, en in ieder geval
      niet groter is dan 5 meter, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.41
  - number: 3.41.1.b
    text: het schip, waarin of waaruit wordt overgeslagen, met de wal wordt verbonden door een ponton of een morsklep.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.41
  - number: 3.41.2
    text: |-
      Aan [artikel 3.32, aanhef en onder c, van het besluit][ref1] wordt bij het laden en lossen van schepen met andere
      goederen dan inerte goederen voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.41.2.a
    text: |-
      bij het laden en lossen van gevaarlijke stoffen, CMR-stoffen en goederen waaruit vloeibare bodembedreigende stoffen
      kunnen lekken de afstand tussen wal en schip zo klein mogelijk is, en in ieder geval niet groter is dan 1 meter,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.41
  - number: 3.41.2.b
    text: |-
      bij het laden en lossen van andere goederen dan inerte goederen, en dan de goederen, bedoeld onder a, de afstand
      tussen wal en schip zo klein mogelijk is, en in ieder geval niet groter is dan 2 meter, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.41
  - number: 3.41.2.c
    text: het schip, waar in of uit wordt overgeslagen, met de wal wordt verbonden door een ponton of een morsklep.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.41
  - number: 3.42.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van verontreiniging van het oppervlaktewater worden
      goederen die boven een oppervlaktewaterlichaam worden opgeslagen en waaruit vloeibare bodembedreigende stoffen
      kunnen lekken, opgeslagen boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en de bij
      normale bedrijfsvoering gemorste of wegspattende vloeistoffen kan opvangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.42
  - number: 3.42.2
    text: |-
      Op de voorziening, bedoeld in het eerste lid, is [artikel 2.4][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
        afdeling: '2.1'
  - number: 3.42.3
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van verontreiniging van het oppervlaktewater staan
      goederen waaruit vloeibare bodembedreigende stoffen kunnen lekken en die boven het oppervlaktewater bovendeks
      aanwezig zijn, opgesteld:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.42
  - number: 3.42.3.a
    text: |-
      boven een voorziening die zich rondom of onder de opgeslagen goederen bevindt en in staat is en de bij normale
      bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen en zodanig is uitgevoerd dat er geen hemelwater
      op of in terecht kan komen, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.42
  - number: 3.42.3.b
    text: |-
      boven een doelmatige fysieke voorziening die vrijgekomen stoffen keert zolang als nodig is om met daarop
      afgestemde maatregelen te voorkomen dat deze stoffen in een oppervlaktewaterlichaam kunnen geraken.
      [Artikel 2.3, tweede tot en met achtste lid][ref1], zijn van overeenkomstige toepassing, met dien verstande dat
      voor ‘bodem’ wordt gelezen ‘oppervlaktewaterlichaam’.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 3.43.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het opslaan van goederen waaruit vloeibare
      bodembedreigende stoffen kunnen lekken, plaats boven een vloeistofdichte vloer of verharding of in gesloten
      verpakking, die voldoet aan de ADR-eisen voor vergelijkbare stoffen of anderszins deugdelijk is, boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
  - number: 3.43.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico worden goederen, waaruit in een significante
      hoeveelheid bodembedreigende stoffen kunnen uitlogen, en die niet vallen onder het eerste lid, en restafval dat
      dergelijke stoffen kan bevatten, opgeslagen boven een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
  - number: 3.43.3
    text: |-
      In afwijking van het tweede lid vindt de opslag plaats boven een bodembeschermende voorziening indien deze zodanig
      tegen inregenen is beschermd dat uitlogen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
  - number: 3.43.4
    text: |-
      In afwijking van het tweede lid vindt de opslag van zink plaats boven een bodembeschermende voorziening, indien
      opslag overeenkomstig het derde lid redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
  - number: 3.43.5
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat voor de opslag van andere metalen dan zink het tweede lid
      niet van toepassing is, indien opslag conform het derde lid redelijkerwijs niet mogelijk is, de opslag plaatsvindt
      boven een bodembeschermende voorziening, en het belang van de bescherming van het milieu zich daartegen niet
      verzet.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
  - number: 3.43.6
    text: |-
      C-hout met KOMO-certificaat, grond en niet verpompbare baggerspecie, bedoeld en geschikt voor toepassing
      overeenkomstig het [Besluit bodemkwaliteit][ref1], die ter plaatse van de opslag niet voldoen aan de
      [artikelen 52][ref2], [59][ref3] of [60 van dat besluit][ref4], worden opgeslagen boven een bodembeschermende
      voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel60
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0022929
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '59'
      - id: ref4
        bwb_id: BWBR0022929
        artikel: '60'
  - number: 3.43.7
    text: |-
      Verpompbare baggerspecie, bedoeld en geschikt voor toepassing overeenkomstig het Besluit
      bodemkwaliteit, die ter plaatse van de opslag niet voldoet aan de [artikelen 52][ref1], [59][ref2] of
      [60 van het Besluit bodemkwaliteit][ref3] wordt opgeslagen in een foliebassin.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel60
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '59'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '60'
  - number: 3.43.8
    text: |-
      Op het opslaan, bedoeld in het zevende lid, zijn de [artikelen 3.68][ref1] en [3.69][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.6
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.6
        afdeling: '3.4'
  - number: 3.44.1
    text: |-
      Voor de toepassing van [paragraaf 3.4.3. van het besluit][ref1] en de [artikelen 3.42][ref2] en [3.43][ref3]
      worden als goederen waaruit vloeibare bodembedreigende stoffen kunnen lekken, in ieder geval aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Paragraaf3.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0022762
        paragraaf: 3.4.3
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
