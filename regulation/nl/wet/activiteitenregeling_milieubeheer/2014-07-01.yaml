  - number: 6.10.2
    text: |-
      Op een stationaire bovengrondse opslagtank met halfzware olie die is geïnstalleerd voor 1 januari 2000 is
      [artikel 4.15][ref1] niet van toepassing tot 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.10
