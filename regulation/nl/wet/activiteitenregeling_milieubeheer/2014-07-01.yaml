    text: |-
      [Artikel 3.67][ref1] is tot 1 januari 2018 niet van toepassing op een mestbassin dat is opgericht voor 1 juni 1987.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
