      Indien de emissiereducerende maatregelen, bedoeld in het eerste lid, niet of in onvoldoende mate zijn getroffen,
      kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de motivering
      wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102g
  - number: 4.102h
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het lijmen, coaten en lamineren van
      papier of karton het verwerken van lijmen en coatings plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102h
  - number: 4.102i.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, wordt stofklasse S dat
      vrijkomt bij het mechanisch verkleinen van papier en karton en van papieren of kartonnen producten, voor zover dat
      redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102i
  - number: 4.102i.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden afgezogen emissies, die
      vrijkomen bij het mechanisch verkleinen van papier en karton en van papieren of kartonnen producten en die naar de
      buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een
      gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein
      met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102i
  - number: 4.102i.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102i
  - number: 4.102j
    text: |-
      Aan [artikel 4.94g, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien de afgezogen emissies
      die vrijkomen bij het versnipperen van papier en karton en van papieren of kartonnen producten worden gevoerd door
      een filtrerende afscheider die in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als
      voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102j
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.102k
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het mechanisch verkleinen van papier
      en karton en van papieren of kartonnen producten waarbij gebruik wordt gemaakt van een installatie met een
      oliecircuit, plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102k
