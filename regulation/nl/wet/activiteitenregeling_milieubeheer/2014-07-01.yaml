                  Kwaliteitsborging geautomatiseerde metingsystemen


                  NEN-EN 14181




                  Bekwaamheid laboratoria


                  NEN-EN-ISO/IEC 17025




                  Monsternamestrategie, meetdoel, meetplan en meetrapportage


                  NEN-EN 15259
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.18
  - number: 5.19.1
    text: |-
      Geautomatiseerde meetsystemen worden ten minste eenmaal per jaar met behulp van parallelmetingen met de
      referentiemeetmethoden, bedoeld in [artikel 5.18][ref1], gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 5.19.2
    text: |-
      De drijver van de inrichting informeert het bevoegd gezag over de resultaten van de in het eerste lid bedoelde
      controle.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3
    text: |-
      De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden worden
      berekend die getoetst worden aan een emissiegrenswaarde, is bij continue metingen niet groter dan de volgende
      percentages van de emissiegrenswaarde voor de dagelijkse emissies:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3.a
    text: 'koolmonoxide: 10% van de emissiegrenswaarde of 5 mg/Nm3;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3.b
    text: 'zwaveldioxide (SO): 20% van de emissiegrenswaarde of 10 mg/Nm3;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3.c
    text: 'stikstofoxiden (NO): 20% van de emissiegrenswaarde of 14 mg/Nm3;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3.d
    text: 'totaal stof: 30% van de emissiegrenswaarde of 1,5 mg/Nm3;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3.e
    text: 'totaal organisch koolstof: 30% van de emissiegrenswaarde of 3 mg/Nm3;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3.f
    text: 'zoutzuur: 40% van de emissiegrenswaarde of 4 mg/Nm3;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.3.g
    text: 'waterstoffluoride: 40% van de emissiegrenswaarde of 0,4 mg/Nm3.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
  - number: 5.19.4
    text: |-
      De gevalideerde halfuur- en daggemiddelden worden bij continue metingen vastgesteld op grond van de valide gemeten
      halfuurgemiddelden, na aftrek van de waarde van het in het derde lid vermelde 95%-betrouwbaarheidsinterval.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.19
