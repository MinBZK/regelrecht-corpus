      de afgezogen stofemissies die vrijkomen bij het solderen van metalen worden gevoerd door een filtrerende afscheider
      die geschikt is om aan [artikelen 4.44, eerste lid][ref1], en [4.45 van het besluit][ref2] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
