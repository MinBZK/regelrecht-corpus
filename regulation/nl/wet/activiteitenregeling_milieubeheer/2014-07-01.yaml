      zijn voorzien van doelmatige windreductieschermen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.51
  - number: 3.51.d
    text: |-
      stuifklasse S4 van bijlage 4.6 van de NeR door middel van storttrechters in ieder geval voldaan indien de goederen
      worden bevochtigd met behulp van een doelmatig werkende watersproei-installatie of indien de trechters zijn
      voorzien van doelmatige windreductieschermen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.51
  - number: '3.52'
