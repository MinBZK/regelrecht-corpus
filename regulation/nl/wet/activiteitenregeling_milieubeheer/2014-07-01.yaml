    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9b.1
    text: |-
      De ruimte waarin de verpakkingen, bedoeld in het eerste lid van [artikel 4.9a][ref1], zijn opgesteld voldoet aan
      het bepaalde bij of krachtens het tweede tot en met het tiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.9b.2
    text: |-
      De WBDBO van een ruimte waarin de verpakkingen zijn opgesteld naar een andere ruimte en van een andere ruimte naar
      een ruimte waarin de verpakkingen zijn opgesteld bedraagt ten minste 60 minuten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
  - number: 4.9b.3
    text: |-
      De wanden, het dak en de draagconstructie van de ruimte waarin de verpakkingen, bedoeld in het
      [eerste lid van artikel 4.9a,][ref1] zijn opgesteld, bezitten een brandwerendheid van ten minste 60 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.9b.4
    text: De ruimte vormt een vloeistofdichte lekbak met een inhoud van ten minste 300 liter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
  - number: 4.9b.5
    text: De ruimte mag slechts door deskundig personeel geopend en betreden worden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
  - number: 4.9b.6
    text: |-
      De ruimte heeft doorvoeringen van de stortleiding, de leegzuigleiding en de ontluchtingsleiding, die aan de
      bovenzijde van de ruimte worden geprojecteerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
  - number: 4.9b.7
    text: De peilleiding heeft geen doorvoering door de wand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
  - number: 4.9b.8
    text: |-
      De beveiligingscomponenten zoals brandsmeltkleppen en detonatiebeveiligingen zijn direct aan de buitenzijde van de
      ruimte bevestigd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
  - number: 4.9b.9
    text: |-
      De ruimte is met een potentiaal vereffening aangesloten aan de buitenzijde van de ruimte en is doorgelust aan het
      frame van de verpakkingen met de natuurlijk aanwezige metallische verbinding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
  - number: 4.9b.10
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van de situering van de verpakkingen, bedoeld in
      [artikel 4.9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.10.1
    text: |-
      Het opslaan van vloeibare gevaarlijke stoffen in verpakking, vloeibare bodembedreigende stoffen in verpakking en
      CMR-stoffen in verpakking vindt plaats boven een vloeistofdichte vloer of verharding of een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Indien de opslag, bedoeld in het eerste lid, plaatsvindt in gesloten verpakking, die voldoet aan de daartoe
      gestelde eisen van de ADR of anderszins deugdelijk is, kan deze activiteit ook plaatsvinden boven een andere
      bodembeschermende voorziening .
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10
  - number: 4.10.3
    text: |-
      Het opslaan van vaste gevaarlijke stoffen in verpakking, vaste bodembedreigende stoffen in verpakking en vaste CMR-
      stoffen in verpakking vindt plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10
  - number: 4.10.4
    text: |-
      Het opslaan van een werkvoorraad aan gevaarlijke stoffen als bedoeld in voorschrift 3.1.3 van PGS 15, vindt plaats
      in deugdelijke en gesloten verpakking die bestand is tegen de desbetreffende gevaarlijke stof. Het opslaan van een
      werkvoorraad aan brandbare vloeistoffen van meer dan 50 liter vindt plaats boven een lekbak. De eerste volzin is
      van overeenkomstige toepassing op het opslaan van een werkvoorraad aan bodembedreigende stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10
  - number: 4.10.5
    text: |-
      In afwijking van het derde lid vindt het opslaan van vaste gevaarlijke afvalstoffen waaruit vloeibare
      bodembedreigende stoffen kunnen lekken, niet zijnde stukgoederen, plaats in een deugdelijke en gesloten verpakking
      of boven een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10
  - number: 4.10a.1
    text: |-
      Het boven een oppervlaktewaterlichaam opslaan van gevaarlijke stoffen in verpakking, CMR-stoffen in verpakking en
      bodembedreigende stoffen in verpakking vindt plaats boven een voorziening die zich rondom of onder de opgeslagen
      stoffen bevindt en de bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen kan opvangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10a
  - number: 4.10a.2
    text: |-
      Op de voorziening, bedoeld in het eerste lid, is [artikel 2.4][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
        afdeling: '2.1'
  - number: 4.10a.3
    text: |-
      Lege, ongereinigde verpakkingen van gevaarlijke stoffen, CMR-stoffen en vloeibare bodembedreigende stoffen die
      boven een oppervlaktewaterlichaam bovendeks aanwezig zijn, zijn aan de buitenkant schoon en goed gesloten of
      staan opgesteld boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en in staat is de bij
      normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen en zodanig is uitgevoerd dat er geen
      hemelwater op of in terecht kan komen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10a
  - number: 4.10a.4
    text: |-
      Gevaarlijke stoffen in verpakking, CMR-stoffen in verpakking en bodembedreigende stoffen in verpakking die boven
      een oppervlaktewaterlichaam bovendeks aanwezig zijn, staan opgesteld boven een doelmatig fysieke voorziening die
      vrijgekomen stoffen keert zolang als nodig is om met daarop afgestemde maatregelen te voorkomen dat deze stoffen
      in een oppervlaktewaterlichaam kunnen geraken. [Artikel 2.3, tweede tot en met het achtste lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 4.10b.1
    text: |-
      De [artikelen 4.1 tot en met 4.10a][ref1] zijn niet van toepassing op het opslaan van vloeibare kunstmeststoffen in
      verpakking voor zover dat opslaan plaatsvindt voor agrarische activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.10b.2
    text: |-
      Het opslaan van vloeibare kunstmeststoffen in verpakking voor zover dat plaatsvindt voor agrarische activiteiten,
      voldoet aan het derde tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10b
  - number: 4.10b.3
    text: |-
      Een verpakking die is gevuld met vloeibare kunstmeststoffen is geplaatst boven een ten minste vloeistofkerende
      vloer of in een vloeistofdichte lekbak die voldoende sterk is om weerstand te bieden aan de als gevolg van een
      lekkage optredende vloeistofdruk en bestand is tegen de in de verpakking opgeslagen stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10b
  - number: 4.10b.4
    text: |-
      De vloeistofkerende vloer vormt samen met wanden, drempels of opstaande randen een vloeistofkerende
      opvangvoorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10b
  - number: 4.10b.5
    text: |-
      De inhoud van de opvangvoorziening, bedoeld in het vierde lid, of de lekbak, bedoeld in het derde lid, is ten
      minste gelijk aan de inhoud van de grootste opgeslagen verpakking, vermeerderd met 10% van de overige verpakkingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10b
  - number: 4.10b.6
    text: |-
      De verpakking die is gevuld met een zuur is in een andere opvangvoorziening of lekbak geplaatst dan een verpakking
      die is gevuld met een basische stof.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.10b
  - number: 4.11.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt theatervuurwerk opgeslagen in ten minste een brandveiligheidsopslagkast
      die voldoet aan de voorschriften 3.10.1 tot en met 3.10.4 van PGS 15. De brandwerendheid van de kast bedraagt ten
      minste 60 minuten. De kast wordt niet afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Inbeslaggenomen vuurwerk met aan consumentenvuurwerk vergelijkbare eigenschappen dat wordt opgeslagen in
      politiebureaus wordt opgeslagen in ten minste een brandveiligheidsopslagkast die voldoet aan de voorschriften
      3.10.1 tot en met 3.10.4 van PGS 15. De brandwerendheid van de kast bedraagt ten minste 60 minuten. De kast wordt
      niet afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.11
  - number: 4.12.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt rookzwak kruit ten minste opgeslagen in een brandcompartiment. Binnen het
      brandcompartiment wordt het rookzwak kruit opgeslagen in vakken. De vakken zijn vervaardigd van 105 millimeter
      metselwerk voor de wanden, en 70 millimeter beton voor de horizontale verdeling. Per vak is maximaal 1 kilogram
      rookzwak kruit aanwezig in de standaardverpakking . Voor de vakken is minimaal 1 meter vrije ruimte aanwezig. De
      toegang tot het brandcompartiment bestaat uit een deur die 60 minuten brandwerend is, zelfsluitend is uitgevoerd,
      naar buiten opent en als drukontlasting kan fungeren.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.12
  - number: 4.12.2
    text: |-
      Het kruit, bedoeld in het eerste lid, wordt zodanig opgeslagen dat er minimaal 10 centimeter ruimte tussen de
      voorzijde van het vak en de voorzijde van de fles met rookzwak kruit aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.12
  - number: 4.12.3
    text: |-
      Het eerste lid en tweede lid, zijn van overeenkomstige toepassing op de opslag van zwart kruit met dien verstande
      dat van zwart kruit niet meer dan 250 gram per vak aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.12
  - number: 4.12.4
    text: |-
      Noodsignalen worden opgeslagen in een brandcompartiment dan wel in een brandveiligheidsopslagkast die voldoet
      aan de voorschriften 3.10.1 tot en met 3.10.4 van PGS 15. De brandwerendheid van de kast bedraagt ten minste 60
      minuten. De kast wordt niet afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico en het voorkomen van risico’s voor de
      omgeving en ongewone voorvallen, dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      risico’s voor de omgeving en de kans dat ongewone voorvallen zich voordoen en de gevolgen hiervan als bedoeld
      in [artikel 4.6 van het besluit][ref1], voldoet de opslag van halfzware olie, polyesterhars, stoffen van klasse
      8 van het ADR verpakkingsgroep II en III zonder bijkomend gevaar, PER of stoffen van klasse 5.1 van het ADR in
      bovengrondse opslagtanks aan de [artikelen 4.14 tot en met 4.19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
