        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.6
        afdeling: '3.5'
  - number: 6.5j.1
    text: |-
      [Artikel 3.114, vierde tot en met zesde lid][ref1], is tot 1 oktober 2012 niet van toepassing op een inrichting
      waarop onmiddellijk voorafgaand aan de inwerkingtreding van artikel 3.114 een vergunning in werking en
      onherroepelijk was en in de vergunning geen voorziening is voorgeschreven als bedoeld in artikel 3.114, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5j
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.7.2
        afdeling: '3.7'
  - number: 6.5j.2
    text: |-
      Ten aanzien van een inrichting als bedoeld in het eerste lid blijven, in afwijking van
      [artikel 3.114, vierde tot en met zesde lid][ref1], de voorschriften van de vergunning ten behoeve van het
      voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de belasting van de bodem en met
      betrekking tot de onveilige zone tot 1 oktober 2012 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5j
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.7.2
        afdeling: '3.7'
  - number: '6.6'
    text: |-
      In aanvulling op de [artikelen 4.3][ref1] tot en met [4.4c][ref2] kan het bevoegd gezag voor inrichtingen die
      zijn opgericht voor het in werking treden van deze regeling én waarvoor onmiddellijk voorafgaand aan dat tijdstip
      een vergunning van kracht was, dan wel voorschiften golden op basis van één van de besluiten zoals genoemd in
      [art. 6.43 van het besluit][ref3], maatwerkvoorschriften stellen ten aanzien van de bouwkundige eisen zoals gesteld
      in voorschrift 3.2.4 van PGS 15. Het maatwerkvoorschrift kan slechts minder strenge eisen aan de bouwkundige
      voorzieningen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
