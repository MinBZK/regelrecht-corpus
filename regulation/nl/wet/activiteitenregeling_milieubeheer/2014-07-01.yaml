  - number: '6.11'
    text: |-
      Indien een bovengrondse opslagtank voor vloeibare brandstoffen die is geïnstalleerd voor 1 januari 2000 niet
      overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een persoon of
      instelling, die daartoe beschikt over een erkenning op grond van dat besluit geïnspecteerd kan worden, wordt deze
      bovengrondse opslagtank uiterlijk 1 januari 2015 buiten werking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 6.11a.1
    text: |-
      In afwijking van [artikel 4.114, derde lid, onder b en c][ref1], geldt voor strooivelden die voor de
      inwerkingtreding van dat artikel in gebruik zijn genomen, dat het onderzoek naar de bodemkwaliteit en de bepaling
      van de immissie van fosfaat naar de bodem in ieder geval wordt uitgevoerd binnen 25 jaar, nadat het strooiveld
      in gebruik is genomen, dan wel, indien het strooiveld meer dan 25 jaar voor inwerkingtreding van dat artikel in
      gebruik is genomen, binnen zes maanden na de datum van inwerkingtreding van dat artikel en daarna telkens tenminste
      eenmaal per 25 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.11a
    references:
