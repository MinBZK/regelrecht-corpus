    text: bij het laden en lossen in de open lucht de storthoogte wordt beperkt tot minder dan één meter,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.49
  - number: 3.49.1.b
    text: goederen uit de stuifklasse S2 en S4 van bijlage 4.6 van de NeR afdoende worden bevochtigd, zo mogelijk vooraf, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.49
  - number: 3.49.1.c
    text: |-
      de stofemissie van goederen uit de stuifklasse S2 en S4 van bijlage 4.6 van de NeR tijdens het laden en lossen met
      een nevelgordijn wordt tegengegaan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.49
  - number: 3.49.2
    text: |-
      Aan [artikel 3.38 van het besluit][ref1] wordt bij het vullen van een gesloten opslagruimte met goederen behorend
      tot de stuifklasse S1 en S2 van bijlage 4.6 van de NeR in ieder geval voldaan indien het overstortpunt en daarmee
      de ruimte worden afgezogen, en de afgezogen luchtstroom wordt gevoerd door een filtrerende afscheider die in goede
      staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt
      schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.50.1
    text: |-
      Onverminderd [artikel 3.49][ref1] wordt aan de [artikelen 3.38][ref2] en
      [3.32, aanhef en onder a en b, van het besluit][ref3] bij continu mechanisch transport van goederen behorend tot
      stofklasse S1 en S3 van bijlage 4.6 van de NeR in ieder geval voldaan indien deze in een gesloten systeem worden
      getransporteerd, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.50
