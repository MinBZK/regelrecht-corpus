        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
  - number: 3.44.2.a
    text: |-
      IBC-bouwstoffen als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel1
