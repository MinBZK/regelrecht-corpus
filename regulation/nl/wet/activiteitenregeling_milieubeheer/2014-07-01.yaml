  - number: 6.5g.2
    text: |-
      Een mestbassin en een afdekking als bedoeld in het eerste lid zijn voorzien van een door de installateur verstrekte
      verklaring waaruit blijkt dat het mestbassin en de afdekking zijn uitgevoerd overeenkomstig de eisen, bedoeld in
      het eerste lid, en welke referentieperiode mestbassins van toepassing is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5g
  - number: 6.5g.3
    text: |-
      Indien in de verklaring, bedoeld in het tweede lid, geen referentieperiode mestbassins is vermeld, gelden gerekend
      van het moment van aanleg van het mestbassin de volgende referentieperiode mestbassins:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5g
  - number: 6.5g.3.a
    text: 20 jaar voor een houten, betonnen of gemetseld mestbassin en betonnen afdekking;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5g
  - number: 6.5g.3.b
    text: 10 jaar voor een metalen mestbassin en afdekking;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5g
  - number: 6.5g.3.c
    text: 5 jaar voor een mestzak of een foliebassin;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5g
  - number: 6.5g.3.d
    text: 5 jaar voor de taludbescherming van een foliebassin, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5g
  - number: 6.5g.3.e
    text: 10 jaar voor overige typen mestbassins en afdekkingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5g
  - number: 6.5h
    text: |-
      In afwijking van [artikel 3.69, eerste lid][ref1], wordt een mestbassin, met uitzondering van een ondergronds
      mestbassin voorzien van een afdekking die als vloer kan fungeren, dat is opgericht voor het tijdstip van
      inwerkingtreding van [artikel 3.68][ref2] en waarvoor geen kwaliteitsverklaring mestbassin is afgegeven, gekeurd
      overeenkomstig artikel 3.69, met dien verstande dat de keuring, gerekend vanaf het moment van aanleg van het
      mestbassin, plaatsvindt ten minste vier weken voor het aflopen van de volgende referentieperiode mestbassins:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5h
