        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 3.18.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico wordt bij het afleveren van vloeibare brandstof
      voldaan aan de [artikelen 3.21][ref1], [3.21a][ref2], [3.22][ref3], [3.25][ref4] en [3.26][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.18
    references:
      - id: ref1
