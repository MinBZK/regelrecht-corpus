  - number: 3.81.2
    text: |-
      Ten aanzien van de in tabel 3.81a opgenomen typen spuitdoppen Lechler IDKT 120 en Hardi Minidrift DUO 120 met
      dopmaat 03 en Lechler IDKT 120 en Hardi Minidrift DUO 120 met dopmaat 04 dient de apparatuur zodanig te zijn
      ingesteld dat deze spuitdoppen zich niet hoger dan 40 centimeter boven het gewas bevinden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.81
