        afdeling: '3.4'
  - number: 6.5e.2
    text: 'In het geval, bedoeld in het eerste lid, wordt het mestbassin, zolang het niet is voorzien van een afdekking:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5e
  - number: 6.5e.2.a
    text: uitsluitend op of nabij de onderkant van het mestbassin gevuld, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5e
  - number: 6.5e.2.b
    text: doelmatig gevuld, maar niet verder dan 0,20 meter onder de rand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5e
  - number: 6.5g.1
    text: |-
      In afwijking van [artikel 3.68][ref1] zijn een mestbassin en een afdekking die zijn opgericht voor het tijdstip
      van inwerkingtreding van dat artikel uitgevoerd overeenkomstig de eisen die op het moment van oprichten van
      toepassing waren op grond van een vergunning dan wel het [Besluit akkerbouwbedrijven milieubeheer][ref2],
      het [Besluit mestbassins][ref3], het [Besluit landbouw milieubeheer][ref4] of het
      [Besluit melkrundveehouderijen milieubeheer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006449
      [ref3]: https://wetten.overheid.nl/BWBR0004990
      [ref4]: https://wetten.overheid.nl/BWBR0020112
      [ref5]: https://wetten.overheid.nl/BWBR0005158
