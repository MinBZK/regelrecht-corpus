      afleverinstallatie uitgebreid wordt gerenoveerd dan wel uiterlijk tot 1 december 2023 niet van toepassing
      op het inpandig afleveren van gecomprimeerd aardgas. Tot dat moment of die datum voldoet een inpandige
      aardgas-afleverinstallatie voor gecomprimeerd aardgas aan de eisen die daaraan voor de 1 december 2013 bij
      maatwerkvoorschrift werden gesteld.


