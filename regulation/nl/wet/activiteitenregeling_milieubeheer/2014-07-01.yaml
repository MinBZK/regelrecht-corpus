articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: aardgas-afleverinstallatie: een inrichting voor het afleveren van
      aardgas aan voertuigen die aardgas als motorbrandstof gebruiken, bestaande uit een compressorinstallatie,
      een (eventuele) bufferopslag en één of meerdere aflevertoestellen. Dit met inbegrip van alle leidingen en
      toebehoren; accreditatie-instantie: nationale accreditatie-instantie als bedoeld in artikel 4, eerste lid, van
      verordening (EG) nr. 765/2008 van het Europees Parlement en de Raad van de Europese Unie van 9 juli 2008 tot
      vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en
      tot intrekking van Verordening (EEG) nr. 339/93 (PbEU L 218); afgewerkte olie: afgewerkte olie als bedoeld in
      [artikel 1, eerste lid, onderdeel b van het Besluit inzamelen afvalstoffen][ref1]; afleverzuil: bovengronds
      gelegen gedeelte van de afleverinstallatie bestaande uit pompen, leidingen, meet- en regelwerken, schakelaars
      en afleverpistolen omgeven door een omkasting of daarmee direct in verbinding staand; A-hout: ongeverfd
      en onbehandeld hout; baanzool: bodem of vloer tussen de standplaats of standplaatsen van de schutter en de
      kogelvanger; besluit: [Activiteitenbesluit milieubeheer][ref2]; B-hout: hout dat geen A-hout of C-hout is;
      bovengronds: 'geheel boven de bodem gelegen; C-hout: geïmpregneerd hout; emissieterm L: het jaargemiddelde'
      geluidsvermogen dat door een windturbine wordt uitgestraald per octaafband i per beoordelingsperiode; ETBE: ethyl-
      tertiair-butylether; foliebassin: opslagvoorziening uitgevoerd als een met afdichtingsfolie beklede grondput;
      geomembraanbaksysteem: een ondergronds aangelegd kunststof foliesysteem dat waarborgt dat geen vloeistof aan de
      niet met vloeistof belaste zijde van dat systeem kan komen; gesloten proces: een proces of bewerking, als bedoeld
      in de NRB, waarbij de gebruikte stoffen bij normale bedrijfsvoering binnen de procesomhulling blijven en de
      desbetreffende installaties niet geopend hoeven te worden; grondwaterbeschermingsgebied: een gebied dat krachtens
      [artikel 1.2, tweede lid, onderdeel a, van de Wet milieubeheer][ref3] bij de provinciale milieuverordening is
      aangewezen en waarvoor regels zijn gesteld ter bescherming van het grondwater met het oog op de waterwinning;
      immissiepunt: 'plaats waarop de geluidsbelasting wordt bepaald; kaliber: binnendiameter van een loop van een'
      vuurwapen; kogelvanger: vanginrichting voor projectielen, opgesteld achter het doel waarop geschoten wordt;
      kwaliteitsverklaring mestbassin: attest, afgegeven door een door een accreditatie-instantie geaccrediteerde
      instelling op basis van BRL 2342 voor mestbassins en afdekking voor mestbassins; mestzak: mestbassin, geheel of
      grotendeels bovengronds gelegen, voornamelijk opgebouwd uit kunststoffolie waarvan de bodemafdichting en afdekking
      een geheel vormen; MTBE: methyl-tertiair-butylether; noodstopvoorziening: een voorziening die bij activering de
      spanning op alle afleverzuilen wegneemt; ondergronds: geheel of gedeeltelijk in de bodem gelegen of ingeterpt;
      referentieperiode mestbassins: periode dat een mestbassin dan wel de afdekking voldoet aan de eisen van BRL 2342;
      schoudervuurwapen: 'vuurwapen in de vorm van een karabijn of geweer; tijdelijke opslag van gevaarlijke stoffen:'
      opslag van gevaarlijke stoffen in verpakking of CMR-stoffen in verpakking die zijn geadresseerd aan derden en,
      voorafgaand aan of aansluitend op transport, buiten een opslagvoorziening voor gevaarlijke stoffen in verpakking
      of CMR-stoffen in verpakking verblijven; UN-nummer: het stofidentificatienummer: getal van vier cijfers dat een
      gevaarlijke stof identificeert tijdens het transport, volgens de ‘Recommendations on the Transport of Dangerous
      Goods’ van de Verenigde Naties; vuistvuurwapen: vuurwapen in de vorm van een pistool of revolver; vulplaats: de
      plaats waar of de ruimte waarin de flessen worden gevuld en gecontroleerd; vulstation: een combinatie van vulplaats
      en gasopslag; WBDBO: Weerstand tegen branddoorslag en brandoverslag in minuten volgens NEN 6068.


