  - number: 3.44.2
    text: |-
      Voor de toepassing van [artikel 3.43][ref1] worden onder goederen waaruit een significante hoeveelheid
      bodembedreigende stoffen kunnen uitlogen, in ieder geval verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
