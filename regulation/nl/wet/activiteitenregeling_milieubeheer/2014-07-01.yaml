  - number: 6.6b
    text: |-
      [Artikel 4.7][ref1] is tot 1 december 2014 niet van toepassing op het tijdelijk opslaan van gevaarlijke stoffen
      of CMR-stoffen in verpakking die aan derden zijn geadresseerd, voor zover het opslaan plaatsvindt overeenkomstig
      artikel 4.7 zoals dat luidde voor 1 december 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.6b
