      de hoogste in gebruik zijnde spuitdop.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.79
  - number: 3.79.6
    text: Het emissiescherm is met uitzondering van een doorrijscherm op de kopakker aaneengesloten.
