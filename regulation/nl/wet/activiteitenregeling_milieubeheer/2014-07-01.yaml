      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.47
  - number: 4.48.1
    text: |-
      Ter uitvoering van [artikel 4.30, eerste lid, van het besluit][ref1], past degene die de inrichting drijft:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.48
