  - number: 6.6a
    text: |-
      [Artikel 4.4, onderdeel f][ref1], is tot 1 december 2014 niet van toepassing op spuitbussen van de klasse 2 van het
      ADR, met stoffen die zijn aangemerkt als zeer licht ontvlambaar, licht ontvlambaar, ontvlambaar, toxisch, corrosief
      of oxiderend, voor zover deze aanwezig zijn in een hoeveelheid van minder dan 400 kilogram.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
