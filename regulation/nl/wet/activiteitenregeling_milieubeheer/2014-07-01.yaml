  - number: 6.10.5
    text: |-
      Een opslagtank als bedoeld in het tweede en derde lid met de daarbij behorende leidingen en appendages voldoet tot
      1 januari 2015 aan de voorschriften 4.1.3, 4.2.4, 4.2.5, 4.2.7, 4.2.9, 4.2.10, 4.2.14, 4.3.3, 4.3.4, 4.3.6, 4.3.8,
      4.3.9, 4.3.11, 4.4.1, 4.4.3, 4.4.4, 4.4.7, 4.4.8, 4.5.1, 4.5.3, 4.5.9, 4.5.12 en de voorschriften in paragraaf 4.6
      van PGS 30.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.10
  - number: 6.10.6
    text: |-
      De voorschriften genoemd in het vijfde lid zijn tot 1 januari 2023 van overeenkomstige toepassing op een opslagtank
      als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.10
  - number: 6.10.7
    text: |-
      Het lekdetectiesysteem van een opslagtank, bedoeld in het vierde lid, wordt indien de opslagtank dubbelwandig is
      eenmaal per jaar overeenkomstig KC 111 gecontroleerd op goede werking. Indien er een gebrek wordt geconstateerd dat
      kan leiden tot het optreden van niet gedetecteerde lekken, wordt het lekdetectiesysteem binnen een periode van een
      maand hersteld. Van de controle wordt een aantekening in het logboek gemaakt
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.10
  - number: 6.10.8
    text: |-
      [Artikel 4.15, derde lid][ref1], is niet van toepassing op een bovengrondse opslagtank die is geïnstalleerd voor de
      datum waarop [paragraaf 4.1.3][ref2] op de inrichting van toepassing werd en die niet op de vloer staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.10
