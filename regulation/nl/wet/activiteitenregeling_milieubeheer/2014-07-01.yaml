  - number: 4.9.1
    text: 'Leidingen aangesloten op een verpakking met vloeibare gevaarlijke stoffen of vloeibare bodembedreigende stoffen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9
  - number: 4.9.1.a
    text: zijn bovengronds vast aangelegd of in een daartoe speciaal aangelegde goot vast aangelegd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9
  - number: 4.9.1.b
    text: zijn bestand tegen de daardoor getransporteerde stoffen en zijn vloeistofdicht uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9
  - number: 4.9.1.c
    text: worden periodiek gecontroleerd op vloeistofdichtheid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9
  - number: 4.9.2
    text: |-
      In elke aansluiting op verpakking met een inhoud van meer dan 200 liter gevaarlijke stoffen beneden het hoogste
      vloeistofniveau, is zo dicht mogelijk bij de wand een afsluiter geplaatst. De afsluiter is zodanig uitgevoerd dat
      duidelijk is te zien of de afsluiter is geopend dan wel is gesloten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9
  - number: 4.9.3
    text: |-
      Leidingen die beneden het hoogste vloeistofniveau zijn aangesloten en waarin door hevelwerking product uit de tank
      kan stromen, zijn voorzien van een anti-hevel voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9
  - number: 4.9a.1
    text: |-
      In afwijking van [artikel 4.9][ref1] zijn stationaire bovengrondse verpakkingen voor het opslaan van afgetapte
      vloeibare brandstoffen bij een autodemontagebedrijf, met de daarbij behorende leidingen en appendages, met een
      inhoud van ten hoogste 270 liter per verpakking, uitgevoerd en geïnstalleerd en worden gerepareerd of vervangen en
      beoordeeld overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref2] aangewezen normdocument, door
      een persoon of instelling, die daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0022929
  - number: 4.9a.2
    text: |-
      Het opslaan van afgetapte vloeibare brandstoffen bij een autodemontagebedrijf in stationaire bovengrondse
      verpakkingen met de daarbij behorende leidingen en appendages voldoet aan de volgende onderdelen van PGS 30:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.2.a
    text: de paragrafen 2.2 en 2.3;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.2.b
    text: de voorschriften 2.4.3, 2.6.1, 2.6.3 tot en met 2.6.6, 2.6.11 en 2.6.14, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.2.c
    text: paragraaf 4.2, met uitzondering van voorschrift 4.2.3 en tabel 4.1.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.3
    text: |-
      Een ruimte waarin verpakkingen als bedoeld in het eerste lid worden opgeslagen, bevindt zich niet op een
      verdieping.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.4
    text: |-
      Het gebruik van de verpakkingen waarin het opslaan, vullen en afleveren van afgetapte vloeibare brandstoffen bij
      een autodemontagebedrijf plaatsvindt in stationaire bovengrondse verpakkingen met de daarbij behorende leidingen en
      appendages, voldoet aan de volgende onderdelen van PGS 30:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.4.a
    text: voorschrift 3.2.4;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.4.b
    text: de paragrafen 3.3, 3.5, 3.6, 5.2 en 5.4, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.4.c
    text: de voorschriften 5.5.1, 5.5.2, 5.6.1, 5.6.3 en 5.6.4.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.9a
  - number: 4.9a.5
    text: |-
      Voor stationaire bovengrondse verpakkingen met de daarbij behorende leidingen en appendages gelden de keurings- en
      herkeuringstermijnen van tabel 4.9a.
