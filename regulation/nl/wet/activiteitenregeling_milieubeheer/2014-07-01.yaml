  - number: 6.5aa.1.b
    text: de gronddekking van ondergrondse leidingen, bedoeld in paragraaf 5.3.10 van PGS 25;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5aa
  - number: 6.5aa.1.c
    text: de interne veiligheidsafstanden, bedoeld in paragraaf 5.5 van PGS 25;
