  - number: 5.20.1
    text: |-
      Het uitvoeren van periodieke metingen als bedoeld in de [artikelen 5.11, eerste lid][ref1], [5.13][ref2] en
      [5.16, eerste lid, onder a][ref3], en parallelmetingen als bedoeld in de artikelen 5.11, tweede tot en met
      vierde lid, [5.12][ref4] en 5.16, eerste lid, onder b, c en d, geschiedt door een rechtspersoon die voor deze
      verrichtingen geaccrediteerd is door een accreditatie-instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
