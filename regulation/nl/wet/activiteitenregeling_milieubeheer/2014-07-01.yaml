  - number: 4.14.1
    text: |-
      Het opslaan van halfzware olie, polyesterhars, stoffen van klasse 8 van het ADR verpakkingsgroep II en III
      zonder bijkomend gevaar, PER of stoffen van klasse 5.1 van het ADR in bovengrondse opslagtanks vindt plaats in
      bovengrondse opslagtanks, die met de daarbij behorende leidingen en appendages naar hun aard en functie geschikt
      zijn voor de opslag van de desbetreffende stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.14
  - number: 4.14.2
    text: De bovengrondse opslagtanks en de daarbij behorende leidingen en appendages verkeren in goede staat.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.14
  - number: 4.14.3
    text: |-
      Het opslaan van halfzware olie, polyesterhars, stoffen van klasse 8 van het ADR verpakkingsgroep II en III zonder
      bijkomend gevaar, PER of stoffen van klasse 5.1 van het ADR in bovengrondse opslagtanks vindt op de vloer plaats.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.14
  - number: 4.14.4
    text: |-
      Het derde lid is niet van toepassing op een bovengrondse opslagtank met halfzware olie, polyesterhars, stoffen van
      klasse 8 van het ADR verpakkingsgroep II en III zonder bijkomend gevaar, PER of stoffen van klasse 5.1 van het ADR
      indien plaatsing op de vloer als gevolg van de constructie van de bijbehorende procesinstallatie niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.14
  - number: 4.15.1
    text: |-
      Een stationaire bovengrondse opslagtank met de daarbij behorende leidingen en appendages voor het opslaan van
      halfzware olie, polyesterhars of stoffen van de klasse 8 van het ADR, verpakkingsgroepen II en III zonder bijkomend
      gevaar, is uitgevoerd en geïnstalleerd en wordt gerepareerd of vervangen en beoordeeld overeenkomstig het daartoe
      krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een persoon of instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
