    text: |-
      Ten aanzien van inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip van het van toepassing
      worden van het [besluit][ref1] of een deel daarvan op een activiteit, op die inrichtingen, een vergunning
      in werking en onherroepelijk was, dan wel voorschriften golden op basis van één van de besluiten, genoemd
      in [artikel 6.43 van het besluit][ref2], zijn de [artikelen 3.27l][ref3], [3.103, eerste lid][ref4],
      [3.104, eerste lid][ref5], [4.40, vierde lid][ref6], [4.46, vierde lid][ref7], [4.64, vierde lid][ref8],
      [4.68, zesde lid][ref9], [4.84c, tweede lid][ref10], [4.100, eerste lid][ref11], [4.102c, tweede lid][ref12],
      [4.102f, tweede lid][ref13], en [4.104d, tweede lid][ref14], niet van toepassing, voor zover er geen verandering
      van de inrichting plaatsvindt waarvoor een melding krachtens [artikel 1.10 van het besluit][ref15] nodig is en voor
      zover er geen verandering van de inrichting plaatsvindt die leidt tot een toename van de geurbelasting op gevoelige
      gebouwen.


