  - number: 5.20.2
    text: |-
      Het bevoegd gezag wordt ten minste twee weken van tevoren op de hoogte gesteld van de datum en het tijdstip waarop
      een periodieke meting of een parallelmeting zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
  - number: 5.20.3
    text: |-
      Indien een afzonderlijke meting of parallelmeting geen doorgang vindt, wordt het bevoegd gezag uiterlijk op de
      datum waarop de meting zou plaatsvinden, bedoeld in het tweede lid, hiervan op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
  - number: 5.20.4
    text: |-
      Een periodieke meting van zoutzuur, waterstoffluoride, zwaveldioxide (SO) of stikstofoxiden (NO) bestaat uit een
      serie van ten minste drie deelmetingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
  - number: 5.20.5
    text: |-
      De duur van een deelmeting bedraagt een half uur. Wanneer het meettechnisch niet mogelijk is de deelmeting in die
      tijd uit te voeren, mag de deelmeting ten hoogste twee uur bedragen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
  - number: 5.20.6
    text: |-
      Periodieke metingen van kwik, de som van cadmium en thallium en de som van antimoon, arseen, chroom, kobalt, lood,
      mangaan, nikkel en vanadium bestaan uit één deelmeting over een bemonsteringsperiode van ten minste een half uur en
      ten hoogste 8 uur hoger.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
  - number: 5.20.7
    text: |-
      Een periodieke meting van dioxinen en furanen bestaat uit één deelmeting over een bemonsteringsperiode van ten
      minste 6 uur en ten hoogste 8 uur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
  - number: 5.20.8
    text: |-
      De duur van een parallelmeting die wordt uitgevoerd ten behoeve van de verificatie van de meetapparatuur voor
      continue metingen, bedraagt ten minste een half uur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
  - number: 5.20.9
    text: |-
      Bij periodieke metingen kan een door een rechtspersoon als bedoeld in het eerste lid aangetoonde
      95%-betrouwbaarheidsinterval op dezelfde wijze als [artikel 5.19, derde en vierde lid][ref1], worden
      verdisconteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 5.21.1
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarden voor afvalverbrandingsinstallaties voor totaal stof, totaal
      organische koolstof, zoutzuur, waterstoffluoride en zwaveldioxide (SO) wordt in ieder geval voldaan, indien:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.1.a
    text: geen van de daggemiddelden hoger is dan de bijbehorende emissiegrenswaarde, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.1.b
    text: 97% van de halfuurgemiddelden in één kalenderjaar de bijbehorende emissiegrenswaarde niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.2
    text: |-
      Aan de emissiegrenswaarden voor afvalverbrandingsinstallaties voor stikstofoxiden (NO) wordt geacht te zijn
      voldaan, indien:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.2.a
    text: geen van de daggemiddelden hoger is dan de bijbehorende emissiegrenswaarde,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.2.b
    text: geen van de maandgemiddelden hoger is dan de bijbehorende emissiegrenswaarde, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.2.c
    text: 97% van de halfuurgemiddelden in één kalenderjaar de bijbehorende emissiegrenswaarde niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.3
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarden voor afvalverbrandingsinstallaties voor koolmonoxide wordt in
      ieder geval voldaan, indien:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.3.a
    text: 97% van de daggemiddelden in één kalenderjaar de bijbehorende emissiegrenswaarde niet overschrijdt, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.3.b
    text: |-
      95% van alle 10-minutengemiddelden in een willekeurige periode van 24 uur de bijbehorende emissiegrenswaarde niet
      overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.4
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarden voor afvalmeeverbrandingsinstallaties voor totaal stof, totaal
      organische koolstof, zoutzuur, waterstoffluoride, zwaveldioxide (SO), stikstofoxiden (NO) en koolmonoxide wordt in
      ieder geval voldaan, indien geen van de daggemiddelden hoger is dan de bijbehorende emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.5
    text: |-
      Halfuurgemiddelden en tienminutengemiddelden worden bepaald binnen de tijd dat de verbrandingsinstallatie in
      werking is, met uitzondering van de voor de inwerkingstelling en stillegging van de afvalverbrandingsinstallatie
      benodigde tijd indien gedurende die tijd geen afvalstoffen worden verbrand.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.6
    text: |-
      Bij de bepaling van het daggemiddelde worden ten hoogste vijf halfuurgemiddelden wegens defecten of onderhoud
      van het systeem voor continue metingen buiten beschouwing gelaten. Per kalenderjaar worden ten hoogste tien
      daggemiddelden wegens defecten of onderhoud van het systeem voor continue metingen buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.7
    text: |-
      Indien continue metingen niet zijn vereist, wordt aan de toepasselijke emissiegrenswaarden voor zwaveldioxide (SO),
      stikstofoxiden, waterstoffluoride en zoutzuur in ieder geval voldaan, indien geen enkele gevalideerde meetuitkomst
      voor de betreffende stof de emissiegrenswaarde overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: 5.21.8
    text: |-
      Aan de van toepassing zijnde emissiegrenswaarden voor kwik, de som van cadmium en thallium, de som van antimoon,
      arseen, chroom, kobalt, lood, mangaan, nikkel en vanadium en dioxinen en furanen wordt in ieder geval voldaan,
      indien het gevalideerde resultaat van de periodieke metingen lager is dan de bijbehorende emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.21
  - number: '5.22'
    text: 'Aan de van toepassing zijnde emissiegrenswaarden voor emissies naar water wordt in ieder geval voldaan, indien:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.22
  - number: 5.22.a
    text: |-
      bij metingen van de totale hoeveelheid onopgeloste bestanddelen 95% en 100% van de meetwaarden de toepasselijke
      emissiegrenswaarden niet overschrijdt,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.22
  - number: 5.22.b
    text: |-
      bij metingen van kwik, cadmium, thallium, arseen, lood, chroom, nikkel, zink, antimoon, kobalt, mangaan, vanadium
      en tin niet meer dan eenmaal per jaar de toepasselijke emissiegrenswaarden worden overschreden, of, indien meer dan
      twintig steekproeven per jaar worden uitgevoerd, bij niet meer dan 5% van deze steekproeven de emissiegrenswaarden
      van [artikel 5.27 van het besluit][ref1] worden overschreden, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.22.c
    text: bij metingen van dioxinen en furanen de emissiegrenswaarden niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.22
  - number: 5.23.1
    text: |-
      Voor zover het betreft een afvalverbrandingsinstallatie wordt aan
      [artikel 5.18, tweede lid, van het besluit][ref1] in ieder geval voldaan, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.23.1.a
    text: |-
      de afvalverbrandingsinstallatie op een zodanige wijze wordt geëxploiteerd dat een niveau van thermische behandeling
      wordt bereikt waarbij de totale hoeveelheid organische koolstof in de slakken en de bodemas minder bedraagt dan 3%
      van het droge gewicht van het materiaal, of het gloeiverlies van de slakken en de bodemas minder bedraagt dan 5%
      van het droge gewicht van het materiaal, zo nodig na voorbehandeling van het afval met passende technieken,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
  - number: 5.23.1.b
    text: |-
      de afvalverbrandingsinstallatie zodanig wordt uitgerust, gebouwd en geëxploiteerd dat, zelfs in de meest ongunstige
      omstandigheden, het bij het proces ontstane gas, na de laatste toevoer van verbrandingslucht, gedurende twee
      seconden op beheerste en homogene wijze wordt verhit tot ten minste 850° C, gemeten dichtbij de binnenwand of op
      een ander representatief punt van de verbrandingskamer, dan wel de temperatuur gedurende twee seconden tot ten
      minste 1100° C wordt opgevoerd, indien gevaarlijke afvalstoffen met een gehalte van meer dan 1% gehalogeneerde
      organische verbindingen, uitgedrukt in chloor, thermisch worden behandeld,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
  - number: 5.23.1.c
    text: |-
      elke verbrandingskamer van de afvalverbrandingsinstallatie wordt uitgerust met ten minste één hulpbrander,
      die automatisch wordt ingeschakeld wanneer de temperatuur van de verbrandingsgassen na de laatste toevoer van
      verbrandingslucht tot onder de op grond van onderdeel b vereiste temperatuur zakt,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
  - number: 5.23.1.d
    text: |-
      de hulpbrander ook tijdens de inwerkingstelling en de stillegging van de afvalverbrandingsinstallatie wordt
      gebruikt teneinde ervoor te zorgen dat de op grond van de onderdelen b en c vereiste temperatuur gedurende
      deze in werking stelling en stillegging steeds wordt gehandhaafd zolang zich onverbrande afvalstoffen in de
      verbrandingskamer bevinden,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
  - number: 5.23.1.e
    text: |-
      naar de hulpbrander geen brandstoffen worden toegevoerd die hogere emissies kunnen
      veroorzaken dan bij het stoken van gasolie voor de scheepvaart als omschreven in
      [artikel 1.1 van het Besluit brandstoffen luchtverontreiniging][ref1], vloeibaar gas of aardgas het geval is, en


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel1
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '1'
  - number: 5.23.1.f
    text: |-
      bij de exploitatie van de afvalverbrandingsinstallaties gebruik wordt gemaakt van een automatisch systeem dat
      de toevoer van afvalstoffen voorkomt totdat bij het in werking stellen de op grond van onderdeel b vereiste
      temperatuur is bereikt en wanneer de vereiste temperatuur niet gehandhaafd blijft.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
  - number: 5.23.2
    text: |-
      Voor zover het betreft een afvalmeeverbrandingsinstallatie, wordt aan
      [artikel 5.18, tweede lid, van het besluit][ref1] in ieder geval voldaan, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
  - number: 5.23.2.a
    text: |-
      de afvalmeeverbrandingsinstallatie zodanig wordt ontworpen, uitgerust, gebouwd en geëxploiteerd dat, zelfs in de
      meest ongunstige omstandigheden, het door de meeverbranding van afvalstoffen ontstane gas gedurende twee seconden
      op beheerste en homogene wijze wordt verhit tot ten minste 850° C, dan wel de temperatuur gedurende twee seconden
      tot ten minste 1100° C opgevoerd, indien gevaarlijke afvalstoffen met een gehalte van meer dan 1% gehalogeneerde
      organische stoffen, uitgedrukt in chloor, worden meeverbrand, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
  - number: 5.23.2.b
    text: |-
      bij de exploitatie van de afvalmeeverbrandingsinstallatie gebruik wordt gemaakt van een automatisch systeem
      dat de toevoer van afvalstoffen voorkomt totdat bij het in werking stellen de op grond van onderdeel a vereiste
      temperatuur is bereikt en wanneer de vereiste temperatuur niet gehandhaafd blijft.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.23
  - number: '5.24'
    text: |-
      Bij de exploitatie van een afvalverbrandingsinstallatie en een afvalmeeverbrandingsinstallatie wordt gebruik
      gemaakt van een automatisch systeem dat voorkomt dat afvalstoffen worden toegevoerd wanneer uit continue
      metingen blijkt dat een emissiegrenswaarde wordt overschreden als gevolg van storingen of defecten aan de
      afgasreinigingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.24
  - number: 5.25.1
    text: |-
      Het vervoer en de tussentijdse opslag van verbrandingsresiduen uit een afvalverbrandings- of
      afvalmeeverbrandingsinstallatie geschiedt op een zodanige wijze, dat wordt voorkomen dat de verbrandingsresiduen in
      het milieu terechtkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.25
  - number: 5.25.2
    text: |-
      Voordat de methoden van verwijdering of hergebruik als materiaal van verbrandingsresiduen worden vastgesteld,
      worden passende tests uitgevoerd om na te gaan wat de fysische en chemische eigenschappen en het verontreinigend
      vermogen van de verschillende verbrandingsresiduen zijn. Deze analyse heeft betrekking op de totale oplosbare
      fractie en de oplosbare fractie zware metalen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.25
  - number: '5.26'
    text: |-
      Specifiek ziekenhuisafval wordt rechtstreeks en in hermetisch gesloten verpakking in de oven van een
      afvalverbrandings- of afvalmeeverbrandingsinstallatie geplaatst, zonder voorafgaande vermenging met andere
      categorieën van afvalstoffen overeenkomstig de afvalstoffenlijst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.26
  - number: '5.27'
    text: |-
      Het beheer van een verbrandingsinstallatie is in handen van een natuurlijke persoon die bekwaam is om de
      verbrandingsinstallatie te beheren.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.27
  - number: '5.28'
    text: |-
      Het terrein van een afvalverbrandings- of afvalmeeverbrandingsinstallatie, met de bijbehorende terreinen voor
      de opslag van afval, wordt zodanig ontworpen en geëxploiteerd dat het ongeoorloofd en accidenteel vrijkomen van
      verontreinigende stoffen in de bodem, het oppervlaktewater of het grondwater wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.28
  - number: 5.29.1
    text: |-
      Een afvalverbrandings- of afvalmeeverbrandingsinstallatie is voorzien van een vloeistofdicht bassin met voldoende
      capaciteit voor de opvang van:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.29
  - number: 5.29.1.a
    text: wegvloeiend verontreinigd hemelwater van het terrein;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.29
  - number: 5.29.1.b
    text: verontreinigd water dat het gevolg is van overlopen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.29
  - number: 5.29.1.c
    text: verontreinigd water dat afkomstig is van brandbestrijding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.29
  - number: 5.29.2
    text: |-
      De capaciteit van het bassin is zodanig dat het water, voordat het wordt geloosd, kan worden onderzocht en
      behandeld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.29
  - number: '5.30'
    text: |-
      De meting van de emissies, waaronder tevens begrepen wordt de berekening, registratie en rapportage
      van de meting, bedoeld in [artikel 5.38 van het besluit][ref1], voldoet aan de eisen in de
      [artikelen 5.31 tot en met 5.36][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: 5.31.1
    text: Metingen ter bepaling van de emissies zijn representatief.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.31
  - number: 5.31.2
    text: |-
      Alle monitoringresultaten worden op zodanige wijze geregistreerd, verwerkt en gepresenteerd dat het bevoegd gezag
      kan controleren of voldaan wordt aan de toepasselijke emissiegrenswaarden en andere voorschriften.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.31
  - number: '5.32'
    text: 'De meting van emissies in de lucht omvat:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: 5.32.a
    text: |-
      een continue meting van de emissieconcentratie van totaal stof afkomstig uit puntbronnen met een massastroom van ≥
      200g/uur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: 5.32.b
    text: |-
      een eenmalige meting van de emissieconcentratie van totaal stof afkomstig uit puntbronnen met een massastroom van
      <200 g/uur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: 5.32.c
    text: |-
      indien de IPPC-installatie gebruik maakt van het sulfaatproces: een continue meting van de emissieconcentratie van
      gasvormig zwaveldioxide (SO) en zwaveltrioxide (SO) afkomstig van de ontsluiting en roosting uit inrichtingen voor
      de concentratie van afvalzuren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: 5.32.d
    text: 'indien de IPPC-installatie gebruik maakt van het chlorideproces:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: 5.32.d.1°
    text: een eenmalige meting van de emissieconcentratie van gasvormig zwaveldioxide en zwaveltrioxide;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: 5.32.d.2°
    text: een continue meting van de emissieconcentratie van chloor afkomstig uit de voornaamste bronnen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: 5.32.d.3°
    text: om het jaar een periodieke meting van de emissieconcentratie van zoutzuur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.32
  - number: '5.33'
    text: |-
      Op het punt waar het afvalwater wordt geloosd worden ten minste om de zes maanden periodieke metingen uitgevoerd
      van een met het debiet evenredige steekproef over een periode van 24 uur van:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.33
  - number: 5.33.a
    text: onopgeloste bestanddelen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.33
  - number: 5.33.b
    text: ijzerverbindingen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.33
  - number: 5.33.c
    text: sulfaat, indien de IPPC-installatie gebruik maakt van het sulfaatproces;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.33
  - number: 5.33.d
    text: chloride, indien de IPPC-installatie gebruik maakt van het chlorideproces;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.33
  - number: 5.33.e
    text: de zuurgraad (pH).
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.33
  - number: '5.34'
    text: |-
      Jaarlijks voor 1 maart wordt aan het bevoegd gezag opgave gedaan van de productie van titaandioxide over het
      daaraan voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.34
  - number: '5.35'
    text: |-
      De bemonsteringen, analyses en metingen van de parameters die nodig zijn om te bepalen of wordt voldaan aan de
      emissiegrenswaarden alsmede de andere metingen en berekeningen die zijn voorgeschreven, worden uitgevoerd volgens
      onderstaande normbladen:
          Tabel 5.35






                  **Normbladen voor continue meting van emissies naar lucht**




                  Totaal stof


                  NEN-EN 13284-2




                  **Normbladen voor periodieke en parallelmetingen van emissies naar lucht**




                  Totaal stof


                  NEN-EN 13284-1




                  Zoutzuur en chloor


                  NEN-EN 1911




                  Zwaveldioxide en zwaveltrioxide


                  NEN-EN 14791




                  Zuurstof


                  NEN-EN 14789




                  Waterdamp


                  NEN-EN 14790




                  Debiet


                  ISO 10780




                  **Normbladen voor de bemonstering en analyse van afvalwater**




                  Bemonstering


                  NEN 6600-1




                  Ontsluiting


                  NEN-EN-ISO 15587-1




                  Onopgeloste bestanddelen


                  NEN-EN 872




                  Sulfaat


                  NEN-ISO 22743




                  Chloride


                  NEN-EN-ISO 15682




                  IJzerverbindingen


                  NEN 6966




                  Zuurgraad (pH)


                  NEN-ISO 10523




                  **Algemene normbladen voor kwaliteitsborging**




                  Kwaliteitsborging geautomatiseerde metingsystemen


                  NEN-EN 14181




                  Bekwaamheid laboratoria


                  NEN-EN-ISO/IEC 17025




                  Monsternamestrategie, meetdoel, -plan en -rapportage


                  NEN-EN 15259
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.35
  - number: 5.36.1
    text: |-
      Geautomatiseerde meetsystemen worden ten minste eenmaal per jaar met behulp van parallelmetingen met de
      referentiemeetmethoden, bedoeld in [artikel 5.35][ref1], gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.36
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 5.36.2
    text: |-
      De drijver van de inrichting informeert het bevoegd gezag over de resultaten van de in het eerste lid bedoelde
      controle.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.36
  - number: 5.36.3
    text: |-
      Het uitvoeren van een periodieke meting, eenmalige metingen of parallelmetingen geschiedt door een rechtspersoon
      die voor deze verrichtingen geaccrediteerd is door een accreditatie-instantie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel5.36
  - number: '6.1'
    text: |-
      Met een erkenning op grond van het [Besluit bodemkwaliteit][ref1] als bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 6.1.a
    text: |-
      [artikel 2.1, eerste lid][ref1], wordt tot en met 30 september 2006 gelijkgesteld een certificaat voor het
      inspecteren van vloeistofdichte vloeren en verhardingen;


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 6.1.b
    text: |-
      [artikel 2.1, eerste lid][ref1], wordt tot en met 31 december 2006 gelijkgesteld een accreditatie van de Raad voor
      Accreditatie voor het inspecteren van vloeistofdichte vloeren en verhardingen;


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 6.1.c
    text: |-
      [artikel 2.1, derde lid][ref1], [artikel 3.25, tweede lid][ref2] en [artikel 3.26, tweede lid][ref3], wordt tot en
      met 31 december 2006 gelijkgesteld een certificaat afgegeven door een geaccrediteerde certificeringsinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 6.1.d
    text: |-
      [artikel 3.34 tot en met 3.37][ref1], wordt tot en met 31 december 2007 gelijkgesteld een certificaat afgegeven
      door een geaccrediteerde certificeringsinstelling of, indien het een instelling betreft, een accreditatie afgegeven
      door de Raad voor Accreditatie; overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref2] aangewezen
      normdocument of een eerdere versie van dat normdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0022929
  - number: 6.2.1
    text: |-
      [Artikel 2.1, eerste lid][ref1] is niet van toepassing op een geomembraanbaksysteem dat vóór 1 december 2001 is
      aangelegd en dat voldoet aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 6.2.1.a
    text: |-
      de toegepaste folie is productbestendig, is gemaakt van hoge dichtheid polyetheen (HDPE) of folie van een
      gelijkwaardige kwaliteit, heeft een dikte van ten minste 1 mm en is gecertificeerd op grond van BRL K537;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.2
  - number: 6.2.1.b
    text: |-
      voor het geomembraanbaksysteem is een legplan voorhanden met een aanduiding van de lasnaden en doorvoeren, een Rol
      Testdata rapport, lasrapporten en een lasproefrapport;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.2
  - number: 6.2.1.c
    text: |-
      iedere zes maanden vindt een visuele controle plaats van de verharding die zich boven het geomembraanbaksysteem
      bevindt; bij constatering van een morsing van een grote hoeveelheid vloeibare brandstoffen vindt binnen drie
      maanden een bemonstering plaats van de peilbuizen als bedoeld in [artikel 2.2, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
  - number: 6.2.2
    text: |-
      [Artikel 3.26, tweede lid][ref1] is niet van toepassing op een geomembraanbaksysteem dat vóór 1 januari 2007 is
      aangelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 6.3.1
    text: |-
      [Artikel 2.1][ref1] is tot en met 29 februari 2008 niet van toepassing op vloeistofdichte vloeren en verhardingen
      die zijn aangelegd vóór 1 januari 1992 binnen inrichtingen waarop onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van deze regeling het [Besluit jachthavens][ref2] van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017082
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0017082
  - number: 6.3.2
    text: |-
      [Artikel 2.1][ref1] is tot en met 28 februari 2011 niet van toepassing op vloeistofdichte vloeren en verhardingen
      die zijn aangelegd vanaf 1 januari 1992 tot en met 28 februari 2005 binnen inrichtingen waarop onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van deze regeling het [Besluit jachthavens][ref2] van toepassing
      was.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017082
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0017082
  - number: 6.3.3
    text: |-
      [Artikel 2.1][ref1] is tot en met twee jaar na de aanleg van de desbetreffende vloeren of verhardingen niet van
      toepassing op vloeistofdichte vloeren en verhardingen die zijn aangelegd vanaf 1 maart 2005 tot en met 31 december
      2007 binnen inrichtingen waarop onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van deze regeling
      het [Besluit jachthavens][ref2] van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017082
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.1
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0017082
  - number: 6.4.1
    text: |-
      [Artikel 3.3][ref1] is niet van toepassing op een zuiveringsvoorziening die is geplaatst voor 1 januari 2009,
      indien die zuiveringsvoorziening bestaat uit een septic tank, die een nominale inhoud heeft van ten minste 6
      kubieke meter, en waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.1
        afdeling: '3.1'
  - number: 6.4.1.a
    text: de septic tank uit drie compartimenten bestaat;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.b
    text: |-
      de nominale inhoud, in de stroomrichting, over de compartimenten is verdeeld in de verhouding twee staat tot één
      staat tot één;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.c
    text: |-
      de scheidingswanden tussen de compartimenten van de septic tank ten minste 20 centimeter boven het waterniveau
      uitsteken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.d
    text: |-
      de instroomopening in het eerste compartiment van de septic tank zich ten minste 10 centimeter boven het
      waterniveau bevindt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.e
    text: de toevoerpijp ten minste 5 centimeter en ten hoogste 10 centimeter uit de binnenwand steekt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.f
    text: |-
      de doorstroomopeningen in scheidingswanden tussen de compartimenten van de septic tank zodanig zijn uitgevoerd,
      dat:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.f.1°
    text: doorvoer van bodemslib en drijflagen wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.f.2°
    text: |-
      de gezamenlijke oppervlakte van de doorstroomopeningen per scheidingswand ten minste 100 vierkante centimeter en
      ten hoogste 400 vierkante centimeter bedraagt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.f.3°
    text: de bovenkant van de doorstroomopeningen ten minste 30 centimeter onder het waterniveau ligt; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.f.4°
    text: |-
      de onderkant van de doorstroomopeningen hoger ligt dan de helft van de waterhoogte gemeten vanaf de bodem van de
      septic tank;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.g
    text: |-
      de afvoeropening van een septic tank voorzien is van een duikschot of een T-stuk zodat afvoer van bodemslib of
      drijflagen wordt voorkomen; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.h
    text: 'de waterhoogte in een septic tank ten minste 1,2 meter bedraagt en ten hoogste bedraagt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.h.1°
    text: 2,2 meter bij een inhoud van ten hoogste 10 kubieke meter;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.1.h.2°
    text: 2,5 meter bij een inhoud van meer dan 10 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.2
    text: |-
      Indien afzonderlijke septic tanks als bedoeld in het eerste lid parallel zijn geschakeld, bedraagt de gezamenlijke
      nominale inhoud tenminste 6 kubieke meter en voldoet iedere tank afzonderlijk aan de voorschriften genoemd in het
      eerste lid, onderdelen a tot en met h.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: 6.4.3
    text: |-
      Opdeling van de septic tank als bedoeld in het eerste lid in afzonderlijke in serie geschakelde tanks is
      toegestaan, mits de nominale inhoud van één compartiment niet over verschillende tanks is verdeeld. De
      afzonderlijke septic tanks gelden tezamen als één septic tank.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.4
  - number: '6.5'
    text: |-
      In afwijking van [artikel 3.14][ref1] gelden ten aanzien van een windturbine die voor 1 december 2001 is opgericht
      en waarvoor onmiddellijk voorafgaand aan die datum een vergunning in werking en onherroepelijk was, de in die
      vergunning opgenomen voorschriften met betrekking tot de veiligheid van de installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.5
