    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gc
  - number: 3.4gc.1.b
    text: |-
      het maximaal toegestaan aantal monsters dat niet voldoet, bedoeld in onderdeel a, bevat een overschrijding van de
      grenswaarden voor de parameters, genoemd in dat onderdeel, van ten hoogste:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gc
  - number: 3.4gc.1.b.1°
    text: 100 procent voor biochemisch zuurstofverbruik,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gc
  - number: 3.4gc.1.b.2°
    text: 100 procent voor chemisch zuurstofverbruik, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gc
  - number: 3.4gc.1.b.3°
    text: 150 procent voor onopgeloste stoffen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gc
  - number: 3.4gc.2
    text: |-
      De grenswaarde voor totaal stikstof en totaal fosfor, bedoeld in [artikel 3.5e, vierde lid, van het besluit][ref1],
      in het te lozen stedelijk afvalwater wordt uitgedrukt als de voortschrijdend jaargemiddelde concentratie totaal
      stikstof of totaal fosfor.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gc
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.4gd.1
    text: |-
      Het totale zuiveringsrendement van de zuiveringstechnische werken waarvoor het openbaar lichaam of een andere
      rechtspersoon als bedoeld in [artikel 3.5e, zevende lid, van het besluit][ref1] met de zorg is belast, wordt
      berekend overeenkomstig [bijlage 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gd
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
  - number: 3.4gd.2
    text: |-
      Voor de meting van de hoeveelheid stedelijk afvalwater in kubieke meter wordt een methode gehanteerd waarvan de
      onnauwkeurigheid in de debietmeting kleiner is dan 5%. Dit wordt door ijking vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4gd
  - number: 3.4h
    text: |-
      In deze paragraaf wordt verstaan onder:

            a
            hulpconstructie:

              constructie waarop of waarin reinigings- of conserveringswerkzaamheden aan een vast object plaatsvinden;



            b
            stofdichte wand:

              afdichting gericht op het voorkomen van emissie van stofdelen uit de hulpconstructie;



            c
            vloeistofdichte wand:

              afdichting gericht op het voorkomen van emissie van vloeistof of nevel uit de hulpconstructie;



            d
            winddichte wand:

              afdichting gericht op het voorkomen van invloed van wind op de emissie van stofdelen, vloeistof of nevel
      uit de hulpconstructie;



            e
            stoffen:

              afvalstoffen, verontreinigende of schadelijke stoffen, die bij reinigings- of conserveringswerkzaamheden
      worden gebruikt dan wel van het vast object vrijkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4h
  - number: 3.4i.1
    text: |-
      Als reinigingswerkzaamheden als bedoeld in [artikel 3.6a, tweede lid, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.4i.1.a
    text: R1-technieken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.1.b
    text: R2-technieken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.1.c
    text: R3-technieken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.1.d
    text: R4-technieken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.1.e
    text: R5-technieken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.2
    text: 'Als R1-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.2.a
    text: afwassen met water;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.2.b
    text: schoonspuiten met water onder een druk van ten hoogste 200 bar zonder toevoeging van ontvetters;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.2.c
    text: stoomreinigen onder een druk van ten hoogste 200 bar zonder toevoeging van ontvetters;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.2.d
    text: ontvetten met doeken en een ontvetter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3
    text: 'Als R2-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.a
    text: bevochtigd handmatig schuren met schuurpapier of met een handschuurapparaat;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.b
    text: borstelen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.c
    text: beitelen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.d
    text: bikken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.e
    text: schrapen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.f
    text: steken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.g
    text: slijpen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.h
    text: branden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.i
    text: afkrabben;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.j
    text: gebruiken van naaldhamer of bikhamer;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.k
    text: schuren of borstelen met roterende schuurmachines met bronafzuiging;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.l
    text: mobiel werpstralen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.m
    text: vacuümstralen met bronafzuiging;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.3.n
    text: afblazen met perslucht tot 8 bar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.4
    text: 'Als R3-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.4.a
    text: droog aanstralen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.4.b
    text: droog integraal stralen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.4.c
    text: integraal opruwen door stralen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.4.d
    text: roestvrij maken van oppervlakken door stralen of ministralen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.4.e
    text: droog ijs- of CO-stralen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.5
    text: 'Als R4-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.5.a
    text: chemisch reinigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.5.b
    text: chemisch ontvetten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.5.c
    text: schoonspuiten met water met toevoeging van ontvetters;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.5.d
    text: stoomreinigen met toevoeging van ontvetters.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.6
    text: 'Als R5-technieken worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.6.a
    text: watergritreinigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.6.b
    text: lage druk watergritstralen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.6.c
    text: lage druk vochtig stralen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.4i
  - number: 3.4i.6.d
