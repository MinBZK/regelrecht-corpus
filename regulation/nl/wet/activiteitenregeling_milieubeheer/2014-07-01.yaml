      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt in overeenstemming met de Minister van
      Verkeer en Waterstaat binnen zes jaar na de inwerkingtreding van deze regeling aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten van deze regeling in de praktijk.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel6.13
  - number: '6.14'
