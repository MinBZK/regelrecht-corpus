        paragraaf: 3.4.3
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
  - number: 3.44.1.a
    text: nat afval van het vegen van openbare straten en terreinen, markten en evenementen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
  - number: 3.44.1.b
    text: nat afval van het legen van openbare afvalbakken en het opruimen van stranden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
  - number: 3.44.1.c
    text: afval van het reinigen van havens, kanalen, sloten, grachten en vijvers;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
  - number: 3.44.1.d
    text: afval van het reinigen van riolen, kolken en gemalen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
  - number: 3.44.1.e
    text: autowrakken of wrakken van tweewielige motorvoertuigen die vloeistoffen bevatten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
  - number: 3.44.1.f
    text: onderdelen van autowrakken of wrakken van tweewielige motorvoertuigen die vloeistoffen bevatten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
  - number: 3.44.1.g
    text: |-
      van buiten de inrichting afkomstige grond of baggerspecie waarvan de kwaliteit niet is vastgesteld op grond van
      [artikel 38 van het Besluit bodemkwaliteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel38
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '38'
  - number: 3.44.1.h
    text: |-
      van buiten de inrichting afkomstige grond of baggerspecie waarvan de kwaliteit de waarden, bedoeld in de
      [artikelen 59][ref1] en [60, van het Besluit bodemkwaliteit][ref2] overschrijdt, tenzij die ter plaatse van de
      opslag voldoet aan [artikel 52 van dat besluit][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel52
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '52'
  - number: 3.44.1.i
    text: |-
      afgedankte elektrische en elektronische apparatuur, waaruit vloeibare bodembedreigende
      stoffen kunnen lekken, uitgezonderd de apparatuur van particuliere huishoudens, bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Regeling afgedankte elektrische en elektronische apparatuur][ref1] die
      overeenkomstig de [artikelen 4][ref2] en [5][ref3] van die regeling is ingenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0034782#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034782#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034782#Artikel5
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.44
