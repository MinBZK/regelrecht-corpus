  - number: 4.49a.1
    text: |-
      Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.31b, vierde lid, van het besluit][ref1] wordt stofklasse S die vrijkomt bij het wegen of mengen van
      rubbercompounds, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.49a.2
    text: |-
      Ten behoeve van een doelmatige verspreiding van emissies naar de buitenlucht als bedoeld in
      [artikel 4.31b, vierde lid, van het besluit][ref1] worden emissies die vrijkomen bij het wegen of mengen van
      rubbercompounds of het verwerken van rubber, thermoplastische kunststof of polyesterhars, voor zover die worden
      afgezogen, bovendaks en omhoog gericht naar de buitenlucht afgevoerd, indien binnen 50 meter van een emissiepunt
      een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein of een bedrijventerrein met
      minder dan één gevoelig gebouw per hectare, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.49a.3
    text: |-
      Het bevoegd gezag kan, in het belang van de luchtkwaliteit en met inachtneming van de NeR, maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49a
  - number: 4.49b
    text: |-
      Aan [artikel 4.31b, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.49b.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij het wegen of mengen van rubbercompounds worden gevoerd door een
      filtrerende afscheider die geschikt is om aan [artikel 4.31b, eerste lid, van het besluit][ref1] te voldoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.49b.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49b
  - number: 4.49c.1
    text: |-
      Stoffen als bedoeld in het [4.31b, tweede lid, van het besluit][ref1], die bij het mengen van rubbercompounds
      of het verwerken van rubber of thermoplastische kunststof worden toegepast en in ieder geval onder een
      minimalisatieverplichting vallen, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49c
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.49c.1.a
    text: benzyl butyl ftalaat (BBP);
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49c
  - number: 4.49c.1.b
    text: dibutyl ftalaat (DBP);
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49c
  - number: 4.49c.1.c
    text: di-ethyl hexyl ftalaat (DEHP);
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49c
  - number: 4.49c.1.d
    text: di-isobutyl ftalaat (DIBP).
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49c
  - number: 4.49c.2
    text: |-
      Op de stoffen, bedoeld in het eerste lid, is het bepaalde in de EG-verordening registratie, evaluatie en
      autorisatie van chemische stoffen onverminderd van toepassing.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49c
  - number: 4.49d.1
    text: |-
      Ten behoeve van het voorkomen of, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken van
      de geurhinder, bedoeld in [artikel 4.31c van het besluit][ref1], past degene die de inrichting drijft de volgende
      emissiereducerende maatregelen met betrekking tot styreen toe, tenzij deze niet kosteneffectief of niet technisch
      uitvoerbaar zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.49d.1.a
    text: toepassen van harsen met additieven die verdamping van styreen bij het uitharden beperken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.b
    text: toepassen van harsen met een verlaagd styreengehalte;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.c
    text: toepassen van harsen waarin styreen deels is vervangen door dicyclopentadieen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.d
    text: spuittechnieken zonder persluchtondersteuning;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.e
    text: toepassen van een lagedruk polyesterharsopbrengsysteem;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.f
    text: overschakelen op een gesloten malsysteem;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.g
    text: overschakelen op een vacuümfoliesysteem;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.h
    text: afdekken van emmers en vaten;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.i
    text: toepassen van gesloten leidingssystemen voor oplosmiddelen en hars; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.1.j
    text: |-
      toepassen van een nageschakelde techniek zoals cryocondensatie, thermische of katalytische naverbranding, een
      bioreactor of een zuurstofradicaalgenerator.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.2
    text: |-
      Het eerste lid is niet van toepassing indien degene die de inrichting drijft aantoont dat de geurhinder beperkt
      blijft tot een aanvaardbaar niveau of dat het mogelijke effect van de styreenemissie beperkt blijft tot een
      gezoneerd industrieterrein of een bedrijventerrein met minder dan één geurgevoelig object per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.3
    text: |-
      Het bevoegd gezag kan, indien blijkt dat bij het verwerken van polyesterhars ondanks de maatregelen, bedoeld in het
      eerste lid, de geurhinder een aanvaardbaar niveau overschrijdt met inachtneming van de NeR maatwerkvoorschriften
      stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.3.a
    text: het niet in de buitenlucht verwerken van polyesterhars,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.3.b
    text: de situering van de afvoerpijp,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.3.c
    text: het voorkomen of beperken van diffuse emissies, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.3.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49d.4
    text: |-
      Het bevoegd gezag kan, indien blijkt dat bij het verwerken van polyesterhars ondanks de maatregelen bedoeld in
      het eerste lid, de geurhinder een aanvaardbaar niveau overschrijdt en de uitoefening van bevoegdheden, bedoeld
      in het derde lid, onvoldoende effect hebben om de overschrijding ongedaan te maken, met inachtneming van de NeR
      maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een ontgeuringsinstallatie of een grotere
      afvoerhoogte van de bij het verwerken van polyesterhars vrijkomende gassen en dampen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49d
  - number: 4.49e.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.31d van het besluit][ref1] vindt het:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.49e.1.a
    text: mengen van rubbercompounds;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49e
  - number: 4.49e.1.b
    text: |-
      verwerken van rubber of thermoplastisch kunststof waarbij gebruik wordt gemaakt van een installatie met een olie-
      of koelvloeistofcircuit, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49e
  - number: 4.49e.1.c
    text: verwerken van polyesterhars, waaronder tevens wordt verstaan het reinigen van de daarbij gebruikte apparatuur,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49e
  - number: 4.49e.2
    text: |-
      Bij de aanleg van de bodembeschermende voorziening voor het mengen van rubbercompounds, bedoeld in het eerste lid,
      onder a, wordt bijzondere aandacht besteed aan toevoer- en aftappunten van de menginstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.49e
  - number: 4.50.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden stof en rook die
      vrijkomen bij smeden, droogverspanende bewerkingen, thermische bewerkingen en mechanische eindafwerking van
      metalen, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.50
  - number: 4.50.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden voor zover het afgezogen
      emissies betreft, die vrijkomen bij smeden, droogverspanende bewerkingen, thermische bewerkingen en mechanische
      eindafwerking van metalen en die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd,
      indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd
      industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.50
  - number: 4.50.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.50
  - number: 4.50.4
    text: |-
      Indien vanwege het volume of het gewicht van het te bewerken object, bedoeld in
      [artikel 4.32, tweede lid, van het besluit][ref1], het uitvoeren van fijnverspanende bewerkingen aan metalen in de
      buitenlucht plaatsvindt, worden emissies die hierbij in de buitenlucht vrijkomen voorkomen, dan wel beperkt door
      het toepassen van doelmatige stofarme technieken, tenzij dit redelijkerwijs niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.50
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.50.5
    text: |-
      Indien het toepassen van doelmatige stofarme technieken als genoemd in het vierde lid redelijkerwijs niet mogelijk
      is, worden de emissies van stof die vrijkomen bij het uitvoeren van fijnverspanende bewerkingen aan metalen in de
      buitenlucht, gereduceerd door het plaatsen van een doelmatige omkapping van geschikt materiaal.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.50
  - number: 4.50.6
    text: |-
      Ten aanzien van het zoveel mogelijk voorkomen, dan wel tot een aanvaardbaar niveau beperken van stofhinder bij het
      uitvoeren van fijnverspanende bewerkingen aan metalen in de buitenlucht, kan het bevoegd gezag met inachtneming van
      de NeR maatwerkvoorschriften stellen ter uitwerking van het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.50
  - number: '4.51'
    text: |-
      Aan [artikel 4.33, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.51.a
    text: |-
      de afgezogen emissies die vrijkomen bij het smeden, droogverspanende bewerkingen, thermische bewerkingen en
      mechanische eindafwerking van metalen, worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.33, eerste lid, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.51.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.51
  - number: '4.52'
    text: |-
      Aan [artikel 4.34, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.52.a
    text: |-
      de afgezogen emissies die vrijkomen bij droogverspanende bewerkingen, thermische bewerkingen en mechanische
      eindafwerking van roestvast staal, worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.34, eerste lid, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.52.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.52
  - number: '4.53'
    text: |-
      Aan [artikel 4.35, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.53.a
    text: |-
      de afgezogen emissies die vrijkomen bij het snijden van koper worden gevoerd door een filtrerende afscheider die
      geschikt is om aan [artikel 4.35, eerste lid, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.53.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.53
  - number: '4.54'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden verspanende, spaanloze en thermische
      bewerkingen en mechanische eindafwerkingen van metalen, waarbij vloeibare bodembedreigende stoffen worden gebruikt,
      en het mechanisch verkleinen van metalen waarbij gebruik wordt gemaakt van een installatie met een oliecircuit
      plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54
  - number: 4.54a
    text: |-
      Bij het lassen van metalen wordt de volgende klassenindeling, bedoeld in
      [artikel 4.40, tweede lid, van het besluit][ref1], aangehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.54a.a
    text: 'Klasse I en II:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.a.−
    text: |-
      TIG-lassen, plasmalassen, druklassen, autogeen lassen en onder poederlassen van alle materialen met uitzondering
      van geverfde materialen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.b
    text: 'Klasse III:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.b.−
    text: |-
      Lassen met beklede elektroden van alle materialen met uitzondering van roestvast staal, beryllium- en
      vanadiumlegeringen en met uitzondering van geverfde materialen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.b.−
    text: MAG-lassen met gevulde draad van alle materialen met uitzondering van roestvast staal en geverfde materialen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.b.−
    text: |-
      MIG/MAG-lassen met massieve draad van alle materialen met uitzondering van koper-, berylliumen vanadiumlegeringen
      en met uitzondering van geverfde materialen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.c
    text: |-
      Klasse IV: Het lassen van geverfde materialen (met uitzondering van loodmenie) met behulp van één van de volgende
      technieken:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.c.−
    text: TIG-lassen (met uitzondering van aluminium), plasmalassen, druklassen, autogeenlassen, onder poeder lassen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.c.−
    text: Lassen met beklede elektroden, MAG-lassen met gevulde draad en MIG/MAG-lassen met massieve draad.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.d
    text: 'Klasse V, VI en VII:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.d.−
    text: 'Lassen met beklede elektroden, van de materialen: roestvast staal, vanadiumle geringen en berylliumlegeringen;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.d.−
    text: 'MAG-lassen met gevulde draad van de materialen: roestvast staal;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.d.−
    text: Lassen met gelegeerde elektrode of met gelegeerde gevulde draad;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.d.−
    text: |-
      MIG-lassen met gevulde draad of massieve draad van de materialen: koperlegeringen en beryllium- en
      vanadiumlegeringen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.d.−
    text: 'Lassen met gevulde draad van de materialen: ongelegeerd en gelegeerd staal;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.54a.d.−
    text: 'Lassen van de materialen: geverfd staal met loodmenie.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.54a
  - number: 4.55.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden stof en rook die
      vrijkomen bij het lassen van metalen behorend tot klasse III bij een verbruik van meer dan 6.500 kilogram
      lastoevoegmateriaal en -elektroden per jaar, en klasse V, VI en VII, voor zover het activiteiten betreft zoals
      bedoeld in [artikel 4.56 vijfde lid][ref1], bij een verbruik van meer dan 200 kilogram lastoevoegmateriaal en
      overige activiteiten klasse IV tot en met VII, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron
      afgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.55
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.2
        afdeling: '4.5'
  - number: 4.55.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, wordt voor zover het afgezogen lasrook
      vanwege het lassen van metalen betreft, die naar de buitenlucht wordt afgevoerd, bovendaks en omhoog gericht
      afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op
      een gezoneerd industrieterrein, dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.55
  - number: 4.55.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.55
  - number: 4.56.1
    text: |-
      Aan de [artikelen 4.40, eerste lid][ref1], [4.41, eerste lid][ref2], en [4.42, eerste lid, van het besluit][ref3]
      wordt in ieder geval voldaan indien de afgezogen lucht afkomstig van alle klassen laswerkzaamheden wordt
      gerecirculeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.56
    references:
