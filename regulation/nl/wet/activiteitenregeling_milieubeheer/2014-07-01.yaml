        bwb_id: BWBR0022762
        artikel: '1'
  - number: 3.113.a
    text: |-
      een gedetailleerde beschrijving (naam, type, fabricaat) van de gemeten representatieve wapens en de gebruikte
      munitie (type en LOT-nummer);
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.113.b
    text: |-
      het totale aantal schoten van de representatieve gebruiksituatie voor de relevante wapencategorieën voor de
      relevante beoordelingsperioden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.113.c
    text: gebruikte meetapparatuur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.113.d
    text: |-
      een plattegrond van de meetsituatie (bijvoorbeeld: ligging baan, positie wapen, adres, omgeving geluidgevoelige
      bestemmingen, etc.) en een opgave van de beoordelingspunten (afstanden, microfoonhoogte, afstand tot de gevel,
      afmetingen van de ruimte);
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.113.e
    text: de meetwaarden voor L en L alsmede de energetische gemiddelde waarden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.113.f
    text: de beoordelingsniveaus per meetlocatie voor de relevante beoordelingsperioden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.113.g
    text: het gemeten achtergrondgeluidniveau per meetlocatie en beschrijving van de aard van de stoorgeluiden, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.113.h
    text: de weersomstandigheden indien metingen buiten zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.113
  - number: 3.114.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, bedoeld in [artikel 3.146 van het besluit][ref1], wordt bij het traditioneel
      schieten ten minste voldaan aan het vierde tot en met zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.114.2
    text: |-
      Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de
      belasting van de bodem, bedoeld in [artikel 3.146 van het besluit][ref1], wordt bij het traditioneel schieten
      voldaan aan het derde, vierde en zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.114.3
    text: |-
      Indien bij het schieten hulzen van verschoten munitie vrijkomen, vindt het schieten plaats boven een
      bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.114.4
    text: |-
      Het schieten vindt op zodanige wijze plaats dat alle afgeschoten kogels worden opgevangen in een voorziening. De
      voorziening is opgesteld boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.114.5
    text: |-
      Gedurende de periode dat wordt geschoten bevinden zich geen personen of veediersoorten in de onveilige zone,
      uitgezonderd de schutter, de baancommandant en één of meerdere door de baancommandant aangewezen personen. De
      onveilige zone omvat de oppervlakte van een rechthoek van twee meter aan weerszijde van de voorziening waarin de
      afgeschoten kogels worden opgevangen, bedoeld in het vierde lid, bij acht meter. De zone bevindt zich aan de zijde
      waar op het doel wordt geschoten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.114.6
    text: |-
      In afwijking van het vijfde lid omvat de onveilige zone bij het schieten op een houten blok of knoest met kogels
      van kalibernummer 16 of kleiner de oppervlakte van een halve cirkel met een straal van 25 meter met het doel waarop
      wordt geschoten als middelpunt. De zone bevindt zich aan de zijde waar op het doel wordt geschoten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.114.7
    text: |-
      In afwijking van het vierde tot en met het zesde lid kan het bevoegd gezag bij de viering van festiviteiten
      maatwerkvoorschriften stellen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.114.7.a
    text: |-
      het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van de belasting van de bodem;
      en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.114.7.b
    text: met betrekking tot de onveilige zone.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.114.8
    text: |-
      De dagen of dagdelen waarop festiviteiten als bedoeld in het zevende lid plaatsvinden worden door het bevoegd gezag
      bij maatwerkvoorschrift aangewezen, met dien verstande dat het aantal aan te wijzen dagen of dagdelen niet meer dan
      twaalf per kalenderjaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.114
  - number: 3.115.1
    text: |-
      Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.156 van het besluit][ref1] voldoet
      een inrichting waar een gemeente gelegenheid biedt om grove huishoudelijke afvalstoffen achter te laten ten minste
      aan het tweede tot en met het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.115.2
    text: |-
      Bij een inrichting waar een gemeente gelegenheid biedt om grove huishoudelijke afvalstoffen achter te laten zijn
      voorzieningen aanwezig voor het gescheiden achterlaten van de volgende grove huishoudelijke afvalstoffen:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.a
    text: afgedankte elektrische en elektronische apparatuur;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.b
    text: asbest;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.c
    text: C-hout;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.d
    text: gasflessen, brandblussers en overige drukhouders;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.e
    text: grond;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.f
    text: A-hout en B-hout;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.g
    text: banden van voertuigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.h
    text: dakafval;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.i
    text: geëxpandeerd polystyreenschuim;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.j
    text: gemengd steenachtig materiaal, niet zijnde asfalt en niet zijnde gips;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.k
    text: gips;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.l
    text: grof tuinafval;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.m
    text: harde kunststoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.n
    text: matrassen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.o
    text: metalen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.p
    text: papier en karton;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.q
    text: textiel, niet zijnde tapijt; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.2.r
    text: vlakglas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.3
    text: |-
      Het tweede lid is niet van toepassing op grove huishoudelijke afvalstoffen die de inrichting niet inneemt. De
      inrichtinghouder zorgt er in dat geval voor dat bij de inrichting duidelijk is aangegeven waar de inwoners van de
      gemeente deze afvalstoffen wel kunnen aanbieden. Verder neemt de inrichtinghouder in dat geval in de procedures
      van acceptatie en controle bedoeld in [artikel 2.14b van het besluit][ref1] op hoe ervoor gezorgd wordt dat deze
      afvalstoffen niet worden ingenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 3.115.4
    text: |-
      Onverminderd [artikel 2.14b van het besluit][ref1] draagt de inrichtinghouder er zorg voor dat zoveel mogelijk
      wordt voorkomen dat afvalstoffen waarvoor specifieke voorzieningen aanwezig zijn in de voorziening voor het
      restafval worden gedeponeerd. De inrichtinghouder neemt in de procedures van acceptatie en controle bedoeld in
      artikel 2.14b van het besluit op hoe hier invulling aan gegeven wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: 3.115.5
    text: |-
      De voorziening voor matrassen, bedoeld in het tweede lid, aanhef en onder n, wordt zo uitgevoerd dat de matrassen
      niet in contact komen met hemelwater.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.6
    text: |-
      Bij maatwerkvoorschrift kan het bevoegd gezag toestaan dat een of meer van de voorzieningen, bedoeld in het tweede
      lid, onder f tot en met r, niet aanwezig zijn, op voorwaarde dat de inrichtinghouder op een redelijke in het
      voorschrift te stellen termijn via nascheiding of op andere wijze een zelfde niveau van afvalscheiding bereikt
      waarmee een zelfde niveau van recycling kan worden bereikt als bij het gescheiden houden conform het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 3.115.7
    text: |-
      Bij maatwerkvoorschrift als bedoeld in het vijfde lid kunnen voorwaarden worden gesteld aan de wijze van
      nascheiding of andere alternatieve verwerking en het overleggen van bescheiden hierover.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.115
  - number: 4.1.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover
      dat niet mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan als bedoeld in [artikel 4.1, eerste lid, van het besluit][ref1]
      wordt bij de opslag van gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking, niet zijnde
      vuurwerk, andere ontplofbare stoffen, vaste kunstmeststoffen of organische peroxiden als bedoeld in
      [artikel 4a, onder d, van het besluit][ref2], ten minste voldaan aan de [artikelen 4.2 tot en met 4.9b][ref3]
      en [4.10, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.1.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.1, zevende lid, van het besluit][ref1], wordt bij het opslaan van gevaarlijke stoffen in verpakking,
      vloeibare bodembedreigende stoffen in verpakking, afvalstoffen waaruit vloeibare bodembedreigende stoffen kunnen
      lekken en CMR-stoffen in verpakking, niet zijnde vuurwerk, andere ontplofbare stoffen, vaste kunstmeststoffen,
      of organische peroxiden als bedoeld in [artikel 4a, onder d, van het besluit][ref2], voldaan aan de
      [artikelen 4.2][ref3], [4.9][ref4], [4.9a][ref5], [4.9b][ref6] en [4.10][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref5
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref6
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref7
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.1.3
    text: |-
      Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het zoveel mogelijk beperken van
      verontreiniging van het oppervlaktewater als bedoeld in [artikel 4.1, negende lid, van het besluit][ref1] wordt
      bij het boven oppervlaktewater opslaan van gevaarlijke stoffen in verpakking, vloeibare bodembedreigende stoffen
      in verpakking en CMR-stoffen in verpakking, niet zijnde vuurwerk, vaste kunstmeststoffen, organische peroxiden als
      bedoeld in [artikel 4a, onder d, van het besluit][ref2], asbest, gedemonteerde airbags en gordelspanners en andere
      ontplofbare stoffen voldaan aan de [artikelen 4.2][ref3] en [4.10a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.1.4
    text: |-
      Van een voldoende brandwerende voorziening als bedoeld in
      [artikel 4.1, derde en vijfde lid, van het besluit][ref1], is in ieder geval sprake indien de wand een
      brandwerendheid van ten minste 60 minuten heeft, een hoogte heeft van twee meter en aan weerszijden van de
      opslagvoorziening een lengte heeft van ten minste twee meter, horizontaal gemeten vanaf de opslagvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: '4.2'
    text: |-
      De verpakking van gevaarlijke stoffen, gevaarlijke afvalstoffen, vloeibare bodembedreigende stoffen en CMR-
      stoffen tegen normale behandeling bestand en is zodanig dat niets van de inhoud uit de verpakking onvoorzien kan
      ontsnappen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking worden opgeslagen in een opslagvoorziening die is
      uitgevoerd en wordt gebruikt overeenkomstig de volgende onderdelen van PGS 15:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.1.a
    text: |-
      paragraaf 3.1, met uitzondering van voorschrift 3.1.2, paragraaf 3.2, met uitzondering van voorschrift 3.2.12, en
      paragraaf 3.4;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.1.b
    text: de paragrafen 3.8 tot en met 3.20, met uitzondering van voorschrift 3.10.5;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.1.c
    text: voorschrift 3.21.1, eerste alinea, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.1.d
    text: paragraaf 3.23.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.2.a
    text: gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking van de klassen 1, 4 of 7 van het ADR;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.2.b
    text: |-
      gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking van de klasse 9 van het ADR, met uitzondering van de
      stoffen met classificatiecode M6 of M7 die het aquatisch milieu verontreinigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.2.c
    text: gasflessen, spuitbussen, gaspatronen of aanstekers van de klasse 2 van het ADR, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: 4.3.2.d
    text: accu’s.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.3
  - number: '4.4'
    text: |-
      Spuitbussen, gaspatronen of aanstekers van de klasse 2 van het ADR worden opgeslagen in een opslagvoorziening die
      is uitgevoerd en wordt gebruikt overeenkomstig de volgende onderdelen van PGS 15:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4
  - number: 4.4.a
    text: de voorschriften 3.1.1 en 3.1.3;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4
  - number: 4.4.b
    text: paragraaf 3.2, met uitzondering van voorschrift 3.2.12, en paragraaf 3.4;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4
  - number: 4.4.c
    text: de paragrafen 3.10 tot en met 3.20, met uitzondering van voorschrift 3.10.5 en paragraaf 3.14;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4
  - number: 4.4.d
    text: voorschrift 3.21.1, eerste alinea;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4
  - number: 4.4.e
    text: paragraaf 3.23, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4
  - number: 4.4.f
    text: de voorschriften 7.3.1 tot en met 7.3.5, 7.4.1 en 7.4.2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4
  - number: 4.4a.1
    text: |-
      Gasflessen van de klasse 2 van het ADR worden opgeslagen in een opslagvoorziening die is uitgevoerd en wordt
      gebruikt overeenkomstig de volgende onderdelen van PGS 15:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.1.a
    text: de voorschriften 3.1.1 en 3.1.3;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.1.b
    text: paragraaf 3.2, met uitzondering van voorschrift 3.2.12, en paragraaf 3.4, met uitzondering van voorschrift 3.4.5;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.1.c
    text: de paragrafen 3.11 en 3.15 tot en met 3.20;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.1.d
    text: voorschrift 3.21.1, eerste alinea;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.1.e
    text: paragraaf 3.23, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.1.f
    text: de voorschriften 6.1.2 en 6.1.3.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.2
    text: |-
      Gasflessen van de klasse 2 van het ADR in een brandveiligheidsopslagkast worden opgeslagen overeenkomstig de
      volgende onderdelen van PGS 15:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.2.a
    text: de voorschriften 6.2.1 tot en met 6.2.3;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.2.b
    text: de voorschriften 6.2.7 tot en met 6.2.16, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.2.c
    text: de voorschriften 6.3.2 tot en met 6.3.6.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.3
    text: Het opslaan van gasflessen anders dan in een brandveiligheidsopslagkast voldoet aan paragraaf 6.2 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.4
    text: 'Het eerste, tweede en derde lid zijn niet van toepassing op gasflessen van de klasse 2 van het ADR met:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.4.a
    text: kooldioxide met een doelmatige drukontlastvoorziening;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.4.b
    text: kooldioxide bij horecagelegenheden, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.4.c
    text: blusgas.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.5
    text: |-
      Een opslagplaats voor de gasflessen, bedoeld in het vierde lid, is vanaf de buitenzijde als zodanig herkenbaar, op
      een duidelijke wijze gemarkeerd en niet voor onbevoegden toegankelijk.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4a.6
    text: |-
      Gasflessen buiten een opslagvoorziening als bedoeld in het eerste lid voldoen aan de voorschriften 6.2.3, 6.2.10 en
      6.2.14 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4a
  - number: 4.4b.1
    text: |-
      Gevaarlijke stoffen in verpakking van de klasse 4 van het ADR worden opgeslagen in een opslagvoorziening als
      bedoeld in [artikel 4.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.4b.2
    text: |-
      Het opslaan van gevaarlijke stoffen in verpakking van de klasse 4 van het ADR anders dan in een
      brandveiligheidsopslagkast voldoet aan voorschrift 8.5.1 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4b
  - number: 4.4b.3
    text: |-
      Het opslaan van gevaarlijke stoffen in verpakking van de klasse 4.1 van het ADR anders dan in een
      brandveiligheidsopslagkast voldoet aan voorschrift 8.5.2 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4b
  - number: 4.4c.1
    text: Gebruikte accu’s worden opgeslagen boven een vloeistofdichte vloer, verharding of lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4c
  - number: 4.4c.2
    text: 'De vloeistofdichte vloer, verharding of lekbak, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4c
  - number: 4.4c.2.a
    text: is voldoende sterk om weerstand te bieden aan optredende vloeistofdruk als gevolg van een lekkage;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4c
  - number: 4.4c.2.b
    text: heeft een oppervlak dat niet groter is dan 20 vierkante meter, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4c
  - number: 4.4c.2.c
    text: heeft een opvangcapaciteit die ten minste gelijk is aan de totale inhoud van de opgeslagen accu’s.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4c
  - number: 4.4c.3
    text: Een accu staat rechtop.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.4c
  - number: 4.5.1
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen aan het opslaan van gevaarlijke stoffen als bedoeld
      in deze paragraaf, voor zover in deze paragraaf wordt verwezen naar de voorschriften 3.1.1, 3.1.3, 3.1.4, 3.1.5,
      3.2.9, 3.2.10, 3.10.4, 3.18.1, 6.2.4 tot en met 6.2.6, 6.3.6, 8.5.1 en 10.2.1 van PGS 15 en deze voorschriften van
      PGS 15 voorzien in de mogelijkheid tot afwijkende voorschriften.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift bij het opslaan van gevaarlijke stoffen de aanwezigheid van een
      deskundige als bedoeld in voorschrift 3.17.1 van PGS 15, voorschrijven, voor zover in deze paragraaf wordt verwezen
      naar dat voorschrift.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Het tweede lid is eveneens van toepassing op inrichtingen waar minder dan 2.500 kilogram verpakte gevaarlijke
      stoffen of CMR-stoffen worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.5
  - number: 4.6.1
    text: |-
      [Artikel 4.3, eerste lid][ref1], is niet van toepassing op de volgende stoffen van klasse 3 van het ADR:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.6.1.a
    text: alcoholhoudende dranken in consumentenverpakking;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.1.b
    text: dieselolie, gasolie of lichte stookolie met een vlampunt tussen 60 graden Celsius en 100 graden Celsius;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.1.c
    text: verwarmde brandbare vloeistoffen met UN-nummer 3256, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.1.d
    text: |-
      niet giftige, niet-bijtende en niet-milieugevaarlijke viskeuze oplossingen en homogene mengsels met een vlampunt
      van 23 graden Celsius en hoger, die niet zijn onderworpen aan de voorschriften van het ADR.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.2
    text: |-
      De [artikelen 4.3, eerste lid][ref1], [4.4][ref2], [4.4a, eerste tot en met vijfde lid][ref3], [4.4b][ref4] en
      [4.4c][ref5] zijn niet van toepassing op gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking die:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref4
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref5
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.6.2.a
    text: |-
      tijdelijk worden opgeslagen overeenkomstig [artikel 4.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.6.2.b
    text: als werkvoorraad aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.2.c
    text: in vervoerseenheden aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.2.d
    text: in een verkoopruimte aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.2.e
    text: via leidingen zijn aangesloten op een installatie, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.2.f
    text: |-
      aanwezig zijn in hoeveelheden kleiner dan de in tabel 4.6 weergegeven hoeveelheden. Indien sprake is van stoffen
      uit verschillende klassen in hoeveelheden die kleiner zijn dan de in tabel 4.6 opgenomen ondergrens, wordt naar
      rato berekend of de ondergrens wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.3
    text: |-
      Onverminderd het tweede lid geldt een vrijstelling tot de dubbele hoeveelheid van de in tabel 4.6 genoemde
      ondergrenzen voor verpakkingen als LQ. Deze vrijstelling geldt alleen indien de stoffen zijn opgeslagen in een
      gesloten verpakking die voldoet aan de daartoe in het ADR gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.6.4
    text: Voor stoffen met een bijkomend gevaar is de laagste ondergrens bepalend.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.6
  - number: 4.7.1
    text: 'Tijdelijke opslag van gevaarlijke stoffen vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.1.a
    text: in één of meer speciaal daarvoor bestemde opslagvoorzieningen, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.1.b
    text: |-
      in één of meer laad- en losgedeelten tijdens de aanwezigheid van een deskundige als bedoeld in voorschrift 3.17.1
      van PGS 15.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Tijdelijke opslag van gevaarlijke stoffen als bedoeld in het eerste lid voldoet aan de volgende onderdelen van
      PGS 15:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.2.a
    text: de voorschriften 3.2.9 en 3.4.1 tot en met 3.4.4;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.2.b
    text: de paragrafen 3.8, 3.9, 3.11, 3.13 tot en met 3.18, met uitzondering van voorschrift 3.16.2, en paragraaf 3.20;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.2.c
    text: voorschrift 3.21.1, eerste alinea;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.2.d
    text: paragraaf 3.23, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.2.e
    text: de voorschriften 10.2.1 en 10.4.1 tot en met 10.4.7, met uitzondering van voorschrift 10.4.4.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.3
    text: |-
      In de opslagvoorziening, bedoeld in het eerste lid, onderdeel a, en in het laad- en losgedeelte, bedoeld in het
      eerste lid, onderdeel b, zijn geen stoffen aanwezig van:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.3.a
    text: verpakkingsgroep I van het ADR;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.3.b
    text: de klasse 1, 2.3 en 7 van het ADR;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.3.c
    text: de klasse 5.2 van het ADR, met uitzondering van gelimiteerde hoeveelheden tot 1.000 kg, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.3.d
    text: de klasse 6.2 van het ADR, met uitzondering van stoffen UN-nummer 3291 en UN-nummer 3373.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.4
    text: Het derde lid is van overeenkomstige toepassing op gasflessen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.5
    text: 'Onverminderd het tweede tot en met vierde lid geldt voor de opslag, bedoeld in het eerste lid, onderdeel a, dat:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.5.a
    text: deze voldoet aan de voorschriften 10.5.1 tot en met 10.5.4 van PGS 15, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.5.b
    text: |-
      de gezamenlijke hoeveelheid gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking in een brandcompartiment
      ten hoogste 10.000 kilogram bedraagt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.6
    text: 'Onverminderd het tweede tot en met vierde lid geldt voor de opslag, bedoeld in het eerste lid, onderdeel b, dat:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.6.a
    text: deze voldoet aan de voorschriften 10.6.2 tot en met 10.6.4 van PGS 15;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.6.b
    text: |-
      de gezamenlijke hoeveelheid gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking in een brandcompartiment
      ten hoogste 10.000 kilogram bedraagt, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.6.c
    text: |-
      de gezamenlijke hoeveelheid gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking in de inrichting ten
      hoogste 10.000 kilogram bedraagt indien de tijdelijke opslagvoorziening niet is gesitueerd in een brandcompartiment
      met een WBDBO van 60 minuten of hoger.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.7.7
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift eisen stellen aan de tijdelijke opslag van gevaarlijke stoffen in
      verpakking en CMR-stoffen in verpakking in de buitenlucht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.7
  - number: 4.8.1
    text: |-
      De opslag van gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking in een voor het publiek toegankelijke
      verkoopruimte is brandveilig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
  - number: 4.8.2
    text: 'Aan het eerste lid wordt voldaan indien gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
  - number: 4.8.2.a
    text: |-
      zijn opgeslagen overeenkomstig de [artikelen 4.3][ref1], [4.4][ref2], [4.4a][ref3], [4.4b][ref4], [4.4c][ref5] en
      [4.5][ref6], of


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '4'
