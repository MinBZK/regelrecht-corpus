        afdeling: '4.1'
  - number: 6.10.4
    text: |-
      Op een bovengrondse opslagtank met stoffen van klasse 8 van het ADR verpakkingsgroep II en III zonder bijkomend
      gevaar die is geïnstalleerd voor 1 januari 2000 is [artikel 4.15][ref1] niet van toepassing tot 1 januari 2023.


