    text: Het emissiescherm is aan de grond verankerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.79
  - number: 3.79.3
    text: Van het emissiescherm kunnen geen afdruipende spuitvloeistoffen in een oppervlaktewaterlichaam geraken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.79
  - number: 3.79.4
    text: |-
      Het emissiescherm is vervaardigd van niet-doorlaatbaar materiaal of van gaas met een windreductie van ten minste
      50%.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.79
  - number: 3.79.5
    text: |-
