        bwb_id: BWBR0022762
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.61.b
    text: |-
      die filtrerende afscheider of elektrostatische filterinstallatie in goede staat van onderhoud verkeert, periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.61
  - number: 4.62.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het stralen van metalen waarbij vloeibare
      bodembedreigende stoffen worden gebruikt of kunnen vrijkomen, plaats boven een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.62
  - number: 4.62.2
    text: |-
      Indien bij de activiteit, bedoeld in het eerste lid, alleen vaste bodembedreigende stoffen vrijkomen dan vindt deze
      activiteit plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.62
  - number: 4.62.3
    text: |-
      De activiteit, bedoeld in het eerste lid kan ook boven een andere bodembeschermende voorziening worden uitgevoerd
      indien deze activiteit wordt uitgevoerd als een gesloten proces.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.62
  - number: '4.63'
    text: |-
      In deze paragraaf wordt onder het reinigen van metalen niet verstaan het wassen van motorvoertuigen of carrosserie-
      onderdelen daarvan als bedoeld in [paragraaf 3.3.2][ref1] en het afspuiten van pleziervaartuigen als bedoeld in
      [paragraaf 4.6.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.63
    references:
      - id: ref1
        bwb_id: BWBR0022830
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0022830
        hoofdstuk: '4'
        paragraaf: 4.6.5
        afdeling: '4.6'
  - number: 4.64.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden dampen en gassen die
      vrijkomen bij:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.1.a
    text: |-
      het reinigen, coaten en lijmen van metalen voorwerpen door middel van vernevelen van vluchtige organische stoffen
      met een nevelspuit;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.1.b
    text: het coaten van metalen voorwerpen door middel van het opbrengen van poeder;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.1.c
    text: |-
      het reinigen, coaten en lijmen van metalen voorwerpen met vluchtige organische stoffen door middel van dompeling in
      open of halfgesloten baden, uitgezonderd de toepassing van hoogkokende stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.1.d
    text: |-
      het aansluitend aan voornoemde activiteiten, drogen dan wel uitharden van met vluchtige organische stoffen
      behandelde materialen dan wel het moffelen van materialen die zijn van voorzien van een poedercoating, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.2
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van stofhinder, worden emissies van
      stof, waaronder ook coating-, lijm- of poederdeeltjes, die vrijkomen bij het in de buitenlucht coaten en lijmen van
      metalen door middel van vernevelen met een nevelspuit, voorkomen dan wel beperkt door het plaatsen van doelmatige
      afschermingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.3
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de overeenkomstig het eerste
      lid, onderdeel b, afgezogen dampen en gassen, die naar de buitenlucht worden afgevoerd bovendaks en omhoog gericht
      afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op
      een gezoneerd industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare,
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.4
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder, worden de overeenkomstig
      het eerste lid, onderdelen a, c en d afgezogen dampen en gassen, indien deze op de buitenlucht worden geëmitteerd:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.4.a
    text: ten minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.4.b
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.5
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.6
    text: |-
      Het vierde lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.7
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen dampen, geuremissies die niet
      via de afzuiging worden afgevoerd of incidentele geurpieken in aanvulling op het vierde lid met inachtneming van de
      NeR maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.7.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.7.b
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.7.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.7.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: 4.64.8
    text: |-
      In afwijking van het vierde lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het zevende lid onvoldoende zijn om de overschrijding ongedaan te
      maken met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.64
  - number: '4.65'
    text: |-
      Aan [artikel 4.54, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.65.a
    text: |-
      de afgezogen emissies die vrijkomen bij het coaten en lijmen van metalen voorwerpen door middel van
      vernevelen met een nevelspuit en de emissies die vrijkomen bij het coaten door middel van het opbrengen
      van poeder, worden afgezogen en worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.54, eerste lid, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.65.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65
  - number: 4.65a.1
    text: |-
      Aan [artikel 4.54a, derde lid, van het besluit][ref1] wordt, voor zover het betreft het schoonbranden van metalen
      waarbij gebruik wordt gemaakt van een elektrische oven, in ieder geval voldaan indien de uit de oven afgezogen
      dampen via condensatie of absorptie worden behandeld en teruggeleid naar de oven zonder dat een emissie naar de
      lucht optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.65a.2
    text: |-
      Aan [artikel 4.54a, derde lid, van het besluit][ref1] wordt, voor zover het betreft het schoonbranden van metalen
      waarbij gebruik wordt gemaakt van een gasgestookte oven met een capaciteit kleiner dan 5 ton te reinigen product,
      in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.65a.2.a
    text: |-
      de rookgassen uit de oven worden geleid door een naverbrander, die geschikt is om aan
      [artikel 4.54a, derde lid][ref1], te voldoen en zo is ingeregeld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.2
        afdeling: '4.5'
  - number: 4.65a.2.a.1°
    text: tot het einde van de cyclus de temperatuur ten minste 850°C is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.2.a.2°
    text: de naverbrander op temperatuur is voordat het schoonbranden begint;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.2.a.3°
    text: de verblijftijd van de rookgassen ten minste twee seconden is, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.2.a.4°
    text: de emissieconcentratie van koolmonoxide niet meer dan 100 milligram per normaal kubieke meter is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.2.b
    text: de rookgassen alleen via de naverbrander uit de oven kunnen worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.2.c
    text: het temperatuurverloop van oven en naverbrander continu geregistreerd wordt, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.2.d
    text: |-
      de oven en de naverbrander in goede staat van onderhoud verkeren, periodiek gecontroleerd worden en zo vaak als
      voor de goede werking nodig is, worden schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3
    text: |-
      Aan [artikel 4.54a, derde lid, van het besluit][ref1] wordt, voor zover het betreft het schoonbranden van metalen
      waarbij gebruik wordt gemaakt van een gasgestookte oven met een capaciteit groter dan of gelijk aan 5 ton te
      reinigen product, in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.65a.3.a
    text: |-
      de rookgassen uit de oven worden geleid door een naverbrander, die geschikt is om aan
      [artikel 4.54a, derde lid][ref1], te voldoen en zo is ingeregeld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.2
        afdeling: '4.5'
  - number: 4.65a.3.a.1°
    text: tot het einde van de cyclus de temperatuur ten minste 850°C is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.a.2°
    text: de naverbrander op temperatuur is voordat het schoonbranden begint;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.a.3°
    text: de verblijftijd van de rookgassen ten minste twee seconden is, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.a.4°
    text: de emissieconcentratie van koolmonoxide niet meer dan 100 milligram per normaal kubieke meter is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.b
    text: de rookgassen alleen via de naverbrander uit de oven kunnen worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.c
    text: het zuurstofpercentage in de rookgassen na de naverbrander ten minste 6% is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.d
    text: |-
      via beveiligingen is geborgd dat het schoonbranden niet kan starten indien de naverbrander niet werkt, en dat de
      naverbrander niet kan worden uitgeschakeld indien de oven in bedrijf is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.e
    text: de maximale belading van de oven is vastgesteld, en niet kan worden overschreden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.f
    text: |-
      de nabrandtijd van de naverbrander vast staat ingesteld op de waarde die in een controlemeting bij de maximale
      belading is vastgesteld en voldoende is om bij maximale belading alle dampen te verbranden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.g
    text: het temperatuurverloop van oven en naverbrander continu geregistreerd wordt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.h
    text: het zuurstofgehalte en het koolmonoxidegehalte van de rookgassen continu worden gemeten en geregistreerd, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.65a.3.i
    text: |-
      de oven en de naverbrander in goede staat van onderhoud verkeren, ten minste een maal per twaalf maanden worden
      gecontroleerd en zo vaak als voor de goede werking nodig is, worden schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.65a
  - number: 4.66.1
    text: |-
      Ter uitvoering van [artikel 4.55, eerste lid, van het besluit][ref1], past degene die de inrichting drijft:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.66.1.a
    text: 'bij het coaten en lijmen van metalen voorwerpen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.a.1°
    text: |-
      maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.a.2°
    text: oplosmiddelarme producten en efficiënte applicatiemethoden toe;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.b
    text: 'bij het reinigen van metalen voorwerpen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.b.1°
    text: |-
      maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissie van vluchtige organische
      stoffen; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.b.2°
    text: 'de volgende voorkeursvolgorde toe:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.b.2°.i
    text: zoveel mogelijk droog reinigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.b.2°.ii
    text: indien reiniging niet op een droge manier kan plaatsvinden wordt gebruik gemaakt van waterige middelen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.b.2°.iii
    text: |-
      indien reiniging met waterige middelen technisch niet uitvoerbaar is, of niet kosteneffectief is, vindt het
      reinigen met organische oplosmiddelen plaats in procesbaden die zijn uitgevoerd als een zogenaamd gesloten systeem.
      Indien gesloten systemen worden toegepast, wordt de in- en uitneemzone ten minste één minuut gesloten gehouden na
      beëindiging van het gebruik van de pomp- of persluchtinstallatie, ter beperking van de emissie naar de lucht;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.1.b.2°.iv
    text: |-
      indien reiniging niet mogelijk is in een gesloten systeem, om redenen van technische uitvoerbaarheid of
      kosteneffectiviteit, wordt gebruik gemaakt van hoogkokende niet-gehalogeneerde oplosmiddelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: 4.66.2
    text: |-
      Indien de emissiereducerende maatregelen, bedoeld in het eerste lid, niet of in onvoldoende mate zijn getroffen,
      kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de motivering
      wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.66
  - number: '4.67'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vinden bij het reinigen, lijmen en coaten van
      metalen het verwerken van lakken, verdunners en lijmen alsmede het coaten van metalen, het chemisch ontlakken en
      het reinigen van metalen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.67
  - number: 4.68.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden stof en dampen die
      vrijkomen bij het aanbrengen van een emailleer- en een keramieklaag op metalen, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.2
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden stof en dampen die
      vrijkomen bij het aanbrengen van een metaallaag op metalen door middel van vlamspuiten en thermisch spuiten,
      doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.3
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, vindt het schooperen plaats
      in een daarvoor bestemde en ingerichte gesloten kast, cabine of ruimte waar onderdruk heerst en optimale afzuiging
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.4
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden emissies als bedoeld in het
      tweede en derde lid die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen
      50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.5
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.6
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder, worden de overeenkomstig
      het eerste lid afgezogen gassen en dampen, die op de buitenlucht worden geëmitteerd:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.6.a
    text: ten minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.6.b
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.7
    text: |-
      Het zesde lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.8
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege slecht
      functioneren van de ontgeuringsinstallatie, vanwege onvoldoende verspreiding van afgezogen dampen, vanwege
      geuremissies die niet via de afzuiging worden afgevoerd of vanwege incidentele geurpieken in aanvulling op het
      vijfde lid met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.8.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.8.b
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.8.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.8.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.9
    text: |-
      In afwijking van het zesde lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het achtste lid onvoldoende zijn om de overschrijding ongedaan te
      maken met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: 4.68.10
    text: |-
      Indien vanwege de omvang van het te bewerken object, als bedoeld in
      [artikel 4.57, tweede lid, van het besluit][ref1], het schooperen in de buitenlucht plaatsvindt worden emissies van
      stof die vrijkomen bij het schooperen van metalen in de buitenlucht, voorkomen, dan wel beperkt door het aanbrengen
      van doelmatige geheel gesloten omkappingen om het te behandelen werkstuk. Een omkapping bestaat uit doek, zeil of
      een ander stofdicht materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.68.11
    text: |-
      Ten behoeve van het zoveel mogelijk voorkomen, dan wel tot een aanvaardbaar niveau beperken van stofhinder
      vanwege het in de buitenlucht schooperen van metalen kan het bevoegd gezag met inachtneming van de NeR
      maatwerkvoorschriften stellen, ter uitwerking van het tiende lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.68
  - number: '4.69'
    text: |-
      Aan [artikel 4.58 van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.69
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.69.a
    text: |-
      de afgezogen stofemissies die vrijkomen bij het aanbrengen van anorganische deklagen op metalen worden
      gevoerd door een filtrerende afscheider of elektrostatische filterinstallatie, die geschikt is om aan
      [artikel 4.58 van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.69
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.69.b
    text: |-
      die filtrerende afscheider of elektrostatische filterinstallatie in goede staat van onderhoud verkeert, periodiek
      gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.69
  - number: '4.70'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het aanbrengen van anorganische deklagen
      op metalen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.70
  - number: 4.71.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden dampen die vrijkomen
      bij het elektrolytisch of stroomloos beitsen en etsen van metalen, voor zover dat redelijkerwijs mogelijk is,
      doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.71
  - number: 4.71.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden gassen en dampen, vanwege het
      beitsen en etsen van metalen, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd,
      indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd
      industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.71
  - number: 4.71.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.71
  - number: '4.72'
    text: |-
      Aan [artikel 4.60, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.72.a
    text: |-
      de totale oppervlakte van de aanwezige beits- en etsbaden met eenzelfde werkzame badvloeistof minder bedraagt
      dan 3 vierkante meter, de temperatuur van de baden niet hoger is dan 50 graden Celsius en er geen agitatie van de
      vloeistof in de baden plaatsvindt; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.72
  - number: 4.72.b
    text: |-
      de afgezogen emissies die vrijkomen bij het elektrolytisch of stroomloos beitsen en etsen van
      metalen worden gevoerd door een gaswasser of aërosol- of mistfilter die geschikt is om aan
      [artikel 4.60, eerste lid, van het besluit][ref1] te voldoen; en die gaswasser of aërosol- of mistfilter in goede
      staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede werking nodig is wordt
      schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.72
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.73.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het beitsen en etsen van metalen plaats
      boven een lekbak of een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.73
  - number: 4.73.2
    text: |-
      De activiteit bedoeld in het eerste lid kan ook boven een andere bodembeschermende voorziening worden uitgevoerd
      indien deze activiteit wordt uitgevoerd als een gesloten proces.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.73
  - number: 4.73.3
    text: |-
      Indien het beitsen of etsen van metalen plaatsvindt met behulp van een dompelbad dan is dat dompelbad opgesteld
      boven een lekbak of een vloeistofdichte vloer of verharding, die zich ten minste uitstrekt tot de oppervlakte van
      het dompelbad en het daarbij behorende uitlekgebied. Onder dit uitlekgebied wordt niet begrepen het gebied waar het
      metaalproduct wordt geplaatst nadat dit is afgespoeld met water of is gespoeld in een bad met water.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.73
  - number: 4.73.4
    text: Een dompelbad dat zich automatisch vult is voorzien van een doelmatige overvulbeveiliging of overloopbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.73
  - number: 4.74.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies, worden dampen die
      vrijkomen bij het elektrolytisch of stroomloos aanbrengen van chroom- en cadmiumlagen op metalen, voor zover dat
      redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.74
  - number: 4.74.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden gassen en dampen, vanwege het
      elektrolytisch en stroomloos aanbrengen van metaallagen, die naar de buitenlucht worden afgevoerd, bovendaks en
      omhoog gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig
      gebouw op een gezoneerd industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per
      hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.74
  - number: 4.74.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.74
  - number: '4.75'
    text: |-
      Aan [artikel 4.62, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.75
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.75.a
    text: |-
      de afgezogen emissies die vrijkomen bij het elektrolytisch en stroomloos aanbrengen van chroom- of
      cadmiumlagen op metalen worden gevoerd door een gaswasser of aërosol- of mistfilter die geschikt is om aan
      [artikel 4.62, eerste lid, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.75
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.75.b
    text: |-
      die gaswasser of aërosol- of mistfilter in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo
      vaak als voor de goede werking nodig is, wordt schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.75
  - number: 4.76.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico is een dompelbad waarin metaallagen
      elektrolytisch en stroomloos worden aangebracht op metalen opgesteld boven een lekbak of een vloeistofdichte
      vloer of verharding, die zich ten minste uitstrekt tot de oppervlakte van het dompelbad en het daarbij behorende
      uitlekgebied. Onder dit uitlekgebied wordt niet begrepen het gebied waar het metaalproduct wordt geplaatst nadat
      dit is afgespoeld met water of is gespoeld in een bad met water.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.76
  - number: 4.76.2
    text: Een dompelbad dat zich automatisch vult, is voorzien van een doelmatige overvulbeveiliging of overloopbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.76
  - number: 4.77.1
    text: |-
      Ten behoeve van het voorkomen van diffuse emissies worden dampen die vrijkomen bij het chroomzuuranodiseren en het
      zwavelzuuranodiseren, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.77
  - number: 4.77.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies, worden gassen en dampen, vanwege het aanbrengen van
      conversielagen op metalen, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd,
      indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd
      industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.77
  - number: 4.77.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.77
  - number: '4.78'
    text: |-
      Aan [artikel 4.65, eerste lid, onderdeel a, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.78
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.78.a
    text: |-
      de afgezogen emissies die vrijkomen bij het chroomzuuranodiseren worden gevoerd door een gaswasser of aërosol- of
      mistfilter, die geschikt is om [artikel 4.65, eerste lid, onderdeel a, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.78
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.78.b
    text: |-
      die gaswasser of aërosol- of mistfilter in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo
      vaak als voor de goede werking nodig is wordt schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.78
  - number: '4.79'
    text: |-
      Aan [artikel 4.65, eerste lid, onderdeel b, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.79
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.79.a
    text: de temperatuur van de zwavelzuurbaden ten behoeve van het zwavelzuuranodiseren lager is dan 60 graden Celsius; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.79
  - number: 4.79.b
    text: |-
      de afgezogen emissies die vrijkomen bij het zwavelzuuranodiseren worden gevoerd door een gaswasser of aërosol- of
      mistfilter, die geschikt is om aan [artikel 4.65, eerste lid, onderdeel b, van het besluit][ref1] te voldoen, en
      die gaswasser of aërosol- of mistfilter in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo
      vaak als voor de goede werking nodig is wordt schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.79
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.80.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico is een dompelbad waarin conversielagen worden
      aangebracht op metalen opgesteld boven een lekbak of een vloeistofdichte vloer of verharding, die zich ten minste
      uitstrekt tot de oppervlakte van het dompelbad en het daarbij behorende uitlekgebied. Onder dit uitlekgebied wordt
      niet begrepen het gebied waar het metaalproduct wordt geplaatst nadat dit is afgespoeld met water of is gespoeld in
      een bad met water.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.80
  - number: 4.80.2
    text: Een dompelbad dat zich automatisch vult is voorzien van een doelmatige overvulbeveiliging of overloopbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.80
  - number: 4.81.1
    text: |-
      Ten behoeve van het voorkomen van diffuse emissies, worden dampen die vrijkomen bij het thermisch aanbrengen van
      metaallagen op metalen, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.81
  - number: 4.81.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies, worden gassen en dampen, vanwege het thermisch aanbrengen
      van metaallagen op metalen, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd,
      indien binnen 50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd
      industrieterrein dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.81
  - number: 4.81.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.81
  - number: '4.82'
    text: |-
      Aan [artikel 4.68, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.82
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.82.a
    text: |-
      de afgezogen stofvormige emissies die vrijkomen bij het thermisch aanbrengen van
      metaallagen op metalen worden gevoerd door een filtrerende afscheider die geschikt is om aan
      [artikel 4.68, eerste lid, onderdelen a en b, van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.82
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.82.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.82
  - number: 4.82.c
    text: |-
      de afgezogen dampvormige emissies die vrijkomen bij het thermisch aanbrengen van metaallagen op metalen worden
      gevoerd door een gaswasser die geschikt is om aan [artikel 4.68, eerste lid, onderdeel c, van het besluit][ref1] te
      voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.82
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.82.d
    text: |-
      die gaswasser in goede staat van onderhoud verkeert, periodiek wordt gecontroleerd en zo vaak als voor de goede
      werking nodig is wordt schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.82
  - number: 4.83.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico is een dompelbad of een fluxbad waarin
      metaallagen thermisch worden aangebracht op metalen opgesteld boven een lekbak of een vloeistofdichte vloer
      of verharding, die zich ten minste uitstrekt tot de oppervlakte van het dompelbad en het daarbij behorende
      uitlekgebied. Onder dit uitlekgebied wordt niet begrepen het gebied waar het metaalproduct wordt geplaatst nadat
      dit is afgespoeld met water of is gespoeld in een bad met water.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.83
  - number: 4.83.2
    text: Een dompelbad dat zich automatisch vult is voorzien van een doelmatige overvulbeveiliging of overloopbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.83
  - number: 4.84.1
    text: |-
      Bij het lozen van afvalwater afkomstig van activiteiten in [§ 4.5.1 tot en met § 4.5.11 van het besluit][ref1]
      wordt ter beperking van het lozen van metalen en hulpstoffen ten minste voldaan aan het tweede tot en met het
      vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Paragraaf4.5.1
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
    references:
      - id: ref1
        bwb_id: BWBR0022762
        paragraaf: 4.5.1
  - number: 4.84.2
    text: |-
      Degene die de inrichting drijft stelt gedragsvoorschriften op die zijn gericht op het voorkomen van nadelige
      gevolgen voor het milieu en een doelmatige afvoer van het bedrijfsafvalwater én draagt ervoor zorg dat de
      gedragsregels worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3
    text: 'In de gedragsvoorschriften wordt ten minste aangegeven:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.a
    text: |-
      wanneer en op welke wijze controle van installaties en onderdelen van de inrichting plaatsvindt, waarvan de werking
      van invloed kan zijn op het lozen van metalen en hulpstoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.b
    text: op welke wijze invulling wordt gegeven aan maatregelen die voortkomen uit de preventieve aanpak;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.c
    text: op welke wijze de oversleep wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.d
    text: op welke wijze mogelijk te nemen procesgeïntegreerde maatregelen op haalbaarheid worden onderzocht en genomen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.e
    text: hoe wordt omgegaan met procesafvalwater en hoe dit doelmatig wordt verwerkt;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.f
    text: |-
      indien ethyleendiaminetetra-acetaat wordt gebruikt, waarom dit noodzakelijk is voor het proces en welke maatregelen
      genomen worden om de emissies ervan te beperken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.g
    text: |-
      indien een chroomlaag elektrolytisch wordt aangebracht met behulp van een oplossing van chroom VI, welke
      maatregelen genomen worden om dit metaal terug te voeren uit het spoelwater naar het procesbad;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.h
    text: |-
      indien er wordt gewerkt met cyanide, welke maatregelen genomen worden om cyanide terug te voeren uit het spoelwater
      naar het procesbad;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.i
    text: |-
      indien perfluoroctaansulfonaten als hulpstof worden toegepast, welke maatregelen genomen worden om
      perfluoroctaansulfonaten terug te voeren uit het spoelwater naar het procesbad; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.3.j
    text: |-
      indien cadmium wordt verwerkt, welke maatregelen worden genomen om cadmium terug te voeren uit het spoelwater naar
      het procesbad en op welke wijze het afvalwater dat cadmium kan bevatten, separaat van het overige afvalwater, wordt
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84.4
    text: |-
      Het bevoegd gezag kan indien het belang van de bescherming van het milieu daartoe noodzaakt maatwerkvoorschriften
      stellen ten aanzien van de invulling van de gedragsvoorschriften als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84
  - number: 4.84a.1
    text: 'Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.1.a
    text: 'vindt het stralen van steen plaats:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.1.a.1°
    text: in een daarvoor bestemde en ingerichte gesloten kast, cabine of ruimte; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.1.a.2°
    text: met gereedschap dat is uitgerust met een geïntegreerde stofafzuiginstallatie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.1.b
    text: vindt het trommelen van steen plaats in een gesloten installatie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.1.c
    text: |-
      wordt stofklasse S dat vrijkomt bij de mechanische bewerking van steen, voor zover dat redelijkerwijs mogelijk
      is, doelmatig aan de bron afgezogen, tenzij gebruik wordt gemaakt van natte werkmethoden die voldoen aan
      [artikel 4.84b, onderdeel a of c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5a.1
        afdeling: 4.5a
  - number: 4.84a.1.d
    text: |-
      vinden reiniging en ontstoffing van apparatuur en werkruimten plaats door gebruik te maken van natte werkmethoden
      of stofzuigers.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.2
    text: |-
      Indien het redelijkerwijs niet mogelijk is te stralen als bedoeld in het eerste lid, onder a, vindt het stralen van
      steen plaats in een gesloten ruimte met gesloten deuren en ramen, waarbij wordt voorkomen dat bij het openen van
      deuren en ramen stof naar de buitenlucht vrijkomt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.3
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen emissies die
      vrijkomen bij mechanische bewerking van steen en die naar de buitenlucht worden afgevoerd, bovendaks en omhoog
      gericht afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een
      gevoelig gebouw op een gezoneerd industrieterrein, dan wel op een bedrijventerrein met minder dan één gevoelig
      gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84a.4
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84a
  - number: 4.84b
    text: |-
      Aan [artikel 4.74b van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84b.a
    text: |-
      mechanische bewerking van steen plaatsvindt met waterkoeling en de waterstraal of het watergordijn zodanig is
      gedimensioneerd dat geen zichtbare stofvorming optreedt; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84b
  - number: 4.84b.b
    text: |-
      de afgezogen stofemissies die vrijkomen bij mechanische bewerking van steen worden gevoerd door een filtrerende
      afscheider, die geschikt is om aan [artikel 4.74b van het besluit][ref1] te voldoen en in goede staat van onderhoud
      verkeert, periodiek wordt gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en
      vervangen; of


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84b.c
    text: |-
      bij mechanische ruimteafzuiging gebruik wordt gemaakt van een waterwand die geschikt is om aan
      [artikel 4.74b van het besluit][ref1] te voldoen en in goede staat van onderhoud verkeert, periodiek wordt
      gecontroleerd en zo vaak als voor de goede werking nodig is, wordt schoongemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84c.1
    text: |-
      Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, worden gassen en dampen
      die vrijkomen bij:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.1.a
    text: het aanbrengen van lijmen, harsen en coatings op steen door middel van vernevelen met een nevelspuit,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.1.b
    text: |-
      het aansluitend aan de onder a genoemde activiteiten drogen dan wel uitharden van met vluchtige organische stoffen
      behandelde materialen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.2
    text: |-
      Ten behoeve van het voorkomen dan wel tot een aanvaardbaar niveau beperken van geurhinder, worden de overeenkomstig
      het eerste lid, onderdelen a en b, afgezogen gassen en dampen, indien deze op de buitenlucht worden geëmitteerd:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.2.a
    text: |-
      ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen gebouwen afgevoerd;
      of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.2.b
    text: geleid door een doelmatige ontgeuringsinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.3
    text: |-
      Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.4
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege het slecht
      functioneren van de ontgeuringsinstallatie, onvoldoende verspreiding van afgezogen gassen en dampen, geuremissies
      die niet via de afzuiging worden afgevoerd of incidentele geurpieken, in aanvulling op het tweede lid, met
      inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.4.a
    text: de uitvoering en het onderhoud van een ontgeuringsinstallatie als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.4.b
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.4.c
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.4.d
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84c.5
    text: |-
      In afwijking van het tweede lid kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het vierde lid onvoldoende zijn om de overschrijding ongedaan te
      maken met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie of een grotere afvoerhoogte van de afgezogen gassen en dampen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84c
  - number: 4.84d
    text: |-
      Aan [artikel 4.74f van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84d.a
    text: |-
      de afgezogen emissies die vrijkomen bij het aanbrengen van lijmen, harsen of coatings op steen worden gevoerd door
      een filtrerende afscheider, die geschikt is om aan [artikel 4.74f van het besluit][ref1] te voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84d.b
    text: |-
      de filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84d
  - number: 4.84e
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het aanbrengen van lijmen, harsen
      of coatings op steen het verwerken van lijmen, harsen, coatings en verdunningsmiddelen alsmede het aanbrengen van
      coatings op steen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84e
  - number: 4.84f.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico is een dompelbad waarin steen chemisch wordt
      behandeld, opgesteld boven een lekbak of een vloeistofdichte vloer of verharding, die zich ten minste uitstrekt tot
      de oppervlakte van het dompelbad en het daarbij behorende uitlekgebied. Onder dit uitlekgebied wordt niet begrepen
      het gebied waar het steen wordt geplaatst nadat dit is afgespoeld met water of is gespoeld in een bad met water.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84f
  - number: 4.84f.2
    text: Een dompelbad dat zich automatisch vult, is voorzien van een doelmatige overvulbeveiliging of overloopbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84f
  - number: 4.84g.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies en het
      bevorderen van een doelmatige verspreiding van emissies naar de buitenlucht als bedoeld in
      [artikel 4.74j, derde lid, van het besluit][ref1], worden bij het doseren en mengen ten behoeve van de
      vervaardiging van betonmortel de emissies die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht
      afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig
      gebouw op een gezoneerd industrieterrein of op een bedrijventerrein met minder dan één gevoelig gebouw per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84g
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84g.2
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van de emissies naar de lucht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84g
  - number: 4.84h
    text: |-
      Aan [artikel 4.74j, tweede lid, van het besluit][ref1] wordt bij het doseren en mengen ten behoeve van de
      vervaardiging van betonmortel in ieder geval voldaan indien de via ontluchtingsopeningen ontwijkende lucht door een
      filtrerende afscheider wordt gevoerd die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo
      vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84h
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84i.1
    text: |-
      Ter uitvoering van [artikel 4.74o, eerste lid, van het besluit][ref1], past degene die de inrichting drijft bij
      het op bekisting aanbrengen van ontkistingsmiddelen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84i
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84i.1.a
    text: |-
      maatregelen ten aanzien van de bedrijfsvoering ter voorkoming van onnodige emissies van vluchtige organische
      stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84i
  - number: 4.84i.1.b
    text: oplosmiddelarme producten en efficiënte applicatiemethoden toe.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84i
  - number: 4.84i.2
    text: |-
      Indien de emissiereducerende maatregelen, bedoeld in het eerste lid, niet of in onvoldoende mate zijn getroffen,
      kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de motivering
      wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84i
  - number: 4.84j
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.74p van het besluit][ref1] vindt:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84j
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84j.a
    text: het op bekisting aanbrengen van ontkistingsmiddelen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84j
  - number: 4.84j.b
    text: het uitwassen van beton,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84j
  - number: 4.84k
    text: |-
      Aan [artikel 4.74r van het besluit][ref1] wordt bij het breken van steenachtig materiaal in de buitenlucht in
      ieder geval voldaan indien het te breken materiaal door besproeiing vochtig wordt gehouden en de dosering van het
      sproeiwater zodanig is afgestemd op de behoefte dat hierbij geen afvalwater vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84k
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84l
    text: |-
      Aan [artikel 4.74s, eerste lid, van het besluit][ref1] wordt bij het inpandig breken van steenachtig materiaal
      in ieder geval voldaan indien de via ontluchtingsopeningen ontwijkende lucht door een filtrerende afscheider wordt
      gevoerd die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor de goede
      werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84l
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84m.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies en het bevorderen van een
      doelmatige verspreiding van emissies naar de buitenlucht, bedoeld in [artikel 4.74s van het besluit][ref1], worden
      bij het inpandig breken van steenachtig materiaal de emissies overeenkomstig artikel 4.74s, tweede lid, van het
      besluit die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen 50 meter van
      een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      of op een bedrijventerrein met minder dan één gevoelig gebouw per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84m
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.84m.2
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van de emissies naar de lucht, bedoeld in
      [artikel 4.74s, tweede lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.84m
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.86.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan en het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk
      beperken van verontreiniging van een oppervlaktewaterlichaam wordt bij het afleveren van vloeibare brandstoffen aan
      vaartuigen ten minste voldaan aan het tweede tot en met tiende lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.2
    text: |-
      Het afleveren van vloeibare brandstoffen aan vaartuigen en het vullen van opslagtanks vindt uitsluitend plaats door
      of onder direct toezicht van deskundig personeel dat op de hoogte is van:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.2.a
    text: de gevaarlijke eigenschappen van de brandstoffen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.2.b
    text: |-
      de absorptie- en hulpmiddelen, bedoeld in [artikel 4.78 van het besluit][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.86.2.c
    text: het noodplan, bedoeld in het zevende lid, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.2.d
    text: |-
      de instructies, bedoeld in artikel 36 van [bijlage 3.8 bij de Binnenvaartregeling][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 4.86.3
    text: |-
      Bij een op de wal geplaatste vaste afleverinstallatie voor het afleveren van vloeibare brandstoffen aan vaartuigen
      en bij het vulpunt van een bunkerstation indien dit vulpunt op de kant is gelegen, worden voorzieningen getroffen
      of maatregelen genomen om schade aan de afleverinstallatie en het vulpunt door aanrijdingen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.4
    text: |-
      Een op de wal geplaatste vaste afleverinstallatie voor het afleveren van vloeibare brandstoffen aan vaartuigen en
      een bunkerstation zijn zodanig gelegen, dat de bereikbaarheid voor passerende vaartuigen is gewaarborgd en een zo
      laag mogelijk aanvaringsrisico wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.5
    text: |-
      Een op de wal geplaatste vaste afleverinstallatie voldoet bij het afleveren van vloeibare brandstoffen aan
      vaartuigen aan de volgende onderdelen van PGS 28:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.5.a
    text: de voorschriften 2.3.8, 2.3.11 en 2.3.12;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.5.b
    text: de voorschriften 3.4.4 en 3.4.6 tot en met 3.4.11, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.5.c
    text: de voorschriften 5.5.1, 5.5.3, 5.6.1, 5.6.2 en 5.7.1,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.6
    text: |-
      Op een op de wal geplaatste vaste afleverinstallatie voor het afleveren van vloeibare brandstoffen aan vaartuigen
      zijn de artikelen 21, 35b, e, f, j en k, 36, 45, 46 en 47 van [bijlage 3.8 bij de Binnenvaartregeling][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 4.86.7
    text: |-
      Op verzoek van het bevoegd gezag stelt de houder van een inrichting waar vloeibare brandstof wordt afgeleverd aan
      vaartuigen aan de hand van de opslagcapaciteit, de aard van de opgeslagen producten en de aard van de inrichting
      een doelmatig noodplan op om:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.7.a
    text: lekkage zo spoedig mogelijk te stoppen en gelekte brandstof op te ruimen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.7.b
    text: |-
      brand zo spoedig mogelijk onder controle te krijgen waarbij wordt aangegeven in welke gevallen zelf opgetreden
      wordt en in welke gevallen de brandweer wordt ingeschakeld,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.7.c
    text: betrokken personen intern te alarmeren en indien nodig op te roepen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.7.d
    text: indien nodig de installatie stil te leggen of te ontruimen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.7.e
    text: hulpdiensten, omwonenden en bevoegd gezag te informeren, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.7.f
    text: zo nodig hulp te kunnen bieden aan degenen die zich op het bedrijfsterrein bevinden en aan omwonenden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
  - number: 4.86.8
    text: |-
      Aan een schip dat gevaarlijke stoffen vervoert, bedoeld in
      [artikel 3.14, tweede en derde lid van het Rijnvaartpolitiereglement 1995][ref1], wordt geen vloeibare brandstof
      afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '3'
  - number: 4.86.9
    text: |-
      Aan een schip dat gevaarlijke stoffen vervoert, bedoeld in
      [artikel 3.14, eerste lid van het Rijnvaartpolitiereglement 1995][ref1], wordt geen vloeibare brandstof afgeleverd
      indien de gevaarlijke stoffen gassen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '3'
  - number: 4.86.10
    text: |-
      Bij een bunkerstation waar lichte olie wordt afgeleverd aan vaartuigen, wordt geen
      vloeibare brandstof afgeleverd aan een schip dat gevaarlijke stoffen vervoert, bedoeld in
      [artikel 3.14, eerste lid, van het Rijnvaartpolitiereglement 1995][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '3'
  - number: 4.86a.1
    text: |-
      Onverminderd [artikel 4.86][ref1] voldoet een bunkerstation bij het afleveren van vloeibare brandstof aan
      vaartuigen ten minste aan:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
  - number: 4.86a.1.a
    text: 'de volgende onderdelen van PGS 28:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
  - number: 4.86a.1.a.1°
    text: de voorschriften 2.3.8, 2.3.11 en 2.3.12;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
  - number: 4.86a.1.a.2°
    text: de voorschriften 3.4.4 en 3.4.6 tot en met 3.4.11, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
  - number: 4.86a.1.a.3°
    text: de voorschriften 5.5.1, 5.5.2, 5.5.3, 5.6.1, 5.6.2 en 5.7.1,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
  - number: 4.86a.1.b
    text: |-
      de artikelen 21, 35 aanhef en onder b, e, f, j, k, 36, 45, 46 en 47 van
      [bijlage 3.8 bij de Binnenvaartregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 4.86a.2
    text: |-
      Het bevoegd gezag kan indien de technische staat van het bunkerstation onvoldoende is bij
      maatwerkvoorschrift eisen stellen die leiden tot een beschermingsniveau dat gelijkwaardig is aan
      [bijlage 3.8 bij de Binnenvaartregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: 4.86a.3
    text: |-
      Dit artikel is niet van toepassing op een bunkerstation dat beschikt over een certificaat als bedoeld in
      [artikel 6 van het Binnenvaartbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel6
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.86a
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '6'
  - number: '4.87'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico wordt een op de wal geplaatste vaste installatie
      voor het afleveren van vloeibare brandstoffen aan vaartuigen opgesteld boven een lekbak of een vloeistofdichte
      vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.87
  - number: 4.87a.1
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      verontreiniging van een oppervlaktewaterlichaam wordt bij het afleveren van vloeibare brandstoffen aan vaartuigen
      voldaan aan het tweede tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.87a
  - number: 4.87a.2
    text: |-
      Het afleveren van vloeibare brandstoffen aan vaartuigen vindt zodanig plaats dat morsen van brandstof zoveel
      mogelijk wordt voorkomen. De gemorste brandstof wordt direct opgenomen met daarvoor geschikte absorptiemiddelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.87a
  - number: 4.87a.3
    text: |-
      Het vulpistool of het uiteinde van de vulleiding van een installatie voor het afleveren van vloeibare brandstoffen
      aan vaartuigen op een bunkerstation wordt weggehangen boven een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.87a
  - number: 4.87a.4
    text: |-
      Een installatie voor het afleveren van vloeibare brandstoffen aan vaartuigen wordt niet gebruikt voor het vullen
      van jerrycans en andere vaten met vloeibare brandstoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.87a
  - number: 4.87a.5
    text: |-
      Het afleveren van vloeibare brandstoffen aan vaartuigen vanuit een op de wal geplaatste vaste afleverinstallatie
      vindt plaats met een vulleiding met overvulbeveiliging en automatisch uitschakelinrichting die het bunkeren bij een
      tankvulstand van 97% onderbreken of een vulpistool dat is voorzien van een automatisch afslagmechanisme.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.87a
  - number: 4.87b
    text: |-
      Indien blijkt dat bij het afleveren van vloeibare brandstoffen aan vaartuigen en het vullen van de beladingstanks
      van een bunkerstation de geurhinder een aanvaardbaar niveau overschrijdt, kan het bevoegd gezag met inachtneming
      van de NeR maatwerkvoorschriften stellen met betrekking tot de situering van de emissiepunten waar dampen van
      brandstof vrijkomen, of de toepassing van dampretourvoorzieningen of andere systemen om de dampen gericht af te
      zuigen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.87b
  - number: 4.88.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het afleveren van vloeibare brandstof en gecomprimeerd aardgas,
      anders dan aan motorvoertuigen voor het wegverkeer, spoorvoertuigen en vaartuigen, ten minste voldaan aan de
      [artikelen 4.91 tot en met 4.93][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.88
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.88.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico wordt bij het afleveren van vloeibare
      brandstof, anders dan aan motorvoertuigen voor het wegverkeer, spoorvoertuigen en vaartuigen, voldaan aan de
      [artikelen 4.91][ref1] en [4.94][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.88
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.88.3
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      luchtverontreiniging wordt bij het afleveren van lichte olie voldaan aan [artikel 4.89][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.88
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.89.1
    text: |-
      De tankinstallatie is zodanig uitgevoerd dat bij het vullen van een opslagtank met lichte olie de uit de opslagtank
      verdreven dampen door een gasdichte retourleiding kunnen worden teruggevoerd naar het reservoir van de tankwagen
      die de lichte olie levert (dampretour stage I). Het systeem is zo ontworpen dat drukopbouw zoveel mogelijk wordt
      voorkomen. Indien een vacuümdrukklep wordt toegepast bedraagt de drukopbouw in het gehele systeem niet meer dan de
      openingsdruk van de desbetreffende klep. Deze openingsdruk bedraagt niet meer dan 3,92 kilopascal.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.89
  - number: 4.89.2
    text: |-
      Indien lichte olie wordt aangeleverd is het terugvoeren van de uit de ondergrondse opslagtank verdreven dampen met
      de in het eerste lid bedoelde voorziening verplicht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.89
  - number: 4.89.3
    text: |-
      De aansluitpunten van de vulleidingen en de dampretourleidingen zijn zodanig uitgevoerd dat verwisseling van de
      vulslang en de dampretourslang van en naar de tankwagen is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.89
  - number: 4.89.4
    text: Het vullen van een ondergrondse opslagtank vindt niet plaats indien de dampretourleiding lek is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.89
  - number: 4.89.5
    text: |-
      Het eerste tot en met het vierde lid is niet van toepassing op een inrichting met een debiet van lichte olie van
      minder dan 100 kubieke meter per jaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.89
  - number: '4.91'
    text: |-
      Een vaste afleverinstallatie voldoet bij het afleveren van vloeibare brandstof anders dan aan motorvoertuigen voor
      het wegverkeer, spoorvoertuigen en vaartuigen aan de volgende onderdelen van PGS 28:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.91
  - number: 4.91.a
    text: de voorschriften 2.3.8 en 2.3.11 tot en met 2.3.13;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.91
  - number: 4.91.b
    text: de voorschriften 3.4.2 tot en met 3.4.11;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.91
  - number: 4.91.c
    text: de voorschriften 5.5.1 en 5.5.3, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.91
  - number: 4.91.d
    text: de paragrafen 5.6 en 5.7.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.91
  - number: '4.92'
    text: |-
      In afwijking van [artikel 4.91][ref1] voldoet het afleveren van vloeibare brandstof anders dan aan motorvoertuigen
      voor het wegverkeer, spoorvoertuigen en vaartuigen, waarbij minder dan 25 kubieke meter per jaar wordt afgeleverd,
      aan de voorschriften 3.4.1, 3.4.4, 3.4.5 en 3.4.8 van PGS 30.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.92
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.92a.1
    text: |-
      Een mobiele afleverinstallatie voldoet bij het afleveren van lichte olie, anders dan aan motorvoertuigen voor het
      wegverkeer, spoorvoertuigen en vaartuigen, aan bijlage D van PGS 28.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.92a
  - number: 4.92a.2
    text: |-
      Een mobiele afleverinstallatie voldoet bij het afleveren van gasolie, anders dan aan motorvoertuigen voor het
      wegverkeer, spoorvoertuigen en vaartuigen, aan bijlage D van PGS 30.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.92a
  - number: 4.92b
    text: |-
      Onverminderd de [artikelen 4.91][ref1] en [4.92][ref2] is een vaste afleverinstallatie voor het inpandig afleveren
      van lichte olie, anders dan aan motorvoertuigen voor het wegverkeer, spoorvoertuigen en vaartuigen, die is
      toegestaan op grond van [artikel 6.34, van het besluit][ref3], voorzien van een thermische brandmelder die is
      aangesloten op een akoestisch signaal.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.92b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '6'
  - number: 4.93.1
    text: |-
      Voor zover de nominale compressorcapaciteit per compressor ten minste 14,3 Nm3 per uur bedraagt, voldoet een
      aardgas-afleverinstallatie voor het afleveren van gecomprimeerd aardgas anders dan aan motorvoertuigen voor het
      wegverkeer, spoorvoertuigen en vaartuigen aan:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93
  - number: 4.93.1.a
    text: |-
      de paragrafen 5.1 tot 5.3, met uitzondering van subparagraaf 5.1.6, eerste en tweede alinea, en de paragrafen 5.5
      en 5.7 tot en met 5.11, met uitzondering van subparagraaf 5.10.1 van PGS 25;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93
  - number: 4.93.1.b
    text: de paragrafen 6.1 en 6.2 van PGS 25;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93
  - number: 4.93.1.c
    text: de paragrafen 7.1 en 7.3 tot en met 7.7 van PGS 25;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93
  - number: 4.93.1.d
    text: de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11 van PGS 25, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93
  - number: 4.93.1.e
    text: de hoofdstukken 9 tot en met 12, met uitzondering van paragraaf 11.4, van PGS 25.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93
  - number: 4.93.2
    text: |-
      Inpandig afleveren van gecomprimeerd aardgas vindt plaats overeenkomstig de paragrafen 13.1, 13.2 en 13.4 van PGS
      25.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93
  - number: 4.93a.1
    text: |-
      Een aardgas-afleverinstallatie voldoet bij het afleveren van gecomprimeerd aardgas anders dan aan motorvoertuigen
      voor het wegverkeer, spoorvoertuigen en vaartuigen, voor zover de nominale compressorcapaciteit per compressor
      minder dan 14,3 Nm3 per uur bedraagt en voor zover de installatie is voorzien van een bufferopslag of van meerdere
      compressoren waarvan de uitlaatzijden zijn gekoppeld, aan het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.2
    text: |-
      Een installatie als bedoeld in het eerste lid, die is voorzien van meerdere compressoren waarvan de uitlaatzijden
      zijn gekoppeld, voldoet aan de volgende onderdelen van PGS 25:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.2.a
    text: |-
      de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagrafen 5.1.1 en 5.1.6, eerste en tweede alinea, en
      de paragrafen 5.5 en 5.7 tot en met 5.11, met uitzondering van de subparagraaf 5.10.1;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.2.b
    text: de paragrafen 6.1 en 6.2;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.2.c
    text: de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.2.d
    text: de hoofdstukken 9 tot en met 12, met uitzondering van de paragrafen 11.4 en 12.2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.3
    text: |-
      Indien een installatie als bedoeld in het tweede lid is voorzien van een bufferopslag, voldoet de installatie
      tevens aan de paragrafen 7.1 en 7.3 tot en met 7.7 van PGS 25.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.4
    text: |-
      Een installatie als bedoeld in het eerste lid, die niet is voorzien van compressoren die aan de uitlaatzijde zijn
      gekoppeld maar die is voorzien van een bufferopslag, voldoet aan de volgende onderdelen van PGS 25:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.4.a
    text: |-
      de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagrafen 5.1.1 en 5.1.6, eerste en tweede alinea, en
      de paragrafen 5.5, 5.7 en 5.9 tot en met 5.11, met uitzondering van de subparagraaf 5.10.1;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.4.b
    text: paragraaf 7.1 en de paragrafen 7.3 tot en met 7.7;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.4.c
    text: de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.93a.4.d
    text: de hoofdstukken 9 tot en met 12, met uitzondering van de paragrafen 9.1, 11.4 en 12.2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.93a
  - number: 4.94.1
    text: |-
      Het afleveren van vloeibare brandstof anders dan aan motorvoertuigen voor het wegverkeer, spoorvoertuigen en
      vaartuigen vindt plaats boven een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
  - number: 4.94.2
    text: |-
      De vloeistofdichte vloer of verharding, bedoeld in het eerste lid, is aangelegd overeenkomstig het daartoe
      krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een bedrijf, dat daartoe beschikt over
      een erkenning op grond van dat besluit, en strekt zich, voor zover erfafscheidingen, gebouwen en andere fysieke
      begrenzingen dit toelaten, vanaf de afleverzuil uit over een afstand van ten minste de lengte van de afleverslang
      plus 1 meter, met een minimum van 5 meter. Indien de vloeistofdichte vloer of verharding zich daardoor zou
      uitstrekken tot over de openbare weg dan strekt deze vloer of verharding zich uit tot de openbare weg met dien
      verstande dat deze afstand niet minder bedraagt dan 3 meter. In de laatste situatie is de afleverslang niet langer
      dan 4 meter. Aan de zijde waar geen tankende voertuigen kunnen worden opgesteld, strekt de vloeistofdichte vloer of
      verharding zich uit tot een afstand van ten minste 1 meter vanaf het hart van de afleverzuil.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.94.3
    text: |-
      De afwateringssystemen van de vloeistofdichte vloer of verharding zijn vloeistofdicht uitgevoerd overeenkomstig
      het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit. Terstond na de installatie en beproeving op dichtheid wordt
      de riolering afgedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.94.4
    text: |-
      De riolering, olieafscheider en de kolken en putten van de afwateringssystemen zijn aangelegd overeenkomstig het
      daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.94.5
    text: |-
      Een afleverinstallatie is geplaatst boven een vloeistofdichte vloer of verharding. Doorvoeringen en afsluitingen
      van deze vloeistofdichte vloer of verharding zijn eveneens vloeistofdicht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
  - number: 4.94.6
    text: |-
      Gelekte vloeistoffen worden vanaf de in het vijfde lid bedoelde vloeistofdichte vloer afgevoerd naar het
      afwateringssysteem of naar de in het eerste lid bedoelde vloeistofdichte vloer of verharding. Indien gebruik wordt
      gemaakt van afsluiters of terugslagkleppen zijn deze geplaatst boven een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
  - number: 4.94.7
    text: |-
      Pompeilanden en aanwezige doorvoeren zijn vloeistofdicht en zijn aangelegd overeenkomstig het daartoe krachtens
      het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een instelling, die daartoe beschikt over een
      erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.94.8
    text: |-
      In afwijking van het eerste tot en met het zevende lid vindt het afleveren van vloeibare brandstof anders dan aan
      motorvoertuigen voor het wegverkeer, spoorvoertuigen en vaartuigen, waarbij minder dan 25 kubieke meter per jaar
      wordt afgeleverd, plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94
  - number: 4.94a.1
    text: |-
      In afwijking van [artikel 4.94, eerste tot en met zevende lid][ref1], kan het afleveren van vloeibare brandstof,
      anders dan aan motorvoertuigen voor het wegverkeer en vaartuigen, plaatsvinden boven een geomembraanbaksysteem,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.3
        afdeling: '4.6'
  - number: 4.94a.1.a
    text: |-
      de inrichting is gelegen binnen de bebouwde kom waarbij de afleverzuilen in een rij parallel aan de naastgelegen
      weg staan opgesteld en het afleveren uitsluitend aan de wegzijde op of aan de openbare weg plaatsvindt, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94a
  - number: 4.94a.1.b
    text: |-
      op basis van een onderzoek naar de grondmechanica dat voor het aanbrengen van het geomembraanbaksysteem is
      uitgevoerd, is gebleken dat het aanbrengen van een vloeistofdichte vloer of verharding onevenredig hoge kosten met
      zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94a
  - number: 4.94a.2
    text: |-
      Een geomembraanbaksysteem als bedoeld in het eerste lid is aangelegd overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een bedrijf, dat daartoe beschikt over een erkenning op
      grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.94a
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.95.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan wordt bij het onderhouden en repareren van motoren, motorvoertuigen,
      spoorvoertuigen en andere gemotoriseerde apparaten en het proefdraaien van verbrandingsmotoren bij het werken met
      gevaarlijke stoffen ten minste aan het tweede en derde lid voldaan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.95
  - number: 4.95.2
    text: |-
      Werkzaamheden waarbij vuur wordt gebruikt, worden niet verricht aan of in de onmiddellijke nabijheid van een
      brandstofreservoir of andere delen van een motor die brandstof bevatten. De brandstofreservoirs zijn, behoudens
      tijdens de aan de reservoirs te verrichten werkzaamheden, goed gesloten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.95
  - number: 4.95.3
    text: |-
      Aan een tankwagen worden geen werkzaamheden verricht alvorens de zekerheid is verkregen dat geen gevaarlijke
      stoffen of brandbare vloeistoffen in de opslagtank aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.95
  - number: 4.95.4
    text: 'Het derde lid is niet van toepassing op de uitvoering van noodreparaties, mits:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.95
  - number: 4.95.4.a
    text: reparaties niet worden uitgevoerd aan de opslagtank zelf; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.95
  - number: 4.95.4.b
    text: |-
      vooraf het bevoegd gezag en de brandweer zijn geïnformeerd over de soort gevaarlijke stof die in de opslagtank is
      opgeslagen en de eigenschappen ervan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.95
  - number: 4.96.1
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden ten minste afgezogen dampen en
      gassen van een ruimte waarin vanwege onderhoud of reparatie van motoren, motorvoertuigen, spoorvoertuigen of andere
      gemotoriseerde apparaten, verbrandingsmotoren worden proefgedraaid, bovendaks afgevoerd, indien binnen 50 meter van
      een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein dan wel op
      een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.96
  - number: 4.96.2
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit maatwerkvoorschriften stellen aan de ligging en
      uitvoering van het afvoerpunt van de emissies naar de buitenlucht, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.96
  - number: '4.97'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het onderhouden, repareren of behandelen
      van de oppervlakte en het deconserveren en het voorzien van een antiroestbehandeling van motoren, motorvoertuigen
      spoorvoertuigen, andere gemotoriseerde apparaten of onderdelen daarvan, waarbij vloeistoffen vrij kunnen komen, ten
      minste plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.97
  - number: 4.98.1
    text: |-
      Ten behoeve van het voorkomen van milieuverontreiniging draagt degene die de inrichting drijft er bij het
      onderhouden, repareren en afspuiten van pleziervaartuigen ten minste zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.98
  - number: 4.98.1.a
    text: |-
      binnen de inrichting gedragsvoorschriften aanwezig zijn, die zijn gericht op het voorkomen van
      milieuverontreiniging door de houders van pleziervaartuigen en ziet toe op de naleving daarvan. De
      gedragsvoorschriften bevatten in elk geval instructies ten aanzien van het uitvoeren van onderhoud en reparatie
      van pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.98
  - number: 4.98.1.b
    text: |-
      machinaal schuren geschiedt met mechanische stofafzuiging waarbij het vrijkomende schuurstof in een stofzak wordt
      opgevangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.98
  - number: 4.98.2
    text: |-
      De gedragsvoorschriften als bedoeld in eerste lid onderdeel a, zijn binnen de inrichting zodanig aanwezig dat een
      ieder daarvan op eenvoudige wijze kennis kan nemen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.98
  - number: 4.99.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het onderhouden, repareren en
      afspuiten van pleziervaartuigen, het repareren, onderhouden en behandelen van de oppervlakte van pleziervaartuigen
      of onderdelen daarvan, waarbij vloeistoffen vrij kunnen komen, plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.99
  - number: 4.99.2
    text: Het eerste lid is niet van toepassing indien deze werkzaamheden worden verricht binnen het vaartuig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.99
  - number: 4.99.3
    text: |-
      Het op de wal met water onder hoge druk reinigen van de romp onder de waterlijn van een pleziervaartuig, geschiedt
      boven een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.99
  - number: 4.99.4
    text: |-
      Het reinigen, als bedoeld in het derde lid, vindt op zodanige wijze plaats dat geen afvalwater buiten de
      vloeistofdichte vloer of verharding terecht komt. Windwerende voorzieningen worden toegepast indien dat nodig is om
      verwaaien van afvalwater of afvalstoffen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.99
  - number: 4.100.1
    text: |-
      Ten behoeve van het voorkomen, dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder, worden afgezogen dampen en gassen van het zeefdrukken die op de buitenlucht worden geëmitteerd, ten
      minste 2 meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen bebouwing, afgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.100
  - number: 4.100.2
    text: |-
      Het eerste lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.100
  - number: 4.100.3
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege onvoldoende
      verspreiding van afgezogen dampen, vanwege geuremissies die niet via de afzuiging worden afgevoerd of vanwege
      incidentele geurpieken in aanvulling op het eerste lid met inachtneming van de NeR maatwerkvoorschriften stellen
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.100
  - number: 4.100.3.a
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.100
  - number: 4.100.3.b
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.100
  - number: 4.100.3.c
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.100
  - number: '4.101'
    text: |-
      Aan de procesmatige scheiding als bedoeld in [artikel 4.91, tweede lid, van het besluit][ref1] wordt in ieder geval
      voldaan indien de inkt aan de zeefdrukmachine wordt verwijderd en één van de volgende technieken wordt toegepast:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.101
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.101.a
    text: een automatische drukvormwasinstallatie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.101
  - number: 4.101.b
    text: een drukvormspoelmeubel.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.101
  - number: '4.102'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt het zeefdrukken en het verwijderen van
      inkt van zeefdrukramen door middel van reinigen of andere methoden plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102
  - number: 4.102a.1
    text: |-
      Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, wordt stofklasse S dat
      vrijkomt bij het gebruik van anti-smetpoeder bij vellenoffsetdrukpersen, voor zover dat redelijkerwijs mogelijk is,
      doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102a
  - number: 4.102a.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht, worden de afgezogen stofemissies die
      vrijkomen bij vellenoffsetdrukpersen en die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht
      afgevoerd, indien binnen 50 meter van een emissiepunt een gevoelig gebouw is gelegen, niet zijnde een gevoelig
      gebouw op een gezoneerd industrieterrein, dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per
      hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102a
  - number: 4.102a.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit en met inachtneming van de NeR maatwerkvoorschriften
      stellen aan de ligging en uitvoering van het afvoerpunt van emissies naar de buitenlucht, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102a
  - number: 4.102b
    text: |-
      Aan [artikel 4.94 van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.102b.a
    text: het gebruik van anti-smetpoeder minder bedraagt dan 500 kg per jaar; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102b
  - number: 4.102b.b
    text: |-
      de afgezogen stofemissies die vrijkomen bij vellenoffsetdrukpersen worden gevoerd door een filtrerende afscheider,
      die geschikt is om aan [artikel 4.94 van het besluit][ref1] te voldoen, in goede staat van onderhoud verkeert,
      periodiek gecontroleerd wordt en zo vaak als voor de goede werking nodig is, wordt schoongemaakt en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.102c.1
    text: |-
      Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies, worden gassen en dampen
      die vrijkomen bij het offsetdrukproces, voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102c
  - number: 4.102c.2
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het tot een aanvaardbaar niveau beperken
      van geurhinder, worden de overeenkomstig het eerste lid afgezogen dampen en gassen, indien deze op de buitenlucht
      worden geëmitteerd, ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de uitmonding gelegen
      gebouwen afgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102c
  - number: 4.102c.3
    text: |-
      Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      gevoelig gebouw per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102c
  - number: 4.102c.4
    text: |-
      Het bevoegd gezag kan indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege onvoldoende
      verspreiding van afgezogen dampen, geuremissies die niet via de afzuiging worden afgevoerd of incidentele
      geurpieken in aanvulling op het tweede lid met inachtneming van de NeR maatwerkvoorschriften stellen met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102c
  - number: 4.102c.4.a
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102c
  - number: 4.102c.4.b
    text: het voorkomen of beperken van diffuse geuremissies; of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102c
  - number: 4.102c.4.c
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102c
  - number: 4.102d.1
    text: |-
      Ter uitvoering van [artikel 4.94a, eerste lid, van het besluit][ref1], past degene die de inrichting drijft:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.102d.1.a
    text: |-
      bij het toepassen van vluchtige organische stoffen in het vochtwater een zo laag als redelijkerwijs mogelijk
      gehalte aan vluchtige organische stoffen toe;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
  - number: 4.102d.1.b
    text: |-
      maatregelen ten aanzien van de bedrijfsvoering toe, ter voorkoming van onnodige emissie van vluchtige organische
      stoffen bij het offsetdrukken en het reinigen van de hierbij gebruikte apparatuur.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
  - number: 4.102d.2
    text: |-
      Ter uitvoering van [artikel 4.94a, eerste lid, van het besluit][ref1] stelt degene die de inrichting drijft een
      plan op ter reductie van het gebruik van isopropylalcohol of andere vluchtige organische stoffen die aan het
      vochtwater worden toegevoegd. Dit plan:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.102d.2.a
    text: |-
      bevat een beschrijving van de getroffen of te treffen maatregelen ter reductie van het gehalte aan isopropylalcohol
      of andere vluchtige organische stoffen in het vochtwater;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
  - number: 4.102d.2.b
    text: |-
      gaat in op de mogelijkheid tot aanschaf van nieuwe persen, die het gehalte aan vluchtige organische stoffen in het
      vochtwater zo laag mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
  - number: 4.102d.2.c
    text: wordt tweejaarlijks geactualiseerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
  - number: 4.102d.2.d
    text: is voor inzage door het bevoegd gezag beschikbaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
  - number: 4.102d.3
    text: |-
      Indien de emissiereducerende maatregelen, bedoeld in het eerste of tweede lid, niet of in onvoldoende mate zijn
      getroffen, kan het bevoegd gezag verzoeken om een motivering waarom de maatregelen niet zijn getroffen. Bij de
      motivering wordt betrokken de kosteneffectiviteit en de technische uitvoerbaarheid van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102d
  - number: 4.102e
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico vindt bij het offsetdrukken het verwerken van
      inkten, verdunningsmiddelen, reinigingsmiddelen en toevoegmiddelen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102e
  - number: 4.102ea.1
    text: |-
      Ten behoeve van het voorkomen dan wel het zoveel mogelijk beperken van diffuse emissies als bedoeld in
      [artikel 4.94de van het besluit][ref1], worden gassen en dampen die vrijkomen bij het heatsetdrogen, voor zover
      dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.102ea.2
    text: |-
      Ten behoeve van het voorkomen dan wel, voor zover dat niet mogelijk is, het tot een aanvaardbaar niveau beperken
      van geurhinder als bedoeld in [artikel 4.94de van het besluit][ref1], worden de afgezogen gassen en dampen, die
      naar de buitenlucht worden afgevoerd, ten minste twee meter boven de hoogste daklijn van de binnen 25 meter van de
      uitmonding gelegen gebouwen afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.102ea.3
    text: |-
      Het tweede lid is niet van toepassing indien het mogelijke effect van de geuremissie van de uittredende lucht van
      een afzuiginstallatie beperkt blijft tot een gezoneerd industrieterrein of een bedrijventerrein met minder dan één
      geurgevoelig object per hectare.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
  - number: 4.102ea.4
    text: |-
      Het bevoegd gezag kan, indien blijkt dat de geurhinder een aanvaardbaar niveau overschrijdt vanwege onvoldoende
      verspreiding van afgezogen dampen of gassen, met betrekking tot geuremissies die niet via de afzuiging
      worden afgevoerd of incidentele geurpieken met inachtneming van de NeR in aanvulling op het tweede lid
      maatwerkvoorschriften stellen inzake:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
  - number: 4.102ea.4.a
    text: de situering van de afvoerpijp;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
  - number: 4.102ea.4.b
    text: het voorkomen of beperken van diffuse geuremissies, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
  - number: 4.102ea.4.c
    text: het beperken van incidentele geurpieken tot specifieke tijdstippen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
  - number: 4.102ea.5
    text: |-
      In afwijking van het tweede lid, kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt en de bevoegdheden genoemd in het vierde lid onvoldoende zijn om de overschrijding ongedaan te
      maken met inachtneming van de NeR maatwerkvoorschriften opstellen met betrekking tot de aanwezigheid van een
      ontgeuringsinstallatie, of een grotere afvoerhoogte van de afgezogen dampen en gassen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102ea
  - number: 4.102eb
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 4.94de van het besluit][ref1], vindt bij het bedrukken met rotatieoffset druktechniek het verwerken
      van inkten, verdunningsmiddelen, reinigingsmiddelen en toevoegingsmiddelen plaats boven een bodembeschermende
      voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.102eb
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
