  - number: 4.8.2.b
    text: niet in grotere hoeveelheden in een verkoopruimte zijn opgeslagen dan is aangegeven in tabel 4.8.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
  - number: 4.8.3
    text: 'Dit artikel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
  - number: 4.8.3.a
    text: verpakkingen met producten bestemd voor de persoonlijke verzorging, waaronder spuitbussen, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
  - number: 4.8.3.b
    text: alcoholhoudende dranken in consumentenverpakkingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
  - number: 4.8.4
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot een andere wijze van opslag dan genoemd
      in het tweede lid op basis van een door de inrichtinghouder ingediend uitgangspuntendocument met betrekking
      tot de bouwkundige, installatietechnische en organisatorische maatregelen, waarin is aangetoond dat de opslag
      van gevaarlijke stoffen in verpakking en CMR-stoffen in verpakking in een voor het publiek toegankelijke
      verkoopruimte brandveilig is. Voordat de betreffende verkoopruimte in gebruik wordt genomen, is door een inspectie-
      instelling, die geaccrediteerd is door een accreditatie-instelling volgens NEN-EN-ISO/IEC 17020, door middel van
      een goedkeurend inspectierapport aangetoond dat de met het oog op de brandveiligheid getroffen voorzieningen en
      maatregelen zijn uitgevoerd overeenkomstig het uitgangspuntendocument. Dit inspectierapport is binnen de inrichting
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.8
  - number: 4.8.5
    text: |-
      Een lekbak als bedoeld in tabel 4.8 is onbrandbaar en productbestendig en kan ten minste 100% van de daarboven
      opgeslagen vloeistoffen bevatten.
