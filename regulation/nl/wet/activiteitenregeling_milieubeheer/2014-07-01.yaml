        paragraaf: 3.7.1
        afdeling: '3.7'
  - number: '3.112'
    text: |-
      Bij het bepalen van het langtijdgemiddelde beoordelingsniveau (L) en het maximaal geluidsniveau L als gevolg van
      een inrichting met een binnenschietbaan, bedoeld in [artikel 3.144, tweede lid, van het besluit][ref1], wordt
      gemeten volgens het in [bijlage 7][ref2] opgenomen Meetvoorschrift binnenschietinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.112
    references:
