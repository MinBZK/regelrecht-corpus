  - number: 4.15.6
    text: |-
      Het bevoegd gezag kan ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan
      wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat
      ongewone voorvallen zich voordoen en de gevolgen hiervan, bij maatwerkvoorschrift het derde lid niet van toepassing
      verklaren en toestaan dat een opslagtank zich op een verdieping bevindt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.7
    text: |-
      Bij maatwerkvoorschrift als bedoeld in het zesde lid kunnen eisen worden gesteld om de toegankelijkheid van de
      opslagtank voor de brandbestrijding te borgen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.8
    text: |-
      Het inpandig opslaan van halfzware olie als bedoeld in
      [artikel 4.4a, eerste lid, onderdeel c, van het besluit][ref1] is slechts toegestaan indien de volgende maatregelen
      zijn getroffen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.15.8.a
    text: de tankinstallatie is geaard en voorzien van potentiaalvereffening;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.8.b
    text: de ontluchting is naar buiten op ten minste 5 meter hoogte en niet nabij openingen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.8.c
    text: een goede ventilatie van de opslagruimte volgens NPR 7910-1 is in werking;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.8.d
    text: |-
      een waarschuwing of alarm treedt in werking indien de temperatuur in de opslagruimte boven het vlampunt van de
      vloeistof kan komen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.8.e
    text: een vlamdover met CE-markering is volgens NEN-EN-ISO 16852 en de ATEX-richtlijnen 137 en 95 geïnstalleerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.8.f
    text: het vulpunt is buiten, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.8.g
    text: |-
      de opslagtank is voorzien van elektronische peilvoorziening of een handmatige peilvoorziening met een zelfsluitende
      peildop.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9
    text: |-
      Uitpandige opslag van halfzware olie als bedoeld in [artikel 4.4a, eerste lid, onderdeel c, van het besluit][ref1]
      is slechts toegestaan indien de volgende maatregelen zijn getroffen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.15.9.a
    text: de opslagtank is van kunststof of staal;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9.b
    text: |-
      de opslagtank is geplaatst in een niet-brandbare lekbak van staal of beton. Indien een stalen tank dubbelwandig is
      uitgevoerd is geen lekbak nodig;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9.c
    text: de tankinstallatie is geaard en voorzien van potentiaalvereffening;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9.d
    text: de ontluchting is op ten minste 5 meter boven maaiveld;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9.e
    text: een vlamdover met CE-markering is volgens NEN-EN-ISO 16852 en de ATEX-richtlijn geïnstalleerd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9.f
    text: de vul-, zuig- en persleidingen zijn beveiligd tegen aanrijding;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9.g
    text: |-
      de opslagtank is voorzien van elektronische peilvoorziening of een handmatige peilvoorziening met een zelfsluitende
      peildop, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.15.9.h
    text: de tank is voorzien van lichte bekleding of van een verfsysteem.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.15
  - number: 4.16.1
    text: |-
      In afwijking van [artikel 1.2, eerste lid][ref1], wordt in dit artikel onder ‘PGS 30’ verstaan: Richtlijn
      PGS 30, getiteld ‘Vloeibare aardolieproducten, Buitenopslag in kleine installaties’, zoals gepubliceerd op
      www.publicatiereeksgevaarlijkestoffen.nl, PGS 30: 1999 versie 0.1 (2-2005).


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel1
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 4.16.2
    text: |-
      Het opslaan van PER en van stoffen van de klasse 5.1 van het ADR in een stationaire bovengrondse opslagtank met de
      daarbij behorende leidingen en appendages voldoet aan de volgende onderdelen van PGS 30:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.2.a
    text: voorschrift 4.1.3;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.2.b
    text: de voorschriften 4.2.4 tot en met 4.2.7, 4.2.9, 4.2.10 en 4.2.14;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.2.c
    text: de voorschriften 4.3.2 tot en met 4.3.4, 4.3.6, 4.3.8, 4.3.9 en 4.3.11;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.2.d
    text: de voorschriften 4.4.1, 4.4.3, 4.4.4, 4.4.7 en 4.4.8, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.2.e
    text: de voorschriften 4.5.1, 4.5.9 en 4.6.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.3
    text: |-
      Indien wordt beoordeeld of een stationaire bovengrondse opslagtank voor het opslaan van PER of stoffen van de
      klasse 5.1 van het ADR voldoet aan de eisen van PGS 30, zijn het vierde, vijfde en zesde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.4
    text: |-
      De stationaire bovengrondse opslagtank wordt geïnspecteerd overeenkomstig de voorschriften 4.5.2 en 4.5.3 van
      PGS 30 en wordt onder druk beproefd overeenkomstig voorschrift 4.5.5 van PGS 30. De inwendige inspectie van
      een stationaire bovengrondse opslagtank hoeft niet plaats te vinden bij de keuring waarmee voor een bestaande
      installatie die niet onder certificaat is aangelegd alsnog een installatiecertificaat kan worden afgegeven, indien
      wordt aangetoond dat de stationaire bovengrondse opslagtank minder dan vijftien jaar voor de inspectie nieuw in
      gebruik is genomen. In dat geval vindt de inwendige inspectie plaats vijftien jaar na de eerste ingebruikname.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.5
    text: |-
      Indien de stationaire bovengrondse opslagtank niet inwendig kan worden geïnspecteerd, wordt deze overeenkomstig
      voorschrift 4.5.9 van PGS 30 op de keuringsdatum buiten gebruik gesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: 4.16.6
    text: Van de beoordeling wordt een keuringsrapport opgesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.16
  - number: '4.17'
    text: |-
      De opslag van halfzware olie in mobiele bovengrondse opslagtanks inclusief bijbehorende leidingen en appendages
      voldoet aan bijlage D van PGS 30.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.17
  - number: 4.18.1
    text: |-
      Het opslaan van vloeibare gevaarlijke stoffen of vloeibare bodembedreigende stoffen in bovengrondse opslagtanks
      vindt plaats boven een lekbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18
  - number: 4.18.2
    text: |-
      Het eerste lid is niet van toepassing op een opslagtank, die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie in deze wand. Het systeem voor lekdetectie voldoet aan BRL K910 en wordt ten minste eens per jaar
      beoordeeld en goedgekeurd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument, door een persoon of instelling, die daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.18.3
    text: |-
      De vulpunten en aftappunten van een bovengrondse opslagtank met vloeibare gevaarlijke stoffen of bodembedreigende
      stoffen zijn geplaatst boven een vloeistofdichte vloer of verharding of boven of in een lekbak, of zijn uitgevoerd
      met een vulpunt morsbak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18
  - number: 4.18.4
    text: De opslagtank en de vulleiding zijn voorzien van een overvulbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18
  - number: 4.18.5
    text: |-
      Boven de lekbak, bedoeld in het eerste lid, vindt geen opslag van andere gevaarlijke stoffen plaats, indien die
      kunnen reageren met de stoffen in de bovengrondse opslagtank.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18
  - number: 4.18a.1
    text: |-
      Het opslaan van vloeibare bodembedreigende stoffen in opslagtanks boven een oppervlaktewaterlichaam vindt plaats
      boven een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en in staat is de bij normale
      bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.18a.2
    text: |-
      Het eerste lid is niet van toepassing op een opslagtank die dubbelwandig is uitgevoerd met een systeem voor
      lekdetectie dat voldoet aan BRL K910 en dat ten minste eenmaal per jaar wordt beoordeeld en goedgekeurd
      overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een persoon
      of instelling, die daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 4.18a.3
    text: |-
      De vulpunten en aftappunten van een opslagtank met vloeibare bodembedreigende stoffen zijn geplaatst boven of
      in een voorziening die zich rondom of onder de opgeslagen stoffen bevindt en die de bij normale bedrijfsvoering
      gemorste of wegspattende vloeistoffen kan op vangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.18a.4
    text: 'De voorzieningen, bedoeld in het eerste en derde lid, zijn zodanig uitgevoerd dat:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.18a.4.a
    text: gemorste of gelekte vloeibare bodembedreigende stoffen effectief worden opgevangen en kunnen worden opgeruimd;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.18a.4.b
    text: |-
      er geen hemelwater op of in terecht kan komen, tenzij het hemelwater regelmatig van of uit de voorziening wordt
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.18a.5
    text: |-
      De voorzieningen, bedoeld in het eerste en derde lid, zijn bestand tegen de inwerking van de desbetreffende
      vloeibare bodembedreigende stoffen en de condities waaronder deze stoffen worden gebruikt of opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.18a.6
    text: |-
      De voorziening, bedoeld in het eerste lid, heeft een opvangcapaciteit van ten minste 10% van de inhoud van alle
      opgeslagen stoffen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.18a.7
    text: De opslagtank en de vulleiding zijn voorzien van een overvulbeveiliging.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.18a
  - number: 4.19.1
    text: |-
      De [artikelen 4.15][ref1], [4.16][ref2] en [4.18][ref3] zijn niet van toepassing op een bovengrondse opslagtank met
      vloeibare gevaarlijke stoffen of vloeibare bodembedreigende stoffen die niet op de vloer staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
      - id: ref3
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
  - number: 4.19.2
    text: |-
      Aan de in het eerste lid bedoelde bovengrondse opslagtanks die niet op de vloer staan, kan het bevoegd gezag
      maatwerkvoorschriften stellen ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen,
      dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans
      dat ongewone voorvallen zich voordoen en de gevolgen hiervan, aan de plaats, de constructie, de keuring, de bodem-
      en veiligheidsvoorzieningen van de opslagtank.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19
  - number: 4.19a.1
    text: |-
      De [artikelen 4.13 tot en met 4.19][ref1] zijn niet van toepassing op het opslaan van vloeibare kunstmeststoffen in
      een bovengrondse opslagtank, dat plaatsvindt voor agrarische activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
  - number: 4.19a.2
    text: |-
      Het opslaan van vloeibare kunstmeststoffen in een bovengrondse opslagtank dat plaatsvindt voor agrarische
      activiteiten voldoet aan [artikel 4.19b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
  - number: 4.19b.1
    text: |-
      Een opslagtank voor vloeibare kunstmeststoffen als bedoeld in [artikel 4.19a, tweede lid][ref1], is:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
  - number: 4.19b.1.a
    text: |-
      van een voldoende stijfheid en sterkte om het gewicht van de opgeslagen vloeistof te dragen en om schadelijke
      vervorming als gevolg van overdruk bij vulling of overvulling te voorkomen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.b
    text: vloeistofdicht;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.c
    text: |-
      voorzien van een ondersteunende constructie van onbrandbaar materiaal en van een doelmatige fundering op plaatsen
      waar een kans op verzakking bestaat;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.d
    text: |-
      voor zover het het opslaan van zure kunstmeststoffen betreft, voorzien van een ontluchtingsleiding die uitmondt in
      de buitenlucht en die een open verbinding van de tank met de buitenlucht verzekert en niet in verbinding staat met
      een ontluchtingsleiding van een tank voor het opslaan van basische kunstmeststoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.e
    text: |-
      voor zover een niveau-aanwijzing of peilinrichting is aangebracht: zodanig ingericht dat het uitstromen van
      vloeistof uit de tank onmogelijk is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.f
    text: |-
      in elke aansluiting op een tank beneden het hoogste vloeistofniveau en in de toevoerleiding naar het
      verbruikstoestel, zo dicht mogelijk bij de tankwand, voorzien van een afsluiter, die zodanig is uitgevoerd dat
      duidelijk zichtbaar is of die geopend of gesloten is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.g
    text: |-
      voorzien van een overstortleiding met een diameter van vijftig millimeter, die uitmondt op vijf centimeter boven de
      bodem van de vloer of voorziening, bedoeld in onderdeel h;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.h
    text: |-
      geplaatst boven een ten minste vloeistofkerende vloer of een vloeistofdichte lekbak, die voldoende sterk is om
      weerstand te bieden aan de als gevolg van een lekkage optredende vloeistofdruk en bestand is tegen de in de tanks
      opgeslagen stoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.i
    text: ten hoogste voor 95% gevuld;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.j
    text: |-
      voorzien van duidelijk leesbare opschriften met de chemische naam en handelsnaam van het product dat in de tank is
      opgeslagen, de concentratie van dat product en de bijbehorende gevarensymbolen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.k
    text: |-
      voorzien van voorzieningen waardoor voorkomen wordt dat bij het vullen van een tank een verkeerde aansluiting wordt
      gemaakt, waardoor een ander product in de tank kan geraken dan waarvoor de tank bestemd is;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.l
    text: |-
      voorzien van vulleidingen die op afschot liggen, aflopend naar de tank of die, indien dat om technische redenen
      niet mogelijk is, na het vullen worden doorgeblazen, die goed met een goed sluitende dop of afsluiter zijn
      afgesloten, behoudens tijdens het vullen van tanks, die zijn beschermd tegen mechanische beschadigingen en die
      voldoen aan onderdeel j, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.1.m
    text: voorzien van leidingen die bovengronds of in een daartoe speciaal aangelegde goot zijn gelegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.2
    text: |-
      De vloeistofkerende vloer, bedoeld in het eerste lid, onder h, vormt samen met wanden, drempels of opstaande randen
      een vloeistofkerende opvangvoorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.3
    text: |-
      De inhoud van de opvangvoorziening, bedoeld in het tweede lid, of de lekbak, bedoeld in het eerste lid, onder h, is
      ten minste gelijk aan de tankinhoud, indien een tank in die voorziening is opgesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.4
    text: |-
      De inhoud van de opvangvoorziening of de lekbak is ten minste gelijk aan de inhoud van de grootste tank,
      vermeerderd met 10% van de gezamenlijke inhoud van de overige tanks, voor zover twee of meerdere tanks in die
      voorziening zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.5
    text: |-
      Een tank voor de bewaring van een zuur is opgesteld in een andere opvangvoorziening of lekbak dan een tank voor
      bewaring van een basische stof.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.19b.6
    text: |-
      Bij dosering van kunstmeststoffen in doseervaten, wordt eerst voorgedoseerd met water, voordat de kunstmeststoffen
      worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.19b
  - number: 4.20.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan wordt bij het opslaan van zuurstof, koolzuur, lucht, argon, helium of stikstof in
      een bovengrondse stationaire opslagtank een buiten gebruik gestelde stationaire opslagtank druk- en gasvrij gemaakt
      door een deskundig persoon. Een bewijs van een druk- en gasvrij gemaakte opslagtank wordt aan het bevoegd gezag
      overlegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.2
    text: |-
      Bij het vullen van een opslagtank wordt de maximale vullingsgraad niet overschreden. De maximale vullingsgraad is
      90% tenzij op of bij de opslagtank een andere maximale vullingsgraad is aangegeven.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.3
    text: |-
      Met betrekking tot de opstelplaats van een bovengrondse stationaire opslagtank met koolzuur, lucht, argon, helium
      of stikstof worden ten opzichte van de erfscheiding de volgende afstanden in acht genomen:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.3.a
    text: 'bij een opslagtank tot en met 10 kubieke meter: 1 meter;'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.3.b
    text: 'bij een opslagtank van meer dan 10 kubieke meter: 3 meter.'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.4
    text: |-
      Een bovengrondse stationaire opslagtank met koolzuur, lucht, argon, helium of stikstof wordt geplaatst op een
      ondergrond die uit onbrandbaar materiaal bestaat. Op plaatsen waar kans op verzakking bestaat, is een doelmatige
      fundering aangebracht. Een eventueel aangebrachte fundering of draagconstructie is vervaardigd uit materiaal dat
      een brand niet onderhoudt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.5
    text: |-
      Een bovengrondse stationaire opslagtank met koolzuur, lucht, argon, helium of stikstof, de leidingen en het vulpunt
      zijn doelmatig tegen aanrijding beschermd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.6
    text: |-
      Een bovengrondse stationaire opslagtank met koolzuur, lucht, argon, helium of stikstof, de leidingen en het vulpunt
      zijn ontoegankelijk opgesteld voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.7
    text: |-
      De opstelling van de bovengrondse stationaire opslagtank met zuurstof voldoet aan hoofdstuk 4 van de PGS 9, met
      uitzondering van voorschrift 4.3.4.2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.8
    text: |-
      Het eerste tot en met zevende lid zijn niet van toepassing op stationaire opslagtanks met een inhoud van maximaal
      300 liter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20.9
    text: |-
      In afwijking van het derde lid, onder b, kan het bevoegd gezag voor een bovengrondse stationaire opslagtank met
      koolzuur, lucht, argon, helium of stikstof van meer dan 10 kubieke meter bij maatwerkvoorschrift een kleinere
      afstand ten opzichte van de erfscheiding voorschrijven.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20
  - number: 4.20a.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan voldoet de opslag van propeen aan het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20a
  - number: 4.20a.2
    text: |-
      Een opslagtank met propeen is, voorzover van toepassing, in overeenstemming met het
      [Warenwetbesluit drukapparatuur][ref1] en voldoet aan hoofdstuk 2 en de hoofdstukken 4 tot en met 6 van PGS 19.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20a
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: 4.20a.3
    text: |-
      Een opslagtank met propeen met toebehoren, leidingen en andere installatieonderdelen wordt gekeurd, herkeurd en
      onderhouden overeenkomstig NEN-EN 12817 en NPR 2578.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20a
  - number: 4.20a.4
    text: |-
      Van de bevindingen van de keuringen en herkeuringen, bedoeld in het derde lid, zijn binnen de inrichting
      gedagtekende verklaringen aanwezig of op een door het bevoegd gezag te stellen termijn beschikbaar gesteld, die
      zijn afgegeven door of namens degene die de keuringen of herkeuringen heeft uitgevoerd. Deze verklaringen zijn,
      evenals alle relevante informatie voor een juist gebruik van de installatie en rapportages van uitgevoerd onderhoud
      en uitgevoerde werkzaamheden, opgenomen of samengevat in een installatieboek.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.20a
  - number: 4.21.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover dat niet
      mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan zijn bij het parkeren van vervoerseenheden met gevaarlijke stoffen ten minste de
      binnen de inrichting geparkeerde vervoerseenheden met gevaarlijke stoffen niet toegankelijk voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Het eerste lid is niet van toepassing op het opstellen van vervoerseenheden met gevaarlijke stoffen in verband
      met aanmelden of andere formaliteiten, of op het opstellen van vervoerseenheden met gevaarlijke stoffen voor het
      verrichten van laad- of loshandelingen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.21
  - number: 4.22.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover
      dat niet mogelijk, is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan, bedoeld in [artikel 4.9 van het besluit][ref1], voldoet
      de opslag in verpakking van stoffen van ADR klasse 5.2 type C of het gebruik of de opslag in verpakking van
      stoffen van ADR klasse 5.2, type D tot en met F, bedoeld in [artikel 4.8 van het besluit][ref2], aan de
      [artikelen 4.23 tot en met 4.27][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022830#Artikel4
