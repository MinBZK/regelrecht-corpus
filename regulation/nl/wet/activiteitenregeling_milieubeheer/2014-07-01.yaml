  - number: 6.8.3
    text: |-
      In afwijking van het eerste lid, kan het bevoegd gezag indien blijkt dat de geurhinder een aanvaardbaar niveau
      overschrijdt met inachtneming van de NeR bij maatwerkvoorschrift bepalen dat [3.103, eerste lid][ref1], wel van
      toepassing is.


