        artikel: '4'
      - id: ref3
        bwb_id: BWBR0022762
        artikel: '4'
  - number: 4.56.2
    text: |-
      Bij laswerkzaamheden klasse III wordt aan [artikel 4.40, eerste lid, van het besluit][ref1] in ieder geval voldaan
      indien per jaar niet meer dan 6.500 kilogram lastoevoegmateriaal en -elektroden wordt verbruikt. Op verzoek van het
      bevoegd gezag wordt aangetoond wat het jaarverbruik is aan lastoevoegmateriaal en -elektroden.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel4
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel4.56
