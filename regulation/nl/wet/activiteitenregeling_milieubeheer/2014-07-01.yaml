    text: |-
      indien van toepassing, de eisen van het reductieprogramma, bedoeld in
      [artikel 2.29, tweede lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.14
    references:
      - id: ref1
