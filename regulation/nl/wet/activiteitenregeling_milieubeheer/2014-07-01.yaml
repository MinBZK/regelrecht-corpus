  - number: '2.14'
    text: 'Degene die een oplosmiddeleninstallatie drijft, voert een oplosmiddelenboekhouding waarmee:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.14
  - number: 2.14.a
    text: 'wordt aangetoond dat is voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.14
  - number: 2.14.a.1°
    text: |-
      de emissiegrenswaarden, diffuse-emissiegrenswaarden of de totale emissiegrenswaarden, bedoeld in de
      [artikelen 2.29, eerste, vierde en vijfde lid][ref1], en [2.30, tweede en derde lid, van het besluit][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.14
    references:
