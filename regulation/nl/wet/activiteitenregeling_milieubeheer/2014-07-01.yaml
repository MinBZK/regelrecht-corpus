  - number: 6.7.1
    text: |-
      Ten aanzien van inrichtingen waarvoor onmiddellijk voorafgaand aan het tijdstip van het van toepassing
      worden van [het besluit][ref1] of een deel daarvan op een activiteit, op die inrichtingen, een vergunning
      in werking en onherroepelijk was, dan wel voorschriften golden op basis van één van de besluiten, genoemd in
      [artikel 6.43 van het besluit][ref2], zijn de [artikelen 3.15, eerste lid][ref3], [3.27j, eerste lid][ref4],
      [4.38, tweede lid][ref5], [4.40, derde lid][ref6], [4.44, tweede lid][ref7], [4.46, derde lid][ref8],
      [4.50, tweede lid][ref9], [4.55, tweede lid][ref10], [4.57, tweede lid][ref11], [4.60, tweede lid][ref12],
      [4.64, derde lid][ref13], [4.68, vierde lid][ref14], [4.71, tweede lid][ref15], [4.74, tweede lid][ref16],
      [4.77, tweede lid][ref17], [4.81, tweede lid][ref18], [4.84a, derde lid][ref19][4.84g, eerste lid][ref20],
      [4.84m, eerste lid][ref21], [4.96, eerste lid][ref22], [4.102a, tweede lid][ref23], [4.102i, tweede lid][ref24],
      [4.104a, tweede lid][ref25], [4.104c, eerste lid][ref26], en [4.117, tweede lid][ref27], niet van
      toepassing voor zover er geen verandering van de inrichting plaatsvindt waarvoor een melding krachtens
      [artikel 1.10 van het besluit][ref28] nodig is en voor zover er geen verandering van de inrichting plaatsvindt die
      leidt tot een toename van emissies als bedoeld in de genoemde artikelen of van de wijze van afvoer van die emissies
      naar de buitenlucht.


