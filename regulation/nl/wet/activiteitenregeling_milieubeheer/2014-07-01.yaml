    text: |-
      de afgezogen stofemissies die vrijkomen bij het schieten op een binnenschietbaan worden gevoerd door een
      filtrerende afscheider die geschikt is om aan [artikel 3.143, eerste lid, van het besluit][ref1] te voldoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.109.b
    text: |-
      die filtrerende afscheider in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.109
  - number: 3.110.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 3.144, aanhef en onder a, van het besluit][ref1], wordt
      bij het schieten op een binnenschietbaan ten minste voldaan aan het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.110
