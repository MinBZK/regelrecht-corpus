        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 3.18.3
    text: |-
      Ten behoeve van het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van
      luchtverontreiniging wordt bij het afleveren van lichte olie voldaan aan [artikel 3.19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 3.19.1
    text: |-
      De tankinstallatie is zodanig uitgevoerd dat bij het vullen van een opslagtank met lichte olie de uit de opslagtank
      verdreven dampen door een gasdichte retourleiding kunnen worden teruggevoerd naar het reservoir van de tankwagen
      die de lichte olie levert (dampretour stage I). Het systeem is zo ontworpen dat drukopbouw zoveel mogelijk wordt
      voorkomen. Indien een vacuümdrukklep wordt toegepast bedraagt de drukopbouw in het gehele systeem niet meer dan de
      openingsdruk van de desbetreffende klep. Deze openingsdruk bedraagt niet meer dan 3,92 kilopascal.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.19
  - number: 3.19.2
    text: |-
      Indien lichte olie wordt aangeleverd worden de uit de ondergrondse opslagtank verdreven dampen teruggevoerd met de
      in het eerste lid bedoelde voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.19
  - number: 3.19.3
    text: |-
      De aansluitpunten van de vulleidingen en de dampretourleidingen zijn zodanig uitgevoerd dat verwisseling van de
      vulslang en de dampretourslang van en naar de tankwagen, uitgesloten is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.19
  - number: 3.19.4
    text: Het vullen van een ondergrondse opslagtank vindt niet plaats indien de dampretourleiding lek is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.19
  - number: 3.19.5
    text: |-
      Het eerste tot en met vierde lid is niet van toepassing op een inrichting met een debiet van lichte olie van minder
      dan 100 kubieke meter per jaar.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.19
  - number: 3.20.1
    text: |-
      De in het EU-systeem voor dampretour fase-II gebruikte onderdelen geven geen aanleiding tot het optreden van
      brand of explosie van de bij het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer uit het
      brandstofreservoir van het motorvoertuig verdreven dampen die worden teruggevoerd in de ondergrondse opslagtank.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Het EU-systeem voor dampretour fase-II is voorzien van op de juiste plaats(en) aangebrachte en doelmatig werkende
      vlamkerende voorziening(en).
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.20
  - number: 3.20.3
    text: |-
      Het gebruikte EU-systeem voor dampretour fase-II verkeert in een goede staat en is vrij van scheuren, gaten en
      andere gebreken.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.20
  - number: 3.21.1
    text: |-
      Een vaste afleverinstallatie is uitgevoerd en geïnstalleerd en wordt vervangen en gerepareerd overeenkomstig het
      daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een persoon of instelling, die
      daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.21.2
    text: |-
      De vaste afleverinstallatie, bedoeld in het eerste lid, voldoet bij het afleveren van vloeibare brandstof aan
      motorvoertuigen voor het wegverkeer of aan spoorvoertuigen aan de volgende onderdelen van PGS 28:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21
  - number: 3.21.2.a
    text: de voorschriften 2.3.8 en 2.3.11 tot en met 2.3.13;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21
  - number: 3.21.2.b
    text: de voorschriften 3.4.2 tot en met 3.4.11;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21
  - number: 3.21.2.c
    text: de voorschriften 5.5.1 en 5.5.3, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21
  - number: 3.21.2.d
    text: de paragrafen 5.6 en 5.7.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21
  - number: 3.21.3
    text: |-
      Het temperatuurgevoelige element in de vaste afleverinstallatie wordt eenmaal per twee jaar door een daartoe
      opgeleid persoon of installateur op de goede werking gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21
  - number: 3.21a
    text: |-
      In afwijking van [artikel 3.21][ref1] wordt bij het afleveren van vloeibare brandstof aan motorvoertuigen voor het
      wegverkeer of aan spoorvoertuigen, waarbij minder dan 25 kubieke meter per jaar wordt afgeleverd, voldaan aan de
      voorschriften 3.4.1, 3.4.4, 3.4.5 en 3.4.8 van PGS 30.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21a
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 3.21b
    text: |-
      In de gevallen dat inpandig afleveren van lichte olie is toegestaan op grond van
      [artikel 6.22b van het besluit][ref1], is een vaste afleverinstallatie voor het inpandig afleveren van lichte olie
      voorzien van een thermische brandmelder die is aangesloten op een akoestisch signaal.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel6
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.21b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '6'
  - number: 3.22.1
    text: |-
      Een mobiele afleverinstallatie voldoet bij het afleveren van lichte olie aan motorvoertuigen voor het wegverkeer
      aan bijlage D van PGS 28.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.22
  - number: 3.22.2
    text: |-
      Bij het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig wordt voldaan aan de voorschriften 3.4.4,
      3.4.7, 3.4.8, 3.4.11, 5.6.2 en 5.6.3 van PGS 28.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.22
  - number: 3.22.3
    text: |-
      Indien het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig plaatsvindt met een afleverslang die is
      aangekoppeld via een vaste aansluiting wordt een overvulbeveiliging toegepast.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Tijdens het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig is voortdurend een persoon aanwezig
      die de aflevering indien nodig kan beëindigen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.22
  - number: 3.22.5
    text: |-
      Het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig op een spoorwegemplacement vindt uitsluitend
      plaats op een daarvoor door de drijver van de inrichting aangewezen tankplaats.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Voor zover de nominale compressorcapaciteit per compressor ten minste 14,3 Nm3 per uur bedraagt, voldoet een
      aardgas-afleverinstallatie bij het afleveren van gecomprimeerd aardgas aan motorvoertuigen voor het wegverkeer aan
      de volgende onderdelen van PGS 25:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.23
  - number: 3.23.1.a
    text: |-
      de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagraaf 5.1.6, eerste en tweede alinea, en de
      paragrafen 5.5 en 5.7 tot en met 5.11, met uitzondering van de subparagraaf 5.10.1,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.23
  - number: 3.23.1.b
    text: de paragrafen 6.1 en 6.2;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.23
  - number: 3.23.1.c
    text: de paragrafen 7.1 en 7.3 tot en met 7.7;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.23
  - number: 3.23.1.d
    text: de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.23
  - number: 3.23.1.e
    text: de hoofdstukken 9 tot en met 12, met uitzondering van paragraaf 11.4.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.23
  - number: 3.23.2
    text: Bij het inpandig afleveren van gecomprimeerd aardgas wordt voldaan aan de paragrafen 13.1, 13.2 en 13.4 van PGS 25.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.23
  - number: 3.24.1
    text: |-
      Voor zover de nominale compressorcapaciteit per compressor minder dan 14,3 Nm3 per uur bedraagt, voldoet een
      aardgas-afleverinstallatie bij het afleveren van gecomprimeerd aardgas aan motorvoertuigen voor het wegverkeer aan
      het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.2
    text: |-
      Een installatie als bedoeld in het eerste lid, die is voorzien van meerdere compressoren waarvan de uitlaatzijden
      zijn gekoppeld, voldoet aan de volgende onderdelen van PGS 25:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.2.a
    text: |-
      de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagrafen 5.1.1 en 5.1.6, eerste en tweede alinea, en
      de paragrafen 5.5 en 5.7 tot en met 5.11, met uitzondering van subparagraaf 5.10.1;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.2.b
    text: de paragrafen 6.1 en 6.2;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.2.c
    text: de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.2.d
    text: de hoofdstukken 9 tot en met 12, met uitzondering van de paragrafen 11.4 en 12.2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.3
    text: |-
      Indien een installatie als bedoeld in het tweede lid is voorzien van een bufferopslag, voldoet de installatie
      tevens aan de paragrafen 7.1 en 7.3 tot en met 7.7 van PGS 25.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.4
    text: |-
      Een installatie als bedoeld in het eerste lid, die niet is voorzien van compressoren die aan de uitlaatzijde zijn
      gekoppeld maar die is voorzien van een bufferopslag, voldoet aan de volgende onderdelen van PGS 25:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.4.a
    text: |-
      de paragrafen 5.1 tot en met 5.3, met uitzondering van de subparagrafen 5.1.1 en 5.1.6, eerste en tweede alinea, en
      de paragrafen 5.5, 5.7 en 5.9 tot en met 5.11, met uitzondering van subparagraaf 5.10.1;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.4.b
    text: paragraaf 7.1 en de paragrafen 7.3 tot en met 7.7;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.4.c
    text: de paragrafen 8.1 tot en met 8.7, 8.10 en 8.11, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.24.4.d
    text: de hoofdstukken 9 tot en met 12, met uitzondering van de paragrafen 9.1, 11.4 en 12.2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Het afleveren van vloeibare brandstof aan motorvoertuigen voor het wegverkeer of aan spoorvoertuigen vindt plaats
      boven een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.2
    text: |-
      De vloeistofdichte vloer of verharding, bedoeld in het eerste lid, is aangelegd overeenkomstig het daartoe
      krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een bedrijf, dat daartoe beschikt over
      een erkenning op grond van dat besluit en strekt zich, voor zover erfafscheidingen, gebouwen en andere fysieke
      begrenzingen dit toelaten, vanaf de afleverzuil uit over een afstand van ten minste de lengte van de afleverslang
      plus één meter, met een minimum van vijf meter. Indien de vloeistofdichte vloer of verharding zich daardoor zou
      uitstrekken tot over de openbare weg dan strekt deze vloer of verharding zich uit tot de openbare weg met dien
      verstande dat deze afstand niet minder bedraagt dan drie meter. In de laatste situatie is de afleverslang niet
      langer dan vier meter. Aan de zijde waar geen tankende voertuigen kunnen worden opgesteld strekt de vloeistofdichte
      vloer of verharding zich uit tot een afstand van ten minste één meter vanaf het hart van de afleverzuil.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.25.3
    text: |-
      De afwateringssystemen van de vloeistofdichte vloer of verharding zijn vloeistofdicht uitgevoerd overeenkomstig
      het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit. Terstond na de installatie en beproeving op dichtheid wordt
      de riolering afgedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.25.4
    text: |-
      De riolering, de olieafscheider en de kolken en putten van de afwateringssystemen zijn aangelegd overeenkomstig
      het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument, door een instelling, die daartoe
      beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.25.5
    text: |-
      Een afleverinstallatie is geplaatst boven een vloeistofdichte vloer of verharding. Doorvoeringen door en
      afsluitingen van deze vloeistofdichte vloer of verharding zijn eveneens vloeistofdicht.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.6
    text: |-
      Gelekte vloeistoffen worden vanaf de vloeistofdichte vloer of verharding, bedoeld in het vijfde lid, afgevoerd naar
      het afwateringssysteem of naar de in het eerste lid bedoelde vloeistofdichte vloer of verharding. Indien gebruik
      wordt gemaakt van afsluiters of terugslagkleppen zijn deze geplaatst boven een vloeistofdichte vloer of verharding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.7
    text: |-
      Pompeilanden en aanwezige doorvoeren zijn vloeistofdicht en zijn aangelegd overeenkomstig het daartoe krachtens
      het Besluit bodemkwaliteit aangewezen normdocument, door een instelling, die daartoe beschikt over een erkenning op
      grond van dat besluit.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.8
    text: |-
      In afwijking van het eerste tot en met het zevende lid vindt het afleveren van vloeibare brandstof aan
      motorvoertuigen of aan spoorvoertuigen, waarbij minder dan 25 kubieke meter per jaar wordt afgeleverd, plaats boven
      een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.9
    text: |-
      In afwijking van het tweede lid is een mobiele afleverinstallatie opgesteld op een vloeistofdichte vloer of
      verharding die reikt tot ten minste 1 meter buiten de projectie van de afleverinstallatie.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.10
    text: 'Bij het afleveren van gasolie vanuit een tankwagen aan een spoorvoertuig wordt voldaan aan de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.10.a
    text: |-
      het spoorvoertuig staat zodanig opgesteld boven een vloeistofdichte vloer of verharding dat het vulpunt zich ten
      minste 1 meter van de rand van de vloeistofdichte vloer of verharding bevindt,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.10.b
    text: |-
      de tankwagen staat bij het afleveren boven een bodembeschermende voorziening die aansluit op de vloeistofdichte
      vloer of verharding, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.10.c
    text: |-
      de afleverslang van de tankwagen komt niet buiten het geheel van de vloeistofdichte vloer of verharding en de
      bodembeschermende voorziening en kruist geen sporen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.11
    text: |-
      Op de vloeistofdichte vloer of verharding, bedoeld in het tiende lid, zijn het derde tot en met het zevende lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.25.12
    text: |-
      Het afleveren van ureum aan motorvoertuigen voor het wegverkeer of aan spoorvoertuigen vindt plaats boven de
      bodembeschermende voorziening die op grond van het eerste tot en met elfde lid is voorgeschreven voor het afleveren
      van vloeibare brandstof.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.25
  - number: 3.26.1
    text: |-
      In afwijking van [artikel 3.25, eerste tot en met negende lid][ref1], kan het afleveren van vloeibare brandstof
      plaatsvinden boven een geomembraanbaksysteem, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 3.26.1.a
    text: |-
      de inrichting is gelegen binnen de bebouwde kom waarbij de afleverzuilen in één rij parallel aan de naastgelegen
      weg staan opgesteld en het afleveren uitsluitend aan de wegzijde op of aan de openbare weg plaatsvindt, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.26
  - number: 3.26.1.b
    text: |-
      op basis van een onderzoek naar de grondmechanica dat vóór het aanbrengen van het geomembraanbaksysteem is
      uitgevoerd, is gebleken dat het aanbrengen van een vloeistofdichte vloer of verharding onevenredig hoge kosten met
      zich brengt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.26
  - number: 3.26.2
    text: |-
      Een geomembraanbaksysteem als bedoeld in het eerste lid is aangelegd overeenkomstig het daartoe krachtens het
      [Besluit bodemkwaliteit][ref1] aangewezen normdocument door een bedrijf, dat daartoe beschikt over een erkenning op
      grond van [dat besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
      [ref2]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0022929
      - id: ref2
        bwb_id: BWBR0022929
  - number: 3.27.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.23b, eerste lid, van het besluit][ref1] vindt het uitwendig wassen van motorvoertuigen, werktuigen of
      spoorvoertuigen plaats boven een vloeistofdichte vloer of verharding. De bij het wassen vrijkomende vloeistoffen
      lopen niet over de rand van de vloeistofdichte vloer of verharding.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27.2
    text: |-
      In afwijking van het eerste lid is het toegestaan motorvoertuigen, werktuigen en spoorvoertuigen te wassen in
      of op een mobiele wasinstallatie die zodanig is uitgevoerd dat vloeistoffen niet in de bodem kunnen geraken, met
      dien verstande dat een mobiele wasinstallatie niet langer dan zes maanden aaneengesloten op eenzelfde locatie is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27
  - number: 3.27a.1
    text: |-
      Een zuiveringsvoorziening als bedoeld in [artikel 3.23d, tweede lid, van het besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27a
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27a.1.a
    text: verwijdert ten minste 95% van de gewasbeschermingsmiddelen uit het afvalwater,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27a
  - number: 3.27a.1.b
    text: is goed toegankelijk, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27a
  - number: 3.27a.1.c
    text: wordt onderhouden zo vaak als voor de goede werking daarvan nodig is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27a
  - number: 3.27a.2
    text: |-
      Indien het afvalwater dat wordt aangeboden aan de zuiveringsvoorziening meer dat 20 milligram olie per liter bevat,
      wordt het afvalwater voorafgaand aan de zuiveringsvoorziening geleid door een olieafscheider en slibvangput die
      voldoen aan en worden gebruikt conform NEN-EN 858-1 en 2.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27a
  - number: 3.27b.1
    text: |-
      Indien de zuiveringsvoorziening, bedoeld in [artikel 3.23d, tweede lid, van het besluit][ref1], de
      gewasbeschermingsmiddelen biologisch uit het afvalwater verwijdert, voldoet de zuiveringsvoorziening, onverminderd
      [artikel 3.27a, aan het tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27b
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.27b.2
    text: 'Een biologische zuiveringsvoorziening bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27b
  - number: 3.27b.2.a
    text: |-
      zuiveringsmateriaal in een deel van de zuiveringsvoorziening die zodanig is uitgevoerd en zodanig wordt onderhouden
      dat contact van het afvalwater met de bodem wordt voorkomen, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27b
  - number: 3.27b.2.b
    text: |-
      een bufferopslag en doseereenheid waarmee het afvalwater geleidelijk en gelijkmatig wordt verspreid over
      het oppervlak van het zuiveringsmateriaal en waardoor de capaciteit van de zuiveringsvoorziening niet wordt
      overschreden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27b
  - number: 3.27b.3
    text: |-
      De biologische zuiveringsvoorziening is zodanig gedimensioneerd dat de capaciteit voldoende is voor de behandeling
      van de afvalwaterstroom die jaarlijks vrijkomt. Op verzoek van het bevoegd gezag wordt een berekening van de
      capaciteit van de zuiveringsvoorziening overgelegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27b
  - number: 3.27c.1
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.26a, onderdeel c, van het besluit][ref1] vindt:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27c.1.a
    text: het opslaan van autowrakken voorafgaand aan het demonteren, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27c.1.b
    text: |-
      het aftappen van vloeistoffen en het demonteren van vloeistof bevattende onderdelen bij het demonteren van
      autowrakken,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27c.2
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.26a, onderdeel c, van het besluit][ref1] vindt:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27c.2.a
    text: |-
      het opslaan van wrakken van tweewielige motorvoertuigen voorafgaand aan het demonteren plaats boven een
      vloeistofdichte vloer of verharding, en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27c.2.b
    text: |-
      het aftappen van vloeistoffen en het demonteren van vloeistof bevattende onderdelen bij het demonteren van wrakken
      van tweewielige motorvoertuigen plaats boven een bodembeschermende voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27c.3
    text: 'Het tweede lid, onderdeel a, is niet van toepassing op het opslaan, bedoeld in dat onderdeel, indien:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27c.3.a
    text: de wrakken bij ontvangst worden geïnspecteerd op lekkage van vloeibare bodembedreigende stoffen,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27c.3.b
    text: |-
      de wrakken waaruit vloeibare bodembedreigende stoffen lekken, worden opgeslagen boven een vloeistofdichte vloer of
      verharding of boven een lekbak,
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27c.3.c
    text: |-
      het opslaan van wrakken waaruit vloeibare bodembedreigende stoffen lekken, plaatsvindt boven een lekbak als
      bedoeld in onderdeel b en de vloeibare bodembedreigende stoffen in afwijking van [artikel 3.27d, tweede lid][ref1],
      uiterlijk binnen 24 uur na ontvangst van het wrak van het tweewielige motorvoertuig zijn afgetapt, en


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.27c.3.d
    text: |-
      de wrakken waaruit geen vloeibare bodembedreigende stoffen lekken, worden opgeslagen boven een bodembeschermende
      voorziening.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27c
  - number: 3.27d.1
    text: 'Ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.1.a
    text: |-
      een doelmatig beheer van afvalstoffen als bedoeld in het [artikel 3.26a van het besluit][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27d.1.b
    text: |-
      het voorkomen of beperken van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan, bedoeld in [artikel 3.26a van het besluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27d.1.c
    text: |-
      het realiseren van een verwaarloosbaar bodemrisico, bedoeld in [artikel 3.26a van het besluit][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27d.2
    text: |-
      Zo spoedig mogelijk, doch uiterlijk binnen tien werkdagen na ontvangst van het autowrak of wrak van een tweewielig
      motorvoertuig, worden de volgende stoffen, preparaten of producten, indien aanwezig, afgetapt of gedemonteerd en
      opgeslagen:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.a
    text: motorolie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.b
    text: transmissieolie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.c
    text: versnellingsbakolie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.d
    text: olie uit het differentieel;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.e
    text: hydraulische olie;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.f
    text: remvloeistoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.g
    text: koelvloeistoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.h
    text: ruitensproeiervloeistoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.i
    text: airconditioningsvloeistoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.j
    text: benzine;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.k
    text: diesel;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.l
    text: LPG-tank, inclusief LPG;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.m
    text: accu, inclusief accuzuren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.n
    text: oliefilter;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.o
    text: PCB/PCT-houdende condensatoren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.p
    text: batterijen; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.2.q
    text: ontplofbare onderdelen, zoals airbags en gordelspanners, voor zover deze niet zijn geneutraliseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.3
    text: |-
      Restanten van vloeistoffen worden zo goed mogelijk uit leidingen afgetapt. De aftappunten worden na het aftappen
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.4
    text: |-
      Indien dat noodzakelijk is voor de recycling als product van gedemonteerde onderdelen kan in afwijking van
      het tweede lid worden afgezien van het aftappen van de oliën uit de in dat lid genoemde onderdelen en kan het
      oliefilter worden teruggeplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.5
    text: 'Autowrakken worden binnen de inrichting ontdaan van de volgende stoffen, preparaten of producten:'
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.5.a
    text: |-
      banden, glas en grote kunststofonderdelen, zoals bumpers, instrumentenborden en vloeistoftanks, indien deze
      materialen tijdens het shredderproces niet zodanig gescheiden worden dat ze als materiaal kunnen worden gerecycled;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.5.b
    text: |-
      metalen onderdelen die koper, aluminium of magnesium bevatten indien deze metalen niet tijdens het shredderproces
      worden gescheiden;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.5.c
    text: katalysatoren;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.5.d
    text: onderdelen die lood, kwik, cadmium of zeswaardig chroom bevatten en als zodanig zijn voorzien van een aanduiding.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.6
    text: |-
      Een autowrak wordt niet op een zodanig wijze geplet, geknipt of anderszins mechanisch verkleind dat de identiteit
      en de inhoud daarvan niet meer herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27d.7
    text: |-
      Wrakken van tweewielige motorvoertuigen worden binnen de inrichting ontdaan van stoffen, preparaten of producten
      als bedoeld in het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27d
  - number: 3.27e.1
    text: |-
      Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.26a van het besluit][ref1] voldoet
      de opslag van afgetapte of gedemonteerde stoffen, preparaten of producten bij een inrichting waar autowrakken of
      wrakken van tweewielige motorvoertuigen worden gedemonteerd, aan het tweede tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27e
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27e.2
    text: |-
      Afgetapte of gedemonteerde stoffen, preparaten of producten als bedoeld in [artikel 3.27d, tweede lid][ref1],
      worden voor zover dat nodig is voor recycling als materiaal of product of nuttige toepassing afzonderlijk bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27e
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.27e.3
    text: |-
      Afgetapte of gedemonteerde stoffen, preparaten of producten als bedoeld in [artikel 3.27d, vijfde lid][ref1],
      worden op een zodanige wijze opgeslagen dat de mogelijkheden voor recycling als materiaal of product of nuttige
      toepassing niet worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27e
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.27e.4
    text: |-
      Niet voor recycling als product geschikte stoffen, preparaten of producten, waarvoor wel een mogelijkheid van
      recycling als materiaal of nuttige toepassing bestaat, worden gescheiden gehouden en gescheiden afgevoerd naar een
      inrichting met een milieuhygiënisch verantwoorde en doelmatige verwerkingsmogelijkheid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27e
  - number: 3.27e.5
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van de wijze van opslag van afgetapte of
      gedemonteerde stoffen, preparaten of producten als bedoeld in het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27e
  - number: 3.27f.1
    text: |-
      Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.26a van het besluit][ref1] voldoet
      de opslag van autowrakken of wrakken van tweewielige motorvoertuigen bij een inrichting waar autowrakken of wrakken
      van tweewielige motorvoertuigen worden gedemonteerd, aan het tweede tot en met zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27f
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27f.2
    text: |-
      Autowrakken of wrakken van tweewielige motorvoertuigen die nog niet zijn ontdaan van de stoffen, preparaten of
      producten, bedoeld in [artikel 3.27d, tweede lid][ref1], worden direct bij binnenkomst in de inrichting en in
      afwachting van verdere bewerking op een specifiek daarvoor aangewezen gedeelte van de inrichting opgeslagen en
      worden niet gestapeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27f
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.27f.3
    text: |-
      Autowrakken die nog niet zijn ontdaan van alle stoffen, preparaten of producten als bedoeld in
      [artikel 3.27d, vijfde lid][ref1], worden maximaal twee hoog, met een maximale hoogte van 4,5 meter, gestapeld op
      een daartoe aangewezen gedeelte van de inrichting, dan wel worden op een zodanige wijze in stellingen gestapeld dat
      deze gemakkelijk kunnen worden geïnspecteerd en gedemonteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27f
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.27f.4
    text: |-
      Autowrakken waarvan de stoffen, preparaten of producten, bedoeld in [artikel 3.27d, tweede en vijfde lid][ref1],
      zijn afgetapt of gedemonteerd, worden uitsluitend rechtstreeks uit de inrichting afgevoerd naar een inrichting
      waarin zich een shredderinstallatie bevindt en waarin autowrakken worden gescheiden in direct als materiaal te
      recyclen metaalschroot en shredderafvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27f
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.27f.5
    text: |-
      In afwijking van het vierde lid is het toegestaan autowrakken die zijn ontdaan van de stoffen, preparaten en
      producten, bedoeld in [artikel 3.27d, tweede lid][ref1], voordat ze overeenkomstig het vierde lid worden afgevoerd,
      ter beschikking te stellen aan een instelling voor oefen- en opleidingsdoeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27f
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.27f.6
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van de stapelhoogte voor autowrakken als bedoeld in
      het derde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27f
  - number: 3.27f.7
    text: |-
      Het bevoegd gezag kan maatwerkvoorschriften stellen ten aanzien van het ter beschikking stellen van autowrakken aan
      een instelling voor oefen- en opleidingsdoeleinden als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27f
  - number: 3.27g.1
    text: |-
      Ten behoeve van een doelmatig beheer van afvalstoffen als bedoeld in [artikel 3.26a van het besluit][ref1] wordt
      bij de ontvangst van een autowrak bij een inrichting waar autowrakken worden gedemonteerd, voldaan aan het tweede
      tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27g.2
    text: |-
      Bij de ontvangst van een autowrak met een kenteken dat verstrekt is door een in een andere lidstaat van de Europese
      Unie daartoe aangewezen instantie, wordt desgevraagd aan degene die zich van dat autowrak ontdoet een certificaat
      van vernietiging als bedoeld in artikel 5, derde lid, van de autowrakkenrichtlijn afgegeven, waarin in ieder geval
      de volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.2.a
    text: de naam, het adres en de handtekening van degene die het certificaat van vernietiging afgeeft;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.2.b
    text: de datum van afgifte van het certificaat van vernietiging;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.2.c
    text: het kenteken van het autowrak, inclusief de kenletters van het land daarop;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.2.d
    text: de categorie van voertuigen waartoe het autowrak behoort alsmede het merk en het model van het autowrak;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.2.e
    text: het chassisnummer van het autowrak; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.2.f
    text: de naam, het adres, de nationaliteit en de handtekening van de eigenaar of houder van het afgegeven autowrak.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.3
    text: Bij het certificaat van vernietiging wordt het bij het autowrak behorende kentekenbewijs gevoegd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27g.4
    text: |-
      Indien het bij het autowrak behorende kentekenbewijs niet aanwezig is, wordt dat op het certificaat van
      vernietiging aangegeven.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27g
  - number: 3.27h.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen zich
      voordoen en de gevolgen hiervan als bedoeld in [artikel 3.26a van het besluit][ref1] wordt bij het demonteren van
      LPG-tanks en de opslag van de gedemonteerde LPG-tanks ten minste voldaan aan het tweede tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27h
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27h.2
    text: Het aftappen van LPG uit een LPG-tank bij een inrichting type B is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27h
  - number: 3.27h.3
    text: Het demonteren van een LPG-tank geschiedt in de open lucht of in een goed geventileerde ruimte.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27h
  - number: 3.27h.4
    text: |-
      De gedemonteerde LPG-tanks waarvan LPG nog niet is afgetapt, worden bij een inrichting type B ten minste eenmaal
      per twee maanden uit de inrichting afgevoerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27h
  - number: 3.27h.5
    text: Bij een inrichting type B zijn maximaal 24 gedemonteerde LPG-tanks aanwezig, waarvan LPG nog niet is afgetapt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27h
  - number: 3.27h.6
    text: |-
      Gedemonteerde LPG-tanks waarvan LPG nog niet is afgetapt, worden als zodanig aangeduid en gescheiden opgeslagen van
      de LPG-tanks waarvan LPG is afgetapt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27h
  - number: 3.27i.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel, voor zover dat niet
      mogelijk is, het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone voorvallen
      zich voordoen en de gevolgen hiervan als bedoeld in het [artikel 3.26a van het besluit][ref1], wordt bij het
      neutraliseren van airbags of gordelspanners uit autowrakken of wrakken van tweewielige motorvoertuigen of de
      opslag van gedemonteerde airbags of gordelspanners binnen de inrichting tot een maximale hoeveelheid van 1000
      gedemonteerde airbags en gordelspanners, voldaan aan het tweede tot en met het twaalfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27i.2
    text: Het neutraliseren van airbags en gordelspanners gebeurt overeenkomstig paragraaf 6 van NEN 7557.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.3
    text: Het ontsteken van mechanische airbags wordt niet uitgevoerd bij een inrichting type A of type B.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.4
    text: |-
      Na demontage worden de gedemonteerde airbags of gordelspanners, met uitzondering van de werkvoorraad, opgeslagen in
      een daarvoor bestemde, voor transport van gedemonteerde airbags en gordelspanners geschikte container of een voor
      opslag bestemde ruimte, die zodanig is uitgevoerd dat voldoende drukontlasting mogelijk is en waar de gedemonteerde
      airbags en gordelspanners gescheiden worden van de overige stoffen en materialen door middel van een afscheiding
      van gaas van voldoende sterkte bestaande uit staaldraad met een vrije opening van maximaal vijf centimeter dan wel
      door opslag in een separaat brandcompartiment.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.5
    text: |-
      Gedemonteerde mechanische airbags en gordelspanners worden zodanig gescheiden van elkaar opgeslagen in een
      voorziening als bedoeld in het vierde lid dat de kans op onbedoeld activeren van deze airbags en gordelspanners
      zoveel mogelijk wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.6
    text: |-
      De ruimte, bedoeld in het vierde lid, bevindt zich op één centrale locatie binnen de inrichting, buiten bereik
      van onbevoegden.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.7
    text: In en rondom de ruimte, bedoeld in het vierde lid, wordt geen open vuur gemaakt en wordt niet gerookt.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.8
    text: |-
      Bij de entree van de ruimte, bedoeld in het vierde lid, is een markering aangebracht waarmee wordt aangegeven dat
      hier gedemonteerde airbags en gordelspanners zijn opgeslagen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.9
    text: De airbags worden met de afdekkap naar boven geplaatst.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.10
    text: |-
      Elektrische airbags en gordelspanners worden niet aan statische lading blootgesteld indien de bekabeling, die
      direct gemonteerd is aan een airbag of gordelspanner, beschadigd is.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.11
    text: |-
      Bij een inrichting type A of type B worden geen elektrische airbags of gordelspanners ontstoken die zodanig
      beschadigd zijn dat de airbags en gordelspanners niet op een veilige wijze in het autowrak kunnen worden
      geneutraliseerd.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
  - number: 3.27i.12
    text: |-
      De airbags en gordelspanners, bedoeld in het tiende lid, worden gedemonteerd en worden na demontage afgevoerd naar
      een persoon als bedoeld in [artikel 10.37, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27i
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 3.27j.1
    text: |-
      Ten behoeve van het voorkomen dan wel zoveel mogelijk beperken van diffuse emissies als bedoeld in het
      [artikel 3.26b, tweede lid, van het besluit][ref1], worden stof en gassen die vrijkomen bij het ontsteken van
      airbags of gordelspanners voor zover dat redelijkerwijs mogelijk is, doelmatig aan de bron afgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27j
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27j.2
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies naar de buitenlucht als bedoeld in het
      [artikel 3.26b, tweede lid, van het besluit][ref1], worden stof en gassen, ontstaan bij het ontsteken van airbags
      of gordelspanners, die naar de buitenlucht worden afgevoerd, bovendaks en omhoog gericht afgevoerd, indien binnen
      50 meter van een emissiepunt een gevoelig gebouw, niet zijnde een gevoelig gebouw op een gezoneerd industrieterrein
      dan wel op een bedrijventerrein met minder dan één gevoelig gebouw per hectare, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27j
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27j.3
    text: |-
      Het bevoegd gezag kan in het belang van de luchtkwaliteit met inachtneming van de NeR maatwerkvoorschriften stellen
      aan de ligging en uitvoering van het afvoerpunt van de emissies naar de buitenlucht, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27j
  - number: 3.27k
    text: |-
      Aan [artikel 3.26b, eerste lid, van het besluit][ref1] wordt in ieder geval voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27k
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27k.a
    text: op jaarbasis minder dan 5000 autowrakken worden gedemonteerd, of
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27k
  - number: 3.27k.b
    text: |-
      de afgezogen emissies die vrijkomen bij het ontsteken van airbags en gordelspanners worden gevoerd door een
      filtrerende afscheider die in goede staat van onderhoud verkeert, periodiek gecontroleerd wordt en zo vaak als voor
      de goede werking nodig is, wordt schoongemaakt en vervangen.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27k
  - number: 3.27l
    text: |-
      Ten behoeve van het doelmatig verspreiden van emissies, het voorkomen, dan wel zoveel mogelijk beperken van
      geurhinder en het voorkomen dan wel zoveel mogelijk beperken van luchtverontreiniging door benzeen als bedoeld in
      [artikel 3.26e van het besluit][ref1], bij mechanische ventilatie in een parkeergarage die deel uitmaakt van een
      inrichting met ten minste 20 parkeerplaatsen:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27l
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27l.a
    text: |-
      worden de aanzuigopeningen ten behoeve van de ventilatie in een verkeersluwe omgeving, of, indien dat niet mogelijk
      is, op ten minste vijf meter boven het straatniveau en buiten de beïnvloeding van de uitblaasopeningen aangebracht;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27l
  - number: 3.27l.b
    text: |-
      wordt de uit de parkeergarage afgezogen lucht verticaal uitgeblazen op ten minste 5 meter boven het straatniveau
      of, indien binnen 25 meter van de uitblaasopening een gebouw is gelegen met een hoogste daklijn die meer dan vijf
      meter boven het straatniveau is gelegen, ten minste één meter boven de hoogste daklijn van dat gebouw;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27l
  - number: 3.27l.c
    text: |-
      bedraagt de snelheid van de uitgeblazen lucht, gemeten bij de rand van de uitblaasopening, ten minste tien meter
      per seconde.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27l
  - number: 3.27m
    text: |-
      Aan [artikel 3.26j, derde lid, van het besluit][ref1] wordt in ieder geval voldaan indien een plan voor het in
      ontvangst nemen en verder beheren van afvalstoffen de volgende elementen bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.27m.a
    text: |-
      een beoordeling van de behoefte aan voorzieningen voor de ontvangst van afvalstoffen, gelet op de behoefte van de
      zeegaande pleziervaartuigen die gewoonlijk de jachthaven aandoen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.b
    text: een beschrijving van de voorzieningen voor de inzameling van afvalstoffen en de capaciteit daarvan;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.c
    text: een beschrijving van de procedures voor de afgifte van de betrokken afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.d
    text: een beschrijving van de procedures voor het melden van vermeende tekortkomingen in de voorzieningen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.e
    text: |-
      een beschrijving van de procedures voor structureel overleg met havengebruikers, afvalverwerkers en andere
      betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.f
    text: een beschrijving van de soort en de te verwachten hoeveelheden afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.g
    text: |-
      een beschrijving van de methoden voor het registreren van het feitelijk gebruik van de voorzieningen voor de
      inzameling van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.h
    text: een beschrijving van de wijze waarop ingezamelde afvalstoffen worden verwijderd; en
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: 3.27m.i
    text: vermelding van één of meerdere personen die verantwoordelijk zijn voor de uitvoering van het plan.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.27m
  - number: '3.28'
    text: |-
      Deze paragraaf is van toepassing op inrichtingen waarbij sprake is van het opslaan van propaan als bedoeld in
      [artikel 3.27 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
  - number: 3.29.1
    text: |-
      Ten behoeve van het voorkomen van risico’s voor de omgeving en ongewone voorvallen, dan wel voor zover
      dat niet mogelijk is het zoveel mogelijk beperken van de risico’s voor de omgeving en de kans dat ongewone
      voorvallen zich voordoen en de gevolgen hiervan is een opslagtank met propaan die op een bouwplaats is
      opgesteld en in gebruik is ten behoeve van bouwactiviteiten, voorzover van toepassing, in overstemming met het
      [Warenwetbesluit drukapparatuur][ref1] en voldoet de opslagtank met propaan voorts aan hoofdstuk 7 van PGS 19.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: 3.29.2
    text: |-
      Een opslagtank met propaan die anders dan op een bouwplaats is opgesteld of anders dan ten behoeve
      van bouwactiviteiten in gebruik is, is, voorzover van toepassing, in overeenstemming met het
      [Warenwetbesluit drukapparatuur][ref1] en voldoet voorts aan hoofdstuk 2 en de hoofdstukken 4 tot en met 6 van
      PGS 19.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: '3.30'
    text: |-
      Een opslagtank met propaan met toebehoren, leidingen en andere installatieonderdelen als bedoeld in
      [artikel 3.29][ref1], wordt gekeurd , herkeurd en onderhouden overeenkomstig NEN-EN 12817 en NPR 2578.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: '3.31'
    text: |-
      Van de bevindingen van de keuringen en herkeuringen als bedoeld in [artikel 3.30][ref1] zijn binnen de inrichting
      gedagtekende verklaringen aanwezig of op een door het bevoegd gezag te stellen termijn beschikbaar gesteld, die
      zijn afgegeven door of namens degene die de keuringen of herkeuringen heeft uitgevoerd. Deze verklaringen zijn,
      evenals alle relevante informatie voor een juist gebruik van de installatie en rapportages van uitgevoerd onderhoud
      en werkzaamheden, opgenomen of samengevat in een installatieboek.


      [ref1]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: '3.33'
    text: |-
      Ten behoeve van het realiseren van een verwaarloosbaar bodemrisico als bedoeld in
      [artikel 3.30 van het besluit][ref1], wordt bij het opslaan in, het vullen van en het betrekken uit ondergrondse
      opslagtanks van stoffen, alsmede alle handelingen die met dat opslaan, vullen of betrekken in onmiddellijk verband
      staan, met dien verstande dat daaronder niet wordt begrepen de aflevering van vloeibare brandstoffen, mengsmering
      en aardgas, voldaan aan [artikel 3.34 tot en met 3.37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.34.1
    text: |-
      Een ondergrondse opslagtank met de daarbij behorende leidingen en appendages is uitgevoerd en geïnstalleerd en
      wordt gerepareerd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen normdocument
      door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 3.34.2
    text: |-
      Indien de ondergrondse opslagtank of de daarbij behorende leidingen of appendages van staal zijn, is een
      bodemweerstandsmeting uitgevoerd overeenkomstig het daartoe krachtens het [Besluit bodemkwaliteit][ref1] aangewezen
      normdocument door een bedrijf, dat daartoe beschikt over een erkenning op grond van dat besluit. Indien uit een
      bodemweerstandsmeting blijkt dat de specifieke elektrische weerstand van de bodem minder is dan 100 ohmmeter worden
      de opslagtank en de leidingen tegen corrosie beschermd door middel van een kathodische bescherming, aangebracht
      overeenkomstig het daartoe krachtens het Besluit bodemkwaliteit aangewezen normdocument door een bedrijf, dat
      daartoe beschikt over een erkenning op grond van dat besluit. De termijn waarbinnen de bodemweerstandsmeting wordt
      uitgevoerd is gelijk aan de keuringstermijn, bedoeld in [artikel 3.35, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
      [ref2]: https://wetten.overheid.nl/BWBR0022830#Artikel3
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0022929
      - id: ref2
        bwb_id: BWBR0022830
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.34.3
    text: |-
      Een aansluitpunt van een vul- of leegzuigleiding wordt geplaatst boven of in een vulpuntmorsbak of boven een
      vloeistofdichte vloer of verharding. Een vloeistofdichte vloer of verharding is bij het afleveren van meer dan
      25 kubieke meter vloeibare brandstoffen per jaar, aangelegd overeenkomstig het daartoe krachtens het Besluit
      bodemkwaliteit aangewezen normdocument, door een instelling, die daartoe beschikt over een erkenning op grond
      van dat besluit. De oppervlakte van de vloeistofdichte vloer of verharding bij een vulpunt bedraagt ten minste 12
      vierkante meter, bij voorkeur met een afmeting van 4 meter bij 3 meter.
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.34
  - number: 3.35.1
    text: |-
      Een ondergrondse opslagtank met de daarbij behorende leidingen en appendages van staal
      of van kunststof waarin vloeibare brandstof of een organisch oplosmiddel als bedoeld in
      [artikel 3.29, onderdelen c tot en met i, van het besluit][ref1] dan wel de stof, bedoeld in artikel 3.29,
      onderdeel j, van het besluit is opgeslagen, wordt beoordeeld en gecontroleerd overeenkomstig het daartoe krachtens
      het [Besluit bodemkwaliteit][ref2] aangewezen normdocument, door een persoon of instelling, die daartoe beschikt
      over een erkenning op grond van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022929
  - number: 3.35.2
    text: |-
      Voor een ondergrondse opslagtank met de daarbij behorende leidingen en appendages gelden de keurings- en
      herkeuringstermijnen van tabel 3.35.
            Tabel 3.35







