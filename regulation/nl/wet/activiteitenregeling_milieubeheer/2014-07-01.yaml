    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.n
    text: laminaatverpakking en kunststof, dat ongeschikt is voor recycling als materiaal of product;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
  - number: 2.9.1.o
    text: metalen;
    url: https://wetten.overheid.nl/BWBR0022830/2014-07-01#Artikel2.9
