  - number: '4'
    text: |-
      Voor de vijftiende dag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister:

      a. een opgave van de werkelijke lasten van het Toeslagenfonds over de maand gelegen twee maanden voor de huidige
      maand;

      b. een opgave van de werkelijke lasten van het Toeslagenfonds, over perioden die vooraf gaan aan de onder a
      genoemde periode, voor zover daarop correcties plaats hebben gevonden, in elk geval uitgesplitst naar het jaar
      waarop de correcties betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel4
  - number: '5'
    text: |-
      De in [artikel 4][ref1] genoemde opgaven worden zodanig gespecificeerd dat daarin afzonderlijk worden vermeld:

      a. de uitbetaalde toeslagen per wet waarop de loondervingsuitkering is gebaseerd;

      b. de uitbetaalde uitkeringen op grond van de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref2];

      c. de uitbetaalde vakantie-uitkeringen per wet waarop de loondervingsuitkering is gebaseerd;

      d. de op grond van enige wet over zowel de onder a, b en c bedoelde toeslagen en uitkeringen als
      de vakantieuitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies
      die niet op deze toeslagen in mindering worden gebracht, uitgesplitst naar [Toeslagenwet][ref3] en
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref4];

      e. de uitvoeringskosten van de [Toeslagenwet][ref5];

      f. de uitvoeringskosten van de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref6].


