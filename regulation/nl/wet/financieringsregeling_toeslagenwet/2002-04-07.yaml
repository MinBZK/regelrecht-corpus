  - number: '7'
    text: |-
      1 De Minister stelt jaarlijks vóór 31 oktober de omvang van de middelen tot dekking van de uitgaven ten laste van
      het Toeslagenfonds over het afgelopen kalenderjaar vast.

      2 In het besluit, bedoeld in het eerste lid, wordt afzonderlijk vermeld:

      a. de omvang van de middelen tot dekking van de betaalde toeslagen en vakantie-uitkeringen;

      b. de omvang van de middelen tot dekking van de aan de uitvoering van de [Toeslagenwet][ref1] verbonden kosten;

      c. de omvang van de middelen tot dekking van de betaalde uitkeringen en de vakantie-uitkeringen ingevolge de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref2];

      d. de omvang van de middelen tot dekking van de aan de uitvoering van de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref3] verbonden kosten.

      3 Indien de op grond van het eerste lid vastgestelde omvang van de middelen tot dekking van de uitgaven ten laste
      van het Toeslagenfonds afwijkt van de op basis van deze regeling betaalde bedragen vindt een definitieve afrekening
      met het Uitvoeringsinstituut werknemersverzekeringen ten gunste of ten laste van het Toeslagenfonds plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0007891
