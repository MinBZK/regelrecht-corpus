      het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies, die niet op deze toeslagen, uitkeringen en
      vakantie-uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel1
  - number: 1.c.6°
    text: |-
      de kosten verbonden aan de uitvoering van
      [artikel 43, zesde lid, van de Invoeringswet stelselherziening sociale zekerheid][ref1];


