    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 1.c.8°
    text: |-
      de uitvoeringskosten van de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007891
  - number: '2.1'
    text: |-
      Op de eerste werkdag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister een
      viermaandsraming van de benodigde financiële middelen in die maand en de drie daaropvolgende maanden ten behoeve
      van het Toeslagenfonds.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel2
  - number: '2.2'
    text: |-
      Gedurende de maand kan het Uitvoeringsinstituut werknemersverzekeringen het geraamde bedrag aan financiële middelen
      bijstellen en overeenkomstig de Wet geïntegreerd middelenbeheer het geraamde bedrag aan financiële middelen en de
      bijstelling, opnemen bij de Minister van Financiën ten laste van de begroting van de Minister van Sociale Zaken
      en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel2
  - number: '2.3'
    text: |-
      In geval na afloop van een kalenderkwartaal blijkt dat de door het Uitvoeringsinstituut werknemersverzekeringen
      opgenomen financiële middelen meer dan 10% afwijken van het totaal van de ramingen van de eerste maand van de
      in dat kwartaal ingediende viermaandsramingen, verstrekt het Uitvoeringsinstituut werknemersverzekeringen een
      onderbouwde verklaring van deze afwijking aan de Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel2
  - number: '3.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen houdt bij de raming, zoals bedoeld in
      [artikel 2, eerste lid][ref1] en het bijgestelde bedrag van de benodigde financiële middelen, zoals bedoeld in
      [artikel 2, tweede lid][ref2], rekening met besluiten van de Minister van Sociale Zaken en Werkgelegenheid als
      bedoeld in [artikel 48, eerste en tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009502#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009502#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel48
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009502
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009502
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '48'
  - number: '3.2'
    text: |-
      De bedragen, voortvloeiend uit het eerste lid, met betrekking tot het lopende jaar, worden maandelijks
      zodanig berekend, dat niet meer dan één twaalfde gedeelte van het totale bedrag per jaar maal het aantal in
      het kalenderjaar aangevangen maanden ten laste komt van de begroting van de Minister van Sociale Zaken en
      Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel3
  - number: '4'
    text: 'Voor de vijftiende dag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister:'
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel4
  - number: 4.a
    text: |-
      een opgave van de werkelijke lasten van het Toeslagenfonds over de maand gelegen twee maanden voor de huidige
      maand;
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel4
  - number: 4.b
    text: |-
      een opgave van de werkelijke lasten van het Toeslagenfonds, over perioden die vooraf gaan aan de onder a genoemde
      periode, voor zover daarop correcties plaats hebben gevonden, in elk geval uitgesplitst naar het jaar waarop de
      correcties betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel4
  - number: '5'
    text: |-
      De in [artikel 4][ref1] genoemde opgaven worden zodanig gespecificeerd dat daarin afzonderlijk worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0009502#Artikel4
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009502
        artikel: '4'
  - number: 5.a
    text: de uitbetaalde toeslagen per wet waarop de loondervingsuitkering is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel5
  - number: 5.b
    text: |-
      de uitbetaalde uitkeringen op grond van de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007891
  - number: 5.c
    text: de uitbetaalde vakantie-uitkeringen per wet waarop de loondervingsuitkering is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel5
  - number: 5.d
    text: |-
      de op grond van enige wet over zowel de onder a, b en c bedoelde toeslagen en uitkeringen als de
      vakantieuitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies
      die niet op deze toeslagen in mindering worden gebracht, uitgesplitst naar [Toeslagenwet][ref1] en
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0007891
  - number: 5.e
    text: |-
      de uitvoeringskosten van de [Toeslagenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 5.f
    text: |-
      de uitvoeringskosten van de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007891
  - number: '6'
    text: 'Voor de vijftiende dag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister:'
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel6
  - number: 6.a
    text: |-
      een opgave van de volumegegevens met betrekking tot de gespecificeerde toeslagen en uitkeringen als bedoeld in
      [artikel 5, onder a en b][ref1] over de maand gelegen drie maanden voor de huidige maand;


      [ref1]: https://wetten.overheid.nl/BWBR0009502#Artikel5
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009502
        artikel: '5'
  - number: 6.b
    text: |-
      een opgave van de volumegegevens met betrekking tot de gespecificeerde toeslagen en uitkeringen als bedoeld in
      [artikel 5, onder a en b][ref1] over perioden die vooraf gaan aan de onder a genoemde periode, voor zover daarop
      correcties plaats hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009502#Artikel5
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009502
        artikel: '5'
  - number: '7.1'
    text: |-
      De Minister stelt jaarlijks vóór 31 oktober de omvang van de middelen tot dekking van de uitgaven ten laste van het
      Toeslagenfonds over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel7
  - number: '7.2'
    text: 'In het besluit, bedoeld in het eerste lid, wordt afzonderlijk vermeld:'
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel7
  - number: 7.2.a
    text: de omvang van de middelen tot dekking van de betaalde toeslagen en vakantie-uitkeringen;
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel7
  - number: 7.2.b
    text: |-
      de omvang van de middelen tot dekking van de aan de uitvoering van de [Toeslagenwet][ref1] verbonden kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 7.2.c
    text: |-
      de omvang van de middelen tot dekking van de betaalde uitkeringen en de vakantie-uitkeringen ingevolge de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007891
  - number: 7.2.d
    text: |-
      de omvang van de middelen tot dekking van de aan de uitvoering van de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref1] verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007891
  - number: '7.3'
    text: |-
      Indien de op grond van het eerste lid vastgestelde omvang van de middelen tot dekking van de uitgaven ten laste van
      het Toeslagenfonds afwijkt van de op basis van deze regeling betaalde bedragen vindt een definitieve afrekening met
      het Uitvoeringsinstituut werknemersverzekeringen ten gunste of ten laste van het Toeslagenfonds plaats.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel7
  - number: '8'
    text: |-
      De [Financieringsregeling Algemene Kinderbijslagwet][ref1] en [Toeslagenwet][ref2] wordt ingetrokken, met
      uitzondering van de [artikelen 8, onder c][ref3], [10, onder c, 11 en 12][ref4] die van toepassing blijven tot 1
      juni 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009501
      [ref2]: https://wetten.overheid.nl/BWBR0004043
      [ref3]: https://wetten.overheid.nl/BWBR0009502#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009502#Artikel10
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009501
      - id: ref2
        bwb_id: BWBR0004043
      - id: ref3
        bwb_id: BWBR0009502
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0009502
        artikel: '10'
  - number: '9'
    text: |-
      [Artikel 8, onderdelen a en b][ref1] van de Financieringsregeling Kinderbijslagwet en [Toeslagenwet][ref2] zijn in
      het jaar 1998 niet van toepassing voorzover het de raming betreft met betrekking tot de maand april van dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009502#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009502
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004043
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 april 1998.
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Financieringsregeling Toeslagenwet.'
    url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#Artikel11
