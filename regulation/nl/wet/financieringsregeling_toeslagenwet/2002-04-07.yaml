  - number: '6'
    text: |-
      Voor de vijftiende dag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister:

      a. een opgave van de volumegegevens met betrekking tot de gespecificeerde toeslagen en uitkeringen als bedoeld in
      [artikel 5, onder a en b][ref1] over de maand gelegen drie maanden voor de huidige maand;

      b. een opgave van de volumegegevens met betrekking tot de gespecificeerde toeslagen en uitkeringen als bedoeld in
      [artikel 5, onder a en b][ref2] over perioden die vooraf gaan aan de onder a genoemde periode, voor zover daarop
      correcties plaats hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009502#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009502#Artikel5
