    Gelet op artikel 71 van de Organisatiewet sociale verzekeringen 1997;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009502/2002-04-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;

      b. *viermaandsraming:* een raming van de benodigde financiële middelen in een maand en de drie daaropvolgende
      maanden.

      c. *de lasten met betrekking tot het Toeslagenfonds:*

      1°. de toeslagen;

      2°. de vakantie-uitkeringen, bedoeld in [artikel 10 van de Toeslagenwet][ref1];

      3°. de uitkeringen ingevolge de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref2];

      4°. de vakantie-uitkeringen, bedoeld in [artikel 5, derde lid][ref3], van de Tijdelijke wet beperking
      inkomensgevolgen arbeids-ongeschiktheidscriteria;

      5°. de ingevolge enige wet, over de in 1°, 2°, 3° en 4° bedoelde toeslagen, uitkeringen en vakantie-uitkeringen
      door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies, die niet op deze toeslagen,
      uitkeringen en vakantie-uitkeringen in mindering kunnen worden gebracht;

      6°. de kosten verbonden aan de uitvoering van
      [artikel 43, zesde lid, van de Invoeringswet stelselherziening sociale zekerheid][ref4];

      7°. de uitvoeringskosten van de [Toeslagenwet][ref5];

      8°. de uitvoeringskosten van de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref6];


