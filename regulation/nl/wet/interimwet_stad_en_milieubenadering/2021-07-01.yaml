      1 Het bestuursorgaan dat is belast met de uitvoering van en het toezicht op de naleving van de
      milieukwaliteitsnormen, bedoeld in [artikel 2, onderdeel a][ref1], of de andere wettelijke voorschriften, bedoeld
      in de [artikelen 2, onderdeel b][ref2], en [3][ref3], neemt bij de uitoefening van zijn taak ten aanzien van een
      projectgebied het besluit, bedoeld in de [artikelen 2][ref4] en[ 3][ref5], in acht.

      2 Het bestuursorgaan dat bevoegd is tot het nemen van een besluit ten aanzien van een aanvraag
      om een omgevingsvergunning voor activiteiten met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref6] neemt een besluit als
      bedoeld in de [artikelen 2][ref7] en [3][ref8] in acht bij:

      a. het beslissen op een aanvraag om een omgevingsvergunning, en

      b. het toepassen van
      [artikel 2.31, eerste lid, onder b, en tweede lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref9].


