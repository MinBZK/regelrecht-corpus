  - number: '12'
    text: |-
      1 In dit artikel wordt onder bevoegd gezag verstaan: bestuursorgaan dat ten aanzien van een projectgebied
      belast is met toepassing van een milieukwaliteitsnorm of ander wettelijk voorschrift waarvan op grond van
      [artikel 2 ][ref1]of [3][ref2] afwijking wordt overwogen.

      2 Op de voorbereiding, het nemen en de terinzagelegging van het besluit, bedoeld in de [artikelen 2][ref3] en
      [3][ref4] of [9][ref5], zijn [artikel 3.8 van de Wet ruimtelijke ordening][ref6] en de krachtens die wet gestelde
      voorschriften omtrent totstandkoming en inhoud van het bestemmingsplan van overeenkomstige toepassing met dien
      verstande dat:

      a. burgemeester en wethouders gelijktijdig met de terinzagelegging van het ontwerpbesluit, bedoeld in de
      [artikelen 2][ref7] en [3][ref8], het bevoegd gezag in de gelegenheid stellen advies uit te brengen over het
      ontwerpbesluit, tenzij een orgaan van de gemeente als bevoegd gezag of adviseur is aangewezen;

      b. gedeputeerde staten gelijktijdig met de terinzagelegging van het ontwerpbesluit, bedoeld in [artikel 9][ref9],
      het bevoegd gezag in de gelegenheid stellen advies uit te brengen over het ontwerpbesluit, tenzij een orgaan van de
      provincie als bevoegd gezag of adviseur is aangewezen;

      c. het bevoegd gezag bij de voorbereiding van zijn advies de bestuursorganen betrekt, die ingevolge wettelijk
      voorschrift zijn aangewezen om hem terzake van advies te dienen;

      d. naar voren gebrachte zienswijzen omtrent het ontwerpbesluit, bedoeld in [artikel 9][ref10], zo spoedig mogelijk
      doch in elk geval daags na afloop van de terinzagelegging van het ontwerpbesluit aan Onze Minister en Onze Minister
      van Economische Zaken, Landbouw en Innovatie worden gestuurd.


