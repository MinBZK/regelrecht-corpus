preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in bepaalde gevallen afwijking van wettelijke
    voorschriften mogelijk te maken in het belang van zuinig en doelmatig ruimtegebruik en het bereiken van optimale
    leefomgevingskwaliteit en dat het voorts wenselijk is om een procedure in de wet te regelen voor het coördineren
    van besluitvorming teneinde die besluitvorming te versnellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019466/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. milieugevoelige bestemmingen: gebouwen en terreinen die naar hun aard bestemd zijn voor het verblijf van
      personen gedurende de dag of nacht of een gedeelte daarvan;

      b. projectgebied: gebied waarin op grond van de [artikelen 2][ref1], [3][ref2] of [9][ref3] wordt afgeweken van
      wettelijke voorschriften;

      c. milieukwaliteitsnorm: bij wettelijk voorschrift gestelde norm ten aanzien van de kwaliteit van een onderdeel van
      het milieu;

      d. omgevingsvergunning: omgevingsvergunning als bedoeld in
      [artikel 1.1 van de Wet algemene bepalingen omgevingsrecht][ref4];

      e. veehouderij: veehouderij als bedoeld in [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref5];

      f. zeer kwetsbaar gebied: zeer kwetsbaar gebied als bedoeld in
      [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref6];

      g. ammoniakemissie: ammoniakemissie als bedoeld in [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref7];

      h. dierenverblijf: dierenverblijf als bedoeld in [artikel 1 van de Wet geurhinder en veehouderij][ref8];

      i. reconstructiegebied: reconstructiegebied als bedoeld in
      [artikel 1 van de Reconstructiewet concentratiegebieden][ref9];

      j. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, en

      k. inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar.


