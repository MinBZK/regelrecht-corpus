  - number: '11'
    text: |-
      1 Burgemeester en wethouders melden het voornemen om een besluit als bedoeld in de [artikelen 2][ref1] en[ 3][ref2]
      te nemen aan gedeputeerde staten.

      2 De melding, bedoeld in het eerste lid, bevat ten minste:

      a. een omschrijving van het projectgebied en een of meerdere kadastrale kaarten waarop de begrenzing van dat gebied
      is aangegeven;

      b. het gewenste ruimtegebruik in het projectgebied, voorzover dat verband houdt met de toepassing van
      [artikel 2][ref3] of [3][ref4];

      c. een beschrijving van de omstandigheden op grond waarvan wordt verwacht dat het rekening houden met
      milieukwaliteit in de ruimtelijke planvorming, het nemen van brongerelateerde maatregelen en het optimaal
      benutten van wettelijke voorschriften niet toereikend zijn om zuinig en doelmatig ruimtegebruik en optimale
      leefomgevingskwaliteit te bereiken;

      d. de milieukwaliteitsnorm of het andere wettelijke voorschrift waarvan afwijking wordt overwogen, en

      e. een beschrijving op hoofdlijnen van de te verwachten gevolgen voor het milieu en de volksgezondheid in het
      projectgebied.

      3 Van de melding, bedoeld in het eerste lid, wordt kennisgegeven op de in
      [artikel 12 van de Bekendmakingswet][ref5] bepaalde wijze.

      4 Burgemeester en wethouders zenden een afschrift van de melding, bedoeld in het eerste lid, aan de inspecteur.


