  - number: '7'
    text: |-
      Voorzover de nadelige gevolgen voor het milieu van een besluit als bedoeld in de [artikelen 2][ref1] en [3][ref2]
      niet kunnen worden voorkomen of beperkt, worden die nadelige gevolgen gecompenseerd in of in de directe omgeving
      van het projectgebied op een wijze die de belangen, genoemd in de aanhef van de [artikelen 2][ref3] en [3][ref4],
      dient.


