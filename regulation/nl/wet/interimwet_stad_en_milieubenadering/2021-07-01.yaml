  - number: '6'
    text: |-
      De motivering van het besluit, bedoeld in de [artikelen 2 ][ref1]en[ 3,][ref2] bevat ten minste een beschrijving
      van:

      a. de visie van de gemeenteraad op de gewenste leefomgevingskwaliteit van het projectgebied, mede in relatie tot
      het ruimtegebruik en de leefomgevingskwaliteit in het gebied waarbinnen het projectgebied is gelegen;

      b. de wijze waarop getracht of overwogen is door rekening te houden met milieukwaliteit in de ruimtelijke
      planvorming, brongerelateerde maatregelen en optimale benutting van wettelijke voorschriften zuinig en doelmatig
      ruimtegebruik en optimale leefomgevingskwaliteit te bereiken;

      c. de daarbij ondervonden of te voorziene beperkingen ten aanzien van een milieukwaliteitsnorm of ander wettelijk
      voorschrift en een uiteenzetting over de meerwaarde die de afwijking daarvan met zich brengt met het oog op het
      bereiken van zuinig en doelmatig ruimtegebruik en optimale leefomgevingskwaliteit;

      d. de gevolgen die de uitvoering van het besluit met zich brengt voor de onderscheiden onderdelen van het milieu,
      de volksgezondheid en de objecten binnen het projectgebied;

      e. de overwegingen met betrekking tot het beperken en voorzover nodig compenseren van de nadelige gevolgen voor het
      milieu veroorzaakt door de afwijking van een milieukwaliteitsnorm of een ander wettelijk voorschrift;

      f. de wijze waarop bij de voorbereiding van het besluit belanghebbenden en bestuursorganen die het aangaat, zijn
      betrokken;

      g. de naar voren gebrachte zienswijzen en uitgebrachte adviezen en de overwegingen van de gemeenteraad omtrent de
      naar voren gebrachte zienswijzen en uitgebrachte adviezen, en

      h. indien het besluit een bepaalde termijn bevat, de overwegingen die hebben geleid tot de in het besluit
      aangegeven termijn waarvoor de afwijking geldt en de maatregelen die zullen worden getroffen teneinde die termijn
      niet te overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
