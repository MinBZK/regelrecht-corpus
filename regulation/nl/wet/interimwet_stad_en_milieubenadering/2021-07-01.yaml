      2 Indien een besluit als bedoeld in het eerste lid ingevolge een besluit of uitspraak in rechte is vernietigd,
      ingetrokken of gewijzigd, doen burgemeester en wethouders daarvan mededeling aan het kantoor, bedoeld in het eerste
      lid. Het eerste lid is van overeenkomstige toepassing.


