  - number: '4'
    text: |-
      1 Van de bevoegdheid, bedoeld in [artikel 2][ref1], wordt geen gebruik gemaakt:

      a. met betrekking tot milieukwaliteitsnormen, gesteld bij of krachtens de [Luchtvaartwet ][ref2]of de
      [Wet luchtvaart][ref3];

      b. met betrekking tot milieukwaliteitsnormen, gesteld bij of krachtens [artikel 5.2b][ref4] of
      [titel 5.2 van de Wet milieubeheer][ref5];

      c. met betrekking tot milieukwaliteitsnormen, gesteld krachtens [artikel 108 van de Wet geluidhinder][ref6]
      voorzover die normen betrekking hebben op luchtvaartterreinen, of

      d. voorzover dat leidt tot een geluidsbelasting binnen een woning met gesloten ramen, die hoger is dan 33 dB.

      2 Van de bevoegdheid, bedoeld in [artikel 3][ref7], wordt geen gebruik gemaakt met betrekking tot een deel van een
      reconstructiegebied waarop [artikel 27 van de Reconstructiewet concentratiegebieden][ref8] van toepassing is.

      3 De gemeenteraad maakt van de bevoegdheid, bedoeld in de [artikelen 2 ][ref9]en [3][ref10], uitsluitend gebruik,
      indien:

      a. hij tot het oordeel is gekomen dat het rekening houden met milieukwaliteit in de ruimtelijke planvorming, het
      nemen van brongerelateerde maatregelen en het optimaal benutten van wettelijke voorschriften niet toereikend zijn
      om zuinig en doelmatig ruimtegebruik en optimale leefomgevingskwaliteit te bereiken, en

      b. een melding als bedoeld in [artikel 11][ref11] is gedaan.


