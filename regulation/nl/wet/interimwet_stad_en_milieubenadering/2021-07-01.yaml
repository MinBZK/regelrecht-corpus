  - number: '3'
    text: |-
      De gemeenteraad kan ten aanzien van een door hem aangewezen projectgebied in het belang van zuinig en doelmatig
      ruimtegebruik en het bereiken van optimale leefomgevingskwaliteit, besluiten:

      a. dat, in afwijking van [artikel 4 van de Wet ammoniak en veehouderij][ref1], een omgevingsvergunning kan worden
      verleend voor het oprichten van een veehouderij onder intrekking van de rechtsgeldige omgevingsvergunning voor een
      bestaande veehouderij die binnen dat projectgebied dichter bij een zeer kwetsbaar gebied is gevestigd, met dien
      verstande dat:

      1°. indien het aantal dieren per diercategorie niet hoger is dan het aantal dat in de bestaande veehouderij
      aanwezig mocht zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot de op te richten
      veehouderij ten hoogste gelijk is aan de ammoniakemissie die de bestaande veehouderij zou mogen veroorzaken, of

      2°. indien het aantal dieren per diercategorie van de op te richten veehouderij hoger is dan het aantal dat in
      de bestaande veehouderij aanwezig mocht zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot
      de op te richten veehouderij ten hoogste gelijk is aan de ammoniakemissie die de bestaande veehouderij zou mogen
      veroorzaken indien daarop [artikel 7 van de Wet ammoniak en veehouderij][ref2] van toepassing zou zijn, en

      b. dat, in afwijking van [artikel 6 van de Wet ammoniak en veehouderij][ref3], een omgevingsvergunning kan worden
      verleend voor het veranderen van een veehouderij onder intrekking van de rechtsgeldige omgevingsvergunning voor een
      of meer andere binnen dat projectgebied bestaande, met de te veranderen veehouderij samen te voegen veehouderijen
      die dichter bij een zeer kwetsbaar gebied zijn gevestigd, met dien verstande dat:

      1°. indien het aantal dieren per diercategorie niet hoger is dan het aantal dat in de samen te voegen veehouderijen
      aanwezig mag zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot de te veranderen veehouderij
      ten hoogste de ammoniakemissie bedraagt die de samen te voegen veehouderijen zouden mogen veroorzaken, of

      2°. indien het aantal dieren per diercategorie hoger is dan het aantal dat in de samen te voegen veehouderijen
      aanwezig mag zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot de te veranderen veehouderij
      ten hoogste de ammoniakemissie bedraagt die de samen te voegen veehouderijen zouden mogen veroorzaken indien daarop
      [artikel 7 van de Wet ammoniak en veehouderij][ref4] van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013402#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013402#Artikel6
