  - number: '10'
    text: |-
      1 In een reconstructiegebied vindt de voorbereiding, het nemen, de goedkeuring van het besluit, bedoeld in
      [artikel 9][ref1], en het beroep tegen het besluit omtrent goedkeuring van dat besluit, gelijktijdig plaats met
      de voorbereiding, het nemen en de goedkeuring van het besluit tot vaststelling van het reconstructieplan, bedoeld
      in [artikel 11, eerste lid, van de Reconstructiewet concentratiegebieden][ref2], het gewijzigde reconstructieplan,
      bedoeld in [artikel 17, vierde lid, van die wet][ref3], of de uitwerking van het reconstructieplan, bedoeld in
      [artikel 18, eerste lid, van die wet][ref4], en het beroep tegen een van die besluiten.

      2 Bij de toepassing van het eerste lid zijn de [artikelen 4, derde lid][ref5], [5, eerste lid][ref6], [6][ref7],
      [7][ref8], [8][ref9], [11][ref10], [14][ref11] en [15][ref12] van deze wet en de [artikelen 15][ref13],
      [16, eerste lid][ref14], en [28 van de Reconstructiewet concentratiegebieden][ref15] van overeenkomstige
      toepassing, met dien verstande dat:

      a. onder «gemeenteraad» telkens wordt verstaan «provinciale staten van de provincie waarin het reconstructiegebied
      geheel of grotendeels is gelegen»;

      b. onder «burgemeester en wethouders» telkens wordt verstaan «gedeputeerde staten van de provincie waarin het
      reconstructiegebied geheel of grotendeels is gelegen»;

      c. onder «gedeputeerde staten» telkens wordt verstaan «Onze Minister en Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit»; en

      d. ook in het geval, bedoeld in [artikel 16, derde lid][ref16], of
      [17, zesde lid, van de Reconstructiewet concentratiegebieden][ref17], gedeputeerde staten van de provincie waarin
      het reconstructiegebied geheel of grotendeels is gelegen, een besluit als bedoeld in [artikel 9 ][ref18]van deze
      wet bekendmaken.

      3 Het niet tijdig bekendmaken van een besluit omtrent goedkeuring van een besluit als bedoeld in [artikel 9][ref19]
      van deze wet of van een besluit tot verdaging van de beslissing omtrent goedkeuring heeft niet tot gevolg dat een
      besluit tot goedkeuring is genomen.

      4 Indien goedkeuring wordt onthouden aan het reconstructieplan dat betrekking heeft op het projectgebied, wordt
      tevens goedkeuring onthouden aan het besluit, bedoeld in [artikel 9][ref20] van deze wet.


