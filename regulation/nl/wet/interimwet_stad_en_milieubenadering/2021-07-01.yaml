    text: |-
      1 Een besluit als bedoeld in de [artikelen 2][ref1] en [3 ][ref2]bevat ten minste:

      a. een omschrijving van het projectgebied en een of meerdere kadastrale kaarten waarop de begrenzing van dat gebied
      is aangegeven;

      b. de milieukwaliteitsnorm of het andere wettelijke voorschrift ten aanzien waarvan het besluit een afwijking
      bevat;

      c. de norm met betrekking tot de kwaliteit van het milieu of het andere wettelijke voorschrift, welke geldt ter
      vervanging van de milieukwaliteitsnorm of het andere wettelijke voorschrift waarvan wordt afgeweken;

      d. de wijze waarop nadelige gevolgen voor het milieu van een besluit als bedoeld in de [artikelen 2][ref3] en
      [3][ref4] worden beperkt en voorzover nodig gecompenseerd, en

      e. de termijn waarvoor de afwijking geldt.

      2 Onverminderd het eerste lid bevat een besluit als bedoeld in [artikel 2][ref5] onder verwijzing naar de
      bijgevoegde kadastrale kaart:

      a. een beschrijving van de onroerende zaken waarop dat besluit betrekking heeft;

      b. de kadastrale aanduiding van die onroerende zaken;

      c. de grootte van elk van de desbetreffende percelen volgens de basisregistratie kadaster, en

      d. indien een in de beschrijving opgenomen onroerende zaak een gedeelte van een perceel uitmaakt, de grootte van
      dat gedeelte.

      3 Op de bijgevoegde kadastrale kaart, bedoeld in het tweede lid, zijn de desbetreffende onroerende zaken en de
      bijhorende percelen en perceelsgedeelten duidelijk aangegeven.


