preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in bepaalde gevallen afwijking van wettelijke
    voorschriften mogelijk te maken in het belang van zuinig en doelmatig ruimtegebruik en het bereiken van optimale
    leefomgevingskwaliteit en dat het voorts wenselijk is om een procedure in de wet te regelen voor het coördineren
    van besluitvorming teneinde die besluitvorming te versnellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#ArtikelAanhef
