  - number: '2'
    text: |-
      De gemeenteraad kan ten behoeve van het vestigen van milieugevoelige bestemmingen en van het vestigen of
      verplaatsen van kleinschalige bedrijvigheid bij functiemenging van wonen en werken, ten aanzien van een door
      hem aangewezen projectgebied in het belang van zuinig en doelmatig ruimtegebruik en het bereiken van optimale
      leefomgevingskwaliteit, besluiten:
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel2
  - number: 2.a
    text: tot afwijking van een milieukwaliteitsnorm met betrekking tot bodem, geluid en lucht, en
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel2
  - number: 2.b
    text: |-
      tot afwijking van de waarden en afstanden, bedoeld in de [artikelen 3][ref1], [4][ref2] en
      [5 van de Wet geurhinder en veehouderij][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020396#Artikel5
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref2
