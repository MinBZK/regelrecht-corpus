        artikel: '18'
        paragraaf: '7'
  - number: '14.2'
    text: |-
      Op een besluit van de gemeenteraad tot intrekking van een besluit als bedoeld in de
      [artikelen 2][ref1] en[ 3][ref2] zijn de [artikelen 11, eerste, derde en vierde lid][ref3],
      [12, eerste en tweede lid, onderdelen a, c en d][ref4], [16][ref5] en [18][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0019466#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0019466#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0019466#Artikel18
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel14
    references:
