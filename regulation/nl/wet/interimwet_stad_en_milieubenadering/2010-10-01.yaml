      met betrekking tot milieukwaliteitsnormen, gesteld bij of krachtens [artikel 5.2b][ref1] of
      [titel 5.2 van de Wet milieubeheer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel4
    references:
