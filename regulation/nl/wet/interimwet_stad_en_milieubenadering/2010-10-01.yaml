    text: |-
      met betrekking tot milieukwaliteitsnormen, gesteld bij of krachtens de [Luchtvaartwet ][ref1]of de
      [Wet luchtvaart][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0005555
