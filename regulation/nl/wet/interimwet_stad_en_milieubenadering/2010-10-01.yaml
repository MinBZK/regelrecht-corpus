  - number: '15.1'
    text: |-
      Het bestuursorgaan dat is belast met de uitvoering van en het toezicht op de naleving van de
      milieukwaliteitsnormen, bedoeld in [artikel 2, onderdeel a][ref1], of de andere wettelijke voorschriften, bedoeld
      in de [artikelen 2, onderdeel b][ref2], en [3][ref3], neemt bij de uitoefening van zijn taak ten aanzien van een
      projectgebied het besluit, bedoeld in de [artikelen 2][ref4] en[ 3][ref5], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '3'
