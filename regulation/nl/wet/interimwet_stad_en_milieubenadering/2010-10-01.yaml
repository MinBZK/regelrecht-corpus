        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
  - number: 4.1.c
    text: |-
      met betrekking tot milieukwaliteitsnormen, gesteld krachtens [artikel 108 van de Wet geluidhinder][ref1] voorzover
      die normen betrekking hebben op luchtvaartterreinen, of


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '108'
  - number: 4.1.d
    text: voorzover dat leidt tot een geluidsbelasting binnen een woning met gesloten ramen, die hoger is dan 33 dB.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel4
  - number: '4.2'
    text: |-
      Van de bevoegdheid, bedoeld in [artikel 3][ref1], wordt geen gebruik gemaakt met betrekking tot een deel van een
      reconstructiegebied waarop [artikel 27 van de Reconstructiewet concentratiegebieden][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel27
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '27'
  - number: '4.3'
    text: |-
      De gemeenteraad maakt van de bevoegdheid, bedoeld in de [artikelen 2 ][ref1]en [3][ref2], uitsluitend gebruik,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: 4.3.a
    text: |-
      hij tot het oordeel is gekomen dat het rekening houden met milieukwaliteit in de ruimtelijke planvorming, het nemen
      van brongerelateerde maatregelen en het optimaal benutten van wettelijke voorschriften niet toereikend zijn om
      zuinig en doelmatig ruimtegebruik en optimale leefomgevingskwaliteit te bereiken, en
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel4
  - number: 4.3.b
    text: |-
      een melding als bedoeld in [artikel 11][ref1] is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel11
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '11'
        paragraaf: '4'
  - number: '5.1'
    text: |-
      Een besluit als bedoeld in de [artikelen 2][ref1] en [3 ][ref2]bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: 5.1.a
    text: |-
      een omschrijving van het projectgebied en een of meerdere kadastrale kaarten waarop de begrenzing van dat gebied
      is aangegeven;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: 5.1.b
    text: de milieukwaliteitsnorm of het andere wettelijke voorschrift ten aanzien waarvan het besluit een afwijking bevat;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: 5.1.c
    text: |-
      de norm met betrekking tot de kwaliteit van het milieu of het andere wettelijke voorschrift, welke geldt ter
      vervanging van de milieukwaliteitsnorm of het andere wettelijke voorschrift waarvan wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: 5.1.d
    text: |-
      de wijze waarop nadelige gevolgen voor het milieu van een besluit als bedoeld in de [artikelen 2][ref1] en
      [3][ref2] worden beperkt en voorzover nodig gecompenseerd, en


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: 5.1.e
    text: de termijn waarvoor de afwijking geldt.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd het eerste lid bevat een besluit als bedoeld in [artikel 2][ref1] onder verwijzing naar de bijgevoegde
      kadastrale kaart:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
  - number: 5.2.a
    text: een beschrijving van de onroerende zaken waarop dat besluit betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: 5.2.b
    text: de kadastrale aanduiding van die onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: 5.2.c
    text: de grootte van elk van de desbetreffende percelen volgens de basisregistratie kadaster, en
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: 5.2.d
    text: |-
      indien een in de beschrijving opgenomen onroerende zaak een gedeelte van een perceel uitmaakt, de grootte van dat
      gedeelte.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: '5.3'
    text: |-
      Op de bijgevoegde kadastrale kaart, bedoeld in het tweede lid, zijn de desbetreffende onroerende zaken en de
      bijhorende percelen en perceelsgedeelten duidelijk aangegeven.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel5
  - number: '6'
    text: |-
      De motivering van het besluit, bedoeld in de [artikelen 2 ][ref1]en[ 3,][ref2] bevat ten minste een beschrijving
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: 6.a
    text: |-
      de visie van de gemeenteraad op de gewenste leefomgevingskwaliteit van het projectgebied, mede in relatie tot het
      ruimtegebruik en de leefomgevingskwaliteit in het gebied waarbinnen het projectgebied is gelegen;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: 6.b
    text: |-
      de wijze waarop getracht of overwogen is door rekening te houden met milieukwaliteit in de ruimtelijke planvorming,
      brongerelateerde maatregelen en optimale benutting van wettelijke voorschriften zuinig en doelmatig ruimtegebruik
      en optimale leefomgevingskwaliteit te bereiken;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: 6.c
    text: |-
      de daarbij ondervonden of te voorziene beperkingen ten aanzien van een milieukwaliteitsnorm of ander wettelijk
      voorschrift en een uiteenzetting over de meerwaarde die de afwijking daarvan met zich brengt met het oog op het
      bereiken van zuinig en doelmatig ruimtegebruik en optimale leefomgevingskwaliteit;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: 6.d
    text: |-
      de gevolgen die de uitvoering van het besluit met zich brengt voor de onderscheiden onderdelen van het milieu, de
      volksgezondheid en de objecten binnen het projectgebied;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: 6.e
    text: |-
      de overwegingen met betrekking tot het beperken en voorzover nodig compenseren van de nadelige gevolgen voor het
      milieu veroorzaakt door de afwijking van een milieukwaliteitsnorm of een ander wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: 6.f
    text: |-
      de wijze waarop bij de voorbereiding van het besluit belanghebbenden en bestuursorganen die het aangaat, zijn
      betrokken;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: 6.g
    text: |-
      de naar voren gebrachte zienswijzen en uitgebrachte adviezen en de overwegingen van de gemeenteraad omtrent de naar
      voren gebrachte zienswijzen en uitgebrachte adviezen, en
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: 6.h
    text: |-
      indien het besluit een bepaalde termijn bevat, de overwegingen die hebben geleid tot de in het besluit aangegeven
      termijn waarvoor de afwijking geldt en de maatregelen die zullen worden getroffen teneinde die termijn niet te
      overschrijden.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel6
  - number: '7'
    text: |-
      Voorzover de nadelige gevolgen voor het milieu van een besluit als bedoeld in de [artikelen 2][ref1] en [3][ref2]
      niet kunnen worden voorkomen of beperkt, worden die nadelige gevolgen gecompenseerd in of in de directe omgeving
      van het projectgebied op een wijze die de belangen, genoemd in de aanhef van de [artikelen 2][ref3] en [3][ref4],
      dient.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: '8'
    text: |-
      Indien de uitvoering van een besluit als bedoeld in de [artikelen 2][ref1] en [3 ][ref2]onvoorziene en
      ontoelaatbare effecten heeft op het milieu of de volksgezondheid, neemt de gemeenteraad noodzakelijke maatregelen
      teneinde die effecten tot een toelaatbaar niveau terug te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: '9'
    text: |-
      Indien op een deel van een reconstructiegebied [artikel 27 van de Reconstructiewet concentratiegebieden][ref1] van
      toepassing is, kunnen provinciale staten van de provincie waarin dat reconstructiegebied geheel of grotendeels is
      gelegen ten aanzien van een door hen aan te wijzen projectgebied binnen dat deel van het reconstructiegebied in het
      belang van zuinig en doelmatig ruimtegebruik en het bereiken van optimale leefomgevingskwaliteit, besluiten:


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel27
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '27'
  - number: 9.a
    text: |-
      dat, in afwijking van [artikel 4 van de Wet ammoniak en veehouderij][ref1], een omgevingsvergunning kan worden
      verleend voor het oprichten van een veehouderij onder intrekking van de rechtsgeldige omgevingsvergunning voor een
      bestaande veehouderij die binnen het projectgebied, bedoeld in de aanhef, dichter bij een zeer kwetsbaar gebied is
      gevestigd, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel4
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '4'
  - number: 9.a.1°
    text: |-
      indien het aantal dieren per diercategorie niet hoger is dan het aantal dat in de bestaande veehouderij aanwezig
      mocht zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot de op te richten veehouderij ten
      hoogste gelijk is aan de ammoniakemissie die de bestaande veehouderij zou mogen veroorzaken, of
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel9
  - number: 9.a.2°
    text: |-
      indien het aantal dieren per diercategorie in de op te richten veehouderij hoger is dan het aantal dat in de
      bestaande veehouderij aanwezig mocht zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot
      de op te richten veehouderij ten hoogste gelijk is aan de ammoniakemissie die de bestaande veehouderij zou mogen
      veroorzaken indien daarop [artikel 7 van de Wet ammoniak en veehouderij][ref1] van toepassing zou zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel7
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '7'
  - number: 9.b
    text: |-
      dat, in afwijking van [artikel 6 van de Wet ammoniak en veehouderij][ref1], een omgevingsvergunning kan worden
      verleend voor het veranderen van een veehouderij onder intrekking van de rechtsgeldige omgevingsvergunning voor een
      of meer andere binnen het projectgebied, bedoeld in de aanhef, bestaande, met de te veranderen veehouderij samen te
      voegen veehouderijen die dichter bij een zeer kwetsbaar gebied zijn gevestigd, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel6
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '6'
  - number: 9.b.1°
    text: |-
      indien het aantal dieren per diercategorie niet hoger is dan het aantal dat in de samen te voegen veehouderijen
      aanwezig mag zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot de te veranderen veehouderij
      ten hoogste de ammoniakemissie bedraagt die de samen te voegen veehouderijen zouden mogen veroorzaken, of
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel9
  - number: 9.b.2°
    text: |-
      indien het aantal dieren per diercategorie hoger is dan het aantal dat in de samen te voegen veehouderijen aanwezig
      mag zijn, de toegestane ammoniakemissie uit de dierenverblijven behorende tot de te veranderen veehouderij ten
      hoogste de ammoniakemissie bedraagt die de samen te voegen veehouderijen zouden mogen veroorzaken indien daarop
      [artikel 7 van de Wet ammoniak en veehouderij ][ref1]van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel7
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '7'
  - number: '10.1'
    text: |-
      In een reconstructiegebied vindt de voorbereiding, het nemen, de goedkeuring van het besluit, bedoeld in
      [artikel 9][ref1], en het beroep tegen het besluit omtrent goedkeuring van dat besluit, gelijktijdig plaats met
      de voorbereiding, het nemen en de goedkeuring van het besluit tot vaststelling van het reconstructieplan, bedoeld
      in [artikel 11, eerste lid, van de Reconstructiewet concentratiegebieden][ref2], het gewijzigde reconstructieplan,
      bedoeld in [artikel 17, vierde lid, van die wet][ref3], of de uitwerking van het reconstructieplan, bedoeld in
      [artikel 18, eerste lid, van die wet][ref4], en het beroep tegen een van die besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0013399#Artikel18
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0013399
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0013399
        artikel: '18'
  - number: '10.2'
    text: |-
      Bij de toepassing van het eerste lid zijn de [artikelen 4, derde lid][ref1], [5, eerste lid][ref2], [6][ref3],
      [7][ref4], [8][ref5], [11][ref6], [14][ref7] en [15][ref8] van deze wet en de [artikelen 15][ref9],
      [16, eerste lid][ref10], en [28 van de Reconstructiewet concentratiegebieden][ref11] van overeenkomstige
      toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0019466#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0019466#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0019466#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0019466#Artikel14
      [ref8]: https://wetten.overheid.nl/BWBR0019466#Artikel15
      [ref9]: https://wetten.overheid.nl/BWBR0013399#Artikel15
      [ref10]: https://wetten.overheid.nl/BWBR0013399#Artikel16
      [ref11]: https://wetten.overheid.nl/BWBR0013399#Artikel28
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0019466
        artikel: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0019466
        artikel: '8'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0019466
        artikel: '11'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0019466
        artikel: '14'
        paragraaf: '4'
      - id: ref8
        bwb_id: BWBR0019466
        artikel: '15'
        paragraaf: '5'
      - id: ref9
        bwb_id: BWBR0013399
        artikel: '15'
      - id: ref10
        bwb_id: BWBR0013399
        artikel: '16'
      - id: ref11
        bwb_id: BWBR0013399
        artikel: '28'
  - number: 10.2.a
    text: |-
      onder «gemeenteraad» telkens wordt verstaan «provinciale staten van de provincie waarin het reconstructiegebied
      geheel of grotendeels is gelegen»;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
  - number: 10.2.b
    text: |-
      onder «burgemeester en wethouders» telkens wordt verstaan «gedeputeerde staten van de provincie waarin het
      reconstructiegebied geheel of grotendeels is gelegen»;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
  - number: 10.2.c
    text: |-
      onder «gedeputeerde staten» telkens wordt verstaan «Onze Minister en Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit»;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
  - number: 10.2.d
    text: |-
      de mededeling, bedoeld in [artikel 11, derde lid, ][ref1]van deze wet tevens in de Staatscourant wordt geplaatst,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel11
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '11'
        paragraaf: '4'
  - number: 10.2.e
    text: |-
      ook in het geval, bedoeld in [artikel 16, derde lid][ref1], of
      [17, zesde lid, van de Reconstructiewet concentratiegebieden][ref2], gedeputeerde staten van de provincie waarin
      het reconstructiegebied geheel of grotendeels is gelegen, een besluit als bedoeld in [artikel 9 ][ref3]van deze
      wet bekendmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '10.3'
    text: |-
      Het niet tijdig bekendmaken van een besluit omtrent goedkeuring van een besluit als bedoeld in [artikel 9][ref1]
      van deze wet of van een besluit tot verdaging van de beslissing omtrent goedkeuring heeft niet tot gevolg dat een
      besluit tot goedkeuring is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '10.4'
    text: |-
      Indien goedkeuring wordt onthouden aan het reconstructieplan dat betrekking heeft op het projectgebied, wordt
      tevens goedkeuring onthouden aan het besluit, bedoeld in [artikel 9][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '11.1'
    text: |-
      Burgemeester en wethouders melden het voornemen om een besluit als bedoeld in de [artikelen 2][ref1] en[ 3][ref2]
      te nemen aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: '11.2'
    text: 'De melding, bedoeld in het eerste lid, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
  - number: 11.2.a
    text: |-
      een omschrijving van het projectgebied en een of meerdere kadastrale kaarten waarop de begrenzing van dat gebied
      is aangegeven;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
  - number: 11.2.b
    text: |-
      het gewenste ruimtegebruik in het projectgebied, voorzover dat verband houdt met de toepassing van
      [artikel 2][ref1] of [3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: 11.2.c
    text: |-
      een beschrijving van de omstandigheden op grond waarvan wordt verwacht dat het rekening houden met milieukwaliteit
      in de ruimtelijke planvorming, het nemen van brongerelateerde maatregelen en het optimaal benutten van wettelijke
      voorschriften niet toereikend zijn om zuinig en doelmatig ruimtegebruik en optimale leefomgevingskwaliteit te
      bereiken;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
  - number: 11.2.d
    text: de milieukwaliteitsnorm of het andere wettelijke voorschrift waarvan afwijking wordt overwogen, en
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
  - number: 11.2.e
    text: |-
      een beschrijving op hoofdlijnen van de te verwachten gevolgen voor het milieu en de volksgezondheid in het
      projectgebied.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
  - number: '11.3'
    text: |-
      Van de melding, bedoeld in het eerste lid, wordt gelijktijdig mededeling gedaan door kennisgeving van de melding of
      van de inhoud ervan in een van overheidswege uitgegeven blad, een dag- of nieuwsblad of huis-aan-huisblad en langs
      elektronische weg.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
  - number: '11.4'
    text: Burgemeester en wethouders zenden een afschrift van de melding, bedoeld in het eerste lid, aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel11
  - number: '12.1'
    text: |-
      In dit artikel wordt onder bevoegd gezag verstaan: bestuursorgaan dat ten aanzien van een projectgebied
      belast is met toepassing van een milieukwaliteitsnorm of ander wettelijk voorschrift waarvan op grond van
      [artikel 2 ][ref1]of [3][ref2] afwijking wordt overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Op de voorbereiding, het nemen en de terinzagelegging van het besluit, bedoeld in de [artikelen 2][ref1] en
      [3][ref2] of [9][ref3], zijn [artikel 3.8 van de Wet ruimtelijke ordening][ref4] en de krachtens die wet gestelde
      voorschriften omtrent totstandkoming en inhoud van het bestemmingsplan van overeenkomstige toepassing met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 12.2.a
    text: |-
      burgemeester en wethouders gelijktijdig met de terinzagelegging van het ontwerpbesluit, bedoeld in de
      [artikelen 2][ref1] en [3][ref2], het bevoegd gezag in de gelegenheid stellen advies uit te brengen over het
      ontwerpbesluit, tenzij een orgaan van de gemeente als bevoegd gezag of adviseur is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: 12.2.b
    text: |-
      gedeputeerde staten gelijktijdig met de terinzagelegging van het ontwerpbesluit, bedoeld in [artikel 9][ref1], het
      bevoegd gezag in de gelegenheid stellen advies uit te brengen over het ontwerpbesluit, tenzij een orgaan van de
      provincie als bevoegd gezag of adviseur is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: 12.2.c
    text: |-
      het bevoegd gezag bij de voorbereiding van zijn advies de bestuursorganen betrekt, die ingevolge wettelijk
      voorschrift zijn aangewezen om hem terzake van advies te dienen;
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel12
  - number: 12.2.d
    text: |-
      naar voren gebrachte zienswijzen omtrent het ontwerpbesluit, bedoeld in [artikel 9][ref1], zo spoedig mogelijk doch
      in elk geval daags na afloop van de terinzagelegging van het ontwerpbesluit aan Onze Minister en Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit worden gestuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '13.1'
    text: |-
      Een besluit als bedoeld in [artikel 9][ref1] behoeft de goedkeuring van Onze Minister en Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      Indien naar voren gebrachte zienswijzen daartoe aanleiding geven, kan goedkeuring als bedoeld in het eerste lid
      worden onthouden wegens strijd met het belang van zuinig en doelmatig ruimtegebruik en met het belang van het
      bereiken van optimale leefomgevingskwaliteit.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel13
  - number: '13.3'
    text: |-
      Op een besluit van provinciale staten tot wijziging of intrekking van een besluit als bedoeld in [artikel 9][ref1]
      zijn het eerste en tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '14.1'
    text: |-
      Op een besluit van de gemeenteraad tot wijziging van een besluit als bedoeld in de
      [artikelen 2 ][ref1]en [3][ref2] zijn de [artikelen 5 tot en met 8][ref3], [11][ref4],
      [12, eerste en tweede lid, onderdelen a, c en d][ref5], [16][ref6] en [18][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0019466#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0019466#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0019466#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0019466#Artikel18
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
