      - id: ref4
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Het bestuursorgaan dat bevoegd is tot het nemen van een besluit ten aanzien van een aanvraag
      om een omgevingsvergunning voor activiteiten met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] neemt een besluit als
      bedoeld in de [artikelen 2][ref2] en [3][ref3] in acht bij:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: 15.2.a
    text: het beslissen op een aanvraag om een omgevingsvergunning, en
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel15
  - number: 15.2.b
    text: |-
      het toepassen van
      [artikel 2.31, eerste lid, onder b, en tweede lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '16.1'
    text: |-
      Burgemeester en wethouders zenden een afschrift van het besluit, bedoeld in [artikel 2][ref1], aan het
      betrokken kantoor van de Dienst voor het kadaster en de openbare registers ter inschrijving van dat besluit
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2].
      [Artikel 24, eerste lid][ref3], en [artikel 26 van Boek 3][ref4] van dat wetboek zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel26
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '26'
  - number: '16.2'
    text: |-
      Indien een besluit als bedoeld in het eerste lid ingevolge een besluit of uitspraak in rechte is vernietigd,
      ingetrokken of gewijzigd, doen burgemeester en wethouders daarvan mededeling aan het kantoor, bedoeld in het eerste
      lid. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel16
  - number: 16a.1
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel16a
  - number: 16a.2
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 16a.3
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel16a
  - number: '18'
    text: |-
      Tegen een besluit als bedoeld in de [artikelen 2][ref1] en [3][ref2] kan een belanghebbende beroep instellen bij
      de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
  - number: '19.1'
    text: |-
      Tegen een besluit omtrent goedkeuring van een besluit als bedoeld in [artikel 9][ref1] kan een belanghebbende
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '19.2'
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als
      één besluit aangemerkt een besluit als bedoeld in [artikel 9][ref2] en een reconstructieplan of een gewijzigd
      reconstructieplan. [Artikel 29, tweede lid, van de Reconstructiewet concentratiegebieden][ref3] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel29
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013399
        artikel: '29'
  - number: '19.3'
    text: |-
      Het beroep tegen een besluit ter uitvoering van een besluit als bedoeld in [artikel 9][ref1] kan geen grond vinden
      in bedenkingen tegen het laatstbedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '24.1'
    text: |-
      De [Experimentenwet Stad en Milieu][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010041
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010041
  - number: '24.2'
    text: |-
      De [Experimentenwet Stad en Milieu][ref1] blijft van toepassing op voor 1 januari 2004 genomen besluiten
      als bedoeld in [artikel 3, eerste lid, van die wet][ref2], met dien verstande dat voor de toepassing van
      [artikel 14, eerste lid, eerste volzin en derde lid, van die wet][ref3] gedeputeerde staten in de plaats treden van
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0010041#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010041#Artikel14
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0010041
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0010041
        artikel: '14'
  - number: '25.1'
    text: Deze wet vervalt met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel25
  - number: '25.2'
    text: |-
      Deze wet blijft van toepassing op besluiten als bedoeld in de [artikelen 2][ref1], [3 ][ref2]en [9][ref3] die voor
      het tijdstip waarop deze wet vervalt, genomen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019466#Artikel9
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019466
        artikel: '9'
        paragraaf: '3'
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Interimwet stad-en-milieubenadering.'
    url: https://wetten.overheid.nl/BWBR0019466/2010-10-01#Artikel26
