  - number: '17'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt het beheer over collectieve
      pensioenfondsen als uitoefening van het levensverzekeringsbedrijf beschouwd indien het wordt gevoerd door
      verzekeraars die ook overigens het levensverzekeringsbedrijf uitoefenen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel17
  - number: '18'
    text: |-
      1 De Pensioen- & Verzekeringskamer beslist voor de toepassing van deze wet of een handeling of een samenstel
      van handelingen al dan niet uitoefening van het schadeverzekeringsbedrijf, het levensverzekeringsbedrijf of een
      andersoortig bedrijf vormt en of een handeling of een samenstel van handelingen al dan niet uitoefening van het
      verzekeringsbedrijf vanuit een vestiging in Nederland vormt. Zij beslist tevens tot welke branche of branches een
      overeenkomst van verzekering behoort.

      2 De Pensioen- & Verzekeringskamer beslist ambtshalve dan wel op aanvraag van:

      a. hetzij degene die de handeling of het samenstel van handelingen verricht of voornemens is te verrichten
      onderscheidenlijk de verzekeraar die de overeenkomst van verzekering sluit of voornemens is te sluiten;

      b. hetzij een representatieve organisatie van verzekeraars als bedoeld in [artikel 187, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel187
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '187'
        hoofdstuk: X
  - number: '19'
    text: |-
      Ter uitvoering van een tussen de Unie en een staat, die niet een lid-staat is, gesloten overeenkomst betreffende de
      toegang tot en de uitoefening van het verzekeringsbedrijf, kan bij algemene maatregel van bestuur en zonodig onder
      het bij of krachtens algemene maatregel van bestuur stellen van nadere regels worden bepaald dat en in hoeverre
      voor de toepassing van het bij of krachtens deze wet bepaalde die staat wordt gelijkgesteld met een lid-staat.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel19
  - number: '20'
    text: |-
      Deze wet is onder bij of krachtens algemene maatregel van bestuur te stellen voorwaarden geheel of gedeeltelijk
      niet van toepassing op de volgende categorieën schadeverzekeraars:

      a. onderlinge waarborgmaatschappijen van beperkte omvang met zetel in Nederland en ondernemingen of instellingen op
      onderlinge grondslag van beperkte omvang met zetel buiten Nederland;

      b. instellingen die een publiekrechtelijke ziektekostenregeling uitvoeren;

      c. verzekeraars met zetel in Nederland die zich beperken tot het sluiten en afwikkelen van overeenkomsten van
      exportkredietverzekering voor rekening of met garantie van de staat.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel20
  - number: '22'
    text: |-
      De verzekeraars, verenigd onder de naam Lloyd's, te Londen, Verenigd Koninkrijk, worden voor de toepassing van deze
      wet te zamen als een verzekeraar beschouwd.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel22
  - number: '23'
    text: |-
      Dit hoofdstuk is niet van toepassing op verzekeraars met zetel buiten Nederland voor wat betreft het verrichten van
      diensten naar Nederland.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel23
  - number: '24'
    text: |-
      1 Het is verboden het directe verzekeringsbedrijf uit te oefenen zonder een vergunning van de Pensioen- &
      Verzekeringskamer of dit bedrijf uit te oefenen in een branche waarvoor de Verzekeringskamer geen vergunning heeft
      verleend.

      2 Het eerste lid is niet van toepassing op een verzekeraar met zetel in een andere lid-staat die bevoegd is in
      Nederland een bijkantoor te hebben.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel24
  - number: '25'
    text: |-
      1 Bij de aanvraag van een vergunning legt de aanvrager aan de Pensioen- & Verzekeringskamer een programma van
      werkzaamheden over.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot het programma van werkzaamheden, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel25
  - number: '26'
    text: |-
      1 Indien voor de eerste maal een vergunning wordt aangevraagd, legt de aanvrager tevens aan de Pensioen- &
      Verzekeringskamer over:

      a. een authentiek afschrift van de akte van oprichting, een exemplaar van zijn statuten alsmede een lijst met namen
      en adressen van zijn bestuurders en commissarissen;

      b. een lijst met namen en adressen van de personen die het dagelijks beleid bepalen van de groep waartoe de
      aanvrager behoort en tevens uit dien hoofde het dagelijks beleid van de aanvrager mede bepalen;

      c. een lijst met namen en adressen van de personen die het beleid bepalen of mede bepalen van de groep waartoe de
      aanvrager behoort en tevens uit dien hoofde het beleid van de aanvrager mede bepalen;

      d. gegevens over de identiteit van degenen die een gekwalificeerde deelneming houden in de onderneming van de
      aanvrager alsmede over de omvang van die deelneming;

      e. gegevens over de formele en de feitelijke zeggenschapsstructuur van de groep waartoe de aanvrager behoort, en

      f. de voorgenomen maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering,
      met uitzondering van de maatregelen ter naleving van de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].

      2 Indien de aanvraag betrekking heeft op een vergunning voor de branche Aansprakelijkheid motorrijtuigen, legt de
      aanvrager voorts aan de Pensioen- & Verzekeringskamer over:

      a. een schriftelijk bewijs waaruit blijkt dat de aanvrager is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2];

      b. een schriftelijk bewijs waaruit blijkt dat de aanvrager zich heeft gemeld bij het Waarborgfonds Motorverkeer
      teneinde te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24, eerste lid][ref3], en
      [24][ref4]; en

      c. een opgave van de naam en het adres van de schaderegelaar, bedoeld in
      [artikel 52, eerste lid, onderdeel e][ref5], die hij in iedere andere lid-staat dan Nederland heeft aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
      [ref5]: https://wetten.overheid.nl/BWBR0006509#Artikel52
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel26
    references:
