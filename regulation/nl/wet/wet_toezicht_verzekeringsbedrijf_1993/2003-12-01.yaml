  - number: 69h
    text: |-
      1 Indien verzekeraars die in verschillende lid-staten zijn gevestigd, verbonden zijn of een gemeenschappelijke
      deelnemende onderneming hebben, verstrekt de Pensioen- & Verzekeringskamer de toezichthoudende autoriteiten van
      iedere andere betrokken lid-staat op hun verzoek alle informatie die uitoefening van het toezicht in het kader
      van deze paragraaf mogelijk maakt of kan vergemakkelijken en stelt zij eigener beweging de andere betrokken
      toezichthoudende autoriteiten in kennis van alle informatie die essentieel lijkt.

      2 Indien een verzekeraar en een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht kredietwezen 1992][ref1] of een effecteninstelling
      als bedoeld in [artikel 1, onderdeel d, van de Wet toezicht effectenverkeer 1995][ref2] verbonden zijn of een
      gemeenschappelijke deelnemende onderneming hebben, werkt de Pensioen- & Verzekeringskamer nauw samen met de
      autoriteiten die van overheidswege belast zijn met het toezicht op die andere ondernemingen. Onverminderd hun
      respectieve bevoegdheden verstrekken deze autoriteiten elkaar alle informatie die de vervulling van hun taak kan
      vergemakkelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel69h
