  - number: '196'
    text: |-
      Ten aanzien van overeenkomsten van verzekering die met een onderlinge waarborgmaatschappij zijn gesloten voor 26
      juli 1976 en waaruit de rechten en verplichtingen na het in werking treden van deze wet worden overgedragen, geldt
      artikel 62, aanhef en onderdeel *a*, van Boek 2 van het Burgerlijk Wetboek van de overdracht af, zulks in afwijking
      van [artikel 47, tweede lid, van de Overgangswet][ref1] voor het nieuwe Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel47
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '47'
  - number: '197'
    text: |-
      De artikelen 85, 86, 86*a*, 86*b* 88 en 89 van Boek 2 van het Burgerlijk Wetboek zijn vanaf 1 januari 1986 van
      overeenkomstige toepassing op een vruchtgebruik van en een pandrecht op aandelen in het waarborgkapitaal van een
      onderlinge waarborgmaatschappij, gevestigd voor die datum.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel197
  - number: '198'
    text: |-
      Ten aanzien van de kosten, verbonden aan de uitvoering van de Wet toezicht verzekeringsbedrijf, voor zover deze
      op het tijdstip van inwerkingtreding van deze wet nog niet zijn verhaald, blijft het bepaalde bij of krachtens
      [artikel 85][ref1] van de Wet toezicht verzekeringsbedrijf van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel85
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '85'
        hoofdstuk: III
        afdeling: '3'
  - number: '199'
    text: |-
      Ingeval voor het tijdstip van inwerkingtreding van deze wet beroep is ingesteld tegen een beslissing, genomen
      ingevolge de Wet toezicht verzekeringsbedrijf, wordt de zaak geheel afgedaan met toepassing van de voorschriften
      die voor dat tijdstip golden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel199
  - number: '200'
    text: |-
      Ingeval voor het tijdstip van inwerkingtreding van deze wet de faillietverklaring van een verzekeraar is
      uitgesproken of een machtiging als bedoeld in [artikel 66][ref1] van de Wet toezicht verzekeringsbedrijf is
      verleend, blijven op het faillissement en op de vereffening of de overdracht van verbintenissen de bepalingen van
      toepassing die voor dat tijdstip golden.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel66
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '66'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '201'
    text: |-
      Ingeval voor 1 juni 1987 de faillietverklaring is uitgesproken van een levensverzekeraar die in het bezit was van
      een verklaring als bedoeld in artikel 18, eerste lid, van de Wet op het Levensverzekeringbedrijf, *Stb.* 1922, 716,
      blijven op het faillissement de bepalingen van toepassing die voor die datum golden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel201
  - number: '202'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald onder welke beperkingen of voorschriften
      de bestaande voorzieningen die getroffen zijn voor 4 december 1985 en die in strijd zijn met
      [artikel 13, vierde lid, aanhef en onderdeel ][ref1], kunnen worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel13
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '13'
        hoofdstuk: I
  - number: '203'
    text: |-
      Indien een andere lid-staat dan Nederland de [richtlijn nr. 92/49/EEG](31992L0049) van de Raad van de Europese
      Gemeenschappen van 18 juni 1992 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende
      het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche, en houdende wijziging
      van de [Richtlijnen 73/239/EEG](31973L0239) en [88/357/EEG](31988L0357) (*PbEG* L 228) of de [richtlijn nr.
      92/96/EEG](31992L0096) van de Raad van de Europese Gemeenschappen van 10 november 1992 tot coördinatie van de
      wettelijke en bestuursrechtelijke bepalingen betreffende het directe levensverzekeringsbedrijf en tot wijziging
      van de [Richtlijnen 79/267/EEG](31979L0267) en [90/619/EEG](31990L0619) (*PbEG* L 360) niet of onvolledig heeft
      uitgevoerd, kan Onze Minister bepalen dat en in hoeverre de Pensioen- & Verzekeringskamer op verzekeraars met zetel
      in die lid-staat deze wet of de Wet toezicht verzekeringsbedrijf toepast, zoals laatstgenoemde wet gold voor de
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel203
  - number: '204'
    text: |-
      Een verzekeraar die op het tijdstip van inwerkingtreding van deze wet ingevolge de Wet toezicht verzekeringsbedrijf
      verplicht is tot afwikkeling van het betrokken gedeelte van zijn bedrijf is gedurende de afwikkeling onderworpen
      aan de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel204
  - number: '205'
    text: |-
      Een verzekeraar met zetel in een andere lid-staat dan Nederland die op het tijdstip van inwerkingtreding van deze
      wet het verzekeringsbedrijf vanuit een bijkantoor in Nederland uitoefent, geeft binnen een maand na dit tijdstip
      aan de Verzekeringskamer het adres van het bijkantoor op waaraan mededelingen aan de vertegenwoordiger kunnen
      worden gestuurd.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel205
  - number: '231'
    text: |-
      De Wet van 18 december 1986, *Stb.* 637, tot wijziging van de Wet toezicht schadeverzekeringsbedrijf wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel231
  - number: '232'
    text: |-
      De Wet van 23 februari 1989, *Stb.* 52, tot aanvulling van de Wet toezicht verzekeringsbedrijf met bepalingen
      omtrent hulpverlening op reis wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel232
  - number: '233'
    text: |-
      De Wet van 23 mei 1990, *Stb.* 285, tot aanvulling van de Wet toezicht verzekeringsbedrijf met bepalingen omtrent
      rechtsbijstandverzekering wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel233
  - number: '234'
    text: |-
      De Wet van 20 juni 1990, *Stb.* 337, tot wijziging van de Wet toezicht verzekeringsbedrijf in verband met de tweede
      richtlijn schadeverzekering wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel234
  - number: '235'
    text: De Wet van 27 juni 1990, *Stb.* 341, tot wijziging van de Wet toezicht verzekeringsbedrijf wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel235
  - number: '236'
    text: |-
      De Wet van 15 april 1992, *Stb.* 203, tot wijziging van de Wet toezicht verzekeringsbedrijf en de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] in verband met de [richtlijn 90/618/EEG](31990L0618) van
      de Raad van de Europese Gemeenschappen van 8 november 1990 wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002415
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0002415
  - number: '237'
    text: |-
      De Wet van 1 juli 1992, *Stb.* 441, tot wijziging van de Wet toezicht verzekeringsbedrijf in verband met de tweede
      richtlijn levensverzekering wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel237
  - number: '238'
    text: |-
      De Wet van 23 december 1992, *Stb.* 719, tot wijziging van de Wet toezicht verzekeringsbedrijf in verband met
      de richtlijn inzake de toepassing van de overeenkomst tussen de EEG en Zwitserland betreffende het directe
      schadeverzekeringsbedrijf wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel238
  - number: '239'
    text: De Wet toezicht verzekeringsbedrijf wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel239
  - number: '240'
    text: Deze wet treedt in werking met ingang van 1 juli 1994.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel240
  - number: '241'
    text: 'Deze wet wordt aangehaald als: Wet toezicht verzekeringsbedrijf 1993.'
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel241
