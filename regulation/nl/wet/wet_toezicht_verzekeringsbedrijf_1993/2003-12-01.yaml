  - number: 165b
    text: |-
      In geval van overdracht van rechten en verplichtingen ingevolge de machtiging, bedoeld in
      [artikel 156, derde lid][ref1], of de bijzondere machtiging, bedoeld in [artikel 165, eerste lid][ref2], draagt de
      verzekeraar de waarden over die dienen tot dekking van de technische voorzieningen voor zover deze voorzieningen
      betrekking hebben op de verplichtingen die worden overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel165
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel165b
