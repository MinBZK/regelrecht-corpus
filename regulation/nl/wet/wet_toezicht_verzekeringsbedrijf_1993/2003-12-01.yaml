        artikel: '74'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: 188c
        hoofdstuk: XI_B
  - number: 188k
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.

      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188k
  - number: 188l
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188l
  - number: 188m
    text: |-
      1 Met het oog op de belangen van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen
      betrokken zijn of zullen worden bij overeenkomsten van verzekering, gesloten of te sluiten met de verzekeraar,
      kunnen Onze Minister en de Pensioen- & Verzekeringskamer, onverminderd [artikel 182, eerste en tweede lid][ref1],
      het feit ter zake waarvan de last onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift,
      alsmede de naam, het adres en de woonplaats van degene aan wie de last onder dwangsom of de bestuurlijke boete is
      opgelegd, ter openbare kennis brengen.

      2 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel182
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188m
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '182'
        hoofdstuk: X
  - number: 188n
    text: |-
      De Pensioen- & Verzekeringskamer kan, in afwijking van [artikel 182][ref1], teneinde de naleving van deze wet te
      bevorderen ter openbare kennis brengen:

        - haar weigering om een aangevraagde vergunning, ontheffing of verklaring van geen bezwaar te verlenen, wanneer
      deze weigering niet meer in beroep kan worden getroffen en de aanvrager handelt als was hem de vergunning,
      ontheffing of verklaring van geen bezwaar verleend;
        - het feit dat een verzekeraar het directe verzekeringsbedrijf uitoefent zonder in het bezit te zijn van de
      ingevolge [artikel 24, eerste lid][ref2], vereiste vergunning;
        - het feit dat een verzekeraar met zetel in een andere lid-staat dan Nederland een bijkantoor in Nederland heeft
      zonder te hebben voldaan aan de procedure, bedoeld in [artikel 37][ref3];
        - het feit dat een verzekeraar met zetel in een andere lid-staat dan Nederland diensten verricht naar Nederland
      zonder te hebben voldaan aan de procedure, bedoeld in [artikel 111][ref4] onderscheidenlijk [113][ref5];
        - het feit dat een verzekeraar met zetel buiten de Unie diensten verricht naar Nederland zonder voldaan te hebben
      aan de procedure, bedoeld in [artikel 116][ref6] onderscheidenlijk [118][ref7];
        - het feit dat een schadeverzekeraar diensten naar Nederland verricht in de branche Aansprakelijkheid
      motorrijtuigen zonder te hebben voldaan aan de vereisten, bedoeld in [artikel 109][ref8];
        - het feit dat een verzekeraar zich niet houdt aan de voorschriften of het verbod, bedoeld in
      [artikel 141, tweede lid][ref9], of [artikel 147, tweede lid][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel182
