  - number: '27'
    text: |-
      1 Een vergunning wordt voor een branche verleend.

      2 In afwijking van [artikel 24, eerste lid][ref1], mogen in de uitoefening van het schadeverzekeringsbedrijf, naast
      de risico’s die behoren tot de branche waarvoor de vergunning is verleend, tevens risico’s worden verzekerd die
      behoren tot een of meer andere branches, mits deze risico’s naar het oordeel van de Pensioen- & Verzekeringskamer
      als bijkomende risico’s kunnen worden beschouwd, omdat zij:

      a. samenhangen met het hoofdrisico dat behoort tot de branche waarvoor de vergunning is verleend;

      b. betrekking hebben op het belang of gevaarsobject dat is verzekerd tegen het hoofdrisico; en

      c. worden verzekerd bij dezelfde overeenkomst als het hoofdrisico.

      3 De risico’s van de branches Krediet en Borgtocht mogen evenwel niet als bijkomende risico’s met andere branches
      worden gecombineerd.

      4 De risico’s van de branche Rechtsbijstand mogen uitsluitend als bijkomende risico’s worden gecombineerd met de
      branche Hulpverlening en met branches waarbij risico’s worden verzekerd die verband houden met het gebruik van
      zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
        hoofdstuk: II
        afdeling: '1'
  - number: '28'
    text: |-
      1 Verzekeraars met zetel in Nederland dienen de rechtsvorm van naamloze vennootschap of onderlinge
      waarborgmaatschappij te bezitten. Zij kunnen eveneens de rechtsvorm aannemen van een Europese vennootschap zodra
      deze bestaat.

      2 Het dagelijks beleid van een verzekeraar wordt bepaald door ten minste twee personen.

      3 Een verzekeraar die de rechtsvorm van naamloze vennootschap of Europese vennootschap bezit, heeft ten minste drie
      commissarissen als bedoeld in artikel 140 van Boek 2 van het Burgerlijk Wetboek.

      4 De Pensioen- & Verzekeringskamer kan aan een verzekeraar van het bepaalde in het tweede of derde lid ontheffing
      verlenen en aan deze ontheffing beperkingen stellen of voorschriften verbinden, onverminderd het bepaalde in
      artikel 158 van Boek 2 van het Burgerlijk Wetboek. Een ontheffing kan worden ingetrokken.

      5 Een verzekeraar behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige
      mate ondoorzichtig is dat deze, naar het oordeel van de Pensioen- & Verzekeringskamer, een belemmering vormt voor
      het adequaat uitoefenen van toezicht op de verzekeraar.

      6 Indien een verzekeraar in een groep is verbonden met een natuurlijke of rechtspersoon op wie, onderscheidenlijk
      waarop, het recht van een staat die geen lid is van de Unie van toepassing is, mag het recht van die staat, naar
      het oordeel van de Pensioen- & Verzekeringskamer, niet een belemmering vormen voor het adequaat uitoefenen van
      toezicht op de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel28
  - number: '29'
    text: |-
      1 De deskundigheid van de personen die het dagelijks beleid van een verzekeraar bepalen, dient naar het oordeel van
      de Pensioen- & Verzekeringskamer voldoende te zijn in verband met de uitoefening van het verzekeringsbedrijf.

      2 De voornemens, de handelingen of de antecedenten van de personen die het beleid van de verzekeraar bepalen of
      mede bepalen, mogen de Pensioen- & Verzekeringskamer geen aanleiding geven tot het oordeel dat, met het oog op de
      belangen van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen betrokken zijn of zullen
      worden bij overeenkomsten van verzekering, gesloten of te sluiten met de verzekeraar, de betrouwbaarheid van deze
      personen niet buiten twijfel staat.

      3 Het eerste lid is van overeenkomstige toepassing op de personen die het dagelijks beleid bepalen van de groep
      waartoe de verzekeraar behoort, voor zover zij tevens uit dien hoofde het dagelijks beleid van de verzekeraar mede
      bepalen.

      4 Het tweede lid is van overeenkomstige toepassing op de personen die het beleid bepalen of mede bepalen van de
      groep waartoe de verzekeraar behoort en tevens uit dien hoofde het beleid van de verzekeraar mede bepalen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel29
  - number: 29a
    text: |-
      De personen die het dagelijks beleid van een verzekeraar bepalen, verrichten hun werkzaamheden in verband daarmee
      vanuit Nederland.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel29a
  - number: '30'
    text: |-
      De geschiktheid van de houders van een gekwalificeerde deelneming in de onderneming van de aanvrager dient
      naar het oordeel van de Pensioen- & Verzekeringskamer voldoende te zijn met het oog op een gezonde, prudente
      en integere bedrijfsvoering van de verzekeraar. Onder integere bedrijfsvoering wordt in dit artikel verstaan de
      bedrijfsvoering met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: '31'
    text: |-
      De Pensioen- & Verzekeringskamer stelt de Commissie van de Europese Gemeenschappen in kennis van de verlening van
      een vergunning aan een dochtermaatschappij met zetel in Nederland van een onderneming met zetel buiten de Unie,
      onder opgave van de formele zeggenschapsstructuur van de groep waartoe de dochtermaatschappij behoort.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel31
  - number: '32'
    text: |-
      De aanvrager van een vergunning dient te beschikken over:

      a. het minimum bedrag van het garantiefonds dat krachtens [artikel 68, tweede lid][ref1], voor de betrokken branche
      of branches geldt dan wel over de solvabiliteitsmarge die krachtens [artikel 68, eerste of derde lid][ref2], is
      vereist op grond van de reeds door hem uitgeoefende branches, indien deze solvabiliteitsmarge hoger is dan bedoeld
      minimum bedrag;

      b. financiële middelen tot dekking van de te verwachten kosten voor de inrichting van de administratie en van het
      produktienet.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '68'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '33'
    text: |-
      1 Een vergunning voor de branche Permanent health insurance wordt slechts verleend aan een verzekeraar die zich
      beperkt tot deze branche.

      2 Een vergunning voor de branche Kapitalisatieverrichtingen of voor de branche Beheer over collectieve
      pensioenfondsen wordt slechts verleend aan een verzekeraar die in het bezit is van een vergunning voor de branche
      Levensverzekering algemeen, die de werkzaamheden in de branche Kapitalisatieverrichtingen onderscheidenlijk in de
      branche Beheer over collectieve pensioenfondsen in zodanige mate uitoefent dat zij voor zijn gehele bedrijf van
      ondergeschikte betekenis zijn en die, indien het betreft de branche Beheer over collectieve pensioenfondsen, voorts
      voldoet aan de door de Pensioen- & Verzekeringskamer te zijnen aanzien gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel33
  - number: '34'
    text: |-
      Indien de stukken die bij de aanvraag van een vergunning zijn overgelegd, de Pensioen- & Verzekeringskamer
      aanleiding geven tot het maken van opmerkingen, stelt zij de aanvrager in de gelegenheid op deze opmerkingen binnen
      een door haar te stellen termijn te antwoorden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel34
  - number: '35'
    text: |-
      De Pensioen- & Verzekeringskamer verleent een vergunning aan ieder die te haren genoegen heeft aangetoond dat hij
      aan de bij of krachtens deze wet gestelde eisen voor het verkrijgen van de vergunning voldoet, behoudens voor zover
      [artikel 179, vierde lid, aanhef en onderdeel ][ref1], toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel179
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '179'
        hoofdstuk: X
  - number: '36'
    text: |-
      1 De Pensioen- & Verzekeringskamer beslist binnen acht weken. Indien toepassing is gegeven aan [artikel 34][ref1],
      begint de in de eerste volzin genoemde termijn op het tijdstip waarop de inlichtingen door de Pensioen- &
      Verzekeringskamer zijn ontvangen.

      2 Met betrekking tot een aanvrager die dochtermaatschappij is van een onderneming met zetel buiten de Unie is
      het eerste lid niet van toepassing indien ingevolge [artikel 179, vierde lid, aanhef en onderdeel ][ref2], de
      beslissing op de aanvraag is opgeschort.

      3 De Pensioen- & Verzekeringskamer doet van de verlening van een vergunning mededeling in de *Staatscourant*.

      4 Ten aanzien van een opvanginstelling wordt de mededeling, bedoeld in het derde lid, gedaan gelijktijdig met de
      portefeuille-overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel179
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel36
