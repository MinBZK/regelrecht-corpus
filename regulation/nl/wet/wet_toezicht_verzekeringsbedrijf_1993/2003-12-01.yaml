        artikel: 69c
        hoofdstuk: III
        paragraaf: 3a
        afdeling: '2'
  - number: 69j
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 69c, eerste lid][ref1], berekent een aangepaste solvabiliteit
      overeenkomstig bij algemene maatregel van bestuur te stellen regels.

      2 Alle verbonden ondernemingen, alle deelnemende ondernemingen en alle met een deelnemende onderneming verbonden
      ondernemingen worden in de in het eerste lid bedoelde berekening betrokken.

      3 Indien uit de in het eerste lid bedoelde berekening blijkt dat de aangepaste solvabiliteit negatief is, neemt de
      Pensioen- & Verzekeringskamer jegens de verzekeraar passende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel69j
