  - number: '168'
    text: |-
      Voor de toepassing van de [artikelen 194][ref1], [342][ref2] en [343 van het Wetboek van Strafrecht][ref3] wordt
      met faillissement gelijkgesteld de rechtstoestand waarin een verzekeraar verkeert zolang te zijnen aanzien de
      noodregeling als bedoeld in [artikel 156][ref4] van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel194
