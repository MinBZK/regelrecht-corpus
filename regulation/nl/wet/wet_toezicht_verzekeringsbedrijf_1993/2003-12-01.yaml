  - number: 163a
    text: |-
      1 De bewindvoerders kunnen uitkeringen doen op vorderingen die niet voortvloeien uit handelingen met de verzekeraar
      na het uitspreken van de noodregeling verricht, voor zover dit gelet op de liquiditeitspositie van de verzekeraar
      verantwoord is te achten en mits is voldaan aan de volgende leden.

      2 De bewindvoerders maken een staat op waaruit blijken de aard en het bedrag van de baten en schulden van
      de verzekeraar, de namen en woonplaatsen van de schuldeisers alsmede het bedrag der vorderingen van iedere
      schuldeiser. Een door de bewindvoerders gewaarmerkt afschrift van deze staat wordt ter kosteloze inzage van een
      ieder ter griffie van de rechtbank neergelegd.

      3 Op verzoek van de bewindvoerders bepaalt de rechter-commissaris de dag waarop uiterlijk de vorderingen
      moeten worden ingediend, en voorts dag, uur en plaats, waarop de verificatievergadering zal worden gehouden.
      De bewindvoerders geven van deze beschikkingen onmiddellijk aan alle bekende schuldeisers schriftelijk kennis
      en doen daarvan aankondiging in een of meer door de rechter-commissaris aan te wijzen dagbladen. De [artikelen
      110 tot en met 113 van de Faillissementswet](onbekend) zijn van overeenkomstige toepassing, met dien verstande
      dat hetgeen is bepaald met betrekking tot de curator onderscheidenlijk de gefailleerde van toepassing is op de
      bewindvoerders onderscheidenlijk de verzekeraar dan wel het bijkantoor. Artikel 169, vijfde lid, onderdeel e, is
      van overeenkomstige toepassing.

      4 Een afschrift van de lijst van voorlopig erkende schuldvorderingen en van de lijst van betwiste vorderingen wordt
      door de bewindvoerders ter griffie van de rechtbank neergelegd om aldaar gedurende veertien dagen voorafgaande
      aan de verificatievergadering kosteloos voor een ieder ter inzage te liggen. De bewindvoerders geven alle bekende
      schuldeisers voor het begin van deze periode schriftelijk van de nederlegging bericht waarbij zij een nadere
      oproeping tot de verificatievergadering voegen. Voorts doen de bewindvoerders van de nederlegging mededeling in een
      of meer door de rechter-commissaris aan te wijzen dagbladen.

      5 Met betrekking tot de verificatie zijn de [artikelen 59](onbekend), [119 tot en met 122](onbekend), [123 tot en
      met 127](onbekend), [129](onbekend), [132 tot en met 137](onbekend), [260, eerste lid](onbekend), [261](onbekend)
      en [262, eerste en derde lid, van de Faillissementswet](onbekend) van overeenkomstige toepassing. Daarbij zijn
      de bepalingen met betrekking tot de curator onderscheidenlijk de gefailleerde van toepassing op de bewindvoerders
      onderscheidenlijk de verzekeraar. In afwijking van de in [artikel 127, eerste lid, van de Faillissementswet]
      (onbekend) genoemde termijn geldt de termijn die ingevolge het derde lid van dit artikel voor de indiening van
      vorderingen is bepaald. De vorderingen welke opeisbaar worden op of na de datum van de beschikking, bedoeld
      in artikel 156, eerste lid, worden geverifieerd voor de waarde welke zij hebben op het tijdstip waarop deze
      vorderingen opeisbaar worden, met dien verstande dat dit ten aanzien van vorderingen welke vallen onder de werking
      van artikel 165, eerste lid, slechts geldt voor zover deze bepaling niet reeds op deze vorderingen is toegepast.

      6 De bestuurders van de verzekeraar dan wel de vertegenwoordigers van het bijkantoor wonen de
      verificatievergadering bij teneinde aldaar alle inlichtingen over de oorzaken van de in artikel 156, eerste lid,
      bedoelde toestand en de staat van de boedel te geven die hen door de rechter-commissaris worden gevraagd. De
      schuldeisers kunnen de rechter-commissaris verzoeken omtrent bepaalde door hen op te geven punten inlichtingen aan
      de bestuurders dan wel aan de vertegenwoordigers van het bijkantoor te vragen. De vragen aan de bestuurders dan
      wel aan de vertegenwoordigers van het bijkantoor gesteld en de door hen gegeven antwoorden worden in het proces-
      verbaal opgetekend. In afwijking van het bepaalde in [artikel 121, vierde lid, van de Faillissementswet](onbekend)
      levert het proces-verbaal van de verificatievergadering ten aanzien van de verbintenissen van de verzekeraar welke
      ingevolge artikel 165, eerste lid, worden overgedragen slechts kracht van gewijsde op voor zover de desbetreffende
      bedingen niet worden gewijzigd.

      7 Na de verificatie van de schuldvorderingen maken de bewindvoerders een uitdelingslijst op. Zij onderwerpen die
      aan de goedkeuring van de rechter-commissaris. De lijst houdt in een staat van ontvangsten en uitgaven, daaronder
      begrepen het loon van de bewindvoerders, de namen van de schuldeisers, en voorts het geverifieerde bedrag van
      ieders vordering en de daarop te ontvangen uitkering. De [artikelen 180, tweede lid](onbekend), [181](onbekend)
      en [182, eerste lid, van de Faillissementswet ](onbekend)zijn van overeenkomstige toepassing. Onverminderd het
      bepaalde in het tiende lid is [artikel 233 van die wet](onbekend) eveneens van overeenkomstige toepassing.

      8 Bij het opmaken van de uitdelingslijst wordt met betrekking tot de vorderingen die zijn betwist of waarvan de
      voorrang is betwist of die voorwaardelijk zijn toegelaten een bedrag aan liquide middelen afgezonderd tot tenminste
      het beloop van het totaal van de bedragen die bij de toepassing van dit artikel op deze vorderingen zullen kunnen
      worden uitgekeerd, dan wel wordt deze uitkering op andere wijze zeker gesteld.

      9 De door de rechter-commissaris goedgekeurde uitdelingslijst wordt door de bewindvoerders ter griffie van de
      rechtbank neergelegd om aldaar gedurende veertien dagen kosteloos voor de schuldeisers ter inzage te liggen.
      De bewindvoerders doen van de nederlegging mededeling in een of meer door de rechter-commissaris aan te wijzen
      dagbladen. Voorts geven de bewindvoerders aan ieder der erkende en voorwaardelijk toegelaten schuldeisers
      schriftelijk van de nederlegging kennis, onder vermelding van het voor hem uitgetrokken bedrag. De [artikelen
      184 tot en met 186](onbekend), [187, eerste, tweede en derde lid](onbekend), [189](onbekend) en [191 van de
      Faillissementswet](onbekend) zijn van overeenkomstige toepassing, met dien verstande dat hetgeen daarin is bepaald
      met betrekking tot de curator van toepassing is op de bewindvoerders en dat in afwijking van de in [artikel 184
      van de Faillissementswet](onbekend) bedoelde termijn geldt de in de eerste zin van dit lid genoemde termijn. Indien
      ten gevolge van het krachtens [artikel 184](onbekend) dan wel [artikel 186 van de Faillissementswet](onbekend)
      gedane verzet een verificatiegeschil ontstaat, wordt ten aanzien van de vorderingen waarop dit verzet betrekking
      heeft, het achtste lid van dit artikel overeenkomstig toegepast, en kan vervolgens, nadat voor zoveel nodig tevens
      dienovereenkomstig wijziging van de overige in de ter inzage neergelegde lijst opgenomen uitkeringsbedragen heeft
      plaats gehad, met inachtneming van het overigens in dit artikel bepaalde, tot uitkering worden overgegaan. Indien
      het gedane verzet niet tot een verificatiegeschil leidt, kan met inachtneming van het bij de beschikking op het
      verzet bepaalde tot uitkering worden overgegaan zodra die beschikking in kracht van gewijsde is gegaan.

      10 In afwijking van de laatste zin van het zevende lid kan op geverifieerde vorderingen welke opeisbaar worden op
      of na de datum van de beschikking als bedoeld in artikel 156, eerste lid, voor zover artikel 165, eerste lid, niet
      reeds op deze vorderingen werd toegepast, een uitkering eerst worden gedaan zodra deze vorderingen opeisbaar zijn
      geworden. Tot dat tijdstip wordt een bedrag aan liquide middelen afgezonderd tot ten minste het beloop van het
      totaal van de bedragen die bij de toepassing van dit artikel op deze vorderingen zullen kunnen worden uitgekeerd,
      dan wel wordt deze uitkering op andere wijze zeker gesteld.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel163a
  - number: '164'
    text: |-
      1 Met betrekking tot verrekening en schuldoverneming vinden de [artikelen 234][ref1] en
      [235 van de Faillissementswet][ref2] overeenkomstige toepassing, met dien verstande dat de schuldenaar van de
      verzekeraar die zijn schuld wil verrekenen met een vordering aan order of toonder, gehouden is te bewijzen dat hij
      het papier reeds op het ogenblik der uitspraak, waarbij het verzoek werd toegewezen, te goeder trouw had verkregen.

      2 Met betrekking tot wederkerige overeenkomsten in het algemeen en tot termijnzaken, overeenkomsten van huurkoop,
      huurovereenkomsten en arbeidsovereenkomsten in het bijzonder, waarbij de verzekeraar ten aanzien waarvan de
      noodregeling is uitgesproken, partij is, vinden de [artikelen 236][ref3], [237][ref4], [237][ref5], [238][ref6] en
      [239 van de Faillissementswet][ref7] overeenkomstige toepassing.

      3 De bewindvoerders kunnen bestuurders, commissarissen en de vertegenwoordiger namens de verzekeraar ontslaan. Bij
      dit ontslag worden de overeengekomen of wettelijke termijnen in acht genomen, met dien verstande echter dat een
      termijn van zes weken in elk geval voldoende is.

      4 Met betrekking tot de voldoening van een schuld aan de verzekeraar nadat de noodregeling is uitgesproken, vindt
      [artikel 240 van de Faillissementswet][ref8] overeenkomstige toepassing.


