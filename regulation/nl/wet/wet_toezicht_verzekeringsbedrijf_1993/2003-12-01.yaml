        bwb_id: BWBR0007477
        artikel: '11'
  - number: '153'
    text: |-
      1 Indien de Pensioen- & Verzekeringskamer een vergunning intrekt op grond van [artikel 148, onderdelen ][ref1],
      beperkt zij de uitoefening van de beschikkingsbevoegdheid door de verzekeraar over zijn waarden of verbiedt zij
      hem om anders dan met haar schriftelijke machtiging over deze waarden te beschikken, voor zover zulks niet reeds
      is geschied.

      2 Bij de publikatie, bedoeld in [artikel 150, tweede lid][ref2], wordt tevens mededeling gedaan van de beperking
      of het verbod, opgelegd ingevolge het eerste lid of de [artikelen 137, eerste lid][ref3], [140, eerste lid][ref4],
      [143, eerste lid][ref5], en [146, eerste lid][ref6].

      3 De verzekeraar kan niet op grond van de beperking of het verbod, opgelegd ingevolge het eerste lid of
      [artikel 142, eerste of tweede lid][ref7], een beroep doen op de ongeldigheid van een rechtshandeling die voor de
      openbaarmaking is verricht, tenzij de wederpartij de beperking onderscheidenlijk het verbod kende of daarvan niet
      onkundig kon zijn.

      4 Indien het besluit tot intrekking wordt vernietigd, heft de Pensioen- & Verzekeringskamer de beperking of het
      verbod, opgelegd ingevolge het eerste lid, op.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel148
