  - number: '38'
    text: |-
      1 Indien zich een wijziging voordoet van de gegevens die overeenkomen met die van
      [artikel 80, tweede lid, onderdelen ][ref1], kan de verzekeraar die wijziging met inachtneming van het
      vierde lid toepassen na haar ten minste een maand tevoren schriftelijk te hebben gemeld aan de Pensioen- &
      Verzekeringskamer en nadat de betrokken toezichthoudende autoriteit de Pensioen- & Verzekeringskamer van die
      wijziging in kennis heeft gesteld, onder bijvoeging van een verklaring dat de verzekeraar beschikt over de vereiste
      solvabiliteitsmarge.

      2 Indien een wijziging als bedoeld in het eerste lid het geval betreft dat de verzekeraar voornemens is voor de
      eerste maal risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen te dekken, voegen de verzekeraar
      en de betrokken toezichthoudende autoriteit bij de melding onderscheidenlijk de inkennisstelling, bedoeld in het
      eerste lid, tevens schriftelijke bewijzen als bedoeld in [artikel 37, eerste lid, onderdelen ][ref2].

      3 De Pensioen- & Verzekeringskamer kan binnen een maand na ontvangst van de melding, bedoeld in het eerste lid,
      de betrokken toezichthoudende autoriteit berichten welke voorwaarden om redenen van algemeen belang in acht moeten
      worden genomen bij het uitoefenen van de werkzaamheden in Nederland.

      4 De verzekeraar kan de wijziging in elk geval toepassen na de verzending door de Pensioen- & Verzekeringskamer aan
      de betrokken toezichthoudende autoriteit van het bericht, bedoeld in het derde lid, dan wel van de mededeling dat
      geen zodanig bericht zal volgen.

      5 Indien het voornemen bestaat om de bedrijfsuitoefening vanuit het bijkantoor te staken, stelt de verzekeraar de
      Pensioen- & Verzekeringskamer daarvan ten minste een maand tevoren schriftelijk in kennis. Zodra de verzekeraar
      zijn voornemen uitvoert, meldt hij dit onverwijld aan de Pensioen- & Verzekeringskamer, die daarvan mededeling doet
      in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel37
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel38
