      of [83, vijfde lid][ref18], van de Wet toezicht verzekeringsbedrijf, wordt, voor zover deze beschikking
      strekt, beschouwd te zijn genomen op grond van de [artikelen 18, eerste lid][ref19], [13, zesde lid][ref20],
      [28, vierde lid][ref21], [45, vierde lid][ref22], [49, eerste lid][ref23], [52, derde lid][ref24],
