  - number: '191'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan een vergunning verleend aan een schadeverzekeraar die op 1 januari 1986 het
      schadeverzekeringsbedrijf uitoefende en waarop [artikel 190, derde lid][ref1], van toepassing is, intrekken indien
      de verzekeraar:

      a. in de staat van zijn zetel niet bevoegd is tot uitoefening van het betrokken directe schadeverzekeringsbedrijf
      of dit bedrijf niet vanuit een vestiging in die staat daadwerkelijk uitoefent; of

      b. met betrekking tot zijn gehele in en buiten Nederland uitgeoefende schadeverzekeringsbedrijf niet over
      een solvabiliteitsmarge beschikt, die ten minste overeenkomt met de ingevolge [artikel 68][ref2] vereiste
      solvabiliteitsmarge.

      2 Een intrekking als bedoeld in het eerste lid wordt gelijkgesteld met een intrekking op grond van
      [artikel 148, aanhef en onderdeel ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel68
