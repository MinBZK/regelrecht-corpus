      1 Een beschikking van de Verzekeringskamer, genomen op grond van [de artikelen 4, eerste lid][ref1],
      [6, zesde lid][ref2], [17, vierde lid][ref3], [24][ref4] in samenhang met [22, vierde lid][ref5],
      [25, eerste lid][ref6], [26, vijfde lid][ref7], [27, tweede lid][ref8], 29, [34][ref9], 35,
