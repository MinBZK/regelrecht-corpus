  - number: '182'
    text: |-
      1 Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke
      verzekeraars zijn verstrekt of zijn verkregen en gegevens en inlichtingen die van een instantie als bedoeld in de
      [artikelen 183, eerste lid][ref1], of [183][ref2], zijn ontvangen, worden niet gepubliceerd en zijn geheim.

      2 Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie als
      bedoeld in [de artikelen 183, eerste lid][ref3], of [183][ref4], ontvangen, of van gegevens of inlichtingen, bij
      het onderzoek van zakelijke gegevens en bescheiden verkregen, verder of anders gebruik te maken of daaraan verder
      of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.

      3 Het eerste en tweede lid laten, ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref5].

      4 Het eerste en tweede lid laten evenzo, ten aanzien van degene op wie het tweede lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref6] en van
      [artikel 66 van de Faillissementswet][ref7] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een verzekeraar die in staat van faillissement is verklaard of op grond van een
      rechterlijke uitspraak is ontbonden. Het in de vorige volzin bepaalde geldt niet voor gegevens of inlichtingen die
      betrekking hebben op verzekeraars die betrokken zijn of zijn geweest bij een poging de desbetreffende verzekeraar
      in staat te stellen zijn bedrijf voort te zetten.

      5 De Pensioen- & Verzekeringskamer is, in afwijking van het eerste en tweede lid, bevoegd met gebruikmaking van
      gegevens of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, mededelingen
      te doen mits deze niet kunnen worden herleid tot afzonderlijke verzekeraars.


