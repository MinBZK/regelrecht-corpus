      1 Een verzekeraar dient, tenzij de Pensioen- & Verzekeringskamer een ander aantal vaststelt, zijn jaarverslag
      in drievoud bij haar in zodra hij het openbaar heeft gemaakt of krachtens het recht van de staat van zijn zetel
      openbaar moet hebben gemaakt.

      2 [Artikel 100, vijfde lid][ref1], geldt ook voor het ingediende jaarverslag.


