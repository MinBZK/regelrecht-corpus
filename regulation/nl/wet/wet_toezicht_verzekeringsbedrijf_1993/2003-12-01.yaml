  - number: 69c
    text: |-
      1 Iedere verzekeraar met zetel in Nederland die een deelnemende onderneming is in minstens één verzekeraar,
      verzekeraar met zetel buiten de Unie of herverzekeraar, is onderworpen aan aanvullend toezicht zoals bepaald in de
      [artikelen 69f][ref1], [69g][ref2], [69i][ref3] en [69j][ref4].

      2 Iedere verzekeraar met zetel in Nederland die een dochteronderneming is van een verzekeringsholding, een
      verzekeraar met zetel buiten de Unie of een herverzekeraar, is onderworpen aan aanvullend toezicht zoals bepaald in
      de [artikelen 69g][ref5], [69i][ref6] en [69k][ref7].

      3 Iedere verzekeraar met zetel in Nederland waarvan de moederonderneming een gemengde verzekeringsholding is, is
      onderworpen aan aanvullend toezicht zoals bepaald in de [artikelen 69g][ref8] en [69i][ref9].


