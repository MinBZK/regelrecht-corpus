        artikel: '152'
        hoofdstuk: VIII
  - number: '152'
    text: |-
      De intrekking van de vergunning verplicht de verzekeraar het betrokken gedeelte van het bedrijf af
      te wikkelen, tenzij de intrekking gepaard gaat met de verlening van een vergunning als bedoeld in
      [artikel 11 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1]. De verzekeraar die verplicht is zijn
      bedrijf af te wikkelen, blijft onderworpen aan de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel152
    references:
