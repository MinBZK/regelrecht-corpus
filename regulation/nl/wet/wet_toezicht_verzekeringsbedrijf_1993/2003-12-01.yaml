        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '6'
        hoofdstuk: I
  - number: '190'
    text: |-
      1 Een verzekeraar met zetel in Nederland die op het tijdstip van inwerkingtreding van deze wet een vergunning
      als bedoeld in [artikel 10][ref1] van de Wet toezicht verzekeringsbedrijf bezit, wordt beschouwd de vergunning te
      hebben verkregen op grond van [artikel 35][ref2].

      2 Een verzekeraar met zetel in een andere lid-staat dan Nederland die het verzekeringsbedrijf vanuit een
      bijkantoor in Nederland uitoefent en die op het tijdstip van inwerkingtreding van deze wet een vergunning als
      bedoeld in [artikel 10][ref3] van de Wet toezicht verzekeringsbedrijf bezit, wordt beschouwd te hebben voldaan
      aan [artikel 37][ref4].

      3 Een verzekeraar met zetel buiten de Unie die het verzekeringsbedrijf vanuit een bijkantoor in Nederland
      uitoefent en die op het tijdstip van inwerkingtreding van deze wet een vergunning als bedoeld in [artikel 10][ref5]
      van de Wet toezicht verzekeringsbedrijf bezit, wordt beschouwd de vergunning te hebben verkregen op grond van
      [artikel 47][ref6].


