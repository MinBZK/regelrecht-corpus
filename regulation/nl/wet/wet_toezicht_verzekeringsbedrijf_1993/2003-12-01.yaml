  - number: 147b
    text: |-
      1 De Pensioen- & Verzekeringskamer stelt een vertrouwenscommissie in.

      2 De leden van de vertrouwenscommissie worden door Onze Minister benoemd en ontslagen. Elke benoeming geschiedt op
      voordracht op te maken door de Pensioen- & Verzekeringskamer en de representatieve organisaties van verzekeraars
      gezamenlijk.

      3 De werkwijze en samenstelling van de vertrouwenscommissie worden in de statuten van de Pensioen- &
      Verzekeringskamer vastgelegd.

      4 De vertrouwenscommissie heeft tot taak:

      a. het bestuur van de Pensioen- & Verzekeringskamer te adviseren in gevallen waarin dat volgens dit hoofdstuk is
      voorgeschreven;

      b. desgevraagd het bestuur van de Pensioen- & Verzekeringskamer te adviseren bij de ingevolge dit hoofdstuk door
      haar te nemen beslissingen;

      c. desgevraagd het bestuur van de Pensioen- & Verzekeringskamer behulpzaam te zijn bij het onderzoeken van de
      mogelijkheden van een vrijwillige vorm van samenwerking tussen een verzekeraar waarop het opvanginstrument kan
      worden toegepast en een andere verzekeraar, dan wel overname door laatstbedoelde verzekeraar.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147b
  - number: 147c
    text: |-
      1 De Pensioen- & Verzekeringskamer kan, gehoord de vertrouwenscommissie, het opvanginstrument in werking stellen
      indien:

      a. artikel 138, tweede lid, of 144, tweede lid, van toepassing is en met betrekking tot het opgestelde
      financieringsplan van de verzekeraar de toestemming is geweigerd; en

      b. de portefeuille van de verzekeraar naar het oordeel van de Pensioen- & Verzekeringskamer nog levensvatbaar is.

      2 Met het weigeren van toestemming voor het financieringsplan, bedoeld in het eerste lid, wordt voor de toepassing
      van dit hoofdstuk gelijk gesteld het intrekken van een verleende toestemming voor een financieringsplan, het niet
      binnen de door de Pensioen- & Verzekeringskamer bepaalde termijn indienen van een financieringsplan, of het niet
      binnen de door de Pensioen- & Verzekeringskamer bepaalde termijn aanbrengen van door haar aangegeven wijzigingen in
      een plan waarvoor toestemming is verleend.

      3 De opvang geschiedt aan de hand van een door de Pensioen- & Verzekeringskamer, gehoord de vertrouwenscommissie,
      op te stellen opvangplan.

      4 De Pensioen- & Verzekeringskamer maakt de inwerkingstelling van het opvanginstrument en het daarbij behorende
      opvangplan bekend aan de verzekeraar en de opvanginstelling.

      5 De verzekeraar en de opvanginstelling handelen overeenkomstig het opvangplan.

      6 De Pensioen- & Verzekeringskamer kan, gehoord de vertrouwenscommissie, het opvangplan wijzigen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147c
  - number: 147c1
    text: |-
      De statuten van de opvanginstelling, met inbegrip van wijzigingen daarin, behoeven de voorafgaande toestemming van
      de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147c1
  - number: 147d
    text: |-
      1 De opvang door een opvanginstelling kan bestaan uit verplichte herverzekering van de portefeuille van de
      verzekeraar of verplichte overdracht van de portefeuille van de verzekeraar.

      2 In geval van verplichte herverzekering van de portefeuille worden de verplichtingen van de verzekeraar
      uit overeenkomsten van directe verzekering geheel of ten dele herverzekerd bij een door de Pensioen- &
      Verzekeringskamer aan te wijzen opvanginstelling. De voorwaarden waaronder verplichte herverzekering plaatsvindt,
      worden opgesteld door de opvanginstelling en behoeven de instemming van de Pensioen- & Verzekeringskamer.

      3 In geval van verplichte overdracht van de portefeuille worden de rechten en verplichtingen uit overeenkomsten
      van directe verzekering van de verzekeraar overgedragen aan een door de Pensioen- & Verzekeringskamer aan te wijzen
      opvanginstelling. De opvanginstelling brengt daarbij de solvabiliteitsmarge op de ingevolge [artikel 68][ref1]
      vereiste omvang.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147d
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: 147e
    text: |-
      1 Verplichte overdracht van de portefeuille van de verzekeraar vindt slechts plaats nadat de rechtbank binnen
      welker rechtsgebied de verzekeraar zijn woonplaats heeft op verzoek van de Pensioen- & Verzekeringskamer daartoe
      aan haar machtiging heeft verleend.

      2 De rechtbank verleent de machtiging, tenzij de Pensioen- & Verzekeringskamer in redelijkheid niet tot het oordeel
      heeft kunnen komen dat de portefeuille van de verzekeraar nog levensvatbaar is.

      3 De Pensioen- & Verzekeringskamer zendt een afschrift van haar verzoekschrift tot machtiging aan de verzekeraar.

      4 De rechtbank behandelt het verzoek van de Pensioen- & Verzekeringskamer tot machtiging met de meeste spoed op een
      niet openbare terechtzitting op de voet van de rechtspleging in burgerlijke zaken, voor zover daarvan bij deze wet
      niet is afgeweken. De uitspraak wordt niet in het openbaar gedaan.

      5 De rechtbank kan inzage nemen of doen nemen van de zakelijke gegevens en bescheiden van de verzekeraar. Artikel
      57 is daarbij van overeenkomstige toepassing.

      6 De rechtbank geeft geen beschikking dan nadat de verzekeraar en de Pensioen- & Verzekeringskamer zijn gehoord
      althans behoorlijk zijn opgeroepen.

      7 De beschikking is uitvoerbaar bij voorraad, terugwerkend tot aan het begin van de dag waarop zij is uitgesproken,
      niettegenstaande enige daartegen gerichte voorziening.

      8 De rechtbank kan op verzoek van de Pensioen- & Verzekeringskamer de machtiging intrekken.

      9 De Pensioen- & Verzekeringskamer doet van de verlening van de machtiging mededeling aan de betrokken verzekeraar
      en de opvanginstelling.

      10 Tegen de beschikking staat geen hoger beroep open.

      11 Beroep in cassatie tegen de beschikking wordt ingesteld binnen veertien dagen na de dag van de uitspraak van de
      rechtbank. De behandeling heeft in raadkamer plaats en geschiedt met de grootste spoed. De uitspraak wordt niet in
      het openbaar gedaan.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147e
  - number: 147f
    text: |-
      De Pensioen- & Verzekeringskamer kan een verzoek tot het verlenen of tot het intrekken van een machtiging bij de
      rechtbank indienen zonder tussenkomst van een procureur.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147f
  - number: 147g
    text: |-
      Tot het instellen van beroep in cassatie tegen de beschikkingen van de rechtbank uit hoofde van dit hoofdstuk is,
      buiten de Pensioen- & Verzekeringskamer, de verzekeraar bevoegd, ongeacht of deze bij de rechtbank is verschenen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147g
  - number: 147h
    text: |-
      De Pensioen- & Verzekeringskamer kan de verzekeraar en de opvanginstelling instructies geven in het belang van
      de goede werking van het opvanginstrument. De verzekeraar en de opvanginstelling volgen de instructies van de
      Pensioen- & Verzekeringskamer op. De instructies van de Pensioen- & Verzekeringskamer kunnen geen betrekking hebben
      op de voorwaarden van het herverzekeringscontract, bedoeld in [artikel 147d, tweede lid][ref1], laatste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel147d
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147h
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 147d
        hoofdstuk: VIIA
  - number: 147i
    text: |-
      1 Bij de toepassing van het opvanginstrument draagt de verzekeraar aan de opvanginstelling de waarden over
      die dienen tot dekking van de technische voorzieningen, voor zover deze voorzieningen betrekking hebben op de
      verplichtingen die worden herverzekerd, onderscheidenlijk worden overgedragen.

      2 Voor zover de opvang betrekking heeft op verplichtingen waarvoor ingevolge [artikel 67][ref1] dan wel
      [artikel 95][ref2] een afzonderlijke administratie van waarden is voorgeschreven, draagt de verzekeraar de aldus
      geadministreerde waarden aan de opvanginstelling over.

      3 De verzekeraar draagt niet meer waarden over dan benodigd voor de herverzekering, onderscheidenlijk overdracht,
      van de portefeuille.

      4 Indien voor de opvang meer waarden benodigd zijn dan de in het eerste lid bedoelde, draagt de verzekeraar aan de
      opvanginstelling tevens aanvullende waarden over tot het benodigde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel95
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147i
