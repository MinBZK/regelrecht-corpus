  - number: 83b
    text: |-
      1 Een verzekeraar meldt een wijziging van de gegevens, bedoeld in
      [artikel 83a, tweede lid, onderdelen b tot en met d][ref1], ten minste een maand tevoren schriftelijk aan de
      Pensioen- & Verzekeringskamer.

      2 De verzekeraar doet de in het tweede lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de
      Pensioen- & Verzekeringskamer zulks verlangt.

      3 Indien de verzekeraar beschikt over de ingevolge artikel 68 vereiste solvabiliteitsmarge en de Pensioen- &
      Verzekeringskamer geen bedenkingen heeft tegen de wijziging maakt zij dit aan de verzekeraar bekend.

      4 Indien het voornemen bestaat om de bedrijfsuitoefening vanuit het bijkantoor te staken, stelt de verzekeraar de
      Pensioen- & Verzekeringskamer daarvan ten minste een maand tevoren schriftelijk in kennis. Zodra de verzekeraar
      zijn voornemen uitvoert, meldt hij dit onverwijld aan de Pensioen- & Verzekeringskamer.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel83a
