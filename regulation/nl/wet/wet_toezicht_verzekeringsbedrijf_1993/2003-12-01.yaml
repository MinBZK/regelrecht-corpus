  - number: '43'
    text: |-
      1 Een vergunning voor het levensverzekeringsbedrijf wordt niet verleend aan een verzekeraar die in of buiten
      Nederland het schadeverzekeringsbedrijf uitoefent.

      2 Het eerste lid geldt niet voor de verzekeraar die sedert 15 maart 1979 vanuit de bijkantoren in Nederland
      uitsluitend het levensverzekeringsbedrijf uitoefent.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel43
  - number: '44'
    text: |-
      1 Een vergunning voor de branche Permanent health insurance wordt slechts verleend aan een verzekeraar die zich in
      en buiten Nederland beperkt tot deze branche.

      2 Een vergunning voor de branche Kapitalisatieverrichtingen of voor de branche Beheer over collectieve
      pensioenfondsen wordt slechts verleend aan een verzekeraar die in het bezit is van een vergunning voor de branche
      Levensverzekering algemeen, die de werkzaamheden in de branche Kapitalisatieverrichtingen onderscheidenlijk in de
      branche Beheer over collectieve pensioenfondsen in zodanige mate uitoefent dat zij voor zijn gehele bedrijf van
      ondergeschikte betekenis zijn en die, indien het betreft de branche Beheer over collectieve pensioenfondsen, voorts
      voldoet aan de door de Pensioen- & Verzekeringskamer te zijnen aanzien gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel44
  - number: '45'
    text: |-
      1 De verzekeraar stelt als zijn vertegenwoordiger een natuurlijk persoon of een rechtspersoon aan, die zijn
      woonplaats in Nederland heeft.

      2 De vertegenwoordiger heeft ten aanzien van de uitoefening van het verzekeringsbedrijf vanuit de bijkantoren
      in Nederland van rechtswege alle bevoegdheden die de verzekeraar bezit. Hij maakt daarvan gebruik voor zover de
      Pensioen- & Verzekeringskamer zulks verlangt.

      3 De vertegenwoordiger is gehouden namens de verzekeraar te voldoen aan de bij of krachtens deze wet gegeven
      voorschriften. Het ontbreken van de vertegenwoordiger of zijn in gebreke zijn ontslaat de verzekeraar niet van de
      verplichting te voldoen aan deze voorschriften.

      4 De Pensioen- & Verzekeringskamer kan ambtshalve of op aanvraag van de verzekeraar ontheffing verlenen van
      het bepaalde in de eerste volzin van het derde lid. Aan een ontheffing kunnen beperkingen worden gesteld of
      voorschriften worden verbonden en zij kan worden ingetrokken.

      5 Is de vertegenwoordiger rechtspersoon, dan wijst hij op zijn beurt een natuurlijk persoon aan die in Nederland
      zijn woonplaats heeft en die hem bij uitsluiting van ieder ander vertegenwoordigt bij de uitoefening van zijn
      bevoegdheden en bij de nakoming van zijn uit deze wet voortvloeiende verplichtingen.

      6 Als woonplaats van de verzekeraar in Nederland geldt de woonplaats van zijn vertegenwoordiger, met dien verstande
      dat, indien de vertegenwoordiger een natuurlijk persoon is die een kantoor houdt, dit kantoor als woonplaats van de
      verzekeraar wordt aangemerkt.

      7 [Artikel 29, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de natuurlijke persoon die als
      vertegenwoordiger is aangesteld en op de natuurlijke persoon, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel29
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel45
