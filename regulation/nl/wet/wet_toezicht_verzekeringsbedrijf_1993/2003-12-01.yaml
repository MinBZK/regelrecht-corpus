  - number: '159'
    text: |-
      Bij de toepassing van de machtiging ten aanzien van een verzekeraar met zetel in een andere lid-staat dan Nederland
      die vanuit de bijkantoren in Nederland zowel het schadeverzekeringsbedrijf als het levensverzekeringsbedrijf
      uitoefent, gelden voor de betrokken verzekeraar de bij of krachtens deze wet voor schadeverzekeraars
      onderscheidenlijk voor levensverzekeraars vastgestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel159
  - number: '160'
    text: |-
      1 Vanaf het begin van de dag van de uitspraak waarbij de rechtbank de machtiging verleent, mogen aan de in
      Nederland aanwezige waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de vestigingen in
      Nederland aangegane verplichtingen geen andere waarden worden toegevoegd dan de sindsdien ontvangen:

      a. premies of de met die premies verkregen waarden, voor zover deze dienen tot dekking van die technische
      voorzieningen;

      b. uitkeringen uit hoofde van de [Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] of de met die
      uitkeringen verkregen waarden; en

      c. overige uitkeringen in verband met verplichtingen en kosten die voortvloeien uit de gesloten overeenkomsten
      van verzekering.

      2 Het eerste lid is van overeenkomstige toepassing op verzekeraars met zetel in Nederland ten aanzien van de in
      Nederland aanwezige waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de bijkantoren in
      andere lid-staten aangegane verplichtingen.

      3 De Pensioen- & Verzekeringskamer bepaalt ten aanzien van de bijkantoren van verzekeraars met zetel in een andere
      lid-staat, na raadpleging van de betrokken toezichthoudende autoriteit, welke waarden dienen tot dekking van de
      technische voorzieningen, bedoeld in het eerste lid, alsmede welke de in dat lid bedoelde toegevoegde waarden zijn.

      4 Indien faillissement wordt uitgesproken zonder voorafgaande machtiging of later dan vier weken na de beëindiging
      van de machtiging, geldt het verbod, bedoeld in het eerste en tweede lid, vanaf de dag van de faillietverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0009750
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0009750
  - number: '161'
    text: |-
      1 Indien de rechtbank de machtiging verleent, oefenen de bewindvoerders bij uitsluiting alle bevoegdheden van de
      bestuurders, de commissarissen of de vertegenwoordiger van de verzekeraar uit.

      2 De bewindvoerders waken voor de belangen van de gezamenlijke schuldeisers.

      3 De bestuurders, de commissarissen of de vertegenwoordiger van de verzekeraar verlenen bij de uitoefening door de
      bewindvoerders van de in het eerste lid bedoelde bevoegdheden alle door hen gevraagde medewerking.

      4 Indien meer dan één bewindvoerder is benoemd, is voor de geldigheid van hun handelingen toestemming van de
      meerderheid of bij staking van stemmen een beslissing van de voorzieningenrechter van de rechtbank vereist. De
      bewindvoerder aan wie bij de machtiging, bedoeld in [artikel 156, derde lid][ref1], een bepaalde werkkring is
      aangewezen, is binnen de grenzen daarvan zelfstandig tot handelen bevoegd.

      5 De rechtbank kan te allen tijde een bewindvoerder, na deze en de Pensioen- & Verzekeringskamer gehoord, althans
      behoorlijk opgeroepen te hebben, ontslaan en door een ander vervangen, of aan de bewindvoerder één of meer andere
      bewindvoerders toevoegen, een en ander op verzoek van de bewindvoerder, de andere bewindvoerders, de Pensioen- &
      Verzekeringskamer of één of meer schuldeisers dan wel ambtshalve.

      6 De bewindvoerders kunnen de bestuurders of de vertegenwoordiger van de verzekeraar machtigen bepaalde handelingen
      te verrichten.

      7 Een besluit van aandeelhouders of leden van een verzekeraar met zetel in Nederland behoeft, om van kracht te
      zijn, de toestemming van de bewindvoerders.

      8 Wordt een besluit van aandeelhouders of leden dat ingevolge de statuten of reglementen van een verzekeraar met
      zetel in Nederland voor een handeling is vereist, niet genomen of verkrijgt dit besluit niet de volgens de statuten
      of reglementen vereiste toestemming, dan kunnen de bewindvoerders dit besluit nemen.

      9 De bewindvoerders kunnen personen machtigen alle of een deel van de bevoegdheden uit te oefenen die zij ingevolge
      het eerste lid hebben. De bewindvoerders kunnen de rechtbank verzoeken een beloning voor de gemachtigden vast te
      stellen. De bewindvoerders doen van de naam en woonplaats van een door hen gemachtigde alsook van de intrekking van
      een machtiging mededeling in de Staatscourant.

      10 Het loon van de personen, aangewezen ingevolge [artikel 156, zevende lid][ref2], het loon en de verschotten
      van de bewindvoerders, alsmede de overige kosten van de noodregeling worden bepaald door de rechtbank en vormen
      een boedelschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel156
