  - number: '130'
    text: |-
      1 Een aanvraag ter verkrijging van toestemming van de Pensioen- & Verzekeringskamer tot overdracht van rechten en
      verplichtingen gaat vergezeld van een ontwerp-overeenkomst met alle ter toelichting dienende stukken.

      2 Voor een overdracht aan een verzekeraar met zetel in Nederland verleent de Pensioen- & Verzekeringskamer geen
      toestemming indien de Pensioen- & Verzekeringskamer een herstelplan ingevolge [artikel 137a][ref1] heeft verlangd
      van deze verzekeraar of indien deze verzekeraar, mede gelet op de voorgenomen overdracht, niet beschikt over de
      vereiste solvabiliteitsmarge.

      3 Op de aanvraag ter verkrijging van toestemming van de Pensioen- & Verzekeringskamer tot de overdracht is
      [artikel 122, derde tot en met vijfde lid][ref2], van overeenkomstige toepassing.

      4 Voor zover een overdracht als bedoeld in [artikel 129, eerste lid, onderdeel ][ref3], betrekking heeft op
      overeenkomsten van levensverzekering, gesloten vanuit een in een andere lid-staat dan Nederland gelegen bijkantoor
      van de verzekeraar, en in geval van een overdracht als bedoeld in [artikel 129, eerste lid, onderdeel ][ref4],
      legt de Pensioen- & Verzekeringskamer na ontvangst van de vereiste gegevens de ontwerp-overeenkomst met alle ter
      toelichting dienende stukken voor advies voor aan de toezichthoudende autoriteit van elke betrokken lid-staat.

      5 Indien een in het vierde lid bedoelde toezichthoudende autoriteit haar advies niet binnen drie maanden na
      ontvangst van het daartoe strekkende verzoek aan de Pensioen- & Verzekeringskamer heeft uitgebracht, wordt zulks
      gelijkgesteld met een gunstig advies.

      6 Voor zover een overdracht betrekking heeft op in dienstverrichting naar een andere lid-staat dan Nederland
      gesloten overeenkomsten van levensverzekering, verleent de Pensioen- & Verzekeringskamer geen toestemming alvorens
      de toezichthoudende autoriteit van die lid-staat heeft verklaard met de overdracht in te stemmen.

      7 Indien de in het zesde lid bedoelde toezichthoudende autoriteit haar oordeel niet binnen drie maanden na
      ontvangst van het daartoe strekkende verzoek aan de Pensioen- & Verzekeringskamer heeft kenbaar gemaakt, wordt
      zulks gelijkgesteld met een instemming.

      8 Indien de Pensioen- & Verzekeringskamer aanvankelijk geen bedenkingen heeft tegen het ontwerp van de tot
      overdracht strekkende overeenkomst, maakt zij dit aan de verzekeraar bekend. Heeft zij aanvankelijk wel
      bedenkingen, dan maakt zij deze bedenkingen eveneens aan de verzekeraar bekend.


