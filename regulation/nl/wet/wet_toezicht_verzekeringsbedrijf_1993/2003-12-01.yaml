  - number: '173'
    text: |-
      1 In geval van noodregeling overeenkomstig dit hoofdstuk of van faillissement van een verzekeraar met zetel
      buiten de Unie worden de boedelschulden, overeenkomstig de bepalingen van de [Faillissementswet][ref1], al naar
      gelang de aard van de betrokken boedelschuld hetzij mede over de in Nederland aanwezige waarden, bedoeld in
      [artikel 95][ref2], omgeslagen, hetzij uitsluitend van een bepaalde bate van de boedel afgetrokken.

      2 [Artikel 171, tweede tot en met zesde lid][ref3], is van overeenkomstige toepassing.


