  - number: 147j
    text: |-
      1 De opvanginstelling maakt de overdracht van de portefeuille van de verzekeraar nadat deze heeft plaatsgevonden
      onverwijld bekend in de Staatscourant. De Pensioen- & Verzekeringskamer kan de opvanginstelling gelasten van de
      overdracht tevens mededeling te doen op een andere, door de Pensioen- & Verzekeringskamer te bepalen, wijze. De
      inhoud van deze bekendmaking onderscheidenlijk mededeling behoeft de voorafgaande instemming van de Pensioen-
      & Verzekeringskamer.

      2 De overdracht wordt ten aanzien van alle andere belanghebbenden dan de betrokken verzekeraars van kracht met
      ingang van de tweede dag, volgende op die van de dagtekening van de Staatscourant waarin de bekendmaking is
      geplaatst.

      3 Op de overdracht zijn de [artikelen 129][ref1], eerste tot en met derde en vijfde tot en met zevende lid, 130,
      131 en 134 niet van toepassing.

      4 De Pensioen- & Verzekeringskamer geeft van de overdracht kennis:

      a. indien het een verzekeraar met zetel in Nederland betreft, aan de toezichthoudende autoriteiten van de andere
      lid-staten waar de verzekeraar een bijkantoor heeft of waarheen hij diensten verricht vanuit zijn vestigingen in
      de Unie;

      b. indien het een verzekeraar met zetel buiten de Unie betreft, aan de toezichthoudende autoriteiten van de andere
      lid-staten waarheen hij diensten verricht vanuit een bijkantoor in Nederland.

      5 Voordat de overdracht plaatsvindt stelt de Pensioen- & Verzekeringskamer de toezichthoudende autoriteiten,
      bedoeld in het vierde lid, in kennis van de voorgenomen overdracht, tenzij het met het opvanginstrument te bereiken
      doel daardoor in gevaar komt.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel129
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147j
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '129'
        hoofdstuk: VI
  - number: 147k
    text: |-
      1 Voor toepassing van het opvanginstrument wordt op enig moment ten hoogste € 181 512 086,44 ter beschikking
      gesteld, met dien verstande dat:

      a. per opvangsituatie maximaal € 90 756 043,22 ter beschikking kan worden gesteld; en

      b. het ter beschikking staande bedrag ten aanzien waarvan naar het oordeel van de Pensioen- & Verzekeringskamer bij
      het inwerking stellen van het opvanginstrument, gehoord de vertrouwenscommissie, het aanmerkelijke risico bestaat
      dat het niet wordt terugbetaald, nooit hoger is dan € 90 756 043,22.

      2 De bedragen, genoemd in het eerste lid, worden jaarlijks door Onze Minister aangepast aan de
      procentuele ontwikkeling van de totale vereiste solvabiliteitsmarge van de verzekeraars, bedoeld in
      [artikel 147a, eerste lid][ref1], zoals die blijkt uit de meest recente jaarlijkse financiële verslaglegging van de
      Pensioen- & Verzekeringskamer.

      3 In de maand januari van elk jaar worden door Onze Minister de voor dat jaar geldende bedragen, bedoeld in het
      tweede lid, in de Staatscourant bekend gemaakt.

      4 Indien als gevolg van toepassing van het opvanginstrument voor een daarop volgende toepassing niet meer de
      maximale bedragen, bedoeld in het eerste lid, ter beschikking staan, bepaalt de Pensioen- & Verzekeringskamer de
      alsdan maximaal ter beschikking staande bedragen.

      5 De Pensioen- & Verzekeringskamer stelt, gehoord de vertrouwenscommissie, het bedrag vast dat in een voorkomend
      geval beschikbaar wordt gesteld voor de toepassing van het opvanginstrument. De Pensioen- & Verzekeringskamer
      bepaalt, met inachtneming van de tweede volzin van het zevende lid, per verzekeraar in hoeverre dit bedrag in de
      vorm van aandelen in de opvanginstelling wordt genomen en in hoeverre dit bedrag in de vorm van een achtergestelde
      lening aan de opvanginstelling wordt verstrekt. Verzekeraars nemen de aandelen en verstrekken de achtergestelde
      lening. Voor dit nemen van de aandelen, het houden ervan en het uitoefenen van de daarmee verbonden zeggenschap
      is geen verklaring van geen bezwaar als bedoeld in [artikel 175, eerste lid][ref2], vereist. De Pensioen- &
      Verzekeringskamer bepaalt de voorwaarden van de achtergestelde lening waaraan verzekeraars zich houden.

      6 De verzekeraars, bedoeld in [artikel 147a, eerste lid][ref3], verschaffen het op grond van het vijfde lid
      vastgestelde bedrag. De Pensioen- & Verzekeringskamer legt daartoe aan deze verzekeraars een aanslag op.

      7 Het bedrag van de aanslag wordt binnen een door de Pensioen- & Verzekeringskamer te bepalen termijn aan de
      opvanginstelling voldaan. De Pensioen- & Verzekeringskamer kan evenwel bepalen dat een of meer verzekeraars het
      bedrag van de aanslag geheel of gedeeltelijk aan een ander voldoen, om deze in staat te stellen zijn aandelen in de
      opvanginstelling aan deze verzekeraar of verzekeraars over te dragen.

      8 Ingeval een verzekeraar niet aan het zevende lid voldoet, kan de voorzitter van de Pensioen- & Verzekeringskamer
      een dwangbevel uitvaardigen, dat wordt executoir verklaard door de voorzieningenrechter van de rechtbank van het
      arrondissement waarin de Pensioen- & Verzekeringskamer is gevestigd en dan een executoriale titel oplevert, die
      met de toepassing van de voorschriften van het [Wetboek van Burgerlijke Rechtsvordering][ref4] door de Pensioen- &
      Verzekeringskamer tenuitvoergelegd kan worden.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste, vierde en zesde lid.

      10 Het zesde lid is niet van toepassing op opvanginstellingen en op verzekeraars ten aanzien waarvan het
      opvanginstrument wordt toegepast of is toegepast en die uit dien hoofde nog verplichtingen hebben.

      11 De Pensioen- & Verzekeringskamer kan een verzekeraar ontheffing verlenen van het zesde lid, eerste volzin,
      indien naar haar oordeel de bijdrage tot gevolg zal hebben dat de solvabiliteitsmarge van die verzekeraar niet meer
      zal voldoen aan [artikel 68][ref5] of [artikel 96][ref6] en de verzekeraar niet in staat is de solvabiliteitsmarge
      binnen een redelijke termijn op de vereiste omvang te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel147a
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel175
