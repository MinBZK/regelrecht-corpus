  - number: '174'
    text: |-
      1 Het is een verzekeraar met zetel in Nederland verboden, anders dan na verkregen verklaring van geen bezwaar,
      een gekwalificeerde deelneming in een ingevolge [artikel 52, tweede lid, onderdelen ][ref1] geregistreerde
      kredietinstelling te houden, te verwerven of te vergroten.

      2 In dit artikel wordt onder gekwalificeerde deelneming verstaan een rechtstreeks of middellijk belang van meer
      dan 5 procent van het geplaatste aandelenkapitaal van een kredietinstelling als bedoeld in het eerste lid, of
      het rechtstreeks of middellijk kunnen uitoefenen van meer dan 5 procent van de stemrechten in een dergelijke
      kredietinstelling, of het rechtstreeks of middellijk kunnen uitoefenen van een daarmee vergelijkbare zeggenschap in
      een dergelijke kredietinstelling.

      3 Het verbod van het eerste lid geldt ook voor een onderneming of instelling die aan het hoofd staat van een groep
      waarin een of meer verzekeraars zijn opgenomen.

      4 Een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid wordt verleend, tenzij:

      a. de Pensioen- & Verzekeringskamer van oordeel is dat de handeling in strijd zou zijn of zou kunnen komen met
      het belang van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen betrokken zijn of
      zullen worden bij overeenkomsten van verzekering, gesloten of te sluiten door een rechtstreeks of middellijk bij de
      handeling betrokken verzekeraar;

      b. de Pensioen- & Verzekeringskamer van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een
      ongewenste ontwikkeling van het verzekeringswezen;

      c. de Pensioen- & Verzekeringskamer van oordeel is dat een integere bedrijfsvoering onvoldoende
      is gewaarborgd, waarbij onder integere bedrijfsvoering wordt verstaan de bedrijfsvoering met
      uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref2]; of

      d. Onze Minister van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling
      van het verzekeringswezen.

      5 Aan een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid kunnen op grond van de
      overwegingen als bedoeld in het vierde lid, onderdelen a, b en c, onderscheidenlijk het vierde lid, onderdeel d,
      beperkingen worden gesteld en voorschriften worden verbonden.

      6 Ingeval een handeling als bedoeld in het eerste lid is verricht zonder dat voor die handeling een verklaring van
      geen bezwaar is verkregen of de bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is de
      in overtreding zijnde verzekeraar gehouden binnen een door Onze Minister te bepalen termijn de verrichte handeling
      ongedaan te maken dan wel de beperkingen alsnog in acht te nemen. Deze verplichting vervalt op het tijdstip waarop
      en voor zover voor de desbetreffende handeling alsnog een verklaring van geen bezwaar wordt afgegeven dan wel de
      niet in acht genomen beperkingen worden ingetrokken.

      7 Ingeval aan de verklaring van geen bezwaar als bedoeld in het eerste lid verbonden voorschriften niet worden
      nagekomen, kan Onze Minister een termijn vaststellen waarbinnen de in overtreding zijnde verzekeraar de niet
      nagekomen voorschriften alsnog moet vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
