  - number: 83a
    text: |-
      1 Een verzekeraar met zetel in Nederland die voornemens is een bijkantoor te openen in een staat buiten de Unie,
      stelt de Pensioen- & Verzekeringskamer daarvan schriftelijk in kennis.

      2 Deze kennisgeving geschiedt onder opgave van:

      a. de staat waarin de verzekeraar voornemens is het bijkantoor te openen;

      b. een programma van werkzaamheden, met betrekking waartoe bij ministeriële regeling nadere regels worden
      gesteld en waarin met name de aard van de risico's van schadeverzekering dan wel de aard van de overeenkomsten
      van levensverzekering die door het bijkantoor zullen worden gedekt onderscheidenlijk gesloten en de voorziene
      organisatiestructuur – met inbegrip van de financiële administratie en de interne controle – ten behoeve van het
      bijkantoor zijn vermeld;

      c. het adres van het bijkantoor; en

      d. de naam en het adres van de vertegenwoordiger en, zo de vertegenwoordiger rechtspersoon is, de naam en het adres
      van de natuurlijke persoon, bedoeld in [artikel 83c, tweede lid][ref1].

      3 De verzekeraar doet de in het tweede lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de
      Pensioen- & Verzekeringskamer zulks verlangt.

      4 Indien de Pensioen- & Verzekeringskamer van de verzekeraar een herstelplan ingevolge [artikel 137a][ref2]
      heeft verlangd of indien de verzekeraar, gezien de werkzaamheden die hij vanuit het bijkantoor voornemens is te
      verrichten, niet voldoet aan de bij of krachtens deze wet gestelde eisen ten aanzien van:

      a. de deskundigheid, de voornemens, de handelingen of de antecedenten van de personen die het dagelijks
      beleid van de verzekeraar bepalen of van de vertegenwoordiger en, zo de vertegenwoordiger rechtspersoon is,
      de deskundigheid, de voornemens, de handelingen of de antecedenten van de natuurlijke persoon, bedoeld in
      [artikel 83c, tweede lid][ref3];

      b. de technische voorzieningen;

      c. de solvabiliteitsmarge;

      d. de administratieve organisatie;

      e. de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering,

      dan wel indien naar het oordeel van de Pensioen- & Verzekeringskamer aanwijzingen bestaan dat de verzekeraar
      niet aan deze eisen zal kunnen voldoen, geeft de Pensioen- & Verzekeringskamer geen toestemming voor
      opening van het bijkantoor. Onder integere bedrijfsvoering wordt in dit lid verstaan de bedrijfsvoering
      met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref4].

      5 De Pensioen- & Verzekeringskamer maakt binnen zes weken na ontvangst van de kennisgeving, bedoeld in het
      eerste lid, haar beslissing over het verlenen van toestemming voor het openen van het bijkantoor bekend aan de
      verzekeraar.


