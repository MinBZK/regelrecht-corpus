  - number: '76'
    text: |-
      1 Het is een verzekeraar met zetel in Nederland verboden overeenkomsten van verzekering, gesloten vanuit een
      vestiging in de Unie, zonder toestemming van degenen die aan die overeenkomsten rechten kunnen ontlenen, over te
      boeken naar een bijkantoor van deze verzekeraar in een andere staat.

      2 De Pensioen- & Verzekeringskamer kan ontheffing verlenen van het in het eerste lid gegeven verbod indien de
      verzekeraar aannemelijk maakt dat de belangen van degenen die aan de betrokken overeenkomsten rechten kunnen
      ontlenen, zich tegen de overboeking niet verzetten. Aan een ontheffing kunnen beperkingen worden gesteld of
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel76
  - number: '77'
    text: |-
      1 Een verzekeraar met zetel in Nederland die voornemens is vanuit een vestiging in de Unie voor de eerste maal
      diensten te verrichten naar een andere lid-staat dan Nederland, stelt de Pensioen- & Verzekeringskamer daarvan
      schriftelijk in kennis onder opgave van die lid-staat en van de aard van de risico’s van schadeverzekering die bij
      deze dienstverrichting zullen worden gedekt dan wel van de aard van de overeenkomsten van levensverzekering die bij
      deze dienstverrichting zullen worden gesloten.

      2 Indien de verzekeraar risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen wenst te dekken en de
      betrokken lid-staat dit eist, voegt de verzekeraar bij de in het eerste lid bedoelde opgave:

      a. de naam en het adres van de schade-afhandelaar in de betrokken lid-staat die belast wordt met het namens de
      verzekeraar afwikkelen van vorderingen van benadeelden die voortvloeien uit risico’s behorende tot de branche
      Aansprakelijkheid motorrijtuigen;

      b. een schriftelijk bewijs waaruit blijkt dat de verzekeraar is toegetreden tot het nationale bureau
      en het nationale waarborgfonds van de betrokken lid-staat die overeenkomen met het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] onderscheidenlijk het
      Waarborgfonds Motorverkeer, bedoeld in artikel 23, eerste lid, van die wet.

      3 De verzekeraar doet de in het eerste en tweede lid bedoelde gegevens vergezeld gaan van een vertaling voor zover
      de Pensioen- & Verzekeringskamer zulks verlangt.

      4 De Pensioen- & Verzekeringskamer doet mededeling aan de betrokken toezichthoudende autoriteit van de in het
      eerste lid en, in voorkomend geval, van de in het tweede lid bedoelde gegevens, waarbij zij een verklaring voegt
      dat de verzekeraar beschikt over de ingevolge [artikel 68][ref2] vereiste solvabiliteitsmarge en een opgave
      verstrekt van de branches waarvoor de verzekeraar een vergunning bezit, binnen een maand na ontvangst van de
      kennisgeving, bedoeld in het eerste lid, indien:

      a. de verzekeraar in het bezit is van een vergunning;

      b. de verzekeraar beschikt over de ingevolge [artikel 68][ref3] vereiste solvabiliteitsmarge;

      c. de Pensioen- & Verzekeringskamer geen herstelplan ingevolge [artikel 137a][ref4] heeft verlangd van de
      verzekeraar; en

      d. de Pensioen- & Verzekeringskamer geen bedenkingen heeft tegen het verrichten van diensten.

      5 De Pensioen- & Verzekeringskamer maakt de mededeling, bedoeld in het vierde lid, aanhef, gelijktijdig aan de
      verzekeraar bekend.

      6 Indien de Pensioen- & Verzekeringskamer bedenkingen heeft tegen het verrichten van diensten, maakt zij zulks
      binnen een maand na ontvangst van de kennisgeving, bedoeld in het eerste lid, aan de verzekeraar bekend.

      7 De verzekeraar kan het verrichten van diensten aanvangen vanaf de datum van de door de Pensioen- &
      Verzekeringskamer gedane bekendmaking, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel68
