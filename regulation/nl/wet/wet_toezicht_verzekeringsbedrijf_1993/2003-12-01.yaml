    text: |-
      1 Van het overlijden, het van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen, de surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de onderbewindstelling van één of meer van de
      goederen, bedoeld in[titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of de ondercuratelestelling van de
      vertegenwoordiger of de natuurlijke persoon, bedoeld in [artikel 85, vierde lid][ref3], alsmede van het ontslag
      van deze natuurlijke persoon geeft de verzekeraar onderscheidenlijk de vertegenwoordiger binnen een week aan de
      Pensioen- & Verzekeringskamer kennis.

      2 In de gevallen, genoemd in het eerste lid, alsook in het geval dat de vertegenwoordiger of de natuurlijke
      persoon, bedoeld in [artikel 85, vierde lid][ref4], heeft bedankt, legt de verzekeraar aan de Pensioen- &
      Verzekeringskamer over een akte van aanstelling van de vertegenwoordiger alsook, indien de vertegenwoordiger
      rechtspersoon is, de statuten van deze rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister
      en een akte van aanstelling van de natuurlijke persoon, bedoeld in [artikel 85, vierde lid][ref5]. De verzekeraar
      verstrekt de in dit lid bedoelde gegevens binnen twee weken na de betrokken aanstelling.


