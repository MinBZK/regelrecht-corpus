      1 De Pensioen- & Verzekeringskamer kan in het geval, bedoeld in [artikel 144, eerste lid][ref1], in uitzonderlijke
      omstandigheden, waarbij zij van oordeel is dat de financiële positie van de verzekeraar nog verder zal
      verslechteren, alsook in het geval, bedoeld in [artikel 144, tweede lid][ref2], de vrije beschikking door de
      verzekeraar over zijn waarden, die betrekking hebben op zijn vanuit Nederland uitgeoefende verzekeringsbedrijf,
      beperken of hem verbieden om anders dan met schriftelijke machtiging van de Pensioen- & Verzekeringskamer te
      beschikken over deze waarden.

      2 De Pensioen- & Verzekeringskamer deelt haar beslissing - zo mogelijk voordat deze van kracht wordt - mee aan de
      toezichthoudende autoriteiten van de andere lid-staten waar de verzekeraar een bijkantoor heeft of waarheen hij
      vanuit Nederland diensten verricht. Zij kan deze autoriteiten verzoeken overeenkomstige maatregelen te treffen ten
      aanzien van de in de betrokken lid-staten aanwezige waarden.

      3 Ten aanzien van een verzekeraar waarvan de solvabiliteitsmarge onder toezicht staat van de toezichthoudende
      autoriteit van een andere lid-staat dan Nederland, vaardigt de Pensioen- & Verzekeringskamer een beperking of een
      verbod uit ten aanzien van de hier te lande aanwezige waarden, indien die toezichthoudende autoriteit dit verzoekt
      op grond van het feit dat de verzekeraar naar haar oordeel in soortgelijke omstandigheden verkeert als bedoeld in
      [artikel 144, eerste of tweede lid][ref3].

      4 De beslissing waarbij de beperking of het verbod wordt opgelegd, wordt door de Pensioen- & Verzekeringskamer door
      middel van een deurwaardersexploot aan de verzekeraar bekendgemaakt.

      5 De verzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.

      6 De Pensioen- & Verzekeringskamer heft de beperking of het verbod op, zodra de verzekeraar weer voldoet aan de
      bij of krachtens deze wet gestelde eisen met betrekking tot de solvabiliteitsmarge, dan wel, indien de beperking of
      het verbod uitsluitend berust op het derde lid, zodra de aldaar bedoelde toezichthoudende autoriteit dit verzoekt.
      Zij maakt de opheffing bekend aan de verzekeraar. Tevens doet de Pensioen- & Verzekeringskamer van de opheffing
      mededeling aan de in het tweede lid bedoelde toezichthoudende autoriteiten.


