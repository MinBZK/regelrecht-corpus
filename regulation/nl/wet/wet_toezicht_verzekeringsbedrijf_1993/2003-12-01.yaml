  - number: '177'
    text: |-
      1 Iedere natuurlijke persoon of rechtspersoon wiens gekwalificeerde deelneming in een verzekeraar met zetel in
      Nederland zodanig wijzigt, dat de omvang van deze deelneming onder de 10, 20, 33 of 50 procent daalt of, dat de
      verzekeraar ophoudt een dochtermaatschappij te zijn, stelt de Pensioen- & Verzekeringskamer daarvan vooraf in
      kennis.

      2 Een verzekeraar met zetel in Nederland stelt, voor zover hem bekend, de Pensioen- & Verzekeringskamer in de
      maand juli van elk jaar in kennis van de identiteit van iedere natuurlijke persoon of rechtspersoon die een
      gekwalificeerde deelneming in deze verzekeraar houdt. Tevens stelt een verzekeraar met zetel in Nederland,
      zodra zulks hem bekend wordt, de Pensioen- & Verzekeringskamer in kennis van iedere verwerving, afstoting of
      wijziging van een gekwalificeerde deelneming in deze verzekeraar waardoor de omvang van deze deelneming boven
      onderscheidenlijk onder de 10, 20, 33 of 50 procent stijgt onderscheidenlijk daalt of waardoor de verzekeraar een
      dochtermaatschappij wordt onderscheidenlijk ophoudt een dochtermaatschappij te zijn.

      3 De Pensioen- & Verzekeringskamer stelt Onze Minister eens per jaar in kennis van de gegevens waarover zij
      ingevolge het eerste en het tweede lid beschikt.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel177
  - number: '178'
    text: |-
      1 Een onderneming met zetel buiten de Unie die een deelneming heeft verworven in een onderneming met zetel
      in Nederland die in het bezit is van een vergunning als bedoeld in [artikel 24, eerste lid][ref1], waardoor
      deze haar dochtermaatschappij is geworden, doet daarvan onverwijld schriftelijk mededeling aan de Pensioen- &
      Verzekeringskamer.

      2 De Pensioen- & Verzekeringskamer stelt de Commissie van de Europese Gemeenschappen in kennis van elke verwerving
      van een deelneming als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
