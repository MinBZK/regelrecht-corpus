    text: |-
      Een verzekeraar wiens solvabiliteitsmarge niet voldoet aan de bij of krachtens deze wet gestelde eisen, doet aan de
      Pensioen- & Verzekeringskamer binnen de door haar te bepalen termijn en op de door haar te bepalen wijze opgave van
      de in [artikel 67][ref1] bedoelde waarden en van de wijzigingen die daarin vervolgens optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel67
