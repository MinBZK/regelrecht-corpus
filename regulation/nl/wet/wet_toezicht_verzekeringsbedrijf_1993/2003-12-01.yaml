  - number: '166'
    text: |-
      Een overdracht van rechten en verplichtingen ingevolge de machtiging, bedoeld in [artikel 156, derde lid][ref1],
      mag geen nadeel toebrengen aan de rechten van de overblijvende schuldeisers.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel156
