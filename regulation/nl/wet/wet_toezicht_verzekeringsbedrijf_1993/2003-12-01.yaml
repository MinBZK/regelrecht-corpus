    text: |-
      Alvorens de Pensioen- & Verzekeringskamer ten behoeve van het financiële toezicht op een in een andere lid-staat
      gelegen bijkantoor ter plaatse inzage als bedoeld in [artikel 57, eerste lid][ref1], neemt of doet nemen, stelt zij
      daaromtrent de toezichthoudende autoriteit van die lid-staat in kennis.


