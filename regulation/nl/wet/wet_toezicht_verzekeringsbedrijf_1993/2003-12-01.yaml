  - number: '53'
    text: |-
      Een levensverzekeraar draagt er zorg voor dat in individuele overeenkomsten van levensverzekering die een looptijd
      van meer dan zes maanden hebben, uitdrukkelijk wordt bepaald dat de verzekeringnemer beschikt over een termijn van
      ten minste twee weken, gerekend vanaf het tijdstip waarop de verzekeringnemer ervan in kennis wordt gesteld dat de
      overeenkomst is gesloten, om de overeenkomst met onmiddellijke ingang schriftelijk op te zeggen. De kennisgeving
      van de verzekeraar geschiedt schriftelijk binnen vier weken na het sluiten van de overeenkomst. De opzegging door
      de verzekeringnemer heeft ten gevolge dat hij en de verzekeraar met ingang van het tijdstip waarop de verzekeraar
      deze opzegging heeft ontvangen, worden ontheven van alle uit deze overeenkomst voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel53
  - number: '54'
    text: |-
      1 Indien de Pensioen- & Verzekeringskamer zulks noodzakelijk acht in het belang van degenen die als
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen betrokken zijn of zullen worden bij overeenkomsten
      van verzekering, gesloten of te sluiten door een verzekeraar, kan zij die verzekeraar een aanwijzing geven.

      2 De verzekeraar volgt een aanwijzing binnen de door de Pensioen- & Verzekeringskamer gestelde termijn op.

      3 Indien de Pensioen- & Verzekeringskamer niet binnen twee weken na de bekendmaking van de aanwijzing een
      haar bevredigend antwoord van de verzekeraar heeft ontvangen of naar haar oordeel niet of onvoldoende aan haar
      aanwijzing is gevolg gegeven, kan zij:

      a. de verzekeraar aanzeggen, dat vanaf een bepaald tijdstip alle of bepaalde organen van de verzekeraar, daaronder
      voor de toepassing van dit artikel de vertegenwoordiger begrepen, hun bevoegdheden slechts mogen uitoefenen na
      toestemming door een of meer door de Pensioen- & Verzekeringskamer aangewezen personen en met inachtneming van de
      opdrachten van deze personen, welke aanzegging terstond van kracht wordt;

      b. de verzekeraar aanzeggen, dat de Pensioen- & Verzekeringskamer van de aanwijzing mededeling zal doen in de
      *Staatscourant* en in een of meer dagbladen te harer keuze, bij welke mededeling, indien de verzekeraar dit
      verlangt, tevens de correspondentie wordt gepubliceerd, die naar aanleiding van de aanwijzing tussen de Pensioen- &
      Verzekeringskamer en de verzekeraar is gevoerd.

      4 Indien het in het eerste lid bedoelde belang onverwijld ingrijpen noodzakelijk maakt, kan de Pensioen- &
      Verzekeringskamer zonder toepassing van het eerste lid onmiddellijk uitvoering geven aan onderdeel *a* van het
      derde lid, nadat zij de verzekeraar in de gelegenheid heeft gesteld zijn mening over de onmiddellijke uitvoering
      te geven.

      5 De organen van de verzekeraar verlenen de door de Pensioen- & Verzekeringskamer aangewezen personen alle
      medewerking. De Pensioen- & Verzekeringskamer kan de betrokken organen van de verzekeraar toestaan bepaalde
      handelingen zonder machtiging te verrichten.

      6 De door de Pensioen- & Verzekeringskamer aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste
      twee jaren na de bekendmaking van de aanzegging, bedoeld in het derde lid, onderdeel *a*, behoudens de bevoegdheid
      van de Pensioen- & Verzekeringskamer om deze termijn te verlengen telkens voor ten hoogste een jaar. Een zodanige
      verlenging maakt de Pensioen- & Verzekeringskamer aan de verzekeraar bekend. De verlenging wordt terstond
      van kracht. De Pensioen- & Verzekeringskamer kan te allen tijde de door haar aangewezen personen door anderen
      vervangen.

      7 Voor schade ten gevolge van handelingen, welke zijn verricht in strijd met een aanzegging als bedoeld in het
      derde lid, onderdeel *a*, zijn degenen, die deze handelingen als orgaan van de verzekeraar verrichten, persoonlijk
      aansprakelijk tegenover de verzekeraar. De verzekeraar kan de ongeldigheid van deze handelingen inroepen, indien de
      wederpartij wist, dat de vereiste toestemming ontbrak of daarvan niet onkundig kon zijn.

      8 De Pensioen- & Verzekeringskamer trekt in elk geval de maatregel, bedoeld in het derde lid, onderdeel *a*, in
      zodra zij van oordeel is, dat het in het eerste lid bedoelde belang deze maatregel niet langer noodzakelijk maakt.

      9 De werking van het besluit tot publikatie van een aanwijzing, bedoeld in het derde lid, onderdeel *b*, wordt
      opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist. Indien
      de verzekeraar na de publikatie alsnog voldoet aan de aanwijzing doet de Pensioen- & Verzekeringskamer hiervan op
      dezelfde wijze mededeling als bij de voorafgaande publikatie.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel54
  - number: 54a
    text: |-
      1 Indien een verzekeraar tot een groep behoort en de deskundigheid of betrouwbaarheid van de in
      [artikel 29, derde en vierde lid][ref1], bedoelde personen naar het oordeel van de Pensioen- & Verzekeringskamer
      niet langer buiten twijfel staat, kan deze aan de personen of instellingen die via een formele of feitelijke
      zeggenschapsstructuur het beleid bepalen van de groep waartoe de verzekeraar behoort, de aanwijzing geven dat de
      eerstgenoemde personen het beleid van die verzekeraar niet meer kunnen bepalen of mede bepalen.

      2 De personen en instellingen tot wie de aanwijzing is gericht, volgen deze binnen de door de Pensioen- &
      Verzekeringskamer gestelde termijn op.

      3 De personen en instellingen tot wie de aanwijzing is gericht, informeren de Pensioen- & Verzekeringskamer binnen
      de door haar gestelde termijn over de maatregelen die zijn getroffen om aan de aanwijzing gevolg te geven.

      4 De verzekeraar geeft geen gevolg aan algemene of bijzondere instructies van personen op wie een aanwijzing van de
      Pensioen- & Verzekeringskamer als bedoeld in het eerste lid betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel29
