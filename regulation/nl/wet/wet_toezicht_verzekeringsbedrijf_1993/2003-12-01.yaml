  - number: '117'
    text: |-
      [Artikel 112][ref1] is van overeenkomstige toepassing, met dien verstande dat de Pensioen- & Verzekeringskamer
      haar verzoek richt aan de toezichthoudende autoriteit van de lid-staat waar zich het betrokken bijkantoor van de
      verzekeraar bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel112
