  - number: '128'
    text: |-
      1 Een verzekeraar met zetel in Nederland kan zich zonder schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer niet omzetten in een andere rechtsvorm.

      2 Een aanvraag ter verkrijging van toestemming van de Pensioen- & Verzekeringskamer tot omzetting gaat vergezeld
      van een ontwerp van een notariële akte van omzetting die de nieuwe statuten bevat met alle ter toelichting dienende
      stukken.

      3 Indien met toestemming van de Pensioen- & Verzekeringskamer omzetting heeft plaatsgevonden, doet de verzekeraar
      van de omzetting mededeling in de *Staatscourant* en op andere door de Pensioen- & Verzekeringskamer te bepalen
      wijze. Voor zover door de verzekeraar in de uitoefening van het directe schadeverzekeringsbedrijf risico’s zijn
      verzekerd die in een andere lid-staat dan Nederland zijn gelegen, doet de verzekeraar van de omzetting tevens
      mededeling in die lid-staat. De inhoud van deze publikaties behoeft de voorafgaande toestemming van de Pensioen-
      & Verzekeringskamer.

      4 De bij een omzetting betrokken verzekeringnemers kunnen gedurende drie maanden na dagtekening
      van de *Staatscourant* waarin de publikatie is geplaatst de overeenkomst van schadeverzekering
      schriftelijk opzeggen met ingang van de dag na afloop van deze termijn. De verzekeraar geeft alsdan
      de vooruitbetaalde premie alsmede de voldane assurantiebelasting en de omslagbijdragen, bedoeld
      in de [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] en de
      [Wet op de toegang tot ziektekostenverzekeringen][ref2] terug voor het gedeelte dat evenredig is aan het op de
      hiervoor bedoelde dag nog niet verstreken gedeelte van de termijn waarvoor de premie, de assurantiebelasting en de
      omslagbijdragen werden betaald.

      5 Indien bij de omzetting het lidmaatschap van een onderlinge waarborgmaatschappij is verkregen, eindigt in geval
      van opzegging overeenkomstig het vierde lid dit lidmaatschap van rechtswege eveneens met ingang van de dag na
      afloop van de termijn, bedoeld in dat lid.

      6 De Pensioen- & Verzekeringskamer stelt de toezichthoudende autoriteiten van de lid-staten op het grondgebied
      waarvan een bijkantoor van de verzekeraar is gelegen, alsmede de toezichthoudende autoriteiten van de lid-staten
      waarheen de verzekeraar vanuit Nederland diensten verricht, in kennis van de omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0003933
      [ref2]: https://wetten.overheid.nl/BWBR0003934
