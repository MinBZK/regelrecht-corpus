        artikel: '24'
        hoofdstuk: II
        afdeling: '1'
  - number: '42'
    text: |-
      1 Een verzekeraar die een vergunning aanvraagt dient:

      a. naar het recht van de staat van zijn zetel rechtspersoon te zijn;

      b. in de staat van zijn zetel bevoegd te zijn tot uitoefening van het betrokken directe verzekeringsbedrijf,
      dit bedrijf vanuit een vestiging in die staat daadwerkelijk uit te oefenen en bevoegd te zijn een bijkantoor in
      Nederland te openen;

      c. met betrekking tot zijn gehele in en buiten Nederland uitgeoefende verzekeringsbedrijf over een
      solvabiliteitsmarge te beschikken, die ten minste overeenkomt met de ingevolge [artikel 68][ref1] vereiste
      solvabiliteitsmarge;

      d. met inachtneming van [artikel 96, tweede lid][ref2], te beschikken over het minimum bedrag van het garantiefonds
      dat krachtens [artikel 96, eerste lid][ref3], voor de betrokken branche of branches geldt dan wel over de
      solvabiliteitsmarge die krachtens [artikel 96, eerste lid][ref4], is vereist op grond van de reeds door hem
      uitgeoefende branches, indien deze solvabiliteitsmarge hoger is dan bedoeld minimum bedrag;

      e. ten minste de helft van het in onderdeel *d* bedoelde minimum bedrag van het garantiefonds aan te houden in bij
      of krachtens algemene maatregel van bestuur te bepalen waarden volgens de daarbij te stellen regels;

      f. te beschikken over financiële middelen tot dekking van de te verwachten kosten voor de inrichting van de
      administratie en van het produktienet in Nederland.

      2 In de bij of krachtens algemene maatregel van bestuur te stellen regels, bedoeld in het eerste lid, onderdeel
      *e*, kan worden voorgeschreven dat de verzekeraar voor bepaalde handelingen toestemming van de Pensioen- &
      Verzekeringskamer behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel96
