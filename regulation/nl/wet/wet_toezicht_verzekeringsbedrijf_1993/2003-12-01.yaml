  - number: '151'
    text: |-
      1 Houdt de verzekeraar op te bestaan, dan vervallen de aan hem verleende vergunningen. Artikel 150, tweede en derde
      lid, is van overeenkomstige toepassing.

      2 Herleeft de rechtspersoon vervolgens, dan is [artikel 152][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel152
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel151
