  - number: '162'
    text: |-
      Ingevolge de hun verleende machtiging kunnen de bewindvoerders, ongeacht hetgeen daaromtrent bij de statuten van de
      verzekeraar is bepaald:

      a. alle nog niet gedane stortingen op de aandelen in het geplaatste kapitaal onderscheidenlijk het waarborgkapitaal
      van een verzekeraar uitschrijven en innen;

      b. naheffingen opleggen en innen tot het in de statuten van een onderlinge waarborgmaatschappij met zetel in
      Nederland of van een onderneming dan wel instelling op onderlinge grondslag met zetel buiten Nederland bepaalde
      maximum.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel162
  - number: '163'
    text: |-
      1 Het uitspreken van de noodregeling heeft tot gevolg dat de verzekeraar niet kan worden genoodzaakt tot betaling
      van zijn schulden die voor het uitspreken van de noodregeling zijn ontstaan. Alle uit dien hoofde aangevangen
      executies worden geschorst en gelegde beslagen vervallen. [Artikel 36 van de Faillissementswet][ref1] is van
      overeenkomstige toepassing op de in de eerste zin bedoelde schulden.

      2 Het eerste lid is van overeenkomstige toepassing op vorderingen als bedoeld in [artikel 171, vierde lid][ref2].

      3 Onverminderd het bepaalde in [artikel 163a][ref3], geldt het in het eerste lid bepaalde niet voor:

      a. vorderingen die door pand of hypotheek op goederen van de verzekeraar zijn gedekt;

      b. termijnen van huurkoop.

      4 Voor zover vorderingen die door pand of hypotheek zijn gedekt, niet op de daaraan onderworpen goederen kunnen
      worden verhaald, werkt de uitspraak wel ten aanzien van deze vorderingen.

      5 Het uitspreken van de noodregeling werkt niet ten voordele van de borgen en andere medeschuldenaren van de
      verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel163a
