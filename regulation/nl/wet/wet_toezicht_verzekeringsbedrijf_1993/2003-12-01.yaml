  - number: '136'
    text: |-
      1 Een verzekeraar met zetel in Nederland kan zich zonder schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer niet omzetten in een andere rechtsvorm.

      2 Een aanvraag ter verkrijging van toestemming van de Pensioen- & Verzekeringskamer tot omzetting gaat vergezeld
      van een ontwerp van een notariële akte van omzetting die de nieuwe statuten bevat met alle ter toelichting dienende
      stukken.

      3 Indien met toestemming van de Pensioen- & Verzekeringskamer omzetting heeft plaatsgevonden, doet de verzekeraar
      van de omzetting mededeling in de *Staatscourant* en op andere door de Pensioen- & Verzekeringskamer te bepalen
      wijze. Voor zover door de verzekeraar in dienstverrichting naar een andere lid-staat dan Nederland overeenkomsten
      in de uitoefening van het directe levensverzekeringsbedrijf zijn gesloten, doet de verzekeraar van de omzetting
      tevens mededeling in die lid-staat. De inhoud van deze publikaties behoeft de voorafgaande toestemming van de
      Pensioen- & Verzekeringskamer.

      4 De Pensioen- & Verzekeringskamer stelt de toezichthoudende autoriteiten van de lid-staten op het grondgebied
      waarvan een bijkantoor van de verzekeraar is gelegen, alsmede de toezichthoudende autoriteiten van de lid-staten
      waarheen de verzekeraar vanuit Nederland diensten verricht, in kennis van de omzetting.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel136
  - number: '137'
    text: |-
      1 Indien een verzekeraar met zetel in Nederland niet voldoet aan de bij of krachtens [artikel 66][ref1] gestelde
      eisen met betrekking tot de technische voorzieningen, kan de Pensioen- & Verzekeringskamer de vrije beschikking
      door de verzekeraar over zijn waarden, waar zij zich ook bevinden, beperken of hem verbieden om anders dan met
      schriftelijke machtiging van de Pensioen- & Verzekeringskamer te beschikken over deze waarden.

      2 Alvorens een beperking of een verbod uit te vaardigen, stelt de Pensioen- & Verzekeringskamer de toezichthoudende
      autoriteiten in de andere lid-staten waar de verzekeraar een bijkantoor heeft of waarheen hij vanuit zijn
      vestigingen in de Unie diensten verricht, op de hoogte van haar voornemen.

      3 De Pensioen- & Verzekeringskamer kan de autoriteiten, bedoeld in het tweede lid, verzoeken overeenkomstige
      maatregelen te treffen ten aanzien van de in de betrokken lid-staten aanwezige waarden, onder opgave van die
      waarden.

      4 De beperking of het verbod wordt door de Pensioen- & Verzekeringskamer door middel van een deurwaardersexploot
      aan de verzekeraar bekendgemaakt.

      5 De verzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.

      6 De Pensioen- & Verzekeringskamer heft de beperking of het verbod op zodra de verzekeraar weer voldoet aan de in
      het eerste lid bedoelde eisen.

      7 De Pensioen- & Verzekeringskamer stelt de toezichthoudende autoriteiten, bedoeld in het tweede lid, in kennis van
      de uitvaardiging van de beperking of het verbod en de opheffing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel66
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel137
