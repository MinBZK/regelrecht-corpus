      1 De Pensioen- & Verzekeringskamer kan een verzekeraar, categorieën van verzekeraars of alle verzekeraars
      voorschrijven dat bijzondere opgaven met een door de Pensioen- & Verzekeringskamer bepaalde frequentie en binnen
      een door haar bepaalde termijn worden ingediend.

      2 De modellen van de bijzondere opgaven worden bij ministeriële regeling vastgesteld. Deze opgaven worden niet
      openbaar gemaakt.

      3 De Pensioen- & Verzekeringskamer kan bepalen dat de bijzondere opgaven vergezeld gaan van een verklaring als
      bedoeld in [artikel 100, derde lid][ref1] of van een verklaring als bedoeld in [artikel 100a, eerste lid][ref2].


