  - number: 188o
    text: |-
      Degene jegens wie door de Pensioen- & Verzekeringskamer een handeling is verricht waaraan hij in redelijkheid
      de gevolgtrekking kan verbinden dat de Pensioen- & Verzekeringskamer zijn handelen of nalaten op grond van
      [artikel 188n][ref1] ter openbare kennis zal brengen, is niet verplicht ter zake daarvan enige verklaring af te
      leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188n
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188o
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188n
        hoofdstuk: XI_C
  - number: 188p
    text: |-
      1 De Pensioen- & Verzekeringskamer geeft, indien zij voornemens is op grond van [artikel 188n][ref1] een feit
      ter openbare kennis te brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen
      berust.

      2 In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref2], is de Pensioen- & Verzekeringskamer
      niet gehouden de betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de
      betrokkene geen adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188n
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188p
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188n
        hoofdstuk: XI_C
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:8
  - number: 188q
    text: |-
      De beschikking om op grond van [artikel 188n][ref1] een feit ter openbare kennis te brengen vermeldt in ieder
      geval:

        - het feit dat ter openbare kennis wordt gebracht;
        - de wijze waarop het feit ter openbare kennis wordt gebracht; en
        - de termijn waarna het feit ter openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188n
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188q
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188n
        hoofdstuk: XI_C
  - number: 188r
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 188n][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188n
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188r
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188n
        hoofdstuk: XI_C
  - number: 188s
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht](onbekend) treedt de beschikking in werking op de
      dag waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of,
      indien beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het
      adres ook niet met een redelijke inspanning kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188s
  - number: 188t
    text: |-
      1 De bevoegdheid om op grond van [artikel 188n][ref1] een feit ter openbare kennis te brengen vervalt indien ter
      zake van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen,
      dan wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].

      2 Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 188n][ref3] vervalt, indien de
      Pensioen- & Verzekeringskamer het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188n
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel188n
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188t
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188n
        hoofdstuk: XI_C
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: 188n
        hoofdstuk: XI_C
  - number: 188u
    text: |-
      1 De bevoegdheid om op grond van [artikel 188n][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na
      de dag waarop het feit heeft plaats gehad.

      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188n
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188u
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188n
        hoofdstuk: XI_C
  - number: 188v
    text: |-
      De werkzaamheden in verband met het op grond van artikel 188n ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188v
  - number: '189'
    text: |-
      1 De aanwijzing van een rechtspersoon als Verzekeringskamer, door Onze Minister en Onze Minister van Sociale Zaken
      en Werkgelegenheid gedaan op grond van artikel 2 van de Wet toezicht verzekeringsbedrijf, wordt beschouwd te zijn
      gedaan op grond van [artikel 3][ref1].

      2 De benoemingen van de voorzitter en de andere leden van het bestuur alsmede de benoemingen van de
      voorzitter en de andere leden van de raad van toezicht van de Verzekeringskamer ingevolge het bepaalde
      in artikel 2, van de Wet toezicht verzekeringsbedrijf, worden beschouwd te zijn gedaan op grond van
      [artikel 6, eerste onderscheidenlijk tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel6
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel189
    references:
      - id: ref1
