  - number: '111'
    text: |-
      1 Een verzekeraar met zetel in een andere lid-staat dan Nederland die voornemens is vanuit een vestiging in de
      Unie voor de eerste maal diensten te verrichten naar Nederland, kan daarmee aanvangen nadat de toezichthoudende
      autoriteit van de lid-staat van de zetel de Pensioen- & Verzekeringskamer schriftelijk van dit voornemen in kennis
      heeft gesteld, onder bijvoeging van:

      a. een verklaring dat de verzekeraar beschikt over de vereiste solvabiliteitsmarge;

      b. een opgave van de branches waarvoor de verzekeraar een vergunning bezit;

      c. een opgave van de aard van de:

      1°. in Nederland gelegen risico’s die de schadeverzekeraar voornemens is te dekken;

      2°. overeenkomsten die de levensverzekeraar voornemens is te sluiten; en

      d. indien de verzekeraar risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen wenst te dekken:

      1°. een schriftelijk bewijs waaruit blijkt dat de verzekeraar is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];

      2°. een schriftelijk bewijs waaruit blijkt dat de verzekeraar zich heeft gemeld bij het Waarborgfonds Motorverkeer
      teneinde te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24][ref2], eerste lid,
      en [24][ref3];

      3°. een opgave van naam en adres van de schade-afhandelaar, bedoeld in [artikel 109, eerste lid, onderdeel ][ref4].

      2 Indien de verzekeraar voornemens is een wijziging aan te brengen in de aard van de risico’s of van de
      overeenkomsten ten opzichte van de opgave, bedoeld in het eerste lid, onderdeel *c*, is het eerste lid van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel109
