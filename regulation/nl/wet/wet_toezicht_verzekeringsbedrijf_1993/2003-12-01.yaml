  - number: '172'
    text: |-
      1 In geval van noodregeling overeenkomstig dit hoofdstuk of van faillissement van een verzekeraar met
      zetel in een andere lid-staat dan Nederland worden de boedelschulden, overeenkomstig de bepalingen van de
      [Faillissementswet][ref1], al naar gelang de aard van de betrokken boedelschuld hetzij mede over de in Nederland
      aanwezige waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de bijkantoren in Nederland
      aangegane verplichtingen uit of krachtens overeenkomsten van verzekering omgeslagen, hetzij uitsluitend van een
      bepaalde bate van de boedel afgetrokken.

      2 [Artikel 171, tweede tot en met vijfde lid][ref2], is van overeenkomstige toepassing ten aanzien van de in
      Nederland aanwezige waarden van de verzekeraar die dienen tot dekking van de technische voorzieningen voor de
      vanuit de bijkantoren in Nederland aangegane verplichtingen uit of krachtens overeenkomsten van verzekering.
      Artikel 171, zesde lid, is van overeenkomstige toepassing.


