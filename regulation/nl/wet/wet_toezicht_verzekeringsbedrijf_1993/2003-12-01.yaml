  - number: 69g
    text: |-
      1 De Pensioen- & Verzekeringskamer kan de op grond van deze paragraaf vereiste informatie alleen rechtstreeks van
      de in [artikel 69d, eerste lid][ref1], bedoelde betrokken ondernemingen vragen indien die informatie eerst aan de
      verzekeraar met zetel in Nederland is gevraagd, maar niet is verkregen.

      2 De Pensioen- & Verzekeringskamer kan de in het eerste lid bedoelde informatie verifiëren bij:

      a. de aan het toezicht, bedoeld in [artikel 69c][ref2], onderworpen verzekeraar;

      b. de dochterondernemingen van deze verzekeraar;

      c. de moederondernemingen van deze verzekeraar;

      d. de dochterondernemingen van een moederonderneming van deze verzekeraar.

      3 Indien de toezichthoudende autoriteit van een andere lid-staat dan Nederland belangrijke informatie
      wenst te verifiëren betreffende een in Nederland gevestigde onderneming die een verbonden verzekeraar, een
      dochteronderneming, een moederonderneming of een dochteronderneming van een moederonderneming van de aan het
      toezicht, bedoeld in [artikel 69c][ref3], onderworpen verzekeraar is, verricht de Pensioen- & Verzekeringskamer een
      door die toezichthoudende autoriteit gevraagde verificatie binnen het kader van haar bevoegdheden dan wel verleent
      zij toestemming aan die toezichthoudende autoriteit om de verificatie zelf te verrichten dan wel staat zij toe dat
      de verificatie door een deskundige wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel69d
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
