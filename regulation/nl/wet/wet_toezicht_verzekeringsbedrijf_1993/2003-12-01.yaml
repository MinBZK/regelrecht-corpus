  - number: '194'
    text: |-
      1 Een verklaring van geen bezwaar die is verleend op grond van [artikel 81][ref1] van de Wet toezicht
      verzekeringsbedrijf en die op het tijdstip waarop deze wet in werking treedt niet is vervallen of ingetrokken,
      wordt beschouwd te zijn verleend op grond van [artikel 176][ref2] voor de in de [artikelen 174][ref3] en
      [175][ref4] genoemde handelingen die overeenkomen met de handelingen waarvoor de verklaring van geen bezwaar was
      verleend, met dien verstande dat voor zover die verklaring van geen bezwaar betrekking heeft op het verwerven of
      vergroten van een deelneming of het uitoefenen van zeggenschap die tevens wordt beschouwd te zijn verleend voor
      het houden van een gekwalificeerde deelneming als bedoeld in de [artikelen 1, eerste lid, onderdeel ][ref5], en
      [174, tweede lid][ref6].

      2 Ten aanzien van handelingen waarop het eerste lid niet van toepassing is en waarvoor ingevolge de
      [artikelen 174][ref7] of [175][ref8] een verklaring van geen bezwaar is vereist en waarop [artikel 81][ref9]
      van de Wet toezicht verzekeringsbedrijf niet van toepassing was, blijven de verboden als bedoeld in
      [de artikelen 174][ref10] en [175][ref11] buiten toepassing tot de eerste dag van de negende kalendermaand na het
      tijdstip van inwerkingtreding van deze wet.

      3 Ten aanzien van een gekwalificeerde deelneming als bedoeld in de [artikelen 1, eerste lid, onderdeel ][ref12], en
      [174, tweede lid][ref13], die reeds werd gehouden voor het tijdstip van inwerkingtreding van deze wet en waarvoor
      ingevolge de [artikelen 174][ref14] onderscheidenlijk [175][ref15] een verklaring van geen bezwaar vereist is,
      wordt de verzekeraar als bedoeld in [artikel 174, eerste lid][ref16], onderscheidenlijk de natuurlijke persoon of
      rechtspersoon als bedoeld in [artikel 175, eerste lid][ref17], beschouwd te beschikken over een verklaring van geen
      bezwaar als bedoeld in [artikel 174, eerste lid][ref18], onderscheidenlijk [artikel 175, eerste lid][ref19].


