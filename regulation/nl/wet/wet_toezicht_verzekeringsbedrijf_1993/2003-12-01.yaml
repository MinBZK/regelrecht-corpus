        paragraaf: '4'
        afdeling: '1'
  - number: '64'
    text: |-
      1 Een verzekeraar met zetel in Nederland mag geen ander bedrijf dan hetzij het schadeverzekeringsbedrijf hetzij het
      levensverzekeringsbedrijf uitoefenen.

      2 Een schadeverzekeraar mag geen schaden verzekeren, veroorzaakt door of ontstaan uit gewapend conflict,
      burgeroorlog, opstand, binnenlandse onlusten, oproer en muiterij. In overeenkomsten van zee-, transport-,
      luchtvaart- en reisverzekering mogen evenwel de algemeen gebruikelijke molestclausules worden opgenomen zolang de
      Pensioen- & Verzekeringskamer daartegen geen bedenkingen naar voren heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel64
  - number: '65'
    text: |-
      Een levensverzekeraar doet binnen twee weken na het voor de eerste maal sluiten van een nieuw type overeenkomst van
      verzekering aan de Pensioen- & Verzekeringskamer opgave van de technische grondslagen voor de berekening van het
      desbetreffende tarief en van de desbetreffende technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel65
  - number: '66'
    text: |-
      1 Een verzekeraar met zetel in Nederland houdt toereikende technische voorzieningen aan.

      2 Een levensverzekeraar stelt, rekening houdend met alle financiële aspecten van zijn onderneming, de premies voor
      te sluiten overeenkomsten van verzekering op adequate wijze vast.

      3

      4 Bij of krachtens algemene maatregel van bestuur kunnen ter zake van het eerste tot en met het derde lid nadere
      regels worden gesteld.

      5 De technische voorzieningen worden volledig door waarden gedekt, ten aanzien waarvan is voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen regels. De Pensioen- & Verzekeringskamer kan tegen de aard en
      de waardering van deze waarden bedenkingen naar voren brengen, aan welke bedenkingen de verzekeraar dient tegemoet
      te komen.

      6 De waarden die dienen tot dekking van de technische voorzieningen moeten in toereikende mate in dezelfde
      muntsoort kunnen worden geïnd of te gelde gemaakt als die waarin de verplichtingen luiden. Deze waarden moeten
      in de Unie aanwezig zijn voor zover zij dienen tot dekking van de technische voorzieningen voor aangegane
      verplichtingen indien wat schadeverzekeraars betreft het risico in de Unie is gelegen en wat levensverzekeraars
      betreft de verzekeringnemer zijn gewone verblijfplaats in de Unie heeft, of, indien de verzekeringnemer een
      rechtspersoon is, de vestiging van deze rechtspersoon waarop de verzekering betrekking heeft, zich in de Unie
      bevindt.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het
      bepaalde in het zesde lid. Daarbij kan tevens worden bepaald dat en in hoeverre de Pensioen- & Verzekeringskamer
      vrijstelling of ontheffing kan verlenen van gegeven voorschriften. Aan een vrijstelling en een ontheffing kunnen
      beperkingen worden gesteld of voorschriften worden verbonden en zij kunnen worden ingetrokken.

      8 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat en in hoeverre vorderingen op
      herverzekeraars als de waarden, bedoeld in het vijfde lid, in aanmerking kunnen worden genomen. Ten aanzien van
      deze waarden is het zesde lid, laatste volzin, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel66
  - number: '67'
    text: |-
      1 De waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de vestigingen in een lid-staat
      aangegane verplichtingen uit of krachtens overeenkomsten van verzekering, worden als zodanig door de verzekeraar
      per lid-staat geadministreerd.

      2 In een der staten, bedoeld in [artikel 72][ref1], vermeldt de verzekeraar de bedragen die de in het eerste lid
      bedoelde waarden per categorie, als aangegeven in de desbetreffende staat, in totaal belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel72
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel67
    references:
      - id: ref1
