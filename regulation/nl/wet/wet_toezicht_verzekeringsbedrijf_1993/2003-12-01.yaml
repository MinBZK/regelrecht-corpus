  - number: '63'
    text: |-
      De [artikelen 58 tot en met 62][ref1] zijn niet van toepassing op:

      a. de door een verzekeraar verleende rechtsbijstand voor zover deze betrekking heeft op risico’s die verband houden
      met het gebruik van zeeschepen;

      b. de door een verzekeraar als bijkomend risico bij de branche Hulpverlening verleende rechtsbijstand in een andere
      staat dan die waar de verzekerde zijn woonplaats heeft voor zover:

      1°. deze rechtsbijstand deel uitmaakt van een overeenkomst van verzekering die alleen betrekking heeft op
      hulpverlening; en

      2°. in de overeenkomst afzonderlijk is verklaard dat de rechtsbijstanddekking is beperkt tot de in dit onderdeel
      bedoelde omstandigheden en slechts een aanvulling vormt op de hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel58
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel63
