  - number: '112'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan de toezichthoudende autoriteit van de lid-staat van de zetel van een
      verzekeraar na afloop van het boekjaar verzoeken om een opgave, waarin zijn vermeld:

      a. met betrekking tot een schadeverzekeraar de in dat boekjaar in dienstverrichting naar Nederland per lid-staat en
      per branchegroep geboekte premies, schaden en provisies, telkens zonder aftrek van herverzekering;

      b. met betrekking tot een levensverzekeraar de in dat boekjaar in dienstverrichting naar Nederland per lid-staat en
      per branche geboekte premies, zonder aftrek van herverzekering.

      2 De in het eerste lid, onderdeel *a*, bedoelde gegevens, alsmede de frequentie en de gemiddelde kosten van de
      schadegevallen, worden voor de branche Aansprakelijkheid motorrijtuigen evenwel afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel112
  - number: '113'
    text: |-
      1 Een verzekeraar met zetel in een andere lid-staat dan Nederland die voornemens is vanuit een bijkantoor buiten de
      Unie voor de eerste maal diensten te verrichten naar Nederland, legt aan de Pensioen- & Verzekeringskamer over:

      a. een verklaring, afgegeven door de toezichthoudende autoriteit van de lid-staat van de zetel:

      1°. dat de verzekeraar beschikt over de vereiste solvabiliteitsmarge;

      2°. dat de door haar aan de verzekeraar verleende vergunning hem in staat stelt vanuit de staat van het bijkantoor
      diensten te verrichten; en

      3°. waarin de branches zijn vermeld waarvoor de verzekeraar in de lid-staat van de zetel een vergunning bezit;

      b. een opgave van de aard van de:

      1°. in Nederland gelegen risico’s die de schadeverzekeraar voornemens is te dekken;

      2°. overeenkomsten die de levensverzekeraar voornemens is te sluiten; en

      c. bescheiden waaruit de bevoegdheid, bedoeld in [artikel 108][ref1], blijkt.

      2 Indien de verzekeraar risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen wenst
      te dekken, legt hij aan de Pensioen- & Verzekeringskamer tevens over bescheiden als bedoeld in
      [artikel 111, eerste lid, onderdeel ][ref2].

      3 De verzekeraar kan het verrichten van diensten aanvangen vanaf de officieel bevestigde datum van ontvangst door
      de Pensioen- & Verzekeringskamer van de in het eerste of tweede lid bedoelde bescheiden.

      4 Indien de verzekeraar voornemens is een wijziging aan te brengen in de aard van de risico’s of van de
      overeenkomsten ten opzichte van de opgave, bedoeld in het eerste lid, onderdeel *b*, zijn het eerste tot en met
      derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel111
