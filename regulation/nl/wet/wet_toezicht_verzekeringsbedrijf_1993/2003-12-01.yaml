  - number: '131'
    text: |-
      1 Indien de Pensioen- & Verzekeringskamer tegen het ontwerp aanvankelijk geen bedenkingen heeft of nadat aan deze
      bedenkingen is tegemoetgekomen, doet de verzekeraar van zijn voornemen tot overdracht van rechten en verplichtingen
      mededeling in de *Staatscourant* en op andere door de Pensioen- & Verzekeringskamer te bepalen wijze. Daarbij wordt
      mededeling gedaan van een door de Pensioen- & Verzekeringskamer vast te stellen termijn, binnen welke de betrokken
      polishouders zich bij de Pensioen- & Verzekeringskamer schriftelijk tegen de overdracht kunnen verzetten.

      2 Indien polishouders, vertegenwoordigende een vierde of meer van het betrokken verzekerd bedrag, zich binnen de
      gestelde termijn tegen de overdracht hebben verzet, kan een overdracht niet volgen, ook niet ten aanzien van hen
      die zich tegen de overdracht niet hebben verzet. De Pensioen- & Verzekeringskamer maakt dit aan de verzekeraar
      bekend.

      3 Heeft de Pensioen- & Verzekeringskamer alsnog bedenkingen tegen de overdracht, dan maakt zij deze bedenkingen na
      afloop van de gestelde termijn aan de verzekeraar bekend.

      4 Indien zich niet binnen de gestelde termijn polishouders, vertegenwoordigende een vierde of meer van het
      betrokken verzekerd bedrag, tegen de overdracht hebben verzet en tegen de overdracht ook bij de Pensioen- &
      Verzekeringskamer geen bedenkingen bestaan of aan deze bedenkingen is tegemoetgekomen, verleent de Pensioen- &
      Verzekeringskamer de verzekeraar toestemming tot de overdracht. De overdracht kan dan volgen en is van kracht ten
      aanzien van alle belanghebbenden.

      5 De verzekeraar die zijn rechten en verplichtingen met toestemming van de Pensioen- & Verzekeringskamer heeft
      overgedragen, doet van de overdracht mededeling in de *Staatscourant* met vermelding van de datum waarop zij is
      geschied. Voor zover in de overdracht overeenkomsten zijn betrokken die in dienstverrichting naar een andere lid-
      staat zijn gesloten, doet de verzekeraar van de overdracht tevens mededeling in die lid-staat. De inhoud van deze
      publikaties behoeft de voorafgaande toestemming van de Pensioen- & Verzekeringskamer.

      6 Op een verzekeringnemer die lid is van een onderlinge waarborgmaatschappij met zetel in Nederland of van een
      onderneming dan wel instelling op onderlinge grondslag met zetel buiten de Unie is [artikel 123, derde lid][ref1],
      van overeenkomstige toepassing.

      7 In dit artikel wordt onder verzekerd bedrag verstaan het verzekerd kapitaal, vermeerderd met tienmaal de
      verzekerde jaarlijkse renten.

      8 Voor de toepassing van het eerste, tweede of vierde lid wordt onder polishouder verstaan de verzekeringnemer
      of zijn rechtsopvolger, doch indien een uitkering uit de verzekering opeisbaar is, de tot uitkering gerechtigde.
      Indien de verzekeringnemer bij een overeenkomst als bedoeld in [artikel 2][ref2], vierde lid, onderdeel B, of
      [artikel 9 van de Pensioen- en spaarfondsenwet][ref3] ontbreekt, wordt onder polishouder verstaan degene die wegens
      het verbreken van de band met de onderneming van zijn werkgever een premievrije aanspraak op uitkeringen heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel9
