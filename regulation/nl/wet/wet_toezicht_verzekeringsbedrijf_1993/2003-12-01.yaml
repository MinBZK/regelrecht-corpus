  - number: 165a
    text: |-
      1 Een vereniging waarvan ten minste 35% van de verzekeringnemers van de verzekeraar ten aanzien waarvan de
      noodregeling is uitgesproken lid is, kan zich aanmelden bij de bewindvoerders.

      2 De bewindvoerders horen de vereniging alvorens zij de bevoegdheden, bedoeld in [artikel 165, eerste lid][ref1],
      uitoefenen, indien deze op een door de bewindvoerders te bepalen moment ten genoegen van de bewindvoerders heeft
      aangetoond dat zij aan de in het eerste lid gestelde vereisten voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel165
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel165a
