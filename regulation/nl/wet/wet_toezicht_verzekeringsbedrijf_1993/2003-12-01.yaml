        artikel: '131'
        hoofdstuk: VI
  - number: 147m
    text: |-
      1 De Pensioen- & Verzekeringskamer stelt, gehoord de vertrouwenscommissie, het einde van de toepassing van het
      opvanginstrument vast.

      2 De Pensioen- & Verzekeringskamer maakt het einde van de toepassing van het opvanginstrument bekend aan de
      verzekeraar en de opvanginstelling.

      3 Indien na beëindiging van de toepassing van het opvanginstrument waarbij een portefeuille-overdracht heeft
      plaatsgevonden bij de opvanginstelling een batig saldo resteert, keert de opvanginstelling dit uit aan de
      verzekeraar ten behoeve waarvan het opvanginstrument is toegepast.

      4 De opvanginstelling trekt na beëindiging van de toepassing van het opvanginstrument in ieder geval de aandelen
      in die niet het minimumkapitaal, bedoeld in [artikel 67, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      vertegenwoordigen. De aandeelhouders werken hieraan mee.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel67
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147m
