  - number: '15'
    text: |-
      Het schadeverzekeringsbedrijf wordt onderscheiden naar branches, die de volgende benamingen dragen en waartoe de
      daaronder vermelde risico’s behoren.

      1. Ongevallen:

      a. forfaitaire uitkeringen ter zake van ongevallen en beroepsziekten;

      b. overige uitkeringen ter zake van ongevallen en beroepsziekten.

      2. Ziekte:

      a. forfaitaire uitkeringen ter zake van andere ziekten dan beroepsziekten;

      b. overige uitkeringen ter zake van andere ziekten dan beroepsziekten.

      3. Voertuigcasco:

      schaden aan motorrijtuigen en overige voertuigen, met uitzondering van schaden aan rollend spoorwegmaterieel.

      4. Casco rollend spoorwegmaterieel:

      schaden aan rollend spoorwegmaterieel.

      5. Luchtvaartuigcasco:

      schaden aan luchtvaartuigen.

      6. Casco zee- en binnenschepen:

      schaden aan zee- en binnenschepen.

      7. Vervoerde zaken:

      schaden aan vervoerde zaken of bagage, onafhankelijk van de aard van het transportmiddel.

      8. Brand en natuurevenementen:

      schaden aan zaken (met uitzondering van schaden, begrepen onder de branches Voertuigcasco, Casco rollend
      spoorwegmaterieel, Luchtvaartuigcasco, Casco zee- en binnenschepen en Vervoerde zaken), wanneer deze zijn
      veroorzaakt door brand, ontploffing, storm of andere natuurevenementen (met uitzondering van hagel en vorst),
      kernenergie of aardverzakking.

      9. Andere schaden aan zaken:

      schaden aan zaken (met uitzondering van schaden, begrepen onder de branches Voertuigcasco, Casco rollend
      spoorwegmaterieel, Luchtvaartuigcasco, Casco zee- en binnenschepen en Vervoerde zaken), wanneer deze zijn
      veroorzaakt door hagel of vorst, alsmede door alle overige evenementen die niet reeds zijn begrepen onder de
      branche Brand en natuurevenementen.

      10A. Aansprakelijkheid motorrijtuigen:

      aansprakelijkheden die voortvloeien uit het gebruik van motorrijtuigen (met uitzondering van de aansprakelijkheden,
      begrepen onder de branche Aansprakelijkheid wegvervoer).

      10B. Aansprakelijkheid wegvervoer:

      aansprakelijkheden die voor de vervoerder voortvloeien uit goederenvervoer over de weg (met uitzondering van de
      aansprakelijkheden, begrepen onder de branche Aansprakelijkheid motorrijtuigen).

      11. Aansprakelijkheid luchtvaartuigen:

      aansprakelijkheden die voortvloeien uit het gebruik van luchtvaartuigen, aansprakelijkheden van de vervoerder
      daaronder begrepen.

      12. Aansprakelijkheid zee- en binnenschepen:

      aansprakelijkheden die voortvloeien uit het gebruik van zee- en binnenschepen, aansprakelijkheden van de vervoerder
      daaronder begrepen.

      13. Algemene aansprakelijkheid:

      overige vormen van aansprakelijkheid die niet reeds zijn begrepen onder de branches Aansprakelijkheid
      motorrijtuigen, Aansprakelijkheid wegvervoer, Aansprakelijkheid luchtvaartuigen en Aansprakelijkheid zee- en
      binnenschepen.

      14. Krediet:

      schaden die het gevolg zijn van algemene insolventie, verleend exportkrediet, hypothecair krediet, landbouwkrediet
      en verkoop op afbetaling.

      15. Borgtocht:

      schaden die het gevolg zijn van verleende directe borgtocht en indirecte borgtocht.

      16. Diverse geldelijke verliezen:

      geldelijke verliezen die het gevolg zijn van niet onder een der andere branches vallende risico's.

      17. Rechtsbijstand:

      verleende diensten en gemaakte kosten in het bijzonder met het oog op verhaal van door een verzekerde
      geleden schade en diens verdediging of vertegenwoordiging, zowel in als buiten rechte (met uitzondering van
      de werkzaamheden ter verdediging of vertegenwoordiging van een verzekerde die een verzekeraar krachtens een
      overeenkomst van aansprakelijkheidsverzekering mede in zijn eigen belang verricht).

      18. Hulpverlening:

      onmiddellijke hulpverlening aan in moeilijkheden verkerende personen die op reis zijn of zich buiten hun woonplaats
      bevinden (met uitzondering van onderhoudsdiensten, dienstverlening na verkoop en de loutere aanwijzing omtrent of
      terbeschikkingstelling van hulp door een tussenpersoon).
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel15
  - number: '16'
    text: |-
      Het levensverzekeringsbedrijf wordt onderscheiden naar branches, die de volgende benamingen dragen.

      1. Levensverzekering algemeen:

      kapitaal-, pensioen- en lijfrenteverzekeringen, met uitzondering van de onder de branches 2 en 3 begrepen
      verzekeringen, verzekeringen in verband met de verzorging van de uitvaart van de mens die uitsluitend strekken
      tot het verrichten van andere dan geldelijke prestaties alsmede aanvullende verzekeringen als bedoeld in
      [artikel 1, tweede lid][ref1], zoals invaliditeitsverzekeringen en verzekeringen bij overlijden ten gevolge van
      een ongeval.

      2. Levensverzekering in verband met huwelijk of geboorte

      3. Levensverzekering verbonden met beleggingsfondsen

      4. Permanent health insurance:

      niet-opzegbare langlopende ziekteverzekeringen gesloten met ingezetenen van Ierland of het Verenigd Koninkrijk.

      5. Deelneming in spaarkassen

      6. Kapitalisatieverrichtingen:

      verrichtingen gebaseerd op een actuariële techniek tot sparen met het oog op kapitaalvorming, bestaande uit
      verplichtingen die in ruil voor eenmalige of periodieke stortingen voor wat betreft hun duur en hun bedrag bepaald
      zijn.

      7. Beheer over collectieve pensioenfondsen:

      beheer over de beleggingen van pensioenfondsen waaronder de waarden die tegenover de voorziening voor
      pensioenverplichtingen staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel16
