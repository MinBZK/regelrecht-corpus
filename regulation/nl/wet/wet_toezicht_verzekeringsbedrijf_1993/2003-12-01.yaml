        artikel: 69c
        hoofdstuk: III
        paragraaf: 3a
        afdeling: '2'
  - number: 69k
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 69c, tweede lid][ref1], berekent de aangepaste solvabiliteit
      overeenkomstig bij algemene maatregel van bestuur te stellen regels.

      2 Alle met de verzekeringsholding, de herverzekeraar of de verzekeraar met zetel buiten de Unie verbonden
      ondernemingen worden in de in het eerste lid bedoelde berekening betrokken.

      3 Indien de Pensioen- & Verzekeringskamer op grond van de berekening, bedoeld in het tweede lid, van mening is dat
      de solvabiliteit van een verzekeraar die een dochteronderneming is van de verzekeringsholding, de herverzekeraar
      of de verzekeraar met zetel buiten de Unie, in gevaar is of zou kunnen komen, neemt zij jegens die verzekeraar
      passende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel69k
