  - number: 69b
    text: |-
      De bevoegdheden die de Pensioen- & Verzekeringskamer op grond van deze paragraaf heeft jegens de in
      [artikel 69c][ref1] bedoelde verzekeraars laten onverlet dat zij haar overige bevoegdheden die zij op grond van
      deze wet heeft, kan toepassen.


