  - number: '181'
    text: |-
      1 Degene die als gemachtigde van een verzekeraar voor diens rekening een overeenkomst van verzekering heeft
      gesloten, draagt er zorg voor dat in de polis dan wel in een daaraan toegevoegd aanhangsel de naam van de
      verzekeraar en, in geval van co-assurantie, het aandeel dat hij namens de verzekeraar heeft geaccepteerd, wordt
      vermeld. In geval van een overeenkomst van schadeverzekering draagt hij er tevens zorg voor dat elke wijziging in
      het door hem namens de verzekeraar geaccepteerde aandeel in een aanhangsel wordt vermeld.

      2 Wordt, nadat de gemachtigde de overeenkomst van verzekering heeft gesloten of, in geval van een overeenkomst
      van schadeverzekering, het door de gemachtigde geaccepteerde aandeel in de overeenkomst is gewijzigd, niet
      of niet terstond aan de verzekeringnemer een polis of een aanhangsel afgegeven, dan stelt de gemachtigde de
      verzekeringnemer binnen vier weken na het sluiten van de overeenkomst of na het aanbrengen van de wijziging
      schriftelijk in kennis van de in het eerste lid bedoelde gegevens. Behoort de overeenkomst evenwel tot de
      portefeuille van een tussenpersoon als bedoeld in de [Wet assurantiebemiddelingsbedrijf][ref1], dan doet de
      gemachtigde binnen twee weken de kennisgeving aan deze tussenpersoon.

      3 Wordt, nadat een overeenkomst van verzekering is gesloten of, in geval van een overeenkomst van
      schadeverzekering, het door de verzekeraar geaccepteerde aandeel in de overeenkomst is gewijzigd, niet of niet
      terstond aan de verzekeringnemer een polis of een aanhangsel afgegeven, waarin de naam van de verzekeraar en, in
      geval van co-assurantie, diens aandeel of de daarin aangebrachte wijziging is vermeld, dan stelt de tussenpersoon
      tot wiens portefeuille de overeenkomst behoort de verzekeringnemer binnen vier weken na het sluiten van de
      overeenkomst of na het aanbrengen van de wijziging schriftelijk van deze gegevens in kennis.

      4 Het tweede en derde lid zijn niet van toepassing indien binnen de betrokken termijn de overeenkomst van
      verzekering is tenietgegaan en daaraan door de verzekeringnemer of andere belanghebbenden geen rechten meer kunnen
      worden ontleend.

      5 Met betrekking tot overeenkomsten van schadeverzekering die een gemachtigde namens een of meer verzekeraars heeft
      gesloten met verzekeringnemers die handelen in de uitoefening van een beroep of bedrijf dan wel rechtspersonen
      zijn, kan de Pensioen- & Verzekeringskamer toestaan dat - in afwijking van het eerste, tweede en derde lid - in de
      polis of een aanhangsel, dan wel in een schriftelijke kennisgeving als bedoeld in het tweede en derde lid, wordt
      volstaan met de vermelding van het aandeel dat de gemachtigde namens de gezamenlijke door hem vertegenwoordigde
      verzekeraars in de overeenkomst heeft geaccepteerd of van de wijziging die daarin is aangebracht, mits:

      a. de gemachtigde onder door de Pensioen- & Verzekeringskamer te stellen voorwaarden en op een door deze goed te
      keuren plaats de in het eerste lid bedoelde gegevens deponeert;

      b. in de polis of het aanhangsel en in de schriftelijke kennisgeving wordt verwezen naar de in onderdeel *a*
      bedoelde deponering.

      6 Het vijfde lid is met betrekking tot overeenkomsten van schadeverzekering die zijn gesloten met andere dan de
      in dat lid bedoelde verzekeringnemers, van overeenkomstige toepassing, met dien verstande dat in de polis die
      voor de eerste maal wordt afgegeven of in een daaraan toegevoegd aanhangsel, dan wel in een daaraan voorafgaande
      schriftelijke kennisgeving als bedoeld in het tweede of derde lid, de namen van de verzekeraars en de namens ieder
      hunner geaccepteerde aandelen worden vermeld. Indien daarin nadien wijzigingen worden aangebracht, die volgens
      richtlijnen van de Pensioen- & Verzekeringskamer als belangrijk zijn aan te merken, wordt de verzekeringnemer
      overeenkomstig het tweede en derde lid opnieuw schriftelijk in kennis gesteld van de namen van de verzekeraars en
      de namens ieder hunner geaccepteerde aandelen.

      7 De gemachtigde of de betrokken tussenpersoon stelt de verzekeringnemer desgevraagd met de meeste spoed
      schriftelijk in kennis van de naam van de verzekeraar en, in geval van co-assurantie, van de aandelen die de
      verzekeraars hebben geaccepteerd of van de wijzigingen die daarin zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004993
