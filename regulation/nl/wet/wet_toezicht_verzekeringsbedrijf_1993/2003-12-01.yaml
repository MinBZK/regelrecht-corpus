  - number: '46'
    text: |-
      Indien de stukken die bij de aanvraag van een vergunning zijn overgelegd, de Pensioen- & Verzekeringskamer
      aanleiding geven tot het maken van opmerkingen, stelt zij de verzekeraar in de gelegenheid op deze opmerkingen
      binnen een door haar te stellen termijn te antwoorden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel46
  - number: '47'
    text: |-
      De Pensioen- & Verzekeringskamer verleent een vergunning aan ieder die te haren genoegen heeft aangetoond dat hij
      aan de bij of krachtens deze wet gestelde eisen voor het verkrijgen van de vergunning voldoet.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel47
  - number: '48'
    text: |-
      1 De Pensioen- & Verzekeringskamer beslist binnen acht weken. Indien toepassing is gegeven aan [artikel 46][ref1],
      begint de in de eerste volzin genoemde termijn op het tijdstip waarop de inlichtingen door de Pensioen- &
      Verzekeringskamer zijn ontvangen.

      2 De Pensioen- & Verzekeringskamer doet van de verlening van een vergunning mededeling in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel46
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '46'
        hoofdstuk: II
        afdeling: '4'
  - number: '49'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan, in overeenstemming met de toezichthoudende autoriteiten
      van de lid-staten waar een verzekeraar eveneens een bijkantoor heeft of een bijkantoor wil openen,
      aan deze verzekeraar op zijn aanvraag een verklaring afgeven, inhoudende dat in afwijking van
      [artikel 42, eerste lid, aanhef en onderdelen ][ref1], en [artikel 96][ref2], vanaf het in de verklaring vermelde
      tijdstip:

      a. de solvabiliteitsmarge wordt berekend op basis van het gehele schadeverzekeringsbedrijf dan wel
      levensverzekeringsbedrijf dat de verzekeraar vanuit de bijkantoren in de Unie uitoefent;

      b. de waarden die het garantiefonds vertegenwoordigen, in de lid-staat van de in het tweede lid bedoelde
      toezichthoudende autoriteit aanwezig dienen te zijn; en

      c. ten minste de helft van het minimum bedrag van het garantiefonds dient te worden aangehouden in waarden volgens
      de regels die terzake gelden in de lid-staat van de in het tweede lid bedoelde toezichthoudende autoriteit.

      2 De verzekeraar doet in zijn aanvraag een met redenen omklede keuze van de toezichthoudende autoriteit die zich
      zal belasten met het toezicht op de solvabiliteitsmarge, bedoeld in het eerste lid, onderdeel *a*.

      3 De Pensioen- & Verzekeringskamer kan aan een op grond van dit artikel afgegeven verklaring beperkingen stellen of
      voorschriften verbinden.

      4 De Pensioen- & Verzekeringskamer kan de verklaring intrekken. Alvorens daartoe over te gaan verzoekt de Pensioen-
      & Verzekeringskamer de toezichthoudende autoriteiten van de andere lid-staten die een overeenkomstige verklaring
      hebben afgegeven, deze verklaring eveneens in te trekken op het door haar aangegeven tijdstip.

      5 De Pensioen- & Verzekeringskamer trekt de verklaring tevens in, indien de toezichthoudende autoriteit van een
      van de andere betrokken lid-staten zulks verzoekt. Alsdan gaat de intrekking door de Pensioen- & Verzekeringskamer
      niet eerder in dan op het tijdstip dat is aangegeven door de toezichthoudende autoriteit die om de intrekking heeft
      verzocht.

      6 Bij of krachtens algemene maatregel van bestuur kunnen ter zake van het bepaalde in de voorgaande leden nadere
      regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel96
