  - number: '126'
    text: |-
      Een verzekeraar met zetel buiten de Unie die zijn rechten en verplichtingen uit of krachtens een of meer
      overeenkomsten van schadeverzekering, door hem bij het verrichten van diensten naar Nederland gesloten, met
      toestemming van de bevoegde buitenlandse autoriteit aan een andere verzekeraar heeft overgedragen, doet van de
      overdracht in Nederland mededeling op door de Pensioen- & Verzekeringskamer te bepalen wijze. De inhoud van de
      publikatie behoeft de voorafgaande toestemming van de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel126
  - number: '127'
    text: |-
      [De artikelen 121 tot en met 126][ref1] zijn niet van toepassing ten aanzien van de overdracht van rechten en
      verplichtingen uit overeenkomsten van herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel121
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel127
