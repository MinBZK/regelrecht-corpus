  - number: '39'
    text: |-
      1 Bij de aanvraag van een vergunning legt een verzekeraar met zetel buiten de Unie aan de Pensioen- &
      Verzekeringskamer een programma van werkzaamheden over.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot het programma van werkzaamheden, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel39
  - number: '40'
    text: |-
      1 Indien voor de eerste maal een vergunning wordt aangevraagd, legt de verzekeraar tevens aan de Pensioen- &
      Verzekeringskamer over:

      a. een authentiek afschrift van de akte van oprichting, een exemplaar van zijn statuten alsmede een lijst met namen
      en adressen van zijn bestuurders en commissarissen;

      b. de akte van aanstelling van de vertegenwoordiger alsook, indien de vertegenwoordiger rechtspersoon is, de
      statuten van deze rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister en de akte van
      aanstelling van de natuurlijke persoon, bedoeld in [artikel 45, vijfde lid][ref1],

      c. gegevens waaruit blijkt dat de verzekeraar zowel in zijn bijkantoor als in de staat van zijn zetel beschikt over
      een goede administratieve organisatie en adequate interne controleprocedures; en

      d. gegevens waaruit blijkt dat de verzekeraar zowel in zijn bijkantoor als in de staat van zijn zetel beschikt over
      adequate maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering.

      Onder integere bedrijfsvoering wordt in dit artikel verstaan de bedrijfsvoering met
      uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref2].

      2 Indien de aanvraag betrekking heeft op een vergunning voor de branche Aansprakelijkheid motorrijtuigen, legt de
      verzekeraar voorts aan de Pensioen- & Verzekeringskamer over:

      a. een schriftelijk bewijs waaruit blijkt dat de verzekeraar is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref3];

      b. een schriftelijk bewijs waaruit blijkt dat de verzekeraar zich heeft gemeld bij het Waarborgfonds Motorverkeer
      teneinde te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24][ref4], eerste lid, en
      [24][ref5]; en

      d. een opgave van de naam en het adres van de schaderegelaar, bedoeld in
      [artikel 52, eerste lid, onderdeel e][ref6], die hij in iedere andere lid-staat dan Nederland heeft aangesteld.

      3 De modellen van de akten van aanstelling, bedoeld in het eerste lid, onderdeel *b*, worden door de Pensioen- &
      Verzekeringskamer vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
      [ref6]: https://wetten.overheid.nl/BWBR0006509#Artikel52
