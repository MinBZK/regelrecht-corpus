    text: |-
      1 Indien het opvanginstrument, bedoeld in [artikel 147d][ref1], ten tijde van het uitspreken van de noodregeling
      reeds in werking is gesteld, kan de toepassing ervan door de Pensioen- & Verzekeringskamer worden voortgezet in de
      vorm bedoeld in [artikel 147d, derde lid][ref2].

      2 De bewindvoerders verlenen hieraan hun medewerking.


