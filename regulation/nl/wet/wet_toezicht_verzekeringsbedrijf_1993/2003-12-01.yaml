  - number: '176'
    text: |-
      1 Op een aanvraag tot het verkrijgen van een verklaring van geen bezwaar als bedoeld in de
      [artikelen 174, eerste lid][ref1], of [175, eerste lid][ref2], wordt beslist door Onze Minister, de Pensioen- &
      Verzekeringskamer gehoord, dan wel in door Onze Minister bepaalde gevallen vanwege Onze Minister door de Pensioen-
      & Verzekeringskamer.

      2 De aanvraag wordt ingediend bij de Pensioen- & Verzekeringskamer. De Pensioen- & Verzekeringskamer zendt de
      aanvraag, vergezeld van haar advies, aan Onze Minister behoudens in de gevallen waarin zij vanwege Onze Minister
      beslist.

      3 Op de aanvraag wordt binnen dertien weken beslist.

      4 De verleende verklaring van geen bezwaar als bedoeld in [artikel 175, eerste lid][ref3], wordt door Onze Minister
      dan wel vanwege Onze Minister door de Pensioen- & Verzekeringskamer aan de betrokken verzekeraar bekendgemaakt.

      5 Van de afgifte van een verklaring van geen bezwaar wordt door Onze Minister dan wel vanwege Onze Minister door
      de Pensioen- & Verzekeringskamer mededeling gedaan in de *Staatscourant*, behoudens voor zover Onze Minister of
      de Pensioen- & Verzekeringskamer van oordeel is, dat publikatie zou leiden of zou kunnen leiden tot onevenredige
      bevoordeling of benadeling van bij de beslissing betrokkenen of derden.

      6 Een verklaring van geen bezwaar kan door Onze Minister, de Pensioen- & Verzekeringskamer gehoord, dan wel in
      door Onze Minister bepaalde gevallen vanwege Onze Minister door de Pensioen- & Verzekeringskamer worden gewijzigd
      of ingetrokken:

      a. op aanvraag van de houder;

      b. indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van geen bezwaar zodanig
      onjuist of onvolledig blijken dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling van
      de aanvraag de juiste omstandigheden volledig bekend waren geweest;

      c. indien niet alsnog binnen de termijn als bedoeld in [artikel 174, zevende lid][ref4], onderscheidenlijk
      [artikel 175, zesde lid][ref5], aan alle bij de verklaring van geen bezwaar gestelde voorschriften wordt voldaan.

      7 Indien zich met betrekking tot een verleende verklaring van geen bezwaar omstandigheden voordoen of feiten bekend
      worden welke:

      a. naar het oordeel van de Pensioen- & Verzekeringskamer tot strijd met het belang leiden of zouden kunnen leiden
      van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen betrokken zijn of zullen worden
      bij overeenkomsten van verzekering, gesloten of te sluiten door een rechtstreeks of middellijk bij de handeling
      betrokken verzekeraar onderscheidenlijk tot een invloed op de betrokken verzekeraar die in strijd is met het belang
      van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen betrokken zijn of zullen worden
      bij overeenkomsten van verzekering, gesloten of te sluiten door een rechtstreeks of middellijk bij de handeling
      betrokken verzekeraar

      b. naar het oordeel van de Pensioen- & Verzekeringskamer ertoe leiden of zouden kunnen leiden dat de betrokken
      verzekeraar zou gaan behoren tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige
      mate ondoorzichtig is dat deze een belemmering zou vormen voor het adequaat uitoefenen van toezicht op de
      verzekeraar;

      c. naar het oordeel van de Pensioen- & Verzekeringskamer ertoe leiden of zouden kunnen leiden dat een
      integere bedrijfsvoering onvoldoende is gewaarborgd, waarbij onder integere bedrijfsvoering wordt verstaan de
      bedrijfsvoering met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref6]; of

      d. naar het oordeel van de Pensioen- & Verzekeringskamer of Onze Minister leiden of zouden kunnen leiden tot een
      ongewenste ontwikkeling van het verzekeringswezen;

      en derhalve zo zij voor het tijdstip waarop de verklaring van geen bezwaar werd verleend zich hadden voorgedaan,
      of bekend waren geweest, een verklaring van geen bezwaar zou zijn geweigerd dan wel de verklaring van geen bezwaar
      onder het stellen van beperkingen of het verbinden van voorschriften zou zijn verleend, kan Onze Minister, de
      Pensioen- & Verzekeringskamer gehoord, dan wel in door Onze Minister bepaalde gevallen vanwege Onze Minister
      de Pensioen- & Verzekeringskamer, aan de verklaring van geen bezwaar nadere beperkingen stellen of nadere
      voorschriften verbinden of de verklaring van geen bezwaar intrekken.

      8 De wijziging of de intrekking van een verklaring van geen bezwaar als bedoeld in [artikel 175, eerste lid][ref7],
      wordt door Onze Minister dan wel vanwege Onze Minister door de Pensioen- & Verzekeringskamer aan de betrokken
      verzekeraar bekendgemaakt.

      9 Van de wijziging of de intrekking van een verklaring van geen bezwaar wordt door Onze Minister dan wel vanwege
      Onze Minister door de Pensioen- & Verzekeringskamer mededeling gedaan in de *Staatscourant*, behoudens voor zover
      Onze Minister of de Pensioen- & Verzekeringskamer van oordeel is, dat publikatie zou leiden of zou kunnen leiden
      tot onevenredige bevoordeling of benadeling van bij de beslissing betrokkenen of derden.


