  - number: '94'
    text: |-
      1 Een verzekeraar met zetel buiten de Unie houdt voor zijn vanuit de bijkantoren in Nederland aangegane
      verplichtingen uit overeenkomsten van verzekering toereikende technische voorzieningen aan.

      2 Een levensverzekeraar stelt, rekening houdend met alle financiële aspecten van zijn onderneming, de premies voor
      te sluiten overeenkomsten van verzekering op adequate wijze vast.

      3

      4 Bij of krachtens algemene maatregel van bestuur kunnen ter zake van het eerste tot en met het derde lid nadere
      regels worden gesteld.

      5 De technische voorzieningen worden volledig door waarden gedekt, ten aanzien waarvan is voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen regels. De Pensioen- & Verzekeringskamer kan tegen de aard en
      de waardering van deze waarden bedenkingen naar voren brengen, aan welke bedenkingen de verzekeraar dient tegemoet
      te komen.

      6 De waarden die dienen tot dekking van de technische voorzieningen moeten in toereikende mate in dezelfde
      muntsoort kunnen worden geïnd of te gelde gemaakt als die waarin de verplichtingen luiden. Deze waarden moeten in
      Nederland aanwezig zijn.

      7 In afwijking van het zesde lid, laatste volzin, mogen met betrekking tot een overeenkomst van communautaire co-
      assurantie de waarden ter keuze van de verzekeraar ook aanwezig zijn in de andere lid-staten van waaruit de overige
      co-assuradeuren deelnemen aan de overeenkomst.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het
      bepaalde in het zesde lid. Daarbij kan tevens worden bepaald dat en in hoeverre de Pensioen- & Verzekeringskamer
      vrijstelling of ontheffing kan verlenen van gegeven voorschriften. Aan een vrijstelling en een ontheffing kunnen
      beperkingen worden gesteld of voorschriften worden verbonden en zij kunnen worden ingetrokken.

      9 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat en in hoeverre vorderingen op
      herverzekeraars als de waarden, bedoeld in het vijfde lid, in aanmerking kunnen worden genomen. Deze waarden
      behoeven niet in Nederland aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel94
  - number: '95'
    text: |-
      1 De waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de bijkantoren in Nederland
      aangegane verplichtingen uit of krachtens overeenkomsten van verzekering, worden als zodanig door de verzekeraar
      geadministreerd.

      2 In een der staten, bedoeld in [artikel 100][ref1], vermeldt de verzekeraar de bedragen die de in het eerste lid
      bedoelde waarden per categorie, als aangegeven in de desbetreffende staat, in totaal belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel100
