  - number: '108'
    text: |-
      Een verzekeraar met zetel buiten Nederland mag uitsluitend diensten verrichten naar Nederland in branches tot de
      uitoefening waarvan hij in de staat van de betrokken vestiging bevoegd is.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel108
  - number: '109'
    text: |-
      1 Een schadeverzekeraar mag geen diensten verrichten naar Nederland in de branche Aansprakelijkheid motorrijtuigen:

      a. zonder te zijn aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];

      b. zonder zijn verplichtingen jegens het Waarborgfonds Motorverkeer na te komen uit hoofde van de
      [artikelen 24][ref2], eerste lid, en [24][ref3];

      c. zonder zijn verplichtingen na te komen tot kennisgeving uit hoofde van
      [artikel 13, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref4] jegens het overheidsorgaan
      aldaar bedoeld;

      d. zonder dat zijn voorwaarden van verzekering voldoen aan de door de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref5] gestelde eisen; en

      e. zonder dat hij een natuurlijk persoon of een rechtspersoon als schade-afhandelaar heeft aangesteld die zijn
      woonplaats in Nederland heeft en die belast wordt met het namens hem afwikkelen van vorderingen van benadeelden als
      bedoeld in [artikel 1 van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref6].

      2 Indien de schade-afhandelaar een natuurlijk persoon is die een kantoor houdt, wordt dit kantoor als zijn
      woonplaats aangemerkt.

      3 De schade-afhandelaar dient over voldoende bevoegdheden te beschikken om de verzekeraar, zowel in als buiten
      rechte, te vertegenwoordigen. De schade-afhandelaar houdt zich namens de verzekeraar niet bezig met de uitoefening
      van het verzekeringsbedrijf.

      4 Binnen twee weken na de aanvang van het verrichten van diensten in de branche Aansprakelijkheid motorrijtuigen
      legt de verzekeraar aan de Pensioen- & Verzekeringskamer de akte van aanstelling van de schade-afhandelaar over,
      waaruit diens naam, adres en bevoegdheden blijken.

      5 Ontslag van de schade-afhandelaar is niet geldig tenzij het gepaard gaat met de aanstelling van een opvolger.
      Het ontslag gaat niet in voordat de akten van ontslag en van aanstelling van de opvolger aan de Pensioen- &
      Verzekeringskamer zijn overgelegd en zij aan het bestuur van de verzekeraar heeft meegedeeld dat zij daartegen geen
      bedenkingen heeft.

      6 De schade-afhandelaar die heeft bedankt, behoudt zijn hoedanigheid totdat hij van zijn bedanken kennis heeft
      gegeven aan de Pensioen- & Verzekeringskamer en zij aan het bestuur van de verzekeraar heeft meegedeeld dat zij
      daartegen geen bedenkingen heeft.

      7 Van het overlijden, het van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen, de surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref7], de onderbewindstelling van één of meer van de
      goederen, bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref8], of de ondercuratelestelling
      van de schade-afhandelaar geeft de verzekeraar binnen twee weken aan de Pensioen- & Verzekeringskamer
      kennis, onder overlegging van de akte van aanstelling van de opvolger van de schade-afhandelaar met
      ingang van de dag van het overlijden, het van toepassing verklaren van de schuldsaneringsregeling
      natuurlijke personen, de surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref9], de onderbewindstelling van één of meer van de goederen,
      bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref10], of de ondercuratelestelling.

      8 De verzekeraar legt iedere wijziging in de akte van aanstelling binnen twee weken na de totstandkoming van de
      desbetreffende wijziging aan de Pensioen- & Verzekeringskamer over. De verzekeraar stelt de verzekeringnemer binnen
      twee weken in kennis van een wijziging in de naam of het adres van de schade-afhandelaar.

      9 Binnen twee weken na de aanvang van het verrichten van diensten in de branche Aansprakelijkheid motorrijtuigen
      legt de verzekeraar aan de Pensioen- & Verzekeringskamer een door hem ondertekende verklaring over dat zijn
      voorwaarden van verzekering voldoen aan de door de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref11]
      gestelde eisen.

      10 De Pensioen- & Verzekeringskamer kan van het bepaalde in het eerste lid ontheffing verlenen aan een verzekeraar
      die geen aansprakelijkheden dekt ten aanzien waarvan de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref12]
      van toepassing is en die de risico’s van de branche Aansprakelijkheid motorrijtuigen uitsluitend als bijkomende
      risico’s dekt. Aan een ontheffing kunnen beperkingen worden gesteld of voorschriften worden verbonden en zij kan
      worden ingetrokken.


