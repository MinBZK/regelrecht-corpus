        artikel: '179'
        hoofdstuk: X
  - number: '37'
    text: |-
      1 Een verzekeraar met zetel in een andere lid-staat dan Nederland, die in het bezit is van een vergunning die
      overeenkomt met de in [artikel 24, eerste lid][ref1], bedoelde vergunning, kan, met inachtneming van het derde
      lid, in Nederland een bijkantoor openen nadat de toezichthoudende autoriteit van die lid-staat de Pensioen- &
      Verzekeringskamer schriftelijk in kennis heeft gesteld van het voornemen van de verzekeraar tot het openen van
      het bijkantoor, onder bijvoeging van gegevens die overeenkomen met die van artikel 80, tweede lid, onderdelen *b*
      tot en met *d*, en van een verklaring dat de verzekeraar beschikt over de vereiste solvabiliteitsmarge. Indien de
      verzekeraar risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen wenst te dekken voegt de betrokken
      toezichthoudende autoriteit bij de inkennisstelling, bedoeld in de eerste volzin, tevens:

      a. een schriftelijk bewijs waaruit blijkt dat de verzekeraar is aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2];

      b. een schriftelijk bewijs waaruit blijkt dat de verzekeraar zich heeft gemeld bij het Waarborgfonds Motorverkeer
      teneinde te voldoen aan zijn verplichtingen jegens dat fonds uit hoofde van de [artikelen 24][ref3], eerste lid,
      en [24][ref4].

      2 De Pensioen- & Verzekeringskamer kan binnen twee maanden na ontvangst van de kennisgeving, bedoeld in het eerste
      lid, de betrokken toezichthoudende autoriteit berichten welke voorwaarden om redenen van algemeen belang in acht
      moeten worden genomen bij het uitoefenen van de werkzaamheden in Nederland.

      3 Na de verzending door de Pensioen- & Verzekeringskamer van dit bericht dan wel van de mededeling dat geen zodanig
      bericht zal volgen, maar in elk geval twee maanden nadat de Pensioen- & Verzekeringskamer de kennisgeving, bedoeld
      in het eerste lid, heeft ontvangen, kan de verzekeraar het bijkantoor openen.

      4 De Pensioen- & Verzekeringskamer doet van de bevoegdheid van een verzekeraar een bijkantoor te openen mededeling
      in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel24a
