  - number: '150'
    text: |-
      1 De werking van het besluit tot intrekking van een vergunning wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien de verzekeraar de voorzitter van het College van Beroep voor het bedrijfsleven heeft verzocht
      een voorlopige voorziening te treffen, op dat verzoek is beslist.

      2 De Pensioen- & Verzekeringskamer doet van het besluit in de *Staatscourant* mededeling, zodra de intrekking van
      kracht is geworden. Zij kan, indien zij dit in het belang van verzekeringnemers, verzekerden of gerechtigden op
      uitkeringen acht, het besluit eveneens op andere door haar te bepalen wijze publiceren. Van de intrekking van een
      vergunning van een opvanginstelling wordt geen mededeling gedaan indien geen verplichte portefeuille-overdracht als
      bedoeld in [artikel 147d, derde lid][ref1], heeft plaatsgevonden.

      3 De Pensioen- & Verzekeringskamer brengt de intrekking van een vergunning, verleend:

      a. aan een verzekeraar met zetel in Nederland ter kennis van de toezichthoudende autoriteiten van de lid-staten
      waar de verzekeraar een bijkantoor heeft of waarheen hij diensten verricht;

      b. aan een verzekeraar met zetel buiten de Unie ten aanzien van wie zij is belast met het toezicht, bedoeld
      in [artikel 49, tweede lid][ref2], ter kennis van de toezichthoudende autoriteiten van de lid-staten waar de
      verzekeraar een bijkantoor heeft of waarheen hij vanuit Nederland diensten verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel147d
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel49
