    text: |-
      1 Indien een verzekeraar met zetel buiten de Unie niet voldoet aan de bij of krachtens [artikel 94][ref1]
      gestelde eisen met betrekking tot de technische voorzieningen, kan de Pensioen- & Verzekeringskamer de vrije
      beschikking door de verzekeraar over zijn waarden, die betrekking hebben op zijn vanuit Nederland uitgeoefende
      verzekeringsbedrijf, beperken of hem verbieden om anders dan met schriftelijke machtiging van de Pensioen- &
      Verzekeringskamer te beschikken over deze waarden.

      2 Alvorens een beperking of een verbod uit te vaardigen, stelt de Pensioen- & Verzekeringskamer de toezichthoudende
      autoriteit in een andere lid-staat die belast is met het toezicht, bedoeld in artikel 49, tweede lid, op de hoogte
      van haar voornemen.

      3 De beperking of het verbod wordt door de Pensioen- & Verzekeringskamer door middel van een deurwaardersexploot
      aan de verzekeraar bekendgemaakt.

      4 De verzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.

      5 De Pensioen- & Verzekeringskamer heft de beperking of het verbod op zodra de verzekeraar weer voldoet aan de in
      het eerste lid bedoelde eisen. Zij maakt de opheffing bekend aan de verzekeraar.

      6 De Pensioen- & Verzekeringskamer stelt de toezichthoudende autoriteiten, bedoeld in het tweede lid, alsmede
      de toezichthoudende autoriteiten van de lid-staten waarheen de verzekeraar vanuit Nederland diensten verricht in
      kennis van de uitvaardiging van de beperking of het verbod en de opheffing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel94
