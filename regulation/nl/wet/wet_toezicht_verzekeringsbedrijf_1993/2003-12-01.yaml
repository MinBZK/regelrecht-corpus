  - number: '74'
    text: |-
      1 Een schadeverzekeraar dient binnen zes maanden na afloop van het boekjaar bij de Pensioen- & Verzekeringskamer
      een opgave in met betrekking tot de vanuit de vestigingen in de Unie gesloten overeenkomsten van verzekering,
      onder aparte vermelding van de in dienstverrichting gesloten overeenkomsten. In die opgave worden per lid-staat
      en per branchegroep de in dat boekjaar geboekte premies, schaden en provisies vermeld, telkens zonder aftrek van
      herverzekering. Deze gegevens, alsmede de frequentie en de gemiddelde kosten van de schadegevallen, worden voor de
      branche Aansprakelijkheid motorrijtuigen evenwel afzonderlijk vermeld.

      2 Een levensverzekeraar dient binnen zes maanden na afloop van het boekjaar bij de Pensioen- & Verzekeringskamer
      een opgave in met betrekking tot de vanuit de vestigingen in de Unie gesloten overeenkomsten van verzekering, onder
      aparte vermelding van de in dienstverrichting gesloten overeenkomsten. In die opgave worden per lid-staat en per
      branche de in dat boekjaar geboekte premies vermeld, zonder aftrek van herverzekering.

      3 Het eerste en tweede lid zijn niet van toepassing op de vanuit de vestigingen in Nederland gesloten
      overeenkomsten van verzekering waarbij geen sprake is van het verrichten van diensten.

      4 De in het eerste lid bedoelde branchegroepen en de modellen van de opgave, bedoeld in het eerste en tweede lid,
      worden door de Pensioen- & Verzekeringskamer vastgesteld.

      5 De Pensioen- & Verzekeringskamer legt de in het eerste en tweede lid bedoelde gegevens met betrekking tot een
      lid-staat in geaggregeerde vorm over aan de toezichthoudende autoriteit van die lid-staat indien deze daarom
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel74
  - number: '75'
    text: |-
      1 Een verzekeraar met zetel in Nederland:

      a. legt een authentiek afschrift van elke wijziging in zijn statuten binnen twee weken na de totstandkoming van de
      desbetreffende wijziging aan de Pensioen- & Verzekeringskamer over;

      b. brengt elke wijziging in de samenstelling van zijn bestuur en raad van commissarissen vooraf ter kennis van de
      Pensioen- & Verzekeringskamer;

      c. brengt elke wijziging in de samenstelling van de personen die het dagelijks beleid bepalen van de groep waartoe
      de verzekeraar behoort en tevens uit dien hoofde het dagelijks beleid van de verzekeraar mede bepalen vooraf ter
      kennis van de Pensioen- & Verzekeringskamer;

      d. brengt elke wijziging in de samenstelling van de personen die het beleid bepalen of mede bepalen van de groep
      waartoe de verzekeraar behoort en tevens uit dien hoofde het beleid van de verzekeraar mede bepalen vooraf ter
      kennis van de Pensioen- & Verzekeringskamer.

      2 Een wijziging als bedoeld in het eerste lid, onderdeel b, c of d, wordt niet doorgevoerd indien de Pensioen-
      & Verzekeringskamer binnen zes weken na ontvangst van de melding of, indien de Pensioen- & Verzekeringskamer om
      nadere gegevens of inlichtingen heeft verzocht, binnen zes weken na de ontvangst van die gegevens of inlichtingen
      aan de verzekeraar bekend maakt dat zij niet met de voorgenomen wijziging instemt.

      3 Indien zich een wijziging voordoet van de antecedenten, bedoeld in [artikel 29, tweede of vierde lid][ref1],
      stelt de verzekeraar de Pensioen- & Verzekeringskamer daarvan onverwijld schriftelijk in kennis.

      4 Een levensverzekeraar doet binnen twee weken aan de Pensioen- & Verzekeringskamer opgave van de wijzigingen in de
      technische grondslagen voor de berekening van zijn tarieven en van de technische voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel29
