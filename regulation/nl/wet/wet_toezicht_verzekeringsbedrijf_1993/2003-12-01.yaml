  - number: '133'
    text: |-
      1 De toestemming verleend door de toezichthoudende autoriteit van een andere lid-staat dan Nederland aan een
      verzekeraar met zetel in die lid-staat tot overdracht van rechten en verplichtingen uit een of meer overeenkomsten
      van levensverzekering in het kader van diens bedrijfsuitoefening vanuit een bijkantoor in Nederland dan wel in het
      kader van het verrichten van diensten naar Nederland vanuit een vestiging in de Unie, treedt in de plaats van de
      medewerking of de toestemming van degenen die aan die overeenkomsten rechten kunnen ontlenen.

      2 De verzekeraar die zijn rechten en verplichtingen overeenkomstig het eerste lid heeft overgedragen, doet van de
      overdracht mededeling in de *Staatscourant* en op andere door de Pensioen- & Verzekeringskamer te bepalen wijze. De
      inhoud van deze publikaties behoeft de voorafgaande toestemming van de Pensioen- & Verzekeringskamer.

      3 De overdracht wordt ten aanzien van alle andere belanghebbenden dan de betrokken verzekeraars van kracht op het
      volgens het recht van de betrokken lid-staat te bepalen tijdstip, dan wel, bij gebreke van een regeling in die lid-
      staat, met ingang van de tweede dag, volgende op die van de dagtekening van de *Staatscourant* waarin de publikatie
      is geplaatst.

      4 Indien een verzekeringnemer die lid is van een onderneming dan wel instelling op onderlinge grondslag ingevolge
      de overdracht geen overeenkomst van levensverzekering meer bij deze verzekeraar heeft lopen, eindigt zijn
      lidmaatschap van rechtswege volgens de door het recht van de betrokken lid-staat bepaalde wijze, dan wel, bij
      gebreke van een regeling in die lid-staat, met ingang van de tweede dag, volgende op die van de dagtekening van de
      *Staatscourant* waarin de publikatie is geplaatst.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel133
  - number: '134'
    text: |-
      Een verzekeraar met zetel buiten de Unie die zijn rechten en verplichtingen uit een of meer overeenkomsten van
      levensverzekering, door hem bij het verrichten van diensten naar Nederland gesloten, met toestemming van de
      bevoegde buitenlandse autoriteit aan een andere verzekeraar heeft overgedragen, doet van de overdracht in Nederland
      mededeling op door de Pensioen- & Verzekeringskamer te bepalen wijze. De inhoud van de publikatie behoeft de
      voorafgaande toestemming van de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel134
  - number: '135'
    text: |-
      De [artikelen 129 tot en met 134][ref1] zijn niet van toepassing ten aanzien van de overdracht van rechten en
      verplichtingen uit overeenkomsten van herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel129
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel135
