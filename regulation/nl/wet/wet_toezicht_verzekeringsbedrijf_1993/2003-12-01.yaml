      1 Ontslag van de vertegenwoordiger is niet geldig tenzij het gepaard gaat met de aanstelling van een opvolger. Het
      ontslag gaat niet in voordat een akte van ontslag en een akte van aanstelling van de opvolger aan de Pensioen- &
      Verzekeringskamer zijn overgelegd. Is de opvolger rechtspersoon, dan doet de verzekeraar de akte van aanstelling
      vergezeld gaan van de statuten van deze rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister
      en een akte van aanstelling van de natuurlijke persoon, bedoeld in [artikel 85, vierde lid][ref1].

      2 De vertegenwoordiger die heeft bedankt, behoudt zijn hoedanigheid totdat hij van zijn bedanken kennis heeft
      gegeven aan de Pensioen- & Verzekeringskamer.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel85
