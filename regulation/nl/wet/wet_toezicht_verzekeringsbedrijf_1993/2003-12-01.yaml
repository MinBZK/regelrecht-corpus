  - number: '140'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan in het geval, bedoeld in [artikel 138, eerste lid][ref1], in uitzonderlijke
      omstandigheden, waarbij zij van oordeel is dat de financiële positie van de verzekeraar nog verder zal
      verslechteren, alsook in het geval, bedoeld in [artikel 138, tweede lid][ref2], de vrije beschikking door
      de verzekeraar over zijn waarden, waar zij zich ook bevinden, beperken of hem verbieden om anders dan met
      schriftelijke machtiging van de Pensioen- & Verzekeringskamer te beschikken over deze waarden.

      2 De Pensioen- & Verzekeringskamer deelt haar beslissing - zo mogelijk voordat deze van kracht wordt - mee aan
      de toezichthoudende autoriteiten van de andere lid-staten waar de verzekeraar een bijkantoor heeft of waarheen
      hij vanuit zijn vestigingen in de Unie diensten verricht. Zij kan deze autoriteiten verzoeken overeenkomstige
      maatregelen te treffen ten aanzien van de in de betrokken lid-staten aanwezige waarden, onder opgave van die
      waarden.

      3 De beslissing waarbij de beperking of het verbod wordt opgelegd, wordt door de Pensioen- & Verzekeringskamer door
      middel van een deurwaardersexploot aan de verzekeraar bekendgemaakt.

      4 De verzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.

      5 De Pensioen- & Verzekeringskamer heft de beperking of het verbod op, zodra de verzekeraar weer voldoet aan de bij
      of krachtens deze wet gestelde eisen met betrekking tot de solvabiliteitsmarge. De Pensioen- & Verzekeringskamer
      doet van de opheffing mededeling aan de in het tweede lid bedoelde toezichthoudende autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel138
