preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de wetgeving moet worden aangepast aan de richtlijn nr. 92/49/EEG van
    de Raad van de Europese Gemeenschappen van 18 juni 1992 tot coördinatie van de wettelijke en bestuursrechtelijke
    bepalingen betreffende het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche,
    en houdende wijziging van de Richtlijnen 73/239/EEG en 88/357/EEG (PbEG L 228) alsmede aan de richtlijn nr.
    92/96/EEG van de Raad van de Europese Gemeenschappen van 10 november 1992 tot coördinatie van de wettelijke
    en bestuursrechtelijke bepalingen betreffende het directe levensverzekeringsbedrijf en tot wijziging van de
    Richtlijnen 79/267/EEG en 90/619/EEG (PbEG L 360), en dat het naar aanleiding daarvan wenselijk is de Wet toezicht
    verzekeringsbedrijf opnieuw vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt - voor zover niet anders blijkt - verstaan onder:

      a. overeenkomsten van schadeverzekering: overeenkomsten van verzekering die niet zijn overeenkomsten in verband
      met het leven of de dood van de mens, met dien verstande dat overeenkomsten van ongevallenverzekering als
      overeenkomsten van schadeverzekering worden beschouwd;

      b. overeenkomsten van levensverzekering: overeenkomsten van verzekering tot het doen van geldelijke uitkeringen
      in verband met het leven of de dood van de mens en overeenkomsten van verzekering in verband met de verzorging
      van de uitvaart van de mens die uitsluitend strekken tot het verrichten van andere dan geldelijke prestaties, met
      dien verstande dat overeenkomsten van ongevallenverzekering niet als overeenkomsten van levensverzekering worden
      beschouwd;

      c. schadeverzekeringsbedrijf: het als bedrijf sluiten van overeenkomsten van schadeverzekering voor eigen rekening,
      met inbegrip van het afwikkelen van de in dat bedrijf gesloten overeenkomsten van schadeverzekering, ook al wordt
      daarmee niet beoogd het maken van winst;

      d. levensverzekeringsbedrijf: het als bedrijf sluiten van overeenkomsten van levensverzekering voor eigen rekening,
      met inbegrip van het afwikkelen van de in dat bedrijf gesloten overeenkomsten van levensverzekering, ook al wordt
      daarmee niet beoogd het maken van winst;

      e. verzekeringsbedrijf: het schadeverzekeringsbedrijf of het levensverzekeringsbedrijf;

      f. schadeverzekeraar: ieder die het schadeverzekeringsbedrijf uitoefent;

      g. levensverzekeraar: ieder die het levensverzekeringsbedrijf uitoefent;

      h. verzekeraar: schadeverzekeraar of levensverzekeraar;

      i. de Unie: de Europese Unie;

      j. lid-staat: een staat die lid is van de Unie;

      k. grote risico's:

      1°. de risico’s die behoren tot de branches Casco rollend spoorwegmaterieel, Luchtvaartuigcasco, Casco zee- en
      binnenschepen, Vervoerde zaken, Aansprakelijkheid luchtvaartuigen en Aansprakelijkheid zee- en binnenschepen;

      2°. de risico’s die behoren tot de branches Krediet en Borgtocht wanneer de verzekeringnemer handelt in de
      uitoefening van een beroep of bedrijf en het risico daarop betrekking heeft;

      3°. de risico’s die behoren tot de branches Voertuigcasco, Brand en natuurevenementen, Andere schaden aan zaken,
      Aansprakelijkheid motorrijtuigen, Aansprakelijkheid wegvervoer, Algemene aansprakelijkheid en Diverse geldelijke
      verliezen, voor zover de verzekeringnemer voldoet aan ten minste twee van de volgende vereisten:

        - de waarde van de activa volgens de balans bedraagt meer dan 6,2 miljoen Ecu;
        - de netto-omzet over het voorafgaande boekjaar bedraagt meer dan 12,8 miljoen Ecu;
        - het gemiddeld aantal werknemers over het voorafgaande boekjaar bedraagt meer dan 250;

      waarbij bovengenoemde vereisten, indien de verzekeringnemer deel uitmaakt van een groep maatschappijen waarvan
      de geconsolideerde jaarrekening overeenkomstig de zevende [richtlijn nr. 83/349/EEG](31983L0349) van de
      Raad van de Europese Gemeenschappen van 13 juni 1983 op de grondslag van artikel 54, lid 3, sub *g*) van het
      Verdrag betreffende de geconsolideerde jaarrekening (*PbEG* L 193) wordt opgesteld, worden toegepast op basis
      van de geconsolideerde jaarrekening en indien de verzekeringnemer deel uitmaakt van een samenwerkingsverband,
      bovengenoemde vereisten gelden voor de deelnemers in het samenwerkingsverband gezamenlijk;

      l. vestiging: zetel of bijkantoor van een verzekeraar op het grondgebied van een staat;

      m. zetel: plaats waar de verzekeraar overeenkomstig zijn statuten zijn zetel heeft;

      n. bijkantoor: elke duurzame aanwezigheid, met uitzondering van de zetel, van een verzekeraar op het grondgebied
      van een staat, ook indien er slechts sprake is van een bureau, beheerd door eigen personeel van de verzekeraar of
      door een zelfstandig persoon die gemachtigd is duurzaam voor de verzekeraar op te treden;

      o. staat waar het risico is gelegen:

      1°. de staat waar de zaken zich bevinden, wanneer de verzekering betrekking heeft hetzij op een onroerende zaak,
      hetzij op een onroerende zaak en op de inhoud daarvan, voor zover deze door dezelfde verzekeringsovereenkomst wordt
      gedekt;

      2°. de staat van registratie, wanneer de verzekering betrekking heeft op voer- of vaartuigen van om het even welke
      aard;

      3°. de staat waar de verzekeringnemer de overeenkomst heeft gesloten, indien het overeenkomsten betreft met
      een looptijd van vier maanden of minder die betrekking hebben op tijdens een reis of vakantie gelopen risico's,
      ongeacht de branche;

      4°. in alle andere gevallen van schadeverzekering, de staat waar de verzekeringnemer zijn gewone verblijfplaats
      heeft, of, indien de verzekeringnemer een rechtspersoon is, de staat waar zich de vestiging van deze rechtspersoon
      bevindt waarop de overeenkomst betrekking heeft;

      p. overeenkomsten van communautaire co-assurantie: overeenkomsten van directe schadeverzekering betreffende grote
      risico's, in co-assurantie gesloten, waarbij:

      1°. de verzekeraar die als eerste verzekeraar optreedt, zijn verplichtingen uit hoofde van de overeenkomst is
      aangegaan vanuit een vestiging in een andere lid-staat dan die waarin ten minste een van de overige co-assuradeuren
      zulks heeft gedaan; en

      2°. het risico in de Unie is gelegen;

      q. verrichten van diensten:

      1°. het in de uitoefening van het directe schadeverzekeringsbedrijf vanuit een in een staat gelegen vestiging
      verzekeren van een in een andere staat gelegen risico;

      2°. het in de uitoefening van het directe levensverzekeringsbedrijf sluiten van een overeenkomst van
      levensverzekering vanuit een vestiging, gelegen in een andere staat dan die waar de verzekeringnemer zijn gewone
      verblijfplaats heeft, of waar zich, indien de verzekeringnemer een rechtspersoon is, de vestiging van deze
      rechtspersoon bevindt waarop de verzekering betrekking heeft;

      r. premie: de in geld uitgedrukte prestatie, door de verzekeringnemer verschuldigd uit hoofde van een
      overeenkomst van verzekering, daaronder niet begrepen de assurantiebelasting en de omslagbijdragen,
      bedoeld in de [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] en de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref2];

      s. vertegenwoordiger: degene die door een verzekeraar als zodanig is aangesteld om hem te vertegenwoordigen
      in een andere staat dan die van zijn zetel bij de uitoefening van zijn bevoegdheden en bij de naleving van de
      voorschriften die in eerstbedoelde staat voor hem gelden;

      t. acquisitie: alle handelingen, strekkende tot het voorbereiden of tot stand brengen van overeenkomsten van
      verzekering;

      u. Onze Minister: Onze Minister van Financiën;

      v. toezichthoudende autoriteit: de instantie die in enige staat bij of krachtens de wet met het toezicht op het
      verzekeringsbedrijf is belast;

      w. gekwalificeerde deelneming: een rechtstreeks of middellijk belang van ten minste 10 procent van het geplaatste
      aandelenkapitaal van een onderneming, of het rechtstreeks of middellijk kunnen uitoefenen van ten minste 10
      procent van de stemrechten in een onderneming, of het rechtstreeks of middellijk kunnen uitoefenen van een daarmee
      vergelijkbare zeggenschap in een onderneming;

      x. groep: een groep als bedoeld in artikel 24*b* van Boek 2 van het Burgerlijk Wetboek, met dien verstande dat
      indien een natuurlijk persoon, rechtspersoon of vennootschap:

      1°. via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of

      2°. in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in artikel 24*c* van
      Boek 2 van het Burgerlijk Wetboek, dan wel, voor zover het natuurlijke personen betreft, een met een deelneming
      overeenkomende positie,

      die natuurlijke persoon, rechtspersoon of vennootschap tezamen met die andere natuurlijke persoon, rechtspersoon of
      vennootschap dan wel natuurlijke personen, rechtspersonen of vennootschappen wordt aangemerkt als groep;

      ij. opvanginstelling: een naamloze vennootschap met zetel in Nederland die uitsluitend tot doel heeft in opdracht
      van de Pensioen- & Verzekeringskamer een in problemen verkerende levensverzekeraar op te vangen door middel van
      herverzekering van de portefeuille of het overnemen van de portefeuille van de betrokken verzekeraar.

      2 Het levensverzekeringsbedrijf verliest zijn karakter als zodanig niet, indien bij de overeenkomsten van
      levensverzekering naast de verplichting tot het doen van geldelijke uitkeringen verplichtingen van andere aard
      worden aanvaard, of bij die overeenkomsten verplichtingen worden aanvaard in verband met voorvallen waarvan het
      ontstaan onzeker is en die de persoon van de mens treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003933
      [ref2]: https://wetten.overheid.nl/BWBR0009750
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel1
