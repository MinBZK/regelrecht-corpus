  - number: '121'
    text: |-
      1 Een schadeverzekeraar met zetel in Nederland kan met schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer zonder medewerking of toestemming van degenen die aan die overeenkomsten rechten kunnen ontlenen
      bij akte zijn rechten en verplichtingen uit of krachtens een of meer overeenkomsten van schadeverzekering:

      a. gesloten vanuit een vestiging in de Unie overdragen aan een andere verzekeraar met zetel in de Unie in het kader
      van diens bedrijfsuitoefening vanuit een vestiging in de Unie;

      b. gesloten vanuit een vestiging in Nederland overdragen aan een andere verzekeraar met zetel buiten de Unie in het
      kader van diens bedrijfsuitoefening vanuit een bijkantoor in Nederland;

      c. gesloten vanuit een bijkantoor in een andere lid-staat overdragen aan een andere verzekeraar met zetel buiten
      de Unie in het kader van diens bedrijfsuitoefening vanuit een bijkantoor in de Unie indien de wetgeving van de
      betrokken lid-staten voorziet in een dergelijke overdracht en de betrokken toezichthoudende autoriteiten daarmee
      instemmen.

      2 Een schadeverzekeraar met zetel buiten de Unie kan met schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer bij akte zijn rechten en verplichtingen uit of krachtens een of meer overeenkomsten van
      schadeverzekering, gesloten vanuit een bijkantoor in Nederland, zonder medewerking of toestemming van degenen die
      aan die overeenkomsten rechten kunnen ontlenen, overdragen aan:

      a. een andere verzekeraar met zetel in de Unie in het kader van diens bedrijfsuitoefening vanuit een vestiging in
      de Unie;

      b. een andere verzekeraar met zetel buiten de Unie in het kader van diens bedrijfsuitoefening vanuit een bijkantoor
      in Nederland.

      3 Voor zover bij het sluiten van de overeenkomsten van schadeverzekering, bedoeld in het tweede lid, in een andere
      lid-staat gelegen risico’s zijn verzekerd, kan de verzekeraar zijn rechten en verplichtingen onder de in de aanhef
      van dat lid gestelde voorwaarden tevens overdragen aan een andere verzekeraar met zetel buiten de Unie in het kader
      van diens bedrijfsuitoefening vanuit een bijkantoor in de lid-staat waar het risico is gelegen.

      4 Indien de wetgeving van een andere lid-staat niet voorziet in een toestemmingsprocedure voor een verzekeraar
      met zetel aldaar tot overdracht van zijn rechten en verplichtingen uit of krachtens een of meer overeenkomsten
      van schadeverzekering, gesloten vanuit een bijkantoor in Nederland, aan een andere verzekeraar met zetel buiten
      de Unie in het kader van diens bedrijfsuitoefening vanuit een bijkantoor in Nederland, kan de overdracht bij
      akte plaatsvinden met schriftelijke toestemming van de Pensioen- & Verzekeringskamer en zonder medewerking of
      toestemming van degenen die aan die overeenkomsten rechten kunnen ontlenen. De Pensioen- & Verzekeringskamer
      verleent geen toestemming alvorens de toezichthoudende autoriteit van de lid-staat van de zetel van de overdragende
      verzekeraar heeft verklaard met die overdracht in te stemmen.

      5 Met overdracht van de rechten en verplichtingen uit of krachtens alle overeenkomsten van schadeverzekering wordt
      gelijkgesteld de overgang van deze rechten en verplichtingen bij een fusie als bedoeld in artikel 309 van Boek 2
      van het Burgerlijk Wetboek of bij een splitsing als bedoeld in artikel 334a van Boek 2 van het Burgerlijk Wetboek.
      Het eerste lid, aanhef en onderdeel *a*, en de artikelen 122, eerste, tweede en zesde tot en met negende lid, en
      123, eerste, vierde en vijfde lid, zijn op deze overgang van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel121
  - number: '122'
    text: |-
      1 Een aanvraag ter verkrijging van toestemming van de Pensioen- & Verzekeringskamer tot overdracht van rechten en
      verplichtingen gaat vergezeld van een ontwerp-overeenkomst met alle ter toelichting dienende stukken.

      2 Voor een overdracht aan een verzekeraar met zetel in Nederland verleent de Pensioen- & Verzekeringskamer geen
      toestemming indien deze verzekeraar, mede gelet op de voorgenomen overdracht, niet beschikt over de vereiste
      solvabiliteitsmarge of indien de Pensioen- & Verzekeringskamer een herstelplan ingevolge [artikel 137a][ref1] heeft
      verlangd van de verzekeraar.

      3 Voor een overdracht aan een verzekeraar met zetel in een andere lid-staat dan Nederland verleent de Pensioen- &
      Verzekeringskamer geen toestemming alvorens de toezichthoudende autoriteit van die lid-staat heeft verklaard dat
      deze verzekeraar, mede gelet op de voorgenomen overdracht, beschikt over de vereiste solvabiliteitsmarge.

      4 Voor een overdracht aan een verzekeraar met zetel buiten de Unie in het kader van diens bedrijfsuitoefening
      vanuit een bijkantoor in Nederland verleent de Pensioen- & Verzekeringskamer geen toestemming indien het betrokken
      bijkantoor, mede gelet op de voorgenomen overdracht, niet beschikt over de vereiste solvabiliteitsmarge of indien
      de Pensioen- & Verzekeringskamer een herstelplan ingevolge [artikel 137a][ref2] heeft verlangd van de verzekeraar.
      Indien een andere toezichthoudende autoriteit in de Unie belast is met het toezicht op de solvabiliteitsmarge
      van het betrokken bijkantoor verleent de Pensioen- & Verzekeringskamer geen toestemming alvorens laatstbedoelde
      toezichthoudende autoriteit heeft verklaard dat het bijkantoor, mede gelet op de voorgenomen overdracht, beschikt
      over de vereiste solvabiliteitsmarge en dat, indien van toepassing, van het bijkantoor geen met een herstelplan in
      de zin van [artikel 137a][ref3] overeenkomend plan is verlangd.

      5 Voor een overdracht aan een verzekeraar met zetel buiten de Unie in het kader van diens bedrijfsuitoefening
      vanuit een in een andere lid-staat gelegen bijkantoor kan de Pensioen- & Verzekeringskamer alleen toestemming
      verlenen indien:

      a. de wetgeving van de lid-staat waar het overnemende bijkantoor is gelegen, voorziet in de mogelijkheid van een
      dergelijke overdracht;

      b. de toezichthoudende autoriteit van die lid-staat dan wel, indien een andere toezichthoudende autoriteit
      in de Unie belast is met het toezicht op de solvabiliteitsmarge van het betrokken bijkantoor, laatstbedoelde
      toezichthoudende autoriteit heeft verklaard dat het bijkantoor, mede gelet op de voorgenomen overdracht, beschikt
      over de vereiste solvabiliteitsmarge;

      c. de betrokken toezichthoudende autoriteit van die lid-staat geen herstelplan heeft verlangd van het bijkantoor;
      en

      d. de betrokken toezichthoudende autoriteit instemt met de overdracht.

      6 Voor zover een overdracht als bedoeld in [artikel 121, eerste lid, onderdeel ][ref4], betrekking heeft op
      overeenkomsten van schadeverzekering, gesloten vanuit een in een andere lid-staat dan Nederland gelegen bijkantoor
      van de verzekeraar, en in geval van een overdracht als bedoeld in [artikel 121, eerste lid, onderdeel ][ref5],
      legt de Pensioen- & Verzekeringskamer na ontvangst van de vereiste gegevens de ontwerp-overeenkomst met alle ter
      toelichting dienende stukken voor advies voor aan de toezichthoudende autoriteit van elke betrokken lid-staat.

      7 Indien een in het zesde lid bedoelde toezichthoudende autoriteit haar advies niet binnen drie maanden na
      ontvangst van het daartoe strekkende verzoek aan de Pensioen- & Verzekeringskamer heeft uitgebracht, wordt zulks
      gelijkgesteld met een gunstig advies.

      8 Voor zover een overdracht betrekking heeft op overeenkomsten van schadeverzekering bij het sluiten waarvan in
      een andere lid-staat dan Nederland gelegen risico’s zijn verzekerd, verleent de Pensioen- & Verzekeringskamer
      geen toestemming alvorens de toezichthoudende autoriteit van die lid-staat heeft verklaard met de overdracht in
      te stemmen.

      9 Indien de in het achtste lid bedoelde toezichthoudende autoriteit haar oordeel niet binnen drie maanden na
      ontvangst van het daartoe strekkende verzoek aan de Pensioen- & Verzekeringskamer heeft kenbaar gemaakt, wordt
      zulks gelijkgesteld met een instemming.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel137a
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel137a
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel137a
