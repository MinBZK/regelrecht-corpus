  - number: 11a
    text: |-
      Onze Minister kan de Pensioen- & Verzekeringskamer voorschriften geven ter implementatie van richtlijnen op het
      gebied van toezicht op het verzekeringsbedrijf van de Raad van de Europese Unie dan wel van het Europees Parlement
      en de Raad van de Europese Unie gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel11a
  - number: '12'
    text: |-
      Deze wet is, tenzij daaruit anders voortvloeit, van toepassing op:

      a. verzekeraars met zetel in Nederland;

      b. verzekeraars met zetel buiten Nederland voor wat betreft:

      1°. een bijkantoor in Nederland;

      2°. het verrichten van diensten naar Nederland.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel12
  - number: '13'
    text: |-
      1 Als verzekeraars worden niet beschouwd:

      a. de Sociale verzekeringsbank;

      b. het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. het Fonds arbeidsongeschiktheidsverzekering overheidspersoneel;

      d. ziekenfondsen die overeenkomstig de [Ziekenfondswet][ref2] zijn toegelaten;

      e. onderlinge waarborgmaatschappijen met zetel in Nederland en ondernemingen of instellingen op onderlinge
      grondslag met zetel buiten Nederland die uitsluitend schade verzekeren, veroorzaakt door of ontstaan uit gewapend
      conflict, burgeroorlog, opstand, binnenlandse onlusten, oproer en muiterij;

      f. ondernemingen of instellingen die geen andere branche uitoefenen dan de branche Hulpverlening en daarbij
      uitsluitend dekking verlenen in geval van een ongeval met of een defect aan een wegvoertuig, mits ingevolge de
      dekking de hulp bij een ongeval of defect in Nederland of direct over de grens beperkt is tot:

      1°. technische hulp ter plaatse, waarvoor de onderneming of instelling in de regel eigen personeel of uitrusting
      gebruikt;

      2°. het vervoer van het voertuig naar de dichtstbijzijnde of meest geschikte plaats van reparatie, alsmede het
      eventuele vervoer van de bestuurder en passagiers, doorgaans met hetzelfde hulpmiddel, naar de dichtstbijzijnde
      plaats vanwaar zij hun reis met andere middelen kunnen voortzetten;

      3°. het vervoer van het voertuig, eventueel met de bestuurder en passagiers, naar hun woonplaats, hun plaats van
      vertrek of hun oorspronkelijke bestemming binnen Nederland;

      en, voor zover de dekking zich mede uitstrekt tot een ongeval of defect in het buitenland, de hulp beperkt is tot
      de onder 1° en 2° bedoelde verrichtingen, de belanghebbende lid is van de onderneming of instelling en de hulp of
      het vervoer van het voertuig enkel op vertoon van een bewijs van lidmaatschap, zonder betaling van extra premie,
      wordt uitgevoerd door een soortgelijke, in de betrokken staat werkzame organisatie die zich hiertoe op basis van
      wederkerigheid heeft verplicht.

      g.verzekeraars als bedoeld in [artikel 1, onderdeel ][ref3].

      2 Als uitoefening van het schadeverzekeringsbedrijf wordt niet beschouwd het sluiten of afwikkelen van
      overeenkomsten als bedoeld in [artikel 1, tweede lid][ref4].

      3 Als uitoefening van het verzekeringsbedrijf wordt, met inachtneming van het vierde lid, niet beschouwd het
      sluiten of afwikkelen van overeenkomsten van verzekering voor eigen rekening door:

      a. bedrijfstakpensioenfondsen, ondernemingspensioenfondsen of ondernemingsspaarfondsen als bedoeld in artikel 1,
      eerste lid, onderdelen *b*,*c*onderscheidenlijk *d*, van de [Pensioen- en spaarfondsenwet][ref5], die krachtens die
      wet aan het toezicht van de Pensioen- & Verzekeringskamer zijn onderworpen;

      b. ondernemingen in de zin van [artikel 1 van de Pensioen- en spaarfondsenwet][ref6] of pensioeninstellingen die
      voor eigen rekening geen andere overeenkomsten van verzekering sluiten of afwikkelen dan die welke dienen ter
      uitvoering van toezeggingen als bedoeld in artikel 2, derde lid, van de genoemde wet of toezeggingen ten aanzien
      waarvan krachtens artikel 29 van die wet ontheffing is verleend van artikel 2, eerste lid, van die wet;

      c. fondsen waarop de [Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref7] van toepassing
      is, en wel zolang de verplichte deelneming van kracht is alsmede gedurende de afwikkeling van hun schulden die ten
      tijde van de intrekking van de verplichtstelling bestaan;

      d. het pensioenfonds waarop van toepassing is de
      __REF000___________________________________________________________________________________________________________
      _

      4 Het bepaalde in het derde lid is slechts van toepassing voor zover:

      a. een bedrijfstakpensioenfonds binnen de bedrijfstak of bedrijfstakken, omschreven in zijn statuten, dan wel een
      ondernemingspensioenfonds handelt ter uitvoering van:

      1°. een verplichtstelling op grond van de [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref9];

      2°. een toezegging omtrent pensioen, als bedoeld in [artikel 2 van de Pensioen- en spaarfondsenwet][ref10];

      3°. een vrijwillige pensioenvoorziening waartoe de mogelijkheid voortvloeit uit het deelnemerschap en die hetzij
      past binnen het raam van de regeling die voor de categorie waartoe de deelnemer behoort, in het pensioenfonds
      geldt ter uitvoering van een verplichtstellingsbeschikking als bedoeld onder 1° of van een toezegging als bedoeld
      onder 2°, hetzij kan worden beschouwd als een fase in de ontwikkelingsgang naar een eventuele uitbreiding van de
      werkingssfeer van de ten behoeve van nabestaanden in de regeling opgenomen voorzieningen; of

      4°. een regeling krachtens welke de voor een deelnemer bestaande pensioenvoorziening bij beëindiging van diens
      deelnemerschap vrijwillig wordt voortgezet;

      b. een ondernemingsspaarfonds handelt ter uitvoering van een door een werkgever getroffen regeling tot sparen voor
      een uitkering bij wijze van oudedagsverzorging;

      c. een onderneming als bedoeld in het derde lid, onderdeel *b*, verzekeringen sluit ten bate van personen,
      verbonden aan die onderneming, dan wel een pensioeninstelling als bedoeld in dat onderdeel verzekeringen sluit ten
      bate van personen, verbonden aan een bepaalde zodanige onderneming; ingeval de onderneming waaraan de betrokken
      personen verbonden zijn, tot een groep behoort, wordt de groep gelijkgesteld met die onderneming;

      d. een beroepspensioenfonds handelt ter uitvoering van:

      1°. een verplichtstellingsbeschikking als bedoeld in
      [artikel 2, eerste lid, van de Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref11]; of

      2°. een vrijwillige pensioenvoorziening ten bate van een deelnemer of gewezen deelnemer die hetzij past binnen
      het raam van de regeling die in het pensioenfonds geldt ter uitvoering van een verplichtstellingsbeschikking als
      bedoeld onder 1°, hetzij kan worden beschouwd als een fase in de ontwikkelingsgang naar een eventuele uitbreiding
      van de werkingssfeer van de ten behoeve van nabestaanden in de regeling opgenomen voorzieningen;

      e. het pensioenfonds, bedoeld in het derde lid, onderdeel *d*, handelt ter uitvoering van:

      1°. de Wet tot invoering van een leeftijdsgrens voor het notarisambt en de oprichting van een notarieel
      pensioenfonds;

      2°. een vrijwillige pensioenvoorziening ten bate van een deelnemer of gewezen deelnemer, die hetzij past binnen het
      raam van de regeling die in het betrokken pensioenfonds geldt ter uitvoering van de onder 1° genoemde toepasselijke
      wet, hetzij kan worden beschouwd als een fase in de ontwikkelingsgang naar een eventuele uitbreiding van de
      werkingssfeer van de ten behoeve van nabestaanden in de regeling opgenomen voorzieningen.

      5 Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere beperkingen en verdere regels
      stellen met betrekking tot het bepaalde in het vierde lid, aanhef en onderdeel *a*, onder 2, 3 en 4, onderdelen
      *b* en *c*, onderdeel *d*, onder 2, en onderdeel *e*, onder 2. Onze voornoemde ministers kunnen de Pensioen- &
      Verzekeringskamer en de Sociaal-Economische Raad om advies vragen. In dat geval zijn deze verplicht dit advies uit
      te brengen.

      6 De Pensioen- & Verzekeringskamer kan in bijzondere gevallen ontheffing verlenen van het bepaalde in het vierde
      lid. Aan een ontheffing kunnen beperkingen worden gesteld of voorschriften worden verbonden en zij kan worden
      ingetrokken.


