  - number: 147a
    text: |-
      1 Dit hoofdstuk is van toepassing op levensverzekeraars:

      a. met zetel in Nederland;

      b. met zetel buiten de Unie voor zover het betreft het vanuit de bijkantoren in Nederland uitgeoefende
      verzekeringsbedrijf, tenzij een voordeelregeling overeenkomstig [artikel 49][ref1] van toepassing is, waarbij
      de Pensioen- & Verzekeringskamer niet de toezichthoudende autoriteit is, belast met het toezicht op de in
      [artikel 96][ref2] bedoelde solvabiliteitsmarge van die verzekeraar.

      2 In afwijking van [artikel 14, eerste lid][ref3], zijn dit hoofdstuk en de
      [artikelen 28, tweede tot en met vierde lid][ref4], [29, eerste en tweede lid][ref5], [29a][ref6], [70][ref7],
      [71][ref8], [73, eerste lid][ref9], [75, eerste lid, onderdelen a en b, tweede en derde lid][ref10],
      [175 tot en met 176][ref11], en [188b tot en met 188m][ref12] tevens van overeenkomstige toepassing op
      opvanginstellingen die het verzekeringsbedrijf uitsluitend als herverzekeraar uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel49
