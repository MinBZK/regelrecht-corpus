  - number: '175'
    text: |-
      1 Het is iedere natuurlijke persoon of rechtspersoon verboden, anders dan na verkregen verklaring van geen bezwaar,
      een gekwalificeerde deelneming in een verzekeraar met zetel in Nederland te houden, te verwerven of te vergroten
      dan wel enige zeggenschap verbonden aan een gekwalificeerde deelneming in een verzekeraar met zetel in Nederland
      uit te oefenen.

      2 Een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid wordt verleend, tenzij:

      a. de Pensioen- & Verzekeringskamer van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een invloed
      op de betrokken verzekeraar die in strijd is met het belang van degenen die als verzekeringnemers, verzekerden
      of gerechtigden op uitkeringen betrokken zijn of zullen worden bij overeenkomsten van verzekering, gesloten of te
      sluiten door een rechtstreeks of middellijk bij de handeling betrokken verzekeraar;

      b. De Pensioen- & Verzekeringskamer van oordeel is dat de handeling ertoe zou leiden of zou kunnen leiden
      dat de betrokken verzekeraar behoort of zou gaan behoren tot een groep waarbinnen de formele of feitelijke
      zeggenschapsstructuur in zodanige mate ondoorzichtig is dat deze een belemmering zou vormen voor het adequaat
      uitoefenen van toezicht op de verzekeraar;

      c. de Pensioen- & Verzekeringskamer van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een
      ongewenste ontwikkeling van het verzekeringswezen; of

      d. de Pensioen- & Verzekeringskamer van oordeel is dat een integere bedrijfsvoering onvoldoende
      is gewaarborgd, waarbij onder integere bedrijfsvoering wordt verstaan de bedrijfsvoering met
      uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1]; of

      e. Onze Minister van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling
      van het verzekeringswezen.

      3 Aan een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid kunnen op grond van de
      overwegingen als bedoeld in het tweede lid, onderdelen a, b, c en d, onderscheidenlijk het tweede lid, onderdeel e,
      beperkingen worden gesteld en voorschriften worden verbonden.

      4 Ingeval het houden, het verwerven of het vergroten van een gekwalificeerde deelneming in een verzekeraar als
      bedoeld in het eerste lid is verricht, zonder dat voor die handeling een verklaring van geen bezwaar is verkregen
      of de bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is de in overtreding zijnde
      natuurlijke persoon of rechtspersoon gehouden binnen een door Onze Minister dan wel vanwege Onze Minister door de
      Pensioen- & Verzekeringskamer te bepalen termijn de verrichte handeling ongedaan te maken dan wel de beperkingen
      alsnog in acht te nemen. Deze verplichting vervalt op het tijdstip waarop en voor zover voor de desbetreffende
      handeling alsnog een verklaring van geen bezwaar wordt verleend dan wel de niet in acht genomen beperkingen worden
      ingetrokken.

      5 Ingeval het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde deelneming in een verzekeraar
      als bedoeld in het eerste lid geschiedt, zonder dat voor het houden, het verwerven of het vergroten van de
      gekwalificeerde deelneming dan wel voor het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde
      deelneming in een verzekeraar als bedoeld in het eerste lid een verklaring van geen bezwaar is verkregen of de
      bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is een mede door de uitgeoefende
      zeggenschap tot stand gekomen besluit vernietigbaar. Het besluit kan worden vernietigd op vordering van Onze
      Minister dan wel vanwege Onze Minister van de Pensioen- & Verzekeringskamer. Het besluit wordt in dat geval door
      de rechtbank, binnen welker rechtsgebied de verzekeraar gevestigd is, vernietigd indien het besluit zonder dat de
      desbetreffende zeggenschap zou zijn uitgeoefend, anders zou hebben geluid dan wel niet zou zijn genomen, tenzij
      voor het tijdstip van de uitspraak alsnog een verklaring van geen bezwaar wordt verleend dan wel de niet in acht
      genomen beperkingen worden ingetrokken. De rechtbank regelt voor zover nodig de gevolgen van de vernietiging.

      6 Ingeval aan de verklaring van geen bezwaar als bedoeld in het eerste lid verbonden voorschriften niet worden
      nagekomen, kan Onze Minister dan wel vanwege Onze Minister de Pensioen- & Verzekeringskamer een termijn vaststellen
      waarbinnen de in overtreding zijnde natuurlijke persoon dan wel rechtspersoon de niet nagekomen voorschriften
      alsnog moet vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
