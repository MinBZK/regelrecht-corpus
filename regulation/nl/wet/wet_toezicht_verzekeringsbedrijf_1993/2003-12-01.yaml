  - number: '85'
    text: |-
      1 Een verzekeraar die voor de eerste maal een bijkantoor opent, stelt als zijn vertegenwoordiger een natuurlijk
      persoon of een rechtspersoon aan.

      2 De vertegenwoordiger heeft ten aanzien van de uitoefening van het verzekeringsbedrijf vanuit de bijkantoren
      in Nederland van rechtswege alle bevoegdheden die de verzekeraar bezit. Hij maakt daarvan gebruik voor zover de
      Pensioen- & Verzekeringskamer zulks verlangt.

      3 De vertegenwoordiger is gehouden namens de verzekeraar te voldoen aan de bij of krachtens deze wet gegeven
      voorschriften. Het ontbreken van de vertegenwoordiger of zijn in gebreke zijn ontslaat de verzekeraar niet van de
      verplichting te voldoen aan deze voorschriften.

      4 Is de vertegenwoordiger rechtspersoon, dan wijst hij op zijn beurt een natuurlijk persoon aan die hem bij
      uitsluiting van ieder ander vertegenwoordigt bij de uitoefening van zijn bevoegdheden en bij de nakoming van zijn
      uit deze wet voortvloeiende verplichtingen.

      5 Mededelingen aan de vertegenwoordiger kunnen rechtsgeldig worden gestuurd aan het adres van het bijkantoor dat is
      opgegeven ingevolge de procedure, bedoeld in [artikel 37][ref1], of zoals dat is gewijzigd ingevolge de procedure,
      bedoeld in [artikel 38][ref2]. Voor de toepassing van deze wet wordt als woonplaats van de verzekeraar en van de
      vertegenwoordiger in Nederland dat bijkantoor aangemerkt.

      6 Zolang de vertegenwoordiger ontbreekt, wordt de verzekeraar geacht zijn woonplaats te hebben ten parkette van de
      officier van justitie bij de rechtbank binnen welker rechtsgebied de verzekeraar volgens het vijfde lid, laatste
      volzin, het laatst zijn woonplaats had, of anders ten parkette van de officier van justitie bij de rechtbank binnen
      welker rechtsgebied de Pensioen- & Verzekeringskamer is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel38
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel85
