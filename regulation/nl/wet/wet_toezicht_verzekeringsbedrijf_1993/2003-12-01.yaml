  - number: '179'
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. eerste richtlijn schadeverzekering: eerste [richtlijn nr. 73/239/EEG](31973L0239) van de Raad van de Europese
      Gemeenschappen van 24 juli 1973 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de
      toegang tot het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche, en de uitoefening
      daarvan (*PbEG* L 228);

      b. eerste richtlijn levensverzekering: eerste [richtlijn nr. 79/267/EEG](31979L0267) van de Raad van de Europese
      Gemeenschappen van 5 maart 1979 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de
      toegang tot het directe levensverzekeringsbedrijf, en de uitoefening daarvan (*PbEG* L 63).

      2 Onze Minister kan, ter uitvoering van [artikel 29][ref1]*ter*, vijfde lid, van de eerste richtlijn
      schadeverzekering en [artikel 32][ref2]*ter*, vijfde lid, van de eerste richtlijn levensverzekering bepalen dat met
      ingang van een door hem te bepalen tijdstip ondernemingen met zetel in een door hem aan te wijzen staat buiten de
      Unie, alvorens zij een deelneming verwerven in een onderneming met zetel in Nederland die in het bezit is van een
      vergunning als bedoeld in [artikel 24, eerste lid][ref3], waardoor deze hun dochtermaatschappij wordt, hem daarvan
      schriftelijk in kennis stellen.

      3 De Pensioen- & Verzekeringskamer stelt met ingang van het tijdstip, bedoeld in het tweede lid, Onze Minister
      desgevraagd in kennis van elke aanvraag van een eerste vergunning, ingediend door een dochtermaatschappij met zetel
      in Nederland van een onderneming met zetel in de door Onze Minister ingevolge het tweede lid aangewezen staat.

      4 Onze Minister kan, ter uitvoering van een besluit als bedoeld in [artikel 29][ref4]*ter*, vierde lid, tweede
      alinea, van de eerste richtlijn schadeverzekering en [artikel 32][ref5]*ter*, vierde lid, tweede alinea, van de
      eerste richtlijn levensverzekering, bepalen dat met ingang van een door hem te bepalen tijdstip:

      a. het aan ondernemingen met zetel in een door Onze Minister aan te wijzen staat buiten de Unie is verboden een
      deelneming te verwerven in een onderneming met zetel in Nederland die in het bezit is van een vergunning als
      bedoeld in [artikel 24, eerste lid][ref6], indien deze daardoor dochtermaatschappij van de betrokken onderneming
      wordt; en

      b. de Pensioen- & Verzekeringskamer met betrekking tot ondernemingen met zetel in Nederland die dochtermaatschappij
      zijn van een onderneming met zetel in de ingevolge onderdeel *a* aangewezen staat en die voor de eerste maal een
      vergunning aanvragen, haar beslissingen op deze aanvragen opschort dan wel aan niet meer dan een door Onze Minister
      te bepalen aantal van deze ondernemingen een vergunning verleent.

      5 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop een beperking van het
      aantal ondernemingen waaraan een vergunning mag worden verleend als bedoeld in het vierde lid, onderdeel *b*, moet
      worden toegepast.

      6 Onze Minister bepaalt het tijdstip waarop de maatregelen, genomen ingevolge het tweede of het vierde lid, worden
      beëindigd.

      7 Onze Minister kan van het verbod, bedoeld in het vierde lid, onderdeel *a*, ontheffing verlenen.

      8 Na beëindiging van de opschorting, bedoeld in het vierde lid, onderdeel *b*, neemt de Pensioen- &
      Verzekeringskamer de betrokken aanvragen opnieuw in behandeling. Artikel 36, eerste lid, is op deze behandeling van
      overeenkomstige toepassing.

      9 Bij overtreding van het verbod, bedoeld in het vierde lid, onderdeel *a*, is degene die de deelneming heeft
      verworven, gehouden binnen een door Onze Minister te bepalen termijn de deelneming ongedaan te maken.

      10 Handelingen, verricht uit hoofde van een deelneming die in strijd met het verbod, bedoeld in het vierde lid,
      onderdeel *a*, is verworven, zijn nietig.

      11 Het vierde lid is niet van toepassing op aanvragen van vergunningen door dochtermaatschappijen van verzekeraars
      met zetel in de Unie en op verwerving van deelnemingen door verzekeraars met zetel in de Unie.


