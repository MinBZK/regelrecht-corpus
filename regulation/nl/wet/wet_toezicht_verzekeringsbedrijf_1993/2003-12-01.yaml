  - number: 187a
    text: |-
      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid zenden in 2005 en vervolgens telkens na vijf
      jaar aan de Staten-Generaal een gezamenlijk verslag over de doeltreffendheid en doelmatigheid van het functioneren
      van de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel187a
  - number: '188'
    text: |-
      1 In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.

      2 Ten aanzien van besluiten tot intrekking van een vergunning, tot weigering van toestemming
      voor een financieringsplan en tot inwerkingstelling van het opvanginstrument blijft
      [artikel 7:1 van de Algemene wet bestuursrecht][ref2] buiten toepassing. [Artikel 147c, tweede lid][ref3], is van
      overeenkomstige toepassing.

      3 Ingeval beroep wordt ingesteld tegen besluiten als bedoeld in de [artikelen 54][ref4], [122][ref5], [124][ref6],
      [128][ref7], [130][ref8], [131][ref9], [132][ref10], [136][ref11], [137][ref12], [137a][ref13], [138][ref14],
      [140][ref15], [141][ref16], [142][ref17], [143][ref18], [144][ref19], [146][ref20], [147][ref21], [147c][ref22],
      [147h][ref23], [150][ref24], [176][ref25] en [188a, eerste lid][ref26], zal de terechtzitting worden gehouden met
      gesloten deuren. De uitspraak wordt alsdan niet in het openbaar uitgesproken.


