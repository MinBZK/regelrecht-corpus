  - number: '82'
    text: |-
      1 De vertegenwoordiger heeft ten aanzien van de uitoefening van het verzekeringsbedrijf vanuit de bijkantoren in
      de betrokken lid-staten van rechtswege alle bevoegdheden die de verzekeraar bezit. Hij maakt daarvan gebruik voor
      zover de Pensioen- & Verzekeringskamer zulks verlangt.

      2 Is de vertegenwoordiger rechtspersoon, dan wijst hij op zijn beurt een natuurlijk persoon aan die hem bij
      uitsluiting van ieder ander vertegenwoordigt bij de uitoefening van zijn bevoegdheden en bij de nakoming van zijn
      verplichtingen.

      3 [Artikel 29, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de natuurlijke persoon die als
      vertegenwoordiger is aangesteld en op de natuurlijke persoon, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel29
