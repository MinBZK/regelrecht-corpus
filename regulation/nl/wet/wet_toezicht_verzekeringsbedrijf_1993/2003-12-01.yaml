        artikel: 100a
        hoofdstuk: III
        paragraaf: '5'
        afdeling: '4'
  - number: 100a
    text: |-
      1 Een verzekeraar doet de staten, bedoeld in [artikel 100, eerste lid][ref1], vergezeld
      gaan van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Ten bewijze dat de staten door hem
      zijn onderzocht of, indien het staten betreft als bedoeld in [artikel 100, tweede lid][ref3], in zijn onderzoek
      zijn betrokken, waarmerkt de accountant de staten. De verzekeraar machtigt bij de opdracht tot het onderzoek
      de accountant schriftelijk desgevraagd of ingevolge een daartoe strekkende overeenkomst tussen de verzekeraar,
      de accountant en de Pensioen- & Verzekeringskamer, aan de Pensioen- & Verzekeringskamer alle inlichtingen te
      verstrekken, die redelijkerwijze geacht kunnen worden nodig te zijn voor de vervulling van de haar bij of krachtens
      deze wet opgelegde taak. De Pensioen- & Verzekeringskamer stelt de verzekeraar in de gelegenheid aanwezig te zijn
      bij het verstrekken van inlichtingen door de accountant.

      2 De accountant, bedoeld in het eerste lid, meldt de Pensioen- & Verzekeringskamer zo spoedig mogelijk elke
      omstandigheid waarvan hij bij de uitvoering van zijn werkzaamheden als bedoeld in het eerste lid kennis heeft
      gekregen en die:

      a. in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;

      b. in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;

      c. het voortbestaan van de verzekeraar bedreigt; of

      d. leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.

      3 Op de accountant die naast zijn werkzaamheden voor de verzekeraar ook werkzaamheden uitvoert voor een andere
      onderneming of instelling, is de meldingsplicht, bedoeld in het tweede lid, van overeenkomstige toepassing indien
      de verzekeraar dochtermaatschappij is van de andere onderneming of instelling, dan wel indien de andere onderneming
      of instelling dochtermaatschappij is van de verzekeraar. Voor de toepassing van de eerste volzin wordt onder
      dochtermaatschappij verstaan een dochtermaatschappij als bedoeld in artikel 24*a* van Boek 2 van het Burgerlijk
      Wetboek, met dien verstande dat een verzekeraar tevens dochtermaatschappij kan zijn van een natuurlijk persoon
      of vennootschap.

      4 De accountant die op grond van het tweede of derde lid tot een melding aan de Pensioen- & Verzekeringskamer is
      overgegaan, is niet aansprakelijk voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt
      dat, gelet op alle feiten en omstandigheden, in redelijkheid niet tot melding had mogen worden overgegaan.

      5 Indien de accountant naar het oordeel van de Pensioen- & Verzekeringskamer niet of niet meer de nodige waarborgen
      biedt dat deze de toevertrouwde taak met betrekking tot de verzekeraar naar behoren zal vervullen, kan de Pensioen-
      & Verzekeringskamer bepalen dat hij niet bevoegd is een verklaring als bedoeld in het eerste lid met betrekking tot
      die verzekeraar af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel100
