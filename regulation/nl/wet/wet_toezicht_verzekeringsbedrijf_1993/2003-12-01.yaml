  - number: '57'
    text: |-
      De toezichthoudende autoriteit van een andere lid-staat stelt de Pensioen- & Verzekeringskamer van haar voornemen
      in kennis ten behoeve van het financiële toezicht op een in Nederland gelegen bijkantoor van een verzekeraar
      met zetel in die lid-staat gegevens te verifiëren. Degene bij wie gegevens worden geverifieerd verleent aan de
      toezichthoudende autoriteit en diens functionarissen alle medewerking die nodig is voor een goede uitvoering van
      die verificatie. De Pensioen-& Verzekeringskamer kan aan die verificatie deelnemen of door personen, door haar bij
      uitdrukkelijke en bijzondere machtiging aangewezen, doen deelnemen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel57
  - number: '58'
    text: |-
      1 Een verzekeraar die uitsluitend de branche Rechtsbijstand uitoefent, draagt er zorg voor dat, voor zover de
      personeelsleden zich bezighouden met de schaderegeling of met het geven van juridische adviezen met betrekking
      tot deze regeling, zij niet terzelfder tijd dezelfde of soortgelijke werkzaamheden uitoefenen voor een andere
      verzekeraar die met eerstbedoelde verzekeraar financiële, commerciële of administratieve banden heeft en die een of
      meer andere branches uitoefent.

      2 De verzekeraar, bedoeld in het eerste lid, kan de schaderegeling geheel of gedeeltelijk toevertrouwen aan een
      juridisch zelfstandig schaderegelingskantoor dat:

      a. wordt vermeld in de overeenkomst van verzekering; en

      b. indien het financiële, commerciële of administratieve banden heeft met een verzekeraar die een of meer andere
      branches dan de branche Rechtsbijstand uitoefent, ervoor zorg draagt dat de personeelsleden en de leden van het
      leidinggevend orgaan die zich bezighouden met de schaderegeling of met het geven van juridische adviezen met
      betrekking tot deze regeling, niet terzelfder tijd voor deze verzekeraar dezelfde of soortgelijke werkzaamheden
      uitoefenen.

      3 De verzekeraar, bedoeld in het eerste lid, neemt, voor zover hij geen gebruik maakt van de in het eerste en
      tweede lid bedoelde methoden, in de overeenkomst van verzekering de bepaling op dat de verzekerde, zodra hij uit
      hoofde van deze overeenkomst recht heeft op rechtsbijstand, de behartiging van zijn belangen mag toevertrouwen aan
      een advocaat of een andere rechtens bevoegde deskundige van zijn keuze.

      4 Een verzekeraar die naast de branche Rechtsbijstand een of meer andere branches uitoefent, kan de schaderegeling
      geheel of gedeeltelijk toevertrouwen aan een juridisch zelfstandig schaderegelingskantoor dat:

      a. wordt vermeld in de overeenkomst van verzekering; en

      b. indien het financiële, commerciële of administratieve banden heeft met een verzekeraar die een of meer andere
      branches dan de branche Rechtsbijstand uitoefent, ervoor zorg draagt dat de personeelsleden en de leden van het
      leidinggevende orgaan die zich bezighouden met de schaderegeling of met het geven van juridische adviezen met
      betrekking tot deze regeling, niet terzelfder tijd voor deze verzekeraar dezelfde of soortgelijke werkzaamheden
      uitoefenen.

      5 De verzekeraar, bedoeld in het vierde lid, neemt, voor zover hij geen gebruik maakt van de in dat lid bedoelde
      methode, in de overeenkomst van verzekering de bepaling op dat de verzekerde, zodra hij uit hoofde van deze
      overeenkomst recht heeft op rechtsbijstand, de behartiging van zijn belangen mag toevertrouwen aan een advocaat of
      een andere rechtens bevoegde deskundige van zijn keuze.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel58
  - number: '59'
    text: |-
      Een verzekeraar die de branche Rechtsbijstand uitoefent, draagt er zorg voor dat de inhoud van de
      rechtsbijstanddekking wordt opgenomen in hetzij een afzonderlijke overeenkomst hetzij een afzonderlijk hoofdstuk
      van de overeenkomst van verzekering indien deze tevens risico’s van andere branches dekt.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel59
  - number: '60'
    text: |-
      Een verzekeraar die overeenkomstig [artikel 58, eerste, tweede of vierde lid][ref1], de branche Rechtsbijstand
      uitoefent, draagt er zorg voor dat uitdrukkelijk in de overeenkomst van verzekering wordt bepaald dat het de
      verzekerde in ieder geval vrij staat een advocaat of een andere rechtens bevoegde deskundige te kiezen indien:

      a. een advocaat of een andere rechtens bevoegde deskundige wordt verzocht de belangen van de verzekerde in een
      gerechtelijke of administratieve procedure te verdedigen, te vertegenwoordigen of te behartigen;

      b. zich een belangenconflict voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel58
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '58'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '1'
  - number: '61'
    text: |-
      Een verzekeraar als bedoeld in [artikel 60][ref1] draagt er zorg voor dat uitdrukkelijk in de overeenkomst van
      verzekering wordt voorzien in een scheidsrechterlijke procedure of een andere procedure die vergelijkbare garanties
      inzake objectiviteit biedt, teneinde te bepalen welke gedragslijn er bij verschil van mening tussen de verzekeraar
      dan wel het juridisch zelfstandige schaderegelingskantoor en de verzekerde zal worden gevolgd voor de regeling van
      het geschil waarvoor een beroep op rechtsbijstandverzekering wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel60
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '60'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '1'
  - number: '62'
    text: |-
      Een verzekeraar als bedoeld in [artikel 60][ref1] dan wel een juridisch zelfstandig schaderegelingskantoor
      als bedoeld in [artikel 58, tweede of vierde lid][ref2], draagt er zorg voor dat, telkens wanneer zich een
      belangenconflict voordoet of er een verschil van mening bestaat over de regeling van het geschil, de verzekerde op
      de hoogte wordt gebracht van het in [artikel 60][ref3] bedoelde recht onderscheidenlijk van de mogelijkheid gebruik
      te maken van de in [artikel 61][ref4] bedoelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel60
