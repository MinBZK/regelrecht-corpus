  - number: '187'
    text: |-
      1 Voor de uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere regels worden
      gesteld.

      2 Onze Minister kan representatieve organisaties van verzekeraars aanwijzen.
