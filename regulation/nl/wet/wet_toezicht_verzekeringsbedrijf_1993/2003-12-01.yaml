  - number: '132'
    text: |-
      1 Indien een verzekeraar met zetel in een andere lid-staat dan Nederland toestemming vraagt aan de toezichthoudende
      autoriteit van de lid-staat van zijn zetel om zijn rechten en verplichtingen uit een of meer overeenkomsten van
      levensverzekering in het kader van diens bedrijfsuitoefening vanuit een bijkantoor in Nederland over te dragen
      aan een andere verzekeraar, doet hij van de voorgenomen overdracht onverwijld mededeling in de *Staatscourant* en
      op andere door de Pensioen- & Verzekeringskamer te bepalen wijze. Daarbij wordt mededeling gedaan van een door de
      Pensioen- & Verzekeringskamer vast te stellen termijn, binnen welke de betrokken polishouders zich bij de Pensioen-
      & Verzekeringskamer schriftelijk tegen de overdracht kunnen verzetten.

      2 Indien polishouders, vertegenwoordigende een vierde of meer van het betrokken verzekerd bedrag, zich binnen de
      gestelde termijn tegen de overdracht hebben verzet, luidt het oordeel van de Pensioen- & Verzekeringskamer, bedoeld
      in het vijfde lid, afwijzend.

      3 [Artikel 131, zevende lid][ref1], is van overeenkomstige toepassing.

      4 Voor de toepassing van het eerste of tweede lid wordt onder polishouder verstaan de verzekeringnemer of zijn
      rechtsopvolger, doch indien een uitkering uit de verzekering opeisbaar is, de tot uitkering gerechtigde. Artikel
      131, achtste lid, laatste volzin, is van toepassing.

      5 Indien een toezichthoudende autoriteit van een andere lid-staat dan Nederland de Pensioen- & Verzekeringskamer
      vraagt om haar advies of instemming betreffende een overdracht van rechten en verplichtingen uit een of meer
      overeenkomsten van levensverzekering, geeft zij haar oordeel binnen drie maanden na ontvangst van het daartoe
      strekkende verzoek.

      6 Indien de overdracht geschiedt aan een verzekeraar met zetel in een andere lid-staat dan Nederland in het
      kader van diens bedrijfsuitoefening vanuit een buiten Nederland gelegen vestiging, verleent de Pensioen- &
      Verzekeringskamer geen instemming voor zover de overdracht betrekking heeft op vanuit een in Nederland gelegen
      bijkantoor gesloten overeenkomsten waarbij geen sprake is van het verrichten van diensten en de overdracht niet in
      het belang is van degenen die aan de betrokken overeenkomsten rechten kunnen ontlenen.

      7 Indien de overdracht geschiedt aan een verzekeraar met zetel buiten de Unie in het kader van diens
      bedrijfsuitoefening vanuit een buiten Nederland gelegen vestiging, verleent de Pensioen- & Verzekeringskamer
      geen instemming voor zover de overdracht betrekking heeft op vanuit een in Nederland gelegen bijkantoor gesloten
      overeenkomsten waarbij geen sprake is van het verrichten van diensten, tenzij de overdracht in het belang is van
      degenen die aan de betrokken overeenkomsten rechten kunnen ontlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel131
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel132
