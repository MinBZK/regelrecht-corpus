  - number: '2'
    text: |-
      1 Er is een Pensioen- & Verzekeringskamer, waarbij het toezicht op de verzekeraars berust, zoals dit uit deze wet
      voortvloeit.

      2 De Pensioen- & Verzekeringskamer verstrekt Onze Minister desgevraagd de inlichtingen die nodig zijn voor de
      beoordeling van de uitvoerbaarheid van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens, voor
      zover deze betrekking hebben op het levens- en schadeverzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid wijzen als Pensioen- & Verzekeringskamer een
      rechtspersoon aan, die voldoet aan de volgende eisen:

      a. hij dient in staat te zijn de bij of krachtens de wet aan de Pensioen- & Verzekeringskamer opgedragen taken naar
      behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van die taken is gewaarborgd;

      c. de statuten van de rechtspersoon dienen te voorzien in een raad van toezicht ter zake van het beheer, bestaande
      uit onafhankelijke deskundigen, en in een pensioenraad waarin bij het pensioen- en spaarfondsenwezen betrokkenen,
      waaronder het bestuur van de rechtspersoon, werkgevers, werknemers, en de overheid zijn vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen een aanwijzing als bedoeld in
      [artikel 3][ref1] intrekken indien de rechtspersoon naar hun oordeel niet meer aan de in die bepaling gestelde
      eisen voldoet.

      2 De intrekking, bedoeld in het eerste lid, doet de vermogensbestanddelen van de rechtspersoon onder algemene titel
      op de staat overgaan.

      3 De intrekking geschiedt onder gelijktijdige voorziening door Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid in de bij of krachtens de wet aan de Pensioen- & Verzekeringskamer opgedragen taken.

      4 Bij regeling van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen regels worden gesteld
      met betrekking tot de voorziening, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel3
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '3'
        hoofdstuk: I
  - number: '5'
    text: |-
      Van een aanwijzing als bedoeld in [artikel 3][ref1] en de intrekking daarvan wordt in de *Staatscourant* mededeling
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel3
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '3'
        hoofdstuk: I
  - number: '6'
    text: |-
      1 Het bestuur van de Pensioen- & Verzekeringskamer bestaat uit ten minste drie en ten hoogste vijf leden. De
      voorzitter en de andere leden van het bestuur van de Pensioen- & Verzekeringskamer worden bij koninklijk besluit
      benoemd en ontslagen. Elke benoeming geschiedt voor ten hoogste zes jaren uit een niet bindende voordracht, op te
      maken door het bestuur en de raad van toezicht gezamenlijk. Herbenoeming is mogelijk.

      2 De voorzitter en de andere leden van de raad van toezicht van de Pensioen- & Verzekeringskamer worden bij
      koninklijk besluit benoemd en ontslagen. Elke benoeming geschiedt voor ten hoogste vijf jaren uit een niet bindende
      voordracht, op te maken door de raad van toezicht, het bestuur gehoord. Herbenoeming is eenmaal mogelijk.

      3 Bij de benoemingen die met ingang van de dag van aanwijzing van de Pensioen- & Verzekeringskamer geschieden,
      vinden de bepalingen inzake voordrachten geen toepassing.

      4 Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen de voorzitter en de andere leden van
      het bestuur, alsmede de voorzitter en de andere leden van de raad van toezicht bij gezamenlijk besluit schorsen.

      5 Van de in dit artikel bedoelde benoemingen, schorsingen en ontslagen wordt in de *Staatscourant* mededeling
      gedaan.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel6
  - number: '7'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan haar statuten niet wijzigen zonder voorafgaande toestemming van
      Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid. De [artikelen 10:28][ref1] tot en met
      [10:31 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.

      2 Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen de toestemming slechts weigeren indien
      de statuten na de wijziging onvoldoende zouden zijn afgestemd op de in [artikel 3][ref3] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel3
