  - number: '169'
    text: |-
      1 De bewindvoerders dienen, de Pensioen- & Verzekeringskamer gehoord, een verzoek tot faillietverklaring in, indien
      blijkt dat de verzekeraar een negatief eigen vermogen heeft en het met de verleende machtiging te bereiken doel
      is verwezenlijkt of niet meer kan worden verwezenlijkt. De Pensioen- & Verzekeringskamer dient een verzoek tot
      faillietverklaring in indien geen machtiging werd verleend en geen redelijk vooruitzicht meer bestaat dat het met
      een machtiging te bereiken doel alsnog kan worden verwezenlijkt.

      2 Bij de beoordeling van de omvang van het eigen vermogen van een verzekeraar met zetel buiten Nederland worden
      uitsluitend de activa en passiva in aanmerking genomen die moeten worden gerekend tot het vanuit zijn bijkantoren
      in Nederland uitgeoefende verzekeringsbedrijf.

      3 De bewindvoerders onderscheidenlijk de Pensioen- & Verzekeringskamer kunnen een verzoek als bedoeld in de eerste
      volzin onderscheidenlijk de tweede volzin van het eerste lid zonder tussenkomst van een procureur indienen. De
      faillietverklaring wordt uitgesproken ongeacht of de verzekeraar verkeert in een toestand van te hebben opgehouden
      te betalen. Het bepaalde in de eerste titel en in [artikel 284 van de Faillissementswet][ref1] is overigens van
      toepassing.

      4 De Pensioen- & Verzekeringskamer geeft van het verzoek tot faillietverklaring en van de faillietverklaring kennis
      aan de in [artikel 156, vijfde lid][ref2], bedoelde toezichthoudende autoriteiten.

      5 De noodregeling en de machtiging houden van rechtswege op van kracht te zijn ingeval de verzekeraar in staat van
      faillissement wordt verklaard. Alsdan, zomede indien de faillietverklaring wordt uitgesproken binnen vier weken na
      de beëindiging van de noodregeling, gelden de volgende bepalingen:

      a. het tijdstip waarop de termijnen, in de [artikelen 43][ref3] en [45 van de Faillissementswet][ref4] vermeld,
      aanvangen, wordt berekend vanaf het tijdstip waarop de beschikking houdende machtiging uitvoerbaar is geworden;

      b. een beroep op verrekening kan in afwijking van [artikel 53 van de Faillissementswet][ref5] slechts worden gedaan
      indien de vordering en de schuldplichtigheid beide zijn ontstaan voor het tijdstip waarop de beschikking, houdende
      machtiging, uitvoerbaar is geworden, of voortvloeien uit een handeling voor dat tijdstip met de gefailleerde
      verricht;

      c. handelingen, ingevolge [artikel 161][ref6] door of namens de bewindvoerders verricht gedurende de tijd dat de
      machtiging van kracht was, worden beschouwd als handelingen van de curator, terwijl boedelschulden, gedurende die
      tijd ontstaan, ook in het faillissement als boedelschulden zullen gelden;

      d. de boedel is niet aansprakelijk voor verbintenissen van de verzekeraar die in strijd met
      [artikel 161, eerste en zesde lid][ref7], zijn aangegaan gedurende de tijd dat de machtiging van kracht was, dan
      voor zover deze daardoor is gebaat;

      e. vorderingen uit overeenkomsten van levensverzekering kunnen in afwijking van
      [artikel 110, eerste lid, van de Faillissementswet][ref8] worden ingediend door overlegging van de polis of een
      afschrift daarvan, zonder dat het bedrag van de vordering behoeft te worden vermeld. Voor zover de curator de
      vordering erkent, stelt hij de omvang daarvan vast;

      f. overigens is, voor zover niet reeds ingevolge [artikel 163a][ref9] tot volledige uitvoering gekomen, het
      bepaalde in [titel I van de Faillissementswet][ref10] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel284
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel156
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel43
