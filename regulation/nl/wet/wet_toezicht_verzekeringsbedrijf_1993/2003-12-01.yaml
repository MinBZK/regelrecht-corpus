      - id: ref1
        bwb_id: BWBR0006509
        artikel: '66'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: 137a
    text: |-
      1 Indien de rechten van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen betrokken
      zijn bij overeenkomsten van verzekering, gesloten door een verzekeraar, naar het oordeel van de Pensioen- &
      Verzekeringskamer in het gedrang komen, kan zij van de verzekeraar een herstelplan verlangen, tenzij de verzekeraar
      niet langer beschikt over het minimum bedrag aan vereiste solvabiliteitsmarge.

      2 Indien op grond van de in het eerste lid bedoelde omstandigheden de Pensioen- & Verzekeringskamer een
      herstelplan verlangt van de verzekeraar en de financiële positie van de verzekeraar verslechtert, kan de
      Pensioen- & Verzekeringskamer aan de verzekeraar voorschrijven dat hij over een hoger minimum bedrag aan vereiste
      solvabiliteitsmarge beschikt dan bij of krachtens algemene maatregel van bestuur is voorgeschreven, teneinde
      te waarborgen dat de verzekeraar in staat is in de nabije toekomst te blijven voldoen aan het bij of krachtens
      algemene maatregel van bestuur voorgeschreven minimum bedrag aan vereiste solvabiliteitsmarge. Bij de vaststelling
      van het niveau van een hoger minimum bedrag aan vereiste solvabiliteitsmarge wordt uitgegaan van het in het eerste
      lid bedoelde herstelplan en kan de termijn worden bepaald binnen welke termijn het hogere vereiste, als bedoeld in
      de eerste volzin, dient te zijn bereikt.

      3 Een verzekeraar dient binnen een door de Pensioen- & Verzekeringskamer te bepalen termijn, bij de Pensioen- &
      Verzekeringskamer een herstelplan ter toestemming in, dat aangeeft op welke wijze en binnen welke termijn een einde
      wordt gemaakt aan de omstandigheden die aanleiding gaven tot het verlangen van het herstelplan.

      4 Een herstelplan bevat voor de volgende drie boekjaren ten minste gegevens betreffende:

      a. een raming van de kosten van beheer, met name van de algemene lopende kosten en de provisies;

      b. een gedetailleerde prognose van de vermoedelijke ontvangsten en uitgaven betreffende directe verzekeringen, de
      geaccepteerde herverzekeringen en overdrachten uit hoofde van herverzekering;

      c. de te verwachten balanspositie;

      d. een raming van de financiële middelen ter dekking van de verplichtingen en van de vereiste solvabiliteitsmarge;
      en

      e. het algemene herverzekeringsbeleid.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel137a
  - number: '138'
    text: |-
      1 Indien een verzekeraar niet meer beschikt over het minimum bedrag aan vereiste solvabiliteitsmarge, bedoeld in
      [artikel 68, eerste lid][ref1], dient hij - tenzij het tweede lid van toepassing is - binnen acht weken of zoveel
      eerder als de Pensioen- & Verzekeringskamer bepaalt, bij de Pensioen- & Verzekeringskamer een saneringsplan ter
      toestemming in, dat aangeeft op welke wijze en binnen welke termijn de solvabiliteitsmarge weer op de vereiste
      omvang zal worden gebracht.

      2 Indien de solvabiliteitsmarge is gedaald of naar het oordeel van de Pensioen- & Verzekeringskamer zal dalen
      beneden het vereiste garantiefonds, dient de verzekeraar bij de Pensioen- & Verzekeringskamer binnen een
      door haar te bepalen termijn een financieringsplan ter toestemming in, dat aangeeft hoe op korte termijn de
      solvabiliteitsmarge weer op de vereiste omvang zal worden gebracht.

      3 Ingeval [artikel 137a, eerste lid][ref2], reeds toepassing vond, geeft het saneringsplan tevens aan hoe het
      herstelplan waarvoor reeds toestemming is verleend daarin wordt verwerkt. Ingeval het eerste lid reeds toepassing
      vond, geeft het financieringsplan tevens aan hoe het saneringsplan waarvoor reeds toestemming is verleend daarin
      wordt verwerkt.

      4 De Pensioen- & Verzekeringskamer kan op aanvraag van de verzekeraar wijzigingen in een plan waarvoor toestemming
      is verleend toestaan dan wel, bij gewijzigde omstandigheden, wijzigingen in het plan eisen of de toestemming
      intrekken.

      5 De Pensioen- & Verzekeringskamer stelt, wanneer het eerste of tweede lid toepassing zal vinden en zij daartoe
      aanleiding vindt, de toezichthoudende autoriteiten van de andere lid-staten waar de verzekeraar een bijkantoor
      heeft of waarheen hij vanuit zijn vestigingen in de Unie diensten verricht, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel137a
