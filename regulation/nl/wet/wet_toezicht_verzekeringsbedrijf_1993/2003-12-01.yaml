  - number: 147n
    text: |-
      De vergunning van een verzekeraar waarvan de portefeuille ingevolge de bepalingen van dit hoofdstuk is
      overgedragen, wordt ingetrokken met inachtneming van de [artikelen 149][ref1], [150][ref2] en [153][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel149
