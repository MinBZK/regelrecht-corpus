  - number: '158'
    text: |-
      Op verzoek van de bewindvoerders benoemt de rechtbank een van haar leden tot rechter-commissaris die
      toezicht houdt op de vereffening welke plaats heeft ingevolge [artikel 163a][ref1]. Met betrekking tot de
      beschikkingen van de rechter-commissaris, gegeven ter uitvoering van het in de eerste volzin bepaalde, zijn de
      [artikelen 66][ref2] en [67, eerste lid, van de Faillissementswet][ref3] van overeenkomstige toepassing. Het
      [tweede lid van artikel 67 van die wet][ref4] is van overeenkomstige toepassing voor zover de daarin opgesomde
      artikelen in [artikel 163a][ref5] van overeenkomstige toepassing zijn verklaard. Hetgeen in de genoemde artikelen
      is bepaald met betrekking tot de curator onderscheidenlijk de gefailleerde is van toepassing op de bewindvoerders
      onderscheidenlijk de verzekeraar dan wel het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel163a
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
