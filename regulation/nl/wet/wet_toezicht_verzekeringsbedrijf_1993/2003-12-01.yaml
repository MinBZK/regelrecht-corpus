  - number: '10'
    text: |-
      1 De Pensioen- & Verzekeringskamer werkt bij de uitoefening van het toezicht op verzekeraars met vestiging
      in de Unie samen met de betrokken toezichthoudende autoriteiten van de andere lid-staten. De Pensioen- &
      Verzekeringskamer pleegt daartoe in voorkomende gevallen overleg met deze autoriteiten.

      2 De Pensioen- & Verzekeringskamer kan bij de uitoefening van het toezicht op een bijkantoor in Nederland van een
      verzekeraar met zetel buiten de Unie de betrokken toezichthoudende autoriteit raadplegen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel10
  - number: 10a
    text: |-
      1 De Pensioen- & Verzekeringskamer werkt samen met de autoriteiten die ingevolge de
      [Wet toezicht beleggingsinstellingen][ref1], de [Wet toezicht effectenverkeer 1995][ref2], de
      [Wet toezicht kredietwezen 1992][ref3] onderscheidenlijk de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref4],
      belast zijn met het toezicht op beleggingsinstellingen, effecteninstellingen, kredietinstellingen onderscheidenlijk
      natura-uitvaartverzekeraars, met het oog op het tot stand brengen van gelijkgerichte regelgeving en beleid ter zake
      van bij ministeriële regeling aan te wijzen onderwerpen die zowel het toezicht ingevolge deze wet als het toezicht
      ingevolge een van de eerdergenoemde wetten betreffen.

      2 De Pensioen- & Verzekeringskamer voert het toezicht ingevolge deze wet, voor zover het betrekking heeft op de
      onderwerpen, bedoeld in het eerste lid, uit met inachtneming van daartoe met de overige in het eerste lid bedoelde
      autoriteiten te sluiten overeenkomsten. Deze overeenkomsten bevatten afspraken over coördinatie en afstemming van
      regelgeving en beleid, en in voorkomende gevallen over uitvoering van toezicht. De Pensioen- & Verzekeringskamer
      draagt er zorg voor dat zij of een van de overige in het eerste lid bedoelde autoriteiten een afschrift van de
      gesloten overeenkomsten zendt aan Onze Minister.

      3 Binnen zes maanden na afloop van elk kalenderjaar draagt de Pensioen- & Verzekeringskamer in samenwerking met
      de overige in het eerste lid bedoelde autoriteiten zorg voor een gezamenlijk verslag dat openbaar wordt gemaakt en
      waarin melding wordt gemaakt van de wijze waarop uitvoering is gegeven aan het eerste en tweede lid.


