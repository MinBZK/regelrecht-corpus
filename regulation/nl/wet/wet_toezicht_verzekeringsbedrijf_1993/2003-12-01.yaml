  - number: '56'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan getuigen en deskundigen alsmede bestuurders en commissarissen van
      een verzekeraar en van een in [artikel 55, eerste lid][ref1], bedoelde onderneming, instelling of pool en de
      betrokken vertegenwoordiger oproepen. Indien deze vertegenwoordiger rechtspersoon is, geldt deze bevoegdheid ten
      aanzien van de bestuurders en commissarissen van de vertegenwoordiger en ten aanzien van de door hem aangewezen
      natuurlijke persoon die hem vertegenwoordigt bij de uitoefening van zijn bevoegdheden en bij de nakoming van zijn
      verplichtingen.

      2 Deze personen zijn verplicht op die oproeping te verschijnen.

      3 De oproeping geschiedt op de wijze door de Pensioen- & Verzekeringskamer te bepalen.

      4 Bij oproeping door middel van dagvaarding wordt de tussenkomst van het Openbaar Ministerie ingeroepen en vinden
      de bepalingen aangaande het dagvaarden van getuigen en deskundigen in strafzaken overeenkomstige toepassing.

      5 Indien de opgeroepene niet op de dagvaarding verschijnt, kan de Pensioen- & Verzekeringskamer daarvan proces-
      verbaal opmaken. Zij kan hem andermaal doen dagvaarden en daarbij een bevel tot medebrenging voegen of zodanig
      bevel laten uitvaardigen. Tot het ten uitvoer leggen van zodanig bevel verleent het Openbaar Ministerie zijn
      tussenkomst; de Pensioen- & Verzekeringskamer richt het verzoek daartoe tot de officier van justitie, hoofd van het
      parket bij de arrondissementsrechtbank binnen welker rechtsgebied de Pensioen- & Verzekeringskamer is gevestigd.

      6 De getuigen zijn verplicht getuigenis af te leggen, behoudens verschoning wegens ambts- of beroepsgeheim. De
      deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten. De overige in het eerste lid
      bedoelde personen zijn verplicht alle gevraagde inlichtingen te verschaffen.

      7 De Pensioen- & Verzekeringskamer kan de getuige de eed afnemen.
      [Artikel 177 van het Wetboek van Burgerlijke Rechtsvordering][ref2] is van toepassing.

      8 De [artikelen 17][ref3] en [23, eerste lid, van de Wet op de Parlementaire Enquête][ref4], zijn van
      overeenkomstige toepassing, met dien verstande dat deskundigen niet worden gegijzeld.

      9 Het afnemen van verhoren van getuigen en deskundigen alsook van de overige in het eerste lid bedoelde personen
      geschiedt op een plaats, door de Pensioen- & Verzekeringskamer te bepalen. Zij kan een of meer van de leden van
      haar bestuur dan wel een of meer van haar medewerkers machtigen een verhoor als in de eerste volzin bedoeld af te
      nemen. Het afnemen van de eed geschiedt echter steeds door een lid van haar bestuur.

      10 De voorzitter kent aan getuigen en deskundigen op hun verlangen een vergoeding toe overeenkomstig het bepaalde
      bij of krachtens de [Wet tarieven in burgerlijke zaken][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel177
      [ref3]: https://wetten.overheid.nl/BWBR0001841#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0001841#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0001852
