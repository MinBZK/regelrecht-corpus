  - number: '114'
    text: |-
      1 Een verzekeraar die vanuit een bijkantoor buiten de Unie diensten verricht naar Nederland, dient binnen zes
      maanden na afloop van het boekjaar bij de Pensioen- & Verzekeringskamer een opgave in van de in dat boekjaar uit
      hoofde van het verrichten van diensten naar Nederland:

      a. met betrekking tot de schadeverzekering per branchegroep geboekte premies, schaden en provisies, telkens zonder
      aftrek van herverzekering, welke gegevens, alsmede de frequentie en de gemiddelde kosten van de schadegevallen,
      voor de branche Aansprakelijkheid motorrijtuigen afzonderlijk worden vermeld;

      b. met betrekking tot de levensverzekering per branche geboekte premies, zonder aftrek van herverzekering.

      2 De in het eerste lid, onderdeel *a*, bedoelde branchegroepen en de modellen van de opgaven worden door de
      Pensioen- & Verzekeringskamer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel114
  - number: '115'
    text: |-
      1 Een verzekeraar die bij het verrichten van diensten naar Nederland in strijd handelt met de belangen van degenen
      die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen zullen worden betrokken bij overeenkomsten
      van verzekering of inbreuk maakt op hier te lande geldende voorschriften maakt daaraan op verzoek van de Pensioen-
      & Verzekeringskamer een einde. Indien de Pensioen- & Verzekeringskamer op dat verzoek niet binnen de door haar
      gestelde termijn een bevredigend antwoord heeft ontvangen of indien naar haar oordeel niet of onvoldoende gevolg is
      gegeven aan haar verzoek, stelt zij, indien het gaat om het verrichten van diensten vanuit een andere lid-staat, de
      toezichthoudende autoriteit van de lid-staat van de zetel van de verzekeraar daarvan in kennis.

      2 De Pensioen- & Verzekeringskamer kan aan een verzekeraar voorschriften of een verbod opleggen ter zake van
      acquisitie met betrekking tot overeenkomsten van verzekering, door de verzekeraar te sluiten bij het verrichten
      van diensten naar Nederland. De voorschriften en het verbod kunnen slechts worden opgelegd in het belang van
      degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen zullen worden betrokken bij deze
      overeenkomsten of indien de verzekeraar inbreuk maakt op hier te lande geldende voorschriften.

      3 In geval van het verrichten van diensten vanuit een andere lid-staat dan Nederland vaardigt de Pensioen- &
      Verzekeringskamer voorschriften of een verbod ter zake van acquisitie niet uit dan nadat zij de toezichthoudende
      autoriteit van de lid-staat van de zetel van de verzekeraar van haar voornemen daartoe in kennis heeft gesteld.

      4 Van het besluit van de Pensioen- & Verzekeringskamer, houdende voorschriften of een verbod ter zake van
      acquisitie, en de intrekking daarvan, wordt in de *Staatscourant* mededeling gedaan zodra de beroepstermijn is
      verstreken of, indien beroep is ingesteld, zodra op het beroep is beslist.

      5 Het is verboden in Nederland te bemiddelen bij of op andere soortgelijke wijze mee te werken aan de voorbereiding
      of de totstandkoming van overeenkomsten van verzekering met betrekking waartoe aan een verzekeraar een verbod van
      acquisitie is opgelegd, dan wel te handelen in strijd met de voorschriften of het verbod, opgelegd ingevolge het
      tweede lid.

      6 De Pensioen- & Verzekeringskamer stelt de toezichthoudende autoriteit van de lid-staat van de zetel van de
      verzekeraar in kennis van de door haar genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel115
  - number: '116'
    text: |-
      1 Een verzekeraar met zetel buiten de Unie die voornemens is vanuit een bijkantoor in een andere lid-staat voor
      de eerste maal diensten te verrichten naar Nederland, kan, met inachtneming van het tweede lid, daarmee aanvangen
      nadat hij de Pensioen- & Verzekeringskamer schriftelijk van dit voornemen in kennis heeft gesteld, onder bijvoeging
      van:

      a. een verklaring, afgegeven door de bevoegde toezichthoudende autoriteit in de Unie, dat de verzekeraar beschikt
      over de vereiste solvabiliteitsmarge;

      b. een verklaring, afgegeven door de toezichthoudende autoriteit van de betrokken lid-staat, waarin de branches
      zijn vermeld waarvoor de verzekeraar een vergunning bezit;

      c. een opgave van de aard van de:

      1°. in Nederland gelegen risico’s die de schadeverzekeraar voornemens is te dekken;

      2°. overeenkomsten die de levensverzekeraar voornemens is te sluiten; en

      d. indien de verzekeraar risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen wenst te dekken,
      bescheiden als bedoeld in [artikel 111, eerste lid, onderdeel ][ref1].

      2 De verzekeraar kan het verrichten van diensten aanvangen vanaf de officieel bevestigde datum van ontvangst door
      de Pensioen- & Verzekeringskamer van de in het eerste lid bedoelde bescheiden.

      3 Indien de verzekeraar voornemens is een wijziging aan te brengen in de aard van de risico’s of van de
      overeenkomsten ten opzichte van de opgave, bedoeld in het eerste lid, onderdeel *c*, zijn het eerste en tweede lid
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel111
