  - number: '52'
    text: |-
      1 Een verzekeraar mag de branche Aansprakelijkheid motorrijtuigen vanuit een vestiging in Nederland niet
      uitoefenen:

      a. zonder te zijn aangesloten bij het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];

      b. zonder zijn verplichtingen jegens het Waarborgfonds Motorverkeer na te komen uit hoofde van de
      [artikelen 24][ref2], eerste lid, en [24][ref3];

      c. zonder zijn verplichtingen na te komen tot kennisgeving uit hoofde van
      [artikel 13, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref4] jegens het overheidsorgaan
      aldaar bedoeld;

      d. zonder dat zijn voorwaarden van verzekering voldoen aan de door de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref5] gestelde eisen; en

      e. zonder dat hij in iedere andere lid-staat dan Nederland een schaderegelaar heeft aangesteld die
      belast is met het namens hem behandelen en afwikkelen van vorderingen van benadeelden die aanspraak
      kunnen maken op schadevergoeding ten gevolge van feiten, veroorzaakt door deelneming aan het verkeer van
      motorrijtuigen die gewoonlijk zijn gestald en verzekerd in een andere lid-staat dan Nederland en die zich
      ofwel hebben voorgedaan in een andere lid-staat dan die van de woonplaats van de benadeelde, ofwel in een
      staat buiten de Unie waar een nationaal bureau werkzaam is, dat overeenkomt met het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref6].

      2 De schaderegelaar heeft zijn woonplaats of vestiging in de lid-staat waar hij is aangesteld. Vorderingen van
      benadeelden als bedoeld in het eerste lid, onderdeel e, behandelt en wikkelt hij af in de officiële taal of de
      officiële talen van die lid-staat.

      3 De schaderegelaar houdt zich namens de verzekeraar niet bezig met de uitoefening van het verzekeringsbedrijf.
      Evenmin wordt hij beschouwd als een vestiging van de verzekeraar in de zin van [Verordening (EG) nr. 44/2001]
      (32001R0044) van de Raad van 22 december 2000 betreffende de rechterlijke bevoegdheid, de erkenning en
      de tenuitvoerlegging van beslissingen in burgerlijke en handelszaken (PbEG L 12 van 16 januari 2001),
      onderscheidenlijk het Verdrag van Brussel van 27 september 1968 betreffende de rechterlijke bevoegdheid en de
      tenuitvoerlegging van de beslissingen in burgerlijke en handelszaken (PbEG C 27 van 26 februari 1998).

      4 Een verzekeraar aan wie vergunning is verleend voor de branche Aansprakelijkheid motorrijtuigen meldt
      binnen twee weken na de aanvang van de uitoefening van die branche aan het Informatiecentrum, bedoeld in
      [artikel 27b van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref7] en aan het informatiecentrum in
      iedere andere lid-staat, de naam en het adres van de door hem in iedere lid-staat aangestelde schaderegelaar. De
      verzekeraar stelt de in de eerste volzin bedoelde informatiecentra en de Pensioen- & Verzekeringskamer binnen twee
      weken in kennis van een wijziging in de naam of het adres van de desbetreffende schaderegelaar.

      5 De verzekeraar van degene die de schade heeft veroorzaakt of zijn schaderegelaar geeft binnen drie maanden na de
      datum waarop een benadeelde zijn verzoek tot schadevergoeding heeft ingediend:

      a. een met redenen omkleed voorstel tot schadevergoeding indien de aansprakelijkheid niet wordt betwist en de
      omvang van de schade is vastgesteld; of

      b. een met redenen omkleed antwoord op alle punten van het verzoek tot schadevergoeding indien de aansprakelijkheid
      wordt betwist of de omvang van de schade nog niet volledig is vastgesteld.

      Op dit lid is [artikel 119 van Boek 6 van het Burgerlijk Wetboek][ref8] van toepassing.

      6 Een verzekeraar aan wie vergunning is verleend voor de branche Aansprakelijkheid motorrijtuigen legt
      binnen twee weken na de aanvang van de uitoefening van die branche aan de Pensioen- & Verzekeringskamer
      een door hem ondertekende verklaring over dat zijn voorwaarden van verzekering voldoen aan de door de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref9] gestelde eisen.

      7 De Pensioen- & Verzekeringskamer kan van het bepaalde in het eerste lid ontheffing verlenen aan een verzekeraar
      die geen aansprakelijkheden dekt ten aanzien waarvan de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref10]
      van toepassing is en die de risico’s van de branche Aansprakelijkheid motorrijtuigen uitsluitend als bijkomende
      risico’s dekt. Aan een ontheffing kunnen beperkingen worden gesteld of voorschriften worden verbonden en zij kan
      worden ingetrokken.


