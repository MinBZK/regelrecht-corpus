  - number: '141'
    text: |-
      1 Indien de toezichthoudende autoriteit van een andere lid-staat de Pensioen- & Verzekeringskamer ervan in kennis
      heeft gesteld dat een verzekeraar bij de uitoefening van het verzekeringsbedrijf vanuit een bijkantoor in die lid-
      staat of bij het verrichten van diensten naar die lid-staat vanuit Nederland of een andere lid-staat inbreuk maakt
      op aldaar geldende voorschriften, maakt de verzekeraar op verzoek van de Pensioen- & Verzekeringskamer aan deze
      inbreuk een einde.

      2 Indien de Pensioen- & Verzekeringskamer op dat verzoek niet binnen de door haar gestelde termijn een bevredigend
      antwoord heeft ontvangen of indien naar haar oordeel niet of onvoldoende gevolg is gegeven aan haar verzoek, kan
      zij aan de verzekeraar voorschriften of een verbod opleggen ter zake van de uitoefening van het verzekeringsbedrijf
      vanuit het betrokken bijkantoor onderscheidenlijk het verrichten van diensten naar de in het eerste lid bedoelde
      lid-staat, onverminderd de overige bevoegdheden van de Pensioen- & Verzekeringskamer.

      3 Het is verboden te handelen in strijd met de voorschriften of het verbod, opgelegd ingevolge het tweede lid.

      4 De Pensioen- & Verzekeringskamer stelt de in het eerste lid bedoelde toezichthoudende autoriteit in kennis van de
      door haar genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel141
  - number: '142'
    text: |-
      1 De Pensioen- & Verzekeringskamer vaardigt een beperking of een verbod als bedoeld in de
      [artikelen 137, eerste lid][ref1], en [140, eerste lid][ref2], uit indien de toezichthoudende autoriteit van een
      andere lid-staat waar de verzekeraar zijn zetel heeft dit verzoekt.

      2 De Pensioen- & Verzekeringskamer kan in dringende gevallen de in het eerste lid bedoelde maatregelen treffen
      zonder een daartoe strekkend verzoek van de toezichthoudende autoriteit van de lid-staat waar de verzekeraar zijn
      zetel heeft, indien de verzekeraar inbreuk maakt op hier te lande geldende voorschriften.

      3 De beperking of het verbod heeft betrekking op de in Nederland aanwezige waarden. Indien de maatregel wordt
      getroffen op verzoek van de toezichthoudende autoriteit van de lid-staat waar de verzekeraar zijn zetel heeft en
      die autoriteit opgave van deze waarden heeft gedaan, houdt de Pensioen- & Verzekeringskamer daarmee rekening.

      4 De beperking of het verbod wordt door de Pensioen- & Verzekeringskamer door middel van een deurwaardersexploot
      aan de verzekeraar bekendgemaakt.

      5 De verzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.

      6 De Pensioen- & Verzekeringskamer heft de beperking of het verbod op zodra de betrokken toezichthoudende
      autoriteit dat verzoekt of indien naar haar oordeel daartoe aanleiding bestaat. Zij maakt de opheffing bekend aan
      de verzekeraar.

      7 De Pensioen- & Verzekeringskamer stelt de toezichthoudende autoriteit, bedoeld in het eerste lid, in kennis van
      de uitvaardiging van de beperking of het verbod en de opheffing daarvan.

      8 Indien een verzekeraar met zetel in een andere lid-staat een bijkantoor heeft in Nederland of diensten verricht
      naar Nederland en de toezichthoudende autoriteit van die lid-staat de Pensioen- & Verzekeringskamer in kennis heeft
      gesteld van de intrekking van een vergunning die overeenkomt met de in [artikel 24, eerste lid][ref3], bedoelde
      vergunning van die verzekeraar, doet de Pensioen- & Verzekeringskamer daarvan mededeling in de *Staatscourant*. Bij
      deze publikatie wordt tevens mededeling gedaan van de beperking of het verbod, opgelegd ingevolge het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel24
