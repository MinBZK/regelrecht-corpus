  - number: '129'
    text: |-
      1 Een levensverzekeraar met zetel in Nederland kan slechts met schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer en bij akte zijn rechten en verplichtingen uit een of meer overeenkomsten van levensverzekering:

      a. gesloten vanuit een vestiging in de Unie overdragen aan een andere verzekeraar met zetel in de Unie in het kader
      van diens bedrijfsuitoefening vanuit een vestiging in de Unie;

      b. gesloten vanuit een vestiging in Nederland overdragen aan een andere verzekeraar met zetel buiten de Unie in het
      kader van diens bedrijfsuitoefening vanuit een bijkantoor in Nederland;

      c. gesloten vanuit een bijkantoor in een andere lid-staat overdragen aan een andere verzekeraar met zetel buiten
      de Unie in het kader van diens bedrijfsuitoefening vanuit een bijkantoor in de Unie indien de wetgeving van de
      betrokken lid-staten voorziet in een dergelijke overdracht en de betrokken toezichthoudende autoriteiten daarmee
      instemmen.

      2 Een levensverzekeraar met zetel buiten de Unie kan slechts met schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer en bij akte zijn rechten en verplichtingen uit een of meer overeenkomsten van levensverzekering,
      gesloten vanuit een bijkantoor in Nederland, overdragen aan:

      a. een andere verzekeraar met zetel in de Unie in het kader van diens bedrijfsuitoefening vanuit een vestiging in
      de Unie;

      b. een andere verzekeraar met zetel buiten de Unie in het kader van diens bedrijfsuitoefening vanuit een bijkantoor
      in Nederland.

      3 Voor zover overeenkomsten van levensverzekering als bedoeld in het tweede lid in dienstverrichting naar een
      andere lid-staat zijn gesloten, kan de verzekeraar zijn rechten en verplichtingen onder de in de aanhef van dat lid
      gestelde voorwaarden tevens overdragen aan een andere verzekeraar met zetel buiten de Unie in het kader van diens
      bedrijfsuitoefening vanuit een bijkantoor in die lid-staat.

      4 Indien de wetgeving van een andere lid-staat niet voorziet in een toestemmingsprocedure voor een verzekeraar
      met zetel aldaar tot overdracht van zijn rechten en verplichtingen uit een of meer overeenkomsten van
      levensverzekering, gesloten vanuit een bijkantoor in Nederland, aan een andere verzekeraar met zetel buiten de
      Unie in het kader van diens bedrijfsuitoefening vanuit een bijkantoor in Nederland, kan de overdracht bij akte
      plaatsvinden met schriftelijke toestemming van de Pensioen- & Verzekeringskamer. De Pensioen- & Verzekeringskamer
      verleent geen toestemming alvorens de toezichthoudende autoriteit van de lid-staat van de zetel van de overdragende
      verzekeraar heeft verklaard met die overdracht in te stemmen.

      5 Een levensverzekeraar met vestiging in Nederland kan slechts met schriftelijke toestemming van de Pensioen-
      & Verzekeringskamer en bij akte zijn rechten en verplichtingen uit een of meer overeenkomsten van natura-
      uitvaartverzekering als bedoeld in [artikel 1, onderdeel ][ref1], in de gevallen, genoemd in artikel 52, eerste en
      tweede lid, van die wet, overdragen aan de aldaar bedoelde verzekeraars.

      6 In afwijking van het eerste tot en met derde lid kan een verzekeraar zijn rechten en verplichtingen uit een
      individuele overeenkomst van levensverzekering op schriftelijk verzoek van de verzekeringnemer overdragen.

      7 Met overdracht van de rechten en verplichtingen uit alle overeenkomsten van levensverzekering wordt gelijkgesteld
      de overgang van deze rechten en verplichtingen bij een fusie als bedoeld in artikel 309 van Boek 2 van het
      Burgerlijk Wetboek of bij een splitsing als bedoeld in artikel 334a van Boek 2 van het Burgerlijk Wetboek. Het
      eerste lid, aanhef en onderdeel *a*, het vijfde lid, en de artikelen 130, eerste, tweede en vierde tot en met
      achtste lid, en 131, eerste tot en met derde lid, vierde lid, eerste volzin, vijfde, zevende en achtste lid, zijn
      op deze overgang van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel1
