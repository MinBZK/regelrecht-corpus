  - number: '195'
    text: |-
      1 Op een schadeverzekeraar met zetel in Nederland die op 1 januari 1986 het verzekeringsbedrijf uitoefende en aan
      wie een vergunning is verleend en die voorts gedurende het laatst verstreken boekjaar voor 1 augustus 1978 niet
      een premie-inkomen van zesmaal het minimum bedrag van het garantiefonds, bedoeld in [artikel 68, tweede lid][ref1],
      laatste volzin, heeft geboekt, zijn laatstgenoemde bepaling en [artikel 68, derde lid][ref2], niet van toepassing.
      Voor de toepassing van dit lid heeft het minimum bedrag van het garantiefonds de waarde zoals deze gold op 1 juli
      1994.

      2 De ontheffing is van kracht tot het einde van het boekjaar waarin een zodanig premie-inkomen zal zijn geboekt.

      3 Zolang de ontheffing van kracht is, zal de solvabiliteitsmarge van de verzekeraar niet mogen dalen beneden
      een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag, en zijn ten aanzien van deze
      solvabiliteitsmarge de [artikelen 68, vijfde lid][ref3], en [139][ref4] van overeenkomstige toepassing.

      4 Het eerste lid is niet van toepassing op de verzekeraar die zijn werkzaamheden uitbreidt met een of meer branches
      voor de uitoefening waarvan hij een vergunning behoeft of die in een andere lid-staat een bijkantoor wil openen dan
      wel zijn werkzaamheden aldaar wil uitbreiden.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel139
