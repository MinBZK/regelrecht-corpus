  - number: '9'
    text: |-
      1 De Pensioen- & Verzekeringskamer legt te haren kantore ten behoeve van een ieder een lijst ter inzage van de
      verzekeraars:

      a. die in het bezit zijn van een of meer vergunningen als bedoeld in [artikel 24, eerste lid][ref1], onder
      vermelding van de branches;

      b. met zetel in een andere lid-staat dan Nederland die bevoegd zijn een bijkantoor in Nederland te hebben, onder
      vermelding van de branches;

      c. met zetel buiten Nederland die bevoegd zijn naar Nederland diensten te verrichten, onder vermelding van de aard
      van de risico’s van schadeverzekering dan wel van de aard van de overeenkomsten van levensverzekering.

      2 Voorts worden in de lijst bij de bijkantoren van de verzekeraars met zetel buiten Nederland de naam en de
      woonplaats van de vertegenwoordiger vermeld. Met betrekking tot een verzekeraar met zetel in een andere lid-
      staat dan Nederland wordt tevens het adres van het bijkantoor vermeld waaraan rechtsgeldig mededelingen aan de
      vertegenwoordiger kunnen worden gestuurd.

      3 Indien de verzekeraar een schade-afhandelaar als bedoeld in [artikel 109, eerste lid, onderdeel ][ref2], heeft
      aangesteld, worden tevens diens naam en woonplaats vermeld.

      4 In afwijking van het eerste lid, onderdeel a, worden in de lijst niet vermeld opvanginstellingen die in het
      bezit zijn van een of meer vergunningen als bedoeld in [artikel 24, eerste lid][ref3], tenzij een overdracht van
      de portefeuille van een verzekeraar krachtens [artikel 147d, derde lid][ref4], heeft plaatsgevonden en van deze
      overdracht mededeling in de Staatscourant is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel147d
