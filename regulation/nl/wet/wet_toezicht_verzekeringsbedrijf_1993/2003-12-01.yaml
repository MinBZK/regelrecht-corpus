  - number: 69d
    text: |-
      1 In het toezicht, bedoeld in [artikel 69c][ref1], worden betrokken:

      a. verbonden ondernemingen van de verzekeraar;

      b. deelnemende ondernemingen in de verzekeraar;

      c. verbonden ondernemingen van een deelnemende onderneming in de verzekeraar.

      2 De Pensioen- & Verzekeringskamer behoeft bij het toezicht, bedoeld in [artikel 69c][ref2], niet te betrekken
      ondernemingen met zetel buiten de Unie waar wettelijke belemmeringen bestaan voor het verstrekken van de nodige
      informatie, behoudens bij of krachtens algemene maatregel van bestuur te stellen regels ten aanzien van het niet
      beschikbaar zijn van noodzakelijk informatie.

      3 De Pensioen- & Verzekeringskamer kan per geval besluiten om in de volgende gevallen een onderneming niet te
      betrekken in het in [artikel 69c][ref3] bedoelde toezicht:

      a. indien de bij dat toezicht te betrekken onderneming in het licht van de doelstellingen van dat toezicht slechts
      van te verwaarlozen betekenis is;

      b. indien het in aanmerking nemen van de financiële positie van die onderneming in het licht van de doelstellingen
      van dat toezicht misplaatst of misleidend zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
