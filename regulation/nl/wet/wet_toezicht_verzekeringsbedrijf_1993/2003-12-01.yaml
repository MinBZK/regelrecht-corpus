  - number: 69a
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt – voor zover niet anders blijkt – verstaan onder:

      a. verzekeraar: een schadeverzekeraar of een levensverzekeraar met zetel in Nederland waaraan ingevolge
      [artikel 24, eerste lid][ref1], een vergunning is verleend of een schadeverzekeraar of een levensverzekeraar
      met zetel in een andere lid-staat dan Nederland die in het bezit is van een vergunning die overeenkomt met de in
      [artikel 24, eerste lid][ref2], bedoelde vergunning;

      b. verzekeraar met zetel buiten de Unie: een schadeverzekeraar of een levensverzekeraar met zetel buiten de Unie
      die, indien hij zijn zetel in Nederland of in een andere lid-staat dan Nederland had, een vergunning ingevolge
      [artikel 24, eerste lid][ref3], zou kunnen krijgen onderscheidenlijk een vergunning die overeenkomt met de in
      [artikel 24, eerste lid][ref4], bedoelde vergunning;

      c. herverzekeraar: een verzekeraar die geen verzekeraar is als bedoeld in onderdeel a of b en waarvan de
      hoofdactiviteit bestaat uit het accepteren van door een verzekeraar, door een verzekeraar met zetel buiten de Unie
      of door een andere herverzekeraar overgedragen risico's;

      d. moederonderneming: een moederonderneming als bedoeld in artikel 1 van de zevende [richtlijn nr. 83/349/EEG]
      (31983L0349) van de Raad van de Europese Gemeenschappen van 13 juni 1983 op de grondslag van artikel 54, lid 3,
      sub g, van het Verdrag betreffende de geconsolideerde jaarrekening (PbEG L 193), alsmede iedere onderneming die
      naar de mening van de Pensioen- & Verzekeringskamer feitelijk een overheersende invloed op een andere onderneming
      uitoefent;

      e. dochteronderneming: een dochtermaatschappij als bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref5], alsmede iedere onderneming waarop naar de mening van de
      Pensioen- & Verzekeringskamer een moederonderneming feitelijk een overheersende invloed uitoefent;

      f. deelneming: een deelneming als bedoeld in
      [artikel 24c, eerste lid, eerste volzin, en tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref6], of een
      rechtstreeks of middellijk belang van 20 procent of meer van het geplaatste aandelenkapitaal van een onderneming,
      of het rechtstreeks of middellijk kunnen uitoefenen van 20 procent of meer van de stemrechten in een onderneming;

      g. deelnemende onderneming: een onderneming die een moederonderneming is of iedere andere onderneming die een
      deelneming bezit;

      h. verbonden onderneming: een dochteronderneming of iedere andere onderneming waarin een deelneming bestaat;

      i. verzekeringsholding: een moederonderneming waarvan de hoofdactiviteit bestaat uit het verkrijgen en houden van
      deelnemingen in dochterondernemingen die uitsluitend of hoofdzakelijk verzekeraars, verzekeraars met zetel buiten
      de Unie of herverzekeraars zijn, en waarvan ten minste één dochteronderneming verzekeraar is;

      j. gemengde verzekeringsholding: een moederonderneming, die geen verzekeraar, verzekeraar met zetel buiten de Unie,
      herverzekeraar of verzekeringsholding is, en waarvan ten minste één dochteronderneming verzekeraar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel24
