  - number: '80'
    text: |-
      1 Een verzekeraar met zetel in Nederland die voornemens is een bijkantoor te openen in een andere lid-staat stelt
      de Pensioen- & Verzekeringskamer daarvan schriftelijk in kennis.

      2 Deze kennisgeving geschiedt onder opgave van:

      a. de lid-staat waarin de verzekeraar voornemens is het bijkantoor te openen;

      b. een programma van werkzaamheden, met betrekking waartoe bij ministeriële regeling nadere regels worden
      gesteld en waarin met name de aard van de risico’s van schadeverzekering dan wel de aard van de overeenkomsten
      van levensverzekering die door het bijkantoor zullen worden gedekt onderscheidenlijk gesloten en de voorziene
      organisatiestructuur – met inbegrip van de financiële administratie en de interne controle – ten behoeve van het
      bijkantoor zijn vermeld;

      c. het adres van het bijkantoor;

      d. de naam en het adres van de vertegenwoordiger en, zo de vertegenwoordiger rechtspersoon is, de naam en het adres
      van de natuurlijke persoon, bedoeld in [artikel 82, tweede lid][ref1]; en

      e. indien de verzekeraar risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen wenst te
      dekken een schriftelijk bewijs waaruit blijkt dat de verzekeraar is toegetreden tot het nationale bureau
      en het nationale waarborgfonds van de betrokken lid-staat die overeenkomen met het bureau, bedoeld in
      [artikel 2, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref2] onderscheidenlijk het
      Waarborgfonds Motorverkeer, bedoeld in [artikel 23, eerste lid, van die wet][ref3].

      3 De verzekeraar doet de in het tweede lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de
      Pensioen- & Verzekeringskamer zulks verlangt.

      4 De Pensioen- & Verzekeringskamer doet mededeling aan de betrokken toezichthoudende autoriteit van de in het
      tweede lid bedoelde gegevens binnen drie maanden na ontvangst van de kennisgeving, bedoeld in het eerste lid,
      indien:

      a. de verzekeraar in het bezit is van een vergunning;

      b. de verzekeraar beschikt over de ingevolge [artikel 68][ref4] vereiste solvabiliteitsmarge;

      c. de Pensioen- & Verzekeringskamer geen herstelplan ingevolge [artikel 137a][ref5] heeft verlangd van de
      verzekeraar; en

      d. de Pensioen- & Verzekeringskamer geen bedenkingen heeft tegen de opening van het bijkantoor. Zij voegt daarbij
      een verklaring dat de verzekeraar beschikt over de ingevolge [artikel 68][ref6] vereiste solvabiliteitsmarge. De
      Pensioen- & Verzekeringskamer maakt die mededeling aan de verzekeraar bekend.

      5 Indien de verzekeraar, gezien de werkzaamheden die hij vanuit het bijkantoor voornemens is te verrichten, niet
      voldoet aan de bij of krachtens deze wet gestelde eisen ten aanzien van:

      a. de deskundigheid, de voornemens, de handelingen of de antecedenten van de personen die het dagelijks
      beleid van de verzekeraar bepalen of van de vertegenwoordiger en, zo de vertegenwoordiger rechtspersoon is,
      de deskundigheid, de voornemens, de handelingen of de antecedenten van de natuurlijke persoon, bedoeld in
      [artikel 82, tweede lid][ref7];

      b. de technische voorzieningen;

      c. de solvabiliteitsmarge;

      d. de administratieve organisatie; en

      e. de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering,

      dan wel naar het oordeel van de Pensioen- & Verzekeringskamer aanwijzingen bestaan dat de verzekeraar niet aan
      deze eisen zal kunnen voldoen, doet de Pensioen- & Verzekeringskamer geen mededeling als bedoeld in het vierde lid,
      eerste volzin. De Pensioen- & Verzekeringskamer maakt dit binnen drie maanden na ontvangst van de kennisgeving,
      bedoeld in het eerste lid, aan de verzekeraar bekend. Onder integere bedrijfsvoering wordt in dit lid verstaan de
      bedrijfsvoering met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref8].

      6 De Pensioen- & Verzekeringskamer maakt aan de verzekeraar het tijdstip bekend waarop het bijkantoor kan worden
      geopend alsmede, in voorkomend geval, welke voorwaarden de betrokken toezichthoudende autoriteit heeft aangegeven
      waaronder de werkzaamheden om redenen van algemeen belang in de betrokken lid-staat moeten worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel23
