        artikel: '1'
  - number: 69i
    text: |-
      1 De Pensioen- & Verzekeringskamer betrekt in haar toezicht zoals dat voortvloeit uit deze paragraaf onder andere
      transacties tussen een verzekeraar die is onderworpen aan het toezicht, bedoeld in [artikel 69c][ref1], en:

      a. een met de verzekeraar verbonden onderneming;

      b. een in de verzekeraar deelnemende onderneming;

      c. een met een in de verzekeraar deelnemende onderneming verbonden onderneming;

      d. een natuurlijke persoon die een deelneming bezit in:

      1°. de verzekeraar of een met de verzekeraar verbonden onderneming;

      2°. een in de verzekeraar deelnemende onderneming;

      3°. een met een in de verzekeraar deelnemende onderneming verbonden onderneming.

      2 De in het eerste lid bedoelde transacties hebben in het bijzonder betrekking op:

      a. leningen;

      b. garanties en posten buiten de balans;

      c. vermogensbestanddelen die in aanmerking mogen worden genomen voor de solvabiliteitsmarge;

      d. beleggingen;

      e. herverzekeringstransacties;

      f. overeenkomsten met betrekking tot kostentoedeling.

      3 De verzekeraar, bedoeld in het eerste lid, dient eenmaal per jaar bij de Pensioen- & Verzekeringskamer een
      rapportage in waarin zijn opgenomen transacties als bedoeld in dat lid voor zover die van significante betekenis
      zijn. De Pensioen- & Verzekeringskamer kan een verzekeraar of categorieën van verzekeraars voorschrijven dat
      de rapportage met een hogere frequentie wordt ingediend. Blijkt uit de rapportages dat de solvabiliteit van de
      verzekeraar wordt of dreigt te worden ondermijnd, dan neemt zij jegens die verzekeraar passende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel69i
    references:
