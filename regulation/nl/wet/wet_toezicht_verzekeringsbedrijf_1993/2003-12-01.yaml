    text: |-
      1 Een verzekeraar met zetel buiten de Unie dient voor het verzekeringsbedrijf dat hij vanuit de bijkantoren
      in Nederland uitoefent, te beschikken over een solvabiliteitsmarge ten aanzien waarvan [artikel 68][ref1] van
      overeenkomstige toepassing is, met dien verstande dat het minimum bedrag van het garantiefonds de helft beloopt van
      het krachtens [artikel 68, tweede lid][ref2], vast te stellen bedrag.

      2 De waarden die de solvabiliteitsmarge vertegenwoordigen, dienen ten belope van ten minste het garantiefonds in
      Nederland aanwezig te zijn en voor het overige deel in de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel68
