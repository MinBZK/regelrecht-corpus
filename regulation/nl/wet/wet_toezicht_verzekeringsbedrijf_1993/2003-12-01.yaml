  - number: '149'
    text: |-
      1 Indien de Pensioen- & Verzekeringskamer is belast met het toezicht, bedoeld in [artikel 49, tweede lid][ref1],
      deelt zij, alvorens tot intrekking van een aan de betrokken verzekeraar verleende vergunning over te gaan, haar
      voornemen mee aan de toezichthoudende autoriteiten van de andere lid-staten waar de verzekeraar een bijkantoor
      heeft.

      2 Indien de toezichthoudende autoriteit van een andere lid-staat dan Nederland is belast met het toezicht, bedoeld
      in [artikel 49, tweede lid][ref2], en deze toezichthoudende autoriteit een aan de betrokken verzekeraar verleende
      vergunning wegens ontoereikendheid van de onder haar toezicht staande solvabiliteitsmarge heeft ingetrokken of zal
      intrekken, trekt de Pensioen- & Verzekeringskamer de betrokken vergunning eveneens in. Deze intrekking gaat niet
      eerder in dan op het tijdstip waarop de intrekking in die andere lid-staat ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel49
