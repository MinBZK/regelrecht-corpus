      1 De vertegenwoordiger houdt van rechtswege op vertegenwoordiger te zijn vanaf de dag
      van het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, de
      verlening van surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref1], de onderbewindstelling van één of meer van de goederen,
      bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref2], of de ondercuratelestelling.

      2 De aanwijzing, bedoeld in [artikel 85, vierde lid][ref3], vervalt van rechtswege vanaf de
      dag van het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen,
      de verlening van surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref4], de onderbewindstelling van één of meer van de goederen,
      bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref5], of de ondercuratelestelling van de aangewezen
      natuurlijke persoon alsmede vanaf de dag van verlening van surséance van betaling of faillietverklaring van de
