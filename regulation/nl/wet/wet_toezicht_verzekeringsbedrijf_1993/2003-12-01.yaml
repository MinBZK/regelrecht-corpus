        artikel: '72'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '2'
  - number: '68'
    text: |-
      1 Een verzekeraar met zetel in Nederland beschikt over een minimum bedrag aan solvabiliteitsmarge dat wordt
      berekend op de wijze, voorgeschreven bij of krachtens algemene maatregel van bestuur. De berekening van de
      solvabiliteitsmarge kan voor onderscheiden categorieën van verzekeraars verschillend zijn.

      2 Een derde gedeelte van de overeenkomstig het eerste lid berekende solvabiliteitsmarge vormt het garantiefonds.
      Het garantiefonds beloopt evenwel ten minste een bij of krachtens algemene maatregel van bestuur vast te stellen
      bedrag, waarvan de hoogte afhankelijk is van de branche of branches waarvoor de verzekeraar een vergunning bezit.

      3 In afwijking van het eerste lid beloopt de solvabiliteitsmarge ten minste het voor de verzekeraar geldende
      minimum bedrag van het garantiefonds.

      4 Bij of krachtens algemene maatregel van bestuur wordt bepaald welke vermogensbestanddelen de solvabiliteitsmarge
      en het garantiefonds kunnen vormen en welke vermogensbestanddelen daarbij een aftrek dienen te vormen. Voorts
      wordt vermeld de mate waarin en de voorwaarden waaronder het in de eerste volzin bepaalde geschiedt. De Pensioen-
      & Verzekeringskamer kan tegen de waardering van de vermogensbestanddelen bedenkingen naar voren brengen, aan welke
      bedenkingen de verzekeraar tegemoet dient te komen.

      5 Indien een verzekeraar weet of redelijkerwijze kan voorzien dat zijn solvabiliteitsmarge niet voldoet
      of zal voldoen aan de eisen die daaraan krachtens het eerste of derde lid zijn gesteld, of dat zijn
      solvabiliteitsmarge niet of niet meer voldoet aan het door de Pensioen- & Verzekeringskamer op grond van
      [artikel 137a, tweede lid][ref1], hoger voorgeschreven minimum bedrag aan vereiste solvabiliteitsmarge doet hij
      hiervan terstond aan de Pensioen- & Verzekeringskamer mededeling.

      6 Bij of krachtens algemene maatregel van bestuur wordt bepaald dat en in hoeverre vorderingen op herverzekeraars
      als de vermogensbestanddelen, bedoeld in het vierde lid, in aanmerking kunnen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel137a
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 137a
        hoofdstuk: VII
        afdeling: '1'
  - number: '69'
    text: |-
      1 Bij koninklijk besluit kan, zonodig onder het stellen van beperkingen of het verbinden van voorschriften,
      een levensverzekeraar die sedert 15 maart 1979 uitsluitend of nagenoeg uitsluitend uitkeringen bij overlijden
      verzekert, waarvan het bedrag per verzekerde niet groter is dan het gemiddelde bedrag van de kosten van uitvaart,
      worden ontheven van de verplichting te beschikken over het minimum bedrag van het garantiefonds, bedoeld in
      [artikel 68, tweede lid][ref1].

      2 De Pensioen- & Verzekeringskamer kan een verzekeraar aan wie de ontheffing, bedoeld in het eerste lid, is
      verleend, toestaan over een lagere solvabiliteitsmarge te beschikken dan ingevolge [artikel 68, eerste lid][ref2],
      is vereist.

      3 Het eerste en tweede lid zijn niet van toepassing op de verzekeraar die zijn werkzaamheden uitbreidt met een of
      meer branches voor de uitoefening waarvan hij een vergunning behoeft of die in een andere lid-staat een bijkantoor
      wil openen dan wel zijn werkzaamheden aldaar wil uitbreiden.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel68
