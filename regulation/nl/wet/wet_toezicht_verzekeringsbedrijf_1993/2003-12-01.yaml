  - number: 69f
    text: |-
      Een verzekeraar die aan het toezicht, bedoeld in [artikel 69c, eerste lid][ref1], is onderworpen, beschikt
      over adequate interne controleprocedures om de gegevens en informatie te verschaffen die relevant zijn voor de
      uitoefening van dat toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
