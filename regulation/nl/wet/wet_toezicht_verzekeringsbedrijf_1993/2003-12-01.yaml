        afdeling: '1'
  - number: '157'
    text: |-
      1 Wanneer een verzoek tot het uitspreken van de noodregeling aanhangig is tegelijk met een verzoek of vordering tot
      faillietverklaring, wordt de behandeling van het verzoek of de vordering tot faillietverklaring geschorst totdat
      op het verzoek tot het uitspreken van de noodregeling is beschikt. Indien de rechtbank de noodregeling uitspreekt,
      vervalt het verzoek of de vordering tot faillietverklaring van rechtswege.

      2 Het uitspreken van de noodregeling heeft mede tot gevolg dat de verzekeraar slechts in staat van faillissement
      kan worden verklaard overeenkomstig [artikel 169][ref1].

      3 De rechtbank kan op verzoek van de bewindvoerders of ambtshalve de noodregeling beëindigen. De griffier doet van
      de intrekking mededeling in de *Staatscourant*.

      4 De Pensioen- & Verzekeringskamer geeft van het beëindigen van de noodregeling kennis aan de in
      [artikel 156, vijfde lid][ref2], bedoelde toezichthoudende autoriteiten.

      5 De bewindvoerders kunnen een verzoek tot het beëindigen van de noodregeling bij de rechtbank indienen zonder
      tussenkomst van een procureur.

      6 Door de beschikking, bedoeld in het derde lid of de mededeling, bedoeld in [artikel 165, vierde lid][ref3],
      vervallen van rechtswege de bevoegdheden, welke de bewindvoerders ingevolge de machtiging, bedoeld in
      [artikel 156][ref4] of de bijzondere machtiging, bedoeld in [artikel 165, eerste lid][ref5], hadden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel169
