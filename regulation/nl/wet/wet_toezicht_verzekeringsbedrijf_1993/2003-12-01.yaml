  - number: '84'
    text: |-
      1 Een verzekeraar met zetel in een andere lid-staat dan Nederland die voor de eerste maal een bijkantoor in
      Nederland opent, legt binnen twee weken daarna aan de Pensioen- & Verzekeringskamer over een exemplaar van
      zijn statuten, een akte van aanstelling van zijn vertegenwoordiger, bedoeld in [artikel 85, eerste lid][ref1],
      alsook, indien de vertegenwoordiger rechtspersoon is, de statuten van deze rechtspersoon, een uittreksel uit
      diens inschrijving in het handelsregister en een akte van aanstelling van de natuurlijke persoon, bedoeld in
      [artikel 85, vierde lid][ref2].

      2 De verzekeraar legt een afschrift van elke wijziging in zijn statuten aan de Pensioen- & Verzekeringskamer
      over en brengt elke wijziging in de akte van aanstelling van zijn vertegenwoordiger, bedoeld in
      [artikel 85, eerste lid][ref3], ter kennis van de Pensioen- & Verzekeringskamer, een en ander binnen twee weken
      na de totstandkoming van de wijziging. Dezelfde verplichting rust op de vertegenwoordiger die rechtspersoon is
      met betrekking tot elke wijziging in zijn statuten en in de akte van aanstelling van de door hem overeenkomstig
      [artikel 85, vierde lid][ref4], aangewezen natuurlijke persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel85
