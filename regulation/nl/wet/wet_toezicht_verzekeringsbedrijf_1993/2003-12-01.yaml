  - number: '154'
    text: |-
      De intrekking van een vergunning door de toezichthoudende autoriteit van een andere lid-staat dan Nederland,
      verplicht de verzekeraar met zetel in die lid-staat de uitoefening van zijn bedrijf door middel van een bijkantoor
      in Nederland of door middel van het verrichten van diensten naar Nederland af te wikkelen. Hij blijft daarbij
      onderworpen aan de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel154
  - number: '155'
    text: |-
      1 Een vordering of verzoek tot faillietverklaring van een verzekeraar - eigen aangifte daaronder begrepen - wordt
      niet in behandeling genomen zolang de verzekeraar in het bezit is van een vergunning hem door de Pensioen- &
      Verzekeringskamer verleend.

      2 Op een vordering of verzoek tot faillietverklaring van een verzekeraar wordt niet beslist dan nadat de rechter de
      Pensioen- & Verzekeringskamer in de gelegenheid heeft gesteld haar gevoelen daaromtrent kenbaar te maken en, indien
      het een verzekeraar met zetel in Nederland dan wel een verzekeraar met zetel buiten de Unie betreft, nadat alle
      vergunningen zijn ingetrokken.

      3 De wettelijke bepalingen inzake surséance van betaling zijn op verzekeraars niet van toepassing. De
      schuldsaneringsregeling natuurlijke personen kan niet van toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel155
  - number: '156'
    text: |-
      1 Wanneer het belang der gezamenlijke schuldeisers bij de afwikkeling van het bedrijf van een verzekeraar een
      bijzondere voorziening vordert, kan de rechtbank binnen welker rechtsgebied de verzekeraar zijn woonplaats heeft,
      op verzoek van de Pensioen- & Verzekeringskamer de noodregeling uitspreken. Voor de toepassing van de eerste volzin
      wordt onder verzekeraar verstaan:

      a. de verzekeraar die in het bezit is van een vergunning hem door de Pensioen- & Verzekeringskamer verleend dan
      wel, indien hij zijn zetel in een andere lid-staat heeft, van een daarmee overeenkomende vergunning hem door de
      toezichthoudende autoriteit van die lid-staat verleend; en

      b. de verzekeraar waarvan die vergunning is ingetrokken of vervallen;

      c. de verzekeraar die nimmer in het bezit is geweest van een door de Pensioen- & Verzekeringskamer verleende
      vergunning dan wel, indien hij zijn zetel in een andere lid-staat heeft, van een daarmee overeenkomende, door de
      toezichthoudende autoriteit van die lid-staat verleende vergunning.

      2 Bij het uitspreken van de noodregeling benoemt de rechtbank één of meer bewindvoerders. De Pensioen- &
      Verzekeringskamer kan voor de benoeming voordrachten doen.

      3 De rechtbank verleent aan de bewindvoerders een machtiging. De machtiging strekt zowel tot vereffening van het
      geheel of van een gedeelte van de portefeuille van de verzekeraar als tot overdracht van alle of van een deel
      van zijn rechten en verplichtingen uit of krachtens overeenkomsten van verzekering. Zolang nog niet blijkt dat de
      verzekeraar een negatief eigen vermogen heeft, strekt de machtiging mede tot vereffening van het vermogen van de
      onderneming van de verzekeraar.

      4 Ten aanzien van een verzekeraar met zetel buiten Nederland heeft de machtiging betrekking op het vanuit zijn
      bijkantoren in Nederland uitgeoefende verzekeringsbedrijf. Bij of krachtens algemene maatregel van bestuur kan
      worden bepaald welke activa en passiva tot dat bedrijf moeten worden gerekend.

      5 De Pensioen- & Verzekeringskamer zendt een afschrift van haar verzoekschrift aan de verzekeraar en geeft van de
      inhoud daarvan kennis aan:

      a. indien het een verzekeraar met zetel in Nederland betreft, de toezichthoudende autoriteiten van de andere lid-
      staten waar de verzekeraar een bijkantoor heeft of waarheen hij diensten verricht vanuit zijn vestigingen in de
      Unie;

      b. indien het een verzekeraar met zetel in een andere lid-staat betreft, de toezichthoudende autoriteit van de lid-
      staat van de zetel;

      c. indien het een verzekeraar met zetel buiten de Unie betreft, de toezichthoudende autoriteiten van de andere lid-
      staten waarheen hij diensten verricht vanuit een bijkantoor in Nederland en, indien een andere toezichthoudende
      autoriteit in de Unie belast is met het toezicht op de solvabiliteitsmarge van de betrokken verzekeraar, die
      toezichthoudende autoriteit.

      6 De rechtbank behandelt het verzoek van de Pensioen- & Verzekeringskamer tot het uitspreken van de noodregeling
      met de meeste spoed op een niet openbare terechtzitting op de voet van de rechtspleging in burgerlijke zaken, voor
      zover daarvan bij deze wet niet is afgeweken.

      7 De rechtbank kan inzage nemen of doen nemen van de zakelijke gegevens en bescheiden van de verzekeraar.
      [Artikel 57][ref1] is daarbij van overeenkomstige toepassing.

      8 De rechtbank geeft geen beschikking dan nadat de verzekeraar en de Pensioen- & Verzekeringskamer zijn gehoord
      althans behoorlijk zijn opgeroepen.

      9 De beschikking van de rechtbank wordt met redenen omkleed en wordt, indien de noodregeling wordt uitgesproken, op
      een openbare terechtzitting uitgesproken. De griffier doet van de zakelijke inhoud van de beschikking mededeling in
      de *Staatscourant*.

      10 De beschikking is uitvoerbaar bij voorraad, terugwerkend tot aan het begin van de dag waarop zij is
      uitgesproken, niettegenstaande enige daartegen gerichte voorziening.

      11 De Pensioen- & Verzekeringskamer geeft van de inhoud van de beschikking kennis aan de in het vijfde lid bedoelde
      toezichthoudende autoriteiten.

      12 Bij de beschikking bepaalt de rechtbank de duur van de machtiging op ten hoogste anderhalf jaar. Voor het
      verstrijken van de gestelde termijn kunnen de bewindvoerders eenmaal of meermalen verlenging van de geldigheidsduur
      voor ten hoogste anderhalf jaar verzoeken. Het verzoek wordt behandeld op dezelfde wijze als een verzoek tot het
      uitspreken van de noodregeling. Zolang bij de afloop van de geldigheidsduur van de machtiging op een verzoek tot
      verlenging niet is beschikt, blijft de machtiging gehandhaafd.

      13 De Pensioen- & Verzekeringskamer kan een verzoek tot het uitspreken van de noodregeling bij de rechtbank
      indienen zonder tussenkomst van een procureur.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel57
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel156
