  - number: 147l
    text: |-
      1 De Pensioen- & Verzekeringskamer stelt, gehoord de vertrouwenscommissie, een vergoedingsplan voor de opvang vast.

      2 Onverminderd de bevoegdheden die in [Boek 2 van het Burgerlijk Wetboek][ref1] worden toegekend aan de organen
      van de opvanginstelling, vindt de uitkering van dividend en de teruggave van kapitaal aan de aandeelhouders van de
      opvanginstelling, alsmede de rentevergoeding en de terugbetaling van de achtergestelde lening aan de schuldeisers
      uit hoofde van die aan de opvanginstelling verstrekte achtergestelde lening plaats volgens het vergoedingsplan.

      3 De Pensioen- & Verzekeringskamer kan indien dringende omstandigheden dit vergen en gehoord de
      vertrouwenscommissie, het vergoedingsplan wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147l
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 147l1
    text: |-
      1 Indien de opvanginstelling de portefeuille overdraagt aan een andere verzekeraar, zijn de
      [artikelen 130, achtste lid][ref1], en [131, eerste tot en met vierde lid, eerste volzin][ref2], niet van
      toepassing.

      2 Indien de Pensioen- & Verzekeringskamer geen bedenkingen heeft tegen de overdracht, verleent zij de
      opvanginstelling toestemming tot de overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel131
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel147l1
