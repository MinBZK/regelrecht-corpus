  - number: '186'
    text: |-
      1 De verzekeraars en de verzekeraars, bedoeld in [artikel 1, onderdeel ][ref1] dragen,
      volgens bij ministeriële regeling, de Pensioen- & Verzekeringskamer gehoord, te stellen
      regels, de kosten van de Pensioen- & Verzekeringskamer, verbonden aan de uitvoering
      van deze wet, van de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2] en van de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref3]. De Pensioen- & Verzekeringskamer legt de in de eerste
      volzin bedoelde verzekeraars hiertoe jaarlijks een aanslag op.

      2 De kosten en beloning van door de Pensioen- & Verzekeringskamer aangewezen personen als
      bedoeld in [artikel 54, derde lid, onderdeel ][ref4], en de kosten van publikaties, bedoeld in
      [artikel 54, derde lid, onderdeel ][ref5], komen ten laste van de betrokken verzekeraar, die daartoe van de
      Pensioen- & Verzekeringskamer een aanslag ontvangt.

      3 De verzekeraar voldoet het bedrag van de aanslag binnen een door de Pensioen- & Verzekeringskamer te bepalen
      termijn.

      4 Ingeval de verzekeraar niet aan het derde lid voldoet, kan de voorzitter van de Pensioen- & Verzekeringskamer
      een dwangbevel uitvaardigen, dat wordt executoir verklaard door de voorzieningenrechter van de rechtbank van
      het arrondissement waarin de Pensioen- & Verzekeringskamer is gevestigd en dan een executoriale titel oplevert,
      die met toepassing van de voorschriften van het [Wetboek van Burgerlijke Rechtsvordering][ref6] kan worden
      tenuitvoergelegd.


