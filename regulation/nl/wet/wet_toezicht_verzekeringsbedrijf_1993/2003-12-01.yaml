  - number: '180'
    text: |-
      Het is verboden in Nederland te bemiddelen bij of op andere soortgelijke wijze mee te werken aan de voorbereiding
      of de totstandkoming van overeenkomsten van verzekering met een verzekeraar die:

      a. het verzekeringsbedrijf uitoefent zonder in het bezit te zijn van de ingevolge [artikel 24, eerste lid][ref1],
      vereiste vergunning;

      b. een bijkantoor in Nederland heeft zonder te hebben voldaan aan de procedure die ingevolge deze wet is vereist
      voor verzekeraars met zetel in een andere lid-staat dan Nederland;

      c. diensten verricht naar Nederland zonder te hebben voldaan aan de procedure die ingevolge deze wet is vereist
      voor verzekeraars met zetel buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
