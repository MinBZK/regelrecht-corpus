  - number: 169a
    text: |-
      Indien een faillietverklaring wordt uitgesproken op verzoek van de bewindvoerders dan wel binnen vier weken na
      het einde van de noodregeling, geldt dat het tijdstip waarop de termijnen vermeld in de [artikelen 43][ref1] en
      [45 van de Faillissementswet][ref2] en in [artikel 138, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref3]
      aanvangen, wordt berekend vanaf het tijdstip waarop de noodregeling is uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel138
