  - number: 69e
    text: |-
      Indien een verzekeraar met zetel in Nederland en een of meer verzekeraars met zetel in een andere lid-staat dan
      Nederland als moederonderneming dezelfde verzekeringsholding, verzekeraar met zetel buiten de Unie, herverzekeraar
      of gemengde verzekeringsholding hebben, kan de Pensioen- & Verzekeringskamer met die andere toezichthoudende
      autoriteit in overleg treden met het doel overeenstemming te bereiken over de vraag wie het toezicht, bedoeld in
      [artikel 69c][ref1], zal uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel69c
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel69e
