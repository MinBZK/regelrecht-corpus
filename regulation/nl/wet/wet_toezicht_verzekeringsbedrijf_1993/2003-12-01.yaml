  - number: '123'
    text: |-
      1 De verzekeraar die zijn rechten en verplichtingen met toestemming van de Pensioen- & Verzekeringskamer
      heeft overgedragen, doet van de overdracht mededeling in de *Staatscourant* en op andere door de Pensioen- &
      Verzekeringskamer te bepalen wijze. Voor zover in de overdracht overeenkomsten zijn betrokken, waarbij risico’s
      zijn verzekerd, die in een andere lid-staat dan Nederland zijn gelegen, doet de verzekeraar van de overdracht
      tevens mededeling in die lid-staat. De inhoud van deze publikaties behoeft de voorafgaande toestemming van de
      Pensioen- & Verzekeringskamer.

      2 De overdracht wordt ten aanzien van alle andere belanghebbenden dan de betrokken verzekeraars van kracht met
      ingang van de tweede dag, volgende op die van de dagtekening van de *Staatscourant* waarin de publikatie is
      geplaatst.

      3 Indien een verzekeringnemer die lid is van een onderlinge waarborgmaatschappij met zetel in Nederland of van
      een onderneming dan wel instelling op onderlinge grondslag met zetel buiten de Unie, ingevolge de overdracht geen
      overeenkomst van schadeverzekering meer bij deze verzekeraar heeft lopen, eindigt zijn lidmaatschap uit dien hoofde
      van rechtswege met ingang van de tweede dag, volgende op die van de dagtekening van de *Staatscourant* waarin de
      publikatie is geplaatst.

      4 De bij een overdracht betrokken verzekeringnemers kunnen gedurende drie maanden na de dagtekening
      van de *Staatscourant* waarin de publikatie is geplaatst de overeenkomst van schadeverzekering
      schriftelijk opzeggen met ingang van de dag na afloop van deze termijn. De verzekeraar geeft alsdan
      de vooruitbetaalde premie alsmede de voldane assurantiebelasting en de omslagbijdragen, bedoeld
      in de [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] en de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref2] terug voor het gedeelte dat evenredig is aan het op de
      hiervoor bedoelde dag nog niet verstreken gedeelte van de termijn waarvoor de premie, de assurantiebelasting en de
      omslagbijdragen werden betaald.

      5 Indien bij de overdracht het lidmaatschap van een onderlinge waarborgmaatschappij met zetel in Nederland of van
      een onderneming dan wel instelling op onderlinge grondslag met zetel buiten Nederland is verkregen, eindigt in
      geval van opzegging overeenkomstig het vierde lid dit lidmaatschap en de daaruit voortvloeiende aansprakelijkheid
      voor een tekort van rechtswege eveneens met ingang van de dag na afloop van de termijn, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003933
      [ref2]: https://wetten.overheid.nl/BWBR0009750
