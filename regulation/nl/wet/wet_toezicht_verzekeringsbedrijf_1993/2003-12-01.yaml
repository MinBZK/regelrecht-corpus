  - number: 175a
    text: |-
      1 Voor het geval van een houder van een verklaring van geen bezwaar als bedoeld in
      [artikel 175, eerste lid][ref1], die aan het hoofd staat van een groep waartoe een of meer verzekeraars
      als bedoeld in [artikel 1, eerste lid, onderdeel ][ref2], en een of meer kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref3] behoren en waartoe ten minste één verzekeraar met zetel in Nederland
      behoort die een vergunning als bedoeld in [artikel 24, eerste lid][ref4], heeft verkregen, kan de Pensioen- &
      Verzekeringskamer, in overeenstemming met de autoriteit die ingevolge de [Wet toezicht kredietwezen 1992][ref5]
      belast is met het toezicht op kredietinstellingen, op grond van de overwegingen als bedoeld in
      [artikel 175, tweede lid, onderdelen ][ref6], voorschriften formuleren.

      2 De voorschriften worden overeenkomstig [artikel 175, derde lid][ref7], door Onze Minister aan een verklaring van
      geen bezwaar als bedoeld in [artikel 175, eerste lid][ref8], verbonden.

      3 Indien de voorschriften worden gewijzigd, kan Onze Minister, de Pensioen- & Verzekeringskamer gehoord, dan wel
      in door Onze Minister bepaalde gevallen vanwege Onze Minister de Pensioen- & Verzekeringskamer, de gewijzigde
      voorschriften verbinden aan de verklaring van geen bezwaar die aan een houder als bedoeld in het eerste lid is
      verleend.

      4 De voorschriften worden bekendgemaakt door plaatsing in de *Staatscourant*.


