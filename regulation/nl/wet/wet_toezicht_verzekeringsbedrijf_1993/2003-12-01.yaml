  - number: '81'
    text: |-
      1 Indien zich een wijziging voordoet van de gegevens, bedoeld in [artikel 80, tweede lid, onderdelen ][ref1],
      kan de verzekeraar die wijziging toepassen na haar ten minste een maand tevoren schriftelijk te hebben gemeld
      aan de betrokken toezichthoudende autoriteit en aan de Pensioen- & Verzekeringskamer en nadat de Pensioen- &
      Verzekeringskamer overeenkomstig het vierde lid de betrokken toezichthoudende autoriteit van die wijziging in
      kennis heeft gesteld.

      2 Indien een wijziging als bedoeld in het eerste lid het geval betreft dat de verzekeraar voornemens is voor de
      eerste maal risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen te dekken, voegen de verzekeraar en
      de Pensioen- & Verzekeringskamer bij de melding onderscheidenlijk de inkennisstelling, bedoeld in het eerste lid,
      tevens het schriftelijk bewijs, bedoeld in [artikel 80, tweede lid, onderdeel ][ref2].

      3 De verzekeraar doet de betrokken gewijzigde gegevens vergezeld gaan van een vertaling voor zover de Pensioen- &
      Verzekeringskamer zulks verlangt.

      4 Indien de verzekeraar beschikt over de ingevolge [artikel 68][ref3] vereiste solvabiliteitsmarge en de Pensioen-
      & Verzekeringskamer geen bedenkingen heeft tegen de wijziging, doet zij van de in het eerste lid bedoelde gegevens
      mededeling aan de betrokken toezichthoudende autoriteit binnen een maand na ontvangst van de melding, bedoeld in
      het eerste lid. Zij voegt daarbij een verklaring dat de verzekeraar beschikt over de ingevolge [artikel 68][ref4]
      vereiste solvabiliteitsmarge. De Pensioen- & Verzekeringskamer maakt die mededeling aan de verzekeraar bekend.

      5 De Pensioen- & Verzekeringskamer maakt in voorkomend geval aan de verzekeraar bekend welke voorwaarden de
      betrokken toezichthoudende autoriteit heeft aangegeven die om redenen van algemeen belang in acht moeten worden
      genomen bij het uitoefenen van de werkzaamheden in de betrokken lid-staat.

      6 Indien het voornemen bestaat om de bedrijfsuitoefening vanuit het bijkantoor te staken, stelt de verzekeraar de
      Pensioen- & Verzekeringskamer daarvan ten minste een maand tevoren schriftelijk in kennis. Zodra de verzekeraar
      zijn voornemen uitvoert, meldt hij dit onverwijld aan de Pensioen- & Verzekeringskamer.


