  - number: '170'
    text: |-
      De bewindvoerders brengen tijdens de noodregeling telkens na verloop van drie maanden, alsmede na beëindiging van
      de noodregeling zo spoedig mogelijk verslag omtrent hun werkzaamheden uit aan de rechtbank. Een afschrift van dit
      verslag zenden de bewindvoerders aan Onze Minister en aan de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel170
  - number: '171'
    text: |-
      1 In geval van noodregeling overeenkomstig dit hoofdstuk of van faillissement van een verzekeraar met zetel
      in Nederland worden de boedelschulden, overeenkomstig de bepalingen van de [Faillissementswet][ref1], al naar
      gelang de aard van de betrokken boedelschuld hetzij mede over de in Nederland aanwezige waarden, bedoeld in
      [artikel 67][ref2], omgeslagen, hetzij uitsluitend van een bepaalde bate van de boedel afgetrokken.

      2 Onverminderd het bepaalde in het eerste lid dienen in geval van noodregeling of van faillissement van een
      schadeverzekeraar met zetel in Nederland de waarden, ingevolge [artikel 67][ref3] geadministreerd voor de vanuit de
      vestigingen in Nederland aangegane verplichtingen uit of krachtens overeenkomsten van verzekering, uitsluitend tot
      voldoening van de volgende vorderingen en wel in de hierna vermelde volgorde:

      a. de vorderingen van gerechtigden betreffende periodieke uitkeringen ter zake van ziekte, letsel of overlijden
      van natuurlijke personen, ontstaan uit of krachtens de vanuit een vestiging in Nederland gesloten overeenkomsten
      van schadeverzekering, met uitzondering evenwel van uitkeringen, krachtens overeenkomst van herverzekering aan een
      andere verzekeraar verschuldigd, en van uitkeringen ter zake van pensioenen, toegezegd aan werknemers of gewezen
      werknemers van de verzekeraar of aan hun nabestaanden;

      b. de vorderingen van werknemers en gewezen werknemers alsmede de vorderingen van hun nabestaanden met betrekking
      tot reeds vervallen termijnen van pensioen, voor zover de vordering niet ouder is dan een jaar;

      c. de vorderingen van werknemers, niet zijnde bestuurders van de verzekeraar waarbij zij in dienst zijn, en gewezen
      werknemers alsmede de vorderingen van hun nabestaanden met betrekking tot in de toekomst tot uitkering komende
      termijnen van toegezegd pensioen;

      d. de vorderingen van werknemers met betrekking tot het loon over het voorafgaande jaar en hetgeen over het lopende
      jaar verschuldigd is, benevens het bedrag van de verhoging van dat loon ingevolge artikel 625 van Boek 7 van het
      Burgerlijk Wetboek alsmede het bedrag van de uitgaven, door de werknemer voor de verzekeraar als werkgever gedaan,
      en de bedragen, door de verzekeraar aan de werknemer krachtens titel 10 van Boek 7 van het Burgerlijk Wetboek in
      verband met de beëindiging van de arbeidsovereenkomst verschuldigd;

      e. de vorderingen van gerechtigden betreffende niet-periodieke uitkeringen ter zake van ziekte, letsel of
      overlijden van natuurlijke personen, ontstaan uit of krachtens de vanuit een vestiging in Nederland gesloten
      overeenkomsten van schadeverzekering, met uitzondering evenwel van uitkeringen, krachtens overeenkomst van
      herverzekering aan een andere verzekeraar verschuldigd;

      f. de vorderingen van gerechtigden betreffende uitkeringen ter zake van andere dan in de onderdelen *a* en *e*
      bedoelde schaden, ontstaan uit of krachtens de vanuit een vestiging in Nederland gesloten overeenkomsten van
      schadeverzekering.

      3 Onverminderd het bepaalde in het eerste lid dienen in geval van noodregeling of van faillissement van een
      levensverzekeraar met zetel in Nederland de waarden, ingevolge [artikel 67][ref4] geadministreerd voor de vanuit de
      vestigingen in Nederland aangegane verplichtingen uit of krachtens overeenkomsten van verzekering, uitsluitend tot
      voldoening van de volgende vorderingen en wel in de hierna vermelde volgorde:

      a. de vorderingen van werknemers en gewezen werknemers alsmede de vorderingen van hun nabestaanden met betrekking
      tot reeds vervallen termijnen van pensioen, voor zover de vordering niet ouder is dan een jaar;

      b. de vorderingen van werknemers, niet zijnde bestuurders van de verzekeraar waarbij zij in dienst zijn, en gewezen
      werknemers alsmede de vorderingen van hun nabestaanden met betrekking tot in de toekomst tot uitkering komende
      termijnen van toegezegd pensioen;

      c. de vorderingen van werknemers met betrekking tot het loon over het voorafgaande jaar en hetgeen over het lopende
      jaar verschuldigd is, benevens het bedrag van de verhoging van dat loon ingevolge artikel 625 van Boek 7 van het
      Burgerlijk Wetboek alsmede het bedrag van de uitgaven, door de werknemer voor de verzekeraar als werkgever gedaan,
      en de bedragen, door de verzekeraar aan de werknemer krachtens titel 10 van Boek 7 van het Burgerlijk Wetboek in
      verband met de beëindiging van de arbeidsovereenkomst verschuldigd;

      d. de vorderingen en rechten betreffende uitkeringen, die zijn ontstaan of nog zullen ontstaan uit overeenkomsten
      van levensverzekering, gesloten vanuit een vestiging in Nederland.

      4 Onder de in het tweede lid, onderdelen *a, e* en *f*, en derde lid, onderdeel *d*, bedoelde vorderingen worden
      mede begrepen de vorderingen ter zake van uitkeringen krachtens lopende overeenkomsten van verzekering, ontstaan
      op of na de dag waarop de machtiging, bedoeld in [artikel 156][ref5], is verleend dan wel, indien een faillissement
      wordt uitgesproken zonder voorafgaande machtiging of later dan vier weken na de beëindiging van de machtiging, op
      of na de dag waarop het faillissement is uitgesproken.

      5 Op de ingevolge [artikel 67][ref6] geadministreerde waarden voor de vanuit de vestigingen in Nederland aangegane
      verplichtingen uit of krachtens overeenkomsten van verzekering zijn, behoudens vorderingen die door pand of
      hypotheek op deze waarden zijn gedekt, geen andere vorderingen verhaalbaar, tenzij vaststaat dat alle vorderingen,
      genoemd in het tweede dan wel derde lid, zullen kunnen worden voldaan en dat in de toekomst zodanige vorderingen
      niet meer zullen ontstaan.

      6 Ingeval de in het tweede dan wel derde lid bedoelde vorderingen niet volledig uit de ingevolge [artikel 67][ref7]
      geadministreerde waarden voor de vanuit de vestigingen in Nederland aangegane verplichtingen uit of krachtens
      overeenkomsten van verzekering zijn voldaan, hebben de betrokken schuldeisers voor het overblijvende deel van hun
      vorderingen te zamen met de overige schuldeisers een gelijk recht om naar evenredigheid van ieders vordering uit de
      overige goederen te worden voldaan, behoudens de door de wet erkende redenen van voorrang.

      7 Het tweede tot en met vijfde lid zijn van overeenkomstige toepassing ten aanzien van de in Nederland aanwezige
      waarden van een verzekeraar met zetel in Nederland, ingevolge [artikel 67][ref8] geadministreerd voor de vanuit de
      bijkantoren in andere lid-staten aangegane verplichtingen uit of krachtens overeenkomsten van verzekering, zulks
      wat betreft de met het tweede en derde lid overeenkomende vorderingen van de crediteuren van die bijkantoren. Ten
      aanzien van de in de eerste volzin bedoelde vorderingen is het zesde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860
