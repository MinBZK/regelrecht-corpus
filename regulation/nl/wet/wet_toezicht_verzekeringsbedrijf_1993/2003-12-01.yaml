      1 Een verzekeraar met zetel buiten de Unie mag vanuit de bijkantoren in Nederland geen ander bedrijf dan hetzij het
      schadeverzekeringsbedrijf hetzij het levensverzekeringsbedrijf uitoefenen.

      2 Een schadeverzekeraar mag geen schaden verzekeren, veroorzaakt door of ontstaan uit gewapend conflict,
      burgeroorlog, opstand, binnenlandse onlusten, oproer en muiterij. In overeenkomsten van zee-, transport-,
      luchtvaart- en reisverzekering mogen evenwel de algemeen gebruikelijke molestclausules worden opgenomen zolang de
      Pensioen- & Verzekeringskamer daartegen geen bedenkingen naar voren heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel89
  - number: '90'
    text: |-
      Een levensverzekeraar doet binnen twee weken na het voor de eerste maal sluiten van een nieuw type overeenkomst van
      verzekering aan de Pensioen- & Verzekeringskamer opgave van de technische grondslagen voor de berekening van het
      desbetreffende tarief en van de desbetreffende technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel90
  - number: '91'
    text: |-
      1 Ontslag van de vertegenwoordiger is niet geldig tenzij het gepaard gaat met de aanstelling van een opvolger
      met gebruikmaking van het model, bedoeld in [artikel 40, derde lid][ref1]. Het ontslag gaat niet in voordat
      een akte van ontslag en de akte van aanstelling van de opvolger aan de Pensioen- & Verzekeringskamer zijn
      overgelegd en zij aan het bestuur van de verzekeraar heeft meegedeeld dat zij tegen het ontslag geen bedenkingen
      heeft. Is de opvolger rechtspersoon, dan doet de verzekeraar de akte van aanstelling vergezeld gaan van de
      statuten van deze rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister en de akte van
      aanstelling van de natuurlijke persoon, bedoeld in [artikel 45, vijfde lid][ref2], opgemaakt overeenkomstig
      [artikel 40, derde lid][ref3].

      2 De vertegenwoordiger die heeft bedankt, behoudt zijn hoedanigheid totdat hij van zijn bedanken kennis heeft
      gegeven aan de Pensioen- & Verzekeringskamer en zij aan het bestuur van de verzekeraar heeft meegedeeld dat zij
      daartegen geen bedenkingen heeft.


