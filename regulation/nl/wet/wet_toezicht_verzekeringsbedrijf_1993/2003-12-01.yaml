        afdeling: '4'
  - number: '106'
    text: |-
      De verzekeraar legt elke voorgenomen wijziging in de aard van de risico’s van schadeverzekering of in de aard van
      de overeenkomsten van levensverzekering ten opzichte van de opgave, bedoeld in [artikel 105, eerste lid][ref1], aan
      de Pensioen- & Verzekeringskamer over. Artikel 105, tweede en derde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel105
