  - number: '118'
    text: |-
      1 Een verzekeraar met zetel buiten de Unie, die vanuit een vestiging buiten de Unie diensten verricht naar
      Nederland, dient:

      a. naar het recht van de staat van zijn zetel rechtspersoon te zijn;

      b. in de staat van zijn zetel bevoegd te zijn tot uitoefening van het directe verzekeringsbedrijf en dit bedrijf
      vanuit een vestiging in die staat daadwerkelijk uit te oefenen; en

      c. met betrekking tot het gehele door hem uitgeoefende verzekeringsbedrijf te beschikken over een
      solvabiliteitsmarge, die ten minste overeenkomt met de ingevolge [artikel 68][ref1] vereiste solvabiliteitsmarge.

      2 De verzekeraar die voornemens is vanuit een vestiging buiten de Unie voor de eerste maal diensten te verrichten
      naar Nederland, legt, onder vermelding van de adressen van zijn zetel en van de vestiging van waaruit hij de
      diensten wenst te verrichten, aan de Pensioen- & Verzekeringskamer over:

      a. een authentiek afschrift van de akte van oprichting, een exemplaar van zijn statuten alsmede een lijst met namen
      en adressen van zijn bestuurders en commissarissen;

      b. bescheiden waaruit blijkt dat de verzekeraar voldoet aan de in het eerste lid gestelde eisen;

      c. een opgave van de aard van de:

      1°. in Nederland gelegen risico’s die de schadeverzekeraar voornemens is te dekken;

      2°. overeenkomsten die de levensverzekeraar voornemens is te sluiten; en

      d. bescheiden waaruit de bevoegdheid, bedoeld in [artikel 108][ref2], blijkt.

      3 Indien de verzekeraar risico’s behorende tot de branche Aansprakelijkheid motorrijtuigen wenst
      te dekken, legt hij aan de Pensioen- & Verzekeringskamer tevens over bescheiden als bedoeld in
      [artikel 111, eerste lid, onderdeel ][ref3].

      4 De verzekeraar kan het verrichten van diensten aanvangen vanaf de officieel bevestigde datum van ontvangst door
      de Pensioen- & Verzekeringskamer van de in het tweede of derde lid bedoelde bescheiden.

      5 Indien de verzekeraar voornemens is een wijziging aan te brengen in de aard van de risico’s of van de
      overeenkomsten ten opzichte van de opgave, bedoeld in het tweede lid, onderdeel *c*, zijn het tweede tot en met
      vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel108
