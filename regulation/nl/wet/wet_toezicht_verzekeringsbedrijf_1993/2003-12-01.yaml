  - number: '148'
    text: |-
      De Pensioen- & Verzekeringskamer kan een vergunning intrekken indien de verzekeraar:

      a. daarom verzoekt;

      b. niet meer voldoet aan de eisen die voor het verkrijgen van de vergunning zijn gesteld;

      c. niet binnen de ingevolge de [artikelen 138][ref1] onderscheidenlijk [144][ref2] door de Pensioen- &
      Verzekeringskamer goedgekeurde termijn de solvabiliteitsmarge op de vereiste omvang heeft gebracht;

      d. ernstig in gebreke blijft aan verplichtingen, hem bij of krachtens de wet in of buiten Nederland opgelegd, te
      voldoen;

      e. met zetel in Nederland dan wel, vanuit zijn bijkantoren in Nederland, indien hij zijn zetel buiten de Unie
      heeft, de bedrijfsuitoefening in de betrokken branche gedurende meer dan zes maanden heeft gestaakt; of

      f. binnen twaalf maanden na de verlening van de vergunning daarvan geen gebruik heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel144
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel148
