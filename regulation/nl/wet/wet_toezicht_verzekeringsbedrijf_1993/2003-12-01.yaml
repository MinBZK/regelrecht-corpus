      De verzekeraar legt elke voorgenomen wijziging in de aard van de risico’s van schadeverzekering of in de aard van
      de overeenkomsten van levensverzekering ten opzichte van de opgave, bedoeld in [artikel 77, eerste lid][ref1],
      aan de Pensioen- & Verzekeringskamer over. Artikel 77, tweede tot en met zevende lid, is van overeenkomstige
      toepassing.


