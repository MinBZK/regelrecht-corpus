      1 Een verzekeraar dient binnen zes maanden na afloop van het boekjaar zijn jaarverslag in drievoud bij de Pensioen-
      & Verzekeringskamer in, tenzij de Pensioen- & Verzekeringskamer een ander aantal vaststelt. Een verzekeraar
      die [artikel 403 van Boek 2 van het Burgerlijk Wetboek][ref1] toepast, dient het jaarverslag, bedoeld in
      [artikel 403, eerste lid, onderdeel e, van Boek 2 van het Burgerlijk Wetboek][ref2], onverwijld na de neerlegging
      daarvan ten kantore van het handelsregister bij de Pensioen- & Verzekeringskamer in.

      2 [Artikel 72, zesde lid][ref3], geldt ook voor het ingediende jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel403
