  - number: 164b
    text: |-
      1 De Pensioen- & Verzekeringskamer kan, gehoord de vertrouwenscommissie, het opvanginstrument, bedoeld in
      [artikel 147d][ref1], in werking stellen tijdens de noodregeling indien de portefeuille van de verzekeraar naar het
      oordeel van de Pensioen- & Verzekeringskamer levensvatbaar is.

      2 De bewindvoerders verlenen hieraan hun medewerking.

      3 De opvang blijft in een dergelijk geval beperkt tot de verplichte overdracht van de portefeuille, bedoeld in
      [artikel 147d, derde lid][ref2].

      4 [Artikel 147c, eerste en tweede lid][ref3], is niet van toepassing.


