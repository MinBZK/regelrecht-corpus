  - number: '55'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan bij:

        - een verzekeraar;
        - een vertegenwoordiger;
        - ondernemingen of instellingen die met een verzekeraar met zetel in Nederland in een groep zijn verbonden;
        - ondernemingen of instellingen die een gekwalificeerde deelneming houden in een verzekeraar met zetel in
      Nederland;
        - ondernemingen of instellingen waarop onderdeel c niet van toepassing is en waarin door een verzekeraar met zetel
      in Nederland of door een lid of meer leden tezamen van een in onderdeel c bedoelde groep voor meer dan vijftig
      procent rechtstreeks of middellijk wordt deelgenomen;
        - pools waarin verzekeraars ter egalisering van risico's samenwerken en daarmee vergelijkbare vormen van
      samenwerking tussen verzekeraars op verzekeringstechnisch gebied;
        - een ieder die zich naar het oordeel van de Pensioen- & Verzekeringskamer voordoet als verzekeraar,

      alle inlichtingen inwinnen of doen inwinnen, die redelijkerwijs nodig zijn voor de uitoefening van de taken en
      bevoegdheden die zij op grond van deze wet heeft en teneinde na te gaan of de bij of krachtens deze wet gestelde
      bepalingen worden nageleefd.

      2 Degene van wie de inlichtingen, bedoeld in het eerste lid, worden verlangd, verstrekt deze binnen de door de
      Pensioen- & Verzekeringskamer te stellen termijn.

      3 Ten aanzien van personen die door de Pensioen- & Verzekeringskamer zijn belast met het inwinnen van inlichtingen
      of met de uitoefening van andere taken en bevoegdheden die de Pensioen- & Verzekeringskamer heeft op grond van
      het bij of krachtens deze wet bepaalde, zijn de [artikelen 5:12][ref1], [5:13][ref2], [ 5:15][ref3], [5:16][ref4],
      [5:17][ref5] en [5:20 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing, met dien verstande
      dat indien een onderzoek als bedoeld in [artikel 184, eerste lid][ref7], wordt ingesteld, de persoon bij wie het
      onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen
      van inzage in zakelijke gegevens en bescheiden.


