    text: |-
      1 Het is een verzekeraar met zetel buiten de Unie verboden overeenkomsten van verzekering, gesloten vanuit een
      bijkantoor in Nederland, zonder toestemming van degenen die aan die overeenkomsten rechten kunnen ontlenen, over te
      boeken naar een vestiging van deze verzekeraar buiten Nederland.

      2 De Pensioen- & Verzekeringskamer kan ontheffing verlenen van het in het eerste lid gegeven verbod indien de
      verzekeraar aannemelijk maakt dat de belangen van degenen die aan de betrokken overeenkomsten rechten kunnen
      ontlenen, zich tegen de overboeking niet verzetten. Aan een ontheffing kunnen beperkingen worden gesteld of
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel104
  - number: '105'
    text: |-
      1 Een verzekeraar met zetel buiten de Unie die voornemens is vanuit Nederland voor de eerste maal diensten te
      verrichten naar een andere lid-staat, stelt de Pensioen- & Verzekeringskamer daarvan schriftelijk in kennis onder
      opgave van die lid-staat en van de aard van de risico’s van schadeverzekering die bij deze dienstverrichting zullen
      worden gedekt dan wel van de aard van de overeenkomsten van levensverzekering die bij deze dienstverrichting zullen
      worden gesloten.

      2 De verzekeraar doet de in het eerste lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de
      Pensioen- & Verzekeringskamer zulks verlangt.

      3 Indien de verzekeraar in het bezit is van een vergunning, beschikt over de ingevolge [artikel 96][ref1] vereiste
      solvabiliteitsmarge en de Pensioen- & Verzekeringskamer geen bedenkingen heeft tegen het verrichten van diensten,
      verstrekt zij hem op zijn aanvraag een verklaring waarin zulks wordt medegedeeld. Tevens wordt daarin opgave gedaan
      van de branches waarvoor de verzekeraar een vergunning bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel96
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel105
