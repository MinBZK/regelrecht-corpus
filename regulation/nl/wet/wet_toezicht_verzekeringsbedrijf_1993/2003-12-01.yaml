  - number: '97'
    text: |-
      Een verzekeraar met zetel buiten de Unie voert hier te lande de administratie met betrekking tot de bijkantoren in
      Nederland en bewaart hier te lande de desbetreffende zakelijke gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel97
  - number: '98'
    text: |-
      1 Een verzekeraar draagt zorg voor een goede administratieve organisatie en adequate interne controleprocedures.

      2 De Pensioen- & Verzekeringskamer kan aan verzekeraars regels stellen voor hun bedrijfsvoering met betrekking tot
      de administratieve organisatie – met inbegrip van de financiële administratie – en de interne controle.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel98
  - number: 98a
    text: |-
      1 Een verzekeraar draagt zorg voor adequate maatregelen, gericht op het bevorderen en handhaven van een integere
      bedrijfsvoering.

      2 Met het oog op een integere bedrijfsvoering worden bij of krachtens algemene maatregel van bestuur aan
      verzekeraars regels gesteld ter zake van:

      a. het tegengaan van verstrengeling van tegenstrijdige belangen;

      b. het voorkomen van betrokkenheid van de verzekeraar en van zijn werknemers bij strafbare feiten die het
      vertrouwen in de verzekeraar of in de financiële markten in het algemeen schaden;

      c. het voorkomen van betrokkenheid van de verzekeraar en van zijn werknemers bij handelingen die anderszins in het
      maatschappelijk verkeer zodanig onaanvaardbaar zijn, dat deze het vertrouwen in de verzekeraar of in de financiële
      markten in het algemeen schaden;

      d. het vaststellen van de identiteit, de aard en de achtergrond van de cliënten van de verzekeraar;

      e. andere bij algemene maatregel van bestuur te noemen onderwerpen.

      3 Onder integere bedrijfsvoering wordt in dit artikel verstaan de bedrijfsvoering met
      uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: '99'
    text: |-
      1 Een verzekeraar doet het boekjaar gelijk lopen met het kalenderjaar.

      2 De Pensioen- & Verzekeringskamer kan van het bepaalde in het eerste lid ontheffing verlenen. Aan een ontheffing
      kunnen beperkingen worden gesteld of voorschriften worden verbonden en zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel99
  - number: '100'
    text: |-
      1 Een verzekeraar dient binnen vier maanden na afloop van elk boekjaar bij de Pensioen- & Verzekeringskamer staten
      in, die te zamen een duidelijk beeld geven van het door de verzekeraar gevoerde beheer en van zijn financiële
      toestand. De indiening geschiedt in tweevoud en voor wat betreft de staten die ingevolge het zesde lid openbaar
      worden gemaakt, in drievoud, tenzij de Pensioen- & Verzekeringskamer andere aantallen vaststelt.

      2 De Pensioen- & Verzekeringskamer kan een verzekeraar, categorieën van verzekeraars of alle verzekeraars
      voorschrijven dat een of meer van deze staten met een hogere frequentie of binnen een kortere termijn worden
      ingediend of dat staten vergezeld worden van een toelichting.

      3 Een van de staten behelst het actuarieel verslag dat wordt voorzien van een verklaring van de actuaris.
      Met zijn verklaring bevestigt de actuaris dat hij zich ervan heeft overtuigd dat de in het actuarieel verslag
      genoemde voorzieningen prudent zijn vastgesteld en voor het levensverzekeringsbedrijf de in een staat opgenomen
      sterftevergelijking juist is weergegeven. Ten bewijze van een en ander waarmerkt de actuaris de betrokken staten.
      Hij is bevoegd zijn verklaring nader toe te lichten of op enig punt een voorbehoud te maken. De verzekeraar
      machtigt bij de opdracht tot het onderzoek de actuaris schriftelijk om desgevraagd of ingevolge een daartoe
      strekkende overeenkomst tussen de verzekeraar, de actuaris en de Pensioen- & Verzekeringskamer, aan de Pensioen-
      & Verzekeringskamer alle inlichtingen te verstrekken, die redelijkerwijze geacht kunnen worden nodig te zijn voor
      de vervulling van de haar bij of krachtens deze wet opgelegde taak. De Pensioen- & Verzekeringskamer stelt de
      verzekeraar in de gelegenheid aanwezig te zijn bij het verstrekken van inlichtingen door de actuaris.

      4 Indien de actuaris naar het oordeel van de Pensioen- & Verzekeringskamer niet of niet meer de nodige waarborgen
      biedt dat deze de toevertrouwde taak met betrekking tot de verzekeraar naar behoren zal vervullen, kan de Pensioen-
      & Verzekeringskamer bepalen dat hij niet bevoegd is een verklaring als bedoeld in het derde lid met betrekking tot
      die verzekeraar af te leggen.

      5 De modellen van de staten worden bij of krachtens algemene maatregel van bestuur vastgesteld. In de algemene
      maatregel van bestuur wordt bepaald welke staten openbaar moeten worden gemaakt.

      6 De verzekeraar legt de openbaar te maken staten op al zijn kantoren in Nederland ter inzage van een ieder tot
      achttien maanden na afloop van het boekjaar. Tot zolang verstrekt hij ieder op verzoek een afschrift tegen ten
      hoogste de kostprijs.

      7 De verzekeraar dient zijn jaarrekening in drievoud bij de Pensioen- & Verzekeringskamer in zodra hij deze
      openbaar heeft gemaakt of krachtens het recht van de staat van zijn zetel openbaar moet hebben gemaakt. Op deze
      jaarrekening is het vijfde lid van overeenkomstige toepassing.

      8 De Pensioen- & Verzekeringskamer kan bepalen dat de staten, bedoeld in het tweede lid, niet vergezeld gaan van
      een verklaring als bedoeld in het derde lid of van een verklaring als bedoeld in [artikel 100a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel100a
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel100
