  - number: 183a
    text: |-
      1 De Pensioen- & Verzekeringskamer kan, in afwijking van [artikel 182, eerste en tweede lid][ref1],
      gegevens of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak,
      verstrekken aan een rechter-commissaris voor zover die belast is met het toezicht uit hoofde van
      [artikel 64 van de Faillissementswet][ref2] op de curator die betrokken is bij het beheer en de vereffening van de
      failliete boedel van een verzekeraar.

      2 De Pensioen- & Verzekeringskamer verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid:

      a. indien de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de
      belangen die deze wet beoogt te beschermen;

      b. indien de gegevens of inlichtingen zijn verkregen van Nederlandse of buitenlandse overheidsinstanties dan
      wel van Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht
      op financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, en deze
      instanties niet instemmen met het verstrekken van de gegevens of inlichtingen.

      3 [Artikel 182, eerste tot en met vierde lid][ref3], is van overeenkomstige toepassing met betrekking tot de op
      grond van het eerste lid verstrekte gegevens.


