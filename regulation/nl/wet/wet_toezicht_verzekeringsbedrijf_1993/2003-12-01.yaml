  - number: '124'
    text: |-
      1 Indien een toezichthoudende autoriteit van een andere lid-staat dan Nederland de Pensioen- & Verzekeringskamer
      vraagt om haar advies of instemming betreffende een overdracht van rechten en verplichtingen uit of krachtens
      een of meer overeenkomsten van schadeverzekering, geeft zij haar oordeel binnen drie maanden na ontvangst van het
      daartoe strekkende verzoek.

      2 Indien de overdracht geschiedt aan een verzekeraar met zetel in een andere lid-staat dan Nederland in het
      kader van diens bedrijfsuitoefening vanuit een buiten Nederland gelegen vestiging, verleent de Pensioen- &
      Verzekeringskamer geen instemming voor zover de overdracht betrekking heeft op vanuit een in Nederland gelegen
      bijkantoor gesloten overeenkomsten waarvan de risico’s in Nederland zijn gelegen en de overdracht niet in het
      belang is van degenen die aan de betrokken overeenkomsten rechten kunnen ontlenen.

      3 Indien de overdracht geschiedt aan een verzekeraar met zetel buiten de Unie in het kader van diens
      bedrijfsuitoefening vanuit een buiten Nederland gelegen vestiging, verleent de Pensioen- & Verzekeringskamer
      geen instemming voor zover de overdracht betrekking heeft op vanuit een in Nederland gelegen bijkantoor gesloten
      overeenkomsten waarvan de risico’s in Nederland zijn gelegen, tenzij de overdracht in het belang is van degenen die
      aan de betrokken overeenkomsten rechten kunnen ontlenen.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel124
  - number: '125'
    text: |-
      1 De toestemming verleend door de toezichthoudende autoriteit van een andere lid-staat dan Nederland aan een
      verzekeraar met zetel in die lid-staat tot overdracht van rechten en verplichtingen uit of krachtens een of meer
      overeenkomsten van schadeverzekering in het kader van diens bedrijfsuitoefening vanuit een bijkantoor in Nederland
      dan wel in het kader van het verrichten van diensten naar Nederland vanuit een vestiging in de Unie, treedt in de
      plaats van de medewerking of de toestemming van degenen die aan die overeenkomsten rechten kunnen ontlenen.

      2 De verzekeraar die zijn rechten en verplichtingen overeenkomstig het eerste lid heeft overgedragen, doet van de
      overdracht mededeling in de *Staatscourant* en op andere door de Pensioen- & Verzekeringskamer te bepalen wijze. De
      inhoud van deze publikaties behoeft de voorafgaande toestemming van de Pensioen- & Verzekeringskamer.

      3 De overdracht wordt ten aanzien van alle andere belanghebbenden dan de betrokken verzekeraars van kracht op het
      volgens het recht van de betrokken lid-staat te bepalen tijdstip, dan wel, bij gebreke van een regeling in die lid-
      staat, met ingang van de tweede dag, volgende op die van de dagtekening van de *Staatscourant* waarin de publikatie
      is geplaatst.

      4 De bij een overdracht betrokken verzekeringnemers kunnen de overeenkomst van schadeverzekering volgens de door
      het recht van de betrokken lid-staat bepaalde wijze opzeggen. Bij gebreke van een regeling in die lid-staat is
      [artikel 123, vierde lid][ref1], van overeenkomstige toepassing.

      5 Indien bij de overdracht het lidmaatschap van een onderlinge waarborgmaatschappij met zetel in Nederland of van
      een onderneming dan wel instelling op onderlinge grondslag met zetel buiten Nederland is verkregen, eindigt in
      geval van opzegging overeenkomstig het vierde lid dit lidmaatschap en de daaruit voortvloeiende aansprakelijkheid
      voor een tekort van rechtswege eveneens volgens de door het recht van de betrokken lid-staat bepaalde wijze, dan
      wel, bij gebreke van een regeling in die lid-staat, met ingang van de dag na afloop van de termijn, bedoeld in
      [artikel 123, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel123
