  - number: 188e
    text: |-
      Degene jegens wie door Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete
      op te leggen, een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat hem wegens
      een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige verklaring af te leggen.
      Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188e
  - number: 188f
    text: |-
      1 Indien Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen,
      voornemens is een boete op te leggen, geeft hij, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is
      een boete op te leggen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister, dan wel de
      Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen, de betrokkene in de gelegenheid
      om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd,
      tenzij het een overtreding betreft die in de bijlage of de algemene maatregel van bestuur, bedoeld in
      [artikel 188d][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel188d
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0006509
        artikel: 188d
        hoofdstuk: XI_B
  - number: 188g
    text: |-
      1 Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen, legt de
      boete op bij beschikking.

      2 De beschikking vermeldt in ieder geval:

      a. het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;

      b. het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en

      c. de termijn, bedoeld in [artikel 188i, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188i
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188g
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188i
        hoofdstuk: XI_B
  - number: 188h
    text: |-
      1 De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.

      2 In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 188f, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn
      is verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188f
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188h
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188f
        hoofdstuk: XI_B
  - number: 188i
    text: |-
      1 De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 188f, tweede lid][ref1], is aangewezen.

      3 Indien de boete niet tijdig is betaald, stuurt Onze Minister, dan wel de Pensioen- & Verzekeringskamer indien
      zij de boete heeft opgelegd, schriftelijk een aanmaning om binnen twee weken de boete, verhoogd met de kosten van
      de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de boete, voor zover deze niet binnen de
      gestelde termijn wordt betaald, overeenkomstig het vierde lid zal worden ingevorderd.

      4 Bij gebreke van tijdige betaling kan Onze Minister, dan wel de Pensioen- & Verzekeringskamer indien zij de boete
      heeft opgelegd, de boete, verhoogd met de kosten van de aanmaning en van de invordering, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      staat, dan wel de Pensioen- & Verzekeringskamer indien zij de boete heeft opgelegd.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188f
      [ref2]: https://wetten.overheid.nl/BWBR0001827
