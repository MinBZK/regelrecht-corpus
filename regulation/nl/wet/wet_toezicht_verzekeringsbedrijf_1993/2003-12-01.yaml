  - number: 188j
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].

      2 Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 188c][ref2] vervalt,
      indien Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen,
      ter zake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel188c
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel188j
    references:
