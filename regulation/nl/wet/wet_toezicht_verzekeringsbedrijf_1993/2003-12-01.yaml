      [15 tot en met 18][ref4], [55 tot en met 57][ref5],[ 174 en 188][ref6] - niet van toepassing op:

      a. verzekeraars met zetel in Nederland die het verzekeringsbedrijf uitsluitend als herverzekeraar uitoefenen;

      b. verzekeraars met zetel buiten Nederland die vanuit de bijkantoren in Nederland het verzekeringsbedrijf
      uitsluitend als herverzekeraar uitoefenen.

      2 De in het eerste lid bedoelde verzekeraars zenden jaarlijks binnen zes maanden na afloop van het boekjaar een
      jaarrekening met jaarverslag in tweevoud toe aan de Pensioen- & Verzekeringskamer.


