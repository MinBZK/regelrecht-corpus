  - number: 188d
    text: |-
      1 Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete
      voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.

      2 De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.

      3 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      4 Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen, kan het
      bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de boete in een bepaald geval
      op grond van bijzondere omstandigheden onevenredig hoog is.

      5 Voor overtreding van voorschriften gesteld bij of krachtens een algemene maatregel van bestuur op grond
      van de [artikelen 19][ref1], [20][ref2], [42, eerste lid, onderdeel e][ref3], [51, eerste lid][ref4],
      [55a][ref5], [66, vierde en vijfde lid, eerste volzin][ref6], [66, zevende en achtste lid][ref7],
      [68, eerste, tweede, vierde lid, eerste volzin en zesde lid][ref8], [70a, tweede lid][ref9],
      [72, vijfde lid][ref10], [98a, tweede lid][ref11], [94, vierde en vijfde lid, eerste volzin][ref12],
      [94, achtste en negende lid][ref13], [100, vijfde lid][ref14], en [187, eerste lid][ref15], wordt het bedrag
      van de boete bepaald op de wijze als voorzien in de bijlage behorend bij die algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt. Ten aanzien van
      ministeriële regelingen, bedoeld in de [artikelen 25, tweede lid][ref16] en [147k, negende lid][ref17],  is de
      eerste volzin van overeenkomstige toepassing.


