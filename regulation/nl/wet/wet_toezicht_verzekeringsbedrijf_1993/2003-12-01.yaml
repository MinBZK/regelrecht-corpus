  - number: 7a
    text: |-
      De raad van toezicht van de Pensioen- & Verzekeringskamer stelt jaarlijks voor 1 november een begroting vast voor
      het volgende jaar. De begroting behoeft de goedkeuring van Onze Minister en Onze Minister van Sociale Zaken en
      Werkgelegenheid gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006509/2003-12-01#Artikel7a
  - number: '8'
    text: |-
      1 De Pensioen- & Verzekeringskamer brengt jaarlijks over haar werkzaamheden en bevindingen ingevolge deze
      wet aan Ons verslag uit. In het verslag worden niet opgenomen de door haar gegeven aanwijzingen, bedoeld in
      [artikel 54, eerste lid][ref1], waarvan geen mededeling is gedaan, noch wordt ten aanzien van afzonderlijke
      verzekeraars melding gemaakt van inlichtingen die niet in de openbaar te maken staten, bedoeld in de
      [artikelen 72, vierde lid][ref2], en [100, vierde lid][ref3], zijn opgenomen. Een oordeel over enige verzekeraar
      wordt in dit verslag niet kenbaar gemaakt.

      2 Het verslag wordt door de zorg van de Pensioen- & Verzekeringskamer openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel72
