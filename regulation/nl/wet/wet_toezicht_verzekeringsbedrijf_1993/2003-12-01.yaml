  - number: '165'
    text: |-
      1 De rechtbank kan tegelijk met de in [artikel 156][ref1] bedoelde machtiging of daarna de bewindvoerders op hun
      verzoek een bijzondere machtiging verlenen die strekt tot een of meer van de volgende handelingen:

      a. wijziging, bij de overdracht van rechten en verplichtingen uit of krachtens overeenkomsten van verzekering, van
      die overeenkomsten;

      b. verkorting van de duur van overeenkomsten van verzekering.

      2 Wijzigingen als bedoeld in het eerste lid, onderdeel *a*, die op overeenkomsten van levensverzekering betrekking
      hebben, kunnen niet tot gevolg hebben dat aan verzekeringnemers meer verplichtingen worden opgelegd.

      3 Ten aanzien van de bijzondere machtiging zijn de
      [artikelen 156, vierde tot en met achtste lid, negende lid, eerste volzin, en tiende tot en met twaalfde lid][ref2]
      , van overeenkomstige toepassing.

      4 Zodra overdracht van rechten en verplichtingen krachtens de in [artikel 156][ref3] bedoelde machtiging heeft
      plaatsgevonden, doen de bewindvoerders van deze overdracht en, zo handelingen door hen zijn verricht krachtens de
      in het eerste lid bedoelde bijzondere machtiging, van deze handelingen mededeling in de *Staatscourant* en in ten
      minste drie door de rechtbank aan te wijzen dagbladen. De bewindvoerders kunnen, indien zij dit in het belang van
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen achten, de bedoelde overdracht en handelingen tevens
      op andere wijze publiceren.

      5 De overdracht en de wijziging, bedoeld in het eerste lid, onderdeel *a*, worden ten aanzien van alle
      andere belanghebbenden dan de betrokken verzekeraars van kracht met ingang van de tweede dag, volgende op
      die van de dagtekening van de *Staatscourant* waarin de publikatie is geplaatst. Op de overdracht zijn de
      [artikelen 121, eerste tot en met derde en vijfde lid][ref4], [122, eerste en tweede lid][ref5], [123][ref6],
      [129, eerste tot en met derde, vijfde tot en met zevende lid][ref7], [130, eerste, tweede en achtste lid][ref8], en
      [131][ref9] niet van toepassing.

      6 De Pensioen- & Verzekeringskamer geeft van de overdracht en de handelingen kennis aan de in
      [artikel 156, vijfde lid][ref10], bedoelde toezichthoudende autoriteiten.

      7 Wijzigingen als bedoeld in het eerste lid, onderdeel a, laten onverlet de uitkeringen die overeenkomstig
      [artikel 163a][ref11] zijn gedaan voor de dag van de indiening van het verzoek om de machtiging als bedoeld in het
      eerste lid.


