preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is het vindersrecht van den Staat op de ingevolge de
    wet van 6 October 1908 (Staatsblad n°. 312) opgespoorde delfstoffen vast te leggen, alsmede, in verband met het
    aantoonen van aardolie, voor een bepaald gebied de vrijheid van het opsporen van delfstoffen op te heffen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001918/1924-07-27#ArtikelAanhef
articles:
  - number: I
    text: |-
      De aantooning van steenkool- of zoutafzettingen, na het in werking treden van deze wet, geeft geen recht op eenige
      schadevergoeding (indemnité) als bedoeld in de artikelen 16, tweede lid, en 46 der wet van 21 April 1810 (*Bulletin
      des Lois* no. 285) concernant les mines, les minières et les carrières, in de terreinen, begrensd als volgt:

      A. ten Oosten door de rechte lijn, getrokken over den Rijksgrenspaal n°. 432 en paal n°. 15 aan de spoorlijn
      tusschen het station *Sevenum* en de halte America;

      ten Noorden door de rechte lijn, getrokken over paal n°. 21 aan de bovengenoemde spoorlijn tusschen de halte
      *America* en het station *Helenaveen* en paal n°. 12 aan het kanaal van Deurne;

      ten Westen door de rechte lijn, getrokken over paal n°. 4 aan het Zijkanaal en den Rijksgrenspaal n°. 407;

      ten Zuiden door de Rijksgrens van den Rijksgrenspaal n°. 407 tot den Rijksgrenspaal n°. 432;

      B. ten Noorden door de parallel van 52° N.B.;

      ten Oosten door de Rijksgrens tot haar snijpunt met de *Oerdinger* of *Groote Beek* bij den Rijksgrenspaal n°. 776;

      ten Zuiden door de *Groote Beek,* westwaarts genaamd Slingerbeek;

      ten Westen door den meridiaan van 1° 45' O.L. van Amsterdam;

      C. ten Noordwesten door de rechte lijn, getrokken over de as van den toren der Roomsch-Katholieke kerk te
      *Enschedé* en het kruispunt van de as van de *Boekeler Beek* met de as van de spoorlijn Haaksbergen-Boekelo-
      Enschedé;

      ten Zuidwesten door de as van den weg, welke loopt van *Wijcheringshoek* over de *Welen Mos* naar Rutbeek;

      ten Zuiden door de as van den kunstweg van *Haaksbergen* naar *Enschedé* en de rechte lijn, loopende van het
      kruispunt van die as met de as van de *Bruninkbeek,* ter plaatse ook wel genaamd de *Nieuwe Beek,* naar den
      Rijksgrenssteen n°. 32;

      ten Noordoosten door de rechte lijn, loopende van den Rijksgrenssteen n°. 32 over het Zuidwesthoekpunt van het
      haltegebouw *Usselo,* gelegen tusschen de stations *Boekelo* en *Enschedé*;

      D. ten Noorden door de rechte lijn van het Noordoosthoekpunt van het kasteel Goedenraad (gemeente *Wittem*) naar
      het snijpunt van de as der spoorbaan *Maastricht-Aken* met de rechte lijn, getrokken van het kruispunt van de as
      van den grooten weg van *Heerlen* naar *de Locht* met de Rijksgrens, naar den Rijksgrenspaal n°. 204;

      ten Zuidoosten van dit snijpunt laatstbedoelde rechte lijn volgend tot evengenoemden grenspaal en vervolgens de
      Rijksgrens volgend tot den Rijksgrenspaal n°. 201;

      ten Zuidwesten van den Rijksgrenspaal n°. 201 in rechte lijn naar het Noordoosthoekpunt van het kasteel Goedenraad.
    url: https://wetten.overheid.nl/BWBR0001918/1924-07-27#ArtikelI
  - number: II
    text: |-
      Het is verboden, tenzij daartoe vergunning van Onzen Minister van Waterstaat is verkregen, delfstoffen op te sporen
      in het terrein, omschreven in [artikel I onder B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001918#ArtikelI
    url: https://wetten.overheid.nl/BWBR0001918/1924-07-27#ArtikelII
