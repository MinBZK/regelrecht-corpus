      De werkzaamheden in verband met het op grond van [artikel 17m][ref1] ter openbare kennis brengen van een feit
      worden verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit of het daaraan
      voorafgegane onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel17m
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel17r
