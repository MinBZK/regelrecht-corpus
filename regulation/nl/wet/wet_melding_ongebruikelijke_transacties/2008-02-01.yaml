  - number: '4'
    text: |-
      1 Bij het meldpunt ongebruikelijke transacties kunnen persoonsgegevens worden verwerkt ten behoeve van de
      voorkoming en opsporing van de in [artikel 3, onderdeel a][ref1], bedoelde misdrijven.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de categorieën van personen waarover het
      meldpunt gegevens verwerkt alsmede de soorten gegevens die het verwerkt, het coderen van gegevens door deze te
      voorzien van een indicatie over betrouwbaarheid, de gegevensverstrekking, de bewaring en vernietiging van gegevens
      en de protocolplicht.

      3 Op de verwerking van persoonsgegevens door het meldpunt ongebruikelijke transacties zijn de [artikelen 1][ref2],
      [2][ref3], [3, eerste en tweede lid][ref4], [4][ref5], [6][ref6], [7][ref7], [22][ref8] en [23][ref9]
      alsmede de [artikelen 25 tot en met 31 van de Wet politiegegevens][ref10] van overeenkomstige toepassing, met
      dien verstande dat voor het meldpunt als verantwoordelijke in de zin van [artikel 1, onderdeel g][ref11], wordt
      aangemerkt Onze Minister van Justitie.


