  - number: '18'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult of heeft vervuld verboden van gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt
      of ontvangen, verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de
      uitoefening van zijn taak of door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel18
  - number: '19'
    text: |-
      1 Degene die ingevolge [artikel 9][ref1] een melding doet of die ingevolge [artikel 10][ref2] nadere gegevens of
      inlichtingen verstrekt, is verplicht tot geheimhouding daarvan, behoudens voor zover uit de doelstelling van deze
      wet de noodzaak tot bekendmaking voortvloeit.

      2 Degene die ingevolge [artikel 3, onder ][ref3], gegevens of inlichtingen verkrijgt, is verplicht tot
      geheimhouding daarvan.


