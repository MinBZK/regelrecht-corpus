  - number: '11'
    text: |-
      Het meldpunt kan nadere regels stellen omtrent de wijze waarop een melding moet worden gedaan, respectievelijk
      gegevens en inlichtingen, gevraagd krachtens [artikel 10, eerste lid][ref1], moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel10
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '10'
        hoofdstuk: III
  - number: '12'
    text: |-
      1 Gegevens of inlichtingen die in overeenstemming met de [artikelen 9][ref1] of [10][ref2] zijn verstrekt, kunnen
      niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging wegens verdenking van,
      of als bewijs ter zake van een telastelegging wegens witwassen, heling van geld en financieren van terrorisme door
      degene die deze gegevens of inlichtingen heeft verstrekt.

      2 Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven aan de
      [artikelen 9][ref3] of [10][ref4], kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek
      of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens, overtreding van
      [artikel 272 van het Wetboek van Strafrecht][ref5] door degene die deze gegevens of inlichtingen heeft verstrekt.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de persoon die werkzaam is voor degene
      die gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of tweede lid en die daaraan heeft
      meegewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
