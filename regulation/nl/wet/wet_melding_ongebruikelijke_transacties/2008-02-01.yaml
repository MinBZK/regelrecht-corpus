  - number: '5'
    text: De algemene leiding, de organisatie en het beheer van het meldpunt berusten bij Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel5
  - number: '6'
    text: |-
      Benoeming, schorsing en ontslag van het hoofd van het meldpunt geschiedt bij koninklijk besluit op voordracht van
      Onze Minister van Justitie in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën het budget en de sterkte van
      het meldpunt.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel7
  - number: '8'
    text: |-
      1 Bij algemene maatregel van bestuur worden zo nodig per daarbij te onderscheiden categorieën transacties
      de indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een
      ongebruikelijke transactie.

      2 Indien het spoedeisend belang zulks vereist, kunnen Onze Minister van Financiën en Onze Minister van Justitie
      gezamenlijk de indicatoren, bedoeld in het eerste lid, vaststellen voor een termijn van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel8
  - number: '9'
    text: |-
      1 Een ieder die beroeps- of bedrijfsmatig een dienst verleent, meldt een daarbij verrichte of voorgenomen
      ongebruikelijke transactie binnen veertien dagen nadat het ongebruikelijke karakter van de transactie bekend is
      geworden, aan het meldpunt.

      2 Een melding bevat, voor zover mogelijk, de volgende gegevens:

      a. de identiteit van de cliënt;

      b. de aard en het nummer van het identiteitsbewijs van de cliënt;

      c. de aard, het tijdstip en de plaats van de transactie;

      d. de omvang en bij een dienst bedoeld in [artikel 1, eerste lid, onder a, sub 7°][ref1], de bestemming en de
      herkomst van de bij de transactie betrokken gelden, effecten, edele metalen of andere waarden;

      e. de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;

      f. bij een dienst als bedoeld in [artikel 1, eerste lid, onder a, sub 9°][ref2]: een omschrijving van de
      desbetreffende zaken van grote waarde;

      g. aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.

      3 Degene die een dienst, verleent is verplicht de gegevens, bedoeld in het tweede lid, op toegankelijke wijze te
      bewaren gedurende vijf jaar na het tijdstip van het doen van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel1
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel9
