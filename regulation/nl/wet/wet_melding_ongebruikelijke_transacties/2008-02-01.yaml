        artikel: '8'
  - number: 17b
    text: |-
      1 Bij besluit van Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk kunnen een of meer
      rechtspersonen worden aangewezen, die belast zijn met het toezicht op de naleving van de [artikelen 9][ref1],
      [10, tweede lid][ref2], [17u][ref3] en [19][ref4] door degene die beroeps- of bedrijfsmatig een dienst verleent.

      2 Ten aanzien van personen die door een op grond van het eerste lid aangewezen rechtspersoon belast
      zijn met het toezicht op de naleving van de artikelen, genoemd in het eerste lid, zijn de bepalingen van
      [hoofdstuk 5, afdeling 5.2, van de Algemene wet bestuursrecht][ref5] van overeenkomstige toepassing.

      3 Van een besluit tot aanwijzing op grond van het eerste lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
