  - number: '14'
    text: Er is een Begeleidingscommissie voor het meldpunt.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel14
  - number: '15'
    text: |-
      De commissie heeft tot taak:

      a. het meldpunt in zijn functioneren te begeleiden;

      b. het ter beschikking stellen aan het meldpunt van haar kennis en deskundigheid;

      c. het desgevraagd of uit eigen beweging adviseren van Onze Minister van Justitie of Onze Minister van Financiën
      over onder meer:

      1°. de wijze waarop het meldpunt zijn taak verricht;

      2°. de vaststelling van de indicatoren bedoeld in [artikel 8][ref1];

      3°. de effectiviteit van de meldingsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel8
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '8'
        hoofdstuk: III
  - number: '16'
    text: |-
      1 De commissie bestaat uit vertegenwoordigers van:

      a. Onze Minister van Justitie;

      b. Onze Minister van Financiën;

      c. de bedrijfstakken en beroepsgroepen die onder de werking van deze wet vallen;

      d. de toezichthoudende autoriteiten voor de bedrijfstakken die onder de werking van deze wet vallen;

      e. de Economische Controledienst;

      f. het openbaar ministerie;

      g. de politie.

      2 De leden van de commissie worden op voordracht van de in het eerste lid bedoelde instanties door Onze Minister
      van Justitie benoemd voor drie jaren. Zij kunnen éénmaal worden herbenoemd. Bij de samenstelling van de commissie
      streeft Onze Minister van Justitie naar een evenwichtige verdeling van de vertegenwoordigde instanties.

      3 Een vertegenwoordiger van Onze Minister van Justitie bekleedt het voorzitterschap van de commissie.

      4 De commissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel16
  - number: '17'
    text: |-
      De instellingen die met het toezicht op financiële instellingen zijn belast, lichten, in afwijking van eventuele
      geheimhoudingsbepalingen in de op die instellingen toepasbare andere wetten, het meldpunt in, indien zij bij de
      uitoefening van hun taak feiten ontdekken die duiden op witwassen, heling van geld of financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel17
  - number: 17a
    text: |-
      De Nederlandsche Bank N.V. licht, in afwijking van
      [artikel 8 van de Wet financiële betrekkingen buitenland 1994][ref1], het meldpunt in indien zij bij de
      uitoefening van haar taak op grond van die wet feiten ontdekt die duiden op witwassen, heling van geld of
      financieren van terrorisme.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel8
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel17a
