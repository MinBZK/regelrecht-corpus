  - number: '10'
    text: |-
      1 Het meldpunt is bevoegd bij degene die een melding heeft gedaan, alsmede bij degene die door het verlenen van
      een dienst als bedoeld in [artikel 1, eerste lid, onder a, sub 7°][ref1], bij een transactie is betrokken waarover
      het meldpunt gegevens heeft verzameld, nadere gegevens of inlichtingen te vragen, teneinde te kunnen beoordelen of
      verzamelde gegevens dienen te worden verstrekt op grond van zijn taak bedoeld in [artikel 3, onder ][ref2].

      2 Degene aan wie overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, is verplicht deze aan
      het meldpunt schriftelijk, alsmede in spoedeisende gevallen mondeling, te verstrekken binnen de door het meldpunt
      gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel3
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel10
