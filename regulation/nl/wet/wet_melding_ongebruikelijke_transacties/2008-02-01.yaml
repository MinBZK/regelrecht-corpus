      1 Onze Minister van Financiën kan een last onder dwangsom opleggen ter zake van overtreding van
      de [artikelen 9][ref1], [10, tweede lid][ref2], [17u][ref3] en [19][ref4] van deze wet en van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref5].

      2 Ten aanzien van de bevoegdheid, bedoeld in het eerste lid, is
      [artikel 5:32, tweede tot en met vijfde lid, van de Algemene wet bestuursrecht][ref6] van toepassing.

      3 Het eerste lid is niet van toepassing op degene die, in geval van bezwaren tegen diens handelen of nalaten in de
