  - number: 17q
    text: |-
      1 De bevoegdheid om op grond van [artikel 17m][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na
      de dag waarop het feit heeft plaats gehad.

      2 De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel17m
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel17q
