preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan de Richtlijn van de Raad
    van de Europese Gemeenschappen van 10 juni 1991 tot voorkoming van het gebruik van het financiële stelsel voor
    het witwassen van geld (91/308/EEG), alsmede dat het wenselijk is de aanbevelingen 15, 16, 17, 20, 26, 28 en 32
    van de Financial Action Task Force on money laundering van 30 mei 1990 in de Nederlandse wet- en regelgeving te
    implementeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. dienst: het in of vanuit Nederland:

      1°. in bewaring nemen van effecten, bankbiljetten, munten, muntbiljetten, edele metalen en andere waarden;

      2°. openstellen van een rekening waarop een saldo in geld, effecten, edele metalen of andere waarden kan worden
      aangehouden;

      3°. verhuren van een safe-loket;

      4°. verrichten van een uitbetaling ter zake van het verzilveren van coupons of vergelijkbare stukken van obligaties
      of vergelijkbare waardepapieren;

      5°. sluiten van een overeenkomst van levensverzekering als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], alsmede het daarbij verlenen van bemiddeling;

      6°. doen van een uitkering uit hoofde van een overeenkomst van levensverzekering als bedoeld sub 5°;

      7°. crediteren of debiteren dan wel doen crediteren of debiteren van een rekening waarop een saldo in geld,
      effecten, edele metalen of andere waarden kan worden aangehouden;

      8°. wisselen van guldens, euro’s of vreemde valuta;

      9°. verkopen, alsmede het verlenen van bemiddeling bij verkoop, van voertuigen, schepen, kunstvoorwerpen,
      antiquiteiten, edelstenen, edele metalen, sieraden, juwelen dan wel andere bij algemene maatregel van bestuur aan
      te wijzen zaken van grote waarde.

      10°. verlenen van andere bij algemene maatregel van bestuur aan te wijzen diensten;

      b. cliënt: de natuurlijke persoon of rechtspersoon aan of ten behoeve van wie een dienst wordt verleend, alsmede in
      geval van een dienst als bedoeld in het eerste lid, onder *a*, sub 5° en 6°, degene die de premie betaalt alsmede
      degene ten behoeve van wie de uitkering wordt gedaan;

      c. transactie: een handeling of samenstel van handelingen van of ten behoeve van een cliënt in verband met het
      afnemen of het verlenen van één of meer diensten;

      d. ongebruikelijke transactie: een transactie die aan de hand van de ingevolge [artikel 8][ref2] bepaalde
      indicatoren als zodanig wordt aangemerkt;

      e. melding: een melding als bedoeld in [artikel 9][ref3];

      f. meldpunt: het meldpunt bedoeld in [artikel 2][ref4];

      g. commissie: de commissie bedoeld in [artikel 14][ref5];

      h. financieren van terrorisme:

      1°. het opzettelijk verwerven of voorhanden hebben van voorwerpen met geldswaarde, bestemd tot het begaan van een
      misdrijf als bedoeld in [artikel 83 van het Wetboek van Strafrecht][ref6];

      2°. het opzettelijk verschaffen van middelen met geldswaarde tot het plegen van een misdrijf als bedoeld in
      [artikel 83 van het Wetboek van Strafrecht][ref7]; of

      3°. het verlenen van geldelijke steun, alsmede het werven van geld ten behoeve van een organisatie die tot oogmerk
      heeft het plegen van misdrijven als bedoeld in [artikel 83 van het Wetboek van Strafrecht][ref8].

      2 De krachtens het eerste lid, onderdeel 10°, aan te wijzen diensten hebben geen betrekking op werkzaamheden van
      een advocaat of een notaris betreffende de bepaling van de rechtspositie van een cliënt, diens vertegenwoordiging
      en verdediging in rechte, het geven van advies voor, tijdens en na een rechtsgeding, of het geven van advies over
      het instellen of vermijden van een rechtsgeding.

      3 De voordracht voor een krachtens het eerste lid, onderdeel 9° of 10°, vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


