        artikel: 17b
        hoofdstuk: V
  - number: 17u
    text: |-
      Indien een instelling of persoon niet voldoet aan zijn verplichtingen voortvloeiend uit de [artikelen 9][ref1],
      [10, tweede lid][ref2], en [19][ref3] kunnen de op grond van [artikel 17b, eerste lid][ref4], aangewezen
      rechtspersonen aanwijzingen geven aangaande:

      a. de ontwikkeling van interne procedures en controles ter voorkoming van witwassen; en

      b. de training van werknemers teneinde hen te informeren over witwassen en de daarbij gebruikte methodes.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0006331#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0006331#Artikel17b
