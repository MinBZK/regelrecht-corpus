  - number: '2'
    text: Er is een Meldpunt Ongebruikelijke Transacties.
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel2
  - number: '3'
    text: |-
      Het meldpunt heeft met het oog op de voorkoming en opsporing van witwassen, heling van geld en financieren van
      terrorisme tot taak:

      a. het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of
      deze gegevens van belang kunnen zijn voor de voorkoming en opsporing van misdrijven;

      b. het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens
      de [Wet politiegegevens][ref1] bepaalde;

      c. degene die overeenkomstig [artikel 9][ref2] een melding heeft gedaan, in afwijking van
      [artikel 4, tweede lid][ref3], berichten over de afdoening van de melding.

      d. het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen, heling van geld en financieren van
      terrorisme en naar de verbetering van de methoden om witwassen, heling van geld en financieren van terrorisme te
      voorkomen en op te sporen;

      e. het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen, heling van geld en financieren van terrorisme;

      f. het geven van voorlichting omtrent de voorkoming en opsporing van witwassen, heling van geld en financieren van
      terrorisme aan:

      1°. de bedrijfstakken en beroepsgroepen;

      2°. de personen en instellingen die krachtens [artikel 17b][ref4] met het toezicht op de naleving van de
      [artikelen 9][ref5], [10, tweede lid][ref6], [17u][ref7] en [19][ref8] zijn belast;

      3°. het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;

      4°. het publiek;

      g. het geven van inlichtingen aangaande het meldgedrag van de meldende instellingen aan de personen en
      instellingen die krachtens [artikel 17b][ref9] met het toezicht op de naleving van de [artikelen 9][ref10],
      [10, tweede lid][ref11], [17u][ref12] en [19][ref13] zijn belast;

      h. het onderhouden van contacten met buitenlandse van overheidswege aangewezen politiële- of niet-politiële
      instanties die een vergelijkbare taak hebben als het meldpunt;

      i. het jaarlijks uitbrengen van een verslag van zijn werkzaamheden en van zijn voornemens voor het komende jaar aan
      Onze Minister van Justitie, en het ter kennis brengen van dit verslag van Onze Minister van Financiën.


