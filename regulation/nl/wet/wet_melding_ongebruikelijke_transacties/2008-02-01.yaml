  - number: 17p
    text: |-
      1 De bevoegdheid om op grond van [artikel 17m][ref1] een feit ter openbare kennis te brengen vervalt indien ter
      zake van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen,
      dan wel een strafbeschikking is uitgevaardigd.

      2 Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 17m][ref2] vervalt, indien Onze
      Minister van Financiën het feit reeds ter openbare kennis heeft gebracht.


