  - number: 17s
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel87
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel17s
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:7
  - number: 17t
    text: |-
      1 De bevoegdheden die Onze Minister van Financiën op grond van dit hoofdstuk heeft, kunnen bij algemene maatregel
      van bestuur worden overgedragen aan een of meer rechtspersonen die ingevolge [artikel 17b, eerste lid][ref1],
      zijn aangewezen. Alsdan gelden de verplichtingen op grond van dit hoofdstuk jegens Onze Minister van Financiën als
      verplichtingen jegens de desbetreffende rechtspersoon.

      2 Aan de overdracht, bedoeld in het eerste lid, kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel17b
    url: https://wetten.overheid.nl/BWBR0006331/2008-02-01#Artikel17t
    references:
      - id: ref1
