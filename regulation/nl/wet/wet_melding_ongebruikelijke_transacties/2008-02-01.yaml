  - number: 17d
    text: |-
      1 Onze Minister van Financiën kan een bestuurlijke boete opleggen ter zake van overtreding van
      de [artikelen 9][ref1], [10, tweede lid][ref2], [17u][ref3] en [19][ref4] van deze wet en van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref5].

      2 Het eerste lid is niet van toepassing op degene die, in geval van bezwaren tegen diens handelen of nalaten in de
