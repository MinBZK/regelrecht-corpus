    text: |-
      Op het tijdstip van inwerkingtreding van deze wet worden, in afwijking van het bepaalde in
      [artikel 8, eerste lid][ref1], door Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk, gehoord
      de instanties bedoeld in [artikel 16, onder ][ref2], zo nodig per daarbij te onderscheiden categorieën transacties,
      voor een termijn van ten hoogste zes maanden, de indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of
      een transactie moet worden aangemerkt als een ongebruikelijke transactie.


