---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_melding_ongebruikelijke_transacties
regulatory_layer: WET
publication_date: '2009-12-10'
valid_from: '2002-01-01'
bwb_id: BWBR0006331
url: https://wetten.overheid.nl/BWBR0006331/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan de Richtlijn van de Raad
    van de Europese Gemeenschappen van 10 juni 1991 tot voorkoming van het gebruik van het financiële stelsel voor
    het witwassen van geld (91/308/EEG), alsmede dat het wenselijk is de aanbevelingen 15, 16, 17, 20, 26, 28 en 32
    van de Financial Action Task Force on money laundering van 30 mei 1990 in de Nederlandse wet- en regelgeving te
    implementeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a
    text: 'dienst: het in of vanuit Nederland:'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.1°
    text: in bewaring nemen van effecten, bankbiljetten, munten, muntbiljetten, edele metalen en andere waarden;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.2°
    text: |-
      openstellen van een rekening waarop een saldo in geld, effecten, edele metalen of andere waarden kan worden
      aangehouden;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.3°
    text: verhuren van een safe-loket;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.4°
    text: |-
      verrichten van een uitbetaling ter zake van het verzilveren van coupons of vergelijkbare stukken van obligaties of
      vergelijkbare waardepapieren;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.5°
    text: |-
      sluiten van een levensverzekeringsovereenkomst als bedoeld in[ artikel 1, onder ][ref1], alsmede het daarbij
      verlenen van bemiddeling;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 1.1.a.6°
    text: doen van een uitkering uit hoofde van een levensverzekeringsovereenkomst als bedoeld sub 5°;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.7°
    text: |-
      crediteren of debiteren dan wel doen crediteren of debiteren van een rekening waarop een saldo in geld, effecten,
      edele metalen of andere waarden kan worden aangehouden;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.8°
    text: wisselen van guldens, euro’s of vreemde valuta;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.9°
    text: |-
      verkopen, alsmede het verlenen van bemiddeling bij verkoop, van voertuigen, schepen, kunstvoorwerpen,
      antiquiteiten, edelstenen, edele metalen, sieraden, juwelen dan wel andere bij algemene maatregel van bestuur aan
      te wijzen zaken van grote waarde.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.a.10°
    text: verlenen van andere bij algemene maatregel van bestuur aan te wijzen diensten;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.b
    text: |-
      cliënt: de natuurlijke persoon of rechtspersoon aan of ten behoeve van wie een dienst wordt verleend, alsmede in
      geval van een dienst als bedoeld in het eerste lid, onder *a*, sub 5° en 6°, degene die de premie betaalt alsmede
      degene ten behoeve van wie de uitkering wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.c
    text: |-
      transactie: een handeling of samenstel van handelingen van of ten behoeve van een cliënt in verband met het afnemen
      of het verlenen van één of meer diensten;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: 1.1.d
    text: |-
      ongebruikelijke transactie: een transactie die aan de hand van de ingevolge [artikel 8][ref1] bepaalde indicatoren
      als zodanig wordt aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel8
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '8'
        hoofdstuk: III
  - number: 1.1.e
    text: |-
      melding: een melding als bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '9'
        hoofdstuk: III
  - number: 1.1.f
    text: |-
      meldpunt: het meldpunt bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
        hoofdstuk: II
  - number: 1.1.g
    text: |-
      commissie: de commissie bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel14
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '14'
        hoofdstuk: IV
  - number: '1.2'
    text: |-
      De krachtens het eerste lid, onderdeel 10°, aan te wijzen diensten hebben geen betrekking op werkzaamheden van een
      advocaat of een notaris betreffende de bepaling van de rechtspositie van een cliënt, diens vertegenwoordiging en
      verdediging in rechte, het geven van advies voor, tijdens en na een rechtsgeding, of het geven van advies over het
      instellen of vermijden van een rechtsgeding.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      De voordracht voor een krachtens het eerste lid, onderdeel 9° of 10°, vast te stellen algemene maatregel van
      bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel1
  - number: '2'
    text: Er is een Meldpunt Ongebruikelijke Transacties.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel2
  - number: '3'
    text: 'Het meldpunt heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.a
    text: |-
      het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of deze
      gegevens van belang kunnen zijn voor de voorkoming en opsporing van misdrijven;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.b
    text: |-
      het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens de
      [Wet politieregisters][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: 3.c
    text: |-
      degene die overeenkomstig [artikel 9][ref1] een melding heeft gedaan, in afwijking van artikel 4, tweede lid, met
      het oog op de juiste naleving van de meldingsplicht, berichten over de afdoening van de melding. In dat geval wordt
      slechts meegedeeld of verstrekking heeft plaatsgevonden overeenkomstig onderdeel *b*;


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '9'
        hoofdstuk: III
  - number: 3.d
    text: |-
      het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen en heling van geld en naar de
      verbetering van de methoden om witwassen en heling van geld te voorkomen en op te sporen;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.e
    text: |-
      het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen en heling van geld;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.f
    text: 'het geven van voorlichting omtrent de voorkoming en opsporing van witwassen en heling van geld:'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.f.1°
    text: aan de bedrijfstakken en beroepsgroepen;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.f.2°
    text: aan het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.f.3°
    text: aan het publiek;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.g
    text: |-
      het onderhouden van contacten met buitenlandse van overheidswege aangewezen politiële- of niet-politiële instanties
      die een vergelijkbare taak hebben als het meldpunt;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: 3.h
    text: |-
      het jaarlijks uitbrengen van een verslag van zijn werkzaamheden en van zijn voornemens voor het komende jaar aan
      Onze Minister van Justitie, en het ter kennis brengen van dit verslag van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het meldpunt houdt een register. Het register is een register in de zin van de [Wet politieregisters][ref1]. De
      Minister van Justitie is beheerder van het register.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: '4.2'
    text: |-
      De gegevensverstrekking uit het register op grond van de [Wet politieregisters][ref1] vindt slechts plaats met het
      oog op de voorkoming en opsporing van misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: '5'
    text: De algemene leiding, de organisatie en het beheer van het meldpunt berusten bij Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel5
  - number: '6'
    text: |-
      Benoeming, schorsing en ontslag van het hoofd van het meldpunt geschiedt bij koninklijk besluit op voordracht van
      Onze Minister van Justitie in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën het budget en de sterkte van
      het meldpunt.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Door Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk worden, na overleg met het meldpunt
      zo nodig per daarbij te onderscheiden categorieën transacties, voor een termijn van ten hoogste zes maanden, de
      indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie moet worden aangemerkt als een
      ongebruikelijke transactie.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      De indicatoren bedoeld in het vorige lid blijven na afloop van de in dat lid genoemde termijn van kracht, indien
      deze binnen deze termijn worden goedgekeurd bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een ieder die beroeps- of bedrijfsmatig een dienst verleent, is verplicht een daarbij verrichte of voorgenomen
      ongebruikelijke transactie onverwijld te melden aan het meldpunt.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
  - number: '9.2'
    text: 'Een melding bevat, voor zover mogelijk, de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
  - number: 9.2.a
    text: de identiteit van de cliënt;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
  - number: 9.2.b
    text: de aard en het nummer van het identiteitsbewijs van de cliënt;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
  - number: 9.2.c
    text: de aard, het tijdstip en de plaats van de transactie;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
  - number: 9.2.d
    text: |-
      de omvang en bij een dienst bedoeld in [artikel 1, eerste lid, onder a, sub 7°][ref1], de bestemming en de
      herkomst van de bij de transactie betrokken gelden, effecten, edele metalen of andere waarden;


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel1
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '1'
        hoofdstuk: I
  - number: 9.2.e
    text: de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
  - number: 9.2.f
    text: |-
      bij een dienst als bedoeld in [artikel 1, eerste lid, onder a, sub 9°][ref1]: een omschrijving van de
      desbetreffende zaken van grote waarde;


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel1
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '1'
        hoofdstuk: I
  - number: 9.2.g
    text: aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Degene die een dienst als bedoeld in [artikel 1, eerste lid, onder a][ref1], verleent is verplicht de gegevens,
      bedoeld in het tweede lid, op toegankelijke wijze te bewaren gedurende vijf jaar na het tijdstip van het doen van
      de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel1
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '1'
        hoofdstuk: I
  - number: '10.1'
    text: |-
      Het meldpunt is bevoegd bij degene die een melding heeft gedaan, alsmede bij degene die door het verlenen van een
      dienst als bedoeld in [artikel 1, eerste lid, onder a, sub 7°][ref1], bij een transactie is betrokken waarover
      het meldpunt gegevens heeft verzameld, nadere gegevens of inlichtingen te vragen, teneinde te kunnen beoordelen of
      verzamelde gegevens dienen te worden verstrekt op grond van zijn taak bedoeld in [artikel 3, onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel3
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006331
        artikel: '3'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      Degene aan wie overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, is verplicht deze aan
      het meldpunt schriftelijk, alsmede in spoedeisende gevallen mondeling, te verstrekken binnen de door het meldpunt
      gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Het meldpunt kan nadere regels stellen omtrent de wijze waarop een melding moet worden gedaan, respectievelijk
      gegevens en inlichtingen, gevraagd krachtens [artikel 10, eerste lid][ref1], moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel10
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '10'
        hoofdstuk: III
  - number: '12.1'
    text: |-
      Gegevens of inlichtingen die in overeenstemming met de[ artikelen 9][ref1] of [10][ref2] zijn verstrekt, kunnen
      niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging wegens verdenking van,
      of als bewijs ter zake van een telastelegging wegens, overtreding van het bepaalde in de[ artikelen 416][ref3],
      [417][ref4], [417 ](onbekend), [420](onbekend), [420](onbekend) of [420](onbekend) door degene die deze gegevens of
      inlichtingen heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel416
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel417
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006331
        artikel: '10'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '416'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '417'
  - number: '12.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de persoon die werkzaam is voor degene die in overeenstemming
      met de[ artikelen 9][ref1] of [10][ref2] gegevens of inlichtingen heeft verstrekt en die daaraan heeft meegewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel10
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006331
        artikel: '10'
        hoofdstuk: III
  - number: '13'
    text: |-
      Degene die tot een melding op de voet van [artikel 9][ref1] is overgegaan, is niet aansprakelijk voor schade die
      een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat gelet op alle feiten en omstandigheden in
      redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '9'
        hoofdstuk: III
  - number: '14'
    text: Er is een Begeleidingscommissie voor het meldpunt.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel14
  - number: '15'
    text: 'De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel15
  - number: 15.a
    text: het meldpunt in zijn functioneren te begeleiden;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel15
  - number: 15.b
    text: het ter beschikking stellen aan het meldpunt van haar kennis en deskundigheid;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel15
  - number: 15.c
    text: |-
      het desgevraagd of uit eigen beweging adviseren van Onze Minister van Justitie of Onze Minister van Financiën over
      onder meer:
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel15
  - number: 15.c.1°
    text: de wijze waarop het meldpunt zijn taak verricht;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel15
  - number: 15.c.2°
    text: |-
      de vaststelling van de indicatoren bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel8
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '8'
        hoofdstuk: III
  - number: 15.c.3°
    text: de effectiviteit van de meldingsplicht.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel15
  - number: '16.1'
    text: 'De commissie bestaat uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: 16.1.a
    text: Onze Minister van Justitie;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: 16.1.b
    text: Onze Minister van Financiën;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: 16.1.c
    text: de bedrijfstakken en beroepsgroepen die onder de werking van deze wet vallen;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: 16.1.d
    text: de toezichthoudende autoriteiten voor de bedrijfstakken die onder de werking van deze wet vallen;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: 16.1.e
    text: de Economische Controledienst;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: 16.1.f
    text: het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: 16.1.g
    text: de politie.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      De leden van de commissie worden op voordracht van de in het eerste lid bedoelde instanties door Onze Minister
      van Justitie benoemd voor drie jaren. Zij kunnen éénmaal worden herbenoemd. Bij de samenstelling van de commissie
      streeft Onze Minister van Justitie naar een evenwichtige verdeling van de vertegenwoordigde instanties.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: '16.3'
    text: Een vertegenwoordiger van Onze Minister van Justitie bekleedt het voorzitterschap van de commissie.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: '16.4'
    text: De commissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel16
  - number: '17'
    text: |-
      De instellingen die met het toezicht op financiële instellingen zijn belast, lichten, in afwijking van eventuele
      geheimhoudingsbepalingen in de op die instellingen toepasbare andere wetten, het meldpunt in, indien zij bij de
      uitoefening van hun taak feiten ontdekken die duiden op witwassen of heling van geld.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel17
  - number: 17a
    text: |-
      De Nederlandsche Bank N.V. licht, in afwijking van
      [artikel 8 van de Wet financiële betrekkingen buitenland 1994][ref1], het meldpunt in indien zij bij de
      uitoefening van haar taak op grond van die wet feiten ontdekt die duiden op witwassen of heling van geld.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel8
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '8'
  - number: 17b.1
    text: |-
      Met het toezicht op de naleving van [artikel 9][ref1] kunnen worden belast de bij besluit van onze Minister van
      Financiën, in overeenstemming met onze Minister van Justitie, aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '9'
        hoofdstuk: III
  - number: 17b.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel17b
  - number: '18'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult of heeft vervuld verboden van gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt
      of ontvangen, verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de
      uitoefening van zijn taak of door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      Degene die ingevolge [artikel 9][ref1] een melding doet of die ingevolge [artikel 10][ref2] nadere gegevens of
      inlichtingen verstrekt, is verplicht tot geheimhouding daarvan, behoudens voor zover uit de doelstelling van deze
      wet de noodzaak tot bekendmaking voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel10
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006331
        artikel: '10'
        hoofdstuk: III
  - number: '19.2'
    text: |-
      Degene die ingevolge [artikel 3, onder ][ref1], gegevens of inlichtingen verkrijgt, is verplicht tot geheimhouding
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel3
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '3'
        hoofdstuk: II
  - number: '20'
    text: |-
      Op het tijdstip van inwerkingtreding van deze wet worden, in afwijking van het bepaalde in
      [artikel 8, eerste lid][ref1], door Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk, gehoord
      de instanties bedoeld in [artikel 16, onder ][ref2], zo nodig per daarbij te onderscheiden categorieën transacties,
      voor een termijn van ten hoogste zes maanden, de indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of
      een transactie moet worden aangemerkt als een ongebruikelijke transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel16
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006331
        artikel: '16'
        hoofdstuk: IV
  - number: '23'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel23
  - number: '24'
    text: 'Deze wet kan worden aangehaald als: Wet melding ongebruikelijke transacties.'
    url: https://wetten.overheid.nl/BWBR0006331/2002-01-01#Artikel24
