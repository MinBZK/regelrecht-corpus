preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het vanuit het oogpunt van de volksgezondheid noodzakelijk is
    voorzieningen te treffen ter afwending van de gevaren die voortvloeien uit het optreden van infectieziekten bij
    mensen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. hoofdinspecteur: de hoofdinspecteur van het desbetreffende onderdeel van het Staatstoezicht op de
      volksgezondheid;

      c. directeur: de directeur van de gemeentelijke gezondheidsdienst of, indien deze geen arts is, een door de
      directeur aangewezen arts die in dienst is van de gemeentelijke gezondheidsdienst;

      d. laboratorium: een laboratorium waar van het menselijk lichaam afgescheiden stoffen worden onderzocht ten behoeve
      van de diagnostiek van infectieziekten;

      e. gebouw: elk bouwwerk, vaar- of voertuig, dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk
      met wanden omsloten ruimte vormt, met uitzondering van bouwwerken ten behoeve van de belijdenis van godsdienst
      of levensovertuiging;

      f. waren: eetwaren, waaronder tevens worden begrepen kauwpreparaten, drinkwaren alsmede andere roerende
      zaken, voorzover gebruikt in de sfeer van de particuliere huishouding of van een krachtens de Warenwet daarmee
      gelijkgestelde andere huishouding;

      g. infectieziekten: de infectieziekten, genoemd in [artikel 2][ref1];

      h. groep A: de infectieziekten, genoemd in [artikel 2, onder a][ref2];

      i. groep B: de infectieziekten, genoemd in [artikel 2, onder b][ref3];

      j. groep C: de infectieziekten, genoemd in [artikel 2, onder c][ref4];

      k. pokken: de ziekte bedoeld in [artikel 2 van de Quarantainewet][ref5];

      l. persoon in de eerste ring: persoon, niet zijnde een patiënt lijdend aan een infectieziekte behorend tot groep A
      of groep B, die:

      1º. gedurende twee of meer minuten gezichtscontact op een afstand van minder dan twee meter met een zodanige
      patiënt heeft gehad;

      2º. gedurende twee of meer uren met een zodanige patiënt in dezelfde ruimte heeft doorgebracht;

      3º. is blootgesteld aan de opzettelijke verspreiding van een infectieziekte behorend tot groep A of groep B;

      4º. met de verzorging van een zodanige patiënt belast is geweest;

      m. persoon in de tweede ring: persoon, niet zijnde een zodanige patiënt of een persoon in de eerste ring, met
      gezins- of daarmee vergelijkbare contacten met een persoon in de eerste ring;

      n. medisch toezicht: medisch toezicht op één of meer personen in de eerste ring, met het doel om bij hen zo spoedig
      mogelijk de eerste klinische symptomen van een infectieziekte behorend tot groep A of groep B op te merken;

      o. afzondering: verblijf van een persoon die mogelijk besmet is met een infectieziekte behorend tot groep A of
      groep B in een door de burgemeester aangewezen gebouw of in een aantal aangewezen ruimten daarbinnen, in verband
      met de bestrijding van de gevaren van die ziekte;

      p. waarneming: medische beoordeling van een in afzondering geplaatst persoon om te bezien of hij met een
      infectieziekte behorend tot groep A of groep B is geïnfecteerd en dientengevolge ziekteverschijnselen vertoont.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
