  - number: '4'
    text: |-
      1 De arts die bij een door hem onderzocht persoon een infectieziekte uit groep A vermoedt of vaststelt, meldt dit
      zo spoedig mogelijk, maar in ieder geval binnen 24 uur, aan de directeur.

      2 De arts die bij een door hem onderzocht persoon een infectieziekte uit groep B vaststelt, meldt dit binnen 24 uur
      aan de directeur.

      3 De arts die gegronde redenen heeft om bij een persoon een infectieziekte uit groep B te vermoeden, meldt dat
      vermoeden binnen 24 uur aan de directeur, indien

      a. die persoon weigert het onderzoek te ondergaan dat noodzakelijk is ter vaststelling van die ziekte en

      b. daardoor ernstig gevaar voor de volksgezondheid door de verspreiding van die infectieziekte kan ontstaan.

      4 De arts doet de in de voorgaande drie leden bedoelde meldingen aan de directeur van de gemeente waarin hij zijn
      praktijk heeft.

      5 Indien de melding betrekking heeft op een persoon die zijn verblijfplaats heeft in een andere gemeente, geeft de
      directeur deze melding terstond door aan de directeur van de verblijfplaats van de betrokkene.

      6 In afwijking van het eerste en tweede lid treedt de meldingsplicht ten aanzien van bij ministeriële regeling
      aan te wijzen infectieziekten uit groep A of groep B in of buiten werking met ingang van een daarbij te bepalen
      tijdstip, met inachtneming van daarbij te stellen regels.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel4
  - number: '5'
    text: |-
      De melding, bedoeld in [artikel 4][ref1], bevat de volgende gegevens:

      a. de naam, de voornaam, het adres, de woonplaats, het geslacht, de geboortedatum en de verblijfplaats van de
      betrokken persoon;

      b. de infectieziekte, alsmede de eerste ziektedag, de vaccinatietoestand, het gebruik van chemoprofylaxe, de
      mogelijke bron of plaats van besmetting, de datum van vermoeden of vaststelling, de wijze van vaststelling van die
      infectieziekte en

      c. zo nodig of de betrokken persoon dan wel een persoon in zijn directe omgeving beroeps- of bedrijfsmatig
      betrokken is bij de behandeling van eet- of drinkwaren of bij de behandeling, verpleging of verzorging van andere
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 Het hoofd van het laboratorium meldt de vaststelling van een verwekker van een infectieziekte uit groep C aan de
      directeur van de gemeente waarin de arts die het onderzoek bij het laboratorium heeft aangevraagd, zijn praktijk
      heeft, onder vermelding van de naam van die arts.

      2 Op verzoek van de directeur verstrekt de arts die het onderzoek bij het laboratorium heeft aangevraagd, de
      volgende gegevens omtrent de persoon en de infectieziekte waarop de laboratoriummelding betrekking heeft:

      a. het geslacht, het geboortejaar en het beroep van de betrokken persoon;

      b. de infectieziekte, de vaccinatietoestand, het gebruik van chemoprofylaxe en de mogelijke bron of plaats van
      besmetting.

      3 De arts verstrekt andere gegevens uitsluitend indien de betrokkene daarvoor toestemming geeft.

      4 Onze Minister kan nadere regels stellen omtrent de wijze waarop en de termijn waarbinnen de melding, bedoeld in
      het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel6
  - number: '7'
    text: |-
      1 Het hoofd van een instelling waar voor infectieziekten kwetsbare populaties verblijven of samenkomen voor een of
      meer dagdelen per etmaal stelt de directeur van de gemeente, waarin de instelling gelegen is, op de hoogte van het
      optreden van een ongewoon aantal zieken met diarree, geelzucht, huidaandoeningen of andere ernstige aandoeningen
      van vermoedelijk infectueuze aard in de desbetreffende populatie of bij het begeleidend of verzorgend personeel.

      2 Onze Minister kan nadere regels stellen omtrent de wijze waarop en de termijn waarbinnen de berichtgeving
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel7
  - number: '8'
    text: |-
      1 De directeur neemt de persoonsgegevens, die ingevolge de [artikelen 5][ref1], [6][ref2] en [13][ref3] zijn
      verkregen, op in een door hem gehouden registratie.

      2 De directeur bewaart deze gegevens ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel13
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel8
    references:
