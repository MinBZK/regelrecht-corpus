  - number: '30'
    text: |-
      Indien een infectieziekte voorkomt of indien een gegrond vermoeden daarvan bestaat, zijn binnen hun ambtsgebied
      de burgemeester, de directeur en de hoofdinspecteur bevoegd elke plaats te betreden, voor zover dat redelijkerwijs
      voor de vervulling van hun taak op grond van deze wet nodig is. Zo nodig verschaffen zij zich de toegang met behulp
      van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel30
  - number: '31'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene
      die zich onttrekt aan de bij de in de [artikelen 16, eerste lid][ref1], [25, eerste lid][ref2] en
      [26, eerste lid, onder a, b, c en e][ref3], ten aanzien van hem genomen maatregelen dan wel de in
      [artikel 26, eerste lid, onder d][ref4], bedoelde waren onttrekt aan een krachtens dat lid genomen maatregel.

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel26
