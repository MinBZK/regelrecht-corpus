  - number: '35'
    text: |-
      1 De boete wordt opgelegd bij beschikking van de burgemeester.

      2 In de beschikking worden in ieder geval vermeld:

      a. de te betalen geldsom;

      b. de overtreding terzake waarvan de boete wordt opgelegd, alsmede het overtreden wettelijk voorschrift;

      c. de in artikel 34, tweede lid, onder b en c, bedoelde gegevens.

      3 Op verzoek van de persoon, bedoeld in [artikel 32, eerste, tweede of derde lid][ref1], die de beschikking wegens
      zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de burgemeester er zoveel mogelijk zorg
      voor dat de in die beschikking vermelde informatie aan die persoon wordt meegedeeld in een voor hem begrijpelijke
      taal.

      4 De beschikking wordt genomen binnen 12 weken, nadat de directeur het rapport, bedoeld in
      [artikel 34, eerste lid][ref2], heeft opgemaakt.

      5 De bevoegdheid tot het opleggen van een boete vervalt 1 jaar, nadat een overtreding als bedoeld in
      [artikel 32, eerste, tweede lid of derde lid][ref3], is begaan.

      6 De werking van een beschikking als bedoeld in het eerste lid wordt opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.

      7 Onze Minister kan in overeenstemming met de Minister van Justitie beleidsregels stellen met betrekking tot de
      oplegging van boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel35
