  - number: 24a
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op een maatregel als bedoeld in artikel 18a, eerste lid, met dien
      verstande dat:

      a. bevoegd is de rechter waar betrokkene verblijf houdt;

      b. de rechter de betrokkene hoort te zijner verblijfplaats of een andere, door de rechter aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel24a
  - number: '25'
    text: |-
      1 De burgemeester kan een persoon die gevaar oplevert voor de verspreiding van een infectieziekte uit groep A of
      groep B, het verbod opleggen beroeps- of bedrijfsmatig werkzaamheden te verrichten, die een ernstig risico inhouden
      voor de verspreiding van die infectieziekte.

      2 Alvorens een besluit als bedoeld in het eerste lid te nemen hoort de burgemeester de werkgever van de betrokkene,
      tenzij betrokkene hiertegen bezwaar maakt.

      3 De burgemeester heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel25
  - number: '26'
    text: |-
      1 Indien ernstig gevaar dreigt voor de verspreiding van een infectieziekte, kan de burgemeester, om dit gevaar af
      te wenden, de volgende maatregelen nemen:

      a. het sluiten van gebouwen of terreinen dan wel gedeelten daarvan;

      b. het uitvaardigen van een verbod tot het betreden van gebouwen of terreinen dan wel gedeelten daarvan;

      c. het doen ontsmetten van gebouwen dan wel gedeelten daarvan;

      d. het doen ontsmetten of vernietigen van waren;

      e. het geven van voorschriften van technisch-hygiënische aard.

      2 Alvorens de burgemeester een dergelijke maatregel neemt, wint hij het advies van de directeur in.

      3 De burgemeester heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel26
  - number: 26a
    text: |-
      1 Er is een Landelijke Coördinatiestructuur Infectieziektebestrijding, gevestigd te Utrecht.

      2 Deze stelt op verzoek van Onze Minister ter beheersing van de gevaren van één of meer infectieziekten behorende
      tot groep A of groep B een ontwerp voor een Draaiboek tot bestrijding van die ziekten op.

      3 Onze Minister stelt het Draaiboek vast.

      4 Indien voor de bestrijding van een bepaalde infectieziekte een Draaiboek is vastgesteld, vindt de bestrijding
      plaats volgens dat Draaiboek.

      5 De Landelijke Coördinatiestructuur Infectieziektebestrijding geeft aan een vastgesteld Draaiboek op passende
      wijze bekendheid aan gemeenten, gemeentelijke gezondheidsdiensten en de hoofdinspecteur.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel26a
  - number: 26b
    text: |-
      1 Onze Minister kan de burgemeester aanwijzingen geven ten aanzien van de wijze waarop een ernstige infectieziekte
      van hoge letaliteit en besmettelijkheid behorende tot groep A of groep B wordt bestreden.

      2 De hoofdinspecteur kan de directeur aanwijzingen geven ten aanzien van de hem bij of krachtens § 2a van Hoofdstuk
      III en Hoofdstuk IVA gestelde taken.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel26b
  - number: 26c
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent waarneming, afzondering, isolatie en
      onderzoek bij bestrijding van infectieziekten behorende tot groep A of groep B.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel26c
  - number: 26d
    text: |-
      1 In het belang van een goede uitvoering van hoofdstuk III, paragraaf 2a, kunnen bij algemene maatregel van bestuur
      nadere, zo nodig van deze wet afwijkende, regels worden gesteld.

      2 Indien als gevolg van buitengewone omstandigheden, de volksgezondheid betreffende, de totstandkoming van een
      algemene maatregel van bestuur als bedoeld in het eerste lid niet kan worden afgewacht, kunnen de daar bedoelde
      regels bij ministeriële regeling worden gesteld.

      3 De ministeriële regeling, bedoeld in het tweede lid, vervalt uiterlijk zes maanden na haar inwerkingtreding.

      4 Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur,
      waarin van deze wet afwijkende regels worden gesteld, dan wel van een krachtens het tweede lid vastgestelde
      ministeriële regeling met zodanige regels, wordt een voorstel van wet tot regeling van het betrokken onderwerp
      zo spoedig mogelijk bij de Staten-Generaal ingediend. Indien het voorstel wordt ingetrokken of indien een van de
      beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur
      dan wel de ministeriële regeling onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan wordt de algemene
      maatregel van bestuur dan wel de ministeriële regeling ingetrokken op het tijdstip van inwerkingtreding van die
      wet.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel26d
  - number: '27'
    text: |-
      1 Het gemeentebestuur draagt de kosten van de maatregelen die krachtens deze wet worden genomen. Ook draagt het
      gemeentebestuur, onverminderd het tweede lid, de kosten van door hem toegekende tegemoetkomingen aan hen, die door
      de maatregelen, bedoeld in de [artikelen 14][ref1], [25][ref2] en [26][ref3], inkomsten derven.

      2 Het gemeentebestuur is bevoegd de kosten verbonden aan de maatregelen, bedoeld in de [artikelen 14][ref4],
      [16][ref5], [25][ref6], en [26][ref7], te verhalen op de persoon ten aanzien van wie een maatregel is getroffen.
      [Artikel 229 van de Gemeentewet][ref8] is van overeenkomstige toepassing.


