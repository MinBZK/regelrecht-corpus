        hoofdstuk: III
        paragraaf: '2'
  - number: '20'
    text: |-
      1 Indien de officier van justitie van oordeel is dat aan de voorwaarden voor de opneming ter isolatie, bedoeld in
      [artikel 14][ref1], of het onderzoek, bedoeld in [artikel 16, derde lid][ref2], is voldaan, doet hij uiterlijk op
      de dag na de datum van ontvangst van de beschikking een verzoek tot een machtiging tot voortzetting van de isolatie
      of tot het onderzoek.

      2 De officier van justitie deelt aan de betrokkene, de burgemeester en het ziekenhuis, schriftelijk mede dat hij
      het verzoek heeft gedaan of dat hij heeft besloten geen verzoek te doen.

      3 Het besluit geen verzoek te doen neemt de officier van justitie niet dan nadat hij het advies van de
      hoofdinspecteur heeft ingewonnen.

      4 Met het besluit geen verzoek te doen, vervalt de beschikking tot opneming ter isolatie, bedoeld in
      [artikel 14][ref3], of de beschikking tot onderzoek, bedoeld in [artikel 16, derde lid][ref4], van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
