  - number: '21'
    text: |-
      1 Alvorens op het verzoek van de officier van justitie te beschikken, hoort de rechter degene ten aanzien van wie
      de maatregel is gevorderd.

      2 De rechter hoort de betrokkene te zijner verblijfplaats.

      3 De rechter kan zich laten voorlichten, getuigen en deskundigen oproepen en onderzoek door deskundigen bevelen.

      4 De rechter stelt de raadsman in de gelegenheid zijn zienswijze kenbaar te maken.

      5 De rechter beslist binnen drie dagen, te rekenen vanaf de dag na die van het instellen van de vordering.

      6 Tegen de beschikking staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel21
  - number: '22'
    text: |-
      1 De ter isolatie opgenomen persoon kan de rechter verzoeken de maatregel op te heffen. In het geval de betrokkene
      buiten staat is dit verzoek te doen, komt gelijke bevoegdheid toe aan diens raadsman.

      2 [Artikel 21, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.

      3 De rechter kan het verzoek zonder toepassing van [artikel 21][ref2] afwijzen, indien geen nieuwe feiten of
      omstandigheden worden aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel21
