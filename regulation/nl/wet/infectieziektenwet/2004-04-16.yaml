    text: |-
      Ingeval ingevolge het bij deze wet bepaalde een verzoekschrift als bedoeld in [artikel 22, eerste lid][ref1],
      of [23, eerste lid][ref2], wordt ingediend dan wel een van de daartoe bevoegde personen beroep instelt, behoeft de
      indiening van het verzoekschrift niet bij procureur te geschieden.


