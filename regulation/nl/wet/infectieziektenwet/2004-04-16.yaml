  - number: '24'
    text: |-
      1 Indien degene ten aanzien van wie een beschikking tot opneming ter isolatie als bedoeld in [artikel 14][ref1] of
      tot onderzoek als bedoeld in [artikel 16][ref2] is genomen nadeel heeft geleden doordat de rechter of de officier
      van justitie een der bepalingen vervat in dit hoofdstuk niet in acht heeft genomen, kent de rechter deze op diens
      verzoek een naar billijkheid vast te stellen schadevergoeding toe ten laste van de Staat.

      2 Het verzoek kan worden ingediend als een zelfstandig verzoek bij het verweerschrift als bedoeld in
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3], of bij een desbetreffend
      verzoekschrift ter gelegenheid van het verhoor van de betrokkene, dan wel, bij een afzonderlijk verzoekschrift,
      binnen drie maanden te rekenen vanaf de dag waarop de betrokkene redelijkerwijs bekend kon zijn met de schending
      van het voorschrift waarop zijn verzoek betrekking heeft.

      3 Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van de betrokkene is
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref4] van overeenkomstige toepassing.


