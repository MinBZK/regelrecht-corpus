  - number: '19'
    text: |-
      1 De burgemeester stelt de officier van justitie terstond op de hoogte van de beschikking tot opneming
      ter isolatie, bedoeld in [artikel 14][ref1], en van de beschikking tot het onderzoek, bedoeld in
      [artikel 16, derde lid][ref2]. Bevoegd is de rechter van de plaats waar het aangewezen ziekenhuis is gelegen.

      2 Zo spoedig mogelijk nadat de beschikking is gegeven, doch in elk geval niet later dan de volgende dag, zendt de
      burgemeester de officier van justitie een afschrift van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel19
