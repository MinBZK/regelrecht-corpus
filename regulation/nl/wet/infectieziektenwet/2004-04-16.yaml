  - number: '2'
    text: |-
      Deze wet is van toepassing op de navolgende infectieziekten:

      a. kinderverlamming; pokken; severe acute respiratory syndrome;

      b. bacillaire dysenterie; botulisme; buiktyfus; cholera; de ziekte van Creutzfeldt-Jakob; difterie; febris
      recurrens; hepatitis A, B en C; hondsdolheid; kinkhoest; legionellose; mazelen; meningokokkose; paratyfus A, B en
      C; pest; tuberculose; virale hemorrhagische koorts; vlektyfus; acute voedselvergiftiging of voedselinfectie, voor
      zover vastgesteld:

      1°. bij een persoon, werkzaam in de levensmiddelen- of horecasector, dan wel bij een persoon, beroepsmatig
      betrokken bij de behandeling, verpleging of verzorging van andere personen of

      2°. door één arts bij twee of meer personen die binnen een tijdvak van 24 uur hetzelfde gegeten of gedronken
      hebben;

      c. brucellose; gele koorts; leptospirose; malaria; miltvuur; ornithose/psittacose; O-koorts; rodehond, trichinose
      alsmede ziekte veroorzaakt door enterohaemorrhagische E. coli.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel2
  - number: '3'
    text: |-
      1 Indien het belang van de volksgezondheid zulks vordert, kan Onze Minister, in overeenstemming met het gevoelen
      van de ministerraad, deze wet, desgewenst met uitzondering van artikel 14, eerste lid, en onder aanduiding van de
      groep waartoe de ziekte gerekend wordt, van toepassing verklaren op:

      a. een infectieziekte die niet is opgenomen in [artikel 2][ref1];

      b. een ziektebeeld met een volgens de stand van de wetenschap onbekende oorzaak, waarvan aannemelijk is dat deze
      een epidemisch karakter zal hebben.

      2 Indien het belang van de volksgezondheid zulks vordert, kan Onze Minister, in overeenstemming met het gevoelen
      van de ministerraad, een infectieziekte uit groep B verplaatsen naar groep A of een infectieziekte uit groep C
      verplaatsen naar groep B.

      3 Na het tot stand komen van een krachtens het eerste of tweede lid vastgestelde ministeriële regeling wordt binnen
      acht weken een voorstel van wet tot incorporatie van die ministeriële regeling aan de Tweede Kamer der Staten-
      Generaal gezonden. Indien het voorstel van wet wordt ingetrokken of door een der Kamers der Staten-Generaal wordt
      verworpen, wordt de ministeriële regeling onverwijld ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel3
