  - number: '33'
    text: |-
      Degene jegens wie een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat
      hem wegens een overtreding als bedoeld in [artikel 32, eerste, tweede of derde lid][ref1], een boete zal worden
      opgelegd, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      voordat hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '34'
    text: |-
      1 Indien de directeur vaststelt dat een overtreding als bedoeld in [artikel 32, eerste, tweede of derde lid][ref1],
      is begaan, maakt hij daarvan binnen zes weken een rapport op.

      2 In het rapport worden in ieder geval vermeld:

      a. de overtreding, alsmede het overtreden wettelijk voorschrift;

      b. een aanduiding van de periode waarin de overtreding is begaan;

      c. de infectieziekte die niet is gemeld.

      3 Het rapport wordt toegezonden aan de burgemeester.

      4 Een afschrift wordt toegezonden of uitgereikt aan de in [artikel 32, eerste, tweede of derde lid][ref2] bedoelde
      persoon.

      5 Op verzoek van de in [artikel 32, eerste, tweede of derde lid][ref3] bedoelde persoon, die het rapport wegens
      zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de burgemeester er zoveel mogelijk zorg
      voor dat de in het rapport vermelde informatie aan die persoon wordt meegedeeld in een voor hem begrijpelijke taal.

      6 In afwijking van [afdeling 4.1.2. van de Algemene wet bestuursrecht][ref4] stelt de burgemeester de in
      [artikel 32, eerste, tweede of derde lid][ref5] bedoelde persoon in de gelegenheid om binnen een redelijke termijn
      naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen.

      7 Indien de in het vorige lid bedoelde persoon zijn zienswijze mondeling naar voren brengt, draagt de burgemeester
      er op verzoek van degene die de Nederlandse taal onvoldoende begrijpt zorg voor dat een tolk wordt benoemd die
      de betrokkene bij het horen kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref5]: https://wetten.overheid.nl/BWBR0009684#Artikel32
