        hoofdstuk: III
        paragraaf: '1'
  - number: '9'
    text: |-
      1 De directeur deelt de ontvangst van een melding als bedoeld in [artikel 4][ref1] zo spoedig mogelijk mee
      aan de burgemeester van de gemeente waar de betrokken persoon zijn woon- of verblijfplaats heeft en aan de
      hoofdinspecteur.

      2 De directeur deelt de ontvangst van een melding als bedoeld in [artikel 6][ref2] binnen een redelijke termijn mee
      aan de burgemeester van de gemeente waarin de arts, die het onderzoek heeft aangevraagd, zijn praktijk heeft en aan
      de hoofdinspecteur.

      3 De directeur deelt de ontvangst van een bericht als bedoeld in [artikel 7][ref3] binnen een redelijke termijn mee
      aan de burgemeester van de gemeente waarin de instelling gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel7
