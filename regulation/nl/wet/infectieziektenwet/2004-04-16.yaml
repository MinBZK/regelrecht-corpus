  - number: '10'
    text: |-
      Na een melding als bedoeld in [artikel 4][ref1] verstrekt de directeur de volgende gegevens aan de hoofdinspecteur:

      a. de infectieziekte, alsmede de eerste ziektedag, de vaccinatietoestand, het gebruik van chemoprofylaxe, de
      mogelijke bron of plaats van besmetting, zo nodig met inbegrip van de daaruit voortgekomen gevallen, alsmede de
      datum van vermoeden of vaststelling van die infectieziekte en

      b. het geslacht en het geboortejaar van de betrokken persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel10
    references:
