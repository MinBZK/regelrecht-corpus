  - number: '29'
    text: |-
      1 Onverminderd het tweede lid is de hoofdinspecteur belast met het toezicht op de naleving van het bij of krachtens
      deze wet bepaalde.

      2 De directeur is belast met het toezicht op de naleving van de [artikelen 4, eerste, tweede en derde lid][ref1],
      [6, eerste lid][ref2], en [13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel13
