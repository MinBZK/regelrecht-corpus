  - number: '32'
    text: |-
      1 Aan de arts die handelt in strijd met de [artikelen 4, eerste, tweede of derde lid][ref1],
      [6, tweede of derde lid][ref2], of [13][ref3], kan de burgemeester van de gemeente waarin die arts zijn praktijk
      heeft, een boete opleggen van € 90.

      2 Aan het hoofd van een laboratorium dat handelt in strijd met [artikel 6, eerste lid][ref4], kan de burgemeester
      van de gemeente, waarin de arts die het desbetreffende onderzoek bij het laboratorium heeft aangevraagd zijn
      praktijk heeft, een boete opleggen van € 90.

      3 Aan het hoofd van een instelling die handelt in strijd met [artikel 7, eerste lid][ref5], kan de burgemeester van
      de gemeente, waarin de instelling gelegen is, een boete opleggen van € 90.

      4 De burgemeester legt geen boete op indien de betrokken persoon aannemelijk maakt dat hem van de overtreding geen
      verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
