        artikel: '4'
        hoofdstuk: II
  - number: '11'
    text: |-
      De directeur verstrekt de burgemeester de gegevens, bedoeld in [artikel 5][ref1], die deze nodig heeft voor de
      uitvoering van de hem bij deze wet toegekende bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel5
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '5'
        hoofdstuk: II
  - number: '12'
    text: |-
      1 Alvorens de burgemeester een in dit hoofdstuk omschreven maatregel neemt of intrekt, wint hij het advies van de
      directeur in.

      2 De directeur brengt zijn advies schriftelijk uit. In spoedeisende gevallen kan worden volstaan met een mondeling
      advies, dat zo spoedig mogelijk op schrift wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel12
  - number: '13'
    text: |-
      Op verzoek van de burgemeester verstrekt de behandelend arts van een persoon die naar het oordeel van de
      burgemeester gevaar oplevert voor de overbrenging van een infectieziekte uit groep A of groep B aan de directeur
      de nadere gegevens die noodzakelijk zijn om de aard en de omvang van het gevaar van verspreiding van die
      infectieziekte vast te stellen.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel13
  - number: '14'
    text: |-
      1 De burgemeester kan een persoon terstond ter isolatie in een ziekenhuis doen opnemen, indien:

      a. 1°. hij gegronde redenen heeft om aan te nemen dat de betrokkene lijdt aan een infectieziekte uit groep A,

      2°. ten aanzien van de betrokkene de melding ingevolge [artikel 4, derde lid][ref1], heeft plaatsgevonden, of

      3°. de betrokkene lijdt aan een infectieziekte uit groep A of groep B;

      b. ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte;

      c. dit gevaar niet op andere wijze effectief kan worden afgewend en

      d. de betrokkene niet tot opneming ter isolatie bereid is.

      2 Dit artikel wordt niet toegepast ten aanzien van de navolgende infectieziekten: bacillaire dysenterie; botulisme;
      buiktyfus; cholera; de ziekte van Creutzfeldt-Jakob; hepatitis A, B, of C; kinkhoest; mazelen; meningokokkose;
      paratyfus A, B of C; voedselvergiftiging; voedselinfectie; brucellose; gele koorts; legionellose; leptospirose;
      malaria; miltvuur; ornithose/psittacose; O-koorts; rodehond of trichinose.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
  - number: '15'
    text: |-
      1 De burgemeester doet de beschikking tot opneming ter isolatie aan de betrokkene uitreiken.

      2 De beschikking wordt niet uitgereikt dan nadat de burgemeester voorzien heeft in bijstand van de betrokkene door
      een raadsman, tenzij de betrokkene daartegen bedenkingen heeft.

      3 De burgemeester draagt de tenuitvoerlegging van de beschikking op aan ter zake deskundige personen in dienst van
      de gemeentelijke gezondheidsdienst. Zij kunnen daartoe elke plaats betreden waar de betrokkene zich bevindt, zo
      nodig met behulp van de sterke arm.

      4 In zijn beschikking geeft de burgemeester aan in welk ziekenhuis de opneming ter isolatie ten uitvoer wordt
      gelegd.

      Het ziekenhuis neemt de betrokkene terstond op.

      5 Wanneer redelijkerwijs kan worden aangenomen dat het gevaar, bedoeld in [artikel 14, eerste lid, onder b][ref1],
      is geweken of op minder ingrijpende wijze kan worden afgewend, heft de burgemeester de opneming ter isolatie
      terstond op.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16'
    text: |-
      1 De burgemeester kan een ter isolatie opgenomen persoon door een arts doen onderzoeken indien:

      a. ten gevolge van de infectieziekte onmiddellijk gevaar dreigt voor de gezondheid van derden,

      b. de aard en de omvang van dit gevaar niet op andere wijze dan door onderzoek kunnen worden vastgesteld,

      c. de uitkomst van het onderzoek noodzakelijk is om dit gevaar effectief te kunnen afwenden en

      d. de betrokkene niet bereid is het onderzoek te ondergaan.

      2 Het onderzoek omvat niet meer dan nodig is ter afwending van het gevaar voor derden.

      3 Onderzoek in het lichaam wordt slechts verricht nadat de rechter daartoe een machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel16
  - number: '17'
    text: |-
      1 De burgemeester doet de beschikking tot het onderzoek, bedoeld in [artikel 16][ref1], aan de betrokkene
      uitreiken.

      2 In zijn beschikking geeft de burgemeester aan waaruit het onderzoek bestaat, welke arts het onderzoek verricht en
      binnen welke termijn het onderzoek plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '18'
    text: |-
      1 De opneming ter isolatie wordt ten uitvoer gelegd in een gesloten afdeling van een door Onze Minister aangewezen
      ziekenhuis.

      2 Bij algemene maatregel van bestuur kunnen eisen worden gesteld waaraan de opneming ter isolatie en het onderzoek
      moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18
  - number: 18a
    text: |-
      1 De burgemeester kan besluiten een persoon te onderwerpen aan de maatregelen van afzondering, waarneming of
      medisch toezicht om de verspreiding van ernstige infectieziekten van hoge letaliteit en besmettelijkheid behorende
      tot groep A of groep B tegen te gaan, indien hij van oordeel is dat:

      a. die persoon daadwerkelijk lijdt aan één van de bedoelde infectieziekten, er gegronde redenen zijn om aan te
      nemen dat hij daaraan lijdt, dan wel dat hij recentelijk een dusdanig contact met een lijder of een vermoedelijke
      lijder aan een zodanige infectieziekte heeft gehad dat besmetting van deze persoon met dezelfde ziekte mogelijk is;

      b. ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte; en

      c. die persoon niet tot vrijwillige onderwerping aan een maatregel bereid is.

      2 De burgemeester kan toestaan dat de afzondering onder zo nodig te stellen voorwaarden plaatsvindt in de woning
      van de af te zonderen persoon.

      3 Tijdens de afzondering wordt waarneming verricht. De waarneming wordt verricht onder medische
      verantwoordelijkheid van een door de directeur aangewezen geneeskundige.

      4 De burgemeester geeft in zijn beschikking aan waarop bij de waarneming in ieder geval gelet wordt.

      5 De [artikelen 15, derde en vijfde lid][ref1], en [16, eerste en tweede lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18a
