  - number: 31a
    text: |-
      1 Overtreding van het bepaalde bij of krachtens artikel 18d, 18f, 26c of 26d wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.

      2 Het onbevoegd betreden van een voor isolatie of afzondering aangewezen lokatie wordt gestraft met hechtenis van
      ten hoogste zes maanden of geldboete van de derde categorie.

      3 De in de vorige leden strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel31a
  - number: 31b
    text: |-
      1 Met gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft degene die zich
      onttrekt aan de bij [artikel 14][ref1] ten aanzien van hem genomen maatregel.

      2 Een in afzondering geplaatst persoon die de hem opgelegde verblijfsruimte verlaat wordt gestraft met
      gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie.

      3 De in de vorige leden strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel31b
