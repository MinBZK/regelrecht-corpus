        artikel: 18d
        hoofdstuk: III
        paragraaf: 2a
  - number: 18f
    text: |-
      Op verzoek van de burgemeester verstrekt de behandelend arts van een patiënt of van een persoon in de eerste
      of tweede ring aan de directeur de gegevens die noodzakelijk zijn om de aard en de omvang van het gevaar van
      verspreiding van de infectieziekte vast te stellen.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18f
  - number: 18g
    text: |-
      1 De burgemeester doet de beschikking waarbij hij een in deze paragraaf omschreven maatregel neemt of intrekt aan
      de betrokkene uitreiken.

      2 In zijn beschikking geeft de burgemeester aan hoe en waar de maatregel ten uitvoer wordt gelegd.

      3 De burgemeester instrueert de betrokkene zo spoedig mogelijk bij beschikking over de regels waaraan deze zich te
      houden heeft.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18g
  - number: 18h
    text: |-
      De [artikelen 15, tweede lid][ref1], en [16, derde lid][ref2], zijn niet van toepassing, indien toepassing wordt
      gegeven aan deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18h
