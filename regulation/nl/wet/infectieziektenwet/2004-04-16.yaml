        artikel: 18a
        hoofdstuk: III
        paragraaf: 2a
  - number: 18c
    text: |-
      Ingeval de burgemeester een ziekenhuis aanwijst om er patiënten in afzondering te nemen, neemt dat terstond alle
      daartoe vereiste maatregelen.
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18c
  - number: 18d
    text: |-
      1 Medisch toezicht vindt plaats onder zodanige voorwaarden en omstandigheden en bedraagt een zodanige periode als
      noodzakelijk is om het gevaar, bedoeld in [artikel 18a, eerste lid, onder b][ref1], af te wenden.

      2 Een wegens mogelijke besmetting met pokken onder medisch toezicht geplaatste persoon:

      a. treedt bij een lichaamstemperatuur van meer dan 38°C niet buiten zijn woning of verblijfplaats zonder
      toestemming van de directeur;

      b. treedt bij een lichaamstemperatuur van 38°C of minder niet buiten de gemeente van zijn woon – of verblijfplaats
      zonder toestemming van de directeur;

      c. vermijdt contact met personen die niet korter dan drie jaren geleden zijn gevaccineerd tegen de betrokken
      infectieziekte;

      d. geeft zijn adres, alsmede iedere verandering daarin, terstond door aan de directeur;

      e. neemt gedurende de periode van afzondering 's ochtends en 's avonds zijn lichaamstemperatuur op en geeft die
      terstond na meting door aan de directeur, op een door laatstgenoemde te bepalen wijze.

      2 De duur van het medisch toezicht bedraagt ten hoogste 18 dagen.

      3 Op aanwijzing van de hoofdinspecteur kan de in het tweede lid genoemde termijn worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel18a
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: 18a
        hoofdstuk: III
        paragraaf: 2a
  - number: 18e
    text: |-
      1 Wanneer naar de mening van de directeur bij een persoon die onder medisch toezicht moet worden gehouden zodanige
      omstandigheden aanwezig zijn dat uitvoering van [artikel 18d][ref1] niet op verantwoorde wijze kan plaatsvinden,
      kan de burgemeester besluiten de betrokkene in afzondering te doen plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel18d
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel18e
