  - number: '36'
    text: |-
      1 Een boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd in werking is
      getreden. Bezwaar en beroep op grond van de [Algemene wet bestuursrecht][ref1] schorst de uitvoering van de
      beschikking.

      2 Indien niet is betaald binnen de in het eerste lid bedoelde termijn wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de kosten van de aanmaning,
      te betalen.

      3 Bij gebreke van betaling binnen de in het tweede lid genoemde termijn kan de burgemeester van de overtreder de
      verschuldigde boete, verhoogd met de op de aanmaning en invordering betrekking hebbende kosten, invorderen bij
      dwangbevel.

      4 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).

      5 Gedurende zes weken na de dag van betekening staat voor de betrokkene verzet tegen het dwangbevel open door
      dagvaarding van de Staat.

      6 Het verzet schorst de tenuitvoerlegging. Op verzoek van de Staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.

      7 De bevoegdheid tot invordering vervalt binnen een jaar nadat de beschikking inzake oplegging van de boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009684/2004-04-16#Artikel36
