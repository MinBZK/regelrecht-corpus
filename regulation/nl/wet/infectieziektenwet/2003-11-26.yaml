---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: infectieziektenwet
regulatory_layer: WET
publication_date: '2008-11-18'
valid_from: '2003-11-26'
bwb_id: BWBR0009684
url: https://wetten.overheid.nl/BWBR0009684/2003-11-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het vanuit het oogpunt van de volksgezondheid noodzakelijk is
    voorzieningen te treffen ter afwending van de gevaren die voortvloeien uit het optreden van infectieziekten bij
    mensen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
  - number: 1.b
    text: 'hoofdinspecteur: de hoofdinspecteur van het desbetreffende onderdeel van het Staatstoezicht op de volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
  - number: 1.c
    text: |-
      directeur: de directeur van de gemeentelijke gezondheidsdienst of, indien deze geen arts is, een door de directeur
      aangewezen arts die in dienst is van de gemeentelijke gezondheidsdienst;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
  - number: 1.d
    text: |-
      laboratorium: een laboratorium waar van het menselijk lichaam afgescheiden stoffen worden onderzocht ten behoeve
      van de diagnostiek van infectieziekten;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
  - number: 1.e
    text: |-
      gebouw: elk bouwwerk, vaar- of voertuig, dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met
      wanden omsloten ruimte vormt, met uitzondering van bouwwerken ten behoeve van de belijdenis van godsdienst of
      levensovertuiging;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
  - number: 1.f
    text: |-
      waren: eetwaren, waaronder tevens worden begrepen kauwpreparaten, drinkwaren alsmede andere roerende zaken,
      voorzover gebruikt in de sfeer van de particuliere huishouding of van een krachtens de Warenwet daarmee
      gelijkgestelde andere huishouding;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
  - number: 1.g
    text: |-
      infectieziekten: de infectieziekten, genoemd in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '2'
        hoofdstuk: I
  - number: 1.h
    text: |-
      groep A: de infectieziekten, genoemd in [artikel 2, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '2'
        hoofdstuk: I
  - number: 1.i
    text: |-
      groep B: de infectieziekten, genoemd in [artikel 2, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '2'
        hoofdstuk: I
  - number: 1.j
    text: |-
      groep C: de infectieziekten, genoemd in [artikel 2, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '2'
        hoofdstuk: I
  - number: '2'
    text: 'Deze wet is van toepassing op de navolgende infectieziekten:'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel2
  - number: 2.a
    text: kinderverlamming; severe acute respiratory syndrome;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel2
  - number: 2.b
    text: |-
      bacillaire dysenterie; botulisme; buiktyfus; cholera; de ziekte van Creutzfeldt-Jakob; difterie; febris recurrens;
      hepatitis A, B en C; hondsdolheid; kinkhoest; legionellose; mazelen; meningokokkose; paratyfus A, B en C; pest;
      tuberculose; virale hemorrhagische koorts; vlektyfus; acute voedselvergiftiging of voedselinfectie, voor zover
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel2
  - number: 2.b.1°
    text: |-
      bij een persoon, werkzaam in de levensmiddelen- of horecasector, dan wel bij een persoon, beroepsmatig betrokken
      bij de behandeling, verpleging of verzorging van andere personen of
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel2
  - number: 2.b.2°
    text: door één arts bij twee of meer personen die binnen een tijdvak van 24 uur hetzelfde gegeten of gedronken hebben;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel2
  - number: 2.c
    text: |-
      brucellose; gele koorts; leptospirose; malaria; miltvuur; ornithose/psittacose; O-koorts; rodehond, trichinose
      alsmede ziekte veroorzaakt door enterohaemorrhagische E. coli.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel2
  - number: '3.1'
    text: |-
      Indien het belang van de volksgezondheid zulks vordert, kan Onze Minister, in overeenstemming met het gevoelen van
      de ministerraad, deze wet, desgewenst met uitzondering van artikel 14, eerste lid, en onder aanduiding van de groep
      waartoe de ziekte gerekend wordt, van toepassing verklaren op:
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel3
  - number: 3.1.a
    text: |-
      een infectieziekte die niet is opgenomen in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '2'
        hoofdstuk: I
  - number: 3.1.b
    text: |-
      een ziektebeeld met een volgens de stand van de wetenschap onbekende oorzaak, waarvan aannemelijk is dat deze een
      epidemisch karakter zal hebben.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel3
  - number: '3.2'
    text: |-
      Indien het belang van de volksgezondheid zulks vordert, kan Onze Minister, in overeenstemming met het gevoelen
      van de ministerraad, een infectieziekte uit groep B verplaatsen naar groep A of een infectieziekte uit groep C
      verplaatsen naar groep B.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel3
  - number: '3.3'
    text: |-
      Na het tot stand komen van een krachtens het eerste of tweede lid vastgestelde ministeriële regeling wordt binnen
      acht weken een voorstel van wet tot incorporatie van die ministeriële regeling aan de Tweede Kamer der Staten-
      Generaal gezonden. Indien het voorstel van wet wordt ingetrokken of door een der Kamers der Staten-Generaal wordt
      verworpen, wordt de ministeriële regeling onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel3
  - number: '4.1'
    text: |-
      De arts die bij een door hem onderzocht persoon een infectieziekte uit groep A vermoedt of vaststelt, meldt dit zo
      spoedig mogelijk, maar in ieder geval binnen 24 uur, aan de directeur.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel4
  - number: '4.2'
    text: |-
      De arts die bij een door hem onderzocht persoon een infectieziekte uit groep B vaststelt, meldt dit binnen 24 uur
      aan de directeur.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel4
  - number: '4.3'
    text: |-
      De arts die gegronde redenen heeft om bij een persoon een infectieziekte uit groep B te vermoeden, meldt dat
      vermoeden binnen 24 uur aan de directeur, indien
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel4
  - number: 4.3.a
    text: die persoon weigert het onderzoek te ondergaan dat noodzakelijk is ter vaststelling van die ziekte en
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel4
  - number: 4.3.b
    text: daardoor ernstig gevaar voor de volksgezondheid door de verspreiding van die infectieziekte kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel4
  - number: '4.4'
    text: |-
      De arts doet de in de voorgaande drie leden bedoelde meldingen aan de directeur van de gemeente waarin hij zijn
      praktijk heeft.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel4
  - number: '4.5'
    text: |-
      Indien de melding betrekking heeft op een persoon die zijn verblijfplaats heeft in een andere gemeente, geeft de
      directeur deze melding terstond door aan de directeur van de verblijfplaats van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel4
  - number: '5'
    text: |-
      De melding, bedoeld in [artikel 4][ref1], bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
  - number: 5.a
    text: |-
      de naam, de voornaam, het adres, de woonplaats, het geslacht, de geboortedatum en de verblijfplaats van de
      betrokken persoon;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel5
  - number: 5.b
    text: |-
      de infectieziekte, alsmede de eerste ziektedag, de vaccinatietoestand, het gebruik van chemoprofylaxe, de
      mogelijke bron of plaats van besmetting, de datum van vermoeden of vaststelling, de wijze van vaststelling van die
      infectieziekte en
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel5
  - number: 5.c
    text: |-
      zo nodig of de betrokken persoon dan wel een persoon in zijn directe omgeving beroeps- of bedrijfsmatig betrokken
      is bij de behandeling van eet- of drinkwaren of bij de behandeling, verpleging of verzorging van andere personen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel5
  - number: '6.1'
    text: |-
      Het hoofd van het laboratorium meldt de vaststelling van een verwekker van een infectieziekte uit groep C aan de
      directeur van de gemeente waarin de arts die het onderzoek bij het laboratorium heeft aangevraagd, zijn praktijk
      heeft, onder vermelding van de naam van die arts.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel6
  - number: '6.2'
    text: |-
      Op verzoek van de directeur verstrekt de arts die het onderzoek bij het laboratorium heeft aangevraagd, de volgende
      gegevens omtrent de persoon en de infectieziekte waarop de laboratoriummelding betrekking heeft:
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel6
  - number: 6.2.a
    text: het geslacht, het geboortejaar en het beroep van de betrokken persoon;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel6
  - number: 6.2.b
    text: |-
      de infectieziekte, de vaccinatietoestand, het gebruik van chemoprofylaxe en de mogelijke bron of plaats van
      besmetting.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel6
  - number: '6.3'
    text: De arts verstrekt andere gegevens uitsluitend indien de betrokkene daarvoor toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze waarop en de termijn waarbinnen de melding, bedoeld in het
      eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel6
  - number: '7.1'
    text: |-
      Het hoofd van een instelling waar voor infectieziekten kwetsbare populaties verblijven of samenkomen voor een of
      meer dagdelen per etmaal stelt de directeur van de gemeente, waarin de instelling gelegen is, op de hoogte van het
      optreden van een ongewoon aantal zieken met diarree, geelzucht, huidaandoeningen of andere ernstige aandoeningen
      van vermoedelijk infectueuze aard in de desbetreffende populatie of bij het begeleidend of verzorgend personeel.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze waarop en de termijn waarbinnen de berichtgeving
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel7
  - number: '8.1'
    text: |-
      De directeur neemt de persoonsgegevens, die ingevolge de [artikelen 5][ref1], [6][ref2] en [13][ref3] zijn
      verkregen, op in een door hem gehouden registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel13
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009684
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.2'
    text: De directeur bewaart deze gegevens ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel8
  - number: '9.1'
    text: |-
      De directeur deelt de ontvangst van een melding als bedoeld in [artikel 4][ref1] zo spoedig mogelijk mee
      aan de burgemeester van de gemeente waar de betrokken persoon zijn woon- of verblijfplaats heeft en aan de
      hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      De directeur deelt de ontvangst van een melding als bedoeld in [artikel 6][ref1] binnen een redelijke termijn mee
      aan de burgemeester van de gemeente waarin de arts, die het onderzoek heeft aangevraagd, zijn praktijk heeft en aan
      de hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel6
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '6'
        hoofdstuk: II
  - number: '9.3'
    text: |-
      De directeur deelt de ontvangst van een bericht als bedoeld in [artikel 7][ref1] binnen een redelijke termijn mee
      aan de burgemeester van de gemeente waarin de instelling gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel7
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '7'
        hoofdstuk: II
  - number: '10'
    text: |-
      Na een melding als bedoeld in [artikel 4][ref1] verstrekt de directeur de volgende gegevens aan de hoofdinspecteur:


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
  - number: 10.a
    text: |-
      de infectieziekte, alsmede de eerste ziektedag, de vaccinatietoestand, het gebruik van chemoprofylaxe, de mogelijke
      bron of plaats van besmetting, zo nodig met inbegrip van de daaruit voortgekomen gevallen, alsmede de datum van
      vermoeden of vaststelling van die infectieziekte en
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel10
  - number: 10.b
    text: het geslacht en het geboortejaar van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel10
  - number: '11'
    text: |-
      De directeur verstrekt de burgemeester de gegevens, bedoeld in [artikel 5][ref1], die deze nodig heeft voor de
      uitvoering van de hem bij deze wet toegekende bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel5
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '5'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      Alvorens de burgemeester een in dit hoofdstuk omschreven maatregel neemt of intrekt, wint hij het advies van de
      directeur in.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel12
  - number: '12.2'
    text: |-
      De directeur brengt zijn advies schriftelijk uit. In spoedeisende gevallen kan worden volstaan met een mondeling
      advies, dat zo spoedig mogelijk op schrift wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel12
  - number: '13'
    text: |-
      Op verzoek van de burgemeester verstrekt de behandelend arts van een persoon die naar het oordeel van de
      burgemeester gevaar oplevert voor de overbrenging van een infectieziekte uit groep A of groep B aan de directeur
      de nadere gegevens die noodzakelijk zijn om de aard en de omvang van het gevaar van verspreiding van die
      infectieziekte vast te stellen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel13
  - number: '14.1'
    text: 'De burgemeester kan een persoon terstond ter isolatie in een ziekenhuis doen opnemen, indien:'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
  - number: 14.1.a.1°
    text: hij gegronde redenen heeft om aan te nemen dat de betrokkene lijdt aan een infectieziekte uit groep A,
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
  - number: 14.1.a.2°
    text: |-
      ten aanzien van de betrokkene de melding ingevolge [artikel 4, derde lid][ref1], heeft plaatsgevonden, of


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
  - number: 14.1.a.3°
    text: de betrokkene lijdt aan een infectieziekte uit groep A of groep B;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
  - number: 14.1.b
    text: ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
  - number: 14.1.c
    text: dit gevaar niet op andere wijze effectief kan worden afgewend en
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
  - number: 14.1.d
    text: de betrokkene niet tot opneming ter isolatie bereid is.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
  - number: '14.2'
    text: |-
      Dit artikel wordt niet toegepast ten aanzien van de navolgende infectieziekten: bacillaire dysenterie; botulisme;
      buiktyfus; cholera; de ziekte van Creutzfeldt-Jakob; hepatitis A, B, of C; kinkhoest; mazelen; meningokokkose;
      paratyfus A, B of C; voedselvergiftiging; voedselinfectie; brucellose; gele koorts; legionellose; leptospirose;
      malaria; miltvuur; ornithose/psittacose; O-koorts; rodehond of trichinose.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel14
  - number: '15.1'
    text: De burgemeester doet de beschikking tot opneming ter isolatie aan de betrokkene uitreiken.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel15
  - number: '15.2'
    text: |-
      De beschikking wordt niet uitgereikt dan nadat de burgemeester voorzien heeft in bijstand van de betrokkene door
      een raadsman, tenzij de betrokkene daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel15
  - number: '15.3'
    text: |-
      De burgemeester draagt de tenuitvoerlegging van de beschikking op aan ter zake deskundige personen in dienst van de
      gemeentelijke gezondheidsdienst. Zij kunnen daartoe elke plaats betreden waar de betrokkene zich bevindt, zo nodig
      met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel15
  - number: '15.4'
    text: |-
      In zijn beschikking geeft de burgemeester aan in welk ziekenhuis de opneming ter isolatie ten uitvoer wordt gelegd.
      Het ziekenhuis neemt de betrokkene terstond op.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel15
  - number: '15.5'
    text: |-
      Wanneer redelijkerwijs kan worden aangenomen dat het gevaar, bedoeld in [artikel 14, eerste lid, onder b][ref1], is
      geweken of op minder ingrijpende wijze kan worden afgewend, heft de burgemeester de opneming ter isolatie terstond
      op.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16.1'
    text: 'De burgemeester kan een ter isolatie opgenomen persoon door een arts doen onderzoeken indien:'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel16
  - number: 16.1.a
    text: ten gevolge van de infectieziekte onmiddellijk gevaar dreigt voor de gezondheid van derden,
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel16
  - number: 16.1.b
    text: de aard en de omvang van dit gevaar niet op andere wijze dan door onderzoek kunnen worden vastgesteld,
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel16
  - number: 16.1.c
    text: de uitkomst van het onderzoek noodzakelijk is om dit gevaar effectief te kunnen afwenden en
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel16
  - number: 16.1.d
    text: de betrokkene niet bereid is het onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel16
  - number: '16.2'
    text: Het onderzoek omvat niet meer dan nodig is ter afwending van het gevaar voor derden.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel16
  - number: '16.3'
    text: Onderzoek in het lichaam wordt slechts verricht nadat de rechter daartoe een machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel16
  - number: '17.1'
    text: |-
      De burgemeester doet de beschikking tot het onderzoek, bedoeld in [artikel 16][ref1], aan de betrokkene uitreiken.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.2'
    text: |-
      In zijn beschikking geeft de burgemeester aan waaruit het onderzoek bestaat, welke arts het onderzoek verricht en
      binnen welke termijn het onderzoek plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel17
  - number: '18.1'
    text: |-
      De opneming ter isolatie wordt ten uitvoer gelegd in een gesloten afdeling van een door Onze Minister aangewezen
      ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel18
  - number: '18.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen eisen worden gesteld waaraan de opneming ter isolatie en het onderzoek
      moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel18
  - number: '19.1'
    text: |-
      De burgemeester stelt de officier van justitie terstond op de hoogte van de beschikking tot opneming ter isolatie,
      bedoeld in [artikel 14][ref1], en van de beschikking tot het onderzoek, bedoeld in [artikel 16, derde lid][ref2].
      Bevoegd is de rechter van de plaats waar het aangewezen ziekenhuis is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '19.2'
    text: |-
      Zo spoedig mogelijk nadat de beschikking is gegeven, doch in elk geval niet later dan de volgende dag, zendt de
      burgemeester de officier van justitie een afschrift van de beschikking.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel19
  - number: '20.1'
    text: |-
      Indien de officier van justitie van oordeel is dat aan de voorwaarden voor de opneming ter isolatie, bedoeld in
      [artikel 14][ref1], of het onderzoek, bedoeld in [artikel 16, derde lid][ref2], is voldaan, doet hij uiterlijk op
      de dag na de datum van ontvangst van de beschikking een verzoek tot een machtiging tot voortzetting van de isolatie
      of tot het onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '20.2'
    text: |-
      De officier van justitie deelt aan de betrokkene, de burgemeester en het ziekenhuis, schriftelijk mede dat hij het
      verzoek heeft gedaan of dat hij heeft besloten geen verzoek te doen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel20
  - number: '20.3'
    text: |-
      Het besluit geen verzoek te doen neemt de officier van justitie niet dan nadat hij het advies van de
      hoofdinspecteur heeft ingewonnen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel20
  - number: '20.4'
    text: |-
      Met het besluit geen verzoek te doen, vervalt de beschikking tot opneming ter isolatie, bedoeld in
      [artikel 14][ref1], of de beschikking tot onderzoek, bedoeld in [artikel 16, derde lid][ref2], van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '21.1'
    text: |-
      Alvorens op het verzoek van de officier van justitie te beschikken, hoort de rechter degene ten aanzien van wie de
      maatregel is gevorderd.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel21
  - number: '21.2'
    text: De rechter hoort de betrokkene te zijner verblijfplaats.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel21
  - number: '21.3'
    text: De rechter kan zich laten voorlichten, getuigen en deskundigen oproepen en onderzoek door deskundigen bevelen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel21
  - number: '21.4'
    text: De rechter stelt de raadsman in de gelegenheid zijn zienswijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel21
  - number: '21.5'
    text: De rechter beslist binnen drie dagen, te rekenen vanaf de dag na die van het instellen van de vordering.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel21
  - number: '21.6'
    text: Tegen de beschikking staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel21
  - number: '22.1'
    text: |-
      De ter isolatie opgenomen persoon kan de rechter verzoeken de maatregel op te heffen. In het geval de betrokkene
      buiten staat is dit verzoek te doen, komt gelijke bevoegdheid toe aan diens raadsman.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 21, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel21
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '22.3'
    text: |-
      De rechter kan het verzoek zonder toepassing van [artikel 21][ref1] afwijzen, indien geen nieuwe feiten of
      omstandigheden worden aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel21
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.1'
    text: |-
      Degene ten aanzien van wie een beschikking tot opneming ter isolatie als bedoeld in [artikel 14][ref1] of tot
      onderzoek als bedoeld in [artikel 16][ref2] is genomen, kan de rechter bij een zelfstandig verzoek bij een
      verweerschrift als bedoeld in [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3], of
      bij een desbetreffend verzoekschrift ter gelegenheid van het verhoor van de betrokkene, dan wel, indien de officier
      van justitie geen verzoek als bedoeld in [artikel 20, eerste lid][ref4], doet, bij een afzonderlijk verzoekschrift,
      verzoeken een naar billijkheid vast te stellen schadevergoeding toe te kennen op de grond dat de beschikking van de
      burgemeester onrechtmatig was.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel282
      [ref4]: https://wetten.overheid.nl/BWBR0009684#Artikel20
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '282'
      - id: ref4
        bwb_id: BWBR0009684
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van de betrokkene is
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel282
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '282'
  - number: '24.1'
    text: |-
      Indien degene ten aanzien van wie een beschikking tot opneming ter isolatie als bedoeld in [artikel 14][ref1] of
      tot onderzoek als bedoeld in [artikel 16][ref2] is genomen nadeel heeft geleden doordat de rechter of de officier
      van justitie een der bepalingen vervat in dit hoofdstuk niet in acht heeft genomen, kent de rechter deze op diens
      verzoek een naar billijkheid vast te stellen schadevergoeding toe ten laste van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Het verzoek kan worden ingediend als een zelfstandig verzoek bij het verweerschrift als bedoeld in
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1], of bij een desbetreffend
      verzoekschrift ter gelegenheid van het verhoor van de betrokkene, dan wel, bij een afzonderlijk verzoekschrift,
      binnen drie maanden te rekenen vanaf de dag waarop de betrokkene redelijkerwijs bekend kon zijn met de schending
      van het voorschrift waarop zijn verzoek betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel282
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '282'
  - number: '24.3'
    text: |-
      Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van de betrokkene is
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel282
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '282'
  - number: '25.1'
    text: |-
      De burgemeester kan een persoon die gevaar oplevert voor de verspreiding van een infectieziekte uit groep A of
      groep B, het verbod opleggen beroeps- of bedrijfsmatig werkzaamheden te verrichten, die een ernstig risico inhouden
      voor de verspreiding van die infectieziekte.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel25
  - number: '25.2'
    text: |-
      Alvorens een besluit als bedoeld in het eerste lid te nemen hoort de burgemeester de werkgever van de betrokkene,
      tenzij betrokkene hiertegen bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel25
  - number: '25.3'
    text: De burgemeester heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel25
  - number: '26.1'
    text: |-
      Indien ernstig gevaar dreigt voor de verspreiding van een infectieziekte, kan de burgemeester, om dit gevaar af te
      wenden, de volgende maatregelen nemen:
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: 26.1.a
    text: het sluiten van gebouwen of terreinen dan wel gedeelten daarvan;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: 26.1.b
    text: het uitvaardigen van een verbod tot het betreden van gebouwen of terreinen dan wel gedeelten daarvan;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: 26.1.c
    text: het doen ontsmetten van gebouwen dan wel gedeelten daarvan;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: 26.1.d
    text: het doen ontsmetten of vernietigen van waren;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: 26.1.e
    text: het geven van voorschriften van technisch-hygiënische aard.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: '26.2'
    text: Alvorens de burgemeester een dergelijke maatregel neemt, wint hij het advies van de directeur in.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: '26.3'
    text: De burgemeester heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel26
  - number: '27.1'
    text: |-
      Het gemeentebestuur draagt de kosten van de maatregelen die krachtens deze wet worden genomen. Ook draagt het
      gemeentebestuur, onverminderd het tweede lid, de kosten van door hem toegekende tegemoetkomingen aan hen, die door
      de maatregelen, bedoeld in de [artikelen 14][ref1], [25][ref2] en [26][ref3], inkomsten derven.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel26
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '25'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009684
        artikel: '26'
        hoofdstuk: IV
  - number: '27.2'
    text: |-
      Het gemeentebestuur is bevoegd de kosten verbonden aan de maatregelen, bedoeld in de [artikelen 14][ref1],
      [16][ref2], [25][ref3], en [26][ref4], te verhalen op de persoon ten aanzien van wie een maatregel is getroffen.
      [Artikel 229 van de Gemeentewet][ref5] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0009684#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009684
        artikel: '25'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009684
        artikel: '26'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '229'
  - number: '28.1'
    text: |-
      De in [artikel 25, eerste lid, onder d][ref1], bedoelde waren worden voor vernietiging door de burgemeester
      gewaardeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel25
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '25'
        hoofdstuk: III
        paragraaf: '4'
  - number: '28.2'
    text: Het gemeentebestuur keert aan de eigenaar als schadeloosstelling het bedrag uit waarop de waren zijn gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel28
  - number: '29.1'
    text: |-
      Onverminderd het tweede lid is de hoofdinspecteur belast met het toezicht op de naleving van het bij of krachtens
      deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel29
  - number: '29.2'
    text: |-
      De directeur is belast met het toezicht op de naleving van de [artikelen 4, eerste, tweede en derde lid][ref1],
      [6, eerste lid][ref2], en [13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel13
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009684
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '30'
    text: |-
      Indien een infectieziekte voorkomt of indien een gegrond vermoeden daarvan bestaat, zijn binnen hun ambtsgebied
      de burgemeester, de directeur en de hoofdinspecteur bevoegd elke plaats te betreden, voor zover dat redelijkerwijs
      voor de vervulling van hun taak op grond van deze wet nodig is. Zo nodig verschaffen zij zich de toegang met behulp
      van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel30
  - number: '31.1'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die
      zich onttrekt aan de bij de in de [artikelen 14][ref1], [16, eerste lid][ref2], [25, eerste lid][ref3]
      en [26, eerste lid, onder a, b, c en e][ref4], ten aanzien van hem genomen maatregelen dan wel de in
      [artikel 26, eerste lid, onder d][ref5], bedoelde waren onttrekt aan een krachtens dat lid genomen maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0009684#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0009684#Artikel26
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009684
        artikel: '25'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009684
        artikel: '26'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0009684
        artikel: '26'
        hoofdstuk: IV
  - number: '31.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel31
  - number: '32.1'
    text: |-
      Aan de arts die handelt in strijd met de [artikelen 4, eerste, tweede of derde lid][ref1],
      [6, tweede of derde lid][ref2], of [13][ref3], kan de burgemeester van de gemeente waarin die arts zijn praktijk
      heeft, een boete opleggen van € 90.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel13
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009684
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '32.2'
    text: |-
      Aan het hoofd van een laboratorium dat handelt in strijd met [artikel 6, eerste lid][ref1], kan de burgemeester van
      de gemeente, waarin de arts die het desbetreffende onderzoek bij het laboratorium heeft aangevraagd zijn praktijk
      heeft, een boete opleggen van € 90.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel6
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '6'
        hoofdstuk: II
  - number: '32.3'
    text: |-
      Aan het hoofd van een instelling die handelt in strijd met [artikel 7, eerste lid][ref1], kan de burgemeester van
      de gemeente, waarin de instelling gelegen is, een boete opleggen van € 90.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel7
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '7'
        hoofdstuk: II
  - number: '32.4'
    text: |-
      De burgemeester legt geen boete op indien de betrokken persoon aannemelijk maakt dat hem van de overtreding geen
      verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel32
  - number: '33'
    text: |-
      Degene jegens wie een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat
      hem wegens een overtreding als bedoeld in [artikel 32, eerste, tweede of derde lid][ref1], een boete zal worden
      opgelegd, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      voordat hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '34.1'
    text: |-
      Indien de directeur vaststelt dat een overtreding als bedoeld in [artikel 32, eerste, tweede of derde lid][ref1],
      is begaan, maakt hij daarvan binnen zes weken een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '34.2'
    text: 'In het rapport worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
  - number: 34.2.a
    text: de overtreding, alsmede het overtreden wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
  - number: 34.2.b
    text: een aanduiding van de periode waarin de overtreding is begaan;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
  - number: 34.2.c
    text: de infectieziekte die niet is gemeld.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
  - number: '34.3'
    text: Het rapport wordt toegezonden aan de burgemeester.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
  - number: '34.4'
    text: |-
      Een afschrift wordt toegezonden of uitgereikt aan de in [artikel 32, eerste, tweede of derde lid][ref1] bedoelde
      persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '34.5'
    text: |-
      Op verzoek van de in [artikel 32, eerste, tweede of derde lid][ref1] bedoelde persoon, die het rapport wegens zijn
      gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de burgemeester er zoveel mogelijk zorg voor
      dat de in het rapport vermelde informatie aan die persoon wordt meegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '34.6'
    text: |-
      In afwijking van [afdeling 4.1.2. van de Algemene wet bestuursrecht][ref1] stelt de burgemeester de in
      [artikel 32, eerste, tweede of derde lid][ref2] bedoelde persoon in de gelegenheid om binnen een redelijke termijn
      naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '34.7'
    text: |-
      Indien de in het vorige lid bedoelde persoon zijn zienswijze mondeling naar voren brengt, draagt de burgemeester
      er op verzoek van degene die de Nederlandse taal onvoldoende begrijpt zorg voor dat een tolk wordt benoemd die
      de betrokkene bij het horen kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel34
  - number: '35.1'
    text: De boete wordt opgelegd bij beschikking van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
  - number: '35.2'
    text: 'In de beschikking worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
  - number: 35.2.a
    text: de te betalen geldsom;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
  - number: 35.2.b
    text: de overtreding terzake waarvan de boete wordt opgelegd, alsmede het overtreden wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
  - number: 35.2.c
    text: de in artikel 34, tweede lid, onder b en c, bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
  - number: '35.3'
    text: |-
      Op verzoek van de persoon, bedoeld in [artikel 32, eerste, tweede of derde lid][ref1], die de beschikking wegens
      zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de burgemeester er zoveel mogelijk zorg
      voor dat de in die beschikking vermelde informatie aan die persoon wordt meegedeeld in een voor hem begrijpelijke
      taal.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '35.4'
    text: |-
      De beschikking wordt genomen binnen 12 weken, nadat de directeur het rapport, bedoeld in
      [artikel 34, eerste lid][ref1], heeft opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel34
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '34'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '35.5'
    text: |-
      De bevoegdheid tot het opleggen van een boete vervalt 1 jaar, nadat een overtreding als bedoeld in
      [artikel 32, eerste, tweede lid of derde lid][ref1], is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel32
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '32'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '35.6'
    text: |-
      De werking van een beschikking als bedoeld in het eerste lid wordt opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
  - number: '35.7'
    text: |-
      Onze Minister kan in overeenstemming met de Minister van Justitie beleidsregels stellen met betrekking tot de
      oplegging van boeten.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel35
  - number: '36.1'
    text: |-
      Een boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd in werking is getreden.
      Bezwaar en beroep op grond van de [Algemene wet bestuursrecht][ref1] schorst de uitvoering van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '36.2'
    text: |-
      Indien niet is betaald binnen de in het eerste lid bedoelde termijn wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de kosten van de aanmaning,
      te betalen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel36
  - number: '36.3'
    text: |-
      Bij gebreke van betaling binnen de in het tweede lid genoemde termijn kan de burgemeester van de overtreder de
      verschuldigde boete, verhoogd met de op de aanmaning en invordering betrekking hebbende kosten, invorderen bij
      dwangbevel.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel36
  - number: '36.4'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel36
  - number: '36.5'
    text: |-
      Gedurende zes weken na de dag van betekening staat voor de betrokkene verzet tegen het dwangbevel open door
      dagvaarding van de Staat.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel36
  - number: '36.6'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de Staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel36
  - number: '36.7'
    text: |-
      De bevoegdheid tot invordering vervalt binnen een jaar nadat de beschikking inzake oplegging van de boete
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel36
  - number: '40'
    text: |-
      De [Algemene termijnenwet][ref1] is van toepassing op de [artikelen 19, tweede lid][ref2], [20, eerste lid][ref3],
      en [21, vijfde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0009684#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0009684#Artikel21
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '19'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009684
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0009684
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '41'
    text: |-
      Ingeval ingevolge het bij deze wet bepaalde een verzoekschrift als bedoeld in [artikel 22, eerste lid][ref1],
      of [23, eerste lid][ref2], wordt ingediend dan wel een van de daartoe bevoegde personen beroep instelt, behoeft de
      indiening van het verzoekschrift niet bij procureur te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel23
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3'
  - number: '42'
    text: De Wet bestrijding infectieziekten en opsporing ziekteoorzaken wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel42
  - number: '43'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel43
  - number: '44'
    text: Deze wet wordt aangehaald als Infectieziektenwet.
    url: https://wetten.overheid.nl/BWBR0009684/2003-11-26#Artikel44
