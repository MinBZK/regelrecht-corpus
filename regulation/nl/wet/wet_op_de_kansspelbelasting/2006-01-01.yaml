---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_kansspelbelasting
regulatory_layer: WET
publication_date: '2008-10-02'
valid_from: '2006-01-01'
bwb_id: BWBR0002359
url: https://wetten.overheid.nl/BWBR0002359/2006-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de belastingheffing met betrekking tot kansspelen nader
    te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Onder de naam ''kansspelbelasting'' wordt een directe belasting geheven van:'
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel1
  - number: 1.a
    text: degene die gelegenheid geeft tot deelneming aan binnenlandse casinospelen.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel1
  - number: 1.b
    text: de gerechtigden tot de prijzen van binnenlandse kansspelen, niet zijnde casinospelen.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel1
  - number: 1.c
    text: de binnen het Rijk wonende of gevestigde gerechtigden tot de prijzen van buitenlandse kansspelen.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel1
  - number: '2.1'
    text: 'Onder kansspelen worden verstaan gelegenheden, gegeven tot mededinging naar:'
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel2
  - number: 2.1.a
    text: |-
      prijzen en premies, indien de aanwijzing der winnaars geschiedt door enige kansbepaling waarop de deelnemers in
      het algemeen geen overwegende invloed kunnen uitoefenen, met uitzondering van levensverzekeringen, premieleningen,
      alsmede toestellen, ingericht voor de beoefening van een spel, dat bestaat uit een door de speler in werking
      gesteld mechanisch, elektrisch of elektronisch proces, waarbij het resultaat kan leiden tot de middellijke
      of onmiddellijke uitkering van prijzen of premies, daaronder begrepen het recht om gratis verder te spelen
      (speelautomaten);
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel2
  - number: 2.1.b
    text: |-
      prijzen en premies, uitgeloofd ten behoeve van de deelnemers aan een prijsvraag, van welke aard ook, tenzij voor de
      deelneming het verrichten van een wetenschappelijke of kunstzinnige prestatie wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel2
  - number: '2.2'
    text: |-
      Kansspelen worden als binnenlands beschouwd, indien zij worden gehouden door natuurlijke personen of door lichamen
      in de zin van de [Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301), van wie een of meer binnen het
      Rijk wonen of zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '2.3'
    text: Kansspelen worden als buitenlands beschouwd, indien zij niet vallen onder het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel2
  - number: '3.1'
    text: 'De belasting wordt geheven:'
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel3
  - number: 3.1.a
    text: |-
      in de gevallen waarin [artikel 1, letter ][ref1], van toepassing is, naar het verschil tussen de in een tijdvak
      ontvangen inzetten en de ter beschikking gestelde prijzen, dan wel, zo een ander dan de belastingplichtige de
      prijzen ter beschikking stelt, naar hetgeen in een tijdvak ontvangen wordt voor het geven van gelegenheid tot
      deelneming aan casinospelen;


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 3.1.b
    text: |-
      in de gevallen waarin [artikel 1, letter ][ref1], van toepassing is, naar de prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '3.2'
    text: |-
      Onder prijzen worden verstaan alle goederen waaraan in het economische verkeer waarde kan worden toegekend, welke
      aan de deelnemers van de kansspelen uit hoofde van hun deelneming toevallen.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor zover de prijzen niet in geld bestaan, worden zij in aanmerking genomen naar de waarde welke daaraan in het
      economische verkeer kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel3
  - number: '4.1'
    text: 'Van de belasting is vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel4
  - number: 4.1.a
    text: de prijs welke niet meer bedraagt dan € 454;
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de prijs welke niet uitgaat boven de prestatie welke staat tegenover de deelneming uit hoofde waarvan aanspraak op
      de prijs bestaat.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel4
  - number: '4.2'
    text: |-
      Alle prijzen uit loterijen en prijsvragen welke verschuldigd zijn door dezelfde schuldenaar en vallen op loten of
      onderdelen van loten op grond van dezelfde toevallige gebeurtenis, worden voor de toepassing van het eerste lid
      tezamen als één prijs beschouwd.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel4
  - number: '5.1'
    text: 'De belasting bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5
  - number: 5.1.a
    text: |-
      in de gevallen waarin [artikel 1, letter ][ref1], van toepassing is, 40,85 percent;


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 5.1.b
    text: |-
      in de gevallen waarin [artikel 1, letter ][ref1], van toepassing is, 29 percent.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '5.2'
    text: |-
      Neemt degene die de prijs verschuldigd is, de belasting voor zijn rekening, dan wordt voor het berekenen van de
      belasting de prijs met 100/71 vermenigvuldigd.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5
  - number: 5a.1
    text: |-
      In de gevallen waarin [artikel 1, letter ][ref1], van toepassing is, moet de in een tijdvak verschuldigd geworden
      belasting op aangifte worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 5a.2
    text: De belasting wordt verschuldigd op het tijdstip waarop de prijs ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Indien het in [artikel 3, eerste lid, letter ][ref1], bedoelde verschil over een tijdvak negatief is, wordt het
      verrekend met het positieve verschil over een volgend tijdvak. De verrekening geschiedt in de volgorde waarin zich
      negatieve en positieve verschillen voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel3
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '3'
        hoofdstuk: II
  - number: 5b
    text: |-
      De belastingplichtige is gehouden volgens door Onze Minister te stellen regelen een register te houden en daarin de
      gegevens te boeken welke voor de heffing van de belasting van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel5b
  - number: '6.1'
    text: |-
      In de gevallen waarin [artikel 1, letter ][ref1], van toepassing is, wordt de belasting geheven door inhouding op
      de prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '6.2'
    text: Inhoudingsplichtige is degene die de prijs verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de prijs ter beschikking is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel6
  - number: '6.4'
    text: |-
      De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen. Overtreft de belasting de
      prijs voor zover deze in geld bestaat, dan wordt het ontbrekende geacht te zijn ingehouden op het in het derde
      lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd is dat ontbrekende te verhalen op
      de belastingplichtige. De inhoudingsplichtige kan de afgifte van de prijs voor zover deze niet in geld bestaat
      opschorten tot voldoening van deze vordering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel6
  - number: '7.1'
    text: |-
      De inhoudingsplichtige is gehouden volgens door Onze Minister te stellen regelen een register te houden en daarin
      de gegevens te boeken welke voor de heffing van de belasting van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel7
  - number: '7.2'
    text: |-
      Degene bij wie de prijs is betaalbaar gesteld, is gehouden op verzoek van de gerechtigde tot de prijs aan hem
      volgens door Onze Minister te stellen regelen, zodra de prijs is uitbetaald, tegoedgeschreven, verrekend of
      afgegeven, een gedagtekende nota uit te reiken, waaruit van de inhouding blijkt.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel7
  - number: '8.1'
    text: |-
      In de gevallen waarin [artikel 1, letter ][ref1], van toepassing is, moet de belasting op aangifte worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '8.2'
    text: 'De belasting wordt verschuldigd op het tijdstip waarop de prijs:'
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel8
  - number: 8.2.a
    text: |-
      ontvangen of verrekend wordt, ter beschikking van de belastingplichtige wordt gesteld of rentedragend wordt, dan
      wel
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel8
  - number: 8.2.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel8
  - number: '19.1'
    text: Deze wet treedt in werking met ingang van een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel19
  - number: '19.2'
    text: Haar bepalingen zijn van toepassing, indien de gerechtigdheid tot de prijs op of na dat tijdstip ontstaat.
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel19
  - number: '20'
    text: 'Deze wet kan worden aangehaald als: Wet op de kansspelbelasting.'
    url: https://wetten.overheid.nl/BWBR0002359/2006-01-01#Artikel20
