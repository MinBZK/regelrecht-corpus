  - number: '5'
    text: |-
      1 De belasting bedraagt 30,1 percent.

      2 Neemt, in het geval waarin [artikel 1, eerste lid, onderdeel c][ref1], van toepassing is, degene die de prijs
      verschuldigd is, de belasting voor zijn rekening, dan wordt voor het berekenen van de belasting de prijs met
      1000/699 vermenigvuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel5
    references:
      - id: ref1
