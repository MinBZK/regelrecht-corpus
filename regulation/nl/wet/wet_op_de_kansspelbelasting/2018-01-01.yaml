  - number: '4'
    text: |-
      1 Indien [artikel 1, eerste lid, onderdeel c of d][ref1], van toepassing is, is van de belasting vrijgesteld:

      a. de prijs die niet meer bedraagt dan € 449;

      b. de prijs welke niet uitgaat boven de prestatie welke staat tegenover de deelneming uit hoofde waarvan aanspraak
      op de prijs bestaat.

      2 Alle prijzen uit loterijen en prijsvragen welke verschuldigd zijn door dezelfde schuldenaar en vallen op loten
      of onderdelen van loten op grond van dezelfde toevallige gebeurtenis, worden voor de toepassing van het eerste lid
      tezamen als één prijs beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel4
