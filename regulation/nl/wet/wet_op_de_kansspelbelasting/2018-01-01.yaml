        artikel: '1'
        hoofdstuk: I
  - number: 5a
    text: |-
      1 In de gevallen waarin [artikel 1, eerste lid, onderdeel a of b][ref1], van toepassing is, moet de in een tijdvak
      verschuldigd geworden belasting op aangifte worden voldaan.

      2 De belasting is verschuldigd op de laatste dag van het tijdvak, bedoeld in
      [artikel 3, eerste lid, onderdeel a][ref2].

      3 Indien het in [artikel 3, eerste lid, onderdeel a][ref3], bedoelde verschil over een tijdvak negatief is, wordt
      het verrekend met het positieve verschil over een volgend tijdvak. De verrekening geschiedt in de volgorde waarin
      zich negatieve en positieve verschillen voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002359#Artikel3
