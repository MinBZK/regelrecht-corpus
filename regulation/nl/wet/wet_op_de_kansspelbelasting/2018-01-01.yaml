  - number: 5b
    text: |-
      De belastingplichtige is gehouden volgens door Onze Minister te stellen regelen een register te houden en daarin de
      gegevens te boeken welke voor de heffing van de belasting van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel5b
  - number: '6'
    text: |-
      1 In de gevallen waarin [artikel 1, eerste lid, onderdeel c][ref1], van toepassing is, wordt de belasting geheven
      door inhouding op de prijs.

      2 Inhoudingsplichtige is degene die de prijs verschuldigd is.

      3 De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de prijs ter beschikking
      is gesteld.

      4 Overtreft de belasting de prijs voor zover deze in geld bestaat, dan wordt het ontbrekende geacht te zijn
      ingehouden op het in het derde lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd is
      dat ontbrekende te verhalen op de belastingplichtige. De inhoudingsplichtige kan de afgifte van de prijs voor zover
      deze niet in geld bestaat opschorten tot voldoening van deze vordering plaatsvindt.

      5 De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen. Het tijdstip waarop de
      belasting is verschuldigd, is het tijdstip waarop de prijs ter beschikking is gesteld of, onder bij ministeriële
      regeling te stellen voorwaarden, de laatste dag van de kalendermaand of van het kalenderkwartaal waarin de prijs
      ter beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '7'
    text: |-
      1 De inhoudingsplichtige is gehouden volgens door Onze Minister te stellen regelen een register te houden en daarin
      de gegevens te boeken welke voor de heffing van de belasting van belang zijn.

      2 Degene bij wie de prijs is betaalbaar gesteld, is gehouden op verzoek van de gerechtigde tot de prijs aan
      hem volgens door Onze Minister te stellen regelen, zodra de prijs is uitbetaald, tegoedgeschreven, verrekend of
      afgegeven, een gedagtekende nota uit te reiken, waaruit van de inhouding blijkt.
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel7
  - number: '8'
    text: |-
      1 In de gevallen waarin [artikel 1, eerste lid, onderdeel d][ref1], van toepassing is, moet de belasting op
      aangifte worden voldaan.

      2 De belasting wordt verschuldigd op het tijdstip waarop de prijs:

      a. ontvangen of verrekend wordt, ter beschikking van de belastingplichtige wordt gesteld of rentedragend wordt,
      dan wel

      b. vorderbaar en tevens inbaar wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel8
