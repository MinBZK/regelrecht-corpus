preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de belastingheffing met betrekking tot kansspelen nader
    te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder de naam 'kansspelbelasting' wordt een directe belasting geheven van:

      a. degene die gelegenheid geeft tot deelname aan binnenlandse casinospelen, de houder van een vergunning voor
      de exploitatie van speelautomaten als bedoeld in [artikel 30h, eerste lid, van de Wet op de kansspelen][ref1],
      ten aanzien van de onder diens vergunning in Nederland geplaatste fysieke speelautomaten waarop een
      kansspelautomatenspel wordt gespeeld en degene die opbrengst geniet van zonder een vergunning als bedoeld in
      artikel 30h, eerste lid, van de Wet op de kansspelen in Nederland geplaatste fysieke speelautomaten waarop een
      kansspelautomatenspel wordt gespeeld;

      b. degene die gelegenheid geeft tot deelneming aan binnenlandse kansspelen welke via het internet worden gespeeld;

      c. de gerechtigden tot de prijzen van binnenlandse kansspelen, niet zijnde casinospelen, kansspelautomatenspelen of
      kansspelen welke via het internet worden gespeeld;

      d. de in Nederland wonende of gevestigde gerechtigden tot de prijzen van buitenlandse kansspelen, niet zijnde:

      1°. casinospelen en kansspelautomatenspelen die worden gehouden door natuurlijke personen of door lichamen van wie
      er een of meer wonen of zijn gevestigd in een lidstaat van de Europese Unie of in een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte;

      2°. kansspelen welke via het internet worden gespeeld;

      e. de in Nederland wonende of gevestigde gerechtigden tot de prijzen van buitenlandse kansspelen welke via het
      internet worden gespeeld.

      2 Onder kansspelautomatenspel wordt verstaan een kansspel dat bestaat uit een door de speler in werking gesteld
      mechanisch, elektrisch of elektronisch proces, waarbij het resultaat kan leiden tot rechtstreekse of niet-
      rechtstreekse uitkering van prijzen, met inbegrip van extra speelduur.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel1
