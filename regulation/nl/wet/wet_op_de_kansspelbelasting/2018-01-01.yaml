  - number: 8a
    text: |-
      1 In de gevallen waarin [artikel 1, eerste lid, onderdeel e][ref1], van toepassing is, moet de belasting op
      aangifte worden voldaan.

      2 De belasting is verschuldigd op de laatste dag van de kalendermaand, bedoeld in
      [artikel 3, eerste lid, onderdeel c][ref2].


