        artikel: 30h
  - number: '2'
    text: |-
      1 Onder kansspelen worden verstaan gelegenheden, gegeven tot mededinging naar:

      a. prijzen en premies, indien de aanwijzing der winnaars geschiedt door enige kansbepaling waarop de deelnemers
      in het algemeen geen overwegende invloed kunnen uitoefenen, met uitzondering van levensverzekeringen en
      premieleningen;

      b. prijzen en premies, uitgeloofd ten behoeve van de deelnemers aan een prijsvraag van welke aard ook, tenzij
      een wetenschappelijke of kunstzinnige prestatie wordt gevorderd, dan wel een prestatie waarmee het algemeen
      maatschappelijk belang wordt gediend.

      2 Kansspelen worden als binnenlands beschouwd, indien zij worden gehouden door natuurlijke personen of door
      lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1] (Stb. 1959, 301), van wie een of meer in
      Nederland wonen of zijn gevestigd.

      3 Kansspelen worden als buitenlands beschouwd, indien zij niet vallen onder het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002359/2018-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '3'
    text: |-
      1 De belasting wordt geheven:

      a. in de gevallen waarin [artikel 1, eerste lid, onderdeel a of b][ref1], van toepassing is, naar het verschil
      tussen de in een tijdvak ontvangen inzetten en de ter beschikking gestelde prijzen, dan wel, zo een ander dan de
      belastingplichtige de prijzen ter beschikking stelt, naar hetgeen in een tijdvak ontvangen wordt voor het geven van
      gelegenheid tot deelneming aan casinospelen of tot deelneming aan binnenlandse kansspelen welke via het internet
      worden gespeeld;

      b. in de gevallen waarin [artikel 1, eerste lid, onderdeel c of d][ref2], van toepassing is, naar de prijzen;

      c. in de gevallen waarin [artikel 1, eerste lid, onderdeel e][ref3], van toepassing is, naar het positieve verschil
      tussen de in een kalendermaand gewonnen prijzen en de in die kalendermaand gedane inzetten.

      2 Onder prijzen worden verstaan alle goederen waaraan in het economische verkeer waarde kan worden toegekend, welke
      aan de deelnemers van de kansspelen uit hoofde van hun deelneming toevallen.

      3 Voor zover de prijzen niet in geld bestaan, worden zij in aanmerking genomen naar de waarde welke daaraan in het
      economische verkeer kan worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002359#Artikel1
