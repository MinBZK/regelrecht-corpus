---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_kansspelbelasting
regulatory_layer: WET
publication_date: '2008-10-02'
valid_from: '2021-10-01'
bwb_id: BWBR0002359
url: https://wetten.overheid.nl/BWBR0002359/2021-10-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de belastingheffing met betrekking tot kansspelen nader
    te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Onder de naam kansspelbelasting wordt een belasting geheven van:'
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
  - number: 1.a
    text: |-
      de houder van een vergunning als bedoeld in [artikel 27g, eerste lid, van de Wet op de kansspelen][ref1],
      ten aanzien van de onder die vergunning aangeboden casinospelen, en degene die opbrengst geniet van zonder
      een vergunning als bedoeld in artikel 27g, eerste lid, van de Wet op de kansspelen aangeboden casinospelen in
      Nederland, niet zijnde kansspelen op afstand;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27g
  - number: 1.b
    text: |-
      de houder van een vergunning voor de exploitatie van speelautomaten als bedoeld in
      [artikel 30h, eerste lid, van de Wet op de kansspelen][ref1], ten aanzien van de onder diens vergunning in
      Nederland geplaatste fysieke speelautomaten waarop een kansspelautomatenspel wordt gespeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30h
  - number: 1.c
    text: |-
      degene die opbrengst geniet van zonder een vergunning als bedoeld in onderdeel b in Nederland geplaatste fysieke
      speelautomaten waarop een kansspelautomatenspel wordt gespeeld;
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
  - number: 1.d
    text: |-
      de houder van een vergunning als bedoeld in [artikel 31a, eerste lid, van de Wet op de kansspelen][ref1], ten
      aanzien van de onder die vergunning aangeboden kansspelen op afstand, en degene die opbrengst geniet van het
      tijdelijk zonder een vergunning als bedoeld in artikel 31a, eerste lid, van de Wet op de kansspelen aangeboden
      kansspelen op afstand;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31a
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31a
  - number: 1.e
    text: |-
      de houder van een vergunning als bedoeld in [artikel 15, eerste lid, van de Wet op de kansspelen][ref1] ten aanzien
      van de onder die vergunning aangeboden sportweddenschappen en degene die opbrengst geniet van zonder een vergunning
      als bedoeld in artikel 15, eerste lid, van de Wet op de kansspelen aangeboden sportweddenschappen in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel15
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '15'
  - number: 1.f
    text: |-
      de houder van een vergunning als bedoeld in [artikel 23, eerste lid, van de Wet op de kansspelen][ref1] ten aanzien
      van de onder die vergunning aangeboden totalisator en degene die opbrengst geniet van zonder een vergunning als
      bedoeld in artikel 23, eerste lid, van de Wet op de kansspelen aangeboden totalisatoren in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel23
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '23'
  - number: 1.g
    text: |-
      de gerechtigden tot de prijzen van binnenlandse kansspelen, niet zijnde kansspelen die vallen onder onderdeel a, b,
      c, d, e of f;
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
  - number: 1.h
    text: 'de in Nederland wonende of gevestigde gerechtigden tot de prijzen van buitenlandse kansspelen, niet zijnde:'
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
  - number: 1.h.1°
    text: |-
      casinospelen, kansspelautomatenspelen, sportweddenschappen en totalisatoren die worden gehouden of georganiseerd
      door natuurlijke personen of door lichamen van wie er een of meer wonen, onderscheidenlijk zijn gevestigd, in een
      lidstaat van de Europese Unie of in een staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte;
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
  - number: 1.h.2°
    text: kansspelen op afstand;
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
  - number: 1.i
    text: |-
      de in Nederland wonende of gevestigde gerechtigden tot de prijzen van kansspelen op afstand, niet zijnde kansspelen
      op afstand als bedoeld in onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel1
  - number: '2.1'
    text: 'Onder kansspelen worden verstaan gelegenheden, gegeven tot mededinging naar:'
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
  - number: 2.1.a
    text: |-
      prijzen en premies, indien de aanwijzing der winnaars geschiedt door enige kansbepaling waarop de deelnemers in
      het algemeen geen overwegende invloed kunnen uitoefenen, met inbegrip van piramidespelen en met uitzondering van
      levensverzekeringen en premieleningen;
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
  - number: 2.1.b
    text: |-
      prijzen en premies, uitgeloofd ten behoeve van de deelnemers aan een prijsvraag van welke aard ook, tenzij
      een wetenschappelijke of kunstzinnige prestatie wordt gevorderd, dan wel een prestatie waarmee het algemeen
      maatschappelijk belang wordt gediend.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
  - number: '2.2'
    text: |-
      Onder kansspelen op afstand worden verstaan kansspelen die op afstand met elektronische communicatiemiddelen worden
      gegeven en waaraan wordt deelgenomen zonder fysiek contact met degene die gelegenheid geeft of die voor deelname
      aan die kansspelen ruimte en middelen ter beschikking stelt, met uitzondering van promotionele kansspelen en
      kansspelen waarvoor op grond van een ander artikel dan [artikel 31a, eerste lid, van de Wet op de kansspelen][ref1]
      een vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31a
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31a
  - number: '2.3'
    text: |-
      Onder kansspelautomatenspel wordt verstaan een kansspel dat bestaat uit een door de speler in werking gesteld
      mechanisch, elektrisch of elektronisch proces, waarbij het resultaat kan leiden tot rechtstreekse of niet-
      rechtstreekse uitkering van prijzen, met inbegrip van extra speelduur.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
  - number: '2.4'
    text: |-
      Onder piramidespelen worden verstaan gelegenheden waarbij deelnemers een goed afgeven of een verplichting aangaan
      teneinde daaruit een voordeel te verwerven dat geheel of ten dele afhankelijk is van de afgifte van een goed of het
      aangaan van een verplichting door latere deelnemers.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
  - number: '2.5'
    text: |-
      Onder casinospelen worden verstaan casinospelen als bedoeld in [artikel 27i van de Wet op de kansspelen][ref1],
      met inbegrip van spelen die naar hun aard en opzet vergelijkbaar zijn met dergelijke casinospelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27i
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27i
  - number: '2.6'
    text: |-
      Kansspelen worden als binnenlands beschouwd, indien zij worden gehouden door natuurlijke personen of door lichamen
      in de zin van de [Algemene wet inzake rijksbelastingen][ref1], van wie een of meer in Nederland wonen of zijn
      gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '2.7'
    text: Kansspelen worden als buitenlands beschouwd, indien zij niet vallen onder het zesde lid.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel2
  - number: '3.1'
    text: 'De belasting wordt geheven:'
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel3
  - number: 3.1.a
    text: |-
      in de gevallen waarin [artikel 1, onderdeel a, b, c, d, e of f][ref1], van toepassing is, naar het verschil tussen
      de in een tijdvak ontvangen inzetten en de ter beschikking gestelde prijzen en naar hetgeen in een tijdvak anders
      dan als inzet ontvangen is voor het geven van gelegenheid tot deelneming aan kansspelen;


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 3.1.b
    text: |-
      in de gevallen waarin [artikel 1, onderdeel g of h][ref1], van toepassing is, naar de prijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 3.1.c
    text: |-
      in de gevallen waarin [artikel 1, onderdeel i][ref1], van toepassing is, naar het positieve verschil tussen de in
      een kalendermaand gewonnen prijzen en de in die kalendermaand gedane inzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '3.2'
    text: |-
      Onder prijzen worden verstaan alle goederen waaraan in het economische verkeer waarde kan worden toegekend, welke
      aan de deelnemers van de kansspelen uit hoofde van hun deelneming toevallen.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel3
  - number: '3.3'
    text: |-
      Voor zover de prijzen niet in geld bestaan, worden zij in aanmerking genomen naar de waarde welke daaraan in het
      economische verkeer kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel3
  - number: '4.1'
    text: |-
      Indien [artikel 1, onderdeel g of h][ref1], van toepassing is, is van de belasting vrijgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 4.1.a
    text: de prijs die niet meer bedraagt dan € 449;
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel4
  - number: 4.1.b
    text: |-
      de prijs welke niet uitgaat boven de prestatie welke staat tegenover de deelneming uit hoofde waarvan aanspraak op
      de prijs bestaat.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel4
  - number: '4.2'
    text: |-
      Alle prijzen uit loterijen en prijsvragen welke verschuldigd zijn door dezelfde schuldenaar en vallen op loten of
      onderdelen van loten op grond van dezelfde toevallige gebeurtenis, worden voor de toepassing van het eerste lid
      tezamen als één prijs beschouwd.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel4
  - number: '5.1'
    text: De belasting bedraagt 29 percent.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel5
  - number: '5.2'
    text: |-
      Neemt, in het geval waarin [artikel 1, onderdeel g][ref1], van toepassing is, degene die de prijs verschuldigd is,
      de belasting voor zijn rekening, dan wordt voor het berekenen van de belasting de prijs met 100/71 vermenigvuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 5a.1
    text: |-
      In de gevallen waarin [artikel 1, onderdeel a, b, c, d, e of f][ref1], van toepassing is, moet de in een tijdvak
      verschuldigd geworden belasting op aangifte worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 5a.2
    text: |-
      De belasting is verschuldigd op de laatste dag van het tijdvak, bedoeld in
      [artikel 3, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel3
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '3'
        hoofdstuk: II
  - number: '6.1'
    text: |-
      In de gevallen waarin [artikel 1, onderdeel g][ref1], van toepassing is, wordt de belasting geheven door inhouding
      op de prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '6.2'
    text: Inhoudingsplichtige is degene die de prijs verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel6
  - number: '6.3'
    text: |-
      De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de prijs ter beschikking is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel6
  - number: '6.4'
    text: |-
      Overtreft de belasting de prijs voor zover deze in geld bestaat, dan wordt het ontbrekende geacht te zijn
      ingehouden op het in het derde lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd is
      dat ontbrekende te verhalen op de belastingplichtige. De inhoudingsplichtige kan de afgifte van de prijs voor zover
      deze niet in geld bestaat opschorten tot voldoening van deze vordering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel6
  - number: '6.5'
    text: |-
      De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen. Het tijdstip waarop de
      belasting is verschuldigd, is het tijdstip waarop de prijs ter beschikking is gesteld of, onder bij ministeriële
      regeling te stellen voorwaarden, de laatste dag van de kalendermaand of van het kalenderkwartaal waarin de prijs
      ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel6
  - number: '8.1'
    text: |-
      In de gevallen waarin [artikel 1, onderdeel h][ref1], van toepassing is, moet de belasting op aangifte worden
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: '8.2'
    text: 'De belasting wordt verschuldigd op het tijdstip waarop de prijs:'
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel8
  - number: 8.2.a
    text: |-
      ontvangen of verrekend wordt, ter beschikking van de belastingplichtige wordt gesteld of rentedragend wordt, dan
      wel
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel8
  - number: 8.2.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel8
  - number: 8a.1
    text: |-
      In de gevallen waarin [artikel 1, onderdeel i][ref1], van toepassing is, moet de belasting op aangifte worden
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
        hoofdstuk: I
  - number: 8a.2
    text: |-
      De belasting is verschuldigd op de laatste dag van de kalendermaand, bedoeld in
      [artikel 3, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel3
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '3'
        hoofdstuk: II
  - number: '19.1'
    text: Deze wet treedt in werking met ingang van een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel19
  - number: '19.2'
    text: Haar bepalingen zijn van toepassing, indien de gerechtigdheid tot de prijs op of na dat tijdstip ontstaat.
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel19
  - number: '20'
    text: 'Deze wet kan worden aangehaald als: Wet op de kansspelbelasting.'
    url: https://wetten.overheid.nl/BWBR0002359/2021-10-01#Artikel20
