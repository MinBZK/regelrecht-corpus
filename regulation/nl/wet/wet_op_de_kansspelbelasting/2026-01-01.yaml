    text: |-
      1 De belasting bedraagt 37,8 percent.

      2 Neemt, in het geval waarin [artikel 1, onderdeel g][ref1], van toepassing is, degene die de prijs verschuldigd
      is, de belasting voor zijn rekening, dan wordt voor het berekenen van de belasting de prijs met 100/62,2
      vermenigvuldigd.


