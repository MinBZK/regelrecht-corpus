  - number: '2'
    text: |-
      1 Onder kansspelen worden verstaan gelegenheden, gegeven tot mededinging naar:

      a. prijzen en premies, indien de aanwijzing der winnaars geschiedt door enige kansbepaling waarop de deelnemers in
      het algemeen geen overwegende invloed kunnen uitoefenen, met inbegrip van piramidespelen en met uitzondering van
      levensverzekeringen en premieleningen;

      b. prijzen en premies, uitgeloofd ten behoeve van de deelnemers aan een prijsvraag van welke aard ook, tenzij
      een wetenschappelijke of kunstzinnige prestatie wordt gevorderd, dan wel een prestatie waarmee het algemeen
      maatschappelijk belang wordt gediend.

      2 Onder kansspelen op afstand worden verstaan kansspelen die op afstand met elektronische
      communicatiemiddelen worden gegeven en waaraan wordt deelgenomen zonder fysiek contact met degene die
      gelegenheid geeft of die voor deelname aan die kansspelen ruimte en middelen ter beschikking stelt,
      met uitzondering van promotionele kansspelen en kansspelen waarvoor op grond van een ander artikel dan
      [artikel 31a, eerste lid, van de Wet op de kansspelen][ref1] een vergunning is verleend.

      3 Onder kansspelautomatenspel wordt verstaan een kansspel dat bestaat uit een door de speler in werking gesteld
      mechanisch, elektrisch of elektronisch proces, waarbij het resultaat kan leiden tot rechtstreekse of niet-
      rechtstreekse uitkering van prijzen, met inbegrip van extra speelduur.

      4 Onder piramidespelen worden verstaan gelegenheden waarbij deelnemers een goed afgeven of een verplichting aangaan
      teneinde daaruit een voordeel te verwerven dat geheel of ten dele afhankelijk is van de afgifte van een goed of het
      aangaan van een verplichting door latere deelnemers.

      5 Onder casinospelen worden verstaan casinospelen als bedoeld in [artikel 27i van de Wet op de kansspelen][ref2],
      met inbegrip van spelen die naar hun aard en opzet vergelijkbaar zijn met dergelijke casinospelen.

      6 Kansspelen worden als binnenlands beschouwd, indien zij worden gehouden door natuurlijke personen of door
      lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref3], van wie een of meer in Nederland wonen of
      zijn gevestigd.

      7 Kansspelen worden als buitenlands beschouwd, indien zij niet vallen onder het zesde lid.


