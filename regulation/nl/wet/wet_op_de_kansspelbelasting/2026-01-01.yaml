  - number: '3'
    text: |-
      1 De belasting wordt geheven:

      a. in de gevallen waarin [artikel 1, onderdeel a, b, c, d, e of f][ref1], van toepassing is, naar het verschil
      tussen de in een tijdvak ontvangen inzetten en de ter beschikking gestelde prijzen en naar hetgeen in een tijdvak
      anders dan als inzet ontvangen is voor het geven van gelegenheid tot deelneming aan kansspelen;

      b. in de gevallen waarin [artikel 1, onderdeel g of h][ref2], van toepassing is, naar de prijzen;

      c. in de gevallen waarin [artikel 1, onderdeel i][ref3], van toepassing is, naar het positieve verschil tussen de
      in een kalendermaand gewonnen prijzen en de in die kalendermaand gedane inzetten.

      2 Onder prijzen worden verstaan alle goederen waaraan in het economische verkeer waarde kan worden toegekend, welke
      aan de deelnemers van de kansspelen uit hoofde van hun deelneming toevallen.

      3 Voor zover de prijzen niet in geld bestaan, worden zij in aanmerking genomen naar de waarde welke daaraan in het
      economische verkeer kan worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002359#Artikel1
