preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de belastingheffing met betrekking tot kansspelen nader
    te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002359/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam kansspelbelasting wordt een belasting geheven van:

      a. de houder van een vergunning als bedoeld in [artikel 27g, eerste lid, van de Wet op de kansspelen][ref1],
      ten aanzien van de onder die vergunning aangeboden casinospelen, en degene die opbrengst geniet van zonder
      een vergunning als bedoeld in artikel 27g, eerste lid, van de Wet op de kansspelen aangeboden casinospelen in
      Nederland, niet zijnde kansspelen op afstand;

      b. de houder van een vergunning voor de exploitatie van speelautomaten als bedoeld in
      [artikel 30h, eerste lid, van de Wet op de kansspelen][ref2], ten aanzien van de onder diens vergunning in
      Nederland geplaatste fysieke speelautomaten waarop een kansspelautomatenspel wordt gespeeld;

      c. degene die opbrengst geniet van zonder een vergunning als bedoeld in onderdeel b in Nederland geplaatste fysieke
      speelautomaten waarop een kansspelautomatenspel wordt gespeeld;

      d. de houder van een vergunning als bedoeld in [artikel 31a, eerste lid, van de Wet op de kansspelen][ref3],
      ten aanzien van de onder die vergunning aangeboden kansspelen op afstand, en degene die opbrengst geniet van het
      tijdelijk zonder een vergunning als bedoeld in artikel 31a, eerste lid, van de Wet op de kansspelen aangeboden
      kansspelen op afstand;

      e. de houder van een vergunning als bedoeld in [artikel 15, eerste lid, van de Wet op de kansspelen][ref4] ten
      aanzien van de onder die vergunning aangeboden sportweddenschappen en degene die opbrengst geniet van zonder een
      vergunning als bedoeld in artikel 15, eerste lid, van de Wet op de kansspelen aangeboden sportweddenschappen in
      Nederland;

      f. de houder van een vergunning als bedoeld in [artikel 23, eerste lid, van de Wet op de kansspelen][ref5] ten
      aanzien van de onder die vergunning aangeboden totalisator en degene die opbrengst geniet van zonder een vergunning
      als bedoeld in artikel 23, eerste lid, van de Wet op de kansspelen aangeboden totalisatoren in Nederland;

      g. de gerechtigden tot de prijzen van binnenlandse kansspelen, niet zijnde kansspelen die vallen onder onderdeel a,
      b, c, d, e of f;

      h. de in Nederland wonende of gevestigde gerechtigden tot de prijzen van buitenlandse kansspelen, niet zijnde:

      1°. casinospelen, kansspelautomatenspelen, sportweddenschappen en totalisatoren die worden gehouden of
      georganiseerd door natuurlijke personen of door lichamen van wie er een of meer wonen, onderscheidenlijk zijn
      gevestigd, in een lidstaat van de Europese Unie of in een staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;

      2°. kansspelen op afstand;

      i. de in Nederland wonende of gevestigde gerechtigden tot de prijzen van kansspelen op afstand, niet zijnde
      kansspelen op afstand als bedoeld in onderdeel d.


