preamble:
  text: |-
    Gelet op artikel 16, eerste en tweede lid, van richtlijn nr. 95/21/EG van de Raad van de Europese Unie van 19 juni
    1995, betreffende de naleving met betrekking tot schepen die gebruik maken van havens in de Gemeenschap en varen in
    de onder de jurisdictie van de lid-staten vallende wateren, van internationale normen op het gebied van veiligheid
    van schepen, voorkoming van verontreiniging en leef- en werkomstandigheden aan boord (havenstaatcontrole) (PbEG L
    157) en artikel 14, derde lid, van de Wet havenstaatcontrole;

    Besluit:
