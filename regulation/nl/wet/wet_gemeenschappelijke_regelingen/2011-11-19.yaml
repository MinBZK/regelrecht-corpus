        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
  - number: '27'
    text: |-
      1 Burgemeester en wethouders houden een register bij van de regelingen waaraan hun gemeente deelneemt.

      2 In de registers worden in ieder geval vermeld:

      a. de deelnemers

      b. de wettelijke voorschriften waardoor de bevoegdheden van het samenwerkingsverband worden beheerst

      c. de bevoegdheden die bij de regeling dan wel, met toepassing van [artikel 10, tweede lid tweede volzin][ref1],
      krachtens de regeling zijn overgedragen

      d. het adres en de plaats van vestiging

      e. of een openbaar lichaam of een gemeenschappelijk orgaan is ingesteld.

      3 De registers liggen voor een ieder kosteloos ter inzage. Aan een ieder worden op diens verzoek afschriften van of
      uittreksels uit hetgeen in de registers is ingeschreven ter beschikking gesteld.

      4 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de inrichting van de
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel27
