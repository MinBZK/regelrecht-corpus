  - number: '59'
    text: |-
      1 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten en aan provinciale staten
      van de deelnemende provincies.

      2 De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten en provincies voor
      een ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
      [Artikel 190, tweede en derde lid, van de Gemeentewet][ref1] is van overeenkomstige toepassing.

      3 De raad van een deelnemende gemeente en provinciale staten van een deelnemende provincie kunnen bij het dagelijks
      bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-
      begroting naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de
      ontwerp-begroting, zoals deze aan het algemeen bestuur wordt aangeboden.

      4 Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden der deelnemende gemeenten en de staten der
      deelnemende provincies, die ter zake bij Onze Minister van Binnenlandse Zaken hun zienswijze naar voren kunnen
      brengen.

      5 Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van
      de begroting. In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën
      begrotingswijzigingen hiervan kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
  - number: '61'
    text: |-
      1 De raden, de colleges van burgemeester en wethouders en de burgemeesters van een of meer gemeenten kunnen,
      afzonderlijk of te zamen, met de algemene besturen, de dagelijkse besturen en de voorzitters van een of meer
      waterschappen, ieder voor zover zij voor de eigen gemeente, onderscheidenlijk het eigen waterschap bevoegd zijn,
      een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die gemeenten of
      waterschappen.

      2 Een college van burgemeester en wethouders, en een burgemeester, onderscheidenlijk een dagelijks bestuur en
      een voorzitter van een waterschap gaan niet over tot het treffen van een regeling dan na verkregen toestemming
      van de gemeenteraad, onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.

      3 Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel61
