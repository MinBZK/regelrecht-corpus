  - number: '111'
    text: |-
      1 In afwijking van [artikel 13, negende lid][ref1], kan het algemeen bestuur van een plusregio een voorzitter
      aanwijzen van buiten de kring van het algemeen bestuur.

      2 Indien toepassing wordt gegeven aan het eerste lid, is [artikel 21][ref2] op de voorzitter niet van toepassing.
      Bij of krachtens regeling van het algemeen bestuur, wordt in ieder geval de bezoldiging van de voorzitter geregeld.

      3 Indien toepassing wordt gegeven aan het eerste lid, zijn de [artikelen 66, tweede tot en met vierde lid][ref3],
      en [67 tot en met 71 van de Gemeentewet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel67
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel111
