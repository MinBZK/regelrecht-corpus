        artikel: '99'
        hoofdstuk: X
  - number: '101'
    text: |-
      Indien het een regeling betreft tussen gemeenten die in meer dan een provincie liggen, vindt de toepassing van de
      [artikelen 99][ref1] en [100][ref2] plaats bij gelijkluidende besluiten van gedeputeerde staten van de betrokken
      provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
  - number: '102'
    text: |-
      1 Onze Minister wie het aangaat kan, in overeenstemming met Onze Minister van Binnenlandse Zaken, gedeputeerde
      staten uitnodigen tot het geven van een aanwijzing als bedoeld in [artikel 99, eerste lid][ref1].

      2 Een uitnodiging wordt niet gedaan dan nadat Onze Minister wie het aangaat gedeputeerde staten heeft gehoord.

      3 Bij de uitnodiging stelt Onze Minister wie het aangaat een termijn binnen welke gedeputeerde staten een
      aanwijzing dienen te geven.

      4 Indien niet binnen de termijn, bedoeld in het derde lid, door gedeputeerde staten een aanwijzing is gegeven,
      wordt een aanwijzing gegeven door Onze Minister wie het aangaat, in overeenstemming met Onze Minister van
      Binnenlandse Zaken. [Artikel 99][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel102
    references:
      - id: ref1
