  - number: '86'
    text: |-
      1 Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten
      aanzien van de belangen ter behartiging waarvan zij is getroffen en voor het gebied waarvoor zij geldt, zodanige
      bevoegdheden van regeling en bestuur worden overgedragen, als aan de besturen van de deelnemende provincies en
      waterschappen met betrekking tot hun eigen provincie, onderscheidenlijk waterschap toekomen, met dien verstande
      dat:

      a. aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen
      te heffen dan de rechten, bedoeld in [artikel 223 van de Provinciewet][ref1], de belasting, bedoeld in
      [artikel 222][ref2],en de rechten waarvan de heffing krachtens bijzondere wetten geschiedt;

      b. aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.

      2 Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de aan de regeling deelnemende provincies en waterschappen
      geregeld.

      3 Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende provincie of een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge verhouding. Zij
      kan bepalen, dat de verordening van de provincie of van het waterschap voor het gehele gebied, dan wel voor een
      gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '223'
      - id: ref2
