  - number: '54'
    text: |-
      1 Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten
      aanzien van de belangen ter behartiging waarvan zij is getroffen en voor het gebied waarvoor zij geldt, zodanige
      bevoegdheden van regeling en bestuur worden overgedragen, als aan de besturen van de deelnemende gemeenten en
      provincies met betrekking tot hun eigen gemeente, onderscheidenlijk provincie toekomen, met dien verstande dat:

      a. aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen
      te heffen dan de rioolheffing, bedoeld in [artikel 228a van de Gemeentewet][ref1] en de rechten, bedoeld in
      [artikel 229, eerste lid, onder a en b, van de Gemeentewet][ref2] en in [artikel 223 van de Provinciewet][ref3],
      de belasting, bedoeld in [artikel 222c van de Provinciewet][ref4], de rechten waarvan heffing krachtens bijzondere
      wetten geschiedt en de heffing bedoeld in [artikel 15.33 van de Wet milieubeheer][ref5];

      b. aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.

      2 Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de deelnemende gemeenten en provincies geregeld.

      3 Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende gemeente of provincie, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat
      de verordening van de gemeente of provincie voor het gehele gebied, dan wel voor een gedeelte daarvan geheel of
      gedeeltelijk ophoudt te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel228a
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel15.33
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel54
