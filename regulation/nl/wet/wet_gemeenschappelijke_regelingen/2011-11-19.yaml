  - number: 103e
    text: |-
      Voor zover in dit hoofdstuk niet anders is bepaald, is bij de oplegging van een regeling het bepaalde in
      [hoofdstuk I][ref1], dan wel IV, V, VI of VIII van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
