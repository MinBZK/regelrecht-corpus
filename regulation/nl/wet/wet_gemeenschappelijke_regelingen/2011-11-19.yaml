  - number: 103a
    text: |-
      De commissaris van de Koning treedt voor de toepassing van de [artikelen 99 tot en met 103][ref1] in de plaats van
      gedeputeerde staten, indien het betreft een regeling uitsluitend tussen burgemeesters.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel103a
