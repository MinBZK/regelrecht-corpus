  - number: '25'
    text: |-
      1 Het algemeen bestuur van het openbaar lichaam kan commissies instellen met het oog op de behartiging van bepaalde
      belangen indien de regeling in deze mogelijkheid voorziet. Het algemeen bestuur regelt de bevoegdheden en de
      samenstelling. [Artikel 94][ref1] en [139 tot en met 144 van de Gemeentewet][ref2] en de [artikelen 21][ref3] en
      [23, eerste en tweede lid][ref4] van deze wet zijn van overeenkomstige toepassing.

      2 Het algemeen bestuur gaat niet over tot het instellen van een commissie als bedoeld in het eerste lid dan na
      verkregen toestemming van de raden van elk der deelnemende gemeenten. De toestemming kan slechts worden onthouden
      wegens strijd met het recht of het algemeen belang.

      3 Het algemeen bestuur kan aan een commissie als bedoeld in het eerste lid bevoegdheden van het algemeen bestuur
      en van het dagelijks bestuur van het openbaar lichaam overdragen, tenzij de aard van de bevoegdheid zich daartegen
      verzet. Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:

      a. het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 34][ref5];

      b. het heffen van rechten, bedoeld in [artikel 30, eerste lid, sub a][ref6];

      c. het vaststellen van verordeningen door strafbepaling of politiedwang te handhaven.

      4 Bevoegdheden van het dagelijks bestuur kunnen niet dan op voorstel van het dagelijks bestuur worden overgedragen.

      5 Ten aanzien van een commissie als bedoeld in het eerste lid regelt het algemeen bestuur tevens voor zover zulks
      in verband met aard en omvang van de overgedragen bevoegdheden nodig is:

      a. de werkwijze van de commissie;

      b. de openbaarheid van vergaderingen;

      c. de voorbereiding, de uitvoering en de openbaarmaking van besluiten van de commissie;

      d. het toezicht van het algemeen, respectievelijk het dagelijks bestuur op de uitoefening van bevoegdheden van
      die commissie;

      e. de verhouding van de overgedragen bevoegdheden tot die van het algemeen en het dagelijks bestuur;

      f. de verantwoording aan het algemeen bestuur.

      6 Ten aanzien van de vergadering van een commissie waaraan bevoegdheden van het algemeen bestuur zijn overgedragen
      is [artikel 22, derde, vierde en vijfde lid][ref7] van overeenkomstige toepassing, met inachtneming van door het
      algemeen bestuur vastgestelde nadere regels.

      7 Indien de commissie zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot het
      algemeen bestuur heeft gericht, wordt de geheimhouding in acht genomen totdat het algemeen bestuur haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel21
