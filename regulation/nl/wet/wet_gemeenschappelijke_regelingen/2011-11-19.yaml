preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, nieuwe bepalingen vast te stellen met betrekking tot
    gemeenschappelijke regelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De raden, de colleges van burgemeester en wethouders en de burgemeesters van twee of meer gemeenten kunnen
      afzonderlijk of te zamen, ieder voor zover zij voor de eigen gemeente bevoegd zijn, een gemeenschappelijke regeling
      treffen ter behartiging van een of meer bepaalde belangen van die gemeenten.

      2 De colleges van burgemeester en wethouders en de burgemeesters gaan niet over tot het treffen van een regeling
      dan na verkregen toestemming van de gemeenteraden. De toestemming kan slechts worden onthouden wegens strijd met
      het recht of het algemeen belang.

      3 Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel1
  - number: '8'
    text: |-
      1 Bij de regeling kan een openbaar lichaam worden ingesteld. Het openbaar lichaam is rechtspersoon.

      2 In daarvoor bijzonder in aanmerking komende gevallen kan bij de regeling, in plaats van een openbaar lichaam, een
      gemeenschappelijk orgaan worden ingesteld.

      3 In de regeling kan worden bepaald dat daarin omschreven bevoegdheden van bestuursorganen of van ambtenaren van
      aan de regeling deelnemende gemeenten worden uitgeoefend door bestuursorganen, onderscheidenlijk door ambtenaren
      van een der deelnemende gemeenten.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel8
  - number: '9'
    text: |-
      1 De voor onbepaalde tijd getroffen regeling houdt bepalingen in omtrent wijziging, opheffing, toetreding en
      uittreding.

      2 De regeling waarbij een openbaar lichaam wordt ingesteld houdt bepalingen in omtrent de vereffening van het
      vermogen ingeval dat openbaar lichaam wordt ontbonden.

      3 Het bij een regeling ingestelde openbaar lichaam blijft na zijn ontbinding voortbestaan voorzover dit tot
      vereffening van zijn vermogen nodig is.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel9
  - number: '10'
    text: |-
      1 De regeling vermeldt het belang of de belangen ter behartiging waarvan zij is getroffen of gewijzigd.

      2 Een regeling, waarbij gebruik wordt gemaakt van de bevoegdheid, bedoeld in
      [artikel 8, eerste of tweede lid][ref1], geeft aan welke bevoegdheden de besturen van de deelnemende gemeenten
      aan het bestuur van het openbaar lichaam onderscheidenlijk aan het gemeenschappelijk orgaan bij het aangaan van de
      regeling overdragen. Een regeling als hier bedoeld kan bepalingen inhouden omtrent de wijze waarop verandering kan
      worden gebracht in de overgedragen bevoegdheden.

      3 Een regeling als bedoeld in het tweede lid houdt bepalingen in omtrent de inrichting en samenstelling van het
      bestuur van het openbaar lichaam onderscheidenlijk de samenstelling van het gemeenschappelijk orgaan en wijst de
      plaats van vestiging aan.

      4 Een regeling als bedoeld in [artikel 8, eerste of tweede lid][ref2], kan aangeven dat een ombudsman
      of ombudscommissie van een van de deelnemers aan de gemeenschappelijke regeling als bedoeld in
      [artikel 81p, eerste lid, van de Gemeentewet][ref3], [artikel 79q, eerste lid, van de Provinciewet][ref4] of
      [artikel 51b, eerste lid, van de Waterschapswet][ref5] bevoegd is tot de behandeling van verzoekschriften als
      bedoeld in [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref6]. Indien een regeling de hiervoor
      bedoelde bevoegdheid instelt, dan wel deze beëindigt, zendt het bestuur de regeling aan de Nationale ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
