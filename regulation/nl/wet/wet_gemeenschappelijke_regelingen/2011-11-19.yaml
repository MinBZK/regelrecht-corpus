  - number: 103c
    text: |-
      1 De aanwijzing, bedoeld in [artikel 99, eerste lid][ref1], kan ook betreffen de deelneming van gemeenten aan
      een regeling als bedoeld in de [hoofdstukken IV][ref2] en [VI][ref3], alsmede [VIII][ref4], voor zover daaraan
      provincies deelnemen, met dien verstande dat de aanwijzing wordt gegeven door Onze Minister wie het aangaat, in
      overeenstemming met Onze Minister van Binnenlandse Zaken. [Artikel 99, derde lid][ref5], is van overeenkomstige
      toepassing.

      2 Bij de aanwijzing, bedoeld in het eerste lid, stelt Onze Minister wie het aangaat een termijn binnen welke een
      regeling ter kennisneming aan hem dient te worden gezonden. Artikel 103 is van overeenkomstige toepassing.

      3 Bij toepassing van het eerste lid pleegt Onze Minister wie het aangaat tevens overleg met de besturen van de
      betrokken waterschappen, andere openbare lichamen en rechtspersonen. Bij toepassing van het tweede lid worden deze
      besturen tevens gehoord.


