  - number: '99'
    text: |-
      1 Op verzoek van het bestuur van een of meer gemeenten kunnen gedeputeerde staten, indien een zwaarwegend openbaar
      belang dat vereist, gemeenten aanwijzen waarvan de besturen een gemeenschappelijke regeling moeten treffen ter
      behartiging van een of meer bepaalde belangen.

      2 Een aanwijzing kan ook betreffen de verplichting tot wijziging of opheffing van een bestaande regeling, alsmede
      de verplichting tot toetreding tot of uittreding uit een bestaande regeling.

      3 Alvorens een aanwijzing te geven, plegen gedeputeerde staten overleg met de besturen van de betrokken gemeenten.
      Bij een aanwijzing als bedoeld in het tweede lid, plegen gedeputeerde staten tevens overleg met het bestuur van
      het openbaar lichaam of het gemeenschappelijk orgaan dat bij de betreffende regeling is ingesteld. Het overleg
      duurt ten hoogste dertien weken, te rekenen vanaf de datum waarop gedeputeerde staten de betrokken besturen tot het
      voeren van overleg in de gelegenheid hebben gesteld.

      4 Bij de aanwijzing stellen gedeputeerde staten een termijn binnen welke een regeling ter kennisneming aan hen
      dient te worden gezonden. Deze termijn bedraagt ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel99
  - number: '100'
    text: |-
      1 Gedeputeerde staten leggen uiterlijk binnen zes maanden na het verstrijken van de termijn,
      bedoeld in [artikel 99, vierde lid][ref1], een regeling op overeenkomstig de aanwijzing, bedoeld in
      [artikel 99, eerste lid][ref2], indien geen regeling aan hen is gezonden, of indien uit de ter kennisneming
      toegezonden regeling blijkt dat aan de aanwijzing onvoldoende gevolg is gegeven.

      2 Een oplegging kan ook betreffen de oplegging van een wijziging of opheffing van een bestaande regeling, alsmede
      de oplegging van een toetreding tot of uittreding uit een bestaande regeling.

      3 Alvorens een regeling op te leggen, horen gedeputeerde staten de besturen van de betrokken gemeenten over het
      ontwerp van de op te leggen regeling. Bij een oplegging als bedoeld in het tweede lid, horen gedeputeerde staten
      tevens het bestuur van het openbaar lichaam of het gemeenschappelijk orgaan dat bij de betreffende regeling is
      ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel100
    references:
