        paragraaf: '2'
  - number: '98'
    text: |-
      Van overeenkomstige toepassing is [hoofdstuk I][ref1], indien een gemeente de regeling aangaat,
      [hoofdstuk II][ref2], indien een provincie de regeling aangaat, of [hoofdstuk III][ref3], indien een waterschap de
      regeling aangaat. Wanneer het een regeling betreft met deelnemers bedoeld in de [artikelen 96, onderdeel ][ref4]
      en [97, eerste lid][ref5], zijn de genoemde hoofdstukken ten aanzien van deze deelnemers zoveel mogelijk van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel96
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel97
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel98
