  - number: '129'
    text: |-
      1 Geschillen omtrent de toepassing, in de ruimste zin, van een regeling tussen besturen van deelnemende
      openbare lichamen of tussen besturen van een of meer deelnemende openbare lichamen en het bestuur van het
      samenwerkingslichaam of het gemeenschappelijk orgaan worden door de Rijksvertegenwoordiger beslist, voor zover zij
      niet behoren tot die, vermeld in [artikel 112, eerste lid, van de Grondwet][ref1] of tot die, waarvan de beslissing
      krachtens artikel 112, tweede lid, van de Grondwet is opgedragen hetzij aan de rechterlijke macht, hetzij aan
      gerechten die niet tot de rechterlijke macht behoren. In eerste en enige aanleg wordt het geschil voorgelegd aan
      het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba.

      2 De Rijksvertegenwoordiger kan bij de beslissing van het geschil het desbetreffende bestuur opdragen een besluit
      te nemen met inachtneming van het in hun beslissing bepaalde en binnen een daartoe te stellen termijn. Indien
      binnen de gestelde termijn het besluit niet is genomen, geschiedt dit door de Rijksvertegenwoordiger.

      3 In spoedeisende gevallen kan de Rijksvertegenwoordiger bij de beslissing van het geschil in de plaats van het
      desbetreffende bestuur een besluit als bedoeld in het tweede lid nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel112
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '112'
  - number: '130'
    text: |-
      1 Aan het bestuur van het samenwerkingslichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten
      aanzien van de belangen ter behartiging waarvan zij wordt getroffen, en voor het gebied waarvoor zij geldt,
      zodanige bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de aan de regeling
      deelnemende openbare lichamen toekomen, met dien verstande dat:

      a. aan het bestuur van het samenwerkingslichaam niet de bevoegdheid kan worden overgedragen andere belastingen
      te heffen dan de belasting, bedoeld in artikel 60 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius
      en Saba, de rechten bedoeld in artikel 62 van de Wet financiën Bonaire, Sint Eustatius en Saba en de rechten
      waarvan de heffing krachtens andere wetten dan de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba
      geschiedt;

      b. aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.

      2 Indien toepassing wordt gegeven aan het bepaalde in het eerste lid wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de deelnemende openbare lichamen geregeld.

      3 Voor zover een verordening van het samenwerkingslichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemend openbaar lichaam Bonaire, Sint Eustatius of Saba, regelt eerstbedoelde verordening de onderlinge
      verhouding. Zij kan bepalen, dat de verordening van een van de openbare lichamen Bonaire, Sint Eustatius of Saba
      voor het gehele gebied dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel130
  - number: '131'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het samenwerkingslichaam van
      rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel131
  - number: '132'
    text: |-
      Een verordening van het samenwerkingslichaam tot heffing van een belasting regelt voor welke bestuurscolleges of
      ambtenaren de bevoegdheden, bedoeld in hoofdstuk IV van de Wet financiën openbare lichamen Bonaire, Sint Eustatius
      en Saba, zullen gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel132
  - number: '133'
    text: |-
      1 Ten aanzien van de bevoegdheden van het bestuur van het samenwerkingslichaam of die van het gemeenschappelijk
      orgaan zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn
      gesteld voor de verdeling van de bevoegdheden van de eilandsbesturen over de eilandelijke bestuursorganen, voor
      de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.

      2 De besturen van de deelnemende openbare lichamen kunnen bij de regeling beperkingen aanbrengen in de bevoegdheden
      die door het bestuur van het samenwerkingslichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen
      worden ontleend aan de regelen, bedoeld in het eerste lid.

      3 Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste lid, onevenredig belastend zou zijn in verhouding tot het met die regels beoogde doel
      kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel133
  - number: '134'
    text: |-
      1 Het algemeen bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan stelt de begroting vast in het
      jaar voorafgaande aan dat waarvoor zij dient.

      2 Het algemeen bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in
      het jaar volgende op het jaar waarop deze betrekking heeft.

      3 Het dagelijks bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen
      twee weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de
      jaarrekening betrekking heeft aan het College financieel toezicht Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel134
  - number: '135'
    text: |-
      1 Het dagelijks bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan zendt de ontwerpbegroting
      zes weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de eilandsraden van de deelnemende openbare lichamen.

      2 De ontwerpbegroting wordt door de zorg van de besturen van de deelnemende openbare lichamen voor een ieder ter
      inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld. Artikel 18, eerste lid, van de Wet
      financiën openbare lichamen Bonaire, Sint Eustatius en Saba is van overeenkomstige toepassing, met dien verstande
      dat voor «eilandsraad» wordt gelezen «algemeen bestuur».

      3 De eilandsraden van de deelnemende openbare lichamen kunnen bij het dagelijks bestuur van het
      samenwerkingslichaam onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerpbegroting naar
      voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerpbegroting,
      zoals deze aan het algemeen bestuur wordt aangeboden.

      4 Nadat deze is vastgesteld, zendt het algemeen bestuur van het samenwerkingslichaam onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van de deelnemende openbare lichamen, die ter zake
      bij het College financieel toezicht Bonaire, Sint Eustatius en Saba hun zienswijze naar voren kunnen brengen.

      5 Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van
      de begroting. In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën
      begrotingswijzigingen hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel135
  - number: '137'
    text: |-
      Waar in enig wettelijk voorschrift in algemene zin naar de Wet gemeenschappelijke regelingen wordt verwezen, wordt
      deze verwijzing geacht te zijn geschied naar deze wet.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel137
  - number: '139'
    text: |-
      1 Onze Minister van Binnenlandse Zaken is belast met de uitvoering van deze wet.

      2 Voor zover bij die uitvoering belangen zijn betrokken, welke aan de zorg van een andere minister zijn
      toevertrouwd, geschiedt de uitvoering in overeenstemming met de desbetreffende minister.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel139
  - number: '140'
    text: Deze wet kan worden aangehaald als "Wet gemeenschappelijke regelingen".
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel140
  - number: '141'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel141
