        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: '103'
    text: |-
      1 Bij koninklijk besluit wordt een regeling overeenkomstig de aanwijzing, bedoeld in
      [artikel 102, vierde lid][ref1], opgelegd, indien binnen zes maanden na de aanwijzing geen regeling ter
      kennisneming aan Onze Minister wie het aangaat en Onze Minister van Binnenlandse Zaken is gezonden of indien
      uit de ter kennisneming toegezonden regeling blijkt dat aan de aanwijzing onvoldoende gevolg is gegeven.
      [Artikel 100, tweede lid][ref2], is van overeenkomstige toepassing.

      2 Alvorens een regeling wordt opgelegd hoort Onze Minister wie het aangaat de besturen van de betrokken
      gemeenten en gedeputeerde staten van de betrokken provincie over het ontwerp van de op te leggen regeling.
      [Artikel 100, derde lid][ref3], is van overeenkomstige toepassing.

      3 De voordracht tot oplegging wordt gedaan door of mede door Onze Minister van Binnenlandse Zaken.

      4 Besluiten die geheel of gedeeltelijk met toepassing van het eerste lid tot stand zijn gekomen, worden ter
      kennisneming gezonden aan gedeputeerde staten van de betrokken provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel103
