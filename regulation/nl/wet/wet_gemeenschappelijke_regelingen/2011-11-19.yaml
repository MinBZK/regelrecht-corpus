        hoofdstuk: XV
  - number: '57'
    text: |-
      1 Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      voor de verdeling van de bevoegdheden van de provinciale besturen over de provinciale bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.

      2 Indien en voor zover de in het eerste lid bedoelde bevoegdheden van het bestuur van een openbaar lichaam en die
      van een gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten zijn overgedragen zijn
      daarop, in afwijking van het bepaalde in het eerste lid, van overeenkomstige toepassing de regels, in de ruimste
      zin, welke bij of krachtens de wet zijn gesteld voor de verdeling van de bevoegdheden van de gemeentebesturen over
      de gemeentelijke bestuursorganen, voor de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop.

      3 Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die door het bestuur van het openbaar
      lichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden ontleend aan de regels, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel57
  - number: '58'
    text: |-
      1 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.

      2 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting
      dient, aan Onze Minister van Binnenlandse Zaken.

      3 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.

      4 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel58
  - number: 58a
    text: |-
      1 Indien het openbaar lichaam een specifieke uitkering als bedoeld in
      [artikel 15a van de Financiële-verhoudingswet][ref1] ontvangt van het Rijk of middelen ontvangt van de deelnemende
      provincies en gemeenten, die afkomstig zijn uit een specifieke uitkering, zijn de [artikelen 17a][ref2] en
      [17b van de Financiële-verhoudingswet][ref3] op de informatie ten behoeve van de verantwoording over deze
      middelen, van overeenkomstige toepassing op het openbaar lichaam, met dien verstande dat:

      a. voor gedeputeerde staten en het college van burgemeester en wethouders wordt gelezen: het dagelijks bestuur van
      het openbaar lichaam;

      b. de in [artikel 17b, derde lid, van de Financiële-verhoudingswet][ref4] bedoelde opschorting betrekking heeft
      op de betalingen op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref5] aan de provincies en
      gemeenten die aan de regeling deelnemen.

      2 De ingevolge [artikel 186, tweede lid, aanhef en onder b, en derde lid, van de Gemeentewet][ref6] gestelde
      regels, alsmede het vierde tot en met het achtste lid van dat artikel, zijn van overeenkomstige toepassing op het
      openbaar lichaam, met dien verstande dat:

      a. voor het college wordt gelezen: het dagelijks bestuur van het openbaar lichaam;

      b. de in [artikel 186, achtste lid, van de Gemeentewet][ref7] bedoelde opschorting betrekking heeft op de
      betalingen op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref8] aan de provincies en gemeenten
      die aan de regeling deelnemen.


