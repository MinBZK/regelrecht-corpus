  - number: 103f
    text: |-
      1 Tegen een besluit tot aanwijzing als bedoeld in de [artikelen 99, eerste lid][ref1], [102, vierde lid][ref2],
      [103][ref3] en [103][ref4], kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad
      van State.

      2 Tegen een besluit tot oplegging als bedoeld in de [artikelen 100, eerste lid][ref5], en [103, eerste lid][ref6],
      kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      3 Bezwaar of beroep tegen een besluit tot oplegging kan geen grond vinden in bezwaar of beroep tegen het
      aanwijzingsbesluit.


