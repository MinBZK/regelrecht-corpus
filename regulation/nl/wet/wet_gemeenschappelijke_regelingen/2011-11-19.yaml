  - number: '16'
    text: |-
      1 De regeling houdt bepalingen in omtrent de wijze waarop een lid van het algemeen bestuur van het openbaar lichaam
      of een lid van het gemeenschappelijk orgaan aan de raad die dit lid heeft aangewezen, de door een of meer leden van
      die raad gevraagde inlichtingen dient te verstrekken.

      2 De regeling houdt tevens bepalingen in omtrent de wijze, waarop het dagelijks bestuur en een of meer leden
      daarvan aan het algemeen bestuur de door een of meer leden daarvan gevraagde inlichtingen verstrekken, alsmede door
      het algemeen bestuur ter verantwoording kunnen worden geroepen.

      3 De regeling houdt bepalingen in omtrent de wijze waarop een lid van het algemeen bestuur van het openbaar lichaam
      of een lid van het gemeenschappelijk orgaan door de raad die dit lid heeft aangewezen, ter verantwoording kan
      worden geroepen voor het door hem in dat bestuur onderscheidenlijk dat orgaan gevoerde beleid.

      4 Ingeval toepassing is gegeven aan het bepaalde in [artikel 13, vijfde lid, onder ][ref1], houdt de regeling
      bepalingen in omtrent de wijze waarop aan de raad die geen lid van het algemeen bestuur van het openbaar lichaam
      of van het gemeenschappelijk orgaan aanwijst, de door een of meer leden van die raad gevraagde inlichtingen worden
      verstrekt en de door die raad gevraagde verantwoording wordt afgelegd voor het door dat bestuur onderscheidenlijk
      dat orgaan gevoerde beleid.

      5 De regeling houdt bepalingen in omtrent de bevoegdheid van de raad, een door hem aangewezen lid van het
      algemeen bestuur van het openbaar lichaam of een door hem aangewezen lid van het gemeenschappelijk orgaan,
      ontslag te verlenen, indien dit lid het vertrouwen van de raad niet meer bezit. Op het ontslagbesluit is
      [artikel 7:1 van de Algemene wet bestuursrecht][ref2] niet van toepassing.

      6 Bij het verstrekken van inlichtingen ingevolge het eerste of het vierde lid, of het afleggen van verantwoording
      ingevolge het derde of het vierde lid, verschaft een lid van het algemeen bestuur van het openbaar lichaam of
      een lid van het gemeenschappelijk orgaan over zaken waaromtrent krachtens [artikel 23][ref3] geheimhouding is
      opgelegd slechts informatie, indien krachtens [artikel 25 van de Gemeentewet][ref4] geheimhouding is opgelegd.
      Laatstbedoelde geheimhouding kan eerst worden opgeheven, nadat door het algemeen bestuur van het openbaar lichaam
      of door het gemeenschappelijk orgaan tot opheffing van de geheimhouding is besloten.


