  - number: '31'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel31
  - number: '32'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
  - number: '33'
    text: |-
      1 Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld voor
      de verdeling van de bevoegdheden van de gemeentebesturen over de gemeentelijke bestuursorganen, voor de uitoefening
      van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of krachtens deze wet
      is afgeweken.

      2 De besturen van de deelnemende gemeenten kunnen bij de regeling beperkingen aanbrengen in de bevoegdheden die
      door het bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden
      ontleend aan de regelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel33
  - number: '34'
    text: |-
      1 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.

      2 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting
      dient, aan gedeputeerde staten.

      3 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.

      4 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel34
  - number: 34a
    text: |-
      1 Indien het openbaar lichaam een specifieke uitkering als bedoeld in
      [artikel 15a van de Financiële-verhoudingswet][ref1] ontvangt van het Rijk of middelen ontvangt van de
      deelnemende gemeenten, die afkomstig zijn uit een specifieke uitkering, zijn de [artikelen, 17a][ref2] en
      [17b van de Financiële-verhoudingswet][ref3] op de informatie ten behoeve van de verantwoording over deze
      middelen, van overeenkomstige toepassing, met dien verstande dat:

      a. voor gedeputeerde staten en het college van burgemeester en wethouders wordt gelezen: het dagelijks bestuur van
      het openbaar lichaam;

      b. de in [artikel 17b, derde lid, van de Financiële-verhoudingswet][ref4] bedoelde opschorting betrekking heeft op
      de betalingen op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref5] aan de gemeenten die aan de
      regeling deelnemen.

      2 De ingevolge [artikel 186, tweede lid, aanhef en onder b, en derde lid, van de Gemeentewet][ref6] gestelde
      regels, alsmede het vierde tot en met het achtste lid van dat artikel, zijn van overeenkomstige toepassing op het
      openbaar lichaam, met dien verstande dat:

      a. voor het college wordt gelezen: het dagelijks bestuur van het openbaar lichaam;

      b. de in [artikel 186, achtste lid, van de Gemeentewet][ref7] bedoelde opschorting betrekking heeft op de
      betalingen op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref8] aan de gemeenten die aan de
      regeling deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
