  - number: '124'
    text: |-
      1 De eilandsraden, de bestuurscolleges en de gezaghebbers van twee of meer openbare lichamen Bonaire, Sint
      Eustatius of Saba kunnen afzonderlijk of tezamen, ieder voor zover zij voor het eigen openbaar lichaam bevoegd
      zijn, een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die openbare
      lichamen.

      2 De bestuurscolleges en de gezaghebbers gaan niet over tot het treffen van een regeling dan na verkregen
      toestemming van de eilandsraden. De toestemming kan slechts worden onthouden wegens strijd met het recht of het
      algemeen belang.

      3 Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel124
  - number: '125'
    text: |-
      1 Bij de regeling kan een openbaar lichaam onder de naam samenwerkingslichaam worden ingesteld. Het
      samenwerkingslichaam is een rechtspersoon.

      2 In daarvoor bijzonder in aanmerking komende gevallen kan bij de regeling, in plaats van een openbaar lichaam, een
      gemeenschappelijk orgaan worden ingesteld.

      3 In een regeling kan worden bepaald dat daarin omschreven bevoegdheden van bestuursorganen of van ambtenaren van
      twee of meer aan de regeling deelnemende openbare lichamen Bonaire, Sint Eustatius of Saba worden uitgeoefend door
      bestuursorganen, onderscheidenlijk door ambtenaren van een van de deelnemende openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel125
  - number: '126'
    text: |-
      De [artikelen 9 tot en met 28][ref1] zijn van overeenkomstige toepassing met uitzondering van de
      [artikelen 20][ref2], [22][ref3], [24][ref4], [25][ref5] en [28][ref6], met dien verstande dat:

      a. telkens in die bepalingen wordt gelezen voor:

        - gemeente: openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - gemeenten: openbare lichamen Bonaire, Sint Eustatius en Saba;
        - gemeentebestuur: eilandbestuur;
        - gemeentebesturen: eilandbesturen;
        - gemeenteraad: eilandsraad;
        - gemeenteraden: eilandsraden;
        - raad: eilandsraad;
        - raden: eilandsraden
        - college van burgemeester en wethouders: bestuurscollege
        - burgemeester: gezaghebber;
        - burgemeesters: gezaghebbers;
        - wethouder: eilandgedeputeerde;
        - wethouders: eilandgedeputeerden;
        - openbaar lichaam: samenwerkingslichaam;
        - gedeputeerde staten: Rijksvertegenwoordiger, bedoeld in artikel 1, eerste lid, onder d, van de Wet openbare
      lichamen Bonaire, Sint Eustatius en Saba;

      b. bij de toepassing van [artikel 10, vierde lid][ref7], voor [artikel 81p, eerste lid, van de Gemeentewet][ref8],
      [artikel 79q, eerste lid, van de Provinciewet][ref9] of [artikel 51b eerste lid, van de Waterschapswet][ref10]
      wordt gelezen: artikel 107, eerste lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba;

      c. bij de toepassing van [artikel 14, eerste lid][ref11], voor dezelfde gemeente wordt gelezen: hetzelfde openbaar
      lichaam Bonaire, Sint Eustatius of Saba;

      d. bij de toepassing van [artikel 16, vijfde lid][ref12], voor [artikel 7:1 van de Algemene wet bestuursrecht][ref13]
      wordt gelezen: [artikel 4:8 van de Algemene wet bestuursrecht][ref14] en artikel 7, eerste lid, van de Wet
      administratieve rechtspraak BES;

      e. bij de toepassing van [artikel 16, zesde lid][ref15], voor [artikel 25 van de Gemeentewet][ref16] wordt gelezen:
      artikel 26 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba;

      f. bij de toepassing van [artikel 21, tweede lid][ref17], voor [artikel 44, vijfde lid, van de Gemeentewet][ref18],
      wordt gelezen: artikel 56, vijfde lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba;

      g. bij de toepassing van [artikel 21, vijfde lid][ref19], voor [artikel 99 van de Gemeentewet][ref20], wordt
      gelezen: artikel 123 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba;

      h. bij de toepassing van [artikel 23, eerste en tweede lid][ref21], voor
      [artikel 10 van de Wet openbaarheid van bestuur][ref22] telkens wordt gelezen: artikel 11 van de Wet openbaarheid
      van bestuur BES.


