  - number: '118'
    text: |-
      Een regeling voorziet erin dat het algemeen bestuur van de plusregio ter behartiging van de economische
      ontwikkeling van de plusregio ten minste:

      a. periodiek een regionaal-economische ontwikkelingsstrategie opstelt;

      b. het beleid aangeeft ter zake van de uitoefening van zijn bevoegdheden met betrekking tot bedrijventerreinen,
      kantoorlocaties en detailhandelsvoorzieningen die van regionaal belang zijn, daaronder mede begrepen de zee- en
      luchthavens en de daarbij behorende bedrijfslocaties;

      c. de hoofdlijnen vaststelt van een regionaal promotie- en acquisitiebeleid gericht op bedrijfsvestiging en
      toerisme.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel118
  - number: '119'
    text: |-
      1 Een regeling voorziet in de bevoegdheid van het algemeen bestuur van een plusregio voorschriften te geven met
      betrekking tot het door de gemeenten in die regio verwerven en uitgeven van gronden, de aanleg van voorzieningen
      van openbaar nut, het verhaal van kosten daarvan, alsmede de mate waarin de financiële gevolgen worden verdeeld
      over de gemeenten in de regio.

      2 Een regeling voorziet tevens in de bevoegdheid van het algemeen bestuur van een plusregio gebieden aan te
      wijzen, ten aanzien waarvan dat bestuur kan bepalen dat de verwerving en de uitgifte van de gronden, de aanleg van
      voorzieningen van openbaar nut, alsmede het verhaal van kosten daarvan, uitsluitend door of vanwege het bestuur van
      die regio kan plaatsvinden.

      3 Een regeling voorziet voorts in de bevoegdheid van het bestuur van een plusregio voorschriften te geven met
      betrekking tot het onderhoud en het beheer van de in het eerste en het tweede lid bedoelde gronden.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel119
  - number: '120'
    text: |-
      1 Een geschil omtrent de uitnodiging van gedeputeerde staten, bedoeld in [artikel 106, eerste lid][ref1], wordt
      beslist door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Indien het geschilpunt daartoe aanleiding
      geeft, beslist hij in overeenstemming met Onze Ministers wie het mede aangaat.

      2 De termijn, genoemd in [artikel 108, eerste lid][ref2], wordt opgeschort totdat op het geschil is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel108
