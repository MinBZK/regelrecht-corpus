  - number: '48'
    text: |-
      1 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan provinciale staten van de deelnemende provincies.

      2 De ontwerp-begroting wordt door de zorg van de besturen van de deelnemende provincies voor een ieder ter
      inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld. Van de terinzagelegging en de
      verkrijgbaarstelling geschiedt openbare kennisgeving.

      3 Provinciale staten van de deelnemende provincies kunnen bij het dagelijks bestuur van het openbaar lichaam
      onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het
      dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan
      het algemeen bestuur wordt aangeboden.

      4 Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan provinciale staten der deelnemende provincies, die ter zake
      bij Onze Minister van Binnenlandse Zaken hun zienswijze naar voren kunnen brengen.

      5 Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van
      de begroting. In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën
      begrotingswijzigingen hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel48
  - number: '50'
    text: |-
      1 De algemene besturen, de dagelijkse besturen en de voorzitters van twee of meer waterschappen kunnen afzonderlijk
      of tezamen, ieder voor zover zij voor het eigen waterschap bevoegd zijn, een gemeenschappelijke regeling treffen
      ter behartiging van een of meer bepaalde belangen van die waterschappen.

      2 De dagelijkse besturen en de voorzitters van waterschappen gaan niet over tot het treffen van een regeling dan
      na verkregen toestemming van de algemene besturen van de waterschappen.De toestemming kan slechts worden onthouden
      wegens strijd met het recht of het algemeen belang.

      3 Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel50
  - number: 50a
    text: |-
      1 De [artikelen 8 tot en met 24][ref1] en [26 tot en met 29][ref2] zijn van overeenkomstige toepassing, met dien
      verstande dat:

      a. bij de toepassing van [artikel 16, zesde lid][ref3], voor de woorden "[artikel 25 van de Gemeentewet][ref4]"
      wordt gelezen: het reglement van het waterschap dat het lid heeft aangewezen;

      b. bij de toepassing van [artikel 21, vijfde lid][ref5], voor de woorden "[Artikel 99 van de Gemeentewet][ref6]"
      wordt gelezen: Hetgeen in de voor de deelnemende waterschappen geldende reglementen overigens omtrent vergoedingen
      en tegemoetkomingen is bepaald;

      c. bij de toepassing van [artikel 22, eerste lid][ref7], voor de woorden "De [artikelen 16][ref8], [17][ref9],
      [19][ref10], [20][ref11], [22][ref12], [26][ref13] en [28 tot en met 33 van de Gemeentewet][ref14]" wordt gelezen:
      De desbetreffende bepalingen uit de voor de deelnemende waterschappen geldende reglementen;

      d. bij de toepassing van [artikel 27, eerste lid][ref15], voor «Burgemeester en wethouders» wordt gelezen
      «Gedeputeerde staten» en voor «hun gemeente»: in hun provincie gelegen waterschappen.

      2 Wanneer bij de toepassing van voor de deelnemende waterschappen geldende reglementen als bedoeld in het vorige
      lid, onderdeel b en c en in [artikel 50e][ref16] de desbetreffende bepalingen in die reglementen onderling
      verschillen, wordt in de regeling aangegeven welke bepalingen van toepassing zijn.


