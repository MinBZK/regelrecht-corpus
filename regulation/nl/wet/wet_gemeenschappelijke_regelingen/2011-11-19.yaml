  - number: 50k
    text: |-
      1 Op wijziging van, alsmede uittreding uit en toetreding tot een regeling als bedoeld in [artikel 50][ref1], zijn
      de [artikelen 50][ref2], [50][ref3] en [50][ref4] van overeenkomstige toepassing.

      2 Een besluit tot opheffing van een regeling wordt aan gedeputeerde staten toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50h
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel50h
