        artikel: 222c
  - number: '87'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel87
  - number: '88'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Provinciewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: '89'
    text: |-
      1 Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      voor de verdeling van de bevoegdheden van de provinciale besturen over de provinciale bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.

      2 Indien en voor zover de in het eerste lid bedoelde bevoegdheden van het bestuur van een openbaar lichaam en die
      van een gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen
      zijn daarop, in afwijking van het bepaalde in het eerste lid, van overeenkomstige toepassing de regels, in de
      ruimste zin, welke bij of krachtens de wet zijn gesteld voor de verdeling van de bevoegdheden van de deelnemende
      waterschappen over hun bestuursorganen, voor de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop.

      3 De besturen van de deelnemende provincies en waterschappen kunnen bij de regeling beperkingen aanbrengen in de
      bevoegdheden die door het bestuur van het openbaar lichaam, onderscheidenlijk het gemeenschappelijk orgaan zouden
      kunnen worden ontleend aan de regels, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel89
  - number: '90'
    text: |-
      1 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.

      2 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting
      dient, aan Onze Minister van Binnenlandse Zaken.

      3 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.

      4 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel90
  - number: '91'
    text: |-
      1 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan provinciale staten van de deelnemende provincies en aan de
      algemene besturen van de deelnemende waterschappen.

      2 De ontwerp-begroting wordt door de zorg van de aan de regeling deelnemende provincies en waterschappen voor een
      ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld. Van de terinzagelegging en
      de verkrijgbaarstelling geschiedt openbare kennisgeving.

      3 Provinciale staten van de deelnemende provincies en de algemene besturen van de deelnemende waterschappen kunnen
      bij het dagelijks bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze
      over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is
      vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt aangeboden.

      4 Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan provinciale staten van de deelnemende provincies en aan de
      algemene besturen van de deelnemende waterschappen, die ter zake bij Onze Minister van Binnenlandse Zaken hun
      zienswijze naar voren kunnen brengen.

      5 Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van
      de begroting. In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën
      begrotingswijzigingen hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel91
  - number: '93'
    text: |-
      Aan een regeling als bedoeld in de [hoofdstukken I tot en met VII][ref1] kunnen, indien zij daartoe overigens
      bevoegd zijn, tevens deelnemen:

      a. een of meer andere openbare lichamen dan gemeenten, provincies en waterschappen;

      b. een of meer andere rechtspersonen, indien hun bestuur bij koninklijk besluit, dat in de *Nederlandse
      Staatscourant* wordt geplaatst, daartoe is gemachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
  - number: '94'
    text: |-
      1 Deelneming vanwege het Rijk geschiedt bij besluit van Onze betrokken minister. Het besluit regelt mede de
      gevolgen van de deelneming.

      2 Indien vanwege het Rijk wordt deelgenomen aan een regeling waarbij gebruik wordt gemaakt van een bevoegdheid
      als bedoeld in [artikel 8][ref1], wordt een besluit als bedoeld in het eerste lid aan de beide kamers der Staten-
      Generaal overgelegd. Het treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij besluit van Onze betrokken Minister wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van het besluit bij wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '95'
    text: |-
      Het bepaalde in de [hoofdstukken I tot en met VII][ref1] is van overeenkomstige toepassing, met dien
      verstande dat, wanneer het een regeling betreft met deelnemers bedoeld in de [artikelen 93, onderdeel ][ref2]
      en [94, eerste lid][ref3], de genoemde hoofdstukken ten aanzien van deze deelnemers zoveel mogelijk van
      overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel94
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '93'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '94'
        hoofdstuk: VIII
  - number: '96'
    text: |-
      De raad en het college van burgemeester en wethouders van een gemeente, provinciale staten en gedeputeerde staten
      van een provincie, onderscheidenlijk het algemeen bestuur en het dagelijks bestuur van een waterschap kunnen, ieder
      voorzover zij voor de eigen gemeente, de eigen provincie, onderscheidenlijk het eigen waterschap bevoegd zijn,
      een gemeenschappelijke regeling treffen ter behartiging van bepaalde belangen van die gemeente, die provincie,
      onderscheidenlijk dat waterschap met - indien deze daartoe overigens bevoegd zijn - de besturen van:

      a. een of meer andere openbare lichamen dan gemeenten, provincies en waterschappen;

      b. een of meer andere rechtspersonen, indien zij bij koninklijk besluit dat in de *Nederlandse Staatscourant* wordt
      geplaatst, daartoe zijn gemachtigd.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel96
  - number: '97'
    text: |-
      1 Deelneming vanwege het Rijk geschiedt bij besluit van Onze betrokken minister. Het besluit regelt mede de
      gevolgen van de deelneming.

      2 Indien vanwege het Rijk wordt deelgenomen aan een regeling waarbij gebruik wordt gemaakt van een bevoegdheid
      als bedoeld in [artikel 8][ref1], wordt een besluit als bedoeld in het eerste lid aan de beide kamers der Staten-
      Generaal overgelegd. Het treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij besluit van Onze betrokken Minister wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van het besluit bij wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel97
    references:
