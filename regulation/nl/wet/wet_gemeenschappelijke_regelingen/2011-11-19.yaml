        paragraaf: '2'
  - number: '115'
    text: |-
      1 Het bestuur van een gemeente in een plusregio verleent zijn medewerking aan de uitvoering van besluiten die het
      bestuur van de plusregio neemt in verband met de uitoefening van de aan dat bestuur opgedragen bevoegdheden.

      2 Indien het bestuur van een gemeente naar het oordeel van het dagelijks bestuur van de plusregio de in het eerste
      lid bedoelde medewerking niet of niet in voldoende mate verleent, kan het dagelijks bestuur zelf ten laste van de
      betrokken gemeente een besluit uitvoeren of doen uitvoeren.

      3 Alvorens over te gaan tot toepassing van het tweede lid, wordt het bestuur van de betrokken gemeente in kennis
      gesteld van het daarop gerichte voornemen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel115
  - number: '116'
    text: |-
      1 Indien naar het oordeel van gedeputeerde staten het bestuur van een plusregio tekort schiet in de uitoefening
      respectievelijk uitvoering van een aan dat bestuur krachtens de regeling of bij of krachtens de wet op- of
      overgedragen bevoegdheid of taak, kunnen zij aan dat bestuur een aanwijzing geven die inhoudt dat het bestuur die
      bevoegdheid of taak uitoefent respectievelijk uitvoert op de wijze als in de aanwijzing bepaald.

      2 De aanwijzing wordt niet gegeven dan nadat gedeputeerde staten het bestuur van de plusregio hebben gehoord.

      3 Bij de aanwijzing stellen gedeputeerde staten een termijn binnen welke het bestuur van de plusregio aan de
      aanwijzing moet voldoen.

      4 Indien het bestuur van de plusregio niet binnen de termijn, bedoeld in het derde lid, aan de aanwijzing voldoet,
      oefenen respectievelijk voeren gedeputeerde staten de desbetreffende bevoegdheid of taak uit namens dat bestuur en
      ten laste van de plusregio.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel116
  - number: '117'
    text: |-
      1 Onze Minister wie het aangaat, kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, gedeputeerde staten uitnodigen toepassing te geven aan [artikel 116, eerste lid][ref1]. De
      uitnodiging vermeldt de termijn binnen welke een aanwijzing dient te worden gegeven.

      2 Indien gedeputeerde staten aan de uitnodiging geen gevolg geven, wordt de aanwijzing gegeven door Onze
      Minister wie het aangaat, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
      [Artikel 116, tweede tot en met vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel116
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel117
