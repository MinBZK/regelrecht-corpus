  - number: '104'
    text: |-
      Onder «plusregio» wordt verstaan een regionaal openbaar lichaam met wettelijke taken, dat op uitnodiging van
      gedeputeerde staten door de besturen van gemeenten in een gebied met stedelijke kenmerken bij gemeenschappelijke
      regeling is ingesteld met het oog op de oplossing van de regionale afstemmingsproblematiek.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel104
  - number: '105'
    text: |-
      Indien een plusregio in meer dan één provincie is gelegen, oefenen gedeputeerde staten onderscheidenlijk
      provinciale staten van de provincie waarin de plusregio is gevestigd, de bevoegdheden uit die bij of krachtens de
      wet met betrekking tot plusregio’s aan gedeputeerde staten onderscheidenlijk provinciale staten zijn toegekend.
      Bedoelde organen plegen daaromtrent overleg met de desbetreffende organen van de andere provincie en delen genomen
      besluiten met betrekking tot de plusregio onverwijld mee aan deze organen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel105
  - number: '106'
    text: |-
      1 Op gezamenlijk verzoek van besturen van gemeenten in een stedelijk gebied kunnen gedeputeerde staten hen
      uitnodigen een plusregio in te stellen, indien gedeputeerde staten van oordeel zijn dat instelling van een
      plusregio bijzonder aangewezen is vanwege de ruimtelijke afstemmingsproblematiek in dat gebied, ten gevolge van
      beleidsopgaven terzake van volkshuisvesting, bedrijfsvestiging, verkeer en vervoer, recreatie of stedelijk groen.

      2 Bij hun verzoek kunnen de besturen kenbaar maken welke andere gemeenten zij bij de instelling betrokken willen
      zien.

      3 Gedeputeerde staten kunnen wat betreft de uit te nodigen gemeentebesturen afwijken van het verzoek, na overleg
      met de besturen van de gemeenten die bij het verzoek of de uitnodiging zijn betrokken.

      4 Gedeputeerde staten maken hun besluit omtrent het verzoek binnen 26 weken na ontvangst van het verzoek openbaar
      op de in de provincie gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel106
  - number: '107'
    text: |-
      Indien naar hun oordeel instelling van een plusregio bijzonder aangewezen is, en zij geen verzoek als
      bedoeld in [artikel 106, eerste lid][ref1] ontvangen, treden gedeputeerde staten in overleg met de
      desbetreffende gemeentebesturen, waarna zij de deelnemers aan het overleg een uitnodiging als bedoeld in
      [artikel 106, eerste lid][ref2], kunnen doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '108'
    text: |-
      1 De besturen van de gemeenten die een uitnodiging als bedoeld in [artikel 106, eerste lid][ref1], hebben
      ontvangen, treffen binnen 26 weken een gemeenschappelijke regeling waarbij een plusregio wordt ingesteld.

      2 De regeling wordt gezonden aan gedeputeerde staten en aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '109'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een register van alle gemeenschappelijke
      regelingen waarbij een plusregio is ingesteld in overeenstemming met de uitnodiging, bedoeld in
      [artikel 106, eerste lid][ref1].

      2 De regeling waarbij een plusregio is ingesteld, treedt niet in werking dan na opneming in het register. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties doet van de opneming in het register mededeling in de
      Staatscourant.

      3 In het register wordt van iedere plusregio in ieder geval vermeld welke gemeenten daarvan deel uitmaken, het
      adres en de plaats van vestiging, welke taken en bevoegdheden bij een andere dan deze wet aan die plusregio zijn
      opgedragen en welke taken en bevoegdheden bij provinciaal besluit aan die plusregio zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '110'
    text: |-
      1 Tot toetreding tot, uittreding uit of opheffing van een plusregio wordt niet besloten dan na een verklaring van
      geen bezwaar van gedeputeerde staten en, indien bij wet één of meer bevoegdheden of taken aan de plusregio zijn
      opgedragen, van Onze Ministers wie het aangaat.

      2 De [artikelen 107][ref1], [108, tweede lid][ref2], en [109, tweede lid][ref3], zijn van overeenkomstige
      toepassing op een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel109
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel110
