  - number: '11'
    text: |-
      In de regeling kan een termijn worden aangegeven gedurende welke een of meer van de deelnemers is of zijn
      vrijgesteld van uit deze regeling voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel11
  - number: '12'
    text: |-
      1 Het bestuur van het openbaar lichaam bestaat uit een algemeen bestuur, een dagelijks bestuur en een voorzitter.

      2 Het algemeen bestuur staat aan het hoofd van het openbaar lichaam.

      3 De voorzitter is tevens voorzitter van het algemeen bestuur en van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel12
  - number: '13'
    text: |-
      1 Het algemeen bestuur van een openbaar lichaam, ingesteld bij een regeling die is getroffen of mede is getroffen
      door gemeenteraden, bestaat uit leden, die per deelnemende gemeente door de raad uit zijn midden, de voorzitter
      inbegrepen, en uit de wethouders worden aangewezen. Indien de regeling uitsluitend strekt tot behartiging van
      opleiding en vorming van ambtenaren, kan in de regeling worden bepaald, dat ook de gemeentesecretaris als lid van
      het algemeen bestuur kan worden aangewezen.

      2 Het lidmaatschap van het algemeen bestuur eindigt van rechtswege, zodra men ophoudt lid of voorzitter te zijn
      van de raad uit wiens midden men is aangewezen dan wel ophoudt wethouder of secretaris van de desbetreffende
      deelnemende gemeente te zijn.

      3 De regeling bepaalt het aantal leden van het algemeen bestuur, dat door de raad van elke deelnemende gemeente
      wordt aangewezen.

      4 De regeling kan inhouden, dat:

      a. de aantallen leden, die door de raden van de deelnemende gemeenten worden aangewezen, onderling verschillen;

      b. leden, aangewezen door de raden van bepaalde deelnemende gemeenten, meervoudig stemrecht hebben.

      c. het algemeen bestuur bij gekwalificeerde meerderheid besluit ten aanzien van in de regeling aangeduide
      besluiten.

      5 De regeling kan tevens inhouden, dat:

      a. de raden van niet alle, doch ten minste twee deelnemende gemeenten leden van het algemeen bestuur aanwijzen;

      b. de raden van twee of meer deelnemende gemeenten gezamenlijk leden van het algemeen bestuur aanwijzen.

      6 Ingeval de regeling uitsluitend is getroffen door colleges van burgemeester en wethouders, is het bepaalde in het
      eerste tot en met het vijfde lid van overeenkomstige toepassing.

      7 Ingeval de regeling uitsluitend is getroffen door burgemeesters, vormen zij het algemeen bestuur. De regeling kan
      inhouden, dat burgemeesters van bepaalde gemeenten meervoudig stemrecht hebben.

      8 De regeling, bedoeld in het zevende lid, kan tevens inhouden, dat:

      a. niet alle deelnemende burgemeesters zitting hebben in het algemeen bestuur;

      b. twee of meer deelnemende burgemeesters gezamenlijk uit hun midden een of meer leden van het algemeen bestuur
      aanwijzen.

      9 De voorzitter van het openbaar lichaam wordt door en uit het algemeen bestuur aangewezen, met inachtneming van
      het daaromtrent in de regeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel13
  - number: '14'
    text: |-
      1 Het dagelijks bestuur van het openbaar lichaam bestaat uit de voorzitter en twee of meer andere leden, door en
      uit het algemeen bestuur aan te wijzen, met inachtneming van het daaromtrent in de regeling bepaalde. De aldus
      aangewezen leden van het dagelijks bestuur mogen niet allen afkomstig zijn uit dezelfde gemeente.

      2 Wanneer de aard van de regeling daartoe aanleiding geeft, kunnen één of meer leden van het dagelijks bestuur,
      niet zijnde de voorzitter, worden aangewezen van buiten de kring van het algemeen bestuur, met dien verstande dat
      op deze wijze aangewezen leden nimmer de meerderheid van het dagelijks bestuur mogen uitmaken.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel14
  - number: '15'
    text: |-
      Op de samenstelling van het gemeenschappelijk orgaan, bedoeld in [artikel 8, tweede lid][ref1], is
      [artikel 13][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
