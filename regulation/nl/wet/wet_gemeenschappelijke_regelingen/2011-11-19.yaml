  - number: '20'
    text: |-
      1 Een lid van het bestuur van het openbaar lichaam mag:

      a. niet als advocaat, gemachtigde of adviseur werkzaam zijn ten behoeve van de wederpartij van het openbaar lichaam
      of ten behoeve van het bestuur van het openbaar lichaam in geschillen;

      b. niet als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met het openbaar lichaam
      aangaan van:

      1e. overeenkomsten als bedoeld in onderdeel c;

      2e. overeenkomsten tot het leveren van onroerende zaken aan het openbaar lichaam;

      c. rechtstreeks noch middellijk een overeenkomst aangaan betreffende:

      1e. het aannemen van werk ten behoeve van het openbaar lichaam;

      2e. het buiten dienstbetrekking tegen beloning doen van verrichtingen ten behoeve van het openbaar lichaam;

      3e. het leveren van roerende zaken anders dan om niet aan het openbaar lichaam;

      4e. het verhuren aan het openbaar lichaam van enig goed, met uitzondering van onroerende zaken;

      5e. het verwerven van betwiste vorderingen ten laste van het openbaar lichaam;

      6e. het van het openbaar lichaam ondershands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;

      7e. het ondershands huren of pachten van het openbaar lichaam.

      2 Van het bepaalde in het eerste lid onder *c* kunnen gedeputeerde staten ontheffing verlenen.

      3 Ten aanzien van een lid van het gemeenschappelijk orgaan is het bepaalde in het eerste lid onder *a* van
      overeenkomstige toepassing.

      4 Wanneer is gehandeld in strijd met het bepaalde in het eerste lid, is
      [artikel X 8, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel20
    references:
