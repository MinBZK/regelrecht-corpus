  - number: '24'
    text: |-
      1 Het algemeen bestuur van het openbaar lichaam kan commissies van advies instellen. Het regelt de bevoegdheden en
      de samenstelling. [Artikel 94 van de Gemeentewet][ref1] is van overeenkomstige toepassing.

      2 De instelling van vaste commissies van advies aan het dagelijks bestuur of aan de voorzitter en de regeling
      van haar bevoegdheden en samenstelling geschieden door het algemeen bestuur op voorstel van het dagelijks bestuur
      onderscheidenlijk van de voorzitter.

      3 Andere commissies van advies aan het dagelijks bestuur of aan de voorzitter worden door het dagelijks bestuur
      onderscheidenlijk de voorzitter ingesteld.

      4 De leden van commissies van advies die geen burgemeester, wethouder of lid van een gemeenteraad
      zijn kunnen een vergoeding voor het bijwonen van vergaderingen van de commissie ontvangen. De
      [artikelen 96 tot en met 99 van de Gemeentewet][ref2], alsmede de op grond daarvan gestelde nadere regelen, zijn
      alsdan van overeenkomstige toepassing, met dien verstande dat, wanneer daarin sprake is van een onderverdeling in
      gemeenteklassen, het bepaalde voor de gemeenteklasse van 50 001-100 000 inwoners van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel96
