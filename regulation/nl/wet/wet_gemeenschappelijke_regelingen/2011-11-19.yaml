  - number: '127'
    text: |-
      1 Artikel 16 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba is van overeenkomstige toepassing op een
      lid van het bestuur van het samenwerkingslichaam.

      2 Ten aanzien van een lid van het gemeenschappelijk orgaan is het bepaalde in artikel 16, eerste lid, onder *a* en
      b, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba van overeenkomstige toepassing.

      3 Wanneer is gehandeld in strijd met het bepaalde in het eerste lid, is
      [artikel X 8, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_8
  - number: '128'
    text: |-
      1 De artikelen 17, 18, 20, 21, 23, 27, 29, 30, 31, 32, 33, 34 en 35 van de Wet openbare lichamen Bonaire, Sint
      Eustatius en Saba zijn, voor zover daarvan bij deze wet niet is afgeweken, op het houden en de orde van de
      vergaderingen van het algemeen bestuur van het samenwerkingslichaam van overeenkomstige toepassing.

      2 Het algemeen bestuur van het samenwerkingslichaam en het gemeenschappelijk orgaan vergaderen jaarlijks tenminste
      tweemaal.

      3 De vergaderingen van het algemeen bestuur zijn openbaar. De deuren worden gesloten wanneer een vijfde gedeelte
      der aanwezige leden daarom verzoekt of de voorzitter het nodig oordeelt.

      4 Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.

      5 De voorzitter kan vervolgens alsnog besluiten dat de vergadering in het openbaar wordt gehouden indien hij dit in
      het kader van het openbaar belang nodig acht.

      6 Het algemeen bestuur regelt op welke wijze ambtelijke bijstand wordt verleend aan de leden van het algemeen
      bestuur.

      7 Het eerste tot en met zesde lid en [artikel 23, eerste lid][ref1], zijn van overeenkomstige toepassing op het
      gemeenschappelijk orgaan, indien de regeling is getroffen of mede is getroffen door eilandsraden.

      8 De artikelen 62, 63, 64, 65, 67, 68, 69, 70, 71 en 72 van de Wet openbare lichamen Bonaire, Sint Eustatius
      en Saba en [artikel 23, eerste lid][ref2], van deze wet zijn, voor zover bij deze wet niet is afgeweken, op het
      houden en de orde van de vergaderingen van het gemeenschappelijk van overeenkomstige toepassing, indien de regeling
      uitsluitend is getroffen door bestuurscolleges of gezaghebbers.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel23
