  - number: '114'
    text: |-
      1 Indien niet binnen de termijn, bedoeld in [artikel 108, eerste lid][ref1], door de besturen van de desbetreffende
      gemeenten een regeling aan gedeputeerde staten is gezonden, kunnen gedeputeerde staten besluiten binnen 13 weken
      een regeling op te leggen.

      2 Gedeputeerde staten zenden een afschrift van de opgelegde regeling aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel108
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel114
