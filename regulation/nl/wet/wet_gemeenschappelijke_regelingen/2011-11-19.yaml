        hoofdstuk: I
        paragraaf: '2'
  - number: '19'
    text: |-
      1 Ingeval de regeling uitsluitend is getroffen door colleges van burgemeester en wethouders is het bepaalde in
      het [eerste, derde, vierde en zesde lid van artikel 16][ref1], van overeenkomstige toepassing ten aanzien van de
      gemeenteraden respectievelijk een of meer leden van die raden.

      2 Ingeval de regeling uitsluitend is getroffen door burgemeesters is het bepaalde in het
      [eerste, derde en zesde lid van artikel 16][ref2] van overeenkomstige toepassing ten aanzien van gemeenteraden
      respectievelijk een of meer leden van die raden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel16
