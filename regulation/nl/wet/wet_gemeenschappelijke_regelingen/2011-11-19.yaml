  - number: '26'
    text: |-
      1 Het gemeentebestuur dat daartoe bij de regeling is aangewezen zendt de regeling aan gedeputeerde staten van zijn
      provincie. Indien aan de regeling ook gemeenten deelnemen die in andere provincies zijn gelegen, wordt deze tevens
      toegezonden aan gedeputeerde staten van die provincies.

      2 De besturen van de deelnemende gemeenten dragen op de gebruikelijke wijze zorg voor de bekendmaking van de
      regeling.

      3 Het bepaalde in het eerste en tweede lid is mede van toepassing op besluiten tot wijziging, verlenging of
      opheffing van de regeling, alsmede op besluiten tot toetreding en uittreding.

      4 Het bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt een besluit
      tot verandering in de overgedragen bevoegdheden, dat tot stand is gekomen met toepassing van
      [artikel 10, tweede lid, tweede volzin][ref1], aan gedeputeerde staten. Indien aan de regeling ook gemeenten
      deelnemen die in andere provincies zijn gelegen, wordt dit besluit tevens toegezonden aan gedeputeerde staten van
      die provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel26
