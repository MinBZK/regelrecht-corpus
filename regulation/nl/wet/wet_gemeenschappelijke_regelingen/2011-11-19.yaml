  - number: '17'
    text: |-
      De regeling houdt bepalingen in omtrent de wijze waarop door het bestuur van het openbaar lichaam of door het
      gemeenschappelijk orgaan aan de raden van de deelnemende gemeenten de door een of meer leden van die raden
      gevraagde inlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel17
  - number: '18'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing op regelingen die uitsluitend getroffen zijn door colleges van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel18
