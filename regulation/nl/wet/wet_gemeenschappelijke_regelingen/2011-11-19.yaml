  - number: '35'
    text: |-
      1 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten.

      2 De ontwerp-begroting wordt door de zorg van de besturen van de deelnemende gemeenten voor
      een ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
      [Artikel 190, tweede en derde lid, van de Gemeentewet][ref1] is van overeenkomstige toepassing.

      3 De raden van de deelnemende gemeenten kunnen bij het dagelijks bestuur van het openbaar lichaam onderscheidenlijk
      het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur
      voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur
      wordt aangeboden.

      4 Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van de deelnemende gemeenten, die ter zake bij
      gedeputeerde staten hun zienswijze naar voren kunnen brengen.

      5 Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van
      de begroting. In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën
      begrotingswijzigingen hiervan kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
  - number: '40'
    text: |-
      1 Provinciale staten, gedeputeerde staten en de commissarissen van de Koning van twee of meer provincies kunnen
      afzonderlijk of te zamen, ieder voor zover zij voor de eigen provincie bevoegd zijn, een gemeenschappelijke
      regeling treffen ter behartiging van een of meer bepaalde belangen van die provincies.

      2 De colleges van gedeputeerde staten en de commissarissen van de Koning gaan niet over tot het treffen van een
      regeling dan na verkregen toestemming van provinciale staten. De toestemming kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.

      3 Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel40
  - number: '41'
    text: |-
      1 De [artikelen 8 tot en met 27][ref1] zijn van overeenkomstige toepassing, met uitzondering van
      [artikel 20, vierde lid][ref2], en met dien verstande dat:

      a. bij de toepassing van [artikel 16, zesde lid][ref3], voor [artikel 25 van de Gemeentewet][ref4] wordt gelezen
      [artikel 25 van de Provinciewet][ref5];

      b. de ontheffing bedoeld in [artikel 20, tweede lid][ref6], wordt verleend door Onze Minister van Binnenlandse
      Zaken;

      c. bij de toepassing van [artikel 21, vijfde lid][ref7], voor [artikel 99 van de Gemeentewet][ref8] wordt gelezen
      [artikel 96 van de Provinciewet][ref9];

      d. bij de toepassing van [artikel 22, eerste lid][ref10], voor de [artikelen 16][ref11], [17][ref12],
      [19][ref13], [20][ref14], [22][ref15], [26][ref16] en [28 tot en met 33 van de Gemeentewet][ref17] worden
      gelezen de [artikelen 16][ref18], [17][ref19], [19][ref20], [20][ref21], [22][ref22], [26][ref23] en
      [28 tot en met 33 van de Provinciewet][ref24];

      e. bij de toepassing van [artikel 24, eerste lid][ref25], voor [artikel 94 van de Gemeentewet][ref26] wordt gelezen
      [artikel 92 van de Provinciewet][ref27];

      f. bij de toepassing van [artikel 24, vierde lid][ref28], voor de
      [artikelen 96 tot en met 99 van de Gemeentewet][ref29] worden gelezen de
      [artikelen 93 tot en met 96 van de Provinciewet][ref30].

      g. bij de toepassing van [artikel 25, eerste lid][ref31], voor de [artikelen 94][ref32] en
      [139 tot en met 144 van de Gemeentewet][ref33] wordt gelezen de [artikelen 92][ref34] en
      [136 tot en met 140 van de Provinciewet][ref35];

      h. bij de toepassing van [artikel 25, eerste lid][ref36] jo [artikel 21, vijfde lid][ref37], voor
      [artikel 99 van de Gemeentewet][ref38] wordt gelezen [artikel 96 van de Provinciewet][ref39];

      i. bij de toepassing van [artikel 26, vierde lid, eerste volzin][ref40], voor gedeputeerde staten wordt gelezen
      gedeputeerde staten van de provincie, waarin de plaats van vestiging gelegen is;

      j. bij de toepassing van [artikel 27, eerste lid][ref41], voor «Burgemeester en wethouders» wordt gelezen
      «Gedeputeerde staten» en voor «hun gemeente»: hun provincie.

      2 Wanneer is gehandeld in strijd met het bepaalde in het eerste lid juncto [artikel 20, eerste lid][ref42], is
      [artikel X 7, eerste tot en met vijfde lid, van de Kieswet][ref43] van overeenkomstige toepassing.


