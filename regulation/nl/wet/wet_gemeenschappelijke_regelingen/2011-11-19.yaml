  - number: '77'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel77
  - number: '78'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges
      of ambtenaren de bevoegdheden, bedoeld in hoofdstuk XV van de Gemeentewet en die bedoeld in
      [hoofdstuk XV van de Provinciewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: '79'
    text: |-
      1 Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam en die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      voor de verdeling van de bevoegdheden van de provinciale besturen over de provinciale bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.

      2 Indien en voor zover de in het eerste lid bedoelde bevoegdheden van het bestuur van een openbaar lichaam en
      die van een gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten onderscheidenlijk
      waterschappen zijn overgedragen zijn daarop, in afwijking van het bepaalde in het eerste lid, van overeenkomstige
      toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld voor de verdeling van de
      bevoegdheden van de deelnemende gemeenten onderscheidenlijk waterschappen over hun bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop.

      3 Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die door het bestuur van het openbaar
      lichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden ontleend aan de regels, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel79
  - number: '80'
    text: |-
      1 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.

      2 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting
      dient, aan Onze Minister van Binnenlandse Zaken.

      3 Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.

      4 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel80
  - number: '81'
    text: |-
      1 Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten, aan provinciale staten
      van de deelnemende provincies en aan de algemene besturen van de deelnemende waterschappen.

      2 De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten, provincies en waterschappen
      voor een ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
      [Artikel 190, tweede en derde lid, van de Gemeentewet][ref1] is van overeenkomstige toepassing.

      3 De raden van de deelnemende gemeenten, provinciale staten van de deelnemende provincies en de algemene besturen
      van de deelnemende waterschappen kunnen bij het dagelijks bestuur van het openbaar lichaam onderscheidenlijk het
      gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt
      de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt
      aangeboden.

      4 Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van de deelnemende gemeenten, aan provinciale staten
      van de deelnemende provincies en aan de algemene besturen van de deelnemende waterschappen die ter zake bij Onze
      Minister van Binnenlandse Zaken hun zienswijze naar voren kunnen brengen.

      5 Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van
      de begroting. In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën
      begrotingswijzigingen hiervan kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
  - number: '83'
    text: |-
      1 Provinciale staten, de colleges van gedeputeerde staten en de commissarissen van de Koning van een of meer
      provincies kunnen, afzonderlijk of te zamen, met de algemene besturen, de dagelijkse besturen en de voorzitters
      van een of meer waterschappen, ieder voorzover zij voor de eigen provincie, onderscheidenlijk het eigen waterschap
      bevoegd zijn, een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die
      provincies of waterschappen.

      2 Een college van gedeputeerde staten en een commissaris van de Koning, onderscheidenlijk een dagelijks bestuur en
      een voorzitter van een waterschap gaan niet over tot het treffen van een regeling dan na verkregen toestemming van
      provinciale staten, onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.

      3 Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
