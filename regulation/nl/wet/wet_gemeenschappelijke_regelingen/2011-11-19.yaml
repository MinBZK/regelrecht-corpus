  - number: '73'
    text: |-
      1 De raden, de colleges van burgemeester en wethouders en de burgemeesters van een of meer gemeenten kunnen,
      afzonderlijk of te zamen, met provinciale staten, de colleges van gedeputeerde staten en de commissarissen van
      de Koning van een of meer provincies en de algemene besturen, de dagelijkse besturen en de voorzitters van een of
      meer waterschappen, ieder voor zover zij voor de eigen gemeente, de eigen provincie, onderscheidenlijk het eigen
      waterschap bevoegd zijn, een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen
      van die gemeenten, provincies of waterschappen.

      2 Een college van burgemeester en wethouders en een burgemeester, een college van gedeputeerde staten en een
      commissaris van de Koning, onderscheidenlijk een dagelijks bestuur en een voorzitter van een waterschap gaan
      niet over tot het treffen van een regeling dan na verkregen toestemming van de gemeenteraad, provinciale staten,
      onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.

      3 Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2011-11-19#Artikel73
  - number: '74'
    text: |-
      1 De [artikelen 8 tot en met 27][ref1] zijn van overeenkomstige toepassing, met uitzondering van
      [artikel 20, vierde lid][ref2], en met dien verstande dat:

      a. bij de toepassing van [artikel 16, zesde lid][ref3], voor de woorden "[artikel 25 van de Gemeentewet][ref4]"
      wordt gelezen: het bepaalde voor het orgaan dat het lid heeft aangewezen;

      b. de ontheffing bedoeld in [artikel 20, tweede lid][ref5], wordt verleend door Onze Minister van Binnenlandse
      Zaken;

      c. bij de toepassing van [artikel 21, vijfde lid][ref6], voor [artikel 99 van de Gemeentewet][ref7] wordt gelezen
      [artikel 96 van de Provinciewet][ref8];

      d. bij de toepassing van [artikel 22, eerste lid][ref9], voor de [artikelen 16][ref10], [17][ref11],
      [19][ref12], [20][ref13], [22][ref14], [26][ref15] en [28 tot en met 33 van de Gemeentewet][ref16] worden
      gelezen de [artikelen 16][ref17], [17][ref18], [19][ref19], [20][ref20], [22][ref21], [26][ref22] en
      [28 tot en met 33 van de Provinciewet][ref23];

      e. bij de toepassing van [artikel 24, eerste lid][ref24], voor [artikel 94 van de Gemeentewet][ref25] wordt gelezen
      [artikel 92 van de Provinciewet][ref26];

      f. bij de toepassing van [artikel 24, vierde lid][ref27], voor de
      [artikelen 96 tot en met 99 van de Gemeentewet][ref28] worden gelezen de
      [artikelen 93 tot en met 96 van de Provinciewet][ref29];

      g. bij de toepassing van [artikel 25, eerste lid][ref30], voor de [artikelen 94][ref31] en
      [139 tot en met 144 van de Gemeentewet][ref32] wordt gelezen de [artikelen 92][ref33] en
      [136 tot en met 140 van de Provinciewet][ref34];

      h. bij de toepassing van [artikel 25, eerste lid][ref35] jo [artikel 21, vijfde lid][ref36], voor
      [artikel 99 van de Gemeentewet][ref37] wordt gelezen [artikel 96 van de Provinciewet][ref38];

      i. bij de toepassing van [artikel 26, vierde lid, eerste volzin][ref39], voor gedeputeerde staten wordt gelezen
      gedeputeerde staten van de provincie, waarin de plaats van vestiging gelegen is;

      j. bij de toepassing van [artikel 27, eerste lid][ref40], voor «Burgemeester en wethouders» wordt gelezen
      «Gedeputeerde staten» en voor «hun gemeente»: hun provincie.

      2 Wanneer is gehandeld in strijd met het bepaalde in het eerste lid juncto [artikel 20, eerste lid][ref41], is
      [artikel X 7, eerste tot en met vijfde lid, van de Kieswet][ref42] van overeenkomstige toepassing.


