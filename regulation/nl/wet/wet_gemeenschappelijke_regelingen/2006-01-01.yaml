        artikel: X_7
  - number: '76.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien van
      de belangen ter behartiging waarvan zij is getroffen en voor het gebied waarvoor zij geldt, zodanige bevoegdheden
      van regeling en bestuur worden overgedragen, als aan de besturen van de deelnemende gemeenten en provincies en
      van de deelnemende waterschappen met betrekking tot hun eigen gemeente, provincie, onderscheidenlijk waterschap
      toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel76
  - number: 76.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te heffen
      dan de rechten, bedoeld in [artikel 229, eerste lid, onder ][ref1] en [artikel 223 van de Provinciewet][ref2], de
      belasting, bedoeld in [artikel 222][ref3], en de rechten waarvan de heffing krachtens bijzondere wetten geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '223'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 222c
  - number: 76.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel76
  - number: '76.2'
    text: |-
      Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de deelnemende gemeenten en provincies en van de deelnemende
      waterschappen geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel76
  - number: '76.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende gemeente of provincie, of van een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge
      verhouding. Zij kan bepalen, dat de verordening van de gemeente, de provincie of het waterschap, voor het gehele
      gebied, dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel76
  - number: '77'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel77
  - number: '78'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges
      of ambtenaren de bevoegdheden, bedoeld in hoofdstuk XV van de Gemeentewet en die bedoeld in
      [hoofdstuk XV van de Provinciewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: '79.1'
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam en die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      voor de verdeling van de bevoegdheden van de provinciale besturen over de provinciale bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel79
  - number: '79.2'
    text: |-
      Indien en voor zover de in het eerste lid bedoelde bevoegdheden van het bestuur van een openbaar lichaam en die
      van een gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten onderscheidenlijk
      waterschappen zijn overgedragen zijn daarop, in afwijking van het bepaalde in het eerste lid, van overeenkomstige
      toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld voor de verdeling van de
      bevoegdheden van de deelnemende gemeenten onderscheidenlijk waterschappen over hun bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel79
  - number: '79.3'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die door het bestuur van het openbaar
      lichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden ontleend aan de regels, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel79
  - number: '79.4'
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste en tweede lid, onevenredig belastend zou zijn in verhouding tot het met die regels
      beoogde doel, kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel79
  - number: '80.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel80
  - number: '80.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee weken
      na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting dient,
      aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel80
  - number: '80.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel80
  - number: '80.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel80
  - number: '81.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten, aan provinciale staten
      van de deelnemende provincies en aan de algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel81
  - number: '81.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten, provincies en waterschappen
      voor een ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
      [Artikel 190, tweede en derde lid, van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
  - number: '81.3'
    text: |-
      De raden van de deelnemende gemeenten, provinciale staten van de deelnemende provincies en de algemene besturen
      van de deelnemende waterschappen kunnen bij het dagelijks bestuur van het openbaar lichaam onderscheidenlijk het
      gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt
      de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel81
  - number: '81.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van de deelnemende gemeenten, aan provinciale staten
      van de deelnemende provincies en aan de algemene besturen van de deelnemende waterschappen die ter zake bij Onze
      Minister van Binnenlandse Zaken hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel81
  - number: '81.5'
    text: |-
      Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van de begroting.
      In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen
      hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel81
  - number: '83.1'
    text: |-
      Provinciale staten, de colleges van gedeputeerde staten en de commissarissen van de Koning van een of meer
      provincies kunnen, afzonderlijk of te zamen, met de algemene besturen, de dagelijkse besturen en de voorzitters
      van een of meer waterschappen, ieder voorzover zij voor de eigen provincie, onderscheidenlijk het eigen waterschap
      bevoegd zijn, een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die
      provincies of waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel83
  - number: '83.2'
    text: |-
      Een college van gedeputeerde staten en een commissaris van de Koning, onderscheidenlijk een dagelijks bestuur en
      een voorzitter van een waterschap gaan niet over tot het treffen van een regeling dan na verkregen toestemming van
      provinciale staten, onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel83
  - number: '83.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel83
  - number: '84.1'
    text: |-
      De [artikelen 8 tot en met 27][ref1] zijn van overeenkomstige toepassing, met uitzondering van
      [artikel 20, vierde lid][ref2], en met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel20
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
  - number: 84.1.a
    text: |-
      bij de toepassing van [artikel 16, zesde lid][ref1], voor de woorden "[artikel 25 van de Gemeentewet][ref2]" wordt
      gelezen: het bepaalde voor het orgaan dat het lid heeft aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '25'
  - number: 84.1.b
    text: |-
      de ontheffing bedoeld in [artikel 20, tweede lid][ref1], wordt verleend door Onze Minister van Binnenlandse Zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel20
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
