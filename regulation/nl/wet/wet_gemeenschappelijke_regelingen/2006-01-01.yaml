        artikel: X_7
  - number: '86.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien van
      de belangen ter behartiging waarvan zij is getroffen en voor het gebied waarvoor zij geldt, zodanige bevoegdheden
      van regeling en bestuur worden overgedragen, als aan de besturen van de deelnemende provincies en waterschappen met
      betrekking tot hun eigen provincie, onderscheidenlijk waterschap toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel86
  - number: 86.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te heffen
      dan de rechten, bedoeld in [artikel 223 van de Provinciewet][ref1], de belasting, bedoeld in [artikel 222][ref2],en
      de rechten waarvan de heffing krachtens bijzondere wetten geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '223'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 222c
  - number: 86.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel86
  - number: '86.2'
    text: |-
      Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de aan de regeling deelnemende provincies en waterschappen
      geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel86
  - number: '86.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende provincie of een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge verhouding. Zij
      kan bepalen, dat de verordening van de provincie of van het waterschap voor het gehele gebied, dan wel voor een
      gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel86
  - number: '87'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel87
  - number: '88'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Provinciewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: '89.1'
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      voor de verdeling van de bevoegdheden van de provinciale besturen over de provinciale bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel89
  - number: '89.2'
    text: |-
      Indien en voor zover de in het eerste lid bedoelde bevoegdheden van het bestuur van een openbaar lichaam en die
      van een gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen
      zijn daarop, in afwijking van het bepaalde in het eerste lid, van overeenkomstige toepassing de regels, in de
      ruimste zin, welke bij of krachtens de wet zijn gesteld voor de verdeling van de bevoegdheden van de deelnemende
      waterschappen over hun bestuursorganen, voor de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel89
  - number: '89.3'
    text: |-
      De besturen van de deelnemende provincies en waterschappen kunnen bij de regeling beperkingen aanbrengen in de
      bevoegdheden die door het bestuur van het openbaar lichaam, onderscheidenlijk het gemeenschappelijk orgaan zouden
      kunnen worden ontleend aan de regels, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel89
  - number: '89.4'
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste en tweede lid, onevenredig belastend zou zijn in verhouding tot het met die regels
      beoogde doel, kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel89
  - number: '90.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel90
  - number: '90.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee weken
      na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting dient,
      aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel90
  - number: '90.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel90
  - number: '90.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel90
  - number: '91.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan provinciale staten van de deelnemende provincies en aan de
      algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel91
  - number: '91.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de aan de regeling deelnemende provincies en waterschappen voor een
      ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld. Van de terinzagelegging en
      de verkrijgbaarstelling geschiedt openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel91
  - number: '91.3'
    text: |-
      Provinciale staten van de deelnemende provincies en de algemene besturen van de deelnemende waterschappen kunnen
      bij het dagelijks bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze
      over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is
      vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel91
  - number: '91.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan provinciale staten van de deelnemende provincies en aan de
      algemene besturen van de deelnemende waterschappen, die ter zake bij Onze Minister van Binnenlandse Zaken hun
      zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel91
  - number: '91.5'
    text: |-
      Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van de begroting.
      In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen
      hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel91
  - number: '93'
    text: |-
      Aan een regeling als bedoeld in de [hoofdstukken I tot en met VII][ref1] kunnen, indien zij daartoe overigens
      bevoegd zijn, tevens deelnemen:


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
  - number: 93.a
    text: een of meer andere openbare lichamen dan gemeenten, provincies en waterschappen;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel93
  - number: 93.b
    text: |-
      een of meer andere rechtspersonen, indien hun bestuur bij koninklijk besluit, dat in de *Nederlandse Staatscourant*
      wordt geplaatst, daartoe is gemachtigd.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel93
  - number: '94.1'
    text: |-
      Deelneming vanwege het Rijk geschiedt bij besluit van Onze betrokken minister. Het besluit regelt mede de gevolgen
      van de deelneming.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel94
  - number: '94.2'
    text: |-
      Indien vanwege het Rijk wordt deelgenomen aan een regeling waarbij gebruik wordt gemaakt van een bevoegdheid als
      bedoeld in [artikel 8][ref1], wordt een besluit als bedoeld in het eerste lid aan de beide kamers der Staten-
      Generaal overgelegd. Het treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij besluit van Onze betrokken Minister wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van het besluit bij wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '95'
    text: |-
      Het bepaalde in de [hoofdstukken I tot en met VII][ref1] is van overeenkomstige toepassing, met dien
      verstande dat, wanneer het een regeling betreft met deelnemers bedoeld in de [artikelen 93, onderdeel ][ref2]
      en [94, eerste lid][ref3], de genoemde hoofdstukken ten aanzien van deze deelnemers zoveel mogelijk van
      overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel94
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '93'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '94'
        hoofdstuk: VIII
  - number: '96'
    text: |-
      De raad en het college van burgemeester en wethouders van een gemeente, provinciale staten en gedeputeerde staten
      van een provincie, onderscheidenlijk het algemeen bestuur en het dagelijks bestuur van een waterschap kunnen, ieder
      voorzover zij voor de eigen gemeente, de eigen provincie, onderscheidenlijk het eigen waterschap bevoegd zijn,
      een gemeenschappelijke regeling treffen ter behartiging van bepaalde belangen van die gemeente, die provincie,
      onderscheidenlijk dat waterschap met - indien deze daartoe overigens bevoegd zijn - de besturen van:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel96
  - number: 96.a
    text: een of meer andere openbare lichamen dan gemeenten, provincies en waterschappen;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel96
  - number: 96.b
    text: |-
      een of meer andere rechtspersonen, indien zij bij koninklijk besluit dat in de *Nederlandse Staatscourant* wordt
      geplaatst, daartoe zijn gemachtigd.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel96
  - number: '97.1'
    text: |-
      Deelneming vanwege het Rijk geschiedt bij besluit van Onze betrokken minister. Het besluit regelt mede de gevolgen
      van de deelneming.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel97
  - number: '97.2'
    text: |-
      Indien vanwege het Rijk wordt deelgenomen aan een regeling waarbij gebruik wordt gemaakt van een bevoegdheid als
      bedoeld in [artikel 8][ref1], wordt een besluit als bedoeld in het eerste lid aan de beide kamers der Staten-
      Generaal overgelegd. Het treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij besluit van Onze betrokken Minister wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van het besluit bij wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '98'
    text: |-
      Van overeenkomstige toepassing is [hoofdstuk I][ref1], indien een gemeente de regeling aangaat,
      [hoofdstuk II][ref2], indien een provincie de regeling aangaat, of [hoofdstuk III][ref3], indien een waterschap de
      regeling aangaat. Wanneer het een regeling betreft met deelnemers bedoeld in de [artikelen 96, onderdeel ][ref4]
      en [97, eerste lid][ref5], zijn de genoemde hoofdstukken ten aanzien van deze deelnemers zoveel mogelijk van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel96
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel97
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003740
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003740
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003740
        artikel: '96'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0003740
        artikel: '97'
        hoofdstuk: IX
  - number: '99.1'
    text: |-
      Op verzoek van het bestuur van een of meer gemeenten kunnen gedeputeerde staten, indien een zwaarwegend openbaar
      belang dat vereist, gemeenten aanwijzen waarvan de besturen een gemeenschappelijke regeling moeten treffen ter
      behartiging van een of meer bepaalde belangen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel99
  - number: '99.2'
    text: |-
      Een aanwijzing kan ook betreffen de verplichting tot wijziging of opheffing van een bestaande regeling, alsmede de
      verplichting tot toetreding tot of uittreding uit een bestaande regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel99
  - number: '99.3'
    text: |-
      Alvorens een aanwijzing te geven, plegen gedeputeerde staten overleg met de besturen van de betrokken gemeenten.
      Bij een aanwijzing als bedoeld in het tweede lid, plegen gedeputeerde staten tevens overleg met het bestuur van
      het openbaar lichaam of het gemeenschappelijk orgaan dat bij de betreffende regeling is ingesteld. Het overleg
      duurt ten hoogste dertien weken, te rekenen vanaf de datum waarop gedeputeerde staten de betrokken besturen tot het
      voeren van overleg in de gelegenheid hebben gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel99
  - number: '99.4'
    text: |-
      Bij de aanwijzing stellen gedeputeerde staten een termijn binnen welke een regeling ter kennisneming aan hen dient
      te worden gezonden. Deze termijn bedraagt ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel99
  - number: '100.1'
    text: |-
      Gedeputeerde staten leggen uiterlijk binnen zes maanden na het verstrijken van de termijn, bedoeld
      in [artikel 99, vierde lid][ref1], een regeling op overeenkomstig de aanwijzing, bedoeld in
      [artikel 99, eerste lid][ref2], indien geen regeling aan hen is gezonden, of indien uit de ter kennisneming
      toegezonden regeling blijkt dat aan de aanwijzing onvoldoende gevolg is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: '100.2'
    text: |-
      Een oplegging kan ook betreffen de oplegging van een wijziging of opheffing van een bestaande regeling, alsmede de
      oplegging van een toetreding tot of uittreding uit een bestaande regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel100
  - number: '100.3'
    text: |-
      Alvorens een regeling op te leggen, horen gedeputeerde staten de besturen van de betrokken gemeenten over het
      ontwerp van de op te leggen regeling. Bij een oplegging als bedoeld in het tweede lid, horen gedeputeerde staten
      tevens het bestuur van het openbaar lichaam of het gemeenschappelijk orgaan dat bij de betreffende regeling is
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel100
  - number: '101'
    text: |-
      Indien het een regeling betreft tussen gemeenten die in meer dan een provincie liggen, vindt de toepassing van de
      [artikelen 99][ref1] en [100][ref2] plaats bij gelijkluidende besluiten van gedeputeerde staten van de betrokken
      provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
  - number: '102.1'
    text: |-
      Onze Minister wie het aangaat kan, in overeenstemming met Onze Minister van Binnenlandse Zaken, gedeputeerde staten
      uitnodigen tot het geven van een aanwijzing als bedoeld in [artikel 99, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: '102.2'
    text: Een uitnodiging wordt niet gedaan dan nadat Onze Minister wie het aangaat gedeputeerde staten heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel102
  - number: '102.3'
    text: |-
      Bij de uitnodiging stelt Onze Minister wie het aangaat een termijn binnen welke gedeputeerde staten een aanwijzing
      dienen te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel102
  - number: '102.4'
    text: |-
      Indien niet binnen de termijn, bedoeld in het derde lid, door gedeputeerde staten een aanwijzing is gegeven, wordt
      een aanwijzing gegeven door Onze Minister wie het aangaat, in overeenstemming met Onze Minister van Binnenlandse
      Zaken. [Artikel 99][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: '103.1'
    text: |-
      Bij koninklijk besluit wordt een regeling overeenkomstig de aanwijzing, bedoeld in [artikel 102, vierde lid][ref1],
      opgelegd, indien binnen zes maanden na de aanwijzing geen regeling ter kennisneming aan Onze Minister wie het
      aangaat en Onze Minister van Binnenlandse Zaken is gezonden of indien uit de ter kennisneming toegezonden regeling
      blijkt dat aan de aanwijzing onvoldoende gevolg is gegeven. [Artikel 100, tweede lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '102'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
  - number: '103.2'
    text: |-
      Alvorens een regeling wordt opgelegd hoort Onze Minister wie het aangaat de besturen van de betrokken
      gemeenten en gedeputeerde staten van de betrokken provincie over het ontwerp van de op te leggen regeling.
      [Artikel 100, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
  - number: '103.3'
    text: De voordracht tot oplegging wordt gedaan door of mede door Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103
  - number: '103.4'
    text: |-
      Besluiten die geheel of gedeeltelijk met toepassing van het eerste lid tot stand zijn gekomen, worden ter
      kennisneming gezonden aan gedeputeerde staten van de betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103
  - number: 103a
    text: |-
      De commissaris van de Koning treedt voor de toepassing van de [artikelen 99 tot en met 103][ref1] in de plaats van
      gedeputeerde staten, indien het betreft een regeling uitsluitend tussen burgemeesters.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: 103b
    text: |-
      De aanwijzing, bedoeld in [artikel 99, eerste lid][ref1], kan ook betreffen de deelneming van gemeenten aan
      een regeling als bedoeld in [hoofdstuk V][ref2] en [hoofdstuk VIII][ref3], voor zover daaraan geen provincies
      deelnemen. De [artikel 99, derde en vierde lid][ref4], en [100 tot en met 103][ref5] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVIII
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003740
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
  - number: 103c.1
    text: |-
      De aanwijzing, bedoeld in [artikel 99, eerste lid][ref1], kan ook betreffen de deelneming van gemeenten aan
      een regeling als bedoeld in de [hoofdstukken IV][ref2] en [VI][ref3], alsmede [VIII][ref4], voor zover daaraan
      provincies deelnemen, met dien verstande dat de aanwijzing wordt gegeven door Onze Minister wie het aangaat, in
      overeenstemming met Onze Minister van Binnenlandse Zaken. [Artikel 99, derde lid][ref5], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVII
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103c
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003740
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0003740
        hoofdstuk: VII
      - id: ref5
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: 103c.2
    text: |-
      Bij de aanwijzing, bedoeld in het eerste lid, stelt Onze Minister wie het aangaat een termijn binnen welke een
      regeling ter kennisneming aan hem dient te worden gezonden. Artikel 103 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103c
  - number: 103c.3
    text: |-
      Bij toepassing van het eerste lid pleegt Onze Minister wie het aangaat tevens overleg met de besturen van de
      betrokken waterschappen, andere openbare lichamen en rechtspersonen. Bij toepassing van het tweede lid worden deze
      besturen tevens gehoord.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103c
  - number: 103d
    text: |-
      Voor de toepassing van de [artikelen 103][ref1] en [103][ref2] wordt onder oplegging van een regeling begrepen de
      oplegging van een toetreding tot en een uittreding uit een bestaande regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel103b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel103c
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103d
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 103b
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 103c
        hoofdstuk: X
  - number: 103e
    text: |-
      Voor zover in dit hoofdstuk niet anders is bepaald, is bij de oplegging van een regeling het bepaalde in
      [hoofdstuk I][ref1], dan wel IV, V, VI of VIII van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103e
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
  - number: 103f.1
    text: |-
      Tegen een besluit tot aanwijzing als bedoeld in de [artikelen 99, eerste lid][ref1], [102, vierde lid][ref2],
      [103][ref3] en [103][ref4], kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad
      van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel103b
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel103c
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '102'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0003740
        artikel: 103b
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0003740
        artikel: 103c
        hoofdstuk: X
  - number: 103f.2
    text: |-
      Tegen een besluit tot oplegging als bedoeld in de [artikelen 100, eerste lid][ref1], en [103, eerste lid][ref2],
      kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel103
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '103'
        hoofdstuk: X
  - number: 103f.3
    text: |-
      Indien tegen een besluit tot oplegging bezwaar kan worden gemaakt of beroep kan worden ingesteld, kan dat bezwaar
      of beroep geen grond vinden in bezwaar of beroep tegen het aanwijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel103f
  - number: '104'
    text: |-
      Onder «plusregio» wordt verstaan een regionaal openbaar lichaam met wettelijke taken, dat op uitnodiging van
      gedeputeerde staten door de besturen van gemeenten in een gebied met stedelijke kenmerken bij gemeenschappelijke
      regeling is ingesteld met het oog op de oplossing van de regionale afstemmingsproblematiek.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel104
  - number: '105'
    text: |-
      Indien een plusregio in meer dan één provincie is gelegen, oefenen gedeputeerde staten onderscheidenlijk
      provinciale staten van de provincie waarin de plusregio is gevestigd, de bevoegdheden uit die bij of krachtens de
      wet met betrekking tot plusregio’s aan gedeputeerde staten onderscheidenlijk provinciale staten zijn toegekend.
      Bedoelde organen plegen daaromtrent overleg met de desbetreffende organen van de andere provincie en delen genomen
      besluiten met betrekking tot de plusregio onverwijld mee aan deze organen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel105
  - number: '106.1'
    text: |-
      Op gezamenlijk verzoek van besturen van gemeenten in een stedelijk gebied kunnen gedeputeerde staten hen uitnodigen
      een plusregio in te stellen, indien gedeputeerde staten van oordeel zijn dat instelling van een plusregio bijzonder
      aangewezen is vanwege de ruimtelijke afstemmingsproblematiek in dat gebied, ten gevolge van beleidsopgaven terzake
      van volkshuisvesting, bedrijfsvestiging, verkeer en vervoer, recreatie of stedelijk groen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel106
  - number: '106.2'
    text: |-
      Bij hun verzoek kunnen de besturen kenbaar maken welke andere gemeenten zij bij de instelling betrokken willen
      zien.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel106
  - number: '106.3'
    text: |-
      Gedeputeerde staten kunnen wat betreft de uit te nodigen gemeentebesturen afwijken van het verzoek, na overleg met
      de besturen van de gemeenten die bij het verzoek of de uitnodiging zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel106
  - number: '106.4'
    text: |-
      Gedeputeerde staten maken hun besluit omtrent het verzoek binnen 26 weken na ontvangst van het verzoek openbaar op
      de in de provincie gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel106
  - number: '107'
    text: |-
      Indien naar hun oordeel instelling van een plusregio bijzonder aangewezen is, en zij geen verzoek als
      bedoeld in [artikel 106, eerste lid][ref1] ontvangen, treden gedeputeerde staten in overleg met de
      desbetreffende gemeentebesturen, waarna zij de deelnemers aan het overleg een uitnodiging als bedoeld in
      [artikel 106, eerste lid][ref2], kunnen doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '108.1'
    text: |-
      De besturen van de gemeenten die een uitnodiging als bedoeld in [artikel 106, eerste lid][ref1], hebben ontvangen,
      treffen binnen 26 weken een gemeenschappelijke regeling waarbij een plusregio wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '108.2'
    text: |-
      De regeling wordt gezonden aan gedeputeerde staten en aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel108
  - number: '109.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een register van alle gemeenschappelijke
      regelingen waarbij een plusregio is ingesteld in overeenstemming met de uitnodiging, bedoeld in
      [artikel 106, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '109.2'
    text: |-
      De regeling waarbij een plusregio is ingesteld, treedt niet in werking dan na opneming in het register. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties doet van de opneming in het register mededeling in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel109
  - number: '109.3'
    text: |-
      In het register wordt van iedere plusregio in ieder geval vermeld welke gemeenten daarvan deel uitmaken, het
      adres en de plaats van vestiging, welke taken en bevoegdheden bij een andere dan deze wet aan die plusregio zijn
      opgedragen en welke taken en bevoegdheden bij provinciaal besluit aan die plusregio zijn overgedragen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel109
  - number: '110.1'
    text: |-
      Tot toetreding tot, uittreding uit of opheffing van een plusregio wordt niet besloten dan na een verklaring van
      geen bezwaar van gedeputeerde staten en, indien bij wet één of meer bevoegdheden of taken aan de plusregio zijn
      opgedragen, van Onze Ministers wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel110
  - number: '110.2'
    text: |-
      De [artikelen 107][ref1], [108, tweede lid][ref2], en [109, tweede lid][ref3], zijn van overeenkomstige toepassing
      op een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel109
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '107'
        hoofdstuk: XI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '108'
        hoofdstuk: XI
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '109'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '111.1'
    text: |-
      In afwijking van [artikel 13, negende lid][ref1], kan het algemeen bestuur van een plusregio een voorzitter
      aanwijzen van buiten de kring van het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
  - number: '111.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, is [artikel 21][ref1] op de voorzitter niet van toepassing. Bij
      of krachtens regeling van het algemeen bestuur, wordt in ieder geval de bezoldiging van de voorzitter geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel21
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '21'
        hoofdstuk: I
        paragraaf: '2'
  - number: '111.3'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, zijn de [artikelen 66, tweede tot en met vierde lid][ref1], en
      [67 tot en met 71 van de Gemeentewet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel67
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '67'
  - number: '112.1'
    text: |-
      In een regeling kan worden bepaald dat het algemeen bestuur van de plusregio commissies kan instellen ter
      behartiging van een of meer belangen van een deel van de gemeenten in die plusregio. Het algemeen bestuur regelt de
      bevoegdheden en samenstelling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel112
  - number: '112.2'
    text: |-
      De [artikelen 21][ref1], [23, eerste en tweede lid][ref2], en [25, derde tot en met zevende lid][ref3], van deze
      wet en de [artikelen 139 tot en met 144 van de Gemeentewet][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '21'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '25'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '139'
  - number: '113'
    text: |-
      Bij een oplegging als bedoeld in deze paragraaf treedt [artikel 114][ref1] in de plaats van [hoofdstuk X][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukX
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '114'
        hoofdstuk: XI
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003740
        hoofdstuk: X
  - number: '114.1'
    text: |-
      Indien niet binnen de termijn, bedoeld in [artikel 108, eerste lid][ref1], door de besturen van de desbetreffende
      gemeenten een regeling aan gedeputeerde staten is gezonden, kunnen gedeputeerde staten besluiten binnen 13 weken
      een regeling op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel108
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '108'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '114.2'
    text: |-
      Gedeputeerde staten zenden een afschrift van de opgelegde regeling aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel114
  - number: '115.1'
    text: |-
      Het bestuur van een gemeente in een plusregio verleent zijn medewerking aan de uitvoering van besluiten die het
      bestuur van de plusregio neemt in verband met de uitoefening van de aan dat bestuur opgedragen bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel115
  - number: '115.2'
    text: |-
      Indien het bestuur van een gemeente naar het oordeel van het dagelijks bestuur van de plusregio de in het eerste
      lid bedoelde medewerking niet of niet in voldoende mate verleent, kan het dagelijks bestuur zelf ten laste van de
      betrokken gemeente een besluit uitvoeren of doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel115
  - number: '115.3'
    text: |-
      Alvorens over te gaan tot toepassing van het tweede lid, wordt het bestuur van de betrokken gemeente in kennis
      gesteld van het daarop gerichte voornemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel115
  - number: '116.1'
    text: |-
      Indien naar het oordeel van gedeputeerde staten het bestuur van een plusregio tekort schiet in de uitoefening
      respectievelijk uitvoering van een aan dat bestuur krachtens de regeling of bij of krachtens de wet op- of
      overgedragen bevoegdheid of taak, kunnen zij aan dat bestuur een aanwijzing geven die inhoudt dat het bestuur die
      bevoegdheid of taak uitoefent respectievelijk uitvoert op de wijze als in de aanwijzing bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel116
  - number: '116.2'
    text: De aanwijzing wordt niet gegeven dan nadat gedeputeerde staten het bestuur van de plusregio hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel116
  - number: '116.3'
    text: |-
      Bij de aanwijzing stellen gedeputeerde staten een termijn binnen welke het bestuur van de plusregio aan de
      aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel116
  - number: '116.4'
    text: |-
      Indien het bestuur van de plusregio niet binnen de termijn, bedoeld in het derde lid, aan de aanwijzing voldoet,
      oefenen respectievelijk voeren gedeputeerde staten de desbetreffende bevoegdheid of taak uit namens dat bestuur en
      ten laste van de plusregio.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel116
  - number: '117.1'
    text: |-
      Onze Minister wie het aangaat, kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, gedeputeerde staten uitnodigen toepassing te geven aan [artikel 116, eerste lid][ref1]. De
      uitnodiging vermeldt de termijn binnen welke een aanwijzing dient te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel116
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '116'
        hoofdstuk: XI
        paragraaf: '5'
  - number: '117.2'
    text: |-
      Indien gedeputeerde staten aan de uitnodiging geen gevolg geven, wordt de aanwijzing gegeven door Onze
      Minister wie het aangaat, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
      [Artikel 116, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel116
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '116'
        hoofdstuk: XI
        paragraaf: '5'
  - number: '118'
    text: |-
      Een regeling voorziet erin dat het algemeen bestuur van de plusregio ter behartiging van de economische
      ontwikkeling van de plusregio ten minste:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel118
  - number: 118.a
    text: periodiek een regionaal-economische ontwikkelingsstrategie opstelt;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel118
  - number: 118.b
    text: |-
      het beleid aangeeft ter zake van de uitoefening van zijn bevoegdheden met betrekking tot bedrijventerreinen,
      kantoorlocaties en detailhandelsvoorzieningen die van regionaal belang zijn, daaronder mede begrepen de zee- en
      luchthavens en de daarbij behorende bedrijfslocaties;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel118
  - number: 118.c
    text: de hoofdlijnen vaststelt van een regionaal promotie- en acquisitiebeleid gericht op bedrijfsvestiging en toerisme.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel118
  - number: '119.1'
    text: |-
      Een regeling voorziet in de bevoegdheid van het algemeen bestuur van een plusregio voorschriften te geven met
      betrekking tot het door de gemeenten in die regio verwerven en uitgeven van gronden, de aanleg van voorzieningen
      van openbaar nut, het verhaal van kosten daarvan, alsmede de mate waarin de financiële gevolgen worden verdeeld
      over de gemeenten in de regio.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel119
  - number: '119.2'
    text: |-
      Een regeling voorziet tevens in de bevoegdheid van het algemeen bestuur van een plusregio gebieden aan te wijzen,
      ten aanzien waarvan dat bestuur kan bepalen dat de verwerving en de uitgifte van de gronden, de aanleg van
      voorzieningen van openbaar nut, alsmede het verhaal van kosten daarvan, uitsluitend door of vanwege het bestuur van
      die regio kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel119
  - number: '119.3'
    text: |-
      Een regeling voorziet voorts in de bevoegdheid van het bestuur van een plusregio voorschriften te geven met
      betrekking tot het onderhoud en het beheer van de in het eerste en het tweede lid bedoelde gronden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel119
  - number: '120.1'
    text: |-
      Een geschil omtrent de uitnodiging van gedeputeerde staten, bedoeld in [artikel 106, eerste lid][ref1], wordt
      beslist door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Indien het geschilpunt daartoe aanleiding
      geeft, beslist hij in overeenstemming met Onze Ministers wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '106'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '120.2'
    text: |-
      De termijn, genoemd in [artikel 108, eerste lid][ref1], wordt opgeschort totdat op het geschil is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel108
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '108'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '121'
    text: |-
      Indien het bestuur van een gemeente in een plusregio beroep instelt tegen een besluit van het bestuur van de
      plusregio, is [artikel 7:1 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '122'
    text: |-
      Tegen een besluit als bedoeld in [artikel 114][ref1] en tegen een aanwijzing als bedoeld in de
      [artikelen 116, eerste lid][ref2], en [117, tweede lid][ref3], kan een belanghebbende beroep instellen bij de
      Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel117
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '114'
        hoofdstuk: XI
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '116'
        hoofdstuk: XI
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '117'
        hoofdstuk: XI
        paragraaf: '5'
  - number: '123'
    text: |-
      In een regeling kan worden bepaald dat [artikel 28][ref1] niet van toepassing is. In dat geval voorziet de regeling
      anderszins in de beslechting van geschillen als bedoeld in [artikel 28, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel28
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '28'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '28'
        hoofdstuk: I
        paragraaf: '2'
  - number: '137'
    text: |-
      Waar in enig wettelijk voorschrift in algemene zin naar de Wet gemeenschappelijke regelingen wordt verwezen, wordt
      deze verwijzing geacht te zijn geschied naar deze wet.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel137
  - number: '139.1'
    text: Onze Minister van Binnenlandse Zaken is belast met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel139
  - number: '139.2'
    text: |-
      Voor zover bij die uitvoering belangen zijn betrokken, welke aan de zorg van een andere minister zijn toevertrouwd,
      geschiedt de uitvoering in overeenstemming met de desbetreffende minister.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel139
  - number: '140'
    text: Deze wet kan worden aangehaald als "Wet gemeenschappelijke regelingen".
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel140
  - number: '141'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel141
