  - number: '54.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien van
      de belangen ter behartiging waarvan zij is getroffen en voor het gebied waarvoor zij geldt, zodanige bevoegdheden
      van regeling en bestuur worden overgedragen, als aan de besturen van de deelnemende gemeenten en provincies met
      betrekking tot hun eigen gemeente, onderscheidenlijk provincie toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel54
  - number: 54.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te heffen
      dan de rechten, bedoeld in [artikel 229, eerste lid, onder ][ref1] en in [artikel 223 van de Provinciewet][ref2],
      de belasting, bedoeld in [artikel 222][ref3], de rechten waarvan heffing krachtens bijzondere wetten geschiedt en
      de heffing bedoeld in [artikel 15.33 van de Wet milieubeheer][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '223'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 222c
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 54.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel54
  - number: '54.2'
    text: |-
      Indien toepassing wordt gegeven aan het bepaalde in het eerste lid, wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de deelnemende gemeenten en provincies geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel54
  - number: '54.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende gemeente of provincie, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat
      de verordening van de gemeente of provincie voor het gehele gebied, dan wel voor een gedeelte daarvan geheel of
      gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel54
  - number: '55'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel55
  - number: '56'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges
      of ambtenaren de bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1] en die bedoeld in
      [hoofdstuk XV van de Provinciewet][ref2], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: '57.1'
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      voor de verdeling van de bevoegdheden van de provinciale besturen over de provinciale bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel57
  - number: '57.2'
    text: |-
      Indien en voor zover de in het eerste lid bedoelde bevoegdheden van het bestuur van een openbaar lichaam en die
      van een gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten zijn overgedragen zijn
      daarop, in afwijking van het bepaalde in het eerste lid, van overeenkomstige toepassing de regels, in de ruimste
      zin, welke bij of krachtens de wet zijn gesteld voor de verdeling van de bevoegdheden van de gemeentebesturen over
      de gemeentelijke bestuursorganen, voor de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel57
  - number: '57.3'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die door het bestuur van het openbaar
      lichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden ontleend aan de regels, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel57
  - number: '57.4'
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste en tweede lid, onevenredig belastend zou zijn in verhouding tot het met die regels
      beoogde doel, kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel57
  - number: '58.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel58
  - number: '58.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee weken
      na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting dient,
      aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel58
  - number: '58.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel58
  - number: '58.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel58
  - number: '59.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten en aan provinciale staten
      van de deelnemende provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel59
  - number: '59.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten en provincies voor een
      ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
      [Artikel 190, tweede en derde lid, van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
  - number: '59.3'
    text: |-
      De raad van een deelnemende gemeente en provinciale staten van een deelnemende provincie kunnen bij het dagelijks
      bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-
      begroting naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de
      ontwerp-begroting, zoals deze aan het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel59
  - number: '59.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden der deelnemende gemeenten en de staten der
      deelnemende provincies, die ter zake bij Onze Minister van Binnenlandse Zaken hun zienswijze naar voren kunnen
      brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel59
  - number: '59.5'
    text: |-
      Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van de begroting.
      In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen
      hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel59
  - number: '61.1'
    text: |-
      De raden, de colleges van burgemeester en wethouders en de burgemeesters van een of meer gemeenten kunnen,
      afzonderlijk of te zamen, met de algemene besturen, de dagelijkse besturen en de voorzitters van een of meer
      waterschappen, ieder voor zover zij voor de eigen gemeente, onderscheidenlijk het eigen waterschap bevoegd zijn,
      een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die gemeenten of
      waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel61
  - number: '61.2'
    text: |-
      Een college van burgemeester en wethouders, en een burgemeester, onderscheidenlijk een dagelijks bestuur en een
      voorzitter van een waterschap gaan niet over tot het treffen van een regeling dan na verkregen toestemming van
      de gemeenteraad, onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel61
  - number: '61.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel61
  - number: '62'
    text: |-
      De [artikelen 8 tot en met 29][ref1] zijn van overeenkomstige toepassing met dien verstande dat bij de toepassing
      van [artikel 16, zesde lid][ref2], voor de woorden "artikel 25 van de Gemeentewet" wordt gelezen: het bepaalde voor
      het orgaan dat het lid heeft aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
  - number: '63.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien
      van de belangen ter behartiging waarvan zij wordt getroffen en voor het gebied waarvoor zij geldt, zodanige
      bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de deelnemende gemeenten en
      waterschappen toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel63
  - number: 63.1.a
    text: |-
      aan het nieuwe bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen
      te heffen dan de rechten, bedoeld in [artikel 229, eerste lid, onder ][ref1] en de rechten waarvan de heffing
      krachtens bijzondere wetten geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: 63.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel63
  - number: '63.2'
    text: |-
      Indien toepassing wordt gegeven aan het bepaalde in het eerste lid wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de deelnemende gemeenten en waterschappen geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel63
  - number: '63.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende gemeente of van een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge verhouding.
      Zij kan bepalen, dat de verordening van de gemeente of van het waterschap voor het gehele gebied, dan wel voor een
      gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel63
  - number: '64'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel64
  - number: '65'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
  - number: '66.1'
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld voor
      de verdeling van de bevoegdheden van de gemeentebesturen over de gemeentelijke bestuursorganen, voor de uitoefening
      van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of krachtens deze wet
      is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel66
  - number: '66.2'
    text: |-
      Indien en voor zover de in het eerste lid bedoelde bevoegdheden van het bestuur van een openbaar lichaam en die van
      een gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen zijn
      daarop, in afwijking van het bepaalde in het eerste lid, van overeenkomstige toepassing de regels, in de ruimste
      zin, welke bij of krachtens de wet zijn gesteld ten aanzien van de verdeling van de bevoegdheden van de deelnemende
      waterschappen over hun bestuursorganen, voor de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel66
  - number: '66.3'
    text: |-
      De besturen van de deelnemende gemeenten en waterschappen kunnen bij de regeling beperkingen aanbrengen in de
      bevoegdheden die door het bestuur van het openbaar lichaam, onderscheidenlijk het gemeenschappelijk orgaan zouden
      kunnen worden ontleend aan de regelen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel66
  - number: '66.4'
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste en tweede lid, onevenredig belastend zou zijn in verhouding tot het met die regelen
      beoogde doel, kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel66
  - number: '67.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel67
  - number: '67.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee weken
      na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting dient,
      aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel67
  - number: '67.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel67
  - number: '67.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel67
  - number: '68.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten en aan de algemene
      besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel68
  - number: '68.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten en waterschappen voor
      een ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
      [Artikel 190, tweede en derde lid, van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
  - number: '68.3'
    text: |-
      De raden van de deelnemende gemeenten en de algemene besturen van de deelnemende waterschappen kunnen bij het
      dagelijks bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de
      ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat
      bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel68
  - number: '68.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van de deelnemende gemeenten en aan de algemene
      besturen van de deelnemende waterschappen, die ter zake bij gedeputeerde staten hun zienswijze naar voren kunnen
      brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel68
  - number: '68.5'
    text: |-
      Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van de begroting.
      In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen
      hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel68
  - number: '73.1'
    text: |-
      De raden, de colleges van burgemeester en wethouders en de burgemeesters van een of meer gemeenten kunnen,
      afzonderlijk of te zamen, met provinciale staten, de colleges van gedeputeerde staten en de commissarissen van
      de Koning van een of meer provincies en de algemene besturen, de dagelijkse besturen en de voorzitters van een of
      meer waterschappen, ieder voor zover zij voor de eigen gemeente, de eigen provincie, onderscheidenlijk het eigen
      waterschap bevoegd zijn, een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen
      van die gemeenten, provincies of waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel73
  - number: '73.2'
    text: |-
      Een college van burgemeester en wethouders en een burgemeester, een college van gedeputeerde staten en een
      commissaris van de Koning, onderscheidenlijk een dagelijks bestuur en een voorzitter van een waterschap gaan
      niet over tot het treffen van een regeling dan na verkregen toestemming van de gemeenteraad, provinciale staten,
      onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel73
  - number: '73.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel73
  - number: '74.1'
    text: |-
      De [artikelen 8 tot en met 27][ref1] zijn van overeenkomstige toepassing, met uitzondering van
      [artikel 20, vierde lid][ref2], en met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel20
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
  - number: 74.1.a
    text: |-
      bij de toepassing van [artikel 16, zesde lid][ref1], voor de woorden "[artikel 25 van de Gemeentewet][ref2]" wordt
      gelezen: het bepaalde voor het orgaan dat het lid heeft aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '25'
  - number: 74.1.b
    text: |-
      de ontheffing bedoeld in [artikel 20, tweede lid][ref1], wordt verleend door Onze Minister van Binnenlandse Zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel20
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
  - number: 74.1.c
    text: |-
      bij de toepassing van [artikel 21, vijfde lid][ref1], voor [artikel 99 van de Gemeentewet][ref2] wordt gelezen
      [artikel 96 van de Provinciewet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel21
