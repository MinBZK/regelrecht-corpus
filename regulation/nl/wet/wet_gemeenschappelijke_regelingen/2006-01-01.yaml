  - number: 41.1.h
    text: |-
      bij de toepassing van [artikel 25, eerste lid][ref1] jo [artikel 21, vijfde lid][ref2], voor
      [artikel 99 van de Gemeentewet][ref3] wordt gelezen [artikel 96 van de Provinciewet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel99
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel96
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '25'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '21'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '99'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '96'
  - number: 41.1.i
    text: |-
      bij de toepassing van [artikel 26, vierde lid, eerste volzin][ref1], voor gedeputeerde staten wordt gelezen
      gedeputeerde staten van de provincie, waarin de plaats van vestiging gelegen is;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel26
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '26'
        hoofdstuk: I
        paragraaf: '2'
  - number: 41.1.j
    text: |-
      bij de toepassing van [artikel 27, eerste lid][ref1], voor «Burgemeester en wethouders» wordt gelezen «Gedeputeerde
      staten» en voor «hun gemeente»: hun provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel27
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '27'
        hoofdstuk: I
        paragraaf: '2'
  - number: '41.2'
    text: |-
      Wanneer is gehandeld in strijd met het bepaalde in het eerste lid juncto [artikel 20, eerste lid][ref1], is
      [artikel X 7, eerste tot en met vijfde lid, van de Kieswet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_7
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_7
  - number: '43.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien
      van de belangen ter behartiging waarvan zij wordt getroffen en voor het gebied waarvoor zij geldt, zodanige
      bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de deelnemende provincies
      toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel43
  - number: 43.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te heffen
      dan de belasting, bedoeld in [artikel 222][ref1], de rechten, bedoeld in [artikel 223 van de Provinciewet][ref2],
      en de rechten waarvan de heffing krachtens bijzondere wetten geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel223
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 222c
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '223'
  - number: 43.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel43
  - number: '43.2'
    text: |-
      Indien toepassing wordt gegeven aan het bepaalde in het eerste lid wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de deelnemende provincies geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel43
  - number: '43.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemende provincie, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat de
      verordening der provincie voor het gehele gebied, dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt
      te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel43
  - number: '44'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel44
  - number: '45'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Provinciewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: '46.1'
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      voor de verdeling van de bevoegdheden van de provinciale besturen over de provinciale bestuursorganen, voor de
      uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel46
  - number: '46.2'
    text: |-
      De besturen van de deelnemende provincies kunnen bij de regeling beperkingen aanbrengen in de bevoegdheden die door
      het bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden ontleend
      aan de regels, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel46
  - number: '46.3'
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste lid, onevenredig belastend zou zijn in verhouding tot het met die regels beoogde
      doel, kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel46
  - number: '47.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel47
  - number: '47.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee weken
      na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting dient,
      aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel47
  - number: '47.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel47
  - number: '47.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel47
  - number: '48.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan provinciale staten van de deelnemende provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel48
  - number: '48.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de besturen van de deelnemende provincies voor een ieder ter
      inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld. Van de terinzagelegging en de
      verkrijgbaarstelling geschiedt openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel48
  - number: '48.3'
    text: |-
      Provinciale staten van de deelnemende provincies kunnen bij het dagelijks bestuur van het openbaar lichaam
      onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het
      dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan
      het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel48
  - number: '48.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan provinciale staten der deelnemende provincies, die ter zake
      bij Onze Minister van Binnenlandse Zaken hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel48
  - number: '48.5'
    text: |-
      Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van de begroting.
      In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen
      hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel48
  - number: '50.1'
    text: |-
      De algemene besturen, de dagelijkse besturen en de voorzitters van twee of meer waterschappen kunnen afzonderlijk
      of tezamen, ieder voor zover zij voor het eigen waterschap bevoegd zijn, een gemeenschappelijke regeling treffen
      ter behartiging van een of meer bepaalde belangen van die waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50
  - number: '50.2'
    text: |-
      De dagelijkse besturen en de voorzitters van waterschappen gaan niet over tot het treffen van een regeling dan na
      verkregen toestemming van de algemene besturen van de waterschappen.De toestemming kan slechts worden onthouden
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50
  - number: '50.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50
  - number: 50a.1
    text: |-
      De [artikelen 8 tot en met 24][ref1] en [26 tot en met 29][ref2] zijn van overeenkomstige toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel26
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '26'
        hoofdstuk: I
        paragraaf: '2'
  - number: 50a.1.a
    text: |-
      bij de toepassing van [artikel 16, zesde lid][ref1], voor de woorden "[artikel 25 van de Gemeentewet][ref2]" wordt
      gelezen: het reglement van het waterschap dat het lid heeft aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '25'
  - number: 50a.1.b
    text: |-
      bij de toepassing van [artikel 21, vijfde lid][ref1], voor de woorden "[Artikel 99 van de Gemeentewet][ref2]" wordt
      gelezen: Hetgeen in de voor de deelnemende waterschappen geldende reglementen overigens omtrent vergoedingen en
      tegemoetkomingen is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '21'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '99'
  - number: 50a.1.c
    text: |-
      bij de toepassing van [artikel 22, eerste lid][ref1], voor de woorden "De [artikelen 16][ref2], [17][ref3],
      [19][ref4], [20][ref5], [22][ref6], [26][ref7] en [28 tot en met 33 van de Gemeentewet][ref8]" wordt gelezen: De
      desbetreffende bepalingen uit de voor de deelnemende waterschappen geldende reglementen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref7]: https://wetten.overheid.nl/BWBR0005416#Artikel26
      [ref8]: https://wetten.overheid.nl/BWBR0005416#Artikel28
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '22'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '20'
      - id: ref6
        bwb_id: BWBR0005416
        artikel: '22'
      - id: ref7
        bwb_id: BWBR0005416
        artikel: '26'
      - id: ref8
        bwb_id: BWBR0005416
        artikel: '28'
  - number: 50a.1.d
    text: |-
      bij de toepassing van [artikel 27, eerste lid][ref1], voor «Burgemeester en wethouders» wordt gelezen «Gedeputeerde
      staten» en voor «hun gemeente»: in hun provincie gelegen waterschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel27
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '27'
        hoofdstuk: I
        paragraaf: '2'
  - number: 50a.2
    text: |-
      Wanneer bij de toepassing van voor de deelnemende waterschappen geldende reglementen als bedoeld in het vorige lid,
      onderdeel b en c en in [artikel 50e][ref1] de desbetreffende bepalingen in die reglementen onderling verschillen,
      wordt in de regeling aangegeven welke bepalingen van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50e
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50e
        hoofdstuk: III
        paragraaf: '3'
  - number: 50b.1
    text: |-
      Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien
      van de belangen ter behartiging waarvan zij wordt getroffen en voor het gebied waarvoor zij geldt, zodanige
      bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de deelnemende waterschappen
      toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50b
  - number: 50b.1.a
    text: |-
      aan het bestuur van een openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te heffen
      dan de rechten bedoeld in [artikel 115 van de Waterschapswet][ref1] (*Stb.* 1991, 444) alsmede de bijdragen bedoeld
      in [artikel 113, tweede lid, van de Waterschapswet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel113
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '115'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '113'
  - number: 50b.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50b
  - number: 50b.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende waterschappen geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50b
  - number: 50b.3
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat de
      verordening van het waterschap voor het gehele gebied, dan wel een gedeelte daarvan geheel of gedeeltelijk ophoudt
      te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50b
  - number: 50c
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50c
  - number: 50d
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XVIII van de Waterschapswet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50d
    references:
      - id: ref1
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: 50e.1
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld
      ten aanzien van de verdeling van de bevoegdheden van de deelnemende waterschappen over hun bestuursorganen, voor
      de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50e
  - number: 50e.2
    text: |-
      De besturen van de deelnemende waterschappen kunnen bij de regeling beperkingen aanbrengen in de bevoegdheden die
      door het bestuur van het openbaar lichaam, onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden
      ontleend aan de regelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50e
  - number: 50e.3
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste lid, onevenredig belastend zou zijn in verhouding tot het met die regels beoogde
      doel, kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50e
  - number: 50f.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50f
  - number: 50f.2
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen vier weken
      na de vaststelling, doch in ieder geval vóór 1 augustus van het jaar voorafgaande aan dat waarvoor de begroting
      dient, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50f
  - number: 50f.3
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50f
  - number: 50f.4
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50f
  - number: 50g.1
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50g
  - number: 50g.2
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende waterschappen voor een ieder ter inzage gelegd en tegen
      betaling van kosten algemeen verkrijgbaar gesteld. Van de terinzagelegging en de verkrijgbaarstelling geschiedt
      openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50g
  - number: 50g.3
    text: |-
      De algemene besturen van de deelnemende waterschappen kunnen bij het dagelijks bestuur van het openbaar lichaam
      onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het
      dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan
      het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50g
  - number: 50g.4
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de algemene besturen van de deelnemende waterschappen, die
      terzake bij gedeputeerde staten hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50g
  - number: 50g.5
    text: |-
      Het bepaalde in het eerste, het derde en het vierde lid is mede van toepassing op besluiten tot wijziging
      van de begroting. In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën
      begrotingswijzigingen hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50g
  - number: 50h
    text: |-
      Een regeling behoeft de goedkeuring van gedeputeerde staten indien gebruik is gemaakt van een bevoegdheid als
      bedoeld in de [artikelen 50a][ref1] juncto [8][ref2], danwel indien één der voor de deelnemende waterschappen
      geldende reglementen dat voorschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50h
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 50i
    text: |-
      Een regeling waaraan in verschillende provincies gelegen waterschappen deelnemen behoeft, indien gebruik is gemaakt
      van een bevoegdheid als bedoeld in de [artikelen 50a][ref1] juncto [8][ref2], de goedkeuring van gedeputeerde
      staten van de provincie, waarin de plaats van vestiging is gelegen, de andere betrokken colleges van gedeputeerde
      staten gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel50i
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 50j
    text: |-
      De in [artikel 50][ref1] bedoelde goedkeuring treedt in de plaats van de goedkeuring door gedeputeerde staten,
      bedoeld in [artikel 50][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50i
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel50h
