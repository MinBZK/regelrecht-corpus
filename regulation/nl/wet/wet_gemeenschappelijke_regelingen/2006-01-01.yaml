$id: wet_gemeenschappelijke_regelingen
regulatory_layer: WET
publication_date: '2024-12-10'
valid_from: '2006-01-01'
bwb_id: BWBR0003740
url: https://wetten.overheid.nl/BWBR0003740/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, nieuwe bepalingen vast te stellen met betrekking tot
    gemeenschappelijke regelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De raden, de colleges van burgemeester en wethouders en de burgemeesters van twee of meer gemeenten kunnen
      afzonderlijk of te zamen, ieder voor zover zij voor de eigen gemeente bevoegd zijn, een gemeenschappelijke regeling
      treffen ter behartiging van een of meer bepaalde belangen van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel1
  - number: '1.2'
    text: |-
      De colleges van burgemeester en wethouders en de burgemeesters gaan niet over tot het treffen van een regeling dan
      na verkregen toestemming van de gemeenteraden. De toestemming kan slechts worden onthouden wegens strijd met het
      recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel1
  - number: '1.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel1
  - number: '8.1'
    text: Bij de regeling kan een openbaar lichaam worden ingesteld. Het openbaar lichaam is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel8
  - number: '8.2'
    text: |-
      In daarvoor bijzonder in aanmerking komende gevallen kan bij de regeling, in plaats van een openbaar lichaam, een
      gemeenschappelijk orgaan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel8
  - number: '8.3'
    text: |-
      In de regeling kan worden bepaald dat daarin omschreven bevoegdheden van bestuursorganen of van ambtenaren van aan
      de regeling deelnemende gemeenten worden uitgeoefend door bestuursorganen, onderscheidenlijk door ambtenaren van
      een der deelnemende gemeenten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel8
  - number: '9.1'
    text: |-
      De voor onbepaalde tijd getroffen regeling houdt bepalingen in omtrent wijziging, opheffing, toetreding en
      uittreding.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel9
  - number: '9.2'
    text: |-
      De regeling waarbij een openbaar lichaam wordt ingesteld houdt bepalingen in omtrent de vereffening van het
      vermogen ingeval dat openbaar lichaam wordt ontbonden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het bij een regeling ingestelde openbaar lichaam blijft na zijn ontbinding voortbestaan voorzover dit tot
      vereffening van zijn vermogen nodig is.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel9
  - number: '10.1'
    text: De regeling vermeldt het belang of de belangen ter behartiging waarvan zij is getroffen of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel10
  - number: '10.2'
    text: |-
      Een regeling, waarbij gebruik wordt gemaakt van de bevoegdheid, bedoeld in [artikel 8, eerste of tweede lid][ref1],
      geeft aan welke bevoegdheden de besturen van de deelnemende gemeenten aan het bestuur van het openbaar lichaam
      onderscheidenlijk aan het gemeenschappelijk orgaan bij het aangaan van de regeling overdragen. Een regeling als
      hier bedoeld kan bepalingen inhouden omtrent de wijze waarop verandering kan worden gebracht in de overgedragen
      bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.3'
    text: |-
      Een regeling als bedoeld in het tweede lid houdt bepalingen in omtrent de inrichting en samenstelling van het
      bestuur van het openbaar lichaam onderscheidenlijk de samenstelling van het gemeenschappelijk orgaan en wijst de
      plaats van vestiging aan.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel10
  - number: '10.4'
    text: |-
      Een regeling als bedoeld in [artikel 8, eerste of tweede lid][ref1], kan aangeven dat een ombudsman
      of ombudscommissie van een van de deelnemers aan de gemeenschappelijke regeling als bedoeld in
      [artikel 81p, eerste lid, van de Gemeentewet][ref2], [artikel 79q, eerste lid, van de Provinciewet][ref3] of
      [artikel 51b, eerste lid, van de Waterschapswet][ref4] bevoegd is tot de behandeling van verzoekschriften als
      bedoeld in [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref5]. Indien een regeling de hiervoor
      bedoelde bevoegdheid instelt, dan wel deze beëindigt, zendt het bestuur de regeling aan de Nationale ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel79q
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81p
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 79q
      - id: ref4
        bwb_id: BWBR0005108
        artikel: 51b
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 10a.1
    text: |-
      De deelnemers aan een regeling waarbij gebruik is gemaakt van de bevoegdheid, bedoeld in
      [artikel 8, eerste of tweede lid][ref1], verlenen hun medewerking aan de uitvoering van besluiten die het bestuur
      van een openbaar lichaam of het gemeenschappelijk orgaan neemt in verband met de uitoefening van de aan dat bestuur
      of orgaan overgedragen bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 10a.2
    text: |-
      Indien een deelnemer naar het oordeel van het bestuur van een openbaar lichaam of het gemeenschappelijk orgaan de
      in het eerste lid bedoelde medewerking niet of niet in voldoende mate verleent, kan het bestuur van het openbaar
      lichaam of het gemeenschappelijk orgaan namens en ten laste van de betrokken deelnemer een besluit uitvoeren of
      doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Alvorens over te gaan tot toepassing van het tweede lid, wordt het bestuur van de betrokken deelnemer in kennis
      gesteld van het daarop gerichte voornemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel10a
  - number: '11'
    text: |-
      In de regeling kan een termijn worden aangegeven gedurende welke een of meer van de deelnemers is of zijn
      vrijgesteld van uit deze regeling voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel11
  - number: '12.1'
    text: Het bestuur van het openbaar lichaam bestaat uit een algemeen bestuur, een dagelijks bestuur en een voorzitter.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel12
  - number: '12.2'
    text: Het algemeen bestuur staat aan het hoofd van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel12
  - number: '12.3'
    text: De voorzitter is tevens voorzitter van het algemeen bestuur en van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het algemeen bestuur van een openbaar lichaam, ingesteld bij een regeling die is getroffen of mede is getroffen
      door gemeenteraden, bestaat uit leden, die per deelnemende gemeente door de raad uit zijn midden, de voorzitter
      inbegrepen, en uit de wethouders worden aangewezen. Indien de regeling uitsluitend strekt tot behartiging van
      opleiding en vorming van ambtenaren, kan in de regeling worden bepaald, dat ook de gemeentesecretaris als lid van
      het algemeen bestuur kan worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het lidmaatschap van het algemeen bestuur eindigt van rechtswege, zodra men ophoudt lid of voorzitter te zijn
      van de raad uit wiens midden men is aangewezen dan wel ophoudt wethouder of secretaris van de desbetreffende
      deelnemende gemeente te zijn.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.3'
    text: |-
      De regeling bepaalt het aantal leden van het algemeen bestuur, dat door de raad van elke deelnemende gemeente wordt
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.4'
    text: 'De regeling kan inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: 13.4.a
    text: de aantallen leden, die door de raden van de deelnemende gemeenten worden aangewezen, onderling verschillen;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: 13.4.b
    text: leden, aangewezen door de raden van bepaalde deelnemende gemeenten, meervoudig stemrecht hebben.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: 13.4.c
    text: het algemeen bestuur bij gekwalificeerde meerderheid besluit ten aanzien van in de regeling aangeduide besluiten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.5'
    text: 'De regeling kan tevens inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: 13.5.a
    text: de raden van niet alle, doch ten minste twee deelnemende gemeenten leden van het algemeen bestuur aanwijzen;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: 13.5.b
    text: de raden van twee of meer deelnemende gemeenten gezamenlijk leden van het algemeen bestuur aanwijzen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.6'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door colleges van burgemeester en wethouders, is het bepaalde in het
      eerste tot en met het vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.7'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door burgemeesters, vormen zij het algemeen bestuur. De regeling kan
      inhouden, dat burgemeesters van bepaalde gemeenten meervoudig stemrecht hebben.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.8'
    text: 'De regeling, bedoeld in het zevende lid, kan tevens inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: 13.8.a
    text: niet alle deelnemende burgemeesters zitting hebben in het algemeen bestuur;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: 13.8.b
    text: |-
      twee of meer deelnemende burgemeesters gezamenlijk uit hun midden een of meer leden van het algemeen bestuur
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '13.9'
    text: |-
      De voorzitter van het openbaar lichaam wordt door en uit het algemeen bestuur aangewezen, met inachtneming van het
      daaromtrent in de regeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam bestaat uit de voorzitter en twee of meer andere leden, door en
      uit het algemeen bestuur aan te wijzen, met inachtneming van het daaromtrent in de regeling bepaalde. De aldus
      aangewezen leden van het dagelijks bestuur mogen niet allen afkomstig zijn uit dezelfde gemeente.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel14
  - number: '14.2'
    text: |-
      Wanneer de aard van de regeling daartoe aanleiding geeft, kunnen één of meer leden van het dagelijks bestuur, niet
      zijnde de voorzitter, worden aangewezen van buiten de kring van het algemeen bestuur, met dien verstande dat op
      deze wijze aangewezen leden nimmer de meerderheid van het dagelijks bestuur mogen uitmaken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel14
  - number: '15'
    text: |-
      Op de samenstelling van het gemeenschappelijk orgaan, bedoeld in [artikel 8, tweede lid][ref1], is
      [artikel 13][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
  - number: '16.1'
    text: |-
      De regeling houdt bepalingen in omtrent de wijze waarop een lid van het algemeen bestuur van het openbaar lichaam
      of een lid van het gemeenschappelijk orgaan aan de raad die dit lid heeft aangewezen, de door een of meer leden van
      die raad gevraagde inlichtingen dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel16
  - number: '16.2'
    text: |-
      De regeling houdt tevens bepalingen in omtrent de wijze, waarop het dagelijks bestuur en een of meer leden daarvan
      aan het algemeen bestuur de door een of meer leden daarvan gevraagde inlichtingen verstrekken, alsmede door het
      algemeen bestuur ter verantwoording kunnen worden geroepen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel16
  - number: '16.3'
    text: |-
      De regeling houdt bepalingen in omtrent de wijze waarop een lid van het algemeen bestuur van het openbaar lichaam
      of een lid van het gemeenschappelijk orgaan door de raad die dit lid heeft aangewezen, ter verantwoording kan
      worden geroepen voor het door hem in dat bestuur onderscheidenlijk dat orgaan gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel16
  - number: '16.4'
    text: |-
      Ingeval toepassing is gegeven aan het bepaalde in [artikel 13, vijfde lid, onder ][ref1], houdt de regeling
      bepalingen in omtrent de wijze waarop aan de raad die geen lid van het algemeen bestuur van het openbaar lichaam
      of van het gemeenschappelijk orgaan aanwijst, de door een of meer leden van die raad gevraagde inlichtingen worden
      verstrekt en de door die raad gevraagde verantwoording wordt afgelegd voor het door dat bestuur onderscheidenlijk
      dat orgaan gevoerde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
  - number: '16.5'
    text: |-
      De regeling houdt bepalingen in omtrent de bevoegdheid van de raad, een door hem aangewezen lid van het
      algemeen bestuur van het openbaar lichaam of een door hem aangewezen lid van het gemeenschappelijk orgaan,
      ontslag te verlenen, indien dit lid het vertrouwen van de raad niet meer bezit. Op het ontslagbesluit is
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '16.6'
    text: |-
      Bij het verstrekken van inlichtingen ingevolge het eerste of het vierde lid, of het afleggen van verantwoording
      ingevolge het derde of het vierde lid, verschaft een lid van het algemeen bestuur van het openbaar lichaam of
      een lid van het gemeenschappelijk orgaan over zaken waaromtrent krachtens [artikel 23][ref1] geheimhouding is
      opgelegd slechts informatie, indien krachtens [artikel 25 van de Gemeentewet][ref2] geheimhouding is opgelegd.
      Laatstbedoelde geheimhouding kan eerst worden opgeheven, nadat door het algemeen bestuur van het openbaar lichaam
      of door het gemeenschappelijk orgaan tot opheffing van de geheimhouding is besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '25'
  - number: '17'
    text: |-
      De regeling houdt bepalingen in omtrent de wijze waarop door het bestuur van het openbaar lichaam of door het
      gemeenschappelijk orgaan aan de raden van de deelnemende gemeenten de door een of meer leden van die raden
      gevraagde inlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel17
  - number: '18'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing op regelingen die uitsluitend getroffen zijn door colleges van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
  - number: '19.1'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door colleges van burgemeester en wethouders is het bepaalde in
      het [eerste, derde, vierde en zesde lid van artikel 16][ref1], van overeenkomstige toepassing ten aanzien van de
      gemeenteraden respectievelijk een of meer leden van die raden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
  - number: '19.2'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door burgemeesters is het bepaalde in het
      [eerste, derde en zesde lid van artikel 16][ref1] van overeenkomstige toepassing ten aanzien van gemeenteraden
      respectievelijk een of meer leden van die raden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
  - number: '20.1'
    text: 'Een lid van het bestuur van het openbaar lichaam mag:'
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.a
    text: |-
      niet als advocaat, procureur, gemachtigde of adviseur werkzaam zijn ten behoeve van de wederpartij van het openbaar
      lichaam of ten behoeve van het bestuur van het openbaar lichaam in geschillen;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.b
    text: |-
      niet als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met het openbaar lichaam
      aangaan van:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.b.1e
    text: overeenkomsten als bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.b.2e
    text: overeenkomsten tot het leveren van onroerende zaken aan het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c
    text: 'rechtstreeks noch middellijk een overeenkomst aangaan betreffende:'
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c.1e
    text: het aannemen van werk ten behoeve van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c.2e
    text: het buiten dienstbetrekking tegen beloning doen van verrichtingen ten behoeve van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c.3e
    text: het leveren van roerende zaken anders dan om niet aan het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c.4e
    text: het verhuren aan het openbaar lichaam van enig goed, met uitzondering van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c.5e
    text: het verwerven van betwiste vorderingen ten laste van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c.6e
    text: |-
      het van het openbaar lichaam ondershands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: 20.1.c.7e
    text: het ondershands huren of pachten van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: '20.2'
    text: Van het bepaalde in het eerste lid onder *c* kunnen gedeputeerde staten ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: '20.3'
    text: |-
      Ten aanzien van een lid van het gemeenschappelijk orgaan is het bepaalde in het eerste lid onder *a* van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
  - number: '20.4'
    text: |-
      Wanneer is gehandeld in strijd met het bepaalde in het eerste lid, is
      [artikel X 8, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_8
  - number: '21.1'
    text: |-
      De leden van het bestuur van een openbaar lichaam of van het gemeenschappelijk orgaan kunnen een tegemoetkoming in
      de kosten en, voor zover zij niet de functie van wethouder, burgemeester of secretaris vervullen, een vergoeding
      voor hun werkzaamheden ontvangen. Deze tegemoetkoming en vergoeding worden bij de regeling, of krachtens de
      regeling door het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan, vastgesteld. Bij
      of krachtens algemene maatregel van bestuur kunnen hieromtrent nadere regels worden gesteld. De hoogte van de
      vergoeding staat in redelijke verhouding tot de aan het lidmaatschap verbonden werkzaamheden, mede rekening
      houdende met de vergoeding voor werkzaamheden welke het bestuurslid ontvangt uit hoofde van zijn lidmaatschap van
      de raad.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid kunnen, in het geval dat aan [artikel 44, vijfde lid, van de Gemeentewet][ref1]
      toepassing wordt gegeven, leden van het bestuur van een openbaar lichaam of van het gemeenschappelijk orgaan,
      bedoeld in het eerste lid, die de functie van wethouder vervullen, een vergoeding voor hun werkzaamheden ontvangen.
      De tweede en derde volzin van het eerste lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel44
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '44'
  - number: '21.3'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde leden kan voorts bij de regeling, of krachtens de regeling door
      het algemeen bestuur van een openbaar lichaam of het gemeenschappelijk orgaan, een tegemoetkoming in of vergoeding
      van bijzondere kosten en andere financiële voorzieningen worden vastgesteld die verband houden met de vervulling
      van het lidmaatschap van het bestuur van een openbaar lichaam of van het gemeenschappelijk orgaan. Bij of krachtens
      algemene maatregel van bestuur kunnen hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel21
  - number: '21.4'
    text: |-
      Een besluit van het algemeen bestuur van het openbaar lichaam of van het gemeenschappelijk orgaan als bedoeld in
      het eerste, tweede en derde lid wordt aan gedeputeerde staten gezonden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel21
  - number: '21.5'
    text: |-
      [Artikel 99 van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '99'
  - number: '22.1'
    text: |-
      De [artikelen 16][ref1], [17][ref2], [19][ref3], [20][ref4], [22][ref5], [26][ref6] en
      [28 tot en met 33 van de Gemeentewet][ref7] zijn, voor zover daarvan bij deze wet niet is afgeweken, op het houden
      en de orde van de vergaderingen van het algemeen bestuur van het openbaar lichaam van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0005416#Artikel28
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '22'
      - id: ref6
        bwb_id: BWBR0005416
        artikel: '26'
      - id: ref7
        bwb_id: BWBR0005416
        artikel: '28'
  - number: '22.2'
    text: |-
      Het algemeen bestuur van het openbaar lichaam en het gemeenschappelijk orgaan vergaderen jaarlijks tenminste
      tweemaal.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel22
  - number: '22.3'
    text: De vergaderingen van het algemeen bestuur zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel22
  - number: '22.4'
    text: |-
      De deuren worden gesloten wanneer een vijfde gedeelte der aanwezige leden daarom verzoekt of de voorzitter het
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel22
  - number: '22.5'
    text: Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het algemeen bestuur kan in een besloten vergadering, op grond van de belangen, genoemd in
      [artikel 10 van de Wet openbaarheid van bestuur][ref1], omtrent het in die vergadering met gesloten deuren
      behandelde en omtrent de inhoud van de stukken welke aan het algemeen bestuur worden overgelegd, geheimhouding
      opleggen. Deze wordt door hen die bij de behandeling aanwezig waren en allen die van het behandelde of de stukken
      kennisdragen, in acht genomen, totdat het algemeen bestuur haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '23.2'
    text: |-
      Op grond van de belangen genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1] kan de geheimhouding
      eveneens worden opgelegd door het dagelijks bestuur en de voorzitter van het openbaar lichaam en door een commissie
      als bedoeld in [artikel 24][ref2] of [25][ref3], ieder ten aanzien van stukken die zij aan het algemeen bestuur of
      aan de leden van het algemeen bestuur overleggen. Daarvan wordt op de stukken melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '24'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '25'
        hoofdstuk: I
        paragraaf: '2'
  - number: '23.3'
    text: |-
      De krachtens het tweede lid aan het algemeen bestuur opgelegde verplichting tot geheimhouding vervalt, indien de
      oplegging niet door het algemeen bestuur in zijn eerstvolgende vergadering, die blijkens de presentielijst door
      meer dan de helft van het aantal zitting hebbende leden, te zamen vertegenwoordigend meer dan de helft van het
      aantal stemmen, is bezocht, wordt bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel23
  - number: '23.4'
    text: |-
      De krachtens het tweede lid aan leden van het algemeen bestuur opgelegde verplichting tot geheimhouding wordt
      door hen in acht genomen totdat het orgaan, dat de verplichting heeft opgelegd, dan wel, indien het onderwerp
      waaromtrent geheimhouding is opgelegd aan het algemeen bestuur is voorgelegd, totdat het algemeen bestuur haar
      opheft. Het algemeen bestuur kan deze beslissing alleen nemen in een vergadering die blijkens de presentielijst
      door meer dan de helft van het aantal zitting hebbende leden, te zamen vertegenwoordigend meer dan de helft van het
      aantal stemmen, is bezocht.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel23
  - number: '23.5'
    text: |-
      Het bepaalde in [artikel 22][ref1] en in het eerste lid van dit artikel is eveneens van toepassing op het
      gemeenschappelijk orgaan, indien de regeling is getroffen of mede is getroffen door gemeenteraden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel23
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
  - number: '24.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam kan commissies van advies instellen. Het regelt de bevoegdheden en de
      samenstelling. [Artikel 94 van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel94
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '94'
  - number: '24.2'
    text: |-
      De instelling van vaste commissies van advies aan het dagelijks bestuur of aan de voorzitter en de regeling van
      haar bevoegdheden en samenstelling geschieden door het algemeen bestuur op voorstel van het dagelijks bestuur
      onderscheidenlijk van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel24
  - number: '24.3'
    text: |-
      Andere commissies van advies aan het dagelijks bestuur of aan de voorzitter worden door het dagelijks bestuur
      onderscheidenlijk de voorzitter ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel24
  - number: '24.4'
    text: |-
      De leden van commissies van advies die geen burgemeester, wethouder of lid van een gemeenteraad
      zijn kunnen een vergoeding voor het bijwonen van vergaderingen van de commissie ontvangen. De
      [artikelen 96 tot en met 99 van de Gemeentewet][ref1], alsmede de op grond daarvan gestelde nadere regelen, zijn
      alsdan van overeenkomstige toepassing, met dien verstande dat, wanneer daarin sprake is van een onderverdeling in
      gemeenteklassen, het bepaalde voor de gemeenteklasse van 50 001-100 000 inwoners van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel96
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '96'
  - number: '25.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam kan commissies instellen met het oog op de behartiging van bepaalde
      belangen indien de regeling in deze mogelijkheid voorziet. Het algemeen bestuur regelt de bevoegdheden en de
      samenstelling. [Artikel 94][ref1] en [139 tot en met 144 van de Gemeentewet][ref2] en de [artikelen 21][ref3] en
      [23, eerste en tweede lid][ref4] van deze wet zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel23
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '94'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '139'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '21'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Het algemeen bestuur gaat niet over tot het instellen van een commissie als bedoeld in het eerste lid dan na
      verkregen toestemming van de raden van elk der deelnemende gemeenten. De toestemming kan slechts worden onthouden
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: '25.3'
    text: |-
      Het algemeen bestuur kan aan een commissie als bedoeld in het eerste lid bevoegdheden van het algemeen bestuur en
      van het dagelijks bestuur van het openbaar lichaam overdragen, met uitzondering van de bevoegdheid tot:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: 25.3.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 34][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel34
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '34'
        hoofdstuk: I
        paragraaf: '3'
  - number: 25.3.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 30, eerste lid, sub a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel30
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '30'
        hoofdstuk: I
        paragraaf: '3'
  - number: 25.3.c
    text: het vaststellen van verordeningen door strafbepaling of politiedwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: '25.4'
    text: Bevoegdheden van het dagelijks bestuur kunnen niet dan op voorstel van het dagelijks bestuur worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: '25.5'
    text: |-
      Ten aanzien van een commissie als bedoeld in het eerste lid regelt het algemeen bestuur tevens voor zover zulks in
      verband met aard en omvang van de overgedragen bevoegdheden nodig is:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: 25.5.a
    text: de werkwijze van de commissie;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: 25.5.b
    text: de openbaarheid van vergaderingen;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: 25.5.c
    text: de voorbereiding, de uitvoering en de openbaarmaking van besluiten van de commissie;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: 25.5.d
    text: |-
      het toezicht van het algemeen, respectievelijk het dagelijks bestuur op de uitoefening van bevoegdheden van die
      commissie;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: 25.5.e
    text: de verhouding van de overgedragen bevoegdheden tot die van het algemeen en het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: 25.5.f
    text: de verantwoording aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: '25.6'
    text: |-
      Ten aanzien van de vergadering van een commissie waaraan bevoegdheden van het algemeen bestuur zijn overgedragen
      is [artikel 22, derde, vierde en vijfde lid][ref1] van overeenkomstige toepassing, met inachtneming van door het
      algemeen bestuur vastgestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel22
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '22'
        hoofdstuk: I
        paragraaf: '2'
  - number: '25.7'
    text: |-
      Indien de commissie zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot het
      algemeen bestuur heeft gericht, wordt de geheimhouding in acht genomen totdat het algemeen bestuur haar opheft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel25
  - number: '26.1'
    text: |-
      Het gemeentebestuur dat daartoe bij de regeling is aangewezen zendt de regeling aan gedeputeerde staten van zijn
      provincie. Indien aan de regeling ook gemeenten deelnemen die in andere provincies zijn gelegen, wordt deze tevens
      toegezonden aan gedeputeerde staten van die provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel26
  - number: '26.2'
    text: |-
      De besturen van de deelnemende gemeenten dragen op de gebruikelijke wijze zorg voor de bekendmaking van de
      regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel26
  - number: '26.3'
    text: |-
      Het bepaalde in het eerste, tweede en derde lid is mede van toepassing op besluiten tot wijziging, verlenging of
      opheffing van de regeling, alsmede op besluiten tot toetreding en uittreding.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel26
  - number: '26.4'
    text: |-
      Het bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt een besluit tot
      verandering in de overgedragen bevoegdheden, dat tot stand is gekomen met toepassing van
      [artikel 10, tweede lid, tweede volzin][ref1], aan gedeputeerde staten. Indien aan de regeling ook gemeenten
      deelnemen die in andere provincies zijn gelegen, wordt dit besluit tevens toegezonden aan gedeputeerde staten van
      die provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
  - number: '27.1'
    text: Burgemeester en wethouders houden een register bij van de regelingen waaraan hun gemeente deelneemt.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: '27.2'
    text: 'In de registers worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: 27.2.a
    text: de deelnemers
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: 27.2.b
    text: de wettelijke voorschriften waardoor de bevoegdheden van het samenwerkingsverband worden beheerst
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: 27.2.c
    text: |-
      de bevoegdheden die bij de regeling dan wel, met toepassing van [artikel 10, tweede lid tweede volzin][ref1],
      krachtens de regeling zijn overgedragen


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
  - number: 27.2.d
    text: het adres en de plaats van vestiging
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: 27.2.e
    text: of een openbaar lichaam of een gemeenschappelijk orgaan is ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: '27.3'
    text: |-
      De registers liggen voor een ieder kosteloos ter inzage. Aan een ieder worden op diens verzoek afschriften van of
      uittreksels uit hetgeen in de registers is ingeschreven ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: '27.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de inrichting van de
      registers.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel27
  - number: '28.1'
    text: |-
      Geschillen omtrent de toepassing, in de ruimste zin, van een regeling tussen besturen van deelnemende
      gemeenten of tussen besturen van een of meer gemeenten en het bestuur van het openbaar lichaam of het
      gemeenschappelijk orgaan worden door gedeputeerde staten beslist, voor zover zij niet behoren tot die,
      vermeld in [artikel 112, eerste lid van de Grondwet][ref1] of tot die, waarvan de beslissing krachtens
      [artikel 112, tweede lid van de Grondwet][ref2] is opgedragen hetzij aan de rechterlijke macht, hetzij aan
      gerechten die niet tot de rechterlijke macht behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel112
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '112'
  - number: '28.2'
    text: |-
      Gedeputeerde staten kunnen bij de beslissing van het geschil het desbetreffende bestuur opdragen een besluit te
      nemen met inachtneming van het in hun beslissing bepaalde en binnen een daartoe te stellen termijn. Indien binnen
      de gestelde termijn het besluit niet is genomen, geschiedt dit door gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel28
  - number: '28.3'
    text: |-
      In spoedeisende gevallen kunnen gedeputeerde staten bij de beslissing van het geschil in de plaats van het
      desbetreffende bestuur een besluit als bedoeld in het tweede lid nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel28
  - number: '29'
    text: |-
      Indien de deelnemende gemeenten in meer dan één provincie zijn gelegen, worden de bevoegdheden van gedeputeerde
      staten met betrekking tot het openbaar lichaam of het gemeenschappelijk orgaan uitgeoefend door gedeputeerde
      staten van de provincie, waarin de plaats van vestiging is gelegen. Gedeputeerde staten plegen hierbij overleg
      met gedeputeerde staten van elke andere provincie waarin deelnemende gemeenten zijn gelegen. Besluiten die aan
      gedeputeerde staten dienen te worden meegedeeld, worden tevens meegedeeld aan gedeputeerde staten van elke andere
      betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel29
  - number: '30.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien
      van de belangen ter behartiging waarvan zij wordt getroffen, en voor het gebied waarvoor zij geldt, zodanige
      bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de aan de regeling deelnemende
      gemeenten toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel30
  - number: 30.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen
      te heffen dan de belasting, bedoeld in [artikel 228 van de Gemeentewet][ref1], de rechten bedoeld in
      [artikel 229 van de Gemeentewet][ref2], de rechten waarvan de heffing krachtens andere wetten dan de
      [Gemeentewet][ref3] geschiedt en de belasting, bedoeld in [artikel 15.33 van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel228
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref3]: https://wetten.overheid.nl/BWBR0005416
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '228'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '229'
      - id: ref3
        bwb_id: BWBR0005416
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 30.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel30
  - number: '30.2'
    text: |-
      Indien toepassing wordt gegeven aan het bepaalde in het eerste lid wordt daarbij tevens de verhouding van de
      overgedragen bevoegdheden tot die van de besturen van de deelnemende gemeenten geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel30
  - number: '30.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemende gemeente, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat de
      verordening der gemeente voor het gehele gebied dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt
      te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel30
  - number: '31'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam van rechtswege
      bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel31
  - number: '32'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
  - number: '33.1'
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het openbaar lichaam of die van het gemeenschappelijk orgaan
      zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn gesteld voor
      de verdeling van de bevoegdheden van de gemeentebesturen over de gemeentelijke bestuursorganen, voor de uitoefening
      van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of krachtens deze wet
      is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel33
  - number: '33.2'
    text: |-
      De besturen van de deelnemende gemeenten kunnen bij de regeling beperkingen aanbrengen in de bevoegdheden die door
      het bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen worden ontleend
      aan de regelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel33
  - number: '33.3'
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste lid, onevenredig belastend zou zijn in verhouding tot het met die regels beoogde doel
      kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel33
  - number: '34.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de begroting vast in het jaar
      voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel34
  - number: '34.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de begroting binnen twee weken
      na de vaststelling, doch in ieder geval vóór 15 juli van het jaar voorafgaande aan dat waarvoor de begroting dient,
      aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel34
  - number: '34.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel34
  - number: '34.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen twee
      weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de jaarrekening
      betrekking heeft, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam of het gemeenschappelijk orgaan zendt de ontwerp-begroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel35
  - number: '35.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de besturen van de deelnemende gemeenten voor
      een ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
      [Artikel 190, tweede en derde lid, van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
  - number: '35.3'
    text: |-
      De raden van de deelnemende gemeenten kunnen bij het dagelijks bestuur van het openbaar lichaam onderscheidenlijk
      het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur
      voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur
      wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel35
  - number: '35.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van de deelnemende gemeenten, die ter zake bij
      gedeputeerde staten hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel35
  - number: '35.5'
    text: |-
      Het bepaalde in het eerste, derde en vierde lid is mede van toepassing op besluiten tot wijziging van de begroting.
      In de gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen
      hiervan kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel35
  - number: '40.1'
    text: |-
      Provinciale staten, gedeputeerde staten en de commissarissen van de Koning van twee of meer provincies kunnen
      afzonderlijk of te zamen, ieder voor zover zij voor de eigen provincie bevoegd zijn, een gemeenschappelijke
      regeling treffen ter behartiging van een of meer bepaalde belangen van die provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel40
  - number: '40.2'
    text: |-
      De colleges van gedeputeerde staten en de commissarissen van de Koning gaan niet over tot het treffen van een
      regeling dan na verkregen toestemming van provinciale staten. De toestemming kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel40
  - number: '40.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2006-01-01#Artikel40
  - number: '41.1'
    text: |-
