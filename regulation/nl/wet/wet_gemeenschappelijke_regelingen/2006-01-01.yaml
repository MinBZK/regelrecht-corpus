        artikel: 50h
        hoofdstuk: III
        paragraaf: '4'
  - number: 50k.1
    text: |-
      Op wijziging van, alsmede uittreding uit en toetreding tot een regeling als bedoeld in [artikel 50][ref1], zijn de
      [artikelen 50][ref2], [50][ref3] en [50][ref4] van overeenkomstige toepassing.


