        hoofdstuk: VII
      - id: ref5
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: 103c.2
    text: |-
      Bij de aanwijzing, bedoeld in het eerste lid, stelt Onze Minister wie het aangaat een termijn binnen welke een
      regeling ter kennisneming aan hem dient te worden gezonden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103c
  - number: 103c.3
    text: |-
      Bij toepassing van het eerste lid pleegt Onze Minister wie het aangaat tevens overleg met de besturen van de
      betrokken waterschappen, andere openbare lichamen en rechtspersonen. Bij toepassing van het tweede lid worden deze
      besturen tevens gehoord.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103c
  - number: 103d
    text: |-
      Voor de toepassing van de [artikelen 103][ref1] en [103][ref2] wordt onder oplegging van een regeling begrepen de
      oplegging van een toetreding tot en een uittreding uit een bestaande regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel103b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel103c
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103d
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 103b
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 103c
        hoofdstuk: X
  - number: 103e
    text: |-
      Voor zover in dit hoofdstuk niet anders is bepaald, is bij de oplegging van een regeling [hoofdstuk I][ref1], dan
      wel [IV][ref2], [V][ref3], [VI][ref4] of [VIII][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVI
      [ref5]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103e
    references:
