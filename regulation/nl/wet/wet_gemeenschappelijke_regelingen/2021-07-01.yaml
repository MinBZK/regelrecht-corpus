  - number: 52.1.k
    text: |-
      bij de toepassing van [artikel 26, eerste en tweede lid][ref1], voor «gemeentebestuur» wordt gelezen
      «provinciebestuur», voor «gemeente» wordt gelezen «provincie», voor «gemeenten» wordt gelezen «provincies» en voor
      «gemeenteblad» wordt gelezen «provinciaal blad».


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel26
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel52
