        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0003740
        hoofdstuk: VIII
  - number: 103f
    text: |-
      Bezwaar of beroep tegen een besluit tot oplegging kan geen grond vinden in bezwaar of beroep tegen het
      aanwijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103f
  - number: '124.1'
    text: |-
      De eilandsraden, de bestuurscolleges en de gezaghebbers van twee of meer openbare lichamen Bonaire, Sint Eustatius
      of Saba kunnen afzonderlijk of tezamen, ieder voor zover zij voor het eigen openbaar lichaam bevoegd zijn, een
      gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel124
  - number: '124.2'
    text: |-
      De bestuurscolleges en de gezaghebbers gaan niet over tot het treffen van een regeling dan na verkregen toestemming
      van de eilandsraden. De toestemming kan slechts worden onthouden wegens strijd met het recht of het algemeen
      belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel124
  - number: '124.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel124
  - number: '125.1'
    text: |-
      Bij de regeling kan een openbaar lichaam onder de naam samenwerkingslichaam worden ingesteld. Het
      samenwerkingslichaam is een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel125
  - number: '125.2'
    text: |-
      In daarvoor bijzonder in aanmerking komende gevallen kan bij de regeling, in plaats van een openbaar lichaam, een
      gemeenschappelijk orgaan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel125
  - number: '125.3'
    text: |-
      In een regeling kan worden bepaald dat daarin omschreven bevoegdheden van bestuursorganen of van ambtenaren van
      twee of meer aan de regeling deelnemende openbare lichamen Bonaire, Sint Eustatius of Saba worden uitgeoefend door
      bestuursorganen, onderscheidenlijk door ambtenaren van een van de deelnemende openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel125
  - number: '126'
    text: |-
      De [artikelen 9 tot en met 28][ref1] zijn van overeenkomstige toepassing met uitzondering van de
      [artikelen 20][ref2], [22][ref3], [24][ref4], [25][ref5] en [28][ref6], met dien verstande dat:


