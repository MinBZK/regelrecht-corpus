preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, nieuwe bepalingen vast te stellen met betrekking tot
    gemeenschappelijke regelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De raden, de colleges van burgemeester en wethouders en de burgemeesters van twee of meer gemeenten kunnen
      afzonderlijk of tezamen, ieder voor zover zij voor de eigen gemeente bevoegd zijn, een gemeenschappelijke regeling
      treffen ter behartiging van een of meer bepaalde belangen van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel1
  - number: '1.2'
    text: |-
      De colleges van burgemeester en wethouders en de burgemeesters gaan niet over tot het treffen van een regeling dan
      na verkregen toestemming van de gemeenteraden. De toestemming kan slechts worden onthouden wegens strijd met het
      recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel1
  - number: '1.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel1
  - number: '8.1'
    text: Bij de regeling kan een openbaar lichaam worden ingesteld. Het openbaar lichaam is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      In daarvoor bijzonder in aanmerking komende gevallen kan bij de regeling, in plaats van een openbaar lichaam, een
      gemeenschappelijk orgaan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel8
  - number: '8.3'
    text: |-
      Bij de regeling waaraan uitsluitend colleges van burgemeesters en wethouders deelnemen, kan een
      bedrijfsvoeringsorganisatie worden ingesteld in het geval de regeling uitsluitend wordt getroffen ter behartiging
      van de sturing en beheersing van ondersteunende processen en van uitvoeringstaken van de deelnemers. De
      bedrijfsvoeringsorganisatie is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel8
  - number: '8.4'
    text: |-
      In de regeling kunnen bevoegdheden van de besturen van de deelnemende gemeenten worden gemandateerd aan organen en
      personen werkzaam onder de verantwoordelijkheid van een van de deelnemende gemeenten, tenzij de regeling waarop de
      bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      De voor onbepaalde tijd getroffen regeling houdt bepalingen in omtrent wijziging, opheffing, toetreding en de
      gevolgen van uittreding, met inachtneming van [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: '9.2'
    text: |-
      De regeling waarbij een openbaar lichaam of een bedrijfsvoeringsorganisatie wordt ingesteld houdt bepalingen in
      omtrent de vereffening van het vermogen ingeval dat openbaar lichaam wordt ontbonden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel9
  - number: '9.3'
    text: |-
      Het bij een regeling ingestelde openbaar lichaam of een bedrijfsvoeringsorganisatie blijft na zijn ontbinding
      voortbestaan voor zover dit tot vereffening van zijn vermogen nodig is.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel9
  - number: '10.1'
    text: De regeling vermeldt het belang of de belangen ter behartiging waarvan zij is getroffen of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      Een regeling, waarbij gebruik wordt gemaakt van de bevoegdheid, bedoeld in
      [artikel 8, eerste, tweede of derde lid][ref1], geeft aan welke bevoegdheden de besturen van de deelnemende
      gemeenten aan het bestuur van het openbaar lichaam of de bedrijfsvoeringsorganisatie onderscheidenlijk aan het
      gemeenschappelijk orgaan bij het aangaan van de regeling overdragen. Een regeling als hier bedoeld kan bepalingen
      inhouden omtrent de wijze waarop verandering kan worden gebracht in de overgedragen bevoegdheden, met dien
      verstande dat niet kan worden bepaald dat het bestuur van het openbaar lichaam of de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan kan besluiten tot uitbreiding van de overgedragen bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '10.3'
    text: |-
      Een regeling als bedoeld in het tweede lid houdt bepalingen in omtrent de inrichting en samenstelling van het
      bestuur van het openbaar lichaam onderscheidenlijk de samenstelling van het gemeenschappelijk orgaan en wijst de
      plaats van vestiging aan.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel10
  - number: '10.4'
    text: |-
      Een regeling als bedoeld in [artikel 8, eerste, tweede of derde lid][ref1], kan aangeven dat een
      ombudsman of ombudscommissie van een van de deelnemers aan de gemeenschappelijke regeling als bedoeld in
      [artikel 81p, eerste lid, van de Gemeentewet][ref2] bevoegd is tot de behandeling van verzoekschriften als bedoeld
      in [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref3]. Indien een regeling de hiervoor bedoelde
      bevoegdheid instelt, dan wel deze beëindigt, zendt het bestuur de regeling aan de Nationale ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81p
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 10a.1
    text: |-
      De deelnemers aan een regeling waarbij gebruik is gemaakt van de bevoegdheid, bedoeld in
      [artikel 8, eerste, tweede of derde lid][ref1], verlenen hun medewerking aan de uitvoering van besluiten die
      het bestuur van een openbaar lichaam of een bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan neemt in
      verband met de uitoefening van de aan dat bestuur of orgaan overgedragen bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 10a.2
    text: |-
      Indien een deelnemer naar het oordeel van het bestuur van een openbaar lichaam of van een
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan de in het eerste lid bedoelde medewerking niet of niet
      in voldoende mate verleent, kan dat bestuur of orgaan namens en ten laste van de betrokken deelnemer een besluit
      uitvoeren of doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel10a
  - number: 10a.3
    text: |-
      Alvorens over te gaan tot toepassing van het tweede lid, wordt het bestuur van de betrokken deelnemer in kennis
      gesteld van het daarop gerichte voornemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel10a
  - number: '11'
    text: |-
      In de regeling kan een termijn worden aangegeven gedurende welke een of meer van de deelnemers is of zijn
      vrijgesteld van uit deze regeling voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel11
  - number: '12.1'
    text: Het bestuur van het openbaar lichaam bestaat uit een algemeen bestuur, een dagelijks bestuur en een voorzitter.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel12
  - number: '12.2'
    text: Het algemeen bestuur staat aan het hoofd van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel12
  - number: '12.3'
    text: De voorzitter is tevens voorzitter van het algemeen bestuur en van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel12
  - number: '13.1'
    text: |-
      Het algemeen bestuur van een openbaar lichaam, ingesteld bij een regeling die uitsluitend is getroffen door raden,
      bestaat uit leden die per deelnemende gemeente door de raad uit zijn midden, met uitzondering van de voorzitter,
      worden aangewezen. Indien de regeling mede is getroffen door raden, bestaat het algemeen bestuur uit leden die
      per deelnemende gemeente door de raad uit zijn midden, de voorzitter inbegrepen, en uit de wethouders worden
      aangewezen. Indien de regeling uitsluitend strekt tot behartiging van opleiding en vorming van ambtenaren, kan in
      de regeling worden bepaald, dat ook de gemeentesecretaris als lid van het algemeen bestuur kan worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.2'
    text: |-
      Het lidmaatschap van het algemeen bestuur eindigt van rechtswege, zodra men ophoudt lid of voorzitter te zijn
      van de raad uit wiens midden men is aangewezen dan wel ophoudt wethouder of secretaris van de desbetreffende
      deelnemende gemeente te zijn.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      De regeling bepaalt het aantal leden van het algemeen bestuur, dat door de raad van elke deelnemende gemeente wordt
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.4'
    text: 'De regeling kan inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.4.a
    text: de aantallen leden, die door de raden van de deelnemende gemeenten worden aangewezen, onderling verschillen;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.4.b
    text: leden, aangewezen door de raden van bepaalde deelnemende gemeenten, meervoudig stemrecht hebben.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.4.c
    text: het algemeen bestuur bij gekwalificeerde meerderheid besluit ten aanzien van in de regeling aangeduide besluiten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.5'
    text: 'De regeling kan tevens inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.5.a
    text: de raden van niet alle, doch ten minste twee deelnemende gemeenten leden van het algemeen bestuur aanwijzen;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.5.b
    text: de raden van twee of meer deelnemende gemeenten gezamenlijk leden van het algemeen bestuur aanwijzen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.6'
    text: |-
      Het algemeen bestuur van een openbaar lichaam, ingesteld bij een regeling die uitsluitend is getroffen door
      colleges van burgemeester en wethouders, bestaat uit leden die per deelnemende gemeente door het college uit zijn
      midden worden aangewezen. Het tweede tot en met het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.7'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door burgemeesters, vormen zij het algemeen bestuur. De regeling kan
      inhouden, dat burgemeesters van bepaalde gemeenten meervoudig stemrecht hebben.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.8'
    text: 'De regeling, bedoeld in het zevende lid, kan tevens inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.8.a
    text: niet alle deelnemende burgemeesters zitting hebben in het algemeen bestuur;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.8.b
    text: |-
      twee of meer deelnemende burgemeesters gezamenlijk uit hun midden een of meer leden van het algemeen bestuur
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.9'
    text: |-
      De voorzitter van het openbaar lichaam wordt door en uit het algemeen bestuur aangewezen, met inachtneming van het
      daaromtrent in de regeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '13.10'
    text: |-
      Het algemeen bestuur van een openbaar lichaam, ingesteld bij een regeling die uitsluitend is getroffen door
      colleges van burgemeester en wethouders en burgemeesters gezamenlijk, bestaat uit:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.10.a
    text: |-
      leden die per deelnemende gemeente door het college uit zijn midden worden aangewezen, waarbij het tweede tot en
      met het vijfde lid van overeenkomstige toepassing is, en
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: 13.10.b
    text: |-
      de burgemeesters van de deelnemende gemeenten, waarbij het zevende lid, tweede volzin, en achtste lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel13
  - number: '14.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam bestaat uit de voorzitter en twee of meer andere leden, door en
      uit het algemeen bestuur aan te wijzen, met inachtneming van het daaromtrent in de regeling bepaalde. De aldus
      aangewezen leden van het dagelijks bestuur mogen niet allen afkomstig zijn uit dezelfde gemeente.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Wanneer de aard van de regeling daartoe aanleiding geeft, kunnen één of meer leden van het dagelijks bestuur, niet
      zijnde de voorzitter, worden aangewezen van buiten de kring van het algemeen bestuur, met dien verstande dat op
      deze wijze aangewezen leden nimmer de meerderheid van het dagelijks bestuur mogen uitmaken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel14
  - number: '14.3'
    text: |-
      De leden van het dagelijks bestuur mogen nimmer de meerderheid van het algemeen bestuur uitmaken, tenzij sprake is
      van een regeling als bedoeld in [artikel 13, zevende lid][ref1], met minder dan zes deelnemende gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: 14a
    text: |-
      Het bestuur van een bedrijfsvoeringsorganisatie bestaat uit leden die per deelnemende gemeente door het college
      uit zijn midden worden aangewezen. [Artikel 13, tweede tot en met het vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '15'
    text: |-
      Op de samenstelling van het gemeenschappelijk orgaan, bedoeld in [artikel 8, tweede lid][ref1], is
      [artikel 13][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '16.1'
    text: |-
      De regeling houdt bepalingen in omtrent de wijze waarop een lid van het algemeen bestuur van het openbaar lichaam
      of een lid van het gemeenschappelijk orgaan door de raad die dit lid heeft aangewezen, ter verantwoording kan
      worden geroepen voor het door hem in dat bestuur onderscheidenlijk dat orgaan gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel16
  - number: '16.2'
    text: |-
      De regeling houdt bepalingen in omtrent de wijze waarop een lid van het algemeen bestuur van het openbaar lichaam
      of een lid van het gemeenschappelijk orgaan aan de raad die dit lid heeft aangewezen, de door een of meer leden van
      die raad gevraagde inlichtingen dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel16
  - number: '16.3'
    text: |-
      Ingeval toepassing is gegeven aan [artikel 13, vijfde lid, onder a][ref1], houdt de regeling bepalingen in
      omtrent de wijze waarop aan de raad die geen lid van het algemeen bestuur van het openbaar lichaam of van het
      gemeenschappelijk orgaan aanwijst, de door een of meer leden van die raad gevraagde inlichtingen worden verstrekt
      en de door die raad gevraagde verantwoording wordt afgelegd voor het door dat bestuur onderscheidenlijk dat orgaan
      gevoerde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '16.4'
    text: |-
      De regeling houdt bepalingen in omtrent de bevoegdheid van de raad, een door hem aangewezen lid van het algemeen
      bestuur van het openbaar lichaam of een door hem aangewezen lid van het gemeenschappelijk orgaan, ontslag te
      verlenen, indien dit lid het vertrouwen van de raad niet meer bezit.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel16
  - number: '16.5'
    text: |-
      Bij het verstrekken van inlichtingen ingevolge het tweede of het derde lid, of het afleggen van verantwoording
      ingevolge het eerste of het derde lid, verschaft een lid van het algemeen bestuur van het openbaar lichaam of
      een lid van het gemeenschappelijk orgaan over zaken waaromtrent krachtens [artikel 23][ref1] geheimhouding is
      opgelegd slechts informatie, indien krachtens [artikel 25 van de Gemeentewet][ref2] geheimhouding is opgelegd.
      Laatstbedoelde geheimhouding kan eerst worden opgeheven, nadat door het algemeen bestuur van het openbaar lichaam
      of door het gemeenschappelijk orgaan tot opheffing van de geheimhouding is besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '25'
  - number: '17'
    text: |-
      De regeling houdt bepalingen in omtrent de wijze waarop door het bestuur van het openbaar lichaam of de
      bedrijfsvoeringsorganisatie of door het gemeenschappelijk orgaan aan de raden van de deelnemende gemeenten de door
      een of meer leden van die raden gevraagde inlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel17
  - number: '18'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing op regelingen die uitsluitend getroffen zijn door
      colleges van burgemeester en wethouders alsmede op regelingen die uitsluitend getroffen zijn door colleges
      van burgemeester en wethouders en burgemeesters gezamenlijk, voor zover het betreft de leden, bedoeld
      in [artikel 13, tiende lid, onder a][ref2], met dien verstande dat voor «het algemeen bestuur van het
      openbaar lichaam» telkens wordt gelezen «het algemeen bestuur van het openbaar lichaam of het bestuur van de
      bedrijfsvoeringsorganisatie».


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '13'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '19.1'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door colleges van burgemeester en wethouders is
      [artikel 16, eerste, tweede, derde en vijfde lid][ref1], van overeenkomstige toepassing ten aanzien van de
      gemeenteraden respectievelijk een of meer leden van die raden, met dien verstande dat voor «het algemeen bestuur
      van het openbaar lichaam» telkens wordt gelezen «het algemeen bestuur van het openbaar lichaam of het bestuur van
      de bedrijfsvoeringsorganisatie».


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '19.2'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door burgemeesters is [artikel 16, eerste, tweede en vijfde lid][ref1]
      van overeenkomstige toepassing ten aanzien van gemeenteraden respectievelijk een of meer leden van die raden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '19.3'
    text: |-
      Ingeval de regeling uitsluitend is getroffen door colleges van burgemeester en wethouders en burgemeesters
      gezamenlijk, is [artikel 16, eerste, tweede, derde en vijfde lid][ref1], van overeenkomstige toepassing ten
      aanzien van raden respectievelijk een of meer leden van de raden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: 19a.1
    text: |-
      Het dagelijks bestuur en elk van zijn leden afzonderlijk zijn aan het algemeen bestuur verantwoording schuldig over
      het door het dagelijks bestuur gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19a
  - number: 19a.2
    text: |-
      Het dagelijks bestuur geeft het algemeen bestuur alle inlichtingen die het algemeen bestuur voor de uitoefening van
      zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19a
  - number: 19a.3
    text: |-
      Het algemeen bestuur kan besluiten een lid van het dagelijks bestuur ontslag te verlenen,
      indien dit lid het vertrouwen van het algemeen bestuur niet meer bezit. Op het ontslagbesluit is
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van toepassing. De rechter treedt niet in de
      beoordeling van de gronden waarop het algemeen bestuur tot ontslag van een lid van het dagelijks bestuur heeft
      besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 19b.1
    text: |-
      Over al hetgeen het openbaar lichaam, de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk
      orgaan betreft dient het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het
      provinciebestuur desgevraagd van bericht en raad.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19b
  - number: 19b.2
    text: |-
      Het dagelijks bestuur, het bestuur onderscheidenlijk het gemeenschappelijk orgaan doet mededeling van het verzoek
      en de inhoud daarvan aan de deelnemers.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel19b
  - number: '20.1'
    text: 'Een lid van het bestuur van het openbaar lichaam of de bedrijfsvoeringsorganisatie mag:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.a
    text: |-
      niet als advocaat, gemachtigde of adviseur werkzaam zijn ten behoeve van de wederpartij van het openbaar
      lichaam of de bedrijfsvoeringsorganisatie of ten behoeve van het bestuur van het openbaar lichaam of de
      bedrijfsvoeringsorganisatie in geschillen;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.b
    text: |-
      niet als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met het openbaar lichaam of de
      bedrijfsvoeringsorganisatie aangaan van:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.b.1e
    text: overeenkomsten als bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.b.2e
    text: overeenkomsten tot het leveren van onroerende zaken aan het openbaar lichaam of de bedrijfsvoeringsorganisatie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c
    text: 'rechtstreeks noch middellijk een overeenkomst aangaan betreffende:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c.1e
    text: het aannemen van werk ten behoeve van het openbaar lichaam of de bedrijfsvoeringsorganisatie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c.2e
    text: |-
      het buiten dienstbetrekking tegen beloning doen van verrichtingen ten behoeve van het openbaar lichaam of de
      bedrijfsvoeringsorganisatie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c.3e
    text: het leveren van roerende zaken anders dan om niet aan het openbaar lichaam of de bedrijfsvoeringsorganisatie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c.4e
    text: |-
      het verhuren aan het openbaar lichaam of de bedrijfsvoeringsorganisatie van enig goed, met uitzondering van
      onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c.5e
    text: het verwerven van betwiste vorderingen ten laste van het openbaar lichaam of de bedrijfsvoeringsorganisatie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c.6e
    text: |-
      het van het openbaar lichaam of de bedrijfsvoeringsorganisatie ondershands verwerven van onroerende zaken of
      beperkte rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: 20.1.c.7e
    text: het ondershands huren of pachten van het openbaar lichaam of de bedrijfsvoeringsorganisatie.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: '20.2'
    text: Van het eerste lid onder *c* kunnen gedeputeerde staten ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      Ten aanzien van een lid van het gemeenschappelijk orgaan is het eerste lid onder *a* van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      Wanneer is gehandeld in strijd met het eerste lid, is
      [artikel X 8, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_8
  - number: '21.1'
    text: |-
      De leden van het bestuur van een openbaar lichaam of een bedrijfsvoeringsorganisatie of van het gemeenschappelijk
      orgaan kunnen een tegemoetkoming in de kosten en, voor zover zij niet de functie van wethouder, burgemeester of
      secretaris vervullen, een vergoeding voor hun werkzaamheden ontvangen. Deze tegemoetkoming en vergoeding worden
      bij de regeling, of krachtens de regeling door het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan, vastgesteld. Bij of krachtens algemene maatregel van
      bestuur kunnen hieromtrent nadere regels worden gesteld. De hoogte van de vergoeding staat in redelijke verhouding
      tot de aan het lidmaatschap verbonden werkzaamheden, mede rekening houdende met de vergoeding voor werkzaamheden
      welke het bestuurslid ontvangt uit hoofde van zijn lidmaatschap van de raad.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde leden kan voorts bij de regeling, of krachtens de regeling
      door het algemeen bestuur van een openbaar lichaam, het bestuur van een bedrijfsvoeringsorganisatie, of het
      gemeenschappelijk orgaan, een tegemoetkoming in of vergoeding van bijzondere kosten en andere financiële
      voorzieningen worden vastgesteld die verband houden met de vervulling van het lidmaatschap van het bestuur van een
      openbaar lichaam of een bedrijfsvoeringsorganisatie of van het gemeenschappelijk orgaan. Bij of krachtens algemene
      maatregel van bestuur kunnen hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel21
  - number: '21.3'
    text: |-
      Een besluit van het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie, of
      van het gemeenschappelijk orgaan als bedoeld in het eerste en tweede lid wordt aan gedeputeerde staten gezonden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel21
  - number: '21.4'
    text: |-
      [Artikel 99 van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '99'
  - number: '22.1'
    text: |-
      De [artikelen 16][ref1], [17][ref2], [19][ref3], [20][ref4], [22][ref5], [26][ref6] en
      [28 tot en met 33 van de Gemeentewet][ref7] zijn, voor zover daarvan bij deze wet niet is afgeweken, op het houden
      en de orde van de vergaderingen van het algemeen bestuur van het openbaar lichaam van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0005416#Artikel28
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '22'
      - id: ref6
        bwb_id: BWBR0005416
        artikel: '26'
      - id: ref7
        bwb_id: BWBR0005416
        artikel: '28'
  - number: '22.2'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie en het
      gemeenschappelijk orgaan vergaderen jaarlijks tenminste tweemaal.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel22
  - number: '22.3'
    text: De vergaderingen van het algemeen bestuur zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel22
  - number: '22.4'
    text: |-
      De deuren worden gesloten wanneer een vijfde gedeelte der aanwezige leden daarom verzoekt of de voorzitter het
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel22
  - number: '22.5'
    text: Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel22
  - number: '23.1'
    text: |-
      Het algemeen bestuur kan in een besloten vergadering, op grond van de belangen, genoemd in
      [artikel 10 van de Wet openbaarheid van bestuur][ref1], omtrent het in die vergadering met gesloten deuren
      behandelde en omtrent de inhoud van de stukken welke aan het algemeen bestuur worden overgelegd, geheimhouding
      opleggen. Deze wordt door hen die bij de behandeling aanwezig waren en allen die van het behandelde of de stukken
      kennisdragen, in acht genomen, totdat het algemeen bestuur haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '23.2'
    text: |-
      Op grond van de belangen genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1] kan de geheimhouding
      eveneens worden opgelegd door het dagelijks bestuur en de voorzitter van het openbaar lichaam en door een commissie
      als bedoeld in [artikel 24][ref2] of [25][ref3], ieder ten aanzien van stukken die zij aan het algemeen bestuur of
      aan de leden van het algemeen bestuur overleggen. Daarvan wordt op de stukken melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '24'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '25'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '2'
  - number: '23.3'
    text: |-
      De krachtens het tweede lid aan het algemeen bestuur opgelegde verplichting tot geheimhouding vervalt, indien de
      oplegging niet door het algemeen bestuur in zijn eerstvolgende vergadering, die blijkens de presentielijst door
      meer dan de helft van het aantal zitting hebbende leden, tezamen vertegenwoordigend meer dan de helft van het
      aantal stemmen, is bezocht, wordt bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel23
  - number: '23.4'
    text: |-
      De krachtens het tweede lid aan leden van het algemeen bestuur opgelegde verplichting tot geheimhouding wordt
      door hen in acht genomen totdat het orgaan, dat de verplichting heeft opgelegd, dan wel, indien het onderwerp
      waaromtrent geheimhouding is opgelegd aan het algemeen bestuur is voorgelegd, totdat het algemeen bestuur haar
      opheft. Het algemeen bestuur kan deze beslissing alleen nemen in een vergadering die blijkens de presentielijst
      door meer dan de helft van het aantal zitting hebbende leden, tezamen vertegenwoordigend meer dan de helft van het
      aantal stemmen, is bezocht.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel23
  - number: '23.5'
    text: |-
      [ Artikel 22][ref1] en het eerste lid van dit artikel zijn eveneens van toepassing op het gemeenschappelijk
      orgaan, indien de regeling is getroffen of mede is getroffen door gemeenteraden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel22
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '22'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '24.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam kan commissies van advies instellen. Het regelt de bevoegdheden en de
      samenstelling. [Artikel 22 van de Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel22
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '22'
  - number: '24.2'
    text: |-
      De instelling van vaste commissies van advies aan het dagelijks bestuur of aan de voorzitter en de regeling van
      haar bevoegdheden en samenstelling geschieden door het algemeen bestuur op voorstel van het dagelijks bestuur
      onderscheidenlijk van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel24
  - number: '24.3'
    text: |-
      Andere commissies van advies aan het dagelijks bestuur of aan de voorzitter worden door het dagelijks bestuur
      onderscheidenlijk de voorzitter ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel24
  - number: '24.4'
    text: |-
      De leden van commissies van advies die geen burgemeester, wethouder of lid van een gemeenteraad
      zijn kunnen een vergoeding voor het bijwonen van vergaderingen van de commissie ontvangen. De
      [artikelen 96 tot en met 99 van de Gemeentewet][ref1], alsmede de op grond daarvan gestelde nadere regelen, zijn
      alsdan van overeenkomstige toepassing, met dien verstande dat, wanneer daarin sprake is van een onderverdeling in
      gemeenteklassen, het bepaalde voor de gemeenteklasse van 50 001-100 000 inwoners van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel96
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '96'
  - number: '25.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam kan commissies instellen met het oog op de behartiging van bepaalde
      belangen indien de regeling in deze mogelijkheid voorziet. Het algemeen bestuur regelt de bevoegdheden en de
      samenstelling. [Artikel 22 van de Gemeentewet][ref1], de [artikelen 21][ref2], [23, eerste en tweede lid][ref3],
      van deze wet en [artikel 19 van de Bekendmakingswet][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel19
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '21'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004287
        artikel: '19'
  - number: '25.2'
    text: |-
      Het algemeen bestuur gaat niet over tot het instellen van een commissie als bedoeld in het eerste lid dan nadat de
      raden van de deelnemende gemeenten van dit voornemen op de hoogte zijn gesteld en in de gelegenheid zijn gesteld
      hun wensen en bedenkingen ter kennis van het algemeen bestuur te brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: '25.3'
    text: |-
      Het algemeen bestuur kan aan een commissie als bedoeld in het eerste lid bevoegdheden van het algemeen bestuur en
      van het dagelijks bestuur van het openbaar lichaam overdragen, tenzij de aard van de bevoegdheid zich daartegen
      verzet. Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: 25.3.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 34][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel34
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '34'
        hoofdstuk: I
        paragraaf: '7'
        afdeling: '3'
  - number: 25.3.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 30, eerste lid, sub a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel30
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '3'
  - number: 25.3.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: '25.4'
    text: Bevoegdheden van het dagelijks bestuur kunnen niet dan op voorstel van het dagelijks bestuur worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: '25.5'
    text: |-
      Ten aanzien van een commissie als bedoeld in het eerste lid regelt het algemeen bestuur tevens voor zover zulks in
      verband met aard en omvang van de overgedragen bevoegdheden nodig is:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: 25.5.a
    text: de werkwijze van de commissie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: 25.5.b
    text: de openbaarheid van vergaderingen;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: 25.5.c
    text: de voorbereiding, de uitvoering en de openbaarmaking van besluiten van de commissie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: 25.5.d
    text: |-
      het toezicht van het algemeen, respectievelijk het dagelijks bestuur op de uitoefening van bevoegdheden van die
      commissie;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: 25.5.e
    text: de verhouding van de overgedragen bevoegdheden tot die van het algemeen en het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: 25.5.f
    text: de verantwoording aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: '25.6'
    text: |-
      Ten aanzien van de vergadering van een commissie waaraan bevoegdheden van het algemeen bestuur zijn overgedragen
      is [artikel 22, derde, vierde en vijfde lid][ref1] van overeenkomstige toepassing, met inachtneming van door het
      algemeen bestuur vastgestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel22
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '22'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '25.7'
    text: |-
      Indien de commissie zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot het
      algemeen bestuur heeft gericht, wordt de geheimhouding in acht genomen totdat het algemeen bestuur haar opheft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
  - number: '25.8'
    text: |-
      Het algemeen bestuur kan besluiten en andere, niet-schriftelijke beslissingen gericht op enig rechtsgevolg van
      een door hem ingestelde commissie vernietigen. Het algemeen bestuur kan zijn bevoegdheid tot schorsing overdragen
      aan het dagelijks bestuur. Ten aanzien van de vernietiging van niet-schriftelijke beslissingen gericht op
      enig rechtsgevolg zijn de [afdelingen 10.2.2.][ref1] en [10.2.3. van de Algemene wet bestuursrecht][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '26.1'
    text: |-
      Het gemeentebestuur dat daartoe bij de regeling is aangewezen onderscheidenlijk het bestuur van de gemeente van
      de plaats van vestiging maakt de regeling in alle deelnemende gemeenten bekend in het door dat gemeentebestuur
      uitgegeven gemeenteblad.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel26
  - number: '26.2'
    text: |-
      Het openbaar lichaam, de bedrijfsvoeringsorganisatie, het gemeenschappelijk orgaan of het gemeentebestuur, bedoeld
      in [artikel 8, vierde lid][ref1], of bij gebreke hiervan, het gemeentebestuur, bedoeld in het eerste lid, voegt in
      het register, bedoeld in [artikel 136, eerste lid][ref2], de gegevens toe, bedoeld in artikel 136, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel136
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '136'
        hoofdstuk: XII
  - number: '26.3'
    text: |-
      De regeling treedt in werking op de in de regeling aangewezen dag. De regeling treedt niet in werking voordat zij
      is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel26
  - number: '26.4'
    text: |-
      Het eerste, tweede en derde lid zijn van toepassing op besluiten tot wijziging, verlenging of opheffing van de
      regeling, alsmede op besluiten tot toetreding en uittreding.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel26
  - number: '28.1'
    text: |-
      Geschillen omtrent de toepassing, in de ruimste zin, van een regeling tussen besturen van deelnemende
      gemeenten of tussen besturen van een of meer gemeenten en het bestuur van het openbaar lichaam of van de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan worden door gedeputeerde staten beslist, voor zover zij
      niet behoren tot die, vermeld in [artikel 112, eerste lid van de Grondwet][ref1] of tot die, waarvan de beslissing
      krachtens [artikel 112, tweede lid van de Grondwet][ref2] is opgedragen hetzij aan de rechterlijke macht, hetzij
      aan gerechten die niet tot de rechterlijke macht behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel112
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '112'
  - number: '28.2'
    text: |-
      Gedeputeerde staten kunnen bij de beslissing van het geschil het desbetreffende bestuur opdragen een besluit te
      nemen met inachtneming van het in hun beslissing bepaalde en binnen een daartoe te stellen termijn. Indien binnen
      de gestelde termijn het besluit niet is genomen, geschiedt dit door gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel28
  - number: '28.3'
    text: |-
      In spoedeisende gevallen kunnen gedeputeerde staten bij de beslissing van het geschil in de plaats van het
      desbetreffende bestuur een besluit als bedoeld in het tweede lid nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel28
  - number: '29'
    text: |-
      Indien de deelnemende gemeenten in meer dan één provincie zijn gelegen, worden de bevoegdheden van gedeputeerde
      staten met betrekking tot het openbaar lichaam, de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan
      uitgeoefend door gedeputeerde staten van de provincie, waarin de plaats van vestiging is gelegen. Gedeputeerde
      staten plegen hierbij overleg met gedeputeerde staten van elke andere provincie waarin deelnemende gemeenten
      zijn gelegen. Besluiten die aan gedeputeerde staten dienen te worden meegedeeld, worden tevens meegedeeld aan
      gedeputeerde staten van elke andere betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel29
  - number: '30.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of aan het gemeenschappelijk orgaan
      kunnen bij de regeling ten aanzien van de belangen ter behartiging waarvan zij wordt getroffen, en voor het gebied
      waarvoor zij geldt, zodanige bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de
      aan de regeling deelnemende gemeenten toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel30
  - number: 30.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen
      te heffen dan de belasting, bedoeld in [artikel 228 van de Gemeentewet][ref1], de rioolheffing, bedoeld in
      [artikel 228a van de Gemeentewet][ref2], de rechten bedoeld in [artikel 229 van de Gemeentewet][ref3], de
      rechten waarvan de heffing krachtens andere wetten dan de [Gemeentewet][ref4] geschiedt en de heffing, bedoeld in
      [artikel 15.33 van de Wet milieubeheer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel228
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel228a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref4]: https://wetten.overheid.nl/BWBR0005416
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '228'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 228a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '229'
      - id: ref4
        bwb_id: BWBR0005416
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 30.1.b
    text: |-
      aan het gemeenschappelijk orgaan of de bedrijfsvoeringsorganisatie niet de bevoegdheid kan worden overgedragen
      belastingen te heffen of anderszins algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel30
  - number: '30.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende gemeenten geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel30
  - number: '30.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemende gemeente, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat de
      verordening der gemeente voor het gehele gebied dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt
      te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel30
  - number: '31'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam of de
      bedrijfsvoeringsorganisatie van rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel31
  - number: 31a.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie besluit slechts
      tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen, verenigingen, coöperaties
      en onderlinge waarborgmaatschappijen, indien de regeling in deze mogelijkheid voorziet en dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel31a
  - number: 31a.2
    text: |-
      Het besluit wordt niet genomen dan nadat de raden van de deelnemende gemeenten een ontwerpbesluit is toegezonden
      en in de gelegenheid zijn gesteld hun wensen en bedenkingen ter kennis van het algemeen bestuur van het openbaar
      lichaam of het bestuur van de bedrijfsvoeringsorganisatie te brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel31a
  - number: '32'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
  - number: 32a
    text: |-
      Wanneer aan een commissie als bedoeld in [artikel 25][ref1] bevoegdheden van het algemeen bestuur of het dagelijks
      bestuur zijn overgedragen en deze commissie een bij of krachtens een andere dan deze wet gevorderde beslissing niet
      of niet naar behoren neemt, voorziet het algemeen bestuur onderscheidenlijk het dagelijks bestuur daarin.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '25'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '2'
  - number: 32b.1
    text: |-
      Wanneer de besturen van de deelnemende gemeenten aan het bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan bevoegdheden op grond van een andere wet dan de
      [Gemeentewet][ref1] hebben overgedragen, en het orgaan waaraan de bevoegdheid is overgedragen een bij of krachtens
      die wet gevorderde beslissing niet of niet naar behoren neemt dan wel bij of krachtens die wet gevorderde handeling
      niet of niet naar behoren verricht, of anderszins een bij of krachtens die wet gevorderd resultaat niet, niet
      tijdig of niet naar behoren tot stand brengt, besluiten gedeputeerde staten daarin namens het orgaan waaraan de
      bevoegdheid is overgedragen te voorzien ten laste van het openbaar lichaam, de bedrijfsvoeringsorganisatie of de
      deelnemende gemeenten, indien het een gemeenschappelijk orgaan betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: 32b.2
    text: |-
      Spoedeisende gevallen uitgezonderd, voeren gedeputeerde staten het besluit tot indeplaatsstelling niet uit
      dan nadat een in het besluit genoemde termijn is verstreken, waarbinnen het orgaan waaraan de bevoegdheid is
      overgedragen de gelegenheid heeft alsnog te voorzien in hetgeen het besluit vordert. Indien de situatie dermate
      spoedeisend is dat gedeputeerde staten de beslissing om over te gaan tot indeplaatsstelling niet tevoren op schrift
      kunnen stellen, zorgen zij alsnog zo spoedig mogelijk voor de opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32b
  - number: 32b.3
    text: |-
      Indien het besluit tot indeplaatsstelling een bij of krachtens een andere wet dan de [Gemeentewet][ref1] gevorderd
      resultaat betreft dat niet tijdig tot stand zal worden gebracht, geven gedeputeerde staten in het besluit tot
      indeplaatsstelling aan welke beslissingen, handelingen of resultaten moeten zijn uitgevoerd binnen de in het tweede
      lid bedoelde termijn. Gedeputeerde staten kunnen voor verschillende beslissingen, handelingen of resultaten een
      verschillende termijn stellen. Indien het orgaan waaraan de bevoegdheid is overgedragen niet binnen die termijn
      heeft voorzien in hetgeen het besluit van hem vordert, voorzien gedeputeerde staten verder in het tot stand brengen
      van het gevorderde resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: 32b.4
    text: |-
      Van een besluit tot indeplaatsstelling, alsmede van het voornemen tot het nemen van een dergelijk besluit, wordt
      mededeling gedaan in het publicatieblad, bedoeld in [artikel 2, vijfde lid, van de Bekendmakingswet][ref1]. Een
      afschrift van het besluit en van het voornemen wordt gezonden aan het orgaan waaraan de bevoegdheid is overgedragen
      en aan de raden van de deelnemende gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: 32c.1
    text: |-
      In overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, kan Onze Minister die het
      aangaat, indien hij van oordeel is dat toepassing van [artikel 32b, eerste lid][ref1], uit oogpunt van een
      zwaarwegend algemeen belang gewenst is, gedeputeerde staten verzoeken toepassing te geven aan artikel 32b, eerste
      lid. Een afschrift van het verzoek wordt gezonden aan het orgaan waaraan de bevoegdheid is overgedragen, de raden
      van de deelnemende gemeenten en provinciale staten. Indien gedeputeerde staten niet binnen een door Onze Minister
      die het aangaat gestelde termijn toepassing hebben gegeven aan artikel 32b, eerste lid, gaat de bevoegdheid van
      artikel 32b, eerste lid, over op Onze Minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 32c.2
    text: |-
      De [artikelen 32b, tweede tot en met vierde lid][ref1], [32e][ref2], [32f][ref3] en [32h][ref4] zijn van
      overeenkomstige toepassing bij toepassing van artikel 32b, eerste lid, door Onze Minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel32e
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel32f
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel32h
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 32e
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: 32f
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0003740
        artikel: 32h
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 32d.1
    text: |-
      Ter zake van de in de [bijlage bij de Gemeentewet](onbekend) opgenomen wetten worden de bevoegdheden die in de
      [artikelen 32b][ref1], [32e][ref2], [32f][ref3] en [32h][ref4] aan gedeputeerde staten zijn toegekend, in zoverre
      in afwijking van die artikelen uitgeoefend door Onze Minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel32e
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel32f
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel32h
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 32e
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: 32f
        hoofdstuk: I
