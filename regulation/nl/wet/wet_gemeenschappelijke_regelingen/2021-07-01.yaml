        artikel: X_7
  - number: '54.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of aan het gemeenschappelijk orgaan
      kunnen bij de regeling ten aanzien van de belangen ter behartiging waarvan zij is getroffen en voor het gebied
      waarvoor zij geldt, zodanige bevoegdheden van regeling en bestuur worden overgedragen, als aan de besturen van de
      deelnemende gemeenten en provincies met betrekking tot hun eigen gemeente, onderscheidenlijk provincie toekomen,
      met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel54
  - number: 54.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te
      heffen dan de rioolheffing, bedoeld in [artikel 228a van de Gemeentewet][ref1] en de rechten, bedoeld in
      [artikel 229, eerste lid, onder a en b, van de Gemeentewet][ref2] en in [artikel 223 van de Provinciewet][ref3],
      de belasting, bedoeld in [artikel 222c van de Provinciewet][ref4], de rechten waarvan heffing krachtens bijzondere
      wetten geschiedt en de heffing bedoeld in [artikel 15.33 van de Wet milieubeheer][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel228a
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 228a
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '229'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '223'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: 222c
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 54.1.b
    text: |-
      aan het gemeenschappelijk orgaan of de bedrijfsvoeringsorganisatie niet de bevoegdheid kan worden overgedragen
      belastingen te heffen of anderszins algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel54
  - number: '54.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende gemeenten en provincies geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel54
  - number: '54.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende gemeente of provincie, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat
      de verordening van de gemeente of provincie voor het gehele gebied, dan wel voor een gedeelte daarvan geheel of
      gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel54
  - number: '55'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam of de
      bedrijfsvoeringsorganisatie, van rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel55
  - number: 55a.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie besluit slechts
      tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen, verenigingen, coöperaties
      en onderlinge waarborgmaatschappijen, indien de regeling in deze mogelijkheid voorziet en dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel55a
  - number: 55a.2
    text: |-
      Het besluit wordt niet genomen dan nadat de raden van de deelnemende gemeenten en provinciale staten
      van de deelnemende provincies een ontwerpbesluit is toegezonden en in de gelegenheid zijn gesteld hun
      wensen en bedenkingen ter kennis van het algemeen bestuur van het openbaar lichaam of het bestuur van de
      bedrijfsvoeringsorganisatie.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel55a
  - number: '56'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges
      of ambtenaren de bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1] en die bedoeld in
      [hoofdstuk XV van de Provinciewet][ref2], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: 56a.1
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan mede door de besturen van de deelnemende provincies zijn overgedragen, zijn daarop de
      [artikelen 45a][ref1] en [45b][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel45b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 45a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 45b
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '3'
  - number: 56a.2
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten zijn overgedragen, zijn daarop
      de [artikelen 32a tot en met 32j][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: '57'
    text: |-
      De bevoegdheden die bij de regeling worden overgedragen, berusten bij het algemeen bestuur, tenzij bij wet of in de
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57
  - number: 57a.1
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden van het algemeen bestuur overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
  - number: 57a.2
    text: 'Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
  - number: 57a.2.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 58][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel58
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '7'
        afdeling: '3'
  - number: 57a.2.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 54, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel54
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 57a.2.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
  - number: 57a.3
    text: |-
      De [artikelen 56b][ref1] en [56c][ref2] zijn van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel56b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel56c
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 56b
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 56c
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 57a.4
    text: |-
      In afwijking van [artikel 10:16, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het algemeen bestuur
      beperkingen stellen aan de uitoefening van de overgedragen bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 57a.5
    text: |-
      Ten aanzien van de bevoegdheden die met toepassing van het eerste lid zijn overgedragen, zijn de regels die bij of
      krachtens de wet zijn gesteld met betrekking tot de uitoefening daarvan en het toezicht daarop van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57a
  - number: 57b.1
    text: 'Het dagelijks bestuur is in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57b
  - number: 57b.1.a
    text: |-
      het dagelijks bestuur van het openbaar lichaam te voeren, voor zover niet bij of krachtens de wet of de regeling
      het algemeen bestuur hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57b
  - number: 57b.1.b
    text: beslissingen van het algemeen bestuur voor te bereiden en uit te voeren;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57b
  - number: 57b.1.c
    text: regels vast te stellen over de ambtelijke organisatie van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57b
  - number: 57b.1.d
    text: |-
      tot privaatrechtelijke rechtshandelingen van het openbaar lichaam te besluiten, met uitzondering van
      privaatrechtelijke rechtshandelingen als bedoeld in [artikel 55a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel55a
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 55a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 57b.1.e
    text: |-
      te besluiten namens het openbaar lichaam, het dagelijks bestuur of het algemeen bestuur rechtsgedingen,
      bezwaarprocedures of administratief beroepsprocedures te voeren of handelingen ter voorbereiding daarop te
      verrichten, tenzij het algemeen bestuur, voor zover het het algemeen bestuur aangaat, in voorkomende gevallen
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57b
  - number: 57b.2
    text: |-
      Het dagelijks bestuur neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57b
  - number: 57c
    text: |-
      Het dagelijks bestuur kan een of meer leden van het dagelijks bestuur machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57c
  - number: 57d.1
    text: De voorzitter vertegenwoordigt het openbaar lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57d
  - number: 57d.2
    text: De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel57d
  - number: '58.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58
  - number: '58.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de begroting binnen twee weken na de vaststelling, doch in ieder geval vóór 1
      augustus van het jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58
  - number: '58.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de jaarrekening vast in het jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58
  - number: '58.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de jaarrekening binnen twee weken na de vaststelling, doch in ieder geval vóór 15
      juli van het jaar volgende op het jaar waarop de jaarrekening betrekking heeft, aan Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58
  - number: 58a.1
    text: |-
      Indien het openbaar lichaam de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan een specifieke
      uitkering als bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref1] ontvangt van het Rijk
      of middelen ontvangt van de deelnemende provincies en gemeenten, die afkomstig zijn uit een specifieke
      uitkering, zijn de [artikelen 17a][ref2] en [17b van de Financiële-verhoudingswet][ref3] op de informatie ten
      behoeve van de verantwoording over deze middelen, van overeenkomstige toepassing op het openbaar lichaam de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 15a
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0008290
        artikel: 17b
  - number: 58a.1.a
    text: |-
      voor gedeputeerde staten en het college van burgemeester en wethouders wordt gelezen: het dagelijks bestuur van het
      openbaar lichaam het bestuur van de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58a
  - number: 58a.1.b
    text: |-
      de in [artikel 17b, derde lid, van de Financiële-verhoudingswet][ref1] bedoelde opschorting betrekking heeft op de
      betalingen op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref2] aan de provincies en gemeenten
      die aan de regeling deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17b
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '15'
  - number: 58a.2
    text: |-
      De ingevolge [artikel 186, tweede lid, aanhef en onder b, en derde lid, van de Gemeentewet][ref1] gestelde regels,
      alsmede het vierde tot en met het achtste lid van dat artikel, zijn van overeenkomstige toepassing op het openbaar
      lichaam de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
  - number: 58a.2.a
    text: |-
      voor het college wordt gelezen: het dagelijks bestuur van het openbaar lichaam het bestuur van de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58a
  - number: 58a.2.b
    text: |-
      de in [artikel 186, achtste lid, van de Gemeentewet][ref1] bedoelde opschorting betrekking heeft op de betalingen
      op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref2] aan de provincies en gemeenten die aan de
      regeling deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '15'
  - number: 58b
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt vóór 15 april van het jaar voorafgaande aan dat waarvoor de begroting dient, de
      algemene financiële en beleidsmatige kaders en de voorlopige jaarrekening aan de raden van de deelnemende gemeenten
      en aan provinciale staten van de deelnemende provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel58b
  - number: '59.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de ontwerpbegroting acht weken voordat zij aan het algemeen bestuur wordt
      aangeboden, onderscheidenlijk acht weken voordat zij door het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten en aan provinciale staten
      van de deelnemende provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel59
  - number: '59.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten en provincies voor een ieder ter inzage gelegd
      en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel59
  - number: '59.3'
    text: |-
      De raad van een deelnemende gemeente en provinciale staten van een deelnemende provincie kunnen bij het
      dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie onderscheidenlijk het
      gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt
      de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel59
  - number: '59.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie, onderscheidenlijk het gemeenschappelijk orgaan, zo nodig, de begroting aan de raden
      der deelnemende gemeenten en de staten der deelnemende provincies, die ter zake bij Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel59
  - number: '59.5'
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel59
  - number: '59.6'
    text: |-
      De [artikelen 190 tot en met 219 van de Provinciewet][ref1] zijn van overeenkomstige toepassing, voor zover daarvan
      bij of krachtens deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
  - number: '60.1'
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan mede door de besturen van de deelnemende provincies zijn overgedragen, is daarop
      [artikel 49][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel49
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '49'
        hoofdstuk: II
        afdeling: '4'
  - number: '60.2'
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten zijn overgedragen, zijn
      daarop de [artikelen 36 tot en met 39f][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel36
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '36'
        hoofdstuk: I
        afdeling: '4'
  - number: '61.1'
    text: |-
      De raden, de colleges van burgemeester en wethouders en de burgemeesters van een of meer gemeenten kunnen,
      afzonderlijk of tezamen, met de algemene besturen, de dagelijkse besturen en de voorzitters van een of meer
      waterschappen, ieder voor zover zij voor de eigen gemeente, onderscheidenlijk het eigen waterschap bevoegd zijn,
      een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die gemeenten of
      waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel61
  - number: '61.2'
    text: |-
      Een college van burgemeester en wethouders, en een burgemeester, onderscheidenlijk een dagelijks bestuur en een
      voorzitter van een waterschap gaan niet over tot het treffen van een regeling dan na verkregen toestemming van
      de gemeenteraad, onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel61
  - number: '61.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel61
  - number: '62'
    text: |-
      De [artikelen 8 tot en met 26][ref1], [28][ref2] en [29][ref3] zijn van overeenkomstige toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel29
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '28'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '29'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '2'
  - number: 62.a
    text: |-
      bij de toepassing van [artikel 10, vierde lid][ref1], voor «[artikel 81p, eerste lid, van de Gemeentewet][ref2]»
      wordt gelezen: artikel 81p, eerste lid, van de Gemeentewet of
      [artikel 51b, eerste lid, van de Waterschapswet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81p
      - id: ref3
        bwb_id: BWBR0005108
        artikel: 51b
  - number: 62.b
    text: |-
      bij de toepassing van [artikel 16, vijfde lid][ref1], voor «[artikel 25 van de Gemeentewet][ref2]» wordt gelezen:
      het bepaalde voor het orgaan dat het lid heeft aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '25'
  - number: '63.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of aan het gemeenschappelijk orgaan
      kunnen bij de regeling ten aanzien van de belangen ter behartiging waarvan zij wordt getroffen en voor het gebied
      waarvoor zij geldt, zodanige bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de
      deelnemende gemeenten en waterschappen toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel63
  - number: 63.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te
      heffen dan de rioolheffing, bedoeld in [artikel 228a van de Gemeentewet][ref1] en de rechten, bedoeld in
      [artikel 229, eerste lid, onder a en b, van de Gemeentewet][ref2] en in [artikel 115 van de Waterschapswet][ref3]
      en de rechten waarvan de heffing krachtens bijzondere wetten geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel228a
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel115
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 228a
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '229'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '115'
  - number: 63.1.b
    text: |-
      aan het gemeenschappelijk orgaan of de bedrijfsvoeringsorganisatie niet de bevoegdheid kan worden overgedragen
      belastingen te heffen of anderszins algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel63
  - number: '63.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende gemeenten en waterschappen geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel63
  - number: '63.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende gemeente of van een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge verhouding.
      Zij kan bepalen, dat de verordening van de gemeente of van het waterschap voor het gehele gebied, dan wel voor een
      gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel63
  - number: '64'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam of de
      bedrijfsvoeringsorganisatie van rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel64
  - number: 64a.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie besluit slechts
      tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen, verenigingen, coöperaties
      en onderlinge waarborgmaatschappijen, indien de regeling in deze mogelijkheid voorziet en dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel64a
  - number: 64a.2
    text: |-
      Het besluit wordt niet genomen dan nadat de raden van de deelnemende gemeenten en de algemene besturen van de
      deelnemende waterschappen een ontwerpbesluit is toegezonden en in de gelegenheid zijn gesteld hun wensen en
      bedenkingen ter kennis van het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsorganisatie
      te brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel64a
  - number: '65'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges
      of ambtenaren de bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1] en die bedoeld in
      [hoofdstuk XVIII van de Waterschapswet][ref2], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: 65a.1
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of
      het gemeenschappelijk orgaan mede door de besturen van de deelnemende gemeenten zijn overgedragen, zijn daarop de
      [artikelen 32a tot en met 32j][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 65a.2
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen, is
      daarop [artikel 50da][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50da
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50da
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '66'
    text: |-
      De bevoegdheden die bij de regeling worden overgedragen, berusten bij het algemeen bestuur, tenzij bij wet of in de
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66
  - number: 66a.1
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden van het algemeen bestuur overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
  - number: 66a.2
    text: 'Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
  - number: 66a.2.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 67][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel67
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '67'
        hoofdstuk: V
        paragraaf: '7'
        afdeling: '3'
  - number: 66a.2.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 63, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel63
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '63'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '3'
  - number: 66a.2.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
  - number: 66a.3
    text: |-
      De [artikelen 65b][ref1] en [65c][ref2] zijn van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel65b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel65c
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 65b
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 65c
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '3'
  - number: 66a.4
    text: |-
      In afwijking van [artikel 10:16, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het algemeen bestuur
      beperkingen stellen aan de uitoefening van de overgedragen bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 66a.5
    text: |-
      Ten aanzien van de bevoegdheden die met toepassing van het eerste lid zijn overgedragen, zijn de regels die bij of
      krachtens de wet zijn gesteld met betrekking tot de uitoefening daarvan en het toezicht daarop van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66a
  - number: 66b.1
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam mede door de besturen van de deelnemende gemeenten
      zijn overgedragen, is [artikel 33b][ref1] van toepassing op het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel33b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 33b
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '3'
  - number: 66b.2
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam uitsluitend door de besturen van de deelnemende
      waterschappen zijn overgedragen, is [artikel 50eb][ref1] van toepassing op het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50eb
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50eb
        hoofdstuk: III
        paragraaf: '5'
        afdeling: '3'
  - number: 66c
    text: |-
      Het dagelijks bestuur kan een of meer leden van het dagelijks bestuur machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66c
  - number: 66d.1
    text: De voorzitter vertegenwoordigt het openbaar lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66d
  - number: 66d.2
    text: De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel66d
  - number: '67.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel67
  - number: '67.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de begroting binnen twee weken na de vaststelling, doch in ieder geval vóór 1
      augustus van het jaar voorafgaande aan dat waarvoor de begroting dient, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel67
  - number: '67.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de jaarrekening vast in het jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel67
  - number: '67.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de jaarrekening binnen twee weken na de vaststelling, doch in ieder geval vóór 15
      juli van het jaar volgende op het jaar waarop de jaarrekening betrekking heeft, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel67
  - number: 67a
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt vóór 15 april van het jaar voorafgaande aan dat waarvoor de begroting dient, de
      algemene financiële en beleidsmatige kaders en de voorlopige jaarrekening aan de raden van de deelnemende gemeenten
      en aan de algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel67a
  - number: '68.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de ontwerpbegroting acht weken voordat zij aan het algemeen bestuur wordt
      aangeboden, onderscheidenlijk acht weken voordat zij door het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten en aan de algemene
      besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel68
  - number: '68.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten en waterschappen voor een ieder ter inzage
      gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel68
  - number: '68.3'
    text: |-
      De raden van de deelnemende gemeenten en de algemene besturen van de deelnemende waterschappen kunnen bij het
      dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie onderscheidenlijk het
      gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt
      de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel68
  - number: '68.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie, onderscheidenlijk het gemeenschappelijk orgaan, zo nodig, de begroting aan de raden
      van de deelnemende gemeenten en aan de algemene besturen van de deelnemende waterschappen, die ter zake bij
      gedeputeerde staten hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel68
  - number: '68.5'
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel68
  - number: '68.6'
    text: |-
      De [artikelen 186 tot en met 213 van de Gemeentewet][ref1] zijn van overeenkomstige toepassing, voor zover daarvan
      bij of krachtens deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
  - number: '68.7'
    text: |-
      In afwijking van het zesde lid zijn de [artikelen 99 tot en met 109c van de Waterschapswet][ref1] van
      overeenkomstige toepassing, voor zover daarvan bij of krachtens deze wet niet is afgeweken, indien uitsluitend
      door de besturen van de deelnemende waterschappen bevoegdheden zijn overgedragen aan het openbaar lichaam, de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '99'
  - number: '69.1'
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of
      het gemeenschappelijk orgaan mede door de besturen van de deelnemende gemeenten zijn overgedragen, zijn daarop de
      [artikelen 36 tot en met 39f][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel36
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '36'
        hoofdstuk: I
        afdeling: '4'
  - number: '69.2'
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen,
      zijn daarop de [artikelen 50h tot en met 50k][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50h
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50h
        hoofdstuk: III
        afdeling: '4'
  - number: '73.1'
    text: |-
      De raden, de colleges van burgemeester en wethouders en de burgemeesters van een of meer gemeenten kunnen,
      afzonderlijk of tezamen, met provinciale staten, de colleges van gedeputeerde staten en de commissarissen van de
      Koning van een of meer provincies en de algemene besturen, de dagelijkse besturen en de voorzitters van een of
      meer waterschappen, ieder voor zover zij voor de eigen gemeente, de eigen provincie, onderscheidenlijk het eigen
      waterschap bevoegd zijn, een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen
      van die gemeenten, provincies of waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel73
  - number: '73.2'
    text: |-
      Een college van burgemeester en wethouders en een burgemeester, een college van gedeputeerde staten en een
      commissaris van de Koning, onderscheidenlijk een dagelijks bestuur en een voorzitter van een waterschap gaan
      niet over tot het treffen van een regeling dan na verkregen toestemming van de gemeenteraad, provinciale staten,
      onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel73
  - number: '73.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel73
