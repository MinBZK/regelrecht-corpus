  - number: '86.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of aan het gemeenschappelijk orgaan
      kunnen bij de regeling ten aanzien van de belangen ter behartiging waarvan zij is getroffen en voor het gebied
      waarvoor zij geldt, zodanige bevoegdheden van regeling en bestuur worden overgedragen, als aan de besturen van
      de deelnemende provincies en waterschappen met betrekking tot hun eigen provincie, onderscheidenlijk waterschap
      toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel86
  - number: 86.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen
      te heffen dan de belasting, bedoeld in [artikel 222c van de Provinciewet][ref1], de rechten, bedoeld in
      [artikel 223 van de Provinciewet][ref2] en [artikel 115 van de Waterschapswet][ref3] en de rechten waarvan de
      heffing krachtens bijzondere wetten geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel115
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 222c
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '223'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '115'
  - number: 86.1.b
    text: |-
      aan het gemeenschappelijk orgaan of de bedrijfsvoeringsorganisatie niet de bevoegdheid kan worden overgedragen
      belastingen te heffen of anderszins algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel86
  - number: '86.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de aan de regeling deelnemende provincies en waterschappen geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel86
  - number: '86.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende provincie of een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge verhouding. Zij
      kan bepalen, dat de verordening van de provincie of van het waterschap voor het gehele gebied, dan wel voor een
      gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel86
  - number: '87'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam of de
      bedrijfsvoeringsorganisatie van rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel87
  - number: 87a.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie besluit slechts
      tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen, verenigingen, coöperaties
      en onderlinge waarborgmaatschappijen, indien de regeling in deze mogelijkheid voorziet en dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel87a
  - number: 87a.2
    text: |-
      Het besluit wordt niet genomen dan nadat provinciale staten van de deelnemende provincies en de algemene
      besturen van de deelnemende waterschappen een ontwerpbesluit is toegezonden en in de gelegenheid zijn gesteld
      hun wensen en bedenkingen ter kennis van het algemeen bestuur van het openbaar lichaam of het bestuur van de
      bedrijfsvoeringsorganisatie te brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel87a
  - number: '88'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges
      of ambtenaren de bevoegdheden, bedoeld in [hoofdstuk XV van de Provinciewet][ref1] en die bedoeld in
      [hoofdstuk XVIII van de Waterschapswet][ref2], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: 88a.1
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of
      het gemeenschappelijk orgaan mede door de besturen van de deelnemende provincies zijn overgedragen, zijn daarop de
      [artikelen 45a][ref1] en [45b][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel45b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 45a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 45b
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '3'
  - number: 88a.2
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen, is
      daarop [artikel 50da][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50da
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50da
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '89'
    text: |-
      De bevoegdheden die bij de regeling worden overgedragen, berusten bij het algemeen bestuur, tenzij bij wet of in de
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89
  - number: 89a.1
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden van het algemeen bestuur overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
  - number: 89a.2
    text: 'Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
  - number: 89a.2.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 90][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel90
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '7'
        afdeling: '3'
  - number: 89a.2.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 86, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel86
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '86'
        hoofdstuk: VII
        paragraaf: '1'
        afdeling: '3'
  - number: 89a.2.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
  - number: 89a.3
    text: |-
      De [artikelen 88b][ref1] en [88c][ref2] zijn van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel88b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel88c
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 88b
        hoofdstuk: VII
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 88c
        hoofdstuk: VII
        paragraaf: '3'
        afdeling: '3'
  - number: 89a.4
    text: |-
      In afwijking van [artikel 10:16, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het algemeen bestuur
      beperkingen stellen aan de uitoefening van de overgedragen bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 89a.5
    text: |-
      Ten aanzien van de bevoegdheden die met toepassing van het eerste lid zijn overgedragen, zijn de regels die bij of
      krachtens de wet zijn gesteld met betrekking tot de uitoefening daarvan en het toezicht daarop van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89a
  - number: 89b.1
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam mede door de besturen van de deelnemende provincies
      zijn overgedragen, is [artikel 46b][ref1] van toepassing op het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel46b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 46b
        hoofdstuk: II
        paragraaf: '5'
        afdeling: '3'
  - number: 89b.2
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam uitsluitend door de besturen van de deelnemende
      waterschappen zijn overgedragen, is [artikel 50eb][ref1] van toepassing op het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50eb
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50eb
        hoofdstuk: III
        paragraaf: '5'
        afdeling: '3'
  - number: 89c
    text: |-
      Het dagelijks bestuur kan een of meer leden van het dagelijks bestuur machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89c
  - number: 89d.1
    text: De voorzitter vertegenwoordigt het openbaar lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89d
  - number: 89d.2
    text: De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel89d
  - number: '90.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel90
  - number: '90.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de begroting binnen twee weken na de vaststelling, doch in ieder geval vóór 1
      augustus van het jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel90
  - number: '90.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de jaarrekening vast in het jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel90
  - number: '90.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de jaarrekening binnen twee weken na de vaststelling, doch in ieder geval vóór 15
      juli van het jaar volgende op het jaar waarop de jaarrekening betrekking heeft, aan Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel90
  - number: 90a
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt vóór 15 april van het jaar voorafgaande aan dat waarvoor de begroting dient, de
      algemene financiële en beleidsmatige kaders en de voorlopige jaarrekening aan provinciale staten van de deelnemende
      provincies en aan de algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel90a
  - number: '91.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de ontwerpbegroting acht weken voordat zij aan het algemeen bestuur wordt
      aangeboden, onderscheidenlijk acht weken voordat zij door het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan provinciale staten van de deelnemende provincies en aan de
      algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel91
  - number: '91.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de aan de regeling deelnemende provincies en waterschappen voor een
      ieder ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel91
  - number: '91.3'
    text: |-
      Provinciale staten van de deelnemende provincies en de algemene besturen van de deelnemende waterschappen
      kunnen bij het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting naar voren brengen. Het
      dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-begroting, zoals deze aan
      het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel91
  - number: '91.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie, onderscheidenlijk het gemeenschappelijk orgaan, zo nodig, de begroting aan provinciale
      staten van de deelnemende provincies en aan de algemene besturen van de deelnemende waterschappen, die ter zake bij
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel91
  - number: '91.5'
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel91
  - number: '91.6'
    text: |-
      De [artikelen 190 tot en met 219 van de Provinciewet][ref1] zijn van overeenkomstige toepassing, voor zover daarvan
      bij of krachtens deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
  - number: '91.7'
    text: |-
      In afwijking van het zesde lid zijn de [artikelen 99 tot en met 109c van de Waterschapswet][ref1] van
      overeenkomstige toepassing, voor zover daarvan bij of krachtens deze wet niet is afgeweken, indien uitsluitend
      door de besturen van de deelnemende waterschappen bevoegdheden zijn overgedragen aan het openbaar lichaam, de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '99'
  - number: '92.1'
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan mede door de besturen van de deelnemende provincies zijn overgedragen, is daarop
      [artikel 49][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel49
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '49'
        hoofdstuk: II
        afdeling: '4'
  - number: '92.2'
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen,
      zijn daarop de [artikelen 50h tot en met 50k][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50h
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50h
        hoofdstuk: III
        afdeling: '4'
  - number: '93'
    text: |-
      Aan een regeling als bedoeld in de [hoofdstukken I tot en met VII][ref1] kunnen, indien zij daartoe overigens
      bevoegd zijn, tevens deelnemen:


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
  - number: 93.a
    text: een of meer andere openbare lichamen dan gemeenten, provincies en waterschappen;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel93
  - number: 93.b
    text: |-
      een of meer andere rechtspersonen, indien hun bestuur bij koninklijk besluit, dat in de *Nederlandse Staatscourant*
      wordt geplaatst, daartoe is gemachtigd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel93
  - number: '94.1'
    text: |-
      Deelneming vanwege het Rijk geschiedt bij besluit van Onze betrokken Minister. Het besluit regelt mede de gevolgen
      van de deelneming.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel94
  - number: '94.2'
    text: |-
      Indien vanwege het Rijk wordt deelgenomen aan een regeling waarbij gebruik wordt gemaakt van een bevoegdheid als
      bedoeld in [artikel 8][ref1], wordt een besluit als bedoeld in het eerste lid aan de beide kamers der Staten-
      Generaal overgelegd. Het treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij besluit van Onze betrokken Minister wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van het besluit bij wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '95'
    text: |-
      De [hoofdstukken I tot en met VII][ref1] zijn van overeenkomstige toepassing, met dien verstande dat, wanneer het
      een regeling betreft met deelnemers bedoeld in de [artikelen 93, onderdeel ][ref2] en [94, eerste lid][ref3], de
      genoemde hoofdstukken ten aanzien van deze deelnemers zoveel mogelijk van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel94
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '93'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '94'
        hoofdstuk: VIII
  - number: '96'
    text: |-
      De raad en het college van burgemeester en wethouders van een gemeente, provinciale staten en gedeputeerde staten
      van een provincie, onderscheidenlijk het algemeen bestuur en het dagelijks bestuur van een waterschap kunnen, ieder
      voor zover zij voor de eigen gemeente, de eigen provincie, onderscheidenlijk het eigen waterschap bevoegd zijn,
      een gemeenschappelijke regeling treffen ter behartiging van bepaalde belangen van die gemeente, die provincie,
      onderscheidenlijk dat waterschap met - indien deze daartoe overigens bevoegd zijn - de besturen van:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel96
  - number: 96.a
    text: een of meer andere openbare lichamen dan gemeenten, provincies en waterschappen;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel96
  - number: 96.b
    text: |-
      een of meer andere rechtspersonen, indien zij bij koninklijk besluit dat in de *Nederlandse Staatscourant* wordt
      geplaatst, daartoe zijn gemachtigd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel96
  - number: '97.1'
    text: |-
      Deelneming vanwege het Rijk geschiedt bij besluit van Onze betrokken Minister. Het besluit regelt mede de gevolgen
      van de deelneming.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel97
  - number: '97.2'
    text: |-
      Indien vanwege het Rijk wordt deelgenomen aan een regeling waarbij gebruik wordt gemaakt van een bevoegdheid als
      bedoeld in [artikel 8][ref1], wordt een besluit als bedoeld in het eerste lid aan de beide kamers der Staten-
      Generaal overgelegd. Het treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij besluit van Onze betrokken Minister wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van het besluit bij wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '98'
    text: |-
      Van overeenkomstige toepassing is [hoofdstuk I][ref1], indien een gemeente de regeling aangaat,
      [hoofdstuk II][ref2], indien een provincie de regeling aangaat, of [hoofdstuk III][ref3], indien een waterschap de
      regeling aangaat. Wanneer het een regeling betreft met deelnemers bedoeld in de [artikelen 96, onderdeel ][ref4]
      en [97, eerste lid][ref5], zijn de genoemde hoofdstukken ten aanzien van deze deelnemers zoveel mogelijk van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel96
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel97
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003740
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003740
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003740
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003740
        artikel: '96'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0003740
        artikel: '97'
        hoofdstuk: IX
  - number: '99.1'
    text: |-
      Op verzoek van het bestuur van een of meer gemeenten kunnen gedeputeerde staten, indien een zwaarwegend openbaar
      belang dat vereist, gemeenten aanwijzen waarvan de besturen een gemeenschappelijke regeling moeten treffen ter
      behartiging van een of meer bepaalde belangen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel99
  - number: '99.2'
    text: |-
      Een aanwijzing kan ook betreffen de verplichting tot wijziging of opheffing van een bestaande regeling, alsmede de
      verplichting tot toetreding tot of uittreding uit een bestaande regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel99
  - number: '99.3'
    text: |-
      Alvorens een aanwijzing te geven, plegen gedeputeerde staten overleg met de besturen van de betrokken gemeenten.
      Bij een aanwijzing als bedoeld in het tweede lid, plegen gedeputeerde staten tevens overleg met het bestuur van
      het openbaar lichaam of het gemeenschappelijk orgaan dat bij de betreffende regeling is ingesteld. Het overleg
      duurt ten hoogste dertien weken, te rekenen vanaf de datum waarop gedeputeerde staten de betrokken besturen tot het
      voeren van overleg in de gelegenheid hebben gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel99
  - number: '99.4'
    text: |-
      Bij de aanwijzing stellen gedeputeerde staten een termijn binnen welke een regeling ter kennisneming aan hen dient
      te worden gezonden. Deze termijn bedraagt ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel99
  - number: '100.1'
    text: |-
      Gedeputeerde staten leggen uiterlijk binnen zes maanden na het verstrijken van de termijn, bedoeld
      in [artikel 99, vierde lid][ref1], een regeling op overeenkomstig de aanwijzing, bedoeld in
      [artikel 99, eerste lid][ref2], indien geen regeling aan hen is gezonden, of indien uit de ter kennisneming
      toegezonden regeling blijkt dat aan de aanwijzing onvoldoende gevolg is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: '100.2'
    text: |-
      Een oplegging kan ook betreffen de oplegging van een wijziging of opheffing van een bestaande regeling, alsmede de
      oplegging van een toetreding tot of uittreding uit een bestaande regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel100
  - number: '100.3'
    text: |-
      Alvorens een regeling op te leggen, horen gedeputeerde staten de besturen van de betrokken gemeenten over het
      ontwerp van de op te leggen regeling. Bij een oplegging als bedoeld in het tweede lid, horen gedeputeerde staten
      tevens het bestuur van het openbaar lichaam of het gemeenschappelijk orgaan dat bij de betreffende regeling is
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel100
  - number: '101'
    text: |-
      Indien het een regeling betreft tussen gemeenten die in meer dan een provincie liggen, vindt de toepassing van de
      [artikelen 99][ref1] en [100][ref2] plaats bij gelijkluidende besluiten van gedeputeerde staten van de betrokken
      provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
  - number: '102.1'
    text: |-
      Onze Minister wie het aangaat kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, gedeputeerde staten uitnodigen tot het geven van een aanwijzing als bedoeld in
      [artikel 99, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: '102.2'
    text: Een uitnodiging wordt niet gedaan dan nadat Onze Minister wie het aangaat gedeputeerde staten heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel102
  - number: '102.3'
    text: |-
      Bij de uitnodiging stelt Onze Minister wie het aangaat een termijn binnen welke gedeputeerde staten een aanwijzing
      dienen te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel102
  - number: 103a
    text: |-
      De commissaris van de Koning treedt voor de toepassing van de [artikelen 99 tot en met 102][ref1] in de plaats van
      gedeputeerde staten, indien het betreft een regeling uitsluitend tussen burgemeesters.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
  - number: 103b
    text: |-
      De aanwijzing, bedoeld in [artikel 99, eerste lid][ref1], kan ook betreffen de deelneming van gemeenten aan
      een regeling als bedoeld in [hoofdstuk V][ref2] en [hoofdstuk VIII][ref3], voor zover daaraan geen provincies
      deelnemen. De artikel 99, derde lid, en [100 tot en met 102][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVIII
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel100
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003740
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0003740
        artikel: '100'
        hoofdstuk: X
  - number: 103c.1
    text: |-
      De aanwijzing, bedoeld in [artikel 99, eerste lid][ref1], kan ook betreffen de deelneming van gemeenten aan
      een regeling als bedoeld in de [hoofdstukken IV][ref2] en [VI][ref3], alsmede [VIII][ref4], voor zover daaraan
      provincies deelnemen, met dien verstande dat de aanwijzing wordt gegeven door Onze Minister wie het aangaat, in
      overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. [Artikel 99, derde lid][ref5], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0003740#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003740#HoofdstukVII
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel103c
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '99'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003740
        hoofdstuk: IV
