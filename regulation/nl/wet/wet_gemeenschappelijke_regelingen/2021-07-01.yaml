  - number: 136.2.d
    text: de wettelijke voorschriften waardoor de bevoegdheden van het samenwerkingsverband worden beheerst;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: 136.2.e
    text: |-
      de bevoegdheden die bij de regeling dan wel, met toepassing van [artikel 10, tweede lid, tweede zin][ref1],
      krachtens de regeling zijn overgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 136.2.f
    text: het adres, gegevens over bereikbaarheid en de plaats van vestiging;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: 136.2.g
    text: |-
      of een openbaar lichaam, een bedrijfsvoeringsorganisatie of een gemeenschappelijk orgaan is ingesteld en onder
      welke naam, dan wel toepassing of overeenkomstige toepassing wordt gegeven aan [artikel 8, vierde lid][ref1],
      alsmede de datum van hun instelling onderscheidenlijk vanaf welke datum toepassing of overeenkomstige toepassing
      wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 136.2.h
    text: een verwijzing naar de geconsolideerde tekst van de regeling;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: 136.2.i
    text: |-
      een overzicht van de wijzigingen van de regeling en een verwijzing naar de bijbehorende geconsolideerde versies van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: '136.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven over de inrichting van het register
      en de toevoeging van gegevens.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: '136.4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan het register ambtshalve aanvullen met gegevens uit
      openbare bron.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: '137'
    text: |-
      Waar in enig wettelijk voorschrift in algemene zin naar de Wet gemeenschappelijke regelingen wordt verwezen, wordt
      deze verwijzing geacht te zijn geschied naar deze wet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel137
  - number: '139.1'
    text: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is belast met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel139
  - number: '139.2'
    text: |-
      Voor zover bij die uitvoering belangen zijn betrokken, welke aan de zorg van een andere minister zijn toevertrouwd,
      geschiedt de uitvoering in overeenstemming met de desbetreffende minister.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel139
  - number: '140'
    text: Deze wet kan worden aangehaald als "Wet gemeenschappelijke regelingen".
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel140
  - number: '141'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel141
