  - number: 50a.2
    text: |-
      Wanneer is gehandeld in strijd met het eerste lid, is
      [artikel X 7a, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_7a
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_7a
  - number: 50a.3
    text: |-
      Wanneer bij de toepassing van voor de deelnemende waterschappen geldende reglementen als bedoeld in het vorige lid,
      onderdeel b en c en in [artikel 50e][ref1] de desbetreffende bepalingen in die reglementen onderling verschillen,
      wordt in de regeling aangegeven welke bepalingen van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50e
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50e
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '3'
  - number: 50b.1
    text: |-
      Aan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of aan het gemeenschappelijk orgaan
      kunnen bij de regeling ten aanzien van de belangen ter behartiging waarvan zij wordt getroffen en voor het gebied
      waarvoor zij geldt, zodanige bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de
      deelnemende waterschappen toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50b
  - number: 50b.1.a
    text: |-
      aan het bestuur van een openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te heffen
      dan de rechten bedoeld in [artikel 115 van de Waterschapswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel115
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '115'
  - number: 50b.1.b
    text: |-
      aan het gemeenschappelijk orgaan of de bedrijfsvoeringsorganisatie niet de bevoegdheid kan worden overgedragen
      belastingen te heffen of anderszins algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50b
  - number: 50b.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende waterschappen geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50b
  - number: 50b.3
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat de
      verordening van het waterschap voor het gehele gebied, dan wel een gedeelte daarvan geheel of gedeeltelijk ophoudt
      te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50b
  - number: 50c
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam of de
      bedrijfsvoeringsorganisatie van rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50c
  - number: 50ca.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie besluit slechts
      tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen, verenigingen, coöperaties
      en onderlinge waarborgmaatschappijen, indien de regeling in deze mogelijkheid voorziet en dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ca
  - number: 50ca.2
    text: |-
      Het besluit wordt niet genomen dan nadat de algemene besturen van de deelnemende waterschappen een ontwerpbesluit
      is toegezonden en in de gelegenheid zijn gesteld hun wensen en bedenkingen ter kennis van het algemeen bestuur van
      het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie te brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ca
  - number: 50d
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XVIII van de Waterschapswet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50d
    references:
      - id: ref1
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: 50da.1
    text: |-
      Wanneer het algemeen bestuur van het openbaar lichaam de door een wet, een algemene maatregel van bestuur of een
      provinciale verordening gevorderde beslissingen niet of niet naar behoren neemt, voorziet het dagelijks bestuur
      daarin.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50da
  - number: 50da.2
    text: |-
      Wanneer het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan de gevorderde beslissingen niet of niet naar behoren neemt, voorzien
      gedeputeerde staten daarin namens dat bestuur of orgaan en ten laste van het openbaar lichaam respectievelijk de
      bedrijfsvoeringsorganisatie of de deelnemende waterschappen, indien het een gemeenschappelijk orgaan betreft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50da
  - number: 50da.3
    text: |-
      Spoedeisende gevallen uitgezonderd, vindt het tweede lid geen toepassing dan nadat het dagelijks bestuur van het
      openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan
      in de gelegenheid is gesteld binnen een door gedeputeerde staten gestelde termijn alsnog de gevorderde besluiten
      te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50da
  - number: 50e
    text: |-
      De bevoegdheden die bij de regeling worden overgedragen, berusten bij het algemeen bestuur, tenzij bij wet of in de
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50e
  - number: 50ea.1
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden van het algemeen bestuur overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
  - number: 50ea.2
    text: 'Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
  - number: 50ea.2.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 50f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50f
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50f
        hoofdstuk: III
        paragraaf: '7'
        afdeling: '3'
  - number: 50ea.2.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 50b, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50b
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '3'
  - number: 50ea.2.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
  - number: 50ea.3
    text: |-
      De [artikelen 50db][ref1] en [50dc][ref2] zijn van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50db
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel50dc
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50db
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 50dc
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '3'
  - number: 50ea.4
    text: |-
      In afwijking van [artikel 10:16, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het algemeen bestuur
      beperkingen stellen aan de uitoefening van de overgedragen bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 50ea.5
    text: |-
      Ten aanzien van de bevoegdheden die met toepassing van het eerste lid zijn overgedragen, zijn de regels die bij of
      krachtens de wet zijn gesteld met betrekking tot de uitoefening daarvan en het toezicht daarop van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ea
  - number: 50eb.1
    text: 'Het dagelijks bestuur is in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50eb
  - number: 50eb.1.a
    text: |-
      het dagelijks bestuur van het openbaar lichaam te voeren, voor zover niet bij of krachtens de wet of de regeling
      het algemeen bestuur hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50eb
  - number: 50eb.1.b
    text: beslissingen van het algemeen bestuur voor te bereiden en uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50eb
  - number: 50eb.2
    text: |-
      Het dagelijks bestuur neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50eb
  - number: 50ec
    text: |-
      Het dagelijks bestuur kan een of meer leden van het dagelijks bestuur machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ec
  - number: 50ed
    text: |-
      De voorzitter vertegenwoordigt het waterschap in en buiten rechte. Indien de voorzitter aan een ander machtiging
      verleent tot vertegenwoordiging, behoeft deze machtiging de instemming van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50ed
  - number: 50f.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50f
  - number: 50f.2
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de begroting binnen vier weken na de vaststelling, doch in ieder geval vóór 1
      augustus van het jaar voorafgaande aan dat waarvoor de begroting dient, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50f
  - number: 50f.3
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de jaarrekening vast in het jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50f
  - number: 50f.4
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de jaarrekening binnen twee weken na de vaststelling, doch in ieder geval vóór 15
      juli van het jaar volgende op het jaar waarop de jaarrekening betrekking heeft, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50f
  - number: 50fa
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt vóór 15 april van het jaar voorafgaande aan dat waarvoor de begroting dient,
      de algemene financiële en beleidsmatige kaders en de voorlopige jaarrekening aan de algemene besturen van de
      deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50fa
  - number: 50g.1
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de ontwerpbegroting acht weken voordat zij aan het algemeen bestuur wordt
      aangeboden, onderscheidenlijk acht weken voordat zij door het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50g
  - number: 50g.2
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende waterschappen voor een ieder ter inzage gelegd en tegen
      betaling van kosten algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50g
  - number: 50g.3
    text: |-
      De algemene besturen van de deelnemende waterschappen kunnen bij het dagelijks bestuur van het openbaar
      lichaam, het bestuur van de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan hun
      zienswijze over de ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze
      zienswijze is vervat bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50g
  - number: 50g.4
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie, onderscheidenlijk het gemeenschappelijk orgaan, zo nodig, de begroting aan de algemene
      besturen van de deelnemende waterschappen, die terzake bij gedeputeerde staten hun zienswijze naar voren kunnen
      brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50g
  - number: 50g.5
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50g
  - number: 50g.6
    text: |-
      De [artikelen 98 tot en met 109c van de Waterschapswet][ref1] zijn van overeenkomstige toepassing, voor zover
      daarvan bij of krachtens deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel98
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50g
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '98'
  - number: 50h.1
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het bestuur van het openbaar
      lichaam of van de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan kan door gedeputeerde
      staten worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50h
  - number: 50h.2
    text: |-
      Ten aanzien van de vernietiging van een niet-schriftelijke beslissing gericht op enig rechtsgevolg zijn de
      [afdelingen 10.2.2][ref1] en [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: 50i
    text: |-
      Indien een bekendgemaakt besluit is vernietigd of indien het niet is vernietigd binnen de tijd waarvoor het
      is geschorst, wordt hiervan door het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan kennisgegeven in het publicatieblad.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50i
  - number: 50j
    text: |-
      In afwijking van [artikel 8:4, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1] kan een
      belanghebbende tegen een besluit van gedeputeerde staten als bedoeld in [artikel 50h, eerste lid][ref2], beroep
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel50h
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50j
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 50h
        hoofdstuk: III
        afdeling: '4'
  - number: 50k
    text: |-
      Het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk
      orgaan neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met het besluit tot
      vernietiging wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel50k
  - number: '51.1'
    text: |-
      De raden, de colleges van burgemeester en wethouders en de burgemeesters van een of meer gemeenten kunnen,
      afzonderlijk of tezamen, met provinciale staten, de colleges van gedeputeerde staten of de commissarissen
      van de Koning, ieder voor zover zij voor de eigen gemeente, onderscheidenlijk provincie bevoegd zijn, een
      gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die gemeenten of
      provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel51
  - number: '51.2'
    text: |-
      Een college van burgemeester en wethouders en een burgemeester, onderscheidenlijk een college van gedeputeerde
      staten en de commissaris van de Koning gaat niet over tot het treffen van een regeling dan na verkregen toestemming
      van de gemeenteraad, onderscheidenlijk provinciale staten. De toestemming kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel51
  - number: '51.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel51
  - number: '52.1'
    text: |-
      De [artikelen 8 tot en met 26][ref1] zijn van overeenkomstige toepassing, met uitzondering van
      [artikel 20, vierde lid][ref2], en met dien verstande dat:


