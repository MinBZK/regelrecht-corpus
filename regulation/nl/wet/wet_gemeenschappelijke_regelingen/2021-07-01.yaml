  - number: 50a.1.e
    text: |-
      bij de toepassing van [artikel 26, eerste en tweede lid][ref1], voor «gemeentebestuur» wordt gelezen
      «waterschapsbestuur», voor «gemeente» wordt gelezen «waterschap», voor «gemeenten» wordt gelezen «waterschappen» en
      voor «gemeenteblad» wordt gelezen «waterschapsblad».


