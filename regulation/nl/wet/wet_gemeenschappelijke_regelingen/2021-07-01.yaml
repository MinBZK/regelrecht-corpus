        artikel: 32h
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 32d.2
    text: |-
      Voorafgaand aan het nemen van een besluit tot indeplaatsstelling, informeert Onze Minister die het aangaat
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32d
  - number: 32e.1
    text: |-
      Bij de uitvoering van het besluit tot indeplaatsstelling beschikken gedeputeerde staten over de bevoegdheden
      waarover het orgaan waaraan de bevoegdheid is overgedragen bij of krachtens die wet of bij gemeenschappelijke
      regeling beschikt.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32e
  - number: 32e.2
    text: |-
      Voor zover het orgaan waaraan de bevoegdheid is overgedragen, had hij de bevoegdheden, bedoeld in het eerste lid,
      zelf uitgeoefend, de kosten van de uitvoering in rekening kan brengen bij derden, heeft hij bij die derden verhaal
      voor de door gedeputeerde staten ten laste van het openbaar lichaam, de bedrijfsvoeringsorganisatie dan wel, indien
      het een gemeenschappelijk orgaan betreft, de deelnemende gemeenten gebrachte kosten. Het openbaar lichaam, de
      bedrijfsvoeringsorganisatie dan wel gemeenschappelijk orgaan kan het bedrag invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32e
  - number: 32f
    text: |-
      Gedeputeerde staten kunnen een besluit tot indeplaatsstelling intrekken, indien het orgaan waaraan de bevoegdheid
      is overgedragen voldoende aannemelijk maakt dat hij zonder voorbehoud zal voorzien in hetgeen het besluit van hem
      vordert.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32f
  - number: 32g
    text: |-
      Gedeputeerde staten onderscheidenlijk Onze Minister die het aangaat kunnen ambtenaren aanwijzen ten
      behoeve van het toezicht op de uitvoering van de aan het bestuur van het openbaar lichaam of van de
      bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan bij of krachtens een andere
      wet dan de [Gemeentewet][ref1] opgedragen taken. Deze ambtenaren beschikken over de bevoegdheden van de
      [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref2]. De [artikelen 5:12][ref3], [5:13][ref4]
      en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0005416
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 32h.1
    text: |-
      Indien gedeputeerde staten bij de uitvoering van het besluit tot indeplaatsstelling namens het
      orgaan waaraan de bevoegdheid is overgedragen een besluit nemen, kan voor de toepassing van
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] bezwaar worden gemaakt bij gedeputeerde staten. Gedeputeerde
      staten beslissen op het bezwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 32h.2
    text: Gedeputeerde staten zijn de verwerende partij inzake een beroep tegen een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32h
  - number: 32h.3
    text: |-
      Het orgaan waaraan een bevoegdheid is overgedragen kan geen beroep instellen tegen een besluit als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32h
  - number: 32i.1
    text: |-
      Het orgaan waaraan een bevoegdheid is overgedragen werkt mee met de uitvoering van een besluit tot
      indeplaatsstelling. Gedeputeerde staten onderscheidenlijk Onze Minister die het aangaat kunnen ter zake
      van de uitvoering van het besluit aanwijzingen geven. Het bestuur van het openbaar lichaam of van de
      bedrijfsvoeringsorganisatie dan wel, indien het een gemeenschappelijk orgaan betreft, de besturen van de
      deelnemende gemeenten, stellen op eerste vordering van gedeputeerde staten de voor de uitvoering van het besluit
      benodigde ambtenaren ter beschikking en verschaffen op eerste vordering van gedeputeerde staten alle informatie die
      nodig is voor de uitvoering van het besluit tot indeplaatsstelling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32i
  - number: 32i.2
    text: |-
      Gedeputeerde staten onderscheidenlijk Onze Minister die het aangaat kunnen ambtenaren aanwijzen die ten
      behoeve van de uitvoering van een besluit tot indeplaatsstelling beschikken over de bevoegdheden van de
      [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref1]. De [artikelen 5:12][ref2], [5:13][ref3]
      en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing. Het
      orgaan waaraan een bevoegdheid is overgedragen verschaft de aangewezen ambtenaren desgevraagd de faciliteiten die
      zij nodig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 32j
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      kunnen regels worden gesteld over de verstrekking van systematische informatie aan het provinciebestuur of, in
      het geval [artikel 32d, eerste lid][ref1], van toepassing is, aan Onze Minister die het aangaat, betreffende de
      uitvoering door het orgaan waaraan een bevoegdheid is overgedragen van de andere wet dan de [Gemeentewet][ref2].
      Bij ministeriële regeling of bij provinciale verordening kunnen nadere regels worden gesteld omtrent de toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32d
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel32j
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32d
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005416
  - number: '33'
    text: |-
      De bevoegdheden die bij de regeling worden overgedragen, berusten bij het algemeen bestuur, tenzij bij wet of in de
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33
  - number: 33a.1
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden overdragen, tenzij de aard van de bevoegdheid zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
  - number: 33a.2
    text: 'Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
  - number: 33a.2.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 34][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel34
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '34'
        hoofdstuk: I
        paragraaf: '7'
        afdeling: '3'
  - number: 33a.2.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 30, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel30
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '3'
  - number: 33a.2.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
  - number: 33a.3
    text: |-
      [Artikel 19 van de Bekendmakingswet][ref1] is van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel19
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '19'
  - number: 33a.4
    text: |-
      In afwijking van [artikel 10:16, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het algemeen bestuur
      beperkingen stellen aan de uitoefening van de overgedragen bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 33a.5
    text: |-
      Ten aanzien van de bevoegdheden die met toepassing van het eerste lid zijn overgedragen, zijn de regels die bij of
      krachtens de wet zijn gesteld met betrekking tot de uitoefening daarvan en het toezicht daarop van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33a
  - number: 33b.1
    text: 'Het dagelijks bestuur is in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33b
  - number: 33b.1.a
    text: |-
      het dagelijks bestuur van het openbaar lichaam te voeren, voor zover niet bij of krachtens de wet of de regeling
      het algemeen bestuur hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33b
  - number: 33b.1.b
    text: beslissingen van het algemeen bestuur voor te bereiden en uit te voeren;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33b
  - number: 33b.1.c
    text: regels vast te stellen over de ambtelijke organisatie van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33b
  - number: 33b.1.d
    text: |-
      tot privaatrechtelijke rechtshandelingen van het openbaar lichaam te besluiten, met uitzondering van
      privaatrechtelijke rechtshandelingen als bedoeld in [artikel 31a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel31a
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 31a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '3'
  - number: 33b.1.e
    text: |-
      te besluiten namens het openbaar lichaam, het dagelijks bestuur of het algemeen bestuur rechtsgedingen,
      bezwaarprocedures of administratief beroepsprocedures te voeren of handelingen ter voorbereiding daarop te
      verrichten, tenzij het algemeen bestuur, voor zover het het algemeen bestuur aangaat, in voorkomende gevallen
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33b
  - number: 33b.2
    text: |-
      Het dagelijks bestuur neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33b
  - number: 33c
    text: |-
      Het dagelijks bestuur kan een of meer leden van het dagelijks bestuur machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33c
  - number: 33d.1
    text: De voorzitter vertegenwoordigt het openbaar lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33d
  - number: 33d.2
    text: De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel33d
  - number: '34.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34
  - number: '34.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de begroting binnen twee weken na de vaststelling, doch in ieder geval vóór 1
      augustus van het jaar voorafgaande aan dat waarvoor de begroting dient, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34
  - number: '34.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de jaarrekening vast in het jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34
  - number: '34.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de jaarrekening binnen twee weken na de vaststelling, doch in ieder geval vóór 15
      juli van het jaar volgende op het jaar waarop de jaarrekening betrekking heeft, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34
  - number: 34a.1
    text: |-
      Indien het openbaar lichaam de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan een specifieke uitkering
      als bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref1] ontvangt van het Rijk of middelen ontvangt
      van de deelnemende gemeenten, die afkomstig zijn uit een specifieke uitkering, zijn de [artikelen, 17a][ref2]
      en [17b van de Financiële-verhoudingswet][ref3] op de informatie ten behoeve van de verantwoording over deze
      middelen, van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 15a
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0008290
        artikel: 17b
  - number: 34a.1.a
    text: |-
      voor gedeputeerde staten en het college van burgemeester en wethouders wordt gelezen: het dagelijks bestuur van het
      openbaar lichaam het bestuur van de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34a
  - number: 34a.1.b
    text: |-
      de in [artikel 17b, derde lid, van de Financiële-verhoudingswet][ref1] bedoelde opschorting betrekking heeft op
      de betalingen op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref2] aan de gemeenten die aan de
      regeling deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17b
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '15'
  - number: 34a.2
    text: |-
      De ingevolge [artikel 186, tweede lid, aanhef en onder b, en derde lid, van de Gemeentewet][ref1] gestelde regels,
      alsmede het vierde tot en met het achtste lid van dat artikel, zijn van overeenkomstige toepassing op het openbaar
      lichaam de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
  - number: 34a.2.a
    text: |-
      voor het college wordt gelezen: het dagelijks bestuur van het openbaar lichaam het bestuur van de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34a
  - number: 34a.2.b
    text: |-
      de in [artikel 186, achtste lid, van de Gemeentewet][ref1] bedoelde opschorting betrekking heeft op de betalingen
      op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref2] aan de gemeenten die aan de regeling
      deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '15'
  - number: 34b
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt vóór 15 april van het jaar voorafgaande aan dat waarvoor de begroting dient,
      de algemene financiële en beleidsmatige kaders en de voorlopige jaarrekening aan de raden van de deelnemende
      gemeenten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel34b
  - number: '35.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de ontwerpbegroting acht weken voordat zij aan het algemeen bestuur wordt
      aangeboden, onderscheidenlijk acht weken voordat zij door het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel35
  - number: '35.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de besturen van de deelnemende gemeenten voor een ieder ter inzage
      gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel35
  - number: '35.3'
    text: |-
      De raden van de deelnemende gemeenten kunnen bij het dagelijks bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting
      naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-
      begroting, zoals deze aan het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel35
  - number: '35.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van
      de deelnemende gemeenten, die ter zake bij gedeputeerde staten hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel35
  - number: '35.5'
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel35
  - number: '35.6'
    text: |-
      De [artikelen 186 tot en met 213 van de Gemeentewet][ref1] zijn van overeenkomstige toepassing, voor zover daarvan
      bij of krachtens deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
  - number: '36.1'
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het bestuur van het openbaar
      lichaam of van de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan kan bij koninklijk
      besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel36
  - number: '36.2'
    text: |-
      Ten aanzien van de vernietiging van een niet-schriftelijke beslissing gericht op enig
      rechtsgevolg zijn de [artikelen 37 tot en met 39f][ref1] alsmede de [afdelingen 10.2.2][ref2] en
      [10.2.3 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '37'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '37.1'
    text: |-
      Indien een besluit van het algemeen bestuur of het dagelijks bestuur van het openbaar lichaam, van het bestuur van
      de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan naar het oordeel van gedeputeerde
      staten voor vernietiging in aanmerking komt, doen zij daarvan binnen tien dagen nadat het te hunner kennis is
      gekomen, mededeling aan Onze Minister die het aangaat. Zij geven hiervan tegelijkertijd kennis aan het orgaan dat
      het besluit nam en aan de deelnemende gemeenten, en zo nodig aan het orgaan dat met de uitvoering van het besluit
      is belast en aan de geadresseerde van het besluit.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel37
  - number: '37.2'
    text: |-
      Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van Onze Minister die het aangaat de mededeling is ontvangen, dat voor schorsing of vernietiging geen
      redenen bestaan. Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van gedeputeerde
      staten is geschorst of vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel37
  - number: '37.3'
    text: |-
      In geval de bevoegdheid tot het nemen van een besluit op grond van een andere wet dan de Gemeentewet aan het
      algemeen bestuur of het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan is overgedragen en het besluit in aanmerking komt voor vernietiging
      wegens strijd met het recht, kunnen gedeputeerde staten mededeling doen dat zij overwegen toepassing te geven aan
      het eerste lid. De mededeling wordt gedaan aan het orgaan dat het besluit heeft genomen, het orgaan dat met de
      uitvoering van het besluit is belast en de geadresseerde van het besluit. Nadat gedeputeerde staten mededeling
      hebben gedaan, wordt het besluit niet of niet verder uitgevoerd. Indien niet binnen tien dagen toepassing is
      gegeven aan het eerste lid, dan wel indien gedeputeerde staten mededelen dat geen toepassing wordt gegeven aan het
      eerste lid, wordt het besluit uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel37
  - number: '38.1'
    text: Een voordracht tot schorsing wordt gedaan door Onze Minister die het aangaat.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel38
  - number: '38.2'
    text: |-
      Over de voordracht pleegt Onze Minister die het aangaat overleg met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, tenzij schorsing onverwijld plaats dient te vinden. In de voordracht wordt het achterwege
      blijven van overleg gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel38
  - number: '39'
    text: In het koninklijk besluit kan voor de duur van de schorsing een voorziening worden getroffen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39
  - number: 39a
    text: |-
      Indien een bekendgemaakt besluit niet is vernietigd binnen de tijd waarvoor het is geschorst, wordt hiervan door
      het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk
      orgaan kennisgegeven in het publicatieblad.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39a
  - number: 39b.1
    text: |-
      De voordracht tot vernietiging wordt gedaan door of mede door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39b
  - number: 39b.2
    text: |-
      [Artikel 17, derde lid, van de Wet op de Raad van State][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel17
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '17'
  - number: 39c.1
    text: |-
      In het koninklijk besluit kan een voorziening worden getroffen voor de periode tussen de inwerkingtreding en het
      tijdstip dat het op grond van [artikel 39e][ref1] genomen besluit in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel39e
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 39e
        hoofdstuk: I
        afdeling: '4'
  - number: 39c.2
    text: |-
      Indien, gelet op het koninklijk besluit, het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan bij de toepassing van [artikel 39e][ref1] niet over beleidsvrijheid
      beschikt, kan het koninklijk besluit bepalen dat het in de plaats treedt van het vernietigde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel39e
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 39e
        hoofdstuk: I
        afdeling: '4'
  - number: 39c.3
    text: |-
      In het koninklijk besluit kan worden bepaald dat ter zake van het vernietigde besluit geen nieuw besluit wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39c
  - number: 39c.4
    text: |-
      In het koninklijk besluit kan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan een aanwijzing worden gegeven over de uitvoering van het koninklijk
      besluit. De artikelen 32b tot en met 32j zijn van overeenkomstige toepassing ingeval de aanwijzing niet wordt
      opgevolgd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39c
  - number: 39c.5
    text: |-
      Indien het koninklijk besluit betrekking heeft op de vernietiging van een algemeen verbindend voorschrift of een
      ander besluit van algemene strekking, kan worden bepaald dat de vernietiging tevens betrekking heeft op besluiten
      die zijn genomen op grond van of ter uitvoering van het algemeen verbindend voorschrift of het andere besluit van
      algemene strekking.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39c
  - number: 39d
    text: |-
      Het koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in de
      Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39d
  - number: 39e.1
    text: |-
      Het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie onderscheidenlijk het
      gemeenschappelijk orgaan neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij
      met het koninklijk besluit wordt rekening gehouden, tenzij in het koninklijk besluit toepassing is gegeven aan
      [artikel 39c, tweede of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel39c
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 39c
        hoofdstuk: I
        afdeling: '4'
  - number: 39e.2
    text: |-
      In het koninklijk besluit kan een termijn worden gesteld waarbinnen toepassing wordt gegeven aan het eerste
      lid. De [artikelen 32b tot en met 32j][ref1] zijn van overeenkomstige toepassing ingeval niet binnen de termijn
      toepassingen is gegeven aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 39f
    text: |-
      In afwijking van [artikel 8:4, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1] kan een
      belanghebbende tegen een koninklijk besluit als bedoeld in [artikel 36, eerste lid][ref2], beroep instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel36
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel39f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '36'
        hoofdstuk: I
        afdeling: '4'
  - number: '40.1'
    text: |-
      Provinciale staten, gedeputeerde staten en de commissarissen van de Koning van twee of meer provincies kunnen
      afzonderlijk of tezamen, ieder voor zover zij voor de eigen provincie bevoegd zijn, een gemeenschappelijke regeling
      treffen ter behartiging van een of meer bepaalde belangen van die provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel40
  - number: '40.2'
    text: |-
      De colleges van gedeputeerde staten en de commissarissen van de Koning gaan niet over tot het treffen van een
      regeling dan na verkregen toestemming van provinciale staten. De toestemming kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel40
  - number: '40.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel40
  - number: '41.1'
    text: |-
