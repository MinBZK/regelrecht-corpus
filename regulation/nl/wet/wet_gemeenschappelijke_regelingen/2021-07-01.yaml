  - number: 41.1.k
    text: |-
      bij de toepassing van [artikel 26, eerste en tweede lid][ref1], voor «gemeentebestuur» wordt gelezen
      «provinciebestuur», voor «gemeente» wordt gelezen «provincie», voor «gemeenten» wordt gelezen «provincies» en voor
      «gemeenteblad» wordt gelezen «provinciaal blad».


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel26
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '26'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '2'
  - number: '41.2'
    text: |-
      Wanneer is gehandeld in strijd met het eerste lid juncto [artikel 20, eerste lid][ref1], is
      [artikel X 7, eerste tot en met vijfde lid, van de Kieswet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_7
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_7
  - number: '43.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of aan het gemeenschappelijk orgaan
      kunnen bij de regeling ten aanzien van de belangen ter behartiging waarvan zij wordt getroffen en voor het gebied
      waarvoor zij geldt, zodanige bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de
      deelnemende provincies toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel43
  - number: 43.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere belastingen te heffen
      dan de belasting, bedoeld in [artikel 222][ref1], de rechten, bedoeld in [artikel 223 van de Provinciewet][ref2],
      en de rechten waarvan de heffing krachtens bijzondere wetten geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel223
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 222c
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '223'
  - number: 43.1.b
    text: |-
      aan het gemeenschappelijk orgaan of de bedrijfsvoeringsorganisatie niet de bevoegdheid kan worden overgedragen
      belastingen te heffen of anderszins algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel43
  - number: '43.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende provincies geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel43
  - number: '43.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemende provincie, regelt eerstbedoelde verordening de onderlinge verhouding. Zij kan bepalen, dat de
      verordening der provincie voor het gehele gebied, dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt
      te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel43
  - number: '44'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam of de
      bedrijfsvoeringsorganisatie van rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel44
  - number: 44a.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie besluit slechts
      tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen, verenigingen, coöperaties
      en onderlinge waarborgmaatschappijen, indien de regeling in deze mogelijkheid voorziet en dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel44a
  - number: 44a.2
    text: |-
      Het besluit wordt niet genomen dan nadat provinciale staten van de deelnemende provincies een ontwerpbesluit is
      toegezonden en in de gelegenheid zijn gesteld hun wensen en bedenkingen ter kennis van het algemeen bestuur van het
      openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie te brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel44a
  - number: '45'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges of ambtenaren de
      bevoegdheden, bedoeld in [hoofdstuk XV van de Provinciewet][ref1], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: 45a.1
    text: |-
      De [artikelen 32a][ref1], [32b][ref2] en [32e tot met 32i][ref3] zijn van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel32e
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: 32e
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 45a.1.a
    text: voor «gedeputeerde staten» wordt gelezen «Onze Minister die het aangaat»;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45a
  - number: 45a.1.b
    text: voor «de Gemeentewet» wordt gelezen «de Provinciewet»;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45a
  - number: 45a.1.c
    text: voor «de deelnemende gemeenten» wordt gelezen «de deelnemende provincies»;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45a
  - number: 45a.1.d
    text: voor «de raden van de deelnemende gemeenten» wordt gelezen «provinciale staten van de deelnemende provincies»;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45a
  - number: 45a.1.e
    text: |-
      voor «Gedeputeerde staten onderscheidenlijk Onze Minister die het aangaat kunnen» wordt gelezen «Onze Minister die
      het aangaat kan».
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45a
  - number: 45a.2
    text: |-
      Indien meer dan één van Onze Ministers overwegen ten aanzien van hetzelfde openbaar lichaam dan wel
      gemeenschappelijk orgaan in met elkaar samenhangende beslissingen, handelingen of resultaten toepassing te
      geven aan [artikel 32b, eerste lid][ref1], kunnen zij hun bevoegdheden op grond van dit artikel aan een van hen
      overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 45b
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      kunnen regels worden gesteld over de verstrekking van systematische informatie aan Onze Minister die het aangaat,
      betreffende de uitvoering door het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie
      onderscheidenlijk het gemeenschappelijk orgaan van de andere wet dan de Provinciewet. Bij ministeriële regeling
      kunnen nadere regels worden gesteld omtrent de toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel45b
  - number: '46'
    text: |-
      De bevoegdheden die bij de regeling worden overgedragen, berusten bij het algemeen bestuur, tenzij bij wet of in de
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46
  - number: 46a.1
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden van het algemeen bestuur overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
  - number: 46a.2
    text: 'Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
  - number: 46a.2.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 47][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel47
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '47'
        hoofdstuk: II
        paragraaf: '7'
        afdeling: '3'
  - number: 46a.2.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 43, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel43
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '43'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 46a.2.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
  - number: 46a.3
    text: |-
      De [artikelen 45c][ref1] en [45d][ref2] zijn van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel45c
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel45d
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 45c
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 45d
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '3'
  - number: 46a.4
    text: |-
      In afwijking van [artikel 10:16, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het algemeen bestuur
      beperkingen stellen aan de uitoefening van de overgedragen bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 46a.5
    text: |-
      Ten aanzien van de bevoegdheden die met toepassing van het eerste lid zijn overgedragen, zijn de regels die bij of
      krachtens de wet zijn gesteld met betrekking tot de uitoefening daarvan en het toezicht daarop van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46a
  - number: 46b.1
    text: 'Het dagelijks bestuur is in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46b
  - number: 46b.1.a
    text: |-
      het dagelijks bestuur van het openbaar lichaam te voeren, voor zover niet bij of krachtens de wet of de regeling
      het algemeen bestuur hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46b
  - number: 46b.1.b
    text: beslissingen van het algemeen bestuur voor te bereiden en uit te voeren;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46b
  - number: 46b.1.c
    text: regels vast te stellen over de ambtelijke organisatie van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46b
  - number: 46b.1.d
    text: |-
      tot privaatrechtelijke rechtshandelingen van het openbaar lichaam te besluiten, met uitzondering van
      privaatrechtelijke rechtshandelingen als bedoeld in [artikel 44a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel44a
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 44a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 46b.1.e
    text: |-
      te besluiten namens het openbaar lichaam, het dagelijks bestuur of het algemeen bestuur rechtsgedingen,
      bezwaarprocedures of administratief beroepsprocedures te voeren of handelingen ter voorbereiding daarop te
      verrichten, tenzij het algemeen bestuur, voor zover het het algemeen bestuur aangaat, in voorkomende gevallen
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46b
  - number: 46b.2
    text: |-
      Het dagelijks bestuur neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46b
  - number: 46c
    text: |-
      Het dagelijks bestuur kan een of meer leden van het dagelijks bestuur machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46c
  - number: 46d.1
    text: De voorzitter vertegenwoordigt het openbaar lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46d
  - number: 46d.2
    text: De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel46d
  - number: '47.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47
  - number: '47.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de begroting binnen twee weken na de vaststelling, doch in ieder geval vóór 1
      augustus van het jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47
  - number: '47.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de jaarrekening vast in het jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47
  - number: '47.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de jaarrekening binnen twee weken na de vaststelling, doch in ieder geval vóór 15
      juli van het jaar volgende op het jaar waarop de jaarrekening betrekking heeft, aan Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47
  - number: 47a.1
    text: |-
      Indien het openbaar lichaam de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan een specifieke uitkering
      als bedoeld in [artikel 15a van de Financiële-verhoudingswet][ref1], ontvangt van het Rijk of middelen ontvangt
      van de deelnemende provincies, die afkomstig zijn uit een specifieke uitkering, zijn de [artikelen 17a][ref2]
      en [17b van de Financiële-verhoudingswet][ref3] op de informatie ten behoeve van de verantwoording over
      deze middelen, van overeenkomstige toepassing op het openbaar lichaam de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 15a
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0008290
        artikel: 17b
  - number: 47a.1.a
    text: |-
      voor gedeputeerde staten en het college van burgemeester en wethouders wordt gelezen: het dagelijks bestuur van het
      openbaar lichaam of het bestuur de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47a
  - number: 47a.1.b
    text: |-
      de in [artikel 17b, derde lid, van de Financiële-verhoudingswet][ref1] bedoelde opschorting betrekking heeft op
      de betalingen op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref2] aan de provincies die aan de
      regeling deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17b
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '15'
  - number: 47a.2
    text: |-
      De ingevolge [artikel 190, tweede lid, aanhef en onder b, en derde lid, van de Provinciewet][ref1] gestelde regels,
      alsmede het vierde tot en met het achtste lid van dat artikel, zijn van overeenkomstige toepassing op het openbaar
      lichaam de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
  - number: 47a.2.a
    text: |-
      voor gedeputeerde staten wordt gelezen: het dagelijks bestuur van het openbaar lichaam of het bestuur de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47a
  - number: 47a.2.b
    text: |-
      de in [artikel 190, achtste lid, van de Provinciewet][ref1] bedoelde opschorting betrekking heeft op de betalingen
      op grond van [artikel 15, eerste lid, Financiële-verhoudingswet][ref2] aan de provincies die aan de regeling
      deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel15
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '15'
  - number: 47b
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt vóór 15 april van het jaar voorafgaande aan dat waarvoor de begroting dient, de
      algemene financiële en beleidsmatige kaders en de voorlopige jaarrekening aan provinciale staten van de deelnemende
      provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel47b
  - number: '48.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de ontwerpbegroting acht weken voordat zij aan het algemeen bestuur wordt
      aangeboden, onderscheidenlijk acht weken voordat zij door het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan provinciale staten van de deelnemende provincies.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel48
  - number: '48.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de besturen van de deelnemende provincies voor een ieder ter inzage
      gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel48
  - number: '48.3'
    text: |-
      Provinciale staten van de deelnemende provincies kunnen bij het dagelijks bestuur van het openbaar lichaam, het
      bestuur van de bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de
      ontwerp-begroting naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat
      bij de ontwerp-begroting, zoals deze aan het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel48
  - number: '48.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie, onderscheidenlijk het gemeenschappelijk orgaan, zo nodig, de begroting aan provinciale
      staten der deelnemende provincies, die ter zake bij Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties hun
      zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel48
  - number: '48.5'
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel48
  - number: '48.6'
    text: |-
      De [artikelen 190 tot en met 219 van de Provinciewet][ref1] zijn van overeenkomstige toepassing, voor zover daarvan
      bij of krachtens deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
  - number: '49'
    text: |-
      Op een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het bestuur van het
