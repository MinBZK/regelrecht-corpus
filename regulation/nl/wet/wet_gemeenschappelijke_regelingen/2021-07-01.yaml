    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '20'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_7
  - number: '76.1'
    text: |-
      Aan het bestuur van het openbaar lichaam of van de bedrijfsvoeringsorganisatie of aan het gemeenschappelijk orgaan
      kunnen bij de regeling ten aanzien van de belangen ter behartiging waarvan zij is getroffen en voor het gebied
      waarvoor zij geldt, zodanige bevoegdheden van regeling en bestuur worden overgedragen, als aan de besturen van
      de deelnemende gemeenten en provincies en van de deelnemende waterschappen met betrekking tot hun eigen gemeente,
      provincie, onderscheidenlijk waterschap toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel76
  - number: 76.1.a
    text: |-
      aan het bestuur van het openbaar lichaam niet de bevoegdheid kan worden overgedragen andere
      belastingen te heffen dan de belasting, bedoeld in [artikel 222c van de Provinciewet][ref1],
      de rioolheffing, bedoeld in [artikel 228a van de Gemeentewet][ref2], de rechten, bedoeld in
      [artikel 229, eerste lid, onder a en b, van de Gemeentewet][ref3], [artikel 223 van de Provinciewet][ref4] en
      [artikel 115 van de Waterschapswet][ref5] en de rechten waarvan de heffing krachtens bijzondere wetten geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel222c
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel228a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel223
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel115
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 222c
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 228a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '229'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '223'
      - id: ref5
        bwb_id: BWBR0005108
        artikel: '115'
  - number: 76.1.b
    text: |-
      aan het gemeenschappelijk orgaan of de bedrijfsvoeringsorganisatie niet de bevoegdheid kan worden overgedragen
      belastingen te heffen of anderszins algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel76
  - number: '76.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende gemeenten en provincies en van de deelnemende waterschappen
      geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel76
  - number: '76.3'
    text: |-
      Voor zover een verordening van het openbaar lichaam voorziet in hetzelfde onderwerp als een verordening van een
      deelnemende gemeente of provincie, of van een deelnemend waterschap, regelt eerstbedoelde verordening de onderlinge
      verhouding. Zij kan bepalen, dat de verordening van de gemeente, de provincie of het waterschap, voor het gehele
      gebied, dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel76
  - number: '77'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het openbaar lichaam of de
      bedrijfsvoeringsorganisatie van rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel77
  - number: 77a.1
    text: |-
      Het algemeen bestuur van het openbaar lichaam of het bestuur van de bedrijfsvoeringsorganisatie besluit slechts
      tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen, verenigingen, coöperaties
      en onderlinge waarborgmaatschappijen, indien de regeling in deze mogelijkheid voorziet en dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel77a
  - number: 77a.2
    text: |-
      Het besluit wordt niet genomen dan nadat de raden van de deelnemende gemeenten, provinciale staten van de
      deelnemende provincies en de algemene besturen van de deelnemende waterschappen een ontwerpbesluit is toegezonden
      en in de gelegenheid zijn gesteld hun wensen en bedenkingen ter kennis van het algemeen bestuur van het openbaar
      lichaam of het bestuur van de bedrijfsvoeringsorganisatie te brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel77a
  - number: '78'
    text: |-
      Een verordening van het openbaar lichaam tot heffing van een belasting regelt, voor welke colleges
      of ambtenaren de bevoegdheden, bedoeld in [hoofdstuk XV van de Gemeentewet][ref1] en die bedoeld in
      [hoofdstuk XV van de Provinciewet][ref2] en [hoofdstuk XVIII van de Waterschapswet][ref3], zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
      [ref3]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005645
        hoofdstuk: XV
      - id: ref3
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: 78a.1
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of
      het gemeenschappelijk orgaan mede door de besturen van de deelnemende provincies zijn overgedragen, zijn daarop de
      [artikelen 45a][ref1] en [45b][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel45b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 45a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 45b
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '3'
  - number: 78a.2
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten zijn overgedragen, zijn
      daarop de [artikelen 32a tot en met 32j][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel32b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 32b
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '3'
  - number: 78a.3
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen, is
      daarop [artikel 50da][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50da
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50da
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '79'
    text: |-
      De bevoegdheden die bij de regeling worden overgedragen, berusten bij het algemeen bestuur, tenzij bij wet of in de
      regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79
  - number: 79a.1
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden van het algemeen bestuur overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
  - number: 79a.2
    text: 'Het algemeen bestuur kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
  - number: 79a.2.a
    text: |-
      het vaststellen van de begroting of van de jaarrekening, bedoeld in [artikel 80][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel80
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '80'
        hoofdstuk: VI
        paragraaf: '7'
        afdeling: '3'
  - number: 79a.2.b
    text: |-
      het heffen van rechten, bedoeld in [artikel 76, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel76
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '3'
  - number: 79a.2.c
    text: het vaststellen van verordeningen door strafbepaling of bestuursdwang te handhaven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
  - number: 79a.3
    text: |-
      De [artikelen 78b][ref1] en [78c][ref2] zijn van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel78b
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel78c
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 78b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: 78c
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '3'
  - number: 79a.4
    text: |-
      In afwijking van [artikel 10:16, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het algemeen bestuur
      beperkingen stellen aan de uitoefening van de overgedragen bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 79a.5
    text: |-
      Ten aanzien van de bevoegdheden die met toepassing van het eerste lid zijn overgedragen, zijn de regels die bij of
      krachtens de wet zijn gesteld met betrekking tot de uitoefening daarvan en het toezicht daarop van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79a
  - number: 79b.1
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam mede door de besturen van de deelnemende provincies
      of uitsluitend door de besturen van de deelnemende gemeenten zijn overgedragen, is [artikel 33b][ref1] van
      toepassing op het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel33b
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 33b
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '3'
  - number: 79b.2
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam uitsluitend door de besturen van de deelnemende
      waterschappen zijn overgedragen, is [artikel 50eb][ref1] van toepassing op het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50eb
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50eb
        hoofdstuk: III
        paragraaf: '5'
        afdeling: '3'
  - number: 79c
    text: |-
      Het dagelijks bestuur kan een of meer leden van het dagelijks bestuur machtigen tot uitoefening van een of meer van
      zijn bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79c
  - number: 79d.1
    text: De voorzitter vertegenwoordigt het openbaar lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79d
  - number: 79d.2
    text: De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel79d
  - number: '80.1'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel80
  - number: '80.2'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de begroting binnen twee weken na de vaststelling, doch in ieder geval vóór 1
      augustus van het jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel80
  - number: '80.3'
    text: |-
      Het algemeen bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan stelt de jaarrekening vast in het jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel80
  - number: '80.4'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de jaarrekening binnen twee weken na de vaststelling, doch in ieder geval vóór 15
      juli van het jaar volgende op het jaar waarop de jaarrekening betrekking heeft, aan Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel80
  - number: 80a
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt vóór 15 april van het jaar voorafgaande aan dat waarvoor de begroting dient,
      de algemene financiële en beleidsmatige kaders en de voorlopige jaarrekening aan de raden van de deelnemende
      gemeenten, aan provinciale staten van de deelnemende provincies en aan de algemene besturen van de deelnemende
      waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel80a
  - number: '81.1'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan zendt de ontwerpbegroting acht weken voordat zij aan het algemeen bestuur wordt
      aangeboden, onderscheidenlijk acht weken voordat zij door het bestuur van de bedrijfsvoeringsorganisatie of het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de raden van de deelnemende gemeenten, aan provinciale staten
      van de deelnemende provincies en aan de algemene besturen van de deelnemende waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel81
  - number: '81.2'
    text: |-
      De ontwerp-begroting wordt door de zorg van de deelnemende gemeenten, provincies en waterschappen voor een ieder
      ter inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel81
  - number: '81.3'
    text: |-
      De raden van de deelnemende gemeenten, provinciale staten van de deelnemende provincies en de algemene besturen
      van de deelnemende waterschappen kunnen bij het dagelijks bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerp-begroting
      naar voren brengen. Het dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerp-
      begroting, zoals deze aan het algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel81
  - number: '81.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie, onderscheidenlijk het gemeenschappelijk orgaan, zo nodig, de begroting aan de raden
      van de deelnemende gemeenten, aan provinciale staten van de deelnemende provincies en aan de algemene besturen
      van de deelnemende waterschappen die ter zake bij Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties hun
      zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel81
  - number: '81.5'
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel81
  - number: '81.6'
    text: |-
      De [artikelen 190 tot en met 219 van de Provinciewet][ref1] zijn van overeenkomstige toepassing, voor zover daarvan
      bij of krachtens deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
  - number: '81.7'
    text: |-
      In afwijking van het zesde lid zijn de [artikelen 99 tot en met 109c van de Waterschapswet][ref1] van
      overeenkomstige toepassing, voor zover daarvan bij of krachtens deze wet niet is afgeweken, indien uitsluitend
      door de besturen van de deelnemende waterschappen bevoegdheden zijn overgedragen aan het openbaar lichaam, de
      bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel99
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '99'
  - number: '82.1'
    text: |-
      Indien de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan mede door de besturen van de deelnemende provincies zijn overgedragen, is daarop
      artikel 49 van toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel82
  - number: '82.2'
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende gemeenten zijn overgedragen, zijn
      daarop de [artikelen 36 tot en met 39f][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel36
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '36'
        hoofdstuk: I
        afdeling: '4'
  - number: '82.3'
    text: |-
      Voor zover de bevoegdheden van het bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie
      of het gemeenschappelijk orgaan uitsluitend door de besturen van de deelnemende waterschappen zijn overgedragen,
      zijn daarop de [artikelen 50h tot en met 50k][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel50h
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: 50h
        hoofdstuk: III
        afdeling: '4'
  - number: '83.1'
    text: |-
      Provinciale staten, de colleges van gedeputeerde staten en de commissarissen van de Koning van een of meer
      provincies kunnen, afzonderlijk of tezamen, met de algemene besturen, de dagelijkse besturen en de voorzitters van
      een of meer waterschappen, ieder voor zover zij voor de eigen provincie, onderscheidenlijk het eigen waterschap
      bevoegd zijn, een gemeenschappelijke regeling treffen ter behartiging van een of meer bepaalde belangen van die
      provincies of waterschappen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel83
  - number: '83.2'
    text: |-
      Een college van gedeputeerde staten en een commissaris van de Koning, onderscheidenlijk een dagelijks bestuur en
      een voorzitter van een waterschap gaan niet over tot het treffen van een regeling dan na verkregen toestemming van
      provinciale staten, onderscheidenlijk het algemeen bestuur van het waterschap. De toestemming kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel83
  - number: '83.3'
    text: |-
      Onder het treffen van een regeling wordt in dit artikel mede verstaan het wijzigen van, het toetreden tot en het
      uittreden uit een regeling.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel83
