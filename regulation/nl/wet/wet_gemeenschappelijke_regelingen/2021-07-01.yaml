  - number: '127.1'
    text: |-
      [Artikel 16 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] is van overeenkomstige toepassing
      op een lid van het bestuur van het samenwerkingslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
  - number: '127.2'
    text: |-
      Ten aanzien van een lid van het gemeenschappelijk orgaan is [artikel 16, eerste lid, onder ][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
  - number: '127.3'
    text: |-
      Wanneer is gehandeld in strijd met het eerste lid, is
      [artikel X 8, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_8
  - number: '128.1'
    text: |-
      De artikelen 17, 18, 20, 21, 23, 27, 29, 30, 31, 32, 33, 34 en 35 van de Wet openbare lichamen Bonaire, Sint
      Eustatius en Saba zijn, voor zover daarvan bij deze wet niet is afgeweken, op het houden en de orde van de
      vergaderingen van het algemeen bestuur van het samenwerkingslichaam van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
  - number: '128.2'
    text: |-
      Het algemeen bestuur van het samenwerkingslichaam en het gemeenschappelijk orgaan vergaderen jaarlijks tenminste
      tweemaal.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
  - number: '128.3'
    text: |-
      De vergaderingen van het algemeen bestuur zijn openbaar. De deuren worden gesloten wanneer een vijfde gedeelte der
      aanwezige leden daarom verzoekt of de voorzitter het nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
  - number: '128.4'
    text: Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
  - number: '128.5'
    text: |-
      De voorzitter kan vervolgens alsnog besluiten dat de vergadering in het openbaar wordt gehouden indien hij dit in
      het kader van het openbaar belang nodig acht.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
  - number: '128.6'
    text: |-
      Het algemeen bestuur regelt op welke wijze ambtelijke bijstand wordt verleend aan de leden van het algemeen
      bestuur.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
  - number: '128.7'
    text: |-
      Het eerste tot en met zesde lid en [artikel 23, eerste lid][ref1], zijn van overeenkomstige toepassing op het
      gemeenschappelijk orgaan, indien de regeling is getroffen of mede is getroffen door eilandsraden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel23
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '128.8'
    text: |-
      De artikelen 62, 63, 64, 65, 67, 68, 69, 70, 71 en 72 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba
      en [artikel 23, eerste lid][ref1], van deze wet zijn, voor zover bij deze wet niet is afgeweken, op het houden
      en de orde van de vergaderingen van het gemeenschappelijk van overeenkomstige toepassing, indien de regeling
      uitsluitend is getroffen door bestuurscolleges of gezaghebbers.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel23
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '23'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '2'
  - number: '129.1'
    text: |-
      Geschillen omtrent de toepassing, in de ruimste zin, van een regeling tussen besturen van deelnemende
      openbare lichamen of tussen besturen van een of meer deelnemende openbare lichamen en het bestuur van het
      samenwerkingslichaam of het gemeenschappelijk orgaan worden door de Rijksvertegenwoordiger beslist, voor zover zij
      niet behoren tot die, vermeld in [artikel 112, eerste lid, van de Grondwet][ref1] of tot die, waarvan de beslissing
      krachtens artikel 112, tweede lid, van de Grondwet is opgedragen hetzij aan de rechterlijke macht, hetzij aan
      gerechten die niet tot de rechterlijke macht behoren. In eerste en enige aanleg wordt het geschil voorgelegd aan
      het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel112
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '112'
  - number: '129.2'
    text: |-
      De Rijksvertegenwoordiger kan bij de beslissing van het geschil het desbetreffende bestuur opdragen een besluit te
      nemen met inachtneming van het in hun beslissing bepaalde en binnen een daartoe te stellen termijn. Indien binnen
      de gestelde termijn het besluit niet is genomen, geschiedt dit door de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel129
  - number: '129.3'
    text: |-
      In spoedeisende gevallen kan de Rijksvertegenwoordiger bij de beslissing van het geschil in de plaats van het
      desbetreffende bestuur een besluit als bedoeld in het tweede lid nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel129
  - number: '130.1'
    text: |-
      Aan het bestuur van het samenwerkingslichaam of aan het gemeenschappelijk orgaan kunnen bij de regeling ten aanzien
      van de belangen ter behartiging waarvan zij wordt getroffen, en voor het gebied waarvoor zij geldt, zodanige
      bevoegdheden van regeling en bestuur worden overgedragen als aan de besturen van de aan de regeling deelnemende
      openbare lichamen toekomen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel130
  - number: 130.1.a
    text: |-
      aan het bestuur van het samenwerkingslichaam niet de bevoegdheid kan worden overgedragen andere belastingen te
      heffen dan de belasting, bedoeld in artikel 60 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius
      en Saba, de rechten bedoeld in artikel 62 van de Wet financiën Bonaire, Sint Eustatius en Saba en de rechten
      waarvan de heffing krachtens andere wetten dan de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba
      geschiedt;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel130
  - number: 130.1.b
    text: |-
      aan het gemeenschappelijk orgaan niet de bevoegdheid kan worden overgedragen belastingen te heffen of anderszins
      algemeen verbindende voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel130
  - number: '130.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid wordt daarbij tevens de verhouding van de overgedragen
      bevoegdheden tot die van de besturen van de deelnemende openbare lichamen geregeld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel130
  - number: '130.3'
    text: |-
      Voor zover een verordening van het samenwerkingslichaam voorziet in hetzelfde onderwerp als een verordening van
      een deelnemend openbaar lichaam Bonaire, Sint Eustatius of Saba, regelt eerstbedoelde verordening de onderlinge
      verhouding. Zij kan bepalen, dat de verordening van een van de openbare lichamen Bonaire, Sint Eustatius of Saba
      voor het gehele gebied dan wel voor een gedeelte daarvan geheel of gedeeltelijk ophoudt te gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel130
  - number: '131'
    text: |-
      Bij de regeling kunnen beperkingen worden aangebracht in de bevoegdheden die het samenwerkingslichaam van
      rechtswege bezit om aan het maatschappelijk verkeer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel131
  - number: '132'
    text: |-
      Een verordening van het samenwerkingslichaam tot heffing van een belasting regelt voor welke bestuurscolleges of
      ambtenaren de bevoegdheden, bedoeld in hoofdstuk IV van de Wet financiën openbare lichamen Bonaire, Sint Eustatius
      en Saba, zullen gelden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel132
  - number: '133.1'
    text: |-
      Ten aanzien van de bevoegdheden van het bestuur van het samenwerkingslichaam of die van het gemeenschappelijk
      orgaan zijn van overeenkomstige toepassing de regels, in de ruimste zin, welke bij of krachtens de wet zijn
      gesteld voor de verdeling van de bevoegdheden van de eilandsbesturen over de eilandelijke bestuursorganen, voor
      de uitoefening van die bevoegdheden, alsmede voor het toezicht daarop. Dit geldt niet voor zover daarvan bij of
      krachtens deze wet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel133
  - number: '133.2'
    text: |-
      De besturen van de deelnemende openbare lichamen kunnen bij de regeling beperkingen aanbrengen in de bevoegdheden
      die door het bestuur van het samenwerkingslichaam onderscheidenlijk het gemeenschappelijk orgaan zouden kunnen
      worden ontleend aan de regelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel133
  - number: '133.3'
    text: |-
      Voor bij algemene maatregel van bestuur aan te geven categorieën van gevallen, waarin inachtneming van bepaalde
      regels, bedoeld in het eerste lid, onevenredig belastend zou zijn in verhouding tot het met die regels beoogde doel
      kunnen bij die maatregel daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel133
  - number: '134.1'
    text: |-
      Het algemeen bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan stelt de begroting vast in het
      jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel134
  - number: '134.2'
    text: |-
      Het algemeen bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan stelt de jaarrekening vast in het
      jaar volgende op het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel134
  - number: '134.3'
    text: |-
      Het dagelijks bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan zendt de jaarrekening binnen
      twee weken na de vaststelling, doch in ieder geval vóór 15 juli van het jaar volgende op het jaar waarop de
      jaarrekening betrekking heeft aan het College financieel toezicht Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel134
  - number: '135.1'
    text: |-
      Het dagelijks bestuur van het samenwerkingslichaam of het gemeenschappelijk orgaan zendt de ontwerpbegroting zes
      weken voordat zij aan het algemeen bestuur wordt aangeboden, onderscheidenlijk zes weken voordat zij door het
      gemeenschappelijk orgaan wordt vastgesteld, toe aan de eilandsraden van de deelnemende openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel135
  - number: '135.2'
    text: |-
      De ontwerpbegroting wordt door de zorg van de besturen van de deelnemende openbare lichamen voor een ieder ter
      inzage gelegd en, tegen betaling van de kosten, algemeen verkrijgbaar gesteld. Artikel 18, eerste lid, van de Wet
      financiën openbare lichamen Bonaire, Sint Eustatius en Saba is van overeenkomstige toepassing, met dien verstande
      dat voor «eilandsraad» wordt gelezen «algemeen bestuur».
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel135
  - number: '135.3'
    text: |-
      De eilandsraden van de deelnemende openbare lichamen kunnen bij het dagelijks bestuur van het samenwerkingslichaam
      onderscheidenlijk het gemeenschappelijk orgaan hun zienswijze over de ontwerpbegroting naar voren brengen. Het
      dagelijks bestuur voegt de commentaren waarin deze zienswijze is vervat bij de ontwerpbegroting, zoals deze aan het
      algemeen bestuur wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel135
  - number: '135.4'
    text: |-
      Nadat deze is vastgesteld, zendt het algemeen bestuur van het samenwerkingslichaam onderscheidenlijk het
      gemeenschappelijk orgaan, zo nodig, de begroting aan de raden van de deelnemende openbare lichamen, die ter zake
      bij het College financieel toezicht Bonaire, Sint Eustatius en Saba hun zienswijze naar voren kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel135
  - number: '135.5'
    text: |-
      Het eerste, derde en vierde lid zijn van toepassing op besluiten tot wijziging van de begroting. In de
      gemeenschappelijke regeling kan worden bepaald ten aanzien van welke categorieën begrotingswijzigingen hiervan kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel135
  - number: '136.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een openbaar elektronisch register in stand van
      krachtens deze wet getroffen regelingen.
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: '136.2'
    text: 'In het register wordt van iedere regeling in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: 136.2.a
    text: de deelnemende bestuursorganen en de datum van hun toetreding;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: 136.2.b
    text: de openbare lichamen waarvan de deelnemende bestuursorganen onderdeel uitmaken;
    url: https://wetten.overheid.nl/BWBR0003740/2021-07-01#Artikel136
  - number: 136.2.c
    text: |-
      het bestuursorgaan, bedoeld in [artikel 26, tweede lid][ref1], [artikel 41, eerste lid][ref2],
      [artikel 50a, eerste lid][ref3], [artikel 52, eerste lid][ref4], [artikel 62][ref5],
      [artikel 74, eerste lid][ref6], of [artikel 84, eerste lid][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel50a
