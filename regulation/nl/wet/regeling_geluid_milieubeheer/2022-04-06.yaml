        bwb_id: BWBR0031477
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0031712
  - number: '11.1'
    text: |-
      De maatregelpunten van de geluidbeperkende maatregelen, bedoeld in [artikel 31 van het besluit][ref1], worden
      bepaald overeenkomstig tabel 1 of 2 van [bijlage 3][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0031712
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0031712
  - number: '11.2'
    text: |-
      De maatregelpunten, bedoeld in het eerste lid, omvatten het totaal van de maatregelpunten van bestaande en nieuw te
      treffen geluidbeperkende maatregelen, ten opzichte van een weg of spoorweg in de situatie zonder maatregelen.
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel11
  - number: '11.3'
    text: |-
      Bij het toepassen van tabel 2 van [bijlage 3][ref1] bij deze regeling wordt de hoogte van een afschermend object
      bepaald ten opzichte van de bovenkant van het spoor of de kantstreep van de weg aan de zijde van het afschermend
      object.


      [ref1]: https://wetten.overheid.nl/BWBR0031712
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031712
  - number: '11.4'
    text: |-
      In afwijking van het tweede lid worden bij toepassing van [artikel 11.56 van de wet][ref1] maatregelpunten van een
      bronmaatregel die feitelijk is gerealiseerd of waartoe is besloten door de minister of de beheerder met het oog op
      naleving van de geluidproductieplafonds, maar die niet is opgenomen in het geluidregister, niet meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '12'
    text: |-
      Het geluidregister, bedoeld in [artikel 11.25 van de wet][ref1], bevat naast de in het derde lid van dat artikel
      genoemde gegevens, mede:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 12.a
    text: de ligging van de referentiepunten vastgelegd door middel van rijksdriehoekcoördinaten;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel12
  - number: 12.b
    text: een aanduiding of de sanering van de betreffende weg of spoorweg is afgerond.
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel12
  - number: '13'
    text: De Minister voor Infrastructuur en Milieu draagt zorg voor een openbaar toegankelijk geluidregister.
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel13
  - number: '14.1'
    text: De Minister voor Infrastructuur en Milieu draagt zorg voor een kwaliteitsplan voor het geluidregister.
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel14
  - number: '14.2'
    text: 'Een kwaliteitsplan als bedoeld in het eerste lid bevat ten minste een beschrijving van de procedures voor:'
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel14
  - number: 14.2.a
    text: het actualiseren van de gegevens in het geluidregister;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel14
  - number: 14.2.b
    text: de vindbaarheid van de gegevens in het geluidregister;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel14
  - number: 14.2.c
    text: |-
      het binnen redelijke termijn reageren op verzoeken met betrekking tot het geluidregister of de daarin opgenomen
      gegevens;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel14
  - number: 14.2.d
    text: |-
      het corrigeren van gegevens in het geluidregister, niet zijnde brongegevens als bedoeld in
      [artikel 11.1 van de wet][ref1] of gegevens die van invloed zijn op de hoogte van de geluidproductieplafonds, die
      kennelijk foutief zijn overgenomen uit de aan het geluidregister ten grondslag liggende documenten of bestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '15'
    text: |-
      Als categorieën van geluidsbronnen als bedoeld in [artikel 11.30, vijfde lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 15.a
    text: wegen;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel15
  - number: 15.b
    text: spoorwegen;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel15
  - number: 15.c
    text: |-
      industrieterreinen als bedoeld in [artikel 40][ref1] of [52 van de Wet geluidhinder][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel52
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '52'
  - number: 15.d
    text: |-
      luchthavens als bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: '16'
    text: |-
      Een onderzoek naar de effecten van samenloop als bedoeld in
      [artikel 11.33, zevende lid, onderdeel c, van de wet][ref1] kan in elk geval achterwege blijven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 16.a
    text: |-
      de geluidsbelasting als gevolg van vaststelling van het geluidproductieplafond vanwege de weg of spoorweg niet
      hoger wordt dan de waarde, bedoeld in [artikel 11.30, eerste lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 16.b
    text: |-
      de geluidsbelasting als gevolg van wijziging van het geluidproductieplafond vanwege de weg of spoorweg niet hoger
      wordt dan de waarde, bedoeld in [artikel 11.30, tweede lid, van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 16.c
    text: de geluidsbelasting vanwege de andere geluidsbron de voorkeurswaarde niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16
  - number: 16a
    text: |-
      Het gebied, bedoeld in [artikel 11.36, derde lid, van de wet][ref1] omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 16a.a
    text: |-
      wanneer het een besluit tot vaststelling of wijziging van een geluidproductieplafond betreft, de referentiepunten
      die zijn gelegen langs het deel van de weg of spoorweg waar de maatregel wordt getroffen en de referentiepunten
      gelegen binnen 1,0 kilometer van het voornoemde deel;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16a
  - number: 16a.b
    text: |-
      wanneer het een tracébesluit betreft, de referentiepunten die zijn gelegen langs de weg of spoorweg binnen
      de begrenzingen van het tracébesluit en de buiten deze begrenzingen gelegen referentiepunten waar de
      geluidproductieplafonds worden verlaagd;
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16a
  - number: 16a.c
    text: |-
      de referentiepunten die geen deel uitmaken van de referentiepunten, bedoeld in onderdeel a of b, en waarvoor
      de beheerder in het verzoek, bedoeld in [artikel 11.31, eerste lid, van de wet][ref1], of in de inlichtingen
      en gegevens, bedoeld in [artikel 11.34, van de wet][ref2], heeft onderbouwd dat de geluidproductieplafonds naar
      redelijke verwachting zullen worden overschreden als gevolg van de werkzaamheden aan de weg of spoorweg ter
      uitvoering van het besluit, bedoeld in onderdeel a of b.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '17'
    text: |-
      De [Regeling omgevingslawaai][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017035
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017035
  - number: '18'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________ in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0031679
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0031679
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Regeling geluid milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel19
