  - number: 4a
    text: |-
      De geluidsbelasting L en de geluidsbelasting L, beiden als gevolg van vliegtuiglawaai, worden bepaald
      overeenkomstig bijlage II van de [Richtlijn 2002/49/EG](32002L0049) van het Europees parlement en de Raad van
      25 juni 2002 inzake de evaluatie en beheersing van omgevingslawaai (PbEU 2002, L 189).
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel4a
  - number: '5.1'
    text: |-
      De opstelling van geluidsbelastingkaarten als bedoeld in [artikel 22 van het besluit][ref1] geschiedt in
      overeenstemming met het verplicht digitaal informatie-uitwisselingsmechanisme, dat door de Europese Commissie
      op 11 november 2021 is vastgesteld op grond van artikel 10, tweede lid, van de richtlijn omgevingslawaai, in
      combinatie met Bijlage IV, onderdeel 9, en Bijlage VI, onderdeel 3, van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel22
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031477
        artikel: '22'
  - number: '5.2'
    text: |-
      Om te voldoen aan het eerste lid van dit artikel en aan [artikel 11.9, tweede lid, van de wet][ref1] worden de
      geluidsbelastingkaarten aangeleverd aan de centrale voorziening geluidgegevens met gebruikmaking van het datamodel
      dat de European Environmental Agency daarvoor beschikbaar stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '6'
    text: |-
      Voor de toepassing van [hoofdstuk 3 van het besluit][ref1] wordt het aantal bewoners van woningen bepaald
      overeenkomstig de gemiddelde huishoudensgrootte volgens de meest recente publicatie van het Centraal Bureau voor
      de Statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031477
        hoofdstuk: '3'
  - number: '7'
    text: |-
      De in [artikel 8, eerste lid, van het besluit][ref1] bedoelde geografische kaarten bevatten een legenda waarin
      wordt verklaard hoe de informatie op die kaarten is weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel8
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel7
