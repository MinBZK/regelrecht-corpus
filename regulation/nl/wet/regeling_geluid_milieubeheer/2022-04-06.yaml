      - id: ref1
        bwb_id: BWBR0031477
        artikel: '8'
  - number: '8.1'
    text: |-
      Een verzoek om verstrekking van inlichtingen en gegevens als bedoeld in [artikel 11.7, eerste lid][ref1], en
      [artikel 11.16 van de wet][ref2] kan betrekking hebben op gegevens als vermeld in [bijlage 1][ref3], deel A, bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0031712
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0031712
  - number: '8.2'
    text: |-
