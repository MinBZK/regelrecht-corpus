preamble:
  text: |-
    Gelet op richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
    inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) en de artikelen 11.1, 11.5, 11.9, vierde lid,
    11.22, vijfde lid, 11.25, achtste lid, 11.30, vijfde lid, 11.33, zevende lid, onderdeel c, 11.51, tweede lid, en
    11.56, vijfde lid, van de Wet milieubeheer en de artikelen 21, 22, 23, tweede lid, 27 en 31, vierde en vijfde lid,
    van het Besluit geluid milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *afschermende objecten:* ter verbetering van de kwaliteit van het milieu
      direct langs een weg of spoorweg geplaatste wallen en schermen;
        - *besluit:* [Besluit geluid milieubeheer][ref1];
        - *bronregisterlijn:* lijn die betrekking heeft op een gedeelte van een weg of spoorweg en die bij bepaling van
      de geluidproductie volgens de in [bijlage V bij het Reken- en meetvoorschrift geluid 2012][ref2] beschreven regels
      wordt gebruikt als rijlijn of bronlijn als bedoeld in het [Reken- en meetvoorschrift geluid 2012][ref3];
        - *centrale voorziening geluidgegevens:* de digitale voorziening die door het Rijksinstituut voor Volksgezondheid
      en Milieu namens Onze Minister wordt beheerd en wordt geplaatst op [www.geluidgegevens.nl](onbekend);
        - *emissietraject:* gedeelte van een spoorweg waarop de geluidemissie constant kan worden verondersteld;
        - *etmaalperiode:* gedeelte van een etmaal, waarover het equivalent geluidsniveau wordt bepaald;
        - *plafondcorrectiewaarde:* getal waarmee de geluidemissie wordt vermeerderd met betrekking tot een daarbij
      aangegeven gedeelte van een weg of spoorweg ten behoeve van het bepalen van de geluidproductie dan wel de
      geluidsbelasting;
        - *rekeneenheid:* locomotief, treinstel, rijtuig of wagen, indien deze deel uitmaakt van het spoorvoertuigtype;
        - *spoorvoertuigtype:* verzameling spoorvoertuigen die technisch en uiterlijk dezelfde kenmerken hebben;
        - *wet:* [Wet milieubeheer][ref4].


