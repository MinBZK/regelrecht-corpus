      [artikel 11.16 van de wet][ref2] kan betrekking hebben op gegevens als vermeld in [bijlage 1][ref3], deel B, bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0031712
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0031712
  - number: '8.3'
    text: |-
      De te verstrekken ruimtelijk georiënteerde inlichtingen en gegevens zijn gebaseerd op het
      rijksdriehoekcoördinatenstelsel.
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel8
  - number: '9'
    text: |-
      Het aantal bewoners van woningen per geluidsbelastingklasse dat door een of meer geluidsbronnen in hoge mate wordt
      gehinderd dan wel van wie daardoor de slaap in hoge mate wordt verstoord, en de toename van het aantal gevallen
      van ischemische hartziekten (IHD) door wegverkeerslawaai, worden bepaald door middel van de desbetreffende in
      [bijlage 2][ref1] bij deze regeling opgenomen dosis-effectrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0031712
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031712
  - number: '10.1'
    text: |-
      Als geluidbeperkende maatregelen als bedoeld in [artikel 11.1, eerste lid, van de wet][ref1] worden aangewezen de
      maatregelen, bedoeld in de tabellen 1, 2 en 3 van [bijlage 3][ref2] bij deze regeling, indien en voor zover deze
      maatregelen worden toegepast onder de in die tabellen genoemde randvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031712
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031712
  - number: '10.2'
    text: |-
      De geluidbeperkende maatregelen, bedoeld in [artikel 31, vijfde lid, van het besluit][ref1], worden aangewezen in
      tabel 3 van [bijlage 3][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031477#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0031712
    url: https://wetten.overheid.nl/BWBR0031712/2022-04-06#Artikel10
    references:
