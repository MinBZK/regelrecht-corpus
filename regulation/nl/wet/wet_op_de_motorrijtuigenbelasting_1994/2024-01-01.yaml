    text: 'Het bedrag van de belasting wordt voor een bestelauto:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24
  - number: 24.2.a
    text: |-
      met aandrijving door een kracht die wordt ontleend aan dieselolie of een product dat ingevolge
      [artikel 28 van de Wet op de accijns][ref1] gelijkwaardig is aan gasolie of een combinatie van deze brandstoffen;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '28'
  - number: 24.2.b
    text: |-
      waarvan de datum eerste toelating, genoemd in het kentekenregister, bij de aanvang van het tijdvak 12 jaar of
      langer geleden gelegen is,
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24
  - number: '24.3'
    text: |-
      Wanneer de fijnstofuitstoot, bedoeld in het tweede lid, niet is geregistreerd in het kentekenregister en de
      datum eerste toelating, genoemd in het kentekenregister, is gelegen voor 1 september 2009 dan wel indien in het
      kentekenregister is geregistreerd dat het roetfilter is verwijderd, wordt de betreffende bestelauto, behoudens
      tegenbewijs, geacht een fijnstofuitstoot te hebben van meer dan 5 milligram per kilometer, onderscheidenlijk 10
      milligram per kilowattuur.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24
  - number: '24.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het derde lid.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24
  - number: 24aa
    text: |-
      In afwijking van [artikel 24, eerste lid][ref1], wordt voor een bestelauto die is ingericht en bestemd om mede te
      worden aangedreven door een elektromotor, mits de aandrijving door de elektromotor zodanig is dat de elektrische
      energie voor een actieradius van ten minste 24 km aaneengesloten stadsverkeer uitsluitend door een batterij of door
      een brandstofcel kan worden geleverd, of mits het piekvermogen van de voor de aandrijving bestemde elektromotor
      ten minste 15 percent van het maximum vermogen van de verbrandingsmotor bedraagt, onder bij algemene maatregel van
      bestuur te stellen voorwaarden, de eigen massa van het motorrijtuig verminderd met 125 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel24
