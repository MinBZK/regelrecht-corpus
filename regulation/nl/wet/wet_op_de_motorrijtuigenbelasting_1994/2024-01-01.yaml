      Onder EURO 0-voertuig, EURO I-voertuig, EURO II-voertuig, EURO III-voertuig, EURO IV-voertuig, EURO V-voertuig en
      EEV-voertuig wordt verstaan hetgeen daaronder wordt verstaan in de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
  - number: 25a.4
    text: |-
      Indien de Euronorm van een vrachtauto niet is geregistreerd, wordt voor de bepaling van de Euronorm uitgegaan van
      de datum van eerste toelating van deze vrachtauto zoals vermeld in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
  - number: 25a.5
    text: |-
      De vrachtauto waarvan ten aanzien van de Euronorm geen aantekening in het kentekenregister of op het kentekenbewijs
      aanwezig is, wordt voor de toepassing van het tweede lid aangemerkt als:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
  - number: 25a.5.a
    text: |-
      EURO 0-voertuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum voor de
      eerste toelating tot het verkeer voor 1 juli 1992 ligt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
  - number: 25a.5.b
    text: |-
      EURO I-voertuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum voor de
      eerste toelating tot het verkeer na 30  juni 1992 maar voor 1 oktober 1995 ligt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
  - number: 25a.5.c
    text: |-
      EURO II-voertuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum voor de
      eerste toelating tot het verkeer na 30 september 1995 maar voor 1 oktober 2000 ligt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
  - number: 25a.5.d
    text: |-
      Euronorm III en hoger wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum
      voor de eerste toelating tot het verkeer na 30 september 2000 ligt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
  - number: 25a.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel25a
