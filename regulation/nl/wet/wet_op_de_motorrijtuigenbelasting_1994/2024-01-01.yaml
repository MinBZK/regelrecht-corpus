  - number: 84a.11
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84b.1
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], wordt voor het tijdvak 2014 de betaling, bedoeld in
      [artikel 84a, vijfde lid][ref2], gedaan vóór 1 maart 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel84a
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: 84a
        hoofdstuk: Xa
  - number: 84b.2
    text: |-
      In afwijking van [artikel 84a, derde lid, onderdeel c][ref1], mag in de maanden januari en februari 2014 gebruik
      van de weg worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel84a
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84b
