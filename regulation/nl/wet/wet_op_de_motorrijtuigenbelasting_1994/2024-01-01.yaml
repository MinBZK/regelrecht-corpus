  - number: 37a.1
    text: |-
      Op verzoek van de houder aan wie de inspecteur een vergunning heeft verleend voor een bedrijfsvoertuigenpark, kan
      teruggaaf worden verleend van een gedeelte van de belasting die is betaald voor de vrachtauto’s die deel uitmaken
      van het bedrijfsvoertuigenpark.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37a
  - number: 37a.2
    text: |-
      Voor de toepassing van dit hoofdstuk kan de inspecteur op verzoek onder houder tevens verstaan een fiscale
      eenheid als bedoeld in [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1] of als bedoeld in
      [artikel 7, vierde lid, van de Wet op de omzetbelasting 1968][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 37b.1
    text: |-
      De inspecteur kan op verzoek bij voor bezwaar vatbare beschikking een vergunning voor een bedrijfsvoertuigenpark
      verlenen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2
    text: De vergunning kan slechts worden verleend indien is voldaan aan de navolgende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.a
    text: Van het bedrijfsvoertuigenpark maken vrachtauto’s en één of meer aanhangwagens deel uit;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.b
    text: |-
      De vrachtauto’s en aanhangwagens die deel uitmaken van het bedrijfsvoertuigenpark worden gehouden door dezelfde
      houder;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.c
    text: De vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark zijn voorzien van een koppelinrichting;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.d
    text: |-
      Geen der vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark is bestemd voor het voortbewegen van een
      aanhangwagen waarvan een aanzienlijk deel van de massa, bij gelijkmatig verdeelde lading, door de vrachtauto wordt
      gedragen;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.e
    text: |-
      De aanhangwagens die deel uitmaken van het bedrijfsvoertuigenpark kunnen worden verbonden met elk van de
      vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.f
    text: |-
      De houder van de vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark verklaart dat geen van de
      vrachtauto’s die deel uitmaakt van het bedrijfsvoertuigenpark zal worden verbonden met een aanhangwagen die geen
      deel uitmaakt van het bedrijfsvoertuigenpark;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.g
    text: |-
      In het bedrijfsvoertuigenpark staat het aantal vrachtauto’s in verhouding tot het aantal aanhangwagens ten minste
      als 3 staat tot 2; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.2.h
    text: Een vrachtauto maakt deel uit van ten hoogste één bedrijfsvoertuigenpark.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.3
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van de verlening van de vergunning nadere voorwaarden en
      beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.4.a
    text: |-
      De vergunning geldt gedurende een jaar vanaf een door de houder te bepalen tijdstip en heeft betrekking op het
      bedrijfsvoertuigenpark dat wordt gevormd door de in de vergunning vermelde vrachtauto’s en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.4.b
    text: |-
      Gedurende het in onderdeel *a* genoemde jaar kan de inspecteur de vergunning onder bij algemene maatregel van
      bestuur te stellen voorwaarden en beperkingen op verzoek wijzigen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.5
    text: 'De vergunning kan door de inspecteur bij voor bezwaar vatbare beschikking worden ingetrokken ingeval:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.5.a
    text: bij herhaling niet wordt voldaan aan de voor de vergunning gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.5.b
    text: misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.5.c
    text: de vergunninghouder daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
  - number: 37b.6
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      een vergunning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 37c.1
    text: |-
      De teruggaaf bedraagt over het in [artikel 37b, vierde lid, onderdeel a][ref1], bedoelde jaar het verschil tussen
      de betaalde belasting voor de vrachtauto's die in dat jaar of gedeelten daarvan deel hebben uitgemaakt van het
      bedrijfsvoertuigenpark en de som van de tarieven die per jaar of gedeelten daarvan voor die vrachtauto's ingevolge
      de richtlijn minimaal zouden moeten worden betaald, met dien verstande dat per vrachtauto het hoogste tarief wordt
      genomen van de tarieven die zouden gelden in combinatie met elk van de in het bedrijfsvoertuigenpark opgenomen
      aanhangwagens. Indien het hoogste tarief per jaar volgens de richtlijn lager zou zijn dan € 338,02 bepaalt de
      inspecteur dat tarief op € 338,02 of op het evenredig deel daarvan dat overeenstemt met het deel van het jaar
      waarover de belasting is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 37b
        hoofdstuk: VI
        afdeling: '2'
  - number: 37c.2
    text: De inspecteur beslist op een verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37c
  - number: 37d.1
    text: |-
      Indien gebruik van de weg wordt gemaakt met een vrachtauto die deel uitmaakt van een bedrijfsvoertuigenpark en die
      is verbonden met een aanhangwagen die geen deel uitmaakt van dat bedrijfsvoertuigenpark, is [artikel 37c][ref1] met
      betrekking tot die vrachtwagen niet van toepassing gedurende het in [artikel 37b, vierde lid, onderdeel a][ref2],
      bedoelde jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel37c
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 37c
        hoofdstuk: VI
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: 37b
        hoofdstuk: VI
        afdeling: '2'
  - number: 37d.2
    text: |-
      Het gebruik van de weg, bedoeld in het eerste lid, vormt een verzuim ter zake waarvan de inspecteur aan de houder
      een bestuurlijke boete kan opleggen van ten hoogste € 550. De bevoegdheid tot het opleggen van de boete vervalt, in
      afwijking van [artikel 5:45, tweede lid, van de Algemene wet bestuursrecht][ref1], door het verloop van vijf jaren
      na afloop van het in [artikel 37b, vierde lid, onderdeel a][ref2], bedoelde jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: 37b
        hoofdstuk: VI
        afdeling: '2'
  - number: 37d.3
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: 37e
    text: |-
      Voor de toepassing van het in dit hoofdstuk bepaalde, wordt de toegestane maximum massa van een aanhangwagen
      afgerond tot het naaste duizendtal kilogrammen, met dien verstande dat een gedeelte van 1000 kg naar beneden wordt
      afgerond.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37e
  - number: 37f
    text: |-
      Bij ministeriële regeling worden regels gesteld ten aanzien van de wijze en het tijdstip waarop de in dit hoofdstuk
      genoemde verzoeken worden ingediend, ten aanzien van de in de verzoeken te verstrekken gegevens, en ten aanzien van
      het overigens in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37f
  - number: '62'
    text: |-
      De belasting voor een kenteken als bedoeld in [artikel 37, derde lid, van de Wegenverkeerswet 1994][ref1] wordt
      geheven van degene op wiens naam het kenteken is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '63.1'
    text: Het tijdvak waarover de belasting moet worden betaald is drie maanden.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel63
  - number: '63.2'
    text: |-
      Het tijdvak vangt aan met ingang van de dag van dagtekening van de tenaamstelling van het kentekenbewijs behorende
      bij een kenteken als bedoeld in [artikel 62][ref1] en telkenmale drie maanden later.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: VII
        afdeling: '1'
  - number: '64'
    text: |-
      De [artikelen 14][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel15
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '65'
    text: |-
      De aanvraag om afgifte van een kentekenbewijs behorende bij een kenteken als bedoeld in [artikel 62][ref1] wordt
      aangemerkt als het doen van aangifte. De aangifte geldt voor de tijdvakken dat het bijzondere kenteken te naam is
      gesteld in het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: VII
        afdeling: '1'
  - number: '66.1'
    text: |-
      Teruggaaf van belasting wordt verleend over het lopende tijdvak, voor zover dit niet is verstreken op het tijdstip
      waarop de tenaamstelling van een kentekenbewijs behorende bij een kenteken als bedoeld in [artikel 62][ref1]
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: VII
        afdeling: '1'
  - number: '66.2'
    text: |-
      [Artikel 18, derde, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel18
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '18'
        hoofdstuk: III
        afdeling: '3'
  - number: '67'
    text: |-
      Voor een kenteken als bedoeld in [artikel 62][ref1] bedraagt de belasting over een tijdvak van drie maanden het
      bedrag, opgenomen in [artikel 23, eerste lid][ref2], voor een personenauto met een eigen massa van 1000 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel23
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: VII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: '69.1'
    text: |-
      Indien met betrekking tot een motorrijtuig uit een bedrijfsvoorraad of een motorrijtuig dat voor het verrichten van
      werkzaamheden daaraan bij een herstelbedrijf is, niet is voldaan aan de krachtens [artikel 1, tweede lid][ref1],
      gestelde voorwaarden, kan de belasting worden nageheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: '69.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van twaalf maanden, waarbij als laatste dag geldt de
      dag waarvan wordt geconstateerd dat op die dag niet wordt voldaan aan de krachtens [artikel 1, tweede lid][ref1],
      gestelde voorwaarden. Indien niet aan de gestelde voorwaarden wordt voldaan, uitsluitend doordat het bij het
      handelaarskenteken behorende kentekenbewijs (handelaarskentekenbewijs) niet in het motorrijtuig aanwezig is,
      wordt de na te heffen belasting berekend over een tijdsduur van drie maanden, waarbij als laatste dag geldt de dag
      waarvan wordt geconstateerd dat op die dag het handelaarskentekenbewijs niet aanwezig was.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: '69.3'
    text: |-
      Indien met het motorrijtuig gebruik wordt gemaakt van de weg zonder dat aan de in het tweede lid bedoelde
      voorwaarden wordt voldaan, wordt de naheffingsaanslag opgelegd aan de bestuurder ingeval degene tot wiens
      bedrijfsvoorraad het motorrijtuig behoort of degene die het herstelbedrijf uitoefent aannemelijk maakt, dat van het
      motorrijtuig tegen zijn wil gebruik is gemaakt en hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel69
  - number: '70'
    text: |-
      In het geval, bedoeld in [artikel 69][ref1], is artikel [67c van de Algemene wet inzake rijksbelastingen][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '69'
        hoofdstuk: VII
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
  - number: '71.1'
    text: 'Vrijstelling van belasting wordt verleend voor:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel71
  - number: 71.1.a
    text: |-
      motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van zieken en gewonden en die als
      zodanig uiterlijk herkenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel71
  - number: 71.1.b
    text: motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van een stoffelijk overschot;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel71
  - number: 71.1.c
    text: |-
      motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van zieke en gewonde dieren en
      die als zodanig uiterlijk herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel71
  - number: '71.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorwaarden en beperkingen gesteld met betrekking tot de vrijstelling van
      belasting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel71
  - number: '71.3'
    text: De inspecteur beslist op een verzoek om vrijstelling van belasting bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel71
  - number: '71.4'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '72.1'
    text: |-
      Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: 72.1.b
    text: |-
      die ten minste 40 jaar geleden voor het eerst in gebruik zijn genomen, en die, voor zover het vrachtauto’s of
      autobussen betreft, niet bedrijfsmatig worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: 72.1.c
    text: die uitsluitend worden gebruikt voor defensie of door de politie;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: 72.1.d
    text: die uitsluitend worden gebruikt door de brandweer en als zodanig uiterlijk herkenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: 72.1.h
    text: die zijn ingericht en uitsluitend worden gebruikt als vuilniswagen, kolkenzuiger of straatveegwagen;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: 72.1.j
    text: die zijn ingericht en uitsluitend worden gebruikt voor de aanleg en het onderhoud van wegen;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: 72.1.l
    text: waarmee gewoonlijk slechts over een geringe afstand gebruik van de weg wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: 72.1.m
    text: |-
      waarmee tijdens een voor het motorrijtuig geldende schorsing gebruik van de weg wordt gemaakt op de dag waarop
      dat motorrijtuig aan een ingevolge [hoofdstuk V van de Wegenverkeerswet 1994][ref1] te verrichten keuring wordt
      onderworpen; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 72.1.n
    text: |-
      die blijkens een ingevolge de [Wet personenvervoer 2000][ref1] geldige vergunning, dan wel voorzover afgegeven
      een vergunningbewijs, zijn bestemd om daarmee als personenauto openbaar vervoer of taxivervoer te verrichten en
      daarvoor geheel of nagenoeg geheel worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '72.2'
    text: |-
      De voorwaarde dat het motorrijtuig wordt gehouden door een openbaar lichaam kan in de in het eerste lid bedoelde
      algemene maatregel van bestuur alleen worden gesteld voor de vrijstellingen genoemd in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
  - number: '72.3'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling als bedoeld in het eerste lid, onderdeel h, j, l en n.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '73.1'
    text: |-
      Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen die:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel73
  - number: 73.1.a
    text: |-
      zijn geregistreerd in het buitenland en in Nederland feitelijk ter beschikking staan van natuurlijke personen die
      hun hoofdverblijf buiten Nederland hebben;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel73
  - number: 73.1.b
    text: |-
      zijn geregistreerd in het buitenland en door een aldaar gevestigde werkgever ter beschikking zijn gesteld aan een
      als werknemer bij hem in dienst zijnde in Nederland wonende persoon;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel73
  - number: 73.1.c
    text: |-
      zijn geregistreerd in het buitenland en worden gebruikt door in Nederland wonende personen die elders dan in
      Nederland: '- hoofd zijn van een eenmansbedrijf, of'
        - lid zijn van een maatschap, of
        - bestuurder, vennoot of aandeelhouder zijn van een onderneming, opgericht in de vorm van een vennootschap;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel73
  - number: 73.1.d
    text: |-
      zijn geregistreerd in het buitenland en in Nederland ten hoogste twee weken feitelijk ter beschikking staan van een
      houder die in Nederland zijn hoofdverblijf heeft of is gevestigd.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel73
  - number: '73.2'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling voor specifieke doeleinden op grond van bepalingen krachtens het eerste lid, onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '74.1'
    text: |-
      Vrijstelling van een gedeelte van de belasting wordt, onder bij algemene maatregel van bestuur te stellen regels,
      verleend voor vrachtauto’s die worden gebezigd in het gecombineerde rail-wegvervoer van goederen tussen lidstaten
      van de Europese Unie. De vrijstelling wordt verleend voor het gedeelte van de over een tijdvak verschuldigde
      belasting dat overeenkomt met het aantal dagen van het tijdvak waarop de vrachtauto en de aanhangwagen per trein
      zijn vervoerd.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel74
  - number: '74.2'
    text: Voor de toepassing van het eerste lid wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel74
  - number: '76.1'
    text: |-
      Bij constatering van het feit dat met betrekking tot een motorrijtuig ten onrechte een vrijstelling van belasting
      is verleend dan wel niet wordt voldaan aan de voor een vrijstelling gestelde voorwaarden kan de belasting worden
      nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel76
  - number: '76.2'
    text: 'De na te heffen belasting wordt berekend over:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel76
  - number: 76.2.a
    text: |-
      een tijdsduur van vier aaneensluitende tijdvakken van drie maanden met als laatste tijdvak dat waarin het in het
      eerste lid bedoelde feit wordt geconstateerd, of
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel76
  - number: 76.2.b
    text: |-
      , ingeval het een motorrijtuig betreft waarvoor de vrijstelling van [artikel 72, eerste lid, onderdeel n][ref1], is
      verleend maar uit een boekenonderzoek blijkt dat deze vrijstelling ten onrechte is verleend, de tijdsduur waarover
      deze vrijstelling blijkens het boekenonderzoek ten onrechte is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel72
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '72'
        hoofdstuk: VIII
  - number: '76.3'
    text: |-
      Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur waarover de na te heffen belasting wordt
      berekend, niet op naam heeft gestaan van degene die het motorrijtuig houdt, wordt over dat gedeelte de belasting
      niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel76
  - number: '76.4'
    text: |-
      De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel76
  - number: '76.5'
    text: Voor de toepassing van dit artikel wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel76
  - number: '77.1'
    text: |-
      In het geval, bedoeld in [artikel 76, tweede lid, onderdeel b][ref1], vervalt de bevoegdheid tot naheffen door
      verloop van vijf jaren na het eind van het kalenderjaar waarin de belastingschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel76
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '76'
        hoofdstuk: VIII
  - number: '77.2'
    text: |-
      Voor de toepassing van [artikel 76][ref1] is [artikel 67c van de Algemene wet inzake rijksbelastingen][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '76'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
  - number: 77a.1
    text: |-
      De inspecteur is bevoegd om op of aan de weg van een motorrijtuig met behulp van een technisch hulpmiddel
      kentekengegevens als bedoeld in het tweede lid te verwerken ten behoeve van het toezicht op en de handhaving van
      deze wet. De aanwezigheid van een technisch hulpmiddel wordt op duidelijke wijze kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77a
  - number: 77a.2
    text: |-
      Onder kentekengegevens wordt voor de toepassing van dit artikel verstaan: het kenteken, de locatie, de datum en het
      tijdstip van vastlegging en de foto-opname van het motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77a
  - number: 77a.3
    text: |-
      Verdere verwerking voor het doel, bedoeld in het eerste lid, vindt plaats door de kentekengegevens door middel van
      een technisch systeem geautomatiseerd te vergelijken met andere gegevens die zijn verkregen ten behoeve van het
      toezicht op en de handhaving van deze wet teneinde vast te stellen of de gegevens overeenkomen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77a
  - number: 77a.4
    text: |-
      Voor zover de gegevens na toepassing van het derde lid niet met elkaar overeenkomen, kunnen de kentekengegevens
      vervolgens verder worden verwerkt om de verschuldigde belasting na te heffen en eventueel voor het opleggen van een
      bestuurlijke boete of het vaststellen dat een strafbaar feit is begaan ingevolge de belastingwet.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77a
  - number: 77a.5
    text: |-
      De vernietiging van de kentekengegevens in het technische systeem, bedoeld in het derde lid, vindt zo spoedig
      mogelijk en in ieder geval binnen zeven werkdagen plaats.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77a
  - number: 77a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inzet van een technisch hulpmiddel,
      bedoeld in het eerste lid, de verwerking van de kentekengegevens en de wijze waarop de kentekengegevens verder
      worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel77a
  - number: '78'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] is de bestuurder van een motorrijtuig verplicht dat te doen
      stilstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '79.1'
    text: |-
      De in [artikel 78][ref1] bedoelde ambtenaren zijn bevoegd een motorrijtuig te onderwerpen aan een onderzoek en
      het daartoe te brengen of te doen brengen naar een nabij gelegen plaats. De bestuurder van het motorrijtuig en
      bij diens afwezigheid degene die het motorrijtuig houdt, is verplicht desgevorderd zijn voor het onderzoek en het
      vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel78
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '78'
        hoofdstuk: IX
  - number: '79.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing met betrekking tot een met een motorrijtuig
      verbonden aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel79
  - number: '80.1'
    text: |-
      Behoudens wettige bevoegdheid tot heffing van tol, de bevoegdheid van de provincies ingevolge de
      [Provinciewet][ref1] tot het heffen van opcenten op de motorrijtuigenbelasting en de bevoegdheid van gemeenten
      ingevolge de [Gemeentewet][ref2] tot het heffen van parkeerbelastingen, wordt ter zake van het gebruik van de weg
      met motorrijtuigen geen belasting geheven door andere publiekrechtelijke lichamen dan de rijksoverheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005645
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005645
      - id: ref2
        bwb_id: BWBR0005416
  - number: '80.2'
    text: Het eerste lid is niet van toepassing voor de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel80
  - number: '81'
    text: |-
      De [artikelen 8][ref1] en [10, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref2] blijven
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel10
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel81
    references:
