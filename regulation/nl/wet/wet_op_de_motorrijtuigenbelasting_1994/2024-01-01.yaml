---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_motorrijtuigenbelasting_1994
regulatory_layer: WET
publication_date: '2025-12-23'
valid_from: '2024-01-01'
bwb_id: BWBR0006324
url: https://wetten.overheid.nl/BWBR0006324/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de motorrijtuigenbelasting 1966 te vervangen
    door een wet ingevolge welke de motorrijtuigenbelasting voor personenauto's, bestelauto’s en motorrijwielen ter
    zake van het houden van die motorrijtuigen wordt geheven en voor andere motorrijtuigen ter zake van het rijden op
    de weg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam «motorrijtuigenbelasting» wordt een belasting geheven ter zake van het houden van een personenauto,
      een bestelauto, een motorrijwiel, een vrachtauto of een autobus.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor motorrijtuigen die behoren tot een bedrijfsvoorraad en voor motorrijtuigen die voor het verrichten
      van werkzaamheden daaraan bij een herstelbedrijf zijn, kan de belasting, onder bij algemene maatregel
      van bestuur te stellen voorwaarden met betrekking tot het gebruik, in afwijking van het eerste lid
      worden geheven ter zake van de ten behoeve van die motorrijtuigen opgegeven kentekens als bedoeld in
      [artikel 37, derde lid, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '2'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.a
    text: |-
      motorrijtuig: een voertuig dat is bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend of
      mede door een mechanische kracht, op of aan het voertuig aanwezig, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.a.1°
    text: |-
      een bromfiets in de zin van [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 2.a.2°
    text: |-
      een fiets met trapondersteuning als bedoeld in [artikel 1, eerste lid, onderdeel ea, van die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 2.a.3°
    text: |-
      een landbouw- of bosbouwtrekker die, een motorrijtuig met beperkte snelheid dat of een mobiele machine die in het
      kentekenregister als zodanig is geregistreerd;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.b
    text: |-
      personenauto: een motorrijtuig op drie of meer wielen, ingericht voor personenvervoer en wel voor het vervoer van
      niet meer dan acht personen, de bestuurder daaronder niet begrepen;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.c
    text: |-
      bestelauto: een motorrijtuig op drie of meer wielen niet zijnde een personenauto of een autobus, met een toegestane
      maximum massa van 3 500 kg of minder;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.d
    text: |-
      motorrijwiel: een motorrijtuig op twee wielen, alsmede een dergelijk motorrijtuig dat is verbonden met een
      zijspanwagen;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.e
    text: |-
      autobus: een motorrijtuig op drie of meer wielen dat is ingericht voor personenvervoer en wel voor het vervoer van
      meer dan acht personen, de bestuurder daaronder niet begrepen;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.f
    text: 'vrachtauto: een motorrijtuig, niet zijnde een personenauto, een bestelauto, een motorrijwiel of een autobus;'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.g
    text: |-
      aanhangwagen: een voertuig, niet zijnde een motorrijtuig, dat kennelijk is bestemd om te worden voortbewogen door
      een motorrijtuig;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.h
    text: |-
      koppelinrichting: een aan een motorrijtuig bevestigde inrichting met behulp waarvan het motorrijtuig kan worden
      verbonden met een aanhangwagen;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.i
    text: |-
      bedrijfsvoorraad: de voorraad motorrijtuigen van een bedrijf van een natuurlijk persoon of rechtspersoon waaraan
      een erkenning als bedoeld in [hoofdstuk IV, paragraaf 5, van de Wegenverkeerswet 1994][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
  - number: 2.j
    text: |-
      herstelbedrijf: een bedrijf dat in opdracht van derden aan motorrijtuigen onderhoudswerkzaamheden of reparaties
      verricht dan wel veranderingen aanbrengt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.k
    text: |-
      eigen massa: de massa van het voertuig in bedrijfsvaardige staat met inbegrip van de bedrijfsstoffen, reservedelen
      en gereedschappen die behoren tot de normale uitrusting;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.l
    text: |-
      toegestane maximum massa: de eigen massa van het voertuig vermeerderd met de voor het voertuig toegestane maximum
      massa aan lading.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.m
    text: |-
      toegestane maximum massa van een vrachtauto die is voorzien van een koppelinrichting: de toegestane maximum massa
      van de vrachtauto indien deze niet zou zijn voorzien van een koppelinrichting, verhoogd met de hoogste toegestane
      maximum massa van een aanhangwagen waarmee de vrachtauto kan worden verbonden;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.n
    text: |-
      richtlijn: Richtlijn 1999/62/EG van het Europees Parlement en de Raad van 17 juni 1999 betreffende het in rekening
      brengen van het gebruik van bepaalde infrastructuurvoorzieningen aan zware vrachtvoertuigen (PbEG 1999, L 187);
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
  - number: 2.o
    text: |-
      kentekenregister: het kentekenregister, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 2.p
    text: |-
      tenaamstelling: tenaamstelling in het kentekenregister als bedoeld in
      [hoofdstuk IV, paragraaf 4a, van de Wegenverkeerswet 1994][ref1], alsmede het te naam stellen of het op naam
      stellen van een personenauto, een bestelauto, een motorrijwiel, een vrachtauto of een autobus.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Paragraaf4a
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        paragraaf: 4a
  - number: '3.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder personenauto mede verstaan een motorrijtuig op drie of
      meer wielen met een toegestane maximum massa van 3 500 kg of minder met een laadruimte, zulks met uitzondering van
      een motorrijtuig met een laadruimte die in haar geheel is voorzien van een vlakke laadvloer en die:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.a
    text: |-
      een lengte heeft van ten minste 200 cm en over ten minste 200 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 130 cm; dan wel
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.b
    text: 'ingeval de laadruimte minder dan 25 cm hoger is dan de cabine:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.b.1°
    text: |-
      een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.b.2°
    text: |-
      van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine,
      welke wand direct achter de zitplaats is aangebracht en ten minste dezelfde hoogte heeft als de bestuurderscabine;
      en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.b.3°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.c
    text: 'ingeval de laadruimte ten minste 25 cm hoger is dan de cabine:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.c.1°
    text: |-
      een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.c.2°
    text: |-
      van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine,
      welke wand direct achter de bestuurderszitplaats is aangebracht en een hoogte heeft van ten minste 30 cm; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.c.3°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d
    text: |-
      ingeval het motorrijtuig een dubbele cabine heeft met zitruimte achter de bestuurder voor één rij naast elkaar in
      de rijrichting zittende personen:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d.1°
    text: |-
      over ten minste 150 cm van de lengte en over ten minste 20 cm van de breedte een hoogte heeft van ten minste 130
      cm; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d.2°
    text: 'voor ten minste 40 percent van de lengte voor het hart van de achterste as is geplaatst en een lengte heeft van:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d.2°.I
    text: ten minste 150 cm; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d.2°.II
    text: |-
      ten minste twee derde van de lengte die de laadruimte zou hebben indien de zitruimte achter de bestuurder zou
      ontbreken; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d.2°.III
    text: ten minste twee maal die van de cabine, tenzij de cabine een hoogte heeft van ten minste 130 cm; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d.3°
    text: |-
      van de cabine is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine, welke wand
      direct achter de zitruimte is aangebracht en ten minste dezelfde hoogte heeft als de cabine; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.1.d.4°
    text: |-
      niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      In deze wet en in de daarop berustende bepalingen wordt onder personenauto mede verstaan een motorrijtuig op drie
      of meer wielen met een toegestane maximum massa van meer dan 3.500 kg met een laadruimte, indien de lengte van
      de ruimte tussen de vaste wand achter de achterste zitplaatsen of, indien geen vaste wand aanwezig is, tussen het
      achterste punt van de in de laatste stand geplaatste achterste zitplaatsen en het einde van de laadvloer kleiner
      is dan de lengte van de ruimte tussen het achterste punt van het stuurwiel en de vaste wand achter de achterste
      zitplaatsen, of, indien geen vaste wand aanwezig is, het achterste punt van de in de laatste stand geplaatste
      achterste zitplaatsen. De lengte wordt gemeten evenwijdig aan de lengteas van het betreffende motorrijtuig. Vaste
      bevestigingspunten die uitsluitend bedoeld zijn voor de bevestiging van zitplaatsen worden gelijkgesteld aan
      zitplaatsen, met dien verstande dat voor de bepaling van de lengtes het achterste punt van de in de laatste stand
      geplaatste achterste zitplaatsen vervangen wordt door dit vaste bevestigingspunt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: '3.3'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.3.a
    text: |-
      de wijze waarop de hoogte en de lengte van de laadruimte en van de cabine worden vastgesteld alsmede op welke wijze
      het verschil in hoogte tussen de cabine en de laadruimte wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.3.b
    text: de constructie-technische afwerking van de laadruimte;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: 3.3.c
    text: de hoogte, de plaats, de constructiewijze en de bevestigingswijze van de vaste wand.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ingevolge welke met een motorrijwiel worden
      gelijkgesteld motorrijtuigen op meer dan twee wielen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel4
  - number: '5'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder weg: elke voor het openbaar rijverkeer of ander
      verkeer openstaande weg en elk zodanig pad, de in de weg of het pad liggende bruggen en duikers alsmede de tot de
      weg behorende paden en bermen of zijkanten.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel5
  - number: '6'
    text: De belasting wordt geheven van degene die bij de aanvang van een tijdvak het motorrijtuig houdt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel6
  - number: '7.1'
    text: 'Een motorrijtuig wordt gehouden door degene:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
  - number: 7.1.a
    text: op wiens naam het motorrijtuig is gesteld in het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
  - number: 7.1.b
    text: die het motorrijtuig waarvoor geen kenteken is opgegeven, feitelijk ter beschikking heeft;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
  - number: 7.1.c
    text: die een in het buitenland geregistreerd motorrijtuig in Nederland feitelijk ter beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      Als motorrijtuig waarvoor geen kenteken is opgegeven wordt niet aangemerkt een motorrijtuig waarvoor ingevolge
      [artikel 37 van de Wegenverkeerswet 1994][ref1] het voorzien zijn van een kenteken ter zake van het gebruik van
      de weg niet is voorgeschreven. De eerste volzin is niet van toepassing met betrekking tot artikel 37, eerste lid,
      onderdeel *c*, van de Wegenverkeerswet 1994, behoudens voorzover bij ministeriële regeling anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '7.3'
    text: |-
      Een houder als bedoeld in het eerste lid, aanhef en onderdeel c, niet zijnde een lichaam, wordt, behoudens
      tegenbewijs, geacht in Nederland zijn hoofdverblijf te hebben indien hij in Nederland:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
  - number: 7.3.a
    text: |-
      als ingezetene is ingeschreven in de basisregistratie personen, genoemd in
      [artikel 1.2 van de Wet basisregistratie personen][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 7.3.b
    text: |-
      niet als ingezetene is ingeschreven in de basisregistratie personen, genoemd in
      [artikel 1.2 van de Wet basisregistratie personen][ref1], maar verplicht is tot het doen van aangifte van verblijf
      en adres ingevolge [artikel 2.38 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: '7.4'
    text: |-
      Een houder als bedoeld in het eerste lid, onderdeel c, zijnde een onderneming of rechtspersoon, wordt, behoudens
      tegenbewijs, geacht in Nederland te zijn gevestigd indien hij in Nederland is ingeschreven in het handelsregister,
      genoemd in [artikel 1, eerste lid, onderdeel h, van de Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '1'
  - number: '8.1'
    text: |-
      Indien het motorrijtuig waarvoor een kenteken is opgegeven feitelijk en niet geheel voorbijgaand ter beschikking
      staat van een ander dan degene op wiens naam het motorrijtuig is gesteld, kan de inspecteur:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel8
  - number: 8.1.a
    text: deze op gezamenlijk verzoek aanmerken als degene die het motorrijtuig houdt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel8
  - number: 8.1.b
    text: deze ambtshalve aanmerken als degene die het motorrijtuig houdt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel8
  - number: '8.2'
    text: |-
      De inspecteur neemt de beslissing op het verzoek, bedoeld in het eerste lid, onderdeel *a*, en de beslissing,
      bedoeld in het eerste lid, onderdeel *b*, bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel8
  - number: '9'
    text: |-
      Als degene die het motorrijtuig waarvoor geen kenteken is opgegeven feitelijk ter beschikking heeft wordt beschouwd
      degene ten aanzien van wie het gebruik van de weg met het motorrijtuig is geconstateerd. Degene ten aanzien van wie
      het gebruik van de weg is geconstateerd, wordt geacht tot het moment waarop voor het motorrijtuig een kenteken is
      opgegeven, het motorrijtuig feitelijk ter beschikking te hebben, tenzij is gebleken dat dit onjuist is.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel9
  - number: '10'
    text: Het tijdvak waarover de belasting moet worden betaald is drie maanden.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      Voor een motorrijtuig waarvoor een kenteken is opgegeven vangt het tijdvak aan met ingang van de dag van
      dagtekening van de eerste tenaamstelling en telkenmale drie maanden later.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij wijziging van de tenaamstelling van een motorrijtuig wegens wisseling van de houder van het motorrijtuig geldt
      als kort tijdvak waarover de belasting moet worden betaald, het tijdvak dat aanvangt met ingang van de dag van
      dagtekening van de wijziging van de tenaamstelling en dat eindigt met de dag voorafgaande aan de eerste dag van
      het tijdvak met ingang waarvan de belasting voor het eerst na die wisseling moet worden betaald op de voet van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel11
  - number: '12'
    text: |-
      Voor een motorrijtuig waarvoor geen kenteken is opgegeven vangt het tijdvak aan met ingang van de dag waarop
      het gebruik van de weg in Nederland aanvangt en, zolang voor dat motorrijtuig nog geen kenteken is opgegeven,
      telkenmale drie maanden later.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel12
  - number: '13.1'
    text: |-
      Voor een in het buitenland geregistreerd motorrijtuig dat in Nederland feitelijk ter beschikking staat vangt het
      tijdvak aan met ingang van de dag waarop het gebruik van de weg in Nederland aanvangt en, zolang het motorrijtuig
      in Nederland feitelijk ter beschikking staat, telkenmale drie maanden later.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel13
  - number: '13.2'
    text: |-
      Voor de toepassing van [artikel 7, derde lid][ref1], vangt, in afwijking van het eerste lid, voor dat motorrijtuig
      het tijdvak aan met ingang van de dag waarop de houder als ingezetene is ingeschreven in de basisregistratie
      personen, genoemd in [artikel 1.2 van de Wet basisregistratie personen][ref2], of met ingang van de dag waarop
      de houder zich als ingezetene had moeten inschrijven in die basisregistratie en, zolang het motorrijtuig in
      Nederland feitelijk ter beschikking staat, telkenmale drie maanden later, tenzij wordt aangetoond met ingang van
      welke dag het in het buitenland geregistreerde motorrijtuig in Nederland ter beschikking heeft gestaan, in welk
      geval het tijdvak aanvangt met die datum. Voor de toepassing van artikel 7, vierde lid, is de eerste volzin van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '1'
  - number: '13.3'
    text: |-
      In afwijking van het bepaalde in [artikel 10][ref1] kan de belasting voor een in het eerste lid bedoeld
      motorrijtuig van een houder die niet in Nederland zijn hoofdverblijf heeft of is gevestigd ook worden betaald over
      een tijdvak van 1, 3 of 15 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel10
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '10'
        hoofdstuk: III
        afdeling: '1'
  - number: '14'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel14
  - number: '15.1'
    text: |-
      In afwijking van [artikel 19 van de Algemene wet inzake rijksbelastingen][ref1] moet de belasting zijn betaald bij
      de aanvang van het tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '15.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke de belasting in bepaalde gevallen niet bij
      de aanvang van het tijdvak behoeft te zijn betaald.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel15
  - number: '15.3'
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden en beperkingen kan de belasting voor motorrijtuigen waarvoor
      een kenteken is opgegeven, in maandelijkse termijnen worden betaald.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel15
  - number: '17.1'
    text: |-
      De aanvraag tot tenaamstelling dan wel tot wijziging van die tenaamstelling wordt aangemerkt als het doen van
      aangifte. De aangifte geldt, zolang het motorrijtuig niet van houder wisselt, voor alle tijdvakken waarin het
      motorrijtuig wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien een gegeven van het motorrijtuig of de houder van het motorrijtuig afwijkt van de gegevens zoals deze zijn
      opgenomen in de aangifte, dan wel aanvullende aangifte, waardoor de belasting hoger of lager wordt, wordt een
      aanvullende aangifte gedaan. Indien als gevolg van een verandering aan het motorrijtuig een aanvraag wordt gedaan
      om aanpassing van de inschrijving in het kentekenregister wordt deze aanvraag aangemerkt als het doen van een
      aanvullende aangifte.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel17
  - number: '17.3'
    text: |-
      De constatering van het feit dat voor een motorrijtuig de aanvullende aangifte niet is gedaan, wordt gelijkgesteld
      met een dergelijke aangifte.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel17
  - number: '17.4'
    text: De aanvullende aangifte geldt voor de tijdvakken die aanvangen na het lopende tijdvak.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      Teruggaaf van belasting wordt verleend over het nog niet verstreken deel van het lopende tijdvak op het tijdstip
      waarop het motorrijtuig van houder wisselt dan wel het houderschap daarvan wordt beëindigd. Voor een motorrijtuig
      waarvoor geen kenteken is opgegeven, dan wel een motorrijtuig dat in het buitenland is geregistreerd, wordt de
      teruggaaf op verzoek verleend.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      Teruggaaf van belasting wordt op verzoek verleend over het lopende tijdvak voorzover dit niet is verstreken op de
      dag van dagtekening van de tenaamstelling van het motorrijtuig waarvoor geen kenteken was opgegeven, dan wel voor
      een motorrijtuig dat in het buitenland was geregistreerd.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel18
  - number: '18.3'
    text: De inspecteur stelt de teruggaaf vast bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel18
  - number: '18.4'
    text: Bedragen van € 5 en minder worden niet terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel18
  - number: '18.5'
    text: Voor de toepassing van het eerste en het tweede lid wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      Voor een motorrijtuig waarvoor een kenteken is opgegeven wordt de belasting niet geheven over
      tijdvakken die aanvangen tijdens een voor dat motorrijtuig geldende schorsing als bedoeld in
      [hoofdstuk IV, paragraaf 6, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
  - number: '19.2'
    text: Het eerste lid is niet van toepassing indien de schorsing binnen een maand eindigt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel19
  - number: '20.1'
    text: |-
      Teruggaaf van belasting wordt verleend over het bij aanvang van de schorsing nog niet verstreken gedeelte van het
      lopende tijdvak.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel20
  - number: '20.2'
    text: |-
      [Artikel 18, derde, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel18
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '18'
        hoofdstuk: III
        afdeling: '3'
  - number: '21'
    text: |-
      Bij beëindiging van een schorsing geldt als kort tijdvak waarover de belasting moet worden betaald het tijdvak
      dat aanvangt met ingang van de dag waarop de schorsing is opgeheven en dat eindigt met de dag voorafgaande aan de
      eerste dag van het tijdvak met ingang waarvan de belasting voor het eerst na beëindiging van die schorsing moet
      worden betaald op de voet van [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel11
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
  - number: '22.1'
    text: 'Voor de toepassing van de tariefbepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel22
  - number: 22.1.a
    text: uitgegaan van het motorrijtuig zoals het is ingericht bij de aanvang van het tijdvak;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel22
  - number: 22.1.b.1°
    text: |-
      de eigen massa van het motorrijtuig afgerond tot het naaste honderdtal kilogrammen, met dien verstande dat 50 kg
      naar beneden wordt afgerond;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel22
  - number: 22.1.b.2°
    text: |-
      de toegestane maximum massa van het motorrijtuig afgerond tot het naaste duizendtal kilogrammen, met dien verstande
      dat een gedeelte van 1000 kg naar beneden wordt afgerond;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel22
  - number: 22.1.c
    text: |-
      als benzine aangemerkt: lichte olie als bedoeld in
      [artikel 27, eerste lid, onderdeel a, van de Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
  - number: 22.1.d
    text: |-
      als dieselolie aangemerkt: halfzware olie en gasolie als bedoeld in
      [artikel 27, eerste lid, onderdeel b, van de Wet op de accijns][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
  - number: '22.2'
    text: |-
      Voor een personenauto of een bestelauto die is voorzien van een installatie voor het verplaatsen of vastzetten van
      een rolstoel, wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden, op verzoek het gewicht van
      die installatie niet meegerekend bij het vaststellen van de eigen massa van het motorrijtuig. De inspecteur beslist
      op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel22
  - number: '23.1'
    text: |-
      Voor een personenauto bedraagt de belasting:








                    bij een eigen massa in kilogrammen van


                    over een tijdvak van drie maanden


                    vermeerderd met


                    per 100 kg eigen massaboven






                    500 of minder


                    € 20,61






                    600


                    € 27,96






                    700


                    € 35,53






                    800


                    € 46,38






                    900 tot en met 3200


                    € 61,69


                    € 16,58


                    900 kg




                    3300 en meer


                    € 455,30


                    € 11,52


                    3 300 kg
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
  - number: '23.2'
    text: |-
      De belasting voor een personenauto wordt verhoogd met een brandstoftoeslag, tenzij deze personenauto is bestemd
      om te worden aangedreven door een kracht die uitsluitend wordt ontleend aan benzine, een product dat ingevolge
      [artikel 28 van de Wet op de accijns][ref1] gelijkwaardig is aan lichte olie, of een combinatie van deze
      brandstoffen. De brandstoftoeslag bedraagt bij aandrijving door een kracht die:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '28'
  - number: 23.2.a
    text: |-
      wordt ontleend aan dieselolie of een product dat ingevolge [artikel 28 van de Wet op de accijns][ref1]
      gelijkwaardig is aan gasolie of een combinatie van deze brandstoffen: € 80,80 bij een eigen massa van 500 kg of
      minder; € 95,63 bij een eigen massa van 600 kg; € 110,46 bij een eigen massa van 700 kg; € 125,56 bij een eigen
      massa van 800 kg; € 146,93 bij een eigen massa van 900 kg of meer, vermeerderd met € 15,91 per 100 kg eigen massa
      boven 900 kg;


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 23.2.b
    text: |-
      niet uitsluitend wordt ontleend aan een motorbrandstof als bedoeld in de aanhef of in onderdeel a: € 94,79 bij een
      eigen massa van 500 kg of minder; € 113,63 bij een eigen massa van 600 kg; € 132,47 bij een eigen massa van 700 kg;
      € 151,28 bij een eigen massa van 800 kg; € 165,25 bij een eigen massa van 900 kg of meer, vermeerderd met € 17,50
      per 100 kg eigen massa boven 900 kg.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
  - number: '23.3'
    text: |-
      In afwijking van het tweede lid, onderdeel b, bedraagt de aldaar bedoelde brandstoftoeslag: nihil bij een eigen
      massa van 800 kg of minder en € 18,29 bij een eigen massa van 900 kg of meer, vermeerderd met € 18,29 per 100 kg
      eigen massa boven 900 kg indien met betrekking tot de personenauto in het kentekenregister de brandstofsoort CNG,
      LNG of de brandstofsoort LPG met de typeaanduiding af-fabriek-, G3- of R115-installatie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
  - number: '23.4'
    text: |-
      Het bedrag van de belasting, berekend overeenkomstig het eerste en tweede lid, wordt voor een personenauto
      met aandrijving door een kracht die wordt ontleend aan dieselolie of een product dat ingevolge
      [artikel 28 van de Wet op de accijns][ref1] gelijkwaardig is aan gasolie of een combinatie van deze brandstoffen
      verhoogd met een fijnstoftoeslag van 19 percent van dat bedrag indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '28'
  - number: 23.4.a
    text: |-
      de fijnstofuitstoot meer bedraagt dan 5 milligram per kilometer, zijnde de Euro 5-emissiegrenswaarde, bedoeld
      in bijlage I, tabel 1, van Verordening (EG) nr. 715/2007 van het Europees Parlement en de Raad van 20 juni
      2007 betreffende de typegoedkeuring van motorvoertuigen met betrekking tot emissies van lichte personen- en
      bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie- en onderhoudsinformatie (PbEU 2007, L 171); of
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
  - number: 23.4.b
    text: |-
      de fijnstofuitstoot meer bedraagt dan 10 milligram per kilowattuur, zijnde de Euro VI-emissiegrenswaarde, bedoeld
      in bijlage I van Verordening (EG) nr. 595/2009 van het Europees Parlement en de Raad van 18 juni 2009 betreffende
      de typegoedkeuring van motorvoertuigen en motoren met betrekking tot emissies van zware bedrijfsvoertuigen (Euro
      VI) en de toegang tot reparatie- en onderhoudsinformatie, tot wijziging van Verordening (EG) nr. 715/2007 en
      [Richtlijn 2007/46/EG](32007L0046) en tot intrekking van de [Richtlijnen 80/1269/EEG](31980L1269), [2005/55/EG]
      (32005L0055) en [2005/78/EG](32005L0078) (PbEU 2009, L 188).
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
  - number: '23.5'
    text: |-
      Wanneer de fijnstofuitstoot, bedoeld in het vierde lid, niet is geregistreerd in het kentekenregister en de
      datum eerste toelating, genoemd in het kentekenregister, is gelegen voor 1 september 2009, dan wel indien in het
      kentekenregister is geregistreerd dat het roetfilter is verwijderd, wordt de betreffende personenauto, behoudens
      tegenbewijs, voor de toepassing van dat lid geacht een fijnstofuitstoot te hebben van meer dan 5 milligram per
      kilometer, onderscheidenlijk 10 milligram per kilowattuur.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
  - number: '23.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23
  - number: 23a.1
    text: |-
      Voor een personenauto waarvan de binnenruimte is ingericht voor het vervoer en verblijf van personen en is
      voorzien van een vaste kook- en slaapgelegenheid en die voldoet aan bij algemene maatregel van bestuur gestelde
      voorwaarden en beperkingen met betrekking tot uiterlijk en inrichting, bedraagt de belasting in afwijking van
      [artikel 23][ref1] en onder bij algemene maatregel van bestuur te stellen voorwaarden, een kwart van de ingevolge
      [dat artikel][ref2] verschuldigde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel23
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: 23a.2
    text: |-
      Indien een personenauto als bedoeld in het eerste lid, bedrijfsmatig wordt verhuurd, bedraagt de belasting de helft
      van de ingevolge [artikel 23][ref1] verschuldigde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: 23b.1
    text: |-
      In afwijking van de [artikelen 23][ref1] en [23a][ref2] bedraagt de belasting:


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: 23a
        hoofdstuk: IV
        afdeling: '2'
  - number: 23b.1.a
    text: 'voor een personenauto met een CO-uitstoot van 0 gram per kilometer: nihil, en'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23b
  - number: 23b.1.b
    text: |-
      voor een personenauto, niet zijnde een personenauto in de zin van [artikel 23a][ref1], met een CO-uitstoot
      van meer dan 0 gram per kilometer maar niet meer dan 50 gram per kilometer: de helft van de ingevolge
      [artikel 23][ref2] verschuldigde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel23
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: IV
        afdeling: '2'
  - number: 23b.2
    text: |-
      Voor de toepassing van het eerste lid is
      __REF000___________________________________________________________________________________________________________
      _____, voor zover het betrekking heeft op de meting van de CO-uitstoot, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
  - number: 23b.3
    text: |-
      Voor een personenauto met een datum eerste toelating die is gelegen voor 1 januari 2021 is voor de toepassing van
      het eerste lid [artikel 9, elfde en twaalfde lid, van de Wet op de belastingen van personenauto’s 1992][ref1]
      zoals dat artikel luidde op 30 juni 2020 van overeenkomstige toepassing.


