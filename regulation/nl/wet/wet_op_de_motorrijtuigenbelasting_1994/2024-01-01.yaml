        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
  - number: '84'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84
  - number: 84a.1
    text: |-
      Voor de toepassing van dit hoofdstuk is in afwijking van [artikel 10][ref1] het tijdvak een kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel10
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '10'
        hoofdstuk: III
        afdeling: '1'
  - number: 84a.2
    text: |-
      Op verzoek bedraagt het toe te passen tarief over het tijdvak het bedrag aan belasting, genoemd in de
      [artikelen 23][ref1], [24][ref2], [24a][ref3], [24b][ref4], [25][ref5], [25a][ref6] of [25c][ref7], zoals deze
      artikelen luidden op 31 december voorafgaand aan het tijdvak. Het ingevolge de eerste volzin bepaalde bedrag aan
      belasting bedraagt, met inbegrip van de provinciale opcenten, bedoeld in [artikel 222 van de Provinciewet][ref8],
      ten hoogste € 152,00.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel24b
      [ref5]: https://wetten.overheid.nl/BWBR0006324#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0006324#Artikel25a
      [ref7]: https://wetten.overheid.nl/BWBR0006324#Artikel25c
      [ref8]: https://wetten.overheid.nl/BWBR0005645#Artikel222
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
