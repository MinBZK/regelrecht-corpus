  - number: 84a.3
    text: 'Het tarief, bedoeld in het tweede lid, kan uitsluitend worden toegepast indien:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.3.a
    text: |-
      het motorrijtuig vóór 1 januari 1988 voor het eerst in gebruik is genomen, maar het tijdstip van eerste
      ingebruikneming nog geen 40 jaar geleden is;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.3.b
    text: |-
      het motorrijtuig, indien het een personenauto of bestelauto betreft, is bestemd om te worden aangedreven door een
      kracht die uitsluitend wordt ontleend aan benzine als bedoeld in [artikel 22, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel22
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: 84a.3.c
    text: |-
      met het motorrijtuig geen gebruik van de weg wordt gemaakt in de maanden januari, februari en december van
      hetzelfde tijdvak, met uitzondering van de dag waarop het motorrijtuig aan een keuring wordt onderworpen ter zake
      van de afgifte van een keuringsbewijs als bedoeld in [artikel 72 van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 84a.3.d
    text: het motorrijtuig, indien het een vrachtauto of autobus betreft, niet bedrijfsmatig wordt gebruikt; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.3.e
    text: het bedrag aan belasting, bedoeld in het tweede lid, is betaald bij de aanvang van het tijdvak.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.4
    text: Het verzoek, bedoeld in het tweede lid, wordt aangemerkt als het doen van een aanvullende aangifte.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.5
    text: |-
      De betaling van het over het tijdvak verschuldigde bedrag aan belasting wordt, onder vermelding van het
      betalingskenmerk als aangegeven door de inspecteur, voor de toepassing van dit hoofdstuk aangemerkt als het
      verzoek, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.6
    text: |-
      Voor een motorrijtuig waarvoor in de loop van het tijdvak een kenteken is opgegeven, vangt, voor de toepassing
      van dit hoofdstuk, het tijdvak aan met ingang van de dag van dagtekening van de eerste tenaamstelling van dat
      motorrijtuig en vervolgens telkenmale met ingang van 1 januari.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.7
    text: |-
      Bij wijziging van de tenaamstelling van het motorrijtuig in de loop van het tijdvak wordt de belasting door degene
      op wiens naam het motorrijtuig wordt gesteld, verschuldigd met ingang van het eerstvolgende tijdvak. De eerste
      volzin is niet van toepassing indien degene op wiens naam het motorrijtuig wordt gesteld niet of niet langer
      voldoet aan de bij of krachtens dit artikel gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.8
    text: |-
      Indien niet of niet langer wordt voldaan aan de bij of krachtens dit artikel gestelde voorwaarden wordt dit
      aangemerkt als een verandering aan het motorrijtuig en doet de houder een aanvullende aangifte uiterlijk op de dag
      voorafgaand aan de dag dat niet of niet langer aan de voorwaarden wordt voldaan. De aanvullende aangifte geldt:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.8.a
    text: |-
      indien deze wordt gedaan door degene die bij aanvang van het tijdvak het motorrijtuig houdt, voor het lopende
      tijdvak;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.8.b
    text: |-
      indien deze wordt gedaan door een andere houder dan als bedoeld in onderdeel a, voor de tijdvakken die aanvangen na
      het lopende tijdvak dat is bepaald zonder toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
  - number: 84a.9
    text: |-
      Bij constatering van het feit dat met betrekking tot een motorrijtuig waarvoor de belasting is betaald op de voet
      van dit artikel, niet wordt voldaan aan de bij of krachtens dit artikel gestelde voorwaarden, kan de belasting die
      zonder toepassing van dit artikel over het gehele kalenderjaar verschuldigd zou zijn geweest, worden nageheven met
      overeenkomstige toepassing van [artikel 76][ref1]. [Artikel 67c van de Algemene wet inzake rijksbelastingen][ref2]
      is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '76'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
  - number: 84a.10
    text: |-
      Voor de toepassing van dit hoofdstuk blijven de [artikelen 11][ref1], [12][ref2], [13][ref3],
      [15, derde lid][ref4], [17, vierde lid][ref5], [18][ref6], [19][ref7], [20][ref8], [21][ref9], [27][ref10],
      [30][ref11], [33, tweede, derde en vierde lid][ref12], en [36][ref13] buiten toepassing.


