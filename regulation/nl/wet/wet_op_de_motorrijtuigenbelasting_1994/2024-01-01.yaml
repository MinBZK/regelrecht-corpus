        bwb_id: BWBR0002320
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '10'
  - number: 81a
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige toepassing
      op de in de artikelen [23][ref3], [24][ref4], [24a][ref5], [24b][ref6], [25][ref7], [25a][ref8], [25b][ref9],
      [25c, eerste lid][ref10], [37c, eerste lid][ref11], en [84a][ref12] vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
