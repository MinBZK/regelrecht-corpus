  - number: '85'
    text: De inwerkingtreding van deze wet wordt bij wet geregeld.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel85
  - number: '86'
    text: Deze wet kan worden aangehaald als Wet op de motorrijtuigenbelasting 1994.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel86
