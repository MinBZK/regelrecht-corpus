        hoofdstuk: I
        afdeling: '2'
  - number: 24a.3
    text: |-
      Indien de belasting voor een bestelauto wordt geheven van een ander dan de gehandicapte, is het eerste lid slechts
      van toepassing indien het verzoek als bedoeld in het eerste lid wordt gedaan door die ander en de gehandicapte
      gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24a
  - number: 24a.4
    text: |-
      Bij een verandering, anders dan aan de bestelauto, waardoor de belasting voor een bestelauto hoger of lager wordt,
      wordt een aanvullende aangifte gedaan. De constatering van het feit dat voor een bestelauto de aanvullende aangifte
      niet is gedaan, wordt gelijkgesteld met een dergelijke aangifte. De aanvullende aangifte geldt voor de tijdvakken
      die aanvangen na het lopende tijdvak.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24a
  - number: 24a.5
    text: |-
      In geval de belasting uitsluitend hoger wordt ten gevolge van het overlijden van de gehandicapte, geldt in
      afwijking van het vierde lid de aanvullende aangifte voor de tijdvakken die aanvangen na het vierde tijdvak volgend
      op het lopende tijdvak, indien:
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24a
  - number: 24a.5.a
    text: |-
      de bestelauto op naam wordt gesteld van een inwonend gezinslid van het gezin waartoe de gehandicapte behoorde en
      op naam blijft staan van deze persoon, dan wel, indien de gehandicapte niet de houder was, de bestelauto op naam
      blijft gesteld van de in het derde lid bedoelde andere persoon; en
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24a
  - number: 24a.5.b
    text: |-
      de bestelauto uitsluitend gebruikt blijft worden voor het persoonlijk gebruik van degene op wiens naam deze
      bestelauto is gesteld, gebruik door inwonende gezinsleden daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel24a
  - number: 24a.6
    text: |-
      Bij constatering van het feit dat voor een motorrijtuig geen aanvullende aangifte is gedaan in verband met
      een verandering, anders dan aan het motorrijtuig, waardoor de belasting hoger wordt, kan ter zake van die
      verandering te weinig geheven belasting worden nageheven. [Artikel 33, tweede, derde en vierde lid][ref1], is van
      overeenkomstige toepassing.


