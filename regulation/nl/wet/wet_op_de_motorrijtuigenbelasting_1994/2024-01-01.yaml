    text: |-
      Bij wijziging van de tenaamstelling wegens wisseling van de houder van het motorrijtuig en bij beëindiging van
      een schorsing bedraagt de belasting voor het motorrijtuig over het korte tijdvak een evenredig gedeelte van de
      belasting over een tijdvak van drie maanden. Voor de toepassing van dit artikel wordt een maand gesteld op dertig
      dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel27
  - number: '27.2'
    text: Bedragen van € 5 en minder worden niet geheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel27
  - number: '30.1'
    text: 'Voor een personenauto, een bestelauto of een vrachtauto waarvoor een kenteken is opgegeven dat:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel30
  - number: 30.1.b
    text: |-
      wordt gehouden door een kermis- of circusexploitant en wordt gebruikt voor het vervoer van kermis- of
      circusbenodigdheden;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel30
  - number: 30.1.c
    text: is ingericht als werktuig of als werkplaats;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel30
  - number: 30.1.f
    text: |-
      is ingericht voor het vervoer van paarden ten behoeve van de paardensport en uitsluitend niet-beroepsmatig wordt
      gebruikt,
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel30
  - number: '30.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld met betrekking tot de
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel30
  - number: '31'
    text: |-
      In afwijking van het in dit hoofdstuk, [afdeling 3 tot en met 8][ref1], bepaalde bedraagt de belasting nihil
      voor een motorrijtuig dat is ingericht en bestemd om uitsluitend te worden aangedreven door een elektromotor,
      mits de elektrische energie uitsluitend door een batterij of door een brandstofcel wordt geleverd, of door een
      verbrandingsmotor die kan worden gevoed met waterstof.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006324
        hoofdstuk: IV
        afdeling: '3'
  - number: '33.1'
    text: |-
      Bij constatering van het feit dat voor een motorrijtuig ten onrechte geen aanvullende aangifte is gedaan, kan de te
      weinig geheven belasting worden nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel33
  - number: '33.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van vier aaneensluitende tijdvakken van drie maanden
      met als laatste tijdvak dat waarin het in het eerste lid bedoelde feit wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel33
  - number: '33.3'
    text: 'Indien blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel33
  - number: 33.3.a
    text: |-
      het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet op naam heeft gestaan van degene
      die het motorrijtuig houdt;
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel33
  - number: 33.3.b
    text: |-
      voor het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken een schorsing als bedoeld in
      [artikel 19][ref1] van toepassing is geweest; of


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel19
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '19'
        hoofdstuk: III
        afdeling: '4'
  - number: 33.3.c
    text: |-
      de verandering aan het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet was aangebracht,
      wordt over dat gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel33
  - number: '33.4'
    text: Voor de toepassing van dit artikel wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel33
  - number: '34.1'
    text: |-
      Bij constatering van gebruik van de weg met een motorrijtuig waarvoor geen kenteken is opgegeven en de belasting
      geheel of gedeeltelijk niet is betaald, kan de belasting worden nageheven. Voor de toepassing van dit lid wordt een
      in het buitenland geregistreerd motorrijtuig aangemerkt als een motorrijtuig waarvoor geen kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel34
  - number: '34.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van twaalf maanden, waarbij als laatste dag geldt de
      dag die voorafgaat aan de dag waarop het gebruik van de weg wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel34
  - number: '34.3'
    text: |-
      Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur van twaalf maanden niet feitelijk ter
      beschikking heeft gestaan van degene ten aanzien van wie het gebruik van de weg is geconstateerd, wordt over dat
      gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel34
  - number: '34.4'
    text: |-
      Indien blijkt dat een verandering aan het motorrijtuig waardoor een hoger bedrag aan belasting verschuldigd is dan
      vóór die verandering, niet was aangebracht over een gedeelte van de tijdsduur van twaalf maanden wordt over dat
      gedeelte de ter zake van die verandering meer verschuldigde belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel34
  - number: '34.5'
    text: |-
      [Artikel 33, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: V
  - number: '34.6'
    text: |-
      De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel34
  - number: '35.1'
    text: |-
      Wanneer de schorsing eindigt omdat met het motorrijtuig gebruik van de weg wordt gemaakt als bedoeld in
      [artikel 68, eerste lid, onderdeel d, van de Wegenverkeerswet 1994][ref1] kan de belasting worden nageheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
  - number: '35.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van vier aaneensluitende tijdvakken van drie maanden
      met als laatste tijdvak dat waarin gebruik van de weg is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel35
  - number: '35.3'
    text: |-
      Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet op naam heeft
      gestaan van degene die het motorrijtuig houdt, wordt over dat gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel35
  - number: '35.4'
    text: |-
      [Artikel 33, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: V
  - number: '35.5'
    text: |-
      De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel35
  - number: '35.6'
    text: |-
      Voor de heffing van de belasting wordt de schorsing als beëindigd beschouwd met ingang van de laatste dag van het
      tijdvak waarin het gebruik van de weg met het motorrijtuig is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel35
  - number: 35a
    text: |-
      Indien een voor een motorrijtuig geldende schorsing als bedoeld in
      [Hoofdstuk IV, paragraaf 6, van de Wegenverkeerswet 1994][ref1] binnen een maand eindigt, anders dan als
      bedoeld in [artikel 68, eerste lid, onderdelen c en d, van die wet][ref2], wordt de belasting waarvan krachtens
      [artikel 20, tweede lid][ref3], teruggaaf is verleend alsmede de te weinig geheven belasting nageheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Paragraaf6
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel20
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '68'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '20'
        hoofdstuk: III
        afdeling: '4'
  - number: '36.1'
    text: |-
      Bij constatering van het feit dat met betrekking tot een motorrijtuig waarvoor de belasting is betaald op de voet
      van [artikel 23a][ref1] of [artikel 30][ref2], niet wordt voldaan aan de bij of krachtens die artikelen gestelde
      voorwaarden, kan de belasting die zonder toepassing van die artikelen meer verschuldigd zou zijn geweest, worden
      nageheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel30
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '30'
        hoofdstuk: IV
        afdeling: '9'
  - number: '36.2'
    text: |-
      [Artikel 33, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: V
  - number: '37'
    text: |-
      In de gevallen, bedoeld in de [artikelen 13, tweede lid][ref1], [ 24a][ref2], [24b][ref3], [33][ref4], [34][ref5],
      [35][ref6] en [36][ref7], is [artikel 67c van de Algemene wet inzake rijksbelastingen][ref8] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel24b
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0006324#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0006324#Artikel35
      [ref7]: https://wetten.overheid.nl/BWBR0006324#Artikel36
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel37
