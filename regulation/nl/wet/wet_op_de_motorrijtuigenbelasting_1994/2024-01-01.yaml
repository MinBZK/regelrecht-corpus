  - number: '82'
    text: |-
      Het bedrag aan belasting en de daarop geheven toeslagen en opcenten tezamen wordt naar beneden afgerond op gehele
      euro’s. Bedragen met betrekking tot een teruggaaf van belasting worden naar boven afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel82
  - number: '83'
    text: |-
      Bij wijziging van het tarief van de belasting vindt de tariefwijziging geen toepassing voor het op het tijdstip met
      ingang waarvan de wijziging van toepassing is, nog niet verstreken gedeelte van het in [artikel 10][ref1], dan wel
      [artikel 11, tweede lid][ref2], bedoelde tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel11
    url: https://wetten.overheid.nl/BWBR0006324/2024-01-01#Artikel83
    references:
