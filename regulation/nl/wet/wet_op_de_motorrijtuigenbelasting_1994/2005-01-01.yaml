  - number: '60'
    text: |-
      Met betrekking tot de naheffing van de vermeerdering van de belasting die wordt voldaan op afzonderlijke aangifte
      zijn de [artikelen 36][ref1], [52][ref2] en [53][ref3] van overeenkomstige toepassing, met dien verstande dat de
      naheffingsaanslag wordt opgelegd aan degene die de aanhangwagen houdt ingeval degene die het motorrijtuig houdt
      niet bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel53
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '36'
        hoofdstuk: II
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '52'
        hoofdstuk: III
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '53'
        hoofdstuk: III
        afdeling: '5'
  - number: '61'
    text: |-
      In het geval, bedoeld in [artikel 60][ref1], is [artikel 37][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '60'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '37'
        hoofdstuk: II
        afdeling: '7'
  - number: '62'
    text: |-
      De belasting voor een kenteken als bedoeld in [artikel 37, derde lid, van de Wegenverkeerswet 1994][ref1] wordt
      geheven van degene op wiens naam het kenteken is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '63.1'
    text: Het tijdvak waarover de belasting moet worden betaald is drie maanden.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel63
  - number: '63.2'
    text: |-
      Het tijdvak vangt aan met ingang van de dag van dagtekening van de tenaamstelling van het kentekenbewijs behorende
      bij een kenteken als bedoeld in [artikel 62][ref1] en telkenmale drie maanden later.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: V
        afdeling: '1'
  - number: '64'
    text: |-
      De [artikelen 14][ref1], [15][ref2] en [16][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel16
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '14'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '15'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '16'
        hoofdstuk: II
        afdeling: '2'
  - number: '65'
    text: |-
      De aanvraag om afgifte van een kentekenbewijs behorende bij een kenteken als bedoeld in [artikel 62][ref1] wordt
      aangemerkt als het doen van aangifte. De aangifte geldt voor de tijdvakken dat het bijzondere kenteken te naam is
      gesteld in het kentekenregister als bedoeld in [artikel 1, eerste lid, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '66.1'
    text: |-
      Teruggaaf van belasting wordt verleend over de tijdvakken die nog niet zijn aangevangen op het tijdstip waarop de
      tenaamstelling van een kentekenbewijs behorende bij een kenteken als bedoeld in [artikel 62][ref1] vervalt, alsmede
      over het lopende tijdvak, voorzover dit op dat tijdstip niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: V
        afdeling: '1'
  - number: '66.2'
    text: |-
      [ artikel 18, vierde, vijfde en zesde lid][ref1] , is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel18
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '18'
        hoofdstuk: II
        afdeling: '4'
  - number: '67'
    text: |-
      Voor een kenteken als bedoeld in [artikel 62][ref1] bedraagt de belasting over een tijdvak van drie maanden het
      bedrag, opgenomen in [artikel 23, eerste lid][ref2], voor een personenauto met een eigen massa van 1000 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel23
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: II
        afdeling: '6'
  - number: '68'
    text: |-
      De belasting die voor een kenteken als bedoeld in [artikel 62][ref1] in één keer over vier aaneensluitende
      tijdvakken wordt betaald, wordt per tijdvak van drie maanden verminderd met € 3.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '62'
        hoofdstuk: V
        afdeling: '1'
  - number: '69.1'
    text: |-
      Bij constatering van gebruik van de weg met een motorrijtuig uit een bedrijfsvoorraad of met een motorrijtuig dat
      voor het verrichten van werkzaamheden daaraan bij een herstelbedrijf is zonder dat is voldaan aan de krachtens
      [artikel 1, tweede lid][ref1], gestelde voorwaarden, kan de belasting worden nageheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: '69.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van twaalf maanden, waarbij als laatste dag geldt de
      dag waarop het gebruik van de weg wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel69
  - number: '69.3'
    text: |-
      De naheffingsaanslag wordt opgelegd aan de bestuurder ingeval degene tot wiens bedrijfsvoorraad het motorrijtuig
      behoort of degene die het herstelbedrijf uitoefent aannemelijk maakt, dat van het motorrijtuig tegen zijn wil
      gebruik is gemaakt en hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel69
  - number: '70'
    text: |-
      In het geval, bedoeld in [artikel 69][ref1], is [artikel 37][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '69'
        hoofdstuk: V
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '37'
        hoofdstuk: II
        afdeling: '7'
  - number: '71.1'
    text: 'Vrijstelling van belasting wordt op verzoek verleend voor:'
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel71
  - number: 71.1.a
    text: |-
      motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van zieken en gewonden en die als
      zodanig uiterlijk herkenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel71
  - number: 71.1.b
    text: motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van een stoffelijk overschot;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel71
  - number: 71.1.c
    text: |-
      motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van zieke en gewonde dieren en
      die als zodanig uiterlijk herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel71
  - number: '71.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot hetgeen wordt verstaan onder de
      inrichting en de uiterlijke herkenbaarheid van de motorrijtuigen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel71
  - number: '71.3'
    text: De inspecteur beslist op een verzoek om vrijstelling van belasting bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel71
  - number: '72.1'
    text: |-
      Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen:
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.a
    text: die worden gehouden door een museum als historisch exemplaar of daaraan als zodanig in bruikleen zijn afgestaan;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.b
    text: |-
      die 25 jaar en ouder zijn en die, voorzover het vrachtauto’s of autobussen betreft, niet bedrijfsmatig worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.c
    text: die uitsluitend worden gebruikt voor defensie;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.d
    text: die uitsluitend worden gebruikt door politie en brandweer en als zodanig uiterlijk herkenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.e
    text: die zijn ingericht en uitsluitend worden gebruikt als uitleenbureau van openbare leeszalen en bibliotheken;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.f
    text: die uitsluitend worden gebruikt voor schooltandverzorging;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.g
    text: die uitsluitend worden gebruikt voor de keuringsdienst van waren en de vleeskeuringsdienst;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.h
    text: die zijn ingericht en uitsluitend worden gebruikt als vuilniswagen, kolkenzuiger of straatveegwagen;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.i
    text: die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van voor vernietiging bestemde dieren;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.j
    text: die zijn ingericht en uitsluitend worden gebruikt voor de aanleg en het onderhoud van wegen;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.k
    text: |-
      die zijn ingericht voor het gebruik elders dan op wegen en uitsluitend worden gebruikt voor het landbouw- en het
      bosbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.l
    text: waarmee gewoonlijk slechts over een geringe afstand gebruik van de weg wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: 72.1.m
    text: |-
      waarmee met het oog op een ingevolge [hoofdstuk V van de Wegenverkeerswet 1994][ref1] te verrichten keuring van het
      motorrijtuig tijdens een voor het motorrijtuig geldende schorsing gebruik van de weg wordt gemaakt op de dag waarop
      dat motorrijtuig naar aanleiding van de aanvraag van een keuringsbewijs aan een keuring wordt onderworpen; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 72.1.n
    text: |-
      die blijkens een ingevolge de [Wet personenvervoer 2000][ref1] geldige vergunning, dan wel voorzover afgegeven
      een vergunningbewijs, zijn bestemd om daarmee als personenauto openbaar vervoer of taxivervoer te verrichten en
      daarvoor geheel of nagenoeg geheel worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '72.2'
    text: |-
      De voorwaarde dat het motorrijtuig wordt gehouden door een openbaar lichaam kan in de in het eerste lid bedoelde
      algemene maatregel van bestuur alleen worden gesteld voor de vrijstellingen genoemd in het eerste lid, onderdelen
      *c*, *d*, voorzover het betreft de politie, *f, g* en *i*.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel72
  - number: '73'
    text: |-
      Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen die:
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel73
  - number: 73.a
    text: |-
      zijn geregistreerd in het buitenland en in Nederland feitelijk ter beschikking staan van natuurlijke personen die
      hun hoofdverblijf buiten Nederland hebben;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel73
  - number: 73.b
    text: |-
      zijn geregistreerd in het buitenland en door een aldaar gevestigde werkgever ter beschikking zijn gesteld aan een
      als werknemer bij hem in dienst zijnde in Nederland wonende persoon;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel73
  - number: 73.c
    text: |-
      zijn geregistreerd in het buitenland en worden gebruikt door in Nederland wonende personen die elders dan in
      Nederland: '- hoofd zijn van een eenmansbedrijf, of'
        - lid zijn van een maatschap, of
        - bestuurder, vennoot of aandeelhouder zijn van een onderneming, opgericht in de vorm van een vennootschap.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel73
  - number: '74.1'
    text: |-
      Vrijstelling van een gedeelte van de belasting wordt, onder bij algemene maatregel van bestuur te stellen regels,
      verleend voor vrachtauto’s die worden gebezigd in het gecombineerde rail-wegvervoer van goederen tussen lidstaten
      van de Europese Unie. De vrijstelling wordt verleend voor het gedeelte van de over een tijdvak verschuldigde
      belasting dat overeenkomt met het aantal dagen van het tijdvak waarop de vrachtauto en de aanhangwagen per trein
      zijn vervoerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel74
  - number: '74.2'
    text: Voor de toepassing van het eerste lid wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel74
  - number: '75.1'
    text: |-
      Indien met betrekking tot het motorrijtuig het bepaalde in de [artikelen 71][ref1], [72][ref2] of [73][ref3]
      toepassing vindt, geldt dit mede voor de vermeerdering van de belasting voor het motorrijtuig ter zake van het
      verbonden zijn met een aanhangwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel73
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '71'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '72'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '73'
        hoofdstuk: VI
  - number: '75.2'
    text: |-
      Met betrekking tot de vermeerdering van de belasting van een motorrijtuig ter zake van het verbonden zijn met een
      aanhangwagen is [artikel 72][ref1] van overeenkomstige toepassing ingeval dat artikel geen toepassing vindt voor
      het motorrijtuig zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel72
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '72'
        hoofdstuk: VI
  - number: '76.1'
    text: |-
      Bij constatering van het feit dat met betrekking tot een motorrijtuig ten onrechte een vrijstelling van belasting
      is verleend dan wel niet wordt voldaan aan de voor een vrijstelling gestelde voorwaarden kan de belasting worden
      nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel76
  - number: '76.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van vier aaneensluitende tijdvakken van drie maanden
      met als laatste tijdvak dat waarin het in het eerste lid bedoelde feit wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel76
  - number: '76.3'
    text: |-
      Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet op naam heeft
      gestaan van degene die het motorrijtuig houdt, wordt over dat gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel76
  - number: '76.4'
    text: |-
      De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel76
  - number: '76.5'
    text: Voor de toepassing van dit artikel wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel76
  - number: '77'
    text: |-
      In het geval, bedoeld in [artikel 76][ref1], is [artikel 37][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '76'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '37'
        hoofdstuk: II
        afdeling: '7'
  - number: '78'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] is de bestuurder van een motorrijtuig verplicht dat te doen
      stilstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '79.1'
    text: |-
      De in [artikel 78][ref1] bedoelde ambtenaren zijn bevoegd een motorrijtuig te onderwerpen aan een onderzoek en
      het daartoe te brengen of te doen brengen naar een nabij gelegen plaats. De bestuurder van het motorrijtuig en
      bij diens afwezigheid degene die het motorrijtuig houdt, is verplicht desgevorderd zijn voor het onderzoek en het
      vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel78
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '78'
        hoofdstuk: VII
  - number: '79.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing met betrekking tot een met een motorrijtuig
      verbonden aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel79
  - number: '80'
    text: |-
      Behoudens wettige bevoegdheid tot heffing van tol, de bevoegdheid van de provincies ingevolge de
      [Provinciewet][ref1] tot het heffen van opcenten op de motorrijtuigenbelasting, de bevoegdheid ingevolge de
      [Wet bereikbaarheid en mobiliteit][ref2] van provincies, gemeenten en waterschappen tot het instellen van het
      toltarief en de bevoegdheid van gemeenten ingevolge de [Gemeentewet][ref3] tot het heffen van parkeerbelastingen,
      wordt ter zake van het gebruik van de weg met motorrijtuigen geen belasting geheven door andere publiekrechtelijke
      lichamen dan het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005645
      [ref2]: https://wetten.overheid.nl/BWBR0013854
      [ref3]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005645
      - id: ref2
        bwb_id: BWBR0013854
      - id: ref3
        bwb_id: BWBR0005416
  - number: '81'
    text: |-
      De [artikelen 8][ref1] en [10, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref2] blijven
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel10
