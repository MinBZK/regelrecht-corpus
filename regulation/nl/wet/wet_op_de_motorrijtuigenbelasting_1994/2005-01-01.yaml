  - number: 24a.2
    text: |-
      Het eerste lid is eveneens van toepassing indien in verband met de handicap van de
      in het eerste lid bedoelde persoon, de laadruimte van de bestelauto, in afwijking van
      [artikel 3, eerste lid, onderdeel b, onder 2°, of onderdeel c, onder 2°, of onderdeel d, onder 3°][ref1], ten
      gevolge van aanpassing van de bestelauto niet langer van de bestuurderszitplaats onderscheidenlijk de cabine is
      afgescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel3
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: 24a.3
    text: |-
      Indien de belasting voor een bestelauto wordt geheven van een ander dan de gehandicapte, is het eerste lid slechts
      van toepassing indien het verzoek als bedoeld in het eerste lid wordt gedaan door die ander en de gehandicapte
      gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel24a
  - number: 24a.4
    text: |-
      Bij een verandering, anders dan aan de bestelauto, waardoor de belasting voor een bestelauto hoger of lager wordt,
      wordt een aanvullende aangifte gedaan. De constatering van het feit dat voor een bestelauto de aanvullende aangifte
      niet is gedaan, wordt gelijkgesteld met een dergelijke aangifte. De aanvullende aangifte geldt voor de tijdvakken
      die aanvangen na het lopende tijdvak.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel24a
  - number: 24a.5
    text: |-
      Bij constatering van het feit dat voor een motorrijtuig geen aanvullende aangifte is gedaan in verband met
      een verandering, anders dan aan het motorrijtuig, waardoor de belasting hoger wordt, kan ter zake van die
      verandering te weinig geheven belasting worden nageheven. [Artikel 33, tweede, derde en vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: II
        afdeling: '7'
