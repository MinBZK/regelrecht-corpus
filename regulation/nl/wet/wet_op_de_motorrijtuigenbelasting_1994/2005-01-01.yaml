         waarbij voor de luchtvering geldt dat deze zich bevindt op de aangedreven assen en onder luchtvering mede wordt
      verstaan daaraan als gelijkwaardig erkende vering als bedoeld in bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel25a
  - number: 25b
    text: |-
      Voor een motorrijtuig dat wordt gebruikt in de uitoefening van de detailhandel en dat is voorzien van een voor
      het publiek toegankelijke besloten ruimte die blijvend is ingericht als winkel en uitsluitend als zodanig wordt
      gebruikt, bedraagt de belasting, in afwijking van het in deze afdeling bepaalde en onder bij algemene maatregel van
      bestuur te stellen voorwaarden, met overeenkomstige toepassing van [artikel 22][ref1], over een tijdvak van drie
      maanden € 46,06, vermeerderd met € 4,61 per 1000 kg toegestane maximum massa boven 11 000 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel22
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '22'
        hoofdstuk: II
        afdeling: '6'
  - number: '26'
    text: |-
      Voor een in het buitenland geregistreerd motorrijtuig dat in Nederland feitelijk ter beschikking staat van een
      houder die niet in Nederland zijn hoofdverblijf heeft of is gevestigd, bedraagt de belasting:






                  over een tijdvak van


                  de belasting over een tijdvak van drie maanden gedeeld door






                  1 dag


                  25




                  3 dagen


                  10




                  15 dagen


                  5.




         De belasting bedraagt ten minste € 11.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel26
  - number: '27'
    text: |-
      Bij wijziging van de tenaamstelling van een kentekenbewijs wegens wisseling van de houder van het motorrijtuig en
      bij beëindiging van een schorsing bedraagt de belasting voor het motorrijtuig over het korte tijdvak een evenredig
      gedeelte van de belasting over een tijdvak van drie maanden. Voor de toepassing van dit artikel wordt een maand
      gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel27
  - number: '28'
    text: |-
      De belasting die in één keer over vier aaneensluitende tijdvakken wordt betaald voor een personenauto, een
      bestelauto of een vrachtauto waarvoor een kenteken is opgegeven, wordt per tijdvak van drie maanden verminderd met
      € 3.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel28
  - number: '29'
    text: |-
      Voor een motorrijwiel waarvoor een kenteken is opgegeven bedraagt de belasting die in één keer over vier
      aaneensluitende tijdvakken wordt betaald, een bedrag gelijk aan twee maal de ingevolge [artikel 25][ref1]
      verschuldigde belasting over een tijdvak van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel25
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
  - number: '30.1'
    text: 'Voor een motorrijtuig waarvoor een kenteken is opgegeven dat:'
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.a
    text: een kampeerauto is;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.b
    text: een woonwagen is;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.c
    text: |-
      in de uitoefening van een bedrijf, niet zijnde een lease- of verhuurbedrijf van motorrijtuigen, wordt gebruikt als
      reserve-motorrijtuig;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.d
    text: |-
      wordt gehouden door een kermis- of circusexploitant en wordt gebruikt voor het vervoer van kermis- of
      circusbenodigdheden;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.e
    text: is ingericht als werktuig of als werkplaats;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.f
    text: wordt gehouden door een verhuisondernemer en wordt gebruikt als verhuiswagen;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.g
    text: is ingericht voor bijzondere, niet geregeld voorkomende transporten;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: 30.1.h
    text: |-
      is ingericht voor het vervoer van paarden ten behoeve van de paardensport en uitsluitend niet-beroepsmatig wordt
      gebruikt,
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: '30.2'
    text: |-
      Indien een kampeerauto, bedrijfsmatig wordt verhuurd, bedraagt de belasting in afwijking in zoverre van het
      eerste lid twee maal de ingevolge [artikel 23][ref1] verschuldigde belasting over een tijdvak van drie maanden.
      [Artikel 28][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel28
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '23'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '28'
        hoofdstuk: II
        afdeling: '6'
  - number: '30.3'
    text: |-
      Het eerste lid, onderdelen *c* en *f*, is niet van toepassing op een vrachtauto waarvan de toegestane maximum
      massa hoger is dan 11 000 kg, tenzij wordt voldaan aan met betrekking tot de vrachtauto bij algemene maatregel van
      bestuur te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: '30.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld met betrekking tot het
      gebruik van de weg en de bestemming, het uiterlijk en de inrichting van het motorrijtuig. Met betrekking tot een
      kampeerauto of een woonwagen worden geen beperkingen gesteld aan de mate van het gebruik van de weg.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel30
  - number: '31'
    text: |-
      In afwijking van het in deze afdeling bepaalde bedraagt de belasting nihil voor een motorrijtuig dat is ingericht
      en bestemd om uitsluitend te worden aangedreven door een elektromotor mits de elektrische energie uitsluitend
      door een batterij of door een brandstofcel wordt geleverd, of door een verbrandingsmotor die kan worden gevoed
      met waterstof.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel31
  - number: '33.1'
    text: |-
      Bij constatering van het feit dat voor een motorrijtuig geen aanvullende aangifte is gedaan in verband met een
      verandering aan het motorrijtuig waardoor de belasting hoger wordt, kan de ter zake van die verandering te weinig
      geheven belasting worden nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel33
  - number: '33.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van vier aaneensluitende tijdvakken van drie maanden
      met als laatste tijdvak dat waarin het in het eerste lid bedoelde feit wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel33
  - number: '33.3'
    text: 'Indien blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel33
  - number: 33.3.a
    text: |-
      het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet op naam heeft gestaan van degene
      die het motorrijtuig houdt;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel33
  - number: 33.3.b
    text: |-
      voor het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken een schorsing als bedoeld in
      [artikel 19][ref1] van toepassing is geweest; of


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel19
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '19'
        hoofdstuk: II
        afdeling: '5'
  - number: 33.3.c
    text: |-
      de verandering aan het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet was aangebracht,
      wordt over dat gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel33
  - number: '33.4'
    text: Voor de toepassing van dit artikel wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel33
  - number: '34.1'
    text: |-
      Bij constatering van gebruik van de weg met een motorrijtuig waarvoor geen kenteken is opgegeven en de belasting
      geheel of gedeeltelijk niet is betaald, kan de belasting worden nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel34
  - number: '34.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van twaalf maanden, waarbij als laatste dag geldt de
      dag die voorafgaat aan de dag waarop het gebruik van de weg wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel34
  - number: '34.3'
    text: |-
      Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur van twaalf maanden niet feitelijk ter
      beschikking heeft gestaan van degene ten aanzien van wie het gebruik van de weg is geconstateerd, wordt over dat
      gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel34
  - number: '34.4'
    text: |-
      Indien blijkt dat een verandering aan het motorrijtuig waardoor een hoger bedrag aan belasting verschuldigd is dan
      vóór die verandering, niet was aangebracht over een gedeelte van de tijdsduur van twaalf maanden wordt over dat
      gedeelte de ter zake van die verandering meer verschuldigde belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel34
  - number: '34.5'
    text: |-
      [Artikel 33, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: II
        afdeling: '7'
  - number: '34.6'
    text: |-
      De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel34
  - number: '35.1'
    text: |-
      Bij constatering van gebruik van de weg met een motorrijtuig tijdens een voor dat motorrijtuig geldende schorsing
      als bedoeld in [hoofdstuk IV, paragraaf 6, van de Wegenverkeerswet 1994][ref1] kan de belasting worden nageheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
  - number: '35.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van vier aaneensluitende tijdvakken van drie maanden
      met als laatste tijdvak dat waarin het gebruik van de weg wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35
  - number: '35.3'
    text: |-
      Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet op naam heeft
      gestaan van degene die het motorrijtuig houdt, wordt over dat gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35
  - number: '35.4'
    text: |-
      [Artikel 33, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: II
        afdeling: '7'
  - number: '35.5'
    text: |-
      De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35
  - number: '35.6'
    text: |-
      Voor de heffing van de belasting wordt de schorsing als beëindigd beschouwd met ingang van de laatste dag van het
      tijdvak waarin het gebruik van de weg met het motorrijtuig is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35
  - number: 35a
    text: Indien
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35a
  - number: 35a.a
    text: |-
      de voor een motorrijtuig geldende schorsing als bedoeld in
      [Hoofdstuk IV, paragraaf 6, van de Wegenverkeerswet 1994][ref1] eindigt, anders dan bedoeld in
      [artikel 68, eerste lid, onderdelen c en d][ref2], van die wet,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel68
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '68'
        hoofdstuk: V
        afdeling: '5'
  - number: 35a.a.1°
    text: met betrekking tot een personenauto, een bestelauto of een motorrijwiel binnen drie maanden; en
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35a
  - number: 35a.a.2°
    text: met betrekking tot een vrachtauto binnen een maand; dan wel
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35a
  - number: 35a.b
    text: |-
      niet is voldaan aan de voorwaarden en beperkingen die krachtens [artikel 19, eerste lid][ref1], bij algemene
      maatregel van bestuur zijn gesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel19
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '19'
        hoofdstuk: II
        afdeling: '5'
  - number: '36'
    text: |-
      Bij constatering van het feit dat met betrekking tot een motorrijtuig waarvoor de belasting over vier
      aaneensluitende tijdvakken is betaald op de voet van [artikel 30][ref1] niet wordt voldaan aan de krachtens dat
      artikel gestelde voorwaarden, kan de belasting die zonder toepassing van dat artikel meer verschuldigd zou zijn
      geweest over die vier tijdvakken worden nageheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel30
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '30'
        hoofdstuk: II
        afdeling: '6'
  - number: '37'
    text: |-
      In de gevallen, bedoeld in [de artikelen 33][ref1], [34][ref2], [35][ref3], 35a, onder b, en [36][ref4], is
      [artikel 67c van de Algemene wet inzake rijksbelastingen][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: II
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '34'
        hoofdstuk: II
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
      - id: ref4
        bwb_id: BWBR0006324
        artikel: '36'
        hoofdstuk: II
        afdeling: '7'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67c
  - number: 37a.1
    text: |-
      Op verzoek van de houder aan wie de inspecteur een vergunning heeft verleend voor een bedrijfsvoertuigenpark, kan
      teruggaaf worden verleend van een gedeelte van de belasting die is betaald voor de vrachtauto’s die deel uitmaken
      van het bedrijfsvoertuigenpark.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37a
  - number: 37a.2
    text: |-
      Voor de toepassing van dit hoofdstuk kan de inspecteur op verzoek onder houder tevens verstaan een
      eenheid als bedoeld in [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1] of als bedoeld in
      [artikel 7, vierde lid, van de Wet op de omzetbelasting 1968][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 37b.1
    text: |-
      De inspecteur kan op verzoek bij voor bezwaar vatbare beschikking een vergunning voor een bedrijfsvoertuigenpark
      verlenen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2
    text: De vergunning kan slechts worden verleend indien is voldaan aan de navolgende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.a
    text: Van het bedrijfsvoertuigenpark maken vrachtauto’s en één of meer aanhangwagens deel uit;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.b
    text: |-
      De vrachtauto’s en aanhangwagens die deel uitmaken van het bedrijfsvoertuigenpark worden gehouden door dezelfde
      houder;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.c
    text: De vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark zijn voorzien van een koppelinrichting;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.d
    text: |-
      Geen der vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark is bestemd voor het voortbewegen van een
      aanhangwagen waarvan een aanzienlijk deel van de massa, bij gelijkmatig verdeelde lading, door de vrachtauto wordt
      gedragen;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.e
    text: |-
      De aanhangwagens die deel uitmaken van het bedrijfsvoertuigenpark kunnen worden verbonden met elk van de
      vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.f
    text: |-
      De houder van de vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark verklaart dat geen van de
      vrachtauto’s die deel uitmaakt van het bedrijfsvoertuigenpark zal worden verbonden met een aanhangwagen die geen
      deel uitmaakt van het bedrijfsvoertuigenpark;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.g
    text: |-
      In het bedrijfsvoertuigenpark staat het aantal vrachtauto’s in verhouding tot het aantal aanhangwagens ten minste
      als 3 staat tot 2; en
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.2.h
    text: Een vrachtauto maakt deel uit van ten hoogste één bedrijfsvoertuigenpark.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.3
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van de verlening van de vergunning nadere voorwaarden en
      beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.4.a
    text: |-
      De vergunning geldt gedurende een jaar vanaf een door de houder te bepalen tijdstip en heeft betrekking op het
      bedrijfsvoertuigenpark dat wordt gevormd door de in de vergunning vermelde vrachtauto’s en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.4.b
    text: |-
      Gedurende het in onderdeel *a* genoemde jaar kan de inspecteur de vergunning onder bij algemene maatregel van
      bestuur te stellen voorwaarden en beperkingen op verzoek wijzigen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.5
    text: 'De vergunning kan door de inspecteur bij voor bezwaar vatbare beschikking worden ingetrokken ingeval:'
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.5.a
    text: bij herhaling niet wordt voldaan aan de voor de vergunning gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.5.b
    text: misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37b.5.c
    text: de vergunninghouder daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37b
  - number: 37c.1
    text: |-
      De teruggaaf bedraagt over het in [artikel 37b, vierde lid, onderdeel a][ref1], bedoelde jaar het verschil tussen
      de betaalde belasting voor de vrachtauto's die in dat jaar of gedeelten daarvan deel hebben uitgemaakt van het
      bedrijfsvoertuigenpark en de som van de tarieven die per jaar of gedeelten daarvan voor die vrachtauto's ingevolge
      de richtlijn minimaal zouden moeten worden betaald, met dien verstande dat per vrachtauto het hoogste tarief wordt
      genomen van de tarieven die zouden gelden in combinatie met elk van de in het bedrijfsvoertuigenpark opgenomen
      aanhangwagens. Indien het hoogste tarief per jaar volgens de richtlijn lager zou zijn dan  € 232,59 bepaalt de
      inspecteur dat tarief op  € 232,59 of op het evenredig deel daarvan dat overeenstemt met het deel van het jaar
      waarover de belasting is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 37b
        hoofdstuk: IIA
        afdeling: '2'
  - number: 37c.2
    text: De inspecteur beslist op een verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37c
  - number: 37d
    text: |-
      Bij constatering van gebruik van de weg met een vrachtauto die deel uitmaakt van een bedrijfsvoertuigenpark en die
      is verbonden met een aanhangwagen die geen deel uitmaakt van het bedrijfsvoertuigenpark:
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37d
  - number: 37d.a
    text: |-
      is [artikel 37c][ref1] met betrekking tot de vrachtauto gedurende het in
      [artikel 37b, vierde lid, onderdeel a][ref2], bedoelde jaar niet van toepassing; en


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel37c
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 37c
        hoofdstuk: IIA
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: 37b
        hoofdstuk: IIA
        afdeling: '2'
  - number: 37d.b
    text: |-
      kan de inspecteur bij voor bezwaar vatbare beschikking een boete opleggen van ten hoogste € 453. De boete wordt
      geheven en ingevorderd als ware zij belasting. De bevoegdheid tot het opleggen van de boete vervalt door verloop
      van vijf jaren na afloop van het in [artikel 37b, vierde lid, onderdeel a][ref1], bedoelde jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 37b
        hoofdstuk: IIA
        afdeling: '2'
  - number: 37e
    text: |-
      Voor de toepassing van het in dit hoofdstuk bepaalde, wordt de toegestane maximum massa van een aanhangwagen
      afgerond tot het naaste duizendtal kilogrammen, met dien verstande dat een gedeelte van 1000 kg naar beneden wordt
      afgerond.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37e
  - number: 37f
    text: |-
      Bij ministeriële regeling worden regels gesteld ten aanzien van de wijze en het tijdstip waarop de in dit hoofdstuk
      genoemde verzoeken worden ingediend, ten aanzien van de in de verzoeken te verstrekken gegevens, en ten aanzien van
      het overigens in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel37f
  - number: '38'
    text: De belasting voor een autobus wordt geheven van degene die het motorrijtuig houdt.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel38
  - number: '39'
    text: |-
      De [artikelen 7][ref1], [8][ref2] en [9][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel9
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '8'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: '40.1'
    text: Het tijdvak waarover de belasting moet worden betaald is drie of twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel40
  - number: '40.2'
    text: Een tijdvak vangt aan met ingang van de eerste of de zestiende dag van een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel40
  - number: '40.3'
    text: |-
      Voor een in het buitenland geregistreerde autobus van een houder die niet in Nederland zijn hoofdverblijf heeft
      of is gevestigd welke autobus in Nederland feitelijk ter beschikking staat kan de belasting, in afwijking van het
      bepaalde in het eerste en het tweede lid, ook worden betaald over een tijdvak van 1, 3 of 15 dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel40
  - number: '41.1'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel41
  - number: '41.2'
    text: |-
      In afwijking van [artikel 19 van de Algemene wet inzake rijksbelastingen][ref1] moet de belasting worden betaald
      voordat het rijden op de weg met de autobus aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '42'
    text: |-
      In afwijking van het in deze afdeling bepaalde bedraagt de belasting nihil voor een autobus die is ingericht en
      bestemd om uitsluitend te worden aangedreven door een elektromotor mits de elektrische energie uitsluitend door
      een batterij of door een brandstofcel wordt geleverd, of door een verbrandingsmotor die kan worden gevoed met
      waterstof.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel42
  - number: '43.1'
    text: |-
      Teruggaaf van belasting wordt verleend over de op het tijdstip van een daartoe strekkend verzoek nog niet
      ingetreden halve maanden van het tijdvak.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel43
  - number: '43.2'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt onder een halve maand verstaan een periode van de eerste
      tot en met de vijftiende dan wel van de zestiende tot en met de laatste dag van een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel43
  - number: '44.1'
    text: |-
      Bij vervanging van een autobus door een andere autobus wordt de voor de vervangen autobus betaalde belasting,
      voorzover deze betrekking heeft op de nog niet verstreken halve maanden van het tijdvak, op verzoek verrekend
      met de belasting over die halve maanden voor de vervangende autobus. Voorzover de voor verrekening in aanmerking
      komende belasting de voor het vervangende motorrijtuig verschuldigde belasting overtreft, vindt teruggaaf van het
      verschil in belasting plaats met dien verstande, dat deze teruggaaf alleen wordt verleend over nog niet ingetreden
      halve maanden.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel44
  - number: '44.2'
    text: |-
      Een autobus die een zodanige verandering heeft ondergaan dat de verschuldigde belasting hoger of lager is dan die
      vóór de verandering aan het motorrijtuig wordt voor de toepassing van het eerste lid geacht te zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel44
  - number: '45.1'
    text: De inspecteur beslist op het verzoek om teruggaaf of verrekening bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel45
  - number: '45.2'
    text: Bedragen van € 5 en minder worden niet terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel45
  - number: '47.1'
    text: |-
      Voor een autobus bedraagt de belasting, met overeenkomstige toepassing van [artikel 22][ref1]:








                    bij een eigen massa in kilogrammen van


                    over een tijdvak van drie maanden


                    vermeerderd met


                    per 100 kg eigen massa boven






                    1000 of minder


                    € 24,00






                    1100 tot en met 2600


                    € 27,09


                    € 3,08


                    1100 kg




                    2700 en meer


                    € 75,99


                    € 0,99


                    2700 kg


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel22
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '22'
        hoofdstuk: II
        afdeling: '6'
  - number: '47.2'
    text: |-
      De belasting bedraagt nihil voor een autobus die hoofdzakelijk wordt gebruikt voor het openbaar vervoer,
      bedoeld in [artikel 1, onderdeel h, van de Wet personenvervoer 2000][ref1], en die is bestemd om hoofdzakelijk
      te worden aangedreven door een kracht die wordt ontleend aan vloeibaar gemaakt petroleumgas als bedoeld in
      [artikel 26, zesde lid, van de Wet op de accijns][ref2] of aan aardgas.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '26'
  - number: '48'
    text: |-
      Voor een in het buitenland geregistreerde autobus van een houder die niet in Nederland zijn hoofdverblijf heeft of
      is gevestigd dat in Nederland feitelijk ter beschikking staat is [artikel 26][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel26
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '26'
        hoofdstuk: II
        afdeling: '6'
  - number: '49'
    text: |-
      De belasting over een tijdvak van twaalf maanden bedraagt het viervoud van die over een tijdvak van drie maanden,
      verminderd met € 3 per tijdvak van drie maanden.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel49
  - number: '50.1'
    text: |-
      Voor een autobus die in de uitoefening van een bedrijf, niet zijnde een lease- of verhuurbedrijf van
      motorrijtuigen, wordt gebruikt als reserve-motorrijtuig, bedraagt de belasting die over een tijdvak van twaalf
      maanden wordt betaald een bedrag gelijk aan de ingevolge [artikel 47][ref1] verschuldigde belasting over een
      tijdvak van drie maanden. [Artikel 49][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel49
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '47'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '49'
        hoofdstuk: III
        afdeling: '4'
  - number: '50.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld met betrekking tot het gebruik
      van de weg en de bestemming van de autobus.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel50
  - number: '52.1'
    text: |-
      Bij constatering van het feit dat met een autobus op de weg wordt gereden waarvoor de belasting geheel of
      gedeeltelijk niet is betaald, kan de belasting worden nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel52
  - number: '52.2'
    text: |-
      De na te heffen belasting wordt berekend over een tijdsduur van twaalf maanden, waarbij als laatste dag geldt de
      laatste dag van de halve maand waarin het rijden op de weg wordt geconstateerd.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel52
  - number: '52.3'
    text: |-
      Indien blijkt dat de autobus over een gedeelte van de tijdsduur van twaalf maanden niet op naam heeft gestaan van
      degene die het motorrijtuig houdt, wordt over dat gedeelte de belasting niet nageheven.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel52
  - number: '52.4'
    text: |-
      De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor de autobus is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel52
  - number: '52.5'
    text: |-
      Voor de vaststelling van de niet of te weinig betaalde belasting zijn bepalend de in het kentekenregister
      als bedoeld in [artikel 1, eerste lid, onderdeel ][ref1] voorkomende gegevens, zulks met inachtneming van de
      verschillen die bij ambtelijk onderzoek zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '52.6'
    text: |-
      De naheffingsaanslag wordt opgelegd aan de bestuurder ingeval degene die de autobus houdt aannemelijk maakt, dat
      daarvan tegen zijn wil is gebruik gemaakt en hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel52
  - number: '53'
    text: |-
      Met betrekking tot een autobus waarvoor de belasting over een tijdvak van twaalf maanden is betaald op de voet van
      [artikel 50][ref1] is [artikel 36][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel36
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '50'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '36'
        hoofdstuk: II
        afdeling: '7'
  - number: '54'
    text: |-
      In de gevallen, bedoeld in de [artikelen 52][ref1] en [53][ref2], is [artikel 37][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '52'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '53'
        hoofdstuk: III
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '37'
        hoofdstuk: II
        afdeling: '7'
  - number: '55.1'
    text: |-
      Voor een motorrijtuig – welk begrip in dit hoofdstuk uitsluitend omvat een personenauto, een bestelauto of een
      autobus – dat is verbonden met één of meer aanhangwagens met een toegestane maximum massa van meer dan 750 kg,
      wordt de belasting vermeerderd voor elk van die aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel55
  - number: '55.2'
    text: |-
      Het eerste lid is niet van toepassing ter zake van aanhangwagens die zijn ingericht en worden gebruikt als caravan,
      kampeeraanhangwagen of woonwagen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel55
  - number: '56.1'
    text: |-
      De vermeerdering van de belasting bedraagt, met overeenkomstige toepassing van [artikel 22][ref1], over een tijdvak
      van drie maanden € 5,63, vermeerderd met € 1,18 per 100 kg eigen massa van de aanhangwagen boven 500 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel22
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '22'
        hoofdstuk: II
        afdeling: '6'
  - number: '56.2'
    text: |-
      Indien met betrekking tot het motorrijtuig het bepaalde in de [artikelen 26][ref1], [30][ref2], [48][ref3] of
      [50][ref4] toepassing vindt, geldt dit mede voor de vermeerdering van de belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel50
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '26'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '30'
        hoofdstuk: II
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '48'
        hoofdstuk: III
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0006324
        artikel: '50'
        hoofdstuk: III
        afdeling: '4'
  - number: '56.3'
    text: |-
      Met betrekking tot de vermeerdering van de belasting zijn de [artikelen 30][ref1] en [50][ref2] van overeenkomstige
      toepassing ingeval die artikelen geen toepassing vinden voor het motorrijtuig zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel50
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '30'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '50'
        hoofdstuk: III
        afdeling: '4'
  - number: '57'
    text: |-
      De vermeerdering van de belasting met betrekking tot een personenauto of een bestelauto moet op afzonderlijke
      aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel57
  - number: '58'
    text: |-
      De vermeerdering van de belasting met betrekking tot een autobus kan worden voldaan op de in
      [artikel 41, eerste lid][ref1], bedoelde aangifte dan wel op afzonderlijke aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel41
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '41'
        hoofdstuk: III
        afdeling: '2'
  - number: '59'
    text: |-
      Met betrekking tot de vermeerdering van de belasting die wordt voldaan op afzonderlijke aangifte zijn de
      [artikelen 32][ref1], [40][ref2], [41, tweede lid][ref3], [43][ref4], [44][ref5], [45][ref6] en [51][ref7] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0006324#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0006324#Artikel45
      [ref7]: https://wetten.overheid.nl/BWBR0006324#Artikel51
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '32'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '40'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '41'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0006324
        artikel: '43'
        hoofdstuk: III
        afdeling: '3'
