  - number: '82'
    text: |-
      Het bedrag aan belasting en de daarop geheven toeslagen en opcenten tezamen wordt naar beneden afgerond op gehele
      euro’s. Bedragen met betrekking tot een teruggaaf van belasting worden naar boven afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel82
  - number: '83'
    text: |-
      Bij wijziging van het tarief van de belasting vindt de tariefwijziging geen toepassing voor dat gedeelte van de
      voor een motorrijtuig over een of meer tijdvakken geheven belasting dat is gelegen na het tijdstip met ingang
      waarvan de wijziging van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel83
  - number: '84'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel84
  - number: '85'
    text: De inwerkingtreding van deze wet wordt bij wet geregeld.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel85
  - number: '86'
    text: Deze wet kan worden aangehaald als Wet op de motorrijtuigenbelasting 1994.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel86
