    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: '23.2'
    text: |-
      De belasting voor een personenauto die is bestemd om te worden aangedreven door een kracht die niet uitsluitend
      wordt ontleend aan benzine wordt verhoogd met een brandstoftoeslag. De brandstoftoeslag bedraagt bij aandrijving
      door een kracht die:
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.2.a
    text: |-
      wordt ontleend aan dieselolie: € 45,98 bij een eigen massa van 500 kg of minder; € 54,43 bij een eigen massa van
      600 kg; € 62,86 bij een eigen massa van 700 kg; € 71,46 bij een eigen massa van 800 kg; € 83,64 bij een eigen massa
      van 900 kg of meer, vermeerderd met € 9,06 per 100 kg eigen massa boven 900 kg;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.2.b
    text: |-
      niet uitsluitend wordt ontleend aan benzine of dieselolie: € 53,95 bij een eigen massa van 500 kg of minder; €
      64,66 bij een eigen massa van 600 kg; € 75,38 bij een eigen massa van 700 kg; € 86,11 bij een eigen massa van 800
      kg; € 94,04 bij een eigen massa van 900 kg of meer, vermeerderd met € 9,97 per 100 kg eigen massa boven 900 kg.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: '23.3'
    text: |-
      In afwijking van het tweede lid, onderdeel b, bedraagt de aldaar bedoelde brandstoftoeslag: nihil bij een eigen
      massa van 800 kg of minder en € 10,36 bij een eigen massa van 900 kg of meer, vermeerderd met € 10,36 per 100 kg
      eigen massa boven 900 kg bij aandrijving door een kracht die wordt ontleend aan aardgas en eveneens bij aandrijving
      door een kracht die wordt ontleend aan vloeibaar gemaakt petroleumgas, indien:
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.3.a
    text: |-
      voor de personenauto een typegoedkeuring is verleend als bedoeld in [artikel 22 van de Wegenverkeerswet 1994][ref1]
      dan wel een individuele goedkeuring als bedoeld in [artikel 26 van die wet][ref2], met toepassing van de normen
      zoals die zijn neergelegd in de [Richtlijn nr. 70/220/EEG](31970L0220) van de Raad van de Europese Gemeenschappen
      van 20 maart 1970 inzake de onderlinge aanpassing van wetgevingen der Lid-Staten met betrekking tot de maatregelen
      die moeten worden genomen tegen de luchtverontreiniging door gassen afkomstig van motoren met elektrische
      ontsteking in motorvoertuigen (*PbEG* L 76), zoals deze laatstelijk is gewijzigd bij [Richtlijn nr. 94/12/EG]
      (31994L0012) van het Europees Parlement en de Raad van de Europese Unie van 23 maart 1994 (*PbEG* L 100), dan wel
      met betrekking tot personenauto's waarvoor na 31 december 2000 het kenteken is opgegeven, zoals deze laatstelijk is
      gewijzigd bij [Richtlijn nr. 98/69/EG](31998L0069) van het Europees Parlement en de Raad van de Europese Unie van
      13 oktober 1998 (*PbEG* L 350);


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
  - number: 23.3.b
    text: |-
      de personenauto is voorzien van een installatie die tot gevolg heeft dat de emissies van die personenauto ten
      minste 30% lager zijn dan de emissienormen zoals neergelegd in de in onderdeel *a* bedoelde richtlijn;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.3.c
    text: |-
      de installatie als bedoeld in onderdeel *b* voldoet aan de door Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer vastgestelde eisen; deze eisen zullen in ieder geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.3.c.1°
    text: de ongevoeligheid van de installatie voor de brandstofsamenstelling;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.3.c.2°
    text: |-
      het niet kunnen wijzigen van de afstelling van het systeem, anders dan door of onder toezicht van de fabrikant
      of leverancier;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.3.c.3°
    text: |-
      het voorzien zijn van een systeem dat de correcte werking van de installatie bewaakt en de bestuurder daarover
      informeert;
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
  - number: 23.3.d
    text: |-
      met betrekking tot de personenauto overeenkomstig de door Onze Minister van Verkeer en Waterstaat vastgestelde
      bepalingen in het kentekenregister en op het kentekenbewijs de aanduiding G3 is opgenomen.
    url: https://wetten.overheid.nl/BWBR0006324/2005-01-01#Artikel23
