  - number: 81a
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige
      toepassing op de in de artikelen [23][ref3], [24][ref4], [24a][ref5], [25][ref6], [25a][ref7], [25b][ref8],
      [37c, eerste lid][ref9], [47, eerste lid][ref10], en [56, eerste lid][ref11], vermelde bedragen.


