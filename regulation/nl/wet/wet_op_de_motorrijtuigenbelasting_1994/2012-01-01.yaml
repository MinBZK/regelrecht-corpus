  - number: 37f
    text: |-
      Bij ministeriële regeling worden regels gesteld ten aanzien van de wijze en het tijdstip waarop de in dit hoofdstuk
      genoemde verzoeken worden ingediend, ten aanzien van de in de verzoeken te verstrekken gegevens, en ten aanzien van
      het overigens in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel37f
  - number: '62'
    text: |-
      De belasting voor een kenteken als bedoeld in [artikel 37, derde lid, van de Wegenverkeerswet 1994][ref1] wordt
      geheven van degene op wiens naam het kenteken is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
