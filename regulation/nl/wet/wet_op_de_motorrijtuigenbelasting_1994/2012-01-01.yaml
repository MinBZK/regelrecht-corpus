  - number: '3'
    text: |-
      1 In deze wet en in de daarop gebaseerde regelingen wordt onder personenauto mede verstaan een motorrijtuig op drie
      of meer wielen met een toegestane maximum massa van 3 500 kg of minder met een laadruimte, zulks met uitzondering
      van een motorrijtuig met een laadruimte die in haar geheel is voorzien van een vlakke laadvloer en die:

      a. een lengte heeft van ten minste 200 cm en over ten minste 200 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 130 cm; dan wel

      b. ingeval de laadruimte minder dan 25 cm hoger is dan de cabine:

      1°. een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en

      2°. van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van
      de cabine, welke wand direct achter de zitplaats is aangebracht en ten minste dezelfde hoogte heeft als de
      bestuurderscabine; en

      3°. niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel

      c. ingeval de laadruimte ten minste 25 cm hoger is dan de cabine:

      1°. een lengte heeft van ten minste 125 cm en over ten minste 125 cm van de lengte en over ten minste 20 cm van de
      breedte een hoogte heeft van ten minste 98 cm; en

      2°. van de bestuurderszitplaats is afgescheiden door een vaste wand over ten minste de gehele breedte van de
      cabine, welke wand direct achter de bestuurderszitplaats is aangebracht en een hoogte heeft van ten minste 30 cm;
      en

      3°. niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit; dan wel

      d. ingeval het motorrijtuig een dubbele cabine heeft met zitruimte achter de bestuurder voor één rij naast elkaar
      in de rijrichting zittende personen:

      1°. over ten minste 150 cm van de lengte en over ten minste 20 cm van de breedte een hoogte heeft van ten minste
      130 cm; en

      2°. voor ten minste 40 percent van de lengte voor het hart van de achterste as is geplaatst en een lengte heeft
      van:

      I. ten minste 150 cm; en

      II. ten minste twee derde van de lengte die de laadruimte zou hebben indien de zitruimte achter de bestuurder zou
      ontbreken; en

      III. ten minste twee maal die van de cabine, tenzij de cabine een hoogte heeft van ten minste 130 cm; en

      3°. van de cabine is afgescheiden door een vaste wand over ten minste de gehele breedte van de cabine, welke wand
      direct achter de zitruimte is aangebracht en ten minste dezelfde hoogte heeft als de cabine; en

      4°. niet is voorzien van zijruiten dan wel is voorzien van niet meer dan één aan de rechterzijde van de laadruimte
      aangebrachte zijruit.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de wijze waarop de hoogte en de lengte van de laadruimte en van de cabine worden vastgesteld alsmede op welke
      wijze het verschil in hoogte tussen de cabine en de laadruimte wordt vastgesteld;

      b. de constructie-technische afwerking van de laadruimte;

      c. de hoogte, de plaats, de constructiewijze en de bevestigingswijze van de vaste wand.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ingevolge welke met een motorrijwiel worden
      gelijkgesteld motorrijtuigen op meer dan twee wielen die uit hoofde van hun bouw overeenkomst vertonen met een
      motorrijwiel.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel4
  - number: '5'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder weg: elke voor het openbaar rijverkeer of
      ander verkeer openstaande weg en elk zodanig pad, de in de weg of het pad liggende bruggen en duikers alsmede de
      tot de weg behorende paden en bermen of zijkanten.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel5
  - number: '6'
    text: De belasting wordt geheven van degene die bij de aanvang van een tijdvak het motorrijtuig houdt.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 Een motorrijtuig wordt gehouden door degene:

      a. op wiens naam het voor het motorrijtuig opgegeven kenteken is gesteld in het kentekenregister als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref1];

      b. die het motorrijtuig waarvoor geen kenteken is opgegeven, feitelijk ter beschikking heeft;

      c. die een in het buitenland geregistreerd motorrijtuig in Nederland feitelijk ter beschikking heeft.

      2 Als motorrijtuig waarvoor geen kenteken is opgegeven wordt niet aangemerkt een motorrijtuig waarvoor ingevolge
      [artikel 37 van de Wegenverkeerswet 1994][ref2] het voorzien zijn van een kenteken ter zake van het gebruik van
      de weg niet is voorgeschreven. De eerste volzin is niet van toepassing met betrekking tot artikel 37, eerste lid,
      onderdeel *c*, van de Wegenverkeerswet 1994, behoudens voorzover bij ministeriële regeling anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '8'
    text: |-
      1 Indien het motorrijtuig waarvoor een kenteken is opgegeven feitelijk en niet geheel voorbijgaand ter beschikking
      staat van een ander dan degene op wiens naam het opgegeven kenteken is gesteld, kan de inspecteur:

      a. deze op gezamenlijk verzoek aanmerken als degene die het motorrijtuig houdt;

      b. deze ambtshalve aanmerken als degene die het motorrijtuig houdt.

      2 De inspecteur neemt de beslissing op het verzoek, bedoeld in het eerste lid, onderdeel *a*, en de beslissing,
      bedoeld in het eerste lid, onderdeel *b*, bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel8
  - number: '9'
    text: |-
      Als degene die het motorrijtuig waarvoor geen kenteken is opgegeven feitelijk ter beschikking heeft wordt beschouwd
      degene ten aanzien van wie het gebruik van de weg met het motorrijtuig is geconstateerd. Degene ten aanzien van wie
      het gebruik van de weg is geconstateerd, wordt geacht tot het moment waarop voor het motorrijtuig een kenteken is
      opgegeven, het motorrijtuig feitelijk ter beschikking te hebben, tenzij is gebleken dat dit onjuist is.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel9
  - number: '10'
    text: Het tijdvak waarover de belasting moet worden betaald is drie maanden.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 Voor een motorrijtuig waarvoor een kenteken is opgegeven vangt het tijdvak aan met ingang van de dag van
      dagtekening van de eerste tenaamstelling van het voor dat motorrijtuig afgegeven kentekenbewijs en telkenmale drie
      maanden later.

      2 Bij wijziging van de tenaamstelling van het kentekenbewijs voor een motorrijtuig wegens wisseling van de houder
      van het motorrijtuig geldt als kort tijdvak waarover de belasting moet worden betaald, het tijdvak dat aanvangt
      met ingang van de dag van dagtekening van de wijziging van de tenaamstelling van het kentekenbewijs en dat eindigt
      met de dag voorafgaande aan de eerste dag van het tijdvak met ingang waarvan de belasting voor het eerst na die
      wisseling moet worden betaald op de voet van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel11
  - number: '12'
    text: |-
      Voor een motorrijtuig waarvoor geen kenteken is opgegeven vangt het tijdvak aan met ingang van de dag waarop het
      gebruik van de weg met het motorrijtuig wordt geconstateerd en, zolang voor dat motorrijtuig nog geen kenteken is
      opgegeven, telkenmale drie maanden later.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel12
  - number: '13'
    text: |-
      1 Voor een in het buitenland geregistreerd motorrijtuig dat in Nederland feitelijk ter beschikking staat vangt het
      tijdvak aan met ingang van de dag van het gebruik van de weg in Nederland.

      2 In afwijking van het bepaalde in [artikel 10][ref1] kan de belasting voor een in het eerste lid bedoeld
      motorrijtuig van een houder die niet in Nederland zijn hoofdverblijf heeft of is gevestigd ook worden betaald over
      een tijdvak van 1, 3 of 15 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel10
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '10'
        hoofdstuk: III
        afdeling: '1'
  - number: '14'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel14
  - number: '15'
    text: |-
      1 In afwijking van [artikel 19 van de Algemene wet inzake rijksbelastingen][ref1] moet de belasting zijn betaald
      bij de aanvang van het tijdvak.

      2 Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke de belasting in bepaalde gevallen niet bij
      de aanvang van het tijdvak behoeft te zijn betaald.

      3 Onder bij ministeriële regeling te stellen voorwaarden en beperkingen kan de belasting voor personenauto’s,
      bestelauto’s, motorrijwielen of autobussen waarvoor een kenteken is opgegeven, in maandelijkse termijnen worden
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '16'
    text: |-
      De belasting voor een motorrijtuig waarvoor een kenteken is opgegeven kan in één keer worden betaald over vier
      aaneensluitende tijdvakken.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 De aanvraag om afgifte van een kentekenbewijs dan wel om wijziging van de tenaamstelling van het kentekenbewijs
      wordt aangemerkt als het doen van aangifte. De aangifte geldt, zolang het motorrijtuig niet van houder wisselt,
      voor alle tijdvakken waarin het motorrijtuig wordt gehouden.

      2 Bij een verandering aan het motorrijtuig waardoor de belasting hoger of lager wordt, wordt een aanvullende
      aangifte gedaan. Indien als gevolg van een verandering aan het motorrijtuig een aanvraag wordt gedaan om aanpassing
      van het kentekenbewijs wordt deze aanvraag aangemerkt als het doen van een aanvullende aangifte.

      3 De constatering van het feit dat voor een motorrijtuig de aanvullende aangifte niet is gedaan, wordt
      gelijkgesteld met een dergelijke aangifte.

      4 De aanvullende aangifte geldt voor de tijdvakken die aanvangen na het lopende tijdvak.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 Teruggaaf van belasting wordt verleend over het nog niet verstreken deel van het lopende tijdvak alsmede over
      de nog niet aangevangen tijdvakken op het tijdstip waarop het motorrijtuig waarvoor een kenteken is opgegeven van
      houder wisselt dan wel het houderschap daarvan wordt beëindigd.

      2 Bij verandering aan een motorrijtuig zodanig dat de voor het motorrijtuig verschuldigde belasting lager is dan
      die vóór de verandering, wordt voor het verschil in belasting teruggaaf verleend over de tijdvakken die nog niet
      zijn aangevangen op het tijdstip waarop de aanvullende aangifte wordt gedaan.

      3 Teruggaaf van belasting wordt op verzoek verleend over het lopende tijdvak voorzover dit niet is verstreken op
      de dag van dagtekening van de tenaamstelling van het kentekenbewijs voor een motorrijtuig waarvoor geen kenteken
      was opgegeven.

      4 De inspecteur stelt de teruggaaf vast bij voor bezwaar vatbare beschikking.

      5 Bedragen van € 5 en minder worden niet terugbetaald.

      6 Voor de toepassing van het eerste en het derde lid wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel18
  - number: '19'
    text: |-
      1 Voor een motorrijtuig waarvoor een kenteken is opgegeven wordt, onder bij algemene maatregel van bestuur te
      stellen voorwaarden en beperkingen, de belasting niet geheven over tijdvakken die aanvangen tijdens een voor dat
      motorrijtuig geldende schorsing als bedoeld in [hoofdstuk IV, paragraaf 6, van de Wegenverkeerswet 1994][ref1].

      2 Het eerste lid is niet van toepassing als de schorsing eindigt:

      a. met betrekking tot een personenauto, een bestelauto of een motorrijwiel: binnen drie maanden;

      b. met betrekking tot een vrachtauto of een autobus: binnen een maand.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
  - number: '20'
    text: |-
      1 Teruggaaf van belasting wordt verleend over de tijdvakken die nog niet zijn aangevangen bij de aanvang van de
      schorsing.

      2 Teruggaaf van belasting wordt mede verleend over het bij de aanvang van de schorsing nog niet verstreken gedeelte
      van het lopende tijdvak.

      3 [artikel18, vierde, vijfde en zesde lid][ref1] , is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel18
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel20
