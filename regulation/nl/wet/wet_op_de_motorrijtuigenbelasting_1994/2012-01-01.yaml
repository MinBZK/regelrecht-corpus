  - number: 35a
    text: |-
      Indien

      a. de voor een motorrijtuig geldende schorsing als bedoeld in
      [Hoofdstuk IV, paragraaf 6, van de Wegenverkeerswet 1994][ref1] eindigt, anders dan bedoeld in
      [artikel 68, eerste lid, onderdelen c en d][ref2], van die wet,

      1°. met betrekking tot een personenauto, een bestelauto of een motorrijwiel binnen drie maanden; en

      2°. met betrekking tot een vrachtauto of een autobus binnen een maand; dan wel

      b. niet is voldaan aan de voorwaarden en beperkingen die krachtens [artikel 19, eerste lid][ref3], bij algemene
      maatregel van bestuur zijn gesteld,

      wordt de belasting waarvan krachtens [artikel 20, tweede lid][ref4], teruggaaf is verleend alsmede de te weinig
      geheven belasting nageheven.


