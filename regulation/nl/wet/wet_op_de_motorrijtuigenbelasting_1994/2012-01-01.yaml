                    3 300 kg






      2 De belasting voor een personenauto wordt verhoogd met een brandstoftoeslag, tenzij deze personenauto is bestemd
      om te worden aangedreven door een kracht die uitsluitend wordt ontleend aan aardgas, benzine, een product dat
      ingevolge [artikel 28 van de Wet op de accijns][ref1] gelijkwaardig is aan lichte olie, of een combinatie van deze
      brandstoffen. De brandstoftoeslag bedraagt bij aandrijving door een kracht die:

      a. wordt ontleend aan dieselolie of een product dat ingevolge [artikel 28 van de Wet op de accijns][ref2]
      gelijkwaardig is aan gasolie of een combinatie van deze brandstoffen:

      € 61,33 bij een eigen massa van 500 kg of minder;

      € 72,60 bij een eigen massa van 600 kg;

      € 83,85 bij een eigen massa van 700 kg;

      € 95,31 bij een eigen massa van 800 kg;

      € 111,55 bij een eigen massa van 900 kg of meer, vermeerderd met € 12,09 per 100 kg eigen massa boven 900 kg;

      b. niet uitsluitend wordt ontleend aan een motorbrandstof als bedoeld in de aanhef of in onderdeel a:

      € 71,96 bij een eigen massa van 500 kg of minder;

      € 86,25 bij een eigen massa van 600 kg;

      € 100,55 bij een eigen massa van 700 kg;

      € 114,84 bij een eigen massa van 800 kg;

      € 125,44 bij een eigen massa van 900 kg of meer, vermeerderd met € 13,30 per 100 kg eigen massa boven 900 kg.

      Voor de toepassing van dit lid wordt aandrijving door een kracht die wordt ontleend aan een elektromotor als
      bedoeld in [artikel 22, derde lid][ref3], buiten beschouwing gelaten.

      3 In afwijking van het tweede lid, onderdeel b, bedraagt de aldaar bedoelde brandstoftoeslag: nihil bij een eigen
      massa van 800 kg of minder en € 13,88 bij een eigen massa van 900 kg of meer, vermeerderd met € 13,88 per 100 kg
      eigen massa boven 900 kg bij aandrijving door een kracht die wordt ontleend aan vloeibaar gemaakt petroleumgas,
      indien:

      a. voor de personenauto een typegoedkeuring is verleend als bedoeld in
      [artikel 22 van de Wegenverkeerswet 1994][ref4] dan wel een individuele goedkeuring als bedoeld in
      [artikel 26 van die wet][ref5], met toepassing van de normen zoals die zijn neergelegd in de [Richtlijn nr.
      70/220/EEG](31970L0220) van de Raad van de Europese Gemeenschappen van 20 maart 1970 inzake de onderlinge
      aanpassing van wetgevingen der Lid-Staten met betrekking tot de maatregelen die moeten worden genomen tegen de
      luchtverontreiniging door gassen afkomstig van motoren met elektrische ontsteking in motorvoertuigen (*PbEG* L
      76), zoals deze laatstelijk is gewijzigd bij [Richtlijn nr. 94/12/EG](31994L0012) van het Europees Parlement en
      de Raad van de Europese Unie van 23 maart 1994 (*PbEG* L 100), dan wel met betrekking tot personenauto's waarvoor
      na 31 december 2000 het kenteken is opgegeven, zoals deze laatstelijk is gewijzigd bij [Richtlijn nr. 98/69/EG]
      (31998L0069) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 1998 (*PbEG* L 350);

      b. de personenauto is voorzien van een installatie die tot gevolg heeft dat de emissies van die personenauto ten
      minste 30% lager zijn dan de emissienormen zoals neergelegd in de in onderdeel *a* bedoelde richtlijn;

      c. de installatie als bedoeld in onderdeel *b* voldoet aan de door Onze Minister van Infrastructuur en Milieu
      vastgestelde eisen; deze eisen zullen in ieder geval betrekking hebben op:

      1°. de ongevoeligheid van de installatie voor de brandstofsamenstelling;

      2°. het niet kunnen wijzigen van de afstelling van het systeem, anders dan door of onder toezicht van de fabrikant
      of leverancier;

      3°. het voorzien zijn van een systeem dat de correcte werking van de installatie bewaakt en de bestuurder daarover
      informeert; en

      d. met betrekking tot de personenauto overeenkomstig de door Onze Minister van Infrastructuur en Milieu
      vastgestelde bepalingen in het kentekenregister en op het kentekenbewijs de aanduiding G3 is opgenomen.


