  - number: '82'
    text: |-
      Het bedrag aan belasting en de daarop geheven toeslagen en opcenten tezamen wordt naar beneden afgerond op gehele
      euro’s. Bedragen met betrekking tot een teruggaaf van belasting worden naar boven afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel82
  - number: '83'
    text: |-
      1 Bij wijziging van het tarief van de belasting vindt de tariefwijziging geen toepassing voor het op het tijdstip
      met ingang waarvan de wijziging van toepassing is, nog niet verstreken gedeelte van het in [artikel 10][ref1], dan
      wel [artikel 11, tweede lid][ref2], bedoelde tijdvak.

      2 Indien de belasting op de voet van [artikel 16][ref3] in één keer wordt betaald over vier aaneensluitende
      tijdvakken, wordt het eerste lid toegepast op het tijdvak dat nog niet geheel is verstreken en wordt aanvullend
      belasting betaald danwel teruggaaf van belasting verleend voor de resterende aaneensluitende tijdvakken na dat
      tijdvak.

      3 De aanvullende betaling, bedoeld in het tweede lid, wordt gedaan voor het einde van het eerste of enige tijdvak
      van de resterende aaneensluitende tijdvakken. Bedragen van € 10 of minder worden niet geheven.

      4 De teruggaaf, bedoeld in het tweede lid, wordt gedaan voor het einde van het eerste of enige tijdvak van de
      resterende aaneensluitende tijdvakken bij voor bezwaar vatbare beschikking. Bedragen van € 10 en minder worden
      niet terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel10
