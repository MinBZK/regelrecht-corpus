  - number: '31'
    text: |-
      In afwijking van het in dit hoofdstuk bepaalde bedraagt de belasting nihil voor een motorrijtuig dat is ingericht
      en bestemd om uitsluitend te worden aangedreven door een elektromotor mits de elektrische energie uitsluitend
      door een batterij of door een brandstofcel wordt geleverd, of door een verbrandingsmotor die kan worden gevoed
      met waterstof.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel31
  - number: '33'
    text: |-
      1 Bij constatering van het feit dat voor een motorrijtuig geen aanvullende aangifte is gedaan in verband met een
      verandering aan het motorrijtuig waardoor de belasting hoger wordt, kan de ter zake van die verandering te weinig
      geheven belasting worden nageheven.

      2 De na te heffen belasting wordt berekend over een tijdsduur van vier aaneensluitende tijdvakken van drie maanden
      met als laatste tijdvak dat waarin het in het eerste lid bedoelde feit wordt geconstateerd.

      3 Indien blijkt dat:

      a. het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet op naam heeft gestaan van degene
      die het motorrijtuig houdt;

      b. voor het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken een schorsing als bedoeld in
      [artikel 19][ref1] van toepassing is geweest; of

      c. de verandering aan het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet was
      aangebracht, wordt over dat gedeelte de belasting niet nageheven.

      4 Voor de toepassing van dit artikel wordt een maand gesteld op dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel19
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '19'
        hoofdstuk: III
        afdeling: '4'
  - number: '34'
    text: |-
      1 Bij constatering van gebruik van de weg met een motorrijtuig waarvoor geen kenteken is opgegeven en de belasting
      geheel of gedeeltelijk niet is betaald, kan de belasting worden nageheven. Voor de toepassing van dit lid wordt een
      in het buitenland geregistreerd motorrijtuig aangemerkt als een motorrijtuig waarvoor geen kenteken is opgegeven.

      2 De na te heffen belasting wordt berekend over een tijdsduur van twaalf maanden, waarbij als laatste dag geldt de
      dag die voorafgaat aan de dag waarop het gebruik van de weg wordt geconstateerd.

      3 Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur van twaalf maanden niet feitelijk ter
      beschikking heeft gestaan van degene ten aanzien van wie het gebruik van de weg is geconstateerd, wordt over dat
      gedeelte de belasting niet nageheven.

      4 Indien blijkt dat een verandering aan het motorrijtuig waardoor een hoger bedrag aan belasting verschuldigd is
      dan vóór die verandering, niet was aangebracht over een gedeelte van de tijdsduur van twaalf maanden wordt over dat
      gedeelte de ter zake van die verandering meer verschuldigde belasting niet nageheven.

      5 [Artikel 33, vierde lid][ref1], is van toepassing.

      6 De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
        hoofdstuk: V
  - number: '35'
    text: |-
      1 Bij constatering van gebruik van de weg met een motorrijtuig tijdens een voor dat motorrijtuig geldende schorsing
      als bedoeld in [hoofdstuk IV, paragraaf 6, van de Wegenverkeerswet 1994][ref1] kan de belasting worden nageheven.

      2 De na te heffen belasting wordt berekend over een tijdsduur van vier aaneensluitende tijdvakken van drie maanden
      met als laatste tijdvak dat waarin het gebruik van de weg wordt geconstateerd.

      3 Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur van de vier tijdvakken niet op naam heeft
      gestaan van degene die het motorrijtuig houdt, wordt over dat gedeelte de belasting niet nageheven.

      4 [Artikel 33, vierde lid][ref2], is van toepassing.

      5 De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.

      6 Voor de heffing van de belasting wordt de schorsing als beëindigd beschouwd met ingang van de laatste dag van het
      tijdvak waarin het gebruik van de weg met het motorrijtuig is geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel33
