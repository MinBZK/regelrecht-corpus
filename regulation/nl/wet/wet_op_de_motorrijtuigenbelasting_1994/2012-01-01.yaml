    text: |-
      1 Op verzoek van de houder aan wie de inspecteur een vergunning heeft verleend voor een bedrijfsvoertuigenpark, kan
      teruggaaf worden verleend van een gedeelte van de belasting die is betaald voor de vrachtauto’s die deel uitmaken
      van het bedrijfsvoertuigenpark.

      2 Voor de toepassing van dit hoofdstuk kan de inspecteur op verzoek onder houder tevens verstaan een
      eenheid als bedoeld in [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1] of als bedoeld in
      [artikel 7, vierde lid, van de Wet op de omzetbelasting 1968][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
