      2 Het eerste lid is eveneens van toepassing, indien de laadruimte van de bestelauto, in afwijking van
      [artikel 3, eerste lid][ref1], ten gevolge van aanpassing van de bestelauto in verband met de handicap van de in
      het eerste lid bedoelde persoon, niet langer van de bestuurdersplaats onderscheidenlijk de cabine is afgescheiden
      of niet in haar geheel is voorzien van een vlakke laadvloer.

      3 Indien de belasting voor een bestelauto wordt geheven van een ander dan de gehandicapte, is het eerste lid
      slechts van toepassing indien het verzoek als bedoeld in het eerste lid wordt gedaan door die ander en de
      gehandicapte gezamenlijk.

      4 Bij een verandering, anders dan aan de bestelauto, waardoor de belasting voor een bestelauto hoger of lager
      wordt, wordt een aanvullende aangifte gedaan. De constatering van het feit dat voor een bestelauto de aanvullende
      aangifte niet is gedaan, wordt gelijkgesteld met een dergelijke aangifte. De aanvullende aangifte geldt voor de
      tijdvakken die aanvangen na het lopende tijdvak.

      5 In geval de belasting uitsluitend hoger wordt ten gevolge van het overlijden van de gehandicapte, geldt in
      afwijking van het vierde lid de aanvullende aangifte voor de tijdvakken die aanvangen na het vierde tijdvak volgend
      op het lopende tijdvak, indien:

      a. het kenteken op naam wordt gesteld van een inwonend gezinslid van het gezin waartoe de gehandicapte behoorde
      en op naam blijft staan van deze persoon, dan wel, indien de gehandicapte niet de houder was, het kenteken op naam
      blijft staan van de in het derde lid bedoelde andere persoon; en

      b. de bestelauto uitsluitend gebruikt blijft worden voor het persoonlijk gebruik van degene op wiens naam het
      kenteken is gesteld, gebruik door inwonende gezinsleden daaronder begrepen.

      6 Bij constatering van het feit dat voor een motorrijtuig geen aanvullende aangifte is gedaan in verband met
      een verandering, anders dan aan het motorrijtuig, waardoor de belasting hoger wordt, kan ter zake van die
      verandering te weinig geheven belasting worden nageheven. [Artikel 33, tweede, derde en vierde lid][ref2], is van
      overeenkomstige toepassing.

      7 De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


