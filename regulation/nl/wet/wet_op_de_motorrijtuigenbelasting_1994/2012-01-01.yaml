  - number: 37b
    text: |-
      1 De inspecteur kan op verzoek bij voor bezwaar vatbare beschikking een vergunning voor een bedrijfsvoertuigenpark
      verlenen.

      2 De vergunning kan slechts worden verleend indien is voldaan aan de navolgende voorwaarden.

      a. Van het bedrijfsvoertuigenpark maken vrachtauto’s en één of meer aanhangwagens deel uit;

      b. De vrachtauto’s en aanhangwagens die deel uitmaken van het bedrijfsvoertuigenpark worden gehouden door dezelfde
      houder;

      c. De vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark zijn voorzien van een koppelinrichting;

      d. Geen der vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark is bestemd voor het voortbewegen van een
      aanhangwagen waarvan een aanzienlijk deel van de massa, bij gelijkmatig verdeelde lading, door de vrachtauto wordt
      gedragen;

      e. De aanhangwagens die deel uitmaken van het bedrijfsvoertuigenpark kunnen worden verbonden met elk van de
      vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark;

      f. De houder van de vrachtauto’s die deel uitmaken van het bedrijfsvoertuigenpark verklaart dat geen van de
      vrachtauto’s die deel uitmaakt van het bedrijfsvoertuigenpark zal worden verbonden met een aanhangwagen die geen
      deel uitmaakt van het bedrijfsvoertuigenpark;

      g. In het bedrijfsvoertuigenpark staat het aantal vrachtauto’s in verhouding tot het aantal aanhangwagens ten
      minste als 3 staat tot 2; en

      h. Een vrachtauto maakt deel uit van ten hoogste één bedrijfsvoertuigenpark.

      3 Bij algemene maatregel van bestuur kunnen ten aanzien van de verlening van de vergunning nadere voorwaarden en
      beperkingen worden gesteld.

      4 a. De vergunning geldt gedurende een jaar vanaf een door de houder te bepalen tijdstip en heeft betrekking op het
      bedrijfsvoertuigenpark dat wordt gevormd door de in de vergunning vermelde vrachtauto’s en aanhangwagens.

      b. Gedurende het in onderdeel *a* genoemde jaar kan de inspecteur de vergunning onder bij algemene maatregel van
      bestuur te stellen voorwaarden en beperkingen op verzoek wijzigen.

      5 De vergunning kan door de inspecteur bij voor bezwaar vatbare beschikking worden ingetrokken ingeval:

      a. bij herhaling niet wordt voldaan aan de voor de vergunning gestelde voorwaarden;

      b. misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;

      c. de vergunninghouder daarom verzoekt.

      6 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      een vergunning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel37b
