  - number: '73'
    text: |-
      1 Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen die:

      a. zijn geregistreerd in het buitenland en in Nederland feitelijk ter beschikking staan van natuurlijke personen
      die hun hoofdverblijf buiten Nederland hebben;

      b. zijn geregistreerd in het buitenland en door een aldaar gevestigde werkgever ter beschikking zijn gesteld aan
      een als werknemer bij hem in dienst zijnde in Nederland wonende persoon;

      c. zijn geregistreerd in het buitenland en worden gebruikt door in Nederland wonende personen die elders dan in
      Nederland:

        - hoofd zijn van een eenmansbedrijf, of
        - lid zijn van een maatschap, of
        - bestuurder, vennoot of aandeelhouder zijn van een onderneming, opgericht in de vorm van een vennootschap;

      d. zijn geregistreerd in het buitenland en in Nederland ten hoogste twee weken feitelijk ter beschikking staan van
      een houder die in Nederland zijn hoofdverblijf heeft of is gevestigd.

      2 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling voor specifieke doeleinden op grond van bepalingen krachtens het eerste lid, onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '74'
    text: |-
      1 Vrijstelling van een gedeelte van de belasting wordt, onder bij algemene maatregel van bestuur te stellen regels,
      verleend voor vrachtauto’s die worden gebezigd in het gecombineerde rail-wegvervoer van goederen tussen lidstaten
      van de Europese Unie. De vrijstelling wordt verleend voor het gedeelte van de over een tijdvak verschuldigde
      belasting dat overeenkomt met het aantal dagen van het tijdvak waarop de vrachtauto en de aanhangwagen per trein
      zijn vervoerd.

      2 Voor de toepassing van het eerste lid wordt een maand gesteld op dertig dagen.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel74
  - number: '76'
    text: |-
      1 Bij constatering van het feit dat met betrekking tot een motorrijtuig ten onrechte een vrijstelling van belasting
      is verleend dan wel niet wordt voldaan aan de voor een vrijstelling gestelde voorwaarden kan de belasting worden
      nageheven.

      2 De na te heffen belasting wordt berekend over:

      a. een tijdsduur van vier aaneensluitende tijdvakken van drie maanden met als laatste tijdvak dat waarin het in het
      eerste lid bedoelde feit wordt geconstateerd, of

      b. , ingeval het een motorrijtuig betreft waarvoor de vrijstelling van [artikel 72, eerste lid, onderdeel n][ref1],
      is verleend maar uit een boekenonderzoek blijkt dat deze vrijstelling ten onrechte is verleend, de tijdsduur
      waarover deze vrijstelling blijkens het boekenonderzoek ten onrechte is verleend.

      3 Indien blijkt dat het motorrijtuig over een gedeelte van de tijdsduur waarover de na te heffen belasting wordt
      berekend, niet op naam heeft gestaan van degene die het motorrijtuig houdt, wordt over dat gedeelte de belasting
      niet nageheven.

      4 De na te heffen belasting wordt verminderd met de belasting die over de periode waarop de naheffingsaanslag
      betrekking heeft voor het motorrijtuig is betaald en voorzover voor de belasting over die periode geen aanspraak op
      teruggaaf van belasting bestaat.

      5 Voor de toepassing van dit artikel wordt een maand gesteld op dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel72
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel76
    references:
      - id: ref1
