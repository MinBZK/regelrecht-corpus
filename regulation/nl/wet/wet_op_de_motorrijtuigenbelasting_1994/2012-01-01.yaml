  - number: '71'
    text: |-
      1 Vrijstelling van belasting wordt op verzoek verleend voor:

      a. motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van zieken en gewonden en die
      als zodanig uiterlijk herkenbaar zijn;

      b. motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van een stoffelijk overschot;

      c. motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van zieke en gewonde dieren en
      die als zodanig uiterlijk herkenbaar zijn.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot hetgeen wordt verstaan onder
      de inrichting en de uiterlijke herkenbaarheid van de motorrijtuigen, bedoeld in het eerste lid.

      3 De inspecteur beslist op een verzoek om vrijstelling van belasting bij voor bezwaar vatbare beschikking.

      4 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '72'
    text: |-
      1 Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen:

      a.

      b. die ten minste 30 jaar geleden voor het eerst in gebruik zijn genomen, en die, voor zover het vrachtauto’s of
      autobussen betreft, niet bedrijfsmatig worden gebruikt;

      c. die uitsluitend worden gebruikt voor defensie of door de politie;

      d. die uitsluitend worden gebruikt door de brandweer en als zodanig uiterlijk herkenbaar zijn;

      e.

      f.

      g.

      h. die zijn ingericht en uitsluitend worden gebruikt als vuilniswagen, kolkenzuiger of straatveegwagen;

      i.

      j. die zijn ingericht en uitsluitend worden gebruikt voor de aanleg en het onderhoud van wegen;

      k.

      l. waarmee gewoonlijk slechts over een geringe afstand gebruik van de weg wordt gemaakt;

      m. waarmee met het oog op een ingevolge [hoofdstuk V van de Wegenverkeerswet 1994][ref1] te verrichten keuring van
      het motorrijtuig tijdens een voor het motorrijtuig geldende schorsing gebruik van de weg wordt gemaakt op de dag
      waarop dat motorrijtuig naar aanleiding van de aanvraag van een keuringsbewijs aan een keuring wordt onderworpen;
      of

      n. die blijkens een ingevolge de [Wet personenvervoer 2000][ref2] geldige vergunning, dan wel voorzover afgegeven
      een vergunningbewijs, zijn bestemd om daarmee als personenauto openbaar vervoer of taxivervoer te verrichten en
      daarvoor geheel of nagenoeg geheel worden gebruikt.

      2 De voorwaarde dat het motorrijtuig wordt gehouden door een openbaar lichaam kan in de in het eerste lid bedoelde
      algemene maatregel van bestuur alleen worden gesteld voor de vrijstellingen genoemd in het eerste lid, onderdeel c.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling als bedoeld in het eerste lid, onderdeel h, j, l en n.

      3 De vrijstelling, bedoeld in het eerste lid, onderdeel b, geldt voor personenauto’s die op 31 december
      2011 nog geen 25 jaar oud waren, niet voor het gedeelte van de belasting dat wordt geheven ingevolge
      [artikel 23, tweede of derde lid][ref4]. De eerste volzin is van overeenkomstige toepassing voor bestelauto’s,
      andere dan bestelauto’s als bedoeld in de [artikelen 24a][ref5] of[ 24b][ref6], die op 31 december 2011 nog geen 25
      jaar oud waren.

      4 De vrijstelling, bedoeld in het eerste lid, onderdeel b, wordt, met inachtneming van het derde lid, mede verleend
      voor motorrijtuigen die niet voldoen aan de voorwaarde dat zij ten minste 30 jaar geleden voor het eerst in gebruik
      zijn genomen, indien het motorrijtuig:

      a. op 31 december 2011 ten minste 25 jaar oud was;

      b. in 1987 voor het eerst in gebruik is genomen, en het tijdstip van eerste ingebruikneming ten minste 26 jaar
      geleden is;

      c. in 1988 voor het eerst in gebruik is genomen, en het tijdstip van eerste ingebruikneming ten minste 27 jaar
      geleden is;

      d. in 1989 voor het eerst in gebruik is genomen, en het tijdstip van eerste ingebruikneming ten minste 28 jaar
      geleden is; dan wel

      e. in 1990 voor het eerst in gebruik is genomen, en het tijdstip van eerste ingebruikneming ten minste 29 jaar
      geleden is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0011470
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0006324#Artikel24a
      [ref6]: https://wetten.overheid.nl/BWBR0006324#Artikel24b
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel72
