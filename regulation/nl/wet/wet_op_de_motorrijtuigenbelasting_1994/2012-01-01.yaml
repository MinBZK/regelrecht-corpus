        afdeling: '2'
  - number: 37d
    text: |-
      1 Indien gebruik van de weg wordt gemaakt met een vrachtauto die deel uitmaakt van een bedrijfsvoertuigenpark
      en die is verbonden met een aanhangwagen die geen deel uitmaakt van dat bedrijfsvoertuigenpark,
      is [artikel 37c][ref1] met betrekking tot die vrachtwagen niet van toepassing gedurende het in
      [artikel 37b, vierde lid, onderdeel a][ref2], bedoelde jaar.

      2 Het gebruik van de weg, bedoeld in het eerste lid, vormt een verzuim ter zake waarvan de inspecteur aan de houder
      een bestuurlijke boete kan opleggen van ten hoogste € 492. De bevoegdheid tot het opleggen van de boete vervalt, in
      afwijking van [artikel 5:45, tweede lid, van de Algemene wet bestuursrecht][ref3], door het verloop van vijf jaren
      na afloop van het in [artikel 37b, vierde lid, onderdeel a][ref4], bedoelde jaar.

      3 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref5] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het eerste lid.


