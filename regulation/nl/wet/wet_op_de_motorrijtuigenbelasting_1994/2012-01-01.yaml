      1 Voor een bestelauto die is ingericht en wordt gebruikt voor het vervoer van een gehandicapte persoon in de cabine
      en voor het gelijktijdige vervoer van een niet-opvouwbare rolstoel ten behoeve van die persoon, bedraagt, onder bij
