        paragraaf: 4.1.3.3
  - number: 37c
    text: |-
      1 De teruggaaf bedraagt over het in [artikel 37b, vierde lid, onderdeel a][ref1], bedoelde jaar het verschil tussen
      de betaalde belasting voor de vrachtauto's die in dat jaar of gedeelten daarvan deel hebben uitgemaakt van het
      bedrijfsvoertuigenpark en de som van de tarieven die per jaar of gedeelten daarvan voor die vrachtauto's ingevolge
      de richtlijn minimaal zouden moeten worden betaald, met dien verstande dat per vrachtauto het hoogste tarief wordt
      genomen van de tarieven die zouden gelden in combinatie met elk van de in het bedrijfsvoertuigenpark opgenomen
      aanhangwagens. Indien het hoogste tarief per jaar volgens de richtlijn lager zou zijn dan  € 256,59 bepaalt de
      inspecteur dat tarief op  € 256,59 of op het evenredig deel daarvan dat overeenstemt met het deel van het jaar
      waarover de belasting is geheven.

      2 De inspecteur beslist op een verzoek om teruggaaf bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel37c
    references:
