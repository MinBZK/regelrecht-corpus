preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de motorrijtuigenbelasting 1966 te vervangen
    door een wet ingevolge welke de motorrijtuigenbelasting voor personenauto's, bestelauto’s en motorrijwielen ter
    zake van het houden van die motorrijtuigen wordt geheven en voor andere motorrijtuigen ter zake van het rijden op
    de weg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder de naam «motorrijtuigenbelasting» wordt een belasting geheven ter zake van het houden van een personenauto,
      een bestelauto, een motorrijwiel, een vrachtauto of een autobus.

      2 Voor motorrijtuigen die behoren tot een bedrijfsvoorraad en voor motorrijtuigen die voor het verrichten
      van werkzaamheden daaraan bij een herstelbedrijf zijn, kan de belasting, onder bij algemene maatregel
      van bestuur te stellen voorwaarden met betrekking tot het gebruik, in afwijking van het eerste lid
      worden geheven ter zake van de ten behoeve van die motorrijtuigen opgegeven kentekens als bedoeld in
      [artikel 37, derde lid, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '2'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder:

      a. motorrijtuig: een voertuig dat is bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend of
      mede door een mechanische kracht, op of aan het voertuig aanwezig, met uitzondering van een bromfiets in de zin van
      [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1];

      b. personenauto: een motorrijtuig op drie of meer wielen, ingericht voor personenvervoer en wel voor het vervoer
      van niet meer dan acht personen, de bestuurder daaronder niet begrepen;

      c. bestelauto: een motorrijtuig op drie of meer wielen niet zijnde een personenauto of een autobus, met een
      toegestane maximum massa van 3 500 kg of minder;

      d. motorrijwiel: een motorrijtuig op twee wielen, alsmede een dergelijk motorrijtuig dat is verbonden met een
      zijspanwagen;

      e. autobus: een motorrijtuig op drie of meer wielen dat is ingericht voor personenvervoer en wel voor het vervoer
      van meer dan acht personen, de bestuurder daaronder niet begrepen;

      f. vrachtauto: een motorrijtuig, niet zijnde een personenauto, een bestelauto, een motorrijwiel of een autobus;

      g. aanhangwagen: een voertuig, niet zijnde een motorrijtuig, dat kennelijk is bestemd om te worden voortbewogen
      door een motorrijtuig;

      h. koppelinrichting: een aan een motorrijtuig bevestigde inrichting met behulp waarvan het motorrijtuig kan worden
      verbonden met een aanhangwagen;

      i. bedrijfsvoorraad: de voorraad motorrijtuigen van een bedrijf van een natuurlijk persoon of rechtspersoon waaraan
      een erkenning als bedoeld in [hoofdstuk IV, paragraaf 5, van de Wegenverkeerswet 1994][ref2] is verleend;

      j. herstelbedrijf: een bedrijf dat in opdracht van derden aan motorrijtuigen onderhoudswerkzaamheden of reparaties
      verricht dan wel veranderingen aanbrengt;

      k. eigen massa: de massa van het voertuig in bedrijfsvaardige staat met inbegrip van de bedrijfsstoffen,
      reservedelen en gereedschappen die behoren tot de normale uitrusting;

      l. toegestane maximum massa: de eigen massa van het voertuig vermeerderd met de voor het voertuig toegestane
      maximum massa aan lading.

      m. toegestane maximum massa van een vrachtauto die is voorzien van een koppelinrichting: de toegestane maximum
      massa van de vrachtauto indien deze niet zou zijn voorzien van een koppelinrichting, verhoogd met de hoogste
      toegestane maximum massa van een aanhangwagen waarmee de vrachtauto kan worden verbonden;

      n. richtlijn: de Richtlijn nr. 1999/62/EG van het Europees Parlement en de Raad van 17 juni 1999 betreffende het in
      rekening brengen van het gebruik van bepaalde infrastructuurvoorzieningen aan zware vrachtvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
