        artikel: '18'
        hoofdstuk: III
        afdeling: '3'
  - number: '21'
    text: |-
      Bij beëindiging van een schorsing geldt als kort tijdvak waarover de belasting moet worden betaald het tijdvak
      dat aanvangt met ingang van de dag waarop de schorsing is opgeheven en dat eindigt met de dag voorafgaande aan de
      eerste dag van het tijdvak met ingang waarvan de belasting voor het eerst na beëindiging van die schorsing moet
      worden betaald op de voet van [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel11
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
  - number: '22'
    text: |-
      1 Voor de toepassing van de tariefbepalingen wordt:

      a. uitgegaan van het motorrijtuig zoals het is ingericht bij de aanvang van het tijdvak;

      b. 1°. de eigen massa van het motorrijtuig afgerond tot het naaste honderdtal kilogrammen, met dien verstande dat
      50 kg naar beneden wordt afgerond;

      2°. de toegestane maximum massa van het motorrijtuig afgerond tot het naaste duizendtal kilogrammen, met dien
      verstande dat een gedeelte van 1000 kg naar beneden wordt afgerond;

      c. als benzine aangemerkt: lichte olie als bedoeld in
      [artikel 27, eerste lid, onderdeel a, van de Wet op de accijns][ref1];

      d. als dieselolie aangemerkt: halfzware olie en gasolie als bedoeld in
      [artikel 27, eerste lid, onderdeel b, van de Wet op de accijns][ref2].

      2 Voor een personenauto of een bestelauto die is voorzien van een installatie voor het verplaatsen of vastzetten
      van een rolstoel, wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden, op verzoek het gewicht
      van die installatie niet meegerekend bij het vaststellen van de eigen massa van het motorrijtuig. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking.

      3 Voor een personenauto of een bestelauto die is ingericht en bestemd om mede te worden aangedreven door een
      elektromotor wordt, mits de aandrijving door de elektromotor zodanig is dat de elektrische energie voor een
      actieradius van ten minste 24 km aaneengesloten stadsverkeer uitsluitend door een batterij of door een brandstofcel
      kan worden geleverd, of mits het piekvermogen van de voor de aandrijving bestemde elektromotor ten minste 15%
      van het maximum vermogen van de verbrandingsmotor bedraagt, onder bij algemene maatregel van bestuur te stellen
      voorwaarden, de eigen massa van het motorrijtuig verminderd met 125 kg.


