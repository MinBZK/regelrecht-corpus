      1 Bij wijziging van de tenaamstelling van een kentekenbewijs wegens wisseling van de houder van het motorrijtuig en
      bij beëindiging van een schorsing bedraagt de belasting voor het motorrijtuig over het korte tijdvak een evenredig
      gedeelte van de belasting over een tijdvak van drie maanden. Voor de toepassing van dit artikel wordt een maand
      gesteld op dertig dagen.

      2 Bedragen van € 5 en minder worden niet geheven.
    url: https://wetten.overheid.nl/BWBR0006324/2012-01-01#Artikel27
  - number: '30'
    text: |-
      1 Voor een personenauto, een bestelauto of een vrachtauto waarvoor een kenteken is opgegeven dat:

      a.

      b. wordt gehouden door een kermis- of circusexploitant en wordt gebruikt voor het vervoer van kermis- of
      circusbenodigdheden;

      c. is ingericht als werktuig of als werkplaats;

      d.

      e.

      f. is ingericht voor het vervoer van paarden ten behoeve van de paardensport en uitsluitend niet-beroepsmatig wordt
      gebruikt,

      bedraagt de belasting in afwijking van de [artikelen 23][ref1], [24][ref2], [24a][ref3], [24b][ref4] of [25a][ref5]
      een kwart van de ingevolge die artikelen verschuldigde belasting.

      2 Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld met betrekking tot de
      toepassing van het eerste lid.


