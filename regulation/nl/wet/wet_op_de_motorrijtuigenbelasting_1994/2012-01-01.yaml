  - number: 37e
    text: |-
      Voor de toepassing van het in dit hoofdstuk bepaalde, wordt de toegestane maximum massa van een aanhangwagen
      afgerond tot het naaste duizendtal kilogrammen, met dien verstande dat een gedeelte van 1000 kg naar beneden wordt
      afgerond.
