  - number: '69'
    text: |-
      1 Indien met betrekking tot een motorrijtuig uit een bedrijfsvoorraad of een motorrijtuig dat voor
      het verrichten van werkzaamheden daaraan bij een herstelbedrijf is, niet is voldaan aan de krachtens
      [artikel 1, tweede lid][ref1], gestelde voorwaarden, kan de belasting worden nageheven.

      2 De na te heffen belasting wordt berekend over een tijdsduur van twaalf maanden, waarbij als laatste dag geldt de
      dag waarvan wordt geconstateerd dat op die dag niet wordt voldaan aan de krachtens [artikel 1, tweede lid][ref2],
      gestelde voorwaarden.

      3 Indien met het motorrijtuig gebruik wordt gemaakt van de weg zonder dat aan de in het tweede lid bedoelde
      voorwaarden wordt voldaan, wordt de naheffingsaanslag opgelegd aan de bestuurder ingeval degene tot wiens
      bedrijfsvoorraad het motorrijtuig behoort of degene die het herstelbedrijf uitoefent aannemelijk maakt, dat van het
      motorrijtuig tegen zijn wil gebruik is gemaakt en hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel1
