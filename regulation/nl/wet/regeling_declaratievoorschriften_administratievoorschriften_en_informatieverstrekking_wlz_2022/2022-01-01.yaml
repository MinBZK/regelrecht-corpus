    text: |-
      1 Wijze van declareren verkeerde bed medisch specialistische zorg

      a. Een vergoeding voor het ‘Verkeerde bed’ kan in rekening worden gebracht vanaf de dag dat de indicatie voor
      medisch specialistische zorg met verblijf in een instelling is beëindigd, het CIZ een Wlz-indicatie (als bedoeld in
      [artikel 3.2.3. van de Wet langdurige zorg][ref1]) heeft vastgesteld en de patiënt noodgedwongen in de instelling
      voor medisch specialistische zorg moet blijven. Het noodgedwongen verblijf ontstaat doordat er nog geen plek bij
      een Wlz-zorgaanbieder beschikbaar is of de Wlz-zorg nog niet thuis geleverd kan worden.

      b. Een vergoeding voor het ‘Verkeerde bed’ is niet van toepassing op cliënten die voorafgaand aan de opname in de
      instelling voor medisch specialistische zorg, zorg met verblijf ontvingen op grond van de [Wlz][ref2].

      Deze cliënten kunnen immers terugkeren naar hun Wlz-verblijfsaanbieder.

      Er kan zich een situatie voordoen waarin een cliënt vanwege een nieuwe, zwaardere Wlz-herindicatie niet kan
      terugkeren naar zijn Wlz-verblijfsaanbieder, omdat die Wlz-aanbieder de desbetreffende zorg niet levert. Voor
      elke dag dat er – in het uiterste geval – nog geen plek bij een andere Wlz-instelling (dat wil zeggen: andere
      rechtspersoon) beschikbaar is en de cliënt noodgedwongen in de instelling voor medisch specialistische zorg moet
      blijven, mag een verkeerde beddag worden gedeclareerd.

      c. De vergoeding kan wel in rekening worden gebracht wanneer een cliënt, die voorafgaand aan de opname vpt of mpt
      ontving, na beëindiging van de indicatie gedwongen in de instelling voor medisch specialistische zorg dient te
      blijven doordat het verlenen van zorg thuis niet meer als verantwoordelijk wordt gezien.

      d. Het tarief dat in rekening mag worden gebracht, is een integraal tarief.

      e. Het tarief dat op grond van de tariefbeschikking*‘Verkeerde bed Wlz’* in rekening wordt gebracht, is een
      maximumtarief.

      f. De tariefbeschikking*‘Verkeerde bed Wlz’* is niet van toepassing op zorgprestaties die in het kader van
      onderlinge dienstverlening door de ene zorgaanbieder aan de andere zorgaanbieder in rekening worden gebracht.

      g. Zorgaanbieders maken bij declaratie aan zorgkantoren/Wlz-uitvoerders in de factuur duidelijk inzichtelijk
      welke prestatie in rekening wordt gebracht en welk tarief daarbij wordt gehanteerd. De declaratie vindt plaats op
      cliëntniveau. Het declaratieoverzicht bestaat uit een overzicht met het aantal geleverde dagen zorg per cliënt, het
      daarbij behorende gehanteerde tarief en het totaalbedrag per declaratieperiode.

      h. Wanneer er sprake is van onderaanneming of uitbesteding wordt de prestatie alleen in rekening gebracht door
      de zorgaanbieder die door het zorgkantoor/de Wlz-uitvoerder voor de betreffende prestatie is gecontracteerd als
      bedoeld in [artikel 7][ref3] (Tarifering onderlinge dienstverlening Wlz) van de Beleidsregel bekostigingscyclus
      Wlz 2022. De zorgaanbieder die de zorg in onderaanneming uitvoert of aan wie de zorgverlening is uitbesteed, mag
      noch een afzonderlijke prestatie noch een deel van de prestatie in rekening brengen aan het zorgkantoor/de Wlz-
      uitvoerder.

      2 Wijze van declareren verkeerde bed ggz

      a. De vergoeding kan in rekening worden gebracht voor cliënten waarbij geen sprake is (geweest) van geneeskundige
      geestelijke gezondheidszorg (ggz) als omschreven bij of krachtens de [Zorgverzekeringswet][ref4] (Zvw).

      b. De vergoeding voor het verkeerde bed ggz kan in rekening worden gebracht vanaf de dag dat het CIZ een Wlz-
      indicatie (als bedoeld in [artikel 3.2.3. van de Wet langdurige zorg][ref5]), niet zijnde een ggz-b of ggz wonen
      Wlz-indicatie, heeft vastgesteld en de cliënt noodgedwongen in een instelling die geneeskundige geestelijke
      gezondheidszorg levert, opgenomen moet blijven. Het noodgedwongen verblijf ontstaat doordat er nog geen plek bij
      een Wlz-zorgaanbieder beschikbaar is of de Wlz-zorg nog niet in de thuissituatie geleverd kan worden.

      c. De vergoeding kan wel in rekening worden gebracht wanneer een cliënt, die voor de opname een volledig pakket
      thuis (vpt) of het modulair pakket thuis (mpt) ontving, gedwongen in een instelling die geneeskundige geestelijke
      gezondheidszorg levert dient te blijven doordat het verlenen van zorg thuis niet meer als verantwoord wordt gezien.

      d. Het tarief is een integraal tarief.

      e. Het tarief dat op grond van de tariefbeschikking*‘Verkeerde bed ggz Wlz’* in rekening wordt gebracht, is een
      maximumtarief.

      f. De *Tariefbeschikking verkeerde bed**Wlz* is niet van toepassing op zorgprestaties die in het kader van
      onderlinge dienstverlening door de ene zorgaanbieder aan de andere in rekening worden gebracht.

      g. Zorgaanbieders maken bij declaratie aan zorgkantoren/Wlz-uitvoerders in de factuur duidelijk inzichtelijk
      welke prestatie in rekening wordt gebracht en welk tarief daarbij wordt gehanteerd. De declaratie vindt plaats op
      cliëntniveau. Het declaratieoverzicht bestaat uit een overzicht met het aantal geleverde dagen zorg per cliënt, het
      daarbij behorende gehanteerde tarief en het totaalbedrag per declaratieperiode.

      h. Wanneer er sprake is van onderaanneming of uitbesteding wordt de prestatie alleen in rekening gebracht door
      de zorgaanbieder die door het zorgkantoor/de Wlz-uitvoerder voor de betreffende prestatie is gecontracteerd als
      bedoeld in [artikel 7][ref6] (Tarifering onderlinge dienstverlening Wlz) van de Beleidsregel bekostigingscyclus
      Wlz 2022. De zorgaanbieder die de zorg in onderaanneming uitvoert of aan wie de zorgverlening is uitbesteed, mag
      noch een afzonderlijke prestatie noch een deel van de prestatie in rekening brengen aan het zorgkantoor/de Wlz-
      uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.2.3
