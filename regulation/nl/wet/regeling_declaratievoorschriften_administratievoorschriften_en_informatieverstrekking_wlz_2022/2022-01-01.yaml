    text: |-
      1 Te verstrekken informatie

      a. Te verstrekken gegevens en inlichtingen

      Zorgaanbieders verstrekken de NZa vóór 1 juni 2023 de hierna genoemde gegevens en inlichtingen:

      − Een ingevulde nacalculatie-opgave 2022. Zorgaanbieders maken gebruik van het nacalculatieformulier 2022 dat door
      de NZa ter beschikking is gesteld;

      − Bij een tweezijdig ingediende nacalculatie-opgave 2022 moeten twee ondertekeningsdocumenten worden gevoegd. Het
      ene ondertekeningsdocument moet voorzien zijn van een handtekening van een persoon die bevoegd is te tekenen namens
      de zorgaanbieder. Het andere ondertekeningsdocument moet voorzien zijn van een handtekening van een persoon die
      bevoegd is te tekenen namens het zorgkantoor/de Wlz-uitvoerder.

      Als de opgave eenzijdig bij de NZa wordt ingediend door de zorgaanbieder, dan moet in ieder geval het
      ondertekeningsdocument van de zorgaanbieder voorzien zijn van een handtekening van een persoon die bevoegd is te
      tekenen;

      − Bij enkele onderdelen van de nacalculatie-opgave is eenzijdige indiening niet mogelijk. Voor de volgende
      onderdelen geldt dat de zorgaanbieder en het zorgkantoor/de Wlz-uitvoerder verplicht zijn de nacalculatie-opgave op
      die onderdelen tweezijdig in te dienen:

        - de prestaties/tarieven extreme kosten van zorggebonden materiaal, extreme kosten van geneesmiddelen,
      inrichtingskosten bij gedwongen verhuizing eenpersoonswoning, inrichtingskosten bij gedwongen verhuizing
      meerpersoonswoning, een en ander zoals geregeld in de Beleidsregel overige kosten Wlz 2022;
        - de prestatie/tarief vergoeding kosten BRMO-uitbraak zoals geregeld in de Beleidsregel BRMO-uitbraak.

      − Bij de nacalculatie-opgave 2022 moet een door de accountant ondertekende controleverklaring worden gevoegd;

      − Indien van toepassing: een door de accountant gewaarmerkte toelichting bij de Vragenlijst controleprotocol;

      − Indien van toepassing: een toelichting bij de Vragen en overige opmerkingen.

      De gegevens en inlichtingen moeten worden verstrekt op de wijze als geregeld in artikel 5 (nacalculatie-opgave
      2022) van de Beleidsregel bekostigingscyclus Wlz 2022, het Controleprotocol nacalculatie 2022 Wlz-zorgaanbieders en
      [artikel 9][ref1] van deze regeling.

      b. Te verstrekken andere gegevens en inlichtingen

      In een specifiek verzoek om informatie als bedoeld in [artikel 61 Wmg][ref2] kan de NZa bepalen welke andere
      gegevens en inlichtingen moeten worden verstrekt voor de definitieve vaststelling van de aanvaardbare kosten
      [Wlz][ref3] 2022 voor de in [artikel 1][ref4] bedoelde zorgaanbieders.

      c. Waarmerking nacalculatie-opgave

      De gehele nacalculatie-opgave 2022 moet worden gewaarmerkt door de accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref5] (met uitzondering van de vragen en overige opmerkingen en
      de eventuele toelichting behorende bij deze vragenlijst).

      De zorgaanbieder moet een gewaarmerkte versie van de nacalculatie-opgave 2022 beschikbaar hebben. De zorgaanbieder
      hoeft deze uitsluitend op verzoek aan de NZa te sturen.

      2 Uitzonderingspositie zelfstandige zorgverleners zonder personeel

      Voor zelfstandige zorgverleners zonder personeel geldt dat zij voor 1 juni 2023 wel een nacalculatie-opgave 2022
      bij de NZa moeten indienen, maar dat zij geen controleverklaring bij de nacalculatie-opgave hoeven te overleggen.
      In zoverre vindt de controle van de totaal financieel gerealiseerde productie 2022 alleen plaats door het
      zorgkantoor/de Wlz-uitvoerder.

      Bovendien hoeft de gehele nacalculatie-opgave 2022 en eventuele toelichting(en) behorende bij de nacalculatie-
      opgave 2022, niet te worden beoordeeld en gewaarmerkt door een accountant.

      3 Te verstrekken informatie in geval van faillissement zorgaanbieder

      a. Afwijking datum uiterste indiening

      Indien de rechtbank het faillissement van een zorgaanbieder uitspreekt en een curator benoemt, kan de NZa de
      uiterste indieningstermijn van de nacalculatie-opgave 2022 tweemaal verlengen (uitstel van indiening verlenen). De
      NZa doet dit uitsluitend op basis van een schriftelijk verzoek van een failliete zorgaanbieder, van de curator van
      de failliete zorgaanbieder of van het zorgkantoor/de Wlz-uitvoerder.

      b. Afwijking vereiste gegevens en inlichtingen

      Voor de definitieve vaststelling van de aanvaardbare kosten Wlz 2022 kan de NZa afwijken van de in
      [artikel 10, eerste lid][ref6] van deze regeling genoemde vereiste gegevens en inlichtingen.

      4 Controleverklaring

      a. Algemeen

      De zorgaanbieder draagt er zorg voor dat een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref7] een uitspraak doet over de juistheid van de verstrekte
      gegevens en inlichtingen als bedoeld in [artikel 4][ref8] en dit bevestigt, op de wijze als beschreven in artikel 5
      (nacalculatie-opgave 2022) van de Beleidsregel bekostigingscyclus Wlz 2022, het Controleprotocol nacalculatie 2022
      Wlz-zorgaanbieders en [artikel 9][ref9] van deze regeling.

      b. Zorgaanbieder met nul productie

      Bij zorgaanbieders met een totaal financieel gerealiseerde productie van nul en waarbij de totaal financiële
      realisatie overige onderdelen ook nul bedraagt, geldt dat zij voor 1 juni 2023 een nacalculatie-opgave 2022
      (nulopgave) bij de NZa moeten indienen. Deze zorgaanbieders hoeven geen controleverklaring bij de nacalculatie 2022
      te overleggen.

      Bovendien hoeft de gehele nacalculatie-opgave 2022 en eventuele toelichting behorende bij de nacalculatie-opgave
      2022 niet te worden beoordeeld en gewaarmerkt door een accountant.

      5 Gebruik eigen informatie

      Wanneer een zorgaanbieder de gegevens en inlichtingen als bedoeld in [artikel 10, eerste lid][ref10], niet, niet
      tijdig of niet volledig verstrekt aan de NZa, kan de NZa op grond van [artikel 69 Wmg][ref11] eigen informatie
      gebruiken om over te gaan tot definitieve vaststelling van de aanvaardbare kosten [Wlz][ref12] 2022 voor de
      desbetreffende zorgaanbieder.


