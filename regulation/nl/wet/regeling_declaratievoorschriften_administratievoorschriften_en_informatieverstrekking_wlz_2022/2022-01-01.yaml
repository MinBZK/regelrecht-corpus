    text: |-
      1 Vastlegging van de zorgprestaties

      a. De vastlegging van de zorgprestaties in de administratie van de leverende zorgaanbieder is volledig, juist en
      actueel. Een adequate audit trail dient gewaarborgd te zijn.

      b. De registratie van de productie vindt plaats door de zorgadministratie op basis van de productieregistratie van
      de zorgafdelingen.

      c. De zorgaanbieder legt voor het zorgkantoor/de Wlz-uitvoerder de noodzakelijke Wlz-registratiegegevens
      vast, conform de landelijk geldende standaarden voor het elektronisch berichtenverkeer in de [Wlz][ref1], de
      informatiestandaard Wlz (iWlz).

      2 Gegevens in het cliëntdossier

      De zorgaanbieder neemt minstens de volgende gegevens van de individuele cliënt op in het cliëntdossier:

      − NAW-gegevens;

      − burgerservicenummer;

      − indicatiebesluit;

      − verwijzing zorgkantoor/Wlz-uitvoerder;

      − verzekeringsgegevens;

      − datum geplande aanvang zorgverlening;

      − datum aanvang zorgverlening;

      − afdeling/behandelaar;

      − zorgplan/zorgzwaarte;

      − omvang en aard geleverde zorgprestaties;

      − mutaties in de zorgverlening.

      3 Vastlegging van onderaanneming c.q. uitbesteding

      De zorgaanbieder legt vast of, en zo ja, in welke mate er sprake is van onderaanneming c.q. uitbesteding van Wlz-
      zorg. De zorgaanbieder verstrekt deze informatie aan het zorgkantoor/de Wlz-uitvoerder.

      In het kader van onderaanneming c.q. uitbesteding is de opdrachtgevende zorgaanbieder er voor verantwoordelijk dat
      de uitvoerende zorgaanbieder beschikt over een volledige, juiste en actuele administratie met betrekking tot de
      zorg die door de uitvoerende zorgaanbieder is geleverd. Op verzoek van de opdrachtgevende zorgaanbieder, de NZa
      en/of de Wlz-uitvoerder/het zorgkantoor zal de uitvoerende zorgaanbieder de administratie met betrekking tot de
      geleverde zorg te allen tijde inzichtelijk kunnen maken.

      In het kader van onderaanneming c.q. uitbesteding is de opdrachtgevende zorgaanbieder er voor verantwoordelijk dat
      de administratieve organisatie zodanig ingericht is, dat te allen tijde een audit-trail mogelijk is met betrekking
      tot de zorg die door de uitvoerende zorgaanbieder is geleverd.

      4 Interne controle

      a. De zorgaanbieder voert een interne controle uit op de gevoerde administratie. De controle richt zich op de
      vereisten zoals die in deze regeling met betrekking tot de verplichte administratie zijn gesteld.

      b. De interne controlefunctie omvat de controle op:

      1° de juistheid van de gedeclareerde productie, waarbij wordt vastgesteld dat:

      − de gedeclareerde zorg feitelijk is geleverd aan de cliënt;

      − de cliënt over een geldig indicatiebesluit beschikt; en

      − voor zover het gaat om modulaire zorg: de gedeclareerde zorg binnen het indicatiebesluit is geleverd.

      2° het gedeclareerde tarief, waarbij wordt vastgesteld dat dit tarief overeenkomt met het door partijen
      contractueel overeengekomen tarief en dat dit tarief binnen de grenzen blijft van het door de NZa in de
      tariefbeschikking vastgelegde bedrag(en), tariefsoort of berekeningswijze voor die prestatie.

      c. De interne controle moet zijn gebaseerd op een risico-analyse waarbij wordt getoetst in hoeverre de risico's
      door de interne beheersing zijn afgedekt. Aanvullende controles moeten worden verricht op posten waar nog een
      resterend risico aanwezig is.

      d. De zorgaanbieder moet bij de uitvoering van zijn controle rekening houden met een betrouwbaarheid van 95%
      en een nauwkeurigheid van 99%. Bij de uitvoering van de controle of de gedeclareerde zorg daadwerkelijk aan de
      cliënt is geleverd en of deze zorg, gelet op de indicatie, voor de cliënt passend is, kan worden volstaan met een
      nauwkeurigheid van 95%. De hantering van deze percentages kan naast kwantitatief ook kwalitatief onderbouwd worden.

      e. De controleaanpak, de uitgevoerde controlewerkzaamheden en de controlebevindingen worden door de interne
      controle afdeling/functionaris vastgelegd. Controlebevindingen worden periodiek gerapporteerd aan de bestuurder.
      Ook moet er, indien nodig, een aantoonbare vastlegging aanwezig zijn van de ondernomen vervolgacties en de
      opvolging hiervan.

      f. Artikel 9, vierde lid, is niet van toepassing op zelfstandige zorgverleners zonder personeel.

      5 Controleverklaring

      a. De zorgaanbieder stelt in de nacalculatie-opgave 2022 een verantwoording op over het totaalbedrag van de
      gerealiseerde productie en overige onderdelen (totaal financieel gerealiseerde productie en totaal financiële
      realisatie overige onderdelen) met behulp van het door de NZa voorgeschreven nacalculatieformulier 2022.

      De zorgaanbieder geeft een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref2]
      opdracht tot het uitvoeren van een accountantsonderzoek naar de juistheid van bovengenoemde verantwoording. De
      vragenlijst controleprotocol en eventuele toelichting maken ook deel uit van de verantwoording. De accountant voert
      zijn onderzoek uit op basis van de voorschriften van het bij deze regeling behorende Controleprotocol nacalculatie
      2022 Wlz-zorgaanbieders. De accountant geeft een controleverklaring af bij de nacalculatie-opgave 2022. De
      zorgaanbieder stuurt de nacalculatie-opgave 2022 met de bijbehorende controleverklaring aan het zorgkantoor/de
      Wlz-uitvoerder.

      Voor de precieze procesgang rondom de verantwoording via het nacalculatieformulier 2022 wordt verwezen naar
      het Controleprotocol nacalculatie 2022 Wlz-zorgaanbieders, [artikel 10][ref3] van deze regeling en artikel 5
      (nacalculatie-opgave 2022) van de Beleidsregel bekostigingscyclus Wlz 2022.

      b. Voor zelfstandige zorgverleners zonder personeel geldt dat zij voor 1 juni 2023 wel een nacalculatie-opgave 2022
      bij de NZa moeten indienen, maar dat zij geen controleverklaring bij de nacalculatie-opgave hoeven te overleggen.

      c. Bij zorgaanbieders met een totaal financieel gerealiseerde productie van nul en waarbij de totaal financiële
      realisatie overige onderdelen ook nul bedraagt, geldt dat zij voor 1 juni 2023 een nacalculatie-opgave 2022
      (nulopgave) bij de NZa moeten indienen.

      Deze zorgaanbieders hoeven geen controleverklaring bij de nacalculatie 2022 te overleggen. Bovendien hoeft de
      gehele nacalculatieopgave 2022 en eventuele toelichting behorende bij de nacalculatieopgave 2022 niet te worden
      beoordeeld en gewaarmerkt door een accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref3]: https://wetten.overheid.nl/BWBR0045785#Artikel10
