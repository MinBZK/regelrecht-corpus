      1 Administratievoorschriften COT advies

      a. COT advies is een prestatie per uur. De prestatie wordt beschreven in de Beleidsregel Prestatiebeschrijving en
      tarieven inzet crisis en ondersteuningsteam (COT) 2022.

      b. De penvoerende zorgaanbieder dient de volgende gegevens over de COT inzet inzichtelijk te maken:

      a) het aantal uren beschikbaar zijn per discipline zonder oproep voor COT advies;

      b) het aantal uren inzet COT advies per discipline per traject en in totaal;

      c) het aantal oproepen voor COT advies;

      d) de doorlooptijd per traject (datum aanvang COT advies tot en met datum afsluiting COT advies);

      e) de kosten die betrekking hebben op de inzet van COT.

      2 Declaratievoorschriften COT advies

      a. De inzet van een COT is alleen mogelijk voor cliënten met een Wlz-indicatie met een vg grondslag die intramuraal
      verblijven of thuis verblijven en die bij een crisisregisseur ghz zijn aangemeld voor een crisisplaatsing.

      b. De inzet van het COT duurt maximaal 13 weken. Gedurende deze periode neemt de ureninzet van het COT af. Deze
      periode kan eenmalig worden verlengd met maximaal 13 weken na expliciete toestemming van de crisisregisseur ghz.
      Na deze periode is het wenselijk dat een COT voor nazorg, implementatie en borging gedurende maximaal 6 maanden af
      en toe contact blijft houden met het team waar advies aan is gegeven. Voor de verlengingsperiode en de periode van
      nazorg maakt het COT afspraken met de crisisregisseur ghz over de duur en de ureninzet.

      c. De declaratie van COT advies prestaties vindt plaats op cliëntniveau. Dit houdt in dat de declaratie bestaat uit
      een overzicht van het per cliënt geleverde aantal eenheden, het daarbij gehanteerde tarief en het totaalbedrag per
      prestatie per declaratieperiode.

      d. Indien sprake is van een deel van een uur wordt het in rekening te brengen tarief naar evenredigheid berekend.
      Indien er tussen het zorgkantoor/de Wlz-uitvoerder en de zorgaanbieder geen schriftelijke overeenkomst bestaat over
      de te hanteren werkwijze bij het afronden van de tijd van de geleverde prestaties, wordt de tijd afgerond op het
      dichtstbijzijnde veelvoud van vijf minuten.

      e. De leidinggevende vervult in het COT niet de rol van hiërarchisch leidinggevende, maar is adviseur voor het
      management van de zorgaanbieder waarvoor de hulp van het COT is ingeroepen.

      f. Beschikbaarheid en reiskosten van het COT mogen niet gedeclareerd worden. Deze moeten betaald worden uit de te
      declareren COT prestaties.

      g. De inzet van de crisisregisseur ghz kan niet onder de prestaties en de tarieven van het COT gedeclareerd worden.

      h. Het zorgkantoor heeft per regio een contract met één zorgaanbieder die optreedt als penvoerder van het COT en
      verantwoordelijk is voor de registratie en declaratie van de ureninzet van het COT. Alleen de penvoerder mag de
      uren inzet van het COT declareren.

      i. De volgende uren kunnen worden gedeclareerd:

      ○ de uren dat het crisisondersteuningsteam daadwerkelijk aanwezig is bij de zorginstelling voor interventie/advies;

      ○ de tijd voor interventie/advies via telefonisch contact tussen crisisondersteuningsteam en de zorginstelling;

      ○ de tijd van multidisciplinair overleg.

      j. De zorgaanbieder is verplicht bij einde inzet COT een melding einde zorg te doen bij het zorgkantoor.
