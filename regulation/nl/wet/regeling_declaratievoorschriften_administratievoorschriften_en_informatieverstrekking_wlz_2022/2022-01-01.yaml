  - number: '3'
    text: |-
      Deze regeling is, met uitzondering van [artikel 6][ref1], van toepassing op zorgaanbieders die zorg of een dienst
      leveren als omschreven bij of krachtens de [Wlz][ref2].

      Deze regeling is, met uitzondering van de [artikelen 4][ref3], [5][ref4], [7][ref5], [8][ref6] en [9][ref7],
      tevens van toepassing op instellingen voor medisch specialistische zorg die zorg of een dienst leveren in
      combinatie met verblijf als omschreven bij of krachtens de [Wlz][ref8].


