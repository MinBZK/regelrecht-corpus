      1 Administratievoorschriften prestatie gespecialiseerde zorg [Wlz][ref1]

      a. De prestatie gespecialiseerde zorg [Wlz][ref2] is een prestatie die per
      dag wordt geadministreerd en gedeclareerd. De prestatie is beschreven in de
      [Beleidsregel prestatiebeschrijving en tarief gespecialiseerde zorg Wlz][ref3].

      b. De zorg wordt geleverd in combinatie met een zzp.

      c. De administratieve organisatie van de zorgaanbieder die de expertise levert, dient zo ingericht te zijn dat een
      audit mogelijk is.

      d. Voor elke prestatie gespecialiseerde zorg [Wlz][ref4] die door een zorgaanbieder aan een zorgkantoor/Wlz-
      uitvoerder gedeclareerd is, moet te allen tijde te herleiden zijn op welke manier het gedeclareerde tarief is
      bepaald.

      e. Voor de NZa en het zorgkantoor/de Wlz-uitvoerder is hierbij per cliënt inzichtelijk:

      a) De in het zorgplan vastgestelde doelen;

      b) De directe kosten om de gespecialiseerde zorg in groepsverband of op individueel niveau mogelijk te maken per
      dag;

      c) De indirecte kosten om de gespecialiseerde zorg in groepsverband of op individueel niveau mogelijk te maken
      per dag;

      d) Het bedrag voor de gespecialiseerde zorg dat per jaar is afgesproken;

      e) Het afgesproken tarief per dag.

      2 Declaratievoorschriften prestatie gespecialiseerde zorg [Wlz][ref5]

      a. De zorgaanbieder declareert de prestatie gespecialiseerde zorg [Wlz][ref6] voor zover deze is geleverd.

      b. De meerzorg, geleverd via de prestatie zzp-meerzorg, wordt als onderdeel van de bekostiging via deze
      beleidsregel bekostigd. De prestatie gespecialiseerde zorg kan dus niet in combinatie met de prestatie zzp-meerzorg
      worden gedeclareerd.

      c. De prestatie gespecialiseerde zorg kan niet in combinatie met de toeslagen, genoemd in de Beleidsregel
      zorgzwaartepakketten en volledig pakket thuis, die gerelateerd zijn aan de aandoeningen van de doelgroep worden
      gedeclareerd. De bekostiging van de gespecialiseerde zorg die met de toeslagen werd bekostigd, is per 2022
      onderdeel van deze beleidsregel.

      Aanbieders die gespecialiseerde zorg leveren, kunnen, indien nodig en te duiden in het totaal van de kosten, wel
      gebruik blijven maken van de toeslagen die geen relatie hebben tot de aandoening van een doelgroep.

      d. Zorgaanbieders kunnen geen gebruik maken van innovatieve zorgprestaties volgend uit de Beleidsregel Innovatie en
      Kleinschalige experimenten die betrekking hebben op het leveren van expertise aan de doelgroepen die genoemd worden
      in de [Beleidsregel prestatiebeschrijving en tarief gespecialiseerde zorg Wlz][ref7].

      e. De zorgaanbieder declareert de prestatie gespecialiseerde zorg [Wlz][ref8] alleen indien de prestatie is
      geadministreerd volgens de door de NZa vastgestelde administratievoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0035917
