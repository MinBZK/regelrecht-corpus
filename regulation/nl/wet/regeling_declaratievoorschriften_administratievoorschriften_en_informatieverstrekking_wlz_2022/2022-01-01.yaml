    text: |-
      1 Wijze van declareren

      Zorgaanbieders specificeren de declaratie als volgt:

      a. Zorgaanbieders maken bij declaratie aan de zorgkantoren/Wlz-uitvoerders in de factuur duidelijk zichtbaar welke
      prestaties in rekening worden gebracht en welk tarief daarbij wordt gehanteerd. De declaratie van zzp-, vpt- en
      modulaire prestaties vindt plaats op cliëntniveau. Dit houdt in dat de declaratie bestaat uit een overzicht van
      het per cliënt geleverde aantal eenheden, het daarbij gehanteerde tarief en het totaalbedrag per prestatie per
      declaratieperiode.

      b. In afwijking van [artikel 4, eerste lid, onder a][ref1], vindt de declaratie van de geleverde productie van
      een aantal prestaties plaats op prestatieniveau. Dit houdt in dat de declaratie bestaat uit een overzicht van het
      geleverde aantal eenheden, het daarbij gehanteerde tarief en het totaalbedrag per prestatie per declaratieperiode.
      Het betreft de volgende prestaties:

      1° De dagen waarop een door het zorgkantoor/de Wlz-uitvoerder én zorgaanbieder aangemerkt bed voor crisiszorg niet
      bezet is door een cliënt;

      2° Alle prestaties geleverd aan ernstig bedreigde personen die zijn opgenomen in het stelsel van Bewaken en
      Beveiligen van het Openbaar Ministerie.

      c. Voor prestaties met declaratie eenheid van een uur geldt dat alleen de directe contacttijd in uren tussen
      zorgverlener en cliënt (systeem) gedeclareerd kan worden.

      d. Indien sprake is van prestaties gedurende een deel van een uur wordt het in rekening te brengen tarief naar
      evenredigheid berekend. Indien er tussen het zorgkantoor/de Wlz-uitvoerder en de zorgaanbieder geen schriftelijke
      overeenkomst bestaat over de te hanteren werkwijze bij het afronden van de tijd van de geleverde prestaties, wordt
      de tijd afgerond op het dichtstbijzijnde veelvoud van vijf minuten.

      e. In aanvulling op [artikel 4, eerste lid, onder d][ref2], kan voor een telefonisch
      consult zoals beschreven in de prestatie behandeling so/avg (H335/H336) in
      [bijlage 1 van de Beleidsregel prestatiebeschrijvingen en tarieven modulaire zorg 2022][ref3] in het geval van
      meerdere telefonische contact(en) op dezelfde dag de prestatie voor dit doel maximaal één keer per dag per cliënt
      worden gedeclareerd.

      f. Zorgaanbieders die op basis van artikel 14, 15 en 16 van de Beleidsregel prestatiebeschrijvingen en tarieven
      zorgzwaartepakketten en volledig pakket thuis 2022 declareren, moeten aan de NZa kenbaar maken wat de feitelijke
      zorgvraag is van de cliënt en of deze overeenkomt met de zorgbehoefte zoals die tot uiting komt in de indicatie.

      2 Declaratie afwezigheidsdagen bij zzp

      a. Zorgaanbieders declareren de prestaties voor zover deze daadwerkelijk zijn geleverd.

      b. Voor de bekostiging van de prestaties zzp, verblijfscomponent-niet geïndiceerde partner, crisiszorg vv
      & lvg, crisiszorg ghz, logeren, logeren zevmb, gespecialiseerde zorg, klinisch intensieve behandeling (kib)
      en alle toeslagen als bedoeld in artikel 6 en 7 van de Beleidsregel prestatiebeschrijvingen en tarieven
      zorgzwaartepakketten en volledig pakket thuis 2022 geldt als voorwaarde dat de cliënt aanwezig is in de instelling.

      c. In afwijking van [artikel 4, tweede lid, onder b][ref4], geldt voor afwezigheid het volgende:

      Voor cliënten die aangewezen zijn op een zzp-prestatie komen de volgende dagen in aanmerking voor bekostiging ter
      hoogte van het afgesproken tarief met ingang van de eerste volledige dag van afwezigheid van de cliënt:

      1° De dagen dat een cliënt tijdelijk is opgenomen bij een andere zorgaanbieder of op een andere locatie van de
      zorgaanbieder binnen dezelfde rechtspersoon, en daar verblijft voor:

      − Wlz-zorg met behandeling (zzp inclusief behandeling) waarbij de cliënt eerder alleen Wlz-verblijf zonder
      behandeling ontving (zzp-exclusief behandeling);

      − Revalidatiezorg waaronder ook wordt verstaan geriatrische revalidatiezorg zoals omschreven in de [Zvw][ref5] en
      VV herstelgerichte behandeling met verpleging en verzorging (vv9b) zoals omschreven in de [Wlz][ref6];

      − Gespecialiseerde ggz;

      − Medisch specialistische zorg.

      Indien de cliënt waarop een situatie van toepassing is zoals bedoeld onder 1° naar verwachting langer dan 91 dagen
      afwezig is, moet het zorgkantoor/de Wlz-uitvoerder binnen de periode van 91 dagen toestemming hebben verleend voor
      een verlenging van de periode waarin afwezigheid wordt bekostigd.

      2° De dagen dat een cliënt tijdelijk afwezig is door vakantie of detentie. De dagen worden alleen bekostigd indien
      de cliënt voor de vakantie of detentie reeds 14 dagen verbleef bij de instelling. Per kalenderjaar kunnen niet meer
      dan 42 afwezigheidsdagen als gevolg van vakantie of detentie worden bekostigd.

      3° De dagen dat een cliënt die als leerling voor dagonderwijs staat ingeschreven en dit onderwijs ook daadwerkelijk
      volgt tijdelijk afwezig is door vakantie. Er worden niet meer afwezigheidsdagen bekostigd dan de wettelijke
      vakantieduur.

      4° De maximaal twee aaneengesloten dagen dat een cliënt afwezig is in een periode van zeven dagen (maandag tot en
      met zondag), voorheen weekendverlof.

      d. De in [artikel 4, tweede lid, onder c][ref7], genoemde voorwaarden hebben geen betrekking op de toeslagen
      die zijn vermeld in artikel 7 van de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en
      volledig pakket thuis 2022, met uitzondering van de toeslagen woonzorg ghz (Z978, Z979 en Z980) en de toeslag
      gespecialiseerde epilepsiezorg laag (Z975).

      De in [artikel 4, tweede lid, onder c][ref8], genoemde voorwaarden hebben ook geen betrekking op:

        - afzonderlijk afgesproken dagbesteding;
        - vervoer naar dagbesteding/dagbehandeling;
        - afzonderlijk afgesproken behandeling;

      3 Declaratie afwezigheidsdagen bij vpt

      a. Zorgaanbieders declareren de prestaties voor zover deze daadwerkelijk zijn geleverd.

      b. Voor de bekostiging van de prestaties vpt, dagbesteding, behandeling, gespecialiseerde zorg en alle toeslagen
      als genoemd in deze beleidsregel geldt als voorwaarde dat de prestatie daadwerkelijk geleverd is.

      Dit houdt in dat afwezigheid niet wordt bekostigd. Onder afwezigheid wordt verstaan dat de cliënt niet verblijft op
      zijn/haar woonadres.

      c. In afwijking van [artikel 4, derde lid, onder b][ref9], geldt voor afwezigheid het volgende:

      Voor cliënten die aangewezen zijn op of als leveringsvorm hebben gekozen voor een vpt-prestatie komen de volgende
      dagen in aanmerking voor bekostiging ter hoogte van het afgesproken vpt-tarief met ingang van de eerste dag van
      afwezigheid van de cliënt:

      1° De dagen dat een cliënt tijdelijk is opgenomen bij een zorgaanbieder en daar verblijft voor:

      − Wlz-zorg met behandeling (zzp inclusief behandeling);

      − Revalidatiezorg waaronder ook wordt verstaan geriatrische revalidatiezorg zoals omschreven in de [Zvw][ref10] en
      VV herstelgerichte behandeling met verpleging en verzorging (vv9b) zoals omschreven in de [Wlz][ref11];

      − Gespecialiseerde ggz of;

      − Medisch specialistische zorg.

      Indien de cliënt waarop een situatie van toepassing is zoals bedoeld onder 1° naar verwachting langer dan 91 dagen
      afwezig is moet het zorgkantoor/de Wlz-uitvoerder binnen de periode van 91 dagen toestemming hebben verleend voor
      een verlenging van de periode waarin afwezigheid wordt bekostigd.

      2° De dagen dat een cliënt tijdelijk afwezig is door vakantie, tijdelijk verblijf bij familie, logeren in verband
      met het ontlasten van de mantelzorger, of detentie. De dagen worden alleen bekostigd indien de cliënt voorafgaand
      aan de afwezigheidsperiode reeds 14 dagen zijn vpt-dagen ontving. Per kalenderjaar kunnen niet meer dan 42
      afwezigheidsdagen als gevolg van bovengenoemde worden bekostigd, met uitzondering van verblijf bij familie in de
      weekenden.

      d. De in [artikel 4, derde lid, onder c][ref12], genoemde voorwaarden hebben geen betrekking op de toeslagen
      die zijn vermeld in artikel 7 van de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en
      volledig pakket thuis 2022, met uitzondering van de toeslagen woonzorg ghz (V978, V979 en V980) en de toeslag
      gespecialiseerde epilepsiezorg laag (V975).

      De in [artikel 4, derde lid, onder c][ref13], genoemde voorwaarden hebben ook geen betrekking op:

        - afzonderlijk afgesproken dagbesteding;
        - vervoer naar dagbesteding;
        - afzonderlijk afgesproken behandeling.

      4 Declaratie afwezigheidsdagen bij dtv

      a. Zorgaanbieders declareren de prestaties voor zover deze daadwerkelijk zijn geleverd.

      b. Voor de bekostiging van zorg via dtv geldt als voorwaarde dat de cliënt aanwezig is in de instelling.

      c. In afwijking van [artikel 4, tweede lid, onder b][ref14], geldt voor afwezigheid het volgende:

      Voor cliënten die in deeltijd verblijven, komen de volgende dagen in aanmerking voor bekostiging ter hoogte van het
      afgesproken tarief met ingang van de eerste volledige dag van afwezigheid van de cliënt:

      1° De dagen dat een cliënt tijdelijk is opgenomen bij een andere zorgaanbieder of op een andere locatie van de
      zorgaanbieder binnen dezelfde rechtspersoon, en daar verblijft voor:

      − Wlz-zorg met behandeling (zzp inclusief behandeling);

      − Revalidatiezorg waaronder ook wordt verstaan geriatrische revalidatiezorg zoals omschreven in de [Zvw][ref15] en
      VV herstelgerichte behandeling met verpleging en verzorging (vv9b) zoals omschreven in de [Wlz][ref16];

      − Gespecialiseerde ggz;

      − Medisch specialistische zorg.

      Indien de cliënt waarop een situatie van toepassing is zoals bedoeld onder 1° naar verwachting langer dan 91 dagen
      afwezig is, moet het zorgkantoor/de Wlz-uitvoerder binnen de periode van 91 dagen toestemming hebben verleend voor
      een verlenging van de periode waarin afwezigheid wordt bekostigd.

      2° De dagen dat een cliënt tijdelijk afwezig is door vakantie of detentie. Er geldt een ander maximum aantal te
      declareren afwezigheidsdagen bij deeltijdverblijf. Dit maximum is afhankelijk van het aantal dagen dat een cliënt
      volgens het vaste patroon in deeltijd verblijft:

      − 3,5 dag 12 afwezigheidsdagen

      − 4 dagen 14 afwezigheidsdagen

      − 4,5 dag 16 afwezigheidsdagen

      3° De dagen dat een cliënt die als leerling voor dagonderwijs staat ingeschreven en dit onderwijs ook daadwerkelijk
      volgt tijdelijk afwezig is door vakantie.

      d. De in [artikel 4, vierde lid, onder c][ref17], genoemde voorwaarden hebben geen betrekking op de toeslagen
      die zijn vermeld in artikel 7 van de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en
      volledig pakket thuis 2022, met uitzondering van de toeslagen woonzorg ghz (Z978, Z979 en Z980) en de toeslag
      gespecialiseerde epilepsiezorg laag (Z975).

      De in [artikel 4, tweede lid, onder c][ref18], genoemde voorwaarden hebben ook geen betrekking op:

      − afzonderlijk afgesproken dagbesteding;

      − vervoer naar dagbesteding/dagbehandeling;

      − afzonderlijk afgesproken behandeling.

      5 Onderaanneming of uitbesteding

      a. Indien sprake is van onderaanneming of uitbesteding wordt de prestatie alleen in rekening gebracht door de
      zorgaanbieder die door het zorgkantoor/de Wlz-uitvoerder voor de betreffende prestatie is gecontracteerd. De
      zorgaanbieder die de zorg in onderaanneming uitvoert of aan wie de zorgverlening is uitbesteed, mag noch een
      afzonderlijke prestatie noch een deel van de prestatie in rekening brengen aan het zorgkantoor/de Wlz-uitvoerder.

      b. In afwijking van [artikel 4, vierde lid, onder a][ref19], geldt voor zorgaanbieders die tandheelkundige zorg als
      omschreven bij of krachtens de [Wlz][ref20] leveren aan cliënten die verblijf en behandeling ontvangen van dezelfde
      zorgaanbieder waar de cliënt verblijft, dat zij de Wlz-prestaties voor tandheelkundige zorg direct in rekening
      mogen brengen aan het zorgkantoor/de Wlz-uitvoerder. Ook als sprake is van onderaanneming of uitbesteding.

      6 Deeltijdverblijf (dtv)

      Zorgaanbieders die op basis van de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en
      volledig pakket thuis 2022 deeltijdverblijf declareren, moeten voldoen aan de volgende voorwaarden:

      − Dtv kan geleverd worden aan cliënten met een Wlz-indicatie vv-4 t/m vv-8, vg-3 t/m vg-8, lg-2, lg-4 t/m lg-7, zg-
      aud-2 t/m zg-aud-4, zg-vis-2 t/m zg-vis-5.

      − Dtv kan alleen geleverd worden indien er sprake is van een gemiddeld vast en structureel patroon van verblijf in
      een instelling en thuis. Hierbij moet de tijdspanne benoemd worden waarin het patroon zich moet voordoen.

      − De toegestane omvang van dtv is 3½, 4 of 4½ etmalen per week. De bekostigingssystematiek in de langdurige zorg
      kent geen halve etmalen. Daarom wordt dtv bezien over een periode van 14 etmalen (in een periode van 14 etmalen
      gaat het dan om gemiddeld 7, 8 of 9 etmalen).

      − Dtv omvat zzp-prestaties exclusief behandeling. Om declaratie van dtv mogelijk te maken, zijn aparte codes
      beschikbaar gesteld in de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en volledig pakket
      thuis 2022. Als dtv wordt gedeclareerd, moeten die codes worden gebruikt/vermeld. De specifieke behandeling kan via
      de mpt-prestaties gedeclareerd worden indien nodig.

      − Dtv kan niet gecombineerd worden met mutatiedagen.

      − In de ghz-sector en ggz wonen wordt dagbesteding zowel tijdens het dtv als tijdens de mpt-etmalen thuis bekostigd
      uit het mpt via de H8xx-codes (ghz) en de codes H001G-H005G (ggz wonen)voor dagbesteding, en de codes H881-H887
      (ghz) en H410-H416 (ggz wonen) voor vervoer van en naar de dagbesteding.

      − In de vv-sector wordt dagbesteding bekostigd via een combinatie van zzp’s inclusief dagbesteding en mpt:

      ○ De dagbesteding die de cliënt tijdens het dtv ontvangt, wordt bekostigd uit het zzp inclusief dagbesteding.

      ○ De dagbesteding die de cliënt tijdens het verblijf in de thuissituatie ontvangt, wordt vanuit het mpt bekostigd.
      Declaratie van dagbesteding en vervoer in geval van dtv gaat via de volgende prestaties:









                            Dagbesteding en vervoer ghz en ggz wonen
                            (etmalen thuis en
                            etmalen instelling)1


                            Dagbesteding en vervoer vv (etmalen thuis)2


                            Dagbesteding en vervoer vv
                            (etmalen instelling)3






                            H8xx-codes (dagbesteding ghz)
                            H881-H887 (vervoer ghz)
                            H001G-H005Gcodes (dagbesteding, ggz wonen)
                            H410-H416 codes (vervoer dagbesteding ggz wonen)


                            Dagbesteding en vervoer vv: H8xx-codes


                            Dagbesteding vv: onderdeel van zzp-tarief
                            Vervoer vv: Z9010 of Z9011






      1 Het betreft hier de dagbestedings- en vervoersprestaties voor de gehandicaptenzorg uit de
      [Beleidsregel prestatiebeschrijvingen en tarieven modulaire zorg][ref21].

      2 Het betreft hier de dagbestedings- en vervoersprestatie vv uit de
      [Beleidsregel prestatiebeschrijvingen en tarieven modulaire zorg][ref22].

      3 Het betreft hier de dagbestedings- en vervoersprestatie vv uit de
      [Beleidsregel prestatiebeschrijvingen en tarieven modulaire zorg][ref23].

      7 Overbruggingszorg sglvg en lvg

      Zorgaanbieders die op basis van de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en
      volledig pakket thuis 2022 overbruggingszorg sglvg en lvg declareren moeten voldoen aan de volgende voorwaarden:

      − De overbruggingszorg kan alleen worden toegekend aan cliënten die een sglvg- of lvg-indicatie hebben gehad en
      vervolgens zijn geherindiceerd naar een andere Wlz-indicatie. Overbruggingszorg kan alleen worden gedeclareerd
      indien er na de herindicatie nog geen passende plaats beschikbaar is voor de betreffende cliënt.

      − De overbruggingszorg geldt vanaf de dag dat de sglvg- of lvg-indicatie afloopt tot aan de dag dat de cliënt
      verhuist naar een passende Wlz-instelling.

      − Overbruggingszorg kan worden toegekend voor een periode van 13 weken. Indien na 13 weken nog geen bij de nieuwe
      indicatie passende plaats voor de cliënt is gevonden, kan deze eenmalig worden verlengd met nogmaals 13 weken.
      Zorgaanbieder en zorgkantoor dienen hierover af te stemmen.

      8 Vervoer bij dagbesteding/dagbehandeling in de gehandicaptenzorg

      Zorgaanbieders maken voor het declareren van vervoer naar en van de dagbesteding in de gehandicaptenzorg gebruik
      van de Tabel prestatiecategorieën vervoer dagbesteding/dagbehandeling ghz conform artikel 6 van de Beleidsregel
      prestatiebeschrijvingen en tarieven zorgzwaartepakketten en volledig pakket thuis en de prestatiebeschrijving
      in de [Beleidsregel prestatiebeschrijvingen en tarieven modulaire zorg][ref24]. Afhankelijk van de cliënt- en
      vervoerskenmerken valt het vervoer van een cliënt in een van de categorieën C0 tot en met C6.

      *Afwijkingsmogelijkheid*

      Zorgaanbieder en zorgkantoor hebben de mogelijkheid om in individuele gevallen af te wijken van de van toepassing
      zijnde categorie. Dit kan om twee redenen:

      1. Meer maatwerk

      De huidige indeling in zeven prestatiecategorieën sluit aan bij de huidige praktijk. Er kunnen echter situaties
      zijn dat het tarief voor de toepasbare categorie te hoog of te laag is. Indien er een structurele noodzaak
      is, kunnen zorgaanbieder en zorgkantoor in gezamenlijk overleg afwijken van de vastgestelde categorie-indeling
      zoals in bovengenoemde tabel staat weergegeven. Met deze vrijheid om in afstemming met het zorgkantoor cliënten
      in een andere categorie te plaatsen, kan de vergoeding nog beter aansluiten bij de situatie van individuele
      zorgaanbieders. Een overeengekomen afwijking moet beargumenteerd worden vastgelegd.

      2. Minder administratie bij wisselende afstanden of vervoermiddelen

      Een zorgaanbieder kan, om de administratieve last zo gering mogelijk te houden, de volgende werkwijze hanteren:

      ○ bij wisselende vervoersafstanden het adres waar de cliënt geregistreerd staat (als verblijfsadres), of de
      dagbestedingslocatie waar de cliënt in de meeste gevallen naar toe gaat, of een gemiddelde afstand als uitgangspunt
      te nemen, en de categorie die daarbij hoort standaard te declareren, in plaats van de verschillen in afstanden
      tussen dagen/weken steeds in de administratie bij te houden;

      ○ bij wisselende manieren van vervoer als uitgangspunt voor declaratie de wijze van vervoer te nemen zoals cliënt
      in de meeste gevallen reist, in plaats van de wijze van vervoer steeds in de administratie te moeten aanpassen.

      Een zorgaanbieder moet het vastleggen wanneer hij deze werkwijze hanteert.


