    text: |-
      1 Administratievoorschriften zzp-meerzorg

      a. Zzp-meerzorg is een prestatie die per dag wordt geadministreerd en gedeclareerd. De prestatie is beschreven in
      de Beleidsregel prestatiebeschrijving en tarief zzp-meerzorg Wlz.

      b. De administratieve organisatie van de zorgaanbieder die meerzorg levert, dient zo ingericht te zijn dat een
      audit mogelijk is.

      c. Voor elke prestatie zzp-meerzorg die door een zorgaanbieder aan een zorgkantoor/Wlz-uitvoerder gedeclareerd is,
      moet te allen tijde te herleiden zijn op welke manier het gedeclareerde tarief is bepaald.

      d. Voor de NZa en het zorgkantoor/de Wlz-uitvoerder is hierbij per cliënt inzichtelijk:

      a) De in het zorgplan vastgestelde doelen;

      b) De directe kosten om de meerzorg in groepsverband of op individueel niveau mogelijk te maken per dag;

      c) De indirecte kosten om de meerzorg in groepsverband of op individueel niveau mogelijk te maken per dag;

      d) Het bedrag voor zzp-meerzorg dat per jaar is afgesproken;

      e) Het afgesproken zzp-meerzorg tarief per dag.

      2 Declaratievoorschriften zzp-meerzorg

      a. De zorgaanbieder declareert alleen zzp-meerzorg indien de prestatie is geadministreerd volgens de door de NZa
      vastgestelde administratievoorschriften.

      b. Zorgaanbieders declareren zzp-meerzorg voor zover deze is geleverd met uitzondering van het volgende:

      De zzp-meerzorg is bedoeld als aanvulling op de reguliere zzp. Indien en voor zover uit [artikel 4][ref1] van deze
      regeling blijkt dat de zzp voor een aantal dagen in het jaar niet gedeclareerd kan worden, kan ook de zzp-meerzorg
      niet worden gedeclareerd.

      Voor zzp-meerzorg geldt, conform [artikel 4, tweede lid, onder c][ref2] van deze regeling, het volgende:

      Voor cliënten die aangewezen zijn op een zzp-prestatie komen de volgende dagen in aanmerking voor bekostiging ter
      hoogte van het afgesproken tarief met ingang van de eerste dag van afwezigheid van de cliënt:

      1° De dagen dat een cliënt tijdelijk is opgenomen bij een andere zorgaanbieder of op een andere locatie van de
      zorgaanbieder binnen dezelfde rechtspersoon, en daar verblijft voor:

      − Wlz-zorg met behandeling (zzp inclusief behandeling) waarbij de cliënt eerder alleen Wlz-verblijf zonder
      behandeling ontving (zzp-exclusief behandeling);

      − revalidatiezorg waaronder ook wordt verstaan geriatrische revalidatiezorg zoals omschreven in de [Zvw][ref3] en
      vv herstelgerichte behandeling met verpleging en verzorging (vv9b) zoals omschreven in de [Wlz][ref4];

      − gespecialiseerde ggz;

      − medisch specialistische zorg.

      Indien de cliënt waarop een situatie van toepassing is zoals bedoeld onder 1° naar verwachting langer dan 91 dagen
      afwezig is, moet het zorgkantoor/de Wlz-uitvoerder binnen de periode van 91 dagen toestemming hebben verleend voor
      een verlenging van de periode waarin afwezigheid wordt bekostigd.

      2° De dagen dat een cliënt tijdelijk afwezig is door vakantie of detentie. De dagen worden alleen bekostigd indien
      de cliënt voor de vakantie of detentie reeds 14 dagen verbleef bij de instelling. Per kalenderjaar kunnen niet meer
      dan 42 afwezigheidsdagen als gevolg van vakantie of detentie worden bekostigd.

      3° De dagen dat een cliënt die als leerling voor dagonderwijs staat ingeschreven, en dit onderwijs ook
      daadwerkelijk volgt, tijdelijk afwezig is door vakantie. Er worden niet meer afwezigheidsdagen bekostigd dan de
      wettelijke vakantieduur.

      4° De maximaal twee aaneengesloten dagen dat een cliënt afwezig is in een periode van zeven dagen (maandag tot en
      met zondag), voorheen weekendverlof.

      c. Indien de daadwerkelijke zorgverlening en bijbehorende kosten structureel in grote mate afwijken van de geplande
      zorg en kosten, wordt ook het afgesproken zzp-meerzorg tarief bijgesteld in overeenstemming met de structureel
      daadwerkelijk geleverde zorg. Dit bijgestelde zzp-meerzorg tarief wordt dan gedeclareerd.

      d. Als er meerzorg wordt gedeclareerd, is het niet mogelijk om ook andere toeslagen in rekening te brengen.
      De kosten waarvoor de toeslagen ter dekking zijn, worden onder de kosten van meerzorg opgenomen in de
      tariefberekening.

      e. Het is niet toegestaan om voor één cliënt op één dag meer dan éénmaal een zzp-meerzorg in rekening te brengen.

      f. Het tarief dat een zorgaanbieder in rekening brengt voor zzp-meerzorg wordt berekend door het jaarbedrag voor
      meerzorg zoals met het zorgkantoor afgesproken, te delen door 365. Dit tarief is ten hoogste gelijk aan het door de
      NZa in de tariefbeschikking genoemde bedrag (maximum tarief) voor die prestatie. Het tarief wordt afgerond volgens
      de rekenkundige methode zoals omschreven in [artikel 1][ref5].

      g. Zorgaanbieders maken bij declaratie in de factuur het zzp-meerzorg dat in rekening wordt gebracht duidelijk
      zichtbaar en welk tarief daarbij wordt gehanteerd. De declaratie van zzp-meerzorg vindt plaats op cliëntniveau. Dit
      houdt in dat de declaratie bestaat uit een overzicht van het per cliënt geleverde aantal dagen zzp-meerzorg en het
      gehanteerde zzp-meerzorg tarief.


