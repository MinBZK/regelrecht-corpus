  - number: '17'
    text: |-
      1 Voor het geval na toepassing van [artikel 15][ref1] is gebleken dat de vergunningen niet op de in
      [artikel 7 van het Frequentiebesluit][ref2] bedoelde wijze kunnen worden verleend, wijst de minister een
      veilingmeester en een notaris aan.

      2 De veilingmeester leidt de veiling en draagt zorg voor een goed en ordelijk verloop van de veiling.

      3 De veilingmeester handelt bij de uitoefening van zijn taak in overeenstemming met de minister.

      4 De notaris heeft tijdens de veilingprocedure een controlerende taak ten behoeve van een ordelijk verloop van
      de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel7
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel17
