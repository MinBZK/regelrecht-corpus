  - number: '16'
    text: |-
      1 Indien uit de aanvraag blijkt dat is voldaan aan de eisen, bedoeld in [artikel 13][ref1], en na toepassing
      van [artikel 15][ref2] is gebleken dat de vergunningen niet op de in [artikel 7 van het Frequentiebesluit][ref3]
      bedoelde wijze kunnen worden verleend, stelt de minister de aanvrager hiervan schriftelijk in kennis. De minister
      deelt de aanvrager hierbij tevens mede op welke kavel of kavels als bedoeld in [artikel 3][ref4] hij gerechtigd is
      een bod uit te brengen.

      2 Bij de kennisgeving, bedoeld in het eerste lid, wordt aan de aanvrager met betrekking tot de kavel of kavels
      waarop hij gerechtigd is een bod uit te brengen, tevens bekend gemaakt hoeveel aanvragers er met betrekking tot die
      kavel of kavels gerechtigd zijn een bod uit te brengen.

      3 In afwijking van het tweede lid wordt, indien in het totaal slechts twee aanvragers gerechtigd zijn een bod uit
      te brengen die elk voor beide kavels een aanvraag hebben ingediend, beiden hebben aangegeven maximaal één kavel
      te willen verwerven en allebei dezelfde voorkeur hebben, naast het aantal aanvragers dat gerechtigd is een bod uit
      te brengen tevens bekend gemaakt dat de twee aanvragers ieder een aanvraag hebben ingediend voor beide kavels en
      beiden slechts één kavel wensen te verwerven.

      4 In afwijking van het tweede lid wordt, indien in het totaal slechts twee aanvragers gerechtigd zijn een bod uit
      te brengen, waarvan de ene aanvrager slechts een aanvraag voor één kavel heeft ingediend, en de andere aanvrager
      voor beide kavels een aanvraag heeft ingediend, maar heeft aangegeven maximaal één kavel te willen verwerven en de
      voorkeur heeft opgegeven voor de kavel waarvoor de eerstgenoemde aanvrager ook een aanvraag heeft ingediend, aan de
      eerstgenoemde aanvrager naast het aantal aanvragers dat gerechtigd is een bod uit te brengen tevens bekend gemaakt
      dat de tweede aanvrager tevens als enige aanvrager de andere kavel heeft aangevraagd en slechts één kavel wenst
      te verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0015491#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009997#Artikel7
