  - number: '15'
    text: |-
      1 Na de vaststelling, bedoeld in [artikel 14, eerste lid][ref1], stelt de minister aan de hand van de opgaven,
      bedoeld in [artikel 7][ref2], van de aanvragers die aan de eisen, bedoeld in [artikel 13][ref3], voldoen, vast of
      de voor WLL beschikbare vergunningen op de in [artikel 7 van het Frequentiebesluit][ref4] bedoelde wijze kunnen
      worden verleend.

      2 Een vergunning wordt slechts op de in [artikel 7 van het Frequentiebesluit][ref5] bedoelde wijze verleend indien:

      a. in het totaal slechts één aanvrager die aan de eisen, bedoeld in [artikel 13][ref6], voldoet, een aanvraag heeft
      ingediend;

      b. een aanvrager die aan de eisen, bedoeld in [artikel 13][ref7], voldoet, als enige aanvrager een aanvraag voor
      een van de kavels als bedoeld in [artikel 3][ref8] heeft ingediend en enkel een aanvraag voor die kavel heeft
      ingediend;

      c. een aanvrager die aan de eisen, bedoeld in [artikel 13][ref9], voldoet, een aanvraag voor beide kavels als
      bedoeld in [artikel 3][ref10] heeft ingediend en:

      1°. heeft aangegeven maximaal één kavel te willen verwerven, als enige aanvrager de voorkeur voor een van de kavels
      als bedoeld in [artikel 3][ref11] heeft opgegeven en er verder geen enkele aanvraag voor die kavel is ingediend; of

      2°. heeft aangegeven twee kavels te willen verwerven en als enige aanvrager een aanvraag voor een van de kavels als
      bedoeld in [artikel 3][ref12] heeft ingediend; of

      d. twee aanvragers die aan de eisen, bedoeld in [artikel 13][ref13], voldoen, allebei een aanvraag voor beide
      kavels als bedoeld in [artikel 3][ref14] hebben ingediend, beiden maximaal één kavel willen verwerven en allebei
      een andere voorkeur hebben.


