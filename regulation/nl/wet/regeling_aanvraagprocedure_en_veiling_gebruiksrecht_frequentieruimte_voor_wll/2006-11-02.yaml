  - number: '4'
    text: |-
      1 Degene die in aanmerking wil komen voor een vergunning voor WLL verzoekt de minister per brief of per
      elektronische post om het beschikbaar stellen van een aanvraagdocument. Het aanvraagdocument kan worden opgevraagd
      met ingang van 1 september 2003, 09.00 uur. Het aanvraagdocument kan worden afgehaald op het in het vierde lid
      genoemde adres, of wordt, indien daar in de brief om is verzocht, toegezonden.

      2 Het verzoek wordt als volgt geadresseerd:

      De Minister van Economische Zaken

      p/a mr. C.A. de Zeeuw, notaris

      Pels Rijcken & Drooglever Fortuijn

      Postbus 11756

      2502 AT Den Haag

      e-mail: wll@prdf.nl

      3 Voor de beschikbaarstelling van het aanvraagdocument is een bedrag van € 250,– verschuldigd. Het bedrag kan
      worden voldaan door middel van contante betaling bij het afhalen van het aanvraagdocument dan wel door middel van
      overboeking onder vermelding van ‘aanvraagdocument vergunningen WLL’ naar het volgende bankrekeningnummer:

      21.30.13.495,

      Fortis bank Nederland N.V., Den Haag,

      t.n.v. Pels Rijcken & Droogleever Fortuijn,

      inzake derdengelden notariaat.

      4 Beschikbaarstelling van het aanvraagdocument door overhandiging bij het afhalen dan wel door toezending geschiedt
      nadat het in het derde lid genoemde bedrag is voldaan. Het afhalen geschiedt op het volgende adres:

      De Minister van Economische Zaken

      p/a mr. C.A. de Zeeuw, notaris

      Pels Rijcken & Droogleever Fortuijn

      Koningin Julianaplein 30

      Gebouw Babylon

      Kantoren A, 5e verdieping

      Den Haag

      5 Het bedrag, genoemd in het derde lid, wordt niet geretourneerd.

      6 De identiteit van degene die in aanmerking wenst te komen voor een vergunning is tot het moment dat de aanvraag
      is ingediend alleen aan de notaris bekend.
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel4
  - number: '5'
    text: |-
      1 Eenieder aan wie overeenkomstig [artikel 4][ref1] een aanvraagdocument is verstrekt, kan met betrekking tot dat
      document per brief of per elektronische post en per brief vragen stellen aan de minister.

      2 De vragen worden in de Nederlandse taal gesteld en zodanig geformuleerd dat deze niet tot de
      identiteit van de vragensteller herleidbaar zijn. De brieven worden geadresseerd op de wijze, genoemd in
      [artikel 4, tweede lid][ref2], of afgeleverd op het adres, genoemd in [artikel 4, vierde lid][ref3].

      3 De vragen, bedoeld in het eerste lid, worden uiterlijk op 17 september 2003 om 14.00 uur per brief op het adres
      genoemd in [artikel 4, tweede of vierde lid][ref4], ingediend.

      4 Uiterlijk op 29 september 2003 zendt de minister aan eenieder aan wie een aanvraagdocument is verstrekt
      schriftelijk antwoord op de vragen die voldoen aan de eisen, bedoeld in het eerste tot en met het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel4
