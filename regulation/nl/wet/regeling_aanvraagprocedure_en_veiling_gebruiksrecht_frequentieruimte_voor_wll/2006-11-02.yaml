  - number: '24'
    text: |-
      1 De veilingmeester beslist omtrent de geldigheid van een uitgebracht bod.

      2 Indien een bod niet voldoet aan de [artikelen 22, derde, vierde, vijfde of zesde lid][ref1], of
      [23, eerste lid, onder b][ref2], wordt de deelnemer op aanwijzing van de veilingmeester door tussenkomst van de
      notaris in de gelegenheid gesteld alsnog aan genoemde bepalingen te voldoen binnen een door de veilingmeester te
      stellen termijn.

      3 Een bod is ongeldig indien:

      a. het niet voldoet aan [artikel 23, eerste lid, onder a][ref3];

      b. na toepassing van het tweede lid nog niet is voldaan aan de daarin genoemde bepalingen.

      4 De deelnemer van wie de veilingmeester heeft vastgesteld dat deze een ongeldig bod als bedoeld in het derde lid
      heeft uitgebracht, wordt hiervan door de notaris afzonderlijk op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0015491#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0015491#Artikel23
