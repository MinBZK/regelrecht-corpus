  - number: '23'
    text: |-
      1 Een bod wordt uitgebracht op een biedkaart die:

      a. niet eerder dan het in [artikel 22, tweede lid, onder a][ref1], bedoelde tijdstip en niet later dan het in
      [artikel 22, tweede lid, onder b][ref2], bedoelde tijdstip wordt ingediend;

      b. volledig en op de juiste wijze is ingevuld en ondertekend.

      2 De notaris stelt vast of de biedkaart niet eerder, onderscheidenlijk niet later dan de in het eerste lid, onder
      a, bedoelde tijdstippen is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0015491#Artikel22
