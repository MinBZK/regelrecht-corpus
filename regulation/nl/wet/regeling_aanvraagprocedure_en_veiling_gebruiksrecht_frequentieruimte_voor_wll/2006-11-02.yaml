  - number: '7'
    text: |-
      De aanvrager geeft in de aanvraag aan op welke kavel of kavels als bedoeld in [artikel 3][ref1] de aanvraag
      betrekking heeft, alsmede hoeveel vergunningen hij maximaal wil verwerven. Indien de aanvraag betrekking heeft op
      beide kavels, maar de aanvrager maximaal één vergunning wenst te verwerven, geeft de aanvrager tevens aan welke
      kavel zijn voorkeur heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel3
