        bwb_id: BWBR0009997
        artikel: '7'
  - number: '18'
    text: |-
      1 Een deelnemer onthoudt zich voorafgaand aan en gedurende de veilingprocedure van afspraken of onderling
      afgestemde feitelijke gedragingen die afbreuk doen aan de tot stand te brengen mededinging in de veilingprocedure.

      2 De minister kan een deelnemer die handelt in strijd met het eerste lid van deelname aan de veiling uitsluiten.

      3 Een tijdens de veiling uitgebracht bod door een van deelname aan de veiling uitgesloten deelnemer is ongeldig.
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel18
  - number: '19'
    text: |-
      1 De minister kan de veiling opschorten.

      2 De minister kan onder meer tot opschorting van de veiling overgaan indien naar zijn oordeel sprake is van
      afspraken of gedragingen in strijd met [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel18
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015491
        artikel: '18'
        paragraaf: '5'
  - number: '20'
    text: |-
      1 De kavels worden via een veiling met gesloten bod geveild.

      2 Een veiling met gesloten bod omvat één veilingronde.

      3 De kavels worden gelijktijdig geveild.

      4 De deelnemers kunnen een bod uitbrengen op de kavel of kavels die zijn aangegeven in de kennisgeving, bedoeld in
      [artikel 16, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel16
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015491
        artikel: '16'
        paragraaf: '3'
  - number: '21'
    text: |-
      Een deelnemer is vanaf het moment dat hij een bod heeft uitgebracht tot en met het tijdstip waarop de
      veiling is afgerond onvoorwaardelijk en onherroepelijk aan zijn bod gebonden, tenzij hij op grond van
      [artikel 18, tweede lid][ref1], wordt uitgesloten van verdere deelname aan de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel18
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015491
        artikel: '18'
        paragraaf: '5'
  - number: '22'
    text: |-
      1 Tegelijk met de kennisgeving, bedoeld in [artikel 16, eerste lid][ref1], wordt aan iedere deelnemer een biedkaart
      verstrekt. Het model van deze biedkaart is als [bijlage 2][ref2] bij deze regeling gevoegd.

      2 Bij het verstrekken van de biedkaart wordt tevens vermeld:

      a. vanaf welk tijdstip de biedkaart kan worden ingediend;

      b. op welk tijdstip de biedkaart uiterlijk moet zijn ingediend;

      c. op welk adres de biedkaart per post dan wel door middel van persoonlijke overhandiging moet worden ingediend.

      3 Een bod wordt uitsluitend uitgebracht door middel van de in het eerste lid bedoelde biedkaart op het in het
      tweede lid, onder c, bedoelde adres.

      4 De biedkaart wordt in de Nederlandse taal ingevuld.

      5 Het bedrag van het bod wordt in letters geschreven en wordt vermeld in hele euro’s.

      6 De deelnemer aan de veiling die een bod uitbrengt, voldoet een bedrag ter hoogte van zijn bod tot zekerheid
      van de gestanddoening van zijn bod. Het bedrag dient mede ter zekerheid van al hetgeen de deelnemer overigens
      in verband met de veiling verschuldigd is. Uiterlijk op het in het tweede lid, onder b, bedoelde tijdstip,
      is het bedoelde bedrag, onder vermelding van ‘zekerheidstelling WLL’ ontvangen op het bankrekeningnummer,
      genoemd in [artikel 4, derde lid][ref3], of is voor het bedoelde bedrag ter zekerheidstelling een bankgarantie
      volgens het model dat als [bijlage 3][ref4] bij deze regeling is gevoegd, overgelegd aan de notaris op het in
      [artikel 4, vierde lid][ref5], genoemde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0015491
      [ref3]: https://wetten.overheid.nl/BWBR0015491#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0015491
      [ref5]: https://wetten.overheid.nl/BWBR0015491#Artikel4
