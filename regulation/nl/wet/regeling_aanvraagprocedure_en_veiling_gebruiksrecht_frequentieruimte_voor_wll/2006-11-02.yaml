preamble:
  text: |-
    Gelet op de artikelen 4, eerste lid, 6, eerste lid, en 8, eerste en tweede lid, van het Frequentiebesluit en
    artikel 5, eerste lid, van het Besluit vergoedingen Telecommunicatiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Economische Zaken;

      b. WLL: digitale radiosystemen gebaseerd op multipoint technologie, zoals beschreven in de door het Europese
      Telecommunicatie Standaardisatie Instituut (ETSI) opgestelde geharmoniseerde norm, waarmee radioverbindingen in
      duplex gerealiseerd kunnen worden tussen een vast centraal punt en meerdere vast opgestelde aansluitpunten;

      c. aanvraagdocument: document als bedoeld in [artikel 5, eerste lid, van het Frequentiebesluit][ref1] ten behoeve
      van de verdeling van frequentieruimte voor WLL;

      d. aanvrager: degene die een aanvraag voor een vergunning voor WLL doet;

      e. deelnemer: aanvrager die gerechtigd is een bod uit te brengen;

      f. kavel: aantal opeenvolgende frequenties dat ter beschikking is voor de exploitatie van een vergunning voor WLL.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel5
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '5'
  - number: '2'
    text: |-
      Ingevolge het besluit van de minister van 20 augustus 2003 (Stcrt. 2003, 162) zijn voor WLL de volgende twee
      vergunningen beschikbaar die door middel van een veiling zullen worden verleend:

      a. een vergunning in de 3,5 GHz band, met frequentiebereik 3500–3580 MHz; en

      b. een vergunning in de 2,6 GHz band, met frequentiebereik 2523–2667 MHz.
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel2
  - number: '3'
    text: |-
      De radiofrequenties, bedoeld in [artikel 2][ref1], worden ten behoeve van de veiling verdeeld in de volgende
      kavels:

      a. de radiofrequenties, bedoeld in [artikel 2, onder a][ref2], in kavel A;

      b. de radiofrequenties, bedoeld in [artikel 2, onder b][ref3], in kavel B.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015491#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015491#Artikel2
