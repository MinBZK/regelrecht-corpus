  - number: '13'
    text: |-
      Een aanvrager voldoet aan de volgende eisen:

      a. de aanvrager is een rechtspersoon, opgericht in overeenstemming met het recht van een van de lidstaten van de
      Europese Unie of een van de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging binnen de Europese Economische
      Ruimte;

      b. wat betreft de financiële positie van de aanvrager:

      1°. de aanvrager verkeert niet in staat van faillissement, noch is een verzoek tot faillietverklaring van de
      aanvrager ingediend,

      2°. de aanvrager is geen surcéance van betaling verleend, noch is ten aanzien van de aanvrager surcéance van
      betaling aangevraagd, en

      3°. geen substantieel beslag is gelegd op bedrijfsmiddelen van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel13
  - number: '14'
    text: |-
      1 De minister stelt binnen vier weken na de datum, genoemd in [artikel 8, eerste lid][ref1], vast of de aanvrager
      voldoet aan de eisen, bedoeld in [artikel 13][ref2].

      2 Indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in [artikel 13][ref3] is voldaan, wijst de minister
      de aanvraag af. De minister stelt de desbetreffende aanvrager schriftelijk op de hoogte van zijn besluit.


