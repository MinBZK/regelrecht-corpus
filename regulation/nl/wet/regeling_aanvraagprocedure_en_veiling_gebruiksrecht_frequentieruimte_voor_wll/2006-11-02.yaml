  - number: '25'
    text: |-
      1 De veilingmeester stelt na de veilingronde vast welke verdeling van geldige biedingen de hoogste totaalopbrengst
      geeft.

      2 In geval twee of meer verdelingen van geldige biedingen dezelfde hoogste totaalopbrengst geven, stelt de
      veilingmeester aan de hand van het volgende vast welke verdeling wordt aangemerkt als de verdeling met de hoogste
      totaalopbrengst:

      a. indien er een enkele verdeling is die leidt tot toewijzing aan twee verschillende deelnemers, wordt die
      verdeling aangemerkt als verdeling met de hoogste totaalopbrengst;

      b. indien er twee of meer verdelingen zijn die leiden tot toewijzing aan twee verschillende deelnemers, stelt
      de veilingmeester, na loting door de notaris, vast welke verdeling wordt aangemerkt als verdeling met de hoogste
      totaalopbrengst;

      c. indien er geen enkele verdeling is die leidt tot toewijzing aan twee verschillende deelnemers, stelt de
      veilingmeester, na loting door de notaris, vast welke verdeling wordt aangemerkt als verdeling met de hoogste
      totaalopbrengst.
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel25
  - number: '26'
    text: |-
      Na de vaststelling, bedoeld in [artikel 25][ref1], deelt de veilingmeester aan de deelnemers de uitslag van de
      veiling mee, alsmede aan elke deelnemer aan wie een kavel is toegewezen, welke kavel aan hem is toegewezen. Hiermee
      is de veiling geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel25
    url: https://wetten.overheid.nl/BWBR0015491/2006-11-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015491
        artikel: '25'
        paragraaf: '6'
  - number: '27'
    text: |-
      1 Na het einde van de veiling verleent de minister onverwijld aan de deelnemer, bedoeld in [artikel 26][ref1], de
      vergunning voor de betreffende kavel.

      2 De deelnemer, bedoeld in het eerste lid, die ter voldoening van het bedrag ter zekerheidstelling een bankgarantie
      heeft overgelegd, betaalt het door hem verschuldigde bedrag ter hoogte van zijn bod binnen twee weken volgend op
      het tijdstip waarop de veiling is geëindigd op het bankrekeningnummer, genoemd in [artikel 4, derde lid][ref2],
      onder vermelding van ‘WLL-veilingbod’. Zodra het verschuldigde bedrag is ontvangen wordt de bankgarantie
      teruggegeven aan de bank die deze bankgarantie heeft afgegeven door middel van de procedure zoals beschreven in
      het als [bijlage 3][ref3] bij deze regeling opgenomen model van de bankgarantie. De Minister van Economische Zaken
      stelt de vergunninghouder onverwijld op de hoogte van het teruggeven van de bankgarantie.

      3 Indien de deelnemer, bedoeld in het eerste lid, niet aan zijn betalingsverplichting als bedoeld in het tweede lid
      voldoet, wordt de door hem overgelegde bankgarantie voor de betaling aangewend.

      4 Indien de deelnemer, bedoeld in het eerste lid, ter voldoening van het bedrag ter zekerheidstelling een
      waarborgsom heeft gestort, wordt de door hem gestorte waarborgsom voor de betaling van het door hem verschuldigde
      bedrag ter hoogte van zijn bod aangewend.

      5 De minister betaalt de deelnemer aan wie geen kavel is toegewezen, en die ter voldoening van het bedrag
      ter zekerheidstelling, een waarborgsom heeft gestort, deze waarborgsom vermeerderd met de rente van een
      éénmaandsdeposito van de bank, bedoeld in [artikel 4, derde lid][ref4], terug of geeft, indien de deelnemer
      ter voldoening van het bedrag ter zekerheidstelling een bankgarantie heeft overgelegd, deze bankgarantie terug
      aan de bank die deze bankgarantie heeft afgegeven door middel van de procedure zoals beschreven in het als
      [bijlage 3][ref5] bij deze regeling opgenomen model van de bankgarantie. De Minister van Economische Zaken stelt de
      vergunninghouder onverwijld op de hoogte van het teruggeven van de bankgarantie.


      [ref1]: https://wetten.overheid.nl/BWBR0015491#Artikel26
