  - number: '6'
    text: |-
      1 De aanvraag bevat de gegevens en bescheiden, bedoeld in de bij deze regeling behorende [bijlage 1][ref1], en
      wordt overeenkomstig die bijlage ingedeeld.

      2 De aanvraag bevat tevens de gegevens, bedoeld in [artikel 7][ref2].

      3 De aanvraag is in de Nederlandse taal gesteld en aangeduid als het originele exemplaar. Dit exemplaar wordt door
      de aanvrager ondertekend.

      4 De aanvraag gaat vergezeld van drie als zodanig aangeduide afschriften.Indien er verschillen bestaan tussen het
      originele exemplaar en de afschriften, is het originele exemplaar bepalend.

      5 De aanvrager informeert de minister per brief die wordt geadresseerd op de in [artikel 4, tweede lid][ref3],
      genoemde wijze onverwijld over wijzigingen met betrekking tot de in het eerste lid bedoelde gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0015491
      [ref2]: https://wetten.overheid.nl/BWBR0015491#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0015491#Artikel4
