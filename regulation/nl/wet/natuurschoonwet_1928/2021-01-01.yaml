  - number: '10.1'
    text: |-
      Voor de toepassing van de [artikelen 7a, eerste lid, onderdeel a][ref1], en [8a][ref2] en de [artikelen 9a][ref3]
      en [9c van deze wet][ref4], alsmede van [artikel 5, onderdeel a, van de Wet op de vennootschapsbelasting 1969][ref5]
      (Stb. 469) en [artikel 10.9 van de Wet inkomstenbelasting 2001][ref6] worden onroerende zaken die gedurende de
      op de voet van [artikel 4, tweede lid][ref7], vastgestelde termijn niet opnieuw kunnen worden aangemerkt als een
      landgoed, gelijkgesteld met landgoederen.


