$id: natuurschoonwet_1928
regulatory_layer: WET
publication_date: '2020-12-23'
valid_from: '2021-01-01'
bwb_id: BWBR0001939
url: https://wetten.overheid.nl/BWBR0001939/2021-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is om, tot bevordering van behoud van natuurschoon,
    sommige van landgoederen geheven wordende belastingen nader te regelen;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan, bij deze:
  url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.a
    text: |-
      landgoed: een geheel of gedeeltelijk met natuurterreinen, bossen of andere houtopstanden bezette onroerende zaak
        - daaronder begrepen die waarop een buitenplaats of andere, bij het karakter van het landgoed passende, opstallen
      voorkomen - voor zover het blijven voortbestaan van die onroerende zaak in zijn karakteristieke verschijningsvorm
      voor het behoud van het natuurschoon wenselijk is, en:
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.a.1°
    text: de onroerende zaak in Nederland is gelegen, of
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.a.2°
    text: |-
      de onroerende zaak is gelegen in een andere lidstaat van de Europese Unie of een staat waarmee Nederland een
      regeling is overeengekomen die voorziet in de uitwisseling van inlichtingen en deze zaak een element vormt van het
      Nederlands cultureel erfgoed.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.b
    text: 'eigenaar:'
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      de eigenaar van een onroerende zaak die niet is bezwaard met het beperkt recht van vruchtgebruik of, behoudens in
      gevallen als bedoeld in het derde lid, dat van erfpacht;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.b.2°
    text: de vruchtgebruiker of, behoudens in gevallen als bedoeld in het derde lid, de erfpachter;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.c
    text: |-
      economische eigendom: een samenstel van rechten en verplichtingen met betrekking tot een onroerende zaak, dat een
      belang bij die zaak vertegenwoordigt. Het belang omvat ten minste enig risico van waardeverandering en komt toe
      aan een ander dan de civiel-juridische eigenaar. De verlening van uitsluitend het recht op levering wordt niet
      aangemerkt als overdracht van economische eigendom;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.d
    text: 'Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.1.e
    text: 'Onze Ministers: Onze Minister van Landbouw, Natuur en Voedselkwaliteit en Onze Minister van Financiën.'
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: '1.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de voorwaarden waaraan een onroerende
      zaak moet voldoen om te kunnen worden aangemerkt als een landgoed. Die voorwaarden betreffen:
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.2.a
    text: |-
      de oppervlakte van de onroerende zaak, waarbij mede in aanmerking kan worden genomen de oppervlakte van één
      aangrenzende onroerende zaak die als een landgoed is aangemerkt of gelijktijdig met de eerstgenoemde onroerende
      zaak als een landgoed wordt aangemerkt, indien tussen de beide onroerende zaken een nauwe historische band bestaat;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.2.b
    text: |-
      het percentage van de oppervlakte van de onroerende zaak dat ten minste met natuurterreinen, bossen of andere
      houtopstanden bezet dient te zijn alsmede de aard van de natuurterreinen, bossen en andere houtopstanden;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.2.c
    text: |-
      de omvang en hoedanigheid van de niet met natuurterreinen, bossen of andere houtopstanden bezette terreinen, al dan
      niet gerelateerd aan de hoedanigheid van direct aan de onroerende zaak grenzende terreinen;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.2.d
    text: de wijze en de aard van de bebouwing;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.2.e
    text: het soort gebruik dat van de terreinen en de opstallen wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: 1.2.f
    text: |-
      de criteria om aangemerkt te worden als element van het Nederlands cultureel erfgoed ingeval de onroerende zaak
      niet in Nederland is gelegen.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: '1.3'
    text: |-
      Indien een onroerende zaak bezwaard is met het recht van erfpacht wordt, onder bij algemene maatregel van bestuur
      te stellen voorwaarden, in plaats van de erfpachter de hoofdgerechtigde van die onroerende zaak aangemerkt als de
      eigenaar, indien de hoofdgerechtigde aantoont dat bij de erfpachter geen economische eigendom van de onroerende
      zaak berust.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: '1.4'
    text: |-
      In afwijking in zoverre van het tweede lid worden bij algemene maatregel van bestuur regels gesteld inzake de
      voorwaarden waaraan een onroerende zaak, die voldoet aan de in het tweede lid, onderdelen a, c, d en e bedoelde
      voorwaarden, doch niet aan de voorwaarden, bedoeld in het tweede lid, onderdeel b, moet voldoen om te kunnen worden
      aangemerkt als een landgoed.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel1
  - number: '2.1'
    text: |-
      De eigenaar die zijn onroerende zaak wenst aangemerkt te zien als een landgoed, doet aan Onze Ministers een daartoe
      strekkend verzoek dat wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel2
  - number: '2.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel2
  - number: 2.2.a
    text: de wijze van indiening van een verzoek als bedoeld in het eerste lid en de besluitvorming daarover, en
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de omstandigheden waaronder een verzoek uitsluitend kan worden ingediend in samenhang met eenzelfde verzoek dat
      door de eigenaar van een aangrenzende onroerende zaak wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke bescheiden, naast een beschrijving van de
      karakteristieke verschijningsvorm van de onroerende zaak alsmede uittreksels uit de basisregistratie kadaster, bij
      het verzoek moeten worden overgelegd en worden regels gesteld betreffende de inhoud van die beschrijving en van die
      andere bescheiden.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel2
  - number: '2.4'
    text: Onze Ministers beslissen op het verzoek bij gezamenlijke beschikking.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel2
  - number: '2.5'
    text: |-
      Indien aan het verzoek wordt voldaan, wordt de onroerende zaak als een landgoed aangemerkt met ingang van het
      tijdstip waarop het verzoek bij Onze Minister is ingekomen.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel2
  - number: '3.1'
    text: 'Een als landgoed aangemerkte onroerende zaak wordt niet langer als zodanig beschouwd in de gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de eigenaar Onze Minister schriftelijk mededeelt dat hij zijn de onroerende zaak niet langer wenst aangemerkt te
      zien als een landgoed;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: 3.1.b
    text: |-
      het karakter van landgoed van de onroerende zaak is aangetast of verloren is gegaan door gebrek aan behoorlijk
      onderhoud of door andere omstandigheden;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: 3.1.c.1°
    text: de eigendom van de onroerende zaak is overgedragen;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: 3.1.c.2°
    text: |-
      het beperkt recht van vruchtgebruik of, behoudens ingeval de hoofdgerechtigde nog steeds als eigenaar wordt
      aangemerkt op grond van [artikel 1, derde lid][ref1], dat van erfpacht op de onroerende zaak is gevestigd of een
      zodanig recht op de onroerende zaak is geëindigd, waaronder begrepen de gevallen waarin de erfpachter door de
      toepassing van [artikel 1, derde lid][ref2], niet langer als eigenaar wordt aangemerkt. Met de vestiging van het
      recht van erfpacht wordt gelijkgesteld de overdracht van economische eigendom aan een erfpachter die aanvankelijk
      op grond van [artikel 1, derde lid][ref3], niet als eigenaar van de onroerende zaak werd aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 3.1.c.3°
    text: de onroerende zaak bij verdeling is gesplitst en aan verschillende deelgenoten is toegedeeld;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: 3.1.d
    text: |-
      op grond van [artikel 1, tweede lid, onderdeel a][ref1], de oppervlakte van een aangrenzende onroerende zaak in
      aanmerking is genomen en deze onroerende zaak of het aangrenzende gedeelte daarvan niet langer als een landgoed,
      onderscheidenlijk als een gedeelte daarvan, wordt aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 3.1.e
    text: |-
      de onroerende zaak niet voldoet aan de regels, bedoeld in [artikel 1, tweede lid, eerste zin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: '3.2'
    text: |-
      Het eerste lid, aanhef en onderdeel *c*, vindt geen toepassing, voor zover Onze Ministers op verzoek van de
      eigenaar bij gezamenlijke beschikking beslissen dat de onroerende zaak blijft aangemerkt als een landgoed.
      Het verzoek dient binnen zes maanden na de overdracht, na de vestiging of het eindigen van het beperkt recht,
      onderscheidenlijk na de verdeling bij Onze Minister te worden ingediend. Onze Minister is bevoegd in bijzondere
      gevallen de termijn van zes maanden te verlengen.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: '3.3'
    text: |-
      In de gevallen waarin de onroerende zaak niet langer als een landgoed wordt aangemerkt ingevolge het eerste lid,
      onderdelen *a* of *c*, stellen Onze Ministers bij gezamenlijke beschikking vast dat de onroerende zaak niet langer
      als zodanig wordt beschouwd met ingang van het tijdstip waarop de mededeling bij Onze Minister is ingekomen,
      onderscheidenlijk het tijdstip van de overdracht, van de vestiging of het eindigen van het beperkt recht, dan wel
      van de verdeling.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: '3.4'
    text: |-
      In het geval waarin de onroerende zaak, naar het oordeel van Onze Ministers, niet langer als een landgoed wordt
      aangemerkt ingevolge het eerste lid, onderdelen b of e, beslissen Onze Ministers bij gezamenlijke beschikking dat
      de onroerende zaak niet langer als zodanig wordt beschouwd met ingang van de datum van die beschikking.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: '3.5'
    text: |-
      Indien de oppervlakte van een onroerende zaak waarvoor door Onze Ministers een beschikking is afgegeven als
      bedoeld in het derde of het vierde lid, in aanmerking is genomen bij de toetsing van een andere onroerende zaak
      aan de voorwaarden, genoemd in [artikel 1, tweede lid][ref1], zenden Onze Ministers een afschrift van voornoemde
      beschikking ter kennisgeving aan de eigenaar of eigenaren van deze andere onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: '3.6'
    text: |-
      Het eerste lid, aanhef en onderdeel d, vindt geen toepassing voorzover Onze Ministers op verzoek van de eigenaar
      bij gezamenlijke beschikking beslissen dat de onroerende zaak blijft aangemerkt als een landgoed. Het verzoek wordt
      binnen zes maanden na de datum van de kennisgeving, bedoeld in het vijfde lid, ingediend.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: '3.7'
    text: |-
      Ingeval een onroerende zaak ingevolge toepassing van het eerste lid, onderdeel d, niet langer als een landgoed kan
      worden aangemerkt, stellen Onze Ministers niet eerder dan zes maanden na verzending van de kennisgeving, bedoeld
      in het vijfde lid, bij gezamenlijke beschikking vast dat de onroerende zaak niet langer als een landgoed wordt
      aangemerkt met ingang van de datum van die beschikking.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: '3.8'
    text: |-
      Een eigenaar kan aan Onze Ministers een verklaring vragen dat een door hem voorgenomen handeling niet zal leiden
      tot een beschikking, als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: '3.9'
    text: |-
      Met betrekking tot een gedeelte van de onroerende zaak vinden het eerste tot en met het achtste lid overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3
  - number: 3a.1
    text: |-
      Indien de onroerende zaak, bedoeld in [artikel 1, vierde lid][ref1], na verloop van drie jaren nadat zij als een
      landgoed is aangemerkt, niet voldoet aan de in [artikel 1, tweede lid, onderdeel b][ref2], bedoelde voorwaarden,
      dan wel indien zij naar het oordeel van Onze Minister na die termijn niet aan die voorwaarden zal voldoen,
      beslissen Onze Ministers bij gezamenlijke beschikking dat de onroerende zaak niet langer als een landgoed wordt
      aangemerkt met ingang van de datum van die beschikking. Onze Minister kan de termijn van drie jaren op grond van
      bijzondere omstandigheden met maximaal twee jaren verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 3a.2
    text: |-
      Een eigenaar van een onroerende zaak die op de voet van [artikel 1, vierde lid][ref1], als een landgoed is
      aangemerkt, kan aan Onze Ministers een verklaring vragen dat aan de in [artikel 1, tweede lid, onderdeel b][ref2],
      bedoelde voorwaarden is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 3a.3
    text: Het eerste en tweede lid vinden overeenkomstige toepassing met betrekking tot een gedeelte van de onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel3a
  - number: '4.1'
    text: |-
      Vanaf het tijdstip waarop een onroerende zaak of een gedeelte daarvan niet langer als een landgoed wordt
      aangemerkt, wordt die onroerende zaak of dat gedeelte binnen een termijn van 10 jaren niet opnieuw als zodanig
      aangemerkt ingeval het verzoek daartoe wordt gedaan door degene die op dat tijdstip eigenaar was of door een
      vennootschap waarvan hij middellijk of onmiddellijk aandeelhouder is.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien in het geval als bedoeld in [artikel 3, eerste lid, onderdeel b][ref1], het karakter van landgoed niet in
      ernstige mate is aangetast kunnen Onze Ministers bij gezamenlijke beschikking, in afwijking in zoverre van het
      eerste lid, een kortere termijn van ten hoogste 5 jaren vaststellen en kunnen zij daarbij voorwaarden stellen.
      Alsdan vinden de [artikelen 8][ref2] en [9c][ref3] geen toepassing. Ingeval de in de eerste volzin bedoelde
      aantasting van het karakter van landgoed voortvloeit uit omstandigheden die het gevolg zijn van overmacht, wordt
      bovendien voor de toepassing van [artikel 5.7, eerste lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref4]
      en van [artikel 220d, eerste lid, onderdeel d, van de Gemeentewet][ref5] de onroerende zaak of het desbetreffende
      gedeelte daarvan gelijkgesteld met een landgoed.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001939#Artikel9c
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0001939
        artikel: 9c
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: 220d
  - number: '4.3'
    text: |-
      Het eerste lid en de [artikelen 8][ref1] en [9c][ref2] vinden alsnog toepassing indien binnen de kortere termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel9c
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: 9c
  - number: 4.3.a
    text: |-
      de eigenaar Onze Minister schriftelijk mededeelt dat hij zijn onroerende zaak onderscheidenlijk het in het eerste
      lid bedoelde gedeelte na afloop van die termijn niet opnieuw wenst aangemerkt te zien als een landgoed;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
  - number: 4.3.b
    text: de krachtens het tweede lid gestelde voorwaarden niet worden nageleefd; dan wel
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
  - number: 4.3.c
    text: |-
      zich wederom een geval als bedoeld in [artikel 3, eerste lid, onderdeel b][ref1], voordoet;


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel3
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '3'
  - number: 4.3.d
    text: |-
      een aangrenzende onroerende zaak, waarvan de oppervlakte in aanmerking is genomen als bedoeld in
      [artikel 1, tweede lid, onderdeel a][ref1], door toepassing van [artikel 3, eerste lid][ref2], niet meer als een
      landgoed in aanmerking wordt genomen, tenzij op deze aangrenzende onroerende zaak het tweede lid van toepassing is,
      dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel3
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '3'
  - number: 4.3.e
    text: |-
      zich met betrekking tot een aangrenzende onroerende zaak, waarvan de oppervlakte in aanmerking is genomen als
      bedoeld in [artikel 1, tweede lid, onderdeel a][ref1], en waarop het tweede lid toepassing heeft gevonden, een van
      de gebeurtenissen, bedoeld in de onderdelen a, b of c voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: '4.4'
    text: |-
      Met betrekking tot het derde lid, onderdeel a, en de onderdelen b, c, d en e vindt [artikel 3, derde lid][ref1],
      onderscheidenlijk vierde, vijfde en zevende tot en met negende lid, overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel3
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '3'
  - number: '4.5'
    text: |-
      Ingeval [artikel 3, zevende lid][ref1], toepassing heeft gevonden op een onroerende zaak ten gevolge van het feit
      dat deze onroerende zaak was aangemerkt als een landgoed rekening houdende met de oppervlakte van een aangrenzende
      onroerende zaak waarop het tweede lid is toegepast, is het tweede lid op de eerstgenoemde onroerende zaak van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel3
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '3'
  - number: '7.1'
    text: |-
      Indien tot een verkrijging in de zin van de [Successiewet 1956](onbekend) een onroerende zaak behoort, die
      is aangemerkt als een landgoed vindt - mits aan de in het volgende lid gestelde voorwaarden is voldaan - geen
      invordering plaats van het verschil tussen de volgens de aanslag verschuldigde schenkbelasting onderscheidenlijk
      erfbelasting en de belasting, welke verschuldigd zou zijn, indien de onroerende zaak wordt gesteld op de helft
      van de waarde in het economische verkeer, welke op het tijdstip van de verkrijging aan de zaak zou moeten worden
      toegekend, in geval daarop de last rustte om het gedurende een tijdvak van 25 jaren als zodanig in stand te houden
      en geen opgaand hout te vellen, dan volgens de regels van normaal bosbeheer noodzakelijk of gebruikelijk is. Voor
      zover het landgoed overeenkomstig door Onze Ministers goedgekeurde regelen voor het publiek is opengesteld, wordt,
      in afwijking in zoverre van de vorige volzin, de waarde van dat landgoed gesteld op nihil.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het vorige lid is slechts van toepassing, indien in de aangifte behalve de naar
      [artikel 21 van de voormelde wet][ref1] bepaalde waarde in het economische verkeer worden opgegeven de in dat lid
      bedoelde waarde in het economische verkeer en de in [artikel 2, vierde lid][ref2], bedoelde beschikking, zomede,
      indien en voor zover het een opengesteld landgoed betreft, de beschikking, waarbij de regelen voor de openstelling
      zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel2
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '2'
  - number: '7.3'
    text: |-
      Het in het eerste lid bepaalde geldt ook, indien de hiervoor bedoelde beschikkingen op verzoek van de verkrijgers
      eerst na het overlijden of de schenking zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor zover het een verkrijging in de zin van de [Successiewet 1956]
      (onbekend) betreft door degene die in de vijf jaren voorafgaande aan de verkrijging de onroerende zaak onder
      bezwarende titel heeft overgedragen en, gedurende die periode van vijf jaren, voor een verkrijging door zijn
      rechtsopvolgers onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7
  - number: '7.5'
    text: |-
      In het aanslagbiljet wordt behalve van het bedrag van de aanslag melding gemaakt van het bedrag van de terstond
      invorderbare belasting. De vaststelling van laatstbedoeld bedrag wordt voor de toepassing van de wettelijke
      bepalingen betreffende de schenk- en erfbelasting en de regeling inzake belastingrente beschouwd als de oplegging
      van een aanslag.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7
  - number: 7a.1
    text: |-
      Voor de heffing van de schenk- en erfbelasting, geheven krachtens de [Successiewet 1956][ref1]en voor de
      toepassing van [artikel 8a][ref2], worden de bezittingen en schulden van een naamloze vennootschap of van een
      besloten vennootschap met beperkte aansprakelijkheid als bezittingen en schulden harer gezamenlijke aandeelhouders
      beschouwd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002226
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel8a
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002226
      - id: ref2
        bwb_id: BWBR0001939
        artikel: 8a
  - number: 7a.1.a
    text: |-
      de werkzaamheden der naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid uitsluitend of
      hoofdzakelijk bestaan in de instandhouding en exploitatie van onroerende zaken als landgoederen;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7a
  - number: 7a.1.b
    text: alle aandeelhouders natuurlijke personen zijn;
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7a
  - number: 7a.1.c
    text: het aantal aandeelhouders niet meer dan twintig bedraagt.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7a
  - number: 7a.2
    text: |-
      Voor de toepassing van het eerste lid worden rechtspersonen, welke zich uitsluitend of nagenoeg uitsluitend het
      behoud van natuurschoon ten doel stellen, met natuurlijke personen gelijk gesteld.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Het in het eerste lid, onderdeel *c*, genoemde vereiste is niet van toepassing, indien het aantal aandeelhouders,
      niet meer dan twintig bedragen hebbende, uitsluitend door erfenis, legaten, schenkingen en ontbindingen van
      huwelijksgemeenschappen of gemeenschappen van geregistreerd partnerschap gestegen is tot meer dan twintig mits,
      nadat het aantal aandeelhouders gestegen was tot meer dan twintig, dat aantal niet door andere dan de genoemde
      oorzaken verder gestegen is.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel7a
  - number: '8.1'
    text: |-
      In het geval waarin een beschikking is genomen als bedoeld in [artikel 3a, eerste lid][ref1], dan
      wel indien binnen een tijdvak van 25 jaren na het overlijden of de schenking zich één van de in
      [artikel 3, derde, vierde en zevende lid][ref2], genoemde gevallen voordoet, wordt de belasting - waarvan ingevolge
      [artikel 7, eerste lid][ref3], invordering achterwege is gebleven - alsnog ingevorderd, verminderd met de reeds op
      grond van [artikel 8a][ref4] ingevorderde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001939#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0001939#Artikel8a
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001939
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0001939
        artikel: 8a
  - number: '8.2'
    text: |-
      Indien een van de in het eerste lid bedoelde gevallen zich heeft voorgedaan met betrekking tot een gedeelte
      van de onroerende zaak, wordt de belasting herrekend naar de helft van de waarde in het economische verkeer
      (of, voor zover de onroerende zaak volgens goedgekeurde regelen blijft opengesteld, de op nihil gestelde
      waarde in het economische verkeer), ten dage, waarop zich één van die gevallen heeft voorgedaan, aan de
      onroerende zaak, voor zover die als landgoed blijft aangemerkt, overeenkomstig [artikel 7, eerste lid][ref1],
      toe te kennen, vermeerderd met de waarde in het economische verkeer, welke op dat tijdstip ingevolge
      [artikel 21 van de Successiewet 1956][ref2] aan het overige gedeelte van de onroerende zaak, met
      inbegrip van het gevelde opgaande hout, moet worden toegekend, zonder dat de som van die waarden de in
      [artikel 7, tweede lid][ref3], eerstbedoelde waarde te boven gaat. In dat geval wordt de aldus herrekende
      belasting, verminderd met de reeds ingevorderde belasting, alsnog ingevorderd. Teruggave van belasting heeft deze
      bepaling niet tengevolge.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0001939#Artikel7
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0001939
        artikel: '7'
  - number: '8.3'
    text: |-
      Indien door Onze Ministers wordt beslist, dat, te rekenen van een tijdstip, liggende binnen een tijdvak van
      25 jaren na het overlijden of de schenking, de onroerende zaak niet langer volgens goedgekeurde regelen is
      opengesteld, en de vorige twee leden niet van toepassing zijn, vindt alsnog invordering plaats van de belasting
      berekend naar de helft van de in [artikel 7, eerste lid][ref1], bedoelde waarde in het economische verkeer,
      verminderd met de reeds ingevorderde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
  - number: '8.4'
    text: |-
      Indien het in het vorige lid bedoelde geval zich voordoet ten aanzien van een gedeelte van de onroerende zaak
      en het tweede lid niet van toepassing is, wordt de belasting herrekend naar de op nihil gestelde waarde in
      het economische verkeer, op het in het vorige lid bedoelde tijdstip aan de onroerende zaak, voor zover die
      volgens goedgekeurde regelen blijft opengesteld, overeenkomstig [artikel 7, eerste lid][ref1], toe te kennen,
      vermeerderd met de helft van de waarde in het economische verkeer, welke op dat tijdstip ingevolge laatstgemelde
      bepaling aan het overige gedeelte van de onroerende zaak moet worden toegekend, zonder dat deze som de in
      [artikel 7, eerste lid][ref2], bedoelde waarde te boven gaat. De aldus herrekende belasting, verminderd met
      de reeds ingevorderde belasting, wordt alsnog ingevorderd. Teruggave van belasting heeft deze bepaling niet
      tengevolge.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel7
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '7'
  - number: '8.5'
    text: |-
      Indien één van de gevallen, in dit artikel bedoeld, zich voordoet, zijn zij, die tot het doen van aangifte
      van de verkrijging zijn of waren gehouden, verplicht binnen twee maanden, nadat zij daartoe schriftelijk door
      de inspecteur zijn uitgenodigd, bij nadere aangifte de gegevens te verstrekken, welke voor de invordering
      of herrekening ingevolge dit artikel nodig zijn, voor zover deze nog niet aan de inspecteur bekend zijn.
      [Artikel 11 van de Algemene wet inzake rijksbelastingen][ref1] is van toepassing. Het bedrag van de in te vorderen
      belasting wordt bij aanslag vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
  - number: '8.6'
    text: |-
      Op het bedrag van de belasting, dat ingevolge [artikel 7, eerste lid][ref1], niet wordt ingevorderd, blijft
      [Hoofdstuk V van de Invorderingswet 1990][ref2] van toepassing. De aldaar bedoelde rente wordt evenwel slechts
      in rekening gebracht over en tegelijk met de belasting, waarvan op grond van dit artikel alsnog invordering
      plaatsheeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004770#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004770
        hoofdstuk: V
  - number: '8.7'
    text: |-
      Onze Minister van Financiën kan in bijzondere gevallen beslissen, dat de vorige bepalingen van dit artikel geheel
      of gedeeltelijk buiten toepassing blijven.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8
  - number: 8a.1
    text: |-
      Indien degene ten aanzien van wie [artikel 7][ref1] toepassing heeft gevonden, binnen een tijdvak van 25 jaren na
      het overlijden of de schenking:


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
  - number: 8a.1.a
    text: de eigendom van het landgoed overdraagt, of
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
  - number: 8a.1.b
    text: |-
      het recht van vruchtgebruik of, behoudens ingeval de hoofdgerechtigde nog steeds als eigenaar wordt
      aangemerkt op grond van [artikel 1, derde lid][ref1], dat van erfpacht op de onroerende zaak vestigt,
      overdraagt of daarvan afstand doet, waaronder begrepen de gevallen waarin de erfpachter door de toepassing van
      [artikel 1, derde lid][ref2], niet langer als eigenaar wordt aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 8a.2
    text: Voor de toepassing van dit artikel wordt onder overdracht mede begrepen de overdracht van de economische eigendom.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
  - number: 8a.3
    text: |-
      De ingevolge het eerste lid in te vorderen belasting bedraagt het product van de ten tijde van de in het eerste
      lid, onderdeel *a* of *b*, bedoelde gebeurtenis nog niet verstreken volle jaren van het in het eerste lid bedoelde
      tijdvak en 1/25 gedeelte van de belasting waarvan ingevolge [artikel 7, eerste lid][ref1], invordering achterwege
      is gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
  - number: 8a.4
    text: |-
      Indien een van de in het eerste lid bedoelde gevallen zich voordoet met betrekking tot een gedeelte van het
      landgoed wordt een bedrag aan belasting ingevorderd dat gelijk is aan het overeenkomstig het derde lid berekende
      bedrag vermenigvuldigd met een breuk waarvan de teller gelijk is aan de waarde van het betrokken gedeelte van het
      landgoed en de noemer gelijk is aan de waarde van het gehele landgoed. Voor de in de vorige volzin bedoelde waarde
      van het betrokken gedeelte van het landgoed respectievelijk die van het gehele landgoed wordt in aanmerking genomen
      de waarde in het economische verkeer op het moment dat de in het eerste lid bedoelde gebeurtenissen zich voordoen.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
  - number: 8a.5
    text: |-
      In afwijking van het eerste lid wordt de belasting niet ingevorderd voorzover tegenover de in de onderdelen *a* of
      *b* bedoelde gebeurtenis geen directe of indirecte tegenprestatie staat. Indien sprake is van een tegenprestatie
      die afwijkt van hetgeen in het economische verkeer door onafhankelijke partijen zou zijn overeengekomen, wordt
      het bedrag aan belasting ingevorderd dat gelijk is aan het overeenkomstig het derde of vierde lid berekende bedrag
      vermenigvuldigd met een breuk waarvan de teller gelijk is aan de waarde van de tegenprestatie en de noemer gelijk
      is aan de waarde van de tegenprestatie die tussen onafhankelijke partijen zou zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
  - number: 8a.6
    text: |-
      Indien de in het eerste lid genoemde rechtshandelingen worden verricht door degene die het landgoed of een gedeelte
      daarvan dan wel een van de in het eerste lid genoemde beperkte rechten heeft verkregen krachtens verdeling van een
      gemeenschap dan wel krachtens een opeenvolging van dergelijke verdelingen, vindt dit artikel toepassing alsof die
      verdeling of verdelingen niet hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
  - number: 8a.7
    text: |-
      Indien degene die een landgoed of een beperkt recht van vruchtgebruik of van erfpacht daarop heeft verkregen
      ten gevolge van de verdeling van een nalatenschap, dat landgoed of dat beperkt recht binnen de in het eerste lid
      bedoelde periode van 25 jaar overdraagt aan een van de deelgenoten of voormalige deelgenoten in die nalatenschap,
      blijft met betrekking tot die overdracht het eerste lid buiten toepassing. De deelgenoot of voormalige deelgenoot
      aan wie het in de vorige volzin bedoelde landgoed of beperkt recht is overgedragen wordt voor de toepassing van
      dit artikel geacht dat landgoed of beperkt recht te hebben verkregen krachtens verdeling van de eerder genoemde
      nalatenschap.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
  - number: 8a.8
    text: |-
      [Artikel 8, vijfde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel8
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '8'
  - number: '9'
    text: |-
      Op de ingevolge de [artikelen 7][ref1], [8][ref2] en [8a][ref3] aan te geven waarden en op te leggen
      aanslagen zijn de wettelijke bepalingen betreffende de schenk- en erfbelasting en de bepalingen van de
      [Algemene wet inzake rijksbelastingen][ref4] voor zoveel mogelijk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001939#Artikel8a
      [ref4]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0001939
        artikel: 8a
      - id: ref4
        bwb_id: BWBR0002320
  - number: 9a
    text: Ter zake van de verkrijging van een landgoed is geen overdrachtsbelasting verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001939/2021-01-01#Artikel9a
  - number: 9c
    text: |-
      De belasting die door toepassing van [artikel 9a][ref1] niet is geheven, is alsnog verschuldigd
      indien met betrekking tot het landgoed een beschikking wordt genomen als bedoeld in
      [artikel 3a, eerste lid][ref2], dan wel binnen een tijdvak van 25 jaren na de verkrijging zich een van de in
      [artikel 3, derde, vierde en zevende lid][ref3], genoemde gevallen voordoet.


