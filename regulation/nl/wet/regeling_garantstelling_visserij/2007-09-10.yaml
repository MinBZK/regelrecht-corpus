  - number: '14'
    text: |-
      De beschikking tot verlening van de garantstelling bevat de volgende gegevens:

      a. de hoogte van de lening die onder garantstelling kan worden verstrekt;

      b. de uiterste datum waarop de lening onder garantstelling kan worden verstrekt;

      c. het schema volgens welke de lening dient te worden afgelost;

      d. het investerings- en financieringsplan op grond waarvan de garantstelling wordt verleend;

      e. de natuurlijke personen of rechtspersonen die zich hoofdelijk aansprakelijk dienen te stellen voor de
      terugbetaling van de lening onder garantstelling.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel14
  - number: '15'
    text: |-
      1 De garantstelling wordt verstrekt onder voorbehoud van goedkeuring door de Commissie van de Europese
      Gemeenschappen.

      2 De beslissing tot verstrekking van de garantstelling kan worden ingetrokken of gewijzigd indien dit noodzakelijk
      is in verband met het verkrijgen van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze
      regeling of het uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel15
  - number: '16'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode vanaf de terugvordering tot aan het moment van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
