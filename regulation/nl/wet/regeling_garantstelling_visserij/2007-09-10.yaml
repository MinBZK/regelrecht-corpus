  text: |-
    Gelet op Verordening (EG) nr. 1198/2006 van de Raad van 27 juli 2006 inzake het Europese Visserijfonds (PbEU
    L 223);

    Gelet op artikelen 2, 4 en 6 van de Kaderwet LNV-subsidies;

    Gelet op de goedkeuring van de Commissie van de Europese Gemeenschap van 24 juli 2007 bij beschikking nr. C (2007)
    3647;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. kredietinstelling: kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1];

      c. ondernemer: natuurlijk persoon of rechtspersoon te wiens naam het vissersvaartuig in het visserijregister staat
      geregistreerd;

      d. lening: door een kredietinstelling verstrekte geldlening, niet zijnde een rekening-courantkrediet;

      e. liquiditeitstoename: som van het bedrijfsresultaat, de afschrijving en de privé-toevoegingen verminderd met de
      aflossingen, de privé-onttrekkingen en de vervangingsinvesteringen;

      f. bancair aansprakelijk vermogen:

      1°. het eigen vermogen van het bedrijf van de aanvrager of

      2°. zekerheidsstelling door derden ten behoeve van het bedrijf van de aanvrager, en vermogensbestanddelen van de
      aanvrager privé, bestaande uit:

        - bij eenmanszaken, vennootschappen onder firma en maatschappen: privé-bezittingen;
        - bij besloten vennootschappen met beperkte aansprakelijkheid of naamloze
        - vennootschappen: privé-bezittingen voor zover deze door zekerheidsstelling ten
        - behoeve van de kredietinstelling zijn verbonden;
        - achtergestelde leningen;

      g. Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      h. contingent: contingent als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Regeling contingentering zeevis][ref2];

      i. garnalenvergunning: vergunning als bedoeld in
      [artikel 11 van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref3] verleend voor het vissen
      met enig vistuig geschikt voor het vangen van garnalen (Crangon, crangon) in de visserijzone, het zeegebied of
      de kustwateren.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003150#Artikel11
