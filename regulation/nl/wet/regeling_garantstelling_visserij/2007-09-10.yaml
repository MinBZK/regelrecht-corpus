  - number: '9'
    text: |-
      1 Indien de aanvraag wordt ingediend door een rechtspersoon verbinden de bestuurders, en in geval van een besloten
      of een naamloze vennootschap tevens de aandeelhouders, zich hoofdelijk tot de volledige terugbetaling van de lening
      waarop de aanvraag betrekking heeft, alsmede verbinden zij ter zake hun hele vermogen tot zekerheid.

      2 De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel9
  - number: '10'
    text: |-
      1 Jaarlijks kan de Minister een maximumbedrag vaststellen voor het totaal van de leningen waarvoor in het betrokken
      jaar garantstellingen kunnen worden verstrekt. De Minister maakt dit bedrag bekend in de Staatscourant.

      2 Een garantstelling wordt niet verstrekt indien door verstrekking daarvan het maximumbedrag, bedoeld in het eerste
      lid, wordt overschreden.

      3 Garantstellingen worden voor de verdeling van het maximumbedrag, bedoeld in het eerste lid, verstrekt
      in volgorde van binnenkomst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag volledig is, als datum van ontvangst geldt.

      4 Indien door toewijzing van aanvragen met dezelfde datum van ontvangst het maximumbedrag zou worden overschreden,
      geschiedt de toewijzing aan de hand van het rangschikken van de op deze datum ontvangen aanvragen, waarbij
      telkenmale de hoogst gerangschikte aanvraag het eerst voor toewijzing in aanmerking komt. De rangschikking vindt
      plaats volgens loting, welke geschiedt door een vanwege de Minister aan te wijzen notaris.

      5 De Minister kan besluiten dat indien het krachtens het eerste lid vastgestelde maximumbedrag is bereikt, de
      mogelijkheid tot het indienen van aanvragen tot verstrekking van borgstellingen uit hoofde van deze regeling voor
      de rest van het betrokken begrotingsjaar wordt geschorst.

      6 De Minister maakt een besluit als bedoeld in het vijfde lid bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel10
