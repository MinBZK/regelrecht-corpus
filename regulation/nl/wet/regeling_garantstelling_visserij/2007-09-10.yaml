        artikel: 4:5
  - number: '11'
    text: |-
      1 De aanvraag wordt ingediend bij Dienst Regelingen op een daartoe vastgesteld formulier.

      2 De aanvraag bevat de volgende gegevens:

      a. naam, voornamen en adres van de aanvrager;

      b. de naam en het adres van de kredietinstelling die de financiering verstrekt;

      c. een machtiging van de aanvrager tot het inwinnen van inlichtingen bij derden.

      3 Het aanvraagformulier wordt volledig en naar waarheid ingevuld, is gedagtekend en ondertekend
      door de aanvrager en is voorzien van een verklaring van de kredietinstelling dat zij bereid
      is de lening, bedoeld in [artikel 2][ref1] te verstrekken en dat wordt voldaan aan de in
      [artikel 8, eerste lid, onderdelen d, e, en f, derde lid, onderdeel d][ref2], gestelde criteria.

      4 Onvolledige aanvragen worden niet in behandeling genomen met inachtneming van
      [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022476#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022476#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel11
