  - number: '13'
    text: |-
      Op een aanvraag als bedoeld in [artikel 11][ref1] beslist de Minister binnen 16 weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0022476#Artikel11
