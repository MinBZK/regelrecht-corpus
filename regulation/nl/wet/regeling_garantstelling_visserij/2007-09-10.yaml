  - number: '2'
    text: |-
      De Minister kan op aanvraag subsidie verlenen in de vorm van een garantstelling voor de terugbetaling van leningen
      die naar het oordeel van de Minister gericht zijn op investeringen als bedoeld in de artikelen 25 en 35 van
      Verordening (EG) nr. 1198/2006 van de Raad van 27 juli 2006 inzake het Europese Visserijfonds (PbEU L 223), met
      inachtneming van de bepalingen van deze regeling, de bepalingen van voornoemde verordening en de relevante Europese
      richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel2
  - number: '3'
    text: |-
      De garantstelling kan worden verstrekt aan een ondernemer die eigenaar of reder is van een vissersvaartuig
      dat behoort tot het segment MFL 1 of MFL 2, een tonnage heeft van minder dan 1.200 BT en waarvoor een
      garnalenvergunning is verleend of een contingent is toegekend.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel3
  - number: '4'
    text: |-
      1 Geen garantstelling wordt verstrekt aan ondernemingen, bedoeld in punt 2.1 van de Mededeling van de Commissie
      aangaande Communautaire richtsnoeren inzake reddings- en herstructureringssteun aan ondernemingen in moeilijkheden
      (OJ C 244, 1.10.2004, p. 2)

      2 Geen garantstelling wordt verstrekt voor de terugbetaling van leningen die gericht zijn op de herfinanciering van
      schulden, daaronder mede begrepen niet door een kredietinstelling verstrekte leningen alsmede leningen welke worden
      aangegaan om kapitaalbehoefte, ontstaan door het uittreden van een commanditaire vennoot uit een commanditaire
      vennootschap te dekken, behoudens ingeval van overmacht.

      3 Geen garantstelling wordt verstrekt voor de terugbetaling van leningen indien ten aanzien van de investeringen:

      a. door de aanvrager reeds verplichtingen zijn aangegaan voordat de ontvangst van de aanvraag door Dienst
      Regelingen schriftelijk is bevestigd, of

      b. door een kredietinstelling reeds een lening is verstrekt of onvoorwaardelijk is toegezegd voordat de ontvangst
      van de aanvraag door Dienst Regelingen schriftelijk is bevestigd.

      4 Geen garantstelling wordt verstrekt voor de terugbetaling van leningen met betrekking tot een visserijonderneming
      die wordt uitgeoefend door een commanditaire vennootschap, tenzij uit de betrokken vennootschapsovereenkomst
      blijkt dat deze ten minste is aangegaan voor een periode, overeenkomende met de looptijd van de lening, waarvoor de
      aanvraag wordt ingediend, en in elk geval gedurende deze looptijd niet kan worden opgezegd.

      5 Geen garantstelling wordt verstrekt indien reeds een krediet is verstrekt voor dezelfde investering op basis van
      andere garantstellingen door de overheid.

      6 Geen garantstelling wordt verstrekt indien aan de aanvrager in het tijdvak van twee jaren voorafgaand aan de
      datum van ontvangst van de aanvraag reeds een garantstelling op grond van deze regeling is verstrekt.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel4
  - number: '5'
    text: |-
      1 Indien de aanvrager voor dezelfde subsidiabele activiteiten tevens subsidie van een bestuursorgaan heeft
      aangevraagd of ontvangen, dan wel in verband daarmee inkomsten verwerft, doet hij daarvan mededeling in de
      aanvraag.

      2 Geen garantstelling wordt verstrekt indien uit anderen hoofde vanwege de overheid of de Commissie van de Europese
      Gemeenschap een zodanig bedrag aan geldelijke steun is of zal worden verstrekt, dat door garantstelling het totale
      bedrag aan geldelijke steun dat ingevolge communautaire regelgeving mag worden verstrekt, zou worden overschreden.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel5
  - number: '6'
    text: |-
      1 Een garantstelling wordt verstrekt voor een minimumbedrag van € 90.000,- en een maximumbedrag van € 450.000,-.

      2 De garantie wordt ten hoogste verstrekt voor twee derde van voor de investeringen benodigde financieringen, minus
      de eigen beschikbare middelen, rekening houdende met de financieringsmogelijkheden op basis van de beschikbare
      zekerheden en de wijze waarop de beschikbare eigen middelen optimaal kunnen worden aangewend.

      3 De looptijd van de lening waarvoor garantstelling wordt verstrekt kan ten hoogste 10 jaar bedragen en de lening
      wordt lineair afgelost.

      4 De uiterste datum waarop de lening volledig moet zijn opgenomen mag niet later dan een jaar, na de datum van de
      beschikking, bedoeld in [artikel 13][ref1], liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0022476#Artikel13
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022476
        artikel: '13'
  - number: '7'
    text: |-
      1 De garantstelling kan slechts worden verstrekt ten behoeve van een lening verstrekt door een kredietinstelling
      waarmee de Minister een raamovereenkomst heeft gesloten.

      2 In deze raamovereenkomst worden de rechten en plichten van de Minister en de kredietinstelling vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel7
  - number: '8'
    text: |-
      1 De garantstelling kan worden verstrekt ten behoeve van leningen aangegaan door natuurlijke personen indien:

      a. deze een visserijonderneming in stand houden;

      b. de bruto-jaaromzet van de in onderdeel a bedoelde onderneming voor meer dan de helft uit visserij is verkregen;

      c. de in onderdeel a bedoelde onderneming naar het oordeel van de Minister een positieve liquiditeitstoename
      oplevert;

      d. deze wegens het ontbreken van de daartoe benodigde zekerheden volgens normaal bankgebruik onvoldoende
      financiering voor de visserijonderneming kunnen verkrijgen;

      e. deze voor zover rechtens is toegestaan, op alle toebehorende goederen goederenrechtelijke zekerheid verlenen
      voor alle door de kredietinstelling te verstrekken financieringen, waaronder de lening waarop de aanvraag
      betrekking heeft;

      f. deze beschikt over een visvergunning als bedoeld in de [Regeling visvergunning][ref1].

      2 Indien meer dan een natuurlijke persoon voor gezamenlijke rekening een visserijonderneming in stand houdt,
      voldoet elk van hen aan het eerste lid, onderdelen d en e.

      3 De garantstelling kan worden verstrekt ten behoeve van leningen aangegaan door rechtspersonen indien:

      a. zij blijkens de statuten de exploitatie van een of meer visserijondernemingen ten doel hebben;

      b. de bruto-jaaromzet van de onderneming waarvoor een aanvraag wordt ingediend voor meer dan de helft uit visserij
      is verkregen;

      c. de in onderdeel b bedoelde onderneming naar het oordeel van de Minister een voldoende liquiditeitstoename
      oplevert;

      d. zij voldoen aan het eerste lid, d, e, en f.

      4 Geen garantstelling wordt verstrekt indien het bancair aansprakelijk vermogen van de aanvrager minder dan 5 %
      bedraagt van het balanstotaal.

      5 Bij de bepaling of wordt voldaan aan het bepaalde in het eerste lid, onderdeel c, en tweede lid, onderdeel c,
      wordt uitgegaan van een, zo nodig door de Minister gewijzigde, begroting die op de ondernemerscapaciteiten van de
      aanvrager is afgestemd en waaruit onder meer moet blijken dat:

      a. rente- en aflossingsverplichtingen, overige bedrijfsuitgaven, belastingen, premies en, voor zover geen sprake
      is van inkomsten uit tegenwoordige of vroegere arbeid van buiten de visserij waaruit deze kunnen worden bestreden,
      gezinsbestedingen kunnen worden betaald;

      b. de noodzakelijke vervangingsinvesteringen kunnen worden gerealiseerd;

      c. de liquiditeitstoename voldoende ruimte biedt om tegenvallers in de exploitatie op te vangen alsmede
      om aan toekomstige financieringsverplichtingen, onder andere als gevolg van noodzakelijke diepte- of
      uitbreidingsinvesteringen, te kunnen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0016244
    url: https://wetten.overheid.nl/BWBR0022476/2007-09-10#Artikel8
    references:
