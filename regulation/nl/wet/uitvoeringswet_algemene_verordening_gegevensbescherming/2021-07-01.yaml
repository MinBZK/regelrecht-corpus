        paragraaf: '3.1'
  - number: '33'
    text: |-
      1 Persoonsgegevens van strafrechtelijke aard mogen worden verwerkt, indien:

      a. de verwerking geschiedt door organen die krachtens de wet zijn belast met de toepassing van het strafrecht, dan
      wel door verwerkingsverantwoordelijken die deze hebben verkregen krachtens de [Wet politiegegevens][ref1] of de
      [Wet justitiële en strafvorderlijke gegevens][ref2];

      b. de verwerking geschiedt door en ten behoeve van publiekrechtelijke samenwerkingsverbanden van
      verwerkingsverantwoordelijken of groepen van verwerkingsverantwoordelijken, indien:

      1°. de verwerking noodzakelijk is voor de uitvoering van de taak van deze verwerkingsverantwoordelijken of groepen
      van verwerkingsverantwoordelijken; en

      2°. bij de uitvoering is voorzien in zodanige waarborgen dat de persoonlijke levenssfeer van de betrokkene niet
      onevenredig wordt geschaad; of

      c. de verwerking noodzakelijk is in aanvulling op de verwerking van gegevens over gezondheid, bedoeld in
      [artikel 30, derde lid, aanhef en onderdeel a][ref3], met het oog op een goede behandeling of verzorging van de
      betrokkene.

      2 Persoonsgegevens van strafrechtelijke aard mogen worden verwerkt door de verwerkingsverantwoordelijke die deze
      gegevens ten eigen behoeve verwerkt:

      a. ter beoordeling van een verzoek van betrokkene om een beslissing over hem te nemen of aan hem een prestatie te
      leveren; of

      b. ter bescherming van zijn belangen, voor zover het gaat om strafbare feiten die zijn of op grond van feiten en
      omstandigheden naar verwachting zullen worden gepleegd jegens hem of jegens personen die in zijn dienst zijn.

      3 Persoonsgegevens van strafrechtelijke aard over personeel in dienst van de verwerkingsverantwoordelijke mogen
      uitsluitend worden verwerkt, indien dit geschiedt overeenkomstig regels die zijn vastgesteld in overeenstemming met
      de procedure bedoeld in de [Wet op de ondernemingsraden][ref4].

      4 Persoonsgegevens van strafrechtelijke aard mogen ten behoeve van derden worden verwerkt:

      a. door verwerkingsverantwoordelijken die optreden krachtens een vergunning op grond van de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref5];

      b. indien deze derde een rechtspersoon is die in dezelfde groep is verbonden als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref6]; of

      c. indien de Autoriteit persoonsgegevens met inachtneming van het vijfde lid een vergunning voor de verwerking
      heeft verleend.

      5 Een vergunning als bedoeld in het vierde lid, onderdeel c, kan slechts worden verleend, indien de verwerking
      noodzakelijk is met het oog op een zwaarwegend belang van derden en bij de uitvoering is voorzien in zodanige
      waarborgen dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad. Aan de vergunning
      kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0014194
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0002747
      [ref5]: https://wetten.overheid.nl/BWBR0008973
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
