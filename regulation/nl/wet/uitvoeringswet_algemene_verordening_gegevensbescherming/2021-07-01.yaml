    text: |-
      De rechtspositie van de voorzitter, de andere leden en de buitengewone leden wordt geregeld bij of krachtens
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel9
  - number: '10'
    text: De Autoriteit persoonsgegevens heeft een secretariaat.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel10
  - number: '11'
    text: |-
      1 De Autoriteit persoonsgegevens stelt jaarlijks voorafgaand aan het desbetreffende begrotingsjaar een
      ontwerpbegroting op.

      2 In de departementale begroting, bedoeld in [artikel 2.1, zesde lid, van de Comptabiliteitswet 2016][ref1], kent
      Onze Minister jaarlijks aan de Autoriteit persoonsgegevens een budget toe ten laste van de rijksbegroting.

      3 De Autoriteit persoonsgegevens stelt de begroting vast in overeenstemming met het budget, bedoeld in het tweede
      lid.

      4 De Autoriteit persoonsgegevens wordt in en buiten rechte vertegenwoordigd door de voorzitter en de andere leden,
      dan wel door een van hen.

      5 De leden stellen een verdeling van taken vast en betrekken hierbij zoveel mogelijk de buitengewone leden.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.1
