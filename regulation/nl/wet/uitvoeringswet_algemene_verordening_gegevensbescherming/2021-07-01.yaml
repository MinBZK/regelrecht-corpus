  - number: '32'
    text: |-
      Persoonsgegevens van strafrechtelijke aard mogen worden verwerkt, indien:

      a. de betrokkene uitdrukkelijke toestemming heeft gegeven voor de verwerking van die persoonsgegevens voor een of
      meer welbepaalde doeleinden;

      b. de verwerking noodzakelijk is ter bescherming van de vitale belangen van de betrokkene of van een andere
      natuurlijke persoon, indien de betrokkene fysiek of juridisch niet in staat is zijn toestemming te geven;

      c. de verwerking betrekking heeft op persoonsgegevens die kennelijk door de betrokkene openbaar zijn gemaakt;

      d. de verwerking noodzakelijk is voor de instelling, uitoefening of onderbouwing van een rechtsvordering, of
      wanneer gerechten handelen in het kader van hun rechtsbevoegdheid;

      e. de verwerking noodzakelijk is om redenen van zwaarwegend algemeen belang als bedoeld in
      [artikel 23, onderdelen a en b][ref1]; of

      f. de verwerking noodzakelijk is met het oog op wetenschappelijk of historisch onderzoek of statistische
      doeleinden overeenkomstig artikel 89, eerste lid, van de verordening, en is voldaan aan de voorwaarden, bedoeld in
      [artikel 24, onderdelen b tot en met d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel24
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel32
