  - number: '37'
    text: |-
      Een verwerking kan niet ten grondslag worden gelegd aan een vordering als bedoeld in
      [artikel 305a, van Boek 3 van het Burgerlijk Wetboek][ref1] of een beroep ingesteld in een bestuursrechtelijke
      procedure door een belanghebbende in de zin van [artikel 1:2, derde lid, van de Algemene wet bestuursrecht][ref2],
      voor zover degene die door deze verwerking wordt getroffen, daartegen bezwaar heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel12
