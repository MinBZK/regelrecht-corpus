  - number: '28'
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de verordening, is het verbod om genetische gegevens te
      verwerken niet van toepassing, indien deze verwerking plaatsvindt met betrekking tot de betrokkene bij wie de
      desbetreffende gegevens zijn verkregen.

      2 In andere gevallen dan bedoeld in het eerste lid, is het verbod om genetische gegevens te verwerken uitsluitend
      niet van toepassing, indien:

      a. een zwaarwegend geneeskundig belang prevaleert; of

      b. de verwerking noodzakelijk is ten behoeve van wetenschappelijk onderzoek dat een algemeen belang dient of ten
      behoeve van statistiek, indien:

      1°. de betrokkene uitdrukkelijke toestemming heeft gegeven; en

      2°. bij de uitvoering is voorzien in zodanige waarborgen dat de persoonlijke levenssfeer van de betrokkene niet
      onevenredig wordt geschaad.

      3 Toestemming als bedoeld in het tweede lid, onderdeel b, is niet vereist, indien het vragen van uitdrukkelijke
      toestemming onmogelijk blijkt of een onevenredige inspanning vergt.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel28
  - number: '29'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel g, van de verordening, is het verbod om biometrische gegevens met het oog
      op de unieke identificatie van een persoon te verwerken niet van toepassing, indien de verwerking noodzakelijk is
      voor authenticatie of beveiligingsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel29
  - number: '30'
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel b, van de verordening, is het verbod om gegevens over gezondheid te
      verwerken niet van toepassing, indien de verwerking geschiedt door bestuursorganen, pensioenfondsen, werkgevers of
      instellingen die te hunnen behoeve werkzaam zijn, en voor zover de verwerking noodzakelijk is voor:

      a. een goede uitvoering van wettelijke voorschriften, pensioenregelingen of collectieve arbeidsovereenkomsten die
      voorzien in aanspraken die afhankelijk zijn van de gezondheidstoestand van de betrokkene; of

      b. de re-integratie of begeleiding van werknemers of uitkeringsgerechtigden in verband met ziekte of
      arbeidsongeschiktheid.

      2 Gelet op artikel 9, tweede lid, onderdeel g, van de verordening, is het verbod om gegevens over gezondheid te
      verwerken niet van toepassing, indien de verwerking geschiedt door:

      a. scholen, voor zover de verwerking met het oog op de speciale begeleiding van leerlingen of het treffen van
      bijzondere voorzieningen in verband met hun gezondheidstoestand noodzakelijk is;

      b. een reclasseringsinstelling, een bijzondere reclasseringsambtenaar, de raad voor de kinderbescherming, de
      gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], of de rechtspersoon, bedoeld in
      [artikel 256, eerste lid][ref2], of [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3], voor
      zover de verwerking noodzakelijk is voor de uitvoering van de aan hen opgedragen wettelijke taken; of

      c. Onze Minister en Onze Minister van Justitie en Veiligheid voor zover de verwerking in verband met de
      tenuitvoerlegging van vrijheidsbenemende maatregelen noodzakelijk is.

      3 Gelet op artikel 9, tweede lid, onderdeel h, van de verordening, is het verbod om gegevens over gezondheid te
      verwerken niet van toepassing indien de verwerking geschiedt door:

      a. hulpverleners, instellingen of voorzieningen voor gezondheidszorg of maatschappelijke dienstverlening, voor
      zover de verwerking noodzakelijk is met het oog op een goede behandeling of verzorging van de betrokkene dan wel
      het beheer van de betreffende instelling of beroepspraktijk; of

      b. verzekeraars als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref4] of financiële
      dienstverleners die bemiddelen in verzekeringen als bedoeld in artikel 1:1 van die wet, voor zover de verwerking
      noodzakelijk is voor:

      1°. de beoordeling van het door de verzekeraar te verzekeren risico en de betrokkene geen bezwaar heeft gemaakt; of

      2°. de uitvoering van de overeenkomst van verzekering dan wel het assisteren bij het beheer en de uitvoering van
      de verzekering.

      4 Indien toepassing wordt gegeven aan het eerste, tweede of derde lid, worden de gegevens alleen verwerkt
      door personen die uit hoofde van ambt, beroep of wettelijk voorschrift dan wel krachtens een overeenkomst tot
      geheimhouding zijn verplicht. Indien de verwerkingsverantwoordelijke persoonlijk gegevens verwerkt en op hem
      niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift een geheimhoudingsplicht rust, is hij verplicht
      tot geheimhouding van de gegevens, behoudens voor zover de wet hem tot mededeling verplicht of uit zijn taak de
      noodzaak voortvloeit dat de gegevens worden meegedeeld aan anderen die krachtens het eerste, tweede of derde lid
      bevoegd zijn tot verwerking daarvan.

      5 Het verbod om andere bijzondere categorieën van persoonsgegevens te verwerken is niet van toepassing, indien de
      verwerking noodzakelijk is in aanvulling op de verwerking van gegevens over gezondheid, bedoeld in het derde lid,
      aanhef en onderdeel a, met het oog op een goede behandeling of verzorging van de betrokkene.

      6 Bij algemene maatregel van bestuur kunnen omtrent de toepassing van het eerste lid en het derde lid, aanhef en
      onderdeel b, nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
