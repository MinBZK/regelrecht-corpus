  - number: '50'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar, aan
      de Staten-Generaal een verslag over de effecten van deze wet in de praktijk en over de uitvoering van de wet in
      de praktijk.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel50
  - number: '51'
    text: |-
      De [Wet bescherming persoonsgegevens][ref1] wordt ingetrokken.


