    text: |-
      1 De Autoriteit persoonsgegevens kan in geval van overtreding van het bepaalde in artikel 83, vierde, vijfde of
      zesde lid, van de verordening door een overheidsinstantie of een overheidsorgaan een bestuurlijke boete opleggen
      van ten hoogste de in deze leden genoemde bedragen.

      2 Artikel 83, eerste tot en met derde lid, van de verordening zijn van toepassing.

      3 De bestuurlijke boete komt toe aan de Staat.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel18
  - number: '19'
    text: |-
      1 De Autoriteit persoonsgegevens is bevoegd om in het belang van een efficiënt en effectief toezicht op de
      verwerking van persoonsgegevens afspraken te maken met andere toezichthouders en daartoe gezamenlijk met deze
      toezichthouders samenwerkingsprotocollen vast te stellen. Een samenwerkingsprotocol wordt bekendgemaakt in de
      Staatscourant.

      2 De Autoriteit persoonsgegevens en de toezichthouders, bedoeld in het eerste lid, zijn bevoegd uit eigen beweging
      en desgevraagd verplicht aan elkaar de gegevens betreffende de verwerking van persoonsgegevens te verstrekken
      die noodzakelijk zijn voor de uitvoering van hun taak of om te kunnen voldoen aan een op hen rustende wettelijke
      verplichting.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel19
  - number: '20'
    text: |-
      1 Indien de Autoriteit persoonsgegevens in een onderzoek betreffende de doorgifte van persoonsgegevens naar een
      land buiten de Europese Unie of naar een internationale organisatie, ingesteld op verzoek van een belanghebbende,
      gegronde redenen heeft om aan te nemen dat een door de Europese Commissie ten aanzien van het desbetreffende land
      of de desbetreffende internationale organisatie genomen adequaatheidsbesluit als bedoeld in artikel 45, eerste
      lid, van de verordening of een door de Europese Commissie genomen besluit met betrekking tot het vaststellen of
      goedkeuren van standaardbepalingen als bedoeld in artikel 46, tweede lid, onderdelen c en d, van de verordening
      onvoldoende waarborgen biedt voor een passend niveau van gegevensbescherming, kan de Autoriteit persoonsgegevens
      bij de Afdeling bestuursrechtspraak van de Raad van State een verzoek indienen om voor recht te verklaren dat het
      desbetreffende besluit geldig is.

      2 Het verzoekschrift wordt ondertekend en bevat ten minste:

      a. de dagtekening;

      b. de gronden van het verzoek;

      c. de namen van de belanghebbende en de partij die voorwerp is van het onderzoek, bedoeld in het eerste lid.

      3 Bij het verzoekschrift wordt een afschrift overgelegd van het verzoek van de belanghebbende om handhaving van bij
      of krachtens wet bepaalde regels inzake de bescherming van persoonsgegevens, waarop het in het tweede lid bedoelde
      verzoekschrift van de Autoriteit persoonsgegevens betrekking heeft en worden andere op de zaak betrekking hebbende
      stukken meegezonden.

      4 Onverminderd [artikel 4:15 van de Algemene wet bestuursrecht][ref1] wordt de termijn voor het geven van
      een beschikking op het verzoek om handhaving opgeschort gerekend vanaf de dag na die waarop de Autoriteit
      persoonsgegevens de verzoeker meedeelt dat toepassing is gegeven aan het eerste lid, tot de dag waarop de Afdeling
      bestuursrechtspraak van de Raad van State een uitspraak als bedoeld in het zesde lid heeft gedaan.

      5 Op de behandeling van het verzoek zijn de [titels 8.1][ref2] en [8.2 van de Algemene wet bestuursrecht][ref3]
      van overeenkomstige toepassing, met uitzondering van de [artikelen 8:1 tot en met 8:10][ref4], [8:41][ref5], de
      [afdelingen 8.2.2a][ref6] en [8.2.4a][ref7] en de [artikelen 8:70][ref8], [8:72][ref9] en [8:74][ref10]. De in het
      tweede lid, onderdeel c, bedoelde partijen worden als partijen in het geding aangemerkt.

      6 Indien de Afdeling bestuursrechtspraak van de Raad van State, al dan niet na prejudiciële verwijzing op grond van
      artikel 267 van het Verdrag inzake de werking van de Europese Unie aan het Hof van Justitie van de Europese Unie,
      tot het oordeel komt dat het aan haar voorgelegde besluit van de Europese Commissie geldig is, dan verklaart zij
      dat voor recht. Komt zij, na prejudiciële verwijzing aan het Hof van Justitie van de Europese Unie, tot het oordeel
      dat het aan haar voorgelegde besluit ongeldig is, dan wijst zij het verzoek af.

      7 De Afdeling bestuursrechtspraak van de Raad van State kan besluiten het verzoek aan te houden als er bij het Hof
      van Justitie van de Europese Unie al een prejudiciële vraag omtrent de geldigheid van het desbetreffende besluit
      aanhangig is.

      8 Tegen het aanhouden van het verzoek door de Afdeling bestuursrechtspraak van de Raad van State, staat geen
      voorziening open.


