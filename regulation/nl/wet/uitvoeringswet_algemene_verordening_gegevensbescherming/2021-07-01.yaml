preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is te voorzien in wettelijke regels ter uitvoering van
    Verordening (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van
    natuurlijke personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die
    gegevens en tot intrekking van Richtlijn 95/46/EG (algemene verordening gegevensbescherming) (PbEU 2016, L 119);

    Gelet op artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *bijzondere categorieën van persoonsgegevens:* de categorieën van persoonsgegevens, bedoeld in artikel 9, eerste
      lid, van de verordening
        - *Onze Minister:* Onze Minister voor Rechtsbescherming;
        - *persoonsgegevens van strafrechtelijke aard:* persoonsgegevens betreffende strafrechtelijke veroordelingen en
      strafbare feiten of daarmee verband houdende veiligheidsmaatregelen als bedoeld in artikel 10 van de verordening,
      alsmede persoonsgegevens betreffende een door de rechter opgelegd verbod naar aanleiding van onrechtmatig of
      hinderlijk gedrag;
        - *verordening:* verordening (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende
      de bescherming van natuurlijke personen in verband met verwerking van persoonsgegevens en betreffende het vrije
      verkeer van die gegevens en tot intrekking van Richtlijn 95/46/EG (algemene verordening gegevensbescherming) (PbEU
      2016, L 119).
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel1
  - number: '2'
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn van toepassing op de geheel of gedeeltelijk geautomatiseerde
      verwerking van persoonsgegevens, alsmede op de verwerking van persoonsgegevens die in een bestand zijn opgenomen of
      die bestemd zijn om daarin te worden opgenomen.

      2 In afwijking van het eerste lid, is deze wet niet van toepassing op de verwerking van persoonsgegevens voor zover
      daarop de [Wet basisregistratie personen][ref1], de [Kieswet][ref2] of de [Wet raadgevend referendum][ref3] van
      toepassing is.

      3 Behoudens het bepaalde in [artikel 3][ref4], is deze wet niet van toepassing op de verwerking van
      persoonsgegevens, bedoeld in artikel 2, tweede lid, van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0004627
