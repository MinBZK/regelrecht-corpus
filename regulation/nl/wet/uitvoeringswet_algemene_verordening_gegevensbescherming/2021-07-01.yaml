  - number: '52'
    text: |-
      Verordening (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming
      van natuurlijke personen in verband met verwerking van persoonsgegevens en betreffende het vrije verkeer van die
      gegevens en tot intrekking van Richtlijn 95/46/EG (algemene verordening gegevensbescherming) (PbEU 2016, L 119)
      wordt in overige wetgeving aangehaald als: Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel52
  - number: '53'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel53
  - number: '54'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet Algemene verordening gegevensbescherming.'
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel54
