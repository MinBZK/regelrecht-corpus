  - number: '36'
    text: |-
      1 De belanghebbende kan zich ook binnen de termijn bepaald voor het instellen van beroep op grond van
      de [Algemene wet bestuursrecht][ref1], dan wel die, bedoeld in [artikel 35, tweede lid][ref2], tot de
      Autoriteit persoonsgegevens wenden met het verzoek te bemiddelen of te adviseren in zijn geschil met de
      verwerkingsverantwoordelijke, dan wel gebruik maken van een geschillenbeslechtingsregeling als bedoeld
      in artikel 40, tweede lid, onderdeel k, van de verordening, op grond van een goedgekeurde gedragscode
      als bedoeld in artikel 40, vijfde lid, van de verordening. In dat geval kan het beroep in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref3] nog worden ingesteld dan wel de procedure ingevolge artikel
      35 nog aanhangig worden gemaakt nadat de belanghebbende van de Autoriteit persoonsgegevens bericht heeft ontvangen
      dat de behandeling van de zaak is beëindigd of ingevolge de geschillenbeslechtingsregeling, bericht heeft ontvangen
      dat de behandeling van de zaak is beëindigd, doch uiterlijk zes weken na dat tijdstip.

      2 Tijdens de behandeling van het beroep en de procedure, bedoeld in het eerste lid, kunnen de instanties die zijn
      belast met de behandeling van het geschil, advies van de Autoriteit persoonsgegevens inwinnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel67
