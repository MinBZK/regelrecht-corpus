  - number: 48a
    text: |-
      1

      2

      3 Op het tijdstip van inwerkingtreding van dit artikel zijn de ambtenaren van het secretariaat, bedoeld in
      [artikel 10, eerste lid][ref1], van wie naam en functie zijn vermeld op een door Onze Minister in overleg met de
      Autoriteit persoonsgegevens vastgestelde lijst, van rechtswege ontslagen en aangesteld als ambtenaar in dienst
      van de Autoriteit persoonsgegevens. De overgang van de in de vorige volzin bedoelde ambtenaren vindt plaats met
      een rechtspositie die als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold op de dag voor de
      datum van inwerkingtreding van dit artikel.

      4 Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      worden toebedeeld aan de Autoriteit persoonsgegevens.

      5 De in het vierde lid bedoelde vermogensbestanddelen gaan op het tijdstip van inwerkingtreding van dit artikel
      onder algemene titel over op tegen een door Onze Minister in overeenstemming met Onze Minister van Financiën te
      bepalen waarde.

      6 Ingeval krachtens het vierde en het vijfde lid registergoederen overgaan, doet Onze Minister
      van Financiën de overgang van die registergoederen onverwijld inschrijven in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref3] is niet van toepassing.

      7 In wettelijke procedures en rechtsgedingen, waarbij de Autoriteit persoonsgegevens is betrokken, treedt op het
      tijdstip van inwerkingtreding van dit artikel de Autoriteit persoonsgegevens in de plaats van de Staat dan wel
      Onze Minister.

      8 In zaken waarin voor het tijdstip van inwerkingtreding van dit artikel aan de Nationale ombudsman is verzocht
      een onderzoek te doen dan wel de Nationale ombudsman een onderzoek heeft ingesteld naar een gedraging die kan
      worden toegerekend aan de Autoriteit persoonsgegevens, treedt de Autoriteit persoonsgegevens op dat tijdstip als
      bestuursorgaan in de zin van de [Wet Nationale ombudsman][ref4] in de plaats van Onze Minister.


