  - number: '34'
    text: |-
      Een schriftelijke beslissing op een verzoek als bedoeld in de artikelen 15 tot en met 22 van de verordening wordt
      genomen binnen de in artikel 12, derde lid, van de verordening genoemde termijnen en geldt, voor zover deze is
      genomen door een bestuursorgaan, als een besluit in de zin van de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '35'
    text: |-
      1 Indien de beslissing op een verzoek als bedoeld in [artikel 34][ref1] is genomen door een ander dan
      een bestuursorgaan, kan de belanghebbende zich tot de rechtbank wenden met het schriftelijk verzoek de
      verwerkingsverantwoordelijke te bevelen het verzoek als bedoeld in de artikelen 15 tot en met 22 van de verordening
      alsnog toe of af te wijzen.

      2 Het verzoekschrift wordt ingediend binnen zes weken na ontvangst van het antwoord van de
      verwerkingsverantwoordelijke. Indien de verwerkingsverantwoordelijke niet binnen de in artikel 12, derde lid, van
      de verordening genoemde termijnen heeft geantwoord, is de indiening van het verzoekschrift niet aan een termijn
      gebonden.

      3 De rechtbank wijst het verzoek toe, voor zover zij dit gegrond oordeelt. Alvorens de rechtbank beslist, stelt zij
      zo nodig de belanghebbenden in de gelegenheid hun zienswijze naar voren te brengen.

      4 De indiening van het verzoekschrift behoeft niet door een advocaat te geschieden.

      5 De [derde afdeling van de vijfde titel van het Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      is van overeenkomstige toepassing.

      6 De rechtbank kan partijen en anderen verzoeken binnen een door haar te bepalen termijn schriftelijke
      inlichtingen te geven en onder hen berustende stukken in te zenden. De verwerkingsverantwoordelijke en
      belanghebbende zijn verplicht aan dit verzoek te voldoen. De [artikelen 8:45, tweede en derde lid][ref3], en
      [8:29 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel611a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel845
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel829
