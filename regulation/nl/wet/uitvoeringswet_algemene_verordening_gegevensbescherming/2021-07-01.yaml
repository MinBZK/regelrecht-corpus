    text: |-
      De [artikelen 46c][ref1], [46d, tweede lid][ref2], [46f][ref3], [46g][ref4],
      [46i, met uitzondering van het eerste lid, onderdeel c][ref5], [46j][ref6], [46l, eerste en derde lid][ref7],
      [46m][ref8], [46n][ref9], [46o][ref10] en [46p van de Wet rechtspositie rechterlijke ambtenaren][ref11] zijn
      van overeenkomstige toepassing op de voorzitter en de andere leden van de Autoriteit persoonsgegevens, met dien
      verstande dat:

      a. de disciplinaire maatregel bedoeld in [artikel 46c, eerste lid][ref12], ten aanzien van de andere leden van de
      Autoriteit persoonsgegevens door de voorzitter van de Autoriteit persoonsgegevens wordt opgelegd;

      b. het in [artikel 46c, eerste lid, onderdeel b][ref13], genoemde verbod zich in een onderhoud of een gesprek in te
      laten met partijen of hun advocaten of gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan
      te nemen, niet op de voorzitter en de andere leden van de Autoriteit persoonsgegevens van toepassing is;

      c. de disciplinaire maatregel bedoeld in [artikel 46c, eerste lid][ref14], ten aanzien van de voorzitter van de
      Autoriteit persoonsgegevens door de president van het gerechtshof Den Haag wordt opgelegd.


