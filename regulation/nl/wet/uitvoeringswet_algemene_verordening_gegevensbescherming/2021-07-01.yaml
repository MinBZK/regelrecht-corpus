  - number: '4'
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn van toepassing op de verwerking van persoonsgegevens in het
      kader van activiteiten van een vestiging van een verwerkingsverantwoordelijke of een verwerker in Nederland.

      2 Deze wet en de daarop berustende bepalingen zijn van toepassing op verwerking van persoonsgegevens
      van betrokkenen die zich in Nederland bevinden door een niet in de Europese Unie gevestigde
      verwerkingsverantwoordelijke of verwerker, wanneer de verwerking verband houdt met:

      a. het aanbieden van goederen of diensten aan deze betrokkenen in Nederland, ongeacht of een betaling door de
      betrokkenen is vereist; of

      b. het monitoren van hun gedrag, voor zover dit gedrag in Nederland plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel4
  - number: '5'
    text: |-
      1 Indien artikel 8 van de verordening niet van toepassing is, is in de plaats van de toestemming van de betrokkene
      die van zijn wettelijk vertegenwoordiger vereist indien de betrokkene de leeftijd van zestien jaren nog niet heeft
      bereikt.

      2 Indien de betrokkene onder curatele is gesteld, dan wel ten behoeve van de betrokkene een bewind of mentorschap
      is ingesteld, is, voor zover het een aangelegenheid betreft waarvoor de betrokkene onbekwaam dan wel onbevoegd is,
      in de plaats van de toestemming van de betrokkene die van zijn wettelijk vertegenwoordiger vereist.

      3 Toestemming kan door de wettelijk vertegenwoordiger van de betrokkene te allen tijde worden ingetrokken.

      4 De rechten van de betrokkene, bedoeld in hoofdstuk III van de verordening, worden ten aanzien van betrokkenen
      die de leeftijd van zestien jaren nog niet hebben bereikt, ten aanzien van onder curatele gestelden en ten
      aanzien van betrokkenen ten behoeve van wie een bewind of mentorschap is ingesteld, uitgeoefend door hun wettelijk
      vertegenwoordigers, voor zover het een aangelegenheid betreft waarvoor de betrokkene onbekwaam dan wel onbevoegd
      is.

      5 Dit artikel is niet van toepassing op hulp- en adviesdiensten die rechtstreeks en kosteloos aan een minderjarige
      of een onder curatele gestelde worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel5
  - number: '6'
    text: |-
      1 Er is een Autoriteit persoonsgegevens. De Autoriteit persoonsgegevens bezit rechtspersoonlijkheid.

      2 De Autoriteit persoonsgegevens is de toezichthoudende autoriteit, bedoeld in artikel 51, eerste lid, van de
      verordening.

      3 Onverminderd artikel 57 van de verordening, heeft de Autoriteit persoonsgegevens tot taak toe te zien op de
      verwerking van persoonsgegevens overeenkomstig het bij en krachtens de verordening of de wet bepaalde.

      4 Ter uitvoering van een bindende EU-rechtshandeling kunnen, gehoord de Autoriteit persoonsgegevens, bij regeling
      van Onze Minister aan de Autoriteit persoonsgegevens taken worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel6
  - number: '7'
    text: |-
      1 De Autoriteit persoonsgegevens bestaat uit een voorzitter en twee andere leden.

      2 Bij de Autoriteit persoonsgegevens kunnen voorts buitengewone leden worden benoemd. Bij de benoeming van
      buitengewone leden wordt spreiding over de onderscheidene sectoren van de maatschappij nagestreefd.

      3 De voorzitter, de andere leden en de buitengewone leden van de Autoriteit persoonsgegevens worden bij koninklijk
      besluit, op voordracht van Onze Minister, benoemd.

      4 De voorzitter voldoet aan de bij of krachtens [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1]
      gestelde vereisten voor benoembaarheid tot rechter in een rechtbank.

      5 De benoeming, bedoeld in het derde lid, geldt voor een tijdvak van vijf jaar.

      6 De voorzitter, de andere leden en de buitengewone leden van de Autoriteit persoonsgegevens kunnen eenmaal worden
      herbenoemd voor een tijdvak van vijf jaar.

      7 Op eigen verzoek worden de voorzitter, de andere leden en de buitengewone leden van de Autoriteit
      persoonsgegevens door Onze Minister ontslagen.

      8 [Artikel 12 van de Kaderwet zelfstandige bestuursorganen][ref2] is niet van toepassing.

      9 Er is een Raad van advies die de Autoriteit persoonsgegevens adviseert over algemene aspecten van de bescherming
      van persoonsgegevens. De leden zijn afkomstig uit de onderscheidene sectoren van de maatschappij en worden benoemd
      door Onze Minister, op voordracht van de voorzitter van de Autoriteit persoonsgegevens. De leden worden benoemd
      voor ten hoogste vier jaar. Herbenoeming kan tweemaal en telkens voor ten hoogste vier jaar plaatsvinden. Bij
      ministeriële regeling wordt de vergoeding van de kosten aan de leden van de Raad van advies vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel7
