  - number: 2a
    text: |-
      De Autoriteit persoonsgegevens neemt bij de toepassing van de verordening de specifieke behoeften van kleine,
      middelgrote en micro-ondernemingen als bedoeld in artikel 2 van de bijlage bij Aanbeveling 2003/361/EG van de
      Commissie van 6 mei 2003 betreffende de definitie van kleine, middelgrote en micro-ondernemingen (PbEU 2003 L124)
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel2a
  - number: '3'
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn mede van toepassing op de verwerking van persoonsgegevens:

      a. in het kader van activiteiten die buiten de werkingssfeer van het Unierecht vallen;

      b. door de krijgsmacht bij de uitvoering van activiteiten die binnen de werkingssfeer van titel V, hoofdstuk 2, van
      het Verdrag betreffende de Europese Unie vallen.

      2 De verordening is van overeenkomstige toepassing op de verwerking van persoonsgegevens, bedoeld in het eerste
      lid.

      3 Het eerste en het tweede lid zijn niet van toepassing op:

      a. de verwerking van persoonsgegevens door de krijgsmacht, voor zover Onze Minister van Defensie daartoe
      beslist met het oog op de inzet of het ter beschikking stellen van de krijgsmacht ter uitvoering van de in
      [artikel 97 van de Grondwet][ref1] omschreven taken;

      b. de verwerking van persoonsgegevens voor zover daarop de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2] van toepassing is.

      4 Van een besluit als bedoeld in het derde lid, onderdeel a, wordt zo spoedig mogelijk mededeling gedaan aan de
      Autoriteit persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel3
