  - number: '22'
    text: |-
      1 Overeenkomstig artikel 9, eerste lid, van de verordening zijn verwerking van persoonsgegevens waaruit ras of
      etnische afkomst, politieke opvattingen, religieuze of levensbeschouwelijke overtuigingen, of het lidmaatschap
      van een vakbond blijken, en verwerking van genetische gegevens, biometrische gegevens met het oog op de unieke
      identificatie van een persoon, of gegevens over gezondheid, of gegevens met betrekking tot iemands seksueel gedrag
      of seksuele gerichtheid verboden.

      2 Overeenkomstig artikel 9, tweede lid, onderdelen a, c, d, e en f, van de verordening is het verbod om bijzondere
      categorieën van persoonsgegevens te verwerken niet van toepassing, indien:

      a. de betrokkene uitdrukkelijke toestemming heeft gegeven voor de verwerking van die persoonsgegevens voor een of
      meer welbepaalde doeleinden;

      b. de verwerking noodzakelijk is ter bescherming van de vitale belangen van de betrokkene of van een andere
      natuurlijke persoon, indien de betrokkene fysiek of juridisch niet in staat is zijn toestemming te geven;

      c. de verwerking wordt verricht door een stichting, een vereniging of een andere instantie zonder winstoogmerk
      die op politiek, levensbeschouwelijk, godsdienstig of vakbondsgebied werkzaam is, in het kader van haar
      gerechtvaardigde activiteiten en met passende waarborgen, mits de verwerking uitsluitend betrekking heeft op de
      leden of de voormalige leden van de instantie of op personen die in verband met haar doeleinden regelmatig contact
      met haar onderhouden, en de persoonsgegevens niet zonder de toestemming van de betrokkenen buiten die instantie
      worden verstrekt;

      d. de verwerking betrekking heeft op persoonsgegevens die kennelijk door de betrokkene openbaar zijn gemaakt; of

      e. de verwerking noodzakelijk is voor de instelling, uitoefening of onderbouwing van een rechtsvordering, of
      wanneer gerechten handelen in het kader van hun rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel22
  - number: '23'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel g, van de verordening, is het verbod om bijzondere categorieën van
      persoonsgegevens te verwerken niet van toepassing, indien:

      a. de verwerking noodzakelijk is ter voldoening aan een volkenrechtelijke verplichting;

      b. de gegevens worden verwerkt door de Autoriteit persoonsgegevens of een ombudsman als bedoeld in
      [artikel 9:17 van de Algemene wet bestuursrecht][ref1], en voor zover de verwerking noodzakelijk is voor de
      uitvoering van de hun wettelijk opgedragen taken, onder voorwaarde dat bij die uitvoering is voorzien in zodanige
      waarborgen dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad; of

      c. de verwerking noodzakelijk is in aanvulling op de verwerking van persoonsgegevens van strafrechtelijke aard voor
      de doeleinden waarvoor deze gegevens worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel917
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 9:17
  - number: '24'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel j, van de verordening, is het verbod om bijzondere categorieën van
      persoonsgegevens te verwerken niet van toepassing, indien:

      a. de verwerking noodzakelijk is met het oog op wetenschappelijk of historisch onderzoek of statistische doeleinden
      overeenkomstig artikel 89, eerste lid, van de verordening;

      b. het onderzoek, bedoeld in onderdeel a, een algemeen belang dient;

      c. het vragen van uitdrukkelijke toestemming onmogelijk blijkt of een onevenredige inspanning kost; en

      d. bij de uitvoering is voorzien in zodanige waarborgen dat de persoonlijke levenssfeer van de betrokkene niet
      onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel24
  - number: '25'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel g, van de verordening, is het verbod om persoonsgegevens te verwerken
      waaruit ras of etnische afkomst blijkt, niet van toepassing, indien de verwerking geschiedt:

      a. met het oog op de identificatie van de betrokkene, en slechts voor zover de verwerking voor dat doel
      onvermijdelijk is; of

      b. met het doel personen van een bepaalde etnische of culturele minderheidsgroep een bevoorrechte positie toe
      te kennen teneinde feitelijke nadelen, verband houdende met de grond ras of etnische afkomst, op te heffen of te
      verminderen, en slechts voor zover:

      1°. de verwerking voor dat doel noodzakelijk is;

      2°. de gegevens betrekking hebben op het geboorteland van de betrokkene, diens ouders of diens grootouders, dan wel
      op andere, bij wet vastgestelde criteria op grond waarvan op objectieve wijze vastgesteld kan worden of iemand tot
      een bepaalde etnische of culturele minderheidsgroep behoort; en

      3°. de betrokkene tegen de verwerking geen schriftelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel25
  - number: '26'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel g, van de verordening, is het verbod om persoonsgegevens te verwerken
      waaruit politieke opvattingen blijken, niet van toepassing, indien de verwerking geschiedt met het oog op de eisen
      die met betrekking tot politieke opvattingen in redelijkheid kunnen worden gesteld in verband met de vervulling van
      functies in bestuursorganen en adviescolleges.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel26
  - number: '27'
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de verordening, is het verbod om persoonsgegevens te verwerken
      waaruit religieuze of levensbeschouwelijke overtuigingen blijken, niet van toepassing, indien de verwerking
      geschiedt door andere instellingen dan de instellingen, bedoeld in [artikel 22, tweede lid, onderdeel c][ref1], en
      voor zover de verwerking noodzakelijk is met het oog op de geestelijke verzorging van de betrokkene, tenzij deze
      daartegen schriftelijk bezwaar heeft gemaakt.

      2 In de gevallen, bedoeld in het eerste lid, worden geen persoonsgegevens aan derden verstrekt zonder toestemming
      van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel22
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel27
