  - number: '38'
    text: |-
      De werking van de beschikking tot oplegging van de bestuurlijke boete wordt opgeschort totdat de bezwaar- of
      beroepstermijn is verstreken of, indien bezwaar is gemaakt of beroep is ingesteld, totdat op het bezwaar of het
      beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel38
  - number: '39'
    text: |-
      De functionaris voor gegevensbescherming, bedoeld in de artikelen 37 tot en met 39 van de verordening, is verplicht
      tot geheimhouding van hetgeen hem op grond van een klacht of een verzoek van betrokkene is bekend geworden, tenzij
      de betrokkene in bekendmaking toestemt.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel39
  - number: '40'
    text: |-
      1 Artikel 22, eerste lid, van de verordening geldt niet indien de in die bepaling bedoelde geautomatiseerde
      individuele besluitvorming, anders dan op basis van profilering, noodzakelijk is om te voldoen aan een wettelijke
      verplichting die op de verwerkingsverantwoordelijke rust of noodzakelijk is voor de vervulling van een taak van
      algemeen belang.

      2 Bij de geautomatiseerde individuele besluitvorming, bedoeld in het eerste lid, treft de
      verwerkingsverantwoordelijke passende maatregelen die strekken tot bescherming van de rechten en vrijheden en
      gerechtvaardigde belangen van de betrokkene.

      3 Indien de verwerkingsverantwoordelijke geen bestuursorgaan is, dan zijn passende maatregelen als bedoeld in het
      tweede lid, in ieder geval getroffen indien het recht op menselijke tussenkomst, het recht voor betrokkene om zijn
      standpunt kenbaar te maken en het recht om het besluit aan te vechten, zijn geborgd.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel40
  - number: '41'
    text: |-
      1 De verwerkingsverantwoordelijke kan de verplichtingen en rechten, bedoeld in de artikelen 12 tot en met 21
      en artikel 34 van de verordening, buiten toepassing laten voor zover zulks noodzakelijk en evenredig is ter
      waarborging van:

      a. de nationale veiligheid;

      b. landsverdediging;

      c. de openbare veiligheid;

      d. de voorkoming, het onderzoek, de opsporing en de vervolging van strafbare feiten of de tenuitvoerlegging van
      straffen, met inbegrip van de bescherming tegen en de voorkoming van gevaren voor de openbare veiligheid;

      e. andere belangrijke doelstellingen van algemeen belang van de Europese Unie of van Nederland, met name een
      belangrijk economisch of financieel belang van de Europese Unie of van Nederland, met inbegrip van monetaire,
      budgettaire en fiscale aangelegenheden, volksgezondheid en sociale zekerheid;

      f. de bescherming van de onafhankelijkheid van de rechter en gerechtelijke procedures;

      g. de voorkoming, het onderzoek, de opsporing en de vervolging van schendingen van de beroepscodes voor
      gereglementeerde beroepen;

      h. een taak op het gebied van toezicht, inspectie of regelgeving die verband houdt, al is het incidenteel, met de
      uitoefening van het openbaar gezag in de gevallen, bedoeld in de onderdelen a, b, c, d, e en g;

      i. de bescherming van de betrokkene of van de rechten en vrijheden van anderen; of

      j. de inning van civielrechtelijke vorderingen.

      2 Bij de toepassing van het eerste lid houdt de verwerkingsverantwoordelijke rekening met in ieder geval, voor
      zover van toepassing:

      a. de doeleinden van de verwerking of van de categorieën van verwerking;

      b. de categorieën van persoonsgegevens;

      c. het toepassingsgebied van de ingevoerde beperkingen;

      d. de waarborgen ter voorkoming van misbruik of onrechtmatige toegang of doorgifte;

      e. de specificatie van de verwerkingsverantwoordelijke of de categorieën van verwerkingsverantwoordelijken;

      f. de opslagperiodes en de toepasselijke waarborgen, rekening houdend met de aard, de omvang en de doeleinden van
      de verwerking of van de categorieën van verwerking;

      g. de risico's voor de rechten en vrijheden van de betrokkenen; en

      h. het recht van betrokkenen om van de beperking op de hoogte te worden gesteld, tenzij dit afbreuk kan doen aan
      het doel van de beperking.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel41
  - number: '42'
    text: |-
      Artikel 34 van de verordening is niet van toepassing op financiële ondernemingen als bedoeld in de
      [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '43'
    text: |-
      1 Deze wet, met uitzondering van de [artikelen 1 tot en met 4][ref1] en [5, eerste en tweede lid][ref2], is niet
      van toepassing op de verwerking van persoonsgegevens voor uitsluitend journalistieke doeleinden en ten behoeve van
      uitsluitend academische, artistieke of literaire uitdrukkingsvormen.

      2 De navolgende hoofdstukken en artikelen van de verordening zijn niet van toepassing op de verwerking van
      persoonsgegevens voor uitsluitend journalistieke doeleinden en ten behoeve van academische, artistieke of literaire
      uitdrukkingsvormen:

      a. artikel 7, derde lid, en artikel 11, tweede lid:

      b. hoofdstuk III;

      c. hoofdstuk IV, met uitzondering van de artikelen 24, 25, 28, 29 en 32;

      d. hoofdstuk V;

      e. hoofdstuk VI; en

      f. hoofdstuk VII.

      3 De artikelen 9 en 10 van de verordening zijn niet van toepassing voor zover de verwerking van de in die
      artikelen bedoelde gegevens noodzakelijk is voor het journalistieke doel of de academische, artistieke of literaire
      uitdrukkingsvorm.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel5
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0040940
        artikel: '5'
        hoofdstuk: '1'
  - number: '44'
    text: |-
      Indien een verwerking wordt verricht door instellingen of diensten voor wetenschappelijk onderzoek of statistiek,
      en de nodige voorzieningen zijn getroffen om te verzekeren dat de persoonsgegevens uitsluitend voor statistische of
      wetenschappelijke doeleinden kunnen worden gebruikt, kan de verwerkingsverantwoordelijke de artikelen 15, 16 en 18
      van de verordening buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel44
  - number: '45'
    text: |-
      1 Bij de verwerking van persoonsgegevens die deel uitmaken van archiefbescheiden als bedoeld in
      [artikel 1, onderdeel c, van de Archiefwet 1995][ref1], die berusten in een archiefbewaarplaats als bedoeld
      in artikel 1, onderdeel f, van die wet, zijn de artikelen 15, 16, 18, eerste lid, onderdeel a, en 20 van de
      verordening niet van toepassing.

      2 Betrokkene heeft het recht om inzage te verkrijgen in de archiefbescheiden, tenzij verzoeken om inzage zodanig
      ongericht zijn dat deze in redelijkheid niet kunnen worden ingewilligd.

      3 Betrokkene heeft het recht om, in geval van onjuiste persoonsgegevens, zijn eigen lezing aan de desbetreffende
      archiefbescheiden toe te voegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
  - number: '46'
    text: |-
      1 Een nummer dat ter identificatie van een persoon bij wet is voorgeschreven, wordt bij de verwerking van
      persoonsgegevens slechts gebruikt ter uitvoering van de desbetreffende wet dan wel voor doeleinden bij de wet
      bepaald.

      2 Bij algemene maatregel van bestuur kunnen andere dan in het eerste lid bedoelde gevallen worden aangewezen waarin
      een daarbij aan te wijzen nummer als bedoeld in het eerste lid, kan worden gebruikt. Daarbij kunnen nadere regels
      worden gegeven over het gebruik van een zodanig nummer.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel46
  - number: '47'
    text: |-
      1 De artikelen 15, 16, 18 en 19 van de verordening zijn niet van toepassing op bij de wet ingestelde openbare
      registers, indien bij of krachtens die wet een bijzondere procedure voor de verbetering, aanvulling, verwijdering
      of afscherming van gegevens is geregeld.

      2 Artikel 21 van de verordening is niet van toepassing op bij de wet ingestelde openbare registers.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel47
  - number: '48'
    text: |-
      1 Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als lid van het College bescherming
      persoonsgegevens, is van rechtswege benoemd als lid van de Autoriteit persoonsgegevens.

      2 Degene die voorafgaand aan de inwerkingtreding van deze wet is benoemd als voorzitter van het College bescherming
      persoonsgegevens, is van rechtswege is benoemd als voorzitter van de Autoriteit persoonsgegevens.

      3 Voor het bepalen van het tijdvak van de benoeming, bedoeld in [artikel 7, vijfde lid][ref1], geldt het tijdvak,
      vervuld als voorzitter van het College bescherming persoonsgegevens, voorafgaand aan de inwerkingtreding van deze
      wet als een tijdvak, vervuld als voorzitter van de Autoriteit persoonsgegevens.

      4 Op de leden van het College bescherming persoonsgegevens die zijn benoemd of herbenoemd voor 1 januari 2014,
      blijft [artikel 53, derde lid, eerste, tweede en derde volzin, van de Wet bescherming persoonsgegevens][ref2] van
      toepassing, zoals dat luidde voor dat tijdstip.

      5 De ambtenaar die voorafgaand aan de inwerkingtreding van deze wet is benoemd in het secretariaat van het College
      bescherming persoonsgegevens, is van rechtswege benoemd als ambtenaar in het secretariaat van de Autoriteit
      persoonsgegevens.

      6 Besluiten die voorafgaand aan de inwerkingtreding van deze wet zijn genomen door het College bescherming
      persoonsgegevens gelden van rechtswege als besluiten, genomen door de Autoriteit persoonsgegevens.

      7 In wettelijke procedures en rechtsgedingen waarbij het College bescherming persoonsgegevens voorafgaand aan de
      inwerkingtreding van deze wet is betrokken, treedt de Autoriteit persoonsgegevens van rechtswege in de plaats van
      het College bescherming persoonsgegevens.

      8 Op wettelijke procedures en rechtsgedingen waarbij het College bescherming persoonsgegevens voorafgaand aan
      de inwerkingtreding van deze wet is betrokken, is het recht van toepassing zoals dit gold voorafgaand aan de
      inwerkingtreding van deze wet.

      9 In samenwerkingsprotocollen treedt op het tijdstip van inwerkingtreding van deze wet de Autoriteit
      persoonsgegevens van rechtswege in de plaats van het College bescherming persoonsgegevens.

      10 Op schriftelijke verzoeken als bedoeld in [artikel 46 van de Wet bescherming persoonsgegevens][ref3],
      rechtsgedingen op basis van [artikel 49 van de Wet bescherming persoonsgegevens][ref4] en vorderingen op basis
      van [artikel 50 van de Wet bescherming persoonsgegevens][ref5], die op het moment van inwerkingtreding van
      deze wet reeds aanhangig zijn bij de rechtbank is het recht van toepassing zoals dit gold voorafgaand aan de
      inwerkingtreding van deze wet.

      11 Een verklaring van rechtmatigheid van de gegevensverwerking die voorafgaand aan de inwerkingtreding
      van deze wet is afgegeven op grond van [artikel 32, vijfde lid,][ref6] in samenhang met
      [artikel 22, vierde lid, onder c, van de Wet bescherming persoonsgegevens][ref7], geldt van rechtswege als een
      vergunning in de zin van [artikel 33, vierde lid, onder c, van deze wet][ref8].

      12 Voor zover deze wet daarin niet voorziet, kunnen bij algemene maatregel van bestuur regels of nadere regels
      worden gesteld omtrent de invoering van de verordening of deze wet.


