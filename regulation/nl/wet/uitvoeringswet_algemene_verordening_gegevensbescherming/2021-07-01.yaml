  - number: '15'
    text: |-
      1 Met het toezicht op de naleving van de verordening en op de verwerking van persoonsgegevens overeenkomstig het
      bij of krachtens de wet bepaalde zijn belast de leden en buitengewone leden van de Autoriteit persoonsgegevens,
      de ambtenaren van het secretariaat van de Autoriteit persoonsgegevens, alsmede de bij besluit van de Autoriteit
      persoonsgegevens aangewezen personen.

      2 De in het eerste lid bedoelde personen zijn bevoegd een woning te betreden zonder toestemming van de bewoner.

      3 De in het eerste lid bedoelde personen behoeven voor de uitoefening van de in het tweede lid omschreven
      bevoegdheid de uitdrukkelijke en bijzondere volmacht van de Autoriteit persoonsgegevens, onverminderd het bepaalde
      in [artikel 2 van de Algemene wet op het binnentreden][ref1].

      4 Geen beroep is mogelijk op een geheimhoudingsplicht, voor zover inlichtingen of medewerking wordt verlangd in
      verband met de eigen betrokkenheid bij de verwerking van persoonsgegevens.

      5 Dit artikel en [titel 5.2 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing voor zover
      dit noodzakelijk is voor een goede uitoefening van de taken die de Autoriteit persoonsgegevens uitvoert in het
      kader van hoofdstuk VII van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537
