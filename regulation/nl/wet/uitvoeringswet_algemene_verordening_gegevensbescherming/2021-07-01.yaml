  - number: '21'
    text: |-
      Bij ministeriële regeling wordt of de Autoriteit persoonsgegevens of de Raad voor Accreditatie of worden zij beide
      aangewezen als accrediterende instantie als bedoeld in artikel 43 van de verordening.
    url: https://wetten.overheid.nl/BWBR0040940/2021-07-01#Artikel21
  - number: 21a
    text: |-
      1 De taak van de Autoriteit persoonsgegevens, bedoeld in [artikel 6, derde lid][ref1], omvat mede het toezicht
      op de naleving van de krachtens [artikel 3:17, zevende lid, van de Wet op het financieel toezicht][ref2]
      gestelde verplichtingen met betrekking tot de toegang van betaaldienstverleners tot de persoonsgegevens van
      betaaldienstgebruikers.

      2 Met betrekking tot het toezicht, bedoeld in het eerste lid, vindt de samenwerking en uitwisseling van informatie
      met De Nederlandsche Bank N.V. en andere relevante toezichthouders plaats overeenkomstig artikel 26 van de
      richtlijn betaaldiensten, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3].

      3 De Autoriteit persoonsgegevens kan in geval van overtreding van de krachtens
      [artikel 3.17, zevende lid, van de Wet op het financieel toezicht][ref4] gestelde verplichtingen aan de overtreder
      een last opleggen om waar passend, op een nader bepaalde manier en binnen een nader bepaalde termijn, verwerkingen
      in overeenstemming te brengen met het daar bepaalde. [Artikel 16][ref5] is van overeenkomstige toepassing.

      4 De Autoriteit persoonsgegevens kan in geval van een overtreding van de krachtens
      [artikel 3.17, zevende lid, van de Wet op het financieel toezicht][ref6] gestelde verplichtingen aan de overtreder
      een bestuurlijke boete opleggen van ten hoogste 20.000.000 euro of, indien dit meer is, ten hoogste 4% van de
      totale wereldwijde jaaromzet in het voorgaande boekjaar. Artikel 83, tweede en derde lid, van de verordening is van
      overeenkomstige toepassing.

      5 De bestuurlijke boete en de te betalen geldsom van een verbeurde dwangsom komen toe aan de Staat.


