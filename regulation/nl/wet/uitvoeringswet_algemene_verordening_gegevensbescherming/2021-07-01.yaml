  - number: '14'
    text: |-
      1 De Autoriteit persoonsgegevens is bevoegd om de taken uit te voeren en de bevoegdheden uit te oefenen die bij of
      krachtens de verordening zijn toegekend aan de toezichthoudende autoriteit.

      2 Op de voorbereiding van een besluit omtrent goedkeuring van een gedragscode, dan wel de
      wijziging of uitbreiding daarvan, als bedoeld in artikel 40, vijfde lid, van de verordening is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      3 De Autoriteit persoonsgegevens kan in geval van overtreding van het bepaalde in artikel 83, vierde, vijfde of
      zesde lid, van de verordening een bestuurlijke boete opleggen van ten hoogste de in deze leden genoemde bedragen.

      4 De [artikelen 5:4 tot en met 5:10a de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing op
      corrigerende maatregelen als bedoeld in artikel 58, tweede lid, onderdelen b tot en met j van de verordening.

      5 Onverminderd [artikel 4:15 van de Algemene wet bestuursrecht][ref3] kan de Autoriteit Persoonsgegevens de
      termijn voor het geven van een beschikking opschorten voor zover dit noodzakelijk is in verband met het naleven
      van op de Autoriteit Persoonsgegevens rustende verplichtingen op grond van de artikelen 60 tot en met 66 van de
      verordening. Het derde en vierde lid van artikel 4:15 van de Algemene wet bestuursrecht zijn op deze opschorting
      van overeenkomstige toepassing.

      6 De bestuurlijke boete komt toe aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel510
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel415
