preamble:
  text: |-
    gelet op artikel 96, eerste lid, artikel 97, eerste lid, artikel 98, tweede lid en de artikelen 102, 104, eerste en
    derde lid, 126, 127 en 128 van de Wet op de bedrijfsorganisatie;

    gelet op de artikelen 5 en 12 tot en met 14 van het Instellingsbesluit Productschap Tuinbouw 2003;

    gelet op de artikelen 15.51, 15.52 en 15.53 van de Wet milieubeheer;

    gelet op artikel 4 van het Besluit kostenverevening reductie CO2-emissies glastuinbouw;

    positief advies is ontvangen van:

    de Commissie voor boomkwekerijproducten, d.d. 1 september 2010,

    de Commissie voor bloemkwekerijproducten, d.d. 1 september 2010,

    de Commissie voor groenten en fruit, d.d. 1 september 2010,

    de Commissie voor bollen, knollen en wortelstokken van bloemgewassen, d.d. 1 september 2010,

    de Commissie voor hovenierswerkzaamheden, d.d. 1 september 2010,

    de Commissie voor energie, d.d. 4 maart 2011,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#ArtikelAanhef
articles:
  - number: 1:1.1
    text: |-
      In deze verordening en de daarop berustende bepalingen worden overgenomen de begripsbepalingen van de
      [artikelen 1][ref1] en [2 van het Instellingsbesluit Productschap Tuinbouw][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016235#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016235#Artikel2
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016235
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016235
        artikel: '2'
  - number: 1:1.2
    text: |-
      In deze verordening worden overgenomen de begripsbepalingen van [artikel 1:1][ref1] en [artikel 3:1][ref2], en de
      werkwijze zoals beschreven in [paragraaf 3 van de Verordening PT Algemene Bepalingen 2009][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027562#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027562#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027562#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027562
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027562
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0027562
        paragraaf: '3'
  - number: 1:2
    text: 'In deze verordening en de daarop berustende bepalingen wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
  - number: 1:2.a
    text: |-
      Wet: [Wet milieubeheer][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1:2.b
    text: |-
      Besluit: [het Besluit kostenverevening reductie CO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030463
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0030463
  - number: 1:2.c
    text: |-
      PT CO sectorsysteem glastuinbouw: systeem van verevening van kosten verbonden aan het overschrijden van CO-emissies
      als bedoeld in [artikel 15.51, eerste lid, van de Wet][ref1] voor de in dat artikel bedoelde inrichtingen, die
      onder de werkingssfeer van het productschap vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 1:2.d
    text: |-
      inrichting regime A: inrichting als bedoeld in [artikel 15.52 van de Wet][ref1] juncto
      [artikel 2 van het Besluit][ref2], die onder de werkingssfeer van het productschap valt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030463#Artikel2
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0030463
        artikel: '2'
  - number: 1:2.e
    text: |-
      inrichting als bedoeld in [artikel 15.51, eerste lid, van de Wet][ref1], die onder de werkingssfeer van het
      productschap valt en ingevolge [artikel 15.52 van de Wet][ref2] juncto [artikel 2 van het Besluit][ref3] geen
      inrichting regime A is;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0030463#Artikel2
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0030463
        artikel: '2'
  - number: 1:2.f
    text: 'emissieaangifte: aangifte van de ondernemer van de CO-jaarvracht van zijn inrichting;'
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
  - number: 1:2.g
    text: |-
      CO-jaarvracht: totale CO-emissie van de inrichting in een kalenderjaar, uitgedrukt in ton CO, berekend
      overeenkomstig [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031205
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031205
  - number: 2:1.1
    text: |-
      Van de inrichtingen waarop een systeem van verevening van kosten als bedoeld in [titel 15.13 van de Wet][ref1]
      van toepassing is, registreert het productschap de relevante bedrijfsgegevens voor de uitvoering van het PT CO
      sectorsysteem glastuinbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2:1.2
    text: |-
      Ten behoeve van de registratie stelt het productschap een formulier vast en stelt dit ter beschikking van de
      ondernemers die een of meerdere inrichtingen als bedoeld in [titel 15.13 van de Wet][ref1] drijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2:1.3
    text: |-
      De ondernemer, bedoeld in het tweede lid, verstrekt de relevante bedrijfsgegevens van zijn inrichtingen aan het
      productschap middels het formulier, bedoeld in het tweede lid, en de daarin gevraagde bijlagen.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel21
  - number: 2:1.4
    text: |-
      De ondernemer verstrekt de gegevens, bedoeld in het derde lid, binnen de termijn die daarvoor is gesteld in het
      formulier, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel21
  - number: 2:1.5
    text: |-
      Indien het productschap twijfelt aan de juistheid van de verstrekte gegevens, kan ze daaromtrent aan de ondernemer
      aanvullende vragen stellen. De ondernemer beantwoordt deze vragen binnen een termijn van 4 weken.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel21
  - number: 2:2.1
    text: |-
      Op basis van de gegevens die de ondernemer heeft verstrekt op het formulier en in de bijlagen bij het formulier,
      beoordeelt het productschap voor iedere inrichting of het een inrichting regime A of een inrichting regime B
      betreft.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel22
  - number: 2:2.2
    text: De ondernemer ontvangt een overzicht van de gegevens die in het register over zijn inrichtingen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel22
  - number: 2:3.1
    text: |-
      De ondernemer die een of meerdere inrichtingen regime A drijft of die niet heeft voldaan aan
      [artikel 2:1, derde lid][ref1], dient jaarlijks voor 1 juli een emissieaangifte in voor elk van zijn inrichtingen,
      waarin de gegevens zijn vermeld die nodig zijn voor het bepalen van de CO-jaarvracht van de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0031205#Artikel2
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031205
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:3.2
    text: Het productschap stelt een formulier vast voor het indienen van de emissieaangifte.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel23
  - number: 2:3.3
    text: |-
      Indien het productschap twijfelt aan de juistheid van de inhoud van de emissieaangifte, kan ze daaromtrent aan de
      ondernemer aanvullende vragen stellen. De ondernemer beantwoordt deze vragen binnen een termijn van 4 weken.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel23
  - number: 2:3.4
    text: |-
      Indien de ondernemer niet tijdig een volledige emissieaangifte indient of indien naar het oordeel van het
      productschap de emissieaangifte onjuiste gegevens bevat of de beantwoording van de vragen, bedoeld in het derde
      lid, niet afdoende is, kan het productschap de CO-jaarvracht ambtshalve vaststellen en deze CO-jaarvracht als basis
      nemen voor de afrekening, bedoeld in [artikel 2:7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031205#Artikel2
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031205
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:3.5
    text: |-
      De ondernemer bewaart gedurende tenminste vijf jaren de gegevens en uitgevoerde berekeningen, die ten grondslag
      liggen aan de CO-jaarvracht van een kalenderjaar, evenals de onderliggende facturen en andere schriftelijke
      afleveringsbewijzen van gas, elektriciteit en warmte.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel23
  - number: 2:3.6
    text: |-
      De voorzitter is bevoegd nadere regels te stellen betreffende de berekeningsmethode opgenomen in [bijlage I][ref1]
      voor het bepalen van de CO-jaarvracht.


      [ref1]: https://wetten.overheid.nl/BWBR0031205
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031205
  - number: 2:4.1
    text: |-
      Indien een inrichting regime B in een kalenderjaar 305 ton CO of meer emitteert, maakt de ondernemer die de
      inrichting drijft zo spoedig mogelijk en uiterlijk op 1 juli van het daaropvolgende kalenderjaar melding van de CO-
      emissie bij het productschap.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel24
  - number: 2:4.2
    text: |-
      Het productschap registreert een inrichting regime B waarvoor een melding als bedoeld in het eerste lid is gedaan,
      als een inrichting regime A, met ingang van het kalenderjaar, waarin de CO-emissie 305 ton of meer was.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel24
  - number: 2:5
    text: |-
      Indien uit de emissieaangifte voor een inrichting regime A blijkt dat de inrichting in een kalenderjaar minder CO
      heeft geëmitteerd dan 305 ton, registreert het productschap de inrichting als een inrichting regime B, met ingang
      van het kalenderjaar waarin de CO-emissie kleiner was dan 305 ton.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel25
  - number: 2:6
    text: |-
      Indien uit de emissieaangifte of uit de ambtshalve vaststelling van de CO-jaarvracht voor een inrichting waarvoor
      de ondernemer die de inrichting drijft, niet heeft voldaan aan [artikel 2:1, derde lid][ref1], blijkt dat de
      inrichting in een kalenderjaar:


      [ref1]: https://wetten.overheid.nl/BWBR0031205#Artikel2
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031205
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:6.a
    text: |-
      meer CO heeft geëmitteerd dan 305 ton, kan het productschap de inrichting registreren als een inrichting regime A,
      met ingang van het kalenderjaar waarin de CO-emissie 305 ton of meer was;
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel26
  - number: 2:6.b
    text: |-
      minder CO heeft geëmitteerd dan 305 ton, kan het productschap de inrichting registreren als een inrichting regime
      B, met ingang van het kalenderjaar waarin de CO-emissie kleiner was dan 305 ton.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel26
  - number: 2:7.1
    text: |-
      Op basis van de CO-jaarvracht van de deelnemende inrichtingen stelt het productschap jaarlijks vast hoeveel CO deze
      inrichtingen gezamenlijk hebben geëmitteerd en hoe dit totaal van CO-emissies zich verhoudt tot de voor de sector
      vastgestelde emissieruimte, bedoeld in [artikel 15.51, derde lid, van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 2:7.2
    text: |-
      De voorzitter is, met in achtneming van het eerste lid, bevoegd nadere regels te stellen ten aanzien van de wijze
      waarop de kosten van overschrijding van de emissieruimte en de kosten voor het in stand houden en het uitvoeren
      van het PT CO sectorsysteem glastuinbouw over een kalenderjaar worden verrekend met de aan het sectorsysteem
      deelnemende ondernemers en hun inrichtingen.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel27
  - number: 2:7.3
    text: |-
      De afrekening van de kosten van overschrijding van de emissieruimte vindt plaats op basis van: - de formule,
      bedoeld in [artikel 3 van het Besluit][ref1];
        - de kostprijs van emissierechten als gehanteerd in de handel in broeikasgasemissierechten.


      [ref1]: https://wetten.overheid.nl/BWBR0030463#Artikel3
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030463
        artikel: '3'
  - number: 2:8
    text: |-
      Het bepaalde bij of krachtens deze verordening, waarbij aan ondernemers verplichtingen worden opgelegd, is mede
      van toepassing op andere natuurlijke en rechtspersonen, voor zover deze handelingen verrichten die bedrijfsmatig in
      ondernemingen plegen te worden verricht.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel28
  - number: 2:9.1
    text: |-
      Op overtreding van het bepaalde bij deze verordening worden tuchtrechtelijke maatregelen gesteld zoals voorzien in
      de [Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016341
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016341
  - number: 2:9.2
    text: Als bevoegd tuchtgerecht is het Tuchtgerecht Akkerbouwproductschappen aangewezen.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel29
  - number: 2:9.3
    text: Het bestuur kan een coördinator tuchtrecht aanwijzen.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel29
  - number: 3:1
    text: Het bestuur kan nadere regels stellen ten behoeve van de uitvoering van het PT CO sectorsysteem glastuinbouw.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel31
  - number: 3:3
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na de datum van publicatie in het Verordeningenblad
      Bedrijfsorganisatie waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel33
  - number: 3:4
    text: 'Deze verordening wordt aangehaald als: Verordening PT CO sectorsysteem glastuinbouw 2011.'
    url: https://wetten.overheid.nl/BWBR0031205/2013-08-18#Artikel34
