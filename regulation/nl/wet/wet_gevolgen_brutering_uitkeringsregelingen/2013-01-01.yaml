      Het inkomen dat betrekking heeft op een periode gelegen vóór het vervaljaar en dat wordt gehanteerd bij de
      toepassing van artikel 6, eerste lid, onderdeel a, AAW, voor zover dat inkomen in een dienstbetrekking is verdiend,
      wordt verhoogd met het percentage, vastgesteld op grond van [artikel 3 van de Wet BOL][ref1] dan wel, indien
      dit loon is vastgesteld met inachtneming van het minimumloon, bedoeld in de [WML][ref2], met het percentage,
      vastgesteld op grond van [artikel 5 van de Wet BOL][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002638
      [ref3]: https://wetten.overheid.nl/BWBR0006353#Artikel5
