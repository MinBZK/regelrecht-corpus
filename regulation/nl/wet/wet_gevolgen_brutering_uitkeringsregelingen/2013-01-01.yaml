        artikel: '9'
  - number: '2'
    text: |-
      1 Het loon dat betrekking heeft op een periode gelegen vóór het vervaljaar en dat wordt gehanteerd bij de
      berekening van:

      a. het dagloon dat op grond van [artikel 34 IWS][ref1] ten grondslag ligt aan uitkeringen op grond van de
      [WW][ref2],

      b. het dagloon dat op grond van [artikel 15 ZW][ref3] ten grondslag ligt aan uitkeringen op grond van de
      [ZW][ref4],

      c. het dagloon dat op grond van [artikel 14 WAO][ref5] ten grondslag ligt aan uitkeringen op grond van de
      [WAO][ref6],

      wordt verhoogd met het percentage, vastgesteld op grond van [artikel 3 van de Wet BOL][ref7] dan wel, indien
      dit loon is vastgesteld met inachtneming van het minimumloon, bedoeld in de [WML][ref8], met het percentage,
      vastgesteld op grond van [artikel 5 van de Wet BOL][ref9].

      2 Bij de in het eerste lid bedoelde verhoging wordt rekening gehouden met het op grond van
      [artikel 3, tweede lid, van de Wet BOL][ref10] vastgestelde maximum.

      3 Ter voorkoming van dubbele brutering kan bij ministeriële regeling van het eerste lid worden afgeweken.


