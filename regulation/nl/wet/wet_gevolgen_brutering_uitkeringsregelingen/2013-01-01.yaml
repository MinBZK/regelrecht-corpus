    text: |-
      Voor de toepassing van artikel 48 AAW wordt onder de in dat artikel bedoelde uitkeringen, voor zover die zijn
      betaald in het tijdvak van 1 januari 1990 tot en met 31 december van het jaar dat voorafgaat aan het vervaljaar,
      mede verstaan de overhevelingstoeslag op die uitkeringen, bedoeld in artikel 1 van de WOTOP.
    url: https://wetten.overheid.nl/BWBR0008064/2013-01-01#Artikel19
  - number: '20'
    text: |-
