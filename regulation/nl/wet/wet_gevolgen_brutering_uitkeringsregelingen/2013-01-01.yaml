preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op de uit de Wet brutering overhevelingstoeslag lonen
    voortvloeiende brutering van lonen en uitkeringen per 1 januari 1998, wenselijk is om de gevolgen van de brutering
    voor de uitkeringen op grond van een aantal sociale zekerheidswetten nader te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008064/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. de WOTOP: de Wet overhevelingstoeslag opslagpremies zoals die luidde op de dag voorafgaande aan de
      inwerkingtreding van deze wet;

      c. de Wet BOL: de [Wet brutering overhevelingstoeslag lonen][ref1];

      d. de WML: de [Wet minimumloon en minimumvakantiebijslag][ref2];

      e. de WW: de [Werkloosheidswet][ref3];

      f. de ZW: de [Ziektewet][ref4];

      g. de WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref5];

      h. de AAW: de Algemene Arbeidsongeschiktheidswet;

      i. de IWS: de [Invoeringswet stelselherziening sociale zekerheid][ref6];

      j. de TW: de [Toeslagenwet][ref7];

      k. de WAMil: de [Wet Arbeidsongeschiktheidsvoorziening Militairen][ref8];

      l. dienstbetrekking: de dienstbetrekking en de arbeidsverhouding die als zodanig wordt beschouwd ingevolge het
      bepaalde bij of krachtens de [WW][ref9], de [ZW][ref10] en de [WAO][ref11];

      m. vervaljaar: het krachtens [artikel 9 van de Wet BOL][ref12] vastgestelde jaar met ingang waarvan de verplichting
      tot betaling van een overhevelingstoeslag komt te vervallen.


