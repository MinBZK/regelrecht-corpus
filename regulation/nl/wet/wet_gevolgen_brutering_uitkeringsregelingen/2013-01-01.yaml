      1 Een uitkering op grond van de [WW][ref1], de [ZW][ref2], de [WAO][ref3] of de AAW, al dan niet vermeerderd
      met een toeslag op grond van de [TW][ref4], die betrekking heeft op een periode gelegen vóór het vervaljaar
      en die in of na het vervaljaar wordt betaald, wordt verhoogd met het percentage, vastgesteld op grond van
      [artikel 5 van de Wet BOL][ref5].

      2 Bij de in het eerste lid bedoelde verhoging wordt rekening gehouden met het op grond van
