    text: |-
      Ingeval een werkgever op herhaald schriftelijk verzoek van de bedrijfsvereniging niet vóór 15 december van het
      jaar dat voorafgaat aan het vervaljaar heeft meegedeeld welke ontwikkeling het loonpeil in het beroep van de
      uitkeringsgerechtigde op grond van de [ZW][ref1] per 1 januari van het vervaljaar zal doormaken in verband met
      onder meer de toepassing van de [Wet BOL][ref2], is de bedrijfsvereniging bevoegd die uitkering per 1 januari van
      het vervaljaar te verhogen met het percentage, vastgesteld op grond van [artikel 3 van de Wet BOL][ref3].


