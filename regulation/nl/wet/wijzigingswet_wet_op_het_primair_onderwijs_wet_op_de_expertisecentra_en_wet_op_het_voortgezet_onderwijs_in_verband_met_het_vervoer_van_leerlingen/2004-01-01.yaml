preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op het primair onderwijs, de Wet op de
    expertisecentra en de Wet op het voortgezet onderwijs te wijzigen, opdat voor leerlingen voor wie tot dusverre
    aanspraak kan worden gemaakt op vervoer op basis van de Wet op de (re)integratie arbeidsgehandicapten, voortaan
    aanspraak kan worden gemaakt op gemeentelijk leerlingenvervoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013353/2004-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      De in deze wet opgenomen wijzigingen zijn voor de eerste maal van toepassing op het vervoer van leerlingen dat in
      het schooljaar 2002/2003 zal plaatsvinden. Op het vervoer van leerlingen voorafgaand aan het schooljaar 2002/2003
      en daarop betrekking hebbende geschillen blijven de regelingen zoals luidend voorafgaand aan de inwerkingtreding
      van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0013353/2004-01-01#ArtikelIV
  - number: V
    text: |-
      1 Op een leerling als bedoeld in [artikel 4, dertiende lid, van de Wet op het primair onderwijs][ref1] of
      [artikel 4, eerste lid, van de Wet op het voortgezet onderwijs][ref2] voor wie in het schooljaar 2001/2002
      krachtens de [Wet op de (re)integratie arbeidsgehandicapten][ref3] ten behoeve van het vervoer naar en van school
      een voorziening in de vorm van een bruikleenauto of een voorziening, deel uitmakend van of samenhangend met een
      leefvervoersvoorziening, werd verstrekt, blijven voor het vervoer naar en van de school die deze leerling in het
      schooljaar 2001/2002 bezocht, de regelingen op grond van de [Wet op de (re)integratie arbeidsgehandicapten][ref4]
      van toepassing.

      2 Op een leerling als bedoeld in [artikel 4, dertiende lid, van de Wet op het primair onderwijs][ref5]
      of [artikel 4, eerste lid, van de Wet op het voortgezet onderwijs][ref6] voor wie in het schooljaar
      2001/2002 krachtens de [Wet op de (re)integratie arbeidsgehandicapten][ref7] ten behoeve van het vervoer
      naar en van school een voorziening in de vorm van een bruikleenauto werd verstrekt en op wie het eerste
      lid niet of niet langer van toepassing is omdat hij een andere school bezoekt dan de school die hij in het
      schooljaar 2001/2002 bezocht, blijven voor het vervoer naar en van school de regelingen op grond van de
      [Wet op de (re)integratie arbeidsgehandicapten][ref8] van toepassing voor een periode die overeenkomt met de
      resterende looptijd van de overeenkomst in bruikleen dan wel, indien de gebruiksduur van de auto korter is dan de
      resterende looptijd van de overeenkomst, de resterende gebruiksduur.

      3 Aan het Uitvoeringsinsituut werknemersverzekeringen dat op grond van de
      [Wet op de (re)integratie arbeidsgehandicapten][ref9] aan een leerling als bedoeld in
      [artikel 4, dertiende lid, van de Wet op het primair onderwijs][ref10], dan wel aan zijn ouders, ten behoeve van
      het vervoer naar en van school een voorziening als bedoeld in het eerste of tweede lid verstrekt dan wel heeft
      verstrekt, vergoeden burgemeester en wethouders het bedrag dat zij aan de ouders van de in de gemeente verblijvende
      leerling zouden hebben vergoed, indien [artikel 4 van de Wet op het primair onderwijs][ref11] op het vervoer van de
      leerling van toepassing zou zijn geweest.


