  - number: VII
    text: |-
      1 Voor een leerling van een school voor voortgezet onderwijs die voldoet aan de voorwaarden, genoemd in het
      tweede lid, blijft ten behoeve van het vervoer naar en van de school die deze leerling in het schooljaar
      2001/2002 bezocht, aanspraak bestaan op bekostiging van vervoerskosten krachtens [artikel 127][ref1] juncto
      [artikel 124a van de Wet op het voortgezet onderwijs][ref2], zoals luidend voorafgaand aan de inwerkingtreding van
      deze wet.

      2 De voorwaarden, bedoeld in het eerste lid, zijn:

      a. de leerling volgt leerwegondersteunend onderwijs als bedoeld in
      [artikel 10e van de Wet op het voortgezet onderwijs][ref3] of is ingeschreven op een school of afdeling voor
      praktijkonderwijs als bedoeld in [artikel 10f van de Wet op het voortgezet onderwijs][ref4];

      b. de ouders, voogden of verzorgers van de leerling ontvingen in het schooljaar 2001/2002 krachtens artikel 1,
      onderscheidenlijk artikel 2, van de Regeling leerlingenvervoer voortgezet onderwijs (Uitleg OCenW-regelingen 1999,
      nr. 16) juncto [artikel 127 van de Wet op het voortgezet onderwijs][ref5] bekostiging van vervoerskosten; en

      c. [artikel 4 van de Wet op het voortgezet onderwijs][ref6] zoals luidend na de inwerkingtreding van deze wet is
      niet op de leerling van toepassing.

      3 Voor een leerling van een school voor voortgezet speciaal onderwijs als bedoeld in
      [artikel 125 van de Wet op het voortgezet onderwijs][ref7], wiens ouders, voogden of verzorgers in het schooljaar
      2001/2002 krachtens [artikel 127 van de Wet op het voortgezet onderwijs][ref8] bekostiging van vervoerskosten
      ontvingen en op wie [artikel 127 van de Wet op het voortgezet onderwijs][ref9] zoals luidend na de inwerkingtreding
      van deze wet niet van toepassing is, blijft ten behoeve van het vervoer naar en van de school die deze
      leerling in het schooljaar 2001/2002 bezocht, aanspraak bestaan op bekostiging van vervoerskosten krachtens
      [artikel 127][ref10] juncto [artikel 124a van de Wet op het voortgezet onderwijs][ref11], zoals luidend voorafgaand
      aan de inwerkingtreding van deze wet.


