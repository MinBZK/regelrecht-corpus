  - number: VI
    text: |-
      Voor een leerling als bedoeld in [artikel 4, dertiende lid, van de Wet op het primair onderwijs][ref1]
      of [artikel 4, eerste lid, van de Wet op het voortgezet onderwijs][ref2] voor wie in het schooljaar
      2001/2002 krachtens de [Wet op de (re)integratie arbeidsgehandicapten][ref3] ten behoeve van het vervoer
      naar en van school een voorziening werd verstrekt en op wie [artikel V, eerste en tweede lid][ref4],
      niet van toepassing is, blijft, indien de ouders, voogden of verzorgers dat wensen, dan wel, indien
      de leerling meerderjarig en handelingsbekwaam is, de leerling dat wenst, zo nodig in afwijking van
      [artikel 4, vijfde lid, van de Wet op het primair onderwijs][ref5] of de gemeentelijke regeling, onderscheidenlijk
      [artikel 4, vijfde lid, van de Wet op het voortgezet onderwijs][ref6] of de gemeentelijke regeling, ten
      behoeve van het vervoer naar en van de school die deze leerling in het schooljaar 2001/2002 bezocht,
      aanspraak bestaan op een voorziening die gelijkwaardig is aan die welke voor die leerling gold krachtens de
      [Wet op de (re)integratie arbeidsgehandicapten][ref7].


