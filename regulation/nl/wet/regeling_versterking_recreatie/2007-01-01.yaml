$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: regeling_versterking_recreatie
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2007-01-01'
bwb_id: BWBR0009652
url: https://wetten.overheid.nl/BWBR0009652/2007-01-01
preamble:
  text: |-
    Gelet op artikel 2 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      minister:

              In deze regeling wordt verstaan onder Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel1
  - number: '2'
    text: |-
      De Minister kan aan het Kennis- en innovatiecentrum Stichting Recreatie subsidie verstrekken voor programma’s die
      een bijdrage leveren aan de bevordering van kennis en deskundigheid op het gebied van de recreatie.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel2
  - number: '5'
    text: |-
      1 De minister stelt jaarlijks vóór 1 september het subsidieplafond vast voor het komende kalenderjaar.

      2 De minister geeft van het besluit, bedoeld in het eerste lid, kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel5
  - number: '7'
    text: Subsidie wordt verstrekt voor een kalenderjaar en bedraagt ten hoogste 100% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel7
  - number: '11'
    text: |-
      Subsidieaanvragen worden bij de Minister ingediend vóór 1 februari van het kalenderjaar, bedoeld in
      [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009652#Artikel7
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009652
        artikel: '7'
        paragraaf: '1'
  - number: '14'
    text: |-
      1 Een aanvraag, gaat vergezeld van een werkprogramma.

      2 Het werkprogramma houdt in ieder geval het volgende in:

      a. een beschrijving van de werkzaamheden en activiteiten van de instelling voor het kalenderjaar waarop de aanvraag
      betrekking heeft;

      b. een beschrijving van de financiële gevolgen van de werkzaamheden en de activiteiten;

      c. een meerjarenperspectief;

      d. een plan voor de uitvoering van een evaluatie waarin wordt aangegeven in hoeverre de beoogde doelen bereikt
      zijn.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel14
  - number: '16'
    text: |-
      De subsidie, wordt verleend op basis van een beoordeling op de mate waarin de daarin beschreven activiteiten
      bijdragen tot de verwezenlijking van het rijksbeleid op het terrein van de recreatie.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel16
  - number: '18'
    text: De Minister beslist op aanvragen binnen drie maanden na ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel18
  - number: '19'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '20'
    text: |-
      1 De minister kan de subsidieontvanger op diens verzoek voorschotten verstrekken van ten hoogste 95% van het
      verleende subsidiebedrag.

      2 De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel20
  - number: '21'
    text: |-
      De subsidieontvanger voert het programma uit overeenkomstig het werkprogramma waarop de beschikking tot
      subsidieverlening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel21
  - number: '22'
    text: |-
      1 De aanvraag voor vaststelling van de subsidie wordt binnen vier maanden na afloop van het programma ingediend.

      2 De aanvraag gaat vergezeld van:

      a. een financiële verantwoording van het programma;

      b. indien de subsidiabele kosten meer bedragen dan € 34.033,52: een verklaring van een accountant, bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] waaruit blijkt dat is voldaan aan de in deze
      regeling gestelde voorwaarden en verplichtingen;

      c. de eindrapportage van het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '23'
    text: |-
      De minister stelt binnen vier maanden na ontvangst van de in [artikel 22, tweede lid][ref1], bedoelde bescheiden de
      subsidie overeenkomstig de subsidieverlening vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009652#Artikel22
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009652
        artikel: '22'
        paragraaf: '5'
  - number: '26'
    text: |-
      De Regeling subsidiëring niet-terreinbeherende organisaties blijft van toepassing, doch slechts ten aanzien van
      aanvragen die op grond daarvan zijn gedaan vóór het tijdstip van inwerkingtreding van deze regeling.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel26
  - number: '27'
    text: |-
      Twee jaar na inwerkingtreding en voorts iedere drie jaar publiceert de minister een verslag over de
      doeltreffendheid en de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel27
  - number: '28'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel28
  - number: '29'
    text: 'Deze regeling wordt aangehaald als: Regeling versterking recreatie.'
    url: https://wetten.overheid.nl/BWBR0009652/2007-01-01#Artikel29
