        paragraaf: '4'
  - number: '29'
    text: |-
      1 Het tuchtcollege loodsen bestaat uit een voorzitter en vier leden. Er kunnen een of meer plaatsvervangende
      voorzitters en leden zijn.

      2 Het tuchtcollege loodsen heeft een secretaris en kan een of meer plaatsvervangende secretarissen hebben.

      3 De voorzitter, leden en hun plaatsvervangers worden door Onze Minister benoemd voor een periode van vier jaren en
      zijn terstond herbenoembaar. De benoemingstermijn van degene die wordt benoemd ter vervulling van een tussentijdse
      vacature, eindigt bij het verstrijken van de benoemingstermijn van degene in wiens plaats hij is getreden.

      4 Tussen de voorzitter, de leden, de secretaris en hun plaatsvervangers bestaat geen nauwe persoonlijke betrekking.

      5 Benoembaar tot voorzitter of plaatsvervangend voorzitter zijn degenen:

      a. aan wie op grond van het afsluitend examen van een opleiding in het wetenschappelijk
      onderwijs door een universiteit dan wel de Open Universiteit, waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad van Bachelor op het
      gebied van het recht en tevens de graad van Master op het gebied van het recht is verleend, of

      b. die op grond van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit dan
      wel de Open Universiteit, waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft, het
      recht hebben verkregen om de titel meester te voeren.

      6 Uit iedere regionale corporatie wordt op een voordracht van het bestuur van die regionale corporatie een
      registerloods benoemd, die geen lid of plaatsvervangend lid van het bestuur van die betreffende regionale
      loodsencorporatie is.

      7 Onze Minister verleent aan de voorzitter en zijn plaatsvervanger in elk geval ontslag met ingang van de maand,
      volgende op die waarin zij de leeftijd van zeventig jaren hebben bereikt, en op eigen verzoek tussentijds.

      8 Het lidmaatschap van leden van het tuchtcollege vervalt van rechtswege indien een lid benoemd wordt in het
      bestuur van een regionale loodsencorporatie of bij het verlies van de hoedanigheid van registerloods.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel29
