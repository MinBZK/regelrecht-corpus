  - number: 27j
    text: |-
      1 De algemene raad stelt jaarlijks een financiële verantwoording op over het voorafgaande kalenderjaar die bestaat
      uit:

      a. een exploitatierekening van de diensten en taken, bedoeld in [artikel 27a][ref1], met inbegrip van een
      verantwoording van de omzet;

      b. een overzicht van de aan de exploitatie van die diensten en taken toegerekende materiële vaste activa;

      c. een verantwoording van de gehanteerde afschrijvingsmethoden en afschrijvingstermijnen;

      d. een verantwoording van de algemene besparing, bedoeld in [artikel 27c, zevende lid, onder g][ref2];

      e. een toelichting op de stukken, bedoeld onder a tot en met d; en

      f. een verklaring van een onafhankelijke accountant als bedoeld in
      [artikel 393 van boek 2 van het Burgerlijk Wetboek][ref3].

      2 De algemene raad draagt jaarlijks zorg voor een verantwoording over het gerealiseerde kwaliteitsniveau van
      de diensten en taken, bedoeld in [artikel 27a][ref4], over het voorafgaande kalenderjaar. Voorafgaand aan
      de vaststelling van de verantwoording vraagt de algemene raad een zienswijze aan de besturen van de regionale
      loodsencorporatie, de bij ministeriële regeling aan te wijzen rechtspersonen, betrokken bij het bestuur van een
      of meer zeehavens, bestuursorganen belast met het nautisch beheer van een of meer zeehavens en representatieve
      organisaties van ondernemers in het scheepvaart- en havenbedrijf.

      3 De algemene raad zendt de verantwoording over het gerealiseerde kwaliteitsniveau tegelijkertijd naar de
      Autoriteit Consument en Markt en naar degenen die op grond van het tweede lid zijn gevraagd om een zienswijze.
      Daarbij is gemotiveerd welke overwegingen zijn gemaakt ten aanzien van de ingebrachte zienswijzen.

      4 De algemene raad nodigt de bij ministeriële regeling aan te wijzen rechtspersonen, betrokken bij het bestuur van
      een of meer zeehavens, bestuursorganen belast met het nautisch beheer van een of meer zeehavens en representatieve
      organisaties van ondernemers in het scheepvaart- en havenbedrijf uit om gezamenlijk te bepalen op welke wijze
      afspraken gemaakt worden ten aanzien van in ieder geval de te leveren kwaliteit van de loodsdienstverrichting door
      registerloodsen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel27c
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref4]: https://wetten.overheid.nl/BWBR0004365#Artikel27a
