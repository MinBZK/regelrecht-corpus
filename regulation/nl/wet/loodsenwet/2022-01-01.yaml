  - number: 44a
    text: |-
      1 Op verzoek van de algemene raad of het bestuur van een regionale loodsencorporatie kan het tuchtcollege loodsen
      de registerloods jegens wie een ernstig vermoeden is gerezen van een handelen of nalaten waardoor enig krachtens
      [artikel 15][ref1] beschermd belang ernstig is geschaad of dreigt te worden geschaad, met onmiddellijke ingang
      schorsen voor een periode van ten hoogste een jaar in de uitoefening van zijn bevoegdheid indien het door
      artikel 15 beschermde belang dit vergt. Het tuchtcollege loodsen beslist niet dan na verhoor of behoorlijke
      oproeping van de registerloods en de voorzitter van de regionale loodsencorporatie waartoe de registerloods
      behoort.

      2 Een verzoek als bedoeld in het eerste lid kan ook worden ingediend ingeval een registerloods zich in voorlopige
      hechtenis bevindt of deze bij nog niet onherroepelijk of onherroepelijk geworden rechterlijke uitspraak wegens een
      misdrijf is veroordeeld dan wel hem bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming
      tot gevolg heeft, met dien verstande dat alleen een schorsing kan worden uitgesproken voor de duur van de
      vrijheidsbeneming. De griffier van het gerecht dat een van de in de eerste volzin genoemde beslissingen neemt,
      geeft van die beslissing kennis aan de voorzitter van de regionale loodsencorporatie waartoe de registerloods
      behoort.

      3 De voorzitter van de regionale loodsencorporatie stelt de betrokken registerloods schriftelijk op de hoogte van
      het in het eerste en tweede lid bedoelde verzoek, alsmede van de gronden waarop het verzoek rust.

      4 Het tuchtcollege loodsen beslist binnen veertien dagen nadat het verzoek overeenkomstig het eerste of tweede
      lid aan hem ter kennis is gebracht. Het tuchtcollege loodsen kan deze termijn ten hoogste eenmaal verlengen met
      eenzelfde termijn.

      5 Indien de klacht tegen de registerloods op grond waarvan het ernstige vermoeden is gerezen niet reeds
      schriftelijk ter kennis is gebracht van het tuchtcollege, bepaalt het tuchtcollege bij zijn beslissing op het in
      het eerste lid bedoelde verzoek tevens een redelijke termijn van niet langer dan zes weken, waarbinnen de algemene
      raad of het bestuur van een regionale loodsencorporatie de klacht schriftelijk ter kennis van het tuchtcollege
      brengt. Bij overschrijding van deze termijn vervalt de beslissing op het in het eerste lid bedoelde verzoek van
      rechtswege. Het tuchtcollege kan op schriftelijk verzoek van de algemene raad of het bestuur van een regionale
      loodsencorporatie de termijn ten hoogste eenmaal verlengen met een door hem te bepalen redelijke termijn van niet
      langer dan zes weken. De [artikelen 28 tot en met 41][ref2] zijn van overeenkomstige toepassing met uitzondering
      van [artikelen 34, derde lid][ref3], [37, tweede lid][ref4], [38, tweede en achtste lid][ref5], en [40][ref6].

      6 Op verzoek van de betrokken registerloods kan het tuchtcollege loodsen te allen tijde de op grond van het eerste
      lid opgelegde schorsing opheffen. Hij beslist niet dan na verhoor of behoorlijke oproeping van de registerloods en
      de voorzitter van de regionale loodsencorporatie waartoe de registerloods behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel15
