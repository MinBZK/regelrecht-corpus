      1 De Autoriteit Consument en Markt kan, onverminderd het bepaalde bij of krachtens
      de [artikelen 2, derde lid][ref1], [4, eerste lid][ref2], [9, tweede lid][ref3],
      [15 eerste lid][ref4], [24, eerste lid, onder d][ref5], en [26, eerste lid][ref6], van deze wet en
      [artikel 12 van de Scheepvaartverkeerswet][ref7], voorwaarden vaststellen waaronder registerloodsen de diensten
      verlenen die zij bij of krachtens de wet bij uitsluiting verrichten.

      2 De voorwaarden hebben slechts betrekking op de kwaliteit van de dienstverlening en zijn non-discriminatoir.

      3 Voorafgaand aan de vaststelling van deze voorwaarden nodigt de Autoriteit Consument en Markt de algemene raad uit
      haar een voorstel daarvoor te doen. [Artikel 27c, vierde en vijfde lid][ref8], is van overeenkomstige toepassing.


