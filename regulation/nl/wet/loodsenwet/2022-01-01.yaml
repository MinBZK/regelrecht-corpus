preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de uitvoerende taken van de overheid ten aanzien van
    het loodsen van zeeschepen te beëindigen en in de plaats daarvan een openbaar lichaam voor beroep in te stellen
    als bedoeld in artikel 134 van de Grondwet, daarbij regels stellend over de opleiding tot loods en de bevoegdheid
    tot uitoefening van dit beroep, aldus tevens de grondslag scheppend voor de uitvoering van verdragen en besluiten
    van volkenrechtelijke organisaties, waaronder de Richtlijn van de Raad van de Europese Gemeenschappen inzake het
    loodsen van schepen door Noordzeeloodsen op de Noordzee en in het Kanaal (Pb EG L33/32);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Infrastructuur en Waterstaat;

      b. loods:

      1°. registerloods;

      2°. degene die voldoet aan de eisen met betrekking tot opleiding, kundigheid, ervaring en geschiktheid, bedoeld in
      [artikel 5, eerste lid][ref1];

      c. corporatie: de Nederlandse loodsencorporatie, bedoeld in [artikel 6, eerste lid][ref2];

      d. algemene raad: de algemene raad van de Nederlandse loodsencorporatie;

      e. register: het loodsenregister, bedoeld in [artikel 21, eerste lid][ref3];

      f. registerloods: degene die is ingeschreven in het register;

      g. loodsplichtige scheepvaartwegen: de scheepvaartwegen waarop krachtens wettelijk voorschrift de kapitein van een
      schip verplicht is gebruik te maken van de diensten van een loods;

      h. verwerking van persoonsgegevens, onderscheidenlijk verwerkingsverantwoordelijke: hetgeen daaronder verstaan
      wordt in artikel 4, onderdelen 1, 2 en 7, van de Algemene verordening gegevensbescherming;

      i. Autoriteit Consument en Markt: de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref4];

      j.

      k. *arbeidsvergoeding:* arbeidsvergoeding voor registerloodsen, bestaande uit:

      1°. een integraal uurtarief voor de uitvoering van verrichtingen van een registerloods aan boord of loodsen
      door een registerloods op afstand, met inbegrip van een vaste opslag voor de daarbij te maken reis-, wacht- en
      beschikbaarheidsuren; en

      2°. een integraal uurtarief voor de uitvoering van andere taken dan bedoeld onder 1°, die bij of krachtens deze wet
      of anderszins aan een registerloods zijn toevertrouwd, met inbegrip van een vaste opslag voor de daarbij te maken
      reis- en wachturen;

      l. persoonsgegevens over gezondheid: persoonsgegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van
      de Algemene verordening gegevensbescherming.

      2 De begrippen in deze wet en de daarop berustende bepalingen hebben, tenzij anders is bepaald, dezelfde betekenis
      als in de [Scheepvaartverkeerswet][ref5].


