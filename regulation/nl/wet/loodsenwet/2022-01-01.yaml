  - number: '32'
    text: |-
      1 De voorzitter, de secretaris, de leden en hun plaatsvervangers ontvangen vacatiegeld, alsmede een vergoeding van
      reis- en verblijfkosten en van andere verschotten.

      2 Het in het eerste lid bedoeld vacatiegeld, de reis- en verblijfskosten en andere verschotten worden
      overeenkomstig [Hoofdstuk VIA][ref1], bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#HoofdstukVIA
