  - number: '14'
    text: |-
      1 De voorzitter van de corporatie of van een regionale corporatie, roept een vergadering bijeen zo vaak hij zulks
      nodig acht of indien zulks schriftelijk, onder opgave van de te behandelen onderwerpen, wordt verzocht:

      a. voor de ledenvergadering van de corporatie: door de ledenvergadering van ten minste een regionale corporatie;

      b. voor een ledenvergadering van een regionale corporatie: door ten minste tien procent van de leden;

      c. voor de algemene raad en voor het bestuur van een regionale corporatie: door ten minste twee leden.

      2 De ledenvergaderingen van de corporatie zijn openbaar voor zover daarin ontwerpen van verordeningen aan de orde
      zijn. Hiervan wordt door de algemene raad op bij algemene maatregel van bestuur te bepalen wijze mededeling gedaan.

      3 De ledenvergadering van een regionale corporatie voorziet bij reglement in het doeltreffend verloop van de
      ledenvergaderingen.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel14
  - number: '15'
    text: |-
      1 De ledenvergadering van de corporatie stelt de verordeningen, bedoeld in deze wet en de daarop berustende
      bepalingen, vast, alsmede andere verordeningen, waaronder die in het belang van:

      a. een goede beroepsuitoefening;

      b. een doelmatige dienstverlening, waarbij ten minste dient te worden voorzien in:

      1°. de verplichting van de registerloods zijn diensten tijdig en op non-discriminatoire wijze aan te bieden en te
      verlenen aan schepen als bedoeld in [artikel 4, tweede lid][ref1]; en

      2°. de verplichting van de registerloodsen om in onderling verband zorg te dragen voor het vervoer ten behoeve van
      hun beroepsuitoefening en de verdere organisatie van de dienstverlening;

      c. sociale voorzieningen voor registerloodsen en voor nabestaanden van overleden registerloodsen;

      d. een doeltreffend verloop van de ledenvergaderingen van de corporatie; en

      e. de borging van de kwaliteit van de loodsdienstverlening, waarbij ten minste wordt voorzien in de wijze waarop
      ten minste iedere vijf jaar een visitatie wordt uitgevoerd met het oog op de kwaliteit van de loodsdienstverlening.

      2 In een verordening kan aan de algemene raad of aan het bestuur van een regionale corporatie de bevoegdheid worden
      verleend tot het geven van nadere voorschriften omtrent bij die verordening geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel4
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16'
    text: |-
      1 De ontwerpen van verordeningen worden door de algemene raad opgesteld, hetzij op last van de ledenvergadering
      hetzij uit eigen beweging.

      2 Op de voorbereiding van verordeningen is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing,
      met dien verstande dat daaraan toepassing wordt gegeven door de algemene raad.

      3 De algemene raad brengt de naar voren gebrachte zienswijzen ter kennis van de leden.

      4 De verordeningen worden na de vaststelling onverwijld ter kennis gebracht van Onze Minister en vervolgens
      bekendgemaakt in de *Staatscourant.* Indien zij de goedkeuring van Onze Minister behoeven, wordt bij de
      bekendmaking aan de voet van de verordening het besluit vermeld waarbij deze is goedgekeurd.

      5 De verordeningen treden, tenzij zij anders bepalen, in werking met ingang van de tweede dag na die van de
      bekendmaking.

      6 Het vierde en vijfde lid zijn eveneens van toepassing op de nadere voorschriften, bedoeld in
      [artikel 15, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
