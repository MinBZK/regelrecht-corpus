    text: |-
      1 Het College van Beroep voor het bedrijfsleven kan op verzoek van een registerloods aan wie een tuchtmaatregel is
      opgelegd een onherroepelijk geworden beslissing van het tuchtcollege loodsen of van het College van Beroep voor het
      bedrijfsleven herzien op grond van feiten of omstandigheden die:

      a. het tuchtcollege loodsen of het College van Beroep voor het bedrijfsleven bij de behandeling van de zaak ter
      zitting niet bekend waren en redelijkerwijs niet bekend konden zijn, en die

      b. indien zij het tuchtcollege loodsen of het College van Beroep voor het bedrijfsleven bij de behandeling van de
      zaak ter zitting wel bekend zouden zijn geweest, tot een andere beslissing zouden hebben kunnen leiden.

      2 Op de behandeling van het verzoek tot herziening zijn de [artikelen 35, eerste, tweede en derde lid][ref1],
      [36, tweede en derde lid][ref2], [37][ref3], [38, tweede tot en met negende lid][ref4], [39][ref5], [40][ref6] en
      [41, eerste, derde, vierde en vijfde lid][ref7], van overeenkomstige toepassing.

      3 Aan de behandeling van het verzoek tot herziening ter zitting van het College van Beroep voor het bedrijfsleven
      nemen geen leden deel die hebben deelgenomen aan de behandeling van de zaak, waarvan de herziening wordt verzocht.


