    text: |-
      Onze Minister kan verordeningen als bedoeld in [artikel 15, eerste lid][ref1], voor de eerste maal als
      ministeriële regeling vaststellen, voor zover deze, naar het oordeel van Onze Minister, op de datum waarop
      artikel 3, van de Loodswet 1957 wordt ingetrokken, in werking dienen te treden. Zij blijven, behoudens eerdere
      intrekking door Onze Minister, van kracht totdat zij bij verordening zijn ingetrokken en vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel15
