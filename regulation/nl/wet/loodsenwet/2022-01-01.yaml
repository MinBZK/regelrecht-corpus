        artikel: '26'
        hoofdstuk: VI
  - number: 27a
    text: |-
      De loodsgeldtarieven en de tarieven voor het verrichten van andere diensten die bij of krachtens de wet bij
      uitsluiting aan registerloodsen zijn opgedragen, onderscheidenlijk de vergoedingen voor de taken die bij of
      krachtens de wet aan de algemene raad of een regionale loodsencorporatie zijn opgedragen, worden vastgesteld
      overeenkomstig de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel27a
  - number: 27b
    text: |-
      1 De ledenvergadering van de corporatie stelt in het belang van een op de kosten gebaseerde tariefstelling een
      toerekeningssysteem vast voor de kosten van de diensten en taken, bedoeld in [artikel 27a][ref1].

      2 Het toerekeningssysteem bevat een omschrijving van de wijze waarop de kosten van de diensten en taken, bedoeld in
      [artikel 27a][ref2], in de tarieven worden doorberekend.

      3 Het toerekeningssysteem wordt opgesteld met inachtneming van het bepaalde bij en krachtens
      [artikel 15ba, derde lid, van de Scheepvaartverkeerswet][ref3].

      4 Het toerekeningssysteem behoeft de instemming van de Autoriteit Consument en Markt.
      [Afdeling 10.2.1 van de Algemene wet bestuursrecht][ref4] is van overeenkomstige toepassing op de
      instemming. Tevens stelt de Autoriteit Consument en Markt de methode en parameters voor de berekening van de
      vermogenskostenvoet bij besluit vast.

      5 Voorafgaand aan vaststelling van het toerekeningssysteem stelt de algemene raad de besturen van de regionale
      loodsencorporaties, de bij ministeriële regeling te bepalen vertegenwoordigers van rechtspersonen, betrokken
      bij het bestuur van een of meer zeehavens en representatieve organisaties van ondernemers in het scheepvaart- en
      havenbedrijf in staat hun zienswijze over een ontwerp voor een toerekeningssysteem naar voren te brengen.

      6 De algemene raad zendt het toerekeningssysteem en de ingebrachte zienswijzen tegelijkertijd naar de
      Autoriteit Consument en Markt en naar degenen die op grond van het vijfde lid zijn gevraagd om een zienswijze.
      Daarbij is gemotiveerd of en op welke wijze de ingebrachte zienswijzen hebben geleid tot aanpassing van het
      toerekeningssysteem. Indien een zienswijze niet heeft geleid tot aanpassing, geeft de algemene raad de redenen
      daarvoor aan.

      7 De Autoriteit Consument en Markt kan de ledenvergadering opdragen een vastgesteld toerekeningssysteem te
      wijzigen. De ledenvergadering is verplicht aan een opdracht gevolg te geven. Het derde en vierde lid zijn van
      toepassing.

      8 Onverminderd het zevende lid, wordt het toerekeningssysteem uiterlijk vijf jaar na de datum van inwerkingtreding
      herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel27a
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel15ba
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
