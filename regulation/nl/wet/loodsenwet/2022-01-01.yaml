  - number: '2'
    text: |-
      1 De loods adviseert aan boord de kapitein of verkeersdeelnemer over de door deze te voeren navigatie.

      2 Indien de loods zijn functie aan boord van het te loodsen schip uitoefent, mag hij met instemming van de kapitein
      optreden als verkeersdeelnemer.

      3 Indien de loods zijn functie niet aan boord van het te loodsen schip kan uitoefenen, mag hij de kapitein of de
      verkeersdeelnemer vanaf een ander schip of vanaf de wal adviseren.

      4 Indien de loods zijn functie vanaf een ander schip of vanaf de wal uitoefent, mag hij, voor zover hij daartoe bij
      of krachtens [artikel 9 van de Scheepvaartverkeerswet][ref1] bevoegd is, de kapitein of de verkeersdeelnemer ook
      verkeersinformatie geven.

      5 Indien zich aan boord van het te loodsen schip een loods bevindt, kan een loods vanaf de wal aan deze loods
      adviezen en, voor zover hij daartoe bij of krachtens [artikel 9 van de Scheepvaartverkeerswet][ref2] bevoegd
      is, verkeersinformatie geven, in het geval van verminderd zicht, slechte weersomstandigheden of andere bijzondere
      omstandigheden.

      6 Ter bescherming van de belangen, genoemd in [artikel 3, eerste lid, van de Scheepvaartverkeerswet][ref3], worden
      bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld die de loodsen voor en bij de uitoefening
      van hun beroep in acht dienen te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel3
