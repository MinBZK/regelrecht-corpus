        hoofdstuk: VIA
  - number: '33'
    text: |-
      1 De voorzitter, de leden en de secretaris, alsmede hun plaatsvervangers, mogen zich niet op enige wijze inlaten
      met partijen of hun raadslieden of gemachtigden over enige zaak die bij het tuchtcollege loodsen aanhangig is, of
      waarvan zij weten of kunnen vermoeden dat deze bij het tuchtcollege loodsen aanhangig zal worden gemaakt.

      2 De voorzitter, de leden en de secretaris, alsmede hun plaatsvervangers zijn verplicht tot geheimhouding van
      de gegevens waarover zij bij de uitoefening van hun taak de beschikking krijgen en waarvan zij het vertrouwelijk
      karakter kennen of redelijkerwijs moeten vermoeden, behoudens voor zover enig wettelijk voorschrift hen tot
      mededeling verplicht of uit hun taak de noodzaak tot mededeling voortvloeit.

      3 De voorzitter, de leden en de secretaris, alsmede hun plaatsvervangers zijn verplicht tot geheimhouding van
      hetgeen in de raadkamer over aanhangige zaken is geuit.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel33
  - number: '34'
    text: |-
      1 Een zaak wordt in eerste aanleg bij het tuchtcollege loodsen aanhangig gemaakt door een schriftelijke klacht van
      de algemene raad, het bestuur van een regionale loodsencorporatie of van degene die rechtstreeks in zijn belang
      is getroffen.

      2 Een klacht bevat ten minste de volgende gegevens:

      a. de naam, het adres en de woonplaats van de klager;

      b. de naam en, voor zover bekend, het adres en de woonplaats van de registerloods op wie de klacht betrekking
      heeft; en

      c. een omschrijving van de gedraging, waarop de klacht betrekking heeft en de bezwaren daartegen.

      3 De organen van de corporatie of een regionale loodsencorporatie verlenen desgevraagd hun medewerking bij de
      behandeling van de klacht door het tuchtcollege loodsen.

      4 Indien de klacht wordt ingediend na verloop van drie jaar na de dag waarop de klager heeft kennisgenomen of
      redelijkerwijs kennis heeft kunnen nemen van de gedraging waarop de klacht betrekking heeft, wordt de klacht niet-
      ontvankelijk verklaard. De beslissing tot niet-ontvankelijkverklaring blijft achterwege indien de gevolgen van de
      gedraging pas nadien bekend zijn geworden. In dat geval verloopt de termijn voor het indienen van een klacht een
      jaar na de datum waarop de gevolgen redelijkerwijs als bekend geworden zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel34
  - number: '35'
    text: |-
      1 De voorzitter kan een klacht na een summier onderzoek terstond afwijzen bij een met redenen omklede schriftelijke
      beslissing indien hij van oordeel is dat de klager kennelijk niet-ontvankelijk is, dan wel de klacht kennelijk
      ongegrond of het tuchtcollege loodsen onbevoegd is.

      2 De secretaris zendt onverwijld een afschrift van de beslissing van de voorzitter aan de registerloods over wie
      geklaagd is, aan de klager en aan de algemene raad.

      3 De klager en de algemene raad kunnen binnen twee weken na de dag van verzending van de beslissing van de
      voorzitter tot afwijzing van een klacht schriftelijk verzet doen bij het tuchtcollege. Ten gevolge van het verzet
      vervalt de eerdere beslissing van de voorzitter.

      4 De voorzitter brengt klachten die niet door hem zijn afgewezen onverwijld ter kennis van het tuchtcollege
      loodsen.

      5 Intrekken van de klacht, nadat deze is ingediend, of staking van de werkzaamheden door de registerloods over
      wie geklaagd is, heeft op de verdere behandeling van de klacht geen invloed, wanneer naar het oordeel van het
      tuchtcollege loodsen het algemeen belang dat vermoedelijk is geschonden vordert dat de behandeling wordt voortgezet
      of wanneer degene over wie geklaagd is, schriftelijk heeft verklaard voortzetting van de behandeling van de klacht
      te verlangen.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel35
  - number: '36'
    text: |-
      1 Aan de behandeling van een zaak door het tuchtcollege loodsen nemen deel de voorzitter of zijn plaatsvervanger en
      vier leden of hun plaatsvervanger, waarvan een uit elke regionale loodsencorporatie.

      2 De voorzitter en de leden kunnen zich verschonen en kunnen worden gewraakt indien er te hunnen aanzien feiten of
      omstandigheden bestaan, waardoor de onpartijdigheid van het tuchtcollege loodsen schade zou kunnen lijden.

      3 Het tuchtcollege loodsen beslist zo spoedig mogelijk over een verzoek tot verschoning of wraking. Aan de
      besluitvorming wordt niet deelgenomen door de voorzitter of het lid waarop het verzoek betrekking heeft. Indien het
      verzoek betrekking heeft op de voorzitter, neemt een plaatsvervangend voorzitter deel aan de besluitvorming. Bij
      staking van stemmen wordt het verzoek tot verschoning of wraking toegewezen.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel36
  - number: '37'
    text: |-
      1 Zodra het tuchtcollege loodsen een klacht in behandeling heeft genomen, zendt de secretaris een afschrift van de
      klacht aan de registerloods waartegen de klacht zich richt.

      2 De registerloods waartegen de klacht zich richt kan binnen zes weken na de dag van verzending van het afschrift
      van de klacht, als bedoeld in het eerste lid, een verweerschrift indienen. De voorzitter kan deze termijn op
      verzoek van de registerloods verlengen.

      3 De secretaris zendt een afschrift van het verweerschrift aan de klager.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel37
  - number: '38'
    text: |-
      1 De voorzitter bepaalt het tijdstip en de locatie voor de mondelinge behandeling van de zaak ter zitting. De
      secretaris draagt zorg voor de tijdige publicatie van deze informatie op de door de algemene raad ter beschikking
      gestelde internetsite.

      2 De secretaris roept de klager en de registerloods waartegen de klacht zich richt ten minste twee weken
      voorafgaand aan de datum van de zitting bij aangetekende brief op voor de zitting.

      3 De behandeling van een klacht door het tuchtcollege loodsen, geschiedt in een openbare zitting, tenzij het
      tuchtcollege loodsen om gewichtige redenen beveelt dat de behandeling van de zaak geheel of gedeeltelijk met
      gesloten deuren zal plaatsvinden. Het bevel daartoe houdt de overwegingen in waarop het steunt.

      4 De registerloods, waartegen de klacht zich richt, is verplicht aan de oproeping, bedoeld in het tweede lid,
      gevolg te geven. Indien hij na oproeping niet ter zitting verschijnt, kan het tuchtcollege loodsen de officier van
      justitie verzoeken hem te dagvaarden. Hij is verplicht na dagvaarding te verschijnen.

      5 Indien de registerloods waartegen de klacht zich richt, op de dagvaarding niet ter zitting verschijnt, doet
      de officier van justitie hem op verzoek van het tuchtcollege loodsen dagvaarden, met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      6 De registerloods waartegen de klacht zich richt, kan zich door een raadsman doen bijstaan.

      7 Het tuchtcollege loodsen kan weigeren personen die geen advocaat zijn als raadsman of als gemachtigde ter zitting
      toe te laten. Bij een zodanige weigering houdt het tuchtcollege loodsen de zaak tot een volgende zitting aan.

      8 Het tuchtcollege loodsen stelt de registerloods waartegen de klacht zich richt en zijn raadsman ten minste twee
      weken voor de zitting in de gelegenheid om van alle op de zaak betrekking hebbende stukken kennis te nemen.

      9 De secretaris maakt van het verhandelde ter zitting een proces-verbaal op dat door de voorzitter en de secretaris
      wordt ondertekend.

      10 De kosten die samenhangen met de mondelinge behandeling van de zaak ter zitting komen ten laste van de algemene
      raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel38
