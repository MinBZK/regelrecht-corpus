    text: |-
      1 Indien het geraamde aantal te loodsen scheepsreizen, bedoeld in [artikel 27c, zevende lid, onderdeel a][ref1],
      hoger is dan het geraamde aantal te loodsen scheepsreizen waarop het geldende tariefbesluit is gebaseerd, bevat een
      voorstel of bijstelling van een voorstel als bedoeld in artikel 27c, eerste lid, tevens een alternatieve berekening
      met inachtneming van de efficiencykorting.

      2 Bij of krachtens algemene maatregel van bestuur wordt de wijze bepaald waarop de alternatieve berekening, bedoeld
      in het eerste lid, plaatsvindt.


