  - number: '54'
    text: |-
      1 Een registerloods die als gevolg van een aanwijzing als bedoeld in [artikel 52, eerste lid][ref1],
      wordt beperkt in zijn mogelijkheden tot het verrichten van diensten als bedoeld in
      [artikel 2, eerste tot en met vijfde lid][ref2] en daardoor onevenredig financieel nadeel ondervindt, wordt
      door Onze Minister een naar billijkheid te bepalen vergoeding toegekend, die wordt berekend volgens bij algemene
      maatregel van bestuur te stellen regels.

      2 Ingeval [artikel 53][ref3] toepassing vindt, kan aan de corporatie een vergoeding worden toegekend die wordt
      berekend volgens bij algemene maatregel van bestuur te stellen regels. Deze regels kunnen afwijken van het bepaalde
      bij of krachtens [artikel 26][ref4].


