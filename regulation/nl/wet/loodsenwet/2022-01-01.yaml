  - number: '41'
    text: |-
      1 De beslissing van het tuchtcollege loodsen berust op een deugdelijke motivering.

      2 De voorzitter bepaalt het tijdstip en de locatie voor de openbare zitting waarin de beslissing van het
      tuchtcollege loodsen zal worden uitgesproken. De secretaris draagt zorg voor de tijdige publicatie van deze
      informatie op de door de algemene raad ter beschikking gestelde internetsite.

      3 Indien de registerloods waartegen de klacht zich richt, niet ter zitting is verschenen, kan het tuchtcollege
      loodsen bij verstek uitspraak doen.

      4 De secretaris zendt onverwijld een afschrift van de schriftelijke beslissing van het tuchtcollege loodsen bij
      aangetekende brief aan:

      a. de registerloods, tegen wie de klacht zich richt;

      b. aan de klager;

      c. aan de algemene raad.

      5 De secretaris publiceert een geanonimiseerd afschrift van de schriftelijke beslissing van het tuchtcollege
      loodsen op een daartoe ter beschikking gestelde internetsite.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel41
  - number: '42'
    text: |-
      Tegen een beslissing van het tuchtcollege loodsen kan binnen zes weken na de dag van de verzending van de in
      [artikel 41, vierde lid][ref1], bedoelde brief hoger beroep worden ingesteld bij het College van Beroep voor het
      bedrijfsleven:

      a. door de registerloods indien de klacht die tegen hem is ingediend geheel of ten dele gegrond is verklaard;

      b. door de klager; of

      c. door de algemene raad.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel41
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel42
