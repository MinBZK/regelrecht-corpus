  - number: 45f
    text: |-
      1 In geval van overtreding van het bepaalde bij of krachtens de [artikelen 27b, eerste en zevende lid][ref1],
      [27c][ref2], [27ca][ref3], [27i][ref4], [27j][ref5] en [27l, eerste lid][ref6], kan de Autoriteit Consument en
      Markt de overtreder:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      2 De in het eerste lid, onder a, bedoelde boete bedraagt ten hoogste € 900.000, of, indien
      dit meer is, 10% van de gezamenlijke omzet van de organisaties, aangewezen krachtens de
      [artikelen 15a, tweede lid][ref7], en [15b, eerste lid, van de Scheepvaartverkeerswet][ref8].
      [Artikel 12o van de Instellingswet Autoriteit Consument en Markt][ref9] is van overeenkomstige toepassing.

      3 De bestuurlijke boete die ingevolge het tweede lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref10], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


