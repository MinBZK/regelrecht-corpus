      Degene die in het register ingeschreven is geweest, wordt, indien de vorige inschrijving is doorgehaald op de
      grond, bedoeld in [artikel 24, eerste lid, onderdeel ][ref1], op zijn verzoek opnieuw in het register ingeschreven
      als bij de aanvraag daarvoor het bewijs wordt overgelegd dat deze grond heeft opgehouden te bestaan.


