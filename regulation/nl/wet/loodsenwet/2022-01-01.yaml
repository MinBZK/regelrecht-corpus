      1 De algemene raad en het bestuur van een regionale corporatie, alsmede degene op wie een verplichting rust als
      bedoeld in [artikel 46, eerste lid][ref1], zijn verplicht Onze Minister de inlichtingen te verstrekken die hij
      nodig acht om te kunnen beoordelen of aanleiding bestaat tot toepassing van artikel 46, eerste lid.

      2 Indien op basis van de verstrekte inlichtingen niet kan worden beoordeeld of er aanleiding bestaat tot toepassing
      van [artikel 46, eerste lid][ref2], kan Onze Minister een nader onderzoek instellen.

      3 De algemene raad en het bestuur van een regionale corporatie, alsmede degene op wie een verplichting rust als
      bedoeld in [artikel 46, eerste lid][ref3], zijn verplicht om aan dat onderzoek alle medewerking te verlenen die
      redelijkerwijs kan worden gevorderd.


