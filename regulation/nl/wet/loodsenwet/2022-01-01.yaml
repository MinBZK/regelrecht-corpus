  - number: '30'
    text: |-
      1 De [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2], [46d, tweede lid][ref3],
      [46f][ref4], [46g][ref5], [46i, eerste lid, aanhef en onderdelen a en b, en tweede lid][ref6],
      [46l, eerste lid, aanhef en onderdeel a][ref7], [46m][ref8], [46o][ref9] en
      [46p, eerste tot en met vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref10] zijn van
      overeenkomstige toepassing ten aanzien van de voorzitter, de leden en hun plaatsvervangers.

      2 De [artikelen 13a][ref11], [13b, met uitzondering van het eerste lid, onderdelen b en c, en vierde lid][ref12],
      en [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref13] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van de voorzitter, de leden en hun plaatsvervangers, met dien verstande dat:

      a. voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het tuchtcollege; en

      b. de procureur-generaal niet verplicht is aan het verzoek, bedoeld in artikel 13a, te voldoen, indien de verzoeker
      redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


