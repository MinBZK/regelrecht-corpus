  - number: '53'
    text: |-
      Het bij of krachtens de [Oorlogswet voor Nederland][ref1] aangewezen militair gezag is bevoegd om indien de
      beperkte of de algemene noodtoestand is afgekondigd, in afwijking van de bepalingen gesteld bij of krachtens deze
      wet, regels te stellen met betrekking tot de beschikbaarheid van registerloodsen voor het verrichten van diensten
      als bedoeld in [artikel 2, eerste tot en met vijfde lid][ref2] en het door registerloodsen verrichten van die
      diensten, alsmede met betrekking tot het door de organen van de corporatie en de regionale corporaties verzorgen
      van de hun bij of krachtens deze wet opgedragen taken ten aanzien van de door de registerloodsen te verlenen
      diensten, voor zover zulks met het oog op de uitvoering van de militaire taak ter handhaving van de uitwendige of
      inwendige veiligheid noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0007983
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel2
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel53
