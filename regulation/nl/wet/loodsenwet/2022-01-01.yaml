      1 Wanneer de algemene raad voor de eerste maal na inwerkingtreding van de Wet actualisatie markttoezicht
      registerloodsen een voorstel als bedoeld in [artikel 27c, derde lid][ref1], doet, is de raming, bedoeld in
      artikel 27c, zevende lid, onderdeel c, gebaseerd op de voor het jaar 2015 geldende hoogte, vermeerderd met de
      indexering vastgesteld krachtens [artikel 27d, tweede lid][ref2].

      2 Bij ministeriële regeling wordt de voor het jaar 2015 geldende hoogte van de integrale uurtarieven vastgesteld.


