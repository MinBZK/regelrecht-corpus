        hoofdstuk: V
  - number: '22'
    text: |-
      1 Degene die met goed gevolg de examens, bedoeld in [artikel 9][ref1], heeft afgelegd, of beschikt over
      een ten aanzien van het beroep van registerloods verleende erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2]" wordt op zijn aanvraag in het register
      ingeschreven, indien hij:

      a. beschikt over de geneeskundige verklaringen, bedoeld in [artikel 24, eerste lid, onderdeel e][ref3], en

      b. beschikt over een verklaring van toelating, afgegeven door het bestuur van de desbetreffende regionale
      corporatie.

      2 Ter uitvoering van de aanvraag om inschrijving in het register worden persoonsgegevens over gezondheid verwerkt.
      De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of aan de wettelijke vereisten voor de
      inschrijving als registerloods is voldaan. De algemene raad is verwerkingsverantwoordelijke voor deze verwerking.

      3 De aanvrager ontvangt van de inschrijving in het register een verklaring volgens een bij verordening vast te
      stellen model.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel9
