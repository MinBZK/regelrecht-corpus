  - number: 27f
    text: |-
      1 De Autoriteit Consument en Markt stelt voor elk kalenderjaar bij besluit de loodsgeldtarieven vast en gaat
      daarbij uit van het voorstel op basis van [artikel 27c][ref1], dan wel [artikel 27ca][ref2] dat resulteert in de
      laagste loodsgeldtarieven.

      2 De Autoriteit Consument en Markt stelt bij besluit de tarieven en vergoedingen voor de overige diensten en taken,
      bedoeld in [artikel 27a][ref3], vast.

      3 De loodsgeldtarieven en de andere tarieven en vergoedingen kunnen per zeehavengebied en per verrichting
      verschillen.

      4 Besluiten als bedoeld in het eerste en tweede lid worden bekendgemaakt door plaatsing in de Staatscourant.


