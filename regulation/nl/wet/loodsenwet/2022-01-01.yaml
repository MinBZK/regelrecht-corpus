      1 De verordeningsbevoegdheid van andere openbare lichamen dan genoemd in [artikel 6, eerste lid][ref1], blijft ten
      aanzien van het onderwerp waarin bij of krachtens deze wet is voorzien, gehandhaafd.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot de financiële
      gevolgen van een verordening als bedoeld in het eerste lid.

      3 De vaststelling van krachtens het tweede lid te stellen regels geschiedt na overleg met het bestuur van het
      betrokken openbare lichaam.

      4 De vaststelling van een algemene maatregel van bestuur als bedoeld in het tweede lid, geschiedt op voordracht van
      Onze Minister en van Onze Minister van Binnenlandse Zaken.


