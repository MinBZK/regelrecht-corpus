    text: |-
      1 Onze Minister is bevoegd aanwijzingen te geven aan de registerloodsen met betrekking tot de beschikbaarheid voor
      het verrichten van de in [artikel 2, eerste tot en met vijfde lid][ref1] bedoelde diensten en het verrichten van
      die diensten alsmede aan de organen van de corporatie en de regionale corporaties met betrekking tot het verzorgen
      van de hun bij of krachtens deze wet opgedragen taken ten aanzien van de door de registerloodsen te verlenen
      diensten.

      2 De bepalingen gesteld krachtens [artikel 2, zesde lid][ref2], en de bepalingen gesteld bij of krachtens
      verordeningen als bedoeld in [artikel 15, eerste lid, onderdelen a en b][ref3], vinden geen toepassing, voor zover
      zij onverenigbaar zijn met krachtens het eerste lid gegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel2
