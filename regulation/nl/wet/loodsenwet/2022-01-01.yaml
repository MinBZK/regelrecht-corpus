        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4'
    text: |-
      1 Bij of krachtens verordening worden regels gesteld met betrekking tot de bevoegdheid van de registerloods
      ten aanzien van loodsplichtige scheepvaartwegen en categorieën van schepen en met betrekking tot het op
      peil houden van de in verband met het uitoefenen van het beroep van registerloods benodigde kennis en
      vaardigheden. Deze verordening en de krachtens die verordening te geven regels behoeven de goedkeuring
      van Onze Minister. De goedkeuring kan worden onthouden wegens strijd met de belangen, genoemd in
      [artikel 3, eerste lid, van de Scheepvaartverkeerswet][ref1].

      2 Het is degene die geen daartoe bevoegd registerloods is, verboden diensten als loods aan te bieden dan wel te
      verlenen aan:

      a. zeeschepen op loodsplichtige scheepvaartwegen; en

      b. schepen die anderszins ingevolge een wettelijke regeling verplicht zijn gebruik te maken van de diensten van
      een loods.

      3 Het verbod, genoemd in het tweede lid, geldt niet met betrekking tot schepen voor de vaart op loodsplichtige
      scheepvaartwegen, aangewezen krachtens [artikel 10, vierde lid, van de Scheepvaartverkeerswet][ref2], voor zover
      die schepen op binnenwateren varen.

      4 Het verbod, genoemd in het tweede lid, geldt niet voor de tot de Belgische loodsdienst behorende loods die
      krachtens het Scheldereglement als zodanig optreedt en de tot de Duitse loodsdienst behorende loods die krachtens
      het Verdrag tussen het Koninkrijk der Nederlanden en de Bondsrepubliek Duitsland tot regeling van de samenwerking
      in de Eemsmonding (*Trb.* 1960, 69) als zodanig optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel4
