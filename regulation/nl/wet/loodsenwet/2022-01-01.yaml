  - number: '18'
    text: |-
      1 Besluiten van de algemene raad of van de ledenvergadering van de corporatie kunnen op de voordracht van Onze
      Minister bij koninklijk besluit worden vernietigd.

      2 Ingeval van vernietiging geschiedt deze binnen zes maanden na de in [artikel 16, vierde lid][ref1], bedoelde ter
      kennis brenging of, wanneer het een ander besluit betreft, binnen zes maanden nadat het besluit ter kennis van Onze
      Minister is gekomen.


