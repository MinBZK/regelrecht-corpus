  - number: 27c
    text: |-
      1 De algemene raad doet de Autoriteit Consument en Markt een voorstel voor de tarieven en vergoedingen voor de
      diensten en taken, bedoeld in [artikel 27a][ref1]. In op grond van bij of krachtens algemene maatregel van bestuur
      te bepalen gevallen stelt de algemene raad een ingediend voorstel bij. Indien het ingediende voorstel niet wordt
      bijgesteld, geeft de algemene raad de redenen daarvoor aan

      2 Een voorstel als bedoeld in het eerste lid wordt opgesteld met inachtneming van het uitgangspunt dat elk
      afzonderlijk tarief redelijk en non-discriminatoir is.

      3 Een voorstel als bedoeld in het eerste lid met betrekking tot de loodsgeldtarieven wordt opgesteld met
      inachtneming van het uitgangspunt dat de loodsgeldtarieven voor het geheel kostengeoriënteerd zijn.

      4 Voorafgaand aan de indiening van een voorstel met betrekking tot de loodsgeldtarieven vraagt de algemene raad
      een zienswijze aan de besturen van de regionale loodsencorporaties, de bij ministeriële regeling te bepalen
      vertegenwoordigers van rechtspersonen, betrokken bij het bestuur van een of meer zeehavens en representatieve
      organisaties van ondernemers in het scheepvaart- en havenbedrijf.

      5 De algemene raad zendt een voorstel met betrekking tot de loodsgeldtarieven en de ingebrachte zienswijzen
      tegelijkertijd naar de Autoriteit Consument en Markt en naar degenen die op grond van het vierde lid zijn gevraagd
      om een zienswijze. Daarbij is gemotiveerd of en op welke wijze de ingebrachte zienswijzen hebben geleid tot
      aanpassing van het tariefvoorstel. Indien een zienswijze niet heeft geleid tot aanpassing, geeft de algemene raad
      de redenen daarvoor aan.

      6 Een voorstel met betrekking tot de loodsgeldtarieven wordt jaarlijks ingediend, is mede gebaseerd op de
      financiële verantwoording van het aan de indiening voorafgaande kalenderjaar en heeft betrekking op het volgende
      kalenderjaar.

      7 Een voorstel met betrekking tot de loodsgeldtarieven bevat ten minste:

      a. een raming van alle in het desbetreffende kalenderjaar te loodsen scheepsreizen per tarief en het voorgenomen
      kwaliteitsniveau;

      b. een raming van de te loodsen scheepsreizen, bedoeld onder a, te behalen omzet, die mede is gebaseerd op de
      daadwerkelijk gerealiseerde omzet in het kalenderjaar voorafgaande aan het kalenderjaar waarin het voorstel wordt
      gedaan;

      c. een raming van de arbeidsvergoeding die is gebaseerd op de daadwerkelijk ontvangen vergoeding in het
      kalenderjaar voorafgaande aan het kalenderjaar waarin het voorstel wordt gedaan;

      d. een raming van de wijzigingen in de kosten van de materiële vaste activa, de geraamde investeringen en het
      geraamde rendement;

      e. een raming van de overige omzet en kosten, die mede is gebaseerd op de daadwerkelijk gerealiseerde omzet en
      kosten in het kalenderjaar voorafgaande aan het kalenderjaar waarin het voorstel wordt gedaan;

      f.

      g. een raming van de voor het desbetreffende kalenderjaar voorziene algemene besparing op de kosten;

      h. de voor het desbetreffende kalenderjaar voorziene correctie in verband met bestaande onregelmatigheden in de
      mate van kostendekkendheid van de tarieven voor de verschillende zeehavengebieden;

      i. een verrekening van het verschil tussen de geraamde en de daadwerkelijk uitgevoerde wijzigingen in de materiële
      activa en investeringen in het kalenderjaar voorafgaande aan het jaar waarin het voorstel wordt gedaan;

      j. een onderbouwing van de ramingen, bedoeld onder a tot en met g;

      k. een verrekening van te veel gedane stortingen gedaan voor het kunnen voldoen aan verplichtingen die voortvloeien
      uit het functioneel leeftijdspensioen van registerloodsen en uit het krachtens collectieve arbeidsovereenkomst
      toegekend recht op functioneel leeftijdsontslag van het personeel, belast met de uitvoering van de in het
      [artikel 26, eerste lid, onderdeel b][ref2], bedoelde taken.

      8 Indien een besluit ter vaststelling van de loodsgeldtarieven als bedoeld in [artikel 27f, eerste lid][ref3], is
      of wordt herzien, bevat het eerstvolgende in te dienen voorstel, bedoeld in het zevende lid, tevens een verrekening
      van het verschil in omzet tussen de tarieven die in rekening zijn gebracht op basis van het eerdere tariefbesluit
      en de tarieven in het laatstelijk overeenkomstig artikel 27f, eerste lid, vastgestelde tariefbesluit.

      9 De algemene raad maakt bij het voorstel, bedoeld in het zevende lid, aannemelijk dat het voorstel in voldoende
      mate bijdraagt aan het bereiken van de meest efficiënte werkwijze voor registerloodsen en de productiviteit en
      kwaliteit van de loodsdienstverlening.

      10 Een voorstel als bedoeld in het eerste lid met betrekking tot andere tarieven dan de loodsgeldtarieven is voor
      elk afzonderlijk tarief kostengeoriënteerd. Een voorstel bevat een onderbouwde raming van de kosten en omzet voor
      elke afzonderlijke dienst of taak.


