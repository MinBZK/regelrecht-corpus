  - number: '69'
    text: |-
      De op het tijdstip van inwerkingtreding van de [Wet actualisatie markttoezicht registerloodsen](onbekend)
      geldende loodsgeldtarieven, vastgesteld krachtens [artikel 27f ][ref1]van de Loodsenwet, zoals dat artikel luidde
      voorafgaand aan het tijdstip van inwerkingtreding van de Wet actualisatie markttoezicht registerloodsen, blijven
      van kracht tot het tijdstip waarop het besluit in werking treedt, waarbij het desbetreffende tarief voor de eerste
      maal met toepassing van de door eerdergenoemde wet gewijzigde artikelen is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel27f
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel69
