    text: |-
      1 De verordeningen zijn slechts verbindend voor de leden, de corporatie, de algemene raad, de regionale corporaties
      en hun besturen alsmede, voor zover zij betrekking hebben op personen die worden opgeleid voor het beroep van
      registerloods, voor deze personen.

      2 Bepalingen gesteld bij of krachtens een verordening die strijdig zijn met het bepaalde bij of krachtens de wet
      zijn onverbindend.
