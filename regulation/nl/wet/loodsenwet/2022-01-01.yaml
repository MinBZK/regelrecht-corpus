    text: |-
      1 De registerloods is onderworpen aan tuchtrechtspraak ter zake van enig handelen of nalaten dat een behoorlijk
      registerloods niet betaamt, ter zake van enige overtreding van een verordening of van een krachtens een verordening
      gegeven nader voorschrift als bedoeld in [artikel 15][ref1].

      2 De tuchtrechtspraak in eerste aanleg wordt uitgeoefend door het tuchtcollege loodsen.

      3 De tuchtrechtspraak in hoger beroep wordt uitgeoefend door het College van Beroep voor het bedrijfsleven. Het
      College van Beroep voor het bedrijfsleven beslist in hoogste ressort.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel15
