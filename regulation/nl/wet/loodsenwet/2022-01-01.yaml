  - number: 27g
    text: |-
      1 De Autoriteit Consument en Markt stelt een besluit als bedoeld in [artikel 27f, eerste en tweede lid][ref1],
      vast in afwijking van het desbetreffende voorstel, indien het voorstel naar het oordeel van de Autoriteit Consument
      en Markt:

      a. niet voldoet aan de bij of krachtens de [artikelen 27c tot en met 27d][ref2] gestelde eisen;

      b. in onvoldoende mate bijdraagt aan het bereiken van de meest efficiënte werkwijze van registerloodsen en de
      productiviteit en kwaliteit van de loodsdienstverlening, of,

      c. niet is gebaseerd op een redelijk rendement op investeringen.

      2 De Autoriteit Consument en Markt kan, ambtshalve of op verzoek van de algemene raad, bij de vaststelling van de
      tarieven en vergoedingen correcties aanbrengen in verband met bijzondere omstandigheden.

      3 De Autoriteit Consument en Markt kan bij de vaststelling van de tarieven en vergoedingen correcties aanbrengen
      indien de tarieven of vergoedingen voor een kalenderjaar voorafgaande aan het kalenderjaar waarvoor de tarieven en
      vergoedingen worden vastgesteld:

      a. bij rechterlijke uitspraak of met toepassing van de [artikelen 6:19][ref3] of
      [7:11 van de Algemene wet bestuursrecht][ref4] zijn gewijzigd, of

      b. zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de Autoriteit Consument en Markt,
      indien zij de beschikking had over juiste en volledige gegevens, tarieven of vergoedingen zou hebben vastgesteld
      die in aanmerkelijk mate zouden afwijken van de vastgestelde tarieven of vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel27f
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel27c
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel619
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel711
