  - number: '5'
    text: |-
      1 Onverminderd [artikel 4][ref1], worden bij of krachtens algemene maatregel van bestuur eisen gesteld met
      betrekking tot de opleiding, kundigheid, ervaring en geschiktheid voor het loodsen van schepen op bij algemene
      maatregel van bestuur aan te wijzen wateren en ten aanzien van het in verband met de beroepsuitoefening af te geven
      document.

      2 De kosten verbonden aan en de kosten die samenhangen met de bij of krachtens het eerste lid, gestelde eisen,
      kunnen ten laste worden gebracht van de aanvrager van het in die maatregel genoemde examen of document.

      3 De bedragen ter vergoeding van de kosten, bedoeld in het tweede lid, worden bij ministeriële regeling
      vastgesteld.

      4 Ter uitvoering van de in het eerste lid bedoelde eisen worden persoonsgegevens verwerkt over gezondheid. De
      verwerking van deze gegevens strekt ertoe te kunnen beoordelen of de geschiktheid voor het loodsen van schepen
      aanwezig is of niet meer aanwezig is. Onze Minister is verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel4
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De gezamenlijke registerloodsen vormen de Nederlandse loodsencorporatie. De corporatie is een openbaar lichaam in
      de zin van [artikel 134 van de Grondwet][ref1]. Zij is gevestigd te Rotterdam.

      2 De corporatie heeft een voorzitter, een algemene raad en een ledenvergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '7'
    text: De voorzitter vertegenwoordigt de corporatie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel7
  - number: '8'
    text: |-
      1 De algemene raad voert het geldelijk beheer en het overig bestuur. Deze raad bestaat uit de voorzitter en de
      voorzitters van de regionale corporaties of hun plaatsvervangers.

      2 De voorzitter wordt door de ledenvergadering benoemd voor een termijn van ten hoogste vier jaren. Hij is geen lid
      van het bestuur van een regionale corporatie.

      3 De voorzitter wordt bij verhindering vervangen door een lid van de algemene raad, daartoe door die raad
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel8
  - number: '9'
    text: |-
      1 De algemene raad heeft in het bijzonder tot taak:

      a. met betrekking tot het beroep van registerloods:

      1°. het verzorgen van de opleiding tot registerloods en het afnemen van de examens;

      2°. het verzorgen van de opleiding tot registerloods van degene die daartoe op grond van de
      [Algemene wet erkenning EU-beroepskwalificaties][ref1] in aanmerking komt, voor zover dit betreft het gedeelte van
      de opleiding dat betrokkene dient te volgen nadat hij heeft aangetoond te voldoen aan de eisen van geschiktheid,
      zoals vastgesteld krachtens het tweede lid;

      3°. het bevorderen van een behoorlijke beroepsuitoefening;

      4°. het bevorderen van de vakbekwaamheid;

      5°. het geven van voorlichting over onderwerpen die voor de registerloods van belang zijn; en

      b. het geven van advies aan Onze Minister inzake de uitvoering van deze wet, hetzij op verzoek van Onze Minister
      hetzij uit eigen beweging.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de opleiding,
      kundigheid, ervaring en geschiktheid die worden gevorderd bij de toelating tot de opleiding en bij de examens,
      bedoeld in het eerste lid, onderdeel a, onder 1°, en worden regels gesteld omtrent de wijze van examinering.

      3 Ten behoeve van de uitvoering van het eerste lid, onderdeel a, onder 1° en 2°, en tweede lid, worden
      persoonsgegevens verwerkt over gezondheid. De verwerking van deze gegevens vindt plaats teneinde te kunnen
      beoordelen of de geschiktheid voor het uitoefenen van het beroep van registerloods aanwezig is.

      4 De taken genoemd in het eerste lid, onderdeel a, onder 3° en 5°, worden uitsluitend verricht voor zover deze
      betrekking hebben op registerloodsen in meer dan één regio.

      5 Voor de deelname aan een van de opleidingen, bedoeld in het eerste lid, onderdeel a, 2°, is een vergoeding
      verschuldigd voor de kosten aan de algemene raad, volgens een bij besluit van de Autoriteit Consument en Markt
      overeenkomstig het bepaalde bij en krachtens hoofdstuk VIA vast te stellen tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: '10'
    text: |-
      1 De gezamenlijke registerloodsen van eenzelfde regio vormen de regionale loodsencorporatie in die regio.

      2 De namen en de vestigingsplaatsen van de regionale loodsencorporaties zijn als volgt:

      a. Noord te Delfzijl;

      b. Amsterdam-IJmond te IJmuiden;

      c. Rotterdam-Rijnmond te Rotterdam;

      d. Scheldemonden te Vlissingen.

      3 De grenzen van een regio worden bij algemene maatregel van bestuur vastgesteld.

      4 Een regionale corporatie is rechtspersoon.

      5 Een regionale corporatie heeft een voorzitter, een bestuur en een ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel10
  - number: '11'
    text: De voorzitter van een regionale corporatie vertegenwoordigt de regionale corporatie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het bestuur voert het geldelijke beheer en het overige bestuur van de regionale corporatie.

      2 Het bestuur bestaat uit de voorzitter van de regionale corporatie en:

      a. ten minste twee en ten hoogste vier leden voor regionale corporaties die niet meer dan honderd leden tellen;

      b. en ten minste twee en ten hoogste zes leden voor regionale corporaties die meer dan honderd leden tellen.

      3 De voorzitter van de regionale corporatie, de andere leden van het bestuur, alsmede hun plaatsvervangers, worden
      door de ledenvergadering uit de leden van de regionale corporatie benoemd voor een termijn van ten hoogste vier
      jaren.

      4 De voorzitter van de regionale corporatie en de andere leden van het bestuur worden bij verhindering vervangen
      door hun plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel12
  - number: '13'
    text: |-
      1 Het bestuur van de regionale corporatie heeft in het bijzonder tot taak:

      a. met betrekking tot het beroep van registerloods:

      1°. er voor zorg te dragen dat er steeds voldoende personen worden opgeleid;

      2°. het bevorderen van een behoorlijke beroepsuitoefening;

      3°. het geven van voorlichting over onderwerpen die voor de registerloods van belang zijn;

      b. het ten behoeve van de verlening van een vrijstelling of ontheffing van de loodsplicht, bedoeld in
      [artikel 11, eerste lid, onderdeel b, van de Scheepvaartverkeerswet][ref1], leveren van een aandeel bij de
      opleiding en examinering van personen die een dergelijke ontheffing aanvragen.

      c. het voorbereiden van ledenvergaderingen.

      2 De taken, genoemd in het eerste lid, onderdeel a, onder 2° en 3°, worden uitsluitend verricht voor zover daarin
      niet is voorzien krachtens [artikel 9, eerste lid, onderdeel a, onder 3° of 5°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel9
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel13
    references:
