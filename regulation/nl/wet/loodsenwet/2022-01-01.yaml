  - number: '40'
    text: |-
      1 Het tuchtcollege loodsen kan, indien het van oordeel is dat een tegen een registerloods ingediende klacht geheel
      of gedeeltelijk gegrond is, een of meer van de volgende tuchtmaatregelen opleggen:

      a. waarschuwing;

      b. berisping;

      c. geldboete van ten hoogste de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1];

      d. schorsing of beperking van de bevoegdheid voor een periode van ten hoogste één jaar;

      e. definitief vervallen of beperken van de bevoegdheid;

      f. veroordeling in de kosten die de klager in verband met de behandeling van de klacht redelijkerwijs heeft moeten
      maken; of

      g. veroordeling in de overige kosten die in verband met de behandeling van de tuchtzaak zijn gemaakt.

      2 Het tuchtcollege loodsen kan een klacht gegrond verklaren zonder oplegging van een tuchtmaatregel als bedoeld in
      het eerste lid.

      3 Bij het opleggen van een geldboete als bedoeld in het eerste lid, onderdeel c, en een veroordeling in de kosten
      als bedoeld in onderdeel f en g, bepaalt het tuchtcollege loodsen de wijze waarop, en het termijn of de termijnen
      waarbinnen aan die tuchtmaatregel worden voldaan. De te betalen geldboete komt toe aan de Staat. Voor de toepassing
      van [titel 4.4 van de Algemene wet bestuursrecht][ref2] wordt de uitspraak van het tuchtcollege loodsen aangemerkt
      als een beschikking als bedoeld in [artikel 4:86 van die wet][ref3]. Indien niet binnen de gestelde termijn aan
      de opgelegde tuchtmaatregel wordt voldaan, kan het tuchtcollege loodsen ambtshalve beslissen de registerloods aan
      wie een in de eerste zin bedoelde tuchtmaatregel is opgelegd, na hem in de gelegenheid te hebben gesteld te worden
      gehoord, op deze grond een of meer andere tuchtmaatregelen als bedoeld in het eerste lid op te leggen.

      4 Bij het opleggen van de tuchtmaatregelen, genoemd in het eerste lid, onder c en d, kan het tuchtcollege loodsen
      bepalen dat deze geheel of ten dele niet ten uitvoer worden gelegd, tenzij het tuchtcollege loodsen bij een
      latere beslissing anders mocht bepalen op grond van het feit dat de registerloods aan wie de tuchtmaatregelen
      zijn opgelegd, zich voor het einde van een bij die oplegging te bepalen proeftijd van ten hoogste twee jaren
      heeft gedragen in strijd met een verordening of krachtens een verordening gegeven nader voorschrift als bedoeld
      in [artikel 15][ref4].

      5 De tuchtmaatregelen, genoemd in het eerste lid onder c, d, e, f en g, kunnen eerst ten uitvoer worden gelegd
      nadat de beslissing van het tuchtcollege loodsen onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
