  - number: '26'
    text: |-
      1 Bij verordening worden regels vastgesteld ten aanzien van de bedragen, de verschuldigdheid daarvan, de maatstaven
      voor de vaststelling, alsmede de betaling met betrekking tot:

      a. de diensten van registerloodsen;

      b. de door de algemene raad en de besturen van de regionale corporaties krachtens deze wet te verzorgen taken;

      c. de taken ten behoeve van de door de registerloodsen te verlenen diensten.

      2 De regels, vastgesteld bij de verordening, bedoeld in het eerste lid, houden rekening met de totale te verwachten
      opbrengst uit loodsgelden en voorzien in ieder geval in:

      a. een evenredigheid voor de maatstaven met betrekking tot de bedragen voor de diensten van registerloodsen en de
      verschillende regio's;

      b. een waarborg voor het kunnen verzorgen van de taken van de algemene raad en de besturen van de regionale
      corporaties.
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel26
  - number: '27'
    text: |-
      Vaststelling van een verordening tot wijziging van de verordening, bedoeld in [artikel 26, eerste lid][ref1],
      voor zover deze betrekking heeft op een wijziging van de bedragen of de maatstaven voor de vaststelling daarvan,
      vindt slechts plaats door een besluit van de ledenvergadering met een meerderheid van twee derden van de in die
      ledenvergadering uitgebrachte geldige stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel26
    url: https://wetten.overheid.nl/BWBR0004365/2022-01-01#Artikel27
