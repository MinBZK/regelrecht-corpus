        artikel: '41'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '43'
    text: |-
      1 Het hoger beroep wordt ingesteld bij beroepschrift. Bij het beroepschrift wordt overgelegd een afschrift van de
      schriftelijke beslissing van het tuchtcollege loodsen, waartegen het hoger beroep is gericht.

      2 De griffier van het College van Beroep voor het bedrijfsleven zendt binnen een week na ontvangst van het
      beroepschrift een afschrift daarvan aan de registerloods waartegen de klacht zich richt, aan de klager en
      de algemene raad, voor zover het hoger beroep niet door hen is ingesteld, alsmede aan de secretaris van het
      tuchtcollege loodsen.

      3 De secretaris van het tuchtcollege loodsen zendt binnen drie weken na ontvangst van het afschrift van het
      beroepschrift alle stukken die op de zaak betrekking hebben aan de griffier van het College van Beroep voor het
      bedrijfsleven.

      4 Het College van Beroep voor het bedrijfsleven behandelt de zaak opnieuw in volle omvang. Op de behandeling
      in hoger beroep zijn de [artikelen 35, eerste, tweede en derde lid][ref1], [36, tweede en derde lid][ref2],
      [37][ref3], [38, met uitzondering van de tweede volzin van het eerste lid][ref4], [39][ref5], [40][ref6] en
      [41][ref7] van overeenkomstige toepassing.


