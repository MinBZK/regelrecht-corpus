  - number: '31'
    text: |-
      1 De secretaris en plaatsvervangend secretaris zijn voor de uitoefening van hun taken uitsluitend verantwoording
      verschuldigd aan de voorzitter.

      2 De secretaris en plaatsvervangend secretaris worden door Onze Minister benoemd, geschorst en ontslagen. Schorsing
      en ontslag vindt plaats op voordracht van de voorzitter.

      3 [Artikel 29, vijfde lid][ref1], is op de secretaris en plaatsvervangend secretaris van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel29
