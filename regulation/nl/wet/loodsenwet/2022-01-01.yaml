  - number: 2a
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat onder bij in die maatregel te bepalen voorwaarden, bij
      wijze van experiment tijdelijk kan worden afgeweken van [artikel 2, eerste, tweede of derde lid][ref1].

      2 Het experiment, bedoeld in het eerste lid, heeft tot doel om te beoordelen of met een andere invulling van de
      wijze van functie-uitoefening van de loods de belangen, bedoeld in [artikel 2, zesde lid][ref2], voldoende worden
      beschermd.

      3 In de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt, met inachtneming van de belangen, genoemd
      in [artikel 3 van de Scheepvaartverkeerswet][ref3], in ieder geval bepaald:

      a. de nadere concretisering van het doel van het experiment;

      b. binnen welke periode geëxperimenteerd mag worden, waarbij die periode niet meer dan vijf achtereenvolgende jaren
      bedraagt;

      c. welke voorschriften of beperkingen worden gesteld aan het experiment;

      d. welke mogelijkheden er zijn voor verlenging;

      e. op welke wijze het experiment wordt geëvalueerd.

      4 [Artikel 3][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0004365#Artikel3
