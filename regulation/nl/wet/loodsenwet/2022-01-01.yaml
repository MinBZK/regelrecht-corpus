      1 Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de [Wet actualisatie markttoezicht
      registerloodsen](onbekend) en vervolgens telkens na vijf jaar aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.

      2 Onverminderd het eerste lid kan de Autoriteit Consument en Markt ten hoogste eenmaal per vijf jaar een onderzoek
      uitvoeren naar de kostenelementen opgenomen in het voorstel met betrekking tot de loodsgeldtarieven, bedoeld in
      [artikel 27c][ref1].


