  - number: '68'
    text: |-
      1 De rechtspersoon die is aangewezen krachtens [artikel 63, derde lid][ref1], is gehouden het geheel van de
      taken van het personeel als bedoeld in [artikel 63, derde lid][ref2], voor zover die tot de overgangsdatum
      door Onze Minister onderscheidenlijk de gemeente in eigen beheer zijn verzorgd, gedurende een termijn
      van ten minste vijf jaren na de overgangsdatum eveneens in eigen beheer te verzorgen. De corporatie is,
      behoudens bij toepassing van het tweede lid, gehouden om bij of krachtens de verordening als bedoeld in
      [artikel 15, eerste lid, onderdeel ][ref3], hiermee rekening te houden.

      2 Onze Minister kan het bestuur van de rechtspersoon als bedoeld in het eerste lid, in overeenstemming met
      Onze Minister van Binnenlandse Zaken, ontheffing verlenen van het eerste lid, indien dat bestuur voldoende
      garanties heeft verkregen voor het behoud van de werkgelegenheid van het betrokken personeel als bedoeld in
      [artikel 63, derde lid][ref4], tot afloop van de in het eerste lid genoemde termijn.


