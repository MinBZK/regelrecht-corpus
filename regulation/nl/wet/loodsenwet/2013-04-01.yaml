        paragraaf: '2'
  - number: '6'
    text: |-
      1 De gezamenlijke registerloodsen vormen de Nederlandse loodsencorporatie. De corporatie is een openbaar lichaam in
      de zin van [artikel 134 van de Grondwet][ref1]. Zij is gevestigd te Rotterdam.

      2 De corporatie heeft een voorzitter, een algemene raad en een ledenvergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel6
