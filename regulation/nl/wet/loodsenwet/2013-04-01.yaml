    text: |-
      1 Met het onderzoek zijn belast de krachtens [artikel 45b, eerste lid][ref1], aangewezen ambtenaren.

      2 Ten dienste van het onderzoek beschikken zij over de bevoegdheden die hun in deze paragraaf worden toegekend,
      alsmede met de daaraan verbonden beperkingen, over de bevoegdheden die hun zijn toegekend ter uitoefening van het
      toezicht, bedoeld in [artikel 45b][ref2].

      3 De krachtens [artikel 45b][ref3] aangewezen ambtenaren oefenen de hun in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref4] toegekende bevoegdheden zo nodig uit met behulp van de
      sterke arm.

      4 Op het onderzoek zijn de [artikelen 53][ref5], [54][ref6] en [54a van de Mededingingswet][ref7] van
      overeenkomstige toepassing.


