  - number: '21'
    text: |-
      1 Er is een openbaar loodsenregister. Ten behoeve van dit register worden persoonsgegevens verwerkt met betrekking
      tot ingeschreven registerloodsen. De verwerking van deze gegevens vindt plaats ten behoeve van de waarborging van
      de kwaliteit, de continuïteit en de rechtszekerheid van de loodsdienstverlening, alsmede van de uitvoering van de
      bij of krachtens deze wet vastgestelde regels. De algemene raad is verantwoordelijke voor deze verwerking.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inrichting van het register, de
      wijze van inschrijving en van doorhaling en het geven van afschriften uit het register.

      3 De tarieven voor de kosten van het verstrekken van afschriften uit het register worden vastgesteld bij besluit
      van de Autoriteit Consument en Markt, overeenkomstig het bepaalde bij en krachtens hoofdstuk VIA.

      4 In het register wordt degene die voldoet aan [artikel 22, eerste lid][ref1], op zijn aanvraag ingeschreven
      als registerloods. Bij een inschrijving worden in het register vermeld de naam, voornamen, geboortedatum,
      geboorteplaats en woonplaats van de aanvrager, alsmede de loodsplichtige scheepvaartwegen en de categorieën van
      schepen waarvoor hij bevoegd is en tot welke regionale corporatie hij behoort.

      5 Indien een registerloods in meer dan een regio bevoegd is, bepaalt de algemene raad, gehoord de besturen van
      de betreffende regionale corporaties en de betrokken registerloods, ten aanzien van welke regionale corporatie de
      inschrijving zal plaatsvinden.

      6 De algemene raad is belast met het beheer van het register.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
