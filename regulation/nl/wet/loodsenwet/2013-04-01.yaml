  - number: '33'
    text: |-
      1 De voorzitter is bevoegd ambtshalve aan de leden en hun plaatsvervangers, die de waardigheid van hun ambt, hun
      ambtsbezigheden of ambtsplichten verwaarlozen of die zich schuldig maken aan overtreding van [artikel 34][ref1], de
      nodige waarschuwing te doen, na hen in de gelegenheid te hebben gesteld om te worden gehoord.

      2 De voorzitter van het College als bedoeld krachtens [artikel 44][ref2], heeft gelijke bevoegdheid ten aanzien van
      de voorzitter van het tuchtcollege loodsen en diens plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel33
