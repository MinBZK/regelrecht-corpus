  - number: 45g
    text: |-
      1 De Autoriteit Consument en Markt kan aan degene die jegens een krachtens [artikel 45a, tweede lid][ref1],
      onderscheidenlijk [45b, eerste lid][ref2], aangewezen ambtenaar handelt in strijd met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref3], een bestuurlijke boete opleggen.

      2 Ingeval de overtreding, bedoeld in het eerste lid, een weigering inhoudt medewerking te verlenen aan de
      toepassing van [artikel 5:17, eerste lid, van de Algemene wet bestuursrecht][ref4] kan de Autoriteit Consument
      en Markt een last onder dwangsom opleggen om inzage te verlenen in de in die last aangegeven zakelijke gegevens
      en bescheiden.

      3 De in het eerste lid bedoelde boete bedraagt ten hoogste € 450.000,=, of, indien dit meer is, 1% van
      de gezamenlijke omzet van de organisaties, aangewezen krachtens de [artikelen 15a, tweede lid][ref5], en
      [15b, eerste lid, van de Scheepvaartverkeerswet][ref6], in het boekjaar voorafgaande aan de beschikking.

      4 Bij toepassing van de bevoegdheden, bedoeld in het eerste en tweede lid, zijn de [artikelen 57, tweede lid][ref7],
      [69, tweede lid][ref8], [77][ref9], en [78 tot en met 82 van de Mededingingswet][ref10] van overeenkomstige
      toepassing.

      5 Indien op grond van [artikel 5.0.1, derde lid, van de Algemene wet bestuursrecht][ref11] toepassing is gegeven
      aan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref12], bedraagt de bestuurlijke boete ten
      hoogste € 450.000,=.


