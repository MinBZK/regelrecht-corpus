      1 De registerloods is onderworpen aan tuchtrechtspraak ter zake van enige overtreding van een verordening of van
      de krachtens een verordening gegeven nadere voorschriften, als bedoeld in [artikel 15][ref1]. Voor een dergelijke
      overtreding kan een van de volgende maatregelen worden opgelegd:

      a. berisping;

      b. geldboete van ten hoogste € 2 250;

      c. schorsing of beperking van de bevoegdheid voor de duur van ten hoogste één jaar;

      d. verval of beperking van de bevoegdheid.

      2 Indien een geldboete is opgelegd, komt de te betalen geldsom toe aan de Staat. Betaling van
      de geldsom geschiedt aan Onze Minister. De geldsom moet binnen zes weken na de datum waarop de
      uitspraak van het tuchtcollege onherroepelijk is geworden worden betaald. Voor de toepassing van
      [titel 4.4 van de Algemene wet bestuursrecht][ref2] wordt de uitspraak van het tuchtcollege aangemerkt als
      beschikking als bedoeld in [artikel 4:86 van die wet][ref3]. In de uitspraak van het tuchtcollege kunnen twee of
      meer termijnen worden vastgesteld waarin de geldsom moet worden voldaan.

      3 Onze Minister is bevoegd tot uitvaardiging van een dwangbevel tot invordering van de verschuldigde geldsom.

      4 De betekening en de tenuitvoerlegging van een dwangbevel geschieden door de zorg van de ontvanger, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref4] en door de belastingdeurwaarder,
      bedoeld in [artikel 2, eerste lid, onderdeel j, van die wet][ref5] met toepassing van de [artikelen 13][ref6] en
      [14 van die wet][ref7].

      5 Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref8] alsmede verrekenen op grond van artikel 24 van die wet.

      6 Met betrekking tot het verzet tegen de tenuitvoerlegging van een dwangbevel is
      [artikel 17 van de Invorderingswet 1990][ref9] van overeenkomstige toepassing met dien verstande dat in dat artikel
      voor "de ontvanger die het dwangbevel heeft uitgevaardigd" telkens moet worden gelezen: de met de tenuitvoerlegging
      van het dwangbevel belaste ontvanger.

      7 Met betrekking tot de kosten van aanmaning en verdere invordering zijn de [artikelen 6][ref10] en
      [7 van de Invorderingswet 1990][ref11] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
