  - number: 27d
    text: |-
      1 Bij algemene maatregel van bestuur worden in het belang van de vaststelling van kostengeoriënteerde
      loodsgeldtarieven zeehavengebieden aangewezen, worden nadere regels gesteld met betrekking tot de redelijkheid,
      bedoeld in [artikel 27c, tweede lid][ref1], de kostenoriëntatie, bedoeld in artikel 27c, derde lid, onder a, en
      kunnen overige maatstaven voor de structuur van deze tarieven worden geregeld. Bij deze maatregel kunnen taken en
      bevoegdheden aan de Autoriteit Consument en Markt worden opgedragen.

      2 Bij algemene maatregel van bestuur wordt een jaarlijkse indexering van de uurtarieven van de arbeidsvergoeding
      vastgesteld.

      3 Bij ministeriële regeling wordt een bij de vaststelling van de loodsgeldtarieven in acht te nemen correctiefactor
      vastgesteld in verband met bestaande onevenwichtigheden in de mate van kostendekkendheid van de loodsgeldtarieven
      in de verschillende zeehavengebieden.

      4 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de samenstelling van de regionale
      overlegcommissies, bedoeld in [artikel 27c, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
