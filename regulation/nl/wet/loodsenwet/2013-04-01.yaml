  - number: 27k
    text: |-
      1 De algemene raad voert in het belang van de bevordering van de meest efficiënte werkwijze van registerloodsen en
      de heffing van redelijke, non-discriminatoire en kostengeoriënteerde tarieven eens per twee jaar een vergelijkend
      onderzoek uit naar de hoogte van de loodsgeldtarieven, de methode van kostentoerekening, het gerealiseerde
      kwaliteitsniveau en de productiviteitsontwikkeling.

      2 Het vergelijkend onderzoek heeft in elk geval betrekking op de loodsgeldtarieven die geheven worden in Nederland,
      Vlaanderen en de Bondsrepubliek Duitsland. De Autoriteit Consument en Markt kan andere landen of havengebieden
      aanwijzen die in het onderzoek moeten worden betrokken.

      3 Het onderzoeksverslag bevat een toelichting op de geconstateerde verschillen.

      4 Het onderzoeksverslag wordt aan de Autoriteit Consument en Markt gezonden.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel27k
