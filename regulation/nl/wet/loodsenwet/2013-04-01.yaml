      1 De Autoriteit Consument en Markt is bevoegd van de organen, genoemd in de [artikelen 6, tweede lid][ref1],
      en [10, vijfde lid][ref2], van de samenwerkingsverbanden van registerloodsen die ter uitvoering van het
      bepaalde krachtens [artikel 15, eerste lid, onder b][ref3], zijn of worden opgericht, van de krachtens de
      [artikelen 15a, tweede lid][ref4], en [15b, eerste lid, van de Scheepvaartverkeerswet][ref5] aangewezen
      organisaties en van de rechtspersoon, onderscheidenlijk rechtspersonen, die zijn belast met de feitelijke
      uitvoering van de verplichtingen, bedoeld in [artikel 26, tweede lid, onder a][ref6], alle inlichtingen en gegevens
      te verlangen, die zij voor de uitoefening van haar taak redelijkerwijs nodig acht.

      2 De organen, samenwerkingsverbanden van registerloodsen en de organisaties en rechtspersonen, bedoeld in het
      eerste lid, verlenen binnen de door de Autoriteit Consument en Markt gestelde termijn alle medewerking die zij
      redelijkerwijs kan verlangen bij de uitoefening van haar bevoegdheden op grond van deze wet.


