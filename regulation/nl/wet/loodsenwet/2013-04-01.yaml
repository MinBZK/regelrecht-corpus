  - number: '30'
    text: |-
      1 De voorzitter en de overige leden, alsmede voor elk hunner een of meer plaatsvervangers worden voor de tijd van
      zes jaren benoemd door Onze Minister en Onze Minister van Justitie. Zij zijn bij hun aftreden weer benoembaar. Op
      eigen verzoek kunnen zij door Onze voornoemde Ministers worden ontslagen. De benoemingstermijn van hem die wordt
      benoemd ter vervulling van een tussentijdse vacature, eindigt bij het verstrijken van de benoemingstermijn van
      degene in wiens plaats hij is getreden.

      2 De voorzitter moet voldoen aan de vereisten voor benoeming tot rechter in een rechtbank. Uit iedere regionale
      corporatie wordt een registerloods benoemd uit een voordracht van het bestuur van een regionale corporatie welke
      ten minste twee personen bevat die behoren tot de betreffende regionale corporatie en geen lid of plaatsvervangend
      lid van dat bestuur zijn.

      3 Voor de in het eerste lid bedoelde plaatsvervangers is het bepaalde in het tweede lid van overeenkomstige
      toepassing.

      4 Het tuchtcollege loodsen heeft een secretaris en zo nodig een plaatsvervangend secretaris:

      a. aan wie op grond van een afsluitend examen van een opleiding in het wetenschappelijk
      onderwijs door een universiteit dan wel de Open Universiteit, waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht is verleend, of

      b. die op grond van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit dan
      wel de Open Universiteit, waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] betrekking
      heeft, het recht heeft verkregen om de titel meester te voeren.

      Zij worden door Onze Minister en Onze Minister van Justitie benoemd, geschorst en ontslagen.

      5 De voorzitter en de secretaris, alsmede hun plaatsvervangers, worden in ieder geval ontslagen met ingang van de
      maand volgend op die waarin zij de leeftijd van zeventig jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel30
