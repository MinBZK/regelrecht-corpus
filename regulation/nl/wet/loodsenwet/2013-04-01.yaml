        paragraaf: '3'
  - number: '34'
    text: |-
      1 Zij die deel uitmaken van het tuchtcollege loodsen en hun plaatsvervangers mogen zich noch direct noch
      indirect over enige aangelegenheid, welke door hen behandeld wordt of waarvan zij weten of vermoeden dat deze
      door hen behandeld zal worden, in enig bijzonder onderhoud of gesprek inlaten met partijen of hun raadslieden of
      gemachtigden, noch daarover enige bijzondere inlichting of schriftelijk stuk aannemen.

      2 Het is hen die deel uitmaken van het tuchtcollege loodsen en hun plaatsvervangers verboden hetgeen zij als
      zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie wordt gevorderd. De
      verplichting tot geheimhouding geldt niet tegenover ambtenaren, voor zover mededeling aan hen op grond van een
      wettelijk voorschrift is vereist.

      3 Zij die deel uitmaken van het tuchtcollege loodsen en hun plaatsvervangers zijn verplicht het geheim te bewaren
      omtrent de gevoelens die in de raadkamer over aanhangige zaken zijn geuit.

      4 Het eerste, tweede en derde lid gelden ook voor de secretaris van het tuchtcollege loodsen en zijn
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel34
  - number: '35'
    text: |-
      De voorzitter, de overige leden en de secretaris, alsmede hun plaatsvervangers, ontvangen een vacatiegeld, alsmede
      vergoeding van reis- en verblijfkosten en van verdere verschotten, volgens door Onze Minister en Onze Minister van
      Justitie te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel35
  - number: '36'
    text: |-
      Het tuchtcollege loodsen houdt zitting in de samenstelling als genoemd in [artikel 29, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: I
        hoofdstuk: VII
        paragraaf: '2'
  - number: '37'
    text: |-
      1 Een zaak betreffende een onderwerp als bedoeld in [artikel 28, eerste lid][ref1], wordt bij het tuchtcollege
      loodsen aanhangig gemaakt door een schriftelijke klacht van de algemene raad, het bestuur van een regionale
      corporatie of van degene die rechtstreeks in zijn belang is getroffen.

      2 Zodra een klacht is ingekomen stelt de voorzitter een voorlopig onderzoek in. De organen van de corporatie of een
      regionale corporatie verlenen daarbij desgevraagd medewerking.

      3 Blijkt dat de klacht is ingediend door iemand die daartoe niet ingevolge het eerste lid bevoegd is, dan verklaart
      de voorzitter van het tuchtcollege loodsen de klager zonder nader onderzoek bij met reden omklede beslissing
      schriftelijk niet ontvankelijk. Blijkt dat de klacht kennelijk ongegrond is in die zin, dat de feiten waarop
      zij berust niet tot toepassing van [artikel 28, eerste lid][ref2], kunnen leiden, dan kan de voorzitter van het
      tuchtcollege loodsen zonder verder onderzoek de klacht bij met reden omklede beslissing schriftelijk afwijzen.
      Blijkt dat het tuchtcollege loodsen onbevoegd is, dan wijst de voorzitter van het tuchtcollege loodsen de klacht
      bij met reden omklede beslissing schriftelijk af.

      4 Intrekken van de klacht, nadat deze is ingekomen, of staking van de werkzaamheden door de persoon over wie
      geklaagd is, heeft op de verdere behandeling geen invloed, wanneer naar het oordeel van het tuchtcollege loodsen
      het algemeen belang dat vermoedelijk is geschonden vordert dat de behandeling wordt voortgezet of wanneer degene
      over wie geklaagd is, schriftelijk heeft verklaard voortzetting van de behandeling van de klacht te verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel37
