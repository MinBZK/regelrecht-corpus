  - number: 27c
    text: |-
      1 De algemene raad doet de Autoriteit Consument en Markt een voorstel voor de tarieven en vergoedingen voor de
      diensten en taken, bedoeld in [artikel 27a][ref1].

      2 Een voorstel als bedoeld in het eerste lid wordt opgesteld met inachtneming van het uitgangspunt dat elk
      afzonderlijk tarief redelijk en non-discriminatoir is.

      3 Een voorstel als bedoeld in het eerste lid met betrekking tot de loodsgeldtarieven wordt opgesteld met
      inachtneming van de volgende uitgangspunten:

      a. de loodsgeldtarieven zijn voor het geheel kostengeoriënteerd, en,

      b. bij een voorstel voor gedifferentieerde aanpassing van de tarieven per zeehavengebied wordt een bijdrage
      geleverd aan een meer kostengeoriënteerd tarief per individueel schip.

      4 Voorafgaand aan de indiening van een voorstel als bedoeld in het eerste lid met betrekking tot de
      loodsgeldtarieven vraagt de algemene raad een zienswijze aan een bij ministeriële regeling te bepalen aantal
      regionale overlegcommissies, bestaande uit het bestuur van de desbetreffende regionale loodsencorporatie,
      vertegenwoordigers van openbare lichamen, betrokken bij het bestuur van een of meer zeehavens en representatieve
      organisaties van ondernemers in het scheepvaart- en havenbedrijf. De ontvangen zienswijzen worden bij het voorstel
      gevoegd. De algemene raad motiveert in het voorstel zijn overwegingen omtrent de ingebrachte zienswijzen.

      5 Een voorstel met betrekking tot de loodsgeldtarieven wordt jaarlijks ingediend, is mede gebaseerd op de
      financiële verantwoording van het aan de indiening voorafgaande kalenderjaar en heeft betrekking op het volgende
      kalenderjaar.

      6 Een voorstel met betrekking tot de loodsgeldtarieven bevat ten minste:

      a. een raming van alle in het desbetreffende kalenderjaar te leveren loodsverrichtingen per tarief en het
      voorgenomen kwaliteitsniveau;

      b. een raming van de met de loodsverrichtingen, bedoeld onder a, te behalen omzet, die mede is gebaseerd op de
      daadwerkelijk gerealiseerde omzet in het kalenderjaar voorafgaande aan het kalenderjaar waarin het voorstel wordt
      gedaan;

      c. een raming van de arbeidsvergoeding die is gebaseerd op de daadwerkelijk ontvangen vergoeding in het
      kalenderjaar voorafgaande aan het kalenderjaar waarin het voorstel wordt gedaan;

      d. een raming van de wijzigingen in de kosten van de materiële vaste activa, de geraamde investeringen en het
      geraamde rendement;

      e. een raming van de overige omzet en kosten, die mede is gebaseerd op de daadwerkelijk gerealiseerde omzet en
      kosten in het kalenderjaar voorafgaande aan het kalenderjaar waarin het voorstel wordt gedaan;

      f. een raming van de kosten, de stortingen en het rendement van de gestorte bedragen, gemoeid met de
      verplichtingen, bedoeld in [artikel 26, tweede lid, onder a][ref2], voor het desbetreffende kalenderjaar;

      g. een raming van de voor het desbetreffende kalenderjaar voorziene algemene besparing op de kosten;

      h. de voor het desbetreffende kalenderjaar voorziene correctie in verband met bestaande onregelmatigheden in de
      mate van kostendekkendheid van de tarieven voor de verschillende zeehavengebieden;

      i. een verrekening van het verschil tussen de geraamde en de daadwerkelijk uitgevoerde wijzigingen in de materiële
      activa en investeringen in het kalenderjaar voorafgaande aan het jaar waarin het voorstel wordt gedaan;

      j. een onderbouwing van de ramingen, bedoeld onder a tot en met g.

      7 Een voorstel als bedoeld in het eerste lid met betrekking tot andere tarieven dan de loodsgeldtarieven is voor
      elk afzonderlijk tarief kostengeoriënteerd. Een voorstel bevat een onderbouwde raming van de kosten en omzet voor
      elke afzonderlijke dienst of taak.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
