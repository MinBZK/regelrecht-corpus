  - number: '5'
    text: |-
      1 Onverminderd het in [artikel 4][ref1] bepaalde kunnen bij of krachtens algemene maatregel van bestuur eisen
      worden gesteld met betrekking tot de vakbekwaamheid en geschiktheid voor het loodsen van schepen op bij algemene
      maatregel van bestuur aan te wijzen wateren.

      2 Degene die heeft aangetoond, te voldoen aan de eisen als bedoeld in het eerste lid, ontvangt daarvan een
      verklaring volgens een door Onze Minister vast te stellen model. Bij of krachtens de in het eerste lid bedoelde
      algemene maatregel van bestuur wordt bepaald in welke gevallen de verklaring kan worden ingetrokken.

      3 Voor de afgifte van een verklaring als bedoeld in het tweede lid en de deelname aan de daarvoor vereiste examens
      is een vergoeding verschuldigd volgens een door Onze Minister vast te stellen tarief.

      4 Ter uitvoering van de in het eerste lid bedoelde eisen worden persoonsgegevens verwerkt betreffende de
      gezondheid. De verwerking van deze gegevens strekt ertoe te kunnen beoordelen of de geschiktheid voor het loodsen
      van schepen aanwezig is of niet meer aanwezig is. Onze Minister, onderscheidenlijk de bij of krachtens algemene
      maatregel van bestuur in te stellen examencommissies, zijn verantwoordelijke voor deze verwerkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel5
