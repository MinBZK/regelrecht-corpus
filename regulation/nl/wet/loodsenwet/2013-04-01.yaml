  - number: 45e
    text: |-
      1 Indien door Onze Minister vast te stellen beleidsregels betrekking hebben op de interpretatie van
      mededingingsbegrippen stelt Onze Minister die beleidsregels vast in overeenstemming met Onze Minister van
      Economische Zaken.

      2 Onze Minister verstrekt de Autoriteit Consument en Markt de nodige inlichtingen en gegevens die de raad behoeft
      in verband met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel45e
  - number: 45f
    text: |-
      1 In geval van overtreding van het bepaalde bij of krachtens de [artikelen 27c][ref1], [27i][ref2], [27j][ref3],
      [27k][ref4] en [27l, eerste lid][ref5], en [45c, tweede lid][ref6], kan de Autoriteit Consument en Markt de
      overtreder:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      2 De in het eerste lid, onder a, bedoelde boete bedraagt ten hoogste € 450.000,=, of, indien dit meer is, 10%
      van de gezamenlijke omzet van de organisaties, aangewezen krachtens de [artikelen 15a, tweede lid][ref7], en
      [15b, eerste lid, van de Scheepvaartverkeerswet][ref8], in het boekjaar voorafgaande aan de beschikking. Indien
      op grond van [artikel 5.0.1, derde lid, van de Algemene wet bestuursrecht toepassing][ref9] is gegeven aan
      [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref10], bedraagt de bestuurlijke boete ten
      hoogste € 450.000,=.

      3 Bij de toepassing van de bevoegdheden, bedoeld in het eerste lid, zijn de [artikelen 56][ref11],
      [57, tweede lid][ref12], [58 tot en met 63][ref13], [65 tot en met 68 van de Mededingingswet][ref14] van
      overeenkomstige toepassing.


