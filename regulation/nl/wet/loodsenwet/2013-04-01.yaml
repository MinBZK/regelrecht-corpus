      1 Er is een tuchtcollege loodsen dat is gevestigd te 's-Gravenhage.

      2 Het tuchtcollege loodsen is belast met de behandeling van zaken als bedoeld in [artikel 28][ref1].

      3 Het tuchtcollege loodsen bestaat uit een voorzitter en vier registerloodsen.

      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van onderdeel a gelijk worden gesteld
      aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
