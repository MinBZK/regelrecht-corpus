  - number: '19'
    text: |-
      1 Adspirant-registerloods is degene:

      a. die voldoet aan de bij of krachtens algemene maatregel van bestuur te stellen eisen ten aanzien van leeftijd,
      opleiding, ervaring en lichamelijke en geestelijke geschiktheid; en

      b. met wie een leerovereenkomst als adspirant-registerloods is aangegaan door een regionale corporatie.

      2 De inhoud van de leerovereenkomst, bedoeld in het eerste lid, onderdeel *b*, wordt vastgesteld bij verordening.

      3 Ter uitvoering van de in het eerste lid, onderdeel a, bedoelde eisen worden persoonsgegevens verwerkt betreffende
      de gezondheid. De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of wordt voldaan aan
      de vereisten van lichamelijke en geestelijke geschiktheid, nodig voor het aangaan van een leerovereenkomst. De
      regionale loodsencorporatie die de leerovereenkomst aangaat is verantwoordelijke voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel19
  - number: '20'
    text: |-
      1 Na afloop van de algemene opleiding tot registerloods als bedoeld in [artikel 9, eerste lid, onderdeel ][ref1],
      en na afloop van de lokale opleiding en stage als bedoeld in [artikel 13, eerste lid, onderdeel ][ref2], vindt een
      examen plaats.

      2 De inhoud van de examens, het toezicht daarop door gecommitteerden die daartoe door Onze Minister zijn aangewezen
      en al het overige betreffende de examens wordt vastgesteld bij of krachtens algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
