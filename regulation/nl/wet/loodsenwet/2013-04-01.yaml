  - number: '17'
    text: |-
      1 De verordeningen zijn slechts verbindend voor de leden, de corporatie, de algemene raad, de regionale corporaties
      en hun besturen.

      2 Bepalingen gesteld bij of krachtens een verordening die strijdig zijn met het bepaalde bij of krachtens de wet
      zijn onverbindend.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel17
  - number: '18'
    text: |-
      1 Besluiten van de algemene raad of van de ledenvergadering van de corporatie kunnen op de voordracht van Onze
      Minister bij koninklijk besluit worden vernietigd.

      2 Ingeval van vernietiging geschiedt deze binnen zes maanden na de in [artikel 16, vierde lid][ref1], bedoelde ter
      kennis brenging of, wanneer het een ander besluit betreft, binnen zes maanden nadat het besluit ter kennis van Onze
      Minister is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel18
