  - number: '38'
    text: |-
      1 Zij die deel uitmaken van het tuchtcollege loodsen kunnen zich verschonen en kunnen worden gewraakt, indien te
      hunnen aanzien feiten of omstandigheden bestaan, waardoor in het algemeen de rechterlijke onpartijdigheid schade
      zou kunnen lijden.

      2 Over wraking of verschoning wordt ten spoedigste beslist door hen die deel uitmaken van het tuchtcollege loodsen,
      met uitzondering van degene die wordt gewraakt of die verlangt zich te verschonen. Bij staking van stemmen wordt de
      wraking onderscheidenlijk de verschoning toegewezen.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel38
  - number: '39'
    text: |-
      1 De behandeling van een zaak, betreffende een onderwerp als bedoeld in [artikel 28, eerste lid][ref1], door het
      tuchtcollege loodsen geschiedt in een openbare zitting, tenzij het tuchtcollege loodsen om gewichtige redenen
      beveelt dat de behandeling van de zaak geheel of gedeeltelijk met gesloten deuren zal plaatsvinden. Het bevel
      daartoe houdt de overwegingen in waarop het steunt.

      2 De voorzitter is belast met de handhaving van de orde ter zitting en kan daartoe de nodige maatregelen treffen.

      3 De beslissing in een door het tuchtcollege loodsen behandelde zaak wordt door de voorzitter in het openbaar
      uitgesproken in tegenwoordigheid van de secretaris.

      4 Van tijd en plaats van een openbare zitting of van een openbare uitspraak wordt ten minste twee weken en ten
      hoogste vier weken tevoren in de *Staatscourant* mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: I
        hoofdstuk: VII
        paragraaf: '1'
  - number: '40'
    text: |-
      1 Behoudens in de gevallen, als bedoeld in [artikel 37, derde lid][ref1], neemt het tuchtcollege loodsen geen
      beslissing aangaande een ingediende klacht dan na verhoor, althans behoorlijke oproeping van de persoon over wie
      geklaagd is en van de klager.

      2 De persoon over wie geklaagd is kan, tenzij het tuchtcollege loodsen beveelt dat hij in persoon zal verschijnen,
      zich ter terechtzitting doen vertegenwoordigen door een advocaat of een daartoe schriftelijk gemachtigd persoon.
      Hij kan zich door een raadsman doen bijstaan.

      3 Het tuchtcollege loodsen kan weigeren bepaalde personen die geen advocaat zijn, als gemachtigde of als raadsman
      toe te laten. Bij zodanige weigering houdt het tuchtcollege loodsen de zaak tot een volgende zitting aan.

      4 De persoon over wie geklaagd is en zijn raadsman worden in de gelegenheid gesteld ten minste veertien dagen voor
      de aanvang van het onderzoek op de terechtzitting van de processtukken kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: I
        hoofdstuk: VII
        paragraaf: '3'
  - number: '41'
    text: |-
      1 Het tuchtcollege loodsen kan, hetzij op verzoek van de persoon over wie geklaagd is, hetzij op verzoek van de
      klager, hetzij ambtshalve, getuigen en deskundigen oproepen en horen. De oproeping geschiedt bij aangetekende
      brief. Ieder die als getuige of deskundige is opgeroepen, is verplicht aan de oproeping gevolg te geven.

      2 Verschijnt een getuige of een deskundige op de oproeping niet, dan doet de officier van justitie bij het
      arrondissementsparket Den Haag op verzoek van het tuchtcollege loodsen hem dagvaarden.

      3 Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier, bedoeld in het vorige lid, op
      verzoek van het tuchtcollege loodsen hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.

      4 [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      5 De getuigen leggen in handen van de voorzitter van het tuchtcollege loodsen de eed of belofte af dat zij de
      gehele waarheid en niets dan de waarheid zullen zeggen. De getuigen zijn verplicht getuigenis af te leggen, de
      deskundigen hun diensten als zodanig te verlenen.

      6 Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      7 De getuigen en deskundigen ontvangen desgevraagd op vertoon van hun oproeping of dagvaarding schadeloosstelling
      overeenkomstig het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref3] (*Stb.* 1963, 130).


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel41
