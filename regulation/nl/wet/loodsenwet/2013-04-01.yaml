  - number: '14'
    text: |-
      1 De voorzitter van de corporatie of van een regionale corporatie, roept een vergadering bijeen zo vaak hij zulks
      nodig acht of indien zulks schriftelijk, onder opgave van de te behandelen onderwerpen, wordt verzocht:

      a. voor de ledenvergadering van de corporatie: door de ledenvergadering van ten minste een regionale corporatie;

      b. voor een ledenvergadering van een regionale corporatie: door ten minste tien procent van de leden;

      c. voor de algemene raad en voor het bestuur van een regionale corporatie: door ten minste twee leden.

      2 De ledenvergaderingen van de corporatie zijn openbaar voor zover daarin ontwerpen van verordeningen aan de orde
      zijn. Hiervan wordt door de algemene raad op bij algemene maatregel van bestuur te bepalen wijze mededeling gedaan.

      3 De ledenvergadering van een regionale corporatie voorziet bij reglement in het doeltreffend verloop van de
      ledenvergaderingen.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel14
  - number: '15'
    text: |-
      1 De ledenvergadering van de corporatie stelt de verordeningen, bedoeld in de [artikelen 4, eerste lid][ref1],
      [19, tweede lid][ref2], en [26, eerste lid][ref3], vast, alsmede andere verordeningen, waaronder die in het belang
      van:

      a. een goede beroepsuitoefening;

      b. een doelmatige dienstverlening, waarbij ten minste dient te worden voorzien in:

      1°. de verplichting van de registerloods zijn diensten tijdig en op non-discriminatoire wijze aan te bieden en te
      verlenen aan schepen als bedoeld in [artikel 4, tweede lid][ref4]; en

      2°. de verplichting van de registerloodsen om in onderling verband zorg te dragen voor het vervoer ten behoeve van
      hun beroepsuitoefening en de verdere organisatie van de dienstverlening;

      c. sociale voorzieningen voor registerloodsen en voor nabestaanden van overleden registerloodsen; en

      d. een doeltreffend verloop van de ledenvergaderingen van de corporatie.

      2 In een verordening kan aan de algemene raad of aan het bestuur van een regionale corporatie de bevoegdheid worden
      verleend tot het geven van nadere voorschriften omtrent bij die verordening geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
