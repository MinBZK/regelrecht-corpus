      1 De Autoriteit Consument en Markt stelt bij besluit een schema vast voor de stortingen ten behoeve van de
      financiering van de verplichtingen, bedoeld in [artikel 26, tweede lid, onder a][ref1].

      2 De Autoriteit Consument en Markt kan bij besluit een bij de vaststelling van de loodsgeldtarieven in acht te
      nemen correctiefactor vaststellen in verband met de evenwichtige wijze van financiering van de verplichtingen,
      bedoeld in [artikel 26, tweede lid, onder a][ref2]. Voorafgaand aan het nemen van het besluit wint de Autoriteit
      Consument en Markt het advies in van een actuaris.

      3 Besluiten als bedoeld in het eerste en tweede lid worden bekendgemaakt door plaatsing in de Staatscourant.


