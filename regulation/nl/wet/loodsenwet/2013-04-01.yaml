  - number: '42'
    text: |-
      1 De beslissing van het tuchtcollege loodsen aangaande een ingediende klacht houdt de overweging in waarop zij
      steunt en wordt op schrift gesteld.

      2 De secretaris van het tuchtcollege loodsen zendt van de beslissing van het tuchtcollege loodsen onverwijld bij
      aangetekende brief afschrift:

      a. aan de persoon over wie geklaagd is;

      b. aan de klager;

      c. aan de algemene raad.

      3 De secretaris van het tuchtcollege loodsen zendt van een beslissing van de voorzitter onverwijld bij aangetekende
      brief afschrift aan de klager.

      4 De secretaris van het tuchtcollege loodsen verstrekt desgevraagd aan de gerechten en het openbaar ministerie
      inlichtingen omtrent onherroepelijke beslissingen.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel42
  - number: '43'
    text: |-
      Beslissingen van het tuchtcollege loodsen, genomen met een ander aantal personen of in een andere samenstelling dan
      is voorgeschreven, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel43
  - number: '44'
    text: |-
      De [artikelen 1, onderdeel b][ref1], [3][ref2], [4, eerste lid][ref3], [5][ref4], [31 tot en met 43][ref5] en
      [44 eerste lid, van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref6] zijn van overeenkomstige toepassing,
      met dien verstande dat:

      a. van [artikel 4, eerste lid][ref7], slechts de minimumboete van overeenkomstige toepassing is;

      b. onder «de voorzitter van het bedrijfslichaam» in die artikelen telkens moet worden verstaan: de algemene raad of
      het bestuur van een regionale corporatie.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel1
