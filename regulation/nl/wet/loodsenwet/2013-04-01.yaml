    text: |-
      Voorzover op grond van de [artikelen 45f, derde lid][ref1], [45g, vierde lid][ref2], [45h, derde lid][ref3],
      en [45i, vierde lid][ref4], overeenkomstige toepassing van de [Mededingingswet][ref5] plaatsvindt, wordt onder
      onderneming of ondernemersvereniging in de desbetreffende bepalingen mede verstaan:

      a. de organen, genoemd in [artikel 6, tweede lid][ref6], en [10, vijfde lid][ref7];

      b. samenwerkingsverbanden van registerloodsen die zijn of worden opgericht ter uitvoering van het bepaalde
      krachtens [artikel 15, eerste lid, onder b][ref8];

      c. de krachtens de [artikelen 15a, tweede lid][ref9], en [15b, eerste lid, van de Scheepvaartverkeerswet][ref10]
      aangewezen organisaties, en,

      d. registerloodsen.


