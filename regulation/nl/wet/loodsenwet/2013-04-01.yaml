  - number: 27j
    text: |-
      1 De algemene raad stelt jaarlijks voor 1 mei een financiële verantwoording op over het voorafgaande kalenderjaar
      die bestaat uit:

      a. een exploitatierekening van de diensten en taken, bedoeld in [artikel 27a][ref1], met inbegrip van een
      verantwoording van de omzet;

      b. een overzicht van de aan de exploitatie van die diensten en taken toegerekende materiële vaste activa;

      c. een verantwoording van de gehanteerde afschrijvingsmethoden en afschrijvingstermijnen;

      d. een verantwoording van de uitgaven, bedoeld in [artikel 26, tweede lid, onder a][ref2];

      e. een verantwoording van de stortingen die zijn gedaan ten behoeve van toekomstige uitgaven, bedoeld in
      [artikel 26, tweede lid, onder a][ref3];

      f. een verantwoording van de algemene besparing, bedoeld in [artikel 27c, zesde lid, onder g][ref4];

      g. een toelichting op de stukken, bedoeld onder a tot en met f;

      h. een verklaring van een onafhankelijke accountant als bedoeld in
      [artikel 393 van boek 2 van het Burgerlijk Wetboek][ref5].

      2 De algemene raad draagt jaarlijks voor 1 mei zorg voor een verantwoording over het gerealiseerde kwaliteitsniveau
      van de diensten en taken, bedoeld in [artikel 27a][ref6], over het voorafgaande kalenderjaar. Voorafgaand aan de
      vaststelling van de verantwoording vraagt de algemene raad een zienswijze van de bij ministeriële regeling aan
      te wijzen openbare lichamen, betrokken bij het bestuur van een of meer zeehavens, bestuursorganen belast met het
      nautisch beheer van een of meer zeehavens en representatieve organisaties van ondernemers in het scheepvaart-
      en havenbedrijf. De ontvangen zienswijzen worden bij de verantwoording gevoegd. De algemene raad motiveert in de
      verantwoording zijn overwegingen omtrent de ingebrachte zienswijzen.

      3 De algemene raad zendt de verantwoordingen, bedoeld in het eerste en tweede lid, vergezeld van de ontvangen
      zienswijzen, gelijktijdig aan de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
