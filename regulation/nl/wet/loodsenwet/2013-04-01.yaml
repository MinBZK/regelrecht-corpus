    text: |-
      1 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van het bepaalde bij of krachtens [artikel 9, eerste lid, onder a, 1°][ref1],
      [artikel 13, eerste lid, onder a, 1° en 2°, en onder b][ref2], [artikel 15, eerste lid, onder b, 2°][ref3],
      [artikel 21, vijfde lid][ref4], en [artikel 26][ref5]. Van het besluit wordt mededeling gedaan aan de corporatie
      onderscheidenlijk de regionale corporatie.

      2 De Autoriteit Consument en Markt is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het
      bepaalde bij of krachtens de [artikelen 27b, eerste en zesde lid][ref6], en [27l, eerste lid, onder a en b][ref7].
      Van het besluit wordt mededeling gedaan aan de corporatie.

      3 Van de krachtens het eerste of tweede lid genomen maatregelen wordt binnen tweemaal vierentwintig uur een
      schriftelijk verslag opgemaakt dat onverwijld in afschrift wordt gezonden aan de belanghebbenden alsmede aan de
      algemene raad onderscheidenlijk het bestuur van de regionale corporatie.


