      1 De inschrijving in het register wordt geweigerd, indien:

      a. de aanvrager niet de bewijsstukken van het voldoen aan [artikel 22, eerste lid][ref1], binnen dertien weken
      nadat het laatste bewijsstuk is uitgegeven, heeft overgelegd of, na het verstrijken van deze termijn, niet tevens
      een aanvullende verklaring van toelating, afgegeven door het bestuur van de betreffende regionale corporatie, heeft
      overgelegd; of

      b. ten aanzien van de aanvrager ingevolge [artikel 28, eerste lid][ref2], of [artikel 48][ref3], de bevoegdheid als
      registerloods is geschorst of vervallen verklaard.

      2 De algemene raad doet van een beschikking tot weigering van de inschrijving in het register mededeling door
      toezending van een afschrift daarvan aan het bestuur van de regionale corporatie.


