  - number: '67'
    text: |-
      1 Onze Minister kan verordeningen als bedoeld in [artikel 15, eerste lid][ref1], voor de eerste maal als
      ministeriële regeling vaststellen, voor zover deze, naar het oordeel van Onze Minister, op de overgangsdatum,
      bedoeld in [artikel 62, onderdeel ][ref2], in werking dienen te treden. Zij blijven, behoudens eerdere intrekking
      door Onze Minister, van kracht totdat zij bij verordening zijn ingetrokken en vervangen.

      2 Onze Minister benoemt, in overeenstemming met de meerderheid van de personen als bedoeld in
      [artikel 63, eerste lid][ref3], voor de eerste maal de voorzitter van de corporatie. Dit geldt overeenkomstig
      voor het bestuur van een regionale corporatie. Deze benoemingen gelden voor ten hoogste negentig dagen. Binnen
      die termijn geven de ledenvergadering van de corporatie onderscheidenlijk de ledenvergadering van een regionale
      corporatie uitvoering aan [artikel 8, tweede lid][ref4], onderscheidenlijk [artikel 12, derde lid][ref5].

      3 Overdracht van de eigendom van de roerende en onroerende goederen van het Rijk die worden gebruikt ten behoeve
      van de uitoefening van de loodsdienst, vindt van rechtswege plaats. Onze Minister en Onze Minister van Financiën
      wijzen deze goederen aan.

      4 Onze Minister bepaalt in overeenstemming met de corporatie:

      a. de organisaties aan wie de goederen worden overgedragen; en

      b. de datum waarop de overdracht plaatsvindt.

      5 Onze Minister en Onze Minister van Financiën bepalen in overeenstemming met de organisaties, bedoeld in het
      vierde lid, onderdeel *a,* de waarde van de aangewezen goederen.


