      1 Bij veroordeling wegens een overtreding genoemd in [artikel 47, eerste lid][ref1], kan het vonnis tevens
      inhouden:

      a. schorsing of beperking van de bevoegdheid als registerloods onderscheidenlijk schorsing of beperking van de
      krachtens [artikel 5][ref2] verkregen bevoegdheid, voor de duur van ten hoogste een jaar;

      b. verval of beperking van de bevoegdheid als registerloods onderscheidenlijk verval of beperking van de krachtens
      [artikel 5][ref3] verkregen bevoegdheid.

      2 Het in het eerste lid gestelde geldt ook bij veroordeling van de loods wegens een overtreding, genoemd in de
      [Scheepvaartverkeerswet][ref4], indien de loods die overtreding heeft begaan bij de uitoefening van zijn beroep.


