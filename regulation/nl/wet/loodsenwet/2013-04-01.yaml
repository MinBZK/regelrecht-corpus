  - number: '66'
    text: |-
      1 Indien de vaststelling van het bedrag, bedoeld in [artikel 65, derde lid][ref1], niet plaatsvindt in
      overeenstemming met de krachtens het eerste lid van dat artikel aangewezen pensioenfondsen, kunnen bij algemene
      maatregel van bestuur regels worden gesteld betreffende het ondervangen van nadeel in de opbouw van pensioen, dat
      voor personen als bedoeld in [artikel 63][ref2], mogelijkerwijs ontstaat als gevolg van het in [artikel 64][ref3]
      bedoelde ontslag.

      2 Degene bij wie het pensioen van een persoon als bedoeld in [artikel 63][ref4], is verzekerd, alsmede de
      rechtspersoon als bedoeld in [artikel 63, derde lid][ref5], zijn verplicht desgevraagd aan Onze Minister binnen
      een door deze te stellen termijn de gegevens te verschaffen waarvan kennisneming naar het oordeel van Onze Minister
      nodig is in verband met het voorbereiden of uitvoeren van de algemene maatregel van bestuur, bedoeld in het eerste
      lid.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vergoeding van kosten, verbonden aan
      het verschaffen van gegevens als bedoeld in het tweede lid.


