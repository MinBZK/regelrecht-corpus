      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van hoofdstuk VIA,
      zijn belast de ambtenaren aangewezen bij het besluit, bedoeld in [artikel 49, eerste lid][ref1], alsmede de bij
      besluit van Onze Minister aangewezen andere ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


