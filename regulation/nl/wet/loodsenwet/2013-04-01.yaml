  - number: '24'
    text: |-
      1 De inschrijving in het register wordt doorgehaald:

      a. bij overlijden van de ingeschrevene;

      b. op schriftelijk verzoek van de ingeschrevene;

      c. indien ten aanzien van de ingeschrevene verval van de bevoegdheid, bedoeld in
      [artikel 28, eerste lid, onderdeel ][ref1] of [artikel 48, eerste lid, onderdeel ][ref2], voor tenuitvoerlegging
      vatbaar is geworden;

      d. bij het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], of van een bij verordening vastgestelde lagere
      leeftijd;

      e. indien de ingeschrevene niet beschikt over geldige geneeskundige verklaringen volgens de bij of krachtens
      algemene maatregel van bestuur te geven regels;

      f. indien de ingeschrevene gedurende een termijn van vierentwintig maanden niet ten minste een bij of krachtens
      algemene maatregel van bestuur vast te stellen aantal malen zijn beroep feitelijk heeft uitgeoefend of die
      uitoefening niet volgens de bij of krachtens die maatregel te geven regels heeft aangetoond;

      g. gedurende de termijn waarvoor de bevoegdheid ingevolge rechterlijke uitspraak of als maatregel is geschorst; of

      h. indien de reden voor weigering van de inschrijving eerst na de inschrijving is gebleken.

      2 Bij doorhaling is [artikel 23, tweede lid][ref4], van overeenkomstige toepassing.

      3 Doorhaling van de inschrijving brengt mee verlies van de betrekkingen waarbij de hoedanigheid van lid van
      de corporatie of van de regionale corporatie, ingevolge het bij of krachtens deze wet bepaalde, vereiste voor
      benoembaarheid of verkiesbaarheid is.

      4 Van de bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, onderdeel *f*, vastgestelde
      regels kan Onze Minister, in de bij die maatregel aan te geven gevallen, ontheffing verlenen. Ontheffingen kunnen
      onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      5 Bij een doorhaling krachtens het gestelde in het eerste lid, onderdeel *g*, eindigt de doorhaling van rechtswege
      na het verstrijken van de in dat onderdeel bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
