  - number: '63'
    text: |-
      1 Op hun verzoek worden in het register ingeschreven degenen die, zonder te voldoen aan het bepaalde krachtens
      [artikel 22, eerste lid][ref1], op de dag voorafgaande aan de overgangsdatum:

      a. hetzij loods zijn als bedoeld in artikel 3 van de Loodswet 1957;

      b. hetzij gemeentelijke havenloods zijn als bedoeld in artikel 2, derde lid, van de Loodswet 1957.

      2 Op hun verzoek worden degenen die op de dag voorafgaande aan de overgangsdatum adspirant-loods zijn als bedoeld
      in artikel 6 van het Algemeen Loodsreglement (*Stb.* 1932, 433), of als zodanig zijn aangesteld, aangemerkt als
      adspirant-loods als bedoeld in [artikel 19, eerste lid][ref2]. Zij hebben het recht op een leerovereenkomst als
      bedoeld in [artikel 19, eerste lid, onderdeel ][ref3], met een bij of krachtens algemene maatregel van bestuur aan
      te wijzen regionale corporatie, ingaande op de overgangsdatum.

      3 Degenen die op de dag voorafgaande aan de overgangsdatum behoren tot het personeel van de loodsdienst als bedoeld
      in artikel 4 van het Algemeen Loodsreglement, en op wie het eerste of tweede lid niet van toepassing is, hebben
      het recht om in dienst te treden bij een door Onze Minister aan te wijzen rechtspersoon op een arbeidsovereenkomst
      naar burgerlijk recht, ingaande op de overgangsdatum. Dit geldt eveneens voor het personeel in dienst van het
      Ministerie van Verkeer en Waterstaat onderscheidenlijk van een gemeente die een functie vervullen ten behoeve
      van de uitoefening van de loodsdienst en waarvan de functie als zodanig is aangewezen door Onze Minister. Voor
      het personeel in dienst van een gemeente vindt die aanwijzing plaats in overeenstemming met het bestuur van die
      gemeente. Aanwijzing van de rechtspersoon vindt plaats in overeenstemming met het bestuur van die rechtspersoon.

      4 De arbeidsovereenkomst als bedoeld in het derde lid, geldt voor onbepaalde tijd indien het personeelslid was
      aangesteld in vaste dienst of voor onbepaalde tijd in tijdelijke dienst, dan wel werkzaam was voor onbepaalde
      tijd op arbeidsovereenkomst. Indien het personeelslid was aangesteld of werkzaam was op arbeidsovereenkomst
      voor een bepaalde tijd, geldt de arbeidsovereenkomst voor de niet verstreken tijd van de tijdelijke dienst of de
      arbeidsovereenkomst.

      5 De arbeidsovereenkomst betreft een funktie welke overeenkomt met de funktie welke het personeelslid laatstelijk
      vervulde in dienst van het Ministerie van Verkeer en Waterstaat onderscheidenlijk in dienst van de gemeente,
      behoudens ten aanzien van de door Onze Minister nader te bepalen funkties.

      6 De voorwaarden van de arbeidsovereenkomst zullen in het geheel ten minste overeenkomen met die welke voor
      het personeelslid golden uit hoofde van zijn dienstbetrekking bij het Ministerie van Verkeer en Waterstaat. Dit
      geldt op overeenkomstige wijze voor het personeel van de gemeente. Onze Minister kan, in overeenstemming met Onze
      Minister van Binnenlandse Zaken, ter zake nadere regels vaststellen.

      7 De krachtens het derde lid aangewezen rechtspersoon is gehouden de arbeidsovereenkomst aan te gaan zonder nadere
      selectie of keuring.

      8 Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken, ter uitvoering van het eerste,
      tweede en derde lid, nadere regels vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
