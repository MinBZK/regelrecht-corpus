      1 Bij verordening worden regels vastgesteld ten aanzien van de bedragen, de verschuldigdheid daarvan, de maatstaven
      voor de vaststelling, alsmede de betaling met betrekking tot:

      a. de diensten van registerloodsen;

      b. de door de algemene raad en de besturen van de regionale corporaties krachtens deze wet te verzorgen taken;

      c. de taken ten behoeve van de door de registerloodsen te verlenen diensten.

      2 De regels, vastgesteld bij de verordening, bedoeld in het eerste lid, houden rekening met de totale te verwachten
      opbrengst uit loodsgelden en voorzien in ieder geval in:

      a. een waarborg en een fonds of andere voorziening waarin stortingen worden gedaan voor het kunnen voldoen aan
      verplichtingen die voortvloeien uit het functioneel leeftijdspensioen van registerloodsen en uit het krachtens
      collectieve arbeidsovereenkomst toegekend recht op functioneel leeftijdsontslag van het personeel, belast met de
      uitvoering van de in het eerste lid, onderdeel c, bedoelde taken;

      b. een evenredigheid voor de maatstaven met betrekking tot de bedragen voor de diensten van registerloodsen en de
      verschillende regio's;

      c. een waarborg voor het kunnen verzorgen van de taken van de algemene raad en de besturen van de regionale
      corporaties.

      3 In afwijking van [artikel 15, eerste lid][ref1], wordt de verordening, bedoeld in het eerste lid, voor de eerste
      keer vastgesteld door de algemene raad.

      4 [Artikel 16, eerste, tweede en derde lid][ref2], is op de vaststelling, bedoeld in het derde lid, niet van
      toepassing.

      5 Onder functioneel leeftijdspensioen, bedoeld in het tweede lid, onderdeel a, wordt verstaan de vergoeding op
      grond van het doorhalen van de inschrijving in het register ten gevolge van het bereiken van de bij of krachtens
      [artikel 24, eerste lid, onderdeel d][ref3], vastgestelde leeftijd, alsmede bij het bereiken van die leeftijd na
      een voorafgegane doorhaling krachtens [artikel 24, eerste lid, onderdeel e][ref4].


