      1 Met ingang van de overgangsdatum verkrijgen de in [artikel 64][ref1] bedoelde personen aanspraken
      jegens een bij verordening aan te wijzen pensioenfonds onderscheidenlijk een door het bestuur van
      de rechtspersoon als bedoeld in [artikel 63, derde lid][ref2], aan te wijzen fonds als bedoeld in
      [artikel 1 van de Pensioen- en Spaarfondsenwet][ref3] (*Stb.* 1981, 18), welke gelijkwaardig zijn aan die welke
      deze personen op de overgangsdatum krachtens de [Algemene burgerlijke pensioenwet](onbekend) (*Stb.* 1986, 540)
      hebben jegens het Algemeen burgerlijk pensioenfonds, en neemt het hiervoor bedoelde fonds de daarmee verband
      houdende verplichtingen op zich.

      2 Bij toepassing van het eerste lid vervallen de aanspraken van de in dat lid bedoelde personen krachtens
      de Algemene burgerlijke pensioenwet en de daaruit voortvloeiende verplichtingen van het Algemeen burgerlijk
      pensioenfonds jegens die personen op de overgangsdatum.

      3 Bij toepassing van het eerste lid draagt de directie van het Algemeen burgerlijk pensioenfonds op de
      overgangsdatum aan het in dat lid bedoelde fonds een bedrag aan middelen over waarvan Onze Ministers van Verkeer en
      Waterstaat, van Financiën en van Binnenlandse Zaken gezamenlijk, de directie van het fonds en de Commissie bedoeld
      in [artikel L16 van de Algemene burgerlijke pensioenwet](onbekend), gehoord, de hoogte bepalen aan de hand van de
      rechten die krachtens de [Algemene burgerlijke pensioenwet](onbekend) bij het fonds zijn opgebouwd ten behoeve van
      de in het eerste lid bedoelde personen.

      4 Onze Minister en Onze Minister van Financiën geven in overeenstemming met Onze Minister van Binnenlandse Zaken
      regels met betrekking tot de uitvoering van het bepaalde in de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelIII
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelIII
