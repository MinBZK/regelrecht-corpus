  - number: 45h
    text: |-
      1 De Autoriteit Consument en Markt kan degene die een verzegeling als bedoeld in
      [artikel 54 van de Mededingingswet][ref1] verbreekt, opheft of beschadigt, of de door de verzegeling
      bedoelde afsluiting op andere wijze verijdelt, een bestuurlijke boete opleggen van ten hoogste € 450.000,=
      of, indien dit meer is, 1% van de gezamenlijke omzet van de organisaties, aangewezen krachtens de
      [artikelen 15a, tweede lid][ref2], en [15b, eerste lid, van de Scheepvaartverkeerswet][ref3], in het boekjaar
      voorafgaande aan de beschikking.

      2 [Artikel 199 van het Wetboek van Strafrecht][ref4] is niet van toepassing op de in het eerste lid bedoelde
      overtreding.

      3 Bij de toepassing van de bevoegdheden, bedoeld in het eerste lid, zijn de [artikelen 57, tweede lid][ref5],
      [77][ref6], [80][ref7] en [82 van de Mededingingswet][ref8] van overeenkomstige toepassing.

      4 Indien op grond van [artikel 5.0.1, derde lid, van de Algemene wet bestuursrecht][ref9] toepassing is gegeven
      aan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref10], bedraagt de bestuurlijke boete ten
      hoogste € 450.000,=.


