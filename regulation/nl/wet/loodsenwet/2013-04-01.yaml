  - number: 45k
    text: |-
      1 Indien krachtens de [artikelen 45f][ref1], [45g][ref2], of [45h][ref3] een bestuurlijke boete of een last onder
      dwangsom wordt opgelegd aan de corporatie is deze bevoegd de verbeurde boete of dwangsom te voldoen ten laste van
      het geïnde loodsgeld.

      2 Indien een bestuurlijke boete of een last onder dwangsom wordt opgelegd aan een regionale loodsencorporatie of
      een samenwerkingsverband van registerloodsen, opgericht ter uitvoering van [artikel 15, eerste lid, onder b][ref4],
      zijn deze natuurlijke en rechtspersonen bevoegd de verbeurde boete of dwangsom te voldoen ten laste van het
      gedeelte van het geïnde loodsgeld waarop de desbetreffende regionale loodsencorporatie, onderscheidenlijk het
      desbetreffende samenwerkingsverband, recht heeft ingevolgde de bij en krachtens [artikel 26][ref5] en de krachtens
      de [artikelen 15a, tweede lid][ref6], en [15b, derde lid, van de Scheepvaartverkeerswet][ref7] gestelde regels
      en voorschriften.

      3 Een voldoening als bedoeld in het eerste en tweede lid heeft voorrang boven de bij en
      krachtens [artikel 26][ref8] en de krachtens de [artikelen 15a, tweede lid][ref9], en
      [15b, derde lid, van de Scheepvaartverkeerswet][ref10] gestelde regels en voorschriften.


