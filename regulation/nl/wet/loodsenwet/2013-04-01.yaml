  - number: '31'
    text: |-
      1 Echtgenoten of geregistreerde partners, bloedverwanten of aanverwanten tot de derde graad ingesloten, kunnen
      niet tezamen zijn voorzitter of plaatsvervangend voorzitter, lid of plaatsvervangend lid en secretaris van het
      tuchtcollege loodsen.

      2 Indien het huwelijk of het geregistreerd partnerschap eerst mocht worden aangegaan na de benoeming, zal de
      jongstbenoemde der echtelieden of geregistreerde partners zijn ambt niet kunnen behouden.

      3 Indien de aanverwantschap eerst mocht zijn ontstaan na de benoeming, zal degene, die haar veroorzaakte, zijn ambt
      niet kunnen behouden, behoudens door Onze Minister en Onze Minister van Justitie te verlenen vergunning.

      4 De aanverwantschap houdt op door de ontbinding van het huwelijk of het geregistreerd partnerschap dat haar
      veroorzaakte.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel31
  - number: '32'
    text: |-
      Het in de [artikelen 46c, tweede lid][ref1], [46d, tweede lid][ref2], [46f][ref3],
      [46l, eerste lid, aanhef en onder a, en derde lid][ref4], [46m][ref5], [46o][ref6], en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref7] voor de leden van de rechterlijke macht bepaalde is
      van overeenkomstige toepassing ten aanzien van de leden van het tuchtcollege loodsen en hun plaatsvervangers.

      De [artikelen 13a][ref8], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref9], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref10] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van de leden van het tuchtcollege loodsen en hun plaatsvervangers, met dien verstande dat:

      a. voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het tuchtcollege loodsen; en

      b. de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref11], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
