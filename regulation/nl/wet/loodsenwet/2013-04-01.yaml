      1 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de inrichting en de mate van detaillering van het toerekeningssysteem, bedoeld in [artikel 27b][ref1];

      b. de termijn waarbinnen een vastgesteld toerekeningssysteem ter verkrijging van instemming aan de Autoriteit
      Consument en Markt wordt gezonden;

      c. het tijdstip waarop de voorstellen, bedoeld in de [artikelen 27c][ref2] en [27h][ref3] moeten zijn gedaan, en
      daarbij over te leggen stukken;

      d. de termijn waarbinnen de vaststelling van de tarieven plaatsvindt;

      e. de inrichting en de mate van detaillering van de verantwoordingen, bedoeld in [artikel 27j][ref4].

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inrichting en mate van detaillering
      van het vergelijkend onderzoek, bedoeld in [artikel 27k][ref5].

      3 Bij de maatregel, bedoeld in het eerste lid, kunnen taken en bevoegdheden aan de Autoriteit Consument en Markt
