  - number: 27a
    text: |-
      De loodsgeldtarieven en de tarieven voor het verrichten van andere diensten die bij of krachtens de wet bij
      uitsluiting aan registerloodsen zijn opgedragen, onderscheidenlijk de vergoedingen voor de taken die bij of
      krachtens de wet aan de algemene raad of een regionale loodsencorporatie zijn opgedragen, worden vastgesteld
      overeenkomstig de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004365/2013-04-01#Artikel27a
  - number: 27b
    text: |-
      1 De ledenvergadering van de corporatie stelt in het belang van een op de kosten gebaseerde tariefstelling
      een toerekeningssysteem vast voor de kosten van de diensten en taken, bedoeld in [artikel 27a][ref1], en de
      verplichtingen, bedoeld in [artikel 26, tweede lid, onder a][ref2].

      2 Het toerekeningssysteem bevat een omschrijving van:

      a. de wijze waarop de kosten van de diensten en taken, bedoeld in [artikel 27a][ref3], in de tarieven worden
      doorberekend, en,

      b. de wijze waarop en de frequentie waarmee reserveringen ten behoeve van de financiering van de verplichtingen,
      bedoeld in [artikel 26, tweede lid, onder a][ref4], worden gedaan.

      3 Het toerekeningssysteem wordt opgesteld met inachtneming van het bepaalde bij en krachtens
      [artikel 15ba, derde lid, van de Scheepvaartverkeerswet][ref5].

      4 Het toerekeningssysteem behoeft de instemming van de Autoriteit Consument en Markt.
      [Afdeling 10.2.1 van de Algemene wet bestuursrecht][ref6] is van overeenkomstige toepassing op de instemming.

      5 Voorafgaand aan de vaststelling van het toerekeningssysteem stelt de algemene raad vertegenwoordigers van bij
      ministeriële regeling aan te wijzen openbare lichamen, betrokken bij het bestuur van een of meer zeehavens en
      representatieve organisaties van ondernemers in het scheepvaart- en havenbedrijf in staat hun zienswijze over een
      ontwerp voor een toerekeningssysteem naar voren te brengen. De ledenvergadering stelt de Autoriteit Consument en
      Markt in kennis van de door hem ontvangen zienswijze. De ledenvergadering motiveert zijn overwegingen omtrent de
      ingebrachte zienswijzen.

      6 De Autoriteit Consument en Markt kan de ledenvergadering opdragen een vastgesteld toerekeningssysteem te
      wijzigen. De ledenvergadering is verplicht aan een opdracht gevolg te geven. Het derde, vierde en vijfde lid zijn
      van toepassing.

      7 Onverminderd het zesde lid, wordt het toerekeningssysteem uiterlijk vijf jaar na de datum van inwerkingtreding
      herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
