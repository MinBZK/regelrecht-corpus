  - number: '2'
    text: |-
      1 De loods adviseert aan boord de kapitein of de verkeersdeelnemer over de door deze te voeren navigatie. De loods
      mag met instemming van de kapitein optreden als verkeersdeelnemer.

      2 Voor zover de loods zijn functie niet aan boord van het te loodsen schip kan uitoefenen mag deze de kapitein
      of de verkeersdeelnemer vanaf een ander schip of vanaf de wal adviezen en, voor zover hij daartoe ingevolge
      [artikel 9 Scheepvaartverkeerswet][ref1] bevoegd is, verkeersinformatie geven. Indien zich aan boord van het te
      loodsen schip een loods bevindt kan een loods vanaf de wal aan deze loods adviezen en, voor zover hij daartoe
      ingevolge [artikel 9 Scheepvaartverkeerswet][ref2] bevoegd is, verkeersinformatie geven, in het geval van
      verminderd zicht, slechte weersomstandigheden of andere bijzondere omstandigheden.

      3 Ter bescherming van de belangen, genoemd in [artikel 3, eerste lid, van de Scheepvaartverkeerswet][ref3], worden
      bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld die de loodsen voor en bij de uitoefening
      van hun beroep in acht dienen te nemen. Deze voorschriften hebben onder andere betrekking op de omstandigheden en
      voorwaarden waaronder en de plaatsen vanaf waar de loods adviezen als bedoeld in het tweede lid mag geven.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel3
