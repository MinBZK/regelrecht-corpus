  - number: '16'
    text: |-
      1 De ontwerpen van verordeningen worden door de algemene raad opgesteld, hetzij op last van de ledenvergadering
      hetzij uit eigen beweging.

      2 Op de voorbereiding van verordeningen is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing,
      met dien verstande dat daaraan toepassing wordt gegeven door de algemene raad.

      3 De algemene raad brengt de naar voren gebrachte zienswijzen ter kennis van de leden.

      4 De verordeningen worden na de vaststelling onverwijld ter kennis gebracht van Onze Minister en vervolgens
      bekendgemaakt in de *Staatscourant.* Indien zij de goedkeuring van Onze Minister behoeven, wordt bij de
      bekendmaking aan de voet van de verordening het besluit vermeld waarbij deze is goedgekeurd.

      5 De verordeningen treden, tenzij zij anders bepalen, in werking met ingang van de tweede dag na die van de
      bekendmaking.

      6 Het vierde en vijfde lid zijn eveneens van toepassing op de nadere voorschriften, bedoeld in
      [artikel 15, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0004365#ArtikelI
