preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen over het hergebruik van
    overheidsinformatie in verband met de implementatie van Richtlijn nr. 2013/37/EU van het Europees parlement en de
    Raad van 26 juni 2013 tot wijziging van Richtlijn 2003/98/EG inzake het hergebruik van overheidsinformatie (PbEU
    2013, L 175/1);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *richtlijn:* [Richtlijn 2003/98/
      EG](32003L0098) van het Europees parlement en de Raad van 17 november 2003 inzake het hergebruik van
      overheidsinformatie (PbEG 2003 L 345);
        - *hergebruik:* het gebruik van informatie, neergelegd in documenten berustend bij een met een publieke taak
      belaste instelling, voor andere doeleinden dan het oorspronkelijke doel binnen de publieke taak waarvoor de
      informatie is geproduceerd, anders dan de uitwisseling van informatie tussen met een publieke taak belaste
      instellingen onderling uitsluitend met het oog op de vervulling van hun publieke taken;
        - *met een publieke taak belaste instelling:* een openbaar lichaam als bedoeld in artikel 2, eerste lid, van de
      richtlijn;
        - *document:* een bij een met een publieke taak belaste instelling berustend schriftelijk stuk of ander materiaal
      dat gegevens bevat;
        - *museum:* een met een publieke taak belaste instelling die gericht is op het tonen van cultuurgoederen aan het
      algemene publiek;
        - *bibliotheek:* voor een ieder toegankelijke bibliotheekvoorziening die in overwegende mate door een
      of meer gemeenten wordt gesubsidieerd of in stand gehouden, de Koninklijke Bibliotheek, bedoeld in
      [artikel 1.5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] of de bibliotheekvoorziening
      van een universiteit, genoemd in de [bijlage behorende bij de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
  - number: 2.1.a
    text: informatie die niet openbaar is op grond van de wet;
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
  - number: 2.1.b
    text: |-
      informatie waarvan een derde de rechthebbende is in de zin van de [Auteurswet][ref1], de
      [Wet op de naburige rechten][ref2] of de [Databankenwet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0010591
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0010591
  - number: 2.1.c
    text: |-
      informatie berustend bij een publieke omroep, bij een andere met een publieke omroeptaak belaste instelling of bij
      een instelling die werkzaam is onder verantwoordelijkheid van een publieke omroep of een andere met een publieke
      omroeptaak belaste instelling;
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
  - number: 2.1.d
    text: informatie berustend bij onderwijs- en onderzoeksinstellingen;
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
  - number: 2.1.e
    text: informatie berustend bij andere culturele instellingen dan bibliotheken en musea;
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
  - number: 2.1.f
    text: gedeelten van documenten die alleen logo’s, wapens en insignes bevatten;
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
  - number: 2.1.g
    text: |-
      informatie die betrekking heeft op openbare persoonsgegevens waarvan hergebruik onverenigbaar is met de doeleinden
      waarvoor ze zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van deze wet worden de met een publieke taak belaste instellingen, die op grond van de
      [Algemene wet bestuursrecht][ref1] geen bestuursorgaan zijn, gelijk gesteld met een bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '3.1'
    text: |-
      Een ieder kan een verzoek om hergebruik richten tot een met een publieke taak belaste instelling of een onder
      verantwoordelijkheid van een met een publieke taak belaste instelling werkzame instelling, dienst of bedrijf.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
  - number: '3.2'
    text: De verzoeker vermeldt bij zijn verzoek welke informatie hij wenst te hergebruiken.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
  - number: '3.3'
    text: De verzoeker behoeft bij zijn verzoek geen belang te stellen.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      Indien een verzoek te algemeen geformuleerd is, verzoekt de met een publieke taak belaste instelling de verzoeker
      dit zo spoedig mogelijk te preciseren en is zij hem daarbij behulpzaam.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
  - number: '3.5'
    text: |-
      De met een publieke taak belaste instelling kan een verzoek om hergebruik slechts afwijzen, indien het verzoek
      informatie, bedoeld in [artikel 2, eerste lid][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '2'
        hoofdstuk: I
  - number: '3.6'
    text: |-
      Onverminderd hetgeen bepaald in het vijfde lid, kan een museum of bibliotheek een verzoek om hergebruik afwijzen,
      indien het museum of de bibliotheek de rechthebbende van de informatie is in de zin van de [Auteurswet][ref1], de
      [Wet op de naburige rechten][ref2] of de [Databankenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0010591
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0010591
  - number: '3.7'
    text: |-
      Een met een publieke taak belaste instelling die een verzoek om hergebruik afwijst omdat het verzoek informatie
      betreft als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], deelt aan de verzoeker de identiteit mee van de
      rechthebbende of de licentiegever van de gevraagde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '2'
        hoofdstuk: I
  - number: '3.8'
    text: |-
      Indien een museum of bibliotheek een verzoek om hergebruik afwijst omdat het verzoek informatie betreft als bedoeld
      in [artikel 2, eerste lid, onderdeel b][ref1], hoeft de identiteit van de rechthebbende of de licentiegever van de
      gevraagde informatie niet te worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '2'
        hoofdstuk: I
  - number: '4.1'
    text: |-
      Indien het verzoek betrekking heeft op gegevens in documenten die berusten bij een andere met een publieke taak
      belaste instelling dan die waarbij het verzoek is ingediend, wordt de verzoeker zo nodig naar die instelling
      verwezen. Is het verzoek schriftelijk gedaan, dan wordt het doorgezonden onder mededeling van de doorzending aan
      de verzoeker.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
  - number: '4.2'
    text: De beslissing op een verzoek om hergebruik wordt mondeling of schriftelijk genomen.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek om hergebruik vindt schriftelijk plaats. In
      geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom vraagt. De
      verzoeker wordt op deze mogelijkheid gewezen.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
  - number: '4.4'
    text: |-
      De met een publieke taak belaste instelling beslist op het verzoek om hergebruik zo spoedig mogelijk, doch
      uiterlijk binnen vier weken gerekend vanaf de dag na die waarop het verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
  - number: '4.5'
    text: |-
      De met een publieke taak belaste instelling kan de beslissing voor ten hoogste twee weken verdagen. Van de
      verdaging wordt voor de afloop van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
  - number: '4.6'
    text: |-
      Onverminderd [artikel 4:15 van de Algemene wet bestuursrecht][ref1] wordt de termijn voor het geven van een
      beschikking opgeschort gerekend vanaf de dag na die waarop de met een publieke taak belaste instelling de verzoeker
      meedeelt dat toepassing is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref2], tot de dag waarop
      door de belanghebbende of belanghebbenden een zienswijze naar voren is gebracht of de daarvoor gestelde termijn
      ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4.7'
    text: |-
      Indien de opschorting, bedoeld in het zesde lid, eindigt, doet de met een publieke taak belaste instelling daarvan
      zo spoedig mogelijk mededeling aan de verzoeker, onder vermelding van de termijn binnen welke de beschikking alsnog
      moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
  - number: '4.8'
    text: |-
      Indien de met een publieke taak belaste instelling heeft besloten informatie voor hergebruik ter beschikking te
      stellen, verstrekt het de informatie zo spoedig mogelijk, maar in ieder geval binnen een termijn die het mogelijk
      maakt het potentieel van de informatie volledig te benutten. De verzoeker wordt in kennis gesteld van de termijn
      waarop de informatie zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4
  - number: 4a
    text: |-
      [Paragraaf 4.1.3.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op besluiten op grond van deze
      wet en op beslissingen op bezwaar tegen deze besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.2
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.2
  - number: 4b.1
    text: |-
      In geval van een gegrond beroep tegen het niet tijdig nemen van een besluit op grond van deze wet
      of een beslissing op bezwaar tegen een dergelijk besluit waarbij nog geen besluit is bekendgemaakt,
      bepaalt de bestuursrechter, indien de omvang van het verzoek hiertoe aanleiding geeft, in afwijking van
      [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref1] de termijn waarbinnen het bestuursorgaan
      alsnog een besluit bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 4b.2
    text: |-
      Indien de bestuursrechter oordeelt dat het niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze
      van indiening van het verzoek en nog geen besluit is bekendgemaakt, bepaalt de bestuursrechter, indien het verzoek
      hiertoe aanleiding geeft, in afwijking van [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref1] een
      langere termijn waarbinnen het bestuursorgaan alsnog een besluit bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 4b.3
    text: |-
      De bestuursrechter kan [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref1] buiten toepassing laten
      en een proceskostenveroordeling op grond van [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2]
      achterwege laten, indien de indiener van het beroepschrift, gelet op de omvang van het verzoek, onvoldoende heeft
      meegewerkt aan het bereiken van overeenstemming over:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 4b.3.a
    text: |-
      een opschorting van de beslistermijn als bedoeld in
      [artikel 4:15, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4b.3.b
    text: |-
      verder uitstel van de beslistermijn als bedoeld in
      [artikel 7:10, vierde lid, onderdeel a of b, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 4b.4
    text: |-
      De bestuursrechter kan eveneens [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref1]
      buiten toepassing laten en een proceskostenveroordeling op grond van
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2] achterwege laten, indien hij oordeelt dat het
      niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze van indiening van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '5.1'
    text: |-
      De voor hergebruik beschikbare informatie wordt verstrekt zoals de informatie bij de met een publieke taak belaste
      instelling aanwezig is en voor zover mogelijk langs elektronische weg, in een open en machinaal leesbaar formaat,
      samen met de metadata, waarbij het formaat en de metadata voor zover mogelijk voldoen aan formele open standaarden,
      overeenkomstig artikel 5, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      Een met een publieke taak belaste instelling is niet verplicht vervaardiging van documenten voort te zetten en deze
      documenten op te blijven slaan, enkel met het oog op hergebruik.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel5
  - number: '6.1'
    text: De voorwaarden voor hergebruik zijn voor vergelijkbare categorieën van hergebruik gelijk.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel6
  - number: '6.2'
    text: |-
      Een met een publieke taak belaste instelling verbindt aan de toestemming voor hergebruik geen licentievoorwaarden
      die de mogelijkheden tot hergebruik nodeloos beperken of waardoor de mededinging wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel6
  - number: '7.1'
    text: |-
      Een exclusief recht tot hergebruik wordt niet verleend, tenzij dat noodzakelijk is voor het verlenen van een dienst
      van algemeen belang.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      Indien een exclusief recht wordt verleend voor een dienst van algemeen belang, niet betreffende de digitalisering
      van verzamelingen overheidsinformatie die berusten bij musea of bibliotheken, wordt minstens elke drie jaar door
      de met een publieke taak belaste instelling die het exclusieve recht heeft verleend, bezien of de reden voor het
      verlenen van het exclusieve recht nog aanwezig is.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      Indien een exclusief recht wordt verleend voor de digitalisering van verzamelingen van overheidsinformatie die
      berusten bij musea of bibliotheken, bedraagt de periode van exclusiviteit in het algemeen niet meer dan tien jaar.
      Indien de periode meer dan tien jaar bedraagt, wordt in het elfde jaar en, indien van toepassing, daarna tenminste
      elke zeven jaar, door de instelling die het exclusieve recht heeft verleend, bezien of de reden voor het verlenen
      van het exclusieve recht nog aanwezig is.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel7
  - number: '7.4'
    text: |-
      In de overeenkomst waarin een exclusief recht wordt verleend voor de digitalisering van verzamelingen van
      overheidsinformatie die berusten bij musea of bibliotheken wordt vastgelegd dat de betrokken instelling gratis een
      kopie van de gedigitaliseerde informatie krijgt. De kopie is beschikbaar voor hergebruik na afloop van de periode
      waarvoor het exclusieve recht is verleend.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel7
  - number: '7.5'
    text: |-
      Van elk exclusief recht dat wordt verleend, wordt mededeling gedaan op de in
      [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '8.1'
    text: |-
      Exclusieve rechten tot hergebruik, die vóór 20 januari 2006 en niet voor een dienst van algemeen belang zijn
      verleend, worden na afloop van het desbetreffende contract niet opnieuw verleend, of vervallen, indien het contract
      een langere looptijd heeft dan tot en met 31 december 2008, met ingang van 31 december 2008 van rechtswege.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd hetgeen bepaald in het eerste lid, worden exclusieve rechten tot hergebruik, die vóór de
      inwerkingtreding van deze wet en niet voor een dienst van algemeen belang of voor de digitalisering van
      verzamelingen van overheidsinformatie van musea of bibliotheken zijn verleend, na afloop van het desbetreffende
      contract niet opnieuw verleend, of vervallen, indien het contract een langere looptijd heeft dan tot en met 18 juli
      2043, met ingang van 18 juli 2043 van rechtswege.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      De met een publieke taak belaste instelling brengt voor het hergebruik van informatie ten hoogste de marginale
      kosten van vermenigvuldiging, verstrekking en verspreiding in rekening.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid brengen musea en bibliotheken voor het hergebruik van informatie ten hoogste de
      gemaakte kosten voor verzameling, productie, vermenigvuldiging en verspreiding, conservering en vereffening van
      rechten in rekening, vermeerderd met een redelijk rendement op investeringen.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel9
  - number: '9.3'
    text: |-
      In afwijking van het eerste lid kan een met een publieke taak belaste instelling, ter bestrijding van de kosten
      van de uitvoering van de publieke taak, voor het hergebruik van informatie ten hoogste de gemaakte kosten voor
      verzameling, productie, vermenigvuldiging en verspreiding, in rekening brengen, vermeerderd met een redelijk
      rendement op investeringen, indien dat bij wet is bepaald. De berekening van de kosten geschiedt op basis van
      objectieve, transparante en controleerbare criteria.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel9
  - number: '9.4'
    text: |-
      De met een publieke taak belaste instelling maakt het vooraf kenbaar als kosten in rekening worden gebracht
      voor het hergebruik en met welke factoren rekening wordt gehouden bij de berekening daarvan. Op verzoek geeft de
      betrokken instelling inzicht in de berekening met betrekking tot een concreet verzoek om hergebruik.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel9
  - number: '9.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de criteria,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel9
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet hergebruik van overheidsinformatie.'
    url: https://wetten.overheid.nl/BWBR0036795/2021-07-01#Artikel16
