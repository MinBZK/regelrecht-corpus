preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen over het hergebruik van
    overheidsinformatie in verband met de implementatie van Richtlijn nr. 2013/37/EU van het Europees parlement en de
    Raad van 26 juni 2013 tot wijziging van Richtlijn 2003/98/EG inzake het hergebruik van overheidsinformatie (PbEU
    2013, L 175/1);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *anonimisering:* proces waarbij documenten
      worden omgezet in anonieme documenten die geen betrekking hebben op een geïdentificeerde of identificeerbare
      natuurlijke persoon, of waarbij persoonsgegevens zodanig anoniem worden gemaakt dat de betrokkene niet of niet meer
      identificeerbaar is;
        - *archief:* archiefbewaarplaats als bedoeld in[ artikel 1, onderdeel f, van de Archiefwet 1995][ref1], of
      beheerder daarvan;
        - *API:* reeks functies, procedures, definities en protocollen voor machine-naar-machine communicatie en de
      naadloze uitwisseling van gegevens;
        - *bibliotheek:* a. Koninklijke Bibliotheek als bedoeld in
      [artikel 1.5, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];
      b. landelijke digitale bibliotheek als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet stelsel openbare bibliotheekvoorzieningen][ref3];
      c. lokale bibliotheek als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Wet stelsel openbare bibliotheekvoorzieningen][ref4]; of d.
      universiteitsbibliotheek;
        - *bulksgewijze download:* functie die het mogelijk maakt een volledige dataset in een of meer pakketten te
      downloaden;
        - *document:* a. door een met een publieke taak belaste instelling opgemaakt of ontvangen schriftelijk stuk of
      ander geheel of deel van vastgelegde gegevens, dat naar zijn aard verband houdt met de publieke taak van die
      instelling; b. door een overheidsonderneming opgemaakt of ontvangen schriftelijk stuk of ander geheel of deel
      van vastgelegde gegevens, dat naar zijn aard verband houdt met de dienstverlening in het algemeen belang van
      die overheidsonderneming; of c. door een publiek gefinancierde onderzoeksorganisatie opgemaakt of ontvangen
      schriftelijk stuk of ander geheel of deel van vastgelegde gegevens, dat naar zijn aard verband houdt met de geheel
      of gedeeltelijk publiek gefinancierde activiteiten van die onderzoeksorganisatie;
        - *dynamische gegevens:* digitale documenten die frequent of in real time worden geactualiseerd, hoofdzakelijk
      vanwege hun volatiliteit of omdat ze snel verouderd zijn;
        - *FAIR-beginselen:* beginselen die stellen dat gegevens vindbaar, toegankelijk, interoperabel en herbruikbaar
      moeten worden aangeboden;
        - *formele open standaard:* vrij beschikbare standaard of norm die schriftelijk is vastgesteld, met vermelding van
      specificaties voor de vereisten betreffende de manier waarop de interoperabiliteit van de computerprogramma’s moet
      worden gegarandeerd;
        - *hergebruik:* gebruik van informatie, neergelegd in documenten berustend bij een met een publieke taak belaste
      instelling, overheidsonderneming of publiek gefinancierde onderzoeksorganisatie, voor andere doeleinden dan
      het oorspronkelijke doel binnen de publieke taak, de dienstverlening in het algemeen belang, respectievelijk
      het onderzoek waarvoor de informatie is geproduceerd en anders dan de uitwisseling van informatie tussen deze
      organisaties of instellingen uitsluitend met het oog op de vervulling van publieke taken, dienstverlening in het
      algemeen belang of het onderzoek;
        - *HVD-uitvoeringsverordening:* uitvoeringsverordening als bedoeld in artikel 14, eerste lid, van de richtlijn;
        - *instelling voor hoger onderwijs:* instelling voor hoger onderwijs als bedoeld in
      [artikel 1.1, onderdeel g, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5], met
      uitzondering van universiteitsbibliotheken;
        - *machinaal leesbaar formaat:* bestandsformaat dat zodanig is gestructureerd dat computerprogramma’s specifieke
      gegevens met inbegrip van individuele feitenbeschrijvingen en hun interne structuur gemakkelijk kunnen
      identificeren, herkennen en extraheren;
        - *met een publieke taak belaste instelling:* openbaar lichaam als bedoeld in artikel 2, eerste lid, van de
      richtlijn, voor zover deze geen publiek gefinancierde onderzoeksorganisatie is;
        - *museum:* met een publieke taak belaste instelling die gericht is op het tonen van cultuurgoederen aan het
      algemene publiek;
        - *onderzoeksgegevens:* documenten in digitale vorm, anders dan wetenschappelijke publicaties, die: a.
      worden verzameld of geproduceerd tijdens wetenschappelijke onderzoeksactiviteiten; en b. als bewijs in het
      onderzoeksproces worden gebruikt, of waarvan binnen de onderzoeksgemeenschap algemeen wordt erkend dat ze
      noodzakelijk zijn om onderzoeksresultaten te valideren;
        - *open formaat:* bestandsformaat dat platformonafhankelijk is en voor het publiek beschikbaar zonder enige
      belemmeringen voor het hergebruik van gegevens;
        - *overheidsonderneming:* onderneming waarop met een publieke taak belaste instellingen direct of indirect een
      overheersende invloed als bedoeld in het tweede lid kunnen uitoefenen uit hoofde van eigendom, financiële deelname
      of de op de onderneming van toepassing zijnde voorschriften en die in het algemeen belang: a. activiteiten
      ontplooit op het gebied van: 1°. gas en warmte, voor zover artikel 8 van [Richtlijn 2014/25/EU](32014L0025)
      daarop van toepassing is; 2°. elektriciteit, voor zover artikel 9 van [Richtlijn 2014/25/EU](32014L0025) daarop
      van toepassing is; 3°. water, voor zover artikel 10 van [Richtlijn 2014/25/EU](32014L0025) daarop van toepassing
      is; 4°. het ter beschikking stellen of exploiteren van netten bestemd voor openbare dienstverlening op het
      gebied van vervoer, voor zover artikel 11 van [Richtlijn 2014/25/EU](32014L0025) daarop van toepassing is; 5°. de
      exploitatie van een geografisch gebied ten behoeve van de terbeschikkingstelling aan vervoerders van luchthaven-,
      zeehaven-, binnenhaven- of andere terminalfaciliteiten, voor zover artikel 12 van [Richtlijn 2014/25/EU]
      (32014L0025) daarop van toepassing is; of 6°. winning van olie of gas, of de exploratie of winning van steenkool
      of andere vaste brandstoffen, voor zover artikel 14 van [Richtlijn 2014/25/EU](32014L0025) daarop van toepassing
      is; b. optreedt als exploitant van openbare diensten als bedoeld in artikel 2, onderdeel d, van [Verordening (EG)
      nr. 1370/2007](32007R1370) van het Europees Parlement en de Raad van 23 oktober 2007 betreffende het openbaar
      personenvervoer per spoor en over de weg en tot intrekking van [Verordening (EEG) nr. 1191/69](31969R1191) van de
      Raad en [Verordening (EEG) nr. 1107/70](31970R1107) van de Raad (PbEU 2007, L 315); c. als luchtvaartmaatschappij
      openbare dienstverplichtingen vervult op grond van artikel 16 van [Verordening (EG) nr. 1008/2008](32008R1008)
      van het Europees Parlement en de Raad van 24 september 2008 inzake gemeenschappelijke regels voor de exploitatie
      van luchtdiensten in de Gemeenschap (PbEU 2008, L 293); of d. als reder openbare diensten verricht op grond van
      artikel 4 van [Verordening (EEG) nr. 3577/92](31992R3577) van de Raad van 7 december 1992 houdende toepassing
      van het beginsel van het vrij verrichten van diensten op het zeevervoer binnen de Lid-Staten (cabotage in het
      zeevervoer);
        - *persoonsgegevens:* persoonsgegevens als bedoeld in artikel 4, onderdeel 1, van de Algemene verordening
      gegevensbescherming;
        - *pseudonimisering:* pseudonimisering als bedoeld in artikel 4, vijfde lid, van de Algemene verordening
      gegevensbescherming;
        - *publiek gefinancierde onderzoeksorganisatie:* a. instelling voor hoger onderwijs; of b. instelling die het
      doen of financieren van geheel of gedeeltelijk publiek gefinancierd onderzoek tot diens primaire taak rekent, met
      inbegrip van organisaties die zijn opgericht voor de overdracht van onderzoeksresultaten;
        - *richtlijn:* [Richtlijn 2019/1024/EU](32019L1024) van het Europees parlement en de Raad van 20 juni 2019 inzake
      open data en het hergebruik van overheidsinformatie (PbEU 2019, L 172);
        - *Richtlijn 2014/25/EU:* [Richtlijn 2014/25/EU](32014L0025) van het Europees Parlement en de raad van 26 februari
      2014 betreffende het plaatsen van opdrachten in de sectoren water- en energievoorziening, vervoer en postdiensten
      en houdende intrekking van [Richtlijn 2004/17/EG](32004L0017) (PbEU 2014, L 94);
        - *specifieke hoogwaardige gegevensset:* document dat in een HVD-uitvoeringsverordening is aangemerkt als
      specifieke hoogwaardige dataset waarop die HVD-uitvoeringsverordening en hoofdstuk V van de richtlijn van
      toepassing zijn;
        - *universiteitsbibliotheek:* bibliotheekvoorziening van een universiteit genoemd in de bijlage behorende bij de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035878#Artikel1
