  - number: '1.2'
    text: |-
      Overheersende invloed als bedoeld in de begripsomschrijving van overheidsonderneming in het vorige lid, wordt voor
      de toepassing van het bepaalde bij of krachtens deze wet vermoed aanwezig te zijn, indien met een publieke taak
      belaste instellingen, al dan niet rechtstreeks, ten aanzien van die onderneming:
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel1
  - number: 1.2.a
    text: de meerderheid van het geplaatste kapitaal van de onderneming bezitten;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel1
  - number: 1.2.b
    text: over de meerderheid van de stemrechten verbonden aan de door de onderneming uitgegeven aandelen beschikken; of
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel1
  - number: 1.2.c
    text: |-
      meer dan de helft van de leden van het bestuurs-, het leidinggevend of het toezichthoudend orgaan van de
      onderneming kunnen aanwijzen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel1
  - number: '1.3'
    text: |-
      Met specifieke hoogwaardige gegevenssets als bedoeld in het eerste lid worden, voor zover deze niet reeds op grond
      van artikel 14, eerste lid, van de richtlijn als zodanig zijn aangewezen, voor de toepassing van het bepaalde bij
      of krachtens deze wet gelijkgesteld documenten of informatie, die bij of krachtens algemene maatregel van bestuur
      als zodanig zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel1
  - number: '2.1'
    text: |-
      Met uitzondering van [artikel 2a][ref1], is deze wet niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2a
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: 2a
        hoofdstuk: I
  - number: 2.1.a
    text: informatie die niet openbaar is op grond van de wet;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.b
    text: |-
      informatie waarvan een derde de rechthebbende is in de zin van de [Auteurswet][ref1], de
      [Wet op de naburige rechten][ref2] of de [Databankenwet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0010591
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0010591
  - number: 2.1.c
    text: |-
      informatie berustend bij een bibliotheek, museum of archief, waarvan een derde oorspronkelijk rechthebbende was in
      de zin van de [Auteurswet][ref1], de [Wet op de naburige rechten][ref2] of de [Databankenwet][ref3] en waarvoor de
      beschermingstermijn nog niet is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0010591
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0010591
  - number: 2.1.d
    text: |-
      informatie berustend bij een publieke media-instelling als bedoeld in
      [artikel 1.1, eerste lid, van de Mediawet 2008][ref1], bij een onder de verantwoordelijkheid van een publieke
      media-instelling werkzame instelling of organisatie, of bij de NPO of de RPO als bedoeld in artikel 1.1, eerste
      lid, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 2.1.e
    text: informatie berustend bij onderwijsinstellingen, anders dan instellingen voor hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.f
    text: informatie berustend bij andere culturele instellingen dan bibliotheken, musea en archieven;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.g
    text: gedeelten van documenten die alleen logo’s, wapens of insignes bevatten;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.h
    text: |-
      persoonsgegevens in bij of krachtens de wet ingestelde registers voor zover deze openbaar toegankelijk zijn, tenzij
      het betreft persoonsgegevens in bij algemene maatregel van bestuur aangewezen registers, dan wel tenzij bij of
      krachtens de wet anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.i
    text: |-
      informatie die betrekking heeft op openbare persoonsgegevens waarvan hergebruik onverenigbaar is met de doeleinden
      waarvoor ze zijn verkregen, anders dan persoonsgegevens als bedoeld in het vorige onderdeel;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.j
    text: 'documenten van overheidsondernemingen die:'
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.j.1°
    text: zijn geproduceerd buiten de context van de levering van diensten van algemeen belang; of
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2.1.j.2°
    text: |-
      verband houden met activiteiten die rechtstreeks blootstaan aan concurrentie en daarom op grond van artikel 34 van
      [Richtlijn 2014/25/EU](32014L0025) niet onder de aanbestedingsregels vallen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: '2.2'
    text: |-
      Het ontwerp van een krachtens het eerste lid, onderdeel h, vast te stellen algemene maatregel van bestuur wordt
      aan de beide Kamers der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van
      bestuur kan worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of
      namens een der Kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der Kamers de wens
      te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat
      geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: '2.3'
    text: |-
      Deze wet is alleen van toepassing op documenten van publiek gefinancierde onderzoeksorganisaties voor zover het
      onderzoeksgegevens betreft die ingevolge [artikel 5b][ref1] beschikbaar kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel5b
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: 5b
        hoofdstuk: III
        paragraaf: '3.1'
  - number: '2.4'
    text: |-
      [Hoofdstuk II][ref1] is niet van toepassing op overheidsondernemingen en publiek gefinancierde
      onderzoeksorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036795
        hoofdstuk: II
  - number: '2.5'
    text: |-
      Voor de toepassing van deze wet worden met een publieke taak belaste instellingen die op grond van de
      [Algemene wet bestuursrecht][ref1] geen bestuursorgaan zijn, gelijk gesteld met een bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '2.6'
    text: |-
      Deze wet verplicht niet tot het voortzetten van de vervaardiging en opslag van documenten, enkel met het oog op
      hergebruik.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2
  - number: 2a.1
    text: |-
      Een met een publieke taak belaste instelling of overheidsonderneming, niet zijnde een instelling als bedoeld in
      [artikel 2, eerste lid, onderdelen d, e of f][ref1], draagt er zorg voor dat diens documenten worden ontworpen en
      vervaardigd op een manier die openheid en hergebruik van die documenten faciliteert en gemakkelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '2'
        hoofdstuk: I
  - number: 2a.2
    text: |-
      Indien een met een publieke taak belaste instelling of overheidsonderneming het voornemen heeft om activiteiten te
      financieren die geheel of gedeeltelijk zien op het produceren of ontwikkelen van computerprogramma’s, dynamische
      gegevens, onderzoeksgegevens of specifieke hoogwaardige gegevenssets, door een partij die geen met een publieke
      taak belaste instelling is, spant de met een publieke taak belaste instelling of overheidsonderneming zich in om
      daaraan de voorwaarden te verbinden:
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
  - number: 2a.2.a
    text: |-
      dat die documenten en bijbehorende gegevens worden ontworpen en vervaardigd op een manier die openheid en
      hergebruik van die documenten faciliteert en gemakkelijk maakt; en
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
  - number: 2a.2.b
    text: 'dat die documenten en bijbehorende gegevens met zo min mogelijk beperkingen:'
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
  - number: 2a.2.b.1°
    text: voor algemeen hergebruik beschikbaar worden gesteld, of;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
  - number: 2a.2.b.2°
    text: |-
      aan de met een publieke taak belaste instelling of overheidsonderneming beschikbaar worden gesteld en door deze in
      overeenstemming met de bepalingen van deze wet voor hergebruik beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
  - number: 2a.3
    text: |-
      De uitvoering van dit artikel mag geen afbreuk doen aan de rechten van derden die rechthebbende zijn in de zin van
      de [Auteurswet][ref1], de [Wet op de naburige rechten][ref2] of de [Databankenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0010591
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0010591
  - number: 2a.4
    text: |-
      Een met een publieke taak belaste instelling of overheidsonderneming besteedt in de jaarlijkse begroting dan wel
      de jaarlijkse begroting van het openbaar lichaam of de rechtspersoon waarvan de met een publieke taak belaste
      instelling of overheidsonderneming deel uit maakt, aandacht aan de beleidsvoornemens inzake de uitvoering
      van deze wet en doet in de jaarlijkse verantwoording verslag van de uitvoering ervan, mede in relatie tot de
      beleidsvoornemens.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel2a
  - number: '3.1'
    text: |-
      Een ieder kan een verzoek om hergebruik richten tot een met een publieke taak belaste instelling of een onder
      verantwoordelijkheid van een met een publieke taak belaste instelling werkzame instelling, dienst of bedrijf.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
  - number: '3.2'
    text: De verzoeker vermeldt bij zijn verzoek welke informatie hij wenst te hergebruiken.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
  - number: '3.3'
    text: De verzoeker behoeft bij zijn verzoek geen belang te stellen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
  - number: '3.4'
    text: |-
      Indien een verzoek te algemeen geformuleerd is, verzoekt de met een publieke taak belaste instelling de verzoeker
      dit zo spoedig mogelijk te preciseren en is zij hem daarbij behulpzaam.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
  - number: '3.5'
    text: |-
      De met een publieke taak belaste instelling kan een verzoek om hergebruik slechts afwijzen, indien het verzoek
      informatie, bedoeld in [artikel 2, eerste lid][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '2'
        hoofdstuk: I
  - number: '3.6'
    text: |-
      Onverminderd hetgeen bepaald in het vijfde lid, kan een museum of bibliotheek een verzoek om hergebruik afwijzen,
      indien het museum of de bibliotheek de rechthebbende van de informatie is in de zin van de [Auteurswet][ref1], de
      [Wet op de naburige rechten][ref2] of de [Databankenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0010591
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0010591
  - number: '3.7'
    text: |-
      Een met een publieke taak belaste instelling die een verzoek om hergebruik afwijst omdat het verzoek informatie
      betreft als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], deelt aan de verzoeker de identiteit mee van de
      rechthebbende of de licentiegever van de gevraagde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '2'
        hoofdstuk: I
  - number: '3.8'
    text: |-
      Indien een museum of bibliotheek een verzoek om hergebruik afwijst omdat het verzoek informatie betreft als bedoeld
      in [artikel 2, eerste lid, onderdeel b][ref1], hoeft de identiteit van de rechthebbende of de licentiegever van de
      gevraagde informatie niet te worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel2
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '2'
        hoofdstuk: I
  - number: '4.1'
    text: |-
      Indien het verzoek betrekking heeft op gegevens in documenten die berusten bij een andere met een publieke taak
      belaste instelling dan die waarbij het verzoek is ingediend, wordt de verzoeker zo nodig naar die instelling
      verwezen. Is het verzoek schriftelijk gedaan, dan wordt het doorgezonden onder mededeling van de doorzending aan
      de verzoeker.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
  - number: '4.2'
    text: De beslissing op een verzoek om hergebruik wordt mondeling of schriftelijk genomen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
  - number: '4.3'
    text: |-
      Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek om hergebruik vindt schriftelijk plaats. In
      geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom vraagt. De
      verzoeker wordt op deze mogelijkheid gewezen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
  - number: '4.4'
    text: |-
      De met een publieke taak belaste instelling beslist op het verzoek om hergebruik zo spoedig mogelijk, doch
      uiterlijk binnen vier weken gerekend vanaf de dag na die waarop het verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
  - number: '4.5'
    text: |-
      De met een publieke taak belaste instelling kan de beslissing voor ten hoogste twee weken verdagen. Van de
      verdaging wordt voor de afloop van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
  - number: '4.6'
    text: |-
      Onverminderd [artikel 4:15 van de Algemene wet bestuursrecht][ref1] wordt de termijn voor het geven van een
      beschikking opgeschort gerekend vanaf de dag na die waarop de met een publieke taak belaste instelling de verzoeker
      meedeelt dat toepassing is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref2], tot de dag waarop
      door de belanghebbende of belanghebbenden een zienswijze naar voren is gebracht of de daarvoor gestelde termijn
      ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4.7'
    text: |-
      Indien de opschorting, bedoeld in het zesde lid, eindigt, doet de met een publieke taak belaste instelling daarvan
      zo spoedig mogelijk mededeling aan de verzoeker, onder vermelding van de termijn binnen welke de beschikking alsnog
      moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
  - number: '4.8'
    text: |-
      Indien de met een publieke taak belaste instelling heeft besloten informatie voor hergebruik ter beschikking te
      stellen, verstrekt het de informatie zo spoedig mogelijk, maar in ieder geval binnen een termijn die het mogelijk
      maakt het potentieel van de informatie volledig te benutten. De verzoeker wordt in kennis gesteld van de termijn
      waarop de informatie zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4
  - number: 4a
    text: |-
      [Paragraaf 4.1.3.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op besluiten op grond van deze
      wet en op beslissingen op bezwaar tegen deze besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.2
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.2
  - number: 4b.1
    text: |-
      In geval van een gegrond beroep tegen het niet tijdig nemen van een besluit op grond van deze wet
      of een beslissing op bezwaar tegen een dergelijk besluit waarbij nog geen besluit is bekendgemaakt,
      bepaalt de bestuursrechter, indien de omvang van het verzoek hiertoe aanleiding geeft, in afwijking van
      [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref1] de termijn waarbinnen het bestuursorgaan
      alsnog een besluit bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 4b.2
    text: |-
      Indien de bestuursrechter oordeelt dat het niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze
      van indiening van het verzoek en nog geen besluit is bekendgemaakt, bepaalt de bestuursrechter, indien het verzoek
      hiertoe aanleiding geeft, in afwijking van [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref1] een
      langere termijn waarbinnen het bestuursorgaan alsnog een besluit bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 4b.3
    text: |-
      De bestuursrechter kan [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref1] buiten toepassing laten
      en een proceskostenveroordeling op grond van [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2]
      achterwege laten, indien de indiener van het beroepschrift, gelet op de omvang van het verzoek, onvoldoende heeft
      meegewerkt aan het bereiken van overeenstemming over:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 4b.3.a
    text: |-
      een opschorting van de beslistermijn als bedoeld in
      [artikel 4:15, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4b.3.b
    text: |-
      verder uitstel van de beslistermijn als bedoeld in
      [artikel 7:10, vierde lid, onderdeel a of b, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 4b.4
    text: |-
      De bestuursrechter kan eveneens [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref1]
      buiten toepassing laten en een proceskostenveroordeling op grond van
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2] achterwege laten, indien hij oordeelt dat het
      niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze van indiening van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '5.1'
    text: |-
      Indien documenten actief of op verzoek voor hergebruik beschikbaar worden gesteld door een met een publieke
      taak belaste instelling, overheidsonderneming of, voor zover [artikel 5b][ref1] van toepassing is, publiek
      gefinancierde onderzoeksorganisatie, worden zij beschikbaar gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel5b
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: 5b
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 5.1.a
    text: |-
      zoals de documenten bij die organisatie of in de databank aanwezig zijn, in de reeds bestaande formaten of talen;
      en daarnaast
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: 5.1.b
    text: |-
      voor zover dit mogelijk en passend is en geen onevenredige inspanning vereist die verder gaat dan een eenvoudige
      handeling:
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: 5.1.b.1°
    text: langs elektronische weg; en
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: 5.1.b.2°
    text: |-
      samen met hun metagegevens, zijnde metagegevens als bedoeld in een toepasselijke HVD-uitvoeringsverordening
      of overige gegevens die betrekking hebben op en eigenschappen beschrijven van andere gegevens, in een open en
      machinaal leesbaar formaat dat toegankelijk, vindbaar en herbruikbaar is.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: '5.2'
    text: |-
      Een open en machinaal leesbaar formaat als bedoeld in het eerste lid, onderdeel b, onder 2°, voldoet voor zover
      mogelijk aan formele open standaarden.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: '5.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen specifieke formele open standaarden worden aangewezen waarop
      het tweede lid van toepassing is. Daarbij wordt ook bepaald:
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: 5.3.a
    text: wat het functionele toepassingsbereik is van een aangewezen standaard; en
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: 5.3.b
    text: vanaf welke datum de inspanningsverplichting tot toepassing van een aangewezen standaard ingaat.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het anonimiseren of
      pseudonimiseren van documenten die persoonsgegevens bevatten.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met een publieke taak belaste instellingen,
      overheidsondernemingen of publiek gefinancierde onderzoeksorganisaties worden verplicht om de voor hergebruik
      beschikbare informatie, of categorieën of delen daarvan, ook toegankelijk te maken via een of meerdere aangewezen
      portaalsites met links naar de overzichtslijsten, of via de in [artikel 3.3b van de Wet open overheid][ref1]
      bedoelde digitale infrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
  - number: '5.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het in rekening
      brengen van de kosten voor het toegankelijk maken van documenten op de wijze als bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5
  - number: 5a
    text: |-
      Specifieke hoogwaardige gegevenssets worden door een met een publieke taak belaste instelling of
      overheidsonderneming actief beschikbaar gesteld voor hergebruik. In aanvulling op de vereisten van
      [artikel 5][ref1], worden zij beschikbaar gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel5
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '5'
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 5a.a
    text: via passende API’s die indien mogelijk zijn gebaseerd op formele open standaarden;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5a
  - number: 5a.b
    text: |-
      in de vorm van bulksgewijze download, voor zover dit in de toepasselijke HVD-uitvoeringsverordening is
      voorgeschreven of past bij de aard van de gegevens en de manier waarop ze worden geproduceerd; en
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5a
  - number: 5a.c
    text: |-
      op een wijze die voldoet aan de eisen die in de toepasselijke HVD-uitvoeringsverordening aan die specifieke
      hoogwaardige gegevensset worden gesteld.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5a
  - number: 5b
    text: |-
      Onderzoeksgegevens worden door een publiek gefinancierde onderzoeksorganisatie in overeenstemming met de FAIR-
      beginselen actief beschikbaar gesteld voor hergebruik, voor zover:
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5b
  - number: 5b.a
    text: |-
      die documenten zijn geproduceerd in het kader van geheel of gedeeltelijk met overheidsmiddelen gefinancierde
      wetenschappelijke onderzoeksactiviteiten;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5b
  - number: 5b.b
    text: |-
      die documenten openbaar zijn gemaakt via een institutionele of thematische databank als bedoeld in artikel 10,
      tweede lid, van de richtlijn; en
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5b
  - number: 5b.c
    text: |-
      rechtmatige handelsbelangen, activiteiten inzake kennisoverdracht en reeds bestaande intellectuele eigendomsrechten
      zich hiertegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5b
  - number: 5c.1
    text: |-
      In aanvulling op de vereisten van [artikel 5][ref1], worden dynamische gegevens die door een met een publieke taak
      belaste instelling of overheidsonderneming beschikbaar worden gesteld voor hergebruik, doorlopend aangeboden:


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel5
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '5'
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 5c.1.a
    text: |-
      onmiddellijk nadat zij zijn verzameld, geactualiseerd, of, wanneer dat om gerechtvaardigde redenen van openbaar
      belang essentieel is, geverifieerd;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5c
  - number: 5c.1.b
    text: via passende API’s die indien mogelijk zijn gebaseerd op formele open standaarden; en
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5c
  - number: 5c.1.c
    text: |-
      in de vorm van bulksgewijze download, voor zover dit past bij de aard van de gegevens en de manier waarop ze worden
      geproduceerd.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5c
  - number: 5c.2
    text: |-
      Overstijgt de verplichting, bedoeld in het eerste lid, de financiële of technische mogelijkheden van de met een
      publieke taak belaste instelling of overheidsonderneming omdat dit een onevenredige inspanning zou vergen, dan
      worden in plaats daarvan de dynamische gegevens beschikbaar gesteld:
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5c
  - number: 5c.2.a
    text: |-
      binnen een termijn die redelijkerwijze past bij de aard en omvang van de instelling of onderneming en de aard en
      omvang van de documenten; of
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5c
  - number: 5c.2.b
    text: |-
      met technische beperkingen die daarvoor noodzakelijk zijn, mits deze beperkingen de exploitatie van het economisch
      en sociaal potentieel van deze documenten niet onnodig belemmeren.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5c
  - number: 5d.1
    text: |-
      Voor zover dit zonder onevenredige inspanning of kosten redelijkerwijs mogelijk is, stellen met een publieke taak
      belaste instellingen ook documenten die niet onder de werking van de [artikelen 5a][ref1] of [5b][ref2] vallen
      actief beschikbaar voor hergebruik, tenzij daarmee geen redelijk belang wordt gediend.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0036795#Artikel5b
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: 5a
        hoofdstuk: III
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0036795
        artikel: 5b
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 5d.2
    text: |-
      Het vorige lid geldt niet voor documenten die zijn vastgesteld of ontvangen voordat dit lid van toepassing is
      geworden op de met een publieke taak belaste instelling bij wie de documenten berusten.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel5d
  - number: '6.1'
    text: |-
      Hergebruik wordt niet aan voorwaarden onderworpen, tenzij die voorwaarden objectief, evenredig en niet-
      discriminerend zijn, en gerechtvaardigd worden door een doel van algemeen belang. Onder een doel van algemeen
      belang wordt in ieder geval begrepen de bescherming van de goede uitvoering en continuïteit van een publieke taak.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: '6.2'
    text: |-
      Hergebruik wordt niet aan voorwaarden onderworpen die de mogelijkheden tot hergebruik nodeloos beperken of die
      bedoeld zijn om de mededinging te beperken. Een met een publieke taak belaste instelling die een voorbehoud
      heeft gemaakt als bedoeld in [artikel 8, tweede lid, van de Databankenwet][ref1], oefent de rechten genoemd in
      [artikel 2, eerste lid, van de Databankenwet ][ref2]niet uit om het hergebruik tegen te gaan of te beperken anders
      dan bij of krachtens deze wet is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010591#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0010591#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010591
        artikel: I
      - id: ref2
        bwb_id: BWBR0010591
        artikel: I
  - number: '6.3'
    text: |-
      Ter bescherming van persoonsgegevens, stellen met een publieke taak belaste instellingen, overheidsondernemingen en
      publiek gefinancierde onderzoeksorganisaties in ieder geval de volgende voorwaarden aan hergebruikers:
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.3.a
    text: de gegevens zullen niet worden gebruikt voor heridentificatie van betrokkenen;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.3.b
    text: |-
      de gegevens zullen niet worden gebruikt om pseudonimisering als bedoeld in artikel 4, vierde lid, van de Algemene
      verordening gegevensbescherming of andere waarborgen ter bescherming van persoonsgegevens teniet te doen;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.3.c
    text: |-
      hergebruikers stellen passende waarborgen in om te voldoen aan de vorige twee onderdelen, ook bij verdere
      verwerking van de gegevens;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.3.d
    text: |-
      de vorige drie onderdelen zijn niet van toepassing indien de verwerking slechts plaatsvindt met het doel om
      onderzoek te verrichten naar anonimiserings- of beschermingstechnieken, mits de resultaten van dat onderzoek worden
      teruggekoppeld aan de met een publieke taak belaste instellingen, overheidsondernemingen of publiek gefinancierde
      onderzoeksorganisaties van wie de gegevens afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.3.e
    text: |-
      een inbreuk op deze voorwaarden wordt door de hergebruiker onverwijld gemeld aan de met een publieke taak belaste
      instellingen, overheidsondernemingen of publiek gefinancierde onderzoeksorganisaties van wie de gegevens afkomstig
      zijn;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.3.f
    text: |-
      indien een hergebruiker de gegevens doorgeeft aan een derde, vermeldt deze hergebruiker daarbij van welke met een
      publieke taak belaste instellingen, overheidsondernemingen of publiek gefinancierde onderzoeksorganisaties deze
      gegevens afkomstig zijn en stellen zij daarbij ook de in dit lid bepaalde voorwaarden voor verder hergebruik aan
      die derde.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: '6.4'
    text: 'De eerste drie leden staan er in beginsel niet aan in de weg om beperkende voorwaarden te stellen voor zover:'
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.a
    text: |-
      de informatie vrijwillig is verkregen van een rechthebbende derde en die rechthebbende derde aan hergebruik van die
      informatie voorwaarden heeft verbonden;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.b
    text: |-
      de informatie is verkregen van een derde op grond van een wettelijke verplichting en het belang van hergebruik niet
      opweegt tegen de gerechtvaardigde belangen en verwachtingen van de verstrekker of andere belanghebbenden daarbij;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.c
    text: deze betrekking hebben op het vermelden van een auteur of bron of het achterwege laten van zo’n vermelding;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.d
    text: |-
      deze verbieden dat een bepaalde relatie wordt vermeld of geïmpliceerd tussen het oorspronkelijke document of de
      auteur of bron daarvan, en een afgeleid product;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.e
    text: |-
      deze betrekking hebben op de afwijzing van enige aansprakelijkheid jegens de hergebruiker met betrekking tot de
      voor hergebruik beschikbaar gestelde documenten;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.f
    text: |-
      deze noodzakelijk zijn ter bescherming van persoonsgegevens, waaronder begrepen voorwaarden die noodzakelijk zijn
      om te voldoen aan het beginsel van doelbinding, bedoeld in artikel 5, eerste lid, onderdeel b, van de Algemene
      verordening gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.g
    text: |-
      aan hergebruik van de broncode van een computerprogramma de voorwaarde wordt verbonden dat de broncode van een
      uitgegeven afgeleid werk of daaraan toegevoegde broncodes of computerprogramma’s beschikbaar worden gesteld onder
      dezelfde of vergelijkbare voorwaarden als de oorspronkelijke broncode; of
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: 6.4.h
    text: deze noodzakelijk zijn om onderzoeksgegevens in lijn met de FAIR-beginselen aan te kunnen bieden.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: '6.5'
    text: |-
      De voorwaarden voor hergebruik zijn voor vergelijkbare categorieën van hergebruik gelijk, met inbegrip van
      hergebruik over de landsgrenzen heen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: '6.6'
    text: |-
      Indien documenten door een met een publieke taak belaste instelling worden hergebruikt als basismateriaal voor
      commerciële activiteiten van die met een publieke taak belaste instelling die buiten de publieke taak vallen, zijn
      op het beschikbaar maken van documenten voor deze activiteiten de vergoedingen en andere voorwaarden van toepassing
      die gelden voor andere gebruikers.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: '6.7'
    text: |-
      Voorwaarden worden vooraf vastgesteld en bekendgemaakt, en voor zover mogelijk gesteld in de vorm van een
      versievrije standaardlicentie, waarmee wordt bedoeld een reeks vooraf bepaalde voorwaarden voor hergebruik, in
      een digitaal formaat dat elektronisch kan worden verwerkt en dat verenigbaar is met gestandaardiseerde openbare
      licenties die op het internet vrij beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel6
  - number: '7.1'
    text: |-
      Een exclusief recht tot hergebruik wordt niet verleend, tenzij dat noodzakelijk is voor het verlenen van een dienst
      van algemeen belang.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel7
  - number: '7.2'
    text: |-
      Indien een exclusief recht wordt verleend voor een dienst van algemeen belang, niet betreffende de digitalisering
      van verzamelingen overheidsinformatie die berusten bij musea of bibliotheken, wordt minstens elke drie jaar door de
      met een publieke taak belaste instelling of overheidsonderneming die het exclusieve recht heeft verleend, bezien of
      de reden voor het verlenen van het exclusieve recht nog aanwezig is.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel7
  - number: '7.3'
    text: |-
      Indien een exclusief recht wordt verleend voor de digitalisering van verzamelingen van overheidsinformatie die
      berusten bij musea of bibliotheken, bedraagt de periode van exclusiviteit in beginsel niet meer dan tien jaar.
      Indien de periode meer dan tien jaar bedraagt, wordt in het elfde jaar en, indien van toepassing, daarna tenminste
      elke zeven jaar, door de instelling die het exclusieve recht heeft verleend, bezien of de reden voor het verlenen
      van het exclusieve recht nog aanwezig is.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel7
  - number: '7.4'
    text: |-
      In de overeenkomst waarin een exclusief recht wordt verleend voor de digitalisering van verzamelingen van
      overheidsinformatie die berusten bij musea of bibliotheken wordt vastgelegd dat de betrokken instelling kosteloos
      een kopie van de gedigitaliseerde informatie krijgt. De kopie is beschikbaar voor hergebruik na afloop van de
      periode waarvoor het exclusieve recht is verleend.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel7
  - number: '7.5'
    text: |-
      Van elk exclusief recht dat wordt verleend, niet betreffende de digitalisering van verzamelingen
      overheidsinformatie die berusten bij musea of bibliotheken, wordt ten minste twee maanden voor de inwerkingtreding
      van dat recht mededeling gedaan op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '7.6'
    text: |-
      Het tweede en vijfde lid zijn van overeenkomstige toepassing op de verlening van rechten die niet expliciet
      als exclusief recht bedoeld zijn, maar wel als doel of effect hebben dat de beschikbaarheid van documenten voor
      hergebruik beperkt wordt voor andere partijen dan de partij op wie de verlening van rechten betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel7
  - number: '8.1'
    text: |-
      Door met een publieke taak belaste instelling of publiek gefinancierde onderzoeksorganisatie verleende exclusieve
      rechten tot hergebruik, die vóór 17 juli 2013 en niet voor een dienst van algemeen belang of voor de digitalisering
      van verzamelingen van overheidsinformatie van musea of bibliotheken zijn verleend, worden na afloop van het
      desbetreffende contract niet opnieuw verleend en vervallen met ingang van 18 juli 2033 van rechtswege.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel8
  - number: '8.2'
    text: |-
      Door overheidsondernemingen verleende exclusieve rechten tot hergebruik, die vóór 16 juli 2019 en niet voor
      een dienst van algemeen belang of voor de digitalisering van verzamelingen van overheidsinformatie van musea of
      bibliotheken zijn verleend, na afloop van het desbetreffende contract niet opnieuw verleend en vervallen met ingang
      van 17 juli 2039 van rechtswege.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel8
  - number: '9.1'
    text: |-
      De beschikbaarstelling van documenten voor hergebruik, vindt zoveel mogelijk kosteloos plaats. Een eventuele
      terugvordering die in rekening wordt gebracht, bedraagt ten hoogste de marginale kosten in verband met de
      vermenigvuldiging, verstrekking en verspreiding van de informatie alsmede in verband met de anonimisering van
      persoonsgegevens en maatregelen ter bescherming van de commerciële vertrouwelijkheid.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9
  - number: '9.2'
    text: |-
      Op grond van de [artikelen 9a tot en met 9c][ref1] kunnen voor bepaalde soorten organisaties of bepaalde
      categorieën van documenten uitzonderingen gelden op het vorige lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel9a
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: 9a
        hoofdstuk: III
        paragraaf: '3.3'
  - number: 9a.1
    text: |-
      In afwijking van [artikel 9][ref1] mogen bibliotheken of musea voor het voor hergebruik beschikbaar stellen van
      documenten kosten in rekening brengen als bedoeld in [artikel 9d, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0036795#Artikel9d
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0036795
        artikel: 9d
        hoofdstuk: III
        paragraaf: '3.3'
  - number: 9a.2
    text: |-
      In afwijking van [artikel 9][ref1] mogen overheidsondernemingen voor het voor hergebruik beschikbaar stellen
      van documenten kosten in rekening brengen als bedoeld in [artikel 9d, tweede lid][ref2], met inachtneming van
      [artikel 9b, eerste en tweede lid, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0036795#Artikel9d
      [ref3]: https://wetten.overheid.nl/BWBR0036795#Artikel9b
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0036795
        artikel: 9d
        hoofdstuk: III
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0036795
        artikel: 9b
        hoofdstuk: III
        paragraaf: '3.3'
  - number: 9a.3
    text: |-
      In afwijking van [artikel 9][ref1] mogen met een publieke taak belaste instellingen voor wie dat bij wet is
      bepaald, voor het voor hergebruik beschikbaar stellen van documenten kosten in rekening brengen als bedoeld in
      [artikel 9d, tweede lid][ref2], met inachtneming van [artikel 9b, eerste en tweede lid, onderdeel c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0036795#Artikel9d
      [ref3]: https://wetten.overheid.nl/BWBR0036795#Artikel9b
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0036795
        artikel: 9d
        hoofdstuk: III
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0036795
        artikel: 9b
        hoofdstuk: III
        paragraaf: '3.3'
  - number: 9b.1
    text: De beschikbaarstelling van specifieke hoogwaardige gegevenssets voor hergebruik vindt kosteloos plaats.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9b
  - number: 9b.2
    text: Het eerste lid is niet van toepassing op
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9b
  - number: 9b.2.a
    text: bibliotheken en musea;
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9b
  - number: 9b.2.b
    text: |-
      overheidsondernemingen, voor zover voor hen op grond van een HVD-uitvoeringsverordening een uitzondering bestaat;
      en
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9b
  - number: 9b.2.c
    text: |-
      met een publieke taak belaste instellingen als bedoeld in [artikel 9a, derde lid][ref1], voor zover zij bij
      ministeriële regeling tijdelijk zijn vrijgesteld van deze verplichting. Deze vrijstelling kan ten hoogste twee
      jaar duren, gerekend vanaf het moment van inwerkingtreding van de uitvoeringsverordening waarmee op grond van
      artikel 14, eerste lid, van de richtlijn de betreffende documenten als specifieke hoogwaardige gegevenssets zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel9a
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: 9a
        hoofdstuk: III
        paragraaf: '3.3'
  - number: 9c
    text: |-
      De beschikbaarstelling van onderzoeksgegevens door publiek gefinancierde onderzoeksorganisaties vindt kosteloos
      plaats.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9c
  - number: 9d.1
    text: |-
      Indien een bibliotheek of museum kosten in rekening brengt voor het voor hergebruik beschikbaar stellen van
      documenten, mogen de totale inkomsten hieruit niet hoger zijn dan de gemaakte kosten voor de verzameling,
      productie, vermenigvuldiging en verspreiding, opslag, conservering en vereffening van rechten, en, indien van
      toepassing, de anonimisering van persoonsgegevens en maatregelen ter bescherming van commercieel vertrouwelijke
      informatie in rekening, vermeerderd met een redelijk rendement op investeringen.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9d
  - number: 9d.2
    text: |-
      Indien een met een publieke taak belaste instelling als bedoeld in [artikel 9a, derde lid][ref1], of een
      overheidsonderneming kosten in rekening brengt voor het voor hergebruik beschikbaar stellen van documenten, mogen
      de totale inkomsten hieruit niet hoger dan de kosten van de verzameling, productie, vermenigvuldiging, verspreiding
      en opslag van de documenten, vermeerderd met een redelijk rendement op investeringen, en, indien van toepassing,
      de anonimisering van persoonsgegevens en maatregelen ter bescherming van commercieel vertrouwelijke informatie. De
      berekening van de kosten geschiedt op basis van objectieve, transparante en controleerbare criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel9a
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: 9a
        hoofdstuk: III
        paragraaf: '3.3'
  - number: 9d.3
    text: |-
      Het redelijk rendement op investeringen als bedoeld in de vorige twee leden, is een percentage van het totale
      tarief bovenop de kosten die mogen worden doorberekend, dat ten hoogste vijf procentpunt hoger ligt dan de vaste
      rente van de Europese Centrale Bank.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9d
  - number: 9d.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels worden gesteld met betrekking tot de criteria,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9d
  - number: 9d.5
    text: |-
      De met een publieke taak belaste instelling of overheidsonderneming maakt actief algemeen kenbaar welke kosten er
      in rekening worden gebracht met welke factoren rekening wordt gehouden bij de berekening daarvan. Op verzoek geeft
      de betrokken instelling of overheidsonderneming inzicht in de berekening met betrekking tot een concreet verzoek
      om hergebruik.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9d
  - number: 9d.6
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties publiceert op de in
      [artikel 12, tweede lid, van de Bekendmakingswet][ref1] bepaalde wijze een lijst van met een publieke taak belaste
      instellingen op wie [artikel 9a, derde lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0036795#Artikel9a
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0036795
        artikel: 9a
        hoofdstuk: III
        paragraaf: '3.3'
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet hergebruik van overheidsinformatie.'
    url: https://wetten.overheid.nl/BWBR0036795/2024-06-19#Artikel16
