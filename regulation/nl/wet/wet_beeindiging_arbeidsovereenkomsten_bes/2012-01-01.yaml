$id: wet_beeindiging_arbeidsovereenkomsten_bes
regulatory_layer: WET
publication_date: '2011-12-20'
valid_from: '2012-01-01'
bwb_id: BWBR0028174
url: https://wetten.overheid.nl/BWBR0028174/2012-01-01
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel1
  - number: 1.b
    text: |-
      *werknemer:* de arbeider, bedoeld in [artikel 1613a van het Burgerlijk Wetboek BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613a
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613a
  - number: 1.c
    text: |-
      *werkgever:* de werkgever, bedoeld in [artikel 1613a van het Burgerlijk Wetboek BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613a
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613a
  - number: 1.d
    text: |-
      *dringende reden voor de werkgever:* zodanige daden, eigenschappen of gedragingen van de werknemer, welke
      ten gevolge hebben, dat van de werkgever redelijkerwijze niet kan worden gevergd de dienstbetrekking te laten
      voortduren.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel1
  - number: '2'
    text: 'Deze wet is niet van toepassing op de arbeidsovereenkomst van:'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2
  - number: 2.a
    text: werknemers bij een publiekrechtelijk lichaam;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2
  - number: 2.b
    text: |-
      onderwijzend en docerend personeel, werkzaam bij onderwijsinrichtingen, staande onder beheer van een natuurlijk
      of rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2
  - number: 2.c
    text: personen, die een geestelijk ambt bekleden;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2
  - number: 2.d
    text: |-
      werknemers, die uitsluitend of in hoofdzaak huishoudelijke of persoonlijke diensten in de huishouding van private
      personen verrichten;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2
  - number: 2.e
    text: directeuren van een vennootschap of een doelvermogen.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2
  - number: 2a.1
    text: |-
      Bij ministeriële regeling worden op schriftelijk verzoek van het bestuurscollege van het desbetreffende openbare
      lichaam Bonaire, Sint Eustatius of Saba bedrijfstakken aangewezen ten aanzien waarvan voor de beëindiging van de
      binnen die bedrijfstakken aangegane arbeidsovereenkomsten de [artikelen 3][ref1] en [4 van deze wet][ref2], al dan
      niet voor een bepaalde tijd, niet van toepassing zijn. Intrekking van de ministeriële regeling geschiedt eveneens
      op schriftelijk verzoek van het Bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028174#Artikel4
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028174
        artikel: '4'
  - number: 2a.2
    text: |-
      Een bedrijfstak, bedoeld in het eerste lid, dient te zijn een bedrijfstak, die naar de aard van de ondernemings-
      activiteiten geclassificeerd kan worden in één van de volgende sectoren:
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.a
    text: bouw en reparatie van schepen;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.b
    text: bouwnijverheid;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.c
    text: hotels en restaurants;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.d
    text: vervoer, opslag en communicatie;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.e
    text: onroerend goed activiteiten;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.f
    text: computer- en aanverwante activiteiten;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.g
    text: industrie;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.h
    text: openbare nutsbedrijven;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.i
    text: groot- en kleinhandel, reparatie van motorvoertuigen en huishoudelijke produkten;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.j
    text: financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.k
    text: landbouw, jacht en bosbouw;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.l
    text: visserij, viskwekerijen en aanverwante activiteiten;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.m
    text: mijnbouw;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.2.n
    text: internationale commerciële onderwijsinstituten.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.3
    text: |-
      Bij ministeriële regeling worden op schriftelijk verzoek van het bestuurscollege van het desbetreffende openbare
      lichaam Bonaire, Sint Eustatius of Saba bedrijven aangewezen ten aanzien waarvan voor de beëindiging van de bij die
      bedrijven aangegane arbeidsovereenkomsten de [artikelen 3][ref1] en [4 van deze wet][ref2], al dan niet voor een
      bepaalde tijd, niet van toepassing zijn. Intrekking van de ministeriële regeling geschiedt eveneens op schriftelijk
      verzoek van het Bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028174#Artikel4
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028174
        artikel: '4'
  - number: 2a.4
    text: 'Een bedrijf, bedoeld in het derde lid, dient te zijn een bedrijf dat:'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.4.a
    text: naar de aard van de ondernemingsactiviteiten een sterk variërend arbeidsvolume heeft; of
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.4.b
    text: gevestigd is in een vrije zone als bedoeld in de Wet vrije zones 1975 BES; of
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.4.c
    text: |-
      door zijn vestiging op Bonaire, Sint Eustatius en Saba bijdraagt aan verbreding van de economische basis of
      diversificatie van de economie van Bonaire, Sint Eustatius en Saba, dan wel door zijn werkzaamheid na vestiging
      binnen de openbare lichamen Bonaire, Sint Eustatius en Saba een deviezengenerende werking zal hebben.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
  - number: 2a.5
    text: |-
      Een bedrijf, waarop de [artikelen 3][ref1] en [4 van deze wet][ref2] ingevolge een ministeriële regeling, bedoeld
      in het eerste of derde lid, niet van toepassing zijn, is verplicht Onze Minister onverwijld schriftelijk in kennis
      te stellen van de beëindiging van een arbeidsovereenkomst, waarvoor hij zonder evenbedoelde ministeriële regeling
      toestemming van Onze Minister als bedoeld in artikel 4, nodig zou hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028174#Artikel4
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028174
        artikel: '4'
  - number: '3.1'
    text: |-
      Bij regeling van Onze Minister wordt zoveel mogelijk voor elk openbaar lichaam afzonderlijk een commissie ingesteld
      die tot taak heeft Onze Minister van advies te dienen met betrekking tot ieder bij hem ingediend verzoek om
      toestemming tot het beëindigen van een arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel3
  - number: '3.2'
    text: Elke commissie bestaat uit een voorzitter en tenminste vier overige leden, alsmede hun plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel3
  - number: '3.3'
    text: |-
      De voorzitter en zijn plaatsvervanger mogen niet werkzaam zijn bij het Ministerie van Sociale Zaken en
      Werkgelegenheid. Van de overige leden zomede van hun plaatsvervangers wordt de helft benoemd op voordracht van
      werkgeversorganisaties en de helft op voordracht van werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel3
  - number: '3.4'
    text: |-
      Een lid of plaatsvervangend lid van een commissie wordt ontslagen, indien de werkgevers- of werknemersorganisatie
      die de voordracht voor zijn benoeming heeft gedaan, dit verzoekt.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel3
  - number: '3.5'
    text: |-
      De voorzitter en de leden van een commissie zijn verplicht tot geheimhouding van al hetgeen zij in hun hoedanigheid
      vernemen, voorzover mededeling daarvan niet bij of krachtens wet is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het is de werkgever verboden de arbeidsovereenkomst te beëindigen door deze op te zeggen zonder toestemming van
      Onze Minister dan wel in strijd met een voorwaarde waaronder de toestemming is gegeven.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
  - number: '4.2'
    text: 'Het verbod, bedoeld in het eerste lid, geldt niet:'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
  - number: 4.2.a
    text: indien de beëindiging geschiedt om een dringende aan de werknemer onverwijld medegedeelde reden;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
  - number: 4.2.b
    text: indien de beëindiging geschiedt met wederzijds goedvinden;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
  - number: 4.2.c
    text: indien de beëindiging geschiedt tijdens de proeftijd;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
  - number: 4.2.d
    text: indien de opzegging geschiedt ten gevolge van het faillissement van de werkgever;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
  - number: 4.2.e
    text: |-
      indien de beëindiging betrekking heeft op een al dan niet voortgezette arbeidsovereenkomst voor bepaalde tijd en
      die beëindiging plaatsvindt tegen de in die overeenkomst opgenomen einddatum, tenzij het een arbeidsovereenkomst
      voor bepaalde tijd betreft, als bedoeld in artikel [1615e van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615e
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615e
  - number: '4.3'
    text: |-
      Onze Minister besluit binnen twee weken na ontvangst van het advies van de commissie, bedoeld in [artikel 3][ref1],
      doch in ieder geval binnen acht weken na ontvangst van het verzoek tot toestemming tot het beëindigen van
      de arbeidsovereenkomst. De termijn van acht weken kan worden verlengd indien bijzondere omstandigheden dit
      noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel3
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '3'
  - number: '4.4'
    text: |-
      Het verzoek om toestemming tot het beëindigen van een arbeidsovereenkomst wordt gedaan aan Onze Minister.
      Het verzoek wordt geacht niet te zijn gedaan, zolang de vereiste gegevens niet zijn verstrekt en de vereiste
      bewijsstukken niet zijn overgelegd.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] dient een werkgever, zodra hij voornemens is binnen een termijn van
      drie maanden vijf en twintig werknemers of meer dan wel meer dan 25% van het aantal werknemers in een vestiging
      ener onderneming, voorzover dit percentage niet resulteert in vijf of minder werknemers, te ontslaan dit voornemen
      minstens twee maanden voor het beëindigen der arbeidsovereenkomst aan Onze Minister te kennen te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel4
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '4'
  - number: '5.2'
    text: Binnen acht dagen na de kennisgeving legt de werkgever aan Onze Minister een afvloeiingsplan voor.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister geeft zo spoedig mogelijk doch uiterlijk binnen zes weken na ontvangst van het afvloeiingsplan een
      schriftelijk oordeel ter zake. [Artikel 4, derde lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel4
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '4'
  - number: '5.4'
    text: |-
      Het is de werkgever verboden een arbeidsovereenkomst te beëindigen, zolang Onze Minister, met inachtneming van het
      derde lid, geen beoordeling heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel5
  - number: '6'
    text: Bij ministeriële regeling kunnen nadere voorschrift worden gegeven ter uitvoering van de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel6
  - number: '7.1'
    text: |-
      Handelingen in strijd met de [artikelen 4, eerste lid][ref1], en [5, vierde lid][ref2], zijn vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028174#Artikel5
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028174
        artikel: '5'
  - number: '7.2'
    text: |-
      De werknemer kan deze vernietigbaarheid inroepen gedurende zes maanden na de opzegging, die gericht is op
      beëindiging van de arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7
  - number: 7a.1
    text: |-
      Met het toezicht op de naleving van deze wet en daarop berustende bepalingen zijn belast de daartoe door Onze
      Minister aangewezen ambtenaren. Deze aanwijzing wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.4
    text: |-
      Onze Minister kan regels stellen met betrekking tot de wijze van taakuitoefening van de krachtens het eerste lid
      aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: 7a.5
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel7a
  - number: '8.1'
    text: |-
      Hij die handelt in strijd met het bepaalde bij of krachtens [artikel 2a, vijfde lid][ref1],
      [artikel 4, eerste lid][ref2], of [artikel 5][ref3] wordt gestraft met hechtenis van ten hoogste zes maanden of een
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0028174#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028174#Artikel5
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0028174
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0028174
        artikel: '5'
  - number: '8.2'
    text: De strafbare feiten bedoeld in het eerste lid worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel8
  - number: 8a.1
    text: |-
      Overtreding van het voorschrift gesteld in [artikel 3, vijfde lid][ref1], wordt, voor zover opzettelijk begaan,
      beschouwd als misdrijf en gestraft met gevangenisstraf van ten hoogste twee jaar of een geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel3
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '3'
  - number: 8a.2
    text: |-
      Overtreding van het voorschrift bedoeld in het eerste lid wordt, voorzover niet opzettelijk begaan, beschouwd als
      overtreding en gestraft met hechtenis van ten hoogste drie maanden of een geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel8a
  - number: 8a.3
    text: Indien de overtreding tegen een bepaalde persoon gepleegd is, wordt zij slechts vervolgd op diens klacht.
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel8a
  - number: '9'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel9
  - number: '10'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel10
  - number: '11'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet beëindiging arbeidsovereenkomsten BES.'
    url: https://wetten.overheid.nl/BWBR0028174/2012-01-01#Artikel12
