  - number: 1.3.h
    text: 'arbeidsmiddelen: alle op de arbeidsplaats gebruikte machines, installaties, apparaten en gereedschappen;'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
