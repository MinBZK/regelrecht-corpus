      arbeid in een woning doet verrichten, in bij algemene maatregel van bestuur aan te wijzen gevallen;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.2.b
    text: 'werknemer: de ander, bedoeld onder a, met uitzondering van degene die als vrijwilliger arbeid verricht.'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
