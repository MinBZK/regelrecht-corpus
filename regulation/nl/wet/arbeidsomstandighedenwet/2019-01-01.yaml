preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de kwaliteit van het arbeidsomstandighedenbeleid
    te verbeteren, meer ruimte voor maatwerk te creëren en de bestuurlijke boete in te voeren alsmede enige andere
    wijzigingen aan te brengen en daartoe een nieuwe Arbeidsomstandighedenwet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.1.a
    text: 'werkgever:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.1.a.1°
    text: |-
      degene jegens wie een ander krachtens arbeidsovereenkomst of publiekrechtelijke aanstelling gehouden is tot het
      verrichten van arbeid, behalve indien die ander aan een derde ter beschikking wordt gesteld voor het verrichten van
      arbeid, welke die derde gewoonlijk doet verrichten;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.1.a.2°
    text: degene aan wie een ander ter beschikking wordt gesteld voor het verrichten van arbeid als bedoeld onder 1°.;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.1.b
    text: 'werknemer: de ander, bedoeld onder a.'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.2.a
    text: 'werkgever:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.2.a.1°
    text: |-
      degene die zonder werkgever of werknemer in de zin van het eerste lid te zijn, een ander onder zijn gezag arbeid
      doet verrichten;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: 1.2.a.2°
