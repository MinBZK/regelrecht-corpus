  - number: '1.4'
    text: |-
      Waar in deze wet en de daarop berustende bepalingen de woorden «bedrijf» en «inrichting» worden gebruikt om een
      plaats aan te duiden, omvatten deze mede een andere plaats waar arbeid wordt verricht of pleegt te worden verricht.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
  - number: '2'
    text: 'Deze wet en de daarop berustende bepalingen zijn mede van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel2
  - number: 2.a
    text: arbeid verricht binnen de exclusieve economische zone;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel2
  - number: 2.b
    text: |-
      verrichtingen van leerlingen en studenten in onderwijsinrichtingen of gedeelten daarvan, open ruimten daaronder
      begrepen, die vergelijkbaar zijn met arbeid in de beroepspraktijk;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel2
  - number: 2.c
    text: |-
      arbeid die geheel of ten dele buiten Nederland wordt verricht door personen, werkzaam aan boord van zeeschepen die
      op grond van Nederlandse rechtsregels gerechtigd zijn de Nederlandse vlag te voeren;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel2
  - number: 2.d
    text: |-
      arbeid die voor een in Nederland gevestigde werkgever geheel of ten dele buiten Nederland wordt verricht door
      personen, werkzaam aan boord van luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel2
  - number: '3.1'
    text: |-
      De werkgever zorgt voor de veiligheid en de gezondheid van de werknemers inzake alle met de arbeid verbonden
      aspecten en voert daartoe een beleid dat is gericht op zo goed mogelijke arbeidsomstandigheden, waarbij hij, gelet
      op de stand van de wetenschap en professionele dienstverlening, het volgende in acht neemt:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: 3.1.a
    text: |-
      tenzij dit redelijkerwijs niet kan worden gevergd organiseert de werkgever de arbeid zodanig dat daarvan geen
      nadelige invloed uitgaat op de veiligheid en de gezondheid van de werknemer;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: 3.1.b
    text: |-
      tenzij dit redelijkerwijs niet kan worden gevergd worden de gevaren en risico's voor de veiligheid of de
      gezondheid van de werknemer zoveel mogelijk in eerste aanleg bij de bron daarvan voorkomen of beperkt; naar de
      mate waarin dergelijke gevaren en risico's niet bij de bron kunnen worden voorkomen of beperkt, worden daartoe
      andere doeltreffende maatregelen getroffen waarbij maatregelen gericht op collectieve bescherming voorrang hebben
      boven maatregelen gericht op individuele bescherming; slechts indien redelijkerwijs niet kan worden gevergd
      dat maatregelen worden getroffen die zijn gericht op individuele bescherming, worden doeltreffende en passende
      persoonlijke beschermingsmiddelen aan de werknemer ter beschikking gesteld;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: 3.1.c
    text: |-
      de inrichting van de arbeidsplaatsen, de werkmethoden en de bij de arbeid gebruikte arbeidsmiddelen alsmede de
      arbeidsinhoud worden zoveel als redelijkerwijs kan worden gevergd aan de persoonlijke eigenschappen van werknemers
      aangepast;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: 3.1.d
    text: |-
      monotone en tempogebonden arbeid wordt, zoveel als redelijkerwijs kan worden gevergd, vermeden dan wel, indien dat
      niet mogelijk is, beperkt;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: 3.1.e
    text: |-
      doeltreffende maatregelen worden getroffen op het gebied van de eerste hulp bij ongevallen, de brandbestrijding en
      de evacuatie van werknemers en andere aanwezige personen, en doeltreffende verbindingen worden onderhouden met de
      desbetreffende externe hulpverleningsorganisaties;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: 3.1.f
    text: |-
      elke werknemer moet bij ernstig en onmiddellijk gevaar voor zijn eigen veiligheid of die van anderen, rekening
      houdend met zijn technische kennis en middelen, de nodige passende maatregelen kunnen nemen om de gevolgen van een
      dergelijk gevaar te voorkomen, waarbij [artikel 29, eerste lid, derde zin][ref1], van overeenkomstige toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel29
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '29'
        hoofdstuk: '5'
  - number: '3.2'
    text: |-
      De werkgever voert, binnen het algemeen arbeidsomstandighedenbeleid, een beleid gericht op voorkoming en indien dat
      niet mogelijk is beperking van psychosociale arbeidsbelasting.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: '3.3'
    text: |-
      Ter uitvoering van het eerste lid draagt de werkgever zorg voor een goede verdeling van bevoegdheden en
      verantwoordelijkheden tussen de bij de werkgever werkzame personen, waarbij hij rekening houdt met de bekwaamheden
      van de werknemers.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: '3.4'
    text: |-
      De werkgever toetst het arbeidsomstandighedenbeleid regelmatig aan de ervaringen die daarmee zijn opgedaan en past
      de maatregelen aan zo dikwijls als de daarmee opgedane ervaring daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel3
  - number: '4.1'
    text: |-
      In aanvulling op [artikel 3, eerste lid, aanhef en onder c][ref1], past de werkgever, bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] uit hoofde van de uitoefening van zijn taak, bedoeld in
      [artikel 7:658a van het Burgerlijk Wetboek][ref3] en [artikel 76e van de Ziektewet][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76e
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 658a
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 76e
  - number: 4.1.a
    text: |-
      de inrichting van de arbeidsplaats, de werkmethoden en de bij de arbeid gebruikte arbeidsmiddelen, alsmede de
      arbeidsinhoud aan zijn werknemer, die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is de
      bedongen arbeid te verrichten aan, en
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de inrichting van het bedrijf aan die werknemer aan, voorzover de behoefte daaraan wordt opgeroepen door de
      deelneming van die werknemer aan de werkzaamheden of het daarmee samenhangende verblijf in het bedrijf.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de eigenrisicodrager, bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1] en de persoon, bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref2], die laatstelijk tot de eigenrisicodrager in
      dienstbetrekking stond, gedurende de periode dat de eigenrisicodrager aan die persoon ziekengeld moet betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '5.1'
    text: |-
      Bij het voeren van het arbeidsomstandighedenbeleid legt de werkgever in een inventarisatie en evaluatie
      schriftelijk vast welke risico's de arbeid voor de werknemers met zich brengt. Deze risico-inventarisatie en
      -evaluatie bevat tevens een beschrijving van de gevaren en de risico-beperkende maatregelen en de risico's voor
      bijzondere categorieën van werknemers.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel5
  - number: '5.2'
    text: |-
      In de risico-inventarisatie en -evaluatie wordt aandacht besteed aan de toegang van werknemers tot een deskundige
      werknemer of persoon, bedoeld in de [artikelen 13][ref1] en [14][ref2], of de arbodienst.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: '5.3'
    text: |-
      Een plan van aanpak, waarin is aangegeven welke maatregelen zullen worden genomen in verband met de bedoelde
      risico's en de samenhang daartussen, een en ander overeenkomstig [artikel 3][ref1], maakt deel uit van de risico-
      inventarisatie en -evaluatie. In het plan van aanpak wordt tevens aangegeven binnen welke termijn deze maatregelen
      zullen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.4'
    text: |-
      De risico-inventarisatie en -evaluatie wordt aangepast zo dikwijls als de daarmee opgedane ervaring, gewijzigde
      werkmethoden of werkomstandigheden of de stand van de wetenschap en professionele dienstverlening daartoe
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel5
  - number: '5.5'
    text: |-
      Indien de werkgever arbeid doet verrichten door een werknemer die hem ter beschikking wordt gesteld, verstrekt hij
      tijdig voor de aanvang van de werkzaamheden aan degene, die de werknemer ter beschikking stelt, de beschrijving uit
      de risico-inventarisatie en -evaluatie van de gevaren en risicobeperkende maatregelen en van de risico's voor de
      werknemer op de in te nemen arbeidsplaats, opdat diegene deze beschrijving verstrekt aan de betrokken werknemer.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel5
  - number: '5.6'
    text: De werkgever zorgt ervoor dat iedere werknemer kennis kan nemen van de risico-inventarisatie en -evaluatie.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel5
  - number: '6.1'
    text: |-
      De werkgever neemt bij het voeren van het arbeidsomstandighedenbeleid de maatregelen die nodig zijn ter voorkoming
      en beperking van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken en de gevolgen daarvan voor de
      veiligheid en de gezondheid van de in het bedrijf, de inrichting, of een deel daarvan werkzame werknemers. Bij of
      krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: 6.1.a
    text: de categorieën van bedrijven, inrichtingen of delen daarvan ten aanzien waarvan de werkgever die maatregelen neemt;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de gegevens die de werkgever met betrekking tot de bedrijven, inrichtingen of delen daarvan, bedoeld onder a, op
      schrift stelt of verstrekt aan de toezichthouder of aan de werknemers en de andere deskundige personen, bedoeld
      in [artikel 13, eerste tot en met derde lid][ref1], de personen, bedoeld in [artikel 14, eerste lid][ref2] en de
      arbodienst;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: 6.1.c
    text: de maatregelen die de werkgever neemt ten aanzien van de bedrijven, inrichtingen of delen daarvan, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: 6.1.d
    text: het tijdstip waarop en de frequentie waarmee wordt voldaan aan de verplichtingen, bedoeld onder b en c;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: 6.1.e
    text: |-
      een verbod op de exploitatie van het bedrijf, de inrichting of een deel daarvan, indien niet of niet voldoende is
      voldaan aan een of meer verplichtingen krachtens dit artikel;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: 6.1.f
    text: het toezicht op de naleving van het bij of krachtens dit artikel bepaalde.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister kan een bedrijf of een inrichting of een deel daarvan afzonderlijk aanwijzen ten aanzien waarvan
      op de werkgever een of meer van de verplichtingen bedoeld in of krachtens het eerste lid rusten indien zich in
      verband met de aanwezigheid van gevaarlijke stoffen bijzondere gevaren kunnen voordoen voor de veiligheid en de
      gezondheid van de daarin werkzame werknemers. Bij de aanwijzing wordt bepaald op welk tijdstip aan de betreffende
      verplichtingen moet zijn voldaan. De werking van de aanwijzing wordt opgeschort totdat de termijn voor het indienen
      van een bezwaar- of beroepschrift is verstreken of, indien bezwaar is gemaakt of beroep is ingesteld, op het
      bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het niet naleven van de bij of krachtens het eerste lid, tweede volzin, gestelde regels wordt aangemerkt als
      strafbaar feit voor zover dat bij of krachtens algemene maatregel van bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel6
  - number: '7.1'
    text: |-
      De toezichthouder stelt krachtens [artikel 6, eerste lid, onder b][ref1], verschafte en bij algemene maatregel van
      bestuur aangewezen gegevens uit eigen beweging ter beschikking van het publiek. Bij of krachtens algemene maatregel
      van bestuur kunnen terzake regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel6
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Onverminderd [artikel 10, eerste lid, van de Wet openbaarheid van bestuur][ref1] en in afwijking van
      [artikel 10, tweede lid, van die wet][ref2] blijft het verstrekken van gegevens als bedoeld in het eerste lid
      achterwege voor zover het belang daarvan niet opweegt tegen de volgende belangen:


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 7.2.a
    text: |-
      het belang, bedoeld in [artikel 10, tweede lid, onder e, van de Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 7.2.b
    text: |-
      het belang, bedoeld in [artikel 10, zevende lid, onder b, van de Wet openbaarheid van bestuur][ref1], voorzover het
      betreft het voorkomen van sabotage.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '7.3'
    text: |-
      [Artikel 10, tweede lid, aanhef en onder f, van de Wet openbaarheid van bestuur][ref1] is niet van toepassing op
      het op verzoek verstrekken van gegevens die door de daartoe aangewezen ambtenaar bedoeld in [artikel 24][ref2]
      zijn verkregen in verband met de toepassing van het bepaalde bij of krachtens [artikel 6][ref3] ter uitvoering van
      Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de beheersing van de gevaren
      van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en vervolgens intrekking van
      Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197).


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel6
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
  - number: '7.4'
    text: |-
      [Artikel 10, tweede lid, aanhef en onder b, van de Wet openbaarheid van bestuur][ref1] is op het op verzoek
      verstrekken van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voorzover die
      gegevens een vertrouwelijk karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '7.5'
    text: |-
      [Artikel 10, tweede lid, aanhef en onder g, van de Wet openbaarheid van bestuur][ref1] is op het op verzoek
      verstrekken van gegevens als bedoeld in het derde lid uitsluitend van toepassing voor zover het gegevens betreft
      die afbreuk kunnen doen aan de mogelijkheid van het voorkomen van sabotage.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '7.6'
    text: |-
      In afwijking van het vijfde lid is, voorzover het gaat om milieu-
      informatie als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref1],
      [artikel 10, zevende lid, aanhef en onder b, van de Wet openbaarheid van bestuur][ref2] uitsluitend van toepassing
      voorzover het gegevens betreft die afbreuk kunnen doen aan de mogelijkheid van het voorkomen van sabotage.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '8.1'
    text: |-
      De werkgever zorgt ervoor dat de werknemers doeltreffend worden ingelicht over de te verrichten werkzaamheden en
      de daaraan verbonden risico's, alsmede over de maatregelen die erop gericht zijn deze risico's te voorkomen of te
      beperken. Tevens zorgt de werkgever ervoor dat de werknemers doeltreffend worden ingelicht over de wijze waarop de
      deskundige bijstand, bedoeld in de [artikelen 13][ref1], [14][ref2], [14a][ref3] en [15][ref4], in zijn bedrijf of
      inrichting is georganiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: 14a
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '15'
        hoofdstuk: '3'
  - number: '8.2'
    text: |-
      De werkgever zorgt ervoor dat aan de werknemers doeltreffend en aan hun onderscheiden taken aangepast onderricht
      wordt verstrekt met betrekking tot de arbeidsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien persoonlijke beschermingsmiddelen ter beschikking van de werknemers worden gesteld en indien op
      arbeidsmiddelen of anderszins beveiligingen zijn aangebracht, zorgt de werkgever ervoor dat de werknemers op de
      hoogte zijn van hun doel en werking en de wijze waarop zij deze dienen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel8
  - number: '8.4'
    text: |-
      De werkgever ziet toe op de naleving van de instructies en voorschriften gericht op het voorkomen of beperken van
      de in het eerste lid genoemde risico's alsmede op het juiste gebruik van persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien binnen de onderneming werknemers jonger dan 18 jaar werkzaam zijn, houdt de werkgever bij de uitvoering
      van de in de voorgaande leden genoemde verplichtingen in het bijzonder rekening met de aan de jeugdige leeftijd
      inherente beperkte werkervaring en onvoltooide lichamelijke en geestelijke ontwikkeling van deze werknemers.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel8
  - number: '9.1'
    text: |-
      De werkgever meldt arbeidsongevallen die leiden tot de dood, een blijvend letsel of een ziekenhuisopname direct
      aan de daartoe aangewezen toezichthouder en rapporteert hierover desgevraagd zo spoedig mogelijk aan deze
      toezichthouder.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel9
  - number: '9.2'
    text: |-
      De werkgever houdt een lijst bij van de gemelde arbeidsongevallen en van arbeidsongevallen welke hebben geleid tot
      een verzuim van meer dan drie werkdagen en registreert daarop de aard en datum van het ongeval.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel9
  - number: '9.3'
    text: |-
      De persoon, bedoeld in [artikel 14, eerste lid][ref1], die belast is met de taak, bedoeld in onderdeel b van dat
      lid, of de arbodienst meldt beroepsziekten aan een door Onze Minister hiertoe aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: '9.4'
    text: |-
      Onze Minister vergoedt ten laste van ’s Rijks kas de door de aangewezen instelling, bedoeld in het derde lid,
      gemaakte uitvoeringskosten overeenkomstig bij ministeriële regeling vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel9
  - number: '10'
    text: |-
      Indien bij of in rechtstreeks verband met de arbeid die de werkgever door zijn werknemers doet verrichten in een
      bedrijf of een inrichting of in de onmiddellijke omgeving daarvan gevaar kan ontstaan voor de veiligheid of de
      gezondheid van andere personen dan die werknemers, neemt de werkgever doeltreffende maatregelen ter voorkoming van
      dat gevaar.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel10
  - number: '11'
    text: |-
      De werknemer is verplicht om in zijn doen en laten op de arbeidsplaats, overeenkomstig zijn opleiding en de door de
      werkgever gegeven instructies, naar vermogen zorg te dragen voor zijn eigen veiligheid en gezondheid en die van de
      andere betrokken personen. Met name is hij verplicht om:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel11
  - number: 11.a
    text: arbeidsmiddelen en gevaarlijke stoffen op de juiste wijze te gebruiken;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel11
  - number: 11.b
    text: |-
      de hem ter beschikking gestelde persoonlijke beschermingsmiddelen op de juiste wijze te gebruiken en na gebruik op
      de daartoe bestemde plaats op te bergen, een en ander voor zover niet krachtens deze wet is bepaald dat werknemers
      niet verplicht zijn beschermingsmiddelen als vorenbedoeld te gebruiken;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel11
  - number: 11.c
    text: |-
      de op arbeidsmiddelen of anderszins aangebrachte beveiligingen niet te veranderen of buiten noodzaak weg te halen
      en deze op de juiste wijze te gebruiken;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel11
  - number: 11.d
    text: |-
      mede te werken aan het voor hem georganiseerde onderricht bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel8
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '8'
        hoofdstuk: '2'
  - number: 11.e
    text: |-
      de door hem opgemerkte gevaren voor de veiligheid of de gezondheid terstond ter kennis te brengen aan de werkgever
      of degene die namens deze ter plaatse met de leiding is belast;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel11
  - number: 11.f
    text: |-
      de werkgever en de de werknemers en de andere deskundige personen, bedoeld in
      [artikel 13, eerste tot en met derde lid][ref1], de personen, bedoeld in [artikel 14, eerste lid][ref2], en de
      arbodienst, indien nodig bij te staan bij de uitvoering van hun verplichtingen en taken op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: '12.1'
    text: Bij de uitvoering van het arbeidsomstandighedenbeleid werken de werkgever en de werknemers samen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
  - number: '12.2'
    text: |-
      De werkgever voert overleg met de ondernemingsraad of de personeelsvertegenwoordiging over aangelegenheden die het
      arbeidsomstandighedenbeleid betreffen alsmede over de uitvoering van dit beleid, waarbij actief informatie wordt
      gewisseld.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
  - number: '12.3'
    text: |-
      De werkgever voert in ondernemingen waarin in de regel minder dan 10 personen werkzaam zijn, bij het
      ontbreken van een ondernemingsraad of personeelsvertegenwoordiging, overleg met de belanghebbende
      werknemers over de risico-inventarisatie en -evaluatie, de organisatie van de deskundige bijstand, bedoeld
      in [artikel 13, eerste tot en met derde lid][ref1], de arbodienst en de deskundige bijstand, bedoeld in
      [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '15'
        hoofdstuk: '3'
  - number: '12.4'
    text: |-
      Aan de leden van de ondernemingsraad of de personeelsvertegenwoordiging wordt in verband met hun taak in het kader
      van de arbeidsomstandigheden van de werknemers:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
  - number: 12.4.a
    text: |-
      de mogelijkheid geboden zich met de toezichthouder tijdens zijn bezoek aan het bedrijf of de inrichting buiten
      tegenwoordigheid van anderen te onderhouden;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
  - number: 12.4.b
    text: |-
      de mogelijkheid geboden de toezichthouder tijdens zijn bezoek aan het bedrijf of de inrichting te vergezellen,
      behoudens voor zover deze te kennen geeft dat daartegen vanwege een goede uitoefening van zijn taak bezwaren
      bestaan.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
  - number: '12.5'
    text: |-
      Voor het bij of krachtens deze wet bepaalde treedt voor de toepassing van de [afdelingen 3.6][ref1] en
      [4.1.2. van de Algemene wet bestuursrecht][ref2] een ondernemingsraad of personeelsvertegenwoordiging in de plaats
      van de belanghebbende werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '12.6'
    text: |-
      Bij het ontbreken van de ondernemingsraad of personeelsvertegenwoordiging wordt, in afwijking van
      [artikel 3.41 van de Algemene wet bestuursrecht][ref1], van een beschikking zo spoedig mogelijk door de
      werkgever mededeling gedaan aan de belanghebbende werknemers. Die beschikking treedt, in afwijking van
      [artikel 3.40 van de Algemene wet bestuursrecht][ref2], voor hen niet eerder in werking dan nadat de werkgever aan
      de mededelingsplicht, als bedoeld in de vorige zin, heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '13.1'
    text: |-
      De werkgever laat zich ten aanzien van de naleving van zijn verplichtingen op grond van deze wet bijstaan door
      een of meer deskundige werknemers. Indien in het bedrijf of de inrichting van de werkgever een ondernemingsraad
      of personeelsvertegenwoordiging is ingesteld, wordt de keuze voor de deskundige werknemer, bedoeld in de eerste
      zin, en diens positionering, bepaald met instemming van die ondernemingsraad of personeelsvertegenwoordiging.
      [Artikel 27, derde tot en met zesde lid, van de Wet op de ondernemingsraden][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
  - number: '13.2'
    text: |-
      Voorzover de mogelijkheden onvoldoende zijn om de bijstand binnen het bedrijf of de inrichting te organiseren,
      wordt de bijstand verleend door een combinatie van deskundige werknemers en andere deskundige personen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: '13.3'
    text: |-
      Indien er geen mogelijkheden zijn om de bijstand binnen het bedrijf of de inrichting te organiseren, wordt de
      bijstand verleend door andere deskundige personen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: '13.4'
    text: |-
      De werknemers en de andere deskundige personen beschikken over een zodanige deskundigheid, ervaring en uitrusting,
      zijn zodanig in aantal, gedurende zoveel tijd beschikbaar en zodanig georganiseerd, dat zij de bijstand naar
      behoren kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: '13.5'
    text: |-
      De werkgever stelt de werknemers in de gelegenheid de bijstand zelfstandig en onafhankelijk te verlenen. De
      werknemers worden uit hoofde van een juiste taakuitoefening niet benadeeld in hun positie in het bedrijf of de
      inrichting. [Artikel 21, vierde zin, van de Wet op de ondernemingsraden][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel21
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '21'
  - number: '13.6'
    text: |-
      De deskundige personen verlenen hun bijstand met behoud van hun zelfstandigheid en van hun onafhankelijkheid ten
      opzichte van de werkgever.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: '13.7'
    text: 'Het verlenen van bijstand omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: 13.7.a
    text: |-
      het verlenen van medewerking aan het verrichten en opstellen van een risico-inventarisatie en -evaluatie als
      bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
        hoofdstuk: '2'
  - number: 13.7.b
    text: |-
      het adviseren aan onderscheidenlijk nauw samenwerken met de deskundige personen, bedoeld in
      [artikel 14, eerste lid][ref1], de ondernemingsraad of de personeelsvertegenwoordiging, of, bij het ontbreken
      daarvan, de belanghebbende werknemers, inzake de genomen en de te nemen maatregelen, gericht op een zo goed
      mogelijk arbeidsomstandighedenbeleid;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: 13.7.c
    text: de uitvoering van de maatregelen, bedoeld in onderdeel b, dan wel de medewerking daaraan.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: '13.8'
    text: Een afschrift van een advies als bedoeld in het zevende lid, onderdeel b, wordt aan de werkgever gezonden.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: '13.9'
    text: |-
      In de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5][ref1], worden de maatregelen beschreven die nodig
      zijn om te voldoen aan het vierde en tiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
        hoofdstuk: '2'
  - number: '13.10'
    text: |-
      In afwijking van het eerste tot en met het derde lid, kunnen bij werkgevers met niet meer dan 25 werknemers de
      taken in het kader van de bijstand ook worden verricht door de werkgever zelf, indien deze natuurlijk persoon
      is, of door de directeur indien de werkgever rechtspersoon is, indien deze personen beschikken over voldoende
      deskundigheid, ervaring en uitrusting om deze taken naar behoren te vervullen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel13
  - number: '14.1'
    text: |-
      In aanvulling op [artikel 13][ref1] laat de werkgever zich bij de volgende taken bijstaan door een
      of meer deskundige personen ten behoeve van wie overeenkomstig [artikel 20][ref2] een certificaat is
      afgegeven of die als bedrijfsarts is ingeschreven in een erkend specialistenregister als bedoeld in
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '14'
  - number: 14.1.a
    text: |-
      het toetsen van de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5][ref1], en daarover adviseren;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
        hoofdstuk: '2'
  - number: 14.1.b
    text: |-
      het adviseren bij de begeleiding van werknemers die door ziekte niet in staat zijn hun
      arbeid te verrichten, met inbegrip van het adviseren bij de uitvoering van bij of krachtens
      [artikel 25, eerste, tweede, derde, vierde en zevende lid van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      dan wel bij of krachtens
      __REF001___________________________________________________________________________________________________________
      __ gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 14.1.c
    text: 'het uitvoeren van:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.1.c.1°
    text: |-
      het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
        hoofdstuk: '4'
  - number: 14.1.c.2°
    text: de aanstellingskeuring, indien de werkgever deze laat verrichten;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.1.c.3°
    text: |-
      de consultatie met betrekking tot gezondheidskundige vraagstukken in verband met de arbeid, anders dan de
      begeleiding, bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.2'
    text: 'Bij de toepassing van het eerste lid wordt het volgende in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.a
    text: de bijstand bij de taken, bedoeld in het eerste lid, wordt doeltreffend uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.b
    text: |-
      de bijstand bij de taak, bedoeld in het eerste lid, onderdeel a, wordt binnen het bedrijf of de inrichting
      georganiseerd;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.c
    text: |-
      voorzover de mogelijkheden onvoldoende zijn om de bijstand bij de taak, bedoeld in het eerste lid, onderdeel a,
      binnen het bedrijf of de inrichting te organiseren, wordt de bijstand verleend door een of meer andere deskundige
      personen als bedoeld in het eerste lid, aanhef;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.d
    text: |-
      de personen die de bijstand verrichten, hebben een zodanige uitrusting en zijn zodanig in aantal, gedurende zoveel
      tijd beschikbaar en zodanig georganiseerd, dat zij de bijstand bij de taken, bedoeld in het eerste lid, naar
      behoren kunnen verlenen;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.e
    text: er is een doeltreffende toegang tot de bedrijfsarts;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.f
    text: |-
      de bedrijfsarts is in de gelegenheid iedere arbeidsplaats in het bedrijf of de inrichting van de werkgever te
      bezoeken;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.g
    text: |-
      tenzij zwaarwegende argumenten zich daartegen verzetten, honoreert de bedrijfsarts een verzoek van de werknemer om
      in verband met een door hem gegeven advies dat betrekking heeft op de taken, bedoeld in het eerste lid, onder b en
      c, zo spoedig mogelijk een andere bedrijfsarts te raadplegen;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.h
    text: de bedrijfsarts heeft een adequate procedure voor het afwikkelen van klachten;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.2.i
    text: |-
      de personen die bijstand verrichten, werken nauw samen met en adviseren en verlenen medewerking
      aan de in [artikel 13, eerste lid][ref1], genoemde deskundige personen, de ondernemingsraad of de
      personeelsvertegenwoordiging, of, bij het ontbreken daarvan, de belanghebbende werknemers, inzake te nemen, genomen
      en uit te voeren maatregelen gericht op een zo goed mogelijk arbeidsomstandighedenbeleid;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
  - number: 14.2.j
    text: |-
      de bedrijfsarts adviseert over preventieve maatregelen betreffende het algemeen arbeidsomstandighedenbeleid,
      bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
        hoofdstuk: '2'
  - number: '14.3'
    text: |-
      Een afschrift van een advies als bedoeld in het eerste lid, onderdeel a, wordt door de degene die dit advies
      heeft opgesteld gezonden aan de ondernemingsraad of de personeelsvertegenwoordiging. Bij het ontbreken van een
      ondernemingsraad of personeelsvertegenwoordiging wordt een afschrift van dit advies zo spoedig mogelijk door de
      werkgever gezonden aan de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.4'
    text: |-
      De wijze waarop de bijstandverlening plaatsvindt met betrekking tot de taken, bedoeld in de
      [artikelen 9, derde lid][ref1], [14][ref2] en [14a][ref3] alsmede de daarop berustende bepalingen, wordt door of
      vanwege een overeenkomst tussen de werkgever en de deskundige personen, bedoeld in [artikel 14, eerste lid][ref4],
      schriftelijk vastgelegd. Onderdeel van de overeenkomst is de wijze waarop de in de aanhef van dit artikel genoemde
      personen in het bedrijf of de inrichting van de werkgever met inachtneming van de professionele dienstverlening
      uitvoering kunnen geven aan de verplichtingen die op grond van de in de eerste zin bedoelde taken op hen rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: 14a
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: '14.5'
    text: |-
      Aangaande de bedrijfsarts wordt in de overeenkomst, bedoeld in het vierde lid, in het bijzonder aandacht besteed
      aan de wijze waarop aan het tweede lid, onderdelen f tot en met j, en [artikel 9, derde lid][ref1], uitvoering
      wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
        hoofdstuk: '2'
  - number: '14.6'
    text: |-
      Bij de gegevensverwerking noodzakelijk voor de uitvoering van de taak, bedoeld in het eerste lid, onderdeel b, kan
      gebruik worden gemaakt van het burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.7'
    text: |-
      [Artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1] voorzover het betreft de overeenkomstige toepassing
      van de [artikelen 457][ref2] en [464, tweede lid, onder b, van Boek 7 van het Burgerlijk Wetboek][ref3], is niet
      van toepassing indien in verband met de uitvoering van deze wet handelingen worden verricht op het gebied van de
      geneeskunst door personen die zijn belast met de taken, bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel457
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel464
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '457'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '464'
  - number: '14.8'
    text: |-
      [Artikel 13, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
  - number: '14.9'
    text: |-
      De organisatie van de bijstand bij de taken, bedoeld in het eerste lid, kan, met inachtneming van het tweede lid,
      plaatsvinden bij:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.9.a
    text: collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan, of
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.9.b
    text: |-
      regeling waaromtrent de werkgever schriftelijk overeenstemming heeft bereikt met de ondernemingsraad of de
      personeelsvertegenwoordiging.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.10'
    text: |-
      Indien zowel een collectieve arbeidsovereenkomst of een regeling als bedoeld in het negende lid, onderdeel a,
      als een regeling als bedoeld in het negende lid, onderdeel b, gelden, zijn de in die overeenkomst en regelingen
      gegeven bepalingen naast elkaar van toepassing. In geval van strijd zijn de bepalingen van de collectieve
      arbeidsovereenkomst of de regeling, bedoeld in het negende lid, onderdeel a, van toepassing.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.11'
    text: |-
      Voor de toepassing van dit artikel en de daarop berustende bepalingen geldt een collectieve arbeidsovereenkomst
      als bedoeld in het negende lid, onderdeel a, en een regeling als bedoeld in het negende lid, onderdelen a en b,
      gedurende 5 jaren, te rekenen vanaf het tijdstip waarop die collectieve arbeidsovereenkomst of die regeling ingaat.
      Bij wijziging van de in de eerste zin bedoelde collectieve arbeidsovereenkomst of regeling binnen 5 jaren na
      inwerkingtreding, wordt het in de eerste zin bedoelde tijdvak beëindigd op het tijdstip van inwerkingtreding van de
      gewijzigde collectieve arbeidsovereenkomst of regeling.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.12'
    text: 'Het eerste lid, aanhef en onderdeel a, is niet van toepassing ten aanzien van de werkgever:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.12.a
    text: die werknemers arbeid laat verrichten voor een tijdsduur van in totaal ten hoogste 40 uur per week, of
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.12.b
    text: |-
      met in de regel ten hoogste 25 werknemers, indien voor het opstellen van een risico-inventarisatie en -evaluatie
      gebruik wordt gemaakt van:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.12.b.1°
    text: |-
      een model dat is opgenomen in een collectieve arbeidsovereenkomst of in een regeling door een daartoe bevoegd
      bestuursorgaan en een onverplicht karakter heeft, of
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.12.b.2°
    text: een instrument dat is aangemeld bij Onze Minister dan wel bij een door Onze Minister aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.13'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.13.a
    text: de tijdsduur van arbeid die buiten beschouwing wordt gelaten bij de toepassing van het twaalfde lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14.13.b
    text: het model en het instrument, bedoeld in het twaalfde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de bijstand bij een of meer taken als
      bedoeld in het eerste lid, onderdelen b en c, niet verplicht is met inachtneming van bij of krachtens die algemene
      maatregel van bestuur gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: '14.15'
    text: |-
      Het niet naleven van de bij of krachtens deze wet vastgestelde verplichtingen, bedoeld in het tweede lid, onder g,
      h en j, door de bedrijfsarts, de verplichting, bedoeld in het tweede lid, onder i, door de personen, bedoeld in het
      eerste lid, en de verplichting, bedoeld in het derde lid, eerste zin, door de personen, bedoeld in het eerste lid,
      wordt aangemerkt als een overtreding.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14
  - number: 14a.1
    text: |-
      Indien de bijstand bij de taken, bedoeld in [artikel 14, eerste lid][ref1], niet is georganiseerd met toepassing
      van [artikel 14, negende lid][ref2], wordt deze bijstand georganiseerd met inachtneming van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: 14a.2
    text: |-
      De werkgever laat zich met betrekking tot de taken, bedoeld in [artikel 14, eerste lid][ref1], bijstaan door een
      arbodienst, ten behoeve waarvan overeenkomstig [artikel 20][ref2] een certificaat is afgegeven en die deel uitmaakt
      van de organisatie van het bedrijf of de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: 14a.3
    text: |-
      Voorzover de mogelijkheden onvoldoende zijn om de bijstand binnen het bedrijf of de inrichting te organiseren,
      wordt de bijstand verleend door een andere arbodienst ten behoeve waarvan, overeenkomstig [artikel 20][ref1], een
      certificaat is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: 14a.4
    text: |-
      De werknemers van een arbodienst werken nauw samen met en adviseren en verlenen medewerking aan
      de in [artikel 13, eerste lid][ref1], genoemde deskundige personen, de ondernemingsraad of de
      personeelsvertegenwoordiging, of, bij het ontbreken daarvan, de belanghebbende werknemers, inzake te nemen, genomen
      en uit te voeren maatregelen gericht op een zo goed mogelijk arbeidsomstandighedenbeleid. Het niet naleven van deze
      verplichting door de werknemers van een arbodienst wordt aangemerkt als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
  - number: 14a.5
    text: |-
      [Artikel 13, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
  - number: 14a.6
    text: |-
      __REF000___________________________________________________________________________________________________________
      ________________, is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: '15.1'
    text: |-
      De werkgever laat zich ten aanzien van de naleving van zijn verplichtingen op grond van
      [artikel 3, eerste lid, onder e, van deze wet][ref1] bijstaan door een of meer werknemers die door hem zijn
      aangewezen als bedrijfshulpverleners.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
        hoofdstuk: '2'
  - number: '15.2'
    text: 'Het verlenen van de bijstand houdt in elk geval in:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15
  - number: 15.2.a
    text: het verlenen van eerste hulp bij ongevallen;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15
  - number: 15.2.b
    text: het beperken en het bestrijden van brand en het beperken van de gevolgen van ongevallen;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15
  - number: 15.2.c
    text: het in noodsituaties alarmeren en evacueren van alle werknemers en andere personen in het bedrijf of de inrichting.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15
  - number: '15.3'
    text: |-
      De bedrijfshulpverleners beschikken over een zodanige opleiding en uitrusting, zijn zodanig in aantal en zodanig
      georganiseerd dat zij de in het tweede lid genoemde taken naar behoren kunnen vervullen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15
  - number: 15a
    text: |-
      De werkgever zorgt ervoor dat de deskundige werknemers en de andere deskundige personen, bedoeld in
      [artikel 13][ref1], de personen, bedoeld in [artikel 14, eerste lid][ref2], de bedrijfshulpverleners, bedoeld in
      [artikel 15][ref3], en de arbodienst kennis kunnen nemen van:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '15'
        hoofdstuk: '3'
  - number: 15a.a
    text: |-
      de ongevalsrapportages en de lijst van arbeidsongevallen, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
        hoofdstuk: '2'
  - number: 15a.b
    text: |-
      een eis als bedoeld in [artikel 27, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel27
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '27'
        hoofdstuk: '5'
  - number: 15a.c
    text: |-
      een bevel als bedoeld in [artikel 28, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel28
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '28'
        hoofdstuk: '5'
  - number: 15a.d
    text: |-
      een bevel als bedoeld in [artikel 28a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel28a
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: 28a
        hoofdstuk: '5'
  - number: 15a.e
    text: |-
      een beschikking tot oplegging van een last onder bestuursdwang of tot oplegging van een last onder dwangsom als
      bedoeld in [artikel 28b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel28b
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: 28b
        hoofdstuk: '5'
  - number: 15a.f
    text: |-
      een verzoek om ontheffing als bedoeld in [artikel 30, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
        hoofdstuk: '6'
  - number: 15a.g
    text: |-
      een rapport als bedoeld in [artikel 36, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel36
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '36'
        hoofdstuk: '7'
  - number: 15a.h
    text: |-
      een beschikking als bedoeld in [artikel 37, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel37
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '37'
        hoofdstuk: '7'
  - number: '16.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld in verband met arbeidsomstandigheden van
      de werknemers.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '16.2'
    text: De in het eerste lid bedoelde regels
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.2.a
    text: |-
      hebben betrekking op de arbozorg en de organisatie van de arbeid, de inrichting van de arbeidsplaatsen, het werken
      met gevaarlijke stoffen en biologische agentia, de mate van fysieke belasting waaraan werknemers blootstaan, de
      fysische factoren die zich op de arbeidsplaats voordoen, de bij de arbeid gebruikte arbeidsmiddelen en persoonlijke
      beschermingsmiddelen en de op de arbeidsplaats te gebruiken veiligheids- en gezondheidssignalering en
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.2.b
    text: |-
      kunnen mede strekken ter uitvoering van de [artikelen 3][ref1], [4][ref2], [5][ref3], [8][ref4], [9][ref5],
      [13][ref6], [14][ref7], [14a][ref8], [15][ref9] en [18][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref8]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
      [ref9]: https://wetten.overheid.nl/BWBR0010346#Artikel15
      [ref10]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '8'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0010346
        artikel: '9'
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref7
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref8
        bwb_id: BWBR0010346
        artikel: 14a
        hoofdstuk: '3'
      - id: ref9
        bwb_id: BWBR0010346
        artikel: '15'
        hoofdstuk: '3'
      - id: ref10
        bwb_id: BWBR0010346
        artikel: '18'
        hoofdstuk: '4'
  - number: '16.3'
    text: 'De in het eerste en tweede lid bedoelde regels kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.3.a
    text: |-
      een verbod om bepaalde bij die maatregel omschreven arbeid te verrichten of te doen verrichten waaraan bijzondere
      gevaren voor de veiligheid of de gezondheid zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.3.b
    text: |-
      een verbod om bepaalde bij die maatregel omschreven arbeid te verrichten of te doen verrichten, indien met
      betrekking tot die arbeid niet aan de bij of krachtens die maatregel vastgestelde voorwaarden of voorschriften
      is voldaan;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.3.c
    text: |-
      een verbod om bepaalde bij die maatregel omschreven gevaarlijke stoffen of voorwerpen voorhanden te hebben, waaraan
      bijzondere gevaren voor de veiligheid of de gezondheid zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.3.d
    text: |-
      een verbod om bepaalde bij die maatregel omschreven gevaarlijke stoffen of voorwerpen voorhanden te hebben, indien
      met betrekking tot die stoffen of voorwerpen niet aan de bij of krachtens die maatregel vastgestelde voorwaarden of
      voorschriften is voldaan;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.3.e
    text: |-
      een verbod om bepaalde bij die maatregel omschreven arbeid te verrichten of te doen verrichten indien de werknemers
      niet arbeidsgezondheidskundig zijn onderzocht.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '16.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat deze wet en de daarop berustende bepalingen geheel of
      gedeeltelijk niet van toepassing zijn op:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.4.a
    text: |-
      arbeid verricht in of op een luchtvaartuig, dan wel een zeeschip of binnenvaartuig, dan wel een voertuig op een
      openbare weg of een spoor- of tramweg;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.4.b
    text: arbeid verricht in militaire dienst;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.4.c
    text: |-
      arbeid verricht door werknemers en verrichtingen als bedoeld in [artikel 2, onderdeel b][ref1], van leerlingen en
      studenten in onderwijsinrichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel2
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '2'
        hoofdstuk: '1'
  - number: 16.4.d
    text: |-
      arbeid verricht bij een verkenningsonderzoek, het opsporen of winnen van delfstoffen of aardwarmte dan wel het
      opslaan van stoffen als bedoeld in de Mijnbouwwet;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.4.e
    text: arbeid verricht binnen de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '16.5'
    text: |-
      De in het derde lid, onder e, bedoelde maatregel stelt het verrichten van arbeid slechts afhankelijk van het
      resultaat van een arbeidsgezondheidskundig onderzoek voor zover die arbeid bijzondere gevaren meebrengt voor het
      leven of de gezondheid van de werknemer zelf of van andere personen of voor zover dit om andere bijzondere redenen
      geboden is. Bij of krachtens algemene maatregel van bestuur worden met betrekking tot dit arbeidsgezondheidskundig
      onderzoek en de wijze van registratie, verwerking en bewaring van de uitslag daarvan nadere regels gesteld. Deze
      hebben in ieder geval betrekking op de gevallen waarin en de wijze waarop een verzoek tot herkeuring kan worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '16.6'
    text: 'Bij algemene maatregel van bestuur kunnen met betrekking tot de arbeid of de verrichtingen:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.6.a
    text: bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.6.b
    text: verricht in de burgerlijke openbare dienst;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.6.c
    text: |-
      verricht in een gevangenis of huis van bewaring als bedoeld in de [Penitentiaire beginselenwet][ref1],
      een justitiële inrichting voor verpleging van ter beschikking gestelden als bedoeld in de
      [Beginselenwet verpleging ter beschikking gestelden][ref2] of een inrichting als bedoeld in de
      [Beginselenwet justitiële jeugdinrichtingen][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0008765
      [ref3]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0008765
      - id: ref3
        bwb_id: BWBR0011756
  - number: '16.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting tot naleving van daarbij aangewezen
      voorschriften van deze wet of de daarop berustende bepalingen, voor zover zij betrekking hebben op arbeid waaraan
      bijzondere gevaren voor de veiligheid of de gezondheid zijn verbonden, dan wel noodzakelijk zijn ter uitvoering van
      verdragen of besluiten van volkenrechtelijke organisaties, zich mede richt tot:
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.7.a
    text: een zelfstandige;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.7.b
    text: een werkgever die deze arbeid zelf verricht;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.7.c
    text: degene bij wie vrijwilligers werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: 16.7.d
    text: een vrijwilliger.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '16.8'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting tot naleving van daarbij aangegeven
      voorschriften in de gevallen bij die maatregel omschreven rust op een ander dan de werkgever. Aangewezen kunnen
      worden de eigenaar of beheerder dan wel degene die anderszins bevoegd is te beslissen over het ontwerp, de
      vervaardiging dan wel het onderhoud van arbeidsplaatsen en arbeidsmiddelen, zoals zonodig nader bij die maatregel
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '16.9'
    text: |-
      De in het eerste lid bedoelde regels kunnen betrekking hebben op andere onderwerpen dan die genoemd in het tweede
      lid of zich richten tot andere personen dan de werkgever of de in het zevende en achtste lid bedoelde personen,
      indien dat noodzakelijk is ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties met
      betrekking tot de verbetering van de veiligheid of de gezondheid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '16.10'
    text: |-
      De werkgever, dan wel een ander dan de werkgever bedoeld in het zevende, achtste of negende lid en de werknemers
      zijn verplicht tot naleving van de voorschriften en verboden vastgesteld bij of krachtens de op grond van dit
      artikel, [artikel 20, eerste lid][ref1], en [artikel 24, negende lid][ref2], vastgestelde algemene maatregel van
      bestuur voorzover en op de wijze als bij of krachtens deze maatregel is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
        hoofdstuk: '5'
  - number: '16.11'
    text: |-
      Het niet naleven van de in het tiende lid bedoelde voorschriften en verboden kan worden aangemerkt als strafbaar
      feit.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel16
  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur kan, met inachtneming van in die maatregel gegeven voorschriften, worden
      bepaald dat aan een of meer van de krachtens deze wet vastgestelde bepalingen op een andere wijze kan worden
      voldaan dan in die bepalingen is aangegeven, echter uitsluitend bij collectieve regeling als bedoeld in
      [artikel 1:3, eerste lid van de Arbeidstijdenwet][ref1], dan wel een regeling waaromtrent de werkgever schriftelijk
      overeenstemming heeft bereikt met de ondernemingsraad of de personeelsvertegenwoordiging. Daarbij wordt te allen
      tijde in acht genomen dat geen afbreuk wordt gedaan aan het beschermingsniveau van de in de eerste volzin bedoelde
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel1
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '1'
  - number: '18'
    text: |-
      De werkgever stelt de werknemers periodiek in de gelegenheid een onderzoek te ondergaan, dat erop is gericht de
      risico's die de arbeid voor de gezondheid van de werknemers met zich brengt zoveel mogelijk te voorkomen of te
      beperken.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien in een bedrijf of een inrichting verschillende werkgevers arbeid doen verrichten, werken zij onderling op
      doelmatige wijze samen teneinde de naleving van het bij of krachtens deze wet bepaalde te verzekeren.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel19
  - number: '19.2'
    text: |-
      Alvorens werkzaamheden behorende tot een bij algemene maatregel van bestuur aangewezen categorie aanvangen zorgen
      de werkgevers ervoor dat schriftelijk is vastgelegd op welke wijze zal worden samengewerkt, welke voorzieningen
      daarbij zullen worden getroffen en op welke wijze op die voorzieningen toezicht zal worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel19
  - number: '20.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld op grond waarvan werkgevers, werknemers,
      andere personen of instellingen in het bezit moeten zijn van een of meer certificaten waaruit blijkt dat zij
      voldoen aan voorschriften, gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister dan wel een door Onze Minister op verzoek aangewezen instelling beslist op aanvraag over de
      afgifte van het certificaat en is tevens bevoegd een afgegeven certificaat in te trekken of te schorsen. De
      [Kaderwet zelfstandige bestuursorganen][ref1] is niet van toepassing op aangewezen instellingen als bedoeld in de
      eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '20.3'
    text: |-
      Een certificaat als bedoeld in het eerste lid en een aanwijzing als bedoeld in het tweede lid worden gegeven voor
      een beperkte tijdsduur. Aan een aanwijzing en een certificaat kunnen voorschriften worden verbonden. De bedoelde
      beperking en voorschriften worden in de aanwijzing en het certificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: '20.4'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld onder meer met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: 20.4.a
    text: |-
      de wijze waarop de aanvraag om een certificaat als bedoeld in het eerste lid en een aanwijzing als bedoeld in het
      tweede lid wordt gedaan en de gegevens die daarbij van de aanvrager worden verlangd;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: 20.4.b
    text: de gronden waarop een aanwijzing kan worden gegeven, gewijzigd, geschorst of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: 20.4.c
    text: |-
      de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een afgegeven
      certificaat kan worden geschorst of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: 20.4.d
    text: |-
      de vergoeding van de kosten die is verschuldigd in verband met de afgifte van een certificaat of het geven van
      een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: '20.5'
    text: |-
      De kosten van onderzoeken of nog steeds wordt voldaan aan de voorwaarden voor de afgifte van een certificaat
      onderscheidenlijk het geven van een aanwijzing, kunnen eveneens ten laste worden gebracht van de houder van het
      certificaat onderscheidenlijk de aangewezen instelling, mits deze onderzoeken en kosten zijn vastgelegd in een
      voorschrift als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: '20.6'
    text: |-
      Indien bij de afgifte van een certificaat, het geven van een aanwijzing of het verrichten van een onderzoek als
      bedoeld in het vijfde lid, diensten van derden worden benut, kunnen ook de door die derden gemaakte kosten ten
      laste worden gebracht van de houder van het certificaat onderscheidenlijk de aangewezen instelling dan wel de
      aanvrager, bedoeld in het vierde lid, onder a.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: '20.7'
    text: |-
      De berekening van de door derden gemaakte kosten als bedoeld in het zesde lid, voor zover deze ten laste worden
      gebracht van de houder van een certificaat onderscheidenlijk de aangewezen instelling dan wel de aanvrager,
      bedoeld in het vierde lid, onder a, geschiedt door die derden op zorgvuldige, transparante en éénduidige wijze met
      inachtneming van de redelijkheid en proportionaliteit.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: '20.8'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld betreffende de wijze van betaling van de vergoeding van de
      kosten, bedoeld in het vierde, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel20
  - number: '21.1'
    text: |-
      De krachtens [artikel 20, tweede lid][ref1], aangewezen instellingen verstrekken desgevraagd kosteloos aan Onze
      Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van
      zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: '21.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen de krachtens [artikel 20, tweede lid][ref1], aangewezen instellingen
      worden verplicht tot het periodiek opstellen en toezenden aan Onze Minister van een verslag van de in
      [artikel 20, tweede lid][ref2], genoemde werkzaamheden en de rechtmatigheid en doeltreffendheid van die
      werkzaamheden en werkwijze in de afgelopen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: '22.1'
    text: |-
      Onze Minister kan de krachtens [artikel 20, tweede lid][ref1], aangewezen instellingen aanwijzingen geven met
      betrekking tot de uitoefening van hun taak. Hij treedt daarbij niet in individuele gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: '22.2'
    text: |-
      De krachtens [artikel 20, tweede lid][ref1], aangewezen instellingen zijn gehouden overeenkomstig de aanwijzing,
      bedoeld in het eerste lid, te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: '23'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorzieningen worden getroffen voor het geval de krachtens
      [artikel 20, tweede lid][ref1], aangewezen instellingen hun uit deze wet voortvloeiende verplichtingen niet naar
      behoren nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: '24.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen onder hem ressorterende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.2'
    text: |-
      Met betrekking tot door Onze Minister aangewezen categorieën van arbeid zijn met het toezicht op de naleving van
      het bepaalde bij of krachtens deze wet belast of mede belast de door hem aangewezen andere ambtenaren dan de in
      het eerste lid bedoelde. Indien ambtenaren worden aangewezen die ressorteren onder een andere minister, wordt het
      besluit tot aanwijzing van die ambtenaren genomen door Onze Minister en die andere minister gezamenlijk. Van een
      besluit als bedoeld in het eerste lid en in dit lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.3'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.4'
    text: |-
      De toezichthouder is voorts bevoegd te allen tijde ter zake van een arbeidsongeval een onderzoek in te stellen. Hij
      stelt naar aanleiding van dat onderzoek een rapport op.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.5'
    text: |-
      De toezichthouder stelt ter voldoening aan [artikel 5:18, zesde lid, van de Algemene wet bestuursrecht][ref1]
      een rapport op; dit rapport en een rapport als bedoeld in het vierde lid zendt hij aan de werkgever, aan de
      ondernemingsraad of aan de personeelsvertegenwoordiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '24.6'
    text: |-
      De toezichthouder is bevoegd bij het verwerken van persoonsgegevens gebruik te maken van het burgerservicenummer
      voorzover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.7'
    text: |-
      De toezichthouder geeft zo spoedig mogelijk gehoor aan het verzoek om een onderzoek in te stellen, gedaan door
      de ondernemingsraad of de personeelsvertegenwoordiging, dan wel door een vereniging van werknemers, die krachtens
      haar statuten ten doel heeft de belangen van haar leden als werknemers te behartigen en als zodanig in de betrokken
      onderneming of bedrijfstak werkzaam is en in het bezit is van volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.8'
    text: |-
      Ten dienste van het onderzoek naar een overtreding is de toezichthouder, voor zover dat voor de vervulling van
      zijn taak redelijkerwijs nodig is, bevoegd ieder staande te houden en te vorderen dat hij zijn naam, voornamen,
      geboortedatum en geboortejaar en adres opgeeft.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in de bij of krachtens die maatregel te
      bepalen gevallen en wijze degene die arbeid verricht of doet verrichten in de territoriale zee of de exclusieve
      economische zone, verplicht is de toezichthouder bij de uitoefening van zijn bevoegdheden te vervoeren naar door de
      toezichthouder aan te duiden plaatsen waar deze arbeid wordt of zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '24.10'
    text: |-
      Gelet op artikel 9, tweede lid, onderdeel b, van de Algemene verordening gegevensbescherming, is het verbod om
      gegevens over gezondheid te verwerken niet van toepassing indien de verwerking geschiedt door de toezichthouder,
      voor zover de verwerking noodzakelijk is voor het onderzoek naar arbeidsongevallen die leiden tot de dood, een
      blijvend letsel of een ziekenhuisopname als bedoeld in [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
        hoofdstuk: '2'
  - number: '24.11'
    text: |-
      Indien toepassing wordt gegeven aan het tiende lid worden de gegevens over gezondheid alleen verwerkt door personen
      die uit hoofde van ambt, beroep of wettelijk voorschrift dan wel krachtens een overeenkomst tot geheimhouding zijn
      verplicht.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel24
  - number: '25'
    text: |-
      Onze Minister ziet toe op de rechtmatige en doeltreffende uitvoering van het bepaalde bij en krachtens deze wet
      door krachtens [artikel 20, tweede lid][ref1], aangewezen instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: '26'
    text: |-
      De toezichthouders zijn, behoudens tegenover hen aan wier gezag zij uit kracht van hun ambt zijn onderworpen,
      verplicht tot geheimhouding van de namen van de personen door wie een klacht is ingediend of aangifte is gedaan van
      een overtreding van deze wet en de daarop berustende bepalingen, behoudens wanneer deze personen hun schriftelijk
      hebben verklaard tegen de mededeling van hun namen geen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel26
  - number: '27.1'
    text: |-
      Een daartoe aangewezen toezichthouder kan aan een werkgever een eis stellen betreffende de wijze waarop een of meer
      bepalingen gesteld bij of krachtens deze wet moeten worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel27
  - number: '27.2'
    text: |-
      Een eis vermeldt van welke regelen hij de wijze van naleving bepaalt en bevat de termijn waarbinnen eraan moet
      zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel27
  - number: '27.3'
    text: |-
      De werkgever is verplicht om aan de eis te voldoen. De werknemers zijn verplicht aan de eis te voldoen voor zover
      zulks bij de eis is bepaald. De werkgever draagt zorg dat de werknemers van de op hen rustende verplichting zo
      spoedig mogelijk in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel27
  - number: '27.4'
    text: |-
      Voor de toepassing van de vorige leden worden met een werkgever gelijkgesteld: de in
      [artikel 16, zevende, achtste en negende lid][ref1], bedoelde personen voor zover het betreft de krachtens dat
      artikel omschreven verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '16'
        hoofdstuk: '4'
  - number: '27.5'
    text: |-
      Een eis kan worden gesteld tot naleving van de [artikelen 3][ref1],
      [4][ref2], [5][ref3], [6][ref4], [8][ref5], [11][ref6],
      [13, eerste lid, eerste volzin, en tweede tot en met vierde lid, zevende lid, onder b, negende en tiende lid][ref7]
      , [14, eerste lid, tweede lid, onder a tot en met f, vierde en vijfde lid][ref8],
      [14a, tweede, derde en vierde lid][ref9], [15, eerste en derde lid][ref10], [16][ref11], voor zover dat bij de
      krachtens dat artikel gestelde regels is bepaald, [18][ref12] en [19][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0010346#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0010346#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref8]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref9]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
      [ref10]: https://wetten.overheid.nl/BWBR0010346#Artikel15
      [ref11]: https://wetten.overheid.nl/BWBR0010346#Artikel16
      [ref12]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref13]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0010346
        artikel: '8'
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0010346
        artikel: '11'
        hoofdstuk: '2'
      - id: ref7
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref8
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref9
        bwb_id: BWBR0010346
        artikel: 14a
        hoofdstuk: '3'
      - id: ref10
        bwb_id: BWBR0010346
        artikel: '15'
        hoofdstuk: '3'
      - id: ref11
        bwb_id: BWBR0010346
        artikel: '16'
        hoofdstuk: '4'
      - id: ref12
        bwb_id: BWBR0010346
        artikel: '18'
        hoofdstuk: '4'
      - id: ref13
        bwb_id: BWBR0010346
        artikel: '19'
        hoofdstuk: '4'
  - number: '27.6'
    text: |-
      Een eis kan worden gesteld tot naleving van [artikel 14, tweede lid, onder g, h en j][ref1], waarbij voor de
      toepassing van het eerste tot en met derde lid de bedrijfsarts met de werkgever gelijk wordt gesteld en tot
      naleving van artikel 14, tweede lid, onder i, waarbij voor de toepassing van het eerste tot en met derde lid de in
      [artikel 14, eerste lid][ref2], bedoelde personen met de werkgever gelijk worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: '28.1'
    text: |-
      Een daartoe aangewezen toezichthouder is bevoegd mondeling of bij gedagtekend schrijven te bevelen, dat personen
      niet mogen blijven in door hem aangewezen plaatsen, of dat door hem aangewezen werkzaamheden worden gestaakt dan
      wel niet mogen worden aangevangen, indien naar zijn redelijk oordeel dat verblijf of die werkzaamheden ernstig
      gevaar opleveren voor personen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28
  - number: '28.2'
    text: |-
      Een mondeling bevel wordt zo spoedig mogelijk schriftelijk bevestigd aan de werkgever of aan de andere personen,
      bedoeld in [artikel 16, zevende, achtste en negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '16'
        hoofdstuk: '4'
  - number: '28.3'
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, geldt mede in die gevallen, waarin op grond van het bepaalde in
      [artikel 27][ref1] aan een gestelde eis nog geen uitvoering behoeft te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel27
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '27'
        hoofdstuk: '5'
  - number: '28.4'
    text: |-
      Zodra naar het oordeel van de toezichthouder die een bevel als bedoeld in het eerste lid gaf, geen ernstig gevaar
      meer aanwezig is, trekt hij het bevel in.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28
  - number: '28.5'
    text: |-
      De toezichthouder, die een bevel als bedoeld in het eerste lid gegeven heeft, is bevoegd met betrekking tot
      dit bevel de nodige maatregelen te treffen, de nodige aanwijzingen te geven en de hulp van de sterke arm in te
      roepen. De maatregelen en aanwijzingen kunnen onder meer betrekking hebben op het verzegelen van arbeidsmiddelen
      en arbeidsplaatsen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28
  - number: '28.6'
    text: |-
      Ieder wie zulks aangaat is verplicht zich te gedragen overeenkomstig een bevel, als bedoeld in het eerste lid en
      een aanwijzing als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28
  - number: 28a.1
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar kan, nadat een overtreding van een
      voorschrift of verbod bij of krachtens deze wet is geconstateerd die bestuurlijk beboetbaar is gesteld of op
      grond van de [Wet op de economische delicten][ref1] strafbaar is gesteld, aan de werkgever of de zelfstandige
      een schriftelijke waarschuwing geven dat bij herhaling van de overtreding of bij een latere overtreding van
      eenzelfde in de waarschuwing aangegeven wettelijke verplichting of verbod of bij of krachtens algemene maatregel
      van bestuur aan te wijzen soortgelijke verplichtingen of verboden, door hem een bevel kan worden opgelegd dat door
      hem aangewezen werkzaamheden voor ten hoogste drie maanden worden gestaakt dan wel niet mogen worden aangevangen.
      [De artikelen 24, tweede lid][ref2], en [27, vierde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel27
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002063
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '27'
        hoofdstuk: '5'
  - number: 28a.2
    text: |-
      Indien een waarschuwing als bedoeld in het eerste lid is gegeven en herhaling van de overtreding of een latere
      overtreding als bedoeld in het eerste lid is geconstateerd, kan door de ambtenaar, bedoeld in het eerste lid, aan
      de werkgever of de zelfstandige bij beschikking een bevel als bedoeld in het eerste lid worden opgelegd dat wordt
      opgevolgd met ingang van het in de beschikking aangeven tijdstip. Deze beschikking wordt niet gegeven zolang wegens
      de eerste overtreding, bedoeld in het eerste lid, nog niet een bestuurlijke boete is opgelegd of een proces-verbaal
      is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28a
  - number: 28a.3
    text: |-
      De constatering van de overtreding, bedoeld in het eerste of tweede lid, wordt vastgelegd in een boeterapport of
      proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28a
  - number: 28a.4
    text: |-
      De waarschuwing, bedoeld in het eerste lid, vervalt indien na de dagtekening van de waarschuwing vijf jaren zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28a
  - number: 28a.5
    text: |-
      De ambtenaar, bedoeld in het eerste lid, is bevoegd met betrekking tot het bevel, bedoeld in het tweede lid, de
      nodige maatregelen te treffen, de nodige aanwijzingen te geven en de hulp van de sterke arm in te roepen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28a
  - number: 28a.6
    text: |-
      Ieder wie zulks aangaat is verplicht zich te gedragen overeenkomstig een bevel als bedoeld in het tweede lid en een
      maatregel of aanwijzing als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28a
  - number: 28a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28a
  - number: 28b
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar is bevoegd tot oplegging van een
      last onder bestuursdwang ter zake van de naleving van [artikel 5:20 van de Algemene wet bestuursrecht][ref1],
      voor zover het de verplichting betreft tot het verlenen van medewerking aan de toezichthouder, de
      [artikelen 24, negende lid][ref2], [28, eerste lid][ref3], en [28a, tweede lid][ref4], en de daartoe bij algemene
      maatregel van bestuur aangewezen bepalingen krachtens deze wet. Artikel 24, tweede lid, is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel28a
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '28'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: 28a
        hoofdstuk: '5'
  - number: '29.1'
    text: |-
      Een werknemer is bevoegd het werk te onderbreken en de onderbreking voort te zetten, indien en zolang naar zijn
      redelijk oordeel ernstig gevaar voor personen als bedoeld in [artikel 28][ref1] aanwezig is en naar zijn redelijk
      oordeel het gevaar zo onmiddellijk dreigt dat een toezichthouder niet tijdig kan optreden. Voor de duur van de
      onderbreking behoudt de werknemer zijn aanspraak op het naar tijdruimte vastgesteld loon. De werknemer mag als
      gevolg van de werkonderbreking niet worden benadeeld in zijn positie in het bedrijf of in de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel28
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '28'
        hoofdstuk: '5'
  - number: '29.2'
    text: |-
      Degene die stelt dat de werknemer de aanwezigheid van onmiddellijk dreigend gevaar als bedoeld in het eerste lid op
      grond van de feiten waarop hij zich beroept, niet naar zijn redelijk oordeel mocht aannemen, moet dit bewijzen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29
  - number: '29.3'
    text: |-
      Indien de onderbreking van het werk geschiedt buiten weten van de werkgever onderscheidenlijk de bij de arbeid
      betrokken leidinggevende persoon, moet de werknemer de onderbreking terstond bij deze melden.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29
  - number: '29.4'
    text: |-
      De onderbreking van het werk wordt zo spoedig mogelijk ter kennis gebracht van de daartoe aangewezen
      toezichthouder, die een bevel geeft krachtens [artikel 28, eerste lid][ref1], of verklaart, zo nodig onder het
      stellen van een eis als bedoeld in [artikel 27][ref2], dat de arbeid kan worden verricht. Door de beschikking van
      de daartoe aangewezen toezichthouder eindigt de bevoegdheid van de werknemer de werkonderbreking voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel27
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '28'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '27'
        hoofdstuk: '5'
  - number: 29a.1
    text: |-
      Bestuursorganen en een instelling als bedoeld in [artikel 20, tweede lid][ref1], zijn bevoegd uit eigen beweging en
      verplicht desgevraagd aan Onze Minister en de toezichthouder kosteloos alle gegevens en inlichtingen te verstrekken
      die noodzakelijk zijn voor de uitvoering en het toezicht op de naleving van het bepaalde bij of krachtens deze wet
      en dit noodzakelijk is ten behoeve van een samenwerkingsverband tussen twee of meer van de voornoemde instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: 29a.2
    text: |-
      Onze Minister en de toezichthouder verstrekken andere bestuursorganen en een instelling als bedoeld in
      [artikel 20, tweede lid][ref1], kosteloos alle gegevens en inlichtingen, die zijn verkregen door de uitvoering of
      het toezicht op de naleving van het bepaalde bij of krachtens deze wet, welke noodzakelijk zijn voor de uitvoering
      van hun wettelijke taak en dit noodzakelijk is ten behoeve van een samenwerkingsverband tussen twee of meer van de
      voornoemde instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: 29a.3
    text: |-
      Onze Minister, bestuursorganen, de toezichthouder en een instelling als bedoeld in [artikel 20, tweede lid][ref1],
      kunnen bij het verwerken van persoonsgegevens gebruik maken van het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: 29a.4
    text: |-
      De gegevensverstrekking, bedoeld in het eerste en tweede lid, vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29a
  - number: 29a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel29a
  - number: '30.1'
    text: |-
      Onze Minister kan met betrekking tot categorieën van bedrijven, inrichtingen, of arbeidsverhoudingen vrijstelling
      verlenen van de voorschriften zoals die bij of krachtens de [artikelen 5][ref1], [12 tot en met 18][ref2] en
      [20][ref3] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel20
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '20'
        hoofdstuk: '4'
  - number: '30.2'
    text: |-
      Een daartoe aangewezen toezichthouder kan met betrekking tot een individueel bedrijf of inrichting ontheffing
      verlenen van de in het eerste lid bedoelde voorschriften, tenzij met betrekking tot een dergelijk voorschrift een
      eis is gesteld.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: '30.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld inzake het verlenen van vrijstellingen of
      ontheffingen als bedoeld in het eerste onderscheidenlijk tweede lid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: '30.4'
    text: Een vrijstelling of een ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: '30.5'
    text: Aan een vrijstelling of een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: '30.6'
    text: 'Een vrijstelling onderscheidenlijk ontheffing kan worden ingetrokken wanneer:'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: 30.6.a
    text: een of meer der redenen waarom zij is verleend is of zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: 30.6.b
    text: een of meer van de daaraan verbonden voorschriften niet wordt of worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: 30.6.c
    text: |-
      zich na de verlening zodanige feiten of omstandigheden voordoen dat, indien deze ten tijde van de verlening bekend
      waren geweest, de vrijstelling of ontheffing niet of niet in die vorm zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel30
  - number: '31.1'
    text: |-
      Tegen een beschikking op grond van deze wet van een ambtenaar als bedoeld in [artikel 24, tweede lid][ref1], kan
      door een belanghebbende administratief beroep worden ingesteld bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
        hoofdstuk: '5'
  - number: '31.2'
    text: |-
      Een beschikking op grond van deze wet van een ambtenaar als bedoeld in de [artikelen 24, eerste lid][ref1],
      [28a, eerste lid][ref2], [28b][ref3], en [34, eerste lid][ref4], wordt gegeven namens Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel28b
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel34
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: 28a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: 28b
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '34'
        hoofdstuk: '7'
  - number: '32'
    text: |-
      Het is de werkgever verboden handelingen te verrichten of na te laten in strijd met deze wet of de daarop
      berustende bepalingen indien daardoor, naar hij weet of redelijkerwijs moet weten, levensgevaar of ernstige schade
      aan de gezondheid van een of meer werknemers ontstaat of te verwachten is.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel32
  - number: '33.1'
    text: |-
      Als overtreding wordt aangemerkt het niet naleven van de [artikelen 3][ref1], [4, eerste lid][ref2], [5][ref3],
      [6, eerste lid, eerste volzin][ref4], [8][ref5], [9, eerste en tweede lid][ref6], [10][ref7], [11][ref8],
      [13, eerste lid, eerste volzin, en tweede tot en met vierde lid, zevende lid, onder b, negende en tiende lid][ref9]
      , [14, eerste lid, tweede lid, onder a tot en met f, derde lid, tweede zin, vierde en vijfde lid][ref10],
      [14a, tweede en derde lid][ref11], [15, eerste en derde lid][ref12], [18][ref13] en [19][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0010346#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0010346#Artikel10
      [ref8]: https://wetten.overheid.nl/BWBR0010346#Artikel11
      [ref9]: https://wetten.overheid.nl/BWBR0010346#Artikel13
      [ref10]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref11]: https://wetten.overheid.nl/BWBR0010346#Artikel14a
      [ref12]: https://wetten.overheid.nl/BWBR0010346#Artikel15
      [ref13]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref14]: https://wetten.overheid.nl/BWBR0010346#Artikel19
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0010346
        artikel: '8'
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0010346
        artikel: '9'
        hoofdstuk: '2'
      - id: ref7
        bwb_id: BWBR0010346
        artikel: '10'
        hoofdstuk: '2'
      - id: ref8
        bwb_id: BWBR0010346
        artikel: '11'
        hoofdstuk: '2'
      - id: ref9
        bwb_id: BWBR0010346
        artikel: '13'
        hoofdstuk: '3'
      - id: ref10
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref11
        bwb_id: BWBR0010346
        artikel: 14a
        hoofdstuk: '3'
      - id: ref12
        bwb_id: BWBR0010346
        artikel: '15'
        hoofdstuk: '3'
      - id: ref13
        bwb_id: BWBR0010346
        artikel: '18'
        hoofdstuk: '4'
      - id: ref14
        bwb_id: BWBR0010346
        artikel: '19'
        hoofdstuk: '4'
  - number: '33.2'
    text: |-
      Als overtreding wordt tevens aangemerkt het niet naleven van de [artikelen 6, eerste lid, tweede volzin][ref1], en
      [16, tiende lid][ref2], voor zover het niet naleven van de in die artikelleden bedoelde voorschriften en verboden
      bij of krachtens algemene maatregel van bestuur is aangemerkt als overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '16'
        hoofdstuk: '4'
  - number: '33.3'
    text: |-
      Geen bestuurlijke boete kan worden opgelegd ter zake van bij of krachtens deze wet strafbaar gestelde
      feiten of ter zake van deze wet in de [Wet op de economische delicten][ref1] strafbaar gestelde feiten,
      met uitzondering van de strafbare feiten, bedoeld in [artikel 6, derde lid][ref2], van deze wet en
      [artikel 1, onder 1°, van de Wet op de economische delicten][ref3] ten aanzien van artikel 6, eerste lid, eerste
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002063
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '34.1'
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar legt de bestuurlijke boete op aan de
      overtreder op wie de verplichtingen rusten die voortvloeien uit deze wet en de daarop berustende bepalingen, voor
      zover het niet naleven daarvan is aangeduid als overtreding.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
  - number: '34.2'
    text: De ambtenaar, bedoeld in het eerste lid, is niet reeds aangewezen als toezichthouder.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
  - number: '34.3'
    text: |-
      De bestuurlijke boete die voor een overtreding kan worden opgelegd bedraagt ten hoogste het bedrag van de vijfde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '34.4'
    text: |-
      De bestuurlijke boete die voor een overtreding van [artikel 6, eerste lid][ref1], of voor het niet naleven van
      een voorschrift of verbod bij of krachtens de algemene maatregel van bestuur, bedoeld in artikel 6, eerste lid,
      voor zover aangemerkt als overtreding, kan worden opgelegd bedraagt ten hoogste het bedrag van de zesde categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '34.5'
    text: |-
      Onverminderd het derde en vierde lid verhoogt de op grond van het eerste lid aangewezen ambtenaar de op te leggen
      bestuurlijke boete met 100 procent van het boetebedrag, vastgesteld op grond van het tiende lid, indien binnen een
      tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding een eerdere overtreding, bestaande
      uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven van bij of krachtens
      algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is geconstateerd en de
      bestuurlijke boete wegens de eerdere overtreding onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
  - number: '34.6'
    text: |-
      De verhoging van de bestuurlijke boete, bedoeld in het vijfde lid, bedraagt 200 procent indien zowel de overtreding
      als de eerdere overtreding, bedoeld in dat lid, bij of krachtens algemene maatregel van bestuur zijn aangewezen als
      ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
  - number: '34.7'
    text: |-
      Onverminderd het derde en vierde lid verhoogt de op grond van het eerste lid aangewezen ambtenaar de op te leggen
      bestuurlijke boete met 200 procent van het boetebedrag, vastgesteld op grond van het tiende lid, indien binnen een
      tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding twee maal een eerdere overtreding,
      bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven van bij of
      krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is geconstateerd en
      de bestuurlijke boeten wegens de eerdere overtredingen onherroepelijk zijn geworden.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
  - number: '34.8'
    text: |-
      Voor de toepassing van het vijfde en zevende lid wordt met een onherroepelijke bestuurlijke boete gelijkgesteld een
      onherroepelijke strafrechtelijke sanctie wegens een overtreding als bedoeld in [artikel 6, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel6
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '6'
        hoofdstuk: '2'
  - number: '34.9'
    text: |-
      In afwijking van het vijfde en zevende lid is het tijdvak van vijf jaar in die leden tien jaar indien de
      onherroepelijke boetes, bedoeld in die leden, zijn opgelegd wegens bij of krachtens algemene maatregel van bestuur
      aangewezen ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
  - number: '34.10'
    text: |-
      Onze Minister stelt beleidsregels vast waarin de boetebedragen voor de overtredingen worden vastgesteld.
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is van toepassing indien een artikel gesteld bij of
      krachtens deze wet op grond waarvan een bestuurlijke boete kan worden opgelegd, niet is nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '34.11'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep de
      hoogte van de boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '36.1'
    text: |-
      Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1] vermeldt het rapport naast de
      overtreder in ieder geval de andere bij de overtreding betrokken persoon of personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '36.2'
    text: |-
      Het rapport wordt toegezonden aan de daartoe op grond van [artikel 34, eerste lid][ref1], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel34
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '34'
        hoofdstuk: '7'
  - number: '36.3'
    text: |-
      Een afschrift van het rapport wordt toegezonden of uitgereikt aan de andere bij de overtreding betrokken persoon of
      personen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel36
  - number: '37'
    text: |-
      Een afschrift van de boetebeschikking wordt toegezonden of uitgereikt aan de andere bij de overtreding betrokken
      persoon of personen, bedoeld in [artikel 36, eerste lid][ref1], en in voorkomend geval, desgevraagd aan zijn of hun
      nabestaande of nabestaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel36
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '36'
        hoofdstuk: '7'
  - number: '38'
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan de daartoe op grond van
      [artikel 34, eerste lid][ref1], aangewezen ambtenaar de inlichtingen te verstrekken die voor de tenuitvoerlegging
      van de boete van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel34
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '34'
        hoofdstuk: '7'
  - number: '43'
    text: |-
      Indien een bestuurlijke boete ten onrechte is opgelegd, wordt deze binnen zes weken nadat is vastgesteld dat de
      bestuurlijke boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel43
  - number: '44'
    text: |-
      De kosten die zijn verbonden aan de naleving van de regels die bij of krachtens deze wet zijn gesteld, worden niet
      ten laste van de werknemers gebracht.
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel44
  - number: '45'
    text: |-
      Op schriftelijke afspraken die zijn gemaakt overeenkomstig [artikel 14, vierde lid][ref1], zoals dat artikellid
      luidde de dag voorafgaand aan het tijdstip van inwerkingtreding van de Wet van 25 januari 2017 tot wijziging van
      de Arbeidsomstandighedenwet in verband met de versterking van de betrokkenheid van de werkgevers en werknemers
      bij de arbodienstverlening, de preventie in het bedrijf of de inrichting van de werkgever, en de randvoorwaarden
      voor het handelen van de bedrijfsarts (Stb. 2017, 22), blijft artikel 14, vierde lid, zoals dat artikellid
      luidde de dag voorafgaand aan het tijdstip van inwerkingtreding van die wet, van toepassing tot de datum waarop
      die afspraken expireren, doch uiterlijk tot een jaar na inwerkingtreding van die wet. Tot dat tijdstip is
      [artikel 14, vijfde lid][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
        hoofdstuk: '3'
  - number: '46'
    text: 'Deze wet wordt aangehaald als: Arbeidsomstandighedenwet.'
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel46
