        artikel: 77e
  - number: 1.3.l.3°
    text: |-
      als bedoeld in [artikel 16, zesde lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0010346/2019-01-01#Artikel1
    references:
      - id: ref1
