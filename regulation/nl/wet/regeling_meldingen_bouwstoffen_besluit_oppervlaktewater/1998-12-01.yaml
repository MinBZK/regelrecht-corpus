preamble:
  text: |-
    Gelet op artikel 2b, derde lid, van de Wet verontreiniging oppervlaktewateren, gelet op de artikelen 18, tweede lid
    en 21, tweede lid, van het Bouw-stoffenbesluit bodem- en oppervlaktewaterenbescherming;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009947/1998-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Degene die voornemens is schone grond, categorie 1-grond dan wel categorie 1-bouwstoffen in de zin van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] te gebruiken in oppervlaktewater of op of in de
      bodem onder oppervlaktewater, verstrekt de in de bij dit besluit behorende bijlage vastgestelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0009947/1998-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: '2'
    text: |-
      Deze regeling treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de dagtekening van de
      Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009947/1998-12-01#Artikel2
  - number: '3'
    text: 'Deze regeling wordt aangehaald als: Regeling meldingen Bouwstoffen-besluit oppervlaktewater.'
    url: https://wetten.overheid.nl/BWBR0009947/1998-12-01#Artikel3
