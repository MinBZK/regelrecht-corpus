articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *accreditatie:* het verlenen van toestemming voor ontvangst, beheer, vernietiging en verwerking van gerubriceerde
      informatie;
        - *bijzondere informatie:* informatie waar kennisname door niet-geautoriseerden nadelige gevolgen kan hebben voor
      de (vitale) belangen van de Nederlandse staat, voor zijn bondgenoten of voor één of meer ministeries;
        - *compromittering:* kennisname dan wel mogelijkheid tot kennisname van bijzondere informatie door niet
      geautoriseerden;
        - *informatiesysteem:* een samenhangend geheel van gegevensverzamelingen, en de daarbij behorende personen,
      procedures, processen en programmatuur alsmede de voor het informatiesysteem getroffen voorzieningen voor opslag,
      verwerking en communicatie;
        - *Rijksdienst:* alle organisatieonderdelen waarvoor de ministeriële verantwoordelijkheid onverkort geldt;
        - *rubriceren:* bepalen van het rubriceringsniveau en -duur van de bijzondere informatie op basis van de te
      verwachten nadelige gevolgen voor de vitale belangen van Nederland en de Nederlandse staat, voor zijn bondgenoten
      of voor één of meer ministeries als (een deel van) deze informatie bekend wordt bij niet-geautoriseerden;
        - *rubriceringsambtenaar:* ambtenaar bevoegd tot het vaststellen van rubriceringen, hiertoe gemandateerd door de
      secretaris-generaal;
        - *rubriceringsniveau:* aanduiding van de verwachte nadelige gevolgen voor de vitale belangen van Nederland en
      de Nederlandse staat, voor zijn bondgenoten of voor één of meer ministeries als de informatie of een deel daarvan
      bekend wordt bij niet- geautoriseerden;
        - *vaststeller van de rubricering:* minister, staatssecretaris, secretaris-generaal of een door de secretaris-
      generaal gemandateerd rubriceringsambtenaar;
        - *verwerking:* een bewerking of een geheel van bewerkingen met betrekking tot bijzondere informatie, al dan
      niet uitgevoerd via geautomatiseerde procedés, zoals het verzamelen, vastleggen, ordenen, structureren, opslaan,
      bijwerken of wijzigen, opvragen, raadplegen, gebruiken, verstrekken door middel van doorzending, verspreiden of
      op andere wijze ter beschikking stellen, aligneren of combineren, afschermen, wissen of vernietigen van bijzondere
      informatie;
        - *zorgdrager:* degene die bij of krachtens de wet belast is met de zorg voor de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel1
  - number: '2'
    text: |-
      1 Dit besluit geldt voor de Rijksdienst.

      2 Dit besluit is van toepassing op de beveiliging van bijzondere informatie van de Rijksdienst onverminderd
      het bepaalde in het [Besluit voorschrift informatie beveiliging rijksdienst 2007][ref1] (VIR 2007), het
      [Besluit BVA-stelsel Rijksdienst 2021][ref2] en het [Besluit CIO-stelsel Rijksdienst 2021][ref3].

      3 Bijzondere informatie die krachtens een verdrag of internationale overeenkomst is verkregen, behoudt de
      toegekende rubricering en wordt beveiligd volgens het overeenkomstige nationale beveiligingsniveau. Voor zover voor
      de beveiliging van dergelijke informatie als gevolg van het verdrag of de internationale overeenkomst afwijkende
      bepalingen bestaan worden deze bepalingen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022141
      [ref2]: https://wetten.overheid.nl/BWBR0044617
      [ref3]: https://wetten.overheid.nl/BWBR0044613
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel2
    references:
