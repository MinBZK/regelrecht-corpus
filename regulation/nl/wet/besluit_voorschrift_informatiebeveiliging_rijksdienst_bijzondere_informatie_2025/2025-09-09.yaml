  - number: '3'
    text: |-
      1 Het ministeriële beveiligingsbeleid dat door de secretaris-generaal van het betreffende ministerie wordt
      vastgesteld omvat ten minste de uitgangspunten voor de beveiliging van, de toegang tot, het omgaan met en verwerken
      van bijzondere informatie zoals bedoeld in dit voorschrift en de wijze waarop:

      a. het ministerie informatie rubriceert;

      b. de secretaris-generaal van het betreffende ministerie vooraf accreditatie verleent voor het verwerken van
      bijzondere informatie;

      c. het ministerie toezicht uitoefent op de beveiliging van bijzondere informatie.

      2 De beveiligingsautoriteit dan wel beveiligingsautoriteit Rijk heeft de volgende taken:

      a. het bewaken van het integrale karakter en de consistentie van rijksbrede kaders voor integrale beveiliging,
      het bevorderen van een departementale dan wel interdepartementale aanpak van beveiligingsvraagstukken, alsmede het
      toezicht op de werking van de integrale beveiliging van de Rijksdienst;

      b. de coördinatie van de integrale aanpak van de beveiliging van gerubriceerde informatie;

      c. wanneer er sprake is van een inbreuk op de beveiliging, worden onmiddellijk maatregelen dan wel
      noodmaatregelingen getroffen om verdere inbreuk te voorkomen;

      d. het onderzoeken of en wanneer compromittering van bijzondere informatie heeft plaatsgevonden. Indien dit
      het geval is, doen zij hiervan mededeling aan de secretaris-generaal en adviseren zij over de noodzaak om een
      commissie van onderzoek in te stellen. Tevens doen zij, indien van toepassing, melding conform de geldende wet-
      en regelgeving.

      3 De beveiligingsautoriteit dan wel beveiligingsautoriteit Rijk betrekt bij zijn taken, genoemd in het tweede lid,
      het advies van de chief information officer dan wel chief information officer Rijk wanneer beveiligingsvraagstukken
      een digitale component hebben.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel3
  - number: '4'
    text: |-
      1 Informatie waarvan de geheimhouding vanwege de vitale belangen van Nederland en de Nederlandse staat, van zijn
      bondgenoten of één of meer ministeries is geboden, moet worden voorzien van een passend niveau van rubricering.

      2 Bijzondere informatie wordt als volgt gerubriceerd:

      a. Staatsgeheim ZEER GEHEIM, afgekort ‘Stg.ZG’ of ‘Stg. ZEER GEHEIM’, indien kennisname door niet-geautoriseerden
      zeer ernstige schade kan toebrengen aan een van de vitale belangen van Nederland en de Nederlandse staat, of zijn
      bondgenoten;

      b. Staatsgeheim GEHEIM, afgekort ‘Stg.G‘ of ‘Stg. GEHEIM‘, indien kennisname door niet-geautoriseerden ernstige
      schade kan toebrengen aan een van de vitale belangen van Nederland en de Nederlandse staat, of zijn bondgenoten;

      c. Staatsgeheim CONFIDENTIEEL, afgekort ‘Stg.C’ of ‘Stg. CONFIDENTIEEL’, indien kennisname door niet-
      geautoriseerden schade kan toebrengen aan een van de vitale belangen van Nederland en de Nederlandse staat, of
      zijn bondgenoten;

      d. Departementaal VERTROUWELIJK, afgekort ‘Dep.V’ of ‘Dep. VERTROUWELIJK’, indien kennisname door niet-
      geautoriseerden schade kan toebrengen aan de belangen van één of meerdere ministeries of bondgenoten van de
      Nederlandse staat.

      3 De opsteller van de informatie doet een voorstel tot rubricering en brengt deze aan op de informatie. De
      vaststeller van de inhoud van de informatie stelt tevens de rubricering vast.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel4
  - number: '5'
    text: |-
      1 Rubriceringen worden verbonden aan een maximum tijdsverloop of aan een bepaalde gebeurtenis. Na die periode of
      na die gebeurtenis weegt de vaststeller van bijzondere informatie af of herziening, dan wel beëindiging van de
      rubricering, aan de orde is.

      2 Van het eerste lid kan worden afgeweken in die gevallen waarin de rubricering betrekking heeft op:

      a. Bijzondere informatie die krachtens een verdrag of internationale overeenkomst is verkregen;

      b. Staatsgeheimen die door de wet als zodanig zijn aangewezen.

      3 Uitsluitend de vaststeller van de rubricering is bevoegd de rubricering te herzien of te beëindigen.

      4 Bij overbrenging van bijzondere informatie naar een rijksarchiefbewaarplaats als bedoeld in de
      [Archiefwet 1995][ref1] vervalt de rubricering, tenzij de zorgdrager, na advies van de algemene rijksarchivaris en
      de rubriceringsambtenaar, bepaalt dat deze gehandhaafd dan wel herzien moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '6'
    text: |-
      1 Bijzondere informatie en de verwerking ervan worden zodanig beveiligd dat:

      a. alleen personen die daartoe zijn geautoriseerd, de informatie verwerken voor zover dit noodzakelijk is voor een
      goede uitoefening van hun taak;

      b. passende maatregelen zijn getroffen om compromittering tijdig te detecteren, en een onderzoeksproces is
      ingericht voor de grondige analyse van dergelijke incidenten.

      2 De beveiliging is ingericht op basis van risicomanagement. De bijlage bij dit besluit bevat de uitgangspunten
      en het minimale beveiligingsniveau voor de bescherming van de vertrouwelijkheid van bijzondere informatie en de
      verwerking ervan in informatiesystemen.

      3 Bijzondere informatie die krachtens een verdrag of een internationale overeenkomst is verkregen wordt uitsluitend
      verwerkt nadat de autoriteit, die krachtens het betreffende verdrag verantwoordelijk is voor de beveiligingsregels
      ter bescherming van bijzondere informatie, haar goedkeuring aan de beveiliging heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel6
  - number: '7'
    text: |-
      1 Bij het buiten de Rijksdienst brengen van bijzondere informatie, anders dan op grond van een wettelijke
      verplichting tot openbaarmaking, blijven de eisen aan de beveiliging in dit besluit en het toezicht daarop
      onverkort van kracht.

      2 Bijzondere informatie die krachtens een verdrag of een internationale overeenkomst is verkregen wordt uitsluitend
      na voorafgaande toestemming van het land of de internationale organisatie van herkomst doorgegeven aan externe
      partijen.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel7
  - number: '8'
    text: |-
      1 Elke ambtenaar is verplicht aan de beveiligingsautoriteit van het betreffende ministerie onmiddellijk mededeling
      te doen van een inbreuk of mogelijke inbreuk op de beveiliging die leidt tot compromittering van bijzondere
      informatie.

      2 Indien de compromittering betrekking heeft op bijzondere informatie die is verkregen van een ander ministerie of
      krachtens een verdrag of internationale overeenkomst, doet de beveiligingsautoriteit bovendien mededeling aan het
      betreffende ministerie of de krachtens het verdrag of de internationale overeenkomst voor de beveiliging van die
      bijzondere informatie verantwoordelijke instantie.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel8
  - number: '9'
    text: |-
      1 De secretaris-generaal stelt een commissie van onderzoek in indien sprake is van ernstige compromittering van
      bijzondere informatie, waarbij onafhankelijke evaluatie noodzakelijk wordt geacht om de toedracht, gevolgen en
      eventuele verantwoordelijkheden vast te stellen.

      2 Indien de secretaris-generaal een commissie van onderzoek instelt, stelt de commissie een onderzoek in naar:

      a. de wijze waarop de compromittering heeft plaatsgevonden;

      b. de aard en de omvang van de schade aan de belangen van het ministerie, de vitale belangen van Nederland en de
      Nederlandse staat, of aan zijn bondgenoten;

      c. de te nemen maatregelen om de schade te beperken en herhaling te voorkomen.

      3 De commissie voert, indien de gecompromitteerde bijzondere informatie (mede) afkomstig is van een ander
      ministerie, haar onderzoek uit in overleg met de BVA van dat ministerie. In het geval dat de gecompromitteerde
      bijzondere informatie krachtens een verdrag of internationale overeenkomst is verkregen voert de commissie
      haar onderzoek uit in samenwerking met de instantie die krachtens het verdrag of de internationale overeenkomst
      verantwoordelijk is voor de beveiliging ervan.

      4 De secretaris-generaal treft, op basis van de bevindingen van de commissie van onderzoek, maatregelen om de
      schade die de compromittering heeft toegebracht aan de veiligheid of andere gewichtige belangen van het ministerie,
      aan de vitale belangen van Nederland en de Nederlandse staat, of aan zijn bondgenoten, te beperken en herhaling van
      de compromittering te voorkomen.

      5 Indien het de compromittering van een staatsgeheim betreft, stelt de secretaris-generaal het hoofd van de
      Algemene Inlichtingen- en Veiligheidsdienst in kennis van de uitkomsten van het onderzoek. In afwijking van
      de eerste volzin stelt de secretaris-generaal van het Ministerie van Defensie de Militaire Inlichtingen- en
      Veiligheidsdienst op de hoogte van de uitkomsten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel9
  - number: '10'
    text: Dit besluit wordt drie jaar na inwerkingtreding geëvalueerd en vervolgens elke drie jaar.
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel10
  - number: '11'
    text: |-
      Rubriceringen die zijn vastgesteld vóór inwerkingtreding van dit besluit worden uiterlijk tien jaar na
      vaststelling door de vaststeller onderzocht op de mogelijkheid om de rubricering te herzien of te beëindigen,
      en voor bestaande, reeds gerubriceerde informatie, waarbij volledig wordt voldaan aan de maatregelen, genoemd in
      het [Besluit voorschrift informatiebeveiliging rijksdienst bijzondere informatie 2013 (VIRBI 2013)][ref1], zijn
      organisaties gedurende een overgangsperiode van zes maanden niet gehouden te voldoen aan de hierop aanvullende
      maatregelen zoals deze in de bijlage bij dit besluit zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0033507
    url: https://wetten.overheid.nl/BWBR0051482/2025-09-09#Artikel11
    references:
