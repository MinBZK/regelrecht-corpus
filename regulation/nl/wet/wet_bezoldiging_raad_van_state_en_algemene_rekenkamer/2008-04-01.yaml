preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bezoldiging van de vice-president van de Raad
    van State en de staatsraden, alsmede van de president en de overige leden van de Algemene Rekenkamer opnieuw te
    regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002456/2008-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De bezoldiging van de vice-president van de Raad van State wordt bepaald op € 10.123,39 per maand. De bezoldiging
      van de voorzitter van de Afdeling bestuursrechtspraak wordt bepaald op € 9501,91. De bezoldiging van de overige
      staatsraden wordt bepaald op € 8919,86 per maand.

      2 Het genot van de bezoldiging vangt aan met de dag van indiensttreding. De bezoldiging wordt niet langer
      uitbetaald dan tot en met de dag van het overlijden.

      3 Na het overlijden van de vice-president of van een staatsraad wordt een uitkering uitgekeerd op de voet van de
      bepalingen welke te dien aanzien voor burgerlijke rijksambtenaren zijn of zullen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002456/2008-04-01#Artikel1
  - number: '2'
    text: |-
      1 Boven en behalve de bezoldiging, genoemd in [artikel 1][ref1], ontvangen de vice-president en de staatsraden
      een uitkering ter zake van veeljarige dienst, een vakantie-uitkering, een eindejaarsuitkering, een vergoeding van
      verplaatsingskosten en een vergoeding van telefoonkosten op de voet van de bepalingen welke te dien aanzien voor de
      burgerlijke rijksambtenaren zijn of zullen worden vastgesteld.

      2 Boven en behalve de bezoldiging, genoemd in [artikel 1][ref2], ontvangen de staatsraden een vergoeding van reis-
      en verblijfkosten op de voet van de bepalingen welke te dien aanzien voor de burgerlijke rijksambtenaren zijn of
      zullen worden vastgesteld.

      3 Bij algemene maatregel van bestuur worden regels gesteld betreffende de vergoeding van reis- en verblijfkosten
      welke de vice-president ontvangt.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de vergoeding voor kosten die aan de
      vervulling van het ambt van vice-president of staatsraad zijn verbonden en die voor eigen rekening komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002456#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002456#Artikel1
    url: https://wetten.overheid.nl/BWBR0002456/2008-04-01#Artikel2
