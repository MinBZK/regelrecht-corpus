  - number: '4'
    text: |-
      1 De bezoldiging van de president van de Algemene Rekenkamer wordt bepaald op € 10.123,39 per maand, die van de
      overige leden in gewone dienst op € 8919,86 per maand.

      2 Het genot van de bezoldiging vangt aan met de dag van indiensttreding. De bezoldiging wordt niet langer
      uitbetaald dan tot en met de dag van het overlijden.

      3 Na het overlijden van de president of van een ander lid in gewone dienst wordt een uitkering uitgekeerd op de
      voet van de bepalingen welke te dien aanzien voor de burgerlijke rijksambtenaren zijn of zullen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002456/2008-04-01#Artikel4
  - number: 4a
    text: |-
      1 Boven en behalve de bezoldiging, genoemd in [artikel 4][ref1], ontvangen de president en de overige leden in
      gewone dienst een uitkering ter zake van veeljarige dienst, een vakantie-uitkering, een eindejaarsuitkering, een
      vergoeding van verplaatsingskosten en een vergoeding van telefoonkosten op de voet van de bepalingen welke te dien
      aanzien voor de burgerlijke rijksambtenaren zijn of zullen worden vastgesteld.

      2 Boven en behalve de bezoldiging, genoemd in [artikel 4][ref2], ontvangen de leden in gewone dienst van de
      Algemene Rekenkamer, met uitzondering van de president, een vergoeding van reis- en verblijfkosten op de voet van
      de bepalingen welke te dien aanzien voor de burgerlijke rijksambtenaren zijn of zullen worden vastgesteld.

      3 Bij algemene maatregel van bestuur worden regels gesteld betreffende de vergoeding van reis- en verblijfkosten
      welke de president ontvangt.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de vergoeding voor kosten die aan de
      vervulling van het ambt van president of lid in gewone dienst zijn verbonden en die voor eigen rekening komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002456#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002456#Artikel4
    url: https://wetten.overheid.nl/BWBR0002456/2008-04-01#Artikel4a
