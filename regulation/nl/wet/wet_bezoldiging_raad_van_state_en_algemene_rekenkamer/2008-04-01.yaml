  - number: '3'
    text: |-
      1 Staatsraden in buitengewone dienst, bedoeld in [artikel 4, derde lid, van de Wet op de Raad van State][ref1],
      ontvangen een bezoldiging die een zodanig deel van de bezoldiging van een staatsraad bedraagt als overeenkomt met
      de vastgestelde omvang van de te verrichten taak.

      2 De overige staatsraden in buitengewone dienst genieten als zodanig geen bezoldiging. Zij ontvangen voor het
      deelnemen aan de werkzaamheden van de Raad van State of zijn afdelingen een bij algemene maatregel van bestuur
      te regelen vergoeding. Wanneer zij buiten 's-Gravenhage of één der aangrenzende gemeenten woonachtig zijn, worden
      bovendien hun reis- en verblijfkosten vergoed op voet van de bepalingen geldende voor de vergoeding van reis- en
      verblijfkosten voor burgerlijke Rijksambtenaren.

      3 Het bepaalde in [artikel 1, tweede en derde lid][ref2], en [artikel 2, eerste, tweede en vierde lid][ref3]
      geldt mede voor staatsraden in buitengewone dienst, bedoeld in
      [artikel 4, derde lid, van de Wet op de Raad van State][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel4
