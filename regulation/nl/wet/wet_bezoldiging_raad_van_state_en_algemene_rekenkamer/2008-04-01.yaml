  - number: '5'
    text: |-
      De leden in buitengewone dienst genieten als zodanig geen bezoldiging. Zij ontvangen voor het deelnemen aan de
      werkzaamheden van de Algemene Rekenkamer een bij algemene maatregel van bestuur te regelen vergoeding. Wanneer
      zij buiten 's-Gravenhage of één der aangrenzende gemeenten woonachtig zijn, worden bovendien hun reis- en
      verblijfkosten vergoed op de voet van de bepalingen geldende voor de vergoeding van reis- en verblijfkosten voor
      burgerlijke Rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0002456/2008-04-01#Artikel5
  - number: '6'
    text: |-
      Indien Wij in de bezoldiging van het burgerlijk rijkspersoneel een wijziging aanbrengen en bepalen, dat
      die wijziging een algemeen karakter draagt, brengen Wij bij algemene maatregel van bestuur met ingang
      van de datum, waarop die wijziging ingaat, een overeenkomstige wijziging aan in de bezoldiging van de
      ingevolge deze wet bezoldigde functionarissen, onder nadere vaststelling, voor zoveel nodig, van de in de
      [artikelen 1, eerste lid][ref1], en [4, eerste lid][ref2], genoemde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002456#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002456#Artikel4
    url: https://wetten.overheid.nl/BWBR0002456/2008-04-01#Artikel6
