    Besluit:
  url: https://wetten.overheid.nl/BWBR0007302/1995-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaren mede belast met het toezicht op de naleving van het krachtens
      [artikel 17 van de Wet op de openluchtrecreatie][ref1] bepaalde worden aangewezen: de Hoofdinspecteur en de
      regionale inspecteurs van de Volksgezondheid, belast met het toezicht op de hygiëne van het milieu, en de onder
      hun bevelen werkzame ambtenaren, met uitzondering van hen die meer in het bijzonder administratieve werkzaamheden
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel17
