---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_aanwijzing_ambtenaren_mede_belast_met_toezicht_op_naleving_van_het_bepaalde_krachtens_artikel_17_wet_op_de_openluchtrecreatie
regulatory_layer: WET
publication_date: '2004-12-27'
valid_from: '1995-11-01'
valid_to: '2005-02-24'
bwb_id: BWBR0007302
url: https://wetten.overheid.nl/BWBR0007302/1995-11-01
preamble:
  text: |-
    Gelet op artikel 33, derde lid, van de Wet op de openluchtrecreatie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007302/1995-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaren mede belast met het toezicht op de naleving van het krachtens
      [artikel 17 van de Wet op de openluchtrecreatie][ref1] bepaalde worden aangewezen: de Hoofdinspecteur en de
      regionale inspecteurs van de Volksgezondheid, belast met het toezicht op de hygiëne van het milieu, en de onder
      hun bevelen werkzame ambtenaren, met uitzondering van hen die meer in het bijzonder administratieve werkzaamheden
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel17
    url: https://wetten.overheid.nl/BWBR0007302/1995-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '17'
    machine_readable:
      execution:
        parameters:
          - name: functie
            type: string
            required: true
            description: >-
              De functie van de ambtenaar:
              HOOFDINSPECTEUR_VOLKSGEZONDHEID_MILIEU_HYGIENE,
              REGIONAAL_INSPECTEUR_VOLKSGEZONDHEID_MILIEU_HYGIENE,
              AMBTENAAR_ONDER_BEVELEN, of OVERIG
          - name: voert_voornamelijk_administratieve_werkzaamheden_uit
            type: boolean
            required: true
            description: >-
              Of de ambtenaar meer in het bijzonder administratieve
              werkzaamheden uitoefent
        output:
          - name: is_aangewezen_toezichthouder
            type: boolean
            description: >-
              Of de ambtenaar is aangewezen als mede belast met het toezicht
              op de naleving van het krachtens artikel 17 Wet op de
              openluchtrecreatie bepaalde
        actions:
          - output: is_aangewezen_toezichthouder
            value:
              operation: AND
              conditions:
                - operation: IN
                  subject: $functie
                  values:
                    - HOOFDINSPECTEUR_VOLKSGEZONDHEID_MILIEU_HYGIENE
                    - REGIONAAL_INSPECTEUR_VOLKSGEZONDHEID_MILIEU_HYGIENE
                    - AMBTENAAR_ONDER_BEVELEN
                - operation: NOT
                  value: $voert_voornamelijk_administratieve_werkzaamheden_uit
  - number: '2'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de [hoofdstukken III][ref1] tot en met
      [XIII van de Wet op de openluchtrecreatie][ref2] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006548#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0007302/1995-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006548
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006548
        hoofdstuk: XIII
