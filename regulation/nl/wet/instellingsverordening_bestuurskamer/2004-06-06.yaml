preamble:
  text: |-
    Gelet op de artikelen 19, 35, 37, 42 en 44 van de Wet op de bedrijfsorganisatie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016773/2004-06-06#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze verordening wordt verstaan onder Raad: Sociaal-Economische Raad.'
    url: https://wetten.overheid.nl/BWBR0016773/2004-06-06#Artikel1
  - number: '2'
    text: |-
      1 Er is een Bestuurskamer.

      2 De leden van de Bestuurskamer worden door de Raad uit zijn midden benoemd voor de duur van de zittingsperiode van
      de Raad. Zij kunnen terstond opnieuw worden benoemd.
    url: https://wetten.overheid.nl/BWBR0016773/2004-06-06#Artikel2
  - number: '3'
    text: |-
      1 De Bestuurskamer bestaat uit vijftien leden. De samenstelling vindt zodanig plaats dat deze een afspiegeling
      vormt van de samenstelling van de Raad.

      2 De Raad benoemt de voorzitter van de Bestuurskamer uit de onafhankelijke geleding.
    url: https://wetten.overheid.nl/BWBR0016773/2004-06-06#Artikel3
  - number: '4'
    text: |-
      Indien een besluit van de Bestuurskamer niet unaniem is, wordt dat besluit genomen bij meerderheid van stemmen,
      waarbij binnen elk der geledingen de sternverhoudingen gelden zoals die voortvloeien uit de ledentallen in de Raad.
    url: https://wetten.overheid.nl/BWBR0016773/2004-06-06#Artikel4
  - number: '5'
    text: |-
      1 De Bestuurskamer wordt belast met de voorbereiding van door de Raad uit te brengen adviezen die de taken van de
      Raad als bestuursorgaan betreffen.

      2 De Bestuurskamer is gemachtigd namens de Raad van advies te dienen:

      a. over onderwerpen samenhangend met het [tweede hoofdstuk van de Wet op de bedrijfsorganisatie][ref1];

      b. over verzoeken om ontheffing als bedoeld in de [artikelen 63d, tweede lid][ref2], [156][ref3] en
      [266 van Boek 2 van het Burgerlijk Wetboek][ref4]. Dergelijke adviezen van de Bestuurskamer worden voorbereid door
      de Subcommissie Ontheffingen Structuurwet.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#HoofdstukTweede
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel63d
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel266
    url: https://wetten.overheid.nl/BWBR0016773/2004-06-06#Artikel5
