  text: |-
    Handelende in overeenstemming met de Minister van Financiën;

    Gelet op artikel 71 van de Organisatiewet sociale verzekeringen 1997;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009877/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;

      b. *de lasten:*

      1°. de financiële tegemoetkomingen, bedoeld in [hoofdstuk 7 van de Wet arbeid en zorg][ref1];

      2°. de uitvoeringskosten van in [hoofdstuk 7 van de Wet arbeid en zorg][ref2];

      3°. de op grond van enige wet door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies die niet
      op een uitkering in mindering mogen worden gebracht

      c. een wachtgelduitkering op grond van een publiekrechtelijke regeling: een wachtgelduitkering uit hoofde
      van een publiekrechtelijke dienstbetrekking die is geëindigd voor 1 januari 2001 dan wel op grond van een
      publiekrechtelijke regeling uit hoofde van een arbeidsverhouding die geen publiekrechtelijke dienstbetrekking is;

      d. premiegefinancierde uitkering: een uitkering op grond van de [WW][ref3], [WAO][ref4], [WAZ][ref5] of ANW.


