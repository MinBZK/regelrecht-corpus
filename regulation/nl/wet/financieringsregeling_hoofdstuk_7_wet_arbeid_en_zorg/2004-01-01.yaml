  - number: '5'
    text: |-
      1 De Minister stelt jaarlijks vóór 31 oktober de omvang van de middelen tot dekking van de uitgaven ten laste
      van het Algemeen Werkloosheidsfonds ten behoeve van [hoofdstuk 7 van de Wet arbeid en zorg][ref1] over het
      afgelopen kalenderjaar definitief vast, voor zover deze worden gefinancierd uit de rijksbijdrage, als bedoeld in
      [artikel 2, eerste lid][ref2].

      2 In het besluit, als bedoeld in het eerste lid, wordt afzonderlijk vermeld:

      a. de omvang van de middelen tot dekking van de aan verlofgangers, als bedoeld in [artikel 4][ref3], betaalde
      lasten, als bedoeld in [artikel 1, onderdeel b, onder 1° en 3°][ref4];

      b. de omvang van de middelen tot dekking van de aan verlofgangers betaalde lasten, als bedoeld in
      [artikel 1, onderdeel b, onder 1° en 3°][ref5], voorzover deze samenhangen met tegemoetkomingen met betrekking
      tot verlofgangers die worden vervangen door een [WWB][ref6]-gerechtigde, een [IOAW][ref7]-gerechtigde, een
      [IOAZ][ref8]-gerechtigde, een [Wajong][ref9]-gerechtigde, een vervanger met een wachtgelduitkering op grond
      van een publiekrechtelijke regeling en een vervanger zonder uitkering, alsmede samenloopgevallen als bedoeld in
      [artikel 2, derde lid][ref10];

      c. de omvang van de middelen tot dekking van de aan de uitvoering van in
      [hoofdstuk 7 van de Wet arbeid en zorg][ref11] verbonden uitvoeringskosten, als bedoeld in
      [artikel 1, onderdeel b, onder 2][ref12], met betrekking tot alle verlofgangers;

      d. de omvang van de middelen, die op grond van
      [artikel 30, derde lid, van de Wet financiering volksverzekeringen][ref13], zijn of worden overgeheveld naar het
      Uitvoeringsinstituut werknemersverzekeringen ten gunste van het Algemeen Werkloosheidsfonds.

      3 De rijksbijdrage, bedoeld in het eerste lid, is de som van de omvang van de middelen, bedoeld in het tweede lid,
      onder b en c.

      4 Indien de op grond van het derde lid vastgestelde rijksbijdrage aan het Algemeen Werkloosheidsfonds ten
      behoeve van in [hoofdstuk 7 van de Wet arbeid en zorg][ref14] afwijkt van de op basis van deze regeling
      over hetzelfde kalenderjaar betaalde bedragen vindt een definitieve afrekening met het Uitvoeringsinstituut
      werknemersverzekeringen ten gunste of ten laste van het Algemeen Werkloosheidsfonds plaats.


