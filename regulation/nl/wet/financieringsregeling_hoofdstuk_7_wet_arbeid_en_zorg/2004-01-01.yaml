  - number: '3'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt per kwartaal aan de Minister een opgave van de lasten,
      bedoeld in [artikel 1, onderdeel b][ref1], uitgezonderd sub 2

      a. lasten die door middel van een rijksbijdrage worden gefinancierd;

      b. lasten die anders dan door middel van een rijksbijdrage worden gefinancierd.

      2 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt binnen twee maanden na afloop van ieder kwartaal de
      opgave, bedoeld in het eerste lid, aan de Minister.

      3 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt jaarlijks aan de Minister, als onderdeel van de
      definitieve afrekening, een opgave omtrent de gerealiseerde uitvoeringskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009877#Artikel1
    url: https://wetten.overheid.nl/BWBR0009877/2004-01-01#Artikel3
