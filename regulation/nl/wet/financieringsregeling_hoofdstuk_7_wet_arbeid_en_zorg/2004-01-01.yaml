  - number: '4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt binnen twee maanden na afloop van ieder half jaar een
      opgave aan de Minister waarin afzonderlijk worden vermeld de aantallen verlofgangers, die worden vervangen door:

        - een [WWB][ref1]-gerechtigde;
        - een [IOAW][ref2]-gerechtigde;
        - een [IOAZ][ref3]-gerechtigde;
        - een vervanger met een wachtgelduitkering op grond van een publiekrechtelijke regeling;
        - een vervanger zonder uitkering;
        - een [Wajong][ref4]-gerechtigde;
        - een [WW][ref5]-gerechtigde;
        - een [WAO][ref6]-gerechtigde;
        - een [WAZ][ref7]-gerechtigde;
        - een [ANW][ref8]-gerechtigde;
        - een mogelijke samenloop van genoemde uitkeringsgerechtigden.


