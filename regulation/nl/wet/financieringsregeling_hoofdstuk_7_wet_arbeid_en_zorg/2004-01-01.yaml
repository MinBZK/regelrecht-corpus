  - number: '2'
    text: |-
      1 De lasten, bedoeld in [artikel 1, onderdeel b, onder 1° en 3°][ref1], voorzover deze samenhangen met
      tegemoetkomingen met betrekking tot verlofgangers die worden vervangen door een [WWB][ref2]-gerechtigde, een
      [IOAW][ref3]-gerechtigde, een [IOAZ][ref4]-gerechtigde, een [Wajong][ref5]-gerechtigde, een vervanger met een
      wachtgelduitkering op grond van een publiekrechtelijke regeling en een vervanger zonder uitkering en de lasten
      bedoeld in [artikel 1, onderdeel b, onder 2°][ref6], met betrekking tot alle verlofgangers, worden gefinancierd
      uit een rijksbijdrage ten gunste van het Algemeen Werkloosheidsfonds.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan de rijksbijdrage ter financiering van de lasten, bedoeld
      in het eerste lid, overeenkomstig de Wet geïntegreerd middelenbeheer gedurende de maand opnemen bij de Minister
      van Financiën, ten laste van de begroting van de Minister van Sociale Zaken en Werkgelegenheid respectievelijk in
      rekening-courant verrekenen met de Minister van Sociale Zaken en Werkgelegenheid.

      3 De rijksbijdrage, bedoeld in het eerste en zevende lid, die ten laste komt van de begroting van de Minister van
      Sociale Zaken en Werkgelegenheid bedraagt per de ultimo van een maand niet meer dan ééntwaalfde van de begrote
      rijksbijdrage respectievelijk de rijksbijdrage, bedoeld in het zevende lid, voor het lopende kalenderjaar,
      vermenigvuldigd met het aantal in het kalenderjaar aangevangen maanden.

      4 Indien een verlofganger wordt vervangen door een vervanger bij wie sprake is van samenloop van uitkeringen die
      zowel rijksgefinancierd zijn als premiegefinancierd, wordt de gehele tegemoetkoming gefinancierd ten laste van de
      rijksbijdrage als bedoeld in het eerste lid.

      5 Indien een verlofganger wordt vervangen door meer dan één vervanger waarbij zowel een vervanger is betrokken
      zonder uitkering of met een rijkgefinancierde uitkering, alsmede een vervanger met een premiegefinancierde
      uitkering, wordt de gehele tegemoetkoming gefinancierd ten laste van de rijksbijdrage als bedoeld in het eerste
      lid.

      6 Onder een rijksgefinancierde uitkering wordt voor de toepassing van het vierde en vijfde lid niet verstaan:

        - een toeslag op grond van de [Toeslagenwet][ref7];
        - een uitkering op grond van de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref8].

      De hoogte van de rijksbijdrage kan gedurende het kalenderjaar door de Minister worden gewijzigd.


