    text: |-
      1 In de verklaring naleving maritieme arbeid deel II wordt vermeld:

      a. de maatregelen en procedures om te waarborgen dat voortdurend wordt voldaan aan de in
      [artikel 48c, eerste lid, van de wet][ref1] bedoelde eisen en de voorgestelde maatregelen om voortdurende
      verbetering van de naleving te waarborgen;

      b. de maatregelen die worden getroffen indien blijkt dat niet wordt voldaan aan bepaalde in
      [artikel 48c, eerste lid, van de wet][ref2] bedoelde eisen; en

      c. welke personen zijn aangewezen voor het toepassen van de in de onderdelen a en b bedoelde maatregelen en
      procedures.

      2 De verklaring naleving maritieme arbeid deel II wordt opgesteld in overeenstemming met de normering van leidraad
      B5.1.3, leden 2, 3 en 4, van het Maritiem Arbeidsverdrag.


