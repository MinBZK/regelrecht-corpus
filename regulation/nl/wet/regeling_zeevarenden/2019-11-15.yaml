    text: |-
      Voor de afgifte van het certificaat aanvulling-N voor reizen nabij de internationale kust heeft de aanvrager met
      goed gevolg een door Onze Minister erkende training afgerond die de in [bijlage F, onderdeel D][ref1], genoemde
      onderdelen van de tabellen A-II/2 en A-II/3, behorende bij respectievelijk de secties A-II/2 en A-II/3, van de
      STCW-Code beslaat.


