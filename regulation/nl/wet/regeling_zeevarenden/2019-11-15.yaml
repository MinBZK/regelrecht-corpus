  - number: '10.3'
    text: |-
      1 Voor de erkenning van een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs op grond van voorschrift I/10 van
      het STCW-verdrag of hoofdstuk I, voorschrift 7, van het STCW F-verdrag, als bedoeld in de [artikelen 22][ref1] of
      [22a van de wet][ref2], legt de aanvrager de volgende bescheiden over aan Onze Minister:

      a. een door hem ingevuld en ondertekend aanvraagformulier;

      b. een geldig identiteitsbewijs waaruit zijn nationaliteit blijkt;

      c. een recente pasfoto;

      d. het originele vaarbevoegdheidsbewijs of een bekwaamheidsbewijs waarvan erkenning wordt gevraagd; en

      e. de originele geldige geneeskundige verklaring van geschiktheid voor de zeevaart, bedoeld in
      [artikel 40, eerste lid, van de wet][ref3].

      2 Indien het vaarbevoegdheidsbewijs waarvan erkenning wordt gevraagd de functie kapitein betreft en is afgegeven
      door de bevoegde autoriteit van een staat, niet zijnde een lidstaat van de Europese Unie, een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of de Bondsstaat Zwitserland, overlegt de
      aanvrager tevens het bewijs van schriftelijke toestemming, bedoeld in [artikel 30, vijfde lid, van de wet][ref4],
      tenzij [artikel 5 van de Vrijstellingsregeling buitenlandse kapiteins voor de sector koopvaardij][ref5] of
      [artikel 5 van de Vrijstellingsregeling buitenlandse kapiteins sector zeegaande waterbouw][ref6] van toepassing is.

      3 Een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs als bedoeld in het eerste lid heeft een geldigheidsduur die
      gelijk is aan die van het door de bevoegde autoriteit van de andere staat afgegeven oorspronkelijke bewijs, maar
      niet langer dan 5 jaar.

      4 Het eerste lid is niet van toepassing op de aanvraag van een vaarbevoegdheidsbewijs door een migrerende
      beroepsbeoefenaar als bedoeld in [artikel 2 van de Regeling erkenning EU-beroepskwalificaties zeevisserij][ref7].

      5 Het tweede lid is niet van toepassing op de verkrijging van een vaarbevoegdheidsbewijs voor het dienstdoen op
      vissersvaartuigen.


