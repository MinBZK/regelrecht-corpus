      1 Voor de afgifte van het bekwaamheidsbewijs stuurman grote zeilvaart:

      a. voldoet de aanvrager aan de volgende onderdelen van voorschriften van de bijlage bij het STCW-Verdrag:

      1°. voorschrift II/1, lid 2, onderdeel 2, 3 en 5; en

      waarbij 12 maanden ervaring is opgedaan onder bijhouding van een door de kapitein af te tekenen stageboek;

      2°. voorschrift II/2, lid 4, onderdeel 3;

      b. heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die de aspecten materialen,
      tuigage, scheepsvormen, dynamische stabiliteit en behandeling van zeilschepen omvat en voldoet aan de volgende
      onderdelen van de STCW-Code:

      1°. sectie A-II/1, onderdeel 1, onder 1, en onderdelen 2 tot en met 6, met uitzondering van de aspecten behandeling
      en stuwen van lading; en

      2°. sectie A-II/2, onderdelen 1 tot en met 7, waarbij het in onderdeel 4 bedoelde kennisniveau de functie kapitein
      betreft, het in onderdeel 5 bedoelde niveau schepen van minder dan 3000 GT betreft, en met uitzondering van de
      aspecten behandeling en stuwen van lading; en

      c. heeft de aanvrager als onderdeel van de in onderdeel b bedoelde opleiding gedurende ten minste 12 maanden
      ervaring opgedaan onder bijhouding van een door de kapitein af te tekenen stageboek.

      2 In afwijking van het eerste lid, onderdeel c, kan de aanvrager die in het bezit is van:

      a. het bekwaamheidsbewijs stuurman kleine zeilvaart, genoemd in artikel 8.17, volstaan met een ervaring van ten
      minste 6 maanden;

      b. een geldig vaarbevoegdheidsbewijs voor de functie maritiem officier, stuurman schepen van minder dan 3000 GT of
      stuurman alle schepen, volstaan met een ervaring van ten minste 2 maanden.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.16
  - number: '8.17'
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs stuurman kleine zeilvaart:

      a. voldoet de aanvrager aan voorschrift II/3, lid 4, onderdelen 2.2.1, 4, 5 voor zover het sectie A-VI/1, onderdeel
      2, van de STCW-Code betreft, en 6.3 van de bijlage bij het STCW-Verdrag;

      b. heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die de aspecten materialen,
      tuigage, scheepsvormen, dynamische stabiliteit en behandeling van zeilschepen omvat en voldoet aan sectie A-II/3,
      onderdelen 1 tot en met 7 van de STCW-Code, met uitzondering van de aspecten behandeling en stuwen van lading; en

      c. heeft de aanvrager als onderdeel van de in onderdeel b bedoelde opleiding gedurende ten minste 6 maanden
      ervaring opgedaan onder bijhouding van een door de kapitein af te tekenen stageboek.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.17
