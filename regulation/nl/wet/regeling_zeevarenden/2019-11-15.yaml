      1 De minister kan, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, ontheffing
      verlenen van norm A3.1, zesde lid, onderdeel a, eerste volzin, van het Maritiem Arbeidsverdrag indien de
      verminderde hoogte van de desbetreffende verblijven redelijk is, en niet tot ongemak voor de zeevarenden leidt.

      2 Er wordt geen ontheffing verleend voor een hoogte van de verblijven van minder dan 1930 mm.

      3 Voor schepen van minder dan 200 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, en met inachtneming van de grootte van het schip en het aantal opvarenden aan
      boord, ontheffing verlenen van norm A3.1, lid 7, onderdeel b, ten aanzien van airconditioning.
