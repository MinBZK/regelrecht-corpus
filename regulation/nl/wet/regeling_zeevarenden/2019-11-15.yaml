      1 [Artikel 18, vierde lid, eerste volzin, van de wet][ref1] is niet van toepassing op radio-operators op schepen.

      2 Bij een aanvraag voor de afgifte van een bewijs van aanvraag om erkenning van een vaarbevoegdheidsbewijs
      als bedoeld in [artikel 18, vierde lid, van de wet][ref2], overlegt de aanvrager naast de in
      [artikel 10.3, eerste lid][ref3], bedoelde bescheiden tevens een verklaring:

      a. van de zeewerkgever omtrent het afgesloten zijn van een arbeidsovereenkomst, waarbij de aanvrager zich heeft
      verbonden arbeid aan boord van een zeeschip te verrichten; en

      b. van de scheepsbeheerder omtrent de authenticiteit van de door de aanvrager overgelegde bescheiden en de
      juistheid van de door deze verstrekte gegevens, voor zover dit door hem kan worden beoordeeld.


