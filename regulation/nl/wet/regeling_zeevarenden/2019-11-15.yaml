      b. heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die voldoet aan de volgende
      onderdelen van de STCW-Code:

      1°. sectie A-II/4, onderdelen 1 tot en met 4; en

      2°. sectie A-III/4, onderdelen 1 tot en met 4; en

      c. heeft de aanvrager als onderdeel van de in onderdeel b bedoelde opleiding gedurende ten minste 4 maanden
      ervaring opgedaan die in gelijke mate bestaat uit wachtwerkzaamheden op de brug en uit wachtwerkzaamheden in de
      machinekamer, onder bijhouding van een door de kapitein en door de hoofdwerktuigkundige of een eerste maritiem
      officier af te tekenen stageboek.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.15
