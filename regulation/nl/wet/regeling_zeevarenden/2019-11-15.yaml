    text: |-
      Voor de afgifte van het bekwaamheidsbewijs scheepskok:

      a. heeft de aanvrager een diensttijd behaald van ten minste een maand in de kombuis van een zeeschip en is hij in
      het bezit van een kennisbewijs van een opleiding tot kok die ten minste de volgende aspecten bevat:

      1°. praktische kookvaardigheden;

      2°. voeding en persoonlijke hygiëne;

      3°. opslag van levensmiddelen;

      4°. voorraadcontrole;

      5°. milieubescherming; en

      6°. gezondheid en veiligheid met betrekking tot maaltijdverzorging; of

      b. is de aanvrager in het bezit van een vaarbevoegdheidsbewijs als scheepskok, afgegeven voor 1 februari 2002, en
      heeft hij na de verkrijging van dat vaarbevoegdheidsbewijs een diensttijd behaald van ten minste 36 maanden als
      scheepskok bij een Nederlandse zeewerkgever.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.37
  - number: '8.38'
    text: |-
      Voor de afgifte van het certificaat scheepsbeveiligingsfunctionaris:

      a. voldoet de aanvrager aan voorschrift VI/5, lid 1, van de bijlage bij het STCW-Verdrag; en

      b. heeft de aanvrager met goed gevolg een door Onze Minister erkende training afgerond die voldoet aan sectie A-
      VI/5, onderdelen 1 tot en met 4, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.38
  - number: '8.39'
    text: |-
      Voor de afgifte van het certificaat uitvoering beveiligingstaken:

      a. voldoet de aanvrager aan voorschrift VI/6, lid 4, van de bijlage bij het STCW-Verdrag; en

      b. heeft de aanvrager met goed gevolg een door Onze Minister erkende training afgerond die voldoet aan sectie A-
      VI/6, onderdelen 6 tot en met 8, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.39
  - number: '8.40'
    text: |-
      Voor de afgifte van het certificaat bewustwording scheepsbeveiliging:

      a. voldoet de aanvrager aan voorschrift VI/6, lid 1, voor zover het bewustwording scheepsbeveiliging betreft, van
      de bijlage bij het STCW-Verdrag; en

      b. heeft de aanvrager met goed gevolg een door Onze Minister erkende training afgerond die voldoet aan sectie A-
      VI/6, onderdeel 4, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.40
  - number: '8.41'
    text: |-
      Voor de afgifte van het certificaat wetgeving en openbaar gezag heeft de aanvrager met goed gevolg een door Onze
      Minister erkende training afgerond die de in [bijlage F, onderdeel A][ref1], genoemde onderdelen beslaat van de
      Nederlandse wetgeving op de scheepvaart betrekking hebbend.


      [ref1]: https://wetten.overheid.nl/BWBR0032140
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.41
