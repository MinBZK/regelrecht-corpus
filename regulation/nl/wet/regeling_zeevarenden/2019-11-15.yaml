      1 Voor een commercieel jacht zijn in afwijking van [artikel 3.3, eerste lid][ref1], als wezenlijk gelijkwaardige
      bepalingen als bedoeld in artikel VI, lid 3, van het Maritiem Arbeidsverdrag, de in de onderstaande tabel opgenomen
      normen ten aanzien van de minimale vloeroppervlakte voor nachtverblijven, tezamen met het tweede en derde lid,
      van toepassing.









                    grootte commercieel jacht


                    type nachtverblijf


                    minimale vloeroppervlakte






                    tot 500 GT


                    eenpersoonsnachtverblijf zonder eigen sanitaire voorzieningen


                    3,6 m2




                    eenpersoonsnachtverblijf met eigen sanitaire voorzieningen


                    4,5 m2




                    tweepersoonsnachtverblijf met eigen sanitaire voorzieningen


                    6,2 m2




                    ≥500 GT tot 1250 GT


                    eenpersoonsnachtverblijf voor officieren met eigen sanitaire voorzieningen


                    van 4,5 m2 bij 500GT + 0,004 m2 per GT boven de 500 GT, afgerond op decimalen




                    ≥500 GT tot 1150 GT


                    tweepersoonsnachtverblijf voor officieren met eigen sanitaire voorzieningen


                    6,2 m2 bij 500 GT + 0,01354 m2 per GT boven de 500 GT, afgerond op decimalen






      2 Tot de wezenlijk gelijkwaardige bepalingen, bedoeld in het eerste lid, behoort het vereiste dat een commercieel
      jacht de volgende voorzieningen biedt:

      a. een dagverblijf dat per zeevarende ten minste 1,5 m2 zitplaats biedt;

      b. een ruimte aan dek die toegankelijk is voor de zeevarenden die geen dienst hebben en per zeevarende ten minste
      1,5 m2 zitplaats biedt; en

      c. een aanvullende ruimte die per officier ten minste 1,5 m2 zitplaats biedt en, voor zover deze ruimte is
      gesitueerd op de brug, alleen wordt gebruikt als het schip niet varende is.

      3 Voor zover het vloeroppervlak van nachtverblijven voor officieren ingevolge het eerste lid minder bedraagt dan
      7,5 m2, zijn in deze verblijven een TV en een DVD-speler of gelijkwaardige apparatuur beschikbaar.


