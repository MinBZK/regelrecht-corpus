  - number: '8.46'
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs basistraining Polar Code:

      a. voldoet de aanvrager aan voorschrift V/4, tweede lid, van de bijlage bij het STCW-Verdrag; en

      b. heeft de aanvrager met goed gevolg een door Onze Minister erkende training afgerond die voldoet aan sectie A-
      V/4, onderdeel 1, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.46
  - number: '8.47'
    text: |-
      Voor de afgifte van het bekwaamheidsbewijs gevorderdentraining Polar Code is de aanvrager in het bezit van het
      bekwaamheidsbewijs basistraining Polar Code en:

      a. voldoet de aanvrager aan voorschrift V/4, vierde lid, van de bijlage bij het STCW-Verdrag;

      b. heeft de aanvrager met goed gevolg een door Onze Minister erkende training afgerond die voldoet aan sectie A-
      V/4, onderdeel 2, van de STCW-Code, en

      c. heeft de aanvrager gedurende ten minste 2 maanden dienstgedaan in een relevante functie.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.47
  - number: '8.48'
    text: |-
      1 Voor de afgifte van het bekwaamheidsbewijs basistraining IGF Code:

      a. voldoet de aanvrager aan voorschrift V/3, vijfde lid, van de bijlage bij het STCW-Verdrag; en

      b. heeft de aanvrager met goed gevolg een door Onze Minister erkende training afgerond die voldoet aan sectie A-
      V/3, onderdeel 1, van de STCW-Code.

      2 Voor de afgifte van het bekwaamheidsbewijs basistraining IGF Code komen tevens in aanmerking zeevarenden die
      in het bezit zijn van het bekwaamheidsbewijs basis ladingbehandeling gastankschepen of het bekwaamheidsbewijs
      ladingbehandeling gastankschepen voor gevorderden.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.48
  - number: '8.49'
    text: |-
      1 Voor de afgifte van het bekwaamheidsbewijs gevorderdentraining IGF Code is de aanvrager in het bezit van het
      bekwaamheidsbewijs basistraining IGF Code en:

      a. voldoet de aanvrager aan voorschrift V/3, achtste lid, van de bijlage bij het STCW-Verdrag;

      b. heeft de aanvrager met goed gevolg een door Onze Minister erkende training afgerond die voldoet aan sectie A-
      V/3, onderdeel 2, van de STCW-Code; en

      c. heeft de aanvrager ten minste een maand ervaring opgedaan met ten minste drie bunkeroperaties aan boord van
      schepen waarop de IGF Code van toepassing is. Twee van de drie genoemde bunkeroperaties mogen worden vervangen door
      simulatortraining als onderdeel van de onder lid b genoemde training.

      2 Voor de afgifte van het bekwaamheidsbewijs gevorderdentraining IGF Code komen tevens in aanmerking kapiteins,
      werktuigkundigen, maritiem officieren en overige zeevarenden die in het bezit zijn van het bekwaamheidsbewijs
      ladingbehandeling gastankschepen voor gevorderden, mits zij tevens:

      a. voldoen aan de voorschriften V/3, zesde lid, van de bijlage bij het STCW-Verdrag;

      b. voldoen aan voorschrift V/3, achtste lid, onderdeel 2, van de bijlage bij het STCW-Verdrag of hebben deelgenomen
      aan ten minste drie ladingsoperaties aan boord van een gastankschip;

      c. gedurende vijf jaar voorafgaand aan de aanvraag ten minste 3 maanden dienst hebben gedaan aan boord van:

      1. schepen waarop de IGF Code van toepassing is;

      2. tankschepen met als lading brandstoffen waarop de IGF Code van toepassing is; of

      3. schepen die gas of brandstof met een laag vlampunt gebruiken als brandstof.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.49
  - number: '9.1'
    text: |-
      In het bemanningsplan worden ten minste de gegevens opgenomen die zijn vermeld op een door Onze Minister ter
      beschikking te stellen formulier.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel9.1
  - number: '10.1'
    text: |-
      Voor de verkrijging van een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs, legt de aanvrager de volgende
      bescheiden over aan Onze Minister:

      a. een door hem ingevuld en ondertekend aanvraagformulier;

      b. een geldig identiteitsbewijs waaruit zijn nationaliteit blijkt;

      c. een recente pasfoto;

      d. het originele kennisbewijs of bekwaamheidsbewijs op grond waarvan afgifte wordt gevraagd;

      e. de voor het gewenste vaarbevoegdheidsbewijs vereiste bekwaamheidsbewijzen en schriftelijke bewijzen;

      f. de originele geldige geneeskundige verklaring van geschiktheid voor de zeevaart, bedoeld in
      [artikel 40, eerste lid, van de wet][ref1]; en

      g. een bewijs dat is voldaan aan de vereiste ervaring voor het gewenste bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
  - number: '10.2'
    text: |-
      1 Voor de vernieuwing van een vaarbevoegdheidsbewijs is [artikel 10.1][ref1], met uitzondering van onderdeel d, van
      overeenkomstige toepassing.

      2 Voor de vernieuwing van een bekwaamheidsbewijs, is [artikel 10.1][ref2] van overeenkomstige toepassing, met
      uitzondering van onderdeel e, en met dien verstande dat de in onderdeel g vereiste ervaring is opgedaan:

      a. aan boord van olie- of chemicaliëntankschepen indien het betreft het bekwaamheidsbewijs basis ladingbehandeling
      olie- en chemicaliëntankschepen;

      b. aan boord van gastankschepen indien het betreft het bekwaamheidsbewijs basis ladingbehandeling gastankschepen;

      c. aan boord van olie- en chemicaliëntankschepen indien het betreft het bekwaamheidsbewijs ladingbehandeling olie-
      en chemicaliëntankschepen voor gevorderden;

      d. aan boord van gastankschepen indien het betreft het bekwaamheidsbewijs ladingbehandeling gastankschepen voor
      gevorderden.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel10.1
      [ref2]: https://wetten.overheid.nl/BWBR0032140#Artikel10.1
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel10.2
