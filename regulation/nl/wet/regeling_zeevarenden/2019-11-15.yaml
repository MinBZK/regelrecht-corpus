  - number: 1.3a
    text: |-
      De [artikelen 5 tot en met 25b][ref1] en [29 tot en met 48a van de wet][ref2] zijn niet van toepassing op schepen
      met een lengte van minder dan 12 meter, ingezet door de Nationale Politie, indien de bemanning in het bezit is van:

      a. het door het de Nationale Politie afgegeven vaarbekwaamheidsbewijs politie voor het besturen van een klein
      politievaartuig op alle binnenwateren;

      b. het door de Nationale Politie afgegeven getuigschrift vaartraining snelle motorboten;

      c. het door de Nationale Politie afgegeven getuigschrift levensreddend handelen;

      d. het certificaat basisveiligheid, en

      e. het beperkt certificaat maritieme radiocommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel29
