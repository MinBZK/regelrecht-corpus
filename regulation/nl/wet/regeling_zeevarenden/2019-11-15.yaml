    text: |-
      1 Peilstokken of andere instrumenten, die gebruikt worden om het restant drinkwater in tanks op te meten, moeten
      steeds vóór het gebruik gereinigd zijn. Zij moeten worden opgeborgen op een plaats, waar het gevaar van besmetting
      het geringst is. Bij het gebruik van metalen roestvrije tapelines die worden geborgen in een doos waarin enkele
      formalinetabletten aanwezig zijn, is het afzonderlijk reinigen niet nodig.

      2 De kapitein moet er op toezien, dat de persoon, belast met het peilen, onmiddellijk vóór hij gaat peilen, de
      handen wast.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4.3
  - number: '4.4'
    text: |-
      1 In kombuizen en pantry’s moet bij elke drinkwaterkraan een opschrift ‘drinkwater’ en bij elke zoutwaterkraan een
      opschrift ‘zoutwater’ aangebracht zijn.

      2 Na vertrek uit een haven moet de zoutwaterleiding, welke voor afwas van keuken- en eetgerei dient, buiten de
      driemijlsgrens geruime tijd worden doorgespoeld, voordat deze voor afwasdoeleinden gebezigd mag worden.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4.4
  - number: '4.5'
    text: |-
      De voorraad sterke drank aan boord is niet groter dan 0,1 liter per zeevarende per reisdag. Het aantal reisdagen
      wordt vastgesteld vanaf de dag van vertrek, tot en met de dag van aankomst in de eerst volgende haven waar het
      schip weer zal worden bevoorraad als vastgesteld overeenkomstig [artikel 4.1, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0032140
        artikel: '4.1'
        paragraaf: '4'
  - number: '4.6'
    text: |-
      1 Een inspectie als bedoeld in [artikel 48a, derde lid, van de wet][ref1] wordt minimaal één keer per maand
      uitgevoerd overeenkomstig het bepaalde in norm A3.2, lid 7, van het Maritiem Arbeidsverdrag.

      2 De bevindingen van de inspectie worden in het scheepsdagboek vermeld.

      3 Voor het uitvoeren van een inspectie van het drinkwater, worden alle noodzakelijke hygiënemaatregelen genomen om
      besmetting van het drinkwater te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48a
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48a
  - number: 4a.1
    text: |-
      In alle accommodatieruimten is voldoende stahoogte. Voor accommodatieruimten waar de vissers geacht worden
      gedurende langere tijd achtereen te staan is de stahoogte ten minste 200 centimeter.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.1
  - number: 4a.2
    text: |-
      1 Vanuit visruimen en machinekamers zijn geen directe openingen naar slaapruimten, behalve om als nooduitgang
      dienst te doen.

      2 Directe openingen naar slaapruimten vanuit kombuizen, opslagruimten, droogkamers of gemeenschappelijke sanitaire
      ruimten zijn waar redelijk en uitvoerbaar vermeden, tenzij uitdrukkelijk elders anders is bepaald.

      3 In afwijking van het eerste en tweede lid zijn in vissersvaartuigen met een lengte (L) van 24 meter of meer geen
      directe openingen naar slaapruimten vanuit visruimen, machineruimten, kombuizen, opslagruimten, droogkamers of
      gemeenschappelijke sanitaire ruimten, behalve ten behoeve van een nooduitgang.

      4 Het gedeelte van een schot dat in het derde lid bedoelde ruimten van nachtverblijven scheidt alsmede de
      buitenwanden, zijn doelmatig vervaardigd van staal of van ander goedgekeurd materiaal en zijn water- en gasdicht.

      5 Het derde lid sluit de aanwezigheid van gedeelde sanitaire ruimten tussen twee slaapruimten niet uit.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.2
  - number: 4a.3
    text: |-
      1 Accommodatieruimten zijn voldoende geïsoleerd.

      2 Materialen die zijn gebruikt voor de constructie van interne scheidingswanden, lambrisering en bekleding, evenals
      vloeren en verbindingselementen zijn geschikt voor het beoogde doel en dragen bij tot een gezonde omgeving.

      3 In alle accommodatieruimten is voldoende waterafvoer.

      4 Aan het gestelde in het eerste tot en met derde lid wordt in ieder geval voldaan indien norm A3.1, lid 6,
      onderdelen b en g, van het Maritiem Arbeidsverdrag, zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.3
  - number: 4a.4
    text: |-
      Alle praktische maatregelen worden getroffen om accommodatieruimten voor de bemanning van vissersvaartuigen
      te beschermen tegen vliegen en andere insecten, vooral wanneer het vissersvaartuig actief is in door muggen
      geteisterde gebieden.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.4
  - number: 4a.5
    text: Alle accommodatieruimten zijn voor zover nodig voorzien van nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.5
  - number: 4a.6
    text: |-
      1 Accommodatieruimten worden geventileerd, rekening houdend met de klimatologische omstandigheden.

      2 Het ventilatiesysteem zorgt constant voor voldoende verse lucht wanneer er vissers aan boord zijn.

      3 De ventilatievoorzieningen of andere maatregelen zijn zodanig uitgevoerd dat niet-rokers worden beschermd tegen
      tabaksrook.

      4 In aanvulling op het eerste en tweede lid zijn vissersvaartuigen met een lengte (L) van 24 meter of meer
      uitgerust met een ventilatiesysteem voor accommodatieruimten dat zodanig is ingesteld dat de lucht van voldoende
      kwaliteit is en gewaarborgd is dat de luchtcirculatie voldoende is onder alle weers- en klimatologische
      omstandigheden. Het ventilatiesysteem is te allen tijde in bedrijf wanneer er vissers aan boord zijn.

      5 Aan het gestelde in het eerste tot en met vierde lid wordt in ieder geval voldaan indien norm A3.1, lid
      7, onderdeel b, en leidraad B3.1.2 van het Maritiem Arbeidsverdrag, zoals die luidde op 15 november 2019, is
      toegepast.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.6
  - number: 4a.7
    text: |-
      1 Accommodatieruimten worden voldoende verwarmd, rekening houdend met de klimatologische omstandigheden.

      2 In aanvulling op het eerste lid worden vissersvaartuigen met een lengte (L) van 24 meter of meer, met
      uitzondering van vissersvaartuigen die uitsluitend in tropische gebieden actief zijn, voldoende verwarmd door
      middel van een geschikt verwarmingssysteem.

      3 Het in het tweede lid bedoelde verwarmingssysteem zorgt, voor zover nodig, onder alle omstandigheden voor warmte
      en is operationeel wanneer vissers aan boord verblijven of werken en wanneer de omstandigheden dat vereisen.

      4 Vissersvaartuigen met een lengte (L) van 24 meter of meer zijn, met uitzondering van vissersvaartuigen die
      regelmatig actief zijn in gebieden waar de gematigde klimatologische omstandigheden geen airconditioning vereisen,
      voorzien van airconditioning in accommodatieruimten, op de brug, in de radiokamer en in de gecentraliseerde
      machinecontrolekamer.

      5 Aan het gestelde in het eerste tot en met vierde lid wordt in ieder geval voldaan indien norm A3.1, lid 7,
      onderdelen b en d, en leidraad B3.1.3, lid 2 en 3, van het Maritiem Arbeidsverdrag, zoals die luidde op 15 november
      2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.7
  - number: 4a.8
    text: |-
      1 Accommodatieruimten zijn van voldoende verlichting voorzien.

      2 Indien uitvoerbaar zijn accommodatieruimten met zowel daglicht als kunstlicht verlicht.

      3 Slaapruimten kunnen worden afgeschermd van daglicht.

      4 In iedere kooi is in aanvulling op de normale verlichting van de slaapruimte voldoende leesverlichting aanwezig.

      5 Aan het gestelde in het eerste tot en met vierde lid wordt in ieder geval voldaan indien leidraad B3.1.4, lid 1,
      van het Maritiem Arbeidsverdrag zoals die luidde op 15 november 2019 is toegepast.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.8
  - number: 4a.9
    text: |-
      1 Slaapruimten zijn voorzien van noodverlichting.

      2 Indien eetruimten, gangen of andere ruimten nooduitgang zijn en niet zijn voorzien van noodverlichting, zijn deze
      voorzien van permanente nachtverlichting.

      3 Vissersvaartuigen met een lengte (L) van 24 meter of meer zijn, in alle delen van de accommodatie waar de
      bemanning zich vrij kan bewegen, voorzien van verlichting die ten minste zodanig is dat een persoon met een normaal
      gezichtsvermogen in staat is een normaal gedrukte krant op een heldere dag te lezen.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.9
  - number: 4a.10
    text: |-
      1 Indien het ontwerp, de afmetingen of het gebruik van het vissersvaartuig dat toelaat, zijn slaapruimten zodanig
      geplaatst dat de gevolgen van bewegingen en versnellingen van het vissersvaartuig tot een minimum beperkt blijven.

      2 Slaapruimten zijn achter het aanvaringsschot gelegen.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.10
  - number: 4a.11
    text: |-
      1 Het aantal personen per slaapruimte en het vloeroppervlak per persoon, exclusief de ruimte ingenomen door kooien
      en kasten, is zodanig dat, rekening houdend met het gebruik van het vaartuig, de vissers aan boord beschikken over
      voldoende ruimte en comfort.

      2 Aan het gestelde in het eerste lid wordt in ieder geval voldaan indien het vloeroppervlak per persoon in een
      slaapruimte voor scheepsgezellen of in een gecombineerd slaapruimte voor officieren en scheepsgezellen, de ruimte
      ingenomen door kooien en kasten niet meegerekend, ten minste bedraagt:

      a. op schepen met een lengte van 13 tot 19 meter: 0,75 vierkante meter;

      b. op schepen met een lengte van 19 tot 24 meter: 1 vierkante meter.

      3 In aanvulling op het eerste en tweede lid is op vissersvaartuigen met een lengte (L) van 24 meter of meer maar
      minder dan 45 meter het vloeroppervlak van slaapruimten, exclusief de ruimte ingenomen door kooien en kasten, per
      persoon ten minste 1,5 vierkante meter.

      4 In aanvulling op het eerste en tweede lid is op vissersvaartuigen met een lengte (L) van 45 meter of meer het
      vloeroppervlak van slaapruimten, exclusief de ruimte ingenomen door kooien en kasten, per persoon ten minste 2
      vierkante meter.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.11
  - number: 4a.12
    text: |-
      1 Tenzij uitdrukkelijk anders bepaald, is het toegestane aantal personen per slaapruimte niet meer dan zes.

      2 Op vissersvaartuigen met een lengte (L) van 24 meter of meer is het toegestane aantal personen per slaapruimte
      niet meer dan vier. De Minister kan in bepaalde gevallen uitzonderingen op dit vereiste toestaan, indien het
      vereiste vanwege de grootte, het type of het beoogde gebruik van het vissersvaartuig naleving onredelijk of
      onmogelijk maakt.

      3 Tenzij uitdrukkelijk anders bepaald en indien uitvoerbaar zijn voor officieren een of meer afzonderlijke
      slaapruimten aanwezig.

      4 Het maximumaantal personen dat in een slaapruimte kan worden ondergebracht is duidelijk leesbaar en onuitwisbaar
      vermeld op een duidelijk zichtbare plaats in de slaapruimte.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.12
  - number: 4a.13
    text: |-
      1 Op vissersvaartuigen met een lengte (L) van 24 meter of meer beschikken officieren waar mogelijk over een aparte
      slaapruimte, in geen geval zal de slaapruimte voor officieren meer dan twee kooien bevatten.

      2 Onze Minister kan in bepaalde gevallen afwijken van het eerste lid, indien de eisen vanwege de omvang, het type
      of het beoogde gebruik van het vaartuig onredelijk of niet uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.13
  - number: 4a.14
    text: |-
      1 Kooien hebben geschikte afmetingen voor één persoon, de matrassen zijn vervaardigd van geschikt materiaal.

      2 Op vissersvaartuigen met een lengte (L) van 24 meter of meer zijn de binnenmaten van kooien ten minste 200 bij
      80 centimeter.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.14
  - number: 4a.15
    text: |-
      1 Slaapruimten zijn zodanig gelegen en ingericht dat een redelijk comfort voor de vissers is gewaarborgd en netheid
      wordt bevorderd.

      2 Slaapruimten zijn ingericht met kooien, individuele kasten voor kleding en andere persoonlijke eigendommen en een
      geschikt schrijfoppervlak.

      3 Slaapruimten op vissersvaartuigen met een lengte (L) van 24 meter of meer zijn voorzien van een schrijftafel
      met stoel.

      4 Indien uitvoerbaar zijn slaapruimten zodanig gelegen of ingericht dat de privacy voor mannen en voor vrouwen
      voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.15
  - number: 4a.16
    text: |-
      1 Vissersvaartuigen zijn voorzien van geschikte eetruimten, waar mogelijk, gescheiden van de slaapruimten.

      2 Eetruimten zijn zo dicht mogelijk bij de kombuis gelegen, maar zijn niet gelegen voor het aanvaringsschot.

      3 In aanvulling op het eerste en tweede lid zijn op vissersvaartuigen met een lengte (L) van 24 meter of meer de
      eetruimten gescheiden van slaapruimten.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.16
  - number: 4a.17
    text: |-
      1 De afmetingen en uitrusting van een eetruimte zijn geschikt voor het aantal personen aan boord.

      2 Op vissersvaartuigen met een lengte (L) van 12 meter of meer zijn voor vissers te allen tijde een koelkast met
      voldoende capaciteit en voorzieningen voor het bereiden van warme en koude dranken beschikbaar.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.17
  - number: 4a.18
    text: |-
      1 Voor alle personen zijn sanitaire voorzieningen aanwezig, bestaande uit toiletten, wastafels, en baden of douches
      al naar gelang het gebruik van het vissersvaartuig. Deze voorzieningen voldoen ten minste aan de minimumnormen op
      het gebied van gezondheid en hygiëne en aan redelijke kwaliteitsnormen.

      2 Sanitaire voorzieningen zijn zodanig uitgevoerd dat verontreiniging van andere ruimten uitgesloten is.

      3 Sanitaire voorzieningen bieden redelijke privacy.

      4 Aan het gestelde in het eerste tot en met derde lid wordt in ieder geval voldaan indien norm A3.1, lid 11,
      onderdelen a tot en met c, van het Maritiem Arbeidsverdrag zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.18
  - number: 4a.19
    text: |-
      1 Koud en warm stromend water zijn in zodanig voldoende mate beschikbaar voor alle vissers en alle overige personen
      aan boord dat een behoorlijke hygiëne mogelijk is.

      2 Sanitaire voorzieningen zijn voorzien van ventilatie met buitenlucht die onafhankelijk is van overige
      accommodatieruimten.

      3 Oppervlakken in sanitaire accommodatieruimten zijn eenvoudig en doeltreffend te reinigen. Vloeren zijn voorzien
      zijn van een antislip laag.

      4 In aanvulling op het eerste tot en met derde lid zijn op vissersvaartuigen met een lengte (L) van 24 meter of
      meer voor vissers, die niet beschikken over een eigen slaapruimte met bijbehorende sanitaire voorzieningen, ten
      minste een bad of douche, een toilet en een wasbak per vier of minder personen aanwezig.

      5 Aan het gestelde in het eerste tot en met vierde lid wordt in ieder geval voldaan indien norm A3.1, lid 7,
      onderdeel c, lid 11, onderdelen a tot en met d en f, en leidraad B3.1.7, lid 1 tot en met lid 3, van het Maritiem
      Arbeidsverdrag zoals die luidde op 15 november 2019, is toegepast.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.19
  - number: 4a.20
    text: |-
      1 De nodige voorzieningen voor het wassen en drogen van kleding zijn beschikbaar, rekening houdend met het gebruik
      van het vissersvaartuig.

      2 In aanvulling op het eerste lid zijn op vissersvaartuigen met een lengte (L) van 24 meter of meer toereikende
      voorzieningen voor het wassen, drogen en strijken van kleding beschikbaar.

      3 In aanvulling op het eerste lid zijn op vissersvaartuigen met een lengte (L) van 45 meter of meer toereikende
      voorzieningen voor het wassen, drogen en strijken van kleding beschikbaar die zijn gelegen in een van slaapruimten,
      eetruimten en toiletten afgescheiden ruimte, die voldoende is geventileerd en verwarmd en is voorzien van waslijnen
      of andere middelen voor het drogen van kleding.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.20
  - number: 4a.21
    text: |-
      1 Wanneer nodig wordt een slaapruimte beschikbaar gemaakt als ziekenverblijf voor een zieke of gewonde visser.

      2 Op vissersvaartuigen van meer dan 950 GT die met een bemanning van 15 vissers of meer een reis van meer dan drie
      dagen maken, en vissersvaartuigen, ongeacht het aantal bemanningsleden en de duur van de reis, met een lengte (L)
      van 45 meter of meer is een aparte ziekenboeg aanwezig waar medische zorg kan worden verleend.

      3 De ziekenboeg is adequaat uitgerust en verkeert te allen tijde in hygiënische staat.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.21
  - number: 4a.22
    text: |-
      Buiten slaapruimten, maar op een gemakkelijk bereikbare plaats, is een ruimte beschikbaar voor het ophangen van
      spullen voor gebruik bij slecht weer en andere persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.22
  - number: 4a.23
    text: |-
      1 Aan alle vissers aan boord worden eetgerei, beddengoed en ander linnengoed verstrekt.

      2 De kosten van het in het eerste lid bedoelde linnengoed kunnen worden ingehouden als exploitatiekosten
      indien de zee-arbeidsovereenkomst in de zeevisserij, de toepasselijke collectieve arbeidsovereenkomst of de
      maatschapsovereenkomst op grond waarvan de vissers werk verrichten daarin voorziet.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.23
  - number: 4a.24
    text: |-
      1 Vissersvaartuigen met een lengte (L) van 24 meter of meer beschikken over geschikte recreatieve voorzieningen en
      -diensten voor alle vissers aan boord.

      2 Indien geschikt kunnen eetruimten worden gebruikt voor recreatie.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.24
  - number: 4a.25
    text: |-
      Alle vissers aan boord krijgen, voor zover mogelijk en binnen redelijke grenzen, toegang tot
      communicatievoorzieningen tegen een redelijke kostprijs die de totale kostprijs voor de eigenaar van het
      vissersvaartuig niet overstijgt.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.25
  - number: 4a.26
    text: |-
      1 Aan boord zijn kookvoorzieningen en kookgerei beschikbaar. Tenzij uitdrukkelijk anders bepaald en indien
      uitvoerbaar zijn deze ondergebracht in een afzonderlijke kombuis.

      2 Een kombuis, of de kookplaats indien geen afzonderlijke kombuis aanwezig is, is van voldoende afmetingen, goed
      verlicht, geventileerd en naar behoren uitgerust en onderhouden.

      3 In aanvulling op het eerste en tweede lid, beschikken vissersvaartuigen met een lengte (L) van 24 meter of meer
      over een afzonderlijke kombuis.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.26
  - number: 4a.27
    text: |-
      Tanks of flessen met butaan- of propaangas voor het koken in een kombuis zijn geplaatst op het open dek en afdoende
      beschermd tegen externe hittebronnen en andere externe invloeden.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.27
  - number: 4a.28
    text: |-
      1 Aan boord is een geschikte plaats met voldoende capaciteit aanwezig voor de opslag van levensmiddelen zodat deze
      droog, koel en goed geventileerd blijven en bederf wordt voorkomen en worden waar mogelijk koelkasten of andere
      voorzieningen voor opslag bij lage temperaturen worden gebruikt.

      2 Vissersvaartuigen met een lengte (L) van 12 meter of meer beschikken over een provisiekamer, een koelkast en
      andere voorzieningen voor koele opslag.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.28
  - number: 4a.29
    text: |-
      1 Aan boord is voldoende voeding en drinkwater aanwezig voor de vissers aan boord gelet op de duur en aard van
      de reis.

      2 Voeding en drinkwater zijn wat betreft voedingswaarde, kwaliteit, kwantiteit en variatie geschikt, waarbij ook
      rekening is gehouden met de voorschriften en gebruiken omtrent voeding die voortvloeien uit de religie en cultuur
      van de vissers.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.29
  - number: 4a.30
    text: |-
      1 Accommodatieruimten worden schoon en bewoonbaar gehouden en zijn vrij van goederen en voorraden die niet tot de
      persoonlijke eigendommen van de visser behoren en niet bedoeld zijn voor hun veiligheid of redding in geval van
      nood.

      2 Een kombuis en de opslagvoorzieningen voor levensmiddelen worden in een hygiënische staat gehouden.

      3 Afval wordt bewaard in goed afgesloten containers en tijdig afgevoerd uit de ruimten waar voedsel wordt bereid.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.30
  - number: 4a.31
    text: |-
      1 Aan boord van vissersvaartuigen met een lengte (L) van meer dan 24 meter worden door of op gezag van de schipper
      een maal per reis doch ten minste een maal per maand inspecties uitgevoerd om te waarborgen dat:

      a. accommodatieruimten schoon, aanvaardbaar bewoonbaar, veilig en in een goede staat van onderhoud verkeren;

      b. voedsel- en watervoorraden toereikend zijn; en

      c. kombuis, ruimten en uitrusting voor de opslag van voedsel hygiënisch zijn en in een goede staat van onderhoud
      verkeren.

      2 De bevindingen van deze inspecties en de getroffen maatregelen om eventuele tekortkomingen te verhelpen worden
      vermeld in het scheepsdagboek.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.31
  - number: 4a.32
    text: |-
      De Minister kan na overleg met de betrokken organisaties van scheepsbeheerders en vissers uitzonderingen op de
      bepalingen van deze paragraaf toestaan opdat, zonder discriminatie, rekening kan worden gehouden met de belangen
      van vissers met onderling verschillende en bijzondere religieuze en sociale gewoonten, op voorwaarde dat deze
      uitzonderingen er niet toe leiden dat de algemene algehele omstandigheden minder gunstig zijn dan die welke
      voortvloeien uit de toepassing van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel4a.32
  - number: '5.1'
    text: |-
      1 Een verklaring naleving maritieme arbeid deel I bevat de elementen als bedoeld in norm A5.1.3, lid 10, onderdeel
      a, van het Maritiem Arbeidsverdrag en wordt opgesteld met inachtneming van leidraad B5.1.3, leden 1 en 4, van het
      Maritiem Arbeidsverdrag.

      2 Het in [artikel 5.8, derde lid][ref1], bedoelde model bevat een opsomming van de eisen bedoeld in
      [artikel 48c, eerste lid, van de wet][ref2] die op de desbetreffende schepen van toepassing zijn. Daarbij wordt
      voor wat betreft de voorschriften met betrekking tot huisvesting en voorzieningen voor zeevarenden onderscheid
      gemaakt tussen de verschillende typen schepen, bedoeld in [artikel 1.1][ref3], de categorieën van schepen bedoeld
      in [artikel 1.3][ref4], het tonnage en de bouwdatum van het schip.


