  - number: '5.4'
    text: |-
      1 De uitkomsten van een inspectie als bedoeld in [artikel 5.3][ref1] worden door de betrokken ambtenaar of
      degene die namens een rechtspersoon de inspectie heeft uitgevoerd opgenomen in een inspectierapport, waarbij alle
      eventuele zwaarwegende tekortkomingen uitdrukkelijk worden vermeld. De datum waarop wordt vastgesteld dat een
      zwaarwegende tekortkoming is verholpen, wordt eveneens aangetekend op het inspectierapport.

      2 Een afschrift van het inspectierapport wordt in de werktaal van het schip en in het Engels, indien de werktaal
      geen Engels is en het schip internationale reizen maakt, verstrekt aan de kapitein.

      3 De kapitein verstrekt op verzoek een afschrift van het inspectierapport alsmede van het certificaat maritieme
      arbeid en de verklaring naleving maritieme arbeid in het Engels of in de werktaal van het schip, aan krachtens
      [artikel 48d van de wet][ref2] aangewezen ambtenaren, aan inspecteurs van een havenstaat of aan vertegenwoordigers
      van scheepsbeheerders of zeevarenden.

      4 Een afschrift van het inspectierapport wordt aan boord van het schip op een duidelijk zichtbare en voor de
      bemanning toegankelijke plaats beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel48d
