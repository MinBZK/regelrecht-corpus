  - number: '5.9'
    text: |-
      1 Een erkenning als bedoeld in [artikel 48d, vierde lid, van de wet][ref1] kan worden verleend aan rechtspersonen
      die voldoen aan de volgende criteria:

      a. de rechtspersoon beschikt over een gecertificeerd kwaliteitssysteem, waarin de procedures alsmede het beheer van
      alle documentatie met betrekking tot de onderzoeken waarvoor de aanwijzing geldt zijn geborgd;

      b. de rechtspersoon heeft de beschikking over een wereldwijd netwerk van voldoende en bekwaam personeel met
      voldoende en actuele kennis van het Maritiem Arbeidsverdrag en de Nederlandse wettelijke vereisten voor de afgifte
      van een certificaat maritieme arbeid, alsmede ervaring met betrekking tot het onderzoeken van schepen; en

      c. de rechtspersoon voert een onafhankelijke bedrijfsvoering en kan daarover verantwoording afleggen.

      2 Een rechtspersoon als bedoeld in het eerste lid houdt kantoor in Nederland en heeft met de Staat een overeenkomst
      gesloten met betrekking tot de taken die zij in het kader van de aanwijzing uitvoert, waarin de in leidraad B5.1.2
      van het Maritiem Arbeidsverdrag genoemde onderwerpen zijn opgenomen.

      3 Rechtspersonen die zijn erkend op grond van [verordening (EG) nr. 391/2009](32009R0391) van het Europees
      Parlement en de Raad van 23 april 2009, worden geacht te voldoen aan de erkenningscriteria, bedoeld in het eerste
      lid, onderdeel c, en het tweede lid.

      4 Een erkenning wordt verleend voor onbepaalde tijd. Een erkenning kan worden ingetrokken indien de rechtspersoon
      waaraan de erkenning is verleend, niet meer voldoet aan een van de in het eerste lid genoemde criteria.

      5 Een besluit tot erkenning of intrekking van een erkenning wordt bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48d
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel5.9
