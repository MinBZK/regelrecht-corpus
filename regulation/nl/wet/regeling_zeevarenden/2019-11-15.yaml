  - number: '4.1'
    text: |-
      1 Voor de bevoorrading van een schip met levensmiddelen die voldoen aan de in [artikel 48a van de wet][ref1]
      bedoelde eisen, worden de soorten en hoeveelheden mee te nemen levensmiddelen bepaald op basis van:

      a. het aantal zeevarenden aan boord;

      b. de duur van de reis;

      c. de aard van de reis;

      d. de mogelijkheid tot het aanvullen van voorraden in aanloophavens; en

      e. de religieuze achtergrond en de culturele gewoonten van de zeevarenden.

      2 De voorraden levensmiddelen worden opgeslagen in de in [artikel 3.18, derde lid][ref2], bedoelde bergplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0032140#Artikel3.18
