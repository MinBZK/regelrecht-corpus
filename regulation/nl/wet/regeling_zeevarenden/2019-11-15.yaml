  - number: '5.6'
    text: |-
      1 Een aanvraag voor een certificaat maritieme arbeid of een voorlopig certificaat maritieme arbeid wordt
      schriftelijk ingediend bij een op grond van [artikel 48d, eerste lid van de wet][ref1] aangewezen ambtenaar of
      rechtspersoon. Daarbij verstrekt de scheepsbeheerder de volgende gegevens en documenten:

      a. naam van het schip;

      b. IMO-nummer van het schip;

      c. de naam van de scheepsbeheerder;

      d. technische gegevens van het schip, inclusief de op grond van [artikel 3.23][ref2] goedgekeurde plannen;

      e. de datum van de kiellegging.

      2 Op basis van de gegevens bedoeld in het eerste lid, ontvangt de scheepsbeheerder een verklaring naleving
      maritieme arbeid deel I, aan de hand waarvan de scheepsbeheerder een verklaring naleving maritieme arbeid deel
      II opstelt die in overeenstemming is met het bepaalde in [artikel 5.2][ref3] en [5.8, vierde lid][ref4], en, voor
      zover van toepassing, [artikel 5.5, derde lid][ref5].

      3 Nadat de in het eerste lid bedoelde ambtenaar of rechtspersoon, de verklaring naleving maritieme arbeid deel
      II heeft ontvangen, worden de in [artikel 5.3][ref6] of [artikel 5.5, vierde lid][ref7], bedoelde onderzoeken
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48d
