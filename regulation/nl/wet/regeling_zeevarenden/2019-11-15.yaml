  - number: '6.1'
    text: |-
      1 Na het uitvoeren van een inspectie als bedoeld in [artikel 5.3, tweede, derde of vierde lid][ref1], worden door
      de betrokken ambtenaar of degene die namens een rechtspersoon de inspectie heeft uitgevoerd, de volgende gegevens
      in het in [artikel 65, tweede lid, van de wet][ref2] bedoelde register geregistreerd:

      a. naam van het schip;

      b. IMO-nummer van het schip;

      c. naam van de scheepsbeheerder van het schip;

      d. naam van de op grond van [artikel 48d, eerste lid, van de wet][ref3] aangewezen ambtenaar of degene die namens
      een rechtspersoon de inspectie heeft uitgevoerd;

      e. datum en plaats van de inspectie;

      f. de resultaten van vraaggesprekken met zeevarenden aan boord;

      h. informatie betreffende eventuele inbreuken op de wetgeving, opgelegde sancties en aanhouding van het schip;

      i. gerapporteerde arbeidsongevallen.

      2 Rechtspersonen die zijn aangewezen op grond van [artikel 48d, eerste lid, van de wet][ref4], dragen er zorg voor
      dat de in het eerste lid bedoelde inspectiegegevens in het register worden geregistreerd op de door de minister bij
      die aanwijzing voorgeschreven wijze.

      3 De minister brengt binnen zes maanden na afloop van elk kalenderjaar een verslag uit van de in het desbetreffende
      jaar uitgevoerde inspecties.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel5.3
