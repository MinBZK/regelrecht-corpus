      1 Het model van het certificaat maritieme arbeid is opgenomen in [bijlage B][ref1] bij deze regeling.

      2 Het model van het voorlopige certificaat maritieme arbeid is opgenomen in [bijlage C][ref2] bij deze regeling.

      3 De modellen van de verklaring naleving maritieme arbeid, deel I, zijn opgenomen in [bijlage D][ref3] bij deze
      regeling.

      4 Het model van de verklaring naleving maritieme arbeid, deel II, is opgenomen in [bijlage E][ref4] bij deze
      regeling.

      5 De in het eerste tot en met het vierde lid bedoelde documenten zijn slechts geldig indien ze zijn opgesteld
      overeenkomstig de in de bijlagen bij deze regeling opgenomen modellen en naar waarheid zijn ingevuld.


