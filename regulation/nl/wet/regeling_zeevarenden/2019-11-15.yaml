      Arbeidsverdrag.

      3 Op schepen van minder dan 200 GT is norm A.3.1, lid 11, onderdeel d, van het Maritiem Arbeidsverdrag ten aanzien
      van wastafels in nachtverblijven, niet van toepassing.


