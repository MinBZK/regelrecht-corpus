    text: |-
      Voor de afgifte van het certificaat aanvulling-W voor reizen nabij de internationale kust heeft de aanvrager met
      goed gevolg een door Onze Minister erkende training afgerond die de in [bijlage F, onderdeel E][ref1], genoemde
      onderdelen van tabel A-III/2, behorende bij sectie A-III/3 van de STCW-Code beslaat.


