  - number: '3.19'
    text: |-
      1 Als goedgekeurde materialen en producten worden aangemerkt, materialen en producten die voldoen aan de in
      leidraad B3.1.1, lid 5, B3.1.5, lid 9, B3.1.7, lid 2 en lid 3, onderdeel b, en B3.1.10, lid 1, onderdeel b, van het
      Maritiem Arbeidsverdrag genoemde omschrijving.

      2 Materialen of producten die op grond van de daarop van toepassing zijnde regelgeving, een CE-markering hebben,
      worden aangemerkt als goedgekeurde materialen of producten, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel3.19
  - number: '3.20'
    text: |-
      1 De verblijven worden schoon, bewoonbaar en in een goede staat van onderhoud gehouden.

      2 Ten minste eenmaal per maand worden de verblijven ten behoeve van de naleving van het bepaalde in het eerste
      lid, door de kapitein of een door hem aangewezen officier, in aanwezigheid van een of meer leden van de bemanning,
      geïnspecteerd. De bevindingen van deze inspectie worden vermeld in het scheepsdagboek.

      3 Zolang zeevarenden aan boord zijn, wordt met betrekking tot de verwarming van de verblijven aan boord voldaan aan
      leidraad B3.1.3, lid 1, van het Maritiem Arbeidsverdrag.

      4 Ziekenverblijven worden uitsluitend gebruikt voor medische doeleinden.

      5 Dit artikel is ook van toepassing op de in [artikel 1.3, onderdeel a en c][ref1], bedoelde schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel1.3
