  - number: '5.3'
    text: |-
      1 Een certificaat maritieme arbeid heeft een geldigheidsduur van ten hoogste vijf jaren.

      2 Ter verkrijging van een certificaat maritieme arbeid, bij een tussentijdse inspectie als bedoeld in het derde
      lid, en bij een verlengingsinspectie als bedoeld in het vierde lid:

      a. wordt onderzocht of het schip voldoet aan de eisen als bedoeld in [artikel 48c, eerste lid, van de wet][ref1],
      en aan de voorschriften genoemd op de toepasselijke verklaring naleving maritieme arbeid deel I; en

      b. wordt beoordeeld of de verklaring naleving maritieme arbeid deel II voldoet aan het bepaalde in
      [artikel 5.2][ref2], en of op basis van de inhoud van die verklaring voldoende is gewaarborgd dat de in onderdeel a
      bedoelde eisen die op het desbetreffende schip van toepassing zijn, voortdurend worden nageleefd.

      3 Tijdens de geldigheidsduur van het certificaat maritieme arbeid wordt het schip onderworpen aan een tussentijdse
      inspectie die plaatsvindt tussen de tweede en derde verjaardatum van het certificaat. Van een goed verlopen
      tussentijdse inspectie wordt aantekening gemaakt op het certificaat.

      4 Het onderzoek ter verlenging van een certificaat maritieme arbeid vindt plaats voor de vijfde verjaardatum
      van het certificaat. Indien de verlengingsinspectie wordt afgerond binnen drie maanden voor de vervaldatum
      van het bestaande certificaat, is het nieuwe certificaat maritieme arbeid geldig vanaf de datum waarop de
      verlengingsinspectie is afgerond voor een tijdvak dat ten hoogste loopt tot vijf jaar na de vervaldatum van het
      bestaande certificaat. Indien de verlengingsinspectie meer dan drie maanden voor de vervaldatum van het bestaande
      certificaat wordt afgerond, is het nieuwe certificaat maritieme arbeid geldig voor vijf jaar gerekend vanaf de
      datum waarop de verlengingsinspectie is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
      [ref2]: https://wetten.overheid.nl/BWBR0032140#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel5.3
