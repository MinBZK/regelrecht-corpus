  - number: '5.10'
    text: |-
      1 Een rechtspersoon die is erkend overeenkomstig het bepaalde in [artikel 5.9][ref1] en die is aangewezen op grond
      van [artikel 6, tweede lid, van de Schepenwet][ref2], kan de minister verzoeken om een aanwijzing als bedoeld in
      [artikel 48d, eerste lid, van de wet][ref3].

      2 Een aanwijzing wordt ingetrokken indien de in [artikel 5.9][ref4] bedoelde erkenning wordt ingetrokken

      3 Een aanwijzing kan worden ingetrokken indien de aangewezen rechtspersoon handelt in strijd met een voorschrift
      dat is verbonden aan de aanwijzing of in strijd met de overeenkomst, bedoeld in [artikel 5.9, tweede lid][ref5].

      4 Een aanwijzing kan worden geschorst indien door een handeling of nalaten van de aangewezen rechtspersoon ernstig
      gevaar voor de veiligheid kan of is ontstaan.


