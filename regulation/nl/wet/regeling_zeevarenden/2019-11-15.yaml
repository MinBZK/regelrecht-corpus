      1 Op passagiersschepen en schepen voor bijzondere doeleinden is het overeenkomstig norm A3.1, lid 6, onderdeel d,
      van het Maritiem Arbeidsverdrag toegestaan nachtverblijven onder de referentielastlijn te plaatsen. In afwijking
      van norm A3.1, lid 6, onderdeel d, van het Maritiem Arbeidsverdrag kunnen als wezenlijk gelijkwaardige bepaling als
      bedoeld in artikel VI, lid 3, van het Maritiem Arbeidsverdrag, nachtverblijven onder werkgangen worden geplaatst,
      indien deze nachtverblijven zodanig zijn geïsoleerd dat wordt voldaan aan de normen voor geluidsisolatie tussen
      nachtverblijven en dagverblijven van de bij resolutie A.468(12) door de Algemene Vergadering van de Internationale
      Maritieme Organisatie aangenomen Code over geluidsniveaus op schepen. Voor schepen groter dan 1600 GT en indien
      de betreffende schepen zijn gebouwd op of na 1 juli 2014 is resolutie MSC.337 (91) van de Internationale Maritieme
      Organisatie over geluidsniveaus op schepen van toepassing.

      2 Nachtverblijven als bedoeld in het eerste lid voldoen aan de volgende eisen:

      a. in het nachtverblijf wordt continue klimaatbeheersing toegepast die adequaat condensvorming en vochtgerelateerde
      geuren bestrijdt; en

      b. de lichtsterkte van de verlichting is variabel instelbaar om het gebrek aan daglicht naar behoefte van de
      zeevarende te kunnen compenseren.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel3.6
  - number: '3.7'
    text: |-
      1 De minister kan ontheffing verlenen van norm A3.1, lid 6, onderdeel c, van het Maritiem Arbeidsverdrag voor het
      plaatsen van nachtverblijven voor midscheeps indien de grootte, het type of de beoogde dienst van het schip een
      andere ligging praktisch onmogelijk maakt.

      2 Voor schepen voor bijzondere doeleinden kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, ontheffing verlenen van norm A3.1, lid 6, onderdeel d, van het Maritiem
      Arbeidsverdrag, voor het plaatsen van nachtverblijven zonder daglicht boven de lastlijn indien de grootte, het
      type of de beoogde dienst van het schip een andere ligging praktisch onmogelijk maakt en de lichtsterkte van de
      verlichting in de nachtverblijven variabel instelbaar is om het gebrek aan daglicht naar behoefte van de zeevarende
      te kunnen compenseren.

      3 In afwijking van [artikel 3.3, eerste lid][ref1], en in overeenstemming met norm A3.1, lid 8, van het Maritiem
      Arbeidsverdrag, zijn op passagiersschepen nachtverblijven toegestaan waar geen daglicht kan toetreden indien:

      a. de lichtsterkte van de verlichting variabel instelbaar is om het gebrek aan daglicht naar behoefte van de
      zeevarende te kunnen compenseren; en

      b. materialen en kleuren voor wand- en vloerbedekking worden toegepast die zijn gericht op ruimtebeleving.

      4 Voor schepen van minder dan 3000 GT, niet zijnde passagiersschepen, of voor schepen voor bijzondere doeleinden
      kan de minister, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, ontheffing verlenen
      van het bepaalde in norm A3.1, lid 9, onderdeel a, van het Maritiem Arbeidsverdrag dat voor elke zeevarende een
      individueel nachtverblijf beschikbaar moet zijn.

      5 Voor schepen van minder dan 3000 GT, passagiersschepen, of voor schepen voor bijzondere doeleinden kan de
      minister in overeenstemming met norm A3.1, lid 9, onderdeel g, ontheffing verlenen van norm A3.1, lid 9, onderdeel
      f, van het Maritiem Arbeidsverdrag met betrekking tot het minimale vloeroppervlak van individuele nachtverblijven,
      indien daarmee kan worden voorzien in individuele nachtverblijven. Deze individuele nachtverblijven zijn nooit
      kleiner dan 3,75 m2.

      6 Voor schepen van minder dan 3000 GT kan de minister na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, ontheffing verlenen van het bepaalde in norm A3.1, lid 9, onderdeel m, van het
      Maritiem Arbeidsverdrag met betrekking tot aan nachtverblijven grenzende individuele verblijven.

      7 Voor schepen van minder dan 200 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, en met inachtneming van de grootte van het schip en het aantal opvarenden aan
      boord, ontheffing verlenen van het bepaalde in norm A.3.1, lid 9, onderdeel f en onderdelen h tot en met l, van het
      Maritiem Arbeidsverdrag met betrekking tot het minimale vloeroppervlak, met dien verstande dat de vloeroppervlakte
      van individuele nachtverblijven ten minste 3 m2is, de vloeroppervlakte van nachtverblijven voor meer dan één
      persoon ten minste 2 m2per persoon is, en de vloeroppervlakte van nachtverblijven voor officieren ten minste 4 m2.

      8 De minister kan ontheffing verlenen van de normering van:

      a. leidraad B3.1.5, lid 2, van het Maritiem Arbeidsverdrag dat nachtverblijven eigen sanitaire voorzieningen
      hebben;

      b. leidraad B3.1.5, lid 3, van het Maritiem Arbeidsverdrag dat nachtverblijven zodanig zijn ingericht dat de
      wachten afgescheiden zijn en overdag werkende zeevarenden zijn gescheiden van ’s nachts werkende zeevarenden.


