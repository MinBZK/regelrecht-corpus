    text: |-
      Voor de afgifte van het kennisbewijs hoger maritiem officier alle schepen of middelbaar maritiem officier alle
      schepen:

      a. voldoet de aanvrager aan de volgende onderdelen van voorschriften van de bijlage bij het STCW-Verdrag:

      1°. voorschrift II/1, lid 2, onderdelen 2 tot en met 6;

      2°. voorschrift II/2, lid 2, onderdeel 2;

      3°. voorschrift III/1, lid 2, onderdelen 2 tot en met 5; en

      4°. voorschrift III/2, lid 2, onderdeel 2;

      b. heeft de aanvrager met goed gevolg examen afgelegd ter afsluiting van een opleiding die voldoet aan de volgende
      onderdelen van de STCW-Code:

      1°. sectie A-II/1, onderdeel 1, onder 1, en onderdelen 2 tot en met 6;

      2°. sectie A-II/2, onderdelen 1 tot en met 7, waarbij het in onderdeel 4 bedoelde kennisniveau de functie kapitein
      betreft en waarbij het in onderdeel 5 bedoelde niveau alle schepen betreft;

      3°. sectie A-III/1, onderdelen 1 tot en met 6 en 9; en

      4°. sectie A-III/2, onderdelen 1 tot en met 7, met uitzondering van de aspecten voorstuwing door middel van
      stoomturbines en voorstuwing door middel van gasturbines, en waarbij het in onderdeel 4 bedoelde kennisniveau de
      functie hoofdwerktuigkundige alle schepen betreft; en

      c. heeft de aanvrager als onderdeel van de in onderdeel b bedoelde opleiding gedurende ten minste 12 maanden
      ervaring opgedaan, die in gelijke mate bestaat uit wachtwerkzaamheden op de brug en uit wachtwerkzaamheden in de
      machinekamer, onder bijhouding van een door de kapitein en door de hoofdwerktuigkundige of een eerste maritiem
      officier af te tekenen stageboek.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel8.1
