  - number: '7.3'
    text: |-
      1 Een klacht als bedoeld in [artikel 69b van de wet][ref1] wordt ingediend bij de voor de klachtenbehandeling
      door de Inspecteur-Generaal van de Inspectie Leefomgeving en Transport aangewezen ambtenaren van die inspectie. De
      Inspecteur-Generaal draagt zorg voor een vertrouwelijke behandeling van de klacht.

      2 Indien een erkende rechtspersoon als bedoeld in [artikel 5.9][ref2], een melding ontvangt van een klacht, zorgt
      deze erkende rechtspersoon ervoor dat de klacht wordt ingediend bij de in het eerste lid bedoelde ambtenaar.

      3 Schriftelijk ingediende klachten worden gericht aan de Inspectie Leefomgeving en Transport, te bereiken via:a.
      het postadres: Postbus 16191, IPC 525, 2500 BD Den Haag, Nederland ofb. de website http://www.ILenT.nl.

      4 Een klacht is ontvankelijk indien:

      a. deze een vermoedelijke schending van het Maritiem Arbeidsverdrag, het Verdrag betreffende werk in de
      visserijsector of een vermeend onrechtmatig bevel van de kapitein betreft;

      b. het voorval waarop de klacht betrekking heeft minder dan zes maanden geleden heeft plaatsgevonden;

      c. de klacht in het Engels of het Nederlands is gesteld; en

      d. de klacht voldoende gedetailleerde informatie bevat om onderzoek naar de klacht te kunnen doen.

      5 Aan de klager wordt zo spoedig mogelijk na het indienen van de klacht medegedeeld of de klacht ontvankelijk is.

      6 Indien de klacht ontvankelijk is:

      a. wordt nagegaan of het een individuele klacht of een algemene klacht betreft en wordt nagegaan waarop de klacht
      betrekking heeft;

      b. wordt de klager gevraagd of hij zijn klacht wil handhaven indien zijn anonimiteit, gelet op de aard van de
      klacht, niet gewaarborgd kan worden;

      c. wordt nagegaan of de in [artikel 69a van de wet][ref3] bedoelde klachtenprocedure is doorlopen en, als dat niet
      het geval is, wordt de klacht niet verder behandeld, tenzij blijkt dat klager die klachtenprocedure niet heeft
      gebruikt uit angst voor de gevolgen daarvan of wegens een andere goede reden als bedoeld in leidraad B5.2.2, lid 4;

      d. wordt nagegaan waarom het doorlopen van de in [artikel 69a van de wet][ref4] bedoelde klachtenprocedure niet
      heeft geleid tot een oplossing van de klacht;

      e. worden, indien de aard van de klacht en noodzakelijke waarborgen voor de klager dit toelaten, de kapitein,
      de scheepsbeheerder en eventueel andere bij de klacht betrokken personen in de gelegenheid gesteld hun standpunt
      kenbaar te maken;

      f. wordt nagegaan of de klacht aan boord eenvoudig kan worden opgelost;

      g. wordt een klacht zo nodig onderzocht door het uitoefenen van toezicht als bedoeld in
      [hoofdstuk 5 van de wet][ref5] of in het kader van een inspectie als bedoeld in [artikel 5.3][ref6], waarbij niet
      wordt gemeld dat de inspectie het gevolg is van een klacht;

      h. worden de conclusie en eventuele maatregelen op basis van het onderzoek naar de klacht medegedeeld aan de klager
      of aan een door de klager opgegeven contactpersoon of belangenorganisatie, op een wijze die de gewenste anonimiteit
      van de klager in acht neemt.


