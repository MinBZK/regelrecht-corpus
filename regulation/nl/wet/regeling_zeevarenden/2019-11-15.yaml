  - number: '3.5'
    text: |-
      1 Met het oog op de functionaliteit, de stabiliteit of anderszins de veiligheid van schepen van minder dan 500
      GT, kunnen in afwijking van [artikel 3.3, eerste lid][ref1], als wezenlijk gelijkwaardige bepaling als bedoeld in
      artikel VI, lid 3, van het Maritiem Arbeidsverdrag, nachtverblijven onder de referentielastlijn worden geplaatst,
      mits tevens wordt voldaan aan het tweede lid.

      2 Nachtverblijven als bedoeld in het eerste lid voldoen aan de volgende eisen:

      a. de bovenzijde van de vloer ligt maximaal 2000 mm onder de referentielastlijn;

      b. voor de stahoogte wordt geen ontheffing verleend als bedoeld in [artikel 3.2, eerste lid][ref2];

      c. in het nachtverblijf wordt continue klimaatbeheersing toegepast die adequaat condensvorming en vochtgerelateerde
      geuren bestrijdt;

      d. vanuit het nachtverblijf zijn ten minste twee adequate vluchtwegen aanwezig;

      e. in het waterdichte compartiment van het nachtverblijf is een bilge-alarm aanwezig;

      f. de lichtsterkte van de verlichting is variabel instelbaar om het gebrek aan daglicht naar behoefte van de
      zeevarende te kunnen compenseren, en

      g. er worden materialen en kleuren voor wand- en vloerbedekking toegepast gericht op ruimtebeleving.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0032140#Artikel3.2
