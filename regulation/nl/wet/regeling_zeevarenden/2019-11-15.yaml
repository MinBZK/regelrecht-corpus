    text: |-
      Voor de afgifte van het certificaat scheepsmanagement-W heeft de aanvrager met goed gevolg een door Onze Minister
      erkende training afgerond die de in [bijlage F, onderdeel C][ref1], genoemde onderdelen van tabel A-III/2,
      behorende bij sectie A-III/2 van de STCW-Code beslaat.


      [ref1]: https://wetten.overheid.nl/BWBR0032140
