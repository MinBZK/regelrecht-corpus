  - number: '7.1'
    text: |-
      In deze paragraaf wordt verstaan onder ‘klager’: een zeevarende die overeenkomstig een
      klachtenprocedure als bedoeld in [artikel 69a, eerste lid, van de wet][ref1] of de regels bedoeld in
      [artikel 69b, tweede lid, van de wet][ref2], een klacht indient.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel69a
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel69b
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel7.1
