  - number: '3.21'
    text: |-
      1 De scheepsbeheerder zorgt ervoor dat voor de verzending van e-mail aan boord aanwezige internetfaciliteiten voor
      alle zeevarende toegankelijk zijn en dat postverzending geschiedt in overeenstemming met leidraad B3.1.11, lid 5,
      van het Maritiem Arbeidsverdrag.

      2 Voor het gebruik van telefoon-, e-mail- en internetverbindingen kan de scheepsbeheerder een vergoeding voor de
      gebruikskosten vragen. De overige in [artikel 3.13][ref1] bedoelde voorzieningen staan kosteloos ter beschikking
      van de zeevarenden.

      3 De scheepsbeheerder zorgt ervoor dat omgang met familie en vrienden van zeevarenden geschiedt in overeenstemming
      met de normering van leidraad B3.1.11, leden 6 en 7, van het Maritiem Arbeidsverdrag.

      4 De in [artikel 3.13][ref2] bedoelde voorzieningen worden overeenkomstig de in leidraad B3.1.11, lid 1, van
      het Maritiem Arbeidsverdrag genoemde doelstellingen ten minste eens per drie jaar door of namens de kapitein
      geïnspecteerd.

      5 Dit artikel is ook van toepassing op de in [artikel 1.3, onderdeel a en c][ref3], bedoelde schepen.


