  - number: '4.2'
    text: |-
      1 Voor de bevoorrading van een schip met drinkwater, wordt de benodigde hoeveelheid vastgesteld op basis van de in
      [artikel 4.1, eerste lid][ref1], genoemde criteria, alsmede op basis van de mogelijkheid van aanvulling gedurende
      de reis met behulp van een voorziening om drinkwater te maken.

      2 In geval van onvoorziene omstandigheden tijdens de reis, kan de kapitein de hoeveelheid drinkwater per zeevarende
      rantsoeneren.

      3 Het drinkwater wordt opgeslagen in de in [artikel 3.18, vierde lid][ref2], bedoelde of andere daarvoor geschikte
      tanks die schoon zijn en zo zijn afgesloten dat daarin geen vreemde bestanddelen kunnen komen.

      4 Het drinkwater wordt slechts in de drinkwatertank geleid:

      a. met een aanvoerslang die vrij van de kade wordt gehouden;

      b. nadat tenminste één minuut het water op volle aanvoerdruk uit de aanvoerslang heeft gestroomd;

      c. indien tijdens het laden per ton drinkwater wordt toegevoegd:

      1°. een gestabiliseerd hypochloriet in zodanige hoeveelheid, dat minstens 0,7 gram vrij chloor per ton vrijkomt, of

      2°. een hoeveel gestabiliseerd hypochloriet met een hoeveelheid ammoniumzout, zodat minstens 2,5 gram
      monochlooramine (NH2Cl) per ton ontstaat, of

      3°. een door de minister toegestane stof in een zodanige hoeveelheid dat minstens 0,7 gram vrij chloor per ton
      water vrijkomt; en

      d. indien de in onderdeel c genoemde stoffen behoorlijk door het drinkwater worden gemengd.

      5 Een drinkwatertank die voor inspectie, onderhoud, of anderszins is betreden, wordt gereinigd door de tank te
      vullen met drinkwater waarin 10 gram vrij chloor per ton drinkwater is gemengd. De drinkwatertank wordt slechts
      bevoorraad met drinkwater als dat water tenminste 2 uur lang in de tank is geweest en daarna is uitgepompt.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0032140#Artikel3.18
