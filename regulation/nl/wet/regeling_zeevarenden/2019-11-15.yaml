  - number: '10.5'
    text: |-
      1 Voor de vernieuwing van een vaarbevoegdheidsbewijs wordt:

      a. ervaring, opgedaan in de functie maritiem officier alle schepen, voor de helft daarvan gelijkgesteld aan
      ervaring, opgedaan in de functie wachtstuurman alle schepen en voor de helft daarvan gelijkgesteld aan ervaring,
      opgedaan in de functie wachtwerktuigkundige alle schepen;

      b. ervaring, opgedaan in de functie eerste maritiem officier schepen van minder dan 3000 GT en minder dan 3000 kW
      voortstuwingsvermogen, voor de helft daarvan gelijkgesteld aan ervaring, opgedaan in de functie eerste stuurman
      schepen van minder dan 3000 GT en voor de helft daarvan gelijkgesteld aan ervaring, opgedaan in de functie
      hoofdwerktuigkundige schepen met minder dan 3000 kW voortstuwingsvermogen;

      c. ervaring, opgedaan in de functie eerste maritiem officier alle schepen, voor de helft daarvan gelijkgesteld aan
      ervaring, opgedaan in de functie eerste stuurman alle schepen en voor de helft daarvan gelijkgesteld aan ervaring,
      opgedaan in de functie hoofdwerktuigkundige alle schepen;

      d. ervaring, opgedaan in de functie wachtstuurman alle schepen tezamen met ervaring, opgedaan in de functie
      wachtwerktuigkundige alle schepen, gelijkgesteld aan ervaring, opgedaan in de functie maritiem officier alle
      schepen;

      e. ervaring, opgedaan in de functie eerste stuurman schepen van minder dan 3000 GT tezamen met ervaring, opgedaan
      in de functie hoofdwerktuigkundige schepen met minder dan 3000 kW voortstuwingsvermogen, gelijkgesteld aan
      ervaring, opgedaan in de functie eerste maritiem officier schepen van minder dan 3000 GT en minder dan 3000 kW
      voortstuwingsvermogen;

      f. ervaring, opgedaan in de functie eerste stuurman alle schepen tezamen met ervaring, opgedaan in de functie
      hoofdwerktuigkundige alle schepen, gelijkgesteld aan ervaring, opgedaan in de functie eerste maritiem officier
      alle schepen;

      g. ervaring, opgedaan in de functie stuurman-werktuigkundige vissersvaartuigen, voor de helft daarvan gelijkgesteld
      aan ervaring, opgedaan in de functie stuurman vissersvaartuigen, en voor de helft daarvan gelijkgesteld aan
      ervaring in de functie werktuigkundige vissersvaartuigen;

      h. ervaring, opgedaan in de functie stuurman vissersvaartuigen tezamen met ervaring, opgedaan in de functie
      werktuigkundige vissersvaartuigen, gelijkgesteld aan ervaring, opgedaan in de functie stuurman-werktuigkundige
      vissersvaartuigen.

      2 Voor de berekening van de opgedane ervaring in 2 functies tezamen als bedoeld in het eerste lid, onderdelen d,
      e, f en h, wordt slechts de ervaring van beide functies in acht genomen voor zover deze zich in gelijke mate tot
      elkaar verhoudt en zij uit ten minste 1 maand ervaring per functie bestaat.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel10.5
  - number: '10.6'
    text: |-
      1 Voor de vernieuwing van een vaarbevoegdheidsbewijs wordt ervaring, opgedaan in een relevante functie in een
      van de bedrijfstakken handelsvaart, zeegaande zeilvaart, zeevisvaart of de Koninklijke Marine, gelijkgesteld
      aan ervaring, opgedaan in een van de andere genoemde bedrijfstakken, met dien verstande dat in de bedrijfstak
      waarvoor de vernieuwing van het vaarbevoegdheidsbewijs is aangevraagd, ten minste 3 maanden ervaring is opgedaan
      in een functie waarvoor een vaarbevoegdheidsbewijs is vereist. Deze eis geldt niet voor de vernieuwing van
      een vaarbevoegdheidsbewijs voor de functies als scheepswerktuigkundige op schepen in de handelsvaart en in de
      zeevisvaart en voor het behoud van een vaarbevoegdheid in een relevante functie in een andere bedrijfstak dan die
      waarin de zeevarende op het moment van de aanvraag tot vernieuwing werkzaam is.

      2 Voor de berekening van de ervaring, bedoeld in het eerste lid, wordt de ervaring, opgedaan in een van de functies
      als maritiem officier en in de functie stuurman-werktuigkundige vissersvaartuigen, herleid naar ervaring, opgedaan
      in de functies als stuurman of werktuigkundige, overeenkomstig het bepaalde in [artikel 10.5][ref1].

      3 Onze Minister besluit welke ervaring, opgedaan in een functie bij de Koninklijke Marine, voor de berekening van
      de ervaring, bedoeld in het eerste lid, in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel10.5
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0032140
        artikel: '10.5'
        paragraaf: '10'
  - number: '10.7'
    text: |-
      1 Vergelijkbare functies als bedoeld in [artikel 8, tweede lid, van het Besluit zeevarenden][ref1], zijn:

      a. voor de functies van kapitein en stuurman:

      1°. registerloods;

      2°. gecertificeerde noordzeeloods;

      3°. nautisch surveyor van zeeschepen van een erkende organisatie;

      4°. medewerker van nautische inspecties van scheepsbeheerders;

      5°. ambtenaar van de Inspectie Leefomgeving en Transport, voor zover daadwerkelijk betrokken bij het toezicht op
      zeeschepen; en

      6°. simulatorinstructeur op een door de Inspectie Leefomgeving en Transport erkende simulator voor
      stuurhuisactiviteiten van de hoogste categorie, zoals opgenomen in de Leidraad maritieme simulatoren;

      b. voor de functie van kapitein of stuurman op zeegaande zeilschepen:

      officier van de zeedienst der Koninklijke Marine, voor zover daadwerkelijk ervaring als navigatieofficier is
      opgedaan;

      c. voor de functie van scheepswerktuigkundige:

      1°. technisch surveyor van zeeschepen van een erkende organisatie;

      2°. medewerker van technische inspecties van scheepsbeheerders;

      3°. ambtenaar van de Inspectie Leefomgeving en Transport, voor zover daadwerkelijk betrokken bij het toezicht op
      zeeschepen;

      4°. werktuigkundige, werkzaam in de binnenvaart;

      5°. werktuigkundige, werkzaam op elektriciteitscentrales, gemalen en de procesindustrie;

      6°. werktuigkundige, werkzaam op zeeschepen zonder eigen voortstuwing;

      7°. werktuigkundige, werkzaam op installaties in de offshore-industrie;

      8°. inbedrijfsteller scheepsinstallaties; en

      9°. simulatorinstructeur op een door de Inspectie Leefomgeving en Transport erkende simulator voor
      machinekameractiviteiten van de hoogste categorie, zoals opgenomen in de Leidraad maritieme simulatoren;

      d. voor de functie van radio-operator:

      1°. radio-operator werkzaam in de operationele dienst van de kustwacht;

      2°. bedrijfspersoneel betrokken bij de bediening, installatie of reparatie van radiocommunicatie- en
      radionavigatieapparatuur;

      3°. toezichthoudend ambtenaar van het Agentschap Telecom; en

      4°. leraar radiokunde verbonden aan een door het Agentschap Telecom erkende opleiding voor het algemeen certificaat
      maritieme radiocommunicatie of voor het beperkt certificaat maritieme radiocommunicatie.

      2 Onze Minister kan andere functies dan de functies, genoemd in het eerste lid, als vergelijkbare functie
      aanmerken.

      3 Een vaarbevoegdheidsbewijs of een aanvulling daarop kan worden vernieuwd indien de houder daarvan in de periode
      van 5 jaar voorafgaand aan de datum van de aanvraag tot vernieuwing ten minste 24 maanden een functie als bedoeld
      in het eerste of tweede lid heeft vervuld.

      4 De bevoegdheden waarvoor het vernieuwde vaarbevoegdheidsbewijs geldig is, zijn niet ruimer dan die, welke bij
      aanvang van de vergelijkbare functie bestonden.


