  - number: '8.42'
    text: |-
      Voor de afgifte van het certificaat scheepsmanagement-N heeft de aanvrager met goed gevolg een door Onze Minister
      erkende training afgerond die de in [bijlage F, onderdeel B][ref1], genoemde onderdelen van tabel A-II/2, behorende
      bij sectie A-II/2 van de STCW-Code beslaat.


      [ref1]: https://wetten.overheid.nl/BWBR0032140
