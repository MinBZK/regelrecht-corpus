  - number: '2.2'
    text: |-
      1 Naast de kapitein zijn de volgende personen of instellingen bevoegd tot het maken van de hierna omschreven
      aantekeningen in het monsterboekje van een zeevarende:

      a. tot het maken van aantekeningen betreffende het door deze zeevarende met goed gevolg hebben afgesloten van een
      training als bedoeld in de [artikelen 35 tot en met 42 van het Besluit zeevarenden][ref1]: het bevoegd gezag van
      een door de Minister erkende opleiding als bedoeld in [artikel 19a, derde lid, van de Wet zeevarenden][ref2];

      b. tot het maken van aantekeningen van een gunstige uitslag van een onderzoek op tuberculose: een bevoegd
      geneeskundige als bedoeld in [artikel 40 van de Wet zeevarenden][ref3].

      2 Voor de afgifte van een monsterboekje komen, naast de personen, bedoeld in
      [artikel 97, tweede lid, onderdelen a en b, van het Besluit zeevarenden][ref4], tevens in aanmerking personen
      behorende tot de onderstaande beroepsgroepen, indien zij kunnen aantonen het monsterboekje nodig te hebben ten
      behoeve van de uitoefening van hun beroep aan boord van een schip tijdens zeereizen:

      a. nautisch/technisch surveyors van erkende organisaties;

      b. registerloodsen;

      c. noordzeeloodsen (certificaatloodsen);

      d. maritiem wetenschappelijk onderzoekers;

      e. personeel met dienstverlenende taken aan boord van schepen;

      f. nautisch/technisch onderhoudspersoneel;

      g. nautisch/technisch ondersteunend personeel;

      h. medewerkers van nautische/technische inspecties van scheepsbeheerders;

      i. andere zeevarenden dan bedoeld in [artikel 97, tweede lid, onderdeel a, van het Besluit zeevarenden][ref5], die
      in het bezit zijn van een geldig Nederlands vaarbevoegdheidsbewijs;

      j. detacheringsmedewerkers, te werk gesteld via een uitzendbureau of een detacheringsbureau, voor het verrichten
      van werkzaamheden aan boord van zeeschepen; en

      k. ambtenaren belast met toezichthoudende of handhavende taken aan boord van zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel35
