                    bar


                    leidraad B.3.1.11, lid 4, onderdeel i






      3 Op schepen van 500 GT of meer is voor de voorzieningen, bedoeld in het eerste lid, ten minste één afzonderlijk
      verblijf beschikbaar.

      4 Op schepen kleiner dan 500 GT kunnen in plaats van een afzonderlijk recreatieverblijf de dagverblijven zodanig
      worden ingericht en uitgerust, dat zij als ontspanningsruimte dienst kunnen doen.

      5 Op schepen van 8000 GT of meer zijn voor de voorzieningen, bedoeld in het eerste en tweede lid, naast een
      afzonderlijke ruimte voor het zwembad en een rookvoorziening, ten minste twee verblijven aanwezig waarin voldoende
      ruimte is voor het tegelijkertijd uitoefenen van verschillende recreatieve bezigheden.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel3.13
  - number: '3.14'
    text: |-
      De minister kan, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, ontheffing verlenen
      van het bepaalde in [artikel 3.13, tweede lid][ref1], ten aanzien van de aanwezigheid van een zwembad indien dit
      gelet op de inrichting van het schip niet goed te realiseren is.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0032140
        artikel: '3.13'
        paragraaf: '3'
  - number: '3.15'
    text: |-
      1 Aan boord zijn de volgende voorzieningen aanwezig, die voldoen aan de volgende onderdelen van normen en de
      normering van de onderdelen van leidraden van het Maritiem Arbeidsverdrag:








                    wasvoorzieningen


                    norm A3.1, lid 13 en leidraad B3.1.7, lid 4




                    ruimte op het open dek


                    norm A3.1, lid 14




                    kantoren


                    norm A3.1, lid 15, eerste volzin






      2 Op schepen van 1600 GT of meer is een kleedruimte voor machinekamerpersoneel aanwezig, die voldoet aan de
      normering van leidraad B3.1.9 van het Maritiem Arbeidsverdrag, tenzij al het machinekamerpersoneel de beschikking
      heeft over een nachtverblijf voor niet meer dan twee personen met een bijbehorende sanitaire ruimte waar een bad of
      douche aanwezig is. De kleedruimte voor machinekamerpersoneel is vanuit de machinekamer binnendoor te bereiken.

      3 Aan boord zijn voorzieningen aanwezig tegen het binnendringen van muggen in de verblijven en ruimten die toegang
      geven tot het open dek, indien het desbetreffende schip regelmatig havens aandoet waar doorgaans muggen aanwezig
      zijn.

      4 De in leidraad B3.1.10 van het Maritiem Arbeidsverdrag genoemde benodigdheden zijn in voldoende hoeveelheden voor
      de zeevarenden aan boord beschikbaar.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel3.15
  - number: '3.16'
    text: |-
      1 Voor schepen van minder dan 3000 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, ontheffing verlenen van het bepaalde in norm A3.1, lid 15, van het Maritiem
      Arbeidsverdrag ten aanzien van kantoren.

      2 Voor schepen van minder dan 200 GT kan de minister, na overleg met de betrokken organisaties van
      scheepsbeheerders en zeevarenden, en met inachtneming van de grootte van het schip en het aantal opvarenden
      aan boord, ontheffing verlenen van norm A.3.1, lid 13, van het Maritiem Arbeidsverdrag ten aanzien van
      wasvoorzieningen, indien de zeevarenden van het desbetreffende schip aan de wal voldoende toegang hebben tot
      wasvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel3.16
  - number: '3.17'
    text: |-
      Voor schepen waarop zeevarenden werkzaam zijn met uiteenlopende gewoonten van godsdienstige of sociale aard, kan de
      minister, na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden en onder daarbij te stellen
      voorschriften, ontheffing verlenen van het bepaalde in norm A3.1 van het Maritiem Arbeidsverdrag, mits dit niet
      leidt tot situaties die voor een of meer zeevarenden aan boord van het desbetreffende schip minder gunstig zijn dan
      zonder het verlenen van die ontheffing het geval zou zijn.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel3.17
  - number: '3.18'
    text: |-
      1 Schepen zijn uitgerust met voldoende kooktoestellen en keukengerei voor het bereiden van maaltijden van voldoende
      hoeveelheid, kwaliteit en voedingswaarde, voor de zeevarenden aan boord.

      2 Op schepen met een lengte van 35 meter of meer is voor het bereiden van voedsel en warme dranken een afzonderlijk
      verblijf ingericht als kombuis, die voldoende uitgerust is om goede, gevarieerde en voedzame maaltijden efficiënt,
      in voldoende aantallen en rekening houdend met verschillende godsdienstige en culturele gebruiken van zeevarenden,
      te kunnen bereiden. De kombuis is aangesloten op een systeem van koud en warm drinkwater.

      3 Voor de opslag van levensmiddelen zijn van andere ruimten afgesloten bergplaatsen aanwezig, die zodanig zijn
      geventileerd of gekoeld, dat de voeding in goede toestand blijft.

      4 Schepen zijn uitgerust met drinkwatertanks die door cofferdams zijn gescheiden van olietanks en verzameltanks
      voor vuil water, en zodanig zijn geconstrueerd dat bij het leegpompen geen restanten achterblijven en de hygiëne
      van het drinkwater wordt gewaarborgd. Pijpleidingen, van welke aard ook, mogen niet door drinkwatertanks lopen.

      5 Dit artikel is ook van toepassing op de in [artikel 1.3, onderdeel a en c][ref1], bedoelde schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel1.3
