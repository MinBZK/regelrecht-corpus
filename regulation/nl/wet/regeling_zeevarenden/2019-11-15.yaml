      1 [Paragraaf 3][ref1] van deze regeling is niet van toepassing op de volgende schepen:

      a. schepen waarvan de kiel is gelegd of de bouw in een overeenkomstige
      fase van ontwikkeling was voor de datum van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      _________________________________, 2006 (Trb. 2007, 93) en

      b. vissersvaartuigen en

      c. schepen die ontworpen zijn om traditionele vaardigheden en zeemanschap aan te moedigen en te bevorderen en die
      als levende cultuurmonumenten volgens de traditionele beginselen van zeemanschap en techniek worden bestuurd,

      tenzij in een voorschrift van [paragraaf 3][ref3] uitdrukkelijk is bepaald dat dat voorschrift wel van toepassing
      is op de in onderdeel a of c bedoelde schepen.

      2 De [artikelen 3.3 tot en met 3.7][ref4] zijn niet van toepassing op schepen van minder dan 500 GT waarop de
      zeevarenden ten hoogste 13 uur per etmaal en ten hoogste 84 uur in elke periode van 7 dagen aan boord verblijven,
      indien:

      a. per zeevarende een zitplaats in een dagverblijf beschikbaar is;

      b. per 6 zeevarenden of minder een toiletruimte, een wastafel en een bad of douche beschikbaar is.

      3 De [paragrafen 3][ref5] en [4][ref6] zijn niet van toepassing op vissersvaartuigen.

      4 [Paragraaf 4a][ref7] is uitsluitend van toepassing op van een dek voorziene vissersvaartuigen:

      a. waarvoor het bouwcontract of het contract voor ingrijpende verbouwing op of na 15 november 2019 is gegund;

      b. waarvoor het bouwcontract of het contract voor ingrijpende verbouwing voor 15 november 2019 is gegund en dat
      drie of meer jaren na die datum wordt opgeleverd; of

      c. waarvan, bij gebrek aan een bouwcontract, op of na 15 november 2019:

      1. de kiel is gelegd;

      2. de bouw als een herkenbaar specifiek type vaartuig begint; of

      3. de assemblage is begonnen, die ten minste 50.000 kilogram of 1 procent van de geschatte massa van alle
      constructiemateriaal omvat, waarbij de kleinste van de twee hoeveelheden bepalend is.


