articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *commercieel jacht:* een schip van minder dan 3000 GT met een loodlijnlengte van 24 meter of meer, dat is
      ontworpen en gebouwd en uitsluitend wordt gebruikt voor het bedrijfsmatig vervoer van niet meer dan 12 passagiers
      en waarop de LY2-code dan wel de LY3-Code als bedoeld in [artikel 1 van de Regeling veiligheid zeeschepen][ref1]
      kan worden toegepast;
        - *officier:* ** een scheepsofficier als bedoeld in de [wet][ref2] en iedere andere zeevarende die door de
      scheepsbeheerder als officier wordt aangemerkt;
        - *onderofficier:* een zeevarende die aan boord een toezichthoudende functie heeft of een andere functie met
      bijzondere verantwoordelijkheid en die door de scheepsbeheerder als zodanig wordt aangemerkt;
        - *minister:* de Minister van Infrastructuur en Milieu;
        - *passagiersschip:* een schip bestemd of gebezigd voor het bedrijfsmatig vervoer van meer dan twaalf passagiers;
        - *schepen voor bijzondere doeleinden:* schepen die op grond van
      [artikel 6 van de Regeling veiligheid zeeschepen][ref3] een certificaat hebben op basis van de SPS-code of de SPS-
      code 2008 als bedoeld in [artikel 1 van de Regeling veiligheid zeeschepen][ref4];
        - *garnalenkotter:* vissersvaartuig gebruikt voor de vangst van garnalen, met een lengte van minder dan 24
      meter en een voortstuwingsvermogen van minder dan 750 kW, waarvoor een bemanningscertificaat voor reizen die
      zich niet verder uitstrekken dan beperkt vaargebied en waarvoor een vergunning op grond van artikel 36 van de
      Uitvoeringsregeling visserij voor het vangen van garnalen is afgegeven;
        - *referentielastlijn:* voor schepen waarop het Uitwateringsverdrag als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van het Schepenbesluit 2004][ref5] van toepassing is, de lijn voor
      zomeruitwatering als bedoeld in Bijlage 1, voorschrift 6, lid 2, onderdeel a, van het Uitwateringsverdrag en
      voor schepen waarop het Uitwateringsverdrag niet van toepassing is, de lijn parallel aan de ontwerplastlijn
      gelegen op een afstand van 20% van de holte naar de mal als bedoeld in Bijlage 1, voorschrift 3, lid 5, van het
      Uitwateringsverdrag, maar maximaal 1000 mm onder het vrijboorddek als bedoeld in Bijlage 1, voorschrift 3, lid 9,
      van het Uitwateringsverdrag;
        - *Uitwateringsverdrag:* het op 5 april 1966 te Londen tot stand gekomen Verdrag betreffende de uitwatering van
      schepen (Trb. 1966, 275) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
        - *verblijven:* dag- en nachtverblijven en alle ruimten voor sanitaire doeleinden, voedselvoorziening,
      ziekenverpleging en recreatie aan boord van een schip, bestemd voor gebruik door zeevarenden;
        - *wet:* [Wet zeevarenden][ref6].


