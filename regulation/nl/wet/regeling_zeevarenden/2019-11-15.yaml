  - number: 1.3b
    text: |-
      Aan de scheepsbeheerder van een garnalenkotter wordt vrijstelling verleend van de verplichting de garnalenkotter
      te bemannen overeenkomstig de in [artikel 2a van het besluit][ref1] voorgeschreven bemanningssamenstelling voor
      telkens een periode, gerekend vanaf het tijdstip van uitvaren van de garnalenkotter, van ten hoogste 48 uur indien:

      a. de bemanning ten minste bestaat uit een schipper en een plaatsvervangend schipper;

      b. de bemanningsleden bij aanwezigheid op het dek een opblaasbare reddinggordel dragen die voldoet aan het bepaalde
      in [artikel 212 van het Vissersvaartuigenbesluit][ref2] of die is voorzien van een stuurwielmarkering als bedoeld
      in [artikel 1 van de Wet scheepsuitrusting 2016][ref3] en die is voorzien van een persoonlijk noodradiobaken.

      c. de garnalenkotter is voorzien van:

      i. een koppeling van het wachtalarm met de automatische stuurinrichting;

      ii. een geautomatiseerde spoel- en sorteermachine voor de scheiding van garnalen en vis;

      iii. een geautomatiseerde kookinrichting waarbij geen handmatige handelingen hoeven te worden verricht; en

      iv. een veilige verschansing of zeereling als bedoeld in [artikel 190 van het Vissersvaartuigenbesluit][ref4];

      d. de tijdspanne tussen binnenkomst en weer uitvaren van de garnalenkotter ten minste 10 uren bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004607#Artikel2a
