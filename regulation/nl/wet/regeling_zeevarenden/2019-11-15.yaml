  - number: '11.1'
    text: |-
      Onze Minister verleent een voor 1 januari 2014 aangevraagd:

      a. certificaat uitvoering beveiligingstaken aan een aanvrager die voldoet aan sectie A-VI/6, onderdeel 9, van de
      STCW-Code;

      b. certificaat bewustwording scheepsbeveiliging aan een aanvrager die voldoet aan sectie A-VI/6, onderdeel 5, van
      de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0032140/2019-11-15#Artikel11.1
  - number: '11.2'
    text: |-
      1 Certificaten uitvoering beveiligingstaken, afgegeven op grond van sectie A-VI/6, onderdeel 9, van de STCW-Code,
      worden gelijkgesteld met certificaten uitvoering beveiligingstaken, afgegeven op grond van [artikel 8.39][ref1].

      2 Certificaten bewustwording scheepsbeveiliging, afgegeven op grond van sectie A-VI/6, onderdeel 5, van
      de STCW-Code, worden gelijkgesteld met certificaten uitvoering beveiligingstaken, afgegeven op grond van
      [artikel 8.40][ref2].


