  - number: '5.7'
    text: |-
      Onverminderd het bepaalde in [artikel 48e van de wet][ref1], vervalt een voor dat schip afgegeven certificaat
      maritieme arbeid indien:

      a. het schip wordt onttrokken aan zijn oorspronkelijke bestemming waardoor het niet meer als schip wordt gebruikt;

      b. het schip zonder dat een verbouwing of wijziging van de inrichting plaatsvindt als bedoeld in
      [artikel 48e, eerste lid, onderdeel a van de wet][ref2], van bestemming wijzigt.


