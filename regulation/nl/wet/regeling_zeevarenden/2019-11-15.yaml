      1 Voor de aanvang van de bouw van een schip of een verbouwing of andere wijziging die van invloed is op de eisen
      aan de huisvesting en voorzieningen aan boord, wordt aan de minister een plan overgelegd. Dit plan bevat de
      volgende elementen:

      a. de plaats en de algemene indeling van de verblijven;

      b. hoe wordt voldaan aan de in de [artikelen 3.1][ref1], [3.3][ref2], [3.8][ref3], [3.10][ref4], [3.12][ref5],
      [3.13][ref6], [3.15][ref7], [3.18][ref8], en [3.19][ref9] bedoelde en op het desbetreffende schip van toepassing
      zijnde eisen;

      c. eventuele aanvragen voor ontheffingen op grond van de [artikelen 3.2][ref10],
      [3.7, eerste en derde tot en met zevende lid][ref11], [3.9, tweede en derde lid][ref12], [3.11, eerste lid][ref13],
      [3.14][ref14], [3.16][ref15] en [3.17][ref16];

      d. de eventuele toepassing van de in de [artikelen 3.4][ref17], [3.5][ref18], en [3.6][ref19], bedoelde wezenlijk
      gelijkwaardige bepalingen;

      e. de eventuele toepassing van de in de [artikelen 3.7, tweede lid][ref20], [3.9, eerste lid][ref21], en
      [3.11, tweede lid][ref22], bedoelde afwijkende voorschriften; en

      f. eventuele verzoeken tot de toepassing van [artikel 3.22][ref23], waarbij wordt aangegeven van welke van de in
      dat artikel  genoemde bepalingen afwijking wordt gevraagd; en

      g. de resultaten van het overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden, voor zover dit
      overleg is voorgeschreven in de in dit lid genoemdebepalingen.

      2 Met de bouw, verbouwing of andere wijziging als bedoeld in het eerste lid wordt niet gestart totdat het in
      het eerste lid bedoelde plan is goedgekeurd en eventuele ontheffingen en toestemmingen zijn verleend. De bouw,
      verbouwing of wijziging wordt uitgevoerd overeenkomstig het goedgekeurde plan.


