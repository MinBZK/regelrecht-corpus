        artikel: 69b
  - number: '7.2'
    text: |-
      1 In een procedure als bedoeld in [artikel 69a van de wet][ref1] wordt tenminste opgenomen:

      a. bij welke persoon of personen aan boord een klacht kan worden ingediend, waarbij klachten in ieder geval bij de
      kapitein kunnen worden ingediend;

      b. bij welke vertegenwoordiger van de scheepsbeheerder die niet tot de zeevarenden aan boord behoort, een klacht
      kan worden ingediend;

      c. de contactgegevens voor het indienen van een klacht als bedoeld in [artikel 7.3][ref2];

      d. de naam van één of meer vertrouwenspersonen aan boord die zeevarenden onpartijdig kunnen adviseren over het
      indienen van een klacht en klagers kunnen bijstaan bij het doorlopen van de klachtenprocedure en kan helpen bij het
      voorkomen van nadelige behandeling vanwege het feit dat hij een klacht heeft ingediend; en

      e. volgens welke procedure een klacht wordt behandeld waarbij leidraad B5.1.5, tweede lid, van het Maritiem
      Arbeidsverdrag in acht wordt genomen.

      2 De klachtenprocedure bedoeld in het eerste lid, stelt geen beperkingen aan het recht van de klager:

      a. zich door iemand te laten vergezellen of vertegenwoordigen;

      b. om te allen tijde zijn klacht rechtstreeks bij de kapitein of de vertegenwoordiger van de scheepsbeheerder,
      bedoeld in het eerste lid, onderdeel b, in te dienen;

      c. om klachten in te dienen betreffende een vermoedelijke schending van het Maritiem Arbeidsverdrag of het Verdrag
      betreffende werk in de visserijsector.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel69a
