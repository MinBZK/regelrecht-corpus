      1 Op een schip met vijftien of meer zeevarenden aan boord dat reizen van meer dan drie etmalen maakt tussen twee
      havens waar een ziekenhuis aanwezig is is een afzonderlijk ziekenverblijf aanwezig dat voldoet aan norm A3.1, lid
      12, van het Maritiem Arbeidsverdrag.

      2 Ziekenverblijven voldoen aan de normering die is opgenomen in leidraad B3.1.8, leden 1, 2 en 4, van het Maritiem
      Arbeidsverdrag ten aanzien van ontwerp en inrichting, met dien verstande dat sanitaire voorzieningen die deel
      uitmaken van het ziekenverblijf uitsluitend vanuit dat verblijf toegankelijk zijn met een deur kunnen worden
      afgesloten.

      3 Het aantal bedden in een ziekenverblijf bedraagt:

      a. op schepen waar het aantal zeevarenden dat verblijft in nachtverblijven voor meer dan een persoon, minder is dan
      30, één bed;

      b. op schepen waar het aantal zeevarenden dat verblijft in nachtverblijven voor meer dan een persoon, 30 of meer
      is, twee bedden die niet boven elkaar gelegen zijn.

      4 Op passagiersschepen is bij voorkeur een apart ziekenverblijf voor passagiers aanwezig. Indien er geen apart
      ziekenverblijf voor passagiers is, worden de passagiers voor de toepassing van het derde lid meegeteld als
      zeevarenden.

      5 Op een schip dat op een internationaal traject van meer dan drie etmalen vaart, met een bemanning en overig
      personeel van honderd personen of meer die, in welke hoedanigheid ook, aan boord ten behoeve van het schip in
      dienst of tewerkgesteld zijn, inclusief stagiairs en leerlingen alsmede personen die werkzaam zijn als loods,, is
      een verblijf ingericht als apotheek en verbandkamer dat grenst aan het ziekenverblijf en dat kan worden afgesloten.

      6 Op schepen waar gelet op het eerste lid geen ziekenverblijf aanwezig is, is een eenpersoons nachtverblijf
      beschikbaar dat als ziekenkooi kan worden ingericht. Op schepen met minder dan zes zeevarenden, kan worden volstaan
      met een als ziekenkooi ingerichte slaapplaats in een nachtverblijf. Dit nachtverblijf is gemakkelijk toegankelijk.
