  - number: '5.5'
    text: |-
      1 Een voorlopig certificaat maritieme arbeid kan worden afgegeven met betrekking tot:

      a. nieuwe schepen bij de oplevering;

      b. schepen die onder de vlag van het koninkrijk gaan varen;

      c. schepen die in het beheer komen van een andere scheepsbeheerder .

      2 Een voorlopig certificaat maritieme arbeid kan eenmalig worden afgegeven voor een tijdvak van ten hoogste 26
      weken.

      3 In afwijking van [artikel 5.2, eerste lid, onderdelen a en b][ref1], worden de bedoelde maatregelen en procedures
      in de verklaring naleving maritieme arbeid deel II zoveel als mogelijk vermeld. De scheepsbeheerder toont aan dat
      de kapitein op de hoogte is van de eisen van het Maritiem Arbeidsverdrag en zijn verantwoordelijkheden voor de
      uitvoering en de naleving van de voor het desbetreffende schip geldende regels en procedures voor de naleving van
      het Maritiem Arbeidsverdrag.

      4 Het schip wordt met het oog op een voorlopig certificaat als bedoeld in het eerste lid, op onderdelen onderworpen
      aan een onderzoek als bedoeld in [artikel 5.3, tweede lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032140#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0032140#Artikel5.3
