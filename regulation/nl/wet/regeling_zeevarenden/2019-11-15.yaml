  - number: '1.2'
    text: |-
      De volgende categorieën van personen aan boord van een schip, worden voor de toepassing van het bepaalde bij of
      krachtens de [wet][ref1] niet aangemerkt als zeevarenden:

      a. passagiers;

      b. meevarende relaties en familie van zeevarenden, die geen werkzaamheden verrichten die onderdeel uitmaken van de
      normale werkzaamheden aan boord;

      c. militairen, inspecteurs en loodsen als bedoeld in [artikel 1, onderdeel b van de Loodsenwet][ref2];

      d. personen die uitsluitend in een haven of een havenfaciliteit als bedoeld in
      [artikel 1, onderdeel f onderscheidenlijk c, van de Havenbeveiligingswet][ref3] aan boord van een schip zijn;

      e. andere personen wier werkzaamheden geen onderdeel uitmaken van de normale werkzaamheden aan boord in het kader
      van het gebruik van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0009124
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0016991#Artikel1
