preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering van de Wet structuur
    uitvoeringsorganisatie werk en inkomen en enkele daarmee samenhangende onderwerpen te regelen, zulks onder
    intrekking van de Organisatiewet sociale verzekeringen 1997, de Arbeidsvoorzieningswet 1996 en de wetten ter
    invoering van die wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Raad voor werk en inkomen: de Raad voor werk en inkomen, genoemd in
      [hoofdstuk 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. Centrum voor werk en inkomen: een Centrum voor werk en inkomen als bedoeld in
      [artikel 24 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      e. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      f. Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];

      g. Raad van bestuur: een Raad van bestuur als bedoeld in
      [artikel 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6];

      h. Raad van advies: een Raad van advies als bedoeld in
      [artikel 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7];

      i. het College van toezicht sociale verzekeringen: het College van toezicht sociale verzekeringen, genoemd in
      hoofdstuk 2 van de Organisatiewet sociale verzekeringen 1997 zoals deze luidde op de datum vóór het tijdstip van
      inwerkingtreding van deze wet;

      j. Landelijk instituut sociale verzekeringen: het Landelijk instituut sociale verzekeringen, genoemd in
      hoofdstuk 4 van de Organisatiewet sociale verzekeringen 1997 zoals deze luidde op de datum vóór het tijdstip van
      inwerkingtreding van deze wet;

      k. uitvoeringsinstelling: een uitvoeringsinstelling als bedoeld in artikel 41 van de Organisatiewet sociale
      verzekeringen 1997 zoals deze luidde op de datum vóór het tijdstip van inwerkingtreding van deze wet;

      l. Arbeidsvoorzieningsorganisatie: de Arbeidsvoorzieningsorganisatie en de daartoe behorende organen, genoemd
      in [hoofdstuk 2 van de Arbeidsvoorzieningswet 1996][ref8] zoals deze luidde op de datum vóór het tijdstip van
      inwerkingtreding van deze wet.


