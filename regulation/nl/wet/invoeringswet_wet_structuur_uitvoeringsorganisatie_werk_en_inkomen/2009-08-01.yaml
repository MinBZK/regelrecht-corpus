        artikel: '7'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Ter zake van de in de [artikelen 4][ref1], [5][ref2], [6][ref3] en [7][ref4] bedoelde overgang van
      vermogensbestanddelen blijft heffing van overdrachtsbelasting achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013061#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0013061#Artikel7
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013061
        artikel: '6'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0013061
        artikel: '7'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      De publiekrechtelijke rechten en verplichtingen van het Landelijk instituut sociale verzekeringen en de
      uitvoeringsinstellingen gaan over op het Uitvoeringsinstituut werknemersverzekeringen voorzover in deze wet of de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '9.2'
    text: |-
      Een besluit dat door het Landelijk instituut sociale verzekeringen of namens dit instituut door een
      uitvoeringsinstelling is genomen, geldt als een besluit van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel9
  - number: '9.3'
    text: |-
      Een tot het Landelijk instituut sociale verzekeringen of een uitvoeringsinstelling gericht verzoek om een besluit
      te nemen, wordt beschouwd als te zijn gericht tot het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel9
  - number: '10.1'
    text: |-
      De publiekrechtelijke rechten en verplichtingen van het College van toezicht sociale verzekeringen gaan over op
      Onze Minister voorzover in deze wet of de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] niet anders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '10.2'
    text: Een besluit van het College van toezicht sociale verzekeringen geldt als een besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel10
  - number: '10.3'
    text: |-
      Een tot het College van toezicht sociale verzekeringen gericht verzoek om een besluit te nemen, wordt beschouwd als
      te zijn gericht tot Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel10
  - number: '11.1'
    text: |-
      In civielrechtelijke en bestuursrechtelijke gedingen waarin het Landelijk instituut sociale verzekeringen partij is
      treedt het Uitvoeringsinstituut werknemersverzekeringen in zijn plaats, zonder dat daarvoor een betekening nodig is
      en met overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel11
  - number: '11.2'
    text: |-
      Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het Uitvoeringsinstituut
      werknemersverzekeringen open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel11
  - number: '12.1'
    text: |-
      In civielrechtelijke en bestuursrechtelijke gedingen waarin een uitvoeringsinstelling partij is treedt het
      Uitvoeringsinstituut werknemersverzekeringen in haar plaats, zonder dat daarvoor een betekening nodig is en met
      overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel12
  - number: '12.2'
    text: |-
      Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het Uitvoeringsinstituut
      werknemersverzekeringen open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel12
  - number: '13'
    text: |-
      In civielrechtelijke gedingen waarin het College van toezicht sociale verzekeringen partij is treedt de Staat
      (Ministerie van Sociale Zaken en Werkgelegenheid) in zijn plaats, zonder dat daarvoor een betekening nodig is en
      met overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel13
  - number: '14.1'
    text: |-
      In bestuursrechtelijke gedingen waarin het College van toezicht sociale verzekeringen partij is treedt Onze
      Minister in zijn plaats, zonder dat daarvoor een betekening nodig is en met overneming van aanwijzing van een
      gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel14
  - number: '14.2'
    text: |-
      Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor Onze Minister open
      gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel14
  - number: '15'
    text: |-
      Indien de toepassing van dit hoofdstuk tot gevolg heeft dat in een geding eiser en gedaagde samenvallen, wordt dat
      geding tussen die partijen van rechtswege beëindigd.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel15
  - number: '16'
    text: |-
      Indien de toepassing van dit hoofdstuk tot gevolg heeft dat in een bezwaarschriftenprocedure de indiener
      van het bezwaarschrift en het bestuursorgaan dat het bestreden besluit heeft genomen samenvallen, wordt die
      bezwaarschriftenprocedure tussen hen van rechtswege beëindigd.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel16
  - number: '17.1'
    text: |-
      Bij het Landelijk instituut sociale verzekeringen aanhangige bezwaarschriften gaan, in de stand waarin zij zich
      bevinden, over naar het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel17
  - number: '17.2'
    text: |-
      Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het
      Uitvoeringsinstituut werknemersverzekeringen open gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel17
  - number: '18.1'
    text: |-
      Bij het College van toezicht sociale verzekeringen aanhangige bezwaarschriften gaan, in de stand waarin zij zich
      bevinden, over naar Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel18
  - number: '18.2'
    text: |-
      Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor Onze Minister open
      gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel18
  - number: '19.1'
    text: |-
      Aan de leden van het College van toezicht sociale verzekeringen die op de dag voorafgaand aan de datum van
      inwerkingtreding van deze wet die functies bekleden wordt met ingang van die datum ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel19
  - number: '19.2'
    text: |-
      Aan de voorzitter, de leden en de plaatsvervangende leden van het Landelijk instituut sociale verzekeringen die op
      de dag voorafgaand aan de datum van inwerkingtreding van deze wet die functies bekleden wordt met ingang van die
      datum ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel19
  - number: '19.3'
    text: |-
      Aan de voorzitter, de leden en de plaatsvervangende leden van de Sociale verzekeringsbank die op 31 december 2002
      die functies bekleden wordt met ingang van 1 januari 2003 ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel19
  - number: '20'
    text: |-
      De door Onze Minister op grond van de artikelen 7, 22 en 35 van de Organisatiewet sociale verzekeringen 1997
      gestelde regels blijven na de inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      van kracht voor zolang daaraan door de in [artikel 19][ref2] bedoelde functionarissen aanspraken kunnen worden
      ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel19
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '19'
        hoofdstuk: '2'
  - number: '21'
    text: |-
      De rechten en verplichtingen van het Landelijk instituut sociale verzekeringen en de uitvoeringsinstellingen die
      voortvloeien uit de arbeidsovereenkomsten met hun werknemers, daaronder begrepen die welke voortvloeien uit een
      toezegging omtrent pensioen als bedoeld in [artikel 1 van de Pensioen- en spaarfondsenwet][ref1], gaan over op het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
  - number: '22.1'
    text: |-
      De werknemers die op de dag voorafgaand aan de datum van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] in dienst zijn van het College
      van toezicht sociale verzekeringen, worden met ingang van de dag van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] als ambtenaar in dienst van het Rijk aangesteld.
      Daarbij worden hun arbeidsvoorwaarden zo veel mogelijk op een gelijk niveau gesteld met de arbeidsvoorwaarden die
      verbonden waren aan hun dienstbetrekking bij het College van toezicht sociale verzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
  - number: '22.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel22
  - number: '23.1'
    text: Commissies als bedoeld in de artikelen 9 en 37 van de Organisatiewet sociale verzekeringen 1997 worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel23
  - number: '23.2'
    text: |-
      Commissies als bedoeld in artikel 24 van de Organisatiewet sociale verzekeringen 1997 worden opgeheven per 1
      januari 2003.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel23
  - number: '24.1'
    text: |-
      Ministeriële regelingen op grond van de artikelen 28, zesde lid, 67, zesde en zevende lid, 68, tweede lid, 70,
      tweede lid, 71, 71a, derde lid , en 94, eerste lid, van de Organisatiewet sociale verzekeringen 1997 berusten met
      ingang van de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] op de
      [artikelen 35, vijfde lid][ref2], [50, zesde en zevende lid][ref3], [51, tweede lid][ref4], [52, tweede lid][ref5],
      [53][ref6], [51, zevende lid][ref7], en [77, eerste lid, van die wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel52
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel53
      [ref7]: https://wetten.overheid.nl/BWBR0013060#Artikel51
      [ref8]: https://wetten.overheid.nl/BWBR0013060#Artikel77
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '51'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '52'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '53'
      - id: ref7
        bwb_id: BWBR0013060
        artikel: '51'
      - id: ref8
        bwb_id: BWBR0013060
        artikel: '77'
  - number: '24.2'
    text: |-
      De Regeling reservevorming wachtgeldfondsen op grond van artikel 72 van de Organisatiewet sociale verzekeringen
      1997 berust, met uitzondering van de bijlage bij die regeling, met ingang van de datum van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] op [artikel 51, achtste lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel51
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '51'
  - number: '25.1'
    text: |-
      Regelingen van het Landelijk instituut sociale verzekeringen op grond van de artikelen 52 en 54 van de
      Organisatiewet sociale verzekeringen 1997 gelden met ingang van de datum van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] als regelingen van het Uitvoeringsinstituut
      werknemersverzekeringen op grond van de [artikelen 97l][ref2] en [97n van de Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel97n
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97l
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 97n
  - number: '25.2'
    text: |-
      De ministeriële regeling waarbij het bedrijfs- en beroepsleven wordt ingedeeld op grond van artikel 51, eerste
      lid, van de Organisatiewet sociale verzekeringen 1997, geldt met ingang van de datum van inwerkingtreding
      van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] als een regeling op grond van
      [artikel 97k van de Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97k
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97k
  - number: '26.1'
    text: |-
      Toestemming, verleend aan een uitvoeringsinstelling of aan de Sociale verzekeringsbank op grond van
      artikel 50, eerste lid, of artikel 25, derde lid, van de Organisatiewet sociale verzekeringen 1997,
      wordt aangemerkt als goedkeuring van een daartoe strekkend besluit van het Uitvoeringsinstituut
      werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank, op grond van
      [artikel 13 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel13
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '13'
  - number: '26.2'
    text: |-
      Verplichtingen, opgelegd aan een uitvoeringsinstelling of aan de Sociale verzekeringsbank op
      grond van artikel 50, tweede lid, of artikel 25, vierde lid, van de Organisatiewet sociale
      verzekeringen 1997, worden aangemerkt als verplichtingen, opgelegd aan het Uitvoeringsinstituut
      werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank, op grond van
      a[rtikel 13, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel13
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '13'
  - number: '26.3'
    text: |-
      De door Onze Minister op grond van artikel 25, eerste lid, onderdeel f, of artikel 38, eerste lid, onderdeel
      k, van de Organisatiewet sociale verzekeringen 1997 aangewezen algemene maatregelen van bestuur en ministeriële
      regelingen, waarvan de uitvoering is opgedragen aan de Sociale verzekeringsbank, onderscheidenlijk het
      Landelijk instituut sociale verzekeringen, worden aangemerkt als algemene maatregelen van bestuur en
      ministeriële regelingen waarvan de uitvoering op grond van [artikel 34, eerste lid, onderdeel e][ref1], of
      [artikel 30, eerste lid, onderdeel i, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] is
      opgedragen aan de Sociale verzekeringsbank, onderscheidenlijk het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '27.1'
    text: |-
      De [Arbeidsvoorzieningswet 1996][ref1] en de [Invoeringswet Arbeidsvoorzieningswet 1996][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
      [ref2]: https://wetten.overheid.nl/BWBR0008368
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008367
      - id: ref2
        bwb_id: BWBR0008368
  - number: '27.2'
    text: |-
      Voor de verschillende artikelen of onderdelen van de artikelen van de [Arbeidsvoorzieningswet 1996][ref1] en de
      [Invoeringswet Arbeidsvoorzieningswet 1996][ref2] kan bij koninklijk besluit het tijdstip waarop deze vervallen
      verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
      [ref2]: https://wetten.overheid.nl/BWBR0008368
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008367
      - id: ref2
        bwb_id: BWBR0008368
  - number: '27.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de gevolgen van de toepassing van het tweede lid,
      waarbij zo nodig kan worden afgeweken van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel27
  - number: '28.1'
    text: |-
      Alle vermogensbestanddelen van de Arbeidsvoorzieningsorganisatie gaan over op de Centrale organisatie werk en
      inkomen, zonder dat daarvoor een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel28
  - number: '28.2'
    text: |-
      Met betrekking tot de ingevolge dit artikel overgaande vermogensbestanddelen die in openbare registers te boek zijn
      gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders van die registers.
      De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de desbetreffende
      registers gedaan.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel28
  - number: '28.3'
    text: |-
      Ter zake van de in dit artikel bedoelde overgang van vermogensbestanddelen blijft heffing van overdrachtsbelasting
      achterwege.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel28
  - number: '29.1'
    text: |-
      De publiekrechtelijke rechten en verplichtingen van de Arbeidsvoorzieningsorganisatie
      gaan over op de Centrale organisatie werk en inkomen voorzover op grond van deze wet of de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '29.2'
    text: |-
      Een besluit van de Arbeidsvoorzieningsorganisatie geldt als een besluit van de Centrale organisatie werk en
      inkomen.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel29
  - number: '29.3'
    text: |-
      Een tot de Arbeidsvoorzieningsorganisatie gericht verzoek om een besluit te nemen geldt als te zijn gericht tot de
      Centrale organisatie werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel29
  - number: '30.1'
    text: |-
      In civielrechtelijke en bestuursrechtelijke gedingen waarin de Arbeidsvoorzieningsorganisatie partij is treedt de
      Centrale organisatie werk en inkomen in haar plaats, zonder dat daarvoor een betekening nodig is en met overneming
      van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel30
  - number: '30.2'
    text: |-
      Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor de Centrale organisatie
      werk en inkomen open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel30
  - number: '31'
    text: |-
      De bij het College van Beroep voor het bedrijfsleven aanhangige zaken betreffende besluiten
      van de Arbeidsvoorzieningsorganisatie op grond van de [Arbeidsvoorzieningswet 1996][ref1],
      de [Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref2] en de
      [Wet allocatie arbeidskrachten door intermediairs][ref3] gaan van rechtswege, in de stand waarin zij zich bevinden,
      over naar de rechtbank die bij toepassing van [artikel 8:7 van de Algemene wet bestuursrecht][ref4] bevoegd zou
      zijn geweest het beroep te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
      [ref2]: https://wetten.overheid.nl/BWBR0007746
      [ref3]: https://wetten.overheid.nl/BWBR0009616
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008367
      - id: ref2
        bwb_id: BWBR0007746
      - id: ref3
        bwb_id: BWBR0009616
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '32.1'
    text: |-
      Bij de Arbeidsvoorzieningsorganisatie aanhangige bezwaarschriften gaan, in de stand waarin zij zich bevinden, over
      naar de Centrale organisatie werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel32
  - number: '32.2'
    text: |-
      Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor de Centrale organisatie
      werk en inkomen open gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel32
  - number: '33'
    text: |-
      Aan de voorzitter, de plaatsvervangend voorzitters, de leden en de plaatsvervangende leden van het Centraal Bestuur
      voor de Arbeidsvoorziening en van de Regionale Besturen voor de Arbeidsvoorziening, die op de dag voorafgaande aan
      de datum van inwerkingtreding van deze wet die functies bekleden wordt met ingang van die datum ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel33
  - number: '34'
    text: |-
      De rechten en verplichtingen van de Arbeidsvoorzieningsorganisatie die voortvloeien uit de arbeidsovereenkomsten
      met haar werknemers, daaronder begrepen die welke voortvloeien uit een toezegging omtrent pensioen als bedoeld in
      [artikel 1 van de Pensioen- en spaarfondsenwet][ref1], gaan over op de Centrale organisatie werk en inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
  - number: '35.1'
    text: |-
      De regelingen van het Centraal Bestuur voor de Arbeidsvoorziening op grond van [artikel 75][ref1],
      onderscheidenlijk [artikel 77, tweede volzin, van de Arbeidsvoorzieningswet 1996][ref2] gelden met ingang van
      de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] als regelingen
      van de Centrale organisatie werk en inkomen op grond van [artikel 25, derde lid][ref4], onderscheidenlijk
      [artikel 25, tweede lid, tweede volzin, van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0008367#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0008367#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0013060
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008367
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0008367
        artikel: '77'
      - id: ref3
        bwb_id: BWBR0013060
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '25'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '25'
  - number: '35.2'
    text: |-
      Een termijn als bedoeld in [artikel 75 van de Arbeidsvoorzieningswet 1996][ref1] die is aangevangen voor de datum
      van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], wordt voor de toepassing
      van [artikel 25, vierde lid, onderdeel b, van laatstgenoemde wet][ref3] van het tijdstip van aanvang af aangemerkt
      als termijn als bedoeld in laatstgenoemde bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0008367#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0013060
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008367
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0013060
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '25'
  - number: '36'
    text: |-
      De registratie als werkzoekende op grond van de [Arbeidsvoorzieningswet 1996][ref1] wordt met ingang van de datum
      van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] aangemerkt als registratie
      als werkzoekende op grond van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
      [ref2]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008367
      - id: ref2
        bwb_id: BWBR0013060
  - number: '37'
    text: |-
      Verzoeken om goedkeuring als bedoeld in [artikel 10][ref1], onderscheidenlijk
      [artikel 66 van de Arbeidsvoorzieningswet 1996][ref2], waaromtrent door Onze Minister
      nog niet is beslist, worden aangemerkt als verzoeken om goedkeuring op grond van
      __REF002___________________________________________________________________________________________________________
      _______. Ten aanzien van zodanige verzoeken wordt alsnog [artikel 3, zesde lid, van die wet][ref4] toegepast. In
      dat geval vangt de termijn van dertien weken, bedoeld in [artikel 10:31 van de Algemene wet bestuursrecht][ref5],
      aan na de laatst bedoelde verzending ter goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0008367#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008367#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008367
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0008367
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '38.1'
    text: |-
      In afwijking van [artikel 29][ref1] geldt een besluit van de Arbeidsvoorzieningsorganisatie op grond van
      [artikel 4, tweede lid][ref2], en [artikel 81a van de Arbeidsvoorzieningswet 1996][ref3] als een besluit van de
      gemeente, waarin de arbeidsgehandicapte, bedoeld in die artikelen van de [Arbeidsvoorzieningswet 1996][ref4],
      woonachtig is, op grond van de[Wet inschakeling werkzoekenden][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0008367#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008367#Artikel81a
      [ref4]: https://wetten.overheid.nl/BWBR0008367
      [ref5]: https://wetten.overheid.nl/BWBR0009083
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '29'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008367
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008367
        artikel: 81a
      - id: ref4
        bwb_id: BWBR0008367
      - id: ref5
        bwb_id: BWBR0009083
  - number: '38.2'
    text: |-
      Een tot de Arbeidsvoorzieningsorganisatie gericht verzoek om een besluit te nemen als bedoeld in het eerste lid
      geldt als te zijn gericht tot de gemeente, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel38
  - number: '38.3'
    text: |-
      In afwijking van [artikel 32][ref1] gaat de behandeling van bezwaarschriften met betrekking tot de besluiten,
      bedoeld in het eerste lid, over naar de daar bedoelde gemeente en staat bij die gemeente bezwaar open tegen die
      besluiten, gedurende het resterende gedeelte van de bezwaartermijn die voor de inwerkingtreding van deze wet is
      aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel32
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '32'
        hoofdstuk: '3'
  - number: '38.4'
    text: |-
      In afwijking van [artikel 29][ref1] treedt de gemeente, bedoeld in het eerste lid, in de plaats van
      de Arbeidsvoorzieningsorganisatie in civielrechtelijke en bestuursrechtelijke gedingen waarin de
      Arbeidsvoorzieningsorganisatie partij is en die verband houden met de uitvoering van de artikelen van de
      [Arbeidsvoorzieningswet 1996][ref2], bedoeld in het eerste lid, zonder dat daarvoor een betekening nodig is en met
      overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '29'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008367
  - number: '38.5'
    text: |-
      Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor de in het eerste lid
      bedoelde gemeente open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel38
  - number: '38.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de overgang van werknemers van de
      Arbeidsvoorzieningsorganisatie naar gemeenten, in afwijking van [artikel 34][ref1], in verband met de overgang van
      verantwoordelijkheden, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel34
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '34'
        hoofdstuk: '3'
  - number: '39.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat in afwijking van [artikel 28][ref1],
      vermogensbestanddelen van de Arbeidsvoorzieningsorganisatie die worden toegerekend aan de uitvoering van in die
      maatregel genoemde taken of het verrichten van bepaalde diensten overgaan op bij die maatregel aan te wijzen
      rechtspersonen dan wel op de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel28
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '28'
        hoofdstuk: '3'
  - number: '39.2'
    text: |-
      [Artikel 28, derde lid][ref1], [30, eerste lid][ref2], en [artikel 34][ref3] zijn ten aanzien van de overgang,
      bedoeld in het eerste lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013061#Artikel34
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '28'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '30'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013061
        artikel: '34'
        hoofdstuk: '3'
  - number: '39.3'
    text: |-
      Bij of krachtens de maatregel, bedoeld in het eerste lid, kunnen regels worden gesteld voor de overgang van
      personeel, de gegevensoverdracht en de waardering van de vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel39
  - number: '40.1'
    text: |-
      De arbeidsovereenkomsten van personeelsleden die in dienst zijn van de Centrale organisatie werk en inkomen kunnen
      door die organisatie niet worden opgezegd zonder voorafgaande toestemming van de ontslagcommissie, bedoeld in
      [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel41
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '41'
        hoofdstuk: '3'
  - number: '40.2'
    text: |-
      Het eerste lid is niet van toepassing indien de opzegging geschiedt om een dringende aan de werknemer onverwijld
      meegedeelde reden dan wel indien de opzegging geschiedt met wederzijds goedvinden.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel40
  - number: '40.3'
    text: |-
      Een opzegging in strijd met het eerste lid is vernietigbaar. De werknemer kan binnen twee maanden na de opzegging
      een beroep doen op deze vernietigingsgrond. [Artikel 55 van Boek 3 van het Burgerlijk Wetboek][ref1] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel55
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '55'
  - number: '40.4'
    text: |-
      Een rechtsvordering in verband met de vernietiging verjaart door verloop van zes maanden na de dag waartegen is
      opgezegd.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel40
  - number: '40.5'
    text: |-
      De Centrale organisatie werk en inkomen kan niet opzeggen gedurende de tijd dat de werknemer ongeschikt is tot het
      verrichten van zijn arbeid wegens ziekte, tenzij de ongeschiktheid een aanvang heeft genomen nadat het voornemen
      van die organisatie tot opzegging van de arbeidsovereenkomst ter toetsing aan de ontslagcommissie, bedoeld in
      [artikel 41][ref1], is voorgelegd en door die commissie is ontvangen. Van de eerste volzin kan slechts worden
      afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel41
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '41'
        hoofdstuk: '3'
  - number: '40.6'
    text: |-
      Indien de toestemming, bedoeld in het eerste lid, is verleend, wordt de door de Centrale organisatie werk en
      inkomen in acht te nemen termijn van opzegging, verkort met een maand, met dien verstande dat de resterende termijn
      van opzegging ten minste één maand bedraagt. Van de eerste volzin kan slechts worden afgeweken bij collectieve
      arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel40
  - number: '41.1'
    text: |-
      Er is een ontslagcommissie, die tot taak heeft voornemens van de Centrale organisatie werk en inkomen tot opzegging
      van de arbeidsovereenkomsten, bedoeld in [artikel 40][ref1] te toetsen, alvorens toestemming voor de voorgenomen
      opzegging te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel40
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '40'
        hoofdstuk: '3'
  - number: '41.2'
    text: |-
      Bij de toetsing ingevolge het eerste lid neemt de ontslagcommissie de door Onze Minister krachtens
      [artikel 6, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] gestelde regels in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '6'
  - number: '41.3'
    text: |-
      De ontslagcommissie bestaat uit drie leden, die door Onze Minister worden benoemd. Eén lid wordt benoemd
      op voordracht van de Centrale organisatie werk en inkomen, één lid op voordracht van de organisaties die
      representatief zijn voor de bij de Centrale organisatie werk en inkomen werkzame werknemers en één lid, tevens
      voorzitter, op gezamenlijke voordracht van de Centrale organisatie werk en inkomen en genoemde organisaties.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: '41.4'
    text: |-
      Onze Minister benoemt voor ieder van de leden een plaatsvervanger. De tweede volzin van het derde lid is daarbij
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: '41.5'
    text: |-
      De benoeming van de leden en plaatsvervangende leden geschiedt voor de tijd van ten hoogste vier jaren. De
      aftredende leden en plaatsvervangende leden zijn terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: '41.6'
    text: 'Aan een lid of plaatsvervangend lid wordt door Onze Minister tussentijds ontslag verleend:'
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: 41.6.a
    text: bij verlies van de hoedanigheid of beëindiging van de functie in verband waarmee de benoeming heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: 41.6.b
    text: op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: '41.7'
    text: De ontslagcommissie regelt, met inachtneming van de regels bedoeld in het tweede lid, zelf haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: '41.8'
    text: |-
      De Centrale organisatie werk en inkomen regelt de aanwezigheidsvergoeding van de voorzitter alsmede de vergoeding
      voor reis- en verblijfkosten van de leden en plaatsvervangende leden. Het voorziet tevens in het secretariaat van
      de ontslagcommissie.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
  - number: '42.1'
    text: |-
      De commissie die is ingesteld op grond van [artikel 43 van de Arbeidsvoorzieningswet 1996][ref1] wordt gehandhaafd
      en geldt met ingang van de datum van inwerkingtreding van de [artikelen 40][ref2] en [41][ref3] als commissie,
      bedoeld in [artikel 41][ref4], en behandelt de voor die datum bij eerstgenoemde commissie ingediende verzoeken om
      toestemming van een voorgenomen opzegging van een arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0008367#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0013061#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0013061#Artikel41
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008367
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '40'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013061
        artikel: '41'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0013061
        artikel: '41'
        hoofdstuk: '3'
  - number: '42.2'
    text: |-
      De [artikelen 40][ref1] en [41][ref2] zijn van toepassing totdat in een collectieve arbeidsovereenkomst een
      regeling betreffende toestemming van een voorgenomen opzegging van een arbeidsovereenkomst van het personeel van de
      Centrale organisatie werk en inkomen is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel41
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '40'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '41'
        hoofdstuk: '3'
  - number: '42.3'
    text: |-
      Indien twee jaar na inwerkingtreding van de [artikelen 40][ref1] en [41][ref2] de in het tweede lid bedoelde
      collectieve arbeidsovereenkomst niet tot stand is gekomen dan wel in die collectieve arbeidsovereenkomst een
      dergelijke regeling niet is opgenomen, vervallen genoemde artikelen en wordt aan de zittende leden ontslag
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel41
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '40'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '41'
        hoofdstuk: '3'
  - number: '42.4'
    text: |-
      Verzoeken om toestemming van een voorgenomen opzegging van een arbeidsovereenkomst waaromtrent op de dag waarop
      de [artikelen 40][ref1] en [41][ref2] overeenkomstig het derde lid vervallen door de in die artikelen bedoelde
      ontslagcommissie nog niet is beslist, worden met inachtneming van het daaromtrent in die artikelen bepaalde
      afgehandeld, doch uiterlijk binnen zes maanden na die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel41
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '40'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '41'
        hoofdstuk: '3'
  - number: '42.5'
    text: |-
      De ontslagcommissie blijft in stand voor zolang dat in verband met de toepassing van het vierde lid noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel42
  - number: '42.6'
    text: |-
      Uiterlijk met ingang van de dag, gelegen zes maanden na de datum bedoeld in het derde lid, wordt aan de leden en de
      plaatsvervangende leden van de ontslagcommissie ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel42
  - number: 44.A
    text: |-
      Regelingen van het Landelijk instituut sociale verzekeringen op grond van de
      [artikelen 16, zevende lid][ref1], [17a, vierde lid][ref2], [18, tweede lid][ref3], [19, vijfde lid][ref4],
      [20, zesde lid][ref5], [21, vierde lid][ref6], [27c, derde lid][ref7], [36b, tweede lid][ref8],
      [52d, vijfde lid, van de Werkloosheidswet][ref9], zoals deze artikelen luidden op de datum vóór het tijdstip van
      inwerkingtreding van deze wet, gelden met ingang van dat tijdstip als ministeriële regelingen op grond van de
      artikelen 16, zevende lid, 17a, vierde lid, 18, tweede lid, 19, vijfde lid, 20, zesde lid, 21, vierde lid, 27c,
      derde lid, 36b, 52d, vijfde lid, van de Werkloosheidswet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref7]: https://wetten.overheid.nl/BWBR0004045#Artikel27c
      [ref8]: https://wetten.overheid.nl/BWBR0004045#Artikel36b
      [ref9]: https://wetten.overheid.nl/BWBR0004045#Artikel52d
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '20'
      - id: ref6
        bwb_id: BWBR0004045
        artikel: '21'
      - id: ref7
        bwb_id: BWBR0004045
        artikel: 27c
      - id: ref8
        bwb_id: BWBR0004045
        artikel: 36b
      - id: ref9
        bwb_id: BWBR0004045
        artikel: 52d
  - number: 47.A
    text: |-
      Door het Landelijk instituut sociale verzekeringen, op grond van de [artikelen 14c, derde lid][ref1], en
