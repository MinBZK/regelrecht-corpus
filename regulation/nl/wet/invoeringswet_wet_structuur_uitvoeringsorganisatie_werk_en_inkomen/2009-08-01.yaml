  - number: '26'
    text: |-
      1 Toestemming, verleend aan een uitvoeringsinstelling of aan de Sociale verzekeringsbank op
      grond van artikel 50, eerste lid, of artikel 25, derde lid, van de Organisatiewet sociale
      verzekeringen 1997, wordt aangemerkt als goedkeuring van een daartoe strekkend besluit van het
      Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank, op grond van
      [artikel 13 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      2 Verplichtingen, opgelegd aan een uitvoeringsinstelling of aan de Sociale verzekeringsbank
      op grond van artikel 50, tweede lid, of artikel 25, vierde lid, van de Organisatiewet sociale
      verzekeringen 1997, worden aangemerkt als verplichtingen, opgelegd aan het Uitvoeringsinstituut
      werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank, op grond van
      a[rtikel 13, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].

      3 De door Onze Minister op grond van artikel 25, eerste lid, onderdeel f, of artikel 38, eerste lid,
      onderdeel k, van de Organisatiewet sociale verzekeringen 1997 aangewezen algemene maatregelen van bestuur en
      ministeriële regelingen, waarvan de uitvoering is opgedragen aan de Sociale verzekeringsbank, onderscheidenlijk
      het Landelijk instituut sociale verzekeringen, worden aangemerkt als algemene maatregelen van bestuur en
      ministeriële regelingen waarvan de uitvoering op grond van [artikel 34, eerste lid, onderdeel e][ref3], of
      [artikel 30, eerste lid, onderdeel i, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4] is
      opgedragen aan de Sociale verzekeringsbank, onderscheidenlijk het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel13
