  - number: '38'
    text: |-
      1 In afwijking van [artikel 29][ref1] geldt een besluit van de Arbeidsvoorzieningsorganisatie op grond van
      [artikel 4, tweede lid][ref2], en [artikel 81a van de Arbeidsvoorzieningswet 1996][ref3] als een besluit van de
      gemeente, waarin de arbeidsgehandicapte, bedoeld in die artikelen van de [Arbeidsvoorzieningswet 1996][ref4],
      woonachtig is, op grond van de[Wet inschakeling werkzoekenden][ref5].

      2 Een tot de Arbeidsvoorzieningsorganisatie gericht verzoek om een besluit te nemen als bedoeld in het eerste lid
      geldt als te zijn gericht tot de gemeente, bedoeld in het eerste lid.

      3 In afwijking van [artikel 32][ref6] gaat de behandeling van bezwaarschriften met betrekking tot de besluiten,
      bedoeld in het eerste lid, over naar de daar bedoelde gemeente en staat bij die gemeente bezwaar open tegen die
      besluiten, gedurende het resterende gedeelte van de bezwaartermijn die voor de inwerkingtreding van deze wet is
      aangevangen.

      4 In afwijking van [artikel 29][ref7] treedt de gemeente, bedoeld in het eerste lid, in de plaats
      van de Arbeidsvoorzieningsorganisatie in civielrechtelijke en bestuursrechtelijke gedingen waarin de
      Arbeidsvoorzieningsorganisatie partij is en die verband houden met de uitvoering van de artikelen van de
      [Arbeidsvoorzieningswet 1996][ref8], bedoeld in het eerste lid, zonder dat daarvoor een betekening nodig is en met
      overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.

      5 Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor de in het eerste lid
      bedoelde gemeente open gedurende het resterende gedeelte van de beroepstermijn.

      6 Bij ministeriële regeling kunnen regels worden gesteld omtrent de overgang van werknemers van de
      Arbeidsvoorzieningsorganisatie naar gemeenten, in afwijking van [artikel 34][ref9], in verband met de overgang van
      verantwoordelijkheden, bedoeld in dit artikel.


