    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld in verband met een goede overgang van taken van het
      Landelijk instituut sociale verzekeringen, de Arbeidsvoorzieningsorganisatie en de Sociale verzekeringsbank
      naar werkgevers en gemeenten ter bevordering van de inschakeling in de arbeid van uitkeringsgerechtigden en
      arbeidsgehandicapten, waarin in ieder geval bepaald wordt, dat en op welke wijze de daarmee samenhangende
      activiteiten en het verstrekken van instrumenten, waarmee voor de datum van inwerkingtreding van deze
      wet een aanvang is gemaakt, worden voortgezet door het Uitvoeringsinstituut werknemersverzekeringen
      en gemeenten, zo nodig in afwijking van de [Wet op de (re)integratie arbeidsgehandicapten][ref1], de
      [Wet inschakeling werkzoekenden][ref2] en de [Werkloosheidswet][ref3].

      2 In de ministeriële regeling, bedoeld in het eerste lid, kan bepaald worden, dat het
      Uitvoeringsinstituut werknemersverzekeringen voor een in die regeling bepaalde periode een taak heeft
      tot bevordering van inschakeling in het arbeidsproces op grond van [artikel 8, eerste lid][ref4] en
      [artikel 10, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref5], zoals die artikelen luidden
      voorafgaand aan de datum van inwerkingtreding van de wijziging van dit artikel in deze wet.

      3 In de ministeriële regeling, bedoeld in het eerst lid, kan bepaald worden, dat kosten in verband met de
      uitvoering van het eerste lid ten laste komen van het Reïntegratiefonds.


