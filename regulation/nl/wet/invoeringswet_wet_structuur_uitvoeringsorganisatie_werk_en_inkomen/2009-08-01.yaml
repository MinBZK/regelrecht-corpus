  - number: '40'
    text: |-
      1 De arbeidsovereenkomsten van personeelsleden die in dienst zijn van de Centrale organisatie werk en inkomen
      kunnen door die organisatie niet worden opgezegd zonder voorafgaande toestemming van de ontslagcommissie, bedoeld
      in [artikel 41][ref1].

      2 Het eerste lid is niet van toepassing indien de opzegging geschiedt om een dringende aan de werknemer onverwijld
      meegedeelde reden dan wel indien de opzegging geschiedt met wederzijds goedvinden.

      3 Een opzegging in strijd met het eerste lid is vernietigbaar. De werknemer kan binnen twee maanden na de opzegging
      een beroep doen op deze vernietigingsgrond. [Artikel 55 van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van
      toepassing.

      4 Een rechtsvordering in verband met de vernietiging verjaart door verloop van zes maanden na de dag waartegen
      is opgezegd.

      5 De Centrale organisatie werk en inkomen kan niet opzeggen gedurende de tijd dat de werknemer ongeschikt is
      tot het verrichten van zijn arbeid wegens ziekte, tenzij de ongeschiktheid een aanvang heeft genomen nadat het
      voornemen van die organisatie tot opzegging van de arbeidsovereenkomst ter toetsing aan de ontslagcommissie,
      bedoeld in [artikel 41][ref3], is voorgelegd en door die commissie is ontvangen. Van de eerste volzin kan
      slechts worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd
      bestuursorgaan.

      6 Indien de toestemming, bedoeld in het eerste lid, is verleend, wordt de door de Centrale organisatie werk en
      inkomen in acht te nemen termijn van opzegging, verkort met een maand, met dien verstande dat de resterende termijn
      van opzegging ten minste één maand bedraagt. Van de eerste volzin kan slechts worden afgeweken bij collectieve
      arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0013061#Artikel41
