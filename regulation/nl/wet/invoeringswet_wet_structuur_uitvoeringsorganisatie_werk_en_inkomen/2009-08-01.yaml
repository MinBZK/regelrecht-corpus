  - number: '5'
    text: |-
      Alle vermogensbestanddelen van de uitvoeringsinstellingen gaan over op het Uitvoeringsinstituut
      werknemersverzekeringen, zonder dat daarvoor een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel5
  - number: '6'
    text: |-
      Alle vermogensbestanddelen van de stichting, bedoeld in artikel 5, eerste lid, van het Besluit voorwaarden
      erkenning uitvoeringsinstelling, gaan over op het Uitvoeringsinstituut werknemersverzekeringen, zonder dat daarvoor
      een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel6
  - number: '7'
    text: |-
      Alle vermogensbestanddelen van het College van toezicht sociale verzekeringen gaan over op de Staat (Ministerie van
      Sociale Zaken en Werkgelegenheid), zonder dat daarvoor een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel7
  - number: '8'
    text: |-
      1 Met betrekking tot de ingevolge de [artikelen 4][ref1], [5][ref2], [6][ref3] en [7][ref4] overgaande
      vermogensbestanddelen die in openbare registers te boek zijn gesteld, zal verandering van de tenaamstelling in die
      registers plaatsvinden door de bewaarders van die registers. De daartoe benodigde opgaven worden door de zorg van
      Onze Minister aan de bewaarders van de desbetreffende registers gedaan.

      2 Ter zake van de in de [artikelen 4][ref5], [5][ref6], [6][ref7] en [7][ref8] bedoelde overgang van
      vermogensbestanddelen blijft heffing van overdrachtsbelasting achterwege.


