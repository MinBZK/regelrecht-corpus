  - number: '132.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel132
  - number: '132.2'
    text: |-
      Indien het bij koninklijke boodschap van 2 maart 2000 ingediende voorstel van een [Tijdelijke referendumwet][ref1]
      (Kamerstukken II 1999/2000, 27 034) tot wet wordt verheven en in werking treedt, en deze wet wordt bekrachtigd
      op of na het tijdstip van inwerkingtreding van de [Tijdelijke referendumwet][ref2], kan bij de toepassing van het
      eerste lid worden afgeweken van de [artikelen 12][ref3] en [13 van de Tijdelijke referendumwet][ref4] en vindt in
      dat geval [artikel 16 van laatstgenoemde wet][ref5] toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012701
      [ref2]: https://wetten.overheid.nl/BWBR0012701
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0012701#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0012701#Artikel16
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel132
    references:
      - id: ref1
