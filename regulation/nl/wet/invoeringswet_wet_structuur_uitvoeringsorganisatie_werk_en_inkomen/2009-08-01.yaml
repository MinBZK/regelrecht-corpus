  - number: '9'
    text: |-
      1 De publiekrechtelijke rechten en verplichtingen van het Landelijk instituut sociale verzekeringen en de
      uitvoeringsinstellingen gaan over op het Uitvoeringsinstituut werknemersverzekeringen voorzover in deze wet of de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] niet anders is bepaald.

      2 Een besluit dat door het Landelijk instituut sociale verzekeringen of namens dit instituut door een
      uitvoeringsinstelling is genomen, geldt als een besluit van het Uitvoeringsinstituut werknemersverzekeringen.

      3 Een tot het Landelijk instituut sociale verzekeringen of een uitvoeringsinstelling gericht verzoek om een besluit
      te nemen, wordt beschouwd als te zijn gericht tot het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '10'
    text: |-
      1 De publiekrechtelijke rechten en verplichtingen van het College van toezicht sociale verzekeringen gaan over op
      Onze Minister voorzover in deze wet of de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] niet anders
      is bepaald.

      2 Een besluit van het College van toezicht sociale verzekeringen geldt als een besluit van Onze Minister.

      3 Een tot het College van toezicht sociale verzekeringen gericht verzoek om een besluit te nemen, wordt beschouwd
      als te zijn gericht tot Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '11'
    text: |-
      1 In civielrechtelijke en bestuursrechtelijke gedingen waarin het Landelijk instituut sociale verzekeringen partij
      is treedt het Uitvoeringsinstituut werknemersverzekeringen in zijn plaats, zonder dat daarvoor een betekening nodig
      is en met overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.

      2 Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het
      Uitvoeringsinstituut werknemersverzekeringen open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel11
  - number: '12'
    text: |-
      1 In civielrechtelijke en bestuursrechtelijke gedingen waarin een uitvoeringsinstelling partij is treedt het
      Uitvoeringsinstituut werknemersverzekeringen in haar plaats, zonder dat daarvoor een betekening nodig is en met
      overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.

      2 Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het
      Uitvoeringsinstituut werknemersverzekeringen open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel12
  - number: '13'
    text: |-
      In civielrechtelijke gedingen waarin het College van toezicht sociale verzekeringen partij is treedt de Staat
      (Ministerie van Sociale Zaken en Werkgelegenheid) in zijn plaats, zonder dat daarvoor een betekening nodig is en
      met overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel13
  - number: '14'
    text: |-
      1 In bestuursrechtelijke gedingen waarin het College van toezicht sociale verzekeringen partij is treedt Onze
      Minister in zijn plaats, zonder dat daarvoor een betekening nodig is en met overneming van aanwijzing van een
      gemachtigde.

      2 Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor Onze Minister open
      gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel14
  - number: '15'
    text: |-
      Indien de toepassing van dit hoofdstuk tot gevolg heeft dat in een geding eiser en gedaagde samenvallen, wordt dat
      geding tussen die partijen van rechtswege beëindigd.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel15
  - number: '16'
    text: |-
      Indien de toepassing van dit hoofdstuk tot gevolg heeft dat in een bezwaarschriftenprocedure de indiener
      van het bezwaarschrift en het bestuursorgaan dat het bestreden besluit heeft genomen samenvallen, wordt die
      bezwaarschriftenprocedure tussen hen van rechtswege beëindigd.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel16
  - number: '17'
    text: |-
      1 Bij het Landelijk instituut sociale verzekeringen aanhangige bezwaarschriften gaan, in de stand waarin zij zich
      bevinden, over naar het Uitvoeringsinstituut werknemersverzekeringen.

      2 Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het
      Uitvoeringsinstituut werknemersverzekeringen open gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel17
  - number: '18'
    text: |-
      1 Bij het College van toezicht sociale verzekeringen aanhangige bezwaarschriften gaan, in de stand waarin zij zich
      bevinden, over naar Onze Minister.

      2 Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor Onze Minister open
      gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel18
  - number: '19'
    text: |-
      1 Aan de leden van het College van toezicht sociale verzekeringen die op de dag voorafgaand aan de datum van
      inwerkingtreding van deze wet die functies bekleden wordt met ingang van die datum ontslag verleend.

      2 Aan de voorzitter, de leden en de plaatsvervangende leden van het Landelijk instituut sociale verzekeringen die
      op de dag voorafgaand aan de datum van inwerkingtreding van deze wet die functies bekleden wordt met ingang van die
      datum ontslag verleend.

      3 Aan de voorzitter, de leden en de plaatsvervangende leden van de Sociale verzekeringsbank die op 31 december 2002
      die functies bekleden wordt met ingang van 1 januari 2003 ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel19
  - number: '20'
    text: |-
      De door Onze Minister op grond van de artikelen 7, 22 en 35 van de Organisatiewet sociale verzekeringen 1997
      gestelde regels blijven na de inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      van kracht voor zolang daaraan door de in [artikel 19][ref2] bedoelde functionarissen aanspraken kunnen worden
      ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel19
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '19'
        hoofdstuk: '2'
  - number: '21'
    text: |-
      De rechten en verplichtingen van het Landelijk instituut sociale verzekeringen en de uitvoeringsinstellingen die
      voortvloeien uit de arbeidsovereenkomsten met hun werknemers, daaronder begrepen die welke voortvloeien uit een
      toezegging omtrent pensioen als bedoeld in [artikel 1 van de Pensioen- en spaarfondsenwet][ref1], gaan over op het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel21
