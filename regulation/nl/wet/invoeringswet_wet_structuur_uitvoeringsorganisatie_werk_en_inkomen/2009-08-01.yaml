  - number: '2.1'
    text: |-
      De Organisatiewet sociale verzekeringen 1997 en de Invoeringswet Organisatiewet sociale verzekeringen 1997 worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de verschillende artikelen of onderdelen van de artikelen van de Organisatiewet sociale verzekeringen 1997
      en de Invoeringswet Organisatiewet sociale verzekeringen 1997 kan bij koninklijk besluit het tijdstip waarop deze
      vervallen verschillend worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel2
  - number: '3.1'
    text: |-
      De Sociale Verzekeringsbank, genoemd in artikel 17 van Organisatiewet sociale verzekeringen
      1997, zoals deze luidde op de datum vóór het tijdstip van inwerkingtreding van deze
      wet, wordt als rechtspersoon gehandhaafd en is de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '3.2'
    text: |-
      De artikelen 18, 19, eerste, derde en vierde lid, 20, 22, 23 en 24 van de Organisatiewet sociale verzekeringen 1997
      en de op grond daarvan gestelde regels, zoals deze luidden op de datum vóór het tijdstip van inwerkingtreding van
      deze wet, blijven tot 1 januari 2003 van toepassing, met dien verstande dat de periode van benoeming van leden en
      plaatsvervangende leden van het bestuur zich niet langer dan tot 1 januari 2003 kan uitstrekken.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel3
  - number: '4.1'
    text: |-
      Alle vermogensbestanddelen van het Landelijk instituut sociale verzekeringen gaan over op het Uitvoeringsinstituut
      werknemersverzekeringen, zonder dat daarvoor een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
  - number: '4.2'
    text: |-
      De vermogensbestanddelen die deel uitmaken van het Algemeen Werkloosheidsfonds en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Algemeen Werkloosheidsfonds dat op grond van
      [artikel 103 van de Werkloosheidswet][ref1] door het Uitvoeringsinstituut werknemersverzekeringen afzonderlijk
      wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel103
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '103'
  - number: '4.3'
    text: |-
      De vermogensbestanddelen die deel uitmaken van het Arbeidsongeschiktheidsfonds en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Arbeidsongeschiktheidsfonds dat op grond van
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel72
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '72'
  - number: '4.4'
    text: |-
      De vermogensbestanddelen die deel uitmaken van de Arbeidsongeschiktheidskas en op grond van
      het eerste lid overgaan, gaan deel uitmaken van de Arbeidsongeschiktheidskas die op grond van
      [artikel 73 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel73
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '73'
  - number: '4.5'
    text: |-
      De vermogensbestanddelen die deel uitmaken van het Arbeidsongeschiktheidsfonds zelfstandigen en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Arbeidsongeschiktheidsfonds zelfstandigen dat op grond van
      [artikel 78 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel78
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '78'
  - number: '4.6'
    text: |-
      De vermogensbestanddelen die deel uitmaken van het Arbeidsongeschiktheidsfonds jonggehandicapten en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Arbeidsongeschiktheidsfonds jonggehandicapten dat op grond van
      [artikel 63 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel63
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '63'
  - number: '4.7'
    text: |-
      De vermogensbestanddelen die deel uitmaken van het Reïntegratiefonds en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Reïntegratiefonds dat op grond van
      [artikel 41 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel41
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '41'
  - number: '4.8'
    text: |-
      De vermogensbestanddelen die deel uitmaken van een wachtgeldfonds en op grond van het eerste lid overgaan, gaan
      deel uitmaken van het wachtgeldfonds dat voor het desbetreffende onderdeel van het bedrijfs- en beroepsleven
      op grond van [artikel 102 van de Werkloosheidswet][ref1] door het Uitvoeringsinstituut werknemersverzekeringen
      afzonderlijk wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel102
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '102'
  - number: '4.9'
    text: |-
      De vermogensbestanddelen die deel uitmaken van het Uitvoeringsfonds voor de overheid en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Uitvoeringsfonds voor de overheid dat op grond van
      [artikel 104 van de Werkloosheidswet][ref1] door het Uitvoeringsinstituut werknemersverzekeringen afzonderlijk
      wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel104
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '104'
  - number: '4.10'
    text: |-
      De vermogensbestanddelen die deel uitmaken van het Toeslagenfonds en op grond van het eerste lid overgaan,
      gaan deel uitmaken van het Toeslagenfonds dat op grond van [artikel 31 van de Toeslagenwet][ref1] door het
      Uitvoeringsinstituut werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel31
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '31'
  - number: '5'
    text: |-
      Alle vermogensbestanddelen van de uitvoeringsinstellingen gaan over op het Uitvoeringsinstituut
      werknemersverzekeringen, zonder dat daarvoor een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel5
  - number: '6'
    text: |-
      Alle vermogensbestanddelen van de stichting, bedoeld in artikel 5, eerste lid, van het Besluit voorwaarden
      erkenning uitvoeringsinstelling, gaan over op het Uitvoeringsinstituut werknemersverzekeringen, zonder dat daarvoor
      een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel6
  - number: '7'
    text: |-
      Alle vermogensbestanddelen van het College van toezicht sociale verzekeringen gaan over op de Staat (Ministerie van
      Sociale Zaken en Werkgelegenheid), zonder dat daarvoor een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel7
  - number: '8.1'
    text: |-
      Met betrekking tot de ingevolge de [artikelen 4][ref1], [5][ref2], [6][ref3] en [7][ref4] overgaande
      vermogensbestanddelen die in openbare registers te boek zijn gesteld, zal verandering van de tenaamstelling in die
      registers plaatsvinden door de bewaarders van die registers. De daartoe benodigde opgaven worden door de zorg van
      Onze Minister aan de bewaarders van de desbetreffende registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013061#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0013061#Artikel7
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel8
    references:
      - id: ref1
