  - number: '39'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat in afwijking van [artikel 28][ref1],
      vermogensbestanddelen van de Arbeidsvoorzieningsorganisatie die worden toegerekend aan de uitvoering van in die
      maatregel genoemde taken of het verrichten van bepaalde diensten overgaan op bij die maatregel aan te wijzen
      rechtspersonen dan wel op de Staat.

      2 [Artikel 28, derde lid][ref2], [30, eerste lid][ref3], en [artikel 34][ref4] zijn ten aanzien van de overgang,
      bedoeld in het eerste lid, van overeenkomstige toepassing.

      3 Bij of krachtens de maatregel, bedoeld in het eerste lid, kunnen regels worden gesteld voor de overgang van
      personeel, de gegevensoverdracht en de waardering van de vermogensbestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel28
