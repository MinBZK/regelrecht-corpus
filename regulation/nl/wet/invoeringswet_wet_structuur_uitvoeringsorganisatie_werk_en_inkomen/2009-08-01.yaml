  - number: '127.1'
    text: |-
      Onze Minister is bevoegd in plaats van de tijdstippen, genoemd in
      [hoofdstuk 8 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], andere tijdstippen vast te stellen
      alsmede te bepalen dat anderszins wordt afgeweken van de bij of krachtens dat hoofdstuk gegeven regels dan wel
      dat de toepassing daarvan achterwege blijft, voorzover dat in verband met de datum van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0013060
  - number: '127.2'
    text: |-
      Onze Minister is bevoegd, voorzover dat in verband met de datum van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] noodzakelijk is, regels te stellen met betrekking tot
      de bevoegdheid van de Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank tot het aangaan van verplichtingen en het doen van uitgaven
      en de daaraan ten grondslag te leggen budgetten, begrotingen en jaarplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '127.3'
    text: |-
      Onze Minister is overigens bevoegd met het oog op een goede invoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] regels te stellen, waarbij zo nodig kan worden
      afgeweken van het bepaalde bij en krachtens genoemde wet en deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '127.4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat kosten in verband met de intrekking van de
      [Arbeidsvoorzieningswet 1996][ref1] ten laste van het Rijk worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '128.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld in verband met een goede overgang van taken van het
      Landelijk instituut sociale verzekeringen, de Arbeidsvoorzieningsorganisatie en de Sociale verzekeringsbank
      naar werkgevers en gemeenten ter bevordering van de inschakeling in de arbeid van uitkeringsgerechtigden en
      arbeidsgehandicapten, waarin in ieder geval bepaald wordt, dat en op welke wijze de daarmee samenhangende
      activiteiten en het verstrekken van instrumenten, waarmee voor de datum van inwerkingtreding van deze
      wet een aanvang is gemaakt, worden voortgezet door het Uitvoeringsinstituut werknemersverzekeringen
      en gemeenten, zo nodig in afwijking van de [Wet op de (re)integratie arbeidsgehandicapten][ref1], de
      [Wet inschakeling werkzoekenden][ref2] en de [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0009083
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0009565
      - id: ref2
        bwb_id: BWBR0009083
      - id: ref3
        bwb_id: BWBR0004045
  - number: '128.2'
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, kan bepaald worden, dat het
      Uitvoeringsinstituut werknemersverzekeringen voor een in die regeling bepaalde periode een taak heeft
      tot bevordering van inschakeling in het arbeidsproces op grond van [artikel 8, eerste lid][ref1] en
      [artikel 10, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref2], zoals die artikelen luidden
      voorafgaand aan de datum van inwerkingtreding van de wijziging van dit artikel in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
  - number: '128.3'
    text: |-
      In de ministeriële regeling, bedoeld in het eerst lid, kan bepaald worden, dat kosten in verband met de uitvoering
      van het eerste lid ten laste komen van het Reïntegratiefonds.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel128
  - number: '129'
    text: |-
      Een rechtshandeling die door een uitvoeringsinstelling, een houdstermaatschappij als bedoeld in § 4 van
      het Besluit voorwaarden erkenning uitvoeringsinstelling, een stichting die de aandelen hield in zulk een
      houdstermaatschappij, of een stichting als bedoeld in § 3 van dat besluit, zoals dat besluit luidde tot 1
      november 2000, is verricht na 23 november 1999 en voor de datum van inwerkingtreding van deze wet, en waarvan deze
      wist of redelijkerwijze behoorde te weten dat daaruit voor een uitvoeringsinstelling, een fonds als bedoeld in
      [artikel 1, onderdeel l, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de stichting, bedoeld
      in artikel 5, eerste lid, van het Besluit voorwaarden erkenning uitvoeringsinstelling, het Uitvoeringsinstituut
      werknemersverzekeringen of de Staat schade voortvloeit, is vernietigbaar. De rechter kan de gevolgen van een
      vernietiging beperken voorzover dat nodig is ter bescherming van rechten van derden te goeder trouw.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel1
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '1'
