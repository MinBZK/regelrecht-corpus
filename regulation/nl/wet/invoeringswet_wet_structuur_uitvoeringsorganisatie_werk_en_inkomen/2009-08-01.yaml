  - number: '28'
    text: |-
      1 Alle vermogensbestanddelen van de Arbeidsvoorzieningsorganisatie gaan over op de Centrale organisatie werk en
      inkomen, zonder dat daarvoor een akte of betekening nodig is.

      2 Met betrekking tot de ingevolge dit artikel overgaande vermogensbestanddelen die in openbare registers te
      boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders van
      die registers. De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de
      desbetreffende registers gedaan.

      3 Ter zake van de in dit artikel bedoelde overgang van vermogensbestanddelen blijft heffing van
      overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel28
  - number: '29'
    text: |-
      1 De publiekrechtelijke rechten en verplichtingen van de Arbeidsvoorzieningsorganisatie
      gaan over op de Centrale organisatie werk en inkomen voorzover op grond van deze wet of de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] niet anders is bepaald.

      2 Een besluit van de Arbeidsvoorzieningsorganisatie geldt als een besluit van de Centrale organisatie werk en
      inkomen.

      3 Een tot de Arbeidsvoorzieningsorganisatie gericht verzoek om een besluit te nemen geldt als te zijn gericht tot
      de Centrale organisatie werk en inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '30'
    text: |-
      1 In civielrechtelijke en bestuursrechtelijke gedingen waarin de Arbeidsvoorzieningsorganisatie partij is treedt de
      Centrale organisatie werk en inkomen in haar plaats, zonder dat daarvoor een betekening nodig is en met overneming
      van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.

      2 Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor de Centrale
      organisatie werk en inkomen open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel30
  - number: '31'
    text: |-
      De bij het College van Beroep voor het bedrijfsleven aanhangige zaken betreffende besluiten
      van de Arbeidsvoorzieningsorganisatie op grond van de [Arbeidsvoorzieningswet 1996][ref1],
      de [Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref2] en de
      [Wet allocatie arbeidskrachten door intermediairs][ref3] gaan van rechtswege, in de stand waarin zij zich bevinden,
      over naar de rechtbank die bij toepassing van [artikel 8:7 van de Algemene wet bestuursrecht][ref4] bevoegd zou
      zijn geweest het beroep te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
      [ref2]: https://wetten.overheid.nl/BWBR0007746
      [ref3]: https://wetten.overheid.nl/BWBR0009616
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel87
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel31
    references:
