      - id: ref2
        bwb_id: BWBR0007746
      - id: ref3
        bwb_id: BWBR0009616
      - id: ref4
        bwb_id: BWBR0005537
        artikel: 8:7
  - number: '32'
    text: |-
      1 Bij de Arbeidsvoorzieningsorganisatie aanhangige bezwaarschriften gaan, in de stand waarin zij zich bevinden,
      over naar de Centrale organisatie werk en inkomen.

      2 Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor de Centrale
      organisatie werk en inkomen open gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel32
  - number: '33'
    text: |-
      Aan de voorzitter, de plaatsvervangend voorzitters, de leden en de plaatsvervangende leden van het Centraal Bestuur
      voor de Arbeidsvoorziening en van de Regionale Besturen voor de Arbeidsvoorziening, die op de dag voorafgaande aan
      de datum van inwerkingtreding van deze wet die functies bekleden wordt met ingang van die datum ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel33
  - number: '34'
    text: |-
      De rechten en verplichtingen van de Arbeidsvoorzieningsorganisatie die voortvloeien uit de arbeidsovereenkomsten
      met haar werknemers, daaronder begrepen die welke voortvloeien uit een toezegging omtrent pensioen als bedoeld in
      [artikel 1 van de Pensioen- en spaarfondsenwet][ref1], gaan over op de Centrale organisatie werk en inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel34
