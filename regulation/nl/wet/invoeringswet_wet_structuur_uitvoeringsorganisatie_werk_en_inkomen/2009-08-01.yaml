        hoofdstuk: '6'
  - number: '4'
    text: |-
      1 Alle vermogensbestanddelen van het Landelijk instituut sociale verzekeringen gaan over op het
      Uitvoeringsinstituut werknemersverzekeringen, zonder dat daarvoor een akte of betekening nodig is.

      2 De vermogensbestanddelen die deel uitmaken van het Algemeen Werkloosheidsfonds en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Algemeen Werkloosheidsfonds dat op grond van
      [artikel 103 van de Werkloosheidswet][ref1] door het Uitvoeringsinstituut werknemersverzekeringen afzonderlijk
      wordt beheerd en geadministreerd.

      3 De vermogensbestanddelen die deel uitmaken van het Arbeidsongeschiktheidsfonds en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Arbeidsongeschiktheidsfonds dat op grond van
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.

      4 De vermogensbestanddelen die deel uitmaken van de Arbeidsongeschiktheidskas en op grond van
      het eerste lid overgaan, gaan deel uitmaken van de Arbeidsongeschiktheidskas die op grond van
      [artikel 73 van de Wet op de arbeidsongeschiktheidsverzekering][ref3] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.

      5 De vermogensbestanddelen die deel uitmaken van het Arbeidsongeschiktheidsfonds zelfstandigen en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Arbeidsongeschiktheidsfonds zelfstandigen dat op grond van
      [artikel 78 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.

      6 De vermogensbestanddelen die deel uitmaken van het Arbeidsongeschiktheidsfonds jonggehandicapten en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Arbeidsongeschiktheidsfonds jonggehandicapten dat op grond van
      [artikel 63 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.

      7 De vermogensbestanddelen die deel uitmaken van het Reïntegratiefonds en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Reïntegratiefonds dat op grond van
      [artikel 41 van de Wet op de (re)integratie arbeidsgehandicapten][ref6] door het Uitvoeringsinstituut
      werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.

      8 De vermogensbestanddelen die deel uitmaken van een wachtgeldfonds en op grond van het eerste lid overgaan,
      gaan deel uitmaken van het wachtgeldfonds dat voor het desbetreffende onderdeel van het bedrijfs- en beroepsleven
      op grond van [artikel 102 van de Werkloosheidswet][ref7] door het Uitvoeringsinstituut werknemersverzekeringen
      afzonderlijk wordt beheerd en geadministreerd.

      9 De vermogensbestanddelen die deel uitmaken van het Uitvoeringsfonds voor de overheid en op grond van
      het eerste lid overgaan, gaan deel uitmaken van het Uitvoeringsfonds voor de overheid dat op grond van
      [artikel 104 van de Werkloosheidswet][ref8] door het Uitvoeringsinstituut werknemersverzekeringen afzonderlijk
      wordt beheerd en geadministreerd.

      10 De vermogensbestanddelen die deel uitmaken van het Toeslagenfonds en op grond van het eerste lid overgaan,
      gaan deel uitmaken van het Toeslagenfonds dat op grond van [artikel 31 van de Toeslagenwet][ref9] door het
      Uitvoeringsinstituut werknemersverzekeringen afzonderlijk wordt beheerd en geadministreerd.


