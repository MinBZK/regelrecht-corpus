      1 Onze Minister is bevoegd in plaats van de tijdstippen, genoemd in
      [hoofdstuk 8 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], andere tijdstippen vast te stellen
      alsmede te bepalen dat anderszins wordt afgeweken van de bij of krachtens dat hoofdstuk gegeven regels dan wel
      dat de toepassing daarvan achterwege blijft, voorzover dat in verband met de datum van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] noodzakelijk is.

      2 Onze Minister is bevoegd, voorzover dat in verband met de datum van inwerkingtreding van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] noodzakelijk is, regels te stellen met betrekking tot
      de bevoegdheid van de Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank tot het aangaan van verplichtingen en het doen van uitgaven
      en de daaraan ten grondslag te leggen budgetten, begrotingen en jaarplannen.

      3 Onze Minister is overigens bevoegd met het oog op een goede invoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref4] regels te stellen, waarbij zo nodig kan worden
      afgeweken van het bepaalde bij en krachtens genoemde wet en deze wet.

      4 Bij ministeriële regeling kan worden bepaald dat kosten in verband met de intrekking van de
      [Arbeidsvoorzieningswet 1996][ref5] ten laste van het Rijk worden vergoed.


