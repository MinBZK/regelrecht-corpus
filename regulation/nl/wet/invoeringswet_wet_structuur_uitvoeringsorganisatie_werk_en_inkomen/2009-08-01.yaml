  - number: '41'
    text: |-
      1 Er is een ontslagcommissie, die tot taak heeft voornemens van de Centrale organisatie werk en inkomen tot
      opzegging van de arbeidsovereenkomsten, bedoeld in [artikel 40][ref1] te toetsen, alvorens toestemming voor de
      voorgenomen opzegging te verlenen.

      2 Bij de toetsing ingevolge het eerste lid neemt de ontslagcommissie de door Onze Minister krachtens
      [artikel 6, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] gestelde regels in acht.

      3 De ontslagcommissie bestaat uit drie leden, die door Onze Minister worden benoemd. Eén lid wordt benoemd
      op voordracht van de Centrale organisatie werk en inkomen, één lid op voordracht van de organisaties die
      representatief zijn voor de bij de Centrale organisatie werk en inkomen werkzame werknemers en één lid, tevens
      voorzitter, op gezamenlijke voordracht van de Centrale organisatie werk en inkomen en genoemde organisaties.

      4 Onze Minister benoemt voor ieder van de leden een plaatsvervanger. De tweede volzin van het derde lid is daarbij
      van overeenkomstige toepassing.

      5 De benoeming van de leden en plaatsvervangende leden geschiedt voor de tijd van ten hoogste vier jaren. De
      aftredende leden en plaatsvervangende leden zijn terstond herbenoembaar.

      6 Aan een lid of plaatsvervangend lid wordt door Onze Minister tussentijds ontslag verleend:

      a. bij verlies van de hoedanigheid of beëindiging van de functie in verband waarmee de benoeming heeft
      plaatsgevonden;

      b. op eigen verzoek.

      7 De ontslagcommissie regelt, met inachtneming van de regels bedoeld in het tweede lid, zelf haar werkwijze.

      8 De Centrale organisatie werk en inkomen regelt de aanwezigheidsvergoeding van de voorzitter alsmede de vergoeding
      voor reis- en verblijfkosten van de leden en plaatsvervangende leden. Het voorziet tevens in het secretariaat van
      de ontslagcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel6
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel41
