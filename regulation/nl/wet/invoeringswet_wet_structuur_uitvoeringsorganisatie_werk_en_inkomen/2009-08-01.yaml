      1 De [Arbeidsvoorzieningswet 1996][ref1] en de [Invoeringswet Arbeidsvoorzieningswet 1996][ref2] worden
      ingetrokken.

      2 Voor de verschillende artikelen of onderdelen van de artikelen van de [Arbeidsvoorzieningswet 1996][ref3] en de
      [Invoeringswet Arbeidsvoorzieningswet 1996][ref4] kan bij koninklijk besluit het tijdstip waarop deze vervallen
      verschillend worden vastgesteld.

      3 Bij ministeriële regeling kunnen regels worden gesteld voor de gevolgen van de toepassing van het tweede lid,
      waarbij zo nodig kan worden afgeweken van dit hoofdstuk.


