      werknemersverzekeringen op grond van de [artikelen 97l][ref2] en [97n van de Werkloosheidswet][ref3].

      2 De ministeriële regeling waarbij het bedrijfs- en beroepsleven wordt ingedeeld op grond van artikel 51,
