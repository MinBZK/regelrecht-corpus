        artikel: '1'
  - number: '35'
    text: |-
      1 De regelingen van het Centraal Bestuur voor de Arbeidsvoorziening op grond van [artikel 75][ref1],
      onderscheidenlijk [artikel 77, tweede volzin, van de Arbeidsvoorzieningswet 1996][ref2] gelden met ingang van
      de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] als regelingen
      van de Centrale organisatie werk en inkomen op grond van [artikel 25, derde lid][ref4], onderscheidenlijk
      [artikel 25, tweede lid, tweede volzin, van die wet][ref5].

      2 Een termijn als bedoeld in [artikel 75 van de Arbeidsvoorzieningswet 1996][ref6] die is aangevangen voor de datum
      van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref7], wordt voor de toepassing
      van [artikel 25, vierde lid, onderdeel b, van laatstgenoemde wet][ref8] van het tijdstip van aanvang af aangemerkt
      als termijn als bedoeld in laatstgenoemde bepaling.


