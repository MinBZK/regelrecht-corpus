        bwb_id: BWBR0013060
        artikel: '1'
  - number: '131'
    text: |-
      De volgende wetten worden ingetrokken:

      a. Invaliditeitswet;

      b. Liquidatiewet Ouderdomswet 1919;

      c. Liquidatiewet invaliditeitswetten;

      d. Wet uitkering 1987 aan echte minima;

      e. Wet uitkering-ineens personen met werkloosheidsuitkering;

      f. Wet eenmalige toelage 1990.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel131
  - number: '132'
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Indien het bij koninklijke boodschap van 2 maart 2000 ingediende voorstel van een [Tijdelijke referendumwet][ref1]
      (Kamerstukken II 1999/2000, 27 034) tot wet wordt verheven en in werking treedt, en deze wet wordt bekrachtigd
      op of na het tijdstip van inwerkingtreding van de [Tijdelijke referendumwet][ref2], kan bij de toepassing van het
      eerste lid worden afgeweken van de [artikelen 12][ref3] en [13 van de Tijdelijke referendumwet][ref4] en vindt in
      dat geval [artikel 16 van laatstgenoemde wet][ref5] toepassing.


