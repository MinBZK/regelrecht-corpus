  - number: '2'
    text: |-
      1 De Organisatiewet sociale verzekeringen 1997 en de Invoeringswet Organisatiewet sociale verzekeringen 1997 worden
      ingetrokken.

      2 Voor de verschillende artikelen of onderdelen van de artikelen van de Organisatiewet sociale verzekeringen 1997
      en de Invoeringswet Organisatiewet sociale verzekeringen 1997 kan bij koninklijk besluit het tijdstip waarop deze
      vervallen verschillend worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel2
  - number: '3'
    text: |-
      1 De Sociale Verzekeringsbank, genoemd in artikel 17 van Organisatiewet sociale verzekeringen
      1997, zoals deze luidde op de datum vóór het tijdstip van inwerkingtreding van deze
      wet, wordt als rechtspersoon gehandhaafd en is de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      2 De artikelen 18, 19, eerste, derde en vierde lid, 20, 22, 23 en 24 van de Organisatiewet sociale verzekeringen
      1997 en de op grond daarvan gestelde regels, zoals deze luidden op de datum vóór het tijdstip van inwerkingtreding
      van deze wet, blijven tot 1 januari 2003 van toepassing, met dien verstande dat de periode van benoeming van leden
      en plaatsvervangende leden van het bestuur zich niet langer dan tot 1 januari 2003 kan uitstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
