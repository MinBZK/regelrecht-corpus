  - number: '42'
    text: |-
      1 De commissie die is ingesteld op grond van [artikel 43 van de Arbeidsvoorzieningswet 1996][ref1] wordt
      gehandhaafd en geldt met ingang van de datum van inwerkingtreding van de [artikelen 40][ref2] en [41][ref3] als
      commissie, bedoeld in [artikel 41][ref4], en behandelt de voor die datum bij eerstgenoemde commissie ingediende
      verzoeken om toestemming van een voorgenomen opzegging van een arbeidsovereenkomst.

      2 De [artikelen 40][ref5] en [41][ref6] zijn van toepassing totdat in een collectieve arbeidsovereenkomst een
      regeling betreffende toestemming van een voorgenomen opzegging van een arbeidsovereenkomst van het personeel van de
      Centrale organisatie werk en inkomen is opgenomen.

      3 Indien twee jaar na inwerkingtreding van de [artikelen 40][ref7] en [41][ref8] de in het tweede lid bedoelde
      collectieve arbeidsovereenkomst niet tot stand is gekomen dan wel in die collectieve arbeidsovereenkomst een
      dergelijke regeling niet is opgenomen, vervallen genoemde artikelen en wordt aan de zittende leden ontslag
      verleend.

      4 Verzoeken om toestemming van een voorgenomen opzegging van een arbeidsovereenkomst waaromtrent op de dag waarop
      de [artikelen 40][ref9] en [41][ref10] overeenkomstig het derde lid vervallen door de in die artikelen bedoelde
      ontslagcommissie nog niet is beslist, worden met inachtneming van het daaromtrent in die artikelen bepaalde
      afgehandeld, doch uiterlijk binnen zes maanden na die dag.

      5 De ontslagcommissie blijft in stand voor zolang dat in verband met de toepassing van het vierde lid noodzakelijk
      is.

      6 Uiterlijk met ingang van de dag, gelegen zes maanden na de datum bedoeld in het derde lid, wordt aan de leden en
      de plaatsvervangende leden van de ontslagcommissie ontslag verleend.


