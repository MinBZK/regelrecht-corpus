  - number: '129'
    text: |-
      Een rechtshandeling die door een uitvoeringsinstelling, een houdstermaatschappij als bedoeld in § 4 van
      het Besluit voorwaarden erkenning uitvoeringsinstelling, een stichting die de aandelen hield in zulk een
      houdstermaatschappij, of een stichting als bedoeld in § 3 van dat besluit, zoals dat besluit luidde tot 1
      november 2000, is verricht na 23 november 1999 en voor de datum van inwerkingtreding van deze wet, en waarvan deze
      wist of redelijkerwijze behoorde te weten dat daaruit voor een uitvoeringsinstelling, een fonds als bedoeld in
      [artikel 1, onderdeel l, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de stichting, bedoeld
      in artikel 5, eerste lid, van het Besluit voorwaarden erkenning uitvoeringsinstelling, het Uitvoeringsinstituut
      werknemersverzekeringen of de Staat schade voortvloeit, is vernietigbaar. De rechter kan de gevolgen van een
      vernietiging beperken voorzover dat nodig is ter bescherming van rechten van derden te goeder trouw.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel1
    url: https://wetten.overheid.nl/BWBR0013061/2009-08-01#Artikel129
    references:
