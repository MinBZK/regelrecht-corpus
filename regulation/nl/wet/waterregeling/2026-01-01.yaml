  - number: 7.15.1
    text: |-
      De analyses worden uitgevoerd in het representatieve monster, dat is verkregen op de in dit hoofdstuk vermelde
      wijze. Het onderzoek wordt in het water als zodanig uitgevoerd, dus zonder dat daaruit bezinkbare of opdrijvende
      bestanddelen zijn verwijderd.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.15
  - number: 7.15.2
    text: De analyse van het monster geschiedt op de wijze, zoals is aangegeven in tabel B.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.15
  - number: 7.15.3
    text: |-
      De in tabel B vermelde aantoonbaarheidsgrenzen zijn de concentraties van de desbetreffende stoffen die bij de
      analyse ten minste aangetoond worden.
