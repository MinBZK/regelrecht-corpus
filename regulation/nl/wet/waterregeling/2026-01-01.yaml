           1De aantoonbaarheidsgrenzen voor zware metalen zijn gebaseerd op een afvalwatermonster met een soortelijke
      geleiding tot 1.500 μS/cm en bij onopgeloste stoffen tot een gehalte van 100 mg/l. Bij afvalwatermonsters met
      een matrix die groter is dan genoemde waarden voor elektrisch geleidingsvermogen en onopgeloste stoffen kan
      een hogere aantoonbaarheidsgrens gelden. 2Indien een concentratie gerapporteerd wordt als zijnde kleiner dan de
      aantoonbaarheidsgrens, wordt voor de aanslag van de verontreinigingsheffing een concentratie van de helft van de
      aantoonbaarheidsgrens aangehouden. 3Voor het bepalen van de som totaal gebonden stikstof verminderd met nitriet-
      en nitraatstikstof (TN-TON) mag de analyse alleen volgens normblad NEN 6645:2005 nl plaatsvinden als TN groter is
      dan 10mb N/L en voor meer dan 30% bestaat uit TON. 4De analyse volgens normblad NEN-ISO 15705:2003 en is toepasbaar
      voor onverdunde monsters met een gehalte aan zuurstofverbruik tot aan 1.000 mg/l en chlorideconcentratie die
      lager zijn dan 1.000 mg/l. De heffingsambtenaar kan de methode niet toepasbaar verklaren als naar zijn oordeel
      andere omstandigheden daartoe aanleiding geven. 5De analyse volgens normblad NEN-ISO 15705:2003 en heeft een
      aantoonbaarheidsgrens van 6 mg/l voor fotometrische detectie bij 600nm en 15 mg/l voor titrimetrische detectie
      (gebaseerd op één enkelvoudige meting van één laboratorium) wanneer cuvetten worden gebruikt met een bereik van
      maximaal 1.000 mg/l.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.15
  - number: 7.15.4
    text: |-
      De in dit artikel genoemde internationale normbladen worden bekendgemaakt door terinzagelegging bij het Nederlands
      Normalisatie Instituut te Delft en bij Rijkswaterstaat te Rotterdam. De nationale normbladen zijn kosteloos in te
      zien op de website van het Nederlands Normalisatie Instituut.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.15
  - number: 7.16.1
    text: |-
      Voor het bepalen van de verhouding in het kalenderjaar tussen het chemisch zuurstofverbruik en het gehalte
      totaal organisch koolstof beslist de heffingsambtenaar op een aanvraag van een heffingplichtige als bedoeld in
      [artikel 7.5, vierde lid, van de Waterwet][ref1] bij voor bezwaar vatbare beschikking en geeft daarin in ieder
      geval voorschriften met betrekking tot de:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 7.16.1.a
    text: afvalwaterstromen en de stoffen die in het vergelijkend onderzoek worden betrokken;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.1.b
    text: |-
      tijdvakken waarin meting en bemonstering geschieden, hetzij ieder etmaal van die tijdvakken, hetzij één of meer
      daartoe aangewezen etmalen daarvan;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.1.c
    text: |-
      wijze waarop de op de voet van onderdeel b verkregen uitkomsten worden herleid tot de verhouding tussen het
      chemisch zuurstofverbruik en het gehalte totaal organisch koolstof over het heffingsjaar.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.2
    text: |-
      Een afwijkende verhouding tussen het chemisch zuurstofverbruik en het gehalte totaal organisch koolstof in de
      geloosde stoffen als bedoeld in [artikel 7.5, vierde lid, van de Waterwet][ref1] geldt tot het heffingsjaar waarin
      een nieuwe verhouding wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 7.16.3
    text: |-
      Veranderingen in de bedrijfsomstandigheden, die aanleiding kunnen geven tot een wijziging in de verhouding tussen
      het chemisch zuurstofverbruik en het gehalte totaal organisch koolstof in de geloosde stoffen in het kalenderjaar,
      worden door de heffingplichtige onverwijld gemeld aan de heffingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.4
    text: |-
      Indien op grond van [artikel 7.5, tweede lid, van de Waterwet][ref1] door de heffingsambtenaar is ingestemd met
      meting, bemonstering en analyse in een beperkt aantal etmalen, wordt de voor deze etmalen vastgestelde verhouding
      tussen het chemisch zuurstofverbruik en het gehalte totaal organisch koolstof representatief geacht voor elk
      kalenderjaar in de door de heffingsambtenaar bepaalde looptijd van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 7.16.5
    text: |-
      [Artikel 7.2][ref1] is van overeenkomstige toepassing bij een afwijkende verhouding tussen het chemisch
      zuurstofverbruik en het gehalte totaal organisch koolstof in de geloosde stoffen, met dien verstande dat in
      artikel 7.2, derde lid, voor ‘het zuurstofverbruik, zoals berekend volgens het tweede lid’ wordt gelezen: het
      zuurstofverbruik zoals berekend volgens de formule:






                    Q × (X × ((TOC-DOC) + (DOC × f)) + 4,57 × (TN – TON))





                    1000





           Waarbij: 'Q: afvalwaterhoeveelheid (m3/d) X: de afwijkende verhouding TOC: totaal organisch koolstof (mg/l) TN:'
      totaal gebonden stikstof (mg/l) TON: totaal oxideerbare stikstof (mg/l) = (NO+NO) NO: nitriet stikstof (mg/l) NO:
      nitraat stikstof (mg/l)


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0026845
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.16.6
    text: |-
      De heffingsambtenaar beslist op aanvraag van de heffingplichtige, die aannemelijk maakt dat daardoor de uitkomsten
      van de meting, bemonstering en analyse voor het bepalen van de verhouding in het kalenderjaar tussen het chemisch
      zuurstofverbruik en het gehalte totaal organisch koolstof niet wordt beïnvloed, dat van één of meer van de in deze
      regeling opgenomen voorschriften kan worden afgeweken en kan daaromtrent nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.7
    text: 'De beslissing van de heffingsambtenaar op een aanvraag als bedoeld in het zesde lid bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.7.a
    text: de voorschriften van deze regeling waarvan mag worden afgeweken;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.7.b
    text: de toegestane afwijkingen van de in deze regeling opgenomen voorschriften;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: 7.16.7.c
    text: nadere voorschriften van de heffingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.16
  - number: '8.2'
    text: |-
      Deze regeling treedt in werking met ingang van 22 december 2009 met uitzondering van
      [artikel 6.18, tweede, derde en vierde lid][ref1], dat in werking treedt met ingang van 10 oktober 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel6
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0026845
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: '8.3'
    text: 'Deze regeling wordt aangehaald als: Waterregeling.'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel8.3
