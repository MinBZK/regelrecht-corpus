  text: |-
    Gelet op artikel 7.5, eerste en vierde lid, van de Waterwet en de artikelen 2.3, tweede lid, 3.1, eerste en tweede
    lid, 3.3, 3.4, derde en zevende lid, 4.13, 4.18, 6.2, 6.7, eerste lid, 6.11, eerste en derde lid, 6.12, tweede lid,
    onderdeel f, en derde lid, 6.13, tweede lid, 6.15, tweede en derde lid, 6.16, tweede lid, 6.17, 6.19, 6.21, eerste
    lid, 6.22, derde lid, en 6.23, eerste lid, van het Waterbesluit;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#ArtikelAanhef
articles:
  - number: '7.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *aantoonbaarheidsgrens:* laagste concentratie van de component in het
      monster waarvan de aanwezigheid nog met een bepaalde betrouwbaarheid kan worden vastgesteld;
        - *debiet:* hoeveelheid geloosd afvalwater gedurende het etmaal; momentaan debiet: hoeveelheid geloosd afvalwater
      gedurende een moment van meting; etmaal: aaneengesloten periode van 24 uur waarover een etmaalverzamelmonster wordt
      samengesteld;
        - *kalibreren:* bepalen van de waarde van de afwijkingen ten opzichte van een van toepassing zijnde standaard;
        - *droog kalibreren:* kalibreren van een debietmeter waarbij een doorstroming van een hoeveelheid water door de
      debietmeter wordt gesimuleerd;
        - *nat kalibreren:* kalibreren van een debietmeter waarbij daadwerkelijk een nauwkeurig bekende hoeveelheid
      vloeistof door de debietmeter wordt geleid;
        - *gesloten meetsysteem:* meetsysteem dat het debiet meet in een gesloten leiding of in een gesloten drukleiding,
      waarbij het afvalwater niet in contact staat met de buitenlucht;
        - *open meetsysteem:* meetsysteem waarbij het oppervlak van het stromende afvalwater in contact staat met de
      buitenlucht.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Het aantal vervuilingseenheden met betrekking tot het zuurstofverbruik, VeO, wordt berekend door de som van
      het aantal gedurende elk etmaal van het heffingsjaar afgevoerde hoeveelheden zuurstofverbruik, uitgedrukt in
      kilogrammen, te delen door 54,8 kilogram.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      De gedurende een etmaal geloosde hoeveelheid zuurstofverbruik, uitgedrukt in kilogrammen, wordt berekend volgens
      de formule:






                    (Q × (3 × TOC + 4,57 × (TN – TON))


                    [kg/etm]




                    1000




           waarbij: 'Q: afvalwaterhoeveelheid (m3/d) TOC: totaal organisch koolstof (mg/l) TN: totaal gebonden stikstof'
      (mg/l) TON: totaal oxideerbare stikstof (mg/l) = (NO+NO) NO: nitriet stikstof (mg/l) NO: nitraat stikstof (mg/l)
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.3
    text: |-
      Indien het zuurstofverbruik, zoals berekend volgens het tweede lid, voor tenminste 25% afkomstig is van biologisch
      niet of nagenoeg niet afbreekbare stoffen in het afvalwater, wordt op die waarde een correctie toegepast door
      deze te vermenigvuldigen met de correctiefactor f: waarbij: f = correctiefactor T = het percentage van het
      zuurstofverbruik, zoals berekend volgens het tweede lid, dat afkomstig is van biologisch niet of nagenoeg niet
      afbreekbare stoffen. T wordt berekend bij:
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.3.a
    text: |-
      het lozen in een oppervlaktewaterlichaam van zuurstofbindende stoffen, vanuit een inrichting, in gebruik bij een
      provincie, een gemeente, een waterschap of een ander openbaar lichaam of het brengen van zuurstofbindende stoffen
      met biochemisch zuurstofverbruik van niet meer dan 20 mg/l vanuit een bedrijfsruimte met behulp van de methode van
      het biochemisch zuurstofverbruik na vijf dagen, volgens de in [artikel 7.15][ref1] vermelde analysevoorschriften,
      in mg/l;


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0026845
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.3.b
    text: |-
      het lozen in een oppervlaktewaterlichaam van zuurstofbindende stoffen in andere dan de onder a bedoelde gevallen
      met behulp van een andere toereikende bepalingsmethode.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.4
    text: |-
      Voor het bepalen van de correctie, bedoeld in het derde lid, wordt door de heffingplichtige een aanvraag ingediend.
      De aanvraag bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.4.a
    text: een omschrijving van de afvalwaterstromen waarvoor de correctie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.4.b
    text: de wijze en frequentie van meten, bemonsteren en analyseren;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.4.c
    text: het type, aantal en te volgen methodieken van de uit te voeren toxiciteitstesten en biodegradatieonderzoeken.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: 7.2.5
    text: |-
      De heffingsambtenaar beslist op de aanvraag, bedoeld in het vierde lid, bij voor bezwaar vatbare beschikking
      waaraan voorschriften kunnen worden verbonden. Daarbij kan het in ieder geval gaan om voorschriften over de
      frequentie van meten, bemonsteren en analyseren.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.2
  - number: '7.4'
    text: |-
      Voor de berekening van de frequentie van meting, bemonstering en analyse, bedoeld in
      [artikel 7.5, eerste en tweede lid, van de Waterwet][ref1] wordt gebruik gemaakt van de volgende formule: waarbij:
      n = het berekende aantal meetdagen tso = toelaatbare statische onnauwkeurigheid = 35/e ^0,000175*VeO, waarbij
      VeO = vervuilingswaarde met betrekking tot het zuurstofverbruik in een jaar van de in de oppervlaktelichamen
      geloosde stoffen. N = het aantal dagen per jaar dat stoffen in oppervlaktewaterlichamen worden geloosd; σ
      = spreidingspercentage in de meetwaarden, uitgedrukt ten opzichte van het gemiddelde van de hoeveelheden
      zuurstofverbruik van de geloosde stoffen in de etmalen waarop gedurende het heffingsjaar onderzoek heeft
      plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 7.5.1
    text: |-
      De meting, bemonstering en analyse, bedoeld in [artikel 7.5, eerste lid, van de Waterwet][ref1] geschiedt zodanig
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 7.5.1.a
    text: de gemeten hoeveelheid afvalwater niet meer dan 5% afwijkt van de werkelijke hoeveelheid afvalwater;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.1.b
    text: |-
      het verkregen monster representatief is voor de totale hoeveelheid afvalstoffen die gedurende de
      bemonsteringsperiode in oppervlaktewaterlichamen wordt geloosd;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.1.c
    text: |-
      de in deze regeling opgenomen voorschriften of de door de heffingsambtenaar gestelde voorschriften in acht genomen
      worden.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.2
    text: 'De heffingsambtenaar:'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.2.a
    text: |-
      kan, voor zover noodzakelijk ter voldoening aan het bepaalde in het eerste lid, onderdelen a en b, ambtshalve
      bepalen dat debietmeting en bemonstering geschieden in afwijking van één of meer van de in deze regeling opgenomen
      voorschriften en kan daaromtrent nadere voorschriften geven;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.2.b
    text: |-
      beslist op aanvraag van de heffingplichtige, die aannemelijk maakt dat daardoor voldaan wordt aan het bepaalde in
      het eerste lid, onderdelen a en b, en de uitkomsten van de analyse daardoor niet worden beïnvloed, dat van één of
      meer van de in deze regeling opgenomen voorschriften kan worden afgeweken en kan daaromtrent nadere voorschriften
      geven.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.3
    text: 'De beslissing van de heffingsambtenaar, bedoeld in het tweede lid, onderdeel a, bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.3.a
    text: de voorschriften uit deze regeling waarvan wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.3.b
    text: de voorgeschreven afwijkingen van de in deze regeling opgenomen voorschriften;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.3.c
    text: nadere voorschriften van de heffingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.4
    text: |-
      De beslissing van de heffingsambtenaar op een aanvraag als bedoeld in het tweede lid, onderdeel b, bevat in elk
      geval:
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.4.a
    text: de voorschriften van deze regeling waarvan mag worden afgeweken;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.4.b
    text: de toegestane afwijkingen van de in deze regeling opgenomen voorschriften;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.4.c
    text: nadere voorschriften van de heffingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.5
    text: |-
      De heffingsambtenaar kan twee of meer van de op basis van het tweede lid genomen besluiten, die betrekking hebben
      op hetzelfde bedrijf of hetzelfde bedrijfsonderdeel, in één geschrift verenigen.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.6
    text: 'In zijn besluit geeft de heffingsambtenaar in ieder geval voorschriften met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.6.a
    text: de afvalwaterstromen en de stoffen waarop het besluit betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.6.b
    text: |-
      het aantal in het heffingsjaar gelegen, daartoe aangewezen tijdvakken waarin meting, bemonstering en analyse
      dienen te geschieden, hetzij ieder etmaal van dat aantal tijdvakken, hetzij een of meer daartoe aangewezen etmalen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.6.c
    text: |-
      de wijze waarop de op de voet van de onderdelen a en b verkregen uitkomsten worden herleid tot het aantal
      vervuilingseenheden over een aldaar bedoeld tijdvak, onderscheidenlijk over het heffingsjaar;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.6.d
    text: het heffingsjaar of de heffingsjaren, ten aanzien waarvan dat besluit van toepassing is.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.7
    text: |-
      De heffingsambtenaar kan bij veranderingen of te verwachten veranderingen in de hoeveelheid of hoedanigheid van de
      stoffen, die vanuit een bedrijf of een bedrijfsonderdeel in oppervlaktewaterlichamen worden geloosd:
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.7.a
    text: |-
      de besluiten, bedoeld in het tweede en zesde lid, wijzigen of intrekken, in verband met het bepaalde in het eerste
      lid;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
  - number: 7.5.7.b
    text: |-
      het besluit, bedoeld in het tweede en zesde lid, wijzigen indien toepassing van het berekeningsvoorschrift uit
      [artikel 7.4][ref1] leidt tot een ander aantal etmalen, bedoeld het zesde lid, onderdeel b, dan in dat besluit
      is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel7
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0026845
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.6.1
    text: 'De debietmeet- en bemonsteringsvoorzieningen:'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.6
  - number: 7.6.1.a
    text: verkeren in een goede staat;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.6
  - number: 7.6.1.b
    text: zijn overeenkomstig de voorschriften van de leverancier geïnstalleerd en onderhouden;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.6
  - number: 7.6.1.c
    text: worden regelmatig schoongemaakt, en
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.6
  - number: 7.6.1.d
    text: zijn altijd veilig toegankelijk.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.6
  - number: 7.6.2
    text: De bemonsteringsvoorzieningen zijn ondergebracht in een afsluitbare ruimte of kast.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.6
  - number: 7.6.3
    text: |-
      De heffingplichtige brengt de wijze van debietmeting en bemonstering met een beschrijving van de daarvoor te
      gebruiken apparatuur, voor aanvang van het heffingsjaar, ter kennis aan de heffingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.6
  - number: 7.7.1
    text: Het debiet wordt in de afvalwaterstroom gemeten.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.7
  - number: 7.7.2
    text: |-
      In afwijking van het eerste lid kan het debiet worden bepaald op basis van meting van de hoeveelheid water in het
      watertoevoersysteem van het bedrijf of van de bedrijfsonderdelen. De per etmaal geloosde hoeveelheid afvalwater is
      niet groter dan de in dezelfde periode toegevoerde hoeveelheid water.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.7
  - number: 7.8.1
    text: Bij open meetsystemen wordt een meetput of een meetgoot toegepast.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.8.2
    text: 'Bij toepassing van een meetput geldt dat:'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.8.2.a
    text: |-
      momentane debieten in het etmaal, gemeten bij overstorthoogten van minder dan 0,05 meter, gesommeerd minder
      bedragen dan 5% van het gemeten debiet;
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.8.2.b
    text: |-
      momentane debieten in het etmaal, gemeten bij overstorthoogten van minder dan 0,125 meter, gesommeerd minder
      bedragen dan 10% van het gemeten debiet.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.8.3
    text: |-
      Bij toepassing van een meetgoot bedragen de momentane debieten in het etmaal, van minder dan 16,4% van het maximaal
      mogelijk momentane debiet, gesommeerd, minder dan 10% van het gemeten debiet.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.8.4
    text: |-
      De apparatuur voor de hoogtemeting wordt ten minste éénmaal per jaar bij overstorthoogten van 5, 10, 15, 20 en 25
      centimeter droog gekalibreerd.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.8.5
    text: |-
      In het kalibratierapport wordt voor elke overstorthoogte een vergelijking gemaakt tussen de gemeten hoeveelheid
      afvalwater gedurende de periode van het kalibreren, en de bij de desbetreffende overstorthoogte met behulp van de
      afvoerrelatie van de meetvoorziening berekende hoeveelheid afvalwater over de periode van het kalibreren. Zowel het
      absolute als het procentuele verschil wordt hierbij aangegeven.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.8.6
    text: |-
      Bij ultrasone hoogtemeting wordt ook de temperatuurmeting en de temperatuurcorrectie gecontroleerd en gecorrigeerd
      bij afwijking.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.8
  - number: 7.9.1
    text: |-
      De momentane debieten in het etmaal, van minder dan 10% van het maximaal mogelijk momentaan debiet, bedragen
      gesommeerd minder dan 5% van het gemeten debiet.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.9.2
    text: Meetapparatuur voor debietmetingen in gesloten meetsystemen wordt ten minste éénmaal per jaar droog gekalibreerd.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.9.3
    text: 'Het droog kalibreren bestaat minimaal uit:'
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.9.3.a
    text: |-
      het controleren van de meetversterker en het registeren en corrigeren van afwijkingen waarbij de meetversterker
      wordt gecontroleerd op lineariteit, versterkingsfactor en nulpuntsinstelling, en
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.9.3.b
    text: |-
      het uitbouwen van de flowmeter en het controleren van de binnenkant van de meetbuis op vervuiling waarbij de in de
      meetbuis aanwezige vervuiling wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.9.4
    text: |-
      De meetapparatuur wordt ten minste éénmaal voor 1 januari 2014 nat gekalibreerd in ingebouwde toestand en daarna
      ten minste éénmaal per vijf jaar.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.9.5
    text: |-
      Voor debietmeters in mobiele meetapparatuur vindt de natte kalibratie in ingebouwde toestand plaats op een door het
      Nederlands Meetinstituut of een daarmee vergelijkbare instelling gecertificeerde installatie.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.9.6
    text: Van een debietmeter wordt het meest recente kalibratierapport overgelegd.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.9
  - number: 7.10.1
    text: De bemonstering vindt plaats met behulp van automatische monstername-apparatuur.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.10
  - number: 7.10.2
    text: |-
      Het bemonsteringsinterval wordt zodanig ingesteld dat een etmaalverzamelmonster wordt verkregen dat bestaat uit ten
      minste 100 deelmonsters.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.10
  - number: 7.10.3
    text: |-
      Het volume per deelmonster wordt zodanig ingesteld dat de herhaalbaarheid maximaal 5% van het ingestelde volume
      bedraagt. Bij vacuümmonstername-apparatuur bedraagt het volume per deelmonster minimaal 50 milliliter. Bij ‘in-
      line’-bemonstering bedraagt het volume per deelmonster minimaal 20 milliliter en wordt een etmaalverzamelmonster
      verkregen dat bestaat uit ten minste 250 deelmonsters.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.10
  - number: 7.10.4
    text: Het monsterverzamelvat heeft een zodanige inhoud dat het vat gedurende het etmaal niet overloopt.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.10
  - number: 7.10.5
    text: |-
      Zowel het monsterverzamelvat als andere onderdelen van de monstername-apparatuur die met het afvalwater in
      aanraking komen, zijn gemaakt van gemakkelijk te reinigen, inert materiaal, dat de uit te voeren analyse niet
      beïnvloedt. Het monsterverzamelvat kan gemakkelijk uitgenomen worden en is uitgevoerd als emmer of als vat met
      een wijde hals zodat met een monsterschep gemakkelijk kan worden geroerd en geschept. Tijdens het etmaal is het
      monsterverzamelvat afgesloten met een goed afsluitende deksel.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.10
  - number: 7.11.1
    text: |-
      Het aanzuigpunt van een open meetsysteem bevindt zich zo dicht mogelijk stroomafwaarts van de obstructie. Op het
      aanzuigpunt stroomt het afvalwater turbulent.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.11
  - number: 7.11.2
    text: |-
      Bij gebruik van vacuümmonstername-apparatuur is de aanzuigleiding zo kort mogelijk en onder afschot gelegd. De
      aanzuigleiding is beschermd tegen bevriezing en direct zonlicht. In de aanzuigleiding bevinden zich geen knikken of
      overbodige bochten. Het aanzuigpunt bevindt zich onder het vloeistofoppervlak.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.11
  - number: 7.11.3
    text: |-
      De diameter van alle doorstroomde delen van de monstername-apparatuur van het aanzuigpunt tot het punt waar
      het monster wordt afgeleverd in het monsterverzamelvat bedraagt minimaal 13 millimeter. Bij gebruik van
      vacuümmonstername-apparatuur bedraagt de gemiddelde aanzuigsnelheid minimaal 0,3 meter per seconde.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.11
  - number: 7.11.4
    text: Bij het afvoeren van het deelmonster naar het monsterverzamelvat wordt voorkomen dat het monster wordt belucht.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.11
  - number: 7.12.1
    text: |-
      Bij bemonstering met behulp van ‘in-line’-monstername-apparatuur bevindt het bemonsteringspunt zich niet in een
      bocht of een vernauwing in de leiding. Indien het te bemonsteren afvalwater wordt geloosd met behulp van een pomp
      dan bevindt het bemonsteringspunt zich aan de perszijde van deze pomp.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.12
  - number: 7.12.2
    text: |-
      Als een gesloten meetsysteem wordt gecombineerd met vacuümmonstername-apparatuur bevindt het aanzuigpunt zich
      op het punt waar de gesloten leiding uitmondt in een open afvoersysteem of er is vanuit de gesloten leiding een
      aftakking gemaakt, uitmondend in een doorstroomd buffervat waaruit wordt bemonsterd. De stroomsnelheid van het
      afvalwater in de aftakking is in dat geval ten minste gelijk aan die in de hoofdleiding.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.12
  - number: 7.13.1
    text: |-
      De deelmonsters in het monsterverzamelvat worden bewaard bij een temperatuur hoger dan 0°C en lager dan of gelijk
      aan 4°C.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.13
  - number: 7.13.2
    text: |-
      Bemonsteringsbenodigdheden die in aanraking komen met het afvalwater zijn gemaakt van eenvoudig te reinigen inert
      materiaal dat de later uit te voeren analyses niet beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.13
  - number: 7.13.3
    text: De monsters uit het etmaalverzamelmonster zijn binnen een uur na afloop van het etmaal genomen.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.13
  - number: 7.13.4
    text: |-
      De monsters worden met een voldoende grote monsterschep genomen. De gehele inhoud van het monsterverzamelvat wordt
      elke keer, voordat geschept wordt, zodanig geroerd dat al het eventueel bezonken materiaal wordt opgemengd. Daarbij
      wordt de monsterlepel afwisselend links- en rechtsom geroerd.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.13
  - number: 7.13.5
    text: |-
      De monsterflessen bestemd voor analyse door de heffingplichtige en voor contra-analyse vanwege de heffingsambtenaar
      moeten om en om gevuld worden.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.13
  - number: 7.14.1
    text: |-
      De monsters uit het etmaalverzamelmonster worden tot en met het einde van de bewaartermijn geconserveerd op de
      wijze zoals is aangegeven in tabel A. Als een monster uit het etmaalverzamelmonster wordt ingevroren of chemisch
      geconserveerd geschiedt dit binnen 12 uur na afloop van het etmaal. De eventuele voorschriften met betrekking tot
      chemische conservering gelden in aanvulling op de voorschriften met betrekking tot de conserveringstemperatuur
      gedurende de bewaartermijn.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.14
  - number: 7.14.2
    text: |-
      De voorbehandeling van het monster ten behoeve van de analyse, waaronder ondermeer wordt begrepen het ontdooien
      van bevroren monsters, wordt zodanig uitgevoerd dat daardoor de representativiteit van het monster niet wordt
      verstoord.
    url: https://wetten.overheid.nl/BWBR0026845/2026-01-01#Artikel7.14
  - number: 7.14.3
    text: |-
      Een monster dat op één van de in tabel A aangegeven wijzen chemisch is geconserveerd wordt niet gebruikt voor één
      van de in tabel A opgenomen wijzen van analyse, waarvoor op basis van tabel A geen of andere voorschriften op het
      vlak van de chemische conservering gelden.
