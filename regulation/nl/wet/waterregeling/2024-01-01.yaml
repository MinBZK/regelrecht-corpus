  - number: '7.15'
    text: |-
      1 De analyses worden uitgevoerd in het representatieve monster, dat is verkregen op de in dit hoofdstuk vermelde
      wijze. Het onderzoek wordt in het water als zodanig uitgevoerd, dus zonder dat daaruit bezinkbare of opdrijvende
      bestanddelen zijn verwijderd.

      2 De analyse van het monster geschiedt op de wijze, zoals is aangegeven in tabel B.

      3 De in tabel B vermelde aantoonbaarheidsgrenzen zijn de concentraties van de desbetreffende stoffen die bij de
