  - number: '7.6'
    text: |-
      1 De debietmeet- en bemonsteringsvoorzieningen:

      a. verkeren in een goede staat;

      b. zijn overeenkomstig de voorschriften van de leverancier geïnstalleerd en onderhouden;

      c. worden regelmatig schoongemaakt, en

      d. zijn altijd veilig toegankelijk.

      2 De bemonsteringsvoorzieningen zijn ondergebracht in een afsluitbare ruimte of kast.

      3 De heffingplichtige brengt de wijze van debietmeting en bemonstering met een beschrijving van de daarvoor te
      gebruiken apparatuur, voor aanvang van het heffingsjaar, ter kennis aan de heffingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.6
  - number: '7.7'
    text: |-
      1 Het debiet wordt in de afvalwaterstroom gemeten.

      2 In afwijking van het eerste lid kan het debiet worden bepaald op basis van meting van de hoeveelheid water in het
      watertoevoersysteem van het bedrijf of van de bedrijfsonderdelen. De per etmaal afgevoerde hoeveelheid afvalwater
      is niet groter dan de in dezelfde periode toegevoerde hoeveelheid water.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.7
  - number: '7.8'
    text: |-
      1 Bij open meetsystemen wordt een meetput of een meetgoot toegepast.

      2 Bij toepassing van een meetput geldt dat:

      a. momentane debieten in het etmaal, gemeten bij overstorthoogten van minder dan 0,05 meter, gesommeerd minder
      bedragen dan 5% van het gemeten debiet;

      b. momentane debieten in het etmaal, gemeten bij overstorthoogten van minder dan 0,125 meter, gesommeerd minder
      bedragen dan 10% van het gemeten debiet.

      3 Bij toepassing van een meetgoot bedragen de momentane debieten in het etmaal, van minder dan 16,4% van het
      maximaal mogelijk momentane debiet, gesommeerd, minder dan 10% van het gemeten debiet.

      4 De apparatuur voor de hoogtemeting wordt ten minste éénmaal per jaar bij overstorthoogten van 5, 10, 15, 20 en 25
      centimeter droog gekalibreerd.

      5 In het kalibratierapport wordt voor elke overstorthoogte een vergelijking gemaakt tussen de gemeten hoeveelheid
      afvalwater gedurende de periode van het kalibreren, en de bij de desbetreffende overstorthoogte met behulp van de
      afvoerrelatie van de meetvoorziening berekende hoeveelheid afvalwater over de periode van het kalibreren. Zowel het
      absolute als het procentuele verschil wordt hierbij aangegeven.

      6 Bij ultrasone hoogtemeting wordt ook de temperatuurmeting en de temperatuurcorrectie gecontroleerd en
      gecorrigeerd bij afwijking.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.8
  - number: '7.9'
    text: |-
      1 De momentane debieten in het etmaal, van minder dan 10% van het maximaal mogelijk momentaan debiet, bedragen
      gesommeerd minder dan 5% van het gemeten debiet.

      2 Meetapparatuur voor debietmetingen in gesloten meetsystemen wordt ten minste éénmaal per jaar droog gekalibreerd.

      3 Het droog kalibreren bestaat minimaal uit:

      a. het controleren van de meetversterker en het registeren en corrigeren van afwijkingen waarbij de meetversterker
      wordt gecontroleerd op lineariteit, versterkingsfactor en nulpuntsinstelling, en

      b. het uitbouwen van de flowmeter en het controleren van de binnenkant van de meetbuis op vervuiling waarbij de in
      de meetbuis aanwezige vervuiling wordt daarbij verwijderd.

      4 De meetapparatuur wordt ten minste éénmaal voor 1 januari 2014 nat gekalibreerd in ingebouwde toestand en daarna
      ten minste éénmaal per vijf jaar.

      5 Voor debietmeters in mobiele meetapparatuur vindt de natte kalibratie in ingebouwde toestand plaats op een door
      het Nederlands Meetinstituut of een daarmee vergelijkbare instelling gecertificeerde installatie.

      6 Van een debietmeter wordt het meest recente kalibratierapport overgelegd.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.9
  - number: '7.10'
    text: |-
      1 De bemonstering vindt plaats met behulp van automatische monstername-apparatuur.

      2 Het bemonsteringsinterval wordt zodanig ingesteld dat een etmaalverzamelmonster wordt verkregen dat bestaat uit
      ten minste 100 deelmonsters.

      3 Het volume per deelmonster wordt zodanig ingesteld dat de herhaalbaarheid maximaal 5% van het ingestelde volume
      bedraagt. Bij vacuümmonstername-apparatuur bedraagt het volume per deelmonster minimaal 50 milliliter. Bij ‘in-
      line’-bemonstering bedraagt het volume per deelmonster minimaal 20 milliliter en wordt een etmaalverzamelmonster
      verkregen dat bestaat uit ten minste 250 deelmonsters.

      4 Het monsterverzamelvat heeft een zodanige inhoud dat het vat gedurende het etmaal niet overloopt.

      5 Zowel het monsterverzamelvat als andere onderdelen van de monstername-apparatuur die met het afvalwater in
      aanraking komen, zijn gemaakt van gemakkelijk te reinigen, inert materiaal, dat de uit te voeren analyse niet
      beïnvloedt. Het monsterverzamelvat kan gemakkelijk uitgenomen worden en is uitgevoerd als emmer of als vat met
      een wijde hals zodat met een monsterschep gemakkelijk kan worden geroerd en geschept. Tijdens het etmaal is het
      monsterverzamelvat afgesloten met een goed afsluitende deksel.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.10
  - number: '7.11'
    text: |-
      1 Het aanzuigpunt van een open meetsysteem bevindt zich zo dicht mogelijk stroomafwaarts van de obstructie. Op het
      aanzuigpunt stroomt het afvalwater turbulent.

      2 Bij gebruik van vacuümmonstername-apparatuur is de aanzuigleiding zo kort mogelijk en onder afschot gelegd. De
      aanzuigleiding is beschermd tegen bevriezing en direct zonlicht. In de aanzuigleiding bevinden zich geen knikken of
      overbodige bochten. Het aanzuigpunt bevindt zich onder het vloeistofoppervlak.

      3 De diameter van alle doorstroomde delen van de monstername-apparatuur van het aanzuigpunt tot het punt
      waar het monster wordt afgeleverd in het monsterverzamelvat bedraagt minimaal 13 millimeter. Bij gebruik van
      vacuümmonstername-apparatuur bedraagt de gemiddelde aanzuigsnelheid minimaal 0,3 meter per seconde.

      4 Bij het afvoeren van het deelmonster naar het monsterverzamelvat wordt voorkomen dat het monster wordt belucht.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.11
  - number: '7.12'
    text: |-
      1 Bij bemonstering met behulp van ‘in-line’-monstername-apparatuur bevindt het bemonsteringspunt zich niet in een
      bocht of een vernauwing in de leiding. Indien het te bemonsteren afvalwater wordt afgevoerd met behulp van een pomp
      dan bevindt het bemonsteringspunt zich aan de perszijde van deze pomp.

      2 Als een gesloten meetsysteem wordt gecombineerd met vacuümmonstername-apparatuur bevindt het aanzuigpunt zich
      op het punt waar de gesloten leiding uitmondt in een open afvoersysteem of er is vanuit de gesloten leiding een
      aftakking gemaakt, uitmondend in een doorstroomd buffervat waaruit wordt bemonsterd. De stroomsnelheid van het
      afvalwater in de aftakking is in dat geval ten minste gelijk aan die in de hoofdleiding.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.12
  - number: '7.13'
    text: |-
      1 De deelmonsters in het monsterverzamelvat worden bewaard bij een temperatuur hoger dan 0°C en lager dan of gelijk
      aan 4°C.

      2 Bemonsteringsbenodigdheden die in aanraking komen met het afvalwater zijn gemaakt van eenvoudig te reinigen inert
      materiaal dat de later uit te voeren analyses niet beïnvloedt.

      3 De monsters uit het etmaalverzamelmonster zijn binnen een uur na afloop van het etmaal genomen.

      4 De monsters worden met een voldoende grote monsterschep genomen. De gehele inhoud van het monsterverzamelvat
      wordt elke keer, voordat geschept wordt, zodanig geroerd dat al het eventueel bezonken materiaal wordt opgemengd.
      Daarbij wordt de monsterlepel afwisselend links- en rechtsom geroerd.

      5 De monsterflessen bestemd voor analyse door de heffingplichtige en voor contra-analyse vanwege de
      heffingsambtenaar moeten om en om gevuld worden.
    url: https://wetten.overheid.nl/BWBR0026845/2024-01-01#Artikel7.13
  - number: '7.14'
    text: |-
      1 De monsters uit het etmaalverzamelmonster worden tot en met het einde van de bewaartermijn geconserveerd op de
      wijze zoals is aangegeven in tabel A. Als een monster uit het etmaalverzamelmonster wordt ingevroren of chemisch
      geconserveerd geschiedt dit binnen 12 uur na afloop van het etmaal. De eventuele voorschriften met betrekking tot
      chemische conservering gelden in aanvulling op de voorschriften met betrekking tot de conserveringstemperatuur
      gedurende de bewaartermijn.

      2 De voorbehandeling van het monster ten behoeve van de analyse, waaronder ondermeer wordt begrepen het ontdooien
      van bevroren monsters, wordt zodanig uitgevoerd dat daardoor de representativiteit van het monster niet wordt
      verstoord.

      3 Een monster dat op één van de in tabel A aangegeven wijzen chemisch is geconserveerd wordt niet gebruikt voor één
      van de in tabel A opgenomen wijzen van analyse, waarvoor op basis van tabel A geen of andere voorschriften op het
      vlak van de chemische conservering gelden.


