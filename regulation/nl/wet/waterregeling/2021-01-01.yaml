  - number: '3.5'
    text: |-
      1 De volgende onderdelen van en de inliggende kunstwerken binnen het oppervlaktewaterlichaam Waddenzee op
      Terschelling zijn niet in beheer bij het Rijk:

      a. de voormalige rijkshaven bij West-Terschelling, inclusief de keermuur langs de Willem Barentszkade, de
      glooiingen Dellewal en Groene Strand, de Westhavendam, hoofd P, de Oosthavendam, de kaden, de loskade Dellewal, het
      opslagterrein, de houten steigers en de Plaat, het openbare deel van het veerhaventerrein en de hiervoor niet met
      name genoemde dammen;

      b. de binnen de gemeente Terschelling gelegen zeven strandovergangen met bijbehorende werken en voorzieningen en
      het parkeerterrein bij de strandovergang paal 18 (Oosterend).

      2 De damwand en aanleginrichtingen van de veerdam op Schiermonnikoog en de terreingedeelten, die bij de
      veermaatschappij in pacht zijn, met uitzondering van het weglichaam op de veerdam en de verhardingen en taluds
      daarvan, maken onderdeel uit van het oppervlaktewaterlichaam Waddenzee en zijn in beheer bij het Rijk.

      3 De volgende onderdelen van en de inliggende kunstwerken binnen het oppervlaktewaterlichaam Waddenzee te Harlingen
      zijn niet in beheer bij het Rijk:

      a. de voormalige rijkshavenwerken te Harlingen, bestaande uit de Voorhaven, de Willemshaven en de Nieuwe
      Willemshaven;

      b. de tot deze havens behorende kunstwerken, te weten de havendammen, wegen, kaden, waterkering, steigers en
      kompaspaal en alle overige tot de haven behorende werken, met uitzondering van het kantonniersverblijf nabij de
      visafslag, de aanleginrichting voor de veerdiensten van Harlingen naar Terschelling en Vlieland, de aanlegsteiger
      aan de Zuiderhavendam en de drijvende steiger in de vluchthaven met de daarbij behorende opstal.

      4 De volgende onderdelen van en de inliggende kunstwerken binnen het oppervlaktewaterlichaam Waddenzee te Ameland
      zijn niet in beheer bij het Rijk:

      a. het openbare deel van de veerdam bij Nes Ameland;

      b. de losstoep in de Ballumerbocht;

      c. het fietspad door de duinen lopend vanaf de zuidzijde van het Hollumerbos tot de Oerderduinen;

      d. de binnen de gemeente Ameland gelegen 36 strandovergangen, met bijbehorende werken en voorzieningen.

      5 De volgende onderdelen van en de inliggende kunstwerken binnen het oppervlaktewaterlichaam Waddenzee te Vlieland
      zijn niet in beheer bij het Rijk:

      a. de voormalige rijkswerkhaven, inclusief de havendijk met coupure, de kaden aan de noord-, oost-, zuidoost-
      en zuidwestzijde van de haven, het haventerrein, het noordelijk en zuidelijk havenhoofd en de remmingwerken en
      steigers langs de beide havenhoofden;

      b. de Waddenglooiing Oosterveld met voorliggende dammen;

      c. de Waddenglooiing Westerveld met voorliggende dammen.
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      In afwijking van [artikel 3.2][ref1], is de begrenzing van het beheergebied van het Rijk voor
      waterkwaliteitsbeheer, waterkwantiteitsbeheer en waterstaatkundig beheer in het oppervlaktewaterlichaam Grensmaas
      gelijk aan de landsgrens tussen Nederland en België.


