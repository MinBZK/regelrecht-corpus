      1 Het is verboden om zonder vergunning van de minister als bedoeld in [artikel 6.5 van de wet][ref1] meer dan 5000
      m3 water per uur te brengen in, of meer dan 100 m3 water per uur te onttrekken aan een oppervlaktewaterlichaam in
      beheer bij het Rijk, indien:

      a. de instroomsnelheid meer bedraagt dan 0,3 m/s, of

      b. de handeling plaatsvindt in samenhang met een activiteit waarvoor op grond van [artikel 6.2 van de wet][ref2]
      een vergunning is vereist.

      2 Het eerste lid is niet van toepassing op:

      a. baggerwerkzaamheden en het toepassen van baggerspecie in een oppervlaktewaterlichaam;

      b. handelingen die door of vanwege de beheerder worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.5'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6.2'
  - number: '6.17'
    text: |-
      1 Degene die water brengt in of onttrekt aan oppervlaktewaterlichamen in beheer bij het Rijk, waarvoor geen
      vergunning is vereist krachtens [artikel 6.16][ref1], meldt dit schriftelijk ten minste vier weken voor de
      uitvoering aan de minister indien op de voorgenomen wijze meer dan 5000 m3 water per uur wordt ingebracht of meer
      dan 100 m3 water per uur wordt onttrokken.

      2 Bij de melding worden de volgende gegevens verstrekt:

      a. de naam, het adres, het telefoonnummer en het e-mailadres van degene die voornemens is het water te brengen in
      of te onttrekken aan oppervlaktewaterlichamen in beheer bij het Rijk;

      b. het tijdstip waarop met het inbrengen of onttrekken van water wordt begonnen en de duur daarvan;

      c. het doel, de in- of uitstroomsnelheid en omvang van het inbrengen of het onttrekken van water, en

      d. een situatietekening met een schaal van ten minste 1:10.000 waarop de plaats en ligging van het inbrengen of het
      onttrekken van water is aangegeven en die is voorzien van een noordpijl.

      3 Ten aanzien van het brengen dan wel onttrekken van water, bedoeld in het eerste lid, kan de minister
      maatwerkvoorschriften stellen ten aanzien van de locatie en de periode, mits deze er niet toe leiden dat het
      brengen of onttrekken van water geen doorgang kan vinden.

      4 Het eerste tot en met derde lid zijn niet van toepassing op:

      a. baggerwerkzaamheden en het toepassen van baggerspecie in een oppervlaktewaterlichaam;

      b. handelingen die door of vanwege de beheerder worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel6.16
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0026845
        artikel: '6.16'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '6.18'
    text: |-
      1 Indien een aanvraag voor een watervergunning niet langs elektronische weg wordt ingediend, wordt gebruik
      gemaakt van een door Onze Minister vastgesteld formulier dat wordt gepubliceerd op en kan worden gedownload van
      www.omgevingsloket.nl. Het bevoegd gezag stelt op verzoek van de aanvrager het formulier aan hem ter beschikking.

      2 Een aanvraag voor een watervergunning langs elektronische wijze wordt gedaan met gebruikmaking van het
      elektronische formulier dat op de datum van indiening van de aanvraag beschikbaar is via de landelijke voorziening,
      bedoeld in artikel 7.6 van de Wet algemene bepalingen omgevingsrecht.

      3 Het bevoegd gezag is verantwoordelijk voor het beheer van de gegevens die zijn opgenomen in het deel van de
      landelijke voorziening dat hem ter beschikking staat. Dit beheer omvat in elk geval de verlening en beperking van
      toegang tot de gegevens omtrent een aanvraag en de zorg voor de archiefbescheiden.

      4 Ten aanzien van de verwerking van persoonsgegevens in de landelijke voorziening is het bevoegd gezag
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.18
  - number: '6.19'
    text: |-
      In de aanvraag voor een watervergunning wordt vermeld:

      a. de naam, het adres, de woonplaats en het telefoonnummer van de aanvrager, alsmede het e-mailadres van de
      aanvrager, indien de aanvraag met een elektronisch formulier wordt ingediend;

      b. de geografische aanduiding van de locatie waar de handeling wordt verricht, met behulp van:

      1°. een situatietekening,

      2°. een kaart met een functionele schaal die is voorzien van een noordpijl en waarop de ligging van de locatie ten
      opzichte van de omgeving is aangegeven,

      3°. foto’s, of

      4°. andere geschikte middelen;

      c. een omschrijving van de aard, de omvang, de reden en het doel van de voorgenomen handeling;

      d. een beschrijving van de aard en omvang van de gevolgen van de handeling, voor zover die gevolgen relevant zijn
      voor de beoordeling van de aanvraag;

      e. de periode waarvoor vergunning wordt gevraagd;

      f. indien de handeling wordt uitgevoerd door een ander dan de aanvrager: zijn naam, adres, woonplaats en
      telefoonnummer, alsmede zijn e-mailadres;

      g. indien de aanvraag wordt ingediend door een gemachtigde: zijn naam, adres, woonplaats en telefoonnummer, alsmede
      het e-mailadres van de gemachtigde indien de aanvraag met een elektronisch formulier wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.19
  - number: '6.20'
    text: |-
      1 Gegevens en bescheiden die langs elektronische weg bij de aanvraag worden verstrekt, worden aangeleverd in een
      van de volgende archiefwaardige bestandsformaten:

      a. foto’s: PNG en JPG;

      b. scans: TIFF, JPG, PDF/A-1a, PDF/A-1b en PDF 1.4;

      c. officedocumenten: PDF/A-1a en PDF 1.4;

      d. tekeningen: PDF/X en PDF 1.4.

      2 Indien de bestanden langs elektronische weg worden aangeleverd, worden deze uitsluitend als ‘read-only’ (alleen
      lezen) gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.20
  - number: '6.21'
    text: |-
      In de aanvraag voor een vergunning als bedoeld in [artikel 6.2 van de wet][ref1] worden, onverminderd het bepaalde
      in [artikel 6.19][ref2], de volgende gegevens verstrekt:

      a. een omschrijving van de lozing, waarbij in ieder geval worden vermeld de zuurgraad (pH), temperatuur en debiet
      en wordt vermeld of de lozing continu dan wel discontinu plaatsvindt, met welke regelmaat lozingen of deellozingen
      plaatsvinden, de wijze waarop de lozing plaatsvindt en de activiteiten waaruit de lozing voortkomt;

      b. een karakterisering naar aard, samenstelling, eigenschappen, hoeveelheid en herkomst van de stoffen;

      c. een beschrijving van de maatregelen of voorzieningen die zijn of worden getroffen om de lozing te voorkomen of
      te beperken, met toelichtende tekening, alsmede de maatregelen die voor dat doel worden getroffen bij definitieve
      stopzetting van de activiteiten;

      d. een omschrijving van de aard en omvang van de bedrijfsactiviteiten;

      e. een processchema van de opzet en een beschrijving van de capaciteit van elke installatie waarin processen
      plaatsvinden die leiden of kunnen leiden tot het in een oppervlaktewaterlichaam brengen van stoffen, waarbij wordt
      aangegeven welke van die stoffen waar en in welke mate vrijkomen;

      f. een rioleringstekening;

      g. een beschrijving van de aard, de samenstelling, de eigenschappen, de hoeveelheid en de locatie binnen het
      bedrijf van de grondstoffen, hulpstoffen, tussenproducten en eindproducten die naar redelijke verwachting binnen
      het bedrijf aanwezig kunnen zijn, voor zover deze in een oppervlaktewaterlichaam kunnen geraken;

      h. een beschrijving van de maatregelen of voorzieningen betreffende het voorkomen of beperken van lozing van
      afvalstoffen door het hergebruiken of nuttig toepassen dan wel het geschikt maken voor hergebruik of nuttige
      toepassing van zodanige afvalstoffen;

      i. een opgave van de redelijkerwijs mogelijk te achten hoeveelheid en hoedanigheid van de stoffen die ten gevolge
      van een ongewoon voorval in een oppervlaktewaterlichaam kunnen geraken, alsmede een beschrijving van de maatregelen
      om dit zoveel mogelijk te voorkomen dan wel te beperken;

      j. een beschrijving van de wijze waarop de lozing wordt vastgesteld en geregistreerd en de wijze waarop over de
      lozing wordt gerapporteerd;

      k. een opgave van de voor de aanvrager redelijkerwijs te verwachten ontwikkelingen met betrekking tot de lozing die
      voor de beslissing op de aanvraag van belang kunnen zijn, en

      l. een niet-technische samenvatting van de in dit artikel bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0026845#Artikel6.19
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.21
    references:
