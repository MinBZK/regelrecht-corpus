        bwb_id: BWBR0025458
        artikel: '6.3'
      - id: ref2
        bwb_id: BWBR0026845
        artikel: '6.19'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: '6.24'
    text: |-
      In de aanvraag voor een vergunning als bedoeld in de [artikelen 6.5, onderdeel c, van de wet][ref1] voor het
      gebruik maken van een waterstaatswerk of een daartoe behorende beschermingszone worden, onverminderd het bepaalde
      in [artikel 6.19][ref2], de volgende gegevens verstrekt:

      a. een omschrijving van de voorgenomen handeling, waarbij wordt vermeld op welke wijze gebruik zal worden gemaakt
      van het waterstaatswerk of de daartoe behorende beschermingszone;

      b. een toelichtende tekening met het ontwerp en de afmetingen van het werk, of het tracé van de kabel of de
      leiding;

      c. een boorplan in het geval een waterstaatswerk wordt gekruist door een HDD-boring, en

      d. een stabiliteitsberekening van de kade of waterkering.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0026845#Artikel6.19
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.5'
      - id: ref2
        bwb_id: BWBR0026845
        artikel: '6.19'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: '6.25'
    text: |-
      Indien een aanvraag als bedoeld in [artikel 6.24][ref1] betrekking heeft op werkzaamheden waarbij een waterbodem
      geheel of gedeeltelijk wordt verwijderd, worden naast de in dat artikel bedoelde gegevens, de volgende gegevens
      verstrekt:

      a. een opgave van de hoeveelheid te verwijderen materiaal, en

      b. een aanduiding van het totaal te baggeren oppervlak in m2.


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel6.24
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0026845
        artikel: '6.24'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: '6.26'
    text: |-
      Indien een aanvraag als bedoeld in [artikel 6.24][ref1] betrekking heeft op het gebruik maken van een
      waterstaatswerk in de Nederlandse exclusieve economische zone, worden de volgende gegevens verstrekt:

      a. een beschrijving van de gevolgen voor rechtmatig gebruik van de zee door derden, en

      b. een oprichtings- en inrichtingsplan, waarin wordt ingegaan op het onderhoud van het werk, veiligheidswaarborgen,
      verlichtingsmaatregelen, maatregelen ter voorkoming en beperking van calamiteiten, en de wijze waarop verwijdering
      van de installatie zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel6.24
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.26
