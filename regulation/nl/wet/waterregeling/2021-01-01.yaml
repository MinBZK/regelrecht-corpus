        artikel: '6.19'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: '7.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *aantoonbaarheidsgrens:* laagste concentratie van de component in het monster waarvan de aanwezigheid nog met een
      bepaalde betrouwbaarheid kan worden vastgesteld;
        - *debiet:* hoeveelheid geloosd afvalwater gedurende het etmaal; momentaan debiet: hoeveelheid geloosd afvalwater
      gedurende een moment van meting; etmaal: aaneengesloten periode van 24 uur waarover een etmaalverzamelmonster wordt
      samengesteld;
        - *kalibreren:* bepalen van de waarde van de afwijkingen ten opzichte van een van toepassing zijnde standaard;
        - *droog kalibreren:* kalibreren van een debietmeter waarbij een doorstroming van een hoeveelheid water door de
      debietmeter wordt gesimuleerd;
        - *nat kalibreren:* kalibreren van een debietmeter waarbij daadwerkelijk een nauwkeurig bekende hoeveelheid
      vloeistof door de debietmeter wordt geleid;
        - *gesloten meetsysteem:* meetsysteem dat het debiet meet in een gesloten leiding of in een gesloten drukleiding,
      waarbij het afvalwater niet in contact staat met de buitenlucht;
        - *open meetsysteem:* meetsysteem waarbij het oppervlak van het stromende afvalwater in contact staat met de
      buitenlucht.
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 Het aantal vervuilingseenheden met betrekking tot het zuurstofverbruik, VeO, wordt berekend door de som van
      het aantal gedurende elk etmaal van het heffingsjaar afgevoerde hoeveelheden zuurstofverbruik, uitgedrukt in
      kilogrammen, te delen door 54,8 kilogram.

      2 De gedurende een etmaal afgevoerde hoeveelheid zuurstofverbruik, uitgedrukt in kilogrammen, wordt berekend
      volgens de formule:

      waarbij:

      Q = het debiet in m3/etmaal;

      CZV = het chemisch zuurstofverbruik bepaald volgens de in [artikel 7.15][ref1] vermelde analysevoorschriften, in
      mg/l;

      N = de som van ammonium-stikstof en organisch gebonden stikstof, bepaald volgens de in artikel 7.15 vermelde
      analysevoorschriften, in mg/l.

      3 Indien de CZV-waarde voor ten minste 25% afkomstig is van biologisch niet of nagenoeg niet afbreekbare stoffen in
      het afvalwater, wordt op die waarde een correctie toegepast door deze te vermenigvuldigen met de breuk

      waarbij:

      T = het percentage CZV, afkomstig van biologisch niet of nagenoeg niet afbreekbare stoffen.

      T wordt berekend bij:

      a. het lozen in een oppervlaktewaterlichaam van zuurstofbindende stoffen, vanuit een inrichting, in gebruik bij
      een provincie, een gemeente, een waterschap of een ander openbaar lichaam of het brengen van zuurstofbindende
      stoffen met biochemisch zuurstofverbruik van niet meer dan 20 mg/l vanuit een bedrijfsruimte als bedoeld in
      [artikel 7.1, eerste lid, van de wet][ref2], met behulp van de methode van het biochemisch zuurstofverbruik na vijf
      dagen, volgens de in [artikel 7.15][ref3] vermelde analysevoorschriften, in mg/l;

      b. het lozen in een oppervlaktewaterlichaam van zuurstofbindende stoffen in andere dan de onder a bedoelde gevallen
      met behulp van een andere toereikende bepalingsmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel7.15
