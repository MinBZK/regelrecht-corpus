  - number: '7.4'
    text: |-
      Voor de berekening van de frequentie van meting, bemonstering en analyse als bedoeld in
      [artikel 7.5, eerste en tweede lid, van de wet][ref1] wordt gebruik gemaakt van de volgende formule:

      waarbij:

      n = het berekende aantal meetdagen

      tso = toelaatbare statische onnauwkeurigheid =

      35/e ^0,000175*VeO, waarbij VeO = vervuilingswaarde met betrekking tot het zuurstofverbruik in een jaar van de in
      de oppervlaktelichamen geloosde stoffen.

      N = het aantal dagen per jaar dat stoffen in oppervlaktewaterlichamen worden geloosd;

      σ = spreidingspercentage in de meetwaarden, uitgedrukt ten opzichte van het gemiddelde van de hoeveelheden
      zuurstofverbruik van de afgevoerde stoffen in de etmalen waarop gedurende het heffingsjaar onderzoek heeft
      plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel7.4
