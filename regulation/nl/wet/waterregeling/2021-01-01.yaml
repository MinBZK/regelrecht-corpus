        artikel: '13'
  - number: '4.2'
    text: |-
      Als organisaties en overlegstructuren als bedoeld in de [artikelen 4.4, tweede lid][ref1], en
      [4.15, tweede lid, van het besluit][ref2] worden aangewezen:

      a. de Internationale Raad voor het Onderzoek van de Zee, bedoeld in de in op 12 september 1964 te Kopenhagen
      totstandgekomen overeenkomst betreffende de Internationale Raad voor het Onderzoek van de Zee (Trb. 1968, 43),

      b. het Overlegorgaan Water en Noordzee, bedoeld in
      [artikel 1, onderdeel a, van het Besluit overleg verkeer en waterstaat 2004][ref3],

      c. het Productschap voor Vis en Visproducten (Productschap Vis), bedoeld in
      [artikel 1, eerste lid, van de Instellingswet Productschap voor Vis en Visproducten][ref4], en

      d. de Regionale adviesraad Noordzee, bedoeld in artikel 2, onderdeel c, van het besluit nr. 2004, 2004/585/
      EG van de Raad van de Europese Unie van 19 juli tot oprichting van regionale adviesraden in het kader van het
      gemeenschappelijk visserijbeleid (PbEU L 256/17).


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel4.15
