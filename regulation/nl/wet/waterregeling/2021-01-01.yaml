      1 Bij de toepassing van de [artikelen 6.16h, tweede en vierde lid][ref1], en
      [6.16i, tweede lid, van het besluit][ref2] worden ten aanzien dan de in die artikelen opgenomen niet-
      publiekrechtelijke regelingen de volgende teksten in acht genomen:

      a. IALA-aanbeveling O-139 (markering van kunstmatige offshore constructies): uitgave 2 van december 2013;

      b. door de Britse luchtvaartautoriteit uitgegeven richtlijn CAP 764 (beleid en richtlijnen voor windturbines):
      uitgave 5 van juni 2013;

      c. NEN 1010: uitgave NEN 1010:2007+C1:2008 – Veiligheidsbepalingen voor laagspanningsinstallaties van oktober 2008,
