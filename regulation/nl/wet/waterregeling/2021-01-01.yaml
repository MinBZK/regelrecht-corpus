  - number: '6.8'
    text: |-
      Het gebruik, bedoeld in [art 6.15, eerste lid, van het besluit][ref1], wordt in ieder geval zodanig uitgevoerd dat:

      a. de tot stand gebrachte werken door de gebruiker in goede staat worden onderhouden;

      b. van calamiteiten of gebreken en andere onvolkomenheden door de gebruiker onmiddellijk mededeling wordt gedaan
      aan de minister;

      c. de gebruiker alle maatregelen treft die, zowel in het belang van een vlotte en veilige verkeersregulering als in
      het belang van de instandhouding van het betreffende oppervlaktewaterlichaam of bijbehorend kunstwerk noodzakelijk
      zijn;

      d. de stabiliteit van oeverconstructies niet in gevaar wordt gebracht;

      e. na beëindiging van tijdelijke activiteiten het gebruikte deel van het oppervlaktewaterlichaam of bijbehorend
      kunstwerk, wanneer dat redelijkerwijs mogelijk is, weer in de oorspronkelijke staat wordt teruggebracht;

      f. tijdens de activiteit of werkzaamheden het oppervlaktewaterlichaam of bijbehorend kunstwerk bereikbaar blijft
      voor de beheerder en voor hulpdiensten;

      g. bestaand gebruik op de desbetreffende locatie redelijkerwijs zo min mogelijk hinder ondervindt, en

      h. het gebruikte materiaal en materieel tijdig wordt verwijderd bij zodanig hoog water dat overstroming of wegslag
      hiervan dreigt.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.15
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6.15'
  - number: '6.9'
    text: |-
      Het gebruik, bedoeld in [art 6.15, eerste lid, van het besluit][ref1], wordt wanneer het vaarwegen betreft
      onverminderd het bepaalde in [artikel 6.8][ref2], zodanig uitgevoerd dat:

      a. de doorvaart van de scheepvaart, zowel in de breedte als in de hoogte, niet wordt belemmerd;

      b. de zichtlijnen voor de scheepvaart niet worden gehinderd;

      c. de zichtlijnen voor de bedienings- en begeleidingsobjecten niet worden gehinderd;

      d. geen hinder voor radar wordt veroorzaakt;

      e. geen hinderlijke uitstraling van verlichting voor het scheepvaartverkeer wordt veroorzaakt;

      f. geen open vuur of vuurwerk boven de vaarweg wordt aangestoken, en

      g. geen werken of onderdelen daarvan, materiaal of materieel uit de damwand steken.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.15
      [ref2]: https://wetten.overheid.nl/BWBR0026845#Artikel6.8
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.9
