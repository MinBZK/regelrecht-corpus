  - number: '6.30'
    text: |-
      In de aanvraag voor een vergunning als bedoeld in [artikel 6.5, aanhef en onderdeel a, van de wet][ref1] voor het
      onttrekken van water aan of het brengen van water in een oppervlaktewaterlichaam worden, onverminderd het bepaalde
      in [artikel 6.19][ref2], de volgende gegevens verstrekt:

      a. een onderbouwing van de noodzaak tot het brengen van water in een oppervlaktewaterlichaam;

      b. een beschrijving en toelichtende tekening van de in- en uitstroomvoorzieningen waaronder een opgave van de
      pompcapaciteit, de afmetingen en de ligging, en

      c. een aanduiding van de maximaal te onttrekken of te lozen waterhoeveelheden in m3 per uur, te onderscheiden naar
      perioden.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0026845#Artikel6.19
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.30
