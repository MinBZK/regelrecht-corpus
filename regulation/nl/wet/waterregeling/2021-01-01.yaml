      2 De resultaten, bedoeld in [artikel 3.4, tweede lid, onderdeel b, van het besluit][ref2], worden uiterlijk op
      22 juni 2013 en vervolgens elke 6 jaar verstrekt.

      3 De gegevens, bedoeld in [artikel 3.4, tweede lid, onderdeel c, van het besluit][ref3], worden uiterlijk op
      22 juni 2012 en vervolgens elke 6 jaar verstrekt.

      4 De website, bedoeld in [artikel 3.4, derde lid, van het besluit][ref4], is het KRW-portaal http://krw.ncqi.nl.

      5 Voor de verstrekking van de gegevens en resultaten, bedoeld in [artikel 3.4, tweede lid, van het besluit][ref5],
