  - number: '6.2'
    text: |-
      Het bevoegd gezag beziet vier jaar nadat een vergunning als bedoeld in [artikel 6.1][ref1] is verleend, en
      vervolgens ten minste elke vier jaar, of die vergunning nog toereikend is, gezien de ontwikkelingen op het gebied
      van de technische mogelijkheden tot bescherming van het milieu en de ontwikkelingen met betrekking tot de kwaliteit
      van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0026845#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.2
