        artikel: '7.5'
  - number: '7.5'
    text: |-
      1 De meting, bemonstering en analyse, bedoeld in [artikel 7.5, eerste lid, van de wet][ref1] geschiedt zodanig dat:

      a. de gemeten hoeveelheid afvalwater niet meer dan 5% afwijkt van de werkelijke hoeveelheid afvalwater;

      b. het verkregen monster representatief is voor de totale hoeveelheid afvalstoffen die gedurende de
      bemonsteringsperiode in oppervlaktewaterlichamen wordt geloosd;

      c. de in deze regeling opgenomen voorschriften of de door de heffingsambtenaar gestelde voorschriften in acht
      genomen worden.

      2 De heffingsambtenaar:

      a. kan, voor zover noodzakelijk ter voldoening aan het bepaalde in het eerste lid, onderdelen a en b, ambtshalve
      bepalen dat debietmeting en bemonstering geschieden in afwijking van één of meer van de in deze regeling opgenomen
      voorschriften en kan daaromtrent nadere voorschriften geven;

      b. beslist op aanvraag van de heffingplichtige, die aannemelijk maakt dat daardoor voldaan wordt aan het bepaalde
      in het eerste lid, onderdelen a en b, en de uitkomsten van de analyse daardoor niet worden beïnvloed, dat van
      één of meer van de in deze regeling opgenomen voorschriften kan worden afgeweken en kan daaromtrent nadere
      voorschriften geven.

      3 De beslissing van de heffingsambtenaar, bedoeld in het tweede lid, onderdeel a, bevat in elk geval:

      a. de voorschriften uit deze regeling waarvan wordt afgeweken;

      b. de voorgeschreven afwijkingen van de in deze regeling opgenomen voorschriften;

      c. nadere voorschriften van de heffingsambtenaar.

      4 De beslissing van de heffingsambtenaar op een aanvraag als bedoeld in het tweede lid, onderdeel b, bevat in elk
      geval:

      a. de voorschriften van deze regeling waarvan mag worden afgeweken;

      b. de toegestane afwijkingen van de in deze regeling opgenomen voorschriften;

      c. nadere voorschriften van de heffingsambtenaar.

      5 De heffingsambtenaar kan twee of meer van de op basis van het tweede lid genomen besluiten, die betrekking hebben
      op hetzelfde bedrijf of hetzelfde bedrijfsonderdeel, in één geschrift verenigen.

      6 In zijn besluit geeft de heffingsambtenaar in ieder geval voorschriften met betrekking tot:

      a. de afvalwaterstromen en de stoffen waarop het besluit betrekking heeft;

      b. het aantal in het heffingsjaar gelegen, daartoe aangewezen tijdvakken waarin meting, bemonstering en analyse
      dienen te geschieden, hetzij ieder etmaal van dat aantal tijdvakken, hetzij een of meer daartoe aangewezen etmalen
      daarvan;

      c. de wijze waarop de op de voet van de onderdelen a en b verkregen uitkomsten worden herleid tot het aantal
      vervuilingseenheden over een aldaar bedoeld tijdvak, onderscheidenlijk over het heffingsjaar;

      d. het heffingsjaar of de heffingsjaren, ten aanzien waarvan dat besluit van toepassing is.

      7 De heffingsambtenaar kan bij veranderingen of te verwachten veranderingen in de hoeveelheid of hoedanigheid van
      de stoffen, die vanuit een bedrijf of een bedrijfsonderdeel in oppervlaktewaterlichamen worden geloosd:

      a. de besluiten, bedoeld in het tweede en zesde lid, wijzigen of intrekken, in verband met het bepaalde in het
      eerste lid;

      b. het besluit, bedoeld in het tweede en zesde lid, wijzigen indien toepassing van het berekeningsvoorschrift uit
      [artikel 7.4][ref2] leidt tot een ander aantal etmalen, bedoeld het zesde lid, onderdeel b, dan in dat besluit
      is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.5
      [ref2]: https://wetten.overheid.nl/BWBR0026845#Artikel7.4
