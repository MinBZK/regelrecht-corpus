  - number: '3.4'
    text: |-
      1 In afwijking van [artikel 3.2][ref1] wordt de grens van het oppervlaktewaterlichaam Noordzee aan de zeezijde
      gevormd door de grenzen van de Nederlandse Exclusieve Economische Zone en de grenzen van de Nederlandse
      territoriale wateren.

      2 In afwijking van [artikel 3.2][ref2] wordt de grens van de oppervlaktewaterlichamen Noordzee en de Waddenzee aan
      de landzijde gevormd door de duinvoet, voor zover zij niet overgaan in andere oppervlaktewaterlichamen in beheer
      bij het Rijk. Indien geen duinvoet aanwezig is, worden de grenzen van deze oppervlaktewaterlichamen gevormd door
      de buitenkruinlijn van de primaire waterkering. Het gebied tussen de duinvoet en de grenzen als aangegeven op de
      kaarten in de [bijlagen II][ref3], [III][ref4] en [IV][ref5] bij deze regeling is in beheer bij het Rijk.

      3 In afwijking van het eerste en tweede lid worden op en rond de Waddeneilanden de grenzen van de
      oppervlaktewaterlichamen Noordzee en Waddenzee gevormd door de op de kaarten in de [bijlagen II][ref6],
      [III][ref7], en [IV][ref8] bij deze regeling opgenomen grenzen.

      4 Het beheer van de Noordzee, de Waddenzee, de Eems en de Dollard in de gebieden die zijn aangewezen op de kaarten
      in de [bijlagen II][ref9], [III][ref10] en [IV][ref11] van deze regeling, berust bij het Rijk voor zover de Staat
      der Nederlanden bevoegdheden heeft op grond van het Eems-Dollard Verdrag.


