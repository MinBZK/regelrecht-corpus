  - number: '6.15'
    text: |-
      1 Ten aanzien van werken of activiteiten waarvoor krachtens [artikel 6.12][ref1], [6.13][ref2] of
      [6.14 van het besluit][ref3] geen vergunning is vereist, kan de minister met het oog op de bescherming van de
      belangen die het gestelde in [artikel 6.15 van het besluit][ref4] en de [artikelen 6.8][ref5] en [6.9][ref6] beoogt
      te waarborgen, maatwerkvoorschriften stellen ten aanzien van:

      a. de locatie;

      b. de diepte van het werk;

      c. de hoogte van het werk;

      d. de periode van uitvoering;

      e. de mogelijkheden van het verplaatsen van het werk in verband met hoogwater, of

      f. de waterdoorlatendheid van het werk in verband met wateropstuwende effecten.

      2 De overeenkomstig het eerste lid te stellen maatwerkvoorschriften leiden er niet toe dat de activiteit of het
      werk grotendeels of in het geheel geen doorgang kan vinden, tenzij die activiteit naar het oordeel van de beheerder
      ontoelaatbaar nadelige gevolgen heeft voor het betrokken waterstaatswerk.

      3 Het eerste lid is niet van toepassing op het uitvoeren van onderhoud dan wel de aanleg of wijziging of overig
      gebruik, anders dan in overeenstemming met de functie, van waterstaatswerken voor zover deze activiteiten door of
      vanwege de beheerder worden verricht.


