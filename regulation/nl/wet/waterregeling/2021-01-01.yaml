  - number: '3.3'
    text: |-
      1 Als drogere oevergebieden als bedoeld in [artikel 3.3, onderdeel b, van het besluit][ref1] worden aangewezen de
      gebieden, die als zodanig zijn begrensd op de kaart in [bijlage II][ref2] bij deze regeling.

      2 Tot de drogere oevergebieden, bedoeld in het eerste lid, behoren niet:

      a. de binnen de in [bijlage II][ref3] bij deze regeling opgenomen begrenzing van drogere oevergebieden vallende
      oppervlaktewaterlichamen;

      b. de kunstwerken die deel uitmaken van die oppervlaktewaterlichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel3.3
