  - number: 3.2a
    text: |-
      Het waterstaatkundig beheer van rijkswateren berust, voor zover deze zijn gelegen binnen de grenzen als aangegeven
      op de kaart in [bijlage IV][ref1] bij deze regeling, bij het in de legenda bij de kaart genoemde niet tot het Rijk
      behorende overheidslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0026845
