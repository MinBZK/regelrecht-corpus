      In deze regeling wordt verstaan onder:

        - *besluit:* [Waterbesluit][ref1];
        - *minister:* minister van Infrastructuur en Milieu;
        - *SPF:* Seasonal Performance Factor, waarmee het rendement van een bodemenergiesysteem wordt weergegeven,
      uitgedrukt als de door het systeem geleverde hoeveelheden warmte en koude per jaar in MWh, gedeeld door het gemeten
      of berekende energieverbruik van het systeem per jaar in MWh.


