  - number: '4.1'
    text: |-
      Een regionaal waterplan omvat mede een overzicht van de toestandsklasse per stof
      en kwaliteitselement van elk waterlichaam waarop het plan betrekking heeft, bepaald
      over de voorgaande planperiode overeenkomstig het monitoringsprogramma, bedoeld in
      [artikel 13, eerste lid, van het Besluit kwaliteitseisen en monitoring water 2009][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027061#Artikel13
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel4.1
