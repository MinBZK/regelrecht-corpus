  - number: '3.2'
    text: |-
      1 Het waterkwaliteitsbeheer van de in [artikel 3.1 van het besluit][ref1] bedoelde oppervlaktewaterlichamen en
      zijwateren daarvan berust bij het Rijk voor zover deze gelegen zijn binnen de grenzen als aangegeven op de kaart in
      [bijlage II][ref2] bij deze regeling.

      2 Het waterkwantiteitsbeheer van de in [artikel 3.1 van het besluit][ref3] bedoelde oppervlaktewaterlichamen en
      zijwateren daarvan berust bij het Rijk voor zover deze zijn gelegen binnen de grenzen als aangegeven op de kaart in
      [bijlage III][ref4] bij deze regeling.

      3 Het waterstaatkundig beheer van de in [artikel 3.1 van het besluit][ref5] bedoelde oppervlaktewaterlichamen en
      zijwateren daarvan berust bij het Rijk voor zover deze zijn gelegen binnen de grenzen als aangegeven op de kaart in
      [bijlage IV][ref6] bij deze regeling.


