  - number: '6.1'
    text: |-
      In een vergunning krachtens [artikel 6.2 van de wet][ref1] wordt bepaald dat de vergunning geldt voor een daarbij
      te bepalen termijn van ten hoogste tien jaar, indien zij wordt afgegeven voor het in een oppervlaktewaterlichaam
      brengen van een of meer stoffen, behorende tot lijst I van bijlage I van [richtlijn 2006/11/EG](32006L0011) van het
      Europees Parlement en de Raad van de Europese Unie van 15 februari 2006 betreffende de verontreiniging veroorzaakt
      door bepaalde gevaarlijke stoffen die in het aquatisch milieu van de Gemeenschap worden geloosd (PbEU L 64),
      waarvoor grenswaarden zijn vastgesteld in:

      a. [richtlijn nr. 82/176/EEG](31982L0176) van de Raad van 22 maart 1982, betreffende grenswaarden en
      kwaliteitsdoelstellingen voor kwiklozingen afkomstig van de sector elektrolyse van alkalichloriden (PbEG L 81);

      b. [richtlijn 83/513/EEG](31983L0513) van de Raad van 26 september 1983 betreffende grenswaarden en
      kwaliteitsdoelstellingen voor lozingen van cadmium (PbEG L 291);

      c. [richtlijn nr. 84/156/EEG](31984L0156) van de Raad van 8 maart 1984, betreffende grenswaarden en
      kwaliteitsdoelstellingen voor kwiklozingen afkomstig van andere sectoren dan de elektrolyse van alkalichloriden
      (PbEG L 74);

      d. [richtlijn nr. 84/491/EEG](31984L0491) van de Raad van 9 oktober 1984 betreffende de grenswaarden en
      kwaliteitsdoelstellingen voor de lozing van hexachloorcyclohexaan (PbEG L 274); of

      e. [richtlijn nr. 86/280/EEG](31986L0280) van de Raad van 12 juni 1986 betreffende grenswaarden en
      kwaliteitsdoelstellingen voor lozingen van bepaalde onder lijst I van de bijlage van [Richtlijn 76/464/EEG]
      (31976L0464) vallende gevaarlijke stoffen (PbEG L 181).


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.1
