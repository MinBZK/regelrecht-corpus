  - number: '3.1'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *waterkwaliteitsbeheer:* uitvoeren en handhaven van bij of krachtens de wet gestelde regels met betrekking tot
      lozen als bedoeld in [artikel 6.1][ref1] of [7.1 van de wet][ref2] of de verontreiniging of aantasting van de bodem
      of oever van een oppervlaktewaterlichaam;
        - *waterkwantiteitsbeheer:* uitvoeren en handhaven van bij of krachtens de [wet][ref3] gestelde regels ten aanzien
      van peilbesluiten of het brengen van water in of het onttrekken van water uit oppervlaktewaterlichamen;
        - *waterstaatkundig beheer:* beheer van oppervlaktewaterlichamen, anders dan waterkwaliteitsbeheer of
      waterkwantiteitsbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.1
      [ref3]: https://wetten.overheid.nl/BWBR0025458
