        artikel: '6.19'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: '6.22'
    text: |-
      Indien de exploitatie van een installatie, van waaruit de lozing waarvoor de vergunning wordt aangevraagd
      plaatsvindt, belangrijke nadelige gevolgen voor het milieu in een andere lidstaat van de Europese Unie kan
      veroorzaken, dan wel indien een andere lidstaat van de Europese Unie die belangrijke nadelige gevolgen voor het
      milieu van de exploitatie van een installatie kan ondervinden daarom verzoekt, verstrekt het bevoegd gezag een
      afschrift van de aanvraag met de daarbij behorende stukken aan de betreffende lidstaat op het tijdstip waarop
      daarvan in Nederland kennis wordt gegeven dan wel op het tijdstip waarop de aanvraag met de daarbij behorende
      stukken in Nederland ter inzage wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.22
  - number: '6.23'
    text: |-
      In de aanvraag voor een vergunning als bedoeld in [artikel 6.3 van de wet][ref1] voor het storten van baggerspecie
      worden, onverminderd het bepaalde in [artikel 6.19][ref2], de volgende gegevens verstrekt:

      a. een omschrijving van de locatie van herkomst en de beoogde verspreidingslocatie;

      b. een karakterisering naar aard, samenstelling, eigenschappen en hoeveelheid van de stoffen;

      c. een omschrijving van het onderzoeksprotocol en de onderzoeksstrategie als bedoeld in NEN 5720.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0026845#Artikel6.19
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.23
