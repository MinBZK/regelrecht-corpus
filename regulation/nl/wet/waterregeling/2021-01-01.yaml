        bwb_id: BWBR0026845
        artikel: '6.24'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: '6.27'
    text: |-
      In de aanvraag voor een vergunning als bedoeld in de [artikelen 6.4, eerste lid][ref1], en
      [6.5, onderdeel b, van de wet][ref2] voor het onttrekken van grondwater worden onverminderd het bepaalde in
      [artikel 6.19][ref3], de volgende gegevens verstrekt:

      a. het doel waarvoor het te onttrekken grondwater wordt gebruikt;

      b. het aantal bestaande en nieuw in te richten putten;

      c. een nadere plaatsaanduiding van de putten ten opzichte van het Rijksdriehoeksnet;

      d. de diepte van de onderkant en de bovenkant van de filters van iedere put ten opzichte van het maaiveld en het
      N.A.P.;

      e. de diameter en de lengte van de filters in iedere put;

      f. de pompcapaciteit in m3 per uur en het te installeren vermogen in m3 per uur per put;

      g. de maximaal te onttrekken hoeveelheden water per uur, per dag, per maand, per kwartaal en per jaar, en

      h. een beschrijving van de maatregelen of voorzieningen die zijn of worden getroffen om de negatieve gevolgen van
      de onttrekking te voorkomen of te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
      [ref3]: https://wetten.overheid.nl/BWBR0026845#Artikel6.19
