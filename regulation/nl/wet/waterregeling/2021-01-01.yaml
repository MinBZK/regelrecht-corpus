  - number: '6.14'
    text: |-
      1 Degene die een werk of een activiteit gaat uitvoeren waarvoor krachtens [artikel 6.12][ref1], [6.13][ref2] of
      [6.14 van het besluit][ref3] geen vergunning is vereist, meldt dit schriftelijk ten minste vier weken voor de
      uitvoering aan de minister.

      2 Bij de melding worden de volgende gegevens verstrekt:

      a. de naam, het adres, het telefoonnummer en het e-mailadres van degene die voornemens is de activiteit of
      werkzaamheden te gaan uitvoeren;

      b. het tijdstip waarop met de activiteit of het werk wordt begonnen en de duur daarvan;

      c. de aard en omvang van de activiteit of het werk, en

      d. een situatietekening met een schaal van ten minste 1:10.000 waarop de plaats en ligging van de activiteit of het
      werk ten opzichte van de omgeving is aangegeven en die voorzien is van een noordpijl.

      3 De minister kan degene die een melding doet verzoeken om nadere informatie te verstrekken over de uit te voeren
      activiteit of het werk, om te kunnen bepalen of maatwerkvoorschriften moeten worden gesteld.

      4 Het eerste lid is niet van toepassing op het uitvoeren van onderhoud dan wel de aanleg of wijziging of overig
      gebruik, anders dan in overeenstemming met de functie, van waterstaatswerken voor zover deze activiteiten door of
      vanwege de beheerder worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.12
      [ref2]: https://wetten.overheid.nl/BWBR0026872#Artikel6.13
      [ref3]: https://wetten.overheid.nl/BWBR0026872#Artikel6.14
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.14
