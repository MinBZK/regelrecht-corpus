      d. NEN-EN-IEC 61936-1: uitgave NEN-EN-IEC 61936-1:2010 – Sterkstroominstallaties met meer dan 1 kV wisselspanning
      – Deel 1: Algemene bepalingen van mei 2014, inclusief correctiebladen C1:2011, C11:2011, C12:2012 en C13:2013 en
      wijzigingsblad A1:2014;

      e. NEN-EN 50522: uitgave NEN-EN 50522:2010 – Aarding van hoogspanningsinstallaties van meer dan 1 kV wisselspanning
      van november 2010;

      f. NEN 3840: uitgave NEN 3840:2011 – Bedrijfsvoering van elektrische installaties – Hoogspanning van mei 2011; en

      g. NEN 3140: uitgave NEN 3140:2011 – Bedrijfsvoering van elektrische installaties – Laagspanning van maart 2011.

