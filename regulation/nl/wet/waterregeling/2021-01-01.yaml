  - number: '6.29'
    text: |-
      1 Indien een aanvraag voor een vergunning betrekking heeft op het onttrekken van grondwater
      of het brengen van water in de bodem ten behoeve van een bodemenergiesysteem als bedoeld in
      [artikel 6.4, onderdeel b, van de wet][ref1], worden onverminderd het bepaalde in de [artikelen 6.27][ref2] en
      [6.28][ref3], de volgende gegevens verstrekt:

      a. de capaciteit van de pomp waarmee het water in de bodem wordt gebracht in m3 per uur;

      b. de maximaal in de bodem te brengen hoeveelheden water per uur, per dag, per maand, per kwartaal en per jaar;

      c. de wijze waarop water in de bodem wordt gebracht;

      d. de samenstelling van het in de bodem te brengen water;

      e. een aanduiding van de hydrologische effecten van het in de bodem brengen van water;

      f. de minimum-, gemiddelde en maximumtemperaturen van het in de bodem te brengen water;

      g. de omvang van de behoefte aan warmte en koude waarin het bodemenergiesysteem voorziet, en

      h. het energierendement, uitgedrukt als de Seasonal Performance Factor (SPF), dat het bodemenergiesysteem zal
      behalen bij voorzien gebruik van het bouwwerk overeenkomstig de bestemming waarvoor het systeem is ontworpen,
      blijkend uit een schriftelijke verklaring van de installateur.

      2 Bij de verstrekking van gegevens als bedoeld in het eerste lid, onderdeel h, over het energierendement dat een
      open bodemenergiesysteem bij de levering van warmte of koude aan een bouwwerk behaalt, wordt het energierendement
      bepaald overeenkomstig de volgende formule:

      waarbij wordt verstaan onder:

      *Q* : de door het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid warmte per jaar in MWh;

      *Q*: de door het bodemenergiesysteem aan het bouwwerk geleverde hoeveelheid koude per jaar in MWh;

      *E*: de door het bodemenergiesysteem verbruikte hoeveelheid elektriciteit per jaar in MWh;

      *G*: de door het bodemenergiesysteem verbruikte hoeveelheid gas per jaar in MWh.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0026845#Artikel6.27
      [ref3]: https://wetten.overheid.nl/BWBR0026845#Artikel6.28
