  - number: 6.3a
    text: |-
      [Artikel 6.10a, eerste lid, van het besluit][ref1] is niet van toepassing op het onttrekken van grondwater ten
      behoeve van:

      a. een bronbemaling of proefbemaling, indien de hoeveelheid te onttrekken grondwater minder bedraagt dan 100 m3 per
      uur en in totaal niet meer bedraagt dan 100.000 m3;

      b. beregening, bevloeiing of veedrenking, indien de hoeveelheid te onttrekken grondwater minder bedraagt dan 60 m3
      per uur;

      c. andere handelingen dan bedoeld onder a of b, indien de hoeveelheid te onttrekken grondwater minder bedraagt dan
      10 m3 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.10a
