    text: |-
      [Artikel 6.12, tweede lid, aanhef en onderdeel a, van het besluit][ref1] is niet van toepassing op kanalen.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.12
    url: https://wetten.overheid.nl/BWBR0026845/2021-01-01#Artikel6.10
