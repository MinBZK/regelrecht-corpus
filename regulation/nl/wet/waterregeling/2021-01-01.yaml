  - number: '6.28'
    text: |-
      In de aanvraag voor een vergunning als bedoeld in de [artikelen 6.4, eerste lid][ref1],
      [6.5, onderdeel b, van de wet][ref2] voor het infiltreren van water worden, onverminderd het bepaalde in
      [artikel 6.19][ref3], de volgende gegevens verstrekt:

      a. het aantal bestaande en nieuw in te richten putten;

      b. een nadere plaatsaanduiding van de putten ten opzichte van het Rijksdriehoeksnet;

      c. de diepte van de onderkant en de bovenkant van de filters van iedere put ten opzichte van het maaiveld en het
      N.A.P.;

      d. de diameter en de lengte van de filters in iedere put;

      e. de pompcapaciteit in m3 per uur;

      f. de maximaal te infiltreren hoeveelheden water per uur, per dag, per maand, per kwartaal en per jaar;

      g. de wijze waarop water wordt geïnfiltreerd;

      h. de herkomst en de samenstelling van het te infiltreren water, en

      i. een beschrijving van de maatregelen of voorzieningen die zijn of worden getroffen om de negatieve gevolgen van
      de infiltratie te voorkomen of te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
