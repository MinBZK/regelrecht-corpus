  - number: '21.2'
    text: De raad van bestuur ziet erop toe dat de besluiten, bedoeld in het eerste lid, worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
  - number: '22'
    text: |-
      De raad van bestuur en de door hem daartoe aangewezen medewerkers van de Stichting zijn bevoegd inlichtingen te
      verlangen van instellingen die zendtijd voor landelijke omroep hebben verkregen, voor zover dat voor de vervulling
      van zijn taak, de taak van de netcoördinatoren daaronder begrepen, redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel22
  - number: '23.1'
    text: De Stichting verstrekt Onze Minister alle inlichtingen met betrekking tot de werkzaamheden van de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister kan inzage verlangen van zakelijke gegevens en bescheiden van de Stichting, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel23
  - number: 23a.1
    text: |-
      De raad van bestuur stelt jaarlijks voor 1 juni een jaarverslag vast over het afgelopen kalenderjaar. In het
      jaarverslag wordt aandacht besteed aan de werkzaamheden van de Stichting, het gevoerde beleid in het algemeen en de
      doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel23a
  - number: 23a.2
    text: De raad van bestuur zendt het verslag aan Onze Minister en stelt het algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel23a
  - number: '24.1'
    text: Wijzigingen in de statuten van de Stichting behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel24
  - number: '24.2'
    text: De raad van bestuur kan niet besluiten tot ontbinding van de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel24
  - number: '25.1'
    text: 'Een educatieve omroepinstelling is een instelling die voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel25
  - number: 25.1.a
    text: zij is een rechtspersoon met volledige rechtsbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel25
  - number: 25.1.b
    text: |-
      zij stelt zich uitsluitend ten doel het verzorgen van een breed en samenhangend educatief programma op het gebied
      van onderwijs, scholing en vorming;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel25
  - number: 25.1.c
    text: |-
      zij heeft blijkens de statuten een bestuur, dat zodanig is samengesteld dat deskundigen uit de kring van
      representatieve landelijke organisaties op het gebied van onderwijs, scholing en vorming daarin zitting hebben; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel25
  - number: 25.1.d
    text: |-
      zij in de statuten een regeling heeft opgenomen die voorziet in de instelling van een programmaraad die het
      programmabeleid bepaalt. De programmaraad heeft een zodanige samenstelling dat deze voorziet in representatieve
      vertegenwoordiging van maatschappelijke en levensbeschouwelijk organisaties op het terrein van onderwijs, scholing
      en vorming.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel25
  - number: '25.2'
    text: De statuten alsmede wijzigingen daarvan behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel25
  - number: '26.1'
    text: |-
      De Stichting Etherreclame verzorgt een programma voor algemene omroep dat bestaat uit reclameboodschappen en
      telewinkelboodschappen die zijn aangeboden door derden, alsmede een omlijsting daarvan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel26
  - number: '26.2'
    text: Het bestuur van de Stichting Etherreclame bestaat uit een voorzitter en vier andere leden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel26
  - number: '26.3'
    text: |-
      De leden van het bestuur worden door Onze Minister benoemd en ontslagen. Drie van de leden worden benoemd op
      voordracht van de Stichting. Onze Minister wijst uit de leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel26
  - number: '26.4'
    text: Onze Minister kan twee waarnemers aanwijzen. Deze waarnemers hebben in het bestuur een raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel26
  - number: '27.1'
    text: |-
      Het bestuur van de Stichting Etherreclame stelt de tarieven vast voor het door haar in haar programma opnemen van
      reclameboodschappen en telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel27
  - number: '27.2'
    text: Een besluit tot vaststelling van de tarieven wordt terstond aan Onze Minister medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel27
  - number: '27.3'
    text: |-
      Binnen één maand na ontvangst van het besluit kan Onze Minister het besluit geheel of ten dele vernietigen. Bij
      dit besluit kan Onze Minister zelf de tarieven vaststellen, dan wel bepalen dat het bestuur van de Stichting
      Etherreclame opnieuw ter zake een besluit neemt met inachtneming van het besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel27
  - number: '27.4'
    text: |-
      Ter zake van het nieuwe besluit van het bestuur van de Stichting Etherreclame zijn het tweede en derde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel27
  - number: '28'
    text: |-
      De inkomsten die de Stichting Etherreclame verwerft stelt zij, na aftrek van haar door Onze Minister goedgekeurde
      uitgaven, ter beschikking van Onze Minister. De afgedragen inkomsten dienen ter bestrijding van de kosten verbonden
      aan:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.a
    text: |-
      de vergoedingen aan instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van
      politieke partijen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.b
    text: de vergoedingen voor regionale omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.c
    text: de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.d
    text: het Europees programma, bedoeld in artikel 16, tweede lid, onderdeel f;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.e
    text: |-
      de uitkering uit de inkomsten van de Stichting Etherreclame ten behoeve van het Bedrijfsfonds voor de pers als
      bedoeld in artikel 128;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.f
    text: |-
      de Raad voor cultuur, voor zover samenhangend met de advisering ten aanzien van radio, televisie, pers en andere
      vormen van massacommunicatie, tot een door Onze Minister te bepalen bedrag;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.g
    text: het Commissariaat voor de Media;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.h
    text: door Onze Minister bekostigd onderzoek in het belang van de massacommunicatie;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.i
    text: uitkeringen door Onze Minister aan het fonds, bedoeld in artikel 170;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.j
    text: vergoedingen aan het Bedrijf ten behoeve van de uitvoering van de taak, bedoeld in artikel 83;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.k
    text: |-
      vergoedingen aan een door Onze Minister aan te wijzen instelling ten behoeve van het in stand houden en exploiteren
      van een omroeparchief;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.l
    text: |-
      vergoedingen aan een door Onze Minister aan te wijzen instelling ten behoeve van het in stand houden en exploiteren
      van omroeporkesten, omroepkoren en een muziekbibliotheek;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28.m
    text: |-
      een door Onze Minister aan te wijzen overlegorgaan van lokale omroepinstellingen en bijdragen aan regionale en
      lokale omroep ten behoeve van minderhedenprogrammering.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28
  - number: 28a.1
    text: |-
      De Stichting Etherreclame doet jaarlijks voor 1 augustus aan Onze Minister een opgave toekomen van de inkomsten
      die zij naar verwachting in het volgende kalenderjaar zal verwerven. Zij doet bovendien jaarlijks voor 1 september
      aan Onze Minister een opgave toekomen van de inkomsten die zij naar verwachting in het lopende kalenderjaar zal
      verwerven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28a
  - number: 28a.2
    text: |-
      Onze Minister zendt zo spoedig mogelijk een afschrift van deze opgaven ter kennisneming aan het Commissariaat voor
      de Media, de Stichting en de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel28a
  - number: '29.1'
    text: Wijzigingen in de statuten van de Stichting Etherreclame behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel29
  - number: '29.2'
    text: Het bestuur van de Stichting Etherreclame kan niet besluiten tot ontbinding van de stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel29
  - number: '30'
    text: 'Een lokale, onderscheidenlijk regionale omroepinstelling, is een instelling die voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30
  - number: 30.a
    text: zij is rechtspersoon met volledige rechtsbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30
  - number: 30.b
    text: |-
      zij stelt zich blijkens haar statuten uitsluitend, althans hoofdzakelijk ten doel, ter uitvoering van de taak
      van de publieke omroep, bedoeld in [artikel 13c][ref1], op lokaal, onderscheidenlijk regionaal niveau een
      programma voor algemene omroep te verzorgen en alle activiteiten met betrekking tot programmaverzorging en
      uitzending te verrichten die daartoe nodig zijn. Het programma is in zodanige mate gericht op de bevrediging
      van de in de gemeente of provincie, of een deel van de provincie waarop de omroepinstelling zich richt, levende
      maatschappelijke, culturele, godsdienstige en geestelijke behoeften, dat de instelling geacht kan worden van
      algemeen nut te zijn; en.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 30.c
    text: |-
      zij heeft op grond van de statuten een orgaan dat het programmabeleid bepaalt. Dit orgaan heeft een zodanige
      samenstelling dat het representatief is voor de belangrijkste in de gemeente of provincie voorkomende
      maatschappelijke, culturele, godsdienstige en geestelijke stromingen. De leden van dit orgaan worden op voordracht
      van de omroep benoemd door het College van Burgemeester en Wethouders, respectievelijk Gedeputeerde Staten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30
  - number: 30a.1
    text: |-
      Ten behoeve van de verwezenlijking van de in
      [artikel 13c, eerste lid, onderdelen a en b, en tweede en derde lid][ref1], bedoelde taak van de publieke omroep op
      landelijk niveau wordt aan de Stichting een concessie voor landelijke omroep verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 30a.2
    text: |-
      De concessie wordt op voordracht van Onze Minister bij koninklijk besluit telkens verleend voor een periode van 10
      jaar en treedt in werking met ingang van een in het koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30a.3
    text: |-
      Aan de concessie kunnen voorschriften en algemene aanwijzingen worden verbonden. Deze voorschriften en aanwijzingen
      hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30a.3.a
    text: de wijze waarop het publiek betrokken kan worden bij het programmabeleid en de programmering;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30a.3.b
    text: |-
      de wijze waarop aan het publiek rekenschap wordt afgelegd over het programmabeleid ter uitvoering van de publieke
      omroeptaak;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30a.3.c
    text: de samenwerking met de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30a.3.d
    text: de samenwerking met regionale en lokale omroepinstellingen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30a.4
    text: |-
      De in het derde lid bedoelde voorschriften en aanwijzingen hebben geen betrekking op de inhoud van programma's of
      programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30a.5
    text: |-
      Voor het geval de Stichting zijn uit de wet of de concessie voortvloeiende verplichtingen niet nakomt kunnen bij
      algemene maatregel van bestuur voorzieningen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30a
  - number: 30b.1
    text: |-
      Ten behoeve van de concessieverlening doet de Stichting een concessiebeleidsplan voor de landelijke omroep toekomen
      aan het Commissariaat voor de Media. Het Commissariaat zendt het concessiebeleidsplan met zijn opmerkingen binnen
      acht weken aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.2
    text: 'In het concessiebeleidsplan is in elk geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.2.a
    text: |-
      de wijze waarop gedurende de concessieperiode door de erkende instellingen die zendtijd hebben verkregen voor
      landelijke omroep, de Stichting en de Programmastichting, gezamenlijk en individueel invulling wordt gegeven aan
      de taakopdracht van de landelijke omroep, in het bijzonder de wijze waarop op de televisie- en radioprogrammanetten
      invulling wordt gegeven aan de voorgenomen programmering en de onderlinge samenwerking, met inachtneming van het
      bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.2.b
    text: |-
      een overzicht van de daartoe naar verwachting benodigde organisatorische, personele, materiële en financiële
      middelen; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.2.c
    text: de wijze van samenwerking met de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.3
    text: |-
      Gedurende de concessieperiode doet de Stichting voor het verstrijken van een periode van vijf jaren een tussentijds
      concessiebeleidsplan voor de komende vijf jaren toekomen aan het Commissariaat voor de Media. Het Commissariaat
      zendt het tussentijds concessiebeleidsplan met zijn opmerkingen binnen vier weken aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.4
    text: |-
      Het concessiebeleidsplan en het tussentijds concessiebeleidsplan worden door de raad van bestuur opgesteld na
      overleg met de instellingen die zendtijd hebben verkregen voor landelijke omroep en voorzover het de samenwerking
      met de Wereldomroep betreft, de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.5
    text: |-
      Over het concessiebeleidsplan en het tussentijds concessiebeleidsplan vraagt Onze Minister advies aan de Raad voor
      cultuur.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30b.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het tijdstip waarop het
      concessiebeleidsplan en het tussentijds concessiebeleidsplan moeten worden ingediend.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30b
  - number: 30c.1
    text: |-
      Gedurende de concessieperiode draagt de Stichting zorg voor een regelmatige beoordeling van de wijze waarop door de
      Stichting en de overige instellingen die zendtijd hebben verkregen voor landelijke omroep uitvoering wordt gegeven
      aan de taakopdracht van de landelijke omroep. Een beoordeling als bedoeld in de vorige volzin vindt in elk geval
      plaats telkens voor afloop van een periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.2
    text: |-
      Ter uitvoering van het eerste lid stelt de Stichting telkens een commissie in, die bestaat uit ten minste vijf
      onafhankelijke deskundigen. Bij de samenstelling van de commissie draagt de Stichting er zorg voor dat deze zoveel
      mogelijk representatief is voor het kijk- en luisterpubliek.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.3
    text: |-
      De leden van de commissie worden op voordracht van de raad van bestuur en gehoord Onze Minister benoemd door de
      raad van toezicht. Een commissie wordt ingesteld en de leden worden benoemd voor de duur van de werkzaamheden van
      de commissie.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.4
    text: |-
      Een commissie als bedoeld in het tweede lid heeft tot taak de wijze waarop uitvoering is gegeven aan de
      taakopdracht van de landelijke omroep te beoordelen. Daartoe rapporteert de commissie in elk geval over:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.4.a
    text: |-
      de wijze waarop de Stichting en de overige instellingen die zendtijd hebben verkregen voor landelijke omroep
      gezamenlijk via het programma-aanbod invulling hebben gegeven aan de taakopdracht van de landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.4.b
    text: |-
      de wijze waarop de afzonderlijke instellingen die zendtijd hebben verkregen voor landelijke omroep hebben
      bijgedragen aan de verwezenlijking van de taakopdracht van de landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.4.c
    text: |-
      de mate waarin met het programma-aanbod is voldaan aan de interesses en inzichten van het algemene publiek, alsmede
      van specifieke bevolkings- en leeftijdsgroepen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.4.d
    text: andere onderwerpen die zijn opgenomen in het besluit tot instelling of die door Onze Minister zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.5
    text: |-
      De commissie kan aanbevelingen doen voor de volgende periode van vijf jaar omtrent de taakopdracht en
      doelstellingen van de landelijke omroep en de wijze waarop daaraan uitvoering kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: 30c.6
    text: |-
      De commissie brengt van zijn werkzaamheden en bevindingen voor 1 mei van het jaar voorafgaande aan het jaar waarin
      de periode waarvoor de concessie, bedoeld in [artikel 30a][ref1] en de erkenningen, bedoeld in [artikel 31][ref2],
      zijn verleend eindigt, een rapport uit en zendt dit aan de raad van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
  - number: 30c.7
    text: De raad van toezicht maakt het rapport openbaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel30c
  - number: '31.1'
    text: |-
      Voor programmaverzorging voor landelijke omroep kan Onze Minister omroepverenigingen en één educatieve
      omroepinstelling erkennen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel31
  - number: '31.2'
    text: |-
      Erkenningen worden eenmaal in de vijf jaren verleend voor een, voor alle erkende omroepinstellingen tegelijk
      aanvangende periode van vijf jaren, met dien verstande dat het tijdstip waarop de erkenningen in werking treden
      samenvalt met het tijdstip waarop de concessie, bedoeld in [artikel 30a][ref1], in werking treedt, dan wel met het
      tijdstip waarop de vijfjaarlijkse perioden, bedoeld in [artikel 30b, derde lid][ref2], aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: '31.3'
    text: 'Een omroepvereniging komt slechts in aanmerking voor een erkenning, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel31
  - number: 31.3.a
    text: |-
      de omroepvereniging in het jaar voorafgaande aan de periode van erkenning, zendtijd als omroepvereniging heeft
      gehad; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel31
  - number: 31.3.b
    text: door het Commissariaat voor de Media is vastgesteld dat de omroepvereniging ten minste 300 000 leden heeft.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel31
  - number: '31.4'
    text: |-
      Een erkenning geeft aan de erkende omroepinstelling gedurende de periode waarvoor erkenning is verleend recht op
      zendtijd en een financiële bijdrage voor de verzorging van het programma.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel31
  - number: '31.5'
    text: |-
      Een erkende omroepinstelling is verplicht gedurende de periode waarvoor erkenning is verleend een televisie- en een
      radioprogramma voor landelijke omroep te verzorgen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel31
  - number: '32.1'
    text: |-
      Een erkenning wordt op aanvraag verleend en heeft betrekking op de verzorging van zowel televisie- als
      radioprogramma's. De aanvraag wordt ingediend bij het Commissariaat voor de Media, die deze voorzien van zijn
      opmerkingen binnen acht weken aan Onze Minister zendt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel32
  - number: '32.2'
    text: |-
      Een aanvraag voor een erkenning gaat vergezeld van een beleidsplan. Een aanvraag van een omroepvereniging bevat
      tevens een opgave van het door het Commissariaat vastgestelde aantal leden van de omroepvereniging.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel32
  - number: '32.3'
    text: |-
      Het beleidsplan, bedoeld in het tweede lid, bevat in elk geval het voorgenomen programmabeleid van de
      omroepinstelling, met inachtneming van de bij of krachtens deze wet gestelde verplichtingen ten aanzien van de
      programma's voor landelijke omroep, alsmede de voornemens en afspraken met betrekking tot de samenwerking met
      andere aanvragers van een erkenning of een voorlopige erkenning, de Stichting of de Programmastichting, mede in
      het licht van de uitvoering van de taak van de publieke omroep, bedoeld in [artikel 13c][ref1], de concessie,
      bedoeld in [artikel 30a, eerste lid][ref2], en de daaraan verbonden voorschriften en aanwijzingen. Het deel van het
      beleidsplan dat betrekking heeft op de samenwerking met andere aanvragers, de Stichting of de Programmastichting,
      kan door de desbetreffende aanvragers, onderscheidenlijk door de desbetreffende aanvragers in overeenstemming met
      de Stichting of de Programmastichting, gezamenlijk worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
  - number: '32.4'
    text: |-
      De vaststelling van het aantal leden door het Commissariaat geschiedt op een door Onze Minister te bepalen
      peildatum.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel32
  - number: '32.5'
    text: |-
      Het Commissariaat kan nadere regels stellen omtrent de gegevens die door de omroepverenigingen ten behoeve van de
      vaststelling van het aantal leden ter beschikking worden gesteld, de wijze waarop deze gegevens ter beschikking
      worden gesteld, en de wijze waarop de vaststelling geschiedt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel32
  - number: '33'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud van het
      beleidsplan, bedoeld in [artikel 32, tweede lid][ref1], het tijdstip waarop en de wijze waarop aanvragen voor een
      erkenning worden ingediend, de terinzagelegging van de aanvragen en de termijn waarbinnen besluiten op een aanvraag
      worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: '34'
    text: |-
      Alvorens op de ingediende aanvragen voor een erkenning of voorlopige erkenning te beslissen vraagt Onze Minister
      advies aan de Raad voor cultuur.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel34
  - number: '36.1'
    text: |-
      Een aanvraag voor een erkenning wordt afgewezen, indien niet wordt voldaan aan de [artikelen 14, eerste lid][ref1],
      [25][ref2] of [31, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
  - number: '36.2'
    text: 'Een aanvraag voor een erkenning kan daarnaast slechts worden afgewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
  - number: 36.2.a
    text: |-
      niet wordt voldaan aan een bij of krachtens de [artikelen 32, tweede tot en met vijfde lid][ref1], en [33][ref2]
      gesteld vereiste;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel33
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: 36.2.b
    text: |-
      aannemelijk is dat de aanvrager zich, mede gelet op zijn handelwijze in een voorafgaande periode waarin hij
      zendtijd heeft gehad, niet aan de bij of krachtens de wet gestelde voorschriften zal houden; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
  - number: 36.2.c
    text: 'uit het beleidsplan naar het oordeel van Onze Minister onvoldoende blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
  - number: 36.2.c.1°
    text: indien het een omroepvereniging betreft in het programmabeleid de identiteit van de aanvrager tot uitdrukking komt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
  - number: 36.2.c.2°
    text: het programma voldoet aan de daaraan bij of krachtens deze wet gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
  - number: 36.2.c.3°
    text: |-
      de bereidheid tot samenwerking, bedoeld in [artikel 32, derde lid][ref1], bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: '36.3'
    text: |-
      Een aanvraag voor een erkenning van een omroepvereniging die een voorlopige erkenning heeft verkregen en
      aansluitend voor een erkenning in aanmerking wenst te komen, kan tevens worden afgewezen, indien gedurende de
      periode waarvoor een voorlopig erkenning is verkregen, onvoldoende is gebleken dat het programma voldoet aan de
      vereisten, bedoeld in [artikel 37a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel37a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 37a
        hoofdstuk: III
        paragraaf: '3'
  - number: 36a.1
    text: |-
      Indien een omroepvereniging of de educatieve omroepinstelling die een erkenning heeft verkregen, tijdens de
      periode waarvoor erkenning is verleend wijzigingen wil aanbrengen in zijn beleidsplan, brengt hij de voorgenomen
      wijzigingen ter kennis van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36a
  - number: 36a.2
    text: |-
      De wijzigingen kunnen worden aangebracht, indien Onze Minister niet binnen acht weken nadat hij van de voorgenomen
      wijzigingen in kennis is gesteld, daartegen bedenkingen heeft ingebracht.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36a
  - number: 36a.3
    text: |-
      Onze Minister brengt uitsluitend bedenkingen in tegen voorgenomen wijzigingen, indien hij een aanvraag voor een
      erkenning, vergezeld van het beleidsplan zoals het zou luiden na het aanbrengen van de voorgenomen wijzigingen, zou
      hebben afgewezen op een of meer van de gronden, bedoeld in [artikel 36, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel36
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '36'
        hoofdstuk: III
        paragraaf: '2'
  - number: 36b.1
    text: |-
      Onze Minister trekt een erkenning in, indien de omroepvereniging respectievelijk de educatieve omroepinstelling
      niet meer voldoet aan [artikel 14, eerste lid][ref1], respectievelijk [artikel 25][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel25
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
  - number: 36b.2
    text: |-
      Onze Minister kan een erkenning intrekken, indien het Commissariaat aan de omroepvereniging of de educatieve
      omroepinstelling binnen een periode van een jaar ten minste tweemaal terzake van overtreding van het bepaalde
      bij of krachtens deze wet een sanctie heeft opgelegd, waaronder ten minste eenmaal een sanctie als bedoeld in
      [artikel 46, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel46
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '46'
        hoofdstuk: III
        afdeling: '3'
  - number: 36b.3
    text: |-
      Indien aan een omroepvereniging of de educatieve omroepinstelling voor twee achtereenvolgende jaren een sanctie als
      bedoeld in [artikel 103a][ref1] is opgelegd, dan wel indien een omroepvereniging of de educatieve omroepinstelling
      naar het oordeel van de raad van bestuur onvoldoende uitvoering geeft aan de bereidheid tot samenwerking, bedoeld
      in [artikel 32, derde lid][ref2], kan de raad van bestuur Onze Minister verzoeken de erkenning in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel103a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel32
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 103a
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: '37.1'
    text: Voor programmaverzorging voor landelijke omroep kan Onze Minister omroepverenigingen voorlopig erkennen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37
  - number: '37.2'
    text: |-
      Voorlopige erkenningen worden eenmaal in de vijf jaren verleend voor een, voor alle voorlopig erkende
      omroepverenigingen tegelijk aanvangende, periode van vijf jaren, samenvallend met de erkenningsperiode, bedoeld in
      [artikel 31, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
  - number: '37.3'
    text: 'Een omroepvereniging komt slechts in aanmerking voor een voorlopige erkenning, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37
  - number: 37.3.a
    text: |-
      de omroepvereniging geen erkenning als bedoeld in [artikel 31][ref1] heeft verkregen; en


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
  - number: 37.3.b
    text: door het Commissariaat voor de Media is vastgesteld dat de omroepvereniging ten minste 50 000 leden heeft.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37
  - number: '37.4'
    text: |-
      [Artikel 31, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
  - number: 37a.1
    text: |-
      [Artikel 32][ref1] is van overeenkomstige toepassing op aanvragen voor een voorlopige erkenning, met dien
      verstande dat uit het beleidsplan tevens dient te blijken dat het programma dat de omroepvereniging voornemens
      is te verzorgen, naar inhoud en strekking zodanig afwijkt van de door de omroepverenigingen die een erkenning
      hebben verkregen verzorgde programma's, dat het de verscheidenheid in de landelijke omroep vergroot en daarmee een
      vernieuwende bijdrage levert aan de verwezenlijking van de taakopdracht van de landelijke omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: 37a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud van het
      beleidsplan, het tijdstip waarop en de wijze waarop aanvragen voor een voorlopige erkenning worden ingediend, de
      terinzagelegging van de aanvragen en de termijn waarbinnen besluiten op een aanvraag worden genomen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37a
  - number: 37b.1
    text: |-
      Een aanvraag voor een voorlopige erkenning wordt afgewezen, indien niet wordt voldaan aan de vereisten van de
      [artikelen 14, eerste lid][ref1], en [37, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel37
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '37'
        hoofdstuk: III
        paragraaf: '3'
  - number: 37b.2
    text: 'Een aanvraag voor een voorlopige erkenning kan daarnaast slechts worden afgewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37b
  - number: 37b.2.a
    text: |-
      niet wordt voldaan aan een bij of krachtens [artikel 37a][ref1] gesteld vereiste;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel37a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 37a
        hoofdstuk: III
        paragraaf: '3'
  - number: 37b.2.b
    text: aannemelijk is dat de aanvrager zich niet aan de bij of krachtens de wet gestelde voorschriften zal houden; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37b
  - number: 37b.2.c
    text: |-
      uit het beleidsplan naar het oordeel van Onze Minister onvoldoende blijkt dat in het programmabeleid de identiteit
      van de aanvrager tot uitdrukking komt, het programma voldoet aan de daaraan bij of krachtens deze wet gestelde
      eisen of de bereidheid tot samenwerking, bedoeld in [artikel 32, derde lid][ref1], bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: '38'
    text: |-
      De [artikelen 36a][ref1] en [36b][ref2] zijn van overeenkomstige toepassing op omroepverenigingen die een voorlopige
      erkenning hebben verkregen, met dien verstande dat bedenkingen als bedoeld in [artikel 36a, derde lid][ref3], tegen
      voorgenomen wijzigingen in het beleidsplan van een omroepvereniging die een voorlopige erkenning heeft verkregen,
      uitsluitend kunnen worden ingebracht indien een aanvraag voor een voorlopige erkenning zou zijn afgewezen op een of
      meer van de gronden, bedoeld in [artikel 37b, tweede lid, onderdelen a en c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel36b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel37b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 36a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 36b
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 36a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 37b
        hoofdstuk: III
        paragraaf: '3'
  - number: '39.1'
    text: |-
      De omroepverenigingen die een erkenning hebben verkregen, hebben jaarlijks de beschikking over 650 uren zendtijd
      voor televisie en 3000 uren zendtijd voor radio.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39
  - number: '39.2'
    text: |-
      De omroepverenigingen die een voorlopige erkenning hebben verkregen, hebben jaarlijks de beschikking over 100 uren
      zendtijd voor televisie en 450 uren zendtijd voor radio.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39
  - number: '39.3'
    text: |-
      De educatieve omroepinstelling die een erkenning heeft verkregen, heeft jaarlijks de beschikking over 500 uren
      zendtijd voor televisie en 475 uren zendtijd voor radio.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39
  - number: '39.4'
    text: |-
      De omroepverenigingen en de educatieve omroepinstelling zijn gerechtigd meer zendtijd te gebruiken dan de zendtijd,
      bedoeld in het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39
  - number: '39.5'
    text: |-
      Bij algemene maatregel van bestuur kan het aantal uren zendtijd voor televisie, onderscheidenlijk radio, bedoeld
      in het eerste tot en met derde lid, worden herzien indien het aantal omroepverenigingen die een erkenning of een
      voorlopige erkenning hebben verkregen, daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39
  - number: 39a.1
    text: |-
      De Programmastichting heeft per jaar de beschikking over 650 uren zendtijd voor televisie en 3000 uren zendtijd
      voor radio.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39a
  - number: 39a.2
    text: De Programmastichting is gerechtigd meer zendtijd te gebruiken dan de zendtijd, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39a
  - number: 39a1.1
    text: |-
      De Stichting heeft per jaar de beschikking over 1.300 uren zendtijd voor televisie en 1.500 uren zendtijd voor
      radio.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39a1
  - number: 39a1.2
    text: De Stichting is gerechtigd meer zendtijd te gebruiken dan de zendtijd, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39a1
  - number: 39a1.3
    text: |-
      De Stichting heeft tevens, met uitsluiting van de andere instellingen die zendtijd hebben verkregen, de beschikking
      over zendtijd voor een teletekstprogramma voor landelijke omroep. Deze zendtijd is gelijk aan de tijd dat door
      middel van de desbetreffende omroepzenders het programma van de instellingen die zendtijd hebben verkregen voor
      landelijke omroep, of een toetsbeeld wordt uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39a1
  - number: 39a1.4
    text: |-
      In afwijking van het derde lid, is het toegestaan dat de Stichting Etherreclame, met inachtneming van artikel
      39*b*, een deel van de zendtijd voor het teletekstprogramma voor landelijke omroep gebruikt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39a1
  - number: 39b
    text: |-
      De Stichting Etherreclame heeft per jaar de beschikking over een bij algemene maatregel van bestuur vast te stellen
      percentage van de totale gebruikte zendtijd voor landelijke omroep. Dit percentage is niet hoger dan tien en kan
      verschillen voor televisie en voor radio.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39b
  - number: 39c.1
    text: |-
      Onze Minister stelt jaarlijks vast hoeveel zendtijd voor landelijke televisie-omroep, onderscheidenlijk radio-
      omroep, beschikbaar is voor de instellingen die in aanmerking komen voor toewijzing van zendtijd voor landelijke
      omroep door het Commissariaat voor de Media overeenkomstig de [artikelen 39f tot en met 39h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39f
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: 39c.2
    text: Het Commissariaat voor de Media wijst de zendtijd, bedoeld in het eerste lid, jaarlijks toe.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39c
  - number: 39c.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de periode waarin en de wijze waarop aanvragen
      voor toewijzing van zendtijd worden ingediend, de termijn waarbinnen besluiten op een aanvraag worden genomen, en
      het tijdstip waarop de toewijzing van zendtijd in werking treedt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39c
  - number: 39f.1
    text: |-
      Het Commissariaat voor de Media kan eenmaal in de vijf jaren voor een periode van vijf jaren zendtijd voor
      landelijke omroep toewijzen aan kerkgenootschappen en genootschappen op geestelijke grondslag, dan wel aan
      rechtspersonen waarin twee of meer van deze genootschappen samenwerken. De zendtijd vervalt na afloop van deze
      periode.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39f
  - number: 39f.2
    text: |-
      De kerkgenootschappen en genootschappen op geestelijke grondslag die zendtijd hebben verkregen, zijn gerechtigd de
      verzorging van hun programma’s op te dragen aan hetzij de Stichting, hetzij een omroepvereniging die zendtijd heeft
      verkregen, hetzij een door hen in het leven geroepen orgaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39f
  - number: 39g.1
    text: |-
      Het Commissariaat voor de Media wijst zendtijd voor landelijke omroep toe aan politieke partijen die bij de
      laatstgehouden verkiezing van de Tweede of Eerste Kamer der Staten-Generaal een of meer zetels hebben verworven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
  - number: 39g.2
    text: |-
      Het Commissariaat voor de Media wijst zendtijd voor landelijke omroep toe aan politieke partijen die in alle
      kieskringen aan de verkiezing van de leden van de Tweede Kamer der Staten-Generaal deelnemen, alsmede aan politieke
      partijen die in Nederland aan de verkiezing van leden van het Europees Parlement deelnemen. In afwijking van
      [artikel 39c, tweede lid][ref1], wordt deze zendtijd niet jaarlijks toegewezen, doch uitsluitend in een door het
      Commissariaat te bepalen periode, onmiddellijk voorafgaande aan de dag die in Nederland voor de desbetreffende
      verkiezing is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39c
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: 39g.3
    text: |-
      Indien een politieke partij op grond van de [artikelen 137c, d, e, f, of g][ref1], of[ artikel 429 quater van het
      Wetboek van Strafrecht](onbekend), is veroordeeld tot een onvoorwaardelijke geldboete, wijst het Commissariaat
      voor de Media, in afwijking van het eerste en tweede lid, aan deze politieke partij geen zendtijd toe gedurende een
      periode die ingaat op de dag waarop de veroordeling onherroepelijk is geworden. Deze periode is:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel137c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 137c
  - number: 39g.3.a
    text: één jaar, bij een geldboete van minder dan € 1 125;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
  - number: 39g.3.b
    text: twee jaar, bij een geldboete van € 1 125 of meer, maar minder dan € 2 250;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
  - number: 39g.3.c
    text: drie jaar, bij een geldboete van € 2 250 of meer, maar minder dan € 3 375; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
  - number: 39g.3.d
    text: vier jaar, bij een geldboete van € 3 375 of meer.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
  - number: 39g.4
    text: |-
      Indien aan de lijst van een politieke partij aan de lijst waarvan op de dag waarop de veroordeling, bedoeld in
      het derde lid, onherroepelijk wordt, op grond van de [Kieswet][ref1] geen zetels zijn toegewezen, op grond van een
      verkiezing die plaatsvindt binnen een periode van twee jaar na die dag één of meer zetels worden toegewezen, gaat
      de periode gedurende welke aan deze politieke partij geen zendtijd als bedoeld in het eerste lid wordt toegewezen,
      in op de dag waarop de verkiezing heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 39g.5
    text: |-
      Na een veroordeling als bedoeld in het derde lid, wordt aan de politieke partij, zo nodig in afwijking van het
      derde lid, onder a, in ieder geval geen zendtijd als bedoeld in het tweede lid toegewezen binnen twee jaar na de
      dag waarop de veroordeling onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39g
  - number: 39h.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden, op voordracht van Onze Minister-President na overleg
      met Onze Minister, regels gesteld met betrekking tot het toewijzen van zendtijd voor landelijke omroep door het
      Commissariaat voor de Media ten behoeve van overheidsvoorlichting. Bij deze algemene maatregel van bestuur kan
      tevens worden bepaald dat, in afwijking van [artikel 39][ref1], daarvoor ook een deel van de zendtijd voor het
      teletekstprogramma voor landelijke omroep kan worden toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39a1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39h
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39a1
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: 39h.2
    text: |-
      De zendtijd wordt toegewezen aan de ministers voor het gebruik door overheidsinstellingen of personen die daartoe
      door hen zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39h
  - number: 39i.1
    text: |-
      Het Commissariaat voor de Media kan in bijzondere gevallen of voor bijzondere doeleinden zendtijd toewijzen boven
      de zendtijd, bedoeld in [artikel 39][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39i
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39c
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: 39i.2
    text: |-
      Over de met toepassing van het eerste lid toegewezen zendtijd bestaat geen recht op de vergoeding, bedoeld in
      [artikel 104, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel104
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel39i
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '104'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '40.1'
    text: |-
      Voor landelijke televisie-omroep door instellingen die zendtijd hebben verkregen, zijn gedurende de
      concessieperiode, bedoeld in [artikel 30a, tweede lid][ref1], drie televisieprogrammanetten beschikbaar: TV 1, 2
      en 3.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.2'
    text: |-
      De programmering op de onderscheiden televisieprogrammanetten omvat onderdelen van culturele, educatieve,
      informatieve en verstrooiende aard en bevat in elk geval programma-onderdelen die bestaan uit nieuws en
      actualiteiten. De programmering richt zich tevens op programma-onderdelen of bevolkings- en leeftijdsgroepen
      voor zover die met betrekking tot de televisieprogrammanetten zijn aangegeven bij of krachtens het bepaalde in de
      [artikelen 13c][ref1], [18b, tweede lid, onderdeel a][ref2], [19a, eerste lid, onderdeel e][ref3], [30a][ref4] en
      [30b][ref5]. De programmering is voorts zodanig dat op de onderscheiden televisieprogrammanetten een herkenbare
      programmering wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.3'
    text: |-
      Voor landelijke radio-omroep door instellingen die zendtijd hebben verkregen, zijn gedurende de concessieperiode,
      bedoeld in [artikel 30a, tweede lid][ref1], vijf radioprogrammanetten beschikbaar: Radio 1, 2, 3, 4 en 5.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.4'
    text: |-
      De programmering op de radioprogrammanetten omvat onderdelen van culturele, informatieve, educatieve en
      verstrooiende aard en bevat in elk geval programma-onderdelen die bestaan uit nieuws en actualiteiten en een
      gevarieerd aanbod van muziek. De programmering richt zich op programma-onderdelen en bevolkingsen leeftijdsgroepen
      voor zover die met betrekking tot de radioprogrammanetten zijn aangegeven bij of krachtens het bepaalde in de
      [artikelen 13c][ref1], [18b, tweede lid, onderdeel a][ref2], [19a, eerste lid, onderdeel e][ref3], [30a][ref4]
      en [30b][ref5]. De programmering is voorts zodanig dat op de onderscheiden radioprogrammanetten een herkenbare
      programmering wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.5'
    text: |-
      De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], er zorg voor dat de op de televisie- en radioprogrammanetten uit te
      zenden programma-onderdelen passen binnen het kader dat bij of krachtens het bepaalde in de [artikelen 13c][ref2],
      [18b, tweede lid, onderdeel a][ref3], [19a, eerste lid, onderdeel e][ref4], [30a][ref5], [30b][ref6], en dit
      artikel voor het desbetreffende programmanet wordt aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 30a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: 40a.1
    text: 'Elk televisieprogrammanet heeft een netbestuur dat als volgt is samengesteld:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
  - number: 40a.1.a
    text: |-
      de omroepverenigingen en de Programmastichting, wier zendtijd voor televisie krachtens
      [artikel 41b, eerste lid, onderdelen a en b][ref1], tussen 16.00 uur en 24.00 uur, dan wel
      krachtens [artikel 41b, tweede lid][ref2], voor een bij het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref3], te bepalen belangrijk deel van de zendtijd tussen 16.00 uur en 24.00
      uur, is ingedeeld op het desbetreffende programmanet, benoemen elk een lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel41b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 41b
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 41b
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 40a.1.b
    text: de educatieve omroepinstelling, wiens zendtijd op het desbetreffende net is ingedeeld, benoemt één lid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
  - number: 40a.1.c
    text: |-
      de kerkgenootschappen en genootschappen op geestelijke grondslag, wier zendtijd voor televisie is ingedeeld op het
      desbetreffende programmanet, benoemen gezamenlijk één lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
  - number: 40a.2
    text: |-
      De raad van bestuur wijst een waarnemer aan die het recht heeft de vergaderingen van het netbestuur bij te wonen,
      indien het programma van de Stichting aan de orde is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
  - number: 40a.3
    text: Het netbestuur wijst uit zijn midden een voorzitter aan. Het richt zijn werkzaamheden naar eigen inzicht in.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
  - number: 40a.4
    text: 'Het netbestuur is belast met:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
  - number: 40a.4.a
    text: |-
      het adviseren van de netcoördinator ten behoeve van het opstellen van het netprofiel van het televisieprogrammanet,
      bedoeld in [artikel 19a, eerste lid, onderdeel e][ref1], rekening houdend met de algemene uitgangspunten,
      bedoeld in [artikel 18b, tweede lid, onderdeel a][ref2], en met inachtneming van het bepaalde bij of krachtens
      [artikel 13c][ref3] en hetgeen overigens is bepaald bij of krachtens deze wet ten aanzien van de programma's en de
      programmering op het televisieprogrammanet;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 40a.4.b
    text: |-
      het adviseren van de netcoördinator ten behoeve van het opstellen van de ontwerpbegroting voor het
      televisieprogrammanet, bedoeld in [artikel 98a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel98a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 98a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 40b.1
    text: |-
      Ten behoeve van de coördinatie op de televisie- en radioprogrammanetten benoemt de raad van bestuur voor ieder
      televisie-, onderscheidenlijk radioprogrammanet een netcoördinator. De netcoördinator is in dienst van de
      Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
  - number: 40b.2
    text: |-
      Benoeming en ontslag van de netcoördinator voor een televisieprogrammanet geschiedt op voordracht van het
      netbestuur.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
  - number: 40b.3
    text: 'De netcoördinator is belast met:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
  - number: 40b.3.a
    text: |-
      de onderlinge afstemming van de programma's en programma-onderdelen op het televisie-, onderscheidenlijk
      radioprogrammanet;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
  - number: 40b.3.b
    text: |-
      het opstellen van het netprofiel van het televisie-, onderscheidenlijk radioprogrammanet, bedoeld in
      [artikel 19a, eerste lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 40b.3.c
    text: |-
      het opstellen van de ontwerpbegroting voor het televisie-, onderscheidenlijk radioprogrammanet, bedoeld in
      [artikel 98a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel98a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 98a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 40b.3.d
    text: |-
      de uitvoering van de in de [artikelen 40, vijfde lid][ref1], [51, tweede lid][ref2], en [54, zevende lid][ref3],
      bedoelde taak van de raad van bestuur ten aanzien van het desbetreffende televisie- of radioprogrammanet;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel54
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '40'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '51'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '54'
        hoofdstuk: III
        afdeling: '1'
  - number: 40b.3.e
    text: |-
      het doen van voorstellen aan de raad van bestuur voor zendtijdindeling op het televisie-, onderscheidenlijk
      radioprogrammanet;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
  - number: 40b.3.f
    text: het ontwikkelen van gezamenlijke projecten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
  - number: 40b.4
    text: |-
      Het opstellen van het netprofiel van, en het doen van voorstellen voor de zendtijdindeling op het televisie-,
      respectievelijk radioprogrammanet, geschiedt door de netcoördinator tezamen met de netredactie, bedoeld
      in [artikel 40d][ref1], en na overleg met de netcoördinatoren van de andere televisie-, onderscheidenlijk
      radioprogrammanetten.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40d
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 40d
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
  - number: 40c.1
    text: |-
      De netcoördinator neemt besluiten ter uitvoering van zijn taak, bedoeld in
      [artikel 40b, derde lid, onderdelen a en d][ref1], in naam van de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 40b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
  - number: 40c.2
    text: |-
      Voor de toepassing van [afdeling 10.1.1 van de Algemene wet bestuursrecht][ref1] wordt de raad van bestuur
      aangemerkt als mandaatgever. In afwijking van [artikel 10:8 van de Algemene wet bestuursrecht][ref2], kan de raad
      van bestuur het mandaat niet intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.1.1
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 40d.1
    text: |-
      De netcoördinator van een televisieprogrammanet wordt bijgestaan door een netredactie die als volgt is
      samengesteld:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.1.a
    text: |-
      de instellingen, wier zendtijd voor televisie krachtens [artikel 41b, eerste lid, onderdelen a en b][ref1], is
      ingedeeld op het desbetreffende programmanet benoemen elk één lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel41b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 41b
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
  - number: 40d.1.b
    text: |-
      de instellingen, met uitzondering van de Stichting Etherreclame, de kerkgenootschappen en genootschappen op
      geestelijke grondslag, de politieke partijen en de overheid, van wie een bij het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], te bepalen belangrijk deel van de zendtijd tussen 16.00 uur en 24.00
      uur is ingedeeld op het desbetreffende programmanet benoemen elk één lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 40d.1.c
    text: |-
      de kerkgenootschappen en genootschappen op geestelijke grondslag, wier zendtijd is ingedeeld op het desbetreffende
      programmanet, benoemen gezamenlijk één lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.2
    text: |-
      De netcoördinator van een radioprogrammanet wordt bijgestaan door een netredactie die bestaat uit een aantal
      leden dat gelijk is aan het aantal instellingen wier zendtijd op het desbetreffende programmanet is ingedeeld, met
      uitzondering van de Stichting Etherreclame, de politieke partijen en de overheid. Iedere instelling benoemt één
      lid, met uitzondering van de instellingen, genoemd in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.3
    text: 'Met het lidmaatschap van een netredactie is onverenigbaar:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.3.a
    text: het lidmaatschap van het netbestuur;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.3.b
    text: het lidmaatschap van het bestuur van een omroepvereniging, de educatieve omroepinstelling of de Programmastichting;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.3.c
    text: het lidmaatschap van de raad van bestuur of de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.4
    text: |-
      De netredactie stelt tezamen met de netcoördinator een netstatuut vast. Het netstatuut behoeft de instemming van
      het netbestuur. Het netstatuut bevat, met in achtneming van het bepaalde bij of krachtens deze wet, in elk geval
      nadere invulling van:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.4.a
    text: de wijze waarop de netredactie en de netcoördinator samenwerken op het programmanet;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.4.b
    text: de wijze waarop de netcoördinator gebruik maakt van zijn bevoegdheden bij de vervulling van zijn taken;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: 40d.4.c
    text: de verdere werkwijze van de netredactie.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel40d
  - number: '41.1'
    text: De raad van bestuur deelt jaarlijks, gehoord de netcoördinatoren, de zendtijd voor landelijke omroep in.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
  - number: '41.2'
    text: 'De raad van bestuur kan, voor zover nodig, de zendtijdindeling herzien, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
  - number: 41.2.a
    text: |-
      met toepassing van [artikel 36b][ref1] of [artikel 38][ref2] een erkenning, onderscheidenlijk een voorlopige
      erkenning, wordt ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel38
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 36b
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '38'
        hoofdstuk: III
        paragraaf: '3'
  - number: 41.2.b
    text: |-
      met toepassing van een van de [artikelen 45 tot en met 47][ref1] de aan een instelling toegewezen zendtijd voor
      landelijke omroep wordt ingetrokken of verminderd; of


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel45
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '45'
        hoofdstuk: III
        afdeling: '3'
  - number: 41.2.c
    text: |-
      tussentijds door het Commissariaat voor de Media aan een instelling zendtijd voor landelijke omroep wordt
      toegewezen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
  - number: '41.3'
    text: 'De raad van bestuur kan voorts de zendtijdindeling herzien, voor zover hij dat nodig acht:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
  - number: 41.3.a
    text: |-
      in het kader van de coördinatie, op en tussen de verschillende programmanetten, van de programma-onderdelen van de
      instellingen die zendtijd hebben verkregen voor landelijke omroep; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
  - number: 41.3.b
    text: op grond van omstandigheden die niet voorzien waren ten tijde van de zendtijdindeling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41
  - number: 41a.1
    text: |-
      Met inachtneming van [artikel 39b][ref1] wordt de zendtijd van de Stichting Etherreclame zodanig ingedeeld, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39b
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: 41a.1.a
    text: |-
      deze zendtijd per dag op een programmanet niet meer bedraagt dan vijftien procent van de op dat programmanet
      gebruikte zendtijd;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.b
    text: deze zendtijd per klokuur niet meer bedraagt dan twaalf minuten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.c
    text: |-
      op zondagen de programma-onderdelen van de Stichting Etherreclame niet onmiddellijk voorafgaan aan of aansluiten
      op programma-onderdelen van godsdienstige of levensbeschouwelijke aard, tenzij de voor dat programma-onderdeel
      verantwoordelijke instelling die zendtijd heeft verkregen, daartegen geen bedenkingen heeft ingebracht; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d
    text: |-
      de programmaonderdelen van de andere instellingen die zendtijd hebben verkregen voor landelijke omroep, slechts
      worden onderbroken door programmaonderdelen van de Stichting Etherreclame, indien:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d.1°
    text: |-
      het te onderbreken programmaonderdeel langer duurt dan anderhalf uur voor televisie, onderscheidenlijk drie
      kwartier voor radio;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d.2°
    text: het programmaonderdeel bestaat uit het verslag of de weergave van een evenement;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d.3°
    text: het programmaonderdeel het volledige verslag van het evenement bevat;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d.4°
    text: |-
      de onderbreking geschiedt tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de daarin
      voorkomende zelfstandige onderdelen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d.5º
    text: de onderbreking ten minste anderhalve minuut duurt voor televisie, onderscheidenlijk één minuut voor radio;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d.6º
    text: |-
      de voor het programmaonderdeel verantwoordelijke instelling die zendtijd heeft verkregen, geen bedenkingen
      heeft ingebracht tegen de onderbreking wegens afbreuk aan de integriteit, het karakter of de samenhang van het
      programmaonderdeel; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.1.d.7º
    text: de onderbreking geen afbreuk doet aan de rechten van rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.2
    text: |-
      Programmaonderdelen van instellingen die zendtijd hebben verkregen voor landelijke omroep, kunnen ten hoogste
      eenmaal per vijfenveertig minuten voor televisie, onderscheidenlijk ten hoogste eenmaal per dertig minuten voor
      radio, worden onderbroken door een programmaonderdeel van de Stichting Etherreclame.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.3
    text: |-
      Programmaonderdelen van godsdienstige of geestelijke aard en programmaonderdelen die in het bijzonder bestemd zijn
      voor minderjarigen beneden de leeftijd van twaalf jaar, worden niet onderbroken door programmaonderdelen van de
      Stichting Etherreclame.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels gesteld worden omtrent de indeling van zendtijd van de Stichting
      Etherreclame direct voorafgaande aan of direct volgend op programma-onderdelen die in het bijzonder bestemd zijn
      voor minderjarigen beneden de leeftijd van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41a.5
    text: |-
      De zendtijd voor televisie van de Stichting Etherreclame kan slechts worden ingedeeld met inachtneming van een
      minimum duur van anderhalve minuut per blok.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41a
  - number: 41b.1
    text: |-
      Met inachtneming van [artikel 41a][ref1] wordt de zendtijd voor landelijke televisie-omroep zodanig ingedeeld, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 41a
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
  - number: 41b.1.a
    text: |-
      het televisieprogramma van de Programmastichting tussen 16.00 uur en 24.00 uur steeds op hetzelfde
      televisieprogrammanet wordt uitgezonden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41b
  - number: 41b.1.b
    text: |-
      het televisieprogramma van een omroepvereniging die zendtijd heeft verkregen, tussen 16.00 uur en 24.00 uur steeds
      op hetzelfde televisieprogrammanet wordt uitgezonden; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41b
  - number: 41b.1.c
    text: |-
      op ieder televisieprogrammanet in ieder geval dagelijks tussen 16.00 uur en 24.00 uur programma’s van instellingen
      die zendtijd hebben verkregen voor landelijke omroep, worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41b
  - number: 41b.2
    text: |-
      De raad van bestuur kan in het kader van de coördinatie op en tussen de verschillende programmanetten tot ten
      hoogste 325 uren per jaar per instelling afwijken van het eerste lid, onderdelen a en b. De raad van bestuur kan
      hiertoe slechts besluiten na overleg met het netbestuur van het programmanet waarop de zendtijd in afwijking van
      het eerste lid, onderdeel a of b, zal worden ingedeeld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41b
  - number: 41b.3
    text: Het eerste en het tweede lid zijn niet van toepassing op het teletekstprogramma.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41b
  - number: 41c.1
    text: |-
      Met inachtneming van de [artikelen 40, vierde lid][ref1], en [41a][ref2] wordt de zendtijd voor landelijke radio-
      omroep zodanig ingedeeld, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '40'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 41a
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
  - number: 41c.1.a
    text: |-
      de programma’s van de omroepverenigingen welke niet de wens te kennen hebben gegeven dat hun programma’s op alle
      radioprogrammanetten worden uitgezonden, op ten minste een bij algemene maatregel van bestuur vast te stellen
      aantal radioprogrammanetten worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41c
  - number: 41c.1.b
    text: |-
      op ten minste twee radioprogrammanetten 24 uur per dag programma’s van instellingen die zendtijd hebben verkregen
      voor landelijke omroep, worden uitgezonden; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41c
  - number: 41c.1.c
    text: |-
      op de overige radioprogrammanetten in ieder geval dagelijks tussen 07.00 uur en 24.00 uur programma’s van
      instellingen die zendtijd hebben verkregen voor landelijke omroep, worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41c
  - number: 41c.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald hoeveel uren zendtijd voor radio van een omroepvereniging
      jaarlijks ten minste op de radioprogrammanetten, bedoeld in het eerste lid, onderdeel *a*, zullen worden ingedeeld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel41c
  - number: '42.1'
    text: |-
      Het Commissariaat voor de Media kan voor lokale en regionale omroep zendtijd toewijzen aan een lokale
      onderscheidenlijk een regionale omroepinstelling, op aanvraag van die instelling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
  - number: '42.2'
    text: |-
      Er kan per gemeente slechts aan één lokale omroepinstelling zendtijd worden toegewezen. Indien meer dan één
      omroepinstelling aan de eisen voldoet die deze wet aan een lokale omroepinstelling stelt, bevordert de gemeente
      het samengaan van die instellingen. Indien zij daarin niet slaagt wijst het Commissariaat de zendtijd toe aan
      één van de instellingen. Het slaat daarbij acht op alle factoren die voor het functioneren van de instelling
      van belang kunnen zijn. Het Commissariaat kan daarbij tevens op basis van een overeenkomst als bedoeld in
      [artikel 51f, tweede lid][ref1], de dagen en uren aanwijzen waarop de programma’s van de lokale omroepinstelling en
      de regionale omroepinstelling worden uitgezonden op de voor de lokale omroepinstelling aangewezen omroepzender.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 51f
        hoofdstuk: III
        afdeling: '1'
  - number: '42.3'
    text: |-
      Aan een omroepinstelling wier programma bestemd is voor meer dan één gemeente of provincie, wordt alleen dan
      voor dat gebied zendtijd toegewezen, indien de besturen van de betreffende gemeenten of provincies het in
      [artikel 43, eerste lid][ref1], bedoelde advies gezamenlijk hebben uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '43'
        hoofdstuk: III
        afdeling: '2'
  - number: '42.4'
    text: |-
      De zendtijd voor lokale en regionale omroep wordt telkenmale voor tenminste vijf jaar toegewezen. Het Commissariaat
      kan jaarlijks de totale hoeveelheid zendtijd voor lokale of regionale omroep toewijzen. Het Commissariaat kan de
      dagen, uren en programmanetten aanwijzen waarop de programma’s van de instellingen die zendtijd hebben verkregen
      voor lokale en regionale omroep zullen worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
  - number: '42.5'
    text: |-
      De wijze waarop aanvragen tot toewijzing van zendtijd worden ingediend, de termijn waarbinnen beslissingen
      daarop worden genomen en de termijn waarop adviezen worden uitgebracht en waarop beslissingen inzake toewijzing
      of intrekking van zendtijd voor lokale en regionale omroep in werking treden, worden bij algemene maatregel van
      bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
  - number: '42.6'
    text: |-
      Indien er in een provincie geen regionale omroepinstelling is kan op aanvraag van het provinciaal bestuur zendtijd
      voor regionale omroep worden toegewezen aan de Stichting. In dat geval treedt de Stichting voor de toepassing van
      de desbetreffende bepalingen in de plaats van een regionale omroepinstelling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
  - number: '42.7'
    text: |-
      Indien de zendtijd is toegewezen aan de Stichting stelt deze een regionale programmaraad in. Het bepaalde in
      [artikel 30, onder c][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '30'
        hoofdstuk: III
        afdeling: '6'
  - number: '42.8'
    text: |-
      Indien zendtijd is toegewezen aan een lokale of regionale omroepinstelling kan het Commissariaat zendtijd
      toewijzen voor lokale en regionale omroep aan een gemeentebestuur en provinciaal bestuur ten behoeve van
      overheidsvoorlichting. Deze zendtijd bedraagt ten hoogste vijf percent van de zendtijd toegewezen aan de
      omroepinstelling. Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
  - number: '42.9'
    text: |-
      Indien aan een lokale of regionale omroepinstelling zendtijd is toegewezen voor een televisieprogramma, is het
      die instelling tevens toegestaan een toetsbeeld uit te zenden of te doen uitzenden en heeft zij tevens zendtijd
      voor een teletekstprogramma dat op dezelfde frequentieruimte tegelijkertijd met het televisieprogramma of met het
      toetsbeeld wordt uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
  - number: '42.10'
    text: |-
      Toewijzing van zendtijd aan een regionale instelling die binnen twee jaar in de plaats komt van een instelling die
      eerder zendtijd voor regionale omroep had verkregen, houdt in dat de eerstgenoemde voor de toepassing van deze wet
      wordt gezien als rechtsopvolger van de laatstgenoemde.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel42
  - number: '43.1'
    text: |-
      De toewijzing van zendtijd aan lokale en regionale omroepinstellingen geschiedt eerst nadat de gemeente dan wel de
      provincie heeft geadviseerd over de vraag of de instelling aan de eisen voldoet die deze wet stelt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43
  - number: '43.2'
    text: |-
      De gemeente dan wel de provincie brengt éénmaal in de vijf jaren aan het Commissariaat voor de Media advies uit
      over de vraag of de lokale of regionale omroepinstelling naar haar oordeel nog voldoet aan de in [artikel 30][ref1]
      gestelde eisen. Indien binnen deze termijn ernstige twijfel bestaat of de lokale of regionale omroepinstelling nog
      aan de in [artikel 30][ref2] gestelde eisen voldoet, kan het Commissariaat een tussentijds advies vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '30'
        hoofdstuk: III
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '30'
        hoofdstuk: III
        afdeling: '6'
  - number: '43.3'
    text: |-
      Voor regionale omroep wordt slechts zendtijd toegewezen indien het provinciaal bestuur zich bereid verklaart voor
      de bekostiging zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43
  - number: 43a
    text: |-
      Het is een lokale of regionale omroepinstelling waaraan zendtijd is toegewezen, toegestaan programma-onderdelen te
      verzorgen die bestaan uit reclameboodschappen en telewinkelboodschappen die zijn aangeboden door derden, alsmede
      een omlijsting daarvan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43a
  - number: 43b.1
    text: |-
      Het bepaalde bij of krachtens de [artikelen 39b][ref1], [41a][ref2] en [50, achtste lid][ref3], met betrekking
      tot de zendtijd van de Stichting Etherreclame is van overeenkomstige toepassing op de verzorging door lokale en
      regionale omroepinstellingen van programma-onderdelen als bedoeld in [artikel 43a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39b
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 41a
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '50'
        hoofdstuk: III
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
  - number: 43b.2
    text: |-
      Lokale en regionale omroepinstellingen die programma-onderdelen als bedoeld in [artikel 43a][ref1] verzorgen,
      dragen er zorg voor dat zij rechtstreeks of door middel van een belangenorganisatie aangesloten zijn bij de
      Nederlandse Reclame Code of een vergelijkbare door de Stichting Reclame Code tot stand gebrachte regeling en ter
      zake onderworpen zijn aan het toezicht van de Stichting Reclame Code. Zij tonen dit aan door middel van een aan het
      Commissariaat voor de Media over te leggen schriftelijke verklaring van de Stichting Reclame Code.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
  - number: 43c.1
    text: |-
      De inkomsten die worden verworven door de uitzending van de in [artikel 43a][ref1] bedoelde programma-onderdelen
      worden, na aftrek van de kosten die verband houden met de verzorging van die programma-onderdelen en het met
      toepassing van [artikel 128][ref2] vastgestelde bedrag, aangewend voor de verzorging van de overige programma-
      onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel128
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '128'
        hoofdstuk: IX
  - number: 43c.2
    text: |-
      Lokale en regionale omroepinstellingen die programma-onderdelen als bedoeld in [artikel 43a][ref1] verzorgen,
      voldoen jaarlijks het met toepassing van [artikel 128][ref2] vastgestelde bedrag aan het Commissariaat voor de
      Media. Het Commissariaat stelt dit bedrag ter beschikking van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel128
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '128'
        hoofdstuk: IX
  - number: 43c.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop inzicht moet worden verschaft
      in de financiën die op de exploitatie van de verzorging en uitzending van de programma-onderdelen als bedoeld in
      [artikel 43a][ref1] betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
  - number: 43c.4
    text: |-
      [Artikel 64, eerste lid, onderdeel d][ref1], is van overeenkomstige toepassing op lokale en regionale
      omroepinstellingen die programma-onderdelen als bedoeld in [artikel 43a][ref2] verzorgen, en hun medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '64'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
  - number: '44'
    text: |-
      De zendtijd van een omroepvereniging en de educatieve omroepinstelling die een erkenning of een voorlopige
      erkenning heeft verkregen, vervalt op het tijdstip waarop de erkenning of voorlopige erkenning vervalt of wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel44
  - number: '45.1'
    text: |-
      Het Commissariaat voor de Media trekt de met toepassing van een van de [artikelen, 39f][ref1], [39g][ref2] of
      [42][ref3] toegewezen zendtijd in, wanneer de desbetreffende instelling niet meer voldoet aan de eisen die worden
      gesteld om voor toewijzing in aanmerking te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39g
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel42
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39f
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 39g
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '42'
        hoofdstuk: III
        afdeling: '2'
  - number: '45.2'
    text: |-
      Indien van een instelling de toegewezen zendtijd is ingetrokken op grond van het eerste lid, kan zij gedurende één
      jaar daarna geen aanvraag tot toewijzing van zendtijd indienen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel45
  - number: '45.3'
    text: |-
      In afwijking van het eerste lid trekt het Commissariaat de zendtijd die is toegewezen aan een lokale of regionale
      omroepinstelling die niet meer voldoet aan een in [artikel 30, onderdeel b of c][ref1], gesteld vereiste, niet
      in dan nadat de desbetreffende omroepinstelling gedurende vier maanden, gerekend van de dag waarop dit feit is
      geconstateerd, in de gelegenheid is gesteld wederom aan dit vereiste te voldoen en zij daarin niet is geslaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '30'
        hoofdstuk: III
        afdeling: '6'
  - number: '45.4'
    text: |-
      De aan een lokale of regionale omroepinstelling toegewezen zendtijd kan door het Commissariaat worden ingetrokken
      indien de lokale of regionale omroepinstelling in een periode van een jaar geen programma, dat voldoet aan de eisen
      van deze wet, heeft verzorgd dat gedurende een ononderbroken periode van ten minste twee maanden is uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel45
  - number: '45.5'
    text: |-
      Het Commissariaat stelt de gemeente, respectievelijk de provincie in de gelegenheid haar zienswijze naar voren te
      brengen alvorens te beslissen over intrekking van de zendtijd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel45
  - number: 45a
    text: |-
      Indien aan een politieke partij met toepassing van [artikel 39g, derde lid][ref1], geen zendtijd meer wordt
      toegewezen, dan vervalt met ingang van de dag waarop de veroordeling, bedoeld in [artikel 39g, derde lid][ref2],
      onherroepelijk is geworden, ook de zendtijd die reeds is toegewezen van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39g
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39g
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39g
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 39g
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '46.1'
    text: |-
      Indien de Programmastichting, een omroepvereniging of de educatieve omroepinstelling die een erkenning of
      een voorlopige erkenning heeft verkregen, niet voldoet aan de verplichtingen die bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1] voor haar gelden, kan het Commissariaat voor de Media de
      aan de desbetreffende instelling ter beschikking gestelde zendtijd voor een periode van ten hoogste twaalf weken
      intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '46.2'
    text: |-
      In geval van zendtijdintrekking als bedoeld in het eerste lid wordt de zendtijd die krachtens
      [artikel 39, eerste tot en met derde lid][ref1], onderscheidenlijk [artikel 39][ref2], in het jaar waarin de
      intrekking plaatsvindt aan de desbetreffende instelling ter beschikking is gesteld, van rechtswege evenredig
      verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 39a
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '46.3'
    text: |-
      Gedurende de periode waarvoor de zendtijd op grond van het eerste lid is ingetrokken, is
      [artikel 39, vierde lid][ref1], onderscheidenlijk [artikel 39][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 39a
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '46.4'
    text: |-
      Gedurende de periode waarvoor de zendtijd op grond van het eerste lid is ingetrokken, bestaat geen recht op de
      vergoeding, bedoeld in [artikel 104, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel104
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '104'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 46a.1
    text: |-
      Indien een andere instelling dan bedoeld in [artikel 46, eerste lid][ref1], die zendtijd
      heeft verkregen, niet voldoet aan de verplichtingen die bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2] voor haar gelden, kan het Commissariaat voor de Media de aan
      die instelling toegewezen zendtijd intrekken of verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '46'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 46a.2
    text: |-
      Gedurende de periode waarvoor de zendtijd op grond van het eerste lid is ingetrokken, bestaat geen recht op de
      vergoeding, bedoeld in [artikel 104, tweede en derde lid][ref1]. Gedurende de periode waarvoor de zendtijd op
      grond van het eerste lid is verminderd, wordt de vergoeding, bedoeld in [artikel 104, tweede en derde lid][ref2],
      evenredig verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel104
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '104'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '104'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '47.1'
    text: |-
      Indien aan een instelling die zendtijd heeft verkregen voor landelijke omroep voor twee achtereenvolgende jaren
      een sanctie als bedoeld in [artikel 103a][ref1] is opgelegd, dan wel indien een omroepvereniging of de educatieve
      omroepinstelling naar het oordeel van de raad van bestuur onvoldoende uitvoering geeft aan de bereidheid tot
      samenwerking, bedoeld in [artikel 32, derde lid][ref2], kan de raad van bestuur het Commissariaat voor de Media
      verzoeken met overeenkomstige toepassing van de [artikelen 46][ref3] en [46a][ref4] de aan de desbetreffende
      instelling toegewezen zendtijd in te trekken of te verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel103a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel46a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 103a
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '46'
        hoofdstuk: III
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 46a
        hoofdstuk: III
        afdeling: '3'
  - number: '47.2'
    text: |-
      Bij een intrekking of vermindering van zendtijd voor landelijke omroep krachtens [artikel 46a][ref1], alsmede bij
      een tussentijdse toewijzing van zendtijd op grond van een van de [artikelen 39f tot en met 39h][ref2], kan het
      Commissariaat voor de Media, voor zover nodig, de toewijzing van zendtijd aan de andere instellingen, bedoeld in de
      [artikelen 39f tot en met 39h][ref3], herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 46a
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 39f
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 39f
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '48'
    text: |-
      Iedere instelling die zendtijd heeft verkregen bepaalt, onverminderd het bij of krachtens de wet bepaalde, vorm en
      inhoud van haar programma en is verantwoordelijk voor hetgeen in haar zendtijd wordt uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel48
  - number: '49.1'
    text: |-
      De omroepverenigingen en de educatieve omroepinstelling die zendtijd hebben verkregen, gebruiken de hun krachtens
      [artikel 39, eerste tot en met derde lid][ref1], ter beschikking gestelde zendtijd geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '49.2'
    text: |-
      De Programmastichting gebruikt de haar krachtens [artikel 39][ref1], ter beschikking gestelde zendtijd geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39a
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '49.3'
    text: |-
      De Stichting gebruikt de haar krachtens [artikel 39][ref1], ter beschikking gestelde zendtijd geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39a1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39a1
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '49.4'
    text: |-
      De overige instellingen die zendtijd voor landelijke omroep hebben verkregen, met uitzondering van de Stichting
      Etherreclame, gebruiken de hun met toepassing van de [artikelen 39f tot en met 39i][ref1] toegewezen zendtijd
      geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39f
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '50.1'
    text: |-
      De zendtijd voor televisie van de omroepverenigingen gezamenlijk wordt gebruikt voor een volledig programma, dat
      ten minste omvat onderdelen van culturele, informatieve, educatieve en verstrooiende aard.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
  - number: '50.2'
    text: |-
      Onverminderd het eerste lid, wordt jaarlijks van de zendtijd, bedoeld in het eerste lid, ten minste vijfentwintig
      procent gebruikt voor onderdelen van culturele aard en vijfendertig procent voor onderdelen van informatieve of
      educatieve aard. Een deel van de programma-onderdelen van culturele aard, dat ten minste gelijk is aan twaalf en
      een half procent van de gebruikte zendtijd voor televisie van de omroepverenigingen gezamenlijk, bestaat uit of
      heeft betrekking op kunst.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
  - number: '50.3'
    text: |-
      Indien een programma-onderdeel van informatieve, educatieve of verstrooiende aard tevens wat zijn inhoud betreft
      voor meer dan de helft van culturele aard is, kan dit programma-onderdeel meegeteld worden bij de berekening van
      het percentage programma-onderdelen van culturele aard, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
  - number: '50.4'
    text: De educatieve omroepinstelling gebruikt haar zendtijd geheel voor een educatief programma.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
  - number: '50.5'
    text: Een kerkgenootschap gebruikt zijn zendtijd geheel voor een kerkelijk programma.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
  - number: '50.6'
    text: Een genootschap op geestelijke grondslag gebruikt zijn zendtijd geheel voor een programma op geestelijk terrein.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
  - number: '50.7'
    text: Een politieke partij gebruikt haar zendtijd geheel voor een programma op politiek terrein.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
  - number: '50.8'
    text: |-
      De Stichting Etherreclame gebruikt haar zendtijd voor een programma bestaande uit reclameboodschappen en
      telewinkelboodschappen die zijn aangeboden door derden. Voor ten hoogste een derde deel kan de zendtijd worden
      gebruikt voor omlijsting van de reclameboodschappen en telewinkelboodschappen. Telewinkelboodschappen die in het
      programma van de Stichting Etherreclame worden opgenomen duren elk ten hoogste één minuut. Een blok als bedoeld
      in [artikel 41a, vijfde lid][ref1], bestaat voor ten hoogste tweederde van de duur uit telewinkelboodschappen.
      Het programma van de Stichting Etherreclame is als zodanig herkenbaar en door optische of akoestische middelen
      duidelijk onderscheiden van de programma-onderdelen van de andere instellingen die zendtijd hebben verkregen. In
      het programma van de Stichting Etherreclame wordt geen gebruik gemaakt van subliminale technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 41a
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
  - number: '50.9'
    text: |-
      De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], er zorg voor dat het gebruik van de zendtijd op de
      televisieprogrammanetten voldoet aan het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '51.1'
    text: |-
      Op elk televisieprogrammanet wordt ten hoogste vijfentwintig procent van de totale hoeveelheid zendtijd op het
      televisieprogrammanet van omroepinstellingen die zendtijd hebben verkregen voor landelijke omroep besteed aan
      programma-onderdelen van verstrooiende aard.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51
  - number: '51.2'
    text: |-
      De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], er zorg voor dat het gebruik van de zendtijd op de
      televisieprogrammanetten voldoet aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 51b.1
    text: |-
      De Programmastichting gebruikt haar zendtijd geheel voor een programma dat bestaat uit onderdelen die voorzien in
      de bevrediging van in het volk levende maatschappelijke, culturele, godsdienstige of geestelijke behoeften, zodanig
      dat dit programma te zamen met de programma’s van de andere instellingen die zendtijd voor landelijke omroep
      hebben verkregen, een evenwichtig beeld oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke
      verscheidenheid in Nederland.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51b
  - number: 51b.2
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke programma-onderdelen als bedoeld in het eerste lid in
      het programma van de Programmastichting worden opgenomen. Bij deze algemene maatregel van bestuur kan tevens
      worden bepaald welke percentages van het programma van de Programmastichting ten minste dienen te bestaan uit de
      onderscheidene programma-onderdelen, bedoeld in de vorige zin.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51b
  - number: 51b.3
    text: |-
      Naast de programma-onderdelen, bedoeld in het tweede lid, bevat het programma van de Programmastichting ten minste
      veertig procent onderdelen van culturele aard, waarvan een deel dat ten minste gelijk is aan twintig procent van de
      gebruikte zendtijd van de Programmastichting, bestaat uit of betrekking heeft op kunst.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51b
  - number: 51c
    text: |-
      De verplichtingen, bedoeld in de [artikelen 50, eerste en tweede lid][ref1], en [51][ref2], gelden met betrekking
      tot televisie zowel voor de gehele zendtijd die is gebruikt, als afzonderlijk voor de zendtijd die is gebruikt
      tussen 16.00 uur en 24.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '50'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 51b
        hoofdstuk: III
        afdeling: '1'
  - number: 51d.1
    text: |-
      De Stichting gebruikt haar zendtijd, bedoeld in [artikel 39][ref1], geheel voor een programma dat bestaat uit
      onderdelen die zich bij uitstek voor een gezamenlijke verzorging lenen. Hiertoe behoren die programma-onderdelen
      die een hoge frequentie en vaste regelmaat van uitzending vereisen, een algemeen dienstverlenend karakter dragen,
      of met een doelmatiger inzet van omroepmiddelen beter gezamenlijk tot stand kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39a1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39a1
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: 51d.2
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke programma-onderdelen als bedoeld in het eerste lid in ieder
      geval in het programma van de Stichting worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51d
  - number: 51e
    text: 'Een regionale omroepinstelling gebruikt haar zendtijd voor een programma dat:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51e
  - number: 51e.a
    text: |-
      voor ten minste vijftig procent bestaat uit onderdelen van informatieve, culturele en educatieve aard, die in het
      bijzonder betrekking hebben op de provincie waarvoor het programma bestemd is; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51e
  - number: 51e.b
    text: |-
      voor ten minste een bij algemene maatregel van bestuur vast te stellen percentage bestaat uit onderdelen die door
      haarzelf of uitsluitend in haar opdracht zijn geproduceerd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51e
  - number: 51f.1
    text: 'Een lokale omroepinstelling gebruikt haar zendtijd voor een programma dat:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: 51f.1.a
    text: |-
      voor ten minste vijftig procent bestaat uit onderdelen van informatieve, culturele en educatieve aard, die in het
      bijzonder betrekking hebben op de gemeente waarvoor het programma bestemd is; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: 51f.1.b
    text: |-
      voor ten minste een bij algemene maatregel van bestuur vast te stellen percentage bestaat uit onderdelen die door
      haarzelf of uitsluitend in haar opdracht zijn geproduceerd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: 51f.2
    text: |-
      Het is een lokale omroepinstelling toegestaan met de regionale omroepinstelling in wier verzorgingsgebied zij
      werkzaam is, een overeenkomst te sluiten met het oog op de samenwerking bij de verzorging van haar radioprogramma,
      onderscheidenlijk televisieprogramma. Daarbij kan worden overeengekomen dat de regionale omroepinstelling
      programma-onderdelen produceert ten behoeve van de lokale omroepinstelling. Tevens kan worden overeengekomen dat de
      lokale omroepinstelling programma-onderdelen produceert ten behoeve van de regionale omroepinstelling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: 51f.3
    text: Een overeenkomst als bedoeld in het tweede lid wordt overgelegd aan het Commissariaat voor de Media.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: 51f.4
    text: |-
      In afwijking van het eerste lid is het een lokale omroepinstelling die een overeenkomst als bedoeld in het tweede
      lid heeft gesloten en deze aan het Commissariaat heeft overgelegd, toegestaan haar zendtijd te gebruiken voor een
      radioprogramma, onderscheidenlijk televisieprogramma, dat:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: 51f.4.a
    text: |-
      voor ten minste vijftig procent bestaat uit onderdelen van informatieve, culturele en educatieve aard, die in
      het bijzonder betrekking hebben op de gemeente waarvoor het programma bestemd is, of op de provincie waarbinnen
      die gemeente gelegen is, met dien verstande dat ten minste een bij algemene maatregel van bestuur vast te stellen
      gedeelte daarvan in het bijzonder betrekking heeft op de gemeente waarvoor het programma bestemd is; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: 51f.4.b
    text: |-
      voor ten minste het percentage, bedoeld in het eerste lid, onderdeel *b*, bestaat uit onderdelen die door haarzelf
      of door de regionale omroepinstelling waarmee zij de overeenkomst heeft gesloten, dan wel uitsluitend in opdracht
      van een van hen of van hen beiden, zijn geproduceerd, met dien verstande dat ten minste een bij algemene maatregel
      van bestuur vast te stellen gedeelte daarvan door de lokale omroepinstelling zelf of uitsluitend in haar opdracht
      is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel51f
  - number: '52.1'
    text: |-
      De programma’s van instellingen die zendtijd hebben verkregen bevatten geen reclameboodschappen en
      telewinkelboodschappen tenzij zulks bij deze wet uitdrukkelijk wordt toegestaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52
  - number: '52.2'
    text: |-
      De programma’s als bedoeld in het eerste lid bevatten voorts geen andere reclame-uitingen tenzij dit niet
      vermijdbaar is. Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een reclame-uiting in een
      programma niet vermijdbaar kan worden geacht, alsmede wanneer het is toegestaan dat programma’s reclame-uitingen
      bevatten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52
  - number: '52.3'
    text: |-
      Onze Minister kan in bijzondere gevallen ontheffing verlenen van het bepaalde in de eerste volzin van het tweede
      lid. Hij kan deze bevoegdheid delegeren aan het Commissariaat voor de Media.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52
  - number: '52.4'
    text: |-
      Behoudens toestemming van het Commissariaat bevatten programma’s van instellingen die zendtijd hebben verkregen
      geen oproepen in het kader van ledenwerving, verenigingsactiviteiten of nevenactiviteiten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52
  - number: 52a.1
    text: Programma-onderdelen van instellingen die zendtijd hebben verkregen worden niet gesponsord.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52a.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52a.2.a
    text: programma-onderdelen van culturele aard;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52a.2.b
    text: |-
      programma-onderdelen, bestaande uit het verslag of de weergave van een of meer sportevenementen of
      sportwedstrijden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52a.2.c
    text: programma-onderdelen bestaande uit het verslag of de weergave van evenementen ten behoeve van ideële doeleinden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52a.3
    text: 'Programma-onderdelen als bedoeld in het tweede lid worden niet gesponsord indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52a.3.a
    text: deze geheel of gedeeltelijk bestaan uit nieuws, actualiteiten of politieke informatie; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52a.3.b
    text: in het bijzonder zijn bestemd voor minderjarigen beneden de leeftijd van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52a
  - number: 52b.1
    text: |-
      In afwijking van de eerste volzin van [artikel 52, tweede lid][ref1], worden aan het begin of aan het einde van een
      gesponsord programma-onderdeel van een instelling die zendtijd heeft verkregen, ter informatie van het publiek alle
      sponsors vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '52'
        hoofdstuk: III
        afdeling: '1'
  - number: 52b.2
    text: |-
      Met betrekking tot een gesponsord programma-onderdeel voor televisie duurt de vermelding van de sponsors in totaal
      ten hoogste vijf seconden. De vermelding gebeurt door middel van naam of (beeld)merk. Voor zover de vermelding
      niet plaatsvindt op de aan- of aftitelrol, bestaat zij uitsluitend uit stilstaande beelden. De vermelding is niet
      beeldvullend en is voorts zodanig vormgegeven dat zij niet voldoet aan de definitie van reclameboodschap, bedoeld
      in [artikel 1, onderdeel kk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
        hoofdstuk: I
  - number: 52b.3
    text: |-
      In een gesponsord programma-onderdeel worden geen produkten of diensten van een sponsor getoond of vermeld, indien
      deze een sponsorbijdrage in geld heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52b
  - number: 52b.4
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op een programma-onderdeel waarvoor een
      overheidsinstelling of een andere instelling dan bedoeld in [artikel 1, onderdeel ll][ref1], een financiële of
      andere bijdrage heeft verstrekt ten behoeve van de totstandkoming of aankoop van dat programma-onderdeel, teneinde
      de uitzending daarvan als programma-onderdeel te bevorderen of mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
        hoofdstuk: I
  - number: 52c
    text: |-
      Indien een gesponsord programma-onderdeel uit het buitenland is aangekocht en aldaar ten behoeve van het
      buitenlandse publiek reeds als programma is uitgezonden, zijn de [artikelen 52][ref1] en [52][ref2] slechts van
      toepassing, voor zover de sponsorbijdragen worden verstrekt ten behoeve van de aankoop van het programma-onderdeel
      door de instelling die zendtijd heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel52b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 52a
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 52b
        hoofdstuk: III
        afdeling: '1'
  - number: 52d.1
    text: |-
      Het televisieprogramma van een instelling die zendtijd heeft verkregen bevat geen programma-onderdelen die de
      lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger dan zestien jaar ernstige schade zouden
      kunnen toebrengen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52d
  - number: 52d.2
    text: |-
      Het televisieprogramma van een instelling die zendtijd heeft verkregen mag slechts programma-onderdelen bevatten
      die schade kunnen toebrengen aan de lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger dan
      zestien jaar, indien die instelling is aangesloten bij een door Onze Minister erkende organisatie als bedoeld
      in [artikel 53, eerste lid][ref1], en ter zake gebonden is aan de regels en het toezicht daarop van die erkende
      organisatie met betrekking tot het uitzenden van de hiervoor bedoelde programma-onderdelen. De instelling die
      zendtijd heeft verkregen en die is aangesloten toont dit aan door middel van een aan het Commissariaat voor de
      Media over te leggen schriftelijke verklaring van de erkende organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel53
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '53'
        hoofdstuk: III
        afdeling: '1'
  - number: '53.1'
    text: |-
      Onze Minister kan een organisatie erkennen die voorziet in regelingen omtrent classificatie en het uitzenden van
      programma-onderdelen als bedoeld in [artikel 52d, tweede lid][ref1], en het toezicht daarop. De regelingen hebben
      in ieder geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 52d
        hoofdstuk: III
        afdeling: '1'
  - number: 53.1.a
    text: 'criteria voor de classificatie van programma-onderdelen, waaronder in ieder geval de mate waarin:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.1.a.1°
    text: angst wordt opgewekt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.1.a.2°
    text: brutaliserend geweld wordt vertoond of gerechtvaardigd;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.1.a.3°
    text: het gebruik van drugs aantrekkelijk wordt voorgesteld of vergoelijkt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.1.a.4°
    text: sprake is van pornografie;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.1.a.5°
    text: |-
      op andere gronden volgens algemeen geldende opvattingen producten niet geschikt zijn voor vertoning aan bepaalde
      categorieën personen jonger dan zestien jaar;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.1.b
    text: de uitzendtijdstippen van de hiervoor bedoelde programma-onderdelen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.1.c
    text: |-
      de wijze waarop de uitzending van deze programma-onderdelen wordt voorafgegaan door of is voorzien van symbolen
      of waarschuwingen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: '53.2'
    text: |-
      Aan een erkenning kunnen voorschriften worden verbonden. Van een beschikking tot erkenning wordt mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: '53.3'
    text: 'Een organisatie komt slechts voor erkenning in aanmerking indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.3.a
    text: |-
      onafhankelijk toezicht door de organisatie op de naleving van de regelingen, bedoeld in het eerste lid, is
      gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.3.b
    text: |-
      voorzien is in voldoende betrokkenheid van belanghebbenden, waaronder in ieder geval vertegenwoordigers uit de
      consumentensfeer, instellingen die zendtijd hebben verkregen, deskundigen op het gebied van de audiovisuele media
      en producenten van audiovisuele media;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53.3.c
    text: de financiële positie van de organisatie een adequate uitvoering van de werkzaamheden waarborgt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: '53.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de eisen
      bedoeld in het derde lid en kunnen andere eisen ten aanzien van de erkenning worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: '53.5'
    text: |-
      Onze Minister trekt een erkenning in indien de organisatie niet meer voldoet aan de bij of krachtens het eerste
      of derde lid gestelde eisen. Onze Minister kan voorts een erkenning intrekken indien de organisatie niet voldoet
      aan de in het tweede lid bedoelde voorschriften of de in het vierde lid bedoelde nadere en andere eisen. Van een
      beschikking tot intrekking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: '53.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen het eerste tot en met vierde lid en [artikel 52d, tweede lid][ref1],
      buiten werking worden gesteld en kunnen regels worden gesteld omtrent het uitzenden van programma-onderdelen als
      bedoeld in [artikel 52d, tweede lid][ref2], voor zover dat noodzakelijk is voor een juiste en tijdige uitvoering
      van artikel 22 van de Europese richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 52d
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 52d
        hoofdstuk: III
        afdeling: '1'
  - number: '53.7'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het zesde lid vastgestelde algemene maatregel van bestuur wordt
      een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal ingediend.
      Wordt het voorstel tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van
      inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: '53.8'
    text: |-
      De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53
  - number: 53a
    text: |-
      Een instelling die zendtijd heeft verkregen neemt in haar programma geen films op buiten de met de rechthebbenden
      overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel53a
  - number: '54.1'
    text: |-
      Op elk televisieprogrammanet wordt van de totale hoeveelheid zendtijd op het televisieprogrammanet van
      omroepinstellingen die zendtijd hebben verkregen voor landelijke omroep ten minste vijftig procent besteed aan
      programma-onderdelen die kunnen worden aangemerkt als Europese producties in de zin van artikel 6 van de Europese
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: '54.2'
    text: |-
      Van de totale hoeveelheid zendtijd van omroepinstellingen die zendtijd hebben verkregen voor landelijke omroep
      wordt ten minste vijfentwintig procent besteed aan programma-onderdelen als bedoeld in het eerste lid, die kunnen
      worden aangemerkt als onafhankelijke producties. Op elk televisieprogrammanet wordt van de totale hoeveelheid
      zendtijd op het televisieprogrammanet van omroepinstellingen die zendtijd hebben verkregen voor landelijke omroep
      ten minste zeventieneneenhalf procent besteed aan programma-onderdelen als bedoeld in de vorige volzin. Als
      onafhankelijke producties worden aangemerkt programma-onderdelen die niet zijn geproduceerd door:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.2.a
    text: |-
      een instelling die zendtijd voor landelijke omroep heeft verkregen, of een andere instelling die een programma
      verzorgt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.2.b
    text: |-
      een rechtspersoon waarin een instelling die een programma verzorgt, al dan niet door middel van een of meer van
      haar dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.2.c
    text: |-
      een rechtspersoon waarin twee of meer instellingen die een programma verzorgen, al dan niet door middel van een of
      meer van hun onderscheidene dochtermaatschappijen, tezamen een belang van meer dan vijftig procent hebben; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.2.d
    text: |-
      een vennootschap waarin een instelling die een programma verzorgt, dan wel een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: '54.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het tweede lid
      en kunnen regels worden gesteld op grond waarvan in andere dan de in het tweede lid, onderdelen a tot en met d,
      bedoelde gevallen programma-onderdelen worden aangemerkt als onafhankelijke producties.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: '54.4'
    text: |-
      Voor de toepassing van dit artikel worden de volgende programma-onderdelen voor televisie buiten beschouwing
      gelaten:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.4.a
    text: programma-onderdelen, bestaande uit nieuws;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.4.b
    text: programma-onderdelen die betrekking hebben op sport;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.4.c
    text: |-
      programma-onderdelen die het karakter van een spel hebben, met uitzondering van programma-onderdelen van culturele
      of educatieve aard, die mede het karakter van een spel hebben;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54.4.d
    text: het teletekstprogramma voor landelijke omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: '54.5'
    text: |-
      Dit artikel is niet van toepassing op de zendtijd van de Stichting Etherreclame, overheidsinstellingen,
      kerkgenootschappen, genootschappen op geestelijke grondslag en politieke partijen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: '54.6'
    text: |-
      Instellingen die zendtijd hebben verkregen voor regionale omroep, besteden ten minste vijftig procent van hun
      zendtijd aan programma-onderdelen die kunnen worden aangemerkt als Europese producties in de zin van artikel 6 van
      de Europese richtlijn. Instellingen die zendtijd hebben verkregen voor regionale omroep, besteden ten minste tien
      procent van hun zendtijd aan programma-onderdelen als bedoeld in de vorige volzin, die kunnen worden aangemerkt
      als onafhankelijke producties. Het tweede lid, derde volzin en onderdelen a tot en met d, en het derde tot en met
      vijfde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: '54.7'
    text: |-
      De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], er zorg voor dat het gebruik van de zendtijd voldoet aan het bepaalde
      bij of krachtens het eerste tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '54.8'
    text: |-
      Ten minste een derde deel van de programmaonderdelen, bedoeld in het tweede lid, eerste volzin, en het zesde lid,
      tweede volzin, is niet ouder dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54
  - number: 54a.1
    text: |-
      Instellingen die zendtijd hebben verkregen, besteden ten minste vijftig procent van hun zendtijd voor televisie aan
      oorspronkelijk Nederlands- of Friestalige programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54a
  - number: 54a.2
    text: |-
      Het eerste lid is niet van toepassing op de Stichting Etherreclame, overheidsinstellingen, kerkgenootschappen,
      genootschappen op geestelijke grondslag en politieke partijen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54a
  - number: 54a.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welk percentage van de totale hoeveelheid zendtijd van
      omroepinstellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van de Stichting
      Etherreclame, bestaat uit programma-onderdelen als bedoeld in het eerste lid, die voorzien zijn van ondertiteling
      ten behoeve van mensen met een auditieve beperking.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54a
  - number: 54a.4
    text: |-
      De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in artikel 19a, eerste lid,
      onderdeel f, er zorg voor dat het gebruik van de zendtijd voldoet aan het bepaalde bij of krachtens het derde lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel54a
  - number: '55.1'
    text: |-
      Instellingen die zendtijd hebben verkregen zijn met al hun activiteiten, behoudens het bepaalde in de
      [artikelen 26][ref1], [43a][ref2], [52][ref3] en [52b][ref4], niet dienstbaar aan het maken van winst door derden.
      Desgevraagd tonen zij dit ten genoegen van het Commissariaat voor de Media aan.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel52b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '26'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '52'
        hoofdstuk: III
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 52b
        hoofdstuk: III
        afdeling: '1'
  - number: '55.2'
    text: |-
      Indien een instelling voornemens is een overeenkomst te sluiten met een werknemer, een bestuurslid van de
      instelling of een van hun huisgenoten, dan wel met een rechtspersoon waarin een of meer van de genoemde personen
      alleen of tezamen een financieel belang hebben van tenminste tien percent of ten aanzien waarvan zij tantième-
      of winstrechten hebben, terwijl die overeenkomst geen betrekking heeft op de relatie die de instelling met de
      betrokkene heeft als werknemer of bestuurslid, meldt de instelling dit schriftelijk bij het Commissariaat voor
      de Media onder overlegging van het ontwerp van de overeenkomst. Een dergelijke overeenkomst wordt schriftelijk
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55
  - number: '55.3'
    text: |-
      Het bepaalde in de voorgaande leden heeft ten aanzien van de educatieve omroepinstelling, overheidsinstellingen,
      kerkgenootschappen, genootschappen op geestelijke grondslag en politieke partijen uitsluitend betrekking op hun
      werkzaamheden die strekken tot de verzorging van hun radio- en televisieprogramma's.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55
  - number: 55a.1
    text: |-
      Onverminderd [artikel 48][ref1] is het aan een instelling die zendtijd heeft verkregen voor landelijke
      omroep uitsluitend toegestaan overeenkomsten te sluiten met omroepinstellingen, dan wel met rechtspersonen of
      vennootschappen waarmee bedoelde instellingen in een groep zijn verbonden, indien die instelling het voornemen
      hiertoe schriftelijk heeft gemeld bij de raad van bestuur, onder overlegging van het ontwerp van de overeenkomst,
      en de raad van bestuur binnen twee maanden niet heeft medegedeeld dat de desbetreffende overeenkomst in strijd
      is met het gemeenschappelijke belang van de landelijke omroep. Een dergelijke overeenkomst wordt schriftelijk
      aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel48
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '48'
        hoofdstuk: III
        afdeling: '1'
  - number: 55a.2
    text: |-
      Het eerste lid is niet van toepassing op overeenkomsten die worden gesloten met instellingen die zendtijd hebben
      verkregen voor binnenlandse omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55a
  - number: 55a.3
    text: |-
      Het eerste lid heeft ten aanzien van de educatieve omroepinstelling, overheidsinstellingen, kerkgenootschappen,
      genootschappen op geestelijke grondslag en politieke partijen uitsluitend betrekking op overeenkomsten die
      betrekking hebben op hun werkzaamheden die strekken tot de verzorging van hun radio- en televisieprogramma's.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55a
  - number: 55b.1
    text: |-
      Het is aan een instelling die zendtijd heeft verkregen voor landelijke omroep uitsluitend toegestaan activiteiten
      als bedoeld in [artikel 13c, derde lid][ref1], te verrichten, indien die instelling het voornemen daartoe
      schriftelijk heeft gemeld bij de raad van bestuur, en de raad van bestuur niet binnen twee maanden heeft meegedeeld
      dat het verrichten van de desbetreffende activiteiten in strijd is met het gemeenschappelijke belang van de
      landelijke omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 55b.2
    text: |-
      [Artikel 57a, eerste lid][ref1], is van overeenkomstige toepassing op het verrichten van activiteiten als bedoeld
      in [artikel 13c, derde lid][ref2]. Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent het
      verrichten van activiteiten als bedoeld in [artikel 13c, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel57a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 57a
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 55b.3
    text: |-
      Dit artikel is niet van toepassing op overheidsinstellingen, kerkgenootschappen, genootschappen op geestelijke
      grondslag en politieke partijen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel55b
  - number: '56.1'
    text: |-
      Een instelling die zendtijd heeft verkregen draagt er zorg voor dat noch de leden van het bestuur, noch haar
      werknemers, behoudens met toestemming van het bestuur, en andere personen of rechtspersonen waarmee de instelling
      een overeenkomst heeft gesloten met het oog op de verzorging van haar programma voor zichzelf, voor andere personen
      of voor rechtspersonen een op geld waardeerbaar voordeel van derden bedingen of aanvaarden, dat direct of indirect
      verband houdt met werkzaamheden van de betrokkene voor de instelling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56
  - number: '56.2'
    text: |-
      De in het eerste lid bedoelde toestemming geeft de instelling slechts indien de betrokkene aannemelijk maakt dat
      het voordeel niet is bedoeld als tegenprestatie voor het door hem in de uitoefening van zijn werkzaamheden voor de
      instelling bieden of bevorderen van mogelijkheden tot het maken van winst door derden of het dienstbaar maken van
      het radio- of televisieprogramma aan reclamedoeleinden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56
  - number: '56.3'
    text: |-
      Voor personen die werken in dienst van een persoon of rechtspersoon die een overeenkomst als bedoeld in het eerste
      lid heeft gesloten met een instelling die zendtijd heeft verkregen, wordt die persoon of rechtspersoon ten opzichte
      van degenen die in zijn dienst werken niet aangemerkt als een derde.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56
  - number: 56a.1
    text: |-
      Onverminderd [artikel 52a, eerste en derde lid][ref1], mogen instellingen die zendtijd hebben verkregen,
      sponsorbijdragen uitsluitend rechtstreeks van de sponsors en door middel van een schriftelijke overeenkomst
      bedingen of aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 52a
        hoofdstuk: III
        afdeling: '1'
  - number: 56a.2
    text: |-
      Instellingen die zendtijd hebben verkregen voor landelijke omroep, doen binnen één week na de totstandkoming
      van een overeenkomst als bedoeld in het eerste lid, doch in ieder geval vóór de beoogde datum van uitzending van
      het programma-onderdeel waarop de overeenkomst betrekking heeft, een afschrift hiervan toekomen aan de raad van
      bestuur.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
  - number: 56a.3
    text: |-
      Indien de raad van bestuur een dergelijke overeenkomst in strijd acht met het gemeenschappelijk belang van de
      landelijke omroep, en de raad van bestuur dit binnen twee weken na ontvangst van het afschrift van de overeenkomst,
      doch in ieder geval vóór de beoogde datum van uitzending van het programma-onderdeel waarop de overeenkomst
      betrekking heeft, schriftelijk heeft medegedeeld aan de instelling die de overeenkomst heeft overgelegd, neemt deze
      instelling het programma-onderdeel waarop de overeenkomst betrekking heeft, niet in haar programma op, tenzij de
      overeenkomst wordt ontbonden of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
  - number: 56a.4
    text: Indien de overeenkomst wordt gewijzigd, zijn het tweede en derde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
  - number: 56a.5
    text: |-
      Instellingen die zendtijd hebben verkregen, bedingen of aanvaarden geen sponsorbijdragen van personen, bedrijven
      of instellingen:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
  - number: 56a.5.a
    text: die zich voornamelijk bezighouden met de produktie of verkoop van sigaretten of andere tabaksprodukten, of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
  - number: 56a.5.b
    text: |-
      die gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen
      als bedoeld in onderdeel a, of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de indruk
      krijgt dat het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld in onderdeel
      a betreft.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
  - number: 56a.6
    text: |-
      Indien een gesponsord programma-onderdeel uit het buitenland is aangekocht en ten behoeve van het buitenlandse
      publiek reeds als programma is uitgezonden, is dit artikel slechts van toepassing, voor zover de sponsorbijdragen
      worden verstrekt ten behoeve van de aankoop van het programma-onderdeel door de instelling die zendtijd heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel56a
  - number: '57.1'
    text: |-
      Alle activiteiten en werkzaamheden van een instelling die zendtijd heeft verkregen, die niet rechtstreeks verband
      houden met of ten dienste staan van de uitoefening van de taak, bedoeld in [artikel 13c, eerste lid][ref1], worden
      aangemerkt als nevenactiviteiten, met uitzondering van de verenigingsactiviteiten van een omroepvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: '57.2'
    text: |-
      Met het verrichten van een nevenactiviteit wordt gelijkgesteld het hebben van een direct of indirect belang in een
      rechtspersoon die een dergelijke activiteit verricht.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57
  - number: 57a.1
    text: 'Het is instellingen die zendtijd hebben verkregen, uitsluitend toegestaan nevenactiviteiten te verrichten, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57a
  - number: 57a.1.a
    text: |-
      het verrichten van de nevenactiviteit geen nadelige invloed heeft of kan hebben op de uitvoering van de taak,
      bedoeld in [artikel 13c][ref1], met uitzondering van de activiteiten, bedoeld in [artikel 13c, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 57a.1.b
    text: |-
      de nevenactiviteit verband houdt met of ten dienste staat van de taak, bedoeld in [artikel 13c][ref1], met
      uitzondering van de activiteiten, bedoeld in [artikel 13c, derde lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 57a.1.c
    text: |-
      het verrichten van de nevenactiviteit niet leidt of kan leiden tot concurrentievervalsing ten opzichte van andere
      aanbieders van dezelfde of vergelijkbare goederen of diensten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57a
  - number: 57a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen aan het verrichten van nevenactiviteiten als bedoeld in het eerste lid
      nadere eisen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57a
  - number: 57c.1
    text: |-
      Alle inkomsten van een instelling die zendtijd heeft verkregen, waaronder de inkomsten uit nevenactiviteiten en
      vermogen, worden aangewend voor de verzorging van het programma waarvoor zij zendtijd heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57c
  - number: 57c.2
    text: |-
      In afwijking van het eerste lid, kunnen inkomsten uit programmabladen van omroepverenigingen tot ten hoogste een
      bij algemene maatregel van bestuur te bepalen bedrag worden besteed aan verenigingsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57c
  - number: 57d
    text: |-
      De [artikelen 57][ref1], [57a][ref2] en [57c][ref3] zijn niet van toepassing op overheidsinstellingen,
      kerkgenootschappen, genootschappen op geestelijke grondslag en politieke partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel57a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel57c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel57d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '57'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 57a
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 57c
        hoofdstuk: III
        afdeling: '2'
  - number: '58.1'
    text: |-
      De instellingen die zendtijd voor landelijke omroep hebben verkregen stellen de gegevens van de door haar uit te
      zenden programma’s voor zover deze nodig zijn voor de opgaven van uit te zenden programma’s in de programmabladen,
      ter beschikking van de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel58
  - number: '58.2'
    text: |-
      Zij gedogen dat de Stichting de gegevens, bedoeld in het eerste lid, ter verveelvoudiging en openbaarmaking ter
      beschikking stelt van de omroepverenigingen die zendtijd hebben verkregen alsmede van anderen die daartoe een
      overeenkomst met de Stichting hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel58
  - number: '59'
    text: |-
      Als inbreuk op het auteursrecht op enig geschrift inhoudende opgaven van uit te zenden programma's, vervaardigd
      door of in opdracht van omroepverenigingen, de Stichting of enige andere instelling die zendtijd voor landelijke
      omroep heeft verkregen, wordt voor de burgerrechtelijke aansprakelijkheid mede beschouwd het verveelvoudigen of
      openbaar maken van lijsten of andere opgaven van die programma’s anders dan met toepassing van [artikel 58][ref1]
      of met toestemming van de desbetreffende instelling die zendtijd heeft verkregen, tenzij wordt bewezen dat de
      gegevens in die lijsten of andere opgaven niet direct of indirect zijn ontleend aan enig geschrift als bedoeld in
      de aanhef van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel58
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '58'
        hoofdstuk: III
        afdeling: '2'
  - number: 61a
    text: |-
      De Stichting Etherreclame draagt er zorg voor dat zij aangesloten is bij de Nederlandse Reclame Code of een
      vergelijkbare door de Stichting Reclame Code tot stand gebrachte regeling en ter zake onderworpen is aan het
      toezicht van de Stichting Reclame Code. De Stichting Etherreclame toont dit aan door middel van een aan het
      Commissariaat voor de Media over te leggen schriftelijke verklaring van de Stichting Reclame Code.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel61a
  - number: '63'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de instellingen die zendtijd
      voor landelijke omroep hebben verkregen hun programma aan het Bedrijf ter uitzending aanbieden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel63
  - number: '64.1'
    text: 'Omroepverenigingen die zendtijd hebben verkregen voor landelijke omroep:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: 64.1.a
    text: heffen een contributie van hun leden met een minimumbedrag van € 4,54 per jaar,
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: 64.1.b
    text: verstrekken hun leden geen op geld waardeerbare voordelen zonder toestemming van het Commissariaat voor de Media,
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: 64.1.c
    text: |-
      tonen ten genoegen van het Commissariaat aan dat hun leden op een democratisch aanvaardbare wijze invloed op hun
      beleid kunnen uitoefenen en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: 64.1.d
    text: |-
      brengen, in overeenstemming met hun werknemers die zijn belast met de samenstelling van programma's, een
      programmastatuut tot stand waarin de journalistieke rechten en plichten van deze werknemers worden geregeld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: '64.2'
    text: |-
      Bij algemene maatregel van bestuur kan het bedrag, bedoeld in het eerste lid, onderdeel a, naar aanleiding van de
      ontwikkeling van de door het Centraal Bureau voor de Statistiek vastgestelde prijsindex voor de gezinsconsumptie
      worden bijgesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: '64.3'
    text: In de contributie, bedoeld in het eerste lid, onderdeel a, is de verstrekking van een programmablad niet begrepen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: '64.4'
    text: |-
      Het eerste lid, aanhef en onderdeel d, is van overeenkomstige toepassing op de Programmastichting, de Stichting en
      de educatieve omroepinstelling die zendtijd heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64
  - number: 64a.1
    text: |-
      Het is een instelling die zendtijd heeft verkregen voor lokale of regionale omroep, niet toegestaan haar programma
      uit te zenden of uit te doen zenden buiten de gemeente onderscheidenlijk provincie waarvoor het bestemd is, tenzij
      dit onvermijdelijk is teneinde de ontvangst van het programma door het algemene publiek in de gemeente of provincie
      waarvoor het bestemd is, te waarborgen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64a
  - number: 64a.2
    text: |-
      In bijzondere gevallen, alsmede ten behoeve van programma’s van culturele aard, programma’s bestemd voor etnische
      of culturele minderheden en educatieve programma's, voor zover deze programma’s mede van belang kunnen zijn
      voor het publiek in andere gemeenten onderscheidenlijk provincies, kan het Commissariaat voor de Media aan een
      instelling die zendtijd heeft verkregen voor lokale of regionale omroep, ontheffing verlenen van het verbod,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64a
  - number: 64a.3
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet indien een programma wordt uitgezonden via een aantal gekoppelde
      omroepnetwerken dat feitelijk als één omroepnetwerk functioneert.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64a
  - number: 64b.1
    text: |-
      Onverminderd [artikel 64, aanhef en onderdeel d][ref1], brengen instellingen die zendtijd hebben verkregen, een
      programmastatuut tot stand waarin ten minste waarborgen zijn opgenomen voor de redactionele onafhankelijkheid van
      hun werknemers, belast met de samenstelling van de programma's, ten opzichte van de sponsors.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel64
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '64'
        hoofdstuk: III
        afdeling: '2'
  - number: 64b.2
    text: |-
      Dit artikel geldt niet voor overheidsinstellingen, kerkgenootschappen, genootschappen op geestelijke grondslag en
      politieke partijen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64b
  - number: 64c.1
    text: |-
      Instellingen die zendtijd hebben verkregen, brengen jaarlijks schriftelijk verslag uit aan het Commissariaat voor
      de Media omtrent de inkomsten uit sponsorbijdragen, de gesponsorde programma-onderdelen en de hoedanigheid van de
      sponsors, gespecificeerd per programma-onderdeel.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64c
  - number: 64c.2
    text: |-
      Het Commissariaat voor de Media kan nadere regels stellen omtrent de inrichting van het verslag, de termijn
      waarbinnen het verslag moet worden uitgebracht, en de periode waarop het verslag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64c
  - number: 64c.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bijdragen van overheidsinstellingen en andere
      instellingen dan bedoeld in [artikel 1, onderdeel ll][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel64c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
        hoofdstuk: I
  - number: '65'
    text: |-
      Het Commissariaat voor de Media kan in bijzondere omstandigheden en voor bijzondere doeleinden tijdelijk aan een
      instelling die zendtijd heeft verkregen, toestemming verlenen een programma voor algemene omroep uit te doen zenden
      door middel van een omroepnetwerk. Het Commissariaat kan aan de toestemming voorschriften verbinden. Indien de
      aanbieder van het omroepnetwerk en de desbetreffende instelling geen overeenstemming bereiken over de dagen en uren
      waarop het programma zal worden uitgezonden, kan het Commissariaat ter zake bindende aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel65
  - number: '66.1'
    text: |-
      Het Commissariaat voor de Media kan aan een instelling die voor toewijzing van zendtijd voor lokale omroep in
      aanmerking komt, op verzoek van die instelling, in plaats van of naast het toewijzen van zendtijd toestemming
      verlenen een programma voor lokale omroep te verzorgen dat wordt uitgezonden door middel van een omroepnetwerk
      ter plaatse.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel66
  - number: '66.2'
    text: |-
      Het bepaalde ten aanzien van toewijzing en intrekking van zendtijd voor lokale omroep is van overeenkomstige
      toepassing, met dien verstande dat het Commissariaat niet de dagen en uren aanwijst waarop het programma zal
      worden uitgezonden. Indien tussen de aanbieder van het omroepnetwerk en de instelling geen overeenstemming wordt
      bereikt over de dagen en uren waarop het programma zal worden uitgezonden, kan het Commissariaat ter zake bindende
      aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel66
  - number: '67.1'
    text: |-
      Het Commissariaat voor de Media kan aan een instelling die voor toewijzing van zendtijd voor regionale omroep
      in aanmerking komt, op verzoek van die instelling, in plaats van of naast het toewijzen van zendtijd toestemming
      verlenen een programma voor regionale omroep te verzorgen dat wordt uitgezonden door middel van de omroepnetwerken
      in de desbetreffende provincie.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel67
  - number: '67.2'
    text: |-
      Het bepaalde ten aanzien van toewijzing en intrekking van zendtijd voor regionale omroep is van overeenkomstige
      toepassing, met dien verstande dat het Commissariaat niet de dagen en uren aanwijst waarop het programma zal
      worden uitgezonden. Indien tussen de aanbieder van het omroepnetwerk en de instelling geen overeenstemming wordt
      bereikt over de dagen en uren waarop het programma zal worden uitgezonden, kan het Commissariaat ter zake bindende
      aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel67
  - number: '67.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de dagen en uren waarop een
      programma als bedoeld in het eerste lid kan worden uitgezonden. Deze regels hebben uitsluitend betrekking op
      televisieprogramma's.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel67
  - number: '68.1'
    text: |-
      Het Commissariaat voor de Media kan aan een lokale omroepinstelling die zendtijd heeft verkregen, op verzoek van
      die instelling, toestemming verlenen naast het programma, bedoeld in [artikel 51f][ref1], een ander programma te
      verzorgen dat wordt uitgezonden door middel van een omroepnetwerk ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 51f
        hoofdstuk: III
        afdeling: '1'
  - number: '68.2'
    text: 'De toestemming, bedoeld in het eerste lid, kan slechts worden verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel68
  - number: 68.2.a
    text: |-
      het programma wordt uitgezonden op een ander kanaal dan het kanaal waarop het programma, bedoeld in
      [artikel 51f][ref1], wordt uitgezonden;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 51f
        hoofdstuk: III
        afdeling: '1'
  - number: 68.2.b
    text: |-
      het programma wordt geproduceerd door een lokale omroepinstelling die zendtijd heeft verkregen, of door een andere
      instelling zonder winstoogmerk;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel68
  - number: 68.2.c
    text: |-
      het programma, naast de onderdelen, bedoeld in [artikel 43a][ref1], voor ten minste vijfenzeventig procent
      bestaat uit onderdelen van culturele aard en voor het overige deel, doch voor ten minste tien procent, bestaat uit
      onderdelen van culturele aard, die in het bijzonder betrekking hebben op de desbetreffende gemeente; en


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
        hoofdstuk: III
        afdeling: '2'
  - number: 68.2.d
    text: |-
      de aanvraag vergezeld gaat van een advies van de Raad voor cultuur, waaruit blijkt dat het programma naar het
      oordeel van de Raad voor cultuur van bijzonder belang is voor de verscheidenheid van het aanbod van kwalitatief
      hoogstaande programma-onderdelen van culturele aard in Nederland.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel68
  - number: '68.3'
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt verleend voor de duur van vijf jaar. De toestemming vervalt,
      indien de lokale omroepinstelling niet meer over zendtijd beschikt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel68
  - number: 71a.1
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Telecommunicatiewet][ref1], is het een commerciële omroepinstelling
      slechts toegestaan een door haar verzorgd programma uit te zenden of te doen uitzenden, indien zij daarvoor
      toestemming van het Commissariaat voor de Media heeft verkregen. De toestemming is voor ieder programma
      afzonderlijk vereist. In de toestemming wordt aangegeven of zij betrekking heeft op een programma voor algemene
      omroep dan wel op een programma voor bijzondere omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 71a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop aanvragen tot het verlenen
      van toestemming worden ingediend en de termijn waarbinnen beslissingen daarop worden genomen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71a
  - number: 71a.3
    text: |-
      Indien toestemming is verleend voor het uitzenden of doen uitzenden van een televisieprogramma, is het de
      commerciële omroepinstelling tevens toegestaan:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71a
  - number: 71a.3.a
    text: een toetsbeeld uit te zenden of te doen uitzenden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71a
  - number: 71a.3.b
    text: |-
      een teletekstprogramma uit te zenden of te doen uitzenden, indien dat op dezelfde frequentieruimte of hetzelfde
      kanaal tegelijkertijd met het in de aanhef bedoelde televisieprogramma of met het toetsbeeld wordt uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71a
  - number: 71a.4
    text: De toestemming wordt verleend voor de duur van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71a
  - number: 71a.5
    text: De toestemming is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71a
  - number: 71b
    text: 'De toestemming kan uitsluitend worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71b.a
    text: de door de commerciële omroepinstelling verstrekte gegevens onjuist of onvolledig zijn;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71b.b
    text: |-
      redelijkerwijs te verwachten is dat de commerciële omroepinstelling de bij of krachtens deze wet gestelde
      verplichtingen niet in acht zal nemen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71b.c
    text: |-
      de commerciële omroepinstelling, of een of meer van de rechtspersonen of vennootschappen waarmee zij in een groep
      is verbonden, alleen of samen een aandeel van één vierde of meer hebben op de dagbladmarkt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71b.d
    text: |-
      een rechtspersoon, of een of meer van de rechtspersonen of vennootschappen waarmee hij in een groep is verbonden,
      alleen of samen een aandeel van één vierde of meer hebben op de dagbladmarkt en, al dan niet krachtens overeenkomst
      met andere stemgerechtigden, alleen of samen:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71b.d.1°
    text: ofwel meer dan één derde van de stemrechten in de algemene vergadering van de aanvrager kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71b.d.2°
    text: |-
      ofwel meer dan één derde van de bestuurders of van de commissarissen van de aanvrager kunnen benoemen of ontslaan;
      of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71b.e
    text: |-
      de commerciële omroepinstelling, of een of meer rechtspersonen of vennootschappen waarmee zij in een groep is
      verbonden, alleen of samen een aandeel van meer dan de helft hebben op de dag- of nieuwsbladmarkt die overeenkomt
      met het verzorgingsgebied waarop het programma van de instelling zich richt, tenzij er een publieke regionale of
      lokale omroep is, die de pluriformiteit van de nieuwsvoorziening in het betreffende verzorgingsgebied garandeert.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71b
  - number: 71c.1
    text: 'Het Commissariaat voor de Media trekt de toestemming in, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.1.a
    text: de commerciële omroepinstelling het Commissariaat daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.1.b
    text: |-
      de commerciële omroepinstelling in gebreke blijft met de betaling van hetgeen krachtens [artikel 71u][ref1]
      verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71u
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71u
        hoofdstuk: IV
        paragraaf: '3'
  - number: 71c.1.c
    text: |-
      de commerciële omroepinstelling, of een of meer van de rechtspersonen of vennootschappen waarmee zij in een groep
      is verbonden, alleen of samen gedurende twee achtereenvolgende kalenderjaren een aandeel van één vierde of meer
      hebben op de dagbladmarkt; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.1.d
    text: |-
      een rechtspersoon, of een of meer van de rechtspersonen of vennootschappen waarmee hij in een groep is verbonden,
      alleen of samen een aandeel van één vierde of meer hebben op de dagbladmarkt en, al dan niet krachtens overeenkomst
      met andere stemgerechtigden, alleen of samen:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.1.d.1°
    text: |-
      ofwel meer dan één derde van de stemrechten in de algemene vergadering van de desbetreffende commerciële
      omroepinstelling kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.1.d.2°
    text: |-
      ofwel meer dan één derde van de bestuurders of van de commissarissen van de desbetreffende commerciële
      omroepinstelling kunnen benoemen of ontslaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.2
    text: 'Het Commissariaat kan de toestemming intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.2.a
    text: de door de commerciële omroepinstelling verstrekte gegevens onjuist blijken te zijn; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
  - number: 71c.2.b
    text: |-
      de commerciële omroepinstelling overigens niet voldoet aan de verplichtingen gesteld bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 71d.1
    text: |-
      De weigeringsgronden, bedoeld in [artikel 71b, onderdelen c, d en e][ref1], onderscheidenlijk de
      intrekkingsgronden, [bedoeld in artikel 71c, eerste lid, onderdelen c en d][ref2], zijn niet van toepassing, indien
      de aanvraag, onderscheidenlijk de toestemming, betrekking heeft op een programma voor bijzondere omroep of op
      een televisieprogramma dat, voorzover het de beeldinhoud betreft, uitsluitend of nagenoeg uitsluitend bestaat uit
      stilstaande beelden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel71c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71b
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 71c
        hoofdstuk: IV
        paragraaf: '1'
  - number: 71d.2
    text: |-
      Bij regeling van het Commissariaat voor de Media wordt nader omschreven in welke gevallen het televisieprogramma
      voldoet aan de eis dat het uitsluitend of nagenoeg uitsluitend bestaat uit stilstaande beelden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71d
  - number: 71e.1
    text: |-
      Iedere commerciële omroepinstelling bepaalt, onverminderd het bij of krachtens de wet bepaalde, vorm en inhoud van
      haar programma en is daarvoor verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71e
  - number: 71e.2
    text: |-
      De [artikelen 52d][ref1] en [53][ref2] zijn van overeenkomstige toepassing op een commerciële omroepinstelling en
      op het door haar verzorgde programma.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel53
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71e
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 52d
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '53'
        hoofdstuk: III
        afdeling: '1'
  - number: 71f.1
    text: |-
      Reclameboodschappen of telewinkelboodschappen die zijn opgenomen in het programma van een commerciële
      omroepinstelling zijn als zodanig herkenbaar en door optische of akoestische middelen duidelijk onderscheiden van
      de andere programmaonderdelen. Er wordt geen gebruik gemaakt van subliminale technieken.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71f
  - number: 71f.2
    text: |-
      De blokken van telewinkelboodschappen, bedoeld in [artikel 71g, zesde lid][ref1], zijn gedurende de gehele
      uitzending daarvan door optische middelen als zodanig herkenbaar en door optische en akoestische middelen duidelijk
      onderscheiden van de andere programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71f
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71g
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71g.1
    text: |-
      Het programma van een commerciële omroepinstelling bestaat voor ten hoogste vijftien procent van de totale duur per
      dag uit reclameboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71g
  - number: 71g.2
    text: |-
      Het programma van een commerciële omroepinstelling bestaat voor ten hoogste twintig procent van de totale duur per
      dag uit telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71g
  - number: 71g.3
    text: |-
      Het programma van een commerciële omroepinstelling bestaat voor ten hoogste twintig procent van de totale duur per
      dag uit een combinatie van reclameboodschappen en telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71g
  - number: 71g.4
    text: |-
      Het programma van een commerciële omroepinstelling bestaat voor ten hoogste twaalf minuten per uur uit
      reclameboodschappen of telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71g
  - number: 71g.5
    text: |-
      Reclameboodschappen in televisieprogramma's, of telewinkelboodschappen worden uitsluitend uitgezonden in blokken
      die, met inbegrip van de eventuele omlijsting, ten minste anderhalve minuut duren.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71g
  - number: 71g.6
    text: |-
      In het programma van een commerciële omroepinstelling zijn ten hoogste acht blokken van telewinkelboodschappen
      per dag opgenomen, die per blok zonder onderbreking ten minste vijftien minuten duren en waarvan de totale duur
      ten hoogste drie uur per dag is. Het tweede tot en met vijfde lid zijn niet van toepassing op deze blokken van
      telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71g
  - number: 71h.1
    text: |-
      Programmaonderdelen van commerciële omroepinstellingen worden uitsluitend onderbroken door reclameboodschappen of
      telewinkelboodschappen, indien de onderbreking geen afbreuk doet aan de integriteit, het karakter en de samenhang
      van het desbetreffende programmaonderdeel of aan de rechten van rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.2
    text: |-
      Programmaonderdelen, bestaande uit de weergave van godsdienstige of levensbeschouwelijke samenkomsten, worden niet
      onderbroken door reclameboodschappen of telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.3
    text: |-
      De volgende programmaonderdelen worden uitsluitend onderbroken door reclameboodschappen of telewinkelboodschappen,
      indien zij ten minste dertig minuten duren:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.3.a
    text: programmaonderdelen, bestaande uit nieuws of commentaar op het nieuws;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.3.b
    text: |-
      programmaonderdelen van godsdienstige of geestelijke aard, niet zijnde programmaonderdelen als bedoeld in het
      tweede lid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.3.c
    text: programmaonderdelen die bestemd zijn voor minderjarigen beneden de leeftijd van twaalf jaar; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.3.d
    text: niet-gedramatiseerde documentaires.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.4
    text: |-
      Films worden uitsluitend onderbroken door reclameboodschappen of telewinkelboodschappen, indien zij ten minste
      vijfenveertig minuten duren.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71h.5
    text: |-
      Onverminderd het vierde lid, worden films ten hoogste eenmaal per volledig tijdvak van vijfenveertig minuten
      onderbroken door reclameboodschappen of telewinkelboodschappen. Indien een film ten minste twintig minuten langer
      duurt dan twee of meer volledige tijdvakken van vijfenveertig minuten, kan hij nog eenmaal worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71h
  - number: 71i.1
    text: |-
      Bij opeenvolgende onderbrekingen door reclameboodschappen of telewinkelboodschappen in één programmaonderdeel voor
      televisie worden tussenpozen van ten minste twintig minuten in acht genomen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71i
  - number: 71i.2
    text: |-
      In afwijking van het eerste lid, worden programmaonderdelen voor televisie die bestaan uit het verslag van een
      evenement uitsluitend onderbroken door reclameboodschappen of telewinkelboodschappen tijdens de in het evenement
      voorkomende gebruikelijke pauzes of tussen de daarin voorkomende gebruikelijke zelfstandige onderdelen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71i
  - number: 71j.1
    text: |-
      In afwijking van artikel [71g, eerste, vierde en vijfde lid][ref1], is het een commerciële omroepinstelling
      toegestaan een televisieprogramma te verzorgen dat uitsluitend bestaat uit ten behoeve van zelfpromotie uitgezonden
      reclameboodschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71j
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71g
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71j.2
    text: |-
      In een programma als bedoeld in het eerste lid mogen andere reclameboodschappen worden opgenomen, met inachtneming
      van de bepalingen die op het uitzenden daarvan van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71j
  - number: 71j.3
    text: |-
      In afwijking van [artikel 71g, tweede tot en met zesde lid][ref1], is het een commerciële omroepinstelling
      toegestaan een programma te verzorgen dat uitsluitend bestaat uit telewinkelboodschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71j
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71g
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71j.4
    text: |-
      In een programma als bedoeld in het derde lid mogen reclameboodschappen worden opgenomen, met inachtneming van de
      bepalingen die op het uitzenden daarvan van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71j
  - number: 71k.1
    text: |-
      De programmaonderdelen van een commerciële omroepinstelling worden uitsluitend gesponsord, indien die instelling
      een programmastatuut tot stand heeft gebracht waarin ten minste waarborgen zijn opgenomen voor de redactionele
      onafhankelijkheid van haar werknemers, belast met de samenstelling van de programma's, ten opzichte van de
      sponsors.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
  - number: 71k.2
    text: |-
      Aan het begin of aan het einde van een gesponsord programmaonderdeel worden, ter informatie van het publiek, alle
      sponsors vermeld. De vermelding gebeurt door middel van naam of (beeld)merk en is zodanig vormgegeven dat zij niet
      voldoet aan de definitie van reclameboodschap, bedoeld in [artikel 1, onderdeel kk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
        hoofdstuk: I
  - number: 71k.3
    text: |-
      In een gesponsord programmaonderdeel mogen producten of diensten van een sponsor worden vermeld of getoond, indien
      het publiek niet door middel van specifieke aanprijzingen of anderszins wordt aangespoord tot het kopen of huren
      van die producten of tot het afnemen van die diensten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
  - number: 71k.4
    text: |-
      Commerciële omroepinstellingen bedingen of aanvaarden geen sponsorbijdragen van personen, bedrijven of
      instellingen:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
  - number: 71k.4.a
    text: die zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten, of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
  - number: 71k.4.b
    text: |-
      die gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen
      als bedoeld in onderdeel a, of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de indruk
      krijgt dat het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld in onderdeel
      a betreft.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
  - number: 71k.5
    text: |-
      Programmaonderdelen van commerciële omroepinstellingen die toestemming hebben verkregen, bestaande uit nieuws,
      actualiteiten of politieke informatie, worden niet gesponsord.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
  - number: 71k.6
    text: |-
      Indien een gesponsord programmaonderdeel uit het buitenland is aangekocht en aldaar ten behoeve van het
      buitenlandse publiek reeds als programma is uitgezonden, is dit artikel slechts van toepassing voor zover de
      sponsorbijdragen worden verstrekt ten behoeve van de aankoop van het programmaonderdeel door de commerciële
      omroepinstelling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
  - number: 71k.7
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een programmaonderdeel waarvoor een overheidsinstelling of
      een andere instelling dan bedoeld in [artikel 1, onderdeel ll][ref1], een financiële of andere bijdrage heeft
      verstrekt ten behoeve van de totstandkoming of aankoop van dat programmaonderdeel, teneinde de uitzending daarvan
      als programmaonderdeel te bevorderen of mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71k
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
        hoofdstuk: I
  - number: 71l.1
    text: |-
      Aan het begin of aan het einde van een programmaonderdeel van een commerciële omroepinstelling bestaande uit het
      verslag of de weergave van een evenement dat niet voornamelijk bestemd is om als programmaonderdeel te worden
      uitgezonden, mogen de namen of (beeld)merken van die personen, bedrijven of instellingen, die een financiële of
      andere bijdrage hebben verstrekt aan de totstandkoming van het evenement, worden vermeld of getoond. De vermelding
      of vertoning is zodanig vormgegeven dat zij niet voldoet aan de definitie van reclameboodschap, bedoeld in
      [artikel 1, onderdeel kk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71l
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
        hoofdstuk: I
  - number: 71l.2
    text: Het eerste lid is niet van toepassing ten aanzien van personen, bedrijven of instellingen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71l
  - number: 71l.2.a
    text: die zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71l
  - number: 71l.2.b
    text: |-
      die gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen
      als bedoeld in onderdeel a, of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de indruk
      krijgt dat het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld in onderdeel
      a betreft.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71l
  - number: 71m.1
    text: |-
      Onverminderd het bepaalde in de [artikelen 71j][ref1], [71k, tweede en derde lid][ref2], en
      [71l, eerste lid][ref3], worden in de programma's van commerciële omroepinstellingen geen namen, (beeld)merken,
      producten, diensten of activiteiten van personen, bedrijven of instellingen vermeld of getoond, indien de
      desbetreffende commerciële omroepinstelling, naar redelijkerwijs kan worden aangenomen, daarmee beoogt of
      mede beoogt het publiek te bewegen tot het kopen van een bepaald product of het gebruik maken van een bepaalde
      dienstverlening, dan wel gunstig te stemmen ten aanzien van een bepaald bedrijf, een bedrijfstak of een bepaalde
      instelling teneinde de verkoop van producten of de afname van diensten te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71j
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel71k
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel71l
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71m
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71j
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 71k
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 71l
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71m.2
    text: |-
      Het vermelden of tonen van een naam, (beeld)merk, product, dienst of activiteit van een persoon, bedrijf of
      instelling in een programma wordt geacht te geschieden met het oogmerk, bedoeld in het eerste lid, indien zulks
      tegen betaling geschiedt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71m
  - number: 71m.3
    text: Het Commissariaat voor de Media kan in bijzondere gevallen ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71m
  - number: 71m.4
    text: Dit artikel is niet van toepassing op reclameboodschappen en telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71m
  - number: 71n.1
    text: |-
      Het televisieprogramma van een commerciële omroepinstelling bestaat voor ten minste vijftig procent uit
      programmaonderdelen die kunnen worden aangemerkt als Europese producties in de zin van artikel 6 van de Europese
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.2
    text: |-
      Het televisieprogramma van een commerciële omroepinstelling, bestaat voor ten minste tien procent uit
      programmaonderdelen als bedoeld in het eerste lid, die niet zijn geproduceerd door:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.2.a
    text: de desbetreffende commerciële omroepinstelling, of een andere instelling die een programma verzorgt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.2.b
    text: |-
      een rechtspersoon waarin een instelling die een programma verzorgt, al dan niet door middel van een of meer van
      haar dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.2.c
    text: |-
      een rechtspersoon waarin twee of meer instellingen die een programma verzorgen, al dan niet door middel van een of
      meer van hun onderscheidene dochtermaatschappijen, tezamen een belang van meer dan vijftig procent hebben; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.2.d
    text: |-
      een vennootschap waarin een instelling die een programma verzorgt, dan wel een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.3
    text: Ten minste een derde deel van de programmaonderdelen, bedoeld in het tweede lid, is niet ouder dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.4
    text: |-
      Voor de toepassing van dit artikel worden de volgende programmaonderdelen voor televisie buiten beschouwing
      gelaten:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.4.a
    text: programmaonderdelen, bestaande uit nieuws;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.4.b
    text: programmaonderdelen die betrekking hebben op sport;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.4.c
    text: |-
      programmaonderdelen die het karakter van een spel hebben, met uitzondering van programmaonderdelen van culturele of
      educatieve aard, die mede het karakter van een spel hebben;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.4.d
    text: programmaonderdelen, bestaande uit reclameboodschappen of telewinkelboodschappen; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.4.e
    text: programmaonderdelen, bestaande uit stilstaande beelden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.5
    text: 'Dit artikel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.5.a
    text: |-
      een televisieprogramma dat in slechts één gemeente of een beperkt aantal aan elkaar grenzende gemeenten kan worden
      ontvangen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.5.b
    text: |-
      televisieprogramma's als bedoeld in [artikel 71j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71j
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71j
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71n.5.c
    text: |-
      televisieprogramma's die uitsluitend bestemd zijn voor ontvangst in andere dan de lidstaten van de Europese Unie en
      die niet direct of indirect kunnen worden ontvangen door het publiek in één of meer lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71n.6
    text: |-
      Het Commissariaat voor de Media kan in bijzondere gevallen ten aanzien van een bepaalde commerciële
      omroepinstelling tijdelijk gedeeltelijke ontheffing verlenen van het eerste lid, met dien verstande dat het
      percentage niet lager gesteld kan worden dan tien.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71n
  - number: 71o.1
    text: |-
      Het televisieprogramma van een commerciële omroepinstelling bestaat voor ten minste veertig procent uit
      oorspronkelijk Nederlands- of Friestalige programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71o
  - number: 71o.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welk percentage van de in het eerste lid bedoelde
      programmaonderdelen ten minste wordt voorzien van ondertiteling ten behoeve van mensen met een auditieve beperking.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71o
  - number: 71o.3
    text: |-
      Het Commissariaat voor de Media kan in bijzondere gevallen ten aanzien van een bepaalde commerciële
      omroepinstelling desgevraagd en onder voorwaarden de in het eerste en tweede lid bedoelde percentages lager
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71o
  - number: 71o.4
    text: Het eerste lid is niet van toepassing op een programma voor bijzondere omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71o
  - number: 71p
    text: |-
      Een commerciële omroepinstelling neemt in haar programma geen films op buiten de met de rechthebbenden op de film
      overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71p
  - number: 71q
    text: |-
      De [artikelen 71g][ref1], [71h, tweede tot en met vijfde lid][ref2], [71i][ref3], [71j][ref4], [71l][ref5] en
      [71n tot en met 71p][ref6] zijn niet van toepassing op een televisieprogramma dat niet direct of indirect buiten
      Nederland ontvangen kan worden, en dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel71h
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel71i
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel71j
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel71l
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel71n
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71q
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71g
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 71h
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 71i
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 71j
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 71l
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0004149
        artikel: 71n
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71q.a
    text: voorzover het de beeldinhoud betreft, uitsluitend of nagenoeg uitsluitend bestaat uit stilstaande beelden; of
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71q
  - number: 71q.b
    text: |-
      hoofdzakelijk bestaat uit informatie met betrekking tot de door middel van een omroepzender of omroepnetwerk
      aangeboden programma's en diensten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71q
  - number: 71r
    text: |-
      Een commerciële omroepinstelling die programmaonderdelen bestaande uit reclameboodschappen verzorgt, draagt er zorg
      voor dat zij aangesloten is bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting Reclame Code tot
      stand gebrachte regeling en ter zake onderworpen is aan het toezicht van de Stichting Reclame Code. De commerciële
      omroepinstelling toont dit aan door middel van een aan het Commissariaat voor de Media over te leggen schriftelijke
      verklaring van de Stichting Reclame Code.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71r
  - number: 71s
    text: |-
      Een commerciële omroepinstelling brengt in overeenstemming met de werknemers die zijn belast met de samenstelling
      van programma's, een programmastatuut tot stand waarin de journalistieke rechten en plichten van deze werknemers
      worden geregeld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71s
  - number: 71t
    text: |-
      Het is een commerciële omroepinstelling niet toegestaan een programmaonderdeel als bedoeld in
      [artikel 51d, tweede lid][ref1], voor zover het betreft een onderdeel van een televisieprogramma waarvan de
      verspreiding in Nederland slechts mogelijk is na verwerving van de daarop betrekking hebbende rechten, uit te
      zenden of te doen uitzenden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51d
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71t
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 51d
        hoofdstuk: III
        afdeling: '1'
  - number: 71t.a
    text: |-
      de commerciële omroepinstelling niet tijdig aan de Stichting heeft medegedeeld dat zij de rechten, bedoeld in
      de aanhef, wenst te verwerven met uitsluiting van de instellingen die zendtijd hebben verkregen voor landelijke
      omroep; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71t
  - number: 71t.b
    text: |-
      de Stichting binnen een redelijke termijn na de mededeling, bedoeld in onderdeel a, aan de commerciële
      omroepinstelling te kennen heeft gegeven dat zij of een andere instelling die zendtijd heeft verkregen voor
      landelijke omroep, het desbetreffende programmaonderdeel in haar programma wenst op te nemen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71t
  - number: 71u.1
    text: |-
      Een commerciële omroepinstelling is aan het Commissariaat voor de Media jaarlijks een bedrag verschuldigd ter
      vergoeding van de kosten die verbonden zijn aan het toezicht.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71u
  - number: 71u.2
    text: |-
      De hoogte van de verschuldigde bedragen wordt vastgesteld bij regeling van Onze Minister, die hierbij een
      onderscheid maakt tussen radio- en televisieprogramma's en voorts in ieder geval rekening houdt met de gemiddelde
      duur van de uitzendingen en met het aantal huishoudens in Nederland, dat het programma kan ontvangen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71u
  - number: 71u.3
    text: |-
      Een commerciële omroepinstelling voldoet jaarlijks het met toepassing van [artikel 128][ref1] vastgestelde bedrag
      aan het Commissariaat. Het Commissariaat stelt dit bedrag ter beschikking van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel128
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71u
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '128'
        hoofdstuk: IX
  - number: 71u.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot de betaling van voorschotten op
      hetgeen een commerciële omroepinstelling ingevolge deze wet aan het Commissariaat verschuldigd zal zijn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71u
  - number: 71v
    text: |-
      Een commerciële omroepinstelling doet jaarlijks aan het Commissariaat voor de Media een opgave toekomen van
      het aantal huishoudens in Nederland, dat het programma op een door het Commissariaat te bepalen peildatum kan
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71v
  - number: 71w
    text: |-
      Als inbreuk op het auteursrecht op enig geschrift inhoudende opgaven van uit te zenden programma's, vervaardigd
      door of in opdracht van een commerciële omroepinstelling, wordt voor de burgerrechtelijke aansprakelijkheid mede
      beschouwd het verveelvoudigen of openbaar maken van lijsten of andere opgaven van die programma's anders dan
      met toestemming van de desbetreffende commerciële omroepinstelling, tenzij wordt bewezen dat de gegevens in die
      lijsten of andere opgaven niet direct of indirect zijn ontleend aan enig geschrift als bedoeld in de aanhef van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71w
  - number: 71x.1
    text: |-
      Indien een omroepvereniging die een erkenning, onderscheidenlijk een voorlopige erkenning, heeft verkregen,
      voornemens is na afloop van de periode waarvoor erkenning, onderscheidenlijk voorlopige erkenning, is verleend
      als commerciële omroepinstelling een programma te verzorgen, dan wel een belang te verwerven in een commerciële
      omroepinstelling, meldt zij dit aan het Commissariaat voor de Media.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71x
  - number: 71x.2
    text: |-
      Na de melding is het die omroepvereniging in het laatste jaar van de periode waarvoor de erkenning,
      onderscheidenlijk voorlopige erkenning, is verleend toegestaan die activiteiten te verrichten die noodzakelijk
      zijn om ervoor zorg te dragen dat zij of de rechtspersoon waarin zij een belang verwerft, na afloop van de periode
      waarvoor de erkenning, onderscheidenlijk voorlopige erkenning, is verleend als commerciële omroepinstelling
      een programma kan verzorgen. Indien zij daardoor niet meer voldoet aan een of meer van de eisen genoemd in
      [artikel 14, eerste lid][ref1], wordt zij voor de toepassing van de wet toch aangemerkt als een omroepvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel14
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel71x
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
  - number: '72.1'
    text: |-
      Bij algemene maatregel van bestuur wordt een lijst opgesteld van evenementen die, indien zij als een onderdeel van
      een televisieprogramma worden uitgezonden, in ieder geval worden uitgezonden op een open net. Daarbij kan worden
      bepaald welke van die evenementen tevens worden aangemerkt als evenementen als bedoeld in artikel 3 bis van de
      Europese richtlijn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel72
  - number: '72.2'
    text: |-
      Een evenement kan op de in het eerste lid bedoelde lijst worden geplaatst indien in ieder geval wordt voldaan aan
      twee van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel72
  - number: 72.2.a
    text: het evenement is van algemeen belang voor de Nederlandse samenleving;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel72
  - number: 72.2.b
    text: het evenement is van bijzondere culturele betekenis;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel72
  - number: 72.2.c
    text: het evenement werd in het verleden ook reeds op een open net uitgezonden en kon rekenen op een grote kijkdichtheid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel72
  - number: 72.2.d
    text: het gaat om een groot internationaal sportevenement waaraan het nationale team deelneemt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel72
  - number: '72.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van de verplichting, bedoeld in
      het eerste lid. Hiertoe behoren in ieder geval regels die bepalen of de op de lijst genoemde evenementen, indien
      zij als onderdeel van een televisieprogramma worden uitgezonden, in ieder geval worden uitgezonden op een open
      net door middel van volledige of gedeeltelijke rechtstreekse verslaggeving dan wel door middel van volledige of
      gedeeltelijke uitgestelde verslaggeving.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel72
  - number: '73.1'
    text: |-
      Een instelling die zendtijd heeft verkregen of een commerciële omroepinstelling oefent verworven uitzendrechten
      die betrekking hebben op evenementen die zijn vermeld op de lijst, bedoeld in [artikel 72, eerste lid][ref1], uit
      overeenkomstig de krachtens [artikel 72][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel72
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '72'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '72'
        hoofdstuk: IVA
  - number: '73.2'
    text: |-
      Een instelling die zendtijd heeft verkregen of een commerciële omroepinstelling oefent na 30 juli 1997 verworven
      uitzendrechten uit overeenkomstig de regels, die door andere lidstaten van de Europese Unie overeenkomstig artikel
      3 bis, eerste lid, van de Europese richtlijn zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel73
  - number: '76.1'
    text: 'De Stichting Radio Nederland Wereldomroep heeft onder meer tot taak:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76
  - number: 76.1.a
    text: |-
      de uitvoering van de in [artikel 13c, eerste lid, onderdeel c][ref1], bedoelde taak van de publieke omroep; en


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 76.1.b
    text: |-
      het vastleggen of doen vastleggen van programma-onderdelen op beeld- en geluidsdragers en het ter beschikking
      stellen daarvan ten behoeve van omroepinstellingen buiten Nederland ter opneming in hun eigen programma's.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76
  - number: '76.2'
    text: |-
      Het verzorgen van televisieprogramma’s door de Wereldomroep geschiedt in samenwerking met de Stichting. Ten behoeve
      van de verzorging van radioprogramma's door de Wereldomroep vindt samenwerking plaats met de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76
  - number: '76.3'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 52 tot en met 53a][ref1], [56a, eerste, vijfde en zesde lid][ref2],
      [64, eerste lid, aanhef en onderdeel d][ref3], [64b, eerste lid][ref4], en [64c][ref5] is van overeenkomstige
      toepassing op de Wereldomroep en de door haar verzorgde programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel56a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel64b
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel64c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '52'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 56a
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '64'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 64b
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 64c
        hoofdstuk: III
        afdeling: '2'
  - number: '76.4'
    text: |-
      Ten minste vijftig procent van het televisieprogramma van de Wereldomroep bestaat uit programma-
      onderdelen die kunnen worden aangemerkt als Europese producties in de zin van artikel 6 van de Europese
      richtlijn. Ten minste tien procent van het televisieprogramma van de Wereldomroep bestaat uit programma-
      onderdelen als bedoeld in de vorige volzin die kunnen worden aangemerkt als onafhankelijke producties.
      [Artikel 54, tweede lid, derde volzin en onderdelen a tot en met d, en derde tot en met vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel54
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '54'
        hoofdstuk: III
        afdeling: '1'
  - number: 76a.1
    text: |-
      In de programma’s van de Wereldomroep mogen programma-onderdelen van de Stichting Etherreclame worden opgenomen die
      bestaan uit reclameboodschappen en telewinkelboodschappen die zijn aangeboden door derden, alsmede een omlijsting
      daarvan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76a
  - number: 76a.2
    text: |-
      Het bepaalde bij of krachtens de [artikelen 39b][ref1], [41a][ref2] en [50, achtste lid][ref3], met betrekking
      tot de zendtijd van de Stichting Etherreclame, is van overeenkomstige toepassing op het opnemen van programma-
      onderdelen als bedoeld in het eerste lid in de programma’s van de Wereldomroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel50
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39b
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 41a
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '50'
        hoofdstuk: III
        afdeling: '1'
  - number: '77.1'
    text: Wijzigingen in de statuten van de Wereldomroep behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel77
  - number: '77.2'
    text: Het bestuur van de Wereldomroep kan niet besluiten tot ontbinding van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel77
  - number: '78'
    text: |-
      De leden van het bestuur van de Wereldomroep worden door Onze Minister benoemd, geschorst en ontslagen. Onze
      Minister wijst uit de leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel78
  - number: '79'
    text: |-
      Het bestuur van de Wereldomroep is voor zijn beleid verantwoording schuldig aan Onze Minister. Het bestuur maakt
      jaarlijks een verslag van de werkzaamheden van de Wereldomroep openbaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel79
  - number: '81.1'
    text: Er is een programmaraad die het bestuur van de Wereldomroep van advies dient over de inhoud van de programma's.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel81
  - number: '81.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de leden van de programmaraad. De leden worden benoemd voor een periode
      van vijf jaren. Herbenoeming voor een aansluitende periode is éénmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel81
  - number: '81.3'
    text: Het huishoudelijk reglement van de programmaraad behoeft de instemming van het bestuur van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel81
  - number: '82.1'
    text: |-
      De Stichting en de Wereldomroep roepen een commissie van overleg in het leven ter behartiging van aangelegenheden
      die van gemeenschappelijk belang zijn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82
  - number: '82.2'
    text: 'De commissie pleegt onder meer overleg over:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82
  - number: 82.2.a
    text: |-
      het wederzijds tegen betaling van vergoeding ter beschikking stellen van daarvoor in aanmerking komende
      omroepfaciliteiten, organen, diensten, alsmede van het hierbij werkzame personeel, en hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82
  - number: 82.2.b
    text: |-
      buitenlandse aangelegenheden, die voor de instellingen die zendtijd hebben verkregen en de Wereldomroep als geheel
      van belang zijn; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82
  - number: 82.2.c
    text: |-
      de wijze waarop de Stichting en de Wereldomroep samenwerken met het oog op de uitvoering van hun taken,
      alsmede het opstellen van het concessiebeleidsplan, bedoeld in [artikel 30b, eerste lid][ref1], de tussentijdse
      concessiebeleidsplannen, bedoeld in [artikel 30b, derde lid][ref2], de begroting, bedoeld in [artikel 98b][ref3],
      en de begrotingen, bedoeld in de [artikelen 99][ref4] en [108][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel98b
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel108
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 98b
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 82a.1
    text: 'Het is de aanbieder van een omroepzender toegestaan:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82a
  - number: 82a.1.a
    text: |-
      programma’s van derden uit te zenden, indien de persoon of instelling die verantwoordelijk is voor vorm en
      inhoud van het programma, krachtens deze wet of krachtens de op die persoon of instelling van toepassing zijnde
      buitenlandse regelgeving gerechtigd is een voor uitzending bestemd programma te verzorgen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82a
  - number: 82a.1.b
    text: |-
      programma's uit te zenden die door de aanbieder zelf worden verzorgd, indien deze een instelling is die zendtijd
      heeft verkregen, of krachtens [artikel 71a, eerste lid][ref1], toestemming heeft verkregen een programma uit te
      zenden of te doen uitzenden;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 82a.1.c
    text: |-
      programma’s uit te zenden die bestaan uit een onverkorte en rechtstreekse weergave van het verhandelde in
      een openbare vergadering van de Eerste of Tweede Kamer der Staten-Generaal, van Provinciale Staten of van een
      gemeenteraad;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82a
  - number: 82a.1.d
    text: |-
      toetsbeelden en informatie met betrekking tot de door middel van de omroepzender aangeboden programma’s en diensten
      uit te zenden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82a
  - number: 82a.2
    text: |-
      Het uitzenden van een programma door middel van een omroepzender wordt steeds als een oorspronkelijke uitzending
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82a
  - number: 82c.1
    text: |-
      Het is de naamloze vennootschap Nederlandsche Omroep-Zender-Maatschappij N.V., genoemd in
      [artikel 1 van de Radio-Omroep-Zender-Wet 1935][ref1], toegestaan ten behoeve van derden programma’s voor een
      bijzonder doel uit te zenden die een beperkt bereik hebben of van beperkte duur zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82c
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '1'
  - number: 82c.2
    text: |-
      Het Commissariaat voor de Media kan voorts aan andere natuurlijke of rechtspersonen toestemming verlenen door
      middel van een omroepzender een programma voor een bijzonder doel uit te zenden dat een beperkt bereik heeft of van
      beperkte duur is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82c
  - number: 82c.3
    text: |-
      Bij algemene maatregel van bestuur kunnen de begrippen bijzonder doel, beperkt bereik en beperkte duur, bedoeld in
      het eerste en het tweede lid, nader omschreven worden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82c
  - number: 82c.4
    text: Het Commissariaat kan aan het verlenen van toestemming als bedoeld in het tweede lid voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82c
  - number: 82e.1
    text: |-
      Onze Minister, handelend in overeenstemming met het gevoelen van de ministerraad, wijst de frequentieruimte
      in de FM-band aan die wordt gebruikt voor het uitzenden van een radioprogramma dat overwegend bestaat uit
      Nederlandstalige muziek. Bij ministeriële regeling wordt nader omschreven in welke gevallen een radioprogramma aan
      deze eis voldoet.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82e
  - number: 82e.2
    text: |-
      Onze Minister wijst, handelend in overeenstemming met het gevoelen van de ministerraad, andere frequentieruimte
      in de FM-band aan die slechts mag worden gebruikt voor het uitzenden van bij die aanwijzing vast te stellen
      categorieën radioprogramma’s die, gelet op hun aard, inhoud of doelgroep, verhoudingsgewijs lage inkomsten uit
      reclame of verhoudigingsgewijs hoge kosten meebrengen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82e
  - number: 82e.3
    text: |-
      Indien aard en omvang van de frequentieruimte in de FM-band die beschikbaar is voor het uitzenden van
      radioprogramma’s daartoe aanleiding geeft, kan Onze Minister, handelend in overeenstemming met het gevoelen van de
      ministerraad, afzien van het aanwijzen van frequentieruimte in de FM-band op grond van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82e
  - number: 82f.1
    text: |-
      Voor de uitzending van radioprogramma’s van eenzelfde instelling wordt niet meer frequentieruimte gebruikt dan één
      FM-frequentie of samenstel van FM-frequenties.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82f
  - number: 82f.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen een aantal met elkaar verbonden
      instellingen voor de toepassing van het eerste lid als één instelling wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82f
  - number: 82f.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden afgeweken van het eerste lid, indien dat wenselijk is
      vanuit een oogpunt van doelmatig gebruik van frequentieruimte. Hierbij kan een onderscheid worden gemaakt tussen
      verschillende categorieën frequentieruimte, bestaande uit FM-frequenties en samenstellen van FM-frequenties.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82f
  - number: 82g
    text: |-
      De [artikelen 82][ref1] en [82][ref2] zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82e
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82g
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82e
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 82f
        hoofdstuk: VI
        paragraaf: '2'
  - number: 82g.a
    text: |-
      de frequentieruimte die wordt gebruikt voor de uitzending van de programma’s van de instellingen die zendtijd
      hebben verkregen, of van de programma’s van de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82g
  - number: 82g.b
    text: frequentieruimte die wordt gebruikt ten behoeve van uitzending door middel van een satelliet.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82g
  - number: 82h
    text: 'Het is de aanbieder van een omroepnetwerk toegestaan:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82h
  - number: 82h.a
    text: |-
      programma’s van derden uit te zenden, indien de persoon of instelling die verantwoordelijk is voor vorm en
      inhoud van het programma, krachtens deze wet of krachtens de op die persoon of instelling van toepassing zijnde
      buitenlandse regelgeving gerechtigd is een voor uitzending bestemd programma te verzorgen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82h
  - number: 82h.b
    text: |-
      programma's uit te zenden die door de aanbieder zelf worden verzorgd, indien deze krachtens
      [artikel 71a, eerste lid][ref1], toestemming heeft verkregen een programma uit te zenden of te doen uitzenden;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82h
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 82h.c
    text: |-
      programma’s uit te zenden die bestaan uit een onverkorte en rechtstreekse weergave van het verhandelde in
      een openbare vergadering van de Eerste of Tweede Kamer der Staten-Generaal, van Provinciale Staten of van een
      gemeenteraad;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82h
  - number: 82h.d
    text: |-
      toetsbeelden en informatie met betrekking tot de door middel van het omroepnetwerk aangeboden programma’s en
      diensten uit te zenden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82h
  - number: 82i.1
    text: |-
      De aanbieder van een omroepnetwerk zendt onverkort, ongewijzigd en gelijktijdig met de oorspronkelijke uitzending
      naar alle aangeslotenen op het omroepnetwerk ten minste vijftien televisieprogramma's voor algemene omroep en ten
      minste vijfentwintig radioprogramma's voor algemene omroep uit, waaronder in ieder geval:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.1.a
    text: de programma’s van de instellingen die zendtijd hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.1.b
    text: |-
      de programma’s van de instelling die zendtijd heeft verkregen voor regionale omroep, bestemd voor de provincie
      waarbinnen het omroepnetwerk zich bevindt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.1.c
    text: |-
      de programma’s van de instelling die zendtijd heeft verkregen voor lokale omroep, bestemd voor de gemeente
      waarbinnen het omroepnetwerk zich bevindt;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.1.d
    text: twee televisieprogramma’s van de Nederlandstalige landelijke Belgische openbare omroepdienst;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.1.e
    text: twee radioprogramma’s van de Nederlandstalige landelijke Belgische openbare omroepdienst.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.2
    text: |-
      Indien op eenzelfde kanaal van een omroepnetwerk niet gelijktijdig verschillende programma's voor algemene omroep
      worden uitgezonden, worden deze programma's voor de toepassing van het eerste lid als één programma aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.3
    text: |-
      Het is de aanbieder van een omroepnetwerk toegestaan naar een aangeslotene op het omroepnetwerk, op diens verzoek,
      minder dan vijftien televisieprogramma's voor algemene omroep en minder dan vijfentwintig radioprogramma's voor
      algemene omroep uit te zenden, mits ten minste de programma's genoemd in het eerste lid, onder a tot en met e,
      worden uitgezonden, en mits aan de desbetreffende aangeslotene een tarief in rekening wordt gebracht dat evenredig
      lager is dan het tarief dat in rekening wordt gebracht voor de ontvangst van het met inachtneming van het eerste
      lid uitgezonden aantal programma's. Het tweede lid is daarbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82i.4
    text: |-
      Het Commissariaat voor de Media kan de aanbieder van een omroepnetwerk, desgevraagd, geheel of gedeeltelijk
      ontheffing verlenen van de verplichting, bedoeld in het eerste lid, voor zover het betreft de programma's genoemd
      in het eerste lid, onder d en e, indien het voldoen aan deze verplichtingen onevenredig hoge kosten voor de
      aanbieder zou meebrengen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82i
  - number: 82j.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de aanbieder van een omroepnetwerk aan de aangeslotenen
      op het omroepnetwerk ten hoogste een bij deze algemene maatregel van bestuur vast te stellen tarief in rekening
      brengt voor de ontvangst van een door de aanbieder met inachtneming van [artikel 82i][ref1] vast te stellen aantal
      programma's. Dit tarief kan voor verschillende categorieën omroepnetwerken verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82i
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82j
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82i
        hoofdstuk: VI
        paragraaf: '3'
  - number: 82j.2
    text: |-
      Indien een algemene maatregel van bestuur als bedoeld in het eerste lid is vastgesteld, is het de aanbieder van een
      omroepnetwerk toegestaan aan aangeslotenen die uitdrukkelijk hebben verzocht om of ingestemd met de ontvangst van
      andere programma’s dan de programma’s waarop het krachtens het eerste lid vastgestelde tarief betrekking heeft, een
      hoger tarief in rekening te brengen, onverminderd [artikel 82i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82i
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82j
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82i
        hoofdstuk: VI
        paragraaf: '3'
  - number: 82j.3
    text: |-
      Onze Minister stelt een krachtens het eerste lid vastgesteld tarief jaarlijks bij aan de hand van de ontwikkeling
      van de door het Centraal Bureau voor de Statistiek voor een kalenderjaar vastgestelde prijsindex voor de
      gezinsconsumptie. Deze bijstelling treedt in werking op 1 januari van een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82j
  - number: 82k.1
    text: |-
      In gemeenten waar een omroepnetwerk aanwezig is, stelt de gemeenteraad een programmaraad in die de aanbieder van
      het omroepnetwerk adviseert welke programma's voor algemene omroep hij krachtens artikel 82i ten minste uitzendt
      naar alle aangeslotenen op het omroepnetwerk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82k
  - number: 82k.2
    text: |-
      De aanbieder van een omroepnetwerk kan slechts om zwaarwichtige redenen afwijken van het advies, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82k
  - number: 82k.3
    text: |-
      De aanbieder van een omroepnetwerk kan de programmaraad voorts een advies vragen over de overige programma's voor
      algemene omroep die hij uitzendt naar alle aangeslotenen op het omroepnetwerk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82k
  - number: 82k.4
    text: |-
      Onverminderd artikel 82*i*, gaat de programmaraad in zijn advisering uit van een pluriforme samenstelling van
      het pakket programma's voor algemene omroep, rekening houdend met de in de gemeente levende maatschappelijke,
      culturele, godsdienstige en geestelijke behoeften.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82k
  - number: 82k.5
    text: |-
      De leden van de programmaraad worden benoemd door de gemeenteraad van de gemeente waar het omroepnetwerk aanwezig
      is. Voor benoeming komen in aanmerking personen die deskundig zijn op het terrein waarop de programmaraad
      adviseert. De programmaraad heeft een zodanige samenstelling dat hij representatief is voor de belangrijkste in de
      gemeente voorkomende maatschappelijke, culturele, godsdienstige en geestelijke stromingen. De gemeenteraad bepaalt
      de omvang van de programmaraad. Leden van de gemeenteraad kunnen geen zitting hebben in de programmaraad.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82k
  - number: 82k.6
    text: |-
      Indien een aantal omroepnetwerken gekoppeld is en daardoor feitelijk als één omroepnetwerk functioneert, wordt
      met betrekking tot die gekoppelde omroepnetwerken één programmaraad ingesteld door de onderscheidene gemeenteraden
      gezamenlijk. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82k
  - number: 82k.7
    text: |-
      Het eerste tot en met zesde lid zijn niet van toepassing op de aanbieder van een
      omroepnetwerk aan wie de Onafhankelijke Post en Telecommunicatie Autoriteit, genoemd in
      [artikel 2 van de Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1], met toepassing van
      [artikel 8.2 van de Telecommunicatiewet][ref2] geheel of gedeeltelijk ontheffing heeft verleend van de
      verplichting, bedoeld in [artikel 8.1, eerste lid, van de Telecommunicatiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel8
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel82k
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '8'
  - number: '83'
    text: |-
      Het Nederlands Omroepproduktie Bedrijf N.V. maakt de programma's van de instellingen die zendtijd hebben verkregen
      voor landelijke omroep, gereed voor uitzending en doet deze programma's uitzenden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel83
  - number: '84.1'
    text: |-
      Het is het Bedrijf, na toestemming door Onze Minister, toegestaan de uitoefening van de taak, bedoeld in
      [artikel 83][ref1], geheel of ten dele te doen geschieden door een andere rechtspersoon, indien de desbetreffende
      rechtspersoon:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: 84.1.a
    text: is opgericht in overeenstemming met het recht van een der lidstaten van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel84
  - number: 84.1.b
    text: een geplaatst kapitaal heeft dat voor ten minste eenenvijftig procent wordt verschaft door het Bedrijf; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel84
  - number: 84.1.c
    text: |-
      een rechtspersoon is waarin het Bedrijf de bevoegdheid heeft de meerderheid van de bestuurders te benoemen, te
      schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel84
  - number: '84.2'
    text: Onze Minister kan aan het verlenen van toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel84
  - number: '84.3'
    text: |-
      In geval van toepassing van het eerste lid, blijft het Bedrijf jegens Onze Minister verantwoordelijk. De
      rechtspersoon, bedoeld in het eerste lid, is jegens het Bedrijf verplicht tot naleving van de ingevolge deze wet op
      het Bedrijf rustende verplichtingen. Het Bedrijf geeft aan de rechtspersoon, bedoeld in het eerste lid, daartoe de
      nodige instructies, die deze gehouden is op te volgen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel84
  - number: '84.4'
    text: |-
      In geval van toepassing van het eerste lid, geldt het bij of krachtens de [artikelen 88 tot en met 95][ref1] en
      [artikel 173][ref2] bepaalde met betrekking tot het Bedrijf mede ten aanzien van de rechtspersoon, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel173
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '88'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '173'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '88.1'
    text: |-
      Het Bedrijf draagt er zorg voor dat de programma's die worden aangeboden door instellingen die zendtijd hebben
      verkregen voor landelijke omroep, worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel88
  - number: '88.2'
    text: |-
      Indien zich een onverwachte gebeurtenis van nationaal of groot maatschappelijk belang of een onverwachte
      internationale gebeurtenis van bijzondere aard voordoet, stelt het Bedrijf op verzoek van de Stichting de
      faciliteiten ter beschikking die nodig zijn om de verslaglegging van die gebeurtenis door de Stichting mogelijk
      te maken.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel88
  - number: '89.1'
    text: |-
      Voor de uitvoering van de taak, bedoeld in [artikel 83][ref1], stelt Onze Minister gelden ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: '89.2'
    text: |-
      Aan het ter beschikking stellen van gelden kunnen voorschriften worden verbonden. Onze Minister kan de beschikking
      tot het ter beschikking stellen van gelden intrekken of wijzigen, indien de aan de beschikking verbonden
      voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel89
  - number: '90'
    text: |-
      Het Bedrijf brengt aan de instellingen die zendtijd hebben verkregen voor landelijke omroep, geen tarieven in
      rekening voor de activiteiten waarvoor Onze Minister met toepassing van [artikel 89][ref1] aan het Bedrijf gelden
      ter beschikking stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel89
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '89'
        hoofdstuk: VII
  - number: '92'
    text: |-
      Het Bedrijf voert voor de taak, bedoeld in [artikel 83][ref1], een boekhouding die inzicht geeft in de financiën
      die op die taak afzonderlijk betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: '93'
    text: |-
      De begroting en jaarrekening van het Bedrijf met betrekking tot de taak, bedoeld in [artikel 83][ref1], behoeven de
      instemming van Onze Minister. Deze hoort daaromtrent de Stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: '94'
    text: |-
      Op vordering van de Staat heft de voorzieningenrechter in kort geding een beslag op bezittingen van het
      Bedrijf op voor zover het beslag de uitzending van programma’s in gevaar brengt en dit naar het oordeel van de
      voorzieningenrechter in strijd is met het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel94
  - number: '95'
    text: |-
      Indien het Bedrijf in strijd handelt met [artikel 83][ref1], is Onze Minister bevoegd tot toepassing van
      bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: 98a.1
    text: |-
      Iedere netcoördinator doet de voor zijn net opgestelde ontwerpbegroting jaarlijks voor 1 augustus toekomen aan de
      raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
  - number: 98a.2
    text: 'De ontwerpbegrotingen bevatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
  - number: 98a.2.a
    text: |-
      een beschrijving van de wijze waarop op het televisie-, onderscheidenlijk radioprogrammanet, invulling
      wordt gegeven aan de voorgenomen programmering, rekening houdend met de algemene uitgangspunten, bedoeld
      in [artikel 18b, tweede lid, onderdeel a][ref1], en het netprofiel van het televisie-, onderscheidenlijk
      radioprogrammanet, bedoeld in [artikel 19a, eerste lid, onderdeel e][ref2], en met inachtneming van het bepaalde
      bij of krachtens [artikel 13c][ref3] en hetgeen overigens bij of krachtens deze wet is bepaald ten aanzien van de
      programma's en de programmering op de televisie- en radioprogrammanetten;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98a.2.b
    text: |-
      een beschrijving van de voornemens van de instellingen die zendtijd hebben verkregen voor landelijke omroep en wier
      zendtijd op het net is ingedeeld met betrekking tot activiteiten als bedoeld in [artikel 13c, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98a.2.c
    text: |-
      de hoogte van de bedragen die voor het volgende kalenderjaar nodig zijn om de voornemens met betrekking tot
      de programmering op het televisie-, onderscheidenlijk radioprogrammanet, en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref1], te verwezenlijken, alsmede een financieel overzicht, inhoudende een raming van de
      voorziene benodigde middelen voor de daarop volgende vier jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98a.2.d
    text: een toelichting op de onderscheiden onderdelen en begrotingsposten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
  - number: 98a.3
    text: |-
      De ontwerpbegrotingen hebben geen betrekking op het programma en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref1], van de Stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98a.4
    text: |-
      De wettelijke bepalingen omtrent de inhoud en inrichting van de begroting, bedoeld in [artikel 99][ref1], zijn van
      overeenkomstige toepassing op de ontwerpbegrotingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 98b.1
    text: |-
      De raad van bestuur stelt jaarlijks voor 1 augustus een begroting voor het televisieprogramma, onderscheidenlijk
      radioprogramma, alsmede de activiteiten als bedoeld in [artikel 13c, derde lid][ref1], van de Stichting vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98b.2
    text: 'De begroting, bedoeld in het eerste lid, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
  - number: 98b.2.a
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de voorgenomen programmering van de Stichting,
      rekening houdend met de algemene uitgangspunten, bedoeld in [artikel 18b, tweede lid, onderdelen a en d][ref1], en
      met inachtneming van het bepaalde bij of krachtens [artikel 13c][ref2] en hetgeen overigens bij of krachtens deze
      wet is bepaald ten aanzien van de programma's en de programmering op de televisie- en radioprogrammanetten;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98b.2.b
    text: |-
      een beschrijving van de voornemens van de Stichting met betrekking tot activiteiten als bedoeld in
      [artikel 13c][ref1], derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98b.2.c
    text: |-
      de hoogte van de bedragen die voor het volgende kalenderjaar naar het oordeel van de raad van bestuur nodig zullen
      zijn ter bestrijding van de kosten van de verzorging van het televisieprogramma, onderscheidenlijk radioprogramma,
      en de activiteiten als bedoeld in [artikel 13c][ref1], derde lid, van de Stichting, alsmede een financieel
      overzicht, inhoudende een raming van de voorziene benodigde middelen voor de daarop volgende vier jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 98b.2.d
    text: een toelichting op de onderscheiden onderdelen en begrotingsposten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
  - number: 98b.2.e
    text: een beschrijving van de samenwerking met de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
  - number: 98b.3
    text: |-
      De wettelijke bepalingen omtrent de inhoud en inrichting van de begroting, bedoeld in [artikel 99][ref1], zijn van
      overeenkomstige toepassing op de begroting van de Stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '99.1'
    text: |-
      De Stichting doet jaarlijks voor 1 oktober een begroting voor de instellingen die zendtijd hebben verkregen voor
      landelijke omroep, toekomen aan Onze Minister en het Commissariaat voor de Media. De begroting wordt, rekening
      houdende met de ontwerpbegrotingen, bedoeld in [artikel 98a][ref1], door de raad van bestuur vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel98a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 98a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '99.2'
    text: 'De begroting bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.2.a
    text: |-
      een beschrijving van de wijze waarop door de instellingen die zendtijd hebben verkregen op de televisie- en
      radioprogrammanetten invulling wordt gegeven aan de voorgenomen programmering, rekening houdend met de algemene
      uitgangspunten, bedoeld in [artikel 18b, tweede lid, onderdelen a en d][ref1], en met inachtneming van het bepaalde
      bij of krachtens [artikel 13c][ref2] en hetgeen overigens bij of krachtens deze wet is bepaald ten aanzien van de
      programma's en de programmering op de televisieen radioprogrammanetten;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 99.2.b
    text: |-
      een beschrijving van de voornemens van de instellingen die zendtijd hebben verkregen voor landelijke omroep met
      betrekking tot activiteiten als bedoeld in artikel [13c, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 99.2.c
    text: |-
      de hoogte van de bedragen die voor het volgende kalenderjaar nodig zullen zijn om de voornemens van de landelijke
      omroep en van de instellingen die zendtijd hebben verkregen voor landelijke omroep, te verwezenlijken, alsmede een
      financieel overzicht, inhoudende een raming van de voorziene benodigde middelen voor de daarop volgende vier jaren;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.2.d
    text: |-
      een beschrijving van de wijze waarop de raad van bestuur voornemens is het bedrag dat beschikbaar is voor
      versterking van de programmering, de gelden, bedoeld in [artikel 106a][ref1], alsmede de uitkeringen, bedoeld in
      [artikel 170c, tweede lid][ref2], te besteden;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel106a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel170c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 106a
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 170c
        hoofdstuk: XI
        paragraaf: '2'
  - number: 99.2.e
    text: een toelichting op de onderscheiden onderdelen en begrotingsposten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.2.f
    text: een beschrijving van de samenwerking met de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: '99.3'
    text: 'In de begroting worden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.a
    text: 'de bedragen die nodig zullen zijn ter bestrijding van de kosten van de verzorging van:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.a.1°
    text: |-
      de televisieprogramma's, onderscheidenlijk radioprogramma's, van de Programmastichting en de omroepverenigingen die
      zendtijd hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.a.2°
    text: het televisieprogramma, onderscheidenlijk radioprogramma, van de Stichting;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.a.3°
    text: |-
      het televisieprogramma, onderscheidenlijk radioprogramma, van de educatieve omroepinstelling die zendtijd heeft
      verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.a.4°
    text: |-
      de televisieprogramma's, onderscheidenlijk radioprogramma's van de kerkgenootschappen en genootschappen op
      geestelijke grondslag die zendtijd hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.b
    text: |-
      de bedragen die nodig zullen zijn voor het verrichten van activiteiten als bedoeld in
      [artikel 13c, derde lid][ref1], door de instellingen die zendtijd hebben verkregen voor landelijke omroep;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 99.3.c
    text: 'de bedragen die nodig zullen zijn ter bestrijding van de kosten van:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.c.1°
    text: |-
      de Stichting, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma en het
      verrichten van activiteiten als bedoeld in [artikel 13c, derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 99.3.c.2°
    text: het uitzenden van de programma's van de instellingen die zendtijd hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.d
    text: de bedragen die nodig zullen zijn voor de versterking van de programmering;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.e
    text: |-
      de eigen inkomsten van de instellingen die zendtijd hebben verkregen voor landelijke omroep, voor zover die moeten
      worden aangewend voor de verzorging van het programma;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.3.f
    text: het aantal uren zendtijd, dat de Programmastichting en de omroepverenigingen ten minste zullen gebruiken.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: '99.4'
    text: 'In de begroting wordt tevens aangegeven de hoogte van de bedragen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.4.a
    text: |-
      die de omroepverenigingen voornemens zijn te besteden aan programma-onderdelen van informatieve, educatieve en
      culturele aard, waaronder programma-onderdelen die betrekking hebben op kunst;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.4.b
    text: |-
      die de omroepverenigingen voornemens zijn te besteden aan programma-onderdelen die gericht zijn op specifieke
      bevolkings- en leeftijdsgroepen, waaronder in elk geval jeugd en minderheden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.4.c
    text: |-
      die de Programmastichting voornemens is te besteden aan programma-onderdelen van culturele aard en programma-
      onderdelen gericht op specifieke bevolkings- en leeftijdsgroepen, waaronder in elk geval jeugd en minderheden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99.4.d
    text: |-
      de bedragen die de instellingen die zendtijd hebben verkregen voor landelijk omroep voornemens zijn te besteden aan
      programma-onderdelen als bedoel in [artikel 54, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel54
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '54'
        hoofdstuk: III
        afdeling: '1'
  - number: '99.5'
    text: |-
      In de begroting wordt tevens een beschrijving gegeven van de wijze waarop door de instellingen die zendtijd hebben
      verkregen voor landelijke omroep in het afgelopen jaar invulling is gegeven aan de programmering, alsmede een
      overzicht van de feitelijke bestedingen van de instellingen die zendtijd hebben verkregen voor landelijke omroep,
      ingedeeld volgens de onderverdeling die in het tweede tot en met vierde lid is opgenomen. Het overzicht van de
      feitelijke bestedingen heeft in ieder geval betrekking op de twee voorafgaande kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: '99.6'
    text: |-
      Ten behoeve van het opstellen van het overzicht van de feitelijke bestedingen doet elke instelling die zendtijd
      heeft verkregen voor landelijke omroep, jaarlijks voor 1 juni aan de Stichting toekomen een individuele opgave van
      haar feitelijke bestedingen in het voorafgaande kalenderjaar, ingedeeld volgens de onderverdeling die in het tweede
      tot en met vierde lid is opgenomen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: '99.7'
    text: De begroting wordt door de raad van bestuur openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99
  - number: 99a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud en inrichting
      van de begroting, bedoeld in [artikel 99][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel99a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '100'
    text: |-
      Het Commissariaat voor de Media zendt voor 1 november zijn opmerkingen met betrekking tot de begroting, bedoeld in
      [artikel 99][ref1], aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '101.1'
    text: |-
      Onze Minister stelt jaarlijks voor 1 december vast welke bedragen voor het volgende kalenderjaar beschikbaar zijn
      voor de kosten van:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.1.a
    text: |-
      de verzorging van de televisieprogramma's, onderscheidenlijk radioprogramma's, en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref1], van de Programmastichting en de omroepverenigingen die zendtijd hebben verkregen
      tezamen;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 101.1.b
    text: |-
      de verzorging van het televisieprogramma, onderscheidenlijk radioprogramma, en de activiteiten, als bedoeld in
      [artikel 13c, derde lid][ref1], van de Stichting;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 101.1.c
    text: |-
      de verzorging van het televisieprogramma, onderscheidenlijk radioprogramma, en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref1], van de educatieve omroepinstelling die zendtijd heeft verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 101.1.d
    text: |-
      de verzorging van televisieprogramma's onderscheidenlijk radioprogramma's en de activiteiten, bedoeld in
      [artikel 13c, derde lid][ref1], van de kerkgenootschappen en genootschappen op geestelijke grondslag die zendtijd
      hebben verkregen tezamen;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 101.1.e
    text: |-
      de verzorging van de televisieprogramma's, onderscheidenlijk radioprogramma's, van de overige instellingen die
      zendtijd hebben verkregen, te zamen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.1.f
    text: de Stichting, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.1.g
    text: het uitzenden van de programma’s van de instellingen die zendtijd hebben verkregen voor landelijke omroep; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.1.h
    text: de versterking van de programmering.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: '101.2'
    text: |-
      Onze Minister stelt de bedragen voor het volgende kalenderjaar, bedoeld in het eerste lid, onderdelen a tot en
      met d, vast op tachtig procent van de overeenkomstige bedragen die zijn vastgesteld voor het lopende kalenderjaar,
      indien de Stichting de begroting, bedoeld in [artikel 99][ref1], niet tijdig en met inachtneming van de regels,
      gesteld krachtens [artikel 99a,][ref2] aan Onze Minister heeft doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel99a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 99a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '101.3'
    text: |-
      Het bedrag dat beschikbaar is voor versterking van de programmering, bedraagt ten hoogste vijfentwintig procent
      van het totaal van de bedragen die beschikbaar zijn voor de verzorging van de programma’s van de instellingen die
      zendtijd hebben verkregen voor landelijke omroep. Onder versterking van de programmering wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.3.a
    text: versterking van het onderscheidend karakter van de programmering van de publieke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.3.b
    text: |-
      bevordering van een herkenbare programmering op de onderscheiden televisie- en radioprogrammanetten, waaronder
      tevens wordt verstaan bevordering van samenwerkingsprojecten op en tussen de programmanetten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.3.c
    text: |-
      bevordering van de programmering van programma-onderdelen gericht op specifieke bevolkings- en leeftijdsgroepen,
      waaronder in elk geval jeugd en minderheden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: 101.3.d
    text: |-
      bevordering van de programmering van programma-onderdelen van culturele aard en programma-onderdelen die betrekking
      hebben op kunst, waaronder in elk geval toneel, documentaires, film, hoorspelen, klassieke muziek en opera. De raad
      van bestuur stelt jaarlijks de criteria vast volgens welke hij voornemens is het bedrag dat beschikbaar is voor
      versterking van de programmering te besteden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: '101.4'
    text: |-
      Het bedrag dat beschikbaar is voor versterking van de programmering, komt geheel ten goede aan de instellingen die
      zendtijd hebben verkregen voor landelijke omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel101
  - number: '102'
    text: |-
      Onze Minister stelt de bedragen, bedoeld in [artikel 101, eerste lid][ref1], ter beschikking van de raad van
      bestuur. De raad van bestuur verdeelt de bedragen met inachtneming van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '103.1'
    text: |-
      De raad van bestuur stelt jaarlijks voor 1 januari, op basis van het door Onze Minister met toepassing van
      [artikel 101, eerste lid, onderdeel a][ref1], genomen besluit, vast welke bedragen voor het volgende kalenderjaar
      ter beschikking worden gesteld aan de Programmastichting en de omroepverenigingen die zendtijd hebben verkregen,
      ten behoeve van de verzorging van hun televisieprogramma's, onderscheidenlijk radioprogramma's, en de activiteiten
      als bedoeld in [artikel 13c, derde lid][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 103.1.a
    text: |-
      de Programmastichting en de omroepverenigingen die een erkenning hebben verkregen, elk hetzelfde bedrag ontvangen;
      en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel103
  - number: 103.1.b
    text: |-
      de omroepverenigingen die een voorlopige erkenning hebben verkregen, elk een bedrag ontvangen ter hoogte van
      vijftien procent van het bedrag, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel103
  - number: '103.2'
    text: |-
      De raad van bestuur stelt jaarlijks voor 1 januari, op basis van het door Onze Minister met toepassing van
      [artikel 101, eerste lid, onderdelen d en e][ref1], genomen besluit, vast welk bedrag per uur zendtijd voor
      televisieprogramma's, onderscheidenlijk radioprogramma's, die is toegewezen en gebruikt, voor het volgende
      kalenderjaar ter beschikking wordt gesteld aan de kerkgenootschappen en genootschappen op geestelijke grondslag die
      zendtijd hebben verkregen, en aan de overheid ten behoeve van overheidsvoorlichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '103.3'
    text: |-
      Het bedrag per uur zendtijd voor televisieprogramma's, onderscheidenlijk radioprogramma's, bedoeld in het tweede
      lid, kan verschillend zijn per categorie instellingen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel103
  - number: 103a
    text: |-
      De raad van bestuur kan voor een instelling die zendtijd heeft verkregen voor landelijke omroep, de voor het
      volgende kalenderjaar vast te stellen bedragen, bedoeld in [artikel 103, eerste en tweede lid][ref1], verminderen
      met ten hoogste 15% van de overeenkomstige bedragen die zijn vastgesteld voor het lopende kalenderjaar, indien de
      desbetreffende instelling inbreuk heeft gemaakt op bindende besluiten van de raad van bestuur, dan wel indien een
      omroepvereniging of de educatieve omroepinstelling naar het oordeel van de raad van bestuur onvoldoende uitvoering
      geeft aan de bereidheid tot samenwerking, bedoeld in [artikel 32, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel32
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '103'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: 103b
    text: |-
      Voor zover er een verschil bestaat tussen het totaal van de bedragen die op basis van [artikel 102][ref1] door Onze
      Minister ter beschikking zijn gesteld van de raad van bestuur, en het totaal van de bedragen die op basis van de
      [artikelen 103][ref2] en [103][ref3] door de raad van bestuur ter beschikking worden gesteld aan de instellingen
      die zendtijd voor landelijke omroep hebben verkregen, wordt dit verschil door de raad van bestuur aangewend ter
      versterking van de programmering. [Artikel 101, vierde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel103a
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel101
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '102'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '103'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 103a
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '104.1'
    text: |-
      De Programmastichting , de omroepverenigingen en de educatieve omroepinstelling die zendtijd hebben
      verkregen, ontvangen van de raad van bestuur het op basis van [artikel 103, eerste lid][ref1], of
      [artikel 103][ref2]vastgestelde bedrag ter vergoeding van de kosten van de verzorging van hun televisieprogramma,
      onderscheidenlijk radioprogramma en de activiteiten als bedoeld in [artikel 13c, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel103a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '103'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 103a
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: '104.2'
    text: |-
      Het op basis van [artikel 101, eerste lid, onderdeel b][ref1], of [artikel 103a][ref2] vastgestelde bedrag ter
      vergoeding van de kosten van het televisieprogramma, onderscheidenlijk radioprogramma, en de activiteiten als
      bedoeld in [artikel 13c, derde lid][ref3], van de Stichting blijft ter beschikking van de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel103a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 103a
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: '104.3'
    text: |-
      De overige instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van de Stichting
      Etherreclame, ontvangen van de raad van bestuur ter vergoeding van de kosten van de verzorging van hun
      televisieprogramma, onderscheidenlijk radioprogramma, een bedrag dat verkregen wordt door vermenigvuldiging van
      het aantal toegewezen en gebruikte uren zendtijd voor televisieprogramma's, onderscheidenlijk radioprogramma's, met
      het op basis van [artikel 103, tweede en derde lid][ref1], of [artikel 103][ref2] berekende bedrag per uur zendtijd
      voor televisieprogramma's, onderscheidenlijk radioprogramma's.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel103a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '103'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 103a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '104.4'
    text: |-
      In bijzondere gevallen kan de raad van bestuur op aanvraag van een instelling die zendtijd heeft verkregen voor
      landelijke omroep, bepalen dat ten hoogste tien procent van het bedrag dat aan die instelling ter beschikking wordt
      gesteld ter vergoeding van de kosten van de verzorging van haar radioprogramma, kan worden besteed aan de kosten
      van de verzorging van haar televisieprogramma, of andersom.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel104
  - number: '105.1'
    text: |-
      Het op basis van [artikel 101, eerste lid, onderdeel f][ref1], vastgestelde bedrag ter vergoeding van de
      kosten die niet rechtstreeks samenhangen met de verzorging van het programma en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref2], van de Stichting die niet rechtstreeks samenhangen met de verzorging van het
      programma van de Stichting, blijft ter beschikking van de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: '105.2'
    text: |-
      Het op basis van [artikel 101, eerste lid, onderdeel g][ref1], vastgestelde bedrag ter vergoeding van de kosten van
      het uitzenden van de programma’s van de instellingen die zendtijd hebben verkregen voor landelijke omroep, blijft
      ter beschikking van de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '106.1'
    text: |-
      De instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van de Stichting
      Etherreclame, ontvangen van de raad van bestuur voorschotten volgens bij algemene maatregel van bestuur te stellen
      regels.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel106
  - number: '106.2'
    text: |-
      Wanneer blijkt dat de voorschotten worden gebruikt voor andere doeleinden dan waarvoor zij zijn gegeven, kan de
      raad van bestuur de verstrekking van voorschotten beëindigen of verminderen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel106
  - number: 106a.1
    text: |-
      Onze Minister kan – naast de bedragen, bedoeld in [artikel 101, eerste lid][ref1] – gelden ter beschikking stellen
      van de raad van bestuur, welke gelden voor doeleinden die door Onze Minister bij het ter beschikking stellen zijn
      vastgesteld, kunnen worden aangewend ten behoeve van de instellingen die zendtijd hebben verkregen voor landelijke
      omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 106a.2
    text: |-
      Aan het ter beschikking stellen van gelden kunnen voorschriften worden verbonden. Onze Minister kan de beschikking
      tot het ter beschikking stellen van gelden intrekken of wijzigen, indien de aan de beschikking verbonden
      voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel106a
  - number: 106b
    text: Deze paragraaf is niet van toepassing op politieke partijen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel106b
  - number: '107'
    text: |-
      Regionale omroepinstellingen die zendtijd hebben verkregen, krijgen een vergoeding van de provincie die gelijk is
      aan het totaal van hun uitgaven die rechtstreeks met hun omroepactiviteiten verband houden, voor zover die kosten
      door het provinciale bestuur zijn goedgekeurd en voor zover zij niet op andere wijze zijn gedekt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel107
  - number: 107a.1
    text: |-
      Het Commissariaat voor de Media kan op verzoek van het provinciaal bestuur een vergoeding geven aan een
      provincie voor de dekking van de kosten die rechtstreeks verband houden met het functioneren van één regionale
      omroepinstelling ten behoeve van haar radioprogramma. Daaronder wordt begrepen een eenmalige vergoeding van de
      kosten die verband houden met de noodzakelijke infrastructuur voor één regionale omroepinstelling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel107a
  - number: 107a.2
    text: |-
      Het Commissariaat adviseert Onze Minister jaarlijks voor 1 november omtrent de hoogte van het bedrag dat voor het
      volgende kalenderjaar nodig zal zijn voor de vergoedingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel107a
  - number: 107a.3
    text: |-
      Onze Minister stelt, rekening houdend met het advies van het Commissariaat, jaarlijks voor 1 december vast welk
      bedrag voor het volgende kalenderjaar beschikbaar is voor de vergoedingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel107a
  - number: 107b
    text: |-
      Onze Minister stelt het bedrag, bedoeld in [artikel 107][ref1], ter beschikking van het Commissariaat voor de
      Media. Het Commissariaat besteedt dit bedrag met inachtneming van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel107a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel107b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 107a
        hoofdstuk: VIII
        paragraaf: '2'
  - number: 107c
    text: |-
      Het totaal van de gegeven vergoedingen overschrijdt in een kalenderjaar niet het door Onze Minister op basis van
      artikel 107*a*, derde lid, vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel107c
  - number: '108.1'
    text: |-
      De Wereldomroep doet jaarlijks voor 1 oktober een begroting toekomen aan Onze Minister en het Commissariaat voor
      de Media.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: '108.2'
    text: 'De begroting bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.2.a
    text: |-
      een beschrijving van de wijze waarop door de Wereldomroep uitvoering wordt gegeven aan haar taak, bedoeld in
      [artikel 76][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel76
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '76'
        hoofdstuk: V
  - number: 108.2.b
    text: |-
      de hoogte van de bedragen die voor het volgende kalenderjaar nodig zullen zijn om de voornemens van de Wereldomroep
      te verwezenlijken, alsmede een financieel overzicht, inhoudende een raming van de voorziene benodigde middelen voor
      de daarop volgende vier jaren;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.2.c
    text: een toelichting op de onderscheiden onderdelen en begrotingsposten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.2.d
    text: een beschrijving van de wijze van samenwerking met de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: '108.3'
    text: 'In de begroting worden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.3.a
    text: |-
      de bedragen die nodig zullen zijn ter bestrijding van de kosten van de verzorging van de programma’s van de
      Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.3.b
    text: 'de bedragen die nodig zullen zijn ter bestrijding van de kosten van:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.3.b.1°
    text: de Wereldomroep, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma's; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.3.b.2°
    text: het uitzenden van de programma’s van de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108.3.c
    text: |-
      de eigen inkomsten van de Wereldomroep, voor zover die moeten worden aangewend voor de verzorging van de
      programma's.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: '108.4'
    text: |-
      In de begroting wordt tevens een overzicht gegeven van de feitelijke bestedingen van de Wereldomroep. Het overzicht
      heeft in ieder geval betrekking op de twee voorafgaande kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: '108.5'
    text: |-
      In de begroting wordt tevens aangegeven het aantal uren dat de Wereldomroep voornemens is te besteden aan
      programma-onderdelen die zijn geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen
      voor landelijke omroep, dan wel voor programma-onderdelen die reeds als programma-onderdelen van een instelling die
      zendtijd heeft verkregen voor landelijke omroep, zijn uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: '108.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud en inrichting
      van de begroting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108
  - number: 108a
    text: |-
      Het Commissariaat voor de Media zendt voor 1 november zijn opmerkingen met betrekking tot de begroting, bedoeld in
      [artikel 108][ref1], aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 108b.1
    text: |-
      Onze Minister stelt jaarlijks voor 1 december vast welke bedragen voor het volgende kalenderjaar beschikbaar zijn
      voor de kosten van:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108b
  - number: 108b.1.a
    text: de verzorging van de programma’s van de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108b
  - number: 108b.1.b
    text: de Wereldomroep, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma's; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108b
  - number: 108b.1.c
    text: het uitzenden van de programma’s van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108b
  - number: 108b.2
    text: |-
      Onze Minister stelt de bedragen voor het volgende kalenderjaar, bedoeld in het eerste lid, vast op tachtig procent
      van de overeenkomstige bedragen die zijn vastgesteld voor het lopende kalenderjaar, indien de Wereldomroep de
      begroting, bedoeld in [artikel 108][ref1], niet tijdig en met inachtneming van de regels, gesteld krachtens
      [artikel 108, zesde lid][ref2], aan Onze Minister heeft doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel108
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 108c
    text: |-
      Onze Minister stelt de bedragen, bedoeld in [artikel 108][ref1], ter beschikking van het Commissariaat voor de
      Media. Het Commissariaat besteedt deze bedragen met inachtneming van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 108b
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 108d.1
    text: |-
      De Wereldomroep ontvangt van het Commissariaat voor de Media het op basis van
      [artikel 108b, eerste lid, onderdeel a][ref1], vastgestelde bedrag ter vergoeding van de kosten van de verzorging
      van haar programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 108b
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 108d.2
    text: |-
      De Wereldomroep ontvangt van het Commissariaat voor de Media het op basis van
      [artikel 108b, eerste lid, onderdeel b][ref1], vastgestelde bedrag ter vergoeding van de kosten die niet
      rechtstreeks samenhangen met de verzorging van haar programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 108b
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 108d.3
    text: |-
      De Wereldomroep ontvangt van het Commissariaat voor de Media het op basis van
      [artikel 108b, eerste lid, onderdeel c][ref1], vastgestelde bedrag ter vergoeding van de kosten van het uitzenden
      van haar programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 108b
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 108e.1
    text: |-
      De Wereldomroep ontvangt van het Commissariaat voor de Media voorschotten volgens bij algemene maatregel van
      bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108e
  - number: 108e.2
    text: |-
      Wanneer blijkt dat de voorschotten worden gebruikt voor andere doeleinden dan waarvoor zij zijn gegeven, kan het
      Commissariaat de verstrekking van voorschotten beëindigen of verminderen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel108e
  - number: '109.1'
    text: |-
      De instellingen die zendtijd hebben verkregen voor landelijke omroep – met uitzondering van de overheid – en de
      Wereldomroep leggen financiële rekening en verantwoording af aan het Commissariaat voor de Media ten behoeve van de
      rechtmatigheidstoetsing van de uitgaven. Zij doen daartoe jaarlijks voor 1 juni hun jaarrekening toekomen aan het
      Commissariaat. Het boekjaar is gelijk aan een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109
  - number: '109.2'
    text: |-
      De instellingen die zendtijd hebben verkregen voor landelijke omroep – met uitzondering van de overheid – doen
      jaarlijks voor 1 juni een afschrift van hun jaarrekening over het voorafgaande boekjaar toekomen aan de raad
      van bestuur. De raad van bestuur zendt voor 1 juli zijn opmerkingen met betrekking tot de jaarrekeningen aan het
      Commissariaat.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109
  - number: '109.3'
    text: |-
      [Titel 9 van het Tweede Boek van het Burgerlijk Wetboek][ref1] is van toepassing op de instellingen, bedoeld in het
      eerste lid, met dien verstande dat zij de winst- en verliesrekening vervangen door een exploitatierekening; op deze
      rekening zijn de bepalingen omtrent de winst- en verliesrekening zoveel mogelijk van overeenkomstige toepassing.
      Bepalingen omtrent winst en verlies zijn zoveel mogelijk van overeenkomstige toepassing op het exploitatiesaldo.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '109.4'
    text: |-
      De jaarrekening bevat tevens de gegevens, bedoeld in [artikel 99, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '109.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inrichting van de
      jaarrekening.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109
  - number: 109a.1
    text: |-
      Indien het bedrag dat aan een instelling die zendtijd heeft verkregen voor landelijke omroep, ter beschikking
      is gesteld voor de verzorging van haar televisieprogramma, onderscheidenlijk radioprogramma, en activiteiten
      als bedoeld in [artikel 13c, derde lid][ref1], de blijkens de jaarrekening daarvoor gemaakte kosten te boven
      gaat, wordt het resterende deel door die instelling gereserveerd ter besteding aan het doel waarvoor het bedrag
      oorspronkelijk ter beschikking was gesteld, onverminderd [artikel 104, vierde lid][ref2]. De raad van bestuur kan
      voor deze reserveringen een maximum per categorie instellingen vaststellen. Indien het deel van het ter beschikking
      gestelde bedrag dat niet nodig is om de kosten te dekken, groter is dan het in de vorige zin bedoelde maximum,
      wordt het verschil door de instelling terugbetaald aan de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel104
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '104'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 109a.2
    text: |-
      Indien het bedrag dat krachtens [artikel 108][ref1], aan de Wereldomroep ter beschikking is gesteld, de blijkens
      de jaarrekening gemaakte kosten te boven gaat, wordt het resterende deel door de Wereldomroep gereserveerd ter
      besteding aan het doel waarvoor het bedrag oorspronkelijk ter beschikking was gesteld. Het Commissariaat voor de
      Media kan voor deze reserveringen een maximum vaststellen. Indien het deel van het ter beschikking gestelde bedrag
      dat niet nodig is om de kosten te dekken, groter is dan het in de vorige zin bedoelde maximum, wordt het verschil
      door de instelling terugbetaald aan het Commissariaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108d
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 108d
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 109a.3
    text: 'Voor zover ter beschikking gestelde bedragen zijn gebruikt voor een ander doel dan waarvoor zij zijn gegeven:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
  - number: 109a.3.a
    text: |-
      betaalt de instelling op eerste vordering van het Commissariaat deze bedragen terug aan de raad van bestuur, tenzij
      het de Stichting of de Wereldomroep betreft;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
  - number: 109a.3.b
    text: |-
      betaalt de Stichting of de Wereldomroep op eerste vordering van het Commissariaat deze bedragen terug aan het
      Commissariaat;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
  - number: 109a.3.c
    text: |-
      betaalt, indien het gelden als bedoeld in [artikel 101, eerste lid, onderdeel h, en derde en vierde lid][ref1],
      [artikel 106a][ref2], of [artikel 170c, tweede lid][ref3], betreft die aan de instellingen die zendtijd voor
      landelijke omroep hebben verkregen beschikbaar zijn gesteld en onverminderd de onderdelen a en b, de instelling op
      eerste vordering van de raad van bestuur deze bedragen terug aan de raad van bestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel106a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel170c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 106a
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 170c
        hoofdstuk: XI
        paragraaf: '2'
  - number: 109a.3.d
    text: |-
      betaalt, indien de in onderdeel c bedoelde gelden met instemming van de raad van bestuur zijn gebruikt, de raad van
      bestuur op eerste vordering van het Commissariaat deze bedragen terug aan het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
  - number: 109a.4
    text: |-
      Indien de toewijzing van zendtijd aan een instelling wordt beëindigd, betaalt zij de reserveringen, bedoeld
      in het eerste lid, en de ter beschikking gestelde bedragen, voor zover deze niet zijn gebruikt overeenkomstig
      [artikel 104][ref1], op eerste vordering aan de raad van bestuur terug.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel104
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '104'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 109b.1
    text: |-
      Indien met toepassing van deze wet een bijdrage in investeringen is verleend aan een instelling die zendtijd
      voor landelijke omroep heeft verkregen, betaalt de instelling bij vervreemding van het desbetreffende onroerend
      goed of bij beëindiging van de haar toegewezen zendtijd de vergoeding terug aan de raad van bestuur. De terug te
      betalen bijdrage wordt evenwel verminderd met de door de raad van bestuur vast te stellen afschrijvingspercentages
      voor elk vol jaar dat is verstreken sedert de vergoeding is gegeven. Terugbetaalde vergoedingen worden aangewend
      ter versterking van de programmering en de coördinatie; [artikel 101, vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 109b.2
    text: |-
      Indien met toepassing van deze wet een bijdrage in investeringen is verleend aan een instelling die zendtijd voor
      regionale omroep heeft verkregen, betaalt de instelling bij vervreemding van het desbetreffende onroerend goed of
      bij beëindiging van de haar toegewezen zendtijd de vergoeding terug aan het Commissariaat voor de Media. De terug
      te betalen bijdrage wordt evenwel verminderd met de door het Commissariaat vast te stellen afschrijvingspercentages
      voor elk vol jaar dat is verstreken sedert de vergoeding is gegeven. Terugbetaalde vergoedingen worden aangewend
      ter bestrijding van de kosten, bedoeld in [artikel 28][ref1], met uitzondering van de kosten, bedoeld in
      [artikel 28, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel28
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
  - number: 109c.1
    text: |-
      Indien een instelling die zendtijd voor landelijke omroep heeft verkregen, haar jaarrekening niet tijdig aan het
      Commissariaat voor de Media doet toekomen, vermindert de raad van bestuur op eerste verzoek van het Commissariaat
      de verstrekking van de bevoorschotting, bedoeld in [artikel 106, eerste lid][ref1], met twintig procent. Indien
      een instelling ondanks herhaalde aanmaningen van het Commissariaat in gebreke blijft met het indienen van haar
      jaarrekening, kan het Commissariaat de raad van bestuur verzoeken de verstrekking van de bevoorschotting verder te
      verminderen of te beëindigen. De raad van bestuur voldoet terstond aan een dergelijk verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel106
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '106'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 109c.2
    text: |-
      Indien de Wereldomroep zijn jaarrekening niet tijdig aan het Commissariaat doet toekomen, vermindert het
      Commissariaat de verstrekking van de bevoorschotting, bedoeld in [artikel 108][ref1], met twintig procent. Indien
      de Wereldomroep ondanks herhaalde aanmaningen van het Commissariaat in gebreke blijft met het indienen van zijn
      jaarrekening, kan het Commissariaat de verstrekking van de bevoorschotting verder verminderen of beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108e
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 108e
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 109d.1
    text: |-
      Deze paragraaf is op kerkgenootschappen en genootschappen op geestelijke grondslag slechts van toepassing, voor
      zover het betreft de activiteiten en financiën die betrekking hebben op de omroepactiviteiten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109d
  - number: 109d.2
    text: Deze paragraaf is niet van toepassing op politieke partijen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109d
  - number: 109e.1
    text: |-
      Binnen tien maanden na afloop van het kalenderjaar legt het bestuur van iedere provincie die een vergoeding als
      bedoeld in [artikel 107a, eerste lid][ref1], heeft ontvangen, aan het Commissariaat voor de Media een verklaring
      over van een accountant als bedoeld in [artikel 393 van boek 2 van het Burgerlijk Wetboek][ref2], waaruit blijkt
      of en in hoeverre de vergoeding is besteed ten behoeve van het doel waarvoor zij was bestemd. Indien de toegezegde
      vergoeding kleiner is dan € 22 689, kan worden volstaan met een verklaring ter zake van het provinciaal bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel107a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109e
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 107a
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 109e.2
    text: |-
      Voor zover niet uit een verklaring als bedoeld in het eerste lid blijkt dat de vergoeding is besteed ten behoeve
      van het doel waarvoor zij was bestemd, wordt het desbetreffende bedrag teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel109e
  - number: '110'
    text: |-
      De instellingen die zendtijd hebben verkregen voorzien op onafhankelijke wijze in publieke omroep door verzorging
      van publieke omroepprogramma's. Daartoe hebben de instellingen die zendtijd hebben verkregen op de wijze zoals
      geregeld in deze wet aanspraak op bekostiging uit 's Rijks kas die een kwalitatief hoogwaardige programmering
      mogelijk maakt en waardoor continuïteit van financiering gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel110
  - number: '111.1'
    text: |-
      Ter uitvoering van [artikel 110][ref1] en ter bestrijding van de overige kosten genoemd in
      [artikel 28, met uitzondering van de onder e bedoelde][ref2], wordt onder de naam rijksomroepbijdrage jaarlijks
      door Onze Minister een bedrag beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel28
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
  - number: '111.2'
    text: |-
      De in het eerste lid bedoelde rijksomroepbijdrage bestaat ten minste uit het bedrag van de in het jaar 1998 door
      de Dienst omroepbijdragen op grond van de toen geldende bepalingen van deze wet aan Onze Minister afgedragen
      inkomsten. Onze Minister stelt het in de vorige volzin bedoelde bedrag jaarlijks bij met de door het Centraal
      Bureau voor de Statistiek vastgestelde index voor de groei van het aantal huishoudens in Nederland en met de door
      het Centraal Bureau voor de Statistiek voor een kalenderjaar vastgestelde prijsindex voor de gezinsconsumptie.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel111
  - number: '111.3'
    text: |-
      Het op grond van het tweede lid vastgestelde bedrag van de rijksomroepbijdrage wordt verminderd met € 81,148
      miljoen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel111
  - number: '111.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het
      eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel111
  - number: '111.5'
    text: |-
      Aan de beschikbaarheid van de rijksomroepbijdrage worden geen andere voorwaarden gesteld dan de voorwaarden die bij
      of krachtens deze wet zijn of kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel111
  - number: '123.1'
    text: |-
      Er is een Bedrijfsfonds voor de pers dat ten doel heeft het handhaven en bevorderen van de pluriformiteit van de
      pers, voor zover die van belang is voor de informatie en opinievorming. Het Fonds heeft rechtspersoonlijkheid en is
      gevestigd in de gemeente 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel123
  - number: '123.2'
    text: 'Naast de taken die het Fonds heeft op grond van andere wettelijke bepalingen, heeft het Fonds tot taak:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel123
  - number: 123.2.a
    text: |-
      het uitoefenen van toezicht op de naleving van het bij of krachtens dit hoofdstuk bepaalde met betrekking tot de
      pers
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel123
  - number: 123.2.b
    text: het verrichten dan wel doen verrichten van onderzoek met betrekking tot het functioneren van de pers.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel123
  - number: '123.3'
    text: |-
      Met het in het tweede lid, onderdeel a, bedoelde toezicht op de naleving zijn belast de leden van het bestuur van
      het Bedrijfsfonds en de bij besluit van het bestuur daartoe aangewezen medewerkers van het Bedrijfsfonds.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel123
  - number: '123.4'
    text: Van een besluit als bedoeld in het derde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel123
  - number: '124.1'
    text: |-
      Het Bedrijfsfonds voor de pers heeft een bestuur dat bestaat uit een voorzitter en zes andere leden. Zij worden bij
      koninklijk besluit op voordracht van Onze Minister benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel124
  - number: '124.2'
    text: |-
      Een benoeming geschiedt voor een periode van vijf jaren. Herbenoeming voor een aansluitende periode is éénmaal
      mogelijk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel124
  - number: '124.3'
    text: 'Met het lidmaatschap van het bestuur zijn onverenigbaar:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel124
  - number: 124.3.a
    text: |-
      een betrekking in dienst bij een ministerie of bij een instelling of een dienst die, dan wel een bedrijf dat, onder
      de verantwoordelijkheid van een minister werkzaam is;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel124
  - number: 124.3.b
    text: een bestuurslidmaatschap bij, of een betrekking in dienst van een persorgaan, of de uitgever van een persorgaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel124
  - number: '124.4'
    text: |-
      Naast ontslag op eigen verzoek van de betrokkene is ontslag alleen mogelijk op grond van ongeschiktheid, wegens
      het hebben van financiële belangen bij instellingen ten aanzien waarvan het Fonds wettelijke bevoegdheden heeft en
      wegens het aanvaarden van een betrekking die, of van een lidmaatschap dat met het lidmaatschap van het bestuur van
      het Fonds onverenigbaar is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel124
  - number: '124.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de bezoldiging en de
      verdere rechtspositie van de bestuursleden van het Fonds en van zijn personeel.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel124
  - number: '125.1'
    text: |-
      Het bestuur van het Bedrijfsfonds voor de pers neemt besluiten bij meerderheid van stemmen. Van een besluit tot
      steunverlening wordt binnen een week nadat het is genomen mededeling gedaan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel125
  - number: '125.2'
    text: |-
      Het bestuur stelt regels vast over de besluitvorming en de werkwijze van het bestuur. Deze regels behoeven de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel125
  - number: '126'
    text: |-
      De kosten van het Bedrijfsfonds voor de pers worden door Onze Minister vergoed. De begroting en de jaarrekening
      behoeven zijn instemming.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel126
  - number: '127.1'
    text: |-
      Besluiten van het Bedrijfsfonds voor de pers kunnen gedurende zes weken na de mededeling daarvan aan Onze Minister,
      dan wel gedurende de tijd dat het besluit is geschorst, bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel127
  - number: '127.2'
    text: |-
      Schorsing van besluiten van het Bedrijfsfonds kan slechts plaatsvinden gedurende vier weken dagen na de mededeling
      daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel127
  - number: '127.3'
    text: |-
      In afwijking van [artikel 10:35 van de Algemene wet bestuursrecht][ref1] kan schorsing of vernietiging alleen
      geschieden wegens strijd met het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '127.4'
    text: |-
      Een koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel127
  - number: '127.5'
    text: |-
      Een besluit tot toekenning van financiële steunverlening treedt eerst in werking na afloop van een termijn van vier
      weken of zoveel eerder als Onze Minister heeft medegedeeld niet tot een voordracht voor schorsing of vernietiging
      over te gaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel127
  - number: '128.1'
    text: |-
      Onze Minister bepaalt welk percentage van de inkomsten uit reclameboodschappen en telewinkelboodschappen van de
      Stichting Etherreclame, de lokale en regionale omroepinstellingen die zendtijd hebben verkregen, en de commerciële
      omroepinstellingen jaarlijks wordt uitgekeerd ten behoeve van het Bedrijfsfonds voor de pers. Dit percentage is
      niet hoger dan vier.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel128
  - number: '128.2'
    text: |-
      De uitgaven van het Bedrijfsfonds worden bestreden uit de in het eerste lid bedoelde inkomsten en uit andere
      beschikbare middelen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel128
  - number: '128.3'
    text: Onze Minister kan nadere regels geven over de vaststelling van de in het eerste lid bedoelde inkomsten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel128
  - number: '129.1'
    text: |-
      Het Bedrijfsfonds voor de pers kan binnen de door Onze Minister met toepassing van [artikel 128][ref1] beschikbaar
      gestelde bedragen ten behoeve van persorganen aan de uitgever van een persorgaan financiële steun verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel128
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '128'
        hoofdstuk: IX
  - number: '129.2'
    text: 'Financiële steun kan uitsluitend worden verleend ten behoeve van persorganen die voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.a
    text: zij worden in Nederland uitgegeven en zijn bestemd voor het publiek in Nederland;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.b
    text: |-
      zij bevatten in belangrijke mate nieuws, analyse, commentaar en achtergrondinformatie over een gevarieerd deel van
      de maatschappelijke actualiteit, mede in het belang van politieke meningsvorming;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.c
    text: |-
      zij worden geredigeerd door een zelfstandige redactie op basis van een statuut waarin de redactionele identiteit
      is neergelegd;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.d
    text: zij verschijnen regelmatig en tenminste maandelijks;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.e
    text: zij zijn voor iedereen verkrijgbaar;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.f
    text: zij worden verkrijgbaar gesteld tegen betaling;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.g
    text: zij worden niet uitgegeven door of vanwege de overheid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: 129.2.h
    text: |-
      zij worden niet uitgegeven of verspreid in samenhang met het lidmaatschap, donateurschap of deelnemerschap van een
      vereniging, kerkgenootschap of andere organisatie.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel129
  - number: '130.1'
    text: |-
      Het Bedrijfsfonds voor de pers kan ten behoeve van persorganen individuele financiële steun verlenen in de vorm van
      krediet en kredietfaciliteiten, indien de continuïteit dan wel het starten van de exploitatie van het persorgaan
      in gevaar is respectievelijk niet mogelijk is en de noodzakelijke steun niet of niet afdoende op andere wijze kan
      worden verkregen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel130
  - number: '130.2'
    text: |-
      De financiële steun wordt slechts verleend indien de verantwoordelijke uitgever een project indient dat uitzicht
      biedt op een rendabele exploitatie binnen een redelijke periode. De financiële steun wordt slechts verleend onder
      voorwaarde van uitvoering van het door het Fonds goedgekeurde project.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel130
  - number: '130.3'
    text: |-
      Financiële steun voor de start van de exploitatie van een persorgaan kan uitsluitend worden verleend aan
      persorganen die tenminste zes keer per week verschijnen en voor ten hoogste de helft van de begrote kosten van het
      in het tweede lid bedoelde project.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel130
  - number: '130.4'
    text: |-
      Uitsluitend ten behoeve van een éénmalige reorganisatie van een persorgaan kan de in het eerste lid bedoelde
      financiële steun worden verleend in de vorm van een uitkering indien het in het tweede lid bedoelde project niet op
      doeltreffende wijze kan worden uitgevoerd met behulp van kredietverlening en kredietfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel130
  - number: '130.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van de in het eerste lid bedoelde gevallen nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel130
  - number: '131'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het Bedrijfsfonds voor de pers in andere gevallen
      dan bedoeld in [artikel 130, vierde lid][ref1], financiële steun aan persorganen kan verlenen in de vorm van
      uitkeringen. Daarbij wordt bepaald voor welke doeleinden de uitkering kan worden verleend, alsmede aan welke
      nadere eisen persorganen en de uitgevers van die persorganen dienen te voldoen om voor een uitkering in aanmerking
      te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
        hoofdstuk: IX
  - number: '132.1'
    text: |-
      Financiële steun wordt verleend op aanvraag. Het Bedrijfsfonds voor de pers beslist schriftelijk op de aanvraag.
      Aanvragen voor individuele financiële steun op grond van [artikel 130][ref1] worden in volgorde van ontvangst in
      behandeling genomen en beslist. Indien het in een jaar ter beschikking staande bedrag voor steunverlening volledig
      is toegewezen, worden volgende aanvragen afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
        hoofdstuk: IX
  - number: '132.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven over de aard van de voorschriften die het Bedrijfsfonds
      aan een besluit tot financiële steunverlening kan verbinden. De voorschriften hebben geen betrekking op de inhoud
      van de persorganen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel132
  - number: '132.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de indiening en de wijze van
      behandeling van de aanvragen tot financiële steun, de hoogte en de wijze van berekening daarvan, de er aan te
      verbinden voorschriften, de verstrekking van voorschotten, de beëindiging en de terugvordering van de steun.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel132
  - number: '134.1'
    text: 'Het Commissariaat voor de Media is belast met de bestuursrechtelijke handhaving van het bepaalde bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel134
