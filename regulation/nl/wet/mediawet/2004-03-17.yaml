preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Omroepwet, de Wet op de omroepbijdragen en de Wet
    Voorziening Perswezen 1951 te vervangen door een wet, die regels geeft over de omroepbijdragen, de verzorging van
    radio- en televisieprogramma's, de uitzending daarvan door middel van omroepzenders en draadomroepinrichtingen en
    de steunmaatregelen ten behoeve van persorganen, opdat de verscheidenheid in radio, televisie en pers gewaarborgd
    wordt en de samenhang in regelgeving ten aanzien van deze media tot uitdrukking wordt gebracht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel1
  - number: 1.b
    text: 'media: alle gedrukte en elektronische vormen van massacommunicatie;'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel1
  - number: 1.c
    text: 'omroep: een elektronische mediadienst die betrekking heeft op het verzorgen en uitzenden van programma''s;'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel1
  - number: 1.d
    text: |-
