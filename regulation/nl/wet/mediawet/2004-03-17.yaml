  - number: '134.2'
    text: Het Commissariaat oefent geen voorafgaand toezicht uit op de inhoud van een programma.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel134
  - number: '134.3'
    text: |-
      Met het toezicht op de naleving van de in het eerste lid genoemde onderdelen van deze wet zijn belast de leden van
      het Commissariaat en de bij besluit van het Commissariaat aangewezen medewerkers van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel134
  - number: '134.4'
    text: Van een besluit als bedoeld in het derde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel134
  - number: '134.5'
    text: |-
      Het Commissariaat stelt jaarlijks voor 1 november Onze Minister in kennis van het voorgenomen handhavingsbeleid in
      het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel134
  - number: '135.1'
    text: |-
      Het Commissariaat voor de Media kan de Stichting, de verzorger van een programma dat door middel van een
      omroepzender of een omroepnetwerk wordt uitgezonden, de aanbieder van een omroepzender of een omroepnetwerk en de
      Wereldomroep een bestuurlijke boete opleggen:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel135
  - number: 135.1.a
    text: |-
