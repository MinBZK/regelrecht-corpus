  - number: '135.2'
    text: |-
      Het Commissariaat draagt de opbrengst van de bestuurlijke boeten af aan Onze Minister. De afgedragen opbrengst
      dient ter aanwending voor door Onze Minister te bepalen mediadoeleinden in brede zin.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel135
  - number: '137'
    text: |-
      Een boete opgelegd krachtens [artikel 135][ref1] kan bij dwangbevel door het Commissariaat voor de Media worden
      ingevorderd. Het dwangbevel wordt op kosten van degene tot wie het gericht is bij deurwaardersexploit betekend en
      ten uitvoer gelegd op de wijze bij het [Wetboek van Burgerlijke Rechtsvordering][ref2] ten aanzien van vonnissen
      en authentieke akten voorgeschreven. Binnen 30 dagen na de betekening staat verzet tegen het dwangbevel open door
      dagvaarding van het Commissariaat. Het verzet schorst de tenuitvoerlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '135'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0001827
  - number: 138b
    text: |-
      De in [artikel 134, derde lid][ref1], bedoelde toezichthouders zijn bevoegd, met medeneming van de benodigde
      apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel134
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel138b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '134'
        hoofdstuk: X
  - number: 138d
    text: |-
      Instellingen die een programma voor binnenlandse omroep verzorgen en de Wereldomroep bewaren gedurende twee weken
      na de uitzending opnamen van hun uitgezonden programma's. Zij stellen deze opnamen desgevraagd ter beschikking van
      het Commissariaat voor de Media.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel138d
  - number: '139'
    text: |-
      Iedere instelling die zendtijd heeft verkregen en de Wereldomroep dragen er zorg voor dat de leden van het
      Commissariaat voor de Media en de door hen daartoe aangewezen medewerkers van het Commissariaat desgevraagd inzage
      verkrijgen in - en kopieën kunnen maken van - de zakelijke gegevens en bescheiden van de bedrijven of ondernemingen
      die hebben meegewerkt aan de verzorging van hun programma-onderdelen, voor zover dat voor de vervulling van de
      toezichthoudende taak van het Commissariaat met betrekking tot de naleving van het bepaalde bij of krachtens de
      [artikelen 52][ref1], [52a][ref2], [52b][ref3], [55][ref4], [56][ref5] en [56a][ref6] door de instellingen die
      zendtijd hebben verkregen en de Wereldomroep, redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel52b
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel56
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel56a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel139
