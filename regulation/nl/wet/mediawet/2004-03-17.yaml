  - number: '3'
    text: |-
      Onder reclame-uiting als bedoeld in [artikel 1, onderdeel jj][ref1], wordt niet verstaan het oproepen tot steun
      aan, of het gunstig stemmen ten aanzien van instellingen met een wetenschappelijk, cultureel, godsdienstig,
      levensbeschouwelijk, politiek of liefdadig karakter, voor zover deze niet betrekking hebben op het kopen van een
      bepaald produkt of het gebruik maken van een bepaalde dienstverlening, die in de handel verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
        hoofdstuk: I
  - number: '4.1'
    text: |-
      Onder de bevoegdheid van Nederland vallen omroepinstellingen die een televisieprogramma verzorgen en krachtens
      artikel 2 van de Europese richtlijn onder die Nederlandse bevoegdheid vallen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een omroepinstelling die een radioprogramma verzorgt met dien
      verstande dat in ieder geval onder de bevoegdheid van Nederland valt een omroepinstelling die een radioprogramma
      verzorgt dat in Nederland door middel van een omroepzender, satellieten daaronder niet begrepen, wordt uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel4
  - number: '9'
    text: |-
      Er is een Commissariaat voor de Media. Het Commissariaat heeft rechtspersoonlijkheid en is gevestigd in de gemeente
      Hilversum.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel9
  - number: '10.1'
    text: |-
      Het Commissariaat voor de Media bestaat uit een voorzitter en twee of vier andere leden. Zij worden bij koninklijk
      besluit op voordracht van Onze Minister benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: '10.2'
    text: |-
      Een benoeming geschiedt voor een periode van vijf jaren. Herbenoeming voor een aansluitende periode is éénmaal
      mogelijk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: '10.3'
    text: 'Met het lidmaatschap van het Commissariaat zijn onverenigbaar:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: 10.3.a
    text: |-
      een betrekking in dienst bij een ministerie, of bij een instelling of een dienst die, dan wel een bedrijf dat onder
      de verantwoordelijkheid van een minister werkzaam is;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: 10.3.b
    text: een lidmaatschap van een der Kamers van de Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: 10.3.c
    text: |-
      een bestuurslidmaatschap bij – of een betrekking in dienst van – een instelling die in aanmerking komt voor
      zendtijd voor binnenlandse omroep, een commerciële omroepinstelling, het Bedrijf dan wel een uitgever van een
      persorgaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: '10.4'
    text: |-
      Naast ontslag op eigen verzoek van de betrokkene is ontslag alleen mogelijk op grond van ongeschiktheid, wegens het
      hebben van financiële belangen bij instellingen ten aanzien waarvan het Commissariaat wettelijke bevoegdheden heeft
      en wegens het aanvaarden van een betrekking die, of een lidmaatschap dat met het lidmaatschap van het Commissariaat
      onverenigbaar is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: '10.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de bezoldiging en de verdere
      rechtspositie van de leden van het Commissariaat en van zijn personeel.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel10
  - number: '11.1'
    text: |-
      Het Commissariaat voor de Media neemt besluiten bij meerderheid van stemmen. Van besluiten wordt zo spoedig
      mogelijk na de bekendmaking mededeling gedaan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel11
  - number: '11.2'
    text: |-
      Het Commissariaat kan slechts met instemming van alle leden aan één of meer van zijn leden mandaat en machtiging
      verlenen tot het uitvoeren van delen van zijn taak.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel11
  - number: '11.3'
    text: |-
      Het Commissariaat stelt regels ten aanzien van zijn besluitvorming en werkwijze. Deze regels behoeven de instemming
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel11
  - number: '12.1'
    text: |-
      De kosten van het Commissariaat voor de Media worden door Onze Minister vergoed. Het Commissariaat stelt voor 1
      november een begroting vast voor het volgende kalenderjaar. De begroting behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel12
  - number: '12.2'
    text: |-
      Het Commissariaat brengt jaarlijks aan Onze Minister voor 1 juni een financieel verslag uit, dat vergezeld gaat
      van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1]. Het financieel verslag behoeft de instemming van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '12.3'
    text: Het Commissariaat stelt de in het tweede lid bedoelde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel12
  - number: '12.4'
    text: |-
      Onze Minister kan regels stellen over de inrichting van de begroting, het financieel verslag en aandachtspunten
      voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel12
  - number: '13.1'
    text: |-
      Besluiten van het Commissariaat voor de Media kunnen gedurende zes weken na de mededeling daarvan aan Onze
      Minister, dan wel gedurende de tijd dat het besluit is geschorst, bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13
  - number: '13.2'
    text: |-
      Schorsing van besluiten van het Commissariaat kan slechts plaatsvinden gedurende vier weken na de mededeling
      daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13
  - number: '13.3'
    text: |-
      Een koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13
  - number: 13a.1
    text: |-
      Het Commissariaat voor de Media verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13a
  - number: 13a.2
    text: |-
      Indien naar het oordeel van Onze Minister het Commissariaat zijn taken niet of niet naar behoren uitvoert, kan Onze
      Minister, na overleg met het Commissariaat, de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13a
  - number: 13a.3
    text: |-
      Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van de door hem getroffen
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13a
  - number: 13b.1
    text: |-
      Het Commissariaat voor de Media stelt jaarlijks voor 1 juni een verslag op van zijn werkzaamheden, het gevoerde
      beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkzaamheden in het bijzonder in het
      afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld. Onze
      Minister zendt het verslag aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13b
  - number: 13b.2
    text: |-
      Onze Minister zendt telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van het functioneren van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13b
  - number: 13c.1
    text: 'De publieke omroep heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.1.a
    text: |-
      het op landelijk, regionaal en lokaal niveau verzorgen van een pluriform en kwalitatief hoogstaand aanbod van
      programma's voor algemene omroep op het gebied van informatie, cultuur, educatie en verstrooiing en deze in
      ieder geval door middel van omroepzenders te verspreiden naar alle huishoudens in het verzorgingsgebied waarvoor
      de programma's zijn bestemd en voor de ontvangst waarvan geen andere kosten verschuldigd zijn dan de kosten van
      aankoop of gebruik van technische voorzieningen die de ontvangst mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.1.b
    text: het verrichten van alle activiteiten met betrekking tot programmaverzorging en uitzending die daartoe nodig zijn;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.1.c
    text: |-
      het verzorgen en uitzenden van programma's, bestemd voor landen en gebieden buiten Nederland en voor Nederlanders
      die buiten de landsgrenzen verblijven.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.2
    text: |-
      De programma's van de publieke omroep geven op evenwichtige wijze een beeld van de samenleving en van de onder de
      bevolking levende interesses en inzichten op maatschappelijk, cultureel en levensbeschouwelijk gebied, en:
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.2.a
    text: zijn toegankelijk voor de gehele bevolking in het verzorgingsgebied waarvoor de programma's zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.2.b
    text: dragen bij aan de ontwikkeling en verspreiding van de pluriformiteit en culturele diversiteit in Nederland;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.2.c
    text: |-
      zijn onafhankelijk van commerciële invloeden en, behoudens het bepaalde bij of krachtens de wet, van
      overheidsinvloeden; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.2.d
    text: |-
      zijn gericht op zowel een breed en algemeen publiek als op bevolkings- en leeftijdsgroepen van verschillende omvang
      en samenstelling.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: 13c.3
    text: |-
      De publieke omroep kan mede invulling geven aan zijn taak, bedoeld in het eerste lid, door tevens te voorzien in
      andere dan de in het eerste lid, onderdeel a, bedoelde wijzen van aanbod en verspreiding van programmamateriaal.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel13c
  - number: '14.1'
    text: 'Een omroepvereniging is een vereniging die voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel14
  - number: 14.1.a
    text: de vereniging heeft volledige rechtsbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel14
  - number: 14.1.b
    text: |-
      de vereniging stelt zich blijkens haar statuten uitsluitend, althans hoofdzakelijk ten doel, ter uitvoering van de
      taak van de publieke omroep, bedoeld in [artikel 13c][ref1], op landelijk niveau een programma voor algemene omroep
      te verzorgen en alle activiteiten met betrekking tot programmaverzorging en uitzending te verrichten die daartoe
      nodig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 14.1.c
    text: |-
      de vereniging stelt zich blijkens haar statuten ten doel in haar programma een bepaalde, in de statuten aangeduide,
      maatschappelijke, culturele of godsdienstige dan wel geestelijke stroming te vertegenwoordigen en zich in haar
      programma te richten op de bevrediging van in het volk levende maatschappelijke, culturele of godsdienstige dan wel
      geestelijke behoeften.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel14
  - number: '14.2'
    text: |-
      Voor de toepassing van deze wet worden onder leden van een omroepvereniging verstaan die leden die tenminste
      zestien jaren oud zijn, in Nederland woonplaats hebben, en hun contributie, die is vastgesteld met inachtneming van
      [artikel 64][ref1], hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel64
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '64'
        hoofdstuk: III
        afdeling: '2'
  - number: '15.1'
    text: |-
      De Nederlandse Programma Stichting verzorgt een programma dat bestaat uit onderdelen die voorzien in de bevrediging
      van in het volk levende maatschappelijke, culturele, godsdienstige of geestelijke behoeften, zodanig dat dit
      programma te zamen met de programma’s van de andere instellingen die zendtijd voor landelijke omroep hebben
      verkregen, een evenwichtig beeld oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke
      verscheidenheid in Nederland.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15
  - number: '15.2'
    text: Het bestuur van de Programmastichting bestaat uit een voorzitter en zes andere leden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15
  - number: '15.3'
    text: |-
      Onze Minister benoemt de voorzitter en de andere leden van het bestuur. Voor benoeming komen in aanmerking personen
      die deskundig zijn op het gebied van het programma dat de Programmastichting verzorgt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15
  - number: '15.4'
    text: |-
      De leden van het bestuur worden telkens voor een termijn van vier jaren benoemd. Herbenoeming voor een aansluitende
      periode is éénmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15
  - number: '15.5'
    text: Naast ontslag op eigen verzoek van een bestuurder is ontslag alleen mogelijk op grond van ongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15
  - number: 15a.1
    text: |-
      De Programmastichting heeft een programmaraad, die het bestuur adviseert over het programma dat de
      Programmastichting verzorgt.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15a
  - number: 15a.2
    text: De programmaraad bestaat uit een voorzitter en negentien andere leden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15a
  - number: 15a.3
    text: |-
      Onze Minister benoemt de voorzitter van de programmaraad. De andere leden van de programmaraad worden benoemd door
      maatschappelijke en culturele organisaties die daartoe door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15a
  - number: 15a.4
    text: |-
      De leden van de programmaraad worden telkens voor een termijn van vijf jaren benoemd. De leden die in de loop van
      de vijfjarige termijn zijn benoemd, treden tegelijk met de andere leden af. De leden zijn terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15a
  - number: 15a.5
    text: |-
      De programmaraad regelt zijn werkzaamheden. Deze regels behoeven de instemming van het bestuur van de
      Programmastichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15a
  - number: 15b.1
    text: Wijzigingen in de statuten van de Programmastichting behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15b
  - number: 15b.2
    text: Het bestuur van de Programmastichting kan niet besluiten tot ontbinding van de Programmastichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel15b
  - number: '16.1'
    text: De Nederlandse Omroep Stichting is het samenwerkings- en coördinatieorgaan van de landelijke omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: '16.2'
    text: 'Naast andere taken die de Stichting heeft op grond van deze wet, is zij belast met:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.a
    text: |-
      het bevorderen van samenwerking en coördinatie binnen de landelijke omroep met het oog op de uitvoering van de
      publieke omroeptaak, bedoeld in [artikel 13c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 16.2.b
    text: |-
      de coördinatie, op en tussen de verschillende programmanetten, van de programma’s van de instellingen die zendtijd
      hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.c
    text: het verzorgen van een programma;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.d
    text: |-
      het iedere zes maanden maken van verslagen, waarin de uitgezonden programma-onderdelen van de Stichting,
      de Programmastichting en de omroepverenigingen zowel per afzonderlijke omroepinstelling, per televisie-,
      onderscheidenlijk radioprogrammanet, als voor de genoemde omroepinstellingen gezamenlijk worden opgesomd
      en ingedeeld overeenkomstig de omschrijvingen, bedoeld in de [artikelen 40, tweede en vierde lid][ref1],
      [50, eerste tot en met derde lid][ref2], [51, eerste lid][ref3], [51b, tweede en derde lid][ref4],
      [51d, tweede lid][ref5], [54, eerste tot en met vierde lid][ref6], en [54a, eerste en derde lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel51b
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel51d
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel54
      [ref7]: https://wetten.overheid.nl/BWBR0004149#Artikel54a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '40'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '50'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '51'
        hoofdstuk: III
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 51b
        hoofdstuk: III
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 51d
        hoofdstuk: III
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0004149
        artikel: '54'
        hoofdstuk: III
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0004149
        artikel: 54a
        hoofdstuk: III
        afdeling: '1'
  - number: 16.2.e
    text: |-
      de vertegenwoordiging, na overleg met Onze Minister, van de instellingen die zendtijd voor landelijke omroep
      hebben verkregen en de Wereldomroep als geheel, in internationale organisaties op het gebied van radio- en
      televisieprogramma’s en het uitzenden daarvan, alsmede de medewerking aan de oprichting van zodanige organisaties;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.f
    text: |-
      het, na toestemming van Onze Minister, meewerken aan een Europees televisieprogramma, dat mede op het Nederlandse
      publiek is gericht, in samenwerking met buitenlandse omroepinstellingen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.g
    text: het ter beschikking stellen van programma’s aan het buitenland;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.h
    text: |-
      het behartigen van aangelegenheden die van gemeenschappelijk belang zijn voor de instellingen die zendtijd hebben
      verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.i
    text: het indelen van de zendtijd van de instellingen die zendtijd hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.j
    text: |-
      het opstellen van een begroting als bedoeld in [artikel 99][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 16.2.k
    text: |-
      het in samenwerking met de Wereldomroep binnen de grenzen van de de begroting waarmee Onze Minister heeft ingestemd
      sluiten van collectieve arbeidsovereenkomsten, mede in naam van de instellingen die zendtijd hebben verkregen voor
      landelijke omroep, met uitzondering van politieke partijen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.l
    text: |-
      het in samenwerking met de Wereldomroep vaststellen van normen voor de honorering van losse medewerkers, mede
      in naam van de instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van politieke
      partijen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: 16.2.m
    text: |-
      de bekostiging van de instellingen die zendtijd hebben verkregen voor landelijke omroep, waaronder het
      bevorderen van een doelmatige inzet van de door Onze Minister beschikbaar gestelde bedragen, bedoeld in
      [artikel 101, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '101'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 16.2.n
    text: |-
      het inrichten, instandhouden, beheren en het regelen van het gebruik van organen, diensten en hulpmiddelen, die
      nodig zijn voor een goede uitvoering van de onder a tot en met m genoemde taken, voor zover dit niet behoort tot de
      in [artikel 83][ref1] bedoelde taak van het Bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: '16.3'
    text: De verslagen, bedoeld in het tweede lid, onderdeel d, worden gezonden aan het Commissariaat voor de Media.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: '16.4'
    text: |-
      De Stichting is bevoegd om binnen het kader van haar taak, bedoeld in het tweede lid, onderdeel h, in naam van de
      gezamenlijke instellingen die zendtijd hebben verkregen voor landelijke omroep, overeenkomsten met derden aan te
      gaan, indien dit geschiedt door of met instemming van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel16
  - number: '17'
    text: De Stichting verzorgt het teletekstprogramma voor landelijke omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel17
  - number: '18.1'
    text: 'De Stichting heeft twee organen: een raad van toezicht en een raad van bestuur.'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18
  - number: '18.2'
    text: |-
      Het lidmaatschap van de raad van toezicht is onverenigbaar met het lidmaatschap van de raad van bestuur en het
      netbestuur.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18
  - number: 18a.1
    text: De raad van toezicht bestaat uit een voorzitter en een aantal andere leden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.2
    text: De voorzitter van de raad van toezicht wordt bij koninklijk besluit benoemd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.3
    text: |-
      Onze Minister benoemt een aantal leden gelijk aan het aantal omroepverenigingen die een erkenning hebben verkregen,
      verminderd met drie. Ten aanzien van een van deze leden kunnen de gezamenlijke ondernemingsraden van de Stichting,
      de Programmastichting en de omroepverenigingen A, B en C die zendtijd hebben verkregen, personen voor benoeming tot
      lid van de raad van toezicht aanbevelen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.4
    text: 'De overige leden van de raad van toezicht worden als volgt benoemd:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.4.a
    text: de omroepverenigingen die een erkenning hebben verkregen en de Programmastichting benoemen elk een lid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.4.b
    text: de educatieve omroepinstelling die een erkenning heeft verkregen, benoemt één lid;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.4.c
    text: |-
      de kerkgenootschappen en genootschappen op geestelijke grondslag die zendtijd hebben verkregen, benoemen
      gezamenlijk één lid.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.5
    text: |-
      De leden van de raad van toezicht worden telkens voor een termijn van vijf jaren benoemd. De leden die in de loop
      van de vijfjarige termijn zijn benoemd, treden tegelijk met de andere leden af. Herbenoeming voor een aansluitende
      periode is tweemaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.6
    text: |-
      De omroepverenigingen die een voorlopige erkenning hebben verkregen, kunnen elk één waarnemer in de raad van
      toezicht aanwijzen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18a.7
    text: |-
      De voorzitter kan vertegenwoordigers van het Commissariaat voor de Media uitnodigen de vergaderingen van de raad
      van toezicht bij te wonen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18a
  - number: 18b.1
    text: |-
      De raad van toezicht heeft tot taak toezicht te houden op het beleid van de raad van de bestuur en op de algemene
      gang van zaken in de Stichting. Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar
      het gemeenschappelijk belang van de landelijke publieke omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.2
    text: 'De raad van toezicht is belast met:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.2.a
    text: |-
      het vaststellen van algemene uitgangspunten voor landelijke televisie- en radio-omroep door instellingen die
      zendtijd hebben verkregen, op voorstel van de raad van bestuur;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.2.b
    text: het vaststellen van de jaarrekening van de Stichting;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.2.c
    text: het wijzigen van de statuten van de Stichting, op voorstel van de raad van bestuur;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.2.d
    text: het vaststellen van algemene uitgangspunten voor het programma van de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.3
    text: 'De volgende besluiten en beslissingen van de raad van bestuur behoeven de instemming van de raad van toezicht:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.3.a
    text: |-
      het vaststellen van het concessiebeleidsplan, bedoeld in [artikel 30b, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: 18b.3.b
    text: |-
      het vaststellen van het tussentijds concessiebeleidsplan, bedoeld in [artikel 30b, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: 18b.3.c
    text: |-
      het vaststellen van de netprofielen voor de landelijke televisie-, onderscheidenlijk radioprogrammanetten, bedoeld
      in [artikel 19a, eerste lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 18b.3.d
    text: |-
      het vaststellen van het coördinatiereglement, bedoeld in [artikel 19a, eerste lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 18b.3.e
    text: |-
      het vaststellen van de begroting, bedoeld in [artikel 99][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 18b.3.f
    text: |-
      het vaststellen van het jaarverslag, bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel23a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 23a
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '3'
  - number: 18b.3.g
    text: investeringen die een in de statuten vastgesteld bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.3.h
    text: |-
      het aangaan of verbreken van duurzame samenwerking van de Stichting met een andere rechtspersoon of vennootschap,
      indien deze samenwerking of verbreking van ingrijpende betekenis is voor de Stichting of voor andere instellingen
      die zendtijd hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.3.i
    text: collectief ontslag van een aanmerkelijk aantal werknemers;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: 18b.3.j
    text: ingrijpende wijziging in de arbeidsomstandigheden van een aanmerkelijk aantal werknemers.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel18b
  - number: '19.1'
    text: |-
      De raad van bestuur bestaat uit een voorzitter en twee andere leden. De voorzitter en de andere leden zijn in
      dienst van de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19
  - number: '19.2'
    text: |-
      De leden van de raad van bestuur worden benoemd door de raad van toezicht. Beslissingen van de raad van toezicht
      tot benoeming behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19
  - number: '19.3'
    text: |-
      De leden van de raad van bestuur worden benoemd voor een periode van vijf jaren. Herbenoeming voor een aansluitende
      periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19
  - number: '19.4'
    text: De raad van toezicht stelt de arbeidsvoorwaarden van de leden van de raad van bestuur vast.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19
  - number: '19.5'
    text: |-
      Met het lidmaatschap van de raad van bestuur zijn onverenigbaar het lidmaatschap van een orgaan van, en een
      dienstbetrekking bij, een instelling die zendtijd heeft verkregen, met uitzondering van de Stichting Etherreclame.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19
  - number: '19.6'
    text: De raad van bestuur regelt zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19
  - number: '19.7'
    text: |-
      [Artikel 668a, eerste tot en met vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 668a
  - number: 19a.1
    text: 'Naast de andere taken en bevoegdheden die de raad van bestuur heeft op grond van deze wet, is hij belast met:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
  - number: 19a.1.a
    text: de dagelijkse leiding over de werkzaamheden van de Stichting, waaronder de verzorging van haar programma;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
  - number: 19a.1.b
    text: |-
      het na overleg met de netbesturen doen van voorstellen ten behoeve van de vaststelling van algemene uitgangspunten,
      bedoeld in [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 19a.1.c
    text: |-
      het vaststellen van het concessiebeleidsplan, bedoeld in [artikel 30b, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: 19a.1.d
    text: |-
      het vaststellen van het tussentijds concessiebeleidsplan, bedoeld in [artikel 30b, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30b
        hoofdstuk: III
        paragraaf: '1'
  - number: 19a.1.e
    text: |-
      het vaststellen van de netprofielen van de landelijke televisie-, onderscheidenlijk radioprogrammanetten,
      inhoudende de programmatische uitgangspunten van een herkenbare programmering op de onderscheiden televisie- en
      radioprogrammanetten als bedoeld in [artikel 40, tweede en vierde lid][ref1], rekening houdend met de algemene
      uitgangspunten, bedoeld in [artikel 18b, tweede lid, onderdeel a][ref2], en met inachtneming van het bepaalde
      bij of krachtens [artikel 13c][ref3] en hetgeen overigens bij of krachtens deze wet is bepaald ten aanzien van de
      programma's en de programmering op de televisie- en radioprogrammanetten;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '40'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 18b
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 19a.1.f
    text: |-
      het vaststellen van een reglement voor de coördinatie van de programma-onderdelen voor televisie, onderscheidenlijk
      voor radio, op en tussen de verschillende programmanetten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
  - number: 19a.1.g
    text: |-
      de coördinatie, op en tussen de verschillende programmanetten, van de programma-onderdelen van de instellingen die
      zendtijd hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
  - number: 19a.1.h
    text: |-
      het vaststellen van nadere regelingen ter uitvoering van de wettelijke taken van de Stichting, met uitzondering van
      de taken, bedoeld in [artikel 16, tweede lid, onderdelen c en f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel16
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '3'
  - number: 19a.2
    text: |-
      De raad van bestuur vertegenwoordigt de Stichting in en buiten rechte. De statuten van de Stichting kunnen de
      bevoegdheid tot vertegenwoordiging, bedoeld in de vorige volzin, bovendien toekennen aan een of meer leden van de
      raad van bestuur of aan anderen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
  - number: 19a.3
    text: |-
      De raad van bestuur is voorts belast met alles wat niet uitdrukkelijk tot de taak of bevoegdheid van de raad van
      toezicht behoort.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
  - number: 19a.4
    text: |-
      Ten behoeve van de verzorging van het programma van de Stichting benoemt de raad van bestuur een
      programmadirecteur. De programmadirecteur is in dienst van de Stichting. De functie van programmadirecteur is
      onverenigbaar met het lidmaatschap van de raad van toezicht en van de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel19a
  - number: '20'
    text: |-
      Het coördinatiereglement, bedoeld in [artikel 19a, eerste lid, onderdeel f][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 20.a
    text: een regeling inzake de voorbereiding van de zendtijdindeling door de raad van bestuur;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
  - number: 20.b
    text: |-
      een nadere regeling inzake de coördinatie van programma-onderdelen op en tussen de verschillende programmanetten,
      gericht op een evenwichtig programma-aanbod voor publieksgroepen van verschillende omvang en samenstelling,
      gespreid over de verschillende programmanetten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
  - number: 20.c
    text: |-
      een regeling die beoogt tegen te gaan dat op hetzelfde tijdstip op verschillende programmanetten gelijksoortige
      programma-onderdelen worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
  - number: 20.d
    text: |-
      een regeling die beoogt te bevorderen dat op hetzelfde tijdstip op verschillende programmanetten nieuwe programma-
      onderdelen beginnen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
  - number: 20.e
    text: een regeling inzake het verwijzen naar programma-onderdelen op andere programmanetten;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
  - number: 20.f
    text: |-
      een nadere regeling inzake de uitoefening van de bevoegdheid van de raad van bestuur om in het kader van de
      coördinatie, bedoeld in onderdeel *b*, de beoogde uitzenddag of het beoogde uitzendtijdstip van een programma-
      onderdeel te wijzigen;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
  - number: 20.g
    text: |-
      de vaststelling van het in [artikel 40d, eerste lid, onderdeel b][ref1], bedoelde deel van de zendtijd tussen 16.00
      uur en 24.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40d
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 40d
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
  - number: '21.1'
    text: |-
      Onverminderd [artikel 48][ref1], zijn de volgende besluiten van de raad van bestuur bindend voor de instellingen
      die zendtijd hebben verkregen voor landelijke omroep, voor zover deze besluiten hen aangaan:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel48
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '48'
        hoofdstuk: III
        afdeling: '1'
  - number: 21.1.a
    text: |-
      de besluiten omtrent het indelen van de zendtijd van de instellingen die zendtijd hebben verkregen voor landelijke
      omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
  - number: 21.1.b
    text: de besluiten omtrent de bekostiging van de instellingen die zendtijd hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
  - number: 21.1.c
    text: |-
      de besluiten omtrent vaststelling van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 21.1.d
    text: |-
      de besluiten omtrent de coördinatie, op en tussen de verschillende programmanetten, van de programma-onderdelen van
      de instellingen die zendtijd hebben verkregen voor landelijke omroep;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
  - number: 21.1.e
    text: |-
      de besluiten omtrent vaststelling van een nadere regeling als bedoeld in
      [artikel 19a, eerste lid, onderdeel h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: 21.1.f
    text: |-
      de besluiten omtrent de toepassing van [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel22
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '3'
  - number: 21.1.g
    text: |-
      de besluiten ter uitvoering van de taken, bedoeld in de [artikelen 40, vijfde lid][ref1], [50, negende lid][ref2],
      [51, tweede lid][ref3], [54, zevende lid][ref4], en [54a, vierde lid,][ref5] voor zover niet reeds vallend onder de
      besluiten, bedoeld in de onderdelen a tot en met e.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel54
