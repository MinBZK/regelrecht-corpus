  - number: '146'
    text: |-
      Het Commissariaat voor de Media, de Stichting en het Bedrijf staan als hoofdelijke schuldenaar over en weer garant
      voor de nakoming van de financiële verplichtingen die voor 1 januari 1988 door de Nederlandse Omroep Stichting
      zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel146
  - number: '147.1'
    text: |-
      In afwijking van [artikel 111, derde lid][ref1], bedraagt de vermindering van de rijksomroepbijdrage voor het jaar
      2004 € 40,861 miljoen, voor het jaar 2005 € 60,861 miljoen en voor het jaar 2006 € 71,148 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel111
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '111'
        hoofdstuk: VIII
        paragraaf: '4'
  - number: '147.2'
    text: Dit artikel vervalt met ingang van 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel147
  - number: '153'
    text: |-
      Indien het Rijk met toepassing van de Omroepwet aan een instelling die zendtijd heeft verkregen, een bijdrage in
      investeringen heeft verleend, betaalt de instelling bij vervreemding van het desbetreffende onroerend goed of bij
      beëindiging van de haar toegewezen zendtijd de vergoeding terug aan het Commissariaat voor de Media. De terug te
      betalen bijdrage wordt evenwel verminderd met de door het Commissariaat vast te stellen afschrijvingspercentages
      voor elk vol jaar dat is verstreken sedert de vergoeding is gegeven. Terugbetaalde vergoedingen worden aangewend
      ter bestrijding van de kosten, bedoeld in [artikel 28][ref1], met uitzondering van de kosten, bedoeld in
      [artikel 28, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel28
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
  - number: '161.1'
    text: |-
      Het is de Kerkeraad van de Gereformeerde Kerk van Bloemendaal toegestaan een radioprogramma voor algemene omroep
      te verzorgen dat bestaat uit de weergave van kerkdiensten van de Gereformeerde Kerk te Bloemendaal. De uitzendingen
      zijn bestemd voor inwoners van de gemeente Bloemendaal.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel161
  - number: '161.2'
    text: |-
      Het is de Generale Synode der Gereformeerde Kerken toegestaan een radioprogramma voor algemene omroep te verzorgen
      dat bestaat uit de weergave van kerkdiensten van de Gereformeerde Kerk te Apeldoorn. De uitzendingen zijn bestemd
      voor inwoners van de gemeente Apeldoorn.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel161
  - number: '161.3'
    text: |-
      Met betrekking tot het in dit artikel bepaalde kunnen bij of krachtens algemene maatregel van bestuur regels worden
      gesteld, daaronder begrepen de mogelijkheid tot intrekking van de in dit artikel gegeven toestemmingen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel161
  - number: '166.1'
    text: |-
      Het Commissariaat voor de Media kan eenmaal voor een periode van drie jaren zendtijd voor televisie
      toewijzen aan de Stichting ten behoeve van een programma dat bestaat uit een samenstel van ten minste zeven
      verschillende regionale programma-edities die tegelijkertijd op een van de televisieprogrammanetten, genoemd in
      [artikel 40][ref1], worden uitgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '40'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '1'
  - number: '166.2'
    text: 'De zendtijd, bedoeld in het eerste lid, wordt slechts verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel166
  - number: 166.2.a
    text: |-
      de Stichting en de gezamenlijke regionale omroepinstellingen die zendtijd hebben verkregen, overeenstemming
      hebben bereikt zowel over de dagen en uren waarop het programma zal worden uitgezonden, als over de inhoud van de
      verschillende regionale programma-edities;
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel166
  - number: 166.2.b
    text: |-
      de Stichting en de gezamenlijke regionale omroepinstellingen die zendtijd hebben verkregen, overeenstemming hebben
      bereikt over de verdeling van de inkomsten uit de reclameboodschappen en telewinkelboodschappen in en aansluitend
      op de verschillende regionale programma-edities; en
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel166
  - number: 166.2.c
    text: de verschillende regionale programma-edities worden geproduceerd door de regionale omroepinstellingen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel166
  - number: '166.3'
    text: |-
      Voor de toepassing van deze wet wordt het programma, bedoeld in het eerste lid, aangemerkt als een programma
      voor landelijke omroep, onderscheidenlijk een programma van een instelling die zendtijd heeft verkregen voor
      landelijke omroep, met dien verstande dat op de verschillende programma-edities niet [artikel 51d][ref1], maar
      [artikel 51e][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51d
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51e
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 51d
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 51e
        hoofdstuk: III
        afdeling: '1'
  - number: 167c.1
    text: Het Commissariaat voor de Media kan regels stellen met betrekking tot het uitzenden van toetsbeelden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel167c
  - number: 167c.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen of op welke tijden geen toetsbeelden
      worden uitgezonden door middel van de omroepzenders door middel waarvan ook de programma’s van de instellingen die
      zendtijd voor landelijke omroep hebben verkregen, worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel167c
  - number: '168'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het uitzenden van programma’s uitsluitend bestemd
      voor de in Nederland gelegerde militairen van buitenlandse strijdkrachten en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel168
  - number: '169'
    text: |-
      Onze Minister stelt regels ter uitvoering van de artikelen 12, 15 en 16 van de Europese richtlijn, voor zover
      naar het oordeel van Onze Minister een of meer van deze artikelen niet, niet voldoende, niet juist of niet tijdig
      zijn uitgewerkt in de Nederlandse Reclame Code of in een vergelijkbare door de Stichting Reclame Code tot stand
      gebrachte regeling, dan wel de Stichting Reclame Code in gebreke blijft met het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel169
  - number: '170.1'
    text: Onze Minister richt de Stichting stimuleringsfonds Nederlandse culturele omroepprodukties op.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170
  - number: '170.2'
    text: |-
      De stichting heeft tot taak het verstrekken van financiële bijdragen aan omroepverenigingen, de Stichting, de
      Programmastichting, de educatieve omroepinstelling, dan wel kerkgenootschappen of genootschappen op geestelijke
      grondslag die zendtijd hebben verkregen voor landelijke omroep, de instellingen die zendtijd hebben verkregen
      voor regionale omroep, alsmede de Wereldomroep, voor de ontwikkeling envervaardiging van programmaonderdelen en
      programmamateriaal ten behoeve van activiteiten als bedoeld in [artikel 13c, derde lid][ref1], van bijzondere
      Nederlandse culturele aard.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: '170.3'
    text: |-
      De stichting heeft een bestuur dat bestaat uit een voorzitter en zes andere leden. De leden van het bestuur worden
      benoemd en ontslagen door Onze Minister. Twee leden worden benoemd uit de kring van de omroep en twee leden uit de
      kring van de film- en podiumkunsten. Van de andere leden wordt één tot voorzitter benoemd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170
  - number: '170.4'
    text: |-
      Wijzigingen in de statuten van de stichting behoeven de instemming van Onze Minister. Het bestuur van de stichting
      kan niet besluiten tot ontbinding van de stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170
  - number: '170.5'
    text: |-
      Onze Minister verstrekt jaarlijks aan de stichting uit de middelen bedoeld in [artikel 28][ref1] en
      [artikel 110][ref2] een uitkering. De hoogte van de uitkering is tenminste gelijk aan eenzestiende deel van
      de afgedragen inkomsten van de Stichting Etherreclame van dat jaar. De begroting en jaarrekening behoeven zijn
      instemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel110
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '4'
  - number: '170.6'
    text: |-
      De stichting verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak nodig is.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170
  - number: '170.7'
    text: |-
      Onze Minister zendt telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van het functioneren van de stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170
  - number: 170a.1
    text: |-
      De instellingen die zijn aangewezen op grond van [artikel 28, onderdelen k en l][ref1], dienen eenmaal
      per vier jaren bij Onze Minister een meerjarenplan voor de volgende periode van vier jaren in. Deze
      meerjarenplannen zijn afgestemd op de voor de desbetreffende periode geldende cultuurnota, bedoeld in
      [artikel 3 van de Wet op het specifiek cultuurbeleid][ref2], en op de voor de desbetreffende periode geldende
      begroting voor de instellingen die zendtijd hebben verkregen voor landelijke omroep, bedoeld in [artikel 99][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005904
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '99'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 170a.2
    text: |-
      De instellingen, bedoeld in het eerste lid, dienen jaarlijks voor 1 juni bij Onze Minister een jaarrekening over
      het voorafgaande kalenderjaar in.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170a
  - number: 170a.3
    text: |-
      Het meerjarenplan en de jaarrekening behoeven de instemming van Onze Minister. Met betrekking tot het meerjarenplan
      hoort Onze Minister daaromtrent de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170a
  - number: 170a.4
    text: |-
      Aan het ter beschikking stellen van een vergoeding als bedoeld in [artikel 28, onderdelen k en l][ref1], kunnen
      voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel28
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
  - number: 170a.5
    text: |-
      Indien niet wordt voldaan aan de eisen, bedoeld in het eerste en tweede lid, of de aan de beschikking verbonden
      voorschriften niet worden nageleefd, kan Onze Minister de beschikking waarbij de desbetreffende instelling is
      aangewezen, intrekken, dan wel de beschikking tot het ter beschikking stellen van een vergoeding wijzigen.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170a
  - number: 170c.1
    text: |-
      Onze Minister kan een deel van de inkomsten van de Stichting Etherreclame, bedoeld in [artikel 28][ref1], en
      de rijksomroepbijdrage, bedoeld in [artikel 111][ref2], reserveren ten behoeve van de instellingen die zendtijd
      hebben verkregen voor landelijke omroep, met uitzondering van politieke partijen, en de Wereldomroep (de algemene
      omroepreserve).


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel111
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '28'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '111'
        hoofdstuk: VIII
        paragraaf: '4'
  - number: 170c.2
    text: |-
      Onze Minister kan uit de algemene omroepreserve uitkeringen doen aan de raad van bestuur en, ten behoeve van de
      Wereldomroep, aan het Commissariaat voor de Media. Het doen van uitkeringen aan de raad van bestuur geschiedt met
      toepassing van [artikel 106a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel106a
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 106a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 170c.3
    text: |-
      Aan het doen van uitkeringen kunnen voorschriften worden verbonden. Onze Minister kan de beschikking tot het doen
      van uitkeringen intrekken of wijzigen, indien de aan de beschikking verbonden voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170c
  - number: 170c.4
    text: |-
      Het beheer van de algemene omroepreserve berust bij het Commissariaat voor de Media. Het Commissariaat legt over
      het beheer jaarlijks verantwoording af aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel170c
  - number: '171'
    text: |-
      Een wijziging van de Europese richtlijn gaat voor de toepassing van de [artikelen 4][ref1], [54][ref2],
      [71n][ref3], [72][ref4], [73][ref5], en [76][ref6] en de daarop berustende bepalingen gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel71n
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel73
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel76
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '54'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 71n
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: '72'
        hoofdstuk: IVA
      - id: ref5
        bwb_id: BWBR0004149
        artikel: '73'
        hoofdstuk: IVA
      - id: ref6
        bwb_id: BWBR0004149
        artikel: '76'
        hoofdstuk: V
  - number: '172'
    text: |-
      Besluiten van het Commissariaat voor de Media houdende nadere regels die op grond van deze wet worden vastgesteld
      worden gepubliceerd in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel172
  - number: '173'
    text: |-
      Bij algemene maatregel van bestuur worden, op voordracht van Onze Minister-President na overleg met Onze Minister,
      regels gesteld op grond waarvan in geval van buitengewone omstandigheden zendtijd en het gebruik van studio's,
      omroepnetwerken en andere hulpmiddelen ter beschikking worden gesteld aan de bij of krachtens die algemene
      maatregel van bestuur aangewezen autoriteiten.
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel173
  - number: '174.1'
    text: |-
      Onze Minister-President is bevoegd in de algemene noodtoestand, na overleg met Onze Minister, regels te stellen ten
      aanzien van de inhoud van radio- en televisieprogramma’s en het toezicht daarop. In die regels kan worden afgeweken
      van het bepaalde in [artikel 134][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel134
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '134'
        hoofdstuk: X
  - number: '174.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid wordt onverwijld beëindigd zodra
      [artikel 31, eerste lid, van de Oorlogswet voor Nederland][ref1] in werking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '175'
    text: |-
      Een krachtens de [artikelen 30a, vijfde lid][ref1], [39, vijfde lid][ref2], [39b][ref3],
      [41c, eerste lid, onderdeel a, en tweede lid][ref4], [43c, derde lid][ref5], [52, tweede lid][ref6],
      [57a, tweede lid][ref7], [64, tweede lid][ref8], [71o, tweede lid][ref9], [130, vijfde lid][ref10], [131][ref11] en
      [132, tweede en derde lid][ref12], vastgestelde algemene maatregel van bestuur wordt aan beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door tenminste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
      Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel39b
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel41c
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel43c
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref7]: https://wetten.overheid.nl/BWBR0004149#Artikel57a
      [ref8]: https://wetten.overheid.nl/BWBR0004149#Artikel64
      [ref9]: https://wetten.overheid.nl/BWBR0004149#Artikel71o
      [ref10]: https://wetten.overheid.nl/BWBR0004149#Artikel130
      [ref11]: https://wetten.overheid.nl/BWBR0004149#Artikel131
      [ref12]: https://wetten.overheid.nl/BWBR0004149#Artikel132
    url: https://wetten.overheid.nl/BWBR0004149/2004-03-17#Artikel175
