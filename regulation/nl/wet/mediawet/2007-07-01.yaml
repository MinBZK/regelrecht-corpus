  - number: 108b
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 december vast welke bedragen voor het volgende kalenderjaar beschikbaar zijn
      voor de kosten van:

      a. de verzorging van de programma’s van de Wereldomroep;

      b. de Wereldomroep, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma's; en

      c. het uitzenden van de programma’s van de Wereldomroep.

      2 Onze Minister stelt de bedragen voor het volgende kalenderjaar, bedoeld in het eerste lid, vast op tachtig
      procent van de overeenkomstige bedragen die zijn vastgesteld voor het lopende kalenderjaar, indien de Wereldomroep
      de begroting, bedoeld in [artikel 108][ref1], niet tijdig en met inachtneming van de regels, gesteld krachtens
      [artikel 108, zesde lid][ref2], aan Onze Minister heeft doen toekomen.


