  - number: 39f
    text: |-
      1 Het Commissariaat voor de Media kan eenmaal in de vijf jaren voor een periode van vijf jaren zendtijd voor
      landelijke omroep toewijzen aan kerkgenootschappen en genootschappen op geestelijke grondslag, dan wel aan
      rechtspersonen waarin twee of meer van deze genootschappen samenwerken. De zendtijd vervalt na afloop van deze
      periode.

      2 De kerkgenootschappen en genootschappen op geestelijke grondslag die zendtijd hebben verkregen, zijn gerechtigd
      de verzorging van hun programma’s op te dragen aan hetzij de Stichting, hetzij een omroepvereniging die zendtijd
      heeft verkregen, hetzij een door hen in het leven geroepen orgaan.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel39f
  - number: 39g
    text: |-
      1 Het Commissariaat voor de Media wijst zendtijd voor landelijke omroep toe aan politieke partijen die bij de
      laatstgehouden verkiezing van de Tweede of Eerste Kamer der Staten-Generaal een of meer zetels hebben verworven.

      2 Het Commissariaat voor de Media wijst zendtijd voor landelijke omroep toe aan politieke partijen die in alle
      kieskringen aan de verkiezing van de leden van de Tweede Kamer der Staten-Generaal deelnemen, alsmede aan politieke
      partijen die in Nederland aan de verkiezing van leden van het Europees Parlement deelnemen. In afwijking van
      [artikel 39c, tweede lid][ref1], wordt deze zendtijd niet jaarlijks toegewezen, doch uitsluitend in een door het
      Commissariaat te bepalen periode, onmiddellijk voorafgaande aan de dag die in Nederland voor de desbetreffende
      verkiezing is vastgesteld.

      3 Indien een politieke partij op grond van de [artikelen 137c, d, e, f, of g][ref2], of[ artikel 429 quater van
      het Wetboek van Strafrecht](onbekend), is veroordeeld tot een onvoorwaardelijke geldboete, wijst het Commissariaat
      voor de Media, in afwijking van het eerste en tweede lid, aan deze politieke partij geen zendtijd toe gedurende een
      periode die ingaat op de dag waarop de veroordeling onherroepelijk is geworden. Deze periode is:

      a. één jaar, bij een geldboete van minder dan € 1 125;

      b. twee jaar, bij een geldboete van € 1 125 of meer, maar minder dan € 2 250;

      c. drie jaar, bij een geldboete van € 2 250 of meer, maar minder dan € 3 375; en

      d. vier jaar, bij een geldboete van € 3 375 of meer.

      4 Indien aan de lijst van een politieke partij aan de lijst waarvan op de dag waarop de veroordeling, bedoeld in
      het derde lid, onherroepelijk wordt, op grond van de [Kieswet][ref3] geen zetels zijn toegewezen, op grond van een
      verkiezing die plaatsvindt binnen een periode van twee jaar na die dag één of meer zetels worden toegewezen, gaat
      de periode gedurende welke aan deze politieke partij geen zendtijd als bedoeld in het eerste lid wordt toegewezen,
      in op de dag waarop de verkiezing heeft plaatsgevonden.

      5 Na een veroordeling als bedoeld in het derde lid, wordt aan de politieke partij, zo nodig in afwijking van het
      derde lid, onder a, in ieder geval geen zendtijd als bedoeld in het tweede lid toegewezen binnen twee jaar na de
      dag waarop de veroordeling onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel137c
      [ref3]: https://wetten.overheid.nl/BWBR0004627
