        paragraaf: '2'
  - number: '34'
    text: |-
      Alvorens op de ingediende aanvragen voor een erkenning of voorlopige erkenning te beslissen vraagt Onze Minister
      advies aan de Raad voor cultuur.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel34
  - number: '36'
    text: |-
      1 Een aanvraag voor een erkenning wordt afgewezen, indien niet wordt voldaan aan de
      [artikelen 14, eerste lid][ref1], [25][ref2] of [31, derde lid][ref3].

      2 Een aanvraag voor een erkenning kan daarnaast slechts worden afgewezen, indien:

      a. niet wordt voldaan aan een bij of krachtens de [artikelen 32, tweede tot en met vijfde lid][ref4], en [33][ref5]
      gesteld vereiste;

      b. aannemelijk is dat de aanvrager zich, mede gelet op zijn handelwijze in een voorafgaande periode waarin hij
      zendtijd heeft gehad, niet aan de bij of krachtens de wet gestelde voorschriften zal houden; of

      c. uit het beleidsplan naar het oordeel van Onze Minister onvoldoende blijkt dat:

      1°. indien het een omroepvereniging betreft in het programmabeleid de identiteit van de aanvrager tot uitdrukking
      komt;

      2°. het programma voldoet aan de daaraan bij of krachtens deze wet gestelde eisen;

      3°. de bereidheid tot samenwerking, bedoeld in [artikel 32, derde lid][ref6], bestaat.

      3 Een aanvraag voor een erkenning van een omroepvereniging die een voorlopige erkenning heeft verkregen en
      aansluitend voor een erkenning in aanmerking wenst te komen, kan tevens worden afgewezen, indien gedurende de
      periode waarvoor een voorlopig erkenning is verkregen, onvoldoende is gebleken dat het programma voldoet aan de
      vereisten, bedoeld in [artikel 37a, eerste lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel25
