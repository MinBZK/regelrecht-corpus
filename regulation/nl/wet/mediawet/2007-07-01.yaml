  - number: 109d
    text: |-
      1 Deze paragraaf is op kerkgenootschappen en genootschappen op geestelijke grondslag slechts van toepassing, voor
      zover het betreft de activiteiten en financiën die betrekking hebben op de omroepactiviteiten.

      2 Deze paragraaf is niet van toepassing op politieke partijen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel109d
  - number: '110'
    text: |-
      De instellingen die zendtijd hebben verkregen voorzien op onafhankelijke wijze in publieke omroep door verzorging
      van publieke omroepprogramma's. Daartoe hebben de instellingen die zendtijd hebben verkregen op de wijze zoals
      geregeld in deze wet aanspraak op bekostiging uit 's Rijks kas die een kwalitatief hoogwaardige programmering
      mogelijk maakt en waardoor continuïteit van financiering gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel110
  - number: '111'
    text: |-
      1 Ter uitvoering van [artikel 110][ref1] en ter bestrijding van de overige kosten genoemd in [artikel 28][ref2],
      met uitzondering van de onder d bedoelde, wordt onder de naam rijksomroepbijdrage jaarlijks door Onze Minister een
      bedrag beschikbaar gesteld.

      2 De in het eerste lid bedoelde rijksomroepbijdrage bestaat ten minste uit het bedrag van de in het jaar 1998
      door de Dienst omroepbijdragen op grond van de toen geldende bepalingen van deze wet aan Onze Minister afgedragen
      inkomsten. Onze Minister stelt het in de vorige volzin bedoelde bedrag jaarlijks bij met de door het Centraal
      Bureau voor de Statistiek voor het desbetreffende jaar geraamde index voor de groei van het aantal huishoudens in
      Nederland en met de door het Centraal Planbureau voor het desbetreffende jaar geraamde consumentenprijsindex.

      3 Het op grond van het tweede lid vastgestelde bedrag van de rijksomroepbijdrage wordt verminderd met € 92,448
      miljoen.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het
      eerste tot en met derde lid.

      5 Aan de beschikbaarheid van de rijksomroepbijdrage worden geen andere voorwaarden gesteld dan de voorwaarden die
      bij of krachtens deze wet zijn of kunnen worden gesteld.

      6 Het in het tweede lid bedoelde bedrag wordt verlaagd met het bedrag dat over het kalenderjaar voorafgaande aan
      de inwerkingtreding van dit artikellid ten laste van de begroting van het Ministerie van Onderwijs, Cultuur en
      Wetenschap (VIII), onderdeel Media, beschikbaar wordt gesteld ten behoeve van regionale omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel28
