  - number: '43'
    text: |-
      1 De toewijzing van zendtijd aan lokale en regionale omroepinstellingen geschiedt eerst nadat de gemeenteraad dan
      wel Provinciale Staten heeft respectievelijk hebben geadviseerd over de vraag of de instelling aan de eisen voldoet
      die deze wet stelt.

      2 De gemeenteraad dan wel Provinciale Staten brengt respectievelijk brengen éénmaal in de vijf jaren aan het
      Commissariaat voor de Media advies uit over de vraag of de lokale of regionale omroepinstelling naar zijn of
      hun oordeel nog voldoet aan de in [artikel 30][ref1] gestelde eisen. Indien binnen deze termijn ernstige twijfel
      bestaat of de lokale of regionale omroepinstelling nog aan de in [artikel 30][ref2] gestelde eisen voldoet, kan het
      Commissariaat een tussentijds advies vragen.

      3 Er wordt slechts zendtijd toegewezen aan regionale omroepinstellingen voor welke het provinciebestuur heeft
      verklaard zorg te dragen voor de bekostiging van het functioneren van die instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel43
