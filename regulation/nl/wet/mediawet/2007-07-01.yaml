  - number: 109b
    text: |-
      1 Indien met toepassing van deze wet een bijdrage in investeringen is verleend aan een instelling die zendtijd
      voor landelijke omroep heeft verkregen, betaalt de instelling bij vervreemding van het desbetreffende onroerend
      goed of bij beëindiging van de haar toegewezen zendtijd de vergoeding terug aan de raad van bestuur. De terug te
      betalen bijdrage wordt evenwel verminderd met de door de raad van bestuur vast te stellen afschrijvingspercentages
      voor elk vol jaar dat is verstreken sedert de vergoeding is gegeven. Terugbetaalde vergoedingen worden aangewend
      ter versterking van de programmering en de coördinatie; [artikel 101, vierde lid][ref1], is van overeenkomstige
      toepassing.

      2 Indien met toepassing van deze wet een bijdrage in investeringen is verleend aan een instelling die zendtijd voor
      regionale omroep heeft verkregen, betaalt de instelling bij vervreemding van het desbetreffende onroerend goed of
      bij beëindiging van de haar toegewezen zendtijd de vergoeding terug aan het Commissariaat voor de Media. De terug
      te betalen bijdrage wordt evenwel verminderd met de door het Commissariaat vast te stellen afschrijvingspercentages
      voor elk vol jaar dat is verstreken sedert de vergoeding is gegeven. Terugbetaalde vergoedingen worden aangewend
      ter bestrijding van de kosten, bedoeld in [artikel 28][ref2], met uitzondering van de kosten, bedoeld in
      [artikel 28, onderdeel d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel28
