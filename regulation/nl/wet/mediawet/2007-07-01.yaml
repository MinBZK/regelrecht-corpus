  - number: 76a
    text: |-
      1 In de programma’s van de Wereldomroep mogen programma-onderdelen van de Stichting Etherreclame worden opgenomen
      die bestaan uit reclameboodschappen en telewinkelboodschappen die zijn aangeboden door derden, alsmede een
      omlijsting daarvan.

      2 Het bepaalde bij of krachtens de [artikelen 39b][ref1], [41a][ref2] en [50, achtste lid][ref3], met betrekking
      tot de zendtijd van de Stichting Etherreclame, is van overeenkomstige toepassing op het opnemen van programma-
      onderdelen als bedoeld in het eerste lid in de programma’s van de Wereldomroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
