  - number: '146'
    text: |-
      Het Commissariaat voor de Media, de Stichting en het Bedrijf staan als hoofdelijke schuldenaar over en weer garant
      voor de nakoming van de financiële verplichtingen die voor 1 januari 1988 door de Nederlandse Omroep Stichting
      zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel146
  - number: '153'
    text: |-
      Indien het Rijk met toepassing van de Omroepwet aan een instelling die zendtijd heeft verkregen, een bijdrage in
      investeringen heeft verleend, betaalt de instelling bij vervreemding van het desbetreffende onroerend goed of bij
      beëindiging van de haar toegewezen zendtijd de vergoeding terug aan het Commissariaat voor de Media. De terug te
      betalen bijdrage wordt evenwel verminderd met de door het Commissariaat vast te stellen afschrijvingspercentages
      voor elk vol jaar dat is verstreken sedert de vergoeding is gegeven. Terugbetaalde vergoedingen worden aangewend
      ter bestrijding van de kosten, bedoeld in [artikel 28][ref1], met uitzondering van de kosten, bedoeld in
      [artikel 28, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel28
