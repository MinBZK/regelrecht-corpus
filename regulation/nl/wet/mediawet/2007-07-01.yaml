  - number: '172'
    text: |-
      Besluiten van het Commissariaat voor de Media houdende nadere regels die op grond van deze wet worden vastgesteld
      worden gepubliceerd in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel172
  - number: '173'
    text: |-
      Bij algemene maatregel van bestuur worden, op voordracht van Onze Minister-President na overleg met Onze Minister,
      regels gesteld op grond waarvan in geval van buitengewone omstandigheden zendtijd en het gebruik van studio's,
      omroepnetwerken en andere hulpmiddelen ter beschikking worden gesteld aan de bij of krachtens die algemene
      maatregel van bestuur aangewezen autoriteiten.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel173
  - number: '174'
    text: |-
      1 Onze Minister-President is bevoegd in de algemene noodtoestand, na overleg met Onze Minister, regels te stellen
      ten aanzien van de inhoud van radio- en televisieprogramma’s en het toezicht daarop. In die regels kan worden
      afgeweken van het bepaalde in [artikel 134][ref1].

      2 De in het eerste lid bedoelde bevoegdheid wordt onverwijld beëindigd zodra
      [artikel 31, eerste lid, van de Oorlogswet voor Nederland][ref2] in werking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '134'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '175'
    text: |-
      Een krachtens de [artikelen 30a, vijfde lid][ref1], [39, vijfde lid][ref2], [39b][ref3],
      [41c, eerste lid, onderdeel a, en tweede lid][ref4], [43c, derde lid][ref5], [52, tweede lid][ref6],
      [57a, tweede lid][ref7], [64, tweede lid][ref8], [71o, tweede lid][ref9], [130, vijfde lid][ref10], [131][ref11] en
      [132, tweede en derde lid][ref12], vastgestelde algemene maatregel van bestuur wordt aan beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door tenminste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
      Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


