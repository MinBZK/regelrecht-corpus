  - number: 19b
    text: |-
      1 De raad van bestuur gaat geen overeenkomsten als bedoeld in [artikel 16, vierde lid][ref1], aan en neemt de
      besluiten, bedoeld in [artikel 19a, eerste lid, onderdelen b tot en met e][ref2], niet dan nadat het college van
      omroepen in de gelegenheid is gesteld daarover binnen een daartoe door de raad van bestuur te stellen redelijke
      termijn zijn zienswijze te geven.

      2 Het uitblijven van een zienswijze na het verstrijken van de termijn staat aan het aangaan van de desbetreffende
      overeenkomst of het nemen van het desbetreffende besluit door de raad van bestuur niet in de weg.

      3 Indien uit de zienswijze van het college van omroepen blijkt dat hij niet instemt met (belangrijke onderdelen
      van) een voorgenomen overeenkomst of een voorgenomen besluit en de raad van bestuur zijn voornemen ongewijzigd
      wenst te handhaven, legt de raad van bestuur de voorgenomen overeenkomst dan wel het door de raad van bestuur
      vastgestelde besluit tezamen met de zienswijze van het college van omroepen ter instemming voor aan de raad van
      toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
