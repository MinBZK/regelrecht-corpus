        artikel: 668a
  - number: 19a
    text: |-
      1 Naast de andere taken en bevoegdheden die de raad van bestuur heeft op grond van deze wet, is hij belast met:

      a. de dagelijkse leiding over de werkzaamheden van de Stichting, waaronder de verzorging van haar programma;

      b. het sluiten van de prestatieovereenkomst, bedoeld in [artikel 30b, zevende lid][ref1];

      c. het vaststellen van het concessiebeleidsplan, bedoeld in [artikel 30b, eerste lid][ref2];

      d. het vaststellen van het tussentijds concessiebeleidsplan, bedoeld in [artikel 30b, derde lid][ref3];

      e. het vaststellen van de netprofielen van de landelijke televisie-, onderscheidenlijk radioprogrammanetten,
      inhoudende de programmatische uitgangspunten van een herkenbare programmering op de onderscheiden televisie- en
      radioprogrammanetten als bedoeld in [artikel 40, tweede en vierde lid][ref4], met inachtneming van het bepaalde
      bij of krachtens [artikel 13c][ref5] en hetgeen overigens bij of krachtens deze wet is bepaald ten aanzien van de
      programma's en de programmering op de televisie- en radioprogrammanetten;

      f. het vaststellen van een reglement voor de coördinatie van de programma-onderdelen voor televisie,
      onderscheidenlijk voor radio, op en tussen de verschillende programmanetten;

      g. de coördinatie, op en tussen de verschillende programmanetten, van de programma-onderdelen van de instellingen
      die zendtijd hebben verkregen voor landelijke omroep;

      h. het vaststellen van nadere regelingen ter uitvoering van de wettelijke taken van de Stichting, met uitzondering
      van de taken, bedoeld in [artikel 16, tweede lid, onderdelen c en f][ref6].

      2 De raad van bestuur vertegenwoordigt de Stichting in en buiten rechte. De statuten van de Stichting kunnen de
      bevoegdheid tot vertegenwoordiging, bedoeld in de vorige volzin, bovendien toekennen aan een of meer leden van de
      raad van bestuur of aan anderen.

      3 De raad van bestuur is voorts belast met alles wat niet uitdrukkelijk tot de taak of bevoegdheid van de raad van
      toezicht behoort.

      4 Ten behoeve van de verzorging van het programma van de Stichting benoemt de raad van bestuur een
      programmadirecteur. De programmadirecteur is in dienst van de Stichting. De functie van programmadirecteur is
      onverenigbaar met het lidmaatschap van de raad van toezicht en van de raad van bestuur.


