  - number: '17'
    text: De Stichting verzorgt het teletekstprogramma voor landelijke omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel17
  - number: '18'
    text: 'De Stichting heeft drie organen: een raad van toezicht, een raad van bestuur en een college van omroepen.'
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel18
  - number: 18a
    text: |-
      1 De raad van toezicht bestaat uit een voorzitter en zes andere leden.

      2 De voorzitter en de andere leden worden benoemd bij koninklijk besluit.

      Ten aanzien van één van de andere leden kunnen de ondernemingsraden van de Stichting, de Programmastichting en de
      omroepverenigingen die een erkenning hebben verkregen gezamenlijk personen voor benoeming aanbevelen.

      3 De voorzitter en de andere leden worden benoemd voor een termijn van 5 jaar. Herbenoeming voor een aansluitende
      periode is éénmaal mogelijk.

      4 Het lidmaatschap van de raad van toezicht is onverenigbaar met:

      a. het lidmaatschap van het college van omroepen;

      b. het lidmaatschap van de raad van bestuur;

      c. het lidmaatschap van een netredactie;

      d. het lidmaatschap van een orgaan van of een dienstbetrekking bij een instelling die zendtijd heeft verkregen;

      e. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële omroepinstelling;

      f. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      g. het werkzaam zijn bij een ministerie of bij een instelling, een dienst of een bedrijf, ressorterende onder de
      verantwoordelijkheid van een minister;

      h. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      5 De raad van toezicht kan leden van het Commissariaat voor de Media uitnodigen vergaderingen van de raad van
      toezicht bij te wonen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel18a
  - number: 18b
    text: |-
      1 De raad van toezicht heeft tot taak toezicht te houden op het beleid van de raad van bestuur en op de algemene
      gang van zaken in de Stichting.

      De raad van toezicht staat de raad van bestuur met advies terzijde. Bij de vervulling van hun taak richten de leden
      van de raad van toezicht zich naar het gemeenschappelijke belang van de landelijke publieke omroep.

      2 De raad van toezicht is voorts belast met:

      a. het vaststellen van de jaarrekening;

      b. het wijzigen van de statuten van de Stichting, op voorstel van de raad van bestuur.

      3 De volgende besluiten van de raad van bestuur behoeven de goedkeuring van de raad van toezicht:

      a. het vaststellen van het concessiebeleidsplan en het tussentijds concessiebeleidsplan, bedoeld in
      [artikel 30b, eerste en derde lid][ref1];

      b. het aangaan van de prestatieovereenkomst, bedoeld in [artikel 30b, zevende lid][ref2];

      c. het vaststellen van de begroting, bedoeld in [artikel 99][ref3];

      d. het vaststellen van het jaarverslag, bedoeld in [artikel 23a][ref4];

      e. investeringen die een in de statuten vastgesteld bedrag te boven gaan;

      f. het aangaan of verbreken van duurzame samenwerking van de Stichting met een andere rechtspersoon of
      vennootschap, indien deze samenwerking of verbreking van ingrijpende betekenis is voor de Stichting of voor andere
      instellingen die zendtijd hebben verkregen voor landelijke omroep;

      g. collectief ontslag van een aanmerkelijk aantal werknemers;

      h. ingrijpende wijziging in de arbeidsomstandigheden van een aanmerkelijk aantal werknemers.

      4 De raad van bestuur en de instellingen die zendtijd hebben verkregen voor landelijke omroep verstrekken aan de
      raad van toezicht desgevraagd en tijdig alle voor de uitvoering van diens taak benodigde inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
