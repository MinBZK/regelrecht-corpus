  - number: '137'
    text: |-
      Een boete opgelegd krachtens [artikel 135][ref1] kan bij dwangbevel door het Commissariaat voor de Media worden
      ingevorderd. Het dwangbevel wordt op kosten van degene tot wie het gericht is bij deurwaardersexploit betekend en
      ten uitvoer gelegd op de wijze bij het [Wetboek van Burgerlijke Rechtsvordering][ref2] ten aanzien van vonnissen
      en authentieke akten voorgeschreven. Binnen 30 dagen na de betekening staat verzet tegen het dwangbevel open door
      dagvaarding van het Commissariaat. Het verzet schorst de tenuitvoerlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel137
