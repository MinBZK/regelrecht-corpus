  - number: '123'
    text: |-
      1 Er is een Stimuleringsfonds voor de pers dat ten doel heeft het handhaven en bevorderen van de pluriformiteit
      van de pers, voor zover die van belang is voor de informatie en opinievorming. Het Stimuleringsfonds heeft
      rechtspersoonlijkheid en is gevestigd in de gemeente 's-Gravenhage.

      2 Naast de taken die het Stimuleringsfonds heeft op grond van andere wettelijke bepalingen, heeft het
      Stimuleringsfonds tot taak:

      a. het uitoefenen van toezicht op de naleving van het bij of krachtens dit hoofdstuk bepaalde met betrekking tot
      de pers

      b. het verrichten dan wel doen verrichten van onderzoek met betrekking tot het functioneren van de pers.

      3 Met het in het tweede lid, onderdeel a, bedoelde toezicht op de naleving zijn belast de leden van het bestuur van
      het Stimuleringsfonds en de bij besluit van het bestuur daartoe aangewezen medewerkers van het Stimuleringsfonds.

      4 Van een besluit als bedoeld in het derde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel123
  - number: '124'
    text: |-
      1 Het Stimuleringsfonds voor de pers heeft een bestuur dat bestaat uit een voorzitter en zes andere leden. Zij
      worden bij koninklijk besluit op voordracht van Onze Minister benoemd en ontslagen.

      2 Een benoeming geschiedt voor een periode van vijf jaren. Herbenoeming voor een aansluitende periode is éénmaal
      mogelijk.

      3 Met het lidmaatschap van het bestuur zijn onverenigbaar:

      a. een betrekking in dienst bij een ministerie of bij een instelling of een dienst die, dan wel een bedrijf dat,
      onder de verantwoordelijkheid van een minister werkzaam is;

      b. een bestuurslidmaatschap bij, of een betrekking in dienst van een persorgaan, of de uitgever van een persorgaan.

      4 Naast ontslag op eigen verzoek van de betrokkene is ontslag alleen mogelijk op grond van ongeschiktheid,
      wegens het hebben van financiële belangen bij instellingen ten aanzien waarvan het Stimuleringsfonds wettelijke
      bevoegdheden heeft en wegens het aanvaarden van een betrekking die, of van een lidmaatschap dat met het
      lidmaatschap van het bestuur van het Stimuleringsfonds onverenigbaar is.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de bezoldiging en de
      verdere rechtspositie van de bestuursleden van het Stimuleringsfonds en van zijn personeel.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel124
  - number: '125'
    text: |-
      1 Het bestuur van het Stimuleringsfonds voor de pers neemt besluiten bij meerderheid van stemmen. Van een besluit
      tot steunverlening wordt binnen een week nadat het is genomen mededeling gedaan aan Onze Minister.

      2 Het bestuur stelt regels vast over de besluitvorming en de werkwijze van het bestuur. Deze regels behoeven de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel125
  - number: '126'
    text: |-
      De kosten van het Stimuleringsfonds voor de pers worden door Onze Minister vergoed. De begroting en de jaarrekening
      behoeven zijn instemming.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel126
  - number: '127'
    text: |-
      1 Besluiten van het Stimuleringsfonds voor de pers kunnen gedurende zes weken na de mededeling daarvan aan Onze
      Minister, dan wel gedurende de tijd dat het besluit is geschorst, bij koninklijk besluit worden vernietigd.

      2 Schorsing van besluiten van het Stimuleringsfonds kan slechts plaatsvinden gedurende vier weken dagen na de
      mededeling daarvan aan Onze Minister.

      3 In afwijking van [artikel 10:35 van de Algemene wet bestuursrecht][ref1] kan schorsing of vernietiging alleen
      geschieden wegens strijd met het recht.

      4 Een koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      Staatsblad geplaatst.

      5 Een besluit tot toekenning van financiële steunverlening treedt eerst in werking na afloop van een termijn
      van vier weken of zoveel eerder als Onze Minister heeft medegedeeld niet tot een voordracht voor schorsing of
      vernietiging over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1035
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:35
  - number: '128'
    text: |-
      1 Onze Minister bepaalt welk percentage van de inkomsten uit reclameboodschappen en telewinkelboodschappen van de
      Stichting Etherreclame, de lokale en regionale omroepinstellingen die zendtijd hebben verkregen, en de commerciële
      omroepinstellingen jaarlijks wordt uitgekeerd ten behoeve van het Stimuleringsfonds voor de pers. Dit percentage is
      niet hoger dan vier.

      2 De uitgaven van het Stimuleringsfonds worden bestreden uit de in het eerste lid bedoelde inkomsten en uit andere
      beschikbare middelen.

      3 Onze Minister kan nadere regels geven over de vaststelling van de in het eerste lid bedoelde inkomsten.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel128
  - number: '129'
    text: |-
      1 Het Stimuleringsfonds voor de pers kan binnen de door Onze Minister met toepassing van [artikel 128][ref1]
      beschikbaar gestelde bedragen ten behoeve van persorganen aan de uitgever van een persorgaan financiële steun
      verlenen.

      2 Financiële steun kan uitsluitend worden verleend ten behoeve van persorganen die voldoen aan de volgende eisen:

      a. zij worden in Nederland uitgegeven en zijn bestemd voor het publiek in Nederland;

      b. zij bevatten in belangrijke mate nieuws, analyse, commentaar en achtergrondinformatie over een gevarieerd deel
      van de maatschappelijke actualiteit, mede in het belang van politieke meningsvorming;

      c. zij worden geredigeerd door een zelfstandige redactie op basis van een statuut waarin de redactionele identiteit
      is neergelegd;

      d. zij verschijnen regelmatig en tenminste maandelijks;

      e. zij zijn voor iedereen verkrijgbaar;

      f. zij worden verkrijgbaar gesteld tegen betaling;

      g. zij worden niet uitgegeven door of vanwege de overheid;

      h. zij worden niet uitgegeven of verspreid in samenhang met het lidmaatschap, donateurschap of deelnemerschap van
      een vereniging, kerkgenootschap of andere organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel128
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '128'
        hoofdstuk: IX
  - number: '130'
    text: |-
      1 Het Stimuleringsfonds voor de pers kan ten behoeve van persorganen individuele financiële steun verlenen in de
      vorm van krediet en kredietfaciliteiten, indien de continuïteit dan wel het starten van de exploitatie van het
      persorgaan in gevaar is respectievelijk niet mogelijk is en de noodzakelijke steun niet of niet afdoende op andere
      wijze kan worden verkregen.

      2 De financiële steun wordt slechts verleend indien de verantwoordelijke uitgever een project indient dat uitzicht
      biedt op een rendabele exploitatie binnen een redelijke periode. De financiële steun wordt slechts verleend onder
      voorwaarde van uitvoering van het door het Stimuleringsfonds goedgekeurde project.

      3 Financiële steun voor de start van de exploitatie van een persorgaan kan uitsluitend worden verleend aan
      persorganen die tenminste zes keer per week verschijnen en voor ten hoogste de helft van de begrote kosten van het
      in het tweede lid bedoelde project.

      4 Uitsluitend ten behoeve van een éénmalige reorganisatie van een persorgaan kan de in het eerste lid bedoelde
      financiële steun worden verleend in de vorm van een uitkering indien het in het tweede lid bedoelde project niet op
      doeltreffende wijze kan worden uitgevoerd met behulp van kredietverlening en kredietfaciliteiten.

      5 Bij algemene maatregel van bestuur kunnen ten aanzien van de in het eerste lid bedoelde gevallen nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel130
  - number: '131'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het Stimuleringsfonds voor de pers in andere gevallen
      dan bedoeld in [artikel 130, vierde lid][ref1], financiële steun aan persorganen kan verlenen in de vorm van
      uitkeringen. Daarbij wordt bepaald voor welke doeleinden de uitkering kan worden verleend, alsmede aan welke
      nadere eisen persorganen en de uitgevers van die persorganen dienen te voldoen om voor een uitkering in aanmerking
      te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
        hoofdstuk: IX
  - number: '132'
    text: |-
      1 Financiële steun wordt verleend op aanvraag. Het Stimuleringsfonds voor de pers beslist schriftelijk op
      de aanvraag. Aanvragen voor individuele financiële steun op grond van [artikel 130][ref1] worden in volgorde
      van ontvangst in behandeling genomen en beslist. Indien het in een jaar ter beschikking staande bedrag voor
      steunverlening volledig is toegewezen, worden volgende aanvragen afgewezen.

      2 Bij algemene maatregel van bestuur worden regels gegeven over de aard van de voorschriften die het
      Stimuleringsfonds aan een besluit tot financiële steunverlening kan verbinden. De voorschriften hebben geen
      betrekking op de inhoud van de persorganen.

      3 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de indiening en de wijze van
      behandeling van de aanvragen tot financiële steun, de hoogte en de wijze van berekening daarvan, de er aan te
      verbinden voorschriften, de verstrekking van voorschotten, de beëindiging en de terugvordering van de steun.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
        hoofdstuk: IX
  - number: '134'
    text: |-
      1 Het Commissariaat voor de Media is belast met de bestuursrechtelijke handhaving van het bepaalde bij of
      krachtens:

      a. de [hoofdstukken III tot en met VI][ref1], met uitzondering van de [artikelen 18 tot en met 24][ref2],
      [31 tot en met 38][ref3], [40 tot en met 41][ref4], [41b][ref5] en [41c][ref6];

      b. de [artikelen 98b tot en met 99a][ref7], [103b][ref8], [106a][ref9] en [107 tot en met 109e][ref10];

      c. [hoofdstuk XI][ref11].

      2 Het Commissariaat oefent geen voorafgaand toezicht uit op de inhoud van een programma.

      3 Met het toezicht op de naleving van de in het eerste lid genoemde onderdelen van deze wet zijn belast de leden
      van het Commissariaat en de bij besluit van het Commissariaat aangewezen medewerkers van het Commissariaat.

      4 Van een besluit als bedoeld in het derde lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      5 Het Commissariaat stelt jaarlijks voor 1 november Onze Minister in kennis van het voorgenomen handhavingsbeleid
      in het volgende kalenderjaar.


