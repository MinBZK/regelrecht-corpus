  - number: '66'
    text: |-
      1 Het Commissariaat voor de Media kan aan een instelling die voor toewijzing van zendtijd voor lokale omroep in
      aanmerking komt, op verzoek van die instelling, in plaats van het toewijzen van zendtijd toestemming verlenen een
      programma voor lokale omroep, bedoeld in de [artikelen 30, onderdeel b][ref1], en [51f][ref2], te verzorgen dat
      wordt uitgezonden door middel van een omroepnetwerk ter plaatse.

      2 Het bepaalde ten aanzien van toewijzing en intrekking van zendtijd voor lokale omroep is van overeenkomstige
      toepassing, met dien verstande dat het Commissariaat niet de dagen en uren aanwijst waarop het programma zal
      worden uitgezonden. Indien tussen de aanbieder van het omroepnetwerk en de instelling geen overeenstemming wordt
      bereikt over de dagen en uren waarop het programma zal worden uitgezonden, kan het Commissariaat ter zake bindende
      aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
