  - number: 71f
    text: |-
      1 Reclameboodschappen of telewinkelboodschappen die zijn opgenomen in het programma van een commerciële
      omroepinstelling zijn als zodanig herkenbaar en door optische of akoestische middelen duidelijk onderscheiden van
      de andere programmaonderdelen. Er wordt geen gebruik gemaakt van subliminale technieken.

      2 De blokken van telewinkelboodschappen, bedoeld in [artikel 71g, zesde lid][ref1], zijn gedurende de gehele
      uitzending daarvan door optische middelen als zodanig herkenbaar en door optische en akoestische middelen duidelijk
      onderscheiden van de andere programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71f
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71g
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71g
    text: |-
      1 Het programma van een commerciële omroepinstelling bestaat voor ten hoogste vijftien procent van de totale duur
      per dag uit reclameboodschappen.

      2 Het programma van een commerciële omroepinstelling bestaat voor ten hoogste twintig procent van de totale duur
      per dag uit telewinkelboodschappen.

      3 Het programma van een commerciële omroepinstelling bestaat voor ten hoogste twintig procent van de totale duur
      per dag uit een combinatie van reclameboodschappen en telewinkelboodschappen.

      4 Het programma van een commerciële omroepinstelling bestaat voor ten hoogste twaalf minuten per uur uit
      reclameboodschappen of telewinkelboodschappen.

      5 Reclameboodschappen in televisieprogramma's, of telewinkelboodschappen worden uitsluitend uitgezonden in blokken
      die, met inbegrip van de eventuele omlijsting, ten minste anderhalve minuut duren.

      6 In het programma van een commerciële omroepinstelling zijn ten hoogste acht blokken van telewinkelboodschappen
      per dag opgenomen, die per blok zonder onderbreking ten minste vijftien minuten duren en waarvan de totale duur
      ten hoogste drie uur per dag is. Het tweede tot en met vijfde lid zijn niet van toepassing op deze blokken van
      telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71g
  - number: 71h
    text: |-
      1 Programmaonderdelen van commerciële omroepinstellingen worden uitsluitend onderbroken door reclameboodschappen of
      telewinkelboodschappen, indien de onderbreking geen afbreuk doet aan de integriteit, het karakter en de samenhang
      van het desbetreffende programmaonderdeel of aan de rechten van rechthebbenden.

      2 Programmaonderdelen, bestaande uit de weergave van godsdienstige of levensbeschouwelijke samenkomsten, worden
      niet onderbroken door reclameboodschappen of telewinkelboodschappen.

      3 De volgende programmaonderdelen worden uitsluitend onderbroken door reclameboodschappen of
      telewinkelboodschappen, indien zij ten minste dertig minuten duren:

      a. programmaonderdelen, bestaande uit nieuws of commentaar op het nieuws;

      b. programmaonderdelen van godsdienstige of geestelijke aard, niet zijnde programmaonderdelen als bedoeld in het
      tweede lid;

      c. programmaonderdelen die bestemd zijn voor minderjarigen beneden de leeftijd van twaalf jaar; en

      d. niet-gedramatiseerde documentaires.

      4 Films worden uitsluitend onderbroken door reclameboodschappen of telewinkelboodschappen, indien zij ten minste
      vijfenveertig minuten duren.

      5 Onverminderd het vierde lid, worden films ten hoogste eenmaal per volledig tijdvak van vijfenveertig minuten
      onderbroken door reclameboodschappen of telewinkelboodschappen. Indien een film ten minste twintig minuten langer
      duurt dan twee of meer volledige tijdvakken van vijfenveertig minuten, kan hij nog eenmaal worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71h
  - number: 71i
    text: |-
      1 Bij opeenvolgende onderbrekingen door reclameboodschappen of telewinkelboodschappen in één programmaonderdeel
      voor televisie worden tussenpozen van ten minste twintig minuten in acht genomen.

      2 In afwijking van het eerste lid, worden programmaonderdelen voor televisie die bestaan uit het verslag van een
      evenement uitsluitend onderbroken door reclameboodschappen of telewinkelboodschappen tijdens de in het evenement
      voorkomende gebruikelijke pauzes of tussen de daarin voorkomende gebruikelijke zelfstandige onderdelen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71i
  - number: 71j
    text: |-
      1 In afwijking van artikel [71g, eerste, vierde en vijfde lid][ref1], is het een commerciële omroepinstelling
      toegestaan een televisieprogramma te verzorgen dat uitsluitend bestaat uit ten behoeve van zelfpromotie uitgezonden
      reclameboodschappen.

      2 In een programma als bedoeld in het eerste lid mogen andere reclameboodschappen worden opgenomen, met
      inachtneming van de bepalingen die op het uitzenden daarvan van toepassing zijn.

      3 In afwijking van [artikel 71g, tweede tot en met zesde lid][ref2], is het een commerciële omroepinstelling
      toegestaan een programma te verzorgen dat uitsluitend bestaat uit telewinkelboodschappen.

      4 In een programma als bedoeld in het derde lid mogen reclameboodschappen worden opgenomen, met inachtneming van de
      bepalingen die op het uitzenden daarvan van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71j
    references:
