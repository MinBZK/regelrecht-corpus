  - number: 55b
    text: |-
      1 Het is aan een instelling die zendtijd heeft verkregen voor landelijke omroep uitsluitend toegestaan activiteiten
      als bedoeld in [artikel 13c, derde lid][ref1], te verrichten, indien die instelling het voornemen daartoe
      schriftelijk heeft gemeld bij de raad van bestuur, en de raad van bestuur niet binnen twee maanden heeft meegedeeld
      dat het verrichten van de desbetreffende activiteiten in strijd is met het gemeenschappelijke belang van de
      landelijke omroep.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent het verrichten van activiteiten als
      bedoeld in [artikel 13c, derde lid][ref2].

      3 Dit artikel is niet van toepassing op overheidsinstellingen, kerkgenootschappen, genootschappen op geestelijke
      grondslag en politieke partijen.


