  - number: '135'
    text: |-
      1 Het Commissariaat voor de Media kan de Stichting, de verzorger van een programma dat door middel van een
      omroepzender of een omroepnetwerk wordt uitgezonden, de aanbieder van een omroepzender of een omroepnetwerk en de
      Wereldomroep een bestuurlijke boete opleggen:

      a. van ten hoogste € 225 000,– per overtreding, bij overtreding van het bepaalde bij of krachtens de
      [artikelen 71t][ref1], [72][ref2], [73][ref3], [82i][ref4], [82j][ref5], [82f][ref6], [82k, tweede lid][ref7],
      [173][ref8] en [174][ref9];

      b. van ten hoogste € 135 000,– per overtreding, bij overtreding van het bepaalde bij of krachtens de
      [artikelen 13c][ref10], [39b][ref11], [41a][ref12], [43b][ref13], [43c][ref14], [48 tot en met 52d][ref15],
      [53, zesde lid][ref16], [53a tot en met 58][ref17], [61a tot en met 68][ref18], [71a][ref19],
      [71e tot en met 71s][ref20], [76, vierde lid][ref21], [82a tot en met 82e][ref22], [82h][ref23], [161][ref24],
      [166][ref25], [167c][ref26] en [168][ref27];

      c. van ten hoogste € 35 000,–, per overtreding, bij overtreding van het bepaalde bij of krachtens enig ander bij of
      krachtens deze wet gesteld voorschrift of [artikel 5:20 van de Algemene wet bestuursrecht][ref28].

      2 Het Commissariaat draagt de opbrengst van de bestuurlijke boeten af aan Onze Minister. De afgedragen opbrengst
      dient ter aanwending voor door Onze Minister te bepalen mediadoeleinden in brede zin.


