        artikel: '393'
  - number: '13'
    text: |-
      1 Besluiten van het Commissariaat voor de Media kunnen gedurende zes weken na de mededeling daarvan aan Onze
      Minister, dan wel gedurende de tijd dat het besluit is geschorst, bij koninklijk besluit worden vernietigd.

      2 Schorsing van besluiten van het Commissariaat kan slechts plaatsvinden gedurende vier weken na de mededeling
      daarvan aan Onze Minister.

      3 Een koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel13
  - number: 13a
    text: |-
      1 Het Commissariaat voor de Media verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      vervulling van zijn taak redelijkerwijs nodig is.

      2 Indien naar het oordeel van Onze Minister het Commissariaat zijn taken niet of niet naar behoren uitvoert, kan
      Onze Minister, na overleg met het Commissariaat, de noodzakelijke voorzieningen treffen.

      3 Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van de door hem getroffen
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel13a
  - number: 13b
    text: |-
      1 Het Commissariaat voor de Media stelt jaarlijks voor 1 juni een verslag op van zijn werkzaamheden, het gevoerde
      beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkzaamheden in het bijzonder in het
      afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld. Onze
      Minister zendt het verslag aan beide kamers der Staten-Generaal.

      2 Onze Minister zendt telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van het functioneren van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel13b
  - number: 13c
    text: |-
      1 De publieke omroep heeft tot taak:

      a. het op landelijk, regionaal en lokaal niveau verzorgen van een pluriform en kwalitatief hoogstaand aanbod
      van programma's voor algemene omroep op het gebied van informatie, cultuur, educatie en verstrooiing en deze in
      ieder geval door middel van omroepzenders te verspreiden naar alle huishoudens in het verzorgingsgebied waarvoor
      de programma's zijn bestemd en voor de ontvangst waarvan geen andere kosten verschuldigd zijn dan de kosten van
      aankoop of gebruik van technische voorzieningen die de ontvangst mogelijk maken;

      b. het verrichten van alle activiteiten met betrekking tot programmaverzorging en uitzending die daartoe nodig
      zijn;

      c. het verzorgen en uitzenden van programma's, bestemd voor landen en gebieden buiten Nederland en voor
      Nederlanders die buiten de landsgrenzen verblijven.

      2 De programma's van de publieke omroep geven op evenwichtige wijze een beeld van de samenleving en van de onder de
      bevolking levende interesses en inzichten op maatschappelijk, cultureel en levensbeschouwelijk gebied, en:

      a. zijn toegankelijk voor de gehele bevolking in het verzorgingsgebied waarvoor de programma's zijn bestemd;

      b. dragen bij aan de ontwikkeling en verspreiding van de pluriformiteit en culturele diversiteit in Nederland;

      c. zijn onafhankelijk van commerciële invloeden en, behoudens het bepaalde bij of krachtens de wet, van
      overheidsinvloeden; en

      d. zijn gericht op zowel een breed en algemeen publiek als op bevolkings- en leeftijdsgroepen van verschillende
      omvang en samenstelling.

      3 De publieke omroep kan mede invulling geven aan zijn taak, bedoeld in het eerste lid, door tevens te voorzien in
      andere dan de in het eerste lid, onderdeel a, bedoelde wijzen van aanbod en verspreiding van programmamateriaal.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel13c
  - number: '14'
    text: |-
      1 Een omroepvereniging is een vereniging die voldoet aan de volgende eisen:

      a. de vereniging heeft volledige rechtsbevoegdheid;

      b. de vereniging stelt zich blijkens haar statuten uitsluitend, althans hoofdzakelijk ten doel, ter uitvoering van
      de taak van de publieke omroep, bedoeld in [artikel 13c][ref1], op landelijk niveau een programma voor algemene
      omroep te verzorgen en alle activiteiten met betrekking tot programmaverzorging en uitzending te verrichten die
      daartoe nodig zijn;

      c. de vereniging stelt zich blijkens haar statuten ten doel in haar programma een bepaalde, in de statuten
      aangeduide, maatschappelijke, culturele of godsdienstige dan wel geestelijke stroming te vertegenwoordigen en zich
      in haar programma te richten op de bevrediging van in het volk levende maatschappelijke, culturele of godsdienstige
      dan wel geestelijke behoeften.

      2 Voor de toepassing van deze wet worden onder leden van een omroepvereniging verstaan die leden die tenminste
      zestien jaren oud zijn, in Nederland woonplaats hebben, en hun contributie, die is vastgesteld met inachtneming van
      [artikel 64][ref2], hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel64
