        paragraaf: '1'
  - number: '101'
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 december vast welke bedragen voor het volgende kalenderjaar beschikbaar zijn
      voor de kosten van:

      a. de verzorging van de televisieprogramma's, onderscheidenlijk radioprogramma's, en de activiteiten als bedoeld
      in [artikel 13c, derde lid][ref1], van de Programmastichting en de omroepverenigingen die zendtijd hebben verkregen
      tezamen;

      b. de verzorging van het televisieprogramma, onderscheidenlijk radioprogramma, en de activiteiten, als bedoeld in
      [artikel 13c, derde lid][ref2], van de Stichting;

      c. de verzorging van het televisieprogramma, onderscheidenlijk radioprogramma, en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref3], van de educatieve omroepinstelling die zendtijd heeft verkregen;

      d. de verzorging van televisieprogramma's onderscheidenlijk radioprogramma's en de activiteiten, bedoeld in
      [artikel 13c, derde lid][ref4], van de kerkgenootschappen en genootschappen op geestelijke grondslag die zendtijd
      hebben verkregen tezamen;

      e. de verzorging van de televisieprogramma's, onderscheidenlijk radioprogramma's, van de overige instellingen die
      zendtijd hebben verkregen, te zamen;

      f. de Stichting, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma;

      g. het uitzenden van de programma’s van de instellingen die zendtijd hebben verkregen voor landelijke omroep; en

      h. de versterking van de programmering.

      2 Onze Minister stelt de bedragen voor het volgende kalenderjaar, bedoeld in het eerste lid, onderdelen a tot en
      met d, vast op tachtig procent van de overeenkomstige bedragen die zijn vastgesteld voor het lopende kalenderjaar,
      indien de Stichting de begroting, bedoeld in [artikel 99][ref5], niet tijdig en met inachtneming van de regels,
      gesteld krachtens [artikel 99a,][ref6] aan Onze Minister heeft doen toekomen.

      3 Het bedrag dat beschikbaar is voor versterking van de programmering, bedraagt vijfentwintig procent van
      het totaal van de bedragen die beschikbaar zijn voor de verzorging van de programma’s van de instellingen die
      zendtijd hebben verkregen voor landelijke omroep, met uitzondering van de kerkgenootschappen en genootschappen op
      geestelijke grondslag. Onder versterking van de programmering wordt verstaan:

      a. versterking van het onderscheidend karakter van de programmering van de publieke omroep;

      b. bevordering van een herkenbare programmering op de onderscheiden televisie- en radioprogrammanetten, waaronder
      tevens wordt verstaan bevordering van samenwerkingsprojecten op en tussen de programmanetten;

      c. bevordering van de programmering van programma-onderdelen gericht op specifieke bevolkings- en leeftijdsgroepen,
      waaronder in elk geval jeugd en minderheden;

      d. bevordering van de programmering van programma-onderdelen van culturele aard en programma-onderdelen die
      betrekking hebben op kunst, waaronder in elk geval toneel, documentaires, film, hoorspelen, klassieke muziek en
      opera.

      4 Het bedrag dat beschikbaar is voor versterking van de programmering, komt geheel ten goede aan de instellingen
      die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van de kerkgenootschappen en genootschappen
      op geestelijke grondslag.


