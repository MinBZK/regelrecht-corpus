  - number: 71n
    text: |-
      1 Het televisieprogramma van een commerciële omroepinstelling bestaat voor ten minste vijftig procent uit
      programmaonderdelen die kunnen worden aangemerkt als Europese producties in de zin van artikel 6 van de Europese
      richtlijn.

      2 Het televisieprogramma van een commerciële omroepinstelling, bestaat voor ten minste tien procent uit
      programmaonderdelen als bedoeld in het eerste lid, die niet zijn geproduceerd door:

      a. de desbetreffende commerciële omroepinstelling, of een andere instelling die een programma verzorgt;

      b. een rechtspersoon waarin een instelling die een programma verzorgt, al dan niet door middel van een of meer van
      haar dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;

      c. een rechtspersoon waarin twee of meer instellingen die een programma verzorgen, al dan niet door middel van een
      of meer van hun onderscheidene dochtermaatschappijen, tezamen een belang van meer dan vijftig procent hebben; of

      d. een vennootschap waarin een instelling die een programma verzorgt, dan wel een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.

      3 Ten minste een derde deel van de programmaonderdelen, bedoeld in het tweede lid, is niet ouder dan vijf jaar.

      4 Voor de toepassing van dit artikel worden de volgende programmaonderdelen voor televisie buiten beschouwing
      gelaten:

      a. programmaonderdelen, bestaande uit nieuws;

      b. programmaonderdelen die betrekking hebben op sport;

      c. programmaonderdelen die het karakter van een spel hebben, met uitzondering van programmaonderdelen van culturele
      of educatieve aard, die mede het karakter van een spel hebben;

      d. programmaonderdelen, bestaande uit reclameboodschappen of telewinkelboodschappen; en

      e. programmaonderdelen, bestaande uit stilstaande beelden.

      5 Dit artikel is niet van toepassing op:

      a. een televisieprogramma dat in slechts één gemeente of een beperkt aantal aan elkaar grenzende gemeenten kan
      worden ontvangen;

      b. televisieprogramma's als bedoeld in [artikel 71j][ref1];

      c. televisieprogramma's die uitsluitend bestemd zijn voor ontvangst in andere dan de lidstaten van de Europese Unie
      en die niet direct of indirect kunnen worden ontvangen door het publiek in één of meer lidstaten van de Europese
      Unie.

      6 Het Commissariaat voor de Media kan in bijzondere gevallen ten aanzien van een bepaalde commerciële
      omroepinstelling tijdelijk gedeeltelijke ontheffing verlenen van het eerste lid, met dien verstande dat het
      percentage niet lager gesteld kan worden dan tien.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71j
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71n
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71j
        hoofdstuk: IV
        paragraaf: '2'
  - number: 71o
    text: |-
      1 Het televisieprogramma van een commerciële omroepinstelling bestaat voor ten minste veertig procent uit
      oorspronkelijk Nederlands- of Friestalige programmaonderdelen.

      2 Bij algemene maatregel van bestuur kan worden bepaald welk percentage van de in het eerste lid bedoelde
      programmaonderdelen ten minste wordt voorzien van ondertiteling ten behoeve van mensen met een auditieve beperking.

      3 Het Commissariaat voor de Media kan in bijzondere gevallen ten aanzien van een bepaalde commerciële
      omroepinstelling desgevraagd en onder voorwaarden de in het eerste en tweede lid bedoelde percentages lager
      vaststellen.

      4 Het eerste lid is niet van toepassing op een programma voor bijzondere omroep.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71o
  - number: 71p
    text: |-
      Een commerciële omroepinstelling neemt in haar programma geen films op buiten de met de rechthebbenden op de film
      overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71p
  - number: 71q
    text: |-
      De [artikelen 71g][ref1], [71h, tweede tot en met vijfde lid][ref2], [71i][ref3], [71j][ref4], [71l][ref5] en
      [71n tot en met 71p][ref6] zijn niet van toepassing op een televisieprogramma dat niet direct of indirect buiten
      Nederland ontvangen kan worden, en dat:

      a. voorzover het de beeldinhoud betreft, uitsluitend of nagenoeg uitsluitend bestaat uit stilstaande beelden; of

      b. hoofdzakelijk bestaat uit informatie met betrekking tot de door middel van een omroepzender of omroepnetwerk
      aangeboden programma's en diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71g
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel71h
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel71i
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel71j
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel71l
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel71n
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71q
