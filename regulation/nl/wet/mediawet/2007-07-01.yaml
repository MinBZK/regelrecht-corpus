  - number: 52d
    text: |-
      1 Het televisieprogramma van een instelling die zendtijd heeft verkregen bevat geen programma-onderdelen die de
      lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger dan zestien jaar ernstige schade zouden
      kunnen toebrengen.

      2 Het televisieprogramma van een instelling die zendtijd heeft verkregen mag slechts programma-onderdelen bevatten
      die schade kunnen toebrengen aan de lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger dan
      zestien jaar, indien die instelling is aangesloten bij een door Onze Minister erkende organisatie als bedoeld
      in [artikel 53, eerste lid][ref1], en ter zake gebonden is aan de regels en het toezicht daarop van die erkende
      organisatie met betrekking tot het uitzenden van de hiervoor bedoelde programma-onderdelen. De instelling die
      zendtijd heeft verkregen en die is aangesloten toont dit aan door middel van een aan het Commissariaat voor de
      Media over te leggen schriftelijke verklaring van de erkende organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel53
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '53'
        hoofdstuk: III
        afdeling: '1'
  - number: '53'
    text: |-
      1 Onze Minister kan een organisatie erkennen die voorziet in regelingen omtrent classificatie en het uitzenden van
      programma-onderdelen als bedoeld in [artikel 52d, tweede lid][ref1], en het toezicht daarop. De regelingen hebben
      in ieder geval betrekking op:

      a. criteria voor de classificatie van programma-onderdelen, waaronder in ieder geval de mate waarin:

      1°. angst wordt opgewekt;

      2°. brutaliserend geweld wordt vertoond of gerechtvaardigd;

      3°. het gebruik van drugs aantrekkelijk wordt voorgesteld of vergoelijkt;

      4°. sprake is van pornografie;

      5°. op andere gronden volgens algemeen geldende opvattingen producten niet geschikt zijn voor vertoning aan
      bepaalde categorieën personen jonger dan zestien jaar;

      b. de uitzendtijdstippen van de hiervoor bedoelde programma-onderdelen;

      c. de wijze waarop de uitzending van deze programma-onderdelen wordt voorafgegaan door of is voorzien van symbolen
      of waarschuwingen.

      2 Aan een erkenning kunnen voorschriften worden verbonden. Van een beschikking tot erkenning wordt mededeling
      gedaan in de Staatscourant.

      3 Een organisatie komt slechts voor erkenning in aanmerking indien:

      a. onafhankelijk toezicht door de organisatie op de naleving van de regelingen, bedoeld in het eerste lid, is
      gewaarborgd;

      b. voorzien is in voldoende betrokkenheid van belanghebbenden, waaronder in ieder geval vertegenwoordigers uit de
      consumentensfeer, instellingen die zendtijd hebben verkregen, deskundigen op het gebied van de audiovisuele media
      en producenten van audiovisuele media;

      c. de financiële positie van de organisatie een adequate uitvoering van de werkzaamheden waarborgt.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de eisen
      bedoeld in het derde lid en kunnen andere eisen ten aanzien van de erkenning worden gesteld.

      5 Onze Minister trekt een erkenning in indien de organisatie niet meer voldoet aan de bij of krachtens het eerste
      of derde lid gestelde eisen. Onze Minister kan voorts een erkenning intrekken indien de organisatie niet voldoet
      aan de in het tweede lid bedoelde voorschriften of de in het vierde lid bedoelde nadere en andere eisen. Van een
      beschikking tot intrekking wordt mededeling gedaan in de Staatscourant.

      6 Bij algemene maatregel van bestuur kunnen het eerste tot en met vierde lid en [artikel 52d, tweede lid][ref2],
      buiten werking worden gesteld en kunnen regels worden gesteld omtrent het uitzenden van programma-onderdelen als
      bedoeld in [artikel 52d, tweede lid][ref3], voor zover dat noodzakelijk is voor een juiste en tijdige uitvoering
      van artikel 22 van de Europese richtlijn.

      7 Na de plaatsing in het Staatsblad van een krachtens het zesde lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Wordt het voorstel tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het
      tijdstip van inwerkingtreding van die wet.

      8 De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
