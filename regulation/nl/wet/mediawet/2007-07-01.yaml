  - number: '68'
    text: |-
      1 Het Commissariaat voor de Media kan aan een lokale omroepinstelling die zendtijd heeft verkregen, op verzoek van
      die instelling, toestemming verlenen naast het programma, bedoeld in [artikel 51f][ref1], een ander programma te
      verzorgen dat wordt uitgezonden door middel van een omroepnetwerk ter plaatse.

      2 De toestemming, bedoeld in het eerste lid, kan slechts worden verleend, indien:

      a. het programma wordt uitgezonden op een ander kanaal dan het kanaal waarop het programma, bedoeld in
      [artikel 51f][ref2], wordt uitgezonden;

      b. het programma wordt geproduceerd door een lokale omroepinstelling die zendtijd heeft verkregen, of door een
      andere instelling zonder winstoogmerk;

      c. het programma, naast de onderdelen, bedoeld in [artikel 43a][ref3], voor ten minste vijfenzeventig procent
      bestaat uit onderdelen van culturele aard en voor het overige deel, doch voor ten minste tien procent, bestaat uit
      onderdelen van culturele aard, die in het bijzonder betrekking hebben op de desbetreffende gemeente; en

      d. de aanvraag vergezeld gaat van een advies van de Raad voor cultuur, waaruit blijkt dat het programma naar het
      oordeel van de Raad voor cultuur van bijzonder belang is voor de verscheidenheid van het aanbod van kwalitatief
      hoogstaande programma-onderdelen van culturele aard in Nederland.

      3 De toestemming, bedoeld in het eerste lid, wordt verleend voor de duur van vijf jaar. De toestemming vervalt,
      indien de lokale omroepinstelling niet meer over zendtijd beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
