        afdeling: '1'
  - number: 41c
    text: |-
      1 Met inachtneming van de [artikelen 40, vierde lid][ref1], en [41a][ref2] wordt de zendtijd voor landelijke radio-
      omroep zodanig ingedeeld, dat:

      a. de programmaonderdelen van de omroepverenigingen welke niet de wens te kennen hebben gegeven dat hun
      programmaonderdelen op alle radioprogrammanetten worden uitgezonden, op ten minste een bij algemene maatregel van
      bestuur vast te stellen aantal radioprogrammanetten worden uitgezonden;

      b. op ten minste twee radioprogrammanetten 24 uur per dag programmaonderdelen van instellingen die zendtijd hebben
      verkregen voor landelijke omroep, worden uitgezonden; en

      c. op de overige radioprogrammanetten in ieder geval dagelijks tussen 07.00 uur en 24.00 uur programmaonderdelen
      van instellingen die zendtijd hebben verkregen voor landelijke omroep, worden uitgezonden.

      2 Bij algemene maatregel van bestuur kan worden bepaald hoeveel uren zendtijd voor radio van een omroepvereniging
      jaarlijks ten minste op de radioprogrammanetten, bedoeld in het eerste lid, onderdeel *a*, zullen worden ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
