  - number: '99'
    text: |-
      1 De Stichting doet jaarlijks voor 1 oktober een begroting voor de instellingen die zendtijd hebben verkregen voor
      landelijke omroep, toekomen aan Onze Minister en het Commissariaat voor de Media. De begroting wordt, rekening
      houdende met de netbegrotingen, bedoeld in [artikel 98a][ref1], door de raad van bestuur vastgesteld.

      2 De begroting bevat in ieder geval:

      a. een beschrijving van de wijze waarop door de instellingen die zendtijd hebben verkregen op de televisie- en
      radioprogrammanetten invulling wordt gegeven aan de voorgenomen programmering, met inachtneming van het bepaalde
      bij of krachtens [artikel 13c][ref2] en hetgeen overigens bij of krachtens deze wet is bepaald ten aanzien van de
      programma's en de programmering op de televisieen radioprogrammanetten;

      b. een beschrijving van de voornemens van de instellingen die zendtijd hebben verkregen voor landelijke omroep met
      betrekking tot activiteiten als bedoeld in artikel [13c, derde lid][ref3];

      c. de hoogte van de bedragen die voor het volgende kalenderjaar nodig zullen zijn om de voornemens van de
      landelijke omroep en van de instellingen die zendtijd hebben verkregen voor landelijke omroep, te verwezenlijken,
      alsmede een financieel overzicht, inhoudende een raming van de voorziene benodigde middelen voor de daarop volgende
      vier jaren;

      d. een beschrijving van de wijze waarop de raad van bestuur voornemens is het bedrag dat beschikbaar is voor
      versterking van de programmering, de gelden, bedoeld in [artikel 106a][ref4], alsmede de uitkeringen, bedoeld in
      [artikel 170c, tweede lid][ref5], te besteden;

      e. een toelichting op de onderscheiden onderdelen en begrotingsposten;

      f. een beschrijving van de samenwerking met de Wereldomroep.

      3 In de begroting worden afzonderlijk opgenomen:

      a. de bedragen die nodig zullen zijn ter bestrijding van de kosten van de verzorging van:

      1°. de televisieprogramma's, onderscheidenlijk radioprogramma's, van de Programmastichting en de omroepverenigingen
      die zendtijd hebben verkregen;

      2°. het televisieprogramma, onderscheidenlijk radioprogramma, van de Stichting;

      3°. het televisieprogramma, onderscheidenlijk radioprogramma, van de educatieve omroepinstelling die zendtijd heeft
      verkregen voor landelijke omroep;

      4°. de televisieprogramma's, onderscheidenlijk radioprogramma's van de kerkgenootschappen en genootschappen op
      geestelijke grondslag die zendtijd hebben verkregen;

      b. de bedragen die nodig zullen zijn voor het verrichten van activiteiten als bedoeld in
      [artikel 13c, derde lid][ref6], door de instellingen die zendtijd hebben verkregen voor landelijke omroep;

      c. de bedragen die nodig zullen zijn ter bestrijding van de kosten van:

      1°. de Stichting, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma en het
      verrichten van activiteiten als bedoeld in [artikel 13c, derde lid][ref7]; en

      2°. het uitzenden van de programma's van de instellingen die zendtijd hebben verkregen voor landelijke omroep;

      d. de bedragen die nodig zullen zijn voor de versterking van de programmering;

      e. de eigen inkomsten van de instellingen die zendtijd hebben verkregen voor landelijke omroep, voor zover die
      moeten worden aangewend voor de verzorging van het programma;

      f. het aantal uren zendtijd, dat de Programmastichting en de omroepverenigingen ten minste zullen gebruiken.

      4 In de begroting wordt tevens aangegeven de hoogte van de bedragen:

      a. die de omroepverenigingen voornemens zijn te besteden aan programma-onderdelen van informatieve, educatieve en
      culturele aard, waaronder programma-onderdelen die betrekking hebben op kunst;

      b. die de omroepverenigingen voornemens zijn te besteden aan programma-onderdelen die gericht zijn op specifieke
      bevolkings- en leeftijdsgroepen, waaronder in elk geval jeugd en minderheden;

      c. die de Programmastichting voornemens is te besteden aan programma-onderdelen van culturele aard en programma-
      onderdelen gericht op specifieke bevolkings- en leeftijdsgroepen, waaronder in elk geval jeugd en minderheden;

      d. de bedragen die de instellingen die zendtijd hebben verkregen voor landelijk omroep voornemens zijn te besteden
      aan programma-onderdelen als bedoel in [artikel 54, tweede lid][ref8].

      5 De begroting bevat tevens:

      a. een beschrijving van de wijze waarop door de instellingen die zendtijd hebben verkregen voor landelijke omroep
      in het afgelopen jaar invulling is gegeven aan de programmering;

      b. een beschrijving van de mate waarin in het afgelopen jaar de in de prestatieovereenkomst, bedoeld in
      [artikel 30b, zevende lid][ref9], vastgelegde doelstellingen met betrekking tot het programma-aanbod en het
      publieksbereik van de landelijke omroep zijn bereikt;

      c. een overzicht van de feitelijke bestedingen van de instellingen die zendtijd hebben verkregen voor landelijke
      omroep, ingedeeld volgens de onderverdeling die in het tweede tot en met vierde lid is opgenomen, welk overzicht in
      ieder geval betrekking heeft op de twee voorafgaande kalenderjaren;

      d. een verslag over de naleving van de gedragscode, bedoeld in [artikel 16, vijfde lid][ref10], in het afgelopen
      jaar.

      6 Ten behoeve van het opstellen van het overzicht van de feitelijke bestedingen doet elke instelling die zendtijd
      heeft verkregen voor landelijke omroep, jaarlijks voor 1 mei aan de Stichting toekomen een individuele opgave van
      haar feitelijke bestedingen in het voorafgaande kalenderjaar, ingedeeld volgens de onderverdeling die in het tweede
      tot en met vierde lid is opgenomen.

      7 De begroting wordt door de raad van bestuur openbaar gemaakt.


