  - number: '109'
    text: |-
      1 De instellingen die zendtijd hebben verkregen voor landelijke omroep – met uitzondering van de overheid – en de
      Wereldomroep leggen financiële rekening en verantwoording af aan het Commissariaat voor de Media ten behoeve van
      de rechtmatigheidstoetsing van de uitgaven. Zij doen daartoe jaarlijks voor 1 mei hun jaarrekening toekomen aan het
      Commissariaat. Het boekjaar is gelijk aan een kalenderjaar.

      2 De instellingen die zendtijd hebben verkregen voor landelijke omroep – met uitzondering van de overheid – doen
      jaarlijks voor 1 mei een afschrift van hun jaarrekening over het voorafgaande boekjaar toekomen aan de raad van
      bestuur. De raad van bestuur zendt voor 1 juni zijn opmerkingen met betrekking tot de jaarrekeningen aan het
      Commissariaat.

      3 [Titel 9 van het Tweede Boek van het Burgerlijk Wetboek][ref1] is van toepassing op de instellingen, bedoeld in
      het eerste lid, met dien verstande dat zij de winst- en verliesrekening vervangen door een exploitatierekening;
      op deze rekening zijn de bepalingen omtrent de winst- en verliesrekening zoveel mogelijk van overeenkomstige
      toepassing. Bepalingen omtrent winst en verlies zijn zoveel mogelijk van overeenkomstige toepassing op het
      exploitatiesaldo.

      4 De jaarrekening bevat tevens de gegevens, bedoeld in [artikel 99, zesde lid][ref2].

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inrichting van
      de jaarrekening.

      6 Het Commissariaat brengt als onderdeel van het financieel verslag, bedoeld in [artikel 12, tweede lid][ref3],
      verslag uit over de rechtmatigheidstoetsing, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel12
