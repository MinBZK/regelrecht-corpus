  - number: '48'
    text: |-
      Iedere instelling die zendtijd heeft verkregen bepaalt, onverminderd het bij of krachtens de wet bepaalde, vorm en
      inhoud van haar programma en is verantwoordelijk voor hetgeen in haar zendtijd wordt uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel48
  - number: '49'
    text: |-
      1 De omroepverenigingen en de educatieve omroepinstelling die zendtijd hebben verkregen, gebruiken de hun krachtens
      [artikel 39, eerste tot en met derde lid][ref1], ter beschikking gestelde zendtijd geheel.

      2 De Programmastichting gebruikt de haar krachtens [artikel 39][ref2], ter beschikking gestelde zendtijd geheel.

      3 De Stichting gebruikt de haar krachtens [artikel 39][ref3], ter beschikking gestelde zendtijd geheel.

      4 De overige instellingen die zendtijd voor landelijke omroep hebben verkregen, met uitzondering van de Stichting
      Etherreclame, gebruiken de hun met toepassing van de [artikelen 39f tot en met 39i][ref4] toegewezen zendtijd
      geheel.


