        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
  - number: '31'
    text: |-
      1 Voor programmaverzorging voor landelijke omroep kan Onze Minister omroepverenigingen en één educatieve
      omroepinstelling erkennen.

      2 Erkenningen worden eenmaal in de vijf jaren verleend voor een, voor alle erkende omroepinstellingen tegelijk
      aanvangende periode van vijf jaren, met dien verstande dat het tijdstip waarop de erkenningen in werking treden
      samenvalt met het tijdstip waarop de concessie, bedoeld in [artikel 30a][ref1], in werking treedt, dan wel met het
      tijdstip waarop de vijfjaarlijkse perioden, bedoeld in [artikel 30b, derde lid][ref2], aanvangen.

      3 Een omroepvereniging komt slechts in aanmerking voor een erkenning, indien:

      a. de omroepvereniging in het jaar voorafgaande aan de periode van erkenning, zendtijd als omroepvereniging heeft
      gehad; en

      b. door het Commissariaat voor de Media is vastgesteld dat de omroepvereniging ten minste 150 000 leden heeft.

      4 Een erkenning geeft aan de erkende omroepinstelling gedurende de periode waarvoor erkenning is verleend recht op
      zendtijd en een financiële bijdrage voor de verzorging van het programma.

      5 Een erkende omroepinstelling is verplicht gedurende de periode waarvoor erkenning is verleend een televisie- en
      een radioprogramma voor landelijke omroep te verzorgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel31
