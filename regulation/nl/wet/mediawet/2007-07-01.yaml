  - number: '107'
    text: |-
      1 Het provinciebestuur draagt zorg voor de bekostiging van het functioneren van ten minste één regionale
      omroepinstelling in de provincie door vergoeding van de kosten die rechtstreeks verband houden met het functioneren
      van de regionale omroepinstelling, voor zover die kosten niet op andere wijze zijn gedekt, op zodanige wijze
      dat een kwalitatief hoogwaardige programmering mogelijk is en continuïteit van bekostiging is gewaarborgd.
      Deze bekostiging waarborgt in ieder geval dat per provincie het in 2004 bestaande niveau van de activiteiten
      met betrekking tot de verzorging van radio- en televisieprogramma’s en van de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref1], van de regionale omroepinstelling(en) ten minste gehandhaafd blijft.

      2 Aan de bekostiging, bedoeld in het eerste lid, worden geen voorwaarden gesteld of voorschriften verbonden die in
      strijd zijn met het bepaalde bij of krachtens deze wet.

      3 Onze Minister zendt binnen drie jaar na de inwerkingtreding van dit artikel, en vervolgens telkens na drie jaar,
      aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van het bepaalde in dit artikel in de
      praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel107
