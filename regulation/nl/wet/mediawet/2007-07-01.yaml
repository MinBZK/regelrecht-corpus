  - number: '44'
    text: |-
      De zendtijd van een omroepvereniging en de educatieve omroepinstelling die een erkenning of een voorlopige
      erkenning heeft verkregen, vervalt op het tijdstip waarop de erkenning of voorlopige erkenning vervalt of wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel44
  - number: '45'
    text: |-
      1 Het Commissariaat voor de Media trekt de met toepassing van een van de [artikelen, 39f][ref1], [39g][ref2] of
      [42][ref3] toegewezen zendtijd in, wanneer de desbetreffende instelling niet meer voldoet aan de eisen die worden
      gesteld om voor toewijzing in aanmerking te komen.

      2 Indien van een instelling de toegewezen zendtijd is ingetrokken op grond van het eerste lid, kan zij gedurende
      één jaar daarna geen aanvraag tot toewijzing van zendtijd indienen.

      3 In afwijking van het eerste lid trekt het Commissariaat de zendtijd die is toegewezen aan een lokale of regionale
      omroepinstelling die niet meer voldoet aan een in [artikel 30, onderdeel b of c][ref4], gesteld vereiste, niet
      in dan nadat de desbetreffende omroepinstelling gedurende vier maanden, gerekend van de dag waarop dit feit is
      geconstateerd, in de gelegenheid is gesteld wederom aan dit vereiste te voldoen en zij daarin niet is geslaagd.

      4 De aan een lokale of regionale omroepinstelling toegewezen zendtijd kan door het Commissariaat worden ingetrokken
      indien de lokale of regionale omroepinstelling in een periode van een jaar geen programma, dat voldoet aan de eisen
      van deze wet, heeft verzorgd dat gedurende een ononderbroken periode van ten minste twee maanden is uitgezonden.

      5 Het Commissariaat stelt de gemeente, respectievelijk de provincie in de gelegenheid haar zienswijze naar voren te
      brengen alvorens te beslissen over intrekking van de zendtijd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39g
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel30
