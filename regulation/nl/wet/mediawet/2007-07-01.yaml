  - number: '15'
    text: |-
      1 De Nederlandse Programma Stichting verzorgt een programma dat bestaat uit onderdelen die voorzien in de
      bevrediging van in het volk levende maatschappelijke, culturele, godsdienstige of geestelijke behoeften, zodanig
      dat dit programma te zamen met de programma’s van de andere instellingen die zendtijd voor landelijke omroep
      hebben verkregen, een evenwichtig beeld oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke
      verscheidenheid in Nederland.

      2 Het bestuur van de Programmastichting bestaat uit een voorzitter en zes andere leden.

      3 Onze Minister benoemt de voorzitter en de andere leden van het bestuur. Voor benoeming komen in aanmerking
      personen die deskundig zijn op het gebied van het programma dat de Programmastichting verzorgt.

      4 De leden van het bestuur worden telkens voor een termijn van vier jaren benoemd. Herbenoeming voor een
      aansluitende periode is éénmaal mogelijk.

      5 Naast ontslag op eigen verzoek van een bestuurder is ontslag alleen mogelijk op grond van ongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel15
  - number: 15a
    text: |-
      1 De Programmastichting heeft een programmaraad, die het bestuur adviseert over het programma dat de
      Programmastichting verzorgt.

      2 De programmaraad bestaat uit een voorzitter en negentien andere leden.

      3 Onze Minister benoemt de voorzitter van de programmaraad. De andere leden van de programmaraad worden benoemd
      door maatschappelijke en culturele organisaties die daartoe door Onze Minister zijn aangewezen.

      4 De leden van de programmaraad worden telkens voor een termijn van vijf jaren benoemd. De leden die in de loop van
      de vijfjarige termijn zijn benoemd, treden tegelijk met de andere leden af. De leden zijn terstond herbenoembaar.

      5 De programmaraad regelt zijn werkzaamheden. Deze regels behoeven de instemming van het bestuur van de
      Programmastichting.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel15a
  - number: 15b
    text: |-
      1 Wijzigingen in de statuten van de Programmastichting behoeven de instemming van Onze Minister.

      2 Het bestuur van de Programmastichting kan niet besluiten tot ontbinding van de Programmastichting.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel15b
  - number: '16'
    text: |-
      1 De Nederlandse Omroep Stichting is het samenwerkings- en coördinatieorgaan van de landelijke omroep.

      2 Naast andere taken die de Stichting heeft op grond van deze wet, is zij belast met:

      a. het bevorderen van samenwerking en coördinatie binnen de landelijke omroep met het oog op de uitvoering van de
      publieke omroeptaak, bedoeld in [artikel 13c][ref1];

      b. de coördinatie, op en tussen de verschillende programmanetten, van de programma’s van de instellingen die
      zendtijd hebben verkregen voor landelijke omroep;

      c. het verzorgen van een programma;

      d. het iedere zes maanden maken van verslagen, waarin de uitgezonden programma-onderdelen van de Stichting,
      de Programmastichting en de omroepverenigingen zowel per afzonderlijke omroepinstelling, per televisie-,
      onderscheidenlijk radioprogrammanet, als voor de genoemde omroepinstellingen gezamenlijk worden opgesomd
      en ingedeeld overeenkomstig de omschrijvingen, bedoeld in de [artikelen 40, tweede en vierde lid][ref2],
      [50, eerste tot en met derde lid][ref3], [51, eerste lid][ref4], [51b, tweede en derde lid][ref5],
      [51d, tweede lid][ref6], [54, eerste tot en met vierde lid][ref7], en [54a, eerste en derde lid][ref8].

      e. de vertegenwoordiging, na overleg met Onze Minister, van de instellingen die zendtijd voor landelijke omroep
      hebben verkregen en de Wereldomroep als geheel, in internationale organisaties op het gebied van radio- en
      televisieprogramma’s en het uitzenden daarvan, alsmede de medewerking aan de oprichting van zodanige organisaties;

      f. het, na toestemming van Onze Minister, meewerken aan een Europees televisieprogramma, dat mede op het
      Nederlandse publiek is gericht, in samenwerking met buitenlandse omroepinstellingen;

      g. het ter beschikking stellen van programma’s aan het buitenland;

      h. het behartigen van aangelegenheden die van gemeenschappelijk belang zijn voor de instellingen die zendtijd
      hebben verkregen voor landelijke omroep;

      i. het indelen van de zendtijd van de instellingen die zendtijd hebben verkregen voor landelijke omroep;

      j. het opstellen van een begroting als bedoeld in [artikel 99][ref9];

      k. het in samenwerking met de Wereldomroep binnen de grenzen van de de begroting waarmee Onze Minister heeft
      ingestemd sluiten van collectieve arbeidsovereenkomsten, mede in naam van de instellingen die zendtijd hebben
      verkregen voor landelijke omroep, met uitzondering van politieke partijen;

      l. het in samenwerking met de Wereldomroep vaststellen van normen voor de honorering van losse medewerkers, mede
      in naam van de instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van politieke
      partijen;

      m. de bekostiging van de instellingen die zendtijd hebben verkregen voor landelijke omroep, waaronder het
      bevorderen van een doelmatige inzet van de door Onze Minister beschikbaar gestelde bedragen, bedoeld in
      [artikel 101, eerste lid][ref10];

      n. het inrichten, instandhouden, beheren en het regelen van het gebruik van organen, diensten en hulpmiddelen, die
      nodig zijn voor een goede uitvoering van de onder a tot en met m genoemde taken, voor zover dit niet behoort tot de
      in [artikel 83][ref11] bedoelde taak van het Bedrijf.

      3 De verslagen, bedoeld in het tweede lid, onderdeel d, worden gezonden aan het Commissariaat voor de Media.

      4 De Stichting is bevoegd om binnen het kader van haar taak, bedoeld in het tweede lid, onderdeel h, in naam van
      de gezamenlijke instellingen die zendtijd hebben verkregen voor landelijke omroep, overeenkomsten met derden aan
      te gaan.

      5 In het kader van haar taak, bedoeld in het tweede lid, onderdeel h, draagt de Stichting zorg voor de
      totstandkoming van een gedragscode ter bevordering van goed bestuur en integriteit ten behoeve van de instellingen
      die zendtijd hebben verkregen voor landelijke omroep. Een gedragscode als bedoeld in de eerste volzin heeft in elk
      geval betrekking op:

      a. aanbevelingen terzake van bestuurlijke organisatie, waaronder beloningen en toezicht;

      b. gedragsregels terzake van integer handelen;

      c. gedragsregels terzake van publieke en transparante verantwoording en verslaglegging;

      d. procedures voor de behandeling van meldingen en vermoedens over mogelijke misstanden; en

      e. toezicht en naleving van de gedragscodes.


