        hoofdstuk: VI
        paragraaf: '3'
  - number: 82l
    text: |-
      1 De leden van een programmaraad als bedoeld in artikel 82k, eerste lid, worden benoemd door de gemeenteraad van
      de gemeente waar het omroepnetwerk aanwezig is. In gemeenten waar reeds een programmaraad functioneert, vindt de
      benoeming plaats na overleg met deze programmaraad.

      2 Indien een aantal omroepnetwerken gekoppeld is en daardoor feitelijk als één omroepnetwerk functioneert, wordt
      met betrekking tot die gekoppelde omroepnetwerken één programmaraad ingesteld door de onderscheidene gemeenteraden
      gezamenlijk. Het eerste lid, tweede volzin, is van overeenkomstige toepassing.

      3 Voor benoeming tot lid van een programmaraad komen in aanmerking personen die:

      a. woonachtig zijn in het gebied waarop het advies van de programmaraad betrekking heeft, en

      b. die aangesloten zijn op het omroepnetwerk in dat gebied, dan wel deel uitmaken van een huishouden dat daarop
      is aangesloten.

      4 Met het lidmaatschap van een programmaraad zijn onverenigbaar:

      a. een lidmaatschap van een gemeenteraad in een gemeente die behoort tot het gebied waarop het advies van de
      programmaraad betrekking heeft,

      b. een lidmaatschap van een College van Burgemeester en Wethouders in een gemeente als bedoeld in onderdeel a,

      c. een binding met de aanbieder van het omroepnetwerk dat aanwezig is in het gebied waarop het advies van de
      programmaraad betrekking heeft, en

      d. een lidmaatschap van het bestuur van of een betrekking, al dan niet tegen betaling, bij een instelling van de
      publieke omroep dan wel een commerciële omroepinstelling.

      5 Een vacature van de programmaraad wordt zo spoedig mogelijk, doch uiterlijk binnen zes maanden vervuld.

      6 De leden van een programmaraad worden benoemd voor een periode van vier jaar met de mogelijkheid van een
      eenmalige herbenoeming voor dezelfde periode.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82l
  - number: 82m
    text: |-
      1 De programmaraad is representatief voor de belangrijkste in de gemeente of gemeenten voorkomende
      maatschappelijke, culturele, godsdienstige en geestelijke stromingen en beschikt als geheel over voldoende kennis
      van de informatiebehoeften van bevolkings- en leeftijdsgroepen van verschillende omvang en samenstelling binnen het
      kijk- en luisterpubliek.

      2 De gemeenteraad bepaalt de omvang van een programmaraad, met dien verstande dat een programmaraad bestaat uit ten
      minste zeven en ten hoogste vijftien leden. Artikel 82l, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82m
  - number: 82n
    text: |-
      1 Een programmaraad beschikt over een reglement waarin in ieder geval regels zijn opgenomen over:

      a. de wijze waarop de instelling, de taak en de samenstelling van de programmaraad kenbaar wordt gemaakt aan de
      aangeslotenen op het omroepnetwerk in het gebied waarop het advies van de programmaraad betrekking heeft, en

      b. de totstandkoming, de inhoud, de vaststelling, de openbaarmaking en de geldigheidsduur van het advies van de
      programmaraad.

      2 Het reglement van een programmaraad voorziet in een transparante adviesprocedure.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82n
  - number: 82o
    text: |-
      De [artikelen 82k tot en met 82n][ref1] zijn niet van toepassing op de aanbieder van een omroepnetwerk waaraan het
      Commissariaat voor de Media ontheffing heeft verleend op grond van [artikel 82i, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82k
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82i
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82o
