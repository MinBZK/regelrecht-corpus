    text: |-
      1 Alle activiteiten en werkzaamheden van een instelling die zendtijd heeft verkregen, die niet rechtstreeks verband
      houden met of ten dienste staan van de uitoefening van de taak, bedoeld in [artikel 13c, eerste lid][ref1], worden
      aangemerkt als nevenactiviteiten, met uitzondering van de verenigingsactiviteiten van een omroepvereniging.

      2 Met het verrichten van een nevenactiviteit wordt gelijkgesteld het hebben van een direct of indirect belang in
      een rechtspersoon die een dergelijke activiteit verricht.


