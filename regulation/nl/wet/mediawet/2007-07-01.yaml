  - number: '47'
    text: |-
      1 Indien aan een instelling die zendtijd heeft verkregen voor landelijke omroep voor twee achtereenvolgende jaren
      een sanctie als bedoeld in [artikel 103a][ref1] is opgelegd, dan wel indien een omroepvereniging of de educatieve
      omroepinstelling naar het oordeel van de raad van bestuur onvoldoende uitvoering geeft aan de bereidheid tot
      samenwerking, bedoeld in [artikel 32, derde lid][ref2], kan de raad van bestuur het Commissariaat voor de Media
      verzoeken met overeenkomstige toepassing van de [artikelen 46][ref3] en [46a][ref4] de aan de desbetreffende
      instelling toegewezen zendtijd in te trekken of te verminderen.

      2 Bij een intrekking of vermindering van zendtijd voor landelijke omroep krachtens [artikel 46a][ref5], alsmede
      bij een tussentijdse toewijzing van zendtijd op grond van een van de [artikelen 39f tot en met 39h][ref6], kan het
      Commissariaat voor de Media, voor zover nodig, de toewijzing van zendtijd aan de andere instellingen, bedoeld in de
      [artikelen 39f tot en met 39h][ref7], herzien.


