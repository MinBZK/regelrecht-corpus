  - number: 57a
    text: |-
      1 Het is instellingen die zendtijd hebben verkregen, uitsluitend toegestaan nevenactiviteiten te verrichten,
      indien:

      a. het verrichten van de nevenactiviteit geen nadelige invloed heeft of kan hebben op de uitvoering van de taak,
      bedoeld in [artikel 13c][ref1], met uitzondering van de activiteiten, bedoeld in [artikel 13c, derde lid][ref2];

      b. de nevenactiviteit verband houdt met of ten dienste staat van de taak, bedoeld in [artikel 13c][ref3], met
      uitzondering van de activiteiten, bedoeld in [artikel 13c, derde lid][ref4]; en

      c. het verrichten van de nevenactiviteit niet leidt of kan leiden tot concurrentievervalsing ten opzichte van
      andere aanbieders van dezelfde of vergelijkbare goederen of diensten.

      2 Bij algemene maatregel van bestuur kunnen aan het verrichten van nevenactiviteiten als bedoeld in het eerste lid
      nadere eisen worden gesteld.


