  - number: '83'
    text: |-
      Het Nederlands Omroepproduktie Bedrijf N.V. maakt de programma's van de instellingen die zendtijd hebben verkregen
      voor landelijke omroep, gereed voor uitzending en doet deze programma's uitzenden.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel83
  - number: '84'
    text: |-
      1 Het is het Bedrijf, na toestemming door Onze Minister, toegestaan de uitoefening van de taak, bedoeld in
      [artikel 83][ref1], geheel of ten dele te doen geschieden door een andere rechtspersoon, indien de desbetreffende
      rechtspersoon:

      a. is opgericht in overeenstemming met het recht van een der lidstaten van de Europese Unie;

      b. een geplaatst kapitaal heeft dat voor ten minste eenenvijftig procent wordt verschaft door het Bedrijf; en

      c. een rechtspersoon is waarin het Bedrijf de bevoegdheid heeft de meerderheid van de bestuurders te benoemen, te
      schorsen en te ontslaan.

      2 Onze Minister kan aan het verlenen van toestemming voorschriften verbinden.

      3 In geval van toepassing van het eerste lid, blijft het Bedrijf jegens Onze Minister verantwoordelijk. De
      rechtspersoon, bedoeld in het eerste lid, is jegens het Bedrijf verplicht tot naleving van de ingevolge deze wet op
      het Bedrijf rustende verplichtingen. Het Bedrijf geeft aan de rechtspersoon, bedoeld in het eerste lid, daartoe de
      nodige instructies, die deze gehouden is op te volgen.

      4 In geval van toepassing van het eerste lid, geldt het bij of krachtens de [artikelen 88 tot en met 95][ref2] en
      [artikel 173][ref3] bepaalde met betrekking tot het Bedrijf mede ten aanzien van de rechtspersoon, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel173
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '88'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '173'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '88'
    text: |-
      1 Het Bedrijf draagt er zorg voor dat de programma's die worden aangeboden door instellingen die zendtijd hebben
      verkregen voor landelijke omroep, worden uitgezonden.

      2 Indien zich een onverwachte gebeurtenis van nationaal of groot maatschappelijk belang of een onverwachte
      internationale gebeurtenis van bijzondere aard voordoet, stelt het Bedrijf op verzoek van de Stichting de
      faciliteiten ter beschikking die nodig zijn om de verslaglegging van die gebeurtenis door de Stichting mogelijk
      te maken.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel88
  - number: '89'
    text: |-
      1 Voor de uitvoering van de taak, bedoeld in [artikel 83][ref1], stelt Onze Minister gelden ter beschikking.

      2 Aan het ter beschikking stellen van gelden kunnen voorschriften worden verbonden. Onze Minister kan de
      beschikking tot het ter beschikking stellen van gelden intrekken of wijzigen, indien de aan de beschikking
      verbonden voorschriften niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: '90'
    text: |-
      Het Bedrijf brengt aan de instellingen die zendtijd hebben verkregen voor landelijke omroep, geen tarieven in
      rekening voor de activiteiten waarvoor Onze Minister met toepassing van [artikel 89][ref1] aan het Bedrijf gelden
      ter beschikking stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel89
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '89'
        hoofdstuk: VII
  - number: '92'
    text: |-
      Het Bedrijf voert voor de taak, bedoeld in [artikel 83][ref1], een boekhouding die inzicht geeft in de financiën
      die op die taak afzonderlijk betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: '93'
    text: |-
      De begroting en jaarrekening van het Bedrijf met betrekking tot de taak, bedoeld in [artikel 83][ref1], behoeven de
      instemming van Onze Minister. Deze hoort daaromtrent de Stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '83'
        hoofdstuk: VII
  - number: '94'
    text: |-
      Op vordering van de Staat heft de voorzieningenrechter in kort geding een beslag op bezittingen van het
      Bedrijf op voor zover het beslag de uitzending van programma’s in gevaar brengt en dit naar het oordeel van de
      voorzieningenrechter in strijd is met het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel94
  - number: '95'
    text: |-
      Indien het Bedrijf in strijd handelt met [artikel 83][ref1], is Onze Minister bevoegd tot toepassing van
      bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel83
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel95
