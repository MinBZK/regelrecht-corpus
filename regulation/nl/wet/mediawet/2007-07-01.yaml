preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Omroepwet, de Wet op de omroepbijdragen en de Wet
    Voorziening Perswezen 1951 te vervangen door een wet, die regels geeft over de omroepbijdragen, de verzorging van
    radio- en televisieprogramma's, de uitzending daarvan door middel van omroepzenders en draadomroepinrichtingen en
    de steunmaatregelen ten behoeve van persorganen, opdat de verscheidenheid in radio, televisie en pers gewaarborgd
    wordt en de samenhang in regelgeving ten aanzien van deze media tot uitdrukking wordt gebracht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. media: alle gedrukte en elektronische vormen van massacommunicatie;

      c. omroep: een elektronische mediadienst die betrekking heeft op het verzorgen en uitzenden van programma's;

      d. televisie-omroep: een elektronische mediadienst die betrekking heeft op het verzorgen en uitzenden van
      televisieprogramma's;

      e. radio-omroep: een elektronische mediadienst die betrekking heeft op het verzorgen en uitzenden van
      radioprogramma's;

      f. programma: een elektronisch product met beeld- of geluidsinhoud, dat bedoeld is te worden uitgezonden en bestemd
      is voor ontvangst door het algemene publiek of een deel daarvan, met uitzondering van datadiensten, diensten die
      uitsluitend op individueel verzoek beschikbaar zijn, en andere interactieve diensten;

      g. programma-onderdeel: een duidelijk afgebakend en als zodanig herkenbaar onderdeel van een programma;

      h. televisieprogramma: een programma met beeldinhoud, al dan niet mede met geluidsinhoud;

      i. teletekstprogramma: een televisieprogramma dat uitsluitend bestaat uit stilstaande beelden die door de kijker
      in een door hem bepaalde volgorde en op een door hem bepaald tijdstip kunnen worden geraadpleegd, en dat wordt
      uitgezonden op dezelfde frequentieruimte die, onderscheidenlijk op hetzelfde kanaal dat, tevens wordt gebruikt voor
      het uitzenden van een ander televisieprogramma of een toetsbeeld;

      j. radioprogramma: een programma met geluidsinhoud;

      k. programma voor algemene omroep: een programma dat bestemd is voor ontvangst door het algemene publiek;

      l. programma voor bijzondere omroep: een programma dat gecodeerd wordt uitgezonden en bestemd is voor ontvangst
      door een deel van het algemene publiek, bestaande uit diegenen die met de omroepinstelling die het programma
      verzorgt, een tot het ontvangst van het programma strekkende overeenkomst hebben gesloten;

      m. verzorgen van een programma: een omroepdienst, bestaande uit het voorbereiden, samenstellen en uitvoeren van
      een programma;

      n. uitzenden van een programma: een omroepdienst, bestaande uit het al dan niet gecodeerd verspreiden van een
      programma naar het algemene publiek of een deel daarvan door middel van een omroepzender of een omroepnetwerk;

      o. omroepzender: een radiozendapparaat als bedoeld in [artikel 1.1, onderdeel ii, van de Telecommunicatiewet][ref1],
      dat wordt gebruikt of mede gebruikt voor het uitzenden van programma's;

      p. aanbieder van een omroepzender: de natuurlijke persoon of rechtspersoon die uitzendcapaciteit door middel van
      een omroepzender ter beschikking stelt;

      q. omroepnetwerk: elektronisch communicatienetwerk als bedoeld in
      [artikel 1.1, onderdeel e, van de Telecommunicatiewet][ref2], dat wordt gebruikt om, hoofdzakelijk met gebruik van
      kabels, programma's te verspreiden;

      r. aanbieder van een omroepnetwerk: de natuurlijke persoon of rechtspersoon die uitzendcapaciteit door middel van
      een omroepnetwerk ter beschikking stelt;

      s. binnenlandse omroep: publieke omroep en commerciële omroep;

      t. publieke omroep: omroep door instellingen die zendtijd hebben verkregen en de Wereldomroep;

      u. landelijke omroep: publieke omroep, bestemd voor het algemene publiek in het gehele land;

      v. regionale omroep: publieke omroep, bestemd voor het algemene publiek in een provincie;

      w. lokale omroep: publieke omroep, bestemd voor het algemene publiek in een gemeente;

      x. commerciële omroep: omroep door commerciële omroepinstellingen;

      y. Programmastichting: de Nederlandse Programma Stichting, genoemd in [artikel 15][ref3];

      z. Stichting: de Nederlandse Omroep Stichting, genoemd in [artikel 16][ref4];

      aa. raad van bestuur: de raad van bestuur van de Stichting;

      bb. raad van toezicht: de raad van toezicht van de Stichting;

      cc. college van omroepen: het college van omroepen van de Stichting;

      dd. commerciële omroepinstelling: een natuurlijke persoon of rechtspersoon die een programma verzorgt, met
      uitzondering van de instellingen die zendtijd hebben verkregen, de Wereldomroep en overheidsinstellingen, en die
      voor de toepassing van deze wet onder de bevoegdheid van Nederland valt;

      ee. Wereldomroep: de Stichting Radio Nederland Wereldomroep, genoemd in [artikel 76][ref5];

      ff. Bedrijf: de naamloze vennootschap Nederlands Omroepproduktie Bedrijf N.V., genoemd in [artikel 83][ref6];

      gg. toetsbeeld: een stilstaand beeld dat dient om de ontvangst van televisieprogramma's te testen en dat wordt
      uitgezonden gedurende de tijd dat geen televisieprogramma wordt uitgezonden;

      hh. zendtijd: de tijd gedurende welke een instelling met toepassing van de [artikelen 39 tot en met 39i][ref7] of
      met toepassing van [artikel 42][ref8] in de gelegenheid wordt gesteld programma's voor landelijke, regionale of
      lokale omroep uit te doen zenden door middel van een omroepzender;

      ii. kanaal: als eenheid aanwezige transmissieruimte op een omroepnetwerk;

      jj. reclame-uiting: reclameboodschap, telewinkelboodschap of andere uiting die onmiskenbaar ten gevolge heeft
      dat het publiek wordt bewogen tot het kopen van een bepaald product of het gebruik maken van een bepaalde
      dienstverlening, dan wel gunstig wordt gestemd ten aanzien van een bepaald bedrijf, een bedrijfstak of een bepaalde
      instelling zodat de verkoop van producten of de afname van diensten wordt bevorderd;

      kk. reclameboodschap: boodschap, niet zijnde een telewinkelboodschap, waarmee onmiskenbaar wordt beoogd het publiek
      te bewegen tot het kopen van een bepaald product of het gebruik maken van een bepaalde dienstverlening, dan wel
      gunstig te stemmen ten aanzien van een bepaald bedrijf, een bedrijfstak of een bepaalde instelling teneinde de
      verkoop van producten of de afname van diensten te bevorderen;

      ll. sponsoren van een programma-onderdeel: het verstrekken van financiële of andere bijdragen door een
      overheidsbedrijf of particuliere onderneming die zich gewoonlijk niet bezighoudt met omroepactiviteiten of met
      de vervaardiging van audiovisuele producties, ten behoeve van de totstandkoming of aankoop van een programma-
      onderdeel, teneinde de uitzending daarvan als programma-onderdeel te bevorderen of mogelijk te maken;

      mm. sponsor: het overheidsbedrijf dat, of de particuliere onderneming die een programma-onderdeel sponsort;

      nn. sponsorbijdrage: de door een sponsor verstrekte bijdrage;

      oo. faciliteiten: het geheel van personele en materiële middelen ten behoeve van de realisering van programma's;

      pp. evenement: een tevoren georganiseerde publieke gebeurtenis op het terrein van sport en cultuur;

      qq. sportwedstrijd: een wedstrijd of de voorbereiding op een wedstrijd, georganiseerd door of onder auspiciën van
      de door het NOC*NSF erkende nationale sportorganisaties en hun geledingen, of door vergelijkbare internationale,
      al dan niet overkoepelende sportorganisaties, dan wel een andere wedstrijd of de voorbereiding op een wedstrijd van
      een sport die door het NOC*NSF als sport is aangemerkt;

      rr. politieke partij: een politieke partij als bedoeld in
      [artikel 1, onderdeel b, van de Wet subsidiëring politieke partijen][ref9];

      ss. uitgever van een persorgaan: een rechtspersoon die een persorgaan uitgeeft;

      tt. dagbladmarkt: de door het Stimuleringsfonds voor de pers vastgestelde gemiddelde betaalde oplage, in een
      kalenderjaar, van persorganen die bestemd zijn voor het publiek in Nederland en ten minste zes keer per week
      verschijnen;

      uu. nieuwsbladmarkt: de door het Stimuleringsfonds voor de pers vastgestelde gemiddelde betaalde oplage, in een
      kalenderjaar, van persorganen die bestemd zijn voor het publiek in Nederland en ten minste één keer en maximaal
      vijf keer per week verschijnen;

      vv. groep: een groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref10];

      ww. Europese richtlijn: [richtlijn nr. 89/552/EEG](31989L0552) van de Raad van de Europese Gemeenschappen van 3
      oktober 1989 betreffende de coördinatie van bepaalde wettelijke en bestuursrechtelijke bepalingen in de lid-staten
      inzake de uitoefening van televisie-omroepactiviteiten (PbEG L 298);

      xx. telewinkelboodschap: boodschap in een televisieprogramma die bestaat uit een rechtstreekse aanbieding aan het
      publiek met het oog op de levering tegen betaling van producten of diensten;

      yy. een open net: een televisieprogrammanet, waarop televisieprogramma's voor algemene omroep worden uitgezonden,
      met een bereik van ten minste 75% van alle huishoudens in Nederland, waarvoor geen andere kosten verschuldigd zijn
      dan:

        - het tarief dat een aanbieder van een omroepnetwerk aan de aangeslotenen op het omroepnetwerk in rekening brengt
      voor de ontvangst van een door de aanbieder met inachtneming van [artikel 82i][ref11] vast te stellen aantal
      programma's; of
        - de kosten van aankoop of gebruik van technische voorzieningen die de ontvangst van televisieprogramma's mogelijk
      maken;

      zz. netredactie: de netredactie van een televisie- of radioprogrammanet, bedoeld in [artikel 40d][ref12].


