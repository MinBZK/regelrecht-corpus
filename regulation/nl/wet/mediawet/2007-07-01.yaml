  - number: '21'
    text: |-
      1 Onverminderd [artikel 48][ref1], zijn de volgende besluiten van de raad van bestuur bindend voor de instellingen
      die zendtijd hebben verkregen voor landelijke omroep, voor zover deze besluiten hen aangaan:

      a. de besluiten omtrent het indelen van de zendtijd van de instellingen die zendtijd hebben verkregen voor
      landelijke omroep;

      b. de besluiten omtrent de bekostiging van de instellingen die zendtijd hebben verkregen voor landelijke omroep;

      c. de besluiten omtrent vaststelling van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref2];

      d. de besluiten omtrent de coördinatie, op en tussen de verschillende programmanetten, van de programma-onderdelen
      van de instellingen die zendtijd hebben verkregen voor landelijke omroep;

      e. de besluiten omtrent vaststelling van een nadere regeling als bedoeld in
      [artikel 19a, eerste lid, onderdeel h][ref3];

      f. de besluiten omtrent de toepassing van [artikel 22][ref4];

      g. de besluiten ter uitvoering van de taken, bedoeld in de [artikelen 40, vijfde en zevende lid][ref5],
      [50, negende lid][ref6], [51, tweede lid][ref7], [54, zevende lid][ref8], en [54a, vierde lid,][ref9] voor zover
      niet reeds vallend onder de besluiten, bedoeld in de onderdelen a tot en met e.

      2 De raad van bestuur ziet erop toe dat de besluiten, bedoeld in het eerste lid, worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel48
