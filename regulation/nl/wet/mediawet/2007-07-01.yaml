  - number: 71a
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de [Telecommunicatiewet][ref1], is het een commerciële
      omroepinstelling slechts toegestaan een door haar verzorgd programma uit te zenden of te doen uitzenden, indien zij
      daarvoor toestemming van het Commissariaat voor de Media heeft verkregen. De toestemming is voor ieder programma
      afzonderlijk vereist. In de toestemming wordt aangegeven of zij betrekking heeft op een programma voor algemene
      omroep dan wel op een programma voor bijzondere omroep.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop aanvragen tot het
      verlenen van toestemming worden ingediend en de termijn waarbinnen beslissingen daarop worden genomen.

      3 Indien toestemming is verleend voor het uitzenden of doen uitzenden van een televisieprogramma, is het de
      commerciële omroepinstelling tevens toegestaan:

      a. een toetsbeeld uit te zenden of te doen uitzenden;

      b. een teletekstprogramma uit te zenden of te doen uitzenden, indien dat op dezelfde frequentieruimte of hetzelfde
      kanaal tegelijkertijd met het in de aanhef bedoelde televisieprogramma of met het toetsbeeld wordt uitgezonden.

      4 De toestemming wordt verleend voor de duur van vijf jaren.

      5 De toestemming is niet overdraagbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 71b
    text: |-
      De toestemming kan uitsluitend worden geweigerd, indien:

      a. de door de commerciële omroepinstelling verstrekte gegevens onjuist of onvolledig zijn; of

      b. redelijkerwijs te verwachten is dat de commerciële omroepinstelling de bij of krachtens deze wet gestelde
      verplichtingen niet in acht zal nemen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71b
  - number: 71c
    text: |-
      1 Het Commissariaat voor de Media trekt de toestemming in, indien:

      a. de commerciële omroepinstelling het Commissariaat daarom verzoekt; of

      b. de commerciële omroepinstelling in gebreke blijft met de betaling van hetgeen krachtens [artikel 71u][ref1]
      verschuldigd is.

      2 Het Commissariaat kan de toestemming intrekken, indien:

      a. de door de commerciële omroepinstelling verstrekte gegevens onjuist blijken te zijn; of

      b. de commerciële omroepinstelling overigens niet voldoet aan de verplichtingen gesteld bij of krachtens deze wet
      of [artikel 5:20 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71u
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel71c
