  - number: '41'
    text: |-
      1 De raad van bestuur deelt jaarlijks, de zendtijd voor landelijke omroep in.

      2 De raad van bestuur kan, voor zover nodig, de zendtijdindeling herzien, indien:

      a. met toepassing van [artikel 36b][ref1] of [artikel 38][ref2] een erkenning, onderscheidenlijk een voorlopige
      erkenning, wordt ingetrokken;

      b. met toepassing van een van de [artikelen 45 tot en met 47][ref3] de aan een instelling toegewezen zendtijd voor
      landelijke omroep wordt ingetrokken of verminderd; of

      c. tussentijds door het Commissariaat voor de Media aan een instelling zendtijd voor landelijke omroep wordt
      toegewezen.

      3 De raad van bestuur kan voorts de zendtijdindeling herzien, voor zover hij dat nodig acht:

      a. in het kader van de coördinatie, op en tussen de verschillende programmanetten, van de programma-onderdelen van
      de instellingen die zendtijd hebben verkregen voor landelijke omroep; of

      b. op grond van omstandigheden die niet voorzien waren ten tijde van de zendtijdindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel45
