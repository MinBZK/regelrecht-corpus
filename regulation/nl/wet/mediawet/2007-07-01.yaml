  - number: 51b
    text: |-
      1 De Programmastichting gebruikt haar zendtijd geheel voor een programma dat bestaat uit onderdelen die voorzien in
      de bevrediging van in het volk levende maatschappelijke, culturele, godsdienstige of geestelijke behoeften, zodanig
      dat dit programma te zamen met de programma’s van de andere instellingen die zendtijd voor landelijke omroep
      hebben verkregen, een evenwichtig beeld oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke
      verscheidenheid in Nederland.

      2 Bij algemene maatregel van bestuur wordt bepaald welke programma-onderdelen als bedoeld in het eerste lid in
      het programma van de Programmastichting worden opgenomen. Bij deze algemene maatregel van bestuur kan tevens
      worden bepaald welke percentages van het programma van de Programmastichting ten minste dienen te bestaan uit de
      onderscheidene programma-onderdelen, bedoeld in de vorige zin.

      3 Naast de programma-onderdelen, bedoeld in het tweede lid, bevat het programma van de Programmastichting ten
      minste veertig procent onderdelen van culturele aard, waarvan een deel dat ten minste gelijk is aan twintig procent
      van de gebruikte zendtijd van de Programmastichting, bestaat uit of betrekking heeft op kunst.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel51b
  - number: 51c
    text: |-
      De verplichtingen, bedoeld in de [artikelen 50, eerste en tweede lid][ref1], en [51][ref2], gelden met betrekking
      tot televisie zowel voor de gehele zendtijd die is gebruikt, als afzonderlijk voor de zendtijd die is gebruikt
      tussen 16.00 uur en 24.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51b
