  - number: 82h
    text: |-
      Het is de aanbieder van een omroepnetwerk toegestaan:

      a. programma’s van derden uit te zenden, indien de persoon of instelling die verantwoordelijk is voor vorm en
      inhoud van het programma, krachtens deze wet of krachtens de op die persoon of instelling van toepassing zijnde
      buitenlandse regelgeving gerechtigd is een voor uitzending bestemd programma te verzorgen;

      b. programma's uit te zenden die door de aanbieder zelf worden verzorgd, indien deze krachtens
      [artikel 71a, eerste lid][ref1], toestemming heeft verkregen een programma uit te zenden of te doen uitzenden;

      c. programma’s uit te zenden die bestaan uit een onverkorte en rechtstreekse weergave van het verhandelde in
      een openbare vergadering van de Eerste of Tweede Kamer der Staten-Generaal, van Provinciale Staten of van een
      gemeenteraad;

      d. toetsbeelden en informatie met betrekking tot de door middel van het omroepnetwerk aangeboden programma’s en
      diensten uit te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82h
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 82i
    text: |-
      1 De aanbieder van een omroepnetwerk zendt onverkort, ongewijzigd en gelijktijdig met de oorspronkelijke uitzending
      naar alle aangeslotenen op het omroepnetwerk ten minste vijftien televisieprogramma's voor algemene omroep en ten
      minste vijfentwintig radioprogramma's voor algemene omroep uit, waaronder in ieder geval:

      a. de televisie- en radioprogramma's waarvoor zendtijd is verkregen voor landelijke omroep en die worden
      uitgezonden op de televisie- en radioprogrammanetten, bedoeld in [artikel 40, eerste en derde lid][ref1];

      b. het televisie- en radioprogramma, bedoeld in de [artikelen 30, onderdeel b][ref2], en [51e][ref3],
      waarvoor zendtijd is verkregen voor regionale omroep dan wel waarvoor toestemming is verkregen als bedoeld in
      [artikel 67, eerste lid][ref4], bestemd voor de provincie of deel van de provincie waarbinnen het omroepnetwerk
      zich bevindt;

      c. het televisie- en radioprogramma, bedoeld in de [artikelen 30, onderdeel b][ref5], en [51f][ref6],
      waarvoor zendtijd is verkregen voor lokale omroep, dan wel waarvoor toestemming is verkregen als bedoeld in
      [artikel 66, eerste lid][ref7], bestemd voor de gemeente waarbinnen het omroepnetwerk zich bevindt;

      d. twee televisieprogramma's en twee radioprogramma's van de Nederlandstalige landelijke Belgische omroepdienst.

      2 Voor zover een instelling die zendtijd heeft verkregen voor lokale omroep andere programma's voor
      algemene omroep dan bedoeld in het eerste lid, onderdeel c, verzorgt, die gericht zijn op specifieke
      bevolkings- en leeftijdsgroepen waaronder minderheden, zendt de aanbieder van een omroepnetwerk deze
      onverkort, ongewijzigd en gelijktijdig met de oorspronkelijke uitzending uit naar alle aangeslotenen op
      het omroepnetwerk, met dien verstande dat deze verplichting geldt voor uitzendingen op ten hoogste twee
      kanalen voor televisie en vijf kanalen voor radio. Op de volgens de vorige volzin doorgegeven programma's is
      [artikel 51f, eerste lid, aanhef en onderdeel a][ref8], van overeenkomstige toepassing.

      3 Indien op eenzelfde kanaal van een omroepnetwerk niet gelijktijdig verschillende programma's voor algemene omroep
      worden uitgezonden, worden deze programma's voor de toepassing van het eerste lid als één programma aangemerkt.

      4 Het is de aanbieder van een omroepnetwerk toegestaan naar een aangeslotene op het omroepnetwerk, op diens
      verzoek, minder dan vijftien televisieprogramma's voor algemene omroep en minder dan vijfentwintig radioprogramma's
      voor algemene omroep uit te zenden, mits ten minste de programma's genoemd in het eerste lid, onder a tot en met d,
      worden uitgezonden, en mits aan de desbetreffende aangeslotene een tarief in rekening wordt gebracht dat evenredig
      lager is dan het tarief dat in rekening wordt gebracht voor de ontvangst van het met inachtneming van het eerste
      lid uitgezonden aantal programma's. Het derde lid is daarbij van overeenkomstige toepassing.

      5 Het Commissariaat voor de Media kan een aanbieder van een omroepnetwerk desgevraagd geheel of gedeeltelijk
      ontheffing verlenen van de verplichtingen, bedoeld in het eerste en tweede lid, indien de kosten voor het onverkort
      nakomen van deze verplichtingen niet opwegen tegen het belang dat de aangeslotenen op het omroepnetwerk verzekerd
      zijn van de ontvangst van de programma's, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51e
