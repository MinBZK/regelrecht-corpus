  - number: 51e
    text: |-
      Een regionale omroepinstelling gebruikt haar zendtijd voor een programma dat:

      a. voor ten minste vijftig procent bestaat uit onderdelen van informatieve, culturele en educatieve aard, die in
      het bijzonder betrekking hebben op de provincie waarvoor het programma bestemd is; en

      b. voor ten minste een bij algemene maatregel van bestuur vast te stellen percentage bestaat uit onderdelen die
      door haarzelf of uitsluitend in haar opdracht zijn geproduceerd.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel51e
  - number: 51f
    text: |-
      1 Een lokale omroepinstelling gebruikt haar zendtijd voor een programma dat:

      a. voor ten minste vijftig procent bestaat uit onderdelen van informatieve, culturele en educatieve aard, die in
      het bijzonder betrekking hebben op de gemeente waarvoor het programma bestemd is; en

      b. voor ten minste een bij algemene maatregel van bestuur vast te stellen percentage bestaat uit onderdelen die
      door haarzelf of uitsluitend in haar opdracht zijn geproduceerd.

      2 Het is een lokale omroepinstelling toegestaan met de regionale omroepinstelling in wier verzorgingsgebied zij
      werkzaam is, een overeenkomst te sluiten met het oog op de samenwerking bij de verzorging van haar radioprogramma,
      onderscheidenlijk televisieprogramma. Daarbij kan worden overeengekomen dat de regionale omroepinstelling
      programma-onderdelen produceert ten behoeve van de lokale omroepinstelling. Tevens kan worden overeengekomen dat de
      lokale omroepinstelling programma-onderdelen produceert ten behoeve van de regionale omroepinstelling.

      3 Een overeenkomst als bedoeld in het tweede lid wordt overgelegd aan het Commissariaat voor de Media.

      4 In afwijking van het eerste lid is het een lokale omroepinstelling die een overeenkomst als bedoeld in het tweede
      lid heeft gesloten en deze aan het Commissariaat heeft overgelegd, toegestaan haar zendtijd te gebruiken voor een
      radioprogramma, onderscheidenlijk televisieprogramma, dat:

      a. voor ten minste vijftig procent bestaat uit onderdelen van informatieve, culturele en educatieve aard, die in
      het bijzonder betrekking hebben op de gemeente waarvoor het programma bestemd is, of op de provincie waarbinnen
      die gemeente gelegen is, met dien verstande dat ten minste een bij algemene maatregel van bestuur vast te stellen
      gedeelte daarvan in het bijzonder betrekking heeft op de gemeente waarvoor het programma bestemd is; en

      b. voor ten minste het percentage, bedoeld in het eerste lid, onderdeel *b*, bestaat uit onderdelen die door
      haarzelf of door de regionale omroepinstelling waarmee zij de overeenkomst heeft gesloten, dan wel uitsluitend in
      opdracht van een van hen of van hen beiden, zijn geproduceerd, met dien verstande dat ten minste een bij algemene
      maatregel van bestuur vast te stellen gedeelte daarvan door de lokale omroepinstelling zelf of uitsluitend in haar
      opdracht is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel51f
  - number: '52'
    text: |-
      1 De programma’s van instellingen die zendtijd hebben verkregen bevatten geen reclameboodschappen en
      telewinkelboodschappen tenzij zulks bij deze wet uitdrukkelijk wordt toegestaan.

      2 De programma’s als bedoeld in het eerste lid bevatten voorts geen andere reclame-uitingen tenzij dit niet
      vermijdbaar is. Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een reclame-uiting in een
      programma niet vermijdbaar kan worden geacht, alsmede wanneer het is toegestaan dat programma’s reclame-uitingen
      bevatten.

      3 Onze Minister kan in bijzondere gevallen ontheffing verlenen van het bepaalde in de eerste volzin van het tweede
      lid. Hij kan deze bevoegdheid delegeren aan het Commissariaat voor de Media.

      4 Behoudens toestemming van het Commissariaat bevatten programma’s van instellingen die zendtijd hebben verkregen
      geen oproepen in het kader van ledenwerving, verenigingsactiviteiten of nevenactiviteiten.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel52
  - number: 52a
    text: |-
      1 Programma-onderdelen van instellingen die zendtijd hebben verkregen worden niet gesponsord.

      2 Het eerste lid is niet van toepassing op:

      a. programma-onderdelen van culturele aard;

      b. programma-onderdelen, bestaande uit het verslag of de weergave van een of meer sportevenementen of
      sportwedstrijden;

      c. programma-onderdelen bestaande uit het verslag of de weergave van evenementen ten behoeve van ideële doeleinden.

      3 Programma-onderdelen als bedoeld in het tweede lid worden niet gesponsord indien:

      a. deze geheel of gedeeltelijk bestaan uit nieuws, actualiteiten of politieke informatie; of

      b. in het bijzonder zijn bestemd voor minderjarigen beneden de leeftijd van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel52a
  - number: 52b
    text: |-
      1 In afwijking van de eerste volzin van [artikel 52, tweede lid][ref1], worden aan het begin of aan het einde van
      een gesponsord programma-onderdeel van een instelling die zendtijd heeft verkregen, ter informatie van het publiek
      alle sponsors vermeld.

      2 Met betrekking tot een gesponsord programma-onderdeel voor televisie duurt de vermelding van de sponsors
      in totaal ten hoogste vijf seconden. De vermelding gebeurt door middel van naam of (beeld)merk. Voor zover
      de vermelding niet plaatsvindt op de aan- of aftitelrol, bestaat zij uitsluitend uit stilstaande beelden. De
      vermelding is niet beeldvullend en is voorts zodanig vormgegeven dat zij niet voldoet aan de definitie van
      reclameboodschap, bedoeld in [artikel 1, onderdeel kk][ref2].

      3 In een gesponsord programma-onderdeel worden geen produkten of diensten van een sponsor getoond of vermeld,
      indien deze een sponsorbijdrage in geld heeft verstrekt.

      4 Het eerste tot en met derde lid zijn van overeenkomstige toepassing op een programma-onderdeel waarvoor een
      overheidsinstelling of een andere instelling dan bedoeld in [artikel 1, onderdeel ll][ref3], een financiële of
      andere bijdrage heeft verstrekt ten behoeve van de totstandkoming of aankoop van dat programma-onderdeel, teneinde
      de uitzending daarvan als programma-onderdeel te bevorderen of mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel52b
