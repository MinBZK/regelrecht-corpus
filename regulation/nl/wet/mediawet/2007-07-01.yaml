  - number: '100'
    text: |-
      Het Commissariaat voor de Media zendt voor 1 november zijn opmerkingen met betrekking tot de begroting, bedoeld in
      [artikel 99][ref1], aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel100
