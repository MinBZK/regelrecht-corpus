  - number: 28a
    text: |-
      1 De Stichting Etherreclame doet jaarlijks voor 1 augustus aan Onze Minister een opgave toekomen van de inkomsten
      die zij naar verwachting in het volgende kalenderjaar zal verwerven. Zij doet bovendien jaarlijks voor 1 september
      aan Onze Minister een opgave toekomen van de inkomsten die zij naar verwachting in het lopende kalenderjaar zal
      verwerven.

      2 Onze Minister zendt zo spoedig mogelijk een afschrift van deze opgaven ter kennisneming aan het Commissariaat
      voor de Media, de Stichting en de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel28a
  - number: '29'
    text: |-
      1 Wijzigingen in de statuten van de Stichting Etherreclame behoeven de instemming van Onze Minister.

      2 Het bestuur van de Stichting Etherreclame kan niet besluiten tot ontbinding van de stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel29
  - number: '30'
    text: |-
      Een lokale, onderscheidenlijk regionale omroepinstelling, is een instelling die voldoet aan de volgende eisen:

      a. zij is rechtspersoon met volledige rechtsbevoegdheid;

      b. zij stelt zich blijkens haar statuten uitsluitend, althans hoofdzakelijk ten doel, ter uitvoering van de
      taak van de publieke omroep, bedoeld in [artikel 13c][ref1], op lokaal, onderscheidenlijk regionaal niveau
      een programma voor algemene omroep te verzorgen en alle activiteiten met betrekking tot programmaverzorging en
      uitzending te verrichten die daartoe nodig zijn. Het programma is in zodanige mate gericht op de bevrediging
      van de in de gemeente of provincie, of een deel van de provincie waarop de omroepinstelling zich richt, levende
      maatschappelijke, culturele, godsdienstige en geestelijke behoeften, dat de instelling geacht kan worden van
      algemeen nut te zijn; en.

      c. zij heeft op grond van de statuten een orgaan dat het programmabeleid bepaalt. Dit orgaan heeft een
      zodanige samenstelling dat het representatief is voor de belangrijkste in de gemeente of provincie voorkomende
      maatschappelijke, culturele, godsdienstige en geestelijke stromingen. De leden van dit orgaan worden op voordracht
      van de omroep benoemd door het College van Burgemeester en Wethouders, respectievelijk Gedeputeerde Staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 30a
    text: |-
      1 Ten behoeve van de verwezenlijking van de in
      [artikel 13c, eerste lid, onderdelen a en b, en tweede en derde lid][ref1], bedoelde taak van de publieke omroep op
      landelijk niveau wordt aan de Stichting een concessie voor landelijke omroep verleend.

      2 De concessie wordt op voordracht van Onze Minister bij koninklijk besluit telkens verleend voor een periode van
      10 jaar en treedt in werking met ingang van een in het koninklijk besluit te bepalen tijdstip.

      3 Indien de Stichting zijn uit de wet voortvloeiende taak ernstig verwaarloost, kunnen, gehoord de Stichting, bij
      algemene maatregel van bestuur voorzieningen worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
        hoofdstuk: III
  - number: 30b
    text: |-
      1 Ten behoeve van de concessieverlening doet de Stichting een concessiebeleidsplan voor de landelijke omroep
      toekomen aan het Commissariaat voor de Media. Het Commissariaat zendt het concessiebeleidsplan met zijn opmerkingen
      binnen acht weken aan Onze Minister.

      2 In het concessiebeleidsplan is in elk geval opgenomen:

      a. de wijze waarop met inachtneming van het bepaalde bij of krachtens deze wet gedurende de concessieperiode
      door de instellingen die zendtijd hebben verkregen voor landelijke omroep gezamenlijk en individueel invulling
      wordt gegeven aan de taakopdracht van de landelijke omroep, tevens uitgewerkt in kwantitatieve en kwalitatieve
      doelstellingen die betrekking hebben op het programma-aanbod en het publieksbereik van de landelijke publieke
      omroep;

      b. een overzicht van de daartoe naar verwachting benodigde organisatorische, personele, materiële en financiële
      middelen; en

      c. de wijze van samenwerking met de Wereldomroep.

      3 Gedurende de concessieperiode doet de Stichting voor het verstrijken van een periode van vijf jaren een
      tussentijds concessiebeleidsplan voor de komende vijf jaren toekomen aan het Commissariaat voor de Media. Het
      Commissariaat zendt het tussentijds concessiebeleidsplan met zijn opmerkingen binnen acht weken aan Onze Minister.

      4 Het concessiebeleidsplan en het tussentijds concessiebeleidsplan worden door de raad van bestuur opgesteld na
      overleg met de instellingen die zendtijd hebben verkregen voor landelijke omroep en voorzover het de samenwerking
      met de Wereldomroep betreft, de Wereldomroep.

      5 Over het concessiebeleidsplan en het tussentijds concessiebeleidsplan vraagt Onze Minister advies aan de Raad
      voor cultuur.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het tijdstip waarop het
      concessiebeleidsplan en het tussentijds concessiebeleidsplan moeten worden ingediend.

      7 Mede op basis van het concessiebeleidsplan en het tussentijds concessiebeleidsplan worden de doelstellingen
      met betrekking tot het programma-aanbod en het publieksbereik van de landelijke omroep vastgelegd in een
      prestatieovereenkomst tussen Onze Minister en de Stichting. De duur van de prestatieovereenkomst is gelijk aan de
      periode waarvoor de erkenningen en voorlopige erkenningen, bedoeld in de [artikelen 31][ref1] en [37][ref2], zijn
      verleend.

      8 De prestatieovereenkomst regelt voorts de maatregelen bij niet naleving van de uit de overeenkomst voortvloeiende
      verplichtingen en bevat een procedure die voorziet in tussentijdse wijziging indien veranderde inzichten of
      omstandigheden dat gewenst maken.

      9 De in het zevende lid bedoelde prestatieovereenkomst heeft geen betrekking op de inhoud van programma's of
      programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel37
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '37'
        hoofdstuk: III
        paragraaf: '3'
  - number: 30c
    text: |-
      1 Gedurende de concessieperiode draagt de Stichting zorg voor een regelmatige beoordeling van de wijze waarop
      door de Stichting en de overige instellingen die zendtijd hebben verkregen voor landelijke omroep uitvoering wordt
      gegeven aan de taakopdracht van de landelijke omroep. Een beoordeling als bedoeld in de vorige volzin vindt in elk
      geval plaats telkens voor afloop van een periode van vijf jaar.

      2 Ter uitvoering van het eerste lid stelt de Stichting telkens een commissie in, die bestaat uit ten minste vijf
      onafhankelijke deskundigen. Bij de samenstelling van de commissie draagt de Stichting er zorg voor dat deze zoveel
      mogelijk representatief is voor het kijk- en luisterpubliek.

      3 De leden van de commissie worden op voordracht van de raad van bestuur en gehoord Onze Minister benoemd door de
      raad van toezicht. Een commissie wordt ingesteld en de leden worden benoemd voor de duur van de werkzaamheden van
      de commissie.

      4 Een commissie als bedoeld in het tweede lid heeft tot taak de wijze waarop uitvoering is gegeven aan de
      taakopdracht van de landelijke omroep te beoordelen. Daartoe rapporteert de commissie in elk geval over:

      a. de wijze waarop de Stichting en de overige instellingen die zendtijd hebben verkregen voor landelijke omroep
      gezamenlijk via het programma-aanbod invulling hebben gegeven aan de taakopdracht van de landelijke omroep;

      b. de wijze waarop de afzonderlijke instellingen die zendtijd hebben verkregen voor landelijke omroep hebben
      bijgedragen aan de verwezenlijking van de taakopdracht van de landelijke omroep;

      c. de mate waarin met het programma-aanbod is voldaan aan de interesses en inzichten van het algemene publiek,
      alsmede van specifieke bevolkings- en leeftijdsgroepen;

      d. andere onderwerpen die zijn opgenomen in het besluit tot instelling of die door Onze Minister zijn aangegeven.

      5 De commissie kan aanbevelingen doen voor de volgende periode van vijf jaar omtrent de taakopdracht en
      doelstellingen van de landelijke omroep en de wijze waarop daaraan uitvoering kan worden gegeven.

      6 De commissie brengt van zijn werkzaamheden en bevindingen voor 1 mei van het jaar voorafgaande aan het
      jaar waarin de periode waarvoor de concessie, bedoeld in [artikel 30a][ref1] en de erkenningen, bedoeld in
      [artikel 31][ref2], zijn verleend eindigt, een rapport uit en zendt dit aan de raad van toezicht.

      7 De raad van toezicht maakt het rapport openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel30c
