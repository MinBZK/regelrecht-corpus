  - number: '161'
    text: |-
      1 Het is de Kerkeraad van de Gereformeerde Kerk van Bloemendaal toegestaan een radioprogramma voor algemene omroep
      te verzorgen dat bestaat uit de weergave van kerkdiensten van de Gereformeerde Kerk te Bloemendaal. De uitzendingen
      zijn bestemd voor inwoners van de gemeente Bloemendaal.

      2 Het is de Generale Synode der Gereformeerde Kerken toegestaan een radioprogramma voor algemene omroep te
      verzorgen dat bestaat uit de weergave van kerkdiensten van de Gereformeerde Kerk te Apeldoorn. De uitzendingen zijn
      bestemd voor inwoners van de gemeente Apeldoorn.

      3 Met betrekking tot het in dit artikel bepaalde kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gesteld, daaronder begrepen de mogelijkheid tot intrekking van de in dit artikel gegeven toestemmingen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel161
  - number: '166'
    text: |-
      1 Het Commissariaat voor de Media kan eenmaal voor een periode van drie jaren zendtijd voor televisie
      toewijzen aan de Stichting ten behoeve van een programma dat bestaat uit een samenstel van ten minste zeven
      verschillende regionale programma-edities die tegelijkertijd op een van de televisieprogrammanetten, genoemd in
      [artikel 40][ref1], worden uitgezonden.

      2 De zendtijd, bedoeld in het eerste lid, wordt slechts verleend, indien:

      a. de Stichting en de gezamenlijke regionale omroepinstellingen die zendtijd hebben verkregen, overeenstemming
      hebben bereikt zowel over de dagen en uren waarop het programma zal worden uitgezonden, als over de inhoud van de
      verschillende regionale programma-edities;

      b. de Stichting en de gezamenlijke regionale omroepinstellingen die zendtijd hebben verkregen, overeenstemming
      hebben bereikt over de verdeling van de inkomsten uit de reclameboodschappen en telewinkelboodschappen in en
      aansluitend op de verschillende regionale programma-edities; en

      c. de verschillende regionale programma-edities worden geproduceerd door de regionale omroepinstellingen.

      3 Voor de toepassing van deze wet wordt het programma, bedoeld in het eerste lid, aangemerkt als een programma
      voor landelijke omroep, onderscheidenlijk een programma van een instelling die zendtijd heeft verkregen voor
      landelijke omroep, met dien verstande dat op de verschillende programma-edities niet [artikel 51d][ref2], maar
      [artikel 51e][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51d
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51e
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel166
    references:
      - id: ref1
