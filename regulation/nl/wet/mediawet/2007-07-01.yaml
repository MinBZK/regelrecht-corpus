  - number: '77'
    text: |-
      1 Wijzigingen in de statuten van de Wereldomroep behoeven de instemming van Onze Minister.

      2 Het bestuur van de Wereldomroep kan niet besluiten tot ontbinding van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel77
  - number: '78'
    text: |-
      De leden van het bestuur van de Wereldomroep worden door Onze Minister benoemd, geschorst en ontslagen. Onze
      Minister wijst uit de leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel78
  - number: '79'
    text: |-
      Het bestuur van de Wereldomroep is voor zijn beleid verantwoording schuldig aan Onze Minister. Het bestuur maakt
      jaarlijks een verslag van de werkzaamheden van de Wereldomroep openbaar.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel79
  - number: '81'
    text: |-
      1 Er is een programmaraad die het bestuur van de Wereldomroep van advies dient over de inhoud van de programma's.

      2 Onze Minister benoemt, schorst en ontslaat de leden van de programmaraad. De leden worden benoemd voor een
      periode van vijf jaren. Herbenoeming voor een aansluitende periode is éénmaal mogelijk.

      3 Het huishoudelijk reglement van de programmaraad behoeft de instemming van het bestuur van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel81
  - number: '82'
    text: |-
      1 De Stichting en de Wereldomroep roepen een commissie van overleg in het leven ter behartiging van aangelegenheden
      die van gemeenschappelijk belang zijn.

      2 De commissie pleegt onder meer overleg over:

      a. het wederzijds tegen betaling van vergoeding ter beschikking stellen van daarvoor in aanmerking komende
      omroepfaciliteiten, organen, diensten, alsmede van het hierbij werkzame personeel, en hulpmiddelen;

      b. buitenlandse aangelegenheden, die voor de instellingen die zendtijd hebben verkregen en de Wereldomroep als
      geheel van belang zijn; en

      c. de wijze waarop de Stichting en de Wereldomroep samenwerken met het oog op de uitvoering van hun taken,
      alsmede het opstellen van het concessiebeleidsplan, bedoeld in [artikel 30b, eerste lid][ref1], de tussentijdse
      concessiebeleidsplannen, bedoeld in [artikel 30b, derde lid][ref2], de begroting, bedoeld in [artikel 98b][ref3],
      en de begrotingen, bedoeld in de [artikelen 99][ref4] en [108][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel98b
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel108
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82
