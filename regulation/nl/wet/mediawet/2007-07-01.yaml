  - number: 82a
    text: |-
      1 Het is de aanbieder van een omroepzender toegestaan:

      a. programma’s van derden uit te zenden, indien de persoon of instelling die verantwoordelijk is voor vorm en
      inhoud van het programma, krachtens deze wet of krachtens de op die persoon of instelling van toepassing zijnde
      buitenlandse regelgeving gerechtigd is een voor uitzending bestemd programma te verzorgen;

      b. programma's uit te zenden die door de aanbieder zelf worden verzorgd, indien deze een instelling is die zendtijd
      heeft verkregen, of krachtens [artikel 71a, eerste lid][ref1], toestemming heeft verkregen een programma uit te
      zenden of te doen uitzenden;

      c. programma’s uit te zenden die bestaan uit een onverkorte en rechtstreekse weergave van het verhandelde in
      een openbare vergadering van de Eerste of Tweede Kamer der Staten-Generaal, van Provinciale Staten of van een
      gemeenteraad;

      d. toetsbeelden en informatie met betrekking tot de door middel van de omroepzender aangeboden programma’s en
      diensten uit te zenden.

      2 Het uitzenden van een programma door middel van een omroepzender wordt steeds als een oorspronkelijke uitzending
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 82c
    text: |-
      1 Het Commissariaat voor de Media kan aan natuurlijke of rechtspersonen toestemming verlenen door middel van een
      omroepzender een programma voor een bijzonder doel uit te zenden dat een beperkt bereik heeft of van beperkte duur
      is.

      2 Bij algemene maatregel van bestuur kunnen de begrippen bijzonder doel, beperkt bereik en beperkte duur, bedoeld
      in het eerste lid, nader omschreven worden.

      3 Het Commissariaat kan aan het verlenen van toestemming als bedoeld in het eerste lid voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82c
  - number: 82e
    text: |-
      1 Onze Minister, handelend in overeenstemming met het gevoelen van de ministerraad, wijst de frequentieruimte
      in de FM-band aan die wordt gebruikt voor het uitzenden van een radioprogramma dat overwegend bestaat uit
      Nederlandstalige muziek. Bij ministeriële regeling wordt nader omschreven in welke gevallen een radioprogramma aan
      deze eis voldoet.

      2 Onze Minister wijst, handelend in overeenstemming met het gevoelen van de ministerraad, andere frequentieruimte
      in de FM-band aan die slechts mag worden gebruikt voor het uitzenden van bij die aanwijzing vast te stellen
      categorieën radioprogramma’s die, gelet op hun aard, inhoud of doelgroep, verhoudingsgewijs lage inkomsten uit
      reclame of verhoudigingsgewijs hoge kosten meebrengen.

      3 Indien aard en omvang van de frequentieruimte in de FM-band die beschikbaar is voor het uitzenden van
      radioprogramma’s daartoe aanleiding geeft, kan Onze Minister, handelend in overeenstemming met het gevoelen van de
      ministerraad, afzien van het aanwijzen van frequentieruimte in de FM-band op grond van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82e
  - number: 82f
    text: |-
      1 Voor de uitzending van radioprogramma’s van eenzelfde instelling wordt niet meer frequentieruimte gebruikt dan
      één FM-frequentie of samenstel van FM-frequenties.

      2 Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen een aantal met elkaar verbonden
      instellingen voor de toepassing van het eerste lid als één instelling wordt aangemerkt.

      3 Bij of krachtens algemene maatregel van bestuur kan worden afgeweken van het eerste lid, indien dat wenselijk is
      vanuit een oogpunt van doelmatig gebruik van frequentieruimte. Hierbij kan een onderscheid worden gemaakt tussen
      verschillende categorieën frequentieruimte, bestaande uit FM-frequenties en samenstellen van FM-frequenties.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82f
  - number: 82g
    text: |-
      De [artikelen 82][ref1] en [82][ref2] zijn niet van toepassing op:

      a. de frequentieruimte die wordt gebruikt voor de uitzending van de programma’s van de instellingen die zendtijd
      hebben verkregen, of van de programma’s van de Wereldomroep;

      b. frequentieruimte die wordt gebruikt ten behoeve van uitzending door middel van een satelliet.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82e
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82g
