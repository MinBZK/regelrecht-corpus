  - number: 82k
    text: |-
      1 In gemeenten waar een omroepnetwerk aanwezig is, stelt de gemeenteraad een programmaraad in die de aanbieder
      van het omroepnetwerk adviseert welke vijftien televisieprogramma's voor algemene omroep en vijfentwintig
      radioprogramma's voor algemene omroep hij krachtens [artikel 82i, eerste lid][ref1], ten minste uitzendt naar alle
      aangeslotenen op het netwerk.

      2 De aanbieder van een omroepnetwerk kan de programmaraad voorts een advies vragen over de overige programma's voor
      algemene omroep die hij uitzendt naar alle aangeslotenen op het omroepnetwerk.

      3 De programmaraad maakt in zijn advies een duidelijk onderscheid tussen advisering als bedoeld in het eerste lid
      en advisering als bedoeld in het tweede lid.

      4 Onverminderd [artikel 82i][ref2], gaat de programmaraad in zijn advisering uit van een pluriforme samenstelling
      van het pakket programma's voor algemene omroep, rekening houdend met de in de gemeente levende maatschappelijke,
      culturele, godsdienstige en geestelijke behoeften.

      5 De aanbieder van een omroepnetwerk volgt het advies, bedoeld in het eerste lid, tenzij zwaarwichtige redenen zich
      daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82i
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82i
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel82k
