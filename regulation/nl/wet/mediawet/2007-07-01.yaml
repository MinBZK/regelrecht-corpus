  - number: 36a
    text: |-
      1 Indien een omroepvereniging of de educatieve omroepinstelling die een erkenning heeft verkregen, tijdens de
      periode waarvoor erkenning is verleend wijzigingen wil aanbrengen in zijn beleidsplan, brengt hij de voorgenomen
      wijzigingen ter kennis van Onze Minister.

      2 De wijzigingen kunnen worden aangebracht, indien Onze Minister niet binnen acht weken nadat hij van de
      voorgenomen wijzigingen in kennis is gesteld, daartegen bedenkingen heeft ingebracht.

      3 Onze Minister brengt uitsluitend bedenkingen in tegen voorgenomen wijzigingen, indien hij een aanvraag voor een
      erkenning, vergezeld van het beleidsplan zoals het zou luiden na het aanbrengen van de voorgenomen wijzigingen, zou
      hebben afgewezen op een of meer van de gronden, bedoeld in [artikel 36, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel36
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '36'
        hoofdstuk: III
        paragraaf: '2'
  - number: 36b
    text: |-
      1 Onze Minister trekt een erkenning in, indien de omroepvereniging respectievelijk de educatieve omroepinstelling
      niet meer voldoet aan [artikel 14, eerste lid][ref1], respectievelijk [artikel 25][ref2].

      2 Onze Minister kan een erkenning intrekken, indien het Commissariaat aan de omroepvereniging of de educatieve
      omroepinstelling binnen een periode van een jaar ten minste tweemaal terzake van overtreding van het bepaalde
      bij of krachtens deze wet een sanctie heeft opgelegd, waaronder ten minste eenmaal een sanctie als bedoeld in
      [artikel 46, eerste lid][ref3].

      3 Indien aan een omroepvereniging of de educatieve omroepinstelling voor twee achtereenvolgende jaren een
      sanctie als bedoeld in [artikel 103a][ref4] is opgelegd, dan wel indien een omroepvereniging of de educatieve
      omroepinstelling naar het oordeel van de raad van bestuur onvoldoende uitvoering geeft aan de bereidheid tot
      samenwerking, bedoeld in [artikel 32, derde lid][ref5], kan de raad van bestuur Onze Minister verzoeken de
      erkenning in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel46
