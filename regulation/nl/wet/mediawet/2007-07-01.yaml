      1 De instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van de Stichting
      Etherreclame, ontvangen van de raad van bestuur voorschotten volgens bij algemene maatregel van bestuur te stellen
      regels.

      2 Wanneer blijkt dat de voorschotten worden gebruikt voor andere doeleinden dan waarvoor zij zijn gegeven, kan de
      raad van bestuur de verstrekking van voorschotten beëindigen of verminderen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel106
  - number: 106a
    text: |-
      1 Onze Minister kan – naast de bedragen, bedoeld in [artikel 101, eerste lid][ref1] – gelden ter beschikking
      stellen van de raad van bestuur, welke gelden voor doeleinden die door Onze Minister bij het ter beschikking
      stellen zijn vastgesteld, kunnen worden aangewend ten behoeve van de instellingen die zendtijd hebben verkregen
      voor landelijke omroep.

      2 Aan het ter beschikking stellen van gelden kunnen voorschriften worden verbonden. Onze Minister kan de
      beschikking tot het ter beschikking stellen van gelden intrekken of wijzigen, indien de aan de beschikking
      verbonden voorschriften niet worden nageleefd.


