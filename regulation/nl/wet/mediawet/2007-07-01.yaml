  - number: '46'
    text: |-
      1 Indien de Programmastichting, een omroepvereniging of de educatieve omroepinstelling die een erkenning of
      een voorlopige erkenning heeft verkregen, niet voldoet aan de verplichtingen die bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1] voor haar gelden, kan het Commissariaat voor de Media de
      aan de desbetreffende instelling ter beschikking gestelde zendtijd voor een periode van ten hoogste twaalf weken
      intrekken.

      2 In geval van zendtijdintrekking als bedoeld in het eerste lid wordt de zendtijd die krachtens
      [artikel 39, eerste tot en met derde lid][ref2], onderscheidenlijk [artikel 39][ref3], in het jaar waarin de
      intrekking plaatsvindt aan de desbetreffende instelling ter beschikking is gesteld, van rechtswege evenredig
      verminderd.

      3 Gedurende de periode waarvoor de zendtijd op grond van het eerste lid is ingetrokken, is
      [artikel 39, vierde lid][ref4], onderscheidenlijk [artikel 39][ref5], niet van toepassing.

      4 Gedurende de periode waarvoor de zendtijd op grond van het eerste lid is ingetrokken, bestaat geen recht op de
      vergoeding, bedoeld in [artikel 104, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
