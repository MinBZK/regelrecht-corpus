  - number: 71e
    text: |-
      1 Iedere commerciële omroepinstelling bepaalt, onverminderd het bij of krachtens de wet bepaalde, vorm en inhoud
      van haar programma en is daarvoor verantwoordelijk.

      2 De [artikelen 52d][ref1] en [53][ref2] zijn van overeenkomstige toepassing op een commerciële omroepinstelling en
      op het door haar verzorgde programma.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52d
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel53
