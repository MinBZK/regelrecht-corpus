  - number: 55a
    text: |-
      1 Onverminderd [artikel 48][ref1] is het aan een instelling die zendtijd heeft verkregen voor landelijke
      omroep uitsluitend toegestaan overeenkomsten te sluiten met omroepinstellingen, dan wel met rechtspersonen of
      vennootschappen waarmee bedoelde instellingen in een groep zijn verbonden, indien die instelling het voornemen
      hiertoe schriftelijk heeft gemeld bij de raad van bestuur, onder overlegging van het ontwerp van de overeenkomst,
      en de raad van bestuur binnen twee maanden niet heeft medegedeeld dat de desbetreffende overeenkomst in strijd
      is met het gemeenschappelijke belang van de landelijke omroep. Een dergelijke overeenkomst wordt schriftelijk
      aangegaan.

      2 Het eerste lid is niet van toepassing op overeenkomsten die worden gesloten met instellingen die zendtijd hebben
      verkregen voor binnenlandse omroep.

      3 Het eerste lid heeft ten aanzien van de educatieve omroepinstelling, overheidsinstellingen, kerkgenootschappen,
      genootschappen op geestelijke grondslag en politieke partijen uitsluitend betrekking op overeenkomsten die
      betrekking hebben op hun werkzaamheden die strekken tot de verzorging van hun radio- en televisieprogramma's.


