  - number: '39'
    text: |-
      1 De omroepverenigingen die een erkenning hebben verkregen, hebben jaarlijks de beschikking over de volgende
      hoeveelheid zendtijd:

      a. omroepverenigingen waarvan het Commissariaat bij de erkenningverlening heeft vastgesteld dat zij 300 000 of meer
      leden hebben: 650 uren voor televisie en 3000 uren voor radio;

      b. omroepverenigingen waarvan het Commissariaat bij de erkenningverlening heeft vastgesteld dat zij ten minste 150
      000, doch minder dan 300 000 leden hebben: 325 uren voor televisie en 1500 uren voor radio.

      2 De omroepverenigingen die een voorlopige erkenning hebben verkregen, hebben jaarlijks de beschikking over 100
      uren zendtijd voor televisie en 450 uren zendtijd voor radio.

      3 De educatieve omroepinstelling die een erkenning heeft verkregen, heeft jaarlijks de beschikking over 500 uren
      zendtijd voor televisie en 475 uren zendtijd voor radio.

      4 De omroepverenigingen en de educatieve omroepinstelling zijn gerechtigd meer zendtijd te gebruiken dan de
      zendtijd, bedoeld in het eerste tot en met derde lid.

      5 Bij algemene maatregel van bestuur kan het aantal uren zendtijd voor televisie, onderscheidenlijk radio, bedoeld
      in het eerste tot en met derde lid, worden herzien indien het aantal omroepverenigingen die een erkenning of een
      voorlopige erkenning hebben verkregen, daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel39
  - number: 39a
    text: |-
      1 De Programmastichting heeft per jaar de beschikking over 650 uren zendtijd voor televisie en 3000 uren zendtijd
      voor radio.

      2 De Programmastichting is gerechtigd meer zendtijd te gebruiken dan de zendtijd, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel39a
  - number: 39a1
    text: |-
      1 De Stichting heeft per jaar de beschikking over 1.300 uren zendtijd voor televisie en 1.500 uren zendtijd voor
      radio.

      2 De Stichting is gerechtigd meer zendtijd te gebruiken dan de zendtijd, bedoeld in het eerste lid.

      3 De Stichting heeft tevens, met uitsluiting van de andere instellingen die zendtijd hebben verkregen, de
      beschikking over zendtijd voor een teletekstprogramma voor landelijke omroep. Deze zendtijd is gelijk aan de tijd
      dat door middel van de desbetreffende omroepzenders het programma van de instellingen die zendtijd hebben verkregen
      voor landelijke omroep, of een toetsbeeld wordt uitgezonden.

      4 In afwijking van het derde lid, is het toegestaan dat de Stichting Etherreclame, met inachtneming van artikel
      39*b*, een deel van de zendtijd voor het teletekstprogramma voor landelijke omroep gebruikt.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel39a1
  - number: 39b
    text: |-
      De Stichting Etherreclame heeft per jaar de beschikking over een bij algemene maatregel van bestuur vast te stellen
      percentage van de totale gebruikte zendtijd voor landelijke omroep. Dit percentage is niet hoger dan tien en kan
      verschillen voor televisie en voor radio.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel39b
  - number: 39c
    text: |-
      1 Onze Minister stelt jaarlijks vast hoeveel zendtijd voor landelijke televisie-omroep, onderscheidenlijk radio-
      omroep, beschikbaar is voor de instellingen die in aanmerking komen voor toewijzing van zendtijd voor landelijke
      omroep door het Commissariaat voor de Media overeenkomstig de [artikelen 39f tot en met 39h][ref1].

      2 Het Commissariaat voor de Media wijst de zendtijd, bedoeld in het eerste lid, jaarlijks toe.

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent de periode waarin en de wijze waarop aanvragen
      voor toewijzing van zendtijd worden ingediend, de termijn waarbinnen besluiten op een aanvraag worden genomen, en
      het tijdstip waarop de toewijzing van zendtijd in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39f
        hoofdstuk: III
