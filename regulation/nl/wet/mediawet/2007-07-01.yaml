  - number: 40d
    text: |-
      1 Ten behoeve van de coördinatie op een televisieprogrammanet wordt de raad van bestuur bijgestaan door een
      netredactie die als volgt is samengesteld:

      a. de instellingen, wier zendtijd voor televisie krachtens [artikel 41b, eerste lid, onderdelen a en b][ref1], is
      ingedeeld op het desbetreffende programmanet benoemen elk één lid;

      b. de instellingen, met uitzondering van de Stichting Etherreclame, de kerkgenootschappen en genootschappen op
      geestelijke grondslag, de politieke partijen en de overheid, van wie een bij het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref2], te bepalen belangrijk deel van de zendtijd tussen 16.00 uur en 24.00
      uur is ingedeeld op het desbetreffende programmanet benoemen elk één lid;

      c. de kerkgenootschappen en genootschappen op geestelijke grondslag, wier zendtijd is ingedeeld op het
      desbetreffende programmanet, benoemen gezamenlijk één lid.

      2 Ten behoeve van de coördinatie op een radioprogrammanet wordt de raad van bestuur bijgestaan door een netredactie
      die bestaat uit een aantal leden dat gelijk is aan het aantal instellingen wier zendtijd op het desbetreffende
      programmanet is ingedeeld, met uitzondering van de Stichting Etherreclame, de politieke partijen en de overheid.
      Iedere instelling benoemt één lid, met uitzondering van de instellingen, genoemd in de vorige volzin.

      3 Het lidmaatschap van een netredactie is onverenigbaar met het lidmaatschap van het bestuur van een
      omroepvereniging, de educatieve omroepinstelling of de Programmastichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
