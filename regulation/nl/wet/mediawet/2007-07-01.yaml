  - number: '22'
    text: |-
      De raad van bestuur en de door hem daartoe aangewezen medewerkers van de Stichting zijn bevoegd inlichtingen te
      verlangen van instellingen die zendtijd voor landelijke omroep hebben verkregen, voor zover dat voor de vervulling
      van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel22
  - number: '23'
    text: |-
      1 De Stichting verstrekt Onze Minister alle inlichtingen met betrekking tot de werkzaamheden van de Stichting.

      2 Onze Minister kan inzage verlangen van zakelijke gegevens en bescheiden van de Stichting, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel23
  - number: 23a
    text: |-
      1 De raad van bestuur stelt jaarlijks voor 1 mei een jaarverslag vast over het afgelopen kalenderjaar. In het
      jaarverslag wordt aandacht besteed aan de werkzaamheden van de Stichting, het gevoerde beleid in het algemeen en de
      doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.

      2 De raad van bestuur zendt het verslag aan Onze Minister en stelt het algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel23a
  - number: '24'
    text: |-
      1 Wijzigingen in de statuten van de Stichting behoeven de instemming van Onze Minister.

      2 De raad van bestuur kan niet besluiten tot ontbinding van de Stichting.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel24
  - number: '25'
    text: |-
      1 Een educatieve omroepinstelling is een instelling die voldoet aan de volgende eisen:

      a. zij is een rechtspersoon met volledige rechtsbevoegdheid;

      b. zij stelt zich uitsluitend ten doel het verzorgen van een breed en samenhangend educatief programma op het
      gebied van onderwijs, scholing en vorming;

      c. zij heeft blijkens de statuten een bestuur, dat zodanig is samengesteld dat deskundigen uit de kring van
      representatieve landelijke organisaties op het gebied van onderwijs, scholing en vorming daarin zitting hebben; en

      d. zij in de statuten een regeling heeft opgenomen die voorziet in de instelling van een programmaraad die het
      programmabeleid bepaalt. De programmaraad heeft een zodanige samenstelling dat deze voorziet in representatieve
      vertegenwoordiging van maatschappelijke en levensbeschouwelijk organisaties op het terrein van onderwijs, scholing
      en vorming.

      2 De statuten alsmede wijzigingen daarvan behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel25
  - number: '26'
    text: |-
      1 De Stichting Etherreclame verzorgt een programma voor algemene omroep dat bestaat uit reclameboodschappen en
      telewinkelboodschappen die zijn aangeboden door derden, alsmede een omlijsting daarvan.

      2 Het bestuur van de Stichting Etherreclame bestaat uit een voorzitter en vier andere leden.

      3 De leden van het bestuur worden door Onze Minister benoemd en ontslagen. Drie van de leden worden benoemd op
      voordracht van de Stichting. Onze Minister wijst uit de leden de voorzitter aan.

      4 Onze Minister kan twee waarnemers aanwijzen. Deze waarnemers hebben in het bestuur een raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel26
  - number: '27'
    text: |-
      1 Het bestuur van de Stichting Etherreclame stelt de tarieven vast voor het door haar in haar programma opnemen van
      reclameboodschappen en telewinkelboodschappen.

      2 Een besluit tot vaststelling van de tarieven wordt terstond aan Onze Minister medegedeeld.

      3 Binnen één maand na ontvangst van het besluit kan Onze Minister het besluit geheel of ten dele vernietigen.
      Bij dit besluit kan Onze Minister zelf de tarieven vaststellen, dan wel bepalen dat het bestuur van de Stichting
      Etherreclame opnieuw ter zake een besluit neemt met inachtneming van het besluit van Onze Minister.

      4 Ter zake van het nieuwe besluit van het bestuur van de Stichting Etherreclame zijn het tweede en derde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel27
  - number: '28'
    text: |-
      De inkomsten die de Stichting Etherreclame verwerft stelt zij, na aftrek van haar door Onze Minister goedgekeurde
      uitgaven, ter beschikking van Onze Minister. De afgedragen inkomsten dienen ter bestrijding van de kosten verbonden
      aan:

      a. de vergoedingen aan instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van
      politieke partijen;

      b. de Wereldomroep;

      c. het Europees programma, bedoeld in [artikel 16, tweede lid, onderdeel f][ref1];

      d. de uitkering uit de inkomsten van de Stichting Etherreclame ten behoeve van het Stimuleringsfonds voor de pers
      als bedoeld in [artikel 128][ref2];

      e. de Raad voor cultuur, voor zover samenhangend met de advisering ten aanzien van radio, televisie, pers en andere
      vormen van massacommunicatie, tot een door Onze Minister te bepalen bedrag;

      f. het Commissariaat voor de Media;

      g. door Onze Minister bekostigd onderzoek in het belang van de massacommunicatie;

      h. uitkeringen door Onze Minister aan het fonds, bedoeld in [artikel 170][ref3];

      i. vergoedingen aan het Bedrijf ten behoeve van de uitvoering van de taak, bedoeld in [artikel 83][ref4];

      j. vergoedingen aan een door Onze Minister aan te wijzen instelling ten behoeve van het in stand houden en
      exploiteren van een omroeparchief;

      k. vergoedingen aan een door Onze Minister aan te wijzen instelling ten behoeve van het in stand houden en
      exploiteren van omroeporkesten, omroepkoren en een muziekbibliotheek;

      l. een door Onze Minister aan te wijzen overlegorgaan van lokale omroepinstellingen en bijdragen aan regionale en
      lokale omroep ten behoeve van minderhedenprogrammering;

      m. een landelijk orgaan dat informatie verstrekt en anderszins ondersteuning biedt aan de programmaraden, bedoeld
      in [artikel 82k, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel16
