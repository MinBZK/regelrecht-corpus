  - number: 52c
    text: |-
      Indien een gesponsord programma-onderdeel uit het buitenland is aangekocht en aldaar ten behoeve van het
      buitenlandse publiek reeds als programma is uitgezonden, zijn de [artikelen 52][ref1] en [52][ref2] slechts van
      toepassing, voor zover de sponsorbijdragen worden verstrekt ten behoeve van de aankoop van het programma-onderdeel
      door de instelling die zendtijd heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52a
