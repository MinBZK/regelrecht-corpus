  - number: '19'
    text: |-
      1 De raad van bestuur bestaat uit een voorzitter en twee andere leden. De voorzitter en de andere leden zijn in
      dienst van de Stichting.

      2 De leden van de raad van bestuur worden benoemd door de raad van toezicht. Beslissingen van de raad van toezicht
      tot benoeming behoeven de instemming van Onze Minister.

      3 De leden van de raad van bestuur worden benoemd voor een periode van vijf jaren. Herbenoeming voor een
      aansluitende periode is eenmaal mogelijk.

      4 De raad van toezicht stelt de arbeidsvoorwaarden van de leden van de raad van bestuur vast.

      5 Het lidmaatschap van de raad van bestuur is onverenigbaar met:

      a. het lidmaatschap van een orgaan van, en een dienstbetrekking bij, een instelling die zendtijd heeft verkregen,
      met uitzondering van de Stichting Etherreclame;

      b. het lidmaatschap van een netredactie.

      6 De raad van bestuur regelt zijn eigen werkwijze.

      7 [Artikel 668a, eerste tot en met vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel19
    references:
      - id: ref1
