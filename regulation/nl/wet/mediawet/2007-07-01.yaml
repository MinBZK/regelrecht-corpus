      - id: ref3
        bwb_id: BWBR0004149
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
  - number: 37a
    text: |-
      1 [Artikel 32][ref1] is van overeenkomstige toepassing op aanvragen voor een voorlopige erkenning, met dien
      verstande dat uit het beleidsplan tevens dient te blijken dat het programma dat de omroepvereniging voornemens
      is te verzorgen, naar inhoud en strekking zodanig afwijkt van de door de omroepverenigingen die een erkenning
      hebben verkregen verzorgde programma's, dat het de verscheidenheid in de landelijke omroep vergroot en daarmee een
      vernieuwende bijdrage levert aan de verwezenlijking van de taakopdracht van de landelijke omroep.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud van het
      beleidsplan, het tijdstip waarop en de wijze waarop aanvragen voor een voorlopige erkenning worden ingediend, de
      terinzagelegging van de aanvragen en de termijn waarbinnen besluiten op een aanvraag worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: 37b
    text: |-
      1 Een aanvraag voor een voorlopige erkenning wordt afgewezen, indien niet wordt voldaan aan de vereisten van de
      [artikelen 14, eerste lid][ref1], en [37, derde lid][ref2].

      2 Een aanvraag voor een voorlopige erkenning kan daarnaast slechts worden afgewezen, indien:

      a. niet wordt voldaan aan een bij of krachtens [artikel 37a][ref3] gesteld vereiste;

      b. aannemelijk is dat de aanvrager zich niet aan de bij of krachtens de wet gestelde voorschriften zal houden; of

      c. uit het beleidsplan naar het oordeel van Onze Minister onvoldoende blijkt dat in het programmabeleid de
      identiteit van de aanvrager tot uitdrukking komt, het programma voldoet aan de daaraan bij of krachtens deze wet
      gestelde eisen of de bereidheid tot samenwerking, bedoeld in [artikel 32, derde lid][ref4], bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel37a
