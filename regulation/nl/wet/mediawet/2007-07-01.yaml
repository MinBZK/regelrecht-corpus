  - number: 18c
    text: |-
      1 Het college van omroepen bestaat uit een voorzitter en een aantal andere leden.

      2 Het college van omroepen heeft tot taak de raad van toezicht en de raad van bestuur desgevraagd of uit eigen
      beweging van advies te dienen over het programmabeleid van de landelijke publieke omroep.

      3 Het college van omroepen is als volgt samengesteld:

      a. omroepverenigingen en de educatieve omroepinstelling die een erkenning hebben verkregen, alsmede de
      Programmastichting benoemen elk één lid;

      b. de kerkgenootschappen en de genootschappen op geestelijke grondslag die zendtijd hebben verkregen, benoemen
      gezamenlijk één lid;

      c. de programmadirecteur van de Stichting, genoemd in [artikel 19a, vierde lid][ref1], is lid met raadgevende stem.

      4 De omroepverenigingen die een voorlopige erkenning hebben verkregen kunnen elk één waarnemer in het college van
      omroepen aanwijzen.

      5 Het lidmaatschap van het college van omroepen is onverenigbaar met:

      a. het lidmaatschap van de raad van bestuur; en

      b. het lidmaatschap van een netredactie.

      6 Het college van omroepen wijst uit zijn midden de voorzitter aan.

      7 Het college van omroepen regelt zijn eigen werkwijze.

      8 Het vijfde lid, onderdeel b, is niet van toepassing op de programmadirecteur van de Stichting, genoemd in
      [artikel 19a, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
