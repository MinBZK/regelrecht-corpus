    text: |-
      1 Voor landelijke televisie-omroep door instellingen die zendtijd hebben verkregen, zijn gedurende de
      concessieperiode, bedoeld in [artikel 30a, tweede lid][ref1], drie televisieprogrammanetten beschikbaar: TV 1, 2
      en 3.

      2 De programmering op de onderscheiden televisieprogrammanetten omvat onderdelen van culturele, educatieve,
      informatieve en verstrooiende aard en bevat in elk geval programma-onderdelen die bestaan uit nieuws en
      actualiteiten. De programmering richt zich tevens op programma-onderdelen of bevolkings- en leeftijdsgroepen
      voor zover die met betrekking tot de televisieprogrammanetten zijn aangegeven bij of krachtens het bepaalde in de
      [artikelen 13c][ref2], [18b, tweede lid, onderdeel a][ref3], [19a, eerste lid, onderdeel e][ref4], [30a][ref5] en
      [30b][ref6]. De programmering is voorts zodanig dat op de onderscheiden televisieprogrammanetten een herkenbare
      programmering wordt bereikt.

      3 Voor landelijke radio-omroep door instellingen die zendtijd hebben verkregen, zijn gedurende de concessieperiode,
      bedoeld in [artikel 30a, tweede lid][ref7], vijf radioprogrammanetten beschikbaar: Radio 1, 2, 3, 4 en 5.

      4 De programmering op de radioprogrammanetten omvat onderdelen van culturele, informatieve, educatieve en
      verstrooiende aard en bevat in elk geval programma-onderdelen die bestaan uit nieuws en actualiteiten en een
      gevarieerd aanbod van muziek. De programmering richt zich op programma-onderdelen en bevolkingsen leeftijdsgroepen
      voor zover die met betrekking tot de radioprogrammanetten zijn aangegeven bij of krachtens het bepaalde in de
      [artikelen 13c][ref8], [18b, tweede lid, onderdeel a][ref9], [19a, eerste lid, onderdeel e][ref10], [30a][ref11]
      en [30b][ref12]. De programmering is voorts zodanig dat op de onderscheiden radioprogrammanetten een herkenbare
      programmering wordt bereikt.

      5 De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref13], er zorg voor dat de op de televisie- en radioprogrammanetten uit te
      zenden programma-onderdelen passen binnen het kader dat bij of krachtens het bepaalde in de [artikelen 13c][ref14],
      [18b, tweede lid, onderdeel a][ref15], [19a, eerste lid, onderdeel e][ref16], [30a][ref17], [30b][ref18], en dit
      artikel voor het desbetreffende programmanet wordt aangegeven.

      6 Ten behoeve van de in het vijfde lid bedoelde taak bevordert de raad van bestuur dat voor de onderscheiden
      televisie- en radioprogrammanetten afspraken tussen de Stichting en de instellingen die zendtijd hebben verkregen
      voor landelijke omroep tot stand komen over de kwantitatieve en kwalitatieve doelstellingen die betrekking
      hebben op het programma-aanbod en het publieksbereik op de onderscheiden programmanetten, alsmede de wederzijdse
      inspanningen en bijdragen ten behoeve van de programmering op de programmanetten.


