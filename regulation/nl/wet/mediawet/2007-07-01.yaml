        artikel: '83'
        hoofdstuk: VII
  - number: 98a
    text: |-
      1 De raad van bestuur stelt jaarlijks vóór 1 augustus voor elk televisie- en radioprogrammanet een netbegroting op.

      2 De netbegrotingen bevatten in ieder geval:

      a. een beschrijving van de wijze waarop op het televisie-, onderscheidenlijk radioprogrammanet, invulling wordt
      gegeven aan de voorgenomen programmering, rekening houdend met het netprofiel van het televisie-, onderscheidenlijk
      radioprogrammanet, bedoeld in [artikel 19a, eerste lid, onderdeel e][ref1], en met inachtneming van het bepaalde
      bij of krachtens [artikel 13c][ref2] en hetgeen overigens bij of krachtens deze wet is bepaald ten aanzien van de
      programma's en de programmering op de televisie- en radioprogrammanetten;

      b. een beschrijving van de voornemens van de instellingen die zendtijd hebben verkregen voor landelijke
      omroep en wier zendtijd op het net is ingedeeld met betrekking tot activiteiten als bedoeld in
      [artikel 13c, derde lid][ref3];

      c. de hoogte van de bedragen die voor het volgende kalenderjaar nodig zijn om de voornemens met betrekking
      tot de programmering op het televisie-, onderscheidenlijk radioprogrammanet, en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref4], te verwezenlijken, alsmede een financieel overzicht, inhoudende een raming van de
      voorziene benodigde middelen voor de daarop volgende vier jaren;

      d. een toelichting op de onderscheiden onderdelen en begrotingsposten.

      3 De netbegrotingen hebben geen betrekking op het programma en de activiteiten als bedoeld in
      [artikel 13c, derde lid][ref5], van de Stichting.

      4 De wettelijke bepalingen omtrent de inhoud en inrichting van de begroting, bedoeld in [artikel 99][ref6], zijn
      van overeenkomstige toepassing op de netbegrotingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
