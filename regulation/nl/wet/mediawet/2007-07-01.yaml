        hoofdstuk: VIII
        paragraaf: '1'
  - number: 98b
    text: |-
      1 De raad van bestuur stelt jaarlijks voor 1 augustus een begroting voor het televisieprogramma, onderscheidenlijk
      radioprogramma, alsmede de activiteiten als bedoeld in [artikel 13c, derde lid][ref1], van de Stichting vast.

      2 De begroting, bedoeld in het eerste lid, bevat in ieder geval:

      a. een beschrijving van de wijze waarop invulling wordt gegeven aan de voorgenomen programmering van de Stichting,
      met inachtneming van het bepaalde bij of krachtens [artikel 13c][ref2] en hetgeen overigens bij of krachtens deze
      wet is bepaald ten aanzien van de programma's en de programmering op de televisie- en radioprogrammanetten;

      b. een beschrijving van de voornemens van de Stichting met betrekking tot activiteiten als bedoeld in
      [artikel 13c][ref3], derde lid;

      c. de hoogte van de bedragen die voor het volgende kalenderjaar naar het oordeel van de raad van bestuur nodig
      zullen zijn ter bestrijding van de kosten van de verzorging van het televisieprogramma, onderscheidenlijk
      radioprogramma, en de activiteiten als bedoeld in [artikel 13c][ref4], derde lid, van de Stichting, alsmede een
      financieel overzicht, inhoudende een raming van de voorziene benodigde middelen voor de daarop volgende vier jaren;

      d. een toelichting op de onderscheiden onderdelen en begrotingsposten;

      e. een beschrijving van de samenwerking met de Wereldomroep.

      3 De wettelijke bepalingen omtrent de inhoud en inrichting van de begroting, bedoeld in [artikel 99][ref5], zijn
      van overeenkomstige toepassing op de begroting van de Stichting.


