  - number: '50'
    text: |-
      1 De zendtijd voor televisie van de omroepverenigingen gezamenlijk wordt gebruikt voor een volledig programma, dat
      ten minste omvat onderdelen van culturele, informatieve, educatieve en verstrooiende aard.

      2 Onverminderd het eerste lid, wordt jaarlijks van de zendtijd, bedoeld in het eerste lid, ten minste vijfentwintig
      procent gebruikt voor onderdelen van culturele aard en vijfendertig procent voor onderdelen van informatieve of
      educatieve aard. Een deel van de programma-onderdelen van culturele aard, dat ten minste gelijk is aan twaalf en
      een half procent van de gebruikte zendtijd voor televisie van de omroepverenigingen gezamenlijk, bestaat uit of
      heeft betrekking op kunst.

      3 Indien een programma-onderdeel van informatieve, educatieve of verstrooiende aard tevens wat zijn inhoud betreft
      voor meer dan de helft van culturele aard is, kan dit programma-onderdeel meegeteld worden bij de berekening van
      het percentage programma-onderdelen van culturele aard, bedoeld in het tweede lid.

      4 De educatieve omroepinstelling gebruikt haar zendtijd geheel voor een educatief programma.

      5 Een kerkgenootschap gebruikt zijn zendtijd geheel voor een kerkelijk programma.

      6 Een genootschap op geestelijke grondslag gebruikt zijn zendtijd geheel voor een programma op geestelijk terrein.

      7 Een politieke partij gebruikt haar zendtijd geheel voor een programma op politiek terrein.

      8 De Stichting Etherreclame gebruikt haar zendtijd voor een programma bestaande uit reclameboodschappen en
      telewinkelboodschappen die zijn aangeboden door derden. Voor ten hoogste een derde deel kan de zendtijd worden
      gebruikt voor omlijsting van de reclameboodschappen en telewinkelboodschappen. Telewinkelboodschappen die in het
      programma van de Stichting Etherreclame worden opgenomen duren elk ten hoogste één minuut. Een blok als bedoeld
      in [artikel 41a, vijfde lid][ref1], bestaat voor ten hoogste tweederde van de duur uit telewinkelboodschappen.
      Het programma van de Stichting Etherreclame is als zodanig herkenbaar en door optische of akoestische middelen
      duidelijk onderscheiden van de programma-onderdelen van de andere instellingen die zendtijd hebben verkregen. In
      het programma van de Stichting Etherreclame wordt geen gebruik gemaakt van subliminale technieken.

      9 De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref2], er zorg voor dat het gebruik van de zendtijd op de
      televisieprogrammanetten voldoet aan het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
