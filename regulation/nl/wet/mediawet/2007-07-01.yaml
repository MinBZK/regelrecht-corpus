  - number: '104'
    text: |-
      1 De Programmastichting , de omroepverenigingen en de educatieve omroepinstelling die zendtijd hebben
      verkregen, ontvangen van de raad van bestuur het op basis van [artikel 103, eerste lid][ref1], of
      [artikel 103][ref2]vastgestelde bedrag ter vergoeding van de kosten van de verzorging van hun televisieprogramma,
      onderscheidenlijk radioprogramma en de activiteiten als bedoeld in [artikel 13c, derde lid][ref3].

      2 Het op basis van [artikel 101, eerste lid, onderdeel b][ref4], of [artikel 103a][ref5] vastgestelde bedrag ter
      vergoeding van de kosten van het televisieprogramma, onderscheidenlijk radioprogramma, en de activiteiten als
      bedoeld in [artikel 13c, derde lid][ref6], van de Stichting blijft ter beschikking van de raad van bestuur.

      3 De overige instellingen die zendtijd hebben verkregen voor landelijke omroep, met uitzondering van de
      Stichting Etherreclame, ontvangen van de raad van bestuur ter vergoeding van de kosten van de verzorging van hun
      televisieprogramma, onderscheidenlijk radioprogramma, een bedrag dat verkregen wordt door vermenigvuldiging van
      het aantal toegewezen en gebruikte uren zendtijd voor televisieprogramma's, onderscheidenlijk radioprogramma's, met
      het op basis van [artikel 103, tweede en derde lid][ref7], of [artikel 103][ref8] berekende bedrag per uur zendtijd
      voor televisieprogramma's, onderscheidenlijk radioprogramma's.

      4 In bijzondere gevallen kan de raad van bestuur op aanvraag van een instelling die zendtijd heeft verkregen voor
      landelijke omroep, bepalen dat ten hoogste tien procent van het bedrag dat aan die instelling ter beschikking wordt
      gesteld ter vergoeding van de kosten van de verzorging van haar radioprogramma, kan worden besteed aan de kosten
      van de verzorging van haar televisieprogramma, of andersom.


