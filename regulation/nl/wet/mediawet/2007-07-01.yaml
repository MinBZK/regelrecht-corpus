  - number: '103'
    text: |-
      1 De raad van bestuur stelt jaarlijks voor 1 januari, op basis van het door Onze Minister met toepassing van
      [artikel 101, eerste lid, onderdeel a][ref1], genomen besluit, vast welke bedragen voor het volgende kalenderjaar
      ter beschikking worden gesteld aan de Programmastichting en de omroepverenigingen die zendtijd hebben verkregen,
      ten behoeve van de verzorging van hun televisieprogramma's, onderscheidenlijk radioprogramma's, en de activiteiten
      als bedoeld in [artikel 13c, derde lid][ref2], met dien verstande dat:

      a. de Programmastichting en de omroepverenigingen, bedoeld in [artikel 39, eerste lid, aanhef en onderdeel a][ref3],
      elk hetzelfde bedrag ontvangen;

      b. de omroepverenigingen, bedoeld in [artikel 39, eerste lid, aanhef en onderdeel b][ref4], elk een bedrag
      ontvangen ter hoogte van vijftig procent van het bedrag, bedoeld in onderdeel a; en

      c. de omroepverenigingen die een voorlopige erkenning hebben verkregen, elk een bedrag ontvangen ter hoogte van
      vijftien procent van het bedrag, bedoeld in onderdeel a.

      2 De raad van bestuur stelt jaarlijks voor 1 januari, op basis van het door Onze Minister met toepassing van
      [artikel 101, eerste lid, onderdelen d en e][ref5], genomen besluit, vast welk bedrag per uur zendtijd voor
      televisieprogramma's, onderscheidenlijk radioprogramma's, die is toegewezen en gebruikt, voor het volgende
      kalenderjaar ter beschikking wordt gesteld aan de kerkgenootschappen en genootschappen op geestelijke grondslag die
      zendtijd hebben verkregen, en aan de overheid ten behoeve van overheidsvoorlichting.

      3 Het bedrag per uur zendtijd voor televisieprogramma's, onderscheidenlijk radioprogramma's, bedoeld in het tweede
      lid, kan verschillend zijn per categorie instellingen.


