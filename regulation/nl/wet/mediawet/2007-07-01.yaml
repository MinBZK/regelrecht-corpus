  - number: '4'
    text: |-
      1 Onder de bevoegdheid van Nederland vallen omroepinstellingen die een televisieprogramma verzorgen en krachtens
      artikel 2 van de Europese richtlijn onder die Nederlandse bevoegdheid vallen.

      2 Het eerste lid is van overeenkomstige toepassing op een omroepinstelling die een radioprogramma verzorgt met dien
      verstande dat in ieder geval onder de bevoegdheid van Nederland valt een omroepinstelling die een radioprogramma
      verzorgt dat in Nederland door middel van een omroepzender, satellieten daaronder niet begrepen, wordt uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel4
  - number: '9'
    text: |-
      Er is een Commissariaat voor de Media. Het Commissariaat heeft rechtspersoonlijkheid en is gevestigd in de gemeente
      Hilversum.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel9
  - number: '10'
    text: |-
      1 Het Commissariaat voor de Media bestaat uit een voorzitter en twee of vier andere leden. Zij worden bij
      koninklijk besluit op voordracht van Onze Minister benoemd en ontslagen.

      2 Een benoeming geschiedt voor een periode van vijf jaren. Herbenoeming voor een aansluitende periode is éénmaal
      mogelijk.

      3 Met het lidmaatschap van het Commissariaat zijn onverenigbaar:

      a. een betrekking in dienst bij een ministerie, of bij een instelling of een dienst die, dan wel een bedrijf dat
      onder de verantwoordelijkheid van een minister werkzaam is;

      b. een lidmaatschap van een der Kamers van de Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      c. een bestuurslidmaatschap bij – of een betrekking in dienst van – een instelling die in aanmerking komt voor
      zendtijd voor binnenlandse omroep, een commerciële omroepinstelling, het Bedrijf dan wel een uitgever van een
      persorgaan.

      4 Naast ontslag op eigen verzoek van de betrokkene is ontslag alleen mogelijk op grond van ongeschiktheid, wegens
      het hebben van financiële belangen bij instellingen ten aanzien waarvan het Commissariaat wettelijke bevoegdheden
      heeft en wegens het aanvaarden van een betrekking die, of een lidmaatschap dat met het lidmaatschap van het
      Commissariaat onverenigbaar is.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de bezoldiging en de verdere
      rechtspositie van de leden van het Commissariaat en van zijn personeel.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel10
  - number: '11'
    text: |-
      1 Het Commissariaat voor de Media neemt besluiten bij meerderheid van stemmen. Van besluiten wordt zo spoedig
      mogelijk na de bekendmaking mededeling gedaan aan Onze Minister.

      2 Het Commissariaat kan slechts met instemming van alle leden aan één of meer van zijn leden mandaat en machtiging
      verlenen tot het uitvoeren van delen van zijn taak.

      3 Het Commissariaat stelt regels ten aanzien van zijn besluitvorming en werkwijze. Deze regels behoeven de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel11
  - number: '12'
    text: |-
      1 De kosten van het Commissariaat voor de Media worden door Onze Minister vergoed. Het Commissariaat stelt voor 1
      november een begroting vast voor het volgende kalenderjaar. De begroting behoeft de instemming van Onze Minister.

      2 Het Commissariaat brengt jaarlijks aan Onze Minister voor 1 september een financieel verslag uit over de
      eigen organisatie en over het beheer, bedoeld in [artikel 170c, vierde lid][ref1]. Dit verslag gaat vergezeld
      van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref2]. Het financieel verslag behoeft de instemming van Onze
      Minister.

      3 Het Commissariaat stelt de in het tweede lid bedoelde stukken algemeen verkrijgbaar.

      4 Onze Minister kan regels stellen over de inrichting van de begroting, het financieel verslag en aandachtspunten
      voor de accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel170c
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel12
