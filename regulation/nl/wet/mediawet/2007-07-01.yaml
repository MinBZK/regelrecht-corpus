  - number: '20'
    text: |-
      Het coördinatiereglement, bedoeld in [artikel 19a, eerste lid, onderdeel f][ref1], bevat in ieder geval:

      a. een regeling inzake de voorbereiding van de zendtijdindeling door de raad van bestuur;

      b. een nadere regeling inzake de coördinatie van programma-onderdelen op en tussen de verschillende
      programmanetten, gericht op een evenwichtig programma-aanbod voor publieksgroepen van verschillende omvang
      en samenstelling, gespreid over de verschillende programmanetten, rekening houdend met de netprofielen van de
      onderscheiden programmanetten;

      c. een regeling die beoogt tegen te gaan dat op hetzelfde tijdstip op verschillende programmanetten gelijksoortige
      programma-onderdelen worden uitgezonden;

      d. een regeling die beoogt te bevorderen dat op hetzelfde tijdstip op verschillende programmanetten nieuwe
      programma-onderdelen beginnen;

      e. een regeling inzake het verwijzen naar programma-onderdelen op andere programmanetten;

      f. een nadere regeling inzake de uitoefening van de bevoegdheid van de raad van bestuur om in het kader van de
      coördinatie, bedoeld in onderdeel b, de beoogde uitzenddag of het beoogde uitzendtijdstip van een programma-
      onderdeel te wijzigen of een programmaonderdeel niet op te nemen in het uitzendschema;

      g. de vaststelling van het in [artikel 40d, eerste lid, onderdeel b][ref2], bedoelde deel van de zendtijd tussen
      16.00 uur en 24.00 uur;

      h. een nadere regeling inzake de wijze waarop het totstandkomen van afspraken als bedoeld in
      [artikel 40, zesde lid][ref3], wordt bevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel40d
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel40
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel20
