        afdeling: '1'
  - number: '67'
    text: |-
      1 Het Commissariaat voor de Media kan aan een instelling die voor toewijzing van zendtijd voor regionale omroep in
      aanmerking komt, op verzoek van die instelling, in plaats van het toewijzen van zendtijd toestemming verlenen een
      programma voor regionale omroep, bedoeld in de [artikelen 30, onderdeel b][ref1], en [51e][ref2], te verzorgen dat
      wordt uitgezonden door middel van de omroepnetwerken in de desbetreffende provincie.

      2 Het bepaalde ten aanzien van toewijzing en intrekking van zendtijd voor regionale omroep is van overeenkomstige
      toepassing, met dien verstande dat het Commissariaat niet de dagen en uren aanwijst waarop het programma zal
      worden uitgezonden. Indien tussen de aanbieder van het omroepnetwerk en de instelling geen overeenstemming wordt
      bereikt over de dagen en uren waarop het programma zal worden uitgezonden, kan het Commissariaat ter zake bindende
      aanwijzingen geven.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de dagen en uren waarop een
      programma als bedoeld in het eerste lid kan worden uitgezonden. Deze regels hebben uitsluitend betrekking op
      televisieprogramma's.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51e
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel67
