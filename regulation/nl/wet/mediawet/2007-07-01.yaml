  - number: 57c
    text: |-
      1 Alle inkomsten van een instelling die zendtijd heeft verkregen, waaronder de inkomsten uit nevenactiviteiten en
      vermogen, worden, voor zover bij of krachtens deze wet niet anders is bepaald, aangewend voor de verzorging van het
      programma waarvoor zij zendtijd heeft verkregen.

      2 In afwijking van het eerste lid, kunnen inkomsten uit programmabladen van omroepverenigingen tot ten hoogste een
      bij algemene maatregel van bestuur te bepalen bedrag worden besteed aan verenigingsactiviteiten.
