  - number: '37'
    text: |-
      1 Voor programmaverzorging voor landelijke omroep kan Onze Minister omroepverenigingen voorlopig erkennen.

      2 Voorlopige erkenningen worden eenmaal in de vijf jaren verleend voor een, voor alle voorlopig erkende
      omroepverenigingen tegelijk aanvangende, periode van vijf jaren, samenvallend met de erkenningsperiode, bedoeld in
      [artikel 31, tweede lid][ref1].

      3 Een omroepvereniging komt slechts in aanmerking voor een voorlopige erkenning, indien:

      a. de omroepvereniging geen erkenning als bedoeld in [artikel 31][ref2] heeft verkregen; en

      b. door het Commissariaat voor de Media is vastgesteld dat de omroepvereniging ten minste 50 000 leden heeft.

      4 [Artikel 31, vierde en vijfde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel31
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel37
    references:
      - id: ref1
