  - number: '51'
    text: |-
      1 Op elk televisieprogrammanet wordt ten hoogste vijfentwintig procent van de totale hoeveelheid zendtijd op het
      televisieprogrammanet van omroepinstellingen die zendtijd hebben verkregen voor landelijke omroep besteed aan
      programma-onderdelen van verstrooiende aard.

      2 De raad van bestuur draagt, met inachtneming van het coördinatiereglement, bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], er zorg voor dat het gebruik van de zendtijd op de
      televisieprogrammanetten voldoet aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel51
