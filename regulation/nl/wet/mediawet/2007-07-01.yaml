        artikel: 51e
        hoofdstuk: III
        afdeling: '1'
  - number: 167c
    text: |-
      1 Het Commissariaat voor de Media kan regels stellen met betrekking tot het uitzenden van toetsbeelden.

      2 Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen of op welke tijden geen toetsbeelden
      worden uitgezonden door middel van de omroepzenders door middel waarvan ook de programma’s van de instellingen die
      zendtijd voor landelijke omroep hebben verkregen, worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel167c
  - number: '168'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het uitzenden van programma’s uitsluitend bestemd
      voor de in Nederland gelegerde militairen van buitenlandse strijdkrachten en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel168
  - number: '169'
    text: |-
      Onze Minister stelt regels ter uitvoering van de artikelen 12, 15 en 16 van de Europese richtlijn, voor zover
      naar het oordeel van Onze Minister een of meer van deze artikelen niet, niet voldoende, niet juist of niet tijdig
      zijn uitgewerkt in de Nederlandse Reclame Code of in een vergelijkbare door de Stichting Reclame Code tot stand
      gebrachte regeling, dan wel de Stichting Reclame Code in gebreke blijft met het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel169
  - number: '170'
    text: |-
      1 Onze Minister richt de Stichting stimuleringsfonds Nederlandse culturele omroepprodukties op.

      2 De stichting heeft tot taak het verstrekken van financiële bijdragen voor de ontwikkeling en vervaardiging van
      programmaonderdelen en programmamateriaal voor activiteiten als bedoeld in [artikel 13c, derde lid][ref1], van
      bijzondere Nederlandse culturele aard, ten behoeve van omroepverenigingen, de Stichting, de Programmastichting,
      de educatieve omroepinstelling, dan wel kerkgenootschappen of genootschappen op geestelijke grondslag die zendtijd
      hebben verkregen voor landelijke omroep, de instellingen die zendtijd hebben verkregen voor regionale omroep,
      alsmede de Wereldomroep.

      3 De stichting heeft een bestuur dat bestaat uit een voorzitter en zes andere leden. De leden van het bestuur
      worden benoemd en ontslagen door Onze Minister. Twee leden worden benoemd uit de kring van de omroep en twee leden
      uit de kring van de film- en podiumkunsten. Van de andere leden wordt één tot voorzitter benoemd.

      4 Wijzigingen in de statuten van de stichting behoeven de instemming van Onze Minister. Het bestuur van de
      stichting kan niet besluiten tot ontbinding van de stichting.

      5 Onze Minister verstrekt jaarlijks aan de stichting uit de middelen bedoeld in [artikel 28][ref2] en
      [artikel 110][ref3] een uitkering. De hoogte van de uitkering is tenminste gelijk aan eenzestiende deel van
      de afgedragen inkomsten van de Stichting Etherreclame van dat jaar. De begroting en jaarrekening behoeven zijn
      instemming.

      6 De stichting verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak nodig is.

      7 Onze Minister zendt telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van het functioneren van de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel110
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel170
