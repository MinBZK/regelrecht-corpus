  - number: '33'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud van het
      beleidsplan, bedoeld in [artikel 32, tweede lid][ref1], het tijdstip waarop en de wijze waarop aanvragen voor een
      erkenning worden ingediend, de terinzagelegging van de aanvragen en de termijn waarbinnen besluiten op een aanvraag
      worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
