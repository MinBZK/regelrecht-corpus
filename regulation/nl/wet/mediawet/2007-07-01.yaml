        artikel: '58'
        hoofdstuk: III
        afdeling: '2'
  - number: 61a
    text: |-
      De Stichting Etherreclame draagt er zorg voor dat zij aangesloten is bij de Nederlandse Reclame Code of een
      vergelijkbare door de Stichting Reclame Code tot stand gebrachte regeling en ter zake onderworpen is aan het
      toezicht van de Stichting Reclame Code. De Stichting Etherreclame toont dit aan door middel van een aan het
      Commissariaat voor de Media over te leggen schriftelijke verklaring van de Stichting Reclame Code.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel61a
  - number: '63'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de instellingen die zendtijd
      voor landelijke omroep hebben verkregen hun programma aan het Bedrijf ter uitzending aanbieden.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel63
  - number: '64'
    text: |-
      1 Omroepverenigingen die zendtijd hebben verkregen voor landelijke omroep:

      a. heffen een contributie van hun leden met een minimumbedrag van € 4,54 per jaar,

      b. verstrekken hun leden geen op geld waardeerbare voordelen zonder toestemming van het Commissariaat voor de
      Media,

      c. tonen ten genoegen van het Commissariaat aan dat hun leden op een democratisch aanvaardbare wijze invloed op hun
      beleid kunnen uitoefenen en

      d. brengen, in overeenstemming met hun werknemers die zijn belast met de samenstelling van programma's, een
      programmastatuut tot stand waarin de journalistieke rechten en plichten van deze werknemers worden geregeld.

      2 Bij algemene maatregel van bestuur kan het bedrag, bedoeld in het eerste lid, onderdeel a, naar aanleiding
      van de ontwikkeling van de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindex worden
      bijgesteld.

      3 In de contributie, bedoeld in het eerste lid, onderdeel a, is de verstrekking van een programmablad niet
      begrepen.

      4 Het eerste lid, aanhef en onderdeel d, is van overeenkomstige toepassing op de Programmastichting, de Stichting
      en de educatieve omroepinstelling die zendtijd heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel64
  - number: 64b
    text: |-
      1 Onverminderd [artikel 64, aanhef en onderdeel d][ref1], brengen instellingen die zendtijd hebben verkregen, een
      programmastatuut tot stand waarin ten minste waarborgen zijn opgenomen voor de redactionele onafhankelijkheid van
      hun werknemers, belast met de samenstelling van de programma's, ten opzichte van de sponsors.

      2 Dit artikel geldt niet voor overheidsinstellingen, kerkgenootschappen, genootschappen op geestelijke grondslag en
      politieke partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel64
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '64'
        hoofdstuk: III
        afdeling: '2'
  - number: 64c
    text: |-
      1 Instellingen die zendtijd hebben verkregen, brengen jaarlijks schriftelijk verslag uit aan het Commissariaat voor
      de Media omtrent de inkomsten uit sponsorbijdragen, de gesponsorde programma-onderdelen en de hoedanigheid van de
      sponsors, gespecificeerd per programma-onderdeel.

      2 Het Commissariaat voor de Media kan nadere regels stellen omtrent de inrichting van het verslag, de termijn
      waarbinnen het verslag moet worden uitgebracht, en de periode waarop het verslag betrekking heeft.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op bijdragen van overheidsinstellingen en andere
      instellingen dan bedoeld in [artikel 1, onderdeel ll][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel64c
