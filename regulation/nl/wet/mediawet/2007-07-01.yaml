  - number: '38'
    text: |-
      De [artikelen 36a][ref1] en [36b][ref2] zijn van overeenkomstige toepassing op omroepverenigingen die een voorlopige
      erkenning hebben verkregen, met dien verstande dat bedenkingen als bedoeld in [artikel 36a, derde lid][ref3], tegen
      voorgenomen wijzigingen in het beleidsplan van een omroepvereniging die een voorlopige erkenning heeft verkregen,
      uitsluitend kunnen worden ingebracht indien een aanvraag voor een voorlopige erkenning zou zijn afgewezen op een of
      meer van de gronden, bedoeld in [artikel 37b, tweede lid, onderdelen a en c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel36b
