  - number: 41b
    text: |-
      1 Met inachtneming van [artikel 41a][ref1] wordt de zendtijd voor landelijke televisie-omroep zodanig ingedeeld,
      dat:

      a. de programmaonderdelen van de Programmastichting tussen 16.00 uur en 24.00 uur steeds op hetzelfde
      televisieprogrammanet wordt uitgezonden;

      b. de programmaonderdelen van een omroepvereniging die zendtijd heeft verkregen, tussen 16.00 uur en 24.00 uur
      steeds op hetzelfde televisieprogrammanet worden uitgezonden; en

      c. op ieder televisieprogrammanet in ieder geval dagelijks tussen 16.00 uur en 24.00 uur programmaonderdelen van
      instellingen die zendtijd hebben verkregen voor landelijke omroep, worden uitgezonden.

      2 De raad van bestuur kan in het kader van de coördinatie op en tussen de verschillende programmanetten tot ten
      hoogste 325 uren per jaar per instelling afwijken van het eerste lid, onderdelen a en b.

      3 Het eerste en het tweede lid zijn niet van toepassing op het teletekstprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel41b
