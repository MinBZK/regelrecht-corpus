  - number: '42'
    text: |-
      1 Het Commissariaat voor de Media kan voor lokale en regionale omroep zendtijd toewijzen aan een lokale
      onderscheidenlijk een regionale omroepinstelling, op aanvraag van die instelling.

      2 Er kan per gemeente slechts aan één lokale omroepinstelling zendtijd worden toegewezen. Indien meer dan één
      omroepinstelling aan de eisen voldoet die deze wet aan een lokale omroepinstelling stelt, bevordert het College
      van Burgemeester en Wethouders het samengaan van die instellingen. Indien het college daarin niet slaagt wijst
      het Commissariaat de zendtijd toe aan één van de instellingen. Het slaat daarbij acht op alle factoren die voor
      het functioneren van de instelling van belang kunnen zijn. Het Commissariaat kan daarbij tevens op basis van een
      overeenkomst als bedoeld in [artikel 51f, tweede lid][ref1], de dagen en uren aanwijzen waarop de programma’s
      van de lokale omroepinstelling en de regionale omroepinstelling worden uitgezonden op de voor de lokale
      omroepinstelling aangewezen omroepzender.

      3 Aan een omroepinstelling wier programma bestemd is voor meer dan één gemeente of provincie, wordt alleen dan voor
      dat gebied zendtijd toegewezen, indien de gemeenteraden of Provinciale Staten van de desbetreffende gemeenten of
      provincies het in [artikel 43, eerste lid][ref2], bedoelde advies gezamenlijk hebben uitgebracht.

      4 De zendtijd voor lokale en regionale omroep wordt telkenmale voor tenminste vijf jaar toegewezen. Het
      Commissariaat kan jaarlijks de totale hoeveelheid zendtijd voor lokale of regionale omroep toewijzen. Het
      Commissariaat kan de dagen, uren en programmanetten aanwijzen waarop de programma’s van de instellingen die
      zendtijd hebben verkregen voor lokale en regionale omroep zullen worden uitgezonden.

      5 De wijze waarop aanvragen tot toewijzing van zendtijd worden ingediend, de termijn waarbinnen beslissingen
      daarop worden genomen en de termijn waarop adviezen worden uitgebracht en waarop beslissingen inzake toewijzing
      of intrekking van zendtijd voor lokale en regionale omroep in werking treden, worden bij algemene maatregel van
      bestuur geregeld.

      6 Indien zendtijd is toegewezen aan een lokale of regionale omroepinstelling kan het Commissariaat zendtijd
      toewijzen voor lokale en regionale omroep aan een gemeente en provincie ten behoeve van overheidsvoorlichting. Deze
      zendtijd bedraagt ten hoogste vijf percent van de zendtijd toegewezen aan de omroepinstelling. Bij of krachtens
      algemene maatregel van bestuur kunnen nadere regels worden gesteld.

      7 Indien aan een lokale of regionale omroepinstelling zendtijd is toegewezen voor een televisieprogramma, is het
      die instelling tevens toegestaan een toetsbeeld uit te zenden of te doen uitzenden en heeft zij tevens zendtijd
      voor een teletekstprogramma dat op dezelfde frequentieruimte tegelijkertijd met het televisieprogramma of met het
      toetsbeeld wordt uitgezonden.

      8 Toewijzing van zendtijd aan een regionale instelling die binnen twee jaar in de plaats komt van een instelling
      die eerder zendtijd voor regionale omroep had verkregen, houdt in dat de eerstgenoemde voor de toepassing van deze
      wet wordt gezien als rechtsopvolger van de laatstgenoemde.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel43
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel42
