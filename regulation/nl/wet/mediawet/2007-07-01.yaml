  - number: '108'
    text: |-
      1 De Wereldomroep doet jaarlijks voor 1 oktober een begroting toekomen aan Onze Minister en het Commissariaat voor
      de Media.

      2 De begroting bevat in ieder geval:

      a. een beschrijving van de wijze waarop door de Wereldomroep uitvoering wordt gegeven aan haar taak, bedoeld in
      [artikel 76][ref1];

      b. de hoogte van de bedragen die voor het volgende kalenderjaar nodig zullen zijn om de voornemens van de
      Wereldomroep te verwezenlijken, alsmede een financieel overzicht, inhoudende een raming van de voorziene benodigde
      middelen voor de daarop volgende vier jaren;

      c. een toelichting op de onderscheiden onderdelen en begrotingsposten;

      d. een beschrijving van de wijze van samenwerking met de Stichting.

      3 In de begroting worden afzonderlijk opgenomen:

      a. de bedragen die nodig zullen zijn ter bestrijding van de kosten van de verzorging van de programma’s van de
      Wereldomroep;

      b. de bedragen die nodig zullen zijn ter bestrijding van de kosten van:

      1°. de Wereldomroep, voor zover die kosten niet rechtstreeks samenhangen met de verzorging van haar programma's; en

      2°. het uitzenden van de programma’s van de Wereldomroep;

      c. de eigen inkomsten van de Wereldomroep, voor zover die moeten worden aangewend voor de verzorging van de
      programma's.

      4 In de begroting wordt tevens een overzicht gegeven van de feitelijke bestedingen van de Wereldomroep. Het
      overzicht heeft in ieder geval betrekking op de twee voorafgaande kalenderjaren.

      5 In de begroting wordt tevens aangegeven het aantal uren dat de Wereldomroep voornemens is te besteden aan
      programma-onderdelen die zijn geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen
      voor landelijke omroep, dan wel voor programma-onderdelen die reeds als programma-onderdelen van een instelling die
      zendtijd heeft verkregen voor landelijke omroep, zijn uitgezonden.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud en
      inrichting van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel76
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel108
