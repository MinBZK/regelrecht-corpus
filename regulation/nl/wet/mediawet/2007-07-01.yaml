  - number: 41a
    text: |-
      1 Met inachtneming van [artikel 39b][ref1] wordt de zendtijd van de Stichting Etherreclame zodanig ingedeeld, dat:

      a. deze zendtijd per dag op een programmanet niet meer bedraagt dan vijftien procent van de op dat programmanet
      gebruikte zendtijd;

      b. deze zendtijd per klokuur niet meer bedraagt dan twaalf minuten;

      c. op zondagen de programma-onderdelen van de Stichting Etherreclame niet onmiddellijk voorafgaan aan of aansluiten
      op programma-onderdelen van godsdienstige of levensbeschouwelijke aard, tenzij de voor dat programma-onderdeel
      verantwoordelijke instelling die zendtijd heeft verkregen, daartegen geen bedenkingen heeft ingebracht; en

      d. de programmaonderdelen van de andere instellingen die zendtijd hebben verkregen voor landelijke omroep, slechts
      worden onderbroken door programmaonderdelen van de Stichting Etherreclame, indien:

      1°. het te onderbreken programmaonderdeel langer duurt dan anderhalf uur voor televisie, onderscheidenlijk drie
      kwartier voor radio;

      2°. het programmaonderdeel bestaat uit het verslag of de weergave van een evenement;

      3°. het programmaonderdeel het volledige verslag van het evenement bevat;

      4°. de onderbreking geschiedt tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de daarin
      voorkomende zelfstandige onderdelen;

      5º. de onderbreking ten minste anderhalve minuut duurt voor televisie, onderscheidenlijk één minuut voor radio;

      6º. de voor het programmaonderdeel verantwoordelijke instelling die zendtijd heeft verkregen, geen bedenkingen
      heeft ingebracht tegen de onderbreking wegens afbreuk aan de integriteit, het karakter of de samenhang van het
      programmaonderdeel; en

      7º. de onderbreking geen afbreuk doet aan de rechten van rechthebbenden.

      2 Programmaonderdelen van instellingen die zendtijd hebben verkregen voor landelijke omroep, kunnen ten hoogste
      eenmaal per vijfenveertig minuten voor televisie, onderscheidenlijk ten hoogste eenmaal per dertig minuten voor
      radio, worden onderbroken door een programmaonderdeel van de Stichting Etherreclame.

      3 Programmaonderdelen van godsdienstige of geestelijke aard en programmaonderdelen die in het bijzonder bestemd
      zijn voor minderjarigen beneden de leeftijd van twaalf jaar, worden niet onderbroken door programmaonderdelen van
      de Stichting Etherreclame.

      4 Bij algemene maatregel van bestuur kunnen regels gesteld worden omtrent de indeling van zendtijd van de Stichting
      Etherreclame direct voorafgaande aan of direct volgend op programma-onderdelen die in het bijzonder bestemd zijn
      voor minderjarigen beneden de leeftijd van twaalf jaar.

      5 De zendtijd voor televisie van de Stichting Etherreclame kan slechts worden ingedeeld met inachtneming van een
      minimum duur van anderhalve minuut per blok.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39b
    url: https://wetten.overheid.nl/BWBR0004149/2007-07-01#Artikel41a
