      - id: ref4
        bwb_id: BWBR0002469
        artikel: 30m
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002469
        artikel: 30t
        paragraaf: '5'
  - number: '36.2'
    text: |-
      Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de
      [artikelen 1, eerste lid, onder b en d][ref1], [7c, tweede lid][ref2], [13][ref3], [14][ref4], en [27][ref5] zijn
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel7c
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel27
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel36
    references:
      - id: ref1
