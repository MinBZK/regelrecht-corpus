      bij of krachtens de [artikelen 1, eerste lid, onder a, b en d, tweede lid][ref1], [4a][ref2], [7][ref3],
      [10][ref4], [13][ref5], [14][ref6], [14c][ref7], [14d, eerste lid][ref8], [20, eerste lid][ref9], [21][ref10],
