  - number: 35a.2
    text: |-
      De bestuurlijke boete die voor een overtreding als bedoeld in het eerste lid kan worden opgelegd bedraagt ten
      hoogste het bedrag van de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1]
      of, indien dat meer is, 10% van de omzet in het boekjaar voorafgaande aan de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 35a.3
    text: |-
      De berekening van de omzet, bedoeld in het tweede lid, geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref1] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: 35a.4
    text: De bestuurlijke boete komt toe aan de staat.
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35a
  - number: 35b.1
    text: |-
      De raad van bestuur kan een bestuurlijke boete van ten hoogste het bedrag van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van de voorschriften
      vastgesteld bij of krachtens [artikel 30u, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30u
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30u
        paragraaf: '5'
  - number: 35b.2
    text: |-
      De raad van bestuur kan een bestuurlijke boete van ten hoogste het bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van de voorschriften,
      vastgesteld bij of krachtens de [artikelen 1, onder c][ref2], en [7c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 7c
  - number: 35b.3
    text: De te betalen geldsom van de opgelegde bestuurlijke boete komt toe aan de staat.
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35b
  - number: 35b.4
    text: |-
      Bij een overtreding als bedoeld in het eerste lid is [artikel 5:53 van de Algemene wet bestuursrecht][ref1] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 35c.1
    text: |-
      De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van het voorschrift
      vastgesteld bij [artikel 30g, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30g
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30g
        paragraaf: '2'
  - number: 35c.2
    text: |-
      De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van de aan de verleende
      vergunning verbonden voorschriften, bedoeld in [artikel 3, eerste lid][ref2], voorzover deze vergunning is
      afgegeven door burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '3'
  - number: 35c.3
    text: |-
      De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van de bij of krachtens
      [artikel 7c][ref2] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 7c
  - number: 35c.4
    text: |-
      De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van de aan de verleende
      vergunning verbonden voorschriften, bedoeld in de [artikelen 30b, eerste lid][ref2], en [30d, eerste lid][ref3], en
      wegens overtreding van het voorschrift, vastgesteld bij [artikel 30g, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel30d
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel30g
    url: https://wetten.overheid.nl/BWBR0002469/2012-04-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
