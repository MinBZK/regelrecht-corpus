        artikel: 30u
        paragraaf: '5'
  - number: '32.3'
    text: De feiten, strafbaar gesteld in het eerste en tweede lid, zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel32
  - number: '33.1'
    text: Er is een College van toezicht op de kansspelen, hierna het College genoemd.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel33
  - number: '33.2'
    text: |-
      Het College heeft tot taak Onze Minister van Justitie en Onze ministers wie het mede aangaat, te adviseren
      alsmede desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de uitvoerbaarheid
      van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens, voor zover deze betrekking hebben op
      kansspelen.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel33
  - number: '33.3'
    text: |-
      Het College brengt binnen zes maanden na ommekomst van ieder jaar een verslag uit van zijn werkzaamheden en van
      de ontwikkeling van de kansspelen in Nederland. Telkens na een termijn van drie jaren wordt daarin tevens de
      taakvervulling van het College aan een onderzoek onderworpen. Het verslag wordt toegezonden aan de Minister van
      Justitie en Onze Ministers wie het mede aangaat, alsmede aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel33
  - number: '34.1'
    text: |-
      Het College wordt gehoord over het voornemen tot verlening, wijziging of intrekking van een vergunning als bedoeld
      in de[ artikelen 9][ref1], [14b][ref2], [16][ref3], [24][ref4], [27b][ref5], [27h][ref6] en [30z][ref7] van de wet,
      alsmede in [artikel 3][ref8] van de wet voorzover de prijzen en premies gezamenlijk een grotere waarde dan € 4 500
      000 hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel14b
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel27b
      [ref6]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
      [ref7]: https://wetten.overheid.nl/BWBR0002469#Artikel30z
      [ref8]: https://wetten.overheid.nl/BWBR0002469#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '9'
