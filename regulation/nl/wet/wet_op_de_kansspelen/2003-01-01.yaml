  - number: '31.2'
    text: |-
      Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 1, onder b en d][ref1],
      [7][ref2], [7c, tweede lid][ref3], [13][ref4], [14][ref5], [27][ref6], [28][ref7],
