        artikel: '1'
  - number: '32.1'
    text: |-
      Overtreding van de verbodsbepaling van [artikel 1, onder ][ref1], wordt gestraft met geldboete van de derde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
  - number: '32.2'
    text: |-
      Overtreding van de verbodsbepalingen van de[ artikelen 30g, tweede lid][ref1], en [30u, tweede lid][ref2], wordt
      gestraft met geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30g
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30u
