        bwb_id: BWBR0002469
        artikel: '3'
  - number: '34.2'
    text: |-
      Het College is belast met het toezicht op de naleving door de rechtspersonen, waaraan een vergunning is verleend
      als bedoeld in het eerste lid, van het bepaalde bij of krachtens deze wet en van hun statuten en reglementen.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel34
  - number: '34.3'
    text: |-
      Met het in het tweede lid bedoelde toezicht op de naleving zijn belast de leden van het College, de secretaris
      en de overige medewerkers van het bureau van het College. De toezichthouder beschikt niet over de bevoegdheden ,
      genoemd in de [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '34.4'
    text: |-
      Instemming met de statuten en reglementen van de in het tweede lid bedoelde rechtspersonen wordt niet door Onze
      Minister van Justitie of een van Onze Ministers wie het mede aangaat gegeven dan nadat het College is gehoord. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '34.5'
    text: |-
      De in het tweede lid bedoelde rechtspersonen zenden een afschrift van de ingevolge de verleende vergunning
      voorgeschreven rapportage aan het College.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het College bevordert overleg, coördinatie en samenwerking tussen de instellingen en personen waaraan door Onze
      Minister van Justitie of een van Onze Ministers wie het mede aangaat vergunning is verleend ingevolge deze wet. Het
      College kan daartoe deze instellingen en personen voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel35
  - number: '35.2'
    text: |-
      In het belang van het voorkomen en tegengaan van negatieve maatschappelijke effecten kan het College,
      overeenkomstig bij algemene maatregel van bestuur gegeven regels, de in het eerste lid bedoelde instellingen en
      personen aanbevelingen doen.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel35
  - number: '36.1'
    text: |-
      Het College bestaat uit ten hoogste twaalf leden. De voorzitter en de overige leden worden bij koninklijk besluit
      benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel36
  - number: '36.2'
    text: |-
      De voorzitter en ten minste de helft van de overige leden van het College zijn onafhankelijke deskundigen. De
      andere leden van het College zijn ambtenaren in rijksdienst, die daarin met raadgevende stem zitting hebben.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel36
  - number: '36.3'
    text: |-
      Het College wordt bijgestaan door een secretaris, die wordt benoemd en ontslagen bij koninklijk besluit. De
      secretaris heeft in de vergaderingen van het College een raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel36
  - number: '36.4'
    text: |-
      Aan het College kan een bureau worden verbonden, dat onder leiding staat van de secretaris. De secretaris en de
      overige leden van het bureau zijn voor de uitoefening van hun taak uitsluitend verantwoording schuldig aan het
      College.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel36
  - number: '36.5'
    text: |-
      Leden van het College, alsmede van het daaraan verbonden bureau, mogen geen direct of indirect persoonlijk belang
      hebben bij de exploitatie van kansspelen.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel36
  - number: '37'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gegeven met betreking tot de taak, bevoegdheden en
      samenstelling van het College, alsmede de benoeming van de leden en de secretaris daarvan. Deze regelen hebben mede
      betrekking op de werkwijze en de vergoeding van de kosten van het College.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel37
  - number: '38'
    text: |-
      Alle aanspraken, voortvloeiende uit de uitslag van kansbepalingen in een gelegenheid, gegeven met vergunning
      ingevolge deze wet verleend, vervallen na verloop van een jaar na de dag waarop zij zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel38
  - number: '39'
    text: |-
      Artikel 1825 van het Burgerlijk Wetboek is niet van toepassing op prijzen en premies, behaald in gelegenheden,
      gegeven met vergunning ingevolge deze wet verleend.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel39
  - number: '44.1'
    text: Op loterijen, die vóór 1 juli 1905 reeds wettiglijk zijn aangelegd, is deze wet niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel44
  - number: '44.2'
    text: |-
      Loterijen en prijsvragen waarvoor vóór de datum van inwerkingtreding van deze wet vergunning is verleend, worden
      afgewikkeld overeenkomstig de vóór die datum geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel44
  - number: '45'
    text: |-
      Deze wet treedt in werking op een nader door Ons te bepalen tijdstip. Zij kan worden aangehaald als: "Wet op de
      kansspelen".
    url: https://wetten.overheid.nl/BWBR0002469/2003-01-01#Artikel45
