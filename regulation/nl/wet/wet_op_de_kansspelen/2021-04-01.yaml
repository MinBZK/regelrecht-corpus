        artikel: 30g
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30u
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 36a.3
    text: De feiten, strafbaar gesteld in het eerste en tweede lid, zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel36a
  - number: 36b.1
    text: |-
      Met de opsporing van de bij [artikel 36][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de door Onze Minister van Veiligheid en Justitie
      aangewezen ambtenaren en personen. Deze ambtenaren en personen zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 36b.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel36b
  - number: '38'
    text: |-
      Alle aanspraken, voortvloeiende uit de uitslag van kansbepalingen in een gelegenheid, gegeven met vergunning
      ingevolge deze wet verleend, vervallen na verloop van een jaar na de dag waarop zij zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel38
  - number: '39'
    text: |-
      Artikel 1825 van het Burgerlijk Wetboek is niet van toepassing op prijzen en premies, behaald in gelegenheden,
      gegeven met vergunning ingevolge deze wet verleend.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel39
  - number: '44.1'
    text: Op loterijen, die vóór 1 juli 1905 reeds wettiglijk zijn aangelegd, is deze wet niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel44
  - number: '44.2'
    text: |-
      Loterijen en prijsvragen waarvoor vóór de datum van inwerkingtreding van deze wet vergunning is verleend, worden
      afgewikkeld overeenkomstig de vóór die datum geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel44
  - number: '45'
    text: |-
      Deze wet treedt in werking op een nader door Ons te bepalen tijdstip. Zij kan worden aangehaald als: "Wet op de
      kansspelen".
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel45
