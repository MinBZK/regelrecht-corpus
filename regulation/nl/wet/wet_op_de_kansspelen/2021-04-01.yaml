        paragraaf: '2'
  - number: 35c.5
    text: De bestuurlijke boete komt toe aan de gemeente.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35c
  - number: 35d
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het stellen van financiële
      zekerheid door de houder van een vergunning op grond van deze wet voor het nakomen van de financiële verplichtingen
      uit:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35d
  - number: 35d.a
    text: |-
      de kansspelheffing, bedoeld in [artikel 33e][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33e
        afdeling: '2'
  - number: 35d.b
    text: de bestuurlijke sancties wegens overtredingen van bij of krachtens deze wet gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35d
  - number: 35e.1
    text: |-
      De raad van bestuur kan in het kader van zijn taken genoemd in deze wet, een openbare waarschuwing uitvaardigen
      voordat hij een overtreding van de voorschriften vastgesteld bij of krachtens deze wet, heeft vastgesteld, indien
      dat redelijkerwijs noodzakelijk is om spelers snel en effectief te informeren over mogelijk schadeveroorzakend
      kansspelaanbod.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35e
  - number: 35e.2
    text: |-
      Een kansspelaanbieder wordt uitsluitend met name genoemd in de openbare waarschuwing indien er sprake is van een
      reëel en acuut risico op benadeling van spelers en er sprake is van een redelijk vermoeden van overtreding. In
      de openbare waarschuwing komt duidelijk naar voren dat er nog geen sprake is van een door de raad van bestuur
      vastgestelde overtreding.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35e
  - number: 35e.3
    text: |-
      De uitvaardiging van een openbare waarschuwing waarin een kansspelaanbieder met name wordt genoemd geschiedt niet
      eerder dan nadat vijf werkdagen zijn verstreken na de dag waarop het besluit tot het uitvaardigen van de openbare
      waarschuwing aan hem is bekend gemaakt, tenzij hij het besluit zelf heeft openbaar gemaakt, heeft doen openbaar
      maken of heeft aangegeven geen bedenkingen te hebben tegen eerdere openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35e
  - number: 35e.4
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de werking van het besluit opgeschort totdat de
      voorzieningenrechter uitspraak heeft gedaan of het verzoek is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 35e.5
    text: |-
      Het besluit van de raad van bestuur tot het uitvaardigen van een openbare waarschuwing als bedoeld in het derde lid
      vermeldt behalve de naam van de vergunninghouder in ieder geval het mogelijk schadeveroorzakend kansspelaanbod, de
      inhoud van de openbaarmaking, de gronden waarop het besluit berust alsmede de wijze waarop en de termijn waarna de
      openbare waarschuwing zal worden uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35e
  - number: 35f
    text: |-
      Gegevens die de kansspelautoriteit verkrijgt van andere toezichthoudende instanties en andere overheidsdiensten
      maakt de raad van bestuur alleen openbaar met toestemming van de desbetreffende instantie of dienst.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35f
  - number: '36.1'
    text: |-
      Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de
      [artikelen 1, eerste lid, onder a][ref1], [30b, eerste lid][ref2], [30h, eerste lid][ref3],
      [30m, eerste lid][ref4], en [30t, eerste, tweede en vijfde lid][ref5], zijn misdrijven, voorzover zij opzettelijk
      zijn begaan, en overigens overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel30m
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel30t
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
      - id: ref2
