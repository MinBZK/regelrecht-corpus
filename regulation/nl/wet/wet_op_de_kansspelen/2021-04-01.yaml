---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_kansspelen
regulatory_layer: WET
publication_date: '2024-12-10'
valid_from: '2021-04-01'
bwb_id: BWBR0002469
url: https://wetten.overheid.nl/BWBR0002469/2021-04-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, de verspreide wettelijke bepalingen betreffende
    kansspelen te herzien en in één wet onder te brengen en voorts de tijdelijke bepalingen betreffende
    sportprijsvragen door blijvende te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Behoudens het in [Titel Va][ref1] van deze wet bepaalde is het verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 1.1.a
    text: |-
      gelegenheid te geven om mede te dingen naar prijzen of premies, indien de aanwijzing der winnaars geschiedt door
      enige kansbepaling waarop de deelnemers in het algemeen geen overwegende invloed kunnen uitoefenen, tenzij daarvoor
      ingevolge deze wet vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1
  - number: 1.1.b
    text: |-
      de deelneming hetzij aan een onder a bedoelde gelegenheid, gegeven zonder vergunning ingevolge deze wet, hetzij aan
      een overeenkomstige gelegenheid, gegeven buiten het Rijk in Europa, te bevorderen, daartoe middelen te verschaffen
      of daartoe voor openbaarmaking of verspreiding bestemde stukken in voorraad te hebben;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1
  - number: 1.1.c
    text: |-
      gebruik te maken van een onder a bedoelde gelegenheid, wetende dat voor het geven daarvan geen vergunning ingevolge
      deze wet is verleend;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1
  - number: 1.1.d
    text: |-
      opzettelijk in strijd met de waarheid het vermoeden te wekken dat voor een gelegenheid als onder a bedoeld
      ingevolge deze wet vergunning is verleend, of dat aan de verleende vergunning geen voorschrift of niet al de
      gestelde voorschriften zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1
  - number: '1.2'
    text: Het is verboden te handelen in strijd met de aan de verleende vergunning verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1
  - number: '1.3'
    text: |-
      Het verbod, bedoeld in het eerste lid, onder c, is niet van toepassing ten aanzien van de ambtenaren en personen,
      bedoeld in [artikel 34, eerste lid][ref1], bij de rechtmatige uitoefening van de bevoegdheid, bedoeld in
      [artikel 34c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 34c
        paragraaf: '2'
  - number: 1a.1
    text: |-
      Onder een gelegenheid als bedoeld in [artikel 1, onder a][ref1], wordt tevens begrepen het piramidespel en poker.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
  - number: 1a.2
    text: |-
      Onder het piramidespel wordt verstaan een gelegenheid waarbij deelnemers een goed afgeven of een verplichting
      aangaan teneinde daaruit een voordeel te verwerven dat geheel of ten dele afhankelijk is van de afgifte van een
      goed of het aangaan van een verplichting door latere deelnemers.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1a
  - number: 1b.1
    text: |-
      Het is verboden om op een open televisieprogrammakanaal als bedoeld in
      [artikel 1.1, eerste lid, van de Mediawet 2008][ref1], programma’s aan te laten bieden waarin gelegenheid wordt
      geboden om deel te nemen aan een kansspel als bedoeld in [artikel 1, onder a][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '1'
  - number: 1b.2
    text: |-
      Het is een publieke media-instelling of een commerciële media-instelling als bedoeld in
      [artikel 1.1, eerste lid, van de Mediawet 2008][ref1], verboden televisieprogramma’s uit te zenden waarin
      gelegenheid wordt geboden om deel te nemen aan een kansspel als bedoeld in [artikel 1, onder a][ref2], van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '1'
  - number: '2'
    text: |-
      [Artikel 1][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
  - number: 2.a
    text: gelegenheden als daarin bedoeld, die noch voor het publiek zijn opengesteld, noch bedrijfsmatig worden gegeven;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel2
  - number: 2.b
    text: levensverzekeringen, aangegaan met inachtneming van de daarvoor geldende wettelijke bepalingen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel2
  - number: 2.c
    text: |-
      door een publiekrechtelijk lichaam tegen een niet hogere dan de parikoers voor het publiek opengestelde werkelijke
      geldleningen, die een jaarlijkse en jaarlijks ter beschikking te stellen rente geven, niet lager dan een door Onze
      Minister van Financiën vast te stellen percentage, terwijl aan de schuldbewijzen van die leningen bijkomstig een
      kans op het winnen van premies is verbonden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel2
  - number: '3.1'
    text: |-
      Tenzij deze wet anders bepaalt kan voor een gelegenheid als in [artikel 1, onder a][ref1], bedoeld vergunning
      worden verleend, indien deze gelegenheid wordt opengesteld uitsluitend ten einde met de opbrengst daarvan enig
      algemeen belang te dienen. De vergunning wordt verleend door burgemeester en wethouders van de gemeente waar de
      aanwijzing van de winnaars zal geschieden, indien de prijzen en premies gezamenlijk geen grotere waarde hebben dan
      € 4500 en bij een grotere waarde door de raad van bestuur, bedoeld in [artikel 33a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing voor gelegenheden, waarbij de spelers gemeenschappelijk aan een kansspel
      kunnen deelnemen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel3
  - number: '3.3'
    text: Het eerste lid is niet van toepassing op piramidespelen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel3
  - number: '3.4'
    text: |-
      [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing op de vergunning, bedoeld in het
      eerste lid en, voorzover de vergunning door de raad van bestuur, bedoeld in [artikel 33a][ref2] wordt verleend,
      deze betrekking heeft op een incidenteel kansspel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '4.1'
    text: |-
      Onze Ministers van Veiligheid en Justitie en van Financiën kunnen aan een rechtspersoon met volledige
      rechtsbevoegdheid vergunning verlenen tot het openstellen van een tegen een niet hogere dan de parikoers uit te
      geven werkelijke geldlening, die een jaarlijkse en jaarlijks ter beschikking te stellen rente geeft, niet lager
      dan een door Onze Minister van Financiën vast te stellen percentage, terwijl aan de schuldbewijzen van die lening
      bijkomstig de kans op het winnen van premies is verbonden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4
  - number: '4.2'
    text: |-
      Een vergunning als in lid 1 bedoeld kan alleen worden verleend voor geldleningen, uit te geven teneinde met het
      geplaatste geld enig algemeen belang te dienen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4
  - number: 4a.1
    text: |-
      De houders van vergunningen op grond van deze wet treffen de maatregelen en voorzieningen die nodig zijn om
      verslaving aan de door hen georganiseerde spelen zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.2
    text: |-
      De houders van vergunningen op grond van deze wet geven op zorgvuldige en evenwichtige wijze vorm aan wervings-
      en reclameactiviteiten waarbij in het bijzonder wordt gewaakt tegen onmatige deelneming. Bij wervings- en
      reclameactiviteiten voor kansspelen maakt een houder van een vergunning in ieder geval geen gebruik van
      persoonsgegevens die hij heeft verwerkt in het kader van deelname van die personen aan een ander kansspel als
      bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.3
    text: |-
      Onder zorgvuldige en evenwichtige wervings- en reclameactiviteiten als bedoeld in het tweede lid wordt in ieder
      geval verstaan dat wervings- en reclameactiviteiten niet misleidend zijn en dat bij deze activiteiten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.3.a
    text: |-
      bij iedere activiteit afzonderlijk wordt gewezen op de risico’s van onmatige deelneming aan kansspelen door
      middel van het tonen van een tekst met een dergelijke strekking, opgesteld in samenspraak met representatieve en
      onafhankelijke organisaties die tot doel hebben verslaving aan kansspelen te beperken en te voorkomen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.3.b
    text: aangegeven wordt wat de statistische kans is op het winnen van een prijs, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.3.c
    text: wordt aangegeven of er sprake is van eenmalige deelneming dan wel doorlopende deelneming tot wederopzegging.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.4
    text: |-
      Wervings- en reclameactiviteiten worden in ieder geval geacht misleidend als bedoeld in het derde lid te zijn
      indien daarin informatie wordt verstrekt die:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.4.a
    text: de indruk wekt dat de consument al een prijs heeft gewonnen of zal winnen, of
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.4.b
    text: |-
      de indruk wekt dat de consument door het verrichten van een bepaalde handeling een prijs zal winnen of een ander
      soortgelijk voordeel zal behalen terwijl daarop slechts een kans bestaat.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste tot en
      met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.6
    text: 'De in het vijfde lid bedoelde regels kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.6.a
    text: de inhoud van wervings- en reclameactiviteiten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.6.b
    text: de doelgroepen waarop zodanige activiteiten zijn gericht;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.6.c
    text: de hoeveelheid, de tijdsduur en het tijdstip, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.6.d
    text: de wijze waarop en de plaats waar wervings- en reclameuitingen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4a.7
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4a
  - number: 4b.1
    text: |-
      In verband met het voorkomen van witwassen en het financieren van terrorisme staan de betrouwbaarheid en de
      geschiktheid van de houder van een vergunning op grond van deze wet, van de personen die zijn beleid bepalen of
      mede bepalen en van zijn uiteindelijke belanghebbende buiten twijfel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4b
  - number: 4b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4b
  - number: 4b.3
    text: 'Het eerste lid is niet van toepassing op de houders van een vergunning waaraan:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4b
  - number: 4b.3.a
    text: |-
      ingevolge [artikel 1b, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] een
      vrijstelling is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1b
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1b
  - number: 4b.3.b
    text: |-
      bij of krachtens deze wet vergelijkbare eisen in verband met het voorkomen van witwassen en financieren van
      terrorisme worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4b
  - number: 4c.1
    text: |-
      Een vergunning die ingevolge deze wet door de raad van bestuur, bedoeld in [artikel 33a][ref1], is
      verleend voor een gelegenheid als bedoeld in [artikel 1, eerste lid, onderdeel a][ref2], of voor het
      verrichten van activiteiten als bedoeld in [artikel 7a][ref3], [30b][ref4] of [30h][ref5] en waarop de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref6] van toepassing is, kan worden ingetrokken
      indien de vergunninghouder niet of niet meer voldoet aan de bij of krachtens die wet gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel30b
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
      [ref6]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 7a
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 30b
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002469
        artikel: 30h
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0024282
  - number: 4c.2
    text: |-
      Een vergunning die ingevolge deze wet is verleend door een ander bestuursorgaan dan de raad van bestuur, bedoeld in
      [artikel 33a][ref1], kan worden ingetrokken na een daartoe strekkend advies van de raad van bestuur waaruit volgt
      dat toepassing moet worden gegeven aan het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '5.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gronden waarop een
      aanvraag tot het verlenen of wijzigen van een vergunning als bedoeld in de [artikelen 3][ref1] en [4][ref2] kan
      worden afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel4
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '4'
  - number: '5.2'
    text: |-
      De aanvraag tot het verlenen of wijzigen van een vergunning kan in ieder geval worden afgewezen en
      de vergunning kan in ieder geval worden ingetrokken in het geval en onder de voorwaarden, bedoeld
      in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].
      Voordat de aanvraag wordt afgewezen of de vergunning wordt ingetrokken, kan het
      Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], om een advies als
      bedoeld in [artikel 9 van die wet][ref3] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '5.3'
    text: |-
      De vergunning kan worden verleend onder een beperking verband houdend met de aard en de organisatie van de
      kansspelen. Aan de vergunning kunnen voorschriften worden verbonden in het belang van de verantwoorde, betrouwbare
      en controleerbare organisatie van de kansspelen en de afdracht van de opbrengst. De beperkingen en voorschriften
      kunnen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: '5.4'
    text: 'De vergunning kan in ieder geval worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.4.a
    text: |-
      de gegevens, die met het oog op de verkrijging van de vergunning zijn verstrekt, zodanig onjuist of onvolledig zijn
      gebleken dat op de aanvraag een andere beslissing zou zijn gegeven indien bij de beoordeling daarvan de juiste en
      volledige gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.4.b
    text: niet of niet meer wordt voldaan aan de voorwaarden voor de verlening van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.4.c
    text: een aan de vergunning verbonden voorschrift of een beperking waaronder de vergunning is verleend, is overtreden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.4.d
    text: |-
      onvoldoende medewerking is verleend aan het toezicht op de naleving en de handhaving van de bij of krachtens deze
      wet en de [Wet op de kansspelbelasting][ref1] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002359
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002359
  - number: '5.5'
    text: |-
      De vergunning kan worden geschorst op grond van ernstige vermoedens dat er grond bestaat om de vergunning in te
      trekken.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: '5.6'
    text: De vergunning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: '5.7'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen tevens regels worden gesteld
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.7.a
    text: |-
      de termijn waarbinnen een beschikking op de aanvraag omtrent een vergunning als bedoeld in de [artikelen 3][ref1]
      en [4][ref2] wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel4
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '4'
  - number: 5.7.b
    text: de geldigheidsduur van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.7.c
    text: de beperkingen en voorschriften, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.7.d
    text: de intrekking en schorsing van de vergunning, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.7.e
    text: de organisatie van de kansspelen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: 5.7.f
    text: de verplichtingen van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel5
  - number: '6'
    text: |-
      Voor de behandeling van een aanvraag omtrent een vergunning als bedoeld in de [artikelen 3][ref1], [4][ref2],
      [9][ref3], [14b][ref4], [16][ref5], [24][ref6], [27b][ref7] en [27h][ref8] is overeenkomstig door Onze Minister
      van Veiligheid en Justitie gestelde regels een vergoeding verschuldigd. Als betaling achterwege blijft, wordt de
      aanvraag niet in behandeling genomen. [Artikel 4:5, vierde lid, van de Algemene wet bestuursrecht][ref9] is niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel14b
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0002469#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0002469#Artikel27b
      [ref8]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 14b
      - id: ref5
        bwb_id: BWBR0002469
        artikel: '16'
      - id: ref6
        bwb_id: BWBR0002469
        artikel: '24'
      - id: ref7
        bwb_id: BWBR0002469
        artikel: 27b
      - id: ref8
        bwb_id: BWBR0002469
        artikel: 27h
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 6a.1
    text: |-
      Bij regeling van Onze Minister van Veiligheid en Justitie kan worden bepaald dat de houder van een vergunning
      als bedoeld in de [artikelen 9][ref1], [14b][ref2], [16][ref3], [24][ref4], [27b][ref5] en [27h][ref6] aan Onze
      Minister van Veiligheid en Justitie overeenkomstig bij die regeling te stellen regels voor het gebruik van die
      vergunning eenmalig of periodiek een bedrag is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel14b
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel27b
      [ref6]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 14b
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: '24'
      - id: ref5
        bwb_id: BWBR0002469
        artikel: 27b
      - id: ref6
        bwb_id: BWBR0002469
        artikel: 27h
  - number: 6a.2
    text: Het bedrag, bedoeld in het eerste lid, kan bij dwangbevel worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel6a
  - number: 6a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inning van dat
      bedrag.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel6a
  - number: '7'
    text: |-
      Het is de vergunninghouder verboden, enig voorschrift van een krachtens deze wet uitgevaardigde algemene maatregel
      van bestuur niet in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7
  - number: 7a
    text: |-
      Het in [Titel I][ref1] bepaalde is niet van toepassing op het houden van winkelweekacties en het organiseren van
      kleine kansspelen, indien wordt voldaan aan de bepalingen van deze Titel.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 7b.1
    text: |-
      Onder winkelweekacties worden verstaan die kansspelen, welke voor bijzondere gelegenheden en ten hoogste tweemaal
      per jaar voor een beperkte periode van ten hoogste vier weken worden georganiseerd door een groepering van tien of
      meer ondernemers of filiaalhouders in de detailhandel, het ambacht of het horecabedrijf, die in een of aan elkaar
      grenzende gemeenten hun bedrijf uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7b
  - number: 7b.2
    text: |-
      Voor het houden van winkelweekacties als in lid 1 bedoeld moet vergunning worden verkregen van de Kamer van
      Koophandel, waaronder de gemeente waar de winkelweekactie zal worden gehouden, ressorteert.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7b
  - number: 7b.3
    text: |-
      De vergunning wordt verleend, indien en op voorwaarde dat de prijzen of premies in geld of goederen, die ter
      beschikking van de deelnemers worden gesteld, gezamenlijk geen grotere waarde hebben dan € 11.950,- (elf duizend
      negenhonderd en vijftig euro) en de deelnemersbewijzen door de betreffende ondernemers aan hun afnemers om niet ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7b
  - number: 7b.4
    text: |-
      De Kamer van Koophandel is bevoegd een vergunning niet aanstonds te verlenen, indien een ordelijk verloop van zaken
      zulks gewenst doet zijn; zij kan aan de vergunning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7b
  - number: 7b.5
    text: |-
      De Kamer van Koophandel weigert een gevraagde vergunning of trekt een verleende vergunning in, indien aannemelijk
      is, dat bij de wet of de vergunning gestelde voorschriften niet zullen worden nageleefd of zodanige voorschriften
      niet zijn nageleefd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7b
  - number: 7b.6
    text: |-
      Voor de behandeling van een aanvraag om een vergunning moet een bij algemene maatregel van bestuur vast te stellen
      bedrag worden betaald. De voordracht tot vaststelling of wijziging van deze algemene maatregel van bestuur wordt
      Ons gedaan door Onze Ministers van Veiligheid en Justitie en van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7b
  - number: 7c.1
    text: |-
      Onder het organiseren van het kleine kansspel wordt verstaan het door een ten minste drie jaar bestaande
      Nederlandse vereniging, die krachtens zijn statuten een duidelijk omschreven doel - niet zijnde de beoefening van
      enigerlei vorm van kansspel - beoogt te dienen, ten bate van een genoemd, niet met het algemeen belang in strijd
      zijnd doel beleggen van een bijeenkomst, waar gelegenheid tot het deelnemen aan het kleine kansspel wordt gegeven,
      waarbij de prijzen of premies in geld of goederen, die door de deelnemers aan het spel kunnen worden verkregen,
      geen hogere waarde hebben dan € 400,- per serie of set en de gezamenlijke waarde daarvan niet meer bedraagt dan €
      1.550,- per bijeenkomst.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7c
  - number: 7c.2
    text: |-
      Het is verboden een bijeenkomst, waar gelegenheid tot het deelnemen aan het kleine kansspel wordt gegeven, te
      organiseren:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7c
  - number: 7c.2.a
    text: |-
      indien niet ten minste veertien dagen tevoren aan burgemeester en wethouders van de gemeente, waar de bijeenkomst
      zal plaatsvinden, op door hen aan te geven wijze of bij gebreke vandien bij aangetekend schrijven, mededeling is
      gedaan van de plaats waar en het tijdstip waarop de bijeenkomst wordt georganiseerd,
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7c
  - number: 7c.2.b
    text: indien burgemeester en wethouders zodanige bijeenkomst hebben verboden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7c
  - number: 7c.3
    text: |-
      Burgemeester en wethouders verbieden zodanige bijeenkomst, indien op de, in de in het voorgaande lid bedoelde
      mededeling aangegeven dag in de mede daarin aangemelde lokaliteit reeds een soortgelijke bijeenkomst zal
      plaatsvinden, of indien aannemelijk is dat een of meerdere leden van de vereniging die de bijeenkomst organiseert,
      persoonlijk voordeel daaruit verwerven dan wel dat bij de wet of door hen gestelde voorschriften niet zullen worden
      nageleefd of zodanige voorschriften niet zijn nageleefd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7c
  - number: 7d
    text: |-
      Als klein kansspel in de zin van deze Titel worden aangemerkt het kienspel, vogelpiekspel, rad van avontuur en
      vergelijkbare, bij algemene maatregel van bestuur aan te wijzen vormen van kansspel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7d
  - number: 7e.1
    text: |-
      De in [artikel 7b][ref1] en [artikel 7c][ref2] vastgestelde bedragen worden van rechtswege gewijzigd met een door
      Onze Minister van Veiligheid en Justitie vast te stellen percentage, telkens wanneer de consumentenprijsindex per
      30 september van enig jaar ten minste tien procent afwijkt van het overeenkomstige indexcijfer in het jaar, dat die
      bedragen werden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 7b
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 7c
  - number: 7e.2
    text: De wijziging gaat in op 1 januari volgende op de in het eerste lid genoemde datum.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7e
  - number: 7e.3
    text: |-
      Het percentage van de wijziging wijkt niet meer af van het procentuele verschil tussen de in het eerste lid
      bedoelde indexcijfers dan nodig is om de bedragen vast te stellen op het naastbij gelegen veelvoud van € 50.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel7e
  - number: '8.1'
    text: |-
      Tot het organiseren van de staatsloterij kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen
      van deze titel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel8
  - number: '8.2'
    text: |-
      Onder een staatsloterij wordt verstaan een loterij waarbij door trekking de nummers van de deelnamebewijzen worden
      aangewezen waarop de prijzen vallen en waarbij ten minste 60% van de door de deelnemers betaalde inleg aan prijzen
      wordt uitgeloofd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel8
  - number: '9.1'
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan aan één rechtspersoon met volledige rechtsbevoegdheid voor
      een door hem te bepalen duur vergunning verlenen tot het organiseren van de staatsloterij.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '9.2'
    text: De opbrengst van de staatsloterij - na aftrek van de prijzen en kosten - wordt jaarlijks aan de Staat afgedragen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel9
  - number: '10.1'
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van de staatsloterij.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '10.2'
    text: 'De voorschriften hebben onder meer betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.a
    text: het aantal loterijen dat per jaar wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.b
    text: |-
      de mogelijkheid tot het uitgeven van deelloten, recht gevende op een evenredig deel van de prijs, waarin loten
      kunnen zijn verdeeld;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.c
    text: de maximum verkoopprijs van de loten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.d
    text: de wijze waarop de trekkingen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.e
    text: de eisen aan organisatie en produkt;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.f
    text: de wijze waarop en de voorwaarden waaronder de prijzen betaalbaar zijn;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.g
    text: het van overheidswege te houden toezicht op de naleving;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: 10.2.h
    text: |-
      de inrichting van het jaarlijks door de rechtspersoon van zijn werkzaamheden en de financiële resultaten daarvan
      uit te brengen verslag en de wijze van publikatie van dat verslag.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: '10.3'
    text: De voorschriften kunnen worden gewijzigd en aangevuld.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel10
  - number: '11'
    text: |-
      De ingevolge [artikel 9][ref1] verleende vergunning kan tussentijds door de raad van bestuur, bedoeld in
      [artikel 33a][ref2], worden ingetrokken, indien de ingevolge [artikel 10][ref3] vastgestelde voorschriften worden
      overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel10
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '10'
  - number: '12.1'
    text: |-
      De Algemene Rekenkamer kan het financiële beheer dat door de krachtens [artikel 9][ref1] aangewezen rechtspersoon
      gevoerd is en de jaarlijkse financiële verantwoording daarover onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '9'
  - number: '12.2'
    text: |-
      De [artikelen 7.16][ref1] en
      [7.18, eerste tot en met derde lid en het vijfde en zesde lid, van de Comptabiliteitwet 2016][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
  - number: '13'
    text: |-
      Behoudens ingevolge een door de krachtens [artikel 9][ref1] aangewezen rechtspersoon verleende uitdrukkelijke
      toestemming is het verboden, onverschillig voor welk doel en onverschillig op welke wijze, gebruik te maken van of
      invloed toe te kennen aan de uitslag van de trekkingen in de staatsloterij.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '9'
  - number: '14'
    text: |-
      Behoudens aan degenen die daartoe door de krachtens [artikel 9][ref1] aangewezen rechtspersoon gemachtigd zijn,
      is het aan een ieder verboden bij wijze van beroep of gewoonte loten of gedeelten van loten in de staatsloterij of
      onder deze naam te verkopen, te koop aan te bieden, af te leveren, uit te delen of ten verkoop of ter uitdeling in
      voorraad te hebben, af te lossen of op enige andere wijze de middellijke of onmiddellijke deelneming in voormelde
      loterij open te stellen of te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '9'
  - number: 14a.1
    text: |-
      Tot het organiseren van een instantloterij kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen
      van deze titel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14a
  - number: 14a.2
    text: |-
      Onder instantloterij wordt verstaan een loterij waarbij de prijsbepaling van de winnende loten geschiedt voordat
      een aanvang wordt gemaakt met de uitgifte van de deelnamebewijzen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14a
  - number: 14b.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan met het oog op de belangen van instellingen werkzaam
      ten algemene nutte, in het bijzonder op het gebied van sport en lichamelijke vorming, van de cultuur, het
      maatschappelijk welzijn en de volksgezondheid, aan één rechtspersoon met volledige rechtsbevoegdheid voor een door
      hem te bepalen duur vergunning verlenen tot het organiseren van een instantloterij.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 14b.2
    text: |-
      De opbrengst van de instantloterij - na aftrek van de prijzen en kosten - komt ten goede aan de belangen, die de
      rechtspersoon beoogt te dienen met het organiseren van de instantloterij.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14b
  - number: 14b.3
    text: Van de opbrengst van de instantloterij wordt ten minste 47,5% bestemd voor uitkering aan prijzen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14b
  - number: 14c.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van een instantloterij.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 14c.2
    text: 'De voorschriften hebben onder meer betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.a
    text: het aantal te houden instantloterijen en het aantal uit te geven deelnamebewijzen per instantloterij;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.b
    text: de inrichtingen waar deelnamebewijzen verkrijgbaar worden gesteld en de maximale inleg per deelnamebewijs;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.c
    text: het waarborgen van een eerlijk en betrouwbaar spelverloop en het voorkomen van fraude en misbruik;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.d
    text: de administratie en de dekking van de aan de organisatie verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.e
    text: de wijze van werving en reclame;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.f
    text: de bestemming van de opbrengst van de gehouden instantloterijen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.g
    text: de statuten en reglementen van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.h
    text: het van overheidswege te houden toezicht op de naleving;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.2.i
    text: |-
      de inrichting van het jaarlijks door de rechtspersoon van zijn werkzaamheden en de financiële resultaten daarvan
      uit te brengen verslag en de wijze van publikatie van dat verslag.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14c.3
    text: |-
      Van de voorschriften wordt mededeling gedaan door plaatsing in de *Staatscourant*. Zij kunnen worden gewijzigd
      en aangevuld.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14c
  - number: 14d.1
    text: Als deelnemers mogen niet worden toegelaten personen die nog niet de leeftijd van achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14d
  - number: 14d.2
    text: |-
      Indien als winnaar van een prijs wordt aangewezen een persoon die ingevolge het eerste lid niet als deelnemer
      mocht worden toegelaten of een persoon die bij de deelneming gehandeld heeft in strijd met de door de rechtspersoon
      gestelde voorwaarden, wordt deze deelneming buiten aanmerking gelaten.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14d
  - number: 14e
    text: |-
      De ingevolge [artikel 14b][ref1] verleende vergunning kan tussentijds door de raad van bestuur, bedoeld in
      [artikel 33a][ref2], worden ingetrokken, indien de bij of krachtens deze titel vastgestelde voorschriften worden
      overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel14b
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 14b
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '15.1'
    text: |-
      Tot het organiseren van sportweddenschappen kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen
      van deze titel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel15
  - number: '15.2'
    text: |-
      Onder sportweddenschappen worden verstaan weddenschappen, welke erop zijn gericht deelnemers uitslagen van tevoren
      aangekondigde sportwedstrijden, met uitzondering van harddraverijen en paardenrennen, te doen raden of voorspellen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel15
  - number: '15.3'
    text: |-
      Indien een of meer der aangekondigde sportwedstrijden op de bepaalde dag geen doorgang vinden, kan voor de niet
      gespeelde wedstrijden een vervangende uitslag gelden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel15
  - number: '15.4'
    text: |-
      Aan de deelnemers aan een sportweddenschap kan tevens gelegenheid worden gegeven tot deelneming aan een kansspel
      waarbij de volgnummers van de deelnamebewijzen aan de sportweddenschap de lotnummers vormen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel15
  - number: '16.1'
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan met het oog op de belangen van instellingen werkzaam
      ten algemenen nutte, in het bijzonder op het gebied van sport en lichamelijke vorming, van de cultuur, het
      maatschappelijk welzijn en de volksgezondheid, aan één rechtspersoon met volledige rechtsbevoegdheid voor een door
      hem te bepalen duur vergunning verlenen tot het organiseren van sportweddenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '16.2'
    text: |-
      De opbrengst van een sportweddenschap - na aftrek van de prijzen en kosten - komt ten goede aan de belangen, die de
      rechtspersoon beoogt te dienen met het aanleggen en houden van sportweddenschappen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel16
  - number: '16.3'
    text: |-
      Van de gezamenlijke opbrengst van de ingevolge deze titel en [titel IVa][ref1] georganiseerde kansspelen wordt,
      gerekend over een kalenderjaar, ten minste 47,5% bestemd voor uitkering aan prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: '20.1'
    text: Als deelnemers mogen niet worden toegelaten personen, die nog niet de leeftijd van achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel20
  - number: '20.2'
    text: |-
      Indien als winnaar van een prijs wordt aangewezen een persoon die ingevolge het eerste lid niet als deelnemer
      mocht worden toegelaten of indien als winnaar wordt aangewezen een deelnemer die bij de deelneming gehandeld heeft
      in strijd met de door de rechtspersoon voor deelneming gestelde voorwaarden, wordt de inzending buiten aanmerking
      gelaten.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel20
  - number: '21.1'
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van sportweddenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '21.2'
    text: 'De voorschriften hebben onder meer betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.a
    text: het aantal te houden sportweddenschappen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.b
    text: de wijze van bepaling van de vervangende uitslagen en het prijzenschema;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.c
    text: de administratie en de dekking van de aan de organisatie verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.d
    text: de bestemming van de opbrengst van de gehouden sportweddenschappen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.e
    text: de statuten en reglementen van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.f
    text: het van overheidswege te houden toezicht op de naleving;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.g
    text: |-
      de inrichting van het jaarlijks door de rechtspersoon van zijn werkzaamheden en de financiële resultaten daarvan
      uit te brengen verslag en de wijze van publikatie van dat verslag;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.2.h
    text: het onderkennen en voorkomen van manipulatie met sportwedstrijden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: '21.3'
    text: |-
      De houder van een ingevolge [artikel 16][ref1] verleende vergunning is verplicht informatie over verdachte
      gokpatronen bij de kansspelautoriteit te melden. Bij of krachtens algemene maatregel van bestuur worden nadere
      regels gesteld over hetgeen onder informatie over verdachte gokpatronen wordt verstaan en over de wijze waarop de
      melding aan de kansspelautoriteit moet plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel16
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '16'
  - number: '21.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels en criteria gesteld met betrekking tot de
      vergunning voor het organiseren van sportprijsvragen. Deze regels en criteria hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.4.a
    text: |-
      de sportprijsvragen die op grond van een vergunning mogen worden georganiseerd, waarbij spelregels en andere
      kenmerken van die sportprijsvragen kunnen worden gegeven;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: 21.4.b
    text: regels met betrekking tot het onderkennen en voorkomen van manipulatie met sportwedstrijden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: '21.5'
    text: |-
      De regels en criteria, bedoeld in het vierde lid, worden in beginsel vastgesteld na overleg met de
      kansspelautoriteit, sportbonden en vergunninghouders die sportprijsvragen aanbieden. Tot de regels, bedoeld in het
      vierde lid, onder b, kan een lijst behoren met kansspelen, spelregels en andere kenmerken van die spelen die door
      een vergunninghouder voor het organiseren van sportprijsvragen niet mogen worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel21
  - number: '22'
    text: |-
      De ingevolge [artikel 16][ref1] verleende vergunning kan tussentijds door de raad van bestuur, bedoeld in
      [artikel 33a][ref2], worden ingetrokken, indien de bepalingen van deze titel of de ingevolge [artikel 21][ref3]
      vastgestelde voorschriften worden overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel21
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '21'
  - number: '23.1'
    text: |-
      Tot het organiseren van een totalisator kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen van
      deze titel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel23
  - number: '23.2'
    text: |-
      Onder totalisator wordt verstaan elke gelegenheid, opengesteld om op de uitslag van harddraverijen en paardenrennen
      te wedden, met dien verstande dat het totaal van de inleg, behoudens bij of krachtens de wet toegestane aftrek,
      verdeeld zal worden onder degenen die op de winnaar of op een der prijswinnaars hebben gewed.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel23
  - number: '24'
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan aan één rechtspersoon met volledige rechtsbevoegdheid voor
      een door hem te bepalen duur vergunning verlenen tot het organiseren van een totalisator.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '25.1'
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van een totalisator.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '25.2'
    text: 'De voorschriften hebben onder meer betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.2.a
    text: het aantal draverijen en rennen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.2.b
    text: de maximum inzet per persoon;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.2.c
    text: |-
      het percentage dat vóór de verdeling aan de winnaars der weddenschappen zal worden ingehouden en de bestemming van
      dit percentage;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.2.d
    text: het van overheidswege te houden toezicht op de naleving;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.2.e
    text: |-
      de verplichting om ongeoorloofd wedden of het verlenen van bemiddeling tot wedden op de terreinen waar
      harddraverijen of paardenrennen worden gehouden zoveel mogelijk tegen te gaan en te doen tegengaan;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.2.f
    text: het onderkennen en voorkomen van manipulatie met sportwedstrijden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: '25.3'
    text: De voorschriften kunnen worden gewijzigd en aangevuld.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: '25.4'
    text: |-
      De houder van een ingevolge [artikel 24][ref1] verleende vergunning is verplicht informatie over verdachte
      gokpatronen bij de kansspelautoriteit te melden. Bij of krachtens algemene maatregel van bestuur worden nadere
      regels gesteld over hetgeen onder informatie over verdachte gokpatronen wordt verstaan en over de wijze waarop de
      melding aan de kansspelautoriteit moet plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel24
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '24'
  - number: '25.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels en criteria gesteld met betrekking tot de
      vergunning tot het organiseren van totalisators. Deze regels en criteria hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.5.a
    text: |-
      de totalisators die op grond van een vergunning mogen worden georganiseerd, waarbij spelregels en andere kenmerken
      van die totalisators kunnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: 25.5.b
    text: regels met betrekking tot het onderkennen en het voorkomen van manipulatie met totalisators.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: '25.6'
    text: |-
      De regels en criteria, bedoeld in het vijfde lid, worden in beginsel vastgesteld na overleg met de
      kansspelautoriteit en vergunninghouders die totalisators aanbieden. Tot de regels, bedoeld in het vijfde lid,
      onder b, kan een lijst behoren met kansspelen, spelregels en andere kenmerken van die spelen die door een
      vergunninghouder voor het organiseren van totalisators niet mogen worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel25
  - number: '26'
    text: |-
      De ingevolge [artikel 24][ref1] verleende vergunning kan tussentijds door de raad van bestuur, bedoeld in
      [artikel 33a][ref2], worden ingetrokken, indien de ingevolge [artikel 25][ref3] vastgestelde voorschriften worden
      overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel25
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '25'
  - number: '27'
    text: |-
      Het is verboden aan het publiek bemiddeling aan te bieden of te verlenen bij het afsluiten van weddenschappen bij
      een totalisator.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27
  - number: 27a.1
    text: |-
      Tot het organiseren van een lotto kan uitsluitend vergunning verleend worden overeenkomstig de bepalingen van deze
      titel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27a
  - number: 27a.2
    text: |-
      Onder lotto wordt verstaan een kansspel dat erop gericht is deelnemers een aantal symbolen te doen voorspellen, die
      door loting of trekking worden verkregen uit een van tevoren opgegeven aantal symbolen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27a
  - number: 27a.3
    text: |-
      Aan de deelnemers aan een lotto kan tevens gelegenheid worden gegeven tot deelneming aan een kansspel, waarbij de
      volgnummers van de deelnamebewijzen aan de lotto de lotnummers vormen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27a
  - number: 27b.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan met het oog op de belangen van instellingen werkzaam
      ten algemenen nutte, in het bijzonder op het gebied van sport en lichamelijke vorming, van de cultuur, het
      maatschappelijk welzijn en de volksgezondheid, aan de krachtens [artikel 16][ref2] aangewezen rechtspersoon voor
      een door hem te bepalen duur vergunning verlenen tot het organiseren van lotto's.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel16
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '16'
  - number: 27b.2
    text: |-
      De opbrengst van de lotto - na aftrek van prijzen en kosten - komt ten goede aan de belangen, die de rechtspersoon
      met het aanleggen en houden daarvan beoogt te dienen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27b
  - number: 27b.3
    text: |-
      Van de gezamenlijke opbrengst van de ingevolge deze titel en [titel III][ref1] georganiseerde kansspelen wordt,
      gerekend over een kalenderjaar, ten minste 47,5% bestemd voor uitkering aan prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 27c.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van een lotto.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 27c.2
    text: 'De voorschriften hebben onder meer betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27c.2.a
    text: het aantal te houden lotto's;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27c.2.b
    text: de wijze van prijsbepaling en het prijzenschema;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27c.2.c
    text: de administratie en de dekking van de aan de organisatie verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27c.2.d
    text: de bestemming van de opbrengst van de gehouden lotto's;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27c.2.e
    text: het van overheidswege te houden toezicht op de naleving;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27c.2.f
    text: |-
      de inrichting van het jaarlijks door de rechtspersoon van zijn werkzaamheden en de financiële resultaten daarvan
      uit te brengen verslag en de wijze van publikatie van dat verslag.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27c.3
    text: De voorschriften kunnen worden gewijzigd en aangevuld.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27c
  - number: 27e.1
    text: Als deelnemers mogen niet worden toegelaten personen die nog niet de leeftijd van achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27e
  - number: 27e.2
    text: |-
      Indien als winnaar van een prijs wordt aangewezen een persoon die ingevolge het eerste lid niet als deelnemer
      mocht worden toegelaten of indien als winnaar wordt aangewezen een deelnemer die bij de deelneming gehandeld heeft
      in strijd met de door de rechtspersoon voor deelneming gestelde voorwaarden, wordt de inzending buiten aanmerking
      gelaten.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27e
  - number: 27f
    text: |-
      De ingevolge [artikel 27b][ref1] verleende vergunning kan tussentijds door de raad van bestuur, bedoeld in
      [artikel 33a][ref2], worden ingetrokken, indien de bij of krachtens deze Titel vastgestelde voorschriften worden
      overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27b
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 27g.1
    text: |-
      Tot het organiseren van een speelcasino kan uitsluitend vergunning verleend worden overeenkomstig de bepalingen van
      deze titel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27g
  - number: 27g.2
    text: |-
      Onder speelcasino wordt verstaan de voor het publiek opengestelde of bedrijfsmatig gedreven inrichting, waar door
      middel van gemeenschappelijk beoefende kansspelen aan de deelnemers de gelegenheid wordt gegeven om mede te dingen
      naar prijzen of premies, indien de aanwijzing der winnaars geschiedt door enige kansbepaling, waarop de deelnemers
      in het algemeen geen overwegende invloed kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27g
  - number: 27h.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan aan één rechtspersoon met volledige rechtsbevoegdheid voor
      een door hem te bepalen duur vergunning verlenen tot het organiseren van speelcasino's.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 27h.2
    text: De opbrengst van de speelcasino’s - na aftrek van de prijzen en kosten - strekt ten bate van de schatkist.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27h
  - number: 27h.3
    text: De vestiging van een speelcasino behoeft de voorafgaande instemming van de raad van de betrokken gemeente.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27h
  - number: 27i.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van speelcasino's.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 27i.2
    text: 'De voorschriften hebben onder meer betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.a
    text: de gemeenten waar een speelcasino kan worden gevestigd;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.b
    text: |-
      het aantal en de soort van de te organiseren spelen en de wijze waarop deze worden beoefend, alsmede de overige toe
      te laten activiteiten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.c
    text: |-
      de minimum en de maximum inzet per persoon en per speelkans, alsmede de overige aan deelneming te stellen
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.d
    text: het waarborgen van een eerlijk en betrouwbaar spelverloop en het voorkomen van fraude en misbruik;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.e
    text: de wijze van werving en reclame;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.f
    text: de administratie en de dekking van de aan de organisatie verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.g
    text: de statuten en reglementen van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.h
    text: het van overheidswege te houden toezicht op de naleving;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.i
    text: |-
      de inrichting van het jaarlijks door de rechtspersoon van zijn werkzaamheden en de financiële resultaten daarvan
      uit te brengen verslag en de wijze van publikatie van dat verslag;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.2.j
    text: het voorkomen van kansspelverslaving.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27i.3
    text: |-
      Van de voorschriften wordt mededeling gedaan door plaatsing in de *Staatscourant*. Zij kunnen worden gewijzigd
      en aangevuld.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27i
  - number: 27j.1
    text: |-
      Tot een speelcasino mogen niet worden toegelaten personen die nog niet de leeftijd van achttien jaren hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27j
  - number: 27j.2
    text: |-
      Indien als winnaar van een prijs wordt aangewezen een persoon die ingevolge het eerste lid niet tot een
      speelcasino mocht worden toegelaten of een persoon die bij de deelneming gehandeld heeft in strijd met de door de
      vergunninghouder gestelde voorwaarden, wordt deze deelneming buiten aanmerking gelaten.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27j
  - number: 27ja.1
    text: |-
      Onverminderd het bepaalde bij of krachtens [artikel 4a][ref1], registreert en analyseert de houder van een
      vergunning tot het organiseren van een speelcasino op consequente en eenduidige wijze gegevens met betrekking tot
      het speelgedrag van de speler. Hij kan hierbij gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15
      van de Algemene verordening gegevensbescherming van de speler verwerken voor zover dit noodzakelijk is voor het
      voorkomen van onmatige deelname aan kansspelen of van kansspelverslaving.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 4a
  - number: 27ja.2
    text: |-
      Bij een redelijk vermoeden van onmatige deelname aan kansspelen of kansspelverslaving onderzoekt de
      vergunninghouder het gedrag van de speler in een persoonlijk onderhoud met die speler.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
  - number: 27ja.3
    text: |-
      De vergunninghouder die na het onderzoek, bedoeld in het tweede lid, redelijkerwijs moet vermoeden dat de
      speler door onmatige deelname aan kansspelen of door kansspelverslaving schade kan berokkenen aan zichzelf
      of aan naasten adviseert die speler tot tijdelijke uitsluiting van deelname aan kansspelen, georganiseerd
      in speelcasino’s als bedoeld in [artikel 27g, tweede lid][ref1], in inrichtingen als bedoeld in
      [artikel 30c, eerste lid, onder b][ref2], en op afstand als bedoeld in [artikel 31][ref3], door inschrijving in
      het register, bedoeld in [artikel 33h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '31'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 33h
        afdeling: '3'
  - number: 27ja.4
    text: |-
      De vergunninghouder stelt de raad van bestuur, bedoeld in [artikel 33a][ref1], ervan in kennis, indien de speler,
      bedoeld in het derde lid, zich niet in het daarbedoelde register inschrijft. Hij kan hierbij gebruik maken van het
      burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 27ja.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de voorgaande
      leden. Deze hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
  - number: 27ja.5.a
    text: de registratie en analyse, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
  - number: 27ja.5.b
    text: |-
      de verwerking van persoonsgegevens, de waarborgen voor rechtmatige verwerking van persoonsgegevens en het
      burgerservicenummer, de passende technische en organisatorische maatregelen ter beveiliging van persoonsgegevens en
      het burgerservicenummer tegen verlies of onrechtmatige verwerking en het toezicht daarop;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
  - number: 27ja.5.c
    text: het onderzoek en het advies, bedoeld in het tweede en derde lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
  - number: 27ja.5.d
    text: de kennisgeving, bedoeld in het vierde lid, en de door de vergunninghouder te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27ja
  - number: 27k
    text: |-
      De ingevolge [artikel 27h][ref1] verleende vergunning kan door de raad van bestuur, bedoeld in [artikel 33a][ref2],
      worden ingetrokken, indien de bij of krachtens deze Titel vastgestelde voorschriften worden overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27k
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27h
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 27l.1
    text: |-
      De Algemene Rekenkamer kan het financiële beheer dat door de krachtens [artikel 27][ref1] aangewezen rechtspersoon
      gevoerd is en de jaarlijkse financiële verantwoording daarover onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27h
  - number: 27l.2
    text: |-
      De [artikelen 7.16][ref1] en
      [7.18, eerste tot en met derde lid en het vijfde en zesde lid, van de Comptabiliteitwet 2016][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
  - number: '30'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
  - number: 30.a
    text: |-
      speelautomaat: een toestel, ingericht voor de beoefening van een spel, dat bestaat uit een door de speler in
      werking gesteld mechanisch, elektrisch of elektronisch proces, waarbij het resultaat kan leiden tot de middellijke
      of onmiddellijke uitkering van prijzen of premies, daaronder begrepen het recht om gratis verder te spelen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
  - number: 30.b
    text: |-
      behendigheidsautomaat: een speelautomaat waarvan het spelresultaat uitsluitend kan leiden tot een verlengde
      speelduur of het recht op gratis spellen en het proces, ook nadat het in werking is gesteld, door de speler kan
      worden beïnvloed en het geheel of vrijwel geheel van zijn inzicht en behendigheid bij het gebruik van de daartoe
      geboden middelen afhangt of en in welke mate de spelduur verlengd of het recht op gratis spelen verkregen wordt;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
  - number: 30.c
    text: 'kansspelautomaat: een speelautomaat, die geen behendigheidsautomaat is;'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
  - number: 30.d
    text: |-
      hoogdrempelige inrichting: een inrichting als bedoeld in [artikel 1, eerste lid, van de Drank- en Horecawet][ref1],
      waarin rechtmatig het horecabedrijf als bedoeld in dat artikellid wordt uitgeoefend:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '1'
  - number: 30.d.1°
    text: |-
      waar het café en het restaurantbezoek op zichzelf staat en waar geen andere activiteiten plaatsvinden, waaraan een
      zelfstandige betekenis kan worden toegekend en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
  - number: 30.d.2°
    text: waarvan de activiteiten in belangrijke mate gericht zijn op personen van 18 jaar en ouder.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
  - number: 30.e
    text: |-
      laagdrempelige inrichting: een inrichting als bedoeld in [artikel 1, eerste lid, van de Drank- en Horecawet][ref1],
      waarin rechtmatig het horecabedrijf als bedoeld in dat artikellid wordt uitgeoefend, die geen hoogdrempelige
      inrichting is.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '1'
  - number: 30a.1
    text: |-
      Deze Titel is niet van toepassing op behendigheidsautomaten die zonder middellijke of onmiddellijke betaling of
      inworp door de speler of een derde in werking kunnen worden gesteld en waarvan het spelresultaat niet kan leiden
      tot de onmiddellijke uitkering van prijzen of premies.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30a
  - number: 30a.2
    text: |-
      Deze Titel is niet van toepassing op bij regeling van Onze Minister van Veiligheid en Justitie aangewezen typen
      van speelautomaten die worden gebruikt of bestemd zijn om te worden gebruikt ter gelegenheid van kermissen, en
      die zodanig zijn ingericht, dat het bespelen ervan niet kan leiden tot de uitkering van geldprijzen, of tot de
      onmiddellijke uitkering van premies, waardebonnen of penningen, die een waarde vertegenwoordigen van meer dan het
      veertigvoud van de inzet per spel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30a
  - number: 30b.1
    text: |-
      Het is verboden, behoudens het in deze Titel bepaalde, zonder vergunning van de burgemeester een of meer
      kansspelautomaten aanwezig te hebben
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
  - number: 30b.1.a
    text: op of aan de openbare weg;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
  - number: 30b.1.b
    text: op voor het publiek toegankelijke plaatsen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
  - number: 30b.1.c
    text: 'in niet voor het publiek toegankelijke inrichtingen:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
  - number: 30b.1.c.1°
    text: |-
      waarvoor ingevolge [artikel 3 van de Drank- en Horecawet][ref1] een vergunning voor de uitoefening van het
      horecabedrijf is vereist, of


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
  - number: 30b.1.c.2°
    text: |-
      waarin het hotel-, het pension-, het restaurant-, het café-, het cafetaria-, het lunchroom- of het
      partycateringbedrijf wordt uitgeoefend, of waarin de verstrekking van logies, gepaard gaande met dienstverlening
      of de verstrekking van maaltijden, spijzen of dranken voor verbruik ter plaatse, als bedrijf plaats heeft, niet
      zijnde ondernemingen waarin uitsluitend het contractcateringbedrijf wordt uitgeoefend of waarin uitsluitend
      contractcateringactiviteiten als bedrijf plaats hebben.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
  - number: 30b.2
    text: |-
      Het eerste lid is niet van toepassing op het aanwezig hebben van kansspelautomaten op voor het publiek
      toegankelijke plaatsen, uitsluitend ten behoeve van het verkopen daarvan of van het krachtens een vergunning als
      bedoeld in [artikel 30h, eerste lid][ref1], in gebruik geven daarvan aan anderen ten behoeve van de uitoefening van
      hun bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30h
        paragraaf: '3'
  - number: 30b.3
    text: |-
      [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing op de vergunning, bedoeld in
      [artikel 30c, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30c.1
    text: |-
      De vergunning kan slechts worden verleend, indien zij betreft het aanwezig hebben van een of meer
      kansspelautomaten:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
  - number: 30c.1.a
    text: in een hoogdrempelige inrichting;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
  - number: 30c.1.b
    text: |-
      in een inrichting, anders dan onder a, bestemd om het publiek de gelegenheid te geven een spel door middel van
      kansspelautomaten te beoefenen, indien het houden van een zodanige inrichting krachtens een vergunning van de
      burgemeester bij gemeentelijke verordening is toegestaan.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
  - number: 30c.2
    text: |-
      Bij gemeentelijke verordening wordt het aantal kansspelautomaten vastgesteld waarvoor per inrichting, als bedoeld
      in het eerste lid, vergunning wordt verleend, met dien verstande dat voor een inrichting als bedoeld in het eerste
      lid, onder a, het aantal kansspelautomaten waarvoor vergunning kan worden verleend, op twee wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
  - number: 30c.3
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën inrichtingen worden aangewezen die als laagdrempelige
      inrichtingen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
  - number: 30c.4
    text: |-
      Indien zich binnen een laagdrempelige inrichting een horecalokaliteit als bedoeld in
      [artikel 1, eerste lid, van de Drank- en Horecawet][ref1] bevindt, waarin rechtmatig alcoholhoudende drank voor
      gebruik ter plaatse wordt verstrekt, dan wordt deze lokaliteit als hoogdrempelige inrichting aangemerkt voor de
      toepassing van deze titel, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '1'
  - number: 30c.4.a
    text: |-
      voldaan is aan de voorwaarden, bedoeld in [artikel 30, onder d][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '30'
        paragraaf: '1'
  - number: 30c.4.b
    text: |-
      de overige ruimten in die inrichting door het publiek uitsluitend te bereiken zijn zonder eerst deze lokaliteit
      te betreden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
  - number: 30c.5
    text: |-
      Indien met toepassing van het vierde lid meerdere ruimten binnen een laagdrempelige inrichting als hoogdrempelige
      inrichting kunnen worden aangemerkt, wordt, in afwijking van het vierde lid, met behulp van de omschrijving
      als bedoeld in [artikel 30, onder d][ref1], bepaald of er sprake is van een of van meerdere hoogdrempelige
      inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '30'
        paragraaf: '1'
  - number: 30d.1
    text: |-
      Aan de vergunning kunnen voorschriften en beperkingen verbonden worden, die zo nodig kunnen worden gewijzigd,
      aangevuld of ingetrokken. Aan de vergunning wordt in ieder geval het voorschrift verbonden dat alleen
      kansspelautomaten mogen worden opgesteld, welke in eigendom toebehoren aan personen die in het bezit zijn van de
      in [artikel 30h, eerste lid][ref1], bedoelde vergunning en dat de vergunninghouder zorgdraagt voor een beleid ter
      voorkoming van kansspelverslaving. Indien de omstandigheden ter plaatse daartoe aanleiding geven, worden aan de
      vergunning voorts voorschriften verbonden ten aanzien van de wijze van werving en reclame, gericht tot de speler.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30h
        paragraaf: '3'
  - number: 30d.2
    text: De vergunning wordt voor bepaalde of onbepaalde tijd verleend.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30d
  - number: 30d.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de bij de aanvraag van de vergunning
      verschuldigde vergoeding voor de kosten verbonden aan de behandeling van de aanvraag en de afgifte van de
      vergunning, en voor de kosten verbonden aan het toezicht op de naleving door de vergunninghouder van de bij of
      krachtens deze Titel vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30d
  - number: 30d.4
    text: 'Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30d
  - number: 30d.4.a
    text: |-
      de eisen ten aanzien van het zedelijk gedrag, waaraan de aanvrager van de vergunning voor een inrichting
      als bedoeld in [artikel 30c, eerste lid, onder a en b][ref1], en de bedrijfsleiders en beheerders van deze
      inrichtingen, dienen te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30d.4.b
    text: |-
      de eis dat de bedrijfsleiders en beheerder van de in [artikel 30c, eerste lid, onder a en b][ref1], bedoelde
      inrichtingen dienen te beschikken over voldoende kennis en inzicht met betrekking tot het gebruik van
      kansspelautomaten en de daaraan verbonden risico’s van kansspelverslaving;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30d.4.c
    text: het in het eerste lid gestelde voorschrift over het beleid ter voorkoming van kansspelverslaving.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30d
  - number: 30e.1
    text: 'De vergunning wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
  - number: 30e.1.a
    text: |-
      door het verlenen der vergunning zou worden afgeweken van het bij of krachtens [artikel 30c][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30e.1.b
    text: |-
      niet wordt voldaan aan de krachtens [artikel 30d, vierde lid][ref1], geldende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30d
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30d
        paragraaf: '2'
  - number: 30e.2
    text: 'De vergunning kan voorts worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
  - number: 30e.2.a
    text: |-
      indien de aanvrager de bij of krachtens deze Titel vastgestelde bepalingen heeft overtreden in de drie jaren
      voorafgaande aan het moment van aanvraag van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
  - number: 30e.2.b
    text: |-
      indien de vrees gewettigd is, dat het verlenen der vergunning ernstig gevaar zou opleveren voor de openbare orde,
      veiligheid of zedelijkheid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
  - number: 30e.3
    text: |-
      De vergunning kan ook worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 30e.4
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30e
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 30f.1
    text: 'De vergunning wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
  - number: 30f.1.a
    text: |-
      indien de gegevens, die met het oog op de verkrijging der vergunning zijn verstrekt, zodanig onjuist of onvolledig
      blijken, dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
  - number: 30f.1.b
    text: |-
      indien voor een inrichting, als bedoeld in [artikel 30c, eerste lid, onder a en b][ref1], niet de vergunning van
      kracht is, die ingevolge de voor die inrichting geldende bepalingen is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30f.1.c
    text: |-
      indien niet langer wordt voldaan aan de krachtens [artikel 30d, vierde lid, onder a][ref1], geldende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30d
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30d
        paragraaf: '2'
  - number: 30f.2
    text: 'De vergunning kan voorts worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
  - number: 30f.2.a
    text: indien de vergunninghouder de bij of krachtens deze Titel vastgestelde bepalingen heeft overtreden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
  - number: 30f.2.b
    text: |-
      indien de vrees gewettigd is, dat het van kracht blijven der vergunning ernstig gevaar zou opleveren voor de
      openbare orde, veiligheid of zedelijkheid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
  - number: 30f.3
    text: |-
      De vergunning kan ook worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 30f.4
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 30f.5
    text: |-
      In de gevallen bedoeld in het eerste lid, tweede lid, onder a, en derde lid kan de burgemeester alvorens de
      vergunning in te trekken de vergunninghouder in de gelegenheid stellen binnen een daartoe te bepalen termijn tot
      naleving van de bij of krachtens deze Titel vastgestelde bepalingen of de aan de vergunning verbonden voorschriften
      over te gaan.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
  - number: 30f.6
    text: |-
      Intrekking van de vergunning geschiedt niet voordat de burgemeester van zijn voornemen daartoe de vergunninghouder
      bij aangetekende brief, onder opgave van redenen, mededeling heeft gedaan en hem in de gelegenheid heeft gesteld
      zich in persoon of bij gemachtigde door hem of een door hem aangewezen ambtenaar te doen horen. In het geval
      bedoeld in het tweede lid, onder b, kan, indien dringende omstandigheden zulks vorderen, de vergunning onmiddellijk
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30f
  - number: 30g.1
    text: |-
      Het is de vergunninghouder verboden personen beneden de leeftijd van achttien jaar een kansspelautomaat te laten
      bespelen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30g
  - number: 30g.2
    text: |-
      Het is personen beneden de leeftijd van achttien jaar verboden een kansspelautomaat te bespelen op een locatie als
      bedoeld in [artikel 30b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30b
        paragraaf: '2'
  - number: 30h.1
    text: |-
      Het is verboden zonder vergunning van de raad van bestuur, bedoeld in [artikel 33a][ref1], een of meer
      speelautomaten te exploiteren.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30h.2
    text: |-
      Onder exploiteren wordt verstaan het bedrijfsmatig en als eigenaar gebruiken of aan een ander in gebruik geven van
      een of meer speelautomaten.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30h
  - number: 30i.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30i
  - number: 30i.1.a
    text: |-
      de gegevens, welke bij de aanvraag van een vergunning dienen te worden verstrekt. Deze gegevens bevatten in ieder
      geval de identiteit van de in het tweede lid, onder b, bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30i
  - number: 30i.1.b
    text: de vereiste beschikbaarheid van faciliteiten voor onderhoud en reparatie van speelautomaten.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30i
  - number: 30i.2
    text: 'Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30i
  - number: 30i.2.a
    text: |-
      de bij de aanvraag van de vergunning verschuldigde vergoeding voor de kosten verbonden aan de behandeling van
      de aanvraag en de afgifte van de vergunning, en voor de kosten verbonden aan het toezicht op de naleving door de
      vergunninghouder van de bij of krachtens deze Titel vastgestelde voorschriften en de invordering van die kosten
      verbonden aan dat toezicht;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30i
  - number: 30i.2.b
    text: |-
      de eisen ten aanzien van het zedelijk gedrag, waaraan de aanvrager van de vergunning, en de bedrijfsleiders en
      beheerders van de exploitatie dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30i
  - number: 30i.3
    text: De kosten, bedoeld in het tweede lid, onder a, kunnen bij dwangbevel worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30i
  - number: 30j.1
    text: |-
      Aan de vergunning kunnen uit een oogpunt van toezicht op de naleving van het bij of krachtens deze Titel bepaalde
      voorschriften en beperkingen worden verbonden, die zo nodig kunnen worden gewijzigd, aangevuld of ingetrokken,
      overeenkomstig bij regeling van Onze Minister van Veiligheid en Justitie te stellen regels. Aan de vergunning wordt
      in ieder geval het voorschrift verbonden dat alleen speelautomaten mogen worden opgesteld, indien tot het aanwezig
      hebben daarvan een vergunning is verleend als bedoeld in [artikel 30c][ref1]. Indien de omstandigheden daartoe
      aanleiding geven, worden aan de vergunning voorts voorschriften verbonden ten aanzien van de wijze van werving en
      reclame, gericht tot de speler.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30j
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30j.2
    text: De vergunning wordt voor bepaalde of onbepaalde tijd verleend.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30j
  - number: 30k.1
    text: |-
      De vergunning wordt geweigerd indien niet wordt voldaan aan de krachtens
      [artikel 30i, eerste lid, onder a en b, en tweede lid, onder b][ref1], geldende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30i
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30k
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30i
        paragraaf: '3'
  - number: 30k.2
    text: |-
      De vergunning kan voorts worden geweigerd, indien de aanvrager of de andere in
      [artikel 30i, tweede lid, onder b][ref1], bedoelde personen, de bij of krachtens deze Titel vastgestelde bepalingen
      hebben overtreden in de drie jaren voorafgaande aan het moment van aanvraag van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30i
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30k
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30i
        paragraaf: '3'
  - number: 30k.3
    text: |-
      De vergunning kan ook worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30k
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 30k.4
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30k
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 30l.1
    text: 'De vergunning wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
  - number: 30l.1.a
    text: |-
      indien de gegevens, die met het oog op de verkrijging der vergunning zijn verstrekt, zodanig onjuist of onvolledig
      blijken, dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
  - number: 30l.1.b
    text: |-
      indien de vergunninghouder het in de[ artikelen 30t, eerste lid, onder b, of tweede lid][ref1] bedoelde verbod
      heeft overtreden;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30t
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30t
        paragraaf: '5'
  - number: 30l.1.c
    text: |-
      indien de vergunninghouder gedurende een jaar na de dag van afgifte van de vergunning met de exploitatie geen begin
      heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
  - number: 30l.1.d
    text: |-
      indien niet langer wordt voldaan aan de krachtens [artikel 30i, tweede lid, onder b][ref1], geldende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30i
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30i
        paragraaf: '3'
  - number: 30l.2
    text: |-
      De vergunning kan voorts worden ingetrokken, indien de vergunninghouder of de andere in
      [artikel 30i, tweede lid, onder b][ref1], bedoelde personen de bij of krachtens deze Titel vastgestelde bepalingen
      hebben overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30i
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30i
        paragraaf: '3'
  - number: 30l.3
    text: |-
      De vergunning kan ook worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 30l.4
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 30l.5
    text: |-
      In de gevallen bedoeld in het eerste tot en met het derde lid kan de raad van bestuur, bedoeld in
      [artikel 33a][ref1], alvorens de vergunning in te trekken de vergunninghouder in de gelegenheid stellen binnen een
      daartoe te bepalen termijn tot naleving van de bij of krachtens deze Titel vastgestelde bepalingen of de aan de
      vergunning verbonden voorschriften over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30l
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30m.1
    text: |-
      Het vervaardigen of invoeren van speelautomaten is verboden, tenzij het speelautomaten betreft die overeenstemmen
      met een door de raad van bestuur, bedoeld in [artikel 33a][ref1], toegelaten model en


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30m.1.a
    text: |-
      zij ten bewijze daarvan zijn voorzien van het ingevolge [artikel 30r, eerste lid][ref1], met betrekking tot die
      toelating vastgestelde merkteken, of


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30r
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30r
        paragraaf: '4'
  - number: 30m.1.b
    text: de vervaardiging of invoer geschiedt door de houder van die toelating of diens gemachtigde.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
  - number: 30m.2
    text: 'Het eerste lid is niet van toepassing op speelautomaten:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
  - number: 30m.2.a
    text: die op grond van ouderdom of uiterlijk of uitzonderlijke eigenschappen bijzondere waarde hebben;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
  - number: 30m.2.b
    text: die zijn bestemd voor doorvoer of uitvoer;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
  - number: 30m.2.c
    text: |-
      die zonder enige inworp door de speler in werking kunnen worden gesteld en waarvan het spelresultaat niet kan
      leiden tot de onmiddellijke uitkering van prijzen of premies;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
  - number: 30m.2.d
    text: die zijn bestemd om als model voor toelating te worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30m
  - number: 30n.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven welke gelden als voorwaarden voor de
      toelating van een model speelautomaat. De regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.1.a
    text: |-
      de op het model aangebrachte informatie ten behoeve van de speler met betrekking tot het spel, het spelkarakter,
      het spelverloop en de mogelijke spelresultaten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.1.b
    text: |-
      de deugdelijkheid, de duurzaamheid en de storingsgevoeligheid van de constructie, daaronder begrepen de
      mogelijkheid tot beïnvloeding van het spelproces, anders dan door de aan de speler geboden middelen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.1.c
    text: het waarborgen van een eerlijk en betrouwbaar spelverloop en het voorkomen van fraude en misbruik;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.1.d
    text: |-
      het karakter van het spel en het waarborgen van het toevals- of behendigheidskarakter van het spel en het
      spelverloop.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2
    text: |-
      Met betrekking tot de toelating van een model kansspelautomaat worden voorts bij of krachtens algemene maatregel
      van bestuur regels gegeven ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.a
    text: de automatische registratie van alle inzetten, uitbetalingen en gespeelde spellen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.b
    text: |-
      de op het model aangebrachte informatie ter bescherming van de speler en met betrekking tot de leeftijdsgrens die
      geldt voor het spelen op kansspelautomaten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.c
    text: |-
      de informatie van de speler, daaronder begrepen de informatie van de speler omtrent het spelverloop middels een
      informatiesysteem op de kansspelautomaat;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.d
    text: |-
      een op de kansspelautomaat aanwezige voorziening die de speler noodzaakt tot het instellen van een bedrag dat hij
      maximaal wil verliezen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.e
    text: het in werking stellen van het spelproces en het spel;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.f
    text: de inworp en de inzet, en de vorm en hoogte daarvan;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.g
    text: het spelverloop en de spelduur;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.h
    text: de uitbetaling en de uitkering van prijzen en premies, en de vorm, het moment en de hoogte daarvan;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.i
    text: |-
      de kansen op winst en verlies en de hoogte van de bedragen die, gemeten over een bepaalde tijdsduur, gemiddeld
      gewonnen of verloren kunnen worden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.j
    text: het inworp- en uitbetalingsmechanisme;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.k
    text: andere op de kansspelautomaat aanwezige mechanismen of voorzieningen die een rol spelen in het spelproces;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.l
    text: de aanwezigheid op de kansspelautomaat van geldwisselapparatuur;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.2.m
    text: de verlichting en het geluid van de kansspelautomaat.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
  - number: 30n.3
    text: |-
      Voor de toelating van het model van kansspelautomaten bestemd om te worden opgesteld in een inrichting als bedoeld
      in [artikel 30c, eerste lid, onder b][ref1], kunnen bij of krachtens algemene maatregel van bestuur regels worden
      gesteld ten aanzien van de onderwerpen genoemd in het tweede lid, die afwijken van het bij of krachtens het tweede
      lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30n
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30o.1
    text: |-
      De toelating van een model wordt door de raad van bestuur, bedoeld in [artikel 33a][ref1], op aanvraag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30o.2
    text: |-
      Bij elke aanvraag om toelating van een model dienen te worden overgelegd tekeningen en een beschrijving, welke het
      model zo volledig mogelijk weergeven.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
  - number: 30o.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
  - number: 30o.3.a
    text: de eisen, waaraan bij een aanvraag om toelating van een model dient te worden voldaan;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
  - number: 30o.3.b
    text: |-
      de medewerking, die door de aanvrager aan het onderzoek met het oog op de toelating van een model behoort te worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
  - number: 30o.4
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de bij de aanvraag van de toelating
      verschuldigde vergoeding voor de kosten verbonden aan de behandeling van de aanvraag en de afgifte van de
      verklaring houdende toelating, en voor de kosten verbonden aan het toezicht op de naleving door de houder van de
      toelating van de bij of krachtens deze Titel vastgestelde voorschriften. Daarbij kunnen regels worden gesteld met
      betrekking tot de invordering van deze kosten. Deze kosten kunnen bij dwangbevel worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
  - number: 30o.5
    text: |-
      Bij regeling van Onze Minister van Veiligheid en Justitie worden een of meer instellingen aangewezen die belast
      zijn met het onderzoek met het oog op de toelating van het model van een speelautomaat.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
  - number: 30o.6
    text: |-
      [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing op de toelating, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30o
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 30p.1
    text: |-
      De toelating van een model wordt geweigerd indien niet wordt voldaan aan de krachtens [artikel 30n][ref1] gegeven
      voorschriften of niet de redelijke verwachting bestaat, dat overeenkomstig het model vervaardigde speelautomaten
      aan die voorschriften zullen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30n
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30p
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30n
        paragraaf: '4'
  - number: 30p.2
    text: 'De toelating van een model kan voorts worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30p
  - number: 30p.2.a
    text: |-
      indien de aanvrager de bij of krachtens deze Titel vastgestelde voorschriften heeft overtreden in de drie jaren
      voorafgaande aan het moment van de aanvraag van de toelating van een model;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30p
  - number: 30p.2.b
    text: |-
      indien er naar het oordeel van de raad van bestuur, bedoeld in [artikel 33a][ref1], sprake is van een uit
      maatschappelijk oogpunt onaanvaardbaar spelconcept.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30p
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30q.1
    text: |-
      Indien een model wordt toegelaten, wordt een op naam van de aanvrager gestelde, ondertekende en gedagtekende
      verklaring, houdende de toelating, afgegeven met gebruikmaking van een door de raad van bestuur, bedoeld in
      [artikel 33a][ref1], vast te stellen formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30q
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30q.2
    text: |-
      De voorschriften, vastgesteld krachtens [artikel 30n][ref1], worden, voor zover zij op het toegelaten model
      betrekking hebben, in de verklaring, houdende de toelating, opgenomen. Daarin kan tevens worden bepaald, dat het
      model op een in de verklaring vermelde plaats moet worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30n
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30q
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30n
        paragraaf: '4'
  - number: 30q.3
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan aan een toelating aanvullende voorschriften verbinden
      uit een oogpunt van toezicht dan wel douanecontrole op de naleving van het bij of krachtens deze Titel bepaalde,
      die in de verklaring, houdende de toelating, worden opgenomen. Zij kunnen zo nodig worden gewijzigd, aangevuld
      of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30q
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30q.4
    text: |-
      Een gewaarmerkt afschrift van de in [artikel 30o, tweede lid][ref1], bedoelde tekeningen en beschrijving maakt deel
      uit van de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30o
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30q
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30o
        paragraaf: '4'
  - number: 30q.5
    text: |-
      Van een verklaring, houdende de toelating, wordt mededeling gedaan in de Staatscourant. Daarbij worden in elk geval
      opgenomen de voorschriften, bedoeld in het tweede en derde lid. Van een wijziging, aanvulling of intrekking van de
      in de verklaring opgenomen voorschriften wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30q
  - number: 30r.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], stelt met betrekking tot iedere toelating van een model
      de merktekens vast die ingevolge die toelating op speelautomaten mogen worden aangebracht. Onze Minister van
      Veiligheid en Justitie geeft regels omtrent de afgifte van merktekens en afschriften van de verklaring, houdende
      de toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30r
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30r.2
    text: |-
      De houder van een toelating van een model is met uitsluiting van ieder ander gerechtigd om in of op speelautomaten,
      welke zijn vervaardigd overeenkomstig het model waarvoor een toelating geldt, de met betrekking tot die toelating
      vastgestelde merktekens aan te brengen. De houder kan derden machtigen de merktekens aan te brengen na voorafgaande
      mededeling hiervan aan de raad van bestuur, bedoeld in [artikel 33a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30r
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30r.3
    text: |-
      Het is ieder ander dan degenen bedoeld in het tweede lid verboden in of op speelautomaten de in het eerste lid
      bedoelde merktekens aan te brengen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30r
  - number: 30r.4
    text: |-
      Het met betrekking tot een toegelaten model vastgestelde merkteken moet op naar dat model vervaardigde
      speelautomaten zodanig worden aangebracht, dat het voor een speler zichtbaar is en niet verwijderd kan worden
      zonder de speelautomaat te beschadigen of het merkteken te vernietigen of te beschadigen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30r
  - number: 30s.1
    text: 'De toelating van een model wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
  - number: 30s.1.a
    text: |-
      indien de gegevens, die met het oog op de verkrijging der toelating zijn verstrekt, zodanig onjuist of onvolledig
      blijken, dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
  - number: 30s.1.b
    text: |-
      indien de krachtens [artikel 30n][ref1] gegeven voorschriften zodanig zijn gewijzigd, dat het model onder de
      werking van de gewijzigde voorschriften niet zou zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30n
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30n
        paragraaf: '4'
  - number: 30s.2
    text: |-
      De toelating van een model kan worden ingetrokken, indien de bij of krachtens deze Titel vastgestelde bepalingen
      of de voorschriften, opgenomen in de verklaring houdende de toelating, zijn overtreden door de houder of diens
      gemachtigde, bedoeld in [artikel 30m][ref1] en [artikel 30r, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30m
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30r
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30m
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30r
        paragraaf: '4'
  - number: 30s.3
    text: |-
      In de gevallen bedoeld in het eerste lid, onder a, en het tweede lid kan de raad van bestuur, bedoeld in
      [artikel 33a][ref1], alvorens de toelating in te trekken de houder daarvan in de gelegenheid stellen binnen
      een daartoe te bepalen termijn tot naleving van de bij of krachtens deze Titel vastgestelde bepalingen of de
      voorschriften, opgenomen in de verklaring houdende de toelating, over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30s.4
    text: |-
      De toelating van een model kan worden ingetrokken, indien noch de houder noch een gemachtigde gedurende een
      aaneengesloten periode van drie jaren gebruik heeft gemaakt van het in [artikel 30r, tweede lid][ref1], bedoelde
      recht op speelautomaten een merkteken aan te brengen, tenzij de houder te kennen geeft binnen een termijn van twee
      jaren daar weer gebruik van te zullen gaan maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30r
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30r
        paragraaf: '4'
  - number: 30s.5
    text: |-
      In gevallen waarin de toelating kan worden ingetrokken, kan, in plaats daarvan, een beperking aan de toelating
      worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
  - number: 30s.6
    text: Van de intrekking en van de aan de toelating toegevoegde beperking wordt in de Staatscourant mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30s
  - number: 30t.1
    text: |-
      Het is verboden een of meer speelautomaten, die niet overeenstemmen met het door de raad van bestuur, bedoeld
      in [artikel 33a][ref1], toegelaten model daarvan en die niet ten bewijze daarvan zijn voorzien van het ingevolge
      [artikel 30r, eerste lid][ref2], met betrekking tot die toelating vastgestelde merkteken:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30r
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30r
        paragraaf: '4'
  - number: 30t.1.a
    text: |-
      in de handel te brengen, te verkopen, ten verkoop in voorraad te hebben, ten verkoop aan te bieden of af te
      leveren , met uitzondering van de speelautomaten bedoeld in [artikel 30m, tweede lid, onder a, b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30m
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30m
        paragraaf: '4'
  - number: 30t.1.b
    text: te exploiteren;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
  - number: 30t.1.c
    text: |-
      aanwezig te hebben op plaatsen of in inrichtingen als bedoeld in [artikel 30b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30b
        paragraaf: '2'
  - number: 30t.2
    text: |-
      Het is verboden in of aan een speelautomaat, die wordt gebruikt of die bestemd is om te worden gebruikt in
      inrichtingen of bij gelegenheden als bedoeld in [artikel 30c, eerste lid][ref1] en behendigheidsautomaten op
      kermissen zodanige wijzigingen aan te brengen of te doen aanbrengen, dat deze niet meer overeenstemt met het door
      de raad van bestuur, bedoeld in [artikel 33a][ref2], toegelaten model daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30t.3
    text: |-
      Bij het intrekken van een toelating als bedoeld in [artikel 30s][ref1], kan de raad van bestuur, bedoeld in
      [artikel 33a][ref2], bepalen, dat het eerste lid niet of tijdelijk niet van toepassing is op speelautomaten, die
      voordien ingevolge die toelating rechtmatig van een merkteken zijn voorzien. Het tweede lid is van overeenkomstige
      toepassing met betrekking tot die speelautomaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30s
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30s
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 30t.4
    text: |-
      Van een besluit als bedoeld in het derde lid wordt mededeling gedaan in de Staatscourant tegelijk met de
      mededeling, bedoeld in [artikel 30s, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30s
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30s
        paragraaf: '4'
  - number: 30t.5
    text: |-
      Het is verboden om op grond van het behaalde spelresultaat op een behendigheidsautomaat middellijk of onmiddellijk
      prijzen of premies uit te keren, met uitzondering van een verlengde speelduur of het recht op gratis spellen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30t
  - number: 30u.1
    text: 'Het is de exploitant van een speelautomatenhal verboden personen de toegang te verlenen:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30u.1.a
    text: die de leeftijd van achttien jaren nog niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30u.1.b
    text: waarvan niet op deugdelijke wijze is vastgesteld dat deze de leeftijd van achttien jaren nog niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30u.2
    text: Het is de in het eerste lid, onder a, bedoelde personen verboden in een speelautomatenhal aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30u.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels gegeven worden ten aanzien van de wijze waarop de exploitant
      uitvoering moet geven aan de in het eerste lid bedoelde verboden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30u.4
    text: 'Het eerste en tweede lid zijn niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30u.4.a
    text: speelautomatenhallen waar uitsluitend behendigheidsautomaten staan opgesteld;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30u.4.b
    text: |-
      van een speelautomatenhal deel uitmakende afgescheiden ruimten, waar uitsluitend behendigheidsautomaten staan
      opgesteld en welke men uitsluitend kan betreden of verlaten zonder de overige ruimten van de speelautomatenhal
      te betreden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30u
  - number: 30v.1
    text: |-
      Onverminderd het bepaalde bij of krachtens [artikel 4a][ref1], registreert en analyseert de houder van
      een vergunning tot het aanwezig hebben van een of meer kansspelautomaten in een inrichting als bedoeld in
      [artikel 30c, eerste lid, onder b][ref2], op consequente en eenduidige wijze gegevens met betrekking tot het
      speelgedrag van de speler. Hij kan hierbij gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de
      Algemene verordening gegevensbescherming van de speler verwerken voor zover dit noodzakelijk is voor het voorkomen
      van onmatige deelname aan kansspelen of van kansspelverslaving.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 30v.2
    text: |-
      Bij een redelijk vermoeden van onmatige deelname aan kansspelen of kansspelverslaving onderzoekt de
      vergunninghouder het gedrag van de speler in een persoonlijk onderhoud met die speler.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
  - number: 30v.3
    text: |-
      De vergunninghouder die na het onderzoek, bedoeld in het tweede lid, redelijkerwijs moet vermoeden dat
      de speler door onmatige deelname aan kansspelen of door kansspelverslaving schade kan berokkenen aan
      zichzelf of aan naasten, adviseert die speler tot tijdelijke uitsluiting van deelname aan kansspelen,
      georganiseerd in speelcasino’s als bedoeld in [artikel 27g, tweede lid][ref1], in inrichtingen als bedoeld in
      [artikel 30c, eerste lid, onder b][ref2], en op afstand als bedoeld in [artikel 31][ref3], door inschrijving in
      het register, bedoeld in [artikel 33h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '31'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 33h
        afdeling: '3'
  - number: 30v.4
    text: |-
      De vergunninghouder stelt de raad van bestuur, bedoeld in [artikel 33a][ref1], ervan in kennis, indien de speler,
      bedoeld in het derde lid, zich niet in het daarbedoelde register inschrijft. Hij kan hierbij gebruik maken van het
      burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 30v.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de voorgaande
      leden. Deze hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
  - number: 30v.5.a
    text: de registratie en analyse, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
  - number: 30v.5.b
    text: |-
      de verwerking van persoonsgegevens, de waarborgen voor rechtmatige verwerking van persoonsgegevens en het
      burgerservicenummer, de passende technische en organisatorische maatregelen ter beveiliging van persoonsgegevens en
      het burgerservicenummer tegen verlies of onrechtmatige verwerking en het toezicht daarop;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
  - number: 30v.5.c
    text: het onderzoek en het advies, bedoeld in het tweede en derde lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
  - number: 30v.5.d
    text: de kennisgeving, bedoeld in het vierde lid, en de door de vergunninghouder te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30v
  - number: 30z.1
    text: |-
      Tot het aanwezig hebben en het exploiteren van een of meer speelautomaten in een speelcasino kan uitsluitend
      door de raad van bestuur, bedoeld in [artikel 33a][ref1] vergunning worden verleend. De [paragrafen 2][ref2]
      en [3][ref3] van deze Titel zijn niet van toepassing op het aanwezig hebben en het exploiteren van een of meer
      speelautomaten in een speelcasino.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30z
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002469
        paragraaf: '3'
  - number: 30z.2
    text: |-
      De vergunning kan uitsluitend worden verleend aan de krachtens [artikel 27h, eerste lid][ref1], aangewezen
      rechtspersoon. De vergunning wordt ingetrokken indien niet de vergunning van kracht is, die ingevolge
      [artikel 27h, eerste lid][ref2], vereist is tot het organiseren van een speelcasino.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30z
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27h
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 27h
  - number: 30z.3
    text: |-
      Aan de vergunning worden voorschriften verbonden ten aanzien van het aanwezig hebben en de exploitatie van
      speelautomaten. De voorschriften kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30z
  - number: 30z.4
    text: |-
      Voor de toelating van het model van speelautomaten kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gesteld die afwijken van het bepaalde in [paragraaf 4][ref1] van deze Titel.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30z
    references:
      - id: ref1
        bwb_id: BWBR0002469
        paragraaf: '4'
  - number: 30aa.1
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, als voorzien in
      deze Titel, wordt Ons gedaan door Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30aa
  - number: 30aa.2
    text: |-
      Het ontwerp van een besluit tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als
      voorzien in de[ artikelen 30c, derde lid][ref1], en [30n, tweede en derde lid][ref2], wordt bekend gemaakt in de
      Staatscourant. Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als
      bedoeld in de vorige volzin wordt Ons niet gedaan dan nadat twee maanden na die bekendmaking zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30n
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel30aa
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30n
        paragraaf: '4'
  - number: '31.1'
    text: |-
      Onder een kansspel op afstand wordt verstaan: een gelegenheid als bedoeld in
      [artikel 1, eerste lid, onder a][ref1], die op afstand met elektronische communicatiemiddelen wordt gegeven en
      waaraan wordt deelgenomen zonder fysiek contact met degene die die gelegenheid geeft of die voor deelname aan die
      kansspelen ruimte en middelen ter beschikking stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
  - number: '31.2'
    text: |-
      Tot het organiseren van kansspelen op afstand, anders dan aanbieden van deelnamebewijzen aan de bij of krachtens
      algemene maatregel van bestuur aangewezen kansspelen waarvoor op grond van een andere dan deze titel vergunning is
      verleend, kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen van deze titel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31
  - number: 31a.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan vergunning verlenen tot het organiseren van kansspelen
      op afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 31a.2
    text: |-
      De vergunning tot het organiseren van kansspelen op afstand wordt voor bepaalde tijd verleend en is niet
      overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31a.3
    text: |-
      De vergunning tot het organiseren van kansspelen op afstand kan worden verleend onder een beperking verband
      houdend met de aard van de te organiseren kansspelen. Aan de vergunning kunnen voorschriften in het belang van
      de verantwoorde, betrouwbare en controleerbare organisatie van die kansspelen worden verbonden. De beperkingen en
      voorschriften kunnen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels en criteria gesteld met betrekking tot de
      vergunning tot het organiseren van kansspelen op afstand. Deze regels en criteria hebben in ieder geval betrekking
      op:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31a.4.a
    text: |-
      de kansspelen die op grond van een vergunning tot het organiseren van kansspelen op afstand mogen worden
      georganiseerd, waarbij spelregels en andere kenmerken van die spelen kunnen worden gegeven;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31a.4.b
    text: regels met betrekking tot het onderkennen en voorkomen van manipulatie met sportwedstrijden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31a.4.c
    text: de geldigheidsduur van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31a.4.d
    text: de overgang van de vergunning.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31a.5
    text: |-
      De regels en criteria, bedoeld in het vierde lid, onder a en b, worden in beginsel vastgesteld na overleg met
      de kansspelautoriteit, sportbonden en vergunninghouders van kansspelen op afstand die sportprijsvragen of een
      totalisator aanbieden. Tot de regels als bedoeld in het vierde lid, onder b, kan een lijst behoren met kansspelen,
      spelregels en andere kenmerken van die spelen die door de houder van een vergunning tot het organiseren van
      kansspelen op afstand niet mogen worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31a
  - number: 31b
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de termijn waarbinnen een
      beschikking op de aanvraag omtrent de vergunning tot het organiseren van kansspelen op afstand wordt gegeven, en
      kunnen regels worden gesteld met betrekking tot de indiening en behandeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31b
  - number: 31c.1
    text: |-
      De aanvraag tot het verlenen en wijzigen van een vergunning tot het organiseren van kansspelen op afstand wordt
      afgewezen indien onvoldoende is gewaarborgd dat:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31c
  - number: 31c.1.a
    text: de aanvrager en diens onderneming zullen voldoen aan de bij of krachtens deze wet gestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31c
  - number: 31c.1.b
    text: |-
      de kansspelen op afstand overeenkomstig de bij of krachtens deze wet, de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] en de [Sanctiewet 1977][ref2] gestelde
      voorschriften zullen worden georganiseerd;


      [ref1]: https://wetten.overheid.nl/BWBR0024282
      [ref2]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0024282
      - id: ref2
        bwb_id: BWBR0003296
  - number: 31c.1.c
    text: |-
      het toezicht op naleving en de handhaving van deze wet, de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1], de [Sanctiewet 1977][ref2] en de
      [Wet op de kansspelbelasting][ref3] doelmatig en doeltreffend kan worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
      [ref2]: https://wetten.overheid.nl/BWBR0003296
      [ref3]: https://wetten.overheid.nl/BWBR0002359
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0024282
      - id: ref2
        bwb_id: BWBR0003296
      - id: ref3
        bwb_id: BWBR0002359
  - number: 31c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31c
  - number: 31d.1
    text: 'De vergunning tot het organiseren van kansspelen op afstand kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31d
  - number: 31d.1.a
    text: |-
      de gegevens, die met het oog op de verkrijging van de vergunning zijn verstrekt, zodanig onjuist of onvolledig zijn
      gebleken dat op de aanvraag een andere beslissing zou zijn gegeven indien bij de beoordeling daarvan de juiste en
      volledige gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31d
  - number: 31d.1.b
    text: |-
      niet of niet meer wordt voldaan aan de bij of krachtens deze wet, de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1], de [Sanctiewet 1977][ref2] of de
      [Wet op de kansspelbelasting][ref3] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0024282
      [ref2]: https://wetten.overheid.nl/BWBR0003296
      [ref3]: https://wetten.overheid.nl/BWBR0002359
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0024282
      - id: ref2
        bwb_id: BWBR0003296
      - id: ref3
        bwb_id: BWBR0002359
  - number: 31d.1.c
    text: een aan de vergunning verbonden voorschrift of een beperking waaronder de vergunning is verleend, is overtreden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31d
  - number: 31d.1.d
    text: |-
      onvoldoende medewerking is verleend aan het toezicht op de naleving en de handhaving van de bij of krachtens deze
      wet, de [Sanctiewet 1977][ref1], en de [Wet op de kansspelbelasting][ref2] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
      [ref2]: https://wetten.overheid.nl/BWBR0002359
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0003296
      - id: ref2
        bwb_id: BWBR0002359
  - number: 31d.2
    text: |-
      De vergunning tot het organiseren van kansspelen op afstand kan worden geschorst op grond van ernstige vermoedens
      dat er grond bestaat om de vergunning in te trekken.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31d
  - number: 31d.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31d
  - number: 31e
    text: |-
      Voor de behandeling van een aanvraag omtrent een vergunning tot het organiseren van kansspelen op
      afstand is overeenkomstig door Onze Minister van Veiligheid en Justitie gestelde regels een vergoeding
      verschuldigd. Als betaling achterwege blijft, wordt de aanvraag niet in behandeling genomen.
      [Artikel 4:5, vierde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 31f
    text: |-
      Bij regeling van Onze Minister van Veiligheid en Justitie kan worden bepaald dat de houder van een vergunning
      tot het organiseren van kansspelen op afstand overeenkomstig bij die regeling te stellen regels periodiek een
      bedrag afdraagt aan een of meer instellingen die een algemeen belang dienen, werkzaam op het gebied van sport en
      lichamelijke vorming, cultuur, maatschappelijk welzijn of volksgezondheid. Daarbij kan onderscheid worden gemaakt
      naar de aard van de door die vergunninghouder georganiseerde kansspelen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31f
  - number: 31g.1
    text: |-
      De houder van de vergunning tot het organiseren van kansspelen op afstand heeft zijn statutaire zetel, zijn
      hoofdbestuur of zijn hoofdvestiging in een staat die partij is bij het Verdrag betreffende de werking van de
      Europese Unie of de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
  - number: 31g.2
    text: |-
      De vergunninghouder heeft de rechtsvorm van een naamloze vennootschap of een besloten vennootschap met beperkte
      aansprakelijkheid naar het recht van een staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte, of een Europese vennootschap.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
  - number: 31g.3
    text: |-
      De vergunninghouder verschaft inzicht in de eigendoms- en zeggenschapsstructuur van zijn onderneming, in die van
      het concern waartoe hij behoort en in de persoon van de uiteindelijke belanghebbende. De vergunninghouder is niet
      verbonden met personen in een formele of feitelijke zeggenschapsstructuur die:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
  - number: 31g.3.a
    text: ingevolge het recht van een andere staat dat op die personen van toepassing is, of
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
  - number: 31g.3.b
    text: door de ondoorzichtigheid van die structuur,
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
  - number: 31g.4
    text: De continuïteit van de vergunninghouder is redelijkerwijs gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
  - number: 31g.5
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan ontheffing verlenen van het vereiste, bedoeld in het
      eerste lid, indien de vergunninghouder zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging heeft in
      een derde staat, indien het recht van die staat voldoende waarborgen biedt ten aanzien van de belangen die deze wet
      beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 31g.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      vergunninghouder. Deze regels hebben in ieder geval betrekking op de ontheffing, bedoeld in het vijfde lid, en de
      continuïteit van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31g
  - number: 31h.1
    text: |-
      De houder van een vergunning tot het organiseren van kansspelen op afstand richt zijn bedrijfsvoering zodanig in
      dat een verantwoorde, betrouwbare en controleerbare organisatie van de kansspelen op afstand, alsmede het toezicht
      op naleving van de bij of krachtens deze wet en de [Sanctiewet 1977][ref1] gestelde voorschriften en de handhaving
      daarvan, zijn gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 31h.2
    text: 'Daartoe gebruikt de vergunninghouder in ieder geval passende middelen, processen en procedures die:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.2.a
    text: |-
      voldoen aan de bij of krachtens algemene maatregel van bestuur gestelde technische en operationele vereisten met
      betrekking tot de veiligheid, vertrouwelijkheid, eerlijkheid, continuïteit, betrouwbaarheid, controleerbaarheid en
      geschiktheid van de bedrijfsvoering, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.2.b
    text: |-
      zijn gekeurd door een door Onze Minister aangewezen instelling die door de Raad voor Accreditatie of door een
      andere nationale accreditatie-instantie als bedoeld in [Verordening 765/2008](32008R0765) tot vaststelling van
      de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van
      Verordening (EEG) nr. 339/93 (PbEU L 21) is geaccrediteerd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.3
    text: |-
      De vergunninghouder laat de middelen, processen en procedures in ieder geval op een daartoe strekkende aanwijzing
      van de raad van bestuur, bedoeld in [artikel 33a][ref1], binnen de in die aanwijzing gestelde termijn geheel of
      gedeeltelijk onderwerpen aan een keuring door een instelling als bedoeld in het tweede lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 31h.4
    text: |-
      De vergunninghouder wijst een of meer ter zake kundige functionarissen aan die binnen zijn organisatie
      verantwoordelijk en beschikbaar zijn voor de uitvoering en het interne toezicht op naleving van bij of krachtens
      deze wet gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de bedrijfsvoering
      van de vergunninghouder en de keuring van de middelen, processen en procedures. Daarbij worden in ieder geval
      regels gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5.a
    text: |-
      de aanwijzing van instellingen als bedoeld in het tweede lid, onder b, de intrekking en schorsing van die
      aanwijzing en de verplichtingen van de aangewezen instelling;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5.b
    text: |-
      de gevallen waarin de vergunninghouder de middelen, processen en procedures, bedoeld in het tweede lid, geheel of
      gedeeltelijk laat onderwerpen aan een keuring;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5.c
    text: |-
      de gevallen waarin de raad van bestuur, bedoeld in [artikel 33a][ref1], tijdelijk ontheffing kan verlenen van het
      vereiste, bedoeld in het tweede lid, onder b;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 31h.5.d
    text: |-
      de samenwerking met derden in het belang van de verantwoorde, betrouwbare en controleerbare organisatie van de
      kansspelen op afstand;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5.e
    text: de bescherming van de consument;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5.f
    text: de uitbesteding van onderdelen van de bedrijfsvoering aan derden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5.g
    text: het verrichten van andere activiteiten dan de krachtens de vergunning georganiseerde kansspelen, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31h.5.h
    text: de administratie van de krachtens de vergunning georganiseerde kansspelen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31h
  - number: 31i.1
    text: |-
      De betrouwbaarheid van de houder van de vergunning tot het organiseren van kansspelen op afstand, van de personen
      die zijn beleid bepalen of mede bepalen en van zijn uiteindelijke belanghebbende staat buiten twijfel.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31i
  - number: 31i.2
    text: |-
      De vergunninghouder voert een adequaat beleid dat strekt tot waarborging van de betrouwbaarheid van
      leidinggevenden, van personen op sleutelposities en van personen die bij het organiseren van de kansspelen op
      afstand met spelers in aanraking komen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31i
  - number: 31i.3
    text: |-
      De vergunning kan in ieder geval worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31i
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 31i.4
    text: |-
      Voordat de aanvraag tot het verlenen van een vergunning tot het organiseren van kansspelen
      op afstand wordt afgewezen of een dergelijke vergunning wordt geschorst of ingetrokken,
      kan het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31i
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 31i.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid. Deze regels hebben in ieder geval betrekking op de wijze waarop wordt vastgesteld of de betrouwbaarheid
      van de vergunninghouder en een persoon als bedoeld in het eerste lid buiten twijfel staat en welke feiten en
      omstandigheden daarbij worden betrokken.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31i
  - number: 31j.1
    text: |-
      Het beleid van de houder van de vergunning tot het organiseren van kansspelen op afstand wordt bepaald door
      personen die deskundig zijn in verband met de verantwoorde, betrouwbare en controleerbare organisatie van
      kansspelen op afstand.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31j
  - number: 31j.2
    text: |-
      De vergunninghouder draagt zorg voor passende deskundigheid van de leidinggevenden, van de personen op
      sleutelposities en van de personen die bij het organiseren van kansspelen op afstand met spelers in aanraking
      komen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31j
  - number: 31j.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31j
  - number: 31k.1
    text: |-
      De houder van een vergunning tot het organiseren van kansspelen op afstand biedt een persoon die niet bij hem als
      speler is ingeschreven en aangemeld geen kansspelen op afstand aan.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.2
    text: |-
      De vergunninghouder schrijft een persoon niet in als speler, dan nadat de identiteit van die persoon is vastgesteld
      en is vastgesteld dat:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.2.a
    text: die persoon 18 jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.2.b
    text: |-
      die persoon niet is opgenomen in het register, bedoeld in [artikel 33h][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33h
        afdeling: '3'
  - number: 31k.2.c
    text: die persoon de grenzen van zijn speelgedrag heeft aangegeven.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.3
    text: |-
      De vergunninghouder staat geen aanmelding toe van een persoon ten aanzien van wie hij redelijkerwijs moet vermoeden
      dat deze door onmatige deelname aan kansspelen of door kansspelverslaving schade kan berokkenen aan zichzelf of
      aan naasten.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.4
    text: |-
      Bij de uitvoering van de voorgaande leden kan de vergunninghouder gebruik maken van het burgerservicenummer,
      bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 31k.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inschrijving en
      aanmelding als speler. Daarbij worden in ieder geval regels gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.5.a
    text: de vaststelling van de identiteit, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.5.b
    text: de grenzen van het speelgedrag, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.5.c
    text: de overige voorwaarden voor inschrijving als speler;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.5.d
    text: de schorsing van de inschrijving als speler, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.5.e
    text: de beëindiging van de inschrijving als speler.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
  - number: 31k.6
    text: |-
      De houder van een ingevolge [artikel 31a][ref1] verleende vergunning is verplicht informatie over verdachte
      gokpatronen bij de kansspelautoriteit te melden. Bij of krachtens algemene maatregel van bestuur worden nadere
      regels gesteld over hetgeen onder informatie over verdachte gokpatronen wordt verstaan en over de wijze waarop de
      melding aan de kansspelautoriteit moet plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31a
        afdeling: '2'
  - number: 31l.1
    text: |-
      Betalingen tussen de houder van de vergunning tot het organiseren van kansspelen op afstand en de speler verlopen
      overeenkomstig bij of krachtens algemene maatregel van bestuur gestelde regels.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31l.2
    text: 'De vergunninghouder treft passende waarborgen voor:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31l.2.a
    text: het veilige verloop van de betalingen, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31l.2.b
    text: de afscheiding van de tegoeden van de spelers van ander vermogen of de verzekering van die tegoeden, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31l.2.c
    text: de uitkering van de tegoeden aan de spelers.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31l.3
    text: |-
      De vergunninghouder kan ter uitvoering van het tweede lid, onder b, een of meer bijzondere rekeningen
      aanhouden bij een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1] in
      Nederland het bedrijf van bank mag uitoefenen, welke rekeningen uitsluitend bestemd zijn voor gelden, die
      hij in verband met zijn werkzaamheden als zodanig ten behoeve van spelers onder zich neemt. In dat geval is
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________ van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel19
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '19'
  - number: 31l.3.a
    text: 'voor «gerechtsdeurwaarder» telkens wordt gelezen: vergunninghouder, en'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31l.3.b
    text: 'voor «derden» telkens wordt gelezen: spelers.'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31l.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31l
  - number: 31m.1
    text: |-
      Onverminderd het bepaalde bij of krachtens [artikel 4a][ref1], registreert en analyseert de houder van een
      vergunning tot het organiseren van kansspelen op afstand systematisch gegevens met betrekking tot het speelgedrag
      van de speler. Hij kan hierbij gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming van de speler verwerken voor zover dit noodzakelijk is voor het voorkomen van
      onmatige deelname aan kansspelen of van kansspelverslaving.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 4a
  - number: 31m.2
    text: |-
      Bij een redelijk vermoeden van onmatige deelname aan kansspelen of kansspelverslaving onderzoekt de
      vergunninghouder het gedrag van de speler in een persoonlijk onderhoud met die speler.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
  - number: 31m.3
    text: |-
      De vergunninghouder die na het onderzoek, bedoeld in het tweede lid, redelijkerwijs moet vermoeden dat
      de speler door onmatige deelname aan kansspelen of door kansspelverslaving schade kan berokkenen aan
      zichzelf of aan naasten, adviseert die speler tot tijdelijke uitsluiting van deelname aan kansspelen,
      georganiseerd in speelcasino’s als bedoeld in [artikel 27g, tweede lid][ref1], in inrichtingen als bedoeld in
      [artikel 30c, eerste lid, onder b][ref2], en op afstand als bedoeld in [artikel 31][ref3], door inschrijving in
      het register, bedoeld in [artikel 33h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '31'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 33h
        afdeling: '3'
  - number: 31m.4
    text: |-
      De vergunninghouder stelt de raad van bestuur, bedoeld in [artikel 33a][ref1], ervan in kennis, indien de speler,
      bedoeld in het derde lid, zich niet in het daarbedoelde register inschrijft. Hij kan hierbij gebruik maken van het
      burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 31m.5
    text: |-
      De vergunninghouder stelt gegevens en analyses als bedoeld in het eerste lid geanonimiseerd beschikbaar voor
      onderzoek naar kansspelverslaving.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
  - number: 31m.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de voorgaande
      leden. Deze hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
  - number: 31m.6.a
    text: de registratie en analyse, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
  - number: 31m.6.b
    text: |-
      de verwerking van persoonsgegevens, de waarborgen voor rechtmatige verwerking van persoonsgegevens en het
      burgerservicenummer, de passende technische en organisatorische maatregelen ter beveiliging van persoonsgegevens en
      het burgerservicenummer tegen verlies of onrechtmatige verwerking en het toezicht daarop;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
  - number: 31m.6.c
    text: het onderzoek en het advies, bedoeld in het tweede en derde lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
  - number: 31m.6.d
    text: de kennisgeving, bedoeld in het vierde lid, en de door de vergunninghouder te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel31m
  - number: '33.1'
    text: Er is een kansspelautoriteit.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33
  - number: '33.2'
    text: De kansspelautoriteit is gevestigd te ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33
  - number: '33.3'
    text: De kansspelautoriteit heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33
  - number: 33a
    text: Aan het hoofd van de kansspelautoriteit staat de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33a
  - number: 33b
    text: |-
      De raad van bestuur heeft, tenzij bij of krachtens deze wet anders is bepaald, tot taak het verlenen,
      wijzigen, schorsen en intrekken van vergunningen voor de diverse vormen van kansspelen, exploitatievergunningen en
      modeltoelatingen voor speelautomaten, het beheer van het register, bedoeld in [artikel 33h][ref1], het bevorderen
      van het voorkomen en het beperken van kansspelverslaving, het geven van voorlichting en informatie, het bestrijden
      van niet toegestaan kansspelaanbod, het toezicht op de naleving van de toepasselijke wet- en regelgeving en de
      vergunningen, de handhaving daarvan, alsmede het tegengaan en beperken van manipulatie met sportwedstrijden, voor
      zover deze betrekking heeft op sportwedstrijden waarvoor op grond van [titel III][ref2], [titel IV][ref3] dan wel
      [titel Vb][ref4] van deze wet vergunning is verleend tot het organiseren van kansspelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
      [ref2]: https://wetten.overheid.nl/BWBR0002469
      [ref3]: https://wetten.overheid.nl/BWBR0002469
      [ref4]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33h
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002469
      - id: ref3
        bwb_id: BWBR0002469
      - id: ref4
        bwb_id: BWBR0002469
  - number: 33c.1
    text: De raad van bestuur bestaat uit ten hoogste drie leden, waaronder een voorzitter.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33c
  - number: 33c.2
    text: |-
      De leden worden benoemd voor een periode van ten hoogste zes jaar. De leden kunnen eenmaal worden herbenoemd voor
      een periode van ten hoogste zes jaar.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33c
  - number: 33d.1
    text: |-
      De raad stelt een bestuursreglement vast, waarin in ieder geval regels over de werkwijze en procedures zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33d
  - number: 33d.2
    text: |-
      Het bestuursreglement wordt na de goedkeuring van Onze Minister van Veiligheid en Justitie bekend gemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33d
  - number: 33da.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan een persoon bij een redelijk vermoeden dat deze door
      onmatige deelname aan kansspelen of door kansspelverslaving zichzelf of zijn naasten schade kan berokkenen, door
      inschrijving in het register, bedoeld in [artikel 33h][ref2], voor de duur van zes maanden uitsluiten van deelname
      aan kansspelen, georganiseerd in speelcasino’s als bedoeld in [artikel 27g, tweede lid][ref3], in inrichtingen als
      bedoeld in [artikel 30c, eerste lid, onder b][ref4], en op afstand als bedoeld in [artikel 31][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel31
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33da
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33h
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002469
        artikel: '31'
        afdeling: '1'
  - number: 33da.2
    text: |-
      Een persoon als bedoeld in [artikel 33h, tweede lid, onder b][ref1], wordt slechts in het register opgenomen,
      indien dit noodzakelijk is ter voorkoming van schade als bedoeld in dat onderdeel, en indien aannemelijk is
      geworden dat niet kan worden volstaan met minder ingrijpende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33da
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33h
        afdeling: '3'
  - number: 33da.3
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino, de houder van een vergunning
      tot het aanwezig hebben van een of meer kansspelautomaten in een inrichting als bedoeld in
      [artikel 30c, eerste lid, onder b][ref1], en de houder van de vergunning tot het organiseren van kansspelen op
      afstand verstrekken de raad van bestuur desgevraagd de gegevens en bescheiden die deze behoeft voor de toepassing
      van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33da
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
  - number: 33da.4
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], stelt beleidsregels vast over de wijze waarop de uitsluiting
      bedoeld in het eerste lid en in het tweede lid wordt toegepast. De beleidsregels behoeven de goedkeuring van Onze
      Minister van Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33da
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 33e.1
    text: 'Onder de naam kansspelheffing legt de kansspelautoriteit een bestemmingsheffing op:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
  - number: 33e.1.a
    text: |-
      ter bestrijding en ten hoogste ten bedrage van de geraamde kosten van de kansspelautoriteit in één kalenderjaar van
      de uitoefening van de in [artikel 33b][ref1] genoemde taken, en


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33b
        afdeling: '1'
  - number: 33e.1.b
    text: |-
      ter hoogte van een bij regeling van Onze Minister van Veiligheid en Justitie na overleg met Onze Minister van
      Volksgezondheid, Welzijn en Sport vastgesteld bedrag als bijdrage ter bestrijding van de kosten van de anonieme
      behandeling van kansspelverslaving, van het bevorderen van het voorkomen en het beperken van kansspelverslaving,
      van het geven van voorlichting en informatie omtrent kansspelverslaving en van onderzoek naar kansspelverslaving.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
  - number: 33e.2
    text: |-
      Deze heffing wordt over het kalenderjaar dan wel naar evenredigheid over het aantal maanden van het kalenderjaar
      waarin een verleende vergunning geldig is, geheven van:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
  - number: 33e.2.a
    text: |-
      degene die op grond van de [artikelen 3][ref1], [9, eerste lid][ref2], [14b, eerste lid][ref3],
      [16, eerste lid][ref4], [24][ref5] en [27b, eerste lid][ref6], een vergunning is verleend, waarbij als grondslag de
      nominale waarde van de deelnamebewijzen over een kalenderjaar wordt aangehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel14b
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0002469#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 14b
      - id: ref4
        bwb_id: BWBR0002469
        artikel: '16'
      - id: ref5
        bwb_id: BWBR0002469
        artikel: '24'
      - id: ref6
        bwb_id: BWBR0002469
        artikel: 27b
  - number: 33e.2.b
    text: |-
      degene die op grond van de [artikelen 27h, eerste lid][ref1], [30h, eerste lid][ref2], en [30z, eerste lid][ref3],
      een vergunning is verleend, waarbij als grondslag het aantal speeltafels, het aantal aan die tafels gekoppelde
      spelersterminals, en het aantal spelersplaatsen van speelautomaten wordt aangehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27h
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel30z
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27h
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30h
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 30z
        paragraaf: '8'
  - number: 33e.2.c
    text: |-
      degene die op grond van [artikel 31][ref1] een vergunning is verleend, waarbij als grondslag wordt aangehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '31'
        afdeling: '1'
  - number: 33e.2.c.1°
    text: het verschil tussen de ontvangen inzetten en de ter beschikking gestelde prijzen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
  - number: 33e.2.c.2°
    text: hetgeen anders dan als inzet ontvangen is voor het geven van gelegenheid tot deelneming aan de kansspelen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
  - number: 33e.3
    text: |-
      Voor zover de kansspelautoriteit op grond van
      [artikel 1d, eerste lid, onderdeel f, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      is belast met de uitvoering en handhaving van de bij of krachtens die wet gestelde regels door de instellingen,
      bedoeld in [artikel 1a, vierde lid, onderdeel j, van die wet][ref2], wordt de kansspelheffing tevens geheven ter
      bestrijding en ten hoogste ten bedrage van de geraamde kosten van de kansspelautoriteit in één kalenderjaar van de
      uitoefening van dat toezicht. Deze aanvullende kansspelheffing wordt geheven van genoemde instellingen, voor zover
      deze houder van een vergunning op grond van deze wet zijn. Daarbij wordt de grondslag, bedoeld in het tweede lid,
      voor de desbetreffende categorie vergunninghouder aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1d
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 1a
  - number: 33f.1
    text: |-
      Het tarief van de heffing bedoeld in [artikel 33e, tweede lid, onder a, ][ref1]bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33e
        afdeling: '2'
  - number: 33f.1.a
    text: |-
      € 1 000, indien de nominale waarde van de verkochte deelnamebewijzen hoger is dan € 1 000 000 doch niet hoger is
      dan € 5 000 000;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.1.b
    text: |-
      € 10 000, indien de nominale waarde van de verkochte deelnamebewijzen hoger is dan € 5 000 000 doch niet hoger is
      dan € 20 000 000;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.1.c
    text: |-
      € 50 000, indien de nominale waarde van de verkochte deelnamebewijzen hoger is dan € 20 000 000 doch niet hoger is
      dan € 50 000 000;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.1.d
    text: |-
      € 50 000 vermeerderd met één vijfhonderste deel van het bedrag waarmee het drempelbedrag overstegen wordt, indien
      de nominale waarde van de verkochte deelnamebewijzen het drempelbedrag van € 50 000 000 overstijgt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.2
    text: |-
      Het tarief van de heffing bedoeld in [artikel 33e, tweede lid, onder b][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33e
        afdeling: '2'
  - number: 33f.2.a
    text: 'voor tafelspelen in een speelcasino: € 2.125 per speeltafel en € 123 per aangekoppelde spelersterminal;'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.2.b
    text: 'voor kansspelautomaten bestemd voor opstelling in een speelcasino: € 219 per spelersplaats;'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.2.c
    text: 'voor kansspelautomaten bestemd voor opstelling in een speelautomatenhal: € 119 per spelersplaats;'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.2.d
    text: 'voor kansspelautomaten bestemd voor opstelling in een hoogdrempelige inrichting: € 79 per spelersplaats.'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.3
    text: |-
      Het tarief van de heffing bedoeld in [artikel 33e, tweede lid, onder c, subonderdelen 1° en 2°][ref1], bedraagt
      1,75%, respectievelijk 1,75% van de grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33e
        afdeling: '2'
  - number: 33f.4
    text: |-
      Overeenkomstig bij regeling van Onze Minister van Veiligheid en Justitie te stellen regels verstrekt de
      vergunninghouder op de daarbij vastgestelde wijze en binnen de daarbij vastgestelde termijn de gegevens en
      bescheiden die voor de vaststelling van de heffing van belang kunnen zijn en verstrekt hij op verzoek van
      de kansspelautoriteit de nadere gegevens en bescheiden die de kansspelautoriteit voor de vaststelling van de
      kansspelheffing behoeft.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.5
    text: |-
      Indien de vergunninghouder niet binnen de daartoe gestelde termijn de gegevens en bescheiden, bedoeld in het vierde
      lid, heeft verstrekt of kennelijk onjuiste of onvolledige gegevens heeft verstrekt, kan de kansspelautoriteit een
      schatting doen van de gegevens die voor de vaststelling van de heffing van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.6
    text: |-
      De kansspelautoriteit kan een voorlopige kansspelheffing opleggen tot ten hoogste het bedrag waarop de
      kansspelheffing met toepassing van de verrekening, bedoeld in het zevende lid, van eerdere voorlopige
      kansspelheffingen vermoedelijk zal worden vastgesteld. Indien het bedrag in termijnen kan worden betaald, vermeldt
      de beschikking de te betalen geldsommen en de termijnen waarbinnen de betalingen moeten plaatsvinden. De voorlopige
      heffing wordt niet vastgesteld voor aanvang van het kalenderjaar waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.7
    text: De voorlopige kansspelheffing wordt verrekend met de kansspelheffing.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.8
    text: De kansspelheffing en de voorlopige kansspelheffing kunnen bij dwangbevel worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.9
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de heffing.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33f.10
    text: |-
      De in het eerste en tweede lid genoemde bedragen en de in het derde lid genoemde percentages kunnen bij
      ministeriële regeling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33f
  - number: 33g.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan persoonsgegevens,
      daaronder begrepen persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] en gegevens over gezondheid
      als bedoeld in artikel 4, onderdeel 15 van de Algemene verordening gegevensbescherming, verwerken, voor zover die
      verwerking noodzakelijk is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 33g.1.a
    text: de uitvoering van deze wet;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.1.b
    text: |-
      het toezicht op naleving van de bij of krachtens deze wet gestelde of aan de op grond van deze wet verleende
      vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.1.c
    text: |-
      de handhaving van de bij of krachtens deze wet gestelde of aan de op grond van deze wet verleende vergunning
      verbonden voorschriften, of
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.1.d
    text: |-
      administratieve samenwerking met andere instanties overeenkomstig [artikel 34m][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34m
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 34m
        paragraaf: '4'
  - number: 33g.2
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], en de ambtenaren en personen, bedoeld in [artikel 34][ref2],
      verstrekken elkaar de gegevens die deze behoeven ter uitvoering van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
  - number: 33g.3
    text: |-
      Onze Minister van Veiligheid en Justitie, de rijksbelastingdienst, de Inspectie SZW en andere in het
      reglement, bedoeld in het zesde lid, aangewezen bestuursorganen en toezichthouders zijn bevoegd uit eigen
      beweging of verplicht desgevraagd de raad van bestuur, bedoeld in [artikel 33a][ref1], en de ambtenaren
      en personen, bedoeld in [artikel 34][ref2], de gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van hun taken. Daarbij kan gebruik worden gemaakt van het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref3], en van andere, bij regeling van
      Onze Minister van Veiligheid en Justitie aangewezen nummers.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 33g.4
    text: |-
      Onverminderd artikel 6 van de Algemene verordening gegevensbescherming mogen de gegevens, bedoeld in het eerste
      lid, slechts worden verwerkt mits de uitvoering van de taak met het oog waarop de gegevens zijn verstrekt, daartoe
      noodzaakt.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.5
    text: |-
      De in het tweede en derde lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.6
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], beschikt over een reglement waarin in ieder geval regels zijn
      gesteld met betrekking tot de wijze waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 33g.6.a
    text: de verwerking van persoonsgegevens plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.6.b
    text: |-
      de persoonsgegevens door passende technische en organisatorische maatregelen worden beveiligd tegen verlies of
      onrechtmatige verwerking.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.7
    text: |-
      Het reglement, bedoeld in het zesde lid, bevat voorts regels met betrekking tot de bestuursorganen,
      toezichthouders, instanties of personen waarmee gegevens kunnen worden uitgewisseld, de wijze waarop gegevens
      kunnen worden verstrekt en de doorlevering en vernietiging van gegevens.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.8
    text: |-
      Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld met betrekking tot de
      vorige leden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
  - number: 33g.9
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], is verwerkingsverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 33h.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], houdt een register van personen die tijdelijk
      zijn uitgesloten van deelname aan kansspelen, georganiseerd in een inrichting als bedoeld in
      [artikel 30c, eerste lid, onder b][ref2], in een speelcasino als bedoeld in [artikel 27g, tweede lid][ref3], en
      op afstand als bedoeld in [artikel 31, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel31
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30c
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref4
        bwb_id: BWBR0002469
        artikel: '31'
        afdeling: '1'
  - number: 33h.2
    text: 'Het register heeft tot doel het voorkomen van deelname aan kansspelen als bedoeld in het eerste lid door personen:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.2.a
    text: die tijdelijk niet willen deelnemen aan kansspelen als bedoeld in het eerste lid, of
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.2.b
    text: |-
      ten aanzien van wie redelijkerwijs kan worden aangenomen dat deze door onmatige deelname aan kansspelen of door
      kansspelverslaving zichzelf of zijn naasten schade kunnen berokkenen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.3
    text: 'Het register bevat gegevens met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.3.a
    text: de in het register opgenomen personen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.3.b
    text: de periode van uitsluiting van deelname als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.3.c
    text: de aan de registratie ten grondslag liggende redenen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.3.d
    text: de herkomst van de in het register opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.4
    text: 'Uit het register worden slechts gegevens verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.4.a
    text: |-
      de houders van een vergunning tot het organiseren van kansspelen als bedoeld in het eerste lid, voor zover het
      betreft de enkele indicatie of een persoon in het register is opgenomen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.4.b
    text: |-
      de ambtenaren, bedoeld in [artikel 34, eerste lid][ref1], voor zover dat noodzakelijk is voor het toezicht op
      naleving van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
  - number: 33h.4.c
    text: |-
      de raad van bestuur, bedoeld in [artikel 33a][ref1], voor zover dat noodzakelijk is voor de uitvoering van zijn
      taken op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 33h.5
    text: |-
      Bij de verwerking van persoonsgegevens kan gebruik worden gemaakt van het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 33h.6
    text: 'De raad van bestuur haalt de inschrijving in het register door:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.6.a
    text: na afloop van de termijn van uitsluiting als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.6.b
    text: op verzoek van de ingeschreven persoon.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.7
    text: |-
      De in het register opgenomen gegevens worden na afloop van de uitsluiting onverwijld geanonimiseerd en voor
      beleidsontwikkeling en statistische doeleinden buiten het register geplaatst.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het register en het
      gebruik van het burgerservicenummer. Deze regels hebben in ieder geval betrekking op de gegevens, bedoeld in het
      derde lid, en de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.8.a
    text: de verwerking van persoonsgegevens, waaronder het burgerservicenummer plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.8.b
    text: |-
      de persoonsgegevens, waaronder het burgerservicenummer door passende technische en organisatorische maatregelen
      worden beveiligd tegen verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.8.c
    text: |-
      wordt gewaarborgd dat de verwerkte persoonsgegevens, waaronder het burgerservicenummer slechts worden verwerkt voor
      de preventie en behandeling van kansspelverslaving, en hoe daarop wordt toegezien.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
  - number: 33h.9
    text: |-
      Met betrekking tot het beheer van en de verstrekkingen uit het register is de raad van bestuur, bedoeld in
      [artikel 33a][ref1], de verwerkingsverantwoordelijke in de zin van artikel 4 van de Algemene verordening
      gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '34.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van
      [titel VA., paragraaf 2][ref1], zijn belast de bij besluit van de raad van bestuur van de kansspelautoriteit
      aangewezen ambtenaren en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002469
        paragraaf: '2'
  - number: '34.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens [titel VA., paragraaf 2][ref1], zijn belast de
      bij besluit van de burgemeester aangewezen ambtenaren en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002469
        paragraaf: '2'
  - number: '34.3'
    text: Van een besluit als bedoeld in het eerste en tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34
  - number: 34a
    text: |-
      Onder zaak in de zin van [5:18 van de Algemene wet bestuursrecht][ref1] wordt mede begrepen de software die
      gebruikt wordt bij de deelname, de trekking en uitbetaling van een kansspel en de software die de uitkomst van een
      spel bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 34b
    text: |-
      De op grond van [artikel 34][ref1] aangewezen ambtenaren en personen hebben bij de uitoefening van hun taak toegang
      tot de elektronische apparatuur, met inbegrip van netwerken, die naar vermoeden gebruikt wordt bij kansspelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
  - number: 34c.1
    text: |-
      De ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref1], zijn bevoegd tot deelname aan kansspelen op
      afstand als bedoeld in [artikel 31][ref2], onder verstrekking van onjuiste of onvolledige gegevens met betrekking
      tot hun identiteit, voor zover dat voor de vervulling van hun taken redelijkerwijs noodzakelijk is. Zij brengen de
      organisator van die kansspelen daarbij niet tot andere overtredingen dan waarop diens opzet reeds was gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel31
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '31'
        afdeling: '1'
  - number: 34c.2
    text: |-
      De ambtenaar of persoon die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan een
      schriftelijk verslag op waarin hij vermeldt:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34c.2.a
    text: zijn naam en zijn hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34c.2.b
    text: de reden voor het gebruik van die bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34c.2.c
    text: de voorschriften op de naleving of handhaving waarvan wordt toegezien;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34c.2.d
    text: |-
      het elektronische adres en, voor zover bekend, de omschrijving van degene die de kansspelen op afstand
      organiseerde;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34c.2.e
    text: de onjuiste of onvolledige gegevens die bij de deelname zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34c.2.f
    text: de wijze waarop de deelname en het tijdvak waarin de deelname heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34c.2.g
    text: hetgeen tijdens het onderzoek is verricht, gebleken en overigens is voorgevallen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34c
  - number: 34d
    text: |-
      De ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref1], zijn bevoegd om
      bedrijfsruimten en voorwerpen te verzegelen, voor zover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 34e
    text: |-
      De ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref1], zijn bevoegd een woning zonder
      toestemming van de bewoner te betreden en te doorzoeken, voor zover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 34f.1
    text: |-
      Voor het betreden of het doorzoeken, bedoeld in [artikel 34e][ref1], is een voorafgaande machtiging vereist van de
      rechter-commissaris, belast met de behandeling van strafzaken, bij de rechtbank te Rotterdam. De machtiging kan bij
      wijze van voorzorgsmaatregel worden gevraagd. De machtiging wordt zo mogelijk getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34e
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 34e
        paragraaf: '2'
  - number: 34f.2
    text: |-
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing. De rechter-commissaris
      kan het openbaar ministerie horen alvorens te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 34f.3
    text: |-
      Tegen de beslissing van de rechter-commissaris staat voor zover het verzoek om een machtiging niet is toegewezen,
      voor de raad van bestuur, bedoeld in [artikel 33a][ref1], binnen veertien dagen beroep open bij de rechtbank te
      Rotterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 34f.4
    text: Het betreden of het doorzoeken vindt plaats onder toezicht van de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34f
  - number: 34f.5
    text: |-
      De [artikelen 2][ref1] en [3 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
  - number: 34g.1
    text: |-
      Een machtiging als bedoeld in [artikel 34f][ref1] is met redenen omkleed en ondertekend en vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34f
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 34f
        paragraaf: '2'
  - number: 34g.1.a
    text: de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
  - number: 34g.1.b
    text: de naam of het nummer en de hoedanigheid van degene aan wie de machtiging is gegeven;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
  - number: 34g.1.c
    text: de wettelijke bepalingen waarop de doorzoeking en het binnentreden berusten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
  - number: 34g.1.d
    text: het doel en voorwerp van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
  - number: 34g.1.e
    text: de dagtekening.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
  - number: 34g.2
    text: |-
      Indien het betreden of het doorzoeken dermate spoedeisend is dat de machtiging niet tevoren op schrift kan worden
      gesteld, zorgt de rechter-commissaris zo spoedig mogelijk voor de opschriftstelling.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
  - number: 34g.3
    text: De machtiging blijft ten hoogste van kracht tot en met de derde dag na die waarop zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
  - number: 34g.4
    text: |-
      [Artikel 6 van de Algemene wet op het binnentreden][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel6
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34g
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '6'
  - number: 34h.1
    text: |-
      De ambtenaar of persoon die is binnengetreden of een doorzoeking als bedoeld in [artikel 34e][ref1] heeft
      verricht, maakt op zijn ambtseed of ambtsbelofte een schriftelijk verslag op omtrent het binnentreden of de
      doorzoeking.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34e
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 34e
        paragraaf: '2'
  - number: 34h.2
    text: 'In het verslag vermeldt hij:'
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.2.a
    text: zijn naam of nummer en zijn hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.2.b
    text: de dagtekening van de machtiging en de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.2.c
    text: de wettelijke bepalingen waarop de doorzoeking en het binnentreden berusten;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.2.d
    text: |-
      de plaats waar is binnengetreden of is doorzocht en de naam van degene bij wie is binnengetreden of de doorzoeking
      is verricht;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.2.e
    text: de wijze van binnentreden en het tijdstip waarop de doorzoeking is begonnen en is beëindigd;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.2.f
    text: hetgeen tijdens het onderzoek is verricht en overigens is voorgevallen;
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.2.g
    text: |-
      de namen of nummers en de hoedanigheid van de overige personen die zijn binnengetreden of aan de doorzoeking hebben
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.3
    text: |-
      Het verslag wordt uiterlijk op de vierde dag na die waarop is binnengetreden of de doorzoeking is beëindigd,
      toegezonden aan de rechter-commissaris die de machtiging heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.4
    text: |-
      Een afschrift van het verslag wordt uiterlijk op de vierde dag na die waarop is binnengetreden of de doorzoeking is
      beëindigd, aan degene bij wie is binnengetreden of bij wie de doorzoeking is verricht, uitgereikt of toegezonden.
      Indien het doel van het onderzoek daartoe noodzaakt, kan deze uitreiking of toezending worden uitgesteld.
      Uitreiking of toezending geschiedt in dat geval, zodra het belang van dit doel het toestaat. Indien het niet
      mogelijk is het afschrift uit te reiken of toe te zenden, houdt de rechter-commissaris of de ambtenaar of persoon
      die is binnengetreden of de doorzoeking heeft verricht, het afschrift gedurende zes maanden beschikbaar voor degene
      bij wie is binnengetreden of bij wie de doorzoeking is verricht.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
  - number: 34h.5
    text: |-
      De [artikelen 10][ref1] en [11 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel11
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34h
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '11'
  - number: 34i.1
    text: |-
      De ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref1], zijn bevoegd tot inbeslagneming van daarvoor
      vatbare voorwerpen. Zij kunnen daartoe hun uitlevering vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
  - number: 34i.2
    text: |-
      Vatbaar voor inbeslagneming zijn voorwerpen die kennelijk zijn bestemd voor het organiseren van kansspelen en
      die van zodanige aard zijn dat het ongecontroleerde bezit ervan in strijd is met het belang van de verantwoorde,
      betrouwbare en controleerbare organisatie van kansspelen overeenkomstig deze wet.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
  - number: 34i.3
    text: |-
      Van de inbeslagneming en van de gronden daartoe doet de ambtenaar of persoon die de inbeslagneming heeft verricht,
      zo spoedig mogelijk schriftelijk mededeling aan degene op wie de inbeslagneming heeft plaatsgehad. In geval
      van inbeslagneming op onbekende personen geschiedt die mededeling in het openbaar volgens bij regeling van Onze
      Minister van Veiligheid en Justitie te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
  - number: 34i.4
    text: |-
      Krachtens het eerste lid in beslag genomen voorwerpen vervallen zonder rechtsvervolging aan de staat, tenzij bij
      besluit van de raad van bestuur, bedoeld in [artikel 33a][ref1], of bij een rechterlijke beslissing als bedoeld in
      het zesde lid de inbeslagneming niet wordt gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 34i.5
    text: |-
      De belanghebbende bij het in beslag genomen voorwerp kan binnen een maand na de mededeling omtrent de
      inbeslagneming bij de rechtbank van het arrondissement binnen hetwelk de inbeslagneming heeft plaatsgehad,
      daartegen hetzij in persoon, hetzij door een gemachtigde een met redenen omkleed klaagschrift indienen.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
  - number: 34i.6
    text: |-
      De rechtbank behandelt het klaagschrift op de voet van het bepaalde in
      [artikel 552b van het Wetboek van Strafvordering][ref1], met dien verstande, dat ook de ambtenaar of persoon die
      de inbeslagneming heeft verricht, in de gelegenheid wordt gesteld tijdens de behandeling te worden gehoord en hem,
      zo hij voor de behandeling is verschenen, tijdig tevoren door de griffier schriftelijk mededeling van de dag der
      uitspraak wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552b
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552b
  - number: 34i.7
    text: |-
      [Artikel 552d van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552d
  - number: 34i.8
    text: |-
      Bij regeling van Onze minister van Veiligheid en Justitie worden regels gesteld met betrekking tot de opslag
      van de inbeslaggenomen voorwerpen, de voorwaarden waaronder die opslag plaats vindt en de vernietiging van de
      inbeslaggenomen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
  - number: 34i.9
    text: |-
      De kosten verbonden aan de opslag en de vernietiging, bedoeld in het achtste lid, zijn voor rekening van de
      overtreder. De raad van bestuur, bedoeld in [artikel 33a][ref1], kan deze kosten invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34i
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 34j
    text: |-
      De ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref1], oefenen de bevoegdheden, bedoeld in
      de [artikelen 5.17][ref2], [5.18][ref3] en [5.19 van de Algemene wet bestuursrecht][ref4], de bevoegdheid
      tot verzegeling, bedoeld in [artikel 34d][ref5], de bevoegdheid tot binnentreden en doorzoeken, bedoeld in
      [artikel 34e][ref6], en de bevoegdheid tot inbeslagneming, bedoeld in [artikel 34i][ref7], zo nodig uit met
      behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel34d
      [ref6]: https://wetten.overheid.nl/BWBR0002469#Artikel34e
      [ref7]: https://wetten.overheid.nl/BWBR0002469#Artikel34i
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34j
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0002469
        artikel: 34d
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0002469
        artikel: 34e
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0002469
        artikel: 34i
        paragraaf: '2'
  - number: 34k.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ten aanzien van houders van een vergunning op grond van deze
      wet worden voorzien in een verplichting tot:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34k
  - number: 34k.1.a
    text: |-
      het administreren en beheren van gegevens en bescheiden die van belang zijn voor het toezicht op naleving van de
      bij of krachtens deze wet gestelde regels, en
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34k
  - number: 34k.1.b
    text: |-
      het periodiek en incidenteel verstrekken van gegevens en bescheiden als bedoeld onder a aan raad van bestuur,
      bedoeld in [artikel 33a][ref1], en aan de ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34k
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
  - number: 34k.2
    text: |-
      De raad van bestuur kan bepalen dat gegevens of bescheiden als bedoeld in het eerste lid in persoon worden
      verstrekt of toegelicht door de door hem daarbij te bepalen functionaris van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34k
  - number: 34k.3
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen regels worden gesteld met
      betrekking tot de administratie, het beheer en de verstrekking van de gegevens, bedoeld in het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34k
  - number: 34l
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de elektronische toegang
      van:
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34l
  - number: 34l.a
    text: |-
      de ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34l
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
  - number: 34l.b
    text: |-
      functionarissen van de in [artikel 31h, tweede lid, onder b][ref1], bedoelde instellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31h
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34l
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31h
        afdeling: '3'
  - number: 34l.c
    text: |-
      de personen die op grond van
      [artikel 24, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] zijn belast
      met het toezicht op naleving door instellingen als bedoeld in [artikel 1a, vierde lid, onderdeel n][ref2], van
      die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34l
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 1a
  - number: 34l.d
    text: |-
      de ambtenaren en personen die op grond van [artikel 10 van de Sanctiewet 1977][ref1] zijn belast met het toezicht
      op naleving van die wet, en


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34l
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
  - number: 34l.e
    text: ambtenaren van de Belastingdienst,
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34l
  - number: 34m.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], en de ambtenaren en personen, bedoeld in
      [artikel 34, eerste lid][ref2], werken samen met de instanties die in andere staten zijn belast met het toezicht
      op naleving van de kansspelregelgeving, voor zover dat voor het vervullen van hun taak op grond van deze wet of
      voor de vervulling van de taak van die toezichthoudende instantie nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel34
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34m
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
  - number: 34m.2
    text: |-
      Ter uitvoering van het eerste lid kunnen de ambtenaren en personen, bedoeld in [artikel 34, eerste lid][ref1], de
      bevoegdheden, bedoeld in [afdeling 5.2 van de Algemene wet bestuursrecht][ref2] en [titel VIa][ref3] van deze wet,
      uitoefenen, voor zover dit zich verdraagt met de Nederlandse wetgeving en de openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
      [ref3]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34m
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '34'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0002469
  - number: 34m.3
    text: |-
      Tenzij uit een voor Nederland bindend verdrag of Europees recht anders voortvloeit, worden de bevoegdheden,
      bedoeld in het tweede lid, slechts uitgeoefend overeenkomstig een door de raad van bestuur en een toezichthoudende
      instantie als bedoeld in het eerste lid gesloten overeenkomst met betrekking tot die samenwerking.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34m
  - number: 34m.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34m
  - number: 34n.1
    text: |-
      De raad van bestuur, bedoeld in [artikel 33a][ref1], kan degene die kansspelen organiseert of die de deelname
      aan zonder vergunning krachtens deze wet georganiseerde kansspelen bevordert of daartoe middelen verschaft, een
      bindende aanwijzing geven met betrekking tot de naleving van de bij of krachtens deze wet gestelde voorschriften
      binnen een in die aanwijzing gegeven redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 34n.2
    text: Degene tot wie een aanwijzing als bedoeld in het eerste lid is gericht, handelt overeenkomstig die aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
  - number: 34n.3
    text: |-
      De aanwijzing, bedoeld in het eerste lid, kan er onder meer toe strekken dat een aanbieder van een betaaldienst
      wordt verplicht alle maatregelen te treffen die redelijkerwijs van hem kunnen worden gevergd om betalingsverkeer
      dat wordt gebruikt voor het organiseren van kansspelen zonder vergunning op grond van deze wet of voor het
      deelnemen aan dergelijke kansspelen, te blokkeren, voor zover dit noodzakelijk is voor het beëindigen van een
      overtreding van [artikel 1, eerste lid, onder a, b of c][ref1], of het voorkomen van nieuwe overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
  - number: 34n.4
    text: |-
      De aanwijzing, bedoeld in het eerste lid, kan er voorts onder meer toe strekken dat een aanbieder van een
      openbare elektronische communicatiedienst wordt verplicht alle maatregelen te treffen die redelijkerwijs van hem
      kunnen worden gevergd om bepaalde gegevens die worden opgeslagen of doorgegeven en die worden gebruikt voor het
      organiseren van kansspelen zonder vergunning op grond van deze wet, voor het deelnemen aan dergelijke kansspelen
      of voor reclame- of wervingsactiviteiten ten behoeve van dergelijke kansspelen, ontoegankelijk te maken, voor zover
      dit noodzakelijk is voor het beëindigen van een overtreding van [artikel 1, eerste lid, onder a, b of c][ref1], of
      het voorkomen van nieuwe overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
  - number: 34n.5
    text: |-
      Onder ontoegankelijkmaking van gegevens wordt verstaan het treffen van maatregelen om te voorkomen dat de beheerder
      van geautomatiseerde werk of derden verder van die gegevens kennisnemen of gebruikmaken, alsmede ter voorkoming
      van de verdere verspreiding van die gegevens. Onder ontoegankelijkmaking wordt mede verstaan het verwijderen van de
      gegevens uit het geautomatiseerde werk. Onder ontoegankelijkmaking wordt niet verstaan het manipuleren, blokkeren
      of filteren van internetverkeer, waaronder DNS-verkeer.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
  - number: 34n.6
    text: |-
      Voor een aanwijzing als bedoeld in het vierde lid is voorafgaande machtiging vereist van de
      rechter-commissaris, belast met de behandeling van strafzaken, bij de rechtbank te Rotterdam.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing. De rechter-commissaris
      kan het openbaar ministerie horen alvorens te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 34n.7
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het zesde lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor de raad van bestuur, bedoeld in [artikel 33a][ref1], binnen veertien dagen
      beroep open bij de rechtbank te Rotterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 34n.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de bindende
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel34n
  - number: '35.1'
    text: |-
      De raad van bestuur kan een last onder bestuursdwang opleggen wegens overtreding van de voorschriften vastgesteld
      bij of krachtens deze wet, met uitzondering van [titel VA., paragraaf 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002469
        paragraaf: '2'
  - number: '35.2'
    text: |-
      Ingeval de in [artikel 35a, eerste lid, tweede volzin][ref1], bedoelde overtreding een weigering inhoudt
      medewerking als bedoeld in [artikel 5:20 van de Algemene wet bestuursrecht][ref2] te verlenen, kan de raad van
      bestuur een last onder dwangsom opleggen om inzage te verlenen in de in die last aangegeven zakelijke gegevens
      en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 35a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 35a.1
    text: |-
