      [31j][ref30], [31k][ref31], [31l][ref32], [31m][ref33], [34k][ref34] en [34l][ref35], en [34n, tweede lid][ref36].
      De raad van bestuur kan voorts een bestuurlijke boete opleggen wegens handelen in strijd met
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref37] en wegens het verbreken, opheffen of
      beschadigen van een verzegeling als bedoeld in [artikel 34d][ref38] of wegens het op andere wijze verijdelen van
      de door de verzegeling bedoelde afsluiting.


