        artikel: 7c
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0002469
        artikel: '27'
  - number: '36.3'
    text: |-
      Gedragingen, die in dit artikel als misdrijf of als overtreding zijn aangemerkt, zijn economische delicten in de
      zin van [artikel 1, aanhef en onder 3°, van de Wet op de economische delicten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
  - number: 36a.1
    text: |-
      Overtreding van de verbodsbepaling van [artikel 1, eerste lid, onder c][ref1] , wordt gestraft met geldboete van de
      derde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 36a.2
    text: |-
      Overtreding van de verbodsbepalingen van de [artikelen 30g, tweede lid][ref1], en
      [30u, tweede lid][ref2], wordt gestraft met geldboete van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30g
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30u
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002469/2021-04-01#Artikel36a
    references:
      - id: ref1
