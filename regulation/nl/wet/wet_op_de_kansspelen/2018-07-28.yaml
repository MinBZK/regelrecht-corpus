  - number: 30c
    text: |-
      1 De vergunning kan slechts worden verleend, indien zij betreft het aanwezig hebben van een of meer
      kansspelautomaten:

      a. in een hoogdrempelige inrichting;

      b. in een inrichting, anders dan onder a, bestemd om het publiek de gelegenheid te geven een spel door middel
      van kansspelautomaten te beoefenen, indien het houden van een zodanige inrichting krachtens een vergunning van de
      burgemeester bij gemeentelijke verordening is toegestaan.

      2 Bij gemeentelijke verordening wordt het aantal kansspelautomaten vastgesteld waarvoor per inrichting, als bedoeld
      in het eerste lid, vergunning wordt verleend, met dien verstande dat voor een inrichting als bedoeld in het eerste
      lid, onder a, het aantal kansspelautomaten waarvoor vergunning kan worden verleend, op twee wordt bepaald.

      3 Bij algemene maatregel van bestuur kunnen categorieën inrichtingen worden aangewezen die als laagdrempelige
      inrichtingen worden aangemerkt.

      4 Indien zich binnen een laagdrempelige inrichting een horecalokaliteit als bedoeld in
      [artikel 1, eerste lid, van de Drank- en Horecawet][ref1] bevindt, waarin rechtmatig alcoholhoudende drank voor
      gebruik ter plaatse wordt verstrekt, dan wordt deze lokaliteit als hoogdrempelige inrichting aangemerkt voor de
      toepassing van deze titel, indien:

      a. voldaan is aan de voorwaarden, bedoeld in [artikel 30, onder d][ref2], en

      b. de overige ruimten in die inrichting door het publiek uitsluitend te bereiken zijn zonder eerst deze lokaliteit
      te betreden.

      5 Indien met toepassing van het vierde lid meerdere ruimten binnen een laagdrempelige inrichting als hoogdrempelige
      inrichting kunnen worden aangemerkt, wordt, in afwijking van het vierde lid, met behulp van de omschrijving
      als bedoeld in [artikel 30, onder d][ref3], bepaald of er sprake is van een of van meerdere hoogdrempelige
      inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel30
