  - number: '33'
    text: |-
      1 Er is een kansspelautoriteit.

      2 De kansspelautoriteit is gevestigd te ’s-Gravenhage.

      3 De kansspelautoriteit heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel33
  - number: 33a
    text: Aan het hoofd van de kansspelautoriteit staat de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel33a
  - number: 33b
    text: |-
      De raad van bestuur heeft, tenzij bij of krachtens deze wet anders is bepaald, tot taak het verstrekken, wijzigen
      en intrekken van vergunningen voor de diverse vormen van kansspelen, exploitatievergunningen en modeltoelatingen
      voor speelautomaten, het bevorderen van het voorkomen en het beperken van kansspelverslaving, het geven
      van voorlichting en informatie, het toezicht op de naleving van de toepasselijke wet- en regelgeving en de
      vergunningen, alsmede de handhaving daarvan.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel33b
  - number: 33c
    text: |-
      1 De raad van bestuur bestaat uit ten hoogste drie leden, waaronder een voorzitter.

      2 De leden worden benoemd voor een periode van ten hoogste zes jaar. De leden kunnen eenmaal worden herbenoemd voor
      een periode van ten hoogste zes jaar.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel33c
  - number: 33d
    text: |-
      1 De raad stelt een bestuursreglement vast, waarin in ieder geval regels over de werkwijze en procedures zijn
      opgenomen.

      2 Het bestuursreglement wordt na de goedkeuring van Onze Minister van Veiligheid en Justitie bekend gemaakt in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel33d
  - number: 33e
    text: |-
      1 Onder de naam kansspelheffing legt de kansspelautoriteit een bestemmingsheffing op ter bestrijding en ten hoogste
      ten bedrage van de geraamde kosten van de kansspelautoriteit in één kalenderjaar van de uitoefening van de in
      [artikel 33b][ref1] genoemde taken.

      2 Deze heffing wordt over het kalenderjaar dan wel naar evenredigheid over het aantal maanden van het kalenderjaar
      waarin een verleende vergunning geldig is, geheven van:

      a. degene die op grond van de [artikelen 3][ref2], [9, eerste lid][ref3], [14b, eerste lid][ref4],
      [16, eerste lid][ref5], [24][ref6] en [27b, eerste lid][ref7], een vergunning is verleend, waarbij als grondslag de
      nominale waarde van de deelnamebewijzen over een kalenderjaar wordt aangehouden.

      b. degene die op grond van de [artikelen 27h, eerste lid][ref8], [30h, eerste lid][ref9], en
      [30z, eerste lid][ref10], een vergunning is verleend, waarbij als grondslag het aantal speeltafels, het aantal aan
      die tafels gekoppelde spelersterminals, en het aantal spelersplaatsen van speelautomaten wordt aangehouden.

      3 Voor zover de kansspelautoriteit op grond van [artikel 1d, eerste lid, onderdeel f, van de Wet ter voorkoming
      van witwassen en financieren van terrorisme](onbekend) is belast met de uitvoering en handhaving van de bij
      of krachtens die wet gestelde regels door de instellingen, bedoeld in [artikel 1a, vierde lid, onderdeel j,
      van die wet](onbekend), wordt de kansspelheffing tevens geheven ter bestrijding en ten hoogste ten bedrage
      van de geraamde kosten van de kansspelautoriteit in één kalenderjaar van de uitoefening van dat toezicht. Deze
      aanvullende kansspelheffing wordt geheven van genoemde instellingen, voor zover deze houder van een vergunning op
      grond van deze wet zijn. Daarbij wordt de grondslag, bedoeld in het tweede lid, voor de desbetreffende categorie
      vergunninghouder aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33b
