  - number: 30l
    text: |-
      1 De vergunning wordt ingetrokken:

      a. indien de gegevens, die met het oog op de verkrijging der vergunning zijn verstrekt, zodanig onjuist of
      onvolledig blijken, dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de
      juiste omstandigheden volledig bekend waren geweest;

      b. indien de vergunninghouder het in de[ artikelen 30t, eerste lid, onder b, of tweede lid][ref1] bedoelde verbod
      heeft overtreden;

      c. indien de vergunninghouder gedurende een jaar na de dag van afgifte van de vergunning met de exploitatie geen
      begin heeft gemaakt;

      d. indien niet langer wordt voldaan aan de krachtens [artikel 30i, tweede lid, onder b][ref2], geldende eisen.

      2 De vergunning kan voorts worden ingetrokken, indien de vergunninghouder of de andere in
      [artikel 30i, tweede lid, onder b][ref3], bedoelde personen de bij of krachtens deze Titel vastgestelde bepalingen
      hebben overtreden.

      3 De vergunning kan ook worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4].

      4 Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref5], om een advies als
      bedoeld in [artikel 9 van die wet][ref6] worden gevraagd.

      5 In de gevallen bedoeld in het eerste tot en met het derde lid kan de raad van bestuur, bedoeld in
      [artikel 33a][ref7], alvorens de vergunning in te trekken de vergunninghouder in de gelegenheid stellen binnen een
      daartoe te bepalen termijn tot naleving van de bij of krachtens deze Titel vastgestelde bepalingen of de aan de
      vergunning verbonden voorschriften over te gaan.


