  - number: '25'
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van een totalisator.

      2 De voorschriften hebben onder meer betrekking op:

      a. het aantal draverijen en rennen;

      b. de maximum inzet per persoon;

      c. het percentage dat vóór de verdeling aan de winnaars der weddenschappen zal worden ingehouden en de bestemming
      van dit percentage;

      d. het van overheidswege te houden toezicht op de naleving;

      e. de verplichting om ongeoorloofd wedden of het verlenen van bemiddeling tot wedden op de terreinen waar
      harddraverijen of paardenrennen worden gehouden zoveel mogelijk tegen te gaan en te doen tegengaan.

      3 De voorschriften kunnen worden gewijzigd en aangevuld.


