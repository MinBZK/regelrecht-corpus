  - number: 30a
    text: |-
      1 Deze Titel is niet van toepassing op behendigheidsautomaten die zonder middellijke of onmiddellijke betaling of
      inworp door de speler of een derde in werking kunnen worden gesteld en waarvan het spelresultaat niet kan leiden
      tot de onmiddellijke uitkering van prijzen of premies.

      2 Deze Titel is niet van toepassing op bij regeling van Onze Minister van Veiligheid en Justitie aangewezen typen
      van speelautomaten die worden gebruikt of bestemd zijn om te worden gebruikt ter gelegenheid van kermissen, en
      die zodanig zijn ingericht, dat het bespelen ervan niet kan leiden tot de uitkering van geldprijzen, of tot de
      onmiddellijke uitkering van premies, waardebonnen of penningen, die een waarde vertegenwoordigen van meer dan het
      veertigvoud van de inzet per spel.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel30a
  - number: 30b
    text: |-
      1 Het is verboden, behoudens het in deze Titel bepaalde, zonder vergunning van de burgemeester een of meer
      kansspelautomaten aanwezig te hebben

      a. op of aan de openbare weg;

      b. op voor het publiek toegankelijke plaatsen;

      c. in niet voor het publiek toegankelijke inrichtingen:

      1°. waarvoor ingevolge [artikel 3 van de Drank- en Horecawet][ref1] een vergunning voor de uitoefening van het
      horecabedrijf is vereist, of

      2°. waarin het hotel-, het pension-, het restaurant-, het café-, het cafetaria-, het lunchroom- of het
      partycateringbedrijf wordt uitgeoefend, of waarin de verstrekking van logies, gepaard gaande met dienstverlening
      of de verstrekking van maaltijden, spijzen of dranken voor verbruik ter plaatse, als bedrijf plaats heeft, niet
      zijnde ondernemingen waarin uitsluitend het contractcateringbedrijf wordt uitgeoefend of waarin uitsluitend
      contractcateringactiviteiten als bedrijf plaats hebben.

      2 Het eerste lid is niet van toepassing op het aanwezig hebben van kansspelautomaten op voor het publiek
      toegankelijke plaatsen, uitsluitend ten behoeve van het verkopen daarvan of van het krachtens een vergunning als
      bedoeld in [artikel 30h, eerste lid][ref2], in gebruik geven daarvan aan anderen ten behoeve van de uitoefening van
      hun bedrijf.

      3 [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref3] is van toepassing op de vergunning, bedoeld in
      [artikel 30c, eerste lid, onder a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
