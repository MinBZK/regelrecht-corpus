        afdeling: '1'
  - number: 14d
    text: |-
      1 Als deelnemers mogen niet worden toegelaten personen die nog niet de leeftijd van achttien jaren hebben bereikt.

      2 Indien als winnaar van een prijs wordt aangewezen een persoon die ingevolge het eerste lid niet als deelnemer
      mocht worden toegelaten of een persoon die bij de deelneming gehandeld heeft in strijd met de door de rechtspersoon
      gestelde voorwaarden, wordt deze deelneming buiten aanmerking gelaten.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel14d
