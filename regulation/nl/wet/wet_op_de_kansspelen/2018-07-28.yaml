      1 Het is verboden zonder vergunning van de raad van bestuur, bedoeld in [artikel 33a][ref1], een of meer
      speelautomaten te exploiteren.

      2 Onder exploiteren wordt verstaan het bedrijfsmatig en als eigenaar gebruiken of aan een ander in gebruik geven
