  - number: 30r
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], stelt met betrekking tot iedere toelating van een model de
      merktekens vast die ingevolge die toelating op speelautomaten mogen worden aangebracht. Hij geeft tevens regels
      omtrent de afgifte van merktekens en afschriften van de verklaring, houdende de toelating.

      2 De houder van een toelating van een model is met uitsluiting van ieder ander gerechtigd om in of op
      speelautomaten, welke zijn vervaardigd overeenkomstig het model waarvoor een toelating geldt, de met betrekking tot
      die toelating vastgestelde merktekens aan te brengen. De houder kan derden machtigen de merktekens aan te brengen
      na voorafgaande mededeling hiervan aan de raad van bestuur, bedoeld in [artikel 33a][ref2].

      3 Het is ieder ander dan degenen bedoeld in het tweede lid verboden in of op speelautomaten de in het eerste lid
      bedoelde merktekens aan te brengen.

      4 Het met betrekking tot een toegelaten model vastgestelde merkteken moet op naar dat model vervaardigde
      speelautomaten zodanig worden aangebracht, dat het voor een speler zichtbaar is en niet verwijderd kan worden
      zonder de speelautomaat te beschadigen of het merkteken te vernietigen of te beschadigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
