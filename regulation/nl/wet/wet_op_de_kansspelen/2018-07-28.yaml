  - number: 30q
    text: |-
      1 Indien een model wordt toegelaten, wordt een op naam van de aanvrager gestelde, ondertekende en gedagtekende
      verklaring, houdende de toelating, afgegeven met gebruikmaking van een door de raad van bestuur, bedoeld in
      [artikel 33a][ref1], vast te stellen formulier.

      2 De voorschriften, vastgesteld krachtens [artikel 30n][ref2], worden, voor zover zij op het toegelaten model
      betrekking hebben, in de verklaring, houdende de toelating, opgenomen. Daarin kan tevens worden bepaald, dat het
      model op een in de verklaring vermelde plaats moet worden bewaard.

      3 De raad van bestuur, bedoeld in [artikel 33a][ref3], kan aan een toelating aanvullende voorschriften verbinden
      uit een oogpunt van toezicht dan wel douanecontrole op de naleving van het bij of krachtens deze Titel bepaalde,
      die in de verklaring, houdende de toelating, worden opgenomen. Zij kunnen zo nodig worden gewijzigd, aangevuld
      of ingetrokken.

      4 Een gewaarmerkt afschrift van de in [artikel 30o, tweede lid][ref4], bedoelde tekeningen en beschrijving maakt
      deel uit van de verklaring.

      5 Van een verklaring, houdende de toelating, wordt mededeling gedaan in de Staatscourant. Daarbij worden in elk
      geval opgenomen de voorschriften, bedoeld in het tweede en derde lid. Van een wijziging, aanvulling of intrekking
      van de in de verklaring opgenomen voorschriften wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30n
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel30o
