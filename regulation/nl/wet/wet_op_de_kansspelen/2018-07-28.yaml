    text: |-
      1 Overtreding van de verbodsbepaling van [artikel 1, eerste lid, onder c][ref1] , wordt gestraft met geldboete van
      de derde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].

      2 Overtreding van de verbodsbepalingen van de [artikelen 30g, tweede lid][ref3], en
      [30u, tweede lid][ref4], wordt gestraft met geldboete van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5].

      3 De feiten, strafbaar gesteld in het eerste en tweede lid, zijn overtredingen.


