  - number: 35b
    text: |-
      1 De raad van bestuur kan een bestuurlijke boete van ten hoogste het bedrag van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van de voorschriften
      vastgesteld bij of krachtens [artikel 30u, tweede lid][ref2].

      2 De raad van bestuur kan een bestuurlijke boete van ten hoogste het bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3] opleggen wegens overtreding van de voorschriften,
      vastgesteld bij of krachtens de [artikelen 1, onder c][ref4], en [7c][ref5].

      3 De te betalen geldsom van de opgelegde bestuurlijke boete komt toe aan de staat.

      4 Bij een overtreding als bedoeld in het eerste lid is [artikel 5:53 van de Algemene wet bestuursrecht][ref6] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
