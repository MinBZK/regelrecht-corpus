  - number: 30u
    text: |-
      1 Het is de exploitant van een speelautomatenhal verboden personen de toegang te verlenen:

      a. die de leeftijd van achttien jaren nog niet hebben bereikt;

      b. waarvan niet op deugdelijke wijze is vastgesteld dat deze de leeftijd van achttien jaren nog niet hebben
      bereikt.

      2 Het is de in het eerste lid, onder a, bedoelde personen verboden in een speelautomatenhal aanwezig te zijn.

      3 Bij algemene maatregel van bestuur kunnen regels gegeven worden ten aanzien van de wijze waarop de exploitant
      uitvoering moet geven aan de in het eerste lid bedoelde verboden.

      4 Het eerste en tweede lid zijn niet van toepassing ten aanzien van:

      a. speelautomatenhallen waar uitsluitend behendigheidsautomaten staan opgesteld;

      b. van een speelautomatenhal deel uitmakende afgescheiden ruimten, waar uitsluitend behendigheidsautomaten staan
      opgesteld en welke men uitsluitend kan betreden of verlaten zonder de overige ruimten van de speelautomatenhal
      te betreden.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel30u
  - number: 30z
    text: |-
      1 Tot het aanwezig hebben en het exploiteren van een of meer speelautomaten in een speelcasino kan uitsluitend
      door de raad van bestuur, bedoeld in [artikel 33a][ref1] vergunning worden verleend. De [paragrafen 2][ref2]
      en [3][ref3] van deze Titel zijn niet van toepassing op het aanwezig hebben en het exploiteren van een of meer
      speelautomaten in een speelcasino.

      2 De vergunning kan uitsluitend worden verleend aan de krachtens [artikel 27h, eerste lid][ref4], aangewezen
      rechtspersoon. De vergunning wordt ingetrokken indien niet de vergunning van kracht is, die ingevolge
      [artikel 27h, eerste lid][ref5], vereist is tot het organiseren van een speelcasino.

      3 Aan de vergunning worden voorschriften verbonden ten aanzien van het aanwezig hebben en de exploitatie van
      speelautomaten. De voorschriften kunnen worden gewijzigd, aangevuld of ingetrokken.

      4 Voor de toelating van het model van speelautomaten kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gesteld die afwijken van het bepaalde in [paragraaf 4][ref6] van deze Titel.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
