  - number: '5'
    text: |-
      1 Aan een vergunning, krachtens [artikel 3][ref1] of [artikel 4][ref2] verleend, kunnen voorschriften worden
      verbonden. Zij worden in het besluit, houdende de vergunning opgenomen.

      2 In elk geval moet het voorschrift worden gesteld dat in alle aankondigingen en voor openbaarmaking of
      verspreiding bestemde stukken, de gelegenheid waarvoor de vergunning geldt betreffende, worde vermeld wie de
      vergunning heeft verleend, onder aanhaling van dagtekening en kenmerk van het besluit.

      3 Een verleende vergunning kan worden ingetrokken indien een of meer der daaraan verbonden voorschriften worden
      overtreden. De gestelde voorschriften kunnen worden gewijzigd en aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel4
