  - number: 30o
    text: |-
      1 De toelating van een model wordt door de raad van bestuur, bedoeld in [artikel 33a][ref1], op aanvraag verleend.

      2 Bij elke aanvraag om toelating van een model dienen te worden overgelegd tekeningen en een beschrijving, welke
      het model zo volledig mogelijk weergeven.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de eisen, waaraan bij een aanvraag om toelating van een model dient te worden voldaan;

      b. de medewerking, die door de aanvrager aan het onderzoek met het oog op de toelating van een model behoort te
      worden verleend.

      4 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de bij de aanvraag van de toelating
      verschuldigde vergoeding voor de kosten verbonden aan de behandeling van de aanvraag en de afgifte van de
      verklaring houdende toelating, en voor de kosten verbonden aan het toezicht op de naleving door de houder van de
      toelating van de bij of krachtens deze Titel vastgestelde voorschriften.

      5 Bij regeling van Onze Minister van Veiligheid en Justitie worden een of meer instellingen aangewezen die belast
      zijn met het onderzoek met het oog op de toelating van het model van een speelautomaat.

      6 [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] is van toepassing op de toelating, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
