      1 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de voorschriften,
      te verbinden aan vergunningen als bedoeld in [artikel 3][ref1], alsmede met betrekking tot de wijze waarop en de
      middelen waarmede de aanwijzing der winnaars moet geschieden in gelegenheden, waarvoor ingevolge de artikelen 3 en
      [4][ref2] vergunning is verleend.

      2 Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot het bedrag dat is verschuldigd voor
      de behandeling van de aanvraag van een vergunning als bedoeld in de [artikelen 3][ref3] en [4][ref4]. Daarbij
      worden tevens regels gegeven met betrekking tot het bedrag dat jaarlijks door de vergunninghouder is verschuldigd,
      indien de vergunning een geldigheidsduur heeft van meer dan een jaar.


