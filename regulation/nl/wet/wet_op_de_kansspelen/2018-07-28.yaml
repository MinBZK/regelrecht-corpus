  - number: 33f
    text: |-
      1 Het tarief van de heffing bedoeld in [artikel 33e, tweede lid, onder a, ][ref1]bedraagt:

      a. € 1 000, indien de nominale waarde van de verkochte deelnamebewijzen hoger is dan € 1 000 000 doch niet hoger is
      dan € 5 000 000;

      b. € 10 000, indien de nominale waarde van de verkochte deelnamebewijzen hoger is dan € 5 000 000 doch niet hoger
      is dan € 20 000 000;

      c. € 50 000, indien de nominale waarde van de verkochte deelnamebewijzen hoger is dan € 20 000 000 doch niet hoger
      is dan € 50 000 000;

      d. € 50 000 vermeerderd met één vijfhonderste deel van het bedrag waarmee het drempelbedrag overstegen wordt,
      indien de nominale waarde van de verkochte deelnamebewijzen het drempelbedrag van € 50 000 000 overstijgt.

      2 Het tarief van de heffing bedoeld in [artikel 33e, tweede lid, onder b][ref2], bedraagt:

      a. voor tafelspelen in een speelcasino: € 164 per speeltafel en € 123 per aangekoppelde spelersterminal;

      b. voor kansspelautomaten bestemd voor opstelling in een speelcasino: € 123 per spelersplaats;

      c. voor kansspelautomaten bestemd voor opstelling in een speelautomatenhal: € 80 per spelersplaats;

      d. voor kansspelautomaten bestemd voor opstelling in een hoogdrempelige inrichting: € 40 per spelersplaats;

      3 Overeenkomstig bij regeling van Onze Minister van Veiligheid en Justitie te stellen regels verstrekt de
      vergunninghouder op de daarbij vastgestelde wijze en binnen de daarbij vastgestelde termijn de gegevens en
      bescheiden die voor de vaststelling van de heffing van belang kunnen zijn en verstrekt hij op verzoek van
      de kansspelautoriteit de nadere gegevens en bescheiden die de kansspelautoriteit voor de vaststelling van de
      kansspelheffing behoeft.

      4 Indien de vergunninghouder niet binnen de daartoe gestelde termijn de gegevens en bescheiden, bedoeld in het
      derde lid, heeft verstrekt of kennelijk onjuiste of onvolledige gegevens heeft verstrekt, kan de kansspelautoriteit
      een schatting doen van de gegevens die voor de vaststelling van de heffing van belang zijn.

      5 De kansspelautoriteit kan een voorlopige kansspelheffing opleggen tot ten hoogste het bedrag waarop
      de kansspelheffing met toepassing van de verrekening, bedoeld in het zesde lid, van eerdere voorlopige
      kansspelheffingen vermoedelijk zal worden vastgesteld. Indien het bedrag in termijnen kan worden betaald, vermeldt
      de beschikking de te betalen geldsommen en de termijnen waarbinnen de betalingen moeten plaatsvinden. De voorlopige
      heffing wordt niet vastgesteld voor aanvang van het kalenderjaar waarop zij betrekking heeft.

      6 De voorlopige kansspelheffing wordt verrekend met de kansspelheffing.

      7 De kansspelheffing en de voorlopige kansspelheffing kunnen bij dwangbevel worden ingevorderd.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de heffing.

      9 De in het eerste en tweede lid genoemde bedragen kunnen bij ministeriële regeling worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33e
