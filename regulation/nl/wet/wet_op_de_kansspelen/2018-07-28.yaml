  - number: '36'
    text: |-
      1 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de
      [artikelen 1, eerste lid, onder a][ref1], [30b, eerste lid][ref2], [30h, eerste lid][ref3],
      [30m, eerste lid][ref4], en [30t, eerste, tweede en vijfde lid][ref5], zijn misdrijven, voorzover zij opzettelijk
      zijn begaan, en overigens overtredingen.

      2 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de
      [artikelen 1, eerste lid, onder b en d][ref6], [7c, tweede lid][ref7], [13][ref8], [14][ref9], en [27][ref10] zijn
      overtredingen.

      3 Gedragingen, die in dit artikel als misdrijf of als overtreding zijn aangemerkt, zijn economische delicten in de
      zin van [artikel 1, aanhef en onder 3°, van de Wet op de economische delicten][ref11].


