        bwb_id: BWBR0002469
        artikel: '1'
  - number: '2'
    text: |-
      [Artikel 1][ref1] is niet van toepassing op:

      a. gelegenheden als daarin bedoeld, die noch voor het publiek zijn opengesteld, noch bedrijfsmatig worden gegeven;

      b. levensverzekeringen, aangegaan met inachtneming van de daarvoor geldende wettelijke bepalingen;

      c. door een publiekrechtelijk lichaam tegen een niet hogere dan de parikoers voor het publiek opengestelde
      werkelijke geldleningen, die een jaarlijkse en jaarlijks ter beschikking te stellen rente geven, niet lager dan
      een door Onze Minister van Financiën vast te stellen percentage, terwijl aan de schuldbewijzen van die leningen
      bijkomstig een kans op het winnen van premies is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '1'
  - number: '3'
    text: |-
      1 Tenzij deze wet anders bepaalt kan voor een gelegenheid als in [artikel 1, onder a][ref1], bedoeld vergunning
      worden verleend, indien deze gelegenheid wordt opengesteld uitsluitend ten einde met de opbrengst daarvan enig
      algemeen belang te dienen. De vergunning wordt verleend door burgemeester en wethouders van de gemeente waar de
      aanwijzing van de winnaars zal geschieden, indien de prijzen en premies gezamenlijk geen grotere waarde hebben dan
      € 4500 en bij een grotere waarde door de raad van bestuur, bedoeld in [artikel 33a][ref2].

      2 Het eerste lid is niet van toepassing voor gelegenheden, waarbij de spelers gemeenschappelijk aan een kansspel
      kunnen deelnemen.

      3 Het eerste lid is niet van toepassing op piramidespelen.

      4 [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref3] is van toepassing op de vergunning, bedoeld in het
      eerste lid en, voorzover de vergunning door de raad van bestuur, bedoeld in [artikel 33a][ref4] wordt verleend,
      deze betrekking heeft op een incidenteel kansspel.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
