      1 Tot het organiseren van een speelcasino kan uitsluitend vergunning verleend worden overeenkomstig de bepalingen
      van deze titel.

      2 Onder speelcasino wordt verstaan de voor het publiek opengestelde of bedrijfsmatig gedreven inrichting, waar door
      middel van gemeenschappelijk beoefende kansspelen aan de deelnemers de gelegenheid wordt gegeven om mede te dingen
      naar prijzen of premies, indien de aanwijzing der winnaars geschiedt door enige kansbepaling, waarop de deelnemers
      in het algemeen geen overwegende invloed kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel27g
  - number: 27h
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], kan aan één rechtspersoon met volledige rechtsbevoegdheid
      voor een door hem te bepalen duur vergunning verlenen tot het organiseren van speelcasino's.

      2 De opbrengst van de speelcasino’s - na aftrek van de prijzen en kosten - strekt ten bate van de schatkist.

      3 De vestiging van een speelcasino behoeft de voorafgaande instemming van de raad van de betrokken gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
