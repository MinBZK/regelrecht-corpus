  - number: 30n
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gegeven welke gelden als voorwaarden voor de
      toelating van een model speelautomaat. De regels hebben betrekking op:

      a. de op het model aangebrachte informatie ten behoeve van de speler met betrekking tot het spel, het spelkarakter,
      het spelverloop en de mogelijke spelresultaten;

      b. de deugdelijkheid, de duurzaamheid en de storingsgevoeligheid van de constructie, daaronder begrepen de
      mogelijkheid tot beïnvloeding van het spelproces, anders dan door de aan de speler geboden middelen;

      c. het waarborgen van een eerlijk en betrouwbaar spelverloop en het voorkomen van fraude en misbruik;

      d. het karakter van het spel en het waarborgen van het toevals- of behendigheidskarakter van het spel en het
      spelverloop.

      2 Met betrekking tot de toelating van een model kansspelautomaat worden voorts bij of krachtens algemene maatregel
      van bestuur regels gegeven ten aanzien van:

      a. de automatische registratie van alle inzetten, uitbetalingen en gespeelde spellen;

      b. de op het model aangebrachte informatie ter bescherming van de speler en met betrekking tot de leeftijdsgrens
      die geldt voor het spelen op kansspelautomaten;

      c. de informatie van de speler, daaronder begrepen de informatie van de speler omtrent het spelverloop middels een
      informatiesysteem op de kansspelautomaat;

      d. een op de kansspelautomaat aanwezige voorziening die de speler noodzaakt tot het instellen van een bedrag dat
      hij maximaal wil verliezen;

      e. het in werking stellen van het spelproces en het spel;

      f. de inworp en de inzet, en de vorm en hoogte daarvan;

      g. het spelverloop en de spelduur;

      h. de uitbetaling en de uitkering van prijzen en premies, en de vorm, het moment en de hoogte daarvan;

      i. de kansen op winst en verlies en de hoogte van de bedragen die, gemeten over een bepaalde tijdsduur, gemiddeld
      gewonnen of verloren kunnen worden;

      j. het inworp- en uitbetalingsmechanisme;

      k. andere op de kansspelautomaat aanwezige mechanismen of voorzieningen die een rol spelen in het spelproces;

      l. de aanwezigheid op de kansspelautomaat van geldwisselapparatuur;

      m. de verlichting en het geluid van de kansspelautomaat.

      3 Voor de toelating van het model van kansspelautomaten bestemd om te worden opgesteld in een inrichting als
      bedoeld in [artikel 30c, eerste lid, onder b][ref1], kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gesteld ten aanzien van de onderwerpen genoemd in het tweede lid, die afwijken van het bij of krachtens het
      tweede lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
