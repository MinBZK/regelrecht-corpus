  - number: 30f
    text: |-
      1 De vergunning wordt ingetrokken:

      a. indien de gegevens, die met het oog op de verkrijging der vergunning zijn verstrekt, zodanig onjuist of
      onvolledig blijken, dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de
      juiste omstandigheden volledig bekend waren geweest;

      b. indien voor een inrichting, als bedoeld in [artikel 30c, eerste lid, onder a en b][ref1], niet de vergunning van
      kracht is, die ingevolge de voor die inrichting geldende bepalingen is vereist;

      c. indien niet langer wordt voldaan aan de krachtens [artikel 30d, vierde lid, onder a][ref2], geldende eisen.

      2 De vergunning kan voorts worden ingetrokken:

      a. indien de vergunninghouder de bij of krachtens deze Titel vastgestelde bepalingen heeft overtreden;

      b. indien de vrees gewettigd is, dat het van kracht blijven der vergunning ernstig gevaar zou opleveren voor de
      openbare orde, veiligheid of zedelijkheid.

      3 De vergunning kan ook worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3].

      4 Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], om een advies als
      bedoeld in [artikel 9 van die wet][ref5] worden gevraagd.

      5 In de gevallen bedoeld in het eerste lid, tweede lid, onder a, en derde lid kan de burgemeester alvorens de
      vergunning in te trekken de vergunninghouder in de gelegenheid stellen binnen een daartoe te bepalen termijn tot
      naleving van de bij of krachtens deze Titel vastgestelde bepalingen of de aan de vergunning verbonden voorschriften
      over te gaan.

      6 Intrekking van de vergunning geschiedt niet voordat de burgemeester van zijn voornemen daartoe de
      vergunninghouder bij aangetekende brief, onder opgave van redenen, mededeling heeft gedaan en hem in de gelegenheid
      heeft gesteld zich in persoon of bij gemachtigde door hem of een door hem aangewezen ambtenaar te doen horen. In
      het geval bedoeld in het tweede lid, onder b, kan, indien dringende omstandigheden zulks vorderen, de vergunning
      onmiddellijk worden ingetrokken.


