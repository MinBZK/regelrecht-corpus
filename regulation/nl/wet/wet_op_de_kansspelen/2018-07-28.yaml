      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de gegevens, welke bij de aanvraag van een vergunning dienen te worden verstrekt. Deze gegevens bevatten in
      ieder geval de identiteit van de in het tweede lid, onder b, bedoelde personen;

      b. de vereiste beschikbaarheid van faciliteiten voor onderhoud en reparatie van speelautomaten.

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de bij de aanvraag van de vergunning verschuldigde vergoeding voor de kosten verbonden aan de behandeling van
      de aanvraag en de afgifte van de vergunning, en voor de kosten verbonden aan het toezicht op de naleving door de
      vergunninghouder van de bij of krachtens deze Titel vastgestelde voorschriften;

      b. de eisen ten aanzien van het zedelijk gedrag, waaraan de aanvrager van de vergunning, en de bedrijfsleiders en
      beheerders van de exploitatie dienen te voldoen.
