  - number: '30'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. speelautomaat: een toestel, ingericht voor de beoefening van een spel, dat bestaat uit een door de speler in
      werking gesteld mechanisch, elektrisch of elektronisch proces, waarbij het resultaat kan leiden tot de middellijke
      of onmiddellijke uitkering van prijzen of premies, daaronder begrepen het recht om gratis verder te spelen;

      b. behendigheidsautomaat: een speelautomaat waarvan het spelresultaat uitsluitend kan leiden tot een verlengde
      speelduur of het recht op gratis spellen en het proces, ook nadat het in werking is gesteld, door de speler kan
      worden beïnvloed en het geheel of vrijwel geheel van zijn inzicht en behendigheid bij het gebruik van de daartoe
      geboden middelen afhangt of en in welke mate de spelduur verlengd of het recht op gratis spelen verkregen wordt;

      c. kansspelautomaat: een speelautomaat, die geen behendigheidsautomaat is;

      d. hoogdrempelige inrichting: een inrichting als bedoeld in
      [artikel 1, eerste lid, van de Drank- en Horecawet][ref1], waarin rechtmatig het horecabedrijf als bedoeld in dat
      artikellid wordt uitgeoefend:

      1°. waar het café en het restaurantbezoek op zichzelf staat en waar geen andere activiteiten plaatsvinden, waaraan
      een zelfstandige betekenis kan worden toegekend en

      2°. waarvan de activiteiten in belangrijke mate gericht zijn op personen van 18 jaar en ouder.

      e. laagdrempelige inrichting: een inrichting als bedoeld in
      [artikel 1, eerste lid, van de Drank- en Horecawet][ref2], waarin rechtmatig het horecabedrijf als bedoeld in dat
      artikellid wordt uitgeoefend, die geen hoogdrempelige inrichting is.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel30
