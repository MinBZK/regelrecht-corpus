  - number: 30p
    text: |-
      1 De toelating van een model wordt geweigerd indien niet wordt voldaan aan de krachtens [artikel 30n][ref1] gegeven
      voorschriften of niet de redelijke verwachting bestaat, dat overeenkomstig het model vervaardigde speelautomaten
      aan die voorschriften zullen voldoen.

      2 De toelating van een model kan voorts worden geweigerd:

      a. indien de aanvrager de bij of krachtens deze Titel vastgestelde voorschriften heeft overtreden in de drie jaren
      voorafgaande aan het moment van de aanvraag van de toelating van een model;

      b. indien er naar het oordeel van de raad van bestuur, bedoeld in [artikel 33a][ref2], sprake is van een uit
      maatschappelijk oogpunt onaanvaardbaar spelconcept.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30n
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
