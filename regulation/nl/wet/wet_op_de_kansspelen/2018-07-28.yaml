preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, de verspreide wettelijke bepalingen betreffende
    kansspelen te herzien en in één wet onder te brengen en voorts de tijdelijke bepalingen betreffende
    sportprijsvragen door blijvende te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Behoudens het in [Titel Va][ref1] van deze wet bepaalde is het verboden:

      a. gelegenheid te geven om mede te dingen naar prijzen of premies, indien de aanwijzing der winnaars geschiedt door
      enige kansbepaling waarop de deelnemers in het algemeen geen overwegende invloed kunnen uitoefenen, tenzij daarvoor
      ingevolge deze wet vergunning is verleend;

      b. de deelneming hetzij aan een onder a bedoelde gelegenheid, gegeven zonder vergunning ingevolge deze wet,
      hetzij aan een overeenkomstige gelegenheid, gegeven buiten het Rijk in Europa, te bevorderen of daartoe voor
      openbaarmaking of verspreiding bestemde stukken in voorraad te hebben;

      c. gebruik te maken van een onder a bedoelde gelegenheid, wetende dat voor het geven daarvan geen vergunning
      ingevolge deze wet is verleend;

      d. opzettelijk in strijd met de waarheid het vermoeden te wekken dat voor een gelegenheid als onder a bedoeld
      ingevolge deze wet vergunning is verleend, of dat aan de verleende vergunning geen voorschrift of niet al de
      gestelde voorschriften zijn verbonden.

      2 Het is verboden te handelen in strijd met de aan de verleende vergunning verbonden voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 1a
    text: |-
      1 Onder een gelegenheid als bedoeld in [artikel 1, onder a][ref1], wordt tevens begrepen het piramidespel.

      2 Onder het piramidespel wordt verstaan een gelegenheid waarbij deelnemers een goed afgeven of een verplichting
      aangaan teneinde daaruit een voordeel te verwerven dat geheel of ten dele afhankelijk is van de afgifte van een
      goed of het aangaan van een verplichting door latere deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel1
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel1a
    references:
