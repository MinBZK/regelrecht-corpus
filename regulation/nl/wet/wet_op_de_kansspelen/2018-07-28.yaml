  - number: 30j
    text: |-
      1 Aan de vergunning kunnen uit een oogpunt van toezicht op de naleving van het bij of krachtens deze Titel bepaalde
      voorschriften en beperkingen worden verbonden, die zo nodig kunnen worden gewijzigd, aangevuld of ingetrokken,
      overeenkomstig bij regeling van Onze Minister van Veiligheid en Justitie te stellen regels. Aan de vergunning wordt
      in ieder geval het voorschrift verbonden dat alleen speelautomaten mogen worden opgesteld, indien tot het aanwezig
      hebben daarvan een vergunning is verleend als bedoeld in [artikel 30c][ref1]. Indien de omstandigheden daartoe
      aanleiding geven, worden aan de vergunning voorts voorschriften verbonden ten aanzien van de wijze van werving en
      reclame, gericht tot de speler.

      2 De vergunning wordt voor bepaalde of onbepaalde tijd verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
