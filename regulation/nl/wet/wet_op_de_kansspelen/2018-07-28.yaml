  - number: 30m
    text: |-
      1 Het vervaardigen of invoeren van speelautomaten is verboden, tenzij het speelautomaten betreft die overeenstemmen
      met een door de raad van bestuur, bedoeld in [artikel 33a][ref1], toegelaten model en

      a. zij ten bewijze daarvan zijn voorzien van het ingevolge [artikel 30r, eerste lid][ref2], met betrekking tot die
      toelating vastgestelde merkteken, of

      b. de vervaardiging of invoer geschiedt door de houder van die toelating of diens gemachtigde.

      2 Het eerste lid is niet van toepassing op speelautomaten:

      a. die op grond van ouderdom of uiterlijk of uitzonderlijke eigenschappen bijzondere waarde hebben;

      b. die zijn bestemd voor doorvoer of uitvoer;

      c. die zonder enige inworp door de speler in werking kunnen worden gesteld en waarvan het spelresultaat niet kan
      leiden tot de onmiddellijke uitkering van prijzen of premies;

      d. die zijn bestemd om als model voor toelating te worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30r
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel30m
