  - number: 14a
    text: |-
      1 Tot het organiseren van een instantloterij kan uitsluitend vergunning worden verleend overeenkomstig de
      bepalingen van deze titel.

      2 Onder instantloterij wordt verstaan een loterij waarbij de prijsbepaling van de winnende loten geschiedt voordat
      een aanvang wordt gemaakt met de uitgifte van de deelnamebewijzen.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel14a
  - number: 14b
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], kan met het oog op de belangen van instellingen werkzaam
      ten algemene nutte, in het bijzonder op het gebied van sport en lichamelijke vorming, van de cultuur, het
      maatschappelijk welzijn en de volksgezondheid, aan één rechtspersoon met volledige rechtsbevoegdheid voor een door
      hem te bepalen duur vergunning verlenen tot het organiseren van een instantloterij.

      2 De opbrengst van de instantloterij - na aftrek van de prijzen en kosten - komt ten goede aan de belangen, die de
      rechtspersoon beoogt te dienen met het organiseren van de instantloterij.

      3 Van de opbrengst van de instantloterij wordt ten minste 47,5% bestemd voor uitkering aan prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: 14c
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van een instantloterij.

      2 De voorschriften hebben onder meer betrekking op:

      a. het aantal te houden instantloterijen en het aantal uit te geven deelnamebewijzen per instantloterij;

      b. de inrichtingen waar deelnamebewijzen verkrijgbaar worden gesteld en de maximale inleg per deelnamebewijs;

      c. het waarborgen van een eerlijk en betrouwbaar spelverloop en het voorkomen van fraude en misbruik;

      d. de administratie en de dekking van de aan de organisatie verbonden kosten;

      e. de wijze van werving en reclame;

      f. de bestemming van de opbrengst van de gehouden instantloterijen;

      g. de statuten en reglementen van de rechtspersoon;

      h. het van overheidswege te houden toezicht op de naleving;

      i. de inrichting van het jaarlijks door de rechtspersoon van zijn werkzaamheden en de financiële resultaten daarvan
      uit te brengen verslag en de wijze van publikatie van dat verslag.

      3 Van de voorschriften wordt mededeling gedaan door plaatsing in de *Staatscourant*. Zij kunnen worden gewijzigd
      en aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel14c
