  - number: 4c
    text: |-
      1 Een vergunning die ingevolge deze wet door de raad van bestuur, bedoeld in [artikel 33a][ref1], is
      verleend voor een gelegenheid als bedoeld in [artikel 1, eerste lid, onderdeel a][ref2], of voor het
      verrichten van activiteiten als bedoeld in [artikel 7a][ref3], [30b][ref4] of [30h][ref5] en waarop de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref6] van toepassing is, kan worden ingetrokken
      indien de vergunninghouder niet of niet meer voldoet aan de bij of krachtens die wet gestelde regels.

      2 Een vergunning die ingevolge deze wet is verleend door een ander bestuursorgaan dan de raad van bestuur, bedoeld
      in [artikel 33a][ref7], kan worden ingetrokken na een daartoe strekkend advies van de raad van bestuur waaruit
      volgt dat toepassing moet worden gegeven aan het bepaalde in het eerste lid.


