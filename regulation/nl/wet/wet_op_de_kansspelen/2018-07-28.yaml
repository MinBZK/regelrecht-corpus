  - number: 33g
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], kan persoonsgegevens,
      daaronder begrepen persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verwerken, voor zover die
      verwerking noodzakelijk is voor:

      a. de uitvoering van deze wet;

      b. het toezicht op naleving van de bij of krachtens deze wet gestelde of aan de op grond van deze wet verleende
      vergunning verbonden voorschriften;

      c. de handhaving van de bij of krachtens deze wet gestelde of aan de op grond van deze wet verleende vergunning
      verbonden voorschriften.

      2 De raad van bestuur, bedoeld in [artikel 33a][ref3], en de ambtenaren en personen, bedoeld in [artikel 34][ref4],
      verstrekken elkaar de gegevens die deze behoeven ter uitvoering van hun wettelijke taken.

      3 Onze Minister van Veiligheid en Justitie, de rijksbelastingdienst, de Inspectie SZW en andere in het
      reglement, bedoeld in het zesde lid, aangewezen bestuursorganen en toezichthouders zijn bevoegd uit eigen
      beweging of verplicht desgevraagd de raad van bestuur, bedoeld in [artikel 33a][ref5], en de ambtenaren
      en personen, bedoeld in [artikel 34][ref6], de gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van hun taken. Daarbij kan gebruik worden gemaakt van het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref7], en van andere, bij regeling van
      Onze Minister van Veiligheid en Justitie aangewezen nummers.

      4 Onverminderd artikel 6 van de Algemene verordening gegevensbescherming mogen de gegevens, bedoeld in het eerste
      lid, slechts worden verwerkt mits de uitvoering van de taak met het oog waarop de gegevens zijn verstrekt, daartoe
      noodzaakt.

      5 De in het tweede en derde lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.

      6 De raad van bestuur, bedoeld in [artikel 33a][ref8], beschikt over een reglement waarin in ieder geval regels
      zijn gesteld met betrekking tot de wijze waarop:

      a. de verwerking van persoonsgegevens plaatsvindt;

      b. de persoonsgegevens door passende technische en organisatorische maatregelen worden beveiligd tegen verlies of
      onrechtmatige verwerking.

      7 Het reglement, bedoeld in het zesde lid, bevat voorts regels met betrekking tot de bestuursorganen,
      toezichthouders, instanties of personen waarmee gegevens kunnen worden uitgewisseld, de wijze waarop gegevens
      kunnen worden verstrekt en de doorlevering en vernietiging van gegevens.

      8 Bij regeling van Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld met betrekking tot
      de vorige leden.

      9 De raad van bestuur, bedoeld in [artikel 33a][ref9], is verwerkingsverantwoordelijke.


