  - number: 35c
    text: |-
      1 De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] opleggen wegens overtreding van het voorschrift
      vastgesteld bij [artikel 30g, tweede lid][ref2].

      2 De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3] opleggen wegens overtreding van de aan de verleende
      vergunning verbonden voorschriften, bedoeld in [artikel 3, eerste lid][ref4], voorzover deze vergunning is
      afgegeven door burgemeester en wethouders.

      3 De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5] opleggen wegens overtreding van de bij of krachtens
      [artikel 7c][ref6] gestelde voorschriften.

      4 De burgemeester kan een bestuurlijke boete van ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref7] opleggen wegens overtreding van de aan de verleende
      vergunning verbonden voorschriften, bedoeld in de [artikelen 30b, eerste lid][ref8], en [30d, eerste lid][ref9], en
      wegens overtreding van het voorschrift, vastgesteld bij [artikel 30g, eerste lid][ref10].

      5 De bestuurlijke boete komt toe aan de gemeente.


