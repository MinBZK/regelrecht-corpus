  - number: 30t
    text: |-
      1 Het is verboden een of meer speelautomaten, die niet overeenstemmen met het door de raad van bestuur, bedoeld
      in [artikel 33a][ref1], toegelaten model daarvan en die niet ten bewijze daarvan zijn voorzien van het ingevolge
      [artikel 30r, eerste lid][ref2], met betrekking tot die toelating vastgestelde merkteken:

      a. in de handel te brengen, te verkopen, ten verkoop in voorraad te hebben, ten verkoop aan te bieden of af te
      leveren , met uitzondering van de speelautomaten bedoeld in [artikel 30m, tweede lid, onder a, b en c][ref3];

      b. te exploiteren;

      c. aanwezig te hebben op plaatsen of in inrichtingen als bedoeld in [artikel 30b, eerste lid][ref4].

      2 Het is verboden in of aan een speelautomaat, die wordt gebruikt of die bestemd is om te worden gebruikt in
      inrichtingen of bij gelegenheden als bedoeld in [artikel 30c, eerste lid][ref5] en behendigheidsautomaten op
      kermissen zodanige wijzigingen aan te brengen of te doen aanbrengen, dat deze niet meer overeenstemt met het door
      de raad van bestuur, bedoeld in [artikel 33a][ref6], toegelaten model daarvan.

      3 Bij het intrekken van een toelating als bedoeld in [artikel 30s][ref7], kan de raad van bestuur, bedoeld in
      [artikel 33a][ref8], bepalen, dat het eerste lid niet of tijdelijk niet van toepassing is op speelautomaten, die
      voordien ingevolge die toelating rechtmatig van een merkteken zijn voorzien. Het tweede lid is van overeenkomstige
      toepassing met betrekking tot die speelautomaten.

      4 Van een besluit als bedoeld in het derde lid wordt mededeling gedaan in de Staatscourant tegelijk met de
      mededeling, bedoeld in [artikel 30s, zesde lid][ref9].

      5 Het is verboden om op grond van het behaalde spelresultaat op een behendigheidsautomaat middellijk of
      onmiddellijk prijzen of premies uit te keren, met uitzondering van een verlengde speelduur of het recht op gratis
      spellen.


