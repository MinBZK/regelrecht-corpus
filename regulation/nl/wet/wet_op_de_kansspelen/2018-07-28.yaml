    text: |-
      1 De raad van bestuur kan een bestuurlijke boete opleggen wegens overtreding van de voorschriften vastgesteld
      bij of krachtens de [artikelen 1, eerste lid, onder a, b en d, tweede lid][ref1], [4a][ref2], [7][ref3],
      [10][ref4], [13][ref5], [14][ref6], [14c][ref7], [14d, eerste lid][ref8], [20, eerste lid][ref9], [21][ref10],
      [25][ref11], [27][ref12], [27c][ref13], [27e, eerste lid][ref14], [27i][ref15], [27j, eerste lid][ref16],
      [30h, eerste lid][ref17], [30j, eerste lid][ref18], [30m, eerste lid][ref19], [30q, derde lid][ref20],
      [30r, derde en vierde lid][ref21], [30t, eerste, tweede en vijfde lid][ref22], [30u, eerste lid][ref23], en
      [30z][ref24].

      2 De bestuurlijke boete die voor een overtreding als bedoeld in het eerste lid kan
      worden opgelegd bedraagt ten hoogste het bedrag van de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref25] of, indien dat meer is, 10% van de omzet in het
      boekjaar voorafgaande aan de beschikking.

      3 De berekening van de omzet, bedoeld in het tweede lid, geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref26] voor de netto-omzet.

      4 De bestuurlijke boete komt toe aan de staat.


