    text: |-
      Behoudens ingevolge een door de krachtens [artikel 9][ref1] aangewezen rechtspersoon verleende uitdrukkelijke
      toestemming is het verboden, onverschillig voor welk doel en onverschillig op welke wijze, gebruik te maken van of
      invloed toe te kennen aan de uitslag van de trekkingen in de staatsloterij.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '9'
  - number: '14'
    text: |-
      Behoudens aan degenen die daartoe door de krachtens [artikel 9][ref1] aangewezen rechtspersoon gemachtigd zijn,
      is het aan een ieder verboden bij wijze van beroep of gewoonte loten of gedeelten van loten in de staatsloterij of
      onder deze naam te verkopen, te koop aan te bieden, af te leveren, uit te delen of ten verkoop of ter uitdeling in
      voorraad te hebben, af te lossen of op enige andere wijze de middellijke of onmiddellijke deelneming in voormelde
      loterij open te stellen of te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel9
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel14
