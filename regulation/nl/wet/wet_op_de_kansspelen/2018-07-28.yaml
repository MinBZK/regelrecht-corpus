    text: |-
      1 De vergunning wordt geweigerd indien:

      a. door het verlenen der vergunning zou worden afgeweken van het bij of krachtens [artikel 30c][ref1] bepaalde;

      b. niet wordt voldaan aan de krachtens [artikel 30d, vierde lid][ref2], geldende eisen.

      2 De vergunning kan voorts worden geweigerd:

      a. indien de aanvrager de bij of krachtens deze Titel vastgestelde bepalingen heeft overtreden in de drie jaren
      voorafgaande aan het moment van aanvraag van de vergunning;

      b. indien de vrees gewettigd is, dat het verlenen der vergunning ernstig gevaar zou opleveren voor de openbare
      orde, veiligheid of zedelijkheid.

      3 De vergunning kan ook worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3].

      4 Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], om een advies als
      bedoeld in [artikel 9 van die wet][ref5] worden gevraagd.


