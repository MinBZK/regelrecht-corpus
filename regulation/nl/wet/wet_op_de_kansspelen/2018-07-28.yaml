  - number: '34'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van
      [titel VA., paragraaf 2][ref1], zijn belast de bij besluit van de raad van bestuur van de kansspelautoriteit
      aangewezen ambtenaren en personen.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens [titel VA., paragraaf 2][ref2], zijn belast de
      bij besluit van de burgemeester aangewezen ambtenaren en personen.

      3 Van een besluit als bedoeld in het eerste en tweede lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Paragraaf2
