  - number: 30aa
    text: |-
      1 De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, als voorzien in
      deze Titel, wordt Ons gedaan door Onze Minister van Veiligheid en Justitie.

      2 Het ontwerp van een besluit tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur
      als voorzien in de[ artikelen 30c, derde lid][ref1], en [30n, tweede en derde lid][ref2], wordt bekend gemaakt in
      de Staatscourant.

      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als bedoeld in de
      vorige volzin wordt Ons niet gedaan dan nadat twee maanden na die bekendmaking zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30n
