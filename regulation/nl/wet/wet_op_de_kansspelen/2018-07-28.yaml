      1 Onze Ministers van Veiligheid en Justitie en van Financiën kunnen aan een rechtspersoon met volledige
      rechtsbevoegdheid vergunning verlenen tot het openstellen van een tegen een niet hogere dan de parikoers uit te
      geven werkelijke geldlening, die een jaarlijkse en jaarlijks ter beschikking te stellen rente geeft, niet lager
      dan een door Onze Minister van Financiën vast te stellen percentage, terwijl aan de schuldbewijzen van die lening
      bijkomstig de kans op het winnen van premies is verbonden.

      2 Een vergunning als in lid 1 bedoeld kan alleen worden verleend voor geldleningen, uit te geven teneinde met het
      geplaatste geld enig algemeen belang te dienen.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel4
  - number: 4a
    text: |-
      1 De houders van vergunningen op grond van deze wet treffen de maatregelen en voorzieningen die nodig zijn om
      verslaving aan de door hen georganiseerde spelen zoveel mogelijk te voorkomen.

      2 De houders van vergunningen op grond van deze wet geven op zorgvuldige en evenwichtige wijze vorm aan wervings-
      en reclameactiviteiten waarbij in het bijzonder wordt gewaakt tegen onmatige deelneming.

      3 Onder zorgvuldige en evenwichtige wervings- en reclameactiviteiten als bedoeld in het tweede lid wordt in ieder
      geval verstaan dat wervings- en reclameactiviteiten niet misleidend zijn en dat bij deze activiteiten;

      a. wordt gewezen op de risico’s van onmatige deelneming aan kansspelen;

      b. aangegeven wordt wat de statistische kans is op het winnen van een prijs, en

      c. wordt aangegeven of er sprake is van eenmalige deelneming dan wel doorlopende deelneming tot wederopzegging.

      4 Wervings- en reclameactiviteiten worden in ieder geval geacht misleidend als bedoeld in het derde lid te zijn
      indien daarin informatie wordt verstrekt die:

      a. de indruk wekt dat de consument al een prijs heeft gewonnen of zal winnen, of

      b. de indruk wekt dat de consument door het verrichten van een bepaalde handeling een prijs zal winnen of een ander
      soortgelijk voordeel zal behalen terwijl daarop slechts een kans bestaat.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste tot en
      met het vierde lid.

      6 De in het vijfde lid bedoelde regels kunnen onder meer betrekking hebben op:

      a. de inhoud van wervings- en reclameactiviteiten;

      b. de doelgroepen waarop zodanige activiteiten zijn gericht;

      c. de hoeveelheid, de tijdsduur en het tijdstip, en

      d. de wijze waarop en de plaats waar wervings- en reclameuitingen worden gedaan.

      7 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel4a
  - number: 4b
    text: |-
      1 In verband met het voorkomen van witwassen en het financieren van terrorisme staan de betrouwbaarheid en de
      geschiktheid van de houder van een vergunning op grond van deze wet, van de personen die zijn beleid bepalen of
      mede bepalen en van zijn uiteindelijke belanghebbende buiten twijfel.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      lid.

      3 Het eerste lid is niet van toepassing op de houders van een vergunning waaraan:

      a. ingevolge [artikel 1b, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1]
      een vrijstelling is verleend;

      b. bij of krachtens deze wet vergelijkbare eisen in verband met het voorkomen van witwassen en financieren van
      terrorisme worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1b
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel4b
