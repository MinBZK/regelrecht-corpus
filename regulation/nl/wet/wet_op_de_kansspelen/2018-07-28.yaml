  - number: '7'
    text: |-
      Het is de vergunninghouder verboden, enig voorschrift van een krachtens deze wet uitgevaardigde algemene maatregel
      van bestuur niet in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel7
  - number: 7a
    text: |-
      Het in [Titel I][ref1] bepaalde is niet van toepassing op het houden van winkelweekacties en het organiseren van
      kleine kansspelen, indien wordt voldaan aan de bepalingen van deze Titel.


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 7b
    text: |-
      1 Onder winkelweekacties worden verstaan die kansspelen, welke voor bijzondere gelegenheden en ten hoogste tweemaal
      per jaar voor een beperkte periode van ten hoogste vier weken worden georganiseerd door een groepering van tien of
      meer ondernemers of filiaalhouders in de detailhandel, het ambacht of het horecabedrijf, die in een of aan elkaar
      grenzende gemeenten hun bedrijf uitoefenen.

      2 Voor het houden van winkelweekacties als in lid 1 bedoeld moet vergunning worden verkregen van de Kamer van
      Koophandel, waaronder de gemeente waar de winkelweekactie zal worden gehouden, ressorteert.

      3 De vergunning wordt verleend, indien en op voorwaarde dat de prijzen of premies in geld of goederen, die ter
      beschikking van de deelnemers worden gesteld, gezamenlijk geen grotere waarde hebben dan € 11.950,- (elf duizend
      negenhonderd en vijftig euro) en de deelnemersbewijzen door de betreffende ondernemers aan hun afnemers om niet ter
      beschikking worden gesteld.

      4 De Kamer van Koophandel is bevoegd een vergunning niet aanstonds te verlenen, indien een ordelijk verloop van
      zaken zulks gewenst doet zijn; zij kan aan de vergunning voorschriften verbinden.

      5 De Kamer van Koophandel weigert een gevraagde vergunning of trekt een verleende vergunning in, indien aannemelijk
      is, dat bij de wet of de vergunning gestelde voorschriften niet zullen worden nageleefd of zodanige voorschriften
      niet zijn nageleefd.

      6 Voor de behandeling van een aanvraag om een vergunning moet een bij algemene maatregel van bestuur vast te
      stellen bedrag worden betaald. De voordracht tot vaststelling of wijziging van deze algemene maatregel van bestuur
      wordt Ons gedaan door Onze Ministers van Veiligheid en Justitie en van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel7b
  - number: 7c
    text: |-
      1 Onder het organiseren van het kleine kansspel wordt verstaan het door een ten minste drie jaar bestaande
      Nederlandse vereniging, die krachtens zijn statuten een duidelijk omschreven doel - niet zijnde de beoefening van
      enigerlei vorm van kansspel - beoogt te dienen, ten bate van een genoemd, niet met het algemeen belang in strijd
      zijnd doel beleggen van een bijeenkomst, waar gelegenheid tot het deelnemen aan het kleine kansspel wordt gegeven,
      waarbij de prijzen of premies in geld of goederen, die door de deelnemers aan het spel kunnen worden verkregen,
      geen hogere waarde hebben dan € 400,- per serie of set en de gezamenlijke waarde daarvan niet meer bedraagt dan €
      1.550,- per bijeenkomst.

      2 Het is verboden een bijeenkomst, waar gelegenheid tot het deelnemen aan het kleine kansspel wordt gegeven, te
      organiseren:

      a. indien niet ten minste veertien dagen tevoren aan burgemeester en wethouders van de gemeente, waar de
      bijeenkomst zal plaatsvinden, op door hen aan te geven wijze of bij gebreke vandien bij aangetekend schrijven,
      mededeling is gedaan van de plaats waar en het tijdstip waarop de bijeenkomst wordt georganiseerd,

      b. indien burgemeester en wethouders zodanige bijeenkomst hebben verboden.

      3 Burgemeester en wethouders verbieden zodanige bijeenkomst, indien op de, in de in het voorgaande lid bedoelde
      mededeling aangegeven dag in de mede daarin aangemelde lokaliteit reeds een soortgelijke bijeenkomst zal
      plaatsvinden, of indien aannemelijk is dat een of meerdere leden van de vereniging die de bijeenkomst organiseert,
      persoonlijk voordeel daaruit verwerven dan wel dat bij de wet of door hen gestelde voorschriften niet zullen worden
      nageleefd of zodanige voorschriften niet zijn nageleefd.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel7c
  - number: 7d
    text: |-
      Als klein kansspel in de zin van deze Titel worden aangemerkt het kienspel, vogelpiekspel, rad van avontuur en
      vergelijkbare, bij algemene maatregel van bestuur aan te wijzen vormen van kansspel.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel7d
  - number: 7e
    text: |-
      1 De in [artikel 7b][ref1] en [artikel 7c][ref2] vastgestelde bedragen worden van rechtswege gewijzigd met een door
      Onze Minister van Veiligheid en Justitie vast te stellen percentage, telkens wanneer de consumentenprijsindex per
      30 september van enig jaar ten minste tien procent afwijkt van het overeenkomstige indexcijfer in het jaar, dat die
      bedragen werden vastgesteld.

      2 De wijziging gaat in op 1 januari volgende op de in het eerste lid genoemde datum.

      3 Het percentage van de wijziging wijkt niet meer af van het procentuele verschil tussen de in het eerste lid
      bedoelde indexcijfers dan nodig is om de bedragen vast te stellen op het naastbij gelegen veelvoud van € 50.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 7b
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 7c
  - number: '8'
    text: |-
      1 Tot het organiseren van de staatsloterij kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen
      van deze titel.

      2 Onder een staatsloterij wordt verstaan een loterij waarbij door trekking de nummers van de deelnamebewijzen
      worden aangewezen waarop de prijzen vallen en waarbij ten minste 60% van de door de deelnemers betaalde inleg aan
      prijzen wordt uitgeloofd.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel8
  - number: '9'
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], kan aan één rechtspersoon met volledige rechtsbevoegdheid
      voor een door hem te bepalen duur vergunning verlenen tot het organiseren van de staatsloterij.

      2 De opbrengst van de staatsloterij - na aftrek van de prijzen en kosten - wordt jaarlijks aan de Staat afgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
        afdeling: '1'
  - number: '10'
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], verbindt voorschriften aan de vergunning tot het organiseren
      van de staatsloterij.

      2 De voorschriften hebben onder meer betrekking op:

      a. het aantal loterijen dat per jaar wordt gehouden;

      b. de mogelijkheid tot het uitgeven van deelloten, recht gevende op een evenredig deel van de prijs, waarin loten
      kunnen zijn verdeeld;

      c. de maximum verkoopprijs van de loten;

      d. de wijze waarop de trekkingen plaatsvinden;

      e. de eisen aan organisatie en produkt;

      f. de wijze waarop en de voorwaarden waaronder de prijzen betaalbaar zijn;

      g. het van overheidswege te houden toezicht op de naleving;

      h. de inrichting van het jaarlijks door de rechtspersoon van zijn werkzaamheden en de financiële resultaten daarvan
      uit te brengen verslag en de wijze van publikatie van dat verslag.

      3 De voorschriften kunnen worden gewijzigd en aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
