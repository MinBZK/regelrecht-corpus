      1 Tot het organiseren van een totalisator kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen
      van deze titel.

      2 Onder totalisator wordt verstaan elke gelegenheid, opengesteld om op de uitslag van harddraverijen en
      paardenrennen te wedden, met dien verstande dat het totaal van de inleg, behoudens bij of krachtens de wet
      toegestane aftrek, verdeeld zal worden onder degenen die op de winnaar of op een der prijswinnaars hebben gewed.
