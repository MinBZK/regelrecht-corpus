  - number: 30k
    text: |-
      1 De vergunning wordt geweigerd indien niet wordt voldaan aan de krachtens
      [artikel 30i, eerste lid, onder a en b, en tweede lid, onder b][ref1], geldende eisen.

      2 De vergunning kan voorts worden geweigerd, indien de aanvrager of de andere in
      [artikel 30i, tweede lid, onder b][ref2], bedoelde personen, de bij of krachtens deze Titel vastgestelde bepalingen
      hebben overtreden in de drie jaren voorafgaande aan het moment van aanvraag van de vergunning.

      3 De vergunning kan ook worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3].

      4 Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], om een advies als
      bedoeld in [artikel 9 van die wet][ref5] worden gevraagd.


