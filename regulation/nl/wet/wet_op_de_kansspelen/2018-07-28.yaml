    text: |-
      1 Tot het organiseren van sportprijsvragen kan uitsluitend vergunning worden verleend overeenkomstig de bepalingen
      van deze titel.

      2 Onder sportprijsvragen worden verstaan prijsvragen, welke erop zijn gericht deelnemers uitslagen van tevoren
      aangekondigde sportwedstrijden, met uitzondering van harddraverijen en paardenrennen, te doen raden of voorspellen.

      3 Indien een of meer der aangekondigde sportwedstrijden op de bepaalde dag geen doorgang vinden, kan voor de niet
      gespeelde wedstrijden een vervangende uitslag gelden.

      4 Aan de deelnemers aan een sportprijsvraag kan tevens gelegenheid worden gegeven tot deelneming aan een kansspel
      waarbij de volgnummers van de deelnamebewijzen aan de sportprijsvraag de lotnummers vormen.
    url: https://wetten.overheid.nl/BWBR0002469/2018-07-28#Artikel15
  - number: '16'
    text: |-
      1 De raad van bestuur, bedoeld in [artikel 33a][ref1], kan met het oog op de belangen van instellingen werkzaam
      ten algemenen nutte, in het bijzonder op het gebied van sport en lichamelijke vorming, van de cultuur, het
      maatschappelijk welzijn en de volksgezondheid, aan één rechtspersoon met volledige rechtsbevoegdheid voor een door
      hem te bepalen duur vergunning verlenen tot het organiseren van sportprijsvragen.

      2 De opbrengst van een prijsvraag - na aftrek van de prijzen en kosten - komt ten goede aan de belangen, die de
      rechtspersoon beoogt te dienen met het aanleggen en houden van sportprijsvragen.

      3 Van de gezamenlijke opbrengst van de ingevolge deze titel en titel IV*a* georganiseerde kansspelen wordt,
      gerekend over een kalenderjaar, ten minste 47,5% bestemd voor uitkering aan prijzen.


