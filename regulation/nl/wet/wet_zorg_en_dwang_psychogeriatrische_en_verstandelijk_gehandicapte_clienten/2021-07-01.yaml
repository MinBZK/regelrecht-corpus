  - number: 77a
    text: |-
      Een door Onze Minister op grond van
      [artikel 1, eerste lid, onderdeel h, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1]
      als verpleeginrichting of zwakzinnigeninrichting aangemerkte zorginstelling of afdeling daarvan wordt door Onze
      Minister ambtshalve opgenomen in het register, bedoeld in [artikel 20, eerste lid][ref2].


