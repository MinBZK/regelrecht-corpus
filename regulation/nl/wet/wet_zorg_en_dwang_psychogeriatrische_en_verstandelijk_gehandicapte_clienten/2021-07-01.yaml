        artikel: '32'
      - id: ref5
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '76.3'
    text: |-
      Ten aanzien van een cliënt die op het tijdstip van inwerkingtreding van deze wet is opgenomen met toepassing van
      [hoofdstuk II][ref1] of [hoofdstuk VIII van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2] en
      waarvoor op dat tijdstip reeds een behandelplan als bedoeld in [artikel 38 van die wet][ref3] is opgesteld, voldoet
      de zorgaanbieder zo spoedig mogelijk, doch in ieder geval binnen zes maanden na het tijdstip van inwerkingtreding
      van deze wet, aan de [artikelen 5 tot en met 11][ref4]. Gedurende de periode waarin de zorgaanbieder ten aanzien
      van de betrokken cliënt nog niet heeft voldaan aan de artikelen 5 tot en met 11, doch ten hoogste gedurende de
      zes maanden, bedoeld in de eerste volzin, blijven de artikelen 38, vijfde, zesde en zevende lid, [41][ref5],
      [41a][ref6], [41b][ref7], [42][ref8], en de [hoofdstukken IX][ref9] en [XI van die wet][ref10] ten aanzien van de
      betrokken cliënt van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0040632#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005700#Artikel41
