        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 17.1.j
    text: |-
      de beoordelingen van de Wzd-functionaris, bedoeld in de [artikelen 11a][ref1],
      [47, derde, achtste en negende lid][ref2], en [48, zesde en tiende lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel48
