    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
  - number: 16.2.p
    text: |-
      de beoordeling van de Wzd-functionaris, bedoeld in [artikel 11a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel11a
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
