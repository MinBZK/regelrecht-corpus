        paragraaf: '4'
  - number: '17.2'
    text: |-
      De zorgaanbieder verstrekt ten minste eens per zes maanden aan de inspectie een digitaal overzicht van de gegevens,
      bedoeld in het eerste lid. Bij algemene maatregel van bestuur kan worden bepaald dat deze gegevens op een bij of
      krachtens die maatregel aangewezen wijze verstrekt worden aan en verwerkt worden door een door Onze Minister aan te
      wijzen instantie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
  - number: '18.1'
    text: |-
      De zorgaanbieder verstrekt ten minste eens per zes maanden aan de inspectie een door het bestuur van de
      zorgaanbieder ondertekende analyse over de verplichte onvrijwillige zorg die door hem in die periode is verleend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18
  - number: '18.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over de inhoud en de wijze van verstrekken van de
      analyse.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18
  - number: 18a.1
    text: |-
      De zorgaanbieder bewaart de gegevens en bescheiden, bedoeld in [artikel 17][ref1] gedurende de termijn, bedoeld in
      [artikel 7:454 van het Burgerlijk Wetboek][ref2], te rekenen vanaf het tijdstip waarop de onvrijwillige zorg wordt
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
  - number: 18a.2
    text: |-
      De burgemeester en het CIZ bewaren de beschikking tot inbewaringstelling en de verklaring bedoeld
      in [artikel 30, eerste lid][ref1], of het besluit tot opname en verblijf en de verklaring,
      bedoeld in [artikel 26, vijfde lid, onderdeel d][ref2] gedurende de termijn, bedoeld in
      [artikel 7:454 van het Burgerlijk Wetboek][ref3] te rekenen vanaf het tijdstip waarop het verblijf op basis van de
      beschikking of het besluit tot opname en verblijf wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '454'
  - number: 18a.3
    text: |-
      Indien het verzoek om een rechterlijke machtiging niet-ontvankelijk is verklaard, bewaart het CIZ het verzoek
      gedurende één jaar te rekenen vanaf het tijdstip waarop die beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
  - number: 18a.4
    text: |-
      Na verloop van de termijnen, bedoeld in het eerste, tweede en derde lid, worden de documenten, bedoeld in
      respectievelijk het eerste, tweede of derde lid, vernietigd, tenzij:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
  - number: 18a.4.a
    text: |-
      redelijkerwijs aannemelijk is dat bewaring van de gegevens en bescheiden van aanmerkelijk belang is voor een ander
      dan de cliënt, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
  - number: 18a.4.b
    text: het bij de wet bepaalde zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
  - number: 18a.5
    text: |-
      In afwijking van het bepaalde in het eerste en tweede lid worden vanaf vijf jaar na de beëindiging van
      onvrijwillige zorg of beschikking tot inbewaringstelling de gegevens en bescheiden binnen drie maanden vernietigd
      indien de cliënt daartoe verzoekt en:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
  - number: 18a.5.a
    text: |-
      redelijkerwijs aannemelijk is dat bewaring van de gegevens en bescheiden niet van aanmerkelijk belang is voor een
      ander dan de cliënt,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
  - number: 18a.5.b
    text: het bij de wet bepaalde zich niet tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18a
  - number: 18b.1
    text: |-
      De zorgaanbieder verschaft het CIZ ten behoeve van diens taak op grond van hoofdstuk 3, inzage in het zorgplan
      bedoeld in [artikel 5, tweede lid][ref1], en het dossier bedoeld in [artikel 16, tweede lid][ref2], van een
      cliënt voor wie een besluit tot opname en verblijf of een verzoek om een rechterlijke machtiging als bedoeld in
      [artikel 24][ref3] wordt voorbereid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 18b.2
    text: |-
      De zorgaanbieder verstrekt desgevraagd inzage in of afschrift van gegevens uit het dossier van een overleden
      cliënt, bedoeld in [artikel 16, tweede lid][ref1], aan:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel16
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 18b.2.a
    text: |-
      een persoon ten behoeve van wie de cliënt bij leven toestemming heeft gegeven indien die toestemming schriftelijk
      of elektronisch is vastgelegd;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
  - number: 18b.2.b
    text: |-
      een nabestaande of een vertegenwoordiger, indien die nabestaande of die vertegenwoordiger een mededeling over
      een incident op grond van [artikel 10, derde lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1] heeft
      gekregen;


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel10
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '10'
  - number: 18b.2.c
    text: |-
      een ieder die een zwaarwegend belang heeft en aannemelijk maakt dat dit belang mogelijk wordt geschaad en dat
      inzage in of afschrift van gegevens uit het dossier noodzakelijk is voor de behartiging van dit belang.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
  - number: 18b.3
    text: |-
      De zorgaanbieder verstrekt aan degene of de instelling die het gezag uitoefende over de cliënt die op het moment
      van overlijden de leeftijd van zestien jaar nog niet had bereikt, desgevraagd inzage in of afschrift van gegevens
      uit het dossier van deze cliënt, tenzij dit in strijd is met de zorg van een goed zorgverlener.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
  - number: 18b.4
    text: |-
      Op grond van dit artikel worden uitsluitend gegevens verstrekt voor zover deze betrekking hebben op de grond
      waarvoor inzage wordt verleend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
  - number: 18b.5
    text: |-
      Op grond van dit artikel worden geen gegevens verstrekt voor zover schriftelijk of elektronisch is vastgelegd dat
      de overleden cliënt die de leeftijd van twaalf jaar had bereikt en tot een redelijke waardering van zijn belangen
      ter zake in staat was, deze inzage niet wenst, of daarbij de persoonlijke levenssfeer van een ander wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18b
  - number: 18ba.1
    text: |-
      Indien op grond van [artikel 18a, tweede lid, onderdeel c][ref1], om inzage in of afschrift van gegevens uit het
      dossier van een overleden cliënt wordt gevraagd vanwege een vermoeden van een medische fout en de zorgaanbieder
      de gevraagde inzage of het gevraagde afschrift niet verstrekt, verstrekt de zorgaanbieder op verzoek van degene
      die om de inzage of het afschrift heeft gevraagd inzage in of afschrift van de gegevens aan een door de verzoeker
      aangewezen onafhankelijke arts.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel18a
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18ba
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 18a
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 18ba.2
    text: |-
      De arts, bedoeld in het eerste lid, beoordeelt of het niet verstrekken van de inzage of het afschrift
      gerechtvaardigd is. Indien de arts van oordeel is dat het niet verstrekken niet gerechtvaardigd is, verstrekt de
      zorgaanbieder alsnog inzage of afschrift aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18ba
  - number: 18c.1
    text: |-
      Onverminderd andere verplichtingen tot het verstrekken van gegevens die voortvloeien uit deze wet, verstrekken de
      zorgaanbieder, de Wzd-functionaris, de zorgverantwoordelijke, het CIZ, de burgemeester en de officier van justitie
      elkaar, zo nodig zonder toestemming van de cliënt of diens vertegenwoordiger, gegevens voor zover dat strikt
      noodzakelijk is ter voorkoming of beperking van ernstig nadeel, en dit hoort bij de uitoefening van ieders taak op
      grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: 18c.2
    text: |-
      Onder de gegevens die op grond van deze wet worden verwerkt, dan wel kunnen worden verwerkt, worden justitiële
      en strafvorderlijke gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1],
      politiegegevens als bedoeld in de [Wet politiegegevens][ref2] en gegevens over gezondheid als
      bedoeld in artikel 4, onderdeel 15 van de Algemene verordening gegevensbescherming begrepen. De Wzd-
      functionaris, de zorgverantwoordelijke, de burgemeester, het CIZ, de officier van justitie en inspectie
      vermelden bij het verstrekken van persoonsgegevens aan elkaar tevens het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3], van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0022463
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0022463
      - id: ref3
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 18c.3
    text: |-
      De zorgaanbieder, de Wzd-functionaris, het CIZ, de burgemeester en de officier van justitie stellen de
      zorgverantwoordelijke ten behoeve van diens taak op grond van [artikel 16, tweede lid, onderdeel h][ref1], op de
      hoogte indien zij op grond van het eerste lid gegevens over betrokkene uitwisselen zonder diens toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel16
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 18c.4
    text: |-
      De medewerkers van de zorgaanbieder, de Wzd-functionaris, de zorgverantwoordelijke, het CIZ, de burgemeester en de
      officier van justitie en de rechter zijn tot geheimhouding verplicht van hetgeen in de uitoefening van hun taak aan
      hen is toevertrouwd, tenzij het bepaalde in het eerste lid of enig ander wettelijk voorschrift hen tot mededeling
      verplicht of uit hun taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: 18c.5
    text: |-
      In afwijking van het bepaalde in het vierde lid kunnen de zorgaanbieder, de Wzd-functionaris, het CIZ en de
      burgemeester zonder toestemming van de cliënt gegevens en bescheiden ten behoeve van statistiek of wetenschappelijk
      onderzoek aan een ander verstrekken, indien:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: 18c.5.a
    text: het onderzoek voorziet in zodanige waarborgen dat de persoonlijke levenssfeer van de cliënt niet wordt geschaad,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: 18c.5.b
    text: het onderzoek een zwaarwegend algemeen belang dient, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: 18c.5.c
    text: de cliënt niet uitdrukkelijk bezwaar heeft gemaakt tegen verstrekking.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: 18c.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop de gegevensverwerkingen
      die voortvloeien uit deze wet worden ingericht en met aanvullende waarborgen worden omkleed, waaronder begrepen de
      technische standaarden daarvoor.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: 18c.7
    text: |-
      De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel18c
  - number: '19.1'
    text: |-
      Een zorgaanbieder die onvrijwillige zorg verleent, draagt zorg voor een beleidsplan waarin hij in ieder geval
      vastlegt:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel19
  - number: 19.1.a
    text: door middel van welke alternatieven hij tracht om onvrijwillige zorg zoveel mogelijk te voorkomen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel19
  - number: 19.1.b
    text: hoe hij omgaat met het toepassen van onvrijwillige zorg en de afbouw van onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel19
  - number: 19.1.c
    text: de wijze van intern toezicht bij uitvoering van onvrijwillige zorg.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel19
  - number: '19.2'
    text: |-
      Bij het opnemen van onvrijwillige zorg in een zorgplan en het verlenen van onvrijwillige zorg, overeenkomstig het
      bepaalde in de [artikelen 9 tot en met 15][ref1], wordt rekening gehouden met dit beleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel9
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20.1'
    text: |-
      De zorgaanbieder die onvrijwillige zorg verleent, verstrekt Onze Minister, ter opneming in een openbaar register,
      een opgave van de:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel20
  - number: 20.1.a
    text: naam of een andere aanduiding van de locatie, alsmede het adres ervan;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel20
  - number: 20.1.b
    text: aanduiding of de locatie een accommodatie is;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel20
  - number: 20.1.c
    text: naam, het adres, de rechtsvorm en het Handelsregisternummer van de zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen bouwkundige eisen worden gesteld aan de accommodatie, tenzij deze behoort
      tot een instelling als bedoeld in de [Wet forensische zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040634
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0040634
  - number: '21.1'
    text: |-
      Opname en verblijf of de voortzetting van het verblijf van een cliënt van twaalf jaar of ouder die geen blijk
      geeft van de nodige bereidheid daartoe, maar zich er ook niet tegen verzet, vindt uitsluitend plaats in een
      geregistreerde accommodatie op basis van een besluit tot opname en verblijf van het CIZ.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: '21.2'
    text: 'Het CIZ neemt uitsluitend een besluit tot opname en verblijf, als bedoeld in het eerste lid, indien:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: 21.2.a
    text: |-
      de cliënt naar zijn oordeel geen blijk geeft van de nodige bereidheid tot opname en verblijf of de voortzetting van
      het verblijf, maar zich er ook niet tegen verzet;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: 21.2.b
    text: |-
      naar zijn oordeel het gedrag van een cliënt als gevolg van zijn psychogeriatrische aandoening of verstandelijke
      handicap, dan wel als gevolg van een daarmee gepaard gaande psychische stoornis of een combinatie daarvan, leidt
      tot ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: 21.2.c
    text: |-
      de opname en het verblijf of de voortzetting van het verblijf noodzakelijk is om het ernstige nadeel te voorkomen
      of af te wenden;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: 21.2.d
    text: |-
      de opname en het verblijf of de voorzetting van het verblijf geschikt is om het ernstige nadeel te voorkomen of af
      te wenden, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: 21.2.e
    text: er geen minder ingrijpende mogelijkheden zijn om het ernstige nadeel te voorkomen of af te wenden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: '21.3'
    text: |-
      Indien een cliënt vrijwillig of met toepassing van deze paragraaf is opgenomen en verblijft in een accommodatie,
      maar zich vervolgens op zodanige wijze verzet tegen verschillende onderdelen van de zorgverlening dat het leveren
      van cliëntgerichte zorg feitelijk niet mogelijk is, wordt de voortzetting van het verblijf geacht onvrijwillig te
      zijn en is [artikel 24, eerste lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '21.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld, betreffende de deskundigheidseisen waaraan
      het CIZ dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel21
  - number: '22.1'
    text: |-
      Tot het indienen van een aanvraag tot een besluit tot opname en verblijf, als bedoeld in
      [artikel 21, eerste lid][ref1], zijn bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel21
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 22.1.a
    text: de echtgenoot, de geregistreerde partner of andere levensgezel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: 22.1.b
    text: de vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: 22.1.c
    text: |-
      elke meerderjarige bloedverwant in de rechte lijn of de zijlijn tot en met de tweede graad en elke meerderjarige
      aanverwant tot en met de tweede graad;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: 22.1.d
    text: |-
      de zorgaanbieder die de cliënt zorg verleent, voor zover het een cliënt betreft die al in een accommodatie
      verblijft, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: 22.1.e
    text: |-
      de Wzd-functionaris, voor zover het een cliënt betreft die al in een accommodatie verblijft dan wel voor wie een
      zorgplan is vastgesteld waarin onvrijwillige zorg wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: '22.2'
    text: De aanvraag, bedoeld in het eerste lid, wordt ingediend bij het CIZ.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: '22.3'
    text: |-
      Indien de aanvraag een cliënt betreft die al op grond van een besluit als bedoeld in
      [artikel 21, eerste lid][ref1], in de accommodatie verblijft, wordt de aanvraag in de zevende week voor het einde
      van de geldigheidsduur van het lopende besluit gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel21
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '22.4'
    text: Het CIZ neemt het besluit tot opname en verblijf binnen 6 weken na de datum van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: '22.5'
    text: In het besluit tot opname en verblijf wordt de geldigheidsduur ervan vermeld, welke ten hoogste vijf jaren is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: '22.6'
    text: |-
      Het CIZ kan met betrekking tot de cliënt die al op grond van een besluit tot opname en verblijf in een accommodatie
      verblijft, telkens een nieuw besluit tot opname en verblijf nemen met een geldigheidsduur van ten hoogste vijf
      jaren.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: '22.7'
    text: |-
      Voorafgaand aan de behandeling van een aanvraag, bedoeld in het eerste en derde lid, wordt aan de cliënt of zijn
      vertegenwoordiger mondeling en schriftelijk medegedeeld dat hij zich kan verzetten tegen opname en verblijf.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: '22.8'
    text: |-
      Indien een cliënt die met toepassing van deze paragraaf is opgenomen in een accommodatie, zich verzet tegen
      het verblijf in die accommodatie, en dit verblijf niet in een andere door de cliënt of zijn vertegenwoordiger
      aangewezen accommodatie wil voortzetten, is [artikel 24, eerste lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '22.9'
    text: 'Het besluit tot opname en verblijf vervalt vanaf het moment waarop:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: 22.9.a
    text: |-
      de aanspraak op opname en verblijf vervalt wegens het herzien of intrekken van het indicatiebesluit als bedoeld in
      de Wet langdurige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: 22.9.b
    text: |-
      de rechter een machtiging tot opname en verblijf heeft afgegeven of de burgemeester een last tot inbewaringstelling
      heeft afgegeven, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: 22.9.c
    text: |-
      het CIZ op verzoek van de cliënt heeft vastgesteld dat deze zijn bereidheid tot opname heeft uitgesproken. Het CIZ
      doet hiervan mededeling aan de zorgaanbieder. Op verzoek van het CIZ verklaart de bij de zorg betrokken arts of de
      cliënt in staat is tot een redelijke waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
  - number: '22.10'
    text: |-
      Indien het CIZ twijfelt of er sprake is van onvrijwilligheid, als bedoeld in [artikel 24, tweede lid][ref1], meldt
      het dit aan de aanvrager, en vraagt hierover een beoordeling aan een bij regeling van Onze Minister aangewezen
      externe deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '22.11'
    text: |-
      Indien op grond van het tiende lid, geoordeeld wordt dat er sprake is van onvrijwilligheid, behandelt het CIZ de
      aanvraag vanaf dat moment als aanvraag als bedoeld in [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '23'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden betreffende:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel23
  - number: 23.a
    text: de behandeling van een aanvraag tot opname en verblijf;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel23
  - number: 23.b
    text: |-
      de administratieve voorschriften betreffende de aanvraag en het besluit tot opname en verblijf in een accommodatie,
      en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel23
  - number: 23.c
    text: de inhoud van het besluit tot opname en verblijf.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel23
  - number: '24.1'
    text: |-
      Onvrijwillige opname en verblijf of voortzetting van het verblijf van een cliënt is alleen mogelijk met een
      rechterlijke machtiging in een geregistreerde accommodatie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: '24.2'
    text: 'De opname en het verblijf of de voortzetting van het verblijf is onvrijwillig indien:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: 24.2.a
    text: de cliënt van twaalf jaar of ouder zich verzet tegen de opname en het verblijf of de voortzetting van het verblijf;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: 24.2.b
    text: de vertegenwoordiger zich verzet tegen de opname en het verblijf of voortzetting van het verblijf, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: 24.2.c
    text: |-
      de ouders die gezamenlijk het gezag over de betrokkene uitoefenen, van mening verschillen over de opname en het
      verblijf of de voortzetting van het verblijf.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: '24.3'
    text: |-
      De rechter kan op verzoek van het CIZ een machtiging als bedoeld in het eerste lid verlenen, indien naar het
      oordeel van de rechter:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: 24.3.a
    text: |-
      het gedrag van een cliënt als gevolg van zijn psychogeriatrische aandoening of verstandelijke handicap, dan wel als
      gevolg van een daarmee gepaard gaande psychische stoornis of een combinatie daarvan, leidt tot ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: 24.3.b
    text: |-
      de opname en het verblijf of de voortzetting van het verblijf noodzakelijk is om het ernstige nadeel te voorkomen
      of af te wenden;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: 24.3.c
    text: |-
      de opname en het verblijf of de voortzetting van het verblijf geschikt is om het ernstige nadeel te voorkomen of af
      te wenden, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: 24.3.d
    text: er geen minder ingrijpende mogelijkheden zijn om het ernstige nadeel te voorkomen of af te wenden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
  - number: '24.4'
    text: |-
      Indien een cliënt vrijwillig of op grond van een besluit als bedoeld in [artikel 21, eerste lid][ref1], in
      een accommodatie is opgenomen en verblijft, maar zich vervolgens op zodanige wijze verzet tegen verschillende
      onderdelen van de zorgverlening dat het leveren van cliëntgerichte zorg feitelijk niet mogelijk is, wordt de
      voortzetting van het verblijf geacht onvrijwillig te zijn en is het eerste lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel21
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '25.1'
    text: |-
      De volgende personen kunnen het CIZ vragen een verzoek om een rechterlijke machtiging, als bedoeld in
      [artikel 24, eerste lid][ref1], in te dienen:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 25.1.a
    text: de echtgenoot, de geregistreerde partner of andere levensgezel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
  - number: 25.1.b
    text: de vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
  - number: 25.1.c
    text: |-
      elke meerderjarige bloedverwant in de rechte lijn of de zijlijn tot en met de tweede graad en elke meerderjarige
      aanverwant tot en met de tweede graad;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
  - number: 25.1.d
    text: de zorgaanbieder die de cliënt feitelijk zorg verleent, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
  - number: 25.1.e
    text: de Wzd-functionaris.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
  - number: '25.2'
    text: De aanvraag wordt schriftelijk ingediend bij het CIZ.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
  - number: '25.3'
    text: |-
      Indien het een cliënt betreft die al op grond van een machtiging tot opname en verblijf in een accommodatie
      verblijft, wordt de aanvraag in de negende of achtste week voor het einde van de geldigheidsduur van deze
      machtiging gedaan. Indien het een cliënt betreft die al op grond van een machtiging tot verlenging van de
      inbewaringstelling in een accommodatie verblijft, wordt de aanvraag in de vierde week voor het einde van de
      geldigheidsduur van deze machtiging gedaan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de cliënt minderjarig is, onder curatele is gesteld dan wel ten behoeve van hem een
      mentorschap is ingesteld, wordt bij de aanvraag overgelegd respectievelijk een uittreksel uit het in
      [artikel 244 van Boek 1 van het Burgerlijk Wetboek][ref1] bedoelde register, of een verklaring van de griffier
      van de rechtbank dat ten aanzien van de minderjarige het register geen gegevens bevat, een uittreksel uit het
      in [artikel 391 van Boek 1 van het Burgerlijk Wetboek][ref2] bedoelde register, dan wel een afschrift van de
      beschikking waarbij het mentorschap is ingesteld alsmede van die waarbij een mentor is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel244
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel391
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '244'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '391'
  - number: '26.1'
    text: |-
      Het CIZ doet zo spoedig mogelijk doch binnen drie weken na de dag van verzending van de aanvraag, bedoeld in
      [artikel 25, eerste lid][ref1], bij de rechter een verzoek tot het verlenen van een machtiging. Indien het een
      cliënt betreft die al op grond van een machtiging tot verlenging van de inbewaringstelling in een accommodatie
      verblijft, doet het CIZ het verzoek bij de rechter binnen één week na de dag van verzending van de aanvraag,
      bedoeld in artikel 25, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Het CIZ doet het in het eerste lid bedoelde verzoek indien er grond is om aan te nemen dat de opname
      en het verblijf of de voortzetting van het verblijf onvrijwillig is en voldaan wordt aan de in
      [artikel 24, tweede en derde lid][ref1], genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '26.3'
    text: |-
      Indien het CIZ besluit om geen verzoek als bedoeld in het eerste lid in te dienen, doet het hiervan mededeling aan
      de aanvrager.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
  - number: '26.4'
    text: |-
      Indien het verzoek een cliënt betreft die al in een accommodatie verblijft, deelt het CIZ zijn beslissing
      schriftelijk mee aan de zorgaanbieder die deze accommodatie beheert.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
  - number: '26.5'
    text: 'Het CIZ overlegt bij het verzoek tot het verlenen van een machtiging:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
  - number: 26.5.a
    text: |-
      het indicatiebesluit dat op grond van [artikel 3.2.3 van de Wet langdurige zorg][ref1] door het CIZ is vastgesteld,
      dan wel de verklaring, bedoeld in [artikel 1, eerste lid, onderdeel c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel1
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '1'
        hoofdstuk: '1'
  - number: 26.5.b
    text: |-
      de aanvraag, bedoeld in [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 26.5.c
    text: |-
      de bescheiden, bedoeld in [artikel 25, vierde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 26.5.d
    text: |-
      een verklaring van een ter zake kundige arts die de cliënt met het oog op de machtiging kort te voren heeft
      onderzocht, maar die ten minste gedurende één jaar geen zorg heeft verleend aan de cliënt en ten opzichte van de
      zorgaanbieder onafhankelijk functioneert.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
  - number: '26.6'
    text: |-
      Ingeval het verzoek tot het verlenen van een machtiging een cliënt betreft die al in een accommodatie verblijft,
      overlegt het CIZ naast de bescheiden, genoemd in het vijfde lid, een afschrift van het zorgplan, bedoeld in
      [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel5
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '26.7'
    text: Het CIZ vermeldt in het verzoek de gewenste duur van de machtiging.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel26
  - number: '27.1'
    text: |-
      Uit de verklaring, bedoeld in [artikel 26, vijfde lid, onderdeel d][ref1], blijkt:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel26
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 27.1.a
    text: |-
      dat er sprake is van onvrijwilligheid, als bedoeld in [artikel 24, tweede lid][ref1], en waaruit deze
      onvrijwilligheid bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 27.1.b
    text: |-
      dat er sprake is van gedrag van de cliënt als gevolg van zijn psychogeriatrische aandoening of verstandelijke
      handicap, dan wel als gevolg van een daarmee gepaard gaande psychische stoornis of een combinatie daarvan, dat
      leidt tot ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
  - number: 27.1.c
    text: |-
      dat de opname en het verblijf of de voortzetting van het verblijf noodzakelijk is om het ernstige nadeel te
      voorkomen of af te wenden;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
  - number: 27.1.d
    text: |-
      dat de opname en het verblijf of de voortzetting van het verblijf geschikt is om het ernstige nadeel te voorkomen
      of af te wenden, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
  - number: 27.1.e
    text: dat er geen minder ingrijpende mogelijkheden zijn om het ernstige nadeel te voorkomen of af te wenden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
  - number: '27.2'
    text: De verklaring verschaft inzicht in de actuele situatie van de cliënt, wordt met redenen omkleed en ondertekend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
  - number: '27.3'
    text: |-
      De arts die de verklaring opstelt, pleegt van tevoren overleg met de zorgaanbieder die de cliënt zorg verleent of,
      indien deze ontbreekt, met de huisarts van de cliënt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
  - number: '27.4'
    text: De cliënt en zijn vertegenwoordiger worden op de hoogte gebracht van het opmaken van de verklaring.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel27
  - number: '28.1'
    text: |-
      Het CIZ zendt een aanvraag, als bedoeld in [artikel 25, eerste lid][ref1], tot behandeling waarvan kennelijk de
      officier van justitie, bedoeld in [hoofdstuk 5 van de Wet verplichte geestelijke gezondheidszorg][ref2], bevoegd
      is, onverwijld door naar de officier van justitie bij het desbetreffende arrondissementsparket, onder gelijktijdige
      mededeling daarvan aan de afzender.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040635
        hoofdstuk: '5'
  - number: '28.2'
    text: |-
      Het CIZ zendt een aanvraag, als bedoeld in [artikel 25, eerste lid][ref1], met betrekking
      tot een cliënt, van wie het heeft geconstateerd dat deze naast zijn psychogeriatrische
      stoornis of verstandelijke handicap een andere psychische stoornis heeft, waarvoor ingevolge
      zijn gedrag en de benodigde zorg, opname en verblijf in een accommodatie als bedoeld in
      [artikel 1:1, eerste lid, onderdeel b, van de Wet verplichte geestelijke gezondheidszorg][ref2], het meest
      aangewezen is, onverwijld door naar de officier van justitie bij het desbetreffende arrondissementsparket, onder
      gelijktijdige mededeling daarvan aan de afzender.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel1
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040635
        artikel: '1'
  - number: 28aa.1
    text: |-
      De rechter kan op verzoek van het CIZ een voorwaardelijke machtiging verlenen die strekt tot opname en verblijf
      in een geregistreerde accommodatie van een cliënt die de leeftijd van achttien jaar heeft bereikt maar nog niet de
      leeftijd van drieëntwintig jaar, aansluitend op de verlening van jeugdhulp als bedoeld in de [Jeugdwet][ref1] aan
      die cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 28aa.2
    text: 'Een voorwaardelijke machtiging kan slechts worden verleend, indien naar het oordeel van de rechter:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
  - number: 28aa.2.a
    text: |-
      het gedrag van een cliënt als gevolg van zijn verstandelijke handicap, dan wel als gevolg van een daarmee gepaard
      gaande psychische stoornis of een combinatie daarvan, leidt tot ernstig nadeel, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
  - number: 28aa.2.b
    text: |-
      het ernstig nadeel buiten een geregistreerde accommodatie slechts door het stellen en naleven van voorwaarden kan
      worden afgewend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
  - number: 28aa.3
    text: |-
      [Artikel 25, eerste, tweede en vierde lid][ref1], zijn van toepassing, met dien verstande dat de cliënt ook zelf
      het CIZ kan vragen een verzoek om een voorwaardelijke machtiging in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28aa.4
    text: |-
      [Artikel 26, eerste lid en derde, vijfde en achtste lid][ref1], zijn van overeenkomstige toepassing, met dien
      verstande dat uit de verklaring, bedoeld in artikel 26, zesde lid, onderdeel a, blijkt dat wordt voldaan aan de
      gronden, bedoeld in het tweede lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel26
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28aa.5
    text: |-
      De rechter verleent een voorwaardelijke machtiging slechts indien hem een zorgplan wordt overgelegd dat is
      opgesteld overeenkomstig [artikel 5][ref1] en na het doorlopen van de procedure van [artikel 9][ref2]. In het
      zorgplan wordt vermeld op welke grond de zorgverantwoordelijke tot het oordeel is gekomen dat redelijkerwijs is aan
      te nemen dat cliënt de voorwaarden als opgenomen in het zorgplan, zal naleven. In het zorgplan wordt medegedeeld
      welke geregistreerde accommodatie bereid is de cliënt op te nemen als de voorwaarden in het zorgplan niet worden
      nageleefd, of het ernstig nadeel niet langer buiten een geregistreerde accommodatie kan worden afgewend door de
      naleving van de voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel9
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 28aa.6
    text: |-
      Naast of in afwijking van de voorwaarden in het zorgplan kan de rechter bij de verlening van de voorwaardelijke
      machtiging voorwaarden stellen betreffende het gedrag van de cliënt, voor zover dit gedrag het ernstig nadeel,
      voortvloeiend uit de verstandelijke handicap, beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
  - number: 28aa.7
    text: |-
      De [artikelen 38][ref1], [39, eerste tot en met derde en achtste en negende lid][ref2], en [41][ref3] zijn van
      overeenkomstige toepassing bij het afgeven van de voorwaardelijke machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel41
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28aa
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28ab.1
    text: |-
      Een voorwaardelijke machtiging heeft een geldigheidsduur van ten hoogste een jaar na dagtekening en eindigt
      uiterlijk op de dag waarop de cliënt de leeftijd van drieëntwintig jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ab
  - number: 28ab.2
    text: De rechter kan op verzoek van het CIZ een voorwaardelijke machtiging telkens verlengen met een jaar.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ab
  - number: 28ab.3
    text: |-
      Een voorwaardelijke machtiging wordt slechts verlengd indien naar het oordeel van de rechter het ernstig nadeel,
      voortvloeiend uit het gedrag van de cliënt, ook na het verloop van de geldigheidsduur van de machtiging aanwezig
      zal zijn en het afwenden van het ernstig nadeel een verlenging van de voorwaardelijke machtiging vereist.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ab
  - number: 28ab.4
    text: |-
      Bij het verzoek om verlenging van de voorwaardelijke machtiging wordt een verklaring als bedoeld in
      [artikel 26, vijfde lid, onderdeel d][ref1], overgelegd, waaruit blijkt dat het ernstig nadeel, voortvloeiend uit
      het gedrag van de cliënt, ook na het verloop van de geldigheidsduur van de machtiging aanwezig zal zijn en het
      afwenden van het ernstig nadeel een verlenging van de voorwaardelijke machtiging vereist. Tevens wordt door de
      zorgverantwoordelijke een beschrijving overgelegd van de toestand van de cliënt, van de aan hem verleend zorg en de
      effecten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel26
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ab
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28ab.5
    text: |-
      Het verzoekschrift tot verlenging van een voorwaardelijke machtiging wordt ingediend uiterlijk dertig dagen, doch
      niet eerder dan vijftig dagen voor het einde van de geldigheidsduur van de lopende machtiging.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ab
  - number: 28ab.6
    text: |-
      [Artikel 28aa][ref1] is van overeenkomstige toepassing op de verlenging van de voorwaardelijke machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel28aa
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ab
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 28aa
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28ac.1
    text: |-
      Indien het ernstig nadeel niet langer buiten een geregistreerde accommodatie kan worden afgewend door
      naleving van de voorwaarden, dan wel de cliënt de in de machtiging opgenomen voorwaarden niet naleeft, neemt
      de zorgverantwoordelijke de cliënt op in een geregistreerde accommodatie. Voorafgaand aan de opname stelt de
      zorgverantwoordelijke zich op de hoogte van de toestand van de cliënt en vraagt hij over de voorgenomen opname
      advies aan een externe deskundige als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel11
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ac
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 28ac.2
    text: |-
      De opname geschiedt voor ten hoogste de termijn van de resterende geldigheidsduur van de voorwaardelijke
      machtiging, doch niet langer dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ac
  - number: 28ac.3
    text: |-
      Vanaf het moment dat de cliënt is opgenomen op grond van een voorwaardelijke machtiging, wordt die machtiging
      aangemerkt als een rechterlijke machtiging als bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ac
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28ac.4
    text: |-
      De zorgverantwoordelijke stelt de cliënt uiterlijk vier dagen na zijn beslissing tot opname daarvan schriftelijk
      in kennis, onder mededeling van de redenen van de beslissing, tenzij de opname plaatsvindt op verzoek van de
      cliënt. Een afschrift van de beslissing wordt gezonden aan het CIZ en aan de griffier van de rechtbank die de
      voorwaardelijke machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ac
  - number: 28ac.5
    text: |-
      De personen, bedoeld in [artikel 25, eerste lid][ref1], kunnen de zorgverantwoordelijke verzoeken toepassing te
      geven aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ac
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28ad.1
    text: |-
      Met betrekking tot de beslissing van de zorgverantwoordelijke, bedoeld in [artikel 28ac, eerste lid][ref1], kunnen
      de cliënt en de in [artikel 25, eerste lid][ref2], genoemde personen, het CIZ vragen de beslissing van de rechter
      te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel28ac
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ad
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 28ac
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28ad.2
    text: |-
      De aanvraag wordt schriftelijk ingediend, vergezeld van een afschrift van de beslissing van de
      zorgverantwoordelijke en het advies van de externe deskundige.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ad
  - number: 28ad.3
    text: |-
      Het CIZ verzoekt na ontvangst van de aanvraag, bedoeld in het eerste lid, zo spoedig mogelijk de beslissing van de
      rechter. Aan de aanvrager wordt schriftelijk medegedeeld dat het verzoekschrift is ingediend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ad
  - number: 28ad.4
    text: |-
      [Artikel 39, eerste lid][ref1], is van overeenkomstige toepassing. Tegen de beslissing van de rechter staat geen
      hoger beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel39
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28ad
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28a.1
    text: |-
      Indien de officier van justitie een verzoekschrift om een rechterlijke machtiging met toepassing van
      [artikel 2.3, tweede lid, van de Wet forensische zorg overweegt][ref1], gaat deze na of reeds een aanvraag voor een
      rechterlijke machtiging voor onvrijwillige opname voor de cliënt wordt voorbereid door het CIZ, in welk geval het
      CIZ en hij hierover overleg voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '2'
  - number: 28a.2
    text: 'Zodra de officier van justitie met de voorbereiding van een verzoekschrift begint:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.2.a
    text: |-
      gaat hij na of er politiegegevens als bedoeld in de [Wet politiegegevens][ref1] of justitiële en strafvorderlijke
      gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref2] over de cliënt zijn die relevant
      kunnen zijn voor de beoordeling van het ernstig nadeel en de noodzaak tot onvrijwillige opname en verstrekt hij
      die gegevens aan de arts die de in onderdeel b bedoelde medische verklaring opstelt, tenzij het belang van enig
      strafrechtelijk onderzoek zich daartegen verzet;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0022463
      - id: ref2
        bwb_id: BWBR0014194
  - number: 28a.2.b
    text: |-
      draagt hij zorg voor een medische verklaring als bedoeld in [artikel 26, vijfde lid onderdeel d][ref1], opgesteld
      in overeenstemming met het bepaalde in de [artikelen 26, zevende lid][ref2] en [27][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel27
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28a.2.c
    text: |-
      gaat hij na of de betrokkene een wettelijk vertegenwoordiger heeft en start zo nodig de procedure voor het
      aanwijzen van een wettelijk vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.2.d
    text: |-
      verzoekt hij het CIZ om een schriftelijk advies over de noodzaak voor een rechterlijke machtiging en over de
      tenuitvoerlegging daarvan waarbij hij aan het CIZ de gegevens bedoeld in onderdeel a, de verklaring bedoeld in
      onderdeel b en, zo mogelijk, de gegevens van de wettelijk vertegenwoordiger van de cliënt verstrekt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.3
    text: |-
      In het verzoekschrift geeft de officier van justitie gemotiveerd aan waarom deze van oordeel is dat aan de criteria
      voor onvrijwillige opname is voldaan. Bij het verzoekschrift voegt de officier van justitie in elk geval:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.3.a
    text: de in het tweede lid, onderdeel a, bedoelde gegevens;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.3.b
    text: de in het tweede lid, onderdeel b, bedoelde verklaring; en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.3.c
    text: het in het tweede lid, onderdeel d, bedoelde advies van het CIZ.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.4
    text: De rechter motiveert zijn beslissing en gaat daarbij met name in op het advies van het CIZ.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
  - number: 28a.5
    text: |-
      Indien de rechter ambtshalve toepassing van [artikel 2.3, tweede lid, van de Wet forensische zorg][ref1] overweegt,
      verzoekt hij de officier van justitie toepassing te geven aan het bepaalde in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '2'
  - number: 28b.1
    text: |-
      De officier van justitie gaat onverwijld over tot tenuitvoerlegging van de rechterlijke machtiging als bedoeld
      in [artikel 28a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel28a
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 28a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28b.2
    text: |-
      Het ten uitvoer leggen van een krachtens [artikel 28a][ref1] gegeven rechterlijke machtiging kan de officier van
      justitie opdragen aan een of meer ambtenaren, aangesteld voor de uitvoering van de politietaak, die zich voorzien
      van de bijstand van een of meer personen met kennis van de zorg voor mensen met een psychogeriatrische aandoening
      of verstandelijke handicap.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel28a
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 28a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28b.3
    text: |-
      De in het tweede lid bedoelde ambtenaren kunnen voor de uitvoering van de in het tweede lid bedoelde taak elke
      plaats betreden waar de op te nemen persoon zich bevindt, voor zover dat redelijkerwijs voor de vervulling van hun
      taak nodig is. Zij zijn daarbij tevens bevoegd een woning binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28b
  - number: 28b.4
    text: |-
      De in het tweede lid bedoelde ambtenaren kunnen aan de betrokkene voorwerpen ontnemen die een gevaar voor de
      veiligheid van de betrokkene of van anderen kunnen opleveren. Zij zijn bevoegd hem daartoe aan de kleding of aan
      het lichaam te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28b
  - number: 28b.5
    text: |-
      Zo mogelijk worden de overeenkomstig het vierde lid ontnomen voorwerpen met de betrokkene overgebracht naar de
      accommodatie waarin hij wordt opgenomen. In de accommodatie wordt aan cliënt of zijn vertegenwoordiger een bewijs
      van ontvangst afgegeven waarin die voorwerpen zijn omschreven. De voorwerpen worden voor de betrokkene bewaard,
      voor zover dit niet in strijd is met enig wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28b
  - number: 28b.6
    text: |-
      Bij de opneming van de betrokkene in de accommodatie geven de in het tweede lid bedoelde ambtenaren een afschrift
      van de beschikking van de rechter aan de zorgaanbieder die de zorg levert in de accommodatie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28b
  - number: 28c.1
    text: |-
      De officier van justitie zendt de machtiging bedoeld in [artikel 28a][ref1] direct aan respectievelijk de Wlz-
      uitvoerder, het college van burgemeester en wethouders van de gemeente waar de cliënt ingezetene is of de
      zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel28a
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 28a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28c.2
    text: |-
      De Wlz-uitvoerder, het college van burgemeester en wethouders van de gemeente waar de cliënt ingezetene is of de
      zorgverzekeraar draagt er zorg voor dat de beschikking ten uitvoer wordt gelegd. Hij zendt daartoe de beschikking
      zo spoedig mogelijk aan de zorgaanbieder of de aanbieder van beschermd wonen. Deze aanbieder neemt zo spoedig
      mogelijk, maar uiterlijk binnen een week na ontvangst van de beschikking, de betrokkene op.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28c
  - number: 28c.3
    text: |-
      Indien de zorgaanbieder of aanbieder, bedoeld in het tweede lid, de betrokkene niet binnen een week na ontvangst
      van de beschikking heeft opgenomen, meldt de Wlz-uitvoerder, het college van burgemeester en wethouders van de
      gemeente waar de cliënt ingezetene is of de zorgverzekeraar dit direct aan de inspectie. De inspectie kan de
      zorgaanbieder of aanbieder, bedoeld in het tweede lid, bevelen de betrokkene op te nemen. De zorgaanbieder of
      aanbieder, bedoeld in het tweede lid, is verplicht de betrokkene onverwijld op te nemen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel28c
  - number: '29.1'
    text: |-
      In afwijking van [artikel 24, eerste lid][ref1], is onvrijwillige opname in een geregistreerde accommodatie van een
      persoon zonder rechterlijke machtiging mogelijk met een beschikking tot inbewaringstelling van de burgemeester van
      de gemeente waarin de betreffende persoon zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '29.2'
    text: 'De beschikking, bedoeld in het eerste lid, kan slechts worden genomen indien naar het oordeel van de burgemeester:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: 29.2.a
    text: er sprake is van ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: 29.2.b
    text: |-
      het ernstig nadeel zodanig onmiddellijk dreigend is dat een rechterlijke machtiging als bedoeld in
      [artikel 24, eerste lid][ref1], niet kan worden afgewacht;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 29.2.c
    text: |-
      het ernstige vermoeden bestaat dat dit ernstige nadeel wordt veroorzaakt door het gedrag van de persoon als gevolg
      van zijn psychogeriatrische aandoening of verstandelijke handicap, dan wel als gevolg van een daarmee gepaard
      gaande psychische stoornis of een combinatie hiervan;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: 29.2.d
    text: de inbewaringstelling noodzakelijk is om het ernstige nadeel te voorkomen of af te wenden;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: 29.2.e
    text: de inbewaringstelling geschikt is om het ernstige nadeel te voorkomen of af te wenden, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: 29.2.f
    text: er geen minder ingrijpende mogelijkheden zijn om het ernstige nadeel te voorkomen of af te wenden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: '29.3'
    text: |-
      De beschikking gaat in op de onvrijwilligheid, als bedoeld in [artikel 24, tweede lid][ref1], de omstandigheden
      waaruit deze onvrijwilligheid bestaat en alle onderdelen genoemd in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '29.4'
    text: |-
      De beschikking heeft een geldigheidsduur van ten hoogste drie dagen. Indien de termijn, bedoeld in
      de eerste volzin, eindigt op een zaterdag, zondag of algemeen erkende feestdag als bedoeld in de
      [Algemene termijnenwet][ref1], wordt deze verlengd tot en met de eerstvolgende dag die niet een zaterdag, zondag of
      algemeen erkende feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '29.5'
    text: |-
      Onverminderd het vierde lid, vervalt de beschikking op het moment waarop de rechter heeft beslist op een verzoek
      tot het verlenen van een machtiging als bedoeld in [artikel 37][ref1] respectievelijk het CIZ heeft beslist op
      de aanvraag voor een besluit tot opname en verblijf als bedoeld in [artikel 21, eerste lid][ref2], indien het CIZ
      voor het verstrijken van de geldigheidsduur van de beschikking een verzoek tot het verlenen van een machtiging als
      bedoeld in artikel 37 heeft gedaan dan wel er voor het verstrijken van de geldigheidsduur van de beschikking een
      aanvraag voor een besluit tot opname en verblijf als bedoeld in artikel 21, eerste lid, is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel21
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '29.6'
    text: Een afschrift van de beschikking wordt uitgereikt aan de betrokkene en zijn vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: '29.7'
    text: |-
      De burgemeester kan de uitoefening van de bevoegdheid, bedoeld in het eerste lid, uitsluitend mandateren aan een
      wethouder.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: '29.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in
      overeenstemming met Onze Minister van Binnenlandse Zaken, kunnen nadere voorschriften worden gegeven met betrekking
      tot de beschikking tot inbewaringstelling.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
  - number: '29.9'
    text: |-
      Indien de beschikking tot inbewaringstelling betrekking heeft op een minderjarige die onder
      toezicht is gesteld, geldt de beschikking tot inbewaringstelling als machtiging, als bedoeld in
      [artikel 261 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
  - number: '30.1'
    text: |-
      De burgemeester gelast een inbewaringstelling pas nadat een ter zake deskundig arts een verklaring heeft
      verstrekt, waaruit blijkt waaruit de onvrijwilligheid bestaat en waaruit blijkt dat wordt voldaan aan de in
      [artikel 29, tweede lid][ref1], gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      De in het eerste lid bedoelde verklaring wordt verstrekt door een arts die gedurende ten minste één jaar geen zorg
      heeft verleend aan de cliënt en onafhankelijk ten opzichte van de zorgaanbieder functioneert.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel30
  - number: '30.3'
    text: |-
      De arts die de verklaring afgeeft pleegt van tevoren overleg met de zorgaanbieder die de betrokkene zorg verleent
      of, indien deze ontbreekt, met de huisarts van de cliënt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel30
  - number: '30.4'
    text: De arts onderzoekt zo mogelijk de betrokkene voorafgaand aan de afgifte van de verklaring.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel30
  - number: '31.1'
    text: |-
      De burgemeester zorgt ervoor dat de betrokkene binnen 24 uur na het tijdstip waarop de beschikking, bedoeld in
      [artikel 29, eerste lid][ref1], wordt gegeven, wordt bijgestaan door een advocaat, tenzij de betrokkene of zijn
      vertegenwoordiger daartegen bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31.2'
    text: |-
      Bij algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in overeenstemming met Onze
      Minister van Justitie, kunnen regels worden gegeven ten aanzien van de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel31
  - number: '32.1'
    text: |-
      De burgemeester tekent zo spoedig mogelijk op de beschikking, bedoeld in [artikel 29, eerste lid][ref1],
      aan, indien de ambtenaren gebruik hebben gemaakt van de bevoegdheden, bedoeld in
      [artikel 33, tweede tot en met vierde lid][ref2], en overige relevante gegevens die hij ontvangt en die verband
      houden met de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel33
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '32.2'
    text: Indien een beschikking niet ten uitvoer is gelegd, tekent de burgemeester daarop aan wat de reden daarvan is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel32
  - number: '33.1'
    text: |-
      De burgemeester gaat binnen 24 uur na afgifte van de beschikking, bedoeld in [artikel 29][ref1], over tot
      tenuitvoerlegging via een opdracht aan een of meer ambtenaren van politie, aangesteld voor de uitvoering van de
      politietaak, die zich voorzien van de bijstand van een of meer personen met kennis van de zorg voor mensen met een
      psychogeriatrische aandoening of verstandelijke handicap.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '33.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren kunnen voor de uitvoering van de in het eerste lid bedoelde taak elke
      plaats betreden waar de op te nemen persoon zich bevindt, voor zover dat redelijkerwijs voor de vervulling van hun
      taak nodig is. Zij zijn daarbij tevens bevoegd een woning binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel33
  - number: '33.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren kunnen aan de betrokkene voorwerpen ontnemen die een gevaar voor de
      veiligheid van de betrokkene of van anderen kunnen opleveren. Zij zijn bevoegd hem daartoe aan de kleding of aan
      het lichaam te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel33
  - number: '33.4'
    text: |-
      Zo mogelijk worden de overeenkomstig het derde lid ontnomen voorwerpen met de betrokkene overgebracht naar de
      accommodatie waarin hij wordt opgenomen. In de accommodatie wordt aan betrokkene of zijn vertegenwoordiger een
      bewijs van ontvangst afgegeven waarin die voorwerpen zijn omschreven. De voorwerpen worden voor de betrokkene
      bewaard, voor zover dit niet in strijd is met enig wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel33
  - number: '33.5'
    text: |-
      Bij de opneming van de betrokkene in de accommodatie geven de in het eerste lid bedoelde ambtenaren een afschrift
      van de beschikking van de burgemeester aan de zorgaanbieder die de zorg levert in de accommodatie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel33
  - number: '34'
    text: |-
      Indien binnen 24 uur na het tijdstip waarop de beschikking tot inbewaringstelling is gegeven, door de
      zorgaanbieders van de daarvoor in aanmerking komende accommodaties nog niet tot opneming is overgegaan, kan de
      burgemeester na overleg met de inspectie, een van de bovenbedoelde zorgaanbieders bevelen de betrokkene op te
      nemen. De betrokken zorgaanbieder is verplicht de betrokkene op te nemen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel34
  - number: '35.1'
    text: |-
      De burgemeester zorgt ervoor dat het CIZ en de inspectie onmiddellijk van de inbewaringstelling op de hoogte worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel35
  - number: '35.2'
    text: |-
      De burgemeester zendt een afschrift van de beschikking en de in [artikel 30, eerste lid][ref1], bedoelde medische
      verklaring aan het CIZ, op de dag dat de beschikking is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel30
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '36'
    text: |-
      De burgemeester stelt de ouders die het gezag uitoefenen, de echtgenoot, de geregistreerde partner of andere
      levensgezel van de cliënt of degene door wie de cliënt voor opname werd verzorgd en de vertegenwoordiger van de
      betrokkene zo mogelijk op de hoogte van de door hem op grond van [artikel 29][ref1] gegeven beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '37.1'
    text: |-
      Indien het CIZ, na ontvangst van de bescheiden, bedoeld in [artikel 35, tweede lid][ref1], van oordeel is dat ten
      aanzien van de in bewaring gestelde persoon sprake is van een situatie als bedoeld in [artikel 29][ref2], doet
      het voordat de geldigheidsduur van de inbewaringstelling is verstreken bij de rechter een verzoek tot het verlenen
      van een machtiging tot voortzetting van de inbewaringstelling van die persoon. Indien het CIZ heeft besloten geen
      verzoekschrift in te dienen deelt het dit schriftelijk mee aan de zorgaanbieder van de accommodatie waarin de
      betrokkene verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '37.2'
    text: |-
      Bij het verzoek van het CIZ worden overgelegd de beschikking van de burgemeester, bedoeld in
      [artikel 29, eerste lid][ref1], en de medische verklaring, bedoeld in [artikel 30, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel30
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '37.3'
    text: |-
      Bevoegd is de rechtbank van het arrondissement waarin de accommodatie waarin de betrokkene is opgenomen, is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel37
  - number: '37.4'
    text: |-
      Met betrekking tot een persoon waarvoor een machtiging tot voortzetting van de inbewaringstelling
      als bedoeld in het eerste lid wordt verzocht, zijn de [artikelen 24][ref1], [25][ref2] en
      [26, tweede tot en met vijfde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel26
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '38.1'
    text: |-
      Voordat de rechter beslist op het verzoek tot het verlenen van een machtiging tot opname en verblijf of het verzoek
      tot het verlenen van een machtiging tot verlenging van de inbewaringstelling, hoort hij de cliënt, tenzij hij
      vaststelt dat deze niet in staat of niet bereid is zich te doen horen. Indien de cliënt in Nederland verblijft,
      maar niet in staat is zich naar de rechtbank te begeven, zal de rechter, door de griffier vergezeld, hem op
      zijn verblijfplaats horen. Indien de cliënt al in een accommodatie verblijft, wordt de rechter, vergezeld van de
      griffier, door de zorgaanbieder in de gelegenheid gesteld hem aldaar te horen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: '38.2'
    text: |-
      De cliënt die minderjarig is, onder curatele gesteld, dan wel ten behoeve van wie een mentorschap is ingesteld, is
      bekwaam in deze procedure in rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: '38.3'
    text: |-
      De rechter geeft een last tot toevoeging van een advocaat aan een cliënt aan het bestuur van de raad voor de
      rechtsbijstand, bedoeld in de [Wet op de rechtsbijstand][ref1], tenzij deze daartegen bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: '38.4'
    text: 'De rechter laat zich, zo mogelijk voorlichten door:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: 38.4.a
    text: |-
      degene die de aanvraag, bedoeld in [artikel 25][ref1], heeft ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 38.4.b
    text: de vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: 38.4.c
    text: degene door wie de cliënt feitelijk wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: 38.4.d
    text: de zorgverantwoordelijke, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: 38.4.e
    text: |-
      de arts die de verklaring, bedoeld in [artikel 26, vijfde lid, onderdeel d][ref1], dan wel de verklaring, bedoeld
      in [artikel 30, eerste lid][ref2], heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel30
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '38.5'
    text: |-
      De rechter kan zich daarnaast doen voorlichten door een of meer van de in [artikel 25, eerste lid][ref1] bedoelde
      personen die het verzoek niet hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '38.6'
    text: |-
      De rechter kan onderzoek door deskundigen bevelen en is bevoegd deze deskundigen alsmede getuigen op te roepen.
      De rechter roept de door de cliënt opgegeven deskundigen en getuigen op, tenzij hij van oordeel is dat door het
      achterwege blijven daarvan de cliënt redelijkerwijs niet in zijn belangen kan worden geschaad. Indien hij een
      opgegeven deskundige of getuige niet heeft opgeroepen, vermeldt hij de reden daarvan in de beschikking.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: '38.7'
    text: |-
      Indien de rechter dit gewenst oordeelt, kan hij degene die de aanvraag heeft ingediend en de arts die de medische
      verklaring heeft afgegeven, verplichten te verschijnen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: '38.8'
    text: |-
      Indien de rechter zich laat voorlichten door een of meer der personen, bedoeld in het vierde, vijfde en zesde
      lid, buiten tegenwoordigheid van de cliënt, wordt de zakelijke inhoud van de verstrekte inlichtingen aan de cliënt
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: '38.9'
    text: |-
      De cliënt of zijn advocaat wordt in de gelegenheid gesteld zijn zienswijze kenbaar te maken naar aanleiding van de
      mededelingen en verklaringen van de personen, bedoeld in het vierde, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
  - number: '38.10'
    text: |-
      Indien de rechtbank zich op grond van het door haar ingestelde onderzoek afvraagt of in de gegeven omstandigheden
      een zorgmachtiging als bedoeld in de [Wet verplichte geestelijke gezondheidszorg][ref1] niet passender is, kan
      zij dit gevoelen aan het CIZ en de officier van justitie bij het desbetreffende arrondissementsparket kenbaar
      maken en kan zij het verzoek tot het verlenen van een machtiging beschouwen als een verzoek tot het verlenen van
      een zorgmachtiging als bedoeld in de Wet verplichte geestelijke gezondheidszorg. Zo nodig kan de rechter daarbij
      bepalen dat de behandeling op een later tijdstip wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0040635
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0040635
  - number: '39.1'
    text: |-
      De rechter beslist zo spoedig mogelijk op het verzoek tot het verlenen van een machtiging. Indien het verzoek
      betrekking heeft op een cliënt die reeds in een accommodatie verblijft, beslist de rechter in elk geval binnen
      drie weken na de datum van indiening van het verzoekschrift. Indien het verzoek een machtiging tot verlenging van
      de inbewaringstelling betreft, beslist de rechter binnen drie werkdagen, te rekenen vanaf de dag na die van het
      indienen van het verzoek door het CIZ.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
  - number: '39.2'
    text: De beschikking vermeldt de gronden die hebben geleid tot het al dan niet afgeven van de machtiging.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
  - number: '39.3'
    text: |-
      Indien de rechter redenen heeft om van het advies van het CIZ af te wijken, vermeldt hij deze redenen in de
      beschikking.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
  - number: '39.4'
    text: |-
      De machtiging tot opname en verblijf heeft een geldigheidsduur van ten hoogste zes maanden en de machtiging
      tot verlenging van de inbewaringstelling heeft een geldigheidsduur van ten hoogste zes weken na dagtekening,
      onverminderd de [artikelen 47][ref1] en [48][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel48
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '39.5'
    text: |-
      Indien een cliënt al op grond van een machtiging tot opname en verblijf in een accommodatie verblijft, kan de
      rechter een eerstvolgende machtiging tot opname en verblijf verlenen met een geldigheidsduur van ten hoogste twee
      jaren ten aanzien van cliënten met een verstandelijke handicap en ten hoogste vijf jaren ten aanzien van cliënten
      met een psychogeriatrische aandoening. Daarop volgende machtigingen kunnen telkens opnieuw door de rechter verleend
      worden voor een periode van ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
  - number: '39.6'
    text: |-
      In afwijking van het vijfde lid, kan de rechter voor een cliënt die al op grond van een machtiging tot opname en
      verblijf in een accommodatie verblijft en waarvan kennelijk duidelijk is dat er geen wijziging zal optreden in de
      voldoening aan de criteria voor opname en verblijf als bedoeld in [artikel 24, derde lid][ref1], een eerstvolgende
      machtiging verlenen voor een periode van ten hoogste vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '39.7'
    text: |-
      De machtiging kan niet meer ten uitvoer worden gelegd wanneer meer dan vier weken na haar dagtekening zijn
      verlopen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
  - number: '39.8'
    text: Tegen de beschikking op een verzoek tot het verlenen van een machtiging staat geen hoger beroep open.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
  - number: '39.9'
    text: De beschikking van de rechter is bij voorraad uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel39
  - number: '40'
    text: |-
      Indien een machtiging betrekking heeft op een minderjarige die onder toezicht is gesteld, geldt deze als
      machtiging, als bedoeld in [artikel 261 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
  - number: '41.1'
    text: |-
      De griffier zendt een afschrift van de beschikking inzake de rechterlijke machtiging tot opname en verblijf, de
      voorwaardelijke machtiging, en machtigingen tot voortzetting van de inbewaringstelling aan:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.a
    text: de cliënt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.b
    text: de advocaat van de cliënt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.c
    text: de ouders die het gezag uitoefenen,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.d
    text: |-
      de echtgenoot, de geregistreerde partner of andere levensgezel van de cliënt, of degene door wie de cliënt wordt
      verzorgd;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.e
    text: de vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.f
    text: de aanvrager, indien deze niet een van de onder c tot en met e genoemde personen is;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.g
    text: het CIZ;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.h
    text: |-
      de zorgaanbieder die de accommodatie beheert, indien het gaat om een machtiging voor een cliënt die al in de
      accommodatie verblijft, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: 41.1.i
    text: de Wzd-functionaris, aangewezen door de in onderdeel h bedoelde zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
  - number: '41.2'
    text: |-
      Indien afwijzend wordt beslist op het verzoek tot het verlenen van een machtiging zendt de griffier tevens
      een afschrift aan de bij de zorg voor de cliënt betrokken arts. Hierbij voegt de griffier een afschrift van de
      verklaring, bedoeld in [artikel 26, vijfde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel26
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '42'
    text: |-
      De zorgaanbieder die de zorg verleent in de accommodatie waar de cliënt wordt of blijft opgenomen, doet van deze
      opname zo spoedig mogelijk mededeling aan:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel42
  - number: 42.a
    text: de ouders die het gezag uitoefenen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel42
  - number: 42.b
    text: |-
      de echtgenoot, de geregistreerde partner of andere levensgezel van de cliënt, of degene door wie de cliënt wordt
      verzorgd;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel42
  - number: 42.c
    text: de vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel42
  - number: 42.d
    text: de griffier van de rechtbank die de machtiging heeft verleend, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel42
  - number: 42.e
    text: het CIZ en de inspectie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel42
  - number: '43'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven met betrekking tot de
      aanvraag, bedoeld in [artikel 25][ref1], het verzoek, bedoeld in [artikel 26, eerste lid][ref2], en de verklaring
      en de deskundigheid van de arts, bedoeld in de artikelen 26, vijfde lid, onderdeel d, en [30, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel30
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '44.1'
    text: |-
      Indien de wet niet in acht is genomen bij het gelasten van een inbewaringstelling of bij de toepassing
      van [artikel 15][ref1] kan de cliënt of zijn vertegenwoordiger de rechter verzoeken tot schadevergoeding
      door respectievelijk de gemeente of de zorgaanbieder. De rechter kent een naar billijkheid vast te stellen
      schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel15
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '44.2'
    text: |-
      Indien de wet niet in acht is genomen door de zorgaanbieder, de Wzd-functionaris of de zorgverantwoordelijke
      kan de cliënt of zijn vertegenwoordiger de rechter verzoeken tot schadevergoeding door de zorgaanbieder, de Wzd-
      functionaris of de zorgverantwoordelijke. De rechter kent een naar billijkheid vast te stellen schadevergoeding
      toe.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel44
  - number: '44.3'
    text: |-
      Indien de wet niet in acht is genomen door de rechter of de officier van justitie, kan de cliënt of zijn
      vertegenwoordiger de rechter verzoeken tot schadevergoeding ten laste van de Staat. De rechter kent een naar
      billijkheid vast te stellen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel44
  - number: '45.1'
    text: |-
      De zorgaanbieder stelt aan een cliënt en diens vertegenwoordiger zo spoedig mogelijk na diens opname een
      schriftelijk overzicht van de in de accommodatie geldende huisregels ter hand.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel45
  - number: '45.2'
    text: |-
      De huisregels, bedoeld in het eerste lid, bevatten geen andere regelen dan die nodig zijn voor een ordelijke gang
      van zaken en voor de veiligheid in de accommodatie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel45
  - number: '45.3'
    text: |-
      De zorgverantwoordelijke zorgt ervoor dat de cliënt en zijn vertegenwoordiger een mondelinge toelichting op de
      huisregels ontvangen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel45
  - number: '46.1'
    text: |-
      Een zorgaanbieder neemt een cliënt als bedoeld in de [artikelen 21][ref1], [24][ref2] en [29][ref3] slechts
      op in een accommodatie tegen overlegging van een afschrift van het besluit tot opname en verblijf, bedoeld in
      artikel 21, eerste lid, de rechterlijke machtiging, bedoeld in artikel 24, eerste lid, of de beschikking tot
      inbewaringstelling, bedoeld in artikel 29, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '46.2'
    text: |-
      Indien de beschikking tot inbewaringstelling, bedoeld in [artikel 29, eerste lid][ref1], betrekking heeft op een
      cliënt die al vrijwillig in een accommodatie verbleef, zorgt de zorgverantwoordelijke ervoor dat de cliënt een
      mondelinge toelichting op die beschikking ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '47.1'
    text: |-
      De zorgaanbieder verleent een cliënt die met toepassing van paragraaf 2 van dit hoofdstuk in een accommodatie
      verblijft, ambtshalve of op verzoek van de cliënt of zijn vertegenwoordiger, gedurende een daarbij aan te geven
      periode, verlof om voor zover en voor zolang dit verantwoord is buiten de accommodatie te verblijven.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '47.2'
    text: |-
      Indien een verzoek tot het verlenen van verlof niet wordt gedaan door de vertegenwoordiger van de cliënt, overlegt
      de zorgverantwoordelijke met de vertegenwoordiger voordat hij besluit tot het verlenen van verlof.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '47.3'
    text: |-
      De zorgaanbieder verzoekt de Wzd-functionaris schriftelijk om toestemming voor het verlenen of het weigeren
      van verlof. De Wzd-functionaris verstrekt de zorgaanbieder zo spoedig mogelijk schriftelijk en gemotiveerd zijn
      beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '47.4'
    text: |-
      Indien de Wzd-functionaris toestemming verleent voor het verlof, verzoekt de zorgaanbieder tevens
      Onze Minister van Veiligheid en Justitie schriftelijk om toestemming voor het verlenen van verlof,
      indien de cliënt is opgenomen op grond van een machtiging die is afgegeven met toepassing van
      [artikel 2.3, tweede lid, van de Wet forensische zorg][ref1], behoudens de gevallen waarin artikel 2.3, tweede lid,
      juncto eerste lid, onderdeel 3, is toegepast en de cliënt is vrijgesproken van hetgeen hem ten laste is gelegd.
      Onze Minister van Veiligheid en Justitie verstrekt de zorgaanbieder zo spoedig mogelijk schriftelijk en gemotiveerd
      zijn beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '2'
  - number: '47.5'
    text: |-
      Indien de in het derde of vierde lid bedoelde toestemming voor het verlenen van verlof niet wordt gegeven, verleent
      de zorgaanbieder geen verlof en wijst hij de aanvraag af.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '47.6'
    text: |-
      De zorgaanbieder geeft de cliënt, de vertegenwoordiger, en de advocaat een afschrift van de beslissing, voorzien
      van de beoordeling van de Wzd-functionaris, alsmede, indien van toepassing voorzien van de beoordeling van Onze
      Minister van Veiligheid en Justitie, en stelt hen uiterlijk binnen vier dagen schriftelijk in kennis van de
      klachtwaardigheid van de beslissing en de mogelijkheid van advies en bijstand door de cliëntenvertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '47.7'
    text: |-
      De zorgaanbieder informeert tijdig de officier van justitie over het verlof ter onderbreking van de opname in een
      accommodatie op grond van een machtiging, waarvoor Onze Minister van Veiligheid en Justitie op grond van het vierde
      lid toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '47.8'
    text: |-
      De zorgaanbieder trekt het verlof, met instemming van de Wzd-functionaris, in indien het niet langer verantwoord is
      dat de cliënt buiten de accommodatie verblijft. Op de beslissing tot het intrekken van het verlof, is het zesde lid
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '47.9'
    text: |-
      Aan het verlof kunnen, met instemming van de Wzd-functionaris, voorwaarden en beperkingen worden verbonden
      betreffende de zorg of het gedrag van de cliënt, voor zover dit gedrag samenhangt met ernstig nadeel als gevolg van
      de psychogeriatrische aandoening of verstandelijke handicap dan wel een daarmee gepaard gaande psychische stoornis.
      De zorgaanbieder verleent slechts verlof indien de cliënt dan wel, indien van toepassing, de vertegenwoordiger zich
      bereid heeft verklaard tot naleving van de voorwaarden en beperkingen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel47
  - number: '48.1'
    text: |-
      De zorgaanbieder verleent een met toepassing van [paragraaf 2][ref1] van dit hoofdstuk, in een accommodatie
      verblijvende cliënt ambtshalve of op verzoek van de cliënt of zijn vertegenwoordiger ontslag uit de accommodatie,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0040632
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 48.1.a
    text: |-
      het verblijf niet langer noodzakelijk is om ernstig nadeel als gevolg van het gedrag van de cliënt als gevolg van
      zijn psychogeriatrische aandoening of verstandelijke handicap dan wel de daarmee gepaard gaande psychische stoornis
      te voorkomen of af te wenden; of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: 48.1.b
    text: |-
      de geldigheidsduur van de rechterlijke machtiging, dan wel van de beschikking tot inbewaringstelling is verstreken,
      tenzij voor het einde van de termijn een verzoek is gedaan tot het verlenen van een aansluitende machtiging. In dat
      geval verleent de zorgaanbieder ontslag zodra op het verzoek afwijzend is beslist, of de termijn voor het geven van
      een beslissing is verstreken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.2'
    text: |-
      Indien een verzoek tot het verlenen van ontslag niet wordt gedaan door de vertegenwoordiger van de cliënt, overlegt
      de zorgaanbieder met de vertegenwoordiger voordat hij besluit tot het verlenen van ontslag.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.3'
    text: |-
      Zo mogelijk en nodig wordt voordat het ontslag wordt verleend door de zorgaanbieder overleg gepleegd met de
      in [artikel 25, eerste lid][ref1], bedoelde personen, met degene door wie de cliënt voorafgaande aan zijn
      opname in een accommodatie werd verzorgd, met de zorgaanbieder of de arts, die voorafgaande aan de opname de
      cliënt zorg verleende of bij de zorg voor de cliënt betrokken was en met de inspectie. De zorgaanbieder stelt
      tevoren de echtgenoot, de geregistreerde partner of andere levensgezel, de vertegenwoordiger, alsmede de naaste
      (familie)betrekkingen op de hoogte van het voorgenomen ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '48.4'
    text: |-
      Voor zover de cliënt op grond van een rechterlijke machtiging als bedoeld in [artikel 24][ref1], of op grond van
      een beschikking tot inbewaringstelling als bedoeld in [artikel 29][ref2], of een machtiging tot voortzetting van
      de inbewaringstelling als bedoeld in [artikel 37][ref3], onvrijwillig is opgenomen in een accommodatie en uit de
      verklaring van een ter zake kundige arts als bedoeld in [artikel 26][ref4], of [artikel 30, eerste lid][ref5], is
      gebleken dat hij ernstig nadeel voor een ander veroorzaakt, neemt de zorgaanbieder niet eerder een beslissing over
      het verlenen van ontslag dan nadat hij:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0040632#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0040632#Artikel30
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0040632
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 48.4.a
    text: |-
      zich door middel van een verklaring van een ter zake kundige arts als bedoeld in [artikel 26][ref1] op de hoogte
      heeft gesteld van het oordeel van die arts over het voornemen van de zorgaanbieder ontslag te verlenen en over de
      actuele gezondheidstoestand van de cliënt, en


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel26
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 48.4.b
    text: |-
      overleg heeft gevoerd met de burgemeester die de beschikking tot inbewaringstelling heeft afgegeven, in geval van
      beëindiging van de inbewaringstelling, met de officier van justitie indien de cliënt is opgenomen op grond van
      een machtiging die is afgegeven met toepassing van [artikel 2.3 van de Wet forensische zorg][ref1], en met het
      college van burgemeester en wethouders van de gemeente waar de cliënt ingezetene is dan wel naar verwachting zal
      verblijven, in geval van beëindiging van de machtiging tot opname en verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '2'
  - number: '48.5'
    text: |-
      De zorgaanbieder neemt niet eerder een beslissing over het verlenen van ontslag bij opname op grond van een
      beschikking tot inbewaringstelling als bedoeld in [artikel 29][ref1], dan nadat hij zich ervan heeft vergewist
      dat er geen verzoek tot voortzetting van de inbewaringstelling als bedoeld in [artikel 37][ref2] is ingediend en
      bij opname op grond van voortzetting van de inbewaringstelling als bedoeld in artikel 37, dan nadat hij zich ervan
      heeft vergewist dat er geen verzoek om een rechterlijke machtiging als bedoeld in [artikel 25, eerste lid][ref3],
      is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel25
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '48.6'
    text: |-
      De zorgaanbieder verzoekt de Wzd-functionaris schriftelijk om toestemming voor het verlenen of het weigeren van
      ontslag. De Wzd-functionaris verstrekt de zorgaanbieder zo spoedig mogelijk schriftelijk en gemotiveerd zijn
      beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.7'
    text: |-
      Indien de Wzd-functionaris toestemming verleent voor het ontslag, verzoekt de zorgaanbieder tevens
      Onze Minister van Veiligheid en Justitie schriftelijk om toestemming voor het verlenen van ontslag
      ingeval de cliënt is opgenomen op grond van een machtiging die is afgegeven met toepassing van
      [artikel 2.3, tweede lid, van de Wet forensische zorg][ref1], behoudens de gevallen waarin artikel 2.3, tweede
      lid, juncto eerste lid, onder 3, van die wet is toegepast en cliënt is vrijgesproken van hetgeen hem ten laste is
      gelegd. Onze Minister van Veiligheid en Justitie verstrekt de zorgaanbieder zo spoedig mogelijk schriftelijk en
      gemotiveerd zijn beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '2'
  - number: '48.8'
    text: |-
      Indien de in het zesde of zevende lid bedoelde toestemming voor het verlenen van ontslag, niet wordt gegeven,
      verleent de zorgaanbieder geen ontslag en wijst hij de aanvraag af.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.9'
    text: |-
      De zorgaanbieder neemt binnen veertien dagen na ontvangst van een aanvraag tot het verlenen van ontslag een
      schriftelijke en gemotiveerde beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.10'
    text: |-
      Aan het ontslag kunnen, met instemming van de Wzd-functionaris, voorwaarden of beperkingen worden verbonden
      betreffende de zorg of het gedrag van de cliënt, voor zover dit gedrag samenhangt met mogelijk ernstig nadeel als
      gevolg van de psychogeriatrische aandoening of verstandelijke handicap. De zorgaanbieder verleent slechts ontslag
      indien de cliënt dan wel, indien van toepassing, de vertegenwoordiger zich bereid heeft verklaard tot naleving van
      de voorwaarden of beperkingen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.11'
    text: |-
      De zorgaanbieder geeft de cliënt, de vertegenwoordiger en de advocaat een afschrift van de beslissing, voorzien
      van de beoordeling van de Wzd-functionaris alsmede, indien van toepassing voorzien van de beoordeling van Onze
      Minister van Veiligheid en Justitie, en stelt hen uiterlijk binnen vier dagen schriftelijk in kennis van de
      klachtwaardigheid van de beslissing om aan de beslissing voorwaarden of beperkingen te verbinden, als bedoeld in
      het tiende lid, en de mogelijkheid van advies en bijstand door de cliëntenvertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.12'
    text: |-
      De zorgaanbieder informeert tijdig de officier van justitie over het verlenen van ontslag waarvoor Onze Minister
      van Veiligheid en Justitie op grond van het zevende lid toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.13'
    text: |-
      De zorgaanbieder kan de voor de continuïteit van zorg voor de cliënt relevante familie en naasten en het college
      van burgemeester en wethouders van de gemeente waar de cliënt ingezetene is dan wel naar verwachting zal verblijven
      informeren over het ontslag indien dit noodzakelijk is omdat essentiële voorwaarden voor deelname aan het
      maatschappelijk verkeer van de cliënt ontbreken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.14'
    text: |-
      Bij niet naleving van een aan het ontslag door de zorgaanbieder verbonden voorwaarde of beperking trekt de
      zorgaanbieder de beslissing tot het verlenen van ontslag in. Het elfde lid is van overeenkomstige toepassing op
      die beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '48.15'
    text: |-
      De zorgaanbieder deelt de beslissing tot intrekking, bedoeld in het veertiende lid, uiterlijk binnen vier dagen
      schriftelijk en gemotiveerd mee aan de Wzd-functionaris, de cliënt, de vertegenwoordiger en de advocaat en stelt
      hen daarbij in kennis van de klachtwaardigheid van de beslissing en de mogelijkheid van advies en bijstand door
      de cliëntenvertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel48
  - number: '49.1'
    text: |-
      Een persoon die in een accommodatie verblijft en aan wie tevens de maatregel van terbeschikkingstelling met bevel
      tot verpleging van overheidswege of de maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd, wordt
      voor de toepassing van deze wet vanaf het moment van opname in de accommodatie aangemerkt als een cliënt, die op
      grond van een rechterlijke machtiging tot opname en verblijf als bedoeld in [artikel 24][ref1] is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel24
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Een persoon die in een accommodatie verblijft en die tevens forensisch patiënt is in de zin van
      [artikel 1.1 van de Wet forensische zorg][ref1], niet zijnde een forensisch patiënt als bedoeld in het eerste lid,
      wordt vanaf het moment van opname in de accommodatie voor de toepassing van deze wet aangemerkt als een cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel1
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '1'
  - number: '50'
    text: |-
      Indien de zorgaanbieder, na overleg met de Wzd-functionaris, ten aanzien van een cliënt als bedoeld in
      [artikel 49, eerste lid][ref1], van oordeel is dat voldaan is aan de criteria voor het verlenen van verlof of
      ontslag, dan wel dat de cliënt in aanmerking komt voor overplaatsing, verzoekt de zorgaanbieder Onze Minister
      van Veiligheid en Justitie daartoe een beslissing te nemen. De zorgaanbieder vermeldt daarbij het oordeel van de
      Wzd-functionaris. Onze Minister van Veiligheid en Justitie neemt zo spoedig mogelijk een beslissing. Hij betrekt
      daarbij de overwegingen en de voorwaarden of beperkingen die de zorgaanbieder ingevolge de [artikelen 47][ref2] en
      [48][ref3] nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel48
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '49'
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '51.1'
    text: |-
      Bij de eerste opname in een accommodatie bij de tenuitvoerlegging van een bevel als bedoeld
      in [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1] en
      voor zover dit anderszins noodzakelijk is voor de vaststelling van de identiteit, wordt de
      identiteit vastgesteld van een persoon die krachtens of ter uitvoering van een beslissing
      op grond van het [Wetboek van Strafvordering][ref2], het [Wetboek van Strafrecht][ref3], de
      [Penitentiaire beginselenwet][ref4], de [Beginselenwet verpleging ter beschikking gestelden][ref5] of de
      [Beginselenwet justitiële jeugdinrichtingen][ref6] in een accommodatie is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001854
      [ref4]: https://wetten.overheid.nl/BWBR0009709
      [ref5]: https://wetten.overheid.nl/BWBR0008765
      [ref6]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
      - id: ref3
        bwb_id: BWBR0001854
      - id: ref4
        bwb_id: BWBR0009709
      - id: ref5
        bwb_id: BWBR0008765
      - id: ref6
        bwb_id: BWBR0011756
  - number: '51.2'
    text: |-
      Het vaststellen van de identiteit van de persoon, bedoeld in het eerste lid, omvat bij de eerste opname in
      de accommodatie het vragen naar zijn naam, voornamen, geboorteplaats en geboortedatum, het adres waarop hij
      in de gemeentelijke basisadministratie persoonsgegevens is ingeschreven en het adres van zijn feitelijke
      verblijfplaats buiten de accommodatie. In het geval waarin van de cliënt vingerafdrukken zijn genomen en
      verwerkt overeenkomstig het [Wetboek van Strafvordering][ref1] of de [Vreemdelingenwet 2000][ref2], omvat het
      vaststellen van zijn identiteit tevens het nemen van vingerafdrukken en het vergelijken van die vingerafdrukken
      met de van hem verwerkte vingerafdrukken. In de andere gevallen omvat het vaststellen van zijn identiteit
      een onderzoek van het identiteitsbewijs, bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3].
      [Artikel 29a, tweede lid, van het Wetboek van Strafvordering][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel29a
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 29a
  - number: '51.3'
    text: |-
      Bij de tenuitvoerlegging van een bevel als bedoeld in
      [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek][ref1] bij veroordeelden worden van de persoon, bedoeld
      in het eerste lid, een of meer vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref2] genomen en
      verwerkt en is het tweede lid, tweede en derde volzin, van overeenkomstige toepassing. In een ander geval waarin
      het noodzakelijk is de identiteit van de persoon, bedoeld in het eerste lid, vast te stellen, is het tweede lid,
      tweede en derde volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '51.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het verwerken van de persoonsgegevens,
      bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51
  - number: 51a.1
    text: |-
      Beperkingen in het recht op het ontvangen van bezoek kunnen, anders dan als onvrijwillige zorg in een
      onvoorziene situatie als bedoeld in [artikel 15][ref1], door de zorgverantwoordelijke aan cliënten als bedoeld in
      [artikel 49][ref2] worden opgelegd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel49
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '49'
        hoofdstuk: 3a
  - number: 51a.1.a
    text: |-
      van het bezoek ernstige nadelige gevolgen moeten worden gevreesd voor de gezondheidstoestand van de cliënt, voor
      zover dit telkenmale uit een uitdrukkelijke verklaring van de zorgverantwoordelijke blijkt, dan wel
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
  - number: 51a.1.b
    text: |-
      dit ter voorkoming van verstoring van de orde of voor de veiligheid in de accommodatie, zoals die in de huisregels
      is beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
  - number: 51a.2
    text: |-
      Beperkingen in het recht op bewegingsvrijheid in en rond de accommodatie kunnen, anders dan als onvrijwillige
      zorg in een onvoorziene situatie als bedoeld in [artikel 15][ref1], door de zorgverantwoordelijke aan cliënten als
      bedoeld in [artikel 49][ref2] worden opgelegd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel49
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '49'
        hoofdstuk: 3a
  - number: 51a.2.a
    text: |-
      naar zijn oordeel van de uitoefening van het recht op de bewegingsvrijheid ernstige nadelige gevolgen moeten worden
      gevreesd voor de gezondheidstoestand van betrokkene, dan wel
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
  - number: 51a.2.b
    text: |-
      dit ter voorkoming van verstoring van de orde of voor de veiligheid in de accommodatie, zoals die in de huisregels
      is beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
  - number: 51a.3
    text: |-
      Beperkingen in het recht op het vrij gebruik van communicatiemiddelen kunnen, anders dan als onvrijwillige zorg in
      een onvoorziene situatie als bedoeld in [artikel 15][ref1], door de zorgverantwoordelijke aan cliënten als bedoeld
      [artikel 49][ref2] worden opgelegd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel49
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '49'
        hoofdstuk: 3a
  - number: 51a.3.a
    text: |-
      naar zijn oordeel van de uitoefening van het recht op vrij gebruik van communicatiemiddelen ernstige nadelige
      gevolgen moeten worden gevreesd voor de gezondheidstoestand van betrokkene, dan wel
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
  - number: 51a.3.b
    text: |-
      indien dit ter voorkoming van verstoring van de orde of voor de veiligheid in de accommodatie, zoals die in de
      huisregels is beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
  - number: 51a.4
    text: |-
      De zorgverantwoordelijke stelt een beslissing als bedoeld in het eerste, tweede of derde lid op schrift, voorziet
      de beslissing van een schriftelijke motivering en stelt de Wzd-functionaris op de hoogte van de beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel51a
  - number: '52.1'
    text: |-
      De zorgaanbieder stelt aan de cliënt en zijn vertegenwoordiger zo spoedig mogelijk, doch in elk geval binnen twee
      weken na aanvang van de zorg, een schriftelijk overzicht van de op grond van deze wet aan de cliënt toekomende
      rechten inclusief de in [artikel 56, tweede lid][ref1], bedoelde regeling, ter hand. In dit overzicht is opgenomen
      het adres waaronder de zorgaanbieder bereikbaar is voor een klacht als bedoeld in [artikel 55][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel55
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '52.2'
    text: |-
      De zorgverantwoordelijke zorgt ervoor dat de cliënt en zijn vertegenwoordiger desgewenst een mondelinge toelichting
      op het overzicht ontvangen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel52
  - number: '53.1'
    text: |-
      De zorgaanbieder is aangesloten bij een door één of meer representatief te achten cliëntenorganisaties en één of
      meer representatief te achten organisaties van zorgaanbieders ingestelde klachtencommissie die bestaat uit een
      oneven aantal van ten minste drie leden die niet werkzaam zijn bij of voor de zorgaanbieder en die zodanig is
      samengesteld dat een deskundige en zorgvuldige beslissing op de klacht is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel53
  - number: '53.2'
    text: |-
      De klachtencommissie beslist, in afwijking van
      [hoofdstuk 3 van de Wet kwaliteit, klachten en geschillen van zorg][ref1], op klachten als bedoeld in
      [artikel 55][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel55
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0037173
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '54.1'
    text: |-
      Ten behoeve van de vervulling van haar taak houdt de klachtencommissie zich in elk geval op de hoogte van
      de ontwikkelingen op het terrein van het verlenen van zorg en onvrijwillige zorg aan psychogeriatrische en
      verstandelijk gehandicapte cliënten.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel54
  - number: '54.2'
    text: |-
      De leden van de klachtencommissie zijn onafhankelijk en verrichten hun werkzaamheden zonder vooringenomenheid. Zij
      zijn niet werkzaam bij of voor de zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel54
  - number: '54.3'
    text: |-
      De leden van de klachtencommissie behandelen geen klachten waarbij zij een relatie hebben tot de klager, de cliënt
      of zijn vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel54
  - number: '54.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de samenstelling en
      de werkwijze van de klachtencommissie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel54
  - number: '55.1'
    text: |-
      De cliënt, zijn vertegenwoordiger of een nabestaande van de cliënt kan een schriftelijke en gemotiveerde klacht
      indienen bij de klachtencommissie over de nakoming van een verplichting of over een beslissing over:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
  - number: 55.1.a
    text: |-
      de vraag of een cliënt in staat kan worden geacht tot een redelijke waardering van zijn belangen
      ter zake van een beslissing die hem betreft, bedoeld in [artikel 3, eerste lid][ref1] of in
      [artikel 22, negende lid, onder c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel22
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 55.1.b
    text: |-
      het opnemen van onvrijwillige zorg in het zorgplan, als bedoeld in de [artikelen 10][ref1] en [11][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel11
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 55.1.c
    text: |-
      het uitvoeren van het zorgplan, bedoeld in de [artikelen 12][ref1] en [13][ref2], voor zover dat betrekking heeft
      op onvrijwillige zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel13
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 55.1.d
    text: |-
      zorg in onvoorziene situaties, als bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel15
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 55.1.e
    text: |-
      het bijhouden van een dossier, als bedoeld in [artikel 16][ref1], voor zover dat betrekking heeft op onvrijwillige
      zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel16
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 55.1.f
    text: |-
      verlof of ontslag, als bedoeld in de [artikelen 47][ref1] en [48][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel48
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '55.2'
    text: |-
      Tevens kan de cliënt, zijn vertegenwoordiger of een nabestaande van de cliënt een schriftelijke en gemotiveerde
      klacht indienen bij de klachtencommissie over de nakoming van een verplichting of over een beslissing van de Wzd-
      functionaris.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel55
  - number: '56.1'
    text: |-
      De klachtencommissie behandelt de klacht zodanig dat een deskundige en zorgvuldige beslissing op de klacht is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56
  - number: '56.2'
    text: |-
      De behandeling van de klacht geschiedt overeenkomstig een door de klachtencommissie te treffen regeling, die in
      ieder geval waarborgt dat:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56
  - number: 56.2.a
    text: |-
      aan de behandeling van de klacht niet wordt deelgenomen door een persoon tegen wiens beslissing de klacht is
      gericht;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56
  - number: 56.2.b
    text: de klager en de persoon tegen wiens beslissing de klacht is gericht in staat worden gesteld te worden gehoord;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56
  - number: 56.2.c
    text: het horen plaatsvindt op een locatie die op eenvoudige wijze bereikbaar is voor de cliënt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56
  - number: 56.2.d
    text: |-
      de klager en de persoon tegen wiens beslissing de klacht is gericht zich kunnen doen bijstaan door degenen die zij
      daarvoor hebben aangewezen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56
  - number: 56.2.e
    text: de persoonlijke levenssfeer van de betrokkenen zoveel mogelijk wordt beschermd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56
  - number: 56a.1
    text: De klachtencommissie kan een beslissing waartegen de klacht is gericht, schorsen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56a
  - number: 56a.2
    text: De klachtencommissie neemt een schriftelijke en gemotiveerde beslissing binnen 14 dagen na ontvangst van de klacht.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56a
  - number: 56a.3
    text: |-
      Indien de klacht een beslissing of de nakoming van een verplichting betreft die ten tijde van de indiening geen
      gevolg meer heeft of waaraan in de tijd dat de klacht bij de klachtencommissie aanhangig is het gevolg is komen te
      vervallen, neemt de klachtencommissie een schriftelijke en gemotiveerde beslissing binnen vier weken na ontvangst
      van de klacht.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56a
  - number: 56a.4
    text: |-
      Een klacht kan buiten behandeling worden gelaten indien een gelijke klacht van eenzelfde persoon nog in behandeling
      is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56a
  - number: 56b.1
    text: 'De beslissing van de klachtencommissie strekt tot:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.1.a
    text: onbevoegdverklaring van de klachtencommissie,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.1.b
    text: niet-ontvankelijkverklaring van de klacht,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.1.c
    text: ongegrondverklaring van de klacht, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.1.d
    text: gegrondverklaring van de klacht.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.2
    text: |-
      De klachtencommissie verklaart een klacht niet-ontvankelijk, indien deze betrekking heeft op een besluit tot opname
      en verblijf, een rechterlijke machtiging tot opname en verblijf of voortzetting van verblijf of een beschikking
      tot inbewaringstelling.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.3
    text: |-
      Indien de klachtencommissie de klacht tegen een beslissing gegrond verklaart, vernietigt zij de bestreden
      beslissing geheel of gedeeltelijk. Gehele of gedeeltelijke vernietiging brengt vernietiging van de rechtsgevolgen
      van de beslissing of het vernietigde gedeelte van de beslissing mee.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.4
    text: |-
      Indien de klachtcommissie de klacht gegrond verklaart, kan zij een opdracht geven tot het nemen van een nieuwe
      beslissing of een andere handeling te verrichten met inachtneming van haar beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.5
    text: |-
      De klachtencommissie kan een termijn stellen voor het nemen van een nieuwe beslissing of het verrichten van een
      andere handeling.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.6
    text: |-
      De klachtencommissie deelt de beslissing mee aan de indiener van de klacht, de cliënt, de vertegenwoordiger, de
      advocaat, de zorgaanbieder, de zorgverantwoordelijke, degene op wie de klacht betrekking heeft en de inspectie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56b.7
    text: |-
      De klachtencommissie maakt de uitspraken over de aan de klachtencommissie voorgelegde klachten openbaar in zodanige
      vorm dat deze niet tot personen herleidbaar zijn, behoudens voor zover het de zorgaanbieder betreft.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56b
  - number: 56c.1
    text: |-
      Nadat de klachtencommissie een beslissing heeft genomen of indien de klachtencommissie niet tijdig een beslissing
      heeft genomen, kan de cliënt, de vertegenwoordiger, de zorgaanbieder, degene op wie de klacht betrekking heeft
      of een nabestaande van de cliënt een schriftelijk en gemotiveerd verzoekschrift indienen bij de rechter ter
      verkrijging van een beslissing over de klacht.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56c
  - number: 56c.2
    text: |-
      De termijn voor het indien van een verzoekschrift bedraagt binnen zes weken na de dag waarop de beslissing van de
      klachtencommissie aan de verzoeker is meegedeeld, dan wel zes weken na de dag waarop de klachtencommissie uiterlijk
      een beslissing had moeten nemen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56c
  - number: 56d.1
    text: |-
      Voordat de rechter op het verzoekschrift beslist, stelt hij in ieder geval de verzoeker, de cliënt, de
      vertegenwoordiger, de zorgaanbieder, degene op wie de klacht betrekking heeft en de zorgverantwoordelijke in de
      gelegenheid om te worden gehoord. Indien de cliënt in Nederland verblijft, maar niet in staat is naar de rechtbank
      te komen, zal de rechter, door de griffier vergezeld, hem horen op zijn verblijfplaats. Indien de cliënt in een
      accommodatie verblijft, wordt de rechter door de zorgaanbieder in de gelegenheid gesteld hem aldaar te horen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2
    text: 'De rechter doet zich, zo nodig, voorlichten door:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2.a
    text: de echtgenoot, de geregistreerde partner of andere levensgezel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2.b
    text: degene door wie de cliënt wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2.c
    text: de ouders van de cliënt die het gezag uitoefenen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2.d
    text: de voogd, curator of mentor van de cliënt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2.e
    text: een of meer bloedverwanten in de eerste of tweede graad die het verzoek niet hebben ingediend;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2.f
    text: de instelling of arts die de cliënt behandelt of begeleidt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.2.g
    text: de Wzd-functionaris.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.3
    text: |-
      De rechter kan onderzoek door deskundigen bevelen en is bevoegd deze deskundigen op te roepen. De rechter kan
      getuigen oproepen. De rechter roept de door de verzoeker opgegeven deskundigen en getuigen op, tenzij hij van
      oordeel is dat door het achterwege blijven daarvan de cliënt redelijkerwijs niet in zijn belangen kan worden
      geschaad. Indien hij een opgegeven deskundige of getuige niet heeft opgeroepen, vermeldt hij de reden daarvan in
      de beschikking.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.4
    text: |-
      Indien de rechter zich buiten de tegenwoordigheid van de verzoeker laat voorlichten door een of meer personen
      als bedoeld in het tweede of derde lid, wordt de zakelijke inhoud van de verstrekte inlichtingen aan de verzoeker
      meegedeeld.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.5
    text: |-
      De verzoeker of de advocaat wordt in de gelegenheid gesteld zijn zienswijze kenbaar te maken naar aanleiding van de
      mededelingen en verklaringen van de personen, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
  - number: 56d.6
    text: |-
      Indien de cliënt geen advocaat heeft, geeft de rechter aan het bestuur van de raad voor rechtsbijstand, bedoeld in
      de [Wet op de rechtsbijstand][ref1], een last tot toevoeging van een advocaat aan de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 56e.1
    text: De rechter kan de beslissing waartegen de klacht is gericht, schorsen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56e
  - number: 56e.2
    text: De rechter beslist binnen vier weken na indiening van het verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56e
  - number: 56e.3
    text: Tegen de beslissing van de rechter staat geen hoger beroep open.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56e
  - number: 56f.1
    text: 'De beslissing van de rechter strekt tot:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.1.a
    text: onbevoegdverklaring van de rechter,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.1.b
    text: niet-ontvankelijkverklaring van het verzoek,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.1.c
    text: ongegrondverklaring van de klacht, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.1.d
    text: gegrondverklaring van de klacht.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.2
    text: |-
      Indien de rechter de klacht tegen een beslissing gegrond verklaart, vernietigt hij de bestreden beslissing geheel
      of gedeeltelijk. Gehele of gedeeltelijke vernietiging van de beslissing brengt vernietiging van de rechtsgevolgen
      van de beslissing of het vernietigde gedeelte van de beslissing mee.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.3
    text: |-
      Indien de rechter de klacht gegrond verklaart, kan hij een opdracht geven tot het nemen van een nieuwe beslissing,
      het verrichten van een andere handeling met inachtneming van zijn uitspraak, dan wel bepalen dat zijn uitspraak in
      de plaats treedt van het vernietigde besluit of het vernietigde gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.4
    text: |-
      De rechter kan de zorgaanbieder, de Wzd-functionaris, de zorgverantwoordelijke of de zorgverlener een termijn
      stellen voor het nemen van een nieuwe beslissing of het verrichten van een andere handeling.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56f.5
    text: |-
      De rechter kan bepalen dat, indien of zolang niet wordt voldaan aan de beslissing van de rechter,
      de zorgaanbieder aan de cliënt een in de beslissing vast te stellen dwangsom verbeurt. De
      [artikelen 611a tot en met 611i van het Wetboek van Burgerlijke Rechtsvordering][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611a
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 611a
  - number: 56f.6
    text: |-
      De griffie zendt zo spoedig mogelijk een afschrift van de beslissing aan de klager, de cliënt, de
      vertegenwoordiger, de advocaat van de cliënt, de klachtencommissie, de zorgaanbieder, degene op wie de klacht
      betrekking heeft en de inspectie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56f
  - number: 56g.1
    text: |-
      Bij een verzoek als bedoeld in [artikel 55][ref1] kan verzoeker tevens om schadevergoeding door de zorgaanbieder
      verzoeken. De klachtencommissie kan ook ambtshalve tot schadevergoeding door de zorgaanbieder besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel55
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56g
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 56g.2
    text: |-
      Bij een verzoek als bedoeld in [artikel 56c, eerste lid][ref1], kan verzoeker tevens om schadevergoeding door
      de zorgaanbieder verzoeken. De rechter kan op dit verzoek afzonderlijk beslissen en kan ook ambtshalve tot
      schadevergoeding door de zorgaanbieder besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel56c
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56g
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 56c
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 56g.3
    text: |-
      Voordat de klachtencommissie of de rechter beslist over het toekennen van schadevergoeding, hoort de
      klachtencommissie of de rechter de zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56g
  - number: 56g.4
    text: De schadevergoeding, bedoeld in het eerste en tweede lid, wordt naar billijkheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56g
  - number: 56h.1
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit hoofdstuk en daarbij de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde
      van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht
      tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit
      zijn taak bij de uitvoering van dit hoofdstuk de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56h
  - number: 56h.2
    text: |-
      De cliëntenvertrouwenspersoon kan zich op grond van zijn geheimhoudingsplicht verschonen van het geven van
      getuigenis of het beantwoorden van vragen in een klachtprocedure of een rechterlijke procedure.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel56h
  - number: '57.1'
    text: |-
      De zorgaanbieder draagt ervoor zorg dat iedere cliënt of diens vertegenwoordiger een beroep kan doen op een
      cliëntenvertrouwenspersoon. De zorgaanbieder informeert de cliënt en diens vertegenwoordiger op zodanige wijze over
      de mogelijkheden tot advies en bijstand door een cliëntenvertrouwenspersoon, dat daarmee wordt aangesloten bij de
      behoefte en het bevattingsvermogen van de desbetreffende cliënt. De cliëntenvertrouwenspersoon heeft tot taak de
      cliënt of de vertegenwoordiger advies en bijstand te verlenen in aangelegenheden die samenhangen met het verlenen
      van onvrijwillige zorg aan de cliënt, met zijn opname en verblijf in een accommodatie, of met het doorlopen van de
      klachtenprocedure, indien een cliënt of diens vertegenwoordiger daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: '57.2'
    text: 'De cliëntenvertrouwenspersoon heeft tevens tot taak:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: 57.2.a
    text: |-
      om signalen over tekortkomingen in de structuur of de uitvoering van onvrijwillige zorg of onvrijwillige opname en
      verblijf, voor zover deze afbreuk doen aan de rechten van een cliënt, aan de inspectie te melden; en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: 57.2.b
    text: advies en bijstand te verlenen aan cliënten die vrijwillig in een accommodatie verblijven.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: '57.3'
    text: |-
      De cliëntenvertrouwenspersoon verricht zijn werkzaamheden onafhankelijk van de zorgaanbieder, de Wzd-functionaris,
      de zorgverantwoordelijke en het CIZ.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: '57.4'
    text: 'Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: 57.4.a
    text: de deskundigheid van de cliëntenvertrouwenspersoon;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: 57.4.b
    text: de onafhankelijkheid van de cliëntenvertrouwenspersoon ten opzichte van de zorgaanbieder en het indicatieorgaan; en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: 57.4.c
    text: de taken en bevoegdheden van de cliëntenvertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel57
  - number: '58.1'
    text: |-
      De cliëntenvertrouwenspersoon heeft, voor zover dat redelijkerwijs voor de vervulling van zijn taak nodig is, al of
      niet op verzoek van de cliënt, vrije toegang tot de cliënt en behoeft van niemand toestemming om te spreken met de
      cliënt. De zorgaanbieder biedt hiertoe de gelegenheid.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel58
  - number: '58.2'
    text: |-
      Voor zover dit redelijkerwijs voor de vervulling van zijn taak nodig is, en de cliënt of zijn vertegenwoordiger
      daarmee uitdrukkelijk heeft ingestemd, krijgt de cliëntenvertrouwenspersoon:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel58
  - number: 58.2.a
    text: van een ieder die bij de uitvoering van deze wet betrokken is, alle door hem verlangde inlichtingen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel58
  - number: 58.2.b
    text: binnen de door hem gestelde termijn alle medewerking die hij redelijkerwijs kan vorderen; en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel58
  - number: 58.2.c
    text: inzage in de dossiers van de zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel58
  - number: '59'
    text: |-
      De cliëntenvertrouwenspersoon is tot geheimhouding verplicht van hetgeen in de uitoefening van zijn taak aan hem
      is toevertrouwd, tenzij enig wettelijk voorschrift hem tot mededeling verplicht, uit zijn taak de noodzaak tot
      mededeling voortvloeit, of de cliënt toestemming geeft om vertrouwelijke informatie te delen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel59
  - number: '60.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60
  - number: '60.2'
    text: |-
      Indien onvrijwillige zorg wordt verleend of de inspectie een gegrond vermoeden heeft dat onvrijwillige
      zorg wordt verleend, zijn de met het toezicht belaste ambtenaren bij de bevoegdheden, genoemd in de
      [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref1], tevens bevoegd, met medeneming van de
      benodigde apparatuur, een woning of verblijfsruimte binnen te treden zonder toestemming van de bewoner, voor zover
      dat noodzakelijk is voor het toezicht op de onvrijwillige zorg in de woning of verblijfsruimte. Zij beschikken niet
      over de bevoegdheden, genoemd in de [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '60.3'
    text: |-
      De met het toezicht belaste ambtenaren zijn, voor zover dat voor de vervulling van hun taak redelijkerwijs
      noodzakelijk is en in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], bevoegd
      tot inzage van de dossiers. Voor zover de betrokken beroepsbeoefenaar uit hoofde van zijn beroep tot geheimhouding
      van het dossier verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '60.4'
    text: |-
      De zorgaanbieder, de zorgverantwoordelijke, alsmede alle anderen die bij de uitvoering van deze wet betrokken
      zijn, geven aan de met het toezicht belaste ambtenaren alle door hen verlangde inlichtingen, voor zover dit
      redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60
  - number: '60.5'
    text: |-
      De zorgaanbieder stelt de genoemde ambtenaren in de gelegenheid met de cliënten te spreken, al dan niet op verzoek
      van die cliënten.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60
  - number: '60.6'
    text: |-
      Aan leden van het Subcomité ter Preventie als bedoeld in het op 18 december 2002 te New York stand gekomen
      Facultatief Protocol bij het Verdrag tegen foltering en andere wrede, onmenselijke of onterende behandeling of
      bestraffing (Trb. 2005, 243) en het Comité als bedoeld in het op 26 november 1987 te Straatsburg tot stand gekomen
      Europees Verdrag ter voorkoming van folteringen en onmenselijke of vernederende behandelingen of bestraffingen
      (Trb. 1988, nr. 19), zoals gewijzigd door Protocol 1 en Protocol 2 (Trb. 1994, 106 en 107), komen dezelfde
      bevoegdheden toe als waarover de met het toezicht belaste ambtenaren bedoeld in het eerste lid beschikken,
      met dien verstande dat de leden slechts van deze bevoegdheden gebruik kunnen maken voor zover het cliënten
      betreft die overeenkomstig het bepaalde in hoofdstuk 3 zijn opgenomen. Zij maken van deze bevoegdheden slechts
      gebruik voor zover dit redelijkerwijs nodig is voor hun uit het desbetreffende verdrag voortvloeiende taak.
      [Artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], is hierbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 60a.1
    text: |-
      Indien bij de zorgaanbieder, de Wzd-functionaris, de zorgverantwoordelijke of de zorgverlener het gegronde
      vermoeden bestaat dat de uitvoering van de onvrijwillige zorg ernstig tekortschiet, doet hij daarvan melding bij
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60a
  - number: 60a.2
    text: |-
      Indien de zorgaanbieder, de Wzd-functionaris, de zorgverantwoordelijke of de zorgverlener onvoldoende, niet of
      niet tijdig reageert op de klachten van de cliëntenvertrouwenspersoon over de uitvoering van de zorg, kan de
      cliëntenvertrouwenspersoon dit melden aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel60a
  - number: '61.1'
    text: |-
      Onze Minister kan een bestuurlijke boete van ten hoogste € 33.500,- opleggen ter zake van overtreding van regels
      gesteld bij of krachtens artikel:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel61
