      [ref7]: https://wetten.overheid.nl/BWBR0005700#Artikel41b
      [ref8]: https://wetten.overheid.nl/BWBR0005700#Artikel42
      [ref9]: https://wetten.overheid.nl/BWBR0005700#HoofdstukIX
