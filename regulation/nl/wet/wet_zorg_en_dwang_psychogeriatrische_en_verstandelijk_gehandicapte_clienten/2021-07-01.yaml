        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 16.2.f
    text: |-
      aantekening van het vooraf of achteraf informeren van de Wzd-functionaris, de vertegenwoordiger en de cliënt over
      het verlenen van onvrijwillige zorg, als bedoeld in [artikel 13, tweede lid][ref1] en [15, vierde lid][ref2], en,
