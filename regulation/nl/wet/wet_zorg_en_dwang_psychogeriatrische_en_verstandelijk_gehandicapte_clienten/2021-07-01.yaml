preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op het verlenen van goede zorg aan personen
    met een psychogeriatrische aandoening of een verstandelijke handicap uniforme regels te stellen ten aanzien van
    het verlenen van zorg aan zodanige personen, ook in gevallen waarin zij daarmee niet hebben ingestemd, dan wel
    zich daartegen verzetten, alsmede ten aanzien van opname en verblijf van zodanige personen in een accommodatie in
    gevallen waarin zij geen blijk hebben gegeven van bereidheid daartoe, doch zich daartegen ook niet verzetten en
    in gevallen waarin zij zich hiertegen wel verzetten en in verband daarmee enige bepalingen in de Wet bijzondere
    opnemingen in psychiatrische ziekenhuizen te doen vervallen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Volksgezondheid, Welzijn en Sport;
        - *accommodatie:* bouwkundige voorziening of een deel van een bouwkundige voorziening met het daarbij behorende
      terrein van een zorgaanbieder waar zorg wordt verleend;
        - *cliënt:* persoon van wie uit een verklaring van een ter zake kundige arts blijkt dat hij in verband met een
      psychogeriatrische aandoening of een verstandelijke handicap is aangewezen op zorg als bedoeld in het vierde lid,
      dan wel van wie het CIZ in een indicatiebesluit als bedoeld in de [Wet langdurige zorg][ref1] heeft vastgesteld dat
      een aanspraak op zorg bestaat als bedoeld in de Wet langdurige zorg vanwege een psychogeriatrische aandoening of
      een verstandelijke handicap;
        - *het CIZ:* het CIZ, genoemd in [artikel 7.1.1 van de Wet langdurige zorg][ref2];
        - *vertegenwoordiger:* wettelijk vertegenwoordiger van de cliënt, of, indien een zodanige persoon ontbreekt, de
      persoon die daartoe door de cliënt schriftelijk is gemachtigd in zijn plaats te treden, of, indien deze ontbreekt
      of niet optreedt, de echtgenoot, de geregistreerde partner of andere levensgezel, of, indien deze ontbreekt of niet
      wenst op te treden, een ouder, kind, broer, zus, grootouder of kleinkind van de cliënt;
        - *zorgaanbieder:* een natuurlijke of rechtspersoon die respectievelijk beroepsmatig of bedrijfsmatig zorg als
      bedoeld in het vierde lid of opname en verblijf in een accommodatie verleent, een organisatorisch verband van
      natuurlijke personen die bedrijfsmatig zorg als bedoeld in het vierde lid of opname en verblijf in een accommodatie
      verlenen of doen verlenen, of een natuurlijk persoon die bedrijfsmatig zorg als bedoeld in het vierde lid of opname
      en verblijf in een accommodatie doet verlenen;
        - *zorgverantwoordelijke:* een ter zake kundige arts of degene die behoort tot een bij regeling van Onze Minister
      aangewezen categorie van deskundigen, die door de zorgaanbieder als zorgverantwoordelijke is aangewezen;
        - *zorgverlener:* een natuurlijke persoon die beroepsmatig zorg verleent;
        - *familie:* de echtgenoot of geregistreerde partner of andere levensgezel, elke meerderjarige bloedverwant in de
      rechte lijn of de zijlijn tot en met de tweede graad of elke meerderjarige aanverwant tot en met de tweede graad;
        - *inspectie:* Inspectie gezondheidszorg en jeugd;
        - *nabestaande:* nabestaande als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref3];
        - *Wlz-uitvoerder:* Wlz-uitvoerder als bedoeld in de [Wet langdurige zorg][ref4];
        - *Wzd-functionaris:* ter zake kundige arts, gezondheidspsycholoog of orthopedagoog-generalist, al dan niet in
      dienst van de zorgaanbieder, die door de zorgaanbieder is aangewezen om toe te zien op de inzet van de minst
      ingrijpende vorm van onvrijwillige zorg en de mogelijke afbouw ervan en die verantwoordelijk is voor de algemene
      gang van zaken op het terrein van het verlenen van onvrijwillige zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
