        bwb_id: BWBR0035917
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder «ernstig nadeel» verstaan, het
      bestaan van of het aanzienlijk risico op:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.2.a
    text: |-
      levensgevaar, ernstig lichamelijk letsel, ernstige psychische, materiële, immateriële of financiële schade,
      ernstige verwaarlozing of maatschappelijke teloorgang, ernstig verstoorde ontwikkeling voor of van de cliënt of
      een ander;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.2.b
    text: bedreiging van de veiligheid van de cliënt al dan niet doordat hij onder invloed van een ander raakt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.2.c
    text: de situatie dat betrokkene met hinderlijk gedrag agressie van anderen oproept;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.2.d
    text: de situatie dat de algemene veiligheid van personen of goederen in gevaar is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder «zorg» verstaan: de zorg van een
      zorgaanbieder jegens een cliënt die kan bestaan uit bejegening, verzorging, verpleging, behandeling, begeleiding,
      bescherming, beveiliging, en onvrijwillige zorg als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '2'
        hoofdstuk: '1'
  - number: '1.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen ziekten en aandoeningen worden aangewezen die voor de toepassing van
      deze wet en de daarop berustende bepalingen worden gelijkgesteld met een psychogeriatrische aandoening of een
      verstandelijke handicap indien:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.4.a
    text: |-
      deze ziekten en aandoeningen dezelfde gedragsproblemen of regieverlies als een psychogeriatrische aandoening of
      verstandelijke handicap kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.4.b
    text: |-
      de benodigde zorg in verband met deze gedragsproblemen of regieverlies vergelijkbaar is met de zorg die nodig is
      bij een psychogeriatrische aandoening of verstandelijke handicap;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.4.c
    text: deze gedragsproblemen kunnen of dit regieverlies kan leiden tot ernstig nadeel.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: '1.5'
    text: |-
      In de regels gesteld krachtens de [artikelen 2a][ref1], [8, derde lid][ref2], [21, vierde lid][ref3] en [23][ref4],
      kan onderscheid worden gemaakt tussen cliënten met een psychogeriatrische aandoening en cliënten met een
      verstandelijke handicap.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0040632#Artikel23
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 2a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0040632
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '1.6'
    text: |-
      In het geval op grond van deze wet een rechterlijke machtiging is afgegeven voor opname in
      een accommodatie, vervalt een eerdere voor die cliënt afgegeven zorgmachtiging op grond van de
      [Wet verplichte geestelijke gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040635
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040635
  - number: '1.7'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.7.a
    text: |-
      een cliënt die verblijft in een justitiële jeugdinrichting, een penitentiaire inrichting of een justitiële
      inrichting voor verpleging van ter beschikking gestelden;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: 1.7.b
    text: |-
      een cliënt die niet in een accommodatie, een justitiële jeugdinrichting, een penitentiaire inrichting
      of een justitiële inrichting voor verpleging van ter beschikking gestelden verblijft en op wie
      de [Beginselenwet justitiële inrichtingen][ref1], de [Penitentiaire beginselenwet][ref2] of de
      [Beginselenwet verpleging ter beschikking gestelden][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011756
      [ref2]: https://wetten.overheid.nl/BWBR0009709
      [ref3]: https://wetten.overheid.nl/BWBR0008765
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011756
      - id: ref2
        bwb_id: BWBR0009709
      - id: ref3
        bwb_id: BWBR0008765
  - number: '1.8'
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid, onderdeel g, wordt niet eerder vastgesteld dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder «onvrijwillige zorg» verstaan zorg
      waartegen de cliënt of zijn vertegenwoordiger zich verzet en die bestaat uit:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.a
    text: |-
      toedienen van vocht, voeding en medicatie, alsmede doorvoeren van medische controles of andere medische handelingen
      en overige therapeutische maatregelen, ter behandeling van een psychogeriatrische aandoening, verstandelijke
      handicap, een daarmee gepaard gaande psychische stoornis of een combinatie hiervan, dan wel vanwege die aandoening,
      handicap of stoornis, ter behandeling van een somatische aandoening;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.b
    text: beperken van de bewegingsvrijheid;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.c
    text: insluiten;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.d
    text: uitoefenen van toezicht op betrokkene;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.e
    text: onderzoek aan kleding of lichaam;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.f
    text: onderzoek van de woon- of verblijfsruimte op gedrag beïnvloedende middelen en gevaarlijke voorwerpen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.g
    text: controleren op de aanwezigheid van gedrag beïnvloedende middelen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.h
    text: |-
      aanbrengen van beperkingen in de vrijheid het eigen leven in te richten, die tot gevolg hebben dat betrokkene iets
      moet doen of nalaten, waaronder begrepen het gebruik van communicatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.1.i
    text: beperken van het recht op het ontvangen van bezoek.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      Indien een cliënt wilsonbekwaam is en de vertegenwoordiger en de cliënt zich niet verzetten tegen het opnemen in
      het zorgplan van:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.2.a
    text: |-
      het toedienen van medicatie die van invloed is op het gedrag of de bewegingsvrijheid van de cliënt, vanwege de
      psychogeriatrische aandoening of verstandelijke handicap, of vanwege een daarmee gepaard gaande psychische stoornis
      of een combinatie hiervan, indien die medicatie niet wordt toegediend overeenkomstig de geldende professionele
      richtlijnen,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.2.b
    text: een maatregel die tot het gevolg heeft dat de cliënt enige tijd in zijn bewegingsvrijheid wordt beperkt, of
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2.2.c
    text: de mogelijkheid tot insluiting,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2
  - number: 2a.1
    text: |-
      Onvrijwillige zorg, anders dan die in een accommodatie aan een cliënt wordt verleend, omvat uitsluitend de bij
      algemene maatregel van bestuur aangewezen vormen van onvrijwillige zorg, toegepast onder de bij die algemene
      maatregel van bestuur gestelde regels.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2a
  - number: 2a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop bepaalde vormen van
      onvrijwillige zorg alsmede de zorg, bedoeld in [artikel 2, tweede lid][ref1], worden verleend aan een cliënt die in
      een accommodatie verblijft, welke personen die vormen van zorg mogen verlenen, alsmede de wijze van toezicht door
      de zorgaanbieder op de onvrijwillige zorg in de accommodatie.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '2'
        hoofdstuk: '1'
  - number: 2a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen maatregelen worden aangewezen die voor de toepassing van het bij of
      krachtens deze wet bepaalde in ieder geval worden beschouwd als maatregelen die de bewegingsvrijheid beperken of
      die niet, of slechts onder de bij die algemene maatregel van bestuur gestelde voorwaarden, mogen worden gebruikt om
      de bewegingsvrijheid te beperken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2a
  - number: 2a.4
    text: |-
      De voordracht voor een krachtens het eerste, tweede en derde lid vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2a
  - number: 2b.1
    text: |-
      Een zorgaanbieder waarbij cliënten worden opgenomen met toepassing van hoofdstuk 3, paragraaf 2, dan wel die
      onvrijwillige zorg verleent, wijst een Wzd-functionaris aan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2b
  - number: 2b.2
    text: |-
      Voordat de zorgaanbieder een Wzd-functionaris aanwijst, vraagt de zorgaanbieder hierover advies aan de
      cliëntenraad, bedoeld in [artikel 3 van de Wet medezeggenschap cliënten zorginstellingen 2018][ref1].
      De [artikelen 7, vijfde en zesde lid][ref2], en
      [6, eerste lid, eerste volzin, van de Wet medezeggenschap cliënten zorginstellingen 2018][ref3] zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0042294#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042294#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0042294#Artikel6
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0042294
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0042294
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0042294
        artikel: '6'
  - number: 2b.3
    text: |-
      De zorgaanbieder draagt er zorg voor dat de Wzd-functionaris zijn taken op grond van deze wet naar behoren kan
      uitvoeren en waarborgt de onafhankelijkheid van de Wzd-functionaris bij de uitvoering van zijn taken op grond van
      deze wet. De zorgaanbieder geeft de Wzd-functionaris geen aanwijzingen met betrekking tot diens taakuitvoering op
      grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel2b
  - number: '3.1'
    text: |-
      De cliënt die de leeftijd van zestien jaar heeft bereikt neemt de beslissing over de zorg die aan hem verleend
      wordt en over de uitoefening van rechten en plichten op grond van deze wet. Een cliënt die de leeftijd van twaalf
      maar nog niet die van zestien jaar heeft bereikt, neemt de beslissing over de zorg die aan hem verleend wordt en
      over de uitoefening van rechten en plichten op grond van deze wet, samen met zijn ouders of voogden die gezamenlijk
      het gezag uitoefenen, of de ouder of voogd die alleen het gezag uitoefent. Voor een cliënt die nog niet de leeftijd
      van twaalf jaar heeft bereikt nemen de ouders of voogden die gezamenlijk het gezag uitoefenen, de beslissing over
      de zorg die aan de cliënt verleend wordt en over de uitoefening van rechten en plichten op grond van deze wet of
      neemt of de ouder of voogd die alleen het gezag uitoefent die beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Een vertegenwoordiger treedt slechts op namens de cliënt voor zover hij een taak heeft als wettelijk
      vertegenwoordiger of voor zover een daartoe deskundige, niet zijnde de bij de zorg betrokken arts, overeenkomstig
      de daarvoor gangbare richtlijnen een beslissing heeft genomen die inhoudt dat de cliënt niet in staat kan worden
      geacht tot een redelijke waardering van zijn belangen ter zake van een beslissing die hem betreft. Deze beslissing
      wordt door de daartoe deskundige niet genomen dan na overleg met de vertegenwoordiger dat op overeenstemming is
      gericht. Indien geen overeenstemming wordt bereikt, neemt de bij de zorg betrokken arts de beslissing.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.3'
    text: |-
      De zorgverantwoordelijke legt de beslissing, bedoeld in het tweede lid, schriftelijk vast en vermeldt daarbij
      de datum en het tijdstip, of met de vertegenwoordiger overeenstemming is over de beslissing en ter zake van
      welke beslissing de cliënt niet in staat kan worden geacht tot een redelijke waardering van zijn belangen.
      De zorgverantwoordelijke stelt de Wzd-functionaris op de hoogte van de beslissing en het overleg met de
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      Als vertegenwoordiger in de zin van deze wet kunnen niet optreden, de zorgaanbieder, de Wzd-functionaris, de
      zorgverantwoordelijke, de zorgverlener die de cliënt zorg verleent, of andere personen die werkzaam zijn in de
      accommodatie waar de cliënt verblijft.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.5'
    text: |-
      Degene die door een cliënt schriftelijk wordt gemachtigd om als zijn vertegenwoordiger op te treden, dient
      meerderjarig en handelingsbekwaam te zijn.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.6'
    text: Degene die als vertegenwoordiger optreedt, verklaart schriftelijk daartoe bereid te zijn.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.7'
    text: |-
      De vertegenwoordiger betracht de zorg van een goed vertegenwoordiger en is gehouden de cliënt zoveel mogelijk bij
      de vervulling van zijn taak te betrekken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.8'
    text: De zorgaanbieder informeert de vertegenwoordiger over zijn rechten en bevoegdheden op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
  - number: '3.9'
    text: |-
      Indien een cliënt geen vertegenwoordiger heeft, maakt de zorgaanbieder gebruik van de bevoegdheid, bedoeld in
      [artikel 451, tweede lid, van Boek 1 van het Burgerlijk wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '451'
  - number: 3a.1
    text: |-
      Indien de cliënt overeenkomstig het bepaalde in [artikel 3][ref1], zelf de beslissing neemt, is er sprake van:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel3
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '3'
        hoofdstuk: '1'
  - number: 3a.1.a
    text: instemming, indien de cliënt instemt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.1.b
    text: verzet, indien de cliënt zich verzet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.2
    text: |-
      Indien voor de cliënt overeenkomstig het bepaalde in [artikel 3][ref1] een vertegenwoordiger optreedt, is er sprake
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel3
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '3'
        hoofdstuk: '1'
  - number: 3a.2.a
    text: instemming, indien de vertegenwoordiger instemt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.2.b
    text: verzet, indien de cliënt of de vertegenwoordiger zich verzet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.3
    text: |-
      In afwijking van het tweede lid geldt voor een cliënt die de leeftijd van twaalf jaar nog niet heeft bereikt dat er
      sprake is van:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.3.a
    text: instemming, indien de vertegenwoordiger instemt;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.3.b
    text: verzet, indien de vertegenwoordiger zich verzet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.4
    text: |-
      In afwijking van het tweede lid geldt voor een cliënt die de leeftijd van twaalf maar nog niet van zestien jaar
      heeft bereikt en die in staat wordt geacht tot een redelijke waardering van zijn belangen ter zake, dat er sprake
      is van:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.4.a
    text: instemming, indien de cliënt en de vertegenwoordiger beiden instemmen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.4.b
    text: verzet, indien de cliënt of de vertegenwoordiger zich verzet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.5
    text: |-
      Indien de cliënt op enig moment blijk geeft van verzet, vervalt de eerder gegeven instemming, en is er sprake van
      verzet.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: 3a.6
    text: |-
      Indien de ouders van een cliënt gezamenlijk de wettelijke vertegenwoordiger zijn, wordt verzet van een van beiden
      aangemerkt als verzet van de vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel3a
  - number: '4.1'
    text: |-
      In zaken betreffende deze wet, uitgezonderd [hoofdstuk 3, paragraaf 2.4][ref1], en [hoofdstuk 4][ref2], is
      uitsluitend bevoegd de rechter van de woonplaats van de cliënt, of van de plaats waar hij hoofdzakelijk of
      daadwerkelijk verblijft. Zaken met betrekking tot minderjarige cliënten worden behandeld door de kinderrechter of
      door een meervoudige kamer waarvan de kinderrechter deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040632
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0040632
        hoofdstuk: '4'
  - number: '4.2'
    text: |-
      In zaken betreffende [hoofdstuk 3, paragraaf 2.4][ref1], zijn gelijkelijk bevoegd de rechter van de woonplaats
      van betrokkene, of van de plaats waar hij hoofdzakelijk of daadwerkelijk verblijft en de rechter die bevoegd
      is de in [artikel 2.3 van de Wet forensische zorg][ref2] opgenomen beslissingen te nemen op grond van het
      [Wetboek van Strafvordering][ref3] of het [Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001903
      [ref4]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040632
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0040634
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001903
      - id: ref4
        bwb_id: BWBR0001854
  - number: '4.3'
    text: |-
      In zaken betreffende [hoofdstuk 4][ref1], is uitsluitend bevoegd de rechter van de plaats waar de cliënt verblijft.
      Zaken met betrekking tot minderjarige cliënten worden behandeld door de kinderrechter, of door een meervoudige
      kamer waarvan de kinderrechter deel uit maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040632
        hoofdstuk: '4'
  - number: '4.4'
    text: |-
      Indien op grond van het in deze wet bepaalde door het CIZ een verzoekschrift wordt ingediend, behoeft de indiening
      niet door een advocaat te geschieden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4
  - number: '4.5'
    text: De beschikking van de rechter is bij voorraad uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4
  - number: 4a.1
    text: |-
      In aanvulling op hetgeen uit deze wet voortvloeit, zijn de regels inzake de verzoekprocedure
      uit het [Wetboek van Burgerlijke Rechtsvordering][ref1] van overeenkomstige toepassing.
      [Artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] is niet van toepassing op
      de verzoekprocedure, bedoeld in deze wet, en zaken betreffende [hoofdstuk 3, paragraaf 2.4][ref3]. In zaken
      betreffende hoofdstuk 3, paragraaf 2.4, is in afwijking van het bepaalde in het Wetboek van Burgerlijke
      Rechtsvordering [artikel 269 van het Wetboek van Strafvordering][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel282
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel269
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '282'
      - id: ref3
        bwb_id: BWBR0040632
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '269'
  - number: 4a.2
    text: Kosten van door de rechter opgeroepen getuigen en deskundigen komen ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4a
  - number: 4a.3
    text: |-
      Bij de voorbereiding, de uitvoering, de wijziging en de beëindiging van het zorgplan of opname en verblijf in een
      accommodatie op grond van hoofdstuk 3, wordt de cliënt in een voor hem begrijpelijke taal geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4a
  - number: 4a.4
    text: |-
      Voor zover de uitvoering van de onvrijwillige zorg of de opname leidt tot vrijheidsbeneming heeft de cliënt, indien
      hij de Nederlandse taal niet beheerst, recht op bijstand van een tolk.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4a
  - number: 4b.1
    text: |-
      De [artikelen 38][ref1], [39][ref2], [40][ref3], [43 tot en met 45][ref4] en
      [48 van het Wetboek van Strafvordering][ref5] zijn van overeenkomstige toepassing op de toevoeging en de taak van
      de advocaat, bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel48
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '43'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '48'
  - number: 4b.2
    text: |-
      De advocaat is tot geheimhouding verplicht van hetgeen in de uitoefening van zijn taak op grond van deze wet aan
      hem is toevertrouwd, tenzij enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak
      tot mededeling voortvloeit. De advocaat kan zich op grond van zijn geheimhoudingsplicht verschonen van het geven
      van getuigenis of het beantwoorden van vragen in een klachtprocedure of rechterlijke procedure.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel4b
  - number: '5.1'
    text: |-
      De zorgaanbieder wijst voor elke cliënt een zorgverantwoordelijke aan en deelt diens naam aan de cliënt en, indien
      hij een vertegenwoordiger heeft, aan zijn vertegenwoordiger mee. Indien de cliënt zorg ontvangt van meer dan één
      zorgaanbieder, wijzen deze zorgaanbieders gezamenlijk een zorgverantwoordelijke aan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      De zorgverantwoordelijke draagt zorg voor het opstellen, het vaststellen, het uitvoeren, het evalueren en zo
      nodig het periodiek aanpassen van een zorgplan en het voeren van overleg met de cliënt of zijn vertegenwoordiger
      voorafgaand daarover en het inrichten van een dossier voor de cliënt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel5
  - number: '5.3'
    text: |-
      Voor zover de cliënt of zijn vertegenwoordiger daarmee instemt, verstrekt de zorgaanbieder zo spoedig
      mogelijk na de aanvang van de zorg, de naam en contactgegevens van een cliënt en de naam en contactgegevens
      van zijn vertegenwoordiger, aan de cliëntenvertrouwenspersoon, bedoeld in [artikel 57][ref1], zodat de
      cliëntenvertrouwenspersoon de cliënt en zijn vertegenwoordiger kan informeren over de mogelijkheid tot advies en
      bijstand door een cliëntenvertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel57
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '57'
        hoofdstuk: 4a
  - number: '6.1'
    text: |-
      Zorg wordt uitsluitend verleend op basis van het in [artikel 7][ref1] bedoelde zorgplan, tenzij nog geen zorgplan
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel7
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '6.2'
    text: |-
      Zolang het zorgplan nog niet is vastgesteld, wordt uitsluitend zorg verleend waarmee de cliënt of zijn
      vertegenwoordiger heeft ingestemd, dan wel waarmee de cliënt die geen vertegenwoordiger heeft redelijkerwijs
      geacht kan worden in te stemmen en waartegen hij zich niet verzet, niet zijnde zorg als bedoeld in
      [artikel 2, tweede lid][ref1], tenzij sprake is van een noodsituatie als bedoeld in [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel15
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '7.1'
    text: |-
      De zorgverantwoordelijke stelt na overleg met de cliënt of zijn vertegenwoordiger zo spoedig mogelijk, doch
      in elk geval binnen zes weken na aanvang van de zorg, een zorgplan vast. De afspraken met de cliënt of de
      vertegenwoordiger worden in het zorgplan vastgelegd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      Indien in verband met de zorgbehoefte van de cliënt de deskundigheid van anderen van belang is, betrekt de
      zorgverantwoordelijke deze deskundigheid bij het opstellen van het zorgplan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      De zorgverantwoordelijke spant zich in om de instemming van de cliënt of zijn vertegenwoordiger met het zorgplan
      te verkrijgen, waarbij hij zoveel als mogelijk rekening houdt met de wensen en voorkeuren van de cliënt. Van
      schriftelijke wilsuitingen van de cliënt of zijn vertegenwoordiger inzake zijn wensen en voorkeuren wordt
      een afschrift bij het zorgplan gevoegd. Indien het niet mogelijk is om hiermee rekening te houden, deelt de
      zorgverantwoordelijke dit schriftelijk en gemotiveerd mee aan betrokkene of zijn vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      De zorgverantwoordelijke voert zo vaak als hiertoe aanleiding is, doch in ieder geval binnen 4 weken na de aanvang
      van de uitvoering van het zorgplan en vervolgens ten minste elke zes maanden een evaluatie van het zorgplan uit. De
      cliënt of de vertegenwoordiger worden in de gelegenheid gesteld over de evaluatie gehoord te worden. De datum van
      de laatst uitgevoerde evaluatie wordt in het zorgplan aangetekend. Indien het zorgplan is opgesteld met toepassing
      van [artikel 10][ref1] wordt de evaluatie mede uitgevoerd door een deskundigenoverleg als bedoeld in artikel 10,
      derde lid, en indien het zorgplan is opgesteld met toepassing van [artikel 11][ref2], mede door het in artikel 10,
      tiende lid bedoelde uitgebreid deskundigenoverleg, en wordt bij de evaluatie toepassing gegeven aan artikel 10,
      vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel11
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '8.2'
    text: |-
      Indien een cliënt tijdelijk op een andere locatie verblijft waar hij zorg ontvangt van een andere zorgaanbieder in
      het kader van een geneeskundige behandeling, voert die andere zorgaanbieder het zorgplan uit. In situaties waarin
      het zorgplan niet voorziet, of uitvoering van het zorgplan niet mogelijk is bij het verlenen van verantwoorde zorg
      binnen de instelling waar de geneeskundige behandeling plaatsvindt, kan van het zorgplan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel8
  - number: '8.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze en het tijdstip van
      totstandkoming, de inhoud en inrichting van het zorgplan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel8
  - number: '8.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen eisen worden gesteld aan de deskundigen bedoeld in de [artikelen 9][ref1]
      en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel10
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '8.5'
    text: |-
      Bij algemene maatregel van bestuur worden eisen gesteld aan de externe deskundige, bedoeld in
      [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel11
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '8.6'
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      De zorgaanbieder biedt voldoende mogelijkheden voor zorg op basis van vrijwilligheid, om daarmee onvrijwillige zorg
      zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de zorgverantwoordelijke constateert dat het zorgplan niet blijkt te voldoen aan de zorgbehoefte van de
      cliënt, of de vertegenwoordiger aangeeft dat het zorgplan niet aan de zorgbehoefte van de cliënt voldoet, waardoor
      een situatie van ernstig nadeel kan ontstaan, wordt overeenkomstig het derde tot en met het vijfde lid, onderzocht
      of er alternatieven zijn voor de in het zorgplan opgenomen zorg, niet zijnde onvrijwillige zorg.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: '9.3'
    text: |-
      In een situatie als bedoeld in het tweede lid, overlegt de zorgverantwoordelijke met ten minste één deskundige van
      een andere discipline dan zijn eigen discipline, op het terrein van de aan de cliënt te verlenen zorg. Tijdens dat
      overleg wordt besproken:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: 9.3.a
    text: wat het ernstig nadeel voor de cliënt is, door middel van het maken van een risico-inventarisatie;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: 9.3.b
    text: wat de oorzaak van het gedrag van de cliënt zou kunnen zijn waardoor ernstig nadeel ontstaat;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: 9.3.c
    text: welke rol de interactie tussen cliënt en omgeving speelt bij het ontstaan van ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: 9.3.d
    text: |-
      welke mogelijkheden voor vrijwillige zorg kunnen worden benut om het ernstig nadeel te voorkomen, waardoor geen of
      minder onvrijwillige zorg nodig is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: '9.4'
    text: |-
      Bij het overleg als bedoeld in het derde lid wordt, indien de zorg niet zal worden verleend terwijl de cliënt is
      opgenomen met toepassing van [artikel 21, eerste lid][ref1], [artikel 24, eerste lid][ref2], of [artikel 29][ref3],
      tevens besproken in hoeverre de thuissituatie van de cliënt geschikt is voor de zorg die aan de cliënt zal worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '9.5'
    text: |-
      De zorgverantwoordelijke informeert de cliënt of zijn vertegenwoordiger over het in het derde lid bedoelde overleg
      en biedt hen de mogelijkheid hierbij aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: '9.6'
    text: |-
      De zorgverantwoordelijke betrekt bij het in het derde lid bedoelde overleg de deskundigheid van anderen, indien dit
      gezien de zorgbehoefte van de cliënt van belang is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
  - number: '9.7'
    text: |-
      Het zorgplan wordt aangepast op basis van de conclusies van het in het derde lid bedoelde overleg. Indien de
      conclusie van het overleg is dat er geen alternatieven voor onvrijwillige zorg meer zijn, wordt nader overleg
      gevoerd overeenkomstig het bepaalde in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel10
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '10.1'
    text: 'Onvrijwillige zorg kan alleen als uiterste middel worden overwogen:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.1.a
    text: |-
      indien op grond van het in [artikel 9, derde lid][ref1], bedoelde overleg is gebleken dat er geen mogelijkheden
      voor vrijwillige zorg meer zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel9
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 10.1.b
    text: |-
      indien blijkt dat het met toepassing van [artikel 9][ref1] aangepaste zorgplan, niet voldoet aan de zorgbehoefte
      van de cliënt waardoor een situatie van ernstig nadeel kan ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel9
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '10.2'
    text: 'De zorgverantwoordelijke kan in het zorgplan als uiterste middel onvrijwillige zorg opnemen indien:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.2.a
    text: |-
      het gedrag van een cliënt als gevolg van zijn psychogeriatrische aandoening of verstandelijke handicap, dan wel als
      gevolg van een daarmee gepaard gaande psychische stoornis of een combinatie daarvan, leidt tot ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.2.b
    text: de onvrijwillige zorg noodzakelijk is om het ernstige nadeel te voorkomen of af te wenden;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.2.c
    text: |-
      de onvrijwillige zorg geschikt is om het ernstige nadeel te voorkomen of af te wenden en gelet op het beoogde doel
      evenredig is; en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.2.d
    text: er geen minder ingrijpende mogelijkheden zijn om het ernstige nadeel te voorkomen of af te wenden.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: '10.3'
    text: |-
      Onvrijwillige zorg wordt niet in het zorgplan opgenomen dan na overleg met ten minste één deskundige
      van een andere discipline dan die van de zorgverantwoordelijke, op het terrein van de aan de cliënt te
      verlenen zorg en indien de zorgverantwoordelijke geen arts is en het onvrijwillige zorg als bedoeld in
      [artikel 2, eerste lid, onder a, b of c][ref1], of zorg als bedoeld in artikel 2, tweede lid, betreft, instemming
      van een bij de zorg betrokken arts.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '2'
        hoofdstuk: '1'
  - number: '10.4'
    text: 'In het in het derde lid bedoelde overleg wordt besproken:'
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.4.a
    text: wat het ernstig nadeel voor de cliënt is, door middel van het maken van een risico-inventarisatie;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.4.b
    text: wat de oorzaak van het gedrag van de cliënt zou kunnen zijn waardoor ernstig nadeel ontstaat;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.4.c
    text: welke rol de interactie tussen cliënt en omgeving speelt bij het ontstaan van ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.4.d
    text: |-
      welke mogelijkheden voor vrijwillige zorg nog benut kunnen worden, waardoor geen of minder onvrijwillige zorg nodig
      is;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.4.e
    text: |-
      wat de nadelige effecten van onvrijwillige zorg kunnen zijn, afgewogen tegen het ernstig nadeel dat moet worden
      afgewend; en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.4.f
    text: |-
      voor welke termijn de onvrijwillige zorg in het zorgplan wordt opgenomen, waarbij die termijn zo kort mogelijk
      is, passend bij de aard van de zorg en ingrijpendheid voor de cliënt, waarbij die termijn op maximaal drie maanden
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: '10.5'
    text: |-
      Bij het overleg als bedoeld in het derde lid wordt, indien de zorg niet zal worden verleend terwijl de cliënt is
      opgenomen met toepassing van [artikel 21, eerste lid][ref1], [artikel 24, eerste lid][ref2], of [artikel 29][ref3],
      tevens besproken in hoeverre de thuissituatie van de cliënt geschikt is voor de zorg die aan de cliënt zal worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel29
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.6'
    text: |-
      De zorgverantwoordelijke informeert de cliënt of zijn vertegenwoordiger over het in het derde lid bedoeld overleg
      en biedt hen de mogelijkheid hierbij aanwezig te zijn. Ook informeert de zorgverantwoordelijke de cliënt of zijn
      vertegenwoordiger over de plicht die op de zorgverantwoordelijke rust om advies over het zorgplan te vragen aan een
      externe deskundige in de gevallen bedoeld in [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel11
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '10.7'
    text: |-
      In het in het derde lid bedoelde overleg wordt voor iedere vorm van onvrijwillige zorg overwogen of die zorg
      mogelijk nadelige effecten heeft op de lichamelijke en geestelijke ontwikkeling van de cliënt en op zijn deelname
      aan het maatschappelijk leven, en worden aanvullende zorgvuldigheidseisen vastgesteld om die effecten weg te nemen
      of te verminderen. De zorgverantwoordelijke betrekt bij het in het derde lid bedoelde overleg de deskundigheid van
      anderen, indien dit gezien de zorgbehoefte van de cliënt van belang is.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: '10.8'
    text: |-
      De zorgverantwoordelijke past op basis van de conclusies van het in het derde lid bedoelde overleg het zorgplan aan
      en beschrijft daarin:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.8.1°
    text: |-
      het ernstig nadeel ter zake waarvan de onvrijwillige zorg kan worden toegepast, en welke vorm van onvrijwillige
      zorg kan worden toegepast;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.8.2°
    text: welke zorgverlener of categorie van zorgverleners bevoegd is tot het toepassen van de onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.8.3°
    text: indien van toepassing, de duur of frequentie van de onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.8.4°
    text: de op grond van het vierde lid, onder f, vastgestelde termijn voor de toepassing van onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.8.5°
    text: de wijze waarop de zorg binnen de onder 4° bedoelde termijn wordt afgebouwd;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.8.6°
    text: indien van toepassing aanvullende zorgvuldigheidseisen als bedoeld in het zevende lid;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: 10.8.7°
    text: de continuïteit van de benadering van de cliënt en de wijze waarop deze geborgd wordt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: '10.9'
    text: |-
      De zorgverantwoordelijke verstrekt in het kader van het in het derde lid bedoelde overleg de daarvoor noodzakelijke
      gegevens aan de in het derde lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: '10.10'
    text: |-
      Indien het niet lukt de onvrijwillige zorg voor afloop van de in het vierde lid, onder f bedoelde termijn af te
      bouwen, wordt opnieuw toepassing gegeven aan het derde tot en met negende lid, met dien verstande dat een niet bij
      de zorg betrokken deskundige deelneemt aan het in het derde lid bedoelde overleg.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      De zorgverantwoordelijke vraagt advies over het zorgplan aan een externe deskundige indien na het uitgebreid
      deskundigenoverleg als bedoeld in [artikel 10, tiende lid][ref1], het niet lukt de onvrijwillige zorg binnen de in
      het zorgplan opgenomen termijn af te bouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel10
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '11.2'
    text: |-
      Na afloop van de termijn, bedoeld in het eerste lid, kan de zorgverantwoordelijke eenmalig de termijn voor het
      toepassen van de onvrijwillige zorg verlengen totdat de externe deskundige heeft geadviseerd. De duur van de
      verlenging bedraagt maximaal drie maanden en wordt vastgelegd in het zorgplan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11
  - number: '11.3'
    text: |-
      De zorgverantwoordelijke past op basis van het advies van de externe deskundige het zorgplan aan en geeft
      daarin aan op welke wijze de zorgaanbieder toepassing geeft aan het advies van de externe deskundige.
      [Artikel 10, achtste lid][ref1], zijn van overeenkomstige toepassing op de aanpassing van het zorgplan, met dien
      verstande dat de nieuwe termijn voor het toepassen van onvrijwillige zorg niet langer mag zijn dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel10
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '11.4'
    text: |-
      Indien op grond van de evaluatie, bedoeld in [artikel 8, eerste lid][ref1], wordt geconcludeerd dat onvrijwillige
      zorg in overeenstemming met het advies van de externe deskundige noodzakelijk blijft, bedraagt de termijn voor de
      toepassing van de onvrijwillige zorg, telkens niet langer dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel8
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 11a.1
    text: |-
      Indien in het zorgplan onvrijwillige zorg is opgenomen of de onvrijwillige zorg in het zorgplan is gewijzigd,
      overlegt de zorgverantwoordelijke het zorgplan aan de Wzd-functionaris.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11a
  - number: 11a.2
    text: |-
      De Wzd-functionaris beoordeelt het zorgplan. Indien hij oordeelt dat het zorgplan niet voldoet aan het uitgangspunt
      dat onvrijwillige zorg zoveel mogelijk wordt voorkomen of dat het zorgplan niet geschikt is om ernstig nadeel
      zoveel mogelijk te voorkomen, past de zorgverantwoordelijke het zorgplan op aanwijzen van de Wzd-functionaris aan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11a
  - number: 11a.3
    text: |-
      De zorgverantwoordelijke informeert de Wzd-functionaris over een evaluatie van het zorgplan als bedoeld in
      [artikel 11, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel11
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 11a.4
    text: |-
      Het zorgplan vermeldt in elk geval de wijze waarop de zorgaanbieder en de Wzd-functionaris de kwaliteit van de
      onvrijwillige zorg bewaken en toezicht houden op de uitvoering van de onvrijwillige zorg. De zorgaanbieder en de
      Wzd-functionaris geven hieraan uitvoering.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel11a
  - number: '12.1'
    text: |-
      Indien de cliënt of zijn vertegenwoordiger zich verzet tegen de uitvoering van het zorgplan of bepaalde onderdelen
      van het zorgplan, wordt aan dat zorgplan of die onderdelen van het zorgplan slechts uitvoering gegeven indien met
      toepassing van [artikel 13][ref1] is vastgesteld dat uitvoering noodzakelijk is ter voorkoming van ernstig nadeel.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel13
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '12.2'
    text: |-
      Indien de voortgang van de uitvoering van het zorgplan of ontwikkelingen in de zorgbehoefte van de cliënt daartoe
      aanleiding geven, wordt een nieuw of gewijzigd zorgplan vastgesteld. De [artikelen 8 tot en met 11a][ref1] zijn
      daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel8
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '13.1'
    text: |-
      De zorgverlener geeft slechts uitvoering aan in het zorgplan opgenomen onvrijwillige zorg indien de zorgverlener
      voor de eerste toepassing van die onvrijwillige zorg, na instemming van de zorgverantwoordelijke heeft vastgesteld
      dat:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: 13.1.a
    text: het in het zorgplan omschreven ernstige nadeel zich daadwerkelijk voordoet,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: 13.1.b
    text: onvrijwillige zorg noodzakelijk is om het ernstige nadeel te voorkomen of af te wenden,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: 13.1.c
    text: |-
      de onvrijwillige zorg geschikt is om het ernstige nadeel te voorkomen of af te wenden en gelet op het beoogde doel
      evenredig is,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: 13.1.d
    text: er geen minder ingrijpende mogelijkheden zijn om het ernstige nadeel te voorkomen of af te wenden, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: 13.1.e
    text: op verantwoorde wijze is voorzien in toezicht tijdens de toepassing ervan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: '13.2'
    text: |-
      Voordat de onvrijwillige zorg voor de eerste keer wordt verleend, informeert de zorgverantwoordelijke de Wzd-
      functionaris, de vertegenwoordiger en de cliënt, tenzij dit informeren kennelijke ernstige bezwaren voor de
      cliënt zou opleveren. Indien de situatie dermate urgent is dat vooraf informeren niet mogelijk is, informeert de
      zorgverantwoordelijke hen allen zo spoedig mogelijk nadat de onvrijwillige zorg is verleend of daarmee een begin
      is gemaakt.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de situatie dermate urgent is dat de in het eerste lid bedoelde instemming van de zorgverantwoordelijke
      voor de eerste toepassing van de onvrijwillige zorg niet mogelijk is, treedt de zorgverlener zo spoedig mogelijk
      nadat de onvrijwillige zorg is verleend of daarmee een begin is gemaakt in overleg met de zorgverantwoordelijke om
      instemming te verkrijgen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel13
  - number: '14'
    text: |-
      Indien sprake is van een situatie als bedoeld in [artikel 8, tweede lid][ref1], neemt de verantwoordelijk arts
      van de zorgaanbieder waar de geneeskundige behandeling wordt uitgevoerd in plaats van de zorgverantwoordelijke
      de beslissing over het uitvoeren van de in het zorgplan opgenomen zorg, overeenkomstig het bepaalde in
      [artikel 13, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel13
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '15.1'
    text: |-
      In een situatie waarin het zorgplan redelijkerwijs niet heeft kunnen voorzien of in een noodsituatie die zich
      voordoet in de periode dat nog geen zorgplan is vastgesteld, wordt uitsluitend onvrijwillige zorg verleend, op
      grond van een schriftelijke beslissing van de zorgverantwoordelijke waarin hij heeft vastgesteld dat:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: 15.1.a
    text: |-
      het gedrag van een cliënt als gevolg van zijn psychogeriatrische aandoening of verstandelijke handicap, dan wel als
      gevolg van een daarmee gepaard gaande psychische stoornis of een combinatie daarvan, leidt tot ernstig nadeel;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: 15.1.b
    text: de onvrijwillige zorg noodzakelijk is om ernstig nadeel te voorkomen of af te wenden,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: 15.1.c
    text: |-
      de onvrijwillige zorg geschikt is om het ernstige nadeel te voorkomen of af te wenden en gelet op het beoogde doel
      evenredig is,
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: 15.1.d
    text: er geen minder ingrijpende mogelijkheden zijn om het ernstige nadeel te voorkomen of af te wenden, en
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: 15.1.e
    text: op verantwoorde wijze is voorzien in toezicht tijdens de toepassing ervan.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: '15.2'
    text: |-
      In de in het eerste lid bedoelde schriftelijke beslissing wordt vermeld voor welke termijn zij geldt. De termijn is
      niet langer dan strikt noodzakelijk, en in ieder geval niet langer dan twee weken.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: '15.3'
    text: |-
      Indien de in het eerste lid bedoelde beslissing onvrijwillige zorg als bedoeld in
      [artikel 2, eerste lid, onderdelen a, b of c][ref1], of zorg als bedoeld in artikel 2, tweede lid, betreft en de
      zorgverantwoordelijke geen arts is, overlegt hij over deze beslissing met de bij de zorg betrokken arts.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.4'
    text: |-
      De zorgverantwoordelijke informeert, zo mogelijk vooraf, de Wzd-functionaris, de vertegenwoordiger en de cliënt
      over het verlenen van onvrijwillige zorg in een onvoorziene situatie, tenzij dit informeren kennelijk ernstig
      nadeel voor de cliënt zou opleveren. Daarbij wijst de zorgverantwoordelijke op de aan de cliënt toekomende rechten.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
  - number: '15.5'
    text: |-
      Ter voorkoming van noodsituaties kan de zorgverantwoordelijke beslissen tot onvrijwillige zorg als bedoeld in
      [artikel 2, eerste lid, onder e of f][ref1], dan wel de poststukken bestemd voor de cliënt te onderzoeken bij
      het gegronde vermoeden van aanwezigheid binnen de accommodatie van voorwerpen die cliënt niet in zijn bezit mag
      hebben of die een aanzienlijk risico op ernstig nadeel veroorzaken. In afwijking van het eerste, tweede en vierde
      lid stelt de zorgverantwoordelijke zo spoedig mogelijk na het onderzoek zijn beslissing op schrift. De ontnomen
      voorwerpen worden voor cliënt bewaard, voor zover dit niet in strijd is met enig wettelijk voorschrift. Aan cliënt
      of zijn vertegenwoordiger wordt een bewijs van ontvangst verstrekt, waarin de voorwerpen die in bewaring zijn
      genomen zijn omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel2
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '2'
        hoofdstuk: '1'
  - number: '16.1'
    text: |-
      Met het oog op de kwaliteit van de zorg en de inzichtelijkheid voor de cliënt en zijn vertegenwoordiger richt de
      zorgverantwoordelijke namens de zorgaanbieder een dossier in.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
  - number: '16.2'
    text: |-
      Onverminderd het bepaalde in [artikel 454 van Boek 7 van het Burgerlijk Wetboek][ref1], bevat het dossier:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
