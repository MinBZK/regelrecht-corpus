  - number: '79'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit bepaald tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel79
