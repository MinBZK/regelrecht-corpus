        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 16.2.g
    text: |-
      aantekening van het ontbreken van de instemming met dan wel de medewerking van de cliënt of voor zover van
      toepassing zijn vertegenwoordiger aan de uitvoering van het zorgplan en de reden daarvoor;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
  - number: 16.2.h
    text: |-
      aantekening van de verstrekking van gegevens op grond van [artikel 18c, eerste lid][ref1], zonder toestemming van
      de cliënt of zijn vertegenwoordiger;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel18c
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
