  - number: '63.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel63
  - number: '64'
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet, en vervolgens telkens om de vijf jaar,
      aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel64
  - number: '76.1'
    text: |-
      De [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] blijft van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: 76.1.a
    text: |-
      verzoeken die krachtens die wet zijn ingediend en die strekken tot het verkrijgen van een beslissing
      door de rechter, de officier, de inspecteur, de geneesheer-directeur of de commissie, bedoeld in
      [artikel 41, tweede lid, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel41
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '41'
  - number: 76.1.b
    text: |-
      de vóór het tijdstip van inwerkingtreding van deze wet aangevangen voorbereiding van een last tot
      inbewaringstelling door de burgemeester, bedoeld in [artikel 20 van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel20
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '20'
  - number: 76.1.c
    text: een beslissing als bedoeld in onderdeel a of b die vóór het tijdstip van inwerkingtreding van deze wet is genomen;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel76
  - number: 76.1.d
    text: |-
      een beslissing die met toepassing van onderdeel a of b na het tijdstip van inwerkingtreding van deze wet is
      genomen.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel76
  - number: '76.2'
    text: |-
      In afwijking van het eerste lid, onder c en d, worden een besluit en een machtiging als
      bedoeld in de [artikelen 60][ref1], onderscheidenlijk [3][ref2], [15, eerste lid][ref3], en
      [32, eerste lid, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref4] gelijkgesteld met een
      besluit, als bedoeld in [artikel 21, tweede lid][ref5], onderscheidenlijk een machtiging tot opname en verblijf als
      bedoeld in [artikel 24, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005700#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0040632#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0040632#Artikel21
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '3'
      - id: ref3
