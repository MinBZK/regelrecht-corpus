  - number: 16.2.j
    text: |-
      een afschrift van een beslissing als bedoeld in [artikel 15, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel15
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
