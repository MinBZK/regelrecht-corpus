  - number: '76.4'
    text: |-
      Een krachtens de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] verleende last tot
      inbewaringstelling, waarvan de geldigheidsduur op het tijdstip van inwerkingtreding van deze wet nog niet
      is verstreken, wordt voor de toepassing van [hoofdstuk 3, paragraaf 2.6][ref2], aangemerkt als een last tot
      inbewaringstelling als bedoeld in [artikel 29, eerste lid][ref3].


