  - number: '61.3'
    text: |-
      Indien de ernst van de overtreding, of de omstandigheden waaronder deze is begaan daartoe aanleiding geven, wordt
      die overtreding aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel61
  - number: '62.1'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaar of geldboete van de derde categorie wordt gestraft hij die
      opzettelijk iemand van zijn vrijheid berooft of doet beroven door deze persoon tegen zijn wil op te nemen
      of te laten opnemen in een accommodatie, zonder dat daar een besluit tot opname en verblijf als bedoeld in
      [artikel 21, eerste lid][ref1], een rechterlijke machtiging als bedoeld in [artikel 24, eerste lid][ref2] of een
      beschikking tot inbewaringstelling als bedoeld in [artikel 29, eerste lid][ref3], aan ten grondslag ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel29
