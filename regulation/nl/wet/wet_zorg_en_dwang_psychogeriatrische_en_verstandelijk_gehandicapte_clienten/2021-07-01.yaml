  - number: '16.3'
    text: |-
      Indien toepassing is gegeven aan de [artikelen 13][ref1] of [15][ref2], wordt, zodra de onvrijwillige zorg is
      verleend, daarvan melding gemaakt in het dossier met een motivering van de noodzaak daartoe.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel15
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '17.1'
    text: |-
      De zorgaanbieder zorgt ten behoeve van het toezicht door de inspectie voor het digitaal beschikbaar zijn van in
      ieder geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
  - number: 17.1.a
    text: de namen van de cliënt, de zorgverantwoordelijke en de Wzd-functionaris;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
  - number: 17.1.b
    text: de vorm van de aan de betrokken cliënt verleende onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
  - number: 17.1.c
    text: de noodzaak voor de onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
  - number: 17.1.d
    text: |-
      een schriftelijke beslissing als bedoeld in [artikel 3, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel3
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '3'
        hoofdstuk: '1'
  - number: 17.1.e
    text: |-
      het zorgplan of een schriftelijke beslissing als bedoeld in [artikel 15, eerste of vijfde lid][ref1], die
      legitimeert tot de vorm van onvrijwillige zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel15
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 17.1.f
    text: |-
      het besluit tot opname en verblijf, de rechterlijke machtiging, of de beschikking tot
      inbewaringstelling, die legitimeert tot onvrijwillige opname, de voorwaardelijke rechterlijke
      machtiging, bedoeld in [artikel 28aa, eerste lid][ref1] of de beslissing van de strafrechter op grond van
      [artikel 2.3 van de Wet forensische zorg][ref2] waaruit blijkt of de cliënt is opgenomen met een nog geldende
      justitiële titel op grond van het [Wetboek van Strafrecht][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel28aa
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: 28aa
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0040634
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001854
  - number: 17.1.g
    text: de begindatum en de einddatum van de onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
  - number: 17.1.h
    text: de duur en de frequentie van de onvrijwillige zorg;
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
  - number: 17.1.i
    text: |-
      de beslissingen van de zorgaanbieder op de aanvragen voor verlof of ontslag op grond van de [artikelen 47][ref1]
      of [48][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel48
    url: https://wetten.overheid.nl/BWBR0040632/2021-07-01#Artikel17
    references:
