  - number: 16.2.b
    text: |-
      een afschrift van de beslissing bedoeld in [artikel 3, tweede lid][ref1] en de verklaring van de vertegenwoordiger
      bedoeld in artikel 3, zesde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel3
