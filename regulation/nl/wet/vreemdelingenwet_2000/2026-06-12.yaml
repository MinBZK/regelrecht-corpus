        artikel: '59'
        hoofdstuk: '5'
  - number: 53a
    text: >-
      1 De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen, zijn,
      na een woning te hebben betreden en na aldaar een vreemdeling staande te hebben gehouden wiens identiteit niet
      onmiddellijk kan worden vastgesteld, bevoegd deze woning te doorzoeken zonder toestemming van de bewoner voor
      zover dat redelijkerwijs noodzakelijk is voor de tijdelijke inbewaringneming van zaken waaruit de identiteit van de
      betrokken vreemdeling met een redelijke mate van zekerheid kan worden afgeleid.


      2 De ambtenaren zijn tevens bevoegd elke bij een onderneming behorende ruimte te betreden en te doorzoeken voor
      zover dat redelijkerwijs noodzakelijk is voor de in het eerste lid bedoelde zaken, indien een staande gehouden
      vreemdeling wiens identiteit niet onmiddellijk kan worden vastgesteld, in die onderneming werkzaam is en indien
      vermoed wordt dat de vreemdeling een bij de onderneming behorende ruimte als woonruimte gebruikt.


      3 Tot doorzoeking voor de tijdelijke inbewaringneming van zaken waaruit de identiteit van de betrokken vreemdeling
      met een redelijke mate van zekerheid kan worden afgeleid wordt niet overgegaan dan nadat de vreemdeling is
      uitgenodigd deze vrijwillig af te geven.


      4 De doorzoeking vindt slechts plaats voor zover dit redelijkerwijs niet leidt tot substantiële schade aan de
      ruimte of aan de zaken die zich in deze ruimte bevinden.


      5 De doorzoeking vindt slechts plaats in aanwezigheid van een bevoegd ambtenaar, tevens hulpofficier van Justitie.


      6 De ambtenaren, bedoeld in het eerste lid, zijn tevens bevoegd in afwachting van de komst van de ambtenaar,
      bedoeld in het vijfde lid, de maatregelen te nemen die redelijkerwijs nodig zijn om wegmaking, onbruikbaarmaking,
      onklaarmaking of beschadiging van de voor tijdelijke inbewaringneming vatbare voorwerpen te voorkomen. Deze
      maatregelen kunnen de vrijheid van de personen die zich ter plaatse bevinden beperken.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel53a
  - number: 53b
    text: |-
      1 [Artikel 10 van de Algemene wet op het binnentreden][ref1] is van overeenkomstige toepassing op de bevoegdheid
      tot doorzoeking.

      2 In aanvulling op [artikel 10 van de Algemene wet op het binnentreden][ref2] vermeldt de ambtenaar die de
      doorzoeking, bedoeld in [artikel 53a, eerste en tweede lid][ref3], heeft verricht, in het schriftelijk verslag op
      welke gronden werd aangenomen dat deze redelijkerwijs noodzakelijk was voor de tijdelijke inbewaringneming van de
      zaken, bedoeld in artikel 53a, eerste en tweede lid.

      3 Het verslag wordt toegezonden aan de officier van justitie.


