  - number: 45f
    text: >-
      Indien Onze Minister voornemens is om de EU-verblijfsvergunning voor langdurig ingezetenen met op het aan de
      vreemdeling verstrekte document, bedoeld in artikel 9, de aantekening als bedoeld in artikel 45c, eerste lid, in te
      trekken, is artikel 41 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel45f
  - number: 45g
    text: |-
      1 De beschikking op de aanvraag tot het verlenen van de EU-verblijfsvergunning voor langdurig ingezetenen wordt
      bekendgemaakt uiterlijk zes maanden na ontvangst van de aanvraag.

      2 De termijn voor de bekendmaking van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden
      worden verlengd, indien er naar het oordeel van Onze Minister sprake is van bijzondere omstandigheden die verband
      houden met het complexe karakter van de behandeling van de aanvraag.

      3 Onze Minister stelt de vreemdeling in kennis van de verlenging.

      4 De dag waarop de termijn, bedoeld in het eerste dan wel tweede lid, is verstreken geldt voor de toepassing van
      [artikel 4:17, derde lid, van de Algemene wet bestuursrecht][ref1] als de dag waarop de termijn voor het geven van
      de beschikking is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel417
