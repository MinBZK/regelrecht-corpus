  - number: 59c
    text: |-
      1 Onze Minister stelt een vreemdeling slechts in vreemdelingenbewaring op grond van [artikel 59][ref1], [59a][ref2]
      of [59b][ref3], voor zover geen minder dwingende maatregelen doeltreffend kunnen worden toegepast.

      2 Vreemdelingenbewaring van een vreemdeling blijft achterwege of wordt beëindigd, indien deze niet langer
      noodzakelijk is met het oog op het doel van de vreemdelingenbewaring.

      3 In het besluit tot vrijheidsontneming of vreemdelingenbewaring op grond van de artikelen 6, 6a, 59, 59a of 59b
      vermeldt Onze Minister de feitelijke en juridische gronden waarop de vreemdelingenbewaring is gebaseerd en de reden
      dat geen minder dwingende maatregelen doeltreffend kunnen worden toegepast, bedoeld in het eerste lid.


