  - number: 107b
    text: >-
      1 Gelet op artikel 9, aanhef en tweede lid, onderdeel g, Algemene verordening gegevensbescherming, is het verbod
      om biometrische gegevens als bedoeld in artikel 4, onder 14, Algemene verordening gegevensbescherming te verwerken
      niet van toepassing indien de verwerking noodzakelijk is met het oog op de unieke identificatie en verificatie
      van de identiteit ten behoeve van grenscontrole als bedoeld in artikel 8 Schengengrenscode door middel van een
      geautomatiseerd grenscontrole systeem, en voor zover de verwerking niet reeds is toegestaan op grond van Europese
      verordeningen.


      2 Gegevens als bedoeld in het eerste lid worden maximaal 24 uur bewaard.


      3 Bij regeling van Onze Minister kunnen voorwaarden en beperkingen worden gesteld aan de verwerking van gegevens,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel107b
  - number: '108'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van de tweede categorie wordt gestraft overtreding
      van bij ministeriële regeling aan te wijzen voorschriften vastgesteld bij of krachtens de Schengengrenscode,
      overtreding van een voorschrift, vastgesteld bij of krachtens de [artikelen 2t, tweede en derde lid][ref1],
      [5, eerste en tweede lid][ref2], [24a, tweede en derde lid][ref3], [46, tweede lid, aanhef, en onder b][ref4],
      alsmede handelen in strijd met [artikel 56, eerste lid][ref5], dan wel handelen in strijd met een verplichting
      opgelegd bij of krachtens de [artikelen 2a, derde lid, onder b][ref6], [6, eerste of derde lid][ref7],
      [6a, eerste lid][ref8], [54][ref9], [55][ref10], [57, eerste lid][ref11], [58, eerste lid][ref12], of
      [65, derde lid][ref13].

      2 Overtreding van een voorschrift, vastgesteld bij of krachtens [artikel 4, eerste tot en met derde lid][ref14],
      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.

      3 De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen.

      4 Met de opsporing van de in het eerste en tweede lid strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref15], belast de ambtenaren belast met de
      grensbewaking en ambtenaren belast met het toezicht op vreemdelingen. Deze ambtenaren zijn tevens
      belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref16] en
      [184 van het Wetboek van Strafrecht][ref17], voor zover deze feiten betrekking hebben op een aanwijzing, vordering
      of handeling, gedaan of ondernomen door henzelf.

      5 In afwijking van het eerste lid wordt handelen in strijd met een verplichting, opgelegd bij of krachtens
      [artikel 54, eerste lid, onder b, e of g][ref18], gestraft met geldboete van de tweede categorie, indien het
      feit wordt begaan door een gemeenschapsonderdaan. Het derde lid en de eerste volzin van het vierde lid zijn van
      overeenkomstige toepassing.

      6 Het eerste lid is van overeenkomstige toepassing ten aanzien van de vreemdeling die in Nederland verblijft
      terwijl hij weet of ernstige reden heeft te vermoeden dat tegen hem een inreisverbod is uitgevaardigd, indien het
      inreisverbod is gegeven anders dan met toepassing van [artikel 66a, zevende lid][ref19]. Het derde lid en de eerste
      volzin van het vierde lid zijn eveneens van overeenkomstige toepassing.


