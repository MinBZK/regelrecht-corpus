        bwb_id: BWBR0011823
        artikel: 45d
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 45b
    text: |-
      1 De aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig ingezetenen wordt afgewezen, indien de
      vreemdeling direct voorafgaande aan de aanvraag:

      a. een verblijfsrecht van tijdelijke aard heeft op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld
      in [artikel 14][ref1];

      b. een formeel beperkt verblijfsrecht heeft;

      c. verblijf heeft op grond van een bijzondere geprivilegieerde status;

      d. verblijf heeft op grond van een verblijfsvergunning asiel als bedoeld in artikel 28, die niet is verleend op
      grond van de artikelen 29 of 29a;

      e. verblijf heeft op grond van een verblijfsvergunning asiel als bedoeld in artikel 28, die is verleend op grond
      van de artikelen 29b, 29c of 29d, bij een vreemdeling die in het bezit is van een verblijfsvergunning als bedoeld
      in artikel 28, die niet is verleend op grond van de artikelen 29 of 29a.

      2 Onverminderd het eerste lid kan de aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig
      ingezetenen slechts worden afgewezen, indien de vreemdeling:

      a. niet gedurende vijf jaren ononderbroken en direct voorafgaande aan de aanvraag rechtmatig verblijf als bedoeld
      in [artikel 8][ref2] heeft gehad, met inachtneming van het derde lid;

      b. in de periode, bedoeld onder a, zes of meer achtereenvolgende maanden of in totaal tien of meer maanden buiten
      Nederland heeft verbleven;

      c. al of niet tezamen met de gezinsleden bij wie hij verblijft, niet zelfstandig en duurzaam beschikt over
      voldoende middelen van bestaan;

      d. bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem ter zake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref3], is opgelegd;

      e. een gevaar vormt voor de nationale veiligheid;

      f. niet beschikt over een toereikende ziektekostenverzekering voor hemzelf en de te zijnen laste komende
      gezinsleden; of

      g. niet heeft voldaan aan het bij of krachtens algemene maatregel van bestuur vast te stellen inburgeringsvereiste.

      3 Voor de berekening van de periode bedoeld in het tweede lid, onder a, wordt verblijf als bedoeld in het eerste
      lid en verblijf als bedoeld in het tweede lid, onder b, niet meegeteld, met uitzondering van verblijf voor studie
      of beroepsopleiding, dat voor de helft wordt meegeteld.

      4 Voor de berekening van de periode, bedoeld in het tweede lid, onderdeel a, wordt de periode tussen de datum van
      indiening van de aanvraag waarop een verblijfsvergunning asiel als bedoeld in de artikelen 29 of 29a werd verleend
      en de datum waarop de in artikel 9, tweede lid, onder a, bedoelde verblijfstitel werd afgegeven, volledig in
      aanmerking genomen.

      5 Wanneer de vreemdeling die verblijf heeft op grond van een verblijfsvergunning asiel als bedoeld in artikel 28,
      die is verleend op grond van de artikelen 29 of 29a, wordt aangetroffen in een andere lidstaat zonder dat hij het
      recht heeft daar te wonen of te verblijven, wordt de periode waarin hij voorafgaand daaraan rechtmatig in Nederland
      verbleef, niet in aanmerking genomen bij de berekening van de periode, bedoeld in het tweede lid, onder a.

      6 Onze Minister kan het vijfde lid buiten toepassing laten indien de vreemdeling aantoont dat de redenen om in de
      andere lidstaat te wonen of te verblijven zonder dat hij daartoe het recht had, te wijten zijn aan omstandigheden
      die buiten zijn controle lagen.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het eerste
      lid en het tweede lid, onderdelen a tot en met f.

      8 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, onderdeel g, worden in ieder
      geval regels gesteld omtrent de inhoud van het inburgeringstraject en het te behalen niveau, alsmede omtrent de
      vrijstellingen en ontheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
