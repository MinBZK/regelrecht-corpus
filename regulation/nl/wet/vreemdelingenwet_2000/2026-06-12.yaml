  - number: '77'
    text: |-
      1 Tegen een ter uitvoering van deze wet genomen beschikking die niet door of namens Onze Minister is genomen,
      met uitzondering van een beschikking als bedoeld in [artikel 72, tweede lid][ref1], kan bij Onze Minister
      administratief beroep worden ingesteld.

      2 In afwijking van het eerste lid staat geen administratief beroep open tegen een beschikking die is gegeven op
      grond van de [artikelen 6][ref2], [6a][ref3] en [50, tweede, derde en vierde lid][ref4], en tegen de ophouding op
      grond van [artikel 50a, eerste lid][ref5].


