    text: |-
      1 In afwijking van [artikel 84, onder a][ref1], staat tegen de uitspraak van de rechtbank, bedoeld in
      [artikel 94, vijfde lid][ref2], hoger beroep open op de Afdeling bestuursrechtspraak van de Raad van State.

      2 [Afdeling 4][ref3] is van toepassing. In afwijking van [artikel 84, onder d][ref4], strekt het hoger beroep zich
      ook uit over de toekenning van schadevergoeding, bedoeld in [artikel 106][ref5].

      3 In afwijking van de [artikelen 8:41, eerste lid][ref6], en [8:82 van de Algemene wet bestuursrecht][ref7] wordt
      door de secretaris geen griffierecht geheven.


