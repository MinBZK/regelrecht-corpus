    text: |-
      De verblijfsvergunning voor bepaalde tijd kan worden ingetrokken op de gronden bedoeld in
      [artikel 18, eerste lid][ref1], met uitzondering van onderdeel b, en wordt ingetrokken indien aan de houder daarvan
      ambtshalve een verblijfsvergunning als bedoeld in [artikel 28, eerste lid, onderdeel c, subonderdeel 3°][ref2],
      wordt verleend.


