  - number: '15'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in [artikel 14, derde lid][ref1], wordt bepaald, dat de
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14][ref2], kan worden verleend onder een beperking
      verband houdend met verblijf als familie- of gezinslid aan gezinsleden van Nederlanders en vreemdelingen die
      rechtmatig verblijven als bedoeld in [artikel 8, onder a tot en met e en l][ref3].


