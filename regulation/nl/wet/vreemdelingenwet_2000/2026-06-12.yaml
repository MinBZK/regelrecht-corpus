      1 Indien bezwaar wordt gemaakt tegen een beschikking omtrent de afgifte van de machtiging tot voorlopig
      verblijf, bedoeld in [artikel 1a, onderdeel b][ref1], de verblijfsvergunning, bedoeld in [artikel 14][ref2]
      of [20][ref3], dan wel de ongewenstverklaring, bedoeld in [artikel 67][ref4], wordt in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref5] beslist binnen negentien weken, gerekend vanaf
      de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.

      2 Onverminderd [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref6], kan de beslissing worden
      verdaagd voor ten hoogste dertien weken indien naar het oordeel van Onze Minister voor de beoordeling van het
      bezwaarschrift advies van of onderzoek door derden of het openbaar ministerie nodig is.


