        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 2c
    text: |-
      1 Onze Minister is bevoegd:

      a. de aanvraag tot erkenning als referent in te willigen, af te wijzen, dan wel niet in behandeling te nemen, en

      b. de erkenning als referent te schorsen, in te trekken dan wel te wijzigen.

      2 De erkenning als referent houdt verband met het doel waarvoor de vreemdeling in Nederland wil verblijven.

      3 De erkenning als referent geldt voor onbepaalde tijd.

      4 De beschikking op een aanvraag omtrent de erkenning als referent wordt gegeven binnen drie maanden, welke termijn
      kan worden verlengd voor ten hoogste zes maanden, indien naar het oordeel van Onze Minister voor de beoordeling
      van de aanvraag advies van of onderzoek door derden of het openbaar ministerie, dan wel een verklaring omtrent het
      gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1], nodig is.

      5 De aanvrager is in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven
      regels leges verschuldigd terzake van de afdoening van een aanvraag omtrent de erkenning als referent.
      [Artikel 4:5, vierde lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.

      6 Onze Minister houdt een openbaar register van erkende referenten.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 2d
    text: >-
      1 Gegevens en bescheiden die van belang zijn voor de aanvraag omtrent de erkenning als referent, worden niet
      verkregen van de aanvrager, voor zover Onze Minister die gegevens of bescheiden kan verkrijgen uit bij regeling van
      Onze Minister aan te wijzen administraties, tenzij hierdoor een goede uitvoering van de wet wordt belet.


      2 Overeenkomstig bij regeling van Onze Minister gestelde regels verstrekt de aanvrager Onze Minister op diens
      verzoek en al dan niet in persoon alsnog de gegevens en bescheiden, die van belang zijn voor de beoordeling van
      de aanvraag.


      3 Bij regeling van Onze Minister wordt bepaald voor welke gegevens en bescheiden het eerste lid van toepassing is
      en kunnen administraties of delen daarvan worden aangewezen, waarvoor het eerste lid tijdelijk niet van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2d
  - number: 2e
    text: |-
      1 Onze Minister kan de aanvraag tot erkenning als referent of tot wijziging van de erkenning als referent afwijzen,
      indien:

      a. de aanvrager, voor zover vereist op grond van de [Handelsregisterwet 2007][ref1], niet is ingeschreven in het
      handelsregister, bedoeld in [artikel 2 van die wet][ref2];

      b. de continuïteit en solvabiliteit van de onderneming, rechtspersoon of organisatie onvoldoende is gewaarborgd;

      c. de betrouwbaarheid van de aanvrager of van de direct of indirect bij die onderneming, rechtspersoon of
      organisatie betrokken natuurlijke of rechtspersonen of ondernemingen onvoldoende vast staat;

      d. de erkenning als referent van de aanvrager of van de direct of indirect bij die onderneming, rechtspersoon of
      organisatie betrokken rechtspersonen of ondernemingen binnen een periode van vijf jaar direct voorafgaand aan de
      aanvraag is ingetrokken;

      e. de aanvrager niet voldoet aan de vereisten die verband houden met het doel waarvoor de vreemdeling in Nederland
      verblijft of wil verblijven, waaronder in ieder geval kan worden verstaan de aansluiting bij en naleving van een
      gedragscode.

      2 Natuurlijke personen worden niet als referent erkend.

      3 Overeenkomstig bij regeling van Onze Minister gestelde regels, legt de aanvrager desgevraagd een verklaring
      omtrent het gedrag over, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0014194
  - number: 2f
    text: |-
      1 Onze Minister kan de erkenning als referent schorsen op grond van ernstige vermoedens dat er grond bestaat om
      toepassing te geven aan [artikel 2g][ref1].

      2 De schorsing van de erkenning als referent eindigt op de dag na de dag waarop de beschikking omtrent de
      intrekking is bekendgemaakt of de dag waarop sedert de schorsing drie maanden zijn verstreken.

      3 De termijn, bedoeld in het tweede lid, kan worden verlengd, indien naar het oordeel van Onze Minister advies van
      of onderzoek door derden of het openbaar ministerie nodig is.

      4 Schorsing van de erkenning heeft tot gevolg dat de referent voor de duur van de schorsing niet als erkend
      referent wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2g
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2f
    references:
