  - number: 2y
    text: |-
      1 De geldigheidsduur van een terugkeervisum kan de geldigheidsduur van de aan de vreemdeling verleende
      verblijfsvergunning niet overschrijden en bedraagt ten hoogste een jaar. Het terugkeervisum kan worden verleend
      voor een of meer reizen.

      2 In afwijking van het eerste lid bedraagt de geldigheidsduur van een terugkeervisum ten behoeve van een
      vreemdeling die rechtmatig verblijf houdt op grond van [artikel 8, onderdeel f, g of h][ref1], ten hoogste drie
      maanden en is het geldig voor één reis.

      3 Onze Minister kan vrijstelling dan wel ontheffing verlenen van het eerste en tweede lid.

      4 De geldigheidsduur van een terugkeervisum kan niet worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2y
    references:
