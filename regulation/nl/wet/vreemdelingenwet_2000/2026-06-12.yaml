        artikel: 2:1
  - number: '24'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de wijze van indiening en behandeling van een aanvraag;

      b. het al dan niet in persoon door de vreemdeling, diens wettelijk vertegenwoordiger of diens referent verstrekken
      van gegevens welke van belang zijn voor de aanvraag;

      c. de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede
      de bij of krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling, de
      referent of aan andere belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van
      beschikkingen ook kan geschieden door middel van het toezenden of uitreiken van een document en door het stellen
      van aantekeningen in een daarbij aan te wijzen document.

      2 De vreemdeling is, in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven regels,
      leges verschuldigd terzake van de afdoening van een aanvraag. Daarbij kan Onze Minister tevens bepalen dat de
      vreemdeling voor de afgifte van een document waaruit het rechtmatig verblijf blijkt leges verschuldigd is. Als
      betaling achterwege blijft, wordt de aanvraag niet in behandeling genomen dan wel het document niet afgegeven.
      [Artikel 4:5, vierde lid, Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel24
    references:
