  - number: '46'
    text: |-
      1 Met het toezicht op de naleving en de uitvoering van de Schengengrenscode en de wettelijke voorschriften met
      betrekking tot de grensbewaking zijn belast:

      a. de ambtenaren van de Koninklijke marechaussee;

      b. de ambtenaren die zijn tewerkgesteld bij de regionale eenheid in het gebied waarin de haven van Rotterdam is
      gelegen;

      c. de directeur van een grenslogies als bedoeld in [artikel 3 van het Reglement regime grenslogies][ref1];

      d. de bij besluit van Onze Minister, in overeenstemming met Onze Ministers van Binnenlandse
      Zaken en Koninkrijksrelaties en van Defensie, aangewezen ambtenaren van politie als bedoeld in
      [artikel 2, onder a, c en d, van de Politiewet 2012][ref2] die zijn aangesteld voor de uitvoering van de
      politietaak.

      2 Bij algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de in het belang van de grensbewaking te treffen voorzieningen;

      b. de verplichtingen waaraan personen zijn onderworpen met het oog op de controle in het belang van de
      grensbewaking.

      3 De bij of krachtens het eerste lid aangewezen ambtenaren belast met de grensbewaking zijn de in artikel 2, onder
      14, van de Schengengrenscode bedoelde grenswachters.


      [ref1]: https://wetten.overheid.nl/BWBR0005848#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
