  - number: 55.0a
    text: >-
      1 Onze Minister kan een vreemdeling toewijzen aan een geografisch gebied in Nederland waarbinnen hij zich vrij
      kan bewegen gedurende de duur van de asielprocedure indien dit zorgt voor een snelle, efficiënte en effectieve
      verwerking van zijn asielaanvraag in overeenstemming met de Procedureverordening, of voor de geografische spreiding
      van vreemdelingen waarbij rekening wordt gehouden met de capaciteit van de betrokken geografische gebieden.


      2 De vreemdeling wordt zo snel mogelijk schriftelijk in kennis gesteld van de toewijzing aan een geografisch gebied
      en van de geografische grenzen van dat gebied.


      3 De vreemdeling aan wie een geografisch gebied is toegewezen, kan Onze Minister om toestemming verzoeken om dat
      gebied tijdelijk te verlaten.


      4 Bij of krachtens algemene maatregel van bestuur worden nadere voorwaarden gesteld voor de toepassing van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel55.0a
  - number: 55a
    text: |-
      1 Onze Minister kan bij een overtreding van de verplichtingen bij of krachtens
      [artikelen 2a, derde lid, onder b][ref1], [2t, tweede en derde lid][ref2], [24a, tweede en derde lid][ref3],
      [54, eerste lid, onder a tot en met e en g, en tweede lid][ref4], een bestuurlijke boete opleggen van ten hoogste
      € 3000 voor ondernemingen, rechtspersonen en andere organisaties en € 1500 voor natuurlijke personen. Bij regeling
      van Onze Minister kunnen nadere regels worden gesteld omtrent de hoogte van de bestuurlijke boete.

      2 Het rapport vermeldt in ieder geval de bij het beboetbare feit betrokken persoon of personen.

      3 Onze Minister kan de bestuurlijke boete verhogen met 50%, indien op de dag van het constateren van de overtreding
      nog geen 24 maanden zijn verstreken nadat een eerdere overtreding van eenzelfde wettelijke verplichting is
      geconstateerd.


