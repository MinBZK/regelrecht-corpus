  - number: '99'
    text: >-
      1 De vreemdeling is steeds bevoegd een of meer raadslieden te kiezen.


      2 Daartoe is ook zijn wettige vertegenwoordiger of zijn bijzondere gemachtigde bevoegd.


      3 Kan de vreemdeling zijn wil te dien aanzien niet doen blijken en heeft hij geen wettelijke vertegenwoordiger of
      bijzondere gemachtigde, dan is zijn echtgenoot of de meest gerede van zijn hier te lande verblijvende bloed- of
      aanverwanten, tot de vierde graad ingesloten, tot die keuze bevoegd. De voorzieningenrechter kan ambtshalve één of
      meer raadslieden toevoegen indien de in de voorgaande volzin bedoelde personen niet in staat worden geacht de keuze
      binnen redelijke termijn te maken.


      4 De ingevolge het tweede of derde lid gekozen raadsman treedt af zodra de vreemdeling zelf een raadsman heeft
      gekozen.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel99
  - number: '100'
    text: |-
      1 Op verzoek van de vreemdeling wordt hem een raadsman toegevoegd zodra hem ingevolge deze wet zijn vrijheid is
      ontnomen. [Artikel 99, derde lid][ref1], is van overeenkomstige toepassing.

      2 Bevoegd tot het geven van een last tot toevoeging aan het bestuur van de raad voor rechtsbijstand is de
      voorzieningenrechter van de rechtbank in het rechtsgebied waarvan de vreemdeling zich bevindt. Ingeval hoger beroep
      is ingesteld op grond van [artikel 95][ref2], is de voorzitter van de Afdeling bestuursrechtspraak van de Raad van
      State bevoegd tot het geven van de last tot toevoeging aan het bestuur van de raad voor rechtsbijstand.

      3 Voorzover de wet niet op andere wijze in de toevoeging voorziet, kan het bestuur van de raad voor rechtsbijstand
      aan de vreemdeling op diens verzoek een raadsman toevoegen.

      4 Een overeenkomstig het voorgaande lid gedaan verzoek wordt ingewilligd in gevallen waarin aannemelijk is dat de
      vreemdeling niet in staat is de kosten van een gekozen raadsman te dragen en waarin ook overigens, naar het oordeel
      van dat bureau, voldoende grond voor toevoeging bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel95
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel100
