  - number: '82'
    text: >-
      1 Onverminderd artikel 68, eerste en tweede lid, van de Procedureverordening, wordt de werking van het besluit
      omtrent een verblijfsvergunning asiel als bedoeld in artikel 28 opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.


      2 Het eerste lid is niet van toepassing, indien:


      a. artikel 68, derde lid, van de Procedureverordening van toepassing is;


      b. artikel 43, derde lid, van de Asiel- en migratiebeheerverordening van toepassing is;


      c. het een besluit als bedoeld in artikel 43 of 45, vierde lid, betreft.


      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het recht om al dan
      niet in afwachting van de uitspraak op een verzoek om een voorlopige voorziening in Nederland te mogen verblijven.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel82
  - number: '83'
    text: |-
      1 De rechtbank houdt bij de beoordeling van het beroep rekening met:

      a. feiten en omstandigheden die na het bestreden besluit zijn aangevoerd, en

      b. wijzigingen van beleid die na het bestreden besluit zijn bekendgemaakt.

      2 Met de in het eerste lid bedoelde gegevens wordt slechts rekening gehouden indien deze relevant kunnen zijn voor:

      a. de beschikking omtrent de verblijfsvergunning, bedoeld in artikel 28;

      b. de beschikking omtrent de EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling die in het bezit
      is van een verblijfsvergunning als bedoeld in [artikel 28][ref1];

      c. een besluit omtrent de intrekking van een EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling
      op wiens document, bedoeld in [artikel 9][ref2], de aantekening, bedoeld in [artikel 45c, eerste lid][ref3], is
      geplaatst dan wel omtrent het wijzigen of schrappen van die aantekening;

      d. de ambtshalve verlening van een vergunning als bedoeld in [artikel 14][ref4], dan wel het achterwege laten van
      de uitzetting of overdracht op grond van [artikel 64][ref5].

      3 Met de in het eerste lid bedoelde gegevens wordt geen rekening gehouden voor zover de goede procesorde zich
      daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.

      4 Indien de indiener van het beroepschrift zich beroept op feiten of omstandigheden als bedoeld in het eerste lid,
      onderdeel a, maar deze niet aanstonds aannemelijk maakt, stelt de rechtbank hem zo nodig in de gelegenheid deze
      feiten of omstandigheden binnen een door de rechtbank te bepalen termijn alsnog aannemelijk te maken, tenzij de
      goede procesorde zich daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.

      5 Onze Minister laat de wederpartij en de rechtbank zo spoedig mogelijk schriftelijk weten of de gegevens, bedoeld
      in het eerste lid, aanleiding zijn voor handhaving, wijziging of intrekking van het bestreden besluit. De rechtbank
      kan daarvoor een termijn stellen.

      6 Indien Onze Minister zich beroept op gegevens als bedoeld in het eerste lid, biedt de rechtbank de vreemdeling de
      gelegenheid om daarop schriftelijk te reageren.

      7 Het vijfde en zesde lid zijn niet van toepassing indien:

      a. aan een schriftelijke reactie redelijkerwijs geen behoefte bestaat;

      b. deze gegevens niet relevant kunnen zijn voor de beschikking omtrent de verblijfsvergunning, bedoeld in artikel
      28 of de EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling die in het bezit is van een
      verblijfsvergunning als bedoeld in artikel 28, een beschikking omtrent de intrekking van de EU-verblijfsvergunning
      voor langdurig ingezetenen van een vreemdeling op wiens document, bedoeld in [artikel 9][ref6], de aantekening,
      bedoeld in [artikel 45c, eerste lid][ref7], is geplaatst, of omtrent de ambtshalve verlening van een vergunning
      als bedoeld in [artikel 14][ref8], dan wel het achterwege laten van de uitzetting of overdracht op grond van
      [artikel 64][ref9];

      c. de goede procesorde zich daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
