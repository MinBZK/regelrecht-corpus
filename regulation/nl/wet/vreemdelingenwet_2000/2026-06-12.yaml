preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bestaande wetgeving betreffende de toelating en
    uitzetting van vreemdelingen, het toezicht op vreemdelingen die in Nederland verblijf houden, en de grensbewaking,
    te herzien en daartoe een nieuwe Vreemdelingenwet vast te stellen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      - aanvraag tot het verlenen van een verblijfsvergunning asiel: een verzoek om internationale bescherming als
      bedoeld in artikel 3, onderdeel 12, van de Procedureverordening dan wel een aanvraag om verblijf als gezinslid van
      een vreemdeling die internationale bescherming geniet, als bedoeld in de artikelen 29b, 29c en 29d;
      - aanvullend document: document waarin de aanvullende informatie is opgenomen, bedoeld in artikel 6, eerste lid,
      tweede alinea van de Richtlijn 2011/98/EU van het Europees Parlement en de Raad van 13 december 2011 betreffende
      één enkele aanvraagprocedure voor een gecombineerde vergunning voor onderdanen van derde landen om te verblijven en
      te werken op het grondgebied van een lidstaat, alsmede inzake een gemeenschappelijk pakket rechten voor werknemers
      uit derde landen die legaal in een lidstaat verblijven;
      - ambtenaren belast met de grensbewaking: de ambtenaren, bedoeld in [artikel 46][ref1];
      - ambtenaren belast met het toezicht op referenten: de ambtenaren, bedoeld in [artikel 47a][ref2];
      - ambtenaren belast met het toezicht op vreemdelingen: de ambtenaren, bedoeld in [artikel 47][ref3];
      - Asiel- en migratiebeheerverordening: [Verordening (EU) 2024/1351](32024R1351) van het Europees Parlement en de
      Raad van 14 mei 2024 betreffende asiel- en migratiebeheer, tot wijziging van de [Verordeningen (EU) 2021/1147]
      (32021R1147) en [(EU) 2021/1060](32021R1060) en tot intrekking van [Verordening (EU) nr. 604/2013](32013R0604);
      - asielgrensprocedure: de asielgrensprocedure bedoeld in artikel 43 van de Procedureverordening;
      - besluit tot buitenbehandelingstelling: een besluit tot het afwijzen van een verzoek als impliciet of expliciet
      ingetrokken overeenkomstig artikel 36, tweede lid, van de Procedureverordening;
      - buitengrenzen: de Nederlandse zeegrenzen, alsmede lucht- of zeehavens waar grenscontrole op personen wordt
      uitgeoefend;
      - erkende referent: de referent die krachtens [artikel 2c][ref4] als zodanig is erkend;
      - Etias-verordening: [Verordening (EU) 2018/1240](33140R2018) van het Europees Parlement en de Raad van
      12 september 2018 tot oprichting van een Europees reisinformatie- en -autorisatiesysteem (Etias) en tot
      wijziging van de [Verordeningen (EU) nr. 1077/2011](32011R1077), [(EU) nr. 515/2014](32014R0515), [(EU) 2016/399]
      (32299R2016), [(EU) 2016/1624](33524R2016) en [(EU) 2017/2226](32226R2017);
      - Europese verordeningen die betrekking hebben op biometrische gegevens: 1° [Verordening (EU) 2024/1358]
      (32024R1358) van het Europees Parlement en de Raad van 14 mei 2024 betreffende de instelling van «Eurodac» voor
      de vergelijking van biometrische gegevens om de [Verordeningen (EU) 2024/1351](32024R1351) en [(EU) 2024/1350]
      (32024R1350) van het Europees Parlement en de Raad en [Richtlijn 2001/55/EG](32001L0055) van de Raad doeltreffend
      toe te passen en om illegaal verblijvende onderdanen van derde landen en staatlozen te identificeren en
      betreffende verzoeken van rechtshandhavingsinstanties van de lidstaten en Europol om vergelijkingen van Eurodac-
      gegevens ten behoeve van rechtshandhaving, tot wijziging van de [Verordeningen (EU) 2018/1240](32018R1240) en
      [(EU) 2019/818](32019R0818) van het Europees Parlement en de Raad en tot intrekking van [Verordening (EU) nr.
      603/2013](32013R0603) van het Europees Parlement en de Raad; 2° [Verordening (EG) nr. 767/2008](32008R0767) van
      het Europees Parlement en de Raad van 9 juli 2008 betreffende het visuminformatiesysteem (VIS) en de uitwisseling
      tussen de lidstaten van gegevens op het gebied van visa voor kort verblijf (VIS-verordening); 3° [Verordening
      (EG) nr. 810/2009](32009R0810) van het Europees Parlement en de Raad van 13 juli 2009 tot vaststelling van
      een gemeenschappelijke visumcode (Visumcode); 4° Verordening (EG) nr. 1030/2002 van de Raad van 13 juni 2002
      betreffende de invoering van een uniform model voor verblijfstitels voor onderdanen van derde landen; 5°
      [Verordening (EU) 2017/2226](32226R2017) van het Europees Parlement en de Raad van 30 november 2017 tot instelling
      van een inreis-uitreissysteem (EES) voor de registratie van inreis- en uitreisgegevens en van gegevens over
      weigering van toegang ten aanzien van onderdanen van derde landen die de buitengrenzen overschrijden en tot
      vaststelling van de voorwaarden voor toegang tot het EES voor rechtshandhavingsdoeleinden en tot wijziging van de
      overeenkomst ter uitvoering van het te Schengen gesloten akkoord en [Verordeningen (EG) nr. 767/2008](32008R0767)
      en (EU) [nr. 1077/2011](32011R1077);
      - gecombineerde vergunning: verblijfsvergunning regulier voor bepaalde tijd als bedoeld in [artikel 14][ref5],
      verleend door Onze Minister onder de beperking «arbeid in loondienst», «lerend werken» of «seizoenarbeid», tevens
      zijnde vergunning voor het verrichten van werkzaamheden bij een specifieke werkgever, met het aanvullend document;
      - gemeenschapsonderdanen: 1°. onderdanen van de lidstaten van de Europese Unie die op grond van het Verdrag
      betreffende de werking van de Europese Unie gerechtigd zijn een andere lidstaat binnen te komen en er te
      verblijven; 2°. familieleden van de onder 1° genoemden die de nationaliteit van een derde staat bezitten en die
      uit hoofde van een ter toepassing van het Verdrag betreffende de werking van de Europese Unie genomen besluit
      gerechtigd zijn een lidstaat binnen te komen en er te verblijven; 3°. onderdanen van een staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992, die ter zake van binnenkomst en
      verblijf in een lidstaat rechten genieten die gelijk zijn aan die van burgers van de lidstaten van de Europese
      Unie; 4°. familieleden van de onder 3° genoemden die de nationaliteit van een derde staat bezitten en die krachtens
      bovengenoemde Overeenkomst gerechtigd zijn een lidstaat binnen te komen en er te verblijven; 5°. onderdanen
      van de Zwitserse Bondsstaat, indien zij verblijven op grond van de op 21 juni 1999 te Luxemburg totstandgekomen
      Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat, anderzijds,
      over het vrije verkeer van personen (Trb. 2000, 16 en 86); 6°. familieleden van de onder 5° genoemden die de
      nationaliteit van een derde staat bezitten en die krachtens de onder 5° genoemde Overeenkomst gerechtigd zijn een
      lidstaat binnen te komen en er te verblijven;
      - Gezinsherenigingsrichtlijn: [Richtlijn 2003/86/EG](32003L0086) van de Raad van 22 september 2003 inzake het recht
      op gezinshereniging;
      - herhaalde aanvraag: een aanvraag, die op grond van
      [artikel 4:6, tweede lid, van de Algemene wet bestuursrecht][ref6] kan worden afgewezen;
      - Hervestigingsverordening: [Verordening (EU) 2024/1350](32024R1350) van het Europees Parlement en de Raad van
      14 mei 2024 tot vaststelling van een Uniekader voor hervestiging en toelating op humanitaire gronden, en tot
      wijziging van [Verordening (EU) 2021/1147](32021R1147);
      - inreisverbod: het inreisverbod, bedoeld in artikel 3, punt 6, van de Terugkeerrichtlijn;
      - internationale bescherming: internationale bescherming als bedoeld in artikel 3, onderdeel 3, van de
      Kwalificatieverordening;
      - de korpschef: de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref7];
      - Kwalificatieverordening: [Verordening (EU) 2024/1347](32024R1347) van het Europees Parlement en de Raad van
      14 mei 2024 inzake normen voor de erkenning van onderdanen van derde landen of staatlozen als personen die
      internationale bescherming genieten, voor een uniforme status voor vluchtelingen of voor personen die voor
      subsidiaire bescherming in aanmerking komen, en voor de inhoud van de verleende bescherming, tot wijziging van
      [Richtlijn 2003/109/EG](32003L0109) van de Raad en tot intrekking van [Richtlijn 2011/95/EU](32011L0095) van het
      Europees Parlement en de Raad;
      - langdurig ingezetene: houder van een EU-verblijfsvergunning voor langdurig ingezetenen als bedoeld in Richtlĳn
      2003/109/EG van de Raad van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde
      landen, zoals gewijzigd door [Richtlijn 2011/51/EU](32011L0051) van het Europees Parlement en de Raad van 11 mei
      2011 tot wijziging van [Richtlijn 2003/109/EG](32003L0109) van de Raad teneinde haar werkingssfeer uit te breiden
      tot personen die internationale bescherming genieten, dan wel van een door een andere lidstaat op grond van deze
      richtlijn afgegeven EU-verblijfsvergunning voor langdurig ingezetenen;
      - minderjarige: eenieder die de leeftijd van 18 jaar nog niet heeft bereikt;
      - Niet-begeleide minderjarige: een persoon zoals gedefinieerd in artikel 2, onderdeel 5, van de Opvangrichtlijn;
      - Onafhankelijk toezichtmechanisme: het onafhankelijk toezichtmechanisme genoemd in artikel 10, tweede lid, van de
      Screeningsverordening en artikel 43, vierde lid, van de Procedureverordening;
      - Onze Minister: Onze Minister van Asiel en Migratie;
      - Opvangrichtlijn: [Richtlijn (EU) 2024/1346](32024L1346) van het Europees parlement en de Raad van 14 mei 2024 tot
      vaststelling van normen voor de opvang van verzoekers om internationale bescherming (herschikking);
      - overdrachtsbesluit: het besluit, bedoeld in artikel 42 van de Asiel- en migratiebeheerverordening;
      - persoonsgegevens en verwerking van persoonsgegevens: hetgeen daaronder wordt verstaan in artikel 4, aanhef en
      onder 1 en 2, van de Algemene verordening gegevensbescherming;
      - Procedureverordening: [Verordening (EU) 2024/1348](32024R1348) van het Europees Parlement en de Raad van 14 mei
      2024 tot vaststelling van een gemeenschappelijke procedure voor internationale bescherming in de Unie en tot
      intrekking van [Richtlijn 2013/32/EU](32013L0032);
      - referent: degene die overeenkomstig [artikel 2a][ref8] een verklaring heeft afgelegd of als zodanig is
      aangewezen;
      - reisautorisatie: een reisautorisatie als bedoeld in artikel 3, eerste lid, onder 5, van de Etias-verordening;
      - richtlijn tijdelijke bescherming: Richtlĳn 2001/55/EG van de Raad van 20 juli 2001 betreffende minimumnormen
      voor het verlenen van tijdelijke bescherming in geval van massale toestroom van ontheemden en maatregelen
      ter bevordering van een evenwicht tussen de inspanning van de lidstaten voor de opvang en het dragen van de
      consequentie van de opvang van deze personen;
      - Schengengrenscode: Verordening (EU) 2016/399 van het Europees Parlement en de Raad van 9 maart 2016 betreffende
      een Uniecode voor de overschrijding van de grenzen door personen (Schengengrenscode);
      - Screeningsautoriteiten: de bij of krachtens artikel 2ff, eerste, tweede en derde lid, aangewezen autoriteiten;
      - Screeningsverordening: [Verordening (EU) 2024/1356](32024R1356) van het Europees Parlement en de Raad van 14 mei
      2024 tot invoering van de screening van onderdanen van derde landen aan de buitengrenzen en tot wijziging van de
      [Verordeningen (EG) nr. 767/2008](32008R0767), [(EU) 2017/2226](32017R2226), [(EU) 2018/1240](32018R1240) en [(EU)
      2019/817](32019R0817);
      - SIS-verordening grenscontroles: [Verordening (EU) 2018/1861](33761R2018) van 28 november 2018 betreffende de
      instelling, de werking en het gebruik van het Schengeninformatiesysteem (SIS) op het gebied van grenscontroles,
      tot wijziging van de Overeenkomst ter uitvoering van het Akkoord van Schengen en tot wijziging en intrekking van
      [Verordening (EG) nr. 1987/2006](32006R1987);
      - SIS-verordening terugkeer: [Verordening (EU) 2018/1860](33760R2018) van het Europees Parlement en de Raad
      van 28 november 2018 betreffende het gebruik van het Schengeninformatiesysteem voor de terugkeer van illegaal
      verblijvende onderdanen van derde landen;
      - terugkeerbesluit: het terugkeerbesluit, bedoeld in artikel 3, punt 4, van de Terugkeerrichtlijn;
      - Terugkeerrichtlijn: Richtlijn 2008/115/EG van het Europees Parlement en de Raad van 16 december 2008 over
      gemeenschappelijke normen en procedures in de lidstaten voor de terugkeer van onderdanen van derde landen die
      illegaal op hun grondgebied verblijven;
      - tijdelijke bescherming: rechtmatig verblijf in de zin van [artikel 8, onder f of h][ref9], van de vreemdeling
      wiens uitzetting in verband met een aanvraag als bedoeld in [artikel 28][ref10] op grond van de richtlijn
      tijdelijke bescherming achterwege blijft;
      - verblijf op asielgerelateerde gronden: het verblijf van de vreemdeling in Nederland op de gronden bedoeld in de
      artikelen 29 tot en met 29d;
      - verblijf op reguliere gronden: het verblijf van een vreemdeling in Nederland op grond van deze wet anders dan op
      de gronden bedoeld in de artikelen 29 tot en met 29d;
      - Verordening interoperabiliteit grenzen en visa: [Verordening (EU) 2019/817](32717R2019) van het Europees
      Parlement en de Raad van 20 mei 2019 tot vaststelling van een kader voor interoperabiliteit tussen de Unie-
      informatiesystemen op het gebied van grenzen en visa en tot wijziging van [Verordeningen (EG) nr. 767/2008]
      (32008R0767), (EU) [2016/399](32299R2016), (EU) [2017/2226](32226R2017), (EU) [2018/1240](33140R2018), (EU)
      [2018/1726](33626R2018) en (EU) [2018/1861](33761R2018) van het Europees Parlement en de Raad, Beschikking
      [2004/512/EG](32412R2004) van de Raad en Besluit [2008/633](32533R2008)/JBZ van de Raad;
      - Verordening interoperabiliteit politiële en justitiële samenwerking, asiel en migratie: [Verordening (EU)
      2019/818](32718R2019) van het Europees Parlement en de Raad van 20 mei 2019 tot vaststelling van een kader voor
      interoperabiliteit tussen de Unie-informatiesystemen op het gebied van politiële en justitiële samenwerking, asiel
      en migratie en tot wijziging van [Verordeningen (EU) 2018/1726](33626R2018), [(EU) 2018/1862](33762R2018) en [(EU)
      2019/816](32716R2019);
      - *Vluchtelingenverdrag:* het op 28 juli 1951 te Genève tot stand gekomen Verdrag betreffende de status van
      vluchtelingen (Trb. 1951, 131), zoals gewijzigd bij het op 31 januari 1967 te New York tot stand gekomen Protocol
      betreffende de status van vluchtelingen (Trb. 1967, 76);
      - vreemdeling: ieder die de Nederlandse nationaliteit niet bezit en niet op grond van een wettelijke bepaling als
      Nederlander moet worden behandeld;


