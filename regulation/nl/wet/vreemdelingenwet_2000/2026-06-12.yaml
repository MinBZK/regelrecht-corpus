        bwb_id: BWBR0011823
        artikel: 2g
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 2g
    text: >-
      Onze Minister kan de erkenning als referent intrekken, indien:


      a. de erkenning is verleend op grond van onjuiste of onvolledige gegevens;


      b. de erkende referent niet langer voldoet aan de voorwaarden voor erkenning;


      c. de erkende referent zich niet heeft gehouden aan zijn verplichtingen als referent, of


      d. de erkende referent daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2g
  - number: 2h
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de toepassing van deze paragraaf, waarbij beperkingen als bedoeld in [artikel 14, derde lid][ref1], kunnen
      worden aangewezen waarvoor erkenning als referent niet mogelijk is;

      b. de indiening en behandeling van een aanvraag omtrent de erkenning als referent en de door de aanvrager te
      verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2h
