  - number: '84'
    text: |-
      In afwijking van [artikel 8:104, eerste lid, van de Algemene wet bestuursrecht][ref1] staat geen hoger beroep open
      tegen een uitspraak van de rechtbank of van de voorzieningenrechter van de rechtbank:

      a. over een besluit of handeling op grond van [artikel 6, eerste lid][ref2], [artikel 6a, eerste lid][ref3],
      [hoofdstuk 4][ref4] of [hoofdstuk 5][ref5];

      b. over een visum voor een verblijf van 90 dagen of minder;

      c. na toepassing van [artikel 78][ref6], of

      d. over de toekenning van de vergoeding, bedoeld in [artikel 106][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8104
