  - number: '62'
    text: >-
      1 Nadat tegen de vreemdeling, niet zijnde gemeenschapsonderdaan, een terugkeerbesluit is uitgevaardigd, dient hij
      Nederland uit eigen beweging binnen vier weken te verlaten.


      2 Onze Minister kan de voor een vreemdeling geldende termijn, bedoeld in het eerste lid, verkorten, dan wel, in
      afwijking van het eerste lid, bepalen dat een vreemdeling Nederland onmiddellijk moet verlaten, indien:


      a. er een onderduikrisico bestaat;


      b. de aanvraag van de vreemdeling tot het verlenen van een verblijfsvergunning of tot het verlengen van de
      geldigheidsduur van een verblijfsvergunning is afgewezen als kennelijk ongegrond of wegens het verstrekken van
      onjuiste of onvolledige gegevens; of


      c. de vreemdeling een gevaar vormt voor de openbare orde, de openbare veiligheid of de nationale veiligheid.


      3 Nadat het rechtmatig verblijf van de gemeenschapsonderdaan is geëindigd, dient hij Nederland uit eigen beweging
      binnen een maand na de kennisgeving daarvan te verlaten. Onze Minister kan deze termijn verkorten in naar behoren
      aangetoonde dringende gevallen.


      4 Onze Minister kan de voor een vreemdeling geldende termijnen, bedoeld in het eerste en derde lid, verlengen,
      rekening houdend met de specifieke omstandigheden van het individuele geval. Bij ministeriële regeling worden
      regels gesteld over de duur van de verlenging en worden de gevallen aangewezen waarin de termijn kan worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel62
  - number: 62a
    text: >-
      1 Onze Minister stelt de vreemdeling, niet zijnde gemeenschapsonderdaan, die niet of niet langer rechtmatig
      verblijf heeft, schriftelijk in kennis van de verplichting Nederland uit eigen beweging te verlaten en van de
      termijn waarbinnen hij aan die verplichting moet voldoen, tenzij:


      a. reeds eerder een terugkeerbesluit tegen de vreemdeling is uitgevaardigd en aan de daaruit voortvloeiende
      terugkeerverplichting niet is voldaan,


      b. de vreemdeling in bezit is van een door een andere lidstaat afgegeven geldige verblijfsvergunning of andere
      toestemming tot verblijf, of


      c. de vreemdeling door een andere lidstaat van de Europese Unie wordt teruggenomen op grond van een op 13 januari
      2009 geldende bilaterale of multilaterale overeenkomst of regeling.


      2 De kennisgeving, bedoeld in het eerste lid, geldt als terugkeerbesluit en kan tevens een inreisverbod inhouden.


      3 De vreemdeling, bedoeld in het eerste lid, onderdeel b, wordt opgedragen zich onmiddellijk naar het grondgebied
      van de betrokken lidstaat te begeven. Indien dit bevel niet wordt nageleefd of indien om redenen van openbare
      orde of nationale veiligheid het onmiddellijke vertrek van vreemdeling is vereist, wordt tegen de vreemdeling een
      terugkeerbesluit uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel62a
  - number: 62b
    text: >-
      1 Onze Minister stelt de vreemdeling die kan worden overgedragen op grond van de Asiel- en
      migratiebeheerverordening schriftelijk in kennis van het besluit om hem over te dragen aan de verantwoordelijke
      lidstaat.


      2 De kennisgeving, bedoeld in het eerste lid, geldt als een overdrachtsbesluit.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel62b
  - number: 62c
    text: |-
      Het rechtmatig verblijf op grond van [artikel 8, onder m][ref1], eindigt van rechtswege nadat de vreemdeling
      Nederland kennelijk uit eigen beweging heeft verlaten, dan wel de feitelijke overdracht is gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel62c
