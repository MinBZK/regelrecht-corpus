  - number: 66b
    text: >-
      1 Onze Minister kan ambtshalve wegens gewijzigde omstandigheden dan wel op aanvraag van de vreemdeling besluiten
      tot opheffing of tijdelijke opheffing van het inreisverbod.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel66b
  - number: '67'
    text: |-
      1 Tenzij [afdeling 3][ref1] van toepassing is, kan Onze Minister de vreemdeling ongewenst verklaren:

      a. indien hij niet rechtmatig in Nederland verblijft en bij herhaling een bij deze wet strafbaar gesteld feit heeft
      begaan;

      b. indien hij bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen
      een gevangenisstraf van drie jaren of meer is bedreigd dan wel hem terzake de maatregel als bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref2] is opgelegd;

      c. indien hij een gevaar vormt voor de openbare orde of nationale veiligheid en geen rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder a tot en met e dan wel l][ref3];

      d. ingevolge een verdrag, of

      e. in het belang van de internationale betrekkingen van Nederland.

      2 Indien de bekendmaking van de beschikking, waarbij de vreemdeling ongewenst wordt verklaard, geschiedt door
      toezending, wordt van de beschikking mededeling gedaan in de Staatscourant.

      3 In afwijking van [artikel 8][ref4] kan de ongewenst verklaarde vreemdeling geen rechtmatig verblijf hebben.


