  - number: '13'
    text: >-
      Een aanvraag tot het verlenen van een verblijfsvergunning wordt slechts ingewilligd indien:


      a. internationale verplichtingen daartoe nopen;


      b. met de aanwezigheid van de vreemdeling een wezenlijk Nederlands belang is gediend, of


      c. klemmende redenen van humanitaire aard daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel13
  - number: '14'
    text: |-
      1 Onze Minister is bevoegd:

      a. de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;

      b. de aanvraag tot het verlengen van de geldigheidsduur ervan in te willigen, af te wijzen dan wel niet in
      behandeling te nemen;

      c. een verblijfsvergunning voor bepaalde tijd op aanvraag of ambtshalve te wijzigen wegens veranderde
      omstandigheden;

      d. een verblijfsvergunning voor bepaalde tijd in te trekken;

      e. ambtshalve een verblijfsvergunning voor bepaalde tijd te verlenen dan wel de geldigheidsduur ervan te verlengen.

      2 Onze Minister verleent de houder van een geldige machtiging tot voorlopig verblijf binnen twee weken nadat deze
      zich overeenkomstig [artikel 54, eerste lid, onder e][ref1], heeft aangemeld, ambtshalve een verblijfsvergunning
      voor bepaalde tijd onder dezelfde beperking als die waaronder de machtiging tot voorlopig verblijf is verleend.

      3 Een verblijfsvergunning voor bepaalde tijd wordt verleend onder beperkingen, verband houdende met het doel
      waarvoor het verblijf is toegestaan. Aan de vergunning kunnen voorschriften worden verbonden. Bij of krachtens
      algemene maatregel van bestuur kunnen regels worden gesteld over de ambtshalve verlening, wijziging en verlenging,
      de beperkingen en de voorschriften.

      4 De verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur worden regels gesteld over de geldigheidsduur van de verblijfsvergunning en de
      verlenging van de geldigheidsduur van de verblijfsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
