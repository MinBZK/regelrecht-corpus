  - number: 2b
    text: |-
      1 Het referentschap eindigt in ieder geval, indien:

      a. ten behoeve van het verblijf van de vreemdeling in Nederland een ander als referent optreedt;

      b. de verblijfsvergunning van de vreemdeling is gewijzigd;

      c. de vreemdeling in het bezit is gesteld van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20][ref1];

      d. de vreemdeling Nederlander wordt of krachtens enige wet als Nederlander moet worden behandeld;

      e. de referent aan Onze Minister overeenkomstig door Onze Minister gestelde regels naar waarheid mededeling heeft
      gedaan van de beëindiging van diens aan het referentschap ten grondslag liggende relatie tot de vreemdeling, dan
      wel van het definitieve vertrek van de vreemdeling uit Nederland;

      f. de vreemdeling is overleden.

      2 Onze Minister stelt de gewezen referent in kennis van de beëindiging van diens referentschap.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de beëindiging van het
      referentschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2b
    references:
