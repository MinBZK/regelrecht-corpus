  - number: '69'
    text: |-
      1 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een bezwaar- of beroepschrift vier weken.

      2 In afwijking van het eerste lid, bedraagt de beroepstermijn:

      a. één week, indien de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28:

      1° niet in behandeling is genomen op grond van artikel 30;

      2° niet-ontvankelijk is verklaard op grond van artikel 30a;

      3° is afgewezen als kennelijk ongegrond op grond van artikel 30b;

      4° buiten behandeling is gesteld op grond van artikel 30c, eerste lid, onderdeel b; of

      5° buiten behandeling is gesteld op grond van artikel 30c, eerste lid, onderdeel a, en het beroep zich richt tot
      het daarmee samenhangende terugkeerbesluit.

      b. twee weken, indien:

      1° de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 is ingewilligd op grond
      van artikel 29a;

      2° de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 is afgewezen als
      ongegrond op grond van artikel 31; of

      3° de verblijfsvergunning asiel als bedoeld in artikel 28 is ingetrokken op grond van artikel 32.

      3 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref2] is het instellen van beroep als bedoeld in
      artikel 96 tegen een besluit als bedoeld in [artikel 93][ref3] niet aan enige termijn gebonden. De termijn voor het
      instellen van het hoger beroep, bedoeld in [artikel 95][ref4], bedraagt één week.

      4 In afwijking van het eerste lid bedraagt de beroepstermijn één week, indien een overdrachtsbesluit is genomen op
      grond van [artikel 62b][ref5].

      5 In afwijking van het eerste lid, bedraagt de termijn voor het instellen van hoger beroep:

      a. twee weken, in de gevallen bedoeld in het tweede lid, onderdeel a; of

      b. vier weken, in de gevallen bedoeld in het tweede lid, onderdeel b.

      6 Het verzoek om een voorlopige voorziening, bedoeld in artikel 68, vierde lid, van de Procedureverordening, wordt
      ingediend binnen een week na de bekendmaking van het besluit tot afwijzing van de asielaanvraag of het besluit tot
      intrekking van de verblijfsvergunning asiel, bedoeld in de artikelen 29 of 29a, in de gevallen, bedoeld in artikel
      68, derde lid, van de Procedureverordening.

      7 Het verzoek om een voorlopige voorziening om de uitvoering van het overdrachtsbesluit op te schorten, bedoeld
      in artikel 43, derde lid, van de Asiel- en migratiebeheerverordening, wordt gelijktijdig ingediend met het
      beroepschrift tegen een overdrachtsbesluit als bedoeld in artikel 44a, of artikel 62b. Overeenkomstig artikel 43,
      derde lid, van de Asiel- en migratiebeheerverordening wordt de uitvoering van een overdrachtsbesluit als bedoeld
      in artikel 44a of 62b niet opgeschort indien de vreemdeling geen verzoek om een voorlopige voorziening heeft
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel67
