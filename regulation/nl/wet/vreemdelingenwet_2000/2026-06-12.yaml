  - number: 17a
    text: |-
      1 Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      wordt niet afgewezen met toepassing van [artikel 16, eerste lid, onderdeel j][ref2], indien het betreft:

      a. de vreemdeling die direct voorafgaand aan de aanvraag rechtmatig verblijf heeft gehad op grond van
      [artikel 8, onder j][ref3];

      b. de vreemdeling die in aanmerking komt voor verblijf onder een beperking als bedoeld in [artikel 15][ref4];

      c. de vreemdeling die minderjarig en alleenstaand is;

      d. de vreemdeling die als slachtoffer of getuige-aangever als bedoeld in [artikel 17, eerste lid, onder d][ref5],
      direct voorafgaand aan de aanvraag verblijf heeft gehad op grond van [artikel 8, onder a][ref6], en in aanmerking
      komt voor verblijf onder een andere beperking.

      2 Bij algemene maatregel van bestuur kunnen andere categorieën worden aangewezen waarin de aanvraag, bedoeld in het
      eerste lid, niet wordt afgewezen, op grond dat de toepassing van [artikel 16, eerste lid, onder j][ref7], van een
      onevenredige hardheid zou kunnen getuigen.


