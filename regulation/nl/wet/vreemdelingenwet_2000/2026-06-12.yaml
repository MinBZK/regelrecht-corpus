  - number: '101'
    text: |-
      1 Bij verhindering of ontstentenis van de toegevoegde raadsman wordt zo nodig aan de vreemdeling onverwijld een
      andere raadsman toegevoegd.

      2 Op verzoek van de toegevoegde raadsman of van de vreemdeling kan een andere raadsman worden toegevoegd.

      3 Toevoeging van een andere raadsman geschiedt door het bureau bedoeld in [artikel 100, tweede of derde lid][ref1].

      4 Blijkt van de verhindering of ontstentenis van de raadsman pas tijdens het gehoor ingevolge de artikelen 94, 96
      en 96a, dan geeft de voorzitter van de kamer last tot toevoeging van een andere raadsman aan het bureau bedoeld in
      [artikel 100, tweede of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel100
