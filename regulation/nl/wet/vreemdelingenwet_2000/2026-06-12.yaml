        artikel: 4:5
  - number: 24a
    text: |-
      1 Gegevens en bescheiden worden niet verkregen van de vreemdeling of diens referent, voor zover:

      a. Onze Minister die gegevens of bescheiden kan verkrijgen uit bij regeling van Onze Minister aan te wijzen
      administraties, tenzij hierdoor een goede uitvoering van de wet wordt belet, of

      b. de aanvraag is ingediend door de erkende referent, en deze omtrent die gegevens en bescheiden eigen verklaringen
      heeft overgelegd.

      2 De eigen verklaringen, bedoeld in het eerste lid, onder b, worden volledig en naar waarheid opgesteld.

      3 De aanvrager verstrekt Onze Minister op diens verzoek en al dan niet in persoon alsnog de gegevens en
      bescheiden, die van belang zijn voor de beoordeling van de aanvraag. De aanvrager van een gecombineerde
      vergunning verstrekt Onze Minister de gegevens en bescheiden op basis waarvan kan worden beoordeeld of aan de
      [Wet arbeid vreemdelingen][ref1] is voldaan.

      4 Bij regeling van Onze Minister worden regels gesteld omtrent de gegevens en bescheiden waarop het eerste lid,
      onder a, van toepassing is, en kunnen regels worden gesteld omtrent:

      a. de administraties of delen daarvan waarvoor het eerste lid, onder a, tijdelijk niet van toepassing is;

      b. de eigen verklaringen, bedoeld in het eerste lid, onder b;

      c. de toepassing van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: '25'
    text: |-
      1 Binnen 90 dagen wordt een beschikking gegeven op de aanvraag tot:

      a. het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];

      b. het verlengen van de geldigheidsduur ervan;

      c. het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref2];

      d. het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref3].

      2 De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie, nodig is.

      3 Onze Minister stelt de vreemdeling in kennis van de verlenging.

      4 Indien de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14][ref4] is ingediend door een langdurig ingezetene uit een andere lidstaat van de Europese Unie of
      diens gezinslid, wordt de beschikking in afwijking van het eerste lid gegeven binnen vier maanden, welke termijn
      in afwijking van het tweede lid in bijzondere gevallen verband houdende met de complexiteit van de aanvraag,
      voor ten hoogste drie maanden kan worden verlengd. Indien de langdurig ingezetene of het gezinslid krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref5] is uitgenodigd de aanvraag aan te vullen, wordt de
      beschikking gegeven binnen zeven maanden.

      5 In afwijking van het eerste en tweede lid wordt de beschikking op een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14][ref6] onder een beperking verband houdend met verblijf als houder
      van de Europese blauwe kaart of overplaatsing binnen een onderneming bekend gemaakt binnen 90 dagen en kan die
      termijn niet worden verlengd.

      6 In afwijking van het eerste en tweede lid wordt de beschikking op een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14][ref7] onder een beperking verband houdend met wetenschappelijk
      onderzoek, studie, lerend werken of uitwisseling in het kader van Europees vrijwilligerswerk bekendgemaakt binnen
      60 dagen en kan die termijn niet worden verlengd.


