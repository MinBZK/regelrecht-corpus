  - number: '22'
    text: |-
      1 De verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20][ref1], kan worden ingetrokken indien:

      a. de houder daarvan zijn hoofdverblijf buiten Nederland heeft gevestigd;

      b. de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de aanvraag tot het verlenen, wijzigen of verlengen zouden hebben geleid;

      c. de houder daarvan bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf
      waartegen een gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem terzake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref2], is opgelegd; of

      d. de vreemdeling een gevaar vormt voor de nationale veiligheid.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gronden, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
