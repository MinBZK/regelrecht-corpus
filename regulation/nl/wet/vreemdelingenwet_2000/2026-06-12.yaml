  - number: '56'
    text: |-
      1 Overeenkomstig bij algemene maatregel van bestuur te geven regels kan, indien het belang van de openbare orde of
      de nationale veiligheid zulks vordert, dan wel om doeltreffend te voorkomen dat de vreemdeling onderduikt wanneer
      er een onderduikrisico bestaat, door Onze Minister de vrijheid van beweging worden beperkt van de vreemdeling die:

      a. geen rechtmatig verblijf heeft;

      b. rechtmatig verblijf heeft op grond van [artikel 8, met uitzondering van de onderdelen b, d en e][ref1].

      2 Toepassing van het eerste lid blijft achterwege wanneer en wordt beëindigd zodra de vreemdeling te kennen geeft
      Nederland te willen verlaten en hiertoe voor hem ook gelegenheid bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
