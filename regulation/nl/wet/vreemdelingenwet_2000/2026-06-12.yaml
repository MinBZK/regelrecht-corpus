    text: >-
      Onze Minister kan een besluit als bedoeld in artikel 24, eerste lid, onder a, van de SIS-verordening grenscontroles
      nemen, indien de in het tweede lid van artikel 24 van die verordening genoemde situaties zich voordoen.
