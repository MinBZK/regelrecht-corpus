  - number: '17'
    text: |-
      1 Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      wordt niet afgewezen wegens het ontbreken van een geldige machtiging tot voorlopig verblijf, indien het betreft:

      a. de vreemdeling die de nationaliteit bezit van één der door bij regeling van Onze Minister in overeenstemming met
      Onze Minister van Buitenlandse Zaken aan te wijzen landen;

      b. de gemeenschapsonderdaan, voorzover niet reeds vrijgesteld op grond van een aanwijzing als bedoeld onder a;

      c. de vreemdeling voor wie het gelet op diens gezondheidstoestand niet verantwoord is om te reizen;

      d. de vreemdeling die slachtoffer of getuige-aangever is van mensenhandel;

      e. de vreemdeling die onmiddellijk voorafgaande aan de aanvraag in het bezit was van een verblijfsvergunning asiel
      als bedoeld in artikel 28;

      f. de vreemdeling die tijdig een aanvraag heeft ingediend tot wijziging van een verblijfsvergunning;

      g. de vreemdeling die behoort tot een bij algemene maatregel van bestuur aangewezen categorie;

      h. een langdurig ingezetene uit een andere EU-lidstaat, dan wel diens echtgenoot of minderjarig kind ingeval het
      gezin reeds was gevormd in die andere lidstaat.

      2 De voordracht voor een krachtens het eerste lid, onder g, vast te stellen algemene maatregel van bestuur wordt
      niet gedaan dan nadat een ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden
      om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze
      Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
