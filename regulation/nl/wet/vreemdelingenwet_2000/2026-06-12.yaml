        hoofdstuk: '9'
  - number: 6a
    text: |-
      1 Onze Minister kan de maatregel, bedoeld in [artikel 6, eerste en tweede lid][ref1], opleggen of voortzetten
      met het oog op de overdracht aan een verantwoordelijke lidstaat, met inachtneming van artikel 44 van de Asiel-
      en migratiebeheerverordening.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
  - number: '7'
    text: >-
      Indien de vreemdeling aan wie de toegang is geweigerd, op grond van de Schengengrenscode, enig wettelijk
      voorschrift dan wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie zijn vrijheid is
      ontnomen, blijft de toegang geweigerd.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel7
  - number: '8'
    text: |-
      De vreemdeling heeft in Nederland uitsluitend rechtmatig verblijf:

      a. op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];

      b. op grond van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref2], of een EU-
      verblijfsvergunning voor langdurig ingezetenen als bedoeld in [artikel 45a][ref3] indien op het aan de vreemdeling
      verschafte document, bedoeld in [artikel 9][ref4], geen aantekening als bedoeld in [artikel 45c, eerste lid][ref5],
      is geplaatst;

      c. op grond van een verblijfsvergunning asiel als bedoeld in artikel 28;

      d. op grond van een EU-verblijfsvergunning voor langdurig ingezetenen als bedoeld in [artikel 45a][ref6]
      indien op het aan de vreemdeling verschafte document, bedoeld in [artikel 9][ref7], de aantekening, bedoeld in
      [artikel 45c, eerste lid][ref8], is geplaatst;

      e. als gemeenschapsonderdaan zolang deze onderdaan verblijf houdt op grond van een regeling krachtens het [Verdrag
      betreffende de werking van de Europese Unie](onbekend) dan wel de Overeenkomst betreffende de Europese Economische
      Ruimte;

      f. in afwachting van de beslissing op een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in:

      1° artikel 14, terwijl bij of krachtens deze wet dan wel op grond van een rechterlijke beslissing uitzetting van de
      aanvrager achterwege dient te blijven totdat op de aanvraag is beslist, of

      2° artikel 28, terwijl de vreemdeling overeenkomstig artikel 10, eerste lid, van de Procedureverordening het recht
      heeft om op het grondgebied van Nederland te verblijven totdat op de aanvraag is beslist, tenzij artikel 10, derde
      of vierde lid, van de Procedureverordening van toepassing is;

      g. in afwachting van de beslissing op een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de
      artikelen 20 en 45a, of tot het verlengen van de geldigheidsduur van de verblijfsvergunning, bedoeld in artikel 14,
      of een wijziging ervan, terwijl bij of krachtens deze wet of op grond van een rechterlijke beslissing uitzetting
      van de aanvrager achterwege dient te blijven totdat op de aanvraag is beslist;

      h. in afwachting van:

      1° de beslissing op een bezwaarschrift of een beroepschrift dat geen betrekking heeft op de beslissing op een
      aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28, terwijl bij of krachtens
      deze wet of op grond van een rechterlijke beslissing uitzetting van de aanvrager achterwege dient te blijven totdat
      op het bezwaarschrift of het beroepschrift is beslist; of

      2° de beslissing op een bezwaarschrift of beroepschrift, terwijl overeenkomstig artikel 68, tweede of vierde lid,
      van de Procedureverordening sprake is van een recht om op het grondgebied van Nederland te blijven dan wel op grond
      van een rechterlijke beslissing uitzetting of overdracht van de aanvrager achterwege dient te blijven totdat op het
      bezwaarschrift of het beroepschrift is beslist;

      i. gedurende de vrije termijn, bedoeld in [artikel 12][ref9], zolang het verblijf van de vreemdeling bij of
      krachtens [artikel 12][ref10] is toegestaan;

      j. indien tegen de uitzetting beletselen bestaan als bedoeld in [artikel 64][ref11];

      k. gedurende de periode waarin de vreemdeling door Onze Minister in de gelegenheid wordt gesteld aangifte te doen
      van overtreding van [artikel 273f van het Wetboek van Strafrecht][ref12];

      l. indien de vreemdeling verblijfsrecht ontleent aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;

      m. indien de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in [artikel 28][ref13] niet in
      behandeling is genomen op grond van [artikel 30][ref14] terwijl hij in afwachting is van de feitelijke overdracht
      naar een verantwoordelijke lidstaat in de zin van de Asiel- en migratiebeheerverordening.


