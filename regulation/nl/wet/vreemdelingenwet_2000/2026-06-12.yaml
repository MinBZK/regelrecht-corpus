  - number: 16a
    text: |-
      1 De aanvraag tot het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] kan
      worden afgewezen:

      a. op de gronden, bedoeld in [artikel 16, eerste lid, onderdelen b tot en met g en k][ref2]; of

      b. indien de vreemdeling niet heeft voldaan aan het bij of krachtens algemene maatregel van bestuur vast te stellen
      inburgeringsvereiste.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid, onderdeel a.

      3 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, onderdeel b, worden in ieder
      geval regels gesteld omtrent de inhoud van het inburgeringstraject en het te behalen niveau, alsmede omtrent de
      vrijstellingen en ontheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
