  - number: '50'
    text: >-
      1 De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen, zijn
      bevoegd, hetzij op grond van feiten en omstandigheden die, naar objectieve maatstaven gemeten, een redelijk
      vermoeden van illegaal verblijf opleveren hetzij ter bestrijding van illegaal verblijf na grensoverschrijding,
      personen staande te houden ter vaststelling van hun identiteit, nationaliteit en verblijfsrechtelijke positie.
      Degene die stelt Nederlander te zijn, maar dat niet kan aantonen, kan worden onderworpen aan de dwangmiddelen als
      bedoeld in het tweede en vijfde lid. Bij algemene maatregel van bestuur worden de documenten aangewezen waarover
      een vreemdeling moet beschikken ter vaststelling van zijn identiteit, nationaliteit en verblijfsrechtelijke
      positie.


      2 Indien de identiteit van de staande gehouden persoon niet onmiddellijk kan worden vastgesteld, of indien dit
      noodzakelijk is voor de toepassing van artikel 7 van de Screeningsverordening, mag hij worden overgebracht naar
      een plaats bestemd voor verhoor of een plaats bestemd voor screening. Hij wordt aldaar niet langer dan gedurende
      zes uren opgehouden, met dien verstande, dat de tijd tussen middernacht en negen uur voormiddags niet wordt
      meegerekend.


      3 Indien de identiteit van de staande gehouden persoon onmiddellijk kan worden vastgesteld en indien blijkt
      dat deze persoon geen rechtmatig verblijf geniet, dan wel niet onmiddellijk blijkt dat hij rechtmatig verblijf
      heeft, of indien dit noodzakelijk is voor de toepassing van artikel 7 van de Screeningsverordening, mag hij
      worden overgebracht naar een plaats bestemd voor verhoor of een plaats bestemd voor screening. Hij wordt aldaar
      niet langer dan gedurende zes uren opgehouden, met dien verstande, dat de tijd tussen middernacht en negen uur
      voormiddags niet wordt meegerekend.


      4 Indien nog grond bestaat voor het vermoeden dat de opgehouden persoon geen rechtmatig verblijf heeft, kan de
      in het tweede en derde lid bepaalde termijn door de Commandant der Koninklijke marechaussee respectievelijk door
      de korpschef in het belang van het onderzoek met ten hoogste acht en veertig uren worden verlengd. Indien artikel
      7 van de Screeningsverordening van toepassing is, geldt in afwijking van het tweede en derde lid, overeenkomstig
      artikel 8, vierde lid, van de Screeningsverordening, dat hij niet langer wordt opgehouden dan 72 uur op de plaats
      bestemd voor verhoor of een plaats bestemd voor screening.


      5 De in het eerste lid bedoelde ambtenaren zijn bevoegd de opgehouden persoon aan diens kleding of lichaam te
      onderzoeken, alsmede zaken van deze persoon te doorzoeken.


      6 Bij algemene maatregel van bestuur worden nadere regelen gegeven omtrent de toepassing van de voorgaande leden
      van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel50
  - number: 50a
    text: |-
      1 De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op
      vreemdelingen, zijn bevoegd een vreemdeling die rechtmatig verblijf heeft als bedoeld in
      [artikel 8, aanhef en onder f tot en met h en m][ref1] staande te houden, over te brengen naar een plaats
      bestemd voor verhoor en aldaar op te houden, indien dit nodig is voor de voorbereiding van een besluit omtrent
      inbewaringstelling van de vreemdeling op grond van [artikel 59, eerste lid, aanhef en onder b][ref2], [59a][ref3]
      of [59b][ref4]. De ophouding duurt ten hoogste zes uren, met dien verstande dat de tijd tussen middernacht en negen
      uur voormiddags niet wordt meegerekend.

      2 De in het eerste lid bedoelde ambtenaren zijn bevoegd de opgehouden persoon aan diens kleding of lichaam te
      onderzoeken, alsmede zaken van deze persoon te doorzoeken.

      3 Bij algemene maatregel van bestuur worden nadere regelen gegeven omtrent de toepassing van de voorgaande leden
      van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
