    text: |-
      1 Indien zulks voor de uitzetting noodzakelijk is, kan Onze Minister in het geval, bedoeld in
      [artikel 57, eerste lid][ref1], de vreemdeling een ruimte of plaats aanwijzen, die is beveiligd tegen ongeoorloofd
      vertrek.

      2 De [artikelen 6, vierde lid][ref2], [57, tweede tot en met vijfde lid][ref3] en [59, derde lid][ref4], zijn van
      overeenkomstige toepassing.


