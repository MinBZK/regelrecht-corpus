        afdeling: '3'
  - number: 2i
    text: >-
      1 Indien het belang van de internationale betrekkingen naar het oordeel van Onze Minister van Buitenlandse Zaken
      betrokken is bij een besluit inzake verlening van een machtiging tot voorlopig verblijf beslist Onze Minister in
      overeenstemming met Onze Minister van Buitenlandse Zaken.


      2 Onze Minister kan aan het hoofd van de desbetreffende Nederlandse diplomatieke of consulaire vertegenwoordiging
      aanwijzingen geven over de uitvoering van de bij of krachtens dit hoofdstuk gestelde regels inzake de verlening van
      de machtiging tot voorlopig verblijf door de ambtenaren werkzaam op die vertegenwoordiging door tussenkomst van en
      voor zover het de buitenlandse betrekkingen kan raken in overeenstemming met Onze Minister van Buitenlandse Zaken.


      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2i
  - number: 2j
    text: |-
      Een ten behoeve van de toegang tot Nederland door Onze Minister verleend visum waarvan de geldigheidsduur niet is
      verstreken, dan wel een door een bevoegde autoriteit van een andere staat verleend visum, dat krachtens verdrag
      of bindend besluit van een volkenrechtelijke organisatie daaraan is gelijkgesteld, geldt als het ingevolge
      [artikel 3, eerste lid, onderdeel a][ref1], voor de toegang tot Nederland benodigde visum, onverminderd het
      overigens bij of krachtens dit hoofdstuk bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2j
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
  - number: 2k
    text: >-
      Onze Minister is bevoegd:


      a. de aanvraag tot het verlenen van een machtiging tot voorlopig verblijf dan wel terugkeervisum in te willigen, af
      te wijzen dan wel niet in behandeling te nemen;


      b. een machtiging tot voorlopig verblijf dan wel terugkeervisum te wijzigen, hetzij op aanvraag, hetzij ambtshalve
      wegens veranderde omstandigheden;


      c. een machtiging tot voorlopig verblijf dan wel terugkeervisum in te trekken of te annuleren.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2k
  - number: 2l
    text: |-
      1 Voor het behandelen, daaronder begrepen de toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1],
      van een aanvraag tot verlening of wijziging van een machtiging tot voorlopig verblijf dan wel terugkeervisum, is de
      vreemdeling Onze Minister een bij ministeriële regeling vast te stellen vergoeding verschuldigd.

      2 Het eerste lid is niet van toepassing indien op grond van de [Rijkswet op de consulaire tarieven][ref2] reeds een
      vergoeding is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013618
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2l
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
      - id: ref2
        bwb_id: BWBR0013618
  - number: 2m
    text: >-
      1 De machtiging tot voorlopig verblijf wordt verleend onder beperkingen, verband houdend met het doel waarvoor het
      verblijf wordt toegestaan. Aan de machtiging kunnen voorschriften worden verbonden. Deze voorschriften kunnen in
      ieder geval strekken tot het stellen van zekerheid.


      2 Onze Minister kan het terugkeervisum met het oog op de bescherming van de belangen waarop het bepaalde bij of
      krachtens deze wet betrekking heeft onder beperkingen verlenen en daaraan voorschriften verbinden.


      3 Onze Minister kan alsnog voorschriften aan een reeds verleende machtiging tot voorlopig verblijf of reeds
      verleend terugkeervisum verbinden, voorschriften die daaraan zijn verbonden wijzigen, alsnog beperkingen daaraan
      verbinden, beperkingen wijzigen, de geldigheidsduur inkorten dan wel de machtiging tot voorlopig verblijf of het
      terugkeervisum intrekken:


      a. op aanvraag;


      b. indien uit naderhand gebleken feiten en omstandigheden komt vast te staan dat verlening ervan onjuist was;


      c. indien feiten en omstandigheden zodanig zijn gewijzigd dat deze zich verzetten tegen de handhaving of
      ongewijzigde handhaving van het verleende; of


      d. indien de vreemdeling de op hem rustende verplichtingen krachtens deze wet niet naleeft.


      4 Indien de vreemdeling nog geen toegang heeft verkregen kan Onze Minister de machtiging tot voorlopig verblijf
      annuleren op de gronden, vermeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2m
  - number: 2n
    text: |-
      1 In afwijking van [artikel 4:5, eerste en vierde lid, van de Algemene wet bestuursrecht][ref1] kan Onze Minister
      een aanvraag om een machtiging tot voorlopig verblijf dan wel terugkeervisum buiten behandeling laten zonder de
      aanvrager in de gelegenheid te hebben gesteld de aanvraag aan te vullen indien:

      a. de door de vreemdeling ingediende aanvraag niet door de vreemdeling in persoon is ingediend;

      b. voor de aanvraag in voorkomend geval geen gebruik is gemaakt van een daartoe voorgeschreven formulier dat
      volledig is ingevuld en ondertekend;

      c. de aanvraag niet is gesteld in de Nederlandse, Franse of Engelse taal; of

      d. de ter afdoening van de aanvraag verschuldigde leges niet zijn betaald.

      2 De [artikelen 4:7][ref2] en [4:8 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2n
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:7
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 4:8
  - number: 2o
    text: |-
      Indien Onze Minister overeenkomstig de aanvraag besluit, kan hij in afwijking van de [artikelen 3:45][ref1]
      en [3:47 van de Algemene wet bestuursrecht][ref2] vermelding van de mogelijkheid om bezwaar te maken en van de
      motivering achterwege laten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel347
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2o
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:45
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:47
  - number: 2p
    text: >-
      1 Onze Minister kan een machtiging tot voorlopig verblijf verlenen aan de vreemdeling ten aanzien van wie is
      aangetoond dat hij voldoet aan de vereisten voor toegang en verlening van een verblijfsvergunning.


      2 Onze Minister kan in afwijking van het eerste lid een machtiging tot voorlopig verblijf verlenen indien daarmee
      een wezenlijk Nederlands belang is gediend of klemmende redenen van humanitaire aard daartoe nopen dan wel het
      belang van de internationale betrekkingen de verlening van een machtiging tot voorlopig verblijf vordert.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2p
  - number: 2q
    text: |-
      1 Onze Minister kan een machtiging tot voorlopig verblijf weigeren indien ten aanzien van de vreemdeling niet is
      aangetoond dat deze voldoet aan de voorwaarden, bedoeld in [artikel 2p, eerste lid][ref1], onverminderd het tweede
      lid van dat artikel.

      2 Onze Minister kan een machtiging tot voorlopig verblijf voorts weigeren indien het belang van de internationale
      betrekkingen zich tegen verlening van de machtiging tot voorlopig verblijf verzet of de vreemdeling niet voldoet
      aan het overigens bij of krachtens dit hoofdstuk bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2p
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2q
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2p
        hoofdstuk: 1a
        paragraaf: '1'
        afdeling: '2'
  - number: 2r
    text: |-
      1 Indien Onze Minister besluit tot verlening van een machtiging tot voorlopig verblijf stelt hij de aanvrager
      daarvan schriftelijk in kennis. Een machtiging tot voorlopig verblijf kan tot uiterlijk drie maanden na de
      dagtekening van die kennisgeving worden afgegeven. In geval de machtiging tot voorlopig verblijf niet kan worden
      afgegeven in het land van herkomst of bestendig verblijf, op grond dat de Nederlandse vertegenwoordiging is
      gesloten of zich daar niet of niet langer een Nederlandse vertegenwoordiging bevindt, kan Onze Minister de termijn,
      bedoeld in de tweede volzin, eenmaal met ten hoogste drie maanden verlengen.

      2 De geldigheidsduur van een machtiging tot voorlopig verblijf bedraagt ten hoogste 90 dagen vanaf de datum
      van afgifte, met dien verstande dat een machtiging tot voorlopig verblijf meermalen kan worden benut voor het
      verkrijgen van toegang tot Nederland. De geldigheid van een machtiging tot voorlopig verblijf vervalt in elk
      geval met ingang van het tijdstip waarop ten behoeve van de vreemdeling een verblijfsvergunning als bedoeld in
      [artikel 14][ref1] ambtshalve is verleend. De geldigheidsduur van een machtiging tot voorlopig verblijf kan niet
      worden verlengd.

      3 De geldigheidsduur van een machtiging tot voorlopig verblijf kan de geldigheidsduur van het document
      voor grensoverschrijding van de vreemdeling niet overschrijden, met dien verstande dat het document voor
      grensoverschrijding na verloop van de machtiging tot voorlopig verblijf nog tenminste drie maanden geldig moet
      zijn. Onze Minister kan in bijzondere gevallen ontheffing verlenen van het bepaalde in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2r
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 2s
    text: |-
      1 De aanvraag omtrent de machtiging tot voorlopig verblijf wordt ingediend:

      a. bij de Nederlandse diplomatieke of consulaire vertegenwoordiging in het land van herkomst of van bestendig
      verblijf dan wel, bij gebreke daarvan, het dichtstbijzijnde land waar wel een vertegenwoordiging is gevestigd,
      dan wel bij het Kabinet van de Gouverneur van de Nederlandse Antillen of het Kabinet van de Gouverneur van Aruba
      aldaar, door de vreemdeling, of

      b. bij Onze Minister door de referent, dan wel in bij of krachtens algemene maatregel van bestuur bepaalde gevallen
      door de erkende referent van de vreemdeling.

      2 In afwijking van [artikel 2:1, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] en in afwijking van
      het eerste lid, wordt de aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde gevallen ingediend
      door de vreemdeling of zijn wettelijk vertegenwoordiger in persoon.

      3 De machtiging tot voorlopig verblijf wordt bij de vertegenwoordiging dan wel het Kabinet, bedoeld in het eerste
      lid, aan de vreemdeling in persoon afgegeven.

      4 Onze Minister kan in overeenstemming met Onze Minister van Buitenlandse Zaken vrijstelling dan wel ontheffing
      verlenen van de verplichtingen, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel21
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2s
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:1
  - number: 2t
    text: >-
      1 Gegevens en bescheiden worden niet verkregen van de vreemdeling of diens referent, voor zover:


      a. Onze Minister die gegevens of bescheiden kan verkrijgen uit bij regeling van Onze Minister aan te wijzen
      administraties, tenzij hierdoor een goede uitvoering van de wet wordt belet, of


      b. de aanvraag is ingediend door de erkende referent, en deze omtrent die gegevens en bescheiden eigen verklaringen
      heeft overgelegd.


      2 De eigen verklaringen, bedoeld in het eerste lid, onder b, worden volledig en naar waarheid opgesteld.


      3 De aanvrager verstrekt Onze Minister op diens verzoek en al dan niet in persoon alsnog de gegevens en bescheiden,
      die van belang zijn voor de beoordeling van de aanvraag.


      4 Bij regeling van Onze Minister worden regels gesteld omtrent de gegevens en bescheiden waarop het eerste lid,
      onder a, van toepassing is, en kunnen regels worden gesteld omtrent:


      a. de administraties of delen daarvan waarvoor het eerste lid, onder a, tijdelijk niet van toepassing is;


      b. de eigen verklaringen, bedoeld in het eerste lid, onder b;


      c. de toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2t
  - number: 2u
    text: |-
      1 Onze Minister beslist binnen 90 dagen na ontvangst van een aanvraag om verlening of wijziging van een machtiging
      tot voorlopig verblijf. Onze Minister kan deze termijn verlengen met ten hoogste drie maanden.

      2 In afwijking van het eerste lid maakt Onze Minister de beslissing op een aanvraag om verlening van een machtiging
      tot voorlopig verblijf onder een beperking verband houdend met verblijf als houder van de Europese blauwe kaart of
      overplaatsing binnen een onderneming bekend binnen 90 dagen en kan die termijn niet worden verlengd.

      3 In afwijking van het eerste lid maakt Onze Minister de beslissing op een aanvraag om verlening van een machtiging
      tot voorlopig verblijf onder een beperking verband houdend met wetenschappelijk onderzoek, studie, lerend werken,
      of uitwisseling in het kader van Europees vrijwilligerswerk bekend binnen 60 dagen en kan die termijn niet worden
      verlengd.

      4 In afwijking van het eerste lid maakt Onze Minister de beslissing op een aanvraag om verlening van een machtiging
      tot voorlopig verblijf voor verblijf als gezinslid van een vreemdeling aan wie een verblijfsvergunning asiel,
      bedoeld in [artikel 28][ref1], is verleend, zo spoedig mogelijk, maar uiterlijk binnen negen maanden na indiening
      van de aanvraag bekend. Onze Minister kan deze termijn verlengen in geval van bijzondere omstandigheden die verband
      houden met het complexe karakter van de behandeling van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2u
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 2v
    text: >-
      Onze Minister brengt de machtiging tot voorlopig verblijf aan in het document voor grensoverschrijding of op een
      blad waarop een visum kan worden aangebracht als bedoeld in artikel 1 van Verordening (EG) nr. 333/2002 van de Raad
      van de Europese Unie van 18 februari 2002 (PbEG 2002, L53/4).
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2v
  - number: 2w
    text: |-
      1 Een terugkeervisum kan worden verleend voor de toegang tot Nederland van een vreemdeling die
      Nederland tijdelijk zal verlaten gedurende het tijdvak dat hij rechtmatig verblijf heeft op grond van
      [artikel 8, aanhef en onder a tot en met h of l][ref1].

      2 Geen terugkeervisum wordt verleend ten behoeve van de terugkeer uit het land van herkomst van de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, aanhef en onder c en d][ref2].

      3 Geen terugkeervisum wordt verleend ten behoeve van de terugkeer uit het land van herkomst van de vreemdeling
      die een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 heeft gedaan en
      rechtmatig verblijf heeft op grond van [artikel 8, aanhef en onder f, g of h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2w
