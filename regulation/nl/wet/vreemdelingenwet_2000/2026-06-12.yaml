  - number: 45a
    text: |-
      1 Onze Minister is bevoegd:

      a. de aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig ingezetenen in te willigen, af te
      wijzen dan wel niet in behandeling te nemen;

      b. een EU-verblijfsvergunning voor langdurig ingezetenen in te trekken.

      2 De status van langdurig ingezetene wordt verworven door de verlening van een EU-verblijfsvergunning voor
      langdurig ingezetenen. De status van langdurig ingezetene is permanent, onverminderd [artikel 45d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel45a
    references:
