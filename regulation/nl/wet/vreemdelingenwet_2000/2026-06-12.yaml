  - number: '10'
    text: >-
      1 De vreemdeling die geen rechtmatig verblijf heeft, kan geen aanspraak maken op toekenning van verstrekkingen,
      voorzieningen en uitkeringen bij wege van een beschikking van een bestuursorgaan. De eerste volzin is van
      overeenkomstige toepassing op de bij de wet of algemene maatregel van bestuur aangewezen ontheffingen of
      vergunningen.


      2 Van het eerste lid kan worden afgeweken indien de aanspraak betrekking heeft op het onderwijs, de verlening
      van medisch noodzakelijke zorg, de voorkoming van inbreuken op de volksgezondheid, of de rechtsbijstand aan de
      vreemdeling.


      3 De toekenning van aanspraken geeft geen recht op rechtmatig verblijf.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel10
  - number: '11'
    text: |-
      1 De aanspraken van de vreemdeling die rechtmatig verblijf heeft zijn in overeenstemming met de aard van het
      verblijf. Tenzij bij of krachtens het wettelijk voorschrift waarop de aanspraak is gegrond anders is bepaald, is
      daarbij het tweede lid van toepassing.

      2 De vreemdeling, bedoeld in het eerste lid, kan aanspraken maken op voorzieningen, verstrekkingen en uitkeringen,
      indien hij:

      a. rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder a, tot en met e en l][ref1];

      b. rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder f, g, h][ref2], en een aanspraak wordt toegekend
      bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref3], dan wel bij of krachtens een ander wettelijk
      voorschrift, waarin aanspraken van deze vreemdelingen zijn neergelegd;

      c. rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder i tot en met k][ref4], voor de aanspraken die
      uitdrukkelijk aan deze vreemdelingen zijn toegekend.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de bij wet of algemene maatregel van bestuur
      aangewezen ontheffingen of vergunningen.

      4 Het COA, bedoeld in artikel 2 van de Wet Centraal Orgaan opvang asielzoekers, is bevoegd de vreemdeling, bedoeld
      in het eerste lid, de verplichting op te leggen deel te nemen aan cursussen gericht op het verwerven van mondelinge
      en schriftelijke vaardigheden in de Nederlandse taal en kennis van de Nederlandse maatschappij als bedoeld in
      artikel 7, eerste lid, van de Wet inburgering 2021.

      5 Indien het COA een verplichting als bedoeld in het vierde lid heeft opgelegd en de vreemdeling deze verplichting
      niet of onvoldoende nakomt, is het COA bevoegd materiële voorzieningen te beperken of in te trekken.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven over:

      a. de aard en omvang van de op te leggen maatregelen;

      b. de voorwaarden die aan inperking of intrekking van de voorzieningen kunnen worden verbonden;

      c. de duur van de maatregelen;

      d. de gevolgen voor de vreemdeling, indien deze alsnog voldoet aan de opgelegde verplichtingen.


