  - number: 45c
    text: |-
      1 Op het document, bedoeld in artikel 9, van de vreemdeling aan wie een EU-verblijfsvergunning voor langdurig
      ingezetenen is verleend, wordt de aantekening «Internationale bescherming op [datum] verleend door Nederland»
      geplaatst, indien de vreemdeling direct voorafgaande aan de aanvraag in het bezit was van een verblijfsvergunning
      asiel als bedoeld in artikel 28 die is verleend op grond van de artikelen 29 of 29a, tenzij de grond voor die
      verlening is vervallen.

      2 Indien de EU-verblijfsvergunning voor langdurig ingezetenen wordt verleend aan een onderdaan van een derde
      land die reeds een verblijfsdocument bezit dat door een andere lidstaat is afgegeven en dat de aantekening
      «Internationale bescherming op [datum] verleend door [lidstaat]» bevat, wordt op het document, bedoeld in
      [artikel 9][ref1], dezelfde aantekening geplaatst, tenzij de internationale bescherming bij een definitief besluit
      van die andere lidstaat is ingetrokken.

      3 Indien uit een verzoek van de autoriteiten van een andere lidstaat van de Europese Unie aan Onze Minister blijkt
      dat de internationale bescherming van de houder van een document als bedoeld in [artikel 9][ref2], met daarop
      de aantekening als bedoeld in het eerste lid, door deze lidstaat is overgenomen alvorens deze lidstaat een EU-
      verblijfsvergunning voor langdurig ingezetenen heeft afgegeven, wordt de aantekening op het document, bedoeld in
      artikel 9, dienovereenkomstig gewijzigd.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het
      eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
