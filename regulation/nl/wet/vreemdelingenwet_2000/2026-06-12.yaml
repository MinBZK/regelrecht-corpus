  - number: 83.0a
    text: >-
      Indien beroep is ingesteld tegen een besluit dat een gelijke strekking heeft als een besluit dat eerder ten aanzien
      van de indiener van het beroepschrift is genomen, zal dit besluit, ook bij het ontbreken van nieuw gebleken feiten
      of veranderde omstandigheden of een relevante wijziging van het recht, worden beoordeeld als ware het een eerste
      afwijzing indien hier wegens bijzondere, op de individuele zaak betrekking hebbende, feiten en omstandigheden, de
      noodzaak toe bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel83.0a
  - number: 83a
    text: >-
      Overeenkomstig artikel 67, derde lid, van de Procedureverordening omvat de toetsing van de rechtbank een volledig
      en ex nunc onderzoek naar zowel de feitelijke als de juridische gronden, met inbegrip van, indien van toepassing,
      een onderzoek naar de behoefte aan internationale bescherming.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel83a
  - number: 83b
    text: |-
      1 De rechtbank doet binnen vier weken na het instellen van het beroep uitspraak, indien:

      a. de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28:

      1° niet in behandeling is genomen op grond van artikel 30;

      2° niet-ontvankelijk is verklaard op grond van artikel 30a;

      3° is afgewezen als kennelijk ongegrond op grond van artikel 30b;

      4° buiten behandeling is gesteld op grond van artikel 30c; of

      b. het beroep zich richt tegen een overdrachtsbesluit als bedoeld in artikel 62b.

      2 In afwijking van het eerste lid, doet de rechtbank uitspraak binnen twaalf weken, dan wel zestien weken indien
      artikel 67, elfde lid van de Asiel- en migratiebeheerverordening van toepassing is, gerekend vanaf de datum van
      registratie van de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28, indien de
      aanvraag is behandeld in de asielgrensprocedure. Deze termijn kan niet worden verlengd.

      3 In afwijking van het eerste lid, doet de rechtbank uitspraak binnen drieëntwintig weken na het instellen van het
      beroep, indien:

      a. de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 is ingewilligd op grond
      van artikel 29a;

      b. de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 is afgewezen als
      ongegrond op grond van artikel 31; of

      c. de verblijfsvergunning asiel als bedoeld in artikel 28 is ingetrokken op grond van artikel 32.

      4 In de gevallen, bedoeld in het eerste en derde lid, is
      [artikel 8:52, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel852
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:52
  - number: 83ba
    text: >-
      1 In afwijking van artikel 8:84 van de Algemene wet bestuursrecht doet de voorzieningenrechter overeenkomstig
      artikel 43, derde lid, van de Asiel- en migratiebeheerverordening uitspraak binnen een maand na ontvangst van
      het verzoek om voorlopige voorziening dat strekt tot opschorting van de uitvoering van een overdrachtsbesluit als
      bedoeld in de artikelen 44a of 62b.


      2 Indien de voorzieningenrechter de voorlopige voorziening heeft toegewezen, tracht de rechtbank, in afwijking van
      artikel 83b, eerste lid, onderdeel a, subonderdeel 1°, en onderdeel b, overeenkomstig artikel 43, derde lid, van de
      Asiel- en migratiebeheerverordening binnen een maand uitspraak te doen in de hoofdzaak.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel83ba
  - number: 83bb
    text: >-
      De opname van het persoonlijk onderhoud of een schriftelijke weergave daarvan, bedoeld in artikel 14 van de
      Procedureverordening, wordt als bewijs toegelaten in de beroepsprocedure bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel83bb
  - number: 83bc
    text: >-
      Indien de rechtbank toepassing geeft aan artikel 8:72, vierde lid, onderdeel b, van de Algemene wet bestuursrecht,
      stelt de rechtbank de termijn vast op:


      a. ten hoogste zes weken, in de gevallen, bedoeld in artikel 35, eerste lid, van de Procedureverordening;


      b. ten hoogste tien weken, in de gevallen, bedoeld in artikel 35, derde lid, van de Procedureverordening; of


      c. ten hoogste vijf maanden, in de gevallen, bedoeld in artikel 35, vierde lid, van de Procedureverordening.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel83bc
  - number: 83c
    text: |-
      1 Op het hoger beroep zijn de [titels 8.1 tot en met 8.3 van de Algemene wet bestuursrecht][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 8:1 tot en met 8:5][ref2], [8:6, eerste lid][ref3],
      [8:7 tot en met 8:9][ref4], [8:10a, eerste tot en met derde lid][ref5], [8:13][ref6], [8:41, tweede lid][ref7],
      [8:54, tweede lid][ref8], [8:55][ref9], en [8:74][ref10], voor zover in deze wet niet anders is bepaald.

      2 [Artikel 8:108, eerste en derde lid, van de Algemene wet bestuursrecht is][ref11] niet van toepassing.

      3 Deze afdeling, met uitzondering van [artikel 86][ref12], is van overeenkomstige toepassing op het incidenteel
      hoger beroep. Voor zover nodig in afwijking van [artikel 8:110 van de Algemene wet bestuursrecht][ref13] zijn de
      termijnen voor het instellen van incidenteel hoger beroep als bedoeld in het tweede lid van dat artikel en voor
      het naar voren brengen van de zienswijze, bedoeld in het derde lid van dat artikel, gelijk aan de termijn voor het
      instellen van hoger beroep.

      4 De [artikelen 8:110 tot en met 8:112 van de Algemene wet bestuursrecht][ref14] zijn niet van toepassing op een
      hoger beroep:

      a. als bedoeld in [artikel 95, eerste lid][ref15];

      b. inzake een terugkeerbesluit of een inreisverbod, tenzij dat besluit of verbod deel uitmaakt van of wordt
      opgelegd tegelijk met het besluit op een aanvraag om een verblijfsvergunning als bedoeld in artikel 14, 20 of 28,
      dan wel ingevolge [artikel 6:19 van de Algemene wet bestuursrecht][ref16] wordt betrokken bij het hoger beroep
      tegen een dergelijk besluit.


