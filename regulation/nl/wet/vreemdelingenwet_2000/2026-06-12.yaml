  - number: 96a
    text: >-
      1 Indien het beroep, bedoeld in artikel 94, of het beroep tegen het voortduren van de vrijheidsontnemende
      maatregel, bedoeld in artikel 96, ongegrond is verklaard, stelt Onze Minister de rechtbank telkens uiterlijk
      achtenzestig dagen na dagtekening van de uitspraak van de rechtbank in kennis van de voortduring van de maatregel.
      Zodra de rechtbank de kennisgeving heeft ontvangen wordt de vreemdeling geacht beroep te hebben ingesteld tegen
      het voortduren van de vrijheidsontnemende maatregel. Het beroep strekt tevens tot een verzoek om toekenning van
      schadevergoeding.


      2 Het eerste lid is van overeenkomstige toepassing indien het beroep, bedoeld in artikel 94, of het beroep tegen
      het voortduren van de vrijheidsontnemende maatregel, bedoeld in artikel 96, niet ongegrond is verklaard en de
      vrijheidsontnemende maatregel desondanks voortduurt.


      3 In afwijking van het eerste lid, wordt een kennisgeving over de voortduring van de maatregel niet verzonden
      wanneer de vreemdeling zelf binnen achtenzestig dagen na dagtekening van de uitspraak van de rechtbank beroep heeft
      ingesteld tegen het voortduren van de vrijheidsontnemende maatregel. Indien de vreemdeling dit beroep intrekt,
      wordt die intrekking beschouwd als een kennisgeving over het voortduren van een vrijheidsontnemende maatregel, als
      bedoeld in het eerste lid.


      4 Indien de vreemdelingenbewaring op grond van artikel 59, zesde lid, of artikel 59b, derde lid, wordt verlengd,
      stelt Onze Minister, in afwijking van het eerste lid, gelijktijdig met het besluit om de maatregel te verlengen
      de rechtbank in kennis van het voortduren van de maatregel ten aanzien van de periode tot de ommekomst van de in
      artikel 59, vijfde lid, of artikel 59b, tweede lid, bedoelde termijn waarover nog geen rechterlijke toets heeft
      plaatsgevonden.


      5 De rechtbank sluit het vooronderzoek binnen een week na ontvangst van de kennisgeving. In afwijking van artikel
      8:57 van de Algemene wet bestuursrecht kan de rechtbank ook zonder toestemming van partijen bepalen dat het
      onderzoek ter zitting achterwege blijft.


      6 Indien de rechtbank een zitting bepaalt, dan vindt deze plaats uiterlijk een week na sluiting van het
      vooronderzoek. De rechtbank roept de vreemdeling op om in persoon dan wel in persoon of bij raadsman en Onze
      Minister om bij gemachtigde te verschijnen teneinde te worden gehoord. In afwijking van artikel 8:42, tweede lid,
      van de Algemene wet bestuursrecht kan de in dat artikel bedoelde termijn niet worden verlengd.


      7 Artikel 94, zesde lid, artikel 95, derde lid, en artikel 96, tweede lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel96a
  - number: '97'
    text: >-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de wijze van
      horen van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel97
  - number: '98'
    text: |-
      1 In afwijking van [artikel 8:24 van de Algemene wet bestuursrecht][ref1] kan de vreemdeling zich bij de gehoren
      ingevolge de artikelen 94, 96 en 96a uitsluitend door één of meer van zijn raadslieden doen bijstaan.

      2 De raadsman wordt bij het horen in de gelegenheid gesteld de nodige opmerkingen te maken.

      3 Als raadsman wordt slechts toegelaten een in Nederland ingeschreven advocaat alsmede de persoon
      bedoeld in [artikel 16b][ref2] dan wel [16h van de Advocatenwet][ref3] indien deze samenwerkt met een
      in Nederland ingeschreven advocaat, overeenkomstig het bepaalde in [artikel 16e][ref4] respectievelijk
      [16j van de Advocatenwet][ref5]. Onder raadsman wordt ook verstaan de rechtshulpverlener die in dienst is van de
      Stichting Rechtsbijstand Asiel die terzake van de vrijheidsontnemende maatregelen relevante opleiding en ervaring
      bezit, en

      a. aan wie door een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6] de graad Bachelor op het gebied van het recht en
      tevens de graad Master op het gebied van het recht is verleend, of

      b. die aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7] het doctoraat in de rechtsgeleerdheid of het recht
      om de titel meester te voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel824
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel16e
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel16j
      [ref6]: https://wetten.overheid.nl/BWBR0005682
      [ref7]: https://wetten.overheid.nl/BWBR0005682
