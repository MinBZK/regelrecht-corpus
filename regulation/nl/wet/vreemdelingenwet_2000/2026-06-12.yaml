  - number: '9'
    text: |-
      1 Onze Minister verschaft aan de vreemdeling, die rechtmatig verblijf heeft op grond van
      [artikel 8, onder a, b en d, f tot en met h en j tot en met m][ref1], en aan de vreemdeling die rechtmatig
      verblijf heeft op grond van [artikel 8, onder e][ref2], en gemeenschapsonderdaan is als bedoeld in
      [artikel 1, sub 2°, 4° en 6°][ref3], een document of schriftelijke verklaring, waaruit het rechtmatig verblijf
      blijkt.

      2 Onze Minister verschaft aan de vreemdeling die rechtmatig verblijf heeft op grond van artikel 8, onder c, de
      verblijfstitel waaruit het rechtmatig verblijf blijkt, bedoeld in:

      a. artikel 24 van de Kwalificatieverordening, indien de vreemdeling de vluchtelingenstatus of
      subsidiairebeschermingsstatus heeft;

      b. artikel 23, eerste lid, van de Kwalificatieverordening, indien de vreemdeling verblijf heeft als gezinslid van
      een vreemdeling die de vluchtelingenstatus of subsidiairebeschermingsstatus heeft, als bedoeld in artikel 29b;

      c. artikel 13, tweede lid, van de Gezinsherenigingsrichtlijn, indien de vreemdeling verblijf heeft als bedoeld in
      artikel 29c, als gezinslid van een vreemdeling die de vluchtelingenstatus heeft; of

      d. het eerste lid, indien de vreemdeling verblijf heeft als bedoeld in artikel 29d, als gezinslid van een
      vreemdeling die de subsidiairebeschermingsstatus heeft.

      3 De geldigheidsduur van de verblijfstitel, bedoeld in het tweede lid, onderdeel a, vangt aan op de datum
      van verlening van de verblijfsvergunning asiel, bedoeld in artikel 44, tweede lid, en heeft een initiële
      geldigheidsduur van drie jaar. Wanneer de geldigheidsduur verstrijkt, kan deze met drie jaar worden verlengd.

      4 De geldigheidsduur van de verblijfstitel, bedoeld in het tweede lid, onderdelen b, c en d, vangt aan
      op de datum van de verlening van de verblijfsvergunning asiel, bedoeld in artikel 44, tweede lid, en
      verstrijkt op dezelfde datum als waarop de verblijfstitel van de vreemdeling die de vluchtelingenstatus of
      de subsidiairebeschermingsstatus heeft, verstrijkt, en kan worden verlengd zolang de geldigheidsduur van de
      verblijfstitel die is afgegeven aan de vreemdeling die de vluchtelingenstatus of subsidiairebeschermingsstatus
      heeft, niet is verstreken.

      5 Onze Minister verschaft aan de vreemdeling die rechtmatig verblijf heeft op grond van [artikel 8, onder e][ref4],
      en gemeenschapsonderdaan is als bedoeld in [artikel 1, sub 1°, 3° en 5°][ref5] een document, waaruit het
      rechtmatig verblijf blijkt, indien de vreemdeling het duurzaam verblijfsrecht heeft verkregen als bedoeld in
      artikel 16 van [Richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor burgers van de Unie
      en hun familieleden, tot wijziging van [Verordening (EEG) 1612/68](31968R1612) en tot intrekking van [Richtlijnen
      64/221/EEG](31964L0221), [68/360/EEG](31968L0360), [72/194/EEG](31972L0194), [73/148/EEG](31973L0148), [75/34/
      EEG](31975L0034), [75/35/EEG](31975L0035), [90/364/EEG](31990L0364), [90/365/EEG](31990L0365) en [93/96/EEG]
      (31993L0096) (PbEU L 158).

      6 Onze Minister verschaft desgevraagd een dergelijk document of schriftelijke verklaring aan de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, onder i][ref6].

      7 Bij de aanvraag van een beschikking anders dan op grond van deze wet legt de vreemdeling desgevraagd een
      kopie van het document of de schriftelijke verklaring over, dat wordt aangemerkt als een bescheid als bedoeld in
      [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref7].

      8 Onze Minister kan regels stellen over:

      a. de bescheiden, bedoeld in het eerste, zesde en zevende lid, en kan daarbij modellen vaststellen voor de
      documenten en de schriftelijke verklaring;

      b. de geldigheidsduur van de verblijfstitel, bedoeld in het tweede lid;

      c. de gevallen waarin de verblijfstitel, bedoeld in het tweede lid, in afwijking van het derde en vierde lid, een
      kortere geldigheidsduur dan drie jaren heeft;

      d. de administratieve formaliteiten voor verlenging van de geldigheidsduur van de verblijfstitel, bedoeld in het
      tweede lid, ter uitvoering van:

      1° artikel 24, vierde lid, van de Kwalificatieverordening met betrekking tot onderdeel a;

      2° artikel 23, tweede lid, van de Kwalificatieverordening met betrekking tot onderdeel b;

      3° artikel 13, tweede lid, van de Gezinsherenigingsrichtlijn met betrekking tot onderdeel c;

      e. de administratieve formaliteiten voor verlenging van de geldigheidsduur van de verblijfstitel, bedoeld in het
      tweede lid, onderdeel d; of

      f. de vergoeding, bedoeld in artikel 24, derde lid, van de Kwalificatieverordening.

      9 Het verstrijken van de geldigheidsduur van de verblijfstitel heeft niet tot gevolg dat de verblijfsvergunning
      asiel vervalt indien deze op dat moment niet is ingetrokken.


