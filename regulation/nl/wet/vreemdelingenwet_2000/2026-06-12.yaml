      1 Deze afdeling is van toepassing indien de [afdelingen 3][ref1] en [5][ref2] van dit hoofdstuk niet van
      toepassing zijn.

      2 Een beschikking omtrent de afgifte van een visum, waaronder begrepen een machtiging tot voorlopig verblijf, wordt
      voor de toepassing van dit hoofdstuk gelijkgesteld met een beschikking omtrent een verblijfsvergunning regulier
      gegeven krachtens deze wet.

      3 Voor de toepassing van deze afdeling wordt met een beschikking tevens gelijkgesteld een handeling van
      een bestuursorgaan ten aanzien van een vreemdeling als zodanig, waaronder begrepen het niet verlenen van de
      verblijfsvergunning overeenkomstig [artikel 14, tweede lid][ref3]

      4 Voor de toepassing van deze afdeling wordt met een beschikking eveneens gelijk gesteld een kennisgeving als
      bedoeld in [artikel 62a, eerste lid][ref4] of [artikel 62b, eerste lid][ref5].


