  - number: '78'
    text: >-
      Indien een verzoek om een voorlopige voorziening is gedaan teneinde uitzetting te voorkomen voordat is beslist
      op het bezwaar of het administratief beroep, dat is gericht tegen de beschikking tot afwijzing van de aanvraag of
      intrekking van de verblijfsvergunning, beslist de voorzieningenrechter van de rechtbank zoveel mogelijk tevens over
      dat bezwaar of administratief beroep.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel78
  - number: '79'
    text: |-
      1 Deze afdeling is slechts van toepassing indien beroep wordt ingesteld tegen:

      a. een besluit omtrent een verblijfsvergunning als bedoeld in artikel 28;

      b. een besluit omtrent een EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling die in het bezit
      is van een verblijfsvergunning als bedoeld in [artikel 28][ref1];

      c. een besluit omtrent de intrekking van een EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling
      op wiens document, bedoeld in [artikel 9][ref2], de aantekening, bedoeld in [artikel 45c, eerste lid][ref3], is
      geplaatst dan wel omtrent het wijzigen of schrappen van die aantekening;

      d. een besluit omtrent tijdelijke bescherming of toepassing van [artikel 45, vierde lid][ref4], indien de
      vreemdeling in de gelegenheid is gesteld zijn zienswijze over het voornemen van dat besluit te geven;

      e. een besluit om niet ambtshalve een verblijfsvergunning als bedoeld in artikel 14 te verlenen dan wel een besluit
      om de uitzetting of overdracht niet op grond van artikel 64 achterwege te laten dat tegelijkertijd met een besluit
      omtrent een verblijfsvergunning als bedoeld in artikel 28 is genomen, mits de vreemdeling bij de voorbereiding van
      laatstgenoemd besluit in de gelegenheid is gesteld omstandigheden aan te voeren die daarvoor relevant kunnen zijn.

      2 Deze afdeling is van overeenkomstige toepassing indien beroep wordt ingesteld tegen een besluit als bedoeld in de
      [artikelen 43][ref5] en [45, vierde lid][ref6].

      3 Deze afdeling is van overeenkomstige toepassing indien in de voornemenprocedure, bedoeld in artikel 41, de
      vreemdeling tevens in de gelegenheid is gesteld om zijn zienswijze te geven over het voornemen niet ambtshalve een
      verblijfsvergunning als bedoeld in [artikel 14][ref7] te verlenen dan wel over het voornemen om de uitzetting of
      overdracht niet op grond van [artikel 64][ref8] achterwege te laten.


