  - number: 14a
    text: |-
      Onze Minister besluit niet over de verlening, verlenging of intrekking van een
      gecombineerde vergunning dan nadat hij advies heeft gevraagd aan de instantie, bedoeld in
      [artikel 5, tweede lid, van de Wet arbeid vreemdelingen][ref1]. Deze instantie adviseert over de vraag of
      is voldaan aan de [Wet arbeid vreemdelingen][ref2] als bedoeld in [artikel 16, eerste lid, onder f][ref3],
      [artikel 18, eerste lid, onder g][ref4] en [artikel 19][ref5]. Onze Minister is niet verplicht om advies te
      vragen indien de verblijfsvergunning wordt geweigerd of ingetrokken op grond van een andere afwijzings- of
      intrekkingsgrond, bedoeld in [artikel 16][ref6], [18][ref7] of [19][ref8].


