  - number: '102'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gegeven omtrent de beloning van toegevoegde raadslieden, met
      inbegrip van advocaten die overeenkomstig [artikel 101][ref1] als raadsman optreden, en de vergoeding van hun
      onkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel101
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel102
