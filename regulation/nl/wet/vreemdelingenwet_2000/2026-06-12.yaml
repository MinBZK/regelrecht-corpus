  - number: '94'
    text: |-
      1 Onverwijld na de bekendmaking van een besluit tot oplegging van een vrijheidsontnemende maatregel als bedoeld
      in de [artikelen 6][ref1], [6a][ref2], [58][ref3], [59][ref4], [59a][ref5] en [59b][ref6], stelt Onze Minister de
      rechtbank hiervan in kennis. Zodra de rechtbank de kennisgeving heeft ontvangen wordt de vreemdeling geacht beroep
      te hebben ingesteld tegen het besluit tot oplegging van een vrijheidsontnemende maatregel. Het beroep strekt tevens
      tot een verzoek om toekenning van schadevergoeding.

      2 Indien aan de vreemdeling, bedoeld in het eerste lid, een besluit tot weigering van toegang tot Nederland is
      uitgereikt, wordt het beroep, bedoeld in het eerste lid, geacht mede een beroep tegen dit besluit te omvatten.

      3 Het tweede lid is niet van toepassing indien tussen de uitreiking van het besluit tot weigering van toegang tot
      Nederland en het opleggen van de vrijheidsontnemende maatregel meer dan achtentwintig dagen zijn verstreken.

      4 De rechtbank bepaalt onmiddellijk het tijdstip van het onderzoek ter zitting. De rechtbank roept de vreemdeling
      op om in persoon dan wel in persoon of bij raadsman en Onze Minister om bij gemachtigde te verschijnen teneinde te
      worden gehoord. In afwijking van [artikel 8:42, tweede lid, van de Algemene wet bestuursrecht][ref7] kan de in dat
      artikel bedoelde termijn niet worden verlengd.

      5 De rechtbank doet mondeling of schriftelijk uitspraak. De termijn waarbinnen de rechtbank uitspraak doet bedraagt
      ten hoogste vijftien dagen, dan wel ten hoogste eenentwintig dagen in uitzonderlijke omstandigheden en vangt aan op
      de dag van de oplegging van de vrijheidsontnemende maatregel, bedoeld in het eerste lid. In afwijking van artikel
      8:66, tweede lid, van de Algemene wet bestuursrecht kan de in dat artikel bedoelde termijn niet worden verlengd.
      Indien de rechtbank op het beroep tegen een besluit tot oplegging van een vrijheidsontnemende maatregel als bedoeld
      in de artikelen 6, derde lid, 6a, 59a of 59b geen uitspraak heeft gedaan binnen eenentwintig dagen na de dag van de
      oplegging van de vrijheidsontnemende maatregel wordt de maatregel onmiddellijk opgeheven.

      6 Indien de rechtbank bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel in
      strijd is met deze wet dan wel bij afweging van alle daarbij betrokken belangen niet gerechtvaardigd is, verklaart
      zij het beroep gegrond. In dat geval beveelt de rechtbank de opheffing van de maatregel of een wijziging van de
      wijze van tenuitvoerlegging daarvan.

      7 Het eerste, vijfde en zesde lid zijn van overeenkomstige toepassing op een besluit tot verlenging van een
      vrijheidsontnemende maatregel als bedoeld in [artikel 59, zesde lid][ref8], of [artikel 59b, derde lid][ref9]. In
      afwijking van [artikel 8:57 van de Algemene wet bestuursrecht][ref10] kan de rechtbank ook zonder toestemming van
      partijen bepalen dat het onderzoek ter zitting achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
