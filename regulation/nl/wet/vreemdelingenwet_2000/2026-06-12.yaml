  - number: '4'
    text: |-
      1 De vervoerder door wiens tussenkomst de vreemdeling aan een buitengrens of binnen het grondgebied van Nederland
      wordt gebracht, neemt de nodige maatregelen en houdt het toezicht dat redelijkerwijs van hem kan worden gevorderd
      om te voorkomen dat door de vreemdeling niet wordt voldaan aan artikel 6, eerste lid, onder a of b, van de
      Schengengrenscode of aan [artikel 3, eerste lid, onder a][ref1], van deze wet.

      2 De vervoerder kan worden verplicht om een afschrift te nemen van het op de vreemdeling betrekking hebbende
      document voor grensoverschrijding en dit ter hand te stellen aan de ambtenaren belast met de grensbewaking.

      3 De vervoerder, bedoeld in het eerste lid, kan ten behoeve van de grensbewaking en het tegengaan van illegale
      immigratie worden verplicht passagiersgegevens of gegevens omtrent de bemanning te verzamelen en te verstrekken aan
      de ambtenaren belast met de grensbewaking.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      tot en met het derde lid. Daarbij kan ter uitvoering van een verdrag of bindende EU-rechtshandeling het gebruik van
      de elektronische weg worden voorgeschreven.

      5 Het eerste tot en met het derde lid zijn ook van toepassing op iedere vervoerder die zich buiten Nederland
      schuldig maakt aan schending van de in die leden bedoelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: >-
      1 De vreemdeling aan wie toegang is geweigerd, dient Nederland onmiddellijk te verlaten, met inachtneming van de
      aanwijzingen welke hem daartoe door een ambtenaar belast met de grensbewaking, zijn gegeven.


      2 Indien de vreemdeling, bedoeld in het eerste lid, Nederland is binnengekomen aan boord van een vaartuig of
      luchtvaartuig in gebruik bij een vervoersonderneming, dient hij Nederland onmiddellijk te verlaten met dat vervoer
      of een hem door een ambtenaar belast met de grensbewaking aangewezen vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel5
  - number: '6'
    text: |-
      1 De vreemdeling aan wie toegang is geweigerd, onderscheidenlijk de vreemdeling op wie artikel 5 van de
      Screeningsverordening van toepassing is, kan worden verplicht zich op te houden in een door de ambtenaar belast met
      grensbewaking aangewezen ruimte of plaats, met dien verstande dat indien de Screeningsverordening van toepassing
      is, dit overeenkomstig het bepaalde in de artikelen 5, 6 en 8, eerste en derde lid, van de Screeningsverordening
      plaatsvindt.

      2 Een ruimte of plaats, bedoeld in het eerste lid, kan worden beveiligd tegen ongeoorloofd vertrek.

      3 De vreemdeling die aan de grens te kennen heeft gegeven een aanvraag tot het verlenen van een verblijfsvergunning
      asiel als bedoeld in artikel 28 te willen indienen, met inbegrip van de vreemdeling op wie artikel 5, tweede
      lid, van de Screeningsverordening van toepassing is, kan, zolang hij wordt aangemerkt als verzoeker in de zin van
      artikel 2, aanhef en onder 2, van de Opvangrichtlijn, eveneens worden verplicht zich op te houden in een door de
      ambtenaar belast met grensbewaking aangewezen ruimte of plaats die kan worden beveiligd tegen ongeoorloofd vertrek,
      in het kader van een procedure om een beslissing te nemen over de toegang, onderscheidenlijk in het kader van de
      toepassing van de screeningsprocedure overeenkomstig het bepaalde in de artikelen 5, 6 en 8, eerste en derde lid,
      van de Screeningsverordening. Artikel 59b, vijfde lid, is van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het voor
      de beveiligde ruimte of plaats, bedoeld in het eerste lid, geldende regime, waaronder begrepen de nodige
      beheersmaatregelen. [Hoofdstuk 9 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.

      5 Een krachtens het vierde lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat, nadat vier weken na de overlegging zijn verstreken,
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van beide kamers van de Staten-Generaal
      besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.

      6 Onze Minister kan de maatregel, bedoeld in het eerste en tweede lid, opleggen aan de vreemdeling aan wie toegang
      is geweigerd en op wie voorafgaand aan de toegangsweigering het derde lid van toepassing was, indien het belang van
      de openbare orde of de nationale veiligheid zulks vordert. De maatregel wordt uitsluitend opgelegd indien zicht op
      uitzetting binnen redelijke termijn bestaat, voor een zo kort mogelijke periode. Artikel 59, vijfde en zesde lid,
      is van overeenkomstige toepassing.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over toepassing van het derde en het
      zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel6
    references:
