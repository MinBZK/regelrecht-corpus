  - number: '54'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan ten aanzien van vreemdelingen worden voorzien in een
      verplichting tot:

      a. het kennis geven van verandering van woon- of verblijfplaats binnen Nederland en van vertrek naar het
      buitenland;

      b. het al dan niet in persoon verstrekken van gegevens welke van belang kunnen zijn voor de toepassing van de bij
      of krachtens deze wet gestelde regels;

      c. het verlenen van medewerking aan het vastleggen van gegevens met het oog op identificatie;

      d. het verlenen van medewerking aan een medisch onderzoek naar een ziekte aangewezen bij of krachtens de
      [Wet publieke gezondheid][ref1], ter bescherming van de volksgezondheid of in het kader van de beoordeling van een
      aanvraag om een verblijfsvergunning;

      e. aanmelding binnen een bepaalde termijn na binnenkomst in Nederland;

      f. periodieke aanmelding;

      g. het inleveren van het document of schriftelijke verklaring als bedoeld in [artikel 9][ref2] waaruit het
      rechtmatig verblijf blijkt;

      h. het stellen van zekerheid;

      i. het overleggen van documenten, anders dan bedoeld onder g.

      2 Bij of krachtens algemene maatregel van bestuur wordt ten aanzien van referenten en gewezen referenten voorzien
      in verplichtingen tot:

      a. het al dan niet in persoon verstrekken van gegevens en bescheiden welke van belang kunnen zijn voor de
      toepassing van de bij of krachtens deze wet gestelde regels, en

      b. het administreren en beheren van gegevens en bescheiden als bedoeld onder a.

      3 In gevallen waarin Onze Minister zulks in het belang van de openbare orde of de nationale veiligheid nodig
      oordeelt, kan hij aan een vreemdeling een individuele verplichting tot periodieke aanmelding bij de korpschef
      opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
