  - number: '59'
    text: |-
      1 Indien het belang van de openbare orde of de nationale veiligheid zulks vordert kan, met het oog op de
      uitzetting, door Onze Minister in vreemdelingenbewaring worden gesteld de vreemdeling die:

      a. geen rechtmatig verblijf heeft;

      b. die rechtmatig verblijf heeft op grond van [artikel 8, onder f, g en h][ref1], niet zijnde een vreemdeling als
      bedoeld in [artikel 59a][ref2] of [59b][ref3].

      2 Indien de voor de terugkeer van de vreemdeling noodzakelijke bescheiden voorhanden zijn, dan wel binnen
      korte termijn voorhanden zullen zijn, wordt het belang van de openbare orde geacht de vreemdelingenbewaring
      van de vreemdeling te vorderen, tenzij de vreemdeling rechtmatig verblijf heeft gehad op grond van
      [artikel 8, onder a tot en met e, en l][ref4].

      3 Vreemdelingenbewaring van een vreemdeling blijft achterwege indien en wordt beëindigd zodra hij te kennen geeft
      Nederland te willen verlaten en hiertoe voor hem ook gelegenheid bestaat.

      4 Vreemdelingenbewaring krachtens het eerste lid, onder b, of het tweede lid duurt in geen geval langer dan vier
      weken.

      5 Onverminderd het vierde lid duurt de vreemdelingenbewaring krachtens het eerste lid niet langer dan zes maanden.

      6 In afwijking van het vijfde lid en onverminderd het vierde lid kan de vreemdelingenbewaring krachtens het eerste
      lid ten hoogste met nog eens twaalf maanden worden verlengd, indien de uitzetting, alle redelijke inspanningen ten
      spijt, wellicht meer tijd zal vergen, op grond dat de vreemdeling niet meewerkt aan zijn uitzetting of de daartoe
      benodigde documentatie uit derde landen nog ontbreekt.

      7 Het vijfde en zesde lid zijn van overeenkomstige toepassing op de vreemdeling aan wie de verplichting of
      maatregel, bedoeld in [artikel 6, eerste of tweede lid][ref5], dan wel [artikel 58][ref6] is opgelegd.

      8 De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      de in vreemdelingenbewaring gestelde persoon aan diens kleding of lichaam te onderzoeken, alsmede zaken van deze
      persoon te doorzoeken, voor zover dit noodzakelijk is voor het verkrijgen van informatie omtrent de identiteit,
      nationaliteit en de verblijfsrechtelijke positie van de betreffende vreemdeling.


