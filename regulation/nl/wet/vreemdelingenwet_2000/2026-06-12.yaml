  - number: '12'
    text: |-
      1 Het is aan de vreemdeling die bij binnenkomst heeft voldaan aan de verplichtingen waaraan een persoon bij
      grensoverschrijding is onderworpen, gedurende een bij algemene maatregel van bestuur te bepalen termijn toegestaan
      in Nederland te verblijven, zolang hij:

      a. de bij of krachtens deze wet gestelde regels in acht neemt;

      b. beschikt over voldoende middelen om te voorzien zowel in de kosten van zijn verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is;

      c. geen arbeid voor een werkgever verricht in strijd met de [Wet arbeid vreemdelingen][ref1];

      d. geen gevaar oplevert voor de openbare orde of de nationale veiligheid.

      2 De termijn, bedoeld in het eerste lid, wordt ten hoogste op 360 dagen bepaald. Voor bij algemene maatregel van
      bestuur te onderscheiden categorieën van vreemdelingen kunnen verschillende termijnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
