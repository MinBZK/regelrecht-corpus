  - number: '63'
    text: >-
      1 De vreemdeling die geen rechtmatig verblijf heeft en die niet binnen de bij deze wet gestelde termijn Nederland
      uit eigen beweging heeft verlaten, kan worden uitgezet.


      2 Onze Minister is bevoegd tot uitzetting.


      3 Indien de werking van de beschikking waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken is
      opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel63
  - number: 63a
    text: >-
      De vreemdeling tegen wie een overdrachtsbesluit is uitgevaardigd, kan overeenkomstig artikel 46, eerste lid, van de
      Asiel- en migratiebeheerverordening door Onze Minister worden overgedragen aan de verantwoordelijke lidstaat in de
      zin van de Asiel- en migratiebeheerverordening.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel63a
  - number: '64'
    text: >-
      Uitzetting blijft achterwege zolang het gelet op de gezondheidstoestand van de vreemdeling of die van een van zijn
      gezinsleden niet verantwoord is om te reizen.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel64
  - number: '65'
    text: >-
      1 De vreemdeling:


      a. die Nederland is binnengekomen aan boord van een vaartuig of luchtvaartuig in gebruik bij een
      vervoersonderneming en die Nederland onmiddellijk dient te verlaten, of


      b. die met het oog op zijn uitzetting is aangehouden binnen zes maanden nadat hij is binnengekomen aan boord van
      een vaartuig of luchtvaartuig in gebruik bij een vervoersonderneming, kan worden uitgezet door plaatsing aan boord
      van een vaartuig of luchtvaartuig in gebruik bij dezelfde vervoersonderneming.


      2 De vervoersonderneming vervoert op aanwijzing van een ambtenaar belast met de grensbewaking de vreemdeling,
      bedoeld in het eerste lid, om niet terug naar een plaats buiten Nederland en vindt daartoe zo nodig een ander
      middel voor de terugbrenging. Is zulks niet binnen redelijke tijd mogelijk, of, in het geval bedoeld in het
      eerste lid, onder b, niet binnen redelijke tijd na de aanhouding mogelijk, dan kunnen de kosten van uitzetting uit
      Nederland op die vervoersonderneming worden verhaald.


      3 Gezagvoerders van vaartuigen en luchtvaartuigen verlenen aan de uitzetting van de vreemdeling alle medewerking
      die de ambtenaar belast met de grensbewaking redelijkerwijs kan vorderen.


      4 Het eerste lid, onder b, is niet van toepassing op de vreemdeling die rechtmatig verblijf geniet tot een later
      tijdstip dan dat van vertrek van het vaartuig of luchtvaartuig aan boord waarvan hij is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel65
  - number: '66'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de toepassing van de
      [afdelingen 1][ref1] en [2][ref2] van dit hoofdstuk. Daarbij wordt in ieder geval voorzien in de mogelijkheid van
      verhaal van de kosten van uitzetting op de referent of de gewezen referent van de vreemdeling, op de vreemdeling
      zelf en, indien hij minderjarig is, op degenen die het wettelijk gezag over hem uitoefenen of uitoefenden.

      2 Het terzake van uitzetting verschuldigde bedrag kan worden ingevorderd bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
