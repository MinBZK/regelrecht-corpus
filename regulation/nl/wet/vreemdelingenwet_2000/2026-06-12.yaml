  - number: 109a
    text: |-
      De verplichtingen die voor Nederland voortvloeien uit de Terugkeerrichtlijn, gelden niet ten aanzien van
      vreemdelingen:

      a. aan wie de toegang is geweigerd overeenkomstig artikel 14 van de Schengengrenscode en die vervolgens geen
      rechtmatig verblijf als bedoeld in [artikel 8][ref1] hebben verkregen; of

      b. jegens wie een procedure van uitlevering als bedoeld in de [Uitleveringswet][ref2] loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002559
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel109a
