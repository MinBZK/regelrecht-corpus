  - number: 27a
    text: >-
      1 Overeenkomstig artikel 4, eerste en derde lid, van de Procedureverordening is Onze Minister als
      beslissingsautoriteit en bevoegde autoriteit belast met de uitoefening van de taken en bevoegdheden die aan
      die autoriteiten worden toegekend door de Procedureverordening, de Asiel- en migratiebeheerverordening en de
      Kwalificatieverordening.


      2 Overeenkomstig artikel 4, tweede lid, van de Procedureverordening zijn belast met de uitoefening van de daarin
      opgenomen taken en bevoegdheden:


      a. Onze Minister;


      b. Onze Minister van Justitie en Veiligheid;


      c. de korpschef;


      d. het Centraal Orgaan opvang asielzoekers;


      e. de ambtenaren bedoeld in de artikelen 46, eerste lid, en 47, eerste lid.


      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toekenning van taken
      en bevoegdheden uit de Procedureverordening, de Asiel- en migratiebeheerverordening en de Kwalificatieverordening.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel27a
  - number: '28'
    text: >-
      1 Onze Minister is bevoegd:


      a. de aanvraag tot het verlenen van een verblijfsvergunning asiel in te willigen, af te wijzen, niet in behandeling
      te nemen, niet-ontvankelijk te verklaren dan wel buiten behandeling te stellen;


      b. een verblijfsvergunning asiel in te trekken;


      c. ambtshalve een verblijfsvergunning asiel te verlenen aan:


      1° het gezinslid van een vreemdeling die de vluchtelingenstatus heeft, die voldoet aan de in artikel 29c gestelde
      voorwaarden en die houder is van een geldige machtiging tot voorlopig verblijf;


      2° het gezinslid van een vreemdeling die de subsidiairebeschermingsstatus heeft, die voldoet aan de in artikel 29d
      gestelde voorwaarden en die houder is van een geldige machtiging tot voorlopig verblijf; of


      3° de langdurig ingezetene, afkomstig uit een andere EU-lidstaat en in het bezit van een verblijfsvergunning als
      bedoeld in artikel 14, indien de verantwoordelijkheid voor de afgifte van het reisdocument bedoeld in artikel 2,
      eerste lid, onder d, van de Paspoortwet, aan de vreemdeling, is overgedragen aan Nederland op grond van de Europese
      Overeenkomst inzake de overdracht van verantwoordelijkheid met betrekking tot vluchtelingen van 16 oktober 1980
      (Trb. 1981, 239).


      2 De verblijfsvergunning die ambtshalve wordt verleend in de situatie, bedoeld in het eerste lid, onderdeel c,
      subonderdelen 1° en 2°, wordt verleend binnen twee weken nadat de houder van een geldige machtiging tot voorlopig
      verblijf zich overeenkomstig artikel 54, eerste lid, onderdeel e, heeft aangemeld.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel28
  - number: '29'
    text: >-
      1 Overeenkomstig artikel 39, tweede lid, van de Procedureverordening kan Onze Minister een verblijfsvergunning
      asiel als bedoeld in artikel 28 verlenen aan de vreemdeling die op grond van de hoofdstukken II en III,
      van de Kwalificatieverordening in aanmerking komt voor de vluchtelingenstatus, bedoeld in artikel 13 van de
      Kwalificatieverordening.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel29
  - number: 29a
    text: >-
      1 Overeenkomstig artikel 39, tweede lid, van de Procedureverordening kan Onze Minister een verblijfsvergunning
      asiel als bedoeld in artikel 28 aan de vreemdeling verlenen die op grond van de hoofdstukken II en V, van de
      Kwalificatieverordening in aanmerking komt voor de subsidiairebeschermingsstatus, bedoeld in artikel 18 van de
      Kwalificatieverordening.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel29a
  - number: 29b
    text: >-
      1 Onze Minister kan een verblijfsvergunning asiel als bedoeld in artikel 28 aan de vreemdeling verlenen die
      overeenkomstig artikel 23, eerste lid, van de Kwalificatieverordening in aanmerking komt voor verblijf als
      gezinslid van een vreemdeling die de vluchtelingenstatus of de subsidiairebeschermingsstatus heeft.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel.


      3 Dit artikel is van overeenkomstige toepassing op het verblijf van gezinsleden als bedoeld in artikel 9, zestiende
      lid, van de Hervestigingsverordening.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel29b
  - number: 29c
    text: >-
      1 Onze Minister kan krachtens artikel 13 van de Gezinsherenigingsrichtlijn een verblijfsvergunning asiel als
      bedoeld in artikel 28 verlenen aan de hierna te noemen gezinsleden van de vreemdeling die de vluchtelingenstatus
      heeft, indien deze op het tijdstip van binnenkomst van die vreemdeling behoorden tot diens gezin en zijn nagereisd
      binnen drie maanden nadat aan die vreemdeling de verblijfsvergunning asiel, bedoeld in artikel 28, is verleend,
      dan wel binnen die drie maanden door of ten behoeve van dat gezinslid een machtiging tot voorlopig verblijf is
      aangevraagd:


      a. de meerderjarige echtgenoot;


      b. het biologische of geadopteerde minderjarige kind;


      c. de ouders, indien die vreemdeling een alleenstaande minderjarige is;


      d. de minderjarige broer of zus, indien die vreemdeling een alleenstaande minderjarige is, die broer of zus
      gelijktijdig met een ouder, bedoeld in onderdeel c, de aanvraag heeft ingediend en ten laste komt van die ouder.


      2 De verblijfsvergunning asiel wordt niet geweigerd indien de overschrijding van de in het eerste lid bedoelde
      termijn op grond van bijzondere omstandigheden objectief verschoonbaar is.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel29c
  - number: 29d
    text: >-
      1 Onze Minister kan een verblijfsvergunning asiel als bedoeld in artikel 28 verlenen aan de gezinsleden, genoemd in
      artikel 29c, eerste lid, van de vreemdeling die de subsidiairebeschermingsstatus heeft, indien dat gezinslid op het
      tijdstip van binnenkomst van die vreemdeling tot diens gezin behoorde.


      2 De verblijfsvergunning asiel, bedoeld in het eerste lid, kan worden geweigerd, indien:


      a. nog geen twee jaar zijn verstreken sinds de verlening van de verblijfsvergunning asiel, bedoeld in artikel 29a,
      aan de vreemdeling, bedoeld in het eerste lid;


      b. de vreemdeling niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;


      c. de vreemdeling niet over huisvesting beschikt, waaronder mede wordt verstaan het verblijf op een
      doorstroomlocatie.


      3 Het tweede lid, onderdelen b en c, is niet van toepassing indien de vreemdeling een alleenstaande minderjarige
      is.


      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel.
      Daarbij wordt bepaald in welke gevallen een verblijfsvergunning asiel wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel29d
  - number: '30'
    text: >-
      1 Onze Minister neemt een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28,
      overeenkomstig artikel 39, eerste lid, onderdeel a, van de Procedureverordening, niet in behandeling wanneer op
      grond van de Asiel- en migratiebeheerverordening is vastgesteld dat een andere lidstaat verantwoordelijk is voor de
      behandeling van de aanvraag.


      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel30
  - number: 30a
    text: >-
      1 Onze Minister kan een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 niet-
      ontvankelijk verklaren in de gevallen, bedoeld in artikel 38, eerste lid, van de Procedureverordening en verklaart
      de aanvraag niet-ontvankelijk in de gevallen, bedoeld in artikel 38, tweede lid, van de Procedureverordening.


      2 Het besluit een aanvraag niet-ontvankelijk te verklaren, wordt voor de toepassing van het bepaalde bij of
      krachtens deze wet gelijkgesteld met een afwijzing.


      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel30a
  - number: 30b
    text: >-
      1 Onze Minister kan een ongegronde aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in
      artikel 28 overeenkomstig artikel 39, vierde lid, van de Procedureverordening afwijzen als kennelijk ongegrond,
      indien op het tijdstip van afronding van de behandeling een van de gevallen bedoeld in artikel 42, eerste en derde
      lid, van de Procedureverordening van toepassing is.


      2 Onze Minister kan een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28
      afwijzen als kennelijk ongegrond, indien reeds is vastgesteld dat de vreemdeling niet in aanmerking komt voor
      internationale bescherming op grond van de Kwalificatieverordening, overeenkomstig:


      a. artikel 40, vierde lid, van de Procedureverordening in de fase waarin de aanvraag expliciet wordt ingetrokken;
      of


      b. artikel 41, eerste en vijfde lid, van de Procedureverordening op het ogenblik waarop de aanvraag impliciet wordt
      ingetrokken.


      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel30b
  - number: 30c
    text: >-
      1 Onze Minister kan een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28
      buiten behandeling stellen als:


      a. expliciet ingetrokken overeenkomstig artikel 40 van de Procedureverordening; of


      b. impliciet ingetrokken overeenkomstig artikel 41 van de Procedureverordening.


      2 Het besluit een aanvraag buiten behandeling te stellen, wordt voor de toepassing van het bepaalde bij of
      krachtens deze wet gelijkgesteld met een afwijzing.


      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel30c
  - number: '31'
    text: >-
      1 Onze Minister kan een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 29,
      29a of 29b, overeenkomstig artikel 39, derde lid, van de Procedureverordening afwijzen als ongegrond, indien de
      aanvrager op grond van de Kwalificatieverordening niet in aanmerking komt voor:


      a. de vluchtelingenstatus, bedoeld in artikel 13 van de Kwalificatieverordening;


      b. de subsidiairebeschermingsstatus, bedoeld in artikel 18 van de Kwalificatieverordening; of


      c. verblijf als gezinslid, als bedoeld in artikel 23, eerste lid, van de Kwalificatieverordening.


      2 Onze Minister kan een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 29c of
      29d afwijzen, indien niet wordt voldaan aan de daarin gestelde voorwaarden.


      3 Onze Minister kan een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28
      afwijzen als ongegrond, indien reeds is vastgesteld dat de vreemdeling niet in aanmerking komt voor internationale
      bescherming op grond van de Kwalificatieverordening, overeenkomstig:


      a. artikel 40, vierde lid, van de Procedureverordening in de fase waarin de aanvraag expliciet wordt ingetrokken;
      of


      b. artikel 41, eerste en vijfde lid, van de Procedureverordening op het ogenblik waarop de aanvraag impliciet wordt
      ingetrokken.


      4 Een aanvraag van een gezinslid als bedoeld in artikel 29c, eerste lid, tot het verlenen van een
      verblijfsvergunning asiel als bedoeld in de artikelen 29c of 29d, kan worden afgewezen, indien gezinshereniging
      mogelijk is in een derde land waarmee de vreemdeling die de vluchtelingenstatus of de subsidiairebeschermingsstatus
      heeft of het desbetreffende gezinslid bijzondere banden heeft.


      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel31
  - number: '32'
    text: >-
      1 Onze Minister trekt de verblijfsvergunning asiel, bedoeld in artikel 29, in overeenkomstig de artikelen 65 en 66
      van de Procedureverordening op grond van artikel 14 van de Kwalificatieverordening.


      2 Onze Minister trekt de verblijfsvergunning asiel, bedoeld in artikel 29a, in overeenkomstig de artikelen 65 en 66
      van de Procedureverordening op grond van artikel 19 van de Kwalificatieverordening.


      3 Bij toepassing van het eerste, tweede of zesde lid, trekt Onze Minister gelijktijdig de verblijfsvergunning
      asiel, bedoeld in de artikelen 29b, 29c of 29d, in die is verleend aan het gezinslid van de vreemdeling wiens
      verblijfsvergunning asiel met toepassing van het eerste of tweede lid is ingetrokken of ten aanzien van wie
      toepassing is gegeven aan het zesde lid.


      4 Onze Minister kan de verblijfsvergunning asiel, bedoeld in artikel 29b, voorts intrekken in de gevallen bedoeld
      in artikel 23, derde tot en met vijfde lid, van de Kwalificatieverordening.


      5 Onze Minister kan de verblijfsvergunning asiel, bedoeld in de artikelen 29c en 29d voorts intrekken, indien:


      a. de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen zouden hebben geleid;


      b. de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;


      c. de gronden voor verlening, bedoeld in de artikelen 29c of 29d, zijn komen te vervallen;


      d. het gezinslid niet of niet langer een werkelijk huwelijks- of gezinsleven onderhoudt met de vreemdeling die
      internationale bescherming geniet en die houder is van de verblijfsvergunning asiel, bedoeld in de artikelen 29
      of 29a.


      6 Bij de afsluiting, bedoeld in artikel 66, zesde lid, van de Procedureverordening, vermeldt Onze Minister dat in
      het dossier van de vreemdeling en vermeldt hij daarbij de rechtsgrond voor die afsluiting.


      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel32
  - number: 32a
    text: >-
      Bij regeling van Onze Minister kunnen overeenkomstig artikel 64, eerste lid, van de Procedureverordening met het
      oog op de behandeling van de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28
      landen als veilig derde land of als veilig land van herkomst worden aangewezen, voor zover dat andere landen zijn
      dan die welke op het niveau van de Unie als zodanig zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel32a
  - number: '36'
    text: >-
      1 De aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 wordt, in afwijking
      van artikel 2:1, tweede lid, van de Algemene wet bestuursrecht, ingediend door de vreemdeling of zijn wettelijk
      vertegenwoordiger.


      2 Overeenkomstig artikel 19 van de Procedureverordening en artikel 21 van de Asiel- en migratiebeheerverordening
      worden bij regeling van Onze Minister regels gesteld over:


      a. de erkenning of toelating van juridisch adviseurs of andere counselors die de vreemdeling tijdens de behandeling
      van de aanvraag om een verblijfsvergunning asiel als bedoeld in artikel 28 kosteloze juridische counseling
      verstrekken, bijstaan of vertegenwoordigen;


      b. de accreditatie van niet-gouvernementele organisaties die deze vreemdeling juridische diensten of
      vertegenwoordiging bieden; en


      c. de procedurele regels voor de indiening en behandeling van verzoeken om kosteloze juridische counseling en
      wettelijke vertegenwoordiging, waaronder regels over het uitsluiten of beperken daarvan.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel36
  - number: '37'
    text: >-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van de Procedureverordening en de Asiel- en
      migratiebeheerverordening regels gesteld omtrent:


      a. de wijze van indiening en behandeling van een aanvraag;


      b. de procedure voor de behandeling van een aanvraag tot het verlenen van een verblijfsvergunning asiel als
      bedoeld in artikel 28, indien dat noodzakelijk is ter uitvoering van de Procedureverordening of de Asiel- en
      migratiebeheerverordening;


      c. de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede de bij
      of krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling of aan andere
      belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van beschikkingen ook kan
      geschieden door middel van het toezenden of uitreiken van een document en door het stellen van aantekeningen in een
      daarbij aan te wijzen document.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel37
  - number: '38'
    text: >-
      1 Indien de vreemdeling in de gelegenheid wordt gesteld zich omtrent de aanvraag tot het verlenen van een
      verblijfsvergunning of het verlengen van de geldigheidsduur ervan te doen horen, wordt de vreemdeling gehoord in
      een taal waaraan de vreemdeling de voorkeur geeft, tenzij er een andere taal kan worden gebruikt die hij begrijpt
      en waarin hij helder kan communiceren.


      2 Bij of direct na de indiening van de aanvraag tot het verlenen van een verblijfsvergunning wijst Onze Minister de
      vreemdeling erop dat hij elementen en bevindingen aannemelijk moet maken die hetzij op zichzelf, hetzij in verband
      met andere elementen en bevindingen, een rechtsgrond voor de verlening of verlenging van de vergunning vormen.
      Daarbij wordt hij erop gewezen dat hij daartoe verklaringen moet afleggen en alle bewijsmiddelen waarover hij
      beschikt of redelijkerwijs de beschikking kan krijgen moet overleggen.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel38
  - number: '39'
    text: >-
      De artikelen 4:7 en 4:8 van de Algemene wet bestuursrecht zijn niet van toepassing op de aanvraag tot het verlenen
      van een verblijfsvergunning asiel als bedoeld in artikel 28.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel39
  - number: '41'
    text: >-
      1 Indien Onze Minister voornemens is de verblijfsvergunning asiel, bedoeld in de artikelen 29 of 29a, in te
      trekken, wordt de vreemdeling hiervan overeenkomstig artikel 66, eerste lid, van de Procedureverordening onder
      opgave van redenen schriftelijk in kennis gesteld.


      2 Het eerste lid is van overeenkomstige toepassing indien Onze Minister voornemens is de verblijfsvergunning asiel,
      bedoeld in de artikelen 29b, 29c of 29d, in te trekken.


      3 De kennisgeving kan eveneens betrekking hebben op het voornemen om niet ambtshalve een verblijfsvergunning voor
      bepaalde tijd als bedoeld in artikel 14 te verlenen dan wel op het voornemen om de uitzetting of overdracht niet
      op grond van artikel 64 achterwege te laten. Het schriftelijke voornemen wordt aan de vreemdeling medegedeeld
      door uitreiking of toezending ervan. De op het voornemen tot intrekking betrekking hebbende stukken worden bij de
      schriftelijke mededeling gevoegd, voor zover de vreemdeling geen kennis kan hebben van de inhoud van deze stukken.


      4 De vreemdeling brengt zijn zienswijze in afwijking van artikel 4:9 van de Algemene wet bestuursrecht schriftelijk
      naar voren binnen de door Onze Minister bepaalde redelijke termijn.


      5 Indien Onze Minister, na ontvangst van de zienswijze van de vreemdeling, voornemens blijft de verblijfsvergunning
      asiel in te trekken, dan wordt de vreemdeling in de gelegenheid gesteld zich te doen horen.


      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de termijn, bedoeld in het vierde
      lid, alsmede de toepassing van de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel41
  - number: '43'
    text: >-
      Onze Minister kan, overeenkomstig artikel 35, zevende lid, van de Procedureverordening, het afronden van de
      behandelingsprocedure van een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28
      uitstellen wanneer redelijkerwijs niet kan worden verwacht dat het besluit op de aanvraag wordt genomen binnen de
      in artikel 35, vierde lid, van de Procedureverordening vastgestelde termijnen vanwege een onzekere situatie in het
      land van herkomst die naar verwachting tijdelijk is.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel43
  - number: 43a
    text: >-
      Onverminderd artikel 4:5 van de Algemene wet bestuursrecht worden de termijnen als bedoeld in artikel 35 van de
      Procedureverordening voor het geven van een beschikking op de aanvraag tot het verlenen van een verblijfsvergunning
      asiel als bedoeld in artikel 28 ten aanzien van vreemdelingen die tijdelijke bescherming genieten, verlengd met de
      duur van de tijdelijke bescherming.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel43a
  - number: '44'
    text: |-
      1 Verlening van de verblijfsvergunning asiel, bedoeld in [artikel 28][ref1], die rechtmatig verblijf
      inhoudt, heeft van rechtswege tot gevolg de beëindiging van de verstrekkingen voorzien bij of krachtens
      de [Wet Centraal Orgaan opvang asielzoekers][ref2] of een ander wettelijk voorschrift dat soortgelijke
      verstrekkingen regelt. De verstrekkingen worden beëindigd op de wijze voorzien bij of krachtens de
      [Wet Centraal Orgaan opvang asielzoekers][ref3] of in het andere wettelijk voorschrift en binnen de daartoe
      gestelde termijn.

      2 Indien de aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in de artikelen 29 tot en
      met 29d, wordt ingewilligd, wordt deze verblijfsvergunning verleend met ingang van de dag na de bekendmaking van
      de beschikking.

      3 De verblijfsvergunning asiel, bedoeld in artikel 28, eerste lid, onderdeel c, subonderdeel 3°, wordt verleend met
      ingang van de datum waarop de verblijfsvergunning als bedoeld in [artikel 14][ref4] is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006685
      [ref3]: https://wetten.overheid.nl/BWBR0006685
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel14
