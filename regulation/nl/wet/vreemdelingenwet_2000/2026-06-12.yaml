  - number: '96'
    text: |-
      1 Indien het beroep, bedoeld in [artikel 94][ref1], ongegrond is verklaard en de vreemdeling beroep instelt tegen
      het voortduren van de vrijheidsontneming, sluit de rechtbank het vooronderzoek binnen een week na ontvangst van het
      beroepschrift. In afwijking van [artikel 8:57 van de Algemene wet bestuursrecht][ref2] kan de rechtbank ook zonder
      toestemming van partijen bepalen dat het onderzoek ter zitting achterwege blijft.

      2 De rechtbank doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak
      wordt binnen zeven dagen na de sluiting van het onderzoek gedaan. In afwijking van
      [artikel 8:66, tweede lid, van de Algemene wet bestuursrecht][ref3] kan de in dat artikel bedoelde termijn niet
      worden verlengd.

      3 Indien de rechtbank bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel
      in strijd is met deze wet dan wel bij afweging van alle daarbij betrokken belangen in redelijkheid niet
      gerechtvaardigd is, verklaart zij het beroep gegrond. In dat geval beveelt de rechtbank de opheffing van de
      maatregel of een wijziging van de wijze van tenuitvoerlegging daarvan.

      4 Het eerste lid is van overeenkomstige toepassing indien het beroep, bedoeld in artikel 94, niet ongegrond is
      verklaard en de vrijheidsontnemende maatregel desondanks voortduurt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel857
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel866
