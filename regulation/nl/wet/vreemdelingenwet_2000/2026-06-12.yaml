  - number: 106aa
    text: >-
      1 Onze Minister, de op grond van artikel 46 en 47 aangewezen ambtenaren en Onze Minister van Buitenlandse Zaken
      zijn ter uitvoering van Eurodac-verordening bevoegd biometrische gegevens af te nemen van de in artikel 13, eerste
      lid, van de Eurodac-verordening bedoelde personen voor de in dat artikellid genoemde doeleinden.


      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:


      a. de wijze van het afnemen en verwerken van de biometrische gegevens, bedoeld in het eerste lid; en


      b. de maatregelen als bedoeld in artikel 13, derde lid, van de Eurodac-verordening.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel106aa
  - number: 106a
    text: |-
      1 Voor zover op grond van de Europese verordeningen die betrekking hebben op biometrische gegevens geen
      gezichtsopname of vingerafdrukken kunnen worden afgenomen en verwerkt, kunnen van een vreemdeling een
      gezichtsopname en tien vingerafdrukken worden afgenomen en verwerkt voor het vaststellen van de identiteit met het
      oog op de uitvoering van deze wet. De gezichtsopname en vingerafdrukken worden vergeleken met de gezichtsopnames en
      vingerafdrukken in de vreemdelingenadministratie.

      2 Voor het verifiëren van de authenticiteit van het document, bedoeld in [artikel 9][ref1], of de verificatie van
      de identiteit van een vreemdeling kunnen voor zover dit niet mogelijk is op grond van de Europese verordeningen
      die betrekking hebben op biometrische gegevens, met het oog op de uitvoering van deze wet vingerafdrukken worden
      afgenomen. Van deze vingerafdrukken worden één of twee en indien dit geen resultaat oplevert meer vingerafdrukken
      gebruikt voor vergelijking met de vingerafdrukken op het document of in de vreemdelingenadministratie.

      3 Tot het afnemen en verwerken van een gezichtsopname en vingerafdrukken ten behoeve van de in het eerste en
      tweede lid genoemde doelen, zijn uitsluitend bevoegd Onze Minister, de ambtenaren belast met de grensbewaking, de
      ambtenaren belast met het toezicht op vreemdelingen en Onze Minister van Buitenlandse Zaken voor zover het gaat om
      het vaststellen of het verifiëren van de identiteit.

      4 Het eerste lid is niet van toepassing op:

      a. gemeenschapsonderdanen, en

      b. de vreemdeling die behoort tot een bij algemene maatregel aangewezen categorie.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:

      a. de wijze van het afnemen en verwerken van de gezichtsopnames en de vingerafdrukken, bedoeld in het eerste en
      tweede lid, en

      b. de maatregelen die kunnen worden getroffen in het geval geen vingerafdrukken van de vreemdeling kunnen worden
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '107'
    text: |-
      1 Er is een vreemdelingenadministratie, die wordt beheerd door Onze Minister. De vreemdelingenadministratie bevat:

      a. de gezichtsopnames en vingerafdrukken, bedoeld in [artikel 106a, eerste lid][ref1];

      b. andere persoons- en verwijsgegevens van vreemdelingen die volgens een door Onze Minister vastgestelde werkwijze
      zijn geïdentificeerd en geregistreerd;

      c. andere gegevens, waaronder persoonsgegevens, die van belang zijn voor de uitvoering van deze wet en de
      [Rijkswet op het Nederlanderschap][ref2];

      d. gegevens, waaronder persoonsgegevens, verwerkt op grond van:

      1°. de SIS-verordening grenscontroles;

      2°. de SIS-verordening terugkeer;

      3°. de Europese verordeningen die betrekking hebben op biometrische gegevens;

      4°. de Etias-verordening;

      5°. artikel 48 van de Verordening interoperabiliteit grenzen en visa en artikel 48 van de Verordening
      interoperabiliteit politiële en justitiële samenwerking, asiel en migratie;

      6°. de Screeningsverordening.

      2 De vreemdelingenadministratie heeft tot doel de verwerking van:

      a. de in het eerste lid, onder a, bedoelde gegevens voor de uitvoering van deze wet, de
      [Rijkswet op het Nederlanderschap][ref3], de [Wet vaststellingsprocedure staatloosheid][ref4] en de daarop
      gebaseerde regelgeving;

      b. de in het eerste lid, onder b en c, bedoelde gegevens, voor zover dat noodzakelijk is voor:

      1°. het ter verificatie, controle en verwijzing beschikbaar stellen van de identificatie- en verwijsgegevens van
      vreemdelingen;

      2°. de uitvoering van deze wet, de [Rijkswet op het Nederlanderschap][ref5] en andere, bij regeling van Onze
      Minister aan te wijzen wettelijke voorschriften;

      3°. de evaluatie van bestaand beleid en de voorbereiding van nieuw beleid;

      c. de gegevens bedoeld in het eerste lid, onderdeel d, in overeenstemming met de desbetreffende verordening,
      voor zover dit noodzakelijk is in verband met een besluit van Onze Minister en eventuele daarmee samenhangende
      procedures in rechte;

      d. de Screeningsverordening.

      3 Aan een vreemdeling wordt in de vreemdelingenadministratie een uniek vreemdelingennummer toegekend.

      4 Uit de vreemdelingenadministratie worden, met uitzondering van gezichtsopnames en de vingerafdrukken, bedoeld in
      het eerste lid, aan bestuursorganen die gegevens en inlichtingen verstrekt, die zij behoeven voor de uitvoering van
      hun taak, waaronder in ieder geval gegevens omtrent de verblijfsrechtelijke positie van de vreemdeling en, indien
      het een gecombineerde vergunning betreft, de gegevens op basis waarvan kan worden beoordeeld of is voldaan aan de
      [Wet arbeid vreemdelingen][ref6].

      5 Onverminderd het in het tweede lid, onder a, genoemde doel, en in aanvulling op het bepaalde bij of krachtens
      [artikel 107a][ref7], kunnen gegevens als bedoeld in het eerste lid, onder a, uitsluitend beschikbaar worden
      gesteld met het oog op:

      a. het verstrekken van een reisdocument door een diplomatieke vertegenwoordiging ten behoeve van terugkeer;

      b. de identificatie van slachtoffers van rampen en ongevallen;

      c. de opsporing en vervolging van strafbare feiten;

      d. de toepassing van [artikel 55c van het Wetboek van Strafvordering][ref8];

      e. de uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref9]; en

      f. de uitvoering van:

      1°. de SIS-verordening grenscontroles;

      2°. de SIS-verordening terugkeer;

      3°. de Europese verordeningen die betrekking hebben op biometrische gegevens;

      4°. de Etias-verordening;

      5°. de Screeningsverordening.

      6 De verstrekking van gegevens betreffende de gezichtsopname of de vingerafdrukken van de vreemdeling uit de
      vreemdelingenadministratie in de gevallen bedoeld in het vijfde lid, onderdeel c, ten behoeve van de opsporing en
      vervolging van strafbare feiten vindt slechts plaats in geval van een misdrijf waarvoor voorlopige hechtenis is
      toegelaten en na schriftelijke machtiging van de rechter-commissaris op vordering van de officier van justitie:

      a. indien er een redelijk vermoeden bestaat dat de verdachte een vreemdeling is, of

      b. in het belang van het onderzoek en het opsporingsonderzoek op een dood spoor is beland, dan wel snel resultaat
      geboden is bij de opheldering van het misdrijf.

      7 Bestuursorganen zijn bevoegd uit eigen beweging en desgevraagd verplicht Onze Minister de gegevens en inlichtingen
      te verstrekken die Onze Minister behoeft voor de uitvoering van deze wet en voor de uitvoering van de Rijkswet
      op het Nederlanderschap. Deze bestuursorganen kunnen daarbij gebruik maken van het vreemdelingennummer, het
      burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref10],
      en van andere, bij regeling van Onze Minister aangewezen, nummers.

      8 De in het vierde tot en met zevende lid bedoelde gegevensverstrekking vindt niet plaats, indien de persoonlijke
      levenssfeer van de betrokkene daardoor onevenredig wordt geschaad.

      9 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. de in de vreemdelingenadministratie op te nemen gegevens, de vastlegging van die gegevens en de doorlevering van
      die gegevens;

      b. de vernietiging van de in de vreemdelingenadministratie opgenomen gegevens, waarbij geldt dat gezichtsopnames en
      vingerafdrukken nooit langer worden bewaard dan tien jaar nadat de aanvraag tot het verlenen van een machtiging tot
      voorlopig verblijf is afgewezen, of, in geval van rechtmatig verblijf, de betrokken vreemdeling wiens rechtmatig
      verblijf is geëindigd, Nederland aantoonbaar heeft verlaten, dan wel, indien tegen de vreemdeling een inreisverbod
      is uitgevaardigd of de vreemdeling ongewenst is verklaard, tien jaar na afloop van de geldigheidsduur van het
      inreisverbod onderscheidenlijk de ongewenstverklaring, en deze gegevens in ieder geval worden vernietigd zodra Onze
      Minister bekend is dat de betrokkene niet langer behoort tot de categorie vreemdelingen waarvan deze kunnen worden
      afgenomen;

      c. de gevallen, waarin en de wijze waarop in ieder geval gegevens en inlichtingen dienen te worden verstrekt, en

      d. de gevallen, waarin de verstrekking van gegevens en inlichtingen anders dan kosteloos geschiedt.

      10 Voor de toepassing van het vierde en zevende lid worden met bestuursorganen gelijkgesteld instellingsbesturen
      van uit de openbare kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare kas bekostigde
      scholen en instellingen.

      11 Met betrekking tot de vreemdelingenadministratie is Onze Minister de verwerkingsverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106a
      [ref2]: https://wetten.overheid.nl/BWBR0003738
      [ref3]: https://wetten.overheid.nl/BWBR0003738
      [ref4]: https://wetten.overheid.nl/BWBR0048458
      [ref5]: https://wetten.overheid.nl/BWBR0003738
