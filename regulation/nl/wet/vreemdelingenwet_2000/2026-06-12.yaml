  - number: 59a
    text: |-
      1 Onze Minister kan vreemdelingen op wie de Asiel- en migratiebeheerverordening van toepassing is, met het oog op
      de overdracht aan een verantwoordelijke lidstaat in vreemdelingenbewaring stellen met inachtneming van artikel 44
      van de Asiel- en migratiebeheerverordening.

      2 [Artikel 59, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel59a
