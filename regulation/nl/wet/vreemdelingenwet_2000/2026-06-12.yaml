  - number: 1a
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      - *annulering van een visum:* intrekking van een visum met terugwerkende kracht tot en met het tijdstip van de
      verlening;
      - *machtiging tot voorlopig verblijf:* visum voor de toegang tot Nederland voor verblijf van meer dan 90 dagen;
      - *terugkeervisum:* visum voor de toegang tot Nederland van een vreemdeling die Nederland tijdelijk zal verlaten;
      - *visum:* elk der visa voor toegang tot Nederland met het oog op verblijf van niet langer dan 90 dagen, afgegeven
      door of vanwege een bevoegde autoriteit als bedoeld in een bindend besluit van de Raad van de Europese Unie, van
      het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen, alsmede de onder
      b en c bedoelde visa.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel1a
  - number: '2'
    text: >-
      1 Er is een Adviesraad Migratie.


      2 De adviesraad bestaat uit ten minste zeven leden. Ambtenaren die werkzaam zijn bij een ministerie of
      een daaronder ressorterende instelling, dienst of bedrijf, dan wel anderszins werkzaamheden verrichten in
      ondergeschiktheid aan Onze Ministers, worden niet tot lid benoemd.


      3 Als voorzitter wordt bij voorkeur een rechterlijk ambtenaar met rechtspraak belast benoemd.


      4 De adviesraad heeft tot taak Onze Minister te adviseren over het vreemdelingenrecht en het beleid ter zake,
      waaronder begrepen wijzigingen van deze wet.


      5 Bij algemene maatregel van bestuur worden regels gesteld over de inrichting en de werkwijze van de adviesraad.


      6 De adviesraad is bevoegd bij een ieder schriftelijk of mondeling de inlichtingen in te winnen welke zij voor de
      vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2
  - number: 2a
    text: |-
      1 Ten behoeve van het verblijf van een vreemdeling in Nederland, niet zijnde een gemeenschapsonderdaan, kan in
      ieder geval als referent optreden:

      a. een Nederlander, die in Nederland verblijft of met die vreemdeling in Nederland gaat verblijven;

      b. een vreemdeling, die rechtmatig in Nederland verblijft op grond van
      [artikel 8, onder a tot en met e of l][ref1], of die voor verblijf langer dan 90 dagen in Nederland mag verblijven
      en met die vreemdeling in Nederland gaat verblijven;

      c. een onderneming of rechtspersoon, dan wel een vestiging daarvan, die is ingeschreven in het handelsregister,
      bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref2].

      2 De referent dient ten behoeve van het voorgenomen verblijf op grond van een machtiging tot voorlopig verblijf of
      het verblijf op grond van een verblijfsvergunning als bedoeld in [artikel 14][ref3] van een vreemdeling een daartoe
      strekkende schriftelijke verklaring af te leggen, tenzij hij door Onze Minister als referent is aangewezen.

      3 Bij of krachtens algemene maatregel van bestuur:

      a. worden nadere regels gesteld omtrent de natuurlijke personen en organisaties, die als referent kunnen optreden;

      b. wordt ten aanzien van referenten voorzien in zorgplichten jegens de vreemdeling;

      c. kunnen regels worden gesteld omtrent de aanwijzing als referent.

      4 Onze Minister stelt het model van de verklaring, bedoeld in het tweede lid, vast.


