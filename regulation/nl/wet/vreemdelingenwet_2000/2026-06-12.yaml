  - number: '89'
    text: |-
      1 De Afdeling bestuursrechtspraak van de Raad van State behandelt het hoger beroep met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].

      2 De Afdeling bestuursrechtspraak van de Raad van State doet uiterlijk drieëntwintig weken na ontvangst van het
      beroepschrift uitspraak.


