  - number: 45d
    text: |-
      1 De EU-verblijfsvergunning voor langdurig ingezetenen kan worden ingetrokken, indien:

      a. de vreemdeling een aaneengesloten periode van twaalf maanden of langer buiten het grondgebied van de Europese
      Unie, dan wel zes jaar of langer buiten Nederland heeft verbleven; of

      b. de vreemdeling een actuele en ernstige bedreiging voor de openbare orde of de nationale veiligheid vormt.

      2 De EU-verblijfsvergunning voor langdurig ingezetenen van de vreemdeling op wiens document, bedoeld in
      [artikel 9][ref1], de aantekening, bedoeld in [artikel 45c, eerste lid][ref2], is geplaatst, kan worden
      ingetrokken, indien:

      a. er ernstige redenen zijn om aan te nemen dat de vreemdeling zich schuldig heeft gemaakt aan een van de
      misdrijven of daden, bedoeld in artikel 1, onder F, van het Vluchtelingenverdrag dan wel heeft aangezet tot of
      anderszins heeft deelgenomen aan deze misdrijven of daden; of

      b. de vreemdeling feiten verkeerd heeft weergegeven of heeft achtergehouden, of valse documenten heeft gebruikt, en
      dit doorslaggevend is geweest voor de verlening van de verblijfsvergunning, bedoeld in [artikel 28][ref3].

      3 De EU-verblijfsvergunning voor langdurig ingezetenen wordt ingetrokken, indien:

      a. de vreemdeling langdurig ingezetene is geworden in een andere lidstaat van de Europese Unie; of

      b. de verblijfsvergunning op frauduleuze wijze is verkregen.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      eerste, tweede en het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
