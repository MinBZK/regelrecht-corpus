        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 2z
    text: >-
      Een terugkeervisum wordt door de vreemdeling in persoon aangevraagd. Bij of krachtens algemene maatregel van
      bestuur kunnen nadere regels worden gesteld omtrent de wijze van indiening en de behandeling van een aanvraag tot
      verlening van een terugkeervisum.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2z
  - number: 2aa
    text: >-
      Onze Minister beslist binnen twee weken na ontvangst van een aanvraag om verlening van een terugkeervisum. Onze
      Minister kan deze termijn verlengen met ten hoogste twee weken.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2aa
  - number: 2bb
    text: >-
      Onze Minister brengt het terugkeervisum aan in het document voor grensoverschrijding of op een blad waarop een
      visum kan worden aangebracht als bedoeld in artikel 1 van Verordening (EG) nr. 333/2002 van de Raad van de Europese
      Gemeenschappen van 18 februari 2002 (PbEG 2002, L53/4).
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2bb
  - number: 2cc
    text: >-
      1 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze van
      indiening en de behandeling van een aanvraag tot verlening of wijziging van een machtiging tot voorlopig verblijf
      dan wel terugkeervisum, daaronder begrepen de wijze waarop beschikkingen, kennisgevingen, mededelingen of berichten
      ingevolge dit hoofdstuk aan de vreemdeling, de referent of aan andere belanghebbenden worden bekendgemaakt.


      2 Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen aan de verplichtingen die
      krachtens dit hoofdstuk op de vreemdeling rusten kan worden voldaan door diens wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2cc
  - number: 2dd
    text: >-
      1 Bij algemene maatregel van bestuur wordt een instantie of dienst aangewezen als de nationale Etias-eenheid,
      bedoeld in artikel 8, eerste lid, van de Etias-verordening.


      2 De nationale Etias-eenheid is werkzaam onder verantwoordelijkheid van Onze Minister.


      3 Onze Minister kan de nationale Etias-eenheid algemene en bijzondere aanwijzingen geven voor de uitvoering van
      haar taken krachtens de Etias-verordening.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2dd
  - number: 2ee
    text: >-
      1 De Etias-eenheid is bevoegd een reisautorisatie met beperkte territoriale geldigheid als bedoeld in artikel 44
      van de Etias-verordening te verlenen.


      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de verlening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2ee
  - number: 2ff
    text: >-
      1 Onze Minister is overeenkomstig de Screeningsverordening belast met de uitvoering van de taken en bezit daartoe
      de bevoegdheden die de Screeningsverordening aan de Screeningsautoriteiten toekent.


      2 Ten aanzien van de in artikel 5 van de Screeningsverordening bedoelde screening aan de buitengrens, voert de
      Koninklijke Marechaussee de taken van de Screeningsautoriteiten overeenkomstig de Screeningsverordening uit, voor
      zover het de toepassing van artikel 14 en 15 van de Screeningverordening betreft, met inbegrip van de afname van
      biometrische gegevens van een aan de screening onderworpen onderdaan van een derde land voor de identificatie of
      verificatie van de identiteit van die persoon, de veiligheidscontrole van die persoon en de registratie in Eurodac
      van die persoon, overeenkomstig artikel 15, eerste lid, onderdeel b, en de artikelen 22, 23 en 24 van [Verordening
      (EU) 2024/1358](32024R1358), naargelang het geval.


      3 Onverminderd het eerste en tweede lid kunnen bij algemene maatregel van bestuur een of meerdere autoriteiten of
      instanties worden aangewezen die een of meerdere taken van de Screeningsautoriteiten uitvoeren.


      4 De Screeningsautoriteiten verstrekken bij aanvang van de screening de aan screening onderworpen vreemdelingen
      op schriftelijke wijze informatie over de mogelijkheden tot het instellen van procedures bij niet-eerbiediging
      of niet-handhaving van grondrechten gedurende de screening, in een taal die de vreemdeling begrijpt, of waarvan
      redelijkerwijze kan worden aangenomen dat de vreemdeling deze begrijpt.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2ff
  - number: 2gg
    text: >-
      1 Onze Minister voorziet in de uitvoering van de in artikel 12, eerste lid, van de Screeningsverordening bedoelde
      voorlopige medische controle door gekwalificeerd medisch personeel en in de aanstelling van personen als bedoeld in
      artikel 13, derde lid, van de Screeningsverordening.


      2 Het in het eerste lid bedoelde gekwalificeerde medische personeel en de in het eerste lid bedoelde personen
      verstrekken de Screeningsautoriteiten die gegevens die noodzakelijk zijn om te kunnen voldoen aan de verplichting
      opgenomen in artikel 17, eerste lid, onderdeel d, respectievelijk artikel 17, eerste lid, onderdeel e, van de
      Screeningsverordening.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2gg
  - number: 2hh
    text: |-
      1 Onze Minister voorziet in een onafhankelijk toezichtmechanisme overeenkomstig de in artikel 10, tweede en vierde
      lid, van de Screeningsverordening en artikel 43, vierde lid, van de Procedureverordening bedoelde vereisten.

      2 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het in het eerste lid bedoelde
      onafhankelijke toezichtmechanisme:

      - onverminderd artikel 2ii en onverminderd artikel 65, tweede lid, van de Politiewet 2012, instanties worden
      aangewezen die eveneens deelnemen aan de werking onverminderd en overeenkomstig de taken en bevoegdheden die de wet
      deze instanties toekent;
      - nadere regels worden gesteld met het oog op de goede werking van het mechanisme.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2hh
  - number: 2ii
    text: >-
      Het College voor de rechten van de mens neemt deel aan de werking van het onafhankelijk toezichtmechanisme,
      overeenkomstig de taken en bevoegdheden op grond van de Wet College voor de rechten van de mens.
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2ii
  - number: '3'
    text: |-
      1 In andere dan de in de Schengengrenscode geregelde gevallen, wordt toegang tot Nederland geweigerd aan de
      vreemdeling die:

      a. niet in het bezit is van een geldig document voor grensoverschrijding, dan wel in het bezit is van een document
      voor grensoverschrijding waarin het benodigde visum ontbreekt;

      b. een gevaar oplevert voor de openbare orde of nationale veiligheid;

      c. niet beschikt over voldoende middelen om te voorzien zowel in de kosten van verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is, of

      d. niet voldoet aan de voorwaarden die bij of krachtens algemene maatregel van bestuur zijn gesteld.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de weigering van toegang op grond van
      deze wet of ter uitvoering van de Schengengrenscode.

      3 Indien een vreemdeling aan de grens te kennen geeft een aanvraag tot het verlenen van een verblijfsvergunning
      asiel als bedoeld in [artikel 28][ref1] te willen indienen, wordt de aanvraag op de locaties waar de
      asielgrensprocedure wordt uitgevoerd getoetst aan:

      a. de grond voor het niet in behandeling nemen als bedoeld in [artikel 30][ref2];

      b. de gronden voor niet-ontvankelijkverklaring, bedoeld in [artikel 30a][ref3]; en

      c. de gronden voor afwijzing wegens kennelijke ongegrondheid, genoemd in [artikel 30b][ref4], met dien verstande
      dat een van de in artikel 42, eerste lid, onderdelen a tot en met g, en j, en artikel 42, derde lid, onderdeel b,
      van de Procedureverordening genoemde gevallen van toepassing is.

      4 Indien de aanvraag wordt behandeld op de locaties waar de asielgrensprocedure wordt uitgevoerd, wordt een besluit
      omtrent de weigering van toegang tot Nederland uitgesteld. Een reeds genomen besluit tot weigering van toegang tot
      Nederland vervalt met ingang van het tijdstip waarop de vreemdeling aan de grens te kennen geeft een aanvraag als
      bedoeld in het derde lid te willen indienen.

      5 De vreemdeling wordt onverwijld in kennis gesteld van het uitstel van het besluit tot weigering van toegang tot
      Nederland.

      6 Op de aanvraag, bedoeld in het derde lid, wordt binnen vijf weken na de registratie daarvan een beschikking
      gegeven. Indien na het verstrijken van deze termijn nog niet is beslist over het in behandeling nemen, de
      ontvankelijkheid of de kennelijke ongegrondheid van de aanvraag, verkrijgt de vreemdeling van rechtswege toegang
      tot Nederland, onder opheffing van de maatregel, bedoeld in artikel 6, derde lid. De termijn kan met vier weken
      worden verlengd wanneer de vreemdeling wordt herplaatst overeenkomstig artikel 67, elfde lid, van de Asiel- en
      migratiebeheerverordening.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de asielgrensprocedure.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel3
