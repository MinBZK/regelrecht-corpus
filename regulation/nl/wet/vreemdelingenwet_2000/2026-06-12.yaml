        afdeling: '1'
  - number: 2x
    text: |-
      1 Een terugkeervisum kan worden geweigerd indien:

      a. de vreemdeling niet door overlegging van documenten aannemelijk heeft gemaakt dat sprake is van een dringende
      reden die geen uitstel van vertrek mogelijk maakt;

      b. de vreemdeling niet zelfstandig beschikt over een geldig document voor grensoverschrijding;

      c. de vreemdeling zich gedurende zijn verblijf in Nederland aan maatregelen van toezicht op grond van deze wet
      heeft onttrokken;

      d. uit oogpunt van toezicht op grond van deze wet, opsporing of vervolging van strafbare feiten, tenuitvoerlegging
      van een vonnis of om andere gewichtige redenen bezwaar bestaat tegen vertrek uit Nederland van de vreemdeling;

      e. het naar het oordeel van Onze Minister in de rede ligt dat binnen de geldigheidsduur van het terugkeervisum een
      beslissing als bedoeld in [artikel 8, onderdeel f, g of h][ref1], kan worden verwacht;

      f. de vreemdeling in afwachting is van de beslissing op diens aanvraag om een verblijfsvergunning als bedoeld in
      [artikel 14][ref2] dan wel in afwachting is van de beslissing op een bezwaarschrift of een beroepschrift tegen een
      dergelijke beslissing en niet heeft beschikt over de vereiste machtiging tot voorlopig verblijf, overeenkomend met
      het verblijfsdoel waarvoor de verblijfsvergunning is aangevraagd, dan wel niet op grond van het bepaalde bij of
      krachtens deze wet van de verplichting tot het beschikken over een machtiging tot voorlopig verblijf is vrijgesteld
      of ontheven; of

      g. de vreemdeling een gevaar vormt voor de openbare orde of de nationale veiligheid dan wel zich schuldig heeft
      gemaakt aan of verdacht wordt van terrorisme, oorlogsmisdaden, of andere misdaden tegen de menselijkheid.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel2x
