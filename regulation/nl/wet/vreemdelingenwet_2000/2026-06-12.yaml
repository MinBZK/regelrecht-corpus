  - number: 59b
    text: |-
      1 De vreemdeling die rechtmatig verblijf heeft op grond van artikel 8, aanhef en onder f, subonderdeel 2° of onder
      h, subonderdeel 2°, voor zover dit betrekking heeft op een aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 28][ref1], kan door Onze Minister in vreemdelingenbewaring worden gesteld, indien:

      a. vreemdelingenbewaring noodzakelijk is met het oog op vaststelling van de identiteit of nationaliteit van de
      vreemdeling;

      b. vreemdelingenbewaring noodzakelijk is met het oog op het vaststellen van de gegevens die ten grondslag liggen
      aan een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 en die niet zouden
      kunnen worden verkregen indien de aanvrager niet in vreemdelingenbewaring zou worden gehouden, met name wanneer
      sprake is van een onderduikrisico;

      c. de vreemdeling:

      1°. in vreemdelingenbewaring werd gehouden in het kader van een terugkeerprocedure uit hoofde van de
      Terugkeerrichtlijn;

      2°. reeds de mogelijkheid van toegang tot de asielprocedure heeft gehad; en

      3°. op redelijke gronden aangenomen kan worden dat hij de aanvraag louter heeft ingediend om de uitvoering van het
      terugkeerbesluit uit te stellen of te verijdelen;

      d. de vreemdeling een gevaar vormt voor de nationale veiligheid of openbare orde als bedoeld in artikel 10, vierde
      lid, onderdeel f, van de Opvangrichtlijn; of

      e. vreemdelingenbewaring noodzakelijk is ten behoeve van de handhaving van de opgelegde vrijheidsbeperkende
      maatregel, bedoeld in artikel 56, eerste lid, in het geval de vreemdeling die maatregel niet naleeft en het
      onderduikrisico blijft bestaan.

      2 De vreemdelingenbewaring krachtens het eerste lid, duurt zo kort mogelijk, uitsluitend zo lang de in het eerste
      lid genoemde gronden van toepassing zijn en niet langer dan zes maanden.

      3 Onze Minister kan de vreemdelingenbewaring krachtens het eerste lid met ten hoogste zes maanden verlengen, indien
      er sprake is van:

      a. complexe feitelijke of juridische kwesties; of

      b. de vertraging in de behandeling van de aanvraag om een verblijfsvergunning asiel als bedoeld in artikel 28
      duidelijk en uitsluitend kan worden toegeschreven aan het feit dat de vreemdeling de krachtens artikel 9 van de
      Procedureverordening op hem rustende verplichtingen niet nakomt.

      4 De vreemdeling wordt niet in vreemdelingenbewaring gesteld om de enkele reden dat hij een aanvraag tot het
      verlenen van een verblijfsvergunning asiel als bedoeld in artikel 28 heeft ingediend of op basis van zijn
      nationaliteit. De vreemdelingenbewaring mag niet bestraffend van aard zijn.

      5 In afwijking van het eerste lid, wordt een minderjarige vreemdeling in de regel niet in vreemdelingenbewaring
      gesteld. In uitzonderlijke omstandigheden kunnen minderjarigen als maatregel in laatste instantie en nadat
      is gebleken dat minder dwingende alternatieve maatregelen niet doeltreffend kunnen worden toegepast, en nadat
      overeenkomstig artikel 26 van de Opvangrichtlijn is beoordeeld dat vreemdelingenbewaring in hun belang is, voor zo
      kort mogelijke duur in vreemdelingenbewaring worden gehouden:

      a. in het geval van begeleide minderjarigen, wanneer de ouder of hoofdverzorger van de minderjarige in
      vreemdelingenbewaring wordt gehouden, of

      b. in het geval van niet-begeleide minderjarigen, wanneer de minderjarige door de vreemdelingenbewaring wordt
      beschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
