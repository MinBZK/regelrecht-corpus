  - number: '86'
    text: |-
      1 In afwijking van [artikel 8:41, vijfde lid, van de Algemene wet bestuursrecht][ref1] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling bestuursrechtspraak van de Raad van State kan een kortere termijn stellen.

      2 In afwijking van [artikel 8:41, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt door de secretaris
      geen griffierecht geheven, indien hoger beroep wordt ingesteld tegen een uitspraak die is gedaan met toepassing van
      afdeling 3 van dit hoofdstuk.

      3 In afwijking van [artikel 8:82 van de Algemene wet bestuursrecht][ref3] wordt door de secretaris geen
      griffierecht geheven voor een verzoek om voorlopige voorziening indien hoger beroep wordt ingesteld tegen een
      uitspraak die is gedaan met toepassing van [afdeling 3 van dit hoofdstuk][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel841
