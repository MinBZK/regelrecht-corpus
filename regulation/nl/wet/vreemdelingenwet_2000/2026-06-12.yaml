  - number: '47'
    text: |-
      1 Met het toezicht op de naleving van de wettelijke voorschriften met betrekking tot vreemdelingen zijn belast:

      a. de ambtenaren van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn
      aangesteld voor de uitvoering van de politietaak;

      b. de ambtenaren van de Koninklijke marechaussee;

      c. de bij besluit van Onze Minister aangewezen ambtenaren.

      2 De ambtenaren van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref2], die zijn
      aangesteld voor de uitvoering van de politietaak oefenen het toezicht op vreemdelingen uit onder leiding van de
      korpschef.

      3 De ambtenaren van de Koninklijke marechaussee oefenen het toezicht op vreemdelingen uit onder leiding van de
      Commandant der Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
