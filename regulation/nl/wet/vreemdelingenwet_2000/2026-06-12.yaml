  - number: '51'
    text: |-
      1 Indien de ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen op
      grond van feiten en omstandigheden, naar objectieve maatstaven gemeten, een redelijk vermoeden hebben dat met
      een vervoermiddel personen worden vervoerd met betrekking tot wie zij een toezichthoudende taak hebben, zijn
      zij bevoegd het vervoermiddel te onderzoeken. De ambtenaren zijn in dat geval bevoegd van de bestuurder van het
      voertuig of van de schipper van het vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hen
      aangewezen plaats overbrengt teneinde het vervoermiddel te onderzoeken.

      2 [Artikel 5:19, vijfde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de
      vordering als bedoeld in het eerste lid.

      3 Indien de ambtenaren belast met de grensbewaking op grond van feiten en omstandigheden, naar objectieve
      maatstaven gemeten, een redelijk vermoeden hebben dat met een luchtvaartuig personen worden vervoerd met betrekking
      tot wie zij een toezichthoudende taak hebben, zijn zij bevoegd het luchtvaartuig te onderzoeken. De ambtenaren
      zijn in dat geval bevoegd van de gezagvoerder van een luchtvaartuig te vorderen dat deze zijn luchtvaartuig naar
      een door hen aangewezen plaats overbrengt teneinde het luchtvaartuig te onderzoeken. Bij of krachtens algemene
      maatregel van bestuur kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel51
