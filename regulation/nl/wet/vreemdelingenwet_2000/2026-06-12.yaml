  - number: '20'
    text: |-
      1 Onze Minister is bevoegd:

      a. de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd in te willigen, af te wijzen dan
      wel niet in behandeling te nemen;

      b. een verblijfsvergunning voor onbepaalde tijd in te trekken;

      c. ambtshalve een verblijfsvergunning voor onbepaalde tijd te verlenen aan de vreemdeling wiens EU-
      verblijfsvergunning voor langdurig ingezetenen op grond van [artikel 45d][ref1] is ingetrokken.

      2 Een verblijfsvergunning voor onbepaalde tijd wordt niet onder beperkingen verleend. Aan de vergunning worden geen
      voorschriften verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45d
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: '21'
    text: |-
      1 De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1]
      van de vreemdeling die direct voorafgaande aan de aanvraag, gedurende vijf achtereenvolgende jaren rechtmatig
      verblijf heeft genoten als bedoeld in [artikel 8, onder a, c, e, l][ref2], dan wel op grond van een EU-
      verblijfsvergunning voor langdurig ingezetenen, kan slechts worden afgewezen indien de vreemdeling:

      a. al of niet tezamen met het gezinslid bij wie hij verblijft, niet zelfstandig en duurzaam beschikt over voldoende
      middelen van bestaan;

      b. onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot afwijzing van
      de aanvraag tot het verlenen, wijzigen of verlengen zouden hebben geleid;

      c. bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem ter zake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref3], is opgelegd;

      d. een gevaar vormt voor de nationale veiligheid;

      e. zijn hoofdverblijf buiten Nederland heeft gevestigd;

      f. op de dag waarop de aanvraag is ontvangen, een verblijfsrecht van tijdelijke aard heeft; of

      g. niet heeft voldaan aan het bij of krachtens algemene maatregel van bestuur vast te stellen inburgeringsvereiste.

      2 In afwijking van het eerste lid, wordt de aanvraag niet afgewezen op grond van het eerste lid, onder a,
      indien de vreemdeling gedurende een tijdvak van tien aaneengesloten jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a of l][ref4], of op grond van een EU-verblijfsvergunning voor langdurig ingezetenen heeft gehad.

      3 In afwijking van het eerste lid, wordt de aanvraag niet afgewezen op grond van het eerste lid, onder a, indien
      de vreemdeling als minderjarige onder een beperking verband houdende met gezinshereniging rechtmatig verblijf heeft
      gehad en sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is, tenzij de
      gezinsband werd verbroken binnen een jaar na verlening van de verblijfsvergunning, bedoeld in [artikel 14][ref5].

      4 Indien de vreemdeling in Nederland is geboren dan wel reeds voor zijn vierde levensjaar in Nederland
      verbleef en sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is,
      kan de aanvraag in afwijking van het eerste lid slechts worden afgewezen op grond van het eerste lid,
      onder c of d. In afwijking van het eerste lid, behoeft het rechtmatig verblijf van de vreemdeling niet
      aaneengesloten te zijn. De aanvraag kan slechts worden afgewezen op grond van het eerste lid, onder c, indien
      de vreemdeling bij onherroepelijk geworden rechterlijk vonnis is veroordeeld voor een misdrijf als bedoeld in
      [artikel 22b, eerste lid, van het Wetboek van Strafrecht][ref6] of een misdrijf uit de [Opiumwet][ref7] waarop
      naar de wettelijke omschrijving een gevangenisstraf van zes jaar of meer is gesteld.

      5 Onder een tijdvak als bedoeld in het eerste en tweede lid van dit artikel wordt verstaan een tijdvak onmiddellijk
      voorafgaande aan de dag waarop de verblijfsvergunning voor onbepaalde tijd is aangevraagd. Voor de berekening van
      het tijdvak wordt de periode van rechtmatig verblijf in Nederland vóór het bereiken van de achtjarige leeftijd
      buiten beschouwing gelaten.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gronden, bedoeld in het
      eerste lid, onderdelen a tot en met f. Daarbij kunnen andere gevallen dan bedoeld in het eerste tot en met vierde
      lid worden aangewezen waarin een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref8] kan
      worden verleend.

      7 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, onderdeel g, worden in ieder
      geval regels gesteld omtrent de inhoud van het inburgeringstraject en het te behalen niveau, alsmede omtrent de
      vrijstellingen en ontheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
