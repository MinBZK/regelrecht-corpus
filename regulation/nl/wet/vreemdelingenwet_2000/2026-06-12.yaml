  - number: '23'
    text: |-
      1 De aanvraag tot het verlenen, verlengen of wijzigen van een verblijfsvergunning wordt ingediend door de
      vreemdeling, zijn wettelijk vertegenwoordiger of zijn referent.

      2 In afwijking van het eerste lid wordt de aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde
      gevallen ingediend door de vreemdeling, zijn wettelijk vertegenwoordiger of zijn erkende referent.

      3 In afwijking van [artikel 2:1, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] en in afwijking van
      het eerste en tweede lid, wordt de aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde gevallen
      ingediend door de vreemdeling of zijn wettelijk vertegenwoordiger in persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel21
    url: https://wetten.overheid.nl/BWBR0011823/2026-06-12#Artikel23
