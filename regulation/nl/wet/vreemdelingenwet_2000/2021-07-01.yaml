  - number: '76.2'
    text: |-
      Onverminderd [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref1], kan de beslissing worden verdaagd
      voor ten hoogste dertien weken indien naar het oordeel van Onze Minister voor de beoordeling van het bezwaarschrift
      advies van of onderzoek door derden of het openbaar ministerie nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '77.1'
    text: |-
      Tegen een ter uitvoering van deze wet genomen beschikking die niet door of namens Onze Minister is genomen,
      met uitzondering van een beschikking als bedoeld in [artikel 72, tweede lid][ref1], kan bij Onze Minister
      administratief beroep worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel72
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '72'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '2'
  - number: '77.2'
    text: |-
      In afwijking van het eerste lid staat geen administratief beroep open tegen een beschikking die is gegeven op grond
      van de [artikelen 6][ref1], [6a][ref2] en [50, tweede, derde en vierde lid][ref3], en tegen de ophouding op grond
      van [artikel 50a, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel50a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel77
