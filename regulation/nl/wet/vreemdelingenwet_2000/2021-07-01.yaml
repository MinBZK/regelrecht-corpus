  - number: '9.1'
    text: |-
      Onze Minister verschaft aan de vreemdeling, die rechtmatig verblijf heeft op grond van
      [artikel 8, onder a tot en met d, f tot en met h en j tot en met m][ref1], en aan de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, onder e][ref2], en gemeenschapsonderdaan is als bedoeld in
      [artikel 1, sub 2°, 4° en 6°][ref3], een document of schriftelijke verklaring, waaruit het rechtmatig verblijf
      blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: '9.2'
    text: |-
      Onze Minister verschaft aan de vreemdeling die rechtmatig verblijf heeft op grond van [artikel 8, onder e][ref1],
      en gemeenschapsonderdaan is als bedoeld in [artikel 1, sub 1°, 3° en 5°][ref2] een document, waaruit het
      rechtmatig verblijf blijkt, indien de vreemdeling het duurzaam verblijfsrecht heeft verkregen als bedoeld in
      artikel 16 van [Richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor burgers van de Unie
      en hun familieleden, tot wijziging van [Verordening (EEG) 1612/68](31968R1612) en tot intrekking van [Richtlijnen
      64/221/EEG](31964L0221), [68/360/EEG](31968L0360), [72/194/EEG](31972L0194), [73/148/EEG](31973L0148), [75/34/
      EEG](31975L0034), [75/35/EEG](31975L0035), [90/364/EEG](31990L0364), [90/365/EEG](31990L0365) en [93/96/EEG]
      (31993L0096) (PbEU L 158).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: '9.3'
    text: |-
      Onze Minister verschaft desgevraagd een dergelijk document of schriftelijke verklaring aan de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, onder i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '9.4'
    text: |-
      Bij de aanvraag van een beschikking anders dan op grond van deze wet legt de vreemdeling desgevraagd een kopie
      van het document of de schriftelijke verklaring over, dat wordt aangemerkt als een bescheid als bedoeld in
      [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9.5'
    text: |-
      Onze Minister wijst bij ministeriële regeling de bescheiden, bedoeld in het eerste tot en met derde lid, aan en kan
      modellen vaststellen voor de documenten en de schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel9
  - number: 9a
    text: |-
      In afwijking van [artikel 9, tweede lid][ref1], verschaft Onze Minister aan de vreemdeling die rechtmatig
      verblijf heeft op grond van [artikel 8, onder e][ref2], en gemeenschapsonderdaan is als bedoeld in
      [artikel 1, sub 1°, 3° en 5°][ref3], op aanvraag een bewijs van rechtmatig verblijf voordat de vreemdeling het
      duurzame verblijfsrecht heeft verkregen, indien de vreemdeling de nationaliteit heeft van een lidstaat ten aanzien
      waarvan Nederland de toepassing van de artikelen 1 tot en met 6 van Verordening (EU) nr. 492/2011 van het Europees
      Parlement en de Raad van 5 april 2011 betreffende het vrije verkeer van werknemers binnen de Unie (PbEU 2011, L
      141/1) heeft opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: '10.1'
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft, kan geen aanspraak maken op toekenning van verstrekkingen,
      voorzieningen en uitkeringen bij wege van een beschikking van een bestuursorgaan. De eerste volzin is van
      overeenkomstige toepassing op de bij de wet of algemene maatregel van bestuur aangewezen ontheffingen of
      vergunningen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      Van het eerste lid kan worden afgeweken indien de aanspraak betrekking heeft op het onderwijs, de verlening
      van medisch noodzakelijke zorg, de voorkoming van inbreuken op de volksgezondheid, of de rechtsbijstand aan de
      vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel10
  - number: '10.3'
    text: De toekenning van aanspraken geeft geen recht op rechtmatig verblijf.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      De aanspraken van de vreemdeling die rechtmatig verblijf heeft zijn in overeenstemming met de aard van het
      verblijf. Tenzij bij of krachtens het wettelijk voorschrift waarop de aanspraak is gegrond anders is bepaald, is
      daarbij het tweede lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel11
  - number: '11.2'
    text: |-
      De vreemdeling, bedoeld in het eerste lid, kan aanspraken maken op voorzieningen, verstrekkingen en uitkeringen,
      indien hij:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel11
  - number: 11.2.a
    text: |-
      rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder a, tot en met e en l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 11.2.b
    text: |-
      rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder f, g, h][ref1], en een aanspraak wordt toegekend bij
      of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref2], dan wel bij of krachtens een ander wettelijk
      voorschrift, waarin aanspraken van deze vreemdelingen zijn neergelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006685
  - number: 11.2.c
    text: |-
      rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder i tot en met k][ref1], voor de aanspraken die
      uitdrukkelijk aan deze vreemdelingen zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '11.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de bij wet of algemene maatregel van bestuur
      aangewezen ontheffingen of vergunningen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      Het is aan de vreemdeling die bij binnenkomst heeft voldaan aan de verplichtingen waaraan een persoon bij
      grensoverschrijding is onderworpen, gedurende een bij algemene maatregel van bestuur te bepalen termijn toegestaan
      in Nederland te verblijven, zolang hij:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel12
  - number: 12.1.a
    text: de bij of krachtens deze wet gestelde regels in acht neemt;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel12
  - number: 12.1.b
    text: |-
      beschikt over voldoende middelen om te voorzien zowel in de kosten van zijn verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel12
  - number: 12.1.c
    text: |-
      geen arbeid voor een werkgever verricht in strijd met de [Wet arbeid vreemdelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 12.1.d
    text: geen gevaar oplevert voor de openbare orde of de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      De termijn, bedoeld in het eerste lid, wordt ten hoogste op 180 dagen bepaald. Voor bij algemene maatregel van
      bestuur te onderscheiden categorieën van vreemdelingen kunnen verschillende termijnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel12
  - number: '13'
    text: 'Een aanvraag tot het verlenen van een verblijfsvergunning wordt slechts ingewilligd indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel13
  - number: 13.a
    text: internationale verplichtingen daartoe nopen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel13
  - number: 13.b
    text: met de aanwezigheid van de vreemdeling een wezenlijk Nederlands belang is gediend, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel13
  - number: 13.c
    text: klemmende redenen van humanitaire aard daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel13
  - number: '14.1'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: 14.1.a
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: 14.1.b
    text: |-
      de aanvraag tot het verlengen van de geldigheidsduur ervan in te willigen, af te wijzen dan wel niet in behandeling
      te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: 14.1.c
    text: een verblijfsvergunning voor bepaalde tijd op aanvraag of ambtshalve te wijzigen wegens veranderde omstandigheden;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: 14.1.d
    text: een verblijfsvergunning voor bepaalde tijd in te trekken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: 14.1.e
    text: ambtshalve een verblijfsvergunning voor bepaalde tijd te verlenen dan wel de geldigheidsduur ervan te verlengen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister verleent de houder van een geldige machtiging tot voorlopig verblijf binnen twee weken nadat deze
      zich overeenkomstig [artikel 54, eerste lid, onder e][ref1], heeft aangemeld, ambtshalve een verblijfsvergunning
      voor bepaalde tijd onder dezelfde beperking als die waaronder de machtiging tot voorlopig verblijf is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '14.3'
    text: |-
      Een verblijfsvergunning voor bepaalde tijd wordt verleend onder beperkingen, verband houdende met het doel waarvoor
      het verblijf is toegestaan. Aan de vergunning kunnen voorschriften worden verbonden. Bij of krachtens algemene
      maatregel van bestuur kunnen regels worden gesteld over de ambtshalve verlening, wijziging en verlenging, de
      beperkingen en de voorschriften.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: '14.4'
    text: |-
      De verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur worden regels gesteld over de geldigheidsduur van de verblijfsvergunning en de
      verlenging van de geldigheidsduur van de verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
  - number: '14.5'
    text: |-
      Een verblijfsvergunning regulier voor bepaalde tijd onder de beperking «arbeid in loondienst»
      wordt voor ten hoogste een jaar verleend of, indien die wordt verleend met toepassing van
      [artikel 8, derde lid, onder b en c, van de Wet arbeid vreemdelingen][ref1], voor ten hoogste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: 14a
    text: |-
      Onze Minister besluit niet over de verlening, verlenging of intrekking van een
      gecombineerde vergunning dan nadat hij advies heeft gevraagd aan de instantie, bedoeld in
      [artikel 5, tweede lid, van de Wet arbeid vreemdelingen][ref1]. Deze instantie adviseert over de vraag of
      is voldaan aan de [Wet arbeid vreemdelingen][ref2] als bedoeld in [artikel 16, eerste lid, onder f][ref3],
      [artikel 18, eerste lid, onder g][ref4] en [artikel 19][ref5]. Onze Minister is niet verplicht om advies te
      vragen indien de verblijfsvergunning wordt geweigerd of ingetrokken op grond van een andere afwijzings- of
      intrekkingsgrond, bedoeld in [artikel 16][ref6], [18][ref7] of [19][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref8]: https://wetten.overheid.nl/BWBR0011823#Artikel19
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007149
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref6
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref7
        bwb_id: BWBR0011823
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref8
        bwb_id: BWBR0011823
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '15'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in [artikel 14, tweede lid][ref1], wordt bepaald, dat de
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14][ref2], kan worden verleend onder een beperking
      verband houdend met verblijf als familie- of gezinslid aan gezinsleden van Nederlanders en vreemdelingen die
      rechtmatig verblijven als bedoeld in [artikel 8, onder a tot en met e en l][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '16.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] kan
      worden afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 16.1.a
    text: |-
      de vreemdeling niet beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het
      verblijfsdoel waarvoor de verblijfsvergunning is aangevraagd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: 16.1.b
    text: de vreemdeling niet beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: 16.1.c
    text: |-
      de vreemdeling niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan dan wel, indien de persoon
      bij wie de vreemdeling wil verblijven, niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: 16.1.d
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: 16.1.e
    text: |-
      de vreemdeling niet bereid is om medewerking te verlenen aan een medisch onderzoek naar een ziekte aangewezen bij
      of krachtens de [Wet publieke gezondheid][ref1], ter bescherming van de volksgezondheid of een medische behandeling
      tegen een dergelijke ziekte te ondergaan;


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 16.1.f
    text: |-
      de vreemdeling voor een werkgever arbeid verricht, zonder dat aan de [Wet arbeid vreemdelingen][ref1] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 16.1.g
    text: de vreemdeling niet voldoet aan de beperking, verband houdende met het doel waarvoor hij wil verblijven;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: 16.1.h
    text: |-
      de vreemdeling, die niet behoort tot een der categorieën, bedoeld in [artikel 17, eerste lid][ref1], na
      verkrijging van rechtmatig verblijf in Nederland inburgeringsplichtig zou zijn op grond van de [artikelen 3][ref2]
      en [5 van de Wet inburgering][ref3] en niet beschikt over kennis op basisniveau van de Nederlandse taal en de
      Nederlandse maatschappij;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 16.1.i
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van een eerdere aanvraag tot het verlenen, verlengen of wijzigen van een visum of een verblijfsvergunning
      hebben geleid of zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: 16.1.j
    text: |-
      de vreemdeling in Nederland verblijf heeft gehouden, anders dan op grond van [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 16.1.k
    text: |-
      ten behoeve van het verblijf van de vreemdeling geen verklaring van een referent is overgelegd als bedoeld in
      [artikel 2a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: '16.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: '16.3'
    text: |-
      Het eerste lid, onder h, is niet van toepassing op de vreemdeling die de Surinaamse nationaliteit bezit en die met
      bij ministeriële regeling vastgestelde bescheiden heeft aangetoond in Suriname of Nederland lager onderwijs in de
      Nederlandse taal te hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16
  - number: 16a.1
    text: |-
      De aanvraag tot het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      kan worden afgewezen op de gronden, bedoeld in [artikel 16, eerste lid, onder b tot en met g en k][ref2], alsmede
      indien de vreemdeling het examen, bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref3],
      of een diploma, certificaat of ander document, bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref4],
      niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 16a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel16a
  - number: '17.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      wordt niet afgewezen wegens het ontbreken van een geldige machtiging tot voorlopig verblijf, indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 17.1.a
    text: |-
      de vreemdeling die de nationaliteit bezit van één der door bij regeling van Onze Minister in overeenstemming met
      Onze Minister van Buitenlandse Zaken aan te wijzen landen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: 17.1.b
    text: de gemeenschapsonderdaan, voorzover niet reeds vrijgesteld op grond van een aanwijzing als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: 17.1.c
    text: de vreemdeling voor wie het gelet op diens gezondheidstoestand niet verantwoord is om te reizen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: 17.1.d
    text: de vreemdeling die slachtoffer of getuige-aangever is van mensenhandel;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: 17.1.e
    text: |-
      de vreemdeling die onmiddellijk voorafgaande aan de aanvraag in het bezit was van een verblijfsvergunning voor
      bepaalde tijd als bedoeld in [artikel 28][ref1] dan wel van een verblijfsvergunning voor onbepaalde tijd als
      bedoeld in [artikel 33][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 17.1.f
    text: de vreemdeling die tijdig een aanvraag heeft ingediend tot wijziging van een verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: 17.1.g
    text: de vreemdeling die behoort tot een bij algemene maatregel van bestuur aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: 17.1.h
    text: |-
      een langdurig ingezetene uit een andere EU-lidstaat, dan wel diens echtgenoot of minderjarig kind ingeval het gezin
      reeds was gevormd in die andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: '17.2'
    text: |-
      De voordracht voor een krachtens het eerste lid, onder g, vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat een ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17
  - number: 17a.1
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      wordt niet afgewezen met toepassing van [artikel 16, eerste lid, onderdeel j][ref2], indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 17a.1.a
    text: |-
      de vreemdeling die direct voorafgaand aan de aanvraag rechtmatig verblijf heeft gehad op grond van
      [artikel 8, onder j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 17a.1.b
    text: |-
      de vreemdeling die in aanmerking komt voor verblijf onder een beperking als bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel15
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 17a.1.c
    text: de vreemdeling die minderjarig en alleenstaand is;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17a
  - number: 17a.1.d
    text: |-
      de vreemdeling die als slachtoffer of getuige-aangever als bedoeld in [artikel 17, eerste lid, onder d][ref1],
      direct voorafgaand aan de aanvraag verblijf heeft gehad op grond van [artikel 8, onder a][ref2], en in aanmerking
      komt voor verblijf onder een andere beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 17a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen andere categorieën worden aangewezen waarin de aanvraag, bedoeld in het
      eerste lid, niet wordt afgewezen, op grond dat de toepassing van [artikel 16, eerste lid, onder j][ref1], van een
      onevenredige hardheid zou kunnen getuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '18.1'
    text: |-
      Een aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14][ref1] kan worden afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 18.1.a
    text: de houder daarvan zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
  - number: 18.1.b
    text: de vreemdeling niet beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
  - number: 18.1.c
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
  - number: 18.1.d
    text: |-
      de vreemdeling niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan dan wel de persoon
      bij wie de vreemdeling verblijft niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
  - number: 18.1.e
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
  - number: 18.1.f
    text: |-
      niet wordt voldaan aan de beperking waaronder de vergunning is verleend of een voorschrift dat aan de vergunning
      is verbonden;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
  - number: 18.1.g
    text: |-
      de vreemdeling voor een werkgever arbeid verricht, zonder dat aan de [Wet arbeid vreemdelingen][ref1] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 18.1.h
    text: |-
      ten behoeve van het verblijf van de vreemdeling geen verklaring van een referent is overgelegd als bedoeld in
      [artikel 2a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 18.1.i
    text: |-
      de vreemdeling niet heeft voldaan aan de inburgeringsplicht, bedoeld in
      [artikel 7, eerste lid, van de Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: '18.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel18
  - number: '19'
    text: |-
      De verblijfsvergunning voor bepaalde tijd kan worden ingetrokken op de gronden bedoeld in
      [artikel 18, eerste lid][ref1], met uitzondering van onderdeel b, en wordt ingetrokken indien aan de houder daarvan
      ambtshalve een verblijfsvergunning als bedoeld in [artikel 28, eerste lid, onderdeel e][ref2], wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '20.1'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel20
  - number: 20.1.a
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel20
  - number: 20.1.b
    text: een verblijfsvergunning voor onbepaalde tijd in te trekken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel20
  - number: 20.1.c
    text: |-
      ambtshalve een verblijfsvergunning voor onbepaalde tijd te verlenen aan de vreemdeling wiens EU-verblijfsvergunning
      voor langdurig ingezetenen op grond van [artikel 45d][ref1] is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45d
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: '20.2'
    text: |-
      Een verblijfsvergunning voor onbepaalde tijd wordt niet onder beperkingen verleend. Aan de vergunning worden geen
      voorschriften verbonden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel20
  - number: '21.1'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1] van
      de vreemdeling die direct voorafgaande aan de aanvraag, gedurende vijf achtereenvolgende jaren rechtmatig verblijf
      heeft genoten als bedoeld in [artikel 8, onder a, c, e, l][ref2], dan wel op grond van een EU-verblijfsvergunning
      voor langdurig ingezetenen, kan slechts worden afgewezen indien de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 21.1.a
    text: |-
      al of niet tezamen met het gezinslid bij wie hij verblijft, niet zelfstandig en duurzaam beschikt over voldoende
      middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
  - number: 21.1.b
    text: |-
      onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot afwijzing van de
      aanvraag tot het verlenen, wijzigen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
  - number: 21.1.c
    text: |-
      bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem ter zake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1], is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 21.1.d
    text: een gevaar vormt voor de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
  - number: 21.1.e
    text: zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
  - number: 21.1.f
    text: op de dag waarop de aanvraag is ontvangen, een verblijfsrecht van tijdelijke aard heeft; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
  - number: 21.1.g
    text: |-
      het examen, bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref1], of een diploma,
      certificaat of ander document als bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref2] niet heeft
      behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '5'
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid, wordt de aanvraag niet afgewezen op grond van het eerste lid, onder a,
      indien de vreemdeling gedurende een tijdvak van tien aaneengesloten jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a of l][ref1], of op grond van een EU-verblijfsvergunning voor langdurig ingezetenen heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid, wordt de aanvraag niet afgewezen op grond van het eerste lid, onder a, indien de
      vreemdeling als minderjarige onder een beperking verband houdende met gezinshereniging rechtmatig verblijf heeft
      gehad en sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is, tenzij de
      gezinsband werd verbroken binnen een jaar na verlening van de verblijfsvergunning, bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '21.4'
    text: |-
      Indien de vreemdeling in Nederland is geboren dan wel reeds voor zijn vierde levensjaar in Nederland verbleef
      en sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is, kan de aanvraag
      in afwijking van het eerste lid slechts worden afgewezen op grond van het eerste lid, onder c en d. In afwijking
      van het eerste lid, behoeft het rechtmatig verblijf van de vreemdeling niet aaneengesloten te zijn. De aanvraag
      kan slechts worden afgewezen op grond van het eerste lid, onder c, indien de vreemdeling bij onherroepelijk
      geworden rechterlijk vonnis is veroordeeld tot een gevangenisstraf van meer dan 60 maanden, ter zake van handel in
      verdovende middelen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
  - number: '21.5'
    text: |-
      Onder een tijdvak als bedoeld in het eerste en tweede lid van dit artikel wordt verstaan een tijdvak onmiddellijk
      voorafgaande aan de dag waarop de verblijfsvergunning voor onbepaalde tijd is aangevraagd. Voor de berekening van
      het tijdvak wordt de periode van rechtmatig verblijf in Nederland vóór het bereiken van de achtjarige leeftijd
      buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
  - number: '21.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gronden bedoeld, in het eerste
      lid. Daarbij kunnen andere gevallen dan bedoeld in het eerste tot en met vierde lid worden aangewezen waarin een
      verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1] kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '22.1'
    text: |-
      De verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20][ref1], wordt ingetrokken indien aan de houder
      daarvan ambtshalve een verblijfsvergunning als bedoeld in [artikel 33][ref2] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '22.2'
    text: |-
      De verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 20][ref1], kan worden ingetrokken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 22.2.a
    text: de houder daarvan zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel22
  - number: 22.2.b
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de aanvraag tot het verlenen, wijzigen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel22
  - number: 22.2.c
    text: |-
      de houder daarvan bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen
      een gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem terzake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1], is opgelegd; of


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 22.2.d
    text: de vreemdeling een gevaar vormt voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel22
  - number: '22.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gronden, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel22
  - number: '23.1'
    text: |-
      De aanvraag tot het verlenen, verlengen of wijzigen van een verblijfsvergunning wordt ingediend door de
      vreemdeling, zijn wettelijk vertegenwoordiger of zijn referent.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van het eerste lid wordt de aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde
      gevallen ingediend door de vreemdeling, zijn wettelijk vertegenwoordiger of zijn erkende referent.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel23
  - number: '23.3'
    text: |-
      In afwijking van [artikel 2:1 van de Algemene wet bestuursrecht][ref1] en in afwijking van het eerste en tweede
      lid, wordt de aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde gevallen ingediend door de
      vreemdeling of zijn wettelijk vertegenwoordiger in persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '24.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24
  - number: 24.1.a
    text: de wijze van indiening en behandeling van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24
  - number: 24.1.b
    text: |-
      het al dan niet in persoon door de vreemdeling, diens wettelijk vertegenwoordiger of diens referent verstrekken van
      gegevens welke van belang zijn voor de aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24
  - number: 24.1.c
    text: |-
      de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede de bij of
      krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling, de referent of aan
      andere belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van beschikkingen ook
      kan geschieden door middel van het toezenden of uitreiken van een document en door het stellen van aantekeningen in
      een daarbij aan te wijzen document.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24
  - number: '24.2'
    text: |-
      De vreemdeling is, in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven regels,
      leges verschuldigd terzake van de afdoening van een aanvraag. Daarbij kan Onze Minister tevens bepalen dat de
      vreemdeling voor de afgifte van een document waaruit het rechtmatig verblijf blijkt leges verschuldigd is. Als
      betaling achterwege blijft, wordt de aanvraag niet in behandeling genomen dan wel het document niet afgegeven.
      [Artikel 4:5, vierde lid, Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 24a.1
    text: 'Gegevens en bescheiden worden niet verkregen van de vreemdeling of diens referent, voor zover:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: 24a.1.a
    text: |-
      Onze Minister die gegevens of bescheiden kan verkrijgen uit bij regeling van Onze Minister aan te wijzen
      administraties, tenzij hierdoor een goede uitvoering van de wet wordt belet, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: 24a.1.b
    text: |-
      de aanvraag is ingediend door de erkende referent, en deze omtrent die gegevens en bescheiden eigen verklaringen
      heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: 24a.2
    text: De eigen verklaringen, bedoeld in het eerste lid, onder b, worden volledig en naar waarheid opgesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: 24a.3
    text: |-
      De aanvrager verstrekt Onze Minister op diens verzoek en al dan niet in persoon alsnog de gegevens en
      bescheiden, die van belang zijn voor de beoordeling van de aanvraag. De aanvrager van een gecombineerde
      vergunning verstrekt Onze Minister de gegevens en bescheiden op basis waarvan kan worden beoordeeld of aan de
      [Wet arbeid vreemdelingen][ref1] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 24a.4
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de gegevens en bescheiden waarop het eerste lid, onder
      a, van toepassing is, en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: 24a.4.a
    text: de administraties of delen daarvan waarvoor het eerste lid, onder a, tijdelijk niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: 24a.4.b
    text: de eigen verklaringen, bedoeld in het eerste lid, onder b,
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: 24a.4.c
    text: de toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel24a
  - number: '25.1'
    text: 'Binnen 90 dagen wordt een beschikking gegeven op de aanvraag tot:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
  - number: 25.1.a
    text: |-
      het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 25.1.b
    text: het verlengen van de geldigheidsduur ervan;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
  - number: 25.1.c
    text: |-
      het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 25.1.d
    text: |-
      het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '25.2'
    text: |-
      De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie, nodig is.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
  - number: '25.3'
    text: Onze Minister stelt de vreemdeling in kennis van de verlenging.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14][ref1] is ingediend door een langdurig ingezetene uit een andere lidstaat van de Europese Unie of
      diens gezinslid, wordt de beschikking in afwijking van het eerste lid gegeven binnen vier maanden, welke termijn
      in afwijking van het tweede lid in bijzondere gevallen verband houdende met de complexiteit van de aanvraag,
      voor ten hoogste drie maanden kan worden verlengd. Indien de langdurig ingezetene of het gezinslid krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2] is uitgenodigd de aanvraag aan te vullen, wordt de
      beschikking gegeven binnen zeven maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '25.5'
    text: |-
      In afwijking van het eerste en tweede lid wordt de beschikking op een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14][ref1] onder een beperking verband houdend met verblijf als houder
      van de Europese blauwe kaart of overplaatsing binnen een onderneming bekend gemaakt binnen 90 dagen en kan die
      termijn niet worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '25.6'
    text: |-
      In afwijking van het eerste en tweede lid wordt de beschikking op een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14][ref1] onder een beperking verband houdend met wetenschappelijk
      onderzoek, studie, lerend werken of uitwisseling in het kader van Europees vrijwilligerswerk bekendgemaakt binnen
      60 dagen en kan die termijn niet worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '26.1'
    text: |-
      De verblijfsvergunning, die van rechtswege rechtmatig verblijf inhoudt, wordt verleend met ingang van de dag waarop
      de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet eerder dan met ingang van de dag
      waarop de aanvraag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel26
  - number: '26.2'
    text: |-
      De geldigheidsduur van de verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] wordt verlengd
      met ingang van de dag waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet
      eerder dan met ingang van de dag na die waarop de geldigheidsduur van de verblijfsvergunning waarvoor verlenging is
      gevraagd afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '26.3'
    text: |-
      Indien de vreemdeling de aanvraag tot verlenging, dan wel de gegevens waaruit blijkt dat aan de voorwaarden wordt
      voldaan niet tijdig heeft ingediend en hem dit niet is toe te rekenen, kan de verblijfsvergunning worden verlengd
      met ingang van de dag na die waarop de geldigheidsduur van de verblijfsvergunning waarvoor verlenging is gevraagd
      afloopt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel26
  - number: '27.1'
    text: |-
      De beschikking waarbij een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 14][ref1] of een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref2]
      wordt afgewezen, geldt als terugkeerbesluit, tenzij reeds eerder een terugkeerbesluit tegen de vreemdeling is
      uitgevaardigd en aan de daaruit voortvloeiende terugkeerverplichting niet is voldaan, en heeft van rechtswege tot
      gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 27.1.a
    text: |-
      de vreemdeling niet langer rechtmatig verblijf heeft tenzij er een andere rechtsgrond voor rechtmatig verblijf van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
  - number: 27.1.b
    text: |-
      de vreemdeling Nederland uit eigen beweging dient te verlaten binnen de in [artikel 62][ref1] gestelde termijn, bij
      gebreke waarvan de vreemdeling kan worden uitgezet, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 27.1.c
    text: |-
      de ambtenaren belast met het toezicht op vreemdelingen, na ommekomst van de termijn waarbinnen de vreemdeling
      Nederland uit eigen beweging dient te verlaten, bevoegd zijn elke plaats te betreden, daaronder begrepen een
      woning, zonder de toestemming van de bewoner, teneinde de vreemdeling uit te zetten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
  - number: '27.2'
    text: 'Het eerste lid is van overeenkomstige toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
  - number: 27.2.a
    text: |-
      ingevolge [artikel 24][ref1] of ingevolge [artikel 4:5 van de Algemene wet bestuursrecht][ref2] is besloten dat de
      aanvraag niet in behandeling wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 27.2.b
    text: het rechtmatig verblijf van rechtswege is geëindigd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
  - number: 27.2.c
    text: een verblijfsvergunning is ingetrokken of de geldigheidsduur ervan niet is verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
  - number: '27.3'
    text: |-
      De gevolgen, bedoeld in het eerste lid, treden niet in indien de vreemdeling bezwaar of beroep heeft ingesteld en
      de werking van de beschikking is opgeschort.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
  - number: '27.4'
    text: De beschikking, bedoeld in het eerste lid, kan tevens een inreisverbod inhouden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel27
  - number: '28.1'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
  - number: 28.1.a
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd in te willigen, af te wijzen, niet in
      behandeling te nemen, niet-ontvankelijk te verklaren dan wel buiten behandeling te stellen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
  - number: 28.1.b
    text: |-
      de aanvraag tot het verlengen van de geldigheidsduur ervan in te willigen, af te wijzen dan wel niet in behandeling
      te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
  - number: 28.1.c
    text: een verblijfsvergunning voor bepaalde tijd in te trekken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
  - number: 28.1.d
    text: |-
      ambtshalve een verblijfsvergunning voor bepaalde tijd te verlenen aan de houder van een geldige machtiging tot
      voorlopig verblijf die voldoet aan de in [artikel 29, tweede lid][ref1], gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 28.1.e
    text: |-
      ambtshalve een verblijfsvergunning voor bepaalde tijd te verlenen aan de langdurig ingezetene,
      afkomstig uit een andere EU-lidstaat en in het bezit van een verblijfsvergunning als bedoeld in
      [artikel 14][ref1], indien de verantwoordelijkheid voor de afgifte van het reisdocument bedoeld in
      [artikel 2, eerste lid, onder d, van de Paspoortwet][ref2], aan de vreemdeling, is overgedragen aan Nederland op
      grond van de Europese Overeenkomst inzake de overdracht van verantwoordelijkheid met betrekking tot vluchtelingen
      van 16 oktober 1980 (Trb. 1981, 239).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '2'
  - number: '28.2'
    text: |-
      De verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur kunnen de gevallen worden aangewezen waarin de verblijfsvergunning voor minder dan
      vijf achtereenvolgende jaren wordt verleend. Daarbij kunnen regels worden gesteld over de geldigheidsduur van de
      verblijfsvergunning en over de verlenging ervan.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
  - number: '28.3'
    text: |-
      De verblijfsvergunning die ambtshalve wordt verleend in de situatie bedoeld in het eerste lid, onder d, wordt
      verleend binnen twee weken nadat de houder van een geldige machtiging tot voorlopig verblijf zich overeenkomstig
      [artikel 54, eerste lid, onder e][ref1], heeft aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '29.1'
    text: |-
      Een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan worden verleend aan de
      vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 29.1.a
    text: die verdragsvluchteling is; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: 29.1.b
    text: |-
      die aannemelijk heeft gemaakt dat hij gegronde redenen heeft om aan te nemen dat hij bij uitzetting een reëel
      risico loopt op ernstige schade, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: 29.1.b.1°
    text: doodstraf of executie;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: 29.1.b.2°
    text: folteringen, onmenselijke of vernederende behandelingen of bestraffingen; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: 29.1.b.3°
    text: |-
      ernstige en individuele bedreiging van het leven of de persoon van een burger als gevolg van willekeurig geweld in
      het kader van een internationaal of binnenlands gewapend conflict.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: '29.2'
    text: |-
      Een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan voorts worden verleend aan
      de hierna te noemen gezinsleden, indien deze op het tijdstip van binnenkomst van de in het eerste lid bedoelde
      vreemdeling behoorden tot diens gezin en gelijktijdig met die vreemdeling Nederland zijn ingereisd dan wel zijn
      nagereisd binnen drie maanden nadat aan die vreemdeling de verblijfsvergunning voor bepaalde tijd, bedoeld in
      artikel 28, is verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 29.2.a
    text: de echtgenoot of het minderjarige kind van de in het eerste lid bedoelde vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: 29.2.b
    text: |-
      de vreemdeling die als partner of meerderjarig kind van de in het eerste lid bedoelde vreemdeling zodanig
      afhankelijk is van die vreemdeling, dat hij om die reden behoort tot diens gezin;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: 29.2.c
    text: |-
      de ouders van de in het eerste lid bedoelde vreemdeling, indien die vreemdeling een alleenstaande minderjarige is
      in de zin van artikel 2, onder f, van Richtlijn 2003/86/EG van de Raad van 22 september 2003 inzake het recht op
      gezinshereniging (PbEU 2003, L 251).
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: '29.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
      Daarbij wordt bepaald in welke gevallen een verblijfsvergunning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
  - number: '29.4'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1], kan eveneens worden verleend aan een
      gezinslid als bedoeld in het tweede lid, dat slechts niet uiterlijk binnen drie maanden is nagereisd nadat aan
      de vreemdeling, bedoeld in het eerste lid, een verblijfsvergunning als bedoeld in artikel 28 is verleend, indien
      binnen die drie maanden door of ten behoeve van dat gezinslid een machtiging tot voorlopig verblijf is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '30.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]
      wordt niet in behandeling genomen, indien op grond van de Dublinverordening is vastgesteld dat een andere lidstaat
      verantwoordelijk is voor de behandeling van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '30.2'
    text: De vreemdeling wordt gehoord over zijn eventuele bezwaren tegen overdracht naar de verantwoordelijke lidstaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30
  - number: '30.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30
  - number: 30a.1
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan
      niet-ontvankelijk worden verklaard in de zin van artikel 33 van de Procedurerichtlijn, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30a.1.a
    text: de vreemdeling in een andere lidstaat van de Europese Unie internationale bescherming geniet;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
  - number: 30a.1.b
    text: |-
      de vreemdeling erkend is als vluchteling in een derde land en hij die bescherming nog kan genieten of anderszins
      voldoende bescherming geniet in dat land, met inbegrip van het beginsel van non-refoulement, en opnieuw tot het
      grondgebied van dat land wordt toegelaten;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
  - number: 30a.1.c
    text: een derde land voor de vreemdeling als veilig derde land wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
  - number: 30a.1.d
    text: |-
      de vreemdeling een opvolgende aanvraag heeft ingediend waaraan door de vreemdeling geen nieuwe elementen of
      bevindingen ten grondslag zijn gelegd of waarin geen nieuwe elementen of bevindingen aan de orde zijn gekomen die
      relevant kunnen zijn voor de beoordeling van de aanvraag; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
  - number: 30a.1.e
    text: |-
      aan de vreemdeling reeds een verblijfsvergunning is verleend op grond van [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30a.2
    text: |-
      Het besluit een aanvraag niet-ontvankelijk te verklaren, wordt voor de toepassing van het bepaalde bij of krachtens
      deze wet gelijkgesteld met een afwijzing.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
  - number: 30a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30a
  - number: 30b.1
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan
      worden afgewezen als kennelijk ongegrond in de zin van artikel 32, tweede lid, van de Procedurerichtlijn, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30b.1.a
    text: |-
      de vreemdeling bij de indiening van zijn aanvraag en de toelichting van de feiten alleen aangelegenheden aan de
      orde heeft gesteld die niet ter zake doen met betrekking tot de vraag of hij in aanmerking komt voor verlening van
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30b.1.b
    text: |-
      de vreemdeling afkomstig is uit een veilig land van herkomst in de zin van de artikelen 36 en 37 van de
      Procedurerichtlijn;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.1.c
    text: |-
      de vreemdeling Onze Minister heeft misleid door omtrent zijn identiteit of nationaliteit valse informatie of
      documenten te verstrekken of door relevante informatie of documenten die een negatieve invloed op de beslissing
      hadden kunnen hebben, achter te houden;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.1.d
    text: |-
      de vreemdeling waarschijnlijk, te kwader trouw, een identiteits- of reisdocument dat ertoe kon bijdragen dat zijn
      identiteit of nationaliteit werd vastgesteld, heeft vernietigd of zich daarvan heeft ontdaan;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.1.e
    text: |-
      de vreemdeling kennelijk inconsequente en tegenstrijdige, kennelijk valse of duidelijk onwaarschijnlijke
      verklaringen heeft afgelegd die strijdig zijn met voldoende geverifieerde informatie over het land van herkomst,
      waardoor zijn verklaringen alle overtuigingskracht wordt ontnomen met betrekking tot de vraag of hij in aanmerking
      komt voor verlening van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30b.1.f
    text: |-
      de vreemdeling zijn aanvraag enkel heeft ingediend teneinde zijn uitzetting of overdracht uit te stellen of te
      verijdelen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.1.g
    text: |-
      de vreemdeling een opvolgende aanvraag heeft ingediend en deze niet overeenkomstig
      [artikel 30a, eerste lid, onderdeel d of e][ref1], niet-ontvankelijk is verklaard;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30b.1.h
    text: |-
      de vreemdeling Nederland onrechtmatig is binnengekomen of zijn verblijf op onrechtmatige wijze heeft verlengd en
      zich, gezien de omstandigheden van zijn binnenkomst, zonder gegronde reden niet zo snel mogelijk bij een ambtenaar
      belast met de grensbewaking of het toezicht op vreemdelingen heeft aangemeld, en daar kenbaar heeft gemaakt dat hij
      internationale bescherming wenst;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.1.i
    text: de vreemdeling weigert te voldoen aan de verplichting zijn vingerafdrukken te laten nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.1.j
    text: de vreemdeling op ernstige gronden een gevaar vormt voor de openbare orde of nationale veiligheid; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.1.k
    text: de vreemdeling onder dwang is uitgezet om ernstige redenen van openbare veiligheid of openbare orde.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30b
  - number: 30c.1
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan
      buiten behandeling worden gesteld in de zin van artikel 28 van de Procedurerichtlijn, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30c.1.a
    text: |-
      de vreemdeling heeft nagelaten te antwoorden op verzoeken om informatie te verstrekken die van wezenlijk belang is
      voor zijn aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30c
  - number: 30c.1.b
    text: |-
      de vreemdeling niet is verschenen bij een gehoor en hij niet binnen een termijn van twee weken heeft aangetoond dat
      dit niet aan hem is toe te rekenen; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30c
  - number: 30c.1.c
    text: |-
      de vreemdeling is verdwenen of zonder toestemming van Onze Minister is vertrokken en hierover toerekenbaar niet
      binnen een termijn van twee weken contact heeft opgenomen met de bevoegde autoriteiten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30c
  - number: 30c.2
    text: |-
      Indien de vreemdeling een nieuwe aanvraag indient nadat zijn aanvraag buiten behandeling is gesteld, wordt deze
      behandeld als een eerste aanvraag, tenzij de vreemdeling eerder een aanvraag heeft gedaan die is afgewezen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30c
  - number: 30c.3
    text: |-
      Het besluit een aanvraag buiten behandeling te stellen, wordt voor de toepassing van het bepaalde bij of krachtens
      deze wet gelijkgesteld met een afwijzing.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30c
  - number: 30c.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel30c
  - number: '31.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]
      wordt afgewezen als ongegrond in de zin van artikel 32, eerste lid, van de Procedurerichtlijn, indien de
      vreemdeling niet aannemelijk heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden die, hetzij op zichzelf,
      hetzij in verband met andere feiten, een rechtsgrond voor verlening vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '31.2'
    text: |-
      De vreemdeling brengt alle elementen ter staving van zijn aanvraag zo spoedig mogelijk naar voren. Onze Minister
      beoordeelt in samenwerking met de vreemdeling de relevante elementen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: '31.3'
    text: |-
      De elementen, bedoeld in het tweede lid, omvatten de verklaringen van de vreemdeling en alle relevante documentatie
      in het bezit van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: '31.4'
    text: 'Bij de beoordeling van de aanvraag wordt onder meer rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: 31.4.a
    text: |-
      alle relevante feiten in verband met het land van herkomst op het tijdstip waarop een beslissing inzake de aanvraag
      wordt genomen, met inbegrip van wettelijke en bestuursrechtelijke bepalingen van het land van herkomst en de wijze
      waarop deze worden toegepast;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: 31.4.b
    text: |-
      de door de vreemdeling afgelegde verklaring en overgelegde documenten, samen met informatie over de vraag
      of de vreemdeling aan vervolging in de zin van het Vluchtelingenverdrag of ernstige schade als bedoeld in
      [artikel 29, eerste lid, onder b][ref1], blootgesteld is dan wel blootgesteld zou kunnen worden;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 31.4.c
    text: |-
      de individuele situatie en persoonlijke omstandigheden van de vreemdeling, waartoe factoren behoren als
      achtergrond, geslacht en leeftijd, teneinde te beoordelen of op basis van de persoonlijke omstandigheden van de
      vreemdeling, de daden waaraan hij blootgesteld is of blootgesteld zou kunnen worden, met vervolging in de zin van
      het Vluchtelingenverdrag of ernstige schade als bedoeld in [artikel 29, eerste lid, onder b][ref1], overeenkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 31.4.d
    text: |-
      de vraag of zijn activiteiten, sinds hij zijn land van herkomst of een land van eerder verblijf heeft
      verlaten, uitsluitend ten doel hadden de nodige voorwaarden te scheppen om een verzoek om internationale
      bescherming te kunnen indienen, teneinde na te gaan of de vreemdeling, in geval van terugkeer naar dat land,
      door die activiteiten aan vervolging in de zin van het Vluchtelingenverdrag of ernstige schade als bedoeld in
      [artikel 29, eerste lid, onder b][ref1], zou worden blootgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 31.4.e
    text: |-
      de vraag of in redelijkheid kan worden verwacht dat de vreemdeling zich onder de bescherming kan stellen van een
      ander land waar hij zich op zijn nationaliteit kan beroepen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: '31.5'
    text: |-
      Het feit dat de vreemdeling in het verleden reeds is blootgesteld aan vervolging in de zin van het
      Vluchtelingenverdrag of ernstige schade als bedoeld in [artikel 29, eerste lid, onder b][ref1], of dat hij hiermee
      rechtstreeks is bedreigd, is een duidelijke aanwijzing dat de vrees van de vreemdeling voor die vervolging gegrond
      is en het risico op die ernstige schade reëel is, tenzij er goede redenen zijn om aan te nemen dat die vervolging
      of die ernstige schade zich niet opnieuw zal voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '31.6'
    text: |-
      Indien de vreemdeling zijn verklaringen of een deel van zijn verklaringen niet met documenten kan onderbouwen,
      worden deze verklaringen geloofwaardig geacht en wordt de vreemdeling het voordeel van de twijfel gegund, wanneer
      aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: 31.6.a
    text: de vreemdeling heeft een oprechte inspanning geleverd om zijn aanvraag te staven;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: 31.6.b
    text: |-
      alle relevante elementen waarover de vreemdeling beschikt, zijn overgelegd, en er is een bevredigende verklaring
      gegeven omtrent het ontbreken van andere relevante elementen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: 31.6.c
    text: |-
      de verklaringen van de vreemdeling zijn samenhangend en aannemelijk bevonden en zijn niet in strijd met beschikbare
      algemene en specifieke informatie die relevant is voor zijn aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: 31.6.d
    text: |-
      de vreemdeling heeft zijn aanvraag zo spoedig mogelijk ingediend, tenzij hij goede redenen kan aanvoeren waarom hij
      dit heeft nagelaten; en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: 31.6.e
    text: vast is komen te staan dat de vreemdeling in grote lijnen als geloofwaardig kan worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: '31.7'
    text: |-
      Een aanvraag wordt niet onder verwijzing naar een eerdere afwijzende beslissing afgewezen indien de door de
      vreemdeling bij de aanvraag aangevoerde elementen en bevindingen grond bieden voor het vermoeden dat sprake is van
      bijzondere, op de individuele zaak betrekking hebbende, feiten en omstandigheden die hieraan in de weg staan.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: '31.8'
    text: |-
      Een aanvraag van een gezinslid als bedoeld in [artikel 29, tweede lid][ref1], tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref2] kan worden afgewezen, indien
      gezinshereniging mogelijk is in een derde land waarmee de vreemdeling, bedoeld in artikel 29, eerste lid, of het
      desbetreffende gezinslid bijzondere banden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '31.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het eerste tot
      en met achtste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel31
  - number: '32.1'
    text: |-
      De verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan worden ingetrokken dan wel de
      aanvraag voor verlenging van de geldigheidsduur ervan kan worden afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 32.1.a
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel32
  - number: 32.1.b
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel32
  - number: 32.1.c
    text: |-
      de grond voor verlening, bedoeld in [artikel 29][ref1], is komen te vervallen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 32.1.d
    text: de vreemdeling zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel32
  - number: 32.1.e
    text: |-
      het een vergunning betreft die is verleend aan een gezinslid als bedoeld in [artikel 29, tweede lid][ref1], en dat
      gezinslid niet of niet langer een werkelijk huwelijks- of gezinsleven onderhoudt met de vreemdeling, bedoeld in het
      artikel 29, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '32.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
      Daarbij wordt bepaald in welke gevallen een verblijfsvergunning als bedoeld in het eerste lid die is verleend
      op grond van [artikel 29, eerste lid][ref1], wordt ingetrokken dan wel de aanvraag voor verlenging van de
      geldigheidsduur van zodanige verblijfsvergunning wordt afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '33'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel33
  - number: 33.a
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel33
  - number: 33.b
    text: een verleende verblijfsvergunning voor onbepaalde tijd in te trekken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel33
  - number: 33.c
    text: |-
      ambtshalve een verblijfsvergunning voor onbepaalde tijd te verlenen aan de vreemdeling wiens EU-verblijfsvergunning
      voor langdurig ingezetenen is ingetrokken, indien op het aan de vreemdeling verschafte document, bedoeld in
      [artikel 9][ref1], de aantekening, bedoeld in [artikel 45c, eerste lid][ref2], was geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 33.d
    text: |-
      ambtshalve een verblijfsvergunning voor onbepaalde tijd te verlenen aan de langdurig ingezetene,
      afkomstig uit een andere EU-lidstaat en in het bezit van een vergunning als bedoeld in
      [artikel 20][ref1], indien de verantwoordelijkheid voor de afgifte van het reisdocument bedoeld in
      [artikel 2, eerste lid, onder d, van de Paspoortwet][ref2] voor betrokken vreemdeling aan Nederland is
      overgedragen op grond van de Europese Overeenkomst inzake de overdracht van verantwoordelijkheid met betrekking tot
      vluchtelingen van 16 oktober 1980 (Trb. 1981, 239).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '2'
  - number: '34.1'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1]
      van de vreemdeling die direct voorafgaande aan de aanvraag, gedurende vijf achtereenvolgende jaren rechtmatig
      verblijf heeft genoten als bedoeld in [artikel 8, onder c][ref2], kan slechts worden afgewezen indien zich op het
      moment waarop de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref3],
      afloopt, een grond als bedoeld in [artikel 32][ref4] voordoet, dan wel indien de vreemdeling het examen, bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref5], of een diploma, certificaat of ander document,
      bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref6], niet heeft behaald. De periode van verblijf
      op grond van [artikel 14][ref7], van de vreemdeling aan wie op grond van artikel 28, eerste lid, onderdeel e,
      ambtshalve een verblijfsvergunning voor bepaalde tijd is verleend, wordt aangemerkt als rechtmatig verblijf als
      bedoeld in artikel 8, onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0020611#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel34
    references:
      - id: ref1
