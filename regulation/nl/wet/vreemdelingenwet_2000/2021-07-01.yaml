  - number: '76.1'
    text: |-
      Indien bezwaar wordt gemaakt tegen een beschikking omtrent de afgifte van de machtiging tot voorlopig
      verblijf, bedoeld in [artikel 1a, onderdeel b][ref1], de verblijfsvergunning, bedoeld in [artikel 14][ref2]
      of [20][ref3], dan wel de ongewenstverklaring, bedoeld in [artikel 67][ref4], wordt in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref5] beslist binnen negentien weken, gerekend vanaf
      de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel7
