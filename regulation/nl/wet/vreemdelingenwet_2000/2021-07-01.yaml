  - number: 8.l
    text: indien de vreemdeling verblijfsrecht ontleent aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel8
  - number: 8.m
    text: |-
      indien de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28][ref1] niet in behandeling is genomen op grond van [artikel 30][ref2] terwijl hij in afwachting is van
      de feitelijke overdracht naar een verantwoordelijke lidstaat in de zin van de Dublinverordening.


