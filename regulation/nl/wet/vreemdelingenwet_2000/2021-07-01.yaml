        afdeling: '2'
  - number: '108.2'
    text: |-
      Overtreding van een voorschrift, vastgesteld bij of krachtens [artikel 4, eerste tot en met derde lid][ref1], wordt
      gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
        hoofdstuk: '2'
  - number: '108.3'
    text: De in het eerste en tweede lid strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel108
  - number: '108.4'
    text: |-
      Met de opsporing van de in het eerste en tweede lid strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren belast met de grensbewaking en
      ambtenaren belast met het vreemdelingentoezicht. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor
      zover deze feiten betrekking hebben op een aanwijzing, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '108.5'
    text: |-
      In afwijking van het eerste lid wordt handelen in strijd met een verplichting, opgelegd bij of krachtens
      [artikel 54, eerste lid, onder b, e of g][ref1], gestraft met geldboete van de tweede categorie, indien het
      feit wordt begaan door een gemeenschapsonderdaan. Het derde lid en de eerste volzin van het vierde lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '108.6'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de vreemdeling die in Nederland verblijft
      terwijl hij weet of ernstige reden heeft te vermoeden dat tegen hem een inreisverbod is uitgevaardigd, indien het
      inreisverbod is gegeven anders dan met toepassing van [artikel 66a, zevende lid][ref1]. Het derde lid en de eerste
      volzin van het vierde lid zijn eveneens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 66a
        hoofdstuk: '6'
        afdeling: '3'
  - number: '109.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter uitvoering van een voor Nederland bindend verdrag, EU-verordening,
      -richtlijn of -besluit, bepalingen van deze wet geheel of gedeeltelijk buiten werking worden gesteld, indien dat,
      naar het gevoelen van de Ministerraad, noodzakelijk is om binnen twaalf maanden uitvoering te geven aan het verdrag
      of het besluit en daartoe deze wet in overeenstemming moet worden gebracht met het verdrag of het besluit.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109
  - number: '109.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109
  - number: '109.3'
    text: |-
      Onze Minister bevordert dat zo spoedig mogelijk na de vaststelling van een krachtens het eerste lid vastgestelde
      algemene maatregel van bestuur een voorstel van wet bij de Staten-Generaal wordt ingediend, dat ertoe strekt de
      wet in overeenstemming te brengen met het verdrag of besluit, bedoeld in het eerste lid. Indien het voorstel wordt
      ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt
      de algemene maatregel van bestuur terstond ingetrokken. Indien het voorstel tot wet wordt verheven, vervalt de
      algemene maatregel van bestuur op het tijdstip van inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109
  - number: '109.4'
    text: |-
      Ter uitvoering van een verdrag, EU-verordening, -richtlijn of -besluit, op grond waarvan de
      grenscontrole plaatsvindt aan buitengrenzen, wordt in de [artikelen 5, tweede lid][ref1],
      [54, eerste lid, aanhef en onder a en e][ref2], [56, tweede lid][ref3], [59, derde lid][ref4], en
      [66a, vierde lid][ref5], onder «Nederland» mede verstaan de gebieden waarop dat verdrag, die verordening, die
      richtlijn of dat besluit van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '56'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: 66a
        hoofdstuk: '6'
        afdeling: '3'
  - number: '109.5'
    text: |-
      Ter uitvoering van een verdrag, EU-verordening, -richtlijn of -besluit, bedoeld in het vierde lid, wordt in
      [artikel 3, eerste lid][ref1], en [artikel 12, eerste lid][ref2], onder «openbare orde» alsmede «nationale
      veiligheid» steeds mede verstaan de openbare orde in, onderscheidenlijk de nationale veiligheid van andere bij dat
      verdrag aangesloten staten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '12'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 109a
    text: |-
      De verplichtingen die voor Nederland voortvloeien uit de Terugkeerrichtlijn, gelden niet ten aanzien van
      vreemdelingen:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109a
  - number: 109a.a
    text: |-
      aan wie, anders dan na indiening van een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd
      als bedoeld in [artikel 28][ref1], de toegang is geweigerd overeenkomstig artikel 14 van de Schengengrenscode en
      die vervolgens geen rechtmatig verblijf als bedoeld in [artikel 8][ref2] hebben verkregen; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 109a.b
    text: |-
      jegens wie een procedure van uitlevering als bedoeld in de [Uitleveringswet][ref1] loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0002559
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0002559
  - number: '110.1'
    text: |-
      Onverminderd de artikelen [7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-president, [artikel 111][ref3] in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel111
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '111'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '110.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel110
  - number: '110.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-president, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel110
  - number: '110.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-president, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel110
  - number: '110.5'
    text: |-
      Het besluit als bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel110
  - number: '110.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel110
  - number: '111'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels voor het geval van buitengewone omstandigheden worden gesteld, die
      afwijken van de [hoofdstukken 1 tot en met 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '1'
  - number: '112'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van een verdrag, dan wel van een voor
      Nederland verbindend besluit van een volkenrechtelijke organisatie regels worden gesteld in verband met het
      rechtmatig verblijf van vreemdelingen, waarbij ten gunste van deze vreemdelingen kan worden afgeweken van deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel112
  - number: '114'
    text: |-
      Een vreemdeling aan wie de verblijfsvergunning als bedoeld in [artikel 28][ref1] of [artikel 33][ref2] is verleend,
      geniet dezelfde behandeling als een Nederlander, wat betreft rechtsingang, waaronder begrepen rechtsbijstand en
      vrijstelling van de cautio judicatum solvi.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '115.1'
    text: |-
      De bevoegdheid van Onze Minister om op grond van [artikel 106a][ref1] een gezichtsopname en vingerafdrukken
      van een vreemdeling af te nemen en te verwerken, vervalt twaalf jaar na de inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________ (Stb. 2014, 2).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106a
      [ref2]: https://wetten.overheid.nl/BWBR0034673
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 106a
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0034673
  - number: '115.2'
    text: |-
      De in de vreemdelingenadministratie opgenomen gegevens, bedoeld in [artikel 107, eerste lid, onderdeel a][ref1],
      worden twaalf jaar na de inwerkingtreding van de in het eerste lid bedoelde [wet van 11 december 2013][ref2]
      vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0034673
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0034673
  - number: '115.3'
    text: |-
      Onze Minister bevordert dat uiterlijk drie maanden na het tijdstip, bedoeld in
      het eerste en het tweede lid, een voorstel van wet bij de Tweede Kamer der Staten-
      Generaal wordt ingediend, waarbij de wijzigingen die in deze wet zijn aangebracht door
      [artikel I, onderdelen A, D en E, van de in het eerste lid bedoelde wet van 11 december 2013][ref1], ongedaan
      worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0034673#ArtikelI
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0034673
        artikel: I
  - number: '124'
    text: 'Deze wet wordt aangehaald als: Vreemdelingenwet 2000.'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel124
