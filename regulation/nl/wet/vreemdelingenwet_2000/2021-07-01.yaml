    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: 83.0a
    text: |-
      Indien beroep is ingesteld tegen een besluit dat een gelijke strekking heeft als een besluit dat eerder ten aanzien
      van de indiener van het beroepschrift is genomen, zal dit besluit, ook bij het ontbreken van nieuw gebleken feiten
      of veranderde omstandigheden of een relevante wijziging van het recht, worden beoordeeld als ware het een eerste
      afwijzing indien hier wegens bijzondere, op de individuele zaak betrekking hebbende, feiten en omstandigheden, de
      noodzaak toe bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83.0a
  - number: 83a
    text: |-
      De toetsing van de rechtbank omvat een volledig en ex nunc onderzoek naar zowel de feitelijke als de juridische
      gronden, met inbegrip van, indien van toepassing, een onderzoek naar de behoefte aan internationale bescherming.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83a
  - number: 83b.1
    text: |-
      Indien de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28][ref1] is afgewezen binnen een bij algemene maatregel van bestuur te bepalen aantal dagen, dat niet
      de dagen van de rust- en voorbereidingstermijn omvat, doet de rechtbank binnen vier weken na het instellen van het
      beroep uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 83b.2
    text: |-
      Indien de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28][ref1] is afgewezen in andere dan de in het eerste lid bedoelde gevallen, doet de rechtbank binnen
      drieëntwintig weken na het instellen van het beroep uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83b
    references:
