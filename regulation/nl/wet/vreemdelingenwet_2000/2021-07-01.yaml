  - number: '72.2'
    text: |-
      Een beschikking omtrent de afgifte van een visum, waaronder begrepen een machtiging tot voorlopig verblijf, wordt
      voor de toepassing van dit hoofdstuk gelijkgesteld met een beschikking omtrent een verblijfsvergunning regulier
      gegeven krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel72
  - number: '72.3'
    text: |-
      Voor de toepassing van deze afdeling wordt met een beschikking tevens gelijkgesteld een handeling van een
      bestuursorgaan ten aanzien van een vreemdeling als zodanig, waaronder begrepen het niet verlenen van de
      verblijfsvergunning overeenkomstig [artikel 14, tweede lid][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '72.4'
    text: |-
      Voor de toepassing van deze afdeling wordt met een beschikking eveneens gelijk gesteld een kennisgeving als bedoeld
      in [artikel 62a, eerste lid][ref1] of [artikel 62b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel62b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel72
