  - number: '83.3'
    text: |-
      Met de in het eerste lid bedoelde gegevens wordt geen rekening gehouden voor zover de goede procesorde zich
      daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: '83.4'
    text: |-
      Indien de indiener van het beroepschrift zich beroept op feiten of omstandigheden als bedoeld in het eerste lid,
      onderdeel a, maar deze niet aanstonds aannemelijk maakt, stelt de rechtbank hem zo nodig in de gelegenheid deze
      feiten of omstandigheden binnen een door de rechtbank te bepalen termijn alsnog aannemelijk te maken, tenzij de
      goede procesorde zich daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: '83.5'
    text: |-
      Onze Minister laat de wederpartij en de rechtbank zo spoedig mogelijk schriftelijk weten of de gegevens, bedoeld
      in het eerste lid, aanleiding zijn voor handhaving, wijziging of intrekking van het bestreden besluit. De rechtbank
      kan daarvoor een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: '83.6'
    text: |-
      Indien Onze Minister zich beroept op gegevens als bedoeld in het eerste lid, biedt de rechtbank de vreemdeling de
      gelegenheid om daarop schriftelijk te reageren.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: '83.7'
    text: 'Het vijfde en zesde lid zijn niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: 83.7.a
    text: aan een schriftelijke reactie redelijkerwijs geen behoefte bestaat;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: 83.7.b
    text: |-
      deze gegevens niet relevant kunnen zijn voor de beschikking omtrent de verblijfsvergunning, bedoeld in de
      [artikelen 28][ref1] en [33][ref2] of de EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling
      die in het bezit is van een verblijfsvergunning als bedoeld in artikel 28 of 33, een beschikking omtrent de
      intrekking van de EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling op wiens document, bedoeld
      in [artikel 9][ref3], de aantekening, bedoeld in [artikel 45c, eerste lid][ref4], is geplaatst, of omtrent de
      ambtshalve verlening van een vergunning als bedoeld in [artikel 14][ref5], dan wel het achterwege laten van de
      uitzetting of overdracht op grond van [artikel 64][ref6];


