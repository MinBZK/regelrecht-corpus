        paragraaf: '3'
        afdeling: '3'
  - number: 45f.1
    text: |-
      Indien Onze Minister voornemens is de aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig
      ingezetenen af te wijzen en de vreemdeling in het bezit is van een verblijfsvergunning als bedoeld in
      [artikel 28][ref1] of [artikel 33][ref2], is het bij of krachtens [artikel 39][ref3] bepaalde van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: 45f.2
    text: |-
      Indien Onze Minister voornemens is de aanvraag van de vreemdeling die in het bezit is van een verblijfsvergunning
      als bedoeld in [artikel 28][ref1] of [artikel 33][ref2], tot het verlenen van een EU-verblijfsvergunning voor
      langdurig ingezetenen in te willigen, zonder op het aan de vreemdeling te verstrekken document, bedoeld in
      [artikel 9][ref3], de aantekening als bedoeld in [artikel 45c, eerste lid][ref4], te plaatsen, is het bij of
      krachtens [artikel 39][ref5] bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: 45c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: 45f.3
    text: |-
      Indien Onze Minister voornemens is om de EU-verblijfsvergunning voor langdurig ingezetenen met op het
      aan de vreemdeling verstrekte document, bedoeld in [artikel 9][ref1], de aantekening als bedoeld in
      [artikel 45c, eerste lid][ref2], in te trekken, is [artikel 41][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel41
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: 45g.1
    text: |-
      De beschikking op de aanvraag tot het verlenen van de EU-verblijfsvergunning voor langdurig ingezetenen wordt
      bekendgemaakt uiterlijk zes maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45g
  - number: 45g.2
    text: |-
      De termijn voor de bekendmaking van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden
      worden verlengd, indien er naar het oordeel van Onze Minister sprake is van bijzondere omstandigheden die verband
      houden met het complexe karakter van de behandeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45g
  - number: 45g.3
    text: Onze Minister stelt de vreemdeling in kennis van de verlenging.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45g
  - number: 45g.4
    text: |-
      De dag waarop de termijn, bedoeld in het eerste dan wel tweede lid, is verstreken geldt voor de toepassing van
      [artikel 4:17, derde lid, van de Algemene wet bestuursrecht][ref1] als de dag waarop de termijn voor het geven van
      de beschikking is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 45h.1
    text: |-
      De EU-verblijfsvergunning voor langdurig ingezetenen wordt verleend met ingang van de datum waarop de vreemdeling
      heeft aangetoond dat hij aan alle voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45h
  - number: 45h.2
    text: |-
      Indien de vreemdeling de aanvraag tot verlening van de EU-verblijfsvergunning voor langdurig ingezetenen dan wel de
      gegevens waaruit blijkt dat aan de voorwaarden wordt voldaan, niet tijdig heeft ingediend en hem dit niet is toe te
      rekenen, wordt de EU-verblijfsvergunning voor langdurig ingezetenen verleend met ingang van de dag na die waarop de
      geldigheidsduur van de verblijfsvergunning, bedoeld in [artikel 14][ref1] dan wel [artikel 28][ref2] afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45h
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '46.1'
    text: |-
      Met het toezicht op de naleving en de uitvoering van de Schengengrenscode en de wettelijke voorschriften met
      betrekking tot de grensbewaking zijn belast:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
  - number: 46.1.a
    text: de ambtenaren van de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
  - number: 46.1.b
    text: |-
      de ambtenaren die zijn tewerkgesteld bij de regionale eenheid in het gebied waarin de haven van Rotterdam is
      gelegen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
  - number: 46.1.c
    text: |-
      de directeur van een grenslogies als bedoeld in [artikel 3 van het Reglement regime grenslogies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005848#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005848
        artikel: '3'
  - number: 46.1.d
    text: |-
      de bij besluit van Onze Minister, in overeenstemming met Onze Ministers van Binnenlandse
      Zaken en Koninkrijksrelaties en van Defensie, aangewezen ambtenaren van politie als bedoeld in
      [artikel 2, onder a, c en d, van de Politiewet 2012][ref1] die zijn aangesteld voor de uitvoering van de
      politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '46.2'
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
  - number: 46.2.a
    text: de in het belang van de grensbewaking te treffen voorzieningen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
  - number: 46.2.b
    text: de verplichtingen waaraan personen zijn onderworpen met het oog op de controle in het belang van de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
  - number: '46.3'
    text: |-
      De bij of krachtens het eerste lid aangewezen ambtenaren belast met de grensbewaking zijn de in artikel 2, onder
      14, van de Schengengrenscode bedoelde grenswachters.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel46
  - number: '47.1'
    text: 'Met het toezicht op de naleving van de wettelijke voorschriften met betrekking tot vreemdelingen zijn belast:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47
  - number: 47.1.a
    text: |-
      de ambtenaren van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn
      aangesteld voor de uitvoering van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 47.1.b
    text: de ambtenaren van de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47
  - number: 47.1.c
    text: de bij besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47
  - number: '47.2'
    text: |-
      De ambtenaren van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn
      aangesteld voor de uitvoering van de politietaak oefenen het toezicht op vreemdelingen uit onder leiding van de
      korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '47.3'
    text: |-
      De ambtenaren van de Koninklijke marechaussee oefenen het toezicht op vreemdelingen uit onder leiding van de
      Commandant der Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47
  - number: 47a.1
    text: |-
      Met het toezicht op de naleving van de wettelijke voorschriften met betrekking tot referenten zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47a
  - number: 47a.2
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister en Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties kan worden bepaald dat met het toezicht op de naleving van de wettelijke
      voorschriften met betrekking tot referenten tevens zijn belast de ambtenaren van politie, bedoeld in
      [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn aangesteld voor de uitvoering van de
      politietaak, in welk geval [artikel 47, tweede lid][ref2], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '48.1'
    text: |-
      De korpschef en de Commandant der Koninklijke marechaussee geven Onze Minister door hem gevraagde inlichtingen over
      de uitvoering van deze wet en van de Schengengrenscode.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister kan aan de korpschef en aan de Commandant der Koninklijke marechaussee aanwijzingen geven over
      de uitvoering van deze wet en van de Schengengrenscode. Onze Minister kan individuele aanwijzingen geven aan de
      ambtenaren, bedoeld in de [artikelen 47, eerste lid][ref1], en [47a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 47a
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '48.3'
    text: 'Onze Minister kan aanwijzingen geven over de inrichting van de werkprocessen en bedrijfsvoering aan:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel48
  - number: 48.3.a
    text: de korpschef, door tussenkomst van Onze Minister van Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel48
  - number: 48.3.b
    text: de Commandant der Koninklijke marechaussee, door tussenkomst van de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel48
  - number: '48.4'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel48
  - number: '49.1'
    text: |-
      Op de uitoefening van de in deze paragraaf bedoelde bevoegdheden zijn, voor zover nodig, de artikelen [5:12][ref1],
      [5:13][ref2] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '49.2'
    text: |-
      Op de uitoefening door de ambtenaren belast met de grensbewaking van de uit de
      Schengengrenscode voortvloeiende taken zijn de [artikelen 5:12][ref1], [5:13][ref2] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3] eveneens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '49.3'
    text: |-
      Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste en tweede lid
      bedoelde bevoegdheden en taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '50.1'
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen, zijn bevoegd,
      hetzij op grond van feiten en omstandigheden die, naar objectieve maatstaven gemeten, een redelijk vermoeden van
      illegaal verblijf opleveren hetzij ter bestrijding van illegaal verblijf na grensoverschrijding, personen staande
      te houden ter vaststelling van hun identiteit, nationaliteit en verblijfsrechtelijke positie. Degene die stelt
      Nederlander te zijn, maar dat niet kan aantonen, kan worden onderworpen aan de dwangmiddelen als bedoeld in het
      tweede en vijfde lid. Bij algemene maatregel van bestuur worden de documenten aangewezen waarover een vreemdeling
      moet beschikken ter vaststelling van zijn identiteit, nationaliteit en verblijfsrechtelijke positie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50
  - number: '50.2'
    text: |-
      Indien de identiteit van de staande gehouden persoon niet onmiddellijk kan worden vastgesteld, mag hij worden
      overgebracht naar een plaats bestemd voor verhoor. Hij wordt aldaar niet langer dan gedurende zes uren opgehouden,
      met dien verstande, dat de tijd tussen middernacht en negen uur voormiddags niet wordt meegerekend.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de identiteit van de staande gehouden persoon onmiddellijk kan worden vastgesteld en indien blijkt dat deze
      persoon geen rechtmatig verblijf geniet, dan wel niet onmiddellijk blijkt dat hij rechtmatig verblijf heeft, mag
      hij worden overgebracht naar een plaats bestemd voor verhoor. Hij wordt aldaar niet langer dan gedurende zes uren
      opgehouden, met dien verstande, dat de tijd tussen middernacht en negen uur voormiddags niet wordt meegerekend.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50
  - number: '50.4'
    text: |-
      Indien nog grond bestaat voor het vermoeden dat de opgehouden persoon geen rechtmatig verblijf heeft, kan de in
      het tweede en derde lid bepaalde termijn door de Commandant der Koninklijke marechaussee respectievelijk door de
      korpschef in het belang van het onderzoek met ten hoogste acht en veertig uren worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50
  - number: '50.5'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd de opgehouden persoon aan diens kleding of lichaam te
      onderzoeken, alsmede zaken van deze persoon te doorzoeken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50
  - number: '50.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gegeven omtrent de toepassing van de voorgaande leden van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50
  - number: 50a.1
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen, zijn bevoegd
      een vreemdeling die rechtmatig verblijf heeft als bedoeld in [artikel 8, aanhef en onder f tot en met h en m][ref1]
      staande te houden, over te brengen naar een plaats bestemd voor verhoor en aldaar op te houden, indien dit
      nodig is voor de voorbereiding van een besluit omtrent inbewaringstelling van de vreemdeling op grond van
      [artikel 59, eerste lid, aanhef en onder b][ref2], [59a][ref3] of [59b][ref4]. De ophouding duurt ten hoogste zes
      uren, met dien verstande dat de tijd tussen middernacht en negen uur voormiddags niet wordt meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59a
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: 59b
        hoofdstuk: '5'
  - number: 50a.2
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd de opgehouden persoon aan diens kleding of lichaam te
      onderzoeken, alsmede zaken van deze persoon te doorzoeken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50a
  - number: 50a.3
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gegeven omtrent de toepassing van de voorgaande leden van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel50a
  - number: '51.1'
    text: |-
      Indien de ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen op
      grond van feiten en omstandigheden, naar objectieve maatstaven gemeten, een redelijk vermoeden hebben dat met
      een vervoermiddel personen worden vervoerd met betrekking tot wie zij een toezichthoudende taak hebben, zijn
      zij bevoegd het vervoermiddel te onderzoeken. De ambtenaren zijn in dat geval bevoegd van de bestuurder van het
      voertuig of van de schipper van het vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hen
      aangewezen plaats overbrengt teneinde het vervoermiddel te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel51
  - number: '51.2'
    text: |-
      [Artikel 5:19, vijfde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de
      vordering als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.3'
    text: |-
      Indien de ambtenaren belast met de grensbewaking op grond van feiten en omstandigheden, naar objectieve maatstaven
      gemeten, een redelijk vermoeden hebben dat met een luchtvaartuig personen worden vervoerd met betrekking tot wie
      zij een toezichthoudende taak hebben, zijn zij bevoegd het luchtvaartuig te onderzoeken. De ambtenaren zijn in dat
      geval bevoegd van de gezagvoerder van een luchtvaartuig te vorderen dat deze zijn luchtvaartuig naar een door hen
      aangewezen plaats overbrengt teneinde het luchtvaartuig te onderzoeken. Bij of krachtens algemene maatregel van
      bestuur kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel51
  - number: '52.1'
    text: |-
      Onze Minister, de ambtenaren, belast met de grensbewaking, en de ambtenaren, belast met het toezicht op
      vreemdelingen, zijn bevoegd om, ter vervulling van hun taken, reis- en identiteitspapieren van personen in te
      nemen, tijdelijk in bewaring te nemen alsmede om hierin aantekeningen te maken. Bij of krachtens algemene maatregel
      van bestuur worden hierover nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel52
  - number: '52.2'
    text: |-
      Het reis- of identiteitspapier wordt aan de vreemdeling teruggegeven indien hij te kennen geeft Nederland te
      willen verlaten en hij ook daadwerkelijk vertrekt. Ingeval van uitzetting kan het reis- en identiteitspapier worden
      overgedragen aan de persoon belast met de grensbewaking in het land waar de toelating is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel52
  - number: '53.1'
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      een woning te betreden zonder toestemming van de bewoner, indien er op grond van feiten en omstandigheden, naar
      objectieve maatstaven gemeten, een redelijk vermoeden bestaat dat op deze plaats een vreemdeling verblijft die geen
      rechtmatig verblijf heeft.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53
  - number: '53.2'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn tevens bevoegd elke plaats te betreden, daar onder begrepen een
      woning zonder de toestemming van de bewoner, voor zover dat nodig is ter uitzetting van de vreemdeling dan wel voor
      de inbewaringstelling van de vreemdeling op grond van [artikel 59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: 53a.1
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen, zijn, na
      een woning te hebben betreden en na aldaar een vreemdeling staande te hebben gehouden wiens identiteit niet
      onmiddellijk kan worden vastgesteld, bevoegd deze woning te doorzoeken zonder toestemming van de bewoner voor
      zover dat redelijkerwijs noodzakelijk is voor de tijdelijke inbewaringneming van zaken waaruit de identiteit van de
      betrokken vreemdeling met een redelijke mate van zekerheid kan worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53a
  - number: 53a.2
    text: |-
      De ambtenaren zijn tevens bevoegd elke bij een onderneming behorende ruimte te betreden en te doorzoeken voor
      zover dat redelijkerwijs noodzakelijk is voor de in het eerste lid bedoelde zaken, indien een staande gehouden
      vreemdeling wiens identiteit niet onmiddellijk kan worden vastgesteld, in die onderneming werkzaam is en indien
      vermoed wordt dat de vreemdeling een bij de onderneming behorende ruimte als woonruimte gebruikt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53a
  - number: 53a.3
    text: |-
      Tot doorzoeking voor de tijdelijke inbewaringneming van zaken waaruit de identiteit van de betrokken vreemdeling
      met een redelijke mate van zekerheid kan worden afgeleid wordt niet overgegaan dan nadat de vreemdeling is
      uitgenodigd deze vrijwillig af te geven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53a
  - number: 53a.4
    text: |-
      De doorzoeking vindt slechts plaats voor zover dit redelijkerwijs niet leidt tot substantiële schade aan de ruimte
      of aan de zaken die zich in deze ruimte bevinden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53a
  - number: 53a.5
    text: De doorzoeking vindt slechts plaats in aanwezigheid van een bevoegd ambtenaar, tevens hulpofficier van Justitie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53a
  - number: 53a.6
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn tevens bevoegd in afwachting van de komst van de ambtenaar,
      bedoeld in het vijfde lid, de maatregelen te nemen die redelijkerwijs nodig zijn om wegmaking, onbruikbaarmaking,
      onklaarmaking of beschadiging van de voor tijdelijke inbewaringneming vatbare voorwerpen te voorkomen. Deze
      maatregelen kunnen de vrijheid van de personen die zich ter plaatse bevinden beperken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53a
  - number: 53b.1
    text: |-
      [Artikel 10 van de Algemene wet op het binnentreden][ref1] is van overeenkomstige toepassing op de bevoegdheid
      tot doorzoeking.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
  - number: 53b.2
    text: |-
      In aanvulling op [artikel 10 van de Algemene wet op het binnentreden][ref1] vermeldt de ambtenaar die de
      doorzoeking, bedoeld in [artikel 53a, eerste en tweede lid][ref2], heeft verricht, in het schriftelijk verslag op
      welke gronden werd aangenomen dat deze redelijkerwijs noodzakelijk was voor de tijdelijke inbewaringneming van de
      zaken, bedoeld in artikel 53a, eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel53a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: 53b.3
    text: Het verslag wordt toegezonden aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel53b
  - number: '54.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ten aanzien van vreemdelingen worden voorzien in een
      verplichting tot:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.1.a
    text: het kennis geven van verandering van woon- of verblijfplaats binnen Nederland en van vertrek naar het buitenland;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.1.b
    text: |-
      het al dan niet in persoon verstrekken van gegevens welke van belang kunnen zijn voor de toepassing van de bij of
      krachtens deze wet gestelde regels;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.1.c
    text: het verlenen van medewerking aan het vastleggen van gegevens met het oog op identificatie;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.1.d
    text: |-
      het verlenen van medewerking aan een medisch onderzoek naar een ziekte aangewezen bij of krachtens de
      [Wet publieke gezondheid][ref1], ter bescherming van de volksgezondheid of in het kader van de beoordeling van een
      aanvraag om een verblijfsvergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 54.1.e
    text: aanmelding binnen een bepaalde termijn na binnenkomst in Nederland;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.1.f
    text: periodieke aanmelding;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.1.g
    text: |-
      het inleveren van het document of schriftelijke verklaring als bedoeld in [artikel 9][ref1] waaruit het rechtmatig
      verblijf blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 54.1.h
    text: het stellen van zekerheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.1.i
    text: het overleggen van documenten, anders dan bedoeld onder g.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: '54.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt ten aanzien van referenten en gewezen referenten voorzien in
      verplichtingen tot:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.2.a
    text: |-
      het al dan niet in persoon verstrekken van gegevens en bescheiden welke van belang kunnen zijn voor de toepassing
      van de bij of krachtens deze wet gestelde regels, en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: 54.2.b
    text: het administreren en beheren van gegevens en bescheiden als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: '54.3'
    text: |-
      In gevallen waarin Onze Minister zulks in het belang van de openbare orde of de nationale veiligheid nodig
      oordeelt, kan hij aan een vreemdeling een individuele verplichting tot periodieke aanmelding bij de korpschef
      opleggen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel54
  - number: '55.1'
    text: |-
      De vreemdeling die rechtmatig verblijf geniet op grond van [artikel 8, onder f][ref1], dient zich, in verband met
      het onderzoek naar de inwilligbaarheid van de aanvraag om een verblijfsvergunning beschikbaar te houden op een door
      Onze Minister aangewezen plaats, overeenkomstig hem daartoe door de bevoegde autoriteit gegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '55.2'
    text: |-
      Ter ondersteuning van het onderzoek of een aanvraag tot het verlenen van de verblijfsvergunning als bedoeld
      in [artikel 28][ref1] kan worden ingewilligd, zijn de ambtenaren belast met de grensbewaking en de ambtenaren
      belast met het toezicht op vreemdelingen bevoegd om een vreemdeling staande te houden en aan diens kleding of
      lichaam te onderzoeken, alsmede zijn bagage te doorzoeken met het oog op eventuele aanwezigheid van reis- of
      identiteitspapieren, documenten of bescheiden, die noodzakelijk zijn voor de beoordeling van zijn aanvraag. Gelijke
      bevoegdheid bestaat indien de vreemdeling te kennen geeft een aanvraag te willen indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '55.3'
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      een vreemdeling die zich in verband met het onderzoek op een plaats als bedoeld in het eerste lid bevindt, dan wel
      een vreemdeling die zich in een verwijdercentrum bevindt, aan diens kleding of lichaam te onderzoeken, alsmede zijn
      bagage te doorzoeken met het oog op de veiligheid op die plaats.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel55
  - number: 55a.1
    text: |-
      Onze Minister kan bij een overtreding van de verplichtingen bij of krachtens
      [artikelen 2a, tweede lid, onder b][ref1], [2t, tweede en derde lid][ref2], [24a, tweede en derde lid][ref3],
      [54, eerste lid, onder a tot en met e en g, en tweede lid][ref4], een bestuurlijke boete opleggen van ten hoogste
      € 3000 voor ondernemingen, rechtspersonen en andere organisaties en € 1500 voor natuurlijke personen. Bij regeling
      van Onze Minister kunnen nadere regels worden gesteld omtrent de hoogte van de bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2t
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2t
        hoofdstuk: 1a
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 24a
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 55a.2
    text: Het rapport vermeldt in ieder geval de bij het beboetbare feit betrokken persoon of personen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel55a
  - number: 55a.3
    text: |-
      Onze Minister kan de bestuurlijke boete verhogen met 50%, indien op de dag van het constateren van de overtreding
      nog geen 24 maanden zijn verstreken nadat een eerdere overtreding van eenzelfde wettelijke verplichting is
      geconstateerd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel55a
  - number: '56.1'
    text: |-
      Overeenkomstig bij algemene maatregel van bestuur te geven regels kan, indien het belang van de openbare orde of de
      nationale veiligheid zulks vordert, door Onze Minister de vrijheid van beweging worden beperkt van de vreemdeling
      die:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel56
  - number: 56.1.a
    text: geen rechtmatig verblijf heeft;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel56
  - number: 56.1.b
    text: |-
      rechtmatig verblijf heeft op grond van [artikel 8, met uitzondering van de onderdelen b, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '56.2'
    text: |-
      Toepassing van het eerste lid blijft achterwege wanneer en wordt beëindigd zodra de vreemdeling te kennen geeft
      Nederland te willen verlaten en hiertoe voor hem ook gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel56
  - number: '57.1'
    text: |-
      Onze Minister kan de vreemdeling wiens aanvraag om een verblijfsvergunning als bedoeld in [artikel 28][ref1]
      is afgewezen de aanwijzing geven zich op te houden in een bepaalde ruimte of op een bepaalde plaats en aldaar
      de aanwijzingen van de bevoegde autoriteit in acht te nemen, ook indien de beschikking waarbij de aanvraag is
      afgewezen nog niet onherroepelijk is dan wel het beroep de werking van de beschikking opschort.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '57.2'
    text: Op aanvraag van de vreemdeling kan een andere ruimte of plaats worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel57
  - number: '57.3'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid blijft achterwege indien de vrijheid van beweging van de vreemdeling
      is beperkt in verband met het onderzoek naar de aanvraag om een verblijfsvergunning en de vreemdeling zich
      daadwerkelijk beschikbaar heeft gehouden en de beschikking tot afwijzing meer dan acht weken na de indiening van de
      aanvraag is gegeven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel57
  - number: '57.4'
    text: |-
      De aanwijzing, bedoeld in het eerste lid, vervalt indien de beschikking waarbij de aanvraag is afgewezen is
      vernietigd of zodra het vertrek van de vreemdeling uit de ruimte of plaats nodig is om Nederland te verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel57
  - number: '57.5'
    text: |-
      De termijn, bedoeld in het derde lid, wordt opgeschort gedurende de termijn waarin de vreemdeling de beperking van
      zijn bewegingsvrijheid niet in acht heeft genomen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel57
  - number: '58.1'
    text: |-
      Indien zulks voor de uitzetting noodzakelijk is, kan Onze Minister in het geval, bedoeld in
      [artikel 57, eerste lid][ref1], de vreemdeling een ruimte of plaats aanwijzen, die is beveiligd tegen ongeoorloofd
      vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel57
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '57'
        hoofdstuk: '5'
  - number: '58.2'
    text: |-
      De [artikelen 6, vierde lid][ref1], [57, tweede tot en met vijfde lid][ref2] en [59, derde lid][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '57'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: '59.1'
    text: |-
      Indien het belang van de openbare orde of de nationale veiligheid zulks vordert kan, met het oog op de uitzetting,
      door Onze Minister in bewaring worden gesteld de vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
  - number: 59.1.a
    text: geen rechtmatig verblijf heeft;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
  - number: 59.1.b
    text: |-
      die rechtmatig verblijf heeft op grond van [artikel 8, onder f, g en h][ref1], niet zijnde een vreemdeling als
      bedoeld in [artikel 59a][ref2] of [59b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59b
        hoofdstuk: '5'
  - number: '59.2'
    text: |-
      Indien de voor de terugkeer van de vreemdeling noodzakelijke bescheiden voorhanden zijn, dan wel
      binnen korte termijn voorhanden zullen zijn, wordt het belang van de openbare orde geacht de bewaring
      van de vreemdeling te vorderen, tenzij de vreemdeling rechtmatig verblijf heeft gehad op grond van
      [artikel 8, onder a tot en met e, en l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '59.3'
    text: |-
      Bewaring van een vreemdeling blijft achterwege indien en wordt beëindigd zodra hij te kennen geeft Nederland te
      willen verlaten en hiertoe voor hem ook gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
  - number: '59.4'
    text: |-
      Bewaring krachtens het eerste lid, onder b, of het tweede lid duurt in geen geval langer dan vier weken. Indien
      voorafgaande aan de beslissing op de aanvraag toepassing is gegeven aan [artikel 39][ref1], duurt de bewaring
      krachtens het eerste lid, onder b, in geen geval langer dan zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: '59.5'
    text: Onverminderd het vierde lid duurt de bewaring krachtens het eerste lid niet langer dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
  - number: '59.6'
    text: |-
      In afwijking van het vijfde lid en onverminderd het vierde lid kan de bewaring krachtens het eerste lid ten hoogste
      met nog eens twaalf maanden worden verlengd, indien de uitzetting, alle redelijke inspanningen ten spijt, wellicht
      meer tijd zal vergen, op grond dat de vreemdeling niet meewerkt aan zijn uitzetting of de daartoe benodigde
      documentatie uit derde landen nog ontbreekt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
  - number: '59.7'
    text: |-
      Het vijfde en zesde lid zijn van overeenkomstige toepassing op de vreemdeling aan wie de verplichting of maatregel,
      bedoeld in [artikel 6, eerste of tweede lid][ref1], dan wel [artikel 58][ref2] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
        hoofdstuk: '5'
  - number: '59.8'
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      de in bewaring gestelde persoon aan diens kleding of lichaam te onderzoeken, alsmede zaken van deze persoon te
      doorzoeken, voor zover dit noodzakelijk is voor het verkrijgen van informatie omtrent de identiteit, nationaliteit
      en de verblijfsrechtelijke positie van de betreffende vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59
  - number: 59a.1
    text: |-
      Onze Minister kan vreemdelingen op wie de Dublinverordening van toepassing is, met het oog op de overdracht aan een
      verantwoordelijke lidstaat in bewaring stellen met inachtneming van artikel 28 van de Dublinverordening.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59a
  - number: 59a.2
    text: |-
      [Artikel 59, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: 59b.1
    text: |-
      De vreemdeling die rechtmatig verblijf heeft op grond van [artikel 8, onder f, g of h][ref1], voor zover dit
      betrekking heeft op een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 28][ref2],
      kan door Onze Minister in bewaring worden gesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 59b.1.a
    text: bewaring noodzakelijk is met het oog op vaststelling van de identiteit of nationaliteit van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.1.b
    text: |-
      bewaring noodzakelijk is met het oog op het verkrijgen van gegevens die noodzakelijk zijn voor beoordeling van een
      aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1], met
      name indien er sprake is van een risico op onttrekking;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 59b.1.c
    text: 'de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.1.c.1°
    text: in bewaring werd gehouden in het kader van een terugkeerprocedure uit hoofde van de Terugkeerrichtlijn;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.1.c.2°
    text: reeds de mogelijkheid van toegang tot de asielprocedure heeft gehad; en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.1.c.3°
    text: |-
      op redelijke gronden aangenomen kan worden dat hij de aanvraag louter heeft ingediend om de uitvoering van het
      terugkeerbesluit uit te stellen of te verijdelen; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.1.d
    text: |-
      de vreemdeling een gevaar vormt voor de nationale veiligheid of openbare orde als bedoeld in artikel 8, derde lid,
      onderdeel e, van de Opvangrichtlijn.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.2
    text: |-
      De bewaring krachtens het eerste lid, onderdeel a, b of c, duurt niet langer dan vier weken, tenzij toepassing is
      gegeven aan [artikel 39][ref1]. In dat geval duurt de bewaring niet langer dan zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: 59b.3
    text: |-
      De bewaring krachtens het eerste lid, onderdeel a, b of c, kan worden verlengd met ten hoogste drie maanden indien
      de vreemdeling rechtmatig verblijf heeft op grond van [artikel 8, onder h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 59b.4
    text: De bewaring krachtens het eerste lid, onderdeel d, duurt niet langer dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.5
    text: |-
      Onze Minister kan de bewaring krachtens het eerste lid, onderdeel d, met ten hoogste negen maanden verlengen,
      indien er sprake is van:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59b.5.a
    text: |-
      complexe feitelijke en juridische omstandigheden die betrekking hebben op de behandeling van de aanvraag tot het
      verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 59b.5.b
    text: een zwaarwegend belang van openbare orde of nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59b
  - number: 59c.1
    text: |-
      Onze Minister stelt een vreemdeling slechts in bewaring op grond van [artikel 59][ref1], [59a][ref2] of
      [59b][ref3], voor zover geen minder dwingende maatregelen doeltreffend kunnen worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59b
        hoofdstuk: '5'
  - number: 59c.2
    text: |-
      Bewaring van een vreemdeling blijft achterwege of wordt beëindigd, indien deze niet langer noodzakelijk is met het
      oog op het doel van de bewaring.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel59c
  - number: '60'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven omtrent de toepassing van dit
      hoofdstuk. Daarbij kan worden voorzien in de mogelijkheid van verhaal van de kosten van bewaring op de vreemdeling
      zelf en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel60
  - number: '61.1'
    text: |-
      De vreemdeling die niet of niet langer rechtmatig verblijf heeft, dient Nederland uit eigen beweging te verlaten
      binnen de in [artikel 62][ref1] bepaalde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: '61.2'
    text: |-
      Indien de werking van de beschikking, waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken, is
      opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van het vertrek uit Nederland.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel61
  - number: '61.3'
    text: |-
      Het indienen van een klacht als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref1] schort de
      verplichting, bedoeld in het eerste lid, niet op.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '62.1'
    text: |-
      Nadat tegen de vreemdeling een terugkeerbesluit is uitgevaardigd dan wel, indien het een gemeenschapsonderdaan
      betreft, nadat het rechtmatig verblijf van de vreemdeling is geëindigd, dient hij Nederland uit eigen beweging
      binnen vier weken te verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62
  - number: '62.2'
    text: |-
      Onze Minister kan de voor een vreemdeling geldende termijn, bedoeld in het eerste lid, verkorten, dan wel, in
      afwijking van het eerste lid, bepalen dat een vreemdeling Nederland onmiddellijk moet verlaten, indien:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62
  - number: 62.2.a
    text: een risico bestaat dat de vreemdeling zich aan het toezicht zal onttrekken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62
  - number: 62.2.b
    text: |-
      de aanvraag van de vreemdeling tot het verlenen van een verblijfsvergunning of tot het verlengen van de
      geldigheidsduur van een verblijfsvergunning is afgewezen als kennelijk ongegrond of wegens het verstrekken van
      onjuiste of onvolledige gegevens; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62
  - number: 62.2.c
    text: de vreemdeling een gevaar vormt voor de openbare orde, de openbare veiligheid of de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62
  - number: '62.3'
    text: |-
      Onze Minister kan de voor een vreemdeling geldende termijn, bedoeld in het eerste lid, verlengen, rekening houdend
      met de specifieke omstandigheden van het individuele geval. Bij ministeriële regeling worden regels gesteld over de
      duur van de verlenging en worden de gevallen aangewezen waarin de termijn kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62
  - number: 62a.1
    text: |-
      Onze Minister stelt de vreemdeling, niet zijnde gemeenschapsonderdaan, die niet of niet langer rechtmatig verblijf
      heeft, schriftelijk in kennis van de verplichting Nederland uit eigen beweging te verlaten en van de termijn
      waarbinnen hij aan die verplichting moet voldoen, tenzij:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62a
  - number: 62a.1.a
    text: |-
      reeds eerder een terugkeerbesluit tegen de vreemdeling is uitgevaardigd en aan de daaruit voortvloeiende
      terugkeerverplichting niet is voldaan,
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62a
  - number: 62a.1.b
    text: |-
      de vreemdeling in bezit is van een door een andere lidstaat afgegeven geldige verblijfsvergunning of andere
      toestemming tot verblijf, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62a
  - number: 62a.1.c
    text: |-
      de vreemdeling door een andere lidstaat van de Europese Unie wordt teruggenomen op grond van een op 13 januari 2009
      geldende bilaterale of multilaterale overeenkomst of regeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62a
  - number: 62a.2
    text: De kennisgeving, bedoeld in het eerste lid, geldt als terugkeerbesluit en kan tevens een inreisverbod inhouden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62a
  - number: 62a.3
    text: |-
      De vreemdeling, bedoeld in het eerste lid, onderdeel b, wordt opgedragen zich onmiddellijk naar het grondgebied
      van de betrokken lidstaat te begeven. Indien dit bevel niet wordt nageleefd of indien om redenen van openbare
      orde of nationale veiligheid het onmiddellijke vertrek van vreemdeling is vereist, wordt tegen de vreemdeling een
      terugkeerbesluit uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62a
  - number: 62b.1
    text: |-
      Onze Minister stelt de vreemdeling die kan worden overgedragen op grond van de Dublinverordening schriftelijk in
      kennis van het besluit om hem over te dragen aan de verantwoordelijke lidstaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62b
  - number: 62b.2
    text: De kennisgeving, bedoeld in het eerste lid, geldt als een overdrachtsbesluit.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62b
  - number: 62c.1
    text: |-
      Nadat tegen de vreemdeling een overdrachtsbesluit is uitgevaardigd, dient hij Nederland uit eigen beweging binnen
      vier weken te verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62c
  - number: 62c.2
    text: |-
      [Artikel 62, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 62c.3
    text: |-
      Onze Minister kan, in afwijking van het eerste en tweede lid, de voor een vreemdeling geldende termijn verkorten
      dan wel bepalen dat een vreemdeling Nederland onmiddellijk moet verlaten, indien dit noodzakelijk is ten behoeve
      van het realiseren van de overdracht binnen zes maanden na het akkoord van de verantwoordelijke lidstaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62c
  - number: 62c.4
    text: |-
      Het rechtmatig verblijf op grond van [artikel 8, onder m][ref1], eindigt van rechtswege nadat de vreemdeling
      Nederland kennelijk uit eigen beweging heeft verlaten, dan wel de feitelijke overdracht is gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel62c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '63.1'
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft en die niet binnen de bij deze wet gestelde termijn Nederland uit
      eigen beweging heeft verlaten, kan worden uitgezet.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel63
  - number: '63.2'
    text: Onze Minister is bevoegd tot uitzetting.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel63
  - number: '63.3'
    text: |-
      Indien de werking van de beschikking waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken is
      opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel63
  - number: 63a
    text: |-
      De vreemdeling tegen wie een overdrachtsbesluit is uitgevaardigd en die Nederland niet binnen de in
      [artikel 62c][ref1] bedoelde termijn uit eigen beweging heeft verlaten, kan door Onze Minister worden overgedragen
      aan een verantwoordelijke lidstaat in de zin van de Dublinverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62c
        hoofdstuk: '6'
        afdeling: '1'
  - number: '64'
    text: |-
      Uitzetting blijft achterwege zolang het gelet op de gezondheidstoestand van de vreemdeling of die van een van zijn
      gezinsleden niet verantwoord is om te reizen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel64
  - number: '65.1'
    text: 'De vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel65
  - number: 65.1.a
    text: |-
      die Nederland is binnengekomen aan boord van een vaartuig of luchtvaartuig in gebruik bij een vervoersonderneming
      en die Nederland onmiddellijk dient te verlaten, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel65
  - number: 65.1.b
    text: |-
      die met het oog op zijn uitzetting is aangehouden binnen zes maanden nadat hij is binnengekomen aan boord van een
      vaartuig of luchtvaartuig in gebruik bij een vervoersonderneming, kan worden uitgezet door plaatsing aan boord van
      een vaartuig of luchtvaartuig in gebruik bij dezelfde vervoersonderneming.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel65
  - number: '65.2'
    text: |-
      De vervoersonderneming vervoert op aanwijzing van een ambtenaar belast met de grensbewaking de vreemdeling, bedoeld
      in het eerste lid, om niet terug naar een plaats buiten Nederland en vindt daartoe zo nodig een ander middel voor
      de terugbrenging. Is zulks niet binnen redelijke tijd mogelijk, of, in het geval bedoeld in het eerste lid, onder
      b, niet binnen redelijke tijd na de aanhouding mogelijk, dan kunnen de kosten van uitzetting uit Nederland op die
      vervoersonderneming worden verhaald.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel65
  - number: '65.3'
    text: |-
      Gezagvoerders van vaartuigen en luchtvaartuigen verlenen aan de uitzetting van de vreemdeling alle medewerking die
      de ambtenaar belast met de grensbewaking redelijkerwijs kan vorderen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel65
  - number: '65.4'
    text: |-
      Het eerste lid, onder b, is niet van toepassing op de vreemdeling die rechtmatig verblijf geniet tot een later
      tijdstip dan dat van vertrek van het vaartuig of luchtvaartuig aan boord waarvan hij is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel65
  - number: '66.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de toepassing van de
      [afdelingen 1][ref1] en [2][ref2] van dit hoofdstuk. Daarbij wordt in ieder geval voorzien in de mogelijkheid van
      verhaal van de kosten van uitzetting op de referent of de gewezen referent van de vreemdeling, op de vreemdeling
      zelf en, indien hij minderjarig is, op degenen die het wettelijk gezag over hem uitoefenen of uitoefenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        hoofdstuk: '6'
        afdeling: '2'
  - number: '66.2'
    text: Het terzake van uitzetting verschuldigde bedrag kan worden ingevorderd bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66
  - number: 66a.1
    text: |-
      Onze Minister vaardigt een inreisverbod uit tegen de vreemdeling, die geen gemeenschapsonderdaan is, op wie
      [artikel 64][ref1] niet van toepassing is en die Nederland:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 66a.1.a
    text: |-
      onmiddellijk moet verlaten ingevolge [artikel 62, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 66a.1.b
    text: |-
      niet uit eigen beweging binnen de daarvoor geldende termijn heeft verlaten, in welk laatste geval het inreisverbod
      slechts door middel van een zelfstandige beschikking wordt uitgevaardigd dan wel een beschikking die mede strekt
      tot wijziging van het reeds gegeven terugkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.2
    text: |-
      Onze Minister kan een inreisverbod uitvaardigen tegen de vreemdeling, die geen gemeenschapsonderdaan is en die
      Nederland niet onmiddellijk moet verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.3
    text: |-
      De vreemdeling tegen wie een inreisverbod is uitgevaardigd wordt ter fine van weigering van de toegang en het
      verblijf gesignaleerd in de daartoe bij of krachtens een verdrag, een EU-verordening, -richtlijn, of -besluit of
      een algemene maatregel van bestuur aangewezen informatie- dan wel signaleringssystemen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.4
    text: |-
      Het inreisverbod wordt gegeven voor een bepaalde duur, die ten hoogste vijf jaren bedraagt, tenzij de vreemdeling
      naar het oordeel van Onze Minister een ernstige bedreiging vormt voor de openbare orde, de openbare veiligheid
      of de nationale veiligheid. De duur wordt berekend met ingang van de datum waarop de vreemdeling Nederland
      daadwerkelijk heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.5
    text: |-
      Indien de bekendmaking van de beschikking, waarbij het inreisverbod is uitgevaardigd, geschiedt door toezending,
      wordt van de beschikking mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.6
    text: |-
      In afwijking van [artikel 8][ref1] kan de vreemdeling jegens wie een inreisverbod geldt of die is gesignaleerd ter
      fine van weigering van de toegang geen rechtmatig verblijf hebben, met uitzondering van het rechtmatig verblijf:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 66a.6.a
    text: |-
      van de vreemdeling die een eerste aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 28][ref1] heeft ingediend, zolang op die aanvraag nog niet is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 66a.6.b
    text: |-
      bedoeld in [artikel 8, onder j][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 66a.6.c
    text: |-
      van de vreemdeling wiens uitzetting op grond van een rechterlijke beslissing achterwege dient te blijven totdat op
      het bezwaarschrift of beroepschrift is beslist.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.7
    text: |-
      In afwijking van het zesde lid en [artikel 8][ref1] en met uitzondering van het rechtmatig verblijf van de
      vreemdeling die een eerste aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 28][ref2]
      heeft ingediend zolang op die aanvraag nog niet is beslist, kan de vreemdeling jegens wie een inreisverbod geldt
      geen rechtmatig verblijf hebben, in geval de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 66a.7.a
    text: |-
      bij onherroepelijk geworden rechtelijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd dan wel hem ter zake de maatregel als bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 66a.7.b
    text: een gevaar vormt voor de openbare orde of de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.7.c
    text: naar het oordeel van Onze Minister een ernstige bedreiging vormt als bedoeld in het vierde lid, dan wel
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.7.d
    text: |-
      ingevolge een verdrag of in het belang van de internationale betrekkingen van Nederland ieder verblijf dient te
      worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66a.8
    text: |-
      In afwijking van het eerste lid kan Onze Minister om humanitaire of andere redenen afzien van het uitvaardigen van
      een inreisverbod.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66a
  - number: 66b.1
    text: |-
      Onze Minister kan ambtshalve of wegens gewijzigde omstandigheden dan wel op aanvraag van de vreemdeling besluiten
      tot opheffing of tijdelijke opheffing van het inreisverbod.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66b
  - number: 66b.2
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel66b
  - number: '67.1'
    text: |-
      Tenzij [afdeling 3][ref1] van toepassing is, kan Onze Minister de vreemdeling ongewenst verklaren:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '6'
        afdeling: '3'
  - number: 67.1.a
    text: |-
      indien hij niet rechtmatig in Nederland verblijft en bij herhaling een bij deze wet strafbaar gesteld feit heeft
      begaan;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
  - number: 67.1.b
    text: |-
      indien hij bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen
      een gevangenisstraf van drie jaren of meer is bedreigd dan wel hem terzake de maatregel als bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 67.1.c
    text: |-
      indien hij een gevaar vormt voor de openbare orde of nationale veiligheid en geen rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder a tot en met e dan wel l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 67.1.d
    text: ingevolge een verdrag, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
  - number: 67.1.e
    text: in het belang van de internationale betrekkingen van Nederland.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
  - number: '67.2'
    text: |-
      Indien de bekendmaking van de beschikking, waarbij de vreemdeling ongewenst wordt verklaard, geschiedt door
      toezending, wordt van de beschikking mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
  - number: '67.3'
    text: |-
      In afwijking van [artikel 8][ref1] kan de ongewenst verklaarde vreemdeling geen rechtmatig verblijf hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '68.1'
    text: Onze Minister kan op aanvraag van de vreemdeling besluiten tot opheffing van de ongewenstverklaring.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel68
  - number: '68.2'
    text: |-
      De ongewenstverklaring wordt opgeheven indien de vreemdeling tien jaren onafgebroken buiten Nederland verblijf
      heeft gehad en zich in die periode geen van de gronden, bedoeld in [artikel 67, eerste lid][ref1], hebben
      voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel67
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '67'
        hoofdstuk: '6'
        afdeling: '4'
  - number: '68.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de toepassing van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel68
  - number: '69.1'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een bezwaar- of beroepschrift vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '69.2'
    text: |-
      In afwijking van het eerste lid bedraagt de beroepstermijn één week, indien de aanvraag tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 69.2.a
    text: |-
      is afgewezen binnen een bij algemene maatregel van bestuur te bepalen aantal dagen, dat niet de dagen van de rust-
      en voorbereidingstermijn omvat;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
  - number: 69.2.b
    text: |-
      niet in behandeling is genomen op grond van [artikel 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 69.2.c
    text: |-
      niet-ontvankelijk is verklaard op grond van [artikel 30a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 69.2.d
    text: |-
      is afgewezen als kennelijk ongegrond op grond van [artikel 30b][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30b
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 69.2.e
    text: |-
      buiten behandeling is gesteld op grond van [artikel 30c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '69.3'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] is het instellen van beroep als bedoeld in
      de [artikelen 94][ref2] en [96][ref3] tegen een besluit als bedoeld in [artikel 93][ref4] niet aan enige termijn
      gebonden. De termijn voor het instellen van het hoger beroep, bedoeld in [artikel 95][ref5], bedraagt één week.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel93
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel95
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '96'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '93'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '95'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '69.4'
    text: |-
      In afwijking van het eerste lid bedraagt de beroepstermijn één week, indien een overdrachtsbesluit is genomen op
      grond van [artikel 62b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62b
        hoofdstuk: '6'
        afdeling: '1'
  - number: '70.1'
    text: |-
      In afwijking van de [artikelen 2:1][ref1] en [8:24 van de Algemene wet bestuursrecht][ref2] wordt het bezwaar,
      administratief beroep, het beroep op de rechtbank of het hoger beroep ingesteld door de vreemdeling in persoon,
      zijn wettelijke vertegenwoordiger, zijn bijzondere gemachtigde, zijn referent of een advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '70.2'
    text: |-
      Indien de vreemdeling van zijn vrijheid is ontnomen kan hij het bezwaar, administratief beroep, het beroep
      op de rechtbank of hoger beroep ook instellen door middel van de schriftelijke verklaring, bedoeld in
      [artikel 451a van het Wetboek van Strafvordering][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel451a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 451a
  - number: '71'
    text: |-
      Op het beroep tegen een besluit, genomen op grond van de [artikelen 43][ref1] en [45, vierde lid][ref2], zijn de
      [artikelen 70, eerste lid][ref3], en [89][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel89
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel71
