  - number: 71a.2
    text: |-
      In afwijking van [artikel 8:94, eerste lid, van de Algemene wet bestuursrecht][ref1] is
      [artikel 8:10a, eerste tot en met derde lid, van die wet][ref2] niet van overeenkomstige toepassing indien het
      verzoek wordt behandeld door de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel71a
