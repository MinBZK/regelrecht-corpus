        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '72.1'
    text: |-
      Deze afdeling is van toepassing indien de [afdelingen 3][ref1] en [5][ref2] van dit hoofdstuk niet van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel72
