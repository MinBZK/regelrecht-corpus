        artikel: '78'
        hoofdstuk: '7'
        paragraaf: '4'
        afdeling: '2'
  - number: 84.d
    text: |-
      over de toekenning van de vergoeding, bedoeld in [artikel 106][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '106'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '85.1'
    text: |-
      In aanvulling op [artikel 6:5, onderdeel d, van de Algemene wet bestuursrecht][ref1] bevat het beroepschrift een of
      meer grieven tegen de uitspraak van de rechtbank of de voorzieningenrechter van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '85.2'
    text: |-
      Een grief omschrijft het onderdeel van de uitspraak waarmee de indiener zich niet kan verenigen alsmede de gronden
      waarop de indiener zich daarmee niet kan verenigen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel85
  - number: '85.3'
    text: |-
      Indien niet is voldaan aan het eerste of tweede lid, aan [artikel 6:5 van de Algemene wet bestuursrecht][ref1]
      of aan enig ander bij de wet gesteld vereiste voor het in behandeling nemen van het hoger beroep, wordt het hoger
      beroep niet-ontvankelijk verklaard. [Artikel 6:6 van de Algemene wet bestuursrecht][ref2] is niet van toepassing,
      indien niet is voldaan aan de vereisten genoemd in artikel 6:5, eerste lid, onder c en d, of aan het eerste lid of
      tweede lid van dit artikel


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '86.1'
    text: |-
      In afwijking van [artikel 8:41, vijfde lid, van de Algemene wet bestuursrecht][ref1] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling bestuursrechtspraak van de Raad van State kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '86.2'
    text: |-
      In afwijking van [artikel 8:41, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt door de secretaris geen
      griffierecht geheven, indien hoger beroep wordt ingesteld tegen een uitspraak die is gedaan met toepassing van
      afdeling 3 van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '86.3'
    text: |-
      In afwijking van [artikel 8:82 van de Algemene wet bestuursrecht][ref1] wordt door de secretaris geen griffierecht
      geheven voor een verzoek om voorlopige voorziening indien hoger beroep wordt ingesteld tegen een uitspraak die is
      gedaan met toepassing van [afdeling 3 van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        hoofdstuk: '7'
        afdeling: '3'
  - number: '89.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State behandelt het hoger beroep met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: '89.2'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State doet uiterlijk drieëntwintig weken na ontvangst van het
      beroepschrift uitspraak.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel89
  - number: '90'
    text: |-
      In afwijking van [artikel 8:18, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt een verzoek om wraking
      van een lid van de enkelvoudige kamer behandeld door een enkelvoudige kamer waarin de rechter wiens wraking is
      verzocht geen zitting heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '91.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State kan zich bij haar uitspraak beperken tot een beoordeling van
      de aangevoerde grieven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel91
  - number: '91.2'
    text: |-
      Indien de Afdeling bestuursrechtspraak van de Raad van State oordeelt dat een aangevoerde grief niet tot
      vernietiging kan leiden, kan zij zich bij de vermelding van de gronden van haar uitspraak beperken tot dit oordeel.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel91
  - number: '92'
    text: |-
      In afwijking van [artikel 8:86 van de Algemene wet bestuursrecht][ref1] kan de Voorzitter van de Afdeling
      bestuursrechtspraak van de Raad van State bij zijn uitspraak op een verzoek om voorlopige voorziening ook
      onmiddellijk uitspraak in de hoofdzaak doen, indien het verzoek niet ter zitting is behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 92a
    text: |-
      Deze afdeling is van overeenkomstige toepassing op het hoger beroep tegen een uitspraak van de rechtbank als
      bedoeld in [artikel 8:104, eerste lid, onder c, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel92a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '93.1'
    text: |-
      Een aanwijzing op grond van [artikel 6, eerste, tweede of derde lid][ref1], [artikel 6a][ref2], of op
      grond van [artikel 55, eerste lid][ref3], de ophouding en de verlenging van de ophouding bedoeld in
      [artikel 50, tweede, derde en vierde lid][ref4], de ophouding bedoeld in [artikel 50a, eerste lid][ref5],
      en een ingevolge [hoofdstuk 5][ref6] van deze wet genomen maatregel strekkende tot vrijheidsbeperking of
      vrijheidsontneming worden voor de toepassing van [artikel 8:1 van de Algemene wet bestuursrecht][ref7]
      gelijkgesteld met een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel50a
      [ref6]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 6a
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: 50a
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0011823
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '93.2'
    text: |-
      In afwijking van [artikel 8:41 van de Algemene wet bestuursrecht][ref1] wordt door de griffier geen griffierecht
      geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '94.1'
    text: |-
      Uiterlijk op de achtentwintigste dag na de bekendmaking van een besluit tot oplegging van een vrijheidsontnemende
      maatregel als bedoeld in de [artikelen 6][ref1], [6a][ref2], [58][ref3], [59][ref4], [59a][ref5] en [59b][ref6],
      stelt Onze Minister de rechtbank hiervan in kennis, tenzij de vreemdeling voordien zelf beroep heeft ingesteld.
      Zodra de rechtbank de kennisgeving heeft ontvangen wordt de vreemdeling geacht beroep te hebben ingesteld tegen het
      besluit tot oplegging van een vrijheidsontnemende maatregel. Het beroep strekt tevens tot een verzoek om toekenning
      van schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref6]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 6a
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '58'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: 59a
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0011823
        artikel: 59b
        hoofdstuk: '5'
  - number: '94.2'
    text: |-
      Indien aan de vreemdeling, bedoeld in het eerste lid, een besluit tot weigering van toegang tot Nederland is
      uitgereikt, wordt het beroep, bedoeld in het eerste lid, geacht mede een beroep tegen dit besluit te omvatten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel94
  - number: '94.3'
    text: |-
      Het tweede lid is niet van toepassing indien tussen de uitreiking van het besluit tot weigering van toegang tot
      Nederland en het opleggen van de vrijheidsontnemende maatregel meer dan achtentwintig dagen zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel94
  - number: '94.4'
    text: |-
      De rechtbank bepaalt onmiddellijk het tijdstip van het onderzoek ter zitting. De zitting vindt uiterlijk op de
      veertiende dag na ontvangst van het beroepschrift dan wel de kennisgeving plaats. De rechtbank roept de vreemdeling
      op om in persoon dan wel in persoon of bij raadsman en Onze Minister om bij gemachtigde te verschijnen teneinde te
      worden gehoord. In afwijking van [artikel 8:42, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de in dat
      artikel bedoelde termijn niet worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '94.5'
    text: |-
      De rechtbank doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak
      wordt binnen zeven dagen na de sluiting van het onderzoek gedaan. In afwijking van
      [artikel 8:66, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de in dat artikel bedoelde termijn niet
      worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '94.6'
    text: |-
      Indien de rechtbank bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel in strijd
      is met deze wet dan wel bij afweging van alle daarbij betrokken belangen niet gerechtvaardigd is, verklaart zij het
      beroep gegrond. In dat geval beveelt de rechtbank de opheffing van de maatregel of een wijziging van de wijze van
      tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel94
  - number: '94.7'
    text: |-
      Het eerste, vijfde en zesde lid zijn van overeenkomstige toepassing op een besluit tot verlenging van een
      vrijheidsontnemende maatregel als bedoeld in [artikel 59, zesde lid][ref1], of [artikel 59b, vijfde lid][ref2]. In
      afwijking van [artikel 8:57 van de Algemene wet bestuursrecht][ref3] kan de rechtbank ook zonder toestemming van
      partijen bepalen dat het onderzoek ter zitting achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59b
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '95.1'
    text: |-
      In afwijking van [artikel 84, onder a][ref1], staat tegen de uitspraak van de rechtbank, bedoeld in
      [artikel 94, vijfde lid][ref2], hoger beroep open op de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '84'
        hoofdstuk: '7'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '95.2'
    text: |-
      [Afdeling 4][ref1] is van toepassing. In afwijking van [artikel 84, onder d][ref2], strekt het hoger beroep zich
      ook uit over de toekenning van schadevergoeding, bedoeld in [artikel 106][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel106
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '7'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '84'
        hoofdstuk: '7'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '106'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '95.3'
    text: |-
      In afwijking van de [artikelen 8:41, eerste lid][ref1], en [8:82 van de Algemene wet bestuursrecht][ref2] wordt
      door de secretaris geen griffierecht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '96.1'
    text: |-
      Indien het beroep, bedoeld in [artikel 94][ref1], ongegrond is verklaard en de vreemdeling beroep instelt tegen
      het voortduren van de vrijheidsontneming, sluit de rechtbank het vooronderzoek binnen een week na ontvangst van het
      beroepschrift. In afwijking van [artikel 8:57 van de Algemene wet bestuursrecht][ref2] kan de rechtbank ook zonder
      toestemming van partijen bepalen dat het onderzoek ter zitting achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '96.2'
    text: |-
      De rechtbank doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak
      wordt binnen zeven dagen na de sluiting van het onderzoek gedaan. In afwijking van
      [artikel 8:66, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de in dat artikel bedoelde termijn niet
      worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '96.3'
    text: |-
      Indien de rechtbank bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel in strijd
      is met deze wet dan wel bij afweging van alle daarbij betrokken belangen in redelijkheid niet gerechtvaardigd is,
      verklaart zij het beroep gegrond. In dat geval beveelt de rechtbank de opheffing van de maatregel of een wijziging
      van de wijze van tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel96
  - number: '97'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de wijze van
      horen van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel97
  - number: '98.1'
    text: |-
      In afwijking van [artikel 8:24 van de Algemene wet bestuursrecht][ref1] kan de vreemdeling zich bij de gehoren
      ingevolge de [artikelen 94][ref2] en [96][ref3] uitsluitend door één of meer van zijn raadslieden doen bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel96
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '96'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '98.2'
    text: De raadsman wordt bij het horen in de gelegenheid gesteld de nodige opmerkingen te maken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel98
  - number: '98.3'
    text: |-
      Als raadsman wordt slechts toegelaten een in Nederland ingeschreven advocaat alsmede de persoon bedoeld
      in [artikel 16b][ref1] dan wel [16h van de Advocatenwet][ref2] indien deze samenwerkt met een in
      Nederland ingeschreven advocaat, overeenkomstig het bepaalde in [artikel 16e][ref3] respectievelijk
      [16j van de Advocatenwet][ref4]. Onder raadsman wordt ook verstaan de rechtshulpverlener die in dienst is van de
      Stichting Rechtsbijstand Asiel die terzake van de vrijheidsontnemende maatregelen relevante opleiding en ervaring
      bezit, en


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16e
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel16j
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16h
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 16e
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 16j
  - number: 98.3.a
    text: |-
      aan wie door een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] de graad Bachelor op het gebied van het recht en
      tevens de graad Master op het gebied van het recht is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 98.3.b
    text: |-
      die aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] het doctoraat in de rechtsgeleerdheid of het recht
      om de titel meester te voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '99.1'
    text: De vreemdeling is steeds bevoegd een of meer raadslieden te kiezen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel99
  - number: '99.2'
    text: Daartoe is ook zijn wettige vertegenwoordiger of zijn bijzondere gemachtigde bevoegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel99
  - number: '99.3'
    text: |-
      Kan de vreemdeling zijn wil te dien aanzien niet doen blijken en heeft hij geen wettelijke vertegenwoordiger of
      bijzondere gemachtigde, dan is zijn echtgenoot of de meest gerede van zijn hier te lande verblijvende bloed- of
      aanverwanten, tot de vierde graad ingesloten, tot die keuze bevoegd. De voorzieningenrechter kan ambtshalve één of
      meer raadslieden toevoegen indien de in de voorgaande volzin bedoelde personen niet in staat worden geacht de keuze
      binnen redelijke termijn te maken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel99
  - number: '99.4'
    text: |-
      De ingevolge het tweede of derde lid gekozen raadsman treedt af zodra de vreemdeling zelf een raadsman heeft
      gekozen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel99
  - number: '100.1'
    text: |-
      Op verzoek van de vreemdeling wordt hem een raadsman toegevoegd zodra hem ingevolge deze wet zijn vrijheid is
      ontnomen. [Artikel 99, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel99
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '100.2'
    text: |-
      Bevoegd tot het geven van een last tot toevoeging aan het bestuur van de raad voor rechtsbijstand is de
      voorzieningenrechter van de rechtbank in het rechtsgebied waarvan de vreemdeling zich bevindt. Ingeval hoger beroep
      is ingesteld op grond van [artikel 95][ref1], is de voorzitter van de Afdeling bestuursrechtspraak van de Raad van
      State bevoegd tot het geven van de last tot toevoeging aan het bestuur van de raad voor rechtsbijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel95
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '95'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '100.3'
    text: |-
      Voorzover de wet niet op andere wijze in de toevoeging voorziet, kan het bestuur van de raad voor rechtsbijstand
      aan de vreemdeling op diens verzoek een raadsman toevoegen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel100
  - number: '100.4'
    text: |-
      Een overeenkomstig het voorgaande lid gedaan verzoek wordt ingewilligd in gevallen waarin aannemelijk is dat de
      vreemdeling niet in staat is de kosten van een gekozen raadsman te dragen en waarin ook overigens, naar het oordeel
      van dat bureau, voldoende grond voor toevoeging bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel100
  - number: '101.1'
    text: |-
      Bij verhindering of ontstentenis van de toegevoegde raadsman wordt zo nodig aan de vreemdeling onverwijld een
      andere raadsman toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel101
  - number: '101.2'
    text: Op verzoek van de toegevoegde raadsman of van de vreemdeling kan een andere raadsman worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel101
  - number: '101.3'
    text: |-
      Toevoeging van een andere raadsman geschiedt door het bureau bedoeld in [artikel 100, tweede of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel100
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '101.4'
    text: |-
      Blijkt van de verhindering of ontstentenis van de raadsman pas tijdens het gehoor ingevolge de [artikelen 94][ref1]
      en [96][ref2], dan geeft de voorzitter van de kamer last tot toevoeging van een andere raadsman aan het bureau
      bedoeld in [artikel 100, tweede of derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel100
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '96'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '102'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gegeven omtrent de beloning van toegevoegde raadslieden, met
      inbegrip van advocaten die overeenkomstig [artikel 101][ref1] als raadsman optreden, en de vergoeding van hun
      onkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel101
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '101'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '103'
    text: |-
      Indien Onze Minister dit wenselijk oordeelt kan hij de beloning en vergoeding van een toevoeging ingevolge de
      [artikelen 100][ref1] of [101][ref2] verhalen op de goederen van de vreemdeling. Met betrekking tot de wijze van
      verhaal en de berekening van de te verhalen bedragen worden regelen gesteld bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel101
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '101'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '104'
    text: |-
      De raadsman heeft vrije toegang tot de vreemdeling. Hij kan hem alleen spreken en met hem brieven wisselen zonder
      dat van de inhoud door anderen kennis wordt genomen, een en ander onder het vereiste toezicht en met in achtneming
      van ingevolge deze wet gestelde regelen met betrekking tot het voor de ruimte of plaats, waar de vreemdeling zich
      bevindt, geldende regime.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel104
  - number: '105'
    text: |-
      Met betrekking tot de kennisgeving van gerechtelijke mededelingen ingevolge de
      [artikelen 94 tot en met 101][ref1] zijn de [artikelen 36b tot en met 36e][ref2], [36g][ref3], [36h][ref4] en
      [36n van het Wetboek van Strafvordering][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36b
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel36g
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel36h
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel36n
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 36b
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 36g
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 36h
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 36n
  - number: '106.1'
    text: |-
      Indien de rechtbank de opheffing van een maatregel strekkende tot vrijheidsontneming of -beperking beveelt,
      dan wel de vrijheidsontneming of -beperking reeds voor de behandeling van het verzoek om opheffing van
      die maatregel wordt opgeheven, kan zij aan de vreemdeling een vergoeding ten laste van de Staat toekennen.
      Onder schade is begrepen het nadeel dat niet in vermogensschade bestaat. De [artikelen 534][ref1] en
      [536 van het Wetboek van Strafvordering][ref2] zijn van overeenkomstige toepassing. Indien de vreemdeling na het
      indienen van zijn verzoek is overleden, geschiedt de toekenning ten behoeve van zijn erfgenamen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel534
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel536
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '534'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '536'
  - number: '106.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien de Afdeling bestuursrechtspraak van de Raad van State de
      opheffing van de maatregel strekkende tot vrijheidsontneming of -beperking beveelt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106
  - number: 106a.1
    text: |-
      Voor zover op grond van de Europese verordeningen die betrekking hebben op biometrische gegevens geen
      gezichtsopname of vingerafdrukken kunnen worden afgenomen en verwerkt, kunnen van een vreemdeling een
      gezichtsopname en tien vingerafdrukken worden afgenomen en verwerkt voor het vaststellen van de identiteit met het
      oog op de uitvoering van deze wet. De gezichtsopname en vingerafdrukken worden vergeleken met de gezichtsopnames en
      vingerafdrukken in de vreemdelingenadministratie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: 106a.2
    text: |-
      Voor het verifiëren van de authenticiteit van het document, bedoeld in [artikel 9][ref1], of de verificatie van
      de identiteit van een vreemdeling kunnen voor zover dit niet mogelijk is op grond van de Europese verordeningen
      die betrekking hebben op biometrische gegevens, met het oog op de uitvoering van deze wet vingerafdrukken worden
      afgenomen. Van deze vingerafdrukken worden één of twee en indien dit geen resultaat oplevert meer vingerafdrukken
      gebruikt voor vergelijking met de vingerafdrukken op het document of in de vreemdelingenadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 106a.3
    text: |-
      Tot het afnemen en verwerken van een gezichtsopname en vingerafdrukken ten behoeve van de in het eerste en
      tweede lid genoemde doelen, zijn uitsluitend bevoegd Onze Minister, de ambtenaren belast met de grensbewaking, de
      ambtenaren belast met het toezicht op vreemdelingen en Onze Minister van Buitenlandse Zaken voor zover het gaat om
      het vaststellen of het verifiëren van de identiteit.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: 106a.4
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: 106a.4.a
    text: gemeenschapsonderdanen, en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: 106a.4.b
    text: de vreemdeling die behoort tot een bij algemene maatregel aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: 106a.5
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: 106a.5.a
    text: |-
      de wijze van het afnemen en verwerken van de gezichtsopnames en de vingerafdrukken, bedoeld in het eerste en tweede
      lid, en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: 106a.5.b
    text: |-
      de maatregelen die kunnen worden getroffen in het geval geen vingerafdrukken van de vreemdeling kunnen worden
      verkregen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel106a
  - number: '107.1'
    text: 'Er is een vreemdelingenadministratie, die wordt beheerd door Onze Minister. De vreemdelingenadministratie bevat:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.1.a
    text: |-
      de gezichtsopnames en vingerafdrukken, bedoeld in [artikel 106a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 106a
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 107.1.b
    text: |-
      andere persoons- en verwijsgegevens van vreemdelingen die volgens een door Onze Minister vastgestelde werkwijze
      zijn geïdentificeerd en geregistreerd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.1.c
    text: |-
      andere gegevens, waaronder persoonsgegevens, die van belang zijn voor de uitvoering van deze wet en de
      [Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '107.2'
    text: 'De vreemdelingenadministratie heeft tot doel de verwerking van:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.2.a
    text: |-
      de in het eerste lid, onder a, bedoelde gegevens voor de uitvoering van deze wet, de
      [Rijkswet op het Nederlanderschap][ref1] en de daarop gebaseerde regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 107.2.b
    text: 'de in het eerste lid, onder b en c, bedoelde gegevens, voor zover dat noodzakelijk is voor:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.2.b.1°
    text: |-
      het ter verificatie, controle en verwijzing beschikbaar stellen van de identificatie- en verwijsgegevens van
      vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.2.b.2°
    text: |-
      de uitvoering van deze wet, de [Rijkswet op het Nederlanderschap][ref1] en andere, bij regeling van Onze Minister
      aan te wijzen wettelijke voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 107.2.b.3°
    text: de evaluatie van bestaand beleid en de voorbereiding van nieuw beleid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: '107.3'
    text: Aan een vreemdeling wordt in de vreemdelingenadministratie een uniek vreemdelingennummer toegekend.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: '107.4'
    text: |-
      Uit de vreemdelingenadministratie worden, met uitzondering van gezichtsopnames en de vingerafdrukken, bedoeld in
      het eerste lid, aan bestuursorganen die gegevens en inlichtingen verstrekt, die zij behoeven voor de uitvoering van
      hun taak, waaronder in ieder geval gegevens omtrent de verblijfsrechtelijke positie van de vreemdeling en, indien
      het een gecombineerde vergunning betreft, de gegevens op basis waarvan kan worden beoordeeld of is voldaan aan de
      [Wet arbeid vreemdelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: '107.5'
    text: |-
      Onverminderd het in het tweede lid, onder a, genoemde doel, en in aanvulling op het bepaalde bij of krachtens
      [artikel 107a][ref1], kunnen gegevens als bedoeld in het eerste lid, onder a, uitsluitend beschikbaar worden
      gesteld met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 107a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 107.5.a
    text: het verstrekken van een reisdocument door een diplomatieke vertegenwoordiging ten behoeve van terugkeer;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.5.b
    text: de identificatie van slachtoffers van rampen en ongevallen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.5.c
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.5.d
    text: |-
      de toepassing van [artikel 55c van het Wetboek van Strafvordering][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel55c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 55c
  - number: 107.5.e
    text: |-
      de uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0039896
  - number: '107.6'
    text: |-
      De verstrekking van gegevens betreffende de vingerafdrukken van de vreemdeling uit de vreemdelingenadministratie in
      de gevallen bedoeld in het vijfde lid, onderdeel c, ten behoeve van de opsporing en vervolging van strafbare feiten
      vindt slechts plaats in geval van een misdrijf waarvoor voorlopige hechtenis is toegelaten en na schriftelijke
      machtiging van de rechter-commissaris op vordering van de officier van justitie:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.6.a
    text: indien er een redelijk vermoeden bestaat dat de verdachte een vreemdeling is, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.6.b
    text: |-
      in het belang van het onderzoek en het opsporingsonderzoek op een dood spoor is beland, dan wel snel resultaat
      geboden is bij de opheldering van het misdrijf.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: '107.7'
    text: |-
      Bestuursorganen zijn bevoegd uit eigen beweging en desgevraagd verplicht Onze Minister de gegevens en inlichtingen
      te verstrekken die Onze Minister behoeft voor de uitvoering van deze wet en voor de uitvoering van de Rijkswet
      op het Nederlanderschap. Deze bestuursorganen kunnen daarbij gebruik maken van het vreemdelingennummer, het
      burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1],
      en van andere, bij regeling van Onze Minister aangewezen, nummers.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '107.8'
    text: |-
      De in het vierde tot en met zevende lid bedoelde gegevensverstrekking vindt niet plaats, indien de persoonlijke
      levenssfeer van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: '107.9'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.9.a
    text: |-
      de in de vreemdelingenadministratie op te nemen gegevens, de vastlegging van die gegevens en de doorlevering van
      die gegevens;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.9.b
    text: |-
      de vernietiging van de in de vreemdelingenadministratie opgenomen gegevens, waarbij geldt dat gezichtsopnames en
      vingerafdrukken nooit langer worden bewaard dan tien jaar nadat de aanvraag tot het verlenen van een machtiging tot
      voorlopig verblijf is afgewezen, of, in geval van rechtmatig verblijf, de betrokken vreemdeling wiens rechtmatig
      verblijf is geëindigd, Nederland aantoonbaar heeft verlaten, dan wel, indien tegen de vreemdeling een inreisverbod
      is uitgevaardigd of de vreemdeling ongewenst is verklaard, tien jaar na afloop van de geldigheidsduur van het
      inreisverbod onderscheidenlijk de ongewenstverklaring, en deze gegevens in ieder geval worden vernietigd zodra Onze
      Minister bekend is dat de betrokkene niet langer behoort tot de categorie vreemdelingen waarvan deze kunnen worden
      afgenomen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.9.c
    text: de gevallen, waarin en de wijze waarop in ieder geval gegevens en inlichtingen dienen te worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107.9.d
    text: de gevallen, waarin de verstrekking van gegevens en inlichtingen anders dan kosteloos geschiedt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: '107.10'
    text: |-
      Voor de toepassing van het vierde en zevende lid worden met bestuursorganen gelijkgesteld instellingsbesturen van
      uit de openbare kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare kas bekostigde scholen
      en instellingen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: '107.11'
    text: Met betrekking tot de vreemdelingenadministratie is Onze Minister de verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107
  - number: 107a.1
    text: |-
      Bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] kunnen worden verwerkt, voor
      zover deze gegevens noodzakelijk zijn voor de doelmatige en doeltreffende uitvoering van de visumverlening, de
      grensbewaking, de toelating, het verblijf en de uitzetting van vreemdelingen en het toezicht op vreemdelingen op
      grond van deze wet dan wel de Schengengrenscode.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 107a.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden verwerkt door of namens Onze Minister en de in de
      [artikelen 46 tot en met 48][ref1] aangewezen ambtenaren. Zij kunnen worden verwerkt door derden, voor zover deze
      betrokken zijn bij de uitvoering van deze wet of de Schengengrenscode en daartoe noodzakelijkerwijs de beschikking
      over deze gegevens moeten verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 107a.3
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij wordt
      in ieder geval geregeld:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107a
  - number: 107a.3.a
    text: op welke wijze de verwerking, bedoeld in het eerste lid, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107a
  - number: 107a.3.b
    text: |-
      op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107a
  - number: 107a.3.c
    text: welke gegevens, aan welke personen of instanties, voor welk doel en op welke wijze kunnen worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107a
  - number: 107a.3.d
    text: |-
      op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel waarvoor
      ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede hoe daarop wordt toegezien.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel107a
  - number: '108.1'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de tweede categorie wordt gestraft overtreding
      van bij ministeriële regeling aan te wijzen voorschriften vastgesteld bij of krachtens de Schengengrenscode,
      overtreding van een voorschrift, vastgesteld bij of krachtens de [artikelen 2t, tweede en derde lid][ref1],
      [5, eerste en tweede lid][ref2], [24a, tweede en derde lid][ref3], [46, tweede lid, aanhef, en onder b][ref4],
      alsmede handelen in strijd met [artikel 56, eerste lid][ref5], dan wel handelen in strijd met een verplichting
      opgelegd bij of krachtens de [artikelen 2a, tweede lid onder b][ref6], [6, eerste of derde lid][ref7],
      [6a, eerste lid][ref8], [54][ref9], [55][ref10], [57, eerste lid][ref11], [58, eerste lid][ref12], of
      [65, derde lid][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2t
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref6]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
      [ref7]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
      [ref9]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref10]: https://wetten.overheid.nl/BWBR0011823#Artikel55
      [ref11]: https://wetten.overheid.nl/BWBR0011823#Artikel57
      [ref12]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref13]: https://wetten.overheid.nl/BWBR0011823#Artikel65
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2t
        hoofdstuk: 1a
        paragraaf: '3'
        afdeling: '2'
