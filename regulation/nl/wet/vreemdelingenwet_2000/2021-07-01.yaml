    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel8
  - number: 8.f
    text: |-
      in afwachting van de beslissing op een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de
      [artikelen 14][ref1] en [28][ref2], terwijl bij of krachtens deze wet dan wel op grond van een rechterlijke
