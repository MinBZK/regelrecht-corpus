        artikel: 62b
        hoofdstuk: '6'
        afdeling: '1'
  - number: 72a
    text: |-
      [Artikel 8:88, eerste lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op een
      verzoek tot vergoeding van schade die een vreemdeling lijdt als gevolg van een onrechtmatige handeling van dit
      bestuursorgaan ten aanzien van deze vreemdeling als zodanig. [Artikel 71a][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel71a
