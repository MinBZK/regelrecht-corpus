url: https://wetten.overheid.nl/BWBR0011823/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bestaande wetgeving betreffende de toelating en
    uitzetting van vreemdelingen, het toezicht op vreemdelingen die in Nederland verblijf houden, en de grensbewaking,
    te herzien en daartoe een nieuwe Vreemdelingenwet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - aanvullend document: document waarin de
      aanvullende informatie is opgenomen, bedoeld in artikel 6, eerste lid, tweede alinea van de Richtlijn 2011/98/
      EU van het Europees Parlement en de Raad van 13 december 2011 betreffende één enkele aanvraagprocedure voor een
      gecombineerde vergunning voor onderdanen van derde landen om te verblijven en te werken op het grondgebied van een
      lidstaat, alsmede inzake een gemeenschappelijk pakket rechten voor werknemers uit derde landen die legaal in een
      lidstaat verblijven (PbEU 2011, L343);
        - ambtenaren belast met de grensbewaking: de ambtenaren, bedoeld in [artikel 46][ref1];
        - ambtenaren belast met het toezicht op referenten: de ambtenaren, bedoeld in [artikel 47a][ref2];
        - ambtenaren belast met het toezicht op vreemdelingen: de ambtenaren, bedoeld in [artikel 47][ref3];
        - asiel: het verblijf van de vreemdeling in Nederland op de gronden, bedoeld in de [artikelen 29][ref4] en
      [34][ref5];
        - buitengrenzen: de Nederlandse zeegrenzen, alsmede lucht- of zeehavens waar grenscontrole op personen wordt
      uitgeoefend;
        - Dublinverordening: de verordening (EU) nr. 604/2013 van het Europees Parlement en de Raad van 26 juni 2013 tot
      vaststelling van de criteria en instrumenten om te bepalen welke lidstaat verantwoordelijk is voor de behandeling
      van een verzoek om internationale bescherming dat door een onderdaan van een derde land of een staatloze bij een
      van de lidstaten wordt ingediend (PbEU 2013, L 180);
        - erkende referent: de referent die krachtens [artikel 2c][ref6] als zodanig is erkend;
        - Europese verordeningen die betrekking hebben op biometrische gegevens: 1° Verordening (EU) nr. 603/2013 van het
      Europees Parlement en de Raad van 26 juni 2013 betreffende de instelling van „Eurodac» voor de vergelijking van
      vingerafdrukken ten behoeve van een doeltreffende toepassing van Verordening (EU) nr. 604/2013 tot vaststelling
      van de criteria en instrumenten om te bepalen welke lidstaat verantwoordelijk is voor de behandeling van een
      verzoek om internationale bescherming dat door een onderdaan van een derde land of een staatloze bij een van de
      lidstaten wordt ingediend en betreffende verzoeken van rechtshandhavingsinstanties van de lidstaten en Europol om
      vergelijkingen van Eurodac-gegevens ten behoeve van rechtshandhaving, en tot wijziging van Verordening (EU) nr.
      1077/2011 tot oprichting van een Europees Agentschap voor het operationeel beheer van grootschalige IT- systemen
      op het gebied van vrijheid, veiligheid en recht (PBEU L 180/1); 2° Verordening (EG) 767/2008 van het Europees
      Parlement en de Raad van 9 juli 2008 betreffende het visuminformatiesysteem (VIS) en de uitwisseling tussen de
      lidstaten van gegevens op het gebied van visa voor kort verblijf (PbEU L218); 3° Verordening (EG) 810/2009 van het
      Europees Parlement en de Raad van 13 juli 2009 tot vaststelling van een gemeenschappelijke visumcode (Pb EU L 243);
      4° Verordening (EG) nr. 1030/2002 van de Raad van de Europese Unie van 13 juni 2002 betreffende de invoering van
      een uniform model voor verblijfstitels voor onderdanen van derde landen (PbEU L157);
        - gecombineerde vergunning: verblijfsvergunning regulier voor bepaalde tijd als bedoeld in [artikel 14][ref7],
      verleend door Onze Minister onder de beperking «arbeid in loondienst», «lerend werken» of «seizoenarbeid», tevens
      zijnde vergunning voor het verrichten van werkzaamheden bij een specifieke werkgever, met het aanvullend document;
        - gemeenschapsonderdanen: 1°. onderdanen van de lidstaten van de Europese Unie die op grond van het Verdrag
      betreffende de werking van de Europese Unie gerechtigd zijn een andere lidstaat binnen te komen en er te
      verblijven; 2°. familieleden van de onder 1° genoemden die de nationaliteit van een derde staat bezitten en die
      uit hoofde van een ter toepassing van het Verdrag betreffende de werking van de Europese Unie genomen besluit
      gerechtigd zijn een lidstaat binnen te komen en er te verblijven; 3°. onderdanen van een staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992, die ter zake van binnenkomst en
      verblijf in een lidstaat rechten genieten die gelijk zijn aan die van burgers van de lidstaten van de Europese
      Unie; 4°. familieleden van de onder 3° genoemden die de nationaliteit van een derde staat bezitten en die krachtens
      bovengenoemde Overeenkomst gerechtigd zijn een lidstaat binnen te komen en er te verblijven; 5°. onderdanen
      van de Zwitserse Bondsstaat, indien zij verblijven op grond van de op 21 juni 1999 te Luxemburg totstandgekomen
      Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat, anderzijds,
      over het vrije verkeer van personen (Trb. 2000, 16 en 86); 6°. familieleden van de onder 5° genoemden die de
      nationaliteit van een derde staat bezitten en die krachtens de onder 5° genoemde Overeenkomst gerechtigd zijn een
      lidstaat binnen te komen en er te verblijven;
        - grensprocedure: de asielprocedure, bedoeld in artikel 43 van de Procedurerichtlijn;
        - herhaalde aanvraag: een aanvraag, die op grond van
      [artikel 4:6, tweede lid, van de Algemene wet bestuursrecht][ref8] kan worden afgewezen;
        - inreisverbod: het inreisverbod, bedoeld in artikel 3, punt 6, van de Terugkeerrichtlijn;
        - internationale bescherming: internationale bescherming als bedoeld in artikel 2, onder a, van de
      Kwalificatierichtlijn;
        - de korpschef: de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref9];
        - Kwalificatierichtlijn: de richtlijn nr. 2011/95/EU van het Europees Parlement en de Raad van 13 december 2011
      inzake normen voor de erkenning van onderdanen van derde landen of staatlozen als personen die internationale
      bescherming genieten, voor een uniforme status voor vluchtelingen of voor personen die in aanmerking komen voor
      subsidiaire bescherming, en voor de inhoud van de verleende bescherming (PbEU 2011, L 337);
        - langdurig ingezetene: houder van een EU-verblijfsvergunning voor langdurig ingezetenen als bedoeld in [richtlijn
      nr. 2003/109/EG](32003L0109) van de Raad van de Europese Unie van 25 november 2003 betreffende de status van
      langdurig ingezeten onderdanen van derde landen (PbEU 2004, L16), zoals gewijzigd door [richtlijn 2011/51]
      (32011L0051)/EU van het Europees Parlement en de Raad teneinde haar werkingssfeer uit te breiden tot personen die
      internationale bescherming genieten (PbEU 2011, L 132), dan wel van een door een andere lidstaat van de Europese
      Unie op grond van deze richtlijn afgegeven EU-verblijfsvergunning voor langdurig ingezetenen;
        - minderjarige: eenieder die de leeftijd van 18 jaar nog niet heeft bereikt;
        - Onze Minister: Onze Minister van Veiligheid en Justitie;
        - Opvangrichtlijn: Richtlijn 2013/33/EU van het Europees Parlement en de Raad van 26 juni 2013 tot vaststelling van
      normen voor de opvang van verzoekers om internationale bescherming (PbEU 2013, L 180);
        - opvolgende aanvraag: een volgend verzoek als bedoeld in artikel 2, onderdeel q, van de Procedurerichtlijn;
        - overdrachtsbesluit: het besluit, bedoeld in artikel 26 van de Dublinverordening;
        - persoonsgegevens en verwerking van persoonsgegevens: hetgeen daaronder wordt verstaan in artikel 4, aanhef en
      onder 1 en 2, van de Algemene verordening gegevensbescherming;
        - Procedurerichtlijn: Richtlijn 2013/32/EU van het Europees Parlement en de Raad van 26 juni 2013 betreffende
      gemeenschappelijke procedures voor de toekenning en intrekking van internationale bescherming (PbEU 2013, L 180);
        - referent: degene die overeenkomstig [artikel 2a][ref10] een verklaring heeft afgelegd of als zodanig is
      aangewezen;
        - richtlijn tijdelijke bescherming: [richtlijn nr. 2001/55/EG](32001L0055) van de Raad van 20 juli 2001 betreffende
      minimumnormen voor het verlenen van tijdelijke bescherming in geval van massale toestroom van ontheemden en
      maatregelen ter bevordering van een evenwicht tussen de inspanning van de lidstaten voor de opvang en het dragen
      van de consequentie van de opvang van deze personen (PbEG L 212);
        - Schengengrenscode: Verordening (EU) 2016/399 van het Europees Parlement en de Raad van 9 maart 2016 betreffende
      een Uniecode voor de overschrijding van de grenzen door personen (Schengengrenscode) (PbEU, L77);
        - terugkeerbesluit: het terugkeerbesluit, bedoeld in artikel 3, punt 4, van de Terugkeerrichtlijn;
        - Terugkeerrichtlijn: Richtlijn 2008/115/EG van het Europees Parlement en de Raad van 16 december 2008 over
      gemeenschappelijke normen en procedures in de lidstaten voor de terugkeer van onderdanen van derde landen die
      illegaal op hun grondgebied verblijven (PbEU 2008, L 348);
        - tijdelijke bescherming: rechtmatig verblijf in de zin van [artikel 8, onder f of h][ref11], van de vreemdeling
      wiens uitzetting in verband met een aanvraag als bedoeld in [artikel 28][ref12] op grond van de richtlijn
      tijdelijke bescherming achterwege blijft;
        - verblijf op reguliere gronden: het verblijf van een vreemdeling in Nederland op grond van deze wet anders dan op
      de gronden bedoeld in de [artikelen 29][ref13] en [34][ref14];
        - verdragsvluchteling: de vreemdeling die vluchteling is in de zin van het Vluchtelingenverdrag en op wie de
      bepalingen ervan van toepassing zijn;
        - Vluchtelingenverdrag: het Verdrag van Genève van 1951 betreffende de status van vluchtelingen (Trb. 1954, 88) en
      het bijbehorende Protocol van New York van 1967 (Trb. 1967, 76);
        - vreemdeling: ieder die de Nederlandse nationaliteit niet bezit en niet op grond van een wettelijke bepaling als
      Nederlander moet worden behandeld;


