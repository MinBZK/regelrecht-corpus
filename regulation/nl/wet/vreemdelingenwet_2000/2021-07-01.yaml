  - number: 71a.1
    text: |-
      In afwijking van [artikel 8:89, tweede lid, van de Algemene wet bestuursrecht][ref1] is de bestuursrechter bij
      uitsluiting bevoegd tot behandeling van een verzoek als bedoeld in [artikel 8:88, eerste lid, van die wet][ref2]
      tot vergoeding van schade die een vreemdeling lijdt als gevolg van een onrechtmatig besluit ten aanzien van deze
      vreemdeling als zodanig.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel71a
