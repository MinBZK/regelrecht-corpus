        paragraaf: '2'
        afdeling: '1'
  - number: '78'
    text: |-
      Indien een verzoek om een voorlopige voorziening is gedaan teneinde uitzetting te voorkomen voordat is beslist
      op het bezwaar of het administratief beroep, dat is gericht tegen de beschikking tot afwijzing van de aanvraag of
      intrekking van de verblijfsvergunning, beslist de voorzieningenrechter van de rechtbank zoveel mogelijk tevens over
      dat bezwaar of administratief beroep.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel78
  - number: '79.1'
    text: 'Deze afdeling is slechts van toepassing indien beroep wordt ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel79
  - number: 79.1.a
    text: |-
      een besluit omtrent een verblijfsvergunning als bedoeld in de [artikelen 28][ref1] en [33][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 79.1.b
    text: |-
      een besluit omtrent een EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling die in het bezit is
      van een verblijfsvergunning als bedoeld in [artikel 28][ref1] of [artikel 33][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 79.1.c
    text: |-
      een besluit omtrent de intrekking van een EU-verblijfsvergunning voor langdurig ingezetenen van een vreemdeling
      op wiens document, bedoeld in [artikel 9][ref1], de aantekening, bedoeld in [artikel 45c, eerste lid][ref2], is
      geplaatst dan wel omtrent het wijzigen of schrappen van die aantekening;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 79.1.d
    text: |-
      een besluit omtrent tijdelijke bescherming of toepassing van [artikel 45, vierde lid][ref1], indien de vreemdeling
      in de gelegenheid is gesteld zijn zienswijze over het voornemen van dat besluit te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '4'
  - number: '79.2'
    text: |-
      Deze afdeling is van overeenkomstige toepassing indien beroep wordt ingesteld tegen een besluit als bedoeld in de
      [artikelen 43][ref1] en [45, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '4'
  - number: '79.3'
    text: |-
      Deze afdeling is van overeenkomstige toepassing indien in de voornemenprocedure, bedoeld in de [artikelen 39][ref1]
      en [41][ref2], de vreemdeling tevens in de gelegenheid is gesteld om zijn zienswijze te geven over het voornemen
      niet ambtshalve een verblijfsvergunning als bedoeld in [artikel 14][ref3] te verlenen dan wel over het voornemen om
      de uitzetting of overdracht niet op grond van [artikel 64][ref4] achterwege te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel64
