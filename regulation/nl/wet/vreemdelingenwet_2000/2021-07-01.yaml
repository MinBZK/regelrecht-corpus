  - number: 83c.4
    text: |-
      De [artikelen 8:110 tot en met 8:112 van de Algemene wet bestuursrecht][ref1] zijn niet van toepassing op een hoger
      beroep:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 83c.4.a
    text: |-
      als bedoeld in [artikel 95, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel95
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83c
    references:
