  - number: 83b.4
    text: |-
      In de gevallen, bedoeld in het eerste en derde lid, is
      [artikel 8:52, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83b
    references:
