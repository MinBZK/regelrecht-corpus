  - number: '84'
    text: |-
      In afwijking van [artikel 8:104, eerste lid, van de Algemene wet bestuursrecht][ref1] staat geen hoger beroep open
      tegen een uitspraak van de rechtbank of van de voorzieningenrechter van de rechtbank:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 84.a
    text: |-
      over een besluit of handeling op grond van [artikel 6, eerste lid][ref1], [artikel 6a, eerste lid][ref2],
      [hoofdstuk 4][ref3] of [hoofdstuk 5][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk5
