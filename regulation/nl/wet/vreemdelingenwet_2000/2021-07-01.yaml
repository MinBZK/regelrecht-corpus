        afdeling: '3'
  - number: '34.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het
      inburgeringsvereiste, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel34
  - number: '35.1'
    text: |-
      De verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1] kan worden ingetrokken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 35.1.a
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de aanvraag tot het verlenen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel35
  - number: 35.1.b
    text: |-
      de vreemdeling bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen
      een gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem terzake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1], is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 35.1.c
    text: de vreemdeling zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel35
  - number: 35.1.d
    text: de vreemdeling een gevaar vormt voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel35
  - number: '35.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel35
  - number: '36'
    text: 'De aanvraag tot het verlenen van:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel36
  - number: 36.a
    text: |-
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] of tot het verlengen van de
      geldigheidsduur ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 36.b
    text: |-
      een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '37.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel37
  - number: 37.1.a
    text: de wijze van indiening en behandeling van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel37
  - number: 37.1.b
    text: de wijze waarop het onderzoek naar de aanvraag, daaronder begrepen het horen van de vreemdeling, wordt ingericht;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel37
  - number: 37.1.c
    text: de gegevens die de vreemdeling in persoon moet verstrekken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel37
  - number: 37.1.d
    text: |-
      de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede de bij
      of krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling of aan andere
      belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van beschikkingen ook kan
      geschieden door middel van het toezenden of uitreiken van een document en door het stellen van aantekeningen in een
      daarbij aan te wijzen document.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel37
  - number: '37.2'
    text: |-
      De vreemdeling is, volgens door Onze Minister te geven regels, leges verschuldigd terzake van de afdoening
      van een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33][ref1]. Daarbij kan Onze
      Minister bepalen dat de vreemdeling voor de afgifte van het document waaruit het rechtmatig verblijf blijkt leges
      verschuldigd is. Als betaling achterwege blijft, wordt de aanvraag niet in behandeling genomen dan wel het document
      niet afgegeven. [Artikel 4:5, vierde lid, Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '37.3'
    text: |-
      Onze Minister kan bepalen dat de vreemdeling leges verschuldigd is voor de afgifte van een vervangend document
      waaruit het rechtmatig verblijf blijkt als bedoeld in [artikel 8, onder c][ref1], indien het oorspronkelijke
      document wordt vermist, verloren is gegaan of voor identificatie ondeugdelijk is geworden. Indien betaling
      achterwege blijft, wordt het document niet afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '38.1'
    text: |-
      Indien de vreemdeling in de gelegenheid wordt gesteld zich omtrent de aanvraag tot het verlenen van een
      verblijfsvergunning of het verlengen van de geldigheidsduur ervan te doen horen, wordt de vreemdeling gehoord in
      een taal waaraan de vreemdeling de voorkeur geeft, tenzij er een andere taal kan worden gebruikt die hij begrijpt
      en waarin hij helder kan communiceren.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel38
  - number: '38.2'
    text: |-
      Bij of direct na de indiening van de aanvraag tot het verlenen van een verblijfsvergunning wijst Onze Minister de
      vreemdeling erop dat hij elementen en bevindingen aannemelijk moet maken die hetzij op zichzelf, hetzij in verband
      met andere elementen en bevindingen, een rechtsgrond voor de verlening of verlenging van de vergunning vormen.
      Daarbij wordt hij erop gewezen dat hij daartoe verklaringen moet afleggen en alle bewijsmiddelen waarover hij
      beschikt of redelijkerwijs de beschikking kan krijgen moet overleggen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel38
  - number: '38.3'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel38
  - number: '39.1'
    text: |-
      Indien Onze Minister voornemens is de aanvraag tot het verlenen van een verblijfsvergunning of het verlengen van
      de geldigheidsduur ervan af te wijzen, dan wordt de vreemdeling hiervan, onder opgave van redenen, schriftelijk
      mededeling gedaan. De mededeling kan eveneens betrekking hebben op het voornemen om niet ambtshalve een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] te verlenen dan wel op het voornemen om
      de uitzetting of overdracht niet op grond van [artikel 64][ref2] achterwege te laten. Het schriftelijke voornemen
      wordt aan de vreemdeling meegedeeld door uitreiking of toezending ervan. De op de aanvraag betrekking hebbende
      stukken worden bij de schriftelijke mededeling gevoegd, voor zover de vreemdeling geen kennis kan hebben van de
      inhoud van deze stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '39.2'
    text: |-
      De vreemdeling brengt zijn zienswijze, in afwijking van [artikel 4:9 van de Algemene wet bestuursrecht][ref1],
      schriftelijk naar voren binnen de door Onze Minister bepaalde redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '39.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 37][ref1], worden regels gesteld omtrent de termijn,
      bedoeld in het tweede lid, alsmede de toepassing van de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel37
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: '40'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1]
      kan niet eerder worden ingediend dan vier weken voordat de vreemdeling gedurende vijf achtereenvolgende jaren
      rechtmatig verblijf als bedoeld in [artikel 8, onder c][ref2], heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '41.1'
    text: |-
      Indien Onze Minister voornemens is om de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1],
      dan wel de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 33][ref2], in te trekken, zijn de
      [artikelen 38][ref3] en [39][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: '41.2'
    text: |-
      Indien Onze Minister, na ontvangst van de zienswijze van de vreemdeling, voornemens blijft de verblijfsvergunning
      in te trekken, dan wordt de vreemdeling in de gelegenheid gesteld zich te doen horen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel41
  - number: '42.1'
    text: |-
      Op de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1],
      dan wel een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref2], wordt binnen zes maanden na
      ontvangst van de aanvraag een beschikking gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '42.2'
    text: |-
      De inwilliging van de aanvraag is mede afgestemd op het beleid dat Onze Minister na overleg met Onze Minister van
      Buitenlandse Zaken dienaangaande voert.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
  - number: '42.3'
    text: |-
      Indien de aanvraag wordt afgewezen, wordt in de beschikking ingegaan op de zienswijze van de vreemdeling. In de
      beschikking wordt tevens ingegaan op de zienswijze van de vreemdeling op het voornemen om niet ambtshalve een
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14][ref1], te verlenen, dan wel op het voornemen om
      de uitzetting of overdracht niet op grond van [artikel 64][ref2] achterwege te laten indien hem van dat voornemen
      mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '42.4'
    text: 'De termijn, bedoeld in het eerste lid, kan met ten hoogste negen maanden worden verlengd, indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
  - number: 42.4.a
    text: complexe feitelijke of juridische kwesties aan de orde zijn;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
  - number: 42.4.b
    text: |-
      een groot aantal vreemdelingen tegelijk een aanvraag indient waardoor het in de praktijk zeer moeilijk is de
      procedure binnen de termijn van zes maanden af te ronden; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
  - number: 42.4.c
    text: de vertraging van de behandeling van de aanvraag aan de vreemdeling is toe te schrijven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
  - number: '42.5'
    text: |-
      Indien dit noodzakelijk is met het oog op een behoorlijke en volledige behandeling van de aanvraag, kan de termijn
      na de verlenging, bedoeld in het vierde lid, nogmaals verlengd worden met ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
  - number: '42.6'
    text: |-
      Indien in het kader van de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld
      in [artikel 28][ref1] wordt onderzocht of de aanvraag op grond van [artikel 30][ref2] niet in behandeling dient
      te worden genomen, vangt de termijn, bedoeld in het eerste lid, aan op het tijdstip waarop overeenkomstig de
      Dublinverordening wordt vastgesteld dat Nederland verantwoordelijk is voor de behandeling van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '42.7'
    text: |-
      Onze Minister stelt de vreemdeling in kennis van de verlenging van de termijn en geeft, indien de vreemdeling
      daarom verzoekt, informatie over de reden van de verlenging en een indicatie van het tijdsbestek waarbinnen de
      beschikking, bedoeld in het eerste lid, te verwachten valt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel42
  - number: '43.1'
    text: |-
      Bij besluit van Onze Minister kan voor bepaalde categorieën vreemdelingen die een aanvraag tot het verlenen van
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] hebben ingediend, de termijn, bedoeld
      in [artikel 42, eerste lid][ref2], worden verlengd tot ten hoogste eenentwintig maanden, indien naar verwachting
      voor een korte periode onzekerheid zal bestaan over de situatie in het land van herkomst en op grond daarvan
      redelijkerwijs niet kan worden beslist of de aanvraag op een van de gronden genoemd in [artikel 29][ref3] kan
      worden ingewilligd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '43.2'
    text: 'Indien Onze Minister een besluit neemt als bedoeld in het eerste lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel43
  - number: 43.2.a
    text: ten minste elke zes maanden de situatie in het betreffende land van herkomst beoordeeld;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel43
  - number: 43.2.b
    text: binnen een redelijke termijn mededeling van het uitstel en de redenen voor het uitstel gedaan aan de aanvragers; en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel43
  - number: 43.2.c
    text: binnen een redelijke termijn mededeling van het uitstel gedaan aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel43
  - number: 43a.1
    text: |-
      In afwijking van [artikel 42, eerste lid][ref1], en onverminderd
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2], wordt de beschikking op de aanvraag tot het verlenen van
      de verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref3] ten aanzien van vreemdelingen die
      tijdelijke bescherming genieten, op een tijdstip gelegen tussen de ontvangst van de aanvraag en zes maanden na
      afloop van de tijdelijke bescherming gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 43a.2
    text: |-
      De [artikelen 42, vierde lid][ref1], en [43][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel43
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '44.1'
    text: |-
      Verlening van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1], die rechtmatig
      verblijf inhoudt, heeft van rechtswege tot gevolg de beëindiging van de verstrekkingen voorzien bij
      of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref2] of een ander wettelijk voorschrift dat
      soortgelijke verstrekkingen regelt. De verstrekkingen worden beëindigd op de wijze voorzien bij of krachtens
      de [Wet Centraal Orgaan opvang asielzoekers][ref3] of in het andere wettelijk voorschrift en binnen de daartoe
      gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006685
      [ref3]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006685
      - id: ref3
        bwb_id: BWBR0006685
  - number: '44.2'
    text: |-
      Indien de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28, eerste lid][ref1], onder a, wordt ingewilligd, wordt deze verblijfsvergunning verleend met ingang van
      de datum waarop de aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '44.3'
    text: |-
      De verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28, eerste lid, onder e][ref1], wordt verleend
      met ingang van de datum waarop de verblijfsvergunning als bedoeld in [artikel 14][ref2] is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '44.4'
    text: |-
      De verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1] wordt verleend met ingang van de
      datum waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '44.5'
    text: |-
      Indien de vreemdeling de aanvraag tot verlenging van de verblijfsvergunning bedoeld in [artikel 28][ref1], dan
      wel de gegevens waaruit blijkt dat aan de voorwaarden wordt voldaan niet tijdig heeft ingediend en hem dit niet is
      toe te rekenen, kan de verblijfsvergunning worden verlengd met ingang van de dag na die waarop de geldigheidsduur
      van de verblijfsvergunning waarvoor verlenging is gevraagd afloopt. De voorgaande volzin is van overeenkomstige
      toepassing op de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 44a.1
    text: |-
      Indien een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1],
      niet in behandeling wordt genomen op grond van [artikel 30, eerste lid][ref2], geldt dit besluit als
      overdrachtsbesluit, en heeft het van rechtswege tot gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 44a.1.a
    text: |-
      de vreemdeling rechtmatig verblijf heeft op grond van [artikel 8, onder m][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 44a.1.b
    text: |-
      de ambtenaren belast met het toezicht op vreemdelingen bevoegd zijn elke plaats te betreden, daaronder begrepen een
      woning zonder toestemming van de bewoner, teneinde de vreemdeling over te dragen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44a
  - number: 44a.1.c
    text: |-
      de vreemdeling Nederland uit eigen beweging dient te verlaten binnen de in [artikel 62c][ref1] gestelde termijn,
      bij gebreke waarvan de vreemdeling kan worden overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62c
        hoofdstuk: '6'
        afdeling: '1'
  - number: 44a.2
    text: |-
      Het in het eerste lid, onder b, bedoelde gevolg treedt niet in, indien de in [artikel 62c][ref1] bedoelde termijn
      nog niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62c
        hoofdstuk: '6'
        afdeling: '1'
  - number: '45.1'
    text: |-
      De beschikking waarbij een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 28][ref1], of voor onbepaalde tijd, bedoeld in [artikel 33][ref2], wordt afgewezen, geldt als
      terugkeerbesluit, tenzij reeds eerder een terugkeerbesluit tegen de vreemdeling is uitgevaardigd en aan de daaruit
      voortvloeiende terugkeerverplichting niet is voldaan, en heeft van rechtswege tot gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 45.1.a
    text: |-
      de vreemdeling niet langer rechtmatig in Nederland verblijft tenzij een andere rechtsgrond voor rechtmatig verblijf
      als bedoeld in [artikel 8][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 45.1.b
    text: |-
      de vreemdeling Nederland uit eigen beweging dient te verlaten binnen de in [artikel 62][ref1] gestelde termijn, bij
      gebreke waarvan de vreemdeling kan worden uitgezet;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 45.1.c
    text: |-
      de verstrekkingen voorzien bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref1] of een ander
      wettelijk voorschrift dat soortgelijke verstrekkingen regelt worden beëindigd op de bij of krachtens die wet of dat
      wettelijke voorschrift voorziene wijze en binnen de daartoe gestelde termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006685
  - number: 45.1.d
    text: |-
      de ambtenaren belast met het toezicht op vreemdelingen na ommekomst van de termijn waarbinnen de vreemdeling
      Nederland uit eigen beweging dient te verlaten, bevoegd zijn elke plaats te betreden, daaronder begrepen een woning
      zonder toestemming van de bewoner, teneinde de vreemdeling uit te zetten;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
  - number: 45.1.e
    text: |-
      de ambtenaren belast met het toezicht op vreemdelingen bevoegd zijn na ommekomst van de termijn als bedoeld in
      onderdeel c een onroerende zaak gedwongen te ontruimen teneinde het onderdak of het verblijf in de woonruimte als
      verstrekking geboden, bedoeld in onderdeel c, te beëindigen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
  - number: '45.2'
    text: 'Het eerste lid is van overeenkomstige toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
  - number: 45.2.a
    text: |-
      ingevolge [artikel 4:5 van de Algemene wet bestuursrecht][ref1] is besloten dat de aanvraag tot het verlenen van
      een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref2] niet in behandeling wordt genomen,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 45.2.b
    text: een verblijfsvergunning is ingetrokken of niet verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
  - number: '45.3'
    text: |-
      De in het eerste lid bedoelde gevolgen van de beschikking treden niet in zolang het beroep van de vreemdeling de
      werking van de beschikking opschort.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
  - number: '45.4'
    text: |-
      Onze Minister kan besluiten dat, in afwijking van het eerste lid, aanhef en onder c, de verstrekkingen voorzien bij
      of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref1] of een ander wettelijk voorschrift dat soortgelijke
      verstrekkingen regelt, voor bepaalde categorieën vreemdelingen niet worden beëindigd, of voor de duur van het
      besluit opnieuw worden verleend. Het besluit wordt uiterlijk één jaar na de bekendmaking ervan ingetrokken. Na
      afloop van de duur van het besluit treden de opgeschorte rechtsgevolgen opnieuw in.


      [ref1]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006685
  - number: '45.5'
    text: |-
      De vreemdeling op wie het besluit als bedoeld in het vierde lid van toepassing is, wordt geacht rechtmatig verblijf
      als bedoeld in [artikel 8, onder j][ref1], te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '45.6'
    text: |-
      De in het eerste lid bedoelde gevolgen van de beschikking treden niet in zolang de uitzetting van de vreemdeling
      op grond van de richtlijn tijdelijke bescherming achterwege blijft. De reeds ingetreden gevolgen worden opgeschort,
      indien Onze Minister heeft vastgesteld dat uitzetting op grond van de richtlijn tijdelijke bescherming achterwege
      blijft. De opgeschorte gevolgen, bedoeld in het eerste lid, treden opnieuw in na afloop van de tijdelijke
      bescherming.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
  - number: '45.7'
    text: |-
      Het verblijf van de vreemdeling, bedoeld in het zesde lid, wordt gelijkgesteld met rechtmatig verblijf in de zin
      van [artikel 8, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '45.8'
    text: De beschikking, bedoeld in het eerste lid, kan tevens een inreisverbod inhouden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
  - number: '45.9'
    text: |-
      Indien de beschikking inhoudt dat de aanvraag van de vreemdeling tot het verlenen van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28][ref1] niet-ontvankelijk is verklaard op grond van
      [artikel 30a, eerste lid, onderdeel a][ref2], geldt de beschikking, in afwijking van het eerste lid, aanhef,
      niet als terugkeerbesluit en is de vreemdeling, in afwijking van het eerste lid, onderdeel b, gehouden
      Nederland onmiddellijk te verlaten en zich naar het grondgebied te begeven van de lidstaat die een geldige
      verblijfsvergunning of andere toestemming tot verblijf heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 45a.1
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45a
  - number: 45a.1.a
    text: |-
      de aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig ingezetenen in te willigen, af te wijzen
      dan wel niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45a
  - number: 45a.1.b
    text: een EU-verblijfsvergunning voor langdurig ingezetenen in te trekken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45a
  - number: 45a.2
    text: |-
      De status van langdurig ingezetene wordt verworven door de verlening van een EU-verblijfsvergunning voor langdurig
      ingezetenen. De status van langdurig ingezetene is permanent, onverminderd [artikel 45d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45d
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45d
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 45b.1
    text: |-
      De aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig ingezetenen wordt afgewezen, indien de
      vreemdeling direct voorafgaande aan de aanvraag:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.1.a
    text: |-
      een verblijfsrecht van tijdelijke aard heeft op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld
      in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 45b.1.b
    text: een formeel beperkt verblijfsrecht heeft;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.1.c
    text: verblijf heeft op grond van een bijzondere geprivilegieerde status;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.1.d
    text: |-
      verblijf heeft op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1], die niet
      is verleend op grond van [artikel 29, eerste lid, onder a of b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 45b.1.e
    text: |-
      verblijf heeft op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1],
      die is verleend op grond van [artikel 29, tweede lid][ref2], bij een vreemdeling die in het bezit is van een
      verblijfsvergunning als bedoeld in artikel 28, die niet is verleend op grond van artikel 29, eerste lid, onder a
      of b.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 45b.2
    text: |-
      Onverminderd het eerste lid kan de aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig
      ingezetenen slechts worden afgewezen, indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.2.a
    text: |-
      niet gedurende vijf jaren ononderbroken en direct voorafgaande aan de aanvraag rechtmatig verblijf als bedoeld in
      [artikel 8][ref1] heeft gehad, met inachtneming van het derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 45b.2.b
    text: |-
      in de periode, bedoeld onder a, zes of meer achtereenvolgende maanden of in totaal tien of meer maanden buiten
      Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.2.c
    text: |-
      al of niet tezamen met de gezinsleden bij wie hij verblijft, niet zelfstandig en duurzaam beschikt over voldoende
      middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.2.d
    text: |-
      bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem ter zake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1], is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 45b.2.e
    text: een gevaar vormt voor de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.2.f
    text: |-
      niet beschikt over een toereikende ziektekostenverzekering voor hemzelf en de te zijnen laste komende gezinsleden;
      of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.2.g
    text: |-
      het examen, bedoeld in [artikel 7, eerste lid, onderdeel a van de Wet inburgering][ref1], of een diploma,
      certificaat of ander document als bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref2] niet heeft
      behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 45b.3
    text: |-
      Voor de berekening van de periode bedoeld in het tweede lid, onder a, wordt verblijf als bedoeld in het eerste lid
      en verblijf als bedoeld in het tweede lid, onder b, niet meegeteld, met uitzondering van verblijf voor studie of
      beroepsopleiding, dat voor de helft wordt meegeteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45b.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45b
  - number: 45c.1
    text: |-
      Op het document, bedoeld in [artikel 9][ref1], van de vreemdeling aan wie een EU-verblijfsvergunning voor langdurig
      ingezetenen is verleend, wordt de aantekening «Internationale bescherming op [datum] verleend door Nederland»
      geplaatst, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 45c.1.a
    text: |-
      de vreemdeling direct voorafgaande aan de aanvraag in het bezit was van een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 28][ref1], die is verleend op grond van [artikel 29, eerste lid, onder a of b][ref2],
      tenzij de grond voor die verlening is vervallen; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 45c.1.b
    text: |-
      de vreemdeling direct voorafgaande aan de aanvraag in het bezit was van een verblijfsvergunning
      voor onbepaalde tijd als bedoeld in [artikel 33][ref1], mits hij voordien in het bezit was van een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref2], die is verleend op grond van
      [artikel 29, eerste lid, onder a of b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 45c.2
    text: |-
      Indien de EU-verblijfsvergunning voor langdurig ingezetenen wordt verleend aan een onderdaan van een derde land die
      reeds een verblijfsdocument bezit dat door een andere lidstaat is afgegeven en dat de aantekening «Internationale
      bescherming op [datum] verleend door [lidstaat]» bevat, wordt op het document, bedoeld in [artikel 9][ref1],
      dezelfde aantekening geplaatst, tenzij de internationale bescherming bij een definitief besluit van die andere
      lidstaat is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 45c.3
    text: |-
      Indien uit een verzoek van de autoriteiten van een andere lidstaat van de Europese Unie aan Onze Minister blijkt
      dat de internationale bescherming van de houder van een document als bedoeld in [artikel 9][ref1], met daarop
      de aantekening als bedoeld in het eerste lid, door deze lidstaat is overgenomen alvorens deze lidstaat een EU-
      verblijfsvergunning voor langdurig ingezetenen heeft afgegeven, wordt de aantekening op het document, bedoeld in
      artikel 9, dienovereenkomstig gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 45c.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het
      eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45c
  - number: 45d.1
    text: 'De EU-verblijfsvergunning voor langdurig ingezetenen kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45d.1.a
    text: |-
      de vreemdeling een aaneengesloten periode van twaalf maanden of langer buiten het grondgebied van de Europese Unie,
      dan wel zes jaar of langer buiten Nederland heeft verbleven; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45d.1.b
    text: de vreemdeling een actuele en ernstige bedreiging voor de openbare orde of de nationale veiligheid vormt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45d.2
    text: |-
      De EU-verblijfsvergunning voor langdurig ingezetenen van de vreemdeling op wiens document, bedoeld in
      [artikel 9][ref1], de aantekening, bedoeld in [artikel 45c, eerste lid][ref2], is geplaatst, kan worden
      ingetrokken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 45c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 45d.2.a
    text: |-
      er ernstige redenen zijn om aan te nemen dat de vreemdeling zich schuldig heeft gemaakt aan een van de misdrijven
      of daden, bedoeld in artikel 1, onder F, van het Vluchtelingenverdrag dan wel heeft aangezet tot of anderszins
      heeft deelgenomen aan deze misdrijven of daden; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45d.2.b
    text: |-
      de vreemdeling feiten verkeerd heeft weergegeven of heeft achtergehouden, of valse documenten heeft gebruikt, en
      dit doorslaggevend is geweest voor de verlening van de verblijfsvergunning, bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 45d.3
    text: 'De EU-verblijfsvergunning voor langdurig ingezetenen wordt ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45d.3.a
    text: de vreemdeling langdurig ingezetene is geworden in een andere lidstaat van de Europese Unie; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45d.3.b
    text: de verblijfsvergunning op frauduleuze wijze is verkregen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45d.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste,
      tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45d
  - number: 45e
    text: |-
      Het bij of krachtens de [artikelen 23][ref1], [24][ref2] en [24a][ref3] bepaalde is van overeenkomstige toepassing
      op de aanvraag tot het verlenen van een EU-verblijfsvergunning voor langdurig ingezetenen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel45e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
      - id: ref3
