  - number: 1a
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *annulering van een visum:* intrekking van
      een visum met terugwerkende kracht tot en met het tijdstip van de verlening;
        - *machtiging tot voorlopig verblijf:* visum voor de toegang tot Nederland voor verblijf van meer dan 90 dagen;
        - *terugkeervisum:* visum voor de toegang tot Nederland van een vreemdeling die Nederland tijdelijk zal verlaten;
        - *visum:* elk der visa voor toegang tot Nederland met het oog op verblijf van niet langer dan 90 dagen, afgegeven
      door of vanwege een bevoegde autoriteit als bedoeld in een bindend besluit van de Raad van de Europese Unie, van
      het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen, alsmede de onder
      b en c bedoelde visa.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel1a
  - number: '2.1'
    text: Er is een Adviescommissie voor vreemdelingenzaken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      De commissie bestaat uit ten minste zeven leden. Ambtenaren die werkzaam zijn bij een ministerie of een daaronder
      ressorterende instelling, dienst of bedrijf, dan wel anderszins werkzaamheden verrichten in ondergeschiktheid aan
      Onze Ministers, worden niet tot lid benoemd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2
  - number: '2.3'
    text: Als voorzitter wordt bij voorkeur een rechterlijk ambtenaar met rechtspraak belast benoemd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2
  - number: '2.4'
    text: |-
      De commissie heeft tot taak Onze Minister te adviseren over het vreemdelingenrecht en het beleid ter zake,
      waaronder begrepen wijzigingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2
  - number: '2.5'
    text: Bij algemene maatregel van bestuur worden regels gesteld over de inrichting en de werkwijze van de commissie.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2
  - number: '2.6'
    text: |-
      De commissie is bevoegd bij een ieder schriftelijk of mondeling de inlichtingen in te winnen welke zij voor de
      vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2
  - number: 2a.1
    text: |-
      Ten behoeve van het verblijf van een vreemdeling in Nederland, niet zijnde een gemeenschapsonderdaan, kan in ieder
      geval als referent optreden:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
  - number: 2a.1.a
    text: een Nederlander, die in Nederland verblijft of met die vreemdeling in Nederland gaat verblijven;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
  - number: 2a.1.b
    text: |-
      een vreemdeling, die rechtmatig in Nederland verblijft op grond van [artikel 8, onder a tot en met e of l][ref1],
      of die voor verblijf langer dan 90 dagen in Nederland mag verblijven en met die vreemdeling in Nederland gaat
      verblijven;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 2a.1.c
    text: |-
      een onderneming of rechtspersoon, dan wel een vestiging daarvan, die is ingeschreven in het handelsregister,
      bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 2a.2
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
  - number: 2a.2.a
    text: worden nadere regels gesteld omtrent de natuurlijke personen en organisaties, die als referent kunnen optreden;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
  - number: 2a.2.b
    text: wordt ten aanzien van referenten voorzien in zorgplichten jegens de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
  - number: 2a.2.c
    text: kunnen regels worden gesteld omtrent de aanwijzing als referent.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
  - number: 2a.3
    text: Onze Minister stelt het model van de verklaring, bedoeld in het eerste lid, vast.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2a
  - number: 2b.1
    text: 'Het referentschap eindigt in ieder geval, indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2b.1.a
    text: ten behoeve van het verblijf van de vreemdeling in Nederland een ander als referent optreedt;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2b.1.b
    text: de verblijfsvergunning van de vreemdeling is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2b.1.c
    text: |-
      de vreemdeling in het bezit is gesteld van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 2b.1.d
    text: de vreemdeling Nederlander wordt of krachtens enige wet als Nederlander moet worden behandeld;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2b.1.e
    text: |-
      de referent aan Onze Minister overeenkomstig door Onze Minister gestelde regels naar waarheid mededeling heeft
      gedaan van de beëindiging van diens aan het referentschap ten grondslag liggende relatie tot de vreemdeling, dan
      wel van het definitieve vertrek van de vreemdeling uit Nederland;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2b.1.f
    text: de vreemdeling is overleden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2b.2
    text: Onze Minister stelt de gewezen referent in kennis van de beëindiging van diens referentschap.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de beëindiging van het
      referentschap.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2b
  - number: 2c.1
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
  - number: 2c.1.a
    text: de aanvraag tot erkenning als referent in te willigen, af te wijzen, dan wel niet in behandeling te nemen, en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
  - number: 2c.1.b
    text: de erkenning als referent te schorsen, in te trekken dan wel te wijzigen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
  - number: 2c.2
    text: De erkenning als referent houdt verband met het doel waarvoor de vreemdeling in Nederland wil verblijven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
  - number: 2c.3
    text: De erkenning als referent geldt voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
  - number: 2c.4
    text: |-
      De beschikking op een aanvraag omtrent de erkenning als referent wordt gegeven binnen drie maanden, welke termijn
      kan worden verlengd voor ten hoogste zes maanden, indien naar het oordeel van Onze Minister voor de beoordeling
      van de aanvraag advies van of onderzoek door derden of het openbaar ministerie, dan wel een verklaring omtrent het
      gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1], nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 2c.5
    text: |-
      De aanvrager is in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven
      regels leges verschuldigd terzake van de afdoening van een aanvraag omtrent de erkenning als referent.
      [Artikel 4:5, vierde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2c.6
    text: Onze Minister houdt een openbaar register van erkende referenten.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2c
  - number: 2d.1
    text: |-
      Gegevens en bescheiden die van belang zijn voor de aanvraag omtrent de erkenning als referent, worden niet
      verkregen van de aanvrager, voor zover Onze Minister die gegevens of bescheiden kan verkrijgen uit bij regeling van
      Onze Minister aan te wijzen administraties, tenzij hierdoor een goede uitvoering van de wet wordt belet.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2d
  - number: 2d.2
    text: |-
      Overeenkomstig bij regeling van Onze Minister gestelde regels verstrekt de aanvrager Onze Minister op diens
      verzoek en al dan niet in persoon alsnog de gegevens en bescheiden, die van belang zijn voor de beoordeling van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2d
  - number: 2d.3
    text: |-
      Bij regeling van Onze Minister wordt bepaald voor welke gegevens en bescheiden het eerste lid van toepassing is en
      kunnen administraties of delen daarvan worden aangewezen, waarvoor het eerste lid tijdelijk niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2d
  - number: 2e.1
    text: |-
      Onze Minister kan de aanvraag tot erkenning als referent of tot wijziging van de erkenning als referent afwijzen,
      indien:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
  - number: 2e.1.a
    text: |-
      de aanvrager, voor zover vereist op grond van de [Handelsregisterwet 2007][ref1], niet is ingeschreven in het
      handelsregister, bedoeld in [artikel 2 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 2e.1.b
    text: de continuïteit en solvabiliteit van de onderneming, rechtspersoon of organisatie onvoldoende is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
  - number: 2e.1.c
    text: |-
      de betrouwbaarheid van de aanvrager of van de direct of indirect bij die onderneming, rechtspersoon of organisatie
      betrokken natuurlijke of rechtspersonen of ondernemingen onvoldoende vast staat;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
  - number: 2e.1.d
    text: |-
      de erkenning als referent van de aanvrager of van de direct of indirect bij die onderneming, rechtspersoon of
      organisatie betrokken rechtspersonen of ondernemingen binnen een periode van vijf jaar direct voorafgaand aan de
      aanvraag is ingetrokken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
  - number: 2e.1.e
    text: |-
      de aanvrager niet voldoet aan de vereisten die verband houden met het doel waarvoor de vreemdeling in Nederland
      verblijft of wil verblijven, waaronder in ieder geval kan worden verstaan de aansluiting bij en naleving van een
      gedragscode.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
  - number: 2e.2
    text: Natuurlijke personen worden niet als referent erkend.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
  - number: 2e.3
    text: |-
      Overeenkomstig bij regeling van Onze Minister gestelde regels, legt de aanvrager desgevraagd een verklaring omtrent
      het gedrag over, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 2f.1
    text: |-
      Onze Minister kan de erkenning als referent schorsen op grond van ernstige vermoedens dat er grond bestaat om
      toepassing te geven aan [artikel 2g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2g
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2g
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 2f.2
    text: |-
      De schorsing van de erkenning als referent eindigt op de dag na de dag waarop de beschikking omtrent de intrekking
      is bekendgemaakt of de dag waarop sedert de schorsing drie maanden zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2f
  - number: 2f.3
    text: |-
      De termijn, bedoeld in het tweede lid, kan worden verlengd, indien naar het oordeel van Onze Minister advies van of
      onderzoek door derden of het openbaar ministerie nodig is.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2f
  - number: 2f.4
    text: |-
      Schorsing van de erkenning heeft tot gevolg dat de referent voor de duur van de schorsing niet als erkend referent
      wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2f
  - number: 2g
    text: 'Onze Minister kan de erkenning als referent intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2g
  - number: 2g.a
    text: de erkenning is verleend op grond van onjuiste of onvolledige gegevens;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2g
  - number: 2g.b
    text: de erkende referent niet langer voldoet aan de voorwaarden voor erkenning;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2g
  - number: 2g.c
    text: de erkende referent zich niet heeft gehouden aan zijn verplichtingen als referent, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2g
  - number: 2g.d
    text: de erkende referent daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2g
  - number: 2h
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2h
  - number: 2h.a
    text: |-
      de toepassing van deze paragraaf, waarbij beperkingen als bedoeld in [artikel 14, derde lid][ref1], kunnen worden
      aangewezen waarvoor erkenning als referent niet mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2h
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 2h.b
    text: |-
      de indiening en behandeling van een aanvraag omtrent de erkenning als referent en de door de aanvrager te
      verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2h
  - number: 2i.1
    text: |-
      Indien het belang van de internationale betrekkingen naar het oordeel van Onze Minister van Buitenlandse Zaken
      betrokken is bij een besluit inzake verlening van een machtiging tot voorlopig verblijf beslist Onze Minister in
      overeenstemming met Onze Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2i
  - number: 2i.2
    text: |-
      Onze Minister kan aan het hoofd van de desbetreffende Nederlandse diplomatieke of consulaire vertegenwoordiging
      aanwijzingen geven over de uitvoering van de bij of krachtens dit hoofdstuk gestelde regels inzake de verlening van
      de machtiging tot voorlopig verblijf door de ambtenaren werkzaam op die vertegenwoordiging door tussenkomst van en
      voor zover het de buitenlandse betrekkingen kan raken in overeenstemming met Onze Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2i
  - number: 2i.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2i
  - number: 2j
    text: |-
      Een ten behoeve van de toegang tot Nederland door Onze Minister verleend visum waarvan de geldigheidsduur niet is
      verstreken, dan wel een door een bevoegde autoriteit van een andere staat verleend visum, dat krachtens verdrag
      of bindend besluit van een volkenrechtelijke organisatie daaraan is gelijkgesteld, geldt als het ingevolge
      [artikel 3, eerste lid, onderdeel a][ref1], voor de toegang tot Nederland benodigde visum, onverminderd het
      overigens bij of krachtens dit hoofdstuk bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2j
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
  - number: 2k
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2k
  - number: 2k.a
    text: |-
      de aanvraag tot het verlenen van een machtiging tot voorlopig verblijf dan wel terugkeervisum in te willigen, af te
      wijzen dan wel niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2k
  - number: 2k.b
    text: |-
      een machtiging tot voorlopig verblijf dan wel terugkeervisum te wijzigen, hetzij op aanvraag, hetzij ambtshalve
      wegens veranderde omstandigheden;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2k
  - number: 2k.c
    text: een machtiging tot voorlopig verblijf dan wel terugkeervisum in te trekken of te annuleren.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2k
  - number: 2l.1
    text: |-
      Voor het behandelen, daaronder begrepen de toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1],
      van een aanvraag tot verlening of wijziging van een machtiging tot voorlopig verblijf dan wel terugkeervisum, is de
      vreemdeling Onze Minister een bij ministeriële regeling vast te stellen vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2l
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2l.2
    text: |-
      Het eerste lid is niet van toepassing indien op grond van de [Rijkswet op de consulaire tarieven][ref1] reeds een
      vergoeding is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013618
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2l
    references:
      - id: ref1
        bwb_id: BWBR0013618
  - number: 2m.1
    text: |-
      De machtiging tot voorlopig verblijf wordt verleend onder beperkingen, verband houdend met het doel waarvoor het
      verblijf wordt toegestaan. Aan de machtiging kunnen voorschriften worden verbonden. Deze voorschriften kunnen in
      ieder geval strekken tot het stellen van zekerheid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2m.2
    text: |-
      Onze Minister kan het terugkeervisum met het oog op de bescherming van de belangen waarop het bepaalde bij of
      krachtens deze wet betrekking heeft onder beperkingen verlenen en daaraan voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2m.3
    text: |-
      Onze Minister kan alsnog voorschriften aan een reeds verleende machtiging tot voorlopig verblijf of reeds
      verleend terugkeervisum verbinden, voorschriften die daaraan zijn verbonden wijzigen, alsnog beperkingen daaraan
      verbinden, beperkingen wijzigen, de geldigheidsduur inkorten dan wel de machtiging tot voorlopig verblijf of het
      terugkeervisum intrekken:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2m.3.a
    text: op aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2m.3.b
    text: indien uit naderhand gebleken feiten en omstandigheden komt vast te staan dat verlening ervan onjuist was;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2m.3.c
    text: |-
      indien feiten en omstandigheden zodanig zijn gewijzigd dat deze zich verzetten tegen de handhaving of ongewijzigde
      handhaving van het verleende; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2m.3.d
    text: indien de vreemdeling de op hem rustende verplichtingen krachtens deze wet niet naleeft.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2m.4
    text: |-
      Indien de vreemdeling nog geen toegang heeft verkregen kan Onze Minister de machtiging tot voorlopig verblijf
      annuleren op de gronden, vermeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2m
  - number: 2n.1
    text: |-
      In afwijking van [artikel 4:5, eerste en vierde lid, van de Algemene wet bestuursrecht][ref1] kan Onze Minister
      een aanvraag om een machtiging tot voorlopig verblijf dan wel terugkeervisum buiten behandeling laten zonder de
      aanvrager in de gelegenheid te hebben gesteld de aanvraag aan te vullen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2n
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2n.1.a
    text: de door de vreemdeling ingediende aanvraag niet door de vreemdeling in persoon is ingediend;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2n
  - number: 2n.1.b
    text: |-
      voor de aanvraag in voorkomend geval geen gebruik is gemaakt van een daartoe voorgeschreven formulier dat volledig
      is ingevuld en ondertekend;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2n
  - number: 2n.1.c
    text: de aanvraag niet is gesteld in de Nederlandse, Franse of Engelse taal; of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2n
  - number: 2n.1.d
    text: de ter afdoening van de aanvraag verschuldigde leges niet zijn betaald.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2n
  - number: 2n.2
    text: |-
      De [artikelen 4:7][ref1] en [4:8 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2n
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2o
    text: |-
      Indien Onze Minister overeenkomstig de aanvraag besluit, kan hij in afwijking van de [artikelen 3:45][ref1]
      en [3:47 van de Algemene wet bestuursrecht][ref2] vermelding van de mogelijkheid om bezwaar te maken en van de
      motivering achterwege laten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2o
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 2p.1
    text: |-
      Onze Minister kan een machtiging tot voorlopig verblijf verlenen aan de vreemdeling ten aanzien van wie is
      aangetoond dat hij voldoet aan de vereisten voor toegang en verlening van een verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2p
  - number: 2p.2
    text: |-
      Onze Minister kan in afwijking van het eerste lid een machtiging tot voorlopig verblijf verlenen indien daarmee een
      wezenlijk Nederlands belang is gediend of klemmende redenen van humanitaire aard daartoe nopen dan wel het belang
      van de internationale betrekkingen de verlening van een machtiging tot voorlopig verblijf vordert.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2p
  - number: 2q.1
    text: |-
      Onze Minister kan een machtiging tot voorlopig verblijf weigeren indien ten aanzien van de vreemdeling niet is
      aangetoond dat deze voldoet aan de voorwaarden, bedoeld in [artikel 2p, eerste lid][ref1], onverminderd het tweede
      lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2p
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2q
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2p
        hoofdstuk: 1a
        paragraaf: '1'
        afdeling: '2'
  - number: 2q.2
    text: |-
      Onze Minister kan een machtiging tot voorlopig verblijf voorts weigeren indien het belang van de internationale
      betrekkingen zich tegen verlening van de machtiging tot voorlopig verblijf verzet of de vreemdeling niet voldoet
      aan het overigens bij of krachtens dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2q
  - number: 2r.1
    text: |-
      Indien Onze Minister besluit tot verlening van een machtiging tot voorlopig verblijf stelt hij de aanvrager daarvan
      schriftelijk in kennis. Een machtiging tot voorlopig verblijf kan tot uiterlijk drie maanden na de dagtekening van
      die kennisgeving worden afgegeven. In geval de machtiging tot voorlopig verblijf niet kan worden afgegeven in het
      land van herkomst of bestendig verblijf, op grond dat de Nederlandse vertegenwoordiging is gesloten of zich daar
      niet of niet langer een Nederlandse vertegenwoordiging bevindt, kan Onze Minister de termijn, bedoeld in de tweede
      volzin, eenmaal met ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2r
  - number: 2r.2
    text: |-
      De geldigheidsduur van een machtiging tot voorlopig verblijf bedraagt ten hoogste 90 dagen vanaf de datum
      van afgifte, met dien verstande dat een machtiging tot voorlopig verblijf meermalen kan worden benut voor het
      verkrijgen van toegang tot Nederland. De geldigheid van een machtiging tot voorlopig verblijf vervalt in elk
      geval met ingang van het tijdstip waarop ten behoeve van de vreemdeling een verblijfsvergunning als bedoeld in
      [artikel 14][ref1] ambtshalve is verleend. De geldigheidsduur van een machtiging tot voorlopig verblijf kan niet
      worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2r
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 2r.3
    text: |-
      De geldigheidsduur van een machtiging tot voorlopig verblijf kan de geldigheidsduur van het document
      voor grensoverschrijding van de vreemdeling niet overschrijden, met dien verstande dat het document voor
      grensoverschrijding na verloop van de machtiging tot voorlopig verblijf nog tenminste drie maanden geldig moet
      zijn. Onze Minister kan in bijzondere gevallen ontheffing verlenen van het bepaalde in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2r
  - number: 2s.1
    text: 'De aanvraag omtrent de machtiging tot voorlopig verblijf wordt ingediend:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2s
  - number: 2s.1.a
    text: |-
      bij de Nederlandse diplomatieke of consulaire vertegenwoordiging in het land van herkomst of van bestendig verblijf
      dan wel, bij gebreke daarvan, het dichtstbijzijnde land waar wel een vertegenwoordiging is gevestigd, dan wel bij
      het Kabinet van de Gouverneur van de Nederlandse Antillen of het Kabinet van de Gouverneur van Aruba aldaar, door
      de vreemdeling, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2s
  - number: 2s.1.b
    text: |-
      bij Onze Minister door de referent, dan wel in bij of krachtens algemene maatregel van bestuur bepaalde gevallen
      door de erkende referent van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2s
  - number: 2s.2
    text: |-
      In afwijking van [artikel 2:1 van de Algemene wet bestuursrecht][ref1] en in afwijking van het eerste lid, wordt de
      aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde gevallen ingediend door de vreemdeling of zijn
      wettelijk vertegenwoordiger in persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2s
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 2s.3
    text: |-
      De machtiging tot voorlopig verblijf wordt bij de vertegenwoordiging dan wel het Kabinet, bedoeld in het eerste
      lid, aan de vreemdeling in persoon afgegeven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2s
  - number: 2s.4
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Buitenlandse Zaken vrijstelling dan wel ontheffing
      verlenen van de verplichtingen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2s
  - number: 2t.1
    text: 'Gegevens en bescheiden worden niet verkregen van de vreemdeling of diens referent, voor zover:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.1.a
    text: |-
      Onze Minister die gegevens of bescheiden kan verkrijgen uit bij regeling van Onze Minister aan te wijzen
      administraties, tenzij hierdoor een goede uitvoering van de wet wordt belet, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.1.b
    text: |-
      de aanvraag is ingediend door de erkende referent, en deze omtrent die gegevens en bescheiden eigen verklaringen
      heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.2
    text: De eigen verklaringen, bedoeld in het eerste lid, onder b, worden volledig en naar waarheid opgesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.3
    text: |-
      De aanvrager verstrekt Onze Minister op diens verzoek en al dan niet in persoon alsnog de gegevens en bescheiden,
      die van belang zijn voor de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.4
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de gegevens en bescheiden waarop het eerste lid, onder
      a, van toepassing is, en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.4.a
    text: de administraties of delen daarvan waarvoor het eerste lid, onder a, tijdelijk niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.4.b
    text: de eigen verklaringen, bedoeld in het eerste lid, onder b,
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2t.4.c
    text: de toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2t
  - number: 2u.1
    text: |-
      Onze Minister beslist binnen 90 dagen na ontvangst van een aanvraag om verlening of wijziging van een machtiging
      tot voorlopig verblijf. Onze Minister kan deze termijn verlengen met ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2u
  - number: 2u.2
    text: |-
      In afwijking van het eerste lid maakt Onze Minister de beslissing op een aanvraag om verlening van een machtiging
      tot voorlopig verblijf onder een beperking verband houdend met verblijf als houder van de Europese blauwe kaart of
      overplaatsing binnen een onderneming bekend binnen 90 dagen en kan die termijn niet worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2u
  - number: 2u.3
    text: |-
      In afwijking van het eerste lid maakt Onze Minister de beslissing op een aanvraag om verlening van een machtiging
      tot voorlopig verblijf onder een beperking verband houdend met wetenschappelijk onderzoek, studie, lerend werken,
      of uitwisseling in het kader van Europees vrijwilligerswerk bekend binnen 60 dagen en kan die termijn niet worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2u
  - number: 2v
    text: |-
      Onze Minister brengt de machtiging tot voorlopig verblijf aan in het document voor grensoverschrijding of op een
      blad waarop een visum kan worden aangebracht als bedoeld in artikel 1 van Verordening (EG) nr. 333/2002 van de Raad
      van de Europese Unie van 18 februari 2002 (PbEG 2002, L53/4).
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2v
  - number: 2w.1
    text: |-
      Een terugkeervisum kan worden verleend voor de toegang tot Nederland van een vreemdeling die
      Nederland tijdelijk zal verlaten gedurende het tijdvak dat hij rechtmatig verblijf heeft op grond van
      [artikel 8, aanhef en onder a tot en met h of l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2w
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 2w.2
    text: |-
      Geen terugkeervisum wordt verleend ten behoeve van de terugkeer uit het land van herkomst van de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, aanhef en onder c en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2w
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 2w.3
    text: |-
      Geen terugkeervisum wordt verleend ten behoeve van de terugkeer uit het land van herkomst van de vreemdeling die
      een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in de [artikelen 28][ref1] en [33][ref2]
      heeft gedaan en rechtmatig verblijf heeft op grond van [artikel 8, aanhef en onder f, g of h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2w
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 2x.1
    text: 'Een terugkeervisum kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
  - number: 2x.1.a
    text: |-
      de vreemdeling niet door overlegging van documenten aannemelijk heeft gemaakt dat sprake is van een dringende reden
      die geen uitstel van vertrek mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
  - number: 2x.1.b
    text: de vreemdeling niet zelfstandig beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
  - number: 2x.1.c
    text: |-
      de vreemdeling zich gedurende zijn verblijf in Nederland aan maatregelen van toezicht op grond van deze wet heeft
      onttrokken;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
  - number: 2x.1.d
    text: |-
      uit oogpunt van toezicht op grond van deze wet, opsporing of vervolging van strafbare feiten, tenuitvoerlegging van
      een vonnis of om andere gewichtige redenen bezwaar bestaat tegen vertrek uit Nederland van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
  - number: 2x.1.e
    text: |-
      het naar het oordeel van Onze Minister in de rede ligt dat binnen de geldigheidsduur van het terugkeervisum een
      beslissing als bedoeld in [artikel 8, onderdeel f, g of h][ref1], kan worden verwacht;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 2x.1.f
    text: |-
      de vreemdeling in afwachting is van de beslissing op diens aanvraag om een verblijfsvergunning als bedoeld in
      [artikel 14][ref1] dan wel in afwachting is van de beslissing op een bezwaarschrift of een beroepschrift tegen een
      dergelijke beslissing en niet heeft beschikt over de vereiste machtiging tot voorlopig verblijf, overeenkomend met
      het verblijfsdoel waarvoor de verblijfsvergunning is aangevraagd, dan wel niet op grond van het bepaalde bij of
      krachtens deze wet van de verplichting tot het beschikken over een machtiging tot voorlopig verblijf is vrijgesteld
      of ontheven; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 2x.1.g
    text: |-
      de vreemdeling een gevaar vormt voor de openbare orde of de nationale veiligheid dan wel zich schuldig heeft
      gemaakt aan of verdacht wordt van terrorisme, oorlogsmisdaden, of andere misdaden tegen de menselijkheid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
  - number: 2x.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2x
  - number: 2y.1
    text: |-
      De geldigheidsduur van een terugkeervisum kan de geldigheidsduur van de aan de vreemdeling verleende
      verblijfsvergunning niet overschrijden en bedraagt ten hoogste een jaar. Het terugkeervisum kan worden verleend
      voor een of meer reizen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2y
  - number: 2y.2
    text: |-
      In afwijking van het eerste lid bedraagt de geldigheidsduur van een terugkeervisum ten behoeve van een vreemdeling
      die rechtmatig verblijf houdt op grond van [artikel 8, onderdeel f, g of h][ref1], ten hoogste drie maanden en is
      het geldig voor één reis.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2y
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 2y.3
    text: Onze Minister kan vrijstelling dan wel ontheffing verlenen van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2y
  - number: 2y.4
    text: De geldigheidsduur van een terugkeervisum kan niet worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2y
  - number: 2z
    text: |-
      Een terugkeervisum wordt door de vreemdeling in persoon aangevraagd. Bij of krachtens algemene maatregel van
      bestuur kunnen nadere regels worden gesteld omtrent de wijze van indiening en de behandeling van een aanvraag tot
      verlening van een terugkeervisum.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2z
  - number: 2aa
    text: |-
      Onze Minister beslist binnen twee weken na ontvangst van een aanvraag om verlening van een terugkeervisum. Onze
      Minister kan deze termijn verlengen met ten hoogste twee weken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2aa
  - number: 2bb
    text: |-
      Onze Minister brengt het terugkeervisum aan in het document voor grensoverschrijding of op een blad waarop een
      visum kan worden aangebracht als bedoeld in artikel 1 van Verordening (EG) nr. 333/2002 van de Raad van de Europese
      Gemeenschappen van 18 februari 2002 (PbEG 2002, L53/4).
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2bb
  - number: 2cc.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze van indiening
      en de behandeling van een aanvraag tot verlening of wijziging van een machtiging tot voorlopig verblijf dan
      wel terugkeervisum, daaronder begrepen de wijze waarop beschikkingen, kennisgevingen, mededelingen of berichten
      ingevolge dit hoofdstuk aan de vreemdeling, de referent of aan andere belanghebbenden worden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2cc
  - number: 2cc.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen aan de verplichtingen die
      krachtens dit hoofdstuk op de vreemdeling rusten kan worden voldaan door diens wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel2cc
  - number: '3.1'
    text: |-
      In andere dan de in de Schengengrenscode geregelde gevallen, wordt toegang tot Nederland geweigerd aan de
      vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: 3.1.a
    text: |-
      niet in het bezit is van een geldig document voor grensoverschrijding, dan wel in het bezit is van een document
      voor grensoverschrijding waarin het benodigde visum ontbreekt;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: 3.1.b
    text: een gevaar oplevert voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: 3.1.c
    text: |-
      niet beschikt over voldoende middelen om te voorzien zowel in de kosten van verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is, of
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: 3.1.d
    text: niet voldoet aan de voorwaarden die bij of krachtens algemene maatregel van bestuur zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de weigering van toegang op grond van
      deze wet of ter uitvoering van de Schengengrenscode.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: '3.3'
    text: |-
      Indien een vreemdeling aan de grens te kennen geeft een aanvraag tot het verlenen van een verblijfsvergunning als
      bedoeld in [artikel 28][ref1] te willen indienen, wordt de aanvraag in de grensprocedure getoetst aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 3.3.a
    text: |-
      de grond voor het niet in behandeling nemen als bedoeld in [artikel 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 3.3.b
    text: |-
      de gronden voor niet-ontvankelijkverklaring, genoemd in [artikel 30a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 3.3.c
    text: |-
      de gronden voor afwijzing wegens kennelijke ongegrondheid, genoemd in [artikel 30b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30b
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '3.4'
    text: |-
      Indien de grensprocedure wordt toegepast, wordt een besluit omtrent de weigering van toegang tot Nederland
      uitgesteld. Een reeds genomen besluit tot weigering van toegang tot Nederland vervalt met ingang van het tijdstip
      waarop de vreemdeling aan de grens te kennen geeft een aanvraag als bedoeld in het derde lid te willen indienen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: '3.5'
    text: |-
      De vreemdeling wordt onverwijld in kennis gesteld van het uitstel van het besluit tot weigering van toegang tot
      Nederland.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: '3.6'
    text: |-
      Indien vier weken na de kennisgeving, bedoeld in het vijfde lid, nog niet is beslist over het in behandeling nemen,
      de ontvankelijkheid of kennelijke ongegrondheid van de aanvraag, verkrijgt de vreemdeling van rechtswege toegang
      tot Nederland.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: '3.7'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de grensprocedure.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      De vervoerder door wiens tussenkomst de vreemdeling aan een buitengrens of binnen het grondgebied van Nederland
      wordt gebracht, neemt de nodige maatregelen en houdt het toezicht dat redelijkerwijs van hem kan worden gevorderd
      om te voorkomen dat door de vreemdeling niet wordt voldaan aan artikel 6, eerste lid, onder a of b, van de
      Schengengrenscode of aan [artikel 3, eerste lid, onder a][ref1], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      De vervoerder kan worden verplicht om een afschrift te nemen van het op de vreemdeling betrekking hebbende document
      voor grensoverschrijding en dit ter hand te stellen aan de ambtenaren belast met de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      De vervoerder, bedoeld in het eerste lid, kan ten behoeve van de grensbewaking en het tegengaan van illegale
      immigratie worden verplicht passagiersgegevens of gegevens omtrent de bemanning te verzamelen en te verstrekken aan
      de ambtenaren belast met de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel4
  - number: '4.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      tot en met het derde lid. Daarbij kan ter uitvoering van een verdrag of een bindende EU-rechtshandeling worden
      afgeweken van [artikel 2:13, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '4.5'
    text: |-
      Het eerste tot en met het derde lid zijn ook van toepassing op iedere vervoerder die zich buiten Nederland schuldig
      maakt aan schending van de in die leden bedoelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      De vreemdeling aan wie toegang is geweigerd, dient Nederland onmiddellijk te verlaten, met inachtneming van de
      aanwijzingen welke hem daartoe door een ambtenaar belast met de grensbewaking, zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de vreemdeling, bedoeld in het eerste lid, Nederland is binnengekomen aan boord van een vaartuig of
      luchtvaartuig in gebruik bij een vervoersonderneming, dient hij Nederland onmiddellijk te verlaten met dat vervoer
      of een hem door een ambtenaar belast met de grensbewaking aangewezen vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel5
  - number: '6.1'
    text: |-
      De vreemdeling aan wie toegang is geweigerd kan worden verplicht zich op te houden in een door de ambtenaar belast
      met grensbewaking aangewezen ruimte of plaats.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6
  - number: '6.2'
    text: Een ruimte of plaats, bedoeld in het eerste lid, kan worden beveiligd tegen ongeoorloofd vertrek.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      De vreemdeling die aan de grens te kennen heeft gegeven een aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 28][ref1] te willen indienen kan, zolang hij wordt aangemerkt als verzoeker in de zin van
      artikel 2, aanhef en onder b, van de Opvangrichtlijn, eveneens worden verplicht zich op te houden in een door de
      ambtenaar belast met grensbewaking aangewezen ruimte of plaats die kan worden beveiligd tegen ongeoorloofd vertrek,
      in het kader van een procedure om een beslissing te nemen over de toegang.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '6.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het voor
      de beveiligde ruimte of plaats, bedoeld in het eerste lid, geldende regime, waaronder begrepen de nodige
      beheersmaatregelen. [Hoofdstuk 9 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '9'
  - number: '6.5'
    text: |-
      Een krachtens het vierde lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat, nadat vier weken na de overlegging zijn verstreken,
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van beide kamers van de Staten-Generaal
      besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6
  - number: '6.6'
    text: |-
      Onze Minister kan de maatregel, bedoeld in het eerste en tweede lid, opleggen aan de vreemdeling aan wie toegang is
      geweigerd en op wie voorafgaand aan de toegangsweigering het derde lid van toepassing was, indien het belang van de
      openbare orde of de nationale veiligheid zulks vordert.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6
  - number: '6.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over toepassing van het derde en het
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6
  - number: 6a.1
    text: |-
      Onze Minister kan de maatregel, bedoeld in [artikel 6, eerste en tweede lid][ref1], opleggen of voortzetten met het
      oog op de overdracht aan een verantwoordelijke lidstaat, met inachtneming van artikel 28 van de Dublinverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
  - number: 6a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel6a
  - number: '7'
    text: |-
      Indien de vreemdeling aan wie de toegang is geweigerd, op grond van de Schengengrenscode, enig wettelijk
      voorschrift dan wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie zijn vrijheid is
      ontnomen, blijft de toegang geweigerd.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel7
  - number: '8'
    text: 'De vreemdeling heeft in Nederland uitsluitend rechtmatig verblijf:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel8
  - number: 8.a
    text: |-
