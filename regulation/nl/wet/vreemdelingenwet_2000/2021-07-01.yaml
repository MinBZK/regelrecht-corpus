  - number: 84.b
    text: over een visum voor een verblijf van 90 dagen of minder;
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel84
  - number: 84.c
    text: |-
      na toepassing van [artikel 78][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel78
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel84
