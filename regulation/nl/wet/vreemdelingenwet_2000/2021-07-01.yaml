  - number: '82.3'
    text: Het eerste lid is niet van toepassing indien het beroepschrift niet tijdig is ingediend.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel82
  - number: '82.4'
    text: |-
      Het eerste lid is, voor zover het betreft de opschortende werking gedurende de beroepstermijn zolang geen beroep is
      ingesteld, niet van toepassing op de verplichting, bedoeld in [artikel 62, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: '82.5'
    text: |-
      Het tweede lid, onder a en b, en het derde lid zijn niet van toepassing, indien de vreemdeling tijdelijke
      bescherming heeft.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel82
  - number: '82.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het recht om al dan
      niet in afwachting van de uitspraak op een verzoek om een voorlopige voorziening in Nederland te mogen verblijven.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel82
  - number: '83.1'
    text: 'De rechtbank houdt bij de beoordeling van het beroep rekening met:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: 83.1.a
    text: feiten en omstandigheden die na het bestreden besluit zijn aangevoerd, en
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: 83.1.b
    text: wijzigingen van beleid die na het bestreden besluit zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: '83.2'
    text: 'Met de in het eerste lid bedoelde gegevens wordt slechts rekening gehouden indien deze relevant kunnen zijn voor:'
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel83
  - number: 83.2.a
    text: |-
      de beschikking omtrent de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en [33][ref2];


