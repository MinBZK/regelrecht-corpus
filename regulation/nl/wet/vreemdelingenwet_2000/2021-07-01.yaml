        artikel: 59b
        hoofdstuk: '5'
  - number: '73.5'
    text: |-
      Het eerste lid is, voor zover het betreft de opschortende werking gedurende de termijn voor het maken
      van bezwaar of het instellen van administratief beroep zolang geen bezwaar is gemaakt of administratief
      beroep is ingesteld, niet van toepassing op de verplichting, bedoeld in [artikel 62, eerste lid][ref1] of
      [artikel 62c, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel62c
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel73
