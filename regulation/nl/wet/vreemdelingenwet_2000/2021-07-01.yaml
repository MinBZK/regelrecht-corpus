  - number: '73.3'
    text: |-
      Het eerste lid is voorts niet van toepassing indien het besluit inhoudt de afwijzing van een herhaalde aanvraag of
      indien het bezwaarschrift of het administratief beroepschrift niet tijdig is ingediend.
    url: https://wetten.overheid.nl/BWBR0011823/2021-07-01#Artikel73
  - number: '73.4'
    text: |-
      Het eerste lid is evenmin van toepassing indien de vreemdeling rechtens zijn vrijheid is of wordt ontnomen op grond
      van [artikel 59][ref1], [59a][ref2] of [59b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
