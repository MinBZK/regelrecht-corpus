    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.m
    text: |-
      vreemdeling: ieder die de Nederlandse nationaliteit niet bezit en niet op grond van een wettelijke bepaling als
