  - number: 1.p
    text: |-
      langdurig ingezetene: houder van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1],
      verleend ter uitvoering van artikel 8, tweede lid, van de [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van
      de Europese Unie van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen
      (PbEU 2004, L16), dan wel van een door een andere staat die partij is bij het Verdrag tot oprichting van de
      Europese Gemeenschap afgegeven EG-verblijfsvergunning voor langdurig ingezetenen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
    references:
