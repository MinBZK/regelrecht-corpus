        paragraaf: '2'
        afdeling: '3'
  - number: '2.1'
    text: Er is een Adviescommissie voor vreemdelingenzaken.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      De commissie bestaat uit ten minste zeven leden. Ambtenaren die werkzaam zijn bij een ministerie of een daaronder
      ressorterende instelling, dienst of bedrijf, dan wel anderszins werkzaamheden verrichten in ondergeschiktheid aan
      Onze Ministers, worden niet tot lid benoemd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: '2.3'
    text: Als voorzitter wordt bij voorkeur een rechterlijk ambtenaar met rechtspraak belast benoemd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: '2.4'
    text: 'De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: 2.4.a
    text: |-
      Onze Minister te adviseren over het vreemdelingenrecht en het beleid ter zake, waaronder begrepen wijziging van
      deze wet;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: 2.4.b
    text: |-
      op verzoek van Onze Minister te adviseren over bij of krachtens algemene maatregel van bestuur aangewezen
      beschikkingen op grond van deze wet. In de algemene maatregel van bestuur worden slechts beschikkingen aangewezen
      waarvoor advisering ingevolge een verdrag of een Nederland bindend besluit van een volkenrechtelijke organisatie
      verplicht is.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: '2.5'
    text: Bij algemene maatregel van bestuur worden regels gesteld over de inrichting en de werkwijze van de commissie.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: '2.6'
    text: |-
      Bij algemene maatregel van bestuur kan worden voorzien in de instelling van een of meer subcommissies welke,
      in afwijking van [artikel 16 van de Kaderwet adviescolleges][ref1], namens de commissie kunnen optreden bij de
      vervulling van haar taak, bedoeld in het vierde lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel16
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '16'
  - number: '2.7'
    text: |-
      De commissie is bevoegd bij een ieder schriftelijk of mondeling de inlichtingen in te winnen welke zij voor de
      vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel2
  - number: '3.1'
    text: 'Toegang tot Nederland wordt geweigerd aan de vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel3
  - number: 3.1.a
    text: |-
      niet in het bezit is van een geldig document voor grensoverschrijding, dan wel in het bezit is van een document
      voor grensoverschrijding waarin het benodigde visum ontbreekt;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel3
  - number: 3.1.b
    text: een gevaar oplevert voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel3
  - number: 3.1.c
    text: |-
      niet beschikt over voldoende middelen om te voorzien zowel in de kosten van verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is, of
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel3
  - number: 3.1.d
    text: niet voldoet aan de voorwaarden die bij of krachtens algemene maatregel van bestuur zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel3
  - number: '3.2'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      De ambtenaren belast met de grensbewaking weigeren niet dan ingevolge een bijzondere aanwijzing van Onze Minister
      de toegang tot Nederland aan de vreemdeling die te kennen geeft dat hij asiel wenst.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      De vervoerder door wiens tussenkomst de vreemdeling aan een buitengrens of binnen het grondgebied van Nederland
      wordt gebracht, neemt de nodige maatregelen en houdt het toezicht dat redelijkerwijs van hem kan worden gevorderd
      om te voorkomen dat door de vreemdeling niet wordt voldaan aan [artikel 3, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      De vervoerder kan worden verplicht om een afschrift te nemen van het op de vreemdeling betrekking hebbende document
      voor grensoverschrijding en dit ter hand te stellen aan de ambtenaren belast met de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het eerste en tweede lid zijn ook van toepassing op iedere vervoerder die zich buiten Nederland schuldig maakt aan
      schending van de in die leden bedoelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      De vreemdeling aan wie toegang tot Nederland is geweigerd, dient Nederland onmiddellijk te verlaten, met
      inachtneming van de aanwijzingen welke hem daartoe door een ambtenaar belast met de grensbewaking, zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de vreemdeling, bedoeld in het eerste lid, Nederland is binnengekomen aan boord van een vaartuig of
      luchtvaartuig in gebruik bij een vervoersonderneming, dient hij Nederland onmiddellijk te verlaten met dat vervoer
      of een hem door een ambtenaar belast met de grensbewaking aangewezen vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      De verplichtingen, bedoeld in het eerste en tweede lid, gelden niet indien de vreemdeling een aanvraag tot het
      verlenen van een verblijfsvergunning als bedoeld in de [artikelen 28][ref1] of [33][ref2] heeft ingediend en daarop
      nog niet is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '6.1'
    text: |-
      De vreemdeling aan wie toegang tot Nederland is geweigerd kan worden verplicht zich op te houden in een door de
      ambtenaar belast met grensbewaking aangewezen ruimte of plaats.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel6
  - number: '6.2'
    text: Een ruimte of plaats, bedoeld in het eerste lid, kan worden beveiligd tegen ongeoorloofd vertrek.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het voor
      de beveiligde ruimte of plaats, bedoeld in het eerste lid, geldende regime, waaronder begrepen de nodige
      beheersmaatregelen.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel6
  - number: '6.4'
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat, nadat vier weken na de overlegging zijn verstreken,
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van beide kamers van de Staten-Generaal
      besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel6
  - number: '7'
    text: |-
      Indien de vreemdeling aan wie de toegang tot Nederland is geweigerd, op grond van enig wettelijk voorschrift dan
      wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie zijn vrijheid is ontnomen, blijft de
      toegang geweigerd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel7
  - number: '8'
    text: 'De vreemdeling heeft in Nederland uitsluitend rechtmatig verblijf:'
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel8
  - number: 8.a
    text: |-
      op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 8.b
    text: |-
      op grond van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 8.c
    text: |-
