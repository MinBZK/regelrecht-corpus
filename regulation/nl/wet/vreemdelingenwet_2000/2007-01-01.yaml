  - number: '88.2'
    text: |-
      [Artikel 39 van de Wet op de Raad van State][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '39'
  - number: '89.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State behandelt het hoger beroep met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: '89.2'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State doet uiterlijk drieëntwintig weken na ontvangst van het
      beroepschrift uitspraak.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel89
  - number: '90'
    text: |-
      In afwijking van [artikel 8:18, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt een verzoek om wraking
      van een lid van de enkelvoudige kamer behandeld door een enkelvoudige kamer waarin de rechter wiens wraking is
      verzocht geen zitting heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '91.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State kan zich bij haar uitspraak beperken tot een beoordeling van
      de aangevoerde grieven.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel91
  - number: '91.2'
    text: |-
      Indien de Afdeling bestuursrechtspraak van de Raad van State oordeelt dat een aangevoerde grief niet tot
      vernietiging kan leiden, kan zij zich bij de vermelding van de gronden van haar uitspraak beperken tot dit oordeel.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel91
  - number: '92'
    text: |-
      In afwijking van [artikel 8:86 van de Algemene wet bestuursrecht][ref1] kan de Voorzitter van de Afdeling
      bestuursrechtspraak van de Raad van State bij zijn uitspraak op een verzoek om voorlopige voorziening ook
      onmiddellijk uitspraak in de hoofdzaak doen, indien het verzoek niet ter zitting is behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '93.1'
    text: |-
      Een aanwijzing op grond van [artikel 6, eerste en tweede lid][ref1], of op grond van
      [artikel 55, eerste lid][ref2], de ophouding en de verlenging van de ophouding bedoeld in
      [artikel 50, tweede, derde en vierde lid][ref3], en een ingevolge [hoofdstuk 5][ref4] van deze wet
      genomen maatregel strekkende tot vrijheidsbeperking of vrijheidsontneming worden voor de toepassing van
      [artikel 8:1, eerste lid, van de Algemene wet bestuursrecht][ref5] gelijkgesteld met een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '55'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0011823
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '93.2'
    text: |-
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '93.3'
    text: |-
      In afwijking van [artikel 8:41 van de Algemene wet bestuursrecht][ref1] wordt door de griffier geen griffierecht
      geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '94.1'
    text: |-
      Uiterlijk op de achtentwintigste dag na de bekendmaking van een besluit tot oplegging van een vrijheidsontnemende
      maatregel als bedoeld in de [artikelen 6][ref1], [58][ref2] en [59][ref3], stelt Onze Minister de rechtbank
      hiervan in kennis, tenzij de vreemdeling voordien zelf beroep heeft ingesteld. Zodra de rechtbank de kennisgeving
      heeft ontvangen wordt de vreemdeling geacht beroep te hebben ingesteld tegen het besluit tot oplegging van een
      vrijheidsontnemende maatregel. Het beroep strekt tevens tot een verzoek om toekenning van schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: '94.2'
    text: |-
      De rechtbank bepaalt onmiddellijk het tijdstip van het onderzoek ter zitting. De zitting vindt uiterlijk op de
      veertiende dag na ontvangst van het beroepschrift dan wel de kennisgeving plaats. De rechtbank roept de vreemdeling
      op om in persoon dan wel in persoon of bij raadsman en Onze Minister om bij gemachtigde te verschijnen teneinde te
      worden gehoord. In afwijking van [artikel 8:42, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de in dat
      artikel bedoelde termijn niet worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '94.3'
    text: |-
      De rechtbank doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak
      wordt binnen zeven dagen na de sluiting van het onderzoek gedaan. In afwijking van
      [artikel 8:66, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de in dat artikel bedoelde termijn niet
      worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '94.4'
    text: |-
      Indien de rechtbank bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel in strijd
      is met deze wet dan wel bij afweging van alle daarbij betrokken belangen in redelijkheid niet gerechtvaardigd is,
      verklaart zij het beroep gegrond. In dat geval beveelt de rechtbank de opheffing van de maatregel of een wijziging
      van de wijze van tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel94
  - number: '95.1'
    text: |-
      In afwijking van [artikel 84, onder a][ref1], staat tegen de uitspraak van de rechtbank, bedoeld in
      [artikel 94, derde lid][ref2], hoger beroep open op de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '84'
        hoofdstuk: '7'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '95.2'
    text: |-
      [Afdeling 4][ref1] is van toepassing. In afwijking van [artikel 84, onder d][ref2], strekt het hoger beroep zich
      ook uit over de toekenning van schadevergoeding, bedoeld in [artikel 106][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel106
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '7'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '84'
        hoofdstuk: '7'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '106'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '95.3'
    text: |-
      In afwijking van de [artikelen 40][ref1] en [41 van de Wet op de Raad van State][ref2] wordt door de secretaris
      geen griffierecht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel41
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0002367
        artikel: '41'
  - number: '96.1'
    text: |-
      Indien het beroep, bedoeld in [artikel 94][ref1], ongegrond is verklaard en de vreemdeling beroep instelt tegen
      het voortduren van de vrijheidsontneming, sluit de rechtbank het vooronderzoek binnen een week na ontvangst van het
      beroepschrift. In afwijking van [artikel 8:57 van de Algemene wet bestuursrecht][ref2] kan de rechtbank ook zonder
      toestemming van partijen bepalen dat het onderzoek ter zitting achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '96.2'
    text: |-
      De rechtbank doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak
      wordt binnen zeven dagen na de sluiting van het onderzoek gedaan. In afwijking van
      [artikel 8:66, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de in dat artikel bedoelde termijn niet
      worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '96.3'
    text: |-
      Indien de rechtbank bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel in strijd
      is met deze wet dan wel bij afweging van alle daarbij betrokken belangen in redelijkheid niet gerechtvaardigd is,
      verklaart zij het beroep gegrond. In dat geval beveelt de rechtbank de opheffing van de maatregel of een wijziging
      van de wijze van tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel96
  - number: '97'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de wijze van
      horen van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel97
  - number: '98.1'
    text: |-
      In afwijking van [artikel 8:24 van de Algemene wet bestuursrecht][ref1] kan de vreemdeling zich bij de gehoren
      ingevolge de [artikelen 94][ref2] en [96][ref3] uitsluitend door één of meer van zijn raadslieden doen bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel96
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '96'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '98.2'
    text: De raadsman wordt bij het horen in de gelegenheid gesteld de nodige opmerkingen te maken.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel98
  - number: '98.3'
    text: |-
      Als raadsman wordt slechts toegelaten een in Nederland ingeschreven advocaat alsmede de persoon bedoeld
      in [artikel 16b][ref1] dan wel [16h van de Advocatenwet][ref2] indien deze samenwerkt met een in
      Nederland ingeschreven advocaat, overeenkomstig het bepaalde in [artikel 16e][ref3] respectievelijk
      [16j van de Advocatenwet][ref4]. Onder raadsman wordt ook verstaan de rechtshulpverlener die in dienst is van de
      Stichting Rechtsbijstand Asiel die terzake van de vrijheidsontnemende maatregelen relevante opleiding en ervaring
      bezit, en


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16e
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel16j
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16h
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 16e
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 16j
  - number: 98.3.a
    text: |-
      aan wie door een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] de graad Bachelor op het gebied van het recht en
      tevens de graad Master op het gebied van het recht is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 98.3.b
    text: |-
      die aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] het doctoraat in de rechtsgeleerdheid of het recht
      om de titel meester te voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '99.1'
    text: De vreemdeling is steeds bevoegd een of meer raadslieden te kiezen.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel99
  - number: '99.2'
    text: Daartoe is ook zijn wettige vertegenwoordiger of zijn bijzondere gemachtigde bevoegd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel99
  - number: '99.3'
    text: |-
      Kan de vreemdeling zijn wil te dien aanzien niet doen blijken en heeft hij geen wettelijke vertegenwoordiger of
      bijzondere gemachtigde, dan is zijn echtgenoot of de meest gerede van zijn hier te lande verblijvende bloed- of
      aanverwanten, tot de vierde graad ingesloten, tot die keuze bevoegd. De voorzieningenrechter kan ambtshalve één of
      meer raadslieden toevoegen indien de in de voorgaande volzin bedoelde personen niet in staat worden geacht de keuze
      binnen redelijke termijn te maken.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel99
  - number: '99.4'
    text: |-
      De ingevolge het tweede of derde lid gekozen raadsman treedt af zodra de vreemdeling zelf een raadsman heeft
      gekozen.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel99
  - number: '100.1'
    text: |-
      Op verzoek van de vreemdeling wordt hem een raadsman toegevoegd zodra hem ingevolge deze wet zijn vrijheid is
      ontnomen.[ Artikel 99, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel99
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '100.2'
    text: |-
      Bevoegd tot het geven van een last tot toevoeging aan het bureau rechtsbijstandvoorziening is de
      voorzieningenrechter van de rechtbank in het rechtsgebied waarvan de vreemdeling zich bevindt. Ingeval hoger beroep
      is ingesteld op grond van [artikel 95][ref1], is de voorzitter van de Afdeling bestuursrechtspraak van de Raad van
      State bevoegd tot het geven van de last tot toevoeging aan het bureau rechtsbijstandvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel95
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '95'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '100.3'
    text: |-
      Voorzover de wet niet op andere wijze in de toevoeging voorziet, kan het bureau rechtsbijstandvoorziening aan de
      vreemdeling op diens verzoek een raadsman toevoegen.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel100
  - number: '100.4'
    text: |-
      Een overeenkomstig het voorgaande lid gedaan verzoek wordt ingewilligd in gevallen waarin aannemelijk is dat de
      vreemdeling niet in staat is de kosten van een gekozen raadsman te dragen en waarin ook overigens, naar het oordeel
      van dat bureau, voldoende grond voor toevoeging bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel100
  - number: '101.1'
    text: |-
      Bij verhindering of ontstentenis van de toegevoegde raadsman wordt zo nodig aan de vreemdeling onverwijld een
      andere raadsman toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel101
  - number: '101.2'
    text: Op verzoek van de toegevoegde raadsman of van de vreemdeling kan een andere raadsman worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel101
  - number: '101.3'
    text: |-
      Toevoeging van een andere raadsman geschiedt door het bureau bedoeld in [artikel 100, tweede of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel100
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '101.4'
    text: |-
      Blijkt van de verhindering of ontstentenis van de raadsman pas tijdens het gehoor ingevolge de [artikelen 94][ref1]
      en [96][ref2], dan geeft de voorzitter van de kamer last tot toevoeging van een andere raadsman aan het bureau
      bedoeld in [artikel 100, tweede of derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel100
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '96'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '102'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gegeven omtrent de beloning van toegevoegde raadslieden, met
      inbegrip van advocaten die overeenkomstig [artikel 101][ref1] als raadsman optreden, en de vergoeding van hun
      onkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel101
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '101'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '103'
    text: |-
      Indien Onze Minister dit wenselijk oordeelt kan hij de beloning en vergoeding van een toevoeging ingevolge de
      [artikelen 100][ref1] of [101][ref2] verhalen op de goederen van de vreemdeling. Met betrekking tot de wijze van
      verhaal en de berekening van de te verhalen bedragen worden regelen gesteld bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel101
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '101'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '104'
    text: |-
      De raadsman heeft vrije toegang tot de vreemdeling. Hij kan hem alleen spreken en met hem brieven wisselen zonder
      dat van de inhoud door anderen kennis wordt genomen, een en ander onder het vereiste toezicht en met in achtneming
      van ingevolge deze wet gestelde regelen met betrekking tot het voor de ruimte of plaats, waar de vreemdeling zich
      bevindt, geldende regime.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel104
  - number: '105'
    text: |-
      Met betrekking tot de kennisgeving van gerechtelijke mededelingen ingevolge de [artikelen 94 tot en met 101][ref1]
      zijn de [artikelen 585 tot en met 590 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel585
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '585'
  - number: '106.1'
    text: |-
      Indien de rechtbank de opheffing van een maatregel strekkende tot vrijheidsontneming beveelt, dan wel de
      vrijheidsontneming reeds voor de behandeling van het verzoek om opheffing van die maatregel wordt opgeheven, kan
      zij aan de vreemdeling een vergoeding ten laste van de Staat toekennen. Onder schade is begrepen het nadeel dat
      niet in vermogensschade bestaat. De [artikelen 90][ref1] en [93 van het Wetboek van Strafvordering][ref2] zijn
      van overeenkomstige toepassing. Indien de vreemdeling na het indienen van zijn verzoek is overleden, geschiedt de
      toekenning ten behoeve van zijn erfgenamen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '93'
  - number: '106.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien de Afdeling bestuursrechtspraak van de Raad van State de
      opheffing van de maatregel strekkende tot vrijheidsontneming beveelt.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel106
  - number: '107.1'
    text: |-
      Onze Minister onderscheidenlijk de korpschef verstrekken andere bestuursorganen de gegevens betreffende de
      verblijfsrechtelijke positie van de vreemdeling welke zij behoeven ter uitvoering van hun taak.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107
  - number: '107.2'
    text: |-
      Andere bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd Onze Minister
      onderscheidenlijk de korpschef de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van
      deze wet. Deze bestuursorganen kunnen daarbij gebruik maken van het sociaal-fiscaal nummer, bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '107.3'
    text: |-
      De in het eerste en tweede lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107
  - number: '107.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de gevallen waarin en de wijze waarop in ieder
      geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107
  - number: '107.5'
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid worden met bestuursorganen gelijkgesteld
      instellingsbesturen van uit de openbare kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare
      kas bekostigde scholen en instellingen.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107
  - number: 107a.1
    text: |-
      Bijzondere persoonsgegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1] kunnen
      worden verwerkt, voor zover deze gegevens noodzakelijk zijn voor de doelmatige en doeltreffende uitvoering van de
      grensbewaking, de toelating, het verblijf en de uitzetting van vreemdelingen en het toezicht op vreemdelingen op
      grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 107a.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden verwerkt door of namens Onze Minister en de in de
      [artikelen 46 tot en met 48][ref1] aangewezen ambtenaren. Zij kunnen worden verwerkt door derden, voor zover deze
      betrokken zijn bij de uitvoering van deze wet en daartoe noodzakelijkerwijs de beschikking over deze gegevens
      moeten verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: 107a.3
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij wordt
      in ieder geval geregeld:
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107a
  - number: 107a.3.a
    text: op welke wijze de verwerking, bedoeld in het eerste lid, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107a
  - number: 107a.3.b
    text: |-
      op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107a
  - number: 107a.3.c
    text: welke gegevens, aan welke personen of instanties, voor welk doel en op welke wijze kunnen worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107a
  - number: 107a.3.d
    text: |-
      op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel waarvoor
      ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede hoe daarop wordt toegezien.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel107a
  - number: '108.1'
    text: |-
      Overtreding van een voorschrift, vastgesteld bij of krachtens de [artikelen 5, eerste en tweede lid][ref1],
      [46, tweede lid, aanhef, en onder b][ref2], alsmede handelen in strijd met [artikel 56, eerste lid][ref3], dan wel
      handelen in strijd met een verplichting opgelegd bij of krachtens de [artikelen 6, eerste lid][ref4], [54][ref5],
      [55][ref6], [57, eerste lid][ref7], [58, eerste lid][ref8], of [65, derde lid][ref9], wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref6]: https://wetten.overheid.nl/BWBR0011823#Artikel55
      [ref7]: https://wetten.overheid.nl/BWBR0011823#Artikel57
      [ref8]: https://wetten.overheid.nl/BWBR0011823#Artikel58
      [ref9]: https://wetten.overheid.nl/BWBR0011823#Artikel65
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '56'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0011823
        artikel: '55'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0011823
        artikel: '57'
        hoofdstuk: '5'
      - id: ref8
        bwb_id: BWBR0011823
        artikel: '58'
        hoofdstuk: '5'
      - id: ref9
        bwb_id: BWBR0011823
        artikel: '65'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '108.2'
    text: |-
      Overtreding van een voorschrift, vastgesteld bij of krachtens [artikel 4, eerste en tweede lid][ref1], wordt
      gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
        hoofdstuk: '2'
  - number: '108.3'
    text: De in het eerste en tweede lid strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel108
  - number: '108.4'
    text: |-
      Met de opsporing van de in het eerste lid strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren belast met de grensbewaking en
      ambtenaren belast met het vreemdelingentoezicht. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor
      zover deze feiten betrekking hebben op een aanwijzing, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '108.5'
    text: |-
      In afwijking van het eerste lid wordt handelen in strijd met een verplichting, opgelegd bij of krachtens
      [artikel 54, eerste lid, onder b of e][ref1], gestraft met ten hoogste een hechtenis van een maand of een geldboete
      van de tweede categorie, indien het feit wordt begaan door een gemeenschapsonderdaan. Het derde lid en de eerste
      volzin van het vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '2'
  - number: '109.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter uitvoering van een voor Nederland bindend verdrag of besluit van een
      volkenrechtelijke organisatie, bepalingen van deze wet geheel of gedeeltelijk buiten werking worden gesteld, indien
      dat, naar het gevoelen van de Ministerraad, noodzakelijk is om binnen twaalf maanden uitvoering te geven aan het
      verdrag of het besluit en daartoe deze wet in overeenstemming moet worden gebracht met het verdrag of het besluit.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel109
  - number: '109.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel109
  - number: '109.3'
    text: |-
      Onze Minister bevordert dat zo spoedig mogelijk na de vaststelling van een krachtens het eerste lid vastgestelde
      algemene maatregel van bestuur een voorstel van wet bij de Staten-Generaal wordt ingediend, dat ertoe strekt de
      wet in overeenstemming te brengen met het verdrag of besluit, bedoeld in het eerste lid. Indien het voorstel wordt
      ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt
      de algemene maatregel van bestuur terstond ingetrokken. Indien het voorstel tot wet wordt verheven, vervalt de
      algemene maatregel van bestuur op het tijdstip van inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel109
  - number: '109.4'
    text: |-
      Ter uitvoering van een verdrag waarbij de grenscontrole is verlegd naar buitengrenzen, wordt in de
      [artikelen 5, tweede lid][ref1], [6, eerste lid][ref2], [54, eerste lid, aanhef en onder a, en e][ref3],
      [56, tweede lid][ref4], alsmede [59, derde lid][ref5], onder «Nederland» mede verstaan het grondgebied van andere
      bij dat verdrag aangesloten landen waarover de werking van dat verdrag zich uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '56'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: '109.5'
    text: |-
      Ter uitvoering van een verdrag als bedoeld in het vierde lid wordt in [artikel 3, eerste lid][ref1], en
      [artikel 12, eerste lid, onder][ref2] «openbare orde» alsmede «nationale veiligheid» steeds mede verstaan de
      openbare orde in, onderscheidenlijk de nationale veiligheid van andere bij dat verdrag aangesloten landen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '12'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '110.1'
    text: |-
      Onverminderd de artikelen [7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-president, [artikel 111][ref3] in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel111
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '111'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '110.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel110
  - number: '110.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-president, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel110
  - number: '110.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-president, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel110
  - number: '110.5'
    text: |-
      Het besluit als bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel110
  - number: '110.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel110
  - number: '111'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels voor het geval van buitengewone omstandigheden worden gesteld, die
      afwijken van de [hoofdstukken 1 tot en met 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '1'
  - number: '112'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van een verdrag, dan wel van een voor
      Nederland verbindend besluit van een volkenrechtelijke organisatie regels worden gesteld in verband met het
      rechtmatig verblijf van vreemdelingen, waarbij ten gunste van deze vreemdelingen kan worden afgeweken van deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel112
  - number: '113.1'
    text: |-
      Onverminderd het daaromtrent bepaalde in verdragen waarbij Nederland partij is, wordt de persoonlijke staat van een
      vreemdeling aan wie een verblijfsvergunning als bedoeld in [artikel 28][ref1] of [artikel 33][ref2] is verleend,
      beheerst door Nederlands recht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '113.2'
    text: |-
      De rechten welke deze vreemdeling vroeger heeft verkregen en welke uit de persoonlijke staat voortvloeien, in het
      bijzonder de rechten voortvloeiende uit het huwelijk, worden geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel113
  - number: '114'
    text: |-
      Een vreemdeling aan wie de verblijfsvergunning als bedoeld in [artikel 28][ref1] of [artikel 33][ref2] is verleend,
      geniet dezelfde behandeling als een Nederlander, wat betreft rechtsingang, waaronder begrepen rechtsbijstand en
      vrijstelling van de cautio judicatum solvi.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '115.1'
    text: |-
      Een op het tijdstip van inwerkingtreding van deze wet geldige verblijfstitel wordt op dat tijdstip met inachtneming
      van het tweede tot en met zevende lid van rechtswege aangemerkt als een verblijfsvergunning op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel115
  - number: '115.2'
    text: |-
      Een vergunning tot verblijf met beperkingen, wordt, onder handhaving van de beperkingen en de geldigheidsduur,
      aangemerkt als een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '115.3'
    text: |-
      Een vergunning tot vestiging wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '115.4'
    text: Een vergunning tot verblijf zonder beperkingen wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel115
  - number: '115.5'
    text: |-
      Een toelating krachtens artikel 10, tweede lid, van de Vreemdelingenwet zoals dit luidde voor het tijdstip van
      inwerkingtreding van deze wet, wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '115.6'
    text: |-
      Een voorwaardelijke vergunning tot verblijf wordt, onder handhaving van de geldigheidsduur, aangemerkt als een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '115.7'
    text: |-
      Een toelating als vluchteling wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '116'
    text: |-
      Gedurende drie jaren na het tijdstip van inwerkingtreding van deze wet worden de inkomenseisen als bedoeld in
      [artikel 16, eerste lid, onderdeel c][ref1], en [artikel 18, eerste lid, onderdeel d][ref2], niet toegepast op:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 116.a
    text: Nederlanders, of
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel116
  - number: 116.b
    text: de vreemdeling die op het tijdstip van inwerkingtreding van deze wet was toegelaten.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel116
  - number: '117.1'
    text: 'Een op het tijdstip van inwerkingtreding van deze wet in behandeling zijnde aanvraag:'
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel117
  - number: 117.1.a
    text: tot verlening of verlenging van een vergunning tot verblijf,
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel117
  - number: 117.1.b
    text: tot verlening van een vergunning tot vestiging, of
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel117
  - number: 117.1.c
    text: |-
      tot toelating als vluchteling, wordt aangemerkt als een aanvraag tot verlening van een verblijfsvergunning op grond
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel117
  - number: '117.2'
    text: |-
      Op de behandeling van aanvragen als bedoeld in het eerste lid blijft het recht dat gold voor het tijdstip van
      inwerkingtreding van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel117
  - number: '118.1'
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken tegen een besluit op grond van de Vreemdelingenwet dat is
      bekendgemaakt, dan wel een handeling op grond van de Vreemdelingenwet die is verricht voor het tijdstip van
      inwerkingtreding van deze wet, blijft het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel118
  - number: '118.2'
    text: |-
      Op de behandeling van een bezwaarschrift tegen een besluit op grond van de Vreemdelingenwet dat is bekendgemaakt,
      dan wel een handeling op grond van de Vreemdelingenwet die is verricht voor het tijdstip van inwerkingtreding van
      deze wet, blijft het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel118
  - number: '118.3'
    text: |-
      Op de verplichting om de Adviescommissie voor vreemdelingenzaken te horen, is het tweede lid slechts van toepassing
      voorzover advisering ingevolge een verdrag of een Nederland bindend besluit van een volkenrechtelijke organisatie,
      dan wel ingevolge een onherroepelijk geworden rechterlijke uitspraak verplicht is.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel118
  - number: '119.1'
    text: |-
      Ten aanzien van de mogelijkheid om beroep in te stellen tegen een besluit op grond van de Vreemdelingenwet dat
      is bekendgemaakt, dan wel een handeling op grond van de Vreemdelingenwet die is verricht voor het tijdstip van
      inwerkingtreding van deze wet, blijft het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel119
  - number: '119.2'
    text: |-
      [Artikel 82][ref1] is niet van toepassing op een beroep tegen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel82
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '82'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '3'
  - number: 119.2.a
    text: een besluit als bedoeld in het eerste lid, of
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel119
  - number: 119.2.b
    text: een op bezwaar genomen beslissing.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel119
  - number: '119.3'
    text: |-
      Ten aanzien van de hoogte van het griffierecht voor een beroep of een verzoek om voorlopige voorziening tegen
      een besluit of handeling als bedoeld in het eerste lid, blijft het recht zoals dat gold voor het tijdstip van
      inwerkingtreding van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel119
  - number: '120'
    text: |-
      Hoger beroep als bedoeld in [artikel 84][ref1] kan slechts worden ingesteld tegen een uitspraak van de rechtbank of
      de voorzieningenrechter van de rechtbank over een besluit dat is bekendgemaakt na het tijdstip van inwerkingtreding
      van deze wet, met uitzondering van een beslissing op bezwaar gericht tegen een besluit bekendgemaakt voor
      inwerkingtreding van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel84
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '84'
        hoofdstuk: '7'
        afdeling: '4'
  - number: '121.1'
    text: |-
      [Afdeling 5 van hoofdstuk 7][ref1] is niet van toepassing op een maatregel strekkende tot vrijheidsbeperking op
      grond van de Vreemdelingenwet die is genomen voor het tijdstip van inwerkingtreding van deze wet. In plaats daarvan
      blijft het recht zoals het gold voor dat tijdstip van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '7'
        afdeling: '5'
  - number: '121.2'
    text: |-
      Ten aanzien van de vreemdeling aan wie op het tijdstip van inwerkingtreding van deze wet zijn vrijheid is ontnomen,
      blijft het recht zoals het gold voor het tijdstip van inwerkingtreding van deze wet van toepassing tot op het
      tijdstip waarop voor de eerste maal een kennisgeving als bedoeld in [artikel 96, eerste lid, eerste volzin][ref1],
      wordt gedaan dan wel de vreemdeling zelf beroep heeft ingesteld. Daarbij geldt een uitspraak van de rechtbank
      gedaan op een beroep als bedoeld in artikel 7a, zesde en zevende lid, artikel 18b, derde en vierde lid, van
      de Vreemdelingenwet en artikel 34a, tweede lid, van de Vreemdelingenwet in verbinding met artikel 86 van het
      Vreemdelingenbesluit, dan wel een uitspraak gedaan op een beroep dat de vreemdeling zelf heeft ingesteld, als een
      uitspraak op een beroep als bedoeld in [artikel 94 van deze wet][ref2]. Indien de vreemdeling geen beroep tegen de
      maatregel strekkende tot vrijheidsontneming heeft ingesteld, wordt de kennisgeving uiterlijk op de achtentwintigste
      dag na het tijdstip van inwerkingtreding van deze wet gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '96'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '122'
    text: De Vreemdelingenwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel122
  - number: '123'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel123
  - number: '124'
    text: 'Deze wet wordt aangehaald als: Vreemdelingenwet 2000.'
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel124
