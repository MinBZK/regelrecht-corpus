  - number: 8.j
    text: |-
      indien tegen de uitzetting beletselen bestaan als bedoeld in [artikel 64][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel8
