  - number: 1.h
    text: |-
      machtiging tot voorlopig verblijf: het bij een Nederlandse diplomatieke of consulaire vertegenwoordiging in het
      land van herkomst, het land van bestendig verblijf of, bij gebreke daarvan, het dichtstbijzijnde land waar wel
      een vertegenwoordiging is gevestigd, dan wel bij het Kabinet van de Gouverneur van de Nederlandse Antillen of
      het Kabinet van de Gouverneur van Aruba aldaar, door de vreemdeling in persoon aangevraagde en aldaar door die
      vertegenwoordiging of dat Kabinet na voorafgaande machtiging van Onze Minister van Buitenlandse Zaken afgegeven
      visum voor een verblijf van langer dan drie maanden;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.i
