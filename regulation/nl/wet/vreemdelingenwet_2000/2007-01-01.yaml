      op grond van een rechterlijke beslissing uitzetting van de aanvrager achterwege dient te blijven totdat op het
      bezwaarschrift of het beroepschrift is beslist;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel8
  - number: 8.i
    text: |-
      gedurende de vrije termijn, bedoeld in [artikel 12][ref1], zolang het verblijf van de vreemdeling bij of krachtens
      [artikel 12][ref2] is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel12
