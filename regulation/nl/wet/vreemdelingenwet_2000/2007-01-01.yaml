    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.e
    text: 'gemeenschapsonderdanen:'
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.e.1°
    text: |-
      onderdanen van de lidstaten van de Europese Unie die op grond van het Verdrag tot oprichting van de Europese
      Gemeenschap gerechtigd zijn een andere lidstaat binnen te komen en er te verblijven;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.e.2°
    text: |-
      familieleden van de onder 1° genoemden die de nationaliteit van een derde staat bezitten en die uit hoofde van
      een ter toepassing van het Verdrag tot oprichting van de Europese Gemeenschap genomen besluit gerechtigd zijn een
      lidstaat binnen te komen en er te verblijven;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.e.3°
    text: |-
      onderdanen van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei
      1992, die ter zake van binnenkomst en verblijf in een lidstaat rechten genieten die gelijk zijn aan die van burgers
      van de lidstaten van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.e.4°
    text: |-
      familieleden van de onder 3° genoemden die de nationaliteit van een derde staat bezitten en die krachtens
      bovengenoemde Overeenkomst gerechtigd zijn een lidstaat binnen te komen en er te verblijven;
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.e.5°
    text: |-
      onderdanen van de Zwitserse Bondsstaat, indien zij verblijven op grond van de op 21 juni 1999 te Luxemburg
      totstandgekomen Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse
      Bondsstaat, anderzijds, over het vrije verkeer van personen (Trb. 2000, 16 en 86);
    url: https://wetten.overheid.nl/BWBR0011823/2007-01-01#Artikel1
  - number: 1.e.6°
    text: |-
