  - number: '116'
    text: |-
      Gedurende drie jaren na het tijdstip van inwerkingtreding van deze wet worden de inkomenseisen als bedoeld in
      [artikel 16, eerste lid, onderdeel c][ref1], en [artikel 18, eerste lid, onderdeel d][ref2], niet toegepast op:

      a. Nederlanders, of

      b. de vreemdeling die op het tijdstip van inwerkingtreding van deze wet was toegelaten.

      In plaats daarvan blijft het recht zoals het gold voor het tijdstip van inwerkingtreding van deze wet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel18
