  - number: '83'
    text: |-
      1 De rechtbank houdt bij de beoordeling van het beroep rekening met:

      a. feiten en omstandigheden die na het bestreden besluit zijn aangevoerd, en

      b. wijzigingen van beleid die na het bestreden besluit zijn bekendgemaakt.

      2 Met de in het eerste lid bedoelde gegevens wordt slechts rekening gehouden indien deze relevant kunnen zijn
      voor de beschikking omtrent de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en [33][ref2], of omtrent
      de ambtshalve verlening van een vergunning als bedoeld in [artikel 14][ref3], dan wel het achterwege laten van de
      uitzetting op grond van [artikel 64][ref4].

      3 Met de in het eerste lid bedoelde gegevens wordt geen rekening gehouden voor zover de goede procesorde zich
      daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.

      4 Indien de indiener van het beroepschrift zich beroept op feiten of omstandigheden als bedoeld in het eerste lid,
      onderdeel a, maar deze niet aanstonds aannemelijk maakt, stelt de rechtbank hem zo nodig in de gelegenheid deze
      feiten of omstandigheden binnen een door de rechtbank te bepalen termijn alsnog aannemelijk te maken, tenzij de
      goede procesorde zich daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.

      5 Onze Minister laat de wederpartij en de rechtbank zo spoedig mogelijk schriftelijk weten of de gegevens, bedoeld
      in het eerste lid, aanleiding zijn voor handhaving, wijziging of intrekking van het bestreden besluit. De rechtbank
      kan daarvoor een termijn stellen.

      6 Indien Onze Minister zich beroept op gegevens als bedoeld in het eerste lid, biedt de rechtbank de vreemdeling de
      gelegenheid om daarop schriftelijk te reageren.

      7 Het vijfde en zesde lid zijn niet van toepassing indien:

      a. aan een schriftelijke reactie redelijkerwijs geen behoefte bestaat;

      b. deze gegevens niet relevant kunnen zijn voor de beschikking omtrent de verblijfsvergunning, bedoeld in
      de [artikelen 28][ref5] en [33][ref6], of omtrent de ambtshalve verlening van een vergunning als bedoeld in
      [artikel 14][ref7], dan wel het achterwege laten van de uitzetting op grond van [artikel 64][ref8];

      c. de goede procesorde zich daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.


