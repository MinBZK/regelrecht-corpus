  - number: '73'
    text: |-
      1 De werking van het besluit tot afwijzing van de aanvraag of de intrekking van de verblijfsvergunning wordt
      opgeschort totdat de termijn voor het maken van bezwaar of het instellen van administratief beroep is verstreken
      of, indien bezwaar is gemaakt of administratief beroep is ingesteld, totdat op het bezwaar of administratief beroep
      is beslist.

      2 Het eerste lid is niet van toepassing indien de aanvraag is afgewezen dan wel de verblijfsvergunning is
      ingetrokken op de grond, bedoeld in artikel:

      a. [16, eerste lid, onder a of d][ref1];

      b. [18, eerste lid, onder e][ref2];

      c. [21, eerste lid, onder e of f][ref3];

      d. [22, eerste lid, onder c][ref4].

      3 Het eerste lid is voorts niet van toepassing indien het besluit inhoudt de afwijzing van een herhaalde aanvraag
      of indien het bezwaarschrift of het administratief beroepschrift niet tijdig is ingediend.

      4 Het eerste lid is evenmin van toepassing indien de vreemdeling rechtens zijn vrijheid is of wordt ontnomen op
      grond van [artikel 59][ref5].

      5 Het eerste lid is, voor zover het betreft de opschortende werking gedurende de termijn voor het maken van bezwaar
      of het instellen van administratief beroep zolang geen bezwaar is gemaakt of administratief beroep is ingesteld,
      niet van toepassing op de verplichting, bedoeld in [artikel 62, eerste lid][ref6].


