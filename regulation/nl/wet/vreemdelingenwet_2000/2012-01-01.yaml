  - number: '97'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de wijze van
      horen van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel97
  - number: '98'
    text: |-
      1 In afwijking van [artikel 8:24 van de Algemene wet bestuursrecht][ref1] kan de vreemdeling zich bij de gehoren
      ingevolge de [artikelen 94][ref2] en [96][ref3] uitsluitend door één of meer van zijn raadslieden doen bijstaan.

      2 De raadsman wordt bij het horen in de gelegenheid gesteld de nodige opmerkingen te maken.

      3 Als raadsman wordt slechts toegelaten een in Nederland ingeschreven advocaat alsmede de persoon
      bedoeld in [artikel 16b][ref4] dan wel [16h van de Advocatenwet][ref5] indien deze samenwerkt met een
      in Nederland ingeschreven advocaat, overeenkomstig het bepaalde in [artikel 16e][ref6] respectievelijk
      [16j van de Advocatenwet][ref7]. Onder raadsman wordt ook verstaan de rechtshulpverlener die in dienst is van de
      Stichting Rechtsbijstand Asiel die terzake van de vrijheidsontnemende maatregelen relevante opleiding en ervaring
      bezit, en

      a. aan wie door een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8] de graad Bachelor op het gebied van het recht en
      tevens de graad Master op het gebied van het recht is verleend, of

      b. die aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9] het doctoraat in de rechtsgeleerdheid of het recht
      om de titel meester te voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel824
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel96
