  - number: '94'
    text: |-
      1 Uiterlijk op de achtentwintigste dag na de bekendmaking van een besluit tot oplegging van een vrijheidsontnemende
      maatregel als bedoeld in de [artikelen 6][ref1], [58][ref2] en [59][ref3], stelt Onze Minister de rechtbank
      hiervan in kennis, tenzij de vreemdeling voordien zelf beroep heeft ingesteld. Zodra de rechtbank de kennisgeving
      heeft ontvangen wordt de vreemdeling geacht beroep te hebben ingesteld tegen het besluit tot oplegging van een
      vrijheidsontnemende maatregel. Het beroep strekt tevens tot een verzoek om toekenning van schadevergoeding.

      2 De rechtbank bepaalt onmiddellijk het tijdstip van het onderzoek ter zitting. De zitting vindt uiterlijk op de
      veertiende dag na ontvangst van het beroepschrift dan wel de kennisgeving plaats. De rechtbank roept de vreemdeling
      op om in persoon dan wel in persoon of bij raadsman en Onze Minister om bij gemachtigde te verschijnen teneinde te
      worden gehoord. In afwijking van [artikel 8:42, tweede lid, van de Algemene wet bestuursrecht][ref4] kan de in dat
      artikel bedoelde termijn niet worden verlengd.

      3 De rechtbank doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak
      wordt binnen zeven dagen na de sluiting van het onderzoek gedaan. In afwijking van
      [artikel 8:66, tweede lid, van de Algemene wet bestuursrecht][ref5] kan de in dat artikel bedoelde termijn niet
      worden verlengd.

      4 Indien de rechtbank bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel
      in strijd is met deze wet dan wel bij afweging van alle daarbij betrokken belangen in redelijkheid niet
      gerechtvaardigd is, verklaart zij het beroep gegrond. In dat geval beveelt de rechtbank de opheffing van de
      maatregel of een wijziging van de wijze van tenuitvoerlegging daarvan.

      5 Het eerste, derde en vierde lid zijn van overeenkomstige toepassing op een besluit tot verlenging
      van een vrijheidsontnemende maatregel als bedoeld in [artikel 59, zesde lid][ref6]. In afwijking van
      [artikel 8:57 van de Algemene wet bestuursrecht][ref7] kan de rechtbank ook zonder toestemming van partijen bepalen
      dat het onderzoek ter zitting achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
