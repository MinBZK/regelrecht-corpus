  - number: '42'
    text: |-
      1 Op de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1],
      dan wel een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref2], wordt binnen zes maanden na
      ontvangst van de aanvraag een beschikking gegeven.

      2 De inwilliging van de aanvraag is mede afgestemd op het beleid dat Onze Minister na overleg met Onze Minister van
      Buitenlandse Zaken dienaangaande voert.

      3 Indien de aanvraag wordt afgewezen, wordt in de beschikking ingegaan op de zienswijze van de vreemdeling. In
      de beschikking wordt tevens ingegaan op de zienswijze van de vreemdeling op het voornemen om niet ambtshalve een
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14][ref3], te verlenen, dan wel op het voornemen om
      de uitzetting niet op grond van [artikel 64][ref4] achterwege te laten indien hem van dat voornemen mededeling
      is gedaan.

      4 De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie nodig is.

      5 Onze Minister stelt de vreemdeling in kennis van de verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
