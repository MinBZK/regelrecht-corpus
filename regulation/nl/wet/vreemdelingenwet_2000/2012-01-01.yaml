  - number: '43'
    text: |-
      Onverminderd [artikel 42, vierde lid][ref1], en [artikel 4:5 van de Algemene wet bestuursrecht][ref2] kan bij
      besluit van Onze Minister voor bepaalde categorieën vreemdelingen die een aanvraag tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref3] hebben ingediend de termijn, bedoeld in
      [artikel 42][ref4] worden verlengd met ten hoogste één jaar indien:

      a. naar verwachting voor een korte periode onzekerheid zal bestaan over de situatie in het land van herkomst
      en op grond daarvan redelijkerwijs niet kan worden beslist of de aanvraag op een van de gronden genoemd in
      [artikel 29][ref5] kan worden toegewezen;

      b. naar verwachting de situatie in het land van herkomst op grond waarvan ingevolge [artikel 29][ref6] de aanvraag
      kan worden toegewezen, van korte duur zal zijn, of,

      c. het aantal ingediende aanvragen uit een bepaald land of uit een bepaalde regio zo groot is, dat Onze Minister
      redelijkerwijs niet in staat is daarop tijdig een beschikking te geven.


