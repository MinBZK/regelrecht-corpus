  - number: '106'
    text: |-
      1 Indien de rechtbank de opheffing van een maatregel strekkende tot vrijheidsontneming beveelt, dan wel de
      vrijheidsontneming reeds voor de behandeling van het verzoek om opheffing van die maatregel wordt opgeheven, kan
      zij aan de vreemdeling een vergoeding ten laste van de Staat toekennen. Onder schade is begrepen het nadeel dat
      niet in vermogensschade bestaat. De [artikelen 90][ref1] en [93 van het Wetboek van Strafvordering][ref2] zijn
      van overeenkomstige toepassing. Indien de vreemdeling na het indienen van zijn verzoek is overleden, geschiedt de
      toekenning ten behoeve van zijn erfgenamen.

      2 Het eerste lid is van overeenkomstige toepassing, indien de Afdeling bestuursrechtspraak van de Raad van State de
      opheffing van de maatregel strekkende tot vrijheidsontneming beveelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel93
