  - number: '82'
    text: |-
      1 De werking van het besluit omtrent een verblijfsvergunning wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.

      2 Het eerste lid is niet van toepassing indien het besluit inhoudt:

      a. de afwijzing van de aanvraag binnen een bij algemene maatregel van bestuur te bepalen aantal dagen, dat
      niet de dagen omvat die gemoeid zijn met het aan de asielaanvraag voorafgaande onderzoek naar de identiteit,
      vingerafdrukken en nationaliteit van de vreemdeling, naar de bij hem aangetroffen of door hem overgelegde
      documenten en bescheiden, dan wel naar de vraag of [artikel 30, eerste lid, aanhef en onder a][ref1], kan worden
      toegepast;

      b. de afwijzing van de herhaalde aanvraag;

      c. de afwijzing van de aanvraag op grond van [artikel 30, eerste lid, onder a][ref2], of

      d. een besluit als bedoeld in de [artikelen 43][ref3] en [45, vierde lid][ref4].

      3 Het eerste lid is niet van toepassing indien het beroepschrift niet tijdig is ingediend.

      4 Het eerste lid is voorts niet van toepassing indien de vreemdeling rechtens zijn vrijheid is of wordt ontnomen op
      grond van [artikel 6][ref5] of [59][ref6].

      5 Het eerste lid is, voor zover het betreft de opschortende werking gedurende de beroepstermijn zolang geen beroep
      is ingesteld, niet van toepassing op de verplichting, bedoeld in [artikel 62, eerste lid][ref7].

      6 Het tweede lid, onder a en b, en het derde en vierde lid zijn niet van toepassing, indien de vreemdeling
      tijdelijke bescherming heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
