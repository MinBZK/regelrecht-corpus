    text: |-
      1 Onze Minister verschaft aan de vreemdeling, die rechtmatig verblijf heeft op grond van
      [artikel 8, onder a tot en met d, f tot en met h en j tot en met l][ref1], en aan de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, onder e][ref2], en gemeenschapsonderdaan is als bedoeld in
      [artikel 1, onder e, sub 2°, 4° en 6°][ref3], een document of schriftelijke verklaring, waaruit het rechtmatig
      verblijf blijkt.

      2 Onze Minister verschaft aan de vreemdeling die rechtmatig verblijf heeft op grond van [artikel 8, onder e][ref4],
      en gemeenschapsonderdaan is als bedoeld in [artikel 1, onder e, sub 1°, 3° en 5°][ref5] een document, waaruit
      het rechtmatig verblijf blijkt, indien de vreemdeling het duurzaam verblijfsrecht heeft verkregen als bedoeld
      in artikel 16 van [Richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor burgers van de Unie
      en hun familieleden, tot wijziging van [Verordening (EEG) 1612/68](31968R1612) en tot intrekking van [Richtlijnen
      64/221/EEG](31964L0221), [68/360/EEG](31968L0360), [72/194/EEG](31972L0194), [73/148/EEG](31973L0148), [75/34/
      EEG](31975L0034), [75/35/EEG](31975L0035), [90/364/EEG](31990L0364), [90/365/EEG](31990L0365) en [93/96/EEG]
      (31993L0096) (PbEU L 158).

      3 Onze Minister verschaft desgevraagd een dergelijk document of schriftelijke verklaring aan de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, onder i][ref6].

      4 Bij de aanvraag van een beschikking anders dan op grond van deze wet legt de vreemdeling desgevraagd een
      kopie van het document of de schriftelijke verklaring over, dat wordt aangemerkt als een bescheid als bedoeld in
      [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref7].

      5 Onze Minister wijst bij ministeriële regeling de bescheiden, bedoeld in het eerste tot en met derde lid, aan en
      kan modellen vaststellen voor de documenten en de schriftelijke verklaring.


