  - number: '24'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de wijze van indiening en behandeling van een aanvraag;

      b. de gegevens die de vreemdeling in persoon moet verstrekken;

      c. de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede de bij
      of krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling of aan andere
      belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van beschikkingen ook kan
      geschieden door middel van het toezenden of uitreiken van een document en door het stellen van aantekeningen in een
      daarbij aan te wijzen document.

      2 De vreemdeling is, in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven regels, leges
      verschuldigd terzake van de afdoening van een aanvraag. Daarbij kan Onze Minister tevens bepalen dat de vreemdeling
      voor de afgifte van een document waaruit het rechtmatig verblijf blijkt leges verschuldigd is. Als betaling
      achterwege blijft, wordt de aanvraag niet in behandeling genomen dan wel het document niet afgegeven.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel24
  - number: '25'
    text: |-
      1 Binnen zes maanden wordt een beschikking gegeven op de aanvraag tot:

      a. het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];

      b. het verlengen van de geldigheidsduur ervan;

      c. het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref2];

      d. het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref3];

      e. het wijzigen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref4].

      2 De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie, nodig is.

      3 Onze Minister stelt de vreemdeling in kennis van de verlenging.

      4 Indien de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14][ref5] is ingediend door een langdurig ingezetene of diens gezinslid, wordt de beschikking in
      afwijking van het eerste lid gegeven binnen vier maanden, welke termijn in afwijking van het tweede lid
      voor ten hoogste drie maanden kan worden verlengd. Indien de langdurig ingezetene of het gezinslid krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref6] is uitgenodigd de aanvraag aan te vullen, wordt de
      beschikking gegeven binnen zeven maanden.


