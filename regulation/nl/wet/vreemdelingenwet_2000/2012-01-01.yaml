      Onze Minister is bevoegd:

      a. de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd in te willigen, af te wijzen dan
      wel niet in behandeling te nemen;

      b. een verleende verblijfsvergunning voor onbepaalde tijd in te trekken.
