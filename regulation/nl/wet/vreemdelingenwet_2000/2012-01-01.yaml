  - number: '59'
    text: |-
      1 Indien het belang van de openbare orde of de nationale veiligheid zulks vordert kan, met het oog op de
      uitzetting, door Onze Minister in bewaring worden gesteld de vreemdeling die:

      a. geen rechtmatig verblijf heeft;

      b. die rechtmatig verblijf heeft op grond van [artikel 8, onder f, g en h][ref1].

      2 Indien de voor de terugkeer van de vreemdeling noodzakelijke bescheiden voorhanden zijn, dan wel
      binnen korte termijn voorhanden zullen zijn, wordt het belang van de openbare orde geacht de bewaring
      van de vreemdeling te vorderen, tenzij de vreemdeling rechtmatig verblijf heeft gehad op grond van
      [artikel 8, onder a tot en met e, en l][ref2].

      3 Bewaring van een vreemdeling blijft achterwege indien en wordt beëindigd zodra hij te kennen geeft Nederland te
      willen verlaten en hiertoe voor hem ook gelegenheid bestaat.

      4 Bewaring krachtens het eerste lid, onder b, of het tweede lid duurt in geen geval langer dan vier weken. Indien
      voorafgaande aan de beslissing op de aanvraag toepassing is gegeven aan [artikel 39][ref3], duurt de bewaring
      krachtens het eerste lid, onder b, in geen geval langer dan zes weken.

      5 Onverminderd het vierde lid duurt de bewaring krachtens het eerste lid niet langer dan zes maanden.

      6 In afwijking van het vijfde lid en onverminderd het vierde lid kan de bewaring krachtens het eerste lid ten
      hoogste met nog eens twaalf maanden worden verlengd, indien de uitzetting, alle redelijke inspanningen ten
      spijt, wellicht meer tijd zal vergen, op grond dat de vreemdeling niet meewerkt aan zijn uitzetting of de daartoe
      benodigde documentatie uit derde landen nog ontbreekt.

      7 Het vijfde en zesde lid zijn van overeenkomstige toepassing op de vreemdeling aan wie de verplichting of
      maatregel, bedoeld in [artikel 6, eerste of tweede lid][ref4], dan wel [artikel 58][ref5] is opgelegd.


