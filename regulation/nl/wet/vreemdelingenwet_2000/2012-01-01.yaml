      1 In afwijking van de [artikelen 2:1][ref1] en[ 8:24 van de Algemene wet bestuursrecht][ref2] wordt het bezwaar,
      administratief beroep, het beroep op de rechtbank of het hoger beroep ingesteld door de vreemdeling in persoon,
      zijn wettelijke vertegenwoordiger, zijn bijzondere gemachtigde of een advocaat.

      2 Indien de vreemdeling van zijn vrijheid is ontnomen kan hij het bezwaar, administratief beroep, het
      beroep op de rechtbank of hoger beroep ook instellen door middel van de schriftelijke verklaring, bedoeld in
      [artikel 451a van het Wetboek van Strafvordering][ref3]


