  - number: '107'
    text: |-
      1 Onze Minister onderscheidenlijk de korpschef verstrekken andere bestuursorganen de gegevens betreffende de
      verblijfsrechtelijke positie van de vreemdeling welke zij behoeven ter uitvoering van hun taak.

      2 Andere bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd Onze Minister
      onderscheidenlijk de korpschef de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van
      deze wet. Deze bestuursorganen kunnen daarbij gebruik maken van het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1].

      3 De in het eerste en tweede lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.

      4 Bij algemene maatregel van bestuur worden regels gesteld omtrent de gevallen waarin en de wijze waarop in ieder
      geval gegevens dienen te worden verstrekt.

      5 Voor de toepassing van het eerste tot en met vierde lid worden met bestuursorganen gelijkgesteld
      instellingsbesturen van uit de openbare kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare
      kas bekostigde scholen en instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 107a
    text: |-
      1 Bijzondere persoonsgegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1] kunnen
      worden verwerkt, voor zover deze gegevens noodzakelijk zijn voor de doelmatige en doeltreffende uitvoering van de
      grensbewaking, de toelating, het verblijf en de uitzetting van vreemdelingen en het toezicht op vreemdelingen op
      grond van deze wet dan wel de Schengengrenscode.

      2 De gegevens, bedoeld in het eerste lid, worden verwerkt door of namens Onze Minister en de in de
      [artikelen 46 tot en met 48][ref2] aangewezen ambtenaren. Zij kunnen worden verwerkt door derden, voor zover deze
      betrokken zijn bij de uitvoering van deze wet of de Schengengrenscode en daartoe noodzakelijkerwijs de beschikking
      over deze gegevens moeten verkrijgen.

      3 Bij regeling van Onze Minister worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij
      wordt in ieder geval geregeld:

      a. op welke wijze de verwerking, bedoeld in het eerste lid, plaatsvindt;

      b. op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;

      c. welke gegevens, aan welke personen of instanties, voor welk doel en op welke wijze kunnen worden verstrekt;

      d. op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel
      waarvoor ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede hoe daarop wordt
      toegezien.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel107a
