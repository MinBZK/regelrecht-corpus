  - number: '62'
    text: |-
      1 Nadat tegen de vreemdeling een terugkeerbesluit is uitgevaardigd dan wel, indien het een gemeenschapsonderdaan
      betreft, nadat het rechtmatig verblijf van de vreemdeling is geëindigd, dient hij Nederland uit eigen beweging
      binnen vier weken te verlaten.

      2 Onze Minister kan de voor een vreemdeling geldende termijn, bedoeld in het eerste lid, verkorten, dan wel, in
      afwijking van het eerste lid, bepalen dat een vreemdeling Nederland onmiddellijk moet verlaten, indien:

      a. een risico bestaat dat de vreemdeling zich aan het toezicht zal onttrekken;

      b. de aanvraag van de vreemdeling tot het verlenen van een verblijfsvergunning of tot het verlengen van de
      geldigheidsduur van een verblijfsvergunning is afgewezen als kennelijk ongegrond of wegens het verstrekken van
      onjuiste of onvolledige gegevens; of

      c. de vreemdeling een gevaar vormt voor de openbare orde, de openbare veiligheid of de nationale veiligheid.

      3 Onze Minister kan de voor een vreemdeling geldende termijn, bedoeld in het eerste lid, verlengen, rekening
      houdend met de specifieke omstandigheden van het individuele geval. Bij ministeriële regeling worden regels gesteld
      over de duur van de verlenging en worden de gevallen aangewezen waarin de termijn kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel62
  - number: 62a
    text: |-
      1 Onze Minister stelt de vreemdeling, niet zijnde gemeenschapsonderdaan, die niet of niet langer rechtmatig
      verblijf heeft, schriftelijk in kennis van de verplichting Nederland uit eigen beweging te verlaten en van de
      termijn waarbinnen hij aan die verplichting moet voldoen, tenzij:

      a. reeds eerder een terugkeerbesluit tegen de vreemdeling is uitgevaardigd en aan de daaruit voortvloeiende
      terugkeerverplichting niet is voldaan,

      b. de vreemdeling in bezit is van een door een andere lidstaat afgegeven geldige verblijfsvergunning of andere
      toestemming tot verblijf, of

      c. de vreemdeling door een andere lidstaat van de Europese Unie wordt teruggenomen op grond van een op 13 januari
      2009 geldende bilaterale of multilaterale overeenkomst of regeling.

      2 De kennisgeving, bedoeld in het eerste lid, geldt als terugkeerbesluit en kan tevens een inreisverbod inhouden.

      3 De vreemdeling, bedoeld in het eerste lid, onderdeel b, wordt opgedragen zich onmiddellijk naar het grondgebied
      van de betrokken lidstaat te begeven. Indien dit bevel niet wordt nageleefd of indien om redenen van openbare
      orde of nationale veiligheid het onmiddellijke vertrek van vreemdeling is vereist, wordt tegen de vreemdeling een
      terugkeerbesluit uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel62a
  - number: '63'
    text: |-
      1 De vreemdeling die geen rechtmatig verblijf heeft en die niet binnen de bij deze wet gestelde termijn Nederland
      uit eigen beweging heeft verlaten, kan worden uitgezet.

      2 Onze Minister is bevoegd tot uitzetting.

      3 Indien de werking van de beschikking waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken is
      opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel63
  - number: '64'
    text: |-
      Uitzetting blijft achterwege zolang het gelet op de gezondheidstoestand van de vreemdeling of die van een van zijn
      gezinsleden niet verantwoord is om te reizen.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel64
  - number: '65'
    text: |-
      1 De vreemdeling:

      a. die Nederland is binnengekomen aan boord van een vaartuig of luchtvaartuig in gebruik bij een
      vervoersonderneming en die Nederland onmiddellijk dient te verlaten, of

      b. die met het oog op zijn uitzetting is aangehouden binnen zes maanden nadat hij is binnengekomen aan boord van
      een vaartuig of luchtvaartuig in gebruik bij een vervoersonderneming, kan worden uitgezet door plaatsing aan boord
      van een vaartuig of luchtvaartuig in gebruik bij dezelfde vervoersonderneming.

      2 De vervoersonderneming vervoert op aanwijzing van een ambtenaar belast met de grensbewaking de vreemdeling,
      bedoeld in het eerste lid, om niet terug naar een plaats buiten Nederland en vindt daartoe zo nodig een ander
      middel voor de terugbrenging. Is zulks niet binnen redelijke tijd mogelijk, of, in het geval bedoeld in het
      eerste lid, onder b, niet binnen redelijke tijd na de aanhouding mogelijk, dan kunnen de kosten van uitzetting uit
      Nederland op die vervoersonderneming worden verhaald.

      3 Gezagvoerders van vaartuigen en luchtvaartuigen verlenen aan de uitzetting van de vreemdeling alle medewerking
      die de ambtenaar belast met de grensbewaking redelijkerwijs kan vorderen.

      4 Het eerste lid, onder b, is niet van toepassing op de vreemdeling die rechtmatig verblijf geniet tot een later
      tijdstip dan dat van vertrek van het vaartuig of luchtvaartuig aan boord waarvan hij is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel65
  - number: '66'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de toepassing van de afdelingen 1 en 2 van
      dit hoofdstuk. Daarbij kan worden voorzien in de mogelijkheid van verhaal van de kosten van uitzetting op de
      vreemdeling zelf en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel66
  - number: 66a
    text: |-
      1 Onze Minister vaardigt een inreisverbod uit tegen de vreemdeling, die geen gemeenschapsonderdaan is, op wie
      [artikel 64][ref1] niet van toepassing is en die Nederland:

      a. onmiddellijk moet verlaten ingevolge [artikel 62, tweede lid][ref2], of

      b. niet uit eigen beweging binnen de daarvoor geldende termijn heeft verlaten, in welk laatste geval het
      inreisverbod slechts door middel van een zelfstandige beschikking wordt uitgevaardigd dan wel een beschikking die
      mede strekt tot wijziging van het reeds gegeven terugkeerbesluit.

      2 Onze Minister kan een inreisverbod uitvaardigen tegen de vreemdeling, die geen gemeenschapsonderdaan is en die
      Nederland niet onmiddellijk moet verlaten.

      3 De vreemdeling tegen wie een inreisverbod is uitgevaardigd wordt ter fine van weigering van de toegang en het
      verblijf gesignaleerd in de daartoe bij of krachtens een verdrag, een EU-verordening, -richtlijn, of -besluit of
      een algemene maatregel van bestuur aangewezen informatie- dan wel signaleringssystemen.

      4 Het inreisverbod wordt gegeven voor een bepaalde duur, die ten hoogste vijf jaren bedraagt, tenzij de vreemdeling
      naar het oordeel van Onze Minister een ernstige bedreiging vormt voor de openbare orde, de openbare veiligheid
      of de nationale veiligheid. De duur wordt berekend met ingang van de datum waarop de vreemdeling Nederland
      daadwerkelijk heeft verlaten.

      5 Indien de bekendmaking van de beschikking, waarbij het inreisverbod is uitgevaardigd, geschiedt door toezending,
      wordt van de beschikking mededeling gedaan in de Staatscourant.

      6 In afwijking van [artikel 8][ref3] kan de vreemdeling jegens wie een inreisverbod geldt of die is gesignaleerd
      ter fine van weigering van de toegang geen rechtmatig verblijf hebben, met uitzondering van het rechtmatig
      verblijf:

      a. van de vreemdeling die een eerste aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 28][ref4] heeft ingediend, zolang op die aanvraag nog niet is beslist;

      b. bedoeld in [artikel 8, onder j][ref5], en

      c. van de vreemdeling wiens uitzetting op grond van een rechterlijke beslissing achterwege dient te blijven totdat
      op het bezwaarschrift of beroepschrift is beslist.

      7 In afwijking van het zesde lid en [artikel 8][ref6] en met uitzondering van het rechtmatig verblijf van de
      vreemdeling die een eerste aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 28][ref7]
      heeft ingediend zolang op die aanvraag nog niet is beslist, kan de vreemdeling jegens wie een inreisverbod geldt
      geen rechtmatig verblijf hebben, in geval de vreemdeling:

      a. bij onherroepelijk geworden rechtelijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd dan wel hem ter zake de maatregel als bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref8] is opgelegd;

      b. een gevaar vormt voor de openbare orde of de nationale veiligheid;

      c. naar het oordeel van Onze Minister een ernstige bedreiging vormt als bedoeld in het vierde lid, dan wel

      d. ingevolge een verdrag of in het belang van de internationale betrekkingen van Nederland ieder verblijf dient te
      worden ontzegd.

      8 In afwijking van het eerste lid kan Onze Minister om humanitaire of andere redenen afzien van het uitvaardigen
      van een inreisverbod.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
