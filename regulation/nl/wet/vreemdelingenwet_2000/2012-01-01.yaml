  - number: '26'
    text: |-
      1 De verblijfsvergunning, die van rechtswege rechtmatig verblijf inhoudt, wordt verleend met ingang van de dag
      waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet eerder dan met ingang van de
      dag waarop de aanvraag is ontvangen.

      2 De geldigheidsduur van de verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] wordt verlengd
      met ingang van de dag waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet
      eerder dan met ingang van de dag na die waarop de geldigheidsduur van de verblijfsvergunning waarvoor verlenging is
      gevraagd afloopt.

      3 Indien de vreemdeling de aanvraag tot verlenging, dan wel de gegevens waaruit blijkt dat aan de voorwaarden wordt
      voldaan niet tijdig heeft ingediend en hem dit niet is toe te rekenen, kan de verblijfsvergunning worden verlengd
      met ingang van de dag na die waarop de geldigheidsduur van de verblijfsvergunning waarvoor verlenging is gevraagd
      afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
