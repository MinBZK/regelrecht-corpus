        hoofdstuk: '5'
  - number: '54'
    text: |-
      1 Bij algemene maatregel van bestuur kan ten aanzien van vreemdelingen worden voorzien in een verplichting tot:

      a. het kennis geven van verandering van woon- of verblijfplaats binnen Nederland en van vertrek naar het
      buitenland;

      b. het verstrekken van gegevens welke van belang kunnen zijn voor de toepassing van de bij of krachtens deze wet
      gestelde regels;

      c. het verlenen van medewerking aan het vastleggen van gegevens met het oog op identificatie;

      d. het verlenen van medewerking aan een medisch onderzoek naar een ziekte aangewezen bij of krachtens de
      Infectieziektewet, ter bescherming van de volksgezondheid of in het kader van de beoordeling van een aanvraag om
      een verblijfsvergunning;

      e. aanmelding binnen een bepaalde termijn na binnenkomst in Nederland;

      f. periodieke aanmelding;

      g. het inleveren van het document of schriftelijke verklaring als bedoeld in [artikel 9][ref1] waaruit het
      rechtmatig verblijf blijkt;

      h. het stellen van zekerheid;

      i. het overleggen van documenten, anders dan bedoeld onder g.

      2 In gevallen waarin Onze Minister zulks in het belang van de openbare orde of de nationale veiligheid nodig
      oordeelt, kan hij aan een vreemdeling een individuele verplichting tot periodieke aanmelding bij de korpschef
      opleggen.


