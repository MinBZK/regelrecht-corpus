      1 De verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan worden ingetrokken dan wel de
      aanvraag voor verlenging van de geldigheidsduur ervan kan worden afgewezen indien:

      a. de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid;

      b. de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;

      c. de grond voor verlening, bedoeld in [artikel 29][ref2], is komen te vervallen;

      d. de vreemdeling zijn hoofdverblijf buiten Nederland heeft gevestigd.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
      Daarbij wordt bepaald in welke gevallen een verblijfsvergunning als bedoeld in het eerste lid die is verleend op
      grond van [artikel 29, eerste lid, onder a of b][ref3], wordt ingetrokken dan wel de aanvraag voor verlenging van
      de geldigheidsduur van zodanige verblijfsvergunning wordt afgewezen.


