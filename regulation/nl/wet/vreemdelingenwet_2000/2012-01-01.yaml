  - number: '7'
    text: |-
      Indien de vreemdeling aan wie de toegang is geweigerd, op grond van de Schengengrenscode, enig wettelijk
      voorschrift dan wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie zijn vrijheid is
      ontnomen, blijft de toegang geweigerd.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel7
  - number: '8'
    text: |-
      De vreemdeling heeft in Nederland uitsluitend rechtmatig verblijf:

      a. op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];

      b. op grond van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref2];

      c. op grond van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref3];

      d. op grond van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref4];

      e. als gemeenschapsonderdaan zolang deze onderdaan verblijf houdt op grond van een regeling krachtens het [Verdrag
      tot oprichting van de Europese Gemeenschap](onbekend) dan wel de Overeenkomst betreffende de Europese Economische
      Ruimte;

      f. in afwachting van de beslissing op een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de
      [artikelen 14][ref5] en [28][ref6], terwijl bij of krachtens deze wet dan wel op grond van een rechterlijke
      beslissing uitzetting van de aanvrager achterwege dient te blijven totdat op de aanvraag is beslist;

      g. in afwachting van de beslissing op een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de
      [artikelen 20][ref7] en [33][ref8], of tot het verlengen van de geldigheidsduur van de verblijfsvergunning, bedoeld
      in de [artikelen 14][ref9] en [28][ref10], of een wijziging ervan, terwijl bij of krachtens deze wet of op grond
      van een rechterlijke beslissing uitzetting van de aanvrager achterwege dient te blijven totdat op de aanvraag is
      beslist;

      h. in afwachting van de beslissing op een bezwaarschrift of een beroepschrift, terwijl bij of krachtens deze wet
      of op grond van een rechterlijke beslissing uitzetting van de aanvrager achterwege dient te blijven totdat op het
      bezwaarschrift of het beroepschrift is beslist;

      i. gedurende de vrije termijn, bedoeld in [artikel 12][ref11], zolang het verblijf van de vreemdeling bij of
      krachtens [artikel 12][ref12] is toegestaan;

      j. indien tegen de uitzetting beletselen bestaan als bedoeld in [artikel 64][ref13];

      k. gedurende de periode waarin de vreemdeling door Onze Minister in de gelegenheid wordt gesteld aangifte te doen
      van overtreding van [artikel 273f van het Wetboek van Strafrecht][ref14];

      l. indien de vreemdeling verblijfsrecht ontleent aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;

      m. in afwachting van de indiening van een aanvraag tot het verlenen van een verblijfsvergunning, bedoeld in
      [artikel 28][ref15], voor zover die vreemdeling overeenkomstig bij of krachtens algemene maatregel van bestuur te
      stellen regels te kennen heeft gegeven die aanvraag in te willen dienen en bij of krachtens algemene maatregel van
      bestuur daartoe een termijn is gesteld.


