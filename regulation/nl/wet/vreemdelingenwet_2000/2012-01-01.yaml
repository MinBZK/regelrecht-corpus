  - number: '55'
    text: |-
      1 De vreemdeling die rechtmatig verblijf geniet op grond van [artikel 8, onder f][ref1], dient zich, in verband met
      het onderzoek naar de inwilligbaarheid van de aanvraag om een verblijfsvergunning beschikbaar te houden op een door
      Onze Minister aangewezen plaats, overeenkomstig hem daartoe door de bevoegde autoriteit gegeven aanwijzingen.

      2 Ter ondersteuning van het onderzoek of een aanvraag tot het verlenen van de verblijfsvergunning als bedoeld
      in [artikel 28][ref2] kan worden ingewilligd, zijn de ambtenaren belast met de grensbewaking en de ambtenaren
      belast met het toezicht op vreemdelingen bevoegd om een vreemdeling staande te houden en aan diens kleding of
      lichaam te onderzoeken, alsmede zijn bagage te doorzoeken met het oog op eventuele aanwezigheid van reis- of
      identiteitspapieren, documenten of bescheiden, die noodzakelijk zijn voor de beoordeling van zijn aanvraag. Gelijke
      bevoegdheid bestaat indien de vreemdeling te kennen geeft een aanvraag te willen indienen.

      3 De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      een vreemdeling die zich in verband met het onderzoek op een plaats als bedoeld in het eerste lid bevindt, dan wel
      een vreemdeling die zich in een verwijdercentrum bevindt, aan diens kleding of lichaam te onderzoeken, alsmede zijn
      bagage te doorzoeken met het oog op de veiligheid op die plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
