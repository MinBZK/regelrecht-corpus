  - number: '78'
    text: |-
      Indien een verzoek om een voorlopige voorziening is gedaan teneinde uitzetting te voorkomen voordat is beslist
      op het bezwaar of het administratief beroep, dat is gericht tegen de beschikking tot afwijzing van de aanvraag of
      intrekking van de verblijfsvergunning, beslist de voorzieningenrechter van de rechtbank zoveel mogelijk tevens over
      dat bezwaar of administratief beroep.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel78
  - number: '79'
    text: |-
      1 Deze afdeling is slechts van toepassing indien beroep wordt ingesteld tegen een besluit omtrent een
      verblijfsvergunning als bedoeld in de [artikelen 28][ref1] en [33][ref2], of tegen een besluit omtrent tijdelijke
      bescherming of toepassing van [artikel 45, vierde lid][ref3], indien de vreemdeling in de gelegenheid is gesteld
      zijn zienswijze over het voornemen van dat besluit te geven.

      2 Deze afdeling is van overeenkomstige toepassing indien beroep wordt ingesteld tegen een besluit als bedoeld in de
      [artikelen 43][ref4] en [45, vierde lid][ref5].

      3 Deze afdeling is van overeenkomstige toepassing indien in de voornemenprocedure, bedoeld in de
      [artikelen 39][ref6] en [41][ref7], de vreemdeling tevens in de gelegenheid is gesteld om zijn zienswijze te geven
      over het voornemen niet ambtshalve een verblijfsvergunning als bedoeld in [artikel 14][ref8] te verlenen dan wel
      over het voornemen om de uitzetting niet op grond van [artikel 64][ref9] achterwege te laten.


