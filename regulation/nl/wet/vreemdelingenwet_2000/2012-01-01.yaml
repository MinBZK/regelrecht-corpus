      b) het betrokken derde land de vreemdeling niet tot zijn grondgebied heeft toegelaten, en

      c) de vreemdeling wederom een aanvraag indient tot het verlenen van een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 28][ref5].

