  - number: '12'
    text: |-
      1 Het is aan de vreemdeling die bij binnenkomst heeft voldaan aan de verplichtingen waaraan een persoon bij
      grensoverschrijding is onderworpen, gedurende een bij algemene maatregel van bestuur te bepalen termijn toegestaan
      in Nederland te verblijven, zolang hij:

      a. de bij of krachtens deze wet gestelde regels in acht neemt;

      b. beschikt over voldoende middelen om te voorzien zowel in de kosten van zijn verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is;

      c. geen arbeid voor een werkgever verricht in strijd met de [Wet arbeid vreemdelingen][ref1];

      d. geen gevaar oplevert voor de openbare orde of de nationale veiligheid.

      2 De termijn, bedoeld in het eerste lid, wordt ten hoogste op zes maanden bepaald. Voor bij algemene maatregel van
      bestuur te onderscheiden categorieën van vreemdelingen kunnen verschillende termijnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: '13'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning wordt slechts ingewilligd indien:

      a. internationale verplichtingen daartoe nopen;

      b. met de aanwezigheid van de vreemdeling een wezenlijk Nederlands belang is gediend, of

      c. klemmende redenen van humanitaire aard daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel13
  - number: '14'
    text: |-
      1 Onze Minister is bevoegd:

      a. de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;

      b. de aanvraag tot het verlengen van de geldigheidsduur ervan in te willigen, af te wijzen dan wel niet in
      behandeling te nemen;

      c. een verblijfsvergunning voor bepaalde tijd te wijzigen, hetzij op aanvraag van de houder van de vergunning
      hetzij ambtshalve wegens veranderde omstandigheden;

      d. een verblijfsvergunning voor bepaalde tijd in te trekken;

      e. ambtshalve een verblijfsvergunning voor bepaalde tijd te verlenen.

      2 Een verblijfsvergunning voor bepaalde tijd wordt verleend onder beperkingen, verband houdende met het doel
      waarvoor het verblijf is toegestaan. Aan de vergunning kunnen voorschriften worden verbonden. Bij of krachtens
      algemene maatregel van bestuur kunnen regels worden gesteld over de beperkingen en voorschriften.

      3 De verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur worden regels gesteld over de geldigheidsduur van de verblijfsvergunning en de
      verlenging van de geldigheidsduur van de verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel14
  - number: '15'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in [artikel 14, tweede lid][ref1], wordt bepaald, dat de
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14][ref2], kan worden verleend onder een beperking
      verband houdende met gezinshereniging en gezinsvorming aan gezinsleden van Nederlanders en vreemdelingen die
      rechtmatig verblijven als bedoeld in [artikel 8, onder a tot en met e en l][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
