  - number: '34'
    text: |-
      1 De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1]
      van de vreemdeling die direct voorafgaande aan de aanvraag, gedurende vijf achtereenvolgende jaren rechtmatig
      verblijf heeft genoten als bedoeld in [artikel 8, onder c][ref2], kan slechts worden afgewezen indien
      zich op het moment waarop de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28][ref3], afloopt, een grond als bedoeld in [artikel 32][ref4] voordoet, dan wel indien de vreemdeling
      het inburgeringsexamen, bedoeld in [artikel 13 van de Wet inburgering][ref5], niet heeft behaald.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het
      inburgeringsvereiste, bedoeld in het eerste lid.


