        artikel: '3'
  - number: '47'
    text: |-
      1 Met het toezicht op de naleving van de wettelijke voorschriften met betrekking tot vreemdelingen zijn belast:

      a. de ambtenaren van politie als bedoeld in
      [artikel 3, eerste lid, onder a en c, en tweede lid, van de Politiewet 1993][ref1];

      b. de ambtenaren van de Koninklijke marechaussee;

      c. de bij besluit van Onze Minister aangewezen ambtenaren.

      2 De ambtenaren van politie als bedoeld in
      [artikel 3, eerste lid, onder a en c, en tweede lid, van de Politiewet 1993][ref2] oefenen het toezicht op
      vreemdelingen uit onder leiding van de korpschef.

      3 De ambtenaren van de Koninklijke marechaussee oefenen het toezicht op vreemdelingen uit onder leiding van de
      Commandant der Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel3
