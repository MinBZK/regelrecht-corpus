  - number: '16'
    text: |-
      1 Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      kan worden afgewezen indien:

      a. de vreemdeling niet beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het
      verblijfsdoel waarvoor de verblijfsvergunning is aangevraagd;

      b. de vreemdeling niet beschikt over een geldig document voor grensoverschrijding;

      c. de vreemdeling niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan dan wel, indien de
      persoon bij wie de vreemdeling wil verblijven, niet zelfstandig en duurzaam beschikt over voldoende middelen van
      bestaan;

      d. de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;

      e. de vreemdeling niet bereid is om medewerking te verlenen aan een medisch onderzoek naar een ziekte aangewezen
      bij of krachtens de Infectieziektewet, ter bescherming van de volksgezondheid of een medische behandeling tegen een
      dergelijke ziekte te ondergaan;

      f. de vreemdeling voor een werkgever arbeid verricht, zonder dat aan de [Wet arbeid vreemdelingen][ref2] is
      voldaan;

      g. de vreemdeling niet voldoet aan de beperking, verband houdende met het doel waarvoor hij wil verblijven;

      h. de vreemdeling, die niet behoort tot een der categorieën, bedoeld in [artikel 17, eerste lid][ref3], na
      verkrijging van rechtmatig verblijf in Nederland inburgeringsplichtig zou zijn op grond van de [artikelen 3][ref4]
      en [5 van de Wet inburgering][ref5] en niet beschikt over kennis op basisniveau van de Nederlandse taal en de
      Nederlandse maatschappij.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.

      3 Het eerste lid, onder h, is niet van toepassing op de vreemdeling die de Surinaamse nationaliteit bezit en die
      met bij ministeriële regeling vastgestelde bescheiden heeft aangetoond in Suriname of Nederland lager onderwijs in
      de Nederlandse taal te hebben gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
