  - number: '22'
    text: |-
      1 De verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1] kan worden ingetrokken of
      gewijzigd, indien:

      a. de vreemdeling een aaneengesloten periode van twaalf maanden of langer buiten het grondgebied van de staten die
      partij zijn bij het Verdrag tot oprichting van de Europese Gemeenschap, dan wel zes jaar of langer buiten Nederland
      heeft verbleven;

      b. de verblijfsvergunning op frauduleuze wijze is verkregen;

      c. de vreemdeling een actuele en ernstige bedreiging voor de openbare orde of de nationale veiligheid vormt.

      2 De verblijfsvergunning wordt ingetrokken, indien de vreemdeling langdurig ingezetene is geworden in een andere
      staat die partij is bij het Verdrag tot oprichting van de Europese Gemeenschap.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van de
      gronden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
