  - number: '2'
    text: |-
      1 Er is een Adviescommissie voor vreemdelingenzaken.

      2 De commissie bestaat uit ten minste zeven leden. Ambtenaren die werkzaam zijn bij een ministerie of een daaronder
      ressorterende instelling, dienst of bedrijf, dan wel anderszins werkzaamheden verrichten in ondergeschiktheid aan
      Onze Ministers, worden niet tot lid benoemd.

      3 Als voorzitter wordt bij voorkeur een rechterlijk ambtenaar met rechtspraak belast benoemd.

      4 De commissie heeft tot taak Onze Minister te adviseren over het vreemdelingenrecht en het beleid ter zake,
      waaronder begrepen wijzigingen van deze wet.

      5 Bij algemene maatregel van bestuur worden regels gesteld over de inrichting en de werkwijze van de commissie.

      6 De commissie is bevoegd bij een ieder schriftelijk of mondeling de inlichtingen in te winnen welke zij voor de
      vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel2
  - number: '3'
    text: |-
      1 In andere dan de in de Schengengrenscode geregelde gevallen, wordt toegang tot Nederland geweigerd aan de
      vreemdeling die:

      a. niet in het bezit is van een geldig document voor grensoverschrijding, dan wel in het bezit is van een document
      voor grensoverschrijding waarin het benodigde visum ontbreekt;

      b. een gevaar oplevert voor de openbare orde of nationale veiligheid;

      c. niet beschikt over voldoende middelen om te voorzien zowel in de kosten van verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is, of

      d. niet voldoet aan de voorwaarden die bij of krachtens algemene maatregel van bestuur zijn gesteld.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de weigering van toegang op grond van
      deze wet of ter uitvoering van de Schengengrenscode.

      3 De ambtenaren belast met de grensbewaking weigeren niet dan ingevolge een bijzondere aanwijzing van Onze Minister
      de toegang aan de vreemdeling die te kennen geeft dat hij asiel wenst.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel3
  - number: '4'
    text: |-
      1 De vervoerder door wiens tussenkomst de vreemdeling aan een buitengrens of binnen het grondgebied van
      Nederland wordt gebracht, neemt de nodige maatregelen en houdt het toezicht dat redelijkerwijs van hem kan worden
      gevorderd om te voorkomen dat door de vreemdeling niet wordt voldaan aan artikel 5, eerste lid, onder a, van de
      Schengengrenscode of aan [artikel 3, eerste lid, onder a][ref1], van deze wet.

      2 De vervoerder kan worden verplicht om een afschrift te nemen van het op de vreemdeling betrekking hebbende
      document voor grensoverschrijding en dit ter hand te stellen aan de ambtenaren belast met de grensbewaking.

      3 De vervoerder, bedoeld in het eerste lid, kan ten behoeve van de grensbewaking en het tegengaan van illegale
      immigratie worden verplicht passagiersgegevens te verzamelen en te verstrekken aan de ambtenaren belast met de
      grensbewaking.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      tot en met het derde lid.

      5 Het eerste tot en met het derde lid zijn ook van toepassing op iedere vervoerder die zich buiten Nederland
      schuldig maakt aan schending van de in die leden bedoelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel4
