  - number: '18'
    text: |-
      1 Een aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd als bedoeld
      in [artikel 14][ref1] kan worden afgewezen indien:

      a. de houder daarvan zijn hoofdverblijf buiten Nederland heeft gevestigd;

      b. de vreemdeling niet beschikt over een geldig document voor grensoverschrijding;

      c. de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid;

      d. de vreemdeling niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan dan wel de persoon
      bij wie de vreemdeling verblijft niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;

      e. de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;

      f. niet wordt voldaan aan de beperking waaronder de vergunning is verleend of een voorschrift dat aan de vergunning
      is verbonden;

      g. de vreemdeling voor een werkgever arbeid verricht, zonder dat aan de [Wet arbeid vreemdelingen][ref2] is
      voldaan.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007149
