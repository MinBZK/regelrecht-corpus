  - number: '115'
    text: |-
      1 Een op het tijdstip van inwerkingtreding van deze wet geldige verblijfstitel wordt op dat tijdstip met
      inachtneming van het tweede tot en met zevende lid van rechtswege aangemerkt als een verblijfsvergunning op grond
      van deze wet.

      2 Een vergunning tot verblijf met beperkingen, wordt, onder handhaving van de beperkingen en de geldigheidsduur,
      aangemerkt als een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1].

      3 Een vergunning tot vestiging wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20][ref2].

      4 Een vergunning tot verblijf zonder beperkingen wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd.

      5 Een toelating krachtens artikel 10, tweede lid, van de Vreemdelingenwet zoals dit luidde voor het tijdstip van
      inwerkingtreding van deze wet, wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20][ref3].

      6 Een voorwaardelijke vergunning tot verblijf wordt, onder handhaving van de geldigheidsduur, aangemerkt als een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref4].

      7 Een toelating als vluchteling wordt aangemerkt als een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 33][ref5].


