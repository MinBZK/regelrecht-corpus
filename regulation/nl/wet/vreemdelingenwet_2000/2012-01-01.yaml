      In afwijking van [artikel 47, eerste lid, van de Wet op de Raad van State][ref1] staat geen hoger beroep open tegen
      een uitspraak van de rechtbank of van de voorzieningenrechter van de rechtbank:

      a. over een besluit of handeling op grond van [artikel 6, eerste lid][ref2], [hoofdstuk 4][ref3] of
      [hoofdstuk 5][ref4];

      b. over een visum voor een verblijf van drie maanden of minder;

      c. na toepassing van [artikel 78][ref5], of

      d. over de toekenning van de vergoeding, bedoeld in [artikel 106][ref6].


