  - number: '45'
    text: |-
      1 De beschikking waarbij een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 28][ref1], of voor onbepaalde tijd, bedoeld in [artikel 33][ref2], wordt afgewezen, geldt als
      terugkeerbesluit, tenzij reeds eerder een terugkeerbesluit tegen de vreemdeling is uitgevaardigd en aan de daaruit
      voortvloeiende terugkeerverplichting niet is voldaan, en heeft van rechtswege tot gevolg dat:

      a. de vreemdeling niet langer rechtmatig in Nederland verblijft tenzij een andere rechtsgrond voor rechtmatig
      verblijf als bedoeld in [artikel 8][ref3] van toepassing is;

      b. de vreemdeling Nederland uit eigen beweging dient te verlaten binnen de in [artikel 62][ref4] gestelde termijn,
      bij gebreke waarvan de vreemdeling kan worden uitgezet;

      c. de verstrekkingen voorzien bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref5] of een ander
      wettelijk voorschrift dat soortgelijke verstrekkingen regelt worden beëindigd op de bij of krachtens die wet of dat
      wettelijke voorschrift voorziene wijze en binnen de daartoe gestelde termijn;

      d. de ambtenaren belast met het toezicht op vreemdelingen na ommekomst van de termijn waarbinnen de vreemdeling
      Nederland uit eigen beweging dient te verlaten, bevoegd zijn elke plaats te betreden, daaronder begrepen een woning
      zonder toestemming van de bewoner, teneinde de vreemdeling uit te zetten;

      e. de ambtenaren belast met het toezicht op vreemdelingen bevoegd zijn na ommekomst van de termijn als bedoeld in
      onderdeel c een onroerende zaak gedwongen te ontruimen teneinde het onderdak of het verblijf in de woonruimte als
      verstrekking geboden, bedoeld in onderdeel c, te beëindigen.

      2 Het eerste lid is van overeenkomstige toepassing indien:

      a. ingevolge [artikel 4:5 van de Algemene wet bestuursrecht][ref6] is besloten dat de aanvraag niet in behandeling
      wordt genomen, of

      b. een verblijfsvergunning is ingetrokken of niet verlengd.

      3 De in het eerste lid bedoelde gevolgen van de beschikking treden niet in zolang het beroep van de vreemdeling de
      werking van de beschikking opschort.

      4 Onze Minister kan besluiten dat, in afwijking van het eerste lid, aanhef en onder c, de verstrekkingen voorzien
      bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref7] of een ander wettelijk voorschrift dat
      soortgelijke verstrekkingen regelt, voor bepaalde categorieën vreemdelingen niet worden beëindigd, of voor de duur
      van het besluit opnieuw worden verleend. Het besluit wordt uiterlijk één jaar na de bekendmaking ervan ingetrokken.
      Na afloop van de duur van het besluit treden de opgeschorte rechtsgevolgen opnieuw in.

      5 De vreemdeling op wie het besluit als bedoeld in het vierde lid van toepassing is, wordt geacht rechtmatig
      verblijf als bedoeld in [artikel 8, onder j][ref8], te hebben.

      6 De in het eerste lid bedoelde gevolgen van de beschikking treden niet in zolang de uitzetting van de vreemdeling
      op grond van de richtlijn tijdelijke bescherming achterwege blijft. De reeds ingetreden gevolgen worden opgeschort,
      indien Onze Minister heeft vastgesteld dat uitzetting op grond van de richtlijn tijdelijke bescherming achterwege
      blijft. De opgeschorte gevolgen, bedoeld in het eerste lid, treden opnieuw in na afloop van de tijdelijke
      bescherming.

      7 Het verblijf van de vreemdeling, bedoeld in het zesde lid, wordt gelijkgesteld met rechtmatig verblijf in de zin
      van [artikel 8, onder f][ref9].

      8 De beschikking, bedoeld in het eerste lid, kan tevens een inreisverbod inhouden.


