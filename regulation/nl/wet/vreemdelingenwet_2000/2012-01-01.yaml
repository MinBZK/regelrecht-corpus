  - number: '27'
    text: |-
      1 De beschikking waarbij een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 14][ref1] of een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref2]
      wordt afgewezen, geldt als terugkeerbesluit, tenzij reeds eerder een terugkeerbesluit tegen de vreemdeling is
      uitgevaardigd en aan de daaruit voortvloeiende terugkeerverplichting niet is voldaan, en heeft van rechtswege tot
      gevolg dat:

      a. de vreemdeling niet langer rechtmatig verblijf heeft tenzij er een andere rechtsgrond voor rechtmatig verblijf
      van toepassing is;

      b. de vreemdeling Nederland uit eigen beweging dient te verlaten binnen de in [artikel 62][ref3] gestelde termijn,
      bij gebreke waarvan de vreemdeling kan worden uitgezet, en

      c. de ambtenaren belast met het toezicht op vreemdelingen, na ommekomst van de termijn waarbinnen de vreemdeling
      Nederland uit eigen beweging dient te verlaten, bevoegd zijn elke plaats te betreden, daaronder begrepen een
      woning, zonder de toestemming van de bewoner, teneinde de vreemdeling uit te zetten.

      2 Het eerste lid is van overeenkomstige toepassing indien:

      a. ingevolge [artikel 24][ref4] of ingevolge [artikel 4:5 van de Algemene wet bestuursrecht][ref5] is besloten dat
      de aanvraag niet in behandeling wordt genomen;

      b. het rechtmatig verblijf van rechtswege is geëindigd;

      c. een verblijfsvergunning is ingetrokken of de geldigheidsduur ervan niet is verlengd.

      3 De gevolgen, bedoeld in het eerste lid, treden niet in indien de vreemdeling bezwaar of beroep heeft ingesteld en
      de werking van de beschikking is opgeschort.

      4 De beschikking, bedoeld in het eerste lid, kan tevens een inreisverbod inhouden.


