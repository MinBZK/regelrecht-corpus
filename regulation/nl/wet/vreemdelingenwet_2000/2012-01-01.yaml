    text: |-
      1 Onze Minister kan op aanvraag van de vreemdeling besluiten tot opheffing van de ongewenstverklaring.

      2 De ongewenstverklaring wordt opgeheven indien de vreemdeling tien jaren onafgebroken buiten Nederland verblijf
      heeft gehad en zich in die periode geen van de gronden, bedoeld in [artikel 67, eerste lid][ref1], hebben
      voorgedaan.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de toepassing van deze
      afdeling.


