  - number: '48'
    text: |-
      1 De korpschef en de Commandant der Koninklijke marechaussee geven Onze Minister door hem gevraagde inlichtingen
      over de uitvoering van deze wet en van de Schengengrenscode.

      2 Onze Minister kan aan de korpschef en aan de Commandant der Koninklijke marechaussee aanwijzingen geven over
      de uitvoering van deze wet en van de Schengengrenscode. Onze Minister kan individuele aanwijzingen geven aan de
      ambtenaren, bedoeld in [artikel 47, eerste lid][ref1].

      3 Onze Minister kan aanwijzingen geven over de inrichting van de werkprocessen en bedrijfsvoering aan:

      a. de korpschef, door tussenkomst van de beheerder van het regionale politiekorps;

      b. de Commandant der Koninklijke marechaussee, door tussenkomst van de Minister van Defensie.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel47
