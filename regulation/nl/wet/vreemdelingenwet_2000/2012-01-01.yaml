  - number: '31'
    text: |-
      1 Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]
      wordt afgewezen indien de vreemdeling niet aannemelijk heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden
      die, hetzij op zich zelf, hetzij in verband met andere feiten, een rechtsgrond voor verlening vormen.

      2 Bij het onderzoek naar de aanvraag wordt mede betrokken de omstandigheid dat:

      a. de vreemdeling reeds eerder, onder een andere naam, een aanvraag voor een verblijfsvergunning in Nederland heeft
      ingediend;

      b. de vreemdeling zonder geldige reden niet heeft voldaan aan de aanwijzingen, bedoeld in [artikel 55][ref2];

      c. de vreemdeling niet beschikt over een voor toegang tot Nederland vereist document voor grensoverschrijding,
      tenzij hij zich onverwijld onder opgave van de plaats waar of waarlangs hij Nederland is binnengekomen heeft
      vervoegd bij een ambtenaar, belast met de grensbewaking of het toezicht op vreemdelingen, en daar kenbaar heeft
      gemaakt dat hij asiel wenst;

      d. de vreemdeling ter staving van zijn aanvraag valse of vervalste reis- of identiteitspapieren dan wel andere
      bescheiden heeft overgelegd en, hoewel daaromtrent ondervraagd, opzettelijk de echtheid daarvan heeft volgehouden;

      e. de vreemdeling ter staving van zijn aanvraag opzettelijk reis- of identiteitspapieren dan wel andere bescheiden
      heeft overgelegd die niet op hem betrekking hebben;

      f. de vreemdeling ter staving van zijn aanvraag geen reis- of identiteitspapieren dan wel andere bescheiden kan
      overleggen die noodzakelijk zijn voor de beoordeling van zijn aanvraag, tenzij de vreemdeling aannemelijk kan maken
      dat het ontbreken van deze bescheiden niet aan hem is toe te rekenen;

      g. de vreemdeling afkomstig is uit een land dat partij is bij het Vluchtelingenverdrag en één van de andere in
      [artikel 30, onder d][ref3], bedoelde verdragen en de vreemdeling niet aannemelijk heeft gemaakt dat het die
      verdragsverplichtingen ten aanzien van hem niet nakomt;

      h. de vreemdeling heeft verbleven in een derde land dat partij is bij het Vluchtelingenverdrag en één van de
      in [artikel 30, onder d][ref4], bedoelde verdragen en de vreemdeling niet aannemelijk heeft gemaakt dat het die
      verdragsverplichtingen ten aanzien van hem niet nakomt;

      i. de vreemdeling in een land van eerder verblijf zal worden toegelaten totdat hij elders duurzame bescherming zal
      hebben gevonden;

      j. de vreemdeling elders een verblijfsalternatief heeft omdat hij voorafgaand aan zijn komst naar Nederland heeft
      verbleven in een ander land dan het land van herkomst;

      k. de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;

      l. de vreemdeling afkomstig is uit een land dat ingevolge artikel 29 van de richtlijn asielprocedures door de Raad
      is opgenomen in de in dat artikel bedoelde gemeenschappelijke minimumlijst van derde landen die als veilig land van
      herkomst worden beschouwd.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid en
      het tweede lid, onder g tot en met l.


