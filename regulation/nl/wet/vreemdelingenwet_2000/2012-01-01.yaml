  - number: '60'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven omtrent de toepassing van dit
      hoofdstuk. Daarbij kan worden voorzien in de mogelijkheid van verhaal van de kosten van bewaring op de vreemdeling
      zelf en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel60
  - number: '61'
    text: |-
      1 De vreemdeling die niet of niet langer rechtmatig verblijf heeft, dient Nederland uit eigen beweging te verlaten
      binnen de in [artikel 62][ref1] bepaalde termijn.

      2 Indien de werking van de beschikking, waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken,
      is opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van het vertrek uit
      Nederland.

      3 Het indienen van een klacht als bedoeld in[ artikel 9:1 van de Algemene wet bestuursrecht][ref2] schort de
      verplichting, bedoeld in het eerste lid, niet op.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
