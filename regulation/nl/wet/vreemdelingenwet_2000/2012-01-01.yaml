  - number: '23'
    text: |-
      De aanvraag tot het verlenen van:

      a. een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1], tot het verlengen van de
      geldigheidsduur of tot het wijzigen ervan;

      b. een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref2], of tot het wijzigen ervan,

      wordt, in afwijking van [artikel 2:1, eerste lid, van de Algemene wet bestuursrecht][ref3], ingediend door de
      vreemdeling of zijn wettelijke vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
