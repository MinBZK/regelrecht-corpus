  - number: '69'
    text: |-
      1 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een bezwaar- of beroepschrift vier weken.

      2 In afwijking van het eerste lid bedraagt de beroepstermijn één week, indien de aanvraag tot het verlenen
      van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref2] is afgewezen binnen een bij
      algemene maatregel van bestuur te bepalen aantal dagen, dat niet de dagen omvat die gemoeid zijn met het aan de
      asielaanvraag voorafgaande onderzoek naar de identiteit, vingerafdrukken en nationaliteit van de vreemdeling,
      naar de bij hem aangetroffen of door hem overgelegde documenten en bescheiden, dan wel naar de vraag of
      [artikel 30, eerste lid, aanhef en onder a][ref3], kan worden toegepast.

      3 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref4] is het instellen van beroep als bedoeld
      in de [artikelen 94][ref5] en [96][ref6] tegen een besluit als bedoeld in [artikel 93][ref7] niet aan enige termijn
      gebonden. De termijn voor het instellen van het hoger beroep, bedoeld in [artikel 95][ref8], bedraagt één week.


