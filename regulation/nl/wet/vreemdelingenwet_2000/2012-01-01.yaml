  - number: 21a
    text: |-
      1 Ter uitvoering van artikel 13 van de [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de Europese Unie van
      25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU 2004, L16) wordt
      de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1]
      niet afgewezen op de grond, bedoeld in [artikel 21, eerste lid, onder d][ref2], indien:

      a. de vreemdeling gedurende een tijdvak van tien aaneengesloten jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, of l][ref3], heeft gehad, of

      b. de vreemdeling als minderjarige onder een beperking verband houdend met gezinshereniging rechtmatig verblijf
      heeft gehad, sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is, tenzij de
      gezinsband werd verbroken binnen een jaar na verlening van de verblijfvergunning, bedoeld in [artikel 14][ref4].

      2 Indien de vreemdeling in Nederland is geboren dan wel reeds voor zijn vierde levensjaar in Nederland
      verbleef en sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is, kan de
      aanvraag slechts worden afgewezen op grond van [artikel 21, eerste lid, onder e en f][ref5]. In afwijking van
      [artikel 21, eerste lid, onder a][ref6], behoeft het rechtmatig verblijf niet aaneengesloten te zijn. De aanvraag
      kan slechts op grond van [artikel 21, eerste lid, onder e][ref7], worden afgewezen, indien de vreemdeling bij
      onherroepelijk geworden rechterlijk vonnis is veroordeeld tot een gevangenisstraf van meer dan 60 maanden wegens
      handel in verdovende middelen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen andere gevallen dan bedoeld in het eerste en tweede lid
      worden aangewezen waarin een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref8] kan worden
      verleend.


