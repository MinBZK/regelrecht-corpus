  - number: '108'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van de tweede categorie wordt gestraft overtreding
      van bij ministeriële regeling aan te wijzen voorschriften vastgesteld bij of krachtens de Schengengrenscode,
      overtreding van een voorschrift, vastgesteld bij of krachtens de [artikelen 5, eerste en tweede lid][ref1],
      [46, tweede lid, aanhef, en onder b][ref2], alsmede handelen in strijd met [artikel 56, eerste lid][ref3], dan wel
      handelen in strijd met een verplichting opgelegd bij of krachtens de [artikelen 6, eerste lid][ref4], [54][ref5],
      [55][ref6], [57, eerste lid][ref7], [58, eerste lid][ref8], of [65, derde lid][ref9].

      2 Overtreding van een voorschrift, vastgesteld bij of krachtens [artikel 4, eerste tot en met derde lid][ref10],
      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.

      3 De in het eerste en tweede lid strafbaar gestelde feiten worden beschouwd als overtredingen.

      4 Met de opsporing van de in het eerste lid strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref11], belast de ambtenaren belast met de grensbewaking en
      ambtenaren belast met het vreemdelingentoezicht. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref12] en [184 van het Wetboek van Strafrecht][ref13], voor
      zover deze feiten betrekking hebben op een aanwijzing, vordering of handeling, gedaan of ondernomen door henzelf.

      5 In afwijking van het eerste lid wordt handelen in strijd met een verplichting, opgelegd bij of krachtens
      [artikel 54, eerste lid, onder b of e][ref14], gestraft met ten hoogste een hechtenis van een maand of een
      geldboete van de tweede categorie, indien het feit wordt begaan door een gemeenschapsonderdaan. Het derde lid en de
      eerste volzin van het vierde lid zijn van overeenkomstige toepassing.

      6 Het eerste lid is van overeenkomstige toepassing ten aanzien van de vreemdeling die in Nederland verblijft
      terwijl hij weet of ernstige reden heeft te vermoeden dat tegen hem een inreisverbod is uitgevaardigd, indien het
      inreisverbod is gegeven anders dan met toepassing van [artikel 66a, zevende lid][ref15]. Het derde lid en de eerste
      volzin van het vierde lid zijn eveneens van overeenkomstige toepassing.


