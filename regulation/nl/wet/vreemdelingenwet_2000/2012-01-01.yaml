      1 In aanvulling op [artikel 6:5, onderdeel d, van de Algemene wet bestuursrecht][ref1] bevat het beroepschrift een
      of meer grieven tegen de uitspraak van de rechtbank of de voorzieningenrechter van de rechtbank.

      2 Een grief omschrijft het onderdeel van de uitspraak waarmee de indiener zich niet kan verenigen alsmede de
      gronden waarop de indiener zich daarmee niet kan verenigen.

      3 Indien niet is voldaan aan het eerste of tweede lid, aan [artikel 6:5 van de Algemene wet bestuursrecht][ref2]
      of aan enig ander bij de wet gesteld vereiste voor het in behandeling nemen van het hoger beroep, wordt het hoger
      beroep niet-ontvankelijk verklaard. [Artikel 6:6 van de Algemene wet bestuursrecht][ref3] is niet van toepassing,
      indien niet is voldaan aan de vereisten genoemd in artikel 6:5, eerste lid, onder c en d, of aan het eerste lid of
      tweede lid van dit artikel


