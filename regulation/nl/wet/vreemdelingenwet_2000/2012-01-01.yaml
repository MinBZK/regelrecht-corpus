  - number: 9a
    text: |-
      In afwijking van [artikel 9, tweede lid][ref1], verschaft Onze Minister aan de vreemdeling die rechtmatig
      verblijf heeft op grond van [artikel 8, onder e][ref2], en gemeenschapsonderdaan is als bedoeld in
      [artikel 1, onder e, sub 1°, 3° en 5°][ref3], op aanvraag een bewijs van rechtmatig verblijf voordat de
      vreemdeling het duurzame verblijfsrecht heeft verkregen, indien de vreemdeling de nationaliteit heeft van een
      lidstaat ten aanzien waarvan Nederland de toepassing van de artikelen 1 tot en met 6 van [Verordening (EEG) nr.
      1612/68](31968R1612) van de Raad van de Europese Gemeenschappen van 15 oktober 1968 betreffende het vrije verkeer
      van werknemers binnen de Gemeenschap (PbEG L 257) heeft opgeschort.


