  - number: '37'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de wijze van indiening en behandeling van een aanvraag;

      b. de wijze waarop het onderzoek naar de aanvraag, daaronder begrepen het horen van de vreemdeling, wordt
      ingericht;

      c. de gegevens die de vreemdeling in persoon moet verstrekken;

      d. de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede de bij
      of krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling of aan andere
      belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van beschikkingen ook kan
      geschieden door middel van het toezenden of uitreiken van een document en door het stellen van aantekeningen in een
      daarbij aan te wijzen document.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel37
  - number: '38'
    text: |-
      Indien de vreemdeling in de gelegenheid wordt gesteld zich omtrent de aanvraag tot het verlenen van een
      verblijfsvergunning of het verlengen van de geldigheidsduur ervan te doen horen, wordt de vreemdeling gehoord in
      een taal waarvan redelijkerwijze kan worden aangenomen dat hij die kan verstaan.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel38
  - number: '39'
    text: |-
      1 Indien Onze Minister voornemens is de aanvraag tot het verlenen van een verblijfsvergunning of het verlengen van
      de geldigheidsduur ervan af te wijzen, dan wordt de vreemdeling hiervan, onder opgave van redenen, schriftelijk
      mededeling gedaan. De mededeling kan eveneens betrekking hebben op het voornemen om niet ambtshalve een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] te verlenen dan wel op het voornemen om
      de uitzetting niet op grond van [artikel 64][ref2] achterwege te laten. Het schriftelijke voornemen wordt aan de
      vreemdeling meegedeeld door uitreiking of toezending ervan. De op de aanvraag betrekking hebbende stukken worden
      bij de schriftelijke mededeling gevoegd, voor zover de vreemdeling geen kennis kan hebben van de inhoud van deze
      stukken.

      2 De vreemdeling brengt zijn zienswijze, in afwijking van [artikel 4:9 van de Algemene wet bestuursrecht][ref3],
      schriftelijk naar voren binnen de door Onze Minister bepaalde redelijke termijn.

      3 Bij de algemene maatregel van bestuur, bedoeld in [artikel 37][ref4], worden regels gesteld omtrent de termijn,
      bedoeld in het tweede lid, alsmede de toepassing van de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
