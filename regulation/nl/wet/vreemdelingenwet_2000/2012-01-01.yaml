  - number: '117'
    text: |-
      1 Een op het tijdstip van inwerkingtreding van deze wet in behandeling zijnde aanvraag:

      a. tot verlening of verlenging van een vergunning tot verblijf,

      b. tot verlening van een vergunning tot vestiging, of

      c. tot toelating als vluchteling, wordt aangemerkt als een aanvraag tot verlening van een verblijfsvergunning op
      grond van deze wet.

      2 Op de behandeling van aanvragen als bedoeld in het eerste lid blijft het recht dat gold voor het tijdstip van
      inwerkingtreding van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel117
  - number: '118'
    text: |-
      1 Ten aanzien van de mogelijkheid om bezwaar te maken tegen een besluit op grond van de Vreemdelingenwet dat
      is bekendgemaakt, dan wel een handeling op grond van de Vreemdelingenwet die is verricht voor het tijdstip van
      inwerkingtreding van deze wet, blijft het recht zoals het gold voor dat tijdstip van toepassing.

      2 Op de behandeling van een bezwaarschrift tegen een besluit op grond van de Vreemdelingenwet dat is bekendgemaakt,
      dan wel een handeling op grond van de Vreemdelingenwet die is verricht voor het tijdstip van inwerkingtreding van
      deze wet, blijft het recht zoals het gold voor dat tijdstip van toepassing.

      3 Op de verplichting om de Adviescommissie voor vreemdelingenzaken te horen, is het tweede lid slechts van
      toepassing voorzover advisering ingevolge een verdrag of een Nederland bindend besluit van een volkenrechtelijke
      organisatie, dan wel ingevolge een onherroepelijk geworden rechterlijke uitspraak verplicht is.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel118
  - number: '119'
    text: |-
      1 Ten aanzien van de mogelijkheid om beroep in te stellen tegen een besluit op grond van de Vreemdelingenwet dat
      is bekendgemaakt, dan wel een handeling op grond van de Vreemdelingenwet die is verricht voor het tijdstip van
      inwerkingtreding van deze wet, blijft het recht zoals het gold voor dat tijdstip van toepassing.

      2 [Artikel 82][ref1] is niet van toepassing op een beroep tegen:

      a. een besluit als bedoeld in het eerste lid, of

      b. een op bezwaar genomen beslissing.

      3 Ten aanzien van de hoogte van het griffierecht voor een beroep of een verzoek om voorlopige voorziening tegen
      een besluit of handeling als bedoeld in het eerste lid, blijft het recht zoals dat gold voor het tijdstip van
      inwerkingtreding van deze wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel82
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '82'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '3'
  - number: '120'
    text: |-
      Hoger beroep als bedoeld in [artikel 84][ref1] kan slechts worden ingesteld tegen een uitspraak van de rechtbank of
      de voorzieningenrechter van de rechtbank over een besluit dat is bekendgemaakt na het tijdstip van inwerkingtreding
      van deze wet, met uitzondering van een beslissing op bezwaar gericht tegen een besluit bekendgemaakt voor
      inwerkingtreding van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel84
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '84'
        hoofdstuk: '7'
        afdeling: '4'
  - number: '121'
    text: |-
      1 [Afdeling 5 van hoofdstuk 7][ref1] is niet van toepassing op een maatregel strekkende tot vrijheidsbeperking op
      grond van de Vreemdelingenwet die is genomen voor het tijdstip van inwerkingtreding van deze wet. In plaats daarvan
      blijft het recht zoals het gold voor dat tijdstip van toepassing.

      2 Ten aanzien van de vreemdeling aan wie op het tijdstip van inwerkingtreding van deze wet zijn
      vrijheid is ontnomen, blijft het recht zoals het gold voor het tijdstip van inwerkingtreding van deze
      wet van toepassing tot op het tijdstip waarop voor de eerste maal een kennisgeving als bedoeld in
      [artikel 96, eerste lid, eerste volzin][ref2], wordt gedaan dan wel de vreemdeling zelf beroep heeft ingesteld.
      Daarbij geldt een uitspraak van de rechtbank gedaan op een beroep als bedoeld in artikel 7a, zesde en zevende
      lid, artikel 18b, derde en vierde lid, van de Vreemdelingenwet en artikel 34a, tweede lid, van de Vreemdelingenwet
      in verbinding met artikel 86 van het Vreemdelingenbesluit, dan wel een uitspraak gedaan op een beroep dat de
      vreemdeling zelf heeft ingesteld, als een uitspraak op een beroep als bedoeld in [artikel 94 van deze wet][ref3].
      Indien de vreemdeling geen beroep tegen de maatregel strekkende tot vrijheidsontneming heeft ingesteld, wordt de
      kennisgeving uiterlijk op de achtentwintigste dag na het tijdstip van inwerkingtreding van deze wet gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel94
