    text: |-
      1 Onze Minister kan ambtshalve of wegens gewijzigde omstandigheden dan wel op aanvraag van de vreemdeling besluiten
      tot opheffing of tijdelijke opheffing van het inreisverbod.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van deze
      afdeling.
