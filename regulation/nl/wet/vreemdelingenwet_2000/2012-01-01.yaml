  - number: '111'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels voor het geval van buitengewone omstandigheden worden gesteld, die
      afwijken van de [hoofdstukken 1 tot en met 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk1
