      1 De aanvraag wordt niet aangemerkt als herhaalde aanvraag als bedoeld in
      [artikel 4:6 van de Algemene wet bestuursrecht][ref1], indien:

      a) een eerdere aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28][ref2] is afgewezen op grond van [artikel 30, eerste lid, onder d][ref3], of met toepassing van
