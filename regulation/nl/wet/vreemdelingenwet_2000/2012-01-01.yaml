  - number: '44'
    text: |-
      1 Verlening van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1], die rechtmatig
      verblijf inhoudt, heeft van rechtswege tot gevolg de beëindiging van de verstrekkingen voorzien bij
      of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref2] of een ander wettelijk voorschrift dat
      soortgelijke verstrekkingen regelt. De verstrekkingen worden beëindigd op de wijze voorzien bij of krachtens
      de [Wet Centraal Orgaan opvang asielzoekers][ref3] of in het andere wettelijk voorschrift en binnen de daartoe
      gestelde termijn.

      2 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref4], wordt verleend met ingang van de datum
      waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet eerder dan met ingang van de
      datum waarop de aanvraag is ontvangen.

      3 De verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref5] wordt verleend met ingang van de
      datum waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet.

      4 Indien de vreemdeling de aanvraag tot verlenging van de verblijfsvergunning bedoeld in [artikel 28][ref6], dan
      wel de gegevens waaruit blijkt dat aan de voorwaarden wordt voldaan niet tijdig heeft ingediend en hem dit niet is
      toe te rekenen, kan de verblijfsvergunning worden verlengd met ingang van de dag na die waarop de geldigheidsduur
      van de verblijfsvergunning waarvoor verlenging is gevraagd afloopt. De voorgaande volzin is van overeenkomstige
      toepassing op de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33][ref7].


