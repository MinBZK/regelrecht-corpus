preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bestaande wetgeving betreffende de toelating en
    uitzetting van vreemdelingen, het toezicht op vreemdelingen die in Nederland verblijf houden, en de grensbewaking,
    te herzien en daartoe een nieuwe Vreemdelingenwet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. ambtenaren belast met de grensbewaking: de ambtenaren, bedoeld in [artikel 46][ref1];

      b. ambtenaren belast met het toezicht op vreemdelingen: de ambtenaren, bedoeld in [artikel 47][ref2];

      c. asiel: het verblijf van de vreemdeling in Nederland op de gronden, bedoeld in de [artikelen 29][ref3] en
      [34][ref4];

      d. buitengrenzen: de Nederlandse zeegrenzen, alsmede lucht- of zeehavens waar grenscontrole op personen wordt
      uitgeoefend;

      e. gemeenschapsonderdanen:

      1°. onderdanen van de lidstaten van de Europese Unie die op grond van het Verdrag tot oprichting van de Europese
      Gemeenschap gerechtigd zijn een andere lidstaat binnen te komen en er te verblijven;

      2°. familieleden van de onder 1° genoemden die de nationaliteit van een derde staat bezitten en die uit hoofde van
      een ter toepassing van het Verdrag tot oprichting van de Europese Gemeenschap genomen besluit gerechtigd zijn een
      lidstaat binnen te komen en er te verblijven;

      3°. onderdanen van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei
      1992, die ter zake van binnenkomst en verblijf in een lidstaat rechten genieten die gelijk zijn aan die van burgers
      van de lidstaten van de Europese Unie;

      4°. familieleden van de onder 3° genoemden die de nationaliteit van een derde staat bezitten en die krachtens
      bovengenoemde Overeenkomst gerechtigd zijn een lidstaat binnen te komen en er te verblijven;

      5°. onderdanen van de Zwitserse Bondsstaat, indien zij verblijven op grond van de op 21 juni 1999 te Luxemburg
      totstandgekomen Overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse
      Bondsstaat, anderzijds, over het vrije verkeer van personen (Trb. 2000, 16 en 86);

      6°. familieleden van de onder 5° genoemden die de nationaliteit van een derde staat bezitten en die krachtens de
      onder 5° genoemde Overeenkomst gerechtigd zijn een lidstaat binnen te komen en er te verblijven;

      f. herhaalde aanvraag: een aanvraag, die op grond van
      [artikel 4:6, tweede lid, van de Algemene wet bestuursrecht][ref5] kan worden afgewezen;

      g. de korpschef: de korpschef, bedoeld in [artikel 24 van de Politiewet 1993][ref6];

      h. machtiging tot voorlopig verblijf: het bij een Nederlandse diplomatieke of consulaire vertegenwoordiging in
      het land van herkomst, het land van bestendig verblijf of, bij gebreke daarvan, het dichtstbijzijnde land waar
      wel een vertegenwoordiging is gevestigd, dan wel bij het Kabinet van de Gouverneur van de Nederlandse Antillen
      of het Kabinet van de Gouverneur van Aruba aldaar, door de vreemdeling in persoon aangevraagde en aldaar door die
      vertegenwoordiging of dat Kabinet na voorafgaande machtiging van Onze Minister van Buitenlandse Zaken afgegeven
      visum voor een verblijf van langer dan drie maanden;

      i. Onze Minister: Onze Minister van Justitie;

      j. verblijf op reguliere gronden: het verblijf van een vreemdeling in Nederland op grond van deze wet anders dan op
      de gronden bedoeld in de [artikelen 29][ref7] en [34][ref8];

      k. Vluchtelingenverdrag: het Verdrag van Genève van 1951 betreffende de status van vluchtelingen (Trb. 1954, 88) en
      het bijbehorende Protocol van New York van 1967 (Trb. 1967, 76);

      l. verdragsvluchteling: de vreemdeling die vluchteling is in de zin van het Vluchtelingenverdrag en op wie de
      bepalingen ervan van toepassing zijn;

      m. vreemdeling: ieder die de Nederlandse nationaliteit niet bezit en niet op grond van een wettelijke bepaling als
      Nederlander moet worden behandeld;

      n. richtlijn tijdelijke bescherming: [richtlijn nr. 2001/55/EG](32001L0055) van de Raad van 20 juli 2001
      betreffende minimumnormen voor het verlenen van tijdelijke bescherming in geval van massale toestroom van
      ontheemden en maatregelen ter bevordering van een evenwicht tussen de inspanning van de lidstaten voor de opvang en
      het dragen van de consequentie van de opvang van deze personen (PbEG L 212);

      o. tijdelijke bescherming: rechtmatig verblijf in de zin van [artikel 8, onder f of h][ref9], van de vreemdeling
      wiens uitzetting in verband met een aanvraag als bedoeld in [artikel 28][ref10] op grond van de richtlijn
      tijdelijke bescherming achterwege blijft;

      p. langdurig ingezetene: houder van een verblijfsvergunning voor onbepaalde tijd als bedoeld in
      [artikel 20][ref11], verleend ter uitvoering van artikel 8, tweede lid, van de [richtlijn nr. 2003/109/EG]
      (32003L0109) van de Raad van de Europese Unie van 25 november 2003 betreffende de status van langdurig ingezeten
      onderdanen van derde landen (PbEU 2004, L16), dan wel van een door een andere staat die partij is bij het Verdrag
      tot oprichting van de Europese Gemeenschap afgegeven EG-verblijfsvergunning voor langdurig ingezetenen;

      q. richtlijn asielprocedures: Richtlijn nr. 2005/85/EG van de Raad van de Europese Unie van 1 december
      2005 betreffende minimumnormen voor de procedures in lidstaten voor de toekenning of intrekking van de
      vluchtelingenstatus (PbEU L 326);

      r. Schengengrenscode: Verordening (EG) nr. 562/2006 van het Europees Parlement en de Raad van 15 maart
      2006 tot vaststelling van een communautaire code betreffende de overschrijding van de grenzen door personen
      (Schengengrenscode) (PbEU L 105);

      s. terugkeerbesluit: het terugkeerbesluit, bedoeld in artikel 3, punt 4, van de richtlijn nr. 2008/115/EG van het
      Europees Parlement en de Raad van 16 december 2008 over de gemeenschappelijke normen en procedures in de lidstaten
      voor de terugkeer van onderdanen van derde landen die illegaal op hun grondgebied verblijven (PbEU L 348/98);

      t. *inreisverbod:* het inreisverbod, bedoeld in artikel 3, punt 6, van de richtlijn, bedoeld onder s.


