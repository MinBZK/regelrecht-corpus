  - number: '30'
    text: |-
      1 Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]
      wordt afgewezen indien:

      a. een ander land, partij bij het Vluchtelingenverdrag ingevolge een verdrag of een dit land en Nederland bindend
      besluit van een volkenrechtelijke organisatie verantwoordelijk is voor de behandeling van de aanvraag;

      b. de vreemdeling reeds rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder a tot en met e of l][ref2];

      c. de vreemdeling eerder een aanvraag voor verlening van een verblijfsvergunning heeft ingediend waarop nog
      niet onherroepelijk is beslist en hij op grond van die aanvraag rechtmatig verblijf heeft als bedoeld in
      [artikel 8 onder f, g en h][ref3], of

      d. de vreemdeling op grond van een verdragsverplichting tussen Nederland en een ander land zal worden overgedragen
      aan dat land van eerder verblijf, terwijl dat land partij is bij het Vluchtelingenverdrag, het Verdrag tot
      bescherming van de rechten van de mens en de fundamentele vrijheden (Trb. 1951, 154) en het Verdrag tegen foltering
      en andere wrede, onmenselijke of onterende behandeling of bestraffing (Trb. 1985, 69), dan wel zich anderszins
      heeft verplicht artikel 33 van het Vluchtelingenverdrag, [artikel 3 van het Verdrag tot bescherming van de rechten
      van de mens en de fundamentele vrijheden](onbekend) en [artikel 3 van het Verdrag tegen foltering en andere wrede
      onmenselijke of onterende behandeling of bestraffing](onbekend), na te leven.

      2 Het eerste lid, onder b, is niet van toepassing, indien naar aanleiding van een aanvraag tot het verlenen
      van de verblijfsvergunning, bedoeld in [artikel 28][ref4], ambtshalve de verblijfsvergunning, bedoeld in
      [artikel 14][ref5], is verleend.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid, onder d.


