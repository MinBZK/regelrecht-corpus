  - number: '20'
    text: |-
      1 Onze Minister is bevoegd:

      a. de aanvraag tot het verlenen of tot het wijzigen van een verblijfsvergunning voor onbepaalde tijd in te
      willigen, af te wijzen dan wel niet in behandeling te nemen;

      b. een verblijfsvergunning voor onbepaalde tijd in te trekken dan wel te wijzigen.

      2 Een verblijfsvergunning voor onbepaalde tijd wordt niet onder beperkingen verleend. Aan de vergunning worden geen
      voorschriften verbonden.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel20
  - number: '21'
    text: |-
      1 Ter uitvoering van artikel 8, tweede lid, van de [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de
      Europese Unie van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen
      (PbEU 2004, L16) kan de aanvraag tot het verlenen of wijzigen van een verblijfsvergunning voor onbepaalde tijd als
      bedoeld in artikel 20 slechts worden afgewezen, indien de vreemdeling:

      a. niet gedurende vijf jaren ononderbroken en direct voorafgaande aan de aanvraag rechtmatig verblijf heeft gehad
      als bedoeld in [artikel 8][ref1];

      b. in de periode, bedoeld onder a, verblijfsrecht van tijdelijke aard heeft gehad, dan wel een formeel beperkt
      verblijfsrecht of een verblijfsrecht als werknemer van een dienstverlener in het kader van grensoverschrijdende
      diensten of als verlener van grensoverschrijdende diensten heeft gehad;

      c. in de periode, bedoeld onder a, zes of meer achtereenvolgende maanden of in totaal tien of meer maanden buiten
      Nederland heeft verbleven;

      d. al of niet tezamen met het gezinslid bij wie hij verblijft, niet zelfstandig en duurzaam beschikt over voldoende
      middelen van bestaan;

      e. bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem terzake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref2], is opgelegd;

      f. een gevaar vormt voor de nationale veiligheid;

      g. niet beschikt over een toereikende ziektekostenverzekering voor hemzelf en de te zijnen laste komende
      gezinsleden,

      h. onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot afwijzing van
      de aanvraag tot het verlenen, wijzigen of verlengen zouden hebben geleid;

      i. rechtmatig verblijf heeft als bedoeld in [artikel 8, onderdeel c of d][ref3], of in afwachting is van een
      definitieve beslissing tot het verlenen of verlengen van de geldigheidsduur van een verblijfsvergunning als bedoeld
      in de [artikelen 28][ref4] of [33][ref5]; of

      j. een bijzondere geprivilegieerde status bezit dan wel heeft bezeten in de periode van vijf jaren direct
      voorafgaande aan de aanvraag;

      k. het inburgeringsexamen, bedoeld in [artikel 13 van de Wet inburgering][ref6], niet heeft behaald.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gronden, bedoeld in het
      eerste lid.

      3 Tenzij de vergunning is verleend met toepassing van [artikel 21a][ref7], wordt op het document, bedoeld in
      [artikel 9][ref8], de aantekening «EG-langdurig ingezetene» geplaatst.


