  - number: '28'
    text: |-
      1 Onze Minister is bevoegd:

      a. de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;

      b. de aanvraag tot het verlengen van de geldigheidsduur ervan in te willigen, af te wijzen dan wel niet in
      behandeling te nemen;

      c. een verblijfsvergunning voor bepaalde tijd in te trekken.

      2 De verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur kunnen de gevallen worden aangewezen waarin de verblijfsvergunning voor minder dan
      vijf achtereenvolgende jaren wordt verleend. Daarbij kunnen regels worden gesteld over de geldigheidsduur van de
      verblijfsvergunning en over de verlenging ervan.
    url: https://wetten.overheid.nl/BWBR0011823/2012-01-01#Artikel28
  - number: '29'
    text: |-
      1 Een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan worden verleend aan de
      vreemdeling:

      a. die verdragsvluchteling is;

      b. die aannemelijk heeft gemaakt dat hij gegronde redenen heeft om aan te nemen dat hij bij uitzetting een reëel
      risico loopt om te worden onderworpen aan:

      1°. doodstraf of executie;

      2°. folteringen, onmenselijke of vernederende behandelingen of bestraffingen; of

      3°. ernstige en individuele bedreiging van het leven of de persoon van een burger als gevolg van willekeurig geweld
      in het kader van een internationaal of binnenlands gewapend conflict;

      c. van wie naar het oordeel van Onze Minister op grond van klemmende redenen van humanitaire aard die verband
      houden met de redenen van zijn vertrek uit het land van herkomst, in redelijkheid niet kan worden verlangd dat hij
      terugkeert naar het land van herkomst;

      d. voor wie terugkeer naar het land van herkomst naar het oordeel van Onze Minister van bijzondere hardheid zou
      zijn in verband met de algehele situatie aldaar, of

      e. die als echtgenoot of echtgenote of minderjarig kind feitelijk behoort tot het gezin van de vreemdeling, bedoeld
      onder a tot en met d, die dezelfde nationaliteit heeft als die vreemdeling en gelijktijdig met deze vreemdeling
      Nederland is ingereisd dan wel is nagereisd binnen drie maanden, nadat aan de vreemdeling, bedoeld onder a tot en
      met d, de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref2], is verleend;

      f. die als partner of als meerderjarig kind zodanig afhankelijk is van de vreemdeling, bedoeld onder a tot en
      met d, dat hij om die reden behoort tot het gezin van deze vreemdeling, die dezelfde nationaliteit heeft als deze
      vreemdeling en gelijktijdig met deze vreemdeling Nederland is ingereisd dan wel is nagereisd binnen drie maanden,
      nadat aan de vreemdeling, bedoeld onder a tot en met d, de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28][ref3], is verleend.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid,
      aanhef en onder a en b. Daarbij wordt bepaald in welke gevallen een verblijfsvergunning als bedoeld in het eerste
      lid wordt verleend aan de vreemdeling, bedoeld in onderdeel a of b.

      3 Bij of krachtens algemene maatregel van bestuur worden indicatoren aangewezen die in ieder geval worden betrokken
      in de beoordeling of er sprake is van een situatie als bedoeld in het eerste lid, onder d.


