        afdeling: '3'
  - number: '109.5'
    text: |-
      Ter uitvoering van een verdrag, EU-verordening, -richtlijn of -besluit, bedoeld in het vierde lid, wordt in
      [artikel 3, eerste lid][ref1], en [artikel 12, eerste lid][ref2], onder «openbare orde» alsmede «nationale
      veiligheid» steeds mede verstaan de openbare orde in, onderscheidenlijk de nationale veiligheid van andere bij dat
      verdrag aangesloten staten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel12
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '12'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '110.1'
    text: |-
      Onverminderd de artikelen [7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-president, [artikel 111][ref3] in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel111
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '111'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '110.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel110
  - number: '110.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-president, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel110
  - number: '110.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-president, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel110
  - number: '110.5'
    text: |-
      Het besluit als bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel110
  - number: '110.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel110
  - number: '111'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels voor het geval van buitengewone omstandigheden worden gesteld, die
      afwijken van de [hoofdstukken 1 tot en met 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '1'
  - number: '112'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van een verdrag, dan wel van een voor
      Nederland verbindend besluit van een volkenrechtelijke organisatie regels worden gesteld in verband met het
      rechtmatig verblijf van vreemdelingen, waarbij ten gunste van deze vreemdelingen kan worden afgeweken van deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel112
  - number: '114'
    text: |-
      Een vreemdeling aan wie de verblijfsvergunning als bedoeld in [artikel 28][ref1] of [artikel 33][ref2] is verleend,
      geniet dezelfde behandeling als een Nederlander, wat betreft rechtsingang, waaronder begrepen rechtsbijstand en
      vrijstelling van de cautio judicatum solvi.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '124'
    text: 'Deze wet wordt aangehaald als: Vreemdelingenwet 2000.'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel124
