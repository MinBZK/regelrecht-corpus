        artikel: '8'
  - number: 84.a
    text: |-
      over een besluit of handeling op grond van [artikel 6, eerste lid][ref1], [hoofdstuk 4][ref2] of
      [hoofdstuk 5][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk5
