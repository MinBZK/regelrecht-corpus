  - number: 84.d
    text: |-
      over de toekenning van de vergoeding, bedoeld in [artikel 106][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel106
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel84
    references:
