  - number: '9.1'
    text: |-
      Onze Minister verschaft aan de vreemdeling, die rechtmatig verblijf heeft op grond van
      [artikel 8, onder a tot en met d, f tot en met h en j tot en met l][ref1], en aan de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, onder e][ref2], en gemeenschapsonderdaan is als bedoeld in
      [artikel 1, onder e, sub 2°, 4° en 6°][ref3], een document of schriftelijke verklaring, waaruit het rechtmatig
      verblijf blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: '9.2'
    text: |-
      Onze Minister verschaft aan de vreemdeling die rechtmatig verblijf heeft op grond van [artikel 8, onder e][ref1],
      en gemeenschapsonderdaan is als bedoeld in [artikel 1, onder e, sub 1°, 3° en 5°][ref2] een document, waaruit
      het rechtmatig verblijf blijkt, indien de vreemdeling het duurzaam verblijfsrecht heeft verkregen als bedoeld
      in artikel 16 van [Richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor burgers van de Unie
      en hun familieleden, tot wijziging van [Verordening (EEG) 1612/68](31968R1612) en tot intrekking van [Richtlijnen
      64/221/EEG](31964L0221), [68/360/EEG](31968L0360), [72/194/EEG](31972L0194), [73/148/EEG](31973L0148), [75/34/
      EEG](31975L0034), [75/35/EEG](31975L0035), [90/364/EEG](31990L0364), [90/365/EEG](31990L0365) en [93/96/EEG]
      (31993L0096) (PbEU L 158).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: '9.3'
    text: |-
      Onze Minister verschaft desgevraagd een dergelijk document of schriftelijke verklaring aan de vreemdeling die
      rechtmatig verblijf heeft op grond van [artikel 8, onder i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '9.4'
    text: |-
      Bij de aanvraag van een beschikking anders dan op grond van deze wet legt de vreemdeling desgevraagd een kopie
      van het document of de schriftelijke verklaring over, dat wordt aangemerkt als een bescheid als bedoeld in
      [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9.5'
    text: |-
      Onze Minister wijst bij ministeriële regeling de bescheiden, bedoeld in het eerste tot en met derde lid, aan en kan
      modellen vaststellen voor de documenten en de schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel9
  - number: 9a
    text: |-
      In afwijking van [artikel 9, tweede lid][ref1], verschaft Onze Minister aan de vreemdeling die rechtmatig
      verblijf heeft op grond van [artikel 8, onder e][ref2], en gemeenschapsonderdaan is als bedoeld in
      [artikel 1, onder e, sub 1°, 3° en 5°][ref3], op aanvraag een bewijs van rechtmatig verblijf voordat de
      vreemdeling het duurzame verblijfsrecht heeft verkregen, indien de vreemdeling de nationaliteit heeft van een
      lidstaat ten aanzien waarvan Nederland de toepassing van de artikelen 1 tot en met 6 van [Verordening (EEG) nr.
      1612/68](31968R1612) van de Raad van de Europese Gemeenschappen van 15 oktober 1968 betreffende het vrije verkeer
      van werknemers binnen de Gemeenschap (PbEG L 257) heeft opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: '10.1'
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft, kan geen aanspraak maken op toekenning van verstrekkingen,
      voorzieningen en uitkeringen bij wege van een beschikking van een bestuursorgaan. De eerste volzin is van
      overeenkomstige toepassing op de bij de wet of algemene maatregel van bestuur aangewezen ontheffingen of
      vergunningen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel10
  - number: '10.2'
    text: |-
      Van het eerste lid kan worden afgeweken indien de aanspraak betrekking heeft op het onderwijs, de verlening
      van medisch noodzakelijke zorg, de voorkoming van inbreuken op de volksgezondheid, of de rechtsbijstand aan de
      vreemdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel10
  - number: '10.3'
    text: De toekenning van aanspraken geeft geen recht op rechtmatig verblijf.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel10
  - number: '11.1'
    text: |-
      De aanspraken van de vreemdeling die rechtmatig verblijf heeft zijn in overeenstemming met de aard van het
      verblijf. Tenzij bij of krachtens het wettelijk voorschrift waarop de aanspraak is gegrond anders is bepaald, is
      daarbij het tweede lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel11
  - number: '11.2'
    text: |-
      De vreemdeling, bedoeld in het eerste lid, kan aanspraken maken op voorzieningen, verstrekkingen en uitkeringen,
      indien hij:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel11
  - number: 11.2.a
    text: |-
      rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder a, tot en met e en l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 11.2.b
    text: |-
      rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder f, g, h][ref1], en een aanspraak wordt toegekend bij
      of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref2], dan wel bij of krachtens een ander wettelijk
      voorschrift, waarin aanspraken van deze vreemdelingen zijn neergelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006685
  - number: 11.2.c
    text: |-
      rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder i tot en met k][ref1], voor de aanspraken die
      uitdrukkelijk aan deze vreemdelingen zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '11.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de bij wet of algemene maatregel van bestuur
      aangewezen ontheffingen of vergunningen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel11
  - number: '12.1'
    text: |-
      Het is aan de vreemdeling die bij binnenkomst heeft voldaan aan de verplichtingen waaraan een persoon bij
      grensoverschrijding is onderworpen, gedurende een bij algemene maatregel van bestuur te bepalen termijn toegestaan
      in Nederland te verblijven, zolang hij:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel12
  - number: 12.1.a
    text: de bij of krachtens deze wet gestelde regels in acht neemt;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel12
  - number: 12.1.b
    text: |-
      beschikt over voldoende middelen om te voorzien zowel in de kosten van zijn verblijf in Nederland als in die van
      zijn reis naar een plaats buiten Nederland waar zijn toegang gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel12
  - number: 12.1.c
    text: |-
      geen arbeid voor een werkgever verricht in strijd met de [Wet arbeid vreemdelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 12.1.d
    text: geen gevaar oplevert voor de openbare orde of de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel12
  - number: '12.2'
    text: |-
      De termijn, bedoeld in het eerste lid, wordt ten hoogste op zes maanden bepaald. Voor bij algemene maatregel van
      bestuur te onderscheiden categorieën van vreemdelingen kunnen verschillende termijnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel12
  - number: '13'
    text: 'Een aanvraag tot het verlenen van een verblijfsvergunning wordt slechts ingewilligd indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel13
  - number: 13.a
    text: internationale verplichtingen daartoe nopen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel13
  - number: 13.b
    text: met de aanwezigheid van de vreemdeling een wezenlijk Nederlands belang is gediend, of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel13
  - number: 13.c
    text: klemmende redenen van humanitaire aard daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel13
  - number: '14.1'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: 14.1.a
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: 14.1.b
    text: |-
      de aanvraag tot het verlengen van de geldigheidsduur ervan in te willigen, af te wijzen dan wel niet in behandeling
      te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: 14.1.c
    text: een verblijfsvergunning voor bepaalde tijd op aanvraag of ambtshalve te wijzigen wegens veranderde omstandigheden;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: 14.1.d
    text: een verblijfsvergunning voor bepaalde tijd in te trekken;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: 14.1.e
    text: ambtshalve een verblijfsvergunning voor bepaalde tijd te verlenen dan wel de geldigheidsduur ervan te verlengen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister verleent de houder van een geldige machtiging tot voorlopig verblijf binnen twee weken nadat deze
      zich overeenkomstig [artikel 54, eerste lid, onder e][ref1], heeft aangemeld, ambtshalve een verblijfsvergunning
      voor bepaalde tijd onder dezelfde beperking als die waaronder de machtiging tot voorlopig verblijf is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '14.3'
    text: |-
      Een verblijfsvergunning voor bepaalde tijd wordt verleend onder beperkingen, verband houdende met het doel waarvoor
      het verblijf is toegestaan. Aan de vergunning kunnen voorschriften worden verbonden. Bij of krachtens algemene
      maatregel van bestuur kunnen regels worden gesteld over de ambtshalve verlening, wijziging en verlenging, de
      beperkingen en de voorschriften.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: '14.4'
    text: |-
      De verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur worden regels gesteld over de geldigheidsduur van de verblijfsvergunning en de
      verlenging van de geldigheidsduur van de verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel14
  - number: '15'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in [artikel 14, tweede lid][ref1], wordt bepaald, dat de
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14][ref2], kan worden verleend onder een beperking
      verband houdend met verblijf als familie- of gezinslid aan gezinsleden van Nederlanders en vreemdelingen die
      rechtmatig verblijven als bedoeld in [artikel 8, onder a tot en met e en l][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '16.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] kan
      worden afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 16.1.a
    text: |-
      de vreemdeling niet beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het
      verblijfsdoel waarvoor de verblijfsvergunning is aangevraagd;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16.1.b
    text: de vreemdeling niet beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16.1.c
    text: |-
      de vreemdeling niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan dan wel, indien de persoon
      bij wie de vreemdeling wil verblijven, niet zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16.1.d
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16.1.e
    text: |-
      de vreemdeling niet bereid is om medewerking te verlenen aan een medisch onderzoek naar een ziekte aangewezen bij
      of krachtens de Infectieziektewet, ter bescherming van de volksgezondheid of een medische behandeling tegen een
      dergelijke ziekte te ondergaan;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16.1.f
    text: |-
      de vreemdeling voor een werkgever arbeid verricht, zonder dat aan de [Wet arbeid vreemdelingen][ref1] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 16.1.g
    text: de vreemdeling niet voldoet aan de beperking, verband houdende met het doel waarvoor hij wil verblijven;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16.1.h
    text: |-
      de vreemdeling, die niet behoort tot een der categorieën, bedoeld in [artikel 17, eerste lid][ref1], na
      verkrijging van rechtmatig verblijf in Nederland inburgeringsplichtig zou zijn op grond van de [artikelen 3][ref2]
      en [5 van de Wet inburgering][ref3] en niet beschikt over kennis op basisniveau van de Nederlandse taal en de
      Nederlandse maatschappij;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 16.1.i
    text: |-
      ten behoeve van het verblijf van de vreemdeling geen verklaring van een referent is overgelegd als bedoeld in
      [artikel 2a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 16.1.i
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van een eerdere aanvraag tot het verlenen, verlengen of wijzigen van een visum of een verblijfsvergunning
      hebben geleid of zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16.1.j
    text: |-
      de vreemdeling in Nederland verblijf heeft gehouden, anders dan op grond van [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '16.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: '16.3'
    text: |-
      Het eerste lid, onder h, is niet van toepassing op de vreemdeling die de Surinaamse nationaliteit bezit en die met
      bij ministeriële regeling vastgestelde bescheiden heeft aangetoond in Suriname of Nederland lager onderwijs in de
      Nederlandse taal te hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16
  - number: 16a.1
    text: |-
      De aanvraag tot het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      kan worden afgewezen op de gronden, bedoeld in [artikel 16, eerste lid, onder b tot en met g en k][ref2], alsmede
      indien de vreemdeling het examen, bedoeld in [artikel 7, tweede lid, onderdeel a, van de Wet inburgering][ref3],
      of een diploma, certificaat of ander document, bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref4],
      niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 16a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel16a
  - number: '17.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      wordt niet afgewezen wegens het ontbreken van een geldige machtiging tot voorlopig verblijf, indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 17.1.a
    text: |-
      de vreemdeling die de nationaliteit bezit van één der door bij regeling van Onze Minister in overeenstemming met
      Onze Minister van Buitenlandse Zaken aan te wijzen landen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: 17.1.b
    text: de gemeenschapsonderdaan, voorzover niet reeds vrijgesteld op grond van een aanwijzing als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: 17.1.c
    text: de vreemdeling voor wie het gelet op diens gezondheidstoestand niet verantwoord is om te reizen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: 17.1.d
    text: de vreemdeling die slachtoffer of getuige-aangever is van mensenhandel;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: 17.1.e
    text: |-
      de vreemdeling die onmiddellijk voorafgaande aan de aanvraag in het bezit was van een verblijfsvergunning voor
      bepaalde tijd als bedoeld in [artikel 28][ref1] dan wel van een verblijfsvergunning voor onbepaalde tijd als
      bedoeld in [artikel 33][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 17.1.f
    text: de vreemdeling die tijdig een aanvraag heeft ingediend tot wijziging van een verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: 17.1.g
    text: de vreemdeling die behoort tot een bij algemene maatregel van bestuur aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: 17.1.h
    text: |-
      de vreemdeling die houder is van een EG-verblijfsvergunning voor langdurig ingezetenen die is afgegeven door een
      andere staat die Partij is bij het Verdrag tot oprichting van de Europese Gemeenschap, dan wel de echtgenoot of het
      minderjarig kind is van die houder, in geval het gezin reeds was gevormd in die andere staat.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: '17.2'
    text: |-
      De voordracht voor een krachtens het eerste lid, onder g, vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat een ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17
  - number: 17a.1
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1]
      wordt niet afgewezen met toepassing van [artikel 16, eerste lid, onderdeel j][ref2], indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 17a.1.a
    text: |-
      de vreemdeling die direct voorafgaand aan de aanvraag rechtmatig verblijf heeft gehad op grond van
      [artikel 8, onder j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 17a.1.b
    text: |-
      de vreemdeling die in aanmerking komt voor verblijf onder een beperking als bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel15
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 17a.1.c
    text: de vreemdeling die minderjarig en alleenstaand is;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17a
  - number: 17a.1.d
    text: |-
      de vreemdeling die als slachtoffer of getuige-aangever als bedoeld in [artikel 17, eerste lid, onder d][ref1],
      direct voorafgaand aan de aanvraag verblijf heeft gehad op grond van [artikel 8, onder a][ref2], en in aanmerking
      komt voor verblijf onder een andere beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 17a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen andere categorieën worden aangewezen waarin de aanvraag, bedoeld in het
      eerste lid, niet wordt afgewezen, op grond dat de toepassing van [artikel 16, eerste lid, onder j][ref1], van een
      onevenredige hardheid zou kunnen getuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '18.1'
    text: |-
      Een aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14][ref1] kan worden afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 18.1.a
    text: de houder daarvan zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
  - number: 18.1.b
    text: de vreemdeling niet beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
  - number: 18.1.c
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
  - number: 18.1.d
    text: |-
      de vreemdeling niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan dan wel de persoon
      bij wie de vreemdeling verblijft niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
  - number: 18.1.e
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
  - number: 18.1.f
    text: |-
      niet wordt voldaan aan de beperking waaronder de vergunning is verleend of een voorschrift dat aan de vergunning
      is verbonden;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
  - number: 18.1.g
    text: |-
      de vreemdeling voor een werkgever arbeid verricht, zonder dat aan de [Wet arbeid vreemdelingen][ref1] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 18.1.h
    text: |-
      ten behoeve van het verblijf van de vreemdeling geen verklaring van een referent is overgelegd als bedoeld in
      [artikel 2a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 18.1.i
    text: |-
      de vreemdeling niet heeft voldaan aan de inburgeringsplicht, bedoeld in
      [artikel 7, eerste lid, van de Wet inburgering][ref1], binnen de in dat artikel genoemde termijn, of binnen de met
      toepassing van artikel 7, derde lid, van die wet of van de krachtens artikel 7, vierde lid, aanhef en onderdeel a,
      van die wet gestelde regels verlengde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: '18.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel18
  - number: '19'
    text: |-
      De verblijfsvergunning voor bepaalde tijd kan worden ingetrokken op de gronden bedoeld in
      [artikel 18, eerste lid, met uitzondering van onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '20.1'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel20
  - number: 20.1.a
    text: |-
      de aanvraag tot het verlenen of tot het wijzigen van een verblijfsvergunning voor onbepaalde tijd in te willigen,
      af te wijzen dan wel niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel20
  - number: 20.1.b
    text: een verblijfsvergunning voor onbepaalde tijd in te trekken dan wel te wijzigen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel20
  - number: '20.2'
    text: |-
      Een verblijfsvergunning voor onbepaalde tijd wordt niet onder beperkingen verleend. Aan de vergunning worden geen
      voorschriften verbonden.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel20
  - number: '21.1'
    text: |-
      Ter uitvoering van artikel 8, tweede lid, van de [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de
      Europese Unie van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen
      (PbEU 2004, L16) kan de aanvraag tot het verlenen of wijzigen van een verblijfsvergunning voor onbepaalde tijd als
      bedoeld in artikel 20 slechts worden afgewezen, indien de vreemdeling:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.a
    text: |-
      niet gedurende vijf jaren ononderbroken en direct voorafgaande aan de aanvraag rechtmatig verblijf heeft gehad als
      bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 21.1.b
    text: |-
      in de periode, bedoeld onder a, verblijfsrecht van tijdelijke aard heeft gehad, dan wel een formeel beperkt
      verblijfsrecht of een verblijfsrecht als werknemer van een dienstverlener in het kader van grensoverschrijdende
      diensten of als verlener van grensoverschrijdende diensten heeft gehad;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.c
    text: |-
      in de periode, bedoeld onder a, zes of meer achtereenvolgende maanden of in totaal tien of meer maanden buiten
      Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.d
    text: |-
      al of niet tezamen met het gezinslid bij wie hij verblijft, niet zelfstandig en duurzaam beschikt over voldoende
      middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.e
    text: |-
      bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem terzake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1], is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 21.1.f
    text: een gevaar vormt voor de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.g
    text: niet beschikt over een toereikende ziektekostenverzekering voor hemzelf en de te zijnen laste komende gezinsleden,
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.h
    text: |-
      onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot afwijzing van de
      aanvraag tot het verlenen, wijzigen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.i
    text: |-
      rechtmatig verblijf heeft als bedoeld in [artikel 8, onderdeel c of d][ref1], of in afwachting is van een
      definitieve beslissing tot het verlenen of verlengen van de geldigheidsduur van een verblijfsvergunning als bedoeld
      in de [artikelen 28][ref2] of [33][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 21.1.j
    text: |-
      een bijzondere geprivilegieerde status bezit dan wel heeft bezeten in de periode van vijf jaren direct voorafgaande
      aan de aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: 21.1.k
    text: |-
      het examen, bedoeld in [artikel 7, tweede lid, onderdeel a, van de Wet inburgering][ref1], of een diploma,
      certificaat of ander document, bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref2], niet heeft
      behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '5'
  - number: '21.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gronden, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
  - number: '21.3'
    text: |-
      Tenzij de vergunning is verleend met toepassing van [artikel 21a][ref1], wordt op het document, bedoeld in
      [artikel 9][ref2], de aantekening «EG-langdurig ingezetene» geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 21a
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 21a.1
    text: |-
      Ter uitvoering van artikel 13 van de [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de Europese Unie van
      25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU 2004, L16) wordt
      de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1]
      niet afgewezen op de grond, bedoeld in [artikel 21, eerste lid, onder d][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 21a.1.a
    text: |-
      de vreemdeling gedurende een tijdvak van tien aaneengesloten jaren rechtmatig verblijf als bedoeld in
      [artikel 8, onder a, of l][ref1], heeft gehad, of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 21a.1.b
    text: |-
      de vreemdeling als minderjarige onder een beperking verband houdend met gezinshereniging rechtmatig verblijf heeft
      gehad, sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is, tenzij de
      gezinsband werd verbroken binnen een jaar na verlening van de verblijfvergunning, bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 21a.2
    text: |-
      Indien de vreemdeling in Nederland is geboren dan wel reeds voor zijn vierde levensjaar in Nederland verbleef
      en sindsdien zijn hoofdverblijf niet buiten Nederland heeft verplaatst en inmiddels 18 jaar is, kan de
      aanvraag slechts worden afgewezen op grond van [artikel 21, eerste lid, onder e en f][ref1]. In afwijking van
      [artikel 21, eerste lid, onder a][ref2], behoeft het rechtmatig verblijf niet aaneengesloten te zijn. De aanvraag
      kan slechts op grond van [artikel 21, eerste lid, onder e][ref3], worden afgewezen, indien de vreemdeling bij
      onherroepelijk geworden rechterlijk vonnis is veroordeeld tot een gevangenisstraf van meer dan 60 maanden wegens
      handel in verdovende middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 21a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere gevallen dan bedoeld in het eerste en tweede lid
      worden aangewezen waarin een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1] kan worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '22.1'
    text: |-
      De verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1] kan worden ingetrokken of gewijzigd,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 22.1.a
    text: |-
      de vreemdeling een aaneengesloten periode van twaalf maanden of langer buiten het grondgebied van de staten die
      partij zijn bij het Verdrag tot oprichting van de Europese Gemeenschap, dan wel zes jaar of langer buiten Nederland
      heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel22
  - number: 22.1.b
    text: de verblijfsvergunning op frauduleuze wijze is verkregen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel22
  - number: 22.1.c
    text: de vreemdeling een actuele en ernstige bedreiging voor de openbare orde of de nationale veiligheid vormt.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel22
  - number: '22.2'
    text: |-
      De verblijfsvergunning wordt ingetrokken, indien de vreemdeling langdurig ingezetene is geworden in een andere
      staat die partij is bij het Verdrag tot oprichting van de Europese Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel22
  - number: '22.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van de
      gronden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel22
  - number: '23.1'
    text: |-
      De aanvraag tot het verlenen, verlengen of wijzigen van een verblijfsvergunning wordt ingediend door de
      vreemdeling, zijn wettelijk vertegenwoordiger of zijn referent.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van het eerste lid wordt de aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde
      gevallen ingediend door de vreemdeling, zijn wettelijk vertegenwoordiger of zijn erkende referent.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel23
  - number: '23.3'
    text: |-
      In afwijking van [artikel 2:1 van de Algemene wet bestuursrecht][ref1] en in afwijking van het eerste en tweede
      lid, wordt de aanvraag in bij of krachtens algemene maatregel van bestuur bepaalde gevallen ingediend door de
      vreemdeling of zijn wettelijk vertegenwoordiger in persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '24.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24
  - number: 24.1.a
    text: de wijze van indiening en behandeling van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24
  - number: 24.1.b
    text: |-
      het al dan niet in persoon door de vreemdeling, diens wettelijk vertegenwoordiger of diens referent verstrekken van
      gegevens welke van belang zijn voor de aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24
  - number: 24.1.c
    text: |-
      de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede de bij of
      krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling, de referent of aan
      andere belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van beschikkingen ook
      kan geschieden door middel van het toezenden of uitreiken van een document en door het stellen van aantekeningen in
      een daarbij aan te wijzen document.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24
  - number: '24.2'
    text: |-
      De vreemdeling is, in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven regels,
      leges verschuldigd terzake van de afdoening van een aanvraag. Daarbij kan Onze Minister tevens bepalen dat de
      vreemdeling voor de afgifte van een document waaruit het rechtmatig verblijf blijkt leges verschuldigd is. Als
      betaling achterwege blijft, wordt de aanvraag niet in behandeling genomen dan wel het document niet afgegeven.
      [Artikel 4:5, vierde lid, Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 24a.1
    text: 'Gegevens en bescheiden worden niet verkregen van de vreemdeling of diens referent, voor zover:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.1.a
    text: |-
      Onze Minister die gegevens of bescheiden kan verkrijgen uit bij regeling van Onze Minister aan te wijzen
      administraties, tenzij hierdoor een goede uitvoering van de wet wordt belet, of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.1.b
    text: |-
      de aanvraag is ingediend door de erkende referent, en deze omtrent die gegevens en bescheiden eigen verklaringen
      heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.2
    text: De eigen verklaringen, bedoeld in het eerste lid, onder b, worden volledig en naar waarheid opgesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.3
    text: |-
      De aanvrager verstrekt Onze Minister op diens verzoek en al dan niet in persoon alsnog de gegevens en bescheiden,
      die van belang zijn voor de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.4
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de gegevens en bescheiden waarop het eerste lid, onder
      a, van toepassing is, en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.4.a
    text: de administraties of delen daarvan waarvoor het eerste lid, onder a, tijdelijk niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.4.b
    text: de eigen verklaringen, bedoeld in het eerste lid, onder b,
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: 24a.4.c
    text: de toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel24a
  - number: '25.1'
    text: 'Binnen 90 dagen wordt een beschikking gegeven op de aanvraag tot:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
  - number: 25.1.a
    text: |-
      het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 25.1.b
    text: het verlengen van de geldigheidsduur ervan;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
  - number: 25.1.c
    text: |-
      het wijzigen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 25.1.d
    text: |-
      het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 25.1.e
    text: |-
      het wijzigen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '25.2'
    text: |-
      De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie, nodig is.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
  - number: '25.3'
    text: Onze Minister stelt de vreemdeling in kennis van de verlenging.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 14][ref1] is ingediend door een langdurig ingezetene of diens gezinslid, kan de termijn
      voor het geven van de beschikking in afwijking van het tweede lid voor ten hoogste drie maanden worden verlengd.
      Indien de langdurig ingezetene of het gezinslid krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref2] is
      uitgenodigd de aanvraag aan te vullen, wordt de beschikking gegeven binnen zeven maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '25.5'
    text: |-
      In afwijking van het eerste en tweede lid wordt de beschikking op een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14][ref1] onder een beperking verband houdend met verblijf als houder
      van de Europese blauwe kaart bekend gemaakt binnen 90 dagen en kan die termijn niet worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '26.1'
    text: |-
      De verblijfsvergunning, die van rechtswege rechtmatig verblijf inhoudt, wordt verleend met ingang van de dag waarop
      de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet eerder dan met ingang van de dag
      waarop de aanvraag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel26
  - number: '26.2'
    text: |-
      De geldigheidsduur van de verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] wordt verlengd
      met ingang van de dag waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet
      eerder dan met ingang van de dag na die waarop de geldigheidsduur van de verblijfsvergunning waarvoor verlenging is
      gevraagd afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '26.3'
    text: |-
      Indien de vreemdeling de aanvraag tot verlenging, dan wel de gegevens waaruit blijkt dat aan de voorwaarden wordt
      voldaan niet tijdig heeft ingediend en hem dit niet is toe te rekenen, kan de verblijfsvergunning worden verlengd
      met ingang van de dag na die waarop de geldigheidsduur van de verblijfsvergunning waarvoor verlenging is gevraagd
      afloopt.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel26
  - number: '27.1'
    text: |-
      De beschikking waarbij een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 14][ref1] of een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20][ref2]
      wordt afgewezen, geldt als terugkeerbesluit, tenzij reeds eerder een terugkeerbesluit tegen de vreemdeling is
      uitgevaardigd en aan de daaruit voortvloeiende terugkeerverplichting niet is voldaan, en heeft van rechtswege tot
      gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 27.1.a
    text: |-
      de vreemdeling niet langer rechtmatig verblijf heeft tenzij er een andere rechtsgrond voor rechtmatig verblijf van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
  - number: 27.1.b
    text: |-
      de vreemdeling Nederland uit eigen beweging dient te verlaten binnen de in [artikel 62][ref1] gestelde termijn, bij
      gebreke waarvan de vreemdeling kan worden uitgezet, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 27.1.c
    text: |-
      de ambtenaren belast met het toezicht op vreemdelingen, na ommekomst van de termijn waarbinnen de vreemdeling
      Nederland uit eigen beweging dient te verlaten, bevoegd zijn elke plaats te betreden, daaronder begrepen een
      woning, zonder de toestemming van de bewoner, teneinde de vreemdeling uit te zetten.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
  - number: '27.2'
    text: 'Het eerste lid is van overeenkomstige toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
  - number: 27.2.a
    text: |-
      ingevolge [artikel 24][ref1] of ingevolge [artikel 4:5 van de Algemene wet bestuursrecht][ref2] is besloten dat de
      aanvraag niet in behandeling wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 27.2.b
    text: het rechtmatig verblijf van rechtswege is geëindigd;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
  - number: 27.2.c
    text: een verblijfsvergunning is ingetrokken of de geldigheidsduur ervan niet is verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
  - number: '27.3'
    text: |-
      De gevolgen, bedoeld in het eerste lid, treden niet in indien de vreemdeling bezwaar of beroep heeft ingesteld en
      de werking van de beschikking is opgeschort.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
  - number: '27.4'
    text: De beschikking, bedoeld in het eerste lid, kan tevens een inreisverbod inhouden.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel27
  - number: '28.1'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel28
  - number: 28.1.a
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel28
  - number: 28.1.b
    text: |-
      de aanvraag tot het verlengen van de geldigheidsduur ervan in te willigen, af te wijzen dan wel niet in behandeling
      te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel28
  - number: 28.1.c
    text: een verblijfsvergunning voor bepaalde tijd in te trekken.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel28
  - number: '28.2'
    text: |-
      De verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur kunnen de gevallen worden aangewezen waarin de verblijfsvergunning voor minder dan
      vijf achtereenvolgende jaren wordt verleend. Daarbij kunnen regels worden gesteld over de geldigheidsduur van de
      verblijfsvergunning en over de verlenging ervan.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel28
  - number: '29.1'
    text: |-
      Een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan worden verleend aan de
      vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 29.1.a
    text: die verdragsvluchteling is;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: 29.1.b
    text: |-
      die aannemelijk heeft gemaakt dat hij gegronde redenen heeft om aan te nemen dat hij bij uitzetting een reëel
      risico loopt om te worden onderworpen aan:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: 29.1.b.1°
    text: doodstraf of executie;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: 29.1.b.2°
    text: folteringen, onmenselijke of vernederende behandelingen of bestraffingen; of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: 29.1.b.3°
    text: |-
      ernstige en individuele bedreiging van het leven of de persoon van een burger als gevolg van willekeurig geweld in
      het kader van een internationaal of binnenlands gewapend conflict;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: 29.1.c
    text: |-
      van wie naar het oordeel van Onze Minister op grond van klemmende redenen van humanitaire aard die verband houden
      met de redenen van zijn vertrek uit het land van herkomst, in redelijkheid niet kan worden verlangd dat hij
      terugkeert naar het land van herkomst;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: 29.1.d
    text: |-
      voor wie terugkeer naar het land van herkomst naar het oordeel van Onze Minister van bijzondere hardheid zou zijn
      in verband met de algehele situatie aldaar, of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: 29.1.e
    text: |-
      die als echtgenoot of echtgenote of minderjarig kind feitelijk behoort tot het gezin van de vreemdeling, bedoeld
      onder a tot en met d, die dezelfde nationaliteit heeft als die vreemdeling en gelijktijdig met deze vreemdeling
      Nederland is ingereisd dan wel is nagereisd binnen drie maanden, nadat aan de vreemdeling, bedoeld onder a tot en
      met d, de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 29.1.f
    text: |-
      die als partner of als meerderjarig kind zodanig afhankelijk is van de vreemdeling, bedoeld onder a tot en met
      d, dat hij om die reden behoort tot het gezin van deze vreemdeling, die dezelfde nationaliteit heeft als deze
      vreemdeling en gelijktijdig met deze vreemdeling Nederland is ingereisd dan wel is nagereisd binnen drie maanden,
      nadat aan de vreemdeling, bedoeld onder a tot en met d, de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '29.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid,
      aanhef en onder a en b. Daarbij wordt bepaald in welke gevallen een verblijfsvergunning als bedoeld in het eerste
      lid wordt verleend aan de vreemdeling, bedoeld in onderdeel a of b.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: '29.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden indicatoren aangewezen die in ieder geval worden betrokken
      in de beoordeling of er sprake is van een situatie als bedoeld in het eerste lid, onder d.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
  - number: '29.4'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1], kan eveneens worden verleend aan een
      gezinslid als bedoeld in het eerste lid, onder e en f, dat slechts niet uiterlijk binnen drie maanden is nagereisd
      nadat aan de vreemdeling, bedoeld in het eerste lid, onder a tot en met d, een verblijfsvergunning als bedoeld in
      artikel 28 is verleend, indien binnen die drie maanden door of ten behoeve van dat gezinslid een machtiging tot
      voorlopig verblijf is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '30.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]
      wordt afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 30.1.a
    text: |-
      een ander land, partij bij het Vluchtelingenverdrag ingevolge een verdrag of een dit land en Nederland bindend
      besluit van een volkenrechtelijke organisatie verantwoordelijk is voor de behandeling van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel30
  - number: 30.1.b
    text: |-
      de vreemdeling reeds rechtmatig verblijf heeft, als bedoeld in [artikel 8, onder a tot en met e of l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 30.1.c
    text: |-
      de vreemdeling eerder een aanvraag voor verlening van een verblijfsvergunning heeft ingediend waarop nog
      niet onherroepelijk is beslist en hij op grond van die aanvraag rechtmatig verblijf heeft als bedoeld in
      [artikel 8 onder f, g en h][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 30.1.d
    text: |-
      de vreemdeling op grond van een verdragsverplichting tussen Nederland en een ander land zal worden overgedragen
      aan dat land van eerder verblijf, terwijl dat land partij is bij het Vluchtelingenverdrag, het Verdrag tot
      bescherming van de rechten van de mens en de fundamentele vrijheden (Trb. 1951, 154) en het Verdrag tegen foltering
      en andere wrede, onmenselijke of onterende behandeling of bestraffing (Trb. 1985, 69), dan wel zich anderszins
      heeft verplicht artikel 33 van het Vluchtelingenverdrag, [artikel 3 van het Verdrag tot bescherming van de rechten
      van de mens en de fundamentele vrijheden](onbekend) en [artikel 3 van het Verdrag tegen foltering en andere wrede
      onmenselijke of onterende behandeling of bestraffing](onbekend), na te leven.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel30
  - number: '30.2'
    text: |-
      Het eerste lid, onder b, is niet van toepassing, indien naar aanleiding van een aanvraag tot het verlenen
      van de verblijfsvergunning, bedoeld in [artikel 28][ref1], ambtshalve de verblijfsvergunning, bedoeld in
      [artikel 14][ref2], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '30.3'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid, onder d.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel30
  - number: '31.1'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1]
      wordt afgewezen indien de vreemdeling niet aannemelijk heeft gemaakt dat zijn aanvraag is gegrond op omstandigheden
      die, hetzij op zich zelf, hetzij in verband met andere feiten, een rechtsgrond voor verlening vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '31.2'
    text: 'Bij het onderzoek naar de aanvraag wordt mede betrokken de omstandigheid dat:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.a
    text: |-
      de vreemdeling reeds eerder, onder een andere naam, een aanvraag voor een verblijfsvergunning in Nederland heeft
      ingediend;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.b
    text: |-
      de vreemdeling zonder geldige reden niet heeft voldaan aan de aanwijzingen, bedoeld in [artikel 55][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel55
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 31.2.c
    text: |-
      de vreemdeling niet beschikt over een voor toegang tot Nederland vereist document voor grensoverschrijding, tenzij
      hij zich onverwijld onder opgave van de plaats waar of waarlangs hij Nederland is binnengekomen heeft vervoegd bij
      een ambtenaar, belast met de grensbewaking of het toezicht op vreemdelingen, en daar kenbaar heeft gemaakt dat hij
      asiel wenst;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.d
    text: |-
      de vreemdeling ter staving van zijn aanvraag valse of vervalste reis- of identiteitspapieren dan wel andere
      bescheiden heeft overgelegd en, hoewel daaromtrent ondervraagd, opzettelijk de echtheid daarvan heeft volgehouden;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.e
    text: |-
      de vreemdeling ter staving van zijn aanvraag opzettelijk reis- of identiteitspapieren dan wel andere bescheiden
      heeft overgelegd die niet op hem betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.f
    text: |-
      de vreemdeling ter staving van zijn aanvraag geen reis- of identiteitspapieren dan wel andere bescheiden kan
      overleggen die noodzakelijk zijn voor de beoordeling van zijn aanvraag, tenzij de vreemdeling aannemelijk kan maken
      dat het ontbreken van deze bescheiden niet aan hem is toe te rekenen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.g
    text: |-
      de vreemdeling afkomstig is uit een land dat partij is bij het Vluchtelingenverdrag en één van de andere in
      [artikel 30, onder d][ref1], bedoelde verdragen en de vreemdeling niet aannemelijk heeft gemaakt dat het die
      verdragsverplichtingen ten aanzien van hem niet nakomt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 31.2.h
    text: |-
      de vreemdeling heeft verbleven in een derde land dat partij is bij het Vluchtelingenverdrag en één van de in
      [artikel 30, onder d][ref1], bedoelde verdragen en de vreemdeling niet aannemelijk heeft gemaakt dat het die
      verdragsverplichtingen ten aanzien van hem niet nakomt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 31.2.i
    text: |-
      de vreemdeling in een land van eerder verblijf zal worden toegelaten totdat hij elders duurzame bescherming zal
      hebben gevonden;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.j
    text: |-
      de vreemdeling elders een verblijfsalternatief heeft omdat hij voorafgaand aan zijn komst naar Nederland heeft
      verbleven in een ander land dan het land van herkomst;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.k
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31.2.l
    text: |-
      de vreemdeling afkomstig is uit een land dat ingevolge artikel 29 van de richtlijn asielprocedures door de Raad is
      opgenomen in de in dat artikel bedoelde gemeenschappelijke minimumlijst van derde landen die als veilig land van
      herkomst worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: '31.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid en
      het tweede lid, onder g tot en met l.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31
  - number: 31a.1
    text: |-
      De aanvraag wordt niet aangemerkt als herhaalde aanvraag als bedoeld in
      [artikel 4:6 van de Algemene wet bestuursrecht][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 31a.1.a)
    text: |-
      een eerdere aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28][ref1] is afgewezen op grond van [artikel 30, eerste lid, onder d][ref2], of met toepassing van
      [artikel 31, tweede lid, onder h][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 31a.1.b)
    text: het betrokken derde land de vreemdeling niet tot zijn grondgebied heeft toegelaten, en
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31a
  - number: 31a.1.c)
    text: |-
      de vreemdeling wederom een aanvraag indient tot het verlenen van een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 31a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel31a
  - number: '32.1'
    text: |-
      De verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] kan worden ingetrokken dan wel de
      aanvraag voor verlenging van de geldigheidsduur ervan kan worden afgewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 32.1.a
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de oorspronkelijke aanvraag tot het verlenen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel32
  - number: 32.1.b
    text: de vreemdeling een gevaar vormt voor de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel32
  - number: 32.1.c
    text: |-
      de grond voor verlening, bedoeld in [artikel 29][ref1], is komen te vervallen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 32.1.d
    text: de vreemdeling zijn hoofdverblijf buiten Nederland heeft gevestigd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel32
  - number: '32.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
      Daarbij wordt bepaald in welke gevallen een verblijfsvergunning als bedoeld in het eerste lid die is verleend op
      grond van [artikel 29, eerste lid, onder a of b][ref1], wordt ingetrokken dan wel de aanvraag voor verlenging van
      de geldigheidsduur van zodanige verblijfsvergunning wordt afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '33'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel33
  - number: 33.a
    text: |-
      de aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd in te willigen, af te wijzen dan wel
      niet in behandeling te nemen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel33
  - number: 33.b
    text: een verleende verblijfsvergunning voor onbepaalde tijd in te trekken.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel33
  - number: '34.1'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1]
      van de vreemdeling die direct voorafgaande aan de aanvraag, gedurende vijf achtereenvolgende jaren rechtmatig
      verblijf heeft genoten als bedoeld in [artikel 8, onder c][ref2], kan slechts worden afgewezen indien zich op het
      moment waarop de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref3],
      afloopt, een grond als bedoeld in [artikel 32][ref4] voordoet, dan wel indien de vreemdeling het examen, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van de Wet inburgering][ref5], of een diploma, certificaat of ander document,
      bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref6], niet heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0020611
        artikel: '5'
  - number: '34.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het
      inburgeringsvereiste, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel34
  - number: '35.1'
    text: |-
      De verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1] kan worden ingetrokken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 35.1.a
    text: |-
      de vreemdeling onjuiste gegevens heeft verstrekt dan wel gegevens heeft achtergehouden terwijl die gegevens tot
      afwijzing van de aanvraag tot het verlenen of verlengen zouden hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel35
  - number: 35.1.b
    text: |-
      de vreemdeling bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen
      een gevangenisstraf van drie jaren of meer is bedreigd, dan wel hem terzake de maatregel, bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1], is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 35.1.c
    text: de vreemdeling zijn hoofdverblijf buiten Nederland heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel35
  - number: 35.1.d
    text: de vreemdeling een gevaar vormt voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel35
  - number: '35.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel35
  - number: '36'
    text: 'De aanvraag tot het verlenen van:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel36
  - number: 36.a
    text: |-
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] of tot het verlengen van de
      geldigheidsduur ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 36.b
    text: |-
      een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '37.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel37
  - number: 37.1.a
    text: de wijze van indiening en behandeling van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel37
  - number: 37.1.b
    text: de wijze waarop het onderzoek naar de aanvraag, daaronder begrepen het horen van de vreemdeling, wordt ingericht;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel37
  - number: 37.1.c
    text: de gegevens die de vreemdeling in persoon moet verstrekken;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel37
  - number: 37.1.d
    text: |-
      de wijze waarop beschikkingen bij of krachtens deze wet ten aanzien van de vreemdeling gegeven, alsmede de bij
      of krachtens deze wet voorgeschreven kennisgevingen, mededelingen of berichten aan de vreemdeling of aan andere
      belanghebbenden worden bekendgemaakt. Daarbij kan worden bepaald, dat de bekendmaking van beschikkingen ook kan
      geschieden door middel van het toezenden of uitreiken van een document en door het stellen van aantekeningen in een
      daarbij aan te wijzen document.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel37
  - number: '37.2'
    text: |-
      De vreemdeling is, volgens door Onze Minister te geven regels, leges verschuldigd terzake van de afdoening
      van een aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33][ref1]. Daarbij kan Onze
      Minister bepalen dat de vreemdeling voor de afgifte van het document waaruit het rechtmatig verblijf blijkt leges
      verschuldigd is. Als betaling achterwege blijft, wordt de aanvraag niet in behandeling genomen dan wel het document
      niet afgegeven. [Artikel 4:5, vierde lid, Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '38'
    text: |-
      Indien de vreemdeling in de gelegenheid wordt gesteld zich omtrent de aanvraag tot het verlenen van een
      verblijfsvergunning of het verlengen van de geldigheidsduur ervan te doen horen, wordt de vreemdeling gehoord in
      een taal waarvan redelijkerwijze kan worden aangenomen dat hij die kan verstaan.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel38
  - number: '39.1'
    text: |-
      Indien Onze Minister voornemens is de aanvraag tot het verlenen van een verblijfsvergunning of het verlengen van
      de geldigheidsduur ervan af te wijzen, dan wordt de vreemdeling hiervan, onder opgave van redenen, schriftelijk
      mededeling gedaan. De mededeling kan eveneens betrekking hebben op het voornemen om niet ambtshalve een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14][ref1] te verlenen dan wel op het voornemen om
      de uitzetting niet op grond van [artikel 64][ref2] achterwege te laten. Het schriftelijke voornemen wordt aan de
      vreemdeling meegedeeld door uitreiking of toezending ervan. De op de aanvraag betrekking hebbende stukken worden
      bij de schriftelijke mededeling gevoegd, voor zover de vreemdeling geen kennis kan hebben van de inhoud van deze
      stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '39.2'
    text: |-
      De vreemdeling brengt zijn zienswijze, in afwijking van [artikel 4:9 van de Algemene wet bestuursrecht][ref1],
      schriftelijk naar voren binnen de door Onze Minister bepaalde redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '39.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 37][ref1], worden regels gesteld omtrent de termijn,
      bedoeld in het tweede lid, alsmede de toepassing van de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel37
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: '40'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1]
      kan niet eerder worden ingediend dan vier weken voordat de vreemdeling gedurende vijf achtereenvolgende jaren
      rechtmatig verblijf als bedoeld in [artikel 8, onder c][ref2], heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '41.1'
    text: |-
      Indien Onze Minister voornemens is om de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1],
      dan wel de verblijfsvergunning voor onbepaalde tijd, bedoeld in [artikel 33][ref2], in te trekken, zijn de
      [artikelen 38][ref3] en [39][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: '41.2'
    text: |-
      Indien Onze Minister, na ontvangst van de zienswijze van de vreemdeling, voornemens blijft de verblijfsvergunning
      in te trekken, dan wordt de vreemdeling in de gelegenheid gesteld zich te doen horen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel41
  - number: '42.1'
    text: |-
      Op de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1],
      dan wel een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref2], wordt binnen zes maanden na
      ontvangst van de aanvraag een beschikking gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '42.2'
    text: |-
      De inwilliging van de aanvraag is mede afgestemd op het beleid dat Onze Minister na overleg met Onze Minister van
      Buitenlandse Zaken dienaangaande voert.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel42
  - number: '42.3'
    text: |-
      Indien de aanvraag wordt afgewezen, wordt in de beschikking ingegaan op de zienswijze van de vreemdeling. In de
      beschikking wordt tevens ingegaan op de zienswijze van de vreemdeling op het voornemen om niet ambtshalve een
      verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14][ref1], te verlenen, dan wel op het voornemen om
      de uitzetting niet op grond van [artikel 64][ref2] achterwege te laten indien hem van dat voornemen mededeling
      is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '42.4'
    text: |-
      De termijn voor het geven van de beschikking, bedoeld in het eerste lid, kan ten hoogste voor zes maanden worden
      verlengd indien naar het oordeel van Onze Minister voor de beoordeling van de aanvraag advies van of onderzoek door
      derden of het openbaar ministerie nodig is.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel42
  - number: '42.5'
    text: Onze Minister stelt de vreemdeling in kennis van de verlenging.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel42
  - number: '43'
    text: |-
      Onverminderd [artikel 42, vierde lid][ref1], en [artikel 4:5 van de Algemene wet bestuursrecht][ref2] kan bij
      besluit van Onze Minister voor bepaalde categorieën vreemdelingen die een aanvraag tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref3] hebben ingediend de termijn, bedoeld in
      [artikel 42][ref4] worden verlengd met ten hoogste één jaar indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel42
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 43.a
    text: |-
      naar verwachting voor een korte periode onzekerheid zal bestaan over de situatie in het land van herkomst
      en op grond daarvan redelijkerwijs niet kan worden beslist of de aanvraag op een van de gronden genoemd in
      [artikel 29][ref1] kan worden toegewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 43.b
    text: |-
      naar verwachting de situatie in het land van herkomst op grond waarvan ingevolge [artikel 29][ref1] de aanvraag kan
      worden toegewezen, van korte duur zal zijn, of,


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 43.c
    text: |-
      het aantal ingediende aanvragen uit een bepaald land of uit een bepaalde regio zo groot is, dat Onze Minister
      redelijkerwijs niet in staat is daarop tijdig een beschikking te geven.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel43
  - number: 43a.1
    text: |-
      In afwijking van [artikel 42, eerste lid][ref1], en onverminderd
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2], wordt de beschikking op de aanvraag tot het verlenen van
      de verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref3] ten aanzien van vreemdelingen die
      tijdelijke bescherming genieten, op een tijdstip gelegen tussen de ontvangst van de aanvraag en zes maanden na
      afloop van de tijdelijke bescherming gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 43a.2
    text: |-
      De [artikelen 42, vierde lid][ref1], en [43][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel43
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '44.1'
    text: |-
      Verlening van de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1], die rechtmatig
      verblijf inhoudt, heeft van rechtswege tot gevolg de beëindiging van de verstrekkingen voorzien bij
      of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref2] of een ander wettelijk voorschrift dat
      soortgelijke verstrekkingen regelt. De verstrekkingen worden beëindigd op de wijze voorzien bij of krachtens
      de [Wet Centraal Orgaan opvang asielzoekers][ref3] of in het andere wettelijk voorschrift en binnen de daartoe
      gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006685
      [ref3]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006685
      - id: ref3
        bwb_id: BWBR0006685
  - number: '44.2'
    text: |-
      De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 28][ref1], wordt verleend met ingang van de datum
      waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet eerder dan met ingang van de
      datum waarop de aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '44.3'
    text: |-
      De verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33][ref1] wordt verleend met ingang van de
      datum waarop de vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '44.4'
    text: |-
      Indien de vreemdeling de aanvraag tot verlenging van de verblijfsvergunning bedoeld in [artikel 28][ref1], dan
      wel de gegevens waaruit blijkt dat aan de voorwaarden wordt voldaan niet tijdig heeft ingediend en hem dit niet is
      toe te rekenen, kan de verblijfsvergunning worden verlengd met ingang van de dag na die waarop de geldigheidsduur
      van de verblijfsvergunning waarvoor verlenging is gevraagd afloopt. De voorgaande volzin is van overeenkomstige
      toepassing op de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in [artikel 33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: '45.1'
    text: |-
      De beschikking waarbij een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld
      in [artikel 28][ref1], of voor onbepaalde tijd, bedoeld in [artikel 33][ref2], wordt afgewezen, geldt als
      terugkeerbesluit, tenzij reeds eerder een terugkeerbesluit tegen de vreemdeling is uitgevaardigd en aan de daaruit
      voortvloeiende terugkeerverplichting niet is voldaan, en heeft van rechtswege tot gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
  - number: 45.1.a
    text: |-
      de vreemdeling niet langer rechtmatig in Nederland verblijft tenzij een andere rechtsgrond voor rechtmatig verblijf
      als bedoeld in [artikel 8][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 45.1.b
    text: |-
      de vreemdeling Nederland uit eigen beweging dient te verlaten binnen de in [artikel 62][ref1] gestelde termijn, bij
      gebreke waarvan de vreemdeling kan worden uitgezet;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 45.1.c
    text: |-
      de verstrekkingen voorzien bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref1] of een ander
      wettelijk voorschrift dat soortgelijke verstrekkingen regelt worden beëindigd op de bij of krachtens die wet of dat
      wettelijke voorschrift voorziene wijze en binnen de daartoe gestelde termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006685
  - number: 45.1.d
    text: |-
      de ambtenaren belast met het toezicht op vreemdelingen na ommekomst van de termijn waarbinnen de vreemdeling
      Nederland uit eigen beweging dient te verlaten, bevoegd zijn elke plaats te betreden, daaronder begrepen een woning
      zonder toestemming van de bewoner, teneinde de vreemdeling uit te zetten;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
  - number: 45.1.e
    text: |-
      de ambtenaren belast met het toezicht op vreemdelingen bevoegd zijn na ommekomst van de termijn als bedoeld in
      onderdeel c een onroerende zaak gedwongen te ontruimen teneinde het onderdak of het verblijf in de woonruimte als
      verstrekking geboden, bedoeld in onderdeel c, te beëindigen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
  - number: '45.2'
    text: 'Het eerste lid is van overeenkomstige toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
  - number: 45.2.a
    text: |-
      ingevolge [artikel 4:5 van de Algemene wet bestuursrecht][ref1] is besloten dat de aanvraag niet in behandeling
      wordt genomen, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 45.2.b
    text: een verblijfsvergunning is ingetrokken of niet verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
  - number: '45.3'
    text: |-
      De in het eerste lid bedoelde gevolgen van de beschikking treden niet in zolang het beroep van de vreemdeling de
      werking van de beschikking opschort.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
  - number: '45.4'
    text: |-
      Onze Minister kan besluiten dat, in afwijking van het eerste lid, aanhef en onder c, de verstrekkingen voorzien bij
      of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref1] of een ander wettelijk voorschrift dat soortgelijke
      verstrekkingen regelt, voor bepaalde categorieën vreemdelingen niet worden beëindigd, of voor de duur van het
      besluit opnieuw worden verleend. Het besluit wordt uiterlijk één jaar na de bekendmaking ervan ingetrokken. Na
      afloop van de duur van het besluit treden de opgeschorte rechtsgevolgen opnieuw in.


      [ref1]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006685
  - number: '45.5'
    text: |-
      De vreemdeling op wie het besluit als bedoeld in het vierde lid van toepassing is, wordt geacht rechtmatig verblijf
      als bedoeld in [artikel 8, onder j][ref1], te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '45.6'
    text: |-
      De in het eerste lid bedoelde gevolgen van de beschikking treden niet in zolang de uitzetting van de vreemdeling
      op grond van de richtlijn tijdelijke bescherming achterwege blijft. De reeds ingetreden gevolgen worden opgeschort,
      indien Onze Minister heeft vastgesteld dat uitzetting op grond van de richtlijn tijdelijke bescherming achterwege
      blijft. De opgeschorte gevolgen, bedoeld in het eerste lid, treden opnieuw in na afloop van de tijdelijke
      bescherming.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
  - number: '45.7'
    text: |-
      Het verblijf van de vreemdeling, bedoeld in het zesde lid, wordt gelijkgesteld met rechtmatig verblijf in de zin
      van [artikel 8, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '45.8'
    text: De beschikking, bedoeld in het eerste lid, kan tevens een inreisverbod inhouden.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel45
  - number: '46.1'
    text: |-
      Met het toezicht op de naleving en de uitvoering van de Schengengrenscode en de wettelijke voorschriften met
      betrekking tot de grensbewaking zijn belast:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
  - number: 46.1.a
    text: de ambtenaren van de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
  - number: 46.1.b
    text: |-
      de ambtenaren die zijn tewerkgesteld bij de regionale eenheid in het gebied waarin de haven van Rotterdam is
      gelegen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
  - number: 46.1.c
    text: |-
      de directeur van een grenslogies als bedoeld in [artikel 3 van het Reglement regime grenslogies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005848#Artikel3
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005848
        artikel: '3'
  - number: 46.1.d
    text: |-
      de bij besluit van Onze Minister, in overeenstemming met Onze Ministers van Binnenlandse
      Zaken en Koninkrijksrelaties en van Defensie, aangewezen ambtenaren van politie als bedoeld in
      [artikel 2, onder a, c en d, van de Politiewet 2012][ref1] die zijn aangesteld voor de uitvoering van de
      politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '46.2'
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
  - number: 46.2.a
    text: de in het belang van de grensbewaking te treffen voorzieningen;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
  - number: 46.2.b
    text: de verplichtingen waaraan personen zijn onderworpen met het oog op de controle in het belang van de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
  - number: '46.3'
    text: |-
      De bij of krachtens het eerste lid aangewezen ambtenaren belast met de grensbewaking zijn de in artikel 2, onder
      13, van de Schengengrenscode bedoelde grenswachters.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel46
  - number: '47.1'
    text: 'Met het toezicht op de naleving van de wettelijke voorschriften met betrekking tot vreemdelingen zijn belast:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47
  - number: 47.1.a
    text: |-
      de ambtenaren van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn
      aangesteld voor de uitvoering van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 47.1.b
    text: de ambtenaren van de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47
  - number: 47.1.c
    text: de bij besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47
  - number: '47.2'
    text: |-
      De ambtenaren van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn
      aangesteld voor de uitvoering van de politietaak oefenen het toezicht op vreemdelingen uit onder leiding van de
      korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '47.3'
    text: |-
      De ambtenaren van de Koninklijke marechaussee oefenen het toezicht op vreemdelingen uit onder leiding van de
      Commandant der Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47
  - number: 47a.1
    text: |-
      Met het toezicht op de naleving van de wettelijke voorschriften met betrekking tot referenten zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47a
  - number: 47a.2
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister en Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties kan worden bepaald dat met het toezicht op de naleving van de wettelijke
      voorschriften met betrekking tot referenten tevens zijn belast de ambtenaren van politie, bedoeld in
      [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn aangesteld voor de uitvoering van de
      politietaak, in welk geval [artikel 47, tweede lid][ref2], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '48.1'
    text: |-
      De korpschef en de Commandant der Koninklijke marechaussee geven Onze Minister door hem gevraagde inlichtingen over
      de uitvoering van deze wet en van de Schengengrenscode.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister kan aan de korpschef en aan de Commandant der Koninklijke marechaussee aanwijzingen geven over
      de uitvoering van deze wet en van de Schengengrenscode. Onze Minister kan individuele aanwijzingen geven aan de
      ambtenaren, bedoeld in de [artikelen 47, eerste lid][ref1], en [47a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 47a
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '48.3'
    text: 'Onze Minister kan aanwijzingen geven over de inrichting van de werkprocessen en bedrijfsvoering aan:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel48
  - number: 48.3.a
    text: de korpschef, door tussenkomst van Onze Minister van Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel48
  - number: 48.3.b
    text: de Commandant der Koninklijke marechaussee, door tussenkomst van de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel48
  - number: '48.4'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel48
  - number: '49.1'
    text: |-
      Op de uitoefening van de in deze paragraaf bedoelde bevoegdheden zijn, voor zover nodig, de artikelen [5:12][ref1],
      [5:13][ref2] en [5: 20 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '49.2'
    text: |-
      Op de uitoefening door de ambtenaren belast met de grensbewaking van de uit de Schengengrenscode voortvloeiende
      taken zijn de [artikelen 5:12][ref1], [5:13][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] eveneens van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '50.1'
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen, zijn bevoegd,
      hetzij op grond van feiten en omstandigheden die, naar objectieve maatstaven gemeten, een redelijk vermoeden van
      illegaal verblijf opleveren hetzij ter bestrijding van illegaal verblijf na grensoverschrijding, personen staande
      te houden ter vaststelling van hun identiteit, nationaliteit en verblijfsrechtelijke positie. Degene die stelt
      Nederlander te zijn, maar dat niet kan aantonen, kan worden onderworpen aan de dwangmiddelen als bedoeld in het
      tweede en vijfde lid. Bij algemene maatregel van bestuur worden de documenten aangewezen waarover een vreemdeling
      moet beschikken ter vaststelling van zijn identiteit, nationaliteit en verblijfsrechtelijke positie.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel50
  - number: '50.2'
    text: |-
      Indien de identiteit van de staande gehouden persoon niet onmiddellijk kan worden vastgesteld, mag hij worden
      overgebracht naar een plaats bestemd voor verhoor. Hij wordt aldaar niet langer dan gedurende zes uren opgehouden,
      met dien verstande, dat de tijd tussen middernacht en negen uur voormiddags niet wordt meegerekend.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de identiteit van de staande gehouden persoon onmiddellijk kan worden vastgesteld en indien blijkt dat deze
      persoon geen rechtmatig verblijf geniet, dan wel niet onmiddellijk blijkt dat hij rechtmatig verblijf heeft, mag
      hij worden overgebracht naar een plaats bestemd voor verhoor. Hij wordt aldaar niet langer dan gedurende zes uren
      opgehouden, met dien verstande, dat de tijd tussen middernacht en negen uur voormiddags niet wordt meegerekend.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel50
  - number: '50.4'
    text: |-
      Indien nog grond bestaat voor het vermoeden dat de opgehouden persoon geen rechtmatig verblijf heeft, kan de in
      het tweede en derde lid bepaalde termijn door de Commandant der Koninklijke marechaussee respectievelijk door de
      korpschef in het belang van het onderzoek met ten hoogste acht en veertig uren worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel50
  - number: '50.5'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd de opgehouden persoon aan diens kleding of lichaam te
      onderzoeken, alsmede zaken van deze persoon te doorzoeken.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel50
  - number: '50.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gegeven omtrent de toepassing van de voorgaande leden van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel50
  - number: '51.1'
    text: |-
      Indien de ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen op
      grond van feiten en omstandigheden, naar objectieve maatstaven gemeten, een redelijk vermoeden hebben dat met
      een vervoermiddel personen worden vervoerd met betrekking tot wie zij een toezichthoudende taak hebben, zijn
      zij bevoegd het vervoermiddel te onderzoeken. De ambtenaren zijn in dat geval bevoegd van de bestuurder van het
      voertuig of van de schipper van het vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hen
      aangewezen plaats overbrengt teneinde het vervoermiddel te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel51
  - number: '51.2'
    text: |-
      [Artikel 5:19, vijfde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de
      vordering als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.3'
    text: |-
      Indien de ambtenaren belast met de grensbewaking op grond van feiten en omstandigheden, naar objectieve maatstaven
      gemeten, een redelijk vermoeden hebben dat met een luchtvaartuig personen worden vervoerd met betrekking tot wie
      zij een toezichthoudende taak hebben, zijn zij bevoegd het luchtvaartuig te onderzoeken. De ambtenaren zijn in dat
      geval bevoegd van de gezagvoerder van een luchtvaartuig te vorderen dat deze zijn luchtvaartuig naar een door hen
      aangewezen plaats overbrengt teneinde het luchtvaartuig te onderzoeken. Bij of krachtens algemene maatregel van
      bestuur kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel51
  - number: '52.1'
    text: |-
      Onze Minister, de ambtenaren, belast met de grensbewaking, en de ambtenaren, belast met het toezicht op
      vreemdelingen, zijn bevoegd om, ter vervulling van hun taken, reis- en identiteitspapieren van personen in te
      nemen, tijdelijk in bewaring te nemen alsmede om hierin aantekeningen te maken. Bij of krachtens algemene maatregel
      van bestuur worden hierover nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel52
  - number: '52.2'
    text: |-
      Het reis- of identiteitspapier wordt aan de vreemdeling teruggegeven indien hij te kennen geeft Nederland te
      willen verlaten en hij ook daadwerkelijk vertrekt. Ingeval van uitzetting kan het reis- en identiteitspapier worden
      overgedragen aan de persoon belast met de grensbewaking in het land waar de toelating is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel52
  - number: '53.1'
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      een woning te betreden zonder toestemming van de bewoner, indien er op grond van feiten en omstandigheden, naar
      objectieve maatstaven gemeten, een redelijk vermoeden bestaat dat op deze plaats een vreemdeling verblijft die geen
      rechtmatig verblijf heeft.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel53
  - number: '53.2'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn tevens bevoegd elke plaats te betreden, daar onder begrepen een
      woning zonder de toestemming van de bewoner, voor zover dat nodig is ter uitzetting van de vreemdeling dan wel voor
      de inbewaringstelling van de vreemdeling op grond van [artikel 59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: '54.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ten aanzien van vreemdelingen worden voorzien in een
      verplichting tot:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.a
    text: het kennis geven van verandering van woon- of verblijfplaats binnen Nederland en van vertrek naar het buitenland;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.b
    text: |-
      het al dan niet in persoon verstrekken van gegevens welke van belang kunnen zijn voor de toepassing van de bij of
      krachtens deze wet gestelde regels;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.c
    text: het verlenen van medewerking aan het vastleggen van gegevens met het oog op identificatie;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.d
    text: |-
      het verlenen van medewerking aan een medisch onderzoek naar een ziekte aangewezen bij of krachtens de
      Infectieziektewet, ter bescherming van de volksgezondheid of in het kader van de beoordeling van een aanvraag om
      een verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.e
    text: aanmelding binnen een bepaalde termijn na binnenkomst in Nederland;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.f
    text: periodieke aanmelding;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.g
    text: |-
      het inleveren van het document of schriftelijke verklaring als bedoeld in [artikel 9][ref1] waaruit het rechtmatig
      verblijf blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 54.1.h
    text: het stellen van zekerheid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.1.i
    text: het overleggen van documenten, anders dan bedoeld onder g.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: '54.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt ten aanzien van referenten en gewezen referenten voorzien in
      verplichtingen tot:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.2.a
    text: |-
      het al dan niet in persoon verstrekken van gegevens en bescheiden welke van belang kunnen zijn voor de toepassing
      van de bij of krachtens deze wet gestelde regels, en
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: 54.2.b
    text: het administreren en beheren van gegevens en bescheiden als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: '54.3'
    text: |-
      In gevallen waarin Onze Minister zulks in het belang van de openbare orde of de nationale veiligheid nodig
      oordeelt, kan hij aan een vreemdeling een individuele verplichting tot periodieke aanmelding bij de korpschef
      opleggen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel54
  - number: '55.1'
    text: |-
      De vreemdeling die rechtmatig verblijf geniet op grond van [artikel 8, onder f][ref1], dient zich, in verband met
      het onderzoek naar de inwilligbaarheid van de aanvraag om een verblijfsvergunning beschikbaar te houden op een door
      Onze Minister aangewezen plaats, overeenkomstig hem daartoe door de bevoegde autoriteit gegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '55.2'
    text: |-
      Ter ondersteuning van het onderzoek of een aanvraag tot het verlenen van de verblijfsvergunning als bedoeld
      in [artikel 28][ref1] kan worden ingewilligd, zijn de ambtenaren belast met de grensbewaking en de ambtenaren
      belast met het toezicht op vreemdelingen bevoegd om een vreemdeling staande te houden en aan diens kleding of
      lichaam te onderzoeken, alsmede zijn bagage te doorzoeken met het oog op eventuele aanwezigheid van reis- of
      identiteitspapieren, documenten of bescheiden, die noodzakelijk zijn voor de beoordeling van zijn aanvraag. Gelijke
      bevoegdheid bestaat indien de vreemdeling te kennen geeft een aanvraag te willen indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '55.3'
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      een vreemdeling die zich in verband met het onderzoek op een plaats als bedoeld in het eerste lid bevindt, dan wel
      een vreemdeling die zich in een verwijdercentrum bevindt, aan diens kleding of lichaam te onderzoeken, alsmede zijn
      bagage te doorzoeken met het oog op de veiligheid op die plaats.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel55
  - number: 55a.1
    text: |-
      Onze Minister kan bij een overtreding van de verplichtingen neergelegd in
      [artikelen 2a, tweede lid, onder b][ref1], [2t, tweede en derde lid][ref2], [24a, tweede en derde lid][ref3],
      [54, eerste lid, onder a tot en met e en g, en tweede lid][ref4], een bestuurlijke boete opleggen van ten hoogste
      € 3000 voor ondernemingen, rechtspersonen en andere organisaties en € 1500 voor natuurlijke personen. Bij regeling
      van Onze Minister kunnen nadere regels worden gesteld omtrent de hoogte van de bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2t
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2t
        hoofdstuk: 1a
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 24a
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: 55a.2
    text: Het rapport vermeldt in ieder geval de bij het beboetbare feit betrokken persoon of personen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel55a
  - number: 55a.3
    text: |-
      Onze Minister kan de bestuurlijke boete verhogen met 50%, indien op de dag van het constateren van de overtreding
      nog geen 24 maanden zijn verstreken nadat een eerdere overtreding van eenzelfde wettelijke verplichting is
      geconstateerd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel55a
  - number: '56.1'
    text: |-
      Overeenkomstig bij algemene maatregel van bestuur te geven regels kan, indien het belang van de openbare orde of de
      nationale veiligheid zulks vordert, door Onze Minister de vrijheid van beweging worden beperkt van de vreemdeling
      die:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel56
  - number: 56.1.a
    text: geen rechtmatig verblijf heeft;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel56
  - number: 56.1.b
    text: |-
      rechtmatig verblijf heeft op grond van [artikel 8, met uitzondering van de onderdelen b, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '56.2'
    text: |-
      Toepassing van het eerste lid blijft achterwege wanneer en wordt beëindigd zodra de vreemdeling te kennen geeft
      Nederland te willen verlaten en hiertoe voor hem ook gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel56
  - number: '57.1'
    text: |-
      Onze Minister kan de vreemdeling wiens aanvraag om een verblijfsvergunning als bedoeld in [artikel 28][ref1]
      is afgewezen de aanwijzing geven zich op te houden in een bepaalde ruimte of op een bepaalde plaats en aldaar
      de aanwijzingen van de bevoegde autoriteit in acht te nemen, ook indien de beschikking waarbij de aanvraag is
      afgewezen nog niet onherroepelijk is dan wel het beroep de werking van de beschikking opschort.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '57.2'
    text: Op aanvraag van de vreemdeling kan een andere ruimte of plaats worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel57
  - number: '57.3'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid blijft achterwege indien de vrijheid van beweging van de vreemdeling
      is beperkt in verband met het onderzoek naar de aanvraag om een verblijfsvergunning en de vreemdeling zich
      daadwerkelijk beschikbaar heeft gehouden en de beschikking tot afwijzing meer dan acht weken na de indiening van de
      aanvraag is gegeven.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel57
  - number: '57.4'
    text: |-
      De aanwijzing, bedoeld in het eerste lid, vervalt indien de beschikking waarbij de aanvraag is afgewezen is
      vernietigd of zodra het vertrek van de vreemdeling uit de ruimte of plaats nodig is om Nederland te verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel57
  - number: '57.5'
    text: |-
      De termijn, bedoeld in het derde lid, wordt opgeschort gedurende de termijn waarin de vreemdeling de beperking van
      zijn bewegingsvrijheid niet in acht heeft genomen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel57
  - number: '58.1'
    text: |-
      Indien zulks voor de uitzetting noodzakelijk is, kan Onze Minister in het geval, bedoeld in
      [artikel 57, eerste lid][ref1], de vreemdeling een ruimte of plaats aanwijzen, die is beveiligd tegen ongeoorloofd
      vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel57
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '57'
        hoofdstuk: '5'
  - number: '58.2'
    text: |-
      De [artikelen 6, derde lid][ref1], [57, tweede tot en met vijfde lid][ref2] en [59, derde lid][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '57'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: '59.1'
    text: |-
      Indien het belang van de openbare orde of de nationale veiligheid zulks vordert kan, met het oog op de uitzetting,
      door Onze Minister in bewaring worden gesteld de vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
  - number: 59.1.a
    text: geen rechtmatig verblijf heeft;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
  - number: 59.1.b
    text: |-
      die rechtmatig verblijf heeft op grond van [artikel 8, onder f, g en h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '59.2'
    text: |-
      Indien de voor de terugkeer van de vreemdeling noodzakelijke bescheiden voorhanden zijn, dan wel
      binnen korte termijn voorhanden zullen zijn, wordt het belang van de openbare orde geacht de bewaring
      van de vreemdeling te vorderen, tenzij de vreemdeling rechtmatig verblijf heeft gehad op grond van
      [artikel 8, onder a tot en met e, en l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '59.3'
    text: |-
      Bewaring van een vreemdeling blijft achterwege indien en wordt beëindigd zodra hij te kennen geeft Nederland te
      willen verlaten en hiertoe voor hem ook gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
  - number: '59.4'
    text: |-
      Bewaring krachtens het eerste lid, onder b, of het tweede lid duurt in geen geval langer dan vier weken. Indien
      voorafgaande aan de beslissing op de aanvraag toepassing is gegeven aan [artikel 39][ref1], duurt de bewaring
      krachtens het eerste lid, onder b, in geen geval langer dan zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel39
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
  - number: '59.5'
    text: Onverminderd het vierde lid duurt de bewaring krachtens het eerste lid niet langer dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
  - number: '59.6'
    text: |-
      In afwijking van het vijfde lid en onverminderd het vierde lid kan de bewaring krachtens het eerste lid ten hoogste
      met nog eens twaalf maanden worden verlengd, indien de uitzetting, alle redelijke inspanningen ten spijt, wellicht
      meer tijd zal vergen, op grond dat de vreemdeling niet meewerkt aan zijn uitzetting of de daartoe benodigde
      documentatie uit derde landen nog ontbreekt.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
  - number: '59.7'
    text: |-
      Het vijfde en zesde lid zijn van overeenkomstige toepassing op de vreemdeling aan wie de verplichting of maatregel,
      bedoeld in [artikel 6, eerste of tweede lid][ref1], dan wel [artikel 58][ref2] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel58
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '58'
        hoofdstuk: '5'
  - number: '60'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven omtrent de toepassing van dit
      hoofdstuk. Daarbij kan worden voorzien in de mogelijkheid van verhaal van de kosten van bewaring op de vreemdeling
      zelf en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel60
  - number: '61.1'
    text: |-
      De vreemdeling die niet of niet langer rechtmatig verblijf heeft, dient Nederland uit eigen beweging te verlaten
      binnen de in [artikel 62][ref1] bepaalde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: '61.2'
    text: |-
      Indien de werking van de beschikking, waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken, is
      opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van het vertrek uit Nederland.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel61
  - number: '61.3'
    text: |-
      Het indienen van een klacht als bedoeld in[ artikel 9:1 van de Algemene wet bestuursrecht][ref1] schort de
      verplichting, bedoeld in het eerste lid, niet op.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '62.1'
    text: |-
      Nadat tegen de vreemdeling een terugkeerbesluit is uitgevaardigd dan wel, indien het een gemeenschapsonderdaan
      betreft, nadat het rechtmatig verblijf van de vreemdeling is geëindigd, dient hij Nederland uit eigen beweging
      binnen vier weken te verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62
  - number: '62.2'
    text: |-
      Onze Minister kan de voor een vreemdeling geldende termijn, bedoeld in het eerste lid, verkorten, dan wel, in
      afwijking van het eerste lid, bepalen dat een vreemdeling Nederland onmiddellijk moet verlaten, indien:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62
  - number: 62.2.a
    text: een risico bestaat dat de vreemdeling zich aan het toezicht zal onttrekken;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62
  - number: 62.2.b
    text: |-
      de aanvraag van de vreemdeling tot het verlenen van een verblijfsvergunning of tot het verlengen van de
      geldigheidsduur van een verblijfsvergunning is afgewezen als kennelijk ongegrond of wegens het verstrekken van
      onjuiste of onvolledige gegevens; of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62
  - number: 62.2.c
    text: de vreemdeling een gevaar vormt voor de openbare orde, de openbare veiligheid of de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62
  - number: '62.3'
    text: |-
      Onze Minister kan de voor een vreemdeling geldende termijn, bedoeld in het eerste lid, verlengen, rekening houdend
      met de specifieke omstandigheden van het individuele geval. Bij ministeriële regeling worden regels gesteld over de
      duur van de verlenging en worden de gevallen aangewezen waarin de termijn kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62
  - number: 62a.1
    text: |-
      Onze Minister stelt de vreemdeling, niet zijnde gemeenschapsonderdaan, die niet of niet langer rechtmatig verblijf
      heeft, schriftelijk in kennis van de verplichting Nederland uit eigen beweging te verlaten en van de termijn
      waarbinnen hij aan die verplichting moet voldoen, tenzij:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62a
  - number: 62a.1.a
    text: |-
      reeds eerder een terugkeerbesluit tegen de vreemdeling is uitgevaardigd en aan de daaruit voortvloeiende
      terugkeerverplichting niet is voldaan,
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62a
  - number: 62a.1.b
    text: |-
      de vreemdeling in bezit is van een door een andere lidstaat afgegeven geldige verblijfsvergunning of andere
      toestemming tot verblijf, of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62a
  - number: 62a.1.c
    text: |-
      de vreemdeling door een andere lidstaat van de Europese Unie wordt teruggenomen op grond van een op 13 januari 2009
      geldende bilaterale of multilaterale overeenkomst of regeling.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62a
  - number: 62a.2
    text: De kennisgeving, bedoeld in het eerste lid, geldt als terugkeerbesluit en kan tevens een inreisverbod inhouden.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62a
  - number: 62a.3
    text: |-
      De vreemdeling, bedoeld in het eerste lid, onderdeel b, wordt opgedragen zich onmiddellijk naar het grondgebied
      van de betrokken lidstaat te begeven. Indien dit bevel niet wordt nageleefd of indien om redenen van openbare
      orde of nationale veiligheid het onmiddellijke vertrek van vreemdeling is vereist, wordt tegen de vreemdeling een
      terugkeerbesluit uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel62a
  - number: '63.1'
    text: |-
      De vreemdeling die geen rechtmatig verblijf heeft en die niet binnen de bij deze wet gestelde termijn Nederland uit
      eigen beweging heeft verlaten, kan worden uitgezet.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel63
  - number: '63.2'
    text: Onze Minister is bevoegd tot uitzetting.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel63
  - number: '63.3'
    text: |-
      Indien de werking van de beschikking waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken is
      opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van de uitzetting.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel63
  - number: '64'
    text: |-
      Uitzetting blijft achterwege zolang het gelet op de gezondheidstoestand van de vreemdeling of die van een van zijn
      gezinsleden niet verantwoord is om te reizen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel64
  - number: '65.1'
    text: 'De vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel65
  - number: 65.1.a
    text: |-
      die Nederland is binnengekomen aan boord van een vaartuig of luchtvaartuig in gebruik bij een vervoersonderneming
      en die Nederland onmiddellijk dient te verlaten, of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel65
  - number: 65.1.b
    text: |-
      die met het oog op zijn uitzetting is aangehouden binnen zes maanden nadat hij is binnengekomen aan boord van een
      vaartuig of luchtvaartuig in gebruik bij een vervoersonderneming, kan worden uitgezet door plaatsing aan boord van
      een vaartuig of luchtvaartuig in gebruik bij dezelfde vervoersonderneming.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel65
  - number: '65.2'
    text: |-
      De vervoersonderneming vervoert op aanwijzing van een ambtenaar belast met de grensbewaking de vreemdeling, bedoeld
      in het eerste lid, om niet terug naar een plaats buiten Nederland en vindt daartoe zo nodig een ander middel voor
      de terugbrenging. Is zulks niet binnen redelijke tijd mogelijk, of, in het geval bedoeld in het eerste lid, onder
      b, niet binnen redelijke tijd na de aanhouding mogelijk, dan kunnen de kosten van uitzetting uit Nederland op die
      vervoersonderneming worden verhaald.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel65
  - number: '65.3'
    text: |-
      Gezagvoerders van vaartuigen en luchtvaartuigen verlenen aan de uitzetting van de vreemdeling alle medewerking die
      de ambtenaar belast met de grensbewaking redelijkerwijs kan vorderen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel65
  - number: '65.4'
    text: |-
      Het eerste lid, onder b, is niet van toepassing op de vreemdeling die rechtmatig verblijf geniet tot een later
      tijdstip dan dat van vertrek van het vaartuig of luchtvaartuig aan boord waarvan hij is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel65
  - number: '66.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de toepassing van de
      [afdelingen 1][ref1] en [2][ref2] van dit hoofdstuk. Daarbij wordt in ieder geval voorzien in de mogelijkheid van
      verhaal van de kosten van uitzetting op de referent of de gewezen referent van de vreemdeling, op de vreemdeling
      zelf en, indien hij minderjarig is, op degenen die het wettelijk gezag over hem uitoefenen of uitoefenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        hoofdstuk: '6'
        afdeling: '2'
  - number: '66.2'
    text: Het terzake van uitzetting verschuldigde bedrag kan worden ingevorderd bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66
  - number: 66a.1
    text: |-
      Onze Minister vaardigt een inreisverbod uit tegen de vreemdeling, die geen gemeenschapsonderdaan is, op wie
      [artikel 64][ref1] niet van toepassing is en die Nederland:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 66a.1.a
    text: |-
      onmiddellijk moet verlaten ingevolge [artikel 62, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 66a.1.b
    text: |-
      niet uit eigen beweging binnen de daarvoor geldende termijn heeft verlaten, in welk laatste geval het inreisverbod
      slechts door middel van een zelfstandige beschikking wordt uitgevaardigd dan wel een beschikking die mede strekt
      tot wijziging van het reeds gegeven terugkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.2
    text: |-
      Onze Minister kan een inreisverbod uitvaardigen tegen de vreemdeling, die geen gemeenschapsonderdaan is en die
      Nederland niet onmiddellijk moet verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.3
    text: |-
      De vreemdeling tegen wie een inreisverbod is uitgevaardigd wordt ter fine van weigering van de toegang en het
      verblijf gesignaleerd in de daartoe bij of krachtens een verdrag, een EU-verordening, -richtlijn, of -besluit of
      een algemene maatregel van bestuur aangewezen informatie- dan wel signaleringssystemen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.4
    text: |-
      Het inreisverbod wordt gegeven voor een bepaalde duur, die ten hoogste vijf jaren bedraagt, tenzij de vreemdeling
      naar het oordeel van Onze Minister een ernstige bedreiging vormt voor de openbare orde, de openbare veiligheid
      of de nationale veiligheid. De duur wordt berekend met ingang van de datum waarop de vreemdeling Nederland
      daadwerkelijk heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.5
    text: |-
      Indien de bekendmaking van de beschikking, waarbij het inreisverbod is uitgevaardigd, geschiedt door toezending,
      wordt van de beschikking mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.6
    text: |-
      In afwijking van [artikel 8][ref1] kan de vreemdeling jegens wie een inreisverbod geldt of die is gesignaleerd ter
      fine van weigering van de toegang geen rechtmatig verblijf hebben, met uitzondering van het rechtmatig verblijf:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 66a.6.a
    text: |-
      van de vreemdeling die een eerste aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 28][ref1] heeft ingediend, zolang op die aanvraag nog niet is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 66a.6.b
    text: |-
      bedoeld in [artikel 8, onder j][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 66a.6.c
    text: |-
      van de vreemdeling wiens uitzetting op grond van een rechterlijke beslissing achterwege dient te blijven totdat op
      het bezwaarschrift of beroepschrift is beslist.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.7
    text: |-
      In afwijking van het zesde lid en [artikel 8][ref1] en met uitzondering van het rechtmatig verblijf van de
      vreemdeling die een eerste aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 28][ref2]
      heeft ingediend zolang op die aanvraag nog niet is beslist, kan de vreemdeling jegens wie een inreisverbod geldt
      geen rechtmatig verblijf hebben, in geval de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 66a.7.a
    text: |-
      bij onherroepelijk geworden rechtelijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd dan wel hem ter zake de maatregel als bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 66a.7.b
    text: een gevaar vormt voor de openbare orde of de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.7.c
    text: naar het oordeel van Onze Minister een ernstige bedreiging vormt als bedoeld in het vierde lid, dan wel
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.7.d
    text: |-
      ingevolge een verdrag of in het belang van de internationale betrekkingen van Nederland ieder verblijf dient te
      worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66a.8
    text: |-
      In afwijking van het eerste lid kan Onze Minister om humanitaire of andere redenen afzien van het uitvaardigen van
      een inreisverbod.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66a
  - number: 66b.1
    text: |-
      Onze Minister kan ambtshalve of wegens gewijzigde omstandigheden dan wel op aanvraag van de vreemdeling besluiten
      tot opheffing of tijdelijke opheffing van het inreisverbod.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66b
  - number: 66b.2
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel66b
  - number: '67.1'
    text: |-
      Tenzij [afdeling 3][ref1] van toepassing is, kan Onze Minister de vreemdeling ongewenst verklaren:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '6'
        afdeling: '3'
  - number: 67.1.a
    text: |-
      indien hij niet rechtmatig in Nederland verblijft en bij herhaling een bij deze wet strafbaar gesteld feit heeft
      begaan;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
  - number: 67.1.b
    text: |-
      indien hij bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen
      een gevangenisstraf van drie jaren of meer is bedreigd dan wel hem terzake de maatregel als bedoeld in
      [artikel 37a van het Wetboek van Strafrecht][ref1] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
  - number: 67.1.c
    text: |-
      indien hij een gevaar vormt voor de openbare orde of nationale veiligheid en geen rechtmatig verblijf heeft als
      bedoeld in [artikel 8, onder a tot en met e dan wel l][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 67.1.d
    text: ingevolge een verdrag, of
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
  - number: 67.1.e
    text: in het belang van de internationale betrekkingen van Nederland.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
  - number: '67.2'
    text: |-
      Indien de bekendmaking van de beschikking, waarbij de vreemdeling ongewenst wordt verklaard, geschiedt door
      toezending, wordt van de beschikking mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
  - number: '67.3'
    text: |-
      In afwijking van [artikel 8][ref1] kan de ongewenst verklaarde vreemdeling geen rechtmatig verblijf hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '68.1'
    text: Onze Minister kan op aanvraag van de vreemdeling besluiten tot opheffing van de ongewenstverklaring.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel68
  - number: '68.2'
    text: |-
      De ongewenstverklaring wordt opgeheven indien de vreemdeling tien jaren onafgebroken buiten Nederland verblijf
      heeft gehad en zich in die periode geen van de gronden, bedoeld in [artikel 67, eerste lid][ref1], hebben
      voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel67
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '67'
        hoofdstuk: '6'
        afdeling: '4'
  - number: '68.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de toepassing van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel68
  - number: '69.1'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een bezwaar- of beroepschrift vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '69.2'
    text: |-
      In afwijking van het eerste lid bedraagt de beroepstermijn één week, indien de aanvraag tot het verlenen
      van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28][ref1] is afgewezen binnen een bij
      algemene maatregel van bestuur te bepalen aantal dagen, dat niet de dagen omvat die gemoeid zijn met het aan de
      asielaanvraag voorafgaande onderzoek naar de identiteit, vingerafdrukken en nationaliteit van de vreemdeling,
      naar de bij hem aangetroffen of door hem overgelegde documenten en bescheiden, dan wel naar de vraag of
      [artikel 30, eerste lid, aanhef en onder a][ref2], kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: '69.3'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] is het instellen van beroep als bedoeld in
      de [artikelen 94][ref2] en [96][ref3] tegen een besluit als bedoeld in [artikel 93][ref4] niet aan enige termijn
      gebonden. De termijn voor het instellen van het hoger beroep, bedoeld in [artikel 95][ref5], bedraagt één week.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel93
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel95
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '94'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '96'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '93'
        hoofdstuk: '7'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '95'
        hoofdstuk: '7'
        afdeling: '5'
  - number: '70.1'
    text: |-
      In afwijking van de [artikelen 2:1][ref1] en [8:24 van de Algemene wet bestuursrecht][ref2] wordt het bezwaar,
      administratief beroep, het beroep op de rechtbank of het hoger beroep ingesteld door de vreemdeling in persoon,
      zijn wettelijke vertegenwoordiger, zijn bijzondere gemachtigde, zijn referent of een advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '70.2'
    text: |-
      Indien de vreemdeling van zijn vrijheid is ontnomen kan hij het bezwaar, administratief beroep, het beroep
      op de rechtbank of hoger beroep ook instellen door middel van de schriftelijke verklaring, bedoeld in
      [artikel 451a van het Wetboek van Strafvordering][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel451a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 451a
  - number: '71'
    text: |-
      Op het beroep tegen een besluit, genomen op grond van de [artikelen 43][ref1] en [45, vierde lid][ref2], zijn de
      [artikelen 70, eerste lid][ref3], en [89][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel89
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '70'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '89'
        hoofdstuk: '7'
        afdeling: '4'
  - number: 71a.1
    text: |-
      In afwijking van [artikel 8:89, tweede lid, van de Algemene wet bestuursrecht][ref1] is de bestuursrechter bij
      uitsluiting bevoegd tot behandeling van een verzoek als bedoeld in [artikel 8:88, eerste lid, van die wet][ref2]
      tot vergoeding van schade die een vreemdeling lijdt als gevolg van een onrechtmatig besluit ten aanzien van deze
      vreemdeling als zodanig.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 71a.2
    text: |-
      In afwijking van [artikel 8:94, eerste lid, van de Algemene wet bestuursrecht][ref1] is
      [artikel 8:10a, eerste tot en met derde lid, van die wet][ref2] niet van overeenkomstige toepassing indien het
      verzoek wordt behandeld door de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '72.1'
    text: |-
      Deze afdeling is van toepassing indien de [afdelingen 3][ref1] en [5][ref2] van dit hoofdstuk niet van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011823
        hoofdstuk: '7'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011823
        hoofdstuk: '7'
        afdeling: '5'
  - number: '72.2'
    text: |-
      Een beschikking omtrent de afgifte van een visum, waaronder begrepen een machtiging tot voorlopig verblijf, wordt
      voor de toepassing van dit hoofdstuk gelijkgesteld met een beschikking omtrent een verblijfsvergunning regulier
      gegeven krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel72
  - number: '72.3'
    text: |-
      Voor de toepassing van deze afdeling wordt met een beschikking tevens gelijkgesteld een handeling van een
      bestuursorgaan ten aanzien van een vreemdeling als zodanig, waaronder begrepen het niet verlenen van de
      verblijfsvergunning overeenkomstig [artikel 14, tweede lid][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: '72.4'
    text: |-
      Voor de toepassing van deze afdeling wordt met een beschikking eveneens gelijk gesteld een kennisgeving als bedoeld
      in [artikel 62a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62a
        hoofdstuk: '6'
        afdeling: '1'
  - number: 72a
    text: |-
      [Artikel 8:88, eerste lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op een
      verzoek tot vergoeding van schade die een vreemdeling lijdt als gevolg van een onrechtmatige handeling van dit
      bestuursorgaan ten aanzien van deze vreemdeling als zodanig. [Artikel 71a][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel71a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 71a
        hoofdstuk: '7'
        afdeling: '1'
  - number: '73.1'
    text: |-
      De werking van het besluit tot afwijzing van de aanvraag of de intrekking van de verblijfsvergunning wordt
      opgeschort totdat de termijn voor het maken van bezwaar of het instellen van administratief beroep is verstreken
      of, indien bezwaar is gemaakt of administratief beroep is ingesteld, totdat op het bezwaar of administratief beroep
      is beslist.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
  - number: '73.2'
    text: |-
      Het eerste lid is niet van toepassing indien de aanvraag is afgewezen dan wel de verblijfsvergunning is ingetrokken
      op de grond, bedoeld in artikel:
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
  - number: 73.2.a
    text: |-
      [16, eerste lid, onder a of d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 73.2.b
    text: |-
      [18, eerste lid, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel18
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 73.2.c
    text: |-
      [21, eerste lid, onder e of f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 73.2.d
    text: |-
      [22, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel22
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '73.3'
    text: |-
      Het eerste lid is voorts niet van toepassing indien het besluit inhoudt de afwijzing van een herhaalde aanvraag of
      indien het bezwaarschrift of het administratief beroepschrift niet tijdig is ingediend.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
  - number: '73.4'
    text: |-
      Het eerste lid is evenmin van toepassing indien de vreemdeling rechtens zijn vrijheid is of wordt ontnomen op grond
      van [artikel 59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: '73.5'
    text: |-
      Het eerste lid is, voor zover het betreft de opschortende werking gedurende de termijn voor het maken van bezwaar
      of het instellen van administratief beroep zolang geen bezwaar is gemaakt of administratief beroep is ingesteld,
      niet van toepassing op de verplichting, bedoeld in [artikel 62, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: '76.1'
    text: |-
      Indien bezwaar wordt gemaakt tegen een beschikking omtrent de afgifte van de machtiging tot voorlopig
      verblijf, bedoeld in [artikel 1a, onderdeel b][ref1], de verblijfsvergunning, bedoeld in [artikel 14][ref2]
      of [20][ref3], dan wel de ongewenstverklaring, bedoeld in [artikel 67][ref4], wordt in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref5] beslist binnen negentien weken, gerekend vanaf
      de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel76
