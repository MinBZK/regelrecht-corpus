        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: 83.7.c
    text: de goede procesorde zich daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: 83a.1
    text: |-
      Op het hoger beroep zijn de [titels 8.1 tot en met 8.3 van de Algemene wet bestuursrecht][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 8:1 tot en met 8:5][ref2], [8:6, eerste lid][ref3],
      [8:7 tot en met 8:9][ref4], [8:10a, eerste tot en met derde lid][ref5], [8:13][ref6], [8:41, tweede lid][ref7],
      [8:54, tweede lid][ref8], [8:55][ref9], en [8:74][ref10], voor zover in deze wet niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref10
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 83a.2
    text: |-
      [Artikel 8:108, eerste en derde lid, van de Algemene wet bestuursrecht is][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 83a.3
    text: |-
      Deze afdeling, met uitzondering van [artikel 86][ref1], is van overeenkomstige toepassing op het incidenteel hoger
      beroep. Voor zover nodig in afwijking van [artikel 8:110 van de Algemene wet bestuursrecht][ref2] zijn de termijnen
      voor het instellen van incidenteel hoger beroep als bedoeld in het tweede lid van dat artikel en voor het naar
      voren brengen van de zienswijze, bedoeld in het derde lid van dat artikel, gelijk aan de termijn voor het instellen
      van hoger beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '86'
        hoofdstuk: '7'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 83a.4
    text: |-
      De [artikelen 8:110 tot en met 8:112 van de Algemene wet bestuursrecht][ref1] zijn niet van toepassing op een hoger
      beroep:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 83a.4.a
    text: |-
      als bedoeld in [artikel 95, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel95
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '95'
        hoofdstuk: '7'
        afdeling: '5'
  - number: 83a.4.b
    text: |-
      inzake een terugkeerbesluit of een inreisverbod, tenzij dat besluit of verbod deel uitmaakt van of wordt opgelegd
      tegelijk met het besluit op een aanvraag om een verblijfsvergunning als bedoeld in [artikel 14][ref1], [20][ref2],
      [28][ref3] of [33][ref4], dan wel ingevolge [artikel 6:19 van de Algemene wet bestuursrecht][ref5] wordt betrokken
      bij het hoger beroep tegen een dergelijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
