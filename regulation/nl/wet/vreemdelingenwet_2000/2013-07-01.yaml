  - number: '108.2'
    text: |-
      Overtreding van een voorschrift, vastgesteld bij of krachtens [artikel 4, eerste tot en met derde lid][ref1], wordt
      gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
        hoofdstuk: '2'
  - number: '108.3'
    text: De in het eerste en tweede lid strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel108
  - number: '108.4'
    text: |-
      Met de opsporing van de in het eerste en tweede lid strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren belast met de grensbewaking en
      ambtenaren belast met het vreemdelingentoezicht. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor
      zover deze feiten betrekking hebben op een aanwijzing, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '108.5'
    text: |-
      In afwijking van het eerste lid wordt handelen in strijd met een verplichting, opgelegd bij of krachtens
      [artikel 54, eerste lid, onder b of e][ref1], gestraft met ten hoogste een hechtenis van een maand of een geldboete
      van de tweede categorie, indien het feit wordt begaan door een gemeenschapsonderdaan. Het derde lid en de eerste
      volzin van het vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '1'
  - number: '108.6'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de vreemdeling die in Nederland verblijft
      terwijl hij weet of ernstige reden heeft te vermoeden dat tegen hem een inreisverbod is uitgevaardigd, indien het
      inreisverbod is gegeven anders dan met toepassing van [artikel 66a, zevende lid][ref1]. Het derde lid en de eerste
      volzin van het vierde lid zijn eveneens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 66a
        hoofdstuk: '6'
        afdeling: '3'
  - number: '109.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter uitvoering van een voor Nederland bindend verdrag, EU-verordening,
      -richtlijn of -besluit, bepalingen van deze wet geheel of gedeeltelijk buiten werking worden gesteld, indien dat,
      naar het gevoelen van de Ministerraad, noodzakelijk is om binnen twaalf maanden uitvoering te geven aan het verdrag
      of het besluit en daartoe deze wet in overeenstemming moet worden gebracht met het verdrag of het besluit.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel109
  - number: '109.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel109
  - number: '109.3'
    text: |-
      Onze Minister bevordert dat zo spoedig mogelijk na de vaststelling van een krachtens het eerste lid vastgestelde
      algemene maatregel van bestuur een voorstel van wet bij de Staten-Generaal wordt ingediend, dat ertoe strekt de
      wet in overeenstemming te brengen met het verdrag of besluit, bedoeld in het eerste lid. Indien het voorstel wordt
      ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt
      de algemene maatregel van bestuur terstond ingetrokken. Indien het voorstel tot wet wordt verheven, vervalt de
      algemene maatregel van bestuur op het tijdstip van inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel109
  - number: '109.4'
    text: |-
      Ter uitvoering van een verdrag, EU-verordening, -richtlijn of -besluit, op grond waarvan de
      grenscontrole plaatsvindt aan buitengrenzen, wordt in de [artikelen 5, tweede lid][ref1],
      [54, eerste lid, aanhef en onder a en e][ref2], [56, tweede lid][ref3], [59, derde lid][ref4], en
      [66a, vierde lid][ref5], onder «Nederland» mede verstaan de gebieden waarop dat verdrag, die verordening, die
      richtlijn of dat besluit van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel109
