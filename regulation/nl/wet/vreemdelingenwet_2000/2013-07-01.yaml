  - number: 8.l
    text: indien de vreemdeling verblijfsrecht ontleent aan het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel8
  - number: 8.m
    text: |-
      in afwachting van de indiening van een aanvraag tot het verlenen van een verblijfsvergunning, bedoeld in
      [artikel 28][ref1], voor zover die vreemdeling overeenkomstig bij of krachtens algemene maatregel van bestuur te
      stellen regels te kennen heeft gegeven die aanvraag in te willen dienen en bij of krachtens algemene maatregel van
      bestuur daartoe een termijn is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
