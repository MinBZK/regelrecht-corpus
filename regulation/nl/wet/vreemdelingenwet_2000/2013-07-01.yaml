      tot oprichting van de Europese Gemeenschap](onbekend) dan wel de Overeenkomst betreffende de Europese Economische
      Ruimte;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel8
  - number: 8.f
    text: |-
