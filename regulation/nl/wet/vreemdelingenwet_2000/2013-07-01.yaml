        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '81'
    text: |-
      In afwijking van de [artikelen 8:41, eerste lid][ref1], en
      [8:82, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt door de griffier geen griffierecht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '82.1'
    text: |-
      De werking van het besluit omtrent een verblijfsvergunning wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
  - number: '82.2'
    text: 'Het eerste lid is niet van toepassing indien het besluit inhoudt:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
  - number: 82.2.a
    text: |-
      de afwijzing van de aanvraag binnen een bij algemene maatregel van bestuur te bepalen aantal dagen, dat
      niet de dagen omvat die gemoeid zijn met het aan de asielaanvraag voorafgaande onderzoek naar de identiteit,
      vingerafdrukken en nationaliteit van de vreemdeling, naar de bij hem aangetroffen of door hem overgelegde
      documenten en bescheiden, dan wel naar de vraag of [artikel 30, eerste lid, aanhef en onder a][ref1], kan worden
      toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 82.2.b
    text: de afwijzing van de herhaalde aanvraag;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
  - number: 82.2.c
    text: |-
      de afwijzing van de aanvraag op grond van [artikel 30, eerste lid, onder a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
  - number: 82.2.d
    text: |-
      een besluit als bedoeld in de [artikelen 43][ref1] en [45, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '4'
  - number: '82.3'
    text: Het eerste lid is niet van toepassing indien het beroepschrift niet tijdig is ingediend.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
  - number: '82.4'
    text: |-
      Het eerste lid is voorts niet van toepassing indien de vreemdeling rechtens zijn vrijheid is of wordt ontnomen op
      grond van [artikel 6][ref1] of [59][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '59'
        hoofdstuk: '5'
  - number: '82.5'
    text: |-
      Het eerste lid is, voor zover het betreft de opschortende werking gedurende de beroepstermijn zolang geen beroep is
      ingesteld, niet van toepassing op de verplichting, bedoeld in [artikel 62, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
        hoofdstuk: '6'
        afdeling: '1'
  - number: '82.6'
    text: |-
      Het tweede lid, onder a en b, en het derde en vierde lid zijn niet van toepassing, indien de vreemdeling tijdelijke
      bescherming heeft.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel82
  - number: '83.1'
    text: 'De rechtbank houdt bij de beoordeling van het beroep rekening met:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: 83.1.a
    text: feiten en omstandigheden die na het bestreden besluit zijn aangevoerd, en
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: 83.1.b
    text: wijzigingen van beleid die na het bestreden besluit zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: '83.2'
    text: |-
      Met de in het eerste lid bedoelde gegevens wordt slechts rekening gehouden indien deze relevant kunnen zijn voor
      de beschikking omtrent de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en [33][ref2], of omtrent de
      ambtshalve verlening van een vergunning als bedoeld in [artikel 14][ref3], dan wel het achterwege laten van de
      uitzetting op grond van [artikel 64][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '64'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '83.3'
    text: |-
      Met de in het eerste lid bedoelde gegevens wordt geen rekening gehouden voor zover de goede procesorde zich
      daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: '83.4'
    text: |-
      Indien de indiener van het beroepschrift zich beroept op feiten of omstandigheden als bedoeld in het eerste lid,
      onderdeel a, maar deze niet aanstonds aannemelijk maakt, stelt de rechtbank hem zo nodig in de gelegenheid deze
      feiten of omstandigheden binnen een door de rechtbank te bepalen termijn alsnog aannemelijk te maken, tenzij de
      goede procesorde zich daartegen verzet of de afdoening van de zaak daardoor ontoelaatbaar wordt vertraagd.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: '83.5'
    text: |-
      Onze Minister laat de wederpartij en de rechtbank zo spoedig mogelijk schriftelijk weten of de gegevens, bedoeld
      in het eerste lid, aanleiding zijn voor handhaving, wijziging of intrekking van het bestreden besluit. De rechtbank
      kan daarvoor een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: '83.6'
    text: |-
      Indien Onze Minister zich beroept op gegevens als bedoeld in het eerste lid, biedt de rechtbank de vreemdeling de
      gelegenheid om daarop schriftelijk te reageren.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: '83.7'
    text: 'Het vijfde en zesde lid zijn niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: 83.7.a
    text: aan een schriftelijke reactie redelijkerwijs geen behoefte bestaat;
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
  - number: 83.7.b
    text: |-
      deze gegevens niet relevant kunnen zijn voor de beschikking omtrent de verblijfsvergunning, bedoeld in de
      [artikelen 28][ref1] en [33][ref2], of omtrent de ambtshalve verlening van een vergunning als bedoeld in
      [artikel 14][ref3], dan wel het achterwege laten van de uitzetting op grond van [artikel 64][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
