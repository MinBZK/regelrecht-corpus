  - number: '76.2'
    text: |-
      Onverminderd [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref1], kan de beslissing worden verdaagd
      voor ten hoogste dertien weken indien naar het oordeel van Onze Minister voor de beoordeling van het bezwaarschrift
      advies van of onderzoek door derden of het openbaar ministerie nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '77.1'
    text: |-
      Tegen een ter uitvoering van deze wet genomen beschikking die niet door of namens Onze Minister is genomen,
      met uitzondering van een beschikking als bedoeld in [artikel 72, tweede lid][ref1], kan bij Onze Minister
      administratief beroep worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel72
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '72'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '2'
  - number: '77.2'
    text: |-
      In afwijking van het eerste lid staat geen administratief beroep open tegen een beschikking die is gegeven op grond
      van de [artikelen 6][ref1] en [50, tweede, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '1'
  - number: '78'
    text: |-
      Indien een verzoek om een voorlopige voorziening is gedaan teneinde uitzetting te voorkomen voordat is beslist
      op het bezwaar of het administratief beroep, dat is gericht tegen de beschikking tot afwijzing van de aanvraag of
      intrekking van de verblijfsvergunning, beslist de voorzieningenrechter van de rechtbank zoveel mogelijk tevens over
      dat bezwaar of administratief beroep.
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel78
  - number: '79.1'
    text: |-
      Deze afdeling is slechts van toepassing indien beroep wordt ingesteld tegen een besluit omtrent een
      verblijfsvergunning als bedoeld in de [artikelen 28][ref1] en [33][ref2], of tegen een besluit omtrent tijdelijke
      bescherming of toepassing van [artikel 45, vierde lid][ref3], indien de vreemdeling in de gelegenheid is gesteld
      zijn zienswijze over het voornemen van dat besluit te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '4'
  - number: '79.2'
    text: |-
      Deze afdeling is van overeenkomstige toepassing indien beroep wordt ingesteld tegen een besluit als bedoeld in de
      [artikelen 43][ref1] en [45, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: '4'
  - number: '79.3'
    text: |-
      Deze afdeling is van overeenkomstige toepassing indien in de voornemenprocedure, bedoeld in de [artikelen 39][ref1]
      en [41][ref2], de vreemdeling tevens in de gelegenheid is gesteld om zijn zienswijze te geven over het voornemen
      niet ambtshalve een verblijfsvergunning als bedoeld in [artikel 14][ref3] te verlenen dan wel over het voornemen om
      de uitzetting niet op grond van [artikel 64][ref4] achterwege te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0011823/2013-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '4'
