preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is de regeling in de Huisvestingswet inzake de voorziening
    in de huisvesting van bepaalde categorieën woningzoekenden te wijzigen en in dat kader tevens de bemiddelende
    taak van het Centraal Orgaan opvang asielzoekers en de coördinerende verantwoordelijkheid van Onze Minister van
    Binnenlandse Zaken voor die taak in de Wet Centraal Orgaan opvang asielzoekers vast te leggen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007313/1995-04-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Deze wet treedt in werking met ingang van 1 april 1995.

      2 Aan de verplichtingen, bedoeld in de [artikelen 60][ref1], eerste lid, en [60][ref2], wordt voor het eerst
      uitvoering gegeven met betrekking tot het tweede kalenderhalfjaar van 1995.

      3 Een vóór het tijdstip van inwerkingtreding van deze wet door Onze Minister van Justitie gedane bekendmaking
      omtrent het aantal verblijfsgerechtigden in wier huisvesting in het tweede kalenderhalfjaar van 1995 dient te
      worden voorzien, die voldoet aan de vanaf bedoeld tijdstip in artikel 60*b*, tweede lid bij de letter *c*, van de
      [Huisvestingswet][ref3] gestelde vereisten, geldt als de bekendmaking voor genoemd kalenderhalfjaar in de zin van
      genoemd lid.

      4 Een vóór het tijdstip van inwerkingtreding van deze wet door gedeputeerde staten gedane vaststelling
      omtrent het aantal inwoners van een gemeente per 1 januari 1994, die voldoet aan de vanaf bedoeld tijdstip in
      [artikel 60][ref4] gestelde vereisten, geldt als een vaststelling in de zin van genoemd lid.

      5 De vóór het tijdstip van inwerkingtreding van deze wet door Onze Ministers van Welzijn, Volksgezondheid en
      Cultuur, van Binnenlandse Zaken, van Justitie en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer tot de
      gemeenten gerichte verzoeken om medewerking met betrekking tot de huisvesting van verblijfsgerechtigden als bedoeld
      in [artikel 60][ref5], alsmede van houders van een voorwaardelijke vergunning tot verblijf als bedoeld in artikel
      9*a* van de Vreemdelingenwet, gelden als taakstellingen in de zin van [artikel 60][ref6] met dien verstande dat
      artikel 60*c* van die wet op deze taakstellingen niet van toepassing is.


