  - number: '56.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van warmte geproduceerd door een productie-installatie
      voor de productie van warmte onttrokken uit drinkwater of afvalwater door middel van een warmtepomp met een COP-
      waarde van ten minste 3,0 en met een nominaal thermisch vermogen van ten minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel56
  - number: '56.2'
    text: De productie-installatie, bedoeld in het eerste lid, levert uitsluitend warmte aan de gebouwde omgeving.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel56
