  - number: '50.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte, geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte of
      hernieuwbare elektriciteit en hernieuwbare warmte, uitsluitend door middel van thermische conversie van vaste of
      vloeibare biomassa als bedoeld in de NTA 8003: 2017, met uitzondering van biomassa als bedoeld in de nummers 100,
      150, 170 tot en met 179 van de NTA 8003: 2017, met een nominaal thermisch vermogen van ten minste 5 MWth, waarvoor
      reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt en waarvoor op het moment van aanvraag ten minste
      negen jaar voordien de subsidieperiode is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: '50.2'
    text: |-
      De biomassa die in de productie-installatie, bedoeld in het eerste lid, wordt toegepast, is voor ten minste 95% van
      de energetische waarde biogeen.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel50
  - number: '50.3'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt
      aangetoond dat de gebruikte vloeibare biomassa, dan wel de in een installatie met een totaal nominaal thermisch
      ingangsvermogen gelijk aan of groter dan 20 MW gebruikte vaste biomassa, voldoet aan de duurzaamheids- en
      broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001]
      (32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel50
  - number: '51.1'
    text: |-
      Subsidie als bedoeld in [artikel 50, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel50
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '50'
        paragraaf: '3'
  - number: '51.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 50, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


