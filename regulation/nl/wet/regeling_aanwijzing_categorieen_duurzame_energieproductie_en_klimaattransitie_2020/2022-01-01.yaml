  - number: '58.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van warmte geproduceerd door een productie-installatie
      voor de productie van warmte uit zonne-energie die integraal onderdeel uitmaakt van een nieuwe tuinbouwkas.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel58
  - number: '58.2'
    text: 'De productie-installatie, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel58
  - number: 58.2.a
    text: |-
      maakt gebruik van een optisch en zonvolgend systeem waarbij zonlicht wordt geconcentreerd op collectorbuizen met
      een thermisch vermogen dat ten minste vier keer het nominaal thermisch vermogen van de warmtepomp bedraagt;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel58
  - number: 58.2.b
    text: maakt gebruik van seizoensopslag van warmte die niet wordt gebruikt voor koudelevering; en
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel58
  - number: 58.2.c
    text: |-
      maakt gebruik van een warmtepomp met een COP-waarde van ten minste 5,0 en een nominaal thermisch vermogen van ten
      minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel58
  - number: '59.1'
    text: |-
      Subsidie als bedoeld in [artikel 58, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel58
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel59
    references:
      - id: ref1
