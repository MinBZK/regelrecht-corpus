      broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001]
      (32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel40
