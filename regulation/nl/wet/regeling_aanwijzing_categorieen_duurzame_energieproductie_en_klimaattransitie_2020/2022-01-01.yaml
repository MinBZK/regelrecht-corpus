  - number: '70.3'
    text: |-
      In afwijking van de fasebedragen genoemd in de derde, vierde, vijfde en zesde kolom van de tabel in het tweede
      lid geldt voor de productiecategorieën, bedoeld in de [artikelen 4][ref1], [6][ref2], [8, eerste lid][ref3],
      [10, eerste lid][ref4], [12, eerste lid][ref5], [14, eerste lid][ref6], [16, eerste lid][ref7], [18][ref8],
      [20][ref9], [22, eerste lid][ref10], [24][ref11], [26, eerste lid][ref12], [28, eerste lid][ref13], [30][ref14],
      [32][ref15], [34][ref16], [36, eerste lid][ref17], [38, eerste lid][ref18], [40, eerste lid][ref19],
      [42, eerste lid][ref20], [44, eerste lid][ref21], [46, eerste lid][ref22], [48, eerste lid][ref23],
      [50, eerste lid][ref24], [52, eerste lid][ref25], [54, eerste lid][ref26], [56, eerste lid][ref27],
      [58, eerste lid][ref28], [60, eerste lid][ref29], [62, eerste lid][ref30], [64, eerste lid][ref31], en [66][ref32]
      het fasebedrag in euro per kWh in vier decimalen dat door de aanvrager bij de aanvraag in een fase is ingediend,
      mits dat bedrag per kWh lager is dan het fasebedrag dat voor de fase waarin de aanvraag is ingediend van toepassing
      is.


