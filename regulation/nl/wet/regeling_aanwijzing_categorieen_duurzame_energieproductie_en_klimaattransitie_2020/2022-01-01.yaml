        paragraaf: '3'
  - number: '52.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie voor de productie van hernieuwbare warmte die vrijkomt bij het composteren van uitsluitend
      biomassa als bedoeld in nummer 256 van de NTA 8003: 2017, met een vermogen van ten minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel52
  - number: '52.2'
    text: |-
      De biomassa die in de productie-installatie, bedoeld in het eerste lid, wordt toegepast, is voor ten minste 95% van
      de energetische waarde biogeen.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel52
  - number: '53.1'
