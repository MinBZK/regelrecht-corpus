    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte of
      hernieuwbare elektriciteit en hernieuwbare warmte door middel van verbranding van houtpellets, in een ketel met een
      nominaal thermisch vermogen groter dan of gelijk aan 10 MWth, waarbij ten minste de ketel nieuw is waarin:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel44
  - number: 44.1.a
    text: |-
      houtpellets geproduceerd uit biomassa als bedoeld in de nummers 110 tot en met 138 van de NTA 8003: 2017 worden
      verbrand;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel44
  - number: 44.1.b
    text: |-
      reststoffen die vrijkomen uit bioraffinage als bedoeld in nummer 595 van de NTA 8003:2017, van biomassa als bedoeld
      in de nummers 110 tot en met 138 van de NTA 8003:2017, worden verbrand voor ten hoogste 25% van het aantal kWh dat
      in een kalenderjaar voor subsidie in aanmerking komt; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel44
  - number: 44.1.c
    text: |-
      houtpellets geproduceerd uit biomassa als bedoeld in de nummers 160 tot en met 169 van de NTA 8003: 2017 worden
      verbrand, voor ten hoogste vijftien vijfentachtigste deel van de som van het aantal kWh dat in een kalenderjaar
      voor subsidie in aanmerking komt, geproduceerd met biomassa als bedoeld in onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel44
  - number: '44.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel44
  - number: '44.3'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid, levert de warmte uitsluitend ten behoeve
      van de verwarming van gebouwde omgeving.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel44
  - number: '44.4'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat in voldoende mate
      aannemelijk wordt gemaakt dat de gebruikte biomassa voldoet aan de duurzaamheidseisen voor vaste biomassa, bedoeld
      in [artikel 7 van de algemene uitvoeringsregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel44
