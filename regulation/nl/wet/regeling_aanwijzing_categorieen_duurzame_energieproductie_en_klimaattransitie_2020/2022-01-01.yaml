articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *algemene uitvoeringsregeling:*
      [Algemene uitvoeringsregeling stimulering duurzame energieproductie en klimaattransitie][ref1];
        - *allesvergisting:* biologische afbraakreacties van biomassa als bedoeld in de NTA 8003: 2017, met uitzondering
      van de nummers 400, 410, 420, 500, 550 tot en met 559, waarvan de biogasopbrengst van de ingaande stroom ten minste
      25 Nm3 aardgasequivalent per ton bedraagt;
        - *beschermingszone:* beschermingszone als bedoeld in appendix b bij
      [bijlage I van de Regeling veiligheid primaire waterkeringen 2017][ref2];
        - *besluit:* [Besluit stimulering duurzame energieproductie en klimaattransitie][ref3];
        - *Besluit SDE:* [Besluit stimulering duurzame energieproductie][ref4], zoals dit luidde tot 1 november 2020;
        - *biosyngas:* mengsel van gassen dat is geproduceerd door vergassing van biomassa en dat geen nadere bewerking tot
      methaan heeft ondergaan;
        - *COP-waarde:* coëfficiënt van prestatie uitgedrukt in de hoeveelheid afgegeven warmte aan de condensorzijde per
      hoeveelheid opgenomen elektriciteit;
        - *doublet:* combinatie van naast elkaar liggende diepboringen die ten minste bestaat uit één productieput en één
      injectieput;
        - *gebouw:* bouwwerk als bedoeld in [artikel 1 van de Woningwet][ref5] niet zijnde een tijdelijk bouwwerk als
      bedoeld in [artikel 1, eerste lid, van het Bouwbesluit 2012][ref6];
        - *hernieuwbare warmte:* nuttig aangewende warmte als bedoeld in
      [artikel 1 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref7];
        - *ketel:* installatie waarin brandstof wordt verstookt waarbij de verbrandingswarmte met behulp van een
      warmtewisselaar wordt overgedragen aan een vloeistof;
        - *koolstofdioxide-arme warmte:* nuttig aangewende koolstofdioxide-arme warmte als bedoeld in
      [artikel 1 van de Algemene uitvoeringsregeling stimulering duurzame energieproductie en klimaattransitie][ref8];
        - *monomestvergisting:* biologische afbraakreacties van uitsluitend vaste en vloeibare uitwerpselen van dieren;
        - *minister:* Minister van Economische Zaken en Klimaat;
        - *netto P50-waarde vollasturen:* aantal vollasturen waarbij de verwachte jaarlijkse energieproductie voor een
      gegeven combinatie van locatie en productie-installatie voor de productie van hernieuwbare elektriciteit met behulp
      van windenergie dient te zijn bepaald met een waarschijnlijkheid van 50%;
        - *nominaal elektrisch rendement:* quotiënt van het nominaal elektrisch vermogen en: a. de som van het nominaal
      elektrisch vermogen en nominaal warmtevermogen in het geval van gecombineerde opwekking met behulp van een
      verbrandingsmotor; en b. het nominaal warmtevermogen van de ketel in het geval van gecombineerde opwekking met
      behulp van een stoomturbine of een organische rankinecyclus;
        - *nominaal vermogen:* maximale vermogen van de productie-installatie dat onder nominale condities benut kan worden
      voor de productie van hernieuwbare elektriciteit, hernieuwbare warmte, koolstofdioxide-arme warmte of hernieuwbaar
      gas en dat door de leverancier gegarandeerd wordt bij continu gebruik, waarbij in het geval van geothermische
      productie-installaties het nominaal vermogen dient te zijn bepaald met een waarschijnlijkheid van ten minste 50%;
        - *NTA 8003:* 2017: Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals deze luidde op 31 december 2017;
        - *primaire waterkering:* primaire waterkering als bedoeld in appendix b bij
      [bijlage I van de Regeling veiligheid primaire waterkeringen 2017][ref9];
        - *restwarmte:* onvermijdelijke thermische energie die als bijproduct in de bedrijfsvoering van een onderneming
      wordt opgewekt en die zonder nuttige aanwending ongebruikt terecht zou komen in lucht of water en die ten tijde van
      het verrichten van de aanvraag niet nuttig wordt aangewend;
        - *richtlijn (EU) 2018/2001:* [Richtlijn nr. 2018/2001](32018L2001)/EU van het Europees Parlement en de Raad van
      11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *stadsverwarming:* warmtelevering aan een warmtenet als bedoeld in
      [artikel 1, eerste lid, van de Warmtewet][ref10], waarbij de warmte door een producent wordt geleverd ten behoeve
      van ruimteverwarming en warmtapwatervoorzieningen van gebouwen;
        - *thermische conversie van vaste of vloeibare biomassa:* omzetting van vaste of vloeibare biomassa door middel
      van: a. verbranding; b. een andere thermische behandeling dan bedoeld onder a ingeval de producten daarvan
      vervolgens worden verbrand; of c. de verbranding van producten die voortkomen uit thermische behandeling;
        - *valhoogte:* verschil in waterpeil voor en achter de productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van waterkracht waarbij het nominaal vermogen wordt benut;
        - *verwarming van gebouwde omgeving:* stadsverwarming of ruimteverwarming en warmtapwatervoorzieningen in een
      gebouw, niet zijnde een kas, waarbij de producent de warmte rechtstreeks levert aan het desbetreffende gebouw;
        - *voorliggende waterkering:* voorliggende waterkering als bedoeld in appendix b bij
      [bijlage I van de Regeling veiligheid primaire waterkeringen 2017][ref11];
        - *waterstaatswerk:* waterstaatswerk als bedoeld in appendix b bij
      [bijlage I van de Regeling veiligheid primaire waterkeringen 2017][ref12];
        - *zeewering of zachte zeewering van Maasvlakte 2:* harde zeewering en zachte zeewering van Maasvlakte 2 als
      bedoeld in bijlage 1 van de concessie aan het Havenbedrijf Rotterdam N.V. te Rotterdam, bij Koninklijk Besluit van
      23 mei 2008, nr. 08.001524.


