  - number: '54.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van warmte geproduceerd door een productie-installatie
      voor de productie van warmte onttrokken uit oppervlaktewater en opgewaardeerd door middel van een warmtepomp met
      een COP-waarde van ten minste 3,0 met een nominaal thermisch vermogen van ten minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel54
  - number: '54.2'
    text: 'De productie-installatie, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel54
  - number: 54.2.a
    text: heeft een seizoensopslag van warmte die niet wordt gebruikt voor koudelevering; en
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel54
  - number: 54.2.b
    text: levert uitsluitend warmte aan de gebouwde omgeving;.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel54
  - number: '55.1'
    text: |-
      Subsidie als bedoeld in [artikel 54, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel54
