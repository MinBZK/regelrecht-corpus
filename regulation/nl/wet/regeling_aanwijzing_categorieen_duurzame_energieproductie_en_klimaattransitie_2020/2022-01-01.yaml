  - number: '2.7'
    text: |-
      Het zesde lid is niet van toepassing op een productie-installatie als bedoeld in
      [artikel 9b, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
