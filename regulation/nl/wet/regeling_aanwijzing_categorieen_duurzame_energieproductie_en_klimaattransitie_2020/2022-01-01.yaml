  - number: '68'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent die koolstofdioxide afvangt en permanent opslaat of
      doet opslaan in een ondergronds opslagvoorkomen voor koolstofdioxide waarbij:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel68
  - number: 68.a
    text: |-
      het aantal subsidiabele vollasturen ten hoogste 4.000 vollasturen per jaar bedraagt, de afvang van koolstofdioxide
      gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces en ten minste de compressor
      nieuw is;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel68
  - number: 68.b
    text: |-
      het aantal subsidiabele vollasturen ten hoogste 8.000 vollasturen per jaar bedraagt, de afvang van koolstofdioxide
      gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces en ten minste de compressor
      nieuw is;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel68
  - number: 68.c
    text: |-
      de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces en
      ten minste de installatie voor de afvang van koolstofdioxide en de compressor nieuw zijn; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel68
  - number: 68.d
    text: |-
      de afvang van koolstofdioxide gebeurt in een nieuw productieproces en ten minste de installatie voor de afvang van
      koolstofdioxide en de compressor nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel68
