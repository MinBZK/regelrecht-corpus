  - number: 4.c
    text: |-
      in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, die ingrijpend zijn gerenoveerd en
      waarbij ten minste de turbines nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel4
  - number: '5.1'
    text: |-
      Subsidie als bedoeld in [artikel 4][ref1] wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel4
