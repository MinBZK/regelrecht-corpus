        bwb_id: BWBR0044108
        artikel: '64'
        paragraaf: '3'
  - number: '65.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 64, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


