        artikel: '58'
        paragraaf: '3'
  - number: '59.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 58, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel58
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel59
    references:
      - id: ref1
