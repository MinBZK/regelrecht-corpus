        artikel: '58'
        paragraaf: '3'
  - number: '60.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van warmte geproduceerd door een productie-installatie
      voor de productie van warmte door middel van elektriciteit in een ketel.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel60
  - number: '60.2'
    text: |-
      De productie-installatie, bedoeld in het eerste lid, heeft een nominaal thermisch vermogen van ten minste 5 MWth,
      waarbij de geproduceerde warmte wordt toegepast in een systeem met een ontwerptemperatuur van ten minste 100 °C.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel60
  - number: '60.3'
    text: |-
      Het vermogen van de aansluiting op het elektriciteitsnet is ten minste even groot als het vermogen van de
      elektroboiler.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel60
  - number: '60.4'
    text: |-
      Het vermogen van de elektroboiler is niet groter dan het thermisch vermogen van de op de locatie aanwezige boilers
      die gestookt worden op fossiele brandstoffen.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel60
  - number: '61.1'
    text: |-
      Subsidie als bedoeld in [artikel 60, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel60
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '60'
        paragraaf: '3'
  - number: '61.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 60, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel60
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '60'
        paragraaf: '3'
  - number: '62.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van warmte geproduceerd door een productie-installatie
      voor de productie van warmte door middel van:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel62
  - number: 62.1.a
    text: |-
      een gesloten warmtepomp of compressiewarmtepomp met een COP-waarde van ten minste 2,3 en een nominaal thermisch
      vermogen van ten minste 500 kWth;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel62
  - number: 62.1.b
    text: |-
      een open warmtepomp of mechanische damprecompressie-installatie met een COP-waarde van ten minste 2,3 en ten
      hoogste 8,0 en een nominaal thermisch vermogen van ten minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel62
  - number: '62.2'
    text: |-
      De productie-installatie, bedoeld in het eerste lid, produceert warmte ten behoeve van een industriële toepassing
      en levert geen koude.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel62
  - number: '63.1'
    text: |-
      Subsidie als bedoeld in [artikel 62, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel62
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '62'
        paragraaf: '3'
  - number: '63.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 62, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel62
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '62'
        paragraaf: '3'
  - number: '64.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van warmte geproduceerd door een productie-installatie
      waarmee restwarmte wordt uitgekoppeld met een thermisch vermogen van ten minste 5 MWth en naar een andere locatie
      wordt getransporteerd waar deze warmte nuttig wordt aangewend, waarbij:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel64
  - number: 64.1.a
    text: transport plaatsvindt met behulp van een transportleiding; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel64
  - number: 64.1.b
    text: |-
      transport plaatsvindt met behulp van een transportleiding en de warmte wordt opgewaardeerd met een warmtepomp met
      een COP-waarde van ten minste 3,0.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel64
  - number: '64.2'
    text: |-
      De transportleiding, als bedoeld in het eerste lid, onderdeel a, kent ten minste 0,3833 kilometer transportleiding
      per MWth gezamenlijk outputvermogen van de productie-installatie en andere op de transportleiding invoedende
      installaties.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel64
  - number: '64.3'
    text: De levering van stoom wordt uitgesloten van subsidie.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel64
  - number: '65.1'
    text: |-
      Subsidie als bedoeld in [artikel 64, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel64
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel65
    references:
