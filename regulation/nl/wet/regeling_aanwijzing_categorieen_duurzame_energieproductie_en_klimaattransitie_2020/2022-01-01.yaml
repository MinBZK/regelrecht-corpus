        bwb_id: BWBR0044108
        artikel: '24'
        paragraaf: '3'
  - number: '25.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 24][ref1], binnen vier jaar na de datum
