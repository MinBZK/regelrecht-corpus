        artikel: '36'
        paragraaf: '3'
  - number: '37.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 36, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


