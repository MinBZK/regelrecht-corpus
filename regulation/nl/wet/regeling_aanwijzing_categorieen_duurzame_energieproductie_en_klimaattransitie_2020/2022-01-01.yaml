        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: '2.6'
    text: |-
      Een subsidie als bedoeld in het eerste lid van meer dan € 400.000.000,– alsmede een subsidie als bedoeld
      in [artikel 68, onderdelen c en d][ref1], worden verleend onder de opschortende voorwaarde dat binnen twee
      weken na afgifte van die beschikking een uitvoeringsovereenkomst overeenkomstig de overeenkomst opgenomen in
      [bijlage 1][ref2] tot stand is gekomen tussen de Staat en de subsidieontvanger en onder de opschortende voorwaarde
      dat de subsidieontvanger binnen vier weken na afgifte van de beschikking heeft aangetoond dat een bankgarantie als
      bedoeld in artikel 2, eerste lid, van de uitvoeringsovereenkomst is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0044108
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel2
    references:
