  - number: '2.2'
    text: |-
      Het productieplafond voor het verlenen van subsidie op grond van [artikel 68][ref1] die wordt aangevraagd in het
      eerste lid genoemde periode voor de afvang en permanente opslag van koolstofdioxide:


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel68
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '68'
        paragraaf: '3'
  - number: 2.2.a
    text: |-
      waarvan koolstofdioxide afkomstig is als bijproduct van producenten uit de sectoren met sbi-codes 6, 8 tot en met
      33, 38, 35.2 en 35.3 bedraagt 108.000.000.000 kg; en
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel2
  - number: 2.2.b
    text: |-
      waarvan koolstofdioxide afkomstig is als bijproduct van producenten uit de sector met sbi-code 35.1 bedraagt
      45.000.000.000 kg.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel2
  - number: '2.3'
    text: De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel2
  - number: '2.4'
    text: |-
      Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een productie-
      installatie wordt geplaatst maximaal één aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel2
  - number: '2.5'
    text: |-
      De minister beslist afwijzend op een aanvraag als bedoeld in het eerste lid, indien geen toestemming van de
      eigenaar van de beoogde locatie kan worden overgelegd met gebruikmaking van het middel dat door de minister
      beschikbaar wordt gesteld of indien geen gedoogplichtbeschikking op grond van [artikel 2, vijfde lid][ref1], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] ten aanzien van de beoogde locatie voor het
      plaatsen van de productie-installatie kan worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel2
    references:
