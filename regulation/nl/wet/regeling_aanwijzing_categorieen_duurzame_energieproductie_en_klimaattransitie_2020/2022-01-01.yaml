  - number: '70.4'
    text: |-
      In afwijking van de fasebedragen genoemd in de derde, vierde, vijfde of zesde kolom van de tabel in het tweede lid
      geldt voor de productiecategorieën, bedoeld in [artikel 68][ref1] het fasebedrag in euro per 1.000 kg broeikasgas
      in vier decimalen dat door de aanvrager bij de aanvraag in een fase is ingediend, mits dat bedrag per 1.000 kg
      broeikasgas lager is dan het fasebedrag, genoemd in de respectievelijke derde, vierde, vijfde of zesde kolom van de
      tabel in het tweede lid dat voor de fase waarin de aanvraag is ingediend van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel68
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel70
    references:
      - id: ref1
