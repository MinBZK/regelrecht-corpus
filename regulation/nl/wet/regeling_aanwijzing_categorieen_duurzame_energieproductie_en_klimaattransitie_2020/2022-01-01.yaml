    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel24
  - number: '25.1'
    text: |-
      Subsidie als bedoeld in [artikel 24][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel24
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel25
    references:
