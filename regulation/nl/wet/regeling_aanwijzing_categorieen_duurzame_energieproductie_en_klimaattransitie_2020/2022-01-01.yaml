      - id: ref1
        bwb_id: BWBR0044108
        artikel: '24'
        paragraaf: '3'
  - number: '26.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas, niet zijnde biosyngas,
      geproduceerd door een productie-installatie voor de productie van hernieuwbaar gas door middel van vergassing,
      waarbij ten minste de vergasser nieuw is, uit:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel26
  - number: 26.1.a
    text: 'biomassa als bedoeld in de NTA 8003: 2017; of'
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel26
  - number: 26.1.b
    text: |-
      biomassa als bedoeld in de NTA 8003: 2017, met uitzondering van B-Hout als bedoeld in nummers 100, 150, 170 t/m 179
      van de NTA 8003: 2017.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel26
  - number: '26.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel26
  - number: '26.3'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de in een installatie met een totaal nominaal thermisch uitgangsvermogen van de groengasinstallatie gelijk aan
      of groter dan 20 MW gebruikte biomassa voldoet aan de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld
      in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel26
  - number: '27.1'
    text: |-
      Subsidie als bedoeld in [artikel 26, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel26
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '26'
        paragraaf: '3'
  - number: '27.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 26, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel26
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '26'
        paragraaf: '3'
  - number: '28.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie die uitsluitend voorziet in de productie van hernieuwbare warmte uit zonne-energie, en
      waarbij uitsluitend gebruik wordt gemaakt van afgedekte collectoren waarbij de transparante isolerende laag, niet
      zijnde beglazing van kassen of fotovoltaïsche zonnepanelen, een geïntegreerd geheel vormt met de collector, met een
      totaal thermisch vermogen:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel28
  - number: 28.1.a
    text: groter dan of gelijk aan 140 kWth en kleiner dan 1 MWth; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel28
  - number: 28.1.b
    text: groter dan of gelijk aan 1 MWth.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel28
  - number: '28.2'
    text: |-
      Het vermogen in kWth van de productie-installatie, bedoeld in het eerste lid, wordt berekend door de
      apertuuroppervlakte in vierkante meter te vermenigvuldigen met een factor 0,7.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel28
  - number: '28.3'
    text: |-
      Subsidie als bedoeld in het eerste lid wordt niet verstrekt indien reeds op basis van
      [artikel 4.5.2. van de Regeling nationale EZ-subsidies][ref1] subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: '4'
  - number: '29.1'
    text: |-
      Subsidie als bedoeld in [artikel 28, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel28
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '28'
        paragraaf: '3'
  - number: '29.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 28, eerste lid][ref1], binnen drie jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel28
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '28'
        paragraaf: '3'
  - number: '30'
    text: 'De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
  - number: 30.a
    text: |-
      een productie-installatie met een vermogen tot 20 MW, bestaande uit één of meer doubletten, waarmee hernieuwbare
      warmte wordt geproduceerd uitsluitend door middel van één of meer geothermische bronnen dieper gelegen dan de
      formatielagen van de Noordzee Groep en met een diepte van ten minste 500 meter;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
  - number: 30.b
    text: |-
      een productie-installatie met een vermogen van ten minste 20 MW, bestaande uit één of meer doubletten, waarmee
      hernieuwbare warmte wordt geproduceerd uitsluitend door middel van één of meer geothermische bronnen dieper gelegen
      dan de formatielagen van de Noordzee Groep en met een diepte van ten minste 500 meter;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
  - number: 30.c
    text: |-
      een productie-installatie, bestaande uit één of meer doubletten, waarmee uitsluitend door middel van één of meer
      geothermische bronnen dieper gelegen dan de formatielagen van de Noordzee Groep en met een diepte van ten minste
      500 meter hernieuwbare warmte wordt geproduceerd die wordt aangewend voor verwarming van de gebouwde omgeving;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
  - number: 30.d
    text: |-
      een productie-installatie met een vermogen tot 20 MW, bestaande uit één of meer doubletten, waarmee hernieuwbare
      warmte wordt geproduceerd, gebruikmakend van ten minste één olie- of gasput dieper gelegen dan de formatielagen van
      de Noordzee Groep en met een diepte van ten minste 500 meter;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
  - number: 30.e
    text: |-
      een productie-installatie met een vermogen van ten minste 20 MW, bestaande uit één of meer doubletten, waarmee
      hernieuwbare warmte wordt geproduceerd, gebruikmakend van ten minste één olie- of gasput dieper gelegen dan de
      formatielagen van de Noordzee Groep en met een diepte van tenminste 500 meter;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
  - number: 30.f
    text: |-
      een productie-installatie als bedoeld in de onderdelen a, b, d of e, waarvoor op het moment van aanvragen reeds een
      subsidie is verleend op grond van het [Besluit SDE][ref1], die wordt uitgebreid met ten minste één aanvullende put
      dieper gelegen dan de formatielagen van de Noordzee Groep en met een diepte van ten minste 500 meter; of


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 30.g
    text: |-
      een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 4.000 meter.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel30
  - number: '31.1'
    text: |-
      Subsidie als bedoeld in [artikel 30][ref1] wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel30
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '30'
        paragraaf: '3'
  - number: '31.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 30][ref1], binnen vier jaar na de datum
      van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel30
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '30'
        paragraaf: '3'
  - number: '32'
    text: 'De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel32
  - number: 32.a
    text: |-
      een productie-installatie, bestaande uit één of meer doubletten, waarmee koolstofdioxide-arme warmte wordt
      geproduceerd uitsluitend door middel van één of meer geothermische bronnen gelegen in de formatielagen van
      de Noordzeegroep met een diepte van ten minste 500 meter, waarbij de warmte wordt opgewaardeerd met een
      compressiewarmtepomp met een COP-waarde van ten minste 3,0 en met een nominaal thermisch vermogen van ten minste
      500 kWth; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel32
  - number: 32.b
    text: |-
      een productie-installatie, bestaande uit één of meer doubletten, waarmee koolstofdioxide-arme warmte wordt
      geproduceerd uitsluitend door middel van één of meer geothermische bronnen gelegen in de formatielagen van
      de Noordzeegroep met een diepte van ten minste 500 meter, waarbij de warmte wordt opgewaardeerd met een
      compressiewarmtepomp met een COP-waarde van ten minste 3,0 en met een nominaal thermisch vermogen van ten minste
      500 kWth en de warmte wordt aangewend voor de verwarming van de gebouwde omgeving.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel32
  - number: '33.1'
    text: |-
      Subsidie als bedoeld in [artikel 32][ref1] wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel32
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '32'
        paragraaf: '3'
  - number: '33.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 32][ref1], binnen vier jaar na de datum
      van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel32
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '32'
        paragraaf: '3'
  - number: '34.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, hernieuwbare elektriciteit of
      hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: 34.1.a
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van allesvergisting, waarbij
      ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: 34.1.b
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door middel
      van allesvergisting, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten
      minste 20% bedraagt;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: 34.1.c
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met
      een vermogen groter dan 400 kW, waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: 34.1.d
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door middel
      van monomestvergisting, met een vermogen groter dan 400 kW, voor elektrisch en thermisch vermogen samen, waarbij
      ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste 20% bedraagt;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: 34.1.e
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met
      een vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister nieuw is; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: 34.1.f
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door
      middel van monomestvergisting, met een vermogen kleiner dan of gelijk aan 400 kW, voor elektrisch en thermisch
      vermogen samen, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste
      20% bedraagt.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: '34.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de in een installatie met een totaal nominaal thermisch ingangsvermogen gelijk aan of groter dan 2 MW gebruikte
      biomassa voldoet aan de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid,
      van de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel34
  - number: '35.1'
    text: |-
      Subsidie als bedoeld in [artikel 34][ref1] wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel34
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '34'
        paragraaf: '3'
  - number: '35.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 34][ref1], binnen vier jaar na de datum
      van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel34
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '34'
        paragraaf: '3'
  - number: '36.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte
      of hernieuwbare elektriciteit en hernieuwbare warmte uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib waarbij er verbeteringen zijn uitgevoerd in het productieproces
      waarna er per ton slib sprake is van ten minste 25% meer biogasproductie ten opzichte van voor de verbetering:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel36
  - number: 36.1.a
    text: |-
      waarmee hernieuwbare warmte wordt geproduceerd, waarbij ten minste de installatie-onderdelen die verantwoordelijk
      zijn voor de meerproductie nieuw zijn; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel36
  - number: 36.1.b
    text: |-
      waarmee hernieuwbare warmte en hernieuwbare elektriciteit wordt geproduceerd, waarbij ten minste de installatie-
      onderdelen die verantwoordelijk zijn voor de meerproductie nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel36
  - number: '36.2'
    text: |-
      De installatiedelen die verantwoordelijk zijn voor de meerproductie, bedoeld in het eerste lid, worden niet in
      gebruik genomen voor de subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel36
  - number: '36.3'
    text: |-
      De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer de producent minder dan
      een jaar produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel36
  - number: '36.4'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de in een installatie met een totaal nominaal thermisch ingangsvermogen gelijk aan of groter dan 2 MW gebruikte
      biomassa voldoet aan het broeikasgasemissiereductiecriterium, bedoeld in artikel 29, eerste lid, van de [richtlijn
      (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel36
  - number: '37.1'
    text: |-
      Subsidie als bedoeld in [artikel 36, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel36
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel37
    references:
      - id: ref1
