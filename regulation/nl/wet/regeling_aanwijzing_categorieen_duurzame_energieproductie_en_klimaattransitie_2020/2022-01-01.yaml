      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonlicht uitsluitend door middel
      van fotovoltaïsche zonnepanelen, die is aangesloten op een elektriciteitsnet via een aansluiting met een totale
      maximale doorlaatwaarde van meer dan 3*80 A:
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: 16.1.a
    text: met een totaal nominaal vermogen groter dan of gelijk aan 15 kWp en kleiner dan 1 MWp;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: 16.1.b
    text: |-
      met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen op of aan een gebouw zijn
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: 16.1.c
    text: |-
      met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen, niet met een gebouw
      verbonden, op land staan;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: 16.1.d
    text: |-
      met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen, niet met een gebouw
      verbonden, op land staan, en automatisch met de stand van de zon meebewegen door middel van een zonvolgsysteem;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: 16.1.e
    text: met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen drijven op water; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: 16.1.f
    text: |-
      met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen drijven op water en
      automatisch met de stand van de zon meebewegen door middel van een zonvolgsysteem.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: '16.2'
    text: |-
      Voor de werking van dit artikel wordt onder gebouw tevens verstaan een aan de grond gebonden overkapping ten
      behoeve van het tegen weersinvloeden beschermd parkeren van voertuigen.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel16
  - number: '17.1'
    text: |-
      Subsidie als bedoeld in [artikel 16][ref1] wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel16
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '16'
        paragraaf: '3'
  - number: '17.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 16, eerste lid, onderdeel a][ref1], binnen
      achttien maanden na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel16
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '16'
        paragraaf: '3'
  - number: '17.3'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 16, eerste lid, onderdeel b][ref1], binnen
      drie jaar na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel16
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '16'
        paragraaf: '3'
  - number: '17.4'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in
      [artikel 16, eerste lid, onderdelen c, d, e en f][ref1], binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel16
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '16'
        paragraaf: '3'
  - number: '17.5'
    text: |-
      Op aanvragen van een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie als bedoeld in [artikel 16, eerste lid, onderdeel a][ref1], is
      [artikel 3, eerste en tweede lid, van de algemene uitvoeringsregeling][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0023563#Artikel3
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0023563
        artikel: '3'
  - number: '18.1'
    text: 'De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel18
  - number: 18.1.a
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van allesvergisting,
      waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel18
  - number: 18.1.b
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd door middel van monomestvergisting, met een
      vermogen groter dan 400 kW, waarbij ten minste de vergister nieuw is; of
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel18
  - number: 18.1.c
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd door middel van monomestvergisting, met een
      vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister nieuw is.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel18
  - number: '18.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de in een installatie met een totaal nominaal thermisch uitgangsvermogen van de groengasinstallatie gelijk aan
      of groter dan 20 MW gebruikte biomassa voldoet aan de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld
      in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel18
  - number: '19.1'
    text: |-
      Subsidie als bedoeld in [artikel 18][ref1] wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel18
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '18'
        paragraaf: '3'
  - number: '19.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 18][ref1], binnen vier jaar na de datum
      van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel18
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '18'
        paragraaf: '3'
  - number: '20.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie waarmee uitsluitend door middel van allesvergisting hernieuwbaar gas wordt geproduceerd, waarvoor
      reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt als productie-installaties voor de productie van
      elektriciteit of warmte en waarvoor op het moment van aanvraag ten minste negen jaar voordien de subsidieperiode
      is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: '20.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de in een installatie met een totaal nominaal thermisch uitgangsvermogen van de groengasinstallatie gelijk aan
      of groter dan 20 MW gebruikte biomassa voldoet aan de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld
      in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel20
  - number: '21.1'
    text: |-
      Subsidie als bedoeld in [artikel 20][ref1] wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel20
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '20'
        paragraaf: '3'
  - number: '21.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 20][ref1], binnen vier jaar na de datum
      van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel20
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '20'
        paragraaf: '3'
  - number: '22.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib waarbij er verbeteringen zijn uitgevoerd in het productieproces
      waarna er per ton slib sprake is van ten minste 25% meer biogasproductie ten opzichte van voor de verbetering en
      waarbij ten minste de installatiedelen die verantwoordelijk zijn voor de aanvullende productie van biogas nieuw
      zijn.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel22
  - number: '22.2'
    text: |-
      De installatiedelen die verantwoordelijk zijn voor de aanvullende productie, bedoeld in het eerste lid, worden niet
      in gebruik genomen voor de subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel22
  - number: '22.3'
    text: |-
      De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer de producent minder dan
      een jaar produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel22
  - number: '22.4'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de in een installatie met een totaal nominaal thermisch uitgangsvermogen van de groengasinstallatie gelijk aan
      of groter dan 20 MW gebruikte biomassa voldoet aan het broeikasgasemissiereductiecriterium, bedoeld in artikel 29,
      eerste lid, van de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel22
  - number: '23.1'
    text: |-
      Subsidie als bedoeld in [artikel 22, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel22
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '22'
        paragraaf: '3'
  - number: '23.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 22, eerste lid][ref1], binnen vier jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044108#Artikel22
    url: https://wetten.overheid.nl/BWBR0044108/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0044108
        artikel: '22'
        paragraaf: '3'
  - number: '24.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib, waarbij ten minste de opwerkinstallatie waarmee biogas op
      aardgaskwaliteit wordt gebracht nieuw is.
