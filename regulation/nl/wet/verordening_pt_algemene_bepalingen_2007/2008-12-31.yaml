preamble:
  text: |-
    gelet op de artikelen 77, 83, 93, 95, 104, 106, 126, 127 van de Wet op de bedrijfsorganisatie;

    gelet op hoofdstuk 4, 6, 7 en 10 van de Algemene wet bestuursrecht;

    gelet op de artikelen 12 tot en met 14 van het Instellingsbesluit Productschap Tuinbouw;

    gehoord:

    de Commissie voor hovenierswerkzaamheden, d.d. 11 april 2007,

    de Commissie voor boomkwekerijproducten, d.d. 9 mei 2007,

    de Commissie voor bloemkwekerijproducten, d.d. 16 mei 2007,

    de Commissie voor energie d.d. 31 mei 2007,

    de Commissie voor groenten en fruit, d.d. 19 juni 2007,

    de Sociaal-Economische Commissie, d.d. 21 juni 2007, en

    de Commissie voor bollen, knollen en wortelstokken van bloemgewassen, d.d. 26 juni 2007

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#ArtikelAanhef
articles:
  - number: 1:1.1
    text: |-
      In deze verordening worden de begripsbepalingen van het [Instellingsbesluit Productschap Tuinbouw][ref1]
      overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016235
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016235
  - number: 1:1.2
    text: |-
      In de verordeningen van het Productschap Tuinbouw wordt verstaan onder.







                    a.


                    productschap:


                    het Productschap Tuinbouw;




                    b.


                    bestuur:


                    het bestuur van het productschap;




                    c.


                    dagelijks bestuur:


                    uit het midden van het bestuur samengesteld bestuur als bedoeld in
      [artikel 84 van de Wet op de bedrijfsorganisatie][ref1];




                    d.


                    de voorzitter:


                    de voorzitter van het productschap;




                    e.


                    secretaris:


                    de secretaris van het productschap;




                    f.


                    functionaris:


                    eenieder werkzaam bij het productschap




                    g.


                    onderneming:


                    onderneming waarvoor het productschap is ingesteld;




                    h.


                    de ondernemer:


                    de natuurlijke of rechtspersoon die een onderneming drijft waarvoor het productschap is ingesteld,
      veilingen, telersverenigingen en afzetorganisaties;




                    i.


                    de wet:


                    de [Wet op de bedrijfsorganisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0002058
  - number: 2:1.1
    text: |-
      De ondernemer is verplicht binnen 30 dagen na de aanvang van de onderneming hiervan schriftelijke mededeling te
      doen bij het productschap.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel21
  - number: 2:1.2
    text: |-
      Nadat de ondernemer de verzochte registratiegegevens aan het productschap heeft verstrekt, stuurt het productschap
      de ondernemer een bericht van registratie en een registratienummer.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel21
  - number: 2:1.3
    text: |-
      De ondernemer is verplicht binnen 30 dagen na wijziging van de gegevens als bedoeld in het voorgaande lid, dan wel
      na beëindiging van de onderneming, hiervan schriftelijke mededeling te doen bij het productschap.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel21
  - number: 2:1.4
    text: Het productschap houdt in beheer een register van ondernemingen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel21
  - number: 2:1.5
    text: |-
      Het bestuur van het productschap is bevoegd bij besluit nadere voorschriften vast te stellen ter uitvoering van het
      bepaalde in de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel21
  - number: 2:2.1
    text: |-
      Iedere natuurlijke persoon en elke rechtspersoon, die een onderneming drijft waarvoor het productschap is ingesteld
      is verplicht:
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.1.a
    text: |-
      de door of vanwege het productschap met betrekking tot het voeren van een administratie gegeven voorschriften en
      aanwijzingen na te komen en deze administratie volledig en naar waarheid bij te houden en te bewaren.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.1.b
    text: |-
      de vragen, welke hem door of vanwege het productschap betreffende de administratie van en de werkzaamheden in zijn
      onderneming worden gesteld, prompt, volledig en naar waarheid te beantwoorden, zomede op eerste vordering de door
      of vanwege het productschap verlangde boeken, papieren en/of andere bescheiden tegen ontvangstbewijs in te leveren
      of in te zenden.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.1.c
    text: |-
      . indien hij mondeling of schriftelijk - al dan niet op door of vanwege het productschap of enige andere instantie
      of instelling verstrekte formulieren of soortgelijke bescheiden, gegevens, inlichtingen, opgaven of andere
      mededelingen, waaruit voor hemzelf of voor een ander enig recht of enig voordeel ontstaat of voortvloeit, dan
      wel zou kunnen ontstaan of voortvloeien, aan het productschap of aan enig(e) door of vanwege het productschap
      aangewezen instantie, instelling of persoon verstrekt, zulks prompt, volledig en naar waarheid te doen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.1.d
    text: |-
      de schriftelijke kennisgevingen, hem door of vanwege het productschap toegezonden, blijkens welke hem enig recht of
      enige bevoegdheid wordt toegekend, ter plaatse waar het bedrijf wordt uitgeoefend te bewaren.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.1.e
    text: |-
      op eerste vordering van functionarissen behorende tot de door het bestuur aangewezen toezichthouder, die in
      het bezit zijn van een door de voorzitter of secretaris afgegeven legitimatiebewijs en zich desgevraagd hebben
      gelegitimeerd, toe te laten dat deze personen inzage nemen van de in de onderneming aanwezige boeken, papieren
      en/of andere bescheiden, zomede dat zij de in de onderneming aanwezige voorraden, alsmede de bedrijfsmiddelen
      bezichtigen en opnemen, hen daartoe de vrije gelegenheid te geven en hen daarbij desgevraagd behulpzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.2
    text: |-
      De in het eerste lid gestelde regelen binden mede alle andere dan de aldaar bedoelde natuurlijke personen en
      rechtspersonen, die ondernemingen drijven, waarvoor het productschap is ingesteld, voor zover deze handelingen
      verrichten, welke bedrijfsmatig plegen te worden verricht in de ondernemingen, waarvoor het productschap is
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.3
    text: |-
      De in het eerste lid onder a bedoelde administratie wordt gedurende 8 jaar bewaard, zover deze administratie
      betrekking heeft op gegevens die van belang zijn voor het bepalen van enige door het productschap op te leggen
      heffing.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.4
    text: |-
      Wanneer de voorzitter of de secretaris zulks nodig acht en voor zover van belang voor de bepaling
      van de heffing, dient een ondernemer, die op grond van een heffingsverordening als bedoeld in
      [artikel 126 van de Wet op de bedrijfsorganisatie][ref1] heffingsplichtig is, een accountantsverklaring in, waaruit
      blijkt:


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '126'
  - number: 2:2.4.a
    text: |-
      de totale in het betreffende kalenderjaar geproduceerde, be- of verwerkte, verhandelde, geleverde of afgenomen
      hoeveelheden product;
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.4.b
    text: de herkomst of bestemming van de onder a bedoelde hoeveelheden naar categorie bedrijven.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.5
    text: |-
      De in het eerste lid bedoelde gegevens, zullen - voor zover deze bij of krachtens de wet niet slechts worden
      gebruikt ter vervulling van de taak van het productschap - niet onder vermelding of aanduiding van de persoon en/
      of onderneming, waarop zij betrekking hebben, worden bekend gemaakt aan anderen dan de voorzitter, de secretaris of
      andere personen van het secretariaat van het productschap en de met financiële controle op het productschap belaste
      accountant en diens personeel alsmede de door het bestuur aangewezen toezichthouder, voorzover het kennis nemen van
      die gegevens voor die controle dan wel het toezicht noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.6
    text: |-
      Indien de in het vierde lid bedoelde accountantsverklaring niet afkomstig is van een registeraccountant (RA) of
      accountant-administratieconsulent (AA), kan de Interne accountantsdienst van het productschap controles uitvoeren.
      De kosten hiervan kunnen aan de ondernemer in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:2.7
    text: |-
      Bekendmaking van gegevens, als bedoeld in het vierde lid, blijft ook zonder vermelding of aanduiding van de persoon
      en/of onderneming waarop zij betrekking hebben, achterwege in de gevallen waarin uit de aard der gegevens dan wel
      of zomede uit een of meer andere omstandigheden zou kunnen blijken op welke persoon en/of onderneming de gegevens
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel22
  - number: 2:3.1
    text: |-
      Op overtreding van het bepaalde bij of krachtens het tweede hoofdstuk van de verordening worden tuchtrechtelijke
      maatregelen gesteld.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel23
  - number: 2:3.2
    text: Het bevoegde tuchtgerecht is het Tuchtgerecht Akkerbouwproductschappen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel23
  - number: 3:1
    text: |-
      In dit hoofdstuk wordt verstaan onder:







                  a.


                  ambtshalve schatting:


                  nota op basis van door het productschap geraamde omvang van de grondslag die voor de onderneming
      ingevolge heffingsverordeningen van toepassing is;




                  b.


                  aangifteformulier:


                  door het productschap opgesteld voor het verkrijgen van gegevens die nodig zijn om de omvang van de
      grondslag voor de verschillende heffingsverordeningen te bepalen;




                  c.


                  boekencontrole:


                  controle van de in de onderneming of bij diens accountant aanwezige boeken en/of bescheiden, zomede dat
      zij de in de onderneming aanwezige voorraden, alsmede bedrijfsmiddelen, bezichtigen en opnemen en zij daartoe de
      vrije gelegenheid geven noodzakelijk voor de vaststelling van een juiste en volledige omvang van die grondslagen
      die leiden tot, de over de te controleren periode, op te leggen heffingen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel31
  - number: 3:3
    text: De ondernemer is jaarlijks aan het productschap een heffing verschuldigd.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel33
  - number: 3:4.1
    text: Aan de onderneming wordt een aangifteformulier toegezonden.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.2
    text: |-
      Het aangifteformulier dient binnen 30 dagen ingevuld met de juiste gegevens en ondertekend aan het productschap te
      worden geretourneerd.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.3
    text: De verstrekte gegevens worden door het productschap gecontroleerd op correcte invulling.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.4
    text: De gegevens worden vervolgens verwerkt in het heffingenbestand.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.5
    text: Hierna wordt de berekening van de heffing opgestart.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.6
    text: Het opmaken van de nota vindt vervolgens plaats.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.7
    text: Indien niet is voldaan aan het gestelde onder het tweede lid, wordt een herinneringsbrief toegezonden.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.8
    text: Binnen 14 dagen dienen dan alsnog de gevraagde gegevens te zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.9
    text: |-
      Indien de gegevens als bedoeld in het tweede lid dan wel het achtste lid, niet, niet tijdig, of niet volledig zijn
      verstrekt, dan:
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.9.a
    text: |-
      wordt voor het bepalen van de hoogte van de heffing, de gegevens van het daaraan voorafgaande jaar als uitgangspunt
      genomen, verhoogd of verlaagd met het trendmatig percentage geldig voor de desbetreffende sector. Bij het ontbreken
      van gegevens van het voorafgaande jaar worden andere beschikbare gegevens zoals arealen, veilinggegevens, gegevens
      van de Kamer van Koophandel, internet, etc. gebruikt om toch tot een reële schatting met bijbehorend trendmatig
      percentage te komen. Indien op bovenstaande wijze géén reële schatting gemaakt kan worden, zal een afgewogen
      gemiddelde schatting in de desbetreffende sector worden gehanteerd, en
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.9.b
    text: wordt de heffing verhoogd met € 40,- administratiekosten.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:4.10
    text: |-
      Wordt de ambtshalve schatting, met medewerking van de heffingsplichtige, alsnog omgezet in een normale aangifte,
      dan blijft de € 40,- administratiekosten verschuldigd.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel34
  - number: 3:5
    text: |-
      In afwijking van het bepaalde in het [voorgaande artikel][ref1] kan de heffingsplichtge een voorlopige heffing
      worden opgelegd tot het bedrag waarop de heffing vermoedelijk zal worden vastgesteld. De voorlopige heffing wordt
      verrekend met de krachtens de van toepassing zijnde heffingsverordening verschuldigde heffing.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel3
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:6
    text: 'De heffingsnota bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel36
  - number: 3:6.a
    text: de naam van de onderneming;
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel36
  - number: 3:6.b
    text: het adres van de onderneming
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel36
  - number: 3:6.c
    text: een specificatie of toelichting omtrent de wijze waarop de heffing is berekend;
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel36
  - number: 3:6.d
    text: het totaal van de heffing, en
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel36
  - number: 3:6.e
    text: een dagtekening.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel36
  - number: 3:7.1
    text: Het productschap is gerechtigd ten behoeve van een richtige heffing een boekencontrole uit te voeren.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel37
  - number: 3:7.2
    text: |-
      Deze boekencontrole wordt uitgevoerd door een functionaris van het productschap, die in het bezit is van een
      schriftelijke machtiging van de voorzitter
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel37
  - number: 3:7.3
    text: |-
      Indien bij de boekencontrole blijkt dat een onjuiste opgave is gedaan als bedoeld in
      [artikel 3:4, tweede lid][ref1], wordt ingeval een navordering verhoogd met maximaal 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel3
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:7.4
    text: |-
      Indien er bij een boekencontrole sprake is van een opgelegde ambtshalve schatting als bedoeld in
      [artikel 3:4, negende lid][ref1], wordt de na de boekencontrole opgestelde nota met 10% verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel3
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:7.5
    text: |-
      De termijn waarover de boekencontrole zich uitstrekt is maximaal acht jaar, waarbij niet meer dan de vijf meest
      recente aangiftejaren worden gecontroleerd
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel37
  - number: 3:8.1
    text: De betaling geschiedt binnen 30 dagen na dagtekening van de nota.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel38
  - number: 3:8.2
    text: 'In afwijking van het eerste lid is de nota is terstond invorderbaar zodra:'
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel38
  - number: 3:8.2.a
    text: het faillissement van de heffingsplichtige is aangevraagd;
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel38
  - number: 3:8.2.b
    text: degene die de onderneming drijft de onderneming beëindigt, of van het voornemen daartoe blijkt, of
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel38
  - number: 3:8.2.c
    text: |-
      degene die de onderneming drijft zich metterwoon in het buitenland heeft gevestigd of van het voornemen daartoe
      blijkt.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel38
  - number: 3:9
    text: |-
      De heffingsplichtige, die niet of niet geheel binnen de in [artikel 3:8][ref1] bedoelde termijn heeft betaald,
      worden de daaruit voortvloeiende extra kosten van € 22,50 in rekening gebracht, alsmede de wettelijke interest
      over het niet betaalde bedrag, te berekenen vanaf de dag waarop de betaling diende te zijn verricht, ingevolge de
      aanmaning als bedoeld in [artikel 127, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '127'
  - number: 3:10
    text: |-
      De invorderingskosten voortvloeiend uit het niet betalen binnen de termijn als bedoeld in [artikel 3:8][ref1] en
      [3:9][ref2]. zijn voor rekening en risico van de ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022738#Artikel3
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022738
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:11
    text: |-
      De voorzitter is belast met de oplegging en inning van de heffing en de daarmee samenhangende kosten als bedoeld in
      de [artikelen 3:8 tot en met 3:10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel3
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4:1
    text: |-
      Iedere ondernemer is verplicht de voor de afnemer bestemde facturen op de dag van uitvoer, onderscheidenlijk het
      brengen buiten het verzendgebied, aan het productschap toe te zenden.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel41
  - number: 4:2
    text: |-
      In afwijking van het bepaalde in [artikel 4:1][ref1] zendt iedere ondernemer die bloemkwekerijproducten verhandelt
      de facturen aan het Hoofd bedrijfschap Agrarische Groothandel/bloemen en planten.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel4
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:3
    text: |-
      De ondernemer die bloemkwekerijproducten uitvoert of buiten het verzendgebied brengt, is verplicht om, zodra
      de buitenlandse afnemer een zending bloemkwekerijproducten heeft betaald, het Hoofdbedrijfschap Agrarische
      Groothandel/Bloem en Planten van deze betaling in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel43
  - number: 4:4
    text: |-
      Het bestuur van het productschap kan, bij besluit, omtrent de uitvoering van het bepaalde in dit hoofdstuk nadere
      voorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel44
  - number: 5:1
    text: |-
      De [artikelen 26][ref1] en [27 van de wet][ref2] zijn van overeenkomstige toepassing op het (dagelijks)
      bestuur, de artikel 88/88a-commissies, overige commissies en werkverbanden, behoudens het bepaalde in
      [artikel 90 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel90
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '90'
  - number: 5:2
    text: |-
      De [artikelen 10][ref1] en [77 van de wet][ref2] zijn ten aanzien van (dagelijks) bestuur, de artikel 88/88a-
      commissies, overige commissies en werkverbanden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel77
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '77'
  - number: 5:3
    text: |-
      De beslissingsbevoegdheid ten aanzien van een aantal besluiten wordt overeenkomstig
      [artikel 95, tweede lid van de wet][ref1] overgedragen aan commissies ingesteld op grond van
      [artikel 88a van de wet][ref2] en de Sociaal Economische Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '95'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: 6:1
    text: |-
      De voorzitter is belast met de uitvoering van verordeningen en besluiten van het (dagelijks) bestuur en oefent
      de daarmee verband houdende bevoegdheden uit, tenzij deze bevoegdheden uitdrukkelijk aan het (dagelijks) bestuur
      zijn voorbehouden en met dien verstande, dat het (dagelijks) bestuur, ingeval het zulks nodig oordeelt, een andere
      voorziening kan treffen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel61
  - number: 6:2
    text: |-
      De voorzitter is bevoegd de tekst van ontwerp-verordeningen als bedoeld in [artikel 100 van de wet][ref1], vast te
      stellen. Het bestuur kan, ingeval het zulks nodig oordeelt, een andere voorziening treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel100
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '100'
  - number: 6:3
    text: |-
      De voorzitter is bevoegd tot het nemen van beslissingen, welke betrekking hebben op, voortvloeien uit of verband
      houden met het dagelijks beheer als bedoeld in [artikel 123, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel123
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '123'
  - number: 6:4.1
    text: 'De voorzitter kan een functionaris van het secretariaat machtigen, de hem krachtens:'
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel64
  - number: 6:4.1.a
    text: |-
      [artikel 127 van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '127'
  - number: 6:4.1.b
    text: |-
      [artikel 49 van de Landbouwwet][ref1], toekomende bevoegdheden uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel49
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '49'
  - number: 6:4.2
    text: |-
      De voorzitter is bevoegd de afdoening en ondertekening van namens hem en onder zijn verantwoordelijkheid uitgaande
      stukken, alsmede verrichten van bepaalde rechtshandelingen over te laten aan één of meer functionarissen van het
      productschap.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel64
  - number: 6:5
    text: |-
      De voorzitter oefent de krachtens [artikel 11, van de In- en Uitvoerwet][ref1], en
      [artikel 23, van de Landbouwwet][ref2] aan het bestuur overgedragen bevoegdheden - andere dan verordenende - uit.
      Het bestuur kan ingeval het zulks nodig acht, een andere voorziening treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel23
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '23'
  - number: 6:6.1
    text: |-
      De voorzitter is bevoegd te beslissen over het voeren van verweer door het productschap voor het College van Beroep
      voor het bedrijfsleven, alsmede te beslissen op bij het productschap ingediende bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel66
  - number: 6:6.2
    text: |-
      De voorzitter kan functionarissen van het secretariaat machtigen, de in het eerste lid bedoelde bevoegdheden uit
      te oefenen.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel66
  - number: 7:1.1
    text: |-
      De voorzitter geniet een maandelijkse vergoeding, welke gelijk is aan het hoogste bedrag van schaal 16, opgenomen
      in de bijlage III, behorende bij de collectieve arbeidsovereenkomst voor de Publiekrechtelijke Bedrijfsorganisatie
      (CAO-PBO), verhoogd met 16,5% en afgerond op hele euro’s en uitgaande van een voltijdse functievervulling.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel71
  - number: 7:1.2
    text: Voor het overige zijn op hem van toepassing de bepalingen zoals opgenomen in de CAO-PBO.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel71
  - number: 7:2.1
    text: |-
      Ten aanzien van de voorzitter, die één of meer ambtsperioden, als bedoeld in
      [artikel 78, tweede lid, van de wet][ref1] vervuld hebbende, niet wordt herbenoemd, is het bepaalde in bijlage XVI
      van de CAO-PBO van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel78
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '78'
  - number: 7:2.2
    text: |-
      Ten aanzien van de voorzitter die wordt ontslagen ingevolge het bepaalde in
      [artikel 78, eerste lid, van de wet][ref1], is, tenzij naar het oordeel van het dagelijks bestuur van het
      productschap ernstige redenen zich daartegen verzetten, het bepaalde in bijlage XVI van de CAO-PBO van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel78
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '78'
  - number: 7:2.3
    text: |-
      De uitkering als bedoeld in het eerste lid, onderscheidenlijk het tweede lid, zal worden berekend op basis van de
      som van de in [artikel 7:1, eerste lid][ref1] bedoelde bedragen, en overeenkomstig het bepaalde in bijlage XVI van
      de CAO-PBO.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel7
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '7'
        hoofdstuk: '7'
  - number: 8:1
    text: |-
      In dit hoofdstuk wordt verstaan onder:







                  a.


                  commissies:


                  commissies als bedoeld in [artikel 88][ref1] en [88a van de wet][ref2];




                  b.


                  overige commissies:


                  andere door het bestuur van het productschap ingestelde permanente commissies;




                  c.


                  werkverbanden:


                  door het productschap ingestelde tijdelijke commissies, stuurgroepen, werkgroepen,
      begeleidingscommissies, dan wel anderszins genoemd;




                  d.


                  dagdeel:


                  het deel van een dag waarvan het eerste aanvangt op het tijdstip van aanvang van de eerste bijgewoonde
      vergadering en het tweede en derde aanvangen nadat sedert dat tijdstip vijf respectievelijk tien uren zijn
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: 8:2.1
    text: |-
      De leden van het (dagelijks) bestuur en van de commissies als bedoeld in [artikel 88][ref1] en
      [88a, van de wet][ref2], genieten voor elke door hen bijgewoonde vergadering, in relatie tot een dagdeel, een
      vergoeding bestaande uit:







                    a.


                    een vacatiegeld:


                    € 250,00




                    b.


                    een onkostenvergoeding:


                    € 16,00




                    c.


                    een kilometervergoeding:


                    € 0,28 per kilometer


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: 8:2.2
    text: |-
      Als afstand geldt de afstand heen en terug tussen de woonplaats en de plaats waarin de vergadering wordt gehouden;
      de afstand wordt vastgesteld door het secretariaat van het productschap op basis van de meest gebruikelijke
      reisroute over de weg.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel82
  - number: 8:2.3
    text: Het eerste en tweede lid is van overeenkomstige toepassing op de Sociaal Economische Commissie.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel82
  - number: 8:2.4
    text: Het eerste tot en met het derde lid is van overeenkomstige toepassing op plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel82
  - number: 8:3
    text: |-
      De leden van andere commissies genieten voor elke door hen bijgewoonde vergadering, in relatie tot een dagdeel, een
      vergoeding bestaande uit:
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel83
  - number: 8:3.2
    text: |-
      Als afstand geldt de afstand heen en terug tussen de woonplaats en de plaats waarin de vergadering wordt gehouden;
      de afstand wordt vastgesteld door het secretariaat van het productschap op basis van de meest gebruikelijke
      reisroute over de weg.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel83
  - number: 8:3.3
    text: Het eerste en tweede lid is van overeenkomstige toepassing op plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel83
  - number: 8:4.1
    text: |-
      De leden van door het productschap ingestelde werkverbanden die diensten verrichten in het algemeen belang, dan wel
      werkzaamheden te velde verrichtten, genieten voor de geleverde dienst/werkzaamheid een vergoeding bestaande uit:







                    a.


                    een vacatiegeld:


                    € 136,00




                    b.


                    een kilometervergoeding:


                    € 0,28 per kilometer
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel84
  - number: 8:4.2
    text: |-
      Als afstand geldt de afstand heen en terug tussen de woonplaats en de plaats waarin de vergadering wordt gehouden;
      de afstand wordt vastgesteld door het secretariaat van het productschap op basis van de meest gebruikelijke
      reisroute over de weg.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel84
  - number: 8:4.3
    text: Het eerste en tweede lid is van overeenkomstige toepassing op plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel84
  - number: 8:4.1
    text: |-
      De leden van door het productschap ingestelde werkverbanden die diensten verrichten in het algemeen belang, dan wel
      werkzaamheden te velde verrichtten, genieten voor de geleverde dienst/werkzaamheid een vergoeding bestaande uit:







                    a.


                    een vacatiegeld:


                    € 136,00




                    b.


                    een kilometervergoeding:


                    € 0,28 per kilometer
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel84
  - number: 8:4.2
    text: |-
      Als afstand geldt de afstand heen en terug tussen de woonplaats en de plaats waarin de vergadering wordt gehouden;
      de afstand wordt vastgesteld door het secretariaat van het productschap op basis van de meest gebruikelijke
      reisroute over de weg.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel84
  - number: 8:4.3
    text: Het eerste en tweede lid is van overeenkomstige toepassing op plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel84
  - number: 8:5.1
    text: |-
      Bij elke afzonderlijke vergadering wordt een presentielijst uitgedeeld, die strekt tot het uitsluitend bewijs dat
      een lid van een commissie als bedoeld in [artikel 8:2 tot en met 8:4][ref1], die vergadering daadwerkelijk heeft
      bijgewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel8
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:5.2
    text: |-
      Indien een lid van een van de onder [artikel 8:2 tot en met 8:4][ref1] bedoelde commissies en werkverbanden in
      één etmaal, in welke hoedanigheid ook, meer dan één vergadering heeft bijgewoond op dezelfde locatie, wordt per
      vergadering de vergoeding als bedoeld genoten, maar slechts éénmaal de reiskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel8
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:6
    text: Vacatiegelden en kilometervergoedingen zijn inclusief de eventueel verschuldigde omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel86
  - number: 8:7
    text: |-
      De voorzitter kan ingeval [artikel 8:3 tot en met 8:4][ref1] afwijken van de aldaar genoemde vergoedingen voor de
      aldaar bedoelden.


      [ref1]: https://wetten.overheid.nl/BWBR0022738#Artikel8
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0022738
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:9
    text: Het bedrag wordt op kwartaalbasis betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel89
  - number: 9:1
    text: |-
      De bepalingen uit [hoofdstuk 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige
      toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 10:1.1
    text: |-
      De gegevens verkregen uit hoofde van het bepaalde in deze verordening dienen in handen van de voorzitter of door
      deze aan te wijzen functionarissen van het secretariaat van het productschap te worden gesteld, tenzij in deze
      verordening anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel101
  - number: 10:1.2
    text: Deze gegevens mogen slechts worden gebezigd voor de vervulling van de taak van het productschap.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel101
  - number: 11:1
    text: |-
      Het indienen en de wijze van het afhandelen van een projectaanvraag en een verzoek voor het verkrijgen van een
      exploitatiesubsidie wordt vastgelegd in een nader op te stellen regeling.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel111
  - number: '11.2'
    text: |-
      Jaarlijks stelt het bestuur, nadat inzicht is verkregen in zowel de financiële positie van de te onderscheiden
      (deel)sectoren en de geformuleerde beleidsdoelstellingen, een daarmee samenhangend subsidieplafond vast.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel11.2
  - number: 11:3
    text: |-
      Het indienen en de wijze van het afhandelen van financiële vergoedingen wordt vastgelegd in een nader op te stellen
      regeling.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel113
  - number: 12:1
    text: |-
      Het productschap zal toezicht gaan uitoefenen op degene die een projectbijdrage dan wel exploitatiesubsidie wordt
      verstrekt. Een en ander zal worden vastgelegd in een nader op te stellen regeling.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel121
  - number: 13:1
    text: |-
      De [Verordening PT algemene bepalingen 2006][ref1] wordt ingetrokken


      [ref1]: https://wetten.overheid.nl/BWBR0020002
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0020002
  - number: 13:2
    text: Deze verordening treedt in werking de tweede dag na plaatsing in het Verordeningblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel132
  - number: 13:3
    text: 'Deze verordening wordt aangehaald als: Verordening PT algemene bepalingen 2007.'
    url: https://wetten.overheid.nl/BWBR0022738/2008-12-31#Artikel133
