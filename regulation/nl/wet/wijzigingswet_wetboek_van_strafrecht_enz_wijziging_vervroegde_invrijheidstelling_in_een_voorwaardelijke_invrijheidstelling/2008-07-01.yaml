preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bepalingen in het Wetboek van Strafrecht betreffende
    de vervroegde invrijheidstelling te vervangen door bepalingen omtrent een voorwaardelijke invrijheidstelling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023021/2008-07-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      1 Deze wet heeft geen gevolgen voor veroordelingen tot vrijheidsstraf die voor de inwerkingtreding van deze wet
      zijn uitgesproken. De [artikelen 15 tot en met 15d van het Wetboek van Strafrecht][ref1], zoals deze luidden voor
      de inwerkingtreding van deze wet, blijven in deze van toepassing.

      2 Het eerste lid is niet van toepassing op veroordelingen tot vrijheidsstraf, uitgesproken voor de inwerkingtreding
      van deze wet, indien de tenuitvoerlegging vijf jaar na inwerkingtreding van deze wet nog gaande is.

      3 Indien een veroordeelde zowel een vrijheidsstraf heeft te ondergaan die is uitgesproken voor de
      inwerkingtreding van deze wet, als een vrijheidsstraf die is uitgesproken na de inwerkingtreding van deze wet, is
      [artikel 15, vijfde lid, tweede volzin][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel15
