bwb_id: BWBR0007973
url: https://wetten.overheid.nl/BWBR0007973/1999-04-01
preamble:
  text: |-
    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat door de wijziging van de Wet op de telecommunicatievoorzieningen bij
    wet van (Stb. ...) de exploitatie- en gebruiksmogelijkheden van kabelgebonden telecommunicatie-inrichtingen als
    bedoeld in de artikelen 21 en 23 van de Wet op de telecommunicatievoorzieningen alsmede de aanlegmogelijkheid van
    de kabelgebonden inrichtingen als bedoeld in artikel 23 van deze wet zijn verruimd;

    dat het mede ter bevordering van een situatie met meerdere aanbieders van een landelijke kabelgebonden
    telecommunicatie-infrastructuur wenselijk is een wettelijke regeling te treffen voor het verlenen van vergunningen
    voor de exploitatie van kabelgebonden telecommunicatie-inrichtingen als bedoeld in de artikelen 21 en 23 van de
    Wet op de telecommunicatievoorzieningen als openbaar telecommunicatienet door het aan derden aanbieden van vaste
    verbindingen en voor de aanleg en instandhouding van nieuwe kabelgebonden infrastructuur;

    dat het in verband met de huidige indeling van de Wet op de telecommunicatievoorzieningen wenselijk is om, in
    afwachting van de algehele herziening van die wet, de grondslag voor de verlening van deze vergunningen niet in de
    Wet op de telecommunicatievoorzieningen maar in een afzonderlijke wet neer te leggen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007973/1999-04-01#ArtikelAanhef
articles:
  - number: '11'
    text: |-
      De houder van de infrastructuurvergunning is gerechtigd en verplicht tot het bij of krachtens de Wet op de
      telecommunicatievoorzieningen terzake bepaalde.
    url: https://wetten.overheid.nl/BWBR0007973/1999-04-01#Artikel11
