    text: |-
      De aanvrager van de bevoegdheid voertuigen aan een keuring te onderwerpen overlegt de volgende bescheiden:

      a. een afschrift van de in de [artikelen 24][ref1] of [25][ref2] genoemde diploma’s;

      b. indien van toepassing een afschrift van het resultaat van de toets als bedoeld in [artikel 27][ref3].


