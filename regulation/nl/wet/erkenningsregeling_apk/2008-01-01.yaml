        hoofdstuk: '6'
  - number: '55'
    text: |-
      Indien bij de anonieme keuring blijkt dat een persoon die niet bevoegd is voertuigen aan een keuring te
      onderwerpen, deze keuring toch uitvoert, telt dit mee in het systeem, bedoeld in [artikel 53, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel53
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '53'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '56'
    text: |-
      De in [artikel 87 van de wet][ref1] bedoelde schorsing, intrekking of wijziging van de erkenning zal, indien de
      erkenningseis of het erkenningsvoorschrift waaraan niet wordt voldaan slechts betrekking heeft op het keuren van
      een bepaalde groep voertuigen, beperkt blijven tot het keuren van die desbetreffende groep voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
  - number: '57'
    text: |-
      1 Indien er sprake is van een situatie waarin aan een of meer erkenningseisen of erkenningsvoorschriften niet wordt
      voldaan, terwijl die situatie op korte termijn kan worden hersteld, kan, in plaats van intrekking of wijziging van
      de erkenning, overgegaan worden tot schorsing van de erkenning voor een termijn van ten hoogste twaalf weken.

      2 Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de erkenningseisen of
      erkenningsvoorschriften wordt voldaan, dan volgt alsnog intrekking of wijziging van de erkenning.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel57
  - number: '58'
    text: |-
      Indien door de erkenninghouder de in de [artikelen 43][ref1] en [44][ref2] neergelegde verplichtingen,
      de in [artikel 45, tweede, vierde en vijfde lid][ref3], opgenomen voorschriften, dan w°el het bepaalde in
      [artikel 48, eerste lid][ref4], laatste volzin, niet worden nageleefd, wordt terstond begonnen met een procedure
      voor intrekking van de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel44
