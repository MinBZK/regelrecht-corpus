    text: |-
      In deze regeling wordt verstaan onder:



            a

              *wet:*


              [Wegenverkeerswet 1994][ref1];



            b

              *minister:*


              Minister van Verkeer en Waterstaat;



            c

              *erkenning:*


              erkenning als bedoeld in [artikel 83 van de wet][ref2];



            d

              *erkenninghouder:*


              houder van een erkenning als bedoeld in [artikel 83 van de wet][ref3];



            e

              *justering:*


              handeling die bedoeld is om een instrument in een zodanige toestand te brengen dat het geschikt is voor
      gebruik;



            f

              *keuring:*


              periodieke keuring als bedoeld in [artikel 75 van de wet][ref4];



            g

              *keuringseisen:*


              op de desbetreffende voertuigcategorie toepasselijke permanente eisen zoals neergelegd in, en vastgesteld
      op grond van [hoofdstuk 5 van het Voertuigreglement][ref5] alsmede, voor zover van toepassing, de permanente eisen
      zoals neergelegd in de [Regeling permanente eisen taxi’s][ref6];



            h

              *keuringsplaats:*


              inrichting waarin een erkenninghouder, die is gerechtigd keuringsrapporten af te geven voor motorrijtuigen
      en aanhangwagens, de handelingen in het kader van de periodieke keuringen mag verrichten;



            i

              *mobiele keuringseenheid:*


              keuringseenheid waarmee een erkenninghouder, die is gerechtigd keuringsrapporten af te geven voor
      motorrijtuigen en aanhangwagens, niet steeds in dezelfde inrichting, doch afwisselend in verscheidene inrichtingen
      handelingen in het kader van de periodieke keuringen mag verrichten;



            j

              *onderzoeksgerechtigde:*


              onderneming of instelling die op grond van
      [hoofdstuk 2, paragraaf 2, van de Voorschriften meetmiddelen 1997][ref7] door een keuringsinstelling is erkend
      tot het afgeven van certificaten van herkeuring ten aanzien van nader bepaalde categorieën van in gebruik zijnde
      meetmiddelen;



            k

              *steekproef:*


              steekproefsgewijze herkeuring als bedoeld in [artikel 86 van de wet][ref8];



            l

              *keuringsinstelling:*


              ingevolge [artikel 84, eerste lid, van de wet][ref9] door de minister aangewezen instelling;



            m

              *boekwerk ‘APK milieukeuringseisen’:*


              editie van het door de minister vastgestelde boekwerk ‘APK milieukeuringseisen’, die geldig is op het
      moment van de keuring;



            n

              *boekwerk ‘Regelgeving APK’:*


              editie van het boekwerk ‘Regelgeving Algemene Periodieke Keuring’ of cd-rom ‘Regelgeving Algemene
      Periodieke Keuring’, die door de Dienst Wegverkeer is vastgesteld en geldig is op het moment van de keuring;



            o

              *keuringsruimte:*


              één of meer besloten ruimten gelegen in één gebouw, dan wel in verscheidene belendende of nagenoeg
      belendende gebouwen, bedoeld om deel uit te maken van een keuringsplaats;



            p

              *inrichting:*


              perceel of enkele kadastraal aangrenzende percelen waarop één of meer gebouwen zijn geplaatst;



            q

              *roetmeting:*


              meting als bedoeld in [artikel 5.2.11, elfde lid][ref10], en
      [artikel 5.3.11, tiende lid, van het Voertuigreglement][ref11];



            r

              *viergasmeting:*


              meting als bedoeld in [artikel 5.2.11, negende lid][ref12], en
      [artikel 5.3.11, achtste lid, van het Voertuigreglement][ref13];



            s

              *keurmeester:*


              degene aan wie de bevoegdheid is verleend voertuigen aan een keuring te onderwerpen als bedoeld in
      [artikel 85a van de wet][ref14];



            t

              *bevoegdheidspas:*


              pas als bedoeld in [artikel 85a van de wet][ref15];



            u

              *anonieme keuring:*


              keuring als bedoeld in [artikel 86a van de wet][ref16];



            v

              *afkeurpunt:*


              in het kader van een keuring geconstateerd gebrek;



            w

              *adviespunt:*


              in het kader van een keuring geconstateerd binnenkort te verwachten gebrek;



            x

              *reparatiepunt:*


              in het kader van een keuring gerepareerd gebrek.


