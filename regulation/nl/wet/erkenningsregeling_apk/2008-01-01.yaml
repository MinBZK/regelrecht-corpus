  - number: '23'
    text: |-
      Indien de erkenning wordt verleend voor het eigen wagenpark en een andere rechtspersoon of andere rechtspersonen
      in een zodanig verband tot de erkenninghouder staat of staan dat er sprake is van één economische eenheid, doet de
      exploitant onder opgave van de naam en het adres van die rechtspersoon of rechtspersonen, terstond na de verlening
      van de erkenning schriftelijk opgave hiervan aan de Dienst Wegverkeer. Het verband moet ten genoege van de Dienst
      Wegverkeer worden aangetoond door middel van een uittreksel uit het register van de Kamer van Koophandel of een
      accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel23
  - number: '24'
    text: |-
      1 De bevoegdheid zware (bedrijfs)voertuigen aan een keuring te onderwerpen kan worden verleend aan een natuurlijke
      persoon die in het bezit is van een, mede door een door de Dienst Wegverkeer aangewezen gecommitteerde ondertekend,
      diploma keurmeester periodieke keuring zware (bedrijfs)voertuigen dat is afgegeven door de Stichting VAM, nadat het
      examen met goed gevolg bij deze instelling is afgelegd.

      2 De Dienst Wegverkeer bepaalt aan welke voorwaarden wordt voldaan alvorens deelgenomen kan worden aan het
      examen keurmeester periodieke keuring zware (bedrijfs)voertuigen. Deze voorwaarden worden in de Staatscourant
      bekendgemaakt.

      3 Het examen wordt afgenomen overeenkomstig een door de Stichting VAM vastgesteld en door de Dienst Wegverkeer
      goedgekeurd reglement.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel24
  - number: '25'
    text: |-
      1 De bevoegdheid lichte voertuigen aan een keuring te onderwerpen kan worden verleend aan een natuurlijk persoon
      die in het bezit is van een, mede door een door de Dienst Wegverkeer aangewezen gecommitteerde ondertekend, diploma
      keurmeester periodieke keuring lichte voertuigen dat is afgegeven door de Stichting VAM, nadat het examen met goed
      gevolg bij deze instelling is afgelegd.

      2 De Dienst Wegverkeer bepaalt aan welke voorwaarden wordt voldaan alvorens deel genomen kan worden aan het examen
      keurmeester periodieke keuring lichte voertuigen. Deze voorwaarden worden in de Staatscourant bekendgemaakt.

      3 Het examen wordt afgenomen overeenkomstig een door de Stichting VAM vastgesteld en door de Dienst Wegverkeer
      goedgekeurd reglement.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel25
  - number: '26'
    text: |-
      1 Ten bewijze van de bevoegdheid voertuigen aan een keuring te onderwerpen wordt aan de keurmeester een
      bevoegdheidspas overeenkomstig een door de Dienst Wegverkeer vastgesteld model verstrekt. Op de bevoegdheidspas
      worden ten minste het pasnummer, het diplomanummer en de groep van voertuigen genoemd waarvoor de bevoegdheid
      voertuigen aan een keuring te onderwerpen geldt alsmede de geldigheidsduur van de pas.

      2 Ten behoeve van het afmelden van een voertuig als bedoeld in [artikel 45][ref1] door middel van datacommunicatie,
      wordt aan de keurmeester een pincode verstrekt. Deze pincode is strikt persoonlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel45
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel26
