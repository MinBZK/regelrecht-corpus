  - number: '16'
    text: |-
      1 Ten aanzien van roetmeters, toerentellers, olietemperatuurmeters, manometers, pedaalkrachtmeters,
      remvertragingsmeters, rollenremtestbanken, platenremtestbanken, koolmonoxidemeters en uitlaatgastesters met lambda-
      bepaling beschikt de aanvrager van een erkenning over een geldig certificaat van eerste keuring dan wel een geldig
      certificaat van herkeuring, als bedoeld in [hoofdstuk 1, paragraaf 2, van de Voorschriften meetmiddelen 1997][ref1].
      Deze eis geldt niet voor toerentellers in gebruik genomen vóór 1 januari 1997 die niet worden gebruikt voor de
      roetmeting of uitlaatgasmeting, voor pedaalkrachtmeters in gebruik genomen vóór 1 januari 1982 en voor manometers
      in gebruik genomen vóór 1 januari 1984.

      2 Het certificaat van eerste keuring is afgegeven door een keuringsinstelling. Het certificaat van herkeuring is
      afgegeven door een keuringsinstelling dan wel een onderzoeksgerechtigde.

      3 Ten aanzien van de in het eerste lid genoemde meetmiddelen beschikt de aanvrager
      van een erkenning over een handleiding in de Nederlandse taal als bedoeld in
      [hoofdstuk 1, paragraaf 3, van de Voorschriften meetmiddelen 1997][ref2]. Deze eis geldt niet voor toerentellers
      in gebruik genomen vóór 1 januari 1997, die niet worden gebruikt voor de roetmeting of uitlaatgasmeting, voor
      pedaalkrachtmeters in gebruik genomen vóór 1 juli 1998, en voor manometers in gebruik genomen vóór 1 juli 1998.

      4 Een koplamptestapparaat voldoet aan de in [hoofdstuk 3, paragraaf 10, van de Voorschriften meetmiddelen 1997][ref3]
      gestelde eisen.

      5 De in [artikel 12, vierde lid, onder a][ref4], bedoelde afzuiginstallatie ten behoeve van de roetmeting is
      voorzien van een goedkeuring, afgegeven door een keuringsinstelling.


