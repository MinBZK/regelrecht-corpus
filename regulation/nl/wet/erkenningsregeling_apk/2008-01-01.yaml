  - number: '39'
    text: |-
      1 De keurmeester neemt in verband met de periodieke keuring van motorrijtuigen en aanhangwagens het bij en
      krachtens de wet bepaalde in acht.

      2 Onverminderd het bepaalde in het eerste lid vindt de periodieke keuring van een motorrijtuig waarvan op
      het kentekenbewijs onder ‘bijzonderheden’ ‘taxi, zie bijlage’ wordt vermeld, tevens plaats aan de hand van de
      [Regeling permanente eisen taxi’s][ref1].

      3 De keurmeester controleert of hij de beschikking heeft over het boekwerk `Regelgeving APK' en, voorzover de
      aanwezigheid hiervan vereist is, het boekwerk `APK milieukeuringseisen' voordat hij een keuring gaat verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009110
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009110
  - number: '40'
    text: |-
      1 Op verzoek van de aanvrager van een keuringsrapport wordt de bevoegdheidspas ter inzage gegeven.

      2 De keurmeester draagt er zorg voor dat de aan hem, ten behoeve van datacommunicatie, verstrekte pincode niet
      toegankelijk is voor anderen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel40
  - number: '41'
    text: |-
      1 Indien bij de erkenninghouder een keuringsrapport wordt aangevraagd, stelt deze, na overleg met de aanvrager,
      onverwijld het tijdstip voor de keuring vast. De keuring vindt zo spoedig mogelijk na de aanvraag plaats.

      2 Er wordt geen keuring verricht dan nadat door de aanvrager het deel I A dan wel deel I van het kentekenbewijs
      is overgelegd.

      3 Voorafgaande aan de keuring:

      a. wordt gecontroleerd of de gegevens van het voertuig met betrekking tot het chassisnummer, de duplicaatcode en de
      brandstof, vermeld in het kentekenregister, overeenstemmen met het kentekenbewijs,

      b. wordt aan de hand van de in [bijlage 2][ref1] opgenomen controlepunten gecontroleerd of het voertuig en het
      kentekenbewijs met elkaar overeenstemmen,

      c. wordt aan de hand van de in [bijlage 3][ref2] opgenomen controlepunten gecontroleerd of het voertuig is voorzien
      van de juiste kentekenplaten.

      4 Er wordt geen keuring verricht en de aanvrager van een keuringsrapport wordt naar de Dienst Wegverkeer
      doorverwezen indien:

      a. op grond van de in het derde lid onder a of b, bedoelde controle één of meer afwijkingen worden geconstateerd;

      b. de beperkte geldigheidsduur van het kentekenbewijs verstreken is, waardoor het kentekenbewijs ingevolge
      [artikel 56, eerste lid, onder a, van de wet][ref3], zijn geldigheid heeft verloren;

      c. in het kentekenbewijs wijzigingen zijn aangebracht; of

      d. geen afgiftedatum op het kentekenbewijs is vermeld.

      5 Indien in afwijking van het register op het kentekenbewijs niet G, maar G3 staat vermeld, wordt dit niet
      aangemerkt als een afwijking als bedoeld in het vierde lid, onder a.

      6 Indien het raadplegen van de voertuiggegevens als gevolg van een storing in een door de Dienst Wegverkeer
      geaccepteerd netwerk als bedoeld in [artikel 3, zesde lid][ref4], respectievelijk [12, zevende lid][ref5], niet
      mogelijk is, kan de in het derde lid, onder a, bedoelde controle achterwege blijven en wordt dit aangetekend op
      het keuringsrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0011158
      [ref2]: https://wetten.overheid.nl/BWBR0011158
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0011158#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011158#Artikel12
