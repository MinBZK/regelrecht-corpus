        paragraaf: '2'
  - number: '32'
    text: |-
      1 De erkenninghouder neemt in verband met de periodieke keuring van motorrijtuigen en aanhangwagens het bij en
      krachtens de wet bepaalde in acht.

      2 Onverminderd het bepaalde in het eerste lid vindt de periodieke keuring van een motorrijtuig waarvan op
      het kentekenbewijs onder ‘bijzonderheden’ ‘taxi, zie bijlage’ wordt vermeld, tevens plaats aan de hand van de
      [Regeling permanente eisen taxi’s][ref1].

      3 Keuringen worden slechts verricht in een keuringsplaats waarvoor de erkenning geldt.

      4 In de keuringsplaats worden slechts keuringen verricht van voertuigen waarvoor de erkenning voor de betrokken
      keuringsplaats geldt.

      5 Met de mobiele keuringseenheid worden in een keuringsplaats of inrichting slechts keuringen verricht van
      voertuigen waarvoor de erkenning voor de betrokken keuringseenheid geldt.

      6 Het boekwerk `Regelgeving APK' en, voorzover de aanwezigheid hiervan vereist is, het boekwerk `APK
      milieukeuringseisen' wordt door de erkenninghouder beschikbaar gesteld aan de keurmeester; de erkenninghouder
      draagt er tevens zorg voor dat de voorgeschreven boekwerken tot en met de laatste wijziging zijn bijgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009110
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009110
  - number: '33'
    text: |-
      1 Vanaf de buitenkant van elke keuringsplaats waarvoor de erkenning geldt is op een door de Dienst Wegverkeer
      vastgestelde en in de Staatscourant bekendgemaakte wijze zichtbaar dat de erkenning is verleend. Deze eis geldt
      niet voor keuringsplaatsen waarvan in het erkenningsbesluit is vastgelegd dat de erkenning alleen geldt voor
      voertuigen die behoren tot het eigen wagenpark.

      2 In elke keuringsplaats waarvoor de erkenning geldt, is het door de Dienst Wegverkeer afgegeven bewijs aanwezig
      waaruit blijkt dat voor de keuringsplaats een erkenning is verleend en voor welke groep voertuigen de erkenning
      voor de keuringsplaats geldt.

      3 Bij elke mobiele keuringseenheid waarvoor de erkenning geldt, is het door de Dienst Wegverkeer afgegeven bewijs
      aanwezig waaruit blijkt dat voor de eenheid een erkenning is verleend, voor welke groep voertuigen de erkenning
      voor de eenheid geldt en in welke inrichtingen de keuringen mogen plaatsvinden.

      4 Op verzoek van de aanvrager van een keuringsrapport wordt het in het tweede en derde lid bedoelde bewijs ter
      inzage gegeven.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel33
  - number: '34'
    text: |-
      1 De keuringsplaatsen blijven voortdurend voldoen aan de eisen, gesteld in de [artikelen 3 tot en met 8][ref1].

      2 De mobiele keuringseenheden, alsmede de inrichtingen of keuringsplaatsen waarin met een mobiele
      keuringseenheid keuringen mogen worden verricht blijven voortdurend voldoen aan de eisen, gesteld in de
      [artikelen 12 tot en met 17][ref2].

      3 In afwijking van het eerste en tweede lid, geldt tot 1 januari 2010 in afwijking van de in
      [artikel 4, tweede lid][ref3], en [artikel 13, tweede lid][ref4], genoemde maten:

      a. voor erkenningen verleend voor 1 januari 1995 dat de inspectieput een diepte en de hefinrichting een hoogte
      heeft van ten minste 1,20 m, indien de erkenning is verleend voor zowel voertuigen waarvan de toegestane maximum
      massa meer bedraagt dan 3500 kg als waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg;

      b. voor erkenningen verleend na 31 december 1994, doch voor 1 januari 2006:

      1°. dat de inspectieput een diepte en de hefinrichting een hefhoogte heeft van ten minste 1,20 m, indien de
      erkenning is verleend voor voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3500 kg;

      2°. dat de inspectieput een diepte en de hefinrichting een hefhoogte heeft van ten minste 1,40 m, indien de
      erkenning is verleend voor voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3500 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0011158#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011158#Artikel13
