  - number: '9'
    text: |-
      Indien de erkenning voor de betrokken keuringsplaats wordt aangevraagd voor voertuigen, waarvan de toegestane
      maximum massa meer bedraagt dan 3500 kg, is in deze keuringsplaats ten minste één keurmeester werkzaam die bevoegd
      is zware (bedrijfs)voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel9
  - number: '10'
    text: |-
      Indien de erkenning voor de betrokken keuringsplaats wordt aangevraagd voor voertuigen, waarvan de toegestane
      maximum massa niet meer bedraagt dan 3500 kg, is in deze keuringsplaats ten minste één keurmeester werkzaam die
      bevoegd is lichte voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel10
  - number: '11'
    text: |-
      1 Een erkenning kan voorts worden verleend aan een natuurlijke persoon of rechtspersoon voor één
      of meer in Nederland geregistreerde mobiele keuringseenheden, indien deze elk voldoen aan de in de
      [artikelen 12 tot en met 19][ref1] gestelde eisen.

      2 Als de aanvrager van een erkenning exploitant is van een keurings- of onderhoudsdienst voor het eigen wagenpark,
      kan de erkenning op verzoek van de aanvrager worden beperkt tot dat eigen wagenpark.

      3 Indien de erkenning wordt verleend voor het eigen wagenpark en een andere rechtspersoon of andere rechtspersonen
      in een zodanig verband tot de erkenninghouder staan dat er sprake is van één economische eenheid, kunnen alle
      voertuigen van de desbetreffende economische eenheid worden beschouwd als voertuigen van het eigen wagenpark.

      4 Gezamenlijk gebruik van een mobiele keuringseenheid door meerdere erkenninghouders is niet toegestaan.

      5 Het keuringsinstantienummer van de mobiele keuringseenheid wordt gekoppeld aan het voor het voertuig, van waaruit
      de werkzaamheden als mobiele keuringseenheid worden verricht, opgegeven kenteken.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel12
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Met de mobiele keuringseenheden mogen keuringen worden verricht in erkende keuringsplaatsen waarvan de erkenning
      niet definitief is ingetrokken of in afzonderlijke inrichtingen, indien die aan de desbetreffende eisen voldoen en
      mits deze op het erkenningsbesluit van de betrokken mobiele keuringseenheid zijn vermeld.

      2 De keuringsruimte is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van verwarming.

      3 De keuringsruimte heeft zodanige afmetingen en is zodanig ingericht dat de voertuigen die behoren tot de groep
      waarvoor de erkenning voor de betrokken keuringseenheid wordt aangevraagd, in deze ruimte zodanig kunnen worden
      opgesteld dat zij van alle zijden goed toegankelijk zijn.

      4 In de keuringsruimte:

      a. bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met een elektrische ontsteking, is een
      voorziening aanwezig waarmee uitlaatgassen direct door een daartoe bestemde opening naar buiten kunnen worden
      gevoerd;

      b. bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met compressie-ontsteking, is een
      voorziening aanwezig die bestaat uit:

      1º. een afzuigventilator met voldoende capaciteit voor de te keuren voertuigen,

      2º. een afvoersysteem dat voorkomt dat uitlaatgassen in de werkplaats terecht kunnen komen,

      3º. een systeem dat ervoor zorgt dat de uitlaatgassen die door de roetmeter gaan eveneens worden afgevoerd, en

      4º. afvoerkanalen die bovenstaande onderdelen met elkaar verbinden waardoor de uitlaatgassen direct naar buiten
      worden afgevoerd.

      5 In de keuringsruimte kan de administratie van de keuringen behoorlijk worden uitgevoerd. Is deze mogelijkheid
      in de keuringsruimte niet aanwezig dan kan de administratie van de keuringen in de mobiele keuringseenheid
      worden uitgevoerd. Tevens is er in de mobiele keuringseenheid een afsluitbare kast of bureaulade dan wel een
      gelijkwaardige voorziening aanwezig, waarin de in [artikel 48][ref1] bedoelde bescheiden en documentatie kunnen
      worden opgeborgen.

      6 De keuringsruimte waar de mobiele keuringseenheid keuringen verricht, is aangesloten op een openbaar telefoonnet.

      7 In de mobiele keuringseenheid is een voorziening aanwezig, geschikt voor het gebruik van datacommunicatie,
      wanneer deze in de in het eerste lid genoemde keuringsplaats of inrichting niet beschikbaar is. Deze voorziening
      bestaat uit een computer of terminal met een modem, geschikt voor de toegangsstructuur van door de Dienst
      Wegverkeer geaccepteerde netwerken.

      8 In de mobiele keuringseenheid is de in het vierde lid, onder a en b, bedoelde voorziening voor het afvoeren van
      uitlaatgassen aanwezig, wanneer deze in de in het eerste lid bedoelde keuringsplaats of inrichting niet beschikbaar
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel48
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '48'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '13'
    text: |-
      1 In de keuringsruimte is een doelmatige inspectieput of hefinrichting aanwezig die geschikt is voor de groep
      voertuigen waarvoor de erkenning voor de betrokken mobiele keuringseenheid wordt aangevraagd en die is voorzien
      van een doelmatige verlichting. Wanneer niet duidelijk blijkt wat het draagvermogen van een hefinrichting is,
      wordt hiervoor door de fabrikant of een onafhankelijk instituut een verklaring overgelegd. Het draagvermogen wordt
      zichtbaar op de hefinrichting aangebracht.

      2 De in het eerste lid bedoelde inspectieput of hefinrichting is zodanig uitgevoerd dat de keurmeester in staat
      is de onderkant van een voertuig nagenoeg over de hele lengte rechtopstaand te inspecteren, hetgeen betekent dat
      wanneer de erkenning wordt aangevraagd voor:

      a. voertuigen waarvan de toegestane maximum massa meer bedraagt dan 3500 kg, de hefinrichting een hefhoogte heeft
      van ten minste 1,35 m;

      b. voertuigen waarvan de toegestane maximum massa meer bedraagt dan 3500 kg, de inspectieput een diepte heeft van
      ten minste 1,35 m;

      c. voertuigen waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg, de hefinrichting een hefhoogte
      heeft van ten minste 1,65 m;

      d. voertuigen waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg, de inspectieput een diepte heeft
      van ten minste 1,55 m.

      3 De in het eerste lid bedoelde hefinrichting ondersteunt ten minste vier wielen van het voertuig. Een met
      steunpoten gecombineerde hefinrichting voldoet niet aan deze eis.

      4 In geval van een aanvraag voor een erkenning voor de keuring van motorrijtuigen is ten behoeve van de controle
      van de afstelling van de koplampen met behulp van een koplamptestapparaat een voorziening aanwezig die bestaat uit:

      a. een vlakke vloer van voldoende afmetingen of een hefinrichting als bedoeld in de voorgaande leden, waarop
      gelijktijdig zowel het te keuren voertuig als het koplamptestapparaat kan worden geplaatst, of

      b. een vlakke vloer of rails, gelegen voor de hefinrichting als bedoeld in de voorgaande leden, waarop het
      koplamptestapparaat kan worden geplaatst, waarbij deze vloer of rails in een vlak moet zijn gelegen gelijk of
      evenwijdig aan de rijplaten van de hefinrichting.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel13
  - number: '14'
    text: |-
      De mobiele keuringseenheid beschikt over de volgende apparatuur:

      a. een doelmatige krik die voldoende draagvermogen heeft om van de voertuigen van de groep waarvoor de erkenning
      voor de betrokken keuringseenheid wordt aangevraagd, de wielen van de voorste as gelijktijdig en de wielen van de
      achterste as afzonderlijk op zodanige wijze te kunnen heffen dat deze vrij kunnen draaien;

      b. een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn al dan niet voorzien van een oplaadbare accu,
      die enerzijds een zodanige lichtsterkte heeft dat ook moeilijk bereikbare onderdelen van een voertuig voldoende
      helder kunnen worden verlicht om een nauwkeurige inspectie van een voertuig mogelijk te maken, en die anderzijds
      zodanig is afgeschermd dat degene die de keuring uitvoert niet door het uitgestraalde licht wordt verblind;

      c. een meetband met een minimale nauwkeurigheidsklasse III van ten minste 12,00 m, indien de erkenning wordt
      aangevraagd voor voertuigen waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg. Indien het een
      erkenning betreft voor voertuigen waarvan de toegestane maximum massa meer bedraagt dan 3500 kg is de meetband
      ten minste 20,00 m. Bij erkenningen met een beperking voor de voertuiglengte heeft de meetband tenminste dezelfde
      lengte als de toegestane voertuiglengte;

      d. een doelmatige schuifmaat die is voorzien van een meetstift voor dieptemeting;

      e. basisgereedschap voor de controle op het vastzitten van nagels en bouten en andere verbindingen, te weten
      een set steek- en ringsleutels, schroevendraaiers en een hamer, alsmede een bolkophamertje voor de controle op
      corrosie;

      f. een doelmatige bandenspanningsmeter en een doelmatige bandenpomp;

      g. hulpmiddelen om speling in voertuigonderdelen zichtbaar te maken, zoals een bandijzer, wielbewegingsapparaat of
      een koevoet;

      h. een rollenremtestbank, platenremtestbank of remvertragingsmeter die voldoet aan de in [artikel 16][ref1]
      gestelde eisen. Indien een erkenning wordt aangevraagd voor voertuigen met een toegestane maximum massa van
      meer dan 3500 kg is in elk geval een rollenremtestbank aanwezig. Het draagvermogen van een rollenremtestbank of
      platenremtestbank is voldoende voor de groep voertuigen waarvoor de erkenning voor de betrokken keuringseenheid
      wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel16
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15'
    text: |-
      Naast de in [artikel 14][ref1] genoemde apparatuur is, afhankelijk van de groep voertuigen waarvoor de erkenning
      wordt aangevraagd, tevens de volgende apparatuur aanwezig die voldoet aan de in [artikel 16][ref2] gestelde eisen:

      a. n geval van een aanvraag voor een erkenning voor motorrijtuigen:

      1° een koplamptestapparaat,

      2° een pedaalkrachtmeter; deze is niet verplicht in geval van een voor 1 maart 2000 afgegeven erkenning voor het
      eigen wagenpark en in geval van een voor 1 maart 2000 afgegeven erkenning die uitsluitend geldt voor het keuren van
      voertuigen die zijn voorzien van een druklucht-remsysteem;

      3° een universele toerenteller;

      4° een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden;

      b. in geval van een aanvraag voor een erkenning voor motorrijtuigen waarvan de toegestane maximum massa niet meer
      bedraagt dan 3500 kg: een doelmatige bandenprofieldieptemeter, met verende meetstift en een meetnauwkeurigheid van
      0,1 mm;

      c. in geval van een aanvraag voor een erkenning voor voertuigen waarvan de toegestane maximum massa meer bedraagt
      dan 3500 kg:

      1° twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      aanhangwagenremsystemen, waarmee de druk in drukluchtremsystemen en in gasveersystemen kan worden gemeten, en

      2° een stalen rei met een lengte van ten minste 0,90 m;

      d. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een verbrandingsmotor met compressie-
      ontsteking: een roetmeter en olietemperatuurmeter;

      e. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een verbrandingsmotor met elektrische
      ontsteking waarvan de toegestane maximum massa niet meer bedraagt dan 3500 kg: een uitlaatgastester met lambda-
      bepaling. Een eventuele koolmonoxidemeter met bijbehorende fles kalibratiegas wordt uitsluitend gebruikt voor
      motorrijtuigen met een verbrandingsmotor met elektrische ontsteking waarop de viergasmeting niet van toepassing is;

      f. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een verbrandingsmotor met elektrische
      ontsteking waarvan de toegestane maximum massa meer bedraagt dan 3500 kg: een uitlaatgastester met lambda-bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel16
