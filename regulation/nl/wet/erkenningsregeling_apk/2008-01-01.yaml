      1 De keuringsruimte is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van verwarming.

      2 De keuringsruimte heeft zodanige afmetingen en is zodanig ingericht dat de voertuigen die behoren tot de groep
      waarvoor de erkenning voor de betrokken keuringsplaats wordt aangevraagd, in deze ruimte zodanig kunnen worden
      opgesteld dat zij van alle zijden goed toegankelijk zijn.

      3 In de keuringsruimte:

      a. bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met een elektrische ontsteking, is een
      voorziening aanwezig waarmee uitlaatgassen direct door een daartoe bestemde opening naar buiten kunnen worden
      gevoerd;

      b. bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met compressie-ontsteking, is een
      voorziening aanwezig die bestaat uit:

      1º. een afzuigventilator met voldoende capaciteit voor de te keuren voertuigen,

      2º. een afvoersysteem dat voorkomt dat uitlaatgassen in de werkplaats terecht kunnen komen,

      3º. een systeem dat ervoor zorgt dat de uitlaatgassen die door de roetmeter gaan eveneens worden afgevoerd, en

      4º. afvoerkanalen die bovenstaande onderdelen met elkaar verbinden waardoor de uitlaatgassen direct naar buiten
      worden afgevoerd.

      4 In de keuringsruimte kan de administratie van de keuringen behoorlijk worden uitgevoerd. Tevens is er een
      afsluitbare kast of bureaulade dan wel een gelijkwaardige voorziening aanwezig, waarin de in [artikel 48][ref1]
      bedoelde bescheiden en documentatie kunnen worden opgeborgen.

      5 De keuringsruimte is aangesloten op een openbaar telefoonnet.

      6 In de keuringsruimte is een voorziening aanwezig, geschikt voor het gebruik van datacommunicatie. Deze
      voorziening bestaat uit een computer of terminal met een modem, geschikt voor de toegangsstructuur van door de
      Dienst Wegverkeer geaccepteerde netwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel48
