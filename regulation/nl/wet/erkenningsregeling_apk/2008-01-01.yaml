  - number: '65'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 16 februari 1999, nr. CDJZ/WBI/1999-224, houdende
      vaststelling regels erkenning voor het uitvoeren van de periodieke keuring van motorrijtuigen en aanhangwagens
      (Stcrt. 40), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel65
  - number: '66'
    text: |-
      Op het tijdstip van inwerkingtreding van deze regeling bestaande erkenningen, die zijn verleend met toepassing
      van de in [artikel 65][ref1] genoemde regeling, worden aangemerkt als te zijn verleend met toepassing van de
      onderhavige regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel65
