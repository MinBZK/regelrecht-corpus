  - number: '59'
    text: |-
      Afhankelijk van het resultaat van de toets, bedoeld in [artikel 27][ref1], wordt de bevoegdheid voertuigen aan een
      keuring te onderwerpen met twee jaar, met twee maanden of niet verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel27
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '27'
        hoofdstuk: '4'
  - number: '60'
    text: |-
      De in [artikel 87a van de wet][ref1] bedoelde intrekking van de bevoegdheid voertuigen aan een keuring te
      onderwerpen kan, indien de keuringsbevoegdheidseis, het keuringsbevoegdheidsvoorschrift of het keuringsvoorschrift
      waaraan niet wordt voldaan slechts betrekking heeft op het keuren van een bepaalde groep voertuigen, beperkt worden
      tot het keuren van die desbetreffende groep voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87a
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 87a
  - number: '61'
    text: |-
      1 Indien er sprake is van een situatie waarin aan een of meer keuringsbevoegdheidseisen,
      keuringsbevoegdheidsvoorschriften of keuringsvoorschriften niet wordt voldaan, terwijl die situatie op korte
      termijn kan worden hersteld, kan, in plaats van intrekking van de bevoegdheid voertuigen aan een keuring te
      onderwerpen, overgegaan worden tot schorsing van de bevoegdheid voertuigen aan een keuring te onderwerpen voor een
      termijn van ten hoogste twaalf weken.

      2 Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de keuringsbevoegdheidseisen,
      keuringsbevoegdheidsvoorschriften of keuringsvoorschriften wordt voldaan, dan volgt alsnog intrekking van de
      bevoegdheid voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel61
  - number: '62'
    text: |-
      Indien door de keurmeester de in de [artikelen 39 tot en met 46][ref1] neergelegde verplichtingen of voorschriften
      niet worden nageleefd, wordt terstond begonnen met een procedure voor intrekking van de bevoegdheid voertuigen aan
      een keuring te onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel39
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel62
