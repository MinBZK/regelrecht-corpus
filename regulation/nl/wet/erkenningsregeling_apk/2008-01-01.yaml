  - number: '31'
    text: |-
      Aan een bevoegdheid voertuigen aan een keuring te onderwerpen worden de in de [artikelen 39 tot en met 46][ref1]
      opgenomen voorschriften verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel39
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel31
