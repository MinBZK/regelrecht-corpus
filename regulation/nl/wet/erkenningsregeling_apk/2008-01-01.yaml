  - number: '18'
    text: |-
      Indien de erkenning voor de betrokken mobiele keuringseenheid wordt aangevraagd voor voertuigen waarvan de
      toegestane maximum massa meer bedraagt dan 3500 kg, is bij deze keuringseenheid ten minste één keurmeester werkzaam
      die bevoegd is zware (bedrijfs)voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel18
  - number: '19'
    text: |-
      Indien de erkenning voor de betrokken mobiele keuringseenheid wordt aangevraagd voor voertuigen waarvan de
      toegestane maximum massa niet meer bedraagt dan 3500 kg, is bij deze keuringseenheid ten minste één keurmeester
      werkzaam die bevoegd is lichte voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel19
  - number: '20'
    text: |-
      Voor de aanvraag van een erkenning wordt door de aanvrager een aanvraagformulier, volgens een door de Dienst
      Wegverkeer vastgesteld model, bij de Dienst Wegverkeer ingediend.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel20
  - number: '21'
    text: |-
      De aanvrager van een erkenning overlegt de volgende bescheiden:

      a. een uittreksel, afschrift, afdruk, fotokopie of schriftelijke mededeling van de inschrijving van de aanvrager
      in een register bij de Kamer van Koophandel waarop het adres van betrokken keuringsplaats is vermeld, die op het
      tijdstip van de indiening van de erkenningsaanvraag niet ouder dan één jaar is;

      b. indien de aanvraag namens de aanvrager door een ander wordt ingediend, een gewaarmerkt afschrift van een
      geschrift waaruit blijkt dat die ander tot de vertegenwoordiging bevoegd is;

      c. voor elke keuringsplaats waarvoor de erkenning wordt aangevraagd, en voor elke inrichting waarin een mobiele
      keuringseenheid werkzaam is waarvoor de erkenning wordt aangevraagd, een plattegrond van de keuringsruimte
      en de ruimte waarin de administratie ter zake van de keuringen wordt gevoerd. Op de plattegrond moet zijn
      aangegeven waar de rollenremtestbank of de platenremtestbank en de inspectieput of hefinrichting zich bevinden
      alsmede de plaats waar de controle op de afstelling van de koplampen met het koplamptestapparaat, bedoeld in
      [artikel 3, derde lid, onderdeel b][ref1], respectievelijk [artikel 12, vierde lid, onderdeel b][ref2], zal
      plaatsvinden;

      d. voor zover ingevolge [artikel 7][ref3] of [artikel 16][ref4] voor de aldaar vereiste meetmiddelen een
      certificaat wordt verlangd, een afschrift van dat certificaat;

      e. afschriften van de in [artikel 26][ref5] genoemde bevoegdheidspassen die zijn afgegeven aan de personen die op
      het aanvraagformulier als keurmeester staan vermeld.


