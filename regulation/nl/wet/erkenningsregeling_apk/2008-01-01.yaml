  - number: '6'
    text: |-
      Naast de in [artikel 5][ref1] genoemde apparatuur is, afhankelijk van de groep voertuigen waarvoor de erkenning
      voor de betrokken keuringsplaats wordt aangevraagd, tevens de volgende apparatuur aanwezig die voldoet aan de in
      [artikel 7][ref2] gestelde eisen:

      a. in geval van een aanvraag voor een erkenning voor motorrijtuigen:

      1° een koplamptestapparaat,

      2° een pedaalkrachtmeter; deze is niet verplicht in geval van een voor 1 maart 2000 afgegeven erkenning voor het
      eigen wagenpark en in geval van een voor 1 maart 2000 afgegeven erkenning die uitsluitend geldt voor het keuren van
      voertuigen die zijn voorzien van een druklucht-remsysteem,

      3° een universele toerenteller, en

      4° een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden

      b. in geval van een aanvraag voor een erkenning voor motorrijtuigen waarvan de toegestane maximum massa niet meer
      bedraagt dan 3500 kg: een doelmatige bandenprofieldieptemeter, met verende meetstift en een meetnauwkeurigheid van
      0,1 mm;

      c. in geval van een aanvraag voor een erkenning voor voertuigen waarvan de toegestane maximum massa meer bedraagt
      dan 3500 kg:

      1° twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      aanhangwagenremsystemen, waarmee de druk in drukluchtremsystemen en in gasveersystemen kan worden gemeten, en

      2° een stalen rei met een lengte van ten minste 0,90 m;

      d. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een verbrandingsmotor met compressie-
      ontsteking: een roetmeter en olietemperatuurmeter;

      e. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een toegestane maximum massa van niet
      meer dan 3500 kg, die zijn voorzien van een verbrandingsmotor met elektrische ontsteking: een uitlaatgastester
      met lambda-bepaling. Een eventuele koolmonoxidemeter met bijbehorende fles kalibratiegas wordt uitsluitend
      gebruikt voor motorrijtuigen met een verbrandingsmotor met elektrische ontsteking waarop de viergasmeting niet van
      toepassing is;

      f. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een toegestane maximum massa van meer dan
      3500 kg, die zijn voorzien van een verbrandingsmotor met elektrische ontsteking: een uitlaatgastester met lambda-
      bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel5
