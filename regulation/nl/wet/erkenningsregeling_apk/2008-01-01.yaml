    text: |-
      Indien aan de aanvrager van een erkenning al eerder een erkenning is verleend, doch deze op
      grond van [artikel 87 van de wet][ref1] is ingetrokken, kan, onverminderd het bepaalde in
      [artikel 84, derde lid, van de wet][ref2], door de Dienst Wegverkeer worden bepaald dat van onderdelen van de
      [artikelen 20][ref3] en [21][ref4] kan worden afgeweken.


