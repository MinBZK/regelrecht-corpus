        artikel: '39'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '63'
    text: |-
      1 De steekproef wordt uitgevoerd door een daartoe aangewezen functionaris van de Dienst Wegverkeer en vindt plaats
      in de keuringsplaats waar het keuringsrapport is afgegeven.

      2 ij de steekproef wordt andermaal onderzocht of het voertuig aan de keuringseisen voldoet.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel63
  - number: '64'
    text: |-
      1 Het resultaat van de steekproef telt mee in het systeem, bedoeld in [artikel 53][ref1]. Aan de hand van dit
      systeem wordt vastgesteld of de kwaliteit van de keuringen van dien aard is dat intrekking van de bevoegdheid
      voertuigen aan een keuring te onderwerpen mogelijk dan wel noodzakelijk is of dat verminderd toezicht, verscherpt
      toezicht dan wel intrekking van de erkenning mogelijk dan wel noodzakelijk is.

      2 De resultaten van de herkeuring, de keuringen als gevolg van het bepaalde in [artikel 46, tweede lid][ref2],
      en het deskundigenonderzoek bedoeld in de [artikelen 90][ref3] en [91 van de wet][ref4], worden meegenomen in het
      systeem, bedoeld in [artikel 53][ref5].

      3 Indien tijdens een steekproef dan wel deskundigenonderzoek blijkt dat voor een apert onveilig voertuig een
      keuringsbewijs is afgegeven, wordt, ongeacht het systeem, bedoeld in [artikel 53][ref6], terstond begonnen met
      een procedure voor intrekking van de erkenning alsmede intrekking van de bevoegdheid voertuigen aan een keuring
      te onderwerpen.


