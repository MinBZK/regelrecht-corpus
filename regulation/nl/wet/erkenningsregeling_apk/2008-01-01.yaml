  - number: '42'
    text: |-
      1 De keuring wordt verricht in een keuringsruimte met apparatuur die aan de in [hoofdstuk 2][ref1] gestelde
      eisen voldoet. Van deze eis kan worden afgeweken indien volgens de wijze van keuren zoals vermeld in de
      [Regeling wijze van keuren APK][ref2] een rij- of remproef buiten de keuringsruimte wordt uitgevoerd, mits de
      buitentemperatuur binnen het temperatuurgebied van de verplichte apparatuur ligt.

      2 De keuring wordt verricht door een keurmeester.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0007016
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel42
