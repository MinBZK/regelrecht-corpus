  - number: '54'
    text: |-
      1 Nadat een erkenning is verleend wordt ten minste één maal per twee jaar door een daartoe aangewezen
      functionaris van de Dienst Wegverkeer door middel van een herschouwing onderzocht of de erkenninghouder
      alsmede de keuringsplaats nog voldoen aan de in [hoofdstuk 2][ref1] opgenomen erkenningseisen alsmede of de in
      [hoofdstuk 6][ref2] opgenomen voorschriften worden nageleefd. Deze controle kan tevens plaatsvinden in het kader
      van een steekproef van het voertuig.

      2 Het resultaat van de herschouwing telt mee in een door de Dienst Wegverkeer vastgesteld en bekendgemaakt systeem
      van strafpunten.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Hoofdstuk6
