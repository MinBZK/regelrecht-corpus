        artikel: '65'
        hoofdstuk: '8'
  - number: '67'
    text: |-
      In afwijking van [artikel 2, vierde lid][ref1], is gezamenlijk gebruik van een keuringsplaats door meerdere
      erkenninghouders toegestaan indien met zodanig gebruik overeenkomstig [artikel 2, vierde lid][ref2], van de
      in [artikel 65][ref3] genoemde regeling, is begonnen voor het tijdstip van inwerkingtreding van de onderhavige
      regeling.


