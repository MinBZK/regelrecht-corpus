  - number: '51'
    text: |-
      Het bepaalde in [paragraaf 3][ref1] van dit hoofdstuk laat de bevoegdheid tot intrekking, wijziging en schorsing
      van de bevoegdheid voertuigen aan een keuring te onderwerpen, zoals omschreven in [artikel 87a van de wet][ref2],
      in andere gevallen dan de in [paragraaf 3][ref3] beschreven gevallen, onverlet.


