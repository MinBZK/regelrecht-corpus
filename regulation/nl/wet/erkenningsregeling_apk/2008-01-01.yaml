      - id: ref1
        bwb_id: BWBR0011158
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007016
  - number: '43'
    text: |-
      1 Het resultaat van elke keuring wordt door de keurmeester schriftelijk vastgelegd op het keuringsrapport.

      2 Voor dit keuringsrapport wordt gebruikgemaakt van het in de [Regeling vaststelling keuringsrapport][ref1]
      opgenomen model keuringsrapport.

      3 Uitsluitend indien de invulling rechtstreeks plaatsvindt uit het kentekenregister en de tekst ‘afdruk RDW’ na de
      transactiecode is ingevuld mag gebruik worden gemaakt van het model keuringsrapport zonder gele doorslag


      [ref1]: https://wetten.overheid.nl/BWBR0010803
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010803
  - number: '44'
    text: |-
      1 Na afloop van elke keuring wordt het bepaalde in het tweede lid tot en met het vijfde lid in acht genomen
      alvorens het keuringsrapport af te geven aan de aanvrager.

      2 Alvorens tot het afmelden van een voertuig als bedoeld in het derde lid wordt overgegaan, wordt door de
      keurmeester die het voertuig afmeldt, aan de hand van het kentekenbewijs nagegaan of de keuring van dat voertuig
      heeft plaatsgevonden.

      3 Het voertuig wordt door middel van datacommunicatie bij de Dienst Wegverkeer afgemeld onder verstrekking van de
      volgende gegevens:

      a. het pasnummer en de pincode van de keurmeester;

      b. het kenteken van het voertuig;

      c. de meldcode, gevormd door de laatste vier cijfers van het identificatienummer, letters en leestekens buiten
      beschouwing gelaten;

      d. indien het voertuig is goedgekeurd en het een voertuig betreft dat is voorzien van een kilometerteller, de
      afgelezen kilometerstand van het voertuig;

      e. indien het voertuig is goedgekeurd, indien van toepassing, de adviespunten;

      f. indien het voertuig is afgekeurd, de afkeurpunten;

      g. indien het voertuig is goedgekeurd na reparatie, de reparatiepunten en indien van toepassing, de adviespunten;

      h. de bevestiging dat de in het tweede lid voorgeschreven controleverplichting is nagekomen, waarna acceptatie van
      de afmelding wordt weergegeven:

      1°. de transactiecode en het tijdstip van de afmelding;

      2°. indien het voertuig is goedgekeurd: tevens een nieuwe vervaldatum;

      3°. indien het voertuig aan een steekproef moet worden onderworpen: tevens de einde wachttijd van de steekproef

      4 Op het keuringsrapport moet schriftelijk worden vermeld:

      a. het pasnummer als bedoeld in het derde lid, onderdeel a, en het bepaalde in de onderdelen b en c;

      b. de afgelezen kilometerstand indien het voertuig is voorzien van een kilometerteller;

      c. dat het voertuig is goedgekeurd indien het aan de keuringseisen blijkt te voldoen en indien van toepassing,
      eveneens de adviespunten;

      d. indien een voertuig niet aan de keuringseisen blijkt te voldoen dat het voertuig is afgekeurd en de
      afkeurpunten;

      e. indien er ten behoeve van de goedkeuring reparaties aan het voertuig zijn verricht, de reparatiepunten, en
      indien van toepassing, eveneens de adviespunten;

      f. de transactiecode, en uitsluitend indien de schriftelijke invulling rechtstreeks plaatsvindt uit het door de
      Dienst Wegverkeer bijgehouden kentekenregister de tekst ‘afdruk RDW’;

      g. indien het voertuig is goedgekeurd de vervaldatum, waarbij de maand van de vervaldatum voluit in letters is
      geschreven;

      h. indien het voertuig aan een steekproef wordt onderworpen de einde wachttijd van de steekproef;

      i. de naam, adresgegevens en het keuringsinstantienummer van de erkenninghouder.

      5 Alvorens het keuringsrapport wordt ondertekend, wordt door de keurmeester nagegaan of het rapport volledig is
      ingevuld, zodanig dat dit, indien van toepassing, ook zichtbaar is op de doorslag.

      6 Door een keurmeester worden niet meer dan vier voertuigen, waarvan de toegestane maximum massa niet meer bedraagt
      dan 3500 kg, per zestig minuten afgemeld.

      7 Het keuringsrapport wordt onverwijld aan de aanvrager afgegeven indien het voertuig niet aan een steekproef wordt
      onderworpen.

      8 Indien het voertuig aan een steekproef wordt onderworpen, deelt de erkenninghouder dit aan de aanvrager mede en
      houdt de erkenninghouder het keuringsrapport onder zich voor een periode van ten hoogste negentig minuten, vanaf
      het tijdstip van afmelding.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel44
  - number: '45'
    text: |-
      1 Indien het voertuig blijkens mededeling van de Dienst Wegverkeer aan een steekproef wordt onderworpen, gelden de
      in het tweede tot en met zesde lid genoemde verplichtingen.

      2 In de staat van het voertuig dat aan een steekproef wordt onderworpen, worden gedurende negentig minuten na
      het tijdstip van afmelding geen wijzigingen aangebracht en worden geen metingen met betrekking tot het voertuig
      verricht.

      3 De erkenninghouder wijst de eigenaar of houder van het voertuig dat aan een steekproef wordt onderworpen er op
      dat deze verplicht is het voertuig voor de uitvoering van de steekproef beschikbaar te houden.

      4 Voorafgaande aan de steekproefherkeuring wordt het kentekenbewijs van het voertuig door de eigenaar of houder
      dan wel door de erkenninghouder of de keurmeester aan de daartoe aangewezen functionaris van de Dienst Wegverkeer
      overhandigd. Door de erkenninghouder of de keurmeester wordt tevens het keuringsrapport overhandigd.

      5 Aan een steekproef wordt alle medewerking verleend en de terzake door de Dienst Wegverkeer gegeven aanwijzingen
      worden in acht genomen. Onder alle medewerking wordt in ieder geval verstaan dat:

      a. bij uitsluiting de keurmeester die het voertuig aan een keuring heeft onderworpen, gedurende de gehele
      steekproef aanwezig is en zelf feitelijke assistentie verleent bij het uitvoeren van de steekproef;

      b. indien de keuring verricht is door een mobiele keuringseenheid tevens het voertuig, van waaruit door de mobiele
      keuringseenheid de keuringen zijn verricht, bij de steekproef aanwezig is;

      c. het voertuig, ongeacht het tijdstip van aanvang van de steekproef, niet uit de keuringsplaats wordt verwijderd
      gedurende de steekproef;

      d. de desbetreffende ruimte en apparatuur gedurende de steekproef beschikbaar worden gesteld.

      6 Indien bij de steekproef wordt vastgesteld dat het voertuig niet voldoet aan de keuringseisen, het voertuig
      onterecht is af- of goedgekeurd, het keuringsrapport onjuist of onvolledig is ingevuld of indien wordt
      geconstateerd dat de voorschriften met betrekking tot de steekproef niet in acht zijn genomen, wordt door de
      daartoe aangewezen functionaris van de Dienst Wegverkeer een steekproefcontrolerapport opgemaakt dat door deze
      wordt ondertekend alsmede door de keurmeester.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel45
  - number: '46'
    text: |-
      1 Indien de eigenaar of houder van het voertuig dat aan een steekproef wordt onderworpen met het voertuig wegrijdt,
      wordt dit onverwijld door de keurmeester aan de Dienst Wegverkeer gemeld. De eventuele goedkeuring wordt door de
      Dienst Wegverkeer ingetrokken en het voertuig kan niet meer worden afgemeld.

      2 De erkenninghouder draagt er zorg voor dat de eigenaar of houder van een weggereden voertuig op de hoogte is
      gesteld van de verplichting om een nieuwe aanvraag van een keuringsrapport bij de Dienst Wegverkeer in te dienen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel46
  - number: '47'
    text: |-
      De Dienst Wegverkeer voert steekproefsgewijs anonieme keuringen uit door middel van het ter keuring aanbieden van
      een voertuig in het kader van het toezicht op het verrichten van keuringen.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel47
  - number: 47a
    text: |-
      De erkenninghouder vermeldt op de factuur bij de afgifte van een keuringsrapport het door hem ingevolge
      [artikel 75, eerste lid, van de wet][ref1] aan de Dienst Wegverkeer verschuldigde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
  - number: '48'
    text: |-
      1 De volgende bescheiden worden goed geordend ten minste twee jaar bewaard:

      a. indien van toepassing, de gele doorslag van ieder afgegeven keuringsrapport;

      b. foutief ingevulde of onbruikbaar geworden keuringsrapporten;

      c. de doorslag van het steekproefcontrolerapport.

      Op de onder a tot en met c genoemde bescheiden worden geen wijzigingen aangebracht.

      2 Gedurende de in het eerste lid bedoelde termijn worden de genoemde bescheiden en de controlelijsten desgevraagd
      onverwijld aan een functionaris van de Dienst Wegverkeer ter inzage gegeven of ter inzage opgestuurd.

      3 Ongebruikte keuringsrapporten en de aan de erkenninghouder met betrekking tot de erkenning afgegeven beschikking
      worden in een goed afgesloten kast of bureaulade of een gelijkwaardige voorziening opgeborgen.

      4 De erkenninghouder draagt er zorg voor dat de aan hem, ten behoeve van datacommunicatie, verstrekte code niet
      toegankelijk is voor onbevoegden.

      5 De boekwerken ‘Regelgeving APK’ en ‘APK milieukeuringseisen’ met betrekking tot de periodieke keuring alsmede de
      vereiste certificaten en handleidingen zijn goed geordend aanwezig.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel48
  - number: '49'
    text: |-
      De in dit hoofdstuk opgenomen regels ten aanzien van het toezicht op keuringsplaatsen zijn, voor zover niet anders
      bepaald, tevens van toepassing op het toezicht op mobiele keuringseenheden en de inrichtingen waar door deze
      mobiele keuringseenheden keuringen worden verricht. Mobiele keuringseenheden zijn gedurende de gehele steekproef
      aanwezig én beschikbaar bij de inrichtingen waar de keuringen worden verricht.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel49
  - number: '50'
    text: |-
      1 Het bepaalde in de [paragrafen 2][ref1] en [3][ref2] van dit hoofdstuk laat de bevoegdheid tot intrekking,
      wijziging en schorsing van de erkenning, zoals omschreven in [artikel 87 van de wet][ref3], in andere gevallen dan
      de in de [paragrafen 2][ref4] en [3][ref5] beschreven gevallen, onverlet.

      2 Een intrekking of wijziging van een erkenning als bedoeld in [artikel 87, tweede lid, van de wet][ref6] geldt
      alleen voor de betrokken keuringsplaats. De Dienst Wegverkeer kan, als de omstandigheden daartoe aanleiding geven,
      echter bepalen dat een intrekking of wijziging alle keuringsplaatsen betreft waarvoor de erkenning geldt.


