        artikel: '45'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '53'
    text: |-
      1 In het kader van het toezicht op de erkenninghouder, bedoeld in [artikel 86 van de wet][ref1], wordt door de
      Dienst Wegverkeer een systeem van bonus- en strafpunten voor de erkenninghouder vastgesteld, dat bekend wordt
      gemaakt in de Staatscourant. Aan de hand van dit systeem kan worden vastgesteld of het toezicht wordt verminderd,
      het toezicht wordt verscherpt dan wel dat de erkenning wordt ingetrokken. Dit systeem heeft tevens betrekking op
      [artikel 41, derde lid, onderdelen b en c][ref2], met dien verstande dat het voor wat betreft [bijlage 2][ref3]
      slechts betrekking heeft op onderdeel 2, onder b en onderdeel 3.

      2 In het kader van het toezicht op de keurmeester, bedoeld in de [artikelen 86][ref4] en [86a van de wet][ref5],
      wordt door de Dienst Wegverkeer een systeem van bonus- en strafpunten voor de keurmeester vastgesteld,
      dat bekend wordt gemaakt in de Staatscourant. Aan de hand van dit systeem kan worden vastgesteld of de
      bevoegdheid voertuigen aan een keuring te onderwerpen wordt ingetrokken. Dit systeem heeft tevens betrekking op
      [artikel 41, derde lid, onderdelen b en c][ref6], met dien verstande dat het voor wat betreft [bijlage 2][ref7]
      slechts betrekking heeft op onderdeel 2, onder b en onderdeel 3.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel41
