  - number: '52'
    text: |-
      Onverminderd [artikel 45, vijfde lid][ref1], wordt in het kader van het toezicht alle medewerking aan de daartoe
      aangewezen functionaris van de Dienst Wegverkeer verleend. Hieronder wordt in ieder geval verstaan:

      a. het verlenen van toegang tot de keuringsruimte;

      b. het verstrekken van inlichtingen;

      c. het overleggen van bescheiden; en

      d. het gebruik maken van de benodigde apparatuur.

      De door de Dienst Wegverkeer aangegeven aanwijzingen worden in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel45
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel52
