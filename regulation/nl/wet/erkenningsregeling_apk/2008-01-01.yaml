  - number: '27'
    text: |-
      1 Nadat de bevoegdheid voertuigen aan een keuring te onderwerpen is verleend, wordt onverminderd het bepaalde in de
      [artikelen 59 tot en met 62][ref1] door de keurmeester iedere twee jaar een toets bij de in de [artikelen 24][ref2]
      en [25][ref3] genoemde instelling afgelegd.

      2 De toets wordt afgenomen overeenkomstig een door de in het eerste lid bedoelde instelling vastgesteld en door de
      Dienst Wegverkeer goedgekeurd reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel24
