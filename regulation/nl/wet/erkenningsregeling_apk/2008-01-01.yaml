  - number: '36'
    text: |-
      1 Ten aanzien van roetmeters, toerentellers, olietemperatuurmeters, manometers, pedaalkrachtmeters,
      remvertragingsmeters, rollenremtestbanken, platenremtestbanken en uitlaatgastesters met lambda-bepaling is steeds
      een geldig certificaat van eerste keuring dan wel van herkeuring aanwezig.

      2 Ten aanzien van de in [artikel 3, derde lid, onder a][ref1], bedoelde afzuiginstallatie ten behoeve van de
      roetmeting is steeds een geldig certificaat van goedkeuring aanwezig.

      3 Na verwijdering van de rollenremtestbank of de platenremtestbank van zijn fundering waaraan hij was bevestigd,
      teneinde te worden herplaatst op dezelfde plaats of een andere plaats, wordt wederom een certificaat van eerste
      keuring dan wel herkeuring afgegeven en is de verzegeling aan de fundering aangebracht. Tevens wordt door de
      erkenninghouder van een verplaatsing hieraan voorafgaand onder vermelding van de ingangsdatum aan de Dienst
      Wegverkeer mededeling gedaan. Dit geschiedt door middel van overlegging van een plattegrond van de keuringsplaats
      waarop de plaats van de rollenremtestbank of platenremtestbank staat aangegeven.

      4 Na verplaatsing van de nulemissie-eenheid naar een andere keuringsplaats, moet wederom een certificaat van eerste
      keuring, dan wel herkeuring worden afgegeven. Tevens wordt door de erkenninghouder van een verplaatsing hieraan
      voorafgaand onder vermelding van de ingangsdatum aan de Dienst Wegverkeer mededeling gedaan. Dit geschiedt door
      middel van overlegging van een plattegrond van de keuringsplaats waarop de plaats van de nulemissie-eenheid staat
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel3
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '37'
    text: |-
      In elke keuringsplaats en bij elke mobiele keuringseenheid waarvoor een erkenning geldt voor motorrijtuigen waarvan
      de toegestane maximum massa niet meer bedraagt dan 3500 kg met een verbrandingsmotor met elektrische ontsteking, is
      het boekwerk ‘APK milieukeuringseisen’ aanwezig.
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel37
  - number: '38'
    text: |-
      1

      Indien zich wijzigingen voordoen in de samenstelling van de economische eenheid als bedoeld in [artikel 23][ref1],
      worden deze door de erkenninghouder schriftelijk aan de Dienst Wegverkeer gemeld.

      2

      Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo spoedig mogelijk schriftelijk in kennis te
      stellen.

      3

      Indien als gevolg van een wijziging als bedoeld in het voorgaande lid de bedrijfsvoering van het reeds erkende
      bedrijf wordt voortgezet door een andere natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en
      strafpunten van het systeem als bedoeld in [artikel 53, eerste lid][ref2], beschouwd als te zijn toegekend aan deze
      natuurlijke persoon of rechtspersoon. Dit geldt ook voor de opgelegde sancties.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel53
    url: https://wetten.overheid.nl/BWBR0011158/2008-01-01#Artikel38
