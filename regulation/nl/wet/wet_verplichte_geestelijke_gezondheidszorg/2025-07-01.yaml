  - number: 8:12
    text: |-
      1 De duur van de tijdelijke verplichte zorg, bedoeld in [artikel 8:11][ref1], is beperkt tot een periode van
      maximaal drie dagen. Indien de termijn, bedoeld in de eerste volzin, eindigt op een zaterdag, zondag of algemeen
      erkende feestdag als bedoeld in de [Algemene termijnenwet][ref2], wordt deze verlengd tot en met de eerstvolgende
      dag die niet een zaterdag, zondag of algemeen erkende feestdag is.

      2 De zorgverantwoordelijke doet onverwijld mededeling aan de geneesheer-directeur van de schriftelijke en
      gemotiveerde beslissing tot tijdelijke verplichte zorg en van de beëindiging van de tijdelijke verplichte zorg.

      3 Indien de zorgverantwoordelijke van oordeel is dat de tijdelijke verplichte zorg na de in het eerste lid bedoelde
      periode moet worden voortgezet, kan hij daartoe uitsluitend beslissen indien een door de zorgverantwoordelijke
      gemotiveerde aanvraag tot wijziging van de machtiging tot voortzetting van de crisismaatregel of zorgmachtiging
      door de geneesheer-directeur, vergezeld van zijn advies daarover, bij de officier van justitie is ingediend.

      4 De officier van justitie beslist zo spoedig mogelijk op de aanvraag tot wijziging van de machtiging tot
      voortzetting van de crisismaatregel of zorgmachtiging.

      5 Indien de officier van justitie instemt met de aanvraag van de geneesheer-directeur tot wijziging van
      de machtiging tot voortzetting van de crisismaatregel of zorgmachtiging, dient hij daartoe onverwijld een
      verzoekschrift in bij de rechter.

      6 De verplichte zorg, bedoeld in het vierde lid, kan worden verleend totdat:

      a. de officier van justitie besluit geen verzoekschrift in te dienen en dit aan de geneesheer-directeur heeft
      meegedeeld,

      b. de rechter uitspraak heeft gedaan over het verzoekschrift voor een wijziging van een zorgmachtiging of door het
      verstrijken van de termijn, bedoeld in [artikel 6:2, eerste lid, onderdeel d][ref3], of

      c. de rechter uitspraak heeft gedaan over het verzoekschrift voor een wijziging van een machtiging tot voortzetting
      van de crisismaatregel, of door het verstrijken van de termijn, bedoeld in [artikel 7:8, derde lid][ref4].

      7 Indien betrokkene op grond van [artikel 8:11][ref5] in een instelling als bedoeld in
      [artikel 3.1, eerste lid][ref6], of [artikel 3.3, eerste lid, van de Wet forensische zorg][ref7]
      wordt opgenomen, zijn voor de duur van die opname [artikel 3.4 van de Wet forensische zorg][ref8],
      [artikel 42, vijfde lid][ref9] en [artikel 44][ref10], alsmede de [hoofdstukken V][ref11], [VI][ref12] en
      [VII van de Beginselenwet verpleging ter beschikking gestelden][ref13] van toepassing.


