  - number: 8:19
    text: |-
      1 Indien de geneesheer-directeur afwijzend of niet tijdig beslist op de aanvraag tot beëindiging van de verplichte
      zorg op grond van een machtiging tot voortzetting van de crisismaatregel of zorgmachtiging, kan degene die
      de aanvraag heeft ingediend bij de officier van justitie een aanvraag indienen om een verzoekschrift voor
      de beëindiging van de verplichte zorg op grond van een machtiging tot voortzetting van de crisismaatregel of
      zorgmachtiging bij de rechter in te dienen. Ter voorbereiding van een verzoekschrift voor de beëindiging van de
      verplichte zorg aan de rechter draagt de geneesheer-directeur zorg voor een medische verklaring van een psychiater
      over de actuele gezondheidstoestand van betrokkene en overlegt deze aan de officier van justitie.

      2 De geneesheer-directeur draagt ervoor zorg dat de psychiater in de medische verklaring tevens beoordeelt of
      de gezondheidstoestand van betrokkene zodanig is verbeterd dat het ernstig nadeel is weggenomen, dan wel welke
      voorwaarden of beperkingen aan een beëindiging van de verplichte zorg moeten worden gesteld om het ernstig nadeel
      weg te nemen. [Artikel 5:10][ref1] is van overeenkomstige toepassing.

      3 De officier van justitie dient het verzoekschrift voor de beëindiging van de verplichte zorg op grond van een
      machtiging tot voortzetting van de crisismaatregel of zorgmachtiging onverwijld bij de rechter in en voegt bij
      het verzoekschrift:

      a. een afschrift van de aanvraag voor beëindiging van de verplichte zorg op grond van een machtiging tot
      voortzetting van de crisismaatregel of zorgmachtiging,

      b. de beslissing op de oorspronkelijke aanvraag, indien van toepassing voorzien van de beslissing van Onze Minister
      van Veiligheid en Justitie, bedoeld in [artikel 8:18, vijfde lid][ref2],

      c. een afschrift van de machtiging tot voortzetting van de crisismaatregel respectievelijk zorgmachtiging,

      d. de medische verklaring, en

      e. de politiegegevens als bedoeld in de [Wet politiegegevens][ref3] en de strafvorderlijke en justitiële
      gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref4] die relevant kunnen zijn voor de
      beoordeling van het ernstig nadeel; verstrekking door de officier van justitie van de politiegegevens, justitiële
      en strafvorderlijke gegevens kan achterwege blijven indien het belang van enig strafrechtelijk onderzoek zich
      daartegen verzet.

      4 In afwijking van het derde lid, kan de officier van justitie besluiten geen verzoekschrift bij de rechter
      in te dienen, indien het een herhaalde aanvraag betreft en uit de aanvraag onvoldoende blijkt dat de feiten en
      omstandigheden na de eerdere aanvraag veranderd zijn.

      5 In het geval de officier van justitie op het moment van ontvangst van de aanvraag tot beëindiging van verplichte
      zorg reeds is begonnen met de voorbereiding van een nieuw verzoekschrift voor een machtiging tot voortzetting van
      de crisismaatregel of zorgmachtiging of een wijziging van de zorgmachtiging, dan wel een dergelijk verzoekschrift
      bij de rechter is ingediend, voegt hij de aanvraag tot beëindiging van de verplichte zorg bij het verzoekschrift
      voor een machtiging tot voortzetting van de crisismaatregel of zorgmachtiging, het verzoekschrift tot wijziging van
      de zorgmachtiging, dan wel verzoekt hij de griffie van de rechtbank de aanvraag bij het ingediende verzoekschrift
      te voegen.

      6 De officier van justitie deelt het besluit om geen verzoekschrift bij de rechter in te dienen, bedoeld in het
      vierde lid, dan wel de aanvraag te voegen bij het verzoekschrift voor een machtiging tot voortzetting van de
      crisismaatregel of zorgmachtiging of het verzoekschrift voor een wijziging van de zorgmachtiging, bedoeld in het
      vijfde lid, schriftelijk mee aan de aanvrager, betrokkene, de vertegenwoordiger en de advocaat.

      7 De rechter doet zo spoedig mogelijk uitspraak op het verzoekschrift voor de beëindiging van de verplichte
      zorg. In het geval de aanvraag voor beëindiging van verplichte zorg is gevoegd bij het verzoekschrift voor een
      machtiging tot voortzetting van de crisismaatregel of zorgmachtiging of het verzoekschrift voor een wijziging van
      de zorgmachtiging, doet hij uitspraak over de beëindiging van de verplichte zorg gelijktijdig met de uitspraak
      inzake het verzoekschrift voor een machtiging tot voortzetting van de crisismaatregel of zorgmachtiging dan wel het
      verzoekschrift tot wijziging van de zorgmachtiging.

      8 Indien de rechter voorwaarden verbindt aan de beëindiging van de verplichte zorg, is [artikel 8:20][ref5] van
      overeenkomstige toepassing. Hij kan zich door de officier van justitie, zorgverantwoordelijke, de psychiater die de
      medische verklaring heeft afgegeven of een andere deskundige laten adviseren over de te stellen voorwaarden.

      9 De griffie van de rechtbank zendt een afschrift van de beslissing van de rechter aan:

      a. betrokkene,

      b. de vertegenwoordiger,

      c. de advocaat,

      d. de ouders of een van hen, voor zover deze niet als vertegenwoordiger optreden dan wel optreedt;

      e. de echtgenoot, geregistreerde partner, degene met wie een samenlevingscontract is gesloten, levensgezel of
      degene die betrokkene verzorgt;

      f. de gezinsvoogdijwerker;

      g. de aanvrager, bedoeld in [artikel 8:18, eerste lid][ref6],

      h. de zorgaanbieder, de geneesheer-directeur, de zorgverantwoordelijke en de huisarts,

      i. de inspectie;

      j. de officier van justitie, en

      k. de burgemeester, indien betrokkene verplichte zorg heeft ontvangen op grond van een crisismaatregel of
      machtiging tot voortzetting van de crisismaatregel.

      10 De beslissing van de rechter is uitvoerbaar bij voorraad.

      11 Tegen de beslissing van de rechter op het verzoekschrift voor de beëindiging van de verplichte zorg staat geen
      hoger beroep open.


