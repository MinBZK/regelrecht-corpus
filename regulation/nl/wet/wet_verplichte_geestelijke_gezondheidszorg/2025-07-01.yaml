  - number: 5:1
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor het in behandeling nemen van meldingen betreffende
      personen voor wie de noodzaak tot geestelijke gezondheidszorg zou moeten worden onderzocht, het verrichten van
      onderzoek naar die noodzaak, het informeren van degene die een melding heeft gedaan en het zo nodig indienen van
      een aanvraag voor de voorbereiding van een verzoekschrift voor een zorgmachtiging bij de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel51
  - number: 5:2
    text: |-
      1 Een ieder kan een melding doen bij het college van burgemeester en wethouders over een persoon die woonachtig is
      in die gemeente of aldaar overwegend verblijft voor wie de noodzaak tot geestelijke gezondheidszorg, die mogelijk
      zou moeten worden verleend met verplichte zorg, zou moeten worden onderzocht.

      2 Het college van burgemeester en wethouders draagt binnen een redelijke termijn, doch uiterlijk binnen veertien
      dagen, zorg voor een verkennend onderzoek naar de noodzaak, bedoeld in het eerste lid.

      3 Als het college van burgemeester en wethouders van mening is dat de noodzaak tot verplichte zorg aanwezig is,
      dient het college een aanvraag in als bedoeld in [artikel 5:3][ref1], en bericht het college degene die de melding
      heeft gedaan over het indienen van een aanvraag, voor zover het een persoon betreft als bedoeld in het vijfde lid.

      4 Als het college van burgemeester en wethouders van mening is dat geen noodzaak tot verplichte zorg aanwezig is,
      bericht het college daarover degene die de melding heeft gedaan, voor zover het een persoon betreft als bedoeld in
      het vijfde lid.

      5 In het geval, bedoeld in het vierde lid, dient het college van burgemeester en wethouders niettemin een aanvraag
      voor de voorbereiding van een verzoekschrift voor een zorgmachtiging, vergezeld van het verkennend onderzoek, in
      bij de officier van justitie als bedoeld in [artikel 5:3][ref2], indien degene die de melding heeft gedaan van
      mening is dat de noodzaak tot verplichte zorg aanwezig is en de melding is gedaan door:

      a. de vertegenwoordiger;

      b. de echtgenoot, geregistreerde partner of degene met wie een samenlevingscontract is gesloten;

      c. de ouders dan wel een van hen, voor zover deze niet optreden of optreedt als vertegenwoordiger;

      d. de voor de continuïteit van zorg essentiële naasten.

      6 De aanvraag, bedoeld in het derde of vijfde lid, wordt gedaan binnen veertien dagen na de melding,
      bedoeld in het eerste lid. Indien het college van burgemeester en wethouders niet tijdig een aanvraag
      indient, staat in afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref3] beroep daartegen
      uitsluitend open voor de personen, bedoeld in het vijfde lid. Het beroepschrift kan in afwijking van
      [artikel 6:12, tweede lid, onderdeel b, van de Algemene wet bestuursrecht][ref4] zonder ingebrekestelling worden
      ingediend.

      7 Indien degene die de melding heeft verricht anoniem wil blijven, worden zijn persoonsgegevens of andere gegevens
      die herleidbaar zijn tot de melder niet in de aanvraag vermeld.

      8 Bij of krachtens algemene maatregel van bestuur kunnen eisen worden gesteld aan het verkennend onderzoek, bedoeld
      in het tweede lid.


