  - number: 10:12
    text: |-
      1 Indien de wet niet in acht is genomen bij het nemen van een crisismaatregel, of bij de toepassing van
      [artikel 7:3][ref1] kan betrokkene of de vertegenwoordiger door middel van een schriftelijk en gemotiveerd
      verzoekschrift bij de rechter verzoeken tot schadevergoeding door respectievelijk de gemeente of de organisaties
      onder wiens verantwoordelijkheid de personen, bedoeld in artikel 7:3, vierde lid, hebben gehandeld. De rechter kent
      een naar billijkheid vast te stellen schadevergoeding toe.

      2 Indien de wet niet in acht is genomen door de geneesheer-directeur of de zorgverantwoordelijke, kan betrokkene of
      de vertegenwoordiger de rechter verzoeken tot schadevergoeding door de zorgaanbieder of de zorgverantwoordelijke.
      De rechter kent een naar billijkheid vast te stellen schadevergoeding toe.

      3 Indien de wet niet in acht is genomen door de officier van justitie of de rechter, kan betrokkene of de
      vertegenwoordiger de rechter verzoeken tot schadevergoeding ten laste van de Staat. De rechter kent een naar
      billijkheid vast te stellen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel73
