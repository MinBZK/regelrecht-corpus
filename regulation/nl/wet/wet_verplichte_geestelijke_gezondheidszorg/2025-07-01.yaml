  - number: 5:6
    text: |-
      Indien er geen zorgverantwoordelijke voor betrokkene is, wijst de geneesheer-directeur een zorgverantwoordelijke
      voor betrokkene aan.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel56
  - number: 5:7
    text: |-
      Voor de toepassing van deze wet gelden voor de psychiater de volgende voorwaarden:

      a. hij staat als psychiater ingeschreven in een register als bedoeld in
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1];

      b. aan deze zijn geen beperkingen opgelegd als bedoeld in [artikel 48, eerste lid, onderdeel e][ref2], en
      [artikel 80, eerste lid, onderdelen a en b, van de Wet op de beroepen in de individuele gezondheidszorg][ref3];

      c. hij functioneert onafhankelijk ten opzichte van de zorgaanbieder, en

      d. hij heeft minimaal één jaar geen zorg verleend aan betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel80
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel57
