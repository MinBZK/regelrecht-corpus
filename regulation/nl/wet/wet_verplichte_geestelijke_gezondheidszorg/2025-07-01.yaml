  - number: 9:9
    text: |-
      1 Beperkingen in het recht op het ontvangen van bezoek kunnen door de zorgverantwoordelijke worden opgelegd indien:

      a. van het bezoek ernstige nadelige gevolgen moeten worden gevreesd voor de gezondheidstoestand van betrokkene,
      voor zover dit telkenmale uit een uitdrukkelijke verklaring van de zorgverantwoordelijke blijkt, dan wel

      b. dit ter voorkoming van verstoring van de orde of voor de veiligheid in de accommodatie, zoals die in de
      huisregels is beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.

      2 Beperkingen in het recht op bewegingsvrijheid in en rond de accommodatie kunnen, anders dan als middel of
      maatregel, aangegeven bij algemene maatregel van bestuur krachtens [artikel 9:8, derde lid][ref1], door de
      zorgverantwoordelijke worden opgelegd indien:

      a. naar het oordeel van de zorgverantwoordelijke van de uitoefening van het recht op de bewegingsvrijheid ernstige
      nadelige gevolgen moeten worden gevreesd voor de gezondheidstoestand van betrokkene, dan wel

      b. dit ter voorkoming van verstoring van de orde of voor de veiligheid in de accommodatie, zoals die in de
      huisregels is beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.

      3 Beperkingen in het recht op het vrij gebruik van communicatiemiddelen kunnen door de zorgverantwoordelijke worden
      opgelegd indien:

      a. naar het oordeel van de zorgverantwoordelijke van de uitoefening van het recht op vrij gebruik van
      communicatiemiddelen ernstige nadelige gevolgen moeten worden gevreesd voor de gezondheidstoestand van betrokkene,
      dan wel

      b. indien dit ter voorkoming van verstoring van de orde of voor de veiligheid in de accommodatie, zoals die in de
      huisregels is beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.

      4 Op het opleggen van beperkingen als bedoeld in het eerste, tweede of derde lid is [artikel 8:9][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel89
