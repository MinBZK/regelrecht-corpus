  - number: 13:6
    text: |-
      1 Met een geldboete van de tweede categorie wordt gestraft hij die:

      a. vormen van verplichte zorg verleent waarin de crisismaatregel, machtiging tot voortzetting van de
      crisismaatregel of zorgmachtiging niet voorziet en die ook niet op basis van de [artikelen 7:3][ref1],
      [8:11 tot en met 8:13][ref2] of [9:1, eerste lid, eerste volzin][ref3], kunnen worden verleend;

      b. handelt in strijd met [artikel 2:4][ref4];

      c. handelt in strijd met [artikel 7:3][ref5];

      d. handelt in strijd met het bepaalde krachtens [artikel 8:6][ref6];

      e. handelt in strijd met [artikel 8:11][ref7];

      f. handelt in strijd met [artikel 8:12][ref8];

      g. handelt in strijd met [artikel 8:13][ref9];

      h. handelt in strijd met [artikel 8:14][ref10];

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.


