      1 Indien de officier van justitie een verzoekschrift voor een zorgmachtiging voorbereidt met toepassing van
      [artikel 2.3 van de Wet forensische zorg][ref1] is het bepaalde in [hoofdstuk 5][ref2] van overeenkomstige
      toepassing, met uitzondering van de [artikelen 5:1][ref3] en [5:2][ref4] en in geval van toepassing van
      [artikel 2.3, eerste lid, onder 7° tot en met 12°, van de Wet forensische zorg][ref5], eveneens met uitzondering
      van [artikel 5.5][ref6].

      2 Indien de rechter ambtshalve toepassing van [artikel 2.3, eerste lid, van de Wet forensische zorg][ref7]
      overweegt, verzoekt hij de officier van justitie toepassing te geven aan het bepaalde in dit artikel.


