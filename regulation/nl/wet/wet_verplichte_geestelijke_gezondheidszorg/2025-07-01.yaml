  - number: 5:16
    text: |-
      1 Na de schriftelijke mededeling, bedoeld in [artikel 5:4, tweede lid, onderdeel a][ref1], deelt de officier
      van justitie zijn schriftelijke en gemotiveerde beslissing of voldaan is aan de criteria voor verplichte zorg
      zo spoedig mogelijk, maar uiterlijk binnen vier weken, mee aan betrokkene, de vertegenwoordiger, de advocaat, de
      geneesheer-directeur, de zorgaanbieder en de zorgverantwoordelijke, alsmede in voorkomend geval aan de aanvrager,
      bedoeld in [artikel 5:3][ref2]. Indien toepassing is gegeven aan het bepaalde in [artikel 5:5, vijfde lid][ref3],
      geldt hiervoor een termijn van uiterlijk zes weken.

      2 Indien de aanvrager, bedoeld in [artikel 5:3][ref4], het college van burgemeester en wethouders is, stelt het
      college zo spoedig mogelijk degene die de melding heeft gedaan als bedoeld in [artikel 5:2, vijfde lid][ref5], van
      de gemotiveerde beslissing van de officier van justitie schriftelijk op de hoogte. In de situatie dat de officier
      van justitie van oordeel is dat niet is voldaan aan de criteria voor verplichte zorg en het college dit oordeel
      deelt, deelt het college dit hierbij tevens schriftelijk mede.


