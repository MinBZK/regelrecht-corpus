  - number: 7:8
    text: |-
      1 Met betrekking tot de behandeling van het verzoekschrift voor een machtiging tot voorzetting van de
      crisismaatregel is [artikel 6:1, eerste en derde lid][ref1], van overeenkomstige toepassing.

      2 __REF000___________________________________________________________________________________________________________
      _____, is van overeenkomstige toepassing. De rechter kan, in afwijking van het verzoekschrift, bedoeld in
      [artikel 7:7, eerste lid][ref3], of de bescheiden, bedoeld in [artikel 7:2, tweede lid][ref4], besluiten tot het
      opnemen van andere vormen van verplichte zorg, bedoeld in [artikel 3:2, tweede lid, van de wet][ref5].

      3 De rechter doet zo spoedig mogelijk uitspraak, maar uiterlijk drie dagen na ontvangst van een verzoekschrift
      voor een machtiging tot voorzetting van de crisismaatregel als bedoeld in het eerste lid, respectievelijk in
      [artikel 8:12, vijfde lid][ref6]. Indien de termijn, bedoeld in de eerste volzin, eindigt op een zaterdag, zondag
      of algemeen erkende feestdag als bedoeld in de [Algemene termijnenwet][ref7], wordt deze verlengd tot en met de
      eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.

      4 De griffie van de rechtbank zendt een afschrift van de beslissing van de rechter aan:

      a. betrokkene;

      b. de vertegenwoordiger;

      c. de advocaat;

      d. de ouders van een minderjarige betrokkene of een van hen, voor zover deze niet als vertegenwoordiger optreden
      dan wel optreedt;

      e. de echtgenoot, geregistreerde partner, degene met wie een samenlevingscontract is gesloten, levensgezel of
      degene die betrokkene verzorgt;

      f. de gezinsvoogdijwerker;

      g. de zorgaanbieder, de geneesheer-directeur, de zorgverantwoordelijke en de huisarts;

      h. de inspectie;

      i. de officier van justitie.

      5 Tegen de beslissing van de rechter inzake het verlenen van een machtiging tot voorzetting van de crisismaatregel
      staat geen hoger beroep open.

      6 Indien een machtiging betrekking heeft op een minderjarige die onder toezicht is gesteld, geldt deze als
      machtiging, als bedoeld in [artikel 265b van Boek 1 van het Burgerlijk Wetboek][ref8].


