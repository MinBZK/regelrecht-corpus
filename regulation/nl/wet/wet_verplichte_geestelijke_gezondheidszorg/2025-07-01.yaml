    text: |-
      1 De zorgaanbieder zorgt ten behoeve van de uitvoering van deze wet en het toezicht door de inspectie voor het
      digitaal beschikbaar zijn van de volgende gegevens:

      a. de naam van betrokkene, diens burgerservicenummer, de naam van de zorgverantwoordelijke en de naam van de
      geneesheer-directeur;

      b. de zelfbindingsverklaring;

      c. de vorm van de aan betrokkene verleende verplichte zorg;

      d. de noodzaak van de verplichte zorg;

      e. de begin- en einddatum van de vorm van de verplichte zorg;

      f. de duur en frequentie van de verplichte zorg;

      g. de zorgmachtiging;

      h. de crisismaatregel en machtiging tot voortzetting van de crisismaatregel;

      i. de beslissing tot het verlenen van tijdelijke verplichte zorg voorafgaand aan een crisismaatregel op grond van
      [artikel 7:3][ref1];

      j. de beslissing tot het verlenen van tijdelijke verplichte zorg in een onvoorziene situatie op grond van
      [artikel 8:11][ref2];

      k. de beslissingen van de geneesheer-directeur op de aanvragen voor tijdelijke onderbreking of beëindiging van een
      zorgmachtiging op grond van de [artikelen 8:17][ref3] of [8:18][ref4];

      l. de beslissingen van de rechter op verzoekschriften voor beëindiging van een zorgmachtiging op grond van
      [artikel 8:19][ref5];

      m. de behandeling op grond van [artikel 9:6][ref6], het toepassen van middelen of maatregelen als bedoeld in
      [artikel 9:8, eerste lid][ref7], of het opleggen van beperkingen als bedoeld in [artikel 9:9][ref8];

      n. de beslissingen van de strafrechter op grond van [artikel 2.3, eerste lid, van de Wet forensische zorg][ref9]
      waaruit blijkt of iemand is opgenomen met een nog geldende justitiële titel op grond van het
      [Wetboek van Strafrecht][ref10].

      2 De zorgaanbieder verstrekt ten minste eens per zes maanden aan de inspectie een digitaal overzicht van de
      gegevens, bedoeld in het eerste lid. Bij algemene maatregel van bestuur kan worden bepaald dat deze gegevens in
      plaats van aan de inspectie op een bij of krachtens die maatregel aangewezen wijze verstrekt worden aan en verwerkt
      worden door een door Onze Minister aan te wijzen instantie.


