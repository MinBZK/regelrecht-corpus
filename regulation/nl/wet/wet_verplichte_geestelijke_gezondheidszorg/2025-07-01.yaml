  - number: 7:2
    text: |-
      1 De burgemeester vermeldt in de crisismaatregel in elk geval:

      a. de zorg die noodzakelijk is om de crisissituatie af te wenden;

      b. de zorgaanbieder, de geneesheer-directeur en de zorgverantwoordelijke die worden belast met de uitvoering van de
      crisismaatregel en zo nodig de accommodatie;

      c. de mogelijkheid van advies en bijstand door een patiëntenvertrouwenspersoon;

      d. het recht op beroep, bedoeld in [artikel 7:6][ref1].

      2 De burgemeester zendt onverwijld een afschrift van zijn beslissing tot het nemen van een crisismaatregel en de
      afgegeven medische verklaring aan betrokkene, de advocaat, de geneesheer-directeur, de inspectie, de officier van
      justitie en voor zover aanwezig de vertegenwoordiger en de gezinsvoogdijwerker.

      3 Indien betrokkene geen advocaat heeft, draagt de burgemeester binnen 24 uur na het nemen van de crisismaatregel
      ervoor zorg dat betrokkene wordt bijgestaan door een advocaat, tenzij betrokkene daartegen bedenkingen heeft.

      4 Bij algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in overeenstemming met
      Onze Minister van Veiligheid en Justitie, kunnen regels worden gesteld over de toepassing van het derde lid.

      5 De burgemeester verstrekt de persoonsgegevens van betrokkene aan de patiëntenvertrouwenspersoon, met als doel
      betrokkene te kunnen informeren over de mogelijkheid tot advies en bijstand door een patiëntenvertrouwenspersoon.
      De burgemeester verstrekt de persoonsgegevens alleen met uitdrukkelijke toestemming van betrokkene.

      6 De burgemeester draagt ervoor zorg dat de zorgverantwoordelijke ten behoeve van de verplichting,
      bedoeld in [artikel 8:4, eerste lid][ref2], een afschrift van de afgegeven medische verklaring, bedoeld in
      [artikel 7:1, derde lid, onderdeel a][ref3], ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0040635#Artikel71
