  - number: 15:1
    text: |-
      1 De [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] blijft van toepassing op:

      a. verzoeken die krachtens die wet zijn ingediend en die strekken tot het verkrijgen van een beslissing
      door de rechter, de officier, de inspecteur, de geneesheer-directeur of de commissie, bedoeld in
      [artikel 41, tweede lid, van die wet][ref2];

      b. de vóór het tijdstip van inwerkingtreding van deze wet aangevangen voorbereiding van een last tot
      inbewaringstelling door de burgemeester, bedoeld in [artikel 20 van die wet][ref3];

      c. een beslissing als bedoeld in de onderdelen a of b die vóór het tijdstip van inwerkingtreding van deze wet is
      genomen;

      d. een beslissing die met toepassing van de onderdelen a of b na het tijdstip van inwerkingtreding van deze wet
      is genomen;

      e. gedragingen alsmede beslissingen, anders dan bedoeld in de onderdelen c en d, ten aanzien van een persoon
      waarvoor een machtiging of last tot inbewaringstelling als bedoeld in die wet geldt;

      f. de vóór het tijdstip van inwerkingtreding van deze wet door de rechter gelaste plaatsingen op grond van
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref4], waarvan de geldigheidsduur op het tijdstip van
      inwerkingtreding van deze wet nog niet is verstreken. [Artikel 14:4, onderdeel E, onder a][ref5], van deze wet
      heeft geen gevolgen voor deze plaatsingen. Artikel 37, eerste lid, van het Wetboek van Strafrecht, zoals dit luidde
      voor de inwerkingtreding van deze wet, blijft in deze gevallen van toepassing.

      2 In afwijking van het eerste lid, onderdelen c en d, vervalt een machtiging als bedoeld in de
      [artikelen 2, eerste lid][ref6], [14a, eerste lid][ref7], [14d, tweede lid][ref8], [15, eerste lid][ref9],
      [32, eerste lid][ref10], en [34f, eerste lid, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref11]
      uiterlijk twaalf maanden na inwerkingtreding van deze wet.

      3 Een krachtens de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref12] verleende last tot
      inbewaringstelling, waarvan de geldigheidsduur op het tijdstip van inwerkingtreding van deze wet nog niet is
      verstreken, wordt voor de toepassing van [hoofdstuk 7, paragraaf 5][ref13], aangemerkt als een crisismaatregel.

      4 Een krachtens de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref14] verleende machtiging tot
      voortzetting van de inbewaringstelling, waarvan de geldigheidsduur op het tijdstip van inwerkingtreding van deze
      wet nog niet is verstreken, wordt voor de toepassing van [hoofdstuk 7, paragraaf 6][ref15], aangemerkt als een
      machtiging tot voortzetting van de crisismaatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
