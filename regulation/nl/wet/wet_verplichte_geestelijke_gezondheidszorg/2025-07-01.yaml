      1 Een persoon die in een accommodatie verblijft en aan wie tevens de maatregel van terbeschikkingstelling met bevel
      tot verpleging van overheidswege of de maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd, wordt
      voor de toepassing van deze wet vanaf het moment van opname in de accommodatie aangemerkt als betrokkene aan wie op
      grond van een zorgmachtiging verplichte zorg strekkende tot opname in een accommodatie wordt verleend. Ten aanzien
      van een dergelijke persoon is voor zijn verblijf in de accommodatie en de behandeling van zijn psychische stoornis
      het bepaalde in deze paragraaf van toepassing.

      2 Voor een persoon die met zijn instemming in een accommodatie verblijft en die:

      a. tevens forensisch patiënt in de zin van [artikel 1.1 van de Wet forensische zorg][ref1] is, dan wel

      b. aan wie de voorwaardelijke maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd, of ten
      aanzien van wie de maatregel van plaatsing in een inrichting voor jeugdigen voorwaardelijk is beëindigd, gelden
      de [artikelen 8:14][ref2], [8:15][ref3], [9:2][ref4] en [9:9][ref5] van deze wet. [Hoofdstuk 10][ref6] is van
      overeenkomstige toepassing op beslissingen ingevolge de artikelen 8:14, 8:15, 9:2 en 9:9.


