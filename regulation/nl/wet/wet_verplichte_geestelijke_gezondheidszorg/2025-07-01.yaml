  - number: 1:7
    text: |-
      1 De rechter geeft onverwijld aan het bestuur van de raad voor rechtsbijstand een last tot toevoeging van een
      advocaat aan betrokkene, indien niet blijkt dat betrokkene reeds een advocaat heeft, en:

      a. ten aanzien van betrokkene een verzoekschrift voor een machtiging tot voorzetting van de crisismaatregel wordt
      ingediend als bedoeld in [artikel 7:7][ref1] of een verzoekschrift voor een zorgmachtiging wordt voorbereid als
      bedoeld in [artikel 5:4][ref2],

      b. betrokkene beroep tegen de crisismaatregel, bedoeld in [artikel 7:6][ref3], instelt,

      c. betrokkene beroep tegen de beslissing van de geneesheer-directeur, bedoeld in [artikel 8:19][ref4], of het
      uitblijven daarvan, instelt, of

      d. betrokkene beroep tegen de beslissing van de klachtencommissie, bedoeld in [artikel 10:7][ref5], instelt.

      2 Zodra de officier van justitie door betrokkene of de vertegenwoordiger op de hoogte wordt gebracht van het
      voornemen om beroep tegen de crisismaatregel, bedoeld in [artikel 7:6][ref6], in te stellen, verstrekt hij, indien
      betrokkene geen advocaat heeft, de persoonsgegevens van betrokkene aan de rechter, die onverwijld aan het bestuur
      van de raad voor rechtsbijstand een last tot toevoeging van een advocaat aan betrokkene verstrekt.

      3 De [artikelen 38][ref7], [39][ref8], [40][ref9], [43 tot en met 45][ref10] en
      [48 van het Wetboek van Strafvordering][ref11] zijn van overeenkomstige toepassing op de toevoeging en de taak van
      de advocaat, bedoeld in deze wet.

      4 De advocaat is tot geheimhouding verplicht van hetgeen in de uitoefening van zijn taak op grond van deze wet aan
      hem is toevertrouwd, tenzij enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak
      tot mededeling voortvloeit. De advocaat kan zich op grond van zijn geheimhoudingsplicht verschonen van het geven
      van getuigenis of het beantwoorden van vragen in een klachtprocedure of rechterlijke procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel77
