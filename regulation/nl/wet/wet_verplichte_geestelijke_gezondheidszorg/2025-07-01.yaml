  - number: 6:6
    text: |-
      1 De zorgmachtiging vervalt, indien:

      a. de geldigheidsduur is verstreken;

      b. de beslissing van de geneesheer-directeur, bedoeld in [artikel 8:18][ref1], tot beëindiging van het verlenen van
      alle vormen van verplichte zorg op grond van een zorgmachtiging, zonder dat daaraan voorwaarden of beperkingen zijn
      verbonden, onherroepelijk is geworden;

      c. de rechter op grond van een verzoekschrift van de officier van justitie als bedoeld in
      [artikel 8:19, derde lid][ref2], heeft beslist tot beëindiging van het verlenen van alle vormen van verplichte zorg
      op grond van een zorgmachtiging, zonder dat daaraan voorwaarden of beperkingen zijn verbonden;

      d. een nieuwe zorgmachtiging ten uitvoer wordt gelegd.

      2 Indien de officier van justitie voordat de geldigheidsduur, bedoeld in [artikel 6:5, onderdeel a][ref3], is
      verstreken, dan wel uiterlijk vier weken voordat de geldigheidsduur, bedoeld in artikel 6:5, onderdelen b en
      c, is verstreken, een nieuw verzoek voor een zorgmachtiging heeft ingediend, vervalt de eerdere zorgmachtiging
      in afwijking van het eerste lid, onderdeel a, als de rechter op het verzoekschrift heeft beslist of door het
      verstrijken van de termijn, bedoeld in [artikel 6:2, eerste lid, onderdeel e][ref4]. onderscheidenlijk, zodra de
      rechter onder toepassing van artikel 6:2, vierde lid, op het verzoekschrift heeft beslist.


