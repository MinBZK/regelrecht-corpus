    text: |-
      Het openbaar ministerie zorgt, ten behoeve van de uitvoering van de taak van de officier van justitie, bedoeld in
      deze wet, voor het beschikbaar zijn van de volgende gegevens:

      a. machtigingen tot voortzetting van de inbewaringstelling en rechterlijke machtigingen als afgegeven op grond van
      de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1];

      b. crisismaatregelen;

      c. machtigingen tot voorzetting van de crisismaatregel;

      d. zorgmachtigingen;

      e. in voorbereiding zijnde of afgewezen verzoekschriften voor een machtiging tot voorzetting van de
      crisismaatregel;

      f. in voorbereiding zijnde of afgewezen verzoekschriften voor een zorgmachtiging;

      g. in voorbereiding zijnde of afgewezen verzoekschriften als bedoeld in
      [artikel 28a van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref2];

      h. de aanvragen voor de voorbereiding van een zorgmachtiging, bedoeld in [artikel 5:3][ref3];

      i. medische verklaringen als bedoeld in [artikel 5:8][ref4], [7:1][ref5], [7:11][ref6], [8:18][ref7] en
      [8:19][ref8];

      j. bevindingen van de geneesheer-directeur als bedoeld in [artikel 5:15][ref9];

      k. beslissingen op grond van de [artikelen 8:18][ref10] en [8:19][ref11];

      l. zelfbindingsverklaringen.


