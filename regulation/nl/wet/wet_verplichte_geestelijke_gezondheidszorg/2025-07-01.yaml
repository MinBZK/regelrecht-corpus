  - number: 8:1
    text: |-
      1 De officier van justitie gaat onverwijld, doch uiterlijk binnen twee weken na afgifte door de rechter, over tot
      tenuitvoerlegging van de zorgmachtiging.

      2 De burgemeester gaat binnen 24 uur na afgifte over tot tenuitvoerlegging van de crisismaatregel.

      3 De officier van justitie gaat onverwijld over tot tenuitvoerlegging van de machtiging tot voorzetting van de
      crisismaatregel.

      4 Zo nodig kan de burgemeester of de officier van justitie bij de tenuitvoerlegging van de crisismaatregel,
      de machtiging tot voorzetting van de crisismaatregel onderscheidenlijk de zorgmachtiging, de hulp inroepen van
      zorgverleners met kennis van en ervaring met het verlenen van zorg en verplichte zorg.

      5 Zo nodig kan de burgemeester of de officier van justitie bij de tenuitvoerlegging van de crisismaatregel,
      de machtiging tot voorzetting van de crisismaatregel onderscheidenlijk de zorgmachtiging de hulp inroepen van
      ambtenaren van politie. De burgemeester kan deze bevoegdheid mandateren aan een of meer hulpofficieren van
      justitie.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel81
  - number: 8:2
    text: |-
      1 De personen, bedoeld in [artikel, 8:1, derde, vierde en vijfde lid][ref1], kunnen, uitsluitend voor zover dat
      redelijkerwijs nodig is voor de tenuitvoerlegging van de crisismaatregel, de machtiging tot voorzetting van de
      crisismaatregel of de zorgmachtiging:

      a. elke plaats betreden waar de betrokkene zich bevindt;

      b. voorwerpen ontnemen die een gevaar voor de veiligheid van betrokkene of voor anderen kunnen opleveren en hem
      daartoe aan de kleding of het lichaam onderzoeken.

      2 De ambtenaren van politie, bedoeld in [artikel 8:1, vijfde lid][ref2], kunnen, uitsluitend voor zover dat
      redelijkerwijs nodig is voor de tenuitvoerlegging van de crisismaatregel, de machtiging tot voorzetting van de
      crisismaatregel of de zorgmachtiging de woning van betrokkene zonder zijn toestemming binnentreden.

      3 De ontnomen voorwerpen worden voor betrokkene bewaard, voor zover dit niet in strijd is met enig wettelijk
      voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel81
