  - number: 8:14
    text: |-
      1 De zorgverantwoordelijke kan bij het gegronde vermoeden van aanwezigheid binnen de accommodatie van voorwerpen
      die betrokkene niet in zijn bezit mag hebben of die ernstig nadeel veroorzaken, ter voorkoming van een
      noodsituatie, een beslissing nemen tot onderzoek:

      a. aan kleding of lichaam van betrokkene,

      b. van de woonruimte binnen de accommodatie van betrokkene, dan wel

      c. van poststukken afkomstig van of bestemd voor betrokkene die in een accommodatie verblijft, maar alleen in
      aanwezigheid van betrokkene.

      2 De ontnomen voorwerpen worden voor betrokkene bewaard, voor zover dit niet in strijd is met enig wettelijk
      voorschrift.

      3 De zorgverantwoordelijke stelt de beslissing op schrift, voorziet de beslissing van een schriftelijke motivering
      en stelt de geneesheer-directeur op de hoogte van de beslissing.

      4 De geneesheer-directeur geeft betrokkene, de vertegenwoordiger en de advocaat een afschrift van de beslissing
      en stelt hen schriftelijk in kennis van de klachtwaardigheid van de beslissing en de mogelijkheid van advies en
      bijstand door de patiëntenvertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel814
  - number: 8:15
    text: |-
      1 De zorgaanbieder stelt huisregels op voor de ordelijke gang van zaken en de veiligheid, passend bij de doelgroep,
      in de accommodatie.

      2 De huisregels bevatten geen andere regels dan bedoeld in het eerste lid en worden, indien van toepassing,
      vastgesteld volgens het model, bedoeld in het vijfde lid.

      3 De zorgaanbieder stelt aan betrokkene en de vertegenwoordiger zo spoedig mogelijk na diens opname in een
      accommodatie een schriftelijk overzicht van de in de accommodatie geldende huisregels ter hand.

      4 De zorgverantwoordelijke zorgt ervoor dat betrokkene en de vertegenwoordiger een mondelinge toelichting op de
      huisregels ontvangen.

      5 Bij regeling van Onze Minister kan een model voor huisregels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel815
  - number: 8:16
    text: |-
      1 De geneesheer-directeur kan op aanvraag of ambtshalve de verantwoordelijkheid voor het verlenen van zorg op
      grond van een crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging aan een andere
      zorgaanbieder, geneesheer-directeur of zorgverantwoordelijke toewijzen. Betrokkene, de vertegenwoordiger, de
      advocaat of de zorgverantwoordelijke kunnen bij de geneesheer-directeur daartoe een schriftelijke en gemotiveerde
      aanvraag indienen.

      2 De geneesheer-directeur deelt zijn beslissing op grond van het eerste lid schriftelijk en gemotiveerd aan
      betrokkene mee en zendt een afschrift van de beslissing aan de vertegenwoordiger, de advocaat en de officier van
      justitie.

      3 De geneesheer-directeur kan geen ambtshalve beslissing of instemmende beslissing nemen op de aanvraag dan
      nadat de beoogde zorgaanbieder, geneesheer-directeur of zorgverantwoordelijke zich bereid hebben verklaard tot
      het verlenen van zorg of verplichte zorg op grond van een crisismaatregel, machtiging tot voorzetting van de
      crisismaatregel of zorgmachtiging.

      4 Indien de geneesheer-directeur ambtshalve een beslissing neemt of instemt met de aanvraag zendt hij een afschrift
      van de beslissing aan de:

      a. betrokken zorgaanbieders,

      b. zorgverantwoordelijke,

      c. vertegenwoordiger,

      d. advocaat,

      e. officier van justitie,

      f. griffie van de rechtbank, indien een machtiging tot verlenging van de crisismaatregel of zorgmachtiging voor
      betrokkene is afgegeven,

      g. burgemeester, indien een crisismaatregel is genomen, en

      h. inspectie.

      5 De geneesheer-directeur stelt betrokkene, de vertegenwoordiger en de advocaat schriftelijk in kennis van de
      klachtwaardigheid van de beslissing en de mogelijkheid van advies en bijstand door de patiëntenvertrouwenspersoon
      en de familievertrouwenspersoon.

      6 Indien de geneesheer-directeur een ambtshalve of instemmende beslissing neemt als bedoeld in het eerste lid tot
      toewijzing van een andere zorgverantwoordelijke, draagt de eerder aangewezen zorgverantwoordelijke ervoor zorg dat
      het dossier, bedoeld in [artikel 8:4][ref1], ter beschikking komt van de nieuw aangewezen zorgverantwoordelijke.
      Indien de geneesheer-directeur een ambtshalve of instemmende beslissing neemt als bedoeld in het eerste lid tot
      toewijzing van een andere zorgaanbieder, draagt de eerder aangewezen zorgaanbieder ervoor zorg dat de gegevens,
      bedoeld in [artikel 8:24, eerste lid][ref2], ter beschikking komen van de nieuw aangewezen zorgaanbieder.

      7 In de situatie, bedoeld in het zesde lid, tweede volzin, informeert de nieuw aangewezen zorgaanbieder zo spoedig
      mogelijk de eerder aangewezen zorgaanbieder indien de verplichte zorg op grond van een crisismaatregel, machtiging
      tot voorzetting van de crisismaatregel of zorgmachtiging wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel824
