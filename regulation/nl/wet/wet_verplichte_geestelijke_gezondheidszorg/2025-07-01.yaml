  - number: 8:10
    text: |-
      De zorgaanbieder, de geneesheer-directeur en de zorgverantwoordelijke kunnen bij de uitvoering van de
      crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging zo nodig de hulp inroepen van
      personen met kennis en ervaring met het verlenen van zorg en verplichte zorg en van ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel810
  - number: 8:11
    text: |-
      De zorgverantwoordelijke kan, indien er sprake is van verzet als bedoeld in [artikel 1:4][ref1] beslissen tot het
      verlenen van verplichte zorg waar de crisismaatregel, de machtiging tot voortzetting van de crisismaatregel of de
      zorgmachtiging niet in voorziet, voor zover dit tijdelijk ter afwending van een noodsituatie noodzakelijk is, gelet
      op:

      a. ernstig nadeel,

      b. de veiligheid binnen de accommodatie of andere locatie waar de zorg of verplichte zorg wordt verleend,

      c. de bescherming van rechten en vrijheden van anderen, of

      d. de voorkoming van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel14
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel811
