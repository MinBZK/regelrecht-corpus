      1 Verplichte zorg op grond van [artikel 3:1, onderdelen a, b en c][ref1], anders dan die in een accommodatie
      aan een betrokkene wordt verleend, omvat uitsluitend de bij algemene maatregel van bestuur aangewezen vormen van
      verplichte zorg als bedoeld in [artikel 3:2, tweede lid, onderdelen a tot en met i][ref2], toegepast onder de bij
