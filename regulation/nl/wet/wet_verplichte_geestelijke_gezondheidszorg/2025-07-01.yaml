  - number: 5:3
    text: |-
      De officier van justitie kan ambtshalve of op aanvraag van het college van burgemeester en wethouders, een
      geneesheer-directeur, een persoon die op beroepsmatige basis zorg verleent aan betrokkene, een zorgaanbieder als
      bedoeld in [artikel 1.1, onderdeel p, van de Wet forensische zorg][ref1] of een ambtenaar van de politie, besluiten
      een verzoekschrift voor een zorgmachtiging voor te bereiden.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '1.1'
  - number: 5:4
    text: |-
      1 Zodra de officier van justitie ambtshalve of op aanvraag met de voorbereiding van een verzoekschrift voor een
      zorgmachtiging begint:

      a. wijst hij een geneesheer-directeur aan,

      b. informeert hij de geneesheer-directeur ten behoeve van diens taak op grond van dit hoofdstuk, en verstrekt
      hij aan hem de zelfbindingsverklaring, voor zover aanwezig, en gegevens over een voor betrokkene eerder afgegeven
      machtiging tot voortzetting van de inbewaringstelling of rechterlijke machtiging als afgegeven op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], crisismaatregel, machtiging tot voortzetting van
      de crisismaatregel of zorgmachtiging,

      c. gaat hij na of er politiegegevens als bedoeld in de [Wet politiegegevens][ref2] of strafvorderlijke en
      justitiële gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref3] zijn over betrokkene die
      relevant kunnen zijn voor de beoordeling van het ernstig nadeel en de te leveren zorg en verstrekt hij die gegevens
      aan de geneesheer-directeur, tenzij het belang van enig strafrechtelijk onderzoek zich daartegen verzet, en

      d. verstrekt hij, indien betrokkene geen advocaat heeft, de persoonsgegevens van betrokkene aan de rechter, ten
      behoeve van de last tot toevoeging, bedoeld in [artikel 1:7][ref4].

      2 Zodra de geneesheer-directeur door de officier is aangewezen:

      a. informeert de geneesheer-directeur betrokkene, de vertegenwoordiger, de advocaat en de aanvrager, bedoeld
      in [artikel 5:3][ref5], schriftelijk, dat op aanvraag of ambtshalve een verzoek voor een zorgmachtiging wordt
      voorbereid,

      b. verstrekt de geneesheer-directeur de persoonsgegevens van betrokkene aan de patiëntenvertrouwenspersoon,
      met als doel betrokkene te kunnen informeren over de mogelijkheid tot advies en bijstand door een
      patiëntenvertrouwenspersoon, voor zover betrokkene daarmee instemt,

      c. informeert de geneesheer-directeur betrokkene over de mogelijkheid om zich bij te laten staan door een
      familielid of naaste bij het opstellen van de zelfbindingsverklaring, het plan, bedoeld in [artikel 5:5][ref6], de
      zorgkaart en het zorgplan, en

      d. informeert de geneesheer-directeur betrokkene en de vertegenwoordiger schriftelijk over de mogelijkheid van
      advies en bijstand aan betrokkene door een patiëntenvertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0022463
      [ref3]: https://wetten.overheid.nl/BWBR0014194
      [ref4]: https://wetten.overheid.nl/BWBR0040635#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0040635#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0040635#Artikel55
