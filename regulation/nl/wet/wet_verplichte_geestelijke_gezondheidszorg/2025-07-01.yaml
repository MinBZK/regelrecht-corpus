  - number: 7:11
    text: |-
      1 De officier van justitie kan een verzoekschrift indienen bij de rechter voor een zorgmachtiging die aansluit op
      een machtiging tot voorzetting van de crisismaatregel.

      2 Het verzoekschrift wordt schriftelijk en gemotiveerd ingediend.

      3 Voordat de officier van justitie een verzoekschrift indient, zorgt hij ervoor dat de geneesheer-directeur:

      a. betrokkene en de vertegenwoordiger schriftelijk informeert over de mogelijkheid van advies en bijstand aan
      betrokkene door een patiëntenvertrouwenspersoon, en

      b. de persoonsgegevens van betrokkene aan de patiëntenvertrouwenspersoon verstrekt, met als doel betrokkene te
      kunnen informeren over de mogelijkheid tot advies en bijstand door een patiëntenvertrouwenspersoon, voor zover
      betrokkene daarmee instemt.

      4 Bij het verzoekschrift voegt de officier van justitie een medische
      verklaring als bedoeld in [artikel 5:8][ref1] en de gegevens, bedoeld in
      [artikel 5:17, tweede lid, derde lid, met uitzondering van onderdeel d, vierde lid, en zesde lid][ref2].
      De officier van justitie verstrekt op aanvraag van de psychiater aan hem de politiegegevens als bedoeld
      in de [Wet politiegegevens][ref3] en de strafvorderlijke en justitiële gegevens als bedoeld in de
      [Wet justitiële en strafvorderlijke gegevens][ref4] die relevant kunnen zijn voor de beoordeling van het
      ernstig nadeel. Verstrekking door de officier van justitie kan achterwege blijven indien het belang van enig
      strafrechtelijk onderzoek zich daartegen verzet.

      5 Gelijktijdig met het indienen van het verzoekschrift deelt de officier van justitie zijn schriftelijke en
      gemotiveerde beslissing of voldaan is aan de criteria voor verplichte zorg zo spoedig mogelijk mee aan betrokkene,
      de vertegenwoordiger, de advocaat en de geneesheer-directeur.

      6 De bepalingen uit [hoofdstuk 5][ref5] zijn van overeenkomstige toepassing, behoudens de
      [artikelen 5:1 tot en met 5:6][ref6], [5:10][ref7], [5:11][ref8], [5:16 tot en met 5:19][ref9].


