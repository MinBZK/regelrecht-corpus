      1 De zorgaanbieder is aangesloten bij een door één of meer representatief te achten cliëntenorganisaties en één
      of meer representatief te achten organisaties van zorgaanbieders ingestelde klachtencommissie die bestaat uit
      een oneven aantal van ten minste drie leden die niet werkzaam zijn bij of voor de zorgaanbieder en die zodanig is
      samengesteld dat een deskundige en zorgvuldige beslissing op de klacht is gewaarborgd.

      2 De klachtencommissie beslist, in afwijking van
      [hoofdstuk 3 van de Wet kwaliteit, klachten en geschillen zorg][ref1], op klachten als bedoeld in
      [artikel 10:3][ref2].


