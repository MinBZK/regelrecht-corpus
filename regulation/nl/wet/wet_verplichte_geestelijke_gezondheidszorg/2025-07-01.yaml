      1 Onverminderd andere verplichtingen tot het verstrekken van gegevens die voortvloeien uit deze wet, verstrekken
      de geneesheer-directeur, de zorgverantwoordelijke, de burgemeester, de politie en de officier van justitie elkaar
      gegevens voor zover dat strikt noodzakelijk is ter voorkoming of beperking van ernstig nadeel, en dit hoort bij de
      uitoefening van ieders taak op grond van deze wet.

      2 De geneesheer-directeur, de burgemeester, de politie en de officier van justitie stellen de zorgverantwoordelijke
      ten behoeve van diens taak op grond van [artikel 8:4, tweede lid][ref1], op de hoogte indien zij op grond van het
      eerste lid gegevens over betrokkene uitwisselen zonder diens toestemming.


