  - number: 5:8
    text: |-
      1 De geneesheer-directeur zorgt voor een medische verklaring van een psychiater, indien van toepassing volgens
      het vastgestelde model, bedoeld in het tweede lid, over de actuele gezondheidstoestand van betrokkene en of uit
      het gedrag van betrokkene als gevolg van zijn psychische stoornis ernstig nadeel voortvloeit ten behoeve van de
      voorbereiding van een verzoekschrift voor een zorgmachtiging aan de rechter.

      2 Bij regeling van Onze Minister kan een model voor een medische verklaring worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel58
  - number: 5:9
    text: |-
      1 De geneesheer-directeur draagt ervoor zorg dat de psychiater in de medische verklaring in elk geval zijn
      bevindingen vermeldt inzake:

      a. de symptomen die betrokkene vertoont en een diagnose of voorlopige diagnose van de psychische stoornis van
      betrokkene;

      b. de relatie tussen de psychische stoornis en het gedrag dat tot het ernstig nadeel leidt;

      c. de zorg die noodzakelijk is om het ernstig nadeel weg te nemen.

      2 De geneesheer-directeur draagt ervoor zorg dat de psychiater de zelfbindingsverklaring, voor zover aanwezig,
      verkrijgt, alsmede zo mogelijk overleg pleegt met de zorgverantwoordelijke of de huisarts.

      3 Indien de medische verklaring dient ter beoordeling van het plan, bedoeld in [artikel 5:5][ref1], draagt de
      geneesheer-directeur ervoor zorg dat de beoordeling van het zorgplan later plaatsvindt indien de voorbereiding van
      een verzoekschrift voor een zorgmachtiging niet wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel55
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel59
    references:
      - id: ref1
