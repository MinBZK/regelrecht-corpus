  - number: 8:27a
    text: |-
      1 Indien op grond van [artikel 8.27, eerste lid, onderdeel c][ref1], om inzage in of afschrift van gegevens
      uit het dossier van een overleden betrokkene wordt gevraagd vanwege een vermoeden van een medische fout
      en de zorgverantwoordelijke de gevraagde inzage of het gevraagde afschrift niet verstrekt, verstrekt de
      zorgverantwoordelijke op verzoek van degene die om de inzage of het afschrift heeft gevraagd inzage in of afschrift
      van de gegevens aan een door de verzoeker aangewezen onafhankelijke arts.

      2 De arts, bedoeld in het eerste lid, beoordeelt of het niet verstrekken van de inzage of het afschrift
      gerechtvaardigd is. Indien de arts van oordeel is dat het niet verstrekken niet gerechtvaardigd is, verstrekt de
      zorgverantwoordelijke alsnog inzage of afschrift aan de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel827
