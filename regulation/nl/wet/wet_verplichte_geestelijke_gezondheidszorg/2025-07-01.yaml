  - number: 6:1
    text: |-
      1 De rechter hoort betrokkene na ontvangst van het verzoekschrift voor een zorgmachtiging, tenzij de
      rechter vaststelt dat betrokkene niet in staat is of niet bereid is zich te doen horen. De rechter stelt de
      vertegenwoordiger en de advocaat in de gelegenheid om hun zienswijze mondeling kenbaar te maken.

      2 Indien betrokkene in Nederland verblijft en van hem redelijkerwijs niet kan worden gevergd dat hij in een door
      de rechtbank bepaalde locatie wordt gehoord, begeeft de rechter zich daartoe, vergezeld door de griffier, naar de
      woon- of verblijfplaats van betrokkene.

      3 Indien betrokkene in een accommodatie verblijft, wordt de rechter, vergezeld van de griffier, door de
      zorgaanbieder in de gelegenheid gesteld hem aldaar te horen. Indien betrokkene niet in Nederland verblijft, wordt
      de behandeling van het verzoek door de rechtbank aangehouden totdat betrokkene in Nederland kan worden gehoord.

      4 De officier van justitie is aanwezig op de zitting bij de rechter tenzij evident is dat een nadere toelichting of
      motivering van het verzoek door de officier van justitie niet nodig is.

      5 De rechter kan onderzoek door deskundigen bevelen en is bevoegd deze of andere deskundigen alsmede getuigen op
      te roepen. De rechter roept de door betrokkene opgegeven deskundigen en getuigen op, tenzij hij van oordeel is dat
      redelijkerwijs valt aan te nemen dat betrokkene door het achterwege blijven daarvan niet in zijn belangen wordt
      geschaad. Indien hij een opgegeven deskundige of getuige niet heeft opgeroepen, vermeldt hij de reden daarvan in
      de uitspraak.

      6 De rechter kan verplichten te verschijnen:

      a. de officier van justitie;

      b. de geneesheer-directeur;

      c. de vertegenwoordiger;

      d. de psychiater die de medische verklaring heeft opgesteld;

      e. de zorgaanbieder of de zorgverantwoordelijke;

      f. een ambtenaar van politie die bekend is met betrokkene;

      g. de gezinsvoogdijwerker.

      7 Indien de rechter zich laat voorlichten in afwezigheid van betrokkene, wordt de zakelijke inhoud van de
      verstrekte inlichtingen aan betrokkene medegedeeld.

      8 Betrokkene en de advocaat worden in de gelegenheid gesteld hun zienswijze kenbaar te maken naar aanleiding van
      de mededelingen en verklaringen van de personen, bedoeld in het vijfde lid, of die van andere personen die door de
      rechter zijn verzocht om informatie te verschaffen.

      9 Kosten van door de rechter opgeroepen getuigen en deskundigen komen ten laste van de Staat. Bij algemene
      maatregel van bestuur kunnen nadere regels worden gesteld over de vergoeding van kosten.

      10 In aanvulling op hetgeen uit deze wet voortvloeit, zijn de regels inzake de verzoekprocedure
      uit het [Wetboek van Burgerlijke Rechtsvordering][ref1] van overeenkomstige toepassing.
      [Artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] is niet van toepassing op de
      verzoekprocedure, bedoeld in deze wet, en zaken betreffende [hoofdstuk 5, paragraaf 6][ref3]. In zaken betreffende
      hoofdstuk 5, paragraaf 6, is in afwijking van het bepaalde in het [Wetboek van Burgerlijke Rechtsvordering][ref4],
      [artikel 269 van het Wetboek van Strafvordering][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
