  - number: 6:2
    text: |-
      1 De rechter doet zo spoedig mogelijk uitspraak, maar uiterlijk:

      a. drie weken na ontvangst van een verzoekschrift voor een zorgmachtiging als bedoeld in
      [artikel 5:17, eerste lid][ref1], en [artikel 5:18, derde lid][ref2];

      b. drie weken na ontvangst van een verzoekschrift voor een zorgmachtiging als bedoeld in
      [artikel 7:11, eerste lid][ref3];

      c. drie weken na ontvangst van een vordering van het openbaar ministerie als bedoeld in
      [artikel 2.3, eerste lid, aanhef en onder 5, van de Wet forensische zorg][ref4];

      d. drie werkdagen na ontvangst van een verzoekschrift voor een zorgmachtiging als bedoeld in de
      [artikelen 5:17, vijfde lid][ref5], en [8:12, vijfde lid][ref6];

      e. drie weken na ontvangst van een nieuw verzoekschrift voor een zorgmachtiging als bedoeld in
      [artikel 6:6, tweede lid][ref7].

      2 De termijn, bedoeld in het eerste lid, wordt indien deze eindigt op een zaterdag, zondag of erkende feestdag,
      indien noodzakelijk, verlengd tot en met de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende
      feestdag als bedoeld in de [Algemene termijnenwet][ref8] is.

      3 Indien de rechter betrokkene in de gelegenheid stelt zelf een plan van aanpak als bedoeld in [artikel 5:5][ref9]
      op te stellen wordt de termijn, bedoeld in het eerste lid, onder a, opgeschort met ten hoogste twee weken. Artikel
      5:5, zesde en zevende lid, en [artikel 5:8][ref10] zijn van overeenkomstige toepassing.

      4 Indien de rechter toepassing geeft aan het bepaalde in [artikel 6:1, vijfde lid][ref11], kan de termijn, bedoeld
      in het eerste lid, onderdelen a, b, c of e, met drie weken worden verlengd.

      5 Dit artikel is niet van toepassing indien de rechter in zaken betreffende
      [hoofdstuk 5, paragraaf 6][ref12], bij de beschikking inzake het verlenen van een zorgmachtiging, een in
      [artikel 2.3, eerste lid, aanhef en onder 1, 2, 3, 4, 6, 7, 8, 9, 10 of 11, van de Wet forensische zorg][ref13]
      opgenomen beslissing neemt.


