  - number: 10:13
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit hoofdstuk en daarbij de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde
      van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht
      tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit
      zijn taak bij de uitvoering van dit hoofdstuk de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel1013
  - number: 11:1
    text: |-
      1 Er is een patiëntenvertrouwenspersoon die tot taak heeft advies en bijstand te verlenen aan een persoon voor
      wie een verzoek voor een zorgmachtiging of een crisismaatregel wordt voorbereid of voor wie een zorgmachtiging is
      afgegeven of crisismaatregel is genomen, bij:

      a. het opstellen van een zelfbindingsverklaring of het opstellen, evalueren en actualiseren van een zorgkaart of
      zorgplan;

      b. de voorbereiding van een crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging;

      c. de uitvoering van een crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging;

      d. de beëindiging van een crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging;

      e. de uitvoering van [hoofdstuk 9, paragraaf 1][ref1],

      f. een klachtprocedure;

      g. vragen of klachten over de uitvoering van de zorg.

      2 De patiëntenvertrouwenspersoon verleent advies en bijstand ten aanzien van de uitoefening van de rechten van
      betrokkene.

      3 De patiëntenvertrouwenspersoon heeft tevens tot taak:

      a. tekortkomingen in de structuur en uitvoering van de zorg en de uitvoering van [hoofdstuk 9, paragraaf 1][ref2],
      voor zover deze afbreuk doen aan de rechten van betrokkene, te signaleren en aan de inspectie te melden;

      b. advies en bijstand te verlenen aan personen met een psychische stoornis die vrijwillig in een accommodatie
      verblijven.

      4 De patiëntenvertrouwenspersoon verricht zijn werkzaamheden onafhankelijk van de zorgaanbieder, de geneesheer-
      directeur en de zorgverantwoordelijke.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:

      a. de deskundigheid van de patiëntenvertrouwenspersoon;

      b. de onafhankelijkheid van de patiëntenvertrouwenspersoon ten opzichte van de zorgaanbieder;

      c. de taken en bevoegdheden van de patiëntenvertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Hoofdstuk9
