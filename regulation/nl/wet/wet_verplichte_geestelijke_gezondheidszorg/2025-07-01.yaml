        artikel: 5:5
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5:10
    text: |-
      De geneesheer-directeur verstrekt de op grond van [artikel 5:4, eerste lid, onderdelen b en c][ref1], verkregen
      gegevens aan de psychiater ten behoeve van het opstellen van de medische verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel54
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel510
    references:
      - id: ref1
        bwb_id: BWBR0040635
        artikel: 5:4
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5:11
    text: |-
      1 De geneesheer-directeur verstrekt de medische verklaring aan de officier van justitie.

      2 De officier van justitie kan besluiten de voorbereiding van een verzoekschrift voor een zorgmachtiging te
      beëindigen, indien uit de medische verklaring blijkt dat:

      a. er geen sprake is van een psychische stoornis,

      b. het gedrag dat voortvloeit uit de psychische stoornis niet tot een ernstig nadeel leidt, of

      c. verplichte zorg niet noodzakelijk is om het ernstig nadeel weg te nemen.

      3 De officier van justitie deelt zijn schriftelijke en gemotiveerde beslissing mee aan de aanvrager, bedoeld in
      [artikel 5:3][ref1], betrokkene, de vertegenwoordiger, de advocaat en de zorgverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel53
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel511
