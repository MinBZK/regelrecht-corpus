  - number: 5:5
    text: |-
      1 Indien betrokkene of de vertegenwoordiger de geneesheer-directeur binnen drie dagen na ontvangst van de
      informatie, bedoeld in [artikel 5:4, tweede lid, onderdeel a][ref1], schriftelijk te kennen geeft met familie
      of naasten zelf een plan van aanpak te willen opstellen om verplichte zorg te voorkomen, besluit de geneesheer-
      directeur na overleg met de officier van justitie zo spoedig mogelijk, maar uiterlijk binnen twee dagen na de
      kennisgeving, of de voorbereiding van een verzoekschrift voor een zorgmachtiging wordt geschorst om betrokkene in
      de gelegenheid te stellen een plan van aanpak op te stellen.

      2 De geneesheer-directeur kan alleen afwijzend besluiten indien:

      a. hij van oordeel is dat het ernstig nadeel zich niet verdraagt met uitstel van de voorbereiding van een
      zorgmachtiging,

      b. betrokkene eerder in staat is gesteld zelf een plan van aanpak op te stellen en dat niet is gelukt, of

      c. betrokkene eerder een plan van aanpak heeft opgesteld, maar daarmee verplichte zorg niet kon worden voorkomen en
      de feiten en omstandigheden sindsdien niet zodanig zijn veranderd dat de kans redelijkerwijs aanwezig moet worden
      geacht dat betrokkene nu wel in staat zal zijn een plan van aanpak op te stellen waarmee verplichte zorg kan worden
      voorkomen.

      3 Voordat de geneesheer-directeur besluit, stelt hij betrokkene en de vertegenwoordiger in de gelegenheid om te
      worden gehoord.

      4 De geneesheer-directeur stelt betrokkene, de vertegenwoordiger en de aanvrager, bedoeld in [artikel 5:3][ref2],
      schriftelijk op de hoogte van zijn besluit. Indien hij afwijzend besluit, deelt hij aan betrokkene en de
      vertegenwoordiger tevens schriftelijk zijn beweegredenen mee.

      5 Indien de geneesheer-directeur na overleg met de officier van justitie besluit om betrokkene in de gelegenheid
      te stellen een plan van aanpak op te stellen, duurt de schorsing, bedoeld in het eerste lid, twee weken vanaf het
      moment waarop de geneesheer-directeur zijn besluit heeft meegedeeld op grond van het vierde lid, eerste volzin.

      6 Indien de geneesheer-directeur van oordeel is dat onvoldoende voortgang wordt gemaakt met het opstellen van een
      plan van aanpak, dan wel het ernstig nadeel zich niet langer verdraagt met verder uitstel van de voorbereiding
      van een zorgmachtiging, kan de geneesheer-directeur na overleg met de officier van justitie besluiten nog voor het
      einde van de periode, bedoeld in het vijfde lid, de voorbereiding van een verzoekschrift voor een zorgmachtiging
      te hervatten.

      7 De geneesheer-directeur neemt het besluit, bedoeld in het zesde lid, niet dan na overleg met betrokkene en de
      vertegenwoordiger. De geneesheer-directeur stelt betrokkene en de vertegenwoordiger schriftelijk en gemotiveerd op
      de hoogte van een dergelijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel53
