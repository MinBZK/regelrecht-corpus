    text: |-
      1 De zorgaanbieder die verplichte zorg verleent, verstrekt Onze Minister, ter opneming in een openbaar register,
      een opgave van de:

      a. naam of een andere aanduiding van de locatie, alsmede het adres en het vestigingsnummer als bedoeld in de
      [Handelsregisterwet 2007][ref1] ervan;

      b. aanduiding of de locatie een accommodatie is;

      c. naam, het adres, de rechtsvorm en het Handelsregisternummer van de zorgaanbieder;

      d. vormen van verplichte zorg die worden verleend.

      2 De verplichtingen, bedoeld in het eerste lid, gelden niet ten aanzien van een zorgaanbieder die
      uitsluitend verplichte zorg verleent ter uitvoering van een crisismaatregel, machtiging tot voortzetting
      van de crisismaatregel of zorgmachtiging waarvoor een andere zorgaanbieder op grond van [artikel 8:7][ref2]
      verantwoordelijk is of een rijksinstelling voor de verlening van forensische zorg als bedoeld in
      [artikel 1, eerste lid, onderdeel j, van de Wet forensische zorg][ref3].

      3 De zorgaanbieder draagt zorg voor de naleving van bouwkundige eisen die bij algemene maatregel van
      bestuur kunnen worden gesteld aan de accommodatie, tenzij deze behoort tot een instelling als bedoeld in de
      [Wet forensische zorg][ref4].


