      1 Ten aanzien van betrokkene die een zelfbindingsverklaring heeft, wordt voor de in de verklaring voorziene duur de
      in de verklaring voorziene behandeling in het zorgplan opgenomen.

      2 Onverminderd [artikel 9:6, eerste lid, onderdeel b][ref1], kan met betrekking tot betrokkene die zich met
      een verklaring als bedoeld in het eerste lid heeft verbonden, de in de verklaring voorziene behandeling worden
      toegepast, ook indien de patiënt zich daartegen verzet.


