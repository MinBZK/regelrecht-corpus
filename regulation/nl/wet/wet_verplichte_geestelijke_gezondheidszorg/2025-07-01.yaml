  - number: 7:7
    text: |-
      1 Indien de officier van justitie na ontvangst van de in [artikel 7:2][ref1], tweede lid, bedoelde bescheiden
      van oordeel is dat ten aanzien van betrokkene de grondslag voor het nemen van een crisismaatregel, bedoeld in
      [artikel 7:1, eerste lid][ref2], aanwezig is, dient hij uiterlijk op de dag na de datum van ontvangst van deze
      stukken die niet een zaterdag, zondag of algemeen erkende feestdag als bedoeld in de [Algemene termijnenwet][ref3]
      is, bij de rechter een verzoekschrift in voor een machtiging tot voorzetting van de crisismaatregel voor
      betrokkene.

      2 De officier van justitie voegt bij het verzoekschrift voor een machtiging tot voorzetting van de crisismaatregel
      de bescheiden, bedoeld in [artikel 7:2, tweede lid][ref4]. [Artikel 5:17, zesde lid][ref5], is van overeenkomstige
      toepassing.


