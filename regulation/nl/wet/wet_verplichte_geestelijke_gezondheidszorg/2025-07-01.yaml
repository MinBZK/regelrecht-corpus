  - number: 10:9
    text: |-
      1 De rechter kan de beslissing waartegen de klacht is gericht, schorsen.

      2 De rechter beslist binnen vier weken na indiening van het verzoekschrift.

      3 Tegen de beslissing van de rechter staat geen hoger beroep open.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel109
  - number: 10:10
    text: |-
      1 De beslissing van de rechter strekt tot:

      a. onbevoegdverklaring van de rechter,

      b. niet-ontvankelijkverklaring van het verzoek,

      c. ongegrondverklaring van de klacht, of

      d. gegrondverklaring van de klacht.

      2 Indien de rechter de klacht tegen een beslissing gegrond verklaart, vernietigt hij de bestreden beslissing geheel
      of gedeeltelijk. Gehele of gedeeltelijke vernietiging van de beslissing brengt vernietiging van de rechtsgevolgen
      van de beslissing of het vernietigde gedeelte van de beslissing mee.

      3 Indien de rechter de klacht gegrond verklaart, kan hij een opdracht geven tot het nemen van een nieuwe
      beslissing, het verrichten van een andere handeling met inachtneming van zijn uitspraak, dan wel bepalen dat zijn
      uitspraak in de plaats treedt van het vernietigde besluit of het vernietigde gedeelte daarvan.

      4 De rechter kan de geneesheer-directeur of de zorgverantwoordelijke een termijn stellen voor het nemen van een
      nieuwe beslissing of het verrichten van een andere handeling.

      5 De rechter kan bepalen dat, indien of zolang niet wordt voldaan aan de beslissing van de
      rechter, de zorgaanbieder aan betrokkene een in de beslissing vast te stellen dwangsom verbeurt. De
      [artikelen 611a tot en met 611i van het Wetboek van Burgerlijke Rechtsvordering][ref1] zijn van overeenkomstige
      toepassing.

      6 De griffie zendt zo spoedig mogelijk een afschrift van de beslissing aan de klager, betrokkene, de
      vertegenwoordiger, de advocaat van betrokkene, de klachtencommissie, de geneesheer-directeur, de zorgaanbieder en
      de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611a
