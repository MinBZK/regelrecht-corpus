  - number: 3:2
    text: |-
      1 Zorg omvat de zorg van een zorgaanbieder jegens betrokkene die kan bestaan uit bejegening, verzorging,
      verpleging, behandeling, begeleiding, bescherming, beveiliging, en verplichte zorg als bedoeld in het tweede lid.

      2 Verplichte zorg bestaat uit het:

      a. toedienen van vocht, voeding en medicatie, alsmede het verrichten van medische controles of andere medische
      handelingen en therapeutische maatregelen, ter behandeling van een psychische stoornis, dan wel vanwege die
      stoornis, ter behandeling van een somatische aandoening;

      b. beperken van de bewegingsvrijheid;

      c. insluiten;

      d. uitoefenen van toezicht op betrokkene;

      e. onderzoek aan kleding of lichaam;

      f. onderzoek van de woon- of verblijfsruimte op gedrag-beïnvloedende middelen en gevaarlijke voorwerpen;

      g. controleren op de aanwezigheid van gedrag-beïnvloedende middelen;

      h. aanbrengen van beperkingen in de vrijheid het eigen leven in te richten, die tot gevolg hebben dat betrokkene
      iets moet doen of nalaten, waaronder het gebruik van communicatiemiddelen;

      i. beperken van het recht op het ontvangen van bezoek;

      j. opnemen in een accommodatie;

      k. ontnemen van de vrijheid van betrokkene door hem over te brengen naar een plaats die geschikt is voor tijdelijk
      verblijf als bedoeld in [artikel 7:3, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel73
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel32
