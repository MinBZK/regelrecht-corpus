  - number: 8:18
    text: |-
      1 De geneesheer-directeur neemt op een daartoe strekkende schriftelijke en gemotiveerde aanvraag van betrokkene,
      de vertegenwoordiger, de advocaat of de zorgverantwoordelijke, dan wel uit eigen beweging een beslissing tot
      beëindiging van het verlenen van verplichte zorg op grond van een crisismaatregel, machtiging tot voortzetting van
      de crisismaatregel of zorgmachtiging indien het doel van verplichte zorg is bereikt of niet langer wordt voldaan
      aan de criteria voor verplichte zorg.

      2 De geneesheer-directeur neemt niet eerder een beslissing over de beëindiging van de verplichte zorg op grond
      van een crisismaatregel of machtiging tot voortzetting van de crisismaatregel dan nadat hij zich ervan heeft
      vergewist dat er geen verzoek voor een machtiging tot voortzetting van de crisismaatregel onderscheidenlijk een
      zorgmachtiging is ingediend.

      3 Voor zover aan betrokkene verplichte zorg wordt verleend, houdende opname in een accommodatie, en betrokkene
      blijkens de eerder afgegeven medische verklaring ernstig nadeel voor een ander heeft veroorzaakt, neemt de
      geneesheer-directeur niet eerder een beslissing over beëindiging van de verplichte zorg op grond van een
      crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging dan nadat hij overleg
      heeft gevoerd met de burgemeester die de crisismaatregel heeft afgegeven, in geval van beëindiging van de
      crisismaatregel, of met de officier van justitie en het college van burgemeester en wethouders van de gemeente
      waar betrokkene ingezetene is dan wel naar verwachting zal verblijven, in geval van beëindiging van de machtiging
      tot voortzetting van de crisismaatregel of zorgmachtiging. Voorts neemt de geneesheer-directeur niet eerder een
      beslissing over beëindiging van de verplichte zorg op grond van een zorgmachtiging dan nadat hij zich door middel
      van een medische verklaring van een psychiater, indien van toepassing volgens het vastgestelde model, bedoeld
      in het veertiende lid, op de hoogte heeft gesteld van het oordeel van de psychiater over zijn voornemen om de
      verplichte zorg te beëindigen en over de actuele gezondheidstoestand van betrokkene.

      4 De geneesheer-directeur verzoekt Onze Minister van Veiligheid en Justitie schriftelijk om
      toestemming voor het nemen van een beslissing tot beëindiging van de verplichte zorg, houdende
      opname in een accommodatie, op grond van een zorgmachtiging die is afgegeven met toepassing van
      [artikel 2.3, eerste lid, van de Wet forensische zorg][ref1], behoudens de gevallen waarin artikel 2.3, eerste lid,
      onder 3, van die wet, is toegepast en betrokkene is vrijgesproken van hetgeen hem ten laste is gelegd.

      5 Onze Minister van Veiligheid en Justitie verstrekt de geneesheer-directeur zo spoedig mogelijk schriftelijk en
      gemotiveerd zijn beslissing.

      6 Indien de toestemming, bedoeld in het vierde lid, niet wordt gegeven, beëindigt de geneesheer-directeur de
      verplichte zorg niet en wijst hij de aanvraag af.

      7 De geneesheer-directeur neemt binnen veertien dagen na ontvangst van een aanvraag tot beëindiging van het
      verlenen van verplichte zorg op grond van een crisismaatregel, machtiging tot voortzetting van de crisismaatregel
      of zorgmachtiging een schriftelijke en gemotiveerde beslissing.

      8 De geneesheer-directeur kan aan de beslissing voorwaarden of beperkingen verbinden.

      9 De geneesheer-directeur geeft betrokkene, de vertegenwoordiger, de advocaat en de zorgverantwoordelijke een
      afschrift van de beslissing, indien van toepassing voorzien van de beoordeling van Onze Minister van Veiligheid
      en Justitie, en stelt hen schriftelijk in kennis van de klachtwaardigheid van de beslissing om aan de beslissing
      voorwaarden of beperkingen te verbinden, als bedoeld in het achtste lid, en de mogelijkheid van advies en bijstand
      door de patiëntenvertrouwenspersoon en de familievertrouwenspersoon.

      10 De geneesheer-directeur informeert tijdig:

      a. de burgemeester over de beëindiging van de verplichte zorg op grond van een crisismaatregel;

      b. de officier van justitie over de beëindiging van de verplichte zorg op grond van een machtiging tot voortzetting
      van de crisismaatregel of zorgmachtiging.

      11 De geneesheer-directeur kan de voor de continuïteit van zorg voor betrokkene relevante familie en naasten en
      het college van burgemeester en wethouders van de gemeente waar betrokkene ingezetene is dan wel naar verwachting
      zal verblijven informeren over de beëindiging van de machtiging tot voortzetting van de crisismaatregel of
      zorgmachtiging indien dit noodzakelijk is omdat essentiële voorwaarden voor deelname aan het maatschappelijk
      verkeer van betrokkene ontbreken.

      12 Bij niet naleving van een aan de beslissing tot beëindiging van het verlenen van verplichte zorg op grond van
      een crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging door de geneesheer-
      directeur of de rechter verbonden voorwaarde of beperking trekt de geneesheer-directeur de beslissing tot
      beëindiging in.

      13 De geneesheer-directeur deelt de beslissing tot intrekking, bedoeld in het twaalfde lid, uiterlijk binnen vier
      dagen na de beslissing schriftelijk en gemotiveerd mee aan betrokkene, de vertegenwoordiger, de advocaat en de
      zorgverantwoordelijke, en stelt hen daarbij in kennis van de klachtwaardigheid van de beslissing en de mogelijkheid
      van advies en bijstand door de patiëntenvertrouwenspersoon en de familievertrouwenspersoon. De geneesheer-directeur
      informeert tijdig de burgemeester over de intrekking van de beëindiging van de verplichte zorg op grond van een
      crisismaatregel, of de officier van justitie over de intrekking van de beëindiging van de verplichte zorg op grond
      van een machtiging tot voortzetting van de crisismaatregel of zorgmachtiging.

      14 Bij regeling van Onze Minister kan een model voor een medische verklaring als bedoeld in het derde lid worden
      vastgesteld.


