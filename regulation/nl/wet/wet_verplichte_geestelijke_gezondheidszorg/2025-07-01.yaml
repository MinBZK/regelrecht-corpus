  - number: 5:17
    text: |-
      1 Indien de officier van justitie beslist dat is voldaan aan de criteria voor verplichte zorg, dient hij
      onverwijld een verzoekschrift voor een zorgmachtiging bij de rechter in, onder gelijktijdige uitvoering van
      [artikel 5:16][ref1].

      2 In het verzoekschrift geeft de officier van justitie gemotiveerd aan waarom deze van oordeel is dat aan de
      criteria van verplichte zorg is voldaan, wat het doel is van de verplichte zorg, welke vormen van verplichte
      zorg in de zorgmachtiging moeten worden opgenomen en op welke wijze is voldaan aan de uitgangspunten van
      [artikel 2:1][ref2].

      3 Bij het verzoekschrift voegt de officier van justitie in elk geval:

      a. de medische verklaring;

      b. de zorgkaart inclusief de bijlagen;

      c. het zorgplan inclusief de bijlagen;

      d. de beslissing bedoeld in [artikel 5:5, vierde lid][ref3], indien de geneesheer-directeur betrokkene niet in de
      gelegenheid heeft gesteld zelf een plan van aanpak op te stellen;

      e. de bevindingen van de geneesheer-directeur, bedoeld in [artikel 5:15][ref4];

      f. de gegevens, bedoeld in [artikel 5:4, eerste lid, onderdelen b en c][ref5];

      g. indien aanwezig, een afschrift van de indicatiestelling, bedoeld in
      [artikel 1.1, eerste lid, onderdeel e, van de Wet forensische zorg][ref6], het verplegings- en behandelingsplan,
      bedoeld in de [Beginselenwet verpleging ter beschikking gestelden][ref7], of het geneeskundig behandelingsplan,
      bedoeld in de [Beginselenwet justitiële jeugdinrichtingen][ref8] en de [Penitentiaire beginselenwet][ref9] in het
      geval hij om een op een eerdere titel aansluitende zorgmachtiging verzoekt.

      4 Bij het verzoekschrift dient de officier van justitie het door de geneesheer-directeur opgestelde voorstel voor
      een zorgmachtiging in waarin in elk geval staat vermeld de:

      a. zorg die noodzakelijk is om het ernstig nadeel weg te nemen;

      b. wijze waarop rekening wordt gehouden met de voorkeuren van betrokkene, zoals vastgelegd op de zorgkaart of in
      de zelfbindingsverklaring;

      c. maximale duur van de afzonderlijke vormen van verplichte zorg;

      d. wijze waarop de zorgaanbieder en de geneesheer-directeur de kwaliteit van de verplichte zorg bewaken en toezicht
      houden op de uitvoering van verplichte zorg in ambulante omstandigheden;

      e. frequentie waarmee en de omstandigheden waaronder het zorgplan en de subsidiariteit, proportionaliteit,
      effectiviteit en veiligheid van de verplichte zorg met betrokkene en de vertegenwoordiger zal worden geëvalueerd en
      het zorgplan geactualiseerd;

      f. zorgaanbieder die wordt belast met de uitvoering van de zorgmachtiging en zo nodig de accommodatie;

      g. inventarisatie van de essentiële voorwaarden voor maatschappelijke deelname;

      h. mogelijkheid tot het verlenen van advies en bijstand door een patiëntenvertrouwenspersoon.

      5 Indien het een verzoekschrift betreft voor een zorgmachtiging naar aanleiding van een zelfbindingsverklaring
      voegt de officier van justitie tevens de zelfbindingsverklaring bij het verzoekschrift.

      6 De officier van justitie voegt daarnaast bij het verzoekschrift voor een zorgmachtiging:

      a. indien betrokkene minderjarig is, een uittreksel uit het in
      [artikel 244 van Boek 1 van het Burgerlijk Wetboek][ref10] bedoelde register, of een verklaring van de griffie van
      de rechtbank dat ten aanzien van de minderjarige het register geen gegevens bevat;

      b. indien betrokkene onder curatele is gesteld, een uittreksel uit het in
      [artikel 391 van Boek 1 van het Burgerlijk Wetboek][ref11] bedoelde register;

      c. indien ten behoeve van betrokkene een mentorschap is ingesteld, een afschrift van de beschikking waarbij het
      mentorschap is ingesteld en die waarbij een mentor is benoemd.


