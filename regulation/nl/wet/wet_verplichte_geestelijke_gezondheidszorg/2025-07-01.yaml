  - number: 11:2
    text: |-
      1 De patiëntenvertrouwenspersoon heeft, voor zover dat redelijkerwijs voor de vervulling van zijn taak nodig is,
      vrije toegang tot betrokkene en behoeft geen toestemming van derden om te spreken met betrokkene.

      2 De zorgaanbieder stelt de patiëntenvertrouwenspersoon in de gelegenheid met betrokkene te spreken, al of niet op
      verzoek van betrokkene.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel112
  - number: 11:3
    text: |-
      1 De zorgaanbieder, de geneesheer-directeur en de zorgverantwoordelijke als ook alle anderen die bij de uitvoering
      van deze wet betrokken zijn, geven aan de patiëntenvertrouwenspersoon binnen de door hem gestelde redelijke termijn
      alle door hem verlangde inlichtingen, voor zover dit redelijkerwijs voor de vervulling van zijn taak nodig is en
      betrokkene of de vertegenwoordiger daarmee uitdrukkelijk instemt.

      2 De zorgaanbieder, de geneesheer-directeur en de zorgverantwoordelijke als ook alle anderen die bij de uitvoering
      van deze wet betrokken zijn, verlenen aan de patiëntenvertrouwenspersoon binnen de door hem gestelde redelijke
      termijn alle medewerking, die deze redelijkerwijs kan vorderen bij de uitoefening van zijn taak.

      3 De zorgaanbieder en de zorgverantwoordelijke verlenen aan de patiëntenvertrouwenspersoon inzage in hun dossiers,
      voor zover dit redelijkerwijs voor de vervulling van zijn taak nodig is en betrokkene of de vertegenwoordiger
      daarmee uitdrukkelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel113
  - number: 11:4
    text: |-
      De patiëntenvertrouwenspersoon is tot geheimhouding verplicht van hetgeen in de uitoefening van zijn taak aan hem
      is toevertrouwd, tenzij enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel114
  - number: 11:5
    text: |-
      De patiëntenvertrouwenspersoon kan zich op grond van zijn geheimhoudingsplicht verschonen van het geven van
      getuigenis of het beantwoorden van vragen in een klachtprocedure of een rechterlijke procedure.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel115
  - number: 12:1
    text: |-
      1 De zorgaanbieder draagt ervoor zorg dat de voor de continuïteit van zorg relevante familie of naasten een beroep
      kunnen doen op een familievertrouwenspersoon. De familievertrouwenspersoon heeft tot taak om op verzoek van de
      voor de continuïteit van zorg relevante familie en naasten van een persoon met een psychische stoornis voor wie een
      verzoek voor een zorgmachtiging wordt voorbereid of aan wie verplichte zorg wordt verleend door een zorgaanbieder,
      deze:

      a. te informeren;

      b. te adviseren;

      c. te ondersteunen;

      d. bijstand te verlenen bij een klachtprocedure.

      2 De familievertrouwenspersoon heeft tevens tot taak:

      a. tekortkomingen in de structuur en de uitvoering van de zorg, voor zover deze afbreuk doen aan de rechten van de
      betrokkene, te signaleren en aan de inspectie te melden;

      b. te bemiddelen tussen:

      1°. de familie en naasten,

      2°. de zorgaanbieder, de geneesheer-directeur en de zorgverantwoordelijke, en

      3°. betrokkene.

      3 De familievertrouwenspersoon brengt ten minste eenmaal per jaar een rapport en advies uit aan de zorgaanbieder
      ten behoeve van het kwaliteitsbeleid.

      4 De familievertrouwenspersoon verricht zijn werkzaamheden onafhankelijk van de zorgaanbieder, de geneesheer-
      directeur en de zorgverantwoordelijke.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:

      a. de deskundigheid van de familievertrouwenspersoon;

      b. de onafhankelijkheid van de familievertrouwenspersoon ten opzichte van de zorgaanbieder;

      c. de taken en bevoegdheden van de familievertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel121
  - number: 12:2
    text: |-
      De familievertrouwenspersoon heeft vrije toegang tot betrokkene en behoeft geen toestemming van derden om te
      spreken met betrokkene, voor zover:

      a. familie of naasten hierom verzoeken,

      b. het voor de vervulling van zijn taak redelijkerwijs nodig is, en

      c. betrokkene daarmee uitdrukkelijk instemt
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel122
  - number: 12:3
    text: |-
      1 De zorgaanbieder, de geneesheer-directeur, de zorgverantwoordelijke en alle anderen die bij de uitvoering van
      deze wet betrokken zijn, geven aan de familievertrouwenspersoon binnen de door hem gestelde redelijke termijn
      alle door hem verlangde inlichtingen, voor zover dit redelijkerwijs voor de vervulling van zijn taak nodig is en
      betrokkene of de vertegenwoordiger daarmee uitdrukkelijk instemt.

      2 De zorgaanbieder, de geneesheer-directeur, de zorgverantwoordelijke en alle anderen die bij de uitvoering van
      deze wet betrokken zijn, verlenen aan de familievertrouwenspersoon binnen de door hem gestelde redelijke termijn
      alle medewerking die deze redelijkerwijs kan vorderen bij de uitoefening van zijn taak.

      3 De zorgaanbieder en de zorgverantwoordelijke verlenen aan de familievertrouwenspersoon inzage van hun dossiers,
      voor zover dit redelijkerwijs voor de vervulling van zijn taak nodig is en betrokkene of de vertegenwoordiger
      schriftelijk instemt met inzage of indien er sprake is van een zwaarwegend belang ter zake voor de nabestaanden.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel123
  - number: 12:4
    text: |-
      1 De familievertrouwenspersoon is tot geheimhouding verplicht van hetgeen in de uitoefening van zijn taak aan hem
      is toevertrouwd, tenzij:

      a. enig wettelijk voorschrift hem tot mededeling verplicht,

      b. uit zijn taak de noodzaak tot mededeling voortvloeit,

      c. betrokkene schriftelijke toestemming geeft om vertrouwelijke informatie met familie of naasten te delen en
      daardoor de persoonlijke levenssfeer van derden niet wordt geschaad,

      d. familie en naasten toestemming geven om vertrouwelijke informatie te delen en daardoor de persoonlijke
      levenssfeer van betrokkene of derden niet wordt geschaad, of

      e. er sprake is van een zwaarwegend belang ter zake voor de nabestaanden.

      2 De familievertrouwenspersoon kan zich op grond van zijn geheimhoudingsplicht verschonen van het geven van
      getuigenis of het beantwoorden van vragen in een klachtprocedure of een rechterlijke procedure.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel124
  - number: 13:1
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      inspectie.

      2 Indien verplichte zorg wordt verleend of de inspectie een gegrond vermoeden heeft dat verplichte
      zorg wordt verleend, zijn de met het toezicht belaste ambtenaren bij de bevoegdheden, genoemd in de
      [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref1], tevens bevoegd, met medeneming van de
      benodigde apparatuur, een woning of verblijfsruimte binnen te treden zonder toestemming van de bewoner, voor zover
      dat noodzakelijk is voor het toezicht op de verplichte zorg in de woning of verblijfsruimte. Zij beschikken niet
      over de bevoegdheden, bedoeld in de [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].

      3 De aan de met het toezicht belaste ambtenaren toekomende bevoegdheden, bedoeld in de [artikelen 5:16][ref4] en
      [5:17 van de Algemene wet bestuursrecht][ref5], hebben mede betrekking op dossiers van betrokkenen.

      4 Voor zover de betrokken beroepsbeoefenaar uit hoofde van ambt, beroep of wettelijk voorschrift tot
      geheimhouding van het dossier verplicht is, kan de beroepsbeoefenaar deze verplichting, in afwijking van
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref6], niet inroepen tegenover de met het toezicht
      belaste ambtenaren. Op deze ambtenaren rust dezelfde geheimhoudingsplicht als op de betrokken beroepsbeoefenaar.

      5 De zorgaanbieder stelt de met het toezicht belaste ambtenaren in de gelegenheid met betrokkene te spreken, al of
      niet op verzoek van betrokkene.


