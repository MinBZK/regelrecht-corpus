  - number: 3:4
    text: |-
      Verplichte zorg kan worden verleend om:

      a. een crisissituatie af te wenden,

      b. ernstig nadeel af te wenden,

      c. de geestelijke gezondheid van betrokkene te stabiliseren,

      d. de geestelijke gezondheid van betrokkene dusdanig te herstellen dat hij zijn autonomie zoveel mogelijk herwint,
      of

      e. het stabiliseren of herstellen van de fysieke gezondheid van betrokkene in het geval diens gedrag als gevolg van
      zijn psychische stoornis leidt tot ernstig nadeel daarvoor.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel34
  - number: 4:1
    text: |-
      1 Een persoon die de leeftijd van zestien jaar heeft bereikt en tot een redelijke waardering van zijn belangen
      in staat is ter zake van zorg in verband met zijn psychische stoornis, kan zich met een zelfbindingsverklaring
      verbinden tot zorg.

      2 Betrokkene en de zorgverantwoordelijke stellen een zelfbindingsverklaring op waarin worden beschreven:

      a. onder welke omstandigheden verplichte zorg aan betrokkene moet worden verleend om ernstig nadeel te voorkomen;

      b. de zorg en de verplichte zorg die onder die omstandigheden aan betrokkene kan worden verleend en de maximale
      duur van de verplichte zorg;

      c. de omstandigheden waaronder de verplichte zorg wordt beëindigd;

      d. de geldigheidsduur van de zelfbindingsverklaring;

      e. de voor de continuïteit van zorg relevante familie en naasten met wie contact moet worden opgenomen als de onder
      a bedoelde omstandigheden zich voordoen.

      3 De zelfbindingsverklaring gaat vergezeld van een zorgplan.

      4 De zorgverantwoordelijke wijst betrokkene op de mogelijkheid om zich bij het opstellen van een
      zelfbindingsverklaring te laten bijstaan door een familielid of naaste of de patiëntenvertrouwenspersoon.

      5 De patiëntenvertrouwenspersoon verleent op verzoek van betrokkene advies en bijstand bij het opstellen van de
      zelfbindingsverklaring.

      6 Een onafhankelijk arts of een persoon, behorende tot een bij regeling van Onze Minister aangewezen categorie van
      deskundigen, stelt een verklaring op waaruit blijkt of betrokkene tot een redelijke waardering van zijn belangen
      ter zake in staat is.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel41
  - number: 4:2
    text: |-
      1 Betrokkene, de zorgverantwoordelijke en de geneesheer-directeur dateren en ondertekenen de
      zelfbindingsverklaring.

      2 De geneesheer-directeur verstrekt de zelfbindingsverklaring aan betrokkene en een gewaarmerkt afschrift aan ten
      minste de vertegenwoordiger, de gezinsvoogdijwerker, de zorgaanbieder en de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel42
  - number: 4:3
    text: |-
      De zelfbindingsverklaring kan tussentijds worden gewijzigd of ingetrokken. Op de wijziging of de intrekking zijn de
      [artikelen 4:1][ref1] en [4:2][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel42
