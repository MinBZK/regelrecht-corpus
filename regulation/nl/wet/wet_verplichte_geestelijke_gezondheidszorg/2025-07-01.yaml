  - number: 1:8
    text: |-
      1 Bij de voorbereiding, de uitvoering, de wijziging en de beëindiging van verplichte zorg wordt betrokkene in een
      voor hem begrijpelijke taal geïnformeerd.

      2 Voor zover de uitvoering van de verplichte zorg leidt tot vrijheidsbeneming heeft betrokkene, indien hij de
      Nederlandse taal niet beheerst, recht op bijstand van een tolk.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel18
  - number: 2:1
    text: |-
      1 De zorgaanbieder en de geneesheer-directeur bieden voldoende mogelijkheden voor zorg op basis van vrijwilligheid,
      om daarmee verplichte zorg zoveel mogelijk te voorkomen.

      2 Verplichte zorg kan alleen als uiterste middel worden overwogen, indien er geen mogelijkheden voor vrijwillige
      zorg meer zijn.

      3 Bij de voorbereiding, de afgifte, de tenuitvoerlegging, de uitvoering, de wijziging en de beëindiging van een
      crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging worden van de verplichte
      zorg, waaronder begrepen de verplichte zorg in ambulante omstandigheden, de proportionaliteit, subsidiariteit,
      effectiviteit en veiligheid beoordeeld.

      4 Bij de voorbereiding, de afgifte, de uitvoering, de wijziging en de beëindiging van een crisismaatregel,
      machtiging tot voortzetting van de crisismaatregel of zorgmachtiging wordt rekening gehouden met de voorwaarden die
      noodzakelijk zijn om deelname van betrokkene aan het maatschappelijk leven te bevorderen.

      5 Bij de voorbereiding, de uitvoering, de wijziging en de beëindiging van een crisismaatregel, machtiging tot
      voortzetting van de crisismaatregel of zorgmachtiging worden de wensen en voorkeuren van betrokkene ten aanzien van
      de zorg vastgelegd.

      6 De wensen en voorkeuren van betrokkene ten aanzien van de verplichte zorg worden gehonoreerd, tenzij:

      a. betrokkene niet tot een redelijke waardering van zijn belangen ter zake in staat is, of

      b. acuut levensgevaar voor betrokkene dreigt dan wel er een aanzienlijk risico voor een ander is op levensgevaar,
      ernstig lichamelijk letsel, ernstige psychische, materiële, immateriële of financiële schade, ernstige
      verwaarlozing of maatschappelijke teloorgang, of om ernstig in zijn ontwikkeling te worden geschaad, dan wel de
      algemene veiligheid van personen of goederen in gevaar is.

      7 Bij de voorbereiding, de uitvoering, de wijziging en de beëindiging van een crisismaatregel, machtiging tot
      voortzetting van de crisismaatregel of zorgmachtiging worden de familie, de directe naasten van betrokkene en de
      huisarts zoveel mogelijk betrokken.

      8 Bij de voorbereiding, de afgifte, de uitvoering, de wijziging en de beëindiging van verplichte zorg worden
      de mogelijk nadelige effecten van de verplichte zorg op lange termijn voor betrokkene bij de beoordeling van de
      subsidiariteit, proportionaliteit, effectiviteit en veiligheid betrokken en indien mogelijk met terzake deskundigen
      besproken.

      9 Bij de voorbereiding, de afgifte, de uitvoering, de wijziging en de beëindiging van verplichte zorg bij kinderen
      en jeugdigen worden zonodig aanvullende zorgvuldigheidseisen gesteld en de mogelijk nadelige effecten van de
      verplichte zorg op lange termijn op de lichamelijke en geestelijke ontwikkeling van betrokkene en de deelname aan
      het maatschappelijk leven betrokken bij de beoordeling van de subsidiariteit, proportionaliteit, effectiviteit en
      veiligheid en indien mogelijk met terzake deskundigen besproken.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel21
  - number: 2:2
    text: |-
      1 De zorgaanbieder stelt op basis van de uitgangspunten van [artikel 2:1][ref1] een beleidsplan vast over de
      toepassing van de verplichte zorg dat gericht is op het terugdringen en voorkomen van verplichte zorg en het zoeken
      naar alternatieven op basis van vrijwilligheid.

      2 De zorgaanbieder geeft in het beleidsplan aan op welke wijze hij zorg draagt voor continuïteit in de
      zorgverlening indien verplichte zorg overgaat naar zorg op basis van vrijwilligheid of indien zorg op basis van
      vrijwilligheid overgaat naar verplichte zorg.

      3 Voordat de zorgaanbieder het beleidsplan vaststelt, vraagt de zorgaanbieder hierover advies aan de
      cliëntenraad, bedoeld in [artikel 3 van de Wet medezeggenschap cliënten zorginstellingen 2018][ref2].
      De [artikelen 7, vijfde en zesde lid][ref3], en
      [6, eerste lid, eerste volzin, van de Wet medezeggenschap cliënten zorginstellingen 2018][ref4] zijn van
      toepassing.

      4 De zorgaanbieder draagt er zorg voor dat het beleidsplan wordt toegepast bij de voorbereiding, de uitvoering, de
      evaluatie, de wijziging en de beëindiging van verplichte zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel21
