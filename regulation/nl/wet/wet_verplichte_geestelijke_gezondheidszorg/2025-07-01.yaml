      1 De zorgaanbieder verschaft de psychiater ten behoeve van diens taak op grond van
      [paragraaf 3 van hoofdstuk 5][ref1] en [artikel 7:1][ref2], inzage in de zelfbindingsverklaring.

      2 De zorgverantwoordelijke verschaft de psychiater ten behoeve van diens taak op grond van
      [paragraaf 3 van hoofdstuk 5][ref3] en [artikel 7:1][ref4], inzage in het zorgplan, bedoeld in
      [artikel 5:14][ref5], en het dossier van betrokkene, bedoeld in [artikel 8:4][ref6].


