      1 Na afloop van de termijnen, bedoeld in [artikel 8:32][ref1] worden de gegevens vernietigd, tenzij:

      a. redelijkerwijs aannemelijk is dat bewaring van de gegevens van aanmerkelijk belang is voor een ander dan
      betrokkene, of

      b. het bij de wet bepaalde zich tegen vernietiging verzet.

      2 In afwijking van het bepaalde in [artikel 8:32][ref2] worden vanaf vijf jaar na de beëindiging van de
      crisismaatregel, de voortzetting van de crisismaatregel, de zorgmachtiging of de verplichte zorg, bedoeld in
      [artikel 9:1, eerste lid, eerste volzin][ref3], de gegevens binnen drie maanden vernietigd indien betrokkene
      daartoe verzoekt, tenzij:

      a. redelijkerwijs aannemelijk is dat bewaring van de gegevens van aanmerkelijk belang is voor een ander dan
      betrokkene, of

      b. het bij de wet bepaalde zich tegen vernietiging verzet.


