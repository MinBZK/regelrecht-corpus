  - number: 13:2
    text: |-
      1 Indien bij de zorgaanbieder, de geneesheer-directeur of de zorgverantwoordelijke het gegronde vermoeden bestaat
      dat de uitvoering van de verplichte zorg ernstig tekortschiet, doet hij daarvan melding aan de inspectie.

      2 Indien de zorgaanbieder, de geneesheer-directeur of de zorgverantwoordelijke onvoldoende, niet of niet tijdig
      reageert op de klachten van de patiëntenvertrouwenspersoon of de familievertrouwenspersoon over de uitvoering van
      de verplichte zorg, kan de patiëntenvertrouwenspersoon of familievertrouwenspersoon dit melden aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel132
  - number: 13:3
    text: |-
      1 Indien betrokkene zich onttrekt aan verplichte zorg op grond van een crisismaatregel, machtiging tot voortzetting
      van de crisismaatregel of zorgmachtiging meldt de geneesheer-directeur dit aan de officier van justitie.

      2 Indien betrokkene zich onttrekt aan verplichte zorg op grond van [hoofdstuk 9, paragraaf 1][ref1], meldt de
      geneesheer-directeur dit aan de officier van justitie en aan Onze Minister van Veiligheid en Justitie, en voegt
      indien van toepassing daarbij de melding, bedoeld in het vijfde lid.

      3 De geneesheer-directeur meldt vermissing bij de politie indien betrokkene onvindbaar is of doet een verzoek tot
      ondersteuning bij de politie indien betrokkene weigert terug te keren naar de accommodatie waarin hij op grond van
      een crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging is opgenomen.

      4 Zodra de uitvoering van een crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging
      wordt hervat, meldt de geneesheer-directeur dit aan de officier van justitie.

      5 Indien de geneesheer-directeur het ernstige vermoeden heeft dat betrokkene in levensgevaar verkeert of een
      misdrijf als bedoeld in [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref2], zal plegen met ernstig
      nadeel voor hemzelf of een ander tot gevolg, vermeldt hij dit met redenen omkleed in de melding aan de officier van
      justitie en de melding van vermissing.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel67
