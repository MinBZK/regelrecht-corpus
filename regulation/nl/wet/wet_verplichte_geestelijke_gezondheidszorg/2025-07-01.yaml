  - number: 5:15
    text: |-
      1 De geneesheer-directeur beoordeelt of het zorgplan voldoet aan de uitgangspunten van [artikel 2:1][ref1], en,
      indien toepassing is gegeven aan artikel 5:5, vijfde lid, of het plan, bedoeld in [artikel 5:5][ref2], voldoet aan
      het uitgangspunt dat geen ernstig nadeel ontstaat.

      2 De geneesheer-directeur draagt zijn bevindingen als bedoeld in het eerste lid, vergezeld van de zorgkaart en het
      zorgplan over aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel55
