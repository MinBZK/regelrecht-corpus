  - number: 3:3
    text: |-
      Indien het gedrag van een persoon als gevolg van zijn psychische stoornis, niet zijnde een psychogeriatrische
      aandoening, verstandelijke handicap, of een op grond van [artikel 1, vierde lid][ref1], of onder toepassing van
      [artikel 24, vierde lid, van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref2]
      daarmee gelijkgestelde ziekte of aandoening, leidt tot ernstig nadeel kan als uiterste middel verplichte zorg als
      bedoeld in [artikel 3:1][ref3] worden verleend, indien:

      a. er geen mogelijkheden voor zorg op basis van vrijwilligheid zijn;

      b. er voor betrokkene geen minder bezwarende alternatieven met het beoogde effect zijn;

      c. het verlenen van verplichte zorg, gelet op het beoogde doel van verplichte zorg evenredig is; en

      d. redelijkerwijs te verwachten is dat het verlenen van verplichte zorg effectief is.


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel1
