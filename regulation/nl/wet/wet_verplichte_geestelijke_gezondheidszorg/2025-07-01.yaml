        artikel: 5:3
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5:12
    text: |-
      1 Indien betrokkene dat wenst, stelt de zorgverantwoordelijke samen met betrokkene en de vertegenwoordiger
      een zorgkaart op. Indien betrokkene beschikt over een zelfbindingsverklaring, een plan als bedoeld in
      [artikel 5:5][ref1], of andere schriftelijke wilsuitingen inzake zorg, worden afschriften daarvan als bijlage bij
      de zorgkaart gevoegd.

      2 De zorgverantwoordelijke wijst betrokkene op de mogelijkheid om zich bij het opstellen, evalueren en actualiseren
      van de zorgkaart te laten bijstaan door een familielid, naaste of patiëntenvertrouwenspersoon.

      3 De patiëntenvertrouwenspersoon verleent op verzoek van betrokkene advies en bijstand bij het opstellen, evalueren
      en actualiseren van de zorgkaart.

      4 Indien betrokkene of de vertegenwoordiger geen voorkeuren kenbaar wil maken, vermeldt de zorgverantwoordelijke
      dit op de zorgkaart.

      5 De zorgverantwoordelijke overlegt de zorgkaart, inclusief de bijlagen, aan de geneesheer-directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel55
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel512
    references:
      - id: ref1
        bwb_id: BWBR0040635
        artikel: 5:5
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5:13
    text: |-
      1 De zorgverantwoordelijke stelt in overleg met betrokkene en de vertegenwoordiger een zorgplan vast, indien van
      toepassing volgens het vastgestelde model, bedoeld in het zevende lid.

      2 De zorgverantwoordelijke wijst betrokkene op de mogelijkheid om zich bij het opstellen, evalueren en actualiseren
      van het zorgplan te laten bijstaan door een familielid of naaste en de patiëntenvertrouwenspersoon.

      3 De zorgverantwoordelijke pleegt voorafgaand aan het vaststellen van het zorgplan overleg met:

      a. de voor de continuïteit van zorg relevante familie en naasten;

      b. de zorgverleners, en zo mogelijk met de huisarts;

      c. het college van burgemeester en wethouders van de gemeente waar betrokkene ingezetene is dan wel overwegend
      verblijft, indien er bij de voorbereiding van het zorgplan blijkt dat essentiële voorwaarden voor deelname aan het
      maatschappelijk leven van betrokkene ontbreken;

      d. voor zover de aard van de psychische stoornis daartoe noodzaakt: ten minste één andere deskundige behorende tot
      een bij regeling van Onze Minister aangewezen categorie van deskundigen.

      4 De zorgverantwoordelijke stelt betrokkene, de vertegenwoordiger, de voor de continuïteit van zorg relevante
      familie en naasten in de gelegenheid om bij voorkeur mondeling hun zienswijze kenbaar te maken. Het kenbaar maken
      van de zienswijzen gebeurt, zo mogelijk, gelijktijdig en gezamenlijk, tenzij betrokkene of een voor de continuïteit
      van zorg relevant familielid of naaste daartegen bezwaar heeft.

      5 De patiëntenvertrouwenspersoon verleent op verzoek van betrokkene advies en bijstand bij het opstellen van het
      zorgplan.

      6 De zorgverantwoordelijke overlegt het zorgplan aan de geneesheer-directeur.

      7 Bij regeling van Onze Minister kan een model voor een zorgplan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel513
  - number: 5:14
    text: |-
      1 Het zorgplan vermeldt in elk geval:

      a. een door de zorgverantwoordelijke gestelde diagnose van de psychische stoornis van betrokkene en het gedrag dat
      voortvloeit uit de psychische stoornis en leidt tot een ernstig nadeel;

      b. de zorg die noodzakelijk is om het ernstig nadeel weg te nemen;

      c. het doel van verplichte zorg;

      d. de wijze waarop rekening wordt gehouden met de voorkeuren van betrokkene ten aanzien van de zorg, zoals
      vastgelegd op de zorgkaart inclusief de bijlagen;

      e. de zienswijze en de contactgegevens van de personen, bedoeld in [artikel 5:13, vierde lid][ref1];

      f. de maximale duur van de afzonderlijke vormen van verplichte zorg;

      g. de wijze waarop de zorgaanbieder en de geneesheer-directeur de kwaliteit van de verplichte zorg bewaken en
      toezicht houden op de uitvoering van de verplichte zorg in ambulante omstandigheden;

      h. de essentiële voorwaarden voor deelname aan het maatschappelijk leven van betrokkene, voor zover deze ontbreken;

      i. de frequentie waarmee en de omstandigheden waaronder het zorgplan en de subsidiariteit, proportionaliteit,
      effectiviteit en veiligheid van de verplichte zorg met betrokkene, de vertegenwoordiger, alsmede het familielid of
      de naaste en de patiëntenvertrouwenspersoon worden geëvalueerd en het zorgplan wordt geactualiseerd;

      j. de zorgaanbieder die kan worden belast met de uitvoering van de zorgmachtiging, en zo nodig de accommodatie.

      2 Indien de zorgverantwoordelijke van oordeel is dat niet is voldaan aan de criteria voor verplichte zorg, vermeldt
      hij de redenen daarvan in het zorgplan en zo mogelijk:

      a. de mogelijkheden voor zorg op basis van vrijwilligheid;

      b. minder bezwarende alternatieven met het beoogde effect.

      3 Indien de zorgverantwoordelijke en betrokkene of de vertegenwoordiger niet tot overeenstemming komen, vermeldt
      het zorgplan de redenen daarvoor.

      4 Indien de zorgverantwoordelijke van oordeel is dat gelet op de noodzakelijke zorg een andere zorgaanbieder
      dan degene onder wiens verantwoordelijkheid de zorgmachtiging wordt voorbereid, belast zou moeten worden met
      de uitvoering van de zorgmachtiging, pleegt hij hiertoe overleg met de geneesheer-directeur en de beoogde
      zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel513
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel514
