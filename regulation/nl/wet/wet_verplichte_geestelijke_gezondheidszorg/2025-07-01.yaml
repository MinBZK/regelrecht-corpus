  - number: 5:18
    text: |-
      1 Indien de officier van justitie van oordeel is dat niet is voldaan aan de criteria voor verplichte zorg en
      besluit geen verzoekschrift voor een zorgmachtiging in te dienen, kan de aanvrager, bedoeld in [artikel 5:3][ref1],
      binnen veertien dagen nadat de beslissing van de officier van justitie aan hem is meegedeeld, bij de officier van
      justitie schriftelijk en gemotiveerd een aanvraag indienen alsnog een verzoekschrift voor een zorgmachtiging bij de
      rechter in te dienen.

      2 Degene die de melding heeft gedaan als bedoeld in [artikel 5:2, vijfde lid][ref2], kan in de situatie, bedoeld
      in [artikel 5:16, tweede lid, tweede volzin][ref3], binnen veertien dagen nadat hij bericht heeft ontvangen van
      het college van burgemeester en wethouders, bij de officier van justitie schriftelijk en gemotiveerd een aanvraag
      indienen alsnog een verzoekschrift voor een zorgmachtiging bij de rechter in te dienen.

      3 Indien uit de medische verklaring blijkt dat de psychische stoornis van betrokkene noodzaakt tot verplichte
      zorg en de aanvraag, bedoeld in het eerste of tweede lid, voldoende gemotiveerd is, dient de officier van
      justitie alsnog een verzoekschrift voor een zorgmachtiging bij de rechter in. De officier van justitie voegt
      de gemotiveerde aanvraag, bedoeld in het eerste lid of tweede lid, de medische verklaring, de gegevens,
      bedoeld in [artikel 5:4, eerste lid, onderdelen b en c][ref4], voor zover aanwezig het plan, bedoeld in
      [artikel 5:5, eerste lid][ref5], en het zorgplan alsmede de zorgkaart bij het verzoekschrift voor een
      zorgmachtiging. [Artikel 5:17, zesde lid][ref6], is van overeenkomstige toepassing.


