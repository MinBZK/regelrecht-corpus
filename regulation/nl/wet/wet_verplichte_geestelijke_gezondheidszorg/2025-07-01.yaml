  - number: 8:5
    text: |-
      1 De verplichte zorg wordt in beginsel toegepast op basis van een multidisciplinaire richtlijn.

      2 De richtlijn is gericht op:

      a. het voorkomen van verplichte zorg;

      b. keuze voor de minst bezwarende vorm van verplichte zorg;

      c. het beperken van de duur en frequentie van de verplichte zorg;

      d. de veiligheid van betrokkene en zorgverleners;

      e. het voorkomen van nadelige effecten op korte en lange termijn voor betrokkene.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel85
  - number: 8:6
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de veiligheid binnen de
      accommodatie en de wijze van toezicht door de zorgaanbieder op de verplichte zorg in de accommodatie en kunnen
      regels worden gesteld over de kwaliteit van de verplichte zorg.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel86
  - number: 8:7
    text: |-
      1 De zorgaanbieder is verplicht de zorg, genoemd in de crisismaatregel, de machtiging tot voortzetting van de
      crisismaatregel of de zorgmachtiging, te verlenen.

      2 De zorgaanbieder verleent, naast de tijdelijke verplichte zorg voorafgaand aan de crisismaatregel, bedoeld
      in [artikel 7:3][ref1], uitsluitend de vormen van verplichte zorg die zijn opgenomen in de zorgmachtiging,
      de crisismaatregel, de machtiging tot voortzetting van de crisismaatregel, of een beslissing op grond van de
      [artikelen 8:11 tot en met 8:14][ref2].

      3 Een zorgaanbieder verleent aan betrokkene slechts verplichte zorg als bedoeld in de crisismaatregel, de
      machtiging tot voortzetting van de crisismaatregel of de zorgmachtiging tegen overlegging van een afschrift van
      respectievelijk de crisismaatregel, de machtiging tot voortzetting van de crisismaatregel of de zorgmachtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel811
