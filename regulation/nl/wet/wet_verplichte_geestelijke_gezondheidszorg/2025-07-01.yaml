  - number: 7:1
    text: |-
      1 De burgemeester kan ten aanzien van een persoon die zich in zijn gemeente bevindt een crisismaatregel nemen,
      indien:

      a. er onmiddellijk dreigend ernstig nadeel is;

      b. er een ernstig vermoeden bestaat dat het gedrag van een persoon als gevolg van een psychische stoornis dit
      dreigend ernstig nadeel veroorzaakt;

      c. met de crisismaatregel het ernstig nadeel kan worden weggenomen;

      d. de crisissituatie dermate ernstig is dat de procedure voor een zorgmachtiging niet kan worden afgewacht; en

      e. er verzet is als bedoeld in [artikel 1:4][ref1] tegen zorg.

      2 De burgemeester kan een wethouder mandaat verlenen voor het nemen van een crisismaatregel.

      3 De burgemeester neemt niet eerder een crisismaatregel dan nadat hij:

      a. ervoor zorg heeft gedragen dat een psychiater, indien van toepassing volgens het vastgestelde model, bedoeld
      in het zesde lid, in een medische verklaring zijn bevindingen vermeldt inzake de actuele gezondheidstoestand van
      betrokkene, de noodzakelijk geachte vormen van verplichte zorg, en of de situatie, bedoeld in het eerste lid, zich
      voordoet, en

      b. betrokkene, zo mogelijk, in de gelegenheid heeft gesteld om te worden gehoord.

      4 De officier van justitie verstrekt de burgemeester desgevraagd gegevens over een voor betrokkene eerder afgegeven
      machtiging tot voortzetting van de inbewaringstelling of rechterlijke machtiging als afgegeven op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2], crisismaatregel, machtiging tot voortzetting van
      de crisismaatregel of zorgmachtiging.

      5 De officier van justitie verstrekt op aanvraag van de psychiater aan hem de gegevens, bedoeld in het vierde lid,
      en de politiegegevens als bedoeld in de [Wet politiegegevens][ref3] en de strafvorderlijke en justitiële gegevens
      als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref4] die relevant kunnen zijn voor de beoordeling
      van het ernstig nadeel. Verstrekking door de officier van justitie kan achterwege blijven indien het belang van
      enig strafrechtelijk onderzoek zich daartegen verzet.

      6 Bij regeling van Onze Minister kan een model voor een medische verklaring als bedoeld in het derde lid worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005700
      [ref3]: https://wetten.overheid.nl/BWBR0022463
      [ref4]: https://wetten.overheid.nl/BWBR0014194
