  - number: 10:2
    text: |-
      1 Ten behoeve van de vervulling van haar taak houdt de klachtencommissie zich in elk geval op de hoogte van
      de ontwikkelingen op het terrein van het verlenen van zorg en verplichte zorg aan personen met een psychische
      stoornis.

      2 De leden van de klachtencommissie zijn onafhankelijk en verrichten hun werkzaamheden zonder vooringenomenheid.

      3 De leden van de klachtencommissie behandelen geen klachten waarbij zij een relatie hebben tot de klager,
      betrokkene of de vertegenwoordiger.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de samenstelling
      en de werkwijze van de klachtencommissie.
