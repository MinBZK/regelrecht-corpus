  - number: 10:11
    text: |-
      1 Bij een verzoek als bedoeld in [artikel 10:3][ref1] kan verzoeker bij de klachtencommissie tevens om
      schadevergoeding door de zorgaanbieder verzoeken. De klachtencommissie kan ook ambtshalve tot schadevergoeding door
      de zorgaanbieder besluiten.

      2 Bij een verzoek als bedoeld in [artikel 10:7, eerste lid][ref2], kan verzoeker bij de rechter tevens om
      schadevergoeding door de zorgaanbieder verzoeken. De rechter kan op dit verzoek afzonderlijk beslissen en kan ook
      ambtshalve tot schadevergoeding door de zorgaanbieder besluiten.

      3 Voordat de klachtencommissie of de rechter beslist over het toekennen van schadevergoeding, hoort de
      klachtencommissie of de rechter de zorgaanbieder.

      4 De schadevergoeding, bedoeld in het eerste en tweede lid, wordt naar billijkheid vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel107
