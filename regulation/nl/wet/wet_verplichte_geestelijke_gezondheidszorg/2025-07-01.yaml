  - number: 13:3a
    text: |-
      1 Indien het ernstige vermoeden bestaat dat betrokkene, die zich aan de uitvoering van de
      verplichte zorg heeft onttrokken, in levensgevaar verkeert of een misdrijf als bedoeld in
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], zal plegen met ernstig nadeel voor hemzelf of
      een ander tot gevolg, kan de officier van justitie, na machtiging daartoe door de rechter-commissaris, met het oog
      op de vaststelling van de verblijfplaats van betrokkene een opsporingsambtenaar bevelen:

      a. een persoon stelselmatig te volgen of stelselmatig diens aanwezigheid of gedrag waar te nemen, zo nodig met
      behulp van een technisch hulpmiddel;

      b. vertrouwelijke communicatie die plaatsvindt met gebruikmaking van de diensten van een aanbieder van een
      communicatiedienst, op te nemen met een technisch hulpmiddel;

      c. gegevens te vorderen over een gebruiker van een communicatiedienst en het communicatieverkeer met betrekking tot
      die gebruiker. De vordering kan slechts betrekking hebben op gegevens die bij algemene maatregel van bestuur zijn
      aangewezen en kan gegevens betreffen die ten tijde van de vordering zijn verwerkt, dan wel na het tijdstip van de
      vordering worden verwerkt;

      d. gegevens te vorderen ter zake van naam, adres, postcode, woonplaats, nummer en soort dienst van een gebruiker
      van een communicatiedienst;

      e. met inachtneming van [artikel 3.22, derde en vierde lid, van de Telecommunicatiewet][ref2], met behulp van in
      dat artikel bedoelde apparatuur het nummer te verkrijgen waarmee de gebruiker van een communicatiedienst kan worden
      geïdentificeerd;

      f. gegevens te vorderen van degene die anders dan ten behoeve van persoonlijk gebruik gegevens verwerkt ter zake
      van naam, adres, postcode, woonplaats, postadres, geboortedatum, geslacht en administratieve kenmerken;

      g. gegevens te vorderen van degene van wie redelijkerwijs kan worden vermoed dat hij toegang heeft tot bepaalde
      opgeslagen of vastgelegde gegevens.

      2 Het bevel wordt gegeven voor een periode van ten hoogste een week. Het kan telkens voor een termijn van ten
      hoogste een week worden verlengd.

      3 Het bevel is schriftelijk en vermeldt:

      a. de naam van betrokkene;

      b. de feiten of omstandigheden waaruit blijkt dat de voorwaarden, bedoeld in het eerste lid, zijn vervuld;

      c. bij toepassing van het eerste lid, onderdeel a of c, de naam of een zo nauwkeurig mogelijke aanduiding van de
      bedoelde persoon;

      d. bij toepassing van het eerste lid, onderdeel b, zo mogelijk het nummer of een andere aanduiding waarmee de
      individuele gebruiker van de communicatiedienst wordt geïdentificeerd alsmede, voor zover bekend, de naam en het
      adres van de gebruiker;

      e. bij toepassing van het eerste lid, onderdeel a, een aanduiding van de aard van het technisch hulpmiddel of de
      technische hulpmiddelen waarmee de stelselmatige observatie plaatsvindt;

      f. bij toepassing van het eerste lid, onderdeel e, de naam of een zo nauwkeurig mogelijke aanduiding van de
      gebruiker van een communicatiedienst van wie het nummer moet worden verkregen;

      g. bij toepassing van het eerste lid, onderdelen f of g, de naam of een zo nauwkeurig mogelijke aanduiding van de
      persoon op wie de te verstrekken gegevens betrekking hebben;

      h. de wijze waarop aan het bevel uitvoering wordt gegeven, en;

      i. de geldigheidsduur van het bevel.

      4 Indien bij toepassing van het eerste lid, onderdeel b, het bevel betrekking heeft op communicatie die plaatsvindt
      via een openbaar telecommunicatienetwerk of met gebruikmaking van een openbare telecommunicatiedienst in de zin
      van de [Telecommunicatiewet][ref3], wordt – tenzij zulks niet mogelijk is – het bevel ten uitvoer gelegd met
      medewerking van de aanbieder van het openbare telecommunicatienetwerk of de openbare telecommunicatiedienst en gaat
      het bevel vergezeld van de vordering van de officier van justitie aan de aanbieder om medewerking te verlenen.

      5 Indien bij toepassing van het eerste lid, onderdeel b, het bevel betrekking heeft op andere communicatie
      dan bedoeld in het vierde lid, wordt – tenzij zulks niet mogelijk is – de aanbieder in de gelegenheid gesteld
      medewerking te verlenen bij de tenuitvoerlegging van het bevel.

      6 Het bevel wordt bij toepassing van het eerste lid, onderdeel e, gegeven aan een ambtenaar als bedoeld in
      [artikel 3.22, vierde lid, van de Telecommunicatiewet][ref4].

      7 Bij dringende noodzaak kan het bevel of de machtiging van de rechter-commissaris, bedoeld in het eerste lid,
      mondeling worden gegeven. In dat geval stelt de officier van justitie het bevel, of de rechter-commissaris de
      machtiging, binnen drie dagen op schrift.

      8 Zodra niet meer wordt voldaan aan de voorwaarden, bedoeld in het eerste lid, bepaalt de officier van justitie dat
      de uitvoering van het bevel wordt beëindigd.

      9 Het bevel kan schriftelijk en met redenen omkleed worden gewijzigd, aangevuld, verlengd of beëindigd.

      10 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld:

      a. over de wijze waarop het bevel wordt gegeven;

      b. over de wijze waarop de gegevens worden gevorderd;

      c. over de wijze waarop aan de vordering wordt voldaan;

      d. met betrekking tot de opsporingsambtenaar die de gegevens vordert.

      11 De officier van justitie doet van de verstrekking van gegevens, bedoeld in het eerste lid, onderdelen c, d, f en
      g proces-verbaal opmaken, waarin worden vermeld:

      a. de naam van betrokkene;

      b. de feiten of omstandigheden waaruit blijkt dat de voorwaarden, bedoeld in het eerste lid, zijn vervuld;

      c. indien bekend, de naam of anders een zo nauwkeurig mogelijke aanduiding van de persoon omtrent wie gegevens
      worden gevorderd;

      d. de verstrekte gegevens;

      e. de periode waarover de vordering zich uitstrekt.

      12 De vordering van gegevens, bedoeld in het eerste lid, onderdelen c, d, f en g, wordt beëindigd zodra niet meer
      wordt voldaan aan de voorwaarden, bedoeld in het eerste lid.

      13 Van een wijziging, aanvulling, verlenging of beëindiging van de vordering doet de officier van justitie proces-
      verbaal opmaken.

      14 De vordering bedoeld in het eerste lid, onderdelen f en g, kan geen betrekking hebben op persoonsgegevens
      betreffende iemands godsdienst of levensovertuiging, ras, politieke gezindheid, gezondheid, seksuele leven of
      lidmaatschap van een vakvereniging.

      15 De met de tenuitvoerlegging belaste ambtenaar kan ter aanhouding van betrokkene elke plaats betreden en
      doorzoeken.


