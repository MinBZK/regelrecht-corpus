  - number: 7:9
    text: |-
      De machtiging tot voorzetting van de crisismaatregel heeft een geldigheidsduur van drie weken na de dagtekening
      ervan.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel79
  - number: 7:10
    text: |-
      De machtiging tot voorzetting van de crisismaatregel vervalt indien:

      a. de geldigheidsduur is verstreken, tenzij de officier van justitie voordat de geldigheidsduur is
      verstreken een verzoekschrift voor een zorgmachtiging als bedoeld in [artikel 7:11, eerste lid][ref1],
      bij de rechter heeft ingediend, in welk geval de machtiging tot voorzetting van de crisismaatregel vervalt
      als de rechter op het verzoekschrift heeft beslist of door het verstrijken van de termijn, bedoeld in
      [artikel 6:2, eerste lid, onderdeel b][ref2], onderscheidenlijk, zodra de rechter onder toepassing van artikel 6:2,
      vierde lid, op het verzoekschrift heeft beslist;

      b. de geneesheer-directeur een beslissing als bedoeld in [artikel 8:18][ref3] heeft genomen tot beëindiging van het
      verlenen van alle vormen van verplichte zorg op grond van een machtiging tot voorzetting van de crisismaatregel,
      zonder dat daaraan voorwaarden of beperkingen zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel711
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0040635#Artikel818
