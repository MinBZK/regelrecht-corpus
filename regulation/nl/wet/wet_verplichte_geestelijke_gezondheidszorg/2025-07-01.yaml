    text: |-
      Verplichte zorg is zorg die ondanks verzet als bedoeld in [artikel 1:4][ref1] kan worden verleend op grond van een:

      a. zorgmachtiging;

      b. crisismaatregel;

      c. machtiging tot voortzetting van de crisismaatregel;

      d. beslissing tot tijdelijke verplichte zorg voorafgaand aan een crisismaatregel als bedoeld in
      [artikel 7:3][ref2];

      e. beslissing tot tijdelijke verplichte zorg in een noodsituatie als bedoeld in de [artikelen 8:11][ref3] en
      [8:12][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel14
