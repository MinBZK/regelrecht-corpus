  - number: 8:17
    text: |-
      1 De geneesheer-directeur neemt op een daartoe strekkende schriftelijke en gemotiveerde aanvraag van betrokkene,
      de vertegenwoordiger, de advocaat of de zorgverantwoordelijke, dan wel uit eigen beweging een schriftelijke en
      gemotiveerde beslissing, inhoudende het verlenen van tijdelijke onderbreking van de verplichte zorg op grond van
      een machtiging tot voortzetting van de crisismaatregel of zorgmachtiging aan betrokkene, voor zover en voor zolang
      dit verantwoord is.

      2 De geneesheer-directeur verzoekt Onze Minister van Veiligheid en Justitie schriftelijk om toestemming
      voor het nemen van een beslissing tot het verlenen van tijdelijke onderbreking van de verplichte zorg,
      houdende opname in een accommodatie, op grond van een zorgmachtiging die is afgegeven met toepassing van
      [artikel 2.3 van de Wet forensische zorg][ref1], behoudens de gevallen waarin artikel 2.3, onderdeel 3, is
      toegepast en betrokkene is vrijgesproken van hetgeen hem ten laste is gelegd.

      3 Onze Minister van Veiligheid en Justitie verstrekt de geneesheer-directeur zo spoedig mogelijk schriftelijk en
      gemotiveerd zijn beslissing.

      4 Indien de toestemming, bedoeld in het tweede lid, niet wordt gegeven, verleent de geneesheer-directeur geen
      tijdelijke onderbreking van de verplichte zorg en wijst hij de aanvraag af.

      5 De geneesheer-directeur kan aan de beslissing voorwaarden of beperkingen verbinden.

      6 De geneesheer-directeur geeft betrokkene, de vertegenwoordiger, de advocaat en de zorgverantwoordelijke
      een afschrift van de beslissing, indien van toepassing voorzien van de beoordeling van Onze Minister van
      Veiligheid en Justitie, en stelt hen uiterlijk binnen vier dagen na de beslissing schriftelijk in kennis van de
      klachtwaardigheid van de beslissing en de mogelijkheid van advies en bijstand door de patiëntenvertrouwenspersoon
      en de familievertrouwenspersoon.

      7 De geneesheer-directeur informeert tijdig de officier van justitie over de beslissing tot tijdelijke onderbreking
      van de verplichte zorg op grond van een machtiging tot verlenging van de crisismaatregel of zorgmachtiging.

      8 De geneesheer-directeur kan de voor de continuïteit van zorg voor betrokkene relevante familie en naasten en het
      college van burgemeester en wethouders van de gemeente waar betrokkene ingezetene is dan wel naar verwachting zal
      verblijven informeren over de tijdelijke onderbreking van de verplichte zorg op grond van de zorgmachtiging, indien
      dit noodzakelijk is omdat essentiële voorwaarden voor deelname aan het maatschappelijk verkeer van betrokkene
      ontbreken.

      9 De geneesheer-directeur kan op een daartoe strekkend schriftelijk en gemotiveerd verzoek of uit eigen beweging de
      beslissing tot tijdelijke onderbreking van de verplichte zorg schriftelijk en gemotiveerd intrekken. Het zesde en
      zevende lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2.3
