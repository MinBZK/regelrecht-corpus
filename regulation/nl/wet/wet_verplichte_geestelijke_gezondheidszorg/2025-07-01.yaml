  - number: 8:13
    text: |-
      1 De zorgverantwoordelijke stelt een beslissing als bedoeld in de [artikelen 8:11][ref1] en [8:12][ref2] op schrift
      en voorziet de beslissing van een schriftelijke motivering.

      2 De beslissing vermeldt het moment waarop de geneesheer-directeur en de zorgverantwoordelijke, de
      proportionaliteit, de subsidiariteit, de effectiviteit en de veiligheid van de tijdelijke verplichte zorg
      beoordelen.

      3 De geneesheer-directeur geeft betrokkene, de vertegenwoordiger en de advocaat een afschrift van de beslissing
      en stelt hen schriftelijk in kennis van de klachtwaardigheid van de beslissing en de mogelijkheid van advies en
      bijstand door de patiëntenvertrouwenspersoon en de familievertrouwenspersoon.


