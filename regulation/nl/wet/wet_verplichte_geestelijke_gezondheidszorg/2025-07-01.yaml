  - number: 8:30
    text: |-
      1 Onze Minister verwerkt gegevens die betrekking hebben op de verplichte zorg teneinde een zorgvuldig en
      samenhangend beleid ter zake te kunnen voeren en de stelselverantwoordelijkheid te kunnen waarborgen.

      2 De zorgaanbieder, het openbaar ministerie, het college van burgemeester en wethouders en de burgemeester
      verstrekken kosteloos gegevens aan Onze Minister ten behoeve van de verwerking, bedoeld in het eerste lid. Deze
      verstrekking kan zowel een incidenteel als een structureel karakter hebben.

      3 De gegevens, bedoeld in het eerste en tweede lid, kunnen persoonsgegevens zijn, inclusief het
      burgerservicenummer, voor zover deze gegevens noodzakelijk zijn voor de taak, bedoeld in het eerste lid.

      4 De gegevens, bedoeld in het eerste lid, worden niet verwerkt voor andere doeleinden dan aldaar bedoeld en worden
      daar waar mogelijk verwerkt op een wijze die waarborgt dat zij niet tot een persoon herleidbaar zijn.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud van de gegevens, bedoeld
      in het eerste, tweede en derde lid, de wijze waarop de verwerking en de verstrekking plaatsvindt, de tijdvakken
      waarop de gegevens die worden verwerkt betrekking hebben en de tijdstippen waarop de gegevens versterkt dienen te
      worden. Bij algemene maatregel van bestuur kan worden bepaald dat deze gegevens in plaats van aan Onze Minister
      op een bij of krachtens die maatregel aangewezen wijze verstrekt worden aan en verwerkt worden door een door Onze
      Minister aan te wijzen instantie.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel830
  - number: 8:31
    text: |-
      1 De officieren van justitie, de colleges van burgemeester en wethouders en de geneesheren-directeuren van
      zorgaanbieders die deel uitmaken van een regio voeren periodiek overleg met elkaar, de politie en overige
      ketenpartners in de zorg, over het aanbod van verplichte zorg in de regio, de knelpunten bij de voorbereiding
      daarop en de tenuitvoerlegging en de uitvoering ervan, waaronder in ieder geval begrepen de noodzakelijke
      gegevensverstrekking, alsmede het toezicht op de verplichte zorg.

      2 Het overleg, bedoeld in het eerste lid, vindt in ieder geval eenmaal per drie maanden plaats.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel831
  - number: 8:32
    text: |-
      1 Het openbaar ministerie bewaart de gegevens, bedoeld in [artikel 8:23, onderdelen a, b, c, en d][ref1], gedurende
      twintig jaar, te rekenen vanaf het tijdstip waarop de maatregel of machtiging wordt beëindigd.

      2 Het openbaar ministerie bewaart de in voorbereiding zijnde verzoekschriften en de afgewezen verzoekschriften,
      bedoeld in [artikel 8:23, onderdelen e, f en g][ref2], gedurende vijf jaar, te rekenen vanaf respectievelijk het
      tijdstip waarop de voorbereiding is beëindigd dan wel vanaf het moment van het treffen van de beschikking tot
      afwijzing.

      3 Het openbaar ministerie bewaart de aanvragen, de medische verklaringen, bevindingen en beslissingen, bedoeld in
      [artikel 8:23, onderdelen h tot en met k][ref3], gedurende één jaar, te rekenen vanaf respectievelijk het tijdstip
      waarop de officier van justitie besluit geen verzoekschrift voor een zorgmachtiging in te dienen dan wel vanaf het
      moment van verkrijging van de bedoelde gegevens. Het openbaar ministerie bewaart zelfbindingsverklaringen, bedoeld
      in [artikel 8:23, onderdeel l][ref4], gedurende één jaar, te rekenen vanaf het einde van de geldigheidsduur van
      de zelfbindingsverklaring.

      4 De zorgaanbieder, de geneesheer-directeur en de burgemeester bewaren de op grond van deze wet verkregen gegevens
      gedurende de termijn, bedoeld in [artikel 7:454 van het Burgerlijk Wetboek][ref5] te rekenen vanaf het tijdstip
      waarop de crisismaatregel, de voortzetting van de crisismaatregel, de zorgmachtiging of de verplichte zorg, bedoeld
      in [artikel 9:1, eerste lid, eerste volzin][ref6] wordt beëindigd.


