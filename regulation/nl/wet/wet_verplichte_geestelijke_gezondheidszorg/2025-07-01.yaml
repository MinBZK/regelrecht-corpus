  - number: 8:20
    text: |-
      1 De voorwaarden en beperkingen, bedoeld in de [artikelen 8:17, vijfde lid][ref1], en [8:18, achtste lid][ref2],
      betreffen de zorg aan en het gedrag van betrokkene, ter voorkoming van het ernstig nadeel.

      2 De voorwaarden en beperkingen kunnen ook inhouden dat betrokkene zich onder toezicht stelt van een zorgaanbieder
      of zorgverlener, die betrokkene hulp en steun verleent bij het naleven van de voorwaarden en beperkingen.

      3 De geneesheer-directeur raadpleegt de zorgverantwoordelijke over de noodzakelijk geachte voorwaarden of
      beperkingen.

      4 De geneesheer-directeur besluit slechts tot tijdelijke onderbreking of beëindiging van de verplichte zorg als
      betrokkene zich bereid heeft verklaard tot naleving van de voorwaarden of beperkingen en redelijkerwijs is aan te
      nemen dat betrokkene de voorwaarden zal naleven.


