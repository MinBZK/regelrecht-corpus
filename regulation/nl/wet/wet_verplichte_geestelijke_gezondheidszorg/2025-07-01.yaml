  - number: 1:3
    text: |-
      1 Als vertegenwoordiger ter zake van de uitoefening van de rechten en plichten op grond van deze wet van een
      betrokkene die jonger is dan zestien jaar, treedt of treden op: de ouders of voogden die gezamenlijk het gezag
      uitoefenen, of de ouder of voogd die alleen het gezag uitoefent.

      2 Als vertegenwoordiger ter zake van de uitoefening van de rechten en plichten op grond van deze wet van een
      betrokkene van zestien of zeventien jaar, treedt of treden op:

      a. de door betrokkene als zodanig gemachtigde, of

      b. indien betrokkene niet tot een redelijke waardering van zijn belangen ter zake van de uitoefening van deze
      rechten en plichten in staat is en niet meerderjarig is: de ouders of voogden die gezamenlijk het gezag uitoefenen,
      of de ouder of voogd die alleen het gezag uitoefent.

      3 Als vertegenwoordiger ter zake van de uitoefening van de rechten en plichten op grond van deze wet van een
      meerderjarige betrokkene treedt op:

      a. de door betrokkene als zodanig gemachtigde, of

      b. indien betrokkene niet tot een redelijke waardering van zijn belangen ter zake van de uitoefening van deze
      rechten en plichten in staat is:

        - de curator of mentor, of indien deze ontbreekt,
        - de gemachtigde, bedoeld onder a, of indien deze ontbreekt,
        - de echtgenoot, geregistreerde partner of andere levensgezel, of indien deze dat niet wenst of deze ontbreekt,
        - een ouder, kind, broer, zus, grootouder of kleinkind, tenzij deze dat niet wenst, of deze ontbreekt.

      4 Indien betrokkene niet tot een redelijke waardering van zijn belangen ter zake van de uitoefening
      van zijn rechten en plichten op grond van deze wet in staat is en geen vertegenwoordiger als bedoeld
      in de vorige leden optreedt, doet de zorgaanbieder een verzoek voor een mentorschap als bedoeld in
      [artikel 451, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1].

      5 De door betrokkene gemachtigde, bedoeld in het tweede en derde lid, dient meerderjarig en handelingsbekwaam te
      zijn en schriftelijk te verklaren, bereid te zijn om als vertegenwoordiger op te treden.

      6 Als gemachtigde, bedoeld in het tweede en derde lid, kunnen niet optreden:

      a. de zorgaanbieder,

      b. de geneesheer-directeur,

      c. de zorgverantwoordelijke,

      d. een zorgverlener, of

      e. een medewerker van de zorgaanbieder.

      7 De vertegenwoordiger betracht de zorg van een goed vertegenwoordiger en is gehouden betrokkene zoveel mogelijk
      bij de vervulling van zijn taak te betrekken.

      8 De meerderjarige betrokkene die onder curatele is gesteld of ten behoeve van wie een mentorschap is ingesteld,
      alsmede de minderjarige betrokkene zijn bekwaam om op grond van deze wet in rechte op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
