  - number: 8:28
    text: |-
      In afwijking van [artikel 8:34][ref1] en van [artikel 2:5 van de Algemene wet bestuursrecht][ref2] kunnen
      de zorgaanbieder, de geneesheer-directeur, de burgemeester en de officier van justitie zonder toestemming
      van betrokkene gegevens en bescheiden ten behoeve van statistiek of wetenschappelijk onderzoek aan een ander
      verstrekken, indien:

      a. het onderzoek voorziet in zodanige waarborgen dat de persoonlijke levenssfeer van betrokkene niet wordt
      geschaad,

      b. het onderzoek een zwaarwegend algemeen belang dient, en

      c. betrokkene niet uitdrukkelijk bezwaar heeft gemaakt tegen verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel834
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel25
