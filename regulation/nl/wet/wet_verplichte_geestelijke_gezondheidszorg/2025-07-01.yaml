  - number: 8:27
    text: |-
      1 De zorgverantwoordelijke verstrekt desgevraagd inzage in of afschrift van gegevens uit het dossier van een
      overleden betrokkene, bedoeld in [artikel 8:4][ref1], aan:

      a. een persoon ten behoeve van wie de betrokkene bij leven toestemming heeft gegeven indien die toestemming
      schriftelijk of elektronisch is vastgelegd;

      b. een nabestaande of een vertegenwoordiger, indien die nabestaande of die vertegenwoordiger een mededeling over
      een incident op grond van [artikel 10, derde lid, van de Wet kwaliteit, klachten en geschillen zorg][ref2] heeft
      gekregen;

      c. een ieder die een zwaarwegend belang heeft en aannemelijk maakt dat dit belang mogelijk wordt geschaad en dat
      inzage in of afschrift van gegevens uit het dossier noodzakelijk is voor de behartiging van dit belang.

      2 De zorgverantwoordelijke verstrekt aan degene of de instelling die het gezag uitoefende over de betrokkene die op
      het moment van overlijden de leeftijd van zestien jaar nog niet had bereikt, desgevraagd inzage in of afschrift van
      gegevens uit het dossier van deze betrokkene, tenzij dit in strijd is met de zorg van een goed zorgverlener.

      3 Op grond van dit artikel worden uitsluitend gegevens verstrekt voor zover deze betrekking hebben op de grond
      waarvoor inzage wordt verleend.

      4 Op grond van dit artikel worden geen gegevens verstrekt voor zover schriftelijk of elektronisch is vastgelegd
      dat de overleden betrokkene die de leeftijd van twaalf jaar had bereikt en tot een redelijke waardering van zijn
      belangen ter zake in staat was, deze inzage niet wenst, of daarbij de persoonlijke levenssfeer van een ander wordt
      geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel10
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel827
