  - number: 1:5
    text: |-
      1 Voor zover de zorgverantwoordelijke betrokkene niet in staat acht tot een redelijke waardering van zijn belangen
      ter zake van zorg of de uitoefening van rechten en plichten op grond van deze wet, legt hij dat schriftelijk vast
      en vermeldt daarbij de datum, het tijdstip en ter zake van welke beslissingen betrokkene niet in staat kan worden
      geacht tot een redelijke waardering van zijn belangen.

      2 De beslissing, bedoeld in het eerste lid, wordt door de zorgverantwoordelijke niet genomen dan na overleg met
      de vertegenwoordiger.

      3 De zorgverantwoordelijke stelt de geneesheer-directeur op de hoogte van de beslissing en het overleg met de
      vertegenwoordiger. Indien er geen vertegenwoordiger optreedt, stelt hij de geneesheer-directeur en de officier van
      justitie daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel15
  - number: 1:6
    text: |-
      1 In zaken betreffende deze wet, uitgezonderd [hoofdstuk 5, paragraaf 6][ref1] en [hoofdstuk 10][ref2], is
      uitsluitend bevoegd de rechter van de woonplaats van betrokkene, of van de plaats waar hij hoofdzakelijk of
      daadwerkelijk verblijft. Zaken met betrekking tot minderjarige personen worden behandeld door de kinderrechter of
      door een meervoudige kamer waarvan de kinderrechter deel uitmaakt.

      2 In zaken betreffende [hoofdstuk 5, paragraaf 6][ref3], is uitsluitend bevoegd de rechter die bevoegd
      is de in [artikel 2.3 van de Wet forensische zorg][ref4] opgenomen beslissingen te nemen op grond van het
      [Wetboek van Strafvordering][ref5] of het [Wetboek van Strafrecht][ref6].

      3 In zaken betreffende [hoofdstuk 10][ref7], is uitsluitend bevoegd de rechter van de plaats waar betrokkene
      verblijft. Zaken met betrekking tot minderjarige personen worden behandeld door de kinderrechter, of door een
      meervoudige kamer waarvan de kinderrechter deel uit maakt.

      4 De beschikking van de rechter is uitvoerbaar bij voorraad.


