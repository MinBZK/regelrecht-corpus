  - number: 8:8
    text: |-
      De zorgaanbieder draagt er zorg voor dat de zorgkaart van betrokkene, inclusief de bijlagen, bekend is bij de
      geneesheer-directeur en de zorgverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel88
  - number: 8:9
    text: |-
      1 De zorgverantwoordelijke neemt ter uitvoering van de crisismaatregel, machtiging tot voorzetting van de
      crisismaatregel of de zorgmachtiging een beslissing tot het verlenen van verplichte zorg niet dan nadat hij:

      a. zich op de hoogte heeft gesteld van de actuele gezondheidstoestand van betrokkene,

      b. met betrokkene over de voorgenomen beslissing overleg heeft gevoerd, en

      c. voor zover hij geen psychiater is, hierover overeenstemming heeft bereikt met de geneesheer-directeur.

      2 De zorgverantwoordelijke stelt een beslissing tot het verlenen van verplichte zorg op grond van de
      crisismaatregel, machtiging tot voorzetting van de crisismaatregel of de zorgmachtiging op schrift en voorziet de
      beslissing van een schriftelijke motivering.

      3 De geneesheer-directeur geeft betrokkene, de vertegenwoordiger en de advocaat een afschrift van de beslissing
      en stelt hen schriftelijk in kennis van de klachtwaardigheid van de beslissing en de mogelijkheid van advies en
      bijstand door de patiëntenvertrouwenspersoon en de familievertrouwenspersoon.

      4 Indien verplichte zorg anders dan strekkende tot opname in een accommodatie, op grond van een
      crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging wordt toegepast, legt de
      zorgverantwoordelijke, onverminderd het bepaalde in [artikel 1:5][ref1], na overleg met de vertegenwoordiger,
      schriftelijk vast in het dossier, bedoeld in [artikel 8:4][ref2], met vermelding van de datum en het tijdstip, of:

      a. betrokkene tot een redelijke waardering van zijn belangen ter zake in staat is, en

      b. er een acuut levensgevaar dreigt voor betrokkene dan wel er een aanzienlijk risico is voor een ander op
      levensgevaar, ernstig lichamelijk letsel, ernstige psychische, materiële, immateriële of financiële schade,
      ernstige verwaarlozing of maatschappelijke teloorgang, of om ernstig in zijn ontwikkeling te worden geschaad, dan
      wel de algemene veiligheid van personen of goederen in gevaar is.

      5 De zorgaanbieder, geneesheer-directeur en zorgverantwoordelijke leggen geen beperkingen op in het contact van
      betrokkene met de vertegenwoordiger, de inspectie of de justitiële autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel84
