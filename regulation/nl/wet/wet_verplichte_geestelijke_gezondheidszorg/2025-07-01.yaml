  - number: 6:4
    text: |-
      1 De rechter verleent een zorgmachtiging, indien naar zijn oordeel is voldaan aan de criteria
      voor verplichte zorg, bedoeld in [artikel 3:3][ref1], en het doel van verplichte zorg, bedoeld in
      [artikel 3:4, onderdelen b tot en met e][ref2].

      2 Indien de rechter van oordeel is dat aan de criteria voor verplichte zorg is voldaan, maar met de in het
      zorgplan of de medische verklaring opgenomen zorg het ernstig nadeel niet kan worden weggenomen, kan hij in de
      zorgmachtiging, in afwijking van het verzoekschrift, bedoeld in [artikel 5:17, eerste lid][ref3], of de bijlagen,
      bedoeld in artikel 5:17, derde tot en met vijfde lid, andere verplichte zorg of doelen van verplichte zorg opnemen,
      alsmede in de zorgmachtiging bepalen dat een ander zorgplan moet worden opgesteld.

      3 Indien de rechter een zorgmachtiging verleent tot opname in een accommodatie kan hij tevens in de
      zorgmachtiging bepalen dat betrokkene tijdelijk kan worden overgeplaatst naar een instelling als bedoeld in
      [artikel 3.1, eerste lid][ref4], of [artikel 3.3, eerste lid, van de Wet forensische zorg][ref5], indien de
      geneesheer-directeur dit noodzakelijk acht vanwege de veiligheid binnen de accommodatie. De duur van een tijdelijke
      overplaatsing wordt beperkt tot acht weken.

      4 Indien de rechter een zorgmachtiging verleent tot opname in een accommodatie kan hij in de zorgmachtiging
      bepalen dat betrokkene wordt opgenomen in een instelling als bedoeld in [artikel 3.1, eerste lid][ref6], of
      [artikel 3.3, eerste lid, van de Wet forensische zorg][ref7], indien hij dit noodzakelijk acht vanwege de
      veiligheid binnen de accommodatie.

      5 Indien de rechter een zorgmachtiging als bedoeld in de leden 3 en 4 verleent, behoudt betrokkene zijn
      rechtspositie op grond van deze wet. De rechter kan een zorgmachtiging als bedoeld in de leden 3 en 4
      evenwel slechts verlenen indien hij in die zorgmachtiging, voor de duur van de opname in een instelling als
      bedoeld in [artikel 3.1, eerste lid][ref8], of [artikel 3.3, eerste lid, van de Wet forensische zorg][ref9],
      [artikel 3.4 van de Wet forensische zorg][ref10], [artikel 42, vijfde lid][ref11] en [artikel 44][ref12], alsmede
      de [hoofdstukken V][ref13], [VI][ref14] en [VII van de Beginselenwet verpleging ter beschikking gestelden][ref15]
      van toepassing verklaart.

      6 De zorgmachtiging is bij voorraad uitvoerbaar.

      7 De griffie van de rechtbank zendt een afschrift van de beslissing van de rechter aan:

      a. betrokkene;

      b. de vertegenwoordiger;

      c. de advocaat;

      d. de ouders van een minderjarige betrokkene of een van hen, voor zover deze niet als vertegenwoordiger optreden
      dan wel optreedt;

      e. de echtgenoot, geregistreerde partner, degene met wie een samenlevingscontract is gesloten, levensgezel of
      degene die betrokkene verzorgt;

      f. de gezinsvoogdijwerker;

      g. de aanvrager, bedoeld in [artikel 5:3][ref16];

      h. de zorgaanbieder, de geneesheer-directeur, de zorgverantwoordelijke en de huisarts;

      i. de inspectie;

      j. de officier van justitie.

      8 Indien een zorgmachtiging strekkende tot opname in een accommodatie betrekking heeft op
      een minderjarige die onder toezicht is gesteld, geldt deze als machtiging, als bedoeld in
      [artikel 265b van Boek 1 van het Burgerlijk Wetboek][ref17].


