  - number: 7:6
    text: |-
      1 Betrokkene kan door middel van een schriftelijk en gemotiveerd verzoek binnen drie weken na de dag waarop de
      burgemeester de crisismaatregel heeft genomen, bij de rechter beroep instellen tegen de crisismaatregel.

      2 Met betrekking tot de behandeling van het beroep bij de rechter is
      [artikel 6:1, eerste, tweede, derde, vijfde lid, eerste en tweede volzin, zesde tot en met negende lid][ref1], van
      overeenkomstige toepassing. De rechter kan de burgemeester verplichten te verschijnen.

      3 Het instellen van beroep heeft geen schorsende werking.

      4 De rechter doet zo spoedig mogelijk, doch uiterlijk vier weken na indiening van het beroepschrift, uitspraak.

      5 De griffie van de rechtbank zendt een afschrift van de beslissing van de rechter aan:

      a. betrokkene;

      b. de vertegenwoordiger;

      c. de advocaat;

      d. de burgemeester;

      e. de geneesheer-directeur;

      f. de inspectie;

      g. de officier van justitie.

      6 Tegen de beslissing van de rechter, bedoeld in het vierde lid, staat geen hoger beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel61
