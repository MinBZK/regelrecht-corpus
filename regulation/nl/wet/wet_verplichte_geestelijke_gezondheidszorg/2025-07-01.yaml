  - number: 10:4
    text: |-
      1 De klachtencommissie behandelt de klacht zodanig dat een deskundige en zorgvuldige beslissing op de klacht is
      gewaarborgd.

      2 De behandeling van de klacht geschiedt overeenkomstig een door de klachtencommissie te treffen regeling, die in
      ieder geval waarborgt dat:

      a. aan de behandeling van de klacht niet wordt deelgenomen door een persoon tegen wiens beslissing de klacht is
      gericht;

      b. de klager en de persoon tegen wiens beslissing de klacht is gericht in staat worden gesteld te worden gehoord;

      c. het horen plaatsvindt op een locatie die op eenvoudige wijze bereikbaar is voor betrokkene;

      d. de klager en de persoon tegen wiens beslissing de klacht is gericht zich kunnen doen bijstaan door degenen die
      zij daarvoor hebben aangewezen;

      e. de persoonlijke levenssfeer van de betrokkenen zoveel mogelijk wordt beschermd.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel104
  - number: 10:5
    text: |-
      1 De klachtencommissie kan een beslissing waartegen de klacht is gericht, schorsen.

      2 De klachtencommissie neemt een schriftelijke en gemotiveerde beslissing binnen 14 dagen na ontvangst van de
      klacht.

      3 Indien de klacht een beslissing of de nakoming van een verplichting betreft die ten tijde van de indiening geen
      gevolg meer heeft of waaraan in de tijd dat de klacht bij de klachtencommissie aanhangig is het gevolg is komen te
      vervallen, neemt de klachtencommissie een schriftelijke en gemotiveerde beslissing binnen vier weken na ontvangst
      van de klacht.

      4 Een klacht kan buiten behandeling worden gelaten indien een gelijke klacht van eenzelfde persoon nog in
      behandeling is.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel105
  - number: 10:6
    text: |-
      1 De beslissing van de klachtencommissie strekt tot:

      a. onbevoegdverklaring van de klachtencommissie,

      b. niet-ontvankelijkverklaring van de klacht,

      c. ongegrondverklaring van de klacht, of

      d. gegrondverklaring van de klacht.

      2 De klachtencommissie verklaart een klacht niet-ontvankelijk, indien deze betrekking heeft op de inhoud van de
      crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging als zodanig.

      3 Indien de klachtencommissie de klacht tegen een beslissing gegrond verklaart, vernietigt zij de bestreden
      beslissing geheel of gedeeltelijk. Gehele of gedeeltelijke vernietiging brengt vernietiging van de rechtsgevolgen
      van de beslissing of het vernietigde gedeelte van de beslissing mee.

      4 Indien de klachtencommissie de klacht gegrond verklaart, kan zij een opdracht geven tot het nemen van een nieuwe
      beslissing of een andere handeling te verrichten met inachtneming van haar beslissing.

      5 De klachtencommissie kan een termijn stellen voor het nemen van een nieuwe beslissing of het verrichten van een
      andere handeling.

      6 De klachtencommissie deelt de beslissing mee aan de indiener van de klacht, betrokkene, de vertegenwoordiger, de
      advocaat, de geneesheer-directeur, de zorgaanbieder, de zorgverantwoordelijke, de inspectie.

      7 De klachtencommissie maakt de uitspraken over de aan de klachtencommissie voorgelegde klachten openbaar in
      zodanige vorm dat deze niet tot personen herleidbaar zijn, behoudens voor zover het de zorgaanbieder betreft.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel106
  - number: 10:7
    text: |-
      1 Nadat de klachtencommissie een beslissing heeft genomen of indien de klachtencommissie niet tijdig een beslissing
      heeft genomen, kan betrokkene, de vertegenwoordiger, de zorgaanbieder of een nabestaande van betrokkene een
      schriftelijk en gemotiveerd verzoekschrift indienen bij de rechter ter verkrijging van een beslissing over de
      klacht.

      2 De termijn voor het indienen van een verzoekschrift bedraagt zes weken na de dag waarop de beslissing van de
      klachtencommissie aan de verzoeker is meegedeeld, dan wel zes weken na de dag waarop de klachtencommissie uiterlijk
      een beslissing had moeten nemen.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel107
  - number: 10:8
    text: |-
      1 Voordat de rechter op het verzoekschrift beslist, stelt hij in ieder geval de verzoeker, betrokkene, de
      vertegenwoordiger, en de geneesheer-directeur of de zorgverantwoordelijke in de gelegenheid om te worden gehoord.

      2 [Artikel 6:1, tweede tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel61
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel108
