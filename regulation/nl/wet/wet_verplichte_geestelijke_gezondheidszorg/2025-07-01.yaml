    text: |-
      1 Bij de eerste opname in een accommodatie, bij de tenuitvoerlegging van een bevel als bedoeld in
      [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1], en voor zover dit anderszins
      noodzakelijk is voor de vaststelling van de identiteit wordt de identiteit vastgesteld van een persoon die
      krachtens een beslissing op grond van het [Wetboek van Strafvordering][ref2], het [Wetboek van Strafrecht][ref3],
      de [Penitentiaire beginselenwet][ref4], de [Beginselenwet verpleging ter beschikking gestelden][ref5] of de
      [Beginselenwet justitiële jeugdinrichtingen][ref6] in een accommodatie is geplaatst.

      2 Het vaststellen van de identiteit van de persoon, bedoeld in het eerste lid, omvat bij de eerste opname in een
      accommodatie het vragen naar zijn naam, voornamen, geboorteplaats en geboortedatum, het adres waarop hij in de
      gemeentelijke basisadministratie persoonsgegevens is ingeschreven en het adres van zijn feitelijke verblijfplaats
      buiten de accommodatie. In de gevallen waarin van betrokkene vingerafdrukken zijn genomen en verwerkt
      overeenkomstig het [Wetboek van Strafvordering][ref7] of de [Vreemdelingenwet 2000][ref8], omvat het vaststellen
      van zijn identiteit tevens het nemen van zijn vingerafdrukken en het vergelijken van die vingerafdrukken
      met de van hem verwerkte vingerafdrukken. In de andere gevallen omvat het vaststellen van zijn identiteit
      een onderzoek van het identiteitsbewijs, bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref9].
      [Artikel 29c, tweede lid, van het Wetboek van Strafvordering][ref10] is van overeenkomstige toepassing.

      3 Bij de tenuitvoerlegging van een bevel als bedoeld in
      [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref11] worden van de persoon, bedoeld
      in het eerste lid, een of meer vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref12] genomen en
      verwerkt en is het tweede lid, tweede en derde volzin, van overeenkomstige toepassing. In een ander geval waarin
      het noodzakelijk is de identiteit van de persoon, bedoeld in het eerste lid, vast te stellen, is het tweede lid,
      tweede en derde volzin, van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het verwerken van de persoonsgegeven,
      bedoeld in het tweede en derde lid.


