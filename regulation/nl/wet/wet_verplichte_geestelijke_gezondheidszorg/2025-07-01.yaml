  - number: 9:2
    text: |-
      Indien de geneesheer-directeur van oordeel is dat voldaan is aan de criteria voor het verlenen van verlof of
      ontslag, dan wel dat betrokkene, aan wie tevens een justitiële titel die strekt tot vrijheidsbeneming is opgelegd,
      in aanmerking komt voor overplaatsing, verzoekt hij Onze Minister van Veiligheid en Justitie daartoe een beslissing
      te nemen. Onze Minister van Veiligheid en Justitie neemt zo spoedig mogelijk een beslissing. Hij betrekt daarbij
      de overwegingen en de voorwaarden die de geneesheer-directeur ingevolge de [artikelen 8:16 tot en met 8:18][ref1]
      nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel816
