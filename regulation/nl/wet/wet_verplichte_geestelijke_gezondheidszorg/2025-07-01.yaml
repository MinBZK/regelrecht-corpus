      1 Onder de gegevens die op grond van deze wet worden verwerkt, dan wel kunnen worden verwerkt, worden
      justitiële en strafvorderlijke gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1],
      politiegegevens als bedoeld in de [Wet politiegegevens][ref2] en gegevens over gezondheid als bedoeld
      in artikel 4, onderdeel 15 van de Algemene verordening gegevensbescherming begrepen. De geneesheer-
      directeur, de zorgverantwoordelijke, de burgemeester, de politie, de officier van justitie en inspectie
      vermelden bij het verstrekken van persoonsgegevens aan elkaar tevens het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3], van betrokkene.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop de
      gegevensverwerkingen die voortvloeien uit deze wet worden ingericht en met aanvullende waarborgen worden omkleed,
      waaronder begrepen de technische standaarden daarvoor.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


