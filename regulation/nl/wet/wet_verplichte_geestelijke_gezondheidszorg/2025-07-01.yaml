preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen voor het als uiterste middel verlenen
    van verplichte zorg op maat aan personen met een psychische stoornis, die aansluiten bij ontwikkelingen in de
    geestelijke gezondheidszorg en internationale ontwikkelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *accommodatie:* bouwkundige voorziening of een deel van een bouwkundige voorziening met het daarbij behorende
      terrein van een zorgaanbieder waar zorg wordt verleend;
        - *advocaat:* advocaat als bedoeld in [artikel 9a van de Advocatenwet][ref1];
        - *bestuur van de raad voor rechtsbijstand:* bestuur van de raad voor rechtsbijstand als bedoeld in
      [hoofdstuk II van de Wet op de rechtsbijstand][ref2];
        - *crisismaatregel:* door de burgemeester opgelegde maatregel als bedoeld in [artikel 7:1][ref3] om verplichte zorg
      te verlenen;
        - *criteria voor verplichte zorg:* criteria als bedoeld in [artikel 3:3][ref4];
        - *doel van verplichte zorg:* doel als bedoeld in [artikel 3:4][ref5];
        - *familievertrouwenspersoon:* familievertrouwenspersoon als bedoeld in [artikel 12:1][ref6];
        - *geneesheer-directeur:* arts als bedoeld in de [Wet op de beroepen in de individuele gezondheidszorg][ref7],
      aangewezen door en in dienst van de zorgaanbieder en verantwoordelijk voor de algemene gang van zaken op het
      terrein van zorg en de verlening van verplichte zorg;
        - *gezinsvoogdijwerker:* medewerker van een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref8], belast met het uitvoeren van de ondertoezichtstelling, bedoeld in
      [artikel 255 van Boek 1 van het Burgerlijk Wetboek][ref9] en de voorlopige ondertoezichtstelling, bedoeld in
      [artikel van 257 van Boek 1 van het Burgerlijk Wetboek][ref10];
        - *huisregels:* huisregels als bedoeld in [artikel 8:15][ref11];
        - *inspectie:* Inspectie gezondheidszorg en jeugd;
        - *klachtencommissie:* klachtencommissie als bedoeld in [artikel 10:1][ref12];
        - *klachtprocedure:* klachtprocedure als bedoeld in [artikel 10:3][ref13];
        - *machtiging tot voorzetting van de crisismaatregel:* rechterlijke machtiging om de crisismaatregel voort te
      zetten;
        - *nabestaande:* nabestaande als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref14];
        - *patiëntenvertrouwenspersoon:* patiëntenvertrouwenspersoon als bedoeld in [artikel 11:1][ref15];
        - *regio:* regio als bedoeld in [artikel 8 van de Wet veiligheidsregio’s][ref16];
        - *tenuitvoerlegging:* er voor zorg dragen dat de zorgaanbieder kan beginnen met de uitvoering van de
      crisismaatregel, machtiging tot voortzetting van de crisismaatregel of zorgmachtiging;
        - *verplichte zorg:* zorg als bedoeld in [artikel 3:1][ref17] en [artikel 3:2, tweede lid][ref18];
        - *vertegenwoordiger:* vertegenwoordiger als bedoeld in [artikel 1:3][ref19];
        - *zorg:* zorg als bedoeld in [artikel 3:2, eerste lid][ref20];
        - *zorgaanbieder:* een rechtspersoon die bedrijfsmatig of beroepsmatig zorg als bedoeld in [artikel 3:2][ref21]
      verleent, een organisatorisch verband van natuurlijke personen die bedrijfsmatig of beroepsmatig zorg als bedoeld
      in artikel 3:2 verlenen of doen verlenen, of een natuurlijk persoon die bedrijfsmatig zorg als bedoeld in artikel
      3:2 doet verlenen;
        - *zorgkaart:* zorgkaart als bedoeld in [artikel 5:12][ref22];
        - *zorgmachtiging:* rechterlijke machtiging om verplichte zorg te verlenen;
        - *zorgplan:* zorgplan als bedoeld in [artikel 5:13][ref23] of [artikel 9:4][ref24];
        - *zorgverantwoordelijke:* degene die een geregistreerd beroep uitoefent als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref25] en die behoort tot een bij regeling
      van Onze Minister aangewezen categorie van deskundigen, verantwoordelijk voor de zorg;
        - *zorgverlener:* een natuurlijke persoon die beroepsmatig zorg verleent.

      2 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder «ernstig nadeel» verstaan, het
      bestaan van of het aanzienlijk risico op:

      a. levensgevaar, ernstig lichamelijk letsel, ernstige psychische, materiële, immateriële of financiële schade,
      ernstige verwaarlozing of maatschappelijke teloorgang, ernstig verstoorde ontwikkeling voor of van betrokkene of
      een ander;

      b. bedreiging van de veiligheid van betrokkene al dan niet doordat hij onder invloed van een ander raakt;

      c. de situatie dat betrokkene met hinderlijk gedrag agressie van anderen oproept;

      d. de situatie dat de algemene veiligheid van personen of goederen in gevaar is.

      3 Een op grond van deze wet voor betrokkene afgegeven zorgmachtiging tot opname in een accommodatie
      schorst een eerdere voor deze persoon afgegeven rechterlijke machtiging op grond van de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref26] zodra betrokkene is opgenomen
      in een accommodatie. De schorsing eindigt op het moment dat de zorgmachtiging vervalt.

      4 Een op grond van deze wet voor betrokkene afgegeven zorgmachtiging tot opname in een accommodatie schorst een
      eerdere voor deze persoon afgegeven rechterlijke machtiging op grond van [hoofdstuk 6 van de Jeugdwet][ref27] zodra
      betrokkene is opgenomen in een accommodatie. De schorsing eindigt op het moment dat de zorgmachtiging vervalt. Bij
      toepassing van deze bepaling is [artikel 6.1.12, derde lid, van de Jeugdwet][ref28] niet van toepassing.


