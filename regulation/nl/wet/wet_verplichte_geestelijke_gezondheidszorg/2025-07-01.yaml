  - number: 7:3
    text: |-
      1 Voorafgaand aan de beslissing over een crisismaatregel kan, indien redelijkerwijs mag worden verondersteld dat
      een crisismaatregel zal worden genomen, gedurende korte tijd verplichte zorg aan een persoon worden verleend.

      2 De verplichte zorg, bedoeld in het eerste lid, wordt alleen als uiterste middel verleend indien dit noodzakelijk
      is in verband met de voorbereiding van de crisismaatregel en uitsluitend gedurende de periode die nodig is om de
      procedure voor de crisismaatregel af te ronden. Deze periode bedraagt als geheel ten hoogste achttien uur, en niet
      meer dan twaalf uur te rekenen vanaf het moment dat betrokkene door een psychiater wordt onderzocht ten behoeve van
      de medische verklaring.

      3 De verplichte zorg, bedoeld in het eerste lid, kan, teneinde te laten onderzoeken of een crisismaatregel moet
      worden genomen en in afwachting van het nemen van de crisismaatregel, tevens inhouden dat een persoon zijn vrijheid
      wordt ontnomen en hij onverwijld wordt overgebracht naar een plaats die geschikt is voor tijdelijk verblijf.

      4 De bevoegdheid, bedoeld in het eerste en derde lid, komt uitsluitend toe aan:

      a. degene die is belast met de uitvoering van de ambulancezorg, bedoeld in
      [artikel 5, eerste lid, onder c, d en e, van de Wet ambulancezorgvoorzieningen][ref1];

      b. de zorgaanbieder, de geneesheer-directeur en de zorgverantwoordelijke;

      c. personen behorende tot door Onze Minister aangewezen categorieën van deskundigen;

      d. een ambtenaar van politie die is aangesteld voor de uitoefening van de politietaak.

      5 De ambtenaar van politie, bedoeld in het vierde lid, onderdeel d, is niet bevoegd tot het verlenen van de
      verplichte zorg, bedoeld in [artikel 3:2, tweede lid, onderdeel a][ref2].

      6 Het onderbrengen van betrokkene bij de politie of de Koninklijke marechaussee vindt uitsluitend plaats indien
      betrokkene wordt verdacht van het plegen van een strafbaar feit.

      7 De personen, bedoeld in het vierde lid, informeren de zorgaanbieder en de burgemeester van een maatregel als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel32
