  - number: 8:4
    text: |-
      1 De zorgverantwoordelijke draagt er, onverminderd [artikel 454 van Boek 7 van het Burgerlijk Wetboek][ref1], zorg
      voor dat in het dossier van betrokkene aantekening wordt gehouden van:

      a. de zorgaanbieder;

      b. de naam van de geneesheer-directeur;

      c. de naam van de zorgverantwoordelijke;

      d. de vertegenwoordiger;

      e. de voor continuïteit van zorg relevante familie en naasten;

      f. de zorgkaart;

      g. het zorgplan;

      h. indien er geen overeenstemming over het zorgplan is bereikt, de redenen daarvoor;

      i. de voortgang van de uitvoering van het zorgplan;

      j. de verplichte zorg die op grond van de crisismaatregel, machtiging tot voortzetting van de
      crisismaatregel, zorgmachtiging, [artikel 7:3][ref2] of [artikel 8:11][ref3] wordt verleend;

      k. de behandeling op grond van [artikel 9:6][ref4], het toepassen van middelen of maatregelen als bedoeld in
      [artikel 9:8, eerste lid][ref5], of het opleggen van beperkingen als bedoeld in [artikel 9:9][ref6];

      l. het verslag van de periodieke toetsing van de proportionaliteit, subsidiariteit, effectiviteit en veiligheid van
      de verleende zorg en verplichte zorg;

      m. een afschrift van de medische verklaring, bedoeld in [artikel 5:8][ref7], [7:1][ref8], [7:11][ref9] of
      [8:19][ref10];

      n. een afschrift van de crisismaatregel, machtiging tot voorzetting van de crisismaatregel of zorgmachtiging;

      o. de zelfbindingsverklaring;

      p. het plan, bedoeld in [artikel 5:5, eerste lid][ref11];

      q. andere schriftelijke wilsuitingen inzake zorg, dan bedoeld in onderdeel f, o of p.

      2 In het dossier houdt de zorgverantwoordelijke tevens aantekening van de verstrekking van gegevens zonder
      toestemming van betrokkene door de geneesheer-directeur, de burgemeester, de politie, de officier van justitie, en
      de zorgverantwoordelijke zelf, bedoeld in [artikel 8:29][ref12].

      3 In afwijking van [artikel 455 van Boek 7 van het Burgerlijk Wetboek][ref13] vernietigt de zorgverantwoordelijke
      het dossier niet indien de zorgverantwoordelijke redelijkerwijs mag aannemen dat bewaring van het dossier van
      aanmerkelijk belang is voor betrokkene.


