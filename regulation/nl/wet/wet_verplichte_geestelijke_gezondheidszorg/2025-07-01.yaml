  - number: 7:4
    text: |-
      De burgemeester bepaalt de geldigheidsduur van de crisismaatregel, die ten hoogste drie dagen bedraagt. Indien de
      termijn, bedoeld in de eerste volzin, eindigt op een zaterdag, zondag of algemeen erkende feestdag als bedoeld in
      de [Algemene termijnenwet][ref1], wordt deze verlengd tot en met de eerstvolgende dag die niet een zaterdag, zondag
      of algemeen erkende feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 7:5
    text: |-
      De crisismaatregel vervalt, indien:

      a. de geldigheidsduur is verstreken, tenzij de officier van justitie voordat de geldigheidsduur is verstreken
      een verzoekschrift voor een machtiging tot voorzetting van de crisismaatregel bij de rechter onder toepassing van
      [artikel 7:7][ref1] heeft ingediend, in welk geval de crisismaatregel vervalt als de rechter op het verzoekschrift
      heeft beslist of door het verstrijken van de termijn, bedoeld in [artikel 7:8, derde lid][ref2];

      b. de geneesheer-directeur een beslissing als bedoeld in [artikel 8:18, tweede lid][ref3], heeft genomen tot
      beëindiging van het verlenen van alle vormen van verplichte zorg op grond van een crisismaatregel, zonder dat
      daaraan voorwaarden of beperkingen zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0040635#Artikel818
