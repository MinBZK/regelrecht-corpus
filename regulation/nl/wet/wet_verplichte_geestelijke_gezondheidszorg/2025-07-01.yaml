  - number: 9:8
    text: |-
      1 De zorgverantwoordelijke kan, indien er sprake is van verzet als bedoeld in [artikel 1:4][ref1], beslissen
      tot het toepassen van middelen of maatregelen waar het zorgplan met inachtneming van de [artikelen 9:5][ref2] en
      [9:6][ref3] niet in voorziet, voor zover dit tijdelijk ter afwending van een noodsituatie, die door betrokkene in
      de accommodatie als gevolg van de psychische stoornis wordt veroorzaakt, noodzakelijk is gelet op:

      a. ernstig nadeel voor betrokkene of anderen,

      b. de veiligheid binnen de accommodatie,

      c. de bescherming van rechten en vrijheden van anderen, of

      d. de voorkoming van strafbare feiten.

      2 De [artikelen 8:12, eerste en tweede lid][ref4], en [8:13][ref5] zijn van overeenkomstige toepassing.

      3 De middelen en maatregelen, bedoeld in het eerste lid, worden bij algemene maatregel van bestuur aangewezen.


