  - number: 13:5
    text: |-
      1 Met gevangenisstraf van ten hoogste drie jaar of een geldboete van de derde categorie wordt gestraft hij, die
      opzettelijk iemand van zijn vrijheid berooft of doet beroven door deze persoon tegen zijn wil op te nemen of
      te laten opnemen in een accommodatie, zonder dat daar een crisismaatregel, machtiging tot voortzetting van de
      crisismaatregel of zorgmachtiging aan ten grondslag ligt of de [artikelen 7:3][ref1], [8:11 tot en met 8:13][ref2],
      of [9:1, eerste lid, eerste volzin][ref3], van toepassing zijn.

      2 Met gevangenisstraf van ten hoogste drie jaar of een geldboete van de derde categorie wordt gestraft
      hij, die opzettelijk verplichte zorg verleent, zonder dat daar een crisismaatregel, machtiging tot
      voortzetting van de crisismaatregel of zorgmachtiging aan ten grondslag ligt, of de [artikelen 7:3][ref4] of
      [8:11 tot en met 8:13][ref5] van toepassing zijn.

      3 De in het eerste en tweede lid strafbaar gestelde feiten zijn misdrijven.


