  - number: 6:5
    text: |-
      De rechter verleent een zorgmachtiging voor de duur die noodzakelijk is om het doel van verplichte zorg te
      realiseren, maar maximaal voor:

      a. zes maanden, indien het doel van verplichte zorg de gronden, bedoeld in
      [artikel 3:4, onderdelen b, c, d en e][ref1], betreft;

      b. twaalf maanden, indien het een zorgmachtiging betreft die aansluit op een
      zorgmachtiging als bedoeld in onderdeel a, of een rechterlijke machtiging op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2], zoals die luidde voor inwerkingtreding van deze
      wet, dan wel een plaatsing op grond van [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref3], zoals dat
      artikellid luidde voor inwerkingtreding van de Wet verplichte geestelijke gezondheidszorg;

      c. twee jaar, indien het een aansluitende zorgmachtiging betreft voor een persoon die gedurende de afgelopen vijf
      jaar:

      1°. verplichte zorg heeft ontvangen;

      2°. opgenomen is geweest, respectievelijk zorg heeft ontvangen op grond van een eerder afgegeven
      machtiging tot voortzetting van de inbewaringstelling of rechterlijke machtiging op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref4], zoals die luidde voor inwerkingtreding van deze
      wet; of

      3°. is geplaatst op grond van [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref5], zoals dat artikellid
      luidde voor inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel34
