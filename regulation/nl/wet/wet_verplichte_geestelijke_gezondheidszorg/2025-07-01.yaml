  - number: 8:3
    text: |-
      1 De zorgaanbieder informeert betrokkene en de vertegenwoordiger zo spoedig mogelijk na de afgifte van de
      crisismaatregel, de machtiging tot voorzetting van de crisismaatregel of de zorgmachtiging schriftelijk over:

      a. de geneesheer-directeur;

      b. de zorgverantwoordelijke;

      c. de mogelijkheid tot advies en bijstand door een patiëntenvertrouwenspersoon;

      d. de familievertrouwenspersoon;

      e. de klachtregeling, bedoeld in [hoofdstuk 10][ref1];

      f. de huisregels;

      g. de richtlijnen, bedoeld in [artikel 8:5][ref2];

      h. de overige bij of krachtens deze wet omschreven rechten en plichten van betrokkene.

      2 De zorgverantwoordelijke informeert betrokkene en de vertegenwoordiger zo spoedig mogelijk na de afgifte van de
      crisismaatregel, de machtiging tot voorzetting van de crisismaatregel of de zorgmachtiging schriftelijk over het
      dossier van betrokkene, bedoeld in [artikel 8:4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Hoofdstuk10
