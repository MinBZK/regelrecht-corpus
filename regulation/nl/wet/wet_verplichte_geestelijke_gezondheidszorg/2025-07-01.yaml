  - number: 8:21
    text: |-
      1 De zorgverantwoordelijke, betrokkene en de vertegenwoordiger evalueren de uitvoering van de crisismaatregel, de
      machtiging tot voortzetting van de crisismaatregel of de zorgmachtiging, indien het voornemen bestaat de verplichte
      zorg te beëindigen.

      2 De zorgverantwoordelijke en betrokkene stellen indien gewenst op basis van deze evaluatie een
      zelfbindingsverklaring op en passen zo nodig de zorgkaart van betrokkene aan.

      3 De zorgverantwoordelijke wijst betrokkene op de mogelijkheid om het plan, bedoeld in [artikel 5:5][ref1], te
      evalueren en zo nodig aan te passen.


