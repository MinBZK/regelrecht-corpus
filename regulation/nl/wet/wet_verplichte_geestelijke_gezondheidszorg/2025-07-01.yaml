  - number: 9:5
    text: |-
      Behandeling van betrokkene vindt slechts plaats:

      a. voor zover deze is voorzien in het zorgplan,

      b. indien het overleg over het zorgplan tot overeenstemming heeft geleid, en

      c. indien betrokkene of de vertegenwoordiger zich niet tegen behandeling verzet.
    url: https://wetten.overheid.nl/BWBR0040635/2025-07-01#Artikel95
  - number: 9:6
    text: |-
      1 Indien niet wordt voldaan aan de voorwaarden van [artikel 9:5, onderdelen b en c][ref1], kan niettemin
      behandeling plaatsvinden:

      a. voor zover aannemelijk is dat zonder die behandeling het ernstig nadeel dat de psychische stoornis van
      betrokkene doet veroorzaken niet binnen een redelijke termijn kan worden weggenomen, of

      b. voor zover dit volstrekt noodzakelijk is om het ernstig nadeel dat de psychische stoornis van betrokkene binnen
      een accommodatie doet veroorzaken, af te wenden.

      2 Behandeling overeenkomstig het eerste lid vindt plaats krachtens een schriftelijke en gemotiveerde beslissing van
      de zorgverantwoordelijke.

      3 [Artikel 8:9][ref2] is van overeenkomstige toepassing op de behandeling.

      4 Bij een behandeling als bedoeld in het eerste lid, onderdeel a, wordt in de beslissing, bedoeld in het tweede
      lid, vermeld voor welke termijn zij geldt. De termijn is zo kort mogelijk maar niet langer dan drie maanden,
      gerekend vanaf de dag waarop de beslissing tot stand komt.

      5 Indien binnen zes maanden na afloop van de termijn, bedoeld in het vierde lid, voortzetting van de behandeling of
      opnieuw een behandeling overeenkomstig het eerste lid, onderdeel a, nodig is, geschiedt dit slechts krachtens een
      schriftelijke beslissing van de geneesheer-directeur. De geneesheer-directeur geeft in zijn beslissing aan waarom
      van een behandeling alsnog het beoogde effect wordt verwacht. Op zodanige beslissingen is het vierde lid, tweede
      volzin, van toepassing.

      6 Bij algemene maatregel van bestuur kunnen middelen of maatregelen worden aangewezen die niet mogen worden
      toegepast bij een behandeling als bedoeld in het eerste lid. Bij algemene maatregel van bestuur kunnen voorts ten
      aanzien van daarbij aangegeven middelen of maatregelen regels worden gesteld met betrekking tot de wijze waarop tot
      toepassing daarvan moet worden besloten.

      7 De geneesheer-directeur stelt de vertegenwoordiger en de advocaat zo spoedig mogelijk schriftelijk op de hoogte
      van een behandeling als bedoeld in het eerste lid en van de voortzetting van de behandeling, bedoeld in het vijfde
      lid, en stelt hen schriftelijk in kennis van de klachtwaardigheid van de beslissing en de mogelijkheid van advies
      en bijstand door de patiëntenvertrouwenspersoon en familievertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel89
