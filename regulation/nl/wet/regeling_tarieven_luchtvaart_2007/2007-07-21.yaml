      Deze regeling treedt in werking met ingang van 1 januari 2007. Indien de Staatscourant, waarin deze regeling wordt
      geplaatst, wordt uitgegeven na 31 december 2006, treedt zij in werking met ingang van de tweede dag na dagtekening
      van de Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020735/2007-07-21#Artikel28
  - number: '29'
    text: |-
      Deze regeling wordt aangehaald als: Regeling tarieven luchtvaart 2007.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0020735/2007-07-21#Artikel29
