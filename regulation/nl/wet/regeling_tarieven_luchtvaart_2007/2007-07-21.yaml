articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. vast tarief: hoogte van de vergoeding die niet afhankelijk is van de tijdsbesteding;

      b. uurtarief: hoogte van de vergoeding die per uur per persoon is besteed met betrekking tot werkzaamheden als
      bedoeld in deze regeling;

      c. [Verordening (EG) 1592/2002](32002R1592): de [verordening (EG) nr. 1592/2002](32002R1592) van het Europees
      Parlement en de Raad van de Europese Unie van 15 juli 2002 tot vaststelling van gemeenschappelijke regels op het
      gebied van de burgerluchtvaart en tot oprichting van een Europees Agentschap voor de veiligheid van de luchtvaart
      (PbEG L 240).
    url: https://wetten.overheid.nl/BWBR0020735/2007-07-21#Artikel1
  - number: '2'
    text: |-
      1 In geval van een vast tarief wordt het bedrag binnen 30 kalenderdagen na verzending van het betalingsverzoek
      voldaan. Het betalingsverzoek wordt gedaan zodra een aanvraag is ontvangen. Een beslissing op een aanvraag waaraan
      een vast tarief is verbonden wordt genomen, nadat gebleken is dat de verschuldigde vergoeding betaald is.

      2 In geval van een uurtarief worden de werkzaamheden periodiek gefactureerd op basis van het werkelijk aantal
      bestede uren. De te betalen vergoeding wordt achteraf vastgesteld door het aantal bestede uren te vermenigvuldigen
      met het uurtarief. De aanvrager voldoet elke ontvangen factuur binnen 30 kalenderdagen na verzending van het
      betalingsverzoek.

      3 Betaling van de in rekening gebracht vergoedingen geschiedt op de volgende wijze:

      a. met betrekking tot *examens en brevetten*: op bankrekeningnummer 19.23.23.741, t.n.v. IVW, o.v.v. luchtvaart,
      bewijzen van bevoegdheid;

      b. met betrekking tot *Luchtvaartbewijzen, Geluidsverklaringen, Geluidscertificaten, Aircraft Maintenance
      Licences en examens voor onderhoudstechnici*: op bankrekeningnummer 19.23.23.768, t.n.v. IVW, o.v.v. luchtvaart,
      luchtvaartbewijzen;

      c. met betrekking tot alle overige in deze regeling genoemde besluiten: op bankrekeningnummer 19.23.23.733, t.n.v.
      IVW, o.v.v. luchtvaart, overige ontvangsten luchtvaart/rail.
    url: https://wetten.overheid.nl/BWBR0020735/2007-07-21#Artikel2
  - number: '3'
    text: |-
      1 Buitenlandse reis- en verblijfkosten die verband houden met de in deze regeling genoemde handelingen of
      werkzaamheden, worden tegen de werkelijke kosten in rekening gebracht en zijn separaat verschuldigd naast de in
      deze regeling genoemde tarieven. Binnenlandse reis- en verblijfkosten worden niet separaat in rekening gebracht.

      2 Reistijden die verband houden met de in deze regeling genoemde uitgevoerde handelingen of werkzaamheden en die
      ter plaatse worden uitgevoerd, worden – voor zover deze op uurbasis worden verricht – in rekening gebracht volgens
      de daarbij behorende tarieven. De in rekening te brengen reistijd voor reizen binnen Nederland bedraagt ten hoogste
      de duur van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020735/2007-07-21#Artikel3
