      verschuldigd:

      a. ATPL;

      b. CPL (uitgezonderd CPL (FB));

      c. IR.

      2 Voor het afleggen van theorie-examens als bedoeld in het [Examenreglement voor luchtvarenden 2004][ref2] voor de
      volgende bewijzen van bevoegdheid is een vast tarief van € 90 per vak verschuldigd:

      a. RPL;

      b. PPL;

      c. CPL(FB).


