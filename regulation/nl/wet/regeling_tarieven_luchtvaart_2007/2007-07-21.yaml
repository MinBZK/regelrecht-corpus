  - number: '24'
    text: |-
      1 Voor de behandeling van een aanvraag om ontheffing te verlenen van het verbod als bedoeld in:

      a. [artikel 3.8, eerste lid, onderdeel a, van de Wet luchtvaart][ref1] om de luchtvaart uit te oefenen met een
      luchtvaartuig, dat niet luchtwaardig is, is een vast tarief verschuldigd van € 200;

      b. [artikel 3.8, eerste lid, onderdeel b, van de Wet luchtvaart][ref2] om de luchtvaart uit te oefenen met een
      luchtvaartuig dat niet is voorzien van een geldig bewijs van luchtwaardigheid, is een vast tarief verschuldigd
      van € 68;

      c. [artikel 14, eerste lid, van de Luchtvaartwet][ref3] om met een luchtvaartuig van of op een niet als
      luchtvaartterrein aangewezen terrein op te stijgen of te landen of dit terrein in te richten voor het opstijgen of
      landen van luchtvaartuigen is een vast tarief verschuldigd van € 500;

      d. [artikel 16d, van de Luchtvaartwet][ref4] om luchtvervoer te mogen uitvoeren zonder vergunning is een vast
      tarief verschuldigd van € 484;

      e. [artikel 31, eerste lid, van de Luchtvaartwet][ref5] om bouwwerken of roerende zaken op een luchtvaartterrein op
      te richten of te hebben, of om graafwerkzaamheden te verrichten, is een vast tarief verschuldigd van € 765;

      f. [artikel 33, eerste lid, van de Luchtvaartwet][ref6] om een luchtvaartterrein te gebruiken in strijd met de
      bepalingen en voorwaarden zoals deze bij de aanwijzing zijn gesteld, is een vast tarief verschuldigd van € 1.160;

      g. de bij of krachtens [titel 6.5 van de Wet luchtvaart][ref7] gegeven regels inzake het
      vervoer van gevaarlijke stoffen of een wijziging van zulk een ontheffing als bedoeld in
      [artikel 6.58, eerste respectievelijk zesde lid, van de Wet luchtvaart][ref8] is een vast tarief verschuldigd van
      € 1.160;

      h. [artikel 8.12 van de Wet luchtvaart][ref9] om objecten op te richten of te plaatsen waarvoor geen bouwvergunning
      of aanlegvergunning is vereist, is een vast tarief verschuldigd van € 1.160.

      2 Voor de behandeling van een aanvraag voor de afgifte van een vergunning voor het houden van een
      luchtvaartvertoning of een luchtvaartwedstrijd, ingevolge [artikel 17 van de Luchtvaartwet][ref10], is een vast
      tarief verschuldigd van € 484.


