$id: wet_geneesmiddelenprijzen
regulatory_layer: WET
publication_date: '2020-02-24'
valid_from: '2019-12-18'
bwb_id: BWBR0007867
url: https://wetten.overheid.nl/BWBR0007867/2019-12-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de volksgezondheid wenselijk is de
    beschikbaarheid van geneesmiddelen tegen redelijke prijzen te waarborgen, dat de prijzen van geneesmiddelen
    in overwegende mate ten laste van de gemeenschap komen, dat het in verband daarmee wenselijk is de prijzen van
    geneesmiddelen te kunnen beheersen, dat de prijzen van geneesmiddelen in Nederland aanzienlijk uitgaan boven de
    prijzen van vergelijkbare geneesmiddelen in andere lidstaten van de Europese Unie en dat het derhalve wenselijk is
    regels te stellen die het mogelijk maken voor geneesmiddelen maximumprijzen vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel1
  - number: 1.1.b
    text: |-
      geneesmiddel: een geneesmiddel als bedoeld in [artikel 1, eerste lid, onder b, van de Geneesmiddelenwet][ref1]
      waarvoor een handelsvergunning of een parallelhandelsvergunning geldt die is verleend
      krachtens de [Geneesmiddelenwet][ref2] dan wel krachtens de verordening, bedoeld in
      [artikel 1, eerste lid, onder fff, van die wet][ref3], of Verordening (EEG) nr. 2309/93 van de Raad van de Europese
      Gemeenschappen van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen
      voor en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een
      Europees Bureau voor de geneesmiddelenbeoordeling (PbEG L 214);


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021505
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0021505
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 1.1.c
    text: |-
      vergelijkbaar geneesmiddel: een geneesmiddel met dezelfde werkzame bestanddelen, van dezelfde of nagenoeg dezelfde
      sterkte en in dezelfde farmaceutische vorm als een ander geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel1
  - number: 1.1.d
    text: |-
      maximumprijs: de maximumprijs voor een geneesmiddel, vastgesteld krachtens [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007867#Artikel2
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007867
        artikel: '2'
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat farmaceutische vormen in daarbij aangegeven gevallen voor
      de toepassing van deze wet worden aangemerkt als dezelfde farmaceutische vorm.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel1
  - number: '2.1'
    text: |-
      Bij ministeriële regeling kan voor een geneesmiddel, waarvan de beschikbaarheid voor een ieder naar het oordeel van
      Onze Minister door de overheid dient te worden gewaarborgd, een maximumprijs worden vastgesteld. De maximumprijs
      wordt uitgedrukt in een bedrag per daarbij aan te geven hoeveelheid. Op de voorbereiding van de regeling is
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Het ontwerp van de regeling wordt ten minste
      vier weken voor de vaststelling overgelegd aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '2.2'
    text: |-
      Voor de vaststelling van een maximumprijs voor een geneesmiddel wordt op basis van bij ministeriële regeling
      aan te wijzen algemeen aanvaarde prijslijsten voor België, voor Noorwegen, voor Frankrijk en voor het Verenigd
      Koninkrijk, per land in de daar geldende valuta het rekenkundig gemiddelde vastgesteld van de prijzen van
      vergelijkbare geneesmiddelen die in die prijslijsten zijn vermeld voor het leveren aan personen, rechtspersonen
      daaronder begrepen, die bevoegd zijn tot het afleveren van geneesmiddelen aan particuliere gebruikers. Indien
      in een prijslijst niet de prijzen zijn vermeld voor het leveren aan personen die bevoegd zijn tot het afleveren
      van geneesmiddelen aan particuliere gebruikers, worden de vermelde prijzen tot zodanige prijzen omgerekend met
      overeenkomstige toepassing van de hiervoor in dat land geldende regels. Indien voor een geneesmiddel de prijs
      van meer dan één verpakkingsgrootte is vermeld, wordt slechts in aanmerking genomen de prijs van de verpakking
      met de laagste prijs per eenheid produkt. Een vermelde prijs wordt voor zover nodig herleid tot een prijs voor de
      hoeveelheid die zal worden gehanteerd in de in het eerste lid bedoelde regeling.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel2
  - number: '2.3'
    text: |-
      De ingevolge het tweede lid vastgestelde gemiddelden worden omgerekend in euro's. Daarbij wordt uitgegaan van
      de wisselkoers van de euro ten opzichte van het Britse pond en de Noorse kroon, zoals die is vastgesteld door de
      Europese Bank op de datum van uitgifte van de prijslijsten van het Verenigd Koninkrijk en Noorwegen, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel2
  - number: '2.4'
    text: |-
      De maximumprijs wordt vastgesteld op ten minste het rekenkundig gemiddelde van de op grond van het derde lid
      vastgestelde bedragen in euro's.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel2
  - number: '2.5'
    text: |-
      Vaststelling van een maximumprijs voor een geneesmiddel vindt niet plaats indien slechts voor één van de in het
      tweede lid genoemde landen voor vergelijkbare geneesmiddelen een prijs is vermeld in de in het tweede lid bedoelde
      prijslijsten.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel2
  - number: '2.6'
    text: |-
      Voor de vaststelling van een maximumprijs wordt een prijslijst als uitgangspunt genomen, die niet langer dan zes
      maanden voor het tijdstip van vaststelling van de maximumprijs is uitgegeven.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel2
  - number: '2.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze waarop maximumprijzen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel2
  - number: '3.1'
    text: |-
      Ten minste tweemaal per jaar onderzoekt Onze Minister of er aanleiding is de in [artikel 2, eerste lid][ref1],
      bedoelde regeling te wijzigen. Zonodig past Onze Minister de regeling binnen 90 dagen na het begin van dit
      onderzoek aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007867#Artikel2
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007867
        artikel: '2'
  - number: '3.2'
    text: |-
      Voorts kan Onze Minister op verzoek van degene die het geneesmiddel te koop aanbiedt, verkoopt of krachtens
      verkoop levert aan een persoon, een rechtspersoon daaronder begrepen, die ingevolge de [Geneesmiddelenwet][ref1]
      bevoegd is tot het afleveren van geneesmiddelen aan particuliere gebruikers, in bijzondere gevallen besluiten de
      in [artikel 2, eerste lid][ref2], bedoelde regeling vastgelegde maximumprijs te wijzigen. De laatste twee volzinnen
      van [artikel 2, eerste lid][ref3], zijn niet van toepassing op een wijziging van de in de ministeriële regeling
      vastgelegde maximumprijs op grond van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021505
      [ref2]: https://wetten.overheid.nl/BWBR0007867#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007867#Artikel2
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021505
      - id: ref2
        bwb_id: BWBR0007867
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007867
        artikel: '2'
  - number: '3.3'
    text: De aanvraag tot wijziging van de vastgelegde maximumprijs is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel3
  - number: '3.4'
    text: |-
      Indien de bij de indiening van de aanvraag verstrekte gegevens niet toereikend zijn, laat Onze Minister weten
      welke aanvullende inlichtingen vereist zijn en stelt hij de verzoeker in de gelegenheid de aanvullende inlichtingen
      binnen een door hem te bepalen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister besluit binnen 90 dagen na ontvangst van de aanvraag dan wel na ontvangst van de aanvullende
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel3
  - number: '3.6'
    text: |-
      Ingeval van een uitzonderlijk groot aantal aanvragen kan Onze Minister de in het vijfde lid bedoelde termijn
      eenmaal met 60 dagen verlengen. Een besluit tot verlenging van de termijn wordt voor het verstrijken van de in het
      vijfde lid bedoelde termijn bekend gemaakt aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel3
  - number: '4'
    text: |-
      Het is verboden een geneesmiddel tegen een hogere prijs dan de maximumprijs te koop aan te bieden, te verkopen of
      krachtens verkoop te leveren dan wel een hogere prijs dan de maximumprijs in rekening te brengen aan een persoon,
      een rechtspersoon daaronder begrepen, die ingevolge de [Geneesmiddelenwet][ref1] bevoegd is tot het afleveren van
      geneesmiddelen aan particuliere gebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0021505
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021505
  - number: '5.1'
    text: |-
      Een ieder die een geneesmiddel te koop aanbiedt, verkoopt of krachtens verkoop levert aan een persoon, een
      rechtspersoon daaronder begrepen, die ingevolge de [Geneesmiddelenwet][ref1] bevoegd is tot het afleveren van
      geneesmiddelen aan particuliere gebruikers, is verplicht een administratie te voeren, waaruit per transactie blijkt
      aan wie en tegen welke prijs hij het desbetreffende geneesmiddel heeft verkocht, alsmede de verpakkingsgrootte.


      [ref1]: https://wetten.overheid.nl/BWBR0021505
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021505
  - number: '5.2'
    text: |-
      De administratie, bedoeld in het eerste lid, wordt gedurende ten minste drie kalenderjaren na het jaar waarop zij
      betrekking heeft, bewaard. Indien terzake van een transactie waarop de administratie betrekking heeft, een boete
      is opgelegd, wordt de administratie bewaard totdat de beschikking tot oplegging van de boete onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel5
  - number: '6.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan door
      plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel6
  - number: '6.2'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '11'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen van ten hoogste € 45 000 ter zake van overtreding van
      [artikel 4][ref1] of [5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007867#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007867#Artikel5
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007867
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007867
        artikel: '5'
  - number: '18'
    text: |-
      Onze Minister zendt binnen achttien maanden nadat voor het eerst een regeling als bedoeld in
      [artikel 2, eerste lid][ref1], is vastgesteld, aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007867#Artikel2
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007867
        artikel: '2'
  - number: '19'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Zij vervalt met ingang van de eerste
      dag van het vijfde kalenderjaar na dat waarin voor het laatst een regeling ingevolge [artikel 2, eerste lid][ref1],
      heeft gegolden.


      [ref1]: https://wetten.overheid.nl/BWBR0007867#Artikel2
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007867
        artikel: '2'
  - number: '20'
    text: 'Deze wet wordt aangehaald als: Wet geneesmiddelenprijzen.'
    url: https://wetten.overheid.nl/BWBR0007867/2019-12-18#Artikel20
