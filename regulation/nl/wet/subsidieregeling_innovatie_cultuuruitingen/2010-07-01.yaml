preamble:
  text: |-
    Gelet op de artikelen 5, 5a, 7, zesde lid, 32, eerste lid, en 48 van het Bekostigingsbesluit cultuuruitingen
    en artikel 2, eerste lid, van de Wet vergoedingen adviescolleges en commissies, mede gelet op artikel 2 van het
    Besluit vergoedingen adviescolleges en commissies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *commissie:* Adviescommissie Innovatie cultuuruitingen, bedoeld in [artikel 7, eerste lid][ref1];
        - *culturele instelling:* instelling, onderdeel, organisatie of gemeenschappelijke regeling als bedoeld in
      [artikel 4][ref2];
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap;
        - *onderneming:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid of een natuurlijk persoon, die
      economische activiteiten onderneemt, niet zijnde een culturele instelling;
        - *Regeling:* [Regeling op het specifiek cultuurbeleid][ref3];
        - *AgentschapNL:* agentschap AgentschapNL van het Ministerie van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0025967#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025967#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0027597
