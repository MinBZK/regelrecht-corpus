  - number: '23'
    text: |-
      [Artikel 2.10 van de Regeling][ref1] is van overeenkomstige toepassing op de verstrekking van voorschotten ten
      behoeve van verleende subsidies op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel23
