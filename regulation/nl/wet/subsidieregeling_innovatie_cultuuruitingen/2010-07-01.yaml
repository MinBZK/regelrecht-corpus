      - id: ref4
        bwb_id: BWBR0003740
  - number: '5'
    text: |-
      1 Het subsidiebedrag bedraagt ten hoogste 90 procent van de subsidiabele kosten van de activiteiten waarvoor
      subsidie wordt gevraagd.

      2 De subsidiabele kosten omvatten uitsluitend de volgende rechtstreeks aan de uitvoering toe te rekenen kosten:

      a. loonkosten;

      b. overheadkosten;

      c. kosten van ingehuurde derden; en

      d. kosten van materialen en apparatuur.

      3 Van de subsidiabele kosten zijn de kosten voor basisdigitalisering uitgesloten. Hieronder worden verstaan de
      kosten voor alle inspanningen gericht op de transformatie van analoge naar digitale objecten of tekstbestanden.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel5
  - number: '6'
    text: |-
      1 Voor subsidieverlening op grond van deze regeling is in 2009 € 3 miljoen beschikbaar.

      2 Voor subsidieverlening op grond van deze regeling is in 2010, 2011 en 2012 telkens € 3 miljoen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel6
  - number: '7'
    text: |-
      1 Er is een Adviescommissie Innovatie cultuuruitingen.

      2 De commissie bestaat uit een voorzitter en ten minste 4 leden.

      3 De minister benoemt en ontslaat de voorzitter en de leden van de commissie.

      4 Benoeming geschiedt voor een periode van maximaal twee jaar. Herbenoeming is mogelijk.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel7
  - number: '8'
    text: |-
      1 De commissie heeft tot taak op verzoek van de minister te adviseren over de door hem doorgestuurde
      subsidieaanvragen op grond van deze regeling.

      2 De adviezen van de commissie zijn gemotiveerd en bevatten een oordeel over het vernieuwende karakter van de
      activiteiten waarvoor subsidie wordt gevraagd.

      3 De commissie geeft elke door haar ontvangen aanvraag een van de volgende beoordelingen:

      a. positief; of

      b. negatief.

      4 De commissie kan bij een oordeel bedoeld in het derde lid, onder a, gerelateerd aan het doel van deze regeling,
      verbeterpunten aangeven ten aanzien van de activiteiten waarvoor subsidie is aangevraagd en kan de minister
      aanbevelen deze verbeterpunten op te nemen als subsidieverplichtingen.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel8
  - number: '9'
    text: |-
      De commissie rangschikt de aanvragen die zij een beoordeling toekent als bedoeld in
      [artikel 8, derde lid, onder a][ref1], op grond van de volgende criteria:

        - netwerkvorming: de mate waarin de activiteiten verbindingen leggen tussen culturele instellingen en andere
      organisaties of ondernemingen;
        - innovatieve kracht: de mate waarin de toegepaste werkwijze vernieuwend is;
        - duurzame verandering: de mate waarin verwacht mag worden dat de activiteiten een duurzame verandering
      teweegbrengen in de werkwijze van bij de activiteiten betrokken culturele instellingen;
        - navolging: de mate waarin de resultaten van het project naar verwachting ten goede kunnen komen aan een grotere
      groep culturele instellingen; en
        - kosteneffectiviteit: de mate waarin de gevraagde bijdrage redelijk is gelet op het te verwachten effect van de
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0025967#Artikel8
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0025967
        artikel: '8'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      1 De commissie stelt haar eigen werkwijze vast.

      2 De commissie kan zich door andere personen doen bijstaan voor zover dat voor de vervulling van haar taak nodig
      is.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel10
  - number: '11'
    text: |-
      1 De leden van de commissie ontvangen per vergadering een vergoeding die drie procent bedraagt van het maximum van
      salarisschaal 18 van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].

      2 De voorzitter van de commissie ontvangt per vergadering een vergoeding die 130% bedraagt van de vergoeding
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '12'
    text: De commissie verstrekt aan de minister desgevraagd de door hem gewenste informatie.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel12
  - number: '13'
    text: |-
      De commissie draagt zo spoedig mogelijk na beëindiging van haar werkzaamheden of, zo de omstandigheden daartoe
      aanleiding geven, zoveel eerder, de bescheiden betreffende die werkzaamheden over aan het archief van de directie
      Concernondersteuning/Kunsten van het Ministerie van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel13
  - number: '14'
    text: |-
      1 De aanvraag omvat in ieder geval:

      a. een ingevuld aanvraagformulier, dat tevens een activiteitenplan omvat, als bedoeld in [bijlage I][ref1]
      behorende bij deze regeling; en

      b. een begroting, opgesteld overeenkomstig [Bijlage II][ref2] behorende bij deze regeling.

      2 Indien de minister hierom verzoekt, verstrekt de aanvrager tevens een afschrift van de oprichtingsakte van de
      rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0025967
      [ref2]: https://wetten.overheid.nl/BWBR0025967
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025967
      - id: ref2
        bwb_id: BWBR0025967
  - number: '16'
    text: |-
      1 Voor de subsidieverlening is in elk van de jaren 2009, 2010, 2011 en 2012 één aanvraagronde.

      2 De aanvraag wordt ingediend:

      a. in 2009 voor 1 oktober;

      b. in 2010 voor 17 mei 17.00 uur; en

      c. in 2011 en 2012 voor 30 maart 17.00 uur.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel16
  - number: '17'
    text: De aanvraag wordt verzonden naar AgentschapNL, Juliana van Stolberglaan 3, Postbus 93144, 2509 AC Den Haag.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel17
  - number: '18'
    text: |-
      1 Wanneer een aanvraag voldoet aan de eisen van deze regeling verzoekt de minister de commissie over de aanvraag
      te adviseren.

      2 De commissie adviseert bij elke aanvraagronde over alle door haar ontvangen aanvragen tegelijk.

      3 De commissie adviseert over de door haar ontvangen aanvragen binnen zes weken nadat zij de aanvragen heeft
      ontvangen.

      4 De commissie zendt de adviezen naar AgentschapNL en een kopie naar de minister.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel18
  - number: '19'
    text: |-
      1 De minister voorziet per aanvraagronde in een gelijktijdige beslissing op aanvragen waarover de commissie heeft
      geadviseerd, op basis van een vergelijking van hun geschiktheid om bij te dragen aan de doelstellingen van de
      subsidie.

      2 De minister beslist op de aanvragen mede op basis van de adviezen van de commissie.

      3 De minister beslist op de aanvragen:

      a. in de aanvraagronde van 2009 voor 15 december van dat jaar;

      b. in de aanvraagronde van 2010 voor 17 augustus van dat jaar; en

      c. in de aanvraagrondes van 2011 en 2012 voor 1 juli van het betreffende jaar.

      4 Een beslissing op een aanvraag als bedoeld in het eerste lid gaat vergezeld van het betreffende advies van de
      commissie.

      5 De adviezen van de commissie worden openbaar gemaakt op de website www.cultuursubsidie.nl.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel19
  - number: '20'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] kan subsidieverlening worden geweigerd als:

        - de eigen bijdrage van de bij de activiteiten betrokken partijen niet ten minste 10% van de subsidiabele kosten
      bedraagt;
        - de subsidiabele kosten van de activiteiten minder dan € 100.000 bedragen;
        - niet duidelijk uit de aanvraag blijkt met welke partijen de aanvrager samenwerkt bij de activiteiten waarvoor
      subsidie wordt aangevraagd; of
        - het een hernieuwde aanvraag betreft en deze zich niet substantieel onderscheidt van de oorspronkelijke aanvraag,
      tenzij het een aanvraag betreft die eerder met een beroep op het subsidieplafond is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
  - number: '21'
    text: |-
      Voor activiteiten waarvoor een aanvraag is geweigerd, kan eenmaal opnieuw een aanvraag voor subsidie worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel21
  - number: '22'
    text: |-
      1 De minister kan aan de subsidieverlening de verplichting verbinden dat de aanvrager verbeterpunten als bedoeld in
      [artikel 8, vierde lid][ref1], uitvoert.

      2 Als verplichtingen bedoeld in het eerste lid zijn opgelegd, kan de minister bepalen dat binnen een bepaalde
      termijn de aanvrager rapporteert op welke wijze de verplichtingen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025967#Artikel8
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025967
        artikel: '8'
        hoofdstuk: '2'
  - number: 22a
    text: |-
      [Artikel 5.7][ref1] en [5.8 van de Regeling][ref2] zijn van overeenkomstige toepassing op de ontvanger van een
      subsidie op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel5.8
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel22a
