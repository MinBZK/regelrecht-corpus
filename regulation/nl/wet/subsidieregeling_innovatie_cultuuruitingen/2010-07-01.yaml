  - number: 1a
    text: |-
      Deze regeling berust op [artikel 4 van het Besluit op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel4
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '4'
  - number: '2'
    text: |-
      1 De minister kan op aanvraag aan een culturele instelling subsidie verlenen voor het uitvoeren van activiteiten
      die erop gericht zijn nieuwe mogelijkheden te scheppen die de maatschappelijke waarde van cultuuruitingen
      vergroten.

      2 Subsidie wordt alleen verstrekt indien:

      a. de activiteiten in samenwerking met een of meer culturele instellingen, ondernemingen of maatschappelijke
      organisaties worden uitgevoerd; en

      b. de aanvrager niet geacht wordt reeds subsidie te ontvangen voor deze activiteiten.

      3 Subsidies worden niet verleend voor een subsidiebedrag dat minder dan € 25.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel2
  - number: '3'
    text: |-
      De activiteiten, bedoeld in [artikel 2][ref1], hebben een looptijd van ten hoogste twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025967#Artikel2
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025967
        artikel: '2'
        hoofdstuk: '1'
  - number: '4'
    text: |-
      1 Subsidie kan worden aangevraagd door elke instelling die een jaarlijkse of vierjaarlijkse subsidie ontvangt op
      grond van [artikel 4][ref1], [4a][ref2] of [4b van de Wet op het specifiek cultuurbeleid][ref3], of die anderszins
      een subsidie, anders dan een projectsubsidie, ontvangt in het kader van cultuurbeleid van een zelfstandig
      bestuursorgaan, provincie of gemeente voor een periode van ten minste een jaar.

      2 Subsidie kan tevens worden aangevraagd door een instelling die als statutaire doelstelling heeft het behartigen
      van de belangen van instellingen als bedoeld in het eerste lid, voor zover zij geacht kunnen worden in het kader
      van de aanvraag als vertegenwoordiger van deze instellingen op te treden.

      3 Subsidie kan tevens worden aangevraagd door een:

      a. onderdeel van een provincie of gemeente;

      b. organisatie die door of vanwege een provincie of gemeente in stand gehouden wordt; of

      c. gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref4] waar een provincie of
      een gemeente aan deelneemt;

      mits een dergelijke subsidieaanvrager in het kader van het provinciaal of gemeentelijk cultuurbeleid structureel
      activiteiten ontplooit, vergelijkbaar met die van de instellingen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0005904#Artikel4b
      [ref4]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel4
    references:
      - id: ref1
