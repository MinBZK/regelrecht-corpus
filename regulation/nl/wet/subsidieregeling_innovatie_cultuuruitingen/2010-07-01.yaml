  - number: '25'
    text: |-
      1 Aan de algemeen directeur van AgentschapNL wordt mandaat verleend om besluiten te nemen ter uitvoering van deze
      regeling.

      2 De algemeen directeur neemt geen beslissing op een bezwaarschrift indien het besluit waartegen het bezwaar zich
      richt door hem krachtens mandaat is genomen.

      3 De algemeen directeur kan ondermandaat verlenen.

      4 In elk op grond van deze mandaatverlening genomen besluit wordt tot uitdrukking gebracht dat dit namens de
      minister is genomen.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel25
  - number: '26'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling vervalt met ingang van 1 januari 2015, maar blijft van toepassing op bezwaar en beroepsprocedures
      die voortkomen uit een beschikking genomen op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0025967/2010-07-01#Artikel26
