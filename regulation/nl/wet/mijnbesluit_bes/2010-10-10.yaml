---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mijnbesluit_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028574
url: https://wetten.overheid.nl/BWBR0028574/2010-10-10
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder «Onze Minister»: Onze Minister van Economische Zaken.'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel1
  - number: 1a
    text: |-
      Waar in dit besluit zonder nadere aanduiding artikelen worden genoemd, worden artikelen van dit besluit zelf
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel1a
  - number: 1b
    text: Dit besluit berust op artikel 1a, zesde lid, van de Mijnwet BES.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel1b
  - number: '2'
    text: |-
      In dit besluit wordt onder opsporing verstaan opzettelijk ingesteld onderzoek naar de in artikel 1a van de
      Mijnwet BES genoemde delfstoffen met het oogmerk om recht tot mijnontginning te verwerven; en onder ontginning
      of mijnontginning de opzettelijke winning van deze delfstoffen, onverschillig of die winning geschiedt
      door onderaardsche mijnwerken, open groeven, grondboringen of op andere wijze. Dit besluit kent aan de
      uitdrukking onderzoekingsveld, concessieveld en mijnveld het begrip van ruimte toe, en aan de uitdrukkingen
      onderzoekingsterrein, vergunningsterrein, opsporingsterrein, concessieterrein en ontginningsterrein dat van
      oppervlakte.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel2
  - number: '3'
    text: 'In dit besluit wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel3
  - number: 3.a
    text: onder rechthebbende op den grond degene, die een zakelijk recht daarop heeft;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel3
  - number: 3.b
    text: |-
      onder derde belanghebbende degene, wiens uit een persoonlijk recht voortvloeiend belangen door een opsporing of
      ontginning kunnen worden geschaad.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Onverminderd hetgeen overigens dienaangaande in dit besluit in het bijzonder is bepaald, gelden de aan opspoorders
      toegekende rechten en opgelegde verplichtingen, ook die nopens de wijze van uitoefening van hun bedrijf mede voor
      ontdekkers die ingevolge [art. 88][ref1] hunne werkzaamheden voortzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel88
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '88'
        hoofdstuk: IV
        afdeling: 4e
  - number: '5'
    text: Waar in dit besluit gesproken wordt van «door Onze Minister» wordt daarmede ook bedoeld «vanwege Onze Minister».
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Behoudens het bepaalde bij het tweede lid van dit artikel moet elk schriftelijk verzoek om vergunning tot het doen
      van opsporingen vergezeld gaan van bescheiden, aantoonende dat de aanvrager voldoet aan de in het eerste lid van
      art. 5 der Mijnwet BES gestelde vereischten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Zoolang door een aanvrager de bescheiden, bedoeld in het eerste lid van dit artikel, nog niet zijn terugontvangen,
      kan door hem bij de indiening van andere verzoeken worden volstaan met eene mededeeling bij welke verzoek die
      bescheiden zijn gevoegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      De aanvrager van eene vergunning tot opsporing moet domicilie kiezen in de hoofdplaats van het eiland waarbinnen
      het onderzoeksterrein is gelegen, in het schriftelijk verzoek om vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Bij het kiezen van domicilie moet uitdrukkelijk worden verklaard dat dit geschiedt voor den duur der vergunning en
      voor al wat daarop betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Het door den aanvrager gekozen domicilie gaat bij overdracht en bij overlijden van den wettige houder eener
      vergunning over op den verkrijger der vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Vertegenwoordigers als bedoeld in het eerste lid van art. 5 der Mijnwet BES – ook tijdelijk vervangende en
      waarnemende – moeten bij authentieke akte zijn aangesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Ingeval van overlijden van den wettigen houder eener vergunning zijn diens rechtverkrijgenden, voor zoover zij
      reeds dadelijk dan wel binnen den tijd van één jaar na het openvallen der erfenis, voldoen aan de in art. 5 der
      Mijnwet BES gestelde vereischten, verplicht zulks door bescheiden aan te toonen en tevens het bewijs van bedoeld
      overlijden tijdig aan Onze Minister in te dienen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      Bij overlijden van den wettigen houder eener vergunning moeten zijne in Bonaire, Sint Eustatius en Saba
      gevestigde rechtsverkrijgenden, als er twee of meer zijn, binnen een bekwamen termijn bij authentieke akte een
      gemeenschappelijken vertegenwoordiger aanstellen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Wanneer er een of meer niet in Bonaire, Sint Eustatius en Saba gevestigde rechtverkrijgenden van een overleden
      houder eener vergunning zijn, die verplicht zijn in voldoening aan art.5 der Mijnwet BES een vertegenwoordiger aan
      te stellen, moet, als er tevens een of meer in Bonaire, Sint Eustatius en Saba gevestigde rechtverkrijgende zijn,
      diezelfde vertegenwoordiger ook door deze rechtverkrijgenden tot hun vertegenwoordiger worden aangesteld; in dit
      geval moet de aanstelling in verband met het bepaalde bij het derde lid van art.5 der Mijnwet BES geschieden binnen
      den tijd van één jaar na het openvallen der erfenis.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Wanneer rechtverkrijgenden van een overleden wettigen houder eener vergunning, die niet voldoen aan de in art. 5
      der Mijnwet BES gestelde vereischten, ingevolge het derde lid van dat artikel hunne uit de vergunning voorvloeiende
      rechten en verplichtingen wenschen over te dragen, moet bij het verzoek om toestemming tot die overdracht, behalve
      de overigens gevorderde stukken ook worden overlegd het bewijs van overlijden van den wettigen houder en tevens
      door bescheiden worden aangetoond, dat de verkrijger aan de gestelde vereischten voldoet; het bepaalde bij het
      [tweede lid van art.6][ref1] is ten deze toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel6
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '6'
        hoofdstuk: I
  - number: '11.2'
    text: |-
      Met betrekking tot overdrachten als bedoeld in het eerste lid van dit artikel gelden overigens de
      [artt.54–59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel54
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '54'
        hoofdstuk: III
  - number: '12'
    text: |-
      Het verzoek om toestemming tot elke andere overdracht van eene vergunning dan bedoeld in [art.11][ref1] moet
      eveneens, behalve van de overige gevorderde stukken, vergezeld gaan van bescheiden, aantoonende dat de verkrijger
      voldoet aan de in art.5 der Mijnwet BES gestelde vereischten; het bepaalde bij het [tweede lid van art.6][ref2] is
      ten deze toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel6
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '11'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '6'
        hoofdstuk: I
  - number: '13.1'
    text: |-
      Van elke verandering in het bestuur – commissarissen daaronder begrepen – van naamlooze vennootschappen en
      besloten vennootschappen welke houders zijn van vergunningen of welke andere naamlooze vennootschappen, houders
      van vergunningen, besturen, moet door dat bestuur, binnen één maand nadat de verandering heeft plaats gehad, worden
      kennis gegeven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel13
  - number: '13.2'
    text: 'In de kennisgeving moet worden opgegeven:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel13
  - number: 13.2.a
    text: de nationaliteit van den nieuwe bestuurder of commissaris;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel13
  - number: 13.2.b
    text: of hij ingezetene is van Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel13
  - number: 13.2.c
    text: waar hij woonachtig is.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister is bevoegd om te allen tijde te vorderen, dat binnen een voor elk geval door hem te stellen termijn,
      bescheiden worden overgelegd, aantoonende de juistheid van de bij het tweede lid van dit artikel voorgeschreven
      opgaven. De gestelde termijn kan in bijzondere gevallen, éénmaal worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel13
  - number: '13.4'
    text: |-
      Het bovenstaande geldt eveneens voor verandering in het beheer van vennootschappen onder eene firma of bij wijze
      van geldschieting, die houders zijn van vergunningen of die bestuurders zijn van naamlooze vennootschappen en
      besloten vennootschappen welke houders van vergunningen zijn.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      Van elk optreden van een nieuwen vertegenwoordiger, als bedoeld in het eerste lid van art.5 der Mijnwet BES, moet
      binnen één maand nadat dit optreden heeft plaats gehad, door den houder der vergunning worden kennis gegeven aan
      Onze Minister, onder overlegging van de authentieke akte of van een volledig afschrift daarvan, waarbij de nieuwe
      vertegenwoordiger is aangesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      Het bepaalde bij het eerste lid van dit artikel geldt eveneens voor de tijdelijk vervangende en waarnemende
      vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Bij de behandeling van een verzoek om vergunning en een verzoek om toestemming tot overdracht eener vergunning,
      overeenkomstig de [artt. 33][ref1] en [34][ref2], wordt indien overigens tegen het verzoek geen bezwaren bestaan,
      nagegaan of de aanvrager dan wel de verkrijger voldoet aan de in art.5 der Mijnwet BES gestelde vereischten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel34
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '33'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '34'
        hoofdstuk: III
  - number: '15.2'
    text: |-
      In het geval genoemd in [art.9][ref1] wordt nagegaan of de rechtverkrijgenden van een overleden vergunninghouder
      voldoen aan de in art.5 der Mijnwet BES gestelde vereischten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel9
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '9'
        hoofdstuk: I
  - number: '15.3'
    text: |-
      In de gevallen genoemd in de [artt.13][ref1] en [14][ref2] wordt nagegaan of in verband met het optreden van een
      nieuwen bestuurder of commissaris, een nieuwen beheerenden vennoot dan wel een nieuwen vertegenwoordiger, de houder
      der vergunning nog voldoet aan de in art.5 der Mijnwet BES gestelde vereischten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel14
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '13'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '14'
        hoofdstuk: I
  - number: '15.4'
    text: |-
      Overigens wordt gehandeld overeenkomstig het bepaalde bij [art. 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel34
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '34'
        hoofdstuk: III
  - number: '16.1'
    text: |-
      In elk geval dat een persoon of een vennootschap, welke in verband met het verkrijgen van eene vergunning tot
      opsporing aan de in art.5 der Mijnwet BES gestelde vereischten moet voldoen, naar het oordeel van Onze Minister
      daaraan niet voldoet, wordt dit aan den belanghebbende of de belanghebbenden bij eene, bij deurwaardersexploit
      beteekende akte wordt geteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      Bij die beschikking wordt tegelijkertijd het verzoek om vergunning of het verzoek om toestemming tot overdracht
      eener vergunning afgewezen, dan wel aangeteekend dat de uit de vergunning voortvloeiende rechten en verplichtingen
      niet op de rechtverkrijgenden van den overleden wettigen houder zijn overgegaan, omdat zij niet voldoen aan de in
      art.5 der Mijnwet BES gestelde vereischten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel16
  - number: '16.3'
    text: Van die beschikking en het exploit van beteekening worden uittreksels in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      In elk geval dat de houder eener vergunning naar het oordeel van Onze Minister heeft opgehouden aan de in art.5
      der Mijnwet BES gestelde vereischten te voldoen, wordt dit aan den belanghebbende te kennen gegeven bij eene
      met redenen omkleede beschikking welke ten spoedigste aan den belanghebbende bij eene, bij deurwaardersexploit
      beteekende akte wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel17
  - number: '17.2'
    text: Van die beschikking en het exploit van beteekening worden uittreksels in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel17
  - number: '18.1'
    text: |-
      Behoudens het bepaalde bij het derde lid van dit artikel moet het verzoekschrift waarbij aanspraken op eene
      concessie worden geldend gemaakt, behalve van de overigens gevorderde stukken, vergezeld gaan van bescheiden,
      aantoonende dat de verzoeker voldoet aan de in art. 5 der Mijnwet BES gestelde vereischten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      Bij het kiezen van domicilie in het verzoekschrift, moet uitdrukkelijk worden verklaard, dat dit geschiedt voor den
      duur der concessie en voor al wat daarop betrekking heeft. Het gekozen domicilie gaat bij overdracht van het recht
      op concessie, dan wel van de concessie en bij overlijden van den wettigen houder van het recht op concessie dan wel
      van de concessie over op den verkrijger.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel18
  - number: '18.3'
    text: |-
      Zoolang door een aanvrager de bescheiden, genoemd in het eerste lid van dit artikel, nog niet zijn terugontvangen,
      kan door hem bij de indiening van andere verzoeken worden volstaan met de overlegging van afschriften dier
      bescheiden onder mededeeling bij welk verzoek de origineele stukken zijn gevoegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel18
  - number: '19.1'
    text: |-
      In geval van overlijden van den wettigen houder van het recht op eene concessie zijn diens rechtverkrijgenden,
      voor zover zij reeds dadelijk dan wel binnen den tijd van één jaar na het openvallen der erfenis, voldoen aan de in
      art. 5 der Mijnwet BES gestelde vereischten verplicht zulks door bescheiden aan te toonen en tevens het bewijs van
      bedoeld overlijden tijdig aan Onze Minister in te dienen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel19
  - number: '19.2'
    text: |-
      Wanneer rechtverkrijgenden van een overledenen wettigen houder van het recht op eene concessie, die niet voldoen
      aan de in art.5 der Mijnwet BES gestelde vereischten, hun recht wenschen over te dragen, moeten bij het verzoek
      tot goedkeuring van die overdracht, behalve de overigens gevorderde stukken ook worden overgelegd het bewijs van
      overlijden van den wettigen houder en tevens door bescheiden worden aangetoond, dat de verkrijger aan de gestelde
      vereischten voldoet. Het verzoek tot goedkeuring van deze overdracht moet door de beide bij de overdracht betrokken
      partijen worden gedaan. Het bepaalde bij het [derde lid van art.18][ref1] is ten deze toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel18
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '18'
        hoofdstuk: II
  - number: '20'
    text: |-
      Het bepaalde bij [art.19][ref1] geldt eveneens in geval van overlijden van den wettigen houder van eene
      concessie voor diens rechtverkrijgenden, voor zoover zij reeds dadelijk dan wel binnen den tijd van één jaar
      na het openvallen der erfenis voldoen aan de in art.5 der Mijnwet BES gestelde vereischten, zoomede voor
      rechtverkrijgenden van een overleden wettigen houder eener concessie, die niet voldoen aan de gestelde vereischten
      en hunne uit de concessie voortvloeiende rechten en verplichtingen wenschen over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel19
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '19'
        hoofdstuk: II
  - number: '21'
    text: |-
      Afgescheiden van het bepaalde bij de [artt. 19][ref1] en [20][ref2] is bij elke andere overdracht van het recht
      op concessie of van eene concessie de verkrijger verplicht Onze Minister door bescheiden aan te toonen, dat hij
      voldoet aan de art.5 van de Mijnwet BES gestelde vereischten; het bepaalde bij het [derde lid van art.18][ref3] is
      ten deze toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel18
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '20'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '18'
        hoofdstuk: II
  - number: '22'
    text: |-
      Het bepaalde bij [art.8][ref1] geldt eveneens voor de aanstelling van vertegenwoordigers – ook tijdelijk
      vervangende en waarnemende – van niet in Bonaire, Sint Eustatius en Saba gevestigde houders van het recht op
      concessie en van concessiën.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel8
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '8'
        hoofdstuk: I
  - number: '23.1'
    text: |-
      Bij overlijden van den wettigen houder van het recht op eene concessie of van eene concessie moeten zijne in
      Bonaire, Sint Eustatius en Saba gevestigde rechtverkrijgende, als er twee of meer zijn, binnen een voor elk geval
      door Onze Minister te stellen bekwamen termijn bij authentieke akte een gemeenschappelijken vertegenwoordiger
      aanstellen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      Wanneer er een of meer niet in Bonaire, Sint Eustatius en Saba gevestigde rechtverkrijgenden van een overleden
      houder van het recht op eene concessie of van eene concessie zijn, die verplicht zijn in voldoening aan art.5
      der Mijnwet BES een vertegenwoordiger aan te stellen, moet, als er tevens een of meer in Bonaire, Sint Eustatius
      en Saba gevestigde rechtverkrijgenden zijn, diezelfde vertegenwoordiger ook door deze rechtverkrijgenden tot hun
      vertegenwoordiger worden aangesteld; in dit geval moet de aanstelling in verband met het bepaalde bij het derde lid
      van art.5 der Mijnwet BES geschieden binnen de tijd van één jaar na het openvallen der erfenis.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      Van elke verandering in het bestuur – commissarissen daaronder begrepen – van naamloze vennootschappen en
      besloten vennootschappen welke houders zijn van het recht op concessie of van concessies of welke andere naamloze
      vennootschappen en besloten vennootschappen, houders van het recht op concessie of van concessiën besturen,
      moet door dat bestuur, binnen één maand nadat de verandering heeft plaats gehad, worden kennis gegeven aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel24
  - number: '24.2'
    text: 'In de kennisgeving moet worden opgegeven:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel24
  - number: 24.2.a
    text: de nationaliteit van den nieuwen bestuurder of commissaris;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel24
  - number: 24.2.b
    text: of hij ingezetene is van Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel24
  - number: 24.2.c
    text: waar hij woonachtig is.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel24
  - number: '24.3'
    text: |-
      Onze Minister is bevoegd om te alle tijden te vorderen, dat binnen een voor elk geval door hem te stellen termijn,
      bewijzen worden overgelegd, aantoonende de juistheid van de bij het tweede lid van dit artikel voorgeschreven
      opgaven. De gestelde termijn kan in bijzondere gevallen éénmaal worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel24
  - number: '24.4'
    text: |-
      Het bovenstaande geldt eveneens voor veranderingen in het beheer van vennootschappen onder eene firma of bij wijze
      van geldschieting, die houders zijn van het recht op concessie of van concessiën dan wel die bestuurders zijn van
      naamlooze vennootschappen en besloten vennootschappen welke houders van het recht op concessie of van concessiën
      zijn.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel24
  - number: '25.1'
    text: |-
      Van elk optreden van een nieuwen vertegenwoordiger, als bedoeld in het eerste lid van art. 5 der Mijnwet BES, moet
      binnen ééne maand nadat dit optreden heeft plaats gehad, door den houder van het recht op concessie of van eene
      of meer concessiën, worden kennis gegeven aan Onze Minister, onder overlegging van de authentieke akte of van een
      volledig afschrift daarvan, waarbij de nieuwe vertegenwoordiger is aangesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel25
  - number: '25.2'
    text: |-
      Het bepaalde bij het eerste lid van dit artikel geldt eveneens voor tijdelijk vervangende of waarnemende
      vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      Bij de behandeling van een aanvrage om concessie en van een verzoek om goedkeuring tot overdracht van het recht
      op concessie of van eene concessie wordt, indien overigens tegen het verleenen van de concessie of de goedkeuring,
      voor zoover die wordt vereischt, geen bezwaren bestaan, nagegaan of de aanvrager dan wel de verkrijger voldoet aan
      de in art.5 der Mijnwet BES gestelde vereischten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel26
  - number: '26.2'
    text: |-
      In de gevallen genoemd in de [artt.19][ref1] en [20][ref2] wordt nagegaan of de rechtverkrijgenden van een
      overleden houder van het recht op concessie dan wel van eene concessie voldoen aan de in art.5 der Mijnwet BES
      gestelde vereischten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel20
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '20'
        hoofdstuk: II
  - number: '26.3'
    text: |-
      In de gevallen genoemd in [artt. 24][ref1] en [25][ref2] wordt nagegaan of in verband met het optreden van een
      nieuwen bestuurder of commissaris, een nieuwen beheerenden vennoot dan wel een nieuwen vertegenwoordiger, de houder
      van het recht op concessie of van eene concessie nog voldoet aan de in art.5 der Mijnwet BES gestelde vereischten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel25
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '24'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '25'
        hoofdstuk: II
  - number: '26.4'
    text: |-
      Overigens wordt gehandeld overeenkomstig het bepaalde bij de [artt. 78][ref1] en [79][ref2] of de
      [artt.80 tot en met 85][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel80
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '78'
        hoofdstuk: IV
        afdeling: 2e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '79'
        hoofdstuk: IV
        afdeling: 2e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '80'
        hoofdstuk: IV
        afdeling: 3e
  - number: '26.5'
    text: |-
      In de gevallen, bedoeld in het tweede en derde lid van dit artikel, wordt aan belanghebbenden, indien zij naar het
      oordeel van Onze Minister aan de gestelde vereischten voldoen, daarvan mededeeling gedaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel26
  - number: '27.1'
    text: |-
      In elk geval dat een persoon of een vennootschap, welke in verband met het verkrijgen van het recht op concessie
      of van eene concessie aan de in art.5 der Mijnwet BES gestelde vereischten moet voldoen, naar het oordeel van
      Onze Minister daaraan niet voldoet, zoomede in elk geval dat de houder van het recht op eene concessie of van eene
      concessie naar het oordeel van Onze Minister heeft opgehouden aan die gestelde vereischten te voldoen, wordt dit
      aan den belanghebbende te kennen gegeven bij met redenen omkleede beschikking.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      Deze beschikking wordt van wege Onze Minister aan den belanghebbende bij eene, bij deurwaardersexploit beteekende
      akte medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel27
  - number: '27.3'
    text: De beschikking wordt in de Staatscourant bij uitreksel aangekondigd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel27
  - number: '28.1'
    text: Recht tot opsporing wordt verkregen door schriftelijke vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel28
  - number: '28.2'
    text: |-
      Het schriftelijk verzoek om vergunning moet in twee eensluidende exemplaren worden ingediend bij Onze Minister. De
      exemplaren van het verzoekschrift moeten beide gezegeld zijn en gelijktijdig worden ingediend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel28
  - number: '28.3'
    text: Verzoeken om vergunning per telegram gedaan worden niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel28
  - number: '28.4'
    text: |-
      Op beide exemplaren van het verzoekschrift worden datum en uur der indiening aangeteekend en een exemplaar weder
      aan den verzoeker ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      Verzoeken om vergunning kunnen ook worden gedaan door een door den aanvrager daartoe bij authentieke of
      onderhandsche akte aangestelden bijzonderen gemachtigde; de volmacht moet bij het verzoekschrift worden overlegd en
      ook uitdrukkelijk de macht inhouden om voor den lastgever op de voorgeschreven wijze domicilie te kiezen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel29
  - number: '29.2'
    text: |-
      Zoolang een volmacht, welke is overlegd bij een verzoekschrift om vergunning, nog niet door de gemachtigde is
      terugontvangen, kan door dezen bij de indiening van andere verzoeken voor denzelfden aanvrager worden volstaan met
      de overlegging van een afschrift der volmacht onder mededeeling bij welk verzoek de origineele akte is overlegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel29
  - number: '29.3'
    text: |-
      Machtiging tot het aanvragen van vergunningen kan door een niet in Bonaire, Sint Eustatius en Saba gevestigden
      aanvrager ook worden verleend bij de in [art.8][ref1] bedoelde authentieke akte, waarbij door hem een
      vertegenwoordiger is aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel8
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '8'
        hoofdstuk: I
  - number: '30.1'
    text: |-
      Elk schriftelijk verzoek om vergunning mag slechts betrekking hebben op één aaneengesloten terrein dat een
      samenhangend geheel vormt en moet behalve van de overigens gevorderde stukken in elk geval vergezeld gaan van een
      kaart of schetsteekening van het in het verzoekschrift zoo nauwkeurig mogelijk aan te duiden terrein.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      In het verzoekschrift moeten de naam, voornamen, leeftijd, en woonplaats zoomede het beroep van den aanvrager
      worden vermeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel30
  - number: '30.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      Het aangeven van de grensomschrijving der aangevraagde terreinen in de verzoekschriften om vergunning moet zoo
      nauwkeurig mogelijk geschieden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel31
  - number: '31.2'
    text: |-
      De hoekpunten van een aangevraagd terrein moeten in het algemeen zoo worden gekozen dat ten minste één daarvan òf
      zelf een gemakkelijk op het terrein te vinden, uit zijn aard niet aan verandering of verplaatsing onderhevig vast
      punt is òf ten opzichte van een dergelijk zich in de nabijheid bevindend vast punt op eenvoudige wijze bepaald is.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel31
  - number: '31.3'
    text: |-
      De verbindingslijnen der hoekpunten moeten bestaan uit rechte lijnen of goed waarneembare natuurlijke grenzen dan
      wel uit grenzen tusschen districten en plantages, voor zoover die grenzen officieel zijn vastgesteld. Meridianen
      en parallellen, zoomede lijnen die daarmede een aangegeven hoek vormen, mogen alleen als grenzen worden gebezigd
      indien zij zijn bepaald door in de nabijheid gelegen vaste punten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel31
  - number: '32'
    text: |-
      Verzoeken om vergunning welke niet dadelijk bij de indiening geheel aan alle gestelde vereischten voldoen,
      worden op dien grond afgewezen en mogen niet aan de aanvragers ter verbetering, wijziging of aanvulling worden
      teruggezonden; kleine fouten of onduidelijkheden van ondergeschikt belang, welke in de verzoeken mochten voorkomen
      en zonder terugzending aan de aanvragers ambtshalve kunnen worden verbeterd, leveren op zich zelf geen bezwaar op
      tegen het verleenen van vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel32
  - number: '33.1'
    text: |-
      Verschillende met dezelfde postbestelling of op andere wijze gelijktijdig door Onze Minister ontvangen aanvragen
      voor één en hetzelfde terrein worden geacht alle op hetzelfde tijdstip te zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel33
  - number: '33.2'
    text: |-
      Onder aanvragen voor één en hetzelfde terrein worden ook verstaan aanvragen voor terreinen die gedeeltelijk
      samenvallen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel33
  - number: '33.3'
    text: |-
      Omtrent de voorkeur van gelijktijdig voor één en hetzelfde terrein ingediende aanvragen voor zoover zij voor eene
      gunstige beschikking in aanmerking kunnen komen wordt door het lot beslist. De loting heeft plaats op de door Onze
      Minister te bepalen wijze. Van den uitslag der loting wordt proces-verbaal opgemaakt. Aan belanghebbenden wordt op
      hun verlangen door Onze Minister van het proces-verbaal inzage verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel33
  - number: '33.4'
    text: |-
      Wanneer een aanvrage welke ingevolge het bepaalde bij dit artikel de voorkeur heeft, om de een of andere reden
      wordt afgewezen, geniet de voorkeur de aanvrage welke bij de loting het volgend nummer heeft getrokken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel33
  - number: '33.5'
    text: |-
      Bij gunstige beschikking op een aanvrage welke de voorkeur heeft, worden alle andere aanvragen welke volgens dit
      artikel moeten worden geacht voor één en hetzelfde terrein te zijn gedaan, afgewezen ook al is door die beschikking
      een gedeelte van het terrein waarvoor de andere aanvragen zijn gedaan, beschikbaar gebleven. Voor dat beschikbaar
      gebleven gedeelte kan slechts vergunning worden verleend nadat daarvoor een nieuwe aanvrage is ingediend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel33
  - number: '34'
    text: |-
      Nadat Onze Minister een verzoek om vergunning met de daarop betrekkelijke stukken heeft ontvangen en nadat
      overeenkomstig [art.33][ref1] omtrent de voorkeur is beslist, wordt de aanvrage ten spoedigste bekend gemaakt in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel33
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '33'
        hoofdstuk: III
  - number: '35.1'
    text: |-
      Eene vergunning tot het doen van mijnbouwkundige opsporing wordt slechts verleend aan één persoon of ééne
      vennootschap.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel35
  - number: '35.2'
    text: 'Vergunning tot opsporing worden niet verleend aan:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel35
  - number: 35.2.a
    text: Minderjarigen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel35
  - number: 35.2.b
    text: Onder curateele gestelden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel35
  - number: 35.2.c
    text: |-
      Personen of vennootschappen, die ingevolge wettelijk voorschrift van het verkrijgen van vergunningen zijn
      uitgesloten;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel35
  - number: 35.2.d
    text: |-
      Naamlooze vennootschappen en besloten vennootschappen tot wier werkkring volgens hare statuten het bedrijven van
      mijnbouw niet behoort.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel35
  - number: '36.1'
    text: |-
      Aanvragen om vergunning ingediend voor terreinen, binnen welke aan anderen vergunning tot het doen van opsporingen
      is verleend, zoolang dezen ingevolge die vergunning eene afspraak op concessie geldend kunnen maken, worden
      afgewezen. Voor zoodanige terreinen kunnen eerst geldige aanvragen worden ingediend nadat de daarvoor verleende
      vergunning is vervallen of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel36
  - number: '36.2'
    text: |-
      Het bepaalde bij het vorige lid is ook toepasselijk op aanvragen voor terreinen, waarvan een gedeelte behoort tot
      het onderzoekingsterrein van een ander.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel36
  - number: '37'
    text: |-
      Bij overlijden van een aanvrager vervalt zijne aanvrage; zijne rechtverkrijgenden kunnen aan zijne aanvrage geene
      rechten of aanspraken ontleenen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel37
  - number: '38.1'
    text: 'De beschikking waarbij vergunning verleend wordt moet behelzen:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.a
    text: den naam, de voornamen, het beroep en de woonplaats van den houder der vergunning;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.b
    text: de oppervlakte van het onderzoekingsterrein, uitgedrukt in hectaren, met verwaarloozing van onderdeelen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.c
    text: de grenzen van het onderzoekingsterrein;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.d
    text: den duur der vergunning;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.e
    text: den naam van het eiland en het district, waarbinnen het onderzoekingsterrein is gelegen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.f
    text: het gekozen domicilie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.g
    text: |-
      de voorwaarden, welke aan de vergunning zijn verbonden, in elk geval de voorwaarde genoemd in het
      [tweede lid van art. 141][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel141
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '141'
        hoofdstuk: VIII
        afdeling: Eerste
  - number: 38.1.h
    text: |-
      het bedrag van het door den houder der vergunning verschuldigd vast recht en de tijdstippen waarop het bedrag
      uiterlijk over het eerste vergunningsjaar en verder telken jare over volgende vergunningsjaren moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.1.i
    text: den datum.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: '38.2'
    text: 'Voorts moet in de beschikking worden melding gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.2.a
    text: |-
      de bezwaren die door rechthebbende op den grond of derde belanghebbenden mochten zijn ingebracht en de
      dienaangaande genomen beslissing; indien geen bezwaren zijn ingebracht, wordt zulks uitdrukkelijk in de beschikking
      vermeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
  - number: 38.2.b
    text: |-
      de beslissing van het Gemeenschappelijk Hof van Justitie bedoeld in het [tweede lid van art.250][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel250
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '250'
        hoofdstuk: Eenig
  - number: '39'
    text: |-
      Wanneer de juiste oppervlakte van een onderzoekingsterrein niet met de zekerheid kan worden berekend, kan worden
      volstaan met eene schatting tenzij de aanvrager meting van het terrein op zijne kosten verlangt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel39
  - number: '40.1'
    text: |-
      Van de beschikking waarbij vergunning verleend is, wordt zoo spoedig mogelijk een authentiek en volledig afschrift
      uitgereikt aan den houder der vergunning of, zoo de houder der vergunning niet in Bonaire, Sint Eustatius en Saba
      is gevestigd, aan diens vertegenwoordiger aldaar.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel40
  - number: '40.2'
    text: |-
      De verleende vergunning wordt bekend gemaakt in de Staatscourant; in die bekendmaking wordt de grensomschrijving
      van het afgestane onderzoekingsterrein vermeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel40
  - number: '40.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel40
  - number: '41.1'
    text: |-
      Ingeval het in het [eerste lid van art.40][ref1] bedoeld afschrift van de vergunningsbeschikking wegens
      het onbekend zijn van het adres van den houder der vergunning (of van diens gemachtigde) dan wel van den
      vertegenwoordiger, niet binnen een termijn van drie maanden na de verzending is kunnen worden uitgereikt, wordt dit
      aangeteekend. De vergunning wordt alsdan geacht niet te zijn verleend; er kunnen derhalve geene rechten aan worden
      ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '41.2'
    text: |-
      De bepaling van het vorig lid is mede van toepassing wanneer het voor het afschrift van de vergunningsbeschikking
      verschuldigde zegelgeld niet binnen een termijn van drie maanden na de verzending is voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel41
  - number: '41.3'
    text: |-
      Op de krachtens dit artikel door Onze Minister genomen beschikkingen is van toepassing het bepaalde bij het
      [tweede lid van art.40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '42.1'
    text: |-
      Wanneer eene vergunning is verleend aan een aanvrager die op het tijdstip der verleening reeds was overleden,
      terwijl Onze Minister onkundig was dat overlijden, wordt de vergunning geacht niet te zijn verleend, zoodat de
      rechtverkrijgenden van den overleden aanvrager aan zoodanige vergunning geene rechten kunnen ontleenen. Hiervan
      moet aanteekening geschieden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel42
  - number: '42.2'
    text: |-
      Op de krachtens dit artikel door Onze Minister genomen beschikking is van toepassing het bepaalde bij het
      [tweede lid van art.40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '43.1'
    text: |-
      De beschikking van Onze Minister waarbij een verzoek om vergunning wordt afgewezen, moet de gronden vermelden
      waarop de afwijzing berust. Behoudens het bepaalde bij [art.16][ref1] wordt van de beschikking aan den
      belanghebbende kosteloos een volledig afschrift uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel16
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '16'
        hoofdstuk: I
  - number: '43.2'
    text: Van de in het vorig lid genoemde beschikking wordt een volledig afschrift bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel43
  - number: '44.1'
    text: |-
      Onze Minister is bevoegd naar aanleiding van nader verkregen gegevens nopens de grenzen en de oppervlakte van het
      onderzoekingsterrein of in verband met wijzigingen van officieel vastgestelde grenzen van districten en plantages,
      na het verleenen van de vergunning bij een nadere beschikking de aanvankelijk in de vergunningsbeschikking
      opgenomen grensomschrijving en oppervlakte van het onderzoekingsterrein te wijzigen. Hij is tot die wijziging
      verplicht wanneer de houder der vergunning meting van het terrein op zijne kosten verlangt en de meting eene andere
      oppervlakte aangeeft dan aanvankelijk in de vergunningsbeschikking was opgenomen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel44
  - number: '44.2'
    text: |-
      Op de in het vorig lid bedoeld beschikkingen is van toepassing het bepaalde bij [art.40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '45.1'
    text: |-
      Met de opsporing moet binnen den tijd van één jaar na den datum, waarop de vergunning verleend is, een aanvang
      zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel45
  - number: '45.2'
    text: |-
      Uiterlijk eene maand na het verstrijken van den in het eerste lid van dit artikel genoemden termijn moet de houder
      der vergunning of zijn vertegenwoordiger dan wel hij, die overeenkomstig het bepaalde bij [art.168][ref1] met de
      plaatselijke leiding is belast, de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba
      schriftelijk in kennis stellen met den aard der op het onderzoeksterrein verrichte werkzaamheden en met hetgeen
      overigens is verricht, zoomede met den tijd waarop en, voor zooveel de werkzaamheden op het terrein betreft, met de
      plaats alwaar de werkzaamheden zijn verricht en uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel168
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '168'
        hoofdstuk: IX
  - number: '45.3'
    text: |-
      Na ontvangst van de in het eerste lid genoemde schriftelijke kennisgeving gaat de Rijksvertegenwoordiger voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba na of hetgeen is verricht als een begin van opsporing kan worden
      beschouwd, nadat zoo noodig op hun last een plaatselijk onderzoek is ingesteld, waarvan proces-verbaal wordt
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel45
  - number: '45.4'
    text: |-
      Als datum van indiening der kennisgeving, geldt die van het daarvoor kosteloos afgegeven, gedagteekend
      ontvangbewijs.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel45
  - number: '45.5'
    text: |-
      De Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba zendt de schriftelijke
      kennisgeving ten spoedigste door aan Onze Minister, vergezeld van zijn advies en, indien een plaatselijk onderzoek
      is ingesteld, van het opgemaakt proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel45
  - number: '46'
    text: |-
      Indien door Onze Minister wordt beslist, dat niet tijdig met de opsporing een aanvang is gemaakt of, indien geen
      schriftelijke kennisgeving bedoeld in het [tweede lid van art. 45][ref1] is ingediend, wordt overeenkomstig de
      [artt. 61][ref2] en [62][ref3] de vergunning ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel62
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '45'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '61'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '62'
        hoofdstuk: III
  - number: '47.1'
    text: |-
      Het schriftelijk verzoek om verlening van eene vergunning moet door den houder of zijn vertegenwoordiger in
      twee eensluidende gezegelde exemplaren worden ingediend aan Onze Minister en wel binnen drie maanden vóór het
      verstrijken van den vergunningstermijn, waarvan de verlenging wordt gevraagd. Met de exemplaren van het verzoek
      wordt gehandeld overeenkomstig het bepaalde bij het vierde lid van artikel 1a van de Mijnwet BES in verband met het
      [tweede en vierde lid van art.28][ref1] van dit besluit. Verzoeken om verlenging ingediend nà, of langer dan drie
      maanden vóór, het verstrijken van den vergunningstermijn worden onvoorwaardelijk afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel28
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '28'
        hoofdstuk: III
  - number: '47.2'
    text: |-
      Het verzoek kan worden gedaan door een gemachtigde; de volmacht moet bij het verzoek worden overgelegd. Het
      bepaalde bij het [tweede en derde lid van art.29][ref1] is ten deze toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel29
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '29'
        hoofdstuk: III
  - number: '47.3'
    text: |-
      Het verzoek om verlenging mag, evenals de beschikking waarbij de verlenging wordt verleend, slechts betrekking
      hebben op ééne vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel47
  - number: '47.4'
    text: |-
      De verlengde vergunningstermijn gaat in met den dag volgende op dien waarop de termijn, waarvan de verlenging wordt
      verleend, eindigt of inmiddels reeds is geëindigd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel47
  - number: '47.5'
    text: |-
      In afwachting van de beschikking op een verzoek om verlenging mogen de werkzaamheden op het onderzoekingsterrein
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel47
  - number: '47.6'
    text: |-
      Bij overlijden van den houder eener vergunning die een verzoek om verlenging heeft ingediend, waarop alsdan nog
      niet is beschikt, kan de verlenging aan de rechtverkrijgenden worden verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel47
  - number: '48.1'
    text: |-
      Het verzoek om verlenging wordt afgewezen indien niet is aangetoond, dat de houder der vergunning diligent is
      geweest.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel48
  - number: '48.2'
    text: |-
      Het verzoek om verlenging wordt mede afgewezen indien door den houder der vergunning niet door aanbieding van
      kwitantiën is aangetoond, of indien niet op andere wijze aan Onze Minister is gebleken, dat de aan vast recht
      verschuldigde bedragen zijn betaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel48
  - number: '48.3'
    text: |-
      Onder diligentie wordt verstaan, dat van de vergunning ernstig gebruik is gemaakt, in dien zin, dat de
      werkzaamheden op het terrein zoo regelmatig mogelijk zijn voortgezet en alleen door omstandigheden onafhankelijk
      van den wil van den houder der vergunning nog niet tot zoodanig resultaat hebben geleid, dat op grond daarvan eene
      aanspraak op concessie geldend gemaakt kan worden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel48
  - number: '48.4'
    text: |-
      Teneinde te kunnen beoordeelen of de houder der vergunning diligent is geweest, moet bij het verzoek om verlenging
      – voor de eerste maal – worden overgelegd een zakelijk verslag nopens de werkzaamheden welke gedurende en na
      afloop van het eerste jaar van den vergunningstermijn op het onderzoekingsterrein hebben plaats gehad, nopens
      hetgeen overigens is verricht, met vermelding van de resultaten dier werkzaamheden en verrichtingen. Een verzoek om
      verlenging waarbij geen verslag is overgelegd wordt dadelijk afgewezen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel48
  - number: '49.1'
    text: |-
      Bij het verzoek om verlenging voor de tweede maal moet worden overgelegd een verslag betreffende de werkzaamheden
      en verrichtingen gedurende het jaar, waarvoor de vergunning voor de eerste maal werd verlengd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel49
  - number: '49.2'
    text: |-
      Overigens geldt het bepaalde bij de [artt.47][ref1] 4n [48][ref2] eveneens ten aanzien van verlenging voor de
      tweede maal.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel48
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '47'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '48'
        hoofdstuk: III
  - number: '50'
    text: |-
      De ingevolge de [artt.48][ref1] en [49][ref2] ingediende verslagen worden niet aan de houders der vergunning
      teruggezonden, maar blijven berusten bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel49
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '48'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '49'
        hoofdstuk: III
  - number: '51'
    text: |-
      Op de beschikkingen houdende verlenging van den vergunningstermijn is van toepassing het bepaalde bij
      [art.40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '52.1'
    text: |-
      De beschikking waarbij een verzoek om verlenging van den vergunningstermijn wordt afgewezen, moet de gronden
      vermelden waarop de afwijzing berust.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel52
  - number: '52.2'
    text: |-
      Op die beschikkingen is van toepassing het bepaalde bij [art.43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel43
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '43'
        hoofdstuk: III
  - number: '53'
    text: |-
      Wanneer een vergunning door tijdsverloop is vervallen of is ingetrokken, mag aan hen die houders dier vergunning
      zijn geweest, nòch voor hetzelfde terrein, nòch voor een gedeelte daarvan opnieuw vergunning verleend; evenmin
      mag aan hen een inmiddels aan een ander voor datzelfde terrein of een gedeelte daarvan verleende of overgedragen
      vergunning worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel53
  - number: '54.1'
    text: |-
      De vergunning tot het doen van mijnbouwkundige opsporingen mag niet anders worden overgedragen dan krachtens
      verkregen toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel54
  - number: '54.2'
    text: |-
      Het schriftelijke verzoek tot overdracht der vergunning tot opsporing moet door de beide bij de overdracht
      betrokken partijen worden gedaan; het kan bij één verzoekschrift worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel54
  - number: '54.3'
    text: |-
      Het verzoek kan ook worden gedaan door een gemachtigde; de volmacht of volmachten moeten bij het verzoekschrift
      worden overlegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel54
  - number: '54.4'
    text: |-
      Het verzoek om toestemming tot overdracht mag, evenals de beschikking waarbij de toestemming wordt verleend,
      slechts betrekking hebben op ééne vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel54
  - number: '54.5'
    text: |-
      Bij het overlijden van een der bij de overdracht betrokken partijen vervalt, indien de toestemming nog niet is
      verleend, het verzoek daartoe.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel54
  - number: '54.6'
    text: De overdracht gaat in met den datum van de beschikking, waarbij de toestemming wordt verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel54
  - number: '55.1'
    text: |-
      Het verzoek om toestemming tot overdracht moet vergezeld gaan van de c.q. gevorderde stukken; in elk geval moet
      door overlegging van kwitantiën of op andere wijze blijken, dat de aan vast recht verschuldigde bedragen zijn
      betaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel55
  - number: '55.2'
    text: |-
      In het verzoekschrift moeten de beschikking waarbij de vergunning is verleend, zoomede de naam, voornamen, leeftijd
      en woonplaats en het beroep van den verkrijger worden vermeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel55
  - number: '55.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel55
  - number: '55.4'
    text: |-
      Verzoeken om toestemming tot overdracht welke niet dadelijk bij de indiening geheel aan alle gestelde
      vereischten voldoen, worden op dien grond afgewezen en mogen niet ter verbetering, wijziging of aanvulling worden
      teruggezonden; kleine fouten of onduidelijkheden van ondergeschikt belang, welke in de verzoeken mochten voorkomen
      en zonder terugzending ambtshalve kunnen worden verbeterd, leveren op zich zelf geen bezwaar op tegen het verleenen
      der toestemming.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel55
  - number: '56.1'
    text: De vergunning tot opsporing kan slechts op één persoon of ééne vennootschap worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel56
  - number: '56.2'
    text: |-
      De vergunning kan niet worden overgedragen op een persoon of vennootschap aan wie ingevolge [art.35][ref1] geen
      vergunning zou kunnen verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel35
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '35'
        hoofdstuk: III
  - number: '56.3'
    text: |-
      De toestemming tot overdracht wordt ook geweigerd wanneer door de overdracht houder der vergunning zou worden een
      persoon of vennootschap, aan wie ingevolge [art.53][ref1] voor het betrokken onderzoekingsterrein niet opnieuw
      vergunning zou mogen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel53
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '53'
        hoofdstuk: III
  - number: '56.4'
    text: |-
      De toestemming tot overdracht wordt mede geweigerd indien niet door aanbieding der kwitantiën is aangetoond of
      indien niet op andere wijze is gebleken, dat de aan vast recht verschuldigde bedragen zijn betaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel56
  - number: '57'
    text: |-
      Op de beschikkingen waarbij toestemming tot overdracht van vergunningen is verleend, is van toepassing het bepaalde
      bij [art. 40][ref1], met dien verstande, dat een afschrift van de beschikking wordt uitgereikt aan den nieuwen
      houder der vergunning of zijn vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '58'
    text: |-
      De houder, die de vergunning heeft overgedragen, is verplicht nadat de toestemming tot overdracht is verleend
      het hem ingevolge [art. 40][ref1] uitgereikt afschrift van de vergunningsbeschikking aan den nieuwen houder af
      te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '59.1'
    text: |-
      De beschikking waarbij een verzoek om toestemming tot overdracht van eene vergunning is afgewezen, moet de gronden
      vermelden waarop de afwijzing berust.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel59
  - number: '59.2'
    text: |-
      Op die beschikking is van toepassing het bepaalde bij [art.43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel43
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '43'
        hoofdstuk: III
  - number: '60.1'
    text: 'De vergunning wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel60
  - number: 60.1.a
    text: |-
      ingeval niet binnen de in [art. 45][ref1] daarvoor bepaalden tijd met de opsporing is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel45
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '45'
        hoofdstuk: III
  - number: 60.1.b
    text: |-
      op vordering van de rechthebbenden op den grond of van derde belanghebbenden, ingeval de opsporingen worden
      ondernomen zonder dat te hunnen opzichte is voldaan aan de bepalingen van [art.173][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel173
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '173'
        hoofdstuk: X
        afdeling: Eerste
  - number: '60.2'
    text: 'De vergunning kan worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel60
  - number: 60.2.a
    text: ingeval de houder der vergunning aan eene der daarbij gestelde voorwaarden niet voldoet.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel60
  - number: 60.2.b
    text: |-
      hetzij voor het geheele onderzoekingsterrein, hetzij voor een gedeelte daarvan, op het verzoek van den houder
      der vergunning. Dit verzoek wordt in tweevoud ingediend aan Onze Minister. Op de beide exemplaren van het
      verzoekschrift worden dag en uur der indiening aangeteekend en een exemplaar weder aan den verzoeker ter hand
      gesteld. Binnen drie maanden na den dag der indiening wordt op het verzoek beschikt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel60
  - number: '61.1'
    text: De intrekking eener vergunning tot opsporing geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel61
  - number: '61.2'
    text: |-
      De beschikking waarbij eene vergunning wordt ingetrokken, vermeldt de gronden waarop de intrekking berust en wordt,
      tenzij de intrekking op eigen verzoek is geschied, aan den houder der vergunning gerechtelijk beteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel61
  - number: '62.1'
    text: |-
      Tot de intrekking eener vergunning als bedoeld in [art.60 eerste lid sub a][ref1] wordt overgegaan zoodra ingevolge
      [art. 46][ref2] is beslist dat niet tijdig met de opsporing een aanvang is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel46
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '60'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '46'
        hoofdstuk: III
  - number: '62.2'
    text: |-
      De beschikking, waarbij eene vergunning ingevolge het eerste lid van dit artikel is ingetrokken, wordt in de
      Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel62
  - number: '63.1'
    text: |-
      Behoudens het bepaalde bij het tweede lid van dit artikel wordt tot de intrekking op vordering van de
      rechthebbenden op den grond of van derde belanghebbenden en om reden de houder der vergunning niet aan eene der
      daarbij gestelde voorwaarden heeft voldaan, niet overgegaan dan nadat de houder der vergunning in de gelegenheid is
      gesteld om binnen een bepaalden bekwamen termijn voor zijne belangen op te komen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel63
  - number: '63.2'
    text: |-
      Wanneer wordt gebruikt gemaakt van de bevoegdheid om de vergunning in te trekken om reden dat de houder niet heeft
      voldaan aan de voorwaarde, dat hij het door hem verschuldigd vast recht op de daarvoor bepaalde tijdstippen moet
      voldoen, wordt de houder der vergunning niet vooraf in de gelegenheid gesteld om voor zijne belangen op te komen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel63
  - number: '64.1'
    text: |-
      Van de beschikking waarbij een vergunning op vordering van rechthebbenden op den grond of van derde belanghebbenden
      is ingetrokken, wordt aan den verzoeker afschrift verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel64
  - number: '64.2'
    text: |-
      Van de beschikking waarbij de vordering van rechthebbenden op den grond of derde rechthebbenden om intrekking eener
      vergunning is afgewezen, wordt zoowel aan den verzoeker als den houder der vergunning afschrift verleend
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel64
  - number: '64.3'
    text: De beschikkingen in dit artikel bedoeld worden in de Staatscourant openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel64
  - number: '65.1'
    text: |-
      Wanneer eene vergunning voor een gedeelte van het onderzoekingsterrein op verzoek van den houder wordt ingetrokken,
      worden voor het gedeelte of de gedeelten die hij behoudt, door Onze Minister een of meer afzonderlijke nieuwe
      vergunningsbeschikkingen uitgereikt overeenkomstig het bepaalde bij de [artt.38][ref1], [39][ref2] en [40][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '38'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '39'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '65.2'
    text: |-
      De termijn eener nieuwe vergunning als bedoeld in het vorige lid, wordt geacht te zijn ingegaan op den dag, waarop
      de oorspronkelijke gedeeltelijk ingetrokken vergunning inging.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel65
  - number: '65.3'
    text: |-
      De beschikking, waarbij het verzoek van den houder eener vergunning om intrekking van zijne vergunning of van een
      deel daarvan is afgewezen, wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel65
  - number: '66.1'
    text: |-
      De intrekking op verzoek van den houder eener vergunning gaat in zoodra hem de beschikking houdende intrekking
      is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel66
  - number: '66.2'
    text: |-
      In alle andere gevallen gaat de intrekking in op den dag, waarop de intrekkingsbeschikking aan den houder der
      vergunning bij deurwaardersexploit is beteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel66
  - number: '66.3'
    text: |-
      Zoodra de intrekking van eene vergunning is ingegaan, moet de houder de opsporing op het onderzoeksterrein of op
      het gedeelte waarvoor de vergunning werd ingetrokken staken of doen staken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel66
  - number: '67'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel67
  - number: '68'
    text: |-
      In dit besluit wordt onder «concessie-aanvraag» en «aanvrage om concessie» verstaan: het in het
      [eerste lid van het volgende artikel][ref1] bedoeld verzoekschrift, waarbij de ontdekker eener in de Mijnwet BES
      genoemde delfstof zijne aanspraken doet gelden en dientengevolge recht op concessie tot ontginning van de ontdekte
      delfstof verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel69
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '69'
        hoofdstuk: IV
        afdeling: 1e
  - number: '69.1'
    text: |-
      de aanspraken in het eerste lid van art.2 der Mijnwet BES bedoeld worden geldend gemaakt door een schriftelijk
      verzoek om concessie.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel69
  - number: '69.2'
    text: |-
      In de concessie-aanvrage moet de aanvrager domicilie kiezen in de hoofdplaats van het eiland waarbinnen het
      concessie-terrein is gelegen voor den duur der concessie.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel69
  - number: '69.3'
    text: |-
      Het schriftelijk verzoek om concessie moet in twee eensluidende exemplaren worden ingediend aan Onze Minister. De
      exemplaren van het verzoekschrift moeten beide gezegeld zijn en gelijktijdig worden ingediend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel69
  - number: '69.4'
    text: |-
      Op beide exemplaren van het verzoekschrift worden datum en uur der indiening aangeteekend en een exemplaar weder
      aan den verzoeker ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel69
  - number: '69.5'
    text: Concessie-aanvragen per telegram gedaan worden niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel69
  - number: '69.6'
    text: |-
      De concessie-aanvraag wordt zoo spoedig mogelijk na de indiening volledig in de Staatscourant openbaar gemaakt met
      vermelding van het tijdstip der indiening.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel69
  - number: '70.1'
    text: |-
      Concessie-aanvragen kunnen ook worden gedaan door een door den aanvrager bij authentieke of onderhandsche akte
      aangestelden bijzonderen gemachtigde; de volmacht moet bij de aanvrage worden overgelegd en ook uitdrukkelijk
      de macht inhouden om voor den lastgever in de concessie-aanvraag op de in het [tweede lid van art. 69][ref1]
      voorgeschreven wijze domicilie te kiezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel69
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '69'
        hoofdstuk: IV
        afdeling: 1e
  - number: '70.2'
    text: |-
      Zoolang een volmacht welke is overgelegd bij een concessie-aanvraag nog niet door den gemachtigde is
      terugontvangen, kan door dezen bij de indiening van andere verzoeken voor dezelfden aanvrager worden volstaan met
      de overlegging van een afschrift der volmacht onder mededeeling bij welke verzoek de origineele akte is overgelegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel70
  - number: '70.3'
    text: |-
      Machtiging tot het aanvragen van concessiën kan door een niet in Bonaire, Sint Eustatius en Saba gevestigden
      aanvrager ook worden verleend bij de in de [artt. 8][ref1] en [22][ref2] bedoelde authentieke akte waarbij door hem
      een vertegenwoordiger is aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel22
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '8'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '22'
        hoofdstuk: II
  - number: '71.1'
    text: |-
      Verschillende met dezelfde postbestelling of op andere wijze gelijktijdig bij Onze Minister ingediende concessie-
      aanvragen voor één en hetzelfde terrein worden geacht alle op hetzelfde tijdstip te zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel71
  - number: '71.2'
    text: |-
      Onder concessie-aanvragen voor één en hetzelfde terrein worden ook verstaan aanvragen voor terreinen die
      gedeeltelijk samenvallen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel71
  - number: '71.3'
    text: |-
      Omtrent de in het eerste lid van art.2 der Mijnwet BES bedoelde voorkeur wordt ten aanzien van gelijktijdig voor
      één en hetzelfde terrein ingediende concessie-aanvragen beslist door Onze Minister op de door dezen te bepalen
      wijze.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel71
  - number: '71.4'
    text: |-
      Wanneer eene concessie-aanvraag, welke ingevolge het eerste lid van art. 2 der Mijnwet BES en dit artikel de
      voorkeur heeft, om de een of andere reden wordt afgewezen, geniet de voorkeur de daarop volgende aanvrage met
      inachtneming van de door Onze Minister bepaalde volgorde.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel71
  - number: '71.5'
    text: |-
      Bij gunstige beschikking op een aanvrage welke de voorkeur heeft, worden alle andere aanvragen, welke volgens dit
      artikel moeten worden geacht voor één en hetzelfde terrein te zijn gedaan, afgewezen ook al is door die beschikking
      een gedeelte van het terrein waarvoor de andere aanvragen zijn gedaan, beschikbaar gebleven. Voor dat beschikbaar
      gebleven gedeelte wordt slechts concessie verleend nadat daarvoor een nieuwe geldige aanvrage is ingediend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel71
  - number: '72'
    text: |-
      Elke concessie-aanvraag mag slechts betrekking hebben op één aaneengesloten terrein, dat één samenhangend geheel
      vormt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel72
  - number: '73'
    text: 'De concessie-aanvraag moet bevatten:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.1°
    text: den naam, de voornamen en de woonplaats van den verzoeker;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.2°
    text: de benaming der delfstof of de namen der delfstoffen voor welker ontginning concessie gevraagd wordt;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.3°
    text: |-
      de ligging van de ontdekte vindplaats of vindplaatsen en de grenzen, hetzij van het aangevraagde, hetzij van het
      bestaande concessie-terrein;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.4°
    text: den naam aan de concessie te geven of gegeven;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.5°
    text: het gekozen domicilie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.6°
    text: het beroep en den leeftijd van den verzoeker;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.7°
    text: |-
      of de ontdekking is geschied als houder eener vergunning dan wel als concessionaris, onder opgave van datum en
      nummer van de vergunningsbeschikking dan wel de concessiebeschikking;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: 73.8°
    text: |-
      den tijd waarvoor de concessie wordt aangevraagd met dien verstande dat die, ingevolge het vijfde lid van artikel
      1a van de Mijnwet BES, 75 jaren niet mag te boven gaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel73
  - number: '74.1'
    text: |-
      Elke concessie-aanvraag moet behalve van de in het [eerste lid van art. 73][ref1] genoemde en nog overigens
      gevorderde stukken, vergezeld gaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel73
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '73'
        hoofdstuk: IV
        afdeling: 1e
  - number: 74.1.1°
    text: |-
      eene aantooning als bedoeld in [art. 86][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel86
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '86'
        hoofdstuk: IV
        afdeling: 4e
  - number: 74.1.2°
    text: |-
      eene plattegrondteekening in drievoud van het aangevraagde terrein, op geen kleiner schaal dan van 1:20000, na
      plaatselijke opmeting opgemaakt door den rooimeester of een ander persoon als bedoeld in het tweede lid van dit
      artikel, op welke plattegrondteekening nauwkeurig moeten zijn aangegeven:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: 74.1.2°.a
    text: de grenzen van het aangevraagd terrein;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: 74.1.2°.b
    text: |-
      de punten, geschikt voor de afbakening van merkteekens, waarvan twee opeenvolgende op niet meer dan 500 meter
      afstand mogen gelegen zijn;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: 74.1.2°.c
    text: de ligging der ontdekte vindplaats of vindplaatsen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: 74.1.2°.d
    text: de natuurlijke of kunstmatig aangebrachte , ter oriënteering dienende, kenbare vaste punten aan de oppervlakte;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: 74.1.2°.e
    text: de astronomische en magnetische meridiaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: '74.2'
    text: |-
      Bij uitzondering kan, indien ten genoege van Onze Minister door den aanvrager overtuigend wordt aangetoond, dat
      het hem onmogelijk is geweest om over den rooimeester te beschikken, worden volstaan met eene door een ander
      daartoe naar het oordeel van Onze Minister geschikt persoon verrichte plaatselijke opmeting en daarvan opgemaakte
      plattegrondteekening.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: '74.3'
    text: |-
      Wanneer ten genoege van Onze Minister wordt aangetoond, dat de begrenzing van het aangevraagde terrein door vaste
      merkteekens of anderszins onmiskenbaar is vastgelegd, behoeft de in het tweede lid sub 2°. genoemde kaart niet alle
      gegevens sub a–e te vermelden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: '74.4'
    text: |-
      Wanneer ten genoege van Onze Minister wordt aangetoond, dat de in het eerste lid van dit artikel bedoelde stukken
      niet dadelijk bij de concessie-aanvraag kunnen worden overgelegd, wordt een termijn van ten langste zes maanden
      gesteld waarbinnen de aanvrager die stukken moet indienen. De gestelde termijn kan in bijzondere gevallen éénmaal
      met ten langste drie maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel74
  - number: '75'
    text: |-
      Bij de plaatselijke opmeting van een aan te vragen concessieterrein, bedoeld in het
      [eerste lid sub 2 van art. 74][ref1], moeten de grenzen van dat terrein zoodanig op het terrein worden uitgezet,
      dat zij te allen tijde zijn terug te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel74
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '74'
        hoofdstuk: IV
        afdeling: 1e
  - number: '76.1'
    text: Concessieterreinen moeten zooveel mogelijk door rechte lijnen begrensd zijn.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel76
  - number: '76.2'
    text: Lijnen zonder bekend azimuth getrokken mogen niet als grenzen worden aangenomen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel76
  - number: '76.3'
    text: |-
      De hoekpunten der aangevraagde concessieterreinen moeten zóó worden gekozen dat ten minste één daarvan óf zelf een
      gemakkelijk op het terrein te vinden, uit zijn aard niet aan verandering of verplaatsing onderhevig vast punt is òf
      ten opzichte van een dergelijk zich in de nabijheid bevindend vast punt is bepaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel76
  - number: '77.1'
    text: Eene concessie tot ontginning wordt slechts verleend aan één persoon of ééne vennootschap.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel77
  - number: '77.2'
    text: 'Concessiën tot ontginning worden niet verleend aan:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel77
  - number: 77.2.a
    text: minderjarigen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel77
  - number: 77.2.b
    text: onder curateele gestelden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel77
  - number: 77.2.c
    text: |-
      personen of vennootschappen, die ingevolge wettelijk voorschrift van het verkrijgen van concessiën tot ontginning
      zijn uitgesloten;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel77
  - number: 77.2.d
    text: |-
      naamloze vennootschappen en besloten vennootschappen tot wier werkkring volgens hare statuten het drijven van
      mijnbouw niet behoort;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel77
  - number: 77.2.e
    text: |-
      hem, die krachtens art. 7 der Mijnwet BES van zijn rechten als concessionaris vervallen is verklaard maar alleen
      voor zooveel betreft het terrein zijner vroegere concessie.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel77
  - number: '78.1'
    text: |-
      Het schriftelijk verzoek om goedkeuring van een overdracht van het recht op concessie in zijn geheel, ingevolge het
      tweede lid van art. 2 en het derde lid van art. 5 der Mijnwet BES wordt gericht aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.2'
    text: |-
      Het verzoek moet door de beide bij de overdracht betrokken partijen worden gedaan; het kan bij één verzoekschrift
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.3'
    text: |-
      Het verzoek kan ook worden gedaan door een gemachtigde; de volmacht of volmachten moeten bij het verzoekschrift
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.4'
    text: Elk verzoek om goedkeuring mag slechts betrekking hebben op ééne concessie-aanvraag.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.5'
    text: |-
      Bij het verzoek om goedkeuring tot overdracht moet, behalve de ingevolge het [tweede lid van art. 18][ref1] of
      [art. 20][ref2] en overigens gevorderde stukken worden overgelegd het door den houder van het recht op concessie
      ingevolge het [derde lid van art. 69][ref3] terugontvangen exemplaar van zijn concessie-aanvraag. Ook moet door
      overlegging van kwitantiën of op andere wijze blijken, dat de aan vast recht verschuldigde bedragen zijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel69
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '18'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '20'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '69'
        hoofdstuk: IV
        afdeling: 1e
  - number: '78.6'
    text: |-
      In het verzoekschrift moeten de naam, voornamen, leeftijd en woonplaats en het beroep van den verkrijger worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.7'
    text: Bij overlijden van den verkrijger vervalt, indien de goedkeuring nog niet is verleend, het verzoek daartoe.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.8'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.9'
    text: Het recht op concessie kan slechts op één persoon of ééne vennootschap worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '78.10'
    text: |-
      Het recht op concessie kan niet worden overgedragen op een persoon of vennootschap aan wie ingevolge
      [art. 77][ref1] geen concessie zou kunnen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel77
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '77'
        hoofdstuk: IV
        afdeling: 1e
  - number: '78.11'
    text: |-
      De goedkeuring op de overdracht wordt ook geweigerd indien niet door aanbieding der kwitantiën is aangetoond of
      indien niet op andere wijze blijkt, dat de aan vast recht verschuldigde bedragen zijn betaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel78
  - number: '79.1'
    text: |-
      Onze Minister beschikt op het verzoek met inachtneming van het bepaalde bij de [artt. 26][ref1] en [27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel27
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '26'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '27'
        hoofdstuk: II
  - number: '79.2'
    text: Elke overdracht van het recht op concessie wordt door Onze Minister bij afzonderlijke beschikking goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel79
  - number: '79.3'
    text: De beschikking, waarbij de goedkeuring is verleend, wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel79
  - number: '79.4'
    text: De overdracht gaat in met den datum van de beschikking, waarbij de goedkeuring wordt verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel79
  - number: '79.5'
    text: |-
      De beschikking waarbij een verzoek om goedkeuring van een overdracht van het recht op concessie wordt afgewezen,
      wordt met redenen omkleed en, onverminderd het bepaalde bij [art. 27][ref1] in de Staatscourant bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel27
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '27'
        hoofdstuk: II
  - number: '80.1'
    text: |-
      Is Onze Minister van oordeel dat een concessie-aanvraag niet voldoet aan de in het eerste lid van art. 2 der
      Mijnwet BES gestelde vereischten, maar dat daaraan kan worden tegemoetgekomen door de noodige verbeteringen in
      de aanvrage aan te brengen, dan wordt, tenzij om andere redenen in elk geval afwijzend op de aanvrage moet worden
      beschikt, de aanvrager in de gelegenheid gesteld de noodige verbeteringen in zijn aanvrage aan te brengen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel80
  - number: '80.2'
    text: |-
      Daartoe wordt den aanvrager onder terugzending van de concessie-aanvrage medegedeeld, dat en waarom zijne aanvrage
      niet aan de in het eerste lid van art. 2 der Mijnwet BES gestelde vereischten voldoet, met uitnoodiging om binnen
      ééne maand nadat hem die mededeeling zal zijn uitgereikt, de noodige verbeteringen in de aanvrage aan te brengen
      en haar daarna wederom aan Onze Minister te doen toekomen. Voor de uitgereikte mededeeling wordt door den aanvrager
      een gedagteekend ontvangbewijs afgegeven, terwijl voor de door hem wederom ingediende concessie-aanvrage aan hem
      een gedagteekend ontvangbewijs wordt uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel80
  - number: '80.3'
    text: |-
      Het bepaalde bij de vorige leden geldt ook ten aanzien van de in [art. 74][ref1] genoemde, bij de aanvrage
      behoorende stukken


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel74
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '74'
        hoofdstuk: IV
        afdeling: 1e
  - number: '80.4'
    text: |-
      Voldoet de aanvrager niet aan de uitnoodiging om binnen de gestelden termijn de noodige verbeteringen in zijn
      aanvrage aan te brengen, dan wordt zij onvoorwaardelijk afgewezen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel80
  - number: '81'
    text: |-
      Is Onze Minister van oordeel, dat een concessie-aanvraag niet voldoet aan de in het eerste lid van art. 2 der
      Mijnwet BES gestelde vereischten en dat daaraan ook niet kan worden tegemoetgekomen door de noodige verbeteringen
      in de aanvrage aan te brengen, dan wordt de concessie-aanvrage onvoorwaardelijk afgewezen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel81
  - number: '82'
    text: |-
      Is Onze Minister van oordeel dat, ofschoon de aanvrage aan de in het eerste lid van art. 2 der Mijnwet BES gestelde
      vereischten voldoet, tegen het verleenen der concessie bezwaren bestaan, waaraan door den aanvrager niet kan worden
      tegemoetgekomen, dan wordt de concessie-aanvrage onvoorwaardelijk afgewezen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel82
  - number: '83'
    text: |-
      Voldoet de aanvrager niet aan de uitnoodiging om binnen den gestelden termijn hetzij aan de gerezen bezwaren
      tegemoet te komen, hetzij de noodige verbeteringen in de aanvrage of ten aanzien van de daarbij behoorende
      stukken aan te brengen, dan wel worden de vereischte stukken niet binnen den in het [vierde lid van art. 74][ref1]
      gestelden of verlengenden termijn ingediend, dan wordt de concessie-aanvrage onvoorwaardelijk afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel74
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '74'
        hoofdstuk: IV
        afdeling: 1e
  - number: '84'
    text: |-
      Zoodra vaststaat, dat zoowel de aanvraag als de daarbij behoorende stukken voldoen aan alle gestelde vereischten,
      wordt de aanvraag, indien gedurende en naar aanleiding van de behandeling daarin wijzigingen zijn aangebracht,
      onder verwijzing naar de eerste openbaarmaking ingevolge het [vijfde lid van art. 69][ref1], opnieuw volledig in de
      Staatscourant openbaar gemaakt met vermelding wederom van het tijdstip der indiening.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel69
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '69'
        hoofdstuk: IV
        afdeling: 1e
  - number: '85'
    text: |-
      Ieder belanghebbende kan binnen den tijd van drie maanden nadat een aanvrage om concessie is bekend gemaakt, voor
      zijne belangen opkomen en zijne bezwaren tegen het verleenen der aangevraagde concessie schriftelijk inbrengen bij
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel85
  - number: '86'
    text: |-
      Concessiën worden slechts verleend voor de winning van zoodanige delfstoffen, waarvan ten genoegen van Onze
      Minister wordt aangetoond, dat zij binnen het mijnveld in eene natuurlijke afzetting voorkomen, waaruit hare
      winning technisch mogelijk is.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel86
  - number: '87'
    text: |-
      Concessiën worden niet verleend voor ontginning in streken of terreinen, waar die, naar het oordeel van Onze
      Minister, den Raad van Bestuur gehoord, om redenen van algemeen belang niet kan worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel87
  - number: '88'
    text: |-
      Na de indiening van het bij [art. 69][ref1] bedoelde verzoek om concessie kan de ontdekker zijne werkzaamheden op
      den voet van opsporingswerken voortzetten totdat hij in kennis zal zijn gesteld van de beschikking op zijn verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel69
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '69'
        hoofdstuk: IV
        afdeling: 1e
  - number: '89'
    text: |-
      Op elke concessie-aanvraag wordt door Onze Minister afzonderlijk beschikt, met gelijktijdige beslissing omtrent de
      eventueel ingebrachte bezwaren, en na den Raad van Bestuur te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel89
  - number: '90'
    text: 'De beschikking waarbij de concessie verleend wordt, moet behelzen:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.1°
    text: den naam, de voornamen, het beroep en de woonplaats van den concessionaris;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.2°
    text: den naam van den concessie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.3°
    text: de oppervlakte van het concessieterrein uitgedrukt in hectaren, met verwaarloozing van onderdeelen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.4°
    text: |-
      de grenzen van het concessieterrein aangeduid op de bij de beschikking behoorende kaart, waarop tevens de voor de
      plaatsing van merkteekens bestemde punten worden aangegeven, zullen twee opeenvolgende punten op niet meer dan 500
      meter afstand mogen gelegen zijn;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.5°
    text: den duur der concessie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.6°
    text: |-
      den naam van het eiland en het district, dan wel de namen van de districten waar binnen het concessieterrein
      gelegen is;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.7°
    text: het gekozen domicilie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: '90.8'
    text: den naam der delfstof of de namen der delfstoffen waarvoor concessie verleend wordt;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.9°
    text: de bijzondere voorwaarden voor zoover zij noodig zijn;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.10°
    text: den datum;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.11°
    text: |-
      het bedrag van het door den concessionaris verschuldigd vast recht en de tijdstippen waarop dat bedrag uiterlijk
      over het eerste concessiejaar en verder telkenjare over volgende concessiejaren moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.12°
    text: de Rijks kas waar het vast recht en het uitvoerrecht moeten worden gestort;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
  - number: 90.13°
    text: |-
      de aangaande ingebrachte bezwaren genomen beslissing; terwijl de concessionaris in de beschikking wordt verwezen
      naar [art. 237][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel237
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '237'
        hoofdstuk: Eenig
  - number: '91'
    text: De beschikking waarbij concessie verleend wordt vormt met het daarin gestelde voorwaarden de akte van concessie.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel91
  - number: '92.1'
    text: Elke concessie-beschikking wordt in de Staatscourant volledig openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel92
  - number: '92.2'
    text: |-
      Een authentieke afschrift van de beschikking wordt aan den concessionaris uitgereikt. Voor dat afschrift worden
      geen andere kosten in rekening gebracht dan die van het zegel.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel92
  - number: '92.3'
    text: |-
      Aan den concessionaris of zijn vertegenwoordiger moeten op verzoek en tegen betaling van de kosten meerdere
      afschriften van de concessie-beschikking, c.q. met kaart, worden uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel92
  - number: '93.1'
    text: |-
      De beschikking van Onze Minister, waarbij een aanvrage om concessie wordt afgewezen, moet de gronden vermelden
      waarop de afwijzing berust.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel93
  - number: '93.2'
    text: |-
      Onverminderd het bepaalde bij [art. 26][ref1] wordt de beschikking volledig in de Staatscourant openbaar gemaakt en
      aan den aanvrager kosteloos volledig afschrift van de beschikking uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel26
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '26'
        hoofdstuk: II
  - number: '94'
    text: 'Op aanvragen van concessiën wordt afwijzend beschikt:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel94
  - number: 94.1°
    text: indien de aanvrager niet voldoet aan de in de Mijnwet BES en dit besluit gestelde vereischten;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel94
  - number: 94.2°
    text: indien de aanvrage niet voldoet aan de in dit besluit gestelde vereischten;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel94
  - number: 94.3°
    text: |-
      indien Onze Minister gebruik maakt van de bevoegdheid verleend bij [art. 87][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel87
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '87'
        hoofdstuk: IV
        afdeling: 4e
  - number: '95.1'
    text: |-
      Indien eene concessie-aanvraag, welke was ingediend op grond van eene ontdekking van den wettigen houder eener
      vergunning, wordt afgewezen, mag die houder eene nieuwe concessie-aanvrage voor hetzelfde terrein of een gedeelte
      daarvan indienen zoolang hij nog wettig houder der vergunning is.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel95
  - number: '95.2'
    text: |-
      Is na de indiening der eerste afgewezen concessie-aanvrage inmiddels de vergunning vervallen of ingetrokken, dan
      moeten na de afwijzing van de concessie-aanvrage de werkzaamheden op het aangevraagde terrein onmiddellijk worden
      gestaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel95
  - number: '96'
    text: De concessie gaat in met den datum van de beschikking waarbij zij is verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel96
  - number: '97'
    text: Bij verschil van opvatting omtrent het beloop der grenzen van een concessieterrein beslist Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel97
  - number: '98.1'
    text: |-
      Onze Minister is bevoegd om, zooveel mogelijk met inachtneming van de belangen van den concessionaris, hetzij
      in verband met het bepaalde bij het vorige artikel, hetzij in verband met wijzigingen van officieel vastgestelde
      grenzen van districten enz., hetzij in verband met ontdekte vergissingen of onjuistheden, hetzij naar aanleiding
      van door van rijksoverheidswege verrichte topographische opnemingen, nader verkregen gegevens nopens de grenzen
      en de oppervlakte van een concessieterrein, na het verleenen van de concessie bij eene nadere beschikking de
      aanvankelijk in de concessie-beschikking opgenomen grensomschrijving en oppervlakte van het concessieterrein te
      wijzigen. In die nadere beschikking wordt aanteekening gehouden van het nieuw bedrag van het verschuldigd vast
      recht en van het tijdstip waarop dat bedrag voor de eerste maal en telkens voor volgende jaren uiterlijk moeten
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel98
  - number: '98.2'
    text: |-
      In de beschikking wordt de concessionaris verwezen naar het [derde lid van art. 240][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel240
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
  - number: '98.3'
    text: |-
      Op de beschikkingen van Onze Minister, houdende wijziging van de grenzen en oppervlakten van concessieterreinen, is
      van toepassing het bepaalde bij [art. 92][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel92
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '92'
        hoofdstuk: IV
        afdeling: 4e
  - number: '99'
    text: |-
      Nòch de concessionarissen nòch de hypothecaire of andere schuldeischers ontleenen tegenover de rijksoverheid aan
      krachtens de [artt. 97][ref1] en [98][ref2] genomen beslissingen eenige aanspraak op schadeloosstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel98
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '97'
        hoofdstuk: IV
        afdeling: 6e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '98'
        hoofdstuk: IV
        afdeling: 6e
  - number: '100.1'
    text: |-
      De splitsing van een concessieterrein in op zich zelf staande gedeelten, het verwisselen van een gedeelte van een
      concessieterrein met dat van een aangrenzend terrein, en het vereenigen van twee of meer aan elkander grenzende
      concessieterreinen tot een geheel kan slechts geschieden bij door Onze Minister te verleenen nieuwe akten
      van concessie. Verzoekschriften om splitsing van een concessieterrein in op zich zelf staande gedeelten, het
      verwisselen van een gedeelte van een concessieterrein met dat van een aangrenzend terrein, en het vereenigen van
      twee of meer aan elkander grenzende concessieterreinen tot een geheel moeten worden ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel100
  - number: '100.2'
    text: |-
      Betreffen de te verwisselen gedeelten van concessieterreinen of de te vereenigen concessieterreinen concessiën van
      verschillende houders, dan moeten de verzoeken daartoe worden gedaan door alle betrokken houders. Het verzoek moet
      in die gevallen bij één verzoekschrift worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel100
  - number: '101'
    text: |-
      Splitsing van concessieterreinen, verwisseling van gedeelten van aangrenzende concessieterreinen en vereeniging
      van aan elkander grenzende concessieterreinen kunnen niet plaats hebben alvorens de bestaande concessiën, waarop
      de splitsing, verwisseling en vereeniging betrekking hebben, overeenkomstig het bepaalde bij [art. 237][ref1],
      zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel237
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '237'
        hoofdstuk: Eenig
  - number: '102'
    text: |-
      Splitsing van een concessieterrein en verwisseling van gedeelten van aangrenzende concessieterreinen worden slechts
      toegestaan indien de nieuwe concessiën, welke na de splitsing en de verwisseling zullen ontstaan, elk op zich zelf
      betrekking hebben op één aaneengesloten terrein dat een samenhangend geheel vormt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel102
  - number: '103.1'
    text: |-
      Het verzoekschrift waarbij splitsing van een concessieterrein in op zich zelf staande gedeelten wordt gevraagd,
      moet behelzen:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.1.1°
    text: 'den naam, de voornamen, het beroep en de woonplaats van den concessionaris:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.1.2°
    text: 'den naam der bestaande concessie:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.1.3°
    text: 'de data en nummers van de concessiebeschikking en de gerechtelijke akte van concessie:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.1.4°
    text: 'de grenzen van elk der gedeelten waarin de concessionaris het bestaande concessieterrein wenscht gesplitst te zien:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.1.5°
    text: 'de namen der nieuwe concessiën:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.1.6°
    text: |-
      de namen van de hypothecaire of andere ingevolge [art. 184][ref1] bevoorrechte schuldeischers.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel184
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '184'
        hoofdstuk: X
        afdeling: Eerste
  - number: '103.2'
    text: 'Het verzoekschrift betreffende de splitsing moet vergezeld gaan van:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.2.1°
    text: |-
      eene plattegrondteekening van elk gedeelte waarin de concessionaris het bestaande concessieterrein wenscht
      gesplitst te zien, op geen kleiner schaal dan van 1:20000, na plaatselijke opmeting gemaakt door den rooimeester of
      een ander daartoe naar het oordeel van Onze Minister geschikt persoon, op welke plattegrondteekeningen nauwkeurig
      moeten zijn aangegeven:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.2.1°.a
    text: de grenzen van de nieuwe concessieterreinen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.2.1°.b
    text: |-
      de punten geschikt voor de afbakening van nieuwe merkteekens, waarvan twee opeenvolgende op niet meer dan 500 meter
      afstand mogen gelegen zijn;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.2.1°.c
    text: |-
      de natuurlijke of kunstmatig aangebrachte, ter oriënteering dienende, kenbare vaste punten aan de oppervlakte, voor
      zooveel betreft elk nieuw concessieterrein;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.2.1°.d
    text: den astronomischen en den magnetischen meridiaan van elk nieuw concessieterrein.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.2.2°
    text: |-
      ééne of meer notarieele akten waaruit blijkt, dat de hypothecaire schuldeischer of schuldeischers tegen de
      gewenschte splitsing geen bezwaar hebben en waarin tevens de tusschen den concessionaris en genoemde schuldeischers
      nopens de vestiging van hypotheken op te verleenen nieuwe concessiën gesloten overeenkomsten zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: 103.2.3°
    text: |-
      ééne of meer verklaringen van den betrokken bewaarder of bewaarders der hypotheken in Bonaire, Sint Eustatius
      en Saba, houdende opgave van de namen van hen, die blijkens de openbare registers bekend staan als houder der
      betrokken concessie en als hypothecaire schuldeischer of schuldeischers.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
  - number: '103.3'
    text: |-
      Ten aanzien van de in het tweede lid sub 1° van dit artikel bedoelde plattegrondteekeningen is van toepassing het
      bepaalde bij het [tweede lid van art. 74][ref1] en bij [art. 75][ref2]; ten aanzien van de begrenzing van de nieuwe
      concessieterreinen, welke na de splitsing zullen ontstaan, het bepaalde bij [art. 76][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel76
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '74'
        hoofdstuk: IV
        afdeling: 1e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '75'
        hoofdstuk: IV
        afdeling: 1e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '76'
        hoofdstuk: IV
        afdeling: 1e
  - number: '104'
    text: |-
      Het verzoek om splitsing van een concessieterrein in op zich zelf staande gedeelten met bekendstelling van de
      wijze waarop die splitsing zal geschieden, moet door den concessionaris op zijn kosten driemalen, telkens met
      een tijdruimte van ééne maand, worden bekendgemaakt in de Staatscourant zoomede in een dag-, nieuws-, of huis-
      aan-huisblad. Van de Staatscourant en het dag-, nieuws-, of huis-aan-huisblad waarin de bekendmaking heeft plaats
      gehad, moet door den concessionaris een exemplaar aan Onze Minister worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel104
  - number: '105.1'
    text: |-
      De krachtens [art. 184][ref1] bevoorrechte schuldeischers zijn bevoegd binnen een termijn van drie maanden na
      de eerste van de in [art. 104][ref2] bedoelde bekendmakingen bij tot Onze Minister gericht verzoekschrift hunne
      bezwaren tegen de gevraagde splitsing van een concessieterrein in te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel104
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '184'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '104'
        hoofdstuk: V
        afdeling: 1e
  - number: '105.2'
    text: |-
      Indien door een of meer van de in het eerste lid van dit artikel genoemde schuldeischers tegen de gevraagde
      splitsing bezwaren zijn ingebracht, wordt op het verzoek om splitsing niet beschikt dan nadat ten genoegen van Onze
      Minister is aangetoond, dat de concessionaris zich met dien schuldeischer of die schuldeischers heeft verstaan dan
      wel diens vordering of hunne vorderingen heeft gekweten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel105
  - number: '106'
    text: |-
      Op een verzoek om splitsing van een concessieterrein wordt door Onze Minister niet beschikt dan nadat tenminste
      ééne maand na de derde van de [art. 104][ref1] genoemde bekendmakingen is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel104
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '104'
        hoofdstuk: V
        afdeling: 1e
  - number: '107.1'
    text: |-
      Op een verzoek om splitsing van een concessieterrein in op zich zelf staande gedeelten, dat aan de in de
      [artt. 100 tot en met 103][ref1] gestelde vereischten voldoet, wordt slechts afwijzend beschikt om overwegende
      redenen van algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel100
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '100'
        hoofdstuk: V
        afdeling: 1e
  - number: '107.2'
    text: |-
      Op de afwijzende beschikking is van toepassing het bepaalde bij [art. 93][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel93
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '93'
        hoofdstuk: IV
        afdeling: 5e
  - number: '108.1'
    text: |-
      Indien op een verzoek om splitsing van een concessieterrein in op zich zelf staande gedeelten gunstig wordt
      beschikt, verleent Onze Minister voor elk gedeelte, waarin het terrein wordt gesplitst, eene nieuwe concessie.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel108
  - number: '108.2'
    text: |-
      In elk der beschikkingen waarbij in geval van splitsing nieuwe concessiën worden verleend, wordt uitdrukkelijk
      vermeld, dat de nieuwe concessie wordt verleend met splitsing van de oorspronkelijke concessie in zoovele op
      zich zelf staande, in de beschikking bepaaldelijk te omschrijven gedeelten als de concessionaris heeft verzocht;
      overigens moeten die beschikkingen behelzen hetgeen in [art. 90 sub 1°. tot en met 12°.][ref1] is vermeld


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel90
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '90'
        hoofdstuk: IV
        afdeling: 4e
  - number: '108.3'
    text: |-
      In de nieuwe concessie-beschikkingen mogen geen andere voorwaarden worden gesteld dan aan de oorspronkelijke
      concessie waren verbonden, tenzij op verzoek of met toestemming van den concessionaris en overigens met
      inachtneming van het bepaalde bij [art. 143][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel143
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '143'
        hoofdstuk: VIII
        afdeling: Eerste
  - number: '108.4'
    text: |-
      De in geval van splitsing te verleenen nieuwe concessiën worden verleend voor den duur, dien de bestaande concessie
      nog te loopen had, en worden derhalve geacht te zijn ingegaan op den dag waarop die oorspronkelijke concessie
      inging.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel108
  - number: '108.5'
    text: |-
      In de nieuwe concessie-beschikkingen wordt de concessionaris verwezen naar [art. 240][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel240
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
  - number: '109'
    text: |-
      Op de beschikkingen waarbij in geval van splitsing van een concessieterrein nieuwe concessiën worden verleend, is
      van toepassing het bepaalde bij [artt. 91][ref1] en [92][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel92
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '91'
        hoofdstuk: IV
        afdeling: 4e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '92'
        hoofdstuk: IV
        afdeling: 4e
  - number: '110'
    text: |-
      Het op grond van de in geval van splitsing verleende nieuwe concessiën verworven recht, wordt tegenover derden
      eerst als bestaande aangemerkt, nadat èn de in [art. 240][ref1] voorgeschreven openbaarmaking (inschrijving)
      heeft plaats gehad, èn door inschrijving van de in het [tweede lid sub 2°. van art. 103][ref2] bedoelde
      hypotheken uitvoering is gegeven aan hetgeen c.q. dienaangaande tusschen partijen is overeengekomen. Eerst na die
      openbaarmaking en inschrijving zullen de in het tweede lid van art. 240 bedoelde aanteekingen mogen worden gesteld
      en de inschrijving of inschrijvingen van op de oorspronkelijke concessie rustende hypotheek of hypotheken in de
      registers mogen worden doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel103
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '103'
        hoofdstuk: V
        afdeling: 1e
  - number: '111'
    text: |-
      Binnen den tijd van één jaar na den datum der beschikkingen, waarbij in geval van splitsing nieuwe
      concessiën zijn verleend moet door den concessionaris worden voldaan aan de verplichting omschreven in het
      [eerste lid a en d van art. 167][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel167
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '167'
        hoofdstuk: IX
  - number: '112.1'
    text: |-
      Op verzoeken betreffende het verwisselen van een gedeelte van een concessieterrein met dat van een aangrenzend
      concessieterrein en het vereenigen van twee of meer aan elkaar grenzende concessieterreinen tot een geheel is
      het bepaalde bij de [art. 103 tot en met 111][ref1] van toepassing, met dien verstande dat in die artikelen voor
      «concessie», «concessieterrein», «concessie-beschikking» en «gerechtelijke akte» wordt gelezen «concessiën»,
      «concessieterreinen», «concessiebeschikkingen» en «gerechtelijke akten» en, indien zoodanig verzoek betrekking
      heeft op concessiën van verschillende houders, voor «concessionaris» wordt gelezen «concessionarissen», zoomede
      dat wat daar ten aanzien van splitsing is voorgeschreven, hier geldt voor verwisseling van gedeelten van
      concessieterreinen en voor vereeniging van concessieterreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel103
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '103'
        hoofdstuk: V
        afdeling: 1e
  - number: '112.2'
    text: |-
      Het verzoekschrift betreffende het vereenigen van twee of meer aan elkander grenzende concessieterreinen tot een
      geheel moet de grenzen van het nieuwe concessieterrein en den naam der nieuwe concessie behelzen en vergezeld gaan
      van eene plattegrondteekening van het nieuwe concessieterrein waarop de grenzen van dat terrein nauwkeurig zijn
      aangegeven. Overigens moeten het verzoek schrift en de daarbij over te leggen plattegrondteekening voldoen aan de
      voorschriften van [art. 103][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel103
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '103'
        hoofdstuk: V
        afdeling: 1e
  - number: '112.3'
    text: |-
      Indien de vereeniging van twee of meer aan elkander grenzende concessieterreinen betrekking heeft op concessiën
      van twee of meer verschillende houders, dan moet het verzoek om vereeniging worden gedaan door alle betrokken
      concessionarissen en daarin worden vermeld aan wie van hen zij wenschen dat de nieuwe concessie zal worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel112
  - number: '112.4'
    text: |-
      Indien op een verzoek om vereeniging van twee of meer aan elkander grenzende concessieterreinen tot een geheel
      gunstig wordt beschikt, verleent Onze Minister aan den houder der oorspronkelijke concessiën welker terreinen
      worden vereenigd, ééne nieuwe concessie voor het vereenigde terrein. Heeft de vereeniging van twee of meer aan
      elkander grenzende concessieterreinen betrekking op concessiën van twee of meer verschillende houders, dan wordt de
      nieuwe concessie verleend aan hem, die in het verzoek om vereeniging door de betrokken concessionarissen als houder
      der te verleenen nieuwe concessie is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel112
  - number: '112.5'
    text: |-
      De in geval van verwisseling van gedeelten van aangrenzende concessieterreinen te verleenen nieuwe concessiën
      worden verleend voor den duur, dien de bestaande Concessiën nog te loopen hadden en worden derhalve geacht te zijn
      ingegaan op den dag waarop de betrokken oorspronkelijke concessiën ingingen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel112
  - number: '112.6'
    text: |-
      De in geval van vereeniging van aan elkander grenzende concessieterreinen te verleenen nieuwe concessie wordt
      verleend voor den kortsten duur dien eene van de bestaande concessiën nog te loopen had en wordt derhalve geacht te
      zijn ingegaan op den dag waarop laatstbedoelde concessie inging.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel112
  - number: '113'
    text: |-
      Het schriftelijk verzoek van een concessionaris om gedeeltelijke intrekking zijner concessie moet worden gericht
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel113
  - number: '114.1'
    text: |-
      Gedeeltelijke intrekking eener concessie kan niet plaats hebben alvorens de concessie overeenkomstig het bepaalde
      bij [art. 237][ref1] is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel237
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '237'
        hoofdstuk: Eenig
  - number: '114.2'
    text: |-
      Zij wordt slechts toegestaan indien het gedeelte van het concessieterrein, dat de concessionaris wenscht te
      behouden, bestaat uit één aaneengesloten terrein dat een samenhangend geheel vormt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel114
  - number: '115.1'
    text: 'Het verzoekschrift waarbij gedeeltelijke intrekking eener concessie wordt gevraagd, moet behelzen:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.1.1°
    text: den naam, de voornamen, het beroep en de woonplaats van den concessionaris;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.1.2°
    text: den naam der bestaande concessie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.1.3°
    text: de data en nummers van de concessie-beschikking en de gerechtelijke akte van concessie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.1.4°
    text: |-
      de grenzen van het gedeelte van het concessieterrein waarvoor de concessionaris intrekking verzoekt en van het
      gedeelte dat hij wenscht te behouden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.1.5°
    text: den naam der nieuwe concessie;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.1.6°
    text: |-
      de namen van de hypothecaire of andere ingevolge [art. 184][ref1] bevoorrechte schuldeischers.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel184
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '184'
        hoofdstuk: X
        afdeling: Eerste
  - number: '115.2'
    text: 'Het verzoekschrift moet vergezeld gaan van:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.2.1°
    text: |-
      eene plattegrondteekening van het gedeelte van het concessieterrein dat de concessionaris wenscht te behouden,
      op geen kleiner schaal dan van 1:20000, na plaatselijke opmeting opgemaakt door den rooimeester of een ander
      daartoe naar het oordeel van Onze Minister geschikt persoon, op welke plattegrondteekening nauwkeurig moeten zijn
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.2.1°.a
    text: de grenzen van het terrein, dat de concessionaris wenscht te behouden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.2.1°.b
    text: |-
      de punten, geschikt voor de afbakening van nieuwe merkteekens, waarvan twee opeenvolgende op niet meer dan 500
      meter afstand mogen gelegen zijn;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.2.1°.c
    text: de natuurlijke of kunstmatig aangebrachte, ter oriënteering dienende, kenbare vaste punten aan de oppervlakte;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.2.1°.d
    text: den astronomischen en den magnetischen meridiaan van het nieuwe concessieterrein;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.2.2°
    text: |-
      ééne of meer notarieele akten waaruit blijkt, dat de hypothecaire schuldeischer of schuldeischers tegen de
      gevraagde gedeeltelijke intrekking geen bezwaar hebben en waarin tevens de tusschen den concessionaris en genoemde
      schuldeischers nopens de vesting van hypotheken op de te verleenen nieuwe concessie gesloten overeenkomsten zijn
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: 115.2.3°
    text: |-
      ééne of meer verklaringen van den betrokken bewaarder of bewaarders der hypotheken in Bonaire, Sint Eustatius
      en Saba, houdende opgave van de namen van hen, die blijkens de openbare registers bekend staan als houder der
      betrokken concessie en als hypothecaire schuldeischer of schuldeischers. Deze verklaringen zijn vrij van zegel.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: '115.3'
    text: |-
      Wanneer ten genoegen van Onze Minister wordt aangetoond, dat de begrenzing van het aangevraagde terrein door vaste
      merkteekens of anderszins onmiskenbaar is vastgelegd, behoeft de in het tweede lid sub 1°. genoemde kaart niet alle
      gegevens sub a–d te vermelden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
  - number: '115.4'
    text: |-
      Ten aanzien van de in het tweede lid sub 1°. van dit artikel bedoelde plattegrondteekening is van toepassing het
      bepaalde bij het tweede lid van [art. 74][ref1] en bij [art. 75][ref2], ten aanzien van de begrenzing van het
      nieuwe concessieterrein, dat na de gedeeltelijke intrekking zal ontstaan, het bepaalde bij [art. 76][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel76
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '74'
        hoofdstuk: IV
        afdeling: 1e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '75'
        hoofdstuk: IV
        afdeling: 1e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '76'
        hoofdstuk: IV
        afdeling: 1e
  - number: '116'
    text: |-
      Het verzoek om gedeeltelijke intrekking eener concessie moet door den concessionaris op zijne kosten driemalen,
      telkens met een tijdruimte van ééne maand, worden bekend gemaakt in de Staatscourant, zoomede in een dag-, nieuws-,
      of huis-aan-huisblad. Van de Staatscourant en het dag-, nieuws-, of huis-aan-huisblad, waarin de bekendmaking heeft
      plaats gehad, moet door den concessionaris een exemplaar aan Onze Minister worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel116
  - number: '117.1'
    text: |-
      De krachtens [art. 184][ref1] bevoorrechte schuldeischers zijn bevoegd binnen een termijn van drie maanden na
      de eerste van de in [art. 116][ref2] bedoelde bekendmakingen bij tot Onze Minister gericht verzoekschrift hunne
      bezwaren tegen de gevraagde gedeeltelijke intrekking van een concessie in te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel116
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '184'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '116'
        hoofdstuk: V
        afdeling: 2e
  - number: '117.2'
    text: |-
      Indien door een of meer van de in het eerste lid van dit artikel genoemde schuldeischers tegen de gevraagde
      gedeeltelijke intrekking bezwaren zijn ingebracht, wordt op het verzoek om gedeeltelijke intrekking niet beschikt
      dan nadat ten genoegen van Onze Minister is aangetoond, dat de concessionaris zich met dien schuldeischer of die
      schuldeischers heeft verstaan dan wel diens vordering of hunne vorderingen heeft gekweten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel117
  - number: '118'
    text: |-
      Op een verzoek om gedeeltelijke intrekking eener concessie wordt door Onze Minister niet beschikt dan nadat
      tenminste ééne maand na de derde van de in [art. 116][ref1] genoemde bekendmakingen is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel116
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '116'
        hoofdstuk: V
        afdeling: 2e
  - number: '119.1'
    text: |-
      Op een verzoek om gedeeltelijke intrekking van eene concessie, dat aan de in de [artt. 113 tot en met 115][ref1]
      gestelde vereischten voldoet, wordt slechts afwijzend beschikt om overwegende redenen van algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel113
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '113'
        hoofdstuk: V
        afdeling: 2e
  - number: '119.2'
    text: |-
      Op de afwijzende beschikking is van toepassing het bepaalde bij [art. 93][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel93
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '93'
        hoofdstuk: IV
        afdeling: 5e
  - number: '120.1'
    text: |-
      Indien op een verzoek om gedeeltelijke intrekking van een concessie gunstig wordt beschikt, verleent Onze Minister
      voor het terrein, dat de concessionaris wenscht te behouden eene nieuwe concessie.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel120
  - number: '120.2'
    text: |-
      In de beschikking waarbij in geval van gedeeltelijke intrekking eene nieuwe concessie wordt verleend, wordt
      uitdrukkelijk vermeld dat de nieuwe concessie wordt verleend met intrekking van de oorspronkelijke concessie;
      overigens moet de beschikking behelzen hetgeen in [art. 90 sub 1° tot en met 12°][ref1] is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel90
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '90'
        hoofdstuk: IV
        afdeling: 4e
  - number: '120.3'
    text: |-
      In de nieuwe concessie-beschikking mogen geen andere voorwaarden worden gesteld dan aan de oorspronkelijke
      concessie waren verbonden, tenzij op verzoek of met toestemming van den concessionaris en overigens met
      inachtneming van het bepaalde bij [art. 143][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel143
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '143'
        hoofdstuk: VIII
        afdeling: Eerste
  - number: '120.4'
    text: |-
      De in geval van gedeeltelijke intrekking te verleenen nieuwe concessie wordt verleend voor den duur, dien
      de bestaande concessie nog te loopen had, en wordt derhalve geacht te zijn ingegaan op den dag waarop die
      oorspronkelijke concessie inging.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel120
  - number: '120.5'
    text: |-
      In de nieuwe concessie-beschikking wordt de concessionaris verwezen naar [art. 240][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel240
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
  - number: '121'
    text: |-
      Op de beschikking waarbij in geval van gedeeltelijke intrekking eene nieuwe concessie wordt verleend, is van
      toepassing het bepaalde bij [art. 91][ref1] en [92][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel92
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '91'
        hoofdstuk: IV
        afdeling: 4e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '92'
        hoofdstuk: IV
        afdeling: 4e
  - number: '122'
    text: |-
      Het op grond van de in geval van gedeeltelijke intrekking verleende nieuwe concessie verworven recht wordt
      tegenover derden eerst als bestaande aangemerkt nadat èn de in [art. 240][ref1] voorgeschreven openbaarmaking
      (inschrijving) heeft plaats gehad èn door inschrijving van de in het [tweede lid sub 2°. van art. 115][ref2]
      bedoelde hypotheken uitvoering is gegeven aan hetgeen c.q. dienaangaande tusschen partijen is overeengekomen.
      Eerst na die openbaarmaking en inschrijving zullen de in het [tweede lid van art. 240][ref3] bedoelde aanteekening
      mogen worden gesteld en de inschrijving of inschrijvingen van op de oorspronkelijke concessie rustende hypotheek of
      hypotheken in de registers mogen worden doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel240
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '115'
        hoofdstuk: V
        afdeling: 2e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
  - number: '123'
    text: |-
      Binnen den tijd van één jaar na den datum van de beschikking waarbij in geval van gedeeltelijke intrekking eener
      concessie een nieuwe concessie is verleend, moet door den concessionaris worden voldaan aan de verplichting
      omschreven in het [eerste lid sub a en d van art. 167][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel167
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '167'
        hoofdstuk: IX
  - number: '124'
    text: |-
      Indien eene naar het oordeel van Onze Minister voor ontginning in aanmerking komende delftstofafzetting ontdekt
      is ten gevolge van een rijksoverheidswege ingesteld onderzoek, wijst Onze Minister, behoudens de rechten van
      derden, het terrein aan, binnen hetwelk geen concessie wordt verleend dan na openbare mededinging, onverminderd de
      bevoegdheid van de rijksoverheid om daarin zelf mijnontginning te ondernemen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel124
  - number: '125'
    text: |-
      [Art. 124][ref1] is toepasselijk op naar het oordeel van Onze Minister voor ontginning in aanmerking komende
      delfstofafzettingen tot welke ontginning geen aanspraken op concessie overeenkomstig art. 2 der Mijnwet BES,
      geldend kunnen gemaakt worden en welke niet vallen in de termen van het eerste lid van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel124
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '124'
        hoofdstuk: VI
  - number: '126'
    text: |-
      De beschikking, waarbij krachtens [art 124][ref1] door Onze Minister het terrein wordt aangewezen binnen hetwelk
      geen concessie wordt verleend dan na openbare mededinging, wordt openbaar gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel124
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '124'
        hoofdstuk: VI
  - number: '127.1'
    text: |-
      In geval van openbare mededinging wordt de concessie toegewezen aan hem die het hoogste bedrag in geld aanbiedt,
      mits Onze Minister van oordeel is, dat tegen zijn toelating geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel127
  - number: '127.2'
    text: |-
      Leidt de openbare mededinging tot geen resultaat dan wordt, voor zoover daartoe termen bestaan en niet onderhands
      concessie is of wordt verleend, het volgens [artt. 124][ref1] en [125][ref2] gereserveerde terrein weder
      opengesteld voor opsporingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel125
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '124'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '125'
        hoofdstuk: VI
  - number: '128'
    text: |-
      Indien naar het oordeel van Onze Minister eene niet tengevolge van een van rijksoverheidswege ingesteld onderzoek
      ontdekte delfstofafzetting voor ontginning in aanmerking komt, tot welker ontginning geen aanspraken op concessie,
      overeenkomstig de Mijnwet BES en dit besluit, geldend kunnen gemaakt worden, wordt de beschikking waarbij in
      verband daarmede krachtens [art. 125][ref1] door Onze Minister het terrein wordt aangewezen, binnen hetwelk geen
      concessie wordt verleend dan na openbare mededinging, openbaar gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel125
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '125'
        hoofdstuk: VI
  - number: '129.1'
    text: |-
      In een terrein as bedoeld in de [artt. 126][ref1] en [128][ref2] worden ingevolge het
      [eerste lid sub a van art. 174][ref3] en in verband met het bepaalde bij [art. 176][ref4] geen opsporingen
      toegelaten totdat voor dat terrein concessie is verleend of het terrein weder voor opsporing wordt opengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel176
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '126'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '128'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '174'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '176'
        hoofdstuk: X
        afdeling: Eerste
  - number: '129.2'
    text: |-
      De beschikking, waarbij eenig terrein als bedoeld in de [artt. 126][ref1] en [128][ref2], krachtens het
      [tweede lid van art. 127][ref3] en met toepassing van het bepaalde bij [art. 176][ref4], voor zoover daartoe termen
      bestaan door Onze Minister weder voor opsporingen wordt opengesteld, wordt openbaar gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel127
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel176
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '126'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '128'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '127'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '176'
        hoofdstuk: X
        afdeling: Eerste
  - number: '130'
    text: |-
      De beschikking, waarbij door Onze Minister de gelegenheid wordt opengesteld om na openbare mededinging concessie
      te verkrijgen voor de winning van de in de beschikking genoemde delfstof of delfstoffen in een nauwkeurig aangeduid
      concessieterrein, overeenkomende met of gelegen binnen eenig overeenkomstig [art. 126][ref1] of [art. 128][ref2]
      aangewezen terrein wordt volledig in de Staatscourant openbaar gemaakt. Ten aanzien van de uitgestrektheid van het
      terrein is van toepassing het bepaalde bij [art. 138][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel138
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '126'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '128'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '138'
        hoofdstuk: VII
  - number: '131.1'
    text: |-
      De mededinging op den voet van het [eerste lid van art. 127][ref1] naar eene concessie als bedoeld in
      [art . 130][ref2] geschiedt bij eene openbare inschrijving, door Onze Minister te houden, dag, uur en plaats der
      inschrijving en de door Onze Minister vastgestelde voorwaarden worden in de Staatscourant en voor zooveel noodig
      ook in een of meer dag-, nieuws-, of huis-aan-huisbladen aangekondigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel130
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '127'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '130'
        hoofdstuk: VI
  - number: '131.2'
    text: |-
      Tot het houden van de openbare inschrijving wordt eerst overgegaan nadat vaststaat, dat in verband met den uitslag
      der in [art. 130][ref1] genoemde bekendmaking geen redenen van algemeen belang zich tegen het verleenen van de
      concessie verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel130
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '130'
        hoofdstuk: VI
  - number: '132.1'
    text: |-
      Niet geldig zijn inschrijvingsbiljetten van personen of vennootschappen, die ingevolge [art. 77][ref1] geen houders
      van concessiën kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel77
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '77'
        hoofdstuk: IV
        afdeling: 1e
  - number: '132.2'
    text: De beschikking betreffende de toewijzing wordt in de Staatscourant volledig openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel132
  - number: '133'
    text: 'Hij aan wien de concessie is toegewezen is verplicht:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel133
  - number: 133.1°
    text: |-
      de som, waarvoor door hem is ingeschreven binnen den in de voorwaarden der inschrijving vastgestelden termijn
      ineens in ’s Rijks kas te storten;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel133
  - number: 133.2°
    text: |-
      binnen een termijn van zes maanden na den datum van het nummer van de Staatscourant waarin de beschikking ingevolge
      het [tweede lid van art. 132][ref1] is openbaar gemaakt aan Onze Minister in te dienen:


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel132
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '132'
        hoofdstuk: VI
  - number: 133.2°.a
    text: |-
      eene verklaring waarbij door hem overeenkomstig het [tweede lid van art. 69][ref1] domicilie wordt gekozen, met
      vermelding van den aan de concessie te geven naam;


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel69
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '69'
        hoofdstuk: IV
        afdeling: 1e
  - number: 133.2°.b
    text: |-
      eene plattegrondteekening, voldoende aan het bepaalde bij het [eerste lid sub 2° van art. 74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel74
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '74'
        hoofdstuk: IV
        afdeling: 1e
  - number: '134.1'
    text: |-
      Nadat binnen de gestelde termijnen aan het bepaalde bij [art. 133][ref1] is voldaan, wordt de concessie door Onze
      Minister verleend aan hem, aan wien zij definitief is toegewezen. De [artt. 90][ref2], [91][ref3], [92][ref4] en
      [143][ref5] zijn ten deze ook van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel92
      [ref5]: https://wetten.overheid.nl/BWBR0028574#Artikel143
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '133'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '90'
        hoofdstuk: IV
        afdeling: 4e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '91'
        hoofdstuk: IV
        afdeling: 4e
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '92'
        hoofdstuk: IV
        afdeling: 4e
      - id: ref5
        bwb_id: BWBR0028574
        artikel: '143'
        hoofdstuk: VIII
        afdeling: Eerste
  - number: '134.2'
    text: |-
      De definitieve toewijzing vervalt onvoorwaardelijk indien niet binnen de gestelde termijnen aan het bepaalde bij
      [art. 133][ref1] is voldaan. De beschikking van Onze Minister, waarbij daarvan aanteekening wordt gehouden, wordt
      in de Staatscourant openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel133
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '133'
        hoofdstuk: VI
  - number: '135'
    text: |-
      De vergunning tot opsporing word verleend voor een veld, dat zich binnen de verticale projectie van het terrein,
      aangeduid in de beschikking, waarbij vergunning wordt verleend, tot een onbepaalde diepte uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel135
  - number: '136.1'
    text: |-
      Elk tot het doen van opsporingen aan te vragen terrein mag behoudens het bepaalde bij het tweede lid van dit
      artikel geen grootere oppervlakte hebben dan 3000 hectaren; aanvragen voor grootere uitgestrektheid worden
      onvoorwaardelijk afgewezen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel136
  - number: '136.2'
    text: |-
      Indien, in het belang van eene doelmatige begrenzing, zulks door Onze Minister noodig wordt geoordeeld, kan aan
      een aanvrager, behoudens de rechten en aanspraken van anderen, vergunning worden verleend voor eene grootere
      uitgestrektheid dan door hem is aangevraagd en mag ook het in het eerste lid van dit artikel genoemde maximum
      worden overschreden, maar alleen voor zoover dat strikt noodzakelijk is met het oog op de begrenzing.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel136
  - number: '136.3'
    text: |-
      Ieder kan in één of meer districten zoovele onderzoekingsterreinen krijgen, ook door overdracht, als hij zelf
      wenscht en beschikbaar zijn, mits elk terrein op zich zelf niet grooter zij dan het in dit artikel genoemde
      maximum.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel136
  - number: '137'
    text: |-
      Concessiën tot ontginning wordt verleend voor een mijnveld, dat zich binnen de verticale projectie van het in de
      concessie-bschikking aangeduid terrein tot in onbepaalde diepte uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel137
  - number: '138'
    text: |-
      Behoudens het bepaalde bij [art. 140][ref1] en behalve in het geval van [art. 139][ref2] worden geen concessiën
      verleend voor eene grootere uitgestrektheid van elk concessieterrein op zich zelf, dan van 1000 hectaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel139
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '140'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '139'
        hoofdstuk: VII
  - number: '139.1'
    text: |-
      Indien, in het belang van eene doelmatige begrenzing of van eene behoorlijke ontginning zulks door Onze Minister
      noodig wordt geoordeeld kan den ontdekker, behoudens de rechten en aanspraken van anderen, concessie worden
      verleend voor eene grootere uitgestrektheid dan door hem is aangevraagd of kunnen in het concessieterrein
      aangrenzende gronden begrepen worden, die buiten het onderzoekingsterrein liggen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel139
  - number: '139.2'
    text: Een authenthiek afschrift van de beschikking wordt aan den concessionaris uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel139
  - number: '140'
    text: |-
      De uitgestrektheid van concessieterreinen, ontstaan door verwisseling van gedeelten van aangrenzende terreinen of
      door vereeniging van twee of meer aan elkander grenzende concessieterreinen, mag het in [art. 138][ref1] genoemde
      maximum overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel138
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '138'
        hoofdstuk: VII
  - number: '141.1'
    text: |-
      De voorwaarden welke aan de vergunning worden verbonden, moeten tot het strikt noodzakelijke worden beperkt en
      mogen in geen geval bepalingen inhouden welke strijdig zijn met of uitbreiding geven aan de voorschriften van de
      Mijnwet BES en dit besluit.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel141
  - number: '141.2'
    text: |-
      In elke vergunningsbeschikking wordt als voorwaarde gesteld dat de houder bij het gebruik maken van het hem
      verleend recht de bepalingen der Mijnwet BES, de wettelijke voorschriften tot uitvoering dier wet en de bij de
      vergunning gestelde voorwaarden moet in acht nemen, in het bijzonder dat hij het door hem verschuldigd vast recht
      op de daarvoor bepaalde tijdstippen moet voldoen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel141
  - number: '141.3'
    text: |-
      De in dit artikel bedoelde voorwaarden mogen, zoolang de vergunning van kracht is, niet worden gewijzigd of met
      nieuwe uitgebreid dan op verzoek of met toestemming van den houder der vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel141
  - number: '141.4'
    text: |-
      Op de beschikkingen, houdende wijziging of uitbreiding van de voorwaarden eener vergunning, of afwijzing van een
      daartoe strekkend verzoek, is van toepassing het bepaalde bij [art. 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel40
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '40'
        hoofdstuk: III
  - number: '142'
    text: |-
      Aan eene verlenging of bij de toestemming tot overdracht van de vergunning mogen geen nieuwe of gewijzigde
      voorwaarden worden verbonden dan op verzoek of met toestemming van den houder der vergunning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel142
  - number: '143'
    text: De voorwaarden welke in de concessie-beschikking worden gesteld moeten tot het strikt noodzakelijke worden beperkt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel143
  - number: '144.1'
    text: |-
      De voorwaarden, welke in de concessie-beschikking zijn gesteld, mogen nadat de concessie is verleend, niet worden
      gewijzigd of met nieuwe uitgebreid dan op verzoek of met toestemming van den concessionaris.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel144
  - number: '144.2'
    text: |-
      Op de beschikkingen van Onze Minister houdende wijziging of uitbreiding van de voorwaarden van concessiën is van
      toepassing het bepaalde bij [art. 92][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel92
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '92'
        hoofdstuk: IV
        afdeling: 4e
  - number: '144.3'
    text: |-
      In die beschikkingen wordt de concessionaris verwezen naar het [derde lid van art. 240][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel240
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
  - number: '145.1'
    text: |-
      Het vast recht van vergunningen tot opsporing en van ontdekkers die na het verstrijken van den vergunningstermijn
      hunne werkzaamheden op den voet van opsporingswerken voortzetten, wordt geheven over vergunningsjaren en voor
      iedere vergunning afzonderlijk berekend naar de oppervlakte van het opsporingsterrein zooals deze door Onze
      Minister in de vergunningsbeschikking ([art. 38 eerste lid sub b][ref1]) is vastgesteld of ingevolge het bepaalde
      bij het [eerste lid van art. 44][ref2] is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel44
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '38'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '44'
        hoofdstuk: III
  - number: '145.2'
    text: Het wegens vast recht verschuldigd bedrag moe steeds in zijn geheel worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel145
  - number: '146.1'
    text: |-
      Het vast recht over het eerste vergunningsjaar moet uiterlijk binnen drie maanden, gerekend van den datum van
      beschikking waarbij de vergunning is verleend, worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel146
  - number: '146.2'
    text: |-
      Over volgende vergunningsjaren moet het vast recht uiterlijk op den laatsten dag vóór den aanvang van elk
      vergunningsjaar worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel146
  - number: '147.1'
    text: |-
      Ten aanzien van vergunningen, welke, hetzij op verzoek, hetzij ingevolge het bepaalde in het eerste lid sub a en
      b en het tweede lid sub a van [art. 60][ref1] voor het geheele opsporingsterrein worden ingetrokken, is het vast
      recht verschuldigd over alle vergunningsjaren welke vóór den datum van de beschikking der intrekking zijn ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel60
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '60'
        hoofdstuk: III
  - number: '147.2'
    text: |-
      Mocht over eenig jaar dat is ingegaan na den datum van de beschikking, waarbij eene vergunning is ingetrokken, het
      vast recht reeds zijn betaald, dan wordt het te veel betaalde, als onverschuldigd, aan den rechthebbende zoodra
      mogelijk terugbetaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel147
  - number: '148.1'
    text: |-
      Wanneer eene vergunning voor een gedeelte van het opsporingsterrein op verzoek van den houder wordt ingetrokken,
      is het vast recht berekend over de geheele oppervlakte van het oorspronkelijke opsporingsterrein verschuldigd over
      alle vergunningsjaren, welke vóór den datum van de beschikking der gedeeltelijke intrekking zijn ingegaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel148
  - number: '148.2'
    text: |-
      Het vast recht berekend over het gedeelte of de gedeelten, die de vergunninghouder, wiens vergunning op verzoek
      voor een gedeelte van het opsporingsterrein is ingetrokken, behoudt, is voor de eerste maal verschuldigd over
      het vergunningsjaar dat ingaat op of na den datum van de beschikking der gedeeltelijke intrekking en moet
      voor het eerst uiterlijk binnen drie maanden na den datum van de nieuwe vergunningsbeschikking of de nieuwe
      vergunningsbeschikkingen, bedoeld in het [tweede lid van art. 65][ref1] worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel65
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '65'
        hoofdstuk: III
  - number: '148.3'
    text: |-
      Mocht over eenig jaar dat is ingegaan na den datum van de beschikking, waarbij eene vergunning voor een gedeelte
      van het opsporingsterrein is ingetrokken, het vast recht reeds over de gehele oppervlakte zijn voldaan, dan wordt
      het te veel betaalde, als onverschuldigd, aan den rechthebbende zoodra mogelijk terugbetaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel148
  - number: '149.1'
    text: |-
      Wordt de oppervlakte van een opsporingsterrein krachtens het bepaalde bij het [eerste lid van art. 44][ref1]
      gewijzigd, zoo geschiedt de berekening van het wegens vast recht verschuldigd bedrag naar het gewijzigd aantal
      hectaren van de oppervlakte van het opsporingsterrein, voor de eerste maal over het vergunningsjaar, volgende op
      dat waarin de wijziging heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel44
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '44'
        hoofdstuk: III
  - number: '149.2'
    text: |-
      Heeft de in het eerste lid van dit artikel bedoelde wijziging van het aantal hectaren der oppervlakte plaats op een
      tijdstip, waarop het over het daarop volgend vergunningsjaar verschuldigd vast recht reeds mocht zijn voldaan, zoo
      moet, indien het gewijzigd cijfer eene grootere oppervlakte van het opsporingsterrein aangeeft dan aanvankelijk was
      aangenomen, hetgeen meer aan vast recht verschuldigd is uiterlijk op den laatsten dag der derde maand, volgende op
      die waarin de wijziging heeft plaats gehad, worden bijbetaald, terwijl indien het gewijzigd cijfer eene kleinere
      oppervlakte aangeeft, het te veel betaalde aan den rechthebbende zoodra mogelijk wordt terugbetaald. Van den datum
      waarop de bijbetaling uiterlijk moet geschieden, wordt aanteekening gehouden in de beschikking waarbij de wijziging
      plaats heeft.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel149
  - number: '149.3'
    text: |-
      In de in het tweede lid van dit artikel bedoelde beschikking wordt mede aanteekening gehouden van het gewijzigd
      bedrag van het vast recht en van het tijdstip waarop dat uiterlijk voor de eerste maal moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel149
  - number: '150.1'
    text: |-
      De rijksoverheid heft van iedere vergunning tot opsporing en van elken ontdekker, die opsporingswerken voortzet
      overeenkomstig [art. 88][ref1] een jaarlijksch, ieder jaar bij vooruitbetaling te voldoen, vast recht, evenredig
      aan de oppervlakte van het opsporingsterrein en ten bedrage van USD 0.03 per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel88
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '88'
        hoofdstuk: IV
        afdeling: 4e
  - number: '150.2'
    text: |-
      De rijksoverheid heft van iedere concessie een jaarlijksch, ieder jaar bij vooruitbetaling te voldoen, vast recht,
      evenredig aan de oppervlakte van het concessie-terrein en ten bedrage van USD 0.14 per hectare.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel150
  - number: '150.3'
    text: Restitutie van gedane betalingen wegens verschuldigd vast recht heeft niet plaats.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel150
  - number: '151'
    text: |-
      Van elken ontdekker, die opsporingswerken voortzet overeenkomstig [art. 88][ref1] nadat de tijd, waarvoor zijne
      vergunning was verleend of verlengd, is verstreken en voordat eene beschikking is gevolgd op zijne concessie-
      aanvrage, wordt vast recht geheven alsof zijne vergunning nog van kracht was en wel over alle vergunningsjaren,
      welke ingaan vóór den datum der beschikking op zijne concessie-aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel88
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '88'
        hoofdstuk: IV
        afdeling: 4e
  - number: '152.1'
    text: |-
      Van elken ontdekker, die reeds houder is van eene concessie tot ontginning op het betrokken terrein van eene andere
      dan de door hem ontdekte delfstof, wordt een jaarlijksch vast recht geheven, evenredig aan de oppervlakte van het
      door hem aangevraagde concessie-terrein, ten bedrage van USD 0.03 per hectare, en wel van het tijdstip waarop hij
      eene aanvraag om concessie tot winning van de door hem ontdekte delfstof heeft ingediend tot het tijdstip waarop
      eene beschikking op die aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel152
  - number: '152.2'
    text: |-
      Wanneer de concessie-aanvraag van den ontdekkerconcessionaris voldoet aan de gestelde vereischten dan wordt eene
      beschikking opgemaakt, waarin aanteekening wordt gehouden:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel152
  - number: 152.2.a
    text: van de oppervlakte van het aangevraagde concessieterrein;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel152
  - number: 152.2.b
    text: van het bedrag van het verschuldigd vast recht;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel152
  - number: 152.2.c
    text: |-
      van de tijdstippen waarop het vast recht voor de eerste maal, en wel uiterlijk binnen drie maanden gerekend van den
      datum der beschikking, en verder telken jare bij vooruitbetaling moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel152
  - number: 152.2.d
    text: van de Rijks kas waar het vast recht moet worden gestort,
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel152
  - number: '152.3'
    text: Van de beschikking wordt behalve aan den ontdekkerconcessionaris een afschrift gezonden aan de betrokken Ontvanger.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel152
  - number: '153'
    text: |-
      Als belastingschuldige ten aanzien van het vast recht van vergunningen en ontdekkers is aan te merken hij die
      houder der vergunning of van het recht op concessie is op het tijdstip dat die belasting uiterlijk moet worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel153
  - number: '154'
    text: |-
      Zoodra de houder eener vergunning langer dan drie maanden achterstallig is met de betaling van het door hem
      verschuldigd vast recht wordt de vergunning onmiddellijk ingetrokken, onverminderd de bevoegdheid om bij niet-
      voldoening van het vast recht op het daarvoor bepaald tijdstip, reeds eerder tot die intrekking over te gaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel154
  - number: '155.1'
    text: |-
      Onze Minister verstrekt aan de betrokken ontvangers binnen acht dagen na ommekomst van elke maand, opgaven
      betreffende de gedurende de afgeloopen maand verleende, verlengde, overgedragen en, hetzij voor het geheele
      opsporingsterrein, hetzij voor een gedeelte daarvan, ingetrokken vergunningen zoomede betreffende alle vergunningen
      waarvan de oppervlakte overeenkomstig het bepaalde bij [art. 44][ref1] gedurende die maand is gewijzigd en welke
      ingevolge de [art. 41][ref2] en [42][ref3] moeten geacht worden niet te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel42
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '44'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '41'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '42'
        hoofdstuk: III
  - number: '155.2'
    text: 'In de opgaven moeten worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel155
  - number: 155.2.a
    text: de data en nummers der betrekkelijke beschikkingen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel155
  - number: 155.2.b
    text: de namen der houders van de vergunningen waarvan vast recht verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel155
  - number: 155.2.c
    text: de bedragen van het verschuldigd vast recht zoomede de vergunningsjaren waarover die bedragen verschuldigd zijn;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel155
  - number: 155.2.d
    text: de tijdstippen waarop het vast recht over elk vergunningsjaar uiterlijk moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel155
  - number: '156'
    text: |-
      De betrokken ontvangers verstrekken met het oog op het bepaalde bij [art. 154][ref1] binnen acht dagen na ommekomst
      van elke maand aan Onze Minister opgaven van de vergunningen waarvan het verschuldigd vast recht, dat in den loop
      dier maand moest zijn betaald, niet is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel154
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '154'
        hoofdstuk: VIII
        afdeling: 2e
  - number: '157'
    text: |-
      In de quitantiën voor van vergunningen en door ontdekkers betaald vast recht moet behalve van de namen der
      belastingschuldigen, ook melding worden gemaakt van het belastingjaar waarop de betaling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel157
  - number: '158.1'
    text: |-
      Het vast recht van concessiën wordt geheven over concessiejaren en voor iedere concessie afzonderlijk berekend naar
      de oppervlakte van het concessie-terrein zooals deze door Onze Minister is vastgesteld of ingevolge [art. 98][ref1]
      is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel98
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '98'
        hoofdstuk: IV
        afdeling: 6e
  - number: '158.2'
    text: Het wegens vast recht verschuldigd bedrag, moet steeds in zijn geheel worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
  - number: '158.3'
    text: |-
      Over het eerste concessie-jaar moet het vast recht uiterlijk op den laatsten dag der derde maand volgende op die
      waarin de concessie is aangevangen worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
  - number: '158.4'
    text: |-
      Over de volgende concessie-jaren moet het vast recht uiterlijk op den laatsten dag vóór den aanvang van elke
      concessie-jaar worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
  - number: '158.5'
    text: |-
      In de beschikking waarbij eene concessie wordt verleend, wordt ingevolge [art. 90][ref1] aanteekening gehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel90
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '90'
        hoofdstuk: IV
        afdeling: 4e
  - number: 158.5.a
    text: van de oppervlakte van het concessie-terrein uitgedrukt in hectaren, met verwaarloozing van onderdeelen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
  - number: 158.5.b
    text: |-
      van het bedrag van het vast recht en van de tijdstippen waarop dat bedrag overeenkomstig dit artikel uiterlijk over
      het eerste concessie-jaar en verder telken jare over volgende concessie-jaren moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
  - number: 158.5.c
    text: van de Rijks kas waar het vast recht moet worden gestort.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel158
  - number: '159.1'
    text: 'Ingeval:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel159
  - number: 159.1.a
    text: |-
      een concessie-terrein in op zich zelf staande gedeelten wordt gesplitst, een gedeelte van een concessie-terrein met
      dat van een aangrenzend concessie-terrein wordt verwisseld, twee of meer aan elkander grenzende concessie-terreinen
      tot een geheel worden vereenigd;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel159
  - number: 159.1.b
    text: eene concessie op verzoek van den concessionaris gedeeltelijk wordt ingetrokken;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel159
  - number: 159.1.c
    text: |-
      de oppervlakte van een concessie-terrein bij beschikking van Onze Minister krachtens [art. 98][ref1] wordt
      gewijzigd;


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel98
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '98'
        hoofdstuk: IV
        afdeling: 6e
  - number: '159.2'
    text: |-
      Het vast recht van de concessiën, waarop de in het eerste lid van dit artikel bedoelde beschikkingen betrekking
      hebben, moet voor de eerste maal uiterlijk worden voldaan op den laatsten dag der derde maand volgende op die
      waarin de splitsing, verwisseling, vereeniging, gedeeltelijke intrekking of wijziging der oppervlakte heeft plaats
      gehad.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel159
  - number: '159.3'
    text: |-
      Heeft de splitsing, verwisseling, vereeniging, gedeeltelijke intrekking of wijziging der oppervlakte van concessiën
      plaats op een tijdstip, waarop het over het daarop volgend jaar (concessie-jaar) verschuldigd vast recht van
      de oorspronkelijke oppervlakte reeds mocht zijn voldaan, zoo moet hetgeen meer aan vast recht verschuldigd is,
      uiterlijk worden bijbetaald op den laatsten dag der derde maand volgende op die waarin de splitsing, verwisseling,
      vereeniging, gedeeltelijke intrekking of wijziging der oppervlakte heeft plaats gehad, terwijl het teveel betaalde
      aan den rechthebbende zoodra mogelijk wordt terugbetaald. Van den datum waarop de bijbetaling uiterlijk moet
      geschieden, wordt in de betrekkelijke beschikkingen van Onze Minister, bedoeld in de [artt. 98][ref1], [108][ref2],
      [112][ref3] en [120][ref4], aanteekening gehouden. Ingevolge de evengenoemde artikelen wordt in die beschikkingen
      mede aanteekening gehouden van de bedragen van het verschuldigd vast recht en van tijdstippen waarop die bedragen
      voor de eerste maal en telkens over volgende jaren uiterlijk moeten worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel112
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel120
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '98'
        hoofdstuk: IV
        afdeling: 6e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '108'
        hoofdstuk: V
        afdeling: 1e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '112'
        hoofdstuk: V
        afdeling: 1e
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '120'
        hoofdstuk: V
        afdeling: 2e
  - number: '160.1'
    text: |-
      Bij niet-voldoening van het vast recht vóór of op de in dit besluit voorgeschreven tijdstippen, verbeurt de
      concessionaris een boete van één percent van het door hem verschuldigde bedrag voor elke maand achterstand,
      zullende een gedeelte van een maand voor een volle maand worden gerekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel160
  - number: '160.2'
    text: |-
      In de quitantiën voor betaald vast recht, moet behalve van de namen der belastingschuldigen en der concessiën , ook
      melding worden gemaakt van het concessie-jaar, waarop de betaling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel160
  - number: '161'
    text: |-
      Als belastingschuldigen ten aanzien van het vast recht en als aansprakelijk voor de deswege verschuldigde boeten is
      aan te merken, hij die concessionaris is op het tijdstip dat die belasting uiterlijk moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161
  - number: 161a.1
    text: De houder van een concessie is over de door hem gewonnen delfstoffen cijns verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161a
  - number: 161a.2
    text: |-
      De cijns bedraagt ten minste één kwart ten honderd en ten hoogste tien ten honderd van de waarde der gewone
      delfstoffen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161a
  - number: 161a.3
    text: |-
      Onze Minister stelt, bij het verlenen van de concessie, het percentage van de cijns vast, rekening houdende met de
      aard van de delfstoffen, zomede met de gesteldheid van het terrein waarbinnen, de omstandigheden waaronder en de
      wijze waarop de ontginning zal moeten plaats vinden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161a
  - number: 161a.4
    text: De cijns kan op naar tijdvakken wisselende percentages worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161a
  - number: 161a.5
    text: |-
      Indien de houder van de concessie ten genoegen van Onze Minister aantoont, dat de ontginning over het afgelopen
      jaar, als gevolg van bij de aanvang der concessie niet te voorziene omstandigheden, verlies heeft opgeleverd, kan
      Onze Minister de over dat jaar verschuldigde of betaalde cijns gedeeltelijk kwijtschelden of teruggeven.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161a
  - number: 161b
    text: |-
      Naast het vastrecht als bedoeld in de vorige afdeling van dit hoofdstuk is de houder van een concessie aan ’s
      Rijks kas verschuldigd: hetzij uitsluitend een daarbij overeen te komen cijns over de gewonnen delfstoffen, hetzij,
      nevens zodanige cijns of in plaats van cijns, een daarbij overeen te komen aandeel in de met de ontginning behaalde
      winst.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161b
  - number: 161c.1
    text: |-
      Onder de waarde der gewonnen delfstoffen wordt voor de berekening van de cijns verstaan de handelswaarde dier
      delfstoffen ter plaatse van winning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161c
  - number: 161c.2
    text: |-
      Behoudens het bepaalde in het derde lid van dit artikel strekt de werkelijke verkoopprijs van de delfstoffen, al
      dan niet nadat deze een bewerking hebben ondergaan, tot grondslag voor de berekening van de handelswaarde.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161c
  - number: 161c.3
    text: |-
      Indien de werkelijke verkoopprijs niet geacht kan worden op normale wijze tot stand te zijn gekomen, strekt de
      wereldmarktprijs, zo deze bestaat, en anders de geschatte verkoopwaarde tot grondslag voor de berekening van de
      handelswaarde.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161c
  - number: 161d.1
    text: |-
      Indien cijns verschuldigd is, wordt vóór het einde van elk kalenderjaar, voor het daarop volgende kalenderjaar, de
      handelswaarde per eenheid produkt en per concessiehouder voorlopig vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161d.2
    text: |-
      Als voorlopige handelswaarde per eenheid produkt wordt aangemerkt de verkoopprijs als bedoeld in het
      [tweede lid van het vorige artikel][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel161c
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: 161c
        hoofdstuk: VIII
        afdeling: 3de
  - number: 161d.2.a
    text: welke definitief voor het voorlaatste kalenderjaar werd vastgesteld volgens onderstaande regelen, of
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161d.2.b
    text: welke gedurende het lopende kalenderjaar werd behaald, of
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161d.2.c
    text: welke voor het komende kalenderjaar vermoedelijk zal gelden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161d.3
    text: |-
      Op basis van de voorlopig vastgestelde handelswaarde vindt de heffing van de cijns in het komende kalenderjaar
      plaats.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161d.4
    text: |-
      Binnen tien maanden na afloop van dat kalenderjaar wordt aan de hand van de uitkomsten van het ontginningsbedrijf
      van de concessiehouder gedurende dat jaar de handelswaarde per eenheid produkt over dat kalenderjaar definitief
      vastgesteld
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161d.5
    text: |-
      Voor het eerste kalenderjaar of het nog overblijvende gedeelte daarvan, zal van een ontginning als voorlopige
      handelswaarde per eenheid produkt worden aangemerkt de vermoedelijke verkoopprijs als bedoeld in het
      [tweede lid van het vorige artikel][ref1], welke voor het mijnprodukt in dit tijdvak zal gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel161c
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: 161c
        hoofdstuk: VIII
        afdeling: 3de
  - number: 161d.6
    text: |-
      De vaststelling van de voorlopige en de definitieve handelswaarde geschiedt bij beschikking van de Inspecteur,
      bedoeld in artikel 1.1, onderdeel h, van de Douane- en Accijnswet BES. Een afschrift van de beschikking wordt per
      aangetekende brief toegezonden of tegen schriftelijk ontvangstbewijs uitgereikt aan de concessiehouder of zijn
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161d.7
    text: De concessiehouder is tegenover ’s Rijks kas aansprakelijk voor de cijns.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161d
  - number: 161e.1
    text: |-
      De concessiehouder is verplicht zijn boekhouding in te richten volgens door de Inspecteur, bedoeld in artikel
      1.1, onderdeel h, van de Douane- en Accijnswet BES te stellen regelen en hij is gehouden desgevraagd aan de door
      de Inspecteur, bedoeld in artikel 1.1, onderdeel h, van de Douane- en Accijnswet BES.aan te wijzen ambtenaren of
      deskundigen inzage te verlenen van boeken of andere bescheiden welke tot staving van zijn aangifte kunnen dienen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161e
  - number: 161e.2
    text: |-
      Binnen acht dagen na afloop van elke maand doet de concessiehouder aangifte bij de Inspecteur, bedoeld in artikel
      1.1, onderdeel h, van de Douane- en Accijnswet BES van de gedurende die maand geleverde produkten en betaalt hij de
      cijns berekend naar de voorlopig vastgestelde handelswaarde, bij de ontvanger, onder overlegging van een afschrift
      van de aangifte.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161e
  - number: 161e.3
    text: |-
      Binnen acht dagen na de dagtekening van de beschikking waarbij de handelswaarde over enig jaar definitief werd
      vastgesteld betaalt de concessiehouder de te weinig betaalde cijns bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161e
  - number: 161e.4
    text: |-
      De bepalingen van hoofdstuk VIII van de Belastingwet BES zijn van overeenkomstige toepassing op de invordering of
      de navordering van de cijns.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161e
  - number: 161e.5
    text: |-
      ’s Rijks kas heeft voor de cijns recht van voorrang, gaande boven alle andere bestaande voorrechten, daaronder
      begrepen pand en hypotheek, behalve de voorrechten bij de artikelen 1165 ten eerste en 1175 ten eerste van het
      Burgerlijk Wetboek BES bepaald, op alle roerende en onroerende goederen van de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161e
  - number: 161f.1
    text: |-
      Tegen de vaststelling van de voorlopige of de definitieve handelswaarde kan binnen drie maanden na dagtekening van
      de beschikking een met reden omkleed beroepschrift worden ingediend bij de Raad van Beroep voor Belastingzaken, die
      in hoogste instantie beslist.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161f
  - number: 161f.2
    text: |-
      De Inspecteur, bedoeld in artikel 1.1, onderdeel h, van de Douane- en Accijnswet BES is belast met de uitvoering
      van de beslissingen van de Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161f
  - number: 161g
    text: |-
      Gedurende vijf jaren na de dagtekening van de beschikking waarbij de handelswaarde definitief werd vastgesteld kan
      de niet of te weinig betaalde cijns worden nagevorderd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161g
  - number: 161h.1
    text: |-
      Indien de concessiehouder opzettelijk geen of te weinig verschuldigde cijns betaalt is [artikel 154][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel154
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161h
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '154'
        hoofdstuk: VIII
        afdeling: 2e
  - number: 161h.2
    text: |-
      Bij niet tijdige voldoening van de cijns is [artikel 160][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel160
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161h
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '160'
        hoofdstuk: VIII
        afdeling: 2e
  - number: 161i
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen tot uitvoering van de
      [artikelen 161A tot en met 161H][ref1] worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel161a
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel161i
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: 161a
        hoofdstuk: VIII
        afdeling: 3de
  - number: '162.1'
    text: |-
      De vergunning tot het doen van opsporingen geeft den houder, met uitsluiting van ieder ander, het recht om
      overeenkomstig de voorschriften der Mijnwet BES en van dit besluit, en de bij de vergunning gestelde voorwaarden,
      in het onderzoekingsveld alle werkzaamheden te verrichten, noodig tot opsporing van de in artikel 1a van de
      Mijnwet BES genoemde delfstoffen of ten doel hebbende den aard der aangetroffen delfstofafzettingen en der daarin
      voorkomende delfstoffen te beoordeelen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel162
  - number: '162.2'
    text: Over de door hem verkregen delfstoffen mag de opspoorder, behoudens de rechten van anderen, vrijelijk beschikken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel162
  - number: '162.3'
    text: |-
      Hetgeen in de [artt. 164][ref1], [165][ref2] en [166][ref3] bepaald is omtrent concessionarissen en ontginningen is
      eveneens van toepassing op houders van vergunningen tot het doen van opsporingen en door hen verrichte opsporingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel165
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel166
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '164'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '165'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '166'
        hoofdstuk: IX
  - number: '163.1'
    text: |-
      De concessie geeft den concessionaris overeenkomstig de voorschriften dezer wet en op de in de akte van concessie
      gestelde voorwaarden, binnen het mijnveld het uitsluitend recht tot het winnen der in die akte genoemde delfstoffen
      en tot den aanleg van alle daartoe benoodige werken, zoo op als onder den grond; dit recht strekt zich uit tot
      binnen het mijnveld gelegen oude ertshoopen van vroegere ontginningen of opsporingen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel163
  - number: '163.2'
    text: |-
      Delfstoffen genoemd in artikel 1a van de Mijnwet BES, die niet in de akte van concessie zijn genoemd, mogen door
      den concessionaris, tenzij hij tot de winning daarvan eene nadere concessie heeft verkregen, niet gewonnen worden,
      dan voor zoover, ter beoordeeling van Onze Minister, de samenhang dier delfstoffen met de in de akte van concessie
      genoemde hare gelijktijdige winning onvermijdelijk maakt. Heeft een ander in hetzelfde mijnveld eene concessie voor
      de winning van die delfstoffen, dan moet de overeenkomstig dit lid gewonnen hoeveelheid daarvan op zijne vordering,
      tegen vergoeding der kosten van voortbrenging aan hem worden afgestaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel163
  - number: '164.1'
    text: |-
      De concessionaris is verplicht tot volledige vergoeding van alle schade door de onderneming aan de rechthebbenden
      op of belanghebbenden bij den bovengrond en hetgeen daartoe behoort toegebracht, onverschillig of ontginningswerken
      al dan niet daaronder hebben plaats gehad, of de schade door eene opzettelijke daad zijnerzijds veroorzaakt is of
      niet, dan wel of zij al of niet had kunnen worden voorzien.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel164
  - number: '164.2'
    text: |-
      Is de schade door twee of meet ontginningen veroorzaakt, dan zijn de concessionarissen daarvan gemeenschappelijk
      en wel tot gelijke deelen tot vergoeding der schade gehouden, onverminderd het recht om onderling terug te vorderen
      wat elk dientengevolge meer mocht hebben bijgedragen dan zijn aandeel in de schade bedraagt. Evenwel zal het aan
      de rechthebbenden op of belanghebbenden bij den bovengrond vrijstaan om, het bewijs leverende dat de verhouding
      van concessionarissen wat betreft elks aandeel in de toegebrachte schade anders is dan die van gelijke deelen,
      dienovereenkomstig hunne vordering tot schadevergoeding in te richten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel164
  - number: '164.3'
    text: |-
      De verplichting tot vergoeding strekt zich niet uit tot schade aan gebouwen of inrichtingen tot stand gekomen
      op een tijdstip dat het gevaar, waarmede die door de ontginning bedreigd worden, den rechthebbenden op of
      belanghebbenden bij den bovengrond bij gewone opmerkzaamheid niet onbekend had kunnen blijven. Behoort, tengevolge
      van het door de ontginning veroorzaakte gevaar, de oprichting van zoodanige werken boven den grond achterwege
      te blijven, dan kunnen rechthebbenden op of belanghebbenden bij den bovengrond daaraan geen aanspraak op
      schadevergoeding wegens waardevermindering ontleenen, indien het blijkt, dat hun geopenbaard voornemen om zoodanige
      werken op te richten kennelijk slechts het ontvangen van schadevergoeding ten doel heeft.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel164
  - number: '165.1'
    text: |-
      Wanneer het noodig is, dat de werkzaamheden van naburige ontginningen in onderling verband worden verricht, en
      de concessionarissen zich dienaangaande niet onderling kunnen verstaan, zijn ze gehouden zich te gedragen naar de
      regelingen, ter zake door Onze Minister te treffen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel165
  - number: '165.2'
    text: De concessionaris is aansprakelijk voor de schade, die hij aan eene naburige ontginning toebrengt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel165
  - number: '166'
    text: |-
      De aanspraak op schadeloosstelling, in de [artt. 163][ref1] en [164][ref2] bedoeld, voor zoover zij niet gegrond
      is op eene overeenkomst, verjaart door verloop van drie jaren, te rekenen van den dag, waarop de schade aan den
      belanghebbende bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel164
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '163'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '164'
        hoofdstuk: IX
  - number: '167.1'
    text: De concessionaris is verplicht;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel167
  - number: 167.1.a
    text: |-
      binnen den tijd van twee jaren na den datum van de beschikking waarbij de concessie is verleend of van de
      beschikking waarbij het beloop der concessie- grenzen krachtens [artt. 98][ref1], [100][ref2] of [114][ref3] is
      gewijzigd, de begrenzing van het concessieterrein dienovereenkomstig af te bakenen door plaatsing op de daarvoor in
      de betrekkelijke beschikking of op de daarbij behoorende kaart aangegeven punten, van goed gefundeerde steenen of
      ijzeren merkteekens, waarop ten minste 1.50 meter boven den beganen grond de letters M. C. zoomede de beginletters
      van ieder in den naam der concessie voorkomend woord zijn aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel114
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '98'
        hoofdstuk: IV
        afdeling: 6e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '100'
        hoofdstuk: V
        afdeling: 1e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '114'
        hoofdstuk: V
        afdeling: 2e
  - number: 167.1.b
    text: |-
      op daartoe van rijksoverheidswege gedane aanzegging en binnen den tijd, op de wijze en op de plaatsen, voor elk
      geval aangegeven, ter nadere aanwijzing van de grenzen van het concessie-terrein merkteekens op andere punten dan
      de door sub a aan te brengen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel167
  - number: 167.1.c
    text: de merkteekens in behoorlijken staat te onderhouden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel167
  - number: 167.1.d
    text: |-
      de merkteekens, vervallen wegens wijziging van het beloop der concessie-grenzen, binnen den tijd van één jaar
      na den datum van de wijzigingsbeschikking, maar niet alvorens de in verband met de wijziging noodige nieuwe
      merkteekens zijn aangebracht, te verwijderen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel167
  - number: '167.2'
    text: |-
      Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba is bevoegd voor en namens den
      nalatigen concessionaris en op diens kosten en risico de merkteekens overeenkomstig het bepaalde in het eerste lid
      van dit artikel, te doen plaatsen, onderhouden en verwijderen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel167
  - number: '168.1'
    text: |-
      De concessionaris is bevoegd om de plaatselijke leiding der ontginning en daarmede in verband staande werkzaamheden
      aan een beheerder der onderneming op te dragen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel168
  - number: '168.2'
    text: |-
      De beheerder der onderneming moet door of vanwege den concessionaris worden voorzien van een schriftelijke
      volmacht, waarin zijne bevoegdheden duidelijk zijn omschreven; de volmacht moet telkens op aanvrage aan de
      bestuurs- en de met het toezicht belaste ambtenaren worden vertoond.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel168
  - number: '168.3'
    text: |-
      De concessionarissen en vertegenwoordigers van concessionarissen zijn verplicht aan Onze Minister opgave te doen
      van den naam en de woonplaats van den beheerder van elke onderneming, en zulks binnen dertig dagen nadat diens
      aanstelling heeft plaats gehad. Deze bepaling is ook van toepassing op tijdelijk vervangende en waarnemende
      beheerders.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel168
  - number: '169'
    text: |-
      Onder den aanleg binnen het mijnveld van werken, als bedoeld in [art. 163][ref1] noodig tot het winnen der in de
      concessiebeschikking genoemde delfstoffen wordt verstaan de uitvoering van alle opsporings- en ontginningswerken,
      zoo op als onder den grond, en van al hetgeen ten dienste daarvan strekt, als: de aanleg van stapel-, opslag- en
      scheepplaatsen, van los- en laadhoofden en aanlegplaatsen voor schepen, van land- en waterwegen, met inbegrip van
      spoorwegen, van machine-installaties, van verzamelplaatsen van water en andere vloeistoffen, van buis- en andere
      leidingen, van wasch-, sorteerings- en reinigingsinrichtingen en van smeltovens; de plaatsing van merkteekens
      tot afbakening en van de concessie-grenzen; de oprichting van tot uitvoering van het mijnbouwbedrijf en tot
      huisvesting, voeding of verpleging der werklieden bestemde gebouwen en inrichtingen; het aanbrengen van toe-
      en afvoerwegen van lucht; de oprichting van magazijnen voor springmiddelen en de toegangswegen daarheen en van
      inrichtingen tot fabricatie van cokes en briketten indien die ter plaatste der kolenontginning worden opgericht;
      zoomede de aanleg en uitvoering van alle andere voor het bedrijf noodige werken waaromtrent in geval van twijfel
      door Onze Minister wordt beslist dat zij vallen onder de in [art. 163][ref2] genoemde werken.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel163
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '163'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '163'
        hoofdstuk: IX
  - number: '170.1'
    text: |-
      De concessionaris is bevoegd om, buiten zijn concessieterrein hulpwerken aan te leggen. Hij is ook bevoegd
      tot dien aanleg binnen het mijnveld van een anderen concessionaris, voor zoover die hulpwerken waterloozing
      of luchtverversching dan wel voordeeliger uitoefening van zijn eigen mijnbouwbedrijf ten doel hebben en het
      mijnbouwbedrijf van dien anderen concessionaris daardoor belemmerd noch met gevaar bedreigd wordt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel170
  - number: '170.2'
    text: |-
      Betwist de concessionaris, binnen wiens mijnveld het hulpwerk van een anderen concessionaris zou moeten worden
      aangelegd, zijne verplichting om dien aanleg te gedoogen, zoo mag daartoe eerst worden overgegaan nadat Onze
      Minister ter zake beslist en verlof tot den aanleg verleend heeft.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel170
  - number: '170.3'
    text: |-
      De concessionaris, die eenig hulpwerk binnen het mijnveld van een anderen concessionaris aanlegt, is verplicht tot
      volledige vergoeding van alle schade door dien aanleg aan dat mijnveld en de daarin voorkomende werken toegebracht.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel170
  - number: '170.4'
    text: |-
      De delfstoffen gewonnen bij den aanleg van hulpwerken worden, voor zoover de concessionaris, door wien die werken
      ten behoeve van zijn bedrijf zijn aangelegd, die behoudt, beschouwd als een deel van de opbrengst van de door hem
      gedreven mijnontginning.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel170
  - number: '170.5'
    text: |-
      De delfstoffen, gewonnen bij den aanleg van hulpwerken binnen het mijnveld van een anderen concessionaris, moeten
      aan dezen op zijn verlangen kosteloos worden afgegeven voor zoover hem concessie is verleend voor de winning van
      die delfstoffen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel170
  - number: '170.6'
    text: |-
      Het hulpwerk wordt beschouwd als één geheel uit te maken met het mijnveld ten behoeve waarvan het is aangelegd of,
      indien het ten behoeve van meer dan één mijnveld is aangelegd en de betrokken concessionarissen daaromtrent niet
      anders zijn overeengekomen, als deel van die verschillende mijnvelden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel170
  - number: '171.1'
    text: |-
      Over de door den concessionaris bij zijne ontginning gewonnen, niet in artikel 1a van de Mijnwet BES genoemde
      delfstoffen, mag door hem zonder eenige vergoeding aan den rechthebbende op den grond vrijelijk worden beschikt
      evenwel uitsluitend ten behoeve van zijn bedrijf. Wint de concessionaris die delfstoffen bij zijn bedrijf en
      beschikt hij daarover niet uitsluitend ten behoeve van zijn bedrijf, dan moet door hem voor die beschikking aan
      den rechthebbende op den grond schadevergoeding worden betaald dan wel is de rechthebbende op den grond bevoegd te
      vorderen, dat aan hem de gewonnen hoeveelheid der delfstoffen door den concessionaris tegen vergoeding der kosten
      van voortbrenging wordt afgestaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel171
  - number: '171.2'
    text: |-
      Het bepaalde in het eerste lid van dit artikel is ook van toepassing op de daar bedoelde delfstoffen, gewonnen bij
      den aanleg van hulpwerken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel171
  - number: '172'
    text: |-
      Onder de kosten van voortbrenging bedoeld in [art. 171][ref1] en in het [tweede lid van art. 163][ref2] zijn,
      behalve die van winning, ook de kosten van transport tot de plaats van levering begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel163
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '171'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '163'
        hoofdstuk: IX
  - number: '173'
    text: |-
      De rechthebbenden op den grond en derde belanghebbenden zijn gehouden het doen van opsporingen in den grond te
      gedoogen:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel173
  - number: 173.a
    text: |-
      mits zij door den houder der vergunning vooraf, onder vertoon van de vergunning of een authentiek afschrift
      daarvan, in kennis gesteld zijn met diens voornemen tot het doen van opsporingen en met de plaats waar die zullen
      geschieden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel173
  - number: 173.b
    text: tegen vooraf genoten of vooraf verzekerde schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel173
  - number: '174'
    text: 'Opsporingen worden niet toegelaten:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel174
  - number: 174.a
    text: |-
      in terreinen of streken, gereserveerd hetzij voor opsporing of ontginning van rijksoverheidswege, hetzij voor de
      uitgifte van eene concessie na openbare mededinging volgens de [art. 124–133][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel124
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '124'
        hoofdstuk: VI
  - number: 174.b
    text: |-
      in terreinen, binnen welke aan anderen vergunning tot het doen van opsporingen is verleend, zoolang zij ingevolge
      die vergunning eene aanspraak op concessie geldend kunnen maken;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel174
  - number: 174.c
    text: in terreinen of streken door Onze Minister om redenen van algemeen belang voor opsporingen gesloten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel174
  - number: '175.1'
    text: |-
      Opsporingen, die zich binnen het onderzoekingsveld uitstrekken tot een mijnveld waarvoor aan een ander concessie
      is verleend, mogen binnen dat mijnveld slechts worden verricht ten aanzien van delfstoffen voor welker winning nog
      geen concessie is verleend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel175
  - number: '175.2'
    text: |-
      De concessionaris is verplicht, desgewenscht tegen vooraf genoten of vooraf verzekerde schadeloosstelling, het
      doen van opsporingen in zijn mijnveld door een ander te gedoogen, mits de beheerder der onderneming tweemaal
      vier en twintig uren vóór den aanvang dier opsporingen op den voet van [art. 173 sub a][ref1] door den houder der
      vergunning met diens voornemen daartoe wordt in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel173
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '173'
        hoofdstuk: X
        afdeling: Eerste
  - number: '175.3'
    text: |-
      De schadeloosstelling dan wel de te stellen zekerheid worden, wanneer partijen in dat opzicht niet
      tot eenstemmigheid kunnen geraken, op de vordering van den houder der vergunning overeenkomstig de
      [artt. 188 tot en met 209][ref1] bepaald door den rechter, bevoegd om kennis te nemen van geschillen van denzelfden
      aard met betrekking tot de concessie.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel188
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '188'
        hoofdstuk: X
        afdeling: Tweede
  - number: '175.4'
    text: |-
      Doen die opsporingswerken gevaar ontstaan voor de stevigheid der mijnwerken dan wel voor den ongestoorden gang van
      het bedrijf van den concessionaris, of wel is het te voorzien dat dit het gevolg zal zijn van den aanleg van de
      opsporingswerken, dan worden die door Onze Minister verboden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel175
  - number: '176'
    text: |-
      De beschikking waarbij Onze Minister, wegens een der redenen genoemd in [art. 174][ref1], eenig terrein of eenige
      streek van Bonaire, Sint Eustatius en Saba voor mijnbouwkundige opsporingen sluit en die waarbij nader geheel of
      gedeeltelijk op deze beslissing wordt teruggekomen, worden genomen na raadpleging van den Raad van Bestuur; die
      beschikkingen worden in de Staatscourant openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel174
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '174'
        hoofdstuk: X
        afdeling: Eerste
  - number: '177.1'
    text: 'Opsporingen strekken zich binnen het terrein van onderzoek niet uit tot gronden:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: 177.1.A
    text: 'gelegen binnen een afstand van 25 meter:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: 177.1.A.1°
    text: van kerkhoven of graven;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: 177.1.A.2°
    text: van openbare of gewijde gronden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: 177.1.A.3°
    text: van publieke wegen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: 177.1.B
    text: |-
      waarop zich beplantingen bevinden die, naar het oordeel van Onze Minister, in strijd met het algemeen belang geheel
      of gedeeltelijk door de opsporingen zouden kunnen worden verstoord of vernield.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: '177.2'
    text: |-
      Opsporingen strekken zich, zonder de vooraf verkregen bewilliging van Onze Minister, binnen het terrein van
      onderzoek niet uit tot gronden gelegen binnen den afstand van 50 meter van overheidsgebouwen, noch tot die gelegen
      binnen den verboden kring van versterkingen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: '177.3'
    text: |-
      Opsporingen strekken zich binnen het terrein van onderzoek niet uit tot gronden, waarop die door Onze Minister, om
      redenen van algemeen belang, zijn verboden. Het bepaalde in [art. 176][ref1] is hierop van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel176
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '176'
        hoofdstuk: X
        afdeling: Eerste
  - number: '177.4'
    text: |-
      Opsporingen strekken zich, zonder de vooraf verkregen toestemming van de rechthebbenden op den grond en van derde
      belanghebbenden, elk voor zooveel hem aangaat, niet uit tot gronden, gelegen binnen den afstand van 50 meter van
      woonhuizen, fabrieken en andere gebouwen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel177
  - number: '178'
    text: |-
      Hetgeen in [art. 177][ref1] omtrent opsporingen is bepaald, is ook van toepassing op de beschikking over den
      bovengrond ten behoeve van ontginningen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel177
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '177'
        hoofdstuk: X
        afdeling: Eerste
  - number: '179'
    text: |-
      De rechthebbenden op den grond en derde belanghebbenden zijn verplicht de voor de in [artt. 169][ref1]
      en [170][ref2] genoemde werken benoodigden grond overeenkomstig de voorschriften van dit besluit aan den
      concessionaris voor zijne ontginning af te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel169
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel170
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '169'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '170'
        hoofdstuk: IX
  - number: '180.1'
    text: |-
      Indien voor eene ontginning de beschikking over den bovengrond noodig is voor geen langer tijdperk dan drie jaren,
      is daarop van toepassing hetgeen in [art. 173][ref1] omtrent opsporingen is bepaald, met dien verstande, dat wat
      daar ten aanzien van den houder der vergunning is voorgeschreven, hier op den concessionaris toepasselijk is en
      dat in dit geval zal moeten worden vertoond een authentiek afschrift der akte waarbij de concessie-beschikking is
      openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel173
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '173'
        hoofdstuk: X
        afdeling: Eerste
  - number: '180.2'
    text: |-
      Indien de beschikking over den grond voor een langer tijdperk noodig is, of indien na verloop van den aanvankelijk
      voldoende geachten termijn van drie jaren nog verdere beschikking noodig blijkt en partijen zich over den afstand
      van den grond niet kunnen verstaan, wordt op verzoek der meest gereede partij overgegaan tot toepassing der
      bepalingen, regelende de onteigening ten algemeenen nutte. De onteigening van alle voor eene ontginning noodige
      eigendommen behoeft niet tegelijkertijd te worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel180
  - number: '181.1'
    text: |-
      Op gronden behoorende tot Bonaire, Sint Eustatius en Saba verleent Onze Minister, onder de door hem noodig
      geoordeelde voorwaarden en behoudens de rechten van derden, verlof tot het maken van wegen ten behoeve der
      ontginning en recht van opstal tot plaatsing der noodige gebouwen, inrichtingen en werkplaatsen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel181
  - number: '181.2'
    text: |-
      Is voor de aanleg van wegen of van hulpwerken, overeenkomstig het [eerste lid van art. 170][ref1] ten behoeve der
      ontginning de beschikking over niet tot Bonaire, Sint Eustatius en Saba behoorenden grond buiten het concessie-
      terrein noodig en blijkt het dat partijen zich over den afstand van dien grond niet kunnen verstaan, dan geldt te
      dien aanzien het [tweede lid van het voorgaand artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel180
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '170'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '180'
        hoofdstuk: X
        afdeling: Eerste
  - number: '182'
    text: |-
      De verklaring, dat ten behoeve van eene ontginning gronden als bedoeld in [art. 180][ref1] en in het tweede lid van
      [art. 181][ref2] noodig zijn, wordt gegeven door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel181
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '180'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '181'
        hoofdstuk: X
        afdeling: Eerste
  - number: '183.1'
    text: |-
      De krachtens de Mijnwet BES en dit besluit aan opspoorders en concessionarissen toegekende rechten en opgelegde
      verplichtingen voor zooveel betreft de tijdelijke beschikking over den afstand in eigendom van vreemden grond tegen
      behoorlijke schadeloosstelling, zoomede de vergoeding van veroorzaakte schade, zijn in geval van rijksoverheidswege
      ondernomen opsporingen en ontginningen van toepassing op de rijksoverheid, voor zoover van dit voorschrift in dit
      besluit niet bepaaldelijk wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel183
  - number: '183.2'
    text: |-
      Wanneer opsporingen of ontginningen door de rijksoverheid worden bewerkstelligd, worden in de betrekkelijke
      artikelen van dit besluit met onderzoekings-en concessieterreinen gelijkgesteld de door de rijksoverheid
      respectievelijk voor zijn opsporingen of ontginningen gereserveerde terreinen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel183
  - number: '184.1'
    text: |-
      De schulden, voortspruiende uit de verplichting tot schadevergoeding en uit het in gebruik nemen van gronden,
      volgens [art. 179][ref1] en het [tweede lid van art. 181][ref2], zijn bevoorrecht op de concessie, op het product
      der ontginning en op den inventaris.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel181
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '179'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '181'
        hoofdstuk: X
        afdeling: Eerste
  - number: '184.2'
    text: Het hierbedoelde voorrecht gaat boven pand en hypotheek.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel184
  - number: '185'
    text: |-
      Hetgeen in [art. 177][ref1] omtrent opsporingen is bepaald, is ook van toepassing op de beschikking over den
      bovengrond ten behoeve van ontginningen, zoodat daar, waar volgens dat artikel geen opsporingen mogen worden
      verricht, ook geen ontginningen worden toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel177
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '177'
        hoofdstuk: X
        afdeling: Eerste
  - number: '186'
    text: |-
      De in [art. 173][ref1] aan de rechthebbenden op den grond en derde belanghebbenden opgelegde verplichting om
      ten aanzien van den grond waarop zij rechten uitoefenen het doen van mijnbouwkundige opsporingen te gedoogen,
      strekt zich uit tot de oprichting en de bewerkstelliging door den opspoorder, op die gronden, van alle werken en
      werkzaamheden noodig voor het doen van de door hem in te stellen mijnbouwkundige opsporingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel173
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '173'
        hoofdstuk: X
        afdeling: Eerste
  - number: '187.1'
    text: |-
      Het in [art. 173 sub a][ref1] bedoelde vertoonen van de vergunningsbeschikking of een authentiek afschrift
      daarvan aan de rechthebbenden op den grond en derde belanghebbenden door den houder der vergunning, onder
      mededeeling tevens van de plaats of plaatsen waar hij zijne opsporingen wenscht in te stellen, zal telkens
      moeten geschieden ten minste tweemaal vier en twintig uren vóórdat met die opsporingen een aanvang wordt gemaakt.
      Indien de opsporingen moeten worden verricht in grond behoorende tot Bonaire, Sint Eustatius en Saba, behooren
      de vertooningen van de vergunningsbeschikking of van een authentiek afschrift daarvan en de mededeeling van de
      plaats of plaatsen, waar de houder der vergunning de opsporingen wenscht in te stellen, ook te geschieden aan de
      Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel173
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '173'
        hoofdstuk: X
        afdeling: Eerste
  - number: '187.2'
    text: |-
      Indien opsporingen van rijksoverheidswege worden ondernomen, treedt in de plaats van het in het eerste lid van dit
      artikel genoemde stuk, een afschrift van de beschikking:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel187
  - number: 187.2.a
    text: waaruit blijkt dat de rijksoverheid zelf mijnbouwkundige opsporingen binnen zeker gebied wenscht te doen instellen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel187
  - number: 187.2.b
    text: |-
      houdende aanwijzing van den persoon of de autoriteit die door de rijksoverheid is gemachtigd om in zijn naam ter
      zake van de sub a bedoelde opsporingen het noodige, ook in rechten, te verrichten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel187
  - number: '187.3'
    text: |-
      Wordt beschikking over den bovengrond verlangd door personen die krachtens [art. 88][ref1] hunne werkzaamheden
      voortzetten op den voet van opsporingswerken nadat de tijd, waarvoor hunne vergunning tot het doen van
      mijnbouwkundige opsporingen was verleend of verlengd, reeds is verstreken, dan zijn zij niettemin verplicht tot
      de vertooning, overeenkomstig het eerste lid van dit artikel, van de hun uitgereikte vergunningsbeschikking of een
      authentiek afschrift daarvan en wordt daaraan, ook in rechten, gelijke kracht toegekend als vóór het verstrijken
      van den vergunningstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel88
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '88'
        hoofdstuk: IV
        afdeling: 4e
  - number: '188'
    text: |-
      In het geval bedoeld in [art. 173][ref1], dat de houder van eene vergunning ten behoeve van zijne opsporingen, de
      beschikking noodig heeft over grond, zal hij daartoe eerst bij minnelijke overeenkomst de tijdelijke beschikking
      over dien grond tegen vooraf betaalde of vooraf verzekerde schadeloosstelling trachten te verkrijgen, na de sub a
      van dat artikel bedoelde vertooning en kennisgeving te hebben gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel173
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '173'
        hoofdstuk: X
        afdeling: Eerste
  - number: '189'
    text: |-
      Wanneer ten behoeve van de opsporingen tijdelijke beschikking noodig is over grond behoorende tot Bonaire,
      Sint Eustatius en Saba, waarop derden geen recht uitoefenen, wordt voor die tijdelijke beschikking geen
      vergoeding aan de rijksoverheid gevorderd tenzij de grond door het in gebruik nemen naar het oordeel van Onze
      Minister grootendeels of geheel waardeloos zal worden, in welk geval eene door Onze Minister vast te stellen
      schadeloosstelling zal moeten worden betaald of vooraf verzekerd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel189
  - number: '190.1'
    text: |-
      Kunnen de houder der vergunning tot opsporing eenerzijds, en de rechthebbenden op den grond en (of) derde
      belanghebbende anderzijds, zich over de tijdelijke beschikking over den grond en de daarvoor te geven
      schadeloosstelling niet verstaan, dan kan de eerstgenoemde tegen de laatstgenoemden eene rechtsvordering instellen
      voor het Gemeenschappelijk Hof van Justitie, ten einde door dezen vooreerst te worden gemachtigd om voor een
      bepaalden tijd over den noodigen grond tot het doen van mijnbouwkundige opsporingen te beschikken en dat wel
      terstond nadat door den eischer een door den rechter te bepalen bedrag als zekerheid zal zijn gesteld, opdat
      daaruit later de als schadeloosstelling te betalen som kunne worden voldaan, zoomede ten einde door den rechter
      nader bij eindvonnis het bedrag te hooren vaststellen dat ter zake als schadeloosstelling aan de rechthebbenden op
      den grond en (of) derde belanghebbenden zal moeten worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel190
  - number: '190.2'
    text: |-
      Omtrent de vordering tot machtiging om over den noodigen grond te mogen beschikken, benevens tot bepaling van het
      bedrag der zekerheidstelling wordt door den rechter eerst en vooraf bij afzonderlijk vonnis uitspraak gedaan. Wordt
      de machtiging verleend met bepaling van het bedrag der zekerheidstelling, dan wordt tegen dit incidenteel vonnis
      geen hoogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel190
  - number: '190.3'
    text: |-
      Van de verleende machtiging om over den grond te beschikken kan onmiddellijk worden gebruik gemaakt nadat het door
      den rechter bepaald bedrag der zekerheidstelling ter griffie van het Gemeenschappelijk Hof van Justitie zal zijn
      gedeponeerd. Door den griffier wordt daarvan een akte opgemaakt, welke hij, die de rechtsvordering heeft ingesteld,
      aan de rechthebbende op den grond en (of) derde belanghebbenden doet beteekenen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel190
  - number: '191'
    text: |-
      Wanneer de rechthebbende op den grond of derde belanghebbende buiten Bonaire, Sint Eustatius en Saba woont of zijne
      woonplaats onbekend is, wordt het geding tegen den gevolmachtigde of bewindvoerder, indien een zoodanige binnen
      Bonaire, Sint Eustatius en Saba bekend is en zoo ook deze onbekend is tegen een derde binnen het ressort van den
      rechter wonende, nadat aan deze door den bevoegden rechter zal zijn opgedragen de goederen en belangen van den
      rechthebbende op den grond of derden belanghebbende geheel of gedeeltelijk te beheeren en waar te nemen, voor zijne
      rechten op te komen en hem daarbij te vertegenwoordigen. De alzoo benoemde kan, bij het ophouden zijner betrekking,
      het loon van den bewindvoerder eens afwezigen en daarenboven de gemaakte onkosten in rekening brengen. Desniettemin
      is de rechthebbende op den grond of derde belanghebbende gerechtigd in het geding, tegen den gevolmachtigde, den
      bewindvoerder dan wel den door den rechter benoemde ingesteld, zelf op te treden, in welk geval de dagvaarding als
      aan hem geschied of het verzoekschrift als hem rechtstreeks betreffende wordt beschouwd en het geding tegen hem
      wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel191
  - number: '192.1'
    text: 'Het geding wordt aanhangig gemaakt bij dagvaarding. Deze dagvaarding moet, op straffe van nietigheid, vermelden:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.1.a
    text: |-
      den naam en de woonplaats van den rechthebbende op den grond en (of) derden belanghebbende, tegen wien de eisch
      betreffende tijdelijke beschikking over den grond wordt ingesteld;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.1.b
    text: |-
      eene opgave van de grondstukken, waarover de houder der vergunning tijdelijk voor het doen van opsporingen wenscht
      te beschikken, en zulks wat betreft hun ligging, grootte en grenzen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.1.c
    text: beschrijving van het werk waarvoor over de verlangde grondstukken beschikt zal worden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.1.d
    text: den tijd gedurende welken vermoedelijk over den grond zal worden beschikt;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.1.e
    text: |-
      de som welke als schadeloosstelling aangeboden wordt, hetzij die schadeloosstelling in jaarlijksche gedeelten dan
      wel in eens in haar geheel gekweten zal worden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: '192.2'
    text: 'Bij de dagvaarding moeten worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.2.a
    text: |-
      het bewijs dat de eischer vergunning heeft gekregen tot het doen van mijnbouwkundige opsporingen voor
      een terrein waarbinnen de in de dagvaarding genoemde grondstukken gelegen zijn, dan wel de in het
      [tweede en derde lid van art. 187][ref1] genoemde bescheiden;


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel187
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '187'
        hoofdstuk: X
        afdeling: Tweede
  - number: 192.2.b
    text: |-
      eene situatieteekening van de grondstukken, waarover de eischer tijdelijk wenscht te beschikken, opgemaakt door
      den rooimeester, tenzij ten genoegen van den rechter wordt aangetoond dat eerstgenoemde in de onmogelijkheid heeft
      verkeerd den rooimeester met dezen arbeid te belasten;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.2.c
    text: eene project van het werk waarvoor over de verlangde grondstukken beschikt zal worden;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: 192.2.d
    text: |-
      eene verklaring van den betrokken bewaarder der hypotheken, behelzende opgave wie blijkens de door dien bewaarder
      aangehouden register als rechthebbenden op de gronden, waarover de eischer tijdelijk wenscht te beschikken,
      behooren te worden aangemerkt en wie daarop andere zakelijke rechten dan dat van eigendom uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel192
  - number: '193.1'
    text: De rechter behandelt zaken aangaande tijdelijke beschikking over gronden vóór elke andere.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel193
  - number: '193.2'
    text: |-
      Behoudens de gevallen waarin de rechter zich onbevoegd moet verklaren, de vordering om eenige andere reden
      behoort te worden ontzegd, de eischer met zijne vordering niet-ontvankelijk moet worden verklaard dan wel de
      nietigverklaring van de dagvaarding behoort te worden uitgesproken, mag de gevraagde machtiging om over de in de
      dagvaarding genoemde gronden te mogen beschikken, door den rechter slechts geheel of gedeeltelijk worden geweigerd
      in de gevallen voorzien bij [artt. 174][ref1] en [177][ref2], dan wel wanneer het recht om opsporingswerken te
      verrichten is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel174
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel177
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '174'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '177'
        hoofdstuk: X
        afdeling: Eerste
  - number: '193.3'
    text: |-
      Alle gronden van verdediging, zoo exceptieve als die welke de hoofdzaak betreffen, moeten op verbeurte van het
      recht om de overige in te brengen, tegelijkertijd worden voorgesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel193
  - number: '194.1'
    text: |-
      Ten dage dienende concludeert de aanlegger tevens tot benoeming van één of meer deskundigen ter opneming der
      schade door de tijdelijke beschikking over den grond aan de rechthebbenden op dien grond en derde belanghebbenden
      te veroorzaken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel194
  - number: '194.2'
    text: |-
      Op denzelfden dag of uiterlijk acht dagen daarna, geven de verweerders de gronden hunner tegenspraak bij conclusie
      op.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel194
  - number: '194.3'
    text: Partijen kunnen in dezelfde terechtzitting hare conclusiën bij pleidooien breeder ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel194
  - number: '194.4'
    text: Oproeping tot vrijwaring wordt niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel194
  - number: '194.5'
    text: |-
      Indien van twee of meer gedaagden de een verschijnt, de andere niet, wordt met den verschijnende onmiddellijk
      voortgeprocedeerd en de uitspraak geschiedt tusschen al de partijen bij een en hetzelfde vonnis, hetwelk als een
      vonnis op tegenspraak gewezen wordt beschouwd en waartegen geen verzet wordt toegelaten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel194
  - number: '194.6'
    text: |-
      Uiterlijk acht dagen na de terechtzitting doet de rechter uitspraak omtrent het krachtens het eerste lid van dit
      artikel gedaan verzoek en nopens de in [art. 190][ref1] bedoelde machtiging om over den grond te mogen beschikken,
      zoomede nopens het bedrag waarvoor zekerheid moet worden gedeponeerd alvorens tot beschikking over den grond mag
      worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel190
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '190'
        hoofdstuk: X
        afdeling: Tweede
  - number: '194.7'
    text: |-
      Na de bij incidenteel vonnis bepaalde zekerheid te hebben gesteld, kan de aanlegger onmiddellijk tot het doen
      van opsporingen op den in het vonnis omschreven grond overgaan in afwachting van de nader door den rechter bij
      eindvonnis te bepalen schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel194
  - number: '195'
    text: |-
      Tegen de uitspraak des rechters, waarbij hij zich onbevoegd verklaart dan wel houdende nietig-verklaring van de
      dagvaarding, niet-ontvankelijk verklaring van den eischer of ontzegging van den eisch om eenige andere reden, wordt
      hooger beroep toegelaten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel195
  - number: '196.1'
    text: |-
      Buiten de gevallen in [art. 195][ref1] genoemd, benoemt het Hof één of meer deskundigen in oneven getal ten einde
      haar aangaande de te betalen schadeloosstelling van voorlichting te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel195
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '195'
        hoofdstuk: X
        afdeling: Derde
  - number: '196.2'
    text: |-
      Het benoemt voorts een zijner leden om, vergezeld van den griffier, als commissaris bij het onderzoek van den
      deskundige of de deskundigen tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel196
  - number: '197.1'
    text: |-
      Het in het [zesde lid van art. 194][ref1] bedoeld vonnis wordt door den eischer aan de gedaagden beteekend, ten
      minste acht dagen vóór dien, waarop bij het vonnis het onderzoek van den deskundige of de deskundigen is bepaald,
      met oproeping om daarbij tegenwoordig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel194
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '194'
        hoofdstuk: X
        afdeling: Derde
  - number: '197.2'
    text: Bij afwezigheid der gedaagden gaat het in het voorgaand lid bedoeld onderzoek toch door.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel197
  - number: '197.3'
    text: Het vonnis wordt, zoo spoedig mogelijk, door de meest gereede partij aan de deskundigen beteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel197
  - number: '197.4'
    text: |-
      De rechter-commissaris bepaalt, met inachtneming van den meest mogelijken spoed, tijd en plaats van het onderzoek
      der deskundigen. De griffier roept de deskundigen op.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel197
  - number: '198.1'
    text: De deskundigen leggen op de plaats des onderzoeks in handen van den rechter-commissaris den eed af.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel198
  - number: '198.2'
    text: Zij kunnen op de gronden in art. 1932 van het Burgerlijk Wetboek BES vermeld, door partijen gewraakt worden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel198
  - number: '198.3'
    text: |-
      De rechter-commissaris beslist over de redenen van wraking, die niet dan vóór de eedsaflegging mogen worden
      voorgesteld; van zijne beslissing valt geen hooger beroep.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel198
  - number: '198.4'
    text: |-
      In de plaats der deskundigen die niet opgekomen zijn of weigeren aan hunne verplichtingen te voldoen, als ook in de
      plaats van die, tegen welke hij de wraking heeft aangenomen, benoemt hij anderen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel198
  - number: '198.5'
    text: |-
      Indien tengevolge hiervan het onderzoek moet worden uitgesteld, bepaalt de rechter-commissaris daarvoor een anderen
      tijd, waarvan geen beteekening door partijen, doch alleen mededeeling door den griffier geschiedt aan de nieuw
      benoemde en nog niet verschenen deskundigen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel198
  - number: '198.6'
    text: |-
      De rechter-commissaris brengt de bepalingen van de Onteigeningswet BES, voor zooveel noodig of wenschelijk onder
      de aandacht der in dit artikel bedoelde deskundigen, voor wie deze bepalingen evenwel slechts als richtsnoer zullen
      dienen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel198
  - number: '199'
    text: |-
      Partijen kunnen aan den rechter-commissaris en de deskundigen al die stukken mededeelen en al de gronden opgeven,
      welke volgens haar oordeel tot eene juiste bepaling der schade kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel199
  - number: '200.1'
    text: |-
      Ook ambtshalve kan de rechter-commissaris te allen tijde die personen voor zich en voor de deskundigen doen
      verschijnen, wier inlichtingen hij tot betere beoordeeling van de zaak nuttig mocht achten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel200
  - number: '200.2'
    text: |-
      Indien deze personen schadeloosstelling vorderen, wordt die door den rechter-commissaris begroot en daarvan melding
      gemaakt in het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel200
  - number: '201'
    text: |-
      De formaliteiten, bij de wettelijke bepalingen op de burgerlijke rechtsvordering voorgeschreven, omtrent het
      getuigenverhoor en het bericht van deskundigen, zijn ten deze niet toepasselijk.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel201
  - number: '202.1'
    text: |-
      Wanneer de deskundigen of de personen, wier verschijning de rechter-commissaris gelast heeft, op den bepaalden
      tijd, ofschoon behoorlijk opgeroepen, niet opkomen of zonder wettige redenen weigeren de van hen gevraagde
      inlichtingen te geven, of wel de eersten den bij [art. 198][ref1] gevorderden eed niet willen afleggen, worden
      zij door den rechter-commissaris veroordeeld tot vergoeding der tevergeefs gedane onkosten en tot eene boete van
      ten hoogste USD 28, alles onverminderd hunne gehoudenheid jegens de partijen tot vergoeding van kosten, schaden
      en interesten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel198
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '198'
        hoofdstuk: X
        afdeling: Derde
  - number: '202.2'
    text: |-
      Hij kan hen echter op hun verzet bij ongezegeld verzoekschrift om billijke redenen van de tegen hen uitgesproken
      veroordeeling vrijspreken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel202
  - number: '203.1'
    text: |-
      De griffier maakt van het bij onderzoek voorgevallene een proces-verbaal op, door den rechter-commissaris en hem
      te onderteekenen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel203
  - number: '203.2'
    text: |-
      Hij neemt daarin de verklaringen op der personen bij het onderzoek gehoord, welke verklaringen hun worden
      voorgelezen en door hen onderteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel203
  - number: '203.3'
    text: |-
      De deskundigen doen hun advies in het proces-verbaal opnemen of voegen het er onderteekend bij. In het eerste geval
      teekenen zij mede het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel203
  - number: '203.4'
    text: |-
      Ingeval een deskundige of ander gehoord persoon niet kan teekenen of weigert dit te doen, wordt daarvan melding
      gemaakt in het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel203
  - number: '203.5'
    text: De deskundigen verklaren de gronden, waarop hunne bepaling der schadeloosstelling berust.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel203
  - number: '203.6'
    text: |-
      In het proces-verbaal wordt de dag vermeld, waarop de nederlegging ter griffie in [art. 204][ref1] voorgeschreven,
      zal plaats hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel204
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '204'
        hoofdstuk: X
        afdeling: Derde
  - number: '204'
    text: |-
      De in [art. 203][ref1] genoemde stukken worden gedurende veertien dagen ter inzage der partijen op de griffie
      nedergelegd, gedurende welken tijd partijen hunne bezwaren, na die aan de wederpartij te hebben medegedeeld,
      schriftelijk aan den rechter-commissaris kunnen indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel203
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '203'
        hoofdstuk: X
        afdeling: Derde
  - number: '205.1'
    text: |-
      Na afloop van die veertien dagen brengt de rechter-commissaris in de eerstvolgende voor de behandeling van
      burgerlijke zaken bestemde terechtzitting zijn rapport uit, zonder dat er eenige verdere oproeping van partijen
      vereischt wordt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel205
  - number: '205.2'
    text: Op dezelfde terechtzitting kunnen partijen hare conclusiën nader bij pleidooi doen ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel205
  - number: '205.3'
    text: |-
      Indien de rechter in het bericht der deskundigen de vereischte inlichting niet vindt, kan hij ambtshalve andere
      deskundigen benoemen, welke aan de vroegeren zoodanige ophelderingen mogen vragen als zij oorbaar achten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel205
  - number: '205.4'
    text: |-
      Wanneer hij geen gebruik maakt van deze bevoegdheid, doet hij uiterlijk acht dagen na de terechtzitting bedoeld in
      het tweede lid van dit artikel, uitspraak over de schadeloosstelling aan rechthebbenden op den grond en (of) derde
      belanghebbenden uit te keeren.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel205
  - number: '206.1'
    text: |-
      Alleen de werkelijke waarde der gronden, niet de denkbeeldige welke zij uitsluitend voor den persoon van den
      rechthebbende op den grond dan wel voor den betrokken derden belanghebbende hebben, komt in aanmerking.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel206
  - number: '206.2'
    text: |-
      Daarbij wordt gelet op de vermindering van waarde, welke de grond geacht wordt te zullen hebben ondergaan op het
      oogenblik, dat de rechthebende of derde belanghebbende dien terugontvangt, met het oog op het gebruik dat van den
      grond door den rechthebbende wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel206
  - number: '206.3'
    text: |-
      De meerdere waarde die de grond, waarover wordt beschikt, in verband met de voor het verrichten der opsporingen
      op te richten werken geacht wordt te zullen verkrijgen, komt bij de bepaling der schadeloosstelling niet in
      aanmerking.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel206
  - number: '207'
    text: |-
      Bij de berekening der schadeloosstelling voor beschikking over grond ten behoeve van mijnbouwkundige opsporingen
      wordt acht geslagen op de mindere waarde, welke voor de niet door den opspoorder in gebruik genomen gronden het
      noodzakelijk gevolg is van die beschikking.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel207
  - number: '208'
    text: |-
      Wanneer de bij het vonnis bepaalde schadeloosstelling meer bedraagt dan het gedane aanbod, wordt de houder der
      vergunning in de kosten van het rechtsgeding verwezen; in de overige gevallen kunnen de kosten, naar gelang de
      rechter daartoe termen vindt, worden gebracht hetzij ten laste van den rechthebbende op den grond en (of) derden
      belanghebbende, die met de aangeboden schadeloosstelling geen genoegen heeft genomen, hetzij voor een gedeelte
      te hunne laste en voor het overige gedeelte ten laste van den houder der vergunning, hetzij geheel ten laste van
      laatstgenoemde.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel208
  - number: '209'
    text: |-
      Tegen het in het [vierde lid van art. 205][ref1] bedoeld vonnis, waarbij de te betalen schadeloosstelling is
      bepaald, wordt met inachtneming van de ter zake bestaande bepalingen hooger beroep toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel205
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel209
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '205'
        hoofdstuk: X
        afdeling: Derde
  - number: '210'
    text: |-
      Wanneer de rechthebbenden op den grond en (of) derde belanghebbende weigeren den grond in gebruik te
      geven, nadat de partij, aan wie door den rechter machtiging tot tijdelijke beschikking over den grond is
      verleend, de door den rechter bepaalde som als zekerheid ter griffie heeft gestort en de daarvan ingevolge
      het [derde lid van art. 190][ref1] opgemaakte akte aan eerstgenoemden heeft doen beteekenen, kunnen zij met
      inachtneming van het bepaalde in [art. 211][ref2] tot ontruiming van den grond genoodzaakt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel211
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '190'
        hoofdstuk: X
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '211'
        hoofdstuk: X
        afdeling: Vierde
  - number: '211.1'
    text: |-
      In het geval van [art. 210][ref1] wordt de partij van den rechter machtiging heeft verkregen om tijdelijk over
      den grond te beschikken, op door haar daartoe aan den president van het Gemeenschappelijk Hof van Justitie gedaan
      verzoek krachtens bevelschrift van dezen, desnoods door middel van den sterken arm, in het tijdelijk bezit der in
      het vonnis omschreven gronden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel210
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '210'
        hoofdstuk: X
        afdeling: Vierde
  - number: '211.2'
    text: |-
      Bij het verzoekschrift aan den president moet worden overgelegd afschriften van het vonnis waarbij de machtiging om
      tijdelijk over den grond te beschikken is verleend, en van de akte waaruit van de deponeering van de als zekerheid
      bepaalde som blijkt, zoomede het exploit van beteekening dier akte.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel211
  - number: '212.1'
    text: |-
      De opspoorder of de ontdekker die zijne werkzaamheden op den voet van opsporingswerken voortzet of de rijksoverheid
      dat tot het doen van opsporingen tijdelijk heeft beschikt over gronden, waarop anderen rechten uitoefenen, dan wel
      waarbij andere belang hebben, is gehouden die gronden na gemaakt gebruik weder ter beschikking te stellen van de
      daarop rechthebbenden en (of) derde belanghebbenden. Daaraan veroorzaakte schade, dan wel de mindere waarde die
      de grondstukken bij de teruggave mochten hebben, behoort door hem, die over den grond heeft beschikt, te worden
      vergoed; daarop door hem opgerichte gebouwen of getimmerten moeten door hem worden verwijderd; door hem gelegde
      buisleidingen moeten door hem worden weggehaald; door hem geboorde gaten of gegraven waterleidingen moeten door hem
      worden gestopt en dichtgemaakt, een en ander onverminderd het bepaalde bij [art. 189][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel189
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '189'
        hoofdstuk: X
        afdeling: Tweede
  - number: '212.2'
    text: |-
      De door den opspoorder op gronden behoorende tot Bonaire, Sint Eustatius en Saba aangelegde wegen vervallen,
      nadat over die gronden ten behoeve van de opsporingen is beschikt, tenzij die wegen daarna moeten dienen voor eene
      op de opsporing gevolgde ontginning en behoudens de rechten van derden, aan de rijksoverheid, zonder dat eenige
      vergoeding verschuldigd is aan hem die over de gronden heeft beschikt. Hetzelfde geldt voor de op die gronden
      opgerichte gebouwen en getimmerten van den opspoorder, welke niet binnen een door Onze Minister bepaalden termijn
      zijn verwijderd of waarover binnen dien termijn niet op eene andere door dezen goedgekeurde wijze is beschikt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel212
  - number: '212.3'
    text: |-
      Bij nalatigheid om aan de in het eerste lid van dit artikel omschreven verplichtingen te voldoen, zijn de
      rechthebbenden op den grond en (of) derde belanghebbenden elk voor zooveel zij daarbij belang hebben, bevoegd om
      zelf de in dit opzicht noodige maatregelen te treffen en zulks op kosten van hen die over de gronden ten behoeve
      van opsporingen hebben beschikt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel212
  - number: '213.1'
    text: |-
      Indien voor eene ontginning de beschikking over den bovengrond noodig is voor geen langer tijdperk, dan drie jaren,
      is daarop van toepassing hetgeen in de [artt. 187 tot en met 212][ref1] omtrent de beschikking over grond ten
      behoeve van opsporingen is bepaald, met dien verstande:


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel187
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '187'
        hoofdstuk: X
        afdeling: Tweede
  - number: 213.1.a
    text: |-
      dat wat daar ten aanzien van den houder der vergunning (opspoorder) en de opsporingen is voorgeschreven, hier op
      den concessionaris en ontginning toepasselijk is;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
  - number: 213.1.b
    text: |-
      dat wat daar bepaald is nopens ontdekkers die hunne werkzaamheden voortzetten op den voet van opsporingswerken,
      hier komt te vervallen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
  - number: 213.1.c
    text: |-
      dat in dit geval in de plaats van het in het [eerste lid van art. 187][ref1] genoemd stuk (vergunningsbeschikking
      of authentiek afschrift daarvan) treedt een authentiek afschrift der in [art. 237][ref2] genoemde gerechtelijk
      akte van concessie of c.q. der gerechtelijke akte waaruit blijkt dat de concessie ten name van den concessionaris
      is overgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel187
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel237
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '187'
        hoofdstuk: X
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '237'
        hoofdstuk: Eenig
  - number: 213.1.d
    text: |-
      dat wat daar is voorgeschreven met betrekking tot van rijksoverheidswege ondernomen opsporingen hier geldt voor
      ontginning van rijksoverheidswege;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
  - number: 213.1.e
    text: |-
      dat het [tweede lid sub a van art. 192][ref1] wordt gelezen:


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel192
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '192'
        hoofdstuk: X
        afdeling: Tweede
  - number: 213.1.e.1°
    text: |-
      een authentiek afschrift der gerechtelijke akte van concessie of een authentiek afschrift der gerechtelijke akte
      waaruit blijkt; dat de concessie ten name van den eischer is overgeschreven;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
  - number: 213.1.e.2°
    text: in geval van ontginning van een afschrift van de beschikking genoemd in het tweede lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
  - number: '213.2'
    text: |-
      Indien eene ontginning van rijksoverheidswege wordt ondernomen, treedt in de plaats van het in het
      [eerste lid van art. 187][ref1] genoemd stuk, een afschrift van de in [art. 236][ref2] bedoelde beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel187
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel236
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '187'
        hoofdstuk: X
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '236'
        hoofdstuk: X
        afdeling: Vijfde
  - number: 213.2.a
    text: |-
      waaruit dat de rijksoverheid binnen zeker gebied, waarin de benoodigde gronden zijn gelegen, zelve ontginning
      wenscht te ondernemen;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
  - number: 213.2.b
    text: |-
      houdende aanwijzing van den persoon of de autoriteit, die door de rijksoverheid is gemachtigd om namens hem ter
      zake van de sub a bedoelde ontginning het noodige, ook in rechten, te verrichten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel213
  - number: '214.1'
    text: |-
      Indien de beschikking over niet tot Bonaire, Sint Eustatius en Saba behoorende, binnen het concessie-terrein
      gelegen gronden voor een langer tijdperk dan drie jaren noodig is of indien na verloop van den aanvankelijk
      voldoende geachten termijn van drie jaren nog verdere beschikking noodig blijkt en de concessionaris zich niet
      met den rechthebbende op den grond of derden belanghebbende over den afstand van den grond kan verstaan, wendt de
      concessionaris zich tot Onze Minister bij een met redenen omkleed verzoekschrift, waarin:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel214
  - number: 214.1.a
    text: |-
      door hem wordt medegedeeld dat hij overeenkomstig het bepaalde bij het [tweede lid van art. 180][ref1] toepassing
      wenscht van de bepalingen regelende de onteigening ten algemeenen nutte ten opzichte van den in het rekest
      nauwkeurig aangeduiden grond;


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel180
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '180'
        hoofdstuk: X
        afdeling: Eerste
  - number: 214.1.b
    text: |-
      door hem wordt verzocht dat Onze Minister de in [art. 182][ref1] genoemde verklaring zal geven, dat de in het
      rekest aangeduide grond noodig is ten behoeve van de ontginning van den verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel182
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '182'
        hoofdstuk: X
        afdeling: Eerste
  - number: '214.2'
    text: |-
      Het in het eerste lid van dit artikel genoemd verzoekschrift moet vergezeld gaan van een authentiek afschrift van
      de gerechtelijke akte van concessie of van een authentiek afschrift der gerechtelijke akte, waaruit blijkt, dat de
      concessie ten name van den verzoeker is overgeschreven, en voorts van een uitgewerkt plan met uitvoerige kaarten
      en grondteekeningen van het aan te leggen werk, houdende tevens een duidelijke aanwijzing van de perceelen grond,
      welke de concessionaris wenscht te zien afgestaan met toepassing van de bepalingen regelende de onteigening ten
      algemeenen nutte en van de namen der rechthebbenden op ieder perceel.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel214
  - number: '214.3'
    text: |-
      Wanneer tot het maken van het in het tweede lid van dit artikel bedoeld plan, gravingen, opmetingen of het
      stellen van teekenen op of in iemands grond noodig geacht worden, moeten de rechthebbenden op den grond en derde
      belanghebbenden dit toelaten, mits hun dit tweemaal vier en twintig uren te voren door Onze Minister schriftelijk
      is aangezegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel214
  - number: '214.4'
    text: |-
      De schade, door de in het derde lid van dit artikel bedoelde verrichtingen veroorzaakt, wordt behoudens het recht
      van den belanghebbende om zich tot den bevoegden rechter te wenden, voorlopig begroot en door den concessionaris
      vergoed.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel214
  - number: '215.1'
    text: |-
      Het in het [eerste lid van art. 214][ref1] bedoeld verzoekschrift wordt bekend gemaakt overeenkomstig het bepaalde
      bij [art. 34][ref2], behoudens dat in dit geval de bekendmakingen geschieden op kosten van den concessionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel214
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel34
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '214'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '34'
        hoofdstuk: III
  - number: '215.2'
    text: |-
      Het uitgewerkte plan en de daarbij behoorende kaarten en grondteekeningen worden ter inzage van belangstellenden
      gelegd, ter plaatse door Onze Minister te bepalen en bij de bekendmaking in de Staatscourant bekend gesteld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel215
  - number: '216.1'
    text: |-
      De rechthebbenden op den grond en derde belanghebbenden kunnen binnen den tijd van drie maanden nadat het in het
      [eerste lid van art. 214][ref1] bedoeld verzoekschrift op de in [art. 34][ref2] aangeduide wijze is bekend gemaakt
      en binnen den tijd van twee maanden gerekend van den dag waarop de bekendmaking in de Staatscourant opgenomen, voor
      hunne belangen opkomen op den voet van het [eerste en tweede lid van art. 164][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel214
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel164
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '214'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '34'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '164'
        hoofdstuk: IX
  - number: '216.2'
    text: De bezwaarschriften worden ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel216
  - number: '217.1'
    text: |-
      De in [art. 182][ref1] bedoelde verklaring dat ten behoeve van eene ontginning bepaaldelijk aangewezen, niet tot
      Bonaire, Sint Eustatius en Saba behoorende gronden voor een langer tijdperk dan drie jaren noodig zijn, wordt door
      Onze Minister gegeven bij een met redenen omkleede beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel182
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '182'
        hoofdstuk: X
        afdeling: Eerste
  - number: '217.2'
    text: |-
      In de beschikking wordt ten behoeve van de ontginning noodige grond nauwkeurig aangewezen met aanduiding van de
      perceelen waaruit de grond bestaat, en de namen der rechthebbenden op ieder perceel.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel217
  - number: '217.3'
    text: De beschikking wordt, op kosten van den concessionaris, in de Staatscourant openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel217
  - number: '217.4'
    text: |-
      Onze Minister geeft, met verwijzing naar datum en nummer van de Staatscourant, waarin de beschikking is openbaar
      gemaakt, aan de beschikking verdere bekendheid door schriftelijke kennisgeving aan de rechthebbenden op den grond
      en derde belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel217
  - number: '218'
    text: |-
      De concessionaris handelt vervolgens, onder overlegging van de in [art. 182][ref1] en [217][ref2] genoemde
      verklaring, overeenkomstig de bepalingen regelende de onteigening ten algemeenen nutte in Bonaire, Sint Eustatius
      en Saba, vastgelegd in de Onteigeningswet BES, en verzoekt toepassing van die bepalingen ten einde den voor zijne
      ontginning noodigen grond in eigendom te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel182
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel217
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '182'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '217'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '219'
    text: |-
      Op het door de concessionaris ingevolge het bepaalde bij [artikel 218][ref1] te voeren proces en de gevolgen
      daarvan zijn de bepalingen van de Onteigeningswet BES van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel218
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '218'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '220'
    text: |-
      Indien eene ontginning van rijksoverheidswege wordt ondernomen, gelden in verband met [art. 183][ref1] de
      bepalingen der [artt. 215 tot en met 219][ref2] ook voor de rijksoverheid, met dien verstande dat voor de
      rijksoverheid handelt en optreedt de in de beschikking genoemd in het [tweede lid van art. 214][ref3] en
      [art. 236][ref4], aangewezen persoon of autoriteit en een afschrift van die beschikking in de plaats treedt van het
      afschrift of de afschriften der gerechtelijke akten van concessie.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel183
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel215
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel214
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel236
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '183'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '215'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '214'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '236'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '221.1'
    text: |-
      Indien de beschikking over tot Bonaire, Sint Eustatius en Saba behoorende, binnen het concessie-terrein gelegen
      gronden ten behoeve van eene particuliere mijnontginning voor een langer tijdperk dan drie jaren noodig is
      of indien na verloop van den aanvankelijk voldoende geachten termijn van drie jaren nog verdere beschikking
      noodig blijkt, verleent Onze Minister op daartoe door den concessionaris gedaan verzoek op den voet van het
      [eerste lid van art. 181][ref1] en mitsdien onder de door hen noodig geoordeelde voorwaarden verlof om over den
      benoodigden grond te beschikken, mitsdien om dien grond in gebruik te nemen dan wel in gebruik te houden. Het
      [tweede, derde en vierde lid van art.214][ref2] zijn ten deze toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel214
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '181'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '214'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '221.2'
    text: |-
      Indien op de in het eerste lid van dit artikel bedoelde gronden door derden rechten worden uitgeoefend, bepaalt
      Onze Minister, nadat die derden ter zake zullen zijn geraadpleegd, bij het te verleenen verlof de som, welke door
      den concessionaris als schadeloosstelling aan die derden behoort te worden uitgekeerd dan wel waarvoor zekerheid
      zal moeten worden gesteld alvorens de concessionaris krachtens het verleend verlof over den grond zal mogen
      beschikken en de derden, die daarop rechten uitoefenen, zulks zullen moeten gedoogen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel221
  - number: '221.3'
    text: |-
      Van de beschikking, waarbij het in dit artikel bedoeld verlof wordt verleend, wordt een afschrift uitgereikt aan
      hen, die op de door den concessionaris benoodigden grond rechten uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel221
  - number: '222.1'
    text: |-
      Indien zij, die rechten op de benoodigde gronden uitoefenen, met de door Onze Minister bij het in het
      [tweede lid van art. 221][ref1] bedoelde beschikking bepaalde schadeloosstelling geen genoegen nemen of wel indien
      de concessionaris wenscht haar door den rechter begroot te zien, wordt door de belanghebbende partij de beslissing
      van den rechter ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel221
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '221'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '222.2'
    text: |-
      De belanghebbende wendt zich tot den bevoegden rechter met het verzoek om de schadeloosstelling, die ter
      zake behoort te worden uitgekeerd, te bepalen. Het verzoekschrift moet door den verzoeker bij eene, bij
      deurwaardersexploit beteekende akte aan de wederpartij worden beteekend; het exploit van beteekening moet bij het
      verzoekschrift worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel222
  - number: '222.3'
    text: |-
      Op de bepaling van de schadeloosstelling zijn de bepalingen van de Onteigeningswet BES van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel222
  - number: '223.1'
    text: |-
      Over Bonaire, Sint Eustatius en Saba behoorenden grond, waarop derden rechten uitoefenen, mag, indien
      de beslissing van den rechter nopens de te betalen schadeloosstelling overeenkomstig het bepaalde bij
      [art. 222][ref1] is ingeroepen, in afwachting van die beslissing door den concessionaris onmiddellijk worden
      beschikt nadat door hem de door Onze Minister bij het verleenen van het verlof overeenkomstig het bepaalde
      bij het [tweede lid van art. 221][ref2] bepaalde som, welke als schadeloosstelling aan die derden behoort te
      worden uitgekeerd dan wel waarvoor zekerheid moet worden gesteld, ter griffie van den betrokken rechter zal zijn
      gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel222
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel221
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '222'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '221'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '223.2'
    text: |-
      Het in [art. 22][ref1] bedoeld verlof om te beschikken over tot Bonaire, Sint Eustatius en Saba behoorende gronden,
      waarop derden rechten uitoefenen, vervalt, wanneer niet binnen zes maanden na de dagteekening van de beschikking,
      waarbij het verlof door Onze Minister is verleend, de schadeloosstelling betaald of daarvoor zekerheid gesteld is.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel22
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '22'
        hoofdstuk: II
  - number: '223.3'
    text: |-
      De concessionaris is in het geval, bedoeld in het tweede lid van dit artikel, gehouden tot vergoeding der schade
      welke derden die op den grond rechten uitoefenen, door de beschikking over den grond mochten hebben geleden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel223
  - number: '223.4'
    text: |-
      Onder de in het derde lid van dit artikel genoemde schade zijn echter niet begrepen de kosten noodig om tot de
      bepaling van het bedrag der schadeloosstelling door den rechter te geraken, noch ook het verlies der voordeelen,
      die zij, door wie rechten op den grond worden uitgeoefend, uit de beschikking over den grond worden uitgeoefend,
      uit de beschikking over den grond zouden hebben getrokken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel223
  - number: '223.5'
    text: |-
      Onder de schadeloosstelling zijn begrepen de wettelijke interessen daarvan, te rekenen van den achtsten dag, nadat
      de schadeloosstelling door Onze Minister, dan wel, indien de beslissing van den rechter is ingeroepen, door dezen
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel223
  - number: '224.1'
    text: |-
      Wanneer derden, die op tot Bonaire, Sint Eustatius en Saba behoorende gronden rechten uitoefenen, de door
      Onze Minister overeenkomstig de voorschriften van [art. 221][ref1] bepaalde schadeloosstelling weigeren
      aan te nemen en door den concessionaris op de in het [eerste lid van art. 223][ref2] aangegeven wijze ter
      zake zekerheid is gesteld, kan nadat de beslissing van den rechter overeenkomstig het bepaalde bij het
      [eerste lid van art. 222][ref3] is ingeroepen, in afwachting van die beslissing de concessionaris op zijn daartoe
      gedaan schriftelijk verzoek, krachtens bevelschrift van den president van het Gemeenschappelijk Hof van Justitie,
      desnoods door middel van den sterken arm, in het bezit van de in de beschikking van Onze Minister omschreven
      gronden worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel223
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel222
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '221'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '223'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '222'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '224.2'
    text: |-
      Bij het verzoekschrift aan den president van het Gemeenschappelijk Hof van Justitie moeten worden overgelegd
      afschriften van de in [art. 221][ref1] bedoelde beschikking en van de akte waaruit blijkt, dat ingevolge het
      [eerste lid van art. 223][ref2] zekerheid is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel223
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '221'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '223'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '225.1'
    text: Onder den concessionaris kan door derden beslag worden gelegd op de schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel225
  - number: '225.2'
    text: |-
      Wanneer onder den concessionaris beslag op de schadeloosstelling gelegd of wanneer rangregeling gevraagd mocht
      worden, doet hij terstond, zonder eenig aanbod, de gelden consigneeren en zich op de in [art. 224][ref1] bepaalde
      wijze in het bezit van de gronden stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel224
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '224'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '226.1'
    text: |-
      Erfdienstbaarheden kunnen gevestigd blijven op de gronden, waarvoor door den concessionaris ten behoeve van de
      ontginning wordt beschikt, maar alleen met diens goedvinden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel226
  - number: '226.2'
    text: |-
      Alle verplichtingen, door de daartoe bevoegde macht op de in het eerste lid van dit artikel bedoelde gronden
      gelegd, en alle belastingen ter zake daarvan volgens algemene maatregelen van bestuur verschuldigd, gaan van den
      dag, waarop de concessionaris op de in [art. 224][ref1] aangegeven wijze in het bezit van die gronden is gesteld of
      anders waarop het in [art. 221][ref2] bedoeld verlof door Onze Minister is verleend, op den concessionairs over.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel224
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel221
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '224'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '221'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '227'
    text: |-
      Indien tengevolge van oorzaken, welke de concessionaris bij machte was uit den weg te ruimen, met de noodige werken
      op den grond, waarover daartoe volgens het verleend verlof mocht worden beschikt, niet binnen twee jaren, nadat het
      in [art. 221][ref1] bedoeld verlof is verleend, een aanvang gemaakt, of indien uit andere omstandigheden is aan te
      toonen dat over den grond blijkbaar niet voor het doel, waarvoor het verlof wordt verleend, zal worden beschikt,
      kan op verzoek van hen, die oorspronkelijk rechten op dien grond uitoefenden, het verleend verlof door Onze
      Minister worden ingetrokken en kunnen zij den grond in den toestand waarin hij zich alsdan bevindt terugvorderen,
      zoo noodig bij den rechter; maar onder gehoudenheid om, in evenredigheid tot de terugontvangen waarde, de door den
      concessionaris betaalde schadeloosstelling terug te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel221
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '221'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '228'
    text: |-
      Indien de beschikking over tot Bonaire, Sint Eustatius en Saba behoorende, buiten het concessieterrein gelegen
      gronden ten behoeve van eene particuliere mijnontginning voor een langer tijdperk dan drie jaren noodig is, of
      indien na verloop van den aanvankelijk voldoende geachten termijn van drie jaren nog verdere beschikking noodig
      blijkt – onverschillig of op die gronden door derden aldan niet rechten worden uitgeoefend – verleent Onze
      Minister op daartoe door den concessionaris gedaan verzoek op den voet van het [eerste lid van art. 181][ref1] en
      mitsdien onder de door hem noodig geoordeelde voorwaarden, verlof om over den benoodigden grond te beschikken. De
      [artt. 168][ref2], [170][ref3] en [221 tot en met 227][ref4] zijn ten deze toepasselijk, met dien verstande dat
      zoowel voor den aanleg van de in het [eerste lid van art. 170][ref5] bedoelde hulpwerken als voor den aanleg van
      de in het [eerste lid van art. 181][ref6] genoemde wegen verlof tot beschikking over den noodigen grond kan worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel168
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel170
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel221
      [ref5]: https://wetten.overheid.nl/BWBR0028574#Artikel170
      [ref6]: https://wetten.overheid.nl/BWBR0028574#Artikel181
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel228
    references:
