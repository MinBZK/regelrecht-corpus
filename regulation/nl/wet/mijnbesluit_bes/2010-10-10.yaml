        afdeling: Eerste
  - number: '229'
    text: |-
      Indien Onze Minister krachtens het [eerste lid van art. 181][ref1] op tot Bonaire, Sint Eustatius en Saba
      behoorende binnen of buiten het concessie-terrein gelegen gronden onder de door hem noodig geoordeelde voorwaarden
      en behoudens de rechten van derden, ten behoeve van een particuliere mijnontginning recht van opstal verleent tot
      plaatsing der noodige gebouwen, inrichtingen en werkplaatsen, geschiedt dat op den voet van de ten aanzien van het
      verleenen recht van opstal algemeen geldende bepalingen, behoudens dat alsdan het recht van opstal ook voor een
      langer tijdvak dan dertig jaren kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel181
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '181'
        hoofdstuk: X
        afdeling: Eerste
  - number: '230.1'
    text: |-
      Indien een ontginning van rijksoverheidswege wordt ondernomen en ten behoeve van die ontginning de beschikking over
      tot Bonaire, Sint Eustatius en Saba behoorende, binnen of buiten het gebied dier ontginning gelegen gronden, waarop
      door derden rechten worden uitgeoefend, voor een langer tijdperk. dan drie jaren noodig is of indien na verloop
      van den aanvankelijk voldoende geachten termijn van drie jaren nog verdere beschikking over zoodanigen grond noodig
      blijkt, dan wordt zulks bij beschikking van Onze Minister geconstateerd en verlof verleend om over de noodige
      gronden te beschikken; bij diezelfde beschikking wordt de som bepaald welke als schadeloosstelling zal worden
      aangeboden aan hen, die op de benoodigde gronden rechten uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel230
  - number: '230.2'
    text: |-
      De persoon of autoriteit, die overeenkomstig het bepaalde bij het [tweede lid van art. 213][ref1] en
      [art. 236][ref2] is aangewezen om ter zake namens de rijksoverheid op te treden, wendt zich, indien
      zij, die op benoodigde gronden rechten uitoefenen, weigeren om met de in het eerste lid van dit
      artikel bedoelde schadeloosstelling genoegen te nemen, onder overlegging van afschriften van de in het
      [tweede lid van art. 213][ref3] en het eerste lid van dit artikel bedoelde beschikkingen tot den bevoegden rechter
      met verzoek de schadeloosstelling te bepalen, die ter zake aan de rechthebbenden zal behooren te worden uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel236
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel213
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '213'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '236'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '213'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '230.3'
    text: |-
      Op het tot den rechter te richten verzoek is toepasselijk het bepaalde bij het
      [tweede, derde en vierde lid van art. 214][ref1], behoudens dat overlegging van de gerechtelijke akten betreffende
      de concessie vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel214
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '214'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '230.4'
    text: |-
      De vaststelling van de uit te keeren schadeloosstelling door den rechter geschiedt volgens de voorschriften van het
      [derde lid van art. 222][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel222
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '222'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '230.5'
    text: |-
      In afwachting van de beslissing van den rechter nopens de te betalen schadeloosstelling mag over de in het eerste
      lid van dit artikel bedoelde gronden onmiddellijk worden beschikt nadat door de rijksoverheid de aangeboden som ter
      griffie van het Gemeenschappelijk Hof van Justitie zal zijn gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel230
  - number: '230.6'
    text: |-
      Het in het eerste lid van dit artikel bedoeld verlof vervalt, wanneer niet binnen zes maanden na de dagteekening
      van de beschikking waarbij het verlof is verleend, de schadeloosstelling betaald of overeenkomstig het bepaalde bij
      het vijfde lid van dit artikel gedeponeerd is.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel230
  - number: '230.7'
    text: |-
      De voorschriften van het [derde, vierde en vijfde lid van art. 223][ref1] en de [artt. 225][ref2], [226][ref3]
      en [227][ref4] zijn ten deze toepasselijk met dien verstande dat wat daar ten aanzien van den concessionaris is
      voorgeschreven hier geldt voor de rijksoverheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel223
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel225
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel226
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel227
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '223'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '225'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '226'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '227'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '231.1'
    text: |-
      Indien de aangeboden schadeloosstelling is geweigerd kan; nadat zij overeenkomstig het bepaalde bij het
      [vijfde lid van art. 230][ref1] is gedeponeerd, de rijksoverheid krachtens bevelschrift van het Gemeenschappelijk
      Hof van Justitie, desnoods door middel van den sterken arm, in het bezit van de in het eerste lid van dit art. 230
      bedoelde gronden worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel230
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '230'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '231.2'
    text: |-
      Bij het daartoe strekkend verzoekschrift van den persoon of de autoriteit, genoemd in het
      [tweede lid van art. 213][ref1] moeten worden overgelegd afschriften van het in het [eerste lid van art. 230][ref2]
      bedoelde beschikking en van de akte waaruit blijkt dat de aangeboden som ter griffie van het Gemeenschappelijk Hof
      van Justitie is gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel230
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '213'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '230'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '232.1'
    text: |-
      Indien voor den aanleg van wegen of van hulpwerken, overeenkomstig het [eerste lid van art. 170][ref1] de
      beschikking over niet tot Bonaire, Sint Eustatius en Saba behoorende, buiten het concessie-terrein gelegen
      gronden ten behoeve van eene particuliere mijnontginning noodig is, en blijkt dat partijen zich over den afstand
      van dien grond niet kunnen verstaan, dan wordt ingevolge het [tweede lid van art. 181][ref2] op verzoek van den
      concessionaris overgegaan tot toepassing van de bepalingen, regelende de onteigening ten algemeenen nutte en
      zulks overeenkomstig de dienaangaande in de [artt. 214 tot en met 219][ref3] gegeven voorschriften, zullende dat
      wat daar bepaald is ten aanzien van niet tot Bonaire, Sint Eustatius en Saba behoorende, binnen het concessie-
      terrein gelegen gronden, hier toepasselijk zijn op niet tot Bonaire, Sint Eustatius en Saba behoorende, buiten het
      concessie-terrein gelegen gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel181
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel214
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '170'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '181'
        hoofdstuk: X
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '214'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '232.2'
    text: |-
      Indien eene ontginning van rijksoverheidswege wordt ondernomen, geldt het bepaalde bij het eerste lid van dit
      artikel in verband met [art. 165][ref1] ook voor de rijksoverheid met dien verstande dat voor de rijksoverheid
      handelt en optreedt de in de beschikking, genoemd in het [tweede lid van art. 213][ref2] en [art. 236][ref3],
      aangewezen persoon of autoriteit en een afschrift van die beschikking in de plaats treedt van het afschrift of de
      afschriften der gerechtelijke akten van concessie.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel236
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '165'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '213'
        hoofdstuk: X
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '236'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '233'
    text: |-
      Wanneer, ten einde te kunnen voldoen aan de in [artt. 67][ref1], [111][ref2] en [123][ref3] aan den concessionaris
      opgelegde verplichting, uit- of ontgravingen, opmetingen of het stellen van merkteekens op iemands grond noodig
      geacht worden, moeten rechthebbenden op den grond en derde belanghebbenden dit op den voet van het bepaalde in het
      [derde en vierde lid van art. 214][ref4] toelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel214
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '67'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '111'
        hoofdstuk: V
        afdeling: 1e
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '123'
        hoofdstuk: V
        afdeling: 2e
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '214'
        hoofdstuk: X
        afdeling: Vijfde
  - number: '234'
    text: |-
      Indien door mijnbouwkundige opsporingen of eene mijnontginning aan den bovengrond of hetgeen daartoe behoort,
      schade wordt gebracht zijn de rechthebbenden op dien bovengrond bevoegd om, in plaats van eene schadevergoeding in
      geld te eischen, te vorderen dat binnen zekeren tijd de vroegere toestand door den opspoorder of den concessionaris
      dan wel, in geval van opsporingen of ontginning van rijksoverheidswege, door de rijksoverheid zoo mogelijk worde
      hersteld, mits daardoor het bedrijf van opspoorder of den concessionaris niet wordt belemmerd of onmogelijk
      gemaakt, onverminderd het recht van de rechthebbenden op den bovengrond om voor elke waardevermindering van
      den grond, welke na het herstel in den vroegeren toestand mocht blijven bestaan, krachtens [art. 164][ref1] ook
      schadevergoeding te eischen. Zouden evenwel de kosten, aan het herstel van den vroegeren toestand verbonden, het
      bedrag eener schadevergoeding in geld overtreffen, dan zijn de rechthebbenden of belanghebbenden bij den bovengrond
      verplicht zich met eene schadevergoeding te vergenoegen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel164
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '164'
        hoofdstuk: IX
  - number: '235'
    text: |-
      Zij, die kunstwegen, spoorwegen of andere openbare verkeersmiddelen aanleggen op gronden, gelegen binnen een
      terrein, waarvoor concessie tot het winnen van delfstoffen is verleend, zijn verplicht tot vergoeding van
      schade aan den concessionaris, indien deze tengevolge van door de met het toezicht belaste ambtenaren gegeven
      voorschriften in verband met den aanleg dier verkeersmiddelen zijn bedrijf moet beperken, iets heeft moeten
      verrichten dat anders niet noodig zou zijn geweest of reeds bestaande werken in de mijn heeft moeten opruimen of
      veranderen, dan wel indien door den aanleg dier verkeersmiddelen het bedrijf van den concessionaris moeilijker of
      duurder wordt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel235
  - number: '236.1'
    text: |-
      Indien na een van rijksoverheidswege ingesteld onderzoek, eene ontginning van rijksoverheidswege wordt ondernomen,
      wordt door Onze Minister, den Raad van Bestuur gehoord, bij beschikking het terrein aangewezen waarbinnen tot die
      mijnontginning zal worden overgegaan; de sluiting van het terrein overeenkomstig het bepaalde bij [art. 176][ref1]
      voor mijnbouwkundige opsporingen van particulieren kan bij dezelfde beschikking worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel176
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '176'
        hoofdstuk: X
        afdeling: Eerste
  - number: '236.2'
    text: |-
      De beschikking houdt tevens aanwijzing in van den persoon of de autoriteit, die wordt gemachtigd om voor de
      rijksoverheid ter zake van de voorgenomen ontginning het noodige, ook in rechten, te verrichten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel236
  - number: '236.3'
    text: De beschikking wordt openbaar gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel236
  - number: '237.1'
    text: |-
      De titel van aankomst van het op grond van de concessie verworven recht, bedoeld in art. 3 der Mijnwet BES, moet
      met inachtneming van de bepalingen van dit artikel worden openbaar gemaakt door inschrijving van de concessie in
      de openbare registers, op dezelfde wijze als is voorgeschreven voor de in het Burgerlijk Wetboek BES opgenoemde
      zakelijke rechten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel237
  - number: '237.2'
    text: |-
      De openbaarmaking geschiedt op verzoek van den concessionaris en zonder medewerking of vertegenwoordiging van de
      rijksoverheid door den daartoe bevoegden ambtenaar binnen wiens ressort het concessie-terrein is gelegen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel237
  - number: '237.3'
    text: |-
      In de gerechtelijke akte van concessie waarbij de openbaarmaking geschiedt, moet de concessie-beschikking volledig
      worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel237
  - number: '237.4'
    text: |-
      Eerst na de openbaarmaking van den titel van aankomst (inschrijving der concessie) bestaat het op grond van de
      concessie verworven recht tegenover derden. Eerst dan kan dat recht worden vervreemd en met hypotheek belast
      en door den concessionaris als zoodanig worden opgetreden tegenover rechthebbenden op den grond en derde
      belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel237
  - number: '237.5'
    text: |-
      In de beschikking waarbij een concessie wordt verleend, wordt de concessionaris verwezen naar de bepalingen van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel237
  - number: '238.1'
    text: |-
      Overschrijving van de rechten en verplichtingen uit eene concessie voortvloeiende, op de rechtverkrijgenden van den
      overleden wettigen houder of op andere personen of vennootschappen, ingevolge het derde lid van art. 5 der Mijnwet
      BES, heeft niet plaats tenzij die rechtverkrijgenden of verkrijgers aan de autoriteit, voor welke de overschrijving
      moet geschieden, onder overlegging van de overige voor de bewerkstelling van die overschrijving benoodigde stukken,
      aantoonen dat zij voldoen aan de vereischten van voormeld artikel.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel238
  - number: '238.2'
    text: |-
      Hetzelfde geldt bij vervreemding van de concessie, ook waanneer vóór de inwerkingtreding der Mijnwet BES verleende
      concessiën worden vervreemd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel238
  - number: '238.3'
    text: |-
      De aantooning, bedoeld in het eerste en tweede lid van dit artikel, wordt geleverd òf door de overlegging van
      de mededeeling aan belanghebbenden gedaan ingevolge [art. 26][ref1] òf door de overlegging van de ingevolge
      [art. 20][ref2] van dit besluit in verband met het derde lid van art. 5 der Mijnwet BES verleende goedkeuring
      of, zoo er een geschil is geweest nopens het voldoen aan de vereischten, door de overlegging van een authentiek
      afschrift der beschikking van het Gemeenschappelijk Hof van Justitie waarbij is beslist dat de belanghebbende aan
      die vereischten voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel20
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '26'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '20'
        hoofdstuk: II
  - number: '238.4'
    text: |-
      In de gerechtelijke akte moet uitdrukkelijk worden vermeld, dat de betrokkene heeft aangetoond aan de in art. 5 der
      Mijnwet BES gestelde vereischten te voldoen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel238
  - number: '239.1'
    text: |-
      De bewijzen van overgang van het op grond van de concessie verworven recht en alle akten, waarbij dat recht met
      hypotheek wordt belast of verbonden, zoomede alle akten van cessie van zoodanige hypotheken, worden verleden voor
      een notaris.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel239
  - number: '239.2'
    text: In de bewijzen van overgang moet de concessie-beschikking volledig worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel239
  - number: '239.3'
    text: |-
      Overschrijving van eene concessie op de rechtverkrijgenden van den overleden wettigen houder of op andere personen
      of vennootschappen heeft niet plaats tenzij die rechtverkrijgenden en verkrijgers hebben voldaan aan het bepaalde
      bij het [vorige artikel][ref1] en door aanbieding der quitantiën is aangetoond of op andere wijze blijkt, dat de
      aan vast recht verschuldigde bedragen zijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel238
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '238'
        hoofdstuk: Eenig
  - number: '239.4'
    text: Akten in strijd met het bepaalde bij dit artikel verleden, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel239
  - number: '240.1'
    text: |-
      De in geval van splitsing van een concessie-terrein, verwisseling van gedeelten van concessie-terreinen en
      vereeniging van concessie-terreinen en in geval van gedeeltelijke intrekking van een concessie door Onze Minister
      te verleenen nieuwe akten van concessie (nieuwe concessie-beschikkingen) moeten ook op de in [art. 237][ref1]
      bedoelde wijze op verzoek van de concessionarissen worden openbaar gemaakt; de overige bepalingen van dat artikel
      zijn ten deze mede toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel237
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '237'
        hoofdstuk: Eenig
  - number: '240.2'
    text: |-
      Van de splitsing van een concessie-terrein, verwisseling van gedeelten van concessie-terreinen, vereeniging van
      concessie-terreinen en gedeeltelijke intrekking van een concessie zal door den betrokken ambtenaar aanteekening
      moeten worden gehouden op de minuut en gros van de oorspronkelijke gerechtelijke concessie-akte, zoomede, indien
      het op grond van de concessie verworven recht met hypotheek is belast, op de minuut van den schuldbrief, in het
      protocol en op de gros.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel240
  - number: '240.3'
    text: |-
      Gelijke aanteekening zal door den betrokken ambtenaar moeten worden gehouden van elke wijziging van de
      grensomschrijving en oppervlakte van het concessie-terrein als bedoeld in [art. 98][ref1] en van elke wijziging of
      uitbreiding van de concessie-voorwaarden als bedoeld in [art. 144][ref2]. De concessionarissen en hypotheekhouders
      zullen den betrokken ambtenaar daartoe door vertooning van de grossen der gerechtelijke concessie-akten en
      schuldbrieven in staat moeten stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel144
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '98'
        hoofdstuk: IV
        afdeling: 6e
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '144'
        hoofdstuk: VIII
        afdeling: Eerste
  - number: '241'
    text: |-
      Van elke gerechtelijke akte van concessie als bedoeld in de [artt. 237][ref1] en [240][ref2], en van elke akte
      van overgang als bedoeld in [art. 239][ref3], wordt door den betrokken ambtenaar binnen een week na het verlijden
      kosteloos een volledig afschrift aangeboden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel240
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel239
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '237'
        hoofdstuk: Eenig
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '240'
        hoofdstuk: Eenig
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '239'
        hoofdstuk: Eenig
  - number: '242'
    text: |-
      De notarissen zijn persoonlijk, in rechten, aansprakelijk voor de schade, welke veroorzaakt wordt door niet-
      naleving van de voor hen geldende voorschriften van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel242
  - number: '243.1'
    text: |-
      Binnen een termijn van drie maanden ingaande met den datum van de in het [eerste lid van art. 16][ref1], het
      [eerste lid van art. 17][ref2] of het [tweede lid van art. 27][ref3] bedoelde gerechtelijke beteekening kan de
      belanghebbende, zoo hij niet in de te zijnen aanzien genomen beschikking van Onze Minister berust, het geschil bij
      een met redenen omkleed verzoekschrift, vergezeld van de noodige bescheiden, waaronder de beteekende beschikking en
      het exploot van beteekening, onderwerpen aan de uitspraak van het Gemeenschappelijk Hof van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel27
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '16'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '17'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '27'
        hoofdstuk: II
  - number: '243.2'
    text: |-
      Het verzoekschrift kan ook worden ingediend door een daartoe bij authentieke akte aangewezen bijzonderen
      gemachtigde.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel243
  - number: '244.1'
    text: |-
      Het in [art. 243][ref1] bedoeld verzoekschrift wordt met de bijbehoorende stukken ingediend ter griffie van het
      Hof.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel243
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '243'
        hoofdstuk: Eenig
  - number: '244.2'
    text: |-
      De griffier teekent op het verzoekschrift den datum van indiening aan en geeft kosteloos een gedagteekend bewijs
      van ontvangst daarvoor af.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel244
  - number: '245'
    text: |-
      De griffier van het Hof zendt binnen acht dagen na de indiening kosteloos een volledig afschrift van het
      verzoekschrift aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel245
  - number: '246'
    text: De indiening van het verzoekschrift wordt ten spoedigste vanwege Onze Minister in de Staatscourant aangekondigd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel246
  - number: '247'
    text: |-
      Het Hof beschikt op het tijdig ingediend verzoekschrift na den Procureur-generaal te hebben gehoord en met
      inachtneming van de navolgende bepalingen, maar overigens buiten vorm van proces.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel247
  - number: '248.1'
    text: Inlichtingen, welke het Hof van Onze Minister mocht wenschen te ontvangen, worden schriftelijk gevraagd en gegeven.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.2'
    text: |-
      De verzoeker kan tot het Hof het verzoek richten om in persoon of bij een door hem aangestelden bijzonderen
      gemachtigde over de zaak te worden gehoord; hij is bevoegd bij zijn verzoek op te geven over welke punten hij
      wenscht dat het verhoor zal loopen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.3'
    text: |-
      Het Hof is ook ambtshalve bevoegd den verzoeker of den door dezen aangestelden bijzonderen gemachtigde over de zaak
      te hooren.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.4'
    text: |-
      De oproeping van den verzoeker of diens gemachtigde geschiedt bij aangeteekenden dienstbrief van den griffier van
      het Hof. Wanneer het Hof ambtshalve besluit den verzoeker of diens gemachtigde te hooren, wordt bij de oproeping
      medegedeeld over welke punten het Hof den verzoeker of diens gemachtigde wenscht te hooren.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.5'
    text: |-
      Zoowel wanneer ingevolge een verzoek als bedoeld in het tweede lid van dit artikel de verzoeker of diens
      gemachtigde door het Hof moet worden gehoord en de verzoeker de punten heeft opgegeven waarover hij wenscht dat
      het verhoor zal loopen, als wanneer het Hof ambtshalve besluit den verzoeker of diens gemachtigde te hooren, wordt
      daarvan door den griffier ten spoedigste aan Onze Minister kennis gegeven, onder opgave van dag en uur, waarop het
      verhoor is bepaald, en hetzij door den verzoeker opgegeven punten hetzij van die, waarover het Hof den verzoeker
      of diens gemachtigde wenscht te hooren, zijnde het Hof niettemin in beide gevallen bevoegd het verhoor ook te doen
      loopen over andere punten dan genoemd in de kennisgeving aan Onze Minister en in de oproeping bedoeld in het vierde
      lid van dit artikel. Zoo noodig kan het Hof het verhoor voortzetten op een nader te bepalen dag en uur, in welk
      geval geen nieuwe oproeping van den verzoeker of diens gemachtigde en, tenzij Onze Minister aanvankelijk niet bij
      het verhoor was vertegenwoordigd, ook geen nieuwe kennisgeving aan Onze Minister worden vereischt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.6'
    text: De verzoeker of diens gemachtigde is bevoegd zich bij het verhoor door een raadsman te doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.7'
    text: Onze Minister is bevoegd zich bij het verhoor te doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.8'
    text: De verzoeker mag in den loop van het onderzoek nieuwe stukken overleggen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '248.9'
    text: |-
      Ook Onze Minister is bevoegd in den loop van het onderzoek stukken te doen overleggen en aan het Hof inlichtingen
      te doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel248
  - number: '249'
    text: |-
      De eindbeslissing, door het Hof ingevolge [art. 247][ref1] genomen, heeft tusschen partijen kracht van gewijsde.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel247
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel249
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '247'
        hoofdstuk: Eenig
  - number: '250.1'
    text: |-
      De griffier van het Gemeenschappelijk Hof van Justitie zendt van de eindbeslissing van het Hof binnen veertien
      dagen kosteloos een volledig afschrift aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel250
  - number: '250.2'
    text: |-
      Indien het Hof beslist, dat de verzoeker aan de in art. 5 der Mijnwet BES gestelde vereischten voldoet, zendt
      de griffier hem daarvan binnen veertien dagen bericht bij aangeteekenden dienstbrief en worden hetzij de in
      [artt. 16][ref1] en [17][ref2] bedoelde beschikkingen hetzij de in [art. 27][ref3] bedoelde beschikking van Onze
      Minister zoo noodig ingetrokken. Tevens worden hetzij de aangevraagde vergunning of concessie hetzij de verzochte
      toestemming tot overdracht van eene vergunning hetzij de gevraagde goedkeuring van de overdracht van het recht
      op concessie of van eene concessie verleend, tenzij inmiddels tegen het verleenen andere bezwaren mochten zijn
      gerezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel27
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '16'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '17'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '27'
        hoofdstuk: II
  - number: '250.3'
    text: De verzoeker kan tegen vergoeding der kosten van de beslissing van het Hof afschrift nemen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel250
  - number: '251.1'
    text: |-
      Indien het Hof beslist, dat de verzoeker niet voldoet aan de in art. 5 der Mijnwet BES gestelde vereischten of
      heeft opgehouden daaraan te voldoen, wordt hem de beslissing van het Hof vanwege Onze Minister bij eene, bij
      deurwaardersexploit beteekende akte beteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel251
  - number: '251.2'
    text: |-
      In elk geval wordt de eindbeslissing van het Hof ten spoedigste vanwege Onze Minister in de Staatscourant bij
      uittreksel aangekondigd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel251
  - number: '252.1'
    text: |-
      Van de beteekening bedoeld in het [eerste lid van art. 16][ref1] en het [eerste lid van art 17][ref2], tot het
      verstrijken van den termijn aangegeven in [art. 243][ref3] of, ingeval een verzoekschrift, als in art. 243 bedoeld,
      is ingediend tot de beslissing van het Hof aan den houder der vergunning zal zijn medegedeeld ([art. 250][ref4])
      of beteekend ([art. 251][ref5]), mogen de opsporingen worden voortgezet en mag de vergunning worden verlengd een en
      ander behoudens het bepaalde bij de [artt. 47][ref6], [48][ref7], [49][ref8] en [142][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel243
      [ref4]: https://wetten.overheid.nl/BWBR0028574#Artikel250
      [ref5]: https://wetten.overheid.nl/BWBR0028574#Artikel251
      [ref6]: https://wetten.overheid.nl/BWBR0028574#Artikel47
      [ref7]: https://wetten.overheid.nl/BWBR0028574#Artikel48
      [ref8]: https://wetten.overheid.nl/BWBR0028574#Artikel49
      [ref9]: https://wetten.overheid.nl/BWBR0028574#Artikel142
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '16'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '17'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '243'
        hoofdstuk: Eenig
      - id: ref4
        bwb_id: BWBR0028574
        artikel: '250'
        hoofdstuk: Eenig
      - id: ref5
        bwb_id: BWBR0028574
        artikel: '251'
        hoofdstuk: Eenig
      - id: ref6
        bwb_id: BWBR0028574
        artikel: '47'
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0028574
        artikel: '48'
        hoofdstuk: III
      - id: ref8
        bwb_id: BWBR0028574
        artikel: '49'
        hoofdstuk: III
      - id: ref9
        bwb_id: BWBR0028574
        artikel: '142'
        hoofdstuk: VIII
        afdeling: Eerste
  - number: '252.2'
    text: |-
      De houder der vergunning zal echter van de in het [eerste lid van art. 16][ref1] en het
      [eerste lid van art. 17][ref2] bedoelde beteekening af niet bevoegd zijn de vergunning over te dragen. Dit verbod
      houdt op, wanneer op een door den houder der vergunning ingediend verzoekschrift door het Hof is beslist, dat hij
      aan de in art. 5 der Mijnwet BES gestelde vereischten voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel17
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '16'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '17'
        hoofdstuk: I
  - number: '253.1'
    text: |-
      Van de beteekening bedoeld in [art. 27][ref1] tot het verstrijken van den termijn aangegeven in [art. 243][ref2]
      of, ingeval een verzoekschrift, als in laatstgenoemd artikel bedoeld, is ingediend, tot de beslissing van het Hof
      aan den houder van het recht op concessie of aan den concessionaris zal zijn medegedeeld, of beteekend, mogen de in
      [art. 88][ref3] bedoelde werkzaamheden of de ontginning worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0028574#Artikel88
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '27'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '243'
        hoofdstuk: Eenig
      - id: ref3
        bwb_id: BWBR0028574
        artikel: '88'
        hoofdstuk: IV
        afdeling: 4e
  - number: '253.2'
    text: |-
      De houder van het recht op concessie of de concessionaris zal echter van eerstbedoelde beteekening af niet bevoegd
      zijn het recht op concessie over te dragen of het op grond van de concessie verworven recht te vervreemden of met
      hypotheek te belasten. Dit verbod houdt op, wanneer op een door den houder van het recht op concessie of door den
      concessionaris ingediend verzoekschrift door het Gemeenschappelijk Hof van Justitie is beslist, dat hij aan de in
      art. 5 der Mijnwet BES gestelde vereischten voldoet.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel253
  - number: '254'
    text: |-
      In geval Onze Minister het voornemen heeft gebruik te maken van de hem in art. 7 lid 1 der Mijnwet BES gegeven
      bevoegdheid om een concessionaris van de hem bij de concessie verleende rechten vervallen te verklaren, wordt dit
      aan den concessionaris of zijn gemachtigde te kennen gegeven bij een met redenen omkleede beschikking, die van
      rijksoverheidswege aan den belanghebbende bij deurwaardersexploit wordt beteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel254
  - number: '255'
    text: |-
      De beschikking waarbij een concessionaris van de hem bij zijne concessie verleende rechten wordt vervallen
      verklaard, wordt genomen na den Raad van Bestuur daarop te hebben gehoord; zij wordt met redenen omkleed en van
      rijksoverheidswege aan den belanghebbende bij deurwaardersexploit beteekend.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel255
  - number: '256.1'
    text: |-
      De concessionaris, die intrekking zijner concessie verlangt, richt zich daartoe tot Onze Minister bij schriftelijk
      verzoek, dat op kosten en door de zorg van den concessionaris aan de belanghebbende hypotheekhouders, zoo deze er
      zijn, bij eene bij deurwaardersexploit beteekende akte medegedeeld en openbaar gemaakt in de Staatscourant en een
      ander dag-, nieuws-, of huis-aan-huisblad.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel256
  - number: '256.2'
    text: |-
      Ingeval de concessie reeds in de openbare registers is ingeschreven, moet het verzoekschrift vergezeld gaan
      van eene verklaring van den betrokken hypotheekbewaarder, houdende opgave van de namen van hen, die blijkens
      de openbare registers bekend staan als houder der betrokken concessie en als hypothecaire schuldeischer of
      schuldeischers.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel256
  - number: '257'
    text: |-
      Van af de beteekening bedoeld in het [eerste lid van art. 256][ref1], is de concessionaris niet bevoegd de
      concessie te vervreemden of met hypotheek te belasten.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel256
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '256'
  - number: '258.1'
    text: |-
      Ieder belanghebbend schuldeischer is bevoegd, binnen drie maanden na de in het [eerste lid van art. 256][ref1]
      voorgeschreven beteekening en openbaarmaking van het verzoekschrift van den concessionaris, zich te wenden tot
      het Gemeenschappelijk Hof van Justitie met het verzoek om, na alle betrokken partijen in de gelegenheid te hebben
      gesteld, om voor hare belangen op te komen, te bevelen, dat de concessie, met inbegrip van de mijnwerken en van
      hetgeen tot verzekering en bekleeding daarvan dient, op zijne kosten, binnen een door het Hof bepaalde termijn, in
      het openbaar en overeenkomstig de bepalingen van het Wetboek van Burgerlijke Rechtsvordering BES worde verkocht,
      ten einde uit de opbrengst het beloop zijner schuldvordering met de renten en kosten te verhalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel256
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '256'
  - number: '258.2'
    text: |-
      De beschikking van het Gemeenschappelijk Hof van Justitie, waarbij de openbare verkooping der concessie is bevolen,
      moet aan den concessionaris bij deurwaardersexploit worden beteekend. Het exploit van de verrichte beteekening
      geldt als executoriaal beslag.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: '258.3'
    text: |-
      De openbare verkooping der concessie geschiedt overeenkomstig de bepalingen van het Wetboek van Burgerlijke
      Rechtsvordering BES in het bijzonder die betreffende de gerechtelijke uitwinning van onroerende goederen en andere
      daarmede verband houdende bepalingen van dat wetboek, voor zoover die bepalingen hier toepassing kunnen vinden en
      met dien verstande, dat in die bepalingen:
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: 258.3.a
    text: |-
      voor «de of den executant», «de of den beslaglegger» en «den arrestant» wordt gelezen : «hij of hem op wiens
      verzoek door den rechter de openbare verkooping der concessie is bevolen»;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: 258.3.b
    text: |-
      voor «den persoon of de partij tegen wien of tegen welke het beslag gedaan is» en «de partij, welker goederen zijn
      in beslag genomen» wordt gelezen: «den concessionaris die intrekking zijner concessie heeft verzocht»;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: 258.3.c
    text: |-
      voor «in beslag genomen goederen» wordt gelezen: «concessie met inbegrip van de mijnwerken en van hetgeen tot
      verzekering en bekleeding daarvan dient»;
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: 258.3.d
    text: 'voor «de geëxecuteerde» wordt gelezen: «de concessionaris wiens concessie verkocht is»;'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: 258.3.e
    text: 'voor ,«executie» wordt gelezen: «verkooping».'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: '258.4'
    text: |-
      Indien geen verzoek tot openbare verkoop bij het Gemeenschappelijk Hof van Justitie is ingediend, geeft de Griffier
      van dat college eene desbetreffende verklaring aan den concessionaris af, welke aan Onze Minister zal worden
      overgelegd, met de relazen, waaruit van eene behoorlijke beteekening van het verzoek aan de hypotheekhouders
      blijkt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel258
  - number: '259.1'
    text: |-
      Nadat de concessionaris, die intrekking zijner concessie heeft verzocht, de in het [4e lid van art. 258][ref1]
      bedoelde verklaring van den Griffier van het Gemeenschappelijk Hof van Justitie en relazen aan Onze Minister heeft
      ingediend en indien wel een openbare verkooping heeft plaats gehad, maar deze tot geen resultaat heeft geleid,
      wordt tot intrekking van de concessie overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel258
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel259
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '258'
  - number: '259.2'
    text: |-
      Ingeval de indiening van de in het eerste lid van dit artikel genoemde verklaring en relazen niet binnen een jaar
      na de dagteekening van het verzoek om intrekking der concessie heeft plaats gehad, wordt dat verzoek als vervallen
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel259
  - number: '259.3'
    text: |-
      Van de beschikking, waarbij de concessie op verzoek wordt ingetrokken, wordt ten spoedigste een afschrift
      toegezonden aan den betrokken hypotheekbewaarder.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel259
  - number: '259.4'
    text: |-
      De bewaarder houdt vervolgens aanteekening daarvan in het dagregister en terzijde van de overschrijving van de
      akte van concessie en zoo de concessie met hypotheek is belast, ook terzijde van de inschrijving van het borderel
      betreffende de vestiging der bedoelde hypotheek.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel259
  - number: '259.5'
    text: De beschikking wordt van wege Onze Minister in de Staatscourant, volledig openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel259
  - number: '259.6'
    text: |-
      De concessionaris, wiens concessie op eigen verzoek is ingetrokken, moet de ontginning onmiddellijk staken of doen
      staken. Wordt in strijd hiermede gehandeld, dan is de politie bevoegd de voortzetting der werkzaam- heden of der
      ontginning te beletten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel259
  - number: '260'
    text: |-
      Ingeval de concessie, ingevolge de bepaling van het [eerste lid van art. 258][ref1] in het openbaar is verkocht,
      moet de concessionaris, die intrekking zijner concessie heeft verzocht, de concessie met inbegrip van de mijnwerken
      en van hetgeen tot verzekering of bekleeding daarvan dient, aan den nieuwen concessionaris overgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel258
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '258'
  - number: '261.1'
    text: |-
      Wanneer een houder van het recht op concessie of een concessionaris naar het oordeel van Onze Minister heeft
      opgehouden aan de in art. 5 der Mijnwet BES gestelde eischen te voldoen en de termijn, bedoeld bij [art. 243][ref1]
      is verstreken, zonder dat de beslissing van het Gemeenschappelijk Hof van Justitie is ingeroepen, of, zoo dit wel
      het geval is geweest, het Hof in den zelfden zin als Onze Minister heeft beslist, wordt door Onze Minister bij een
      met redenen omkleede beschikking aangeteekend, dat en van welk tijdstip af het recht op concessie of de concessie,
      ingevolge art. 6 sub a der Mijnwet BES, van rechtswege is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel243
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel261
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '243'
        hoofdstuk: Eenig
  - number: '261.2'
    text: |-
      Op de zelfde wijze wordt gehandeld wanneer het recht op concessie of de concessie, ingevolge art 6 sub b der
      Mijnwet BES, van rechtswege is vervallen ten aanzien van die rechtverkrijgenden van een overleden houder van het
      recht op concessie of van een overleden concessionaris, die naar het oordeel van Onze Minister – en, ingeval van
      geschil, volgens de beslissing van het Hof – niet binnen den in art. 5 der Mijnwet BES genoemden termijn aan de in
      dat artikel gestelde vereischten hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel261
  - number: '261.3'
    text: |-
      De in het eerste en tweede lid van dit artikel bedoelde beschikking wordt ten spoedigste door Onze Minister aan den
      belanghebbende bij eene bij deurwaardersexploit beteekende akte medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel261
  - number: '261.4'
    text: De beschikking wordt in de Staatscourant en in de Staatscourant, bij uittreksel aangekondigd.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel261
  - number: '262.1'
    text: |-
      De houder van het recht op concessie, wiens recht, of de concessionaris, wiens concessie ingevolge art.
      6 sub a der Mijnwet BES van rechtswege is vervallen, moet, zoodra zijne bevoegdheid om, krachtens het
      [eerste lid van art. 253][ref1], de in [art. 88][ref2] bedoelde werkzaamheden, of de ontginning voort te zetten
      heeft opgehouden, deze onmiddellijk staken of doen staken.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel253
      [ref2]: https://wetten.overheid.nl/BWBR0028574#Artikel88
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '253'
        hoofdstuk: Eenig
      - id: ref2
        bwb_id: BWBR0028574
        artikel: '88'
        hoofdstuk: IV
        afdeling: 4e
  - number: '262.2'
    text: |-
      Het zelfde geldt voor rechtverkrijgenden van een overleden houder van het recht op concessie of van een overleden
      concessionaris, te wier aanzien het recht op concessie of de concessie ingevolge art. 6 sub b der Mijnwet BES van
      rechtswege is vervallen.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel262
  - number: '262.3'
    text: |-
      De politie is bevoegd de voortzetting der werkzaamheden of der ontginning in strijd met het bepaalde bij dit
      artikel, te beletten.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel262
  - number: '263.1'
    text: |-
      Wanneer een concessie van rechtswege is vervallen, zal de betrokken bewaarder der hypotheken daarvan aanteekening
      houden in het dagregister en ter zijde van de overschrijving van de akte van concessie en, zoo de concessie met
      hypotheek is belast, ook ter zijde van de inschrijving van het borderel betreffende de vestiging der bedoelde
      hypotheek.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel263
  - number: '263.2'
    text: |-
      Tot het stellen van bovenbedoelde aanteekeningen zal door Onze Minister aan den in het eerste lid van dit artikel
      bedoelden bewaarder een afschrift van de in [artikel 261][ref1] bedoelde beschikking worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028574#Artikel261
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0028574
        artikel: '261'
  - number: '264'
    text: |-
      In dit besluit wordt verstaan onder vertegenwoordiger van den vergunninghouder of van den concessionaris, de door
      den niet in Bonaire, Sint Eustatius en Saba gevestigden vergunninghouder of concessionaris, ingevolge het bepaalde
      bij het eerste lid van art. 5 der Mijnwet BES aangestelde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel264
  - number: '265'
    text: |-
      Behoudens het bepaalde betreffende de betaling van vast recht en de deswege verschuldigde boeten en kosten, moeten,
      wanneer de vergunninghouder of de concessionaris niet in Bonaire, Sint Eustatius en Saba is gevestigd, de voor hen
      geldende voorschriften der Mijnwet BES en van dit besluit worden nagekomen door hunne vertegenwoordigers aldaar,
      blijvende niettemin, in geval van verzuim of nalatigheid van den vertegenwoordiger, de vergunninghouder of de
      concessionaris, bepaaldelijk ook voor zooveel betreft de geldelijke gevolgen, voor die nakoming aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel265
  - number: '266.1'
    text: |-
      Wanneer de hetzij in Bonaire, Sint Eustatius en Saba hetzij niet aldaar gevestigde vergunninghouder of
      concessionaris dan wel hun vertegenwoordiger is eene naamlooze vennootschap dan rust de verplichting tot nakoming
      van de voorschriften der Mijnwet BES en van dit besluit op elk der bestuurders persoonlijk, zijnde echter de
      naamlooze vennootschap zelve alleen aansprakelijk voor de betaling van het vast recht, de deswege verschuldigde
      boeten en kosten zoomede voor de overige geldelijke gevolgen van de niet nakoming der genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel266
  - number: '266.2'
    text: |-
      Is het bestuur dier naamlooze vennootschap opgedragen aan eene andere naamlooze vennootschap, dan is het bepaalde
      bij het eerste lid van dit artikel van toepassing op de bestuurders der besturende naamlooze vennootschap.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel266
  - number: '267.1'
    text: |-
      Voor zoover in de Mijnwet BES en dit besluit niet anders is bepaald, komen de daarin voorgeschreven gerechtelijke
      beteekeningen ten laste ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel267
  - number: '267.2'
    text: |-
      Wanneer de gerechtelijke beteekening is geschied aan het gekozen domicilie, wordt daarvan door den
      Procureurgeneraal bij aangeteekenden dienstbrief kennis gegeven aan den belanghebbende, indien zijn woonplaats of
      verblijf bekend is. De kennisgeving geschiedt ten koste van den belanghebbende.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel267
  - number: '268.1'
    text: 'Dit besluit wordt aangehaald als: Mijnbesluit BES.'
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel268
  - number: '268.2'
    text: |-
      De Mijnwet BES en dit besluit treden in werking drie maanden na den dag der uitgifte van het Publicatieblad, waarin
      dit besluit geplaatst is.
    url: https://wetten.overheid.nl/BWBR0028574/2010-10-10#Artikel268
