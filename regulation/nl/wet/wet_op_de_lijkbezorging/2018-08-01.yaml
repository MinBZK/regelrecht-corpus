        artikel: '31'
        hoofdstuk: III
        paragraaf: '1'
  - number: '86.1'
    text: |-
      De raden der gemeenten, op welke een verplichting rust tot betaling van een jaarlijkse schadeloosstelling
      in verband met het niet meer plaats vinden van begravingen in kerken of andere gesloten gebouwen, hebben het
      recht deze verplichting af te kopen tegen betaling van een som, die het twintigvoudige van het bedrag dier
      schadeloosstelling beloopt.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel86
  - number: '86.2'
    text: |-
      Indien de rechthebbende op de afkoopsom weigert deze te aanvaarden of onbekend dan wel afwezig is, kunnen
      burgemeester en wethouders de afkoopsom doen opnemen in de Consignatiekas.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel86
  - number: '87.1'
    text: Deze wet is niet van toepassing op de lijkbezorging van leden van het Koninklijk Huis.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel87
  - number: '87.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan ten aanzien van andere bloed- en aanverwanten van
      de Koning ontheffing verlenen van bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel87
  - number: '88'
    text: |-
      Een besluit waartegen ingevolge deze wet beroep openstaat of aanhangig is treedt, zolang dit het geval is, niet in
      werking, onverminderd het bepaalde in [artikel 31, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel31
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '31'
        hoofdstuk: III
        paragraaf: '1'
  - number: '89'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de termijnen, gesteld in de [artikelen 20][ref2] en
      [68, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel68
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '68'
        hoofdstuk: V
  - number: '90'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp, waarin deze wet
      voorziet, gehandhaafd, voor zover die verordeningen niet met deze wet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel90
  - number: '94'
    text: De Wet op de lijkbezorging (Wet van 10 april 1869, *Stb.* 65) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel94
  - number: '95'
    text: 'Deze wet kan worden aangehaald onder de titel: Wet op de lijkbezorging.'
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel95
  - number: '96'
    text: Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel96
