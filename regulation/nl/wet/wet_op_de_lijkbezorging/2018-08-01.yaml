        bwb_id: BWBR0005009
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '26'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '27'
        hoofdstuk: III
        paragraaf: '1'
