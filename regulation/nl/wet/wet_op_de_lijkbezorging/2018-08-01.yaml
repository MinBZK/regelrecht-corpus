        artikel: '63'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '66'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 80.6°
    text: |-
      overtreding van een verbod als bedoeld in [artikel 76, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel76
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '76'
        hoofdstuk: VI
  - number: 80.7°
    text: |-
      het verrichten van sectie of het verwijderen van delen uit een lijk in strijd met het bepaalde bij
      de[ artikelen 72-75][ref1] en [76, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel76
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '72'
