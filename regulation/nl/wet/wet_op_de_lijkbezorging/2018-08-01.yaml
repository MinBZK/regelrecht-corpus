      [ref11]: https://wetten.overheid.nl/BWBR0005009#Artikel71
      [ref12]: https://wetten.overheid.nl/BWBR0005009#Artikel76
      [ref13]: https://wetten.overheid.nl/BWBR0005009#Artikel78
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel80
