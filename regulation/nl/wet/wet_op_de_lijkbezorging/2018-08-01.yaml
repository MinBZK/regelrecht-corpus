      - id: ref3
        bwb_id: BWBR0005009
        artikel: '69'
        hoofdstuk: V
  - number: 80.4°
    text: |-
      overtreding van [artikel 58][ref1], [59][ref2] of [60][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel60
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel80
    references:
