        paragraaf: '1'
        afdeling: '3'
  - number: 80.5°
    text: |-
      het verwijderen of ruimen van een asbus in strijd met de[ artikelen 63][ref1] of [66][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel66
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel80
    references:
      - id: ref1
