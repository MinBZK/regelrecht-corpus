      - id: ref13
        bwb_id: BWBR0005009
        artikel: '78'
        hoofdstuk: VI
  - number: 80.2°
    text: |-
      het geven van verlof tot begraving of crematie in strijd met de[ artikelen 12][ref1] en [76, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel76
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '76'
        hoofdstuk: VI
  - number: 80.3°
    text: |-
      het begraven, cremeren, ontleden, balsemen of op andere wijze conserverend behandelen van een lijk voordat
      dit ingevolge het bij of krachtens de[ artikelen 16][ref1], [17][ref2] of [69, eerste lid][ref3], bepaalde is
      toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel69
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel80
