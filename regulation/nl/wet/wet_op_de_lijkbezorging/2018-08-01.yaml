  - number: '82'
    text: De ingevolge deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel82
  - number: '83.1'
    text: |-
      De bij de inwerkingtreding van deze wet in gebruik zijnde begraafplaatsen en crematoria worden geacht te zijn
      aangelegd en opengesteld onderscheidenlijk gevestigd en in werking gesteld te zijn overeenkomstig de bepalingen
      van deze wet. Een op dat tijdstip reeds verleend verlof tot vestiging, uitbreiding of wijziging van een crematorium
      wordt geacht ingevolge [artikel 53][ref1] te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel53
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '53'
        hoofdstuk: IV
        afdeling: '2'
  - number: '83.2'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet geldende ontheffingen, verleend op grond van artikel 13,
      eerste lid, van de Wet op de lijkbezorging (Wet van 10 april 1869. *Stb.* 65), worden geacht te zijn verleend
      overeenkomstig [artikel 33][ref1], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel33
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: '83.3'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet geldende gemeentelijke verordeningen tot heffing van rechten
      als bedoeld in de artikelen 20, 21, 29*o* en 30-35 van de Wet op de lijkbezorging (Wet van 10 april 1869, *Stb.*
      65), worden geacht te zijn vastgesteld krachtens [artikel 229 van de Gemeentewet][ref1] (*Stb.* 1992, 96).


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: '84'
    text: |-
      Het recht op een eigen graf, verleend vóór het in werking treden van deze wet, wordt geacht een uitsluitend recht
      op een graf in de zin van [artikel 28][ref1] te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel28
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '28'
        hoofdstuk: III
        paragraaf: '1'
  - number: 84a
    text: |-
      Indien ten aanzien van een graf waarop voor 1 januari 2010 een uitsluitend recht is gevestigd, voor 1 januari 2025
      een verklaring van verwaarlozing als bedoeld in [artikel 28, vierde lid][ref1], is opgesteld, vervalt het recht, in
      afwijking van artikel 28, zesde lid,


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel28
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '28'
        hoofdstuk: III
        paragraaf: '1'
  - number: 84a.a
    text: |-
      met ingang van 1 januari 2030, mits op dat tijdstip dertig jaar is verstreken sinds de laatste begraving in dat
      graf dan wel
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel84a
  - number: 84a.b
    text: op een later gelegen tijdstip waarop dertig jaar is verstreken sinds de laatste begraving in dat graf.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel84a
  - number: 84b
    text: |-
      Indien een graf op het tijdstip van inwerkingtreding van dit artikel niet ingevolge deze wet mag worden
      geruimd, gaat op dat tijdstip hetgeen op dat graf is geplaatst, of het gebouw of werk waarin het graf zich
      bevindt, dan wel, indien is begraven in een grafkelder, hetgeen daarin of daarop is geplaatst, en door
      toepassing van [artikel 20, eerste lid, aanhef en onder e en f, van Boek 5 van het Burgerlijk Wetboek][ref1]
      voor de oorspronkelijke rechthebbende verloren is gegaan, over op die oorspronkelijk rechthebbende of diens
      rechtverkrijgenden onder algemene titel, en is vanaf dat tijdstip [artikel 32a][ref2] daarop van toepassing. Er
      ontstaat geen verplichting tot vergoeding van enig door deze overgang veroorzaakt vermogensrechtelijk nadeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel32a
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: 32a
        hoofdstuk: III
        paragraaf: '1'
  - number: '85.1'
    text: |-
      In graven of grafkelders als bedoeld in artikel 15 van de Wet op de lijkbezorging (Wet van 10 april 1869, *Stb.*
      65) kunnen het lijk van degene, die daarvan eigenaar is ten tijde van de inwerkingtreding van deze wet en de
      lijken van de leden van zijn geslacht worden begraven. In of op zodanige graven en in zodanige grafkelders kunnen
      asbussen, waarin de as van lijken bedoeld in de eerste volzin is geborgen, worden bijgezet.
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel85
  - number: '85.2'
    text: |-
      Op de in het eerste lid bedoelde graven en grafkelders zijn van [Hoofdstuk III][ref1] toepasselijk
      de[ artikelen 26][ref2], [27][ref3], [29][ref4], [30][ref5] en [31][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005009#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0005009#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0005009#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0005009#Artikel31
    url: https://wetten.overheid.nl/BWBR0005009/2018-08-01#Artikel85
    references:
