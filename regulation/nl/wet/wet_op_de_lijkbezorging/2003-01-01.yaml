$id: wet_op_de_lijkbezorging
regulatory_layer: WET
publication_date: '2025-08-12'
valid_from: '2003-01-01'
bwb_id: BWBR0005009
url: https://wetten.overheid.nl/BWBR0005009/2003-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe wettelijke bepalingen inzake de lijkbezorging
    vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: Lijkbezorging geschiedt door begraving, verbranding of op andere bij of krachtens de wet voorziene wijze.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel1
  - number: '2.1'
    text: Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel2
  - number: 2.1.a
    text: 'lijk: het stoffelijk overschot van een overledene of doodgeborene;'
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel2
  - number: 2.1.b
    text: |-
      doodgeborene: de na een zwangerschapsduur van ten minste vier en twintig weken ter wereld gekomen menselijke
      vrucht, welke na de geboorte geen enkel teken van levensverrichting heeft vertoond.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel2
  - number: '2.2'
    text: |-
      De bepalingen dezer wet zijn niet van toepassing op een na een zwangerschapsduur van minder dan vier en twintig
      weken ter wereld gekomen menselijke vrucht.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel2
  - number: '3'
    text: Lijkschouwing geschiedt door de behandelende arts of door een gemeentelijke lijkschouwer.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel3
  - number: '4'
    text: |-
      Burgemeester en wethouders verschaffen gelegenheid tot het doen schouwen van lijken. Zij benoemen een of meer
      gemeentelijke lijkschouwers.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel4
  - number: '5'
    text: De gemeentelijke lijkschouwers dienen bevoegd te zijn de titel van arts te voeren.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel5
  - number: '6.1'
    text: |-
      Een gemeentelijke lijkschouwer treedt niet als zodanig op, indien hij gedurende de laatste twee jaar ten aanzien
      van de overledene of de moeder van de doodgeborene handelingen op het gebied van de geneeskunst heeft verricht
      en indien tussen dezen en hem bloed- of aanverwantschap tot in de derde graad, een huwelijk of een geregistreerd
      partnerschap bestond of bestaat.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel6
  - number: '6.2'
    text: |-
      De behandelende arts treedt niet op als lijkschouwer indien tussen hem en de overledene of de moeder van de
      doodgeborene bloed- of aanverwantschap tot in de derde graad, een huwelijk of een geregistreerd partnerschap
      bestond of bestaat.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel6
  - number: '7.1'
    text: |-
      Hij die de schouwing heeft verricht geeft een verklaring van overlijden af, indien hij ervan overtuigd is dat de
      dood is ingetreden ten gevolge van een natuurlijke oorzaak.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien het overlijden het gevolg was van de toepassing van levensbeëindiging op verzoek
      of hulp bij zelfdoding als bedoeld in [artikel 293, tweede][ref1], onderscheidenlijk
      [artikel 294, tweede lid, tweede volzin, van het Wetboek van Strafrecht][ref2], geeft de behandelende arts
      geen verklaring van overlijden af en doet hij van de oorzaak van dit overlijden onverwijld door invulling
      van een formulier mededeling aan de gemeentelijke lijkschouwer of een der gemeentelijke lijkschouwers. Bij de
      mededeling voegt de arts een beredeneerd verslag inzake de inachtneming van de zorgvuldigheidseisen, bedoeld in
      [artikel 2 van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel293
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel294
      [ref3]: https://wetten.overheid.nl/BWBR0012410#Artikel2
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '293'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '294'
      - id: ref3
        bwb_id: BWBR0012410
        artikel: '2'
  - number: '7.3'
    text: |-
      Indien de behandelende arts in andere gevallen dan die bedoeld in het tweede lid meent niet tot afgifte van
      een verklaring van overlijden te kunnen overgaan, doet hij hiervan onverwijld door invulling van een formulier
      mededeling aan de gemeentelijke lijkschouwer of een der gemeentelijke lijkschouwers.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel7
  - number: '8.1'
    text: Op de kist of op het andere omhulsel van het lijk wordt een registratienummer vermeld.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel8
  - number: '8.2'
    text: |-
      Tot begraving of verbranding wordt niet overgegaan dan nadat de houder van de begraafplaats of van het crematorium
      de identiteit van het lijk heeft vastgesteld door vergelijking van het op de kist of het omhulsel vermelde
      registratienummer met dat, vermeld op een bijgevoegd document dat tevens de namen, overlijdens- en geboortedata van
      de overledene dan wel de geslachtsnaam van de doodgeborene bevat.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de identiteit niet genoegzaam blijkt, vindt zo mogelijk de identificatie van het lijk plaats door twee
      personen die de overledene bij het leven hebben gekend, in tegenwoordigheid van de houder van de begraafplaats of
      het crematorium.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel8
  - number: '9.1'
    text: |-
      De vorm en de inrichting van de modellen van de verklaring van overlijden, af te geven door de behandelende arts en
      door de gemeentelijke lijkschouwer, worden geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel9
  - number: '9.2'
    text: |-
      De vorm en de inrichting van de modellen van de mededeling en het verslag, bedoeld in
      [artikel 7, tweede lid][ref1], van de mededeling bedoeld in [artikel 7, derde lid][ref2] en van de formulieren
      bedoeld in [artikel 10, eerste en tweede lid][ref3], worden geregeld bij algemene maatregel van bestuur op
      voordracht van Onze Minister van Justitie en Onze Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel10
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10.1'
    text: |-
      Indien de gemeentelijke lijkschouwer meent niet tot afgifte van een verklaring van overlijden te kunnen overgaan,
      brengt hij door invulling van een formulier onverwijld verslag uit aan de officier van justitie en waarschuwt hij
      onverwijld de ambtenaar van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel10
  - number: '10.2'
    text: |-
      Onverminderd het eerste lid brengt de gemeentelijke lijkschouwer, indien sprake is
      van een mededeling als bedoeld in [artikel 7, tweede lid][ref1], door invulling van
      een formulier onverwijld verslag uit aan de regionale toetsingscommissie bedoeld in
      [artikel 3 van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref2]. Hij zendt het
      beredeneerd verslag als bedoeld in [artikel 7, tweede lid][ref3], mee.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012410#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel7
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012410
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11'
    text: |-
      Geen begraving of verbranding van een lijk geschiedt zonder schriftelijk verlof van de ambtenaar van de burgerlijke
      stand, dat kosteloos wordt afgegeven. Het formulier voor dit verlof wordt door Onze Minister van Binnenlandse Zaken
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel11
  - number: '12'
    text: |-
      Verlof tot begraving of tot verbranding wordt niet verleend, zolang niet is overgelegd een verklaring
      van overlijden, afgegeven door de behandelende arts of een gemeentelijke lijkschouwer, dan wel een
      verklaring waaruit blijkt van geen bezwaar van de officier van justitie tegen begraving of verbranding.
      Indien de officier van justitie in de gevallen als bedoeld in [artikel 7, tweede lid][ref1], meent
      niet tot de afgifte van een verklaring van geen bezwaar tegen begraving of verbranding te kunnen
      overgaan, stelt hij de gemeentelijke lijkschouwer en de regionale toetsingscommissie bedoeld in
      [artikel 3 van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref2], hiervan onverwijld
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012410#Artikel3
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012410
        artikel: '3'
  - number: 12a.1
    text: |-
      Tegelijk met de afgifte der verklaring van overlijden, bedoeld in [artikel 12][ref1], doet de arts opgave van de
      doodsoorzaak en van de onmiddellijk daarmee samenhangende gegevens ten behoeve van de statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel12
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 12a.2
    text: |-
      Indien een lijk wordt begraven, verbrand, ontleed, gebalsemd of aan een andere conserverende bewerking wordt
      onderworpen krachtens een verklaring van geen bezwaar als bedoeld in [artikel 12][ref1], wordt de opgave gedaan
      door een arts, aangewezen door de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel12
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 12a.3
    text: |-
      De opgave, bedoeld in het eerste en tweede lid, geschiedt op een door Onze Minister van Welzijn, Volksgezondheid en
      Cultuur vast te stellen formulier en wordt zo spoedig mogelijk in een gesloten enveloppe gezonden aan de ambtenaar
      van de burgerlijke stand. Aan deze enveloppe is een strook bevestigd, welke de identiteit van de overledene
      vermeldt. De ambtenaar van de burgerlijke stand zendt de enveloppe ongeopend, voor zover mogelijk voorzien van
      het nummer van de overlijdensakte, onder achterhouding van de strook met inachtneming van door Onze in dit lid
      genoemde Minister te stellen termijnen, aan de geneeskundige hoofdinspecteur van de volksgezondheid. Onze in dit
      lid genoemde Minister kan bepalen dat deze enveloppen rechtstreeks zullen worden gezonden aan de medisch ambtenaar
      van het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel12a
  - number: '13.1'
    text: |-
      De ingevolge [artikel 12][ref1] overgelegde stukken worden bij de akte van overlijden gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel12
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Bij gebreke van een akte worden de overgelegde stukken bewaard door de ambtenaar van de burgerlijke stand van de
      plaats van begraving of verbranding.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel13
  - number: '14.1'
    text: |-
      Voor de toepassing van dit hoofdstuk worden als bevoegde officier van justitie en als bevoegde ambtenaar van de
      burgerlijke stand aangemerkt die van de plaats, waar betreffende de overledene of doodgeborene ingevolge aangifte
      een akte in het register van overlijden is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij gebreke van een akte zijn bevoegd de officier van justitie en de ambtenaar van de burgerlijke stand van de
      plaats van begraving of verbranding.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel14
  - number: '15'
    text: |-
      Wij kunnen bij algemene maatregel van bestuur afwijkingen toestaan van het bepaalde in de
      [paragrafen 1][ref1],[ 2][ref2] en [3 van dit hoofdstuk][ref3] ten aanzien van lijken, die Nederland worden
      binnengebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005009#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005009#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005009
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005009
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005009
        hoofdstuk: II
        paragraaf: '3'
  - number: '16'
    text: |-
      Begraving of verbranding geschiedt niet eerder dan 36 uren na het overlijden en uiterlijk op de vijfde dag na die
      van het overlijden.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel16
  - number: '17.1'
    text: |-
      Na een arts te hebben gehoord kan de burgemeester der gemeente, waar het lijk zich bevindt, voor de begraving of
      verbranding daarvan een andere termijn stellen. Begraving of verbranding binnen 36 uur na het overlijden staat hij
      echter niet toe dan in overeenstemming met de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel17
  - number: '17.2'
    text: |-
      Van het besluit van de burgemeester staat binnen 24 uur beroep open op Onze Commissaris in de provincie, die daarop
      onmiddellijk beslist. De [Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '18.1'
    text: |-
      In de lijkbezorging wordt voorzien door degene, die het in [artikel 11][ref1] bedoelde verlof aanvraagt, dan wel
      door degene, die redelijkerwijze geacht kan worden in diens plaats te zijn getreden. De lijkbezorging geschiedt
      overeenkomstig de wens of de vermoedelijke wens van de overledene, tenzij dat redelijkerwijs niet gevergd kan
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel11
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Onder lijkbezorging wordt voor de toepassing van deze paragraaf begrepen het geven van bestemming aan de as van een
      verbrand lijk.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel18
  - number: '19.1'
    text: |-
      Een meerderjarige, of hij, die de leeftijd van zestien jaar heeft bereikt, kan, ook indien hij niet bekwaam is
      een uiterste wil te maken, hetzij bij notariële akte, hetzij bij een eigenhandig geschreven, gedagtekende en
      ondertekende verklaring beschikkingen na dode maken ter bezorging van zijn lijk.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel19
  - number: '19.2'
    text: |-
      Een in algemene bewoordingen gestelde herroeping van uiterste wilsbeschikkingen wordt geacht geen herroeping in te
      houden van een vroeger te kennen gegeven wens, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel19
  - number: '20'
    text: |-
      Ingeval niemand maatregelen neemt tot lijkschouwing of lijkbezorging overeenkomstig de wet, waarschuwt degene, die
      het lijk onder zijn berusting heeft, de burgemeester en wel uiterlijk op de derde dag na het overlijden.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel20
  - number: '21.1'
    text: |-
      Indien niemand voorziet in de lijkschouwing en lijkbezorging overeenkomstig de wet, draagt de burgemeester
      daarvoor zorg. Aan [hoofdstuk V][ref1] wordt in dat geval geen toepassing gegeven, tenzij de overledene zijn lijk
      uitdrukkelijk tot ontleding heeft bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005009
        hoofdstuk: V
  - number: '21.2'
    text: |-
      Indien de toepassing van het voorgaand lid wordt verhinderd, doordat het lijk zich in een woning bevindt en de
      afgifte van het lijk of de toegang tot de woning wordt geweigerd, heeft de burgemeester of een ambtenaar van
      politie toegang tot die woning zonder toestemming van de bewoner, voor zover dat redelijkerwijs voor de vervulling
      van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel21
  - number: '22'
    text: |-
      De kosten, verbonden aan de bezorging van lijken waarvoor de burgemeester zorg draagt, daaronder begrepen
      lijken die uit zee worden aangebracht, komen ten laste van de gemeente. Voor zover zij door de bij de
      lijken gevonden, niet klaarblijkelijk aan anderen toebehorende goederen of gelden niet kunnen worden
      gedekt, kan de gemeente die kosten verhalen op de nalatenschap en, bij ongenoegzaamheid van deze, op de
      bloed- en aanverwanten, die krachtens de [artikelen 392-396 van Boek I van het Burgerlijk Wetboek][ref1]
      tot onderhoud van de overledene verplicht zouden zijn geweest, dan wel de reder indien en voor zover kosten
      van de lijkbezorging op grond van [artikel 416 Wetboek van Koophandel][ref2] voor diens rekening komen.
      [Hoofdstuk VII van de Algemene bijstandswet][ref3] is voor zover mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel416
      [ref3]: https://wetten.overheid.nl/BWBR0007333#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '416'
      - id: ref3
        bwb_id: BWBR0007333
        hoofdstuk: VII
  - number: '23'
    text: Begraving geschiedt op een begraafplaats.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel23
  - number: '24'
    text: De begraafplaatsen worden onderscheiden in gemeentelijke en bijzondere.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel24
  - number: '25'
    text: |-
      Het is verboden een begraafplaats, die niet op de voet van het bepaalde bij of krachtens deze wet is aangelegd of
      in gebruik genomen, als zodanig ter beschikking te stellen of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel25
  - number: '26'
    text: |-
      Geen toegang of ingang van een graf of grafkelder mag zich bevinden of worden aangelegd in een kerk of een ander
      gesloten gebouw, dat niet uitsluitend tot begraven bestemd is.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel26
  - number: '27.1'
    text: |-
      De houder van een begraafplaats houdt een register van alle daar begraven lijken, met een nauwkeurige aanduiding
      van de plaats waar zij begraven zijn.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel27
  - number: '27.2'
    text: Het in het eerste lid bedoelde register is openbaar.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel27
  - number: '27.3'
    text: |-
      Het register van een bijzondere begraafplaats wordt bij opheffing van die begraafplaats overgebracht naar het
      archief van de gemeente waarin die begraafplaats was gelegen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel27
  - number: '28.1'
    text: |-
      Een uitsluitend recht op een graf, welke vorm aan dit recht ook wordt gegeven, kan uitsluitend schriftelijk
      worden gevestigd. Het recht kan voor onbepaalde tijd of voor een bepaalde tijd van tenminste twintig jaren
      worden verleend. Het voor bepaalde tijd verleende recht wordt op verzoek, mits gedaan binnen twee jaren voor het
      verstrijken van de termijn, verlengd, doch telkens voor niet langer dan tien jaren. Het uitsluitend recht op een
      graf is geen registergoed.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel28
  - number: '28.2'
    text: |-
      Binnen een jaar na de aanvang van de termijn waarin verlenging van het recht kan worden verzocht doet de houder
      van de begraafplaats aan de rechthebbende wiens adres hem bekend is of redelijkerwijs bekend kan zijn, schriftelijk
      mededeling van het verstrijken van de termijn en van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel28
  - number: '28.3'
    text: |-
      Blijkt het adres onbekend, dan geschiedt de mededeling door aanplakking daarvan bij het graf en de ingang van de
      begraafplaats. De mededeling blijft aangeplakt tot het einde van de termijn waarvoor het uitsluitend recht op een
      graf werd gevestigd.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel28
  - number: '28.4'
    text: |-
      In geval van kennelijke verwaarlozing van het onderhoud van een graf, waarop een uitsluitend recht berust, voor
      zover dit onderhoud niet op de houder van de begraafplaats berust, kan deze verwaarlozing worden geconstateerd bij
      een schriftelijke verklaring van de houder van de begraafplaats, die hij toezendt aan de rechthebbende wiens adres
      hem bekend is of redelijkerwijs bekend kan zijn.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel28
  - number: '28.5'
    text: |-
      Blijkt het adres onbekend dan wordt de verklaring aangeplakt bij de ingang van de begraafplaats. Een mededeling
      daarvan wordt bij het graf aangeplakt.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel28
  - number: '28.6'
    text: |-
      Indien toepassing is gegeven aan het vierde of vijfde lid en niet alsnog in het onderhoud wordt voorzien, vervalt
      in ieder geval dertig jaren nadat in dat graf de laatste begraving heeft plaatsgevonden het in het eerste lid
      bedoelde recht.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel28
  - number: '28.7'
    text: |-
      De op grond van het vijfde lid aangeplakte verklaring en mededeling worden eerst verwijderd indien in het onderhoud
      wordt voorzien of het uitsluitend recht op het graf is vervallen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel28
  - number: '29.1'
    text: |-
      Geen lijk wordt opgegraven dan, indien het een graf betreft waarop een uitsluitend recht berust, met toestemming
      van de rechthebbende op het graf en voorts met vergunning van de burgemeester der gemeente, binnen welker gebied
      het begraven is, nadat deze de betrokken regionale inspecteur van de volksgezondheid heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel29
  - number: '29.2'
    text: |-
      Aan de vergunning verbindt de burgemeester de nodige voorschriften betreffende geneeskundig toezicht alsmede
      vervoer en bestemming van het lijk.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel29
  - number: '29.3'
    text: |-
      Een opgegraven lijk mag worden verbrand met schriftelijk verlof van de officier van justitie van de plaats
      van opgraving, wanneer het verzoek daartoe gedaan wordt door de in [artikel 18][ref1] bedoelde persoon. De
      [paragrafen 1][ref2], [2][ref3] en [3 van hoofdstuk II][ref4] zijn ten aanzien van de verbranding niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005009#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005009#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0005009#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '18'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005009
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005009
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005009
        hoofdstuk: II
        paragraaf: '3'
  - number: '30'
    text: |-
      [Artikel 29][ref1] is niet van toepassing bij een opgraving ingevolge een bevel van een gerechtelijke autoriteit
      met het oog op een strafrechtelijk onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel29
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '29'
        hoofdstuk: III
        paragraaf: '1'
  - number: '31.1'
    text: |-
      [Artikel 29][ref1] geldt evenmin bij het ruimen van graven, voorzover dit geschiedt met inachtneming van het
      bepaalde bij of krachtens dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel29
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '29'
        hoofdstuk: III
        paragraaf: '1'
  - number: '31.2'
    text: |-
      Het ruimen geschiedt niet dan op last van de houder van de begraafplaats en na verloop van tien jaren, nadat in
      het graf laatstelijk een lijk is geplaatst, en, indien het een graf betreft waarop een uitsluitend recht berust,
      met toestemming van de rechthebbende. Van het voornemen om graven te ruimen geeft de houder van de begraafplaats
      tenminste twee maanden tevoren kennis aan de betrokken regionale inspecteur van de volksgezondheid. De inspecteur
      kan bepalen, dat het ruimen onder geneeskundig toezicht geschiedt.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel31
  - number: '31.3'
    text: |-
      De overblijfselen der lijken worden op een begraafplaats ter aarde besteld of, met overeenkomstige toepassing van
      het gestelde in [artikel 29, derde lid][ref1], in een crematorium verbrand.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel29
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '29'
        hoofdstuk: III
        paragraaf: '1'
  - number: '31.4'
    text: |-
      Gedeputeerde staten kunnen, op voorstel van de betrokken regionale inspecteur van de volksgezondheid of na deze
      te hebben gehoord, voor een begraafplaats de in het tweede lid genoemde termijn een of meermalen verlengen. Het
      besluit treedt terstond in werking.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel31
  - number: '32'
    text: |-
      Wij kunnen omtrent de wijze van begraven, de inrichting van het graf en de afstand van de graven onderling bij
      algemene maatregel van bestuur regelen stellen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel32
  - number: '33'
    text: |-
      Een gemeente heeft voor zich of met een of meer andere gemeenten tezamen tenminste een gemeentelijke begraafplaats,
      tenzij gedeputeerde staten van deze verplichting tijdelijk ontheffing hebben verleend.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel33
  - number: '34'
    text: |-
      Betreffende de aanleg of de uitbreiding van een gemeentelijke begraafplaats wordt de betrokken regionale inspecteur
      van de volksgezondheid gehoord.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel34
  - number: '35'
    text: |-
      Tenminste elke dag welke geen zondag of algemeen erkende feestdag is, wordt gelegenheid tot begraven gegeven
      gedurende een redelijke tijd, bij gemeentelijke verordening te bepalen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel35
  - number: '36.1'
    text: |-
      Een gemeente behoeft voor het aanleggen of uitbreiden van een begraafplaats op het grondgebied ener andere gemeente
      toestemming van de raad van deze laatste.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel36
  - number: '36.2'
    text: |-
      De verordenende bevoegdheid met betrekking tot die begraafplaats wordt door het terzake bevoegde gemeentebestuur
      uitgeoefend in overeenstemming met dat van de andere gemeente.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel36
  - number: '36.3'
    text: |-
      Wordt zodanige overeenstemming niet verkregen dan stellen gedeputeerde staten de verordeningen vast. Liggen de
      gemeenten in verschillende provinciën, dan geschiedt deze vaststelling door Ons, gedeputeerde staten der betrokken
      provinciën gehoord.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel36
  - number: '37.1'
    text: |-
      Een bijzondere begraafplaats kan slechts worden aangelegd en in stand gehouden door een kerkgenootschap dan wel
      door een privaatrechtelijke rechtspersoon of een natuurlijk persoon.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel37
  - number: '37.2'
    text: |-
      Onder kerkgenootschap wordt mede verstaan een onderdeel daarvan of een rechtspersoon, in het leven geroepen door
      een of meer kerkgenootschappen of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel37
  - number: '38'
    text: |-
      Een kerkgenootschap is gerechtigd tot het hebben van één of meer kerkelijke begraafplaatsen tot een zodanige
      uitgestrektheid, als overeenkomt met een redelijk deel van de grond, welke in de gemeente voor begraafplaatsen
      bestemd is. De gemeenteraad kan aan een kerkgenootschap op zijn verzoek toestaan, meer of grotere begraafplaatsen
      te hebben, onverminderd het recht van de andere kerkgenootschappen, bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel38
  - number: '39.1'
    text: |-
      Voor zover een kerkgenootschap geen gebruik maakt van de bevoegdheid, bedoeld in [artikel 38][ref1] wordt op zijn
      verzoek door de raad een deel van de gemeentelijke begraafplaats te zijner beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel38
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '38'
        hoofdstuk: III
        paragraaf: '3'
  - number: '39.2'
    text: |-
      De gemeente blijft belast met het beheer, het onderhoud en de administratie. Over de inrichting, de afscheiding en
      het gebruik van genoemd deel der begraafplaats, alsmede over de toepassing van de[ artikelen 35][ref1], [43][ref2]
      en [44][ref3], wordt overleg gepleegd met het kerkgenootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel44
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '35'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '43'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '44'
        hoofdstuk: III
        paragraaf: '4'
  - number: '40.1'
    text: |-
      Voor het aanleggen of uitbreiden van de bijzondere begraafplaats wordt slechts de grond gebruikt, die daartoe door
      de gemeenteraad is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel40
  - number: '40.2'
    text: |-
      De raad kan tevens maatregelen voorschrijven, welke nodig zijn teneinde de grond geschikt te maken om als
      begraafplaats te dienen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel40
  - number: '40.3'
    text: |-
      Inzake de totstandkoming van de aanwijzing en de voorschriften, bedoeld in de voorgaande leden, wordt de betrokken
      regionale inspecteur van de volksgezondheid gehoord.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel40
  - number: '40.4'
    text: |-
      Indien het kerkgenootschap geen eigenaar van de benodigde grond is, draagt het gemeentebestuur desgevraagd zorg,
      dat het kerkgenootschap de grond, mede gelet op de staat, waarin deze ingevolge het tweede lid moet verkeren,
      op redelijke voorwaarden in eigendom kan verwerven. Kunnen het gemeentebestuur en het kerkgenootschap niet tot
      overeenstemming komen, dan bepalen gedeputeerde staten op verzoek van een van hen of beide de voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel40
  - number: '41'
    text: |-
      Voor het in gebruik nemen van de bijzondere begraafplaats of van een deel daarvan is de toestemming van
      burgemeester en wethouders nodig. Deze toestemming wordt slechts geweigerd, indien niet aan de wettelijke
      voorschriften is voldaan.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel41
  - number: '42.1'
    text: |-
      Van de besluiten van de gemeenteraad, onderscheidenlijk van burgemeester en wethouders, genomen ingevolge deze
      paragraaf, staat voor belanghebbenden beroep bij gedeputeerde staten open. De uitspraak van gedeputeerde staten kan
      door Ons worden geschorst en vernietigd wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel42
  - number: '42.2'
    text: |-
      Indien de gemeenteraad, onderscheidenlijk burgemeester en wethouders, nalatig blijven een besluit te nemen, bepalen
      gedeputeerde staten op verzoek een termijn, binnen welke zulks alsnog dient te geschieden. Is zulk een besluit voor
      afloop van deze termijn niet genomen, dan worden de gemeenteraad, onderscheidenlijk burgemeester en wethouders,
      geacht afwijzend te hebben beschikt.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel42
  - number: '43.1'
    text: Een begraafplaats kan worden gesloten.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel43
  - number: '43.2'
    text: Voor een gemeentelijke begraafplaats neemt de gemeenteraad het besluit daartoe.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel43
  - number: '43.3'
    text: Van de sluiting van een andere begraafplaats wordt terstond mededeling gedaan aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel43
  - number: '44'
    text: |-
      Indien op een begraafplaats gedurende tien jaren geen begraving meer heeft plaats gehad, kan de gemeenteraad de
      begraafplaats gesloten verklaren. De begraafplaats wordt alsdan geacht met ingang van de dag na die van de laatste
      begraving te zijn gesloten. Deze dag wordt in het besluit van de raad vermeld.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel44
  - number: '45.1'
    text: |-
      Tegen een besluit tot sluiting of geslotenverklaring kunnen belanghebbenden bij gedeputeerde staten in beroep
      komen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel45
  - number: '45.2'
    text: |-
      Indien onherroepelijk is besloten tot sluiting dan wel geslotenverklaring van een gemeentelijke begraafplaats,
      kunnen gedeputeerde staten op verzoek van de rechthebbende op een graf waarop een uitsluitend recht berust en
      waarin nog begraven kan worden, een schadeloosstelling ten laste van de betrokken gemeente vaststellen terzake van
      het teniet gaan van het recht tot begraven.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel45
  - number: '46.1'
    text: Op een gesloten begraafplaats worden geen lijken begraven.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel46
  - number: '46.2'
    text: |-
      De begraafplaats blijft, onverminderd het bepaalde in de[ artikelen 29-31][ref1] en [66][ref2], gedurende twintig
      jaren onaangeroerd liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel66
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '29'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '66'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '46.3'
    text: |-
      De grond mag, voor zover het een graf betreft waarop een uitsluitend recht berust, met toestemming van de
      rechthebbende, gedurende tien jaren na afloop van de in het tweede lid genoemde termijn, of, indien toepassing is
      gegeven aan [artikel 31, vierde lid][ref1], na afloop van de krachtens die bepaling gestelde termijn slechts tot
      bezaaiing of beplanting worden gebruikt, mits niet dieper dan 0,5 m wordt gegraven. Gedeputeerde staten kunnen,
      de betrokken regionale inspecteur van de volksgezondheid gehoord, vergunning verlenen tot uitgraving ter meerdere
      diepte.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel31
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '31'
        hoofdstuk: III
        paragraaf: '1'
  - number: '46.4'
    text: |-
      Een graf waarop een uitsluitend recht berust, gelegen op een gesloten begraafplaats, wordt, voor zover in het
      onderhoud behoorlijk wordt voorzien, onaangeroerd gelaten.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel46
  - number: '47'
    text: Een begraafplaats houdt op dit te zijn, indien de grond die bestemming heeft verloren en hetzij
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel47
  - number: 47.a
    text: zich daarin geen graf bevindt hetzij,
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel47
  - number: 47.b
    text: |-
      vijftig jaren na de sluiting zijn verlopen dan wel, indien bij toepassing van [artikel 31, vierde lid][ref1], de
      krachtens die bepaling laatstelijk gestelde termijn eindigt op een tijdstip, gelegen meer dan tien jaren na de
      sluiting, vanaf dat tijdstip veertig jaren zijn verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel31
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '31'
        hoofdstuk: III
        paragraaf: '1'
  - number: '48'
    text: Onder begraafplaats wordt voor de toepassing van deze wet mede een gedeelte van een begraafplaats verstaan.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel48
  - number: '49'
    text: Verbranding geschiedt in een crematorium.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel49
  - number: '50.1'
    text: |-
      De houder van een crematorium houdt een register van alle daar verbrande lijken en van de bestemming die aan de as
      is gegeven. Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de gegevens die in het register
      worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel50
  - number: '50.2'
    text: Het in het eerste lid bedoelde register is openbaar.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel50
  - number: '50.3'
    text: |-
      Het register van een bijzonder crematorium wordt bij opheffing van dit crematorium overgebracht naar het archief
      van de gemeente waarin dit crematorium was gelegen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel50
  - number: '51.1'
    text: De crematoria worden onderscheiden in gemeentelijke en bijzondere.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel51
  - number: '51.2'
    text: |-
      Het is verboden een crematorium, dat niet op de voet van het bepaalde bij of krachtens deze wet gevestigd of in
      werking is, in werking te brengen of te houden.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel51
  - number: '52'
    text: |-
      Een bijzonder crematorium kan slechts worden gevestigd en in werking gehouden door een kerkgenootschap dan wel door
      een privaatrechtelijke rechtspersoon of een natuurlijk persoon. [Artikel 37, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel37
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '37'
        hoofdstuk: III
        paragraaf: '3'
  - number: '53'
    text: Het vestigen, uitbreiden of wijzigen van een bijzonder crematorium behoeft een vergunning van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel53
  - number: '54'
    text: |-
      Een besluit tot vestiging van een gemeentelijk crematorium dan wel een besluit tot het verlenen van vergunning voor
      het vestigen van een bijzonder crematorium wordt niet genomen, dan nadat burgemeester en wethouders van de gemeente
      van vestiging het voornemen daartoe ten minste dertig dagen tevoren ter openbare kennis hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel54
  - number: '55.1'
    text: |-
      Van een besluit, genomen ingevolge [artikel 53][ref1] staat voor belanghebbenden beroep bij gedeputeerde staten
      open.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel53
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '53'
        hoofdstuk: IV
        afdeling: '2'
  - number: '55.2'
    text: |-
      Indien de gemeenteraad nalatig blijft een besluit te nemen als bedoeld in [artikel 53][ref1] bepalen gedeputeerde
      staten op verzoek een termijn, binnen welke zulks alsnog dient te geschieden. Is zulk een besluit voor afloop van
      deze termijn niet genomen, dan wordt de gemeenteraad geacht afwijzend te hebben beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel53
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '53'
        hoofdstuk: IV
        afdeling: '2'
  - number: '56'
    text: |-
      Ten minste elke dag welke geen zondag of algemeen erkende feestdag is, wordt in een gemeentelijk crematorium
      gelegenheid gegeven tot het houden van crematieplechtigheden gedurende een redelijke tijd, bij gemeentelijke
      verordening te bepalen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel56
  - number: '57'
    text: |-
      Wij kunnen omtrent de inrichting van crematoria en omtrent hetgeen in de crematoria en op hun erven in acht moet
      worden genomen bij algemene maatregel van bestuur regelen stellen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel57
  - number: '58.1'
    text: Na de verbranding bergt de houder van het crematorium de as.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel58
  - number: '58.2'
    text: |-
      De as wordt geborgen in één of meer asbussen. Een asbus wordt gesloten en op de bus worden de naam en de
      voorletters van de overledene, alsmede een registratienummer, in onuitwisbare letters en cijfers vermeld. Binnen
      twintig jaren na het plaatsen van dit opschrift mag het niet van een ongeopende asbus worden verwijderd of daarop
      onleesbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel58
  - number: '58.3'
    text: |-
      Een deel van de as kan op verzoek van een nabestaande op een andere wijze worden geborgen en aan de nabestaande ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel58
  - number: '59.1'
    text: |-
      De houder van het crematorium draagt zorg voor de bewaring van een asbus gedurende minimaal een maand na het bergen
      van de as in de bus.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
  - number: '59.2'
    text: 'De houder van het crematorium draagt er vervolgens zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
  - number: 59.2.a
    text: de asbus wordt bijgezet,
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
  - number: 59.2.b
    text: de in de asbus geborgen as wordt verstrooid,
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
  - number: 59.2.c
    text: de asbus ter beschikking wordt gesteld aan een nabestaande die de zorg voor de asbus op zich neemt, of
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
  - number: 59.2.d
    text: de asbus wordt verzonden naar het buitenland.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
  - number: '59.3'
    text: |-
      De houder van het crematorium kan ter uitvoering van het tweede lid, onder a of b, de asbus ter bijzetting,
      onderscheidenlijk verstrooiing, overdragen aan een houder van een ander crematorium of van een plaats van
      bijzetting.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
  - number: '59.4'
    text: |-
      Op verzoek van de in [artikel 18][ref1] bedoelde personen kan de officier van justitie, bedoeld in
      [artikel 14][ref2], in bijzondere gevallen ontheffing verlenen van de in het eerste lid genoemde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel14
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '18'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: '60.1'
    text: |-
      Uit het buitenland afkomstige as wordt zo nodig, in opdracht van een nabestaande, geborgen in één of meer
      asbussen. Het bergen geschiedt door de houder van een crematorium. [Artikel 58, tweede en derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel58
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '60.2'
    text: |-
      De nabestaande draagt de zorg voor een asbus. Hij draagt zorg voor de bewaring van een asbus gedurende minimaal een
      maand na de invoer van de as. [Artikel 59, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel59
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '59'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '61'
    text: |-
      Omtrent de berging, de bestemming en de bewaring van de as kunnen bij algemene maatregel van bestuur nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel61
  - number: '62.1'
    text: 'Een asbus kan worden bijgezet:'
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel62
  - number: 62.1.a
    text: in een in het bijzonder daarvoor bestemd gedeelte van het crematorium,
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel62
  - number: 62.1.b
    text: in of op een graf of op een afzonderlijke plaats op een begraafplaats, of
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel62
  - number: 62.1.c
    text: in een buiten een crematorium of begraafplaats gelegen bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel62
  - number: '62.2'
    text: |-
      Het bijzetten geschiedt ter uitvoering van [artikel 59, tweede lid, onder a][ref1], of in opdracht van de
      nabestaande die de zorg voor de asbus heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel59
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '59'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '62.3'
    text: |-
      De bijzetting van een asbus in of op een graf waarop een uitsluitend recht berust, kan slechts geschieden met
      toestemming van de rechthebbende op het graf.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel62
  - number: '63.1'
    text: |-
      Een asbus die is bijgezet kan op verzoek van een nabestaande die de zorg voor de asbus op zich neemt, door de
      houder van de plaats van bijzetting aan de nabestaande ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel63
  - number: '63.2'
    text: |-
      Verwijdering van de asbus kan slechts geschieden met toestemming van de rechthebbende op de ruimte waar de asbus
      is bijgezet.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel63
  - number: '63.3'
    text: |-
      Verwijdering kan geschieden zonder toestemming van de rechthebbende, ingevolge een bevel van een gerechtelijke
      autoriteit met het oog op een strafrechtelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel63
  - number: '64.1'
    text: |-
      Een bewaarplaats als bedoeld in [artikel 62, eerste lid, onder c][ref1], wordt niet in gebruik genomen dan met
      vergunning van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel62
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '64.2'
    text: Tegen een besluit als bedoeld in het eerste lid, kunnen belanghebbenden beroep instellen bij gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel64
  - number: '65.1'
    text: |-
      De houder van een plaats van bijzetting houdt een register van alle daar bijgezette asbussen. Bij algemene
      maatregel van bestuur worden nadere regels gesteld omtrent de gegevens die in het register worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel65
  - number: '65.2'
    text: Het in het eerste lid bedoelde register is openbaar.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel65
  - number: '65.3'
    text: |-
      Het register wordt bij opheffing van de plaats van bijzetting overgebracht naar het archief van de gemeente waarin
      die plaats was gelegen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel65
  - number: '66.1'
    text: |-
      Het ruimen van een asbus geschiedt door of in opdracht van de houder van de plaats van bijzetting en vindt niet
      plaats dan:
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66
  - number: 66.1.a
    text: na verloop van twintig jaren nadat de as in de bus is geborgen, en
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66
  - number: 66.1.b
    text: met toestemming van de rechthebbende op de ruimte waar de asbus is bijgezet.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66
  - number: '66.2'
    text: Het ruimen geschiedt door verstrooiing van de as.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66
  - number: 66a.1
    text: De as in een asbus kan worden verstrooid.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
  - number: 66a.2
    text: 'Het verstrooien geschiedt:'
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
  - number: 66a.2.a
    text: |-
      ter uitvoering van [artikel 59, tweede lid, onder b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel59
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '59'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 66a.2.b
    text: door of in opdracht van de nabestaande die de zorg voor de asbus heeft, of
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
  - number: 66a.2.c
    text: in verband met het ruimen van de asbus.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
  - number: 66a.3
    text: |-
      Het verstrooien van de as door of in opdracht van de houder van een crematorium of de houder van een plaats van
      bijzetting is slechts toegestaan:
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
  - number: 66a.3.a
    text: op een terrein dat bestemd is om permanent as op te verstrooien;
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
  - number: 66a.3.b
    text: in open zee.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66a
  - number: 66b.1
    text: |-
      De bestemming van een terrein om permanent as op te verstrooien door de houder van een crematorium en de houder
      van een plaats van bijzetting vindt niet plaats dan met vergunning van burgemeester en wethouders van de gemeente
      waarin het terrein is gelegen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66b
  - number: 66b.2
    text: |-
      Voordat burgemeester en wethouders een besluit nemen omtrent het verlenen van de vergunning horen zij de regionale
      inspecteur van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel66b
  - number: '67.1'
    text: Een lijk kan in het belang van de wetenschap of het wetenschappelijk onderwijs worden ontleed.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel67
  - number: '67.2'
    text: |-
      Ontleding geschiedt slechts, indien de overledene zijn lijk daartoe heeft bestemd. De
      [artikelen 18, eerste lid, tweede volzin][ref1], en [19][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel19
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '18'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
  - number: '67.3'
    text: |-
      Bij gebreke van een bestemming inzake lijkbezorging door de overledene kan ontleding eveneens geschieden, indien
      de niet van tafel en bed gescheiden echtgenoot, de geregistreerde partner of andere levensgezel dan wel, bij
      ontstentenis of onbereikbaarheid van deze, de naaste onmiddellijk bereikbare meerderjarige bloed- of aanverwanten
      tot en met de derde graad, of, wanneer ook deze niet bereikbaar zijn, de aanwezige meerderjarige erfgenamen of
      anders degenen die de zorg voor het lijk op zich nemen, dit daartoe bestemmen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel67
  - number: '68.1'
    text: |-
      Geen ontleding geschiedt zonder schriftelijk verlof van de burgemeester, afgegeven uiterlijk op de derde
      dag na die van het overlijden. In het verlof, dat kosteloos wordt afgegeven, wordt de plaats van ontleding
      vermeld. Het formulier voor het verlof wordt door Onze Minister van Binnenlandse Zaken vastgesteld. De
      [artikelen 12-15 ][ref1]zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel12
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: '68.2'
    text: |-
      Van het besluit van de burgemeester staat binnen 24 uren beroep open op Onze Commissaris in de provincie, die
      daarop onmiddellijk beslist. De [Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '69.1'
    text: Ontleding vangt niet eerder aan dan 36 uren na het overlijden.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel69
  - number: '69.2'
    text: Deze handeling wordt niet verricht dan door of onder het toezicht van een arts.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel69
  - number: '70'
    text: |-
      Wij geven bij algemene maatregel van bestuur voorschriften omtrent de wijze, waarop met lijken van personen
      of van doodgeborenen, aan boord van Nederlandse schepen op zee overleden onderscheidenlijk ter wereld gekomen,
      gehandeld dient te worden. Daarbij worden de gevallen geregeld, waarin een lijk overboord wordt gezet of aan een
      conserverende bewerking wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel70
  - number: '71.1'
    text: |-
      Een lijk wordt niet gebalsemd of onderworpen aan enige andere conserverende bewerking die niet is gericht op
      gebruik van delen van het lijk ingevolge de [Wet op de orgaandonatie][ref1]. In uitzonderlijke gevallen kan Onze
      Minister van Welzijn, Volksgezondheid en Cultuur ontheffing van dit verbod verlenen. In de ontheffing wordt de
      wijze en de plaats van de lijkbezorging vermeld. De [artikelen 12-15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel12
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008066
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: '71.2'
    text: |-
      Het verbod, vermeld in het eerste lid, is niet van toepassing, indien het lijk tot ontleding bestemd is of naar het
      buitenland wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel71
  - number: '71.3'
    text: |-
      [Artikel 69][ref1] is van overeenkomstige toepassing. Indien het lijk tot ontleding is bestemd, is alleen het
      tweede lid van dat artikel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel69
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '69'
        hoofdstuk: V
  - number: '72.1'
    text: |-
      Indien de overledene dit heeft toegestaan, kan zijn lijk aan sectie worden onderworpen. Artikel 19 is van
      overeenkomstige toepassing, met dien verstande dat in het geval van de daar bedoelde verklaring met eigenhandige
      ondertekening en dagtekening kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel72
  - number: '72.2'
    text: |-
      Bij gebreke van toestemming van de overledene kan daarvoor in de plaats treden die van de niet van tafel
      en bed gescheiden echtgenoot, de geregistreerde partner of andere levensgezel dan wel, bij ontstentenis of
      onbereikbaarheid van deze, van de naaste onmiddellijk bereikbare meerderjarige bloed- of aanverwanten tot en met
      de derde graad, of, wanneer ook deze niet bereikbaar zijn, van de aanwezige meerderjarige erfgenamen of anders van
      degenen die de zorg voor het lijk op zich nemen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel72
  - number: '73.1'
    text: |-
      De beperkingen, gesteld in [artikel 72][ref1], zijn niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel72
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '72'
        hoofdstuk: VI
  - number: 73.1.a
    text: in geval van een bevel van een gerechtelijke autoriteit in verband met een strafrechtelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel73
  - number: 73.1.b
    text: ingeval het belang van de volksgezondheid dit vereist;
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel73
  - number: 73.1.c
    text: ingeval de vaststelling van de oorzaak van een ongeval met een luchtvaartuig dit vereist.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel73
  - number: '73.2'
    text: |-
      Bij toepassing van het eerste lid wordt de persoon bedoeld in [artikel 72, tweede lid][ref1], daarvan in kennis
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel72
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '72'
        hoofdstuk: VI
  - number: '74.1'
    text: |-
      In het geval, bedoeld in [artikel 73, eerste lid, onder ][ref1], behoeft de arts, door of onder wiens toezicht de
      sectie zal worden verricht, toestemming van de betrokken regionale inspecteur van de volksgezondheid. Deze doet van
      een door hem verleende toestemming mededeling aan de betrokken hoofdinspecteur van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel73
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '73'
        hoofdstuk: VI
  - number: '74.2'
    text: |-
      In het geval, bedoeld in [artikel 73, eerste lid, onder ][ref1], behoeft de arts door of onder wiens toezicht de
      sectie zal worden verricht, toestemming van


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel73
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '73'
        hoofdstuk: VI
  - number: 74.2.a
    text: |-
      de voorzitter van een kamer van de Raad voor de Transportveiligheid, genoemd in
      [artikel 2 van de Wet Raad voor de Transportveiligheid][ref1], indien het een ongeval met een burgerluchtvaartuig
      betreft dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel2
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '2'
  - number: 74.2.b
    text: |-
      de inspecteur geneeskundige dienst van het betreffende krijgsmachtdeel, indien het een ongeval met een militair
      luchtvaartuig betreft.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel74
  - number: '75'
    text: |-
      Het verrichten van sectie geschiedt door een arts, nadat deze zich er van tevoren van heeft vergewist
      dat het intreden van de dood door een andere arts is vastgesteld en aan de vereisten, geldend ingevolge
      de[ artikelen 72][ref1] en [74][ref2], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel74
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '72'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '74'
        hoofdstuk: VI
  - number: '76.1'
    text: |-
      Wanneer tekenen of aanduidingen van een niet-natuurlijke dood aanwezig zijn of wanneer in verband met andere
      omstandigheden een niet-natuurlijke dood niet uitgesloten geacht kan worden, mag het lijk niet worden vervoerd dan
      met verlof van de officier van justitie of een van zijn hulpofficieren.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel76
  - number: '76.2'
    text: |-
      In zodanig geval mag ontleding, conservering als bedoeld in [artikel 71, eerste lid][ref1], sectie of verwijdering
      van organen uit het lijk voor orgaandonatie als bedoeld in de [Wet op de orgaandonatie][ref2] niet plaatsvinden, of
      indien reeds aangevangen, niet worden voortgezet, dan met toestemming van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '71'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0008066
  - number: '76.3'
    text: |-
      Indien de officier van justitie een geval als bedoeld in het eerste lid aanwezig acht, kan hij uitstel van de
      begraving of van de verbranding van het lijk gelasten, of de verbranding verbieden. Zolang een zodanige maatregel
      van kracht is, wordt het lijk niet begraven of verbrand, onderscheidenlijk niet verbrand, en geeft de ambtenaar van
      de burgerlijke stand daartoe geen verlof.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel76
  - number: '76.4'
    text: |-
      Indien de officier van justitie een geval als bedoeld in het eerste lid aanwezig acht kan hij verbieden dat de as
      wordt verstrooid, ter beschikking wordt gesteld aan een nabestaande of naar het buitenland wordt verzonden.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel76
  - number: '76.5'
    text: |-
      Voor de toepassing van dit artikel wordt als bevoegde officier van justitie aangemerkt die van de plaats waar het
      lijk het eerst is aangetroffen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel76
  - number: '77'
    text: |-
      Gedurende een gerechtelijk vooronderzoek komen de bevoegdheden, die[ artikel 76][ref1] aan de officier van justitie
      toekent, mede toe aan de rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel76
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '76'
        hoofdstuk: VI
  - number: '78'
    text: |-
      Wij stellen bij algemene maatregel van bestuur regelen met betrekking tot het vervoer van lijken uit Nederland naar
      het buitenland en uit het buitenland naar Nederland.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel78
  - number: '79'
    text: |-
      Wij stellen bij algemene maatregel van bestuur regelen betreffende de in deze wet geregelde onderwerpen voor
      de territoriale zee en voor het aan Nederland grenzende deel van het continentale plat, waarop het Koninkrijk
      souvereine rechten heeft, en voor landen buiten Nederland voor het geval aldaar door of vanwege Nederlandse
      militaire autoriteiten ter uitvoering van een internationale overeenkomst handelingen, die onderwerpen betreffende,
      verricht kunnen worden. In die regelen wordt zoveel mogelijk aangesloten bij de in Nederland geldende wettelijke
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel79
