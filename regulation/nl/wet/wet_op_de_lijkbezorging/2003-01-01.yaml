      overtreding van het bepaalde krachtens de[ artikelen 32][ref1], [57][ref2] en [61][ref3], voorzover uitdrukkelijk
      als strafbaar feit in de zin van het onderhavige artikel aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel61
