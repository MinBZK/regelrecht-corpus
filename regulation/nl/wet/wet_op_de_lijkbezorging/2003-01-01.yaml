        afdeling: '3'
  - number: '82'
    text: De ingevolge deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel82
  - number: '83.1'
    text: |-
      De bij de inwerkingtreding van deze wet in gebruik zijnde begraafplaatsen en crematoria worden geacht te zijn
      aangelegd en opengesteld onderscheidenlijk gevestigd en in werking gesteld te zijn overeenkomstig de bepalingen
      van deze wet. Een op dat tijdstip reeds verleend verlof tot vestiging, uitbreiding of wijziging van een crematorium
      wordt geacht ingevolge [artikel 53][ref1] te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel53
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '53'
        hoofdstuk: IV
        afdeling: '2'
  - number: '83.2'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet geldende ontheffingen, verleend op grond van artikel 13,
      eerste lid, van de Wet op de lijkbezorging (Wet van 10 april 1869. *Stb.* 65), worden geacht te zijn verleend
      overeenkomstig [artikel 33][ref1], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel33
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '33'
        hoofdstuk: III
        paragraaf: '2'
  - number: '83.3'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet geldende gemeentelijke verordeningen tot heffing van rechten
      als bedoeld in de artikelen 20, 21, 29*o* en 30-35 van de Wet op de lijkbezorging (Wet van 10 april 1869, *Stb.*
      65), worden geacht te zijn vastgesteld krachtens [artikel 229 van de Gemeentewet][ref1] (*Stb.* 1992, 96).


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: '84'
    text: |-
      Het recht op een eigen graf, verleend vóór het in werking treden van deze wet, wordt geacht een uitsluitend recht
      op een graf in de zin van [artikel 28][ref1] te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel28
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '28'
        hoofdstuk: III
        paragraaf: '1'
  - number: '85.1'
    text: |-
      In graven of grafkelders als bedoeld in artikel 15 van de Wet op de lijkbezorging (Wet van 10 april 1869, *Stb.*
      65) kunnen het lijk van degene, die daarvan eigenaar is ten tijde van de inwerkingtreding van deze wet en de
      lijken van de leden van zijn geslacht worden begraven. In of op zodanige graven en in zodanige grafkelders kunnen
      asbussen, waarin de as van lijken bedoeld in de eerste volzin is geborgen, worden bijgezet.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel85
  - number: '85.2'
    text: |-
      Op de in het eerste lid bedoelde graven en grafkelders zijn van [Hoofdstuk III][ref1] toepasselijk
      de[ artikelen 26][ref2], [27][ref3], [29][ref4], [30][ref5] en [31][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005009#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0005009#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0005009#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0005009#Artikel31
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005009
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '26'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '27'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005009
        artikel: '29'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0005009
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0005009
        artikel: '31'
        hoofdstuk: III
        paragraaf: '1'
  - number: '86.1'
    text: |-
      De raden der gemeenten, op welke een verplichting rust tot betaling van een jaarlijkse schadeloosstelling
      in verband met het niet meer plaats vinden van begravingen in kerken of andere gesloten gebouwen, hebben het
      recht deze verplichting af te kopen tegen betaling van een som, die het twintigvoudige van het bedrag dier
      schadeloosstelling beloopt.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel86
  - number: '86.2'
    text: |-
      Indien de rechthebbende op de afkoopsom weigert deze te aanvaarden of onbekend dan wel afwezig is, kunnen
      burgemeester en wethouders de afkoopsom doen opnemen in de Consignatiekas.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel86
  - number: '87.1'
    text: Deze wet is niet van toepassing op de lijkbezorging van leden van het Koninklijk Huis.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel87
  - number: '87.2'
    text: |-
      Onze Minister van Binnenlandse Zaken kan ten aanzien van andere bloed- en aanverwanten van de Koning ontheffing
      verlenen van bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel87
  - number: '88'
    text: |-
      Een besluit waartegen ingevolge deze wet beroep openstaat of aanhangig is treedt, zolang dit het geval is, niet in
      werking, onverminderd het bepaalde in [artikel 31, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel31
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '31'
        hoofdstuk: III
        paragraaf: '1'
  - number: '89'
    text: |-
      De [algemene termijnenwet][ref1] is niet van toepassing op de termijnen, gesteld in de[ artikelen 16][ref2],
      [20][ref3] en [68, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0005009#Artikel68
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '16'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0005009
        artikel: '68'
        hoofdstuk: V
  - number: '90'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp, waarin deze wet
      voorziet, gehandhaafd, voor zover die verordeningen niet met deze wet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel90
  - number: '94'
    text: De Wet op de lijkbezorging (Wet van 10 april 1869, *Stb.* 65) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel94
  - number: '95'
    text: 'Deze wet kan worden aangehaald onder de titel: Wet op de lijkbezorging.'
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel95
  - number: '96'
    text: Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005009/2003-01-01#Artikel96
