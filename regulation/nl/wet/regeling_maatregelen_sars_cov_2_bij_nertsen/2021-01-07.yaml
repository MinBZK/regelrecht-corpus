  - number: 3ba
    text: |-
      1 Het is verboden kadavers van nertsen, gepelsde kadavers van nertsen, nertsenpelzen of andere producten van
      nertsen, met uitzondering van mest, te vervoeren in het risicogebied.

      2 Het is verboden kadavers van nertsen, gepelsde kadavers van nertsen, nertsenpelzen of andere producten van
      nertsen, met uitzondering van mest, te vervoeren buiten het risicogebied.

      3 Het tweede lid is niet van toepassing indien aan de volgende voorwaarden is voldaan:

      a. ten aanzien van de nertsenhouderij waarvan de kadavers, pelzen of andere producten afkomstig zijn, zijn geen
      maatregelen als bedoeld in [artikel 22 van de wet][ref1] genomen;

      b. in de administratie van de nertsenhouderij, bedoeld in onderdeel a, is opgenomen:

      1°. de dag waarop de desbetreffende dieren zijn gestorven; en

      2°. de locatie waar de kadavers, pelzen en andere producten van nertsen van de sinds de dag, bedoeld in onderdeel
      1°, gestorven nertsen zich bevinden; en

      c. de kadavers, gepelsde kadavers, pelzen en andere producten, bedoeld in onderdeel b:

      1°. zijn niet in aanraking geweest met en gescheiden opgeslagen van kadavers, pelzen of andere producten van
      nertsen, afkomstig van andere nertsenhouderijen; en

      2°. bevinden zich op een locatie op het Nederlands grondgebied;

      d. het vervoer vindt zonder tussenstop plaats tussen de nertsenhouderij waarvan de kadavers van nertsen, gepelsde
      kadavers van nertsen, nertsenpelzen of andere producten van nertsen afkomstig zijn naar hoogstens één inrichting
      waar kadavers, pelzen, of producten worden verwerkt.

      4 Het eerste en tweede lid zijn niet van toepassing op het vervoer van kadavers of gepelsde kadavers ter uitvoering
      van [artikel 2a][ref2] of [3][ref3] of ter uitvoering van [artikel 3.3, eerste lid, van de Wet dieren][ref4].

      5 Het eerste en tweede lid zijn niet van toepassing op het vervoer van kadavers, nertsenpelzen of andere producten
      van nertsen, indien ten aanzien van de nertsenhouderij waarvan zij afkomstig zijn, is voldaan aan de volgende
      voorwaarden:

      a. alle op de nertsenhouderij aanwezige nertsen zijn gedood; en

      b. de resultaten van het onderzoek, bedoeld in [artikel 2a][ref5], zijn negatief.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0043602#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0043602#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel3.3
      [ref5]: https://wetten.overheid.nl/BWBR0043602#Artikel2a
