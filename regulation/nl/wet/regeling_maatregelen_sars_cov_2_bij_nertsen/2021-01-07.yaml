  - number: 5a
    text: |-
      De [artikelen 3c][ref1], [3d][ref2], [3da][ref3], [3e][ref4], en [3f][ref5] zijn niet van toepassing indien:

      a. alle op de desbetreffende nertsenhouderij aanwezige nertsen zijn gedood; en

      b. de resultaten van het onderzoek, bedoeld in [artikel 2a][ref6], negatief zijn.


