  - number: 3bb
    text: |-
      1 Uit een vervoermiddel waarmee kadavers van nertsen, gepelsde kadavers van nertsen, nertsenpelzen of andere
      producten van nertsen, met uitzondering van mest, worden vervoerd buiten het risicogebied komt geen materiaal vrij
      dat smetstoffen kan bevatten.

      2 Na aankomst op een buiten het risicogebied gelegen inrichting waar kadavers, pelzen, of producten worden
      verwerkt:

      a. wordt het vervoermiddel geheel gelost; en

      b. wordt het vervoermiddel door de vervoerder terstond na de lossing, en in ieder geval voordat het op de
      openbare weg wordt gebracht, gereinigd en ontsmet met een toegelaten ontsmettingsmiddel op zodanige wijze dat de
      bioveiligheid niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3bb
  - number: 3bc
    text: |-
      1 Bij aankomst op de buiten het risicogebied gelegen inrichting waar kadavers, pelzen, of andere producten van
      nertsen, met uitzondering van mest, worden verwerkt, worden de kadavers van nertsen, gepelsde kadavers van nertsen,
      nertsenpelzen of andere producten terstond en afzonderlijk van kadavers, pelzen of andere producten afkomstig van
      andere nertsenhouderijen opgeslagen in een vriezer van die inrichting voordat verwerking plaatsvindt.

      2 De kadavers van nertsen, gepelsde kadavers van nertsen, nertsenpelzen of andere producten van nertsen, met
      uitzondering van mest, worden niet eerder verwerkt dan nadat alle dieren op de nertsenhouderij van afkomst zijn
      gedood en de resultaten van het onderzoek, bedoeld in [artikel 2a][ref1], negatief zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0043602#Artikel2a
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3bc
    references:
      - id: ref1
        bwb_id: BWBR0043602
        artikel: 2a
        paragraaf: '2'
  - number: 3c
    text: |-
      1 Het is bezoekers verboden een nertsenverblijfplaats alsmede een niet deugdelijk fysiek van die verblijfplaats
      afgescheiden woonruimte of ander deel van een nertsenhouderij te betreden.

      2 In afwijking van het eerste lid is het toegestaan een nertsenverblijfplaats te betreden, indien:

      a. het bezoek noodzakelijk is in het kader van volksgezondheid, diergezondheid, dierenwelzijn of gezondheid van in
      de stal aanwezige personen;

      b. het bezoek plaatsvindt overeenkomstig een hygiëneprotocol;

      c. de bezoeker het bezoek registreert; en

      d. het bezoek overeenkomstig [artikel 3d, tweede lid][ref1], vooraf aan de minister is gemeld.

      3 In afwijking van het tweede lid zijn de onderdelen b, c en d van dat lid niet van toepassing, indien een acute
      noodsituatie zich tegen toepassing van die onderdelen verzet.

      4 In afwijking van het eerste lid is het toegestaan een nertsenverblijfplaats te betreden, indien:

      a. het bezoek betreft van personeel van de inrichting waarvan de nertsenverblijfplaats onderdeel uitmaakt; en

      b. het bezoek plaatsvindt overeenkomstig een hygiëneprotocol.

      5 Het is een houder van nertsen verboden om een bezoeker toe te laten tot de in het eerste lid bedoelde ruimtes,
      tenzij het bezoek betreft als bedoeld in het tweede, derde of vierde lid.

      6 Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op het vervoermiddel van een bezoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0043602#Artikel3d
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0043602
        artikel: 3d
        paragraaf: 2b
  - number: 3d
    text: |-
      1 Een houder van nertsen houdt een register bij van alle bezoeken aan een nertsenverblijfplaats, niet deugdelijk
      fysiek van die verblijfplaats afgescheiden woonruimte of ander deel van een inrichting, waarin ten minste zijn
      opgenomen:

      a. naam, adres en woonplaats van de bezoeker;

      b. voor zover de bezoeker een vervoermiddel heeft gebruikt: soort en kenteken van het vervoermiddel;

      c. reden van het bezoek; en

      d. datum en tijdstip van aankomst en vertrek van de bezoeker.

      2 Een houder van nertsen meldt voor iedere dag dat een nertsenverblijfplaats wordt bezocht uiterlijk om 7:00 uur op
      de dag voorafgaande aan de dag van het voorgenomen bezoek aan de minister:

      a. de naam, het adres, de woonplaats en de geboortedatum van degene die ten behoeve van de dagelijkse verzorging
      van de door hem gehouden nertsen de nertsenverblijfplaats zal betreden;

      b. op welke locatie de nertsenverblijfplaats, bedoeld in onderdeel a, is gelegen; en

      c. het verwachte tijdstip van aankomst en vertrek van degene die de nertsenverblijfplaats zal betreden.

      3 Indien niet alle bezoekers genoemd in de melding, bedoeld in het tweede lid, daadwerkelijk de
      nertsenverblijfplaats hebben betreden, meldt de houder van nertsen binnen 24 uur na afloop van de dag van het
      beoogde bezoek wie de nertsenverblijfplaats niet hebben betreden.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3d
  - number: 3da
    text: |-
      1 In aanvulling op [artikel 3c][ref1] is het een bezoeker verboden een nertsenverblijfplaats alsmede een niet
      deugdelijk fysiek van die verblijfplaats afgescheiden woonruimte of ander deel van een nertsenhouderij te betreden
      indien:

      a. de bezoeker zich in zodanige omstandigheden bevindt of heeft bevonden dat quarantaine voor diegene op basis van
      de adviezen van het Rijksinstituut voor Volksgezondheid en Milieu is aangewezen, of diegene de volledige duur van
      die quarantaine nog niet heeft voltooid; en

      b. de bezoeker binnen 10 dagen voorafgaand aan het betreden van de nertsenverblijfplaats een nertsenverblijfplaats
      op een andere locatie heeft bezocht.

      2 Het eerste lid, onderdeel b, is niet van toepassing indien:

      a. de bezoeker een dierenarts is die tijdens zijn bezoek aan de nertsenverblijfplaats de persoonlijke
      beschermingsmiddelen volgens de daarbij behorende instructies draagt die op de website van de Nederlandse Voedsel-
      en Warenautoriteit zijn gepubliceerd; of

      b. de houder van nertsen van de te bezoeken nertsenverblijfplaats voorafgaand aan het bezoek aan de minister heeft
      gemeld dat de dieren binnen vier dagen na die melding zullen worden gedood.


      [ref1]: https://wetten.overheid.nl/BWBR0043602#Artikel3c
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3da
    references:
