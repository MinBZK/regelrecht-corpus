        bwb_id: BWBR0043602
        artikel: 3c
        paragraaf: 2b
  - number: 3e
    text: |-
      1 Het is verboden een nertsenhouderij te betreden en te verlaten.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien een hygiëneprotocol is nageleefd.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3e
  - number: 3f
    text: |-
      Een houder van nertsen neemt maatregelen om zoveel mogelijk te voorkomen dat:

      a. op de nertsenhouderij aanwezige katten, honden of fretten de nertsenhouderij verlaten;

      b. er katten, honden of fretten van buitenaf op de nertsenhouderij komen.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3f
  - number: 3g
    text: |-
      1 De exploitant van een mestopslagplaats, een biogasinstallatie of een composteerinstallatie
      houdt in zijn administratie ten aanzien van mest die onder toepassing van
      [artikel 3b, derde lid, onderdeel a, onder 2°, 3°, 4° of 5°][ref1], respectievelijk is opgeslagen of verhit,
      gegevens bij over:

      a. de datum waarop de mest aan hem is afgeleverd;

      b. de herkomst van de mest;

      c. de hoeveelheid aangevoerde mest;

      d. de datum waarop de mest is afgevoerd; en

      e. in voorkomend geval de bestemming van de afgevoerde mest.

      2 De afvoer van mest uit opslagruimtes als bedoeld in [artikel 3b, derde lid, onder a, onder 2°][ref2], is slechts
      toegestaan ten minste drie weken na de datum dat de mest is afgeleverd voor opslag.


      [ref1]: https://wetten.overheid.nl/BWBR0043602#Artikel3b
      [ref2]: https://wetten.overheid.nl/BWBR0043602#Artikel3b
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3g
    references:
