  - number: '2'
    text: |-
      Een houder van nertsen laat uiterlijk 5 juni 2020 bloed afnemen bij de dieren en laat dit onderzoeken op
      de aanwezigheid SARS-CoV-2 door het laboratorium van de Gezondheidsdienst voor Dieren overeenkomstig het
      onderzoeksprotocol.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel2
  - number: 2a
    text: |-
      Ingeval op een nertsenhouderij alle aanwezige nertsen zijn gedood, laat de houder 60 kadavers van de laatst
      gedode nertsen op het bedrijf bemonsteren door een ambtenaar van de Nederlandse Voedsel- en Waren Autoriteit en de
      monsters onderzoeken door de Gezondheidsdienst voor Dieren op SARS-CoV-2.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel2a
  - number: 2b
    text: |-
      Wanneer op een nertsenhouderij waar na afloop van de pelsperiode nog nertsen aanwezig zijn in de periode van
      maandag tot en met zondag geen of hoogstens 4 nertsen natuurlijk zijn gestorven:

      a. laat de houder zo spoedig mogelijk daarna overeenkomstig het onderzoeksprotocol:

      1°. veegmonsters nemen in de nertsenverblijfplaats door een dierenarts;

      2°. de nertsen onderwerpen aan een klinische inspectie door een dierenarts; en

      3°. het rapport van de inspectie, samen met de monsters verzenden aan de Gezondheidsdienst voor Dieren; en

      b. de veegmonsters onderzoeken op de aanwezigheid SARS-CoV-2 door het laboratorium van de Gezondheidsdienst voor
      Dieren.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel2b
  - number: 2c
    text: |-
      Een houder van nertsen meldt elke maandag aan de minister het aantal op zijn nertsenhouderij aanwezige levende
      foknertsen en het totaal aantal aanwezige levende nertsen per locatie waar de nertsen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel2c
  - number: '3'
    text: |-
      Een houder van nertsen zendt één maal per week de kadavers, met een maximum van 50, van natuurlijk gestorven
      nertsen van minimaal de speenleeftijd aan de Gezondheidsdienst voor Dieren en laat deze door de Gezondheidsdienst
      voor Dieren onderzoeken op SARS-CoV-2.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3
  - number: 3a
    text: Het is verboden nertsen te vervoeren.
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3a
  - number: 3b
    text: |-
      1 Het is verboden mest van nertsen te vervoeren of aan te wenden.

      2 Het eerste lid is niet van toepassing op de afvoer van mest vanaf nertsenhouderijen ten aanzien waarvan:

      a. geen maatregelen als bedoeld in [artikel 22 van de wet][ref1] zijn genomen;

      b. de resultaten van het wekelijkse onderzoek, bedoeld in [artikel 3][ref2], ten minste twee achtereenvolgende
      weken negatief zijn; en

      c. indien is voldaan aan de voorwaarden, bedoeld in het derde lid.

      3 De voorwaarden, bedoeld in het tweede lid, onderdeel c, zijn:

      a. ingeval van drijfmest, wordt de mest rechtstreeks vervoerd naar:

      1°. een locatie waar de mest vervolgens, zo nodig na een tussentijdse opslag op die locatie, emissie-arm wordt
      aangewend;

      2°. een locatie met een mestopslagplaats waarin de mest vervolgens ten minste drie weken wordt opgeslagen;

      3°. een biogasinstallatie waarin de mest vervolgens wordt verhit tot een temperatuur van ten minste 70 graden
      Celsius;

      4°. een daartoe door de minister geregistreerde biogasinstallatie, waarin de mest vervolgens ten minste vijf dagen
      blijft onder verhitting van een temperatuur van ten minste 50 graden Celsius; of

      5° een composteerinstallatie waarin de mest vervolgens wordt verhit tot een temperatuur van ten minste 70 graden
      Celsius;

      b. ingeval van vaste mest, blijkt uit de administratie van de nertsenhouder dat de mest ten minste drie weken voor
      de afvoer is opgeslagen op de nertsenhouderij;

      c. het vervoer, de opslag en aanwending vindt plaats overeenkomstig een hygiëneprotocol; en

      d. ten minste 24 uur voorafgaand aan het vervoer zij aan de minister de volgende gegevens gemeld:

      1°. de afvoerdatum;

      2°. de bestemming van het vervoer;

      3°. het aantal transporten;

      4°. het type mest; en

      5°. de hoeveelheid te vervoeren mest.

      4 Het eerste lid is niet van toepassing, indien ten aanzien van de nertsenhouderij waarvan de mest afkomstig is, is
      voldaan aan de volgende voorwaarden:

      a. alle op de nertsenhouderij aanwezige nertsen zijn gedood; en

      b. de resultaten van het onderzoek, bedoeld in [artikel 2a][ref3], zijn negatief.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0043602#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0043602#Artikel2a
    url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#Artikel3b
