preamble:
  text: |-
    Gelet op de artikelen 15, eerste lid, 17 en 22 van de Gezondheid- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043602/2021-01-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *emissie-arm aanwenden van mest:* het gebruik van meststoffen overeenkomstig het bij en krachtens
      [artikel 5, eerste lid, van het Besluit gebruik meststoffen][ref1] bepaalde;
        - *hygiëneprotocol:* set praktische hygiëneregels ter bevordering van de bioveiligheid in een specifieke situatie,
      zoals bekendgemaakt op de website van de Nederlandse Voedsel- en Warenautoriteit;
        - *mest:* uitwerpselen en urine van dieren, met of zonder strooisel;
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *nertsenhouderij:* bedrijf of een gedeelte daarvan, als bedoeld in
      [artikel 1, onderdeel i, van de Meststoffenwet][ref2], dienende tot het houden van nertsen, zulks beoordeeld naar
      de feitelijke omstandigheden;
        - *nertsenverblijfplaats:* ruimte, kooi, terrein of gebouw, met uitzondering van woonruimte, waar nertsen aanwezig
      zijn of gewoonlijk worden gehouden en aanverwante ruimtes waar materiaal ten behoeve van nertsen is opgeslagen of
      gewoonlijk wordt opgeslagen;
        - *onderzoeksprotocol:* set praktische regels over de uitvoering van bloedonderzoek of het nemen van veegmonsters
      in nertsenverblijfplaatsen bij nertsen, zoals bekendgemaakt op de website van de Nederlandse Voedsel- en
      Warenautoriteit;
        - *pelsperiode:* periode die eindigt op 15 december 2020;
        - *risicogebied:* gebied als bedoeld in [bijlage 1][ref3];
        - *vervoer:* vervoer over de openbare weg, met of zonder vervoermiddel;
        - *vervoermiddel:* voertuig en materieel, met inbegrip van een combinatie van een voertuig en één of meer door dat
      voertuig voortbewogen aanhangwagens, opleggers of containers.

      2 Onder vervoer wordt mede verstaan: aanvoer en afvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel1
