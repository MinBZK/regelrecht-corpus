        bwb_id: BWBR0043602
        artikel: 3b
        paragraaf: 2a
  - number: '5'
    text: |-
      Maatregelen ten aanzien van bedrijven, genomen op grond van
      [artikel 31b, eerste lid, van de Gezondheids- en welzijnswet][ref1] in samenhang met [artikel 22 van die wet][ref2]
      en de [Regeling maatregelen vanwege verschijnselen SARS-CoV-2 bij nertsen][ref3], blijven van toepassing totdat de
      minister die maatregelen heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel31b
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0043515
