  - number: '1.2'
    text: |-
      De begripsomschrijvingen, opgenomen in de [artikelen 1][ref1], [2][ref2], [3, eerste lid][ref3], [8][ref4] en
      [10 van Boek 3][ref5], en in de [artikelen 1][ref6], [2][ref7], [3][ref8], [3a][ref9], [190][ref10] en 780 van
      het Burgerlijk Wetboek BES, gelden ook voor deze wet.


