  - number: '8.1'
    text: |-
      De openbare registers waarin feiten die voor de rechtstoestand van registergoederen van belang zijn, worden
      ingeschreven, zijn:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: 8.1.a
    text: |-
      de registers van inschrijving van feiten die betrekking hebben op onroerende zaken en de rechten waaraan deze
      onderworpen zijn:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: 8.1.b
    text: |-
      de registers van inschrijving van feiten die betrekking hebben op schepen en de rechten waaraan deze onderworpen
      zijn;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: 8.1.c
    text: |-
      de registers van inschrijving van feiten die betrekking hebben op luchtvaartuigen en de rechten waaraan deze
      onderworpen zijn;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: 8.1.d
    text: |-
      het register van voorlopige aantekeningen onderscheidenlijk voor onroerende zaken, schepen en luchtvaartuigen en de
      rechten waaraan deze onderworpen zijn, waarin de aanbieding van stukken waarvan de inschrijving door de bewaarder
      ingevolge [titel 1, afdeling 2, van Boek 3 van het Burgerlijk Wetboek BES][ref1] is geweigerd, wordt aangetekend
      onder vermelding van de gerezen bedenkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '8.2'
    text: |-
      Indien naar het oordeel van de bewaarder in de stukken die ter inschrijving worden aangeboden niet genoegzaam
      wordt aangetoond, dat het een schip betreft als bedoeld in [artikel 1, eerste lid][ref1], tekent de bewaarder de
      aanbieding van de stukken aan in het register van voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel1
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '1'
        hoofdstuk: '1'
  - number: '8.3'
    text: |-
      Tot de openbare registers, bedoeld in het eerste lid, behoren ook de openbare registers, bedoeld in de
      Landsverordening openbare registers, voor zover de inschrijvingen of aantekeningen daarin betrekking hebben op
      registergoederen in het eilandgebied of op registergoederen die ten kantore zijn ingeschreven op het eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: '8.4'
    text: |-
      Het derde lid is slechts van toepassing op inschrijvingen of aantekeningen die betrekking hebben op
      visserijvaartuigen en op schepen, niet zijnde visserijvaartuigen, waarvan uiterlijk op de dag voor inwerkingtreding
      van deze wet door het bevoegd gezag is vastgesteld dat voldoende gewaarborgd is dat het gebruik beperkt blijft
      tot privédoeleinden.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: '8.5'
    text: |-
      Het bestuurscollege regelt nader uit welke onderdelen de registers, bedoeld in het eerste lid, onder a, b,
      onderscheidenlijk c, bestaan. Het bestuurscollege stelt nadere regelen vast ter zake van de vorm van de in het
      eerste lid bedoelde registers.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: '8.6'
    text: |-
      Het bestuurscollege stelt voorts, onverminderd het bepaalde dienaangaande bij of krachtens andere wetsbepaling,
      vast de gevallen waarin in de in het eerste lid bedoelde registers door de bewaarder aantekeningen, daaronder
      begrepen doorhalingen van inschrijvingen in die registers, worden gesteld, de aard van die aantekeningen en de
      wijze waarop deze worden gesteld, in dier voege:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: 8.6.a
    text: |-
      dat de doorhaling behoudens in het onder d voorziene geval, slechts geschiedt op grond van de in de desbetreffende
      registers ingeschreven stukken die de bewaarder tot doorhaling machtigen;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: 8.6.b
    text: dat na een inschrijving van een stuk dat tot doorhaling machtigt, deze terstond geschiedt;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: 8.6.c
    text: |-
      dat, tenzij ingevolge [artikel 9, eerste lid][ref1], of [artikel 11, zevende lid][ref2], van dat stuk een afschrift
      in de vorm van een mechanische reproduktie is vervaardigd, op het stuk door middel waarvan het door te halen feit
      is ingeschreven, wordt vermeld op grond van welk stuk de doorhaling is geschied; en


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 8.6.d
    text: |-
      dat, zo ingevolge een wetsbepaling door een beschikking of door de inschrijving van enig stuk met betrekking
      tot een zaak bestaande lasten en rechten vervallen of tenietgaan, na de inschrijving van die beschikking of van
      dat stuk de inschrijvingen betreffende hypotheken en beslagen die door die beschikking, onderscheidenlijk de
      inschrijving van dat stuk, waardeloos zijn geworden, met bekwame spoed worden doorgehaald.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Het bestuurscollege kan bepalen, dat de inhoud van de in [artikel 8, eerste lid][ref1], bedoelde registers
      wordt vervangen door afschriften daarvan in dubbel in de vorm van door de bewaarder vervaardigde mechanische
      reprodukties. Het bestuurscollege bepaalt tevens de wijze waarop deze vervanging zal geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel8
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '9.2'
    text: Deze reprodukties hebben dezelfde bewijskracht als de oorspronkelijke inhoud van de registers.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Stukken ter verkrijging van inschrijving van feiten die betrekking hebben op onroerende zaken of de rechten waaraan
      deze onderworpen zijn, worden aangeboden aan de bewaarder van het openbaar lichaam waarbinnen de onroerende zaken
      waarop de in te schrijven feiten betrekking hebben, zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Voor inschrijving van een feit in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onder a tot en met c][ref1], is vereist een stuk dat voldoet aan de eisen gesteld in
      [titel 2][ref2] van dit hoofdstuk, alsmede een afschrift van dat stuk, gesteld op een door het Kadaster verstrekt
      formulier en voorzien van een verklaring van eensluidendheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028516
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De bewaarder is niet gehouden de juistheid van de in het eerste lid bedoelde verklaring te onderzoeken. Het
      Kadaster is niet aansprakelijk voor schade voortvloeiend uit onjuistheden en onvolledigheden in het afschrift.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Het bestuurscollege stelt de vorm vast van de in het eerste lid bedoelde verklaring en bepaalt, onverminderd het
      bepaalde bij of krachtens een andere wetsbepaling, door wie deze verklaring moet worden ondertekend.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel11
  - number: '11.4'
    text: |-
      Het bestuurscollege kan voor bijzondere gevallen bepalen dat geen afschrift, als bedoeld in het eerste lid, behoeft
      te worden aangeboden. In die gevallen doet de bewaarder het afschrift van het ter inschrijving aangeboden stuk
      vervaardigen. Het bepaalde in het zevende lid, derde volzin, is alsdan van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel11
  - number: '11.5'
    text: |-
      Het Kadaster stelt de vereisten vast, waaraan tekeningen die deel uitmaken van ter inschrijving aangeboden stukken,
      moeten voldoen. Daarbij kan worden afgeweken van het bepaalde in het eerste tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel11
  - number: '11.6'
    text: |-
      Het bestuurscollege stelt de vorm vast van het in het eerste lid bedoelde formulier, alsmede de vereisten met
      inachtneming waarvan dit formulier dient te worden ingevuld en aangeboden.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel11
  - number: '11.7'
    text: |-
      Het bestuurscollege kan in afwijking van het eerste lid bepalen, dat in plaats van het in dat lid bedoelde voor
      inschrijving vereiste afschrift de bewaarder een afschrift van het ter inschrijving aangeboden stuk in dubbel
      vervaardigt in de vorm van een mechanische reproduktie. In dat geval dient het ter inschrijving aan te bieden stuk
      te zijn gesteld op een door hem verstrekt formulier of te voldoen aan andere door het bestuurscollege te stellen
      eisen. Het Kadaster is alsdan aansprakelijk voor schade voortvloeiend uit onjuistheden en onvolledigheden in het
      afschrift, ontstaan ten gevolge van de vervaardiging van de mechanische reproduktie. Het vijfde en het zesde lid
      zijn, indien het bepaalde in de eerste volzin toepassing vindt, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      De inschrijving geschiedt door het in bewaring nemen van het afschrift van het stuk, bedoeld in
      [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '12.2'
    text: |-
      De afschriften van de stukken worden zo veel mogelijk gerangschikt in de volgorde waarin zij ter inschrijving zijn
      aangeboden, met vermelding van het tijdstip waarop deze aanbieding is geschied.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      Het bestuurscollege stelt nadere regelen vast omtrent de rangschikking en de wijze van opberging van de
      afschriften.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel12
  - number: '12.4'
    text: |-
      Indien [artikel 11, zevende lid][ref1], toepassing heeft gevonden geschiedt de inschrijving in afwijking van het
      bepaalde in het eerste lid door de vervaardiging van het afschrift in dubbel, bedoeld in artikel 11, zevende lid.
      Het bepaalde in het tweede en derde lid is alsdan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '13'
    text: |-
      Na de inschrijving, bedoeld in [artikel 12, eerste lid][ref1], worden de ter inschrijving aangeboden stukken aan
      de aanbieder teruggegeven nadat zij door de bewaarder zijn voorzien van een aantekening, vermeldende het kantoor,
      dag, uur en minuut van aanbieding, alsmede het deel van het desbetreffende register waarin en het nummer waaronder
      in dat deel de opberging van het afschrift is geschied, dan wel ingeval [artikel 11, zevende lid][ref2], toepassing
      heeft gevonden, de verwijzing naar de plaats waaronder de desbetreffende mechanische reproduktie is opgeborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '14.1'
    text: |-
      Op de inschrijving van een feit, waarvan de inschrijving alsnog is bevolen overeenkomstig
      [artikel 20, tweede lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1] dan wel opnieuw is verzocht, als bedoeld
      in artikel 20, vierde lid, tweede volzin, van Boek 3 van dat wetboek, zijn de [artikelen 11 tot en met 13][ref2]
      van toepassing, voor zover daarvan in dit artikel niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '14.2'
    text: |-
      Voor een inschrijving, als bedoeld in het eerste lid, wordt vereist het oorspronkelijk aangeboden stuk dat is
      voorzien van de in [artikel 15, tweede lid][ref1], bedoelde verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel15
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '14.3'
    text: |-
      De inschrijving geschiedt, tenzij [artikel 11, zevende lid][ref1], toepassing heeft gevonden, door doorhaling van
      de voorlopige aantekening en door vermelding daarbij van het deel en nummer, bedoeld in [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel13
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '14.4'
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing met dien verstande, dat de bewaarder op het ingeschreven stuk
      eveneens van doorhaling van de voorlopige aantekening melding maakt overeenkomstig door het bestuurscollege daartoe
      vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel13
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.1'
    text: |-
      De boeking, bedoeld in [artikel 20, eerste lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1], geschiedt in het
      register van voorlopige aantekeningen voor goederen als waarop het aangeboden stuk betrekking heeft, met vermelding
      van de gerezen bedenkingen, alsmede voor zover bekend, van de naam en woonplaats met adres van de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel20
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '20'
  - number: '15.2'
    text: |-
      Na de boeking wordt dat stuk voorzien van een door de bewaarder ondertekende verklaring, vermeldende tenminste
      het kantoor, dag, uur en minuut van aanbieding, onder verwijzing naar de boeking in het desbetreffende
      register van voorlopige aantekeningen, alsmede de gerezen bedenkingen, en wordt het aan de aanbieder
      teruggegeven. Het voor inschrijving vereiste, aangeboden afschrift van het stuk wordt in bewaring genomen.
      [Artikel 12, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel12
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.3'
    text: |-
      Ingeval het voor inschrijving vereiste afschrift niet is aangeboden, vervaardigt de bewaarder een afschrift van het
      in het eerste lid bedoelde stuk overeenkomstig door het bestuurscollege daartoe vast te stellen regelen, waarbij
      het bepaalde in [artikel 11, zevende lid, derde volzin][ref1], van overeenkomstige toepassing is. Het bepaalde in
      de vorige volzin is van overeenkomstige toepassing met betrekking tot in het eerste lid bedoelde stukken waarop ten
      aanzien van de inschrijving artikel 11, vierde lid, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.4'
    text: |-
      Het bestuurscollege stelt voorts regelen vast in welke van de gevallen, waarin het in
      [artikel 11, eerste lid][ref1], bedoelde formulier niet met inachtneming van de in artikel 11, zesde lid, bedoelde
      vereisten is ingevuld of aangeboden, de bewaarder een afschrift vervaardigt van het stuk waarvan de inschrijving
      is geweigerd, en op welke wijze deze vervaardiging geschiedt. [Artikel 12, tweede en derde lid][ref2], is van
      overeenkomstige toepassing. Het aangeboden afschrift wordt opgeborgen in het desbetreffende register van voorlopige
      aantekeningen bij het desbetreffende door de bewaarder vervaardigde afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel12
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.5'
    text: |-
      Indien [artikel 11, zevende lid][ref1], toepassing heeft gevonden, vervaardigt de bewaarder, alvorens het stuk
      waarvan de inschrijving is geweigerd, aan de aanbieder terug te geven, voor zover mogelijk een afschrift van dat
      stuk overeenkomstig door het bestuurscollege daartoe vast te stellen regelen. Artikel 11, zevende lid, derde volzin
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.6'
    text: |-
      Het bepaalde in het eerste en tweede lid is mede van overeenkomstige toepassing op de boeking van de aanbieding van
      een stuk, dat krachtens [artikel 37, tweede lid][ref1], slechts op bevel van de rechter kan worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '16.1'
    text: |-
      Van aan de bewaarder uitgebrachte oproepingen, als bedoeld in
      [artikel 20, vierde lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1], en van uitspraken van de rechter in
      eerste aanleg, aangespannen ter verkrijging van het in artikel 20, tweede lid, van Boek 3 van dat wetboek bedoelde
      bevel, wordt aantekening gehouden in het desbetreffende register van voorlopige aantekeningen overeenkomstig door
      het Kadaster daartoe vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel20
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '20'
  - number: '16.2'
    text: |-
      Het bestuurscollege stelt voorts regelen vast omtrent de wijze waarop in het register van voorlopige aantekeningen
      de in [artikel 15, eerste lid][ref1], bedoelde boeking geschiedt, alsmede omtrent de wijze van doorhaling van
      voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel15
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '16.3'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van oproepingen uitgebracht aan de
      bewaarder ter verkrijging van een bevel van de rechter tot inschrijving van een notariële verklaring, bedoeld
      in [artikel 37, eerste lid, onder c][ref1]. Het bepaalde in het tweede lid is van overeenkomstige toepassing ten
      aanzien van de in artikel 37, tweede lid, eerste volzin, bedoelde boeking en de doorhaling van een zodanige boeking
      in het register van voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '17'
    text: |-
      Het bestuurscollege stelt de vorm vast van het bewijs van ontvangst, bedoeld in
      [artikel 18 van Boek 3 van het Burgerlijk Wetboek BES][ref1], alsmede regelen omtrent de
      wijze waarop op dat bewijs de verrichte inschrijving desverlangd wordt aangetekend, bedoeld in
      [artikel 19, derde lid, van Boek 3 van dat wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel19
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '19'
  - number: '18.1'
    text: |-
      Onverminderd de overige uit deze titel voortvloeiende eisen, moet een ter inschrijving aangeboden notariële akte,
      notariële verklaring of authentiek afschrift of uittreksel van een zodanige akte of verklaring vermelden:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: 18.1.1°
    text: |-
      naam, voornamen, geboortedatum en -plaats, woonplaats met adres en burgerlijke staat van de natuurlijke personen
      die blijkens het aangeboden stuk daarbij als partij zijn opgetreden;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: 18.1.2°
    text: |-
      aard, naam en woonplaats met adres van de rechtspersonen die blijkens het aangeboden stuk daarbij als partij zijn
      opgetreden;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: 18.1.3°
    text: |-
      dezelfde gegevens, behoudens de burgerlijke staat, ten aanzien van natuurlijke personen en rechtspersonen die
      blijkens het aangeboden stuk de voormelde partijen hebben vertegenwoordigd, alsmede de grond van hun bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      Andere ter inschrijving aangeboden stukken vermelden, zo mogelijk, dezelfde gegevens als in het eerste lid
      omschreven, tenzij anders voortvloeit uit hetgeen de wet voor een stuk van de aard als waarom het gaat, ten aanzien
      van de vermelding van voornamen, namen en woonplaatsen voorschrijft.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: '18.3'
    text: |-
      In elk geval worden de in het eerste lid omschreven gegevens opgegeven van de partij ten behoeve van wie de
      aanbieding ter inschrijving geschiedt. Zo het ter inschrijving aangeboden stuk één of meer van deze gegevens
      niet vermeldt en naar zijn aard niet voor aanvulling te dier zake vatbaar is, wordt vermelding van de ontbrekende
      gegevens en, zo opgave van één of meer dezer gegevens niet mogelijk is, de vermelding van de redenen daarvan in een
      nadere door of namens die partij ondertekende verklaring alsnog op het stuk gesteld of daaraan gehecht.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: '18.4'
    text: |-
      Zo een partij geen woonplaats heeft in het openbaar lichaam, waarin de inschrijving of teboekstelling plaatsvindt,
      kiest zij ter zake van de inschrijving in dat openbaar lichaam een woonplaats.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: '18.5'
    text: |-
      Indien een partij in een ter inschrijving aangeboden stuk woonplaats heeft gekozen in het openbaar lichaam, waarin
      de inschrijving of teboekstelling plaatsvindt, wordt niettemin daarin ook de wettelijke woonplaats met adres
      vermeld.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Ingeval het ter inschrijving aangeboden stuk betrekking heeft op een bepaald reeds eerder ingeschreven stuk, bevat
      het een verwijzing naar dit eerdere stuk overeenkomstig door het bestuurscollege daartoe vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel19
  - number: '20.1'
    text: |-
      Indien een stuk ter inschrijving wordt aangeboden en het daarin vermelde in te schrijven feit betrekking heeft
      op een onroerende zaak of op een recht waaraan een zodanige zaak is onderworpen, vermeldt dit stuk de aard, de
      plaatselijke aanduiding zo deze er is, en de kadastrale aanduiding van die onroerende zaak onderscheidenlijk van
      de onroerende zaak die aan dat recht is onderworpen. Ontbreekt een kadastrale aanduiding dan is een meetbrief
      vereist. Indien het in te schrijven feit betrekking heeft op een appartementsrecht, wordt in het ter inschrijving
      aangeboden stuk vermeld de plaatselijke aanduiding van het desbetreffende gedeelte van het gebouw dat is bestemd om
      als afzonderlijk geheel te worden gebruikt, alsmede de aard en de kadastrale aanduiding van dat appartementsrecht.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel20
  - number: '20.2'
    text: |-
      Het bestuurscollege kan regelen vaststellen omtrent de wijze waarop de plaatselijke aanduiding, bedoeld in het
      eerste lid, in het ter inschrijving aangeboden stuk wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Indien het in te schrijven feit betrekking heeft op een in de registratie voor schepen te boek staand schip of op
      een recht waaraan een zodanige zaak is onderworpen, bevat het ter inschrijving aangeboden stuk:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
  - number: 21.1.a
    text: de naam van het schip met vermelding van het gebruik waartoe het is bestemd, en zijn bruto-inhoud of bruto-tonnage;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
  - number: 21.1.b
    text: |-
      het type en de inrichting van het schip, het materiaal waarvan de romp is gemaakt, jaar en plaats van de bouw,
      en, voor zover het een schip met een mechanische voortstuwing betreft, ook al betreft het slechts een hulpmotor,
      het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met
      aanduiding van de plaats waar dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
  - number: 21.1.c
    text: |-
      het nummer waaronder de inschrijving van het verzoek tot teboekstelling van het schip in het desbetreffende
      register is geschied, de door het Kadaster vastgestelde afkorting van een schip ter onderscheiding van andere
      schepen dan bedoeld in [artikel 1, eerste lid][ref1], de aanduiding van het kantoor waar de teboekstelling is
      geschied, en het jaar van teboekstelling, welke gegevens tezamen in genoemde volgorde het brandmerk van het schip
      vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel1
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '1'
        hoofdstuk: '1'
  - number: '21.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op ter inschrijving aangeboden rechterlijke uitspraken. Deze
      stukken kunnen, onverminderd andere vereisten gesteld bij of krachtens de wet, echter slechts worden ingeschreven,
      indien en voor zover de identiteit van het desbetreffende schip voldoende vaststaat.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan worden volstaan met het vermelden van de naam van het schip en
      de in dat lid, onder c, genoemde gegevens in het ter inschrijving aangeboden stuk, indien dat stuk betreft:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
  - number: 21.3.a
    text: |-
      de doorhaling van de teboekstelling van een schip, bedoeld in
      [artikel 195, eerste lid, van Boek 8 van het Burgerlijk Wetboek BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel195
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '195'
  - number: 21.3.b
    text: |-
      de aangifte van de eigenaar inhoudende dat het schip een wijziging heeft ondergaan waardoor de beschrijving van het
      schip in de registratie voor schepen niet meer aan de werkelijkheid beantwoordt;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
  - number: 21.3.c
    text: |-
      een afwijkend beding, als bedoeld in [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek BES][ref1];
      dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel1
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '1'
  - number: 21.3.d
    text: de verandering van een door de eigenaar van een schip in een ingeschreven stuk gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel21
  - number: '22.1'
    text: |-
      Indien het in te schrijven feit betrekking heeft op een in de registratie voor luchtvaartuigen te boek staand
      luchtvaartuig of op een recht waaraan een zodanige zaak is onderworpen, bevat het ter inschrijving aangeboden stuk:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel22
  - number: 22.1.a
    text: |-
      het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld in
      [artikel 3.2, eerste lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 22.1.b
    text: |-
      de naam en woonplaats van de fabrikant en het type van het luchtvaartuig, jaar en plaats van de bouw, het
      fabrieksnummer zo het luchtvaartuig dat heeft, met vermelding van de plaats waar dit nummer is aangebracht, en
      het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met
      aanduiding van de plaats waar dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel22
  - number: 22.1.c
    text: de maximaal toegelaten massa van het luchtvaartuig en, indien het luchtvaartuig een naam voert, de naam ervan;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel22
  - number: 22.1.d
    text: |-
      het nummer waaronder de inschrijving van het verzoek tot teboekstelling van dat luchtvaartuig in het desbetreffende
      register is geschied.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 21, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel21
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '23'
    text: |-
      Vermeldt een ter inschrijving aangeboden stuk niet één of meer der gegevens, in de
      [artikelen 19 tot en met 22][ref1] voor een zodanig stuk voorgeschreven, en is het naar zijn aard niet voor
      aanvulling te dier zake vatbaar, dan wordt de vermelding van de ontbrekende gegevens in een nadere, door degene die
      de inschrijving verlangt, ondertekende, verklaring alsnog op het stuk gesteld of daaraan gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel19
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '19'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '24.1'
    text: |-
      Ter inschrijving van een akte van levering, vereist voor de overdracht van een registergoed, voor de vestiging,
      afstand of wijziging van een beperkt recht dat een registergoed is, of voor de overgang van een registergoed na
      toedeling uit hoofde van de verdeling van een gemeenschap, wordt aangeboden de notariële akte betreffende deze
      levering, dan wel een authentiek afschrift of een authentiek uittreksel daarvan. In geval van vestiging van een
      recht van hypotheek op een schip in aanbouw wordt mede ter inschrijving aangeboden een verklaring van een door het
      bestuurscollege aangewezen functionaris, inhoudende dat de bouw van het schip nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: '24.2'
    text: 'Het ter inschrijving aangeboden stuk, bedoeld in het eerste lid, bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.a
    text: 'de titel op grond waarvan de levering plaatsvindt en, in geval van vestiging van een recht van hypotheek, tevens:'
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.a.1°
    text: |-
      een aanduiding van de vordering waarvoor het recht van hypotheek tot zekerheid strekt, of van de feiten aan de hand
      waarvan die vordering zal kunnen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.a.2°
    text: |-
      het bedrag waarvoor het recht van hypotheek wordt gevestigd of, wanneer dit bedrag nog niet vaststaat, het
      maximumbedrag dat uit hoofde van dat recht van hypotheek op het goed kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.a.3°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand schip of op een recht waaraan een zodanige
      zaak is onderworpen, bovendien: een duidelijke vermelding van het aan de hypotheek onderworpen schip;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.a.4°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand luchtvaartuig, bovendien: een duidelijke
      vermelding van het aan de hypotheek onderworpen luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.b
    text: |-
      de wettelijke benaming van het recht, op levering waarvan het ter inschrijving aangeboden stuk betrekking heeft, of
      in geval dat recht geen wettelijke benaming heeft:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.b.1°
    text: de gangbare benaming, dan wel de vermelding dat het recht geen gangbare benaming heeft;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.b.2°
    text: de wetsbepaling volgens welke het recht kan worden gevestigd of een registergoed is;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
  - number: 24.2.b.3°
    text: |-
      in geval van een recht van grondrente als bedoeld in
      [artikel 100 van de Overgangswet nieuw Burgerlijk Wetboek BES][ref1], de omschrijving van de inhoud van dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel100
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '100'
  - number: '24.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de inschrijving van
      het proces-verbaal van toewijzing, bedoeld in de [artikelen 525, eerste lid][ref1], en
      [584o, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref2], onverminderd hetgeen in ieder van de
      artikelen in het tweede lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel525
      [ref2]: https://wetten.overheid.nl/BWBR0028496#Artikel584o
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '525'
      - id: ref2
        bwb_id: BWBR0028496
        artikel: 584o
  - number: '24.4'
    text: |-
      Het aangeboden stuk mag op meer leveringen, als bedoeld in het eerste lid, betrekking hebben, voor zover voor ieder
      daarvan aan de in de vorige leden gestelde eisen is voldaan. Betreft het stuk een overdracht onder voorbehoud van
      een beperkt recht of van een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek BES][ref1],
      dan wordt de vestiging van dit recht dan wel het op zich nemen van het beding afzonderlijk en duidelijk vermeld,
      bij gebreke waarvan de inschrijving van het stuk geacht wordt niet mede dit recht of dit beding te betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel252
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '252'
  - number: '24.5'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de inschrijving van een akte van grensvastlegging, opgemaakt
      krachtens [artikel 31 van Boek 5 van het Burgerlijk Wetboek BES][ref1], alsmede op de inschrijving van een akte van
      splitsing, als bedoeld in [artikel 109, eerste lid, van Boek 5 van dat wetboek][ref2], en een akte tot wijziging of
      opheffing van een zodanige splitsing.


      [ref1]: https://wetten.overheid.nl/BWBR0028748#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel109
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028748
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: '109'
  - number: '25.1'
    text: |-
      Ter inschrijving van een rechterlijke uitspraak die voor een akte van levering in de plaats treedt of die
      anderszins krachtens wetsbepaling kan worden ingeschreven, wordt een expeditie van de rechterlijke uitspraak
      aangeboden, alsmede:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel25
  - number: 25.1.a
    text: |-
      indien de rechterlijke uitspraak slechts inschrijfbaar is, nadat zij in kracht van gewijsde is gegaan: een
      verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan, inhoudende dat daartegen geen gewoon
      rechtsmiddel meer openstaat;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel25
  - number: 25.1.b
    text: |-
      indien de onder a bedoelde eis voor inschrijfbaarheid niet is gesteld en de rechterlijke uitspraak niet uitvoerbaar
      bij voorraad is: een verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan, inhoudende hetzij
      dat daartegen geen gewoon rechtsmiddel meer openstaat, hetzij dat hem zes weken na de uitspraak niet van het
      instellen van een gewoon rechtsmiddel is gebleken; betreft het een beroep in cassatie dan is een verklaring vereist
      van de griffier van de Hoge Raad der Nederlanden, inhoudende dat hem drie maanden na de uitspraak niet van een
      beroep in cassatie is gebleken;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel25
  - number: 25.1.c
    text: |-
      indien voor de inschrijving betekening aan de veroordeelde vereist is, een door de deurwaarder getekend afschrift
      van het exploit waarbij de betekening is geschied.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel25
  - number: '25.2'
    text: |-
      Ter inschrijving van een beslissing van de rechter van een vreemde Staat wordt een authentiek afschrift van deze
      beslissing aangeboden.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel25
  - number: '25.3'
    text: |-
      Bestaat de rechterlijke uitspraak in een verlof tot tenuitvoerlegging van een beslissing van arbiters, dan wordt
      ook een afschrift van deze beslissing aangeboden, getekend door de griffier van het gerecht dat het verlof gaf.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      Ter inschrijving van een rechtshandeling naar burgerlijk recht die krachtens wetsbepaling kan worden ingeschreven,
      wordt, tenzij anders is bepaald, aangeboden een door een notaris met inachtneming van [artikel 37][ref1] opgemaakte
      verklaring, inhoudende dat de rechtshandeling naar de verklaring van degene die de inschrijving verlangt, is
      verricht en wat zij inhoudt, met daaraan gehecht de stukken waaruit van die rechtshandeling blijkt, of authentieke
      afschriften van die verklaring van de notaris en van die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '26.2'
    text: |-
      Ingeval voor de rechtshandeling of de inschrijving daarvan een notariële akte is vereist, wordt aangeboden hetzij
      die akte, hetzij een authentiek afschrift of een authentiek uittreksel daarvan.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel26
  - number: '26.3'
    text: |-
      Ingeval van de rechtshandeling een notariële akte is opgemaakt, zonder dat dit vereist was, kan naar keuze van
      degene die de inschrijving verlangt het eerste of tweede lid worden toegepast.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel26
  - number: '26.4'
    text: |-
      Ingeval het gaat om een eenzijdige tot één of meer bepaalde personen gerichte rechtshandeling, kan worden volstaan
      met aanbieding van een aan die persoon of personen uitgebracht exploit, waarbij die rechtshandeling is verricht of
      tijdig bevestigd, of een authentiek afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel26
  - number: '26.5'
    text: |-
      Ter inschrijving van een afwijkend beding, als bedoeld in
      [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek BES][ref1], wordt, in afwijking van het bepaalde in
      het eerste lid, een door de eigenaar van het schip ondertekende verklaring aangeboden, waarin het scheepstoebehoren
      ten aanzien waarvan het afwijkend beding is gemaakt, eenduidig is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel1
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '1'
  - number: '27.1'
    text: |-
      Ter inschrijving van erfopvolgingen die registergoederen betreffen, wordt een door een notaris opgemaakte
      verklaring van erfrecht, dan wel een authentiek afschrift van de verklaring van de notaris aangeboden, waaruit van
      de erfopvolging blijkt.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      Ter inschrijving van een executele of een bij uiterste wilsbeschikking ingesteld bewind wordt een door een notaris
      opgemaakte verklaring van erfrecht of een authentiek afschrift van de verklaring van de notaris aangeboden, waaruit
      van deze executele, onderscheidenlijk van dit bewind blijkt.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel27
  - number: '28'
    text: |-
      Ter inschrijving van de aanvaarding van een nalatenschap onder voorrecht van boedelbeschrijving of van de
      verwerping van een nalatenschap wordt een door de griffier getekende verklaring aangeboden die de inhoud weergeeft
      van de verklaring, krachtens [artikel 1055][ref1] of [1083 van Boek 4 van het Burgerlijk Wetboek BES][ref2] met
      betrekking tot deze aanvaarding of verwerping ter griffie afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1055
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1083
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1055'
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '1083'
  - number: '29'
    text: |-
      Ter inschrijving van de afstand van een huwelijksgemeenschap wordt een door de griffier getekend uittreksel
      uit het huwelijksgoederenregister aangeboden, inhoudende de verklaring betreffende de afstand, die krachtens
      [artikel 104 van Boek 1 van het Burgerlijk Wetboek BES][ref1] in het huwelijksgoederenregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel104
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '104'
  - number: '30.1'
    text: |-
      Ter inschrijving van de vervulling van een voorwaarde, gesteld in een ingeschreven voorwaardelijke rechtshandeling,
      of van de verschijning van een onzeker tijdstip, aangeduid in de aan een ingeschreven rechtshandeling verbonden
      tijdsbepaling, wordt aangeboden een door een notaris met inachtneming van [artikel 37][ref1] opgemaakte
      verklaring, inhoudende dat naar de verklaring van degene die de inschrijving verlangt, de voorwaarde is vervuld,
      onderscheidenlijk het tijdstip is verschenen, met daaraan gehecht de stukken waaruit van deze vervulling of
      verschijning blijkt, of authentieke afschriften van de verklaring van de notaris en van die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '30.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de inschrijving van de dood van de vruchtgebruiker van een
      registergoed. De verklaring van de notaris houdt in dit geval tevens in:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel30
  - number: 30.2.a
    text: het tijdstip van overlijden van de vruchtgebruiker, en
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel30
  - number: 30.2.b
    text: |-
      of het vruchtgebruik is vervallen, dan wel bij wie het vruchtgebruik na de dood van de vruchtgebruiker is
      verbleven.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel30
  - number: '31'
    text: |-
      Op de inschrijving van reglementen en andere regelingen die tussen medegerechtigden in registergoederen zijn
      vastgesteld, zijn van overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel31
  - number: 31.a
    text: |-
      voor zover het reglement of de regeling door de rechter is vastgesteld: [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel25
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '25'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 31.b
    text: |-
      voor zover het reglement of de regeling bij rechtshandeling is vastgesteld: [artikel 26, eerste en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel26
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '32.1'
    text: |-
      Ter inschrijving van een proces-verbaal van inbeslagneming wordt dit proces-verbaal of een door de deurwaarder of
      een advocaat getekend afschrift daarvan aangeboden. [Artikel 18, tweede tot en met vijfde lid][ref1], is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '32.2'
    text: |-
      Ingeval een proces-verbaal van inbeslagneming van een luchtvaartuig in het buitenland is opgemaakt door een
      deurwaarder of andere volgens de daar geldende wet hiertoe bevoegde persoon, kan ook een zodanig proces-verbaal ter
      inschrijving worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
  - number: '32.3'
    text: |-
      Ter inschrijving van een der in [artikel 211 van Boek 8 van het Burgerlijk Wetboek BES][ref1] genoemde voorrechten,
      wordt aangeboden een door een deurwaarder ondertekend verzoek tot inschrijving van het voorrecht, inhoudende naar
      de verklaring van degene die de inschrijving verlangt:


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel211
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '211'
  - number: 32.3.a
    text: de aanduiding van de vordering waar het om gaat;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
  - number: 32.3.b
    text: |-
      het beloop der vordering ten tijde van het ondertekenen door de deurwaarder van het verzoek, of van de feiten aan
      de hand waarvan die vordering zal kunnen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
  - number: 32.3.c
    text: |-
      de omschrijving van het voorrecht door vermelding van het wettelijk voorschrift, op grond waarvan aan die vordering
      het voorrecht is toegekend, en
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
  - number: 32.3.d
    text: het tijdstip waarop de vordering is ontstaan.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
  - number: '32.4'
    text: |-
      Op de inschrijving van een voorrecht, als bedoeld in artikel
      [1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek BES][ref1] is het bepaalde in de eerste volzin van het
      derde lid van overeenkomstige toepassing. Indien het verzoek van de deurwaarder ter inschrijving wordt aangeboden
      drie maanden of langer na het in die volzin, onder d, bedoelde tijdstip, wordt ter inschrijving tevens aangeboden
      een stuk waaruit blijkt dat binnen de in artikel 1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek BES
      genoemde termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel1320
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '1320'
  - number: 32.4.a
    text: het bedrag der vordering in der minne is vastgesteld, dan wel
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
  - number: 32.4.b
    text: |-
      langs gerechtelijke weg erkenning van het voorrecht en de omvang ervan is gevorderd, op de inschrijving van welk
      bewijsstuk in het onder b bedoelde geval [artikel 38][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel38
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '33.1'
    text: |-
      Ter inschrijving van een verandering in de voornaam of de geslachtsnaam van tot registergoederen gerechtigde
      natuurlijke personen wordt een door of namens deze persoon ondertekend stuk aangeboden, inhoudende de gegevens,
      bedoeld in [artikel 18, eerste lid, onder 1°][ref1], met vermelding van de oude en de nieuwe naam of voornaam,
      en de dag waarop de verandering is ingegaan. Indien de verandering blijkt uit de registers van de burgerlijke
      stand, wordt een uittreksel daaruit overgelegd, dat de verandering relateert. In andere gevallen wordt een ander
      bewijsstuk betreffende deze verandering overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.2'
    text: |-
      Ter inschrijving van de naamsverandering van een rechtspersoon wordt een opgave van een notaris aangeboden,
      inhoudende de gegevens, bedoeld in [artikel 18, eerste lid, onder 2°][ref1], met vermelding van de oude en de
      nieuwe naam en de dag waarop de verandering is ingegaan. Gaat het om een publiekrechtelijke rechtspersoon, dan kan
      deze de opgave zelf doen.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.3'
    text: |-
      Ter inschrijving van een omzetting van een rechtspersoon, als bedoeld in
      [artikel 300 van Boek 2 van het Burgerlijk Wetboek BES][ref1], wordt een opgave van een notaris aangeboden,
      inhoudende de in [artikel 18, eerste lid, onder 2°][ref2], bedoelde gegevens, met vermelding van de oude en nieuwe
      rechtsvorm, de oude en nieuwe naam alsmede van de dag waarop de omzetting van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel300
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '300'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.4'
    text: |-
      Ter inschrijving van een fusie van rechtspersonen, als bedoeld in
      [artikel 309 van Boek 2 van het Burgerlijk Wetboek BES][ref1], wordt een opgave van een notaris aangeboden,
      inhoudende met betrekking tot elk der fuserende rechtspersonen en, zo de verkrijgende rechtspersoon een door
      hen samen bij de fusie opgerichte nieuwe rechtspersoon is, tevens met betrekking tot die rechtspersoon de in
      [artikel 18, eerste lid, onder 2°][ref2], bedoelde gegevens, met vermelding wie de verkrijgende rechtspersoon is
      alsmede van de dag waarop de fusie van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.5'
    text: |-
      Ter inschrijving van een splitsing van rechtspersonen als bedoeld in
      [artikel 335 van Boek 2 van het Burgerlijk Wetboek BES][ref1], wordt een opgave van een notaris aangeboden,
      inhoudende met betrekking tot elke partij bij de splitsing en, zo bij de splitsing verkrijgende rechtspersonen
      worden opgericht, tevens met betrekking tot die rechtspersonen de in [artikel 18, eerste lid, onder 2°][ref2],
      bedoelde gegevens, met vermelding op welke verkrijgende rechtspersoon welke registergoederen zijn overgegaan
      alsmede van de dag waarop de splitsing van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel335
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '335'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '34'
    text: |-
      Ter inschrijving van een verjaring wordt een door een notaris met inachtneming van [artikel 37][ref1] opgemaakte
      verklaring of een authentiek afschrift daarvan aangeboden, inhoudende dat naar de verklaring van degene die de
      inschrijving verlangt, de verjaring is ingetreden, alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 34.a
    text: welk registergoed door verjaring is verkregen, dan wel welk beperkt recht op een registergoed is tenietgegaan;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel34
  - number: 34.b
    text: tegen wie de verjaring werkt, indien dit bekend is;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel34
  - number: 34.c
    text: welke feiten tot de verjaring hebben geleid; en
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel34
  - number: 34.d
    text: dat de verjaring wordt betwist of niet wordt betwist door degene tegen wie zij werkt, zo dit bekend is.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      Ter inschrijving van een of meer verklaringen van waardeloosheid, als bedoeld in
      [artikel 28 van Boek 3 van het Burgerlijk Wetboek BES][ref1], wordt een door een notaris opgemaakte verklaring
      aangeboden, die inhoudt dat degenen te wier behoeve de inschrijving zou hebben gestrekt, schriftelijk hebben
      verklaard dat zij waardeloos is, en waaraan deze schriftelijke verklaringen zijn gehecht, dan wel een authentiek
      afschrift van de verklaring van de notaris en de daaraan gehechte verklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel28
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '28'
  - number: '35.2'
    text: |-
      Tenzij de inschrijving een hypotheek of een beslag betreft, vermelden de in het eerste lid bedoelde schriftelijke
      verklaringen van degenen te wier behoeve de inschrijving zou hebben gestrekt, tevens de feiten waarop de
      waardeloosheid berust, en houdt de in dat lid bedoelde verklaring van de notaris tevens in dat de vermelde feiten
      een rechtsgrond voor de waardeloosheid van de inschrijving opleveren.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel35
  - number: '35.3'
    text: |-
      Ter inschrijving van een verklaring, als bedoeld in [artikel 273 van Boek 3 van het Burgerlijk Wetboek BES][ref1],
      wordt aangeboden die verklaring of een authentiek afschrift daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel273
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '273'
  - number: '35.4'
    text: |-
      Ter inschrijving van een verklaring, als bedoeld in [artikel 274 van Boek 3 van het Burgerlijk Wetboek BES][ref1],
      wordt aangeboden de desbetreffende authentieke akte of een authentiek afschrift daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel274
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '274'
  - number: '36.1'
    text: |-
      Ter inschrijving van het feit dat het nut van een mandelige zaak voor elk der erven is geëindigd, wordt een
      door een notaris met inachtneming van [artikel 37][ref1] opgemaakte verklaring aangeboden, inhoudende dat naar
      de verklaring van hen die de inschrijving verlangen, het nut voor elk der erven is geëindigd, of een authentiek
      afschrift van de verklaring van de notaris. Werken niet alle rechthebbenden op de mandelige zaak mee, dan vermeldt
      de notaris in zijn verklaring de reden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '36.2'
    text: |-
      Ter inschrijving van het bestaan van een grondrente als bedoeld in
      [artikel 100 van de Overgangswet nieuw Burgerlijk Wetboek BES][ref1], wordt een door een notaris met inachtneming
      van [artikel 37][ref2] opgemaakte verklaring aangeboden, waarin het bestaan van het recht wordt geconstateerd, en
      die tevens inhoudt:


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 36.2.a
    text: de omschrijving van de inhoud van het recht;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel36
  - number: 36.2.b
    text: |-
      wie de rechthebbende op dat recht is, met daaraan gehecht de stukken waaruit een en ander blijkt, of authentieke
      afschriften van die verklaring en die stukken.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel36
  - number: '36.3'
    text: |-
      Ter inschrijving van het ontstaan van een erfdienstbaarheid door bestemming of herleving, bedoeld in
      [artikel 111, eerste volzin, van de Overgangswet nieuw Burgerlijk Wetboek BES][ref1], wordt een door een
      notaris met inachtneming van [artikel 37][ref2] opgemaakte verklaring aangeboden, waarin het ontstaan van de
      erfdienstbaarheid wordt geconstateerd, en die tevens inhoudt:


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel37
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028466
        artikel: '111'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 36.3.a
    text: de omschrijving van de inhoud van de erfdienstbaarheid, en
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel36
  - number: 36.3.b
    text: |-
      wie de rechthebbende op dat recht is, met daaraan gehecht de stukken waaruit van een en ander blijkt, of
      authentieke afschriften van die verklaring en die stukken.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel36
  - number: '37.1'
    text: |-
      Een notariële verklaring, als bedoeld in de [artikelen 26][ref1], [30][ref2], [34][ref3] en [36][ref4] houdt
      behalve hetgeen in deze artikelen is voorgeschreven, tevens in een verklaring van de notaris:


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0028516#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0028516#Artikel36
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028516
        artikel: '34'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0028516
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 37.1.a
    text: |-
      hetzij dat allen die als partij bij het in te schrijven feit betrokken zijn aan de notaris hebben medegedeeld met
      de inschrijving in te stemmen;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel37
  - number: 37.1.b
    text: |-
      hetzij dat bewijsstukken aan hem zijn overgelegd en aan de verklaring gehecht, die genoegzaam aantonen dat
      het in te schrijven feit zich inderdaad heeft voorgedaan dan wel, in geval van een verklaring als bedoeld in
      [artikel 36, tweede lid][ref1], dat het recht bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel36
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 37.1.c
    text: hetzij dat hij niet aan het onder a en b gestelde kan voldoen.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel37
  - number: '37.2'
    text: |-
      In het in het eerste lid, onder c, bedoelde geval boekt de bewaarder de aanbieding van de notariële
      verklaring slechts in het register van voorlopige aantekeningen en kan inschrijving alleen
      plaatsvinden op bevel van de rechter. Het tweede, derde en vierde lid, eerste volzin, alsmede het
      [vijfde en zesde lid van artikel 20 van Boek 3 van het Burgerlijk Wetboek BES][ref1] zijn van overeenkomstige
      toepassing met dien verstande, dat het bevel slechts wordt gegeven, indien de eiser naast de bewaarder allen die
      als partij bij het in te schrijven feit zijn betrokken, tijdig in het geding heeft geroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel20
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '20'
  - number: '37.3'
    text: |-
      De kosten van het geding blijven voor rekening van de eiser, tenzij de vordering ondanks verweer wordt toegewezen,
      in welk geval degene die het verweer heeft gevoerd in de kosten wordt veroordeeld.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel37
  - number: '37.4'
    text: |-
      Wanneer het aangeboden stuk ook overigens niet aan de vereisten voor inschrijving voldoet,
      vermeldt de bewaarder bij de voorlopige aantekening tevens de gerezen bedenkingen en is
      [artikel 20 van Boek 3 van het Burgerlijk Wetboek BES][ref1] in dier voege van toepassing dat het daarbedoelde
      bevel slechts tezamen met dat uit hoofde van het tweede lid kan worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel20
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '20'
  - number: '38.1'
    text: |-
      Ter inschrijving van het instellen van een rechtsvordering of de indiening van een verzoekschrift ter verkrijging
      van een rechterlijke uitspraak die de rechtstoestand van een registergoed betreft, wordt aangeboden een afschrift
      daarvan, getekend door de griffier van het gerecht waar de zaak aanhangig is.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel38
  - number: '38.2'
    text: |-
      [Artikel 18, tweede tot en met vijfde lid][ref1], is niet van toepassing, behoudens dat het aangeboden stuk in elk
      geval de naam en een ter zake van het geding gekozen woonplaats met adres van degene te wiens behoeve de aanbieding
      geschiedt, moet bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '39'
    text: |-
      Ter inschrijving van de instelling van een rechtsmiddel tegen een rechterlijke uitspraak, als bedoeld in
      [artikel 38][ref1], is dat artikel van overeenkomstige toepassing. Indien het ingestelde rechtsmiddel een beroep in
      cassatie is, wordt aangeboden een door de griffier van Het Gemeenschappelijk Hof van Justitie van Curaçao, Aruba,
      Sint Maarten en van Bonaire, Sint Eustatius en Saba of door de griffier van de Hoge Raad der Nederlanden getekende
      verklaring dat beroep in cassatie is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel38
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '40'
    text: |-
      Ter inschrijving van de waardeloosheid van een overeenkomstig [artikel 38][ref1] of [artikel 39][ref2] verkregen
      inschrijving, kan ook worden aangeboden:


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028516#Artikel39
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028516
        artikel: '39'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 40.a
    text: |-
      een daartoe strekkende verklaring, afgegeven door een deurwaarder of gemachtigde die optreedt voor de eiser, de
      verzoeker of degene die het rechtsmiddel heeft ingesteld;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel40
  - number: 40.b
    text: een rechterlijke uitspraak die ertoe strekt dat een zodanige inschrijving waardeloos is.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel40
  - number: '41.1'
    text: |-
      Ter inschrijving van een feit dat is opgenomen in een stuk gesteld in een andere taal dan het Nederlands, het
      Engels of het Papiamento, wordt naast dat ter inschrijving aangeboden stuk een letterlijke vertaling in het
      Nederlands, het Engels of het Papiamento ter inschrijving aangeboden, vervaardigd en voor overeenstemmend verklaard
      door een voor die taal als bevoegd toegelaten beëdigd vertaler.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel41
  - number: '41.2'
    text: |-
      Het bepaalde in het eerste lid lijdt uitzondering ingeval met betrekking tot luchtvaartuigen een proces-verbaal
      van inbeslagneming, opgemaakt in het buitenland door een deurwaarder of door een andere volgens de daar geldende
      wet daartoe bevoegde persoon en gesteld in een vreemde taal, aan de bewaarder wordt toegezonden of bij deze wordt
      ingeleverd. Alsdan wordt door de zorg van de aanbieder zo spoedig mogelijk een vertaling van een zodanig proces-
      verbaal vervaardigd door een hier te lande toegelaten beëdigd vertaler.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel41
  - number: '41.3'
    text: |-
      De vertalingen worden ingeschreven in plaats van de in de vreemde taal gestelde stukken, die onder de bewaarder
      blijven berusten.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel41
  - number: '42'
    text: |-
      Op de inschrijving van stukken tot verbetering van onjuistheden en onvolledigheden in ingeschreven stukken, zijn de
      bepalingen, gegeven bij of krachtens dit hoofdstuk, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel42
  - number: '43'
    text: |-
      Indien het ter inschrijving aangeboden stuk waarin het in te schrijven feit is opgenomen, niet voldoet aan de
      vereisten, gesteld in de [artikelen 18 tot en met 42][ref1], kan het met ontbrekende gegevens worden aangevuld door
      een verklaring aan de voet van het stuk, ondertekend door degene die bevoegd is tot het opmaken en ondertekenen van
      een zodanig stuk, een en ander voor zover de aard van het stuk zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '44.1'
    text: |-
      Stukken die voor bewijs bij de aanbieding van een stuk worden overgelegd, worden slechts mede ingeschreven, indien
      de wet dit eist of de aanbieder dit verlangt, tenzij bij wet is bepaald dat de desbetreffende stukken niet worden
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel44
  - number: '44.2'
    text: |-
      Door de bewaarder wordt, overeenkomstig door het bestuurscollege te stellen regels, van de overlegging melding
      gemaakt op het ter inschrijving aangeboden stuk, alsmede ingeval [artikel 11, zevende lid][ref1], geen toepassing
      heeft gevonden, op het afschrift van dat stuk. De stukken die moeten worden overgelegd maar waarvan de inschrijving
      niet wordt geëist of verlangd, worden onverwijld aan de aanbieder teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '45.1'
    text: |-
      Bij algemene maatregel van bestuur, kunnen regelen worden gesteld omtrent de vereisten waaraan stukken
      dienen te voldoen die worden aangeboden ter inschrijving van andere inschrijfbare feiten dan die waarop de
      [artikelen 24 tot en met 40][ref1] betrekking hebben, voor zover dit niet reeds in deze dan wel bij of krachtens
      een andere wet is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel24
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '24'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '45.2'
    text: |-
      Voor zover bij het in het eerste lid bedoelde maatregel niet anders is bepaald, wordt ter inschrijving van
      een beschikking of van een uitspraak waarbij een beschikking werd vernietigd, ingetrokken of gewijzigd, een
      afschrift van die beschikking onderscheidenlijk van die uitspraak aangeboden, afgegeven door het bestuursorgaan
      onderscheidenlijk het rechterlijk orgaan dat de beschikking of de uitspraak gaf.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      Naast feiten die voor de rechtstoestand van registergoederen van belang zijn, kunnen in de openbare registers
      tevens algemene voorwaarden, modelreglementen en andere stukken, die niet op een bepaald registergoed betrekking
      hebben, worden ingeschreven, met het uitsluitend doel dat daarnaar in later ter inschrijving aangeboden stukken
      kan worden verwezen. De [artikelen 18][ref1], [19][ref2], [20, eerste lid, eerste volzin][ref3], [22][ref4] en
      [30 van Boek 3 van het Burgerlijk Wetboek BES][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0028745#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0028745#Artikel30
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0028745
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0028745
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0028745
        artikel: '30'
  - number: '46.2'
    text: |-
      Ter inschrijving van de in het eerste lid bedoelde stukken is naast het stuk zelf vereist een afschrift van dat
      stuk, gesteld op een door de bewaarder verstrekt formulier en voorzien van een verklaring van eensluidendheid. Het
      bepaalde in [artikel 11, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel11
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '46.3'
    text: |-
      De [artikelen 18 tot en met 23][ref1] zijn niet van toepassing. Bij algemene maatregel van bestuur, kunnen eisen
      worden gesteld waaraan ter inschrijving aangeboden stukken, als bedoeld in het eerste lid, moeten voldoen. Het
      bestuurscollege stelt regelen vast omtrent de wijze waarop de verwijzing in de latere stukken geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel18
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '46.4'
    text: |-
      In een ter inschrijving aangeboden stuk kan slechts worden verwezen naar een eerder ingeschreven stuk, indien
      de inschrijving van het later ter inschrijving aangeboden stuk plaatsvindt in het openbaar lichaam waar het stuk
      waarnaar wordt verwezen, reeds is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel46
  - number: '46.5'
    text: |-
      Een verwijzing naar een stuk als bedoeld in het eerste lid, eerste volzin, heeft tot gevolg dat het stuk waarnaar
      in een ter inschrijving aangeboden stuk wordt verwezen, geacht wordt deel uit te maken van de inschrijving die op
      grond van het aangeboden stuk plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel46
  - number: '47.1'
    text: |-
      Een verandering van een in een ingeschreven stuk gekozen woonplaats, een alsnog ter zake van een inschrijving
      gedane keuze van woonplaats en de opheffing van een gekozen woonplaats kunnen worden ingeschreven. Ter inschrijving
      van de verandering, keuze of opheffing wordt een door of namens de belanghebbende ondertekende verklaring
      aangeboden die de nieuwe en de vorige gekozen dan wel wettelijke woonplaats vermeldt, alsmede de datum van ingang.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel47
  - number: '47.2'
    text: |-
      Een krachtens [artikel 18, vierde lid][ref1], van deze wet of de [artikelen 260, eerste lid, van Boek 3][ref2] of
      [252, tweede lid, van Boek 6 van het Burgerlijk Wetboek BES][ref3] gekozen woonplaats, heeft, ongeacht of zij met
      het oorspronkelijke stuk dan wel krachtens het eerste lid is ingeschreven, geen ander gevolg dan dat


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel252
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '260'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '252'
  - number: 47.2.a
    text: daar exploiten kunnen worden uitgebracht die de inschrijving betreffen, ter zake waarvan woonplaats werd gekozen;
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel47
  - number: 47.2.b
    text: |-
      daar de door of krachtens de wet voorgeschreven mededelingen en kennisgevingen van de bewaarder en de dienst kunnen
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel47
  - number: '47.3'
    text: |-
      Door of krachtens deze wet voorgeschreven mededelingen en kennisgevingen worden in elk geval gedaan aan de laatste
      bij de dienst bekende woonplaats van de belanghebbende. In geval van overlijden van een persoon die tot een
      registergoed gerechtigd was, worden zodanige mededelingen en kennisgevingen aan zijn rechtsopvolgers gedaan aan het
      laatste bij de dienst bekende adres van de boedel of, zo deze onbekend is, aan de laatst bekende woonplaats van de
      overleden persoon, alsmede aan de boedelnotaris, zo deze bekend is.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel47
  - number: '99.1'
    text: |-
      Desverlangd verleent de bewaarder inzage van de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], en
      geeft hij voor eensluidend gewaarmerkte afschriften of uittreksels van de in deze registers ingeschreven dan wel
      geboekte stukken, alsmede getuigschriften omtrent het al dan niet bestaan van inschrijvingen dan wel voorlopige
      aantekeningen betreffende een registergoed of een persoon af of zendt deze toe.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel8
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '99.2'
    text: |-
      Het bestuurscollege stelt de vorm van de afschriften, uittreksels en getuigschriften vast, alsmede regelen omtrent
      de wijze van raadplegen van de in het eerste lid bedoelde registers.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel99
  - number: '100.1'
    text: |-
      Indien met betrekking tot een registergoed inschrijvingen ter zake van hypotheken en beslagen in de openbare
      registers, bedoeld in [artikel 8, eerste lid, onder a tot en met c,][ref1] zijn doorgehaald, wordt op de
      getuigschriften inzake dat registergoed ten aanzien van hypotheken en beslagen melding gemaakt van het feit dat
      doorhaling heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel8
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '100.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van gevallen waarin in de openbare registers
      van voorlopige aantekeningen, bedoeld in [artikel 8, eerste lid, onder d][ref1], voorlopige aantekeningen met
      betrekking tot een registergoed zijn gesteld die nog niet zijn doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel8
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '101'
    text: |-
      Indien de verstrekking van inlichtingen, bedoeld in [artikel 99, eerste lid][ref1], onroerende zaken en de rechten
      waaraan deze onderworpen zijn betreft, is daarmee belast de bewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel99
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '99'
        hoofdstuk: '3'
  - number: '116'
    text: |-
      Het bestuurscollege stelt regelen vast omtrent de wijze waarop vergissingen, verzuimen of andere
      onregelmatigheden, begaan door de bewaarder bij de inschrijving van stukken in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onder a tot en met c][ref1], bij het stellen daarin van aantekeningen, daaronder begrepen
      doorhalingen van inschrijvingen in die registers, bij de boeking van stukken in de registers van voorlopige
      aantekeningen, of bij de doorhaling van voorlopige aantekeningen, worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028516#Artikel8
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0028516
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '117.1'
    text: |-
      Het bestuurscollege stelt bij regeling de hoogte van de vergoedingen vast voor diensten die door bewaarder of het
      Kadaster krachtens deze wet worden verricht.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel117
  - number: '117.2'
    text: Het Kadaster stelt regelen vast omtrent de wijze waarop een vergoeding wordt voldaan of verrekend.
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel117
  - number: '118'
    text: 'Deze wet wordt aangehaald als: Wet openbare registers BES.'
    url: https://wetten.overheid.nl/BWBR0028516/2010-10-10#Artikel118
