  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *bewaarder:* het Kadaster, bedoeld in
      [artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref1];
        - *Kadaster:* Kadaster als bedoeld in
      [artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref2];
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *openbare registers:* de openbare registers, bedoeld in
      [titel 1, afdeling 2, van Boek 3 van het Burgerlijk Wetboek BES][ref3];
        - *schip:* visserijvaartuig, plezierjacht of ander vaartuig bestemd voor privédoeleinden, waarvan naar het oordeel
      van de bewaarder voldoende gewaarborgd is dat het niet gebruikt wordt voor commerciële doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028509#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028509#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
