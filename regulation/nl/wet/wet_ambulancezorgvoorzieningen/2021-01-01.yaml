$id: wet_ambulancezorgvoorzieningen
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '2021-01-01'
bwb_id: BWBR0043925
url: https://wetten.overheid.nl/BWBR0043925/2021-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo, Wij in overweging genomen hebben, dat de continuïteit en permanente beschikbaarheid van ambulancezorg van
    goede kwaliteit gewaarborgd moeten zijn;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister voor Medische
      Zorg;
        - *ambulance:* een voor het verlenen van zorg aan en vervoer van zieken of gewonden ingericht motorvoertuig,
      vaartuig of helikopter;
        - *ambulancevoorzieningen:* alle voorzieningen die nodig zijn voor het uitoefenen van ambulancezorg, bedoeld in
      [artikel 5][ref1];
        - *meldkamer:* een meldkamer als bedoeld in [artikel 25a, eerste lid, van de Politiewet 2012][ref2];
        - *meldkamerfunctie:* de meldkamerfunctie, bedoeld in [artikel 25b, eerste lid, van de Politiewet 2012][ref3], ten
      behoeve van de ambulancezorg;
        - *regio:* regio als bedoeld in [artikel 8 van de Wet veiligheidsregio’s][ref4];
        - *ROAZ:* regionaal overleg acute zorgketen.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel25b
      [ref4]: https://wetten.overheid.nl/BWBR0027466#Artikel8
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: 25a
      - id: ref3
        bwb_id: BWBR0031788
        artikel: 25b
      - id: ref4
        bwb_id: BWBR0027466
        artikel: '8'
  - number: '1.2'
    text: Deze wet is niet van toepassing op ambulancezorg met gebruikmaking van militaire ambulances.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van deze wet is het grondgebied van Nederland verdeeld in regio’s overeenkomstig de verdeling,
      bedoeld in [artikel 8 van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel8
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '8'
  - number: '3.1'
    text: Onze Minister draagt zorg voor de duurzame veiligstelling van ambulancevoorzieningen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel3
  - number: '3.2'
    text: De duurzame veiligstelling van ambulancevoorzieningen geldt als een dwingende reden van groot openbaar belang.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel3
  - number: '4.1'
    text: |-
      De zorg voor permanente beschikbaarstelling van voldoende en kwalitatief goede ambulancevoorzieningen berust
      bij de Regionale Ambulancevoorzieningen, die bevoegd en verplicht zijn tot het verlenen of doen verlenen van
      ambulancezorg, bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel5
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '5'
        hoofdstuk: '2'
  - number: '4.2'
    text: Onze Minister wijst per regio een rechtspersoon als Regionale Ambulancevoorziening aan.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister doet in de Staatscourant mededeling welke rechtspersoon in een regio als Regionale
      Ambulancevoorziening is aangewezen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel4
  - number: '5.1'
    text: 'Ambulancezorg is zorg die beroepsmatig wordt verleend, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: 5.1.a
    text: het zorg dragen voor het uitvoeren van de meldkamerfunctie door een ambulancezorgprofessional;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: 5.1.b
    text: |-
      het zorg dragen voor het ontvangen, registreren en beoordelen van elke aanvraag van zorg, bedoeld in de onderdelen
      c, d en e, en zo nodig het besluiten door wie en op welke wijze deze zorg zal worden verleend, niet zijnde de
      meldkamerfunctie;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: 5.1.c
    text: |-
      het met een speciaal daartoe uitgerust en als zodanig herkenbaar voertuig snel ter plaatse brengen van een
      ambulanceverpleegkundige of andere ambulancezorgprofessional om aldaar zorg te verlenen, in verband met een
      ervaren of geobserveerde mogelijk ernstige of een op korte termijn levensbedreigende situatie als gevolg van een
      gezondheidsprobleem of letsel dat plotseling is ontstaan of verergert;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: 5.1.d
    text: |-
      het door een ambulanceverpleegkundige of andere ambulancezorgprofessional verlenen van zorg die erop gericht is
      een zieke of gewonde ter zake van zijn aandoening of letsel, in verband met een ervaren of geobserveerde mogelijk
      ernstige of een op korte termijn levensbedreigende situatie als gevolg van een gezondheidsprobleem of letsel dat
      plotseling is ontstaan of verergert, per ambulance te vervoeren; of
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: 5.1.e
    text: |-
      het door een ambulanceverpleegkundige of andere ambulancezorgprofessional verlenen van zorg op het woon- of
      verblijfsadres van een patiënt of verlenen van zorg in combinatie met vervoer van een patiënt tussen het woon- of
      verblijfadres en een zorginstelling met het oog op diagnostiek, behandeling, opname of ontslag met een ambulance.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling worden voor aan de Regionale Ambulancevoorziening voorbehouden ambulancezorg
      verschillende categorieën ambulancezorgprofessionals aangewezen, waaraan verschillende opleidings- of
      deskundigheidseisen gesteld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: '5.3'
    text: |-
      In de regeling, bedoeld in het tweede lid, kan voor de zorgverlening door verschillende categorieën
      ambulancezorgprofessionals onderscheid gemaakt worden tussen en binnen verschillende vormen van ambulancezorg,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: '5.4'
    text: |-
      Een krachtens het tweede lid vast te stellen ministeriële regeling wordt aan beide kamers der Staten-Generaal
      overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan vier weken na de overlegging van het
      ontwerp.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel5
  - number: '6.1'
    text: Het is anderen dan de Regionale Ambulancevoorziening verboden ambulancezorg te verlenen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het is verboden ambulancezorg te verlenen zonder opdracht van een Regionale Ambulancevoorziening of met een
      voertuig dat niet geregistreerd is bij de Regionale Ambulancevoorziening.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het eerste lid geldt niet voor degenen die krachtens een overeenkomst met de Regionale Ambulancevoorziening
      ambulancezorg verlenen, met uitzondering van het uitvoeren van de meldkamerfunctie anders dan door leden van een
      Regionale Ambulancevoorziening die de vorm heeft van een coöperatie.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel6
  - number: '6.4'
    text: |-
      Voor zover de Regionale Ambulancevoorziening de ambulancezorg, dan wel een deel ervan, laat uitvoeren door een
      derde, zorgt de Regionale Ambulancevoorziening ervoor dat deze derde handelt volgens de eisen die aan de Regionale
      Ambulancevoorziening zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel6
  - number: '7'
    text: |-
      De Regionale Ambulancevoorzieningen in het werkgebied van een meldkamer sluiten een convenant, dat in ieder geval
      afspraken bevat over de uitvoering van de meldkamerfunctie.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel7
  - number: '8.1'
    text: |-
      Bij ministeriële regeling worden eisen vastgesteld waaraan de Regionale Ambulancevoorziening voldoet. De eisen
      kunnen per regio verschillen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel8
  - number: '8.2'
    text: |-
      Voor zover de eisen, bedoeld in het eerste lid, betrekking hebben op de uitvoering van de meldkamerfunctie
      door de Regionale Ambulancevoorziening met betrekking tot de voorbereiding op en het daadwerkelijk optreden
      bij ongevallen, rampen en crises, stelt Onze Minister deze vast overeenkomstig de eisen die het bestuur van
      de veiligheidsregio of de besturen van de veiligheidsregio’s in een werkgebied hebben vastgesteld op grond van
      [artikel 35, vierde lid, van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel35
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '35'
  - number: '9.1'
    text: |-
      Het uitvoeren van [artikel 4][ref1] gaat gepaard met de systematische bewaking, beheersing en verbetering van de
      kwaliteit van de werkzaamheden en de verlening van ambulancezorg.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: '9.2'
    text: 'Ter uitvoering van het eerste lid draagt de Regionale Ambulancevoorziening in elk geval zorg voor:'
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel9
  - number: 9.2.a
    text: |-
      het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de werkzaamheden en
      de verlening van ambulancezorg, zoals vastgelegd in de kwaliteitskaders voor de Regionale Ambulancevoorzieningen en
      de kwaliteitsgegevens die de minister op basis van [artikel 12][ref1] opvraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel12
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 9.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder a, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 4][ref1] leidt tot een verantwoorde uitvoering van de werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: 9.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder b, zo nodig verbeteren van de wijze waarop
      [artikel 4][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      De Regionale Ambulancevoorziening draagt er zorg voor dat eenmaal in de vijf jaar een visitatie door een
      visitatiecommissie wordt verricht.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel9
  - number: '9.4'
    text: |-
      Het bestuur van de Regionale Ambulancevoorziening zendt aan Onze Minister het rapport van de visitatiecommissie,
      samen met het standpunt van het bestuur van de Regionale Ambulancevoorziening daarover. Het bestuur van de
      Regionale Ambulancevoorziening maakt het rapport en zijn standpunt openbaar.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel9
  - number: '10.1'
    text: |-
      De Regionale Ambulancevoorziening ontvangt van afdelingen spoedeisende hulp van ziekenhuizen ten behoeve van
      kwaliteitsbewaking, -beheersing en – bevordering van de ambulancezorg in het kader van [artikel 4][ref1], kosteloos
      alle daartoe noodzakelijke gegevens, waaronder persoonsgegevens, waaronder begrepen gegevens over de gezondheid als
      bedoeld in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      De Regionale Ambulancevoorziening is bevoegd om de in het eerst lid bedoelde gegevens te verwerken voor de in het
      eerste lid omschreven doeleinden.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel10
  - number: '10.3'
    text: De Regionale Ambulancevoorziening is voor de in het eerste lid bedoelde gegevens verwerkingsverantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel10
  - number: '10.4'
    text: 'Bij algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel10
  - number: 10.4.a
    text: welke gegevens, bedoeld in het eerste lid, door de Regionale Ambulancevoorziening worden ontvangen; en
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel10
  - number: 10.4.b
    text: |-
      wat de bewaartermijn van de op grond van het eerste lid aan de Regionale Ambulancevoorziening verstrekte gegevens
      is.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel10
  - number: '11.1'
    text: |-
      De Regionale Ambulancevoorziening is verantwoordelijk voor een adequate en integrale inbedding van de medische
      verantwoordelijkheid in de organisatie.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel11
  - number: '11.2'
    text: |-
      De medische verantwoordelijkheid heeft betrekking op het medisch inhoudelijk beleid, het vaststellen van de
      bekwaamheid van ambulanceverpleegkundigen of andere ambulancezorgprofessionals, de inhoud van de scholing en het
      toegepast wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij ministeriële regeling kunnen opleidings- of deskundigheidseisen worden gesteld aan de medisch
      verantwoordelijken.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel11
  - number: '11.4'
    text: |-
      Een krachtens het derde lid vast te stellen ministeriële regeling wordt aan beide kamers der Staten-Generaal
      overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan vier weken na de overlegging van het
      ontwerp.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel11
  - number: '12.1'
    text: |-
      De Regionale Ambulancevoorziening verstrekt Onze Minister ten behoeve van zijn zorg voor de duurzame veiligstelling
      van ambulancevoorzieningen op verzoek gegevens over het verrichten van ambulancezorg en de kosten die daarmee
      verband houden.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel12
  - number: '12.2'
    text: |-
      Bij ministeriële regeling kunnen nadere eisen worden gesteld over de gegevens, bedoeld in het eerste lid, alsmede
      eisen worden gesteld over de wijze van verstrekking.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien de Regionale Ambulancevoorziening andere activiteiten, dan de taak genoemd in [artikel 4, eerste lid][ref1],
      verricht, onderscheidt zij, in afwijking van [artikel 40a van de Wet marktordening gezondheidszorg][ref2], in ieder
      geval in financiële zin die activiteiten van de activiteiten ter uitvoering van haar taak, bedoeld in artikel 4,
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40a
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 40a
  - number: '13.2'
    text: |-
      In de financiële administratie van de Regionale Ambulancevoorziening zijn ontvangsten en betalingen traceerbaar
      naar bron en bestemming en is duidelijk wie op welk moment welke verplichtingen voor of namens de Regionale
      Ambulancevoorziening is aangegaan.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel13
  - number: '13.3'
    text: |-
      De baten die de Regionale Ambulancevoorziening behaalt met de uitvoering van de taak, bedoeld in
      [artikel 4, eerste lid][ref1], worden niet gebruikt voor financiering van de andere activiteiten, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.4'
    text: |-
      De Regionale Ambulancevoorziening heeft schriftelijk en inzichtelijk vastgelegd hoe de ambulancevoorzieningen
      georganiseerd worden, van welke andere organisatorische verbanden daarbij gebruik wordt gemaakt en wat
      de aard is van de relaties met die andere verbanden, waaronder begrepen verantwoordelijkheden, taken en
      beslissingsbevoegdheden.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel13
  - number: '13.5'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing voor de leden van de Regionale
      Ambulancevoorzieningen die de vorm van een coöperatie hebben.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel13
  - number: '14.1'
    text: |-
      De Regionale Ambulancevoorziening met privaatrechtelijke rechtspersoonlijkheid wordt bestuurd door het bestuur
      onder toezicht van een interne toezichthouder.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel14
  - number: '14.2'
    text: |-
      De interne toezichthouder draagt er zorg voor dat het bestuur als orgaan goed en evenwichtig is samengesteld en
      geschikt is en blijft voor het besturen van de Regionale Ambulancevoorziening.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel14
  - number: '14.3'
    text: |-
      De interne toezichthouder houdt toezicht op het beleid van het bestuur en op de algemene gang van zaken in de
      Regionale Ambulancevoorziening en staat het bestuur met raad terzijde.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel14
  - number: '14.4'
    text: Geen persoon kan tegelijk deel uitmaken van de interne toezichthouder en het bestuur.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel14
  - number: '14.5'
    text: |-
      De interne toezichthouder is zodanig samengesteld dat de leden ten opzichte van elkaar, het bestuur en welk
      deelbelang dan ook onafhankelijk en kritisch kunnen opereren.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel14
  - number: '14.6'
    text: |-
      De statuten kunnen aanvullende bepalingen omtrent de taak en de bevoegdheden van de interne toezichthouder
      bevatten, alsmede de wijze waarop conflicten tussen de interne toezichthouder en het bestuur worden geregeld.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het bestuur van de Regionale Ambulancevoorziening met privaatrechtelijke rechtspersoonlijkheid verstrekt de interne
      toezichthouder de voor de uitoefening van diens taak noodzakelijke inlichtingen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: '15.2'
    text: 'De volgende besluiten van het bestuur zijn aan de goedkeuring van de interne toezichthouder onderworpen:'
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.a
    text: |-
      de vaststelling van de begroting, het bestuursverslag, de jaarrekening en de resultaatbestemming, tenzij deze
      bevoegdheid aan de algemene vergadering toekomt;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.b
    text: de vaststelling van strategische beleidsplannen van de Regionale Ambulancevoorziening;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.c
    text: de vaststelling van de randvoorwaarden en waarborgen voor een adequate invloed van belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.d
    text: |-
      het aangaan of verbreken van een duurzame samenwerking van de Regionale Ambulancevoorziening met andere
      rechtspersonen of vennootschappen indien deze samenwerking of verbreking van ingrijpende betekenis is voor de
      Regionale Ambulancevoorziening;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.e
    text: het bestuursreglement van het bestuur;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.f
    text: een voorstel tot ontbinding van de Regionale Ambulancevoorziening;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.g
    text: aangifte van faillietverklaring en aanvraag van surseance van betaling;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: 15.2.h
    text: |-
      gelijktijdige beëindiging of beëindiging binnen een kort tijdsbestek van de arbeidsovereenkomst van een
      aanmerkelijk aantal werknemers, of van het verbreken van een overeenkomst met een aanmerkelijk aantal personen dat
      als zelfstandige of als samenwerkingsverband werkzaam is voor de Regionale Ambulancevoorziening.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel15
  - number: '16'
    text: |-
      [Artikel 15, tweede lid][ref1] is van overeenkomstige toepassing op Regionale Ambulancevoorzieningen met
      publiekrechtelijke rechtspersoonlijkheid, voor zover het de uitoefening van de ambulancezorg door de Regionale
      Ambulancevoorziening betreft, met dien verstande dat voor «de interne toezichthouder» wordt gelezen «het algemeen
      bestuur» en voor «het bestuur» telkens «het dagelijks bestuur».


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel15
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '17'
    text: |-
      De Regionale Ambulancevoorziening meldt aan Onze Minister het wijzigen van de statuten of gemeenschappelijke
      regeling en het sluiten van een overeenkomst waardoor de zeggenschap over de Regionale Ambulancevoorziening
      geheel of gedeeltelijk door of tezamen met derden wordt uitgeoefend, dan wel waardoor deze feitelijk daartoe in de
      gelegenheid worden gesteld, voordat het rechtsgevolg krijgt.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het is verboden een rechtshandeling te verrichten, die tot gevolg heeft dat middellijk of onmiddellijk, alleen
      of tezamen met derden, door anderen geheel of gedeeltelijk zeggenschap wordt verkregen over een Regionale
      Ambulancevoorziening of een deel daarvan, dan wel over de bedrijfsvoering van een Regionale Ambulancevoorziening of
      een deel van die bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel18
  - number: '18.2'
    text: |-
      Een Regionale Ambulancevoorziening fuseert niet met een andere Regionale Ambulancevoorziening of wijzigt niet van
      rechtsvorm zonder voorafgaande toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel18
  - number: '19.1'
    text: |-
      De Regionale Ambulancevoorziening verkeert in een dusdanige financiële staat dat deze de continuïteit van de
      ambulancezorg als bedoeld in [artikel 4, eerste lid][ref1] en het voldoen aan de bij of krachtens deze wet gestelde
      eisen niet in gevaar brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: '19.2'
    text: |-
      Indien de Regionale Ambulancevoorziening andere activiteiten, dan de taak genoemd in [artikel 4, eerste lid][ref1],
      verricht, of het verlenen van ambulancezorg als bedoeld in artikel 4, eerste lid, uitbesteedt, zorgt zij ervoor
      dat dit de continuïteit van de ambulancezorg als bedoeld in artikel 4, eerste lid en het voldoen aan de bij of
      krachtens deze wet gestelde eisen niet in gevaar brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: '19.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden aan het uitkeren van winst door de
      Regionale Ambulancevoorziening of haar onderaannemers.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel19
  - number: '20.1'
    text: |-
      Bij ministeriële regeling kan, ten aanzien van bij de regeling aangewezen ambulancezorg en onder bij de regeling
      vast te stellen eisen, vrijstelling worden verleend van bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel20
  - number: '20.2'
    text: |-
      Een krachtens het eerste lid vast te stellen ministeriële regeling wordt aan beide kamers der Staten-Generaal
      overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan vier weken na de overlegging van het
      ontwerp.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel20
  - number: '21.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet met uitzondering van
      [artikel 10, tweede, derde en vierde lid][ref1], zijn belast de ambtenaren van de Inspectie gezondheidszorg en
      jeugd.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel10
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid, zijn met het toezicht op de naleving van het bepaalde in [artikel 13][ref1] en
      het bepaalde bij of krachtens [artikel 19][ref2] belast de ambtenaren van de Nederlandse Zorgautoriteit, met dien
      verstande dat met het toezicht op de naleving van het bepaalde in artikel 19, eerste en tweede lid, tevens de in
      het eerste lid bedoelde ambtenaren belast zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel19
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0043925
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '22.1'
    text: |-
      Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens deze wet niet of in onvoldoende mate of op
      onjuiste wijze wordt nageleefd, kan hij de Regionale ambulancevoorziening een schriftelijke aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel22
  - number: '22.2'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens deze
      wet niet of in onvoldoende mate of op onjuiste wijze wordt nageleefd, de in verband daarmee te nemen maatregelen,
      alsmede de termijn waarbinnen de Regionale ambulancevoorziening aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor de gezondheid redelijkerwijs geen uitstel kan lijden,
      kan de ingevolge [artikel 21][ref1] met het toezicht belaste ambtenaar een schriftelijk bevel geven. Het bevel
      heeft een geldigheidsduur van zeven dagen, welke door Onze Minister telkens met eenzelfde periode kan worden
      verlengd zolang naar het oordeel van Onze Minister het gevaar voor de gezondheid niet is geweken.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel21
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '21'
        hoofdstuk: '5'
  - number: '22.4'
    text: |-
      De Regionale Ambulancevoorziening is verplicht volledig en binnen de daarbij gestelde termijn aan de aanwijzing
      onderscheidenlijk onmiddellijk aan het bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel22
  - number: '22.5'
    text: |-
      Indien de Regionale Ambulancevoorziening inzake het vierde lid in gebreke blijft waardoor het verlenen
      van ambulancezorg in de regio in gevaar komt, kan Onze Minister een bewindvoerder over de Regionale
      Ambulancevoorziening aanstellen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel22
  - number: '22.6'
    text: |-
      Onze Minister regelt bij de aanstelling de bevoegdheden en beloning van de bewindvoerder.
      [Artikel 2:22, derde tot en met zesde lid, van het Burgerlijk Wetboek][ref1], is van overeenkomstige toepassing,
      met dien verstande dat voor «de rechter» telkens wordt gelezen «Onze Minister».


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel22
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '22'
  - number: '23.1'
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder dwangsom ter handhaving van het bepaalde bij
      of krachtens de [artikelen 4, eerste lid][ref1], [6, eerste lid][ref2], [7][ref3], [8][ref4], [12][ref5],
      [18][ref6], [20][ref7] en [25, vierde lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0043925#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0043925#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0043925#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0043925#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0043925#Artikel20
      [ref8]: https://wetten.overheid.nl/BWBR0043925#Artikel25
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043925
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0043925
        artikel: '7'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0043925
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0043925
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref6
        bwb_id: BWBR0043925
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref7
        bwb_id: BWBR0043925
        artikel: '20'
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0043925
        artikel: '25'
        hoofdstuk: '5'
  - number: '23.2'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij
      [artikel 22, vierde lid][ref1] en de bij [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2]
      gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '22'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '24.1'
    text: |-
      Onze Minister is bevoegd tot het opleggen van een bestuurlijke boete ter handhaving van
      [artikel 6, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel6
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '6'
        hoofdstuk: '2'
  - number: '24.2'
    text: |-
      De op grond van het eerste lid op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld
      voor de vierde categorie, bedoeld in [artikel 21, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel21
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '21'
  - number: '25.1'
    text: |-
      Onze Minister kan de aanwijzing, bedoeld in [artikel 4, tweede lid][ref1], wijzigen of intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: 25.1.a
    text: de Regionale Ambulancevoorziening daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
  - number: 25.1.b
    text: |-
      de Regionale Ambulancevoorziening de taak, bedoeld in [artikel 4, eerste lid][ref1], niet of niet verantwoord
      vervult of het bepaalde bij of krachtens deze wet niet naleeft;


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: 25.1.c
    text: |-
      naar het oordeel van Onze Minister het belang van permanente beschikbaarstelling van voldoende en kwalitatief goede
      ambulancevoorzieningen zulks vordert; dan wel
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
  - number: 25.1.d
    text: een bijzondere omstandigheid daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
  - number: '25.2'
    text: Onze Minister doet in de Staatscourant mededeling van de wijziging of intrekking van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
  - number: '25.3'
    text: |-
      Voordat Onze Minister een aanwijzing intrekt, vraagt Onze Minister de zorgverzekeraars in de zin van de
      [Zorgverzekeringswet][ref1] die in de regio de andere zorgverzekeraars representeren, het bestuur van de
      veiligheidsregio en het traumacentrum als organisator van het ROAZ om advies.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '25.4'
    text: |-
      Indien Onze Minister een aanwijzing intrekt, draagt de Regionale Ambulancevoorziening waarvan de aanwijzing wordt
      ingetrokken, ervoor zorg dat zij:
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
  - number: 25.4.a
    text: |-
      uitvoering blijft geven aan [artikel 4, eerste lid][ref1], in de overgangsperiode tot aan het moment dat een andere
      rechtspersoon voor die regio als Regionale Ambulancevoorziening functioneert,


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: 25.4.b
    text: |-
      op verzoek van Onze Minister in de overgangsperiode, bedoeld onder a, aan de door Onze Minister aangewezen
      rechtspersoon alle informatie verschaft die deze nodig heeft om als Regionale Ambulancevoorziening voor die regio
      te functioneren,
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
  - number: 25.4.c
    text: de medewerkers overdraagt aan de nieuw aangewezen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
  - number: '25.5'
    text: |-
      Voordat Onze Minister een andere rechtspersoon aanwijst als Regionale Ambulancevoorziening na intrekking van een
      aanwijzing, vraagt Onze Minister de zorgverzekeraars in de zin van de [Zorgverzekeringswet][ref1] die in de regio
      de andere zorgverzekeraars representeren, het bestuur van de veiligheidsregio en het traumacentrum als organisator
      van het ROAZ om advies.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '31'
    text: |-
      Aanwijzingen verleend bij of krachtens [artikel 6 van de Tijdelijke wet ambulancezorg][ref1], gelden na
      inwerkingtreding van deze wet als aanwijzing per regio van de Regionale Ambulancevoorziening, bedoeld in
      [artikel 4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031557#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0031557
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0043925
        artikel: '4'
        hoofdstuk: '2'
  - number: 31a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk, waarbij in het bijzonder aandacht wordt besteed aan
      het lerend vermogen en innovatie bij de Regionale Ambulancevoorzieningen.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel31a
  - number: '32'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel32
  - number: '33'
    text: 'Deze wet wordt aangehaald als: Wet ambulancezorgvoorzieningen.'
    url: https://wetten.overheid.nl/BWBR0043925/2021-01-01#Artikel33
