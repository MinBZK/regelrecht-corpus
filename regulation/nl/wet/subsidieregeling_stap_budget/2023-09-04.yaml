  - number: '2'
    text: |-
      Op subsidies verleend op grond van deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel2
    references:
