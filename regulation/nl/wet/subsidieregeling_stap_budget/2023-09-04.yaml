        bwb_id: BWBR0037603
  - number: '3'
    text: |-
      Het doel van deze regeling is om personen, die een band hebben met de Nederlandse arbeidsmarkt, met financiële
      ondersteuning in staat te stellen om scholing te volgen, gericht op versterking van hun arbeidsmarktpositie.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel3
  - number: '4.1'
    text: 'Subsidiabele kosten zijn:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: 4.1.a
    text: |-
      les-, cursus-, college- of examengeld, alsmede kosten van door de opleider verplicht gestelde literatuur of
      beschermingsmiddelen voor zover deze literatuur of middelen direct noodzakelijk zijn voor het volgen en afronden
      van de scholing, mits de kosten van deze literatuur of middelen in rekening worden gebracht door de opleider;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: '4.2'
    text: |-
      Een opleider vermeldt in het scholingsregister de catalogusprijs van de scholing, alsmede het deel van die
      catalogusprijs dat wordt gevormd door de subsidiabele kosten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: '4.3'
    text: 'Niet subsidiabel is scholing waarbij sprake is van het in het vooruitzicht stellen of aanbieden van:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: 4.3.a
    text: geschenken, aanbiedingen of andere voordelen aan een deelnemer of potentiële deelnemer;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: 4.3.b
    text: |-
      reis- of verblijfkosten voor een deelnemer of potentiële deelnemer in verband met het volgen van de scholing door
      de deelnemer; of
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: 4.3.c
    text: andersoortige voordelen aan een deelnemer of potentiële deelnemer als deze de opleider een voordeel verstrekt.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: '4.4'
    text: |-
      Niet subsidiabel is scholing die buiten Nederland wordt verzorgd en scholing die is opgenomen in de bijlage bij
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel4
  - number: '5.1'
    text: |-
      De Minister kan subsidie verstrekken aan een persoon die een band heeft met de Nederlandse arbeidsmarkt ten behoeve
      van een door hem te volgen scholing die in het scholingsregister is vermeld en hierin niet is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: '5.2'
    text: 'Er is sprake van een band met de Nederlandse arbeidsmarkt indien de subsidieaanvrager:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: 5.2.a
    text: |-
      ten tijde van de aanvraag achttien jaar of ouder is en de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt; en


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 5.2.b
    text: |-
      in de periode van twee jaar en drie maanden tot drie maanden voor de kalendermaand van zijn aanvraag gedurende ten
      minste zes maanden verzekerd is geweest voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: '5.3'
    text: 'De Minister verstrekt uitsluitend subsidie voor een scholing die start:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: 5.3.a
    text: |-
      vanaf vier weken na de dag van de subsidieaanvraag en binnen drie maanden na de sluiting van het aanvraagtijdvak
      waarin de subsidieaanvraag is ingediend; of
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: 5.3.b
    text: |-
      op een later gelegen dag die redelijkerwijs nodig is, indien het voor de opleider niet mogelijk is de scholing
      binnen het in onderdeel a genoemde tijdvak te starten.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: '5.4'
    text: |-
      De Minister verstrekt geen subsidie voor een scholing, indien de subsidieaanvrager ten tijde van de aanvraag de
      leeftijd van 30 jaren nog niet heeft bereikt en:
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: 5.4.a
    text: |-
      de te subsidiëren scholing kan worden aangemerkt als een onderwijssoort als bedoeld in de [artikelen 2.4][ref1],
      [2.8][ref2], [2.10][ref3] en [2.11 van de Wet studiefinanciering 2000][ref4]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '2'
  - number: 5.4.b
    text: |-
      de te subsidiëren scholing kan worden aangemerkt als een onderwijssoort als bedoeld in de [artikelen 2.9][ref1] of
      [2.10 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel2
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '2'
  - number: '5.5'
    text: |-
      De Minister verstrekt geen subsidie voor een scholing, voor zover de subsidieaanvrager voor de subsidiabele kosten
      van de scholing reeds subsidie op grond van een andere regeling strekkend tot subsidiëring van een opleiding of
      scholing ontvangt of zal ontvangen.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: '5.6'
    text: |-
      De Minister verstrekt uitsluitend subsidie voor zover de subsidieaanvrager voor de subsidiabele kosten van de
      scholing geen bijdrage van een derde, anders dan bedoeld in het vijfde lid, heeft ontvangen of zal ontvangen.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
  - number: '5.7'
    text: |-
      Indien een aanvraagtijdvak vanwege de situatie bedoeld in [artikel 9, zevende lid][ref1], later wordt opengesteld,
      wordt in afwijking van het derde lid, onderdeel a, voor de periode waarin de scholing start gerekend vanaf de dag
      na die waarop openstelling van het aanvraagtijdvak oorspronkelijk was voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel9
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '9'
  - number: '6.1'
    text: |-
      Onder meerjarige scholing wordt verstaan: scholing die verband houdt met onderdelen van een door de Minister
      van Onderwijs, Cultuur en Wetenschap vastgesteld kwalificatiedossier, vastgestelde kwalificatie of een door de
      Nederlands-Vlaamse Accreditatieorganisatie geaccrediteerde opleiding en die een nominale studieduur heeft van meer
      dan twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel6
  - number: '6.2'
    text: |-
      Indien de te subsidiëren activiteit wordt aangemerkt als meerjarige scholing, kan de minister per aanvraag subsidie
      verstrekken voor ten hoogste één opleidingsjaar van deze scholing.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel6
  - number: '6.3'
    text: |-
      Indien de subsidieaanvrager op grond van deze regeling subsidie heeft ontvangen voor een opleidingsjaar van
      meerjarige scholing, kan de minister op aanvraag subsidie verstrekken voor een volgend opleidingsjaar.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel6
  - number: '6.4'
    text: |-
      Ingeval van meerjarige scholing wordt als startdatum van de scholing beschouwd de datum in een opleidingsjaar
      waarop de deelnemer formeel start met het opleidingsjaar en als afronding van de scholing, het door de deelnemer
      afronden van een opleidingsjaar op een van de wijzen, bedoeld in [artikel 14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel14
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '14'
  - number: '7'
    text: |-
      De subsidie voor een scholing bedraagt ten hoogste 100% van de subsidiabele kosten van de scholing zoals vermeld in
      het scholingsregister, tot een maximum van € 1.000,– inclusief btw.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel7
  - number: '8.1'
    text: |-
      De subsidieaanvrager kan een subsidieaanvraag indienen vanaf 1 maart 2022 door middel van een door de Minister
      beschikbaar gesteld elektronisch formulier.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: '8.2'
    text: De subsidieaanvraag wordt voor aanvang van de scholing of het opleidingsjaar ingediend.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: '8.3'
    text: 'In de subsidieaanvraag wordt opgenomen:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.a
    text: |-
      het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1] van de subsidieaanvrager;


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 8.3.b
    text: de scholing waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.c
    text: |-
      de startdatum van de scholing en de verwachte datum van afronding van de scholing, zoals vastgesteld door de
      opleider;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.d
    text: |-
      indien sprake is van een meerjarige scholing, de totale verwachte duur van de scholing, zoals vastgesteld door
      de opleider;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.e
    text: als bijlage bij de subsidieaanvraag het STAP-aanmeldingsbewijs voor de scholing;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.f
    text: indien van toepassing, het opleidingsjaar van de meerjarige scholing waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.g
    text: de hoogst afgeronde opleiding van de subsidieaanvrager;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.h
    text: de arbeidsmarktpositie van de subsidieaanvrager ten tijde van zijn aanvraag;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.i
    text: |-
      indien de subsidieaanvrager ten tijde van zijn aanvraag werkzaam is, de aard van de werkzaamheden die hij verricht;
      en
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: 8.3.j
    text: het beoogde arbeidsmarktdoel dat de subsidieaanvrager heeft met het volgen van de scholing.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: '8.4'
    text: |-
      Voor zover de subsidieaanvrager voor dezelfde begrote kosten ook subsidie of een andere financiële bijdrage heeft
      aangevraagd of zal gaan aanvragen bij een ander bestuursorgaan of rechtspersoon, doet hij daarvan mededeling in de
      subsidieaanvraag, onder vermelding van de stand van zaken van de beoordeling van die andere aanvraag.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: '8.6'
    text: |-
      Indien indiening van een subsidieaanvraag door middel van een door de Minister beschikbaar gesteld elektronisch
      formulier als bedoeld in het eerste lid voor een persoon die een aanvraag wil doen, naar het oordeel van het UWV
      niet mogelijk is door in deze persoon gelegen factoren van welke aard ook die deze persoon niet kunnen worden
      aangerekend, voorziet de Minister op daartoe strekkend verzoek van die persoon in een zodanige faciliteit dat deze
      persoon een aanvraag als bedoeld in dit artikel kan doen.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel8
  - number: '9.1'
    text: |-
      De Minister stelt voor elk kalenderjaar een subsidieplafond vast voor subsidies op grond van deze regeling en
      verdeelt het beschikbare bedrag over zes aanvraagtijdvakken van telkens twee maanden.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9
  - number: '9.2'
    text: |-
      De maximumgrens van het beschikbare bedrag in een aanvraagtijdvak als bedoeld in het eerste lid wordt bereikt
      op het moment dat het totaal aan verleende subsidiebedragen als bedoeld in [artikel 10, derde lid][ref1], in
      het desbetreffende aanvraagtijdvak gelijk is aan of hoger wordt dan het in het desbetreffende aanvraagtijdvak
      beschikbare subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel10
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '10'
  - number: '9.3'
    text: |-
      Indien een deel van het beschikbare bedrag, bedoeld in het eerste lid, of van het deel van het beschikbare bedrag,
      bedoeld in het vierde lid op de laatste dag van dat aanvraagtijdvak om 23.59 uur niet is uitgeput, worden de
      resterende middelen toegevoegd aan de middelen van het volgende aanvraagtijdvak van hetzelfde kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9
  - number: '9.4'
    text: |-
      De Minister kan in een aanvraagtijdvak als bedoeld in het eerste lid, gelegen na 31 augustus 2022, een
      deel van het beschikbare bedrag beschikbaar stellen uitsluitend ten behoeve van personen als bedoeld in
      [artikel 8, zesde lid][ref1]. De Minister maakt het beschikbaar gestelde bedrag, bedoeld in de eerste zin, bekend
      in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel8
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '8'
  - number: '9.5'
    text: |-
      Het beschikbare subsidiebedrag en de verdeling over de aanvraagtijdvakken voor de jaren na 2022 wordt jaarlijks
      voor 1 januari in de Staatscourant bekend gemaakt. Gedurende de jaren, gelegen na 2022, kan wijziging plaatsvinden
      in het beschikbare subsidiebedrag of in de verdeling over de aanvraagtijdvakken, bedoeld in het eerste lid, en in
      het beschikbare deel, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9
  - number: '9.6'
    text: |-
      In afwijking van het eerste lid kan de Minister met het oog op een efficiëntere inrichting van het
      uitvoeringsproces, een aanvraagtijdvak van twee maanden ten hoogste drie werkdagen korter of langer laten duren.
      Indien de Minister gebruik maakt van deze bevoegdheid, maakt hij op de website [www.stapuwv.nl](onbekend) bekend
      met ingang van welke datum een aanvraagtijdvak start of eindigt.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9
  - number: '9.7'
    text: |-
      Indien het vanwege een technische of andere onvoorziene oorzaak niet mogelijk is om een aanvraagtijdvak open te
      stellen op de dag waarop openstelling was voorzien, maakt de Minister zo spoedig mogelijk op een voor een ieder
      kenbare wijze bekend wanneer het aanvraagtijdvak wordt opengesteld.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9
  - number: 9a.1
    text: |-
      In afwijking van [artikel 9, eerste lid][ref1], zijn er voor het jaar 2022 vijf aanvraagtijdvakken van twee maanden
      beschikbaar, waarbij het eerste aanvraagtijdvak vanaf 1 maart 2022 van start gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel9
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '9'
  - number: 9a.2
    text: |-
      Voor subsidies op grond van deze regeling is voor het jaar 2022 € 160 miljoen beschikbaar, dat gelijkelijk
      over de aanvraagtijdvakken, bedoeld in het eerste lid, wordt verdeeld, onverminderd het derde lid. Voor de twee
      aanvraagtijdvakken, gelegen na 31 augustus 2022, is een extra budget van € 12,9 miljoen beschikbaar dat gelijkelijk
      over deze aanvraagtijdvakken wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9a
  - number: 9a.3
    text: |-
      De Minister kan in de twee tijdvakken volgend op het eerste aanvraagtijdvak, genoemd in het eerste lid, de
      faciliteit voor personen als bedoeld in [artikel 8, zesde lid][ref1], verlenen waarbij, als de subsidieaanvragen
      met behulp van die faciliteit daartoe aanleiding geven, het voor het desbetreffende tijdvak beschikbare bedrag
      uitsluitend ten behoeve van die personen kan worden overschreden, onverminderd het tweede lid. Indien er in een van
      deze tijdvakken sprake is van een overschrijding, wordt het bedrag van die overschrijding in gelijke delen op de
      subsidiebedragen van de volgende tijdvakken in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel8
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '8'
  - number: 9a.4
    text: |-
      [Artikel 9, derde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel9
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '9'
  - number: 9a.5
    text: Onverminderd het tweede lid is voor het vijfde aanvraagtijdvak een extra budget van € 10,8 miljoen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9a
  - number: 9b.1
    text: |-
      In afwijking van [artikel 9, eerste lid][ref1], zijn er voor het jaar 2023 de volgende vijf aanvraagtijdvakken:


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel9
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '9'
  - number: 9b.1.a
    text: 'eerste aanvraagtijdvak: van 17 maart 2023 tot en met 30 april 2023;'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.1.b
    text: 'tweede aanvraagtijdvak: van 1 mei 2023 tot en met 2 juli 2023;'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.1.c
    text: 'derde aanvraagtijdvak: van 3 juli 2023 tot en met 3 september 2023;'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.1.d
    text: 'vierde aanvraagtijdvak: van 18 september 2023 tot en met 14 november 2023;'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.1.e
    text: 'vijfde aanvraagtijdvak: van 15 november 2023 tot en met 31 december 2023.'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.2
    text: |-
      In afwijking van [artikel 5, derde lid, onderdeel a][ref1], wordt in het eerste aanvraagtijdvak, bedoeld in het
      eerste lid, voor de periode waarin de scholing start gerekend vanaf 28 februari 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel5
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '5'
  - number: 9b.3
    text: |-
      Voor subsidie op grond van deze regeling is voor het jaar 2023 € 108 miljoen beschikbaar, met de volgende bedragen
      per aanvraagtijdvak:
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.3.a
    text: 'eerste en tweede aanvraagtijdvak: € 34 miljoen;'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.3.b
    text: 'derde aanvraagtijdvak: € 20 miljoen;'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.3.c
    text: 'vierde en vijfde aanvraagtijdvak: € 10 miljoen.'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
  - number: 9b.4
    text: |-
      In 2023 is per aanvraagtijdvak 5% van het voor dat tijdvak beschikbare bedrag uitsluitend bestemd voor personen als
      bedoeld in [artikel 8, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel8
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '8'
  - number: 9b.5
    text: |-
      [Artikel 9, derde lid, vijfde lid, tweede zin en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel9
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '9'
  - number: '10.1'
    text: Subsidieaanvragen die volledig zijn, worden behandeld op volgorde van ontvangst.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel10
  - number: '10.2'
    text: |-
      Van een volledige subsidieaanvraag is sprake indien is voldaan aan [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel8
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '8'
  - number: '11.1'
    text: De subsidie wordt op aanvraag bij beschikking verleend.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel11
  - number: '11.2'
    text: De Minister besluit binnen vier weken na ontvangst daarvan op de aanvraag tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel11
  - number: '11.3'
    text: |-
      De beschikking tot subsidieverlening vermeldt in ieder geval de scholing waarvoor subsidie wordt verleend, de
      opleider, het subsidiebedrag, de startdatum van de scholing, de datum waarop de scholing zal worden afgerond, de
      wijze waarop kan worden aangetoond dat de scholing is afgerond en de wijze van bevoorschotting en betaling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel11
  - number: '11.4'
    text: De Minister verstrekt de opleider een bericht over de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel11
  - number: '12.1'
    text: |-
      Onverminderd de [artikelen 4:25, tweede lid][ref1], en
      [4:35, eerste lid, en tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref2] wordt de subsidie
      geweigerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 12.1.a
    text: de subsidieaanvraag niet voldoet aan de in deze regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
  - number: 12.1.b
    text: de aangevulde subsidieaanvraag niet binnen de gestelde termijn is ontvangen;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
  - number: 12.1.c
    text: |-
      de subsidieaanvrager op grond van deze regeling in het desbetreffende kalenderjaar al een beschikking tot
      subsidieverlening heeft ontvangen waarin de aangevraagde subsidie is toegekend;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
  - number: 12.1.d
    text: de volledige subsidieaanvraag na aanvang van de scholing is ingediend;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
  - number: 12.1.e
    text: |-
      de scholing niet is vermeld in het scholingsregister dan wel hierin is uitgesloten, tenzij de scholing is
      uitgesloten op grond van [artikel 19a][ref1] en de subsidieaanvraag is ingediend in het aanvraagtijdvak waarin die
      uitsluiting plaatsvond; of


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel19a
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: 19a
  - number: 12.1.f
    text: |-
      de subsidieaanvrager op het moment van zijn aanvraag op grond van [artikel 19, derde lid][ref1], is uitgesloten van
      het recht op subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel19
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '19'
  - number: '12.2'
    text: |-
      De subsidie wordt voorts geweigerd voor zover voor de subsidiabele kosten van de scholing
      [artikel 5, vijfde of zesde lid,][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel5
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '5'
  - number: 12a.1
    text: |-
      Zodra in een kalenderjaar een vooraf door de Minister bekendgemaakt maximaal aantal subsidies is verleend voor een
      bepaalde scholing, wordt met ingang van het eerstvolgende aanvraagtijdvak van het betreffende kalenderjaar tot en
      met het einde van dat kalenderjaar subsidie voor deze scholing geweigerd.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12a
  - number: 12a.2
    text: Voor het kalenderjaar 2023 bedraagt de verleningsgrens per scholing 300.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12a
  - number: 12a.3
    text: |-
      De verleningsgrens wordt voor de jaren na 2023 jaarlijks voor 1 januari van het betreffende kalenderjaar in de
      Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12a
  - number: 12a.4
    text: |-
      [Artikel 12, eerste lid, onderdeel e][ref1], is niet van toepassing op subsidieaanvragen voor een scholing die is
      uitgesloten op grond van [artikel 19a][ref2] en die zijn ingediend in het aanvraagtijdvak waarin de uitsluiting
      heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0045419#Artikel19a
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0045419
        artikel: 19a
  - number: '13.1'
    text: De Minister verleent bij de beschikking tot subsidieverlening ambtshalve een voorschot van 100%.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel13
  - number: '13.2'
    text: |-
      De Minister betaalt het voorschot aan de opleider nadat de opleider de informatie, bedoeld in
      [artikel 16, tweede lid][ref1], aan hem heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel16
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '16'
  - number: '13.3'
    text: |-
      Onverminderd [artikel 4:56 van de Algemene wet bestuursrecht][ref1], schort de Minister de betaling, bedoeld in het
      tweede lid op, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 13.3.a
    text: |-
      sprake is van een ernstig vermoeden dat door de subsidieontvanger niet wordt voldaan aan de verplichtingen die zijn
      verbonden aan de subsidie; of
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel13
  - number: 13.3.b
    text: indien een melding van de subsidieontvanger of de opleider daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel13
  - number: '14.1'
    text: De subsidieontvanger neemt deel aan de scholing waarvoor subsidie is verleend en rondt deze af.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: '14.2'
    text: 'De scholing is afgerond indien de subsidieontvanger de scholing heeft voltooid met:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: 14.2.a
    text: een diploma of certificaat;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: 14.2.b
    text: een aanwezigheids- of deelnemingspercentage van ten minste 80%;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: 14.2.c
    text: ten minste 80% van het vereist aantal studiepunten in geval van een meerjarige opleiding; of
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: 14.2.d
    text: |-
      de intekening of deelname aan tentamens of examens of, anders dan een vrijstelling, een of meer beoordelingen
      in een vak op basis van een overzicht van behaalde resultaten in geval van bekostigd of erkend niet-bekostigd
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: '14.3'
    text: |-
      De subsidieontvanger toont op verzoek van de Minister op de in de verleningsbeschikking aangegeven wijze aan dat de
      scholing waarvoor de subsidie is verleend, is afgerond en dat is voldaan aan de verplichtingen die aan de subsidie
      zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: '14.4'
    text: |-
      De subsidieontvanger verleent desgevraagd alle medewerking aan door of namens de Minister uit te voeren
      risicogerichte, aselecte en vergelijkende onderzoeken naar de rechtmatigheid van de subsidieverstrekking.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel14
  - number: '15.1'
    text: 'De subsidieontvanger doet onverwijld schriftelijk melding aan de Minister indien:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel15
  - number: 15.1.a
    text: |-
      aannemelijk is geworden dat de scholing waarvoor de subsidie is verstrekt niet, niet tijdig of niet geheel zal
      worden afgerond;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel15
  - number: 15.1.b
    text: |-
      aannemelijk is geworden dat niet, niet tijdig of niet geheel aan de overige subsidieverplichtingen zal worden
      voldaan; of
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel15
  - number: 15.1.c
    text: |-
      zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel15
  - number: '15.2'
    text: De melding wordt voorzien van een toelichting waarbij de relevante stukken worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel15
  - number: '15.3'
    text: |-
      Op grond van een omstandigheid als bedoeld in het eerste lid en de daarbij gegeven toelichting, kan de Minister
      besluiten de einddatum van de scholing op een latere datum vast te stellen.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel15
  - number: '16.1'
    text: |-
      Nadat de opleider een STAP-aanmeldingsbewijs heeft verstrekt en de subsidie is verleend aan de subsidieaanvrager,
      zijn in verband met de betaling van het voorschot de navolgende verplichtingen van toepassing op de opleider.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: '16.2'
    text: |-
      De opleider verstrekt aan de Minister vanaf drie weken voor de startdatum van de scholing, maar uiterlijk binnen
      dertien weken na afronding van de scholing, een elektronische factuur volgens een door UWV verstrekt format,
      waarbij tevens het registratienummer van de beschikking tot subsidieverlening vermeld wordt.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: '16.3'
    text: |-
      Indien de subsidieontvanger, nadat betaling van het voorschot aan de opleider heeft plaatsgevonden, doch voor de
      startdatum van de scholing, de aanmelding bij de opleider tijdig heeft geannuleerd:
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: 16.3.a
    text: meldt de opleider het niet starten van deze scholing onverwijld aan de Minister; en
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: 16.3.b
    text: betaalt de opleider het voorschot onverwijld terug aan de Minister.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: '16.4'
    text: |-
      Indien de gesubsidieerde scholing niet kan starten of niet kan worden afgerond vanwege een omstandigheid die op
      grond van de algemene voorwaarden van de opleider in de risicosfeer van de opleider ligt:
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: 16.4.a
    text: |-
      meldt de opleider onverwijld aan de Minister dat de scholing niet kan starten of niet kan worden afgerond onder
      vermelding van de reden daarvan; en
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: 16.4.b
    text: betaalt de opleider het voorschot onverwijld terug aan de Minister.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: '16.5'
    text: |-
      Na de einddatum van de scholing verstrekt de opleider binnen dertien weken aan de Minister een bewijs van deelname
      waaruit blijkt of de subsidieontvanger de scholing heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: '16.6'
    text: |-
      De opleider vermeldt op het bewijs van deelname de persoon die de scholing heeft gevolgd, diens studentnummer
      of inschrijfnummer bij de scholing, het aanwezigheids- of deelnemingspercentage, of de scholing is afgerond
      met een diploma of certificaat, dan wel met de intekening, de deelname of de beoordelingen, bedoeld in
      [artikel 14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel14
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '14'
  - number: '16.7'
    text: |-
      Na de verstrekking van het STAP-aanmeldingsbewijs kan de opleider voor de startdatum van de scholing aan de
      Minister aanmeldingsinformatie verstrekken aan de hand van het door het UWV verstrekt format ‘Vooraanmelding’.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: '16.8'
    text: |-
      De meldingen en de verstrekkingen, bedoeld in het tweede tot en met zevende lid, worden langs elektronische weg
      gedaan.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: '16.9'
    text: |-
      De opleider verleent desgevraagd alle medewerking aan door of namens de Minister uit te voeren risicogerichte,
      aselecte en vergelijkende onderzoeken naar de algemene kwaliteit en inzet van subsidieontvangers ten aanzien van de
      door dezen aangevraagde en bij hem gevolgde scholing.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16
  - number: 16a
    text: |-
      Ingeval van een meerjarige scholing verstrekt de opleider voorafgaand aan de start van elk opleidingsjaar
      aan de minister aanmeldingsinformatie aan de hand van het door het UWV verstrekte format ‘Vooraanmelding’.
      [Artikel 16, zevende lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel16
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '16'
  - number: '17.1'
    text: De Minister stelt de subsidie vast binnen 13 weken nadat de opleider hem het bewijs van deelname heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel17
  - number: '17.2'
    text: De subsidie wordt vastgesteld op een bedrag tot ten hoogste het in de verleningsbeschikking genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel17
  - number: '18.1'
    text: |-
      De verstrekte subsidie kan geheel of gedeeltelijk worden teruggevorderd van de subsidieontvanger indien deze
      ten onrechte of voor een te hoog bedrag is verstrekt of indien niet aan de verplichtingen, bedoeld in de
      [artikelen 14][ref1] of [15][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045419#Artikel15
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0045419
        artikel: '15'
  - number: '18.2'
    text: |-
      De verstrekte subsidie kan geheel of gedeeltelijk worden teruggevorderd van de opleider indien door de minister is
      vastgesteld dat de opleider ten onrechte een bewijs van deelname heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel18
  - number: '18.3'
    text: |-
      Het aan de opleider betaalde voorschot kan geheel of gedeeltelijk van de opleider worden teruggevorderd, indien
      niet voldaan is aan een van de verplichtingen, genoemd in [artikel 16, derde tot en met zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel16
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '16'
  - number: '19.1'
    text: |-
      Indien een opleider naar het oordeel van de Minister misbruik of verwijtbaar oneigenlijk gebruik maakt van deze
      regeling, of anderszins ernstig tekortschiet in de naleving van de op hem rustende verplichtingen op grond van
      deze regeling, beslist de Minister over uitsluiting van deze opleider in het scholingsregister voor ten hoogste de
      resterende periode tot de vervaldatum van deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel19
  - number: '19.2'
    text: |-
      Indien een scholing niet voldoet aan de in deze regeling gestelde eisen, beslist de Minister over uitsluiting van
      deze scholing in het scholingsregister.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel19
  - number: '19.3'
    text: |-
      Onverminderd [artikel 18, eerste lid][ref1], kan de subsidieaanvrager voor een door de Minister te bepalen periode
      van ten hoogste twee jaren worden uitgesloten van het recht op subsidie op grond van deze regeling indien de
      subsidieaanvrager niet heeft voldaan aan de verplichtingen, bedoeld in de [artikelen 14][ref2] of [15][ref3] en
      daarbij sprake is geweest van verwijtbare nalatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0045419#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0045419#Artikel15
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0045419
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0045419
        artikel: '15'
  - number: 19a
    text: |-
      Zodra de Minister vaststelt dat in een kalenderjaar het aantal verleende subsidies voor een bepaalde scholing
      gelijk is aan de verleningsgrens, sluit de Minister de betreffende scholing uit in het scholingsregister tot en met
      het einde van het betreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel19a
  - number: '20.1'
    text: |-
      De Minister verleent aan de Raad van Bestuur van het UWV mandaat, volmacht en machtiging om, in het kader van de
      uitvoering van deze regeling:
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel20
  - number: 20.1.a
    text: |-
      besluiten te nemen, privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die een
      privaatrechtelijke rechtshandeling noch een besluit zijn;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel20
  - number: 20.1.b
    text: |-
      te beslissen op bezwaarschriften, met dien verstande dat de persoon die betrokken is bij het besluitvormingsproces
      ten aanzien van het bezwaarschrift niet ook betrokken is geweest bij het besluitvormingsproces in eerste aanleg; en
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel20
  - number: 20.1.c
    text: |-
      in rechte op te treden en tegen rechterlijke uitspraken hoger beroep of cassatie in te stellen, dan wel af te zien
      van hoger beroep of cassatie.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel20
  - number: '20.2'
    text: |-
      Het UWV is in het kader van de uitvoering van deze regeling bevoegd tot het verlenen van ondermandaat of het
      doorverlenen van zijn andere vertegenwoordigingsbevoegdheden aan bij het UWV werkzame functionarissen.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel20
  - number: '20.3'
    text: |-
      [Hoofdstuk 4 van het Organisatie-, mandaat- en volmachtbesluit SZW 2009][ref1] is van toepassing op de uitoefening
      van bevoegdheden op grond van deze regeling en tevens op de uitoefening van bevoegdheden die krachtens ondermandaat
      respectievelijk doorverlening van volmacht en machtiging worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024956
        hoofdstuk: '4'
  - number: '20.4'
    text: |-
      Onverminderd het eerste tot en met derde lid wijst de voorzitter van de Raad van Bestuur van het UWV onder hem
      ressorterende functionarissen, werkzaam bij het UWV, aan als ambtenaren, belast met het toezicht op de naleving van
      de verplichtingen, bedoeld in de [artikelen 14][ref1], [15][ref2] en [16, vijfde lid][ref3]. Het eerste en tweede
      lid zijn niet van toepassing op de uitvoering van [artikel 19, eerste en tweede lid][ref4], [artikel 19a][ref5], en
      op het beheer van het scholingsregister, bedoeld in [artikel 21][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045419#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0045419#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0045419#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0045419#Artikel19a
      [ref6]: https://wetten.overheid.nl/BWBR0045419#Artikel21
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0045419
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0045419
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0045419
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0045419
        artikel: 19a
      - id: ref6
        bwb_id: BWBR0045419
        artikel: '21'
  - number: '21.1'
    text: |-
      Er is een scholingsregister, dat de velden bevat die een opleider invult voor opname van een door hem aangeboden
      scholing in het scholingsregister.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: '21.2'
    text: DUO beheert het scholingsregister namens de Minister in het kader van de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: '21.3'
    text: 'Onder beheer van het scholingsregister door DUO wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.3.a
    text: |-
      het technische beheer van het scholingsregister, waaronder mede zijn begrepen het aanbrengen van noodzakelijke
      wijzigingen daarin ter verbetering van de gegevenskwaliteit en het functioneren daarvan;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.3.b
    text: |-
      het verwerken van gegevens die noodzakelijk zijn ter vaststelling van de scholing die in aanmerking komt voor
      registratie in het scholingsregister;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.3.c
    text: |-
      het verwerken van gegevens die door of namens opleiders worden aangeleverd ten behoeve van registratie in het
      scholingsregister;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.3.d
    text: |-
      het in de gelegenheid stellen van opleiders die geregistreerd staan in het scholingsregister om hun gegevens in het
      scholingsregister te actualiseren;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.3.e
    text: |-
      uitvoering geven aan een besluit van de Minister als bedoeld in [artikel 19, eerste of tweede lid][ref1] en
      [artikel 19a][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0045419#Artikel19a
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0045419
        artikel: 19a
  - number: 21.3.f
    text: het ter beschikking stellen van het scholingsregister aan het UWV ten behoeve van de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: '21.4'
    text: 'De velden, bedoeld in het eerste lid, zijn in elk geval:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.4.a
    text: KvK-nummer van de opleider;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.4.b
    text: naam van de opleiding;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.4.c
    text: startdatum van de scholing, voor zover er sprake is van een vast instroommoment;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.4.d
    text: einddatum van de scholing, voor zover er sprake is van een vast instroommoment; en
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.4.e
    text: |-
      catalogusprijs, alsmede de subsidiabele kosten van de scholing, bedoeld in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel4
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '4'
  - number: '21.5'
    text: |-
      DUO is bevoegd om ten behoeve van het beheer van het scholingsregister namens de Minister privaatrechtelijke
      rechtshandelingen te verrichten en handelingen te verrichten die een privaatrechtelijke rechtshandeling noch een
      besluit zijn.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: '21.6'
    text: |-
      De opleider die een scholing wil laten opnemen in het scholingsregister, vult de velden, bedoeld in het eerste lid,
      in en verklaart daarmee dat de scholing voldoet aan de in deze regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: '21.7'
    text: |-
      Indien de scholing waarvoor de opleider de velden, bedoeld in het eerste lid, heeft ingevuld een keuzedeel dan wel
      ander onderdeel is van een beroepsopleiding als bedoeld in de begripsbepaling van ‘scholing’, onderdeel a, of een
      onderdeel van een opleiding als bedoeld in de begripsbepaling van ‘scholing’, onderdeel b, beslist de minister over
      opname van de scholing in het scholingsregister.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: '21.8'
    text: |-
      Met betrekking tot een in het scholingsregister opgenomen scholing kunnen de volgende gegevens openbaar worden
      gemaakt:
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: 21.8.a
    text: |-
      de naam en de vestigingsplaats van de opleider zoals deze zijn opgenomen in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 21.8.b
    text: |-
      het aantal subsidies en het totale subsidiebedrag dat in een kalenderjaar is verleend voor de scholing waarvoor de
      opleider de velden, bedoeld in het eerste lid, heeft ingevuld.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel21
  - number: '22.1'
    text: |-
      Onder de naam Toetsingskamer STAP functioneert binnen het Ministerie van Sociale Zaken en Werkgelegenheid het
      dienstonderdeel directie Dienstverlening, Samenwerkingsverbanden en Uitvoering dat tot taak heeft de kwaliteit
      van het scholingsregister te bewaken en in dat verband de naleving van de regels die voor de opleiders gelden te
      beoordelen. De Minister bepaalt over welke kennisgebieden het dienstonderdeel in elk geval dient te beschikken.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
  - number: '22.2'
    text: 'De Toetsingskamer STAP vervult in elk geval de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
  - number: 22.2.a
    text: |-
      zij onderzoekt risicogericht, aselect en vergelijkenderwijze of de in het scholingsregister vermelde scholingen en
      subsidiabele kosten voldoen aan de artikelen van deze regeling;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
  - number: 22.2.b
    text: |-
      zij gaat risicogericht, aselect en vergelijkenderwijze na in hoeverre bewijzen van deelname overeenkomstig de
      voorschriften, genoemd in [artikel 14, tweede lid][ref1], zijn verstrekt en of deze verstrekking terecht heeft
      plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel14
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '14'
  - number: 22.2.c
    text: zij rapporteert aan de minister over de uitkomsten van haar onderzoeken;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
  - number: 22.2.d
    text: |-
      zij beheert een meldpunt voor eventueel misbruik en oneigenlijk gebruik van de regeling, beoordeelt deze signalen
      en informeert de minister hierover;
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
  - number: 22.2.e
    text: |-
      zij adviseert de minister, als zij van oordeel is dat een opleider ten onrechte een bewijs van deelname heeft
      verstrekt, over toepassing van [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel18
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '18'
  - number: 22.2.f
    text: |-
      zij adviseert de minister, als zij van oordeel is dat een opleider niet voldoet aan de voor hem geldende artikelen
      van deze regeling over toepassing van [artikel 19, eerste lid][ref1], of een minder verstrekkende actie jegens de
      opleider; en


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel19
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '19'
  - number: 22.2.g
    text: |-
      zij adviseert de minister, als zij van oordeel is dat een scholing niet voldoet aan een of meer artikelen van deze
      regeling, over toepassing van [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel19
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '19'
  - number: '22.3'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, werken in hun taakuitoefening samen met de op grond van
      [artikel 20, vierde lid][ref1], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel20
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '20'
  - number: '23.1'
    text: |-
      Voordat de Toetsingskamer haar advies, genoemd in [artikel 22, tweede lid, onderdelen e, f of g][ref1], uitbrengt
      neemt zij in ieder geval de volgende stappen:


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel22
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '22'
  - number: 23.1.a
    text: |-
      het aanschrijven van de opleider met aangeven van de gronden op basis waarvan zij van oordeel is dat dat advies
      wordt uitgebracht; en
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel23
  - number: 23.1.b
    text: het aangeven van het voornemen jegens de opleider tot uitbrengen van het advies aan de Minister.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel23
  - number: '23.2'
    text: |-
      Het eerste lid is niet van toepassing indien het advies ziet op een scholing waarvan de Toetsingskamer STAP heeft
      geconcludeerd dat deze behoort tot de scholingen die zijn opgenomen in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel23
  - number: '24.1'
    text: |-
      De Minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel24
  - number: '24.2'
    text: |-
      Het eerste lid is niet van toepassing op de [artikelen 20][ref1], [21][ref2], [22][ref3] en [23][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0045419#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0045419#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0045419#Artikel23
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0045419
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0045419
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0045419
        artikel: '23'
  - number: '25'
    text: |-
      Het UWV brengt aan de Minister inhoudelijk en financieel verslag uit over de uitvoering van deze regeling
      overeenkomstig [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '26.1'
    text: Het Rijk voorziet in de middelen tot dekking van de lasten verbonden aan deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
  - number: '26.2'
    text: Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
  - number: '26.3'
    text: |-
      In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
  - number: '26.4'
    text: |-
      Voor 1 oktober van elk jaar verstrekt het UWV aan de Minister in het jaarplan met begroting een opgave van het
      totaalbedrag aan de voor het komende jaar geraamde lasten met betrekking tot deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
  - number: '26.5'
    text: |-
      De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref1],
      een periodiek voorschot op de rijksbijdrage, bedoeld in het eerste lid, van de geraamde subsidielasten met als
      valutadatum de tweeëntwintigste dag van elke maand, en op de geraamde uitvoeringskosten met als valutadatum de
      vijftiende dag van elke maand. De Minister kan, na overleg met het UWV, van de bedoelde voorschotbedragen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
  - number: '26.6'
    text: |-
      In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      worden de baten en lasten opgenomen, alsmede de ontvangen voorschotten, bedoeld in het vijfde lid, uitgesplitst
      naar subsidielasten en uitvoeringskosten, met betrekking tot deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '26.7'
    text: |-
      Op de in het zesde lid bedoelde subsidielasten komen in mindering de subsidiebedragen die op grond van
      [artikel 18][ref1] zijn teruggevorderd en de bedragen die anderszins zijn terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045419#Artikel18
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0045419
        artikel: '18'
  - number: '26.8'
    text: |-
      Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], rekent de Minister de baten en
      lasten, alsmede de ontvangen voorschotten, bedoeld in het vijfde lid, met betrekking tot het desbetreffende
      kalenderjaar af, met als valutadatum 1 juni van het daarop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '27.1'
    text: |-
      De Minister zendt binnen twee jaar na de inwerkingtreding van deze regeling aan de Staten-Generaal een verslag over
      de doeltreffendheid en doelmatigheid van deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel27
  - number: '27.2'
    text: |-
      Het UWV verstrekt drie keer per jaar een verslag over de voortgang van de regeling overeenkomstig
      [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '27.3'
    text: De Minister en het UWV maken afspraken over het verstrekken van de benodigde gegevens.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel27
  - number: '28'
    text: |-
      Subsidieontvangers en opleiders werken, onder meer door het verschaffen van de daartoe benodigde inlichtingen,
      gegevens en bescheiden, mee aan door of namens de Minister ingesteld onderzoek dat erop is gericht de Minister
      inlichtingen te verschaffen die van belang zijn voor de evaluatie van de doeltreffendheid en doelmatigheid van deze
      regeling en de ontwikkeling van het beleid van de Minister.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel28
  - number: '29.1'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop
      [artikel 1, onderdelen B en C, van de Wet afschaffing fiscale aftrek scholingsuitgaven][ref1] (*Stb*. 2019, 514)
      in werking treedt, met uitzondering van de [artikelen 6][ref2] en [8, derde lid, onderdelen d en f][ref3], die in
      werking treden met ingang van 1 juli 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0043046#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0045419#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0045419#Artikel8
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0043046
        artikel: I
      - id: ref2
        bwb_id: BWBR0045419
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0045419
        artikel: '8'
  - number: '29.2'
    text: Deze regeling vervalt met ingang van 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel29
  - number: '29.3'
    text: |-
      In afwijking van het tweede lid blijft deze regeling, zoals die luidde op 31 december 2023, van toepassing op de
      afwikkeling van de subsidieaanvragen op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel29
  - number: '30'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling STAP-budget.'
    url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#Artikel30
