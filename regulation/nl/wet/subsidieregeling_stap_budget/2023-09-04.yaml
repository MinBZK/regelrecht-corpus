preamble:
  text: |-
    Handelende, voor zover het scholing en het scholingsregister betreft, in overeenstemming met de Minister van
    Onderwijs, Cultuur en Wetenschap;

    Gelet op de artikelen 3, eerste en derde lid, 5 en 8, eerste lid, van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0045419/2023-09-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanvraagtijdvak:* een tijdvak als bedoeld in [artikel 9][ref1] waarin
      aanvragen voor subsidie op grond van deze regeling kunnen worden ingediend;
        - *aanwezigheids- of deelnemingspercentage:* een percentage dat door de opleider wordt vastgesteld door middel
      van registratie van de fysieke aanwezigheid van de subsidieontvanger gedurende de scholing, dan wel, in geval van
      scholing die langs digitale weg wordt gegeven, van deelname aan de scholing in digitale vorm;
        - *bewijs van deelname:* een door de opleider, overeenkomstig een door het UWV vastgesteld format,
      opgesteld document waarop is aangegeven of de gesubsidieerde scholing is afgerond overeenkomstig
      [artikel 14, tweede lid][ref2];
        - *bijdrage van een derde:* bijdrage die de subsidieaanvrager van een ander dan de Minister voor de te subsidiëren
      of gesubsidieerde activiteit ontvangt en die de subsidieaanvrager aanwendt of behoort aan te wenden voor de te
      subsidiëren of gesubsidieerde activiteit;
        - *catalogusprijs:* de prijs, omvattend alle kosten die direct samenhangen met een te geven scholing, die
      de opleider vermeldt in het scholingsregister en waarvoor de opleider in zijn papieren of zijn digitale
      communicatiekanaal een scholing aanbiedt;
        - *deelnemer:* een subsidieontvanger die deelneemt, gaat deelnemen of heeft deelgenomen aan een scholing;
        - *diploma of certificaat:* een schriftelijk bewijs van afronding van een scholing of deel van een scholing, te
      bereiken door het afleggen van een test, proef of examen;
        - *DUO:* de Dienst Uitvoering Onderwijs;
        - *einddatum van de scholing:* de datum die in de beschikking tot subsidieverlening als datum van afronding van de
      scholing is vermeld;
        - *EVC-aanbieder:* aanbieder die volgens de principes en uitgangspunten van de Kwaliteitscode EVC een EVC-
      procedure uitvoert aan de hand van een voor EVC erkende onderwijs-, beroeps- of branchestandaard, en die voor de
      desbetreffende standaard is opgenomen in het register erkende EVC-aanbieders van het Nationaal Kenniscentrum EVC;
        - *EVC-procedure:* geheel van processtappen en instrumenten waarmee een EVC-aanbieder eerder of elders verworven
      competenties van een kandidaat beoordeelt ten opzichte van een voor EVC erkende onderwijs-, beroeps- of
      branchestandaard, en waarbij de uitkomsten worden vastgelegd in een ervaringscertificaat;
        - *KvK-nummer:* een door de Kamer van Koophandel toegekend uniek nummer over een onderneming of maatschappelijke
      activiteit in het handelsregister;
        - *meerjarige scholing:* meerjarige scholing als bedoeld in [artikel 6, eerste lid][ref3];
        - *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *opleider:* een aanbieder van een scholing waarvoor op grond van deze regeling subsidie kan worden verleend;
        - *opleidingsjaar:* een opleidingsjaar, dat deel uitmaakt van een meerjarige scholing, waarvoor les-, cursus-,
      college- of examengeld in rekening wordt gebracht;
        - *scholing:* a. een beroepsopleiding als bedoeld in
      [artikel 7.1.2, tweede lid, van de Wet educatie en beroepsonderwijs][ref4], een keuzedeel als
      bedoeld in [artikel 7.1.3, tweede lid, van de Wet educatie en beroepsonderwijs][ref5] dan wel
      andere onderdelen van een beroepsopleiding als hiervoor bedoeld, verzorgd door een uit ’s Rijks kas
      bekostigde instelling voor beroepsonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs][ref6]
      of verzorgd door een andere instelling voor beroepsonderwijs indien voor die opleiding de erkenning,
      bedoeld in [artikel 1.4.1, eerste lid of lid 1a, van de Wet educatie en beroepsonderwijs][ref7]
      is verleend; b. een opleiding als bedoeld in de [artikelen 7.3a][ref8] en
      [7.3b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek ][ref9]waarvoor accreditatie nieuwe of
      bestaande opleiding is verleend dan wel onderdelen van een zodanige opleiding;
        - *scholingsregister:* het scholingsregister, genoemd in [artikel 21][ref10], waarin alle scholing is opgenomen
      waarvoor op grond van deze regeling subsidie kan worden verleend;
        - *STAP-aanmeldingsbewijs:* een door de opleider opgesteld document, waarmee wordt gelijkgesteld een aanmelding
      voor een scholing in het van overheidswege bekostigd onderwijs of erkend niet-bekostigd onderwijs, waarop is
      aangegeven welke scholing gaat worden gevolgd, de persoon die de scholing gaat volgen, diens geboortedatum en
      studentnummer of inschrijfnummer bij de scholing, de voorziene start- en einddatum van de scholing en in geval er
      sprake is van een meerjarige scholing de einddatum van het desbetreffende opleidingsjaar;
        - *subsidieaanvrager:* de persoon die een aanvraag voor subsidieverlening op grond van deze regeling heeft
      ingediend;
        - *subsidieontvanger:* de subsidieaanvrager aan wie krachtens deze regeling subsidie is verleend;
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11];
        - *verleningsgrens:* het maximaal aantal verleende subsidies bedoeld in [artikel 12a, eerste lid][ref12];
        - *vervolgaanvraag:* een subsidieaanvraag voor een volgend opleidingsjaar als bedoeld in
      [artikel 6, tweede lid][ref13];
        - *volksverzekeringen:* de verzekeringen op grond van de [Algemene Ouderdomswet][ref14], de
      [Algemene nabestaandenwet][ref15], de [Algemene Kinderbijslagwet][ref16] en de [Wet langdurige zorg][ref17].


