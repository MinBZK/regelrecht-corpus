$id: uitvoeringswet_grondkamers
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2012-07-01'
bwb_id: BWBR0021912
url: https://wetten.overheid.nl/BWBR0021912/2012-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is tegelijk met het wetsvoorstel tot vaststelling en
    invoering van titel 5 van Boek 7 van het Burgerlijk Wetboek onder gelijktijdige intrekking van de Pachtwet de
    bepalingen van de Pachtwet over de samenstelling en werkwijze van de grondkamers en van de Centrale Grondkamer over
    te hevelen naar een wet tot uitvoering van titel 5 van Boek 7 van het Burgerlijk Wetboek, alsmede enige wetgeving
    aan te passen aan genoemde titel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: Er zijn grondkamers, waarvan het rechtsgebied en de standplaats door Ons worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel1
  - number: 1a
    text: |-
      Op de grondkamers is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing, met uitzondering van de
      [artikelen 12][ref2], [14][ref3], [21][ref4] en [22][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '2.1'
    text: |-
      De grondkamer bestaat uit een voorzitter en ten minste vier en ten hoogste twaalf leden. Zij wordt bijgestaan door
      een secretaris.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel2
  - number: '2.2'
    text: |-
      Er kunnen een plaatsvervangende voorzitter, plaatsvervangende leden en een of meer plaatsvervangende secretarissen
      worden benoemd.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel2
  - number: '2.3'
    text: |-
      Bij verhindering of ontstentenis van de voorzitter of van de plaatsvervangende voorzitter treedt het oudste lid als
      waarnemend voorzitter op.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel2
  - number: '3.1'
    text: |-
      Wij benoemen en ontslaan de voorzitter, de plaatsvervangende voorzitter, de leden, de secretaris alsmede de
      plaatsvervangende leden en de plaatsvervangende secretarissen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel3
  - number: '3.2'
    text: |-
      De leden en de plaatsvervangende leden worden benoemd voor de tijd van vijf jaren. Zij zijn bij hun aftreden
      opnieuw benoembaar. Op eigen verzoek kunnen zij door Ons worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel3
  - number: '3.3'
    text: Voor de benoeming van een lid of van een plaatsvervangend lid maakt de grondkamer een aanbeveling op.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel3
  - number: '3.4'
    text: |-
      Bij de benoeming van de leden en de plaatsvervangende leden dragen Wij zorg, dat in de grondkamer het belang van de
      pachters, noch dat van de verpachters overheerst.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel3
  - number: '3.5'
    text: De in het eerste lid bedoelde personen worden voor de aanvang hunner bediening beëdigd.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel3
  - number: '3.6'
    text: |-
      Bij het bereiken van de ouderdom van zeventig jaren wordt aan de voorzitter, de plaatsvervangende voorzitter, de
      leden en plaatsvervangende leden ontslag verleend met ingang van de eerstvolgende maand.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel3
  - number: '4.1'
    text: 'Voor benoeming tot secretaris of plaatsvervangende secretaris komt in aanmerking degene:'
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel4
  - number: 4.1.a
    text: |-
      aan wie door een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] de graad Bachelor op het gebied van het recht en
      tevens de graad Master op het gebied van het recht is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 4.1.b
    text: |-
      die aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] het doctoraat in de rechtsgeleerdheid of het recht
      om de titel meester te voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '4.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onderdeel a,
      gelijk worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorts nadere regels worden gesteld met betrekking tot de
      beroepsvereisten.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd hetgeen elders is bepaald, worden de voorzitter, de plaatsvervangende voorzitter, de leden, de
      plaatsvervangende leden, de secretaris en de plaatsvervangende secretarissen ontslagen:
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
  - number: 5.1.a
    text: bij gebleken ongeschiktheid door ouderdom of door aanhoudende lichamelijke of psychische aandoeningen;
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
  - number: 5.1.b
    text: wanneer zij onder curatele zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
  - number: '5.2'
    text: 'Onverminderd hetgeen elders is bepaald, kunnen de in het vorige lid genoemde personen worden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
  - number: 5.2.a
    text: |-
      bij overtreding van de [artikelen 6][ref1] en [7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0021912#Artikel7
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021912
        artikel: '7'
        hoofdstuk: '1'
  - number: 5.2.b
    text: |-
      wanneer zij in staat van faillissement zijn verklaard, ten aanzien van hen de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard, zij surséance van betaling hebben verkregen of wegens schulden zijn
      gegijzeld.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
  - number: '5.3'
    text: Alvorens het ontslag op grond van het in de voorgaande leden bepaalde wordt verleend, wordt de betrokkene gehoord.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
  - number: '5.4'
    text: |-
      Wanneer zich een van de omstandigheden voordoet, als bedoeld in het tweede lid, zijn Onze Ministers van Veiligheid
      en Justitie en van Economische Zaken, Landbouw en Innovatie bevoegd de betrokkene in de uitoefening van zijn ambt
      terstond te schorsen. De schorsing mag een termijn van drie maanden niet overschrijden. Op deze termijn is de
      [Algemene termijnenwet][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '5.5'
    text: |-
      Wanneer tijdens de in het vierde lid bedoelde schorsing het besluit tot ontslag wordt genomen, blijft de schorsing
      van kracht tot het tijdstip, waarop het ontslag ingaat.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel5
  - number: '6.1'
    text: |-
      De voorzitter, de plaatsvervangende voorzitter, de leden, de plaatsvervangende leden, de secretaris en de
      plaatsvervangende secretarissen zijn verplicht het geheim te bewaren omtrent hetgeen hun als zodanig bekend wordt.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel6
  - number: '6.2'
    text: |-
      Zij mogen zich noch direct, noch indirect in enig bijzonder onderhoud of gesprek inlaten met partijen of hun
      raadslieden, noch enige bijzondere onderrichting, memorie of schrifturen aannemen over enige aangelegenheid,
      welke aanhangig is of waarvan zij weten of vermoeden, dat deze aanhangig zal worden bij de grondkamer, waartoe
      zij behoren.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel6
  - number: '7.1'
    text: |-
      Het is de voorzitter en de secretaris verboden zich te belasten met de consultatie omtrent en de verdediging
      van zaken, welke bij enige grondkamer of pachtkamer, bij de Centrale Grondkamer of bij de pachtkamer van het
      gerechtshof te Arnhem aanhangig zijn, of waarvan zij weten of vermoeden, dat deze daarbij aanhangig zullen worden.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het is de plaatsvervangende voorzitter, de plaatsvervangende secretaris, de leden en de plaatsvervangende leden
      verboden zich te belasten met de consultatie omtrent en de verdediging van zaken, welke aanhangig zijn of waarvan
      zij weten of vermoeden, dat deze aanhangig zullen worden bij de grondkamer, waartoe zij behoren, of bij de Centrale
      Grondkamer, in het laatste geval voor zover het betreft zaken, aan de behandeling waarvan zij in de grondkamer
      hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel7
  - number: '8.1'
    text: De grondkamer houdt zitting en beslist met de voorzitter en twee leden.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel8
  - number: '8.2'
    text: |-
      Beschikkingen van de grondkamer, genomen met een ander aantal personen dan in het vorige lid is vermeld, zijn
      nietig.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel8
  - number: '9.1'
    text: |-
      De voorzitter en de secretaris genieten een bezoldiging, die bij algemene maatregel van bestuur wordt vastgesteld.
      Zij genieten voorts een vergoeding voor reis- en verblijfkosten volgens bij algemene maatregel van bestuur te
      stellen regelen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel9
  - number: '9.2'
    text: |-
      De plaatsvervangende voorzitter, de leden, de plaatsvervangende leden en de plaatsvervangende secretarissen
      genieten een vergoeding voor reis- en verblijfkosten en verdere vergoedingen volgens bij algemene maatregel van
      bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel9
  - number: '10'
    text: Er is een Centrale Grondkamer, gevestigd te Arnhem.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel10
  - number: '11'
    text: |-
      De tot de rechterlijke macht behorende leden, de deskundige leden en de plaatsvervangende deskundige leden van de
      pachtkamer van het gerechtshof te Arnhem zijn van rechtswege tevens lid, onderscheidenlijk plaatsvervangend lid,
      van de Centrale Grondkamer.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel11
  - number: '12.1'
    text: Wij benoemen en ontslaan de griffier van de Centrale Grondkamer.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel12
  - number: '12.2'
    text: Wij kunnen een of meer plaatsvervangende griffiers benoemen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel12
  - number: '12.3'
    text: |-
      De griffier voldoet aan de vereisten tot benoembaarheid tot rechterlijke ambtenaar, gesteld in
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '13.1'
    text: |-
      De Centrale Grondkamer houdt zitting en beslist met drie tot de rechterlijke macht behorende leden en twee niet tot
      de rechterlijke macht behorende deskundige leden.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel13
  - number: '13.2'
    text: Een van de tot de rechterlijke macht behorende leden treedt op als voorzitter.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel13
  - number: '13.3'
    text: |-
      Beschikkingen van de Centrale Grondkamer, genomen met een ander aantal personen dan in het eerste lid is vermeld,
      zijn nietig.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel13
  - number: '14'
    text: |-
      De [artikelen 6][ref1] en [7][ref2] vinden ten aanzien van de leden, de plaatsvervangende leden, de griffier en de
      plaatsvervangende griffier van de Centrale Grondkamer overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0021912#Artikel7
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021912
        artikel: '7'
        hoofdstuk: '1'
  - number: '15.1'
    text: |-
      De griffier geniet een bezoldiging, die bij algemene maatregel van bestuur wordt vastgesteld. Hij geniet voorts een
      vergoeding voor reis- en verblijfkosten volgens bij algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel15
  - number: '15.2'
    text: |-
      De leden, de plaatsvervangende leden en de plaatsvervangende griffier van de Centrale Grondkamer genieten een
      vergoeding voor reis- en verblijfkosten en verdere vergoedingen volgens bij algemene maatregel van bestuur te
      stellen regelen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel15
  - number: '16'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van dit hoofdstuk alsmede
      omtrent de werkwijze van de grondkamers en de Centrale Grondkamer.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel16
  - number: '17.1'
    text: |-
      Het verzoek tot goedkeuring van een pachtovereenkomst en van een overeenkomst tot wijziging of beëindiging van
      een pachtovereenkomst geschiedt door indiening bij de grondkamer van een door partijen ondertekende akte of een
      notarieel afschrift, met zoveel ongetekende afschriften als er meer dan twee partijen bij de overeenkomst zijn
      betrokken.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel17
  - number: '17.2'
    text: |-
      Aan het hoofd van de akte worden de namen, voornamen en woonplaatsen van de partijen vermeld, voor zover deze niet
      in de overeenkomst zijn opgenomen. Het gepachte moet met de kadastrale aanduiding zijn aangeduid.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel17
  - number: '17.3'
    text: |-
      Indien de goedkeuring van de pachtovereenkomst of van de overeenkomst tot wijziging van een pachtovereenkomst
      wordt verlangd op grond van [artikel 324, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1], wordt tevens de
      beschikking van de grondkamer, waarbij de ontwerp-overeenkomst werd goedgekeurd, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel324
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '324'
  - number: '18'
    text: |-
      Het verzoek tot goedkeuring van een ontwerp-pachtovereenkomst of van een ontwerp-overeenkomst tot wijziging van
      een pachtovereenkomst wordt ingediend bij de grondkamer. Het moet zijn ondertekend door degenen, die in de ontwerp-
      overeenkomst als partijen zijn genoemd of hun gemachtigden. Daarbij wordt overgelegd een ongetekend exemplaar van
      de ontwerp-overeenkomst, vermeerderd met zoveel ongetekende exemplaren als er verzoekers zijn. Het verpachte moet
      met de kadastrale aanduiding zijn aangeduid.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel18
  - number: '19.1'
    text: |-
      De verzoeken, bedoeld in de [artikelen 325, derde lid][ref1], [326, eerste lid][ref2], [328, derde lid][ref3],
      [333, tweede en derde lid][ref4], [345, tweede lid][ref5], [348, derde lid][ref6], [354, tweede lid][ref7],
      [379, eerste lid][ref8], [380, tweede lid][ref9] en [381, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref10],
      vinden plaats door indiening van een verzoekschrift bij de grondkamer met zoveel afschriften als er wederpartijen
      bij de overeenkomst of belanghebbenden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel326
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel328
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel333
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel345
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel348
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel354
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel379
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel380
      [ref10]: https://wetten.overheid.nl/BWBR0005290#Artikel381
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '325'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '326'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '328'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '333'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '345'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '348'
      - id: ref7
        bwb_id: BWBR0005290
        artikel: '354'
      - id: ref8
        bwb_id: BWBR0005290
        artikel: '379'
      - id: ref9
        bwb_id: BWBR0005290
        artikel: '380'
      - id: ref10
        bwb_id: BWBR0005290
        artikel: '381'
  - number: '19.2'
    text: |-
      Het verzoekschrift vermeldt de naam, de voornamen en de woonplaats van de verzoeker, de naam en de woonplaats van
      de wederpartij of van de belanghebbenden, als deze er zijn, voorts de gronden, waarop het verzoek steunt, en de
      gevraagde beslissing.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel19
  - number: '20.1'
    text: |-
      Bij het verzoek, bedoeld in [artikel 381, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1], wordt een
      verklaring overgelegd van burgemeester en wethouders, waaruit blijkt, dat die doeleinden niet in strijd zijn met
      een geldend of een in ontwerp ter inzage gelegd bestemmingsplan. Deze verklaring kan slechts worden afgegeven nadat
      Gedeputeerde Staten daartoe hun toestemming hebben gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel381
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '381'
  - number: '20.2'
    text: |-
      Indien de Staat, een provincie, een gemeente, een waterschap, een veenschap of een veenpolder de in
      [artikel 381, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1] bedoelde derde is, zijn slechts Gedeputeerde
      Staten bevoegd de in dat lid bedoelde verklaring af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel381
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '381'
  - number: '20.3'
    text: |-
      Het bevoegde college beslist binnen drie weken na de indiening van het verzoek, onderscheidenlijk binnen drie weken
      na de ontvangst van de toestemming van Gedeputeerde Staten. Indien burgemeester en wethouders binnen de gestelde
      termijn geen beslissing hebben genomen, kan de afgifte van de verklaring worden gevraagd aan Gedeputeerde Staten,
      die binnen zes weken nadien beslissen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel20
  - number: '20.4'
    text: |-
      De in dit artikel bedoelde verklaringen zijn slechts geldig gedurende zes maanden na de dagtekening daarvan, tenzij
      de verklaring zelf een kortere geldigheidsduur vermeldt.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel20
  - number: '20.5'
    text: |-
      De verklaring, bedoeld in het eerste of tweede lid, vermeldt tevens de datum van de terinzagelegging en de datum
      en wijze van bekendmaking daarvan, alsmede de datum en het nummer van de door Gedeputeerde Staten verleende
      toestemming.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel20
  - number: '20.6'
    text: |-
      De grondkamer neemt een verklaring, waarin een of meer van de in het vijfde lid bedoelde gegevens ontbreken, niet
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel20
  - number: '21.1'
    text: |-
      De verzoeken, bedoeld in de [artikelen 385][ref1] en
      [399e, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2], worden gedaan bij een verzoekschrift, dat bij de
      grondkamer wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel385
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel399e
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '385'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 399e
  - number: '21.2'
    text: |-
      Het verzoekschrift vermeldt de naam, de voornamen en de woonplaats van de verzoeker, voorts de gronden, waarop het
      verzoek steunt en de gevraagde beslissing.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel21
  - number: '22.1'
    text: |-
      De in deze afdeling bedoelde verzoeken moeten worden ingediend bij de grondkamer, binnen het rechtsgebied waarvan
      de onroerende zaak of het grootste gedeelte daarvan is gelegen. Indien het een hoeve betreft, wordt het verzoek
      ingediend bij de grondkamer, binnen het rechtsgebied waarvan het hoofdgebouw, tot de hoeve behorend, gelegen is.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel22
  - number: '22.2'
    text: |-
      Indien de grondkamer van oordeel is, dat een verzoek ten onrechte bij haar is ingediend, verwijst zij het verzoek
      naar de grondkamer, die naar haar oordeel bevoegd is het verzoek te behandelen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel22
  - number: '23.1'
    text: |-
      De grondkamer kan een onderzoek naar aanleiding van het bij haar ingediende verzoek gelasten. Zij zal hiermee
      een of meer leden of een of meer door haar aan te wijzen deskundigen belasten. Deze aanwijzing geschiedt in het
      algemeen, dan wel voor een bepaald geval.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel23
  - number: '23.2'
    text: |-
      Aan de deskundige wordt door de voorzitter van de grondkamer een vergoeding toegekend op de voet van het bij en
      krachtens de [Wet griffierechten burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '23.3'
    text: |-
      Binnen een maand na het gelasten van het onderzoek doet de grondkamer daarvan mededeling aan de verzoeker en de
      bij de overeenkomst of ontwerp-overeenkomst betrokken partijen onder vermelding van de plaats waar en het tijdstip
      waarop het onderzoek wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel23
  - number: '24.1'
    text: |-
      De verzoeker en de bij de overeenkomst of ontwerp-overeenkomst betrokken partijen of belanghebbenden zijn
      verplicht aan degene, aan wie het onderzoek is opgedragen, desgevraagd de ter uitvoering van zijn opdracht nodige
      inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel24
  - number: '24.2'
    text: |-
      Degene, aan wie het onderzoek is opgedragen, is bevoegd de onroerende zaak, waarop het verzoek betrekking heeft, te
      betreden. Zo nodig verschaft hij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel24
  - number: '24.3'
    text: |-
      De uitkomsten van het onderzoek worden neergelegd in een rapport, dat wordt ondertekend door degene, die met het
      onderzoek werd belast.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel24
  - number: '25.1'
    text: |-
      Indien de grondkamer een pachtovereenkomst of een overeenkomst tot wijziging of beëindiging van een
      pachtovereenkomst niet aanstonds kan goedkeuren, deelt zij aan partijen haar bezwaren mede en geeft zij aan of en
      op welke wijze deze kunnen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel25
  - number: '25.2'
    text: |-
      Indien een onderzoek door een van haar leden of door een deskundige heeft plaats gehad, zendt de grondkamer aan
      partijen, tegelijk met de mededeling van haar bezwaren, een afschrift van het rapport van het onderzoek toe.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel25
  - number: '25.3'
    text: |-
      De in het vorige lid bedoelde mededeling vermeldt de termijn, waarbinnen partijen schriftelijke opmerkingen aan de
      grondkamer kunnen inzenden en een mondelinge behandeling kunnen verzoeken.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de partijen toestemmen in de wijzigingen, die door de grondkamer als voorwaarde voor het verlenen van haar
      goedkeuring aan de overeenkomst worden gesteld, legt de grondkamer deze vast in een akte, die door partijen wordt
      ondertekend en voor dezen bindend is.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel25
  - number: '25.5'
    text: |-
      Indien de partijen de door de grondkamer nodig geoordeelde wijzigingen niet overnemen, wijzigt de grondkamer de
      overeenkomst, of, indien zij oordeelt dat door wijziging haar in het eerste lid bedoelde bezwaren niet kunnen
      worden opgeheven, vernietigt zij haar.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel25
  - number: '26.1'
    text: |-
      Indien de grondkamer een ontwerp-pachtovereenkomst of een ontwerp-overeenkomst tot wijziging van een
      pachtovereenkomst niet aanstonds kan goedkeuren, deelt zij aan de personen, die in de ontwerp-overeenkomst als
      partijen zijn genoemd, haar bezwaren mee en geeft zij aan of en op welke wijze deze kunnen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel26
  - number: '26.2'
    text: Het tweede en derde lid van het voorgaande artikel zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel26
  - number: '26.3'
    text: |-
      Indien de grondkamer de ontwerp-overeenkomst goedkeurt, wordt de goedkeuring niet op de ontwerp-akte gesteld, doch
      bij een afzonderlijke beschikking verleend.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel26
  - number: '26.4'
    text: |-
      Indien de grondkamer de ontwerp-overeenkomst niet kan goedkeuren en zij van oordeel is, dat haar bezwaren door
      wijziging van de ontwerp-overeenkomst kunnen worden opgeheven, vermeldt zij deze wijzigingen in haar beschikking.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel26
  - number: '27.1'
    text: |-
      Indien bij een beslissing op een verzoek in andere dan de in de [artikelen 25][ref1] en [26][ref2] bedoelde
      gevallen naar het oordeel van de grondkamer behalve de verzoeker ook anderen belang hebben, deelt de grondkamer,
      onder gelijktijdige kennisgeving van de eventuele bezwaren, aan de verzoeker en de andere belanghebbenden mede,
      binnen welke termijn zij schriftelijke opmerkingen aan de grondkamer kunnen inzenden en een mondelinge behandeling
      kunnen verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021912#Artikel26
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021912
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '27.2'
    text: |-
      Indien een onderzoek door een van haar leden of door een deskundige heeft plaats gehad, zendt de grondkamer aan
      de verzoeker en de andere belanghebbenden, tegelijk met haar mededeling, een afschrift van het rapport van het
      onderzoek toe.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel27
  - number: '28.1'
    text: |-
      Indien bij een beslissing op een verzoek in andere dan de in de [artikelen 25][ref1] en [26][ref2] bedoelde
      gevallen naar het oordeel van de grondkamer uitsluitend de verzoeker belang heeft en de grondkamer het verzoek niet
      aanstonds kan toewijzen, is de grondkamer bevoegd – en op een daartoe strekkend verzoek verplicht – een mondelinge
      behandeling van het bij haar ingediende verzoek te doen plaats hebben op een door haar te bepalen zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021912#Artikel26
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021912
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '28.2'
    text: |-
      Indien een onderzoek door een van haar leden of door een deskundige heeft plaats gehad, zendt de grondkamer aan de
      verzoeker, tegelijk met haar oproep voor de mondelinge behandeling, een afschrift van het rapport van het onderzoek
      toe.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel28
  - number: '29'
    text: |-
      De secretaris maakt een verslag van hetgeen bij de mondelinge behandeling voorvalt met vermelding van de zakelijke
      inhoud van de afgelegde verklaringen. Het verslag wordt door de voorzitter en de secretaris vastgesteld en
      ondertekend. Desgevraagd ontvangen partijen daarvan afschrift.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel29
  - number: '30.1'
    text: De partijen bij de overeenkomst en de verzoeker kunnen zich doen bijstaan of vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel30
  - number: '30.2'
    text: De partijen bij de overeenkomst en de verzoeker kunnen getuigen ter zitting meebrengen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel30
  - number: '31.1'
    text: |-
      De partijen bij de overeenkomst en de verzoeker kunnen met machtiging van de grondkamer bij deurwaardersexploot
      getuigen oproepen om aldaar te verschijnen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel31
  - number: '31.2'
    text: |-
      Ieder, die bij deurwaardersexploot is opgeroepen om als getuige ter zitting te verschijnen, is verplicht aan die
      oproeping gehoor te geven.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel31
  - number: '31.3'
    text: |-
      De grondkamer kan bevelen, dat getuigen, die, hoewel bij deurwaardersexploot opgeroepen, niet zijn verschenen, door
      de openbare macht voor haar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel31
  - number: '31.4'
    text: |-
      De ingevolge [artikel 30][ref1] ter zitting meegebrachte getuigen worden gehoord, voor zover de grondkamer hun
      verhoor dienstig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel30
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '31.5'
    text: |-
      De [artikelen 164][ref1], [171 tot en met 173][ref2], [177][ref3] en
      [179 van het Wetboek van Burgerlijke Rechtsvordering][ref4] zijn ten aanzien van het getuigenverhoor van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel177
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel179
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '164'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '171'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '177'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '179'
  - number: '31.6'
    text: |-
      Van het getuigenverhoor wordt proces-verbaal gemaakt.
      [Artikel 180 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing met dien
      verstande, dat het proces-verbaal door de voorzitter en de secretaris wordt mede-ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel180
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '180'
  - number: '31.7'
    text: |-
      Getuigen ontvangen desgevraagd ten laste van degene, die hen heeft voorgebracht, schadevergoeding, door de
      voorzitter te begroten overeenkomstig het bij en krachtens de [Wet griffierechten burgerlijke zaken][ref1]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '32'
    text: |-
      Bij de behandeling van een verzoek tot goedkeuring van een ontwerp-pachtovereenkomst of van een ontwerp-
      overeenkomst tot wijziging van een pachtovereenkomst vinden de [artikelen 29][ref1], [30][ref2] en [31][ref3]
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0021912#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0021912#Artikel31
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021912
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0021912
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '33'
    text: |-
      Indien de grondkamer de pachtovereenkomst of de overeenkomst tot wijziging of beëindiging van de pachtovereenkomst
      ongewijzigd goedkeurt, zendt de secretaris aan iedere partij een exemplaar of een afschrift van de overeenkomst,
      waarop de beslissing, die de grondkamer heeft genomen, is aangetekend.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel33
  - number: '34.1'
    text: |-
      De beschikkingen van de grondkamer zijn met redenen omkleed, met uitzondering van de beschikkingen die
      overeenkomstig [artikel 33][ref1] zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel33
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '34.2'
    text: |-
      Een expeditie van de beschikking wordt aan de bij de overeenkomst of ontwerp-overeenkomst betrokken partijen of
      belanghebbenden alsmede aan de verzoeker toegezonden. De dag van verzending wordt op de expeditie aangetekend.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel34
  - number: '35'
    text: |-
      De voorzitter en de leden van de grondkamers alsmede hun plaatsvervangers
      kunnen worden gewraakt op de wijze en in de gevallen, omschreven in de
      [vierde afdeling van de eerste titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering][ref1],
      met dien verstande, dat het onderzoek van de redenen van wraking en het beslissen over de wraking geschiedt door
      de grondkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingVierde
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Vierde
  - number: '36.1'
    text: |-
      Tegen de beschikkingen van de grondkamer staat, behoudens het in het derde lid bepaalde, aan partijen,
      belanghebbenden, alsmede aan de verzoeker binnen een maand, nadat de beschikking aan hen is verzonden, beroep open
      bij de Centrale Grondkamer.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel36
  - number: '36.2'
    text: |-
      De wederpartij kan van haar kant incidenteel beroep instellen, zelfs na verloop van de in het vorige lid bedoelde
      termijn en na berusting in de beschikking. Het incidenteel beroep wordt op straffe van niet-ontvankelijkheid
      ingesteld bij het schriftelijk antwoord. De afstand van het principaal beroep doet het ingestelde incidenteel
      beroep niet vervallen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel36
  - number: '36.3'
    text: |-
      Geen beroep kan door de pachter of door de verpachter worden ingesteld, indien de pachtovereenkomst of een
      overeenkomst tot wijziging van een pachtovereenkomst dan wel het ontwerp van een van deze overeenkomsten
      ongewijzigd wordt goedgekeurd. Geen beroep kan door de pachter worden ingesteld, indien de wijziging door de
      grondkamer ingevolge [artikel 320 van Boek 7 van het Burgerlijk Wetboek][ref1] betrekking heeft op verlaging
      van de overeengekomen pachtprijs. Geen beroep kan door de verpachter worden ingesteld, indien bedoelde wijziging
      betrekking heeft op een verlaging van de overeengekomen pachtprijs met minder dan 10 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel320
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '320'
  - number: '37.1'
    text: |-
      Het beroep wordt ingesteld door indiening van een beroepschrift bij de Centrale Grondkamer. Bij het beroepschrift
      wordt een expeditie van de beroepen beschikking gevoegd.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel37
  - number: '37.2'
    text: |-
      Het beroepschrift bevat een opgave van de naam, de voornamen en de woonplaats van de verzoeker, van de naam en de
      woonplaats van de wederpartij of belanghebbende, als deze er is, voorts de bezwaren tegen de beschikking, waartegen
      beroep, en de gevraagde beslissing.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel37
  - number: '37.3'
    text: Bij het beroepschrift worden zoveel afschriften gevoegd als er wederpartijen of belanghebbenden zijn.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel37
  - number: '37.4'
    text: |-
      Indien het beroep betreft een ter goedkeuring ingezonden overeenkomst als bedoeld in
      [artikel 318 van Boek 7 van het Burgerlijk Wetboek][ref1] of een ontwerp-pachtovereenkomst of een ontwerp-
      overeenkomst tot wijziging van een pachtovereenkomst, worden bij het beroepschrift de daartoe bij de grondkamer
      ingediende bescheiden mede overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel318
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '318'
  - number: '37.5'
    text: |-
      De griffier zendt een afschrift van het beroepschrift onverwijld aan elk van de wederpartijen of belanghebbenden,
      als deze er zijn, toe en voegt daarbij een kennisgeving, die de tijd vermeldt waarbinnen een schriftelijk antwoord
      kan worden ingezonden.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel37
  - number: '37.6'
    text: |-
      Het beroepschrift wordt mondeling ter zitting behandeld, indien de Centrale Grondkamer dit nodig oordeelt, dan wel
      een van de partijen of belanghebbenden dit verzoekt. Overigens vinden de bepalingen van [paragraaf 2][ref1] en van
      [paragraaf 3][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0021912#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0021912
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021912
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '38.1'
    text: De Centrale Grondkamer bevestigt of vernietigt de beschikking waartegen hoger beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel38
  - number: '38.2'
    text: |-
      Bij vernietiging van de beschikking doet de Centrale Grondkamer hetgeen de grondkamer had behoren te doen, tenzij
      zij reden mocht vinden de zaak naar de grondkamer terug te wijzen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel38
  - number: '39.1'
    text: |-
      De secretaris van de grondkamer zendt desgevraagd de stukken van de eerste aanleg of afschriften daarvan aan de
      griffier van de Centrale Grondkamer.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel39
  - number: '39.2'
    text: |-
      De griffier van de Centrale Grondkamer zendt afschrift van de beschikkingen van de Centrale Grondkamer aan de
      grondkamer, tegen welker beschikking beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel39
  - number: '40.1'
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie kan beroep tegen een beschikking van de grondkamer
      instellen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel40
  - number: '40.2'
    text: |-
      Het beroep kan slechts worden ingesteld na verloop van de termijn, genoemd in [artikel 36, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel36
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0021912
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '40.3'
    text: |-
      Vernietiging van de beschikking van de grondkamer op dit beroep brengt geen nadeel toe aan de rechten, bij de
      beschikking verkregen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel40
  - number: '41'
    text: Competentie-geschillen tussen grondkamers worden door de Centrale Grondkamer beslist.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel41
  - number: '42'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld over de wijze waarop de kennisgevingen en de toezending
      van stukken door de secretaris van de grondkamer en door de griffier van de Centrale Grondkamer geschieden.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel42
  - number: '44.1'
    text: |-
      Bij algemene maatregel van bestuur wordt een tarief vastgesteld van de door de grondkamers en de Centrale
      Grondkamer voor haar verrichtingen te heffen kosten.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel44
  - number: '44.2'
    text: |-
      Ten aanzien van de invordering van deze kosten is [artikel 30 van de Wet griffierechten burgerlijke zaken][ref1]
      van overeenkomstige toepassing, met dien verstande, dat het dwangbevel wordt uitgevaardigd door de voorzitter van
      de grondkamer, onderscheidenlijk van de Centrale Grondkamer, en dat het terstond uitvoerbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel30
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '30'
  - number: '45'
    text: |-
      Indien binnen de in de wet gestelde termijn een verzoek is ingediend of een vordering is ingesteld bij de
      pachtkamer van de rechtbank en deze beslist, dat zij niet bevoegd is daarvan kennis te nemen, kan het verzoek,
      indien de grondkamer bevoegd is daarvan kennis te nemen en een wettelijke termijn, waarbinnen het verzoek bij
      de grondkamer moet worden ingediend, niet meer in acht kan worden genomen, niettemin nog binnen een maand na de
      beslissing van de pachtkamer bij de grondkamer worden ingediend. Hetzelfde geldt, indien een dergelijke beslissing
      door de pachtkamer van het gerechtshof te Arnhem wordt bevestigd dan wel door haar de pachtkamer bij de rechtbank
      alsnog niet bevoegd wordt verklaard van het verzoek of van de vordering kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel45
  - number: '46'
    text: |-
      Op het bepaalde in deze wet is de [Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '55'
    text: |-
      De [Pachtwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002269
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002269
  - number: '56'
    text: |-
      De __REF000___________________________________________________________________________________________________________
      _____________________________________________________________, wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001920
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001920
  - number: '57'
    text: |-
      De [Wet van 12 oktober 1995 tot wijziging van de Pachtwet][ref1] (Stb. 1995, 204) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007605
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007605
  - number: '59'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel59
  - number: '60'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet grondkamers.'
    url: https://wetten.overheid.nl/BWBR0021912/2012-07-01#Artikel60
