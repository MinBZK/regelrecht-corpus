---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_verzelfstandiging_staatsbosbeheer
regulatory_layer: WET
publication_date: '2019-05-16'
valid_from: '2020-01-01'
bwb_id: BWBR0008904
url: https://wetten.overheid.nl/BWBR0008904/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is Staatsbosbeheer te verzelfstandigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel1
  - number: 1.b
    text: |-
      raad van toezicht: raad van toezicht, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel4
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.c
    text: |-
      raad van advies: raad van advies, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel9
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: 1.d
    text: |-
      directeur: directeur, bedoeld in [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel13
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 1.e
    text: |-
      object: terrein, gebouw, complex van gebouwen, of water, dan wel een combinatie van één of meer terreinen,
      gebouwen, complexen van gebouwen of één of meer waters, met bestaande dan wel potentieel aanwezige
      natuurwetenschappelijke, bosbouwkundige, landschappelijke, recreatieve, archeologische, aardkundige of
      cultuurhistorische waarden, dan wel met die waarden verband houdende bestaande of potentieel aanwezige educatieve
      waarden.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel1
  - number: '2.1'
    text: Er is een Staatsbosbeheer, gevestigd te Driebergen-Rijsenburg in de gemeente Utrechtse Heuvelrug.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel2
  - number: '2.2'
    text: Staatsbosbeheer bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid kan Onze Minister, op voordracht van de raad van toezicht, een andere gemeente
      aanwijzen waar Staatsbosbeheer is gevestigd.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Staatsbosbeheer is belast met het beheer van de bij deze dienst krachtens eigendom of enig ander zakelijk
      dan wel enig persoonlijk recht berustende objecten en het verkrijgen van objecten, met als doelstelling
      bestaande, onderscheidenlijk potentiële, natuurwetenschappelijke, bosbouwkundige, landschappelijke, recreatieve,
      archeologische, aardkundige of cultuurhistorische waarden, dan wel de met die waarden verband houdende bestaande
      of potentieel aanwezige educatieve waarden, in het algemeen belang duurzaam in stand te houden, onderscheidenlijk
      met het oog daarop te ontwikkelen, een en ander in overeenstemming met het ten aanzien van de instandhouding en
      ontwikkeling van de voornoemde waarden door Onze Minister geformuleerd beleid. Onder beheer wordt mede verstaan de
      bevoegdheid tot vervreemding.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: '3.2'
    text: Staatsbosbeheer is voorts belast met andere door Onze Minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Ten behoeve van de uitvoering van zijn taken is Staatsbosbeheer bevoegd goederen te verkrijgen en te vervreemden,
      alsmede alle andere handelingen te verrichten die voor een goede vervulling van zijn taken noodzakelijk zijn. Tot
      het verrichten van handelingen behoort ook het desgevraagd of uit eigen beweging verstrekken van inlichtingen aan
      Onze Minister omtrent de uitvoerbaarheid van beleidsvoornemens en vastgesteld beleid, voor zover betrekking hebbend
      op onderwerpen die verband houden met deze wet.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: '3.4'
    text: |-
      Vervreemding van objecten behoeft de voorafgaande goedkeuring van Onze Minister, tenzij het betreft een object dat
      is verkregen met het oog op een doelmatig beheer van een ander object en voor dat beheer niet meer noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: '3.5'
    text: |-
      Onverminderd het vierde lid, behoeft vervreemding van objecten en andere onroerende zaken de voorafgaande
      goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: '3.6'
    text: |-
      Staatsbosbeheer kan andere werkzaamheden uitvoeren, dan die welke rechtstreeks voortvloeien uit de in het eerste
      lid, onderscheidenlijk tweede lid, bedoelde taken, mits die werkzaamheden:
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: 3.6.a
    text: samenhangen met de bij het eerste respectievelijk krachtens het tweede lid aan Staatsbosbeheer opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: 3.6.b
    text: niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: 3.6.c
    text: tegen tenminste kostendekkende prijzen worden verricht.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel3
  - number: '4.1'
    text: Staatsbosbeheer heeft een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel4
  - number: '4.2'
    text: De raad van toezicht ziet toe op de werkzaamheden van de directeur en staat hem met raad en daad terzijde.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de vervulling van zijn taak richt de raad van toezicht zich naar het belang van de behoorlijke vervulling van
      de taken, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: De raad van toezicht bestaat uit een voorzitter en ten minste twee en ten hoogste vier andere leden.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel5
  - number: '5.2'
    text: De leden van de raad van toezicht wijzen uit hun midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      De leden hebben op persoonlijke titel zitting in de raad van toezicht en oefenen hun functie uit zonder last of
      ruggespraak.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      De voorzitter en de overige leden van de raad van toezicht worden op voordracht van Onze Minister bij koninklijk
      besluit benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het medezeggenschapsorgaan, bedoeld in [artikel 13, vierde lid][ref1], kan aan Onze Minister personen voor
      plaatsing op de voordracht aanbevelen. Onze Minister deelt hem daartoe tijdig mede wanneer en ten gevolge waarvan
      in de raad van toezicht een plaats moet worden vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel13
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '6.3'
    text: |-
      Onze Minister geeft aan het medezeggenschapsorgaan kennis van een voorgenomen voordracht. Binnen acht weken na
      verzending van deze kennisgeving kan het medezeggenschapsorgaan bezwaar maken tegen benoeming van de voor te dragen
      persoon op grond van de verwachting dat die persoon ongeschikt zal zijn voor de vervulling van de taak van lid van
      de raad van toezicht, of dat de raad bij benoeming van die persoon niet naar behoren zal zijn samengesteld.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
  - number: '6.4'
    text: |-
      Indien het medezeggenschapsorgaan binnen de in het derde lid genoemde termijn geen bezwaar maakt, draagt
      Onze Minister de betrokken persoon voor. Onze Minister draagt een persoon, tegen de benoeming waarvan het
      medezeggenschapsorgaan bezwaar heeft gemaakt, niet voor dan nadat hij daarover overleg heeft gevoerd met het
      medezeggenschapsorgaan.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
  - number: '6.5'
    text: |-
      De leden van de raad van toezicht worden benoemd voor een periode van vier jaren. Zij kunnen ten hoogste twee malen
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
  - number: '6.6'
    text: |-
      Aan de leden van de raad van toezicht kan tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen ontslag
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
  - number: '6.7'
    text: |-
      Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad, met de
      bevoegdheid van de voltallige raad.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
  - number: '6.8'
    text: |-
      Degene die wordt benoemd in de plaats van een lid wiens zittingsperiode van vier jaren nog niet is verstreken,
      wordt benoemd tot het einde van die periode.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan aan de leden van de raad van toezicht, ten laste van Staatsbosbeheer, een vergoeding toekennen
      volgens door hem vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      De raad van toezicht stelt een reglement vast betreffende zijn werkwijze, de werkwijze van de raad van advies en
      de taakverdeling tussen de raad van toezicht en de directeur. Daarin wordt tevens bepaald welke besluiten van de
      directeur de goedkeuring van de raad van toezicht behoeven en in welke gevallen de directeur in ieder geval advies
      vraagt aan de raad van advies.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: '8.2'
    text: 'Goedkeuring door de raad van toezicht behoeven in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: 8.2.a
    text: |-
      het reglement, bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel15
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '15'
        hoofdstuk: IV
  - number: 8.2.b
    text: het jaarplan en de begroting;
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: 8.2.c
    text: het doen van investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: 8.2.d
    text: |-
      het verrichten van werkzaamheden als bedoeld in [artikel 3, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: 8.2.e
    text: |-
      het aangaan of verbreken van duurzame samenwerking met een andere rechtspersoon, indien deze samenwerking of
      verbreking van ingrijpende betekenis is voor Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: 8.2.f
    text: |-
      het oprichten of mede-oprichten van een privaatrechtelijke rechtspersoon of het deelnemen in dan wel ontbinden van
      een vennootschap.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: '8.3'
    text: |-
      De raad van toezicht verleent geen goedkeuring aan besluiten als bedoeld in het tweede lid, onderdelen *d* en *f*,
      dan na een verkregen verklaring van geen bezwaar van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het reglement, bedoeld in het eerste lid, alsmede wijzigingen in dat reglement worden door de directeur
      bekendgemaakt in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel8
  - number: '9.1'
    text: Staatsbosbeheer heeft een raad van advies.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      De raad van advies adviseert de directeur desgevraagd of uit eigen beweging teneinde de taakuitvoering door
      Staatsbosbeheer, binnen de in [artikel 3][ref1] gestelde grenzen, aan te doen sluiten bij de wensen en inzichten
      van de gebruikers van door Staatsbosbeheer beheerde objecten ten aanzien van het te voeren beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: '10.1'
    text: 'De raad van advies bestaat uit een voorzitter en een zodanig aantal andere leden dat:'
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel10
  - number: 10.1.a
    text: |-
      de verschillende belangen van de gebruikers van de door Staatsbosbeheer beheerde objecten daarin op evenwichtige
      wijze zijn vertegenwoordigd, en
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel10
  - number: 10.1.b
    text: |-
      recht gedaan wordt aan de in [artikel 3, eerste lid][ref1], bedoelde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: '10.2'
    text: De leden van de raad van advies wijzen uit hun midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel10
  - number: '11.1'
    text: |-
      De voorzitter en andere leden van de raad van advies worden door de raad van toezicht benoemd, geschorst en
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel11
  - number: '11.2'
    text: |-
      De leden van de raad van advies worden benoemd voor een periode van twee jaren. Zij kunnen ten hoogste eenmaal
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel11
  - number: '11.3'
    text: |-
      [Artikel 6, zesde, zevende en achtste lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel6
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12'
    text: |-
      De raad van toezicht kan aan de leden van de raad van advies, ten laste van Staatsbosbeheer, een vergoeding
      toekennen volgens door hem vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel12
  - number: '13.1'
    text: Staatsbosbeheer heeft een directeur.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel13
  - number: '13.2'
    text: |-
      De directeur is belast met de dagelijkse leiding van Staatsbosbeheer en is verantwoording schuldig aan de raad van
      toezicht. Hij draagt zorg voor de goede uitvoering van [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: '13.3'
    text: De directeur vertegenwoordigt Staatsbosbeheer in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel13
  - number: '13.4'
    text: |-
      De directeur stelt een medezeggenschapsorgaan dat de bevoegdheden uitoefent, daaraan in [artikel 6][ref1]
      toegekend, in.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel6
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14'
    text: De directeur wordt op voordracht van de raad van toezicht benoemd, geschorst of ontslagen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel14
  - number: '15'
    text: De directeur stelt bij reglement de inrichting van Staatsbosbeheer vast.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      Onverminderd [artikel 14][ref1] gelden voor de directeur en de overige personeelsleden van Staatsbosbeheer de
      arbeidsvoorwaarden die zijn opgenomen in de collectieve arbeidsovereenkomst voor ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn bij het ministerie, waaronder Staatsbosbeheer ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel14
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '16.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald voor welke aangelegenheden van het eerste lid
      kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister en Staatsbosbeheer voeren tenminste jaarlijks overleg omtrent de door Staatsbosbeheer, ter uitvoering
      van zijn in [artikel 3, eerste lid][ref1] bedoelde taakopdracht, te bereiken resultaten en de daarvoor door Onze
      Minister, ten laste van de begroting van het Ministerie van Landbouw, Natuur en Voedselkwaliteit, jaarlijks ter
      beschikking te stellen geldmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: '17.2'
    text: |-
      Het in het eerste lid bedoelde overleg heeft mede betrekking op het door Staatsbosbeheer verstrekken van
      inlichtingen en het afleggen van verantwoording over de mate waarin die prestaties worden geleverd.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel17
  - number: '17.3'
    text: |-
      De omvang van de in het eerste lid bedoelde geldmiddelen is gebaseerd op de door Onze Minister vast te stellen
      normkosten.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel17
  - number: '17.4'
    text: |-
      Onze Minister voegt de resultaten van het in het eerste lid bedoelde overleg, alsmede de jaarrapportage van
      Staatsbosbeheer betreffende de realisatie van de in dat overleg afgesproken prestaties ter gelegenheid van de
      aanbieding van de rijksbegroting aan de Staten-Generaal ter kennisneming bij.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister stelt jaarlijks aan Staatsbosbeheer ten laste van de begroting van het Ministerie van Landbouw,
      Natuur en Voedselkwaliteit geldmiddelen ter beschikking. Hij baseert zich hierbij op het in [artikel 17][ref1]
      bedoelde overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel17
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '17'
        hoofdstuk: VI
  - number: '18.2'
    text: |-
      Onverminderd het eerste lid, verwerft Staatsbosbeheer geldmiddelen door het aanvaarden van geldmiddelen van derden,
      door het aanvaarden van schenkingen, erfstellingen en legaten, door inkomsten uit eigen beheer, en uit andere
      hoofde.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel18
  - number: '18.3'
    text: |-
      Staatsbosbeheer gebruikt de geldmiddelen, bedoeld in het eerste en tweede lid, uitsluitend ter vervulling van de
      taken, voortvloeiend uit [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: '18.4'
    text: |-
      Staatsbosbeheer is bevoegd financiële reserves te vormen, met dien verstande dat Onze Minister kan besluiten dat
      Staatsbosbeheer slechts financiële reserves kan vormen tot een door hem vast te stellen maximum bedrag.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel18
  - number: '18.5'
    text: |-
      Staatsbosbeheer trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn. In afwijking van de vorige
      volzin is het Staatsbosbeheer toegestaan ter overbrugging van tijdelijke kastekorten bij een financiële onderneming
      die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank mag uitoefenen tijdelijke
      kredieten in rekening-courant op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '19.1'
    text: |-
      De directeur stelt eenmaal in de vier jaar voor een door de raad van toezicht vast te stellen tijdstip een
      ondernemingsplan op. Het ondernemingsplan wordt, Onze Minister gehoord, vastgesteld door de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel19
  - number: '19.2'
    text: Het ondernemingsplan bevat een meerjarige visie op de bedrijfsontwikkelling van Staatsbosbeheer.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel19
  - number: '20.1'
    text: |-
      De directeur stelt tijdig voor afloop van een kalenderjaar een jaarplan en een begroting voor het volgende
      kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het jaarplan bevat ten minste op hoofdlijnen een uitwerking van het ondernemingsplan voor het volgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel20
  - number: '20.3'
    text: |-
      De directeur legt het jaarplan en de begroting uiterlijk voor een door Onze Minister vast te stellen datum ter
      kennisname over aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel20
  - number: '21.1'
    text: |-
      De directeur stelt jaarlijks voor een door Onze Minister vast te stellen datum een verslag op van de werkzaamheden
      van Staatsbosbeheer, het gevoerde beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze
      in het bijzonder in het afgelopen kalenderjaar, alsmede een financieel verslag.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel21
  - number: '21.2'
    text: De raad van toezicht stelt de stukken, bedoeld in het eerste lid, vast.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel21
  - number: '21.3'
    text: Het financieel verslag behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel21
  - number: '21.4'
    text: De stukken, bedoeld in het eerste lid, worden aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel21
  - number: '21.5'
    text: |-
      Onverminderd het eerste lid, zijn de artikelen 361 tot en met 391 en 405 tot en met 414 van Boek 2 van het
      Burgerlijk Wetboek van overeenkomstige toepassing, met uitzondering van de bepalingen die betrekking hebben op het
      in aandelen verdeeld zijn van het kapitaal van een vennootschap.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel21
  - number: '21.6'
    text: |-
      Onze Minister kan regels stellen over het te voeren financieel beheer en de verantwoording daarover. Zo nodig kan
      hij goedkeuring verlangen van de begroting van Staatsbosbeheer.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het financieel verslag gaat vergezeld van een verklaring omtrent de getrouwheid en een beoordeling van de
      rechtmatigheid, afgegeven door een door Onze Minister aangewezen accountant als bedoeld in artikel 393 van Boek 2
      van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel22
  - number: '22.2'
    text: |-
      De raad van toezicht verleent opdracht tot onderzoek van het financieel verslag aan de accountant, bedoeld in het
      vorige lid.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel22
  - number: '22.3'
    text: |-
      Artikel 393, derde tot en met zevende lid, van Boek 2 van het Burgerlijk Wetboek zijn op het in te stellen
      onderzoek van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel22
  - number: '22.4'
    text: |-
      Indien Onze Minister op grond van het eerste lid een accountant, niet zijnde een departementale accountantsdienst,
      aanwijst, kan hij de accountantsdienst van zijn ministerie belasten met een onderzoek naar de controlewerkzaamheden
      van die accountant. Onze Minister kan die accountantsdienst tevens belasten met een onderzoek naar de doelmatigheid
      van het beheer, de organisatie en het beleid van Staatsbosbeheer. Aan de accountantsdienst wordt desgevraagd inzage
      gegeven in de boeken en bescheiden en worden alle inlichtingen verstrekt die hij voor de uitvoering van zijn taak
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel22
  - number: '22.5'
    text: Onze Minister kan regels stellen omtrent aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel22
  - number: '23.1'
    text: |-
      Staatsbosbeheer verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister kan bepalen dat Staatsbosbeheer daarbij aangegeven inlichtingen als bedoeld in het eerste lid, aan
      hem verstrekt in de vorm van een periodieke rapportage.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel23
  - number: '24'
    text: |-
      Indien Staatsbosbeheer zijn taken, voortvloeiend uit [artikel 3, eerste en tweede lid][ref1], naar het oordeel
      van Onze Minister verwaarloost, kan deze al die maatregelen nemen die hij met het oog op de continuïteit van de
      werkzaamheden of beperking van de schade noodzakelijk acht. Onze Minister doet hiervan terstond mededeling aan de
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel3
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '3'
        hoofdstuk: II
  - number: '27'
    text: |-
      In afwijking van [artikel 14][ref1] geschiedt de eerste benoeming van de directeur door Onze Minister, zonder dat
      de raad van toezicht een voordracht daartoe doet.


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel14
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '28.1'
    text: |-
      De ambtenaren die op het tijdstip van inwerkingtreding van deze wet behoren tot het personeel van het
      dienstonderdeel Staatsbosbeheer van het Ministerie van Landbouw, Natuurbeheer en Visserij zijn met ingang van dat
      tijdstip van rechtswege ontslagen en aangesteld als ambtenaar in dienst van Staatsbosbeheer in dezelfde functie
      welke zij bekleedden bij voornoemd dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel28
  - number: '28.2'
    text: |-
      De aanspraken die een ambtenaar op wie het eerste lid van toepassing is, toekomen krachtens artikel 24 van het
      Algemeen Rijksambtenaren Reglement vervallen op het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel28
  - number: '29.1'
    text: |-
      De archiefbescheiden van het dienstonderdeel Staatsbosbeheer van het Ministerie van Landbouw, Natuurbeheer en
      Visserij gaan met ingang van het tijdstip van inwerkingtreding van deze wet over naar Staatsbosbeheer, voor zover
      zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar een rijksarchiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '29.2'
    text: |-
      De overbrenging, ingevolge de [Archiefwet 1995][ref1], van archiefbescheiden met betrekking tot op het in het
      eerste lid bedoelde tijdstip afgedane zaken geschiedt als had geen overdracht plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '29.3'
    text: |-
      Van de overgang, bedoeld in het eerste lid, maken degene onder wie de archiefbescheiden tot de overgang hebben
      berust en de directeur een verklaring op, die tenminste inhoudt een specificatie van deze archiefbescheiden. Zij
      bewaren elk een door beiden ondertekend exemplaar van deze verklaring.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan het dienstonderdeel Staatsbosbeheer van het Ministerie van Landbouw, Natuurbeheer en Visserij worden
      toegerekend, worden toebedeeld aan Staatsbosbeheer.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel30
  - number: '30.2'
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van het tijdstip van inwerkingtreding van deze
      wet onder algemene titel om niet over op Staatsbosbeheer.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel30
  - number: '30.3'
    text: |-
      Ingeval krachtens het tweede lid registergoederen overgaan, zal verandering in de tenaamstelling in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] plaatsvinden. De daartoe
      nodige opgaven worden door de zorg van Onze Minister aan de bewaarders van de desbetreffende registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '30.4'
    text: |-
      Ter zake van de verkrijging door Staatsbosbeheer van vermogensbestanddelen, bedoeld in het tweede lid, blijft de
      heffing van overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel30
  - number: '30.5'
    text: |-
      Indien deze wet wordt ingetrokken, gaan op het tijdstip van intrekking van deze wet de vermogensbestanddelen van
      Staatsbosbeheer onder algemene titel om niet over op de Staat.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel30
  - number: '31.1'
    text: |-
      In wettelijke procedures en rechtsgedingen, waarbij het dienstonderdeel Staatsbosbeheer van het Ministerie van
      Landbouw, Natuurbeheer en Visserij is betrokken, treedt met ingang van het tijdstip van inwerkingtreding van deze
      wet Staatsbosbeheer in de plaats van de Staat, onderscheidenlijk Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel31
  - number: '31.2'
    text: |-
      In zaken waarin voor het tijdstip van inwerkingtreding van deze wet op grond van
      [artikel 12 van de Wet Nationale ombudsman][ref1] aan de Nationale ombudsman is verzocht een onderzoek te
      doen dan wel de Nationale ombudsman op grond van [artikel 15][ref2] van die wet een onderzoek heeft ingesteld
      naar een gedraging die kan worden toegerekend aan het dienstonderdeel Staatsbosbeheer van het Ministerie van
      Landbouw, Natuurbeheer en Visserij, treedt Staatsbosbeheer op dat tijdstip als bestuursorgaan in de zin van de
      [Wet Nationale ombudsman][ref3] in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0003372
  - number: '32'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van Staatsbosbeheer.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel32
  - number: '33'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel33
  - number: '34'
    text: 'Deze wet wordt aangehaald als: Wet verzelfstandiging Staatsbosbeheer.'
    url: https://wetten.overheid.nl/BWBR0008904/2020-01-01#Artikel34
