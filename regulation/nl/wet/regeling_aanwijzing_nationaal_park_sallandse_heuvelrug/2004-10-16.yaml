articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel1
  - number: 1.a
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel1
  - number: 1.b
    text: |-
      overlegorgaan: overlegorgaan als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017297#Artikel3
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017297
        artikel: '3'
  - number: 1.c
    text: |-
      nationaal park: gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992–93, 22 880,
      nr. 5, blz. 9).
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel1
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied Sallandse Heuvelrug, zoals aangegeven op de als bijlage bij deze
      regeling behorende kaart.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Sallandse Heuvelrug.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park Sallandse
      Heuvelrug. Daartoe behoort onder meer:
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel4
  - number: 4.a
    text: het actualiseren van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel4
  - number: 4.b
    text: |-
      het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en
      activiteiten;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel4
  - number: 4.c
    text: |-
      het doen van voorstellen aan de minister voor de besteding van de voor het nationale park Sallandse Heuvelrug
      beschikbare middelen in het kader van een jaarlijks voortschrijdend meerjarenprogramma met bijbehorende begroting;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel4
  - number: 4.d
    text: |-
      besteding van gelden op basis van een door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de bestedingen van gelden en coördinatie van de uitvoering van projecten binnen het
      kader van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel4
  - number: 4.e
    text: |-
      het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van voorlichting
      en educatie met betrekking tot het nationaal park Sallandse Heuvelrug.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park
      Sallandse Heuvelrug van 22 december 2003 en met inachtneming van hetgeen te dien aanzien door de minister bij brief
      van 16 september 2004, kenmerk DN.2004/2353, is gesteld.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel5
  - number: '6'
    text: 'In het overlegorgaan hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.a
    text: één door de minister te benoemen lid, tevens voorzitter;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b
    text: 'negen door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:'
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.1
    text: de provincie Overijssel;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.2
    text: de gemeente Hellendoorn;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.3
    text: de gemeente Rijssen-Holten;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.4
    text: Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.5
    text: de Vereniging Natuurmonumenten regio Flevoland Overijssel;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.6
    text: het landgoed Holterberg;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.7
    text: de regio Twente;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.8
    text: de Stichting Ondernemers Platform;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.b.9
    text: de Gewestelijke Land- en Tuinbouw Organisatie oost;
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: 6.c
    text: |-
      de directeur van de Directie Regionale Zaken, Vestiging Oost, van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel6
  - number: '7.1'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de provincie Overijssel te benoemen ambtenaar in dienst
      van deze provincie.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel7
  - number: '7.2'
    text: |-
      Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel7
  - number: '7.3'
    text: |-
      Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationale park Sallandse Heuvelrug verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel8
  - number: '9'
    text: De regeling aanwijzing nationaal park in oprichting Sallandse Heuvelrug wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 16 oktober 2004.
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park Sallandse Heuvelrug.'
    url: https://wetten.overheid.nl/BWBR0017297/2004-10-16#Artikel11
