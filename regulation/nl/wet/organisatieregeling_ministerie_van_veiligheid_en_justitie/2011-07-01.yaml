  - number: '3.1'
    text: |-
      De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in [artikel 2][ref1] genoemde
      dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel2
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '2'
        hoofdstuk: I
  - number: '3.2'
    text: |-
      De secretaris-generaal wordt bij afwezigheid volledig vervangen door de plaatsvervangend secretaris-generaal.
      Daarnaast treedt de plaatsvervangend secretaris-generaal ten aanzien van door de secretaris-generaal vast te
      stellen taken in de bevoegdheden en verantwoordelijkheden van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel3
  - number: '3.3'
    text: |-
      De directeuren-generaal zijn belast met de beleids- en bedrijfsvoering van de tot hun directoraat-generaal
      behorende onderdelen. Eén van de tot het directoraat-generaal behorende directeuren wordt op voordracht van de
      betreffende directeur-generaal namens de minister door de secretaris-generaal aangewezen als plaatsvervangend
      directeur-generaal. De eerste en tweede volzin zijn van overeenkomstige toepassing op de Nationaal Coördinator
      Terrorismebestrijding.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel3
  - number: '3.4'
    text: |-
      De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal, de directeuren-generaal en
      de Nationaal Coördinator Terrorismebestrijding vormen samen de bestuursraad. De bestuursraad formuleert de
      ministeriebrede en gemeenschappelijke kaders en bewaakt dat de activiteiten en het beleid van de onderscheiden
      directoraten-generaal daarbinnen blijven. De voorzitter van het College van procureurs-generaal neemt als
      toehoorder deel aan de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de secretaris-generaal integraal verantwoordelijk voor de beleids- en
      bedrijfsvoering van de rechtstreeks onder hem ressorterende dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel3
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '3'
        hoofdstuk: I
  - number: '4.2'
    text: |-
      Ten aanzien van door hem aan te wijzen dienstonderdelen kan de secretaris-generaal taken opdragen aan de
      plaatsvervangend secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel4
  - number: '5.1'
    text: |-
      De directie Wetgeving (DW) is belast met de ontwikkeling, de totstandkoming, het beheer en het onderhoud
      van justitie- en veiligheidswetgeving en van andere wetgeving voor zover deze tot het werkterrein
      van een dienstonderdeel van het ministerie behoort, alsmede met het ontwikkelen en uitdragen van het
      wetgevingskwaliteitsbeleid en de toetsing van ontwerpwetgeving van de ministeries op rechtsstatelijke en
      bestuurlijke kwaliteit, met inbegrip van de constitutionele, Europeesrechtelijke en internationaalrechtelijke
      toetsing van wetgeving.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: '5.2'
    text: 'De directie voert juridische adviestaken uit betreffende:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.2.a
    text: de coördinatie van contacten met de landsadvocaat;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.2.b
    text: het geven van juridisch advies in gecompliceerde aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.2.c
    text: het uitvoeren van bijzondere opdrachten van de departementsleiding.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: '5.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.3.a
    text: de sector Straf- en sanctierecht;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.3.b
    text: de sector Staats- en bestuursrecht;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.3.c
    text: de sector Privaatrecht;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.3.d
    text: de sector Wetgevingskwaliteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.3.e
    text: het bureau Juridisch Adviseur;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: 5.3.f
    text: het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel5
  - number: '6.1'
    text: |-
      De directie Europese en Internationale Aangelegenheden (DEIA) draagt zorg voor een ministeriebrede strategie- en
      visieontwikkeling ten aanzien van multilaterale, Europese en bilaterale horizontale dossiers en beleidsvraagstukken
      en ten aanzien van Koninkrijkssamenwerking, internationale projecten en expertisegebieden. Tevens is de directie
      belast met de zorg voor een gecoördineerde en effectieve inzet van Nederland op het gebied van Veiligheid en
      Justitie binnen het kader van de samenwerking binnen de Europese Unie en in het kader van de samenwerking op
      multilateraal, bilateraal en Koninkrijksniveau. Tenslotte faciliteert de directie de politieke en ambtelijke
      leiding alsmede de directies in logistieke en instrumentele zin op voornoemde terreinen en verzorgt zij de daarop
      betrekking hebbende informatievoorziening aan interne dossierhouders en belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: '6.2'
    text: |-
      De directie bevordert en bewaakt de eenheid van optreden op de in het eerste lid genoemde terreinen met
      inachtneming van de eigen beleidsverantwoordelijkheid van andere dienstonderdelen voor de internationale aspecten
      van hun beleidsterrein
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: '6.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: 6.3.a
    text: de afdeling Europese Unie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: 6.3.b
    text: de afdeling Internationale Betrekkingen en Projecten;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: 6.3.c
    text: de afdeling Veiligheid en Justitie van de Permanente Vertegenwoordiging Europese Unie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: 6.3.d
    text: |-
      de attaché’s Veiligheid en Justitie op andere Nederlandse ambassades en permanente vertegenwoordigingen in het
      buitenland;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: 6.3.e
    text: de managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel6
  - number: '7'
    text: |-
      De directie Strategie (DS) is belast met het ondersteunen van de departementsleiding bij het ontwikkelen en
      vormgeven van ministeriebrede strategie. Dit bewerkstelligt zij in het bijzonder door het uitvoeren van toekomst-
      en omgevingsgerichte verkenningen en het op basis daarvan signaleren van strategische thema’s alsmede het
      bevorderen van de doorwerking daarvan, dit in goed samenspel met partners binnen en buiten het ministerie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel7
  - number: '8.1'
    text: 'Het Wetenschappelijk Onderzoek- en Documentatiecentrum (WODC) is belast met:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.1.a
    text: |-
      het verrichten van onderzoek en het doen verrichten van onderzoek, waaronder het evalueren van beleid en
      beleidssprogramma's,
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.1.b
    text: het adviseren over voorgenomen beleid en beleidsprogramma’s,
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.1.c
    text: het ontwikkelen, onderhouden en toegankelijk maken van data,
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.1.d
    text: het verspreiden van binnen het WODC aanwezige kennis, en
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.1.e
    text: de documentatie van (sociaal-)wetenschappelijke publicaties, op het terrein van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: '8.2'
    text: 'Het WODC bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.2.a
    text: de onderzoeksafdeling Criminaliteit, Veiligheid, Rechtshandhaving en Sancties (CVRS);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.2.b
    text: de onderzoeksafdeling Rechtsbestel, Wetgeving, Internationale en vreemdelingenaangelegenheden (RWI);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.2.c
    text: de afdeling Externe Wetenschappelijke Betrekkingen (EWB);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.2.d
    text: de afdeling Statistische lnformatievoorziening en Beleidsanalyse (SIBa);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.2.e
    text: de afdeling Documentaire lnformatievoorziening (DIV);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: 8.2.f
    text: de afdeling Bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel8
  - number: '9'
    text: |-
      Het bureau Secretaris-Generaal (BSG) is belast met algemene staftaken en de secretariële, administratieve en
      organisatorische ondersteuning van de minister, de staatssecretaris, de secretaris-generaal en de plaatsvervangend
      secretaris-generaal. Het is voorts belast met de protocollaire ondersteuning van de departementsleiding van het
      ministerie en vervult daarbij een coördinerende rol. Deze taken worden gekenmerkt door een representatief of
      vertrouwelijk karakter.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel9
  - number: '10.1'
    text: |-
      De directie Voorlichting (DV) is belast met het geven van informatie van en over het ministerie. Hierbij wordt
      gezocht naar een goede balans tussen het belang van het ministerie en dat van de ontvangers. Ook heeft de directie
      tot taak om politieke en maatschappelijke signalen op te vangen en terug te koppelen binnen de organisatie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel10
  - number: '10.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel10
  - number: 10.2.a
    text: het Stafbureau;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel10
  - number: 10.2.b
    text: de afdeling Persvoorlichting en Beleidspresentatie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel10
  - number: 10.2.c
    text: de afdeling Communicatie & Redactie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel10
  - number: '11.1'
    text: |-
      De directie Financieel-Economische Zaken (DFEZ) is belast met de advisering van de departementsleiding
      over financiële en macro-economische aspecten van beleid, bedrijfsvoering en uitvoering als bedoeld in
      [artikel 27, eerste en tweede lid, van de Comptabiliteitswet 2001][ref1] en de daaruit voortvloeiende regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel27
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '27'
  - number: '11.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel11
  - number: 11.2.a
    text: het de afdeling Begroting en Strategie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel11
  - number: 11.2.b
    text: de afdeling Financiële Infrastructuur & Administratie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel11
  - number: 11.2.c
    text: de afdeling Financieel-Economische Advisering & Control;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel11
  - number: 11.2.d
    text: het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel11
  - number: '12.1'
    text: |-
      De directie Personeel en Organisatie (DP&O) is belast met advisering van de departementsleiding over en de
      ontwikkeling en coördinatie van ministeriebreed organisatie- en personeelsbeleid.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel12
  - number: '12.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel12
  - number: 12.2.a
    text: de afdeling Interne Planning en Ondersteuning;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel12
  - number: 12.2.b
    text: de afdeling Informatiemanagement;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel12
  - number: 12.2.c
    text: de afdeling Accountmanagement, Advies en Control;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel12
  - number: 12.2.d
    text: de afdeling Expertise en Ondersteuning;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel12
  - number: 12.2.e
    text: het project Vernieuwing HRM.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel12
  - number: '13.1'
    text: |-
      De directie Informatisering (DI) is belast met de advisering van de departementsleiding over, de coördinatie van
      departementale vraagstukken en projectleiding van sectoroverstijgende projecten op het gebied van informatie- en
      communicatietechnologie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel13
  - number: '13.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel13
  - number: 13.2.a
    text: de sectie ICT-advies;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel13
  - number: 13.2.b
    text: de sectie Programmamanagement;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel13
  - number: 13.2.c
    text: het projectenbureau.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel13
  - number: '14.1'
    text: 'De Departementale Auditdienst (DAD) is belast met:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
  - number: 14.1.a
    text: |-
      het uitvoeren van de wettelijke controletaak, bedoeld in [artikel 66 van de Comptabiliteitswet 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
  - number: 14.1.b
    text: |-
      het verrichten van overig periodiek onderzoek naar de bedrijfs- en de beleidsvoering op basis van de
      [artikelen 20][ref1] en [21 van de Comptabiliteitswet 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel21
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '21'
  - number: '14.2'
    text: De DAD bestaat uit
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
  - number: 14.2.a
    text: het cluster I DGV en SG/pSG-blok;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
  - number: 14.2.b
    text: het cluster II DGPJS;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
  - number: 14.2.c
    text: het cluster III DGRR en NCTb;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
  - number: 14.2.d
    text: het Bureau Bedrijfsvoering en Beheersondersteuning.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel14
  - number: '15.1'
    text: |-
      De directie Bedrijfsvoering en Ondersteuning Bestuursdepartement (DBOB) is voor de departementsleiding en directies
      in de sector bestuursdepartement dé dienstverlener op het gebied van huisvesting, werkplekservices, documentaire
      informatievoorziening, en inkoopondersteuning binnen het bestuursdepartement.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel15
  - number: '15.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel15
  - number: 15.2.a
    text: de hoofdafdeling Facilitaire Zaken;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel15
  - number: 15.2.b
    text: de hoofdafdeling Documentaire Informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel15
  - number: 15.2.c
    text: de hoofdafdeling Commerciële Zaken;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel15
  - number: 15.2.d
    text: de afdeling Bedrijfsvoering, Kwaliteit en Productcommunicatie (BKP).
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel15
  - number: '16.1'
    text: |-
      De baten-lastendienst Gemeenschappelijk Dienstencentrum ICT (GDI) is belast met het leveren van generieke ICT-
      beheerdiensten (financiële systemen, websites en infrastructurele ICT-diensten), specifieke ICT-beheerdiensten
      (beheer van netwerk, werkplekken en applicaties) aan het ministerie en andere ministeries.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel16
  - number: '16.2'
    text: 'Het GDI bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel16
  - number: 16.2.a
    text: de afdeling Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel16
  - number: 16.2.b
    text: de afdeling Business Development;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel16
  - number: 16.2.c
    text: de afdeling Front Office;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel16
  - number: 16.2.d
    text: de afdeling Beheer;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel16
  - number: 16.2.e
    text: de afdeling Regie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel16
  - number: '17'
    text: |-
      De directie Inkoop, Huisvesting en Milieu (DIHM) is belast met het realiseren van beleid, kaders en richtlijnen op
      het bedrijfsvoeringterrein van inkoop, huisvesting en milieu.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel17
  - number: '18.1'
    text: |-
      De Inspectie voor de Sanctietoepassing (ISt) ziet toe op de sanctietoepassing met het oog op zichtbare verbetering
      van de effectiviteit en kwaliteit van de sanctietoepassing.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel18
  - number: '18.2'
    text: |-
      De Inspectie voor de Sanctietoepassing adviseert de departementsleiding ten behoeve van borging van behoorlijke
      sanctietoepassing
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel18
  - number: '19'
    text: |-
      De Beleidsacademie is belast met de ontwikkeling en organisatie van opleidingsprogramma’s ten behoeve van alle
      beleidsambtenaren van het ministerie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel19
  - number: '20'
    text: |-
      Het bureau Adviescollege Verloftoetsing tbs is belast met het ondersteunen van het Adviescollege Verloftoetsing tbs
      alsmede het ontwikkelen van richtlijnen en andere vormen van methodische aanpak ten behoeve van dat Adviescollege.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel20
  - number: '21'
    text: |-
      Onverminderd [artikel 3][ref1] is de directeur-generaal Veiligheid verantwoordelijk voor de beleids- en
      bedrijfsvoering van de binnen het directoraat-generaal Veiligheid ondergebrachte dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel3
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '3'
        hoofdstuk: I
  - number: '22'
    text: |-
      Het bureau Directoraat-Generaal van het directoraat-generaal Veiligheid heeft tot taak het ondersteunen van
      het managementteam van het direcotraat-generaal Veiligheid en de directies bij de uitvoering van de beleids- en
      beheertaken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel22
  - number: '23'
    text: |-
      De afdeling Financiën DGV (FDGV) heeft tot taak het ondersteunen van het managementteam van het directoraat-
      generaal Veiligheid en de directies bij de uitvoering van de Veiligheidsbegroting.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel23
  - number: '24'
    text: 'De directie Veiligheid en Bestuur (DVB) heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel24
  - number: 24.a
    text: het ontwikkelen van een lange termijn visie op maatschappelijke veiligheidsvraagstukken vanuit bestuurlijk oogpunt;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel24
  - number: 24.b
    text: het bevorderen van fysieke veiligheid.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel24
  - number: '25'
    text: 'De directie Politie en Veiligheidsregio’s (DPV) heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.a
    text: |-
      het ontwikkelen van een (langetermijn)visie op de kwaliteit, de inrichting en de ontwikkeling van en de samenhang
      tussen de veiligheidsorganisaties en de feitelijke inrichting ervan;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.b
    text: het ontwikkelen van beleid op de taakuitvoering en bevoegdheden van de veiligheidsorganisaties;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.c
    text: 'leveren van een bijdrage aan de besluitvorming over:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.c.1°
    text: de landelijke prioriteiten in het werk van de veiligheidsorganisaties;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.c.2°
    text: het relatiebeheer van de veiligheidsorganisaties;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.c.3°
    text: het beleid op kwaliteit van personeel en materiaal van de veiligheidsorganisaties;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.c.4°
    text: het bekostigingsbeleid en monitoring van politie en veiligheidsregio’s;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: 25.c.5°
    text: het (financieel) toezicht op de regionale politiekorpsen, zelfstandige bestuursorganen en baten-lastendiensten.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel25
  - number: '26'
    text: 'De directie Nationale Veiligheid (DNV) heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel26
  - number: 26.a
    text: het voorkomen van en prepareren voor dreigingen tegen de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel26
  - number: 26.b
    text: |-
      het in dit kader ontwikkelen van een eenheid in visie en optreden tussen de verschillende regio’s en het nationale
      niveau.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel26
  - number: '27'
    text: 'Het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA) heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel27
  - number: 27.a
    text: |-
      het adviseren en ondersteunen van de directeur-generaal bij de uitvoering van diens taken als gemandateerd
      beheerder van het Korps landelijke politiediensten, het korps politie Bonaire, Sint Eustatius en Saba en het
      brandweerkorps Bonaire, Sint Eustatius en Saba en als beheerder van de Onderzoeksraad voor Veiligheid;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel27
  - number: 27.b
    text: |-
      het adviseren en ondersteunen van de functionarissen die op basis van ondermandaat door de directeur-generaal
      Veiligheid taken als gemandateerd beheerder van het korps politie Bonaire, Sint Eustatius en Saba en het
      brandweerkorps Bonaire, Sint Eustatius en Saba uitvoeren;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel27
  - number: 27.c
    text: |-
      het faciliteren van het Korps landelijke politiediensten, het korps politie Bonaire, Sint Eustatius en Saba, het
      brandweerkorps Bonaire, Sint Eustatius en Saba en de Onderzoeksraad voor Veiligheid in de relatie met de beheerder;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel27
  - number: 27.c
    text: |-
      het faciliteren van de beleidsbepaling en kaderstelling ten aanzien van het Korps landelijke politiediensten, korps
      politie Bonaire, Sint Eustatius en Saba, het brandweerkorps Bonaire, Sint Eustatius en Saba en de Onderzoeksraad
      voor Veiligheid;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel27
  - number: 27.d
    text: |-
      het faciliteren van het Korps landelijke politiediensten, het korps politie Bonaire, Sint Eustatius en Saba,
      het brandweerkorps Bonaire, Sint Eustatius en Saba en de Onderzoeksraad voor Veiligheid in de relaties met het
      ministerie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel27
  - number: '28'
    text: |-
      De baten-lastendienst Korps landelijke politiediensten is belast met de taken, bedoeld in
      [artikel 38 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
  - number: '29.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de directeur-generaal Rechtspleging en Rechtshandhaving integraal
      verantwoordelijk voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Rechtspleging en
      Rechtshandhaving ondergebrachte dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel3
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '3'
        hoofdstuk: I
  - number: '29.2'
    text: De directeur-generaal is daarnaast beheersverantwoordelijk voor het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel29
  - number: '29.3'
    text: |-
      De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel29
  - number: '30.1'
    text: |-
      De directie Rechtshandhaving en Criminaliteitsbestrijding (DRC) is belast met het ontwikkelen van visie, beleid
      en samenwerkingsvormen op het terrein van de rechtshandhaving, de criminaliteitsbestrijding en het waarborgen van
      de veiligheid.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel30
  - number: '30.2'
    text: 'de directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel30
  - number: 30.2.a
    text: de afdeling Strategische Beleidsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel30
  - number: 30.2.b
    text: de afdeling Georganiseerde Criminaliteit;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel30
  - number: 30.2.c
    text: de afdeling Fraude en Ordening;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel30
  - number: 30.2.d
    text: de afdeling Criminaliteit en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel30
  - number: '31.1'
    text: |-
      De directie Rechtsbestel (DRb) is belast met de instandhouding en ontwikkeling van het rechtsbestel, in het
      bijzonder met betrekking tot de toegang tot het recht, de organisatie en de kwaliteit van het rechtsbestel.
      Hieronder wordt in ieder geval begrepen het stelsel van de rechterlijke organisatie, alsmede de volgende
      beleidsterreinen: rechtsbijstand, juridische vrije beroepen, alternatieve geschillenbeslechting (ADR),
      schuldsanering natuurlijke personen en tolken en vertalers.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel31
  - number: '31.2'
    text: |-
      De directie is voorts belast met het beheer van de Hoge Raad en het bureau van het Nederlands Register Gerechtelijk
      Deskundigen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel31
  - number: '31.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel31
  - number: 31.3.a
    text: de afdeling Strafrechtelijk Bestel & Arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel31
  - number: 31.3.b
    text: de afdeling Rechtspraak & Geschiloplossing;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel31
  - number: 31.3.c
    text: de afdeling Toegang Rechtsbestel.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel31
  - number: '32.1'
    text: |-
      De directie Instrumentatie Rechtspleging en Rechtshandhaving (DIRR) is belast met de instrumentatie van de overige
      directies binnen het directoraat-generaal Rechtspleging en Rechtshandhaving en de taakorganisaties op dit terrein.
      Onder deze instrumentatie wordt begrepen:
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.1.a
    text: |-
      de ontwikkeling van het informatievoorzieningbeleid voor de verschillende ketens op het terrein van de
      rechtspleging en rechtshandhaving, in het bijzonder de strafrechtsketen,
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.1.b
    text: het stellen van financiële kaders, en
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.1.c
    text: instrumentontwikkeling.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: '32.2'
    text: |-
      Tevens fungeert de directie als centrale voorziening ten behoeve van de registratie van justitiële en
      strafvorderlijke gegevens en de verstrekking daarvan aan daartoe bevoegde personen en instanties.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: '32.3'
    text: |-
      De directie is voorts belast met het beheer van het College bescherming persoonsgegevens en de Commissie gelijke
      behandeling.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: '32.4'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.4.a
    text: de afdeling Financiën, Bedrijfsvoering & Control (FBC);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.4.b
    text: de afdeling Keteninformatievoorziening;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.4.c
    text: de Justitiële Informatiedienst (JustID);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.4.d
    text: het Financial Intelligence Unit netwerk (FIU.NET);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.4.e
    text: het Centraal Informatiepunt Onderzoek Telecommunicatie (CIOT);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: 32.4.f
    text: het Platform Interceptie & Decriptie & Signaalanalyse (PIDS).
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel32
  - number: '33.1'
    text: |-
      De directie Juridische en Operationele Aangelegenheden (DJOA) is belast met de voorbereiding van beslissingen
      in individuele gevallen op het terrein van rechtspleging en rechtshandhaving met toepassing van bestaande
      regels en beleidskaders. De beslissingen hebben betrekking op bestuurlijk-juridische zaken, operationele
      zaken, rechtshulpverzoeken, benoemingen of incidenten. De directie levert op deze terreinen ook bijdragen aan
      beleidsvoorstellen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: '33.2'
    text: |-
      De directie voert de regie en coördineert de inzet van alle betrokken dienstonderdelen en taakorganisaties bij
      de afdoening van incidenten waaraan politiek-bestuurlijke aspecten zijn verbonden. De directie ontwikkelt en
      onderhoudt daartoe de benodigde expertise en incidentenstrategie en organiseert de voorbereiding van het ministerie
      van crisisbeheersing in het kader van het nationaal handboek crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: '33.3'
    text: |-
      De directie fungeert als het juridisch expertisecentrum van het directoraat-generaal. De directie bewaakt de
      juridische kwaliteit van de diverse producten van het directoraat-generaal en beperkt de juridische risico’s.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: '33.4'
    text: |-
      De directie is belast met de voorbereiding en uitvoering van beslissingen van de minister aangaande internationale
      rechtshulp in strafzaken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: '33.5'
    text: |-
      De directie is voorts belast met de beantwoording van brieven van burgers alsmede de coördinatie van de
      beantwoording van Kamervragen en andere parlementaire zaken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: '33.6'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: 33.6.a
    text: de afdeling Bestuurlijke en Juridische Zaken;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: 33.6.b
    text: de afdeling Operationele Zaken en Incidentenmanagement;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: 33.6.c
    text: de afdeling Internationale Rechtshulp in Strafzaken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel33
  - number: '34.1'
    text: |-
      De baten-lastendienst Nederlands Forensisch Instituut (NFI) staat, met het oog op de waarheidsvinding op het
      terrein van de forensische wetenschap ten dienste van het openbaar ministerie, de politie, overige personen en
      instanties die zijn belast met de opsporing van strafbare feiten, de zittende magistratuur en het ministerie.
      Indien de bijzondere deskundigheid van het NFI of gronden aan het algemeen belang daartoe aanleiding geven,
      kan worden besloten dat het NFI ook diensten verricht in het kader van de ondersteuning bij de daadwerkelijke
      handhaving van de (inter)nationale rechtsorde of de hulpverleningstaak van de politie dan wel ten behoeve van enig
      andere zaak.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel34
  - number: '34.2'
    text: 'De kerntaken van het NFI zijn:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel34
  - number: 34.2.a
    text: |-
      het verrichten van forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en natuurwetenschappelijk
      gebied en het ter zake uitbrengen van een verslag;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel34
  - number: 34.2.b
    text: |-
      het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken zowel ten behoeve van het NFI als
      politie en justitie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel34
  - number: 34.2.c
    text: het zijn van (inter)nationaal kennis- en expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel34
  - number: '35'
    text: |-
      De baten-lastendienst Centraal Justitieel Incassobureau (CJIB) heeft tot taak het openbaar ministerie en de
      departementsleiding te ondersteunen bij hun werkzaamheden ten behoeve van de tenuitvoerlegging van strafrechtelijke
      en administratieve sancties alsmede met betrekking tot het beheer en de verwerking van gegevens dienaangaande. Het
      CJIB heeft tevens tot taak door de minister aangewezen andere werkzaamheden te verrichten ter ondersteuning van het
      Rijk bij de uitvoering zijn taken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel35
  - number: '36.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de directeur-generaal Preventie, Jeugd en Sancties integraal verantwoordelijk
      voor de tot de verantwoordelijkheid van de minister behorende beleids- en bedrijfsvoering van de binnen het
      directoraat-generaal Preventie, Jeugd en Sancties ondergebrachte dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel3
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '3'
        hoofdstuk: I
  - number: '36.2'
    text: |-
      De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel36
  - number: '36.3'
    text: 'Bij de directeur-generaal zijn de volgende programma’s ondergebracht:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel36
  - number: 36.3.a
    text: het programma Vernieuwing Forensische Zorg;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel36
  - number: 36.3.b
    text: het programma Modernisering Gevangeniswezen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel36
  - number: '37.1'
    text: |-
      De directie Sanctie- en Preventiebeleid (DSP) is belast met de advisering aan de departementsleiding over en
      de coördinatie, ontwikkeling en evaluatie van beleid dat gericht is op het bevorderen van de veiligheid van de
      maatschappij door:
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.1.a
    text: |-
      de consequente en effectieve tenuitvoerlegging van vrijheidsbenemende en vrijheidsbeperkende straffen en
      maatregelen bij volwassenen;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.1.b
    text: de vermindering van de recidive door gedragsinterventies en goede aansluiting op maatschappelijke opvang;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.1.c
    text: het aanbieden van dienstverlening aan slachtoffers van criminaliteit;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.1.d
    text: |-
      het voorkomen van criminaliteit door inzet van preventieve maatregelen met het oog op een veilige en rechtvaardige
      samenleving.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: '37.2'
    text: |-
      Tevens is de directie belast met de advisering aan de departementsleiding over en de ontwikkeling, coördinatie en
      evaluatie van beleid dat gericht is op het reguleren en beheersen van kansspelen met bijzondere aandacht voor het
      beschermen van de consument, het tegengaan van gokverslaving en het tegengaan van illegaliteit en criminaliteit.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: '37.3'
    text: |-
      De directie heeft op haar terrein een coördinerende taak in de besturing en beleidsvoering van de Dienst JUSTIS en
      de dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: '37.4'
    text: |-
      De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties en
      instellingen en stuurt deze aan.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: '37.5'
    text: 'De directie wordt ondersteund door een staf en bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.a
    text: de afdeling Sanctie- en Reclasseringsbeleid;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.b
    text: de afdeling Preventie- en Slachtofferbeleid;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.c
    text: het programma Sluitende aanpak nazorg;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.d
    text: het programma Justitiële Voorwaarden;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.e
    text: het programma Aanpak geweld in het (semi-)publieke domein;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.f
    text: het tijdelijke programma Kansspelen;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.g
    text: het secretariaat van het Schadefonds Geweldsmisdrijven (secretariaat SGM);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.h
    text: het secretariaat van de Raad voor strafrechtstoepassing en jeugdbescherming (secretariaat RSJ);
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: 37.5.i
    text: het bureau van het College van toezicht op de kansspelen (bureau CvtK).
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: '37.6'
    text: |-
      De in het vijfde lid onder g, h en i, genoemde dienstonderdelen zijn belast met de bedrijfsvoering en ondersteuning
      van de in die onderdelen genoemde zelfstandige bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel37
  - number: '38.1'
    text: |-
      De directie Justitieel Jeugdbeleid (DJJ) is belast met de advisering aan de departementsleiding over en de
      coördinatie, ontwikkeling en evaluatie van beleid dat zich richt op:
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: 38.1.a
    text: de bescherming van minderjarigen;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: 38.1.b
    text: het voorkomen en aanpakken van bedreigende situaties voor kinderen en gezinnen;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: 38.1.c
    text: het met justitiële instrumenten voorkomen en aanpakken van jeugdcriminaliteit;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: 38.1.d
    text: |-
      de bevordering van een samenhangende strafrechtelijke en pedagogische aanpak van de jeugdige nadat deze zich
      schuldig heeft gemaakt aan strafwaardig gedrag.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: '38.2'
    text: |-
      De directie heeft een adviserende taak in de besturing en beleidsvoering van de raad voor de kinderbescherming en
      de dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: '38.3'
    text: |-
      De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties en
      instellingen en stuurt deze aan. Daarnaast onderhoudt de directie de besturingsrelatie omtrent de doeluitkeringen
      aan de provincies en grootstedelijke regio’s ten aanzien van de jeugdbescherming en jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: '38.4'
    text: |-
      De directie heeft verder tot taak het Landelijk Bureau Inning Onderhoudsbijdragen beheersmatig en financieel aan
      te sturen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: '38.5'
    text: 'De directie wordt ondersteund door een staf en bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: 38.5.a
    text: de afdeling Jeugdbescherming;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: 38.5.b
    text: de afdeling Jeugdsancties en -preventie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: 38.5.c
    text: het programma Aanpak jeugdcriminaliteit.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel38
  - number: '39.1'
    text: |-
      De directie Control, Bedrijfsvoering en Juridische Zaken (CBJ) is belast met een integrale controltaak en
      advisering daarover aan de directeur-generaal Preventie, Jeugd en Sancties en de directeuren Sanctie- en
      Preventiebeleid en Justitieel Jeugdbeleid. De controltaak omvat in ieder geval de financiële en beleidsmatige
      control ten aanzien van de taakorganisaties, rechtspersonen met een wettelijke taak, zelfstandige bestuursorganen
      en gesubsidieerde organisaties en instellingen op het terrein van DGPJS.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel39
  - number: '39.2'
    text: |-
      Daarnaast is de directie belast met het gevraagd en ongevraagd advies uitbrengen over bedrijfsvoerings- en
      juridische vraagstukken, het ondersteunen bij en voeren van juridische procedures en de verzorging van de interne
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel39
  - number: '39.3'
    text: |-
      De uitvoering van de werkzaamheden van de Centrale autoriteit interlandelijke adoptie, de Centrale autoriteit
      internationale kinderbescherming en de Centrale autoriteit internationale kinderontvoering is binnen de directie
      belegd bij de in het vierde lid, onder c, genoemde afdeling.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel39
  - number: '39.4'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel39
  - number: 39.4.a
    text: de afdeling Control;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel39
  - number: 39.4.b
    text: de afdeling Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel39
  - number: 39.4.c
    text: de afdeling Juridische en Internationale Zaken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel39
  - number: '40'
    text: |-
      De baten-lastendienst Dienst JUSTIS is belast met het namens de minister nemen van besluiten en verwerken van
      informatie ter bevordering van een betrouwbare, veilige en rechtvaardige samenleving in sectoren met kwetsbare
      belangen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel40
  - number: '41'
    text: |-
      De baten-lastendienst Dienst Justitiële Inrichtingen (DJI) is belast met het leveren van een bijdrage aan de
      veiligheid van de samenleving door tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen en
      door de aan de zorg van het ministerie toevertrouwde personen de kans te bieden een maatschappelijk aanvaardbaar
      bestaan op te bouwen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel41
  - number: '42'
    text: |-
      De raad voor de kinderbescherming (RvdK) is belast met het waarborgen van het fundamentele recht van het kind
      op een gezonde en evenwichtige ontwikkeling en uitgroei naar volwassenheid. De raad voert de volgende taken uit:
      beschermingszaken, scheiding en omgang, adoptie en strafzaken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel42
  - number: '43'
    text: |-
      Het bureau van de Erkenningscommissie Gedragsinterventiese is belast met de bedrijfsvoering en de ondersteuning van
      de Erkenningscommissie Gedragsinterventies.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel43
  - number: '44.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de Nationaal Coördinator Terrorismebestrijding integraal verantwoordelijk voor de
      beleids- en bedrijfsvoering van de rechtstreeks onder hem ressorterende dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel3
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '3'
        hoofdstuk: I
  - number: '44.2'
    text: De NCTb legt inhoudelijk direct verantwoording af aan de minister.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel44
  - number: '44.3'
    text: De NCTb wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel44
  - number: '45.1'
    text: |-
      Het bureau Algemene Zaken is belast met de ondersteuning van de NCTb in de dagelijkse aansturing van de
      dienstonderdelen die onder de NCTb ressorteren, de uitvoering van de begroting van de NCTb en de ondersteuning van
      de primaire processen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel45
  - number: '45.2'
    text: |-
      Het bureau coördineert de inzet van de voor terrorismebestrijding beschikbare middelen, bereidt beslissingen over
      de aanwending van die middelen voor en brengt hierover advies uit aan de NCTb.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel45
  - number: '45.3'
    text: Het bureau adviseert de NCTb over beleidsvoorstellen waaraan financiële of uitvoeringsconsequenties zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel45
  - number: '46'
    text: |-
      Het bureau Communicatie en Voorlichting is belast met regie op de voorlichting, woordvoering en
      communicatiestrategie betreffende terrorisme en terrorismebestrijding.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel46
  - number: '47.1'
    text: |-
      De directie Beleid en Strategie (DBS) initieert, coördineert en evalueert het beleid op het terrein van
      terrorismebestrijding. Hiertoe coördineert zij de inzet van de betrokken ministeries en diensten.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel47
  - number: '47.2'
    text: |-
      De directie geeft richting aan de strategieontwikkeling rond terrorisme en coördineert de uitvoering van de
      contraterrorismestrategie.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel47
  - number: '47.3'
    text: |-
      De directie is belast met de coördinatie van algemene parlementaire aangelegenheden en bereidt de
      interdepartementale en politiek-bestuurlijke besluitvorming voor.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel47
  - number: '47.4'
    text: |-
      De directie is verantwoordelijk voor en coördineert de strategische en beleidsmatige juridische aangelegenheden van
      de NCTb.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel47
  - number: '47.5'
    text: |-
      De directie bereidt de relevante internationale en Europese beleidsvorming voor in overleg met haar partners en
      coördineert en ondersteunt de internationale en Europese activiteiten van de NCTb.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel47
  - number: '48'
    text: 'De directie Regie (DR) is belast met:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel48
  - number: 48.a
    text: |-
      het regisseren van de samenwerking van de verschillende partijen op het terrein van terrorismebestrijding via
      structurele, procesgerichte regie en tevens incidentele, meer actiegerichte regie;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel48
  - number: 48.b
    text: het realiseren van een hogere samenwerkingsgraad tussen die partijen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel48
  - number: '49.1'
    text: |-
      De directie Kennis & Analyse (DKA) is belast met het bijeenbrengen, combineren en verdelen van informatie van
      inlichtingenverschaffende diensten en bestuurlijke en wetenschappelijke bronnen ten behoeve van integrale analyses
      en dreigingsbeelden inzake terrorisme.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel49
  - number: '49.2'
    text: |-
      De directie functioneert als het expertise- en informatiecentrum waarin alle andere partners op dit vlak
      participeren en hun informatie aanleveren. Verder vindt hier de waardering plaats van alle informatie uit
      bronnen op hoog en laag niveau binnen zeer diverse kringen, waarvoor het noodzakelijk is om informatiestromen te
      organiseren en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel49
  - number: '50.1'
    text: De directie Beveiliging Burgerluchtvaart (DBB) is belast met de beveiliging van de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: '50.2'
    text: 'De directie heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.a
    text: |-
      het in nationaal en internationaal verband opstellen van het beleid op het gebied van de beveiliging van de
      burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.b
    text: |-
      het opstellen van regels en het geven van aanwijzingen aan de Koninklijke marechaussee en de luchtvaartsector op
      basis van de [Luchtvaartwet][ref1] en de [Politiewet 1993][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0006299
  - number: 50.2.c
    text: |-
      het aansturen van de Koninklijke marechaussee, voor zover deze onder het gezag van de minister is belast met het
      toezicht op de uitvoering van de beveiligingsmaatregelen door de luchtvaartsector;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.d
    text: het opstellen en actualiseren van het nationaal beveiligingsplan voor de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.e
    text: het uitvoeren van risicoanalyses op basis waarvan eventuele aanvullende beveiligingsmaatregelen worden genomen;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.f
    text: |-
      het monitoren van het beveiligingsniveau en het op basis daarvan evalueren van de effectiviteit van het gevoerde
      beleid;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.g
    text: het goedkeuren van beveiligingsplannen van zowel de luchthavens als de luchtvaartmaatschappijen;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.h
    text: het onderzoeken van nieuwe beveiligingsconcepten, beveiligingsprocessen en beveiligingsapparatuur;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.i
    text: het certificeren van opleidingsorganisaties;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: 50.2.j
    text: het deelnemen aan internationale beveiligingsinspecties op luchthavens.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel50
  - number: '51'
    text: |-
      De Eenheid Bewaking en Beveiliging (EBB) is belast met het onderhouden, uitvoeren en vernieuwen van het nationaal
      stelsel van bewaken en beveiligen, het stelsel van speciale eenheden, het Alerteringssysteem Terrorismebestrijding
      en het uitvoeren van de [Regeling bijstand bestrijding luchtvaartterrorisme][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018217
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018217
  - number: '52'
    text: |-
      De inspectie Openbare Orde en Veiligheid heeft de taken, bedoeld in
      [artikel 57 van de Wet op de veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '57'
  - number: '53'
    text: |-
      Bij de hoofden van de in [artikel 2][ref1] genoemde dienstonderdelen liggen voor het daarbij werkzame personeel
      ter inzage:


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel2
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '2'
        hoofdstuk: I
  - number: 53.a
    text: een exemplaar van deze regeling;
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel53
  - number: 53.b
    text: het organisatie- en formatierapport van het betreffende dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel53
  - number: '54.1'
    text: |-
      Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in deze regeling, wordt genomen door de
      secretaris-generaal, gehoord de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel54
  - number: '54.2'
    text: |-
      De directeur Personeel en Organisatie adviseert de secretaris-generaal alvorens een beslissing omtrent instemming
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel54
  - number: '55.1'
    text: |-
      Elk van de in [artikel 2][ref1] genoemde dienstonderdelen ontwerpt en onderhoudt een organisatierapport en een
      formatierapport en, voor zover van toepassing, een taakbesluit en een baten-lastendienstregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel2
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '2'
        hoofdstuk: I
  - number: '55.2'
    text: |-
      Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder a, e en f][ref1], is de secretaris-generaal bevoegd het document namens de minister vast te
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel2
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '2'
        hoofdstuk: I
  - number: '55.3'
    text: |-
      Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder b, c en d][ref1], is de directeur-generaal onder wie het dienstonderdeel ressorteert, bevoegd
      het document namens de minister vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel2
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '2'
        hoofdstuk: I
  - number: '55.4'
    text: |-
      De secretaris-generaal respectievelijk de directeur-generaal kan de in het tweede respectievelijk derde lid
      bedoelde bevoegdheid mandateren aan een onder hem ressorterende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel55
  - number: '55.5'
    text: |-
      Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad. De directeur Personeel en Organisatie adviseert de bestuursraad alvorens een beslissing omtrent
      instemming wordt genomen.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel55
  - number: '56.1'
    text: De directeur Personeel en Organisatie is belast met het beheer van deze regeling.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel56
  - number: '56.2'
    text: |-
      De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal en de Nationaal
      Coördinator Terrorismebestrijding zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de
      directeur Personeel en Organisatie van de gegevens die een goed beheer van deze regeling mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel56
  - number: '57'
    text: |-
      Na inwerkingtreding van deze regeling berust het Taak- en bevoegdheidsbesluit pSG Justitie op de
      [artikelen 3, tweede lid, tweede volzin][ref1], en [4, tweede lid][ref2], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0029453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029453#Artikel4
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0029453
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0029453
        artikel: '4'
        hoofdstuk: II
  - number: '58'
    text: |-
      De [Organisatieregeling Ministerie van Justitie 2007][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0022607
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0022607
  - number: '59'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 14 oktober 2010.
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel59
  - number: '60'
    text: 'Deze regeling wordt aangehaald als: Organisatieregeling Ministerie van Veiligheid en Justitie.'
    url: https://wetten.overheid.nl/BWBR0029453/2011-07-01#Artikel60
