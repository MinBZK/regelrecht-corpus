  - number: '2.2'
    text: |-
      Wanneer de detachering meer dan twaalf maanden bedraagt, zijn op de gedetacheerde werknemer vanaf de
      dertiende maand alle wettelijke arbeidsvoorwaarden en -omstandigheden van toepassing, met uitzondering
      van procedures, formaliteiten en voorwaarden van de sluiting en de beëindiging van de arbeidsovereenkomst,
      waaronder concurrentiebedingen, en pensioen als bedoeld in [artikel 1 van de Pensioenwet][ref1] dan wel
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
  - number: '2.3'
    text: |-
      De in het tweede lid genoemde termijn van twaalf maanden bedraagt achttien maanden indien de dienstverrichter,
      gedurende de laatste drie maanden van de periode van ten hoogste twaalf maanden waarin de detachering plaatsvindt,
      aan Onze Minister een gemotiveerde kennisgeving verstrekt, dat de in eerste instantie opgegeven vermoedelijke duur
      van de werkzaamheden zal worden overschreden tot ten hoogste achttien maanden. Wanneer de detachering in geval van
      verdere verlenging meer dan achttien maanden bedraagt, gelden de in het tweede lid bedoelde arbeidsvoorwaarden en
      -omstandigheden vanaf de negentiende maand.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
  - number: '2.4'
    text: |-
      Indien een gedetacheerde werknemer door de dienstverrichter wordt vervangen door een andere gedetacheerde werknemer
      die op dezelfde plaats hetzelfde werk uitvoert, is de duur van de detachering de totale duur van de perioden van
      detachering van de afzonderlijke gedetacheerde werknemers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
  - number: '3.1'
    text: |-
      Een werknemer die tijdelijk buiten Nederland arbeid verricht of heeft verricht in een lidstaat kan, ongeacht het
      recht dat de arbeidsovereenkomst beheerst, met betrekking tot die arbeid aanspraken ontlenen aan het recht dat die
      lidstaat heeft vastgesteld ter uitvoering van de detacheringsrichtlijn.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
  - number: '3.2'
    text: |-
      Indien sprake is van een werknemer op wie de detacheringsrichtlijn van toepassing is, stelt de werkgever de
      werknemer, voor zijn vertrek naar de andere lidstaat, in kennis van:
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
  - number: 3.2.a
    text: het loon waarop de werknemer recht heeft volgens het geldende recht van de ontvangende lidstaat;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
  - number: 3.2.b
    text: |-
      in voorkomend geval, alle toeslagen in verband met de detachering en alle regelingen voor de vergoeding van reis-,
      verblijf- en maaltijdkosten; en
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
  - number: 3.2.c
    text: |-
      de link naar de door de ontvangende lidstaat uit hoofde van artikel 5, tweede lid, van de handhavingsrichtlijn
      ontwikkelde unieke officiële nationale website(s).
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
  - number: '3.3'
    text: |-
      [Artikel 655, tweede lid, tweede zin, van Boek 7 van het Burgerlijk Wetboek][ref1] is van overeenkomstige
      toepassing op het tweede lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel655
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '655'
  - number: '3.4'
    text: |-
      Het tweede lid is niet van toepassing op een zeevarende werkzaam op basis van een arbeidsovereenkomst in de
      zeevisserij als bedoeld in [artikel 739 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel739
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '739'
  - number: '3.5'
    text: |-
      De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte de in
      dit artikel aan hem toegekende rechten geldend maakt, ter zake bijstand heeft verleend of een klacht hierover heeft
      ingediend.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3
  - number: 3a.1
    text: |-
      De werknemer die ter beschikking is gesteld in de zin van onderdeel 3 van transnationale dienstverrichting
      als bedoeld in [artikel 1, eerste lid][ref1], en door de dienstontvanger in het kader van transnationale
      dienstverrichting ter beschikking wordt gesteld om tijdelijk arbeid te verrichten in een andere lidstaat dan de
      lidstaat waar de werknemer gewoonlijk werkt voor hetzij de dienstverrichter, hetzij de dienstontvanger, wordt
      geacht in die lidstaat ter beschikking te zijn gesteld door de dienstverrichter.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel1
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '1'
        hoofdstuk: I
  - number: 3a.2
    text: |-
      De dienstontvanger informeert de dienstverrichter tijdig en voor aanvang van de terbeschikkingstelling, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3a
  - number: 3a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing met betrekking tot de arbeidskracht die ter
      beschikking is gesteld, bedoeld in [artikel 1 van de Wet allocatie arbeidskrachten door intermediairs][ref1], met
      dien verstande dat onder dienstontvanger wordt verstaan de inlener als bedoeld in [artikel 7a van die wet][ref2],
      en onder dienstverrichter degene die de arbeidskracht ter beschikking stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009616
        artikel: 7a
  - number: 3b
    text: |-
      De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer
      een gerechtelijke of administratieve procedure start om de in deze wet of de in
      __REF000___________________________________________________________________________________________________________
      _________________________ aan hem toegekende rechten geldend te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: 2a
  - number: '4.1'
    text: |-
      Bij Onze Minister berust het verbindingsbureau, bedoeld in artikel 4 van de detacheringsrichtlijn, voor de
      administratieve samenwerking, bedoeld in artikel 5, onderdeel b, van de IMI-verordening, tussen de lidstaten in
      verband met het toezicht op de naleving van de arbeidsvoorwaarden en de arbeidsomstandigheden, bedoeld in artikel
      3 van de detacheringsrichtlijn. Door Onze Minister aangewezen ambtenaren zijn belast met de verwerking van gegevens
      over gedetacheerde werknemers en dienstverrichters ten behoeve van deze administratieve samenwerking.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel4
  - number: '4.2'
    text: |-
      De door Onze Minister aangewezen ambtenaren verwerken gegevens, die zij verkrijgen ten behoeve van het toezicht
      op de naleving van de Wet arbeid vreemdelingen, de Wet allocatie arbeidskrachten door intermediairs, de Wet
      minimumloon en minimumvakantiebijslag, de [Arbeidsomstandighedenwet][ref1], de [Arbeidstijdenwet][ref2], de
      __REF002___________________________________________________________________________________________________________
      ______ en deze wet verder ten behoeve van de administratieve samenwerking, bedoeld in het eerste lid, en de
      wederzijdse bijstand bij de handhaving, bedoeld in [hoofdstuk IV][ref4], en verstrekken daarbij uit eigen beweging
      gegevens aan de bevoegde instanties in andere lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0007671
      [ref3]: https://wetten.overheid.nl/BWBR0001987
      [ref4]: https://wetten.overheid.nl/BWBR0038054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010346
      - id: ref2
        bwb_id: BWBR0007671
      - id: ref3
        bwb_id: BWBR0001987
      - id: ref4
        bwb_id: BWBR0038054
        hoofdstuk: IV
  - number: '4.3'
    text: |-
      Gegevens die de door Onze Minister aangewezen ambtenaren in verband met de in het eerste lid bedoelde samenwerking
      verkrijgen van bevoegde instanties in andere lidstaten kunnen door Onze Minister verder worden verwerkt voor het
      toezicht op de naleving door dienstverrichters van de wetten, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel4
  - number: '4.4'
    text: |-
      Bestuursorganen en toezichthouders verstrekken desgevraagd of uit eigen beweging aan Onze Minister alle gegevens en
      inlichtingen, die noodzakelijk zijn voor de uitoefening van zijn taken in verband met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister verstrekt de gegevens, die hij verwerkt op grond van het tweede en derde lid, aan bestuursorganen
      en toezichthouders, die noodzakelijk zijn voor de uitoefening van hun taken in verband met transnationale
      dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel4
  - number: '4.6'
    text: |-
      Met het oog op de in het eerste lid genoemde samenwerking en de wederzijdse bijstand bij de handhaving, bedoeld in
      [hoofdstuk IV][ref1], geeft Onze Minister gehoor aan met gerechtvaardigde redenen omklede verzoeken van bevoegde
      instanties uit andere lidstaten om informatie en om uitvoering van controles, inspecties en onderzoeken met
      betrekking tot de transnationale dienstverrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038054
        hoofdstuk: IV
  - number: '4.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens die
      verwerkt worden op grond van dit artikel, de wijze waarop die gegevens worden verwerkt alsmede de bij de
      gegevensverstrekkingen in acht te nemen termijnen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel4
  - number: '5.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de door Onze Minister
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel5
  - number: '5.2'
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel5
  - number: '6.1'
    text: |-
      De dienstverrichter verstrekt desgevraagd aan Onze Minister en de door Onze Minister aangewezen ambtenaren, bedoeld
      in [artikel 5][ref1], alle gegevens en inlichtingen, die noodzakelijk zijn voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel5
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '5'
        hoofdstuk: III
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op zelfstandigen voor wie de verplichting geldt, bedoeld in
      [artikel 8, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
  - number: '6.3'
    text: |-
      Indien dit in het kader van de handhaving noodzakelijk is, beoordelen de door Onze Minister aangewezen ambtenaren,
      bedoeld in [artikel 5][ref1], aan de hand van de bij algemene maatregel van bestuur vastgestelde elementen:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel5
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '5'
        hoofdstuk: III
  - number: 6.3.a
    text: |-
      of een onderneming als bedoeld in artikel 1, eerste lid, van de detacheringsrichtlijn, daadwerkelijk substantiële
      activiteiten verricht om werknemers ter beschikking te stellen in het kader van transnationale dienstverrichting;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel6
  - number: 6.3.b
    text: of een gedetacheerde werknemer tijdelijk arbeid in Nederland verricht.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel6
  - number: '7'
    text: |-
      De dienstverrichter wijst voor de periode van transnationale dienstverrichting een contactpersoon, die als
      aanspreekpunt van de dienstverrichter fungeert en die in de lidstaat waar de arbeid wordt verricht beschikbaar
      is voor het verzenden en ontvangen van informatie met betrekking tot de transnationale dienstverrichting, aan in
      Nederland ten behoeve van Onze Minister in verband met de detachering naar Nederland.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel7
  - number: '8.1'
    text: |-
      De dienstverrichter, die een werknemer detacheert naar Nederland, is verplicht dit schriftelijk of elektronisch aan
      Onze Minister te melden op een tijdstip voor aanvang van de werkzaamheden, waarbij hij meldt:
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: 8.1.a
    text: zijn identiteit;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: 8.1.b
    text: de identiteit van de dienstontvanger en van de gedetacheerde werknemer;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: 8.1.c
    text: |-
      de contactpersoon, bedoeld in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel7
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '7'
        hoofdstuk: III
  - number: 8.1.d
    text: de identiteit van de voor de uitbetaling van het loon verantwoordelijke natuurlijke persoon of rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: 8.1.e
    text: de aard en de vermoedelijke duur van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: 8.1.f
    text: het adres van de werkplek; en
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: 8.1.g
    text: de bijdrage voor toepasselijke socialezekerheidsregelingen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de dienstverrichter een werknemer detacheert naar Nederland, verstrekt de dienstverrichter voor aanvang van
      de werkzaamheden aan de dienstontvanger een schriftelijk of elektronisch afschrift van de melding, bedoeld in het
      eerste lid, met daarin ten minste de gegevens over zijn identiteit en de identiteit van de gedetacheerde werknemer,
      het adres van de werkplek en de aard en duur van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '8.3'
    text: |-
      De dienstontvanger controleert of het afschrift van de melding, bedoeld in het tweede lid, de in het tweede lid
      genoemde gegevens vermeldt en meldt onjuistheden, of het niet hebben ontvangen van het afschrift, uiterlijk vijf
      werkdagen na aanvang van de werkzaamheden schriftelijk of elektronisch aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '8.4'
    text: |-
      De gegevens die op grond van dit artikel door Onze Minister worden verwerkt worden verstrekt aan bestuursorganen en
      toezichthouders, voor zover die noodzakelijk zijn voor de uitoefening van hun taken in verband met transnationale
      dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '8.5'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven met betrekking tot het model van de melding, de taal,
      de wijze van melding, de over te leggen bescheiden en het tijdstip van de melding, bedoeld in het eerste lid, en
      het verstrekken van gegevens op grond van dit artikel aan bestuursorganen en toezichthouders.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '8.6'
    text: |-
      De verplichting in het eerste lid, aangaande de melding van de aard en vermoedelijke duur van de werkzaamheden, de
      identiteit van de voor de uitbetaling van het loon verantwoordelijke persoon en de identiteit van de persoon die de
      werkzaamheden uitvoert en de verplichting uit het tweede lid zijn van overeenkomstige toepassing op zelfstandigen
      die werkzaam zijn in bij algemene maatregel van bestuur aangewezen sectoren van het beroeps- of bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '8.7'
    text: |-
      Bij algemene maatregel van bestuur worden categorieën van gedetacheerde werknemers en dienstverrichters aangewezen
      waarop dit artikel niet van toepassing is of voor wie voor de melding nadere bij deze algemene maatregel van
      bestuur te bepalen regels gelden.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '8.8'
    text: |-
      De werkzaamheden van Onze Minister in verband met dit artikel kunnen worden uitgevoerd door een door Onze Minister
      aan te wijzen zelfstandig bestuursorgaan. Onze Minister kan voor de verwerking van de gegevens op grond van dit
      artikel een verwerker aanwijzen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel8
  - number: '9.1'
    text: |-
      Tijdens de periode van detachering draagt de dienstverrichter er zorg voor dat op de werkplek, bedoeld in
      [artikel 8, eerste lid, onderdeel f][ref1], schriftelijk of elektronisch beschikbaar zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
  - number: 9.1.a
    text: de arbeidsovereenkomst met de gedetacheerde werknemer;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
  - number: 9.1.b
    text: |-
      een opgave als bedoeld in [artikel 626 van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel626
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '626'
  - number: 9.1.c
    text: |-
      een opgave als bedoeld in [artikel 655 van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel655
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '655'
  - number: 9.1.d
    text: bescheiden waaruit blijkt hoeveel uren de gedetacheerde werknemer heeft gewerkt;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
  - number: 9.1.e
    text: |-
      bewijsstukken waaruit de bijdrage voor socialezekerheidsregelingen en de identiteit van de dienstverrichter, de
      dienstontvanger, de gedetacheerde werknemer en van de voor de uitbetaling van het loon verantwoordelijke persoon
      blijken; en
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
  - number: 9.1.f
    text: een bewijs, waaruit blijkt welk loon aan de gedetacheerde werknemer is voldaan.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
  - number: '9.2'
    text: |-
      De zelfstandige voor wie de verplichting, bedoeld in [artikel 8, zesde lid][ref1], geldt draagt er zorg voor dat
      tijdens de periode, waarin hij werkzaamheden verricht, op de werkplek, bedoeld in artikel 8, eerste lid, onderdeel
      f, bewijsstukken aanwezig zijn waaruit zijn identiteit, de identiteit van de dienstontvanger en de identiteit van
      de verantwoordelijke voor de uitbetaling van het loon blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
  - number: '9.3'
    text: |-
      De dienstverrichter en de zelfstandige dragen er zorg voor dat de bescheiden, bedoeld in het eerste en tweede lid,
      na de periode van detachering of de periode waarin de werkzaamheden worden verricht binnen redelijke termijn op
      verzoek aan de aangewezen ambtenaren, bedoeld in [artikel 5][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel5
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '5'
        hoofdstuk: III
  - number: '9.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de vereisten waaraan de
      bescheiden, bedoeld in het eerste en tweede lid, voldoen, de plaats waar deze bescheiden beschikbaar worden gesteld
      en met betrekking tot het derde lid.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9
  - number: 9a.1
    text: |-
      In de artikelen van dit hoofdstuk wordt verstaan onder: - *gedetacheerde bestuurder:* de gedetacheerde
      werknemer, die als bestuurder in de wegvervoersector ter beschikking wordt gesteld in de zin van onderdeel
      1 van de begripsbepaling van transnationale dienstverrichting, anders dan voor de activiteiten, bedoeld in
      [artikel 9b, tweede lid][ref1];
        - *Richtlijn 92/106/EEG:* [Richtlijn 92/106/EEG](31992L0106) van de Raad van 7 december 1992 houdende vaststelling
      van gemeenschappelijke voorschriften voor bepaalde vormen van gecombineerd vervoer van goederen tussen Lid-Staten
      (PbEG 1992, L 368);
        - *Verordening 1071/2009/EG:* [Verordening (EG) nr. 1071/2009](32009R1071) van het Europees Parlement en de
      Raad van 21 oktober 2009 tot vaststelling van gemeenschappelijke regels betreffende de voorwaarden waaraan moet
      zijn voldaan om het beroep van wegvervoerondernemer uit te oefenen en tot intrekking van [Richtlijn 96/26/EG]
      (31996L0026) van de Raad (PbEU L 300/51);
        - *Verordening 1072/2009/EG:* [Verordening (EG) nr. 1072/2009](32009R1072) van het Europees Parlement en de Raad
      van 21 oktober 2009 tot vaststelling van gemeenschappelijke regels voor toegang tot de markt voor internationaal
      goederenvervoer over de weg (PbEU 2009, L 300/72);
        - *Verordening 1073/2009/EG:* [Verordening (EG) nr. 1073/2009](32009R1073) van het Europees Parlement en de
      Raad van 21 oktober 2009 tot vaststelling van gemeenschappelijke regels voor toegang tot de internationale markt
      voor touringcar- en autobusdiensten en tot wijziging van [Verordening (EG) nr. 561/2006](32006R0561) (PbEU 2009,
      L 300/88);
        - *Verordening 165/2014/EU:* [Verordening (EU) nr. 165/2014](32014R0165) van het Europees Parlement en de Raad
      van 4 februari 2014 betreffende tachografen in het wegvervoer, tot intrekking van [Verordening (EEG) nr. 3821/85]
      (31985R3821) van de Raad betreffende het controleapparaat in het wegvervoer en tot wijziging van [Verordening (EG)
      nr. 561/2006](32006R0561) van het Europees Parlement en de Raad tot harmonisatie van bepaalde voorschriften van
      sociale aard voor het wegvervoer (PbEU L 60/1);
        - *Verordening 561/2006/EG:* [Verordening (EG) nr. 561/2006](32006R0561) van het Europees Parlement en de Raad van
      15 maart 2006 tot harmonisatie van bepaalde voorschriften van sociale aard voor het wegvervoer, tot wijziging van
      [Verordeningen (EEG) nr. 3821/85](31985R3821) en [(EG) nr. 2135/98](31998R2135) van de Raad en tot intrekking van
      [Verordening (EEG) nr. 3820/85](31985R3820) van de Raad (PbEU L 102/1).


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel9b
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: 9b
        hoofdstuk: IIIa
  - number: 9a.2
    text: |-
      In afwijking van [artikel 1, eerste lid][ref1], wordt voor de toepassing van dit hoofdstuk onder lidstaat verstaan:
      een staat binnen de Europese Unie en bij ministeriële regeling aangewezen staten.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel1
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '1'
        hoofdstuk: I
  - number: 9b.1
    text: 'Een bestuurder wordt aangemerkt als gedetacheerde werknemer, indien hij:'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.1.a
    text: |-
      in Nederland cabotage verricht als bedoeld in [Verordeningen 1072/2009/EG](32009R1072) en [1073/2009/EG]
      (32009R1073); of
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.1.b
    text: 'niet-bilaterale vervoersactiviteiten verricht, bestaande in:'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.1.b.1°
    text: |-
      het vervoer van goederen op basis van een vervoersovereenkomst buiten de lidstaat van vestiging, bedoeld in artikel
      2, onderdeel 8, van [Verordening 1071/2009/EG](32009R1071), tussen Nederland en een andere lidstaat of een derde
      land; of
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.1.b.2°
    text: |-
      het vervoer van personen buiten de lidstaat van vestiging, tussen Nederland en een andere lidstaat of een derde
      land.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2
    text: 'Een bestuurder wordt niet aangemerkt als gedetacheerde werknemer, indien hij:'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.a
    text: 'bilaterale vervoersactiviteiten in het goederenvervoer verricht, bestaande in:'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.a.1°
    text: |-
      het vervoer van goederen op basis van een vervoersovereenkomst van de lidstaat van vestiging, bedoeld in artikel 2,
      onderdeel 8, van [Verordening 1071/2009/EG](32009R1071), naar een andere lidstaat of een derde land;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.a.2°
    text: |-
      het vervoer van goederen op basis van een vervoersovereenkomst van een andere lidstaat of een derde land naar de
      lidstaat van vestiging;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.a.3°
    text: |-
      het verrichten van een bilaterale vervoersactiviteit als bedoeld in subonderdeel 1° of 2°, naast het verrichten
      van ten hoogste één laad- en één losactiviteit in de lidstaten of derde landen die worden doorkruist, mits de
      bestuurder de goederen niet laadt en lost in dezelfde lidstaat;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.a.4°
    text: |-
      het verrichten van een bilaterale vervoersactiviteit vanuit de lidstaat van vestiging, waarbij geen extra
      activiteit wordt verricht, gevolgd door een bilaterale vervoersactiviteit naar de lidstaat van vestiging, waarbij
      ten hoogste twee extra laad- en twee losactiviteiten worden verricht in de lidstaten of derde landen die worden
      doorkruist, mits de bestuurder de goederen niet laadt en lost in dezelfde lidstaat; of
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.a.5°
    text: |-
      het uitvoeren van het begin- of eindtraject van gecombineerd vervoer als bedoeld in [Richtlijn 92/106/EEG]
      (31992L0106), mits het wegtraject bestaat uit bilaterale vervoersactiviteiten als bedoeld in de subonderdelen 1°
      tot en met 4°;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.b
    text: 'bilaterale vervoersactiviteiten in het personenvervoer verricht, bestaande in:'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.b.1°
    text: |-
      het meenemen van passagiers vanuit de lidstaat van vestiging, bedoeld in onderdeel a, en het afzetten van deze
      passagiers in een andere lidstaat of derde land;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.b.2°
    text: |-
      het meenemen van passagiers vanuit een lidstaat of derde land en het afzetten van deze passagiers in de lidstaat
      van vestiging;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.b.3°
    text: |-
      het meenemen van passagiers en het afzetten van deze passagiers in de lidstaat van vestiging om plaatselijke
      excursies in een andere lidstaat of een derde land uit te voeren, overeenkomstig [Verordening 1073/2009/EG]
      (32009R1073); of
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.b.4°
    text: |-
      het verrichten van een activiteit als bedoeld in subonderdeel 1° of 2°, of de terugrit van dit traject, naast het
      ten hoogste eenmaal laten instappen en eenmaal laten uitstappen van passagiers in de lidstaten of derde landen
      die worden doorkruist, mits de bestuurder geen personenvervoersdiensten tussen twee locaties binnen de doorkruiste
      lidstaat aanbiedt; of
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9b.2.c
    text: |-
      door Nederland heen rijdt zonder dat er vracht wordt geladen of gelost en zonder dat er passagiers in- of
      uitstappen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9b
  - number: 9c
    text: |-
      Voor de toepassing van [artikel 2, tweede tot en met vierde lid][ref1], wordt de detachering van een gedetacheerde
      bestuurder geacht te zijn beëindigd wanneer hij bij het verrichten van het internationaal vervoer van goederen of
      personen Nederland verlaat. Deze detacheringsperiode wordt niet gecumuleerd met eerdere detacheringsperiodes in het
      kader van dergelijke internationale activiteiten van dezelfde bestuurder of van de bestuurder die hij vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel2
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '2'
        hoofdstuk: II
  - number: 9d
    text: |-
      In afwijking van [artikel 7][ref1] wijst de dienstverrichter die een gedetacheerde bestuurder detacheert
      als contactpersoon de vervoersmanager of een andere persoon in de lidstaat van vestiging aan, die optreedt
      als tussenpersoon met de door Onze Minister aangewezen ambtenaren en met wie documenten of berichten worden
      uitgewisseld.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel7
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '7'
        hoofdstuk: III
  - number: 9e.1
    text: |-
      In afwijking van [artikel 8][ref1] is de dienstverrichter, die een gedetacheerde bestuurder detacheert naar
      Nederland, verplicht om op een tijdstip voor aanvang van de werkzaamheden een detacheringsverklaring in te dienen
      bij Onze Minister via het IMI, met de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
  - number: 9e.1.a
    text: de identiteit van de dienstverrichter;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9e.1.b
    text: de contactgegevens van de contactpersoon;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9e.1.c
    text: de identiteit, de verblijfplaats en het nummer van het rijbewijs van de gedetacheerde bestuurder;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9e.1.d
    text: de aanvangsdatum van de arbeidsovereenkomst van de gedetacheerde bestuurder en het daarop toepasselijke recht;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9e.1.e
    text: de vermoedelijke duur van de detachering;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9e.1.f
    text: de kentekenplaten van de motorvoertuigen; en
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9e.1.g
    text: de aard van de verrichte vervoersdiensten.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9e.2
    text: De dienstverrichter houdt de detacheringsverklaringen actueel in het IMI.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9e
  - number: 9f.1
    text: |-
      In afwijking van [artikel 9][ref1] draagt de dienstverrichter, die een gedetacheerde bestuurder detacheert naar
      Nederland, er zorg voor dat deze bestuurder schriftelijk of elektronisch beschikbaar heeft en ter beschikking stelt
      wanneer daar bij een wegcontrole om wordt verzocht:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel9
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '9'
        hoofdstuk: III
  - number: 9f.1.a
    text: |-
      een kopie van de detacheringsverklaring, bedoeld in [artikel 9e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel9e
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: 9e
        hoofdstuk: IIIa
  - number: 9f.1.b
    text: |-
      bewijs van het vervoer dat plaatsvindt in Nederland, zoals een elektronische vrachtbrief of een bewijs als bedoeld
      in artikel 8, derde lid, van [Verordening 1072/2009/EG](32009R1072); en
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
  - number: 9f.1.c
    text: |-
      de tachograafgegevens, met name de landsymbolen van de lidstaten waar de bestuurder zich bevond tijdens
      internationaal wegvervoer of cabotage, in overeenstemming met de registratievoorschriften in het kader van
      [Verordening 561/2006/EG](32006R0561) en [Verordening 165/2014](32014R0165)/EU.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
  - number: 9f.2
    text: |-
      Na de detacheringsperiode verstrekt de dienstverrichter, uiterlijk acht weken na een verzoek van de door Onze
      Minister aangewezen ambtenaren, via het IMI:
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
  - number: 9f.2.a
    text: kopieën van de in het eerste lid, onderdelen b en c, bedoelde documenten;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
  - number: 9f.2.b
    text: documentatie in verband met de beloning van de bestuurder met betrekking tot de detacheringsperiode;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
  - number: 9f.2.c
    text: |-
      de arbeidsovereenkomst met de bestuurder of een opgave als bedoeld in
      [artikel 655 van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel655
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '655'
  - number: 9f.2.d
    text: bescheiden waaruit blijkt hoeveel uren de bestuurder heeft gewerkt; en
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
  - number: 9f.2.e
    text: een bewijs, waaruit blijkt welk loon aan de bestuurder is voldaan.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9f
  - number: 9g
    text: |-
      In afwijking van [artikel 9][ref1] draagt de dienstverrichter, die een bestuurder in Nederland arbeid in
      de wegvervoersector laat verrichten in de zin van onderdeel 1 van de begripsbepaling van transnationale
      dienstverrichting, zonder als gedetacheerde bestuurder te worden aangemerkt, er zorg voor dat de bestuurder
      schriftelijk of elektronisch beschikbaar heeft en ter beschikking stelt wanneer daar bij een wegcontrole om wordt
      verzocht:


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel9
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '9'
        hoofdstuk: III
  - number: 9g.a
    text: |-
      het bewijs van het betrokken internationaal vervoer, zoals een elektronische vrachtbrief of een bewijs als bedoeld
      in artikel 8, derde lid, van [Verordening 1072/2009/EG](32009R1072); en
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9g
  - number: 9g.b
    text: |-
      de tachograafgegevens, met name de landsymbolen van de lidstaten waar de bestuurder zich bevond tijdens
      internationaal wegvervoer of cabotage, in overeenstemming met de registratievoorschriften in het kader van
      [Verordening 561/2006/EG](32006R0561) en [Verordening 165/2014](32014R0165)/EU.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9g
  - number: 9h
    text: |-
      Voor de toepassing van dit hoofdstuk, van het bepaalde bij of krachtens de [artikelen 2][ref1],
      [4][ref2], [6][ref3], [7][ref4], [12][ref5] en [14][ref6] van deze wet en van de [artikelen 2a][ref7] en
      __REF007___________________________________________________________________________________________________________
      _________________, wordt degene die vanuit het Verenigd Koninkrijk een gedetacheerde bestuurder ter beschikking
      stelt om tijdelijk arbeid te verrichten in Nederland, bestaande in het vervoer van goederen over de weg, aangemerkt
      als dienstverrichter.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0038054#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0038054#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0038054#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0038054#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
      [ref8]: https://wetten.overheid.nl/BWBR0001987#Artikel10a
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9h
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0038054
        artikel: '6'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0038054
        artikel: '7'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0038054
        artikel: '12'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0038054
        artikel: '14'
        hoofdstuk: IV
      - id: ref7
        bwb_id: BWBR0001987
        artikel: 2a
      - id: ref8
        bwb_id: BWBR0001987
        artikel: 10a
  - number: 9i
    text: |-
      In een derde land gevestigde vervoersondernemingen mogen geen gunstiger behandeling krijgen dan gelijksoortige in
      een lidstaat gevestigde ondernemingen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel9i
  - number: '10.1'
    text: |-
      Bij besluit van Onze Minister aangewezen ambtenaren zijn bevoegd voor de wederzijdse bijstand, bedoeld in
      Hoofdstuk VI van de handhavingsrichtlijn, voor de wederzijdse bijstand, bedoeld in artikel 1, elfde lid, van de
      mobiliteitsrichtlijn en voor de wederzijdse bijstand, bedoeld in artikel 6 van bijlage 31, deel A, afdeling 2,
      behorende bij artikel 463, vierde lid, van de Handels- en samenwerkingsovereenkomst EU-VK.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
  - number: '10.2'
    text: 'Op verzoek van de bevoegde instantie zijn de aangewezen ambtenaren, bedoeld in het eerste lid, verplicht:'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
  - number: 10.2.a
    text: tot invordering van een onherroepelijke administratieve sanctie of boete, opgelegd in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
  - number: 10.2.b
    text: |-
      tot kennisgeving van de beslissing tot oplegging van een administratieve sanctie of boete, opgelegd in een andere
      lidstaat.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
  - number: '10.3'
    text: De administratieve sanctie of boete, bedoeld in het tweede lid, onderdeel a, kan worden ingevorderd bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
  - number: '10.4'
    text: |-
      [Titel 4.4. van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '10.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de vorm en de inhoud van het verzoek,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
  - number: '10.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de gronden voor afwijzing van
      het verzoek, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel10
  - number: '11'
    text: |-
      De bedragen van de ingevorderde administratieve sancties of boetes, bedoeld in [artikel 10][ref1], komen toe aan
      het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel10
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '10'
        hoofdstuk: IV
  - number: '12.1'
    text: Onze Minister kan een bestuurlijke boete opleggen voor de overtredingen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
  - number: '12.2'
    text: 'Als overtreding wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
  - number: 12.2.a
    text: |-
      het door een dienstverrichter of een zelfstandige, bedoeld in [artikel 8, zesde lid][ref1], niet of onvoldoende
      nakomen van de informatieverplichting, bedoeld in [artikel 6, eerste lid of tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel6
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '6'
        hoofdstuk: III
  - number: 12.2.b
    text: |-
      het door de dienstverrichter, de dienstontvanger of de zelfstandige, bedoeld in [artikel 8, zesde lid][ref1], niet
      of onvoldoende nakomen van de administratieve eisen en controlemaatregelen, bedoeld in artikel 8, eerste, derde of
      zesde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
  - number: 12.2.c
    text: |-
      het door de dienstverrichter of de zelfstandige, bedoeld in [artikel 8, zesde lid][ref1], niet of onvoldoende
      nakomen van de administratieve eisen, bedoeld in [artikel 9, eerste, tweede of derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel9
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0038054
        artikel: '9'
        hoofdstuk: III
  - number: 12.2.d
    text: |-
      het door de dienstverrichter niet of onvoldoende nakomen van de administratieve eisen en controlemaatregelen,
      bedoeld in [artikel 9e, eerste of tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel9e
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: 9e
        hoofdstuk: IIIa
  - number: 12.2.e
    text: |-
      het door de dienstverrichter niet of onvoldoende nakomen van de administratieve eisen en controlemaatregelen,
      bedoeld in [artikel 9f, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel9f
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: 9f
        hoofdstuk: IIIa
  - number: 12.2.f
    text: |-
      het door de dienstverrichter niet of onvoldoende nakomen van de administratieve eisen en controlemaatregelen,
      bedoeld in [artikel 9g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel9g
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: 9g
        hoofdstuk: IIIa
  - number: '12.3'
    text: |-
      Indien de dienstverrichter een overtreding begaat als bedoeld in het tweede lid, onder d of e, wordt de verzender,
      expediteur, contractant of subcontractant geacht dezelfde overtreding te hebben begaan wanneer hij wist of,
      rekening houdend met alle relevante omstandigheden, had moeten weten dat de vervoersdienst waartoe hij opdracht
      gaf, een inbreuk zou inhouden op deze bepalingen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel12
  - number: '13.1'
    text: |-
      Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1] vermeldt het rapport in ieder
      geval de bij de overtreding betrokken persoon of personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '13.2'
    text: Het rapport wordt toegezonden aan de daartoe door Onze Minister aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel13
  - number: '14.1'
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende, ambtenaar legt namens hem de bestuurlijke boete
      op aan degene op wie de verplichtingen rusten die voortvloeien uit deze wet, voor zover het niet naleven daarvan is
      aangeduid als een overtreding.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel14
  - number: '14.2'
    text: |-
      De terzake van deze wet gestelde overtredingen, gelden ten opzichte van elke persoon, met of ten aanzien van wie
      een overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel14
  - number: '15.1'
    text: |-
      De bestuurlijke boete die voor een overtreding kan worden opgelegd bedraagt ten hoogste het bedrag van de vierde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '15.2'
    text: |-
      Onverminderd het eerste lid verhoogt de op grond van [artikel 14][ref1] aangewezen ambtenaar de op te leggen
      bestuurlijke boete met 100 procent van het boetebedrag, vastgesteld op grond van het zesde lid, indien binnen een
      tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding een eerdere overtreding, bestaande
      uit het niet naleven van eenzelfde wettelijke verplichting, is geconstateerd en de bestuurlijke boete wegens de
      eerdere overtreding onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel14
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '14'
        hoofdstuk: IV
  - number: '15.3'
    text: |-
      De verhoging van de bestuurlijke boete, bedoeld in het tweede lid, bedraagt 200 procent indien zowel de overtreding
      als de eerdere overtreding, bedoeld in dat lid, bij of krachtens algemene maatregel van bestuur zijn aangewezen als
      ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel15
  - number: '15.4'
    text: |-
      Onverminderd het eerste lid verhoogt de op grond van [artikel 14][ref1] aangewezen ambtenaar de op te leggen
      bestuurlijke boete met 200 procent van het boetebedrag, vastgesteld op grond van het zesde lid, indien binnen een
      tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding twee maal een eerdere overtreding,
      bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven van bij of
      krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden op grond van deze
      wet of andere wetten, is geconstateerd en de bestuurlijke boeten wegens de eerdere overtredingen onherroepelijk
      zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel14
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '14'
        hoofdstuk: IV
  - number: '15.5'
    text: |-
      In afwijking van het tweede en vierde lid is het tijdvak van vijf jaar in die leden tien jaar indien de
      onherroepelijke boetes, bedoeld in die leden, zijn opgelegd wegens bij of krachtens algemene maatregel van bestuur
      aangewezen ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel15
  - number: '15.6'
    text: |-
      Onze Minister stelt beleidsregels vast waarin de boetebedragen voor de overtredingen worden vastgesteld.
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is van toepassing indien een artikel gesteld bij of
      krachtens deze wet op grond waarvan een bestuurlijke boete kan worden opgelegd, niet is nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15.7'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep de
      hoogte van de bestuurlijke boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '16'
    text: |-
      Indien een bestuurlijke boete ten onrechte is opgelegd, wordt deze binnen zes weken nadat is vastgesteld dat de
      bestuurlijke boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel16
  - number: '19'
    text: |-
      Onze Minister zendt binnen twee jaar na inwerkingtreding van [artikel 8][ref1] aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten van dit artikel in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel8
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '8'
        hoofdstuk: III
  - number: '20'
    text: |-
      De [Wet arbeidsvoorwaarden grensoverschrijdende arbeid][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010925
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010925
  - number: '21'
    text: |-
      De artikelen van deze wet treden in werking op bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig
      toepassing gegeven aan [artikel 12, eerste lid, van de Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '12'
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie.'
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel22
