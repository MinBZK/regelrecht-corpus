        artikel: '626'
  - number: 2.1.b
    text: |-
      ten aanzien van vakantie en verlof: [634 tot en met 642][ref1], [645][ref2], [646][ref3], [648][ref4], en
      [649 van Boek 7 van het Burgerlijk Wetboek][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel645
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel648
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel649
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '645'
      - id: ref3
