  - number: '1.2'
    text: Deze wet is niet van toepassing op zeevarend personeel van koopvaardijondernemingen.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur worden de begrippen zeevarend personeel en koopvaardijondernemingen, bedoeld in
      het tweede lid, nader omschreven.
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel1
  - number: '2.1'
    text: |-
      De volgende artikelen zijn van toepassing op gedetacheerde werknemers wier arbeidsovereenkomst wordt beheerst door
      ander recht dan het Nederlandse recht:
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
  - number: 2.1.a
    text: |-
      ten aanzien van het loon: [616a tot en met 616f][ref1] en [626 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel616a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel626
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
    references:
