        artikel: '646'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '648'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '649'
  - number: 2.1.c
    text: |-
      ten aanzien van verplichtingen van de werkgever: [655][ref1] en [658 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel655
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel658
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '655'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '658'
  - number: 2.1.d
    text: |-
      ten aanzien van het einde van de arbeidsovereenkomst: [670, tweede lid][ref1], en
      [681, eerste lid, onderdeel c, van Boek 7 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel681
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel2
    references:
      - id: ref1
