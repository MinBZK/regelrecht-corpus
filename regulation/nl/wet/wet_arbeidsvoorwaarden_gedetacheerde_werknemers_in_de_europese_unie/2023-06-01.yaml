preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de implementatie van Richtlijn
    2014/67/EU van het Europees Parlement en de Raad van 15 mei 2014 inzake de handhaving van Richtlijn 96/71/
    EG betreffende de terbeschikkingstelling van werknemers met het oog op het verrichten van diensten (de
    detacheringsrichtlijn) en tot wijziging van Verordening (EU) nr. 1024/2012 betreffende de administratieve
    samenwerking via het Informatiesysteem interne markt (PbEG2014,L159/11(«de IMI-verordening»)), kort aangeduid
    als de handhavingsrichtlijn, een nieuwe wet vast te stellen tot regeling van de arbeidsvoorwaarden voor
    gedetacheerde werknemers in de Europese Unie ter vervanging van de Wet arbeidsvoorwaarden grensoverschrijdende
    arbeid en voorts de Wet op het algemeen verbindend en het onverbindend verklaren van bepalingen van collectieve
    arbeidsovereenkomsten aan te passen, waarbij tevens de samenwerking en wederzijdse bijstand in de handhaving
    in de Europese Unie wordt geregeld en ter bevordering van die handhaving een meldingssysteem wordt ingevoerd,
    en overtredingen van deze meldingsplicht en van informatieverplichtingen met een bestuurlijke boete worden
    gesanctioneerd;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *bevoegde instantie:* de bevoegde instantie
      in een andere lidstaat, bedoeld in artikel 2, onderdeel a, van de handhavingsrichtlijn;
        - *derde land:* een land dat geen lidstaat is;
        - *detacheringsrichtlijn:* [Richtlijn 96/71/EG](31996L0071) van het Europees Parlement en de Raad van 16 december
      1996 betreffende de terbeschikkingstelling van werknemers met het oog op het verrichten van diensten (PbEG 1997,
      L018);
        - *dienstontvanger:* de natuurlijke persoon die in Nederland zijn woonplaats of gewone verblijfplaats
      heeft of de onderneming of rechtspersoon, bedoeld in [artikel 5][ref1] onderscheidenlijk
      [artikel 6 van de Handelsregisterwet 2007][ref2], die in Nederland is gevestigd, dan wel de onderneming, die
      in Nederland werkzaam is of er werkzaamheden doet verrichten maar niet in Nederland is gevestigd, waarvoor een
      gedetacheerde werknemer of zelfstandige in het kader van transnationale dienstverrichting werkzaamheden verricht;
        - *dienstverrichter:* degene die vanuit een andere lidstaat in het kader van transnationale dienstverrichting zijn
      werknemer ter beschikking stelt om tijdelijk arbeid te verrichten in Nederland;
        - *gedetacheerde werknemer:* de werknemer die in het kader van transnationale dienstverrichting op basis van
      een arbeidsovereenkomst tijdelijk arbeid verricht in Nederland en niet gewoonlijk in of vanuit Nederland arbeid
      verricht;
        - *Handels- en samenwerkingsovereenkomst EU-VK:* Handels- en samenwerkingsovereenkomst tussen de Europese Unie en
      de Europese Gemeenschap voor Atoomenergie, enerzijds, en het Verenigd Koninkrijk van Groot-Brittannië en Noord-
      Ierland, anderzijds (PbEU 2021, L 149);
        - *handhavingsrichtlijn:* [Richtlijn 2014/67](32014L0067)/EU van het Europees Parlement en de Raad van 15 mei 2014
      inzake de handhaving van [Richtlijn 96/71/EG](31996L0071) betreffende de terbeschikkingstelling van werknemers
      met het oog op het verrichten van diensten en tot wijziging van Verordening (EU) nr. 1024/2012 betreffende de
      administratieve samenwerking via het Informatiesysteem interne markt (PbEU 2014, L159/11);
        - *IMI:* het Informatiesysteem interne markt, bedoeld in de IMI-verordening, met inbegrip van de openbare met dit
      systeem verbonden interface;
        - *IMI-verordening:* [Verordening (EU) nr. 1024/2012](32012R1024) van het Europees Parlement en de Raad van
      25 oktober 2012 betreffende de administratieve samenwerking via het Informatiesysteem interne markt en tot
      intrekking van Beschikking 2008/49/EG van de Commissie (PbEU 2012, L 316);
        - *lidstaat:* een staat binnen de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland;
        - *mobiliteitsrichtlijn:* [Richtlijn (EU) 2020/1057](32020L1057) van het Europees Parlement en de Raad van 15 juli
      2020 tot vaststelling van specifieke regels met betrekking tot [Richtlijn 96/71/EG](31996L0071) en [Richtlijn
      2014/67](32014L0067)/EU wat betreft de detachering van bestuurders in de wegvervoersector en tot wijziging van
      [Richtlijn 2006/22/EG](32006L0022) wat betreft de handhavingsvoorschriften en [Verordening (EU) nr. 1024/2012]
      (32012R1024) (PbEU 2020, L 249);
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *transnationale dienstverrichting:* 1. het voor rekening en onder toezicht en leiding van de dienstverrichter
      ter beschikking stellen van een werknemer aan de dienstontvanger om arbeid te verrichten in een andere lidstaat in
      het kader van een overeenkomst tussen de dienstverrichter en de dienstontvanger; 2. het ter beschikking stellen van
      een werknemer van een onderneming aan een vestiging van die onderneming of aan een tot hetzelfde concern behorende
      onderneming in een andere lidstaat; 3. het door de dienstverrichter tegen vergoeding ter beschikking stellen van
      een werknemer aan de dienstontvanger om onder toezicht en leiding van de dienstontvanger arbeid te verrichten op
      het grondgebied van een andere lidstaat;
        - *zelfstandige:* degene die in de uitoefening van beroep of bedrijf vanuit een andere lidstaat tijdelijk arbeid
      verricht in Nederland, maar niet in Nederland zijn woonplaats of gewone verblijfplaats heeft of niet gewoonlijk in
      of vanuit Nederland arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0038054/2023-06-01#Artikel1
