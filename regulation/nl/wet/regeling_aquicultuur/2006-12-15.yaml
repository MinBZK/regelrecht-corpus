  - number: 52a.2
    text: |-
      Producten als bedoeld in artikel 16, eerste lid, onderdelen e en f, van [richtlijn 97/78/EG](31997L0078) worden
      aangevoerd via een erkende inspectiepost.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel52a
  - number: 52a.3
    text: |-
      Tenzij met de minister anders is overeengekomen, geeft de belanghebbende bij de lading van de aanvoer als
      bedoeld in het tweede lid ten minste 24 uur voor de aankomst schriftelijk kennis aan de VWA, onder opgave van het
      vermoedelijk tijdstip van aankomst, van de hoeveelheid, van de herkomst en van de soort producten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel52a
  - number: '53.1'
    text: |-
      Indien wordt vermoed of geconstateerd dat in de partij aquicultuurproducten verwekkers van ziekten, zoönosen of
      andere aandoeningen aanwezig zijn of dat de partij afkomstig is uit een met een epidemische dierziekte besmet
      gebied, kan de minister gelasten dat de partij, voor rekening van de verzender of diens gemachtigde, dan wel de
      afnemer, in tijdelijke afzondering wordt geplaatst, indien hij de aanwezigheid van verwekkers van ziekten, zoönosen
      of andere aandoeningen vermoedt, dan wel wordt de partij, zonder vergoeding van Staatswege en:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: 53.1.a
    text: |-
      voor rekening van de verzender of diens gemachtigde, al naar gelang de minister daaromtrent heeft besloten en met
      inachtneming van diens aanwijzingen, vernietigd, of
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: 53.1.b
    text: |-
      voor rekening van de afnemer, al naar gelang de minister daaromtrent heeft besloten en met inachtneming van diens
      aanwijzingen, voor andere doeleinden gebruikt dan waarvoor ze is bestemd.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: '53.2'
    text: |-
      Indien aan de hand van de op grond van deze regeling uitgevoerde controles wordt vastgesteld dat een voor
      Nederland of een lidstaat bestemd product niet voldoet aan de op grond van deze regeling voor dat product gestelde
      voorschriften of dat een onregelmatigheid is begaan, besluit de minister in overleg met de belanghebbende bij de
      lading of zijn vertegenwoordiger:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: 53.2.a
    text: |-
      dat het product in ieder geval binnen 60 dagen nadat is geconstateerd dat niet aan de onderhavige regeling wordt
      voldaan vanuit de grensinspectiepost met hetzelfde vervoermiddel wordt teruggezonden naar een derde land indien
      veterinairrechtelijke of gezondheidsredenen zich daar niet tegen verzetten;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: 53.2.b
    text: |-
      indien terugzending als bedoeld in onderdeel a onmogelijk is of de in dat onderdeel bedoelde termijn is verstreken,
      dat de partij wordt vernietigd overeenkomstig het bepaalde in artikel 17, tweede lid, onderdeel b, van [richtlijn
      97/78/EG](31997L0078);
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: 53.2.c
    text: dat de partij voor andere doeleinden dan de menselijke consumptie wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: '53.3'
    text: |-
      Indien een partij in Nederland is gebracht zonder dat, voorzover van toepassing, die partij is onderworpen
      aan de in [artikel 46][ref1] bedoelde controles, besluit de minister dat de partij overeenkomstig het tweede
      lid, onderdeel b, wordt vernietigd of wordt teruggezonden naar een derde land indien veterinairrechtelijke of
      gezondheidsredenen zich daar niet tegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '53.4'
    text: |-
      In afwachting van de terugzending of de vernietiging van een partij als bedoeld in het eerste, tweede en derde lid
      wordt de partij onder toezicht van de ambtenaar in tijdelijke afzondering geplaatst en opgeslagen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: '53.5'
    text: |-
      Alle kosten in verband die in verband met de het tweede, derde en vierde lid, bedoelde maatregelen worden gemaakt,
      komen ten laste van de belanghebbende bij de lading.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53
  - number: 53a
    text: |-
      De [artikelen 46 tot en met 53][ref1] berusten op de [artikelen 10][ref2], [11][ref3]
      en [13 van de Gezondheids- en welzijnswet voor dieren][ref4] en op [artikel 2][ref5] en
