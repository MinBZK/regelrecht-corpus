  - number: 53b
    text: De minister is de bevoegde autoriteit, bedoeld in artikel 10 van [verordening 136/2004/EG](32004R0136).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel53b
  - number: '54'
    text: |-
      Voor de toepassing van dit hoofdstuk is de begripsomschrijving ‘handelaar’ zoals bepaald in [artikel 39][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel39
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '39'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '55'
    text: |-
      Het vervoeren van een in Nederland verzamelde partij aquicultuurdieren van enige plaats in Nederland naar het
      grondgebied van en bestemd voor een Lid-Staat is verboden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel55
  - number: '56.1'
    text: |-
      Van het verbod, bedoeld in [artikel 55][ref1], wordt vrijstelling verleend mits de aquicultuurdieren geen dieren
      zijn als bedoeld in artikel 3, tweede lid, van [richtlijn 90/425/EEG](31990L0425) en mits het geen vervoer met
      bestemming Finland betreft van vissen die zijn bestemd voor de teelt of het weer uitzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel55
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '55'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: '56.2'
    text: |-
      Ten aanzien van de aquicultuurdieren dient voorts te zijn voldaan aan het bepaalde in de
      [artikelen 2, eerste lid][ref1], [3][ref2] en [4][ref3] en, indien de aquicultuurdieren zijn bestemd voor
      Zweden, in afwachting van de met betrekking tot IPN, BKD, furunculose, ERM-Yersiniose gestelde algemene of
      beperkte aanvullende garanties, bedoeld in artikel 12, tweede lid, van [richtlijn 91/67/EEG](31991L0067), en de
      met betrekking tot voorjaarsviremie bij karpers gestelde algemene of beperkte aanvullende garanties, bedoeld in
      artikel 13, tweede lid, van [richtlijn 91/67/EEG](31991L0067), aan de voorschriften die Zweden stelt met betrekking
      tot IPN, BKD, furunculose, ERM-Yersiniose, en bij karpers de voorjaarsviremie en, voor zover zij bestemd zijn voor
      een bedrijf, gelegen in een erkend gebied of voor een erkend bedrijf, dient de partij vergezeld te gaan van de
      documenten bedoeld in de [artikelen 13][ref4], [14][ref5], [17][ref6] of [18][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0005834#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0005834#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0005834#Artikel18
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '4'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '13'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0005834
        artikel: '14'
        hoofdstuk: '5'
