        artikel: '18'
        hoofdstuk: '5'
  - number: '56.3'
    text: |-
      De partij levende gekweekte vis dient in de situatie, bedoeld in artikel 1 van beschikking 99/567/EG, tevens
      vergezeld te gaan van een uit één enkel blad bestaand origineel document dat is opgesteld overeenkomstig het model
      van bijlage I bij beschikking 99/567/EG.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel56
  - number: '56.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid met betrekking tot artikel 3, tweede lid, van [richtlijn 90/425/
      EEG](31990L0425) is het toegestaan een partij levende gekweekte vis uit te voeren indien de genoemde partij in
      de situatie, bedoeld in artikel 2 van beschikking 99/567/EG, vergezeld gaat van een uit één enkel blad bestaand
      origineel document dat is opgesteld overeenkomstig het model van bijlage II bij beschikking 99/567/EG.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel56
  - number: '57'
    text: |-
      Indien de aquicultuurdieren zijn bestemd om via het grondgebied van een Lid-Staat naar een derde land te worden
      vervoerd:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel57
  - number: 57.a
    text: |-
      blijft het vervoer van de betreffende partij, indien zijn onder douanetoezicht is geplaatst, onder dat toezicht tot
      de plaats waar het Nederlands grondgebied wordt verlaten;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel57
  - number: 57.b
    text: |-
      gaat de betreffende partij indien het punt van uitgang is gelegen in een erkend gebied of indien de ontvanger
      een erkend bedrijf is, vergezeld van de onderscheiden vervoersdocumenten, bedoeld in de [artikelen 13][ref1],
      [14][ref2], [17][ref3] of [18][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel18
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '13'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '14'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '17'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '18'
        hoofdstuk: '5'
  - number: 57.c
    text: |-
      geldt ter zake van de in onderdeel b bedoelde documenten tevens dat: - zij in de Nederlandse taal en in ten minste
      één van de talen van de Lid-Staat waar zich het punt van uitgang bevindt, zijn gesteld;
        - daarop het punt van uitgang als plaats van bestemming is vermeld;
        - daarop als ontvanger is vermeld, met naam en adres, de ontvanger bij het punt van uitgang, bedoeld in artikel 4,
      tweede gedachtenstreepje, van beschikking 93/444/EEG;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel57
  - number: 57.d
    text: |-
      gaat de partij bovendien vergezeld van veterinaire documenten of certificaten, die aan de veterinaire voorschriften
      van het derde land van bestemming voldoen, tenzij de VWA niet over die voorschriften beschikt, in welk geval op de
      documenten, bedoeld in onderdeel b, de vermelding ‘Dieren of producten voor uitvoer naar (naam van het derde land)’
      is opgenomen, waarbij de naam van het derde land van bestemming als het gedeelte tussen haakjes is ingevuld, en
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel57
  - number: 57.e
    text: |-
      indien de aquicultuurdieren niet voldoen aan de voorwaarden van [richtlijn 91/67/EEG](31991L0067) is het vervoer
      daarvan slechts toegestaan indien de minister daartoe vooraf toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel57
  - number: '58'
    text: |-
      De handelaar in aquicultuurdieren, bedoeld in deze paragraaf, dient te zijn ingeschreven in het register, bedoeld
      in [artikel 63][ref1], terwijl die inschrijving niet dient te zijn getroffen door een beslissing als bedoeld in het
      derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel63
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
  - number: '59.1'
    text: |-
      Indien een in Nederland verzamelde partij aquicultuurprodukten bestemd is om te worden vervoerd naar een Lid-Staat
      dient ten aanzien van die partij te zijn voldaan aan:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel59
  - number: 59.1.a
    text: |-
      het bepaalde in [artikel 2, tweede of derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel2
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
  - number: 59.1.b
    text: |-
      indien de aquicultuurprodukten zijn bestemd voor Zweden, in afwachting van de met betrekking tot IPN, BKD,
      furunculose, ERM-Yersiniose gestelde algemene of beperkte aanvullende garanties, bedoeld in artikel 12, tweede
      lid, van [richtlijn 91/67/EEG](31991L0067), en de met betrekking tot voorjaarsviremie bij karpers gestelde algemene
      of beperkte aanvullende garanties, bedoeld in artikel 13, tweede lid, van [richtlijn 91/67/EEG](31991L0067),
      de voorschriften die Zweden stelt met betrekking tot IPN, BKD, furunculose, ERM-Yersiniose, en bij karpers de
      voorjaarsviremie, en dient zij, voor zover zij bestemd is voor een bedrijf gelegen in een erkend gebied of voor een
      erkend bedrijf, vergezeld te gaan van de documenten, bedoeld in de [artikelen 13][ref1], [14][ref2], [17][ref3] of
      [18][ref4], met dien verstande dat het vervoer van een in Nederland verzamelde partij eieren en gameten van vissen
      bestemd voor de teelt of het weer uitzetten, naar Finland verboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel18
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '13'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '14'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '17'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '18'
        hoofdstuk: '5'
  - number: '59.2'
    text: |-
      De partij aquicultuurproducten, voor zover het eieren en gameten van levende gekweekte vis betreft, dient in de
      situatie, bedoeld in artikel 1 van beschikking 99/567/EG, vergezeld te gaan van een uit één enkel blad bestaand
      origineel document dat is opgesteld overeenkomstig het model van bijlage I bij beschikking 99/567/EG.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel59
  - number: '59.3'
    text: |-
      De partij aquicultuurproducten, voor zover het eieren en gameten van levende gekweekte vis betreft, dient in de
      situatie, bedoeld in artikel 2 van beschikking 99/567/EG, vergezeld te gaan van een uit één enkel blad bestaand
      origineel document dat is opgesteld overeenkomstig het model van bijlage II bij beschikking 99/567/EG.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel59
  - number: '59.4'
    text: |-
      Indien een in Nederland verzamelde partij aquicultuurprodukten bestemd is om te worden vervoerd naar een
      derde land, is ten aanzien van die partij [artikel 57, onderdelen a en e][ref1], en [artikel 63][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel63
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '57'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
  - number: '60.1'
    text: Documenten als bedoeld in deze regeling, worden afgegeven door de minister.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel60
  - number: '60.2'
    text: |-
      Een document wordt niet afgegeven indien voor de partij de gezondheidsverklaring, vermeld op het document, niet
      kan worden gegeven dan wel indien de zending niet voldoet aan aanvullende eisen die op de plaats van bestemming in
      overeenstemming met het bepaalde in de richtlijn dan wel in andere regelgeving van de Europese Gemeenschappen ter
      voorkoming of bestrijding van dierziekten, zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel60
  - number: '60.3'
    text: |-
      Documenten als bedoeld in het eerste lid, worden gesteld in de officiële taal of officiële talen van de plaats van
      bestemming. Zij worden ten hoogste 48 uur voor lading afgegeven en zijn ten hoogste tien dagen geldig. Zij kunnen
      slechts betrekking hebben op één geadresseerde.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel60
  - number: '61.1'
    text: |-
      Een partij aquicultuurdieren of aquicultuurprodukten dient te zijn geïdentificeerd zodat het bedrijf van oorsprong
      of tijdelijk verblijf kan worden opgespoord en kan worden nagegaan of de dieren of produkten en de inlichtingen op
      een in voorkomend geval bijgaand document of certificaat, bedoeld in deze regeling, met elkaar in overeenstemming
      zijn. De betreffende gegevens dienen rechtstreeks op de verpakking of op een etiket dat aan de verpakking is
      bevestigd, dan wel op de vervoersdocumenten te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel61
  - number: '61.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt tot het moment dat de partij de plaats van bestemming heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel61
  - number: '61.3'
    text: |-
      In het geval van vervoer naar meer dan één bestemming moeten er van de aquicultuurdieren of aquicultuurprodukten
      evenveel partijen worden gemaakt als er bestemmingen zijn. Elke partij moet geïdentificeerd zijn als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel61
  - number: '62'
    text: |-
      Ondernemers, handelaren als bedoeld in de [artikelen 20][ref1], [39][ref2] en [54][ref3], degenen die
      aquicultuurproducten bewerken alsmede degenen die aquicultuurdieren of aquicultuurproducten vervoeren of anderszins
      bedrijfsmatig onder zich hebben met het oog op het in de handel brengen daarvan, zijn verplicht toe te staan dat
      een ambtenaar ten behoeve van de uitvoering van deze regeling, de door hem noodzakelijk geachte werkzaamheden en
      controles verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel54
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '20'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '39'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '63.1'
    text: |-
      De Minister houdt een register van ondernemers of handelaren als bedoeld in de [artikelen 20][ref1], [39][ref2] en
      [54][ref3], bij, tenzij hij een door een andere instantie beheerd register als zodanig heeft aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel54
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '20'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '39'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '54'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '63.2'
    text: |-
      Een ondernemer of handelaar als bedoeld in het eerste lid, die is ingeschreven in het in het eerste lid bedoelde
      register moet:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
  - number: 63.2.a
    text: |-
      een administratie voeren waarin ten minste de leveringen dan wel afleveringen van aquicultuurdieren of
      aquicultuurproducten, voor zover deze bestemd zijn voor invoer in Nederland dan wel voor doorvoer of uitvoer
      naar een Lid-Staat of een derde land, en de verdere bestemming van de partijen, zijn vermeld en waarin alle op de
      betrokken partijen betrekking hebbende bescheiden zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
  - number: 63.2.b
    text: de vorenbedoelde administratie ten minste drie jaren bewaren;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
  - number: 63.2.c
    text: |-
      ervoor zorg te dragen dat elke partij aquicultuurdieren of aquicultuurproducten vergezeld gaat van de
      voorgeschreven documenten;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
  - number: 63.2.d
    text: |-
      nalatigheden en onregelmatigheden met betrekking tot een levering dan wel aflevering van aquicultuurdieren of
      aquicultuurproducten, afkomstig uit een Lid-Staat en bestemd om in Nederland te worden ingevoerd dan wel naar een
      Lid-Staat of een derde land te worden doorgevoerd, onmiddellijk melden aan de VWA en deze aquicultuurdieren of
      aquicultuurproducten in afzondering houden totdat door de minister, zodanig na onderzoek, is beslist;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
  - number: 63.2.e
    text: |-
      aan de ambtenaar en hen, die namens hem optreden, alle medewerking verlenen en alle inlichtingen verstrekken, die
      voor de in onderdeel d bedoelde beslissing noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
  - number: '63.3'
    text: |-
      Indien een handelaar als bedoeld in het eerste lid, zich niet aan de in het tweede lid bedoelde voorschriften
      houdt, kan de Minister beslissen dat zijn inschrijving in het in het eerste lid bedoelde register wordt doorgehaald
      dan wel niet wordt erkend.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel63
  - number: '64.1'
    text: |-
      Een wijziging van een of meer onderdelen van de in [artikel 1][ref1] genoemde richtlijnen treedt voor de toepassing
      van de artikelen uit deze regeling, waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag
      waarop aan de betreffende wijzigingsrichtlijnen uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel1
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '1'
        hoofdstuk: '1'
  - number: '64.2'
    text: De minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel64
  - number: '65.1'
    text: Deze regeling treedt in werking met ingang van 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel65
  - number: '65.2'
    text: Deze regeling kan worden aangehaald als ‘Regeling aquicultuur’.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel65
