preamble:
  text: |-
    Gelet op richtlijn 91/67/EEG van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake
    veterinairrechtelijke voorschriften voor het in de handel brengen van aquicultuurdieren en aquicultuurprodukten
    (PbEG L 46), richtlijn 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake
    veterinaire controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van
    de interne markt (PbEG L 395/13), richtlijn 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni
    1990 inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende
    dieren en produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224/29), richtlijn
    90/675/EEG van de Raad van de Europese Gemeenschappen van 10 december 1990 tot vaststelling van de beginselen
    voor de organisatie van de veterinaire controles voor produkten uit derde landen die in de Gemeenschap worden
    binnengebracht (PbEG L 373), richtlijn 91/496/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot
    vaststelling van de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen die
    in de Gemeenschap worden binnengebracht (Pb EG L 268/56), beschikking 92/571/EEG van de Commissie van de Europese
    Gemeenschappen van 15 december 1992 inzake nieuwe overgangsmaatregelen om de overgang naar de bij richtlijn
    90/675/EEG van de Raad van de Europese Gemeenschappen vastgestelde regeling inzake veterinaire controles te
    vergemakkelijken (PbEG L 367), op artikel 2b van de Visserijwet 1963 (Stb. 312)1Laatstelijk gewijzigd bij Wet
    van 25 oktober 1989, Stb. 490. en artikel 3 van het Reglement zee- en kustvisserij 1977 (Stb. 666)2Laatstelijk
    gewijzigd bij besluit van 15 mei 1991, Stb. 343.;

    Gehoord het Produktschap voor Vis en Visprodukten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              a
              VWA:

                Voedsel en Waren Autoriteit;



              b
              ambtenaar:

                ambtenaar als bedoeld in [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1];



              c
              officiële dierenarts:

                door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;



              d

                [richtlijn 91/67/EEG](31991L0067):

                Richtlijn van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het in de handel brengen van aquicultuurdieren en aquicultuurprodukten (PbEG L 46/1);



              e

                [richtlijn 89/662/EEG](31989L0662):

                Richtlijn van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire controles
      in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt (PbEG
      L 395/13);



              f

                [richtlijn 90/425/EEG](31990L0425):

                Richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire en zoötechnische
      controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en produkten in het vooruitzicht van
      de totstandbrenging van de interne markt (PbEG L 224/29);



              g

                [richtlijn 97/78/EG](31997L0078):

                [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot
      vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen
      in de Gemeenschap worden binnengebracht;.



              h

                [richtlijn 91/496/EEG](31991L0496):

                Richtlijn van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling van de beginselen
      voor de organisatie van de veterinaire controles voor dieren uit derde landen die in de Gemeenschap worden
      binnengebracht en tot wijziging van de [Richtlijnen 89/662/EEG](31989L0662), [90/425/EEG](31990L0425) en [90/675/
      EEG](31990L0675) (PbEG L [268/56](32168L0056));



              i

                [verordening 136/2004/EG](32004R0136):

                [verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de Europese Gemeenschappen van 22
      januari 2004 tot vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de
      Gemeenschap bij het binnenbrengen van producten uit derde landen (PbEU 21);



              j

                [verordening 282/2004/EG](32004R0282):

                [Verordening (EG) nr. 282/2004](32004R0282) van de Commissie van de Europese Gemeenschappen van 18
      februari 2004 betreffende de vaststelling van een document voor de aangifte en de veterinaire controle van uit
      derde landen afkomstige dieren die in de Gemeenschap worden binnengebracht (PbEU L 49);



              k






              l

                [richtlijn 93/53/EEG](31993L0053):

                Richtlijn van de Raad van de Europese Gemeenschappen van 24 juni 1993 tot vaststelling van minimale
      communautaire maatregelen voor de bestrijding van bepaalde visziekten (PbEG L 175);



              m
              beschikking 93/444/EEG:

                Beschikking van de Commissie van de Europese Gemeenschappen van 2 juli 1993 houdende
      toepassingsbepalingen inzake het intracommunautaire handelsverkeer van bepaalde levende dieren en produkten die
      bestemd zijn voor uitvoer naar derde landen (PbEG L 208);



              n






              o






              p

                [richtlijn 96/22/EG](31996L0022):

                [richtlijn (EG) nr. 96/22](31996L0022) van de Raad van de Europese Gemeenschappen van 29 april 1996
      betreffende het gebruik, in de veehouderij, van bepaalde stoffen met thyreostatische werking, alsmede van ß-
      agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en [88/299/EEG]
      (31988L0299) (PbEG L 125);



              q

                [richtlijn 98/45/EG](31998L0045):

                Richtlijn van de Raad van de Europese Gemeenschappen van 24 juni 1998 houdende wijziging van
      [richtlijn 91/67/EEG](31991L0067) inzake veterinairrechtelijke voorschriften voor het in de handel brengen van
      aquicultuurdieren en aquicultuurproducten (PbEG L 189);



              r
              beschikking 99/567/EG:

                Beschikking van de Commissie van de Europese Gemeenschappen van 27 juli 1999 tot vaststelling van het
      model van het in artikel 16, lid 1, van [Richtlijn 91/67/EEG](31991L0067) van de Raad bedoelde certificaat (PbEG
      L 216);



              s
              aquicultuurdieren:

                aquicultuurdieren als bedoeld in artikel 2, onderdeel 1, van [richtlijn 91/67/EEG](31991L0067);



              t
              aquicultuurprodukten:

                aquicultuurprodukten als bedoeld in artikel 2, onderdeel 2, van [richtlijn 91/67/EEG](31991L0067);



              u
              bedrijf:

                bedrijf als bedoeld in artikel 2, onderdeel 4, van [richtlijn 91/67/EEG](31991L0067);



              v
              erkend bedrijf:

                bedrijf dat krachtens artikel 6 van [richtlijn 91/67/EEG](31991L0067) als zodanig is aangemerkt;



              w
              erkend gebied:

                gebied dat krachtens artikel 5 van [richtlijn 91/67/EEG](31991L0067) als zodanig is aangemerkt;



              x
              erkend laboratorium:

                een door de minister aangewezen laboratorium;



              y
              erkende inspectiepost:

                op Nederlands grondgebied gelegen inspectiepost die is aangewezen en erkend overeenkomstig het bepaalde
      in artikel 6 van [richtlijn 91/496/EEG](31991L0496) voor zover het de in- of doorvoer van aquicultuurdieren betreft
      onderscheidenlijk het bepaalde in artikel 6 van [richtlijn 97/78/EG](31997L0078) voor zover het de in-of doorvoer
      van aquicultuurprodukten betreft;



              z
              importeur:

                elke natuurlijke persoon of rechtspersoon die aquicultuurdieren of aquicultuurprodukten met het oog op de
      invoer of doorvoer bij een erkende inspectiepost ten onderzoek aanbiedt dan wel zijn gemachtigde;



              aa
              Lid-Staat:

                land, niet zijnde Nederland, dat lid is van de Europese Gemeenschappen;



              bb
              derde land:

                land, niet zijnde Nederland en niet zijnde een Lid-Staat;



              cc
              partij aquicultuurdieren:

                hoeveelheid aquicultuurdieren van dezelfde soort die met een zelfde vervoermiddel wordt vervoerd en
      afkomstig is uit een zelfde land;



              dd
              partij aquicultuurprodukten:

                hoeveelheid aquicultuurprodukten van dezelfde soort die met een zelfde vervoermiddel wordt vervoerd en
      afkomstig is uit een zelfde land;



              ee
              ondernemer:

                de eigenaar van een bedrijf;



              ff
              doorvoer:

                vervoer over Nederlands grondgebied van een partij afkomstig uit een Lid-Staat of een derde land, naar
      een Lid-Staat of derde land;



              gg
              in de handel brengen:

                voorhanden en in voorraad hebben met het oog op verkoop, te koop aanbieden, vervreemden, afleveren of
      iedere andere vorm van in de handel brengen in Nederland en in een Lid-Staat, met uitzondering van de verkoop in
      de detailhandel;



              hh
              punt van uitgang:

                douanekantoor van uitgang, of een in een andere Lid-Staat gelegen plaats als bedoeld in
      [artikel 1, tweede lid, onderdeel a][ref2], van beschikking 93/444/EEG, van waaruit de betrokken partij
      aquicultuurdieren of aquicultuurprodukten rechtstreeks naar het derde land van bestemming worden doorgevoerd;



              ii
              douane-entrepot:

                opslagruimte als bedoeld in [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 (PbEG L 302);



              jj
              ruimte voor tijdelijke opslag:

                opslagruimte als bedoeld in artikel 185 van [Verordening (EEG) nr. 2454/93](31993R2454) van de Commissie
      van de Europese Gemeenschappen van 2 juli 1993 (PbEG L 253);



              kk
              vrij entrepot:

                opslagruimte als bedoeld in [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 (PbEG L 302);



              ll
              belanghebbende bij de lading:

                belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e, van [richtlijn 97/78/
      EG](31997L0078)..


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel1
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '1'
        hoofdstuk: '1'
  - number: '1.2'
    text: 'In deze regeling wordt onder ‘uitzetten’ mede begrepen: verwateren.'
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van [hoofdstuk 2][ref1] wordt onder ‘inspecteur’ mede verstaan degene die namens de inspecteur-
      districtshoofd van de Veterinaire Dienst onder diens gezag en verantwoordelijkheid optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005834
        hoofdstuk: '2'
  - number: '2.1'
    text: 'Het is verboden aquicultuurdieren in de handel te brengen die:'
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel2
  - number: 2.1.a
    text: op de dag van lading enig klinisch symptoom van ziekte vertonen;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel2
  - number: 2.1.b
    text: |-
      bestemd zijn om in het kader van een nationaal programma voor uitroeiing van een in bijlage A van [richtlijn 91/67/
      EEG](31991L0067) genoemde ziekte te worden vernietigd of gedood;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel2
  - number: 2.1.c
    text: |-
      afkomstig zijn van een bedrijf waarvoor een veterinairrechtelijkverbod geldt of in contact zijn geweest met
      dieren van dergelijke bedrijven, en met name van een bedrijf waarvoor de in het kader van [richtlijn 93/53/EEG]
      (31993L0053) bedoelde bestrijdingsmaatregelen gelden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden aquicultuurprodukten voor kweekdoeleinden, met name eieren en gameten, in de handel te brengen voor
      zover deze afkomstig zijn van dieren bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden aquicultuurprodukten die bestemd zijn voor consumptie in de handel te brengen tenzij deze produkten
      afkomstig zijn van dieren die op de dag van lading geen enkel klinisch symptoom van ziekte vertonen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel2
  - number: '2.4'
    text: |-
      Het verbod, bedoeld in het eerste lid, onderdeel c, is niet van toepassing op de situatie, bedoeld in
      [artikel 2][ref1] van beschikking 99/567/EG, indien de partij levend gekweekte vis, dan wel de eieren of gameten
      daarvan, vergezeld gaan van een uit één enkel blad bestaand origineel document dat is opgesteld overeenkomstig het
      model van bijlage II bij beschikking 99/567/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel2
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      Aquicultuurdieren dienen vanaf een bedrijf of vanaf de plaats waar zij voor het eerst zijn opgevist, zo snel
      mogelijk naar de plaats van bestemming te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel3
  - number: '3.2'
    text: |-
      Het is verboden aquicultuurdieren naar de plaats van bestemming te vervoeren in vervoermiddelen die niet vooraf
      zijn gereinigd en, voor zover nodig, zijn ontsmet met een door de minister aangewezen ontsmettingsmiddel.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel3
  - number: '4.1'
    text: |-
      Voor zover het vervoer van aquicultuurdieren over land in water geschiedt, dienen de voertuigen zo te zijn
      ingericht dat tijdens het transport geen water uit het voertuig kan wegvloeien of kan worden gemorst.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel4
  - number: '4.2'
    text: |-
      Tijdens vervoer als bedoeld in het eerste lid, moet de gezondheidstoestand van de aquicultuurdieren doelmatig
      worden beschermd, met name door het water waarin zij worden vervoerd, te verversen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden water waarin aquicultuurdieren over land worden vervoerd, te verversen op andere plaatsen dan die
      door de minister daartoe zijn aangewezen met in achtneming van het bepaalde in bijlage D van [richtlijn 91/67/
      EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel4
  - number: '5.1'
    text: |-
      De minister kan, al dan niet op verzoek van de betrokken ondernemers, bij de Commissie van de Europese
      Gemeenschappen een gebied, als bedoeld in bijlage B, onder I.A, II.A of III.A van [richtlijn 91/97/EEG]
      (31991L0097), in aanmerking brengen voor erkenning door die Commissie als is voldaan aan de vereisten, bedoeld in
      bijlage B, onder I.B, II.B of III.B van [richtlijn 91/67/EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel5
  - number: '5.2'
    text: |-
      De minister geeft slechts toepassing aan het bepaalde in het eerste lid, indien de betrokken ondernemers zich
      schriftelijk jegens de minister bereid hebben verklaard hun bedrijven, voorzover gelegen in het betreffende gebied,
      onder toezicht te stellen van ambtenaren tegen de daaraan verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel5
  - number: '6.1'
    text: |-
      Indien het gebied, bedoeld in [artikel 5][ref1], door de Commissie van de Europese Gemeenschappen is geplaatst op
      de lijst van erkende gebieden, bedoeld in artikel 5, derde lid, van [richtlijn 91/67/EEG](31991L0067), gelden voor
      de ondernemers in dat gebied de volgende verplichtingen:


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel5
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '5'
        hoofdstuk: '3'
  - number: 6.1.a
    text: |-
      zij dienen medewerking te verlenen aan gezondheidscontroles, als bedoeld in bijlage B van [richtlijn 91/67/EEG]
      (31991L0067), in hun bedrijf;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel6
  - number: 6.1.b
    text: |-
      zij dienen een register bij te houden waarin alle gegevens dienen te worden vermeld die van belang zijn om de
      gezondheidstoestand van de vis permanent te kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel6
  - number: '6.2'
    text: |-
      Het is verboden in een erkend gebied aquicultuurdieren die vatbaar zijn voor de ziekten, bedoeld in bijlage A,
      kolom 1, lijst II, van [richtlijn 91/67/EEG](31991L0067), uit te zetten tenzij die dieren uit een ander erkend
      gebied of uit een erkend bedrijf afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel6
  - number: '6.3'
    text: |-
      De minister kan omtrent de opbouw van het register, bedoeld in het eerste lid, onderdeel b, alsmede omtrent de
      eisen waaraan dit register dient te voldoen en de wijze waarop stukken daarin dienen te worden bewaard dan wel
      gegevens dienen te worden gerangschikt, regels stellen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel6
  - number: '7.1'
    text: 'De minister schorst de erkenning van een gebied als erkend gebied of trekt deze erkenning in indien:'
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel7
  - number: 7.1.a
    text: |-
      door een ondernemer in dat gebied niet is voldaan aan het bepaalde in [artikel 6, eerste lid][ref1], dan wel is
      gehandeld in strijd met het verbod, gesteld in [artikel 6, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel6
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.1.b
    text: |-
      het onderzoek door een erkend laboratorium op de bij de gezondheidscontroles genomen monsters aquicultuurdieren
      of aquicultuurprodukten geen negatief resultaat heeft gegeven ten aanzien van het voorkomen van verwekkers van in
      bijlage A, kolom 1, lijst II, van [richtlijn 91/67/EEG](31991L0067) vermelde ziekten;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel7
  - number: 7.1.c
    text: |-
      door een ondernemer in het gebied anderszins is gehandeld in strijd met het bepaalde in deze regeling of [richtlijn
      91/67/EEG](31991L0067), voor zover daardoor de erkenning van het gebied in gevaar kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel7
  - number: '7.2'
    text: |-
      De schorsing of intrekking, bedoeld in het eerste lid, kan betrekking hebben op een gedeelte van een erkend gebied,
      voorzover daarbij het bepaalde in bijlage B, onder I.D, II.D of III.D van [richtlijn 91/67/EEG](31991L0067) in acht
      wordt genomen en het gedeelte van het gebied waarvoor de erkenning wordt gehandhaafd, voldoet aan de omschrijving,
      bedoeld in bijlage B, onder I.A, II.A of III.A van [richtlijn 91/67/EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel7
  - number: '8.1'
    text: |-
      De ondernemer, handelaar of dierenarts doet onverwijld aangifte bij de VWA van iedere abnormale sterfte of van
      ieder ander symptoom dat doet vermoeden dat aquicultuurdieren of aquicultuurproducten één van de in bijlage A,
      kolom 1, lijst II, van [richtlijn 91/67/EEG](31991L0067) vermelde ziekten hebben.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd het bepaalde in [artikel 7][ref1] schorst de minister onmiddellijk na ontvangst van een mededeling
      bedoeld in het eerste lid, de erkenning van het gebied dan wel overeenkomstig het bepaalde in bijlage B, onder I.D,
      II.D of III.D van [richtlijn 91/67/EEG](31991L0067) een gedeelte daarvan, voorzover het gedeelte van het gebied
      waarvoor de erkenning wordt gehandhaafd, voldoet aan de omschrijving, bedoeld in bijlage B, onder I.A, II.A of
      III.A van [richtlijn 91/67/EEG](31991L0067).


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel7
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '7'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      De minister heft de schorsing van de erkenning van een erkend gebied dan wel van een deel van een gebied op,
      indien: '- een erkend laboratorium aanwezigheid van ziekteverwekkers als bedoeld in bijlage A, kolom 1, lijst II,'
      uit het gebied dan wel gedeelte daarvan niet heeft kunnen vaststellen;
        - de besmettingshaard overeenkomstig het bepaalde in bijlage B, onder I.D., II.D. of III.D. van [richtlijn 91/67/
      EEG](31991L0067) is uitgeroeid en het gebied dan wel gedeelte daarvan weer voldoet aan de vereisten, bedoeld in
      bijlage B, onder I.B., II.B. of III.B. van [richtlijn 91/67/EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel9
  - number: '10.1'
    text: |-
      Een ondernemer kan de minister verzoeken om zijn bedrijf, voor zover niet gelegen in een erkend gebied, in
      aanmerking te brengen voor erkenning door de Commissie van de Europese Gemeenschappen als erkend bedrijf.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel10
  - number: '10.2'
    text: |-
      De ondernemer verklaart zich bij dit verzoek tevens bereid zijn bedrijf onder toezicht te stellen van ambtenaren
      tegen de daaraan verbonden kosten en, in voorkomend geval, medewerking te verlenen aan de door deze ambtenaren ten
      aanzien van zijn bedrijf nodig geachte maatregelen ter voorkoming van het binnenbrengen van ziekten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel10
  - number: '11'
    text: |-
      De minister brengt een bedrijf bij de Commissie van de Europese Gemeenschappen in aanmerking voor erkenning door
      die Commissie als is voldaan aan de vereisten, bedoeld in bijlage C, onder I.A., II.A of III.A, van [richtlijn
      91/67/EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel11
  - number: '12'
    text: |-
      Het bepaalde in de [artikelen 6 tot en met 9][ref1] is van overeenkomstige toepassing ten aanzien van erkende
      bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel6
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '6'
        hoofdstuk: '3'
  - number: 12a.1
    text: |-
      Een eigenaar van een invoercentrum kan bij de minister een aanvraag indienen tot erkenning van zijn invoercentrum.
      De eigenaar verklaart zich bij de aanvraag bereid zijn invoercentrum onder toezicht te stellen van ambtenaren tegen
      de daaraan verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel12a
  - number: '13'
    text: |-
      Het is verboden levende vis, met uitzondering van weekdieren, van voor ziekte vatbare soorten vermeld in bijlage
      A, kolom 2, lijst II, van [richtlijn 91/67/EEG](31991L0067), als ook eieren of gameten daarvan, in de handel te
      brengen, zonder dat de betreffende zending van deze dieren vergezeld gaat van een vervoerdocument, bedoeld in
      artikel 7, eerste lid, van [richtlijn 91/67/EEG](31991L0067), voor zover de betreffende vis, eieren of gameten
      bestemd zijn om te worden binnengebracht in een erkend gebied of bij een erkend bedrijf dat voldoet aan de
      voorwaarden van bijlage C, punt I, van die richtlijn, ten einde daar te worden uitgezet.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel13
  - number: '14'
    text: |-
      Het is verboden levende weekdieren, bedoeld in bijlage A, kolom 2, lijst II, van [richtlijn 91/67/EEG](31991L0067),
      in de handel te brengen in strijd met het bepaalde in artikel 8, eerste lid, van [richtlijn 91/67/EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel14
  - number: '15.1'
    text: |-
      Het is verboden een partij aquicultuurdieren, met uitzondering van weekdieren, vatbaar voor de in bijlage A, kolom
      1, lijst II, van [richtlijn 91/67/EEG](31991L0067) vermelde ziekten, voor zover deze bestemd zijn voor menselijke
      consumptie, afkomstig uit een niet erkend gebied, in een erkend gebied in de handel te brengen, behoudens voor
      zover de dieren voor verzending zijn gedood en van de ingewanden ontdaan.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel15
  - number: '15.2'
    text: |-
      Het bepaalde in het eerste lid geldt niet indien de aquicultuurdieren afkomstig zijn van een erkend bedrijf,
      gelegen in een niet erkend gebied.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel15
  - number: '16'
    text: |-
      Het is verboden levende weekdieren die vatbaar zijn voor de in bijlage A, kolom 1, lijst II, van [richtlijn 91/67/
      EEG](31991L0067) vermelde ziekten, voor zover zij afkomstig zijn uit een niet erkend gebied, in een erkend gebied
      af te leveren anders dan voor rechtstreekse menselijke consumptie of voor de conservenindustrie. Zij mogen niet
      opnieuw worden uitgezet, behalve in de gevallen, bedoeld in artikel 9, onderdeel 2, van [richtlijn 91/67/EEG]
      (31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel16
  - number: '17'
    text: |-
      Voor zover zij bestemd zijn om te worden binnengebracht in een erkend gebied teneinde in dat gebied te worden
      uitgezet of in een bedrijf dat voldoet aan de eisen van bijlage C van [richtlijn 91/67/EEG](31991L0067), is het
      verboden levende gekweekte vissen, alsmede de eieren of gameten daarvan, en gekweekte weekdieren, die niet behoren
      tot de in bijlage A, kolom 2, lijst II, van [richtlijn 91/67/EEG](31991L0067) vermelde voor de betreffende ziekte
      vatbare soorten, in de handel te brengen zonder dat de betreffende zending vergezeld gaat van een document als
      bedoeld in artikel 14, eerste lid, van [richtlijn 91/67/EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel17
  - number: '18'
    text: |-
      Voor zover zij bestemd zijn om te worden binnengebracht in een erkend gebied of in een bedrijf dat voldoet aan de
      eisen van bijlage C van [richtlijn 91/67/EEG](31991L0067), is het verboden in het wild levende vissen, week- of
      schaaldieren, als ook eieren of gameten daarvan, in de handel te brengen, in strijd met het bepaalde in artikel 14,
      derde lid, van [richtlijn 91/67/EEG](31991L0067).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel18
  - number: 18a
    text: |-
      De [artikelen 17][ref1] en [18][ref2] zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel18
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '17'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '18'
        hoofdstuk: '5'
  - number: 18a.a
    text: |-
      aquicultuurdieren die voorkomen op de in artikel 14, vierde lid, van [richtlijn 91/67/EEG](31991L0067) bedoelde
      lijst;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel18a
  - number: 18a.b
    text: tropische siervissen die permanent in aquaria worden gehouden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel18a
  - number: '19'
    text: |-
      De verboden, bedoeld in de [artikelen 13 tot en met 18][ref1], zijn van overeenkomstige toepassing ten aanzien
      van gebieden of bedrijven waarvoor een programma als bedoeld in artikel 10, eerste lid, van [richtlijn 91/67/EEG]
      (31991L0067), is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel13
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '13'
        hoofdstuk: '5'
  - number: '20'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder ‘handelaar’ verstaan elke natuurlijke of rechtspersoon die
      aquicultuurdieren met het oog op de verhandeling onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel20
  - number: '21'
    text: De in- en doorvoer van aquicultuurdieren is verboden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel21
  - number: '22.1'
    text: |-
      Van het verbod, bedoeld in [artikel 21][ref1], wordt vrijstelling verleend ter zake van de in- en doorvoer van
      aquicultuurdieren:


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel21
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 22.1.a
    text: die zijn verzonden vanuit een Lid-Staat;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel22
  - number: 22.1.b
    text: |-
      die zijn verzonden vanuit een derde land, en via het grondgebied van een Lid-Staat in het kader van de in- of
      doorvoer op Nederlands grondgebied worden gebracht; mits, voor zover van toepassing, voldaan wordt aan het bepaalde
      in de [artikelen 23 tot en met 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel23
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde vrijstelling geldt niet ter zake van de doorvoer naar Finland van vissen, bestemd
      voor de teelt of het weer uitzetten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel22
  - number: '22.3'
    text: De in het eerste lid bedoelde vrijstelling geldt niet terzake van aquicultuurdieren afkomstig uit België.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel22
  - number: '23.1'
    text: |-
      De aquicultuurdieren mogen niet afkomstig zijn van een plaats als bedoeld in artikel 3, eerste lid, onderdeel e,
      van [richtlijn 90/425/EEG](31990L0425), tenzij toepassing wordt gegeven aan het bepaalde in artikel 10, eerste lid,
      onderdeel c, van [richtlijn 93/53/EEG](31993L0053).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel23
  - number: '23.2'
    text: |-
      Ten aanzien van de aquicultuurdieren dient voldaan te zijn aan het bepaalde in de [artikelen 2, eerste lid][ref1],
      [3][ref2] en [4][ref3] en, indien de aquicultuurdieren zijn bestemd voor Zweden, in afwachting van de met
      betrekking tot IPN, BKD, furunculose en ERM-Yersiniose gestelde algemene of beperkte aanvullende garanties, bedoeld
      in artikel 12, tweede lid, van [richtlijn 91/67/EEG](31991L0067), en de met betrekking tot voorjaarsviremie bij
      karpers gestelde algemene of beperkte aanvullende garanties, bedoeld in artikel 13, tweede lid, van [richtlijn
      91/67/EEG](31991L0067), aan de voorschriften die Zweden stelt met betrekking tot IPN, BKD, furunculose, ERM-
      Yersiniose, en bij karpers de voorjaarsviremie.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel4
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '4'
        hoofdstuk: '2'
  - number: '23.3'
    text: |-
      De partij aquicultuurdieren dient in het kader van de invoer, tot en met de ontvangst door de ontvanger, genoemd
      in de hierna bedoelde documenten, en in het kader van de doorvoer, tijdens het vervoer over Nederlands grondgebied,
      voor zover de partij is verzonden uit een derde land en via het grondgebied van een Lid-Staat in het kader
      van de in- of doorvoer op Nederlands grondgebied wordt gebracht, vergezeld te gaan van het Gemeenschappelijke
      veterinaire document van binnenkomst, bedoeld in [verordening 282/2004/EG](32004R0282), alsmede het document,
      onderscheidenlijk de documenten, bedoeld in artikel 7, eerste lid, eerste gedachtestreepje, van [richtlijn 91/496/
      EEG](31991L0496) zijn voorgeschreven, dan wel, voor zover de partij verzonden is uit een Lid-Staat en bestemd is
      voor een bedrijf gelegen in een erkend gebied of voor een erkend bedrijf, van de vervoersdocumenten bedoeld in de
      [artikelen 13][ref1], [14][ref2], [17][ref3] of [18][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel18
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '13'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '14'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '17'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '18'
        hoofdstuk: '5'
  - number: '23.4'
    text: |-
      De in het derde bedoelde documenten zijn volledig ingevuld, gedagtekend en ondertekend en voldoen, in voorkomend
      geval, aan [artikel 28, onderdelen d en e][ref1]. Voorts is de geldigheidsduur ervan niet verstreken en zijn zij in
      overeenstemming met de regelgeving van de Europese Gemeenschappen afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel28
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '28'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '23.5'
    text: |-
      De vanuit een Lid-Staat verzonden partij levende gekweekte vis dient in de situatie, bedoeld in [artikel 1][ref1]
      van beschikking 99/567/EG, in het kader van de invoer, tot en met de ontvangst door de geadresseerde, genoemd in
      het hierna bedoelde document, en in het kader van de doorvoer, tijdens het vervoer over Nederlands grondgebied,
      vergezeld te gaan van een uit één enkel blad bestaand origineel document dat is opgesteld overeenkomstig het model
      van bijlage 1 bij beschikking 99/567/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel1
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '1'
        hoofdstuk: '1'
  - number: '23.6'
    text: |-
      De vanuit een Lid-Staat verzonden partij levende gekweekte vis dient in de situatie, bedoeld in [artikel 2][ref1]
      van beschikking 99/567/EG, in het kader van de invoer, tot en met de ontvangst door de geadresseerde, genoemd in
      het hierna bedoelde document, en in het kader van de doorvoer, tijdens het vervoer over Nederlands grondgebied,
      vergezeld te gaan van een uit één enkel blad bestaand origineel document dat is opgesteld overeenkomstig het model
      van bijlage II bij beschikking 99/567/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel2
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
  - number: '24.1'
    text: |-
      De ontvanger van aquicultuurdieren, bedoeld in [artikel 23, derde lid][ref1], dient van elke partij
      aquicultuurdieren de aankomst tussen 08.00 uur en 17.00 uur en ten laatste op de dag, niet zijnde een zaterdag,
      zondag of een algemeen erkende feestdag, voorafgaand aan de dag van aankomst op de plaats van bestemming te melden
      of te doen melden bij de VWA. Bij die melding dient mededeling te worden gedaan van het vermoedelijke tijdstip van
      aankomst en de aard en omvang van de partij.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel23
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      De ontvanger moet de instructies opvolgen, die de ambtenaar hem of degene die namens hem is opgetreden heeft
      gegeven in verband met een controle. Desverlangd is hij verplicht de aangevoerde dieren ten onderzoek aan te
      bieden aan de ambtenaar en de in [artikel 23, derde lid][ref1], bedoelde documenten te overleggen. Bij een zodanig
      onderzoek verleent hij alle medewerking en verstrekt hij alle inlichtingen die voor het onderzoek noodzakelijk
      worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel23
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '24.3'
    text: |-
      De ontvanger van de aquicultuurdieren moet de in [artikel 23, derde lid][ref1], bedoelde documenten ten minste zes
      maanden vanaf de aanvoer van die dieren te bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel23
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '25'
    text: |-
      De vervoerder van de aquicultuurdieren moet de instructies van de ambtenaar in verband met een controle
      opvolgen. Desverlangd is hij verplicht de dieren ten onderzoek aan de ambtenaar aan te bieden en
      [artikel 23, derde lid][ref1], bedoelde documenten te overleggen. Bij een zodanig onderzoek verleent hij alle
      medewerking en verstrekt hij alle inlichtingen die voor het onderzoek noodzakelijk worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel23
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '26'
    text: |-
      De bij de invoer betrokken handelaar alsmede, indien de aquicultuurdieren bestemd zijn om naar een Lid-Staat te
      worden doorgevoerd, de bij de doorvoer betrokken handelaar, moet zijn ingeschreven in het register, bedoeld in
      [artikel 63, eerste lid][ref1], terwijl die inschrijving niet is getroffen door een beslissing als bedoeld in het
      derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel63
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
  - number: '27.1'
    text: |-
      Krachtens de regelgeving van de Europese Gemeenschappen zijn geen maatregelen genomen, houdende de instelling
      van een verbod om de aquicultuurdieren uit de betrokken Lid-Staat uit te voeren of houdende de machtiging tot de
      instelling van een verbod om de betreffende dieren in Nederland in te voeren, onderscheidenlijk in het kader van
      de doorvoer op Nederlands grondgebied te brengen, noch is de Lid-Staat van verzending ingevolge die regelgeving
      gehouden de afgifte van documenten, bedoeld in deze regeling, zulks in verband met de invoer in, onderscheidenlijk
      de doorvoer door Nederland, op te schorten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel27
  - number: '27.2'
    text: |-
      Ingevolge de regelgeving van de Lid-Staat van verzending is er geen verbod om de betrokken aquicultuurdieren op het
      grondgebied van die Lid-Staat in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel27
  - number: '28'
    text: 'Indien de aquicultuurdieren zijn verzonden vanuit een Lid-Staat en bestemd zijn voor een derde land:'
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
  - number: 28.a
    text: |-
      blijft het vervoer van de betreffende partij, indien zij onder douanetoezicht is geplaatst, onder dat toezicht tot
      de plaats waar het Nederlands grondgebied wordt verlaten;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
  - number: 28.b
    text: |-
      gaat de betreffende partij, indien het punt van uitgang is gelegen in een erkend gebied of indien de ontvanger
      een erkend bedrijf is, vergezeld van de onderscheiden vervoersdocumenten, bedoeld in de [artikelen 13][ref1],
      [14][ref2], [17][ref3] of [18][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel18
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '13'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '14'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '17'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '18'
        hoofdstuk: '5'
  - number: 28.c
    text: |-
      wordt de betreffende partij, indien de doorvoer vanuit Nederland rechtstreeks naar het derde land van bestemming
      plaatsvindt, doorgevoerd via het punt van uitgang dat op de in onderdeel b bedoelde documenten is vermeld;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
  - number: 28.d
    text: |-
      geldt ter zake van de in onderdeel b bedoelde documenten tevens dat: - zij in ten minste één van de talen van
      de Lid-Staat van oorsprong zijn gesteld en in de Nederlandse taal of, indien de partij bestemd is om te worden
      doorgevoerd via een andere Lid-Staat, tevens in één van de talen van de Lid-Staat waar zich het punt van uitgang
      bevindt;
        - daarop het punt van uitgang als plaats van bestemming is vermeld;
        - daarop als ontvanger is vermeld, met naam en adres, de handelaar, bedoeld in onderdeel e, dan wel, ingeval de
      partij bestemd is om te worden doorgevoerd via een andere Lid-Staat, de ontvanger bij het punt van uitgang, bedoeld
      in artikel 4, tweede gedachtenstreepje, van beschikking 93/444/EEG;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
  - number: 28.e
    text: |-
      gaat de partij bovendien vergezeld van veterinaire documenten of certificaten die aan de veterinaire voorschriften
      van het derde land van bestemming voldoen, tenzij op de documenten, bedoeld in onderdeel b, de vermelding ‘Dieren
      of produkten voor uitvoer naar (naam van het derde land)’ voorkomt, waarbij de naam van het derde land van
      bestemming als het gedeelte tussen haakjes is opgenomen;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
  - number: 28.f
    text: |-
      zijn de [artikelen 26][ref1] en [63][ref2] van overeenkomstige toepassing ten aanzien van de handelaar die in
      Nederland bij het punt van uitgang bij de doorvoer van de partij betrokken is, en


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel63
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
  - number: 28.g
    text: |-
      vindt het vervoer van de partij, indien deze niet aan de voorschriften van [richtlijn 91/67/EEG](31991L0067)
      voldoet, slechts plaats indien de minister daartoe vooraf toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel28
  - number: '29.1'
    text: |-
      Indien bij het onderzoek, bedoeld in [artikel 24, tweede lid][ref1], en [artikel 63, tweede lid][ref2], of bij een
      controle tijdens het vervoer in het kader van de in- of doorvoer, wordt vermoed of geconstateerd dat er verwekkers
      van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel 8, eerste lid, onderdeel a, van [richtlijn 90/425/
      EEG](31990L0425), aanwezig zijn of dat aquicultuurdieren afkomstig zijn uit een met een epidemische dierziekte
      besmet gebied, moeten de daarbij betrokken aquicultuurdieren in afzondering worden geplaatst of worden gedood of
      vernietigd, al naar gelang de minister daaromtrent heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel63
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
  - number: '29.2'
    text: |-
      Indien bij een controle of onderzoek als bedoeld in het eerste lid, wordt vermoed of geconstateerd dat niet
      is voldaan aan de overige voorschriften van deze regeling dan wel aan de van toepassing zijnde communautaire
      voorschriften, kan de minister, indien hij vermoedt dat niet is voldaan aan vorenbedoelde voorschriften, gelasten
      dat de aquicultuurdieren in tijdelijke afzondering worden geplaatst, dan wel wordt één van de maatregelen,
      bedoeld in artikel 8, eerste lid, onderdeel b, van [richtlijn 90/425/EEG](31990L0425) uitgevoerd, al naar gelang
      de minister daaromtrent, overeenkomstig de keuze van de afzender of diens gemachtigde en mits zulks mogelijk
      is op grond van veterinairrechtelijke voorschriften, heeft besloten. Deze maatregelen kunnen tevens door de
      minister worden genomen in het in [artikel 28][ref1] bedoelde geval, indien zich tijdens het vervoer andere
      onregelmatigheden voordoen dan als bedoeld in de eerste volzin, of indien het derde land van bestemming de
      aquicultuurdieren weigert, mits voor Nederland de waarborgen gelden bedoeld in [artikel 2, tweede lid][ref2], van
      beschikking 93/444/EEG.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel2
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '28'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
  - number: '29.3'
    text: |-
      Een besluit als bedoeld in het eerste of tweede lid, wordt ter kennis gebracht van de afzender of diens gemachtigde
      met vermelding van de redenen. Desgevraagd geschiedt die kennisgeving schriftelijk met vermelding van de datum en
      het uur, waarop het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel29
  - number: '29.4'
    text: |-
      Een besluit als bedoeld in het eerste of het tweede lid, laat onverlet het recht van de afzender van de
      aquicultuurdieren om, overeenkomstig het bepaalde in [artikel 9, tweede lid][ref1], vierde alinea, van [richtlijn
      90/425/EEG](31990L0425), het advies van een veterinair deskundige in te winnen, met dien verstande dat de minister
      te allen tijde kan beslissen om de maatregelen, bedoeld in het eerste lid, onmiddellijk uit te voeren, indien zulks
      noodzakelijk is om redenen van gezondsheidsbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel9
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '9'
        hoofdstuk: '3'
  - number: '29.5'
    text: |-
      De kosten, die uit het eerste of tweede lid bedoelde maatregelen voortvloeien, komen voor rekening van de afzender
      of diens gemachtigde dan wel van degene die met de zorg voor de betrokken aquicultuurdieren is belast.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel29
  - number: '30.1'
    text: |-
      Van het verbod, bedoeld in [artikel 21][ref1], wordt vrijstelling verleend ter zake van de invoer van
      aquicultuurdieren, die daarbij voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht
      en die zijn verzonden vanuit een derde land of een deel van een derde land, mits, voor zover van toepassing,
      is voldaan aan de bij of krachtens de artikelen 19, 20 en 21 van [richtlijn 91/67/EEG](31991L0067) gestelde
      voorschriften, aan [verordening 282/2004/EG](32004R0282) en aan de [artikelen 31][ref2], [32][ref3] en
      [35 tot en met 38][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel35
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '30.2'
    text: |-
      Van het verbod, bedoeld in [artikel 21][ref1], wordt vrijstelling verleend ter zake van de doorvoer van
      aquicultuurdieren:


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel21
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 30.2.a
    text: |-
      die zijn verzonden vanuit een derde land en via Nederland voor het eerste op het grondgebied van de Europese
      Gemeenschappen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel30
  - number: 30.2.b
    text: waarvan de eerst volgende bestemming blijkens de bij de partij behorende documenten een derde land is;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel30
  - number: 30.2.c
    text: |-
      die zijn aangevoerd met een vliegtuig, onderscheidenlijk een schip en met een vliegtuig, onderscheidenlijk een
      schip het Nederlandse grondgebied rechtstreeks via dezelfde luchthaven, onderscheidenlijk haven van aanvoer weer
      verlaten, en
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel30
  - number: 30.2.d
    text: |-
      die tussentijds niet in contact komen met andere partijen aquicultuurdieren of aquicultuurproducten en, indien
      zij tussentijds het transportmiddel verlaten, het daartoe door de minister aangewezen terrein niet verlaten, mits
      de zodanige doorvoer tijdig bij de VWA is gemeld en de door de minister gegeven instructies worden opgevolgd en
      voorts, voor zover van toepassing, voldaan is aan [verordening 282/2004/EG](32004R0282) en de [artikelen 31][ref1],
      [32][ref2], [35][ref3] en [38][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel38
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '38'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '30.3'
    text: |-
      Voorts wordt vrijstelling verleend van het verbod, bedoeld in [artikel 21][ref1], ter zake van de doorvoer van
      aquicultuurdieren die via Nederland voor het eerst op het grondgebied van de Europese Gemeenschappen worden
      gebracht en zijn verzonden uit een derde land of een deel van een derde land, dat is vermeld op de krachtens
      artikel 19, eerste lid, van de [richtlijn 91/67/EEG](31991L0067) opgestelde lijst of die, zolang die lijst niet
      is vastgesteld, zijn verzonden uit derde landen, mits, voor zover van toepassing, is voldaan aan [verordening
      282/2004/EG](32004R0282) en de [artikelen 31 tot en met 38][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel31
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '31.1'
    text: Elke partij aquicultuurdieren moet het Nederlands grondgebied worden binnengebracht via een erkende inspectiepost.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
  - number: '31.2'
    text: |-
      Elke binnenkomst, bedoeld in het eerste lid, wordt gemeld aan de VWA overeenkomstig artikel 1, eerste tot en met
      derde lid, van [verordening 282/2004/EG](32004R0282).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
  - number: '31.3'
    text: |-
      Elke partij aquicultuurdieren moet bij aankomst op de erkende inspectiepost ten onderzoek worden aangeboden aan de
      ambtenaar op die inspectiepost.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
  - number: '31.4'
    text: |-
      Bij het in het derde lid bedoelde onderzoek dient aan de ambtenaar te worden overgelegd een door de officiële
      dierenarts afgegeven, volledig ingevuld, gedagtekend en ondertekend origineel certificaat als bedoeld in
      artikel 21 van de [richtlijn 91/67/EEG](31991L0067): - dat in overeenstemming met de regelgeving van de Europese
      Gemeenschappen is afgegeven;
        - waaruit tevens dient te blijken dat is voldaan aan nadere voorwaarden die bij de regelgeving van de Europese
      Gemeenschappen zijn gesteld aan de invoer van aquicultuurdieren vanuit het betrokken derde land of deel van dat
      derde land en
        - waarvan de geldigheidsduur niet is verstreken, en, waaruit blijkt dat, indien de partij bestemd is voor Finland
      of Zweden, tenminste voldaan is aan de voorschriften die gelden met betrekking tot de invoer in Finland of Zweden
      van aquicultuurdieren uit Lid-Staten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
  - number: '31.5'
    text: |-
      Ten aanzien van de partij aquicultuurdieren dient voldaan te zijn aan het bepaalde in de
      [artikelen 2, eerste lid][ref1], [3][ref2] en [4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel4
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '4'
        hoofdstuk: '2'
  - number: '31.6'
    text: |-
      Een partij aquicultuurdieren afkomstig uit Nieuw-Zeeland mag in afwijking van het vierde lid vergezeld gaan van
      een op de partij betrekking hebbend gezondheidscertificaat dat ingevolge de regelgeving van de Europese Gemeenschap
      ter uitvoering van de Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-Zeeland inzake
      sanitaire maatregelen voor de handel in levende dieren en dierlijke producten (PbEG 1997, L 57) is vastgesteld,
      indien is voldaan aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
  - number: 31.6.a
    text: |-
      de desbetreffende aquicultuurdieren zijn ingevolge de vorenbedoelde overeenkomst in elk geval op het gebied van de
      diergezondheid als gelijkwaardig erkend;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
  - number: 31.6.b
    text: de partij producten voldoet aan de ingevolge vorenbedoelde regelgeving gestelde bijkomende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31
  - number: 31a.1
    text: |-
      In afwijking in zoverre van [artikel 31, tweede lid][ref1], kan de belanghebbende bij de lading de melding van de
      binnenkomst van een partij, bedoeld in [artikel 31, tweede lid][ref2], op elektronische wijze verrichten, mits de
      minister daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel31
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 31a.2
    text: |-
      De minister kan aan zijn instemming, bedoeld in het eerste lid, voorwaarden stellen en nadere voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
  - number: 31a.3
    text: 'De minister kan zijn instemming, bedoeld in het eerste lid in, intrekken, indien de belanghebbende bij de lading:'
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
  - number: 31a.3.a
    text: niet meer voldoet aan de voorwaarden, bedoeld in het tweede lid, of
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
  - number: 31a.3.b
    text: niet voldoet aan de nadere voorschriften, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
  - number: 31a.4
    text: |-
      Het melden van de aankomst, bedoeld in het eerste lid, geschiedt via een daarvoor bestemd elektronisch systeem met
      behulp van een door de minister beschikbaar gestelde toegang.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
  - number: 31a.5
    text: |-
      De minister kan een elektronische aanmelding weigeren, indien deze niet overeenkomstig
      [artikel 31, tweede lid][ref1], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 31a.6
    text: |-
      [Artikel 20a, vijfde tot en met tiende lid, van de Regeling invoer, uitvoer en verkeer van planten][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel20a
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 20a
  - number: '32'
    text: |-
      De importeur of de vervoerder van de in of door te voeren aquicultuurdieren moet de instructies van de ambtenaar,
      in verband met het onderzoek of een controle opvolgen. Daarbij verleent hij alle medewerking en verstrekt hij alle
      inlichtingen die voor het onderzoek of de controle noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel32
  - number: '33'
    text: |-
      Indien de aquicultuurdieren blijkens het in [artikel 31, vierde lid][ref1], bedoelde certificaat bestemd zijn om
      naar een Lid-Staat te worden doorgevoerd, moet de bij doorvoer betrokken handelaar zijn ingeschreven in het in
      [artikel 63][ref2] bedoelde register, terwijl die inschrijving niet is getroffen door een beslissing als bedoeld in
      het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel63
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
  - number: '34'
    text: |-
      Indien de aquicultuurdieren blijkens het in [artikel 31, vierde lid][ref1], bedoelde certificaat bestemd zijn voor
      een derde land, moet worden aangetoond dat het eerste derde land waarnaar zij worden vervoerd de verplichting op
      zich neemt de partij waarvan het de invoer of de doorvoer toestaat, in geen geval te weigeren of terug te zenden
      en, voor zover daarbij vervoer over het grondgebied van een of meer Lid-Staten zal plaatsvinden, dat door de
      bevoegde centrale autoriteit van die Lid-Staat of Lid-Staten toestemming voor dat vervoer is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '35.1'
    text: |-
      Noch krachtens artikel 18, eerste lid, eerste gedachtenstreepje, van [richtlijn 91/496/EEG](31991L0496), noch
      krachtens andere regelgeving van de Europese Gemeenschappen tot wering en bestrijding van besmettelijke dierziekten
      zijn maatregelen genomen, houdende de instelling van een verbod om de betrokken aquicultuurdieren in de Europese
      Gemeenschappen dan wel in Nederland in te voeren, onderscheidenlijk in het kader van de doorvoer op Nederlands
      grondgebied te brengen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel35
  - number: '35.2'
    text: |-
      Aan de aquicultuurdieren zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn
      96/22/EG](31996L0022) niet aan aquicultuurdieren mogen worden toegediend, tenzij aan de voorwaarden ingevolge
      [artikel 11][ref1] van genoemde richtlijn is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel11
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '11'
        hoofdstuk: '4'
  - number: '36.1'
    text: |-
      Met betrekking tot de partij aquicultuurdieren is door de minister een Gemeenschappelijk veterinair document van
      binnenkomst als bedoeld in [verordening 282/2004/EG](32004R0282) afgegeven.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel36
  - number: '36.2'
    text: |-
      Indien de partij is bestemd voor een Lid-Staat neemt de minister bovendien het in [artikel 31, vierde lid][ref1],
      bedoelde originele document in en geeft een gewaarmerkt afschrift daarvan af, met dien verstande dat bij splitsing
      van de partij voor iedere aldus ontstane partij een gewaarmerkt afschrift wordt afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '37.1'
    text: |-
      De ingevoerde aquicultuurdieren dienen tijdens het vervoer vanaf de erkende inspectiepost, per partij, vergezeld
      te gaan van het in [artikel 31, vierde lid][ref1], bedoelde document alsmede van het Gemeenschappelijk veterinair
      document van binnenkomst, bedoeld in [verordening 282/2004/EG](32004R0282).


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '37.2'
    text: |-
      De door te voeren aquicultuurdieren die voor een Lid-Staat zijn bestemd, dienen tijdens het vervoer
      vanaf de erkende inspectiepost, per partij, vergezeld te gaan van het gewaarmerkte afschrift, bedoeld in
      [artikel 36, tweede lid][ref1], alsmede van het Gemeenschappelijk veterinair document van binnenkomst, bedoeld in
      [verordening 282/2004/EG](32004R0282).


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel36
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '37.3'
    text: |-
      De door te voeren aquicultuurdieren die voor een derde land zijn bestemd, dienen tijdens het vervoer vanaf de
      erkende inspectiepost, per partij, vergezeld te gaan van het in [artikel 31, vierde lid][ref1], bedoelde document
      alsmede van het Gemeenschappelijk veterinair document van binnenkomst, bedoeld in [verordening 282/2004/EG]
      (32004R0282).


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '38.1'
    text: |-
      Indien bij het onderzoek, bedoeld in [artikel 31, derde lid][ref1], [artikel 63, tweede lid][ref2], of bij een
      controle tijdens het vervoer in het kader van de invoer of de doorvoer wordt vermoed of geconstateerd dat er
      verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel 8, eerste lid, van [richtlijn 90/425/
      EEG](31990L0425), aanwezig zijn, kan de minister, indien hij vermoedt dat er verwekkers van ziekten, zoönosen of
      andere aandoeningen aanwezig zijn, gelasten dat de daarbij betrokken aquicultuurdieren in tijdelijke afzondering
      worden geplaatst, dan wel moeten de aquicultuurdieren na een daartoe strekkend besluit van de minister worden
      vernietigd. Het bepaalde in [artikel 29, tweede lid][ref3], is ten aanzien van dit besluit van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel29
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Indien bij een onderzoek of een controle als bedoeld in het eerste lid, wordt vermoed of geconstateerd dat niet
      is voldaan aan de overige voorwaarden, die in deze regeling dan wel in de van toepassing zijnde commumautaire
      regelgeving zijn neergelegd, of dat de aquicultuurdieren afkomstig zijn uit een met een epidemische dierziekte
      besmet gebied, besluit de minister, na overleg met de importeur, om maatregelen te nemen als bedoeld in artikel 12,
      eerste lid, onderdelen a, b of c van [richtlijn 91/496/EEG](31991L0496).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel38
  - number: '38.3'
    text: |-
      De kosten, die uit de in het eerste of tweede lid, bedoelde maatregelen voortvloeien, komen voor rekening van de
      importeur, met uitzondering van de kosten die voortvloeien uit de vernietiging van de partij aquicultuurdieren als
      bedoeld in het tweede lid, welke ten laste komen van de afzender, de geadresseerde of hun gemachtigde.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel38
  - number: 38a
    text: De minister is de bevoegde autoriteit, bedoeld in artikel 7 van [verordening 282/2004/EG](32004R0282).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel38a
  - number: '39'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder ‘handelaar’ verstaan elke natuurlijke persoon of rechtspersoon
      zijnde de eerste ontvanger op Nederlands grondgebied van een partij aquicultuurprodukten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel39
  - number: '40'
    text: De in- en doorvoer van aquicultuurprodukten is verboden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel40
  - number: '41.1'
    text: |-
      Van het verbod, bedoeld in [artikel 40][ref1], wordt vrijstelling verleend ter zake van de in- en doorvoer van
      aquicultuurprodukten:


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel40
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '40'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 41.1.a
    text: die zijn verzonden vanuit een Lid-Staat;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel41
  - number: 41.1.b
    text: |-
      die zijn verzonden vanuit een derde land, en via het grondgebied van een Lid-Staat in het kader van de in- of
      doorvoer op Nederlands grondgebied worden gebracht; mits voor zover van toepassing, voldaan wordt aan het bepaalde
      in de [artikelen 42 tot en met 44][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel42
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '41.2'
    text: |-
      De in het eerste lid bedoelde vrijstelling geldt niet ter zake van de doorvoer naar Finland van eieren en gameten
      van vissen bestemd voor de teelt of het weer uitzetten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel41
  - number: '41.3'
    text: De in het eerste lid bedoelde vrijstelling geldt niet terzake van aquicultuurproducten afkomstig uit België.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel41
  - number: '42.1'
    text: |-
      De aquicultuurprodukten die zijn verzonden vanuit een Lid-Staat dienen in het kader van de invoer, tot en met
      de ontvangst door de handelaar, en in het kader van de doorvoer naar een Lid-Staat, tijdens het vervoer over
      Nederlands grondgebied, vergezeld te gaan van een vervoersdocument als bedoeld in de [artikelen 13][ref1],
      [14][ref2], [17][ref3] of [18][ref4], voor zover zij bestemd zijn voor een bedrijf gelegen in een erkend gebied of
      voor een erkend bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel18
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '13'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '14'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '17'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '18'
        hoofdstuk: '5'
  - number: '42.2'
    text: |-
      De partij aquicultuurproducten die is verzonden vanuit een derde land en via het grondgebied van een lidstaat op
      Nederlands grondgebied wordt gebracht, dient in het kader van de invoer, tot en met de ontvangst door de handelaar,
      en in het kader van de doorvoer naar een lidstaat, tijdens het vervoer over Nederlands grondgebied vergezeld
      te gaan van een Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening 136/2004/EG]
      (32004R0136) en van een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van [richtlijn 97/78/EG]
      (31997L0078).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
  - number: '42.3'
    text: |-
      De partij aquicultuurproducten die is verzonden vanuit een derde land en via het grondgebied van een lidstaat
      op Nederlands grondgebied wordt gebracht, dient in het kader van de doorvoer naar een derde land, tijdens het
      vervoer over Nederlands grondgebied, vergezeld te gaan van het bij de partij behorende document en van een
      Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening 136/2004/EG](32004R0136), waarin
      is aangegeven langs welke grensinpectiepost als bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn
      97/78/EG](31997L0078) de partij de Gemeenschap verlaat.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
  - number: 42.3.a
    text: |-
      indien de partij vóór 1 januari 1994 ter controle is aangeboden in de Lid-Staat waar de partij voor het eerst op
      het grondgebied van de Europese Gemeenschappen is gebracht, de controle van de documenten als bedoeld in artikel 4,
      eerste lid, van [richtlijn 90/675/EEG](31990L0675) is verricht en voldaan is aan het bepaalde in artikel 12, eerste
      lid, van deze richtlijn;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
  - number: 42.3.b
    text: |-
      indien de partij op 1 januari 1994 of daarna ter controle is aangeboden in de Lid-Staat waar de partij voor het
      eerst op het grondgebied van de Europese Gemeenschappen is gebracht, alle controles als bedoeld in artikel 4,
      eerste lid, van [richtlijn 90/675/EEG](31990L0675) zijn verricht en voldaan is aan het bepaalde in artikel 12,
      eerste lid, van deze richtlijn.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
  - number: '42.4'
    text: |-
      Ten aanzien van de aquicultuurprodukten dient voldaan te zijn aan het bepaalde in
      [artikel 2, tweede en derde lid][ref1], en, indien de aquicultuurprodukten zijn bestemd voor Zweden, in afwachting
      van de met betrekking tot IPN, BKD, furunculose en ERM-Yersiniose gestelde algemene of beperkte aanvullende
      garanties, bedoeld in artikel 12, tweede lid, van [richtlijn 91/67/EEG](31991L0067), en de met betrekking tot
      voorjaarsviremie bij karpers gestelde algemene of beperkte aanvullende garanties, bedoeld in artikel 13, tweede
      lid, van [richtlijn 91/67/EEG](31991L0067), aan de voorschriften die Zweden stelt met betrekking tot IPN, BKD,
      furunculose, ERM-Yersiniose, en bij karpers de voorjaarsviremie.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel2
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.5'
    text: |-
      Op de in- en doorvoer van aquicultuurprodukten, bedoeld in het eerste tot en met het derde lid, is voorts het
      bepaalde in de [artikelen 23, derde lid][ref1], [24, eerste en tweede lid][ref2], [25][ref3] en [27][ref4] van
      overeenkomstige toepassing, met dien verstande dat het woord ‘ontvanger’ telkenmale vervangen dient te worden door
      ‘handelaar’ en dat bij het in [artikel 24, tweede lid][ref5], bedoelde onderzoek, de documenten, bedoeld in het
      eerste of tweede lid, dienen te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0005834#Artikel24
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '27'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005834
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '42.6'
    text: |-
      De handelaar dient te zijn ingeschreven in het register bedoeld in [artikel 63][ref1], terwijl die inschrijving
      niet is getroffen door een beslissing als bedoeld in het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel63
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '63'
        hoofdstuk: '9'
  - number: '42.7'
    text: |-
      Het vervoer van de in het derde lid bedoelde partij geschiedt onder douanetoezicht tot op de plaats waar het
      Nederlands grondgebied wordt verlaten in verzegelde voertuigen of verzegelde containers en zonder splitsing of,
      tenzij de partij overeenkomstig het derde lid wordt opgeslagen, lossing van de partij.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
  - number: '42.8'
    text: |-
      Op de in het zevende lid bedoelde partij is
      [paragraaf 3.2.4 van de Regeling veterinairrechtelijke voorschriften handel dierlijke producten][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Paragraaf3.2.4
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019235
        paragraaf: 3.2.4
  - number: '42.9'
    text: |-
      De vanuit een Lid-Staat verzonden partij aquicultuurproducten, voor zover het eieren en gameten van levende
      gekweekte vis betreft, dient in de situatie, bedoeld in artikel 1 van beschikking 99/567/EG, in het kader van de
      invoer, tot en met de ontvangst door de geadresseerde, genoemd in het hierna bedoelde document, en in het kader van
      de doorvoer, tijdens het vervoer over Nederlands grondgebied, vergezeld te gaan van een uit één enkel blad bestaand
      origineel document dat is opgesteld overeenkomstig het model van bijlage I bij beschikking 99/567/EG.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
  - number: '42.10'
    text: |-
      De vanuit een Lid-Staat verzonden partij aquicultuurproducten, voor zover het eieren en gameten van levende
      gekweekte vis betreft, dient in de situatie, bedoeld in artikel 2 van beschikking 99/567/EG, in het kader van de
      invoer, tot en met de ontvangst door de geadresseerde, genoemd in het hierna bedoelde document, en in het kader van
      de doorvoer, tijdens het vervoer over Nederlands grondgebied vergezeld te gaan van een uit één enkel blad bestaand
      origineel document dat is opgesteld overeenkomstig het model van bijlage II bij beschikking 99/567/EG.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel42
  - number: '44.1'
    text: |-
      Indien bij de controle, bedoeld in [artikel 42, vijfde lid][ref1], jo. [24, tweede lid][ref2], of bij de controle
      tijdens het vervoer van een partij aquicultuurproducten in het kader van de invoer of de doorvoer van deze partij
      wordt vermoed of geconstateerd dat er verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel
      7, eerste lid, onderdeel a, van [richtlijn 89/662/EEG](31989L0662), aanwezig zijn of de aquicultuurproducten
      afkomstig zijn uit een met een epidemische dierziekte besmet gebied, kan de minister, indien hij vermoedt dat
      er verwekkers van ziekten, zoönosen of andere aandoeningen aanwezig zijn, gelasten dat de partij in tijdelijke
      afzondering wordt geplaatst, dan wel worden de maatregelen bedoeld in artikel 7, eerste lid, onderdeel a, eerste
      alinea, van die richtlijn, uitgevoerd, al naar gelang de minister daaromtrent heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel24
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '44.2'
    text: |-
      Indien bij een controle als bedoeld in het eerste lid, of bij een controle tijdens het vervoer van een partij
      aquicultuurproducten in het kader van de invoer of de doorvoer van deze partij wordt vermoed of geconstateerd
      dat niet wordt voldaan aan de voorschriften van de onderhavige regeling dan wel aan de van toepassing zijnde
      communautaire voorschriften, kan de minister, indien hij vermoedt dat niet is voldaan aan vorenbedoelde
      voorschriften, gelasten dat de aquicultuurdieren in tijdelijke afzondering worden geplaatst, dan wel wordt één van
      de maatregelen, bedoeld in artikel 8, eerste lid, onderdeel b, van [richtlijn 90/425/EEG](31990L0425) uitgevoerd,
      waartoe de minister overeenkomstig de keuze van de afzender of diens gemachtigde heeft besloten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel44
  - number: '44.3'
    text: |-
      Een besluit als bedoeld in het eerste en tweede lid, laat onverlet het recht van de afzender van de
      aquicultuurproducten om, overeenkomstig het bepaalde in artikel 8, tweede lid, vierde alinea, van [richtlijn
      89/662/EEG](31989L0662), binnen een maand na de kennisgeving bedoeld in het vierde lid, het advies van een
      veterinaire deskundige in te winnen, met dien verstande evenwel, dat de minister te allen tijde kan beslissen om
      de maatregelen, bedoeld in het eerste lid, onmiddellijk uit te voeren indien zulks noodzakelijk is om redenen van
      gezondheidsbescherming.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel44
  - number: '44.4'
    text: |-
      Het bepaalde in [artikel 29, derde en vijfde lid][ref1], is op besluiten in het eerste en tweede lid, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel29
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '45.1'
    text: |-
      Van het verbod, bedoeld in [artikel 40][ref1], wordt vrijstelling verleend ter zake van de invoer van
      aquicultuurproducten, die daarbij voor het eerst op het grondgebied van de Europese Gemeenschappen worden
      gebracht en die zijn verzonden vanuit een derde land of een deel van een derde land, mits, voorzover van
      toepassing, is voldaan aan de bij of krachtens de artikelen 19, 20 en 21 van [richtlijn 91/67/EEG](31991L0067)
      gestelde voorschriften, aan [verordening 136/2004/EG](32004R0136) en aan de [artikelen 46][ref2], [47][ref3] en
      [49 tot en met 53][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel49
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '40'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '47'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '45.2'
    text: |-
      Van het verbod, bedoeld in [artikel 40][ref1] wordt vrijstelling verleend, ter zake van de doorvoer van
      aquicultuurprodukten bestemd voor een Lid-Staat, die via Nederland voor het eerst op het grondgebied van de
      Europese Gemeenschappen worden gebracht en zijn verzonden vanuit een derde land of een deel van een derde
      land, dat is vermeld op de krachtens artikel 19, eerste lid, van [richtlijn 91/67/EEG](31991L0067) opgestelde
      lijst, of zolang die lijst niet is vastgesteld, zijn verzonden vanuit een derde land, mits, voor zover van
      toepassing, is voldaan aan [verordening 136/2004/EG](32004R0136) en de [artikelen 46][ref2], [47][ref3] en
      [49 tot en met 53][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel49
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '40'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '47'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '45.3'
    text: |-
      Voorts wordt vrijstelling verleend van het verbod, bedoeld in [artikel 40][ref1] ter zake van de doorvoer
      van aquicultuurprodukten bestemd voor een derde land, die via Nederland voor het eerst op het grondgebied
      van de Europese Gemeenschappen worden gebracht en zijn verzonden vanuit een derde land of een deel van een
      derde land, mits, voor zover van toepassing voldaan wordt aan [verordening 136/2004/EG](32004R0136) en de
      [artikelen 46 tot en met 53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '40'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '46.1'
    text: |-
      Elke partij aquicultuurproducten moet het Nederlands grondgebied worden binnengebracht via een erkende
      inspectiepost.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: '46.2'
    text: |-
      De melding van de aanvoer van een partij aquicultuurproducten vind plaats aan de VWA overeenkomstig artikel 2 van
      [verordening 136/2004/EG](32004R0136), met dien verstande dat de bevoegde autoriteit, bedoeld in artikel 2, vierde
      lid, van die verordening, de minister is.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: '46.3'
    text: |-
      Indien de partij voor Nederland dan wel voor een lidstaat is bestemd, dient bij de aankomst op de erkende
      inspectiepost aan de op de inspectiepost aanwezige ambtenaar, te worden overgelegd, een document als bedoeld in
      artikel 21 van [richtlijn 91/67/EEG](31991L0067): - dat in overeenstemming met de regelgeving van de Europese
      Gemeenschappen is afgegeven;
        - waaruit blijkt dat is voldaan aan nadere voorwaarden, die bij de regelgeving van de Europese Gemeenschappen zijn
      gesteld aan de invoer van aquicultuurproducten vanuit het betrokken derde land of deel van dat derde land;
        - waarvan de geldigheidsduur niet is verstreken, en, waaruit blijkt dat, indien de partij bestemd is voor Finland
      of Zweden, tenminste voldaan is aan de voorschriften die gelden met betrekking tot de invoer in Finland of Zweden
      van aquicultuurproducten uit lidstaten.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: '46.4'
    text: |-
      Indien de partij bestemd is voor een derde land, dient bij de aankomst op de erkende inspectiepost aan de op de
      inspectiepost aanwezige ambtenaar, een bij de partij behorend document te worden overgelegd, dat is opgesteld
      in de Nederlandse, Duitse, Franse of Engelse taal, waaruit tenminste de oorsprong van de partij, de verdere
      bestemming hiervan, alsmede, indien opslag in een van de in artikel 12 van [richtlijn 97/78/EG](31997L0078)
      bedoelde opslagruimte in Nederland dan wel een lidstaat is voorzien, het feit dat voldaan is aan de op grond
      van deze regeling met betrekking tot de invoer in Nederland dan wel de doorvoer naar een lidstaat gestelde
      veterinairrechtelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: '46.5'
    text: |-
      De partij producten wordt door de belanghebbende bij de lading bij aankomst op de erkende inspectiepost ter
      onderzoek aangeboden aan de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: '46.6'
    text: |-
      De in het derde en vierde lid bedoeld documenten zijn originelen waarvan de geldigheidsduur niet is verstreken.
      Zij zijn, voorzover van toepassing, in overeenstemming met de regelgeving van de Europese Gemeenschap opgesteld en
      afgegeven, volledig ingevuld, gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: '46.7'
    text: |-
      Op de in het eerste lid bedoelde partij producten zijn de [artikelen 3.2.2.4, tweede lid][ref1], en
      [3.2.2.5 tot en met 3.2.4.4 van de Regeling veterinairrechtelijke voorschriften handel dierlijke producten][ref2]
      van overeenkomstige toepassing. Deze partij gaat vergezeld van een Gemeenschappelijk veterinair document van
      binnenkomst als bedoeld in [verordening 136/2004/EG](32004R0136). Opslag in een vrije zone, een vrij entrepot of
      een douane-entrepot is slechts toegestaan voor zover elders geen opslag heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel3
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0019235
        artikel: '3'
  - number: '46.8'
    text: 'Voor de toepassing van de in het zevende lid bedoelde artikelen wordt voor ‘keuringsdierenarts’ gelezen: ambtenaar.'
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: '46.9'
    text: |-
      Een partij aquicultuurproducten afkomstig uit Nieuw-Zeeland mag in afwijking van het derde lid vergezeld gaan van
      een op de partij betrekking hebbend gezondheidscertificaat dat ingevolge de regelgeving van de Europese Gemeenschap
      ter uitvoering van de Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-Zeeland inzake
      sanitaire maatregelen voor de handel in levende dieren en dierlijke producten (PbEG 1997, L 57) is vastgesteld,
      indien is voldaan aan elk van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: 46.9.a
    text: |-
      de desbetreffende aquicultuurproducten zijn ingevolge de vorenbedoelde overeenkomst in elk geval op het gebied van
      de diergezondheid als gelijkwaardig erkend;
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: 46.9.b
    text: de partij producten voldoet aan de ingevolge vorenbedoelde regelgeving gestelde bijkomende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46
  - number: 46a.1
    text: |-
      In afwijking in zoverre van [artikel 46, tweede lid][ref1], kan de belanghebbende bij de lading de melding van
      de aanvoer van een partij, bedoeld in [artikel 46, tweede lid][ref2], op elektronische wijze verrichten, mits de
      minister daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 46a.2
    text: |-
      De minister kan aan zijn instemming, bedoeld in het eerste lid, voorwaarden stellen en nadere voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
  - number: 46a.3
    text: 'De minister kan zijn instemming, bedoeld in het eerste lid in, intrekken, indien de belanghebbende bij de lading:'
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
  - number: 46a.3.a
    text: niet meer voldoet aan de voorwaarden, bedoeld in het tweede lid, of
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
  - number: 46a.3.b
    text: niet voldoet aan de nadere voorschriften, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
  - number: 46a.4
    text: |-
      Het melden van de aanvoer, bedoeld in het eerste lid, geschiedt via een daarvoor bestemd elektronisch systeem met
      behulp van een door de minister beschikbaar gestelde toegang.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
  - number: 46a.5
    text: |-
      De minister kan een elektronische aanmelding weigeren, indien deze niet overeenkomstig
      [artikel 46, tweede lid][ref1], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 46a.6
    text: |-
      [Artikel 20a, vijfde tot en met tiende lid, van de Regeling invoer, uitvoer en verkeer van planten][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel20a
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 20a
  - number: 46b.1
    text: |-
      Ter zake van een partij die zich aan boord bevindt van een vliegtuig of een schip dat bij vervoer tussen twee derde
      landen op Nederlands grondgebied landt of aanlegt, overlegt de vervoerder desgevraagd, aan de ambtenaar, het in
      [artikel 46, vierde lid][ref1], bedoelde document.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 46b.2
    text: |-
      Indien de in het eerste lid bedoelde partij van het ene vliegtuig of schip in het andere wordt overgeladen, stelt
      de vervoerder de ambtenaar hiervan in kennis en overlegt hij hem het in [artikel 46, vierde lid][ref1], bedoelde
      document.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 46b.3
    text: |-
      Indien de in het eerste lid bedoelde partij tijdelijk wordt uitgeladen en opgeslagen in een op Nederlands
      grondgebied gelegen haven of luchthaven, in afwachting van verzending naar een derde land, overlegt de vervoerder
      aan de ambtenaar, het in [artikel 46, vierde lid][ref1], bedoelde document en biedt hij de partij aan hem ten
      onderzoek aan.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 46b.4
    text: |-
      In de in dit artikel bedoelde gevallen gaat de partij tijdens het vervoer naar een derde land vergezeld van het in
      [artikel 46, vierde lid][ref1], bedoelde document.


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '47'
    text: |-
      Met betrekking tot het bepaalde in [artikel 46][ref1] is het gestelde in de [artikelen 32][ref2] en [33][ref3] en
      met betrekking tot het bepaalde in [artikel 46b][ref4] is het gestelde in [artikel 32][ref5] van overeenkomstige
      toepassing met dien verstande dat onder ‘importeur of vervoerder’ als bedoeld in [artikel 32][ref6] tevens dient te
      worden verstaan: belanghebbende bij de lading..


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel46b
      [ref5]: https://wetten.overheid.nl/BWBR0005834#Artikel32
      [ref6]: https://wetten.overheid.nl/BWBR0005834#Artikel32
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005834
        artikel: 46b
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005834
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0005834
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '48.1'
    text: |-
      Bij het binnenbrengen van een partij aquicultuurproducten die door een derde land zijn geweigerd en vanuit het
      grondgebied van de Europese Gemeenschap naar het betrokken derde land zijn verzonden, wordt voldaan aan:
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel48
  - number: 48.1.a
    text: |-
      [artikel 46, eerste, tweede en vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 48.1.b
    text: artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078).
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel48
  - number: '48.2'
    text: |-
      Op de in het eerste lid bedoelde partij producten zijn de [artikelen 3.2.2.4, tweede lid][ref1], en
      [3.2.2.5 tot en met 3.2.4.4 van de Regeling veterinairrechtelijke voorschriften handel dierlijke producten][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel3
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0019235
        artikel: '3'
  - number: '48.3'
    text: |-
      Indien de in het eerste lid bedoelde partij producten naar het derde land is verzonden vanuit een lidstaat, heeft
      de minister vooraf toestemming verleend voor het binnenbrengen van de producten en heeft de bevoegde autoriteit
      van de lidstaat die het in artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078) bedoelde
      certificaat heeft afgegeven met de terugname van de partij ingestemd.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel48
  - number: '49.1'
    text: |-
      Noch krachtens artikel 22, eerste lid, eerste gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078), noch
      krachtens andere regelgeving van de Europese Gemeenschappen tot wering en bestrijding van besmettelijke dierziekten
      zijn maatregelen genomen, houdende de instelling van een verbod om de betrokken aquicultuurprodukten in de Europese
      Gemeenschappen dan wel in Nederland in te voeren, onderscheidenlijk in het kader van de doorvoer op Nederlands
      grondgebied te brengen.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel49
  - number: '49.2'
    text: |-
      De producten zijn niet verkregen van of met aquicultuurdieren waaraan stoffen zijn toegediend die ingevolge artikel
      3, onderdeel a, van [richtlijn 96/22/EG](31996L0022) niet aan aquicultuurdieren mogen worden toegediend, tenzij aan
      de voorwaarden ingevolge artikel 11 van genoemde richtlijn is voldaan.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel49
  - number: '49.3'
    text: |-
      Ten aanzien van de aquicultuurproducten is, in voorkomend geval, voldaan aan de op grond van artikel 22,
      eerste lid, tweede en derde gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078) dan wel op grond van andere
      regelgeving van de Europese Gemeenschap vastgestelde bijzondere voorschriften.
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel49
  - number: 52a.1
    text: |-
      De [artikelen 46][ref1], [46a][ref2], [46b][ref3], [47][ref4] en [48][ref5] zijn niet van toepassing indien het
      aquicultuurproducten betreft als bedoeld in artikel 16, eerste lid, van [richtlijn 97/78/EG](31997L0078), met
      inachtneming van artikel 8 van [verordening 136/2004/EG](32004R0136).


      [ref1]: https://wetten.overheid.nl/BWBR0005834#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005834#Artikel46a
      [ref3]: https://wetten.overheid.nl/BWBR0005834#Artikel46b
      [ref4]: https://wetten.overheid.nl/BWBR0005834#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0005834#Artikel48
    url: https://wetten.overheid.nl/BWBR0005834/2006-12-15#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005834
        artikel: '46'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005834
        artikel: 46a
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005834
        artikel: 46b
        hoofdstuk: '7'
