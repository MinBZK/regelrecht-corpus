preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             overlegorgaan:

              overlegorgaan als bedoeld in [artikel 3][ref1];



            c
             nationaal Park:

              gebied zoals omschreven in het Structuurschema (kamerstukken II, 1992/93, 22880, nr. 5, blz. 99)


      [ref1]: https://wetten.overheid.nl/BWBR0013557#Artikel3
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013557
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied De Loonse en Drunense Duinen, zoals aangegeven op de kaart die als
      bijlage behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park De Loonse en Drunense Duinen.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park De Loonse
      en Drunense Duinen. Daartoe behoort onder meer:
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel4
  - number: 4.a
    text: het actualiseren van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel4
  - number: 4.b
    text: |-
      het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en
      activiteiten;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel4
  - number: 4.c
    text: |-
      het doen van voorstellen aan de minister voor de besteding van de voor het nationale park De Loonse en Drunense
      Duinen beschikbare middelen in het kader van een jaarlijkse voortschrijdend meerjarenprogramma met bijbehorende
      begroting;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel4
  - number: 4.d
    text: |-
      besteding van gelden op basis van een door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de bestedingen van gelden en coördinatie van de uitvoering van projecten binnen het
      kader van beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel4
  - number: 4.e
    text: |-
      het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van voorlichting
      en educatie met betrekking tot het nationaal park De Loonse en Drunense Duinen.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park De
      Loonse en Drunense Duinen van 29 juni 2001 en met inachtneming van hetgeen te dien aanzien door de minister bij
      brief van 30 oktober 2001, kenmerk DN 2001/3006, is gesteld.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel5
  - number: '6'
    text: 'In het overleg hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.a
    text: één door de minister te benoemen lid, tevens voorzitter;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b
    text: 'negen door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:'
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.1
    text: de provincie Noord-Brabant;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.2
    text: de gemeente Loon op Zand;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.3
    text: de gemeente Heusden;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.4
    text: de gemeente Haaren;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.5
    text: de gemeente Tilburg;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.6
    text: de gemeente Waalwijk;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.7
    text: het Waterschap De Dommel;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.8
    text: het waterschap De Dongestroom;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.b.9
    text: het Overlegplatform Duinboeren;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.c
    text: |-
      twee door de minister te benoemen leden, als vertegenwoordiger en op voordracht van de Vereniging tot Behoud van
      Natuurmonumenten in Nederland en de Stichting Brabants Landschap;
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: 6.d
    text: een rijksambtenaar, werkzaam bij de directie Zuid van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel6
  - number: '7.1'
    text: |-
      Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel7
  - number: '7.2'
    text: Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel7
  - number: '8'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de provincie Noord-Brabant te benoemen ambtenaar van
      die provincie.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel8
  - number: '9'
    text: |-
      Indien bij het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel9
  - number: '10'
    text: De regeling aanwijzing nationaal park in oprichting De Loonse en Drunense Duinen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 3 april 2002.
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park De Loonse en Drunense Duinen.'
    url: https://wetten.overheid.nl/BWBR0013557/2002-04-03#Artikel12
