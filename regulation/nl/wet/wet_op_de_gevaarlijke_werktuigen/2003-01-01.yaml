---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: wet_op_de_gevaarlijke_werktuigen
regulatory_layer: WET
publication_date: '1997-11-25'
valid_from: '2003-01-01'
bwb_id: BWBR0002087
url: https://wetten.overheid.nl/BWBR0002087/2003-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de veiligheid en de gezondheid
    voorschriften vast te stellen, waaraan gevaarlijke werktuigen en beveiligingsmiddelen moeten voldoen, of welke met
    betrekking tot gevaarlijke werktuigen en beveiligingsmiddelen moeten worden in acht genomen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder:

      a. "gevaarlijke werktuigen": bij algemene maatregel van bestuur aan te wijzen technische voortbrengselen, waarmede
      de veiligheid in gevaar kan worden gebracht of aan de gezondheid schade kan worden berokkend;

      b. "beveiligingsmiddelen": bij algemene maatregel van bestuur aan te wijzen beveiligingsmiddelen;

      c. "Onze Minister": Onze Minister van Sociale Zaken of een andere Minister die het aangaat.

      2 Indien ingevolge het voorgaande lid bij algemene maatregel van bestuur als gevaarlijke werktuigen worden
      aangewezen technische voortbrengselen ten aanzien waarvan maatregelen van veiligheid alleen afdoende en volledig
      kunnen worden genomen, indien deze ook de met die voortbrengselen rechtstreeks in verband staande delen van
      gebouwen betreffen, worden die delen geacht mede onder die werktuigen te zijn begrepen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel1
  - number: 1a
    text: |-
      Het bij of krachtens deze wet bepaalde is mede van toepassing op gevaarlijke werktuigen en beveiligingsmiddelen,
      die op het continentaal plat gebruikt worden bij een verkenningsonderzoek, het opsporen of winnen van delfstoffen
      of aardwarmte dan wel het opslaan van stoffen als bedoeld in de [Mijnbouwwet](onbekend). Bij of krachtens
      algemene maatregel van bestuur kan worden bepaald dat deze wet en de daarop berustende bepalingen geheel of
      gedeeltelijk niet van toepassing zijn op gevaarlijke werktuigen en beveiligingsmiddelen die gebruikt worden bij
      een verkenningsonderzoek, het opsporen of winnen van delfstoffen of aardwarmte dan wel het opslaan van stoffen als
      bedoeld in de [Mijnbouwwet](onbekend). Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de in
      de vorige zin bedoelde gevaarlijke werktuigen en beveiligingsmiddelen voorts regels worden gesteld die afwijken van
      of strekken ter aanvulling van deze wet en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel1a
  - number: '2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van de veiligheid en de gezondheid
      voorschriften vastgesteld, waaraan gevaarlijke werktuigen en beveiligingsmiddelen moeten voldoen. Deze
      voorschriften kunnen onder meer betreffen:

      a. de aard, de soort, de eigenschappen en de behandeling van het materiaal;

      b. de constructie;

      c. de beveiliging;

      d. de op een gevaarlijk werktuig of een beveiligingsmiddel aan te brengen kentekenen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende het keuren
      van daarbij aangewezen gevaarlijke werktuigen en beveiligingsmiddelen.

      2 Daarbij kan mede worden bepaald in welke gevallen kan worden volstaan met keuring van één of meer het type
      kenmerkende monsters.

      3 Indien ingevolge het bepaalde in het eerste lid voor een gevaarlijk werktuig of een beveiligingsmiddel een
      bijzondere of periodiek te herhalen keuring is voorgeschreven, kan bij algemene maatregel van bestuur tevens worden
      vastgesteld, aan welke voorschriften het gevaarlijke werktuig, onderscheidenlijk het beveiligingsmiddel bij de
      tweede en de daarop volgende keuringen moet voldoen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel3
  - number: '4'
    text: |-
      1 Nadat een keuring als bedoeld in artikel 3 heeft plaats gehad, wordt voor een gevaarlijk werktuig of een
      beveiligingsmiddel een certificaat van goedkeuring afgegeven, indien het naar het oordeel van degene, die de
      keuring verrichtte, voldoet aan de krachtens artikel 2 of krachtens het derde lid van artikel 3 vastgestelde
      voorschriften.

      2 Onze Minister kan ten aanzien van bepaalde soorten van gevaarlijke werktuigen en beveiligingsmiddelen het
      bepaalde in het vorige lid niet van toepassing verklaren. Zodanige werktuigen en beveiligingsmiddelen worden,
      indien zij naar het oordeel van degene, die de keuring verrichtte, voldoen aan de krachtens artikel 2 of krachtens
      het derde lid van artikel 3 vastgestelde voorschriften, voorzien van een merk van goedkeuring.

      3 In geval voor een het type kenmerkend monster een certificaat van goedkeuring is afgegeven, worden alle
      gevaarlijke werktuigen of beveiligingsmiddelen, welke geheel overeenkomstig dit monster zijn vervaardigd, zonder
      nadere keuring van een merk van goedkeuring voorzien, tenzij bij algemene maatregel van bestuur anders is bepaald.

      4 Onze Minister kan bepalingen vaststellen omtrent het waarmerken en bewaren van goedgekeurde, het type kenmerkende
      monsters.

      5 Onze Minister kan bepalingen vaststellen betreffende aard, inhoud, vorm en geldigheidsduur van certificaten en
      merken van goedkeuring.

      6 Onze Minister kan bepaalde, in het buitenland afgegeven certificaten van goedkeuring of één of meer in het
      buitenland aangebrachte merken van goedkeuring, hetzij voor alle, hetzij voor bepaalde gevaarlijke werktuigen of
      beveiligingsmiddelen met de in deze wet bedoelde certificaten of merken gelijk stellen. Tevens kan Onze Minister
      bepalen, dat deze certificaten ter waarmerking moeten worden aangeboden aan daartoe door hem aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister wijst diensten, instellingen of onderzoekingsbureaux en ondernemingen aan, die met betrekking tot
      door hem te bepalen soorten van gevaarlijke werktuigen en beveiligingsmiddelen bevoegd zijn tot het verrichten van
      keuringen, tot het afgeven van certificaten van goedkeuring en tot het aanbrengen van merken van goedkeuring. Aan
      zodanige aanwijzing kunnen voorwaarden worden verbonden; zij kan te allen tijde worden ingetrokken of gewijzigd.

      2 Een ingevolge het eerste lid aangewezen dienst, instelling, onderzoekingsbureau of onderneming is bevoegd om met
      inachtneming van de door Onze Minister hieromtrent gegeven aanwijzingen, beproevingen, welke een onderdeel vormen
      van de keuring, door anderen te doen verrichten.

      3 Onze Minister kan voorwaardelijk of onvoorwaardelijk fabrikanten of handelaren bevoegd verklaren tot het
      aanbrengen van de in het derde lid van artikel 4 bedoelde merken van goedkeuring. Zodanige bevoegdverklaring kan te
      allen tijde worden ingetrokken of gewijzigd.

      4 Voor de in het eerste en tweede lid bedoelde werkzaamheden is een vergoeding verschuldigd volgens een door Onze
      Minister vastgesteld tarief.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel5
  - number: '6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld, welke moeten worden
      in acht genomen bij het voorhanden hebben, het afleveren, het vervoeren, het gebruiken, het herstellen, het
      onderhouden en nazien, alsmede het tentoonstellen van gevaarlijke werktuigen en beveiligingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel6
  - number: '8'
    text: |-
      1 Hij, door wie of te wiens behoeve een gevaarlijk werktuig of een beveiligingsmiddel is ingevoerd, ten
      aanzien waarvan ingevolge artikel 3, eerste lid, een keuring is voorgeschreven, is verplicht daarvan onverwijld
      schriftelijk aangifte te doen bij een daartoe door Onze Minister aangewezen onder hem ressorterende ambtenaar,
      onder opgave van de plaats, waar het gevaarlijke werktuig, onderscheidenlijk het beveiligingsmiddel zich bevindt,
      en van de plaats, waarheen het zal worden vervoerd.

      2 Hij, door wie of te wiens behoeve een gevaarlijk werktuig of een beveiligingsmiddel is ingevoerd, ten aanzien
      waarvan ingevolge artikel 3, eerste lid, een keuring is voorgeschreven, is, behalve in het geval voorzien in
      het zesde lid van artikel 4, verplicht, voordat hij dit gevaarlijke werktuig of beveiligingsmiddel aflevert,
      tentoonstelt of gebruikt, hetzelve, of één of meer het type kenmerkende monsters binnen dertig dagen na ontvangst
      tot het verrichten van de keuring aan te bieden.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel8
  - number: '9'
    text: |-
      Bij algemene maatregel van bestuur kan worden voorgeschreven, dat de eigenaar of de houder verplicht is binnen een
      bepaalde termijn aangifte te doen betreffende bepaalde gevaarlijke werktuigen en beveiligingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel9
  - number: '10'
    text: |-
      1 Het is verboden een gevaarlijk werktuig of een beveiligingsmiddel te vervaardigen zonder inachtneming van een
      krachtens artikel 2 vastgesteld voorschrift.

      2 Het is verboden een gevaarlijk werktuig of een beveiligingsmiddel ten aanzien waarvan niet ingevolge artikel 3,
      eerste lid, een keuring is voorgeschreven, voorhanden te hebben, af te leveren, te gebruiken of tentoon te stellen,
      indien het niet voldoet aan een krachtens artikel 2 vastgesteld voorschrift.

      3 Het is verboden een gevaarlijk werktuig of een beveiligingsmiddel ten aanzien waarvan ingevolge artikel 3, eerste
      lid, een keuring is voorgeschreven, voorhanden te hebben, af te leveren, te gebruiken of tentoon te stellen, indien
      ten aanzien van dat gevaarlijke werktuig of dat beveiligingsmiddel niet een geldig certificaat van goedkeuring
      kan worden getoond en dat gevaarlijke werktuig of dat beveiligingsmiddel evenmin voorzien is van een geldig merk
      van goedkeuring.

      4 Voor zover bij algemene maatregel van bestuur niet anders is bepaald, zijn het tweede en het derde lid niet van
      toepassing op het voorhanden hebben en het gebruiken in de huishouding.

      5 Voor zover bij algemene maatregel van bestuur niet anders is bepaald, is het derde lid niet van toepassing op het
      tentoonstellen, mits bij het tentoonstellen op duidelijk leesbare wijze is vermeld, dat een certificaat of een merk
      van goedkeuring nog niet werd verkregen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel10
  - number: '11'
    text: |-
      1 Van het bij of krachtens deze wet bepaalde kan Onze Minister vrijstelling en een door Onze Minister aangewezen
      ambtenaar ontheffing verlenen.

      2 Een vrijstelling of een ontheffing kan onder beperkingen worden verleend.

      3 Aan een vrijstelling of een ontheffing kunnen voorschriften worden verbonden.

      4 Een vrijstelling of een ontheffing kan worden ingetrokken wanneer:

      a. een of meer der redenen waarom zij is verleend, vervallen zijn,

      b. een of meer van de daaraan verbonden voorschriften niet worden nageleefd, of

      c. zich na de verlening zodanige feiten of omstandigheden voordoen dat, indien deze ten tijde van de verlening
      bekend waren geweest, de vrijstelling of ontheffing niet of niet in die vorm zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister wijst ambtenaren aan, die bevoegd zijn om gevaarlijke werktuigen en beveiligingsmiddelen te
      beproeven of te onderzoeken, te doen beproeven of te doen onderzoeken, dan wel schriftelijk en gedagtekend
      herstelling of behandeling binnen een daarbij vast te stellen termijn te eisen, alsmede om gevaarlijke werktuigen
      en beveiligingsmiddelen, waarvan bij een beproeving of onderzoek blijkt, dat zij niet aan de krachtens deze
      wet gegeven voorschriften voldoen, ten bewijze daarvan voorzien van een merk van afkeuring. Door het aanbrengen
      van een merk van afkeuring op een gevaarlijk werktuig of beveiligingsmiddel verliest een voor dat werktuig of
      beveiligingsmiddel afgegeven certificaat van goedkeuring of een op dat werktuig of beveiligingsmiddel aangebracht
      merk van goedkeuring van rechtswege zijn geldigheid. Een krachtens de eerste zin gestelde eis moet worden nageleefd
      door degene aan wie hij is gesteld.

      2 Aan een beproeving of onderzoek als bedoeld in het vorige lid zijn voor de eigenaar of de houder van het
      gevaarlijke werktuig of het beveiligingsmiddel geen kosten verbonden.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere bepalingen worden vastgesteld betreffende merken
      van afkeuring en de verwijdering ervan.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel12
  - number: '13'
    text: |-
      1 Tegen een beschikking op grond van deze wet van een ambtenaar als bedoeld in artikel 16, tweede lid, kan door een
      belanghebbende administratief beroep worden ingesteld bij Onze Minister.

      2 Onze Minister kan een commissie instellen, die is belast met het horen van belanghebbenden

      3 Een beschikking op grond van deze wet van een ambtenaar als bedoeld in artikel 16, eerste lid, wordt gegeven
      namens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel13
  - number: '14'
    text: |-
      Werkgevers zijn verplicht te zorgen, dat door hun werknemers geen werkzaamheden in strijd met het bij of krachtens
      deze wet bepaalde worden verricht, dat een voorschrift, verbonden aan enige krachtens deze wet genomen beschikking,
      wordt nageleefd en dat aan een krachtens het eerste lid van artikel 12 gestelde eis wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel14
  - number: 14a
    text: |-
      Indien de werkgever aan werknemers, niet zijnde bestuurders, toezichthoudende taken opdraagt in verband met het bij
      of krachtens deze wet bepaalde, moet hij ervoor zorgen dat:

      a. aan deze werknemers de bevoegdheden en middelen worden verleend die nodig zijn voor een goede uitoefening van
      die taken;

      b. slechts één werknemer wordt belast met een zelfde taak als vorenbedoeld.

      De opdracht moet de taken nauwkeurig omschrijven. Zij moet in een geschrift zijn neergelegd, onder vermelding van
      de naam van de werknemer.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel14a
  - number: '16'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen onder hem ressorterende ambtenaren.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast of mede belast de bij
      besluit van Onze Minister aangewezen andere ambtenaren dan de in het eerste lid bedoelde. Indien ambtenaren worden
      aangewezen die ressorteren onder een andere minister, wordt het besluit tot aanwijzing van die ambtenaren genomen
      door Onze Minister en die andere minister gezamenlijk. Van een besluit als bedoeld in het eerste lid en in dit lid
      wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel16
  - number: '18'
    text: |-
      Onze Minister kan nadere regels stellen betreffende het nemen, het bewaren en het vrijgeven van monsters als
      bedoeld in [artikel 5:18 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: '19'
    text: |-
      De toezichthouders zijn bevoegd tot het verzegelen van gevaarlijke werktuigen en beveiligingsmiddelen, ten
      aanzien waarvan ingevolge artikel 3, eerste lid, een keuring is voorgeschreven, doch ten aanzien waarvan een
      geldig certificaat van goedkeuring niet kan worden getoond en welke evenmin zijn voorzien van een geldig merk van
      goedkeuring. Onze Minister kan nadere bepalingen betreffende verzegeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel19
  - number: '21'
    text: |-
      De in artikel 16 bedoelde ambtenaren zijn, behoudens tegenover hen aan wier gezag zij uit kracht van hun ambt zijn
      onderworpen, verplicht tot geheimhouding van de namen der personen door wie een klacht is ingediend of aangifte
      is gedaan van een overtreding van het bij of krachtens deze wet bepaalde, behoudens wanneer deze personen hun
      schriftelijk hebben verklaard tegen de mededeling van hun namen geen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel21
  - number: '24'
    text: |-
      Het bepaalde in artikel 10, derde lid, voor zover betreft het voorhanden hebben of gebruiken van een gevaarlijk
      werktuig of een beveiligingsmiddel, geldt niet in de bij algemene maatregel van bestuur aangegeven gevallen
      gedurende een daarbij aangegeven overgangstermijn. Daarbij kan worden bepaald, dat deze uitzondering niet zal
      gelden ten aanzien van gevaarlijke werktuigen en beveiligingsmiddelen, welke overeenkomstig het bepaalde in artikel
      12 van een merk van afkeuring zijn voorzien. De in de eerste volzin bedoelde termijn kan, zo de algemene maatregel
      van bestuur zulks bepaalt, door Onze Minister worden verlengd.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel24
  - number: '25'
    text: |-
      Deze wet brengt geen wijziging in de toepassing van de [Schepenwet][ref1] en de [Stoomwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001876
      [ref2]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001876
      - id: ref2
        bwb_id: BWBR0002108
  - number: 25a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ter uitvoering van krachtens het
      Verdrag tot oprichting van de Europese Economische Gemeenschap vastgestelde verplichtingen die betrekking hebben op
      de in artikel 1 bedoelde gevaarlijke werktuigen en beveiligingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel25a
  - number: '26'
    text: Deze wet kan worden aangehaald onder de titel "Wet op de gevaarlijke werktuigen".
    url: https://wetten.overheid.nl/BWBR0002087/2003-01-01#Artikel26
