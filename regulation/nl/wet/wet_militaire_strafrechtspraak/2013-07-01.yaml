---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_militaire_strafrechtspraak
regulatory_layer: WET
publication_date: '2020-01-13'
valid_from: '2013-07-01'
bwb_id: BWBR0004789
url: https://wetten.overheid.nl/BWBR0004789/2013-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe voorschriften te geven inzake de organisatie van
    de militaire strafrechtspraak, alsmede enige bepalingen inzake de daarbij plaatsvindende wijze van strafvordering;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De zowel in deze rijkswet als in het [Wetboek van Militair Strafrecht][ref1] voorkomende uitdrukkingen hebben in
      beide dezelfde betekenis met dien verstande dat in deze rijkswet onder militairen niet worden begrepen militairen
      die Gouverneur, minister, staatssecretaris, lid van de Staten van Aruba, Curaçao of Sint Maarten of lid van de
      Staten-Generaal zijn. [Artikel 61 van het Wetboek van Militair Strafrecht][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel61
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '61'
  - number: '1.2'
    text: |-
      In deze rijkswet wordt verstaan onder: - *Wetboek van Strafvordering:* het [Wetboek van Strafvordering][ref1] van
      het Europese deel van Nederland;
        - *Wetboek van Strafrecht:* het [Wetboek van Strafrecht][ref2] van het Europese deel van Nederland;
        - *Gemeenschappelijk Hof van Justitie:* het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao en Sint Maarten
      en van Bonaire, Sint Eustatius en Saba;
        - *Gerechten in eerste aanleg:* het Gerecht in eerste aanleg van Aruba, het Gerecht in eerste aanleg van Curaçao,
      het Gerecht in eerste aanleg van Sint Maarten en het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001854
  - number: '1.3'
    text: |-
      Het [Wetboek van Strafvordering][ref1] is van toepassing, tenzij daarvan in deze rijkswet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '2.1'
    text: |-
      Onverminderd de [artikelen 10][ref1] en [17][ref2] en behoudens de uitzonderingen bij de wet gemaakt, berust
      de bevoegdheid tot kennisneming in eerste aanleg van strafbare feiten, begaan door militairen en door hen die
      ten aanzien van zodanige feiten bij of krachtens de wet met Nederlandse militairen zijn gelijkgesteld, bij de
      rechtbank, genoemd in [artikel 55 van de Wet op de rechterlijke organisatie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '17'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '2.2'
    text: |-
      Zaken betreffende strafbare feiten als bedoeld in [artikel 382 van het Wetboek van Strafvordering][ref1]
      worden behandeld en beslist door de militaire kantonrechter, bedoeld in
      [artikel 49 van de Wet op de rechterlijke organisatie][ref2]. De overige zaken worden behandeld en beslist door de
      militaire kamers, bedoeld in [artikel 55 van de Wet op de rechterlijke organisatie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel382
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '382'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '2.3'
    text: |-
      In tijd van oorlog is het tweede lid niet van toepassing en nemen de militaire kamers, bedoeld in
      [artikel 55 van de Wet op de rechterlijke organisatie][ref1], onverminderd het eerste lid, in eerste aanleg kennis
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: 2.3.1°
    text: |-
      strafbare feiten begaan door militairen, door hen die ten aanzien van zodanige feiten bij of krachtens de wet met
      Nederlandse militairen zijn gelijkgesteld en door hen die binnen de Nederlandse krijgsmacht een bij koninklijk
      besluit aan te wijzen vitale functie vervullen;
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
  - number: 2.3.2°
    text: |-
      strafbare feiten begaan door hen die buiten het grondgebied van het Koninkrijk deel uitmaken van de Nederlandse
      krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
  - number: 2.3.3°
    text: |-
      strafbare feiten begaan door personen als bedoeld onder 4 van onderdeel A van artikel 4 van het Verdrag van Genève,
      betreffende de behandeling van krijgsgevangenen van 12 augustus 1949 (*Trb.* 1951, nr. 74) voor zover die personen
      de Nederlandse krijgsmacht volgen buiten het grondgebied van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
  - number: 2.3.4°
    text: |-
      strafbare feiten door wie ook begaan in door de Nederlandse krijgsmacht bezet gebied, voorzover kennisneming
      daarvan in overeenstemming is met de regels door het volkenrecht erkend.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
  - number: '2.4'
    text: |-
      De rechtsmacht van de in het eerste lid bedoelde rechtbank strekt zich eveneens uit over de
      strafbare feiten, omschreven in de [Wet op de economische delicten][ref1]. In afwijking van
      [artikel 38, tweede volzin, van de Wet op de economische delicten][ref2] worden deze zaken behandeld en beslist
      door de militaire kamers, bedoeld in [artikel 55 van de Wet op de rechterlijke organisatie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002063
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '2.5'
    text: |-
      [Artikel 45, tweede lid, van de Wet op de rechterlijke organisatie][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel45
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '45'
  - number: '2.6'
    text: |-
      Onder oorlog als bedoeld in het derde lid wordt mede verstaan: een gewapend conflict dat niet als oorlog kan worden
      aangemerkt en waarbij het Koninkrijk is betrokken, hetzij ter individuele of collectieve zelfverdediging, hetzij
      tot herstel van internationale vrede en veiligheid.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel2
  - number: '3.1'
    text: |-
      Het rechtsgebied van de rechtbank, genoemd in [artikel 55 van de Wet op de rechterlijke organisatie][ref1], is
      met betrekking tot de in [artikel 2][ref2] omschreven rechtsmacht onbegrensd, doch strekt zich niet uit over het
      rechtsgebied van enig ander bij of krachtens deze rijkswet aangewezen gerecht, tot de uitoefening van de in artikel
      2 omschreven rechtsmacht bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '3.2'
    text: |-
      De militaire kamers van de rechtbank, genoemd in [artikel 55 van de Wet op de rechterlijke organisatie][ref1],
      kunnen zitting houden buiten de zittingsplaatsen van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '4.1'
    text: |-
      De ingevolge de voorgaande artikelen toegekende bevoegdheden lijden uitzondering in het geval van deelneming aan
      strafbare feiten van iemand die niet valt onder de rechtsmacht, in [artikel 2][ref1] omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      In dat geval vindt vervolging bij voorkeur plaats voor de rechter in Nederland, tot kennisneming van de door de
      deelnemer begane feiten bevoegd, tenzij:
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel4
  - number: 4.2.a
    text: |-
      het betreft een feit strafbaar gesteld in het [Wetboek van Militair Strafrecht][ref1], in welk geval
      [artikel 6 van het Wetboek van Strafvordering][ref2] niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 4.2.b
    text: |-
      ten aanzien van de deelnemers geen vervolging wordt ingesteld, van verdere vervolging wordt afgezien of berechting
      door de kinderrechter plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel4
  - number: '6.1'
    text: |-
      De militaire leden, bedoeld in [artikel 55, tweede lid, van de Wet op de rechterlijke organisatie][ref1] worden
      op voordracht van Onze Minister van Veiligheid en Justitie, in overeenstemming met Onze Minister van Defensie, bij
      koninklijk besluit benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '6.2'
    text: |-
      Om te kunnen worden benoemd tot militair lid, moet men militair zijn en voldoen aan de bij of krachtens
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1] gestelde beroepsvereisten en niet behoren tot de
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '6.3'
    text: |-
      De militaire leden worden voor de tijd van vier jaren benoemd. Zij zijn bij hun aftreden tweemaal herbenoembaar.
      Het militaire lid wordt op eigen verzoek bij koninklijk besluit ontslagen. Indien het militair lid niet meer
      voldoet aan een van de eisen, genoemd in het tweede lid, heeft dit van rechtswege ontslag als militair lid tot
      gevolg.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel6
  - number: '6.4'
    text: |-
      Op de militaire leden zijn de [artikelen 4][ref1], [46c tot en met 46g][ref2], [46i][ref3] met
      uitzondering van het eerste lid, onderdeel c, [46j][ref4], [46l][ref5], [46m][ref6], [46o][ref7] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '6.5'
    text: |-
      De militaire leden genieten vergoeding voor reis- en verblijfkosten volgens bij algemene maatregel van Rijksbestuur
      te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel6
  - number: '6.6'
    text: |-
      Alles wat de wijze van eedsaflegging, het kostuum van de militaire leden alsmede de werkwijze van de militaire
      kamers aangaat, wordt geregeld bij algemene maatregel van Rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel6
  - number: '8.1'
    text: |-
      De militaire kamer van het gerechtshof, genoemd in [artikel 68 van de Wet op de rechterlijke organisatie][ref1],
      is bevoegd tot het oordeel in hoger beroep over de daarvoor vatbare vonnissen van de militaire kamers van de
      rechtbank, genoemd in [artikel 55 van de Wet op de rechterlijke organisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '8.2'
    text: De militaire kamer van het gerechtshof kan zitting houden buiten de zittingsplaatsen van het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel8
  - number: '9.1'
    text: |-
      De militaire leden, bedoeld in [artikel 68, tweede lid, van de Wet op de rechterlijke organisatie][ref1] worden
      op voordracht van Onze Minister van Veiligheid en Justitie, in overeenstemming met Onze Minister van Defensie bij
      koninklijk besluit benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel68
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '68'
  - number: '9.2'
    text: |-
      Tot militair lid wordt slechts benoemd een militair die voldoet aan de bij of krachtens
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1] gestelde beroepsvereisten, die ten minste de
      rang van kapitein ter zee of kolonel bekleedt en die niet behoort tot de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '9.3'
    text: |-
      Aan militairen met de rang van kapitein ter zee of kolonel wordt als militair lid de titulaire rang van commandeur,
      brigade-generaal of commodore toegekend.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel9
  - number: '9.4'
    text: |-
      [Artikel 6, derde, vierde, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel6
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '6'
        hoofdstuk: II
  - number: '10.1'
    text: |-
      Bij koninklijk besluit kunnen op voordracht van Onze Ministers van Veiligheid en Justitie en van Defensie, in het
      gebied waarvoor een uitzonderingstoestand is afgekondigd, of voor de berechting buiten het Koninkrijk een of meer
      mobiele rechtbanken worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel10
  - number: '10.2'
    text: |-
      Bij koninklijk besluit kan worden bepaald dat een daarbij aan te wijzen militaire autoriteit in het gebied waarvoor
      een uitzonderingstoestand is afgekondigd, een of meer mobiele rechtbanken kan instellen.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel10
  - number: '10.3'
    text: |-
      [Artikel 2][ref1], met uitzondering van het tweede lid, is van overeenkomstige toepassing op een mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      Indien meer dan een mobiele rechtbank worden ingesteld wordt bij het ingevolge het eerste of tweede lid genomen
      koninklijk besluit hun onderlinge betrekkelijke bevoegdheid geregeld. De militaire kamers van de rechtbank, genoemd
      in [artikel 55 van de Wet op de rechterlijke organisatie][ref1], nemen bij voorkeur geen kennis van een feit
      waarvan ook een mobiele rechtbank kan kennis nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '10.5'
    text: |-
      Zodra de omstandigheden die tot de instelling van een mobiele rechtbank hebben geleid, hebben opgehouden te
      bestaan, of zoveel eerder als dienstig wordt geoordeeld, wordt die mobiele rechtbank bij koninklijk besluit op
      voordracht van Onze Ministers van Veiligheid en Justitie en van Defensie opgeheven. In het koninklijk besluit wordt
      tevens de afdoening van de nog bij die rechtbank aanhangige zaken geregeld.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel10
  - number: '11.1'
    text: |-
      Een mobiele rechtbank houdt zitting en beslist met drie leden, van wie twee, onder
      wie de voorzitter, rechterlijke ambtenaren met rechtspraak belast als bedoeld in
      [artikel 1, onderdeel c, van de Wet op de rechterlijke organisatie][ref1] zijn en één militair lid is.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: '11.2'
    text: |-
      Indien een of twee rechterlijke ambtenaren met rechtspraak belast, bedoeld in het eerste lid, niet beschikbaar
      zijn, wordt hun plaats ingenomen door militaire leden. Ingeval slechts één rechterlijk ambtenaar met rechtspraak
      belast aanwezig is, fungeert deze als voorzitter. Indien geen rechterlijk ambtenaar met rechtspraak belast,
      aanwezig is, wordt de rechtbank voorgezeten door het militaire lid dat het oudste is in benoeming als militair lid.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel11
  - number: '11.3'
    text: |-
      Op de militaire leden, bedoeld in het eerste en tweede lid, is
      [artikel 6, tweede, vierde, vijfde en zesde lid][ref1], van overeenkomstige toepassing, met dien verstande
      dat aan de bij of krachtens [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref2] gestelde
      beroepsvereisten bij voorkeur dient te worden voldaan. Tevens zijn de [artikelen 7, derde lid][ref3], [12][ref4] en
      [13 van de Wet op de rechterlijke organisatie][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0001830#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0001830#Artikel13
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0001830
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0001830
        artikel: '13'
  - number: '11.4'
    text: |-
      Indien een mobiele rechtbank is ingesteld, worden bij koninklijk besluit op voordracht van Onze Minister van
      Veiligheid en Justitie, in overeenstemming met Onze Minister van Defensie, de voorzitter en zoveel leden als
      dienstig wordt geoordeeld, benoemd. Ingeval de in [artikel 10, tweede lid][ref1], bedoelde militaire autoriteit de
      rechtbank heeft ingesteld, benoemt hij de voorzitter en zoveel leden als hij dienstig oordeelt. Hij voert inzake
      die benoemingen zo mogelijk overleg met de genoemde ministers en de voorzitter van de mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel10
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '10'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      Zodra een mobiele rechtbank feitelijk optreedt, kunnen zaken die bij de militaire kamers van de rechtbank, genoemd
      in [artikel 55 van de Wet op de rechterlijke organisatie][ref1], aanhangig zijn en tot de bevoegdheid van die
      mobiele rechtbank behoren, aan deze worden overgedragen in de stand, waarin zij zich op dat ogenblik bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '12.2'
    text: |-
      Overdracht van een zaak die bij een mobiele rechtbank aanhangig is, naar een andere mobiele rechtbank of naar de
      militaire kamers van de rechtbank, genoemd in [artikel 55 van de Wet op de rechterlijke organisatie][ref1], kan
      plaatsvinden in de stand, waarin zij zich op dat ogenblik bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '12.3'
    text: Uitvoering van dit artikel geschiedt door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel12
  - number: '13.1'
    text: |-
      Bij een mobiele rechtbank zijn met de handhaving van de wetten, met de vervolging van strafbare
      feiten en het doen uitvoeren van de vonnissen belast leden van het openbaar ministerie. De
      [artikelen 2, derde lid][ref1], [5][ref2], en [5f van de Wet rechtspositie rechterlijke ambtenaren][ref3] en
      [artikel 136, vijfde lid, van de Wet op de rechterlijke organisatie][ref4] zijn van overeenkomstige toepassing met
      dien verstande dat de benoeming geschiedt op de wijze in [artikel 11, vierde lid][ref5], voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
      [ref4]: https://wetten.overheid.nl/BWBR0001830#Artikel136
      [ref5]: https://wetten.overheid.nl/BWBR0004789#Artikel11
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 5f
      - id: ref4
        bwb_id: BWBR0001830
        artikel: '136'
      - id: ref5
        bwb_id: BWBR0004789
        artikel: '11'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Bij afwezigheid van leden van het openbaar ministerie kunnen met de waarneming van de taak van het openbaar
      ministerie militairen worden belast. Het daartoe strekkend besluit wordt bij koninklijk besluit genomen op
      voordracht van Onze Ministers van Veiligheid en Justitie en Defensie, of indien zodanig besluit niet kan worden
      afgewacht, door de voorzitter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel13
  - number: '13.3'
    text: |-
      Op de waarnemende militairen, bedoeld in het tweede lid, is [artikel 6, vijfde en zesde lid][ref1], van
      overeenkomstige toepassing, met dien verstande dat zij bij voorkeur dienen te voldoen aan de bij of krachtens
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref2] gestelde beroepsvereisten. Tevens is
      [artikel 13 van de Wet op de rechterlijke organisatie][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel13
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '13'
  - number: '14.1'
    text: |-
      Bij een mobiele rechtbank worden op de wijze, in [artikel 11, vierde lid][ref1], voorzien, gerechtsambtenaren,
      rechterlijke ambtenaren in opleiding of gerechtsauditeurs benoemd die de werkzaamheden verrichten die bij of
      krachtens de wet aan de griffier zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel11
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '11'
        hoofdstuk: II
  - number: '14.2'
    text: |-
      Bij afwezigheid van de gerechtsambtenaren, rechterlijke ambtenaren in opleiding of gerechtsauditeurs kunnen met
      de waarneming van de griffierstaken militairen worden belast. Het daartoe strekkend besluit wordt bij koninklijk
      besluit genomen op voordracht van Onze Ministers van Veiligheid en Justitie en Defensie, of, indien zodanig besluit
      niet kan worden afgewacht, door de voorzitter van de mobiele rechtbank.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel14
  - number: '14.3'
    text: |-
      Op de waarnemende militairen, bedoeld in het tweede lid, zijn de
      [artikelen 6, vijfde en zesde lid van deze rijkswet][ref1], en [13][ref2] en
      [14, zevende lid, van de Wet op de rechterlijke organisatie][ref3] van overeenkomstige toepassing. Tevens
      is [artikel 1 van het Besluit beëdiging en vergoeding buitengriffiers en waarnemend griffiers][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0013133#Artikel1
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0013133
        artikel: '1'
  - number: '15.1'
    text: |-
      Indien de omstandigheden ter plaatse dit nodig maken, kan de voorzitter van de mobiele rechtbank een of meer
      enkelvoudige kamers instellen onder de benaming van mobiele politierechter.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel15
  - number: '15.2'
    text: |-
      Als mobiele politierechter fungeert een door de voorzitter van de mobiele rechtbank aan te wijzen lid van die
      rechtbank, welk lid bij voorkeur is een rechterlijk ambtenaar met rechtspraak belast.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel15
  - number: '16.1'
    text: |-
      [Artikel 8][ref1] is van overeenkomstige toepassing op de vonnissen van de mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel8
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '8'
        hoofdstuk: II
  - number: '16.2'
    text: |-
      [Artikel 78, eerste, vijfde en zesde lid, van de Wet op de rechterlijke organisatie][ref1] is van overeenkomstige
      toepassing met betrekking tot de mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel78
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '78'
  - number: '17.1'
    text: |-
      Het Gerecht in eerste aanleg van Aruba, het Gerecht in eerste aanleg van Curaçao, het Gerecht in eerste aanleg van
      Sint Maarten en het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba oefenen de rechtsmacht omschreven
      in [artikel 2][ref1] uit voorzover de verdachte zich bevindt binnen het bij koninklijk besluit vast te stellen
      bevelsgebied van de hoogste bevelvoerende militair in Aruba, Curaçao en Sint Maarten en in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '17.2'
    text: |-
      Het Gerecht in eerste aanleg van het in het eerste lid genoemde land waar de verdachte zich bevindt, oefent de in
      het eerste lid omschreven rechtsmacht uit.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
  - number: '17.3'
    text: |-
      Bij de Gerechten in eerste aanleg zijn een meervoudige en een enkelvoudige kamer onder de benaming militaire
      kamers. Het lid van een enkelvoudige kamer draagt de titel van militaire politierechter.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
  - number: '17.4'
    text: De behandeling van de in het eerste lid bedoelde zaken geschiedt bij uitsluiting door een militaire kamer.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
  - number: '17.5'
    text: |-
      [Artikel 4][ref1] is van overeenkomstige toepassing ten aanzien van zich binnen het in het eerste lid bedoelde
      bevelsgebied bevindende personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel4
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '4'
        hoofdstuk: II
  - number: '17.6'
    text: |-
      [Artikel 55, tweede en derde lid, van de Wet op de rechterlijke organisatie][ref1] is van overeenkomstige
      toepassing met dien verstande dat twee leden van een meervoudige kamer, onder wie de voorzitter, lid zijn van het
      Gemeenschappelijk Hof van Justitie en dat de functie van militaire politierechter wordt vervuld door een lid van
      het Gemeenschappelijk Hof van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '17.7'
    text: |-
      [Artikel 10, tweede en derde lid, van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel10
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '10'
  - number: '17.8'
    text: |-
      De benoeming van een militair lid in de militaire kamer van het Gerecht in eerste aanleg geschiedt op
      de wijze zoals neergelegd in [artikel 23 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1].
      Om te kunnen worden benoemd tot militair lid moet men militair zijn en niet behoren tot de Koninklijke
      marechaussee. [Artikel 6, derde lid][ref2], is van overeenkomstige toepassing. Aan de vereisten omschreven in
      [artikel 24, eerste lid, onder a en b, van de Rijkswet Gemeenschappelijk Hof van Justitie][ref3] dient bij voorkeur
      te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028070#Artikel24
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0028070
        artikel: '24'
  - number: '17.9'
    text: |-
      Op de militaire leden zijn de [artikelen 6][ref1], [12, vierde lid][ref2], [13, derde lid][ref3],
      [27 tot en met 34][ref4], [36][ref5] en [46 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref6] van
      overeenkomstige toepassing, voor zover die artikelen niet afwijken van het in deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028070#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0028070#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0028070#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0028070#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0028070#Artikel46
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028070
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0028070
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0028070
        artikel: '27'
      - id: ref5
        bwb_id: BWBR0028070
        artikel: '36'
      - id: ref6
        bwb_id: BWBR0028070
        artikel: '46'
  - number: '17.10'
    text: |-
      [Artikel 6, vijfde en zesde lid][ref1], is van overeenkomstige toepassing, met dien verstande
      dat de eedaflegging door de militaire leden geschiedt op de wijze zoals is vastgelegd in
      [artikel 28 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028070#Artikel28
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028070
        artikel: '28'
  - number: '17.11'
    text: |-
      Overdracht van een zaak die in eerste aanleg bij een militaire kamer van de rechtbank, genoemd in
      [artikel 55 van de Wet op de rechterlijke organisatie][ref1], of bij een mobiele rechtbank aanhangig is met
      betrekking tot een persoon die zich bevindt binnen het in het eerste lid bedoelde bevelsgebied, dan wel overdracht
      van een zaak die bij een militaire kamer van een der in het eerste lid genoemde gerechten in eerste aanleg
      aanhangig is met betrekking tot een persoon die zich niet meer in het rechtsgebied van deze gerechten bevindt, naar
      de militaire kamer van de rechtbank, genoemd in artikel 55 van de Wet op de rechterlijke organisatie, of naar een
      mobiele rechtbank, kan plaatsvinden in de stand waarin de zaak zich op dat ogenblik bevindt. Uitvoering van deze
      overdracht geschiedt door het openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
  - number: '18.1'
    text: |-
      Het Gemeenschappelijk Hof van Justitie oordeelt in hoger beroep over de daarvoor vatbare vonnissen van de gerechten
      in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel18
  - number: '18.2'
    text: Bij het Gemeenschappelijk Hof van Justitie is een meervoudige kamer onder de benaming van militaire kamer.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel18
  - number: '18.3'
    text: |-
      De behandeling van de in het eerste lid bedoelde zaken geschiedt bij uitsluiting door een militaire kamer.
      Deze kamer oordeelt over het beklag bedoeld in [artikel 12 van het Wetboek van Strafvordering][ref1], indien de
      persoon wiens vervolging wordt verlangd zich bevindt in binnen het in [artikel 17, eerste lid][ref2], bedoelde
      bevelsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel17
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '17'
        hoofdstuk: II
  - number: '18.4'
    text: |-
      [Artikel 68, tweede lid, van de Wet op de rechterlijke organisatie][ref1], en de [artikelen 8, tweede lid][ref2],
      en [9, eerste en tweede lid][ref3], van deze rijkswet zijn van overeenkomstige toepassing met dien verstande dat
      de benoeming geschiedt overeenkomstig [artikel 23 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref4], aan de
      eisen van [artikel 24 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref5] zoveel mogelijk wordt voldaan en de
      militair tenminste een hoofdofficiersrang bekleedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0028070#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0028070#Artikel24
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '8'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '9'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0028070
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0028070
        artikel: '24'
  - number: '18.5'
    text: |-
      [Artikel 6, derde, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel6
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '6'
        hoofdstuk: II
  - number: '18.6'
    text: |-
      [Artikel 17, negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel17
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '17'
        hoofdstuk: II
  - number: '18.7'
    text: |-
      Overdracht van een zaak die bij de militaire kamer van het gerechtshof, genoemd in
      [artikel 68 van de Wet op de rechterlijke organisatie][ref1], aanhangig is met betrekking tot een persoon die
      zich bevindt binnen het in [artikel 17, eerste lid][ref2], bedoelde bevelsgebied, naar het Gemeenschappelijk Hof
      van Justitie, dan wel overdracht van een zaak die bij het Gemeenschappelijk Hof van Justitie aanhangig is met
      betrekking tot een persoon die zich niet meer in het rechtsgebied van dit gerecht bevindt, naar het gerechtshof,
      genoemd in artikel 68 van de Wet op de rechterlijke organisatie, kan plaatsvinden in de stand waarin de zaak zich
      op dat ogenblik bevindt. Uitvoering van deze overdracht geschiedt door het openbaar ministerie. Het hof waaraan de
      zaak wordt overgedragen is bevoegd in hoger beroep over de zaak te oordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel17
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '17'
        hoofdstuk: II
  - number: '19.1'
    text: |-
      [Artikel 77 van de Wet op de rechterlijke organisatie][ref1] is van overeenkomstige toepassing, met dien verstande
      dat de gerechten in eerste aanleg als rechtbank en het Gemeenschappelijk Hof van Justitie als gerechtshof worden
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel77
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '77'
  - number: '19.2'
    text: |-
      De [artikelen 75][ref1], [78, eerste, vijfde en zesde lid][ref2], [79][ref3] en
      [83 van de Wet op de rechterlijke organisatie][ref4] zijn van overeenkomstige toepassing met betrekking tot de
      gerechten in eerste aanleg en het Gemeenschappelijk Hof van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0001830#Artikel83
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '79'
      - id: ref4
        bwb_id: BWBR0001830
        artikel: '83'
  - number: '20.1'
    text: |-
      Onder leden en rechters in het [Wetboek van Strafvordering][ref1] worden begrepen leden van een militaire kamer als
      bedoeld in deze rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '20.2'
    text: |-
      Onder opsporingsambtenaren in de zin van [artikel 141][ref1] en [142 van het Wetboek van Strafvordering][ref2]
      worden mede begrepen de in Aruba, Curaçao en Sint Maarten en in de openbare lichamen Bonaire, Sint Eustatius en
      Saba als zodanig bevoegde ambtsdragers.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '21'
    text: |-
      In zaken betreffende strafbare feiten als bedoeld in [artikel 2][ref1] treedt als raadkamer een meervoudige
      militaire kamer op.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '22.1'
    text: |-
      De raadkamer van een gerecht bedoeld in deze rijkswet kan een verhoor van een persoon die zich buiten het
      Europese deel van Nederland bevindt, opdragen aan een van de leden van een militaire kamer van de rechtbank,
      genoemd in [artikel 55 van de Wet op de rechterlijke organisatie][ref1], van een krachtens [artikel 10][ref2]
      ingestelde mobiele rechtbank of van een militaire kamer van het gerecht in eerste aanleg bedoeld in
      [artikel 17, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel17
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '10'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '17'
        hoofdstuk: II
  - number: '22.2'
    text: |-
      Een opdracht als bedoeld in het eerste lid wordt bij voorkeur niet gegeven aan een lid, dat op enigerlei wijze bij
      de behandeling van een zaak betrokken is geweest.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel22
  - number: '23.1'
    text: |-
      Als raadslieden kunnen worden toegelaten degenen die worden genoemd in
      [artikel 37 van het Wetboek van Strafvordering][ref1], alsmede officieren, met dien verstande dat dezen niet worden
      toegelaten bij beroep in cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel37
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '37'
  - number: '23.2'
    text: |-
      Voor het optreden buiten het Europese deel van Nederland kan een advocaat alleen worden toegevoegd, indien hij zich
      daartoe bereid heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel23
  - number: '23.3'
    text: |-
      Een officier kan alleen worden toegevoegd, indien een advocaat niet beschikbaar is. Ook indien deze wel
      beschikbaar is, kan een officier als raadsman worden toegevoegd, mits de verdachte daarom uitdrukkelijk verzoekt.
      De toevoeging van een officier geschiedt door de voorzitter van de rechtbank, dan wel van het gerechtshof,
      waarvoor de zaak moet dienen. In het Europese deel van Nederland kan een officier alleen worden toegevoegd,
      indien hij zich daartoe bereid heeft verklaard. Een toegevoegde officier is, onverminderd het bepaalde in
      [artikel 45 van het Wetboek van Strafvordering][ref1], verplicht als raadsman op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel45
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '45'
  - number: '23.4'
    text: |-
      Onder advocaat in het [Wetboek van Strafvordering][ref1] wordt begrepen een officier die als raadsman optreedt. Het
      bepaalde in de [artikelen 37][ref2], [40, eerste en tweede lid][ref3], en [46 van dat wetboek][ref4] is echter niet
      van toepassing op een officier die als raadsman optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel46
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '46'
  - number: '23.5'
    text: |-
      Een officier die als raadsman optreedt, geniet vergoeding voor reis- en verblijfskosten volgens bij algemene
      maatregel van Rijksbestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel23
  - number: '24.1'
    text: |-
      De militair die ingeval van ontdekking op heterdaad van een misdrijf een mindere als verdachte aanhoudt, heeft
      het recht daarbij de hulp in te roepen van andere militairen. Deze zijn verplicht aan de vordering onmiddellijk
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel24
  - number: '24.2'
    text: |-
      De militair die ingeval van ontdekking op heterdaad van een misdrijf een mindere als verdachte aanhoudt,
      kan hem indien zijn overlevering aan een opsporingsambtenaar niet kan worden afgewacht, overleveren of
      doen overleveren aan de bevelvoerende militair van de eenheid waartoe de verdachte behoort of aan een
      andere door Onze Minister van Defensie aan te wijzen bevelvoerende militair. De verplichting omschreven in
      [artikel 53, vierde lid, van het Wetboek van Strafvordering][ref1] gaat in dat geval over op die bevelvoerende
      militair.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel53
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '53'
  - number: '25'
    text: |-
      Onverminderd het bepaalde in [artikel 57 van het Wetboek van Strafvordering][ref1] kan de officier van justitie
      of de hulpofficier van justitie voor wie degene, die verdacht wordt van een van de misdrijven omschreven in de
      [artikelen 96-104][ref2], [109][ref3] of [110 van het Wetboek van Militair Strafrecht][ref4], wordt geleid of
      die zelf die verdachte heeft aangehouden, na hem te hebben gehoord, bevelen dat hij naar zijn eenheid zal worden
      overgebracht, teneinde aldaar ter beschikking van de bevelvoerende militair van de eenheid waartoe de verdachte
      behoort te worden gesteld. Het bevel kan slechts worden gegeven, indien er een redelijk vermoeden bestaat dat de
      verdachte niet uit eigen beweging naar zijn eenheid zal terugkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel109
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel110
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '96'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '109'
      - id: ref4
        bwb_id: BWBR0001869
        artikel: '110'
  - number: '26'
    text: |-
      Onverminderd het bepaalde in [artikel 67 van het Wetboek van Strafvordering][ref1] kan een bevel tot voorlopige
      hechtenis eveneens worden gegeven in geval van verdenking van:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 26.a
    text: |-
      een misdrijf omschreven in het [Wetboek van Militair Strafrecht][ref1] waarop naar de wettelijke omschrijving een
      gevangenisstraf van twee jaren of meer is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0001869
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001869
  - number: 26.b
    text: |-
      een der misdrijven omschreven in de [artikelen 98][ref1], [106, eerste lid][ref2], [127, eerste lid][ref3], en
      [136, eerste lid, aanhef en onder 1 van het Wetboek van Militair Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel127
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel136
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '106'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '127'
      - id: ref4
        bwb_id: BWBR0001869
        artikel: '136'
  - number: '27.1'
    text: |-
      Onverminderd het bepaalde in [artikel 67][ref1] kan een op het voorgaand artikel of op
      [artikel 67 van dat wetboek][ref2] gegrond bevel eveneens worden gegeven, indien uit bepaalde omstandigheden blijkt
      van een gewichtige reden van militaire veiligheid, welke de onverwijlde vrijheidsbeneming vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 67a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '67'
  - number: '27.2'
    text: |-
      Een gewichtige reden van militaire veiligheid kan voor de toepassing van het vorige lid slechts in aanmerking
      worden genomen:
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel27
  - number: 27.2.1°
    text: |-
      indien er ernstig rekening mee moet worden gehouden, dat de verdachte een misdrijf zal begaan als rechtstreeks en
      onmiddellijk gevolg waarvan schade ontstaat aan of te duchten is voor de gereedheid tot het daadwerkelijk uitvoeren
      van een operatie of oefening van enig onderdeel van de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel27
  - number: 27.2.2°
    text: |-
      indien er ernstig rekening mee moet worden gehouden dat zonder onverwijlde vrijheidsbeneming van de verdachte
      andere militairen een misdrijf zullen begaan als rechtstreeks en onmiddellijk gevolg waarvan schade ontstaat aan
      of te duchten is voor de gereedheid tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel
      van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel27
  - number: '28'
    text: |-
      De strafbepalingen van het [Wetboek van Militair Strafrecht][ref1] en de gedragsregels van de
      [Wet militair tuchtrecht][ref2] zijn niet van toepassing op de schending van een bevel, dat aan de verdachte is
      gegeven ingevolge een bij de wet in het belang van strafvordering toegekende bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0004788
  - number: '29.1'
    text: |-
      [Artikel 46 van de Wet op de rechterlijke organisatie][ref1] is van toepassing met dien verstande, dat de
      rechters-commissarissen, belast met de behandeling van zaken betreffende strafbare feiten als bedoeld in
      [artikel 2 van deze rijkswet][ref2], worden benoemd uit de leden en plaatsvervangende leden van de militaire
      kamers.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '29.2'
    text: |-
      Een militair lid, dat ingevolge het eerste lid is benoemd tot rechter-commissaris, treedt als zodanig op met dien
      verstande dat hij:
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel29
  - number: 29.2.a
    text: |-
      niet bevoegd is bevelen als bedoeld in de [artikelen 63][ref1], [206][ref2], [214][ref3] en
      [221 van het Wetboek van Strafvordering][ref4] te geven;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel206
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel214
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel221
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '206'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '214'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '221'
  - number: 29.2.b
    text: alleen kan optreden indien het onderzoek van de zaak geheel of overwegend buiten Nederland plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel29
  - number: 29.2.c
    text: |-
      buiten het geval bedoeld onder b, kan optreden, indien de zaak naar het oordeel van de voorzitter van de militaire
      kamer van zodanige aard is dat onderzoek door een militair lid de voorkeur verdient.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel29
  - number: '30'
    text: |-
      Ingeval van overdracht van een zaak aan een ander gerecht na aanvang van het onderzoek op de terechtzitting, zal
      dat gerecht het onderzoek opnieuw aanvangen.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel30
  - number: '31.1'
    text: |-
      In afwijking van het bepaalde in [artikel 342, tweede lid, van het Wetboek van Strafvordering][ref1] kan de
      verklaring van een meerdere of gewezen meerdere volledig bewijs van schuld opleveren, indien zij betrekking heeft
      op de schending van een door hem gegeven dienstbevel, dan wel op een tegen hem gepleegde feitelijke insubordinatie
      of muiterij.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel342
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '342'
  - number: '31.2'
    text: |-
      De militair die zich beroept op een grond die overeenkomstig een van de
      [artikelen 40-43 van het Wetboek van Strafrecht][ref1] de strafbaarheid van een door hem als schildwacht gepleegd
      feit zou uitsluiten, wordt geacht rechtmatig te hebben gehandeld, tenzij het tegendeel aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel40
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '40'
  - number: '32'
    text: De termijn van dagvaarding voor de militaire politierechter en de militaire kantonrechter is tenminste vijf dagen.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel32
  - number: '33.1'
    text: |-
      Bij algemene maatregel van Rijksbestuur worden regels gesteld met betrekking tot de vergoeding voor reis- en
      verblijfkosten van de verdachte die in verband met de uitoefening van de dienst in een ander land verblijft dan
      waarin de rechter zitting houdt, voorzover de rechter zijn verschijning in persoon heeft bevolen.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel33
  - number: '33.2'
    text: |-
      Onze Minister van Justitie kan aan de verdachte een tegemoetkoming in de reis- en verblijfkosten verlenen, indien
      de rechter zijn verschijning in persoon heeft bevolen en betrokkene naar het oordeel van Onze Minister zeer hoge
      kosten heeft moeten maken.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel33
  - number: '35'
    text: In geval van hoger beroep is de vorige titel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel35
  - number: '36'
    text: |-
      In geval van verwijzing als bedoeld in
      [artikel 440, tweede lid, tweede volzin, van het Wetboek van Strafvordering][ref1], wordt de zaak verwezen:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel440
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '440'
  - number: 36.a
    text: |-
      wanneer de vernietigde uitspraak is gedaan door een militaire kamer van de rechtbank, genoemd in
      [artikel 55 van de Wet op de rechterlijke organisatie][ref1], naar het gerechtshof, genoemd in
      [artikel 68 van de Wet op de rechterlijke organisatie][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel68
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '68'
  - number: 36.b
    text: |-
      wanneer zij is gedaan door de militaire kamer van het gerechtshof, genoemd in artikel 68 van de Wet op de
      rechterlijke organisatie, naar datzelfde gerechtshof.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel36
  - number: '37'
    text: |-
      Bij toepassing van [artikel 471, eerste lid][ref1], en
      [artikel 472, eerste en tweede lid, van het Wetboek van Strafvordering][ref2] vindt, indien de in die artikelen
      bedoelde gevallen betrekking hebben op zaken als bedoeld in [artikel 2][ref3], verwijzing plaats naar het
      gerechtshof, genoemd in [artikel 68 van de Wet op de rechterlijke organisatie][ref4]. Aan de behandeling van de
      verwezen zaak nemen bij voorkeur geen leden deel die op enigerlei wijze bij de behandeling van die zaak betrokken
      zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel471
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel472
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0001830#Artikel68
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '471'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '472'
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0001830
        artikel: '68'
  - number: '38'
    text: |-
      Bij de toepassing van [artikel 473, eerste lid, van het Wetboek van Strafvordering][ref1] zijn de
      [artikelen 26][ref2] en [27][ref3] mede van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel473
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel27
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '473'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '26'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '27'
        hoofdstuk: III
  - number: '39.1'
    text: |-
      In zaken betreffende minderjarigen, die ten tijde van het begaan van het feit de leeftijd van achttien
      jaren nog niet hebben bereikt zijn de artikelen [488, derde lid][ref1], [489][ref2], [493, derde lid][ref3],
      [495a][ref4], [495b][ref5], [496][ref6], [497][ref7], [500, eerste lid][ref8], [504, eerste lid][ref9] en
      [505 van het Wetboek van Strafvordering][ref10] van overeenkomstige toepassing, indien die zaken betrekking hebben
      op misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel488
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel489
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel493
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel495a
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel495b
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel496
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel497
      [ref8]: https://wetten.overheid.nl/BWBR0001903#Artikel500
      [ref9]: https://wetten.overheid.nl/BWBR0001903#Artikel504
      [ref10]: https://wetten.overheid.nl/BWBR0001903#Artikel505
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '488'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '489'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '493'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 495a
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 495b
      - id: ref6
        bwb_id: BWBR0001903
        artikel: '496'
      - id: ref7
        bwb_id: BWBR0001903
        artikel: '497'
      - id: ref8
        bwb_id: BWBR0001903
        artikel: '500'
      - id: ref9
        bwb_id: BWBR0001903
        artikel: '504'
      - id: ref10
        bwb_id: BWBR0001903
        artikel: '505'
  - number: '39.2'
    text: |-
      Tenzij aanstonds onvoorwaardelijk van vervolging wordt afgezien, wint de officier van justitie in de in het
      vorige lid bedoelde zaken voorzover nodig inlichtingen in omtrent de opvoeding, het karakter, de ontwikkeling en
      het doorgaand gedrag van de verdachte, ook door het horen van getuigen die hem door diens ouders of voogd zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel39
  - number: '39.3'
    text: |-
      Ingeval van hoger beroep in de in het eerste lid bedoelde zaken zijn de [artikelen 488, derde lid][ref1],
      [489, eerste en tweede lid][ref2], [495a][ref3], [495b][ref4], [496][ref5] en
      [497 van het Wetboek van Strafvordering][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel488
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel489
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel495a
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel495b
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel496
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel497
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '488'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '489'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 495a
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 495b
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '496'
      - id: ref6
        bwb_id: BWBR0001903
        artikel: '497'
  - number: '40'
    text: |-
      De [artikelen 510][ref1] en [511 van het Wetboek van Strafvordering][ref2] vinden geen toepassing ten aanzien van
      de militaire leden van een militaire kamer of van een mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel510
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel511
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '510'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '511'
  - number: '41'
    text: |-
      De bevoegdheden bedoeld in [artikel 551 van het Wetboek van Strafvordering][ref1] kunnen mede worden uitgeoefend
      in geval van een strafbaar feit als omschreven in de [Eerste Titel van het Tweede Boek van het Wetboek van Militair
      Strafrecht](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel551
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '551'
  - number: '42'
    text: |-
      In afwijking van het bepaalde in [artikel 588, eerste lid, onder ][ref1] kan het gerechtelijk schrijven bestemd
      voor hen die feitelijk in werkelijke dienst verblijven worden uitgereikt op het adres van het onderdeel of
      dienstvak, waarbij zij zijn ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel588
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '588'
  - number: '43'
    text: 'Op de mobiele rechtbank en de ambtsdragers bij dat college zijn van overeenkomstige toepassing:'
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel43
  - number: 43.a
    text: |-
      het bepaalde in het [Wetboek van Strafvordering][ref1] met betrekking tot de rechtbank en de ambtsdragers daarbij;


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 43.b
    text: |-
      het bepaalde in [de titels I-V][ref1] en [VIII van dit hoofdstuk][ref2] met betrekking tot de rechtbank, de
      militaire kamers en de ambtsdragers daarbij voorzover daarvan in deze titel niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004789
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        hoofdstuk: III
  - number: '44.1'
    text: |-
      Indien de benoeming van de rechter-commissaris niet kan geschieden op de wijze als in de
      [Wet op de rechterlijke organisatie][ref1] voorzien, benoemt de voorzitter van de mobiele rechtbank een of meer
      leden tot rechter-commissaris voor de tijd van één jaar. Deze is steeds weer dadelijk benoembaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001830
  - number: '44.2'
    text: |-
      Het bepaalde in [artikel 29, tweede lid][ref1], is niet van toepassing indien er geen rechterlijke ambtenaren
      met rechtspraak belast als bedoeld in [artikel 1, onderdeel c, van de Wet op de rechterlijke organisatie][ref2]
      beschikbaar zijn om tot rechter-commissaris te worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '29'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '1'
  - number: '45'
    text: |-
      De [Noodwet rechtspleging][ref1] is niet van toepassing op de mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002457
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002457
  - number: '46'
    text: |-
      Indien zulks noodzakelijk is om de militaire strafrechtspraak te waarborgen, kan Onze Minister van Justitie bepalen
      dat:
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel46
  - number: 46.a
    text: 'in het rechtsgebied van een mobiele rechtbank:'
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel46
  - number: 46.a.1°
    text: |-
      de termijnen genoemd in de [artikelen 58][ref1] en [64 van het Wetboek van Strafvordering][ref2] tijdelijk zijn
      verdubbeld;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel64
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '64'
  - number: 46.a.2°
    text: |-
      tijdelijk bij dagvaarding betreffende een strafbaar feit kan worden volstaan met een korte aanduiding van het
      feit dat te laste wordt gelegd met vermelding omstreeks welke tijd en waar ter plaatse het begaan zou zijn, en de
      termijnen genoemd in [artikel 265 van het Wetboek van Strafvordering][ref1] en [artikel 32 van deze rijkswet][ref2]
      ook zonder toestemming van de verdachte tijdelijk kunnen worden verkort, een en ander voorzover de verdachte
      daardoor naar het oordeel van de rechtbank niet in zijn verdediging wordt geschaad;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel265
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel32
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '265'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '32'
        hoofdstuk: III
  - number: 46.b
    text: |-
      de mobiele rechtbank wettelijke voorschriften betreffende de termijnen en vormen, indien deze ten gevolge van de
      bijzondere omstandigheden in redelijkheid niet konden of kunnen worden in acht genomen, buiten beschouwing kan
      laten;
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel46
  - number: 46.c
    text: |-
      de beslissingen in zaken van bepaalde mobiele rechtbanken niettegenstaande de
      [artikelen 557-560 van het Wetboek van Strafvordering][ref1] ten uitvoer kunnen worden gelegd. Zodra de uitvoering
      van een beslissing een aanvang heeft genomen, vervallen de gewone rechtsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel557
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '557'
  - number: '47'
    text: |-
      De krachtens [artikel 46][ref1] getroffen voorzieningen worden ingetrokken zodra de omstandigheden dit toelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel46
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '46'
        hoofdstuk: III
  - number: '48'
    text: |-
      Krachtens de [artikelen 46][ref1] en [47][ref2] door Onze Minister van Justitie te nemen besluiten treden, tenzij
      daarbij anders is bepaald, in werking met ingang van de dag na die van hun bekendmaking. Daarin kan worden bepaald
      dat zij onmiddellijk na hun bekendmaking in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel47
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '46'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '47'
        hoofdstuk: III
  - number: '49.1'
    text: |-
      Krachtens de [artikelen 46][ref1], [47][ref2] en [48][ref3] door Onze Minister van Justitie te nemen besluiten
      worden bekend gemaakt in de Nederlandse Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel48
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '46'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '47'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '48'
        hoofdstuk: III
  - number: '49.2'
    text: |-
      Indien het landsbelang dit naar zijn oordeel noodzakelijk maakt, kan de Minister van Justitie een besluit als
      bedoeld in het voorgaande lid op andere wijze bekend maken.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel49
  - number: '50.1'
    text: |-
      Indien en voor zolang de verbinding met Onze Minister van Veiligheid en Justitie is verbroken, oefent de in
      [artikel 10, tweede lid][ref1], bedoelde militaire autoriteit, ten aanzien van een door hem ingestelde mobiele
      rechtbank, de bevoegdheden uit, die in de [artikelen 46][ref2] en [47][ref3] aan Onze Minister van Veiligheid en
      Justitie zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel47
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '46'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '47'
        hoofdstuk: III
  - number: '50.2'
    text: |-
      De [artikelen 48][ref1] en [49][ref2] zijn in dat geval van overeenkomstige toepassing met dien verstande dat voor
      de Minister van Veiligheid en Justitie wordt gelezen de in het eerste lid bedoelde militaire autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel49
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '48'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '49'
        hoofdstuk: III
  - number: '51'
    text: |-
      Op de Gerechten in eerste aanleg en op het Gemeenschappelijk Hof van Justitie, de militaire kamers
      van die colleges en de ambtsdragers daarbij zijn in zaken betreffende personen, die vallen onder de in
      [artikel 17, eerste lid][ref1], bedoelde rechtsmacht, van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel17
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '17'
        hoofdstuk: II
  - number: 51.a
    text: |-
      het bepaalde in het [Wetboek van Strafvordering][ref1] met betrekking tot de rechtbank, onderscheidenlijk het
      gerechtshof en de ambtsdragers bij die colleges;


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 51.b
    text: |-
      het bepaalde in de [titels I-V][ref1] en [VIII van dit hoofdstuk][ref2] met betrekking tot de rechtbank
      onderscheidenlijk het gerechtshof, de militaire kamers van die colleges en de ambtsdragers daarbij voorzover
      daarvan in deze titel niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004789
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        hoofdstuk: III
  - number: '52'
    text: |-
      [Artikel 22][ref1] is van overeenkomstige toepassing ten aanzien van het verhoor van een persoon die zich buiten
      Aruba, Curaçao of Sint Maarten of buiten de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel22
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '22'
        hoofdstuk: III
  - number: '53.1'
    text: |-
      Onverminderd het bepaalde in [artikel 23][ref1] kunnen in Aruba, Curaçao en Sint Maarten en in de openbare lichamen
      Bonaire, Sint Eustatius en Saba ook als raadsman worden toegelaten personen die bevoegd zijn om aldaar als raadsman
      in strafzaken op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel23
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '23'
        hoofdstuk: III
  - number: '53.2'
    text: |-
      Als raadsman van de verdachte kunnen bij de Hoge Raad ook optreden advocaten, ingeschreven bij het
      Gemeenschappelijk Hof van Justitie.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel53
  - number: '54'
    text: |-
      Onverminderd het bepaalde in [artikel 29][ref1] kan een militair lid als rechter-commissaris optreden indien het
      onderzoek van de zaak geheel of overwegend buiten Aruba, Curaçao of Sint Maarten of buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel29
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '29'
        hoofdstuk: III
  - number: '55'
    text: |-
      Onverminderd het bepaalde in [artikel 279 van het Wetboek van Strafvordering][ref1]
      kan in zaken betreffende overtredingen, met uitzondering van die bedoeld in
      [artikel 382, onder b, onder 1° tot en met 6°, van het Wetboek van Strafvordering][ref2], de verdachte zich op de
      terechtzitting doen vertegenwoordigen door een daartoe bij bijzondere volmacht schriftelijke gemachtigde, tenzij de
      rechter beveelt dat hij in persoon zal verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel279
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel382
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '279'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '382'
  - number: '56'
    text: |-
      In de gevallen van verwijzing als bedoeld in de [artikelen 36, eerste volzin][ref1], en [37, eerste volzin][ref2],
      vindt de behandeling van de zaak door de militaire kamer van het Gemeenschappelijk Hof van Justitie plaats op de
      wijze als voorzien in [artikel 36, tweede volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel36
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '36'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '37'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '36'
        hoofdstuk: III
  - number: '57.1'
    text: |-
      [Artikel 344, eerste lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing op
      geschriften opgemaakt door de in dat artikel bedoelde colleges, ambtenaren of personen van Aruba, Curaçao en Sint
      Maarten en van de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel344
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '344'
  - number: '57.2'
    text: |-
      [Artikel 344, tweede lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing op het
      proces-verbaal van een opsporingsambtenaar van Aruba, Curaçao en Sint Maarten en van de openbare lichamen Bonaire,
      Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel344
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '344'
  - number: '58'
    text: |-
      In Aruba, Curaçao en Sint Maarten en in de openbare lichamen Bonaire, Sint Eustatius en Saba kunnen
      opsporingsambtenaren bij de uitoefening van hun bevoegdheden niet dan met inachtneming van de grenzen in de ter
      plaatse geldende wetgeving voor de gewone strafvordering gesteld, inbreuk maken op de rechten van niet aan de in
      [artikel 2][ref1] bedoelde rechtsmacht onderworpen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '59.1'
    text: |-
      Buiten het Koninkrijk of binnen de territoriale zee kunnen door Onze Ministers van Justitie en van Defensie aan
      te wijzen bevelvoerende militairen, indien en zolang geen hulpofficier van justitie aanwezig is en diens komst
      niet kan worden afgewacht, de bevoegdheden uitoefenen welke het [Wetboek van Strafvordering][ref1] toekent aan de
      hulpofficier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '59.2'
    text: |-
      Indien en zolang geen opsporingsambtenaar aanwezig is en diens komst niet kan worden afgewacht, kunnen de krachtens
      het voorgaande lid aangewezen militairen de bevoegdheden uitoefenen welke het [Wetboek van Strafvordering][ref1]
      toekent aan de opsporingsambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '59.3'
    text: |-
      [Artikel 539b, eerste, tweede en derde lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539b
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539b
  - number: '59.4'
    text: |-
      [Artikel 539e, eerste lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing met dien
      verstande dat de verrichting bedoeld in [artikel 57, eerste lid, van dat wetboek][ref2] niet kan worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539e
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539e
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '59.5'
    text: |-
      [Artikel 539f, eerste, tweede, vierde en vijfde lid, van het Wetboek van Strafvordering][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539f
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539f
  - number: '59.6'
    text: |-
      [Artikel 344, tweede lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing op het
      proces-verbaal van een krachtens het eerste lid aangewezen militair.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel344
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '344'
  - number: '60.1'
    text: |-
      In geval een verdachte buiten het Koninkrijk of binnen de territoriale zee in verzekering is gesteld, stelt degene
      die het bevel daartoe heeft gegeven, de officier van justitie hiervan onverwijld en op snelst mogelijke wijze in
      kennis. De officier van justitie doet, tenzij hij in het belang van het onderzoek anders beslist, de verdachte zo
      spoedig mogelijk voor zich geleiden.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel60
  - number: '60.2'
    text: |-
      Indien en zolang de verbinding met de officier van justitie niet mogelijk is, blijft het bevel tot
      inverzekeringstelling van kracht tot het moment dat de verbinding is hersteld.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel60
  - number: '61.1'
    text: |-
      Buiten het Koninkrijk kunnen opsporingsambtenaren de bevoegdheden uitoefenen welke aan hen zijn toegekend bij enige
      bepaling van een andere wet dan deze of het [Wetboek van Strafvordering][ref1], indien dat bij algemene maatregel
      van Rijksbestuur is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '61.2'
    text: |-
      [Artikel 59][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel59
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '59'
        hoofdstuk: III
  - number: '62'
    text: |-
      Buiten het Koninkrijk kunnen bevoegdheden inzake opsporing, vervolging en berechting van strafbare feiten en
      tenuitvoerlegging van vonnissen slechts worden uitgeoefend voorzover het volkenrecht dit toelaat.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel62
  - number: '63'
    text: Deze Rijkswet kan worden aangehaald als "Wet militaire strafrechtspraak".
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel63
  - number: '64.1'
    text: Deze Rijkswet treedt in werking met ingang van een nader bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel64
  - number: '64.2'
    text: |-
      Bij koninklijk besluit kan voordien een tijdstip worden bepaald met ingang waarvan [Titel IIB van het Vierde
      Boek van het Wetboek van Strafvordering](onbekend) toepassing vindt op aan de militaire rechtsmacht onderworpen
      personen, met dien verstande dat waar in enige bepaling van [die Titel][ref1] van "rechtbank" wordt gesproken,
      daaronder "krijgsraad" wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2013-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001903
