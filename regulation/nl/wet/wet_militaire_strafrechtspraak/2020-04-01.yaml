      1 Indien de omstandigheden ter plaatse dit nodig maken, kan de voorzitter van de mobiele rechtbank een of meer
      enkelvoudige kamers instellen onder de benaming van mobiele politierechter.

      2 Als mobiele politierechter fungeert een door de voorzitter van de mobiele rechtbank aan te wijzen lid van die
      rechtbank, welk lid bij voorkeur is een rechterlijk ambtenaar met rechtspraak belast.
