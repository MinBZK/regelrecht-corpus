      1 De militaire kamer van het gerechtshof Arnhem-Leeuwarden is bevoegd tot het oordeel in hoger beroep over de
      daarvoor vatbare vonnissen van de militaire kamers van de rechtbank Gelderland.

      2 De militaire kamer van het gerechtshof kan zitting houden buiten de zittingsplaatsen van het gerechtshof.
