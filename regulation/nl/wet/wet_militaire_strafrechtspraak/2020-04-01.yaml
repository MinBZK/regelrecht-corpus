      Onverminderd het bepaalde in [artikel 67 van het Wetboek van Strafvordering][ref1] kan een bevel tot voorlopige
      hechtenis eveneens worden gegeven in geval van verdenking van:

      a. een misdrijf omschreven in het [Wetboek van Militair Strafrecht][ref2] waarop naar de wettelijke omschrijving
      een gevangenisstraf van twee jaren of meer is gesteld;

      b. een der misdrijven omschreven in de [artikelen 98][ref3], [106, eerste lid][ref4], [127, eerste lid][ref5], en
      [136, eerste lid, aanhef en onder 1 van het Wetboek van Militair Strafrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0001869
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel106
      [ref5]: https://wetten.overheid.nl/BWBR0001869#Artikel127
      [ref6]: https://wetten.overheid.nl/BWBR0001869#Artikel136
