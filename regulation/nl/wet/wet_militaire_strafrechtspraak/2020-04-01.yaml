  - number: '60'
    text: |-
      1 In geval een verdachte buiten het Koninkrijk of binnen de territoriale zee in verzekering is gesteld, stelt
      degene die het bevel daartoe heeft gegeven, de officier van justitie hiervan onverwijld en op snelst mogelijke
      wijze in kennis. De officier van justitie doet, tenzij hij in het belang van het onderzoek anders beslist, de
      verdachte zo spoedig mogelijk voor zich geleiden.

      2 Indien en zolang de verbinding met de officier van justitie niet mogelijk is, blijft het bevel tot
      inverzekeringstelling van kracht tot het moment dat de verbinding is hersteld.
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel60
  - number: '61'
    text: |-
      1 Buiten het Koninkrijk kunnen opsporingsambtenaren de bevoegdheden uitoefenen welke aan hen zijn toegekend bij
      enige bepaling van een andere wet dan deze of het [Wetboek van Strafvordering][ref1], indien dat bij algemene
      maatregel van Rijksbestuur is bepaald.

      2 [Artikel 59][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel59
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '59'
        hoofdstuk: III
  - number: '62'
    text: |-
      Buiten het Koninkrijk kunnen bevoegdheden inzake opsporing, vervolging en berechting van strafbare feiten en
      tenuitvoerlegging van vonnissen slechts worden uitgeoefend voorzover het volkenrecht dit toelaat.
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel62
  - number: '63'
    text: Deze Rijkswet kan worden aangehaald als "Wet militaire strafrechtspraak".
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel63
  - number: '64'
    text: |-
      1 Deze Rijkswet treedt in werking met ingang van een nader bij koninklijk besluit te bepalen tijdstip.

      2 Bij koninklijk besluit kan voordien een tijdstip worden bepaald met ingang waarvan [Titel IIB van het Vierde
      Boek van het Wetboek van Strafvordering](onbekend) toepassing vindt op aan de militaire rechtsmacht onderworpen
      personen, met dien verstande dat waar in enige bepaling van [die Titel][ref1] van "rechtbank" wordt gesproken,
      daaronder "krijgsraad" wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001903
