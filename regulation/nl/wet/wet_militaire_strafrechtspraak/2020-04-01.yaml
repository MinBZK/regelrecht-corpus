  - number: '38'
    text: |-
      Bij de toepassing van [artikel 473, eerste lid, van het Wetboek van Strafvordering][ref1] zijn de
      [artikelen 26][ref2] en [27][ref3] mede van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel473
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel27
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel38
    references:
