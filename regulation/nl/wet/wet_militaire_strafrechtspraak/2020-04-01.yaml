  - number: '28'
    text: |-
      De strafbepalingen van het [Wetboek van Militair Strafrecht][ref1] en de gedragsregels van de
      [Wet militair tuchtrecht][ref2] zijn niet van toepassing op de schending van een bevel, dat aan de verdachte is
      gegeven ingevolge een bij de wet in het belang van strafvordering toegekende bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0004788
  - number: '29'
    text: |-
      1 [Artikel 46 van de Wet op de rechterlijke organisatie][ref1] is van toepassing met dien verstande, dat
      de rechters-commissarissen, belast met de behandeling van zaken betreffende strafbare feiten als bedoeld in
      [artikel 2 van deze rijkswet][ref2], worden benoemd uit de leden en plaatsvervangende leden van de militaire
      kamers.

      2 Een militair lid, dat ingevolge het eerste lid is benoemd tot rechter-commissaris, treedt als zodanig op met dien
      verstande dat hij:

      a. niet bevoegd is bevelen als bedoeld in de [artikelen 63][ref3], [206][ref4], [214][ref5] en
      [221 van het Wetboek van Strafvordering][ref6] te geven;

      b. alleen kan optreden indien het onderzoek van de zaak geheel of overwegend buiten Nederland plaatsvindt;

      c. buiten het geval bedoeld onder b, kan optreden, indien de zaak naar het oordeel van de voorzitter van de
      militaire kamer van zodanige aard is dat onderzoek door een militair lid de voorkeur verdient.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel206
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel214
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel221
