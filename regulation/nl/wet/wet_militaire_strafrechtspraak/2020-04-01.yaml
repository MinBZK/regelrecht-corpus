  - number: '11'
    text: |-
      1 Een mobiele rechtbank houdt zitting en beslist met drie leden, van wie twee, onder
      wie de voorzitter, rechterlijke ambtenaren met rechtspraak belast als bedoeld in
      [artikel 1, onderdeel c, van de Wet op de rechterlijke organisatie][ref1] zijn en één militair lid is.

      2 Indien een of twee rechterlijke ambtenaren met rechtspraak belast, bedoeld in het eerste lid, niet beschikbaar
      zijn, wordt hun plaats ingenomen door militaire leden. Ingeval slechts één rechterlijk ambtenaar met rechtspraak
      belast aanwezig is, fungeert deze als voorzitter. Indien geen rechterlijk ambtenaar met rechtspraak belast,
      aanwezig is, wordt de rechtbank voorgezeten door het militaire lid dat het oudste is in benoeming als militair lid.

      3 Op de militaire leden, bedoeld in het eerste en tweede lid, is
      [artikel 6, tweede, vierde, vijfde en zesde lid][ref2], van overeenkomstige toepassing, met dien verstande
      dat aan de bij of krachtens [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref3] gestelde
      beroepsvereisten bij voorkeur dient te worden voldaan. Tevens zijn de [artikelen 7, derde lid][ref4], [12][ref5] en
      [13 van de Wet op de rechterlijke organisatie][ref6] van overeenkomstige toepassing.

      4 Indien een mobiele rechtbank is ingesteld, worden bij koninklijk besluit op voordracht van Onze Minister van
      Justitie en Veiligheid, in overeenstemming met Onze Minister van Defensie, de voorzitter en zoveel leden als
      dienstig wordt geoordeeld, benoemd. Ingeval de in [artikel 10, tweede lid][ref7], bedoelde militaire autoriteit de
      rechtbank heeft ingesteld, benoemt hij de voorzitter en zoveel leden als hij dienstig oordeelt. Hij voert inzake
      die benoemingen zo mogelijk overleg met de genoemde ministers en de voorzitter van de mobiele rechtbank.


