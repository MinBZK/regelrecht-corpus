  - number: '18'
    text: |-
      1 Het Gemeenschappelijk Hof van Justitie oordeelt in hoger beroep over de daarvoor vatbare vonnissen van de
      gerechten in eerste aanleg.

      2 Bij het Gemeenschappelijk Hof van Justitie is een meervoudige kamer onder de benaming van militaire kamer.

      3 De behandeling van de in het eerste lid bedoelde zaken geschiedt bij uitsluiting door een militaire kamer.
      Deze kamer oordeelt over het beklag bedoeld in [artikel 12 van het Wetboek van Strafvordering][ref1], indien de
      persoon wiens vervolging wordt verlangd zich bevindt in binnen het in [artikel 17, eerste lid][ref2], bedoelde
      bevelsgebied.

      4 [Artikel 68, tweede lid, van de Wet op de rechterlijke organisatie][ref3], en de [artikelen 8, tweede lid][ref4],
      en [9, eerste en tweede lid][ref5], van deze rijkswet zijn van overeenkomstige toepassing met dien verstande dat
      de benoeming geschiedt overeenkomstig [artikel 23 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref6], aan de
      eisen van [artikel 24 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref7] zoveel mogelijk wordt voldaan en de
      militair tenminste een hoofdofficiersrang bekleedt.

      5 [Artikel 6, derde, vijfde en zesde lid][ref8], is van overeenkomstige toepassing.

      6 [Artikel 17, negende lid][ref9], is van overeenkomstige toepassing.

      7 Overdracht van een zaak die bij de militaire kamer van het gerechtshof Arnhem-Leeuwarden aanhangig is met
      betrekking tot een persoon die zich bevindt binnen het in [artikel 17, eerste lid][ref10], bedoelde bevelsgebied,
      naar het Gemeenschappelijk Hof van Justitie, dan wel overdracht van een zaak die bij het Gemeenschappelijk Hof
      van Justitie aanhangig is met betrekking tot een persoon die zich niet meer in het rechtsgebied van dit gerecht
      bevindt, naar het gerechtshof Arnhem-Leeuwarden kan plaatsvinden in de stand waarin de zaak zich op dat ogenblik
      bevindt. Uitvoering van deze overdracht geschiedt door het openbaar ministerie. Het hof waaraan de zaak wordt
      overgedragen is bevoegd in hoger beroep over de zaak te oordelen.


