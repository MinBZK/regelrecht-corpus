  - number: '2'
    text: |-
      1 Onverminderd de [artikelen 10][ref1] en [17][ref2] en behoudens de uitzonderingen bij de wet gemaakt, berust
      de bevoegdheid tot kennisneming in eerste aanleg van strafbare feiten, begaan door militairen en door hen die ten
      aanzien van zodanige feiten bij of krachtens de wet met Nederlandse militairen zijn gelijkgesteld, bij de rechtbank
      Gelderland.

      2 Zaken betreffende strafbare feiten als bedoeld in [artikel 382 van het Wetboek van Strafvordering][ref3] worden
      behandeld en beslist door de militaire kantonrechter van de rechtbank Gelderland. De overige zaken worden behandeld
      en beslist door de militaire kamers van de rechtbank Gelderland.

      3 In tijd van oorlog is het tweede lid niet van toepassing en nemen de militaire kamers van de rechtbank
      Gelderland, onverminderd het eerste lid, in eerste aanleg kennis van:

      1°. strafbare feiten begaan door militairen, door hen die ten aanzien van zodanige feiten bij of krachtens de wet
      met Nederlandse militairen zijn gelijkgesteld en door hen die binnen de Nederlandse krijgsmacht een bij koninklijk
      besluit aan te wijzen vitale functie vervullen;

      2°. strafbare feiten begaan door hen die buiten het grondgebied van het Koninkrijk deel uitmaken van de Nederlandse
      krijgsmacht;

      3°. strafbare feiten begaan door personen als bedoeld onder 4 van onderdeel A van artikel 4 van het Verdrag van
      Genève, betreffende de behandeling van krijgsgevangenen van 12 augustus 1949 (*Trb.* 1951, nr. 74) voor zover die
      personen de Nederlandse krijgsmacht volgen buiten het grondgebied van het Koninkrijk;

      4°. strafbare feiten door wie ook begaan in door de Nederlandse krijgsmacht bezet gebied, voorzover kennisneming
      daarvan in overeenstemming is met de regels door het volkenrecht erkend.

      4 De rechtsmacht van de rechtbank Gelderland strekt zich eveneens uit over de strafbare
      feiten, omschreven in de [Wet op de economische delicten][ref4]. In afwijking van
      [artikel 38, tweede volzin, van de Wet op de economische delicten][ref5] worden deze zaken behandeld en beslist
      door de militaire kamers van de rechtbank Gelderland.

      5 [Artikel 45, tweede lid, van de Wet op de rechterlijke organisatie][ref6] is van toepassing.

      6 Onder oorlog als bedoeld in het derde lid wordt mede verstaan: een gewapend conflict dat niet als oorlog kan
      worden aangemerkt en waarbij het Koninkrijk is betrokken, hetzij ter individuele of collectieve zelfverdediging,
      hetzij tot herstel van internationale vrede en veiligheid.


