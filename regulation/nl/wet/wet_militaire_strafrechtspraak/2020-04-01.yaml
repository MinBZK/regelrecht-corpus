  - number: '10'
    text: |-
      1 Bij koninklijk besluit kunnen op voordracht van Onze Ministers van Justitie en Veiligheid en van Defensie, in het
      gebied waarvoor een uitzonderingstoestand is afgekondigd, of voor de berechting buiten het Koninkrijk een of meer
      mobiele rechtbanken worden ingesteld.

      2 Bij koninklijk besluit kan worden bepaald dat een daarbij aan te wijzen militaire autoriteit in het gebied
      waarvoor een uitzonderingstoestand is afgekondigd, een of meer mobiele rechtbanken kan instellen.

      3 [Artikel 2][ref1], met uitzondering van het tweede lid, is van overeenkomstige toepassing op een mobiele
      rechtbank.

      4 Indien meer dan een mobiele rechtbank worden ingesteld wordt bij het ingevolge het eerste of tweede lid genomen
      koninklijk besluit hun onderlinge betrekkelijke bevoegdheid geregeld. De militaire kamers van de rechtbank
      Gelderland nemen bij voorkeur geen kennis van een feit waarvan ook een mobiele rechtbank kan kennis nemen.

      5 Zodra de omstandigheden die tot de instelling van een mobiele rechtbank hebben geleid, hebben opgehouden te
      bestaan, of zoveel eerder als dienstig wordt geoordeeld, wordt die mobiele rechtbank bij koninklijk besluit op
      voordracht van Onze Ministers van Justitie en Veiligheid en van Defensie opgeheven. In het koninklijk besluit wordt
      tevens de afdoening van de nog bij die rechtbank aanhangige zaken geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
