  - number: '9'
    text: |-
      1 De militaire leden, bedoeld in [artikel 68, tweede lid, van de Wet op de rechterlijke organisatie][ref1] worden
      op voordracht van Onze Minister van Justitie en Veiligheid, in overeenstemming met Onze Minister van Defensie bij
      koninklijk besluit benoemd.

      2 Tot militair lid wordt slechts benoemd een militair die voldoet aan de bij of krachtens
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref2] gestelde beroepsvereisten, die ten minste de
      rang van kapitein ter zee of kolonel bekleedt en die niet behoort tot de Koninklijke marechaussee.

      3 Aan militairen met de rang van kapitein ter zee of kolonel wordt als militair lid de titulaire rang van
      commandeur, brigade-generaal of commodore toegekend.

      4 [Artikel 6, derde, vierde, vijfde en zesde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel68
