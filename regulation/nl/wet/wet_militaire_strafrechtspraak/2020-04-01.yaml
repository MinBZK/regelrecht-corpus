  - number: '22'
    text: |-
      1 De raadkamer van een gerecht bedoeld in deze rijkswet kan een verhoor van een persoon die zich buiten het
      Europese deel van Nederland bevindt, opdragen aan een van de leden van een militaire kamer van de rechtbank
      Gelderland van een krachtens [artikel 10][ref1] ingestelde mobiele rechtbank of van een militaire kamer van het
      gerecht in eerste aanleg bedoeld in [artikel 17, eerste lid][ref2].

      2 Een opdracht als bedoeld in het eerste lid wordt bij voorkeur niet gegeven aan een lid, dat op enigerlei wijze
      bij de behandeling van een zaak betrokken is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel17
