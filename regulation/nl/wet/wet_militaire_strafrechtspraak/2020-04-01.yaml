  - number: '57'
    text: |-
      1 [Artikel 344, eerste lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing op
      geschriften opgemaakt door de in dat artikel bedoelde colleges, ambtenaren of personen van Aruba, Curaçao en Sint
      Maarten en van de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 [Artikel 344, tweede lid, van het Wetboek van Strafvordering][ref2] is van overeenkomstige toepassing op het
      proces-verbaal van een opsporingsambtenaar van Aruba, Curaçao en Sint Maarten en van de openbare lichamen Bonaire,
      Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel344
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel344
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '344'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '344'
  - number: '58'
    text: |-
      In Aruba, Curaçao en Sint Maarten en in de openbare lichamen Bonaire, Sint Eustatius en Saba kunnen
      opsporingsambtenaren bij de uitoefening van hun bevoegdheden niet dan met inachtneming van de grenzen in de ter
      plaatse geldende wetgeving voor de gewone strafvordering gesteld, inbreuk maken op de rechten van niet aan de in
      [artikel 2][ref1] bedoelde rechtsmacht onderworpen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '2'
        hoofdstuk: II
  - number: '59'
    text: |-
      1 Buiten het Koninkrijk of binnen de territoriale zee kunnen door Onze Ministers van Justitie en Veiligheid en
      van Defensie aan te wijzen bevelvoerende militairen, indien en zolang geen hulpofficier van justitie aanwezig is
      en diens komst niet kan worden afgewacht, de bevoegdheden uitoefenen welke het [Wetboek van Strafvordering][ref1]
      toekent aan de hulpofficier van justitie.

      2 Indien en zolang geen opsporingsambtenaar aanwezig is en diens komst niet kan worden afgewacht,
      kunnen de krachtens het voorgaande lid aangewezen militairen de bevoegdheden uitoefenen welke het
      [Wetboek van Strafvordering][ref2] toekent aan de opsporingsambtenaar.

      3 [Artikel 539b, eerste, tweede en derde lid, van het Wetboek van Strafvordering][ref3] is van overeenkomstige
      toepassing.

      4 [Artikel 539e, eerste lid, van het Wetboek van Strafvordering][ref4] is van overeenkomstige toepassing met dien
      verstande dat de verrichting bedoeld in [artikel 57, eerste lid, van dat wetboek][ref5] niet kan worden opgedragen.

      5 [Artikel 539f, eerste, tweede, vierde en vijfde lid, van het Wetboek van Strafvordering][ref6] is van
      overeenkomstige toepassing.

      6 [Artikel 344, tweede lid, van het Wetboek van Strafvordering][ref7] is van overeenkomstige toepassing op het
      proces-verbaal van een krachtens het eerste lid aangewezen militair.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel539b
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel539e
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel539f
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel344
