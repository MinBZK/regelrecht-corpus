  - number: '6'
    text: |-
      1 De militaire leden, bedoeld in [artikel 55, tweede lid, van de Wet op de rechterlijke organisatie][ref1] worden
      op voordracht van Onze Minister van Justitie en Veiligheid, in overeenstemming met Onze Minister van Defensie, bij
      koninklijk besluit benoemd.

      2 Om te kunnen worden benoemd tot militair lid, moet men militair zijn en voldoen aan de bij of krachtens
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref2] gestelde beroepsvereisten en niet behoren tot de
      Koninklijke marechaussee.

      3 De militaire leden worden voor de tijd van vier jaren benoemd. Zij zijn bij hun aftreden tweemaal herbenoembaar.
      Het militaire lid wordt op eigen verzoek bij koninklijk besluit ontslagen. Indien het militair lid niet meer
      voldoet aan een van de eisen, genoemd in het tweede lid, heeft dit van rechtswege ontslag als militair lid tot
      gevolg.

      4 Op de militaire leden zijn de [artikelen 4][ref3], [5g][ref4], [46c tot en met 46g][ref5], [46i][ref6]
      met uitzondering van het eerste lid, onderdeel c, [46j][ref7], [46l][ref8], [46m][ref9], [46o][ref10] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref11] van overeenkomstige toepassing.

      5 De militaire leden genieten vergoeding voor reis- en verblijfkosten volgens bij algemene maatregel van
      Rijksbestuur te stellen regelen.

      6 Alles wat de wijze van eedsaflegging, het kostuum van de militaire leden alsmede de werkwijze van de militaire
      kamers aangaat, wordt geregeld bij algemene maatregel van Rijksbestuur.


