  - number: '4'
    text: |-
      1 De ingevolge de voorgaande artikelen toegekende bevoegdheden lijden uitzondering in het geval van deelneming aan
      strafbare feiten van iemand die niet valt onder de rechtsmacht, in [artikel 2][ref1] omschreven.

      2 In dat geval vindt vervolging bij voorkeur plaats voor de rechter in Nederland, tot kennisneming van door de
      deelnemer begane feiten bevoegd.

      3 Vervolging vindt in elk geval steeds plaats bij de militaire kamers van de rechtbank Gelderland, indien:

      a. het betreft een feit strafbaar gesteld in het [Wetboek van Militair Strafrecht][ref2], in welk geval
      [artikel 6 van het Wetboek van Strafvordering][ref3] niet van toepassing is;

      b. ten aanzien van de deelnemers geen vervolging wordt ingesteld, van verdere vervolging wordt afgezien of
      berechting door de kinderrechter plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001869
