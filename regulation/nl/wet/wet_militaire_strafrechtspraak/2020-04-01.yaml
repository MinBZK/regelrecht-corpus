      1 Het rechtsgebied van de rechtbank Gelderland is met betrekking tot de in [artikel 2][ref1] omschreven rechtsmacht
      onbegrensd, doch strekt zich niet uit over het rechtsgebied van enig ander bij of krachtens deze rijkswet
      aangewezen gerecht, tot de uitoefening van de in artikel 2 omschreven rechtsmacht bevoegd.

      2 De militaire kamers van de rechtbank Gelderland kunnen zitting houden buiten de zittingsplaatsen van de
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
