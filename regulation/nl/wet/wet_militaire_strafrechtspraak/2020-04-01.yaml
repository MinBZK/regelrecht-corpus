preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe voorschriften te geven inzake de organisatie van
    de militaire strafrechtspraak, alsmede enige bepalingen inzake de daarbij plaatsvindende wijze van strafvordering;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De zowel in deze rijkswet als in het [Wetboek van Militair Strafrecht][ref1] voorkomende uitdrukkingen hebben in
      beide dezelfde betekenis met dien verstande dat in deze rijkswet onder militairen niet worden begrepen militairen
      die Gouverneur, minister, staatssecretaris, lid van de Staten van Aruba, Curaçao of Sint Maarten of lid van de
      Staten-Generaal zijn. [Artikel 61 van het Wetboek van Militair Strafrecht][ref2] is van toepassing.

      2 In deze rijkswet wordt verstaan onder:

        - *Wetboek van Strafvordering:* het [Wetboek van Strafvordering][ref3] van het Europese deel van Nederland;
        - *Wetboek van Strafrecht:* het [Wetboek van Strafrecht][ref4] van het Europese deel van Nederland;
        - *Gemeenschappelijk Hof van Justitie:* het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao en Sint Maarten
      en van Bonaire, Sint Eustatius en Saba;
        - *Gerechten in eerste aanleg:* het Gerecht in eerste aanleg van Aruba, het Gerecht in eerste aanleg van Curaçao,
      het Gerecht in eerste aanleg van Sint Maarten en het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;
        - *Militaire kamers:* de kamers, bedoeld in de [artikelen 49][ref5] en
      [55 van de Wet op de rechterlijke organisatie][ref6].

      3 Het [Wetboek van Strafvordering][ref7] is van toepassing, tenzij daarvan in deze rijkswet wordt afgeweken.


