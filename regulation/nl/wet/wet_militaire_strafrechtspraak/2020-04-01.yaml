  - number: '27'
    text: |-
      1 Onverminderd het bepaalde in [artikel 67][ref1] kan een op het voorgaand artikel of op
      [artikel 67 van dat wetboek][ref2] gegrond bevel eveneens worden gegeven, indien uit bepaalde omstandigheden blijkt
      van een gewichtige reden van militaire veiligheid, welke de onverwijlde vrijheidsbeneming vordert.

      2 Een gewichtige reden van militaire veiligheid kan voor de toepassing van het vorige lid slechts in aanmerking
      worden genomen:

      1°. indien er ernstig rekening mee moet worden gehouden, dat de verdachte een misdrijf zal begaan als rechtstreeks
      en onmiddellijk gevolg waarvan schade ontstaat aan of te duchten is voor de gereedheid tot het daadwerkelijk
      uitvoeren van een operatie of oefening van enig onderdeel van de krijgsmacht;

      2°. indien er ernstig rekening mee moet worden gehouden dat zonder onverwijlde vrijheidsbeneming van de verdachte
      andere militairen een misdrijf zullen begaan als rechtstreeks en onmiddellijk gevolg waarvan schade ontstaat aan
      of te duchten is voor de gereedheid tot het daadwerkelijk uitvoeren van een operatie of oefening van enig onderdeel
      van de krijgsmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel27
