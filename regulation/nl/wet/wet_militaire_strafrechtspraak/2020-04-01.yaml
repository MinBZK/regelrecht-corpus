  - number: '14'
    text: |-
      1 Bij een mobiele rechtbank worden op de wijze, in [artikel 11, vierde lid][ref1], voorzien, gerechtsambtenaren,
      rechterlijke ambtenaren in opleiding of gerechtsauditeurs benoemd die de werkzaamheden verrichten die bij of
      krachtens de wet aan de griffier zijn opgedragen.

      2 Bij afwezigheid van de gerechtsambtenaren, rechterlijke ambtenaren in opleiding of gerechtsauditeurs kunnen met
      de waarneming van de griffierstaken militairen worden belast. Het daartoe strekkend besluit wordt bij koninklijk
      besluit genomen op voordracht van Onze Ministers van Justitie en Veiligheid en Defensie, of, indien zodanig besluit
      niet kan worden afgewacht, door de voorzitter van de mobiele rechtbank.

      3 Op de waarnemende militairen, bedoeld in het tweede lid, zijn de
      [artikelen 6, vijfde en zesde lid van deze rijkswet][ref2], en [13][ref3] en
      [14, zevende lid, van de Wet op de rechterlijke organisatie][ref4] van overeenkomstige toepassing. Tevens
      is [artikel 1 van het Besluit beëdiging en vergoeding buitengriffiers en waarnemend griffiers][ref5] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel11
