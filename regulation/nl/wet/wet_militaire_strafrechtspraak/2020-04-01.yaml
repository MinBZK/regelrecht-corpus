  - number: '17'
    text: |-
      1 Het Gerecht in eerste aanleg van Aruba, het Gerecht in eerste aanleg van Curaçao, het Gerecht in eerste aanleg
      van Sint Maarten en het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba oefenen de rechtsmacht
      omschreven in [artikel 2][ref1] uit voorzover de verdachte zich bevindt binnen het bij koninklijk besluit vast
      te stellen bevelsgebied van de hoogste bevelvoerende militair in Aruba, Curaçao en Sint Maarten en in de openbare
      lichamen Bonaire, Sint Eustatius en Saba.

      2 Het Gerecht in eerste aanleg van het in het eerste lid genoemde land waar de verdachte zich bevindt, oefent de in
      het eerste lid omschreven rechtsmacht uit.

      3 Bij de Gerechten in eerste aanleg zijn een meervoudige en een enkelvoudige kamer onder de benaming militaire
      kamers. Het lid van een enkelvoudige kamer draagt de titel van militaire politierechter.

      4 De behandeling van de in het eerste lid bedoelde zaken geschiedt bij uitsluiting door een militaire kamer.

      5 [Artikel 4][ref2] is van overeenkomstige toepassing ten aanzien van zich binnen het in het eerste lid bedoelde
      bevelsgebied bevindende personen.

      6 [Artikel 55, tweede en derde lid, van de Wet op de rechterlijke organisatie][ref3] is van overeenkomstige
      toepassing met dien verstande dat twee leden van een meervoudige kamer, onder wie de voorzitter, lid zijn van het
      Gemeenschappelijk Hof van Justitie en dat de functie van militaire politierechter wordt vervuld door een lid van
      het Gemeenschappelijk Hof van Justitie.

      7 [Artikel 10, tweede en derde lid, van de Rijkswet Gemeenschappelijk Hof van Justitie][ref4], is van
      overeenkomstige toepassing.

      8 De benoeming van een militair lid in de militaire kamer van het Gerecht in eerste aanleg geschiedt
      op de wijze zoals neergelegd in [artikel 23 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref5].
      Om te kunnen worden benoemd tot militair lid moet men militair zijn en niet behoren tot de Koninklijke
      marechaussee. [Artikel 6, derde lid][ref6], is van overeenkomstige toepassing. Aan de vereisten omschreven in
      [artikel 24, eerste lid, onder a en b, van de Rijkswet Gemeenschappelijk Hof van Justitie][ref7] dient bij voorkeur
      te worden voldaan.

      9 Op de militaire leden zijn de [artikelen 6][ref8], [12, vierde lid][ref9], [13, derde lid][ref10],
      [27 tot en met 34][ref11], [36][ref12] en [46 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref13] van
      overeenkomstige toepassing, voor zover die artikelen niet afwijken van het in deze wet bepaalde.

      10 [Artikel 6, vijfde en zesde lid][ref14], is van overeenkomstige toepassing, met dien verstande
      dat de eedaflegging door de militaire leden geschiedt op de wijze zoals is vastgelegd in
      [artikel 28 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref15].

      11 Overdracht van een zaak die in eerste aanleg bij een militaire kamer van de rechtbank Gelderland of bij een
      mobiele rechtbank aanhangig is met betrekking tot een persoon die zich bevindt binnen het in het eerste lid
      bedoelde bevelsgebied, dan wel overdracht van een zaak die bij een militaire kamer van een der in het eerste
      lid genoemde gerechten in eerste aanleg aanhangig is met betrekking tot een persoon die zich niet meer in het
      rechtsgebied van deze gerechten bevindt, naar de militaire kamer van de rechtbank Gelderland of naar een mobiele
      rechtbank, kan plaatsvinden in de stand waarin de zaak zich op dat ogenblik bevindt. Uitvoering van deze overdracht
      geschiedt door het openbaar ministerie.


