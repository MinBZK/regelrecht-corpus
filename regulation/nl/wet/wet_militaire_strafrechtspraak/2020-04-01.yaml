      - id: ref3
        bwb_id: BWBR0004789
        artikel: '27'
        hoofdstuk: III
  - number: '39'
    text: |-
      De [artikelen 495][ref1], [499][ref2] en [500 van het Wetboek van Strafvordering][ref3] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel495
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel499
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel500
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '495'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '499'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '500'
  - number: '40'
    text: |-
      De [artikelen 510][ref1] en [511 van het Wetboek van Strafvordering][ref2] vinden geen toepassing ten aanzien van
      de militaire leden van een militaire kamer of van een mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel510
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel511
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '510'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '511'
  - number: '41'
    text: |-
      De bevoegdheden bedoeld in [artikel 551 van het Wetboek van Strafvordering][ref1] kunnen mede worden uitgeoefend
      in geval van een strafbaar feit als omschreven in de [Eerste Titel van het Tweede Boek van het Wetboek van Militair
      Strafrecht](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel551
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '551'
  - number: '42'
    text: |-
      In afwijking van het bepaalde in
      [artikel 36e, eerste lid, aanhef en onder b, en derde lid, van het Wetboek van Strafvordering][ref1] kan het
      gerechtelijk schrijven bestemd voor hen die feitelijk in werkelijke dienst verblijven worden uitgereikt op het
      adres van het onderdeel of dienstvak, waarbij zij zijn ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36e
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36e
  - number: '43'
    text: |-
      Op de mobiele rechtbank en de ambtsdragers bij dat college zijn van overeenkomstige toepassing:

      a. het bepaalde in het [Wetboek van Strafvordering][ref1] met betrekking tot de rechtbank en de ambtsdragers
      daarbij;

      b. het bepaalde in [de titels I-V][ref2] en [VIII van dit hoofdstuk][ref3] met betrekking tot de rechtbank, de
      militaire kamers en de ambtsdragers daarbij voorzover daarvan in deze titel niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0004789
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004789
        hoofdstuk: III
  - number: '44'
    text: |-
      1 Indien de benoeming van de rechter-commissaris niet kan geschieden op de wijze als in de
      [Wet op de rechterlijke organisatie][ref1] voorzien, benoemt de voorzitter van de mobiele rechtbank een of meer
      leden tot rechter-commissaris voor de tijd van één jaar. Deze is steeds weer dadelijk benoembaar.

      2 Het bepaalde in [artikel 29, tweede lid][ref2], is niet van toepassing indien er geen rechterlijke ambtenaren
      met rechtspraak belast als bedoeld in [artikel 1, onderdeel c, van de Wet op de rechterlijke organisatie][ref3]
      beschikbaar zijn om tot rechter-commissaris te worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001830
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '29'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '1'
  - number: '45'
    text: |-
      De [Noodwet rechtspleging][ref1] is niet van toepassing op de mobiele rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002457
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002457
  - number: '46'
    text: |-
      Indien zulks noodzakelijk is om de militaire strafrechtspraak te waarborgen, kan Onze Minister van Justitie en
      Veiligheid bepalen dat:

      a. in het rechtsgebied van een mobiele rechtbank:

      1°. de termijnen genoemd in de [artikelen 58][ref1] en [64 van het Wetboek van Strafvordering][ref2] tijdelijk
      zijn verdubbeld;

      2°. tijdelijk bij dagvaarding betreffende een strafbaar feit kan worden volstaan met een korte aanduiding van het
      feit dat te laste wordt gelegd met vermelding omstreeks welke tijd en waar ter plaatse het begaan zou zijn, en de
      termijnen genoemd in [artikel 265 van het Wetboek van Strafvordering][ref3] en [artikel 32 van deze rijkswet][ref4]
      ook zonder toestemming van de verdachte tijdelijk kunnen worden verkort, een en ander voorzover de verdachte
      daardoor naar het oordeel van de rechtbank niet in zijn verdediging wordt geschaad;

      b. de mobiele rechtbank wettelijke voorschriften betreffende de termijnen en vormen, indien deze ten gevolge van
      de bijzondere omstandigheden in redelijkheid niet konden of kunnen worden in acht genomen, buiten beschouwing kan
      laten;

      c. de beslissingen in zaken van bepaalde mobiele rechtbanken niettegenstaande de [artikelen 6:1:16][ref5] en
      [6:7:1 tot en met 6:7:5 van het Wetboek van Strafvordering][ref6] ten uitvoer kunnen worden gelegd. Zodra de
      uitvoering van een beslissing een aanvang heeft genomen, vervallen de gewone rechtsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel265
      [ref4]: https://wetten.overheid.nl/BWBR0004789#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel6116
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel671
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel46
