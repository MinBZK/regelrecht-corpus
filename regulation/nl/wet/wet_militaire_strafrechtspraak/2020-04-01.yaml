  - number: '30'
    text: |-
      Ingeval van overdracht van een zaak aan een ander gerecht na aanvang van het onderzoek op de terechtzitting, zal
      dat gerecht het onderzoek opnieuw aanvangen.
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel30
  - number: '31'
    text: |-
      1 In afwijking van het bepaalde in [artikel 342, tweede lid, van het Wetboek van Strafvordering][ref1] kan de
      verklaring van een meerdere of gewezen meerdere volledig bewijs van schuld opleveren, indien zij betrekking heeft
      op de schending van een door hem gegeven dienstbevel, dan wel op een tegen hem gepleegde feitelijke insubordinatie
      of muiterij.

      2 De militair die zich beroept op een grond die overeenkomstig een van de
      [artikelen 40-43 van het Wetboek van Strafrecht][ref2] de strafbaarheid van een door hem als schildwacht gepleegd
      feit zou uitsluiten, wordt geacht rechtmatig te hebben gehandeld, tenzij het tegendeel aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel342
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel40
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '342'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '40'
  - number: '32'
    text: De termijn van dagvaarding voor de militaire politierechter en de militaire kantonrechter is tenminste vijf dagen.
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel32
  - number: '33'
    text: |-
      1 Bij algemene maatregel van Rijksbestuur worden regels gesteld met betrekking tot de vergoeding voor reis- en
      verblijfkosten van de verdachte die in verband met de uitoefening van de dienst in een ander land verblijft dan
      waarin de rechter zitting houdt, voorzover de rechter zijn verschijning in persoon heeft bevolen.

      2 Onze Minister van Justitie en Veiligheid kan aan de verdachte een tegemoetkoming in de reis- en verblijfkosten
      verlenen, indien de rechter zijn verschijning in persoon heeft bevolen en betrokkene naar het oordeel van Onze
      Minister zeer hoge kosten heeft moeten maken.
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel33
  - number: '35'
    text: In geval van hoger beroep is de vorige titel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel35
  - number: '36'
    text: |-
      In geval van verwijzing als bedoeld in
      [artikel 440, tweede lid, tweede volzin, van het Wetboek van Strafvordering][ref1], wordt de zaak verwezen:

      a. wanneer de vernietigde uitspraak is gedaan door een militaire kamer van de rechtbank Gelderland, naar het
      gerechtshof Arnhem-Leeuwarden;

      b. wanneer zij is gedaan door de militaire kamer van het gerechtshof Arnhem-Leeuwarden, naar datzelfde gerechtshof.

      De verwezen zaak wordt behandeld door de militaire kamer. Aan de behandeling van de verwezen zaak nemen bij
      voorkeur geen leden deel die op enigerlei wijze bij de behandeling van de zaak betrokken zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel440
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '440'
  - number: '37'
    text: |-
      1 Bij toepassing van [artikel 471, eerste lid][ref1], en
      [artikel 472, eerste en tweede lid, van het Wetboek van Strafvordering][ref2] vindt, indien de in die artikelen
      bedoelde gevallen betrekking hebben op zaken als bedoeld in [artikel 2][ref3], verwijzing plaats naar het
      gerechtshof Arnhem-Leeuwarden.

      2 Bij toepassing van [artikel 482g, eerste lid, van het Wetboek van Strafvordering][ref4] vindt, indien de in die
      artikelen bedoelde gevallen betrekking hebben op zaken als bedoeld in [artikel 2][ref5], verwijzing plaats naar de
      rechtbank Gelderland.

      3 Aan de behandeling van de verwezen zaak nemen bij voorkeur geen leden deel die op enigerlei wijze bij de
      behandeling van die zaak betrokken zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel471
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel472
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel482g
      [ref5]: https://wetten.overheid.nl/BWBR0004789#Artikel2
