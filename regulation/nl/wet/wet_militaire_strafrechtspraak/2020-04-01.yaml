  - number: '52'
    text: |-
      [Artikel 22][ref1] is van overeenkomstige toepassing ten aanzien van het verhoor van een persoon die zich buiten
      Aruba, Curaçao of Sint Maarten of buiten de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel22
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '22'
        hoofdstuk: III
  - number: '53'
    text: |-
      1 Onverminderd het bepaalde in [artikel 23][ref1] kunnen in Aruba, Curaçao en Sint Maarten en in de openbare
      lichamen Bonaire, Sint Eustatius en Saba ook als raadsman worden toegelaten personen die bevoegd zijn om aldaar als
      raadsman in strafzaken op te treden.

      2 Als raadsman van de verdachte kunnen bij de Hoge Raad ook optreden advocaten, ingeschreven bij het
      Gemeenschappelijk Hof van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel23
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '23'
        hoofdstuk: III
  - number: '54'
    text: |-
      Onverminderd het bepaalde in [artikel 29][ref1] kan een militair lid als rechter-commissaris optreden indien het
      onderzoek van de zaak geheel of overwegend buiten Aruba, Curaçao of Sint Maarten of buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel29
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '29'
        hoofdstuk: III
  - number: '55'
    text: |-
      Onverminderd het bepaalde in [artikel 279 van het Wetboek van Strafvordering][ref1]
      kan in zaken betreffende overtredingen, met uitzondering van die bedoeld in
      [artikel 382, onder b, onder 1° tot en met 6°, van het Wetboek van Strafvordering][ref2], de verdachte zich op de
      terechtzitting doen vertegenwoordigen door een daartoe bij bijzondere volmacht schriftelijke gemachtigde, tenzij de
      rechter beveelt dat hij in persoon zal verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel279
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel382
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '279'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '382'
  - number: '56'
    text: |-
      In de gevallen van verwijzing als bedoeld in de [artikelen 36, eerste volzin][ref1], en [37, eerste volzin][ref2],
      vindt de behandeling van de zaak door de militaire kamer van het Gemeenschappelijk Hof van Justitie plaats op de
      wijze als voorzien in [artikel 36, tweede volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel36
