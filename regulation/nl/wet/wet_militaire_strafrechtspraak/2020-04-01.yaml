  - number: '24'
    text: |-
      1 De militair die ingeval van ontdekking op heterdaad van een misdrijf een mindere als verdachte aanhoudt, heeft
      het recht daarbij de hulp in te roepen van andere militairen. Deze zijn verplicht aan de vordering onmiddellijk
      te voldoen.

      2 De militair die ingeval van ontdekking op heterdaad van een misdrijf een mindere als verdachte aanhoudt,
      kan hem indien zijn overlevering aan een opsporingsambtenaar niet kan worden afgewacht, overleveren of
      doen overleveren aan de bevelvoerende militair van de eenheid waartoe de verdachte behoort of aan een
      andere door Onze Minister van Defensie aan te wijzen bevelvoerende militair. De verplichting omschreven in
      [artikel 53, derde lid, van het Wetboek van Strafvordering][ref1] gaat in dat geval over op die bevelvoerende
      militair.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel53
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '53'
  - number: '25'
    text: |-
      Onverminderd het bepaalde in [artikel 57 van het Wetboek van Strafvordering][ref1] kan de officier van justitie
      of de hulpofficier van justitie voor wie degene, die verdacht wordt van een van de misdrijven omschreven in de
      [artikelen 96-104][ref2], [109][ref3] of [110 van het Wetboek van Militair Strafrecht][ref4], wordt geleid of
      die zelf die verdachte heeft aangehouden, na hem te hebben gehoord, bevelen dat hij naar zijn eenheid zal worden
      overgebracht, teneinde aldaar ter beschikking van de bevelvoerende militair van de eenheid waartoe de verdachte
      behoort te worden gesteld. Het bevel kan slechts worden gegeven, indien er een redelijk vermoeden bestaat dat de
      verdachte niet uit eigen beweging naar zijn eenheid zal terugkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel57
