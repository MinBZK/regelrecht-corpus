        artikel: '46'
        hoofdstuk: III
  - number: '48'
    text: |-
      Krachtens de [artikelen 46][ref1] en [47][ref2] door Onze Minister van Justitie en Veiligheid te nemen besluiten
      treden, tenzij daarbij anders is bepaald, in werking met ingang van de dag na die van hun bekendmaking. Daarin kan
      worden bepaald dat zij onmiddellijk na hun bekendmaking in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel47
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '46'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '47'
        hoofdstuk: III
  - number: '49'
    text: |-
      1 Krachtens de [artikelen 46][ref1], [47][ref2] en [48][ref3] door Onze Minister van Justitie en Veiligheid te
      nemen besluiten worden bekend gemaakt in de Nederlandse Staatscourant.

      2 Indien het landsbelang dit naar zijn oordeel noodzakelijk maakt, kan de Minister van Justitie en Veiligheid een
      besluit als bedoeld in het voorgaande lid op andere wijze bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0004789#Artikel48
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '46'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '47'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004789
        artikel: '48'
        hoofdstuk: III
  - number: '50'
    text: |-
      1 Indien en voor zolang de verbinding met Onze Minister van Justitie en Veiligheid is verbroken, oefent de in
      [artikel 10, tweede lid][ref1], bedoelde militaire autoriteit, ten aanzien van een door hem ingestelde mobiele
      rechtbank, de bevoegdheden uit, die in de [artikelen 46][ref2] en [47][ref3] aan Onze Minister van Justitie en
      Veiligheid zijn toegekend.

      2 De [artikelen 48][ref4] en [49][ref5] zijn in dat geval van overeenkomstige toepassing met dien verstande dat
      voor de Minister van Justitie en Veiligheid wordt gelezen de in het eerste lid bedoelde militaire autoriteit.


