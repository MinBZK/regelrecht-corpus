  - number: '12'
    text: |-
      1 Zodra een mobiele rechtbank feitelijk optreedt, kunnen zaken die bij de militaire kamers van de rechtbank
      Gelderland aanhangig zijn en tot de bevoegdheid van die mobiele rechtbank behoren, aan deze worden overgedragen in
      de stand, waarin zij zich op dat ogenblik bevinden.

      2 Overdracht van een zaak die bij een mobiele rechtbank aanhangig is, naar een andere mobiele rechtbank of naar de
      militaire kamers van de rechtbank Gelderland kan plaatsvinden in de stand, waarin zij zich op dat ogenblik bevindt.

      3 Uitvoering van dit artikel geschiedt door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004789/2020-04-01#Artikel12
  - number: '13'
    text: |-
      1 Bij een mobiele rechtbank zijn met de handhaving van de wetten, met de vervolging van strafbare
      feiten en het doen uitvoeren van de vonnissen belast leden van het openbaar ministerie. De
      [artikelen 2, derde lid][ref1], [5][ref2], en [5f van de Wet rechtspositie rechterlijke ambtenaren][ref3] en
      [artikel 136, vijfde lid, van de Wet op de rechterlijke organisatie][ref4] zijn van overeenkomstige toepassing met
      dien verstande dat de benoeming geschiedt op de wijze in [artikel 11, vierde lid][ref5], voorzien.

      2 Bij afwezigheid van leden van het openbaar ministerie kunnen met de waarneming van de taak van het openbaar
      ministerie militairen worden belast. Het daartoe strekkend besluit wordt bij koninklijk besluit genomen op
      voordracht van Onze Ministers van Justitie en Veiligheid en Defensie, of indien zodanig besluit niet kan worden
      afgewacht, door de voorzitter van de rechtbank.

      3 Op de waarnemende militairen, bedoeld in het tweede lid, is [artikel 6, vijfde en zesde lid][ref6], van
      overeenkomstige toepassing, met dien verstande dat zij bij voorkeur dienen te voldoen aan de bij of krachtens
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref7] gestelde beroepsvereisten. Tevens is
      [artikel 13 van de Wet op de rechterlijke organisatie][ref8] van overeenkomstige toepassing.


