  - number: '23'
    text: |-
      1 Als raadslieden kunnen worden toegelaten degenen die worden genoemd in
      [artikel 37 van het Wetboek van Strafvordering][ref1], alsmede officieren, met dien verstande dat dezen niet worden
      toegelaten bij beroep in cassatie.

      2 Voor het optreden buiten het Europese deel van Nederland kan een advocaat alleen worden toegevoegd, indien hij
      zich daartoe bereid heeft verklaard.

      3 Een officier kan alleen in plaats van een advocaat worden toegevoegd, indien de verdachte daarom uitdrukkelijk
      verzoekt en hij overeenkomstig [artikel 28a van het Wetboek van Strafvordering][ref2] vrijwillig en ondubbelzinnig
      afstand heeft gedaan van zijn recht op een advocaat. De toevoeging van een officier geschiedt door de voorzitter
      van de militaire kamer van de rechtbank, dan wel van het gerechtshof, waarvoor de zaak moet dienen. In het Europese
      deel van Nederland kan een officier alleen worden toegevoegd, indien hij zich daartoe bereid heeft verklaard.
      Een toegevoegde officier is, onverminderd het bepaalde in [artikel 44 van het Wetboek van Strafvordering][ref3],
      verplicht als raadsman op te treden.

      4 Onder advocaat in het [Wetboek van Strafvordering][ref4] wordt begrepen een officier die als raadsman optreedt.
      Het bepaalde in de [artikelen 37][ref5], [39][ref6] en [43, eerste en tweede lid van dat wetboek][ref7] is echter
      niet van toepassing op een officier die als raadsman optreedt.

      5 Een officier die als raadsman optreedt, geniet vergoeding voor reis- en verblijfskosten volgens bij algemene
      maatregel van Rijksbestuur te stellen regelen.


