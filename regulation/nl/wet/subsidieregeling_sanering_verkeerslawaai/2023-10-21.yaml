  - number: '25'
    text: |-
      1 Na ontvangst van een volledig ingevuld formulier UK/S ten behoeve van maatregelen als bedoeld in
      [artikel 3, eerste lid, onderdeel e][ref1], stelt de Minister de subsidie voor voorbereiding, begeleiding en
      toezicht vast op:

      a. 18% van het bedrag van de verlening van de subsidie voor de maatregelen, als bedoeld in
      [artikel 3, eerste lid, onderdeel a tot en met d][ref2], daarbij wijzigingen als gevolg van toepassing van
      [artikel 30][ref3] of [31][ref4] niet meegerekend.

      b. Indien het project uitsluitend of tevens maatregelen betreft als bedoeld in
      [artikel 3, eerste lid, onderdeel e][ref5], vermeerdert de Minister het in onderdeel a bedoelde bedrag met een
      bedrag dat wordt bepaald met toepassing van Bijlage A, onderdeel 6.

      2 In afwijking van het eerste lid stelt de Minister de in dat lid bedoelde subsidie vast, uiterlijk vier weken na
      ontvangst van een volledig ingevuld formulier MA-F, indien de subsidieontvanger, met toepassing van artikel 35b,
      tweede lid, heeft aangegeven gebruik te maken van de facultatieve procedure.

      3 In afwijking van het eerste lid verzoekt de subsidieontvanger, indien deze geen subsidie als bedoeld in
      [artikel 3][ref6] aanvraagt, uiterlijk vier weken na de afronding van de procedure, beschreven in hoofdstuk 6 van
      het besluit, om vaststelling van de subsidie voor voorbereiding, begeleiding en toezicht.

      4 De Minister kan de subsidie voor voorbereiding, begeleiding en toezicht op nihil vaststellen:

      a. als twee jaren zijn verstreken na de verlening van de subsidie en geen aanvraag is ontvangen om een subsidie
      voor de uitvoering van de maatregelen, of

      b. zodra hij van oordeel is dat het gemeentebestuur de maatregelen niet binnen afzienbare tijd
      zal opnemen in een saneringsprogramma als bedoeld in [artikel 89, eerste lid, van de wet][ref7] of
      [artikel 4.18, eerste lid van het besluit][ref8].

      5 Indien toepassing van het derde lid zal leiden tot onbillijkheid van overwegende aard, kan de Minister besluiten
      om de subsidie voor voorbereiding, begeleiding en toezicht, in afwijking van het derde lid, vast te stellen op het
      reeds betaalde voorschotbedrag.

      6 In afwijking van het eerste lid stelt de Minister de subsidie voor voorbereiding, begeleiding en toezicht vast
      op 4% van het bedrag van de verlening van de subsidie voor de betrokken maatregelen, daarbij wijzigingen als
      gevolg van toepassing van [artikel 30][ref9] of [31][ref10] niet meegerekend, vermeerderd met het bedrag dat
      de spoorwegexploitant bij de subsidieontvanger in rekening heeft gebracht ten behoeve van de voorbereiding van,
      begeleiding van en het toezicht op de maatregelen, indien:

      a. het overeenkomstig de aanhef berekende subsidiebedrag 18% of meer van het bedrag van de verlening van de
      subsidie voor de maatregelen bedraagt, en

      b. het een geluidreducerende maatregel aan de constructie van een spoorweg of een afschermende maatregel tegen
      spoorweglawaai betreft binnen een project als bedoeld in bijlage G.

      7 Een vaststelling als bedoeld in het vijfde lid geschiedt tegelijkertijd met de vaststelling van de subsidie voor
      de maatregelen.


