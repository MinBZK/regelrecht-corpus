      1 Een aanvraag voor een subsidie voor voorbereiding, begeleiding en toezicht wordt vóór 1 april 2023 ingediend.

      2 Het eerste lid geldt niet in geval van:

      a. een reconstructie van een weg, waarbij de Minister toepassing zal geven aan
      [artikel 98, eerste lid, van de wet][ref1];

      b. een wijziging van een spoorweg, waarbij de Minister toepassing zal geven aan
