  - number: '29'
    text: |-
      De Minister beslist binnen vier maanden na ontvangst van de aanvraag om een subsidie als bedoeld in
      [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel3
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel29
