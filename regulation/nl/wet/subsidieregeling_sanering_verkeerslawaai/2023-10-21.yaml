        artikel: '98'
      - id: ref2
        bwb_id: BWBR0020731
        artikel: 35b
        paragraaf: '4'
  - number: '42'
    text: |-
      1 Burgemeester en wethouders leggen aan de Minister het saneringsprogramma in het kader van spoorweglawaai voor,
      met gebruikmaking van het formulier UK/S.

      2 Indien toepassing wordt gegeven aan [artikel 4.18, derde lid, van het besluit][ref1], legt de spoorwegexploitant
      aan de Minister het saneringsprogramma voor, met gebruikmaking van het formulier UK/S.

      3 Indien de maatregelen tegen spoorweglawaai geluidreducerende maatregelen aan een kunstwerk omvatten, wordt tevens
      gebruik gemaakt van formulier RBa.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4.18
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4.18'
  - number: 42a
    text: |-
      In een saneringsprogramma als bedoeld in de [artikelen 41][ref1] en [42][ref2] is onderbouwd dat maatregelen
      financieel doelmatig zijn op grond van de [Regeling doelmatigheid geluidmaatregelen Wet geluidhinder][ref3], voor
      zover het saneringsprogramma afschermende of geluidreducerende maatregelen omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0020731#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0026996
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel42a
    references:
