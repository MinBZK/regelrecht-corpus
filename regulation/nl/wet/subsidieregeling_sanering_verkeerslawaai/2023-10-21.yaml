  - number: '5'
    text: |-
      De Minister weigert een aanvraag om subsidie in ieder geval, voor zover naar zijn oordeel:

      a. de maatregelen niet sober en doelmatig zijn;

      b. voor zover het de maatregelen, bedoeld in [artikel 3, eerste lid, onderdelen b, c en d][ref1],
      betreft, de maatregelen niet sober zijn en niet financieel doelmatig op grond van de
      [Regeling doelmatigheid geluidmaatregelen Wet geluidhinder][ref2], of

      c. onvoldoende gebruik gemaakt is van de mogelijkheid dat anderen in de kosten voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026996
