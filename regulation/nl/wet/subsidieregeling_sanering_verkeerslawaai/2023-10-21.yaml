      1 Een aanvraag om subsidie als bedoeld in [artikel 3, eerste lid][ref1] wordt ingediend bij de Minister, met
      gebruikmaking van een volledig ingevuld formulier UK/S.

      2 Wanneer een subsidie voor geluidwerende maatregelen als bedoeld in [artikel 4, eerste lid, onder b][ref2], wordt
      aangevraagd, wordt bij de aanvraag een berekening van het effect van de verkeersmaatregel op de geluidsbelasting op
      de daar bedoelde saneringsobjecten gevoegd.


