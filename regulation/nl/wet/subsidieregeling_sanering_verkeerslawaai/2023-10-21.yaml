  - number: '38'
    text: Bij de subsidieverlening geldt de verplichting dat de maatregelen worden getroffen binnen het aangegeven tijdvak.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel38
  - number: '39'
    text: |-
      De subsidieontvanger is verplicht:

      a. mededeling te doen aan de Minister van wijzigingen in omstandigheden die van belang kunnen zijn voor de
      uitvoering van de maatregelen;

      b. indien de subsidieontvanger een gemeentebestuur, bestuur of provinciebestuur is, binnen vier weken na de
      afronding van de werkzaamheden daarvan mededeling te doen aan de Minister onder gebruikmaking van formulier MA;

      c. indien het een subsidie voor geluidwerende maatregelen betreft, voor het moment van aanvragen van de
      subsidievaststelling het rapport over te leggen van de akoestische controlemeting volgens hoofdstuk 6 van het
      Reken- en meetvoorschrift geluid 2012, uitgevoerd voor minimaal één op de twintig woningen, met dien verstande dat
      de te meten woningen representatief zijn voor het project.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel39
  - number: '40'
    text: |-
      1 De subsidieontvanger draagt zorg voor:

      a. een zodanige administratieve organisatie, dat het beheer van de ontvangen subsidies en de rechtmatigheid en
      doelmatigheid van de hieruit gedane uitgaven kunnen worden gecontroleerd;

      b. het voeren van een zodanige administratie, dat daaraan te allen tijde op eenvoudige wijze de kosten en
      de financieringswijze van de maatregelen en activiteiten, waarvoor een subsidie is verstrekt, kunnen worden
      gecontroleerd;

      c. een functiescheiding van de instanties die worden betrokken bij de voorbereiding en controle van de projecten
      enerzijds en de uitvoering anderzijds;

      d. het bewaren van de administratie en de daartoe behorende bescheiden gedurende tien jaar na gereedmelding.

      2 Het eerste lid, onderdelen a, b en d, is niet van toepassing, indien de subsidieontvanger een gemeentebestuur,
      bestuur of provinciebestuur is.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel40
  - number: 40a
    text: |-
      Deze paragraaf is van toepassing indien de subsidieontvanger, ingevolge [artikel 35b, tweede lid][ref1], heeft
      aangegeven gebruik te maken van de facultatieve procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel35b
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel40a
    references:
