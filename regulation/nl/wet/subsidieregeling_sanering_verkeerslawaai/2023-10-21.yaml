        bwb_id: BWBR0020731
        artikel: 35b
        paragraaf: '4'
  - number: 40b
    text: |-
      1 In afwijking van [artikel 39, aanhef, onderdeel b][ref1], doet de subsidieontvanger binnen vier weken na de
      afronding van de werkzaamheden daarvan mededeling aan de Minister onder gebruikmaking van een volledig ingevuld
      formulier MA-F, inclusief de op dat formulier aangegeven bijlagen.

      2 De Minister kan het bedrag van de subsidieverlening wijzigen naar aanleiding van de ontvangen informatie, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel39
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel40b
