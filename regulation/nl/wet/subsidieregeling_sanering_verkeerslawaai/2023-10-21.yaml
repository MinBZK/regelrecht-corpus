        artikel: '32'
        paragraaf: '4'
  - number: '36'
    text: |-
      1 Zolang geen aanvraag tot subsidievaststelling is ingediend, dient de ontvanger van een subsidie als bedoeld in
      [artikel 3, eerste lid][ref1], eenmaal per jaar, voor een in het besluit tot subsidieverlening te noemen datum, een
      overzicht in als bedoeld in [artikel 20, eerste lid, van het Kaderbesluit subsidies IenM][ref2].

      2 Het eerste lid is niet van toepassing indien de subsidieontvanger een gemeentebestuur, bestuur of
      provinciebestuur is.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel20
