  - number: '13'
    text: |-
      Geluidreducerende maatregelen aan de constructie van een spoorweg komen slechts in aanmerking voor subsidie voor
      zover de kosten niet voortvloeien uit het normale beheer en onderhoud van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel13
  - number: 13a
    text: |-
      1 Geluidreducerende maatregelen aan de constructie van een weg, niet zijnde een rijksweg, komen slechts in
      aanmerking voor subsidie voor zover:

      a. voor zover de kosten niet hoger zijn dan het bedrag dat volgt uit de toepassing van [bijlage A][ref1], onderdeel
      2, bij deze regeling; en

      b. de maatregelen gemiddeld over de technische levensduur van de weg leiden tot een afname van de geluidbelasting
      vóór afronding van ten minste 1,0 dB op ten minste een geluidsgevoelig gebouw in het cluster waarvoor de
      geluidreducerende maatregelen worden afgewogen.

      2 Geluidreducerende maatregelen aan de constructie van een rijksweg komen slechts in aanmerking voor subsidie voor
      zover de kosten van de maatregel hoger zijn dan de kosten bij de aanleg van een wegdek van Dicht Asfalt Beton op
      het betreffende traject.

      3 Het aanbrengen van een wegdek van Zeer Open Asfalt Beton op een rijksweg, komt niet in aanmerking voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0020731
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0020731
  - number: '14'
    text: |-
      1 Afschermende maatregelen komen voorts slechts in aanmerking voor subsidie voor zover de kosten, behoudens
      voorafgaande instemming van de Minister, niet meer dan 10% hoger zijn dan de gemiddelde kosten van de in de
      praktijk gangbare afschermende maatregelen als bedoeld in [bijlage C][ref1], onderdeel C1, bij deze regeling.

      2 De maximale subsidie voor een andere afschermende maatregel dan een geluidsscherm, is gelijk aan de maximale
      kosten voor een geluidscherm als bedoeld in het eerste lid, waarbij rekening is gehouden met dezelfde lengte en
      dezelfde geluidreductie en waarbij de keuzes zijn gemaakt voor de correctiefactoren, genoemd in [bijlage C][ref2],
      onderdeel C2, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020731
      [ref2]: https://wetten.overheid.nl/BWBR0020731
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020731
      - id: ref2
        bwb_id: BWBR0020731
  - number: '15'
    text: |-
      Niet in aanmerking voor een subsidie komen:

      a. geluidwerende maatregelen aan woningen en andere geluidsgevoelige gebouwen, welke maatregelen door de Minister
      zijn vastgesteld, doch ten aanzien waarvan de eigenaar, overeenkomstig [hoofdstuk 6 van het besluit][ref1] heeft
      verklaard niet in te stemmen met de uitvoering van de maatregelen;

      b. geluidwerende maatregelen aan woningen, waarbij in het maatgevende jaar de geluidsbelasting binnen de woning bij
      gesloten ramen de 43 dB niet overschrijdt;

      c. geluidwerende maatregelen aan andere geluidsgevoelige gebouwen, waarbij in het maatgevende jaar de
      geluidsbelasting bij gesloten ramen in categorie a-ruimten de 38 dB en in categorie b-ruimten de 43 dB niet
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020445
        hoofdstuk: '6'
  - number: '16'
    text: |-
      Geluidwerende maatregelen komen slechts in aanmerking voor subsidie voor zover:

      a. zij niet zijn toe te schrijven aan achterstallig onderhoud;

      b. zij worden getroffen ten behoeve van:

      1°. een woning waarvan ten minste één geluidsgevoelige ruimte een geluidsbelasting ondervindt van meer dan 43 dB;

      2°. een ander geluidsgevoelig gebouw waarvan ten minste één categorie a- ruimte een geluidsbelasting ondervindt van
      meer dan 38 dB, of

      3°. een ander geluidsgevoelig gebouw waarvan ten minste één categorie b-ruimte een geluidsbelasting ondervindt van
      meer dan 43 dB;

      c. zij strekken tot een verlaging van de geluidsbelasting tot de volgende waarden:

      1°. binnen de geluidsgevoelige ruimten van een woning: 38 dB, dan wel een door het gemeentebestuur doelmatig
      geoordeelde hogere waarde van ten hoogste 43 dB;

      2°. binnen categorie a-ruimten: 33 dB, dan wel een door het gemeentebestuur doelmatig geoordeelde hogere waarde van
      ten hoogste 38 dB;

      3°. binnen categorie b-ruimten: 38 dB, dan wel een door het gemeentebestuur doelmatig geoordeelde hogere waarde van
      ten hoogste 43 dB, en

      d. de kosten ervan in redelijke verhouding staan tot kwaliteit, aard en gebruik van de woning of het andere
      geluidsgevoelige gebouw en tot het geluidwerend effect van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel16
  - number: '17'
    text: |-
      Geluidwerende maatregelen komen, in geval van autonome gevelsanering, slechts voor een subsidie in aanmerking:

      a. indien zij geen wijziging inhouden van de gebruiksmogelijkheden van de gevel vóór de sanering;

      b. indien zij een wijziging inhouden van de gebruiksmogelijkheden van de gevel vóór de sanering, die niet leidt tot
      meerkosten die ten laste van de subsidie worden gebracht;

      c. voor zover voor de eventueel aan te brengen ventilatievoorzieningen, waar mogelijk, gebruik is gemaakt
      van de bestaande ventilatiemogelijkheden, rekening houdend met de eisen die aan het voldoende beperken van de
      geluidsbelasting worden gesteld, en

      d. tot het bedrag van de werkelijke kosten, zulks met een maximum van het met behulp van
      [bijlage D, onderdeel a][ref1], berekende bedrag; bij een eventuele overschrijding van dat bedrag kan ook dat
      meerdere voor subsidie in aanmerking komen indien die overschrijding naar het oordeel van de Minister voldoende
      onderbouwd is.


      [ref1]: https://wetten.overheid.nl/BWBR0020731
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel17
