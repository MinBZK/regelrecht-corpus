        artikel: '39'
        paragraaf: '5'
  - number: '41'
    text: |-
      1 Burgemeester en wethouders leggen aan de Minister een saneringsprogramma in het kader van wegverkeerslawaai voor,
      met gebruikmaking van het formulier UK/S.

      2 Indien toepassing wordt gegeven aan [artikel 98 van de wet][ref1], wordt een saneringsprogramma voorgelegd door
      burgemeester en wethouders of de wegaanlegger, met gebruikmaking van het formulier UK/S.

      3 Indien het saneringsprogramma verkeersmaatregelen omvat, wordt tevens gebruik gemaakt van formulier WBa.

      4 Indien het saneringsprogramma geluidwerende maatregelen omvat, wordt tevens gebruik gemaakt van formulier GBa
      of GBb.

      5 Het vierde lid is niet van toepassing indien de subsidieontvanger, ingevolge [artikel 35b, tweede lid][ref2],
      heeft aangegeven gebruik te maken van de facultatieve procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0020731#Artikel35b
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel41
    references:
