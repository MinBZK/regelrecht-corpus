  - number: '23'
    text: |-
      In het besluit tot verlening van een subsidie voor voorbereiding, begeleiding en toezicht wordt in ieder geval
      bepaald binnen welk tijdvak de voorbereiding plaats dient te vinden.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel23
  - number: '24'
    text: |-
      1 In het besluit tot verlening van een subsidie voor voorbereiding, begeleiding en toezicht wordt in ieder
      geval bepaald wat de hoogte van het eerste voorschot is, welke binnen 4 weken na verlening of aan de hand van de
      individuele liquiditeitsbehoefte wordt verstrekt.

      2 Het voorschot bedraagt € 600,– per saneringsobject met een geluidsbelasting van 56 dB of hoger, inclusief aftrek
      als bedoeld in [artikel 110g van de wet][ref1].

      3 Het voorschot bedraagt € 150,– per saneringsobject met een geluidsbelasting tot en met 55 dB, inclusief aftrek
      als bedoeld in [artikel 110g van de wet][ref2].

      4 Na afloop van het tijdvak, bedoeld in [artikel 23][ref3], kan de Minister een nieuw voorschot verstrekken,
      waarbij de verstrekte voorschotten tezamen ten hoogste 95% van de verleende subsidie bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
      [ref3]: https://wetten.overheid.nl/BWBR0020731#Artikel23
