        artikel: '3'
        paragraaf: '2'
  - number: '30'
    text: |-
      1 Voor de start van de uitvoering van de maatregelen stelt de subsidieontvanger de Minister schriftelijk op de
      hoogte van de kosten van de uitvoering en overlegt aan de Minister de opdrachtverlening aan de partij die de
      maatregelen zal gaan uitvoeren.

      2 Indien de subsidie is verleend voor geluidwerende maatregelen bevat de informatie, bedoeld in het eerste lid, een
      open calculatie voor de uitvoering van deze maatregelen.

      3 Indien de kosten van uitvoering meer dan 10% hoger zijn dan het bedrag van de subsidieverlening, overlegt de
      subsidieontvanger voorafgaand aan de gunning een proces verbaal van aanbesteding en een voorstel tot gunning van
      de werkzaamheden en dient hij bij de Minister een schriftelijk en gemotiveerd verzoek in om in te stemmen met de
      kosten van uitvoering van de maatregelen.

      4 Binnen vier weken na ontvangst van een verzoek als bedoeld in het derde lid, neemt de Minister een besluit op
      het verzoek.

      5 De Minister kan het bedrag van de subsidieverlening wijzigen naar aanleiding van de ontvangen informatie, bedoeld
      in het eerste lid, en het verzoek, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel30
  - number: 30a
    text: |-
      De Minister kan de subsidieverlening wijzigen naar aanleiding van het rapport, bedoeld in
      [artikel 39, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel39
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0020731
        artikel: '39'
        paragraaf: '5'
  - number: '31'
    text: |-
      1 De subsidieontvanger kan tot het moment van het indienen van de aanvraag tot subsidievaststelling de Minister
      schriftelijk verzoeken het bedrag van de subsidieverlening te wijzigen naar aanleiding van omstandigheden die er
      toe leiden dat de kosten van de maatregelen de verleende subsidie overstijgen.

      2 Het verzoek als bedoeld in eerste lid is voorzien van een motivering en een opgave van de kosten van de
      maatregelen.

      3 De Minister kan de subsidieverlening wijzigen naar aanleiding van een verzoek als bedoeld in het eerste lid.

      4 Binnen vier weken na ontvangst van het verzoek, bedoeld in het eerste lid, neemt de Minister een besluit op het
      verzoek.

      5 Indien een verzoek als bedoeld in het eerste lid is ingediend, wordt de subsidie niet eerder vastgesteld dan dat
      de Minister heeft besloten op het verzoek.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel31
  - number: '32'
    text: |-
      1 Voorschotten worden maximaal vier maal, gelijkmatig verspreid over het tijdvak waarin de maatregelen moeten
      worden getroffen of aan de hand van de individuele liquiditeitsbehoefte, verstrekt.

      2 Het totale bedrag van de voorschotten bedraagt maximaal 95% van het verleende subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel32
  - number: '33'
    text: |-
      1 De subsidieontvanger zendt de Minister, onder gebruikmaking van formulier WG of formulier RG, binnen 10 maanden
      na het einde van het tijdvak waarin de maatregelen getroffen moesten worden de aanvraag tot subsidievaststelling.

      2 De subsidieontvanger maakt voor de verklaring, bedoeld in
      [artikel 24, vierde lid, van het Kaderbesluit subsidies IenM][ref1] gebruik van
      [model 1 of model 2 van bijlage E][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0020731
