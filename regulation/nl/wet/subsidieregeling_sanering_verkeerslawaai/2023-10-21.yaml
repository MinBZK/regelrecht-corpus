        artikel: 17a
  - number: '34'
    text: |-
      Indien de subsidieontvanger de aanvraag tot subsidievaststelling niet tijdig heeft toegezonden of indien de
      toegezonden stukken naar het oordeel van de Minister onvolledig zijn, stelt de Minister de subsidieontvanger
      binnen zes weken na de in [artikel 33, eerste lid][ref1], genoemde termijn dan wel na ontvangst van deze stukken,
      in de gelegenheid om binnen een door de Minister te stellen termijn van ten hoogste acht weken alsnog aan zijn
      verplichtingen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel33
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020731
        artikel: '33'
        paragraaf: '4'
  - number: '35'
    text: |-
      1 Indien de subsidieontvanger niet binnen de in [artikel 34][ref1] bedoelde termijn aan zijn verplichtingen heeft
      voldaan, kan de Minister voor iedere week die de subsidieontvanger in gebreke blijft, bij de vaststelling van de
      subsidie een korting toepassen van 2,5% van de verleende subsidie.

      2 Indien de subsidieontvanger deze termijn met zestien weken heeft overschreden, stelt de Minister de subsidie
      vast, waarbij hij een korting toepast van ten minste 50% en ten hoogste 100% van de verleende subsidie.

      3 De Minister verrekent de korting, bedoeld in het eerste en tweede lid, met de subsidie. De verrekening vindt
      plaats bij de subsidievaststelling. Voor zover de korting niet verrekend kan worden, vordert de Minister haar
      terug.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel34
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020731
        artikel: '34'
        paragraaf: '4'
  - number: 35a
    text: |-
      De [artikelen 34][ref1] en [35][ref2] zijn niet van toepassing indien de subsidieontvanger een gemeentebestuur,
      bestuur of provinciebestuur is.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0020731#Artikel35
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020731
        artikel: '34'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020731
        artikel: '35'
        paragraaf: '4'
  - number: 35b
    text: |-
      1 Indien de subsidieontvanger een gemeentebestuur, bestuur of provinciebestuur is kan, als het maatregelen betreft,
      als bedoeld in [artikel 3, eerste lid, onderdeel e][ref1], deze gebruik maken van de facultatieve procedure.

      2 De subsidieontvanger maakt gebruik van de facultatieve procedure kenbaar met gebruikmaking van het formulier UK/S

      3 Op de facultatieve procedure, bedoeld in het eerste lid, zijn [artikel 30][ref2] en [31][ref3] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020731#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0020731#Artikel31
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel35b
