        artikel: '42'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0026996
  - number: '43'
    text: |-
      1 De Minister kan een onderzoek instellen naar de kwaliteit en de kosten van de maatregelen waarvoor subsidie is
      verleend.

      2 Indien uit het onderzoek mocht blijken dat de geluidwerende maatregelen de geluidsbelasting niet hebben
      teruggebracht tot de waarden, bedoeld in [artikel 16, onder c][ref1], stelt de Minister de subsidieontvanger in de
      gelegenheid om de geluidwerende maatregelen binnen een door hem te bepalen termijn alsnog te voltooien of aan te
      vullen, dan wel opnieuw te treffen.

      3 Indien de betrokken maatregelen niet binnen de in het tweede lid bedoelde termijn zijn getroffen, kan de Minister
      op kosten van de subsidieontvanger de nodige maatregelen treffen.

      4 Indien uit het onderzoek mocht blijken dat de kosten van de geluidwerende maatregelen niet voldoen aan
      [artikel 16, onder c][ref2], stelt de Minister de subsidieontvanger in de gelegenheid om daarover opheldering te
      verschaffen binnen een door hem te bepalen termijn.

      5 De Minister kan een onafhankelijke instantie aanwijzen die belast is met de toepassing van het eerste, tweede en
      derde lid. Hij doet daarvan mededeling aan de subsidieontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020731#Artikel16
