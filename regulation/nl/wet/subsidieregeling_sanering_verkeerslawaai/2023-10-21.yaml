    text: |-
      1 De Minister beslist binnen dertien weken na afloop van de in [artikel 21, eerste lid][ref1], bedoelde termijn
      over de aanvraag voor een subsidie voor voorbereiding, begeleiding en toezicht.

      2 In de gevallen, genoemd in [artikel 21, tweede lid][ref2], beslist de minister binnen vier maanden na ontvangst
      van de aanvraag.

      3 Indien de beslissing als bedoeld in het eerste lid negatief is, kan de Minister deze beslissing tot 31 december
      herzien.


