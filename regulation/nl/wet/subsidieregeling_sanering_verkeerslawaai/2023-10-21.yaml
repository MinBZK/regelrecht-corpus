  - number: '10'
    text: |-
      1 Projecten waarvan de gemiddelde geluidsbelasting, na aftrek als bedoeld in artikel 110g van de wet, op de gevels
      van de 25 hoogst belaste saneringsobjecten binnen het project, afgerond op twee decimalen achter de komma, het
      hoogste is, komen het eerst in aanmerking voor een subsidie, als bedoeld in artikel 7, eerste lid.

      2 De Minister kan van het eerste lid afwijken, indien:

      a. de toepassing van het eerste lid, gelet op het belang van het voorkomen of beperken van geluidhinder, zal leiden
      tot onbillijkheid van overwegende aard;

      b. de maatregelen in het kader van de sanering samenvallen met een reconstructie van een weg of een wijziging van
      een spoorweg, of;

      c. het gevolg van die afwijking is dat projecten vanuit het oogpunt van doelmatigheid en kostenbeheersing
      gezamenlijk uitgevoerd worden met andere werken.

      3 Bij de berekening van de gemiddelde geluidsbelasting, als bedoeld in het eerste lid, wordt per subsidietijdvak
      dat de aanvraag eerder is ingediend, met het oog op de rangorde bij de verlening van de subsidies, bedoeld in
      artikel 7, eerste lid, 1 dB opgeteld.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel10
  - number: '11'
    text: |-
      1 Niet in aanmerking voor een subsidie voor de uitvoering komen de volgende maatregelen:

      a. maatregelen die in uitvoering zijn genomen, voordat op de aanvraag door de Minister is beslist;

      b. maatregelen waarvoor geen subsidie als bedoeld in [artikel 7, eerste lid][ref1], is verleend.

      2 Het eerste lid, onder a, is niet van toepassing in de gevallen waarin de Minister vooraf heeft toegestemd met het
      op en eerder tijdstip in uitvoering nemen van die maatregelen.

      3 De Minister kan alleen toestemmen in het vooraf in uitvoering nemen van maatregelen, indien dit naar zijn oordeel
      om redenen van doelmatigheid wenselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel7
