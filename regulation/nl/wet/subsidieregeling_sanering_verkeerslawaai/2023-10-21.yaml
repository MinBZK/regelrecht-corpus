  - number: 35c
    text: |-
      1 Indien de aanvraag geluidwerende maatregelen betreft en de subsidieontvanger heeft aangegeven gebruik te maken
      van de facultatieve procedure, wordt de hoogte van het totale voorschot bepaald met behulp van[ bijlage A][ref1],
      onderdeel 7.

      2 In afwijking van [artikel 32][ref2] wordt het totale voorschot, bedoeld in het eerste lid, binnen vier weken na
      verlening van de subsidie in één keer verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020731
      [ref2]: https://wetten.overheid.nl/BWBR0020731#Artikel32
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel35c
