articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. afschermende maatregelen: maatregelen als bedoeld in [artikel 3.7, eerste lid, onder b][ref1], en
      [artikel 4.19, eerste lid, onder b, van het besluit][ref2];

      b. autonome gevelsanering: in het kader van de sanering wegverkeerslawaai of spoorweglawaai treffen van
      geluidwerende maatregelen met het uitsluitende oogmerk de beperking van het geluidsniveau binnen de woning of het
      andere geluidsgevoelig gebouw, vanwege een weg of spoorweg;

      c. besluit: [Besluit geluidhinder][ref3];

      d. bestuur: bestuur als bedoeld in of functionerend ten behoeve van een gemeenschappelijke regeling;

      e. categorie a-ruimte-: ruimte als bedoeld in
      [artikel 1.1, onderdeel d, onder 1°, 2° en 3°, van het besluit][ref4];

      f. categorie b-ruimte: ruimte als bedoeld in [artikel 1.1, onderdeel d, onder 4° en 5°, van het besluit][ref5];

      g. een met een lettercombinatie aangeduid formulier: een formulier opgenomen in [bijlage B][ref6] bij deze
      regeling;

      h. geluidsbelasting vanwege een weg: geluidsbelasting in dB vanwege een weg na toepassing van de aftrek bedoeld, in
      [artikel 110g van de wet][ref7];

      i. geluidwerende maatregelen: maatregelen als bedoeld in [artikel 3.7, eerste lid, onder c][ref8], en
      [artikel 4.19, eerste lid, onder c, van het besluit][ref9];

      j. gemeenschappelijke regeling:

      1°. gemeenschappelijke regeling krachtens de [Wet gemeenschappelijke regelingen][ref10] omtrent in ieder geval het
      treffen van geluidwerende maatregelen of geluidhinderbestrijding, of

      2°. samenwerkingsverband ten behoeve van structurele samenwerking tussen gemeentebesturen ter zake van een
      activiteit als bedoeld onder 1°;

      k. maatgevend jaar: tiende jaar na het akoestisch onderzoek in situaties als bedoeld in
      [artikel 88 van de wet][ref11], zoals deze luidde onmiddellijk voorafgaand aan 24 februari 2010, of in
      [artikel 4.17 van het besluit][ref12], zoals dat luidde voor inwerkingtreding van artikel I, onderdeel CC, van
      het Invoeringsbesluit geluidproductieplafonds, dan wel, bij reconstructies het tiende jaar na afronding van de
      reconstructie;

      l. Minister: Minister van Infrastructuur en Milieu;

      m. rijksinfrastructuur: wegen in beheer bij het Rijk en hoofdspoorwegen;

      n. saneringsobjecten: woningen en andere geluidsgevoelige gebouwen, die op grond van
      [artikel 88 van de Wet geluidhinder][ref13], zoals dat luidde voor 1 januari 2007, of
      [artikel 4.17 van het Besluit geluidhinder][ref14] bij de Minister tijdig zijn gemeld;

      o. verkeersmaatregelen: maatregelen als bedoeld in [artikel 3.7, eerste lid, onder a][ref15],
      al dan niet in combinatie met geluidreducerende maatregelen aan de constructie van een weg, en
      [artikel 4.19 eerste lid, onder a, van het besluit][ref16];

      p. wet: [Wet geluidhinder][ref17].


