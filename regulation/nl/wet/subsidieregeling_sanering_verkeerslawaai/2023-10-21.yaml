  - number: '2'
    text: |-
      1 De Minister kan subsidie verstrekken ter zake de kosten van projecten met als doel de beperking van de
      geluidsbelasting vanwege wegen en spoorwegen aan woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen of de beperking van het geluidsniveau binnen woningen of andere geluidsgevoelige gebouwen.

      2 Er wordt geen subsidie verstrekt voor BTW verschuldigd over kosten voor projecten als bedoeld in het eerste lid,
      tenzij de subsidieontvanger aantoonbaar de BTW niet kan verrekenen of hiervoor geen compensatie kan krijgen op
      grond van de [Wet op het BTW-compensatiefonds][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '3'
    text: |-
      1 De Minister kan aan het gemeentebestuur of het bestuur op aanvraag subsidie verstrekken ter zake de kosten van:

      a. verkeersmaatregelen tegen wegverkeerslawaai;

      b. geluidreducerende maatregelen aan de constructie van een weg of een spoorweg;

      c. afschermende maatregelen tegen wegverkeerslawaai;

      d. afschermende maatregelen tegen spoorweglawaai;

      e. geluidwerende maatregelen aan saneringsobjecten tegen wegverkeerslawaai of spoorweglawaai;

      f. maatregelen die strekken tot onttrekking aan de bestemming van woningen en andere geluidsgevoelige gebouwen.

      2

      3 De Minister kan de subsidie, bedoeld in het eerste lid, onder b en d, en – voor zover het spoorweglawaai
      betreft – e, op aanvraag aan de spoorwegexploitant verlenen, indien de maatregelen worden uitgevoerd onder diens
      verantwoordelijkheid.

      4 De Minister kan de subsidie, bedoeld in het eerste lid op aanvraag aan het provinciebestuur verlenen, indien de
      maatregelen worden uitgevoerd onder diens verantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel3
  - number: '4'
    text: |-
      1 Maatregelen als bedoeld in [artikel 3, eerste lid][ref1], komen slechts in aanmerking voor subsidie indien:

      a. zij door de Minister zijn vastgesteld op grond van [artikel 90, vijfde lid, van de wet][ref2] of op grond van
      [artikel 4.23, derde lid, van het besluit][ref3]; of

      b. het geluidwerende maatregelen aan saneringsobjecten betreft waarvoor na het moment waarop de subsidie, bedoeld
      in [artikel 7, eerste lid][ref4], is aangevraagd, een verkeersbesluit is genomen, inhoudende dat de snelheid op een
      weg wordt verlaagd naar 30 km/u.

      2 Maatregelen komen niet in aanmerking voor subsidie indien zij betrekking hebben op woningen,
      andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen die niet tijdig overeenkomstig
      [artikel 88 van de wet][ref5], zoals deze luidde onmiddellijk voorafgaand aan 24 februari 2010, of
      [artikel 4.17 van het besluit][ref6], zoals dat luidde voor inwerkingtreding van artikel I, onderdeel CC, van het
      Invoeringsbesluit geluidproductieplafonds, zijn gemeld.

      3 Het gemeentebestuur of bestuur doet, op verzoek van de Minister, binnen 3 maanden mededeling van de
      saneringsobjecten, waarvan na de melding, als bedoeld in [artikel 88 van de wet][ref7], zoals deze luidde
      onmiddellijk voorafgaand aan 24 februari 2010, of [artikel 4.17 van het besluit][ref8], zoals dat luidde voor
      inwerkingtreding van artikel I, onderdeel CC, van het Invoeringsbesluit geluidproductieplafonds, is gebleken dat
      deze niet meer voor subsidie in aanmerking kunnen komen, omdat deze:

      a. zijn gesloopt;

      b. van bestemming zijn gewijzigd in een niet-geluidsgevoelige bestemming;

      c. zijn gelegen of ooit hebben gelegen aan een weg, als bedoeld in [artikel 74, tweede lid, van de wet][ref9];

      d. na 1 maart 1986 zijn gebouwd en in een zone liggen als bedoeld in [artikel 74 van de wet][ref10];

      e. na 1 juli 1987 zijn gebouwd en in een zone liggen als bedoeld in [artikel 1.4 van het besluit][ref11];

      f. saneringsobjecten of de weg waaraan ze zijn gelegen, zijn geprojecteerd in een na 1 januari 1982
      overeenkomstig[ artikel 76][ref12] en [77, van de wet][ref13] vastgesteld bestemmingsplan, of;

      g. zijn gelegen in een situatie waarin tot aanleg of reconstructie van de weg na 1 januari 1982 is besloten met
      toepassing van de [artikelen 79 tot en met 81, van de wet][ref14];

      h. zijn voorzien van maatregelen, die ten laste van het Rijk zijn getroffen of omdat de toestemming, bedoeld in
      [artikel 114a van de wet][ref15], ontbreekt.


