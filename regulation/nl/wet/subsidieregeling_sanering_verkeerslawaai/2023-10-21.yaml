  - number: '19'
    text: |-
      1 Maatregelen tegen wegverkeers- en spoorweglawaai die strekken tot onttrekking aan de bestemming van woningen
      en andere geluidsgevoelige gebouwen komen slechts in aanmerking voor subsidie, indien de geluidsbelasting op deze
      woningen en gebouwen, met aftrek als bedoeld in [artikel 110g van de wet][ref1], vanwege wegverkeerslawaai hoger is
      dan 65 dB en vanwege spoorweglawaai hoger is dan 70 dB.

      2 Het subsidiebedrag voor maatregelen als bedoeld in het eerste lid is niet hoger dan het bedrag dat volgt uit de
      toepassing van [bijlage A][ref2], onderdelen 4 en 5.


