  - number: '9'
    text: |-
      Subsidieaanvragen als bedoeld in [artikel 7, eerste lid][ref1], worden jaarlijks gelijktijdig beoordeeld op basis
      van hun geschiktheid om bij te dragen aan de doelstellingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel7
