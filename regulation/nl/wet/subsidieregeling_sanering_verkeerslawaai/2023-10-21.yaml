  - number: 33a
    text: |-
      1 In afwijking van [artikel 33][ref1], wordt, indien de subsidieontvanger een gemeentebestuur, bestuur
      of provinciebestuur is, een subsidievaststelling aangevraagd door verantwoordingsinformatie aan de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties te verstrekken, op een wijze als bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref2].

      2 In afwijking van het eerste lid kan de subsidieontvanger een subsidievaststelling aanvragen door de
      verantwoordingsinformatie, bedoeld in het eerste lid, voor zover deze specifiek op de verleende subsidie ziet, voor
      1 juli van het jaar volgend op het begrotingsjaar aan de Minister te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0020731#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel33a
    references:
