  - number: '12'
    text: |-
      1 Verkeersmaatregelen komen slechts in aanmerking voor subsidie indien zij:

      a. niet elders een zodanige toename van de geluidsbelasting veroorzaken, dat de kosten van de bestrijding van deze
      toename hoger zijn dan de kostenbesparing die door het treffen van de verkeersmaatregelen wordt bereikt;

      b. niet elders leiden tot een toename van de geluidsbelasting tot boven de 68 dB, dan wel 58 dB voor een ander
      geluidsgevoelig gebouw als bedoeld in [artikel 1.2, eerste lid, onderdelen d, e en f, van het besluit][ref1];

      c. niet voortvloeien uit het normale beheer en onderhoud van de weg.

      2 Verkeersmaatregelen komen slechts in aanmerking voor subsidie, voor zover de kosten niet hoger zijn dan het
      bedrag dat volgt uit de toepassing van [bijlage A, onderdeel 1][ref2], bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0020731
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel12
