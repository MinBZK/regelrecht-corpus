  - number: '6'
    text: |-
      Niet in aanmerking voor een subsidie komen maatregelen:

      a. die getroffen worden met geldelijke steun op grond van de ‘Nadere regels voor de uitvoering van geluidsanering
      ten laste van Rijkswaterstaat bij het uitvoeren van werkzaamheden aan rijkswegen ter vergroting van de capaciteit
      c.q. het uitvoeren van verbeteringswerken aan rijkswegen’ (bijlage bij de circulaires van 24 december 1991, MBG
      20d91010 en MBG 23d91003, Stcrt. 1992, 58);

      b. die getroffen worden met geldelijke steun op grond van de ‘Nadere afspraken geluidsanering bij
      spoorwerkzaamheden’ ([bijlage bij de circulaire van 22 november 1995, MBG 21895016](onbekend), Stcrt. 238);

      c. voor zover zij getroffen worden met geldelijke steun, verstrekt uit anderen hoofde ten laste van het Rijk;

      d. voor zover deze getroffen worden aan woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen
      waarvoor al eerder ten laste van het Rijk maatregelen zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0020731/2023-10-21#Artikel6
  - number: '7'
    text: |-
      1 De Minister kan aan het gemeentebestuur of het bestuur op aanvraag subsidie verstrekken ter zake de kosten van
      voorbereiding van, begeleiding van en toezicht op maatregelen als bedoeld in [artikel 3, eerste lid][ref1];

      2 [Artikel 3, vierde lid][ref2], is van overeenkomstige toepassing.

      3 Een subsidie als bedoeld in het eerste lid wordt niet verstrekt voor zover deze betrekking heeft op de kosten van
      maatregelen ter vermindering van de geluidsbelasting vanwege rijksinfrastructuur.

      4 Een subsidie als bedoeld in het eerste lid wordt niet verstrekt voor zover de subsidieaanvraag minder dan 25
      saneringsobjecten bevat.

      5 Het vierde lid is niet van toepassing, indien:

      a. in de gehele betreffende gemeente minder dan 25 saneringsobjecten, als bedoeld in
      [artikel 89, eerste lid van de wet][ref3], en geluidsgevoelige gebouwen, als bedoeld in
      [artikel 3.6 van het besluit][ref4], (saneringsobjecten) zijn gelegen die nog niet in een saneringsprogramma zijn
      opgenomen, of;

      b. het gemeentebestuur of bestuur bij de aanvraag, bedoeld in het eerste lid, heeft aangegeven dat alleen de
      maatregel, bedoeld in [artikel 3, eerste lid, onderdeel f][ref5], in aanmerking komt, of;

      c. Indien de aanvraag wordt gedaan ten behoeve van een reconstructie als bedoeld in
      [artikel 98, eerste lid, van de wet][ref6].

      6 Bij de verlening van een subsidie, als bedoeld in het eerste lid, vermeldt de Minister de wijze waarop het bedrag
      van de subsidie wordt berekend.


