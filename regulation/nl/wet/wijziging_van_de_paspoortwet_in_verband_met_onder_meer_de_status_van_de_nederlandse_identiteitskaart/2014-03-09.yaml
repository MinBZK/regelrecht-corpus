    text: |-
      1 Een gemeentelijke belastingverordening of een eilandverordening ter zake van het heffen van rechten als
      bedoeld in [artikel 7, tweede lid, van de Paspoortwet][ref1], zoals dat luidde voor de inwerkingtreding van
      [artikel I, onderdeel D][ref2], van deze wet, voor het verrichten van handelingen ten behoeve van de aanvraag van
      een reisdocument, berust vanaf de dag van inwerkingtreding van artikel I, onderdeel D, van deze wet op artikel 7,
      tweede lid, van de Paspoortwet.

