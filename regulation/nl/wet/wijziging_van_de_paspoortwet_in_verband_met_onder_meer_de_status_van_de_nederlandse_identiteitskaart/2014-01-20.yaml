$id: wijziging_van_de_paspoortwet_in_verband_met_onder_meer_de_status_van_de_nederlandse_identiteitskaart
regulatory_layer: WET
publication_date: '2014-01-17'
valid_from: '2014-01-20'
bwb_id: BWBR0034694
url: https://wetten.overheid.nl/BWBR0034694/2014-01-20
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Paspoortwet te wijzigen in verband met een andere
    status van de Nederlandse identiteitskaart, het verlengen van de geldigheidsduur van reisdocumenten en Nederlandse
    identiteitskaarten, een andere grondslag voor de heffing van rechten door burgemeesters en gezaghebbers voor de
    aanvraag van reisdocumenten en het niet langer opslaan van vingerafdrukken in de reisdocumentenadministratie;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State van het Koninkrijk gehoord, en met gemeen overleg
    der Staten-Generaal, de bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden
    en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034694/2014-01-20#ArtikelAanhef
articles:
  - number: XIII
    text: |-
      De artikelen van deze rijkswet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034694/2014-01-20#ArtikelXIII
  - number: XIV
    text: |-
      Deze wet wordt aangehaald als: Wijziging van de Paspoortwet in verband met onder meer de status van de Nederlandse
      identiteitskaart.
    url: https://wetten.overheid.nl/BWBR0034694/2014-01-20#ArtikelXIV
