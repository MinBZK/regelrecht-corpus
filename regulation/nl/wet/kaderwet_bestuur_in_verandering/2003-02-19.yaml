  - number: '2'
    text: |-
      Deze wet is van toepassing op:

      a. het samenwerkingsgebied waarin de gemeente Amsterdam is gelegen;

      b. het samenwerkingsgebied waarin de gemeente Rotterdam is gelegen;

      c. het samenwerkingsgebied waarin de gemeente 's-Gravenhage is gelegen;

      d. het samenwerkingsgebied waarin de gemeente Utrecht is gelegen;

      e. het samenwerkingsgebied waarin de gemeenten Eindhoven en Helmond zijn gelegen;

      f. het samenwerkingsgebied waarin de gemeenten Enschede en Hengelo (O) zijn gelegen;

      g. het samenwerkingsgebied waarin de gemeenten Arnhem en Nijmegen zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel2
  - number: '3'
    text: |-
      1 In afwijking van [artikel 2 van de Wet gemeenschappelijke regelingen][ref1] kan, indien zulks noodzakelijk is met
      het oog op de door een regionaal openbaar lichaam uit te oefenen bevoegdheden, bij algemene maatregel van bestuur
      een in [artikel 2][ref2] bedoeld samenwerkingsgebied worden vastgesteld.

      2 Bij toepassing van het eerste lid houdt het krachtens [artikel 2 van Wet gemeenschappelijke regelingen][ref3]
      door provinciale staten genomen indelingsbesluit voor dat samenwerkingsgebied op te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel2
