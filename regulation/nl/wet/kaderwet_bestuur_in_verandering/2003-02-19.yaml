  - number: '6'
    text: |-
      Indien krachtens [artikel 3, eerste lid][ref1], een samenwerkingsgebied is vastgesteld dat in meer dan één
      provincie is gelegen, wordt bij de algemene maatregel van bestuur, bedoeld in [artikel 3, eerste lid][ref2],
      bepaald welk van de betrokken provinciale besturen binnen dat samenwerkingsgebied de bevoegdheden met betrekking
      tot gemeenschappelijke regelingen uitoefent die bij of krachtens de wet aan het provinciaal bestuur zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel3
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel6
