      wijziging van een krachtens [artikel 3, eerste lid][ref2], vastgesteld samenwerkingsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel3
