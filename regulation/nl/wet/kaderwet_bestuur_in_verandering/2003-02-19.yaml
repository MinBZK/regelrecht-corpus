        hoofdstuk: '3'
  - number: '40'
    text: |-
      De commissie bevordert waar nodig de integratie van gemeenschappelijke regelingen met de regeling. Zij bevordert
      tevens de aanpassing van gemeenschappelijke regelingen, die ten gevolge van de inwerkingtreding van een wet die
      voorziet in een regeling van de bestuurlijke organisatie noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel40
  - number: '41'
    text: |-
      1 De commissie bestaat uit een voorzitter en zeven andere leden.

      2 Onze Minister is lid en tevens voorzitter van de commissie.

      3 De andere leden worden als volgt aangewezen:

      a. het college van burgemeester en wethouders van de gemeente Rotterdam wijst twee leden aan;

      b. het dagelijks bestuur van het regionaal openbaar lichaam wijst twee leden aan;

      c. het college van gedeputeerde staten van de provincie Zuid-Holland wijst twee leden aan;

      d. Onze Minister wijst een lid aan.

      4 De voorzitter en leden kunnen zich doen vervangen.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel41
  - number: '42'
    text: |-
      1 De commissie regelt haar werkwijze.

      2 De commissie is bevoegd subcommissies in te stellen, waarin ook personen van buiten de commissie zitting hebben.

      3 De commissie is bevoegd deskundigen uit te nodigen om aan de werkzaamheden van de commissie een bijdrage te
      leveren.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel42
  - number: '43'
    text: |-
      Onze Minister treft in overleg met de betrokken besturen voorzieningen ten behoeve van het secretariaat van de
      commissie.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel43
  - number: '44'
    text: |-
      De kosten verbonden aan de werkzaamheden van de commissie worden voor twee-zesde deel gedragen door Onze Minister,
      voor twee-zesde deel door het bestuur van het regionaal openbaar lichaam, voor een-zesde deel door het bestuur van
      de gemeente Rotterdam en voor een-zesde deel door het bestuur van de provincie Zuid-Holland.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel44
  - number: '45'
    text: |-
      Het beheer van het archief van de commissie geschiedt met inachtneming van de bepalingen van het Besluit Algemene
      secretarie-aangelegenheden rijksadministratie op overeenkomstige wijze als bij het ministerie van Binnenlandse
      Zaken. Het archief wordt bij opheffing van de commissie overgedragen aan het hoofd van de algemene secretarie van
      dat ministerie.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel45
  - number: '47'
    text: |-
      [Artikel 32][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel32
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel47
