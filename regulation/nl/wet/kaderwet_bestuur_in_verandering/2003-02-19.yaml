        artikel: '222'
  - number: '14'
    text: |-
      1 Een regeling voorziet in de bevoegdheid van het algemeen bestuur van een regionaal openbaar lichaam voorschriften
      te geven met betrekking tot het door de in het samenwerkingsgebied gelegen gemeenten verwerven en uitgeven van
      gronden, de aanleg van voorzieningen van openbaar nut, het verhaal van kosten daarvan, alsmede de mate waarin de
      financiële gevolgen worden verdeeld over de in het samenwerkingsgebied gelegen gemeenten.

      2 Een regeling voorziet tevens in de bevoegdheid van het algemeen bestuur van een regionaal openbaar lichaam
      gebieden aan te wijzen, ten aanzien waarvan dat bestuur kan bepalen dat de verwerving en de uitgifte van de
      gronden, de aanleg van voorzieningen van openbaar nut, alsmede het verhaal van kosten daarvan, uitsluitend door of
      vanwege het bestuur van het regionale openbaar lichaam kan plaatsvinden.

      3 Een regeling voorziet voorts in de bevoegdheid van het bestuur van het regionaal openbaar lichaam voorschriften
      te geven met betrekking tot het onderhoud en het beheer van de in het eerste en het tweede lid bedoelde gronden.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel14
  - number: '15'
    text: |-
      1 Een regeling voorziet in de bevoegdheid van het algemeen bestuur van een regionaal openbaar lichaam een
      huisvestingsverordening als bedoeld in [artikel 2, eerste lid, van de Huisvestingswet][ref1] vast te stellen.

      2 Een regeling voorziet in de bevoegdheid van het algemeen bestuur van een regionaal openbaar
      lichaam regels te stellen inzake de uitoefening van de aan het regionaal openbaar lichaam krachtens
      [artikel 81, derde lid, van de Woningwet][ref2] overgedragen bevoegdheden en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel81
