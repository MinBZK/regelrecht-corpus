  - number: '29'
    text: |-
      Indien het bestuur van een in het samenwerkingsgebied liggende gemeente beroep tegen een besluit van het bestuur
      van een regionaal openbaar lichaam instelt, is [artikel 7:1 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel71
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel29
