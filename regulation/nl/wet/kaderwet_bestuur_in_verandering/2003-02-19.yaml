  - number: '30'
    text: |-
      Tegen een besluit als bedoeld in de [artikelen 24][ref1] en [26][ref2] en tegen een aanwijzing als bedoeld in de
      [artikelen 27, eerste lid][ref3], en [28, derde lid][ref4], kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.


