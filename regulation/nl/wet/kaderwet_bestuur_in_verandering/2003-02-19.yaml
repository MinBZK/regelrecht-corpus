  - number: '57'
    text: |-
      1 Onze Minister is belast met de uitvoering van deze wet.

      2 Voor zover bij die uitvoering belangen zijn betrokken, welke aan de zorg van een andere minister zijn
      toevertrouwd, geschiedt de uitvoering in overeenstemming met de desbetreffende minister.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel57
  - number: '58'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen datum.

      2 [Artikel 54][ref1] treedt in werking een jaar na de datum, bedoeld in het eerste lid, tenzij bij koninklijk
      besluit een eerder tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel54
