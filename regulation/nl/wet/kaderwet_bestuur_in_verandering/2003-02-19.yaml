  - number: '13'
    text: |-
      In afwijking van [artikel 30, eerste lid, onderdeel ][ref1], kan aan het bestuur van het regionaal openbaar lichaam
      de bevoegdheid worden overgedragen de baatbelasting, genoemd in [artikel 222 van de Gemeentewet][ref2], te heffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel222
