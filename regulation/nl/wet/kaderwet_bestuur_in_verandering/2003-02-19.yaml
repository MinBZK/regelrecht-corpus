  - number: '24'
    text: |-
      1 Gedeputeerde staten leggen een regeling op binnen acht weken na het verstrijken van de in [artikel 23][ref1]
      genoemde termijn.

      2 Alvorens een regeling op te leggen, horen gedeputeerde staten de besturen van de betrokken gemeenten.

      3 Gedeputeerde staten zenden een afschrift van de opgelegde regeling aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel23
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel24
