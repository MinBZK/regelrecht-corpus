        bwb_id: BWBR0006620
        artikel: '32'
        hoofdstuk: '2'
        afdeling: '7'
  - number: '55'
    text: |-
      Een krachtens deze wet vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel55
  - number: '56'
    text: |-
      1 Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister de in deze wet voorkomende aanhalingen
      van de artikelen, titels, hoofdstukken en paragrafen van de [Gemeentewet][ref1] in overeenstemming met de op dat
      moment geldende nummering van de [Gemeentewet][ref2].

      2 Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister de in deze wet voorkomende aanhalingen
      van de artikelen, titels, hoofdstukken en paragrafen van de [Provinciewet][ref3] in overeenstemming met de op dat
      moment geldende nummering van de [Provinciewet][ref4].

      3 Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister de in deze wet voorkomende aanhalingen
      van artikelen en afdelingen van de [Algemene wet bestuursrecht][ref5] in overeenstemming met de door Onze Minister
      van Justitie opnieuw vastgestelde nummering daarvan.

      4 Indien het bij koninklijke boodschap van 18 mei 1990 ingediende voorstel van wet, houdende uitbreiding van de
      [Wet bodembescherming][ref6] met een regeling inzake de sanering van de bodem, tot de wet wordt verheven en in
      werking treedt op een eerder tijdstip dan deze wet, brengt Onze Minister de in deze wet voorkomende aanhalingen van
      artikelen van de [Wet bodembescherming][ref7] in overeenstemming met de door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer opnieuw vastgestelde nummering daarvan.

      5 Indien het bij koninklijke boodschap van 18 mei 1990 ingediende voorstel van wet, houdende uitbreiding van
      de [Wet bodembescherming][ref8] met een regeling inzake de sanering van de bodem, tot wet wordt verheven en in
      werking treedt op hetzelfde of een later tijdstip dan deze wet, wordt de tekst van het krachtens [artikel 51][ref9]
      gewijzigde onderdeel van de [Wet bodembescherming][ref10] door Onze Minister van Justitie in het *Staatsblad*
      geplaatst, nadat de in dat artikel voorkomende aanhalingen van artikelen van de [Wet bodembescherming][ref11] door
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming met de door hem opnieuw
      vastgestelde nummering daarvan zijn gebracht.

      6 Voor de plaatsing van deze wet in het *Staatsblad* stelt Onze Minister de nummering van de artikelen, paragrafen,
      afdelingen en hoofdstukken van deze wet opnieuw vast en brengt hij de in deze wet voorkomende aanhalingen van
      artikelen, paragrafen, afdelingen en hoofdstukken daarmee in overeenstemming.


