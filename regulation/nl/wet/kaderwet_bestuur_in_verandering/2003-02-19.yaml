preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voorzieningen te treffen ter bevordering van de
    totstandkoming van regionaal bestuur in daartoe aangewezen gebieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken;

      b. samenwerkingsgebied: een samenwerkingsgebied als bedoeld in
      [artikel 2 van de Wet gemeenschappelijke regelingen][ref1], waarop ingevolge [artikel 2][ref2] deze wet van
      toepassing is verklaard;

      c. regeling: een gemeenschappelijke regeling als bedoeld in
      [hoofdstuk I van de Wet gemeenschappelijke regelingen][ref3], waarin voorzieningen zijn getroffen met betrekking
      tot regionaal bestuur als bedoeld in [hoofdstuk 2][ref4] en die is vastgesteld overeenkomstig het bepaalde in de
      [afdelingen 2][ref5], [3][ref6] en 7 van hoofdstuk 2;

      d. regionaal openbaar lichaam: een openbaar lichaam als bedoeld in [hoofdstuk 2][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel2
