  - number: '10'
    text: |-
      1 In afwijking van [artikel 13, negende lid, van de Wet gemeenschappelijk regelingen][ref1], kan het algemeen
      bestuur een voorzitter aanwijzen van buiten de kring van het algemeen bestuur.

      2 Indien toepassing wordt gegeven aan het eerste lid, is [artikel 21 van de Wet gemeenschappelijke regelingen][ref2]
      niet van toepassing. Bij de regeling, of krachtens de regeling door het algemeen bestuur, wordt de bezoldiging van
      de voorzitter geregeld, alsmede aangelegenheden zijn rechtspositie betreffende die regeling behoeven.

      3 Indien toepassing wordt gegeven aan het eerste lid zijn de [artikelen 66, tweede tot en met vierde lid][ref3], en
      [67 tot en met 71 van de Gemeentewet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
