  - number: '23'
    text: |-
      1 Indien niet binnen de termijn van zes maanden, bedoeld in [artikel 7, eerste lid][ref1], door de besturen van de
      in een samenwerkingsgebied gelegen gemeenten een regeling ter goedkeuring aan gedeputeerde staten is voorgelegd, of
      indien gedeputeerde staten een regeling goedkeuren met toepassing van [artikel 36, vierde lid, onder ][ref2], wordt
      door gedeputeerde staten een regeling opgelegd.

      2 Onder oplegging van een regeling wordt mede begrepen de oplegging van een toetreding tot en uittreding uit,
      alsmede wijziging van een regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel36
