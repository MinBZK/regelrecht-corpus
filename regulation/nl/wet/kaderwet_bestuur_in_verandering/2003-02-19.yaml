  - number: '11'
    text: |-
      1 In een regeling kan worden bepaald dat het algemeen bestuur van het regionaal openbaar lichaam commissies kan
      instellen waaraan de behartiging van de belangen van een deel van het samenwerkingsgebied is opgedragen. Het
      algemeen bestuur regelt de bevoegdheden en samenstelling.

      2 De [artikelen 94][ref1] en [139 tot en met 144 van de Gemeentewet][ref2]
      en de [artikelen 21][ref3], [23, eerste en tweede lid][ref4], en
      [25, tweede tot en met zevende lid, van de Wet gemeenschappelijke regelingen][ref5] zijn van overeenkomstige
      toepassing.


