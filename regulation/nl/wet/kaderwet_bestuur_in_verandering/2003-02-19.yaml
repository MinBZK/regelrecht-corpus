  - number: '31'
    text: |-
      1 Een regeling bepaalt de datum waarop zij in werking treedt, met dien verstande dat
      die datum niet kan zijn gelegen vóór de datum van opneming in het register, bedoeld in
      [artikel 27, tweede lid, van de Wet gemeenschappelijke regelingen][ref1].

      2 Een regeling geldt gedurende ten hoogste 4 jaar, te rekenen vanaf de datum van inwerkingtreding, bedoeld in het
      eerste lid.

      3 Op verzoek van het algemeen bestuur van het regionaal openbaar lichaam kan bij koninklijk besluit de in het
      tweede lid genoemde termijn eenmaal worden verlengd met ten hoogste vier jaar.

      4 Een regeling houdt bepalingen in omtrent wijziging, opheffing, toetreding en uittreding.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel27
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '27'
  - number: '32'
    text: |-
      1 Uiterlijk een jaar voor het verstrijken van de in [artikel 31, tweede lid][ref1], genoemde termijn rapporteren
      de raden van de in een samenwerkingsgebied gelegen gemeenten en het algemeen bestuur van het betrokken regionaal
      openbaar lichaam afzonderlijk of gezamenlijk aan provinciale staten van de betrokken provincie of provincies en aan
      Onze Minister omtrent het functioneren van het regionaal openbaar lichaam. In de rapportage doen zij voorts verslag
      van hun overige bevindingen.

      2 Binnen drie maanden nadat provinciale staten de rapportage hebben ontvangen delen zij hun oordeel daaromtrent mee
      aan de raden van de betrokken gemeenten, aan het algemeen bestuur van het betrokken regionaal openbaar lichaam en
      aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel31
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '31'
        hoofdstuk: '2'
        afdeling: '7'
  - number: '33'
    text: |-
      De Minister van Binnenlandse Zaken deelt binnen zes maanden na ontvangst van de in [artikel 32, eerste lid][ref1],
      bedoelde rapportage zijn standpunt omtrent de rapportage aan beide Kamers der Staten-Generaal mede.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel32
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel33
