  - number: '26'
    text: |-
      1 Indien niet binnen de termijn, genoemd in [artikel 24, eerste lid][ref1], door gedeputeerde staten een regeling
      is opgelegd, wordt een regeling opgelegd bij koninklijk besluit. In dat geval is [artikel 24, tweede lid][ref2],
      van overeenkomstige toepassing.

      2 Een regeling wordt voorts bij koninklijk besluit opgelegd, indien niet binnen de termijn, bedoeld in
      [artikel 25, derde lid][ref3], in de oplegging is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel24
