        artikel: '107'
  - number: '21'
    text: |-
      1 Het bestuur van een in het samenwerkingsgebied gelegen gemeente verleent zijn medewerking aan de uitvoering van
      besluiten die het bestuur van het regionaal openbaar lichaam neemt in verband met de uitoefening van de aan dat
      bestuur overgedragen bevoegdheden.

      2 Indien het bestuur van een gemeente naar het oordeel van het dagelijks bestuur van het regionaal openbaar lichaam
      de in het eerste lid bedoelde medewerking niet of niet in voldoende mate verleent, kan het dagelijks bestuur van
      het regionaal openbaar lichaam zelf ten laste van de betrokken gemeente een besluit uitvoeren of doen uitvoeren.

      3 Alvorens over te gaan tot toepassing van het tweede lid, wordt het bestuur van de betrokken gemeente in kennis
      gesteld van het daarop gerichte voornemen.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel21
  - number: '22'
    text: |-
      1 In het in [artikel 23][ref1] bedoelde geval treden de artikelen 24 tot en met 26 in de plaats van
