        artikel: 10:31
  - number: '8'
    text: |-
      In afwijking van [artikel 8 van de Wet gemeenschappelijke regelingen][ref1], voorziet een regeling in de instelling
      van een openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '9'
    text: |-
      1 In afwijking van [artikel 13, eerste en tweede lid, van de Wet gemeenschappelijke regelingen][ref1], kan in een
      regeling worden bepaald dat:

      a. de leden van het algemeen bestuur van het regionaal openbaar lichaam door de leden en de voorzitters van de
      raden van de in het samenwerkingsgebied gelegen gemeenten gezamenlijk worden aangewezen;

      b. als lid van het algemeen bestuur van het regionaal openbaar lichaam tevens kunnen worden aangewezen degenen die
      voorkomen op de kandidatenlijsten voor de laatst gehouden of gelijktijdig te houden verkiezing van de raden van de
      in het samenwerkingsgebied gelegen gemeenten, doch die niet tot raadslid zijn of worden verkozen;

      c. het lidmaatschap van het algemeen bestuur niet van rechtswege eindigt, zodra men ophoudt lid of voorzitter te
      zijn van de raad uit wiens midden men is aangewezen dan wel secretaris van de desbetreffende gemeente.

      2 Indien toepassing wordt gegeven aan het eerste lid, onderdeel *a*, is
      [artikel 13, derde lid, van de Wet gemeenschappelijke regelingen][ref2] niet van toepassing. In de regeling wordt
      het aantal leden van het algemeen bestuur vastgesteld.

      3 Indien toepassing wordt gegeven aan het eerste lid, onderdeel *a*, is
      [artikel 16, eerste en derde tot en met zesde lid, van de Wet gemeenschappelijke regelingen][ref3] niet van
      toepassing.

      4 Indien toepassing wordt gegeven aan het eerste lid, onderdeel *b*, en personen tot lid van het algemeen bestuur
      worden aangewezen, die niet tevens lid van de raad of wethouder zijn van een in het samenwerkingsgebied gelegen
      gemeente, zijn op hen de [artikelen 12 tot en met 15 van de Gemeentewet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel12
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel9
