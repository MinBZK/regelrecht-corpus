  - number: '27'
    text: |-
      1 Indien naar het oordeel van gedeputeerde staten het bestuur van een regionaal openbaar lichaam tekortschiet
      in de uitoefening van een aan dat bestuur krachtens de regeling of krachtens [hoofdstuk 4][ref1] van deze wet
      overgedragen bevoegdheid of opgedragen taak, kunnen gedeputeerde staten aan dat bestuur een aanwijzing geven die
      inhoudt dat het bestuur die bevoegdheid of taak uitoefent op de wijze als in de aanwijzing bepaald.

      2 De aanwijzing wordt niet gegeven dan nadat gedeputeerde staten het bestuur van het regionaal openbaar lichaam
      hebben gehoord.

      3 Bij de aanwijzing stellen gedeputeerde staten een termijn binnen welke het bestuur van het regionaal openbaar
      lichaam aan de aanwijzing moet voldoen.

      4 Indien het bestuur van het regionaal openbaar lichaam niet binnen de termijn, bedoeld in het derde lid, aan de
      aanwijzing voldoet, oefenen gedeputeerde staten de desbetreffende bevoegdheid of taak uit namens het bestuur van
      het regionaal openbaar lichaam en ten laste van dat openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006620
        hoofdstuk: '4'
  - number: '28'
    text: |-
      1 Onze Minister wie het aangaat, kan, in overeenstemming met Onze Minister, gedeputeerde staten uitnodigen
      toepassing te geven aan [artikel 27, eerste lid][ref1].

      2 De uitnodiging vermeldt de termijn binnen welke een aanwijzing als bedoeld in [artikel 27, eerste lid][ref2],
      dient te worden gegeven.

      3 Indien gedeputeerde staten aan de uitnodiging geen gevolg geven, wordt de aanwijzing gegeven door Onze Minister
      wie het aangaat, in overeenstemming met Onze Minister. [Artikel 27, tweede tot en met vierde lid][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0006620#Artikel27
