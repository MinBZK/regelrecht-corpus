  - number: '4'
    text: |-
      1 Bij toepassing van [artikel 3, eerste lid][ref1], stellen provinciale staten binnen zes maanden
      na inwerkingtreding van de in dat artikel bedoelde algemene maatregel van bestuur, de indeling in
      samenwerkingsgebieden opnieuw vast, met inachtneming van die maatregel.

      2 [Artikel 3, vierde lid, derde volzin, van de Wet gemeenschappelijke regelingen][ref2] is niet van toepassing op
      het indelingsbesluit, bedoeld in het eerste lid.

      3 Indien provinciale staten niet binnen de termijn, bedoeld in het eerste lid, de indeling in samenwerkingsgebieden
      hebben aangepast, stelt Onze Minister, provinciale staten gehoord, de indeling in samenwerkingsgebieden
      opnieuw vast. [Artikel 3 van de Wet gemeenschappelijke regelingen][ref3] is van overeenkomstige toepassing, met
      uitzondering van het vierde lid, derde volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel3
