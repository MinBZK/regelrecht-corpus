  - number: '12'
    text: |-
      In een regeling kan worden bepaald dat [artikel 28 van de Wet gemeenschappelijke regelingen][ref1]
      niet van toepassing is. In dat geval voorziet de regeling anderszins in de beslechting van geschillen
      omtrent de toepassing, in de ruimste zin, van de regeling, voorzover zij niet behoren tot die, vermeld
      in [artikel 112, eerste lid, van de Grondwet][ref2] of tot die, waarvan de beslissing krachtens
      [artikel 112, tweede lid, van de Grondwet][ref3] is opgedragen hetzij aan de rechterlijke macht, hetzij aan
      gerechten die niet tot de rechterlijke macht behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel112
