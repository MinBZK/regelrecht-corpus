        artikel: '81'
  - number: '16'
    text: |-
      1 Een regeling voorziet erin dat het algemeen bestuur van een regionaal openbaar lichaam een regionaal verkeers-
      en vervoerplan vaststelt, dat met het oog op de bevordering van de bereikbaarheid en de leefbaarheid richting geeft
      aan de door het bestuur van het regionaal openbaar lichaam te nemen beslissingen inzake verkeer en vervoer en op
      grond waarvan het bestuur van het regionaal openbaar lichaam aan de in het samenwerkingsgebied gelegen gemeenten
      aanwijzingen kan geven met betrekking tot het door die gemeenten terzake te voeren beleid.

      2 Een regionaal verkeers- en vervoerplan is een geïntegreerd plan, waarin in ieder geval zijn opgenomen het
      fietsbeleid, het parkeerbeleid, het verkeersveiligheidbeleid, het openbaar-vervoerbeleid, het wegenbeleid, het
      lokatiebeleid, het carpoolbeleid en het beleid inzake het goederenvervoer.

      3 Een regionaal verkeers- en vervoerplan wordt vastgesteld en gewijzigd overeenkomstig het bepaalde in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1].

      4 Bij het opstellen van het plan houdt het algemeen bestuur rekening met het bestaande rijks- en provinciaal
      beleid ten aanzien van de in het tweede lid genoemde beleidsterreinen en vindt afstemming plaats met het regionaal
      structuurplan, met oog op de samenhang tussen enerzijds wonen, werken en recreëren en anderzijds het geïntegreerd
      verkeers- en vervoerbeleid.

      5 Onze Minister van Verkeer en Waterstaat kan aan een regionaal openbaar lichaam een financiële bijdrage
      verlenen voor de kosten van uitvoering van het regionaal verkeers- en vervoerplan, behoudens in de gevallen
      waarin een financiële bijdrage wordt verleend ter uitvoering van de [Wet personenvervoer 2000][ref2] en de
      [Wet Infrastructuurfonds][ref3]. Bij algemene maatregel van bestuur, op de voordracht van Onze Minister van Verkeer
      en Waterstaat, kunnen regels worden gesteld over het verlenen van deze bijdrage.

      6 Onze Minister van Verkeer en Waterstaat verleent slechts een bijdrage als bedoeld in het vijfde lid, indien
      het regionaal verkeers- en vervoerplan past binnen het rijksbeleid ten aanzien van de in het tweede lid genoemde
      beleidsterreinen.

      7 Bij algemene maatregel van bestuur, op de voordracht van Onze Minister van Verkeer en Waterstaat, worden regels
      gesteld over de compensatie van kosten verbonden aan het voorbereiden en opstellen van een regionaal verkeers- en
      vervoerplan. Deze regels bevatten in elk geval bepalingen over:

      a. de gegevens die bij een aanvraag moeten worden verstrekt;

      b. de voorwaarden, waaraan moet worden voldaan om voor een bijdrage in aanmerking te kunnen komen;

      c. de voor vergoeding in aanmerking komende kosten;

      d. de controle op de besteding van de bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0011470
      [ref3]: https://wetten.overheid.nl/BWBR0006001
