  - number: '7'
    text: |-
      1 De besturen van de in een samenwerkingsgebied gelegen gemeenten leggen binnen zes maanden na de dag waarop deze
      wet voor het samenwerkingsgebied in werking is getreden, een regeling ter goedkeuring voor aan gedeputeerde staten.
      Tegelijk met de verzending ter goedkeuring wordt een afschrift van de regeling gezonden aan Onze Minister.

      2 Het besluit omtrent goedkeuring wordt binnen acht weken bekendgemaakt. In afwijking van
      [artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] kan een besluit omtrent goedkeuring
      niet worden verdaagd. Van hun besluit zenden gedeputeerde staten onverwijld afschrift aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel7
