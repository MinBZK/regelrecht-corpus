        artikel: '23'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '25'
    text: |-
      1 Indien Onze Minister, gelet op de door een regionaal openbaar lichaam uit te oefenen bevoegdheden, bedenkingen
      heeft tegen een door gedeputeerde staten ingevolge [artikel 24][ref1] opgelegde regeling, geeft hij, in
      overeenstemming met Onze Ministers wie het mede aangaat, binnen acht weken na de datum waarop gedeputeerde staten
      de regeling hebben opgelegd, een aanwijzing aan gedeputeerde staten die inhoudt dat gedeputeerde staten een nieuwe
      regeling moeten opleggen overeenkomstig het in de aanwijzing bepaalde.

      2 De aanwijzing wordt niet gegeven dan nadat Onze Minister het bestuur van de betrokken provincie of provincies
      heeft gehoord.

      3 Bij de aanwijzing stelt Onze Minister een termijn binnen welke gedeputeerde staten een nieuwe regeling moeten
      opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel24
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel25
