        artikel: '32'
        hoofdstuk: '2'
        afdeling: '7'
  - number: '34'
    text: |-
      De Minister van Binnenlandse Zaken zendt jaarlijks aan de Staten-Generaal een verslag over de doeltreffendheid en
      de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel34
  - number: '35'
    text: Dit hoofdstuk is van toepassing voor het samenwerkingsgebied waarin de gemeente Rotterdam is gelegen.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel35
  - number: '36'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. de commissie: de commissie, bedoeld in [artikel 37][ref1];

      b. de betrokken besturen: het bestuur van de gemeente Rotterdam, het bestuur van de provincie Zuid-Holland, het
      bestuur van het regionaal openbaar lichaam en Onze Minister;

      c. de nieuwe bestuurlijke organisaties: de bestuurlijke organisaties die in het samenwerkingsgebied worden
      ingesteld door een wet die voorziet in een regeling van de bestuurlijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel37
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '37'
        hoofdstuk: '3'
  - number: '37'
    text: Er is een commissie reorganisatie bestuur regio Rotterdam.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel37
  - number: '38'
    text: |-
      1 De commissie bereidt de totstandkoming voor van een overeenkomst te sluiten tussen de betrokken besturen.

      2 In de overeenkomst wordt de afstemming geregeld van de werkzaamheden van de betrokken besturen bij het opbouwen
      van de nieuwe bestuurlijke organisaties.

      3 De overeenkomst bevat ten minste een werkprogramma voor het tot stand brengen van:

      a. een beschrijving van de organisatorische vormgeving van de nieuwe bestuurlijke organisaties;

      b. personeelsformatieplannen die een in aantallen en bezoldigingsniveaus uitgedrukte opgave bevatten van de te
      verwachten functies in de nieuwe bestuurlijke organisaties;

      c. personeelsplannen die bestemmingsbeslissingen inhouden voor de overgang van personeel naar de nieuwe
      bestuurlijke organisaties;

      d. verdelingsplannen voor de overgang van rechten en verplichtingen naar de nieuwe bestuurlijke organisaties.

      e. een beschrijving van het voorgestane stelsel van informatievoorziening.

      4 De overeenkomst bevat een regeling van het overleg met de bonden van overheidspersoneel over de uitvoering van de
      in het derde lid, onder *a* tot en met *c*, bedoelde onderdelen van het werkprogramma.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel38
  - number: '39'
    text: |-
      1 De commissie bevordert de goede uitvoering van de overeenkomst, bedoeld in [artikel 38, eerste lid][ref1].
      Daarbij besteedt zij met name aandacht aan de samenhang van de in [artikel 38, derde lid, onder ][ref2], bedoelde
      onderdelen.

      2 De betrokken besturen rapporteren volgens regels door de commissie te stellen, aan de commissie over de
      uitvoering van het in [artikel 38, derde lid][ref3], bedoelde werkprogramma.

      3 Indien uit de rapportage, bedoeld in het tweede lid, blijkt dat de uitvoering van het werkprogramma niet loopt
      volgens het bepaalde in de overeenkomst, brengt de voorzitter dit zo spoedig mogelijk ter kennis van de commissie.
      Daarbij doet de voorzitter voorstellen voor door de commissie te nemen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006620#Artikel38
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel39
