  - number: '18'
    text: |-
      1 Een regeling voorziet in de behartiging door het regionaal openbaar lichaam van het belang van de economische
      ontwikkeling van het samenwerkingsgebied.

      2 Hiertoe voorziet de regeling er ten minste in dat het regionaal openbaar lichaam:

      a. periodiek een regionaal-economische ontwikkelingsstrategie opstelt;

      b. bij de uitoefening van zijn bevoegdheden op het terrein van de ruimtelijke ordening, verkeer en vervoer, milieu
      en arbeidsmarktbeleid, rekening houdt met de regionaal-economische ontwikkelingsstrategie;

      c. het beleid aangeeft ter zake van de uitoefening van zijn bevoegdheden met betrekking tot bedrijfsterreinen,
      kantoorlokaties en detailhandelsvoorzieningen die van regionaal belang zijn, daaronder mede begrepen de zee- en
      luchthavens en de daarbij behorende bedrijfslokaties;

      d. het regionaal economisch onderzoek bevordert;

      e. de hoofdlijnen vaststelt van een regionaal promotie- en acquisitiebeleid gericht op bedrijfsvestiging en
      toerisme.
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel18
  - number: '19'
    text: |-
      Indien bij de besturen van de in een samenwerkingsgebied gelegen gemeenten bezwaren van overwegende
      aard bestaan tegen opneming in de regeling van één of meer van de bevoegdheden, bedoeld in de
      [artikelen 14 tot en met 18][ref1], kan Onze Minister, in overeenstemming met Onze Ministers wie het mede aangaat,
      op gezamenlijk verzoek van die besturen besluiten:

      a. dat één of meer van die bevoegdheden niet in de regeling behoeven te worden opgenomen, danwel

      b. dat de desbetreffende bevoegdheden wel in de regeling worden opgenomen, doch dat zij gedurende een door Onze
      Minister te bepalen termijn niet behoeven te worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel14
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '20'
    text: |-
      Onverminderd het bepaalde in [artikel 107, eerste lid, van de Provinciewet][ref1], kan het provinciaal bestuur
      bevoegdheden van regeling en bestuur, gevorderd bij of krachtens een andere wet dan de [Provinciewet][ref2], voor
      het samenwerkingsgebied overdragen aan het bestuur van een regionaal openbaar lichaam, voor zover die bevoegdheden
      zich naar hun aard en schaal daartoe lenen en het bestuur van dat regionaal openbaar lichaam daarmee instemt.
      [Artikel 107, tweede tot en met achtste lid, van de Provinciewet][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005645
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel107
    url: https://wetten.overheid.nl/BWBR0006620/2003-02-19#Artikel20
