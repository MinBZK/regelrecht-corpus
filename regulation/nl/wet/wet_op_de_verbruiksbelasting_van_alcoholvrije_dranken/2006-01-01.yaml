---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_verbruiksbelasting_van_alcoholvrije_dranken
regulatory_layer: WET
publication_date: '2022-12-27'
valid_from: '2006-01-01'
bwb_id: BWBR0005802
url: https://wetten.overheid.nl/BWBR0005802/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de aanpassing van de wetgeving inzake accijnzen aan
    de Richtlijn van de Raad van de Europese Gemeenschappen betreffende de algemene regeling voor accijnsprodukten,
    het voorhanden hebben en het verkeer daarvan en de controles daarop (92/12/EEG van 25 februari 1992; PbEG
    L 76) wenselijk is een afzonderlijke wettelijke regeling in te voeren voor het stelsel van heffing van de
    verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel1
  - number: 1.1.a
    text: een verbruiksbelasting van alcoholvrije dranken;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel1
  - number: 1.1.b
    text: een verbruiksbelasting van pruimtabak en snuiftabak.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onder de naam verbruiksbelasting van alcoholvrije dranken wordt een belasting geheven ter zake van de uitslag en de
      invoer van alcoholvrije dranken.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel1
  - number: '1.3'
    text: |-
      Onder de naam verbruiksbelasting van pruimtabak en snuiftabak wordt een belasting geheven ter zake van de uitslag
      en de invoer van pruimtabak en van snuiftabak.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel1
  - number: '2'
    text: 'In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.a
    text: |-
      vervaardigen van alcoholvrije dranken, pruimtabak of snuiftabak: elk handelen waarbij of waardoor die goederen
      ontstaan of de voor de belastingheffing relevante samenstelling daarvan wordt gewijzigd;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.b
    text: |-
      inrichting: iedere plaats waar op grond van de bepalingen van deze wet alcoholvrije dranken, pruimtabak of
      snuiftabak onder schorsing van belasting mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn,
      mogen worden ontvangen en mogen worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.c
    text: |-
      entrepot: zowel de douanebestemming vrij entrepot als de douaneregeling douane-entrepot als bedoeld in artikel 4,
      onderdelen 15 en 16, van het Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.d
    text: |-
      plaats voor tijdelijke opslag: een plaats die als zodanig is goedgekeurd krachtens artikel 51, eerste lid, van het
      Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.e
    text: 'lid-staat: een lid-staat van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.f
    text: |-
      derde land: elk ander grondgebied dan het grondgebied van de lid-staten zoals dat is omschreven in artikel 2 van de
      Richtlijn betreffende de algemene regeling voor accijnsprodukten, het voorhanden hebben en het verkeer daarvan en
      de controles daarop (92/12/EEG van 25 februari 1992; *PbEG* L 76);
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.g
    text: |-
      communautaire douaneregeling: de communautaire regelingen met betrekking tot douanevervoer, entrepots, actieve
      veredeling, behandeling onder douanetoezicht, tijdelijke invoer, passieve veredeling en uitvoer naar een derde land
      (wederuitvoer daaronder begrepen);
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.h
    text: |-
      schorsing van belasting: het stelsel waarin van goederen die worden vervaardigd, worden verwerkt, voorhanden zijn
      of worden vervoerd, op grond van de bepalingen van deze wet de belasting nog niet is geheven;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
  - number: 2.i
    text: |-
      ondernemer: een ondernemer in de zin van de [Wet op de omzetbelasting 1968][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '3.1'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder uitslag het brengen van alcoholvrije
      dranken, pruimtabak of snuiftabak buiten een plaats die voor dat soort goed als inrichting is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: '3.2'
    text: |-
      Als uitslag wordt mede aangemerkt het verbruik, anders dan als grondstof, van alcoholvrije dranken, pruimtabak of
      snuiftabak binnen een plaats die voor dat soort goed als inrichting is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: '3.3'
    text: |-
      Als uitslag wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te stellen
      voorwaarden, brengen van alcoholvrije dranken, pruimtabak of snuiftabak vanuit een inrichting naar:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: 3.3.a
    text: een andere inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: 3.3.b
    text: een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere lid-staat;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: 3.3.c
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: '3.4'
    text: |-
      De voorwaarden, bedoeld in het derde lid, hebben betrekking op formaliteiten waaraan bij de overbrenging van de
      goederen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: '3.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel3
  - number: '4.1'
    text: |-
      Als uitslag wordt mede aangemerkt het voorhanden hebben van alcoholvrije dranken, pruimtabak of snuiftabak waarvan
      de belasting niet is geheven, door:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.1.a
    text: |-
      een ondernemer in het kader van zijn onderneming, anders dan in een inrichting die voor dat soort goed als zodanig
      is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.1.b
    text: een publiekrechtelijk lichaam, anders dan als ondernemer;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.1.c
    text: een natuurlijke persoon voor andere doeleinden dan voor persoonlijk verbruik.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is, onder bij algemene maatregel van bestuur te stellen voorwaarden, niet van toepassing met
      betrekking tot alcoholvrije dranken, pruimtabak of snuiftabak die worden vervoerd naar:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.2.a
    text: een inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.2.b
    text: een ondernemer of een publiekrechtelijk lichaam, anders dan als ondernemer;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.2.c
    text: een natuurlijke persoon die de goederen voor andere doeleinden dan voor persoonlijk verbruik betrekt in Nederland;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.2.d
    text: een andere lid-staat via Nederland;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: 4.2.e
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, worden bepaald
      dat het eerste lid geen toepassing vindt indien sprake is van het op incidentele basis aanwenden van beperkte
      hoeveelheden alcoholvrije dranken, pruimtabak of snuiftabak voor eigen verbruik in het kader van de onderneming of
      het publiekrechtelijke lichaam.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: '4.4'
    text: |-
      Bij algemene maatregel van bestuur worden, ter verzekering van de heffing, regels gesteld met betrekking tot de
      verplichtingen waaraan de in het eerste lid bedoelde personen of lichamen moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: '4.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel4
  - number: '5.1'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder invoer het vanuit een derde land brengen van
      alcoholvrije dranken, pruimtabak of snuiftabak in Nederland.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: '5.2'
    text: 'Als invoer wordt mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.2.a
    text: |-
      het in Nederland beëindigen van een communautaire douaneregeling waaronder alcoholvrije dranken, pruimtabak of
      snuiftabak zijn geplaatst, anders dan door plaatsing onder een andere communautaire douaneregeling;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.2.b
    text: |-
      het in Nederland onttrekken van alcoholvrije dranken, pruimtabak of snuiftabak aan een communautaire
      douaneregeling;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.2.c
    text: |-
      het eigen verbruik, anders dan als grondstof, in Nederland van alcoholvrije dranken, pruimtabak of snuiftabak die
      onder een communautaire douaneregeling zijn geplaatst of binnen een plaats voor tijdelijke opslag.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: '5.3'
    text: |-
      Als invoer wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te stellen
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.3.a
    text: |-
      brengen van alcoholvrije dranken, pruimtabak of snuiftabak vanuit een derde land naar een inrichting die voor dat
      soort goed als zodanig is aangewezen of naar een plaats voor tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.3.b
    text: |-
      in Nederland plaatsen onder een communautaire douaneregeling van vanuit een derde land binnengebrachte alcoholvrije
      dranken, pruimtabak of snuiftabak;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.3.c
    text: |-
      brengen van alcoholvrije dranken, pruimtabak of snuiftabak die zijn geplaatst onder een communautaire
      douaneregeling naar een inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.3.d
    text: |-
      brengen van alcoholvrije dranken, pruimtabak of snuiftabak vanuit een plaats voor tijdelijke opslag naar een
      inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: 5.3.e
    text: |-
      onder ambtelijk toezicht vernietigen van alcoholvrije dranken, pruimtabak of snuiftabak die onder een communautaire
      douaneregeling zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: '5.4'
    text: |-
      De voorwaarden, bedoeld in het derde lid, hebben betrekking op formaliteiten waaraan bij de overbrenging van de
      goederen moet worden voldaan alsmede op de daarbij te stellen zekerheid.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: '5.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel5
  - number: '6'
    text: |-
      Onder alcoholvrije dranken worden verstaan vruchte- en groentesap, mineraalwater en limonade, ook indien zij
      alcohol bevatten, voor zover zij niet worden aangemerkt als bier, wijn, tussenprodukten of overige alcoholhoudende
      produkten in de zin van de [Wet op de accijns][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: '7.1'
    text: |-
      Onder vruchte- en groentesap wordt verstaan drank die bestaat uit sap van vruchten of groenten of een mengsel
      daarvan, mengsels van water en vruchtesap die tenminste een bij ministeriële regeling vast te stellen percentage
      vruchtesap of vruchtemoes bevatten daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel7
  - number: '7.2'
    text: |-
      Als vruchte- en groentesap wordt mede aangemerkt de drank, bedoeld in het eerste lid, in vaste vorm of als
      concentraat in kleinhandelsverpakking of in een verpakking die is bestemd voor afnemers die voor gebruik gereed
      vruchte- en groentesap vervaardigen voor gebruik ter plaatse.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel7
  - number: '8'
    text: 'Onder mineraalwater wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel8
  - number: 8.a
    text: natuurlijk en kunstmatig mineraalwater;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel8
  - number: 8.b
    text: spuitwater;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel8
  - number: 8.c
    text: |-
      water dat kennelijk is bestemd voor inwendig gebruik door de mens, in kleinhandelsverpakking of in een verpakking
      die is bestemd voor afnemers die daaruit water voor gebruik ter plaatse afleveren.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onder limonade worden verstaan met water aangelengd vruchte- of groentesap alsmede gezoete en aromatische dranken
      en dranken waaraan geurstoffen of smaakstoffen zijn toegevoegd die kennelijk zijn bestemd om onverwarmd te worden
      gedronken.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel9
  - number: '9.2'
    text: |-
      Als limonade wordt mede aangemerkt de drank, bedoeld in het eerste lid, in vaste vorm of als concentraat in
      kleinhandelsverpakking of in een verpakking die is bestemd voor afnemers die voor gebruik gerede limonade
      vervaardigen voor gebruik ter plaatse.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel9
  - number: '9.3'
    text: 'Als limonade wordt niet aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel9
  - number: 9.3.a
    text: |-
      de uit melk of melkprodukten bereide drank met een gehalte aan melkvetten van 0,02%mas of meer waarin zich
      melkeiwit en melksuiker bevinden, niet zijnde een uit wei of weiprodukten vervaardigde drank;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel9
  - number: 9.3.b
    text: |-
      de uit soja bereide drank met een vetgehalte en een eiwitgehalte die vergelijkbaar zijn met het vetgehalte en het
      eiwitgehalte van melk.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel9
  - number: '10.1'
    text: 'De belasting bedraagt per hectoliter bij een temperatuur van 20°C voor:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel10
  - number: 10.1.a
    text: vruchtesap, groentesap en mineraalwater € 4,13;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel10
  - number: 10.1.b
    text: limonade € 5,50.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel10
  - number: '10.2'
    text: |-
      Voor de toepassing van het eerste lid wordt, met inachtneming van bij ministeriële regeling te stellen regels, het
      volume van vruchte- en groentesap en limonade in vaste vorm of in geconcentreerde vorm herleid tot het volume van
      voor gebruik gereed vruchte- en groentesap of voor gebruik gerede limonade, met dien verstande dat voor limonade in
      vaste of geconcentreerde vorm voor huishoudelijk gebruik deze herleiding geschiedt op basis van de factor 3.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel10
  - number: '10.3'
    text: |-
      Bij ministeriële regeling kan met betrekking tot alcoholvrije dranken in kleinhandelsverpakking worden bepaald dat
      voor de berekening van de belasting het herleiden van het volume van die dranken tot het volume bij een temperatuur
      van 20°C achterwege kan blijven.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel10
  - number: '11.1'
    text: Onder pruimtabak wordt verstaan voor pruimen bereide tabak.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel11
  - number: '11.2'
    text: |-
      Als pruimtabak worden mede aangemerkt produkten die gedeeltelijk uit andere stoffen dan tabak bestaan, doch
      overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel11
  - number: '12.1'
    text: Onder snuiftabak wordt verstaan voor snuiven bereide tabak.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel12
  - number: '12.2'
    text: |-
      Als snuiftabak worden mede aangemerkt produkten die gedeeltelijk uit andere stoffen dan tabak bestaan, doch
      overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel12
  - number: '13'
    text: De belasting bedraagt voor pruimtabak en snuiftabak € 24,04 per kilogram.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel13
  - number: '14.1'
    text: Een plaats kan alleen als inrichting worden gebruikt indien daartoe een vergunning is verstrekt door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel14
  - number: '14.2'
    text: |-
      De [artikelen 40][ref1] en [41 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel41
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '41'
  - number: '15.1'
    text: Degene die een vergunning voor een inrichting wil verkrijgen, dient daartoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel15
  - number: '15.2'
    text: |-
      De [artikelen 42][ref1] en [43 tot en met 50 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '16'
    text: De belasting wordt geheven van de vergunninghouder van de inrichting.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel16
  - number: '17'
    text: |-
      In afwijking van [artikel 16][ref1] wordt de belasting bij toepassing van [artikel 4, eerste lid][ref2], geheven
      van degene die de alcoholvrije dranken, pruimtabak of snuiftabak voorhanden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
  - number: '18'
    text: De belasting wordt verschuldigd op het tijdstip van de uitslag.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel18
  - number: '19'
    text: |-
      In afwijking van [artikel 18][ref1] wordt de belasting bij toepassing van [artikel 4, eerste lid][ref2],
      verschuldigd op het tijdstip van de aanvang van het voorhanden hebben van de alcoholvrije dranken, pruimtabak of
      snuiftabak.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '18'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
  - number: '20.1'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel20
  - number: '20.2'
    text: Aangifte dient te worden gedaan voor elke inrichting afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel20
  - number: '20.3'
    text: |-
      In afwijking van het tweede lid kan bij ministeriële regeling, onder daarbij te stellen voorwaarden, worden
      toegestaan dat voor inrichtingen waarvan de vergunningen op naam zijn gesteld van dezelfde vergunninghouder één
      aangifte voor die inrichtingen te zamen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel20
  - number: '21.1'
    text: |-
      Bij toepassing van [artikel 19][ref1] dient in afwijking van [artikel 20, eerste lid][ref2], en van
      [artikel 10, tweede lid][ref3], en [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref4]
      uiterlijk op de dag na het in [artikel 19][ref5] bedoelde tijdstip aangifte te worden gedaan en de belasting op
      aangifte te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0005802#Artikel19
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0005802
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid kan de inspecteur, bij toepassing van [artikel 4, eerste lid, onderdeel a][ref1],
      op verzoek toestemming verlenen om de in een week op de voet van [artikel 19][ref2] verschuldigd geworden belasting
      uiterlijk op de vrijdag van de week daaropvolgend op aangifte te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel19
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: '22'
    text: |-
      De [artikelen 54][ref1] en [55 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel55
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '55'
  - number: '23.1'
    text: De vergunninghouder stelt zekerheid voor de belasting die hij verschuldigd is of kan worden.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel23
  - number: '23.2'
    text: |-
      De [artikelen 56, vijfde tot en met achtste lid][ref1], en [57][ref2] tot en met
      [60 van de Wet op de accijns][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel60
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '60'
  - number: '24.1'
    text: |-
      De vergunninghouder van een inrichting heeft voor de belasting die is begrepen in de verkoopprijs van de door hem
      geleverde alcoholvrije dranken, pruimtabak of snuiftabak, zolang hij ter zake geen betaling heeft ontvangen doch
      niet langer dan een half jaar nadat hij die belasting verschuldigd is geworden, voorrecht op alle goederen van
      de koper.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel24
  - number: '24.2'
    text: |-
      Het voorrecht, bedoeld in het eerste lid, heeft gelijke rangorde als het voorrecht dat ’s Rijks schatkist heeft op
      de voet van [artikel 21 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: '25'
    text: |-
      De vervoerder van alcoholvrije dranken, pruimtabak of snuiftabak is hoofdelijk aansprakelijk voor het bedrag aan
      belasting dat wordt vertegenwoordigd door de hoeveelheid van die goederen waarvan de belasting niet is geheven
      die door hem wordt vervoerd naar het buitenland, naar een inrichting of naar een persoon of lichaam als bedoeld in
      [artikel 4, eerste lid][ref1], indien tijdens dat vervoer door hem of door zijn toedoen een onregelmatigheid of een
      overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
  - number: '26'
    text: |-
      Ter zake van de belasting bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de Douanewet][ref1], met uitzondering van artikel 868 van de
      toepassingsverordening Communautair douanewetboek, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel2
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '2'
  - number: '27.1'
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden, regels worden gesteld ingevolge welke de
      heffing van belasting van alcoholvrije dranken, van pruimtabak of van snuiftabak die in kleine zendingen dan wel
      door reizigers als bagage worden ingevoerd, geschiedt volgens daarbij vast te stellen forfaitaire tarieven.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel27
  - number: '27.2'
    text: De forfaitaire tarieven zijn niet van toepassing met betrekking tot handelsgoederen.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel27
  - number: '28.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van belasting
      verleend ter zake van de uitslag en de invoer van vruchte- en groentesappen die kennelijk zijn bestemd om te worden
      gebruikt als aanvulling op kindervoeding, voor medicinale doeleinden of anders dan om te worden gedronken.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel28
  - number: '28.2'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel28
  - number: 28.2.a
    text: de aard van en de aanduiding op de verpakking van de in het eerste lid bedoelde vruchte- en groentesappen; en
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel28
  - number: 28.2.b
    text: de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel28
  - number: '29.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van belasting
      verleend ter zake van de uitslag en de invoer van:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel29
  - number: 29.1.a
    text: |-
      vruchte- en groentesappen waarvan de in [artikel 28][ref1] aangegeven bestemming niet of niet voldoende blijkt uit
      die dranken als zodanig, indien degene die die dranken betrekt deze gebruikt voor het vervaardigen van vruchte- of
      groentesappen als bedoeld in [artikel 28][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel28
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '28'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '28'
        hoofdstuk: V
        afdeling: '1'
  - number: 29.1.b
    text: |-
      alcoholvrije dranken, pruimtabak of snuiftabak die door degene die die goederen betrekt, worden gebruikt als
      grondstof voor het vervaardigen van andere goederen dan alcoholvrije dranken, pruimtabak of snuiftabak.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel29
  - number: '29.2'
    text: |-
      Om de alcoholvrije dranken, pruimtabak of snuiftabak met vrijstelling te kunnen betrekken, dient degene die deze
      goederen betrekt in het bezit te zijn van een daartoe strekkende vergunning.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel29
  - number: '29.3'
    text: |-
      [Artikel 65, vierde tot en met zevende lid, van de Wet op de accijns][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
  - number: '29.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel29
  - number: '30.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van belasting
      verleend ter zake van de uitslag en de invoer van alcoholvrije dranken, pruimtabak of snuiftabak die worden
      gebruikt:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel30
  - number: 30.1.a
    text: aan boord van schepen in het verkeer van Nederland naar een andere lid-staat, anders dan over de binnenwateren;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel30
  - number: 30.1.b
    text: aan boord van luchtvaartuigen in het verkeer van Nederland naar een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel30
  - number: '30.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel30
  - number: '31'
    text: |-
      De [artikelen 68][ref1] en [69 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel69
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '69'
  - number: '32.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      belasting verleend voor alcoholvrije dranken, pruimtabak of snuiftabak waarvoor aanspraak op vrijstelling zou
      bestaan op de voet van:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel32
  - number: 32.1.a
    text: artikel 29; of
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel32
  - number: 32.1.b
    text: artikel 30.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel32
  - number: '32.2'
    text: |-
      De in het eerste lid, onderdeel *a*, bedoelde teruggaaf wordt verleend aan degene die een vergunning heeft
      ingevolge [artikel 29, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel29
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '29'
        hoofdstuk: V
        afdeling: '1'
  - number: '32.3'
    text: De in het eerste lid, onderdeel *b*, bedoelde teruggaaf wordt verleend aan degene die de levering heeft verricht.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel32
  - number: '32.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel32
  - number: '33.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      belasting verleend voor alcoholvrije dranken, pruimtabak of snuiftabak die:
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel33
  - number: 33.1.a
    text: zijn verloren gegaan;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel33
  - number: 33.1.b
    text: zijn vernietigd onder ambtelijk toezicht;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel33
  - number: 33.1.c
    text: |-
      zijn gebracht naar een derde land of zijn geplaatst onder een communautaire douaneregeling met als bestemming een
      derde land;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel33
  - number: 33.1.d
    text: zijn gebracht binnen een inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel33
  - number: 33.1.e
    text: |-
      door een ondernemer zijn overgebracht naar een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als
      ondernemer, in een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel33
  - number: '33.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel33
  - number: '34'
    text: De inspecteur beslist op een verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel34
  - number: '35.1'
    text: |-
      Pruimtabak en snuiftabak moeten bij de uitslag en de invoer zijn voorzien van het voor het desbetreffende produkt
      voorgeschreven belastingzegel.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel35
  - number: '35.2'
    text: |-
      De [artikelen 73][ref1], tweede en derde lid, tot en met [77][ref2], [78, eerste, tweede en vierde lid][ref3],
      en [79 van de Wet op de accijns][ref4] zijn van overeenkomstige toepassing, met dien verstande dat voor de
      overeenkomstige toepassing van [artikel 76, tweede lid, van de Wet op de accijns][ref5], de betaling uiterlijk kan
      worden gedaan op de laatste dag van de derde maand volgende op die waarin de belastingzegels zijn aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel79
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel76
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '77'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '78'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '79'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: '76'
  - number: '36'
    text: |-
      De [artikelen 80][ref1], [81][ref2], [83][ref3] en [84 van de Wet op de accijns][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel84
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '81'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '83'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '84'
  - number: '37'
    text: |-
      De [artikelen 85][ref1] en [88, eerste, derde en vierde lid, van de Wet op de accijns][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel88
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '88'
  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel38
  - number: '38.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel38
  - number: '39'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel39
  - number: 39.a
    text: |-
      anders dan als particulier voor eigen verbruik, alcoholvrije dranken, pruimtabak of snuiftabak te vervaardigen
      buiten een inrichting die voor dat soort goed als zodanig is aangewezen, tenzij deze vervaardiging plaatsvindt
      overeenkomstig de ingevolge [artikel 29][ref1] bij algemene maatregel van bestuur gestelde voorwaarden en
      beperkingen, dan wel alcoholvrije dranken worden vervaardigd uit andere alcoholvrije dranken en het bedrag van de
      belasting die eerstbedoelde alcoholvrije dranken vertegenwoordigen niet hoger is dan het bedrag van de belasting
      dat de alcoholvrije dranken vertegenwoordigen waaruit zij zijn vervaardigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel29
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '29'
        hoofdstuk: V
        afdeling: '1'
  - number: 39.b
    text: |-
      alcoholvrije dranken, pruimtabak of snuiftabak voorhanden te hebben die niet overeenkomstig de bepalingen van deze
      wet in de heffing zijn betrokken, met uitzondering van alcoholvrije dranken, pruimtabak of snuiftabak die door
      particulieren voor eigen verbruik zijn betrokken uit een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel39
  - number: '40'
    text: |-
      Met betrekking tot pruimtabak en snuiftabak zijn de [artikelen 93 tot en met 96 van de Wet op de accijns][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel93
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '93'
  - number: '41'
    text: |-
      Degene die opzettelijk een in [artikel 39][ref1] opgenomen verbod overtreedt, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal
      het bedrag van de te weinig geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel39
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '39'
        hoofdstuk: VII
        afdeling: '1'
  - number: '42'
    text: |-
      Degene die opzettelijk alcoholvrije dranken, pruimtabak of snuiftabak waarvoor vrijstelling of teruggaaf van
      belasting is verleend een bestemming geeft waarvoor geen vrijstelling of teruggaaf van belasting zou zijn verleend,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit
      bedrag hoger is, ten hoogste eenmaal het bedrag van de te weinig geheven belasting.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel42
  - number: '43.1'
    text: |-
      Met betrekking tot degene die een bij [artikel 40][ref1] van overeenkomstige toepassing verklaard verbod
      overtreedt, zijn de in [artikel 101 van de Wet op de accijns][ref2] opgenomen strafbepalingen van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel101
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '40'
        hoofdstuk: VII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '101'
  - number: '43.2'
    text: |-
      Degene die pruimtabak of snuiftabak die in strijd met de wettelijke bepalingen niet is voorzien van de
      voorgeschreven belastingzegels uitslaat of invoert, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel43
  - number: '43.3'
    text: |-
      Degene die het in het tweede lid bedoelde verbod opzettelijk overtreedt, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel43
  - number: '44'
    text: Deze wet treedt in werking met ingang van 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel44
  - number: '45'
    text: |-
      Deze wet kan worden aangehaald als Wet op de verbruiksbelastingen van alcoholvrije dranken en van enkele andere
      produkten.
    url: https://wetten.overheid.nl/BWBR0005802/2006-01-01#Artikel45
