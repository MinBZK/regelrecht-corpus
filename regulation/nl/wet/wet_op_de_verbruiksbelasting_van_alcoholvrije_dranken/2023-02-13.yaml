---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_verbruiksbelasting_van_alcoholvrije_dranken
regulatory_layer: WET
publication_date: '2022-12-27'
valid_from: '2023-02-13'
bwb_id: BWBR0005802
url: https://wetten.overheid.nl/BWBR0005802/2023-02-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de aanpassing van de wetgeving inzake accijnzen aan
    de Richtlijn van de Raad van de Europese Gemeenschappen betreffende de algemene regeling voor accijnsprodukten,
    het voorhanden hebben en het verkeer daarvan en de controles daarop (92/12/EEG van 25 februari 1992; PbEG
    L 76) wenselijk is een afzonderlijke wettelijke regeling in te voeren voor het stelsel van heffing van de
    verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Krachtens deze wet wordt een verbruiksbelasting geheven ter zake van de uitslag en de invoer van alcoholvrije
      dranken.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel1
  - number: '2'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.a
    text: |-
      vervaardigen van alcoholvrije dranken: elk handelen waarbij of waardoor die goederen ontstaan of de voor de
      belastingheffing relevante samenstelling daarvan wordt gewijzigd;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.b
    text: |-
      inrichting: iedere plaats waar op grond van de bepalingen van deze wet alcoholvrije dranken onder schorsing van
      belasting mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden ontvangen en mogen
      worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.c
    text: |-
      douane-entrepot: de regeling douane-entrepot, bedoeld in artikel 240, eerste lid, van het Douanewetboek van de
      Unie;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.d
    text: |-
      plaats voor tijdelijke opslag: een ruimte voor tijdelijke opslag of een andere plaats die is aangewezen of
      goedgekeurd voor de opslag van goederen in tijdelijke opslag als bedoeld in artikel 147, eerste lid, van het
      Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.e
    text: 'lidstaat: een lidstaat van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.f
    text: |-
      derde land: elke staat of elk grondgebied waarop het Verdrag betreffende de werking van de Europese Unie niet van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.g
    text: |-
      EU-douaneregeling: de bijzondere regelingen douanevervoer, douane-entrepot, tijdelijke invoer en actieve
      veredeling, bedoeld in artikel 210 van het Douanewetboek van de Unie, uitvoer als bedoeld in artikel 269 van dat
      wetboek en wederuitvoer als bedoeld in artikel 270 van dat wetboek;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.h
    text: |-
      schorsing van belasting: het stelsel waarin van goederen die worden vervaardigd, worden verwerkt, voorhanden zijn
      of worden vervoerd, op grond van de bepalingen van deze wet de belasting nog niet is geheven;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
  - number: 2.i
    text: |-
      ondernemer: een ondernemer in de zin van de [Wet op de omzetbelasting 1968][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '3.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder uitslag: het brengen van alcoholvrije dranken
      buiten een plaats die voor dat soort goederen als inrichting is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: '3.2'
    text: |-
      Indien [artikel 15a, eerste lid][ref1], van toepassing is, wordt als uitslag mede aangemerkt het vervaardigen van
      vruchten- of groentesap boven een hoeveelheid van 12.000 liter per kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: 15a
        hoofdstuk: III
        afdeling: '2'
  - number: '3.3'
    text: |-
      Als uitslag wordt mede aangemerkt het verbruik, anders dan als grondstof, van alcoholvrije dranken binnen een
      plaats die voor dat soort goed als inrichting is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: '3.4'
    text: |-
      Als uitslag wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te stellen
      voorwaarden, brengen van alcoholvrije dranken vanuit een inrichting naar:
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: 3.4.a
    text: een andere inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: 3.4.b
    text: een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: 3.4.c
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: '3.5'
    text: |-
      De voorwaarden, bedoeld in het vierde lid, hebben betrekking op formaliteiten waaraan bij de overbrenging van de
      goederen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: '3.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel3
  - number: '4.1'
    text: |-
      Als uitslag wordt mede aangemerkt het voorhanden hebben van alcoholvrije dranken waarvan de belasting niet is
      geheven, door:
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.1.a
    text: |-
      een ondernemer in het kader van zijn onderneming, anders dan in een inrichting die voor dat soort goed als zodanig
      is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.1.b
    text: een publiekrechtelijk lichaam, anders dan als ondernemer;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.1.c
    text: een natuurlijke persoon voor andere doeleinden dan voor persoonlijk verbruik.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is, onder bij algemene maatregel van bestuur te stellen voorwaarden, niet van toepassing met
      betrekking tot alcoholvrije dranken die worden vervoerd naar:
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.2.a
    text: een inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.2.b
    text: een ondernemer of een publiekrechtelijk lichaam, anders dan als ondernemer;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.2.c
    text: een natuurlijke persoon die de goederen voor andere doeleinden dan voor persoonlijk verbruik betrekt in Nederland;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.2.d
    text: een andere lidstaat via Nederland;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: 4.2.e
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, worden bepaald dat het
      eerste lid geen toepassing vindt indien sprake is van het op incidentele basis aanwenden van beperkte hoeveelheden
      alcoholvrije dranken voor eigen verbruik in het kader van de onderneming of het publiekrechtelijke lichaam.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: '4.4'
    text: |-
      Bij algemene maatregel van bestuur worden, ter verzekering van de heffing, regels gesteld met betrekking tot de
      verplichtingen waaraan de in het eerste lid bedoelde personen of lichamen moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: '4.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel4
  - number: '5.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder invoer: het vanuit een derde land brengen van
      alcoholvrije dranken in Nederland.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: '5.2'
    text: 'Als invoer wordt mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.2.a
    text: |-
      het in Nederland beëindigen van een EU-douaneregeling waaronder alcoholvrije dranken zijn geplaatst, anders dan
      door plaatsing onder een andere EU-douaneregeling;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.2.b
    text: het in Nederland onttrekken van alcoholvrije dranken aan een EU-douaneregeling;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.2.c
    text: |-
      het eigen verbruik, anders dan als grondstof, in Nederland van alcoholvrije dranken die onder een EU-douaneregeling
      zijn geplaatst of binnen een plaats voor tijdelijke opslag.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: '5.3'
    text: |-
      Als invoer wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te stellen
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.3.a
    text: |-
      brengen van alcoholvrije dranken vanuit een derde land naar een inrichting die voor dat soort goed als zodanig is
      aangewezen of naar een plaats voor tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.3.b
    text: in Nederland plaatsen onder een EU-douaneregeling van vanuit een derde land binnengebrachte alcoholvrije dranken;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.3.c
    text: |-
      brengen van alcoholvrije dranken die zijn geplaatst onder een EU-douaneregeling naar een inrichting die voor dat
      soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.3.d
    text: |-
      brengen van alcoholvrije dranken vanuit een plaats voor tijdelijke opslag naar een inrichting die voor dat soort
      goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: 5.3.e
    text: onder ambtelijk toezicht vernietigen van alcoholvrije dranken die onder een EU-douaneregeling zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: '5.4'
    text: |-
      De voorwaarden, bedoeld in het derde lid, hebben betrekking op formaliteiten waaraan bij de overbrenging van de
      alcoholvrije dranken moet worden voldaan alsmede op de daarbij te stellen zekerheid.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: '5.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel5
  - number: '6'
    text: |-
      Onder alcoholvrije dranken worden verstaan vruchten- en groentesap, mineraalwater en limonade, ook indien zij
      alcohol bevatten, voor zover zij niet worden aangemerkt als bier, wijn, tussenproducten of overige alcoholhoudende
      producten in de zin van de [Wet op de accijns][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: '7.1'
    text: |-
      Onder vruchten- en groentesap wordt verstaan drank die bestaat uit sap van vruchten of groenten of een mengsel
      daarvan.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel7
  - number: '7.2'
    text: |-
      Als vruchten- en groentesap wordt mede aangemerkt de drank, bedoeld in het eerste lid, in vaste vorm of als
      concentraat in kleinhandelsverpakking of in een verpakking die is bestemd voor afnemers die voor gebruik gereed
      vruchten- en groentesap vervaardigen voor gebruik ter plaatse.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel7
  - number: '8.1'
    text: 'Onder mineraalwater wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel8
  - number: 8.1.a
    text: natuurlijk en kunstmatig mineraalwater;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel8
  - number: 8.1.b
    text: spuitwater;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel8
  - number: 8.1.c
    text: |-
      water dat kennelijk is bestemd voor inwendig gebruik door de mens, in kleinhandelsverpakking of in een verpakking
      die is bestemd voor afnemers die daaruit water voor gebruik ter plaatse afleveren.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel8
  - number: '8.2'
    text: |-
      Als mineraalwater wordt niet aangemerkt nooddrinkwater dat door drinkwaterbedrijven in voorraad wordt gehouden en
      dat bij een verstoring van de drinkwatervoorziening anders dan door middel van een distributienet wordt geleverd
      aan consumenten of andere afnemers.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel8
  - number: '8.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aard van en de aanduiding op de
      verpakking van het in het tweede lid bedoelde nooddrinkwater.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel8
  - number: '9.1'
    text: |-
      Onder limonade worden verstaan met water aangelengd vruchten- of groentesap alsmede gezoete en aromatische dranken
      en dranken waaraan geurstoffen of smaakstoffen zijn toegevoegd die kennelijk zijn bestemd om onverwarmd te worden
      gedronken.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel9
  - number: '9.2'
    text: |-
      Als limonade wordt mede aangemerkt de drank, bedoeld in het eerste lid, in vaste vorm of als concentraat in
      kleinhandelsverpakking of in een verpakking die is bestemd voor afnemers die voor gebruik gerede limonade
      vervaardigen voor gebruik ter plaatse.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel9
  - number: '9.3'
    text: 'Als limonade wordt niet aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel9
  - number: 9.3.a
    text: |-
      de uit melk of melkproducten bereide drank met een gehalte aan melkvetten van 0,02%mas of meer waarin zich
      melkeiwit en melksuiker bevinden, niet zijnde een uit wei of weiproducten vervaardigde drank;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel9
  - number: 9.3.b
    text: |-
      de uit soja bereide drank met een vetgehalte en een eiwitgehalte die vergelijkbaar zijn met het vetgehalte en het
      eiwitgehalte van melk.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel9
  - number: '10.1'
    text: De belasting bedraagt per hectoliter € 8,83.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel10
  - number: '10.2'
    text: |-
      Voor de toepassing van het eerste lid geschiedt de herleiding van vruchtensap, groentesap en limonade in vaste
      of geconcentreerde vorm naar het volume van voor gebruik gereed vruchten- en groentesap of voor gebruik gerede
      limonade op basis van de factor 4, waarbij voor het herleiden van vruchtensap, groentesap en limonade in vaste vorm
      een gram wordt gelijkgesteld aan een milliliter.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel10
  - number: '10.3'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot alcoholvrije dranken in kleinhandelsverpakking nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel10
  - number: '14.1'
    text: Een plaats kan alleen als inrichting worden gebruikt indien daartoe een vergunning is verstrekt door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel14
  - number: '14.2'
    text: |-
      De [artikelen 40][ref1] en [41 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel41
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '41'
  - number: '15.1'
    text: Degene die een vergunning voor een inrichting wil verkrijgen, dient daartoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15
  - number: '15.2'
    text: |-
      De [artikelen 42][ref1] en [43 tot en met 50 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '43'
  - number: 15a.1
    text: |-
      Een vergunning als bedoeld in [artikel 14, eerste lid][ref1], is niet vereist indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel14
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
  - number: 15a.1.a
    text: per kalenderjaar doorgaans niet meer dan 12.000 liter vruchten- of groentesap wordt vervaardigd; en
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15a
  - number: 15a.1.b
    text: uitsluitend vruchten- of groentesap wordt vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15a
  - number: 15a.2
    text: |-
      Indien in twee achtereenvolgende kalenderjaren meer dan 12.000 liter vruchten- of groentesap per kalenderjaar is
      vervaardigd, moet een vergunning als bedoeld in [artikel 14, eerste lid][ref1], worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel14
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '14'
        hoofdstuk: III
        afdeling: '1'
  - number: 15a.3
    text: De vergunning, bedoeld in het tweede lid, wordt verleend voor een periode van ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15a
  - number: 15a.4
    text: |-
      Binnen de periode van vijf jaar, bedoeld in het derde lid, kan de vergunninghouder geen verzoek indienen om
      intrekking van de vergunning, tenzij geen vruchten- of groentesap meer wordt vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15a
  - number: 15a.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel15a
  - number: '16'
    text: 'De belasting wordt geheven:'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel16
  - number: 16.a
    text: van de vergunninghouder van de inrichting; of
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel16
  - number: 16.b
    text: |-
      van degene die ingevolge [artikel 15a][ref1] geen vergunning voor een inrichting heeft maar in een kalenderjaar
      meer dan 12.000 liter vruchten- of groentesap vervaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: 15a
        hoofdstuk: III
        afdeling: '2'
  - number: '17'
    text: |-
      In afwijking van [artikel 16][ref1] wordt de belasting bij toepassing van [artikel 4, eerste lid][ref2], geheven
      van degene die de alcoholvrije dranken voorhanden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
  - number: '18'
    text: De belasting wordt verschuldigd op het tijdstip van de uitslag.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel18
  - number: '19'
    text: |-
      In afwijking van [artikel 18][ref1] wordt de belasting bij toepassing van [artikel 4, eerste lid][ref2],
      verschuldigd op het tijdstip van de aanvang van het voorhanden hebben van de alcoholvrije dranken.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '18'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
  - number: '20.1'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel20
  - number: '20.2'
    text: Aangifte dient te worden gedaan voor elke inrichting afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel20
  - number: '20.3'
    text: |-
      In afwijking van het tweede lid kan bij ministeriële regeling, onder daarbij te stellen voorwaarden, worden
      toegestaan dat voor inrichtingen waarvan de vergunningen op naam zijn gesteld van dezelfde vergunninghouder één
      aangifte voor die inrichtingen tezamen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel20
  - number: '21.1'
    text: |-
      Bij toepassing van [artikel 19][ref1] dient in afwijking van [artikel 20, eerste lid][ref2], en van
      [artikel 10, tweede lid][ref3], en [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref4]
      uiterlijk op de dag na het in [artikel 19][ref5] bedoelde tijdstip aangifte te worden gedaan en de belasting op
      aangifte te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0005802#Artikel19
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0005802
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid kan de inspecteur, bij toepassing van [artikel 4, eerste lid, onderdeel a][ref1],
      op verzoek toestemming verlenen om de in een week op de voet van [artikel 19][ref2] verschuldigd geworden belasting
      uiterlijk op de vrijdag van de week daaropvolgend op aangifte te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel19
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: '22'
    text: |-
      De [artikelen 54][ref1] en [55 van de Wet op de accijns][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel55
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '55'
  - number: '23.1'
    text: De vergunninghouder stelt zekerheid voor de belasting die hij verschuldigd is of kan worden.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel23
  - number: '23.2'
    text: |-
      De [artikelen 56, vijfde tot en met achtste lid][ref1], en [57][ref2] tot en met
      [60 van de Wet op de accijns][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel60
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '60'
  - number: '24.1'
    text: |-
      De vergunninghouder van een inrichting heeft voor de belasting die is begrepen in de verkoopprijs van de door hem
      geleverde alcoholvrije dranken, zolang hij ter zake geen betaling heeft ontvangen doch niet langer dan een half
      jaar nadat hij die belasting verschuldigd is geworden, voorrecht op alle goederen van de koper.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel24
  - number: '24.2'
    text: |-
      Het voorrecht, bedoeld in het eerste lid, heeft gelijke rangorde als het voorrecht dat ’s Rijks schatkist heeft op
      de voet van [artikel 21 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: '25'
    text: |-
      De vervoerder van alcoholvrije dranken is hoofdelijk aansprakelijk voor het bedrag aan belasting dat wordt
      vertegenwoordigd door de hoeveelheid van die goederen waarvan de belasting niet is geheven die door hem
      wordt vervoerd naar het buitenland, naar een inrichting of naar een persoon of lichaam als bedoeld in
      [artikel 4, eerste lid][ref1], indien tijdens dat vervoer door hem of door zijn toedoen een onregelmatigheid of een
      overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel4
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '4'
        hoofdstuk: I
  - number: '26'
    text: |-
      Ter zake van de belasting bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], met uitzondering van artikel 88 van de
      Gedelegeerde Verordening Douanewetboek van de Unie, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '27.1'
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden, regels worden gesteld ingevolge welke de
      heffing van belasting van alcoholvrije dranken die in kleine zendingen dan wel door reizigers als bagage worden
      ingevoerd, geschiedt volgens daarbij vast te stellen forfaitaire tarieven.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel27
  - number: '27.2'
    text: De forfaitaire tarieven zijn niet van toepassing met betrekking tot handelsgoederen.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel27
  - number: '29.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van belasting
      verleend ter zake van de uitslag en de invoer van alcoholvrije dranken die door degene die de betreffende dranken
      betrekt, worden gebruikt als grondstof voor het vervaardigen van andere goederen dan alcoholvrije dranken.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel29
  - number: '29.2'
    text: |-
      Om de alcoholvrije dranken met vrijstelling te kunnen betrekken, dient degene die deze goederen betrekt in het
      bezit te zijn van een daartoe strekkende vergunning.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel29
  - number: '29.3'
    text: |-
      [Artikel 65, vierde tot en met zevende lid, van de Wet op de accijns][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
  - number: '29.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel29
  - number: '30.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van belasting
      verleend ter zake van de uitslag en de invoer van alcoholvrije dranken die worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel30
  - number: 30.1.a
    text: aan boord van schepen in het verkeer van Nederland naar een andere lidstaat, anders dan over de binnenwateren;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel30
  - number: 30.1.b
    text: aan boord van luchtvaartuigen in het verkeer van Nederland naar een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel30
  - number: '30.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel30
  - number: '31'
    text: |-
      De [artikelen 68][ref1] en [69 van de Wet op de accijns][ref2] en de [artikelen 21a][ref3] en
      [21b van de Wet op de omzetbelasting 1968][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel21a
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel21b
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 21a
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 21b
  - number: '32.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      belasting verleend voor alcoholvrije dranken waarvoor aanspraak op vrijstelling zou bestaan op de voet van:
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel32
  - number: 32.1.a
    text: artikel 29; of
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel32
  - number: 32.1.b
    text: artikel 30.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel32
  - number: '32.2'
    text: |-
      De in het eerste lid, onderdeel *a*, bedoelde teruggaaf wordt verleend aan degene die een vergunning heeft
      ingevolge [artikel 29, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel29
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '29'
        hoofdstuk: V
        afdeling: '1'
  - number: '32.3'
    text: De in het eerste lid, onderdeel *b*, bedoelde teruggaaf wordt verleend aan degene die de levering heeft verricht.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel32
  - number: '32.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel32
  - number: '33.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      belasting verleend voor alcoholvrije dranken die:
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel33
  - number: 33.1.a
    text: zijn verloren gegaan;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel33
  - number: 33.1.b
    text: zijn vernietigd onder ambtelijk toezicht;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel33
  - number: 33.1.c
    text: zijn gebracht naar een derde land of zijn geplaatst onder een EU-douaneregeling met als bestemming een derde land;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel33
  - number: 33.1.d
    text: zijn gebracht binnen een inrichting die voor dat soort goed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel33
  - number: 33.1.e
    text: |-
      door een ondernemer zijn overgebracht naar een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als
      ondernemer, in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel33
  - number: '33.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel33
  - number: '34.1'
    text: Teruggaaf van belasting wordt verleend tot ten hoogste het bedrag dat aan belasting is voldaan.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel34
  - number: '34.2'
    text: Op een verzoek om teruggaaf van belasting beslist de inspecteur bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel34
  - number: '36'
    text: |-
      De [artikelen 80][ref1], [83][ref2] en [84 van de Wet op de accijns][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel84
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '83'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '84'
  - number: '37'
    text: |-
      De [artikelen 2, vijfde, zesde, zevende en elfde lid][ref1], en [85 van de Wet op de accijns][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel85
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '85'
  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel38
  - number: '38.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel38
  - number: '39.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel39
  - number: 39.1.a
    text: |-
      anders dan als particulier voor eigen verbruik, alcoholvrije dranken te vervaardigen buiten een inrichting die
      voor dat soort goed als zodanig is aangewezen, tenzij deze vervaardiging plaatsvindt overeenkomstig de ingevolge
      [artikel 29][ref1] bij algemene maatregel van bestuur gestelde voorwaarden en beperkingen, dan wel alcoholvrije
      dranken worden vervaardigd uit andere alcoholvrije dranken en het bedrag van de belasting die eerstbedoelde
      alcoholvrije dranken vertegenwoordigen niet hoger is dan het bedrag van de belasting dat de alcoholvrije dranken
      vertegenwoordigen waaruit zij zijn vervaardigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel29
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '29'
        hoofdstuk: V
        afdeling: '1'
  - number: 39.1.b
    text: |-
      alcoholvrije dranken voorhanden te hebben die niet overeenkomstig de bepalingen van deze wet in de heffing zijn
      betrokken, met uitzondering van alcoholvrije dranken die door particulieren voor eigen verbruik zijn betrokken uit
      een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel39
  - number: '39.2'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing indien buiten een inrichting die voor dat soort goed als
      zodanig is aangewezen, vruchten- of groentesap wordt vervaardigd tot een hoeveelheid van 12.000 liter per
      kalenderjaar dan wel gedurende ten hoogste twee achtereenvolgende kalenderjaren een hoeveelheid van meer dan 12.000
      liter per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel39
  - number: '41'
    text: |-
      Degene die opzettelijk een in [artikel 39][ref1] opgenomen verbod overtreedt, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal
      het bedrag van de te weinig geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel39
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '39'
        hoofdstuk: VII
        afdeling: '1'
  - number: '42'
    text: |-
      Degene die opzettelijk alcoholvrije dranken waarvoor vrijstelling of teruggaaf van belasting is verleend een
      bestemming geeft waarvoor geen vrijstelling of teruggaaf van belasting zou zijn verleend, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten
      hoogste eenmaal het bedrag van de te weinig geheven belasting.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel42
  - number: '44'
    text: Deze wet treedt in werking met ingang van 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel44
  - number: '45'
    text: 'Deze wet wordt aangehaald als: Wet op de verbruiksbelasting van alcoholvrije dranken.'
    url: https://wetten.overheid.nl/BWBR0005802/2023-02-13#Artikel45
