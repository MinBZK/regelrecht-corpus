        artikel: '5'
  - number: '3'
    text: |-
      1 Aan de vrijstelling, bedoeld in [artikel 2][ref1], zijn de volgende voorwaarden verbonden:

      a. in het jaar voorafgaand aan en in het jaar dat gebruik wordt gemaakt van de vrijstelling:

      1°. bestaat minimaal 85 procent van de tot het bedrijf behorende oppervlakte landbouwgrond uit grasland;

      2°. bedraagt de kunstmestgift op het bedrijf minder dan 100 kilogram stikstof per hectare grasland;

      3°. is het stikstofoverschot op het bedrijf maximaal 125 kilogram stikstof per hectare, berekend volgens het
      principe van een stikstofbalans op bedrijfsniveau;

      4°. worden de runderen met de diernummers 100, 102 en 120, bedoeld in
      [bijlage D, tabel I, van de Uitvoeringsregeling Meststoffenwet][ref2] in de periode van 1 april tot en met 30
      november geweid gedurende minimaal 6 uur per dag en minimaal 150 dagen per jaar;

      5°. worden de runderen met het diernummer 101, bedoeld in
      [bijlage D, tabel I, van de Uitvoeringsregeling Meststoffenwet][ref3] in de periode van 1 april tot en met 30
      november geweid gedurende minimaal 6 uur per dag en minimaal 90 dagen per jaar;

      b. op het bedrijf mag geen andere dierlijke mest worden aangevoerd dan runderdrijfmest of vaste rundermest;

      c. elk jaar meldt de landbouwer uiterlijk 7 dagen voordat van de vrijstelling in dat jaar gebruik wordt gemaakt,
      het bedrijf voor de toepassing van [artikel 2][ref4] aan bij de minister waarmee de landbouwer verklaart te voldoen
      aan artikel 2 en aan de voorwaarden, bedoeld in de onderdelen a en b, en het tweede lid;

      d. de landbouwer houdt gegevens bij waarmee aannemelijk kan worden gemaakt dat aan de
      voorwaarden, bedoeld in de onderdelen a en b, en het tweede lid, is voldaan en bewaart deze
      gegevens en een afschrift van de aanmelding als onderdeel van de administratie, bedoeld in
      [artikel 32, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref5].

      2 De vrijstelling voor een bedrijf waar in ieder geval runderen met diernummer 100, bedoeld in
      [bijlage D, tabel I, van de Uitvoeringsregeling Meststoffenwet][ref6] worden gehouden, wordt verleend onder de
      voorwaarde dat in het jaar voorafgaand aan en in het jaar dat gebruik wordt gemaakt van de vrijstelling:

      a. de melkproductie van het bedrijf niet hoger dan 14.000 kilogram per hectare is, indien de op het bedrijf
      geproduceerde mest niet volledig kan worden geplaatst op het eigen bedrijf;

      b. het gemiddeld gewogen ureumgetal van de op het bedrijf tijdens de perioden van 1 januari tot en met 31 maart en
      van 1 december tot en met 31 december geproduceerde melk lager is dan 21 milligram per 100 gram melk.


