  - number: '4'
    text: |-
      De kwalificatiedossiers en de daarbij behorende kwalificaties, worden vastgesteld op de wijze bedoeld in
      [bijlage 2][ref1] behorende bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0037678
    url: https://wetten.overheid.nl/BWBR0037678/2026-01-01#Artikel4
