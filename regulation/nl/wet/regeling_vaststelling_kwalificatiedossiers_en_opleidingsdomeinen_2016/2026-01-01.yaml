  - number: '2'
    text: |-
      De volgende opleidingsdomeinen worden vastgesteld:

      a. Bouw en Infra;

      b. Afbouw, hout en onderhoud;

      c. Techniek en procesindustrie;

      d. Ambacht, laboratorium en gezondheidstechniek;

      e. Media en vormgeving;

      f. Informatie en communicatietechnologie;

      g. Mobiliteit en voertuigen;

      h. Transport, scheepvaart en logistiek;

      i. Handel en ondernemerschap;

      j. Economie en administratie;

      k. Veiligheid en sport;

      l. Uiterlijke verzorging;

      m. Horeca en bakkerij;

      n. Toerisme en recreatie;

      o. Zorg en welzijn;

      p. Voedsel, natuur en leefomgeving.
    url: https://wetten.overheid.nl/BWBR0037678/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 In [bijlage 1][ref1] behorende bij deze regeling wordt voor ieder kwalificatiedossier het volgende vastgesteld:

      a. tot welk van de opleidingsdomeinen het kwalificatiedossier behoort, met uitzondering van de kwalificatiedossiers
      Entree; en

      b. welke kwalificaties deel uitmaken van de kwalificatiedossiers.

      2 In bijlage 1 behorende bij deze regeling wordt per kwalificatie het volgende vastgesteld:

      a. de soort beroepsopleiding waarop de kwalificatie is gericht;

      b. de leerweg of leerwegen waarin die beroepsopleiding kan worden verzorgd;

      c. het niveau, bedoeld in [artikel 7.2.2, derde lid, van de wet][ref2], van die beroepsopleiding;

      c. of toepassing is gegeven aan [artikel 7.2.6, eerste lid, van de wet][ref3]; en

      d. de prijsfactor.


      [ref1]: https://wetten.overheid.nl/BWBR0037678
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.6
    url: https://wetten.overheid.nl/BWBR0037678/2026-01-01#Artikel3
