      In deze regeling wordt verstaan onder:

        - *prijsfactor:* de prijsfactor, bedoeld in [artikel 2.2.2, vijfde lid][ref1], en
      [artikel 2.2.3, vierde lid, van het Uitvoeringsbesluit WEB][ref2];
        - *wet:* [Wet educatie en beroepsonderwijs][ref3].


