        bwb_id: BWBR0044975
        artikel: '15.8'
        hoofdstuk: '15'
        paragraaf: '15.3'
  - number: '15.10'
    text: |-
      1 De woordelijke verslagen worden in ongecorrigeerde vorm openbaar gemaakt.

      2 De woordelijke verslagen, bedoeld in [artikel 15.6, eerste lid, onder a en b][ref1], worden na vaststelling
      openbaar gemaakt als de Handelingen van de Tweede Kamer der Staten-Generaal.

      3 De woordelijke verslagen, bedoeld in [artikel 15.6, eerste lid, onder c][ref2], worden na vaststelling opgenomen
      in het verslag van de commissie van het overleg of debat waarop zij betrekking hebben, en openbaar gemaakt.

      4 Indien ministers of personen die hen in een vergadering van de Kamer bijstaan een deel van de aan hen tijdens
      een vergadering gestelde vragen schriftelijk beantwoorden, worden deze antwoorden opgenomen bij de Handelingen als
      bijvoegsel bij de vergadering waarin de overige vragen mondeling werden beantwoord.

      5 De schriftelijke vragen, bedoeld in [artikel 12.1][ref3], worden met de daarop gegeven antwoorden opgenomen in
      het aanhangsel van de Handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel15.6
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel15.6
      [ref3]: https://wetten.overheid.nl/BWBR0044975#Artikel12.1
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.10
