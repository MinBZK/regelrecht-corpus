        paragraaf: '12.1'
  - number: '15.11'
    text: |-
      1 Bij afzonderlijke regeling, vast te stellen door de beide Kamers der Staten-Generaal, worden de zorg voor de
      dienst die is belast met de verslaglegging voor die Kamers, de Dienst Verslag en Redactie, de taakuitoefening van
      die dienst met betrekking tot in ieder geval de woordelijke verslagen, alsmede het openbaar maken en bewaren van de
      verslagen geregeld.

      2 De Dienst is in ieder geval belast met het maken van de woordelijke verslagen en officiële verslagen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.11
  - number: '15.12'
    text: |-
      1 Een ieder neemt de geheimhouding in acht ten aanzien van de gedachtewisseling in een vergadering met gesloten
      deuren van de Kamer.

      2 De plicht tot geheimhouding geldt in ieder geval voor hen die bij de behandeling aanwezig waren en allen die van
      het behandelde of de stukken kennis dragen.

      3 De Kamer kan de geheimhouding slechts opheffen in een vergadering met gesloten deuren.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.12
  - number: '15.13'
    text: |-
      1 Een ieder neemt de geheimhouding in acht ten aanzien van de gedachtewisseling in een besloten
      commissievergadering of een besloten deel van een commissievergadering, met uitzondering van wat de commissie
      vermeldt in openbaar gemaakte verslagen of notulen.

      2 De plicht tot geheimhouding geldt in ieder geval voor hen die bij de behandeling aanwezig waren en allen die van
      het behandelde of de stukken kennis dragen.

      3 De commissie kan de geheimhouding slechts opheffen in een besloten commissievergadering of een besloten deel van
      een commissievergadering. Indien de betrokken commissie niet langer bestaat of onduidelijk is welke commissie over
      het opheffen van de geheimhouding kan beslissen, beslist de Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.13
  - number: '15.14'
    text: |-
      1 De Kamer kan, op voorstel van het Presidium, besluiten om een lid dat de geheimhouding, bedoeld in de
      [artikelen 15.12][ref1] en [15.13][ref2], niet in acht neemt, uit te sluiten van:

      a. alle vergaderingen van één of meer commissies, voor ten hoogste één maand; en

      b. de kennisneming van vertrouwelijke stukken, voor ten hoogste de verdere duur van de zitting.

      2 Het Presidium doet slechts een voorstel als bedoeld in het eerste lid, nadat het betrokken lid in de gelegenheid
      is gesteld te worden gehoord.

      3 De Kamer stemt over het voorstel bij aanvang van de eerste vergadering na de dag waarop het Presidium tot het
      doen van het voorstel heeft besloten. Er wordt niet over het voorstel beraadslaagd.

      4 De Voorzitter deelt het besluit van de Kamer meteen mee aan het betrokken lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel15.12
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel15.13
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.14
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '15.12'
        hoofdstuk: '15'
        paragraaf: '15.4'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '15.13'
        hoofdstuk: '15'
        paragraaf: '15.4'
  - number: '15.15'
    text: |-
      1 Alle tussen de regering en de Kamer gewisselde stukken worden meteen openbaar gemaakt, tenzij dit niet mogelijk
      is of een stuk vertrouwelijk is.

      2 De betrokken stukken worden ook op andere wijze verspreid, zodra de Kamer dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.15
  - number: '15.16'
    text: |-
      1 Een ieder neemt de vertrouwelijkheid in acht ten aanzien van de inhoud van een vertrouwelijk stuk.

      2 Indien een lid de vertrouwelijkheid niet in acht neemt, is [artikel 15.14][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel15.14
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.16
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '15.14'
        hoofdstuk: '15'
        paragraaf: '15.4'
  - number: '15.17'
    text: De griffie houdt een register bij van de door de Kamer en de commissies ontvangen vertrouwelijke stukken.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.17
  - number: '15.18'
    text: |-
      1 Bij afzonderlijke regeling, vast te stellen door de Kamer, worden nadere regels gesteld over de aanwijzing, het
      bewaren en de behandeling van vertrouwelijke stukken.

      2 De regeling bevat in ieder geval regels voor het registreren, ter inzage leggen, inzien, verspreiden en
      vermenigvuldigen van de vertrouwelijke stukken.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.18
  - number: '15.19'
    text: |-
      1 De griffie houdt een register bij van:

      a. de nevenactiviteiten van de leden;

      b. de uit de nevenactiviteiten te verwachten of genoten inkomsten; en

      c. andere redelijkerwijs relevante belangen van leden.

      2 De leden vermelden de in het eerste lid bedoelde informatie steeds in het register:

      a. binnen een week nadat ze als lid tot de Kamer zijn toegelaten;

      b. binnen een week na het aanvaarden van een nevenactiviteit of het ontstaan van een relevant belang; en

      c. opnieuw op uiterlijk 1 mei na ieder kalenderjaar, voor zover het inkomsten betreft die zijn genoten in dat
      kalenderjaar.

      3 Onder inkomsten als bedoeld in dit artikel wordt verstaan het loon, bedoeld in
      [artikel 9 van de Wet op de loonbelasting 1964][ref1], verminderd met de eindheffingsbestanddelen,
      bedoeld in [artikel 31 van die wet][ref2], en de winst uit onderneming, bedoeld in
      [afdeling 3.2 van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Afdeling3.2
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.19
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0011353
        afdeling: '3.2'
  - number: '15.20'
    text: |-
      1 De griffie houdt een register bij van de door leden ondernomen buitenlandse reizen waarvan de vervoerskosten
      en verblijfskosten geheel of gedeeltelijk worden betaald door anderen dan het lid, zijn fractie, de Kamer of een
      commissie van de Kamer.

      2 De leden vermelden de buitenlandse reizen steeds binnen een week na terugkeer in Nederland in het register.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.20
  - number: '15.21'
    text: |-
      1 De griffie houdt een register bij van de door leden ontvangen geschenken en voordelen met een hogere waarde dan
      50 euro.

      2 De leden vermelden de geschenken en voordelen steeds binnen een week na ontvangst daarvan in het register.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.21
  - number: '15.22'
    text: |-
      De griffie houdt een register bij van de door de ministers tijdens openbare vergaderingen van de Kamer en de
      commissies gedane mondelinge toezeggingen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.22
  - number: '15.23'
    text: |-
      1 De registers, genoemd in deze paragraaf, liggen voor een ieder ter inzage.

      2 De Griffier draagt zorg dat een actueel overzicht van de opgaven in de registers wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.23
  - number: '15.24'
    text: |-
      De Kamer stelt een afzonderlijke gedragscode voor de leden vast, alsmede een afzonderlijke regeling voor het
      toezicht op, en de handhaving van, die gedragscode.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.24
  - number: '16.1'
    text: |-
      1 Ieder lid kan, alleen of met andere leden, een voorstel tot wijziging van dit Reglement indienen.

      2 Het Presidium of een commissie kan ook een voorstel tot wijziging van het Reglement indienen als dit het gevoelen
      van een meerderheid van het aantal leden waaruit zij bestaat weergeeft. Het voorstel wordt ondertekend door de
      leden van het Presidium of de commissie die het zullen verdedigen.

      3 Op een voorstel tot wijziging zijn de voor initiatiefwetsvoorstellen geldende artikelen van overeenkomstige
      toepassing.

      4 Het voorbereidend onderzoek van een voorstel tot wijziging wordt verricht door de commissie voor de Werkwijze,
      tenzij de Kamer besluit een andere commissie hiermee te belasten. Indien het voorstel is ingediend door de
      commissie voor de Werkwijze, wordt in ieder geval een andere commissie met het voorbereidend onderzoek belast.

      5 Een door de Kamer aangenomen voorstel tot wijziging treedt onmiddellijk in werking, tenzij de Kamer anders
      besluit.

      6 Indien een aangenomen voorstel tot wijziging in de loop van de beraadslaging of als gevolg van de stemmingen is
      gewijzigd, wordt de aangenomen tekst van het voorstel openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel16.1
  - number: '16.2'
    text: |-
      [Artikel 16.1][ref1] is van overeenkomstige toepassing op voorstellen tot vaststelling of wijziging van de overige
      op grond van dit Reglement door de Kamer vast te stellen regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel16.1
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel16.2
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '16.1'
        hoofdstuk: '16'
  - number: '16.3'
    text: |-
      De Kamer kan besluiten van dit Reglement af te wijken, tenzij:

      a. een lid zich daartegen verzet; of

      b. de afwijking in strijd is met de wet.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel16.3
  - number: '16.4'
    text: |-
      1 Het [Reglement van Orde van de Tweede Kamer][ref1], zoals dit luidde onmiddellijk voorafgaand aan het in
      [artikel 16.5][ref2] bedoelde tijdstip, wordt ingetrokken.

      2 De [Regeling tijdelijke beperking of ontzegging toegang][ref3], zoals deze luidde onmiddellijk voorafgaand aan
      het in [artikel 16.5][ref4] bedoelde tijdstip, wordt ingetrokken.

      3 De op grond van het [Reglement van Orde van de Tweede Kamer][ref5], zoals dit luidde onmiddellijk voorafgaand
      aan het in [artikel 16.5][ref6] bedoelde tijdstip, ingestelde organen en geldende besluiten en overige regelingen,
      berusten met ingang van dat tijdstip op dit Reglement.

      4 De onmiddellijk voorafgaand aan het tijdstip, bedoeld in [artikel 16.5][ref7], aangehouden moties en toegekende
      debatten, gelden als aangehouden onderscheidenlijk toegekend vanaf dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006023
