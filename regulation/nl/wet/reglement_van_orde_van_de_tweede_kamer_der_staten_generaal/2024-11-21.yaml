  - number: '2.1'
    text: |-
      1 De Kamer beslist met inachtneming van de bij de wet gestelde regels of een nieuwbenoemd lid als lid van de Kamer
      wordt toegelaten.

      2 De commissie, genoemd in [artikel 7.6][ref1], is ten behoeve van de beslissing van de Kamer belast met het
      onderzoek van de geloofsbrief van elk nieuwbenoemd lid.

      3 De geloofsbrief en de stukken die een nieuwbenoemd lid op grond van de wet dient over te leggen aan de Kamer,
      worden bij de griffie ter inzage gelegd van de leden.

      4 De Kamer beslist, voor zover mogelijk, in oude samenstelling over de toelating van leden die meteen na
      verkiezingen voor de Kamer zijn benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.6
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel2.1
    references:
