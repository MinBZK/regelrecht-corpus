  - number: '3.5'
    text: |-
      1 De Kamer benoemt na elke voorzittersbenoeming een door haar te bepalen aantal Ondervoorzitters, en stelt daarbij
      hun onderlinge rangorde vast.

      2 Bij het tussentijds openvallen van een positie, benoemt de Kamer een nieuwe Ondervoorzitter. Deze neemt in de
      rangorde de plaats in van de te vervangen Ondervoorzitter.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel3.5
  - number: '3.6'
    text: |-
      1 De Voorzitter en de Ondervoorzitters vormen samen het Presidium.

      2 De Voorzitter benoemt voor ieder ander lid van het Presidium een plaatsvervanger, die dit lid kan vervangen
      indien het niet beschikbaar is. De Kamer kan besluiten de benoeming van een plaatsvervanger aan zich te houden.

      3 Het Presidium kan slechts besluiten nemen, indien meer dan de helft van zijn leden of hun plaatsvervangers
      aanwezig is. Bij het staken van de stemmen beslist de Voorzitter.

      4 De Voorzitter kan andere leden uitnodigen aan de vergaderingen van het Presidium deel te nemen. Deze leden nemen
      niet deel aan de stemmingen.

      5 Indien het Presidium voor onderdelen van zijn werkzaamheden commissies van advies als bedoeld in
      [artikel 7.9][ref1] heeft ingesteld, hoort hij deze voordat hij besluiten neemt ten aanzien van die onderdelen,
      tenzij dit in een zeer spoedeisend geval niet mogelijk is.

      6 Het Presidium wordt bijgestaan door de Griffier en de directeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.9
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel3.6
    references:
