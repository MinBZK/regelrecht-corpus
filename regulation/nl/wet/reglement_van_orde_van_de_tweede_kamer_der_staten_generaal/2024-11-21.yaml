        paragraaf: '3.1'
  - number: '3.2'
    text: |-
      De Voorzitter is belast met:

      a. het leiden van de werkzaamheden van de Kamer en het Presidium;

      b. het doen naleven van dit Reglement;

      c. het uitvoeren van door de Kamer genomen besluiten;

      d. het vertegenwoordigen van de Kamer, met uitzondering van de vertegenwoordiging in rechte, bedoeld in
      [artikel 6.2, tweede lid, onder e][ref1];

      e. het namens de Kamer beslissen op een bezwaar tegen een besluit als bedoeld in
      [artikel 6.2, tweede lid, onder c][ref2], dat is genomen zonder toepassing van ondermandaat;

      f. de overige taken die op grond van dit Reglement of de wet aan hem zijn toegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel6.2
