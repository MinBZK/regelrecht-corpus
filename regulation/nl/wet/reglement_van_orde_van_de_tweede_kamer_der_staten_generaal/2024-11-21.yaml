  - number: '7.11'
    text: |-
      1 De Voorzitter bepaalt uit hoeveel leden een commissie bestaat. De Kamer kan anders besluiten.

      2 De Voorzitter benoemt in overleg met de fracties en groepen de leden, en voor zover hij dit wenselijk acht,
      plaatsvervangende leden.

      3 De Voorzitter kan een lid of plaatsvervangend lid op diens verzoek ontheffen van het lidmaatschap van een
      commissie.

      4 De Voorzitter voorziet bij het openvallen van de positie van een lid of plaatsvervangend lid van een commissie in
      overleg met de betrokken fracties en groepen in de vervulling van die positie.

      5 De leden en de plaatsvervangende leden van commissies worden bij de aanvang van elke zitting opnieuw benoemd.
      Totdat deze benoemingen zijn geschied blijven de in de vorige zitting bestaande commissies voortbestaan in hun
      oude samenstelling.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.11
  - number: '7.12'
    text: |-
      1 Een nieuw ingestelde commissie benoemt in haar eerste vergadering uit haar midden een commissievoorzitter en een
      commissieondervoorzitter. De eerste vergadering vindt plaats onder leiding van de Voorzitter.

      2 Bij het openvallen van de positie van haar commissievoorzitter of commissieondervoorzitter, voorziet de commissie
      in de vervulling van die positie in een daartoe bijeengeroepen vergadering.

      3 Na de benoemingen van haar leden bij de aanvang van een zitting, voorziet de commissie opnieuw in het
      commissievoorzitterschap en -ondervoorzitterschap in een daartoe bijeengeroepen vergadering.

      4 Elke benoeming van een commissievoorzitter of commissieondervoorzitter wordt meegedeeld aan de Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.12
  - number: '7.13'
    text: |-
      1 Een commissievoorzitter is belast met de volgende taken:

      a. het leiden van de werkzaamheden van een commissie;

      b. het doen naleven van dit Reglement;

      c. het uitvoeren van door de commissie genomen besluiten;

      d. het vertegenwoordigen van de commissie;

      e. het verantwoording dragen voor het opstellen van een plan ter versterking van de kennis- en informatiepositie
      van de commissie en voor het evalueren van de uitvoering daarvan;

      f. de overige taken die op grond van dit Reglement of de wet aan hem zijn toegedeeld.

      2 In het plan, bedoeld in het eerste lid, onderdeel e, wordt in ieder geval vastgelegd op welke wijze de commissie
      controle uitoefent op de door haar ontvangen jaarverslagen voor de verantwoording van de rijksuitgaven, met
      inbegrip van de benoeming van rapporteurs als bedoeld in [artikel 7.36][ref1].

      3 Een commissievoorzitter heeft tijdens een commissievergadering dezelfde bevoegdheden als de Voorzitter tijdens
      een vergadering van de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.36
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '7.36'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: '7.14'
    text: |-
      1 Indien de commissievoorzitter niet beschikbaar is, wordt het commissievoorzitterschap waargenomen door:

      a. de commissieondervoorzitter;

      b. als die niet beschikbaar is: het lid van de commissie dat het langst in de Kamer zitting heeft, waarbij bij
      gelijke zittingsduur het oudste lid in leeftijd voorgaat, of een door de commissie aan te wijzen ander lid van
      de commissie.

      2 Een waarnemend commissievoorzitter heeft de taken en bevoegdheden van de commissievoorzitter die vereist zijn
      voor de waarneming.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.14
  - number: '7.15'
    text: |-
      1 Elke commissie wordt bijgestaan door een door de Griffier aangewezen plaatsvervangende griffier, de
      commissiegriffier.

      2 Daarnaast wordt elke commissie bijgestaan door een of meer andere ambtenaren van de Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.15
  - number: '7.16'
    text: |-
      1 Een commissie komt op de door haar te bepalen tijdstippen bijeen in een vergadering. Indien de commissie geen
      tijdstippen heeft bepaald, dan bepaalt haar commissievoorzitter deze.

      2 De commissievoorzitter roept de commissie in ieder geval binnen een redelijke termijn bijeen in een vergadering,
      indien de regering of een vierde van haar leden dit onder opgave van redenen verzoekt.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.16
  - number: '7.17'
    text: |-
      1 Een commissie komt regelmatig bijeen in een procedurevergadering om te besluiten over de wijze van behandeling
      van de door haar ontvangen stukken en over haar overige werkzaamheden.

      2 Tijdens de vergadering stelt de commissievoorzitter de aanwezige leden van de Kamer in de gelegenheid voorstellen
      te doen ten aanzien van de regeling van de werkzaamheden van de commissie. De leden melden hun voorstellen vooraf
      aan de commissievoorzitter.

      3 De in de vergadering genomen besluiten worden openbaar gemaakt, tenzij zij zijn genomen in een besloten deel van
      de vergadering en de openbaarmaking ongewenst is.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.17
  - number: '7.18'
    text: |-
      1 De leden en de plaatsvervangende leden van een commissie kunnen alle vergaderingen van hun commissie bijwonen.

      2 De Voorzitter kan de vergaderingen van elke commissie bijwonen.

      3 De overige leden van de Kamer kunnen elk wetgevingsoverleg en notaoverleg bijwonen. Een commissie kan deze leden
      ook toestaan andere van haar vergaderingen bij te wonen.

      4 De leden van de Kamer die een vergadering van een commissie bijwonen, hebben het recht om deel te nemen aan de
      beraadslaging.

      5 Indien een commissievoorzitter onder overeenkomstige toepassing van [artikel 8.18][ref1] een lid uitsluit van het
      verdere bijwonen van een commissievergadering, dan geldt deze uitsluiting tevens voor de overige vergaderingen van
      de betrokken commissie op de dag van de uitsluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.18
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.18'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '7.19'
    text: |-
      1 De vergaderingen van de commissies zijn openbaar.

      2 De Kamer kan besluiten dat vergaderingen van een bepaalde commissie besloten mogen zijn.

      3 Een commissie kan op voorstel van een van haar leden of van een minister besluiten dat een vergadering, of een
      gedeelte daarvan, besloten zal zijn.

      4 Indien een voorstel als bedoeld in het derde lid wordt gedaan tijdens een openbare vergadering, wordt erover
      beraadslaagd en beslist in een besloten gedeelte van de vergadering.

      5 Een besloten commissievergadering kan slechts plaatsvinden in de gebouwen van de Kamer. De leden die deelnemen
      aan de vergadering moeten in de vergaderzaal aanwezig zijn. De Voorzitter kan toestaan dat in bijzondere
      omstandigheden wordt afgeweken van dit lid.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.19
  - number: '7.20'
    text: |-
      1 Slechts de leden van een commissie nemen deel aan haar besluitvorming. Indien een lid niet beschikbaar is, kan
      een plaatsvervangend lid van zijn fractie of groep zijn bevoegdheden uitoefenen. Een plaatsvervangend lid kan de
      bevoegdheden voor ten hoogste één lid van de commissie uitoefenen.

      2 Een commissie kan buiten haar vergaderingen langs schriftelijke weg besluiten over een voorstel dat naar het
      oordeel van haar commissievoorzitter eenvoudig en spoedeisend van aard is. Het besluit wordt genomen als ware de
      Kamer in voltallige samenstelling bijeen en stemde zij als bedoeld in [artikel 8.25][ref1]. In afwijking van het
      eerste lid wordt in de vaste commissies en de commissie voor de Rijksuitgaven daarbij ook steeds ten minste één
      lid van elke fractie of groep zonder lid in de commissie, in de gelegenheid gesteld aan de besluitvorming deel te
      nemen. De Kamer kan besluiten dat de vorige zin ook op andere commissies van toepassing is.

      3 Indien een commissie een keuze dient te maken voor een of meer personen, besluit zij daarover in een vergadering
      onder overeenkomstige toepassing van de [artikelen 8.31 tot en met 8.38][ref2], met dien verstande dat bij een
      derde stemming de keuze gaat tussen de twee personen die bij de tweede stemming de meeste stemmen kregen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.25
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.31
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.25'
        hoofdstuk: '8'
        paragraaf: '8.3'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.31'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '7.21'
    text: |-
      1 Door de Kamer ontvangen stukken worden doorgeleid naar de meest betrokken commissie.

      2 De commissie beslist over de behandeling van de stukken. Indien een stuk in handen wordt gesteld van de
      commissie, neemt de commissie dit in ieder geval in behandeling.

      3 Het Presidium stelt regels voor de afhandeling van door de Kamer ontvangen stukken zonder afzender.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.21
  - number: '7.22'
    text: |-
      1 Een commissie brengt aan de Kamer verslag uit over een door haar ontvangen stuk, indien dit Reglement dat vereist
      of de commissie dit om een andere reden wenselijk acht.

      2 Het verslag bevat zo beknopt mogelijk datgene wat de commissie over het stuk wil opmerken of vragen.

      3 De Kamer kan besluiten dat een commissie geen door het Reglement vereist verslag hoeft uit te brengen over
      stukken die naar het oordeel van de commissie niet in het openbaar kunnen worden behandeld.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.22
  - number: '7.23'
    text: |-
      1 Een commissie brengt aan de Kamer verslag uit over elk door haar gehouden openbaar mondeling en schriftelijk
      overleg met een minister.

      2 Een commissie kan ook verslag uitbrengen over andere van haar activiteiten.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.23
  - number: '7.24'
    text: |-
      1 Een commissiegriffier is verantwoordelijk voor het opstellen van de verslagen van zijn commissie.

      2 Een verslag wordt vastgesteld door ondertekening door de commissievoorzitter en commissiegriffier.

      3 Een verslag wordt na de vaststelling meteen openbaar gemaakt.

      4 De commissie kan besluiten dat bijlagen bij een verslag slechts ter inzage worden gelegd. Bijlagen van
      vertrouwelijke aard worden in ieder geval niet openbaar gemaakt en slechts ter vertrouwelijke inzage van de leden
      gelegd.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.24
  - number: '7.25'
    text: |-
      Voor een goede vervulling van haar taken is een commissie in ieder geval bevoegd:

      a. zich tot een minister te wenden om de stukken te verkrijgen waarvan zij de kennisneming nodig acht;

      b. mondeling in overleg te treden met een minister;

      c. schriftelijk in overleg te treden met een minister;

      d. rondetafelgesprekken te houden;

      e. hoorzittingen te houden;

      f. technische briefings te houden;

      g. werkbezoeken af te leggen;

      h. zich te laten voorlichten door colleges van advies;

      i. externe deskundigen in te schakelen;

      j. rapporteurs te benoemen;

      k. de Kamer voor te stellen een groot project aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.25
  - number: '7.26'
    text: |-
      Het mondeling overleg van een commissie met een minister kan plaatshebben in de vorm van:

      a. een commissiedebat, indien het overleg betrekking heeft op een onderwerp in het beleidsterrein van de commissie;

      b. een wetgevingsoverleg, indien het overleg betrekking heeft op een in handen van de commissie gesteld
      wetsvoorstel;

      c. een notaoverleg, indien het overleg betrekking heeft op een in handen van de commissie gestelde initiatiefnota
      of een ander stuk waarover de commissie dit overleg wenst te houden.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.26
  - number: '7.27'
    text: |-
      1 Een commissie beslist over de datum en het tijdstip van een door haar te houden commissiedebat.

      2 De Kamer beslist op voorstel van de Voorzitter over de datum en het tijdstip van een wetgevingsoverleg en
      notaoverleg.

      3 Er vindt steeds hooguit één wetgevingsoverleg of notaoverleg gelijktijdig plaats met een vergadering van de
      Kamer. Op overige tijdstippen vinden steeds hooguit twee wetgevingsoverleggen of notaoverleggen gelijktijdig
      plaats.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.27
  - number: '7.28'
    text: |-
      1 Een commissie kan bij een commissiedebat en notaoverleg besluiten tot het laten gelden van maximumspreektijden.

      2 Bij een wetgevingsoverleg gelden geen maximumspreektijden. Een commissie kan wel besluiten dat de leden die aan
      het wetgevingsoverleg willen deelnemen de door hen gewenste spreektijd voorafgaand opgeven.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.28
  - number: '7.29'
    text: |-
      In een commissiedebat, wetgevingsoverleg en notaoverleg kunnen met instemming van de verantwoordelijke minister
      inlichtingen worden verschaft door daartoe door de minister aangewezen rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.29
  - number: '7.30'
    text: |-
      1 Tijdens een wetgevingsoverleg en notaoverleg kunnen de leden moties indienen. De [artikelen 8.20][ref1] en
      [8.21][ref2] zijn van overeenkomstige toepassing op de moties.

      2 Tijdens een commissiedebat kunnen geen moties worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.20
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.21
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.30
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.20'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.21'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '7.31'
    text: |-
      1 De Kamer beraadslaagt slechts over een verslag van een commissiedebat of schriftelijk overleg, indien een lid dat
      heeft deelgenomen aan het debat of overleg een motie over het daarin besproken onderwerp wenst in te dienen. Bij
      een commissiedebat kan een lid dit slechts aankondigen na de eerste beantwoording door de minister in het debat.

      2 Er kan slechts aan de beraadslaging worden deelgenomen door leden van de fracties of groepen die aan het
      commissiedebat of schriftelijk overleg hebben deelgenomen, tenzij de Kamer anders besluit.

      3 In afwijking van [artikel 8.12, eerste lid][ref1], voert ieder lid slechts eenmaal het woord.

      4 In afwijking van [artikel 8.13, eerste lid][ref2], bedraagt de maximumspreektijd per fractie twee minuten en per
      groep anderhalve minuut, met inbegrip van de benodigde tijd voor de indiening van moties.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.12
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.13
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.31
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.12'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.13'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '7.32'
    text: |-
      Indien een commissie besluit een rondetafelgesprek te houden, wisselt zij daarin met genodigden van gedachten over
      een vooraf door haar vast te stellen onderwerp.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.32
  - number: '7.33'
    text: |-
      1 Indien een commissie besluit een hoorzitting te houden, bevraagt zij daarin genodigden over een vooraf door haar
      vast te stellen onderwerp.

      2 De commissie kan voorafgaand in een procedurevergadering besluiten dat tijdens de hoorzitting de door een lid
      gestelde vragen, met inbegrip van vervolgvragen, steeds meteen kunnen worden beantwoord door de genodigde aan wie
      zij zijn gericht.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.33
  - number: '7.34'
    text: |-
      1 Indien een commissie rijksambtenaren wil uitnodigen voor een rondetafelgesprek, hoorzitting of technische
      briefing, dan doet zij dit door tussenkomst van de voor hen verantwoordelijke minister.

      2 De inspecteur-generaal van een rijksinspectie wordt in ieder geval uitgenodigd voor een rondetafelgesprek,
      hoorzitting of technische briefing, indien ten minste vijftig leden schriftelijk aan een commissie te kennen geven
      dit te wensen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.34
  - number: '7.35'
    text: |-
      1 Ieder lid van de Kamer kan aan een commissie een schriftelijk voorstel richten om:

      a. de Afdeling advisering van de Raad van State te verzoeken de Kamer voorlichting te geven over een aangelegenheid
      van wetgeving of bestuur; of

      b. een adviescollege als bedoeld in de [Kaderwet adviescolleges][ref1] te verzoeken de Kamer te adviseren.

      2 De commissie zendt het voorstel met haar advies aan het Presidium. Het Presidium legt het voorstel met het advies
      van de commissie en, voor zover het dit wenselijk acht, zijn eigen advies voor aan de Kamer.

      3 De Kamer besluit over het voorstel.

      4 Indien de Kamer een motie aanneemt die strekt tot een verzoek als bedoeld in het eerste lid, dan zijn het tweede
      en derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0008159
  - number: '7.36'
    text: |-
      1 Een commissie kan een of meer leden benoemen tot rapporteur over:

      a. een door haar ontvangen stuk;

      b. een groot project als bedoeld in [artikel 7.37][ref1] waarmee zij is belast; of

      c. een ander onderwerp dat haar aangaat.

      2 De commissie legt de aan het rapporteurschap verbonden taken, bevoegdheden en verantwoordelijkheden zo spoedig
      mogelijk schriftelijk vast, en kan tevens de duur van het rapporteurschap vastleggen.

      3 Het Presidium bericht de Kamer jaarlijks over de in dat jaar lopende en afgeronde rapporteurschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.37
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.36
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '7.37'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: '7.37'
    text: |-
      1 Ieder lid van de Kamer kan een commissie verzoeken de Kamer voor te stellen een bepaald project aan te wijzen als
      groot project dat onder bijzondere parlementaire controle staat.

      2 Bij afzonderlijke regeling, vast te stellen door de Kamer, worden nadere regels gesteld over grote projecten.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.37
  - number: '8.1'
    text: |-
      1 De Voorzitter roept de Kamer bijeen zo vaak als hij dit nodig acht.

      2 De Voorzitter roept de vergadering in ieder geval binnen een redelijke termijn bijeen als dit door ten minste
      dertig leden of door de regering schriftelijk wordt verzocht onder opgave van redenen.

      3 De Kamer kan ook zelf besluiten op welke dag en welk uur zij weer bijeenkomt. Bij onvoorziene omstandigheden kan
      de Voorzitter de Kamer toch op een ander tijdstip bijeenroepen.

      4 Het Presidium kan algemene richtlijnen vaststellen voor de dagen en uren waarop de Kamer doorgaans bijeenkomt en
      voor de perioden waarin de Kamer met reces is. De Voorzitter houdt daarmee zoveel mogelijk rekening.

      5 De leden worden voor elke vergadering tijdig bijeengeroepen. De te behandelen onderwerpen worden daarbij vermeld.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.1
  - number: '8.2'
    text: |-
      Voor het tijdstip van bijeenroeping meldt ieder aanwezig lid zijn aanwezigheid, zodat een presentielijst kan worden
      opgesteld. Leden die later aankomen melden hun aanwezigheid bij aankomst.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.2
  - number: '8.3'
    text: |-
      1 De Voorzitter opent de vergadering, indien op het tijdstip van bijeenroeping uit de presentielijst blijkt dat
      meer dan de helft van het aantal zitting hebbende leden hun aanwezigheid hebben gemeld.

      2 Indien het vereiste aantal leden zijn aanwezigheid niet heeft gemeld, opent de Voorzitter een bijeenkomst waarin
      hij de namen van de afwezige leden kan laten oplezen en kennis kan geven van ingekomen stukken. Daarna stelt hij de
      vergadering uit tot een later tijdstip.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.3
  - number: '8.4'
    text: |-
      De Voorzitter schorst of sluit de vergadering, indien hij dit met het oog op het verloop van de werkzaamheden of
      voor het handhaven van de orde wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.4
  - number: '8.5'
    text: |-
      1 Ieder lid heeft een voor hem bestemde zitplaats in de vergaderzaal van de Kamer. Het Presidium wijst deze
      zitplaatsen aan. Het Presidium kan ook aan een fractie of groep een bepaalde groep zitplaatsen aanwijzen en de
      verdeling daarvan aan de fractie of groep overlaten.

      2 Het Presidium zorgt dat er tevens zitplaatsen beschikbaar zijn voor:

      a. de ministers;

      b. personen die de ministers hebben aangewezen om zich in de vergadering te doen bijstaan;

      c. de gevolmachtigde ministers;

      d. bijzondere gedelegeerden.

      3 Het Presidium kan zitplaatsen toekennen aan andere personen die door de Kamer zijn uitgenodigd.

      4 Indien aan een vergadering wordt deelgenomen door bijzondere gedelegeerden of door de Kamer uitgenodigde leden
      van het Europees Parlement, dan wijst de Voorzitter hun zitplaatsen aan.

      5 Indien op uitnodiging van de Kamer het staatshoofd of de regeringsleider van een ander land een vergadering
      bijwoont om de Kamer toe te spreken, dan wijst de Voorzitter zijn zitplaats aan.

      6 Indien de Voorzitter het verzoekt, neemt iedereen zijn zitplaats in.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.5
  - number: '8.6'
    text: Ieder lid spreekt staande van de spreekplaats in de vergaderzaal, tenzij de Voorzitter anders toestaat.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.6
  - number: '8.7'
    text: |-
      1 Gedurende elke vergadering ligt in de vergaderzaal op de tafel van de Griffier een lijst waarin alle sinds de
      vorige vergadering ingekomen stukken worden opgenomen.

      2 In de lijst doet de Voorzitter mededelingen of voorstellen over de wijze van behandeling van de ingekomen
      stukken. Een voorstel is na het sluiten van de vergadering aangenomen, tenzij daartegen door een lid bezwaar is
      gemaakt. In dat geval beslist de Kamer over het voorstel.

      3 De Voorzitter kan besluiten ongetekende, onbegrijpelijke of beledigende stukken niet op te nemen in de lijst.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.7
  - number: '8.8'
    text: |-
      1 De Kamer regelt haar werkzaamheden op voorstel van de Voorzitter of een lid.

      2 De regeling van werkzaamheden vindt in het algemeen eenmaal in de week plaats op een door de Voorzitter te
      bepalen vast tijdstip. De Voorzitter kan in bijzondere gevallen besluiten ook op andere tijdstippen een regeling
      van werkzaamheden te laten plaatsvinden.

      3 De leden melden hun voorstellen vooraf aan de Voorzitter.

      4 Alle voorstellen worden vooraf openbaar gemaakt, tenzij daarvoor door spoed geen gelegenheid is.

      5 Een lid dat bij de regeling van werkzaamheden een brief van de regering wil vragen, moet daarvoor vooraf
      toestemming van de Voorzitter verkrijgen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.8
  - number: '8.9'
    text: |-
      1 In de vergadering voert een ieder slechts het woord na het aan de Voorzitter gevraagd en van hem verkregen te
      hebben.

      2 De Voorzitter verleent het woord in de volgorde waarin het is gevraagd, tenzij de Kamer anders besluit.

      3 De leden kunnen voorafgaand aan de beraadslaging over een onderwerp het woord vragen door zich te laten
      inschrijven op een daartoe bestemde sprekerslijst. De inschrijving is mogelijk zodra de Voorzitter heeft meegedeeld
      of de Kamer heeft besloten het onderwerp aan de orde te gaan stellen.

      4 Indien bijzondere gedelegeerden of in Nederland gekozen leden van het Europees Parlement aan een vergadering
      deelnemen, dan beslist de Voorzitter over de volgorde waarin aan hen het woord wordt verleend.

      5 Indien ministers, personen die zij hebben aangewezen om zich in de vergadering te doen bijstaan, de
      gevolmachtigde ministers of andere personen die zijn uitgenodigd om een vergadering bij te wonen het woord
      verlangen, dan verleent de Voorzitter dit slechts nadat de spreker die aan het woord is, zijn rede heeft beëindigd.

      6 Indien op uitnodiging van de Kamer het staatshoofd of de regeringsleider van een ander land een vergadering
      bijwoont om de Kamer toe te spreken, dan beslist de Voorzitter wanneer hem daartoe het woord wordt verleend.

      7 Indien de Voorzitter het woord wil voeren over een onderwerp op een andere wijze dan nodig is voor de uitvoering
      van zijn voorzitterstaak, dan verlaat hij de voor hem bestemde zitplaats. Hij neemt die niet meer in zolang het
      onderwerp aan de orde is.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.9
  - number: '8.10'
    text: |-
      1 De volgorde van de sprekers kan worden verbroken, indien een lid het woord vraagt over een persoonlijk feit of
      de orde.

      2 De Voorzitter verleent het woord slechts voor een persoonlijk feit nadat het lid dat daarvoor het woord heeft
      gevraagd een voorlopige aanduiding van dat feit heeft gegeven. De beslissing of iets een persoonlijk feit vormt,
      berust bij de Voorzitter.

      3 Een voorstel van orde kan door de Voorzitter of een lid worden gedaan.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.10
  - number: '8.11'
    text: De Voorzitter kan interrupties toelaten. Deze moeten bestaan uit korte opmerkingen of vragen, zonder inleiding.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.11
  - number: '8.12'
    text: |-
      1 Tijdens de beraadslaging voeren de leden in ten hoogste twee termijnen het woord over hetzelfde onderwerp. De
      Kamer kan toestemming geven hiervan af te wijken.

      2 Indien een lid in een vergadering niet in de eerste termijn over een onderwerp het woord heeft gevoerd, kan
      hij daarna slechts in die vergadering aan de beraadslaging over het onderwerp deelnemen als de Kamer daarvoor
      toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.12
  - number: '8.13'
    text: |-
      1 De Kamer kan voor de beraadslaging over een onderwerp maximumspreektijden vaststellen per fractie en groep met
      inachtneming van de omvang van de fracties en groepen, voor de ministers en voor overige deelnemers.

      2 Indien de Kamer maximumspreektijden vaststelt, kan zij tevens bepalen dat in afwijking van
      [artikel 8.12, eerste lid][ref1], slechts in één termijn het woord wordt gevoerd.

      3 Zodra een door de Kamer vastgestelde of door dit Reglement voorgeschreven maximumspreektijd is verstreken,
      verzoekt de Voorzitter de spreker op te houden met spreken. Deze geeft meteen aan dit verzoek gevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.12
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.12'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '8.14'
    text: |-
      Ieder lid gedraagt zich in de vergadering op een wijze die getuigt van onderling respect, en die geen afbreuk doet
      aan de waardigheid van de Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.14
  - number: '8.15'
    text: |-
      1 Iedere spreker blijft bij het onderwerp waarover wordt beraadslaagd.

      2 Indien een spreker afwijkt van het onderwerp, roept de Voorzitter hem tot de behandeling van het onderwerp terug.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.15
  - number: '8.16'
    text: |-
      1 Tijdens de vergadering onthoudt een ieder zich van:

      a. het gebruik van beledigende uitdrukkingen;

      b. het verstoren van de orde;

      c. het niet in acht nemen van de geheimhouding ten aanzien van de gedachtewisseling in een besloten vergadering;

      d. het niet in acht nemen van de vertrouwelijkheid ten aanzien van de inhoud van een vertrouwelijk stuk;

      e. het instemming betuigen met of aansporen tot onwettige handelingen; en

      f. het bedreigen van een persoon.

      2 Indien een spreker hieraan niet voldoet, waarschuwt de Voorzitter hem en stelt hem in de gelegenheid de woorden
      terug te nemen die tot de waarschuwing aanleiding hebben gegeven, of terug te komen van het gedrag dat tot de
      waarschuwing aanleiding gaf.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.16
  - number: '8.17'
    text: |-
      1 De Voorzitter kan een spreker het woord ontnemen, indien deze spreker:

      a. nadat hij is teruggeroepen tot de behandeling als bedoeld in [artikel 8.15][ref1], voortgaat van het onderwerp
      af te wijken; of

      b. nadat hij is gewaarschuwd als bedoeld in [artikel 8.16, tweede lid][ref2], geen gebruik maakt van de gelegenheid
      woorden terug te nemen of van gedrag terug te komen, of voortgaat beledigende uitdrukkingen te gebruiken, de orde
      te verstoren, de geheimhouding of vertrouwelijkheid niet in acht te nemen, instemming te betuigen met of aan te
      sporen tot onwettige handelingen, of een persoon te bedreigen.

      2 Een lid dat het woord is ontnomen, mag in de betrokken vergadering niet meer aan de beraadslaging over het in
      behandeling zijnde onderwerp deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.15
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.16
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.15'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.16'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '8.18'
    text: |-
      De Voorzitter kan een spreker op wie [artikel 8.17][ref1] is toegepast en ieder ander lid dat zich gedraagt als
      bedoeld in dat artikel, uitsluiten van het verdere bijwonen van de vergadering op de dag waarop de uitsluiting
      plaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.17
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.18
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.17'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '8.19'
    text: |-
      Er kan geen beroep op de Kamer worden gedaan ten aanzien van de beslissingen van de Voorzitter op grond van de
      [artikelen 8.15 tot en met 8.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.15
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.15'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '8.20'
    text: |-
      1 Ieder lid dat het woord voert, kan daarbij, alleen of met andere leden, over het in behandeling zijnde onderwerp
      moties indienen. Het lid leest de tekst van zijn moties voor.

      2 De moties moeten kort en duidelijk zijn geformuleerd, op schrift zijn gebracht en zijn ondertekend.

      3 Een lid kan gedurende zijn eerste termijn geen moties indienen, tenzij:

      a. de Kamer daarvoor toestemming geeft; of

      b. wordt beraadslaagd over een verslag van een commissiedebat of schriftelijk overleg.

      4 De beraadslaging over moties vindt plaats bij de beraadslaging over het onderwerp waarover de motie is ingediend,
      tenzij de Kamer anders besluit.

      5 De eerste ondertekenaar kan de motie wijzigen of intrekken totdat erover is gestemd.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.20
  - number: '8.21'
    text: |-
      1 De Voorzitter deelt tijdens de beraadslaging mee dat een motie die is gericht aan de regering is overgenomen,
      indien:

      a. de minister te kennen geeft zich met de inhoud van de voorgestelde motie te kunnen verenigen; en

      b. de Voorzitter zich ervan heeft overtuigd dat geen van de in de vergaderzaal aanwezige leden zich tegen het
      overnemen van de motie verzet.

      2 Een overgenomen motie maakt na de mededeling geen afzonderlijk onderwerp van de beraadslaging meer uit.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.21
  - number: '8.22'
    text: |-
      1 De Voorzitter sluit de beraadslaging over een onderwerp, wanneer niemand meer het woord verlangt.

      2 De Voorzitter of een in de vergaderzaal aanwezig lid kan de Kamer voorstellen de beraadslaging van de zijde van
      de Kamer eerder te sluiten, als hij van oordeel is dat het onderwerp waarover wordt beraadslaagd van verschillende
      zijden voldoende is belicht. Het voorstel kan beknopt worden toegelicht.

      3 De Voorzitter of een ander in de vergaderzaal aanwezig lid kan ook voorstellen de beraadslaging van de zijde van
      de Kamer op een bepaald tijdstip te sluiten. Het voorstel kan beknopt worden toegelicht. Indien het voorstel wordt
      aangenomen, kan de Voorzitter besluiten de nog beschikbare tijd naar billijkheid te verdelen onder de sprekers.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.22
  - number: '8.23'
    text: |-
      1 Nadat de beraadslaging over een onderwerp is gesloten, gaat de Kamer zo nodig over tot het nemen van een besluit.

      2 De stemming over een motie kan worden aangehouden. De aangehouden motie vervalt, indien er nog niet over is
      gestemd in de eerste vergadering twaalf weken na het besluit tot aanhouden. De Kamer kan anders besluiten. Bij het
      eindigen van een zitting vervallen alle aangehouden moties.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.23
  - number: '8.24'
    text: Stemmingen vinden in het algemeen plaats op vaste tijdstippen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.24
  - number: '8.25'
    text: |-
      De stemming over een zaak vindt plaats door handopsteken, tenzij op grond van [artikel 8.26, eerste lid][ref1], een
      hoofdelijke stemming is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.26
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.26'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '8.26'
    text: |-
      1 Er vindt een hoofdelijke stemming over een zaak plaats, indien:

      a. een lid daar om vraagt; of

      b. naar het oordeel van een lid de stemverhouding bij een stemming bij handopsteken niet duidelijk is.

      2 Er kan niet tot een hoofdelijke stemming als bedoeld in het eerste lid, onder b, worden overgegaan, wanneer de
      uitslag van de stemming bij handopsteken al is vastgesteld.

      3 Bij de hoofdelijke stemming worden de leden hoofdelijk opgeroepen te stemmen. Ieder lid brengt hierbij mondeling
      zijn stem uit met de woorden «voor» of «tegen». Voor de stemming wordt door het lot beslist, bij welk lid op de
      presentielijst de oproeping begint.

      4 Indien bij de hoofdelijke stemming blijkt dat geen meerderheid van het aantal zitting hebbende leden meer
      aanwezig is, zal de Voorzitter:

      a. de vergadering voor enige tijd schorsen en haar voortzetten, indien bij de heropening weer voldoende leden
      aanwezig blijken te zijn; of

      b. de vergadering sluiten en op een later tijdstip een nieuwe vergadering bijeenroepen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.26
  - number: '8.27'
    text: |-
      1 Indien een lid zich tijdens het stemmen bij handopsteken vergist, kan hij zijn vergissing slechts herstellen
      voordat de Voorzitter de uitslag heeft vastgesteld.

      2 Indien een lid zich tijdens een hoofdelijke stemming bij het uitbrengen van zijn stem vergist, kan hij zijn
      vergissing slechts herstellen voordat het volgende lid heeft gestemd.

      3 Als een lid zijn vergissing niet tijdig heeft hersteld, kan hij na afloop van de stemming vragen om aantekening
      dat hij zich heeft vergist. Dit brengt geen verandering in de uitslag van de stemming.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.27
  - number: '8.28'
    text: |-
      1 Bij het staken van de stemmen is een voorstel niet aangenomen, indien de vergadering voltallig is.

      2 Indien de vergadering niet voltallig is, wordt de stemming uitgesteld tot een volgende vergadering. Als de
      stemmen opnieuw staken, is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.28
  - number: '8.29'
    text: |-
      1 De Voorzitter kan toestaan dat onmiddellijk voorafgaand aan een stemming door de leden stemverklaringen worden
      afgelegd. Na de stemming kan een lid in ieder geval een stemverklaring afleggen.

      2 Een stemverklaring mag niet langer duren dan één minuut, en dient te zijn beperkt tot een korte uitleg over de
      stem.

      3 Na een stemverklaring kan de beraadslaging niet worden heropend.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.29
  - number: '8.30'
    text: |-
      1 Een stemming over een zaak kan achterwege blijven, indien geen lid daarom vraagt. De Voorzitter stelt daarbij
      voor het besluit zonder stemming te nemen.

      2 In de vergaderzaal aanwezige leden kunnen aantekening vragen dat zij geacht willen worden te hebben tegengestemd.
      In dat geval wordt het besluit geacht genomen te zijn met de stemmen van de overige leden.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.30
  - number: '8.31'
    text: |-
      1 De stemming over personen voor benoemingen, voordrachten of keuzen vindt plaats met behulp van stembriefjes, die
      de leden in een stembus werpen.

      2 De leden vullen voor iedere kandidaat voor de benoeming, voordracht of keuze, afzonderlijk een stembriefje in.
      Het stembriefje moet een duidelijke aanwijzing bevatten van de persoon waarop het lid wil stemmen. In geval van
      twijfel, beslist de Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.31
  - number: '8.32'
    text: |-
      1 De stemmingen over de kandidaten vinden plaats in een aantal stemrondes. De eerste stemming is vrij.

      2 Indien niemand bij de eerste stemming de meerderheid van stemmen verkrijgt, dan vindt een tweede stemming plaats.
      Deze stemming is eveneens vrij.

      3 Indien ook bij de tweede stemming niemand de meerderheid van stemmen verkrijgt, dan vindt een derde stemming
      plaats. Daarbij wordt gekozen uit de vier personen, die bij de tweede stemming de meeste stemmen op zich hebben
      verenigd. Als bij de tweede stemming slechts op drie of vier personen stemmen zijn uitgebracht, dan wordt gekozen
      uit de twee personen, op wie het hoogste aantal stemmen is uitgebracht.

      4 Indien ook bij de derde stemming niemand de meerderheid van stemmen verkrijgt, dan vindt een vierde stemming
      plaats. Daarbij wordt gekozen uit de twee personen, die bij de derde stemming de meeste stemmen op zich hebben
      verenigd.

      5 Indien bij een tweede of derde stemming niet is uitgemaakt tussen wie ook bij een volgende stemming moet worden
      beslist, dan vindt er een tussenstemming plaats om daarover te beslissen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.32
  - number: '8.33'
    text: |-
      1 Indien bij een tussenstemming als bedoeld in [artikel 8.32, vijfde lid][ref1], of bij een stemming tussen twee
      personen de stemmen staken, dan beslist het lot.

      2 Er worden naambriefjes voor de betrokken personen gemaakt om de beslissing tot stand te brengen. De naambriefjes
      worden vervolgens door een stemopnemer als bedoeld in [artikel 8.35][ref2] behoorlijk toegevouwen in de stembus
      geworpen, en er door een andere stemopnemer een voor een uitgetrokken en voorgelezen. De persoon die wordt vermeld
      op het naambriefje dat het eerste uit de stembus is getrokken, is de gekozene.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.32
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.35
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.33
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.32'
        hoofdstuk: '8'
        paragraaf: '8.3'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.35'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '8.34'
    text: |-
      1 Niet of niet behoorlijk ingevulde stembriefjes tellen voor het bepalen van de meerderheid niet mee.

      2 Indien op verzoek van de Kamer ten behoeve van de stemming door een commissie personen zijn voorgedragen voor
      de benoeming, voordracht of keuze, dan tellen stembriefjes die een persoon aanwijzen die niet door de commissie is
      voorgedragen evenmin mee.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.34
  - number: '8.35'
    text: |-
      1 De Voorzitter benoemt voor de stemming vier leden tot stemopnemers, die gezamenlijk steeds de geldigheid van de
      stembriefjes controleren, en bepalen hoeveel stemmen op iedere persoon zijn uitgebracht.

      2 Wanneer de stemopnemers bij een stemming klaar zijn met hun taak, maakt de eerstbenoemde stemopnemer het
      getal van de in de stembus aangetroffen stembriefjes bekend, en de Voorzitter het getal van de leden op de
      presentielijst. De eerstbenoemde stemopnemer maakt vervolgens de uitslag bekend.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.35
  - number: '8.36'
    text: |-
      1 Een stemming is nietig, indien:

      a. het getal van de in de bus gevonden stembriefjes groter is dan dat van de leden op de presentielijst en dit
      verschil van invloed heeft kunnen zijn op de uitslag; of

      b. het getal van de behoorlijk ingevulde stembriefjes niet meer bedraagt dan de helft van het aantal zitting
      hebbende leden.

      2 Na een nietige stemming vindt de stemming opnieuw plaats. Indien de stemming nietig is omdat het getal
      van de in de stembus gevonden stembriefjes niet meer bedraagt dan de helft van het aantal zitting hebbende
      leden, dan wordt de vergadering tussentijds geschorst of uitgesteld onder overeenkomstige toepassing van
      [artikel 8.26, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.26
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.26'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '8.37'
    text: |-
      Een stemming over een persoon kan achterwege blijven, indien geen van de leden daarom vraagt en het gaat over:

      a. de benoeming van de Griffier; of

      b. de benoeming of voordracht van een of meer personen voor een positie in een ander overheidsorgaan, een
      aanbeveling is gedaan voor de benoeming of voordracht, en de betrokken commissie aan de Voorzitter heeft meegedeeld
      dat zij geen reden ziet om van die aanbeveling af te wijken.

      De Voorzitter stelt voor het besluit zonder stemming te nemen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.37
  - number: '8.38'
    text: |-
      Bij benoemingen, voordrachten of keuzen, die niet in de [Grondwet][ref1] zijn vermeld, kan de Kamer in een
      bijzonder geval andere regels doen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.38
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '8.39'
    text: |-
      De Voorzitter draagt zorg dat de voordrachten van personen van wie de benoeming geschiedt bij koninklijk besluit
      aan de Koning worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel8.39
  - number: '9.1'
    text: |-
      1 De Voorzitter stelt elk wetsvoorstel in handen van een vaste commissie voor een voorbereidend onderzoek.

      2 Het besluit tot inhandenstelling wordt zo spoedig mogelijk meegedeeld in een vergadering van de Kamer. Bij die
      mededeling kan de Kamer anders besluiten over de inhandenstelling.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.1
  - number: '9.2'
    text: |-
      1 Een commissie brengt over elk in haar handen gesteld wetsvoorstel verslag uit aan de Kamer.

      2 Ieder lid van de Kamer kan bij de commissie schriftelijke opmerkingen inbrengen voor het verslag. De commissie is
      bevoegd weg te laten wat zij niet ter zake acht.

      3 De commissie stelt binnen twee weken na de inhandenstelling, met uitzondering van recesperioden, een termijn vast
      voor de inbreng. Van de gestelde termijn wordt mededeling gedaan aan de leden van de Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.2
  - number: '9.3'
    text: |-
      1 Het Presidium kan een commissie een termijn stellen voor het uitbrengen van haar verslag over een wetsvoorstel.

      2 Indien het verslag niet binnen de gestelde tijd gereed kan zijn, vraagt de commissie om verlenging van de
      termijn. Het Presidium beslist over de verlenging. Deze beslissing wordt zo spoedig mogelijk schriftelijk ter
      kennis gebracht van de leden van de Kamer en meegedeeld in een vergadering van de Kamer.

      3 Indien het Presidium een beslissing tot verlenging niet unaniem heeft genomen, wordt dat gemeld bij de
      mededeling, bedoeld in het tweede lid. De Kamer kan bij die mededeling anders besluiten. Een voorstel daartoe kan
      door ieder lid worden gedaan.

      4 Een verlengde termijn kan slechts nader worden verlengd door de Kamer. Tijdens een reces kan het Presidium tot
      nadere verlenging van de termijn besluiten.

      5 Indien een commissie niet binnen een gestelde termijn verslag uitbrengt, kan de Kamer de beraadslaging openen
      zonder dat een verslag is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.3
  - number: '9.4'
    text: |-
      1 Een commissie vermeldt in haar verslag over een wetsvoorstel of zij de behandeling door de Kamer, al dan niet
      onder voorbehoud, voldoende voorbereid acht.

      2 Indien het verslag opmerkingen of vragen bevat, wordt de regering in de gelegenheid gesteld te reageren in een
      nota naar aanleiding van het verslag.

      3 Na ontvangst van een nota naar aanleiding van het verslag kan de commissie besluiten nader verslag uit te
      brengen. De [artikelen 9.2 tot en met 9.4][ref1] zijn van toepassing op een nader verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel9.2
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '9.2'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '9.5'
    text: |-
      1 Ieder lid kan, alleen of met andere leden, amendementen indienen vanaf het tijdstip dat een wetsvoorstel in
      handen van een commissie is gesteld.

      2 De amendementen moeten zijn voorzien van een beknopte toelichting, en door de indieners zijn ondertekend.

      3 De amendementen worden bij de indiening meteen openbaar gemaakt. Indien een amendement op de dag van de
      beraadslaging of stemming over het wetsvoorstel wordt ingediend, wordt het tevens in de vergaderzaal rondgedeeld.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.5
  - number: '9.6'
    text: |-
      1 Een amendement wordt geacht toelaatbaar te zijn, zolang de Kamer het niet ontoelaatbaar heeft verklaard.

      2 De Voorzitter of een lid kan de Kamer voorstellen een amendement ontoelaatbaar te verklaren, indien:

      a. de strekking van het amendement tegengesteld is aan het wetsvoorstel; of

      b. er tussen de inhoud van het amendement en die van het wetsvoorstel geen rechtstreeks verband bestaat.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.6
  - number: '9.7'
    text: |-
      1 De eerste ondertekenaar van een amendement kan zijn amendement wijzigen.

      2 De eerste ondertekenaar kan het amendement intrekken tijdens een wetgevingsoverleg en de beraadslaging van de
      Kamer. Indien de beraadslaging is gesloten, is voor de intrekking toestemming nodig van de Kamer.

      3 Indien de eerste ondertekenaar geen lid meer is, kan een door zijn fractie of groep aangewezen lid het amendement
      wijzigen of intrekken. Indien de fractie of groep geen deel meer uitmaakt van de Kamer, kan de eerstvolgende
      ondertekenaar het amendement wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.7
  - number: '9.8'
    text: |-
      1 De Voorzitter deelt tijdens de beraadslaging over een wetsvoorstel mee dat een amendement is overgenomen, indien:

      a. de minister te kennen geeft zich met de inhoud van een ingediend amendement te kunnen verenigen; en

      b. de Voorzitter zich ervan heeft overtuigd dat geen van de in de vergaderzaal aanwezige leden zich tegen het
      overnemen van het amendement verzet.

      2 Een overgenomen amendement is vanaf de mededeling onderdeel van het wetsvoorstel en maakt geen afzonderlijk
      onderwerp van de beraadslaging meer uit.

      3 Dit artikel is van overeenkomstige toepassing op het overnemen van een amendement tijdens een wetgevingsoverleg.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.8
  - number: '9.9'
    text: |-
      1 Ieder lid kan, alleen of met andere leden, subamendementen indienen tot wijziging van door andere leden
      ingediende amendementen.

      2 De regels die voor amendementen gelden, zijn van overeenkomstige toepassing op subamendementen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.9
  - number: '9.10'
    text: |-
      1 De algemene beraadslaging over een wetsvoorstel vindt plaats in twee termijnen.

      2 De Kamer kan besluiten het wetsvoorstel na de algemene beraadslaging artikelsgewijs te behandelen. Daarbij
      behandelt de Kamer de artikelen en de daarop voorgestelde amendementen in hun volgorde, en ten slotte de
      beweegreden van het wetsvoorstel. De Kamer kan, de commissie gehoord, tevens besluiten dat de artikelsgewijze
      behandeling in een wetgevingsoverleg plaatsvindt.

      3 Indien over een wetsvoorstel een wetgevingsoverleg is gehouden, vindt verder geen beraadslaging plaats, tenzij de
      Kamer anders besluit.

      4 De Kamer kan tot een andere wijze van behandelen besluiten.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.10
  - number: '9.11'
    text: |-
      1 De Kamer volgt bij het stemmen de artikelvolgorde van het wetsvoorstel, met dien verstande dat:

      a. subamendementen in stemming komen voor het amendement dat zij wijzigen;

      b. amendementen in stemming komen voor de artikelen die zij wijzigen;

      c. de afzonderlijke artikelen in hun volgorde in stemming komen;

      d. de beweegreden onmiddellijk voorafgaand aan de eindstemming in stemming komt; en

      e. de eindstemming over het wetsvoorstel in zijn geheel altijd aan het slot plaatsvindt.

      2 De amendementen komen in hun geheel in stemming bij het eerste artikel dat zij wijzigen, tenzij de Kamer anders
      besluit.

      3 De amendementen op eenzelfde gedeelte van het wetsvoorstel komen steeds in stemming in volgorde van meest naar
      minst verstrekkend ten opzichte van het wetsvoorstel. Bij geschil over de verstrekkendheid van een amendement
      beslist de Kamer.

      4 Er wordt slechts afzonderlijk gestemd over artikelen of de beweegreden, of over onderdelen daarvan of over
      onderdelen van amendementen, indien de Kamer daartoe op verzoek van een lid besluit.

      5 De Kamer kan besluiten dat:

      a. amendementen als vervallen moeten worden beschouwd door het aanbrengen van andere wijzigingen in het
      wetsvoorstel;

      b. in het wetsvoorstel technische wijzigingen worden aangebracht die nodig zijn geworden door het aannemen van twee
      of meer amendementen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.11
  - number: '9.12'
    text: |-
      1 Indien een wetsvoorstel in de loop van de beraadslaging of als gevolg van de stemmingen is gewijzigd, dan kan de
      Kamer besluiten de eindstemming voor een tweede lezing uit te stellen tot een volgende vergadering.

      2 Tot de eindstemming kunnen door de regering en door de betrokken commissie wijzigingen worden voorgesteld
      die nodig zijn geworden door voor of bij de stemmingen aangebrachte wijzigingen, of die kennelijke vergissingen
      herstellen.

      3 Indien wijzigingen worden voorgesteld, vindt de stemming daarover en de eindstemming over het wetsvoorstel
      zo spoedig mogelijk plaats, tenzij de voorgestelde wijzigingen de Kamer aanleiding geven tot heropening van de
      beraadslaging.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.12
  - number: '9.13'
    text: |-
      1 De Voorzitter brengt in een door de Kamer aangenomen wetsvoorstel verandering aan in de nummering of lettering
      van hoofdstukken, paragrafen, artikelen, artikelleden of artikelonderdelen, en in de op die tekstdelen gerichte
      verwijzingen, voor zover hij dit nodig acht door wijzigingen die in het wetsvoorstel zijn aangebracht.

      2 De Kamer kan besluiten de in het eerste lid bedoelde veranderingen geheel of gedeeltelijk achterwege te laten.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.13
  - number: '9.14'
    text: |-
      De Voorzitter zendt een door de Kamer aangenomen wetsvoorstel aan de Voorzitter van de Eerste Kamer met het
      volgende formulier: «De Tweede Kamer der Staten-Generaal zendt bijgaand door haar aangenomen wetsvoorstel aan de
      Eerste Kamer».
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.14
  - number: '9.15'
    text: |-
      De Voorzitter zendt een door de Kamer verworpen wetsvoorstel, door of vanwege de Koning ingediend, terug naar
      de Koning met het volgende formulier: «De Tweede Kamer der Staten-Generaal heeft het hierbij wederom gaande
      wetsvoorstel verworpen».
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.15
  - number: '9.16'
    text: Bij de behandeling van rijkswetsvoorstellen gelden de volgende bijzondere regels.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.16
  - number: '9.17'
    text: Het voorbereidend onderzoek van een rijkswetsvoorstel geschiedt langs schriftelijke weg.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.17
  - number: '9.18'
    text: |-
      De Voorzitter of een lid kan de Kamer voorstellen een termijn vast te stellen waarbinnen de Staten van Aruba,
      Curaçao of Sint Maarten bevoegd zijn schriftelijk verslag uit te brengen over een rijkswetsvoorstel.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.18
  - number: '9.19'
    text: |-
      Een schriftelijk verslag van de Staten van Aruba, Curaçao of Sint Maarten over een rijkswetsvoorstel wordt na
      ontvangst zo spoedig mogelijk openbaar gemaakt, en toegezonden aan de leden en de regering.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.19
  - number: '9.20'
    text: |-
      1 De Voorzitter geeft de minister-president kennis van het aannemen van een rijkswetsvoorstel, indien voor de
      eindstemming:

      a. een gevolmachtigde minister of een daartoe aangewezen bijzondere gedelegeerde een verklaring als bedoeld in
      [artikel 18, eerste lid, van het Statuut voor het Koninkrijk][ref1] heeft afgelegd tegen het rijkswetsvoorstel; en

      b. de Kamer het rijkswetsvoorstel daarna heeft aangenomen met een meerderheid van minder dan drie vijfden van het
      aantal uitgebrachte stemmen.

      2 De Voorzitter zendt het rijkswetsvoorstel slechts aan de Eerste Kamer, indien de minister-president hem meedeelt
      dat het voorstel wordt gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel18
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.20
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '18'
  - number: '9.21'
    text: |-
      1 Ieder lid kan, alleen of met andere leden, als initiatiefnemer een initiatiefwetsvoorstel bij de Kamer aanhangig
      maken door dit schriftelijk en ondertekend aan de Voorzitter te zenden.

      2 Indien het initiatiefwetsvoorstel een rijkswetsvoorstel betreft, zendt de Voorzitter dit meteen na ontvangst aan
      de Staten van Aruba, Curaçao en Sint Maarten.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een voorstel van een gevolmachtigde minister als
      bedoeld in [artikel 15, derde lid, van het Statuut voor het Koninkrijk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel15
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.21
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '15'
  - number: '9.22'
    text: |-
      1 De Kamer hoort de Afdeling advisering van de Raad van State voordat zij een initiatiefwetsvoorstel in behandeling
      neemt.

      2 De Kamer kan de Afdeling advisering nogmaals horen nadat het initiatiefwetsvoorstel in behandeling is genomen.
      Een lid kan daartoe, zo nodig met doorbreking van de orde, een voorstel doen tot aan de eindstemming over het
      wetsvoorstel.

      3 De initiatiefnemers zijn verantwoordelijk voor een schriftelijke reactie op de door de Afdeling advisering
      uitgebrachte adviezen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.22
  - number: '9.23'
    text: |-
      1 Een initiatiefwetsvoorstel wordt pas in handen van een commissie gesteld nadat het advies van de Afdeling
      advisering, bedoeld in [artikel 9.22, eerste lid][ref1], met de schriftelijke reactie van de initiatiefnemers is
      openbaar gemaakt.

      2 Het initiatiefwetsvoorstel wordt op dezelfde wijze behandeld als door of vanwege de Koning ingediende
      wetsvoorstellen, met dien verstande dat:

      a. overal waar sprake is van het optreden van een minister, de initiatiefnemers in zijn plaats optreden; en

      b. de initiatiefnemers niet aan het onderzoek van het voorstel deelnemen.

      3 De initiatiefnemers kunnen zich in de vergadering van de commissies en van de Kamer doen bijstaan door ten
      hoogste vier door hen daartoe aangewezen personen.

      4 Indien ministers bij de behandeling het woord verlangen, krijgen zij dit na de initiatiefnemers, tenzij de Kamer
      anders besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel9.22
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '9.22'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '9.24'
    text: |-
      1 De eerste ondertekenaar van een initiatiefwetsvoorstel deelt elke wijziging in de samenstelling van de
      initiatiefnemers die zich tijdens de behandeling door de Kamer voordoet, schriftelijk mee aan de Voorzitter.

      2 Indien de eerste ondertekenaar geen lid meer is, kan een door zijn fractie of groep aangewezen lid dat
      initiatiefnemer wordt of de eerstvolgende ondertekenaar die nog lid is, de schriftelijke mededeling doen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.24
  - number: '9.25'
    text: |-
      1 De Voorzitter deelt jaarlijks na de verzending van het ontwerp voor de raming in een vergadering aan de Kamer mee
      bij welke aanhangige initiatiefwetsvoorstellen geen van de initiatiefnemers meer lid is.

      2 Indien er in de eerste vergadering zes weken na de mededeling geen nieuwe initiatiefnemers zijn voor een
      initiatiefwetsvoorstel, stelt de Voorzitter aan de Kamer voor dit wetsvoorstel als vervallen te beschouwen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.25
  - number: '9.26'
    text: |-
      1 Indien een initiatiefwetsvoorstel wordt aangenomen door de Kamer, dan wordt de initiatiefnemers opgedragen het
      wetsvoorstel in de Eerste Kamer te verdedigen. De Kamer kan anders besluiten.

      2 De Kamer kan gedurende de behandeling in de Eerste Kamer besluiten de verdediging van het wetsvoorstel aan andere
      leden op te dragen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.26
  - number: '9.27'
    text: |-
      De Voorzitter zendt een door de Kamer aangenomen initiatiefwetsvoorstel aan de Voorzitter van de Eerste Kamer met
      het volgende formulier: «De Tweede Kamer der Staten-Generaal zendt bijgaand door haar aangenomen wetsvoorstel aan
      de Eerste Kamer. Zij heeft ..... opgedragen het voorstel in die Kamer te verdedigen».
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.27
  - number: '9.28'
    text: |-
      De stemmingen over begrotingswetsvoorstellen en bij die wetsvoorstellen ingediende amendementen vinden steeds in
      samenhang plaats, bij voorkeur in één week.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.28
  - number: '9.29'
    text: |-
      1 De Kamer besluit met bekwame spoed over een wetsvoorstel tot verandering in de [Grondwet][ref1] dat aanhangig is
      gemaakt voor de overweging in tweede lezing, bedoeld in [artikel 137, vierde lid, van de Grondwet][ref2].

      2 Indien de Kamer niet over het wetsvoorstel heeft besloten in de eerste zitting nadat zij is ontbonden als bedoeld
      in [artikel 137, derde lid, van de Grondwet][ref3], stelt de Voorzitter bij aanvang van de daaropvolgende zitting
      aan de Kamer voor het wetsvoorstel als vervallen te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel137
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.29
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
