        artikel: '137'
      - id: ref3
        bwb_id: BWBR0001840
        artikel: '137'
  - number: '9.30'
    text: |-
      1 De fracties en groepen van de leden die in de Eerste Kamer een initiatiefwetsvoorstel hebben verdedigd dat is
      bekendgemaakt als wet houdende verklaring dat er grond bestaat een voorstel in overweging te nemen tot verandering
      in de [Grondwet][ref1], dragen zorg dat zo spoedig mogelijk na die bekendmaking een wetsvoorstel tot verandering in
      de Grondwet aanhangig wordt gemaakt.

      2 Indien het betrokken wetsvoorstel niet op grond van het eerste lid aanhangig wordt gemaakt, maakt de Voorzitter
      het uiterlijk op de laatste dag van de zitting waarin de bekendmaking plaatsvond ambtshalve aanhangig.

      3 Het wetsvoorstel kan pas na aanvang van de eerstvolgende zitting in handen van een commissie worden gesteld.

      4 [Artikel 9.25][ref2] is niet van toepassing op het wetsvoorstel. Indien geen van de initiatiefnemers en hun
      fracties of groepen meer deel uitmaken van de Kamer, kan de Kamer besluiten of andere leden initiatiefnemer van het
      wetsvoorstel worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel9.25
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel9.30
    references:
