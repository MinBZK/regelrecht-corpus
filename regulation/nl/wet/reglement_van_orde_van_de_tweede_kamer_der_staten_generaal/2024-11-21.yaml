  - number: '10.1'
    text: |-
      1 Zodra een verdrag ter stilzwijgende goedkeuring wordt overgelegd aan de Kamer, wordt op de begeleidende brief
      aangetekend:

      a. de dag van ontvangst; en

      b. de dag waarop de wens dat het verdrag aan de uitdrukkelijke goedkeuring van de Staten-Generaal zal worden
      onderworpen uiterlijk te kennen kan worden gegeven.

      De begeleidende brief met de aantekening wordt verspreid onder de leden.

      2 Als eerste dag van de termijn voor het te kennen geven van de wens, geldt de dag na die van ontvangst van het
      verdrag.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.1
  - number: '10.2'
    text: |-
      1 De Voorzitter of een lid kan in een vergadering aan de Kamer voorstellen de wens tot uitdrukkelijke goedkeuring
      van een verdrag te kennen te geven.

      2 Indien de Kamer instemt met het voorstel, deelt de Voorzitter dit meteen mee aan de Minister van Buitenlandse
      Zaken, en vervolgens aan de Voorzitter van de Eerste Kamer.

      3 Indien de Kamer niet met het voorstel instemt, maar ten minste dertig leden zich voor het voorstel verklaren, dan
      vindt [artikel 10.4][ref1] toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel10.4
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '10.4'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '10.3'
    text: |-
      1 De Voorzitter kan namens de Kamer de wens tot uitdrukkelijke goedkeuring van een verdrag te kennen geven. Hij
      raadpleegt zo mogelijk vooraf de betrokken commissies.

      2 De Voorzitter geeft de wens te kennen aan de Minister van Buitenlandse Zaken, en deelt dit vervolgens meteen mee
      aan de Kamer en de Voorzitter van de Eerste Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.3
  - number: '10.4'
    text: |-
      1 Indien dertig of meer leden de wens tot uitdrukkelijke goedkeuring van een verdrag te kennen willen geven, dan
      delen zij dit schriftelijk mee aan de Voorzitter.

      2 De Voorzitter deelt het te kennen geven van de wens meteen mee aan de Minister van Buitenlandse Zaken, en
      vervolgens aan de Kamer en de Voorzitter van de Eerste Kamer.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.4
  - number: '10.5'
    text: |-
      1 Indien het verdrag dat is overgelegd Aruba, Curaçao of Sint Maarten raakt, dan worden de desbetreffende
      gevolmachtigde ministers:

      a. in de gelegenheid gesteld de mondelinge behandeling van een voorstel als bedoeld in
      [artikel 10.2, eerste lid][ref1], bij te wonen en daarbij zodanige voorlichting aan de Kamer te verstrekken als zij
      gewenst oordelen; en

      b. tevens steeds in kennis gesteld van het te kennen geven van de wens van uitdrukkelijke goedkeuring door of
      namens de Kamer of door ten minste dertig leden.

      2 Indien een gevolmachtigde minister door tussenkomst van de Voorzitter de wens tot uitdrukkelijke goedkeuring
      van een verdrag te kennen geeft, dan deelt de Voorzitter dit meteen mee aan de Minister van Buitenlandse Zaken, en
      vervolgens aan de Kamer en de Voorzitter van de Eerste Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '10.2'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '10.6'
    text: |-
      De [artikelen 10.1 tot en met 10.5][ref1] zijn van overeenkomstige toepassing, indien de regering aan de Kamer
      mededeling doet van het voornemen tot:

      a. sluiting van een verdrag uitsluitend betreffende de uitvoering van een goedgekeurd verdrag;

      b. verlenging van een aflopend verdrag; of

      c. opzegging van een verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel10.1
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '10.1'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: '10.7'
    text: |-
      1 Indien op grond van de wet aan de Kamer een (ontwerp)besluit wordt overgelegd en de wens te kennen kan worden
      gegeven dat het onderwerp of de inwerkingtreding van het (ontwerp)besluit bij wet wordt geregeld, dan wordt op de
      begeleidende brief aangetekend:

      a. de dag van ontvangst; en

      b. de dag waarop de wens uiterlijk te kennen kan worden gegeven.

      De begeleidende brief met de aantekening wordt verspreid onder de leden.

      2 Als eerste dag van de wettelijke termijn voor het te kennen geven van de wens, geldt de dag na die van ontvangst
      van het ontwerpbesluit.

      3 Dit artikel vindt overeenkomstige toepassing in andere gevallen waarin naar aanleiding van een door de Kamer
      ontvangen brief een in de wet omschreven wens te kennen kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.7
  - number: '10.8'
    text: |-
      Voor zover de wet hierin voorziet, kan de wens aan de betrokken minister te kennen worden gegeven:

      a. door de Kamer, onder overeenkomstige toepassing van [artikel 10.2][ref1];

      b. namens de Kamer, onder overeenkomstige toepassing van [artikel 10.3][ref2];

      c. door een in de wet genoemd aantal leden, onder overeenkomstige toepassing van [artikel 10.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel10.2
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel10.3
      [ref3]: https://wetten.overheid.nl/BWBR0044975#Artikel10.4
