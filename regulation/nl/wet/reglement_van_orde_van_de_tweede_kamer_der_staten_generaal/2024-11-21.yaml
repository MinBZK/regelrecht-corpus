  - number: '11.1'
    text: |-
      1 De Kamer beraadslaagt na aanvang van een nieuwe zitting zo spoedig mogelijk, maar uiterlijk na een week, over de
      verkiezingsuitslag. Het doel van de beraadslaging is een of meer informateurs onderscheidenlijk formateurs aan te
      wijzen en de door hen uit te voeren opdracht vast te stellen. Indien dat doel niet in de vergadering wordt bereikt,
      besluit de Kamer daarover zo spoedig mogelijk in een volgende vergadering.

      2 De Kamer stelt bij de aanwijzing van de informateurs of formateurs een termijn vast, waarbinnen de uit te voeren
      opdracht moet zijn afgerond. De termijn kan niet worden verlengd.

      3 Indien een informatieopdracht binnen de termijn, bedoeld in het tweede lid, wordt afgerond, formuleert de Kamer
      in beginsel binnen een week na de dag van afronding een formatieopdracht, en wijst zij voor de uitvoering daarvan
      een of meer formateurs aan.

      4 Indien de aangewezen informateurs of formateurs hun opdracht binnen de termijn, bedoeld in het tweede lid,
      teruggeven, of zij niet binnen die termijn hun opdracht hebben afgerond, formuleert de Kamer in beginsel binnen een
      week na de dag van teruggave onderscheidenlijk na de dag van het verstrijken van de termijn een nieuwe opdracht, en
      wijst zij voor de uitvoering daarvan een of meer informateurs of formateurs aan.

      5 De aanwijzing van een informateur of formateur vindt plaats onder toepassing van de
      [artikelen 8.25 tot en met 8.30][ref1].

      6 Na een tussentijdse val van het kabinet kan de Kamer beraadslagen over de wenselijkheid of richting van een
      nieuwe kabinetsformatie. Het eerste tot en met vijfde lid is dan van overeenkomstige toepassing, met dien verstande
      dat de termijn, bedoeld in het tweede lid, ten hoogste drie weken kan bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.25
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.25'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '11.2'
    text: |-
      De Kamer kan de informateurs en formateurs tijdens de uitvoering van en na afronding van hun opdracht uitnodigen om
      inlichtingen te verschaffen over het verloop van de kabinetsformatie.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel11.2
  - number: '11.3'
    text: |-
      1 Na een tussentijdse val van het kabinet, een koninklijk besluit tot ontbinding van de Kamer, of verkiezingen voor
      de Kamer, kan de Kamer op schriftelijk voorstel van een commissie of van een of meer leden besluiten om een of meer
      onderwerpen controversieel te verklaren.

      2 Indien een onderwerp controversieel is verklaard, wordt de behandeling daarvan uitgesteld totdat een nieuw
      kabinet is aangetreden of de Kamer tussentijds anders besluit.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel11.3
  - number: '12.1'
    text: |-
      1 Een lid dat schriftelijk vragen wil stellen aan een minister dient deze vragen in bij de Voorzitter. De vragen
      moeten kort en duidelijk zijn geformuleerd.

      2 De Voorzitter zendt de vragen door aan de betrokken minister, tenzij hij van oordeel is dat de vragen woorden als
      bedoeld in [artikel 8.16, eerste lid, onder a tot en met f][ref1], bevatten.

      3 De Voorzitter brengt de doorgezonden vragen ter kennis van de leden en maakt deze vragen openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.16
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.16'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '12.2'
    text: |-
      1 Indien een minister niet in staat is om een schriftelijke vraag binnen drie weken te beantwoorden, dan laat hij
      de Voorzitter dit onder opgave van redenen weten.

      2 De Griffier maakt regelmatig een overzicht openbaar van de vragen die langer dan zes weken op beantwoording
      wachten, en rappelleert daarover regelmatig bij de ministers.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.2
  - number: '12.3'
    text: |-
      1 Het mondelinge vragenuur vindt plaats op dinsdag aan het begin van de vergadering. De ministers worden verzocht
      steeds beschikbaar te zijn op dit tijdstip, tenzij zij verplichtingen hebben die naar het oordeel van de Voorzitter
      moeten voorgaan.

      2 Ieder lid kan ten hoogste één onderwerp aanmelden waarover hij tijdens het vragenuur vragen wil stellen. Het
      lid kan dit onderwerp schriftelijk aanmelden bij de Voorzitter vanaf de sluiting van de laatste vergadering in
      de voorafgaande week tot uiterlijk 11.00 uur op de dinsdag van het vragenuur. Indien in de voorafgaande week na
      donderdag 12.00 uur geen vergadering plaatsvindt, kan het lid zijn onderwerp vanaf dat tijdstip aanmelden.

      3 De Voorzitter beslist zo spoedig mogelijk over welke van de aangemelde onderwerpen in het vragenuur vragen worden
      gesteld, en maakt deze onderwerpen openbaar.

      4 De Voorzitter nodigt de betrokken ministers uit voor het vragenuur, onder vermelding van de uitgekozen
      onderwerpen.

      5 De Kamer kan in een bijzonder geval besluiten het vragenuur te laten plaatsvinden op een ander tijdstip dan dat
      bedoeld in het eerste lid. De Voorzitter bepaalt dan tot wanneer de leden hun onderwerpen bij hem kunnen aanmelden.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.3
  - number: '12.4'
    text: |-
      1 De Voorzitter bepaalt de volgorde waarin de onderwerpen tijdens het mondelinge vragenuur aan de orde worden
      gesteld.

      2 Bij elk onderwerp wordt het lid dat het onderwerp heeft aangemeld, de vragensteller, gedurende in totaal vier
      minuten een of meerdere keren het woord verleend om aan de minister vragen te stellen, en wordt aan de minister een
      of meerdere keren het woord verleend om de vragen beknopt te beantwoorden.

      3 Vervolgens kan de Voorzitter aan de leden het woord verlenen om aan de minister vragen te stellen over hetzelfde
      onderwerp. Daarbij wordt het woord voor ten hoogste een halve minuut per vraag verleend. De minister wordt het
      woord verleend om de vragen beknopt te beantwoorden.

      4 Tijdens het vragenuur kunnen de leden van een fractie gezamenlijk ten hoogste twee vragen als bedoeld in het
      derde lid stellen, en de leden van een groep gezamenlijk ten hoogste één dergelijke vraag.

      5 Indien een onderwerp aan het einde van het vragenuur nog niet aan de orde is gekomen, kan de Voorzitter besluiten
      dat dit komt te vervallen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.4
  - number: '12.5'
    text: |-
      Tijdens het mondelinge vragenuur:

      a. zijn interrupties niet toegestaan;

      b. is het indienen van moties niet toegestaan; en

      c. zijn de [artikelen 8.10, derde lid][ref1], en [8.12][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.10
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.12
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.10'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.12'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '12.6'
    text: |-
      1 Ieder lid dat inlichtingen van een minister verlangt over een onderwerp, kan de Kamer verzoeken om hem toe
      te staan een interpellatie te houden. Het lid vermeldt hierbij de belangrijkste punten waarover hij bij de
      interpellatie vragen wil stellen.

      2 Het verzoek wordt toegekend indien het wordt gesteund door ten minste dertig leden.

      3 De Voorzitter bepaalt wanneer de interpellatie wordt gehouden.

      4 De interpellant dient de vragen die hij zal stellen binnen een week schriftelijk in bij de Voorzitter. Deze
      zendt de vragen door aan de betrokken minister. [Artikel 12.1, tweede en derde lid][ref1], is van overeenkomstige
      toepassing.

      5 In afwijking van [artikel 8.12][ref2] voert tijdens de interpellatie slechts de interpellant het woord in ten
      hoogste twee termijnen en de andere leden het woord in ten hoogste één termijn.

      6 Indien bij een interpellatie zeer veel spoed is vereist en de minister aanwezig is, kan de Kamer besluiten dat
      een interpellatie meteen wordt gehouden. Het vierde lid is dan niet van toepassing, en de minister geeft meteen de
      gevraagde inlichtingen. Als dit niet mogelijk is, stelt de Kamer de verdere behandeling uit tot een later tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel12.1
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.12
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '12.1'
        hoofdstuk: '12'
        paragraaf: '12.1'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.12'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '12.7'
    text: |-
      1 Ieder lid kan verzoeken een dertigledendebat te houden, onder vermelding van het onderwerp van het debat.

      2 Het verzoek wordt toegekend indien het wordt gesteund door ten minste dertig leden.

      3 De Voorzitter bepaalt wanneer het debat wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.7
  - number: '12.8'
    text: |-
      1 Indien in de eerste vergadering twaalf weken na de toekenning van een interpellatiedebat, een dertigledendebat of
      een ander door een lid verzocht debat waartoe de Kamer heeft besloten, dit debat nog niet heeft plaatsgevonden, dan
      vervalt de toekenning.

      2 Het lid dat om het debat heeft verzocht, of een ander lid van zijn fractie of groep, kan uiterlijk in de in het
      eerste lid bedoelde vergadering meedelen dat hij de termijn voor de toekenning wenst te verlengen. De verlenging
      geldt vanaf die mededeling tot en met de eerste vergadering twaalf weken nadien. De termijn kan op deze wijze ten
      hoogste twee keer worden verlengd.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.8
  - number: '12.9'
    text: Een parlementaire enquête wordt uitgevoerd door een daarvoor in te stellen enquêtecommissie.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.9
  - number: '12.10'
    text: Ander parlementair onderzoek wordt uitgevoerd door een daarvoor in te stellen tijdelijke commissie.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.10
  - number: '12.11'
    text: |-
      Bij afzonderlijke regeling, vast te stellen door de Kamer, worden nadere regels gesteld voor:

      a. parlementair onderzoek door een enquêtecommissie;

      b. parlementair onderzoek door een tijdelijke commissie; en

      c. extern onderzoek door derden.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel12.11
  - number: '13.1'
    text: |-
      De [artikelen 2.1, eerste tot en met derde lid][ref1], en [2.2][ref2] zijn van overeenkomstige toepassing op de
      op grond van de wet door de Kamer te nemen beslissingen over de toelating tot het lidmaatschap van in Nederland
      gekozen leden van het Europees Parlement, en het verlies van dat lidmaatschap.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '2.1'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '2.2'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      De Kamer kan besluiten dat in Nederland gekozen leden van het Europees Parlement worden uitgenodigd om inlichtingen
      te verstrekken en daartoe deel te nemen aan de beraadslaging van de Kamer over een aan de orde gesteld onderwerp.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.2
  - number: '13.3'
    text: |-
      Bij afzonderlijke regeling, vast te stellen door de Kamer, worden regels gesteld over de betrokkenheid van de Kamer
      bij de totstandkoming van besluitvorming van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.3
  - number: '13.4'
    text: |-
      De Kamer kan besluiten dat het staatshoofd of de regeringsleider van een ander land wordt uitgenodigd een
      vergadering bij te wonen om de Kamer toe te spreken.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.4
  - number: '13.5'
    text: |-
      Bij afzonderlijke regeling, vast te stellen door de Kamer, worden regels gesteld over de procedure bij ontvangst
      van inlichtingen van de regering over de inzet of het ter beschikking stellen van de krijgsmacht ter handhaving of
      bevordering van de internationale rechtsorde.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.5
  - number: '13.6'
    text: |-
      Bij afzonderlijke regeling, vast te stellen door de beide Kamers der Staten-Generaal, wordt de instelling en
      aansturing van een griffie voor de interparlementaire betrekkingen geregeld.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.6
  - number: '13.7'
    text: |-
      De voorzitters van delegaties die hebben deelgenomen aan internationale interparlementaire vergaderingen
      rapporteren schriftelijk aan de Kamer over hun bevindingen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.7
  - number: '13.8'
    text: |-
      Indien het Interparlementair Koninkrijksoverleg van delegaties van de beide Kamers der Staten-Generaal en van de
      Staten van Aruba, Curaçao en Sint Maarten plaatsvindt in Den Haag onder het voorzitterschap van een lid van de
      Tweede Kamer of van diens plaatsvervanger, dan is dit Reglement op dat overleg van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel13.8
  - number: '14.1'
    text: |-
      In de regeling, bedoeld in [artikel 7.7, achtste lid][ref1], worden voorwaarden gesteld waaraan een verzoekschrift
      dient te voldoen om in behandeling te kunnen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.7
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '7.7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '14.2'
    text: |-
      1 Een burgerinitiatief is een voorstel aan de Kamer om een onderwerp te behandelen, en dient te zijn gericht op de
      vervaardiging, wijziging of intrekking van een wettelijke regeling, of op het te voeren regeringsbeleid.

      2 In de regeling, bedoeld in [artikel 7.7, achtste lid][ref1], worden nadere voorwaarden gesteld waaraan een
      door de Kamer ontvangen schriftelijk stuk dient te voldoen om in behandeling te kunnen worden genomen als
      burgerinitiatief.

      3 De initiatiefnemers van een burgerinitiatief kan worden verzocht een toelichting op hun burgerinitiatief te
      geven.

      4 De Kamer neemt over elk burgerinitiatief dat zij in behandeling neemt een besluit binnen negen maanden nadat door
      de commissie voor de Verzoekschriften en de Burgerinitiatieven aan de Kamer verslag is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.7
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '7.7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '14.3'
    text: |-
      1 Bij de behandeling door de Kamer van door de commissie voor de Verzoekschriften en de Burgerinitiatieven
      voorgestelde conclusies, kan ieder lid wijzigingen voorstellen op deze conclusies. De artikelen over amendementen
      op wetsvoorstellen zijn op deze voorstellen van overeenkomstige toepassing, met dien verstande dat ook voorstellen
      waarvan de strekking tegengesteld is aan die van de conclusies toelaatbaar zijn.

      2 Indien de Kamer de voorgestelde conclusies verwerpt zonder daarvoor andere in de plaats te stellen, dan worden
      de betrokken stukken doorgeleid naar een daartoe in te stellen tijdelijke commissie, die daarover nader verslag
      uitbrengt aan de Kamer.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op in het verslag van de tijdelijke commissie
      voorgestelde conclusies. Bij herhaalde toepassing van het tweede lid worden de betrokken stukken doorgeleid naar
      een nieuwe tijdelijke commissie.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel14.3
  - number: '14.4'
    text: |-
      1 Indien de Kamer heeft ingestemd met conclusies over een verzoekschrift of burgerinitiatief, waarbij een minister
      wordt uitgenodigd iets te doen of na te laten, en de minister bij brief te kennen geeft daaraan geen gevolg te
      geven, dan wordt die brief doorgeleid naar de commissie voor de Verzoekschriften en de Burgerinitiatieven.

      2 De commissie kan aan de Kamer voorstellen om de brief en de bijbehorende stukken door te geleiden naar een andere
      commissie, die daarover nader aan de Kamer verslag uitbrengt.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel14.4
  - number: '15.1'
    text: |-
      1 De vergaderingen van de Kamer en de commissies zijn openbaar, met uitzondering van de in de [Grondwet][ref1] en
      [artikel 7.19][ref2] bedoelde gevallen.

      2 De agenda van de openbare vergaderingen wordt voorafgaand openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel7.19
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '7.19'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '15.2'
    text: |-
      1 De toehoorders van een vergadering van de Kamer, en de overige aanwezigen in de gebouwen van de Kamer, mogen
      de orde niet verstoren. Alle aanwezigen moeten in ieder geval de aanwijzingen opvolgen van de Voorzitter, de
      ambtenaren van de Kamer, de politie en andere toezichthoudende functionarissen.

      2 De toehoorders moeten tijdens een vergadering in ieder geval alle tekenen van goed- of afkeuring achterwege laten
      en een behoorlijke stilte in acht nemen.

      3 De Voorzitter zorgt tijdens een vergadering voor de handhaving van het eerste en tweede lid ten aanzien van de
      toehoorders. Bij overtredingen kan hij de overtreders, en desnoods een deel van de overige toehoorders of alle
      toehoorders, doen laten vertrekken.

      4 Dit artikel is van overeenkomstige toepassing op vergaderingen van commissies.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.2
  - number: '15.3'
    text: |-
      1 Indien buitengewone omstandigheden dit naar het oordeel van het Presidium noodzakelijk maken, kan het Presidium
      besluiten tijdelijk bezoekers de toegang tot het gebouw van de Kamer of in het bijzonder de tribunes te ontzeggen
      of deze toegang op andere wijze te beperken.

      2 Tijdens een periode waarin een maatregel als bedoeld in het eerste lid geldt, blijven genodigden en
      geaccrediteerde journalisten toegang tot het gebouw of de tribunes hebben, voor zover dit naar het oordeel van
      het Presidium verantwoord is. Het Presidium kan tevens toestaan dat andere bezoekers tot het gebouw of de tribunes
      worden toegelaten.

      3 Een maatregel als bedoeld in het eerste lid, kan voor de duur van ten hoogste drie maanden worden genomen en
      telkens worden verlengd, en wordt niet langer gehandhaafd dan door het Presidium noodzakelijk wordt geacht in
      verband met de buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.3
  - number: '15.4'
    text: |-
      1 Het Presidium kan degene die de orde heeft verstoord tijdelijk de toegang ontzeggen tot de gebouwen van de Kamer
      of een deel daarvan. De toegang kan slechts worden ontzegd, indien naar het oordeel van het Presidium de orde
      ernstig is verstoord en vrees bestaat voor een nieuwe verstoring van de orde.

      2 De ontzegging kan voor de duur van ten hoogste drie maanden worden vastgesteld en telkens worden verlengd,
      en wordt niet langer gehandhaafd dan door het Presidium noodzakelijk wordt geacht op grond van de overwegingen,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.4
  - number: '15.5'
    text: |-
      Het Presidium kan bij afzonderlijke regeling nadere regels vaststellen over de toegang van de toehoorders van
      vergaderingen en van overige aanwezigen tot de gebouwen van de Kamer en tot de vergaderingen van de Kamer en de
      commissies.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.5
  - number: '15.6'
    text: |-
      1 Er wordt een geredigeerd woordelijk verslag gemaakt van wat is gezegd tijdens:

      a. elke openbare vergadering van de Kamer;

      b. elke bijeenkomst als bedoeld in [artikel 8.3, tweede lid][ref1], van de Kamer;

      c. elk openbaar commissiedebat, wetgevingsoverleg en notaoverleg als bedoeld in [artikel 7.26][ref2].

      2 De Kamer of een commissie kan besluiten dat van andere van haar vergaderingen een geredigeerd woordelijk verslag
      wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.3
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel7.26
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.6
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.3'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '7.26'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: '15.7'
    text: |-
      1 Er wordt tevens een officieel verslag gemaakt van de vergaderingen van de Kamer, en van bijeenkomsten als bedoeld
      in [artikel 8.3, tweede lid][ref1].

      2 Het officieel verslag van een vergadering van de Kamer bevat in ieder geval:

      a. de namen van de aanwezige leden;

      b. de uitslagen van de stemmingen en of leden zich bij een hoofdelijke stemming voor of tegen verklaarden;

      c. de lijst van ingekomen stukken met de mededelingen en voorstellen voor de wijze van behandeling; en

      d. alle door de Kamer of de Voorzitter genomen besluiten.

      3 Het officieel verslag van een bijeenkomst als bedoeld in [artikel 8.3, tweede lid][ref2], bevat in ieder geval:

      a. de namen van de aanwezige en afwezige leden; en

      b. de lijst van ingekomen stukken met de mededelingen en voorstellen voor de wijze van behandeling.

      4 De officiële verslagen worden vastgesteld door ondertekening door de Voorzitter en de Griffier, en in het archief
      van de Kamer bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel8.3
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel8.3
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '8.3'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0044975
        artikel: '8.3'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '15.8'
    text: |-
      1 Indien de Kamer besluit dat van een vergadering met gesloten deuren van de Kamer een woordelijk verslag wordt
      gemaakt, hebben de medewerkers van de Dienst Verslag en Redactie die dit verslag maken, toegang tot de vergadering.
      Het woordelijk verslag wordt niet openbaar gemaakt en wordt achter slot bewaard, tenzij de Kamer hierover dadelijk
      of op een later tijdstip anders besluit.

      2 Indien de Kamer niet besluit tot het laten maken van een woordelijk verslag van een vergadering met gesloten
      deuren van de Kamer, maakt de Griffier of een door hem aan te wijzen ambtenaar notulen. Deze bevatten de
      informatie, bedoeld in [artikel 15.7, tweede lid][ref1], en een beknopt verslag van de beraadslagingen. De notulen
      worden meteen of in een volgende vergadering met gesloten deuren aan de goedkeuring van de Kamer onderworpen. Zij
      worden niet openbaar gemaakt en achter slot bewaard, tenzij de Kamer hierover dadelijk of op een later tijdstip
      anders besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel15.7
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.8
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '15.7'
        hoofdstuk: '15'
        paragraaf: '15.3'
  - number: '15.9'
    text: |-
      1 [Artikel 15.8][ref1] is van overeenkomstige toepassing op besloten commissievergaderingen en besloten gedeelten
      van een commissievergadering, waarvan een commissie een woordelijk verslag of notulen wenst te maken.

      2 De commissie beslist over de openbaarmaking van het woordelijk verslag of de notulen. Indien de betrokken
      commissie niet langer bestaat of onduidelijk is welke commissie over de openbaarmaking kan beslissen, beslist de
      Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel15.8
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel15.9
    references:
