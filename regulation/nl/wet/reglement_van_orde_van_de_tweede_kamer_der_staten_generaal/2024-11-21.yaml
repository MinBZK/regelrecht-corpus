        bwb_id: BWBR0044975
        artikel: '7.9'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '4.1'
    text: |-
      1 Het Presidium maakt jaarlijks een ontwerp op voor de raming van de in het volgende jaar voor de Kamer benodigde
      uitgaven en ontvangsten en zendt deze tijdig aan de Kamer en aan de voor de begroting van de Staten-Generaal
      verantwoordelijke minister.

      2 De Kamer stelt de raming vast.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel4.1
  - number: '5.1'
    text: |-
      1 De leden, die door het centraal stembureau op dezelfde lijst verkozen zijn verklaard, vormen bij aanvang van
      een zitting één fractie. Indien onder een lijstnummer slechts één lid is verkozen, dan wordt dit lid als een
      afzonderlijke fractie beschouwd.

      2 Nieuwe fracties kunnen gedurende een zitting slechts worden gevormd door:

      a. een samenvoeging van twee of meer fracties;

      b. een splitsing tot twee of meer fracties.

      3 Een splitsing als bedoeld in het tweede lid, onder b, is slechts mogelijk, indien bij een afscheiding van leden
      van een fractie onduidelijk is welk deel van de leden als voortzetting van de oorspronkelijke fractie moet worden
      beschouwd, en het Presidium heeft besloten dat hierdoor twee of meer nieuwe fracties zijn gevormd.

      4 Een fractie deelt de samenstelling van haar bestuur, en elke wijziging in haar samenstelling en die van haar
      bestuur, mee aan de Voorzitter.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel5.1
  - number: '5.2'
    text: |-
      Indien leden anders dan als gevolg van een splitsing als bedoeld in [artikel 5.1, tweede lid, onder b][ref1],
      afgescheiden zijn van een fractie, worden zij ieder afzonderlijk, of twee of meer leden gezamenlijk als zij dit
      meedelen aan de Voorzitter, beschouwd als een groep.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '5.3'
    text: |-
      1 Bij afzonderlijke regeling, vast te stellen door de Kamer op voorstel van het Presidium, worden regels
      gesteld voor de toekenning en het beheer van een financiële bijdrage aan fracties en groepen ten behoeve van hun
      werkzaamheden.

      2 Indien een nieuwe fractie ontstaat door samenvoeging, is de bijdrage aan de nieuwgevormde fractie ten hoogste de
      bijdrage die zou toekomen aan een fractie van gelijke grootte als bedoeld in [artikel 5.1, eerste lid][ref1].

      3 Indien in een fractie een splitsing plaatsvindt, wordt de hoogte van de bijdragen aan de bij de splitsing
      betrokken nieuwe fracties vastgesteld door de bijdrage die aan de ongesplitste fractie zou toekomen, onder de
      nieuwe fracties te verdelen naar evenredigheid van de aantallen bij de splitsing betrokken leden.

      4 De regeling, bedoeld in het eerste lid, bepaalt de gevolgen van de afscheiding van leden van een fractie in
      groepen, voor de bijdrage van die fractie.

      5 Het Presidium kan tijdelijke maatregelen treffen die afwijken van het eerste tot en met vierde lid, om de
      voldoening mogelijk te maken van verplichtingen die tegenover de medewerkers van een oorspronkelijke fractie
      bestaan bij een samenvoeging of splitsing, of bij een afscheiding van een of meer groepen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '5.4'
    text: |-
      Elke fractie of groep maakt het bij haar gevoerde beleid, bedoeld in
      [artikel 3, tweede lid, van de Arbeidsomstandighedenwet][ref1], steeds openbaar op een openbare website, en deelt
      de vindplaats daarvan mee aan de Griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel3
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '3'
  - number: '6.1'
    text: |-
      1 De Kamer beslist over het aangaan en beëindigen van het dienstverband van de Griffier.

      2 Het Presidium is belast met het uitoefenen van de overige rechtspositionele bevoegdheden ten aanzien van de
      Griffier.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel6.1
  - number: '6.2'
    text: |-
      1 De Griffier heeft de leiding over de ambtelijke organisatie. Het Presidium oefent hierop toezicht uit.

      2 De Griffier is voorts belast met:

      a. het namens de Kamer vervullen van haar wettelijke taken ten aanzien van haar begroting;

      b. het namens de Kamer vervullen van haar wettelijke taken ten aanzien van haar archiefbescheiden;

      c. het namens de Kamer besluiten op verzoeken op grond van de [Wet hergebruik van overheidsinformatie][ref1] of
      de [Wet open overheid][ref2];

      d. het namens de Kamer beslissen op een bezwaar tegen een besluit als bedoeld onder c, dat is genomen onder
      toepassing van ondermandaat als bedoeld in het vierde lid;

      e. het in rechte vertegenwoordigen van de Kamer in bezwaar- en beroepsprocedures over besluiten als bedoeld onder
      c, en handelingen ter voorbereiding daarop te verrichten;

      f. de overige taken die op grond van dit Reglement of de wet aan hem zijn toegedeeld.

      3 De Griffier kan ondermandaat verlenen tot het uitoefenen van zijn bevoegdheden op grond van het tweede lid, onder
      a en b.

      4 De Griffier kan ondermandaat verlenen tot het uitoefenen van zijn bevoegdheden op grond het tweede lid, onder c
      en d, tenzij het besluit betrekking heeft op informatie die berust bij het Presidium of de Voorzitter.

      5 De Griffier kan de taak, bedoeld in het tweede lid, onder e, opdragen aan een door hem aan te wijzen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0036795
      [ref2]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0036795
      - id: ref2
        bwb_id: BWBR0045754
  - number: '6.3'
    text: |-
      1 Het Presidium is belast met het aangaan en beëindigen van het dienstverband van een of meer directeuren.

      2 De Griffier is belast met het uitoefenen van de overige rechtspositionele bevoegdheden ten aanzien van de
      directeuren.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel6.3
  - number: '6.4'
    text: |-
      De Griffier is belast met het aangaan en beëindigen van het dienstverband van de overige ambtenaren, en met het
      uitoefenen van de overige rechtspositionele bevoegdheden ten aanzien van hen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel6.4
  - number: '7.1'
    text: |-
      1 Er is een vaste commissie voor elk ministerie, met uitzondering van het ministerie van Algemene Zaken. Er zijn
      ook vaste commissies voor Digitale Zaken, voor Europese Zaken en voor Koninkrijksrelaties.

      2 De Kamer kan verder vaste commissies instellen voor het taakgebied van een minister die niet is belast met de
      leiding van een ministerie, of voor dat van een staatssecretaris. Deze commissies worden ingesteld voor de duur van
      een zitting.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.1
  - number: '7.2'
    text: |-
      1 De Kamer kan tijdelijke commissies instellen voor specifieke onderwerpen.

      2 Het instellingsbesluit van een tijdelijke commissie bevat in ieder geval:

      a. een nauwkeurige omschrijving van het onderwerp waarover de commissie aan de Kamer dient te rapporteren, of
      waarvoor de commissie anders wordt ingesteld; en

      b. de termijn waarvoor de commissie wordt ingesteld.

      3 De in het tweede lid, onder b, bedoelde termijn kan op verzoek van de commissie door de Kamer worden verlengd.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.2
  - number: '7.3'
    text: De Kamer kan een enquêtecommissie instellen voor het uitvoeren van een parlementaire enquête.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.3
  - number: '7.4'
    text: |-
      1 Er is een commissie voor de Rijksuitgaven.

      2 De commissie is belast met:

      a. het behandelen van aangelegenheden van rechtmatigheid, doeltreffendheid en doelmatigheid van de inning en
      besteding van collectieve middelen;

      b. het voorlichten, adviseren en ondersteunen van de Kamer en de commissies bij de uitoefening van het budgetrecht
      en de financiële controle van de regering.

      3 De voorlichting, advisering en ondersteuning, bedoeld in het tweede lid, onder b, strekken zich mede uit tot
      grote projecten als bedoeld in [artikel 7.37][ref1].

      4 De Kamer besluit slechts over een voorstel om de Algemene Rekenkamer te verzoeken een onderzoek in te stellen,
      nadat advies bij de commissie is ingewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.37
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '7.37'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: '7.5'
    text: |-
      1 Er is een commissie voor de Inlichtingen- en Veiligheidsdiensten.

      2 In afwijking van [artikel 7.11, eerste, tweede en vijfde lid][ref1], zijn lid van deze commissie de voorzitters
      van de fracties, bedoeld in [artikel 5.1, eerste lid][ref2]. Indien in de Kamer meer dan vijf van deze fracties
      zitting hebben, zijn lid de voorzitters van de vijf grootste van deze fracties. De Kamer kan op voordracht van de
      commissie besluiten dat voor de duur van een zitting ten hoogste twee andere voorzitters van fracties ook lid zijn
      van de commissie.

      3 Indien een voorzitter van een fractie op diens verzoek is ontheven van het lidmaatschap van de commissie, is in
      afwijking van [artikel 7.11, vierde lid][ref3], de Kamer op voordracht van de commissie bevoegd te besluiten of in
      plaats van de voorzitter van die fractie een andere voorzitter van een fractie voor de verdere duur van de zitting
      lid is van de commissie.

      4 Indien een lid van de commissie tijdelijk tevens minister is, wordt dit lid gedurende die periode vervangen door
      een lid dat zijn fractie daartoe voor de duur van die periode uit haar midden aanwijst. Indien alle leden van de
      fractie tijdelijk tevens minister zijn, is gedurende die periode geen van hen lid van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel7.11
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0044975#Artikel7.11
