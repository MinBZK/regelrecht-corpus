        artikel: '7.6'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '2.2'
    text: |-
      1 De Voorzitter waarschuwt een lid schriftelijk, indien hij van oordeel is dat dit lid een van de vereisten voor
      het lidmaatschap niet meer bezit of een met het lidmaatschap onverenigbare betrekking vervult, en het lid de Kamer
      daarvan kennis had moeten geven.

      2 Het lid kan de zaak binnen acht dagen na de waarschuwing aan het oordeel van de Kamer onderwerpen.

      3 De Kamer oordeelt slechts over de zaak, nadat daarover verslag is uitgebracht door een daartoe in te stellen
      tijdelijke commissie.

      4 De tijdelijke commissie hoort het lid, indien dat de wens daartoe te kennen geeft.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel2.2
  - number: '3.1'
    text: |-
      1 In de laatste vergadering van elke zitting stelt de Kamer in oude samenstelling een ontwerp vast voor een
      profielschets van de nieuw te benoemen Voorzitter.

      2 De nieuw gekozen Kamer stelt in de eerste vergadering van een zitting de profielschets vast.

      3 Na de vaststelling geeft de tijdelijk Voorzitter, bedoeld in [artikel 3.3][ref1], gelegenheid tot het stellen van
      kandidaten voor het voorzitterschap.

      4 Na de kandidaatstellingsprocedure gaat de Kamer over tot de benoeming van een Voorzitter.

      5 Bij het tussentijds openvallen van het voorzitterschap stelt de Kamer zo spoedig mogelijk de profielschets van de
      nieuw te benoemen Voorzitter vast, en wordt vervolgens onder toepassing van het derde en vierde lid een Voorzitter
      benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel3.1
