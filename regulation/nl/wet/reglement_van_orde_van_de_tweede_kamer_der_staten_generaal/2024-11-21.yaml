  - number: '3.4'
    text: |-
      1 Indien de Voorzitter niet beschikbaar is, wordt het voorzitterschap waargenomen door een van de Ondervoorzitters
      overeenkomstig de rangorde, bedoeld in [artikel 3.5, eerste lid][ref1].

      2 Indien evenmin een Ondervoorzitter beschikbaar is:

      a. kan de Voorzitter het voorzitterschap in een vergadering laten waarnemen door andere leden; en

      b. wordt bij het langdurig niet beschikbaar zijn van de Voorzitter en de Ondervoorzitters overeenkomstig
      [artikel 3.3, eerste lid][ref2], bepaald wie het voorzitterschap waarneemt.

      3 Een waarnemend Voorzitter heeft de taken en bevoegdheden van de Voorzitter die vereist zijn voor de waarneming.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel3.5
