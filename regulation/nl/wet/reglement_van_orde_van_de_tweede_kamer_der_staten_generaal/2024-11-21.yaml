  - number: '10.9'
    text: |-
      1 Ieder lid kan, alleen of met andere leden, over een door hem te bepalen onderwerp een initiatiefnota indienen.

      2 De initiatiefnota dient paragrafen met beslispunten en financiële aspecten te bevatten.

      3 De Voorzitter stelt de initiatiefnota in handen van een commissie. Indien de paragrafen, bedoeld in het tweede
      lid, niet in de initiatiefnota zijn opgenomen, kan de Voorzitter de indieners verzoeken het stuk daarvan alsnog
      te voorzien.

      4 Het besluit tot inhandenstelling wordt zo spoedig mogelijk meegedeeld aan de Kamer. Bij die mededeling kan de
      Kamer anders besluiten over de inhandenstelling.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel10.9
  - number: '10.10'
    text: |-
      1 De commissie houdt in ieder geval een notaoverleg over een in haar handen gestelde initiatiefnota.

      2 Indien een commissie besluit voorafgaand een verslag vast te stellen over de initiatiefnota, zijn de
      [artikelen 9.2][ref1] en [9.3][ref2] van overeenkomstige toepassing.

      3 Indien een commissie besluit een verslag uit te brengen over een ander stuk waarover zij een notaoverleg wenst te
      houden, zijn de [artikelen 9.2][ref3] en [9.3][ref4] eveneens van overeenkomstige toepassing.

      4 De [artikelen 9.24][ref5] en [9.25][ref6] zijn van overeenkomstige toepassing op initiatiefnota’s.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel9.2
