  - number: '3.3'
    text: |-
      1 Zolang in een nieuwe zitting geen Voorzitter is benoemd, treedt als tijdelijk Voorzitter op:

      a. een oud-Voorzitter, waarbij de laatst afgetredene voorrang heeft;

      b. als geen oud-Voorzitters beschikbaar zijn: een oud-Ondervoorzitter, waarbij de laatst afgetredene
      voorrang heeft, en bij gelijktijdig afgetreden oud-Ondervoorzitters de hoogste in de rangorde, bedoeld in
      [artikel 3.5, eerste lid][ref1], voorgaat;

      c. als evenmin oud-Ondervoorzitters beschikbaar zijn: het lid dat het langst in de Kamer zitting heeft, waarbij bij
      gelijke zittingsduur het oudste lid in leeftijd voorgaat.

      2 Zolang bij het tussentijds openvallen van het Voorzitterschap geen Voorzitter is benoemd, treedt de hoogst
      beschikbare Ondervoorzitter in de rangorde, bedoeld in [artikel 3.5, eerste lid][ref2], als tijdelijk Voorzitter
      op. Indien geen Ondervoorzitter beschikbaar is, wordt overeenkomstig het eerste lid vastgesteld wie tijdelijk
      Voorzitter is.

      3 De tijdelijk Voorzitter heeft dezelfde taken en bevoegdheden als een Voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel3.3
