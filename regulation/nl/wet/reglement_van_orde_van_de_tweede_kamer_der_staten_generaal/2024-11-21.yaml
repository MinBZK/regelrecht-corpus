  - number: '7.6'
    text: |-
      1 Er is een commissie voor het onderzoek van de Geloofsbrieven.

      2 De commissie brengt de Kamer schriftelijk of mondeling verslag uit over het verloop van de verkiezingen, de
      vaststelling van de verkiezingsuitslag, en de toelating van de leden.

      3 De taak, bedoeld in het tweede lid, strekt zich uit over de verkiezing en toelating van de leden van de Tweede
      Kamer, en van de in Nederland gekozen leden van het Europees Parlement.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.6
  - number: '7.7'
    text: |-
      1 Er is een commissie voor de Verzoekschriften en de Burgerinitiatieven.

      2 De commissie brengt aan de Kamer verslag uit over verzoekschriften en burgerinitiatieven. Zij brengt tevens
      verslag uit over onderzoeksrapporten van de Nationale ombudsman, indien daartoe aanleiding is.

      3 De commissie toetst of een verzoekschrift of burgerinitiatief voldoet aan de daaraan gestelde vereisten.

      4 Elk verslag over een verzoekschrift of een burgerinitiatief bevat een duidelijke conclusie of een
      behandelingsvoorstel.

      5 De commissie kan een andere commissie verzoeken haar van advies te dienen of namens haar een onderzoek in te
      stellen en daarover aan haar verslag uit te brengen, voordat zij zelf aan de Kamer verslag uitbrengt.

      6 De commissie kan mondeling of schriftelijk in overleg treden met de Nationale ombudsman.

      7 De commissie kan slechts besluiten nemen indien meer dan de helft van haar leden of plaatsvervangende leden
      aanwezig zijn.

      8 Bij afzonderlijke regeling, vast te stellen door de Kamer, wordt de werkwijze van de commissie nader geregeld.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.7
  - number: '7.8'
    text: |-
      1 Er is een commissie voor de Werkwijze.

      2 De commissie adviseert de Kamer desgevraagd of uit eigen beweging over de werkwijze van de Kamer en over dit
      Reglement.

      3 De commissie brengt aan de Kamer verslag uit over de daartoe aan haar doorgeleide voorstellen tot wijziging van
      dit Reglement.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.8
  - number: '7.9'
    text: Het Presidium kan ten behoeve van zijn werkzaamheden commissies van advies instellen.
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.9
  - number: '7.10'
    text: |-
      1 In de door beide Kamers der Staten-Generaal vast te stellen regeling, bedoeld in [artikel 15.11][ref1], wordt een
      gemengde commissie van beroep voor de Dienst Verslag en Redactie ingesteld.

      2 De gemengde commissie is bevoegd om in de door de Dienst opgestelde woordelijke verslagen wijzigingen aan te
      brengen of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel15.11
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '15.11'
        hoofdstuk: '15'
        paragraaf: '15.3'
  - number: 7.10a
    text: |-
      Bij afzonderlijke regeling, vast te stellen door de Kamer, wordt een adviescommissie als bedoeld in
      [artikel 7:13 van de Algemene wet bestuursrecht][ref1] ingesteld ten behoeve van de beslissingen op bezwaar,
      bedoeld in de [artikelen 3.2, onder e][ref2], en [6.2, tweede lid, onder d][ref3]. In de regeling worden nadere
      regels gegeven over de adviescommissie, waaronder over de organisatie, werkwijze en het lidmaatschap van de
      adviescommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel713
      [ref2]: https://wetten.overheid.nl/BWBR0044975#Artikel3.2
      [ref3]: https://wetten.overheid.nl/BWBR0044975#Artikel6.2
