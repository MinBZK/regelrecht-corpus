        paragraaf: '9.3'
  - number: '9.31'
    text: |-
      De [artikelen 9.29][ref1] en [9.30][ref2] zijn van overeenkomstige toepassing op rijkswetsvoorstellen tot wijziging
      van het [Statuut voor het Koninkrijk][ref3] die afwijken van de [Grondwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel9.29
