articles:
  - number: '1.1'
    text: |-
      In dit Reglement en de daarop berustende regelingen wordt, tenzij anders bepaald, verstaan onder:

        - *bijzondere gedelegeerde:* een door de Staten van Aruba, Curaçao of Sint Maarten afgevaardigde bijzondere
      gedelegeerde;
        - *commissiegriffier:* de door de Griffier aangewezen plaatsvervangende griffier die een commissie bijstaat;
        - *commissie(onder)voorzitter:* de (onder)voorzitter van een commissie;
        - *gevolmachtigde minister:* de Gevolmachtigde Minister van Aruba, Curaçao of Sint Maarten;
        - *Griffier:* de Griffier van de Kamer;
        - *minister:* een bij koninklijk besluit benoemde minister of staatssecretaris;
        - *Ondervoorzitter:* een Ondervoorzitter van de Kamer;
        - *openbaar maken:* het voor een ieder beschikbaar stellen op een openbare website;
        - *oude samenstelling:* de samenstelling van de Kamer, onmiddellijk voorafgaand aan de eerste vergadering van een
      nieuw gekozen Kamer;
        - *stukken:* archiefbescheiden als bedoeld in de [Archiefwet 1995][ref1];
        - *Voorzitter:* de Voorzitter van de Kamer;
        - *zitting:* de periode waarin een gekozen Kamer werkzaam is, welke duurt vanaf de eerste vergadering van een nieuw
      gekozen Kamer tot aan de eerste vergadering van de daaropvolgende nieuw gekozen Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0044975/2024-11-21#Artikel1.1
