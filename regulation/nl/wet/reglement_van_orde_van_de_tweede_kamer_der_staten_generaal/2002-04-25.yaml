$id: reglement_van_orde_van_de_tweede_kamer_der_staten_generaal
regulatory_layer: WET
publication_date: '2021-03-09'
valid_from: '2002-04-25'
bwb_id: BWBR0006023
url: https://wetten.overheid.nl/BWBR0006023/2002-04-25
articles:
  - number: '1'
    text: 'Waar in dit Reglement sprake is van:'
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel1
  - number: 1.a
    text: de Voorzitter, wordt daarmee de Voorzitter van de Kamer bedoeld;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel1
  - number: 1.b
    text: de ministers, worden daaronder de staatssecretarissen begrepen;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel1
  - number: 1.c
    text: |-
      stukken, worden daarmee bedoeld bescheiden in de zin van de [Archiefwet 1995][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: 1.d
    text: drukken, wordt daaronder mede begrepen plaatsing op het internet.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel1
  - number: '2.1'
    text: Elk nieuwbenoemd lid doet van zijn verkiezing blijken door overlegging van de bij de wet voorgeschreven stukken.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel2
  - number: '2.2'
    text: |-
      De geloofsbrieven en daarop betrekking hebbende stukken worden op de griffie van de Kamer ter inzage gelegd van
      de leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel2
  - number: '2.3'
    text: |-
      Over de toelating van leden die benoemd zijn verklaard na periodieke aftreding of ontbinding besluit, voor zover
      mogelijk, de Kamer in oude samenstelling.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel2
  - number: '3.1'
    text: |-
      Indien een lid het oordeel van de Voorzitter dat dit lid heeft opgehouden lid te zijn, wegens hetzij het niet
      bezitten van een van de vereisten voor het lidmaatschap hetzij het vervullen van een met het lidmaatschap
      onverenigbare betrekking, aan het oordeel van de Kamer onderwerpt, doet de Kamer over de zaak geen uitspraak
      dan nadat een daartoe door haar uit haar midden benoemde commissie van onderzoek verslag heeft uitgebracht. De
      commissie hoort het desbetreffende lid, indien die de wens daartoe te kennen geeft.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel3
  - number: '3.2'
    text: Met betrekking tot een lid van het Europese Parlement is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel3
  - number: '4.1'
    text: |-
      In de laatste vergadering van de Kamer in de oude zitting, stelt deze een ontwerp vast voor een profielschets van
      de nieuw te benoemen Voorzitter. In de eerste vergadering van de nieuwe zitting beslist de Kamer over dit ontwerp.
      Vervolgens geeft de tijdelijk Voorzitter de gelegenheid tot het stellen van kandidaten voor de vervulling van de
      vacature en gaat de Kamer over tot de benoeming van een Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel4
  - number: '4.2'
    text: |-
      Zolang in de eerste vergadering van een nieuwe zitting geen Voorzitter is benoemd, treedt een oud-Voorzitter als
      tijdelijk Voorzitter op, waarbij de laatstafgetredene voorrang heeft. Bij ontstentenis van een oud-Voorzitter
      treedt als tijdelijk Voorzitter op de laatst afgetreden oud-ondervoorzitter; bij aanwezigheid van twee of meer
      gelijktijdig afgetreden oud-ondervoorzitters wordt hun rangorde in het Presidium, waarin zij gelijktijdig zitting
      hadden, in acht genomen. Bij ontstentenis van een oud-ondervoorzitter treedt het lid dat het langst in de Kamer
      zitting heeft als tijdelijk Voorzitter op; bij gelijke zittingsduur gaat het oudste lid in leeftijd voor.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel4
  - number: '4.3'
    text: |-
      Bij het tussentijds openvallen van het voorzitterschap stelt de Kamer hiervoor zo spoedig mogelijk een
      profielschets vast. Vervolgens geeft de tijdelijke Voorzitter de gelegenheid tot het stellen van kandidaten voor
      het vervullen van de vacature en gaat de Kamer over tot benoeming van een Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel4
  - number: '5'
    text: |-
      De Kamer benoemt na iedere voorzittersbenoeming een door haar te bepalen aantal ondervoorzitters, van wie de
      rangorde wordt bepaald door de volgorde van hun benoemingen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel5
  - number: '6'
    text: 'De taak van de Voorzitter bestaat voornamelijk in:'
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel6
  - number: 6.a
    text: het leiden van de werkzaamheden van de Kamer en van die van het Presidium;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel6
  - number: 6.b
    text: het doen naleven van het Reglement van Orde;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel6
  - number: 6.c
    text: het uitvoeren van door de Kamer genomen besluiten;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel6
  - number: 6.d
    text: het vertegenwoordigen van de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel6
  - number: '7'
    text: De Voorzitter is bevoegd de vergaderingen van elke commissie bij te wonen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel7
  - number: '8.1'
    text: |-
      Indien de Voorzitter niet beschikbaar is, wordt het voorzitterschap waargenomen door een van de ondervoorzitters,
      overeenkomstig de in [artikel 5][ref1] genoemde rangorde.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel5
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '5'
        hoofdstuk: III
  - number: '8.2'
    text: |-
      Is de Voorzitter noch een van de ondervoorzitters beschikbaar, dan wordt de Voorzitter vervangen overeenkomstig de
      regeling in [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel4
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '4'
        hoofdstuk: III
  - number: '8.3'
    text: Een waarnemend Voorzitter heeft dezelfde taken en bevoegdheden als de Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel8
  - number: '9.1'
    text: |-
      De Voorzitter en de ondervoorzitters vormen samen het Presidium. De Voorzitter benoemt voor ieder lid van het
      Presidium een plaatsvervanger die bij afwezigheid van het desbetreffende lid in zijn plaats de vergadering van het
      Presidium bijwoont. De Kamer kan deze benoeming aan zich houden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel9
  - number: '9.2'
    text: |-
      Het Presidium kan geen besluiten nemen, indien niet meer dan de helft van zijn leden of hun plaatsvervangers
      aanwezig is; bij staken van stemmen beslist de Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel9
  - number: '9.3'
    text: |-
      Andere leden kunnen door de Voorzitter worden uitgenodigd aan de vergaderingen van het Presidium deel te nemen;
      dezen hebben een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel9
  - number: '9.4'
    text: |-
      Het Presidium stelt een of meer commissies van advies in die, behoudens in zeer spoedeisende gevallen, met
      betrekking tot onderdelen van zijn taak moeten worden gehoord, voordat het ten aanzien van die onderdelen besluiten
      neemt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel9
  - number: '9.5'
    text: Het Presidium wordt bijgestaan door de griffier.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel9
  - number: '10.1'
    text: |-
      Het Presidium maakt jaarlijks de raming van de in het volgende jaar voor de Kamer benodigde uitgaven op en zendt
      deze tijdig aan de Kamer ter vaststelling en aan de betrokken minister.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel10
  - number: '10.2'
    text: |-
      De Griffier is, namens de Voorzitter, belast met het begrotingsbeheer van de Kamer. De bevoegdheden, voortkomend
      uit dit beheer, kunnen geheel of gedeeltelijk worden gemandateerd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel10
  - number: '10.3'
    text: |-
      Bij afzonderlijk op voordracht van het Presidium door de Kamer vast te stellen reglement worden regels gesteld voor
      het toekennen van geldelijke middelen aan fracties en voor het beheer van die middelen door fracties.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel10
  - number: '11.1'
    text: |-
      De leden, die door het centraal stembureau op dezelfde lijst verkozen zijn verklaard, worden bij de aanvang van
      de zitting als één fractie beschouwd. Is onder een lijstnummer slechts één lid verkozen, dan wordt dit lid als een
      afzonderlijke fractie beschouwd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel11
  - number: '11.2'
    text: |-
      Van veranderingen die nadien in de samenstelling van een fractie optreden, doet deze fractie mededeling aan de
      Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel11
  - number: '11.3'
    text: Elke fractie doet van de samenstelling van haar bestuur mededeling aan de Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel11
  - number: '12.1'
    text: |-
      Vindt in een fractie een splitsing plaats die leidt tot de vorming van een of meer nieuwe fracties, dan worden de
      financiële tegemoetkomingen van de daarbij betrokken fracties vastgesteld op de bedragen die worden gevonden door
      de tegemoetkoming, welke aan de ongesplitste fractie zou toekomen, te verdelen naar evenredigheid van de aantallen
      bij de splitsing betrokken leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel12
  - number: '12.2'
    text: |-
      Ontstaat een nieuwe fractie door samenvoeging, dan kan de tegemoetkoming van de nieuwgevormde fractie
      niet groter zijn dan de tegemoetkoming die toekomt aan een fractie van gelijke grootte als bedoeld in
      [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel11
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '11'
        hoofdstuk: V
  - number: '12.3'
    text: |-
      Teneinde voldoening aan verplichtingen die tegenover de medewerkers van de oorspronkelijke fractie bestaan,
      mogelijk te maken, kan het Presidium, in afwijking van het eerste en tweede lid, een tijdelijke regeling treffen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel12
  - number: '13.1'
    text: De Kamer benoemt de Griffier en ontslaat deze.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel13
  - number: '13.2'
    text: |-
      Het Presidium is belast met het uitoefenen van de overige rechtspositionele bevoegdheden ten aanzien van de
      Griffier.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel13
  - number: '13.3'
    text: Het Presidium benoemt de directeuren en de plaatsvervangende griffiers en ontslaat dezen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel13
  - number: '13.4'
    text: |-
      De Griffier is belast met het uitoefenen van de overige rechtspositionele bevoegdheden ten aanzien van de
      directeuren en de plaatsvervangend griffiers.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel13
  - number: '13.5'
    text: De overige ambtenaren worden door de Griffier aangesteld, dan wel ontslagen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel13
  - number: '13.6'
    text: De Griffier kan mandaat verlenen tot het uitoefenen van zijn bevoegdheden ingevolge het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel13
  - number: '14.1'
    text: De Griffier heeft de leiding van de ambtelijke organisatie. Het Presidium oefent hierop toezicht uit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel14
  - number: '14.2'
    text: De Griffier kan mandaat verlenen tot het uitoefenen van zijn bevoegdheden ingevolge het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel14
  - number: '15.1'
    text: De Kamer stelt de commissies in die door de bepalingen van dit reglement worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel15
  - number: '15.2'
    text: |-
      Elke commissie wordt bijgestaan door de griffier of een door de griffier aangewezen plaatsvervangende griffier,
      alsmede door een of meer andere door de griffier aangewezen ambtenaren van de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel15
  - number: '16'
    text: |-
      De Kamer kent een vaste commissie voor ieder ministerie, met uitzondering van het ministerie van Algemene Zaken.
      Tevens kent de Kamer een vaste commissie voor Nederlands-Antilliaanse en Arubaanse Zaken.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel16
  - number: '17.1'
    text: |-
      De Kamer kan algemene commissies instellen voor onderwerpen die van bijzonder belang zijn voor de uitoefening van
      haar taken dan wel vrijwel alle ministeries aangaan.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel17
  - number: '17.2'
    text: Een algemene commissie wordt ingesteld voor de duur van een zitting.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel17
  - number: '17.3'
    text: De Kamer kan ook andere commissies belasten met de behandeling van dergelijke onderwerpen
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel17
  - number: '18.1'
    text: De Kamer kan tijdelijke commissies instellen voor specifieke onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel18
  - number: '18.2'
    text: 'Het instellingsbesluit van een tijdelijke commissie bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel18
  - number: 18.2.a
    text: een nauwkeurige omschrijving van het onderwerp waarover de commissie de Kamer dient te rapporteren;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel18
  - number: 18.2.b
    text: de termijn waarvoor de commissie wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel18
  - number: '18.3'
    text: |-
      De in het tweede lid, onderdeel *b*, bedoelde termijn kan op verzoek van de commissie door de Kamer worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel18
  - number: '19.1'
    text: |-
      Er is een commissie voor het onderzoek van de Geloofsbrieven. Zij brengt de Kamer schriftelijk of mondeling verslag
      uit over de toelating van de leden en, zo nodig, over het verloop van de verkiezingen en de vaststelling van de
      uitslag.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel19
  - number: '19.2'
    text: Het eerste lid is van overeenkomstige toepassing op de tot lid van het Europese Parlement benoemd verklaarden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel19
  - number: '20.1'
    text: |-
      Er is een commissie voor de Verzoekschriften, waarvan de werkwijze bij afzonderlijk door de Kamer vast te stellen
      reglement wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel20
  - number: '20.2'
    text: |-
      Zij is belast met het uitbrengen van verslag over alle door de Kamer of een commissie van de Kamer in haar handen
      gestelde verzoekschriften. Zij is tevens belast met aangelegenheden de Nationale ombudsman betreffende.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel20
  - number: '20.3'
    text: Elk verslag over een verzoekschrift bevat een duidelijke conclusie. Deze verslagen worden gedrukt en rondgedeeld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel20
  - number: '20.4'
    text: |-
      De commissie is bevoegd mondeling of schriftelijk in overleg te treden met de Nationale ombudsman. Zij kan aan de
      Kamer verslag uitbrengen over in haar handen gestelde rapporten van de Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel20
  - number: '20.5'
    text: |-
      De commissie kan aan een vaste of algemene commissie verzoeken haar van advies te dienen of namens haar een
      onderzoek in te stellen en daaromtrent aan haar verslag uit te brengen, waarna zijzelf aan de Kamer verslag
      uitbrengt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel20
  - number: '21'
    text: |-
      Er is een commissie voor de Werkwijze die desgevraagd of eigener beweging de Kamer adviseert over de werkwijze van
      de Kamer en dit reglement.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel21
  - number: 21a.1
    text: |-
      Er is een commissie voor de Rijksuitgaven. Zij is belast met de behandeling van aangelegenheden van rechtmatigheid
      en doelmatigheid van besteding van collectieve middelen, alsmede met de voorlichting, advisering en ondersteuning
      van de Kamer en de commissies bij de uitoefening van het budgetrecht en de financiële controle. Deze voorlichting,
      advisering en ondersteuning strekken zich behalve tot de begrotingsstukken, uit tot door de Kamer aangewezen grote
      projecten en tot de budgettaire en comptabele aspecten van beleidsvoornemens en -beslissingen van de regering.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel21a
  - number: 21a.2
    text: |-
      Rapporten van de Algemene Rekenkamer en regeringsstukken van comptabele aard worden direct in handen van de
      commissie gesteld. Het Presidium kan nader besluiten een dergelijk stuk mede in handen van een andere commissie te
      stellen; [artikel 119, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel119
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '119'
        hoofdstuk: IX
        paragraaf: '4'
  - number: 21a.3
    text: |-
      Over een voorstel aan de Kamer, de Algemene Rekenkamer te verzoeken een onderzoek in te stellen, wordt niet beslist
      dan na advies van de commissie.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel21a
  - number: '22'
    text: Er is een commissie voor de Inlichtingen- en Veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel22
  - number: '23.1'
    text: |-
      Bij afzonderlijk reglement, vast te stellen door de beide kamers der Staten-Generaal, wordt de instelling geregeld
      van een griffie voor de interparlementaire betrekkingen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel23
  - number: '23.2'
    text: |-
      Het toezicht op de griffie voor de interparlementaire betrekkingen wordt uitgeoefend door de bij genoemd reglement
      in te stellen gemengde commissie.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel23
  - number: '24.1'
    text: |-
      Bij afzonderlijk reglement voor de openbaarmaking van het verslag van het verhandelde in de vergaderingen der
      Staten-Generaal, vast te stellen door de beide kamers der Staten-Generaal, wordt de instelling geregeld van de
      Stenografische Dienst der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel24
  - number: '24.2'
    text: |-
      Het toezicht op deze dienst wordt uitgeoefend door de bij genoemd reglement in te stellen gemengde commissie voor
      de stenografische dienst.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel24
  - number: '25.1'
    text: De Voorzitter bepaalt uit hoeveel leden een commissie zal bestaan. De Kamer kan anders besluiten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel25
  - number: '25.2'
    text: De Voorzitter benoemt de leden en, voor zover hij dit wenselijk acht, plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel25
  - number: '25.3'
    text: |-
      Ontheffing van het lidmaatschap of plaatsvervangend lidmaatschap kan op verzoek door de Voorzitter worden verleend.
      In de hierdoor ontstane en in alle andere vacatures voorziet de Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel25
  - number: '25.4'
    text: |-
      De leden en de plaatsvervangende leden van commissies, met uitzondering van die van algemene commissies, worden bij
      de aanvang van elke zitting opnieuw benoemd. Totdat deze benoemingen zijn geschied blijven de in de vorige zitting
      bestaande commissies voortbestaan in de oude samenstelling.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel25
  - number: '26.1'
    text: |-
      De eerste vergadering van een nieuw ingestelde commissie heeft op uitnodiging en onder leiding van de Voorzitter
      plaats. In deze vergadering benoemt de commissie uit haar midden een voorzitter, die met de leiding van de verdere
      werkzaamheden is belast, en een ondervoorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel26
  - number: '26.2'
    text: |-
      Na de in [artikel 25, vierde lid][ref1], bedoelde nieuwe samenstelling van een commissie en bij het tussentijds
      openvallen van het voorzitterschap of het ondervoorzitterschap van een commissie wordt opnieuw in het
      voorzitterschap of het ondervoorzitterschap voorzien in een daartoe bijeengeroepen vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel25
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '25'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '26.3'
    text: De keuze van de voorzitter en van de ondervoorzitter wordt aan de Kamer medegedeeld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel26
  - number: '26.4'
    text: |-
      Bij ontstentenis of verhindering van de voorzitter wordt deze vervangen door de ondervoorzitter of anders door het
      lid dat het langst in de Kamer zitting heeft. Bij gelijke zittingsduur gaat het oudste lid in leeftijd voor.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel26
  - number: '27'
    text: 'Voor een goede vervulling van haar taken is een commissie in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: 27.a
    text: zich tot een minister te wenden ter verkrijging van alle stukken waarvan zij de kennisneming nodig acht;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: 27.b
    text: mondeling of schriftelijk in overleg te treden met een minister;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: 27.c
    text: tot het houden van hoorzittingen;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: 27.d
    text: tot het afleggen van werkbezoeken;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: 27.e
    text: zich te laten voorlichten door colleges van advies;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: 27.f
    text: externe deskundigen in te schakelen;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: 27.g
    text: de Kamer voor te stellen een groot project aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel27
  - number: '28'
    text: 'Een mondeling overleg met een minister kan:'
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel28
  - number: 28.a
    text: betrekking hebben op een in handen van een commissie gesteld voorstel van wet (wetgevingsoverleg);
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel28
  - number: 28.b
    text: betrekking hebben op een ander in handen van een commissie gesteld stuk (nota-overleg);
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel28
  - number: 28.c
    text: gericht zijn op het geregeld van gedachten wisselen over het algemeen beleid (algemeen overleg).
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel28
  - number: '29.1'
    text: |-
      Van het houden van een hoorzitting wordt mededeling gedaan aan de leden van de Kamer in de*Staatscourant* en op
      het internet.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel29
  - number: '29.2'
    text: Wil een commissie rijksambtenaren horen, dan nodigt zij hen door tussenkomst van de desbetreffende minister uit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel29
  - number: '30.1'
    text: |-
      De leden kunnen voorstellen om advies te vragen aan externe adviescolleges als bedoeld in
      [artikel 17 van de Kaderwet adviescolleges][ref1]. Een zodanig voorstel wordt aan een commissie van de Kamer
      gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel17
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '17'
  - number: '30.2'
    text: |-
      De commissie zendt het voorstel met haar advies aan het Presidium. Het Presidium legt het voorstel voorzien van het
      advies van de commissie en zijn eigen advies voor aan de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel30
  - number: '30.3'
    text: De Kamer besluit over het voorstel.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel30
  - number: '31.1'
    text: De commissies kunnen op elk moment voorstellen aan de Kamer doen tot aanwijzing van een groot project.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel31
  - number: '31.2'
    text: |-
      Een besluit van de Kamer tot aanwijzing van een groot project wordt door de Voorzitter onverwijld aan de
      verantwoordelijke minister meegedeeld. Deze mededeling vermeldt tevens welke commissie met de uitvoering wordt
      belast.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel31
  - number: '31.3'
    text: De Kamer stelt een procedureregeling grote projecten vast.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel31
  - number: '32.1'
    text: |-
      Een commissie brengt aan de Kamer verslag uit omtrent de in haar handen gestelde stukken. Deze verslagen bevatten
      zo beknopt mogelijk hetgeen op het stuk betrekking heeft. De commissie is bevoegd datgene weg te laten, wat zij
      niet ter zake acht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel32
  - number: '32.2'
    text: |-
      De Kamer kan besluiten dat een commissie over in haar handen gestelde stukken, die naar het oordeel van de
      commissie niet in het openbaar kunnen worden behandeld, geen verslag hoeft uit te brengen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel32
  - number: '32.3'
    text: Een commissie brengt in ieder geval verslag uit van door haar gevoerd openbaar mondeling overleg met een minister.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel32
  - number: '32.4'
    text: Alle door een commissie uit te brengen verslagen worden opgesteld onder verantwoordelijkheid van de griffier.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel32
  - number: '33.1'
    text: |-
      De commissie komt op door haar zelf te bepalen tijdstippen bijeen. Heeft zij hieromtrent geen besluit genomen, dan
      bepaalt haar voorzitter deze tijdstippen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel33
  - number: '33.2'
    text: |-
      De voorzitter roept haar in ieder geval binnen een redelijke tijd bijeen zo dikwijls hetzij de regering, hetzij een
      vierde van haar leden onder opgave van redenen de wens daartoe te kennen geeft.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel33
  - number: '34.1'
    text: Leden en plaatsvervangende leden van een commissie hebben toegang tot al haar vergaderingen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel34
  - number: '34.2'
    text: |-
      Tot een wetgevingsoverleg en een nota-overleg waarin moties kunnen worden ingediend, hebben alle leden van de Kamer
      toegang. Zij hebben het recht aan de beraadslaging deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel34
  - number: '34.3'
    text: |-
      Een commissie kan een of meer leden van de Kamer, die lid noch plaatsvervangend lid van de commissie zijn, op hun
      verzoek toestemming verlenen een andere commissievergadering dan bedoeld in het tweede lid bij te wonen; in dat
      geval is het betreffende lid bevoegd aan de beraadslaging deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel34
  - number: '35.1'
    text: |-
      De voorzitter van een commissievergadering heeft dezelfde bevoegdheden als aan de voorzitter van een vergadering
      van de Kamer toekomen, met dien verstande dat een uitsluiting ingevolge [artikel 60][ref1] slechts geldt voor de
      openbare vergaderingen van die commissie gedurende de dag waarop de uitsluiting plaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel60
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '60'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '35.2'
    text: |-
      Een gezamenlijke vergadering van twee of meer commissies wordt voorgezeten door de commissievoorzitter, die het
      langst in de Kamer zitting heeft. Bij gelijke zittingsduur gaat het oudste lid in leeftijd voor.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel35
  - number: '36.1'
    text: |-
      Besluiten worden alleen door de leden van de commissie genomen, met dien verstande dat bij ontstentenis of
      afwezigheid van een lid zijn plaatsvervanger zijn bevoegdheden uitoefent.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel36
  - number: '36.2'
    text: |-
      Besluiten in een gezamenlijke vergadering van twee of meer commissies worden door elk van de commissies
      afzonderlijk genomen. Indien de besluiten niet gelijkluidend zijn beslist zo nodig de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel36
  - number: '36.3'
    text: |-
      De commissie voor de Verzoekschriften kan geen besluit nemen, indien niet meer dan de helft van haar leden of hun
      plaatsvervangers aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel36
  - number: '37.1'
    text: |-
      De vergaderingen van commissies zijn openbaar. De Kamer kan besluiten dat vergaderingen van een bepaalde commissie
      besloten mogen zijn.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel37
  - number: '37.2'
    text: Een commissie kan besluiten dat haar procedurevergaderingen besloten zullen zijn.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel37
  - number: '37.3'
    text: |-
      Een commissie kan besluiten een besloten vergadering te houden op voorstel van een lid van de commissie of een
      minister. Wordt het voorstel gedaan tijdens een openbare vergadering, dan worden de deuren gesloten tot over het
      voorstel is beslist.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel37
  - number: '38.1'
    text: |-
      Ten aanzien van de inhoud van vertrouwelijke stukken en de gedachtenwisseling in een besloten commissievergadering
      wordt geheimhouding in acht genomen, met uitzondering van hetgeen de commissie in haar verslag vermeldt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel38
  - number: '38.2'
    text: |-
      De commissie kan toestaan dat de leden en de ministers bekend maken wat zij zelf in de besloten vergadering hebben
      medegedeeld, mits daardoor de vertrouwelijkheid van door anderen gedane mededelingen niet wordt geschonden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel38
  - number: '38.3'
    text: |-
      Het Presidium kan de Kamer voorstellen een lid dat de vertrouwelijkheid van een commissievergadering of van een
      document heeft geschonden, voor ten hoogste een maand uit te sluiten van alle commissievergaderingen van een of
      meer commissies en/of van de toezending van vertrouwelijke stukken.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel38
  - number: '38.4'
    text: |-
      Het voorstel kan niet worden gedaan dan nadat het uit te sluiten lid en de voorzitter van de commissievergadering,
      waarvan de vertrouwelijkheid is geschonden, zijn gehoord, althans behoorlijk opgeroepen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel38
  - number: '38.5'
    text: |-
      Het voorstel wordt in stemming gebracht bij de aanvang van de eerste vergadering na de dag, waarop het Presidium
      tot het doen van het voorstel heeft besloten. Over dit voorstel wordt niet beraadslaagd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel38
  - number: '38.6'
    text: |-
      Een beslissing tot uitsluiting wordt door de Voorzitter onverwijld schriftelijk ter kennis gebracht van de leden
      van de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel38
  - number: '39.1'
    text: |-
      Voor het houden van een wetgevingsoverleg heeft een commissie toestemming van de Kamer nodig. De Kamer besluit op
      voorstel van het Presidium dat hieromtrent de commissie hoort.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel39
  - number: '39.2'
    text: Van een wetgevingsoverleg wordt een stenografisch verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel39
  - number: '40.1'
    text: Een commissie kan over een in haar handen gesteld stuk een nota-overleg houden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel40
  - number: '40.2'
    text: Van een nota-overleg wordt een beknopt verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel40
  - number: '40.3'
    text: |-
      De commissie kan de Kamer verzoeken dat van een nota-overleg een stenografisch verslag wordt gemaakt. De Kamer
      besluit op voorstel van het Presidium dat hieromtrent de commissie hoort.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel40
  - number: '41.1'
    text: |-
      Een commissie kan over zaken die betrekking hebben op het haar betreffende beleidsterrein een algemeen overleg
      houden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel41
  - number: '41.2'
    text: Van een algemeen overleg wordt een beknopt verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel41
  - number: '42'
    text: |-
      In een mondeling overleg kunnen met instemming van de desbetreffende minister inlichtingen worden verschaft door
      daartoe door de minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel42
  - number: '43.1'
    text: |-
      Tijdens een wetgevingsoverleg en een nota-overleg waarvan een stenografisch verslag wordt gemaakt, kan ieder lid
      van de Kamer dat het woord voert moties over het in behandeling zijnde onderwerp voorstellen. [Artikel 66][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel66
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '66'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '43.2'
    text: |-
      Moties die in een wetgevingsoverleg en een nota-overleg zijn voorgesteld komen in de Kamer in stemming nadat het
      verslag van het overleg is verschenen. De Kamer kan anders besluiten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel43
  - number: '44'
    text: |-
      Indien van een nota-overleg een stenografisch verslag is gemaakt, wordt de beraadslaging over het in dit overleg
      behandelde stuk alleen geopend, indien een lid een eerder ingediende motie wenst te wijzigen of in te trekken,
      dan wel een nieuwe motie wenst voor te stellen. De beraadslaging betreft dan uitsluitend de gewijzigde of nieuw
      voorgestelde motie. De Kamer kan anders besluiten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel44
  - number: 44a.1
    text: |-
      De beraadslaging over een verslag van een nota-overleg waarvan een beknopt verslag is gemaakt of over een verslag
      van een algemeen overleg wordt alleen geopend indien een lid naar aanleiding van dat overleg een motie wenst in
      te dienen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel44a
  - number: 44a.2
    text: |-
      In afwijking van [artikel 63, eerste lid][ref1], voert elk lid slechts eenmaal het woord.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel63
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '63'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 44a.3
    text: |-
      In afwijking van [artikel 64, tweede lid][ref1], stelt de Kamer een gelijke maximumspreektijd per fractie vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel64
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '64'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '45.1'
    text: |-
      De dagen en uren waarop een wetgevingsoverleg of een nota-overleg waarvan een stenografisch verslag wordt gemaakt,
      zal worden gehouden, worden door de Voorzitter vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel45
  - number: '45.2'
    text: |-
      Er worden niet meer dan twee overleggen als bedoeld in het eerste lid tegelijk gehouden. Op tijdstippen waarop een
      vergadering van de Kamer wordt gehouden, kan slechts één overleg als bedoeld in het eerste lid worden gehouden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel45
  - number: '46.1'
    text: |-
      De Voorzitter roept de vergadering bijeen zo dikwijls hij dit nodig oordeelt, of dit door vijftien leden
      schriftelijk, onder opgave van de redenen, is verzocht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel46
  - number: '46.2'
    text: |-
      Indien het Presidium algemene richtlijnen heeft vastgesteld voor de dagen en uren waarop de Kamer doorgaans zal
      bijeenkomen houdt de Voorzitter daarmee zoveel mogelijk rekening.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel46
  - number: '46.3'
    text: |-
      De Kamer kan ook zelf besluiten op welke dag en welk uur zij weer bijeen zal komen, doch de Voorzitter blijft dan
      vrij in geval van onvoorziene omstandigheden de Kamer tegen een eerder of later tijdstip bijeen te roepen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel46
  - number: '46.4'
    text: |-
      Voor elke vergadering worden de leden tijdig schriftelijk opgeroepen. Is dit niet mogelijk, dan kan de oproeping op
      andere wijze plaatsvinden. De oproeping vermeldt de te behandelen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel46
  - number: '47.1'
    text: |-
      De Voorzitter kan de vergadering schorsen of sluiten, indien hij dit met het oog op de loop van werkzaamheden of
      ter handhaving van de orde wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel47
  - number: '47.2'
    text: Tot het voortzetten van de vergadering na 23.00 uur wordt een besluit van de Kamer vereist.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel47
  - number: '48'
    text: |-
      Ieder aanwezig lid tekent voor het begin van de vergadering de presentielijst. De lijst blijft op de tafel van de
      griffier liggen voor ondertekening door later komende leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel48
  - number: '49'
    text: |-
      De Voorzitter opent de vergadering indien op het uur van bijeenroeping de presentielijst door meer dan de helft van
      het aantal zitting hebbende leden is getekend.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel49
  - number: '50.1'
    text: |-
      Indien op of kort na het uur van bijeenroeping het vereiste aantal leden niet tegenwoordig is, opent de Voorzitter
      de bijeenkomst en doet hij namen van de afwezige leden oplezen. Hij kan kennis geven van ingekomen stukken. Daarna
      stelt hij de vergadering tot een later tijdstip uit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel50
  - number: '50.2'
    text: |-
      De namen van zowel de aanwezige als de afwezige leden worden in het officieel verslag van de Handelingen van de
      Kamer opgenomen; voor wat betreft de afwezige leden onder vermelding van de opgegeven redenen van verhindering.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel50
  - number: '51.1'
    text: |-
      Elk lid heeft een voor hem bestemde zitplaats in de vergaderzaal. Het Presidium wijst deze zitplaats aan. Het
      Presidium kan ook aan een fractie een bepaalde groep zitplaatsen aanwijzen en de verdeling daarvan aan de fractie
      overlaten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel51
  - number: '51.2'
    text: Indien de Voorzitter het verzoekt nemen de leden hun zitplaatsen in.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel51
  - number: '51.3'
    text: |-
      Het Presidium zorgt dat voor de bijzondere gedelegeerden van de Staten van de Nederlandse Antillen
      onderscheidenlijk van Aruba zitplaatsen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel51
  - number: '51.4'
    text: |-
      Het Presidium zorgt verder dat voor de ministers en personen die zij hebben aangewezen om zich in de vergadering te
      doen bijstaan, zitplaatsen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel51
  - number: '51.5'
    text: Het Presidium kan zitplaatsen toekennen aan andere personen die door de Kamer zijn uitgenodigd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel51
  - number: '52'
    text: |-
      Ieder lid spreekt staande, tenzij de Voorzitter hem verlof geeft zittende te spreken, en van de spreekplaats,
      tenzij de Voorzitter toestaat, dat hij van een andere plaats spreekt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel52
  - number: '53.1'
    text: |-
      Alle sedert de laatste vergadering ingekomen stukken worden opgenomen in een lijst die gedurende de vergadering
      op de tafel van de griffier ter inzage ligt. In deze lijst doet de Voorzitter voorstellen over de wijze van
      behandeling daarvan. De voorstellen zijn aan het einde van de vergadering aangenomen tenzij voordien door een lid
      bezwaar is gemaakt tegen een voorstel; in dat geval wordt over het betreffende voorstel door de Kamer beslist. De
      lijst en de voorstellen worden in het officieel verslag opgenomen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel53
  - number: '53.2'
    text: |-
      De Voorzitter blijft bevoegd van die stukken welke hij daartoe belangrijk genoeg acht, in de vergadering mededeling
      te doen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel53
  - number: '53.3'
    text: De Voorzitter kan ongetekende, onbegrijpelijke en beledigende stukken zonder nadere mededeling terzijde leggen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel53
  - number: '54.1'
    text: De Kamer regelt haar werkzaamheden hetzij op voorstel van de Voorzitter, hetzij op dat van een lid.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel54
  - number: '54.2'
    text: |-
      Regeling van werkzaamheden vindt in het algemeen plaats bij de aanvang van de vergadering; de Voorzitter kan
      weigeren op andere tijdstippen een regeling van werkzaamheden aan de orde te stellen. Indien de Voorzitter
      voornemens is voorstellen tot regeling van werkzaamheden te doen, doet hij dit op de oproeping voor de vergadering
      vermelden, tenzij daartoe in verband met de vereiste spoed geen gelegenheid heeft bestaan.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel54
  - number: '55.1'
    text: |-
      Geen lid voert het woord dan na het aan de Voorzitter gevraagd en van hem verkregen te hebben. De Voorzitter
      verleent het woord in de volgorde, waarin het is gevraagd, tenzij de Kamer anders besluit. De leden kunnen zich
      als spreker op de daartoe bestemde sprekerslijst laten inschrijven zodra de Voorzitter heeft medegedeeld voornemens
      te zijn het onderwerp aan de orde te stellen, dan wel de Kamer, al dan niet onder voorbehoud, heeft besloten het
      onderwerp aan de orde te stellen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel55
  - number: '55.2'
    text: |-
      Indien ministers, personen die zij hebben aangewezen om zich in de vergadering te doen bijstaan, de Gevolmachtigde
      Ministers of de bijzondere gedelegeerden het woord verlangen, verleent de Voorzitter dit niet dan nadat de spreker
      die aan het woord is zijn rede heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel55
  - number: '55.3'
    text: |-
      Indien de Voorzitter het woord wil voeren over het onderwerp dat aan de orde is, tenzij dit nodig is voor de
      uitvoering van de hem opgedragen taak, verlaat hij de voorzittersstoel. Hij neemt die niet weer in zolang het
      onderwerp aan de orde is.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel55
  - number: '56.1'
    text: |-
      De volgorde van de sprekers kan worden verbroken, wanneer een lid het woord vraagt over een persoonlijk feit of
      over de orde.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel56
  - number: '56.2'
    text: |-
      De Voorzitter verleent het woord voor een persoonlijk feit niet dan na een voorlopige aanduiding van dat feit. De
      beslissing of iets een persoonlijk feit vormt berust bij de Voorzitter.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel56
  - number: '56.3'
    text: Een voorstel van orde kan worden gedaan hetzij door de Voorzitter, hetzij door een lid.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel56
  - number: '57.1'
    text: |-
      De spreker mag in zijn rede niet worden gestoord, tenzij de Voorzitter hem aan het opvolgen van dit Reglement moet
      herinneren, of hem wil verzoeken de nodige beknoptheid in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel57
  - number: '57.2'
    text: De Voorzitter kan interrupties toelaten die via de daartoe bestemde microfoons worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel57
  - number: '58.1'
    text: |-
      Indien een spreker van het onderwerp in beraadslaging afwijkt, roept de Voorzitter hem tot de behandeling van het
      onderwerp terug.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel58
  - number: '58.2'
    text: |-
      Indien een lid of een minister beledigende uitdrukkingen gebruikt, de orde verstoort, zijn plicht tot geheimhouding
      schendt of instemming betuigt met dan wel aanspoort tot onwettige handelingen, wordt hij door de Voorzitter
      vermaand en in de gelegenheid gesteld de woorden die tot de waarschuwing aanleiding hebben gegeven, terug te nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel58
  - number: '59.1'
    text: |-
      Wanneer een spreker van de gelegenheid, bedoeld in [artikel 58, tweede lid][ref1], geen gebruik maakt dan wel
      voortgaat van het onderwerp af te wijken, beledigende uitdrukkingen te gebruiken, de orde te verstoren, zijn plicht
      tot geheimhouding te schenden of instemming te betuigen met dan wel aan te sporen tot onwettige handelingen, kan de
      Voorzitter hem het woord ontnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel58
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '58'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '59.2'
    text: |-
      In de vergadering waarin een lid het woord is ontnomen, mag dat lid niet meer aan de beraadslaging over het in
      behandeling zijnde onderwerp deelnemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel59
  - number: '60'
    text: |-
      De Voorzitter kan een spreker op wie [artikel 59][ref1] is toegepast en ieder ander lid dat zich schuldig maakt
      aan gedragingen als in dat artikel zijn bedoeld, uitsluiten van de verdere bijwoning van de vergadering op de dag
      waarop de uitsluiting plaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel59
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '59'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '62'
    text: |-
      Van de beslissingen ingevolge de [artikelen 58 tot en met 61][ref1] door de Voorzitter genomen, is beroep op de
      Kamer niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel58
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '58'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '63.1'
    text: |-
      Geen lid voert meer dan twee maal en evenmin na afloop van de tweede termijn het woord over hetzelfde onderwerp,
      tenzij de Kamer hem hiertoe verlof geeft.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel63
  - number: '63.2'
    text: |-
      Bij de bepaling, hoeveel maal een lid over hetzelfde onderwerp heeft gesproken, wordt niet meegerekend het spreken
      over een persoonlijk feit of over een voorstel van orde.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel63
  - number: '64.1'
    text: |-
      Op voorstel van de Voorzitter of van een in de vergaderzaal aanwezig lid kan de Kamer voor de aanvang of in de loop
      van de beraadslaging over een onderwerp regels stellen ten aanzien van de duur van de redevoeringen van de leden.
      Daarbij kan tevens worden bepaald, dat elk lid slechts eenmaal het woord zal mogen voeren.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel64
  - number: '64.2'
    text: |-
      De Kamer kan ook, bij voorkeur met inachtneming van de omvang van de fracties, een maximumspreektijd voor elke
      fractie vaststellen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel64
  - number: '65'
    text: |-
      Zodra de voor de redevoeringen of de stemverklaringen gestelde maximumduur is verstreken, verzoekt de Voorzitter de
      spreker met spreken op te houden. Deze geeft terstond aan dit verzoek gevolg.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel65
  - number: '66.1'
    text: |-
      Een lid dat het woord voert kan daarbij moties over het in behandeling zijnde onderwerp indienen. Zulk een motie
      moet kort en duidelijk geformuleerd, op schrift gebracht en door de voorsteller ondertekend zijn; zij kan alleen in
      behandeling komen indien zij door ten minste vier andere leden wordt mede ondertekend of ondersteund.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel66
  - number: '66.2'
    text: |-
      Tenzij de Kamer hiertoe verlof geeft, wordt een motie niet gedurende de eerste termijn ingediend. Indiening in
      eerste termijn is in elk geval mogelijk, indien de beraadslaging betreft een verslag van een mondeling overleg.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel66
  - number: '66.3'
    text: De tekst van een motie wordt door de indiener voorgelezen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel66
  - number: '66.4'
    text: |-
      De behandeling van moties vindt plaats tegelijk met de beraadslaging over het in behandeling zijnde onderwerp,
      tenzij de Kamer besluit haar later te doen geschieden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel66
  - number: '67.1'
    text: Wanneer niemand meer het woord verlangt, sluit de Voorzitter de beraadslaging.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel67
  - number: '67.2'
    text: |-
      Wanneer de Voorzitter van oordeel is, dat het onderwerp van verschillende zijden voldoende is belicht, kan hij in
      afwijking van het eerste lid aan de Kamer voorstellen de beraadslaging van de zijde van de Kamer eerder te sluiten.
      Over dit voorstel wordt niet beraadslaagd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel67
  - number: '67.3'
    text: |-
      De sluiting van de beraadslaging van de zijde van de Kamer kan op dezelfde grond ook worden voorgesteld door een in
      de vergaderzaal aanwezig lid. Het voorstel mag niet worden toegelicht en er wordt niet over beraadslaagd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel67
  - number: '68'
    text: |-
      Op voorstel van de Voorzitter of van een in de vergaderzaal aanwezig lid kan de Kamer ook besluiten, dat de
      beraadslaging van de zijde van de Kamer over een onderwerp op een in dat voorstel te vermelden tijdstip zal worden
      gesloten. Over dit voorstel wordt niet beraadslaagd. Wordt het aangenomen, dan heeft de Voorzitter de bevoegdheid
      de nog beschikbare tijd naar billijkheid te verdelen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel68
  - number: '69.1'
    text: Nadat de beraadslaging is gesloten, gaat de Kamer zo nodig over tot het nemen van een besluit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel69
  - number: '69.2'
    text: |-
      De stemming over moties kan worden aangehouden; heeft zij niet plaats gevonden in de eerste vergadering twee
      maanden na het besluit tot aanhouden - recessen niet meegerekend - dan wordt de motie geacht te zijn vervallen. De
      Kamer kan anders besluiten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel69
  - number: '69.3'
    text: Stemming geschiedt door handopsteken.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel69
  - number: '69.4'
    text: |-
      Een stemming kan achterwege blijven indien geen van de leden daarom vraagt. In dat geval stelt de Voorzitter voor
      het besluit zonder stemming te nemen. Evenwel kunnen in de vergaderzaal aanwezige leden aantekening vragen, dat zij
      geacht willen worden te hebben tegengestemd; in dat geval wordt het besluit geacht met de stemmen van de overige
      leden te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel69
  - number: '70.1'
    text: |-
      In afwijking van [artikel 69, derde lid][ref1], vindt hoofdelijke stemming plaats indien een lid daarom vraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel69
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '69'
        hoofdstuk: VIII
        paragraaf: '4'
  - number: '70.2'
    text: |-
      Hoofdelijke stemming vindt eveneens plaats, wanneer naar het oordeel van een lid de stemverhouding bij een stemming
      bij handopsteken niet duidelijk is; tot zulk een hoofdelijke stemming kan niet worden overgegaan, wanneer de
      uitslag van de stemming bij handopsteken is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel70
  - number: '70.3'
    text: |-
      Voor de hoofdelijke stemming wordt door het lot beslist, bij welk nummer van de presentielijst zij een aanvang
      zal nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel70
  - number: '70.4'
    text: Bij hoofdelijke stemming brengt ieder lid mondeling zijn stem uit met het woord "voor" of het woord "tegen".
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel70
  - number: '70.5'
    text: |-
      Indien bij hoofdelijke stemming blijkt, dat het voor de opening van de vergadering vereiste aantal leden niet meer
      aanwezig is, kan de Voorzitter hetzij de vergadering voor enige tijd schorsen en haar indien bij heropening weer
      voldoende leden aanwezig blijken te zijn voortzetten, hetzij de vergadering sluiten en tegen een later tijdstip een
      nieuwe vergadering bijeenroepen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel70
  - number: '71'
    text: |-
      Heeft een lid zich bij het uitbrengen van zijn stem vergist, dan kan hij deze vergissing herstellen voordat het
      volgende lid heeft gestemd. Bemerkt hij zijn vergissing eerst later, dan kan hij na afloop van de stemming wel
      aantekening vragen, dat hij zich heeft vergist; in de uitslag van de stemming brengt dit echter geen verandering.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel71
  - number: '72.1'
    text: Bij staken van stemmen is, indien de vergadering voltallig is, het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel72
  - number: '72.2'
    text: |-
      Is de vergadering niet voltallig, dan wordt het nemen van het besluit tot een volgende vergadering uitgesteld.
      Staken de stemmen opnieuw, dan is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel72
  - number: '73.1'
    text: Na de stemming kunnen stemverklaringen worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel73
  - number: '73.2'
    text: |-
      De Voorzitter kan toelaten, dat stemverklaringen worden afgelegd na de sluiting der beraadslaging, doch dan
      onmiddellijk voorafgaande aan de stemming. In dat geval kan na een afgelegde stemverklaring de beraadslaging niet
      worden heropend.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel73
  - number: '73.3'
    text: Een stemverklaring mag niet langer duren dan twee minuten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel73
  - number: '74'
    text: |-
      Stemming over personen voor benoemingen, voordrachten of keuzen geschiedt met stembriefjes, welke in een bus
      worden geworpen. Bij zulk een stemming benoemt de Voorzitter vier leden tot stemopnemers. Nadat de eerstbenoemde
      stemopnemer het getal van de in de bus gevonden stembriefjes en de Voorzitter dat van de aanwezige leden hebben
      opgegeven, maakt de eerstbenoemde stemopnemer de uitslag bekend.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel74
  - number: '75'
    text: |-
      Voor iedere kandidaat afzonderlijk wordt een stembriefje ingevuld, dat een duidelijke aanwijzing van de persoon
      moet bevatten. In geval van twijfel beslist de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel75
  - number: '76'
    text: |-
      Indien het getal van de in de bus gevonden stembriefjes minder bedraagt dan het voor de opening van de vergadering
      vereiste aantal leden dan is [artikel 70, vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel70
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '70'
        hoofdstuk: VIII
        paragraaf: '4'
  - number: '77'
    text: Niet of niet behoorlijk ingevulde stembriefjes tellen voor de bepaling van de meerderheid niet mee.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel77
  - number: '78'
    text: 'De stemming is nietig:'
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel78
  - number: 78.a
    text: |-
      indien het getal van de in de bus gevonden stembriefjes groter is dan dat van de leden die de presentielijst hebben
      getekend en dit verschil van invloed heeft kunnen zijn op de uitslag;
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel78
  - number: 78.b
    text: |-
      indien het getal van de behoorlijk ingevulde stembriefjes minder bedraagt dan het voor de opening van de
      vergadering vereiste aantal leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel78
  - number: '79'
    text: |-
      De eerste stemming is vrij. Wanneer niemand bij deze eerste stemming de volstrekte meerderheid behaalt, vindt een
      tweede, eveneens vrije stemming plaats.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel79
  - number: '80'
    text: |-
      Indien ook bij de tweede stemming niemand de volstrekte meerderheid verkrijgt, heeft een derde stemming plaats, nu
      tussen de vier personen, die bij de tweede stemming de meeste stemmen op zich hebben verenigd. Zijn bij de tweede
      stemming slechts op drie of vier personen stemmen uitgebracht, dan vindt de derde stemming plaats tussen de twee
      personen, op wie het hoogste aantal stemmen is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel80
  - number: '81'
    text: |-
      Wanneer ook bij de derde stemming geen volstrekte meerderheid wordt verkregen, heeft een vierde stemming plaats
      tussen de twee personen, die bij de derde stemming de meeste stemmen op zich hebben verenigd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel81
  - number: '82'
    text: |-
      Indien bij de tweede of derde stemming niet is uitgemaakt tussen wie moet worden overgestemd, heeft er nog een
      tussenstemming plaats om hierover te beslissen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel82
  - number: '83.1'
    text: Indien bij een tussenstemming of bij een stemming tussen twee personen de stemmen staken, beslist het lot.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel83
  - number: '83.2'
    text: |-
      Om deze beslissing tot stand te brengen worden de vereiste naambriefjes, behoorlijk toegevouwen, door een der
      stemopnemers in de bus geworpen en door een andere stemopnemer een voor een uitgetrokken en voorgelezen. De
      persoon, op het eerstuitgetrokken naambriefje vermeld, is de gekozene.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel83
  - number: '84'
    text: |-
      Betreft het benoemingen, voordrachten of keuzen, die niet in de [Grondwet][ref1] zijn vermeld, dan kan de Kamer in
      een bijzonder geval daarvoor andere regels doen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '85'
    text: |-
      De keuze van personen door de commissies vindt op dezelfde wijze plaats als die door de Kamer, met dien verstande,
      dat bij de derde stemming de keuze gaat tussen de twee personen, die bij de tweede stemming de meeste stemmen
      hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel85
  - number: '86'
    text: |-
      De Voorzitter draagt zorg, dat de voordrachten van personen van wie de benoeming geschiedt bij koninklijk besluit
      mondeling of schriftelijk aan de Koning worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel86
  - number: '87.1'
    text: |-
      De griffier draagt zorg dat van elke vergadering en van elke bijeenkomst bedoeld in [artikel 50][ref1] een
      stenografisch verslag (Handelingen) van de gehouden beraadslaging wordt gemaakt. Op dit verslag is het in
      [artikel 24, eerste lid][ref2], bedoelde reglement van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006023#Artikel24
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '50'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006023
        artikel: '24'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '87.2'
    text: |-
      De griffier draagt zorg, dat van elke vergadering en van elke bijeenkomst bedoeld in [artikel 50][ref1] een
      officieel verslag wordt gemaakt. Dit verslag behelst in elk geval de namen van de leden die tegenwoordig waren en
      van hen die zich bij de stemmingen voor of tegen verklaarden, een beknopte opgave van de inhoud van alle ingekomen
      stukken, en alle door de Kamer of door de Voorzitter genomen besluiten. Het officieel verslag wordt vastgesteld
      door de Voorzitter en de griffier, ten bewijze daarvan door hen ondertekend, en in het Centraal Archief van de
      Tweede Kamer bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel50
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '50'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '87.3'
    text: |-
      Indien ministers of de personen die hen in de vergadering bijstaan, gedurende de openbare beraadslaging gestelde
      vragen voor de sluiting van de beraadslaging deels schriftelijk, deels mondeling beantwoorden, worden de
      schriftelijke antwoorden opgenomen in een bijlage bij het verslag van de vergadering, waarin de overige vragen
      mondeling werden beantwoord.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel87
  - number: '88.1'
    text: De Kamer, met gesloten deuren vergaderend, kan omtrent het aldaar behandelde geheimhouding opleggen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel88
  - number: '88.2'
    text: |-
      De geheimhouding wordt door alle leden, ook door hen die later van het verhandelde kennis hebben genomen, bewaard.
      Zij kan door de Kamer, met gesloten deuren vergaderend, worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel88
  - number: '89.1'
    text: |-
      De Kamer kan besluiten, dat in een vergadering met gesloten deuren stenografen aanwezig mogen zijn. In dat geval
      wordt van het verhandelde overeenkomstig de daarvoor geldende regels een stenografisch verslag gemaakt, dat echter,
      tenzij de Kamer dadelijk of later anders besluit, niet wordt gedrukt, doch in het Centraal Archief van de Tweede
      Kamer achter slot wordt bewaard, tenzij de Kamer anders besluit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel89
  - number: '89.2'
    text: |-
      Heeft de Kamer niet besloten, dat stenografen aanwezig mogen zijn, dan maakt de griffier notulen. Deze worden
      dadelijk of in een volgende vergadering met gesloten deuren gelezen en aan goedkeuring onderworpen. Behalve hetgeen
      in [artikel 87, tweede lid, tweede volzin][ref1], is vermeld, behelzen deze notulen een beknopt verslag van de
      beraadslagingen. Zij worden in het Centraal Archief van de Tweede Kamer achter slot bewaard, tenzij de Kamer anders
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel87
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '87'
        hoofdstuk: VIII
        paragraaf: '6'
  - number: '90.1'
    text: Voorstellen van wet worden door het Presidium in handen van een commissie gesteld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel90
  - number: '90.2'
    text: |-
      Het besluit wordt zo spoedig mogelijk schriftelijk ter kennis van de leden gebracht. Is het besluit niet met
      eenparigheid van stemmen genomen, dan wordt daaraan geen uitvoering gegeven voordat daarvan mededeling is gedaan in
      een openbare vergadering van de Kamer. Bij die mededeling kan de Kamer anders besluiten. Een voorstel hiertoe kan
      door ieder lid worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel90
  - number: '91'
    text: |-
      De Kamer kan, op voorstel van het Presidium, de commissie gehoord, besluiten dat de beraadslaging in het algemeen
      over een voorstel van wet zal geschieden voordat met het onderzoek door de commissie een aanvang wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel91
  - number: '92.1'
    text: |-
      Voordat met het onderzoek door de commissie een aanvang is gemaakt, adviseert de griffier van de commissie over de
      vraag of het wenselijk is dat over dat voorstel een wetgevingsrapport wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel92
  - number: '92.2'
    text: Een wetgevingsrapport wordt opgesteld door de griffier van de commissie.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel92
  - number: '93.1'
    text: |-
      De leden van de Kamer zijn bevoegd binnen een door de commissie te bepalen termijn schriftelijk hun opmerkingen
      omtrent een voorstel van wet aan haar in te zenden. Van de gestelde termijn wordt mededeling gedaan aan de leden
      van de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel93
  - number: '93.2'
    text: |-
      De commissie stelt de in het eerste lid bedoelde termijn vast binnen veertien dagen nadat het voorstel van wet in
      haar handen is gesteld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel93
  - number: '93.3'
    text: |-
      De commissie kan besluiten dat de opmerkingen van de leden van de Kamer, behalve langs de in het eerste
      lid voorziene schriftelijke weg, zullen worden ingebracht in een voor alle leden van de Kamer toegankelijke
      vergadering. In een in de eerste volzin bedoelde vergadering is elk lid van de Kamer bevoegd aan de beraadslaging
      deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel93
  - number: '94.1'
    text: |-
      De commissie brengt een verslag uit waaruit blijkt dat zij de behandeling in een openbare vergadering van de Kamer,
      al dan niet onder voorbehoud, voldoende voorbereid acht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel94
  - number: '94.2'
    text: |-
      Een verslag wordt dadelijk gedrukt, aan de leden rondgedeeld en aan de regering toegezonden. Bijlagen bij verslagen
      worden eveneens gedrukt en rondgedeeld, tenzij de commissie bepaalt, dat ze ter inzage zullen worden gelegd. Zijn
      de bijlagen van vertrouwelijke aard, dan worden ze ter vertrouwelijke inzage van de leden gelegd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel94
  - number: '94.3'
    text: |-
      Na ontvangst van de nota naar aanleiding van het verslag kan de commissie besluiten een nader verslag uit te
      brengen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel94
  - number: '95.1'
    text: |-
      Nadat een voorstel van wet in handen van een commissie is gesteld, kan het Presidium een termijn vaststellen
      waarbinnen die commissie haar verslag vaststelt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel95
  - number: '95.2'
    text: |-
      Indien de commissie binnen de bepaalde tijd niet gereed kan zijn, vraagt zij verlenging van de termijn. Hierover
      wordt door het Presidium beslist. Deze beslissing wordt zo spoedig mogelijk schriftelijk ter kennis van de leden
      van de Kamer gebracht. Tevens wordt daarvan mededeling gedaan in een openbare vergadering van de Kamer. Is de
      beslissing niet met eenparigheid van stemmen genomen, dan kan bij die mededeling de Kamer anders besluiten.
      Een voorstel hiertoe kan door ieder lid worden gedaan. Is een termijn eenmaal door het Presidium verlengd, dan
      kan een verdere verlenging alleen door de Kamer worden toegestaan, tenzij de Kamer tot nadere bijeenroeping is
      uiteengegaan, in welk geval het Presidium een verdere verlenging kan toestaan.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel95
  - number: '95.3'
    text: |-
      Mocht de commissie in gebreke zijn gebleven binnen de daarvoor gestelde termijn verslag uit te brengen, dan kan de
      Kamer de beraadslaging openen zonder dat een verslag is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel95
  - number: '96.1'
    text: |-
      Vanaf het tijdstip dat een voorstel van wet in handen van een commissie is gesteld staat het ieder lid vrij
      amendementen, voorzien van een beknopte toelichting, in te dienen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel96
  - number: '96.2'
    text: Een amendement wordt met de meeste spoed vermenigvuldigd en rondgedeeld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel96
  - number: '97.1'
    text: |-
      Een amendement is ontoelaatbaar, indien het een strekking heeft, tegengesteld aan die van het voorstel van wet, of
      indien er tussen de materie van het amendement en die van het voorstel geen rechtstreeks verband bestaat.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel97
  - number: '97.2'
    text: |-
      Een amendement wordt geacht toelaatbaar te zijn zolang de Kamer het niet ontoelaatbaar heeft verklaard. Een daartoe
      strekkend voorstel kan, zo nodig met onderbreking van de orde, worden gedaan hetzij door de Voorzitter, hetzij door
      een van de leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel97
  - number: '98'
    text: |-
      De eerste ondertekenaar is bevoegd in het amendement veranderingen aan te brengen. De eerste ondertekenaar is ook
      bevoegd het amendement in te trekken, doch indien de beraadslaging gesloten is alleen met toestemming van de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel98
  - number: '99'
    text: |-
      De regels die voor amendementen gelden zijn ook van toepassing op voorstellen tot wijziging van door een ander lid
      ingediende amendementen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel99
  - number: '100.1'
    text: |-
      De Voorzitter deelt tijdens de beraadslaging over een voorstel van wet mee dat een amendement is overgenomen
      indien:
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel100
  - number: 100.1.a
    text: de minister te kennen geeft zich met de inhoud van een ingediend amendement te kunnen verenigen; en
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel100
  - number: 100.1.b
    text: |-
      de Voorzitter zich ervan heeft overtuigd dat geen van de in de vergaderzaal aanwezige leden zich tegen het
      overnemen van het amendement verzet.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel100
  - number: '100.2'
    text: |-
      Een overgenomen amendement is vanaf het tijdstip van de in het eerste lid bedoelde mededeling onderdeel van het
      voorstel van wet; het maakt geen afzonderlijk onderwerp van de beraadslaging meer uit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel100
  - number: '100.3'
    text: Tijdens een wetgevingsoverleg kan een amendement niet worden overgenomen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel100
  - number: '101.1'
    text: De algemene beraadslaging over een voorstel van wet vindt plaats in twee termijnen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel101
  - number: '101.2'
    text: |-
      De Kamer kan besluiten na de algemene beraadslaging een voor een in hun volgorde de afzonderlijke artikelen en de
      daarop voorgestelde amendementen en tenslotte de beweegreden van het voorstel in behandeling te nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel101
  - number: '101.3'
    text: De Kamer kan tot een andere wijze van behandeling besluiten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel101
  - number: '102.1'
    text: 'De Kamer kan op voorstel van het Presidium, de commissie gehoord, besluiten:'
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel102
  - number: 102.1.a
    text: |-
      dat, onverminderd het bepaalde in [artikel 91][ref1], over een voorstel van wet een wetgevingsoverleg wordt
      gehouden voordat het in een vergadering van de Kamer aan de orde komt;


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel91
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '91'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 102.1.b
    text: |-
      dat, na de algemene beraadslaging over een voorstel van wet, de beraadslaging over de afzonderlijke artikelen en de
      beweegreden van dat voorstel in een wetgevingsoverleg plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel102
  - number: '102.2'
    text: |-
      In een wetgevingsoverleg als bedoeld in het eerste lid, onderdeel *b*, worden de artikelen van een voorstel van
      wet en de daarop ingediende amendementen op dezelfde wijze behandeld als voor de behandeling van artikelen en
      amendementen in de vergadering van de Kamer is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel102
  - number: '103.1'
    text: |-
      Bij het stemmen over een artikel onderscheidenlijk de beweegreden en over de daarop voorgestelde amendementen wordt
      de volgende volgorde in acht genomen: eerst wordt gestemd over de subamendementen, daarna over de amendementen en
      tenslotte over het artikel of de beweegreden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel103
  - number: '103.2'
    text: |-
      Van amendementen op eenzelfde gedeelte van het wetsvoorstel komt het amendement met de verste strekking het eerst
      in stemming. Bij geschil hierover beslist de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel103
  - number: '103.3'
    text: |-
      De Kamer kan besluiten dat over onderdelen van een amendement, van een artikel, of van de beweegreden afzonderlijk
      zal worden gestemd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel103
  - number: '103.4'
    text: |-
      De Kamer kan beslissen dat amendementen door het aanbrengen van andere wijzigingen als vervallen moeten worden
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel103
  - number: '104'
    text: |-
      Nadat over alle artikelen en over de beweegreden is gestemd, vindt de eindstemming over het voorstel in zijn geheel
      plaats.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel104
  - number: '105.1'
    text: |-
      Indien het voorstel van wet in de loop van de beraadslaging of ten gevolge van de stemmingen wijziging heeft
      ondergaan, kan de Kamer besluiten de eindstemming tot een volgende vergadering uit te stellen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel105
  - number: '105.2'
    text: |-
      In die tussentijd kunnen wijzigingen worden voorgesteld die noodzakelijk zijn geworden door nog voor de stemming
      aangebrachte en door ten gevolge van de stemming aangebrachte wijzigingen; ook kunnen deze voorstellen strekken tot
      het herstellen van kennelijke vergissingen. De voorstellen bedoeld in de eerste volzin kunnen worden gedaan door de
      regering en door de desbetreffende commissie.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel105
  - number: '105.3'
    text: |-
      Over de aldus voorgestelde wijzigingen wordt onmiddellijk gestemd, tenzij zij de Kamer aanleiding geven tot
      heropening van de beraadslaging.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel105
  - number: '106.1'
    text: |-
      Verandering van het volgnummer van artikelen, van artikelleden of van gedeelten daarvan, nodig geworden door
      wijzigingen die in een voorstel van wet zijn gebracht, en veranderingen in de verwijzing naar artikelen, naar
      artikelleden of naar gedeelten daarvan, die het gevolg daarvan zijn, worden door de Voorzitter aangebracht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel106
  - number: '106.2'
    text: De Kamer kan besluiten de in het eerste lid bedoelde veranderingen geheel of gedeeltelijk achterwege te laten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel106
  - number: '107'
    text: |-
      De Voorzitter zendt een aangenomen voorstel van wet door naar de Voorzitter van de Eerste Kamer met het volgende
      formulier: "De Tweede Kamer der Staten-Generaal zendt bijgaand door haar aangenomen wetsvoorstel aan de Eerste
      Kamer".
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel107
  - number: '108'
    text: |-
      De Voorzitter zendt een verworpen voorstel van wet, door of vanwege de Koning ingediend, terug naar de Koning
      met het volgende formulier: "De Tweede Kamer der Staten-Generaal heeft het hierbij wederom gaande wetsvoorstel
      verworpen".
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel108
  - number: '109'
    text: |-
      De behandeling van voorstellen van Rijkswet geschiedt op dezelfde wijze als die van andere voorstellen van wet,
      doch met inachtneming van de volgende bijzondere regels.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel109
  - number: '110'
    text: |-
      De voorbereiding van de openbare beraadslaging in de Kamer over een voorstel van Rijkswet geschiedt langs
      schriftelijke weg.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel110
  - number: '111'
    text: |-
      Voorstellen tot het bepalen van een termijn waarbinnen het vertegenwoordigende lichaam van de Nederlandse Antillen
      onderscheidenlijk van Aruba bevoegd is over een voorstel van Rijkswet schriftelijk verslag uit te brengen, en
      voorstellen om aan de regering te verzoeken zulk een termijn te stellen, moeten in een vergadering van de Kamer
      worden gedaan hetzij door de Voorzitter, hetzij door een van de leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel111
  - number: '112'
    text: |-
      Het schriftelijke verslag van het vertegenwoordigende lichaam wordt gedrukt, aan de leden rondgedeeld en aan de
      regering toegezonden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel112
  - number: '113'
    text: |-
      Indien de Kamer, nadat de Gevolmachtigde Minister onderscheidenlijk de bijzondere gedelegeerde zich tegen
      het voorstel heeft verklaard, dit aanneemt met een geringere meerderheid dan drie vijfden van het aantal der
      uitgebrachte stemmen, zendt de Voorzitter het aangenomen voorstel niet aan de Eerste Kamer, doch geeft hij van
      deze aanneming kennis aan de minister-president. Deelt deze mede, dat het voorstel wordt gehandhaafd, dan zendt de
      Voorzitter het alsnog aan de Eerste Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel113
  - number: '114.1'
    text: |-
      Voorstellen van wet of van Rijkswet, door een of meer leden aanhangig te maken en alle voorstellen, ingevolge
      [artikel 15 van het Statuut voor het Koninkrijk der Nederlanden][ref1] door de Gevolmachtigde Minister voor de
      Nederlandse Antillen onderscheidenlijk van Aruba te doen, worden schriftelijk en ondertekend bij de Voorzitter
      ingezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel15
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '15'
  - number: '114.2'
    text: |-
      Door de leden aanhangig gemaakte of door de Gevolmachtigde Minister gedane voorstellen van Rijkswet worden door de
      Voorzitter dadelijk na ontvangst aan het vertegenwoordigende lichaam van de Nederlandse Antillen onderscheidenlijk
      van Aruba gezonden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel114
  - number: '115.1'
    text: |-
      Voordat een door leden aanhangig gemaakt voorstel van wet of van Rijkswet door de Kamer in behandeling wordt
      genomen hoort zij de Raad van State.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel115
  - number: '115.2'
    text: |-
      De Kamer kan de Raad van State voorts horen omtrent de in het eerste lid bedoelde voorstellen, nadat deze in
      behandeling zijn genomen. Een daartoe strekkend voorstel kan, zo nodig met doorbreking van de orde, door een lid
      worden gedaan tot aan het tijdstip van de eindstemming over het voorstel van wet in zijn geheel.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel115
  - number: '116.1'
    text: |-
      Door leden aanhangig gemaakte voorstellen van wet of van Rijkswet worden op dezelfde wijze behandeld als door of
      vanwege de Koning ingediende voorstellen van wet of van Rijkswet, met dien verstande dat overal waar sprake is van
      het optreden van een minister, de initiatiefnemer of de initiatiefnemers in diens plaats optreedt onderscheidenlijk
      optreden en dat de initiatiefnemers niet aan het onderzoek van het voorstel kunnen deelnemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel116
  - number: '116.2'
    text: |-
      Een of meer initiatiefnemers kunnen zich in de vergaderingen van de commissies en van de Kamer doen bijstaan door
      ten hoogste twee door hen daartoe aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel116
  - number: '116.3'
    text: |-
      Als ministers bij de behandeling in de Kamer het woord verlangen, krijgen zij dit na de initiatiefnemers, tenzij de
      Kamer anders besluit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel116
  - number: '117'
    text: |-
      De Voorzitter zendt een aangenomen voorstel van wet, door een of meer leden aanhangig gemaakt, door naar de
      Voorzitter van de Eerste Kamer met het volgende formulier: "De Tweede Kamer der Staten-Generaal zendt bijgaand
      door haar aangenomen wetsvoorstel aan de Eerste Kamer. Zij heeft ...... opgedragen het voorstel in die Kamer te
      verdedigen".
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel117
  - number: '118'
    text: |-
      Tenzij de Kamer anders besluit, wordt de verdediging, bedoeld in [artikel 85 van de Grondwet][ref1], opgedragen aan
      de initiatiefnemer(s).


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel85
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '85'
  - number: '119.1'
    text: Het Presidium kan besluiten andere stukken dan een voorstel van wet in handen van een commissie te stellen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel119
  - number: '119.2'
    text: |-
      Voordat het Presidium besluit een stuk als bedoeld in het eerste lid in handen van een commissie te stellen,
      onderzoekt het of dat stuk wordt voorafgegaan door een aparte paragraaf met duidelijke beslispunten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel119
  - number: '119.3'
    text: |-
      Het Presidium kan aan de Kamer voorstellen een stuk aan de regering terug te zenden om alsnog te worden voorzien
      van de in het tweede lid bedoelde beslispunten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel119
  - number: '119.4'
    text: |-
      Een besluit tot inhandenstelling wordt zo spoedig mogelijk schriftelijk ter kennis van de leden gebracht. Is
      het besluit niet met eenparigheid van stemmen genomen, dan wordt daaraan geen uitvoering gegeven voordat daarvan
      mededeling is gedaan in een openbare vergadering van de Kamer. Bij die mededeling kan de Kamer anders besluiten.
      Een voorstel hiertoe kan door ieder lid worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel119
  - number: '119.5'
    text: |-
      Blijft een besluit van het Presidium achterwege, dan kan ieder lid in een openbare vergadering de Kamer een
      voorstel doen het stuk in handen van een commissie te stellen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel119
  - number: '120'
    text: |-
      De Kamer kan, op voorstel van het Presidium, de commissie gehoord, besluiten dat de beraadslaginghet algemeen over
      een in handen van een commissie gesteld stuk zal geschieden voordat met het onderzoek door de commissie een aanvang
      is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel120
  - number: '121.1'
    text: |-
      De leden van de Kamer zijn bevoegd binnen een door de commissie te bepalen termijn schriftelijk hun opmerkingen
      omtrent een in handen van een commissie gesteld stuk aan haar in te zenden. Van de gestelde termijn wordt
      mededeling gedaan aan de leden van de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel121
  - number: '121.2'
    text: |-
      De commissie stelt de in het eerste lid bedoelde termijn vast binnen veertien dagen nadat stuk in haar handen is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel121
  - number: '121.3'
    text: |-
      De commissie kan besluiten dat de opmerkingen van de leden van de Kamer, behalve langs de in het eerste
      lid voorziene schriftelijke weg, zullen worden ingebracht in een voor alle leden van de Kamer toegankelijke
      vergadering. In een in de eerste volzin bedoelde vergadering is elk lid van de Kamer bevoegd aan de beraadslaging
      deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel121
  - number: '122.1'
    text: |-
      Nadat het stuk in handen van een commissie is gesteld, kan het Presidium een termijn vaststellen waarbinnen die
      commissie haar verslag of haar lijst van vragen vaststelt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel122
  - number: '122.2'
    text: |-
      Indien de commissie binnen de bepaalde tijd niet gereed kan zijn, vraagt zij verlenging van de termijn. Hierover
      wordt door het Presidium beslist. Deze beslissing wordt zo spoedig mogelijk schriftelijk ter kennis van de leden
      van de Kamer gebracht. Tevens wordt daarvan mededeling gedaan in een openbare vergadering van de Kamer. Is de
      beslissing niet met eenparigheid van stemmen genomen, dan kan bij die mededeling de Kamer anders besluiten. Een
      voorstel hiertoe kan door ieder lid worden gedaan. Is een termijn eenmaal door het Presidium verlengd, dan kan een
      verdere verlenging alleen door de Kamer worden toegestaan, tenzij de Kamer tot nadere bijeenroeping uiteengegaan
      is, in welk geval het Presidium een verdere verlenging kan toestaan.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel122
  - number: '122.3'
    text: |-
      Mocht de commissie in gebreke gebleven zijn binnen de daarvoor gestelde termijn een verslag of lijst van vragen uit
      te brengen, dan kan de Kamer de beraadslaging openen zonder dat een verslag of lijst van vragen is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel122
  - number: '123'
    text: Over een in handen van een commissie gesteld stuk kan een nota-overleg worden gehouden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel123
  - number: '124.1'
    text: |-
      Zodra een verdrag ter stilzwijgende goedkeuring aan de Kamer wordt overgelegd, tekent de griffier op de
      begeleidende brief de dag van ontvangst aan en de dag, waarop de wens, dat het verdrag aan de uitdrukkelijke
      goedkeuring der Staten-Generaal zal worden onderworpen, uiterlijk te kennen kan worden gegeven. Hij draagt zorg,
      dat de begeleidende brief met de genoemde aantekening onverwijld gedrukt aan de leden wordt rondgedeeld en,
      indien het een verdrag betreft, dat de Nederlandse Antillen onderscheidenlijk Aruba raakt, aan de desbetreffende
      Gevolmachtigde Minister wordt toegezonden. Als eerste dag van de termijn, bepaald in [artikel 61 de Grondwet][ref1]
      naar de tekst van 1972 dan wel bij de in het tweede lid van [artikel 91 van de Grondwet][ref2] bedoelde wet, geldt
      de dag na die van de ontvangst van het overgelegde verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel91
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '91'
  - number: '124.2'
    text: |-
      De wens kan te kennen worden gegeven door of namens de Kamer of door ten minste dertig leden. Betreft het een
      verdrag, dat de Nederlandse Antillen, onderscheidenlijk Aruba raakt, dan kan de wens ook door de desbetreffende
      Gevolmachtigde Minister te kennen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel124
  - number: '125.1'
    text: |-
      Indien de Kamer besluit de bedoelde wens te kennen te geven, doet de Voorzitter hiervan onverwijld mededeling
      aan de Minister van Buitenlandse Zaken en aan de Voorzitter van de Eerste Kamer. Betreft het een verdrag, dat
      de Nederlandse Antillen onderscheidenlijk Aruba raakt, dan doet de Voorzitter deze mededeling tevens aan de
      desbetreffende Gevolmachtigde Minister.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel125
  - number: '125.2'
    text: |-
      Een voorstel tot het te kennen geven van deze wens moet in een vergadering van de Kamer worden gedaan hetzij door
      de Voorzitter, hetzij door een van de leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel125
  - number: '125.3'
    text: |-
      Verkrijgt zulk een voorstel geen meerderheid, doch verklaren ten minste dertig leden zich daarvoor, dan vindt
      [artikel 127][ref1] toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel127
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '127'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '126'
    text: |-
      De wens, dat het verdrag aan de uitdrukkelijke goedkeuring van de Staten-Generaal zal worden onderworpen, kan
      namens de Kamer door de Voorzitter te kennen worden gegeven. Alvorens hiertoe te besluiten, raadpleegt hij zo
      mogelijk de daarvoor in aanmerking komende commissie of commissies. Hij geeft de wens te kennen aan de Minister van
      Buitenlandse Zaken en deelt onverwijld aan de Kamer en aan de Voorzitter van de Eerste Kamer mede, op welk tijdstip
      hij dit heeft gedaan. Betreft het een verdrag, dat de Nederlandse Antillen onderscheidenlijk Aruba raakt, dan doet
      de Voorzitter deze mededeling tevens aan de desbetreffende Gevolmachtigde Minister.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel126
  - number: '127'
    text: |-
      Indien dertig of meer leden de bedoelde wens te kennen willen geven, doen zij dit door schriftelijke mededeling
      aan de Voorzitter, die hiervan onverwijld kennis geeft aan de Minister van Buitenlandse Zaken. De Voorzitter
      deelt onverwijld aan de Kamer en aan de Voorzitter van de Eerste Kamer en, indien het een verdrag betreft, dat de
      Nederlandse Antillen onderscheidenlijk Aruba raakt, tevens aan de desbetreffende Gevolmachtigde Minister mede, door
      welke leden de wens te kennen is gegeven en op welk tijdstip hij hiervan aan de Minister van Buitenlandse Zaken
      kennis heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel127
  - number: '128.1'
    text: |-
      Indien de Gevolmachtigde Minister de bedoelde wens door tussenkomst van de Voorzitter te kennen geeft, geeft deze
      hiervan onverwijld kennis aan de Kamer, de Voorzitter van de Eerste Kamer en de Minister van Buitenlandse Zaken.
      Bij de kennisgeving aan de Kamer en de Voorzitter van de Eerste Kamer doet hij voorts mededeling van het tijdstip
      van de kennisgeving aan de Minister van Buitenlandse Zaken. Indien de Gevolmachtigde Minister de bedoelde wens te
      kennen geeft, doet de Voorzitter, zodra hij dit verneemt, hiervan onverwijld mededeling aan de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel128
  - number: '128.2'
    text: |-
      Betreft een voorstel, als bedoeld in [artikel 125][ref1], een verdrag, dat de Nederlandse Antillen
      onderscheidenlijk Aruba raakt, dan wordt de desbetreffende Gevolmachtigde Minister in de gelegenheid gesteld de
      mondelinge behandeling van dat voorstel bij te wonen en daarbij zodanige voorlichting aan de Kamer te verstrekken
      als hij gewenst oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel125
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '125'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '129'
    text: |-
      Indien aan de Staten-Generaal mededeling wordt gedaan van het voornemen tot toetreding tot of opzegging van een
      verdrag, vindt het bepaalde in de [artikelen 124 tot en met 128][ref1] overeenkomstig toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel124
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '124'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '130'
    text: |-
      Een kennisgeving, dat gebruik wordt gemaakt van een bij wet aan de Kamer, aan de Voorzitter of aan een bepaald
      aantal leden toegekende bevoegdheid, de indiening van een voorstel van wet te verlangen, inlichtingen te ontvangen,
      te kennen te geven dat van een voorhangprocedure kan worden afgeweken of dat overleg wordt gewenst, kan niet worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel130
  - number: '131.1'
    text: |-
      Bij de openbare behandeling van de door de commissie voor de Verzoekschriften voorgestelde conclusies kan ieder
      lid amendementen op deze conclusies voorstellen. Op deze voorstellen zijn de bepalingen omtrent amendementen op
      voorstellen van wet van overeenkomstige toepassing, met dien verstande dat ook amendementen, waarvan strekking
      tegengesteld is aan die van de conclusies van de commissie, toelaatbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel131
  - number: '131.2'
    text: |-
      Verwerpt de Kamer de voorgestelde conclusies zonder daarvoor andere in de plaats te stellen, dan worden de stukken
      in handen van een tijdelijke commissie gesteld of, indien de conclusies reeds door een tijdelijke commissie waren
      voorgesteld, in handen van een nieuwe tijdelijke commissie, die daaromtrent nader aan de Kamer verslag zal moeten
      uitbrengen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel131
  - number: '132'
    text: |-
      Indien de Kamer zich heeft verenigd met de conclusies in een verslag van de commissie voor de Verzoekschriften,
      waarbij een minister wordt uitgenodigd iets te doen of na te laten en de minister bij brief te kennen heeft gegeven
      daaraan geen gevolg te geven, wordt deze brief in handen gesteld van de commissie voor de Verzoekschriften, die aan
      de Kamer kan voorstellen dit stuk met de onder haar berustende stukken te stellen in handen van een vaste of een
      algemene commissie, ten einde daarover dan nader aan de Kamer verslag uit te brengen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel132
  - number: '133.1'
    text: |-
      Indien een lid over een onderwerp dat vreemd is aan de orde van de dag inlichtingen van een of meer ministers
      verlangt, kan hij, onder aanduiding van de voornaamste punten waarover hij vragen wil stellen, aan de Kamer
      verlof vragen tot het houden van een interpellatie. Zulk een verlof wordt mondeling gevraagd bij gelegenheid van
      een regeling van werkzaamheden. De Voorzitter kan ook op een ander tijdstip het aanvragen van een interpellatie
      toestaan.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel133
  - number: '133.2'
    text: |-
      Wanneer de Kamer het gevraagde verlof verleent, bepaalt zij hetzij dadelijk, hetzij later, een dag, waarop de
      interpellatie zal worden gehouden. De daarbij betrokken minister wordt uitgenodigd op de bepaalde dag in de
      vergadering tegenwoordig te zijn. Indien de zaak zeer veel spoed vereist en de minister tegenwoordig is, kan de
      Kamer besluiten, dat de interpellatie dadelijk wordt gehouden. De minister geeft dan, indien hem dit mogelijk is,
      dadelijk de gevraagde inlichtingen; is hem dit niet mogelijk, dan stelt de Kamer de verdere behandeling tot een
      later tijdstip uit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel133
  - number: '133.3'
    text: |-
      De interpellant doet, tenzij de interpellatie dadelijk wordt gehouden, de Voorzitter zo spoedig mogelijk
      schriftelijk weten, welke vragen hij bij de interpellatie zal stellen. Deze zendt ze aan de daarbij betrokken
      minister door, tenzij bij hem, wegens vorm of inhoud van de vragen, daartegen overwegend bezwaar bestaat.
      Doorgezonden vragen brengt de Voorzitter ter kennis van de leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel133
  - number: '133.4'
    text: |-
      Bij een interpellatie voert de interpellant niet meer dan twee malen en een ander lid niet meer dan eenmaal het
      woord, tenzij de Kamer hiertoe verlof geeft.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel133
  - number: '134.1'
    text: |-
      Het lid dat schriftelijk vragen wil stellen aan een of meer ministers dient deze vragen bij de Voorzitter in. De
      vragen dienen kort en duidelijk geformuleerd te zijn.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel134
  - number: '134.2'
    text: |-
      De Voorzitter zendt de vragen aan de desbetreffende minister, tenzij bij hem wegens vorm of inhoud van de vragen
      daartegen overwegend bezwaar bestaat. De Voorzitter brengt de doorgezonden vragen ter kennis van de leden en maakt
      deze openbaar.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel134
  - number: '135.1'
    text: |-
      Indien de minister niet in staat is de vragen binnen drie weken te beantwoorden laat hij dit de Voorzitter onder
      opgave van redenen weten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel135
  - number: '135.2'
    text: |-
      Indien de vragen niet binnen zes weken zijn beantwoord worden ze aan het begin van het eerstvolgende mondelinge
      vragenuur gesteld. De vragensteller kan toestaan dat hiervan wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel135
  - number: '135.3'
    text: |-
      De minister kan aan de Voorzitter te kennen geven dat hij een vraag niet schriftelijk maar mondeling wil
      beantwoorden. De vraag wordt dan beantwoord tijdens het eerstvolgende mondelinge vragenuur.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel135
  - number: '135.4'
    text: De vragen worden met de schriftelijke antwoorden opgenomen in het Aanhangsel van de Handelingen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel135
  - number: '136.1'
    text: |-
      Het mondelinge vragenuur vindt plaats op dinsdag aan het begin van de vergadering. De Voorzitter bepaalt per
      vergadering het tijdstip van het einde van het vragenuur.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel136
  - number: '136.2'
    text: |-
      Het lid dat tijdens het vragenuur vragen wil stellen, meldt dit, onder aanduiding van het onderwerp, schriftelijk
      bij de Voorzitter aan uiterlijk dinsdag 12.00 uur.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel136
  - number: '136.3'
    text: |-
      De Kamer kan in een bijzonder geval voor het mondeling vragenuur ook een ander tijdstip vaststellen. De Voorzitter
      bepaalt dan het tijdstip waarop het onderwerp van de vragen bij hem dient te zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel136
  - number: '136.4'
    text: |-
      De Voorzitter nodigt de desbetreffende ministers uit voor het vragenuur, waarbij hij mededeling doet van het
      onderwerp van de vragen. Vervolgens maakt de Voorzitter het onderwerp van de vragen openbaar.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel136
  - number: '137'
    text: |-
      De Voorzitter kan weigeren een onderwerp tijdens het vragenuur aan de orde te stellen, indien hij het onderwerp
      niet voldoende nauwkeurig omschreven acht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel137
  - number: '138.1'
    text: De Voorzitter bepaalt de volgorde waarin de onderwerpen tijdens het vragenuur aan de orde worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel138
  - number: '138.2'
    text: |-
      De vragensteller wordt voor ten hoogste twee minuten het woord verleend om aan een of meer ministers vragen te
      stellen en een toelichting te geven. De minister wordt voor ten hoogste vijf minuten het woord verleend om de
      vragen te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel138
  - number: '138.3'
    text: |-
      Na de beantwoording wordt de vragensteller twee minuten het woord verleend om hetzij aan de minister hetzij aan
      leden aanvullende vragen te stellen. Aan ieder tot wie vragen zijn gericht, wordt voor ten hoogste drie minuten het
      woord verleend om de vragen te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel138
  - number: '138.4'
    text: |-
      Vervolgens kan de Voorzitter aan andere leden, ieder voor ten hoogste één minuut, het woord verlenen om vragen te
      stellen over hetzelfde onderwerp. Aan ieder tot wie vragen zijn gericht, wordt voor ten hoogste drie minuten het
      woord verleend om de vragen te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel138
  - number: '138.5'
    text: Tijdens het vragenuur worden geen interrupties toegelaten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel138
  - number: '139.1'
    text: |-
      Tijdens het vragenuur kan geen verlof gevraagd worden tot het houden van een interpellatie, noch kunnen moties
      worden ingediend.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel139
  - number: '139.2'
    text: |-
      Onderwerpen die aan het einde van het vragenuur nog niet aan de orde zijn gekomen, komen te vervallen. Het lid kan
      het onderwerp voor het volgende vragenuur opnieuw bij de Voorzitter aanmelden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel139
  - number: 139a
    text: |-
      De Kamer kan na afronding van een opdracht tot kabinets(in)formatie besluiten om een formateur of informateur
      dan wel formateurs of informateurs uit te nodigen om over het verloop van die kabinets(in)formatie inlichtingen
      te verschaffen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel139a
  - number: '140'
    text: |-
      Een voorstel tot het instellen van een onderzoek (enquête) moet schriftelijk worden ingediend, hetzij door een
      commissie uit de Kamer naar aanleiding van een bij haar in overweging zijnde onderwerp, hetzij door een of meer
      leden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel140
  - number: '141'
    text: |-
      Het voorstel omvat een omschrijving van het onderwerp van het onderzoek en, zo mogelijk, de namen van getuigen en
      deskundigen. Tenzij het uitgaat van een commissie die het reeds in haar verslag omtrent het bij haar in overweging
      zijnde onderwerp voldoende heeft toegelicht, is het vergezeld van een memorie van toelichting. Voorstel en memorie
      van toelichting worden gepubliceerd op de wijze voorgeschreven in [artikel 151][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel151
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '151'
        hoofdstuk: XIII
  - number: '142.1'
    text: Is het voorstel door een of meer leden gedaan, dan verricht een tijdelijke commissie het voorbereidend onderzoek.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel142
  - number: '142.2'
    text: |-
      Is het voorstel afkomstig van een commissie uit de Kamer, dan komt het zonder voorbereidend onderzoek in openbare
      behandeling. Het Presidium kan evenwel bepalen dat de beraadslaging wordt voorbereid door een verslag van de
      commissie die het voorstel heeft gedaan. In dat geval bevat het verslag alle binnen een door het Presidium vast
      te stellen termijn van ten minste veertien dagen door een of meer leden aan de commissie toegezonden schriftelijke
      vragen en opmerkingen, alsmede de antwoorden daarop van de commissie.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel142
  - number: '142.3'
    text: |-
      De openbare beraadslaging vindt plaats op de wijze voorgeschreven voor een door een lid der Kamer aanhangig gemaakt
      voorstel van wet.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel142
  - number: '143.1'
    text: |-
      Heeft de Kamer tot het instellen van een onderzoek besloten, dan draagt zij de uitvoering op hetzij aan een reeds
      bestaande commissie uit haar midden, hetzij aan een in te stellen commissie van onderzoek. In het laatste geval
      wordt de commissie samengesteld op de wijze, in [artikel 25][ref1] voor commissies voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel25
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '25'
        hoofdstuk: VII
        paragraaf: '4'
  - number: '143.2'
    text: |-
      De Voorzitter zorgt voor plaatsing in de *Staatscourant* van het besluit tot het instellen van het onderzoek en
      van de samenstelling van de commissie waaraan de uitvoering is opgedragen. Op gelijke wijze geeft hij kennis van
      wijzigingen in de omschrijving van het onderwerp van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel143
  - number: '144'
    text: |-
      De Kamer bepaalt bij het besluit tot het instellen van een onderzoek de termijn waarbinnen het onderzoek zal zijn
      afgelopen. De termijn kan op voorstel van de commissie die het onderzoek verricht door de Kamer worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel144
  - number: '145.1'
    text: |-
      De getuigen en deskundigen worden door de voorzitter van de commissie ondervraagd. Ook de leden en medewerkers van
      de commissie kunnen, na van de voorzitter het woord te hebben verkregen, vragen stellen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel145
  - number: '145.2'
    text: |-
      De schriftelijke aantekening van de afgelegde verklaringen of gegeven berichten geschiedt door de zorgen van de
      griffier.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel145
  - number: '146.1'
    text: |-
      Wanneer de commissie een getuige ervan verdenkt, opzettelijk een valse verklaring onder ede of onder belofte te
      hebben afgelegd, wordt daarvan een afzonderlijk proces-verbaal opgemaakt, bevattende de afgelegde verklaring van de
      getuige en de aanduiding van de gronden, waarop het vermoeden van valsheid berust.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel146
  - number: '146.2'
    text: |-
      De commissie stelt een door de griffier ondertekend afschrift van het proces-verbaal in handen van het openbaar
      ministerie bij de rechtbank van het arrondissement, waarin het verhoor heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel146
  - number: '147'
    text: |-
      De processen-verbaal van verhoor van getuigen of deskundigen alsmede het afzonderlijk proces-verbaal bedoeld
      in [artikel 146][ref1] worden door de aanwezige leden der commissie en door de griffier ondertekend. Alle
      andere van de commissie uitgaande stukken, behalve die waaromtrent de [Wet op de Parlementaire Enquête][ref2]
      de ondertekening van de aanwezige leden van de commissie vordert, worden door haar voorzitter en de griffier
      ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0001841
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0006023
        artikel: '146'
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0001841
  - number: '148.1'
    text: |-
      Na afloop van het onderzoek of zo dikwijls de commissie het nodig oordeelt dan wel de Kamer daartoe besluit doet de
      commissie van haar verrichtingen verslag aan de Kamer.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel148
  - number: '148.2'
    text: |-
      De processen-verbaal van de gehouden verhoren en de overige bescheiden van het ingestelde onderzoek worden op de
      griffie bewaard.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel148
  - number: '148.3'
    text: |-
      De Kamer kan voorts de openbaarmaking gelasten van niet door de commissie openbaar gemaakte stukken, met
      uitzondering van bescheiden en aantekeningen, die ingevolge een besluit van de commissie, genomen krachtens de haar
      bij [artikel 18][ref1] verleende bevoegdheid, geheim dienen te worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel18a
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: 18a
  - number: '149'
    text: |-
      Heeft de Kamer de uitvoering van het onderzoek aan een daartoe ingestelde commissie van onderzoek opgedragen, dan
      blijft deze commissie bestaan totdat de Kamer heeft besloten haar te ontbinden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel149
  - number: '150'
    text: |-
      Van de beëindiging van het onderzoek wordt door de zorg van de Voorzitter kennis gegeven in de *Staatscourant*.
      De stukken van het onderzoek worden in het Centraal Archief van de Tweede Kamer bewaard. De Kamer kan evenwel
      besluiten dat de stukken naar het Rijksarchief zullen worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel150
  - number: '151.1'
    text: Alle tussen regering en Kamer gewisselde documenten worden voor zover mogelijk terstond digitaal gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel151
  - number: '151.2'
    text: Deze documenten worden ook op andere wijze vermenigvuldigd zodra de Kamer dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel151
  - number: '152.1'
    text: |-
      Het Presidium kan regels stellen voor de toelating van bezoekers tot het gebouw van de Kamer en in het bijzonder
      van toehoorders tot de tribunes. Deze regels mogen het beginsel van de openbaarheid van de vergadering van de
      Kamer, met uitzondering van die welke overeenkomstig dit Reglement met gesloten deuren worden gehouden, niet
      aantasten.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel152
  - number: '152.2'
    text: |-
      Alle tekenen van goed- of afkeuring zijn aan de toehoorders verboden. De Voorzitter zorgt voor de handhaving
      van dit verbod en voor de bewaring van behoorlijke stilte. Hij kan bij overtreding degene, die de orde stoort of
      gestoord heeft, doen vertrekken en desnoods alle toehoorders of allen die zich op een bepaalde tribune bevinden
      doen verwijderen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel152
  - number: '152.3'
    text: |-
      De toehoorders zijn verplicht de aanwijzingen van het personeel van de Kamer en van het toezichthoudend personeel
      van de politie op te volgen. Bij overtreding hiervan heeft de Voorzitter de bevoegdheden bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel152
  - number: '153.1'
    text: Ieder lid kan schriftelijk voorstellen een of meer bepalingen van het Reglement te herzien.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel153
  - number: '153.2'
    text: |-
      Ook een commissie kan zodanig voorstel indienen, mits dit het gevoelen van de meerderheid van het aantal leden
      waaruit zij bestaat weergeeft. Zulk een voorstel wordt ondertekend door de leden van de commissie die zich daarvoor
      hebben verklaard.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel153
  - number: '153.3'
    text: |-
      Op de voorstellen bedoeld in het eerste en tweede lid zijn de bepalingen betreffende door leden aanhangig gemaakte
      voorstellen van wet van toepassing. Indien ze van eenvoudige aard zijn, kan de Kamer echter bepalen, dat ze zonder
      vooronderzoek in openbare behandeling komen.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel153
  - number: '153.4'
    text: |-
      De beraadslaging over een wijzigingsvoorstel van de commissie voor de Werkwijze der Kamer, dat naar het oordeel van
      het Presidium niet van eenvoudige aard is, wordt voorbereid door een verslag van de commissie. Dit verslag bevat
      alle binnen een door het Presidium vast te stellen termijn van ten minste veertien dagen door een of meer leden
      aan de commissie toegezonden schriftelijke opmerkingen en vragen, alsmede de daarop door de commissie opgestelde
      antwoorden.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel153
  - number: '153.5'
    text: |-
      Neemt de Kamer een voorstel tot herziening aan, dan treedt dit onmiddellijk in werking, tenzij de Kamer anders
      besluit.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel153
  - number: '154'
    text: |-
      De Kamer kan te allen tijde besluiten van de bepalingen van dit Reglement af te wijken, indien geen der leden
      zich daartegen verzet en indien de afwijking niet in strijd is met het [Statuut voor het Koninkrijk][ref1], de
      [Grondwet][ref2] of een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002154
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002154
      - id: ref2
        bwb_id: BWBR0001840
  - number: '155'
    text: |-
      Dit reglement treedt in werking met ingang van de dag waarop na de eerstvolgende verkiezingen de nieuw gekozen
      Kamer voor de eerste maal samenkomt.
    url: https://wetten.overheid.nl/BWBR0006023/2002-04-25#Artikel155
