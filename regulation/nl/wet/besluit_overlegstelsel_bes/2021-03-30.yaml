preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 16 februari 2010, 2010-
    0000109033, CZW

    Gelet op artikel 101 van de Wet materieel ambtenarenrecht BES;

    De Raad van State gehoord, advies van 10 maart 2010, nummer WO4.10.0061/I;

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 6 september
    2010, nummer 2010-0000580940;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: In dit besluit wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
  - number: 1.1.b
    text: |-
      ambtenaar: de ambtenaar, bedoeld in [artikel 1, eerste lid, van de Ambtenarenwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel1
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '1'
  - number: 1.1.c
    text: |-
      Sectorale Overlegcommissie BES: de Commissie, bedoeld in [artikel 2.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.1.d
    text: |-
      Decentrale Overlegcommissie: de Decentrale Overlegcommissie Bonaire, Sint Eustatius respectievelijk Saba, bedoeld
      in [artikel 3.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel3
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '3'
        hoofdstuk: '3'
  - number: 1.1.e
    text: |-
      bestuurscollege: het bestuurscollege, bedoeld in
      [artikel 36, eerste lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel36
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '36'
  - number: 1.1.f
    text: 'openbaar lichaam: het openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
  - number: 1.1.g
    text: |-
      dienstonderdeel op rijksniveau: het Regionaal Service Centrum, dan wel een door Onze Minister aan te wijzen
      onderdeel van het Regionaal Service Centrum of de politieorganisatie dan wel enig ander onderdeel door de Minister
      te bepalen,
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
  - number: 1.1.h
    text: |-
      dienstonderdeel op decentraal niveau: een door het bestuurscollege aangewezen onderdeel van de ambtelijke
      organisatie.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel1.1
  - number: 2.1.1
    text: |-
      Er is een Sectorale Overlegcommissie Bonaire, Sint Eustatius en Saba, die bestaat uit vertegenwoordigers van door
      Onze Minister tot het overleg toegelaten vakorganisaties met rechtspersoonlijkheid, welke onder meer gelet op het
      aantal ambtenaren dat zij vertegenwoordigen, als representatief kunnen worden aangemerkt en tegen wier toelating
      het algemeen belang zich niet verzet.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.1
  - number: 2.1.2
    text: |-
      Elke in het eerste lid bedoelde vakorganisatie is bevoegd tot aanwijzing van twee leden en twee plaatsvervangend
      leden van de Sectorale Overlegcommissie BES.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.1
  - number: 2.1.3
    text: |-
      Bij besluit op voordracht van Onze Minister kan de toelating van een vakorganisatie tot de Sectorale
      Overlegcommissie BES worden geschorst, en ingetrokken, indien de vakorganisatie naar het oordeel van Onze Minister
      na raadpleging van de Sectorale Overlegcommissie BES niet meer representatief is dan wel het algemene belang zich
      tegen haar verdere toelating verzet.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.1
  - number: 2.2.1
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van ambtenaren met inbegrip van de algemene
      regels volgens welke het personeelsbeleid wordt gevoerd, wordt niet beslist dan nadat daarover door of namens Onze
      Minister overleg is gepleegd met de Sectorale Overlegcommissie BES.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.2
  - number: 2.2.2
    text: |-
      Het eerste lid blijft buiten toepassing met betrekking tot regelingen als bedoeld in
      [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel1
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '1'
  - number: 2.2.3
    text: |-
      Indien een voorstel waarover overleg dient plaats te vinden, strekt tot invoering of wijziging van een regeling
      met rechten of verplichtingen van individuele ambtenaren, wordt dit voorstel slechts ten uitvoer gebracht, indien
      daarover overeenstemming bestaat met de Sectorale Overlegcommissie BES.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.2
  - number: 2.2.4
    text: |-
      Er vindt in de Sectorale Overlegcommissie BES overleg plaats over de gevolgen voor ambtenaren van een voorstel tot
      het van toepassing verklaren van wetgeving die in het Europese deel van Nederland van toepassing is.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.2
  - number: 2.2.5
    text: Op het overleg over voorstellen als bedoeld in het vierde lid is het derde lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.2
  - number: 2.3.1
    text: Het overleg staat onder leiding van Onze Minister. Hij is bevoegd een ambtenaar als voorzitter aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.3
  - number: 2.3.2
    text: Partijen kunnen zich tijdens het overleg laten bijstaan door deskundigen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.3
  - number: 2.3.3
    text: Het secretariaat van het overleg wordt gevoerd door een door Onze Minister te benoemen of aan te wijzen secretaris.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.3
  - number: 2.3.4
    text: |-
      De voorzitter bepaalt jaarlijks na overleg met de leden van de Sectorale Overlegcommissie BES de plaats, de
      frequentie van overleg, de dag en de aanvangstijd van het overleg.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.3
  - number: 2.3.5
    text: |-
      Indien de voorzitter dan wel ten minste twee tot de Sectorale Overlegcommissie BES toegelaten vakorganisaties
      schriftelijk verzoeken om een tussentijds overleg onder vermelding van het onderwerp, vindt dit binnen 2 weken
      plaats.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.3
  - number: 2.3.6
    text: |-
      Onze Minister verleent zijn medewerking aan een verzoek van de Sectorale Overlegcommissie BES om een vergaderruimte
      in een rijksgebouw ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.3
  - number: 2.4.1
    text: |-
      De in [artikel 2.2, eerste lid][ref1], bedoelde aangelegenheden worden door Onze Minister aan de Sectorale
      Overlegcommissie BES voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      Iedere tot de Sectorale Overlegcommissie BES toegelaten vakorganisatie is bevoegd aan de voorzitter van het overleg
      bepaalde, in [artikel 2.2, eerste lid][ref1] bedoelde onderwerpen ter plaatsing op de agenda op te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.1
    text: |-
      De vakorganisaties die zijn toegelaten tot de Sectorale Overlegcommissie BES, doen aan Onze Minister mededeling van
      hun statuten en huishoudelijke reglementen en van de daarin aangebrachte wijzigingen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.5
  - number: 2.5.2
    text: |-
      Deze vakorganisaties stellen jaarlijks voor 1 februari Onze Minister in kennis van het totale ledental in het
      algemeen en per dienstonderdeel op rijksniveau op 1 januari van elk jaar.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.5
  - number: 2.6.1
    text: |-
      Het standpunt van de Sectorale Overlegcommissie BES wordt bepaald bij eenvoudige meerderheid van stemmen van tot
      het overleg toegelaten vakorganisaties.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.6
  - number: 2.6.2
    text: Elke vakorganisatie brengt een stem uit.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.6
  - number: 2.6.3
    text: Indien de stemmen staken, beslist Onze Minister of het voorstel ten uitvoer kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel2.6
  - number: 3.1.1
    text: |-
      In ieder openbaar lichaam is er een Decentrale Overlegcommissie Bonaire, Sint Eustatius respectievelijk Saba
      die bestaat uit vertegenwoordigers van door het bestuurscollege tot het overleg toegelaten vakorganisaties met
      rechtspersoonlijkheid, welke onder meer gelet op het aantal ambtenaren in dienst van het openbaar lichaam dat zij
      vertegenwoordigen, als representatief kunnen worden aangemerkt en tegen wier toelating het algemeen belang zich
      niet verzet.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.1
  - number: 3.1.2
    text: |-
      Elke in het eerste lid genoemde vakorganisatie is bevoegd tot aanwijzing van een lid en een plaatsvervangend lid
      van de Decentrale Overlegcommissie.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.1
  - number: 3.1.3
    text: |-
      Bij besluit van Onze minister kan de toelating van een vakorganisatie tot de Decentrale Overlegcommissie op
      voordracht van een bestuurscollege en gehoord de Sectorale Overlegcommissie BES worden geschorst en ingetrokken,
      indien de vakorganisatie niet meer representatief is dan wel het algemene belang zich tegen haar verdere toelating
      verzet.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.1
  - number: 3.2.1
    text: |-
      Over aangelegenheden van algemeen belang waarvoor op grond van een wettelijk voorschrift het openbaar lichaam
      verantwoordelijk is en die betrekking hebben op de rechtstoestand van ambtenaren in dienst van het openbaar
      lichaam, wordt niet beslist dan nadat daarover door of namens het bestuurscollege overleg is gepleegd met de
      Decentrale Overlegcommissie.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.2
  - number: 3.2.2
    text: |-
      Het eerste lid blijft buiten toepassing met betrekking tot regelingen als bedoeld in
      [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel1
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '1'
  - number: 3.2.3
    text: |-
      Indien een voorstel waarover overleg dient plaats te vinden, strekt tot invoering of wijziging van een regeling
      met rechten of verplichtingen van individuele ambtenaren, wordt dit voorstel slechts ten uitvoer gebracht, indien
      daarover overeenstemming bestaat met de Decentrale Overlegcommissie.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.2
  - number: 3.3.1
    text: |-
      Het overleg staat onder leiding van een door het bestuurscollege aan te wijzen eilandgedeputeerde. Hij is bevoegd
      een ambtenaar als voorzitter aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.3
  - number: 3.3.2
    text: De leden kunnen zich tijdens het overleg laten bijstaan door deskundigen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.3
  - number: 3.3.3
    text: Het secretariaat van het overleg wordt gevoerd door het bestuurscollege te benoemen of aan te wijzen secretaris.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.3
  - number: 3.3.4
    text: Het overleg wordt gehouden op het eiland waar het bestuurscollege resideert.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.3
  - number: 3.3.5
    text: |-
      De voorzitter bepaalt jaarlijks na overleg met de leden van de Decentrale Overlegcommissie de plaats, de frequentie
      van overleg, de dag en de aanvangstijd van het overleg.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.3
  - number: 3.3.6
    text: |-
      Indien de voorzitter dan wel ten minste twee tot de Decentrale Overlegcommissie toegelaten vakorganisaties
      schriftelijk verzoeken om een tussentijds overleg onder vermelding van het onderwerp, vindt dit binnen 2 weken
      plaats.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.3
  - number: 3.3.7
    text: |-
      Het bestuurscollege verleent zijn medewerking aan een verzoek van de Decentrale Overlegcommissie om een
      vergaderruimte in een gebouw van het openbaar lichaam ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.3
  - number: 3.4.1
    text: |-
      De in [artikel 3.2, eerste lid][ref1], bedoelde aangelegenheden worden door het bestuurscollege aan de Decentrale
      Overlegcommissie voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel3
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: |-
      Iedere tot de Decentrale Overlegcommissie toegelaten vakorganisatie is bevoegd aan de voorzitter van het overleg
      bepaalde, in [artikel 3.2, eerste lid][ref1], bedoelde onderwerpen ter plaatsing op de agenda op te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel3
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.1
    text: |-
      De vakorganisaties die zijn toegelaten tot de Decentrale Overlegcommissie, doen aan het bestuurscollege mededeling
      van hun statuten en huishoudelijke reglementen en van de daarin aangebrachte wijzigingen.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.5
  - number: 3.5.2
    text: |-
      Deze vakorganisaties stellen jaarlijks voor 1 februari het bestuurscollege in kennis van het totale ledental in het
      algemeen en per dienstonderdeel op decentraal niveau op 1 januari van elk jaar.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.5
  - number: 3.6.1
    text: |-
      Het standpunt van de Decentrale Overlegcommissie wordt bepaald bij eenvoudige meerderheid van stemmen van tot het
      overleg toegelaten vakorganisaties.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.6
  - number: 3.6.2
    text: Elke vakorganisatie brengt een stem uit.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.6
  - number: 3.6.3
    text: Indien de stemmen staken, beslist het bestuurscollege of het voorstel ten uitvoer kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel3.6
  - number: 4.1.1
    text: |-
      Onze Minister stelt regels over de wijze waarop een geschil over het overleg over aangelegenheden als bedoeld in
      [artikel 2.2, eerste lid][ref1], en [3.2, eerste lid][ref2], wordt beslecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028779#Artikel3
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028779
        artikel: '3'
        hoofdstuk: '3'
  - number: 4.1.2
    text: Een regeling wordt vastgesteld, indien daarover overeenstemming bestaat met de Sectorale Overlegcommissie BES.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel4.1
  - number: 4.2.1
    text: |-
      In afwijking van de [artikelen 2.2, derde lid][ref1], kunnen bij regeling van Onze Minister groepen ambtenaren
      worden aangewezen waarvoor een belangrijke wijziging van de organisatiestructuur van het dienstonderdeel op
      rijksniveau ten uitvoer kan worden gebracht indien overeenstemming wordt bereikt met bij een of meer, bij
      ministeriële regeling aan te wijzen vakorganisaties met rechtspersoonlijkheid, die gelet op het totaal aantal
      ambtenaren, werkzaam binnen deze organisatiestructuur, als representatief kunnen worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.2.2
    text: |-
      In afwijking van [artikel 3.2, derde lid][ref1], kunnen bij regeling van het bestuurscollege groepen ambtenaren
      worden aangewezen waarvoor een belangrijke wijziging van de organisatiestructuur van het dienstonderdeel op
      decentraal niveau ten uitvoer kan worden gebracht indien overeenstemming wordt bereikt met bij een of meer, bij
      regeling van het bestuurscollege aan te wijzen vakorganisaties met rechtspersoonlijkheid, die gelet op het totaal
      aantal ambtenaren, werkzaam binnen deze organisatiestructuur, als representatief kunnen worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel3
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '3'
        hoofdstuk: '3'
  - number: 4.3.1
    text: |-
      Onze Minister is bevoegd een lid of een plaatsvervangend lid van de Sectorale Overlegcommissie BES of de Decentrale
      Overlegcommissie van deelneming aan het overleg uit te sluiten, indien naar zijn oordeel het dienstbelang dit in
      verband met zijn werkzaamheden als ambtenaar vordert. De uitsluiting geschiedt niet dan nadat het bestuur van de
      daarbij betrokken zijnde vakorganisatie over het voornemen daartoe is gehoord, en het advies van de overige leden
      van de Sectorale Overlegcommissie BES, respectievelijk de Decentrale Overlegcommissie, daarover is ingewonnen.
      In afwachting van de beslissing neemt het betrokken lid niet of niet meer deel aan het overleg. Na de uitsluiting
      wijst de desbetreffende vakorganisatie een andere vertegenwoordiger aan als lid of plaatsvervangend lid van de
      Sectorale Overlegcommissie BES, respectievelijk de Decentrale Overlegcommissie, in de plaats van het uitgesloten
      lid.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel4.3
  - number: 4.3.2
    text: |-
      De bevoegdheid op grond van het eerste lid wordt niet gemandateerd of gedelegeerd aan een functionaris, die direct
      betrokken is bij het overleg met de Sectorale Overlegcommissie of de Decentrale Overlegcommissie.
    url: https://wetten.overheid.nl/BWBR0028779/2021-03-30#Artikel4.3
  - number: '4.4'
    text: |-
      Met betrekking tot vergoeding van de kosten die leden van de Sectorale Overlegcommissie BES, respectievelijk
      de Decentrale Overlegcommissie maken in het kader van het overleg, kunnen nadere regels door Onze Minister,
      respectievelijk het bestuurscollege worden gesteld.
