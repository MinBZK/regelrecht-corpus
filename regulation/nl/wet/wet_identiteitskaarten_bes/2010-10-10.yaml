        artikel: '3'
  - number: '8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake:

      a. het model;

      b. de op de identiteitskaart aan te brengen foto;

      c. de vervaardiging, de distributie en het beheer van de identiteitskaarten;

      d. de administratie van afgegeven identiteitskaarten en de verstrekking van gegevens daaruit.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de op het identiteitskaart
      aan te brengen nadere gegevens en gegevensdragers.

      3 Onze Minister draagt zorg voor de beschikbaarstelling van blanco identiteitskaarten aan de gezaghebbers van
      de openbare lichamen. Een openbaar lichaam is voor iedere beschikbaar gestelde blanco identiteitskaart een naar
      kostprijs bij ministeriële regeling vastgesteld bedrag aan het Rijk verschuldigd.

      4 De afdracht van de verschuldigde kosten, bedoeld in het derde lid, aan het Rijk vindt plaats volgens bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Overtreding van het bepaalde in de [artikelen 1a, eerste lid][ref1], [4][ref2], [5][ref3] en [6 lid 2][ref4]
      wordt gestraft met hechtenis van ten hoogste één maand of geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028279#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0028279#Artikel4
