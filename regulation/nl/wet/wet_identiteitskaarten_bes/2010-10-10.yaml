  - number: '12'
    text: |-
      De kosten aan de uitvoering van deze wet verbonden komen ten laste van de kas van het openbaar lichaam waar de
      identiteitskaart is afgegeven.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 Omtrent de uitvoering van deze wet kunnen nadere regelen worden gesteld bij algemene maatregel van
      bestuur. Daarbij kan voor wat de afgifte voor de eerste maal van identiteitskaarten betreft worden bepaald,
      dat de bevoegdheden en verplichtingen, welke in de voorgaande artikelen aan de gezaghebbers zijn toegekend
      onderscheidenlijk zijn opgelegd, worden uitgeoefend door onderscheidenlijk rusten op de bij die algemene maatregel
      van bestuur aan te wijzen autoriteit.

      2 De bestuurscolleges verlenen de nodige medewerking en verstrekken de nodige gegevens terzake van de uitvoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel13
  - number: 13a
    text: |-
      De identiteitskaarten die in Bonaire, Sint Eustatius en Saba zijn afgegeven voor de inwerkingtreding van deze wet,
      behouden de geldigheidsduur die daarin is vermeld tot het bij ministeriële regeling te bepalen tijdstip waarop
      zij moeten worden vervangen door een identiteitskaart van het model dat na de inwerkingtreding van deze wet is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel13a
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet identiteitskaarten BES.'
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel14
