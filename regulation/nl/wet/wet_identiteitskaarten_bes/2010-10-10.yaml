  - number: '10'
    text: |-
      Hij, die opzettelijk gebruik maakt van de identiteitskaart van een ander, zich daarbij uitgevende voor de persoon
      op wie de identiteitskaart betrekking heeft, wordt gestraft hetzij, met gevangenisstraf van ten hoogste één jaar,
      hetzij met een geldboete van de tweede categorie, hetzij met beide straffen.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel10
  - number: '11'
    text: |-
      1 De feiten strafbaar gesteld bij [artikel 9][ref1] worden beschouwd als overtreding.

      2 Het feit strafbaar gesteld bij [artikel 10][ref2] wordt beschouwd als misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0028279#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028279#Artikel10
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel11
