  - number: '7'
    text: |-
      1 Voor de afgifte van identiteitskaarten is een bij eilandsverordening vastgestelde vergoeding verschuldigd.

      2 Voor de afgifte van identiteitskaarten ter vervanging van een identiteitskaart, welke ongeldig is geworden
      op grond van het bepaalde in [artikel 3, onderdelen c of d][ref1], welke verloren is gegaan, of welke bij
      ongeldigheid niet is ingeleverd, wordt de vergoeding, bedoeld in het eerste lid vermeerderd met een vergoeding bij
      eilandsverordening vastgesteld.

      3 De gezaghebber kan ontheffing verlenen van de betaling van de krachtens het eerste en tweede lid vastgestelde
      vergoedingen, indien naar het oordeel van de gezaghebber het ongeldig worden of het verloren gaan de betrokkene
      in redelijkheid niet kan worden toegerekend of de betaling in redelijkheid naar het oordeel van de gezaghebber van
      betrokkene niet kan worden gevergd.

      4 Vergoedingen verkregen voor de afgifte van identiteitskaarten komen ten bate van de kas van het openbaar lichaam
      waar de identiteitskaart is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028279#Artikel3
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel7
    references:
