articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder openbaar lichaam: het openbaar lichaam Bonaire, Sint Eustatius of Saba.'
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel1
  - number: 1a
    text: |-
      1 Ieder, die in het bevolkingregister van een openbaar lichaam is opgenomen en 12 jaar of ouder is, dient in het
      bezit te zijn van een op hem betrekking hebbende geldige identiteitskaart, door of namens de gezaghebber van het
      betrokken openbaar lichaam afgegeven, behalve wanneer betrokkene niet in de gelegenheid is gesteld een zodanige
      identiteitskaart in ontvangst te nemen.

      2 De gezaghebber draagt zorg dat betrokkenen in de gelegenheid worden gesteld de in het eerste lid bedoelde
      identiteitskaart in ontvangst te nemen.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel1a
  - number: '2'
    text: |-
      1 Onverminderd andere vereisten voor de identiteitskaart bij of krachtens algemene maatregel van bestuur gesteld,
      dient de identiteitskaart het volgende te bevatten:

      a. geslachtsnaam en voornamen van betrokkene. Op verzoek van de kaarthouder kan, onder vermelding van diens
      burgerlijke staat, tevens de geslachtsnaam worden opgenomen van de echtgenoot, echtgenote of geregistreerde
      partner, dan wel, indien de houder geen echtgenoot, echtgenote of geregistreerde partner meer heeft, de
      geslachtsnaam van de gewezen echtgenoot, echtgenote of geregistreerde partner met wie het huwelijk of het
      geregistreerd partnerschap laatstelijk is geëindigd, voor zover het model van de identiteitskaart daartoe voldoende
      ruimte bevat;

      b. geslacht, geboortedatum en -plaats van betrokkene;

      c. nationaliteit van betrokkene;

      d. handtekening van betrokkene, met dien verstande dat, indien betrokkene niet bij machte is zijn handtekening te
      plaatsen, een aantekening terzake door of namens de gezaghebber wordt opgenomen;

      e. in de navolgende volgorde, achter elkaar in Arabische cijfers vermeld, het jaar, de maand en de dag van
      geboorte, waarbij de vermelding van het jaar door middel van vier cijfers en de maand en de dag van geboorte door
      middel van twee cijfers plaats heeft, met dien verstande dat de cijfers van de maanden en dagen onder het getal 10
      worden voorafgegaan door het cijfer 0; het aldus ontstane getal wordt gevolgd door een codegetal bestaande uit twee
      cijfers lopende van 01 tot en met 99, naar volgorde bij geboorte op dezelfde dag te bezigen, waarbij verdeling van
      het codegetal bij de eerste afgifte voor de openbare lichamen als volgt plaats heeft:

      van 60 tot en met 75: Bonaire;

      van 86 tot en met 92: Saba;

      van 93 tot en met 99: St. Eustatius;

      f. datum van afgifte van de identiteitskaart en datum waarop de geldigheidsduur van de identiteitskaart eindigt;

      g. documentnummer.

      2 De identiteitskaart dient voorzien te zijn van een foto, die een duidelijk en goed gelijkend beeld van betrokkene
      vertoont.

      3 De identiteitskaart wordt niet uitgereikt alvorens betrokkene daarop zijn handtekening heeft gesteld dan wel de
      in het eerste lid sub d bedoelde aantekening is opgenomen.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel2
  - number: '3'
    text: |-
      De identiteitskaart is ongeldig, indien:

      a. de geldigheidsduur aangegeven op de kaart, welke niet meer dan vijf jaren mag bedragen, is verstreken.

      b. het daarop vermelde niet langer in overeenstemming met de werkelijkheid is;

      c. deze is beschadigd of het daarop vermelde geheel of gedeeltelijk onleesbaar is geworden;

      d. in het daarop vermelde wijzigingen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 Degene wiens identiteitskaart ongeldig is geworden, levert die kaart onverwijld in bij de gezaghebber of bij een
      door deze aangewezen ambtenaar.

      2 Een gelijke verplichting als in het voorgaande lid bedoeld rust op elk der erfgenamen van de overledene, evenals
      op de executeurstestamentair en de beheerders van de nalatenschap, wanneer zij diens identiteitskaart in de
      nalatenschap aantreffen.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 Degene wiens identiteitskaart verloren is gegaan, doet daarvan zo mogelijk onder opgave van redenen, onverwijld
      mededeling aan de gezaghebber of aan door deze aangewezen ambtenaren en legt ten overstaan van deze een
      schriftelijke verklaring af omtrent de vermissing.

      2 Aan het vereiste, bedoeld in het eerste lid, is ook voldaan, indien degene wiens identiteitskaart verloren is
      gegaan, ten overstaan van de gezaghebber of door deze aangewezen ambtenaren een proces-verbaal van de politie
      overlegt omtrent de vermissing.
    url: https://wetten.overheid.nl/BWBR0028279/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 In de gevallen, bedoeld in de [artikelen 4 lid 1][ref1] en [5][ref2] wordt door of namens de in
      [artikel 1][ref3] bedoelde gezaghebber een nieuwe identiteitskaart afgegeven.

      2 De houder van een nieuwe identiteitskaart, die weder in het bezit komt van zijn verloren gegane identiteitskaart,
      levert deze laatste kaart onverwijld in bij de gezaghebber of bij een door deze aangewezen ambtenaar.

      3 Bij de vervanging van de identiteitskaart wordt het bij de eerste afgifte gebezigde codegetal als bedoeld in
      [artikel 2 onder e][ref4] gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0028279#Artikel4
