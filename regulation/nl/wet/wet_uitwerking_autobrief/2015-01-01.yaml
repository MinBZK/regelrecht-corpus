preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is maatregelen te treffen in de sfeer van de
    autogerelateerde belastingen, in het bijzonder om het fiscale beleid om zuinige auto’s te stimuleren te verbeteren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030923/2015-01-01#ArtikelAanhef
articles:
  - number: XIV
    text: |-
      Het koninklijk besluit van 23 juni 2011 (Stb. 321) tot wijziging van het Besluit uitsluiting aftrek omzetbelasting
      1968 wordt goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0030923/2015-01-01#ArtikelXIV
  - number: XIX
    text: |-
      1 Op 1 januari 2013 is [artikel 16b van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1]
      van overeenkomstige toepassing op de [artikelen XVII][ref2] en [XVIII][ref3].

      2 [Artikel XVIII][ref4] vindt eerst toepassing nadat
      [artikel 16b van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref5] bij het begin van het
      kalenderjaar 2015 is toegepast.


