  - number: XXVIII
    text: |-
      1 [Artikel 27a van de Wet op de accijns][ref1] vindt geen toepassing bij het begin van de kalenderjaren 2012 tot en
      met 2015 op de bedragen genoemd in [artikel 27, eerste lid, onderdeel d, van de Wet op de accijns][ref2].

      2 [Artikel 84a van de Wet op de accijns][ref3] vindt geen toepassing bij het begin van de
      kalenderjaren 2012 tot en met 2015 voor zover het betreft de verhoging van de accijns, bedoeld in
      [artikel 27, eerste lid, onderdeel d, van de Wet op de accijns][ref4].

      3 [Artikel 90 van de Wet belastingen op milieugrondslag][ref5] vindt geen toepassing
      bij het begin van de kalenderjaren 2012 tot en met 2015 op de bedragen, genoemd in
      [artikel 59, eerste lid, onderdeel b, van de Wet belastingen op milieugrondslag][ref6].


