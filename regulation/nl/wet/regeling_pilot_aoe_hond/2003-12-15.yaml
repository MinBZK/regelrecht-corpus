articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. de ministers: de Minister van Binnenlandse Zaken en Koninkrijksrelaties en de Minister van Justitie;

      b. aanhoudings- en ondersteuningseenheid: een eenheid, als bedoeld in
      [artikel 8, eerste lid, van het Besluit beheer regionale politiekorpsen][ref1];

      c. AOE-hond: de hond in eigendom van het regionaal politiekorps Rotterdam-Rijnmond, waarvoor over een certificaat
      als bedoeld in [artikel 6][ref2] wordt beschikt;

      d. geleider: de ambtenaar van politie, als bedoeld in
      [artikel 3, eerste lid, onder a, van de Politiewet 1993][ref3], die behoort tot de aanhoudings- en
      ondersteuningseenheid van het regionaal politiekorps Rotterdam-Rijnmond en dienst doet met een AOE-hond;

      e. voorlopig keuringsreglement: de bij deze regeling behorende bijlage waarin de keuringseisen zijn opgenomen;

      f. rijksgecommitteerden: de functionarissen welke door de ministers zijn aangewezen op grond van
      [artikel 4 van de Regeling politiesurveillancehonden 1999][ref4];

      g. begeleidingscommissie: commissie bestaande uit een lid van het Landelijk Selectie- en Opleidingscentrum (LSOP),
      een lid van het Openbaar Ministerie en een lid van het Korps landelijke politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel8
