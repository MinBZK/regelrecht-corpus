  - number: '2'
    text: |-
      De aanhoudings- en onderstersteuningseenheid van het regionaal politiekorps Rotterdam-Rijnmond beschikt gedurende
      de periode van 15 december 2003 tot 15 december 2004, ter beproeving van het geweldsmiddel AOE-hond, over een
      combinatie van geleider en AOE-hond. De ministers kunnen deze periode met maximaal 1 jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0016003/2003-12-15#Artikel2
  - number: '3'
    text: |-
      1 Het inzetten van een AOE-hond is slechts geoorloofd onder het toezicht van een geleider bij het optreden van een
      aanhoudings- en ondersteuningseenheid.

      2 De combinatie van geleider en AOE-hond dient in het bezit te zijn van een certificaat als bedoeld in
      [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016003#Artikel6
    url: https://wetten.overheid.nl/BWBR0016003/2003-12-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016003
        artikel: '6'
        paragraaf: '3'
  - number: '4'
    text: |-
      Onverminderd
      __REF000___________________________________________________________________________________________________________
      __________ meldt de geleider, door tussenkomst van zijn meerdere, de inzet van een AOE-hond, de feiten en
      omstandigheden dienaangaande, alsmede de gevolgen hiervan, onverwijld, door middel van een daartoe door de
      ministers ter beschikking gesteld formulier, aan de begeleidingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006589#Artikel17
    url: https://wetten.overheid.nl/BWBR0016003/2003-12-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006589
        artikel: '17'
  - number: '5'
    text: |-
      1 De keuring van de combinatie van geleider en AOE-hond geschiedt door de rijksgecommitteerden op basis van het
      voorlopig keuringsreglement.

      2 Aan de keuring kunnen slechts deelnemen ambtenaren van politie die sedert tenminste twee jaar behoren tot een
      aanhoudings- en ondersteuningseenheid en door de korpsbeheerder zijn aangewezen als geleider.

      3 Aan een AOE-hond worden tenminste de volgende, in het voorlopig keuringsreglement nader omschreven, eisen
      gesteld:

      a. volgzaamheid en gehoorzaamheid aan de geleider;

      b. kunnen participeren in procedures temidden van de leden van de aanhoudings- en ondersteuningseenheid;

      c. onder bepaalde omstandigheden, op een bepaalde afstand niet hoorbaar zijn;

      d. vaardigheid in het kunnen nemen van alle hindernissen die voor een goed functioneren in de praktijk noodzakelijk
      zijn;

      e. het vermogen om op commando van de geleider geweld tegen derden toe te passen.

      4 De AOE-hond wordt gedurende de keuring geleid door zijn geleider.
    url: https://wetten.overheid.nl/BWBR0016003/2003-12-15#Artikel5
  - number: '6'
    text: |-
      1 De rijksgecommitteerden verstrekken aan de geleider van de combinatie die heeft voldaan aan de keuringseisen van
      het voorlopig Keuringsreglement, een certificaat op naam van de combinatie van de geleider en de AOE-hond.

      2 Het certificaat heeft een geldigheidsduur van ten hoogste twee jaar te rekenen vanaf de datum waarop aan de
      keuringseisen is voldaan. Het certificaat vervalt op de datum waarop de periode bedoeld in [artikel 2][ref1]
      eindigt.

      3 Het certificaat geldt uitsluitend voor de combinatie van geleider en AOE-hond, op naam waarvan het is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016003#Artikel2
    url: https://wetten.overheid.nl/BWBR0016003/2003-12-15#Artikel6
