  - number: '8.2'
    text: |-
      De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken
      in het buitenland komen voor rekening van de aanvrager van het certificaat. Deze kosten worden afzonderlijk in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen 18.00
      uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1] daaraan
      gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 35 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '9.2'
    text: |-
      Het tarief, genoemd in het eerste lid, is eveneens verschuldigd voor uitgevoerde onderzoeken in het buitenland
      buiten de daar ter plaatse geldende werktijden.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel9
  - number: '10'
    text: De Regeling Nederlandse tarieven vissersvaartuigen 2002 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling Nederlandse tarieven vissersvaartuigen 2003. Deze regeling zal met de
      toelichting worden geplaatst in de Staatscourant, de Curaçaosche Courant en het Afkondigingsblad van Aruba.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel12
