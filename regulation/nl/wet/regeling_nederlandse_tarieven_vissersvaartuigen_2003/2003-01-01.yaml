  - number: '5.1'
    text: |-
      Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de afgifte van een vergunning
      krachtens [artikel 2bis van de Schepenwet][ref1], is het volgende tarief verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel2bis
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 2bis
  - number: 5.1.a
    text: voor vaartuigen met een lengte tot 24 meter € 326;
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel5
  - number: 5.1.b
    text: voor vaartuigen met een lengte vanaf 24 meter € 355.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het tarief, bedoeld in het eerste lid, is niet verschuldigd indien het een vergunning betreft uitsluitend bestemd
      voor het maken van een proefvaart dan wel het ondernemen van een reis uit een haven in Nederland, met de bedoeling
      het vaartuig gereed te maken voor het verkrijgen van een certificaat van deugdelijkheid, een certificaat van
      overeenstemming of een certificaat van vrijstelling.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel5
  - number: '6.1'
    text: |-
      Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor het verstrekken van een certificaat van
      ontheffing of een certificaat van vrijstelling, voor het verstrekken van een extra exemplaar of een tussentijdse
      vervanging van een certificaat, alsmede voor de afgifte van een certificaat zonder dat hiervoor een onderzoek aan
      boord plaatsvindt, is een tarief verschuldigd van € 165.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de vervanging van de in deze regeling genoemde certificaten die door een scheepsongeval verloren zijn gegaan,
      is geen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel6
  - number: '7'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens het [Vissersvaartuigenbesluit][ref1], die niet
      op grond van een van de overige artikelen van deze regeling in rekening worden gebracht, is een tarief verschuldigd
      van € 72 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004607
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004607
  - number: '8.1'
    text: |-
      Indien een onderzoek als bedoeld in deze regeling geheel of gedeeltelijk in het buitenland wordt uitgevoerd en de
      voor het betreffende onderzoek vastgestelde termijn, opgenomen in de onderstaande tabel, wordt overschreden, is
      per termijnoverschrijdende dag een aanvullend tarief verschuldigd van € 583. Onderzoekstermijnen: deze termijnen
      beginnen op de dag van vertrek uit Nederland en eindigen op de dag van terugkomst in Nederland.







