  - number: '3.4'
    text: |-
      Voor het onderzoek nieuwbouw radio-installatie, het eerste onderzoek radio-installatie als bedoeld in artikel 1.12,
      eerste lid, van het Visservaartuigenbesluit 2002, en een herinspectie radio-installatie aan boord van de schepen
      als bedoeld in het laatstgenoemde artikel zijn de volgende tarieven verschuldigd aan het Agentschap Telecom van het
      ministerie van Economische Zaken:
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel3
  - number: 3.4.a
    text: nieuwbouw radio-installatie € 986,71;
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel3
  - number: 3.4.b
    text: |-
      herinspectie radio-installatie € 123,96. Indien het onderzoek van een radio-installatie aan boord van een in
      Nederland thuis behorend schip geheel of gedeeltelijk in het buitenland plaatsvindt is een toeslag verschuldigd van
      25% van het desbetreffende tarief genoemd onder a of b.
    url: https://wetten.overheid.nl/BWBR0014423/2003-01-01#Artikel3
