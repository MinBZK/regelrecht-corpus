$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: begrippencode_gas
regulatory_layer: WET
publication_date: '2026-02-20'
valid_from: '2026-01-01'
bwb_id: BWBR0037923
url: https://wetten.overheid.nl/BWBR0037923/2026-01-01
preamble:
  text: |-
    Gelet op artikel 12f, eerste lid en artikel 23 van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037923/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In de voorwaarden bedoeld in de [artikelen 12a][ref1], [12b][ref2] en [22 van de Gaswet][ref3] wordt verstaan
      onder:

        - *aangeslotene:* een persoon die beschikt over een aansluiting op een gastransportnet, niet zijnde een
      netkoppeling, dan wel degene die om een aansluiting heeft verzocht;
        - *aangeslotene met exitcapaciteit:* een aangeslotene met een aansluiting op het landelijk gastransportnet die zelf
      exitcapaciteit heeft gecontracteerd;
        - *aangrenzend netbeheerder:* de beheerder van een gastransportnet, niet zijnde een regionaal gastransportnet,
      verbonden met het landelijk gastransportnet;
        - *aansluitcapaciteit:* hoeveelheid gas die in een uur maximaal over een aansluiting kan worden overgedragen,
      uitgedrukt in m3(n)/uur;
        - *aansluiting:* één of meer verbindingen tussen een gastransportnet en een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref4], waaronder begrepen één of
      meer verbindingen tussen een gastransportnet dat wordt beheerd door een netbeheerder en een gastransportnet dat
      beheerd wordt door een ander dan die netbeheerder;
        - *aansluitingenregister:* een register, ingericht en beheerd door de netbeheerder, waarin voor de aansluitingen op
      zijn net kenmerkende gegevens zijn vastgelegd;
        - *aansluitleiding:* onderdeel van de aansluiting dat de aansluiting met het gastransportnet verbindt;
        - *aansluitovereenkomst:* de overeenkomst tussen de aangeslotene en de netbeheerder betreffende de aansluiting van
      de aangeslotene op het gastransportnet;
        - *aansluitpunt:* het deel van de aansluiting vanaf het gastransportnet tot en met de eerste afsluiter;
        - *aansluit- en transportovereenkomst:* de overeenkomst tussen een aangeslotene en een netbeheerder betreffende de
      aansluiting op een gastransportnet en het transport van gas;
        - *actuele [leverancier / programmaverantwoordelijke / meetverantwoordelijke]:* de [leverancier /
      programmaverantwoordelijke / meetverantwoordelijke] die voor een bepaalde aansluiting de rechten en plichten
      van een [leverancier / programmaverantwoordelijke / meetverantwoordelijke] uitoefent en als zodanig in het
      aansluitingenregister staat geregistreerd;
        - *administratieve status van een aansluiting:* de aanduiding in het aansluitingenregister waaruit blijkt dat de
      aansluiting administratief aangesloten of administratief afgesloten is, te weten of de aansluiting wel of niet
      beschikbaar is voor gebruik op de energiemarkt;
        - *adresgegevens:* straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam;
        - *afgelezen meterstand:* een meterstand die ter plaatse van de meetinrichting visueel is afgelezen;
        - *afnamecategorie:* de aanduiding van de wijze waarop de allocatie voor de desbetreffende aangeslotene
      plaatsvindt;
        - *afnemer:* een persoon met een aansluiting op een gastransportnet;
        - *afschakelbaar:* heeft betrekking op transportcapaciteit en geeft aan dat de transportcapaciteit door de
      netbeheerder van het landelijk gastransportnet afgeschakeld kan worden;
        - *Agentschap:* het agentschap, bedoeld in artikel 1, eerste lid, van de [Verordening 713/2009](32009R0713);
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref5];
        - *balans assisterende programmaverantwoordelijke:* een erkende programmaverantwoordelijke waarvan het teken van
      zijn portfolio onbalans signaal tegengesteld is aan het teken van het systeem balans signaal;
        - *bedrijfscondities:* de condities bepaald door de heersende temperatuur en druk;
        - *beschikbare capaciteit:* het deel van de technische capaciteit dat niet is gealloceerd en op een gegeven moment
      nog beschikbaar is voor het systeem;
        - *binnenlands entrypunt*: een entrypunt niet zijnde een interconnectiepunt;
        - *binnenlands exitpunt*: een exitpunt niet zijnde een interconnectiepunt;
        - *CalGos-boek:* een openbaar overzicht per netgebied van de maandgemiddelde calorische omrekenfactoren, de
      temperatuur gecorrigeerde profielfracties (TCPF) van elke afnamecategorie en de gewogen gemiddelde calorische
      waarden per uur;
        - *calorische bovenwaarde:* de hoeveelheid energie, uitgedrukt in megajoule [MJ], afgerond op drie cijfers
      achter de komma, die vrijkomt bij de volledige verbranding van 1 m3(n) gas in lucht, wanneer de na de verbranding
      aanwezige componenten tot de uitgangscondities van temperatuur en druk worden teruggebracht, zijnde 298,15 K
      en een absolute druk van 101,325 kPa (1,01325 bar), en waarbij de bij de verbranding gevormde waterdamp wordt
      gecondenseerd. Symbool “H”; eenheid [MJ/m3(n)];
        - *calorische verrekening:* de omrekening van een volume gas met een calorische bovenwaarde naar een volume met de
      referentie calorische bovenwaarde, waarbij de referentie calorische bovenwaarde 35,17 MJ bedraagt;
        - *capaciteitstariefcode:* de aanduiding in het aansluitingenregister van het op een aansluiting van toepassing
      zijnde nettarief;
        - *centraal systeem stuursignaal (CSS):* systeem van de netbeheerder van het landelijk gastransportnet waarin de
      verwerking van de uurlijkse data volgens [6.4.2 van de Informatiecode elektriciteit en gas][ref6] wordt uitgevoerd;
        - *compressibiliteit:* het werkelijke volume van een gegeven massa aardgas gedeeld door het eigen volume, onder de
      zelfde condities, als berekend met de ideale gaswet (de wet van Boyle en Gay-Lussac);
        - *confirmatie:* het bericht – per portfolio – van het dispatching centrum (CCP) van de netbeheerder van het
      landelijk gastransportnet aan de erkende programmaverantwoordelijke, dat onder andere bevat de hoeveelheden gas per
      uur die van een derde door een erkende programmaverantwoordelijke op een entrypunt zullen worden afgenomen en de
      hoeveelheden gas per uur die door een erkende programmaverantwoordelijke op een exitpunt aan een derde beschikbaar
      zullen worden gesteld;
        - *dichtheid:* de massa van een hoeveelheid gas gedeeld door het eigen volume bij gespecificeerde condities van
      druk en temperatuur. Symbool: “ρ”; eenheid [kg/m3];
        - *direct aangeslotene:* een eindafnemer of een beheerder van een gesloten distributiesysteem die beschikt over een
      aansluiting op het landelijk gastransportnet;
        - *directe lijn:* een of meer leidingen voor het transport van gas, behoudens voor zover die gelegen is binnen een
      installatie, die: 1. niet is verbonden met een gastransportnet of een andere leiding voor het transport van gas en
      die een geïsoleerde productie-installatie van een producent rechtstreeks verbindt met een geïsoleerde verbruiker
      van gas, niet zijnde de producent, of 2. ten hoogste via de installatie van één aangeslotene op de leiding is
      verbonden met een gastransportnet of een andere leiding voor het transport van gas en die een productie-installatie
      van een producent met tussenkomst van een leverancier rechtstreeks verbindt met één of meer verbruikers van gas,
      niet zijnde de producent of in hoofdzaak huishoudelijke verbruikers, teneinde te voorzien in de gasbehoefte van
      deze verbruikers;
        - *EAN-code:* uniek identificatienummer conform de Europese Artikel Nummering;
        - *EAN-codeboek:* Een online toegankelijk uittreksel van het aansluitingenregister;
        - *economische eigendom:* het krachtens een rechtsverhouding gerechtigd zijn tot alle rechten en bevoegdheden
      ten aanzien van een goed, met uitzondering van het recht op levering, en het gehouden zijn om alle verplichtingen
      ten aanzien van dat goed voor zijn rekening te nemen en daarmee het volledige risico van waardeverandering of
      tenietgaan van het goed te dragen, zonder dat het goed geleverd is;
        - *EIC-code:* uniek identificatienummer volgens het ‘Energy Identification Coding scheme’ voor marktpartijen actief
      in de interne Europese energiemarkt;
        - *entrycapaciteit:* de transportcapaciteit op een entrypunt;
        - *entrygas:* het gas dat volgens een overeenkomst op een entrypunt gealloceerd is voor aflevering door de erkende
      programmaverantwoordelijke aan de netbeheerder van het landelijk gastransportnet;
        - *entryprogramma:* een programma als bedoeld in [artikel 17b, eerste lid van de Gaswet][ref7];
        - *entrytarief*: het tarief dat een netgebruiker verschuldigd is aan de netbeheerder van het landelijk
      gastransportnet voor het contracteren van entrycapaciteit;
        - *erkende programmaverantwoordelijke:* partij die erkend is door de netbeheerder van het landelijk gastransportnet
      en daarmee de programmaverantwoordelijkheid uitoefent;
        - *exitcapaciteit:* de transportcapaciteit op een exitpunt;
        - *exitgas:* het gas dat volgens een overeenkomst op een exitpunt gealloceerd is voor aflevering door de
      netbeheerder van het landelijk gastransportnet aan de erkende programmaverantwoordelijke;
        - *exitprogramma:* een programma als bedoeld in [artikel 17b, tweede lid van de Gaswet][ref8];
        - *exittarief*: het tarief dat een netgebruiker verschuldigd is aan de netbeheerder van het landelijk
      gastransportnet voor het contracteren van exitcapaciteit;
        - *extrahogedruknet:* een net met een overdruk groter dan 8 bar;
        - *fitfactor netverlies RNB:* factor waarmee de maximaal gemeten capaciteit wordt toegerekend aan de plancapaciteit
      netverlies RNB;
        - *fitfactor profielafnemers:* factor die bepaald wordt door de standaardcapaciteit profielafnemers te delen door
      de modelcapaciteit voor alle profielafnemers;
        - *fitfactor telemetriegrootverbruikers:* factor waarmee de maximaal gemeten capaciteit wordt toegerekend aan de
      plancapaciteit telemetriegrootverbruikers;
        - *flankmaand:* is de gasmaand maart, april, oktober of november;
        - *fysieke meteropname:* het door een netbeheerder, meetbedrijf of meetverantwoordelijke ter plaatse van de
      meetinrichting aflezen van (een) meterstand(en) van die meetinrichting;
        - *fysieke status van de aansluiting:* de aanduiding in het aansluitingenregister of de aansluiting fysiek
      aangesloten of fysiek afgesloten is, te weten of de aansluiting wel of niet beschikbaar is voor uitwisseling van
      elektriciteit of gas tussen het net en de aangesloten installatie;
        - *fysieke verbinding:* het T-stuk en de afsluiter als onderdeel van de aansluiting. In het geval van een
      aansluiting op het landelijk gastransportnet omvat de fysieke verbinding ook de meter;
        - *garantie van oorsprong voor gas uit hernieuwbare energiebronnen:* gegevens op een rekening die betrekking hebben
      op gas uit hernieuwbare energiebronnen en waarmee wordt aangetoond dat een producent met zijn installatie een
      hoeveelheid gas uit hernieuwbare energiebronnen heeft opgewekt;
        - *gas:* 1. aardgas dat bij een temperatuur van 15° Celsius en bij een druk van 1,01325 bar in gasvormige
      toestand verkeert en in hoofdzaak bestaat uit methaan of een andere stof die vanwege haar eigenschappen aan
      methaan gelijkwaardig is en 2. stof die: – is opgewekt in een productie-installatie die uitsluitend gebruik
      maakt van hernieuwbare energiebronnen of – is opgewekt in een hybride productie-installatie die gebruik maakt
      van zowel hernieuwbare als fossiele energiebronnen en – bij een temperatuur van 15° Celsius en bij een druk van
      1,01325 bar in gasvormige toestand verkeert en in hoofdzaak bestaat uit methaan of een andere stof die vanwege
      haar eigenschappen aan methaan gelijkwaardig is voor zover het mogelijk en veilig is deze stof overeenkomstig
      [hoofdstuk 2 van de Gaswet][ref9] te transporteren;
        - *gas uit hernieuwbare energiebronnen:* een stof die is opgewekt in een productie-installatie die uitsluitend
      gebruik maakt van hernieuwbare energiebronnen of is opgewekt met hernieuwbare energiebronnen in een hybride
      productie-installatie die ook gebruik maakt van fossiele energiebronnen;
        - *gasbedrijf:* een netbeheerder, een gasopslagbedrijf, een LNG-bedrijf of een natuurlijke persoon of een
      rechtspersoon die de productie, de aankoop of de levering van gas verricht, maar geen eindafnemer van dit gas is;
        - *gasdag:* een periode die begint om 06:00 uur van een kalenderdag en eindigt om 06:00 uur van de daaropvolgende
      kalenderdag. De datum van een gasdag zal zijn de datum waarop die gasdag begint zoals hiervoor omschreven;
        - *gasinstallatie:* het samenstel van gastechnisch materiaal en leidingen in gebruik bij een verbruiker na het
      overdrachtspunt bezien vanuit het gastransportnet;
        - *gasinstallatieverbinding:* de verbinding tussen de gasinstallatie en de aansluiting;
        - *gaskwaliteit:* de samenstelling van het gas alsmede de fysische eigenschappen ervan;
        - *gaskwartaal*: de periode die begint om 06.00 uur op de eerste dag van een kwartaal en die eindigt om 06.00 uur
      op de eerste dag van het volgende kwartaal, waarbij de eerst dag van een kwartaal 1 januari, 1 april, 1 juli of
      1 oktober is;
        - *gasmaand:* de periode die begint om 06.00 uur op de eerste dag van een kalendermaand en die eindigt om 06.00 uur
      op de eerste dag van de volgende kalendermaand;
        - *gasmeter:* deel van een meetinrichting waarmee het gasvolume onder bedrijfscondities wordt vastgesteld (niet-
      herleid volume);
        - *gasopslagbedrijf:* een ieder die een gasopslaginstallatie beheert;
        - *gasopslaginstallatie:* een installatie voor de opslag van gas, met inbegrip van het gedeelte van een LNG-
      installatie dat voor opslag wordt gebruikt, maar met uitzondering van het gedeelte dat wordt gebruikt voor
      gasproductie, en met uitzondering van installaties die uitsluitend ten dienste staan van de netbeheerder van het
      landelijk gastransportnet bij de uitvoering van zijn taken;
        - *gasproductienet:* een of meer pijpleidingen die onderdeel uitmaken van een olie- of gaswinningsproject of die
      worden gebruikt voor het transport van gas rechtstreeks van een gaswinningsproject naar een verwerkingsinstallatie,
      een opslagplaats of een aanlandingsplaats;
        - *gastransportnet:* niet tot een gasproductienet behorende, met elkaar verbonden leidingen of hulpmiddelen bestemd
      of gebruikt voor het transport van gas, met inbegrip van hulpmiddelen en installaties waarmee ondersteunende
      diensten voor dat transport worden verricht, behoudens voor zover deze leidingen en hulpmiddelen onderdeel uitmaken
      van een directe lijn of gelegen zijn binnen de installatie van de afnemer;
        - *geautoriseerde meterstand:* een door een erkende meetverantwoordelijke gevalideerde en valide bevonden
      meterstand;
        - *gesloten distributiesysteem:* een net, niet zijnde het landelijk gastransportnet: 1. dat ligt binnen een
      geografisch afgebakende industriële locatie, commerciële locatie of locatie met gedeelde diensten, 2. waarop minder
      dan 500 afnemers zijn aangesloten en 3. dat alleen niet-huishoudelijke afnemers van gas voorziet, tenzij er sprake
      is van incidenteel gebruik door een klein aantal huishoudelijke afnemers die werkzaam is bij of vergelijkbare
      betrekkingen heeft met de eigenaar van het gesloten distributiesysteem;
        - *grootverbruikaansluiting:* een aansluiting met een totale maximale capaciteit van groter dan 40 m3(n) per uur;
        - *grootverbruiker:* een verbruiker niet zijnde een kleinverbruiker;
        - *handelaar:* een organisatorische eenheid die zich bezighoudt met het sluiten van overeenkomsten betreffende de
      koop en verkoop van gas;
        - *handelaar in elektriciteit:* een handelaar als bedoeld in
      [artikel 1, onderdeel h, van de Elektriciteitswet 1998][ref10];
        - *herleidingsfactor:* de verhouding tussen het volume onder normaalcondities (herleid volume) en het volume onder
      bedrijfscondities (niet-herleid volume) over een bepaalde periode;
        - *hernieuwbare energiebronnen:* hernieuwbare energiebronnen als bedoeld in artikel 2 van de [richtlijn 2009/28/
      EG](32009L0028) van het Europees Parlement en de Raad van 23 april 2009 ter bevordering van het gebruik van energie
      uit hernieuwbare bronnen en houdende wijziging en intrekking van [Richtlijn 2001/77/EG](32001L0077) en [Richtlijn
      2003/30/EG](32003L0030) (Pb EU 2009, L 140);
        - *hoeveelheid energie:* gemeten gashoeveelheid maal calorische bovenwaarde; uitgedrukt in MJ of kWh;
        - *hogedruknet:* een net met een overdruk groter dan 200 mbar en kleiner of gelijk aan 8 bar;
        - *Hs:* calorische bovenwaarde;
        - *inhuizing:* een verhuizing waarbij een (rechts)persoon een onroerende zaak betrekt en de beschikkingsbevoegdheid
      over de aansluiting op zich neemt;
        - *interconnectiepunt:* een fysiek of virtueel punt dat twee aangrenzende entry-exitsystemen verbindt of dat
      een entry-exitsysteem verbindt met een interconnector voor zover op deze punten een boekingsprocedure door
      netgebruikers van toepassing is. De netbeheerder van het landelijk gastransportnet zal de voor haar relevante
      interconnectiepunten publiceren op haar website;
        - *invoeder:* een aangeslotene die gas invoedt in een gastransportnet;
        - *invoedingsinstallatie:* een installatie waarmee gas in een gastransportnet kan worden ingebracht;
        - *jaarverbruik:* het verwachte verbruik (uitgedrukt in m3(n; 35,17)) op een telemetriegrootverbruikaansluiting met
      afnamecategorie GGV in een jaar met gemiddelde klimaatcondities;
        - *jaarverbruik telemetriegrootverbruikers:* de werkelijk gemeten gasafname in m3(n;35,17) in de meest recente 12
      volledige gasmaanden voor telemetriegrootverbruikers als vastgelegd in de aansluitingenregisters van de regionale
      netbeheerders;
        - *Klantsleutel:* een bij een kleinverbruiker behorend identificatiekenmerk bestaande uit de laatste drie cijfers
      van diens IBAN of de dag en de maand van diens geboortedatum;
        - *kleinverbruikaansluiting:* een aansluiting met een totale maximale capaciteit van ten hoogste 40 m3(n) per uur,
      zoals bedoeld in de [Gaswet artikel 43, lid 1][ref11];
        - *kleinverbruiker:* de in [artikel 43, eerste lid, van de Gaswet][ref12] bedoelde afnemer;
        - *kubieke meter Groningen gas [m3(n;35,17)]:* een kubieke meter gas onder normaalcondities met een calorische
      bovenwaarde van 35,17 MJ;
        - *lagedruknet:* een net met een overdruk kleiner dan of gelijk aan 200 mbar;
        - *landelijk gastransportnet:* een gastransportnet, met uitzondering van een gastransportnet als bedoeld in
      artikel 18h, eerste lid, dat uitsluitend of in hoofdzaak is bestemd of wordt gebruikt voor het op landelijk niveau
      transporteren van gas;
        - *leverancier:* een organisatorische eenheid die zich bezig houdt met het leveren van gas;
        - *leverancier van elektriciteit:* een leverancier als bedoeld in
      [artikel 1, onderdeel f, van de Elektriciteitswet 1998][ref13];
        - *leveranciersregister:* administratie van bedrijfsgegevens en operationele contactgegevens van de leveranciers
      van elektriciteit of gas in Nederland;
        - *leveringsovereenkomst:* een overeenkomst tussen een leverancier en een verbruiker betreffende levering en afname
      van gas;
        - *leveringsvergunning:* een vergunning als bedoeld in [artikel 43, lid 1 van de Gaswet][ref14];
        - *LNG-bedrijf:* een ieder die een LNG-installatie beheert;
        - *LNG-installatie:* een installatie die gebruikt wordt voor het vloeibaar maken van gas, of voor de invoer, de
      verlading, of de hervergassing van vloeibaar gas, met inbegrip van ondersteunende diensten en tijdelijke opslag
      die nodig zijn voor het proces van hervergassing en de daaropvolgende levering aan het transportsysteem, met
      uitzondering van de gedeeltes van de installatie die gebruikt worden voor opslag;
        - *marktsegment:* de aanduiding in het aansluitingenregister van de categorie waartoe een aansluiting behoort, te
      weten: a. een kleinverbruikaansluiting, of b. een grootverbruikaansluiting, niet zijnde een artikel 1, lid 2 of 3-
      aansluiting, of c. een grootverbruikaansluiting, zijnde een artikel 1, lid 2 of 3-aansluiting;
        - *maxverbruik:* de bij een telemetriegrootverbruiker of ten behoeve van het netverlies RNB in een uur gedurende de
      drie recentste volledig verstreken wintermaanden gemeten hoogste gasafname in m3(n;35,17)/uur;
        - *meetbedrijf:* een organisatorische eenheid die zich bezighoudt met het collecteren, valideren en vaststellen van
      meetgegevens betreffende gas;
        - *meet- en regelinrichting:* de apparatuur bestemd voor het vaststellen van het getransporteerde gasvolume en het
      regelen en beveiligen van de gasdruk, inclusief een of meer noodzakelijke toebehoren;
        - *meetinrichting:* het gehele samenstel van apparatuur dat ten minste tot doel heeft het uitgewisselde gas te
      meten;
        - *meetinstallatie:* installatie welke gebruikt wordt om metingen te verrichten, zijnde een meetinrichting ter
      bepaling van de gashoeveelheid en de gashoeveelheid per uur of een installatie ter bepaling van de gaskwaliteit;
        - *meetmethode:* de aanduiding in het aansluitingenregister van de wijze waarop de energie-uitwisseling op de
      aansluiting wordt vastgesteld;
        - *meetverantwoordelijke:* een persoon die meetverantwoordelijkheid uitoefent en die daarvoor conform
      [bijlage 4 van de Meetcode elektriciteit][ref15] en/of [bijlage 3 van de Meetcode gas RNB](onbekend) is erkend;
        - *meetverantwoordelijkheid:* de verantwoordelijkheid van de aangeslotene voor het aanwezig zijn op de
      aansluiting van een op grond van [hoofdstuk 2 van de Meetcode gas RNB][ref16] vereiste meetinrichting,
      alsmede voor het correct en tijdig (doen) vaststellen en (doen) doorgeven van meetgegevens op grond van
      [hoofdstuk 6 van de informatiecode elektriciteit en gas][ref17];
        - *meterbeheerder:* een organisatorische eenheid die verantwoordelijk is voor ontwerp, plaatsing, beheer, onderhoud
      en verwijdering van de meetinrichting;
        - *meterplaatser:* een persoon, niet zijnde een netbeheerder, die conform [artikel 26ad, lid 6][ref18]
      of [artikel 26ae, lid 7 van de Elektriciteitswet 1998][ref19] of [artikel 13d, lid 6][ref20], of
      [artikel 13e, lid 7, van de Gaswet][ref21], op verzoek van een kleinverbruiker een meetinrichting plaatst bij een
      kleinverbruikaansluiting en die daarvoor conform [bijlage 4 van de Meetcode elektriciteit][ref22] en/of [bijlage 3
      van de Meetcode gas RNB](onbekend) is erkend;
        - *MP-erkenner:* de instantie die conform [bijlage 4 van de Meetcode Elektriciteit][ref23] en [bijlage 3 van de
      Meetcode gas RNB](onbekend) door de gezamenlijke netbeheerders is aangewezen om de meterplaatsers te erkennen;
        - *mutatiedatum:* de datum waarop door de netbeheerder de wijziging van stamgegevens in het aansluitingenregister
      wordt geëffectueerd;
        - *MV-register:* een register waarin de namen, adressen, telefoon- en faxnummers alsmede de
      gegevens ten behoeve van elektronische gegevensuitwisseling zijn vermeld van de op grond van
      [B4.2.1.1 van de Meetcode elektriciteit][ref24] en [B3.2.1.1 van de Meetcode gas RNB](onbekend) erkende
      meetverantwoordelijken;
        - *NC-BAL:* Verordening (EU) Nr. 312/2014 van de Commissie van 26 maart 2014 tot vaststelling van een netcode
      inzake gasbalancering van transmissienetten;
        - *NC-CAM:* Commissie Verordening (EU) 984/2013 van 14 oktober 2013 tot vaststelling van een netcode met betrekking
      tot capaciteitstoewijzingsmechanismes in gastransmissiesystemen en tot aanvulling van [Verordening (EG) nr.
      715/2009](32009R0715) van het Europees Parlement en de Raad;
        - *NC-TAR*: Verordening (EU) 2017/460 van de Commissie van 16 maart 2017 tot vaststelling van een netcode
      betreffende geharmoniseerde transmissietariefstructuren voor gas;
        - *netbeheerder:* een vennootschap die op grond van artikel 2 is aangewezen voor het beheer van een of meer
      gastransportnetten;
        - *netbeheerdersregister:* administratie van bedrijfsgegevens en operationele contactgegevens van de netbeheerders
      in Nederland;
        - *netgebied:* onderdeel van een regionaal gastransportnet van één regionale netbeheerder: a. dat
      wordt gebruikt als administratief verzamelpunt ten behoeve van de uitvoering van de allocatie van
      gasstromen van tussen het landelijk gastransportnet en een regionaal gastransportnet zoals bedoeld in
      [hoofdstuk 2 van de Allocatiecode gas][ref25], b. waarbinnen de invoeding, eventueel gecorrigeerd voor
      netkoppelingen tussen regionale gastransportnetten, gealloceerd wordt naar de afnemers, c. dat wordt begrensd
      door de aansluitingen en de systeemverbindingen die hiermee verbonden zijn, dat niet opdeelbaar is in twee of meer
      gebieden die op zichzelf ook weer een netgebied zouden kunnen vormen;
        - *netgebruiker:* degene voor wie met behulp van een gastransportnet het transport van gas wordt verricht;
        - *netkoppeling:* de verbinding tussen het landelijk gastransportnet en een regionaal gastransportnet dan wel
      de verbinding tussen een regionaal gastransportnet en een ander regionaal gastransportnet. In het laatstbedoelde
      geval bevat de netkoppeling tevens alle door de netbeheerder aangebrachte hulpmiddelen, zoals de meetinrichting,
      hoofdkranen, drukregelaars en beveiligingsinrichtingen;
        - *nettarief:* de door de aangeslotene verschuldigde bedragen als bedoeld in
      [artikel 95cb van de Elektriciteitswet 1998][ref26] en [artikel 44b van de Gaswet][ref27];
        - *niet op afstand uitleesbare kleinverbruikmeetinrichting:* een meetinrichting die niet voldoet aan het
      [Besluit op afstand uitleesbare meetinrichtingen][ref28];
        - *nieuwe [leverancier / programmaverantwoordelijke / meetverantwoordelijke]:* de [leverancier /
      programmaverantwoordelijke / meetverantwoordelijke] die voor een bepaalde aansluiting de rechten en plichten van
      een [leverancier / programmaverantwoordelijke / meetverantwoordelijke] zal gaan uitoefenen en die zich als zodanig
      in het aansluitingenregister heeft aangemeld of zal gaan aanmelden;
        - *nominatie of hernominatie:* het bericht – per portfolio – van de erkende programmaverantwoordelijke aan
      het dispatching centrum (CCP) van de netbeheerder van het landelijk gastransportnet, waarmee de erkende
      programmaverantwoordelijke voor elk uur van de desbetreffende gasdag de hoeveelheid gas die van een derde door de
      erkende programmaverantwoordelijke op een entrypunt zal worden afgenomen en de hoeveelheid gas die door de erkende
      programmaverantwoordelijke op een exitpunt aan een derde beschikbaar zal worden gesteld aan de netbeheerder van het
      landelijk gastransportnet bekend maakt;
        - *normaalcondities:* de condities die gelden bij een temperatuur van 273,15 K (0 °C) en een absolute druk van
      101,325 kPa (1,01325 bar);
        - *normaal kubieke meter [m3(n)]:* een hoeveelheid gas die onder normaalcondities een volume inneemt van één
      kubieke meter [m3];
        - *OBIS-code:* een code volgens het in IEC 62056-61 vastgelegde OBject Identification System, waarmee elementen van
      meetapparatuur kunnen worden geïdentificeerd;
        - *onbalans veroorzakende programmaverantwoordelijke:* een erkende programmaverantwoordelijke waarvan het teken van
      zijn portfolio onbalans signaal gelijk is aan het teken van het systeem balans signaal;
        - *onbemeten aansluiting:* een aansluiting waarbij op grond van
      [2.1.2.4 van de Aansluit- en transportcode gas RNB][ref29] geen meetinrichting aanwezig is;
        - *ondersteunende diensten:* de diensten die nodig zijn voor de toegang tot of de werking van gastransportnetten,
      LNG-installaties of opslaginstallaties, met inbegrip van het opvangen van fluctuaties in de belasting van het
      gastransportnet en menging, maar met uitzondering van de installaties die uitsluitend ten dienste staan van de
      netbeheerder van het landelijk gastransportnet bij de uitvoering van zijn taken;
        - *De Minister:* De Minister van Economische Zaken en Klimaat;
        - *op afstand uitleesbare kleinverbruikmeetinrichting:* een meetinrichting die voldoet aan het
      [Besluit op afstand uitleesbare meetinrichtingen][ref30];
        - *oude [leverancier / programmaverantwoordelijke / meetverantwoordelijke]:* de [leverancier /
      programmaverantwoordelijke / meetverantwoordelijke] die voor een bepaalde aansluiting de rechten en plichten zal
      gaan verliezen of heeft verloren en als gevolg daarvan uit het aansluitingenregister is verwijderd of zal worden
      verwijderd;
        - *overboekcapaciteit:* vaste entry- of exitcapaciteit die wordt aangeboden bovenop de technische capaciteit in het
      kader van de overboekings- en terugkoopregeling als bedoeld in artikel 2.2.2 van Bijlage 1 bij de Verordening;
        - *overdrachtspunt:* het punt waar het gastransportnet ophoudt. In het geval van een verbinding tussen het
      landelijk gastransportnet en een regionaal gastransportnet: het punt waar het landelijk gastransportnet ophoudt;
        - *P4:* onderdeel van de op afstand uitleesbare kleinverbruikmeetinrichting door middel waarvan de netbeheerder
      en de leverancier en in geval van een door de aangeslotene verstrekte machtiging een derde, toegang hebben tot de
      meetgegevens van die kleinverbruikmeetinrichting;
        - *plancapaciteit:* de totaal benodigde exitcapaciteit voor de exitpunten die een verbinding vormen
      tussen het landelijk gastransportnet en een regionaal gastransportnet zoals deze jaarlijks wordt
      vastgesteld in de planningscyclus van de netbeheerder van het landelijk gastransportnet en die
      gelijk is aan de exitcapaciteit die nodig is op een dag met omstandigheden zoals beschreven in
      [artikel 2 lid 1 van het Besluit leveringszekerheid Gaswet][ref31];
        - *plancapaciteit netverlies RNB:* de benodigde exitcapaciteit ten behoeve van het netverlies RNB voor de
      exitpunten die een verbinding vormen tussen het landelijk gastransportnet en een regionaal gastransportnet zoals
      deze jaarlijks wordt vastgesteld in de planningscyclus van de netbeheerder van het landelijk gastransportnet en die
      gelijk is aan de exitcapaciteit die nodig is om te voorzien in de capaciteitsbehoefte van het netverlies RNB op een
      dag met omstandigheden als beschreven in [artikel 2, eerste lid, van het Besluit leveringszekerheid Gaswet][ref32];
        - *plancapaciteit profielafnemers:* de benodigde exitcapaciteit ten behoeve van profielafnemers voor de exitpunten
      die een verbinding vormen tussen het landelijk gastransportnet en een regionaal gastransportnet zoals deze
      jaarlijks wordt vastgesteld in de planningscyclus van de netbeheerder van het landelijk gastransportnet en die
      gelijk is aan de exitcapaciteit die nodig is om te voorzien in de capaciteitsbehoefte van profielafnemers op een
      dag met omstandigheden als beschreven in [artikel 2, eerste lid, van het Besluit leveringszekerheid Gaswet][ref33];
        - *plancapaciteit telemetriegrootverbruikers:* de benodigde exitcapaciteit ten behoeve van
      telemetriegrootverbruikers voor de exitpunten die een verbinding vormen tussen het landelijk gastransportnet en
      een regionaal gastransportnet zoals deze jaarlijks wordt vastgesteld in de planningscyclus van de netbeheerder
      van het landelijk gastransportnet en die gelijk is aan de exitcapaciteit die nodig is om te voorzien in
      de capaciteitsbehoefte van telemetriegrootverbruikers op een dag met omstandigheden als beschreven in
      [artikel 2, eerste lid, van het Besluit leveringszekerheid Gaswet][ref34];
        - *portfolio:* verzameling van alle overeenkomsten met de netbeheerder van het landelijk gastransportnet die
      geregistreerd zijn onder een unieke code;
        - *portfolio onbalans signaal:* de netto cumulatieve afwijking van de entry- en/of exitprogramma’s in het portfolio
      van de erkende programmaverantwoordelijke op basis van de near-real-time allocaties;
        - *producent:* een organisatorische eenheid die zich bezig houdt met het produceren van gas;
        - *producent van elektriciteit:* een producent als bedoeld in
      [artikel 1, onderdeel g, van de Elektriciteitswet 1998][ref35];
        - *productiemeetgegevens:* de gegevens betreffende de hoeveelheid gas uit hernieuwbare energiebronnen die door een
      producent wordt ingevoed op een gastransportnet;
        - *profielafnemer:* een kleinverbruiker of een afnemer met een aansluitcapaciteit groter dan 40 m3(n)/uur die niet
      beschikt over een dagelijkse of uurlijkse afstanduitlezing van de meetinrichting op zijn aansluiting, en op grond
      van de [Meetcode gas RNB][ref36] daar ook niet over hoeft te beschikken;
        - *profielfactor telemetriegrootverbruiker:* factor die is afgeleid van de relatie tussen de door de netbeheerder
      van het landelijke gastransportnet ontvangen uurlijkse allocaties aan de telemetriegrootverbruikers en de
      gerealiseerde effectieve etmaaltemperatuur, waarbij het maximum van de allocaties per maand zijn geëxtrapoleerd
      tot de voor de betreffende maand geldende referentietemperatuur en waarbij de profielfactor voor de wintermaanden
      gelijk is aan 1;
        - *profielgrootverbruikaansluiting:* een grootverbruikaansluiting met de afnamecategorie G2C, zoals bedoeld in
      [paragraaf 4.3.1 van de Allocatiecode gas][ref37];
        - *profielgrootverbruiker:* een verbruiker met een profielgrootverbruikaansluiting;
        - *profielgrootverbruikmeetinrichting:* een meetinrichting die voldoet aan de in
      [4.3.3 van de Meetcode gas RNB][ref38] genoemde eisen;
        - *programmaverantwoordelijke:* degene op wie programmaverantwoordelijkheid rust;
        - *programmaverantwoordelijkheid:* de verantwoordelijkheid voor het opstellen van een programma als bedoeld in
      [artikel 17b, eerste of tweede lid, van de Gaswet][ref39];
        - *reconciliatieperiode:* de periode, die bij het uitvoeren van de reconciliatie ten hoogste in beschouwing wordt
      genomen; deze periode bestaat uit een veelvoud van volledige kalendermaanden, eindigend op de laatste gasdag van de
      vierde maand voor de huidige kalendermaand en niet beginnend vóór 1 juli 2004, en beslaat ten hoogste 17 maanden;
        - *recreatienet:* een net waarvoor niet op grond van [artikel 2, achtste lid, van de Gaswet][ref40]
      een netbeheerder is aangewezen en waarvan de onroerende zaken als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref41] waarmee het net een
      verbinding vormt ingevolge het bestemmingsplan, de WOZ-beschikking of een notariële akte recreatieve doeleinden
      hebben of ingevolge het bestemmingsplan, de WOZ-beschikking of een notariële akte niet bestemd zijn voor permanente
      bewoning en voor recreatieve doeleinden zijn bestemd;
        - *referentienummer:* een door de verzendende partij aan een bericht toe te kennen nummer waarmee het bericht en
      een eventuele reactie daarop in zijn administratie traceerbaar is;
        - *regionaal gastransportnet:* een gastransportnet waarvoor op grond van [artikel 2, lid 1 van de Gaswet][ref42]
      een netbeheerder is aangewezen, niet zijnde het landelijk gastransportnet;
        - *regionale netbeheerder:* beheerder van een regionaal gastransportnet;
        - *rekencapaciteit:* de desbetreffende rekencapaciteit genoemd in artikel
      [artikel 2.22, tweede lid van de Tarievencode gas][ref43];
        - *relatieve dichtheid:* de dichtheid van een gas gedeeld door de dichtheid van droge lucht van de standaard
      samenstelling volgens ISO 6976 bijlage B bij normaal condities. Symbool “d”; eenheid [–];
        - *richtlijn:* [Richtlijn nr. 2009/73/EG](32009L0073) van het Europese Parlement en de Raad 13 juli 2009
      betreffende gemeenschappelijke regels voor de interne markt voor aardgas en tot intrekking van [Richtlijn 2003/55/
      EG](32003L0055) (Pb EU 2009, L 211);
        - *standaardcapaciteit profielafnemers:* de plancapaciteit profielafnemers, verminderd met de
      exitcapaciteit benodigd voor pieklevering, als bedoeld en onder omstandigheden zoals omschreven in
      [artikel 2, eerste lid, van het Besluit leveringszekerheid Gaswet][ref44];
        - *standaardjaarverbruik (SJV):* het verwachte verbruik (uitgedrukt in m3(n; 35,17)) van een kleinverbruiker of een
      profielgrootverbruiker op een aansluiting in een jaar met gemiddelde klimaatcondities;
        - *statuscode:* een aanduiding van de status van meetdata in een bericht zoals bedoeld in 7.1.2.1 van de Meetcode
      gas RNB, waaruit blijkt of sprake is van door de meetverantwoordelijke op grond van een daadwerkelijke opname
      verkregen, gevalideerde en vastgestelde meetdata ofwel van door de meetverantwoordelijke door middel van schatting
      bepaalde meetdata;
        - *switch:* de wisseling van leverancier, programmaverantwoordelijke of meetverantwoordelijke op een aansluiting;
        - *syntactisch correct:* voldoet aan de specificaties, bedoeld in
      [9.1.1 van de Informatiecode elektriciteit en gas][ref45];
        - *systeem balans signaal:* de som van de portfolio onbalans signalen die door de netbeheerder van het landelijk
      gastransportnet gepubliceerd wordt;
        - *systeemverbinding:* een voorziening in het landelijk gastransportnet eindigend op het overdrachtspunt ten
      behoeve van een verbinding tussen het landelijk gastransportnet en een regionaal gastransportnet, omvattende
      pijpleidingen, inclusief noodzakelijke toebehoren, en de meet- en regelinrichting, via welke het gas wordt
      overgedragen van het landelijk gastransportnet naar het regionale gastransportnet;
        - *systeemverbindingsconfiguratie:* een geheel van systeemverbindingen ten behoeve van één regionale netbeheerder;
        - *telemetriegrootverbruikaansluiting:* een grootverbruikaansluiting met de afnamecategorie GXX of GGV, zoals
      bedoeld in [paragraaf 4.3.1 van de Allocatiecode gas][ref46];
        - *telemetriegrootverbruiker:* een verbruiker met een telemetriegrootverbruikaansluiting;
        - *telemetriegrootverbruikmeetinrichting:* een meetinrichting die voldoet aan de in
      [4.3.4 van de Meetcode gas RNB][ref47] genoemde eisen;
        - *telwerkindicatie:* de identificatie van de onderscheiden telwerken op een meetinrichting: a. bij een
      handopgenomen meetinrichting zoals zichtbaar op de meter zelf, en b. bij een meetinrichting die op afstand
      uitleesbaar is door middel van de OBIS-code;
        - *Tennet:* de netbeheerder van het landelijk hoogspanningsnet als bedoeld in
      [artikel 10 lid 2 van de Elektriciteitswet 1998][ref48];
        - *toegankelijk meetregister:* een register, bevattende vastgestelde meterstanden en verbruiken betreffende
      kleinverbruikaansluitingen;
        - *Toestemmingssleutel:* een door de leverancier toegekend uniek kenmerk aan de door hem van de klant ontvangen
      toestemming;
        - *transportcapaciteit:* hoeveelheid gas, uitgedrukt in m3(n;35,17)/uur of MJ/uur die in een uur maximaal kan
      worden getransporteerd;
        - *transportovereenkomst:* een overeenkomst tussen een netbeheerder en een netgebruiker betreffende het transport
      van gas;
        - *TTF:* de virtuele locatie, die dienst doet als een entrypunt en/of exitpunt, waar erkende
      programmaverantwoordelijken en/of handelaren gas kunnen overdragen;
        - *type aansluiting:* de aanduiding in het aansluitingenregister of de aansluiting geschikt is voor: a. uitsluitend
      transport van elektriciteit of gas vanuit het net naar de aangesloten installatie, of b. uitsluitend transport van
      elektriciteit of gas vanuit de aangesloten installatie naar het net, of c. een combinatie van beide;
        - *uitgelezen meterstand:* een meterstand die met behulp van elektronische hulpmiddelen ter plaatse van de
      meetinrichting of op afstand is uitgelezen;
        - *uithuizing:* een verhuizing waarbij een (rechts)persoon een onroerende zaak verlaat en de
      beschikkingsbevoegdheid over de aansluiting beëindigt;
        - *uur:* de periode van een klokuur, aanvangende op het gehele uur;
        - *uurmeting:* een meetinrichting, geïnstalleerd conform de [Meetcode gas RNB][ref49] of de
      [Meetcode gas LNB][ref50], waarmee de per uur afgenomen of ter beschikking gestelde hoeveelheid gas wordt
      geregistreerd en waarvan de meetgegevens worden gebruikt ten behoeve van de allocatie;
        - *vastgestelde meterstand:* een meterstand die na collectie en succesvolle validatie is vastgesteld door:
      a. het meetbedrijf (ingeval deze meterstand betrekking heeft op een kleinverbruikmeetinrichting) of b. de
      meetverantwoordelijke (ingeval deze meterstand betrekking heeft op een grootverbruikmeetinrichting);
        - *verbruiker:* een persoon die beschikt over een aansluiting op een gastransportnet, welke aansluiting bestemd is
      voor de afname van gas; indien de bedoelde persoon over meer dan één aansluiting beschikt, wordt hij voor iedere
      aansluiting beschouwd als één verbruiker;
        - *vergunninghouder:* een houder van een leveringsvergunning als bedoeld in [artikel 43 van de Gaswet][ref51];
        - *verliesbericht:* het bericht waarmee de netbeheerder aan de oude leverancier, oude programmaverantwoordelijke
      of oude meetverantwoordelijke aankondigt dat de desbetreffende marktpartij met ingang van de datum in het
      verliesbericht de rechten en plichten voor de in het verliesbericht vermelde aansluiting zal verliezen;
        - *vermenigvuldigingsfactor:* in geval van elektriciteit het samenstel van alle correctiefactoren met betrekking
      tot de fysieke meting die nodig zijn om uit de tellerstanden de daadwerkelijke hoeveelheid met het net
      uitgewisselde energie te kunnen vaststellen; In geval van gas het product van alle specifiek voor de meetinrichting
      van toepassing zijnde factoren op telwerkniveau met uitzondering van de volumeherleidingsfactor om tot een
      normaalvolume te komen;
        - *Verordening 713/2009:* [Verordening nr. 713/2009](32009R0713) van het Europees Parlement en de Raad van 13 juli
      2009 tot oprichting van een agentschap voor de samenwerking tussen energieregulators (Pb EU 2009, L 211);
        - *Verordening 715/2009:* [Verordening nr. 715/2009](32009R0715) van het Europees Parlement en de Raad betreffende
      de voorwaarden voor de toegang tot aardgastransmissienetten en tot intrekking van [Verordening (EG) nr. 1775/2005]
      (32005R1775) (Pb EU 2009, L 211);
        - *verwant bedrijf:* verbonden onderneming in de zin van artikel 41 van de zevende [richtlijn nr. 83/349/EEG]
      (31983L0349) van de Raad van 13 juni 1983 op de grondslag van artikel 54, derde lid, sub g, van het Verdrag
      betreffende de geconsolideerde jaarrekening of een geassocieerde onderneming in de zin van artikel 33, eerste lid,
      daarvan of een onderneming die aan dezelfde aandeelhouders toebehoort;
        - *verwervingsbericht:* het bericht waarmee de netbeheerder aan de nieuwe leverancier, nieuwe
      programmaverantwoordelijke of nieuwe meetverantwoordelijke bevestigt dat de desbetreffende marktpartij met
      ingang van de datum in het verwervingsbericht de rechten en plichten voor de in het verwervingsbericht vermelde
      aansluiting zal verkrijgen;
        - *Virtueel Punt Programma Verantwoordelijkheid (VPPV):* het virtuele punt zoals bedoeld in
      [artikel 17b, eerste en tweede lid van de Gaswet][ref52];
        - *volumeherleidingsfactor:* onder volumeherleidingsfactor wordt een standaard factor begrepen, waarmee het
      volume gemeten met een niet temperatuur gecorrigeerde meetinrichting wordt herleid, uitgaande van een gemiddelde
      temperatuur en een gemiddelde luchtdruk. Op grond van de 7-gradenmethode wordt deze factor bepaald op 1. Op grond
      van de 15-gradenmethode wordt deze factor bepaald op 0,97624;
        - *volumeherleidingsinstrument:* deel van een meetinrichting waarmee het volume onder bedrijfscondities wordt
      omgerekend naar volume onder normaalcondities;
        - *WDM:* de Within Day Market als bedoeld in de NC-BAL (kortetermijnmarkt voor de groothandel);
        - *WDM-temporaltransactie:* een WDM-transactie waarbij levering of afname plaatsvindt in het eerste volle uur na de
      WDM-transactie, conform artikel 7.5 van de NC-BAL;
        - *WDM-titletransactie:* een WDM-transactie waarbij levering of afname plaatsvindt in de resterende uren van de
      lopende gasdag, conform artikel 7.3 van de NC-BAL, uitgezonderd een transactie die om 2:15, 3:15, 4:15 of 5:15 uur
      aangegaan wordt, waarbij levering of afname plaatsvindt gedurende de volgende gasdag;
        - *WDM-transactie:* een koop- of verkooptransactie, aangegaan door de netbeheerder van het landelijk
      gastransportnet, op een gasbeurs, waarbij levering of afname plaats vindt in één of meerdere uren; zijnde de WDM-
      titletransactie of de WDM-temporaltransactie;
        - *WDM-transactieprijs:* de prijs die de netbeheerder van het landelijk gastransportnet betaalt of ontvangt voor
      een WDM-transactie; indien de netbeheerder van het landelijk gastransportnet meerdere WDM-transacties gelijktijdig
      aangaat, is de WDM-transactieprijs de volumegewogen gemiddelde prijs van de gezamenlijk aangegane WDM-transacties;
        - *werkdag:* een dag niet zijnde een zaterdag of een zondag, die niet is een algemeen erkende feestdag als bedoeld
      in [artikel 3, eerste lid, van de Algemene Termijnenwet][ref53], noch een in het tweede of krachtens het derde lid
      van genoemd artikel met een algemeen erkende feestdag gelijkgestelde dag;
        - *wintermaand:* is de gasmaand januari, februari of december;
        - *Wobbe index:* de calorische bovenwaarde gedeeld door de vierkantswortel van de relatieve dichtheid, Symbool “W”;
      eenheid [MJ/m3(n)];
        - *Wobbelabel:* een van de labels die de netbeheerder van het landelijk gastransportnet aan een entrypunt of
      exitpunt toekent;
        - *zomermaand:* is de gasmaand mei, juni, juli, augustus of september;


