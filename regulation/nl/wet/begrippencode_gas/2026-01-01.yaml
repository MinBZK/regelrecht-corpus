  - number: '2.1'
    text: |-
      De Begrippenlijst Gas, zoals vastgesteld bij besluit van 27 juni 2006 en nadien diverse malen gewijzigd, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037923/2026-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037923/2026-01-01#Artikel2.2
  - number: '2.3'
    text: 'Dit besluit wordt aangehaald als: Begrippencode gas.'
    url: https://wetten.overheid.nl/BWBR0037923/2026-01-01#Artikel2.3
