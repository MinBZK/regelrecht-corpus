        artikel: '6'
      - id: ref4
        bwb_id: BWBR0007109
        artikel: '3'
        paragraaf: '1'
  - number: '8'
    text: |-
      Indien de aanvraag betrekking heeft op een spoorwegaansluiting ten behoeve van een of meer verladers bedraagt de
      bijdrage 50 procent van de kosten voor investeringen als bedoeld in [artikel 2][ref1], met een maximum van f 1,5
      miljoen:

      a. voorzover per f 100.000,– bijdrage door de aanvrager een vervoergarantie van gemiddeld 10,000 ton vracht per
      jaar of gemiddeld 400 twee-as-equivalenten per jaar gedurende een periode van tenminste vijf jaar wordt verstrekt,
      en

      b. voorzover ten minste 50 procent van de kosten met niet van overheidswege verstrekte middelen wordt gefinancierd.


      [ref1]: https://wetten.overheid.nl/BWBR0007109#Artikel2
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007109
        artikel: '2'
        paragraaf: '1'
  - number: '9'
    text: |-
      Indien de aanvraag betrekking heeft op een spoorwegaansluiting ten behoeve van naar het oordeel van de
      Minister innoverend vervoer bedraagt de bijdrage 70 procent van de kosten voor investeringen als bedoeld in
      [artikel 2][ref1], met een maximum van f 1,5 miljoen:

      a. voorzover per f 100.000,– bijdrage door de aanvrager een vervoergarantie van gemiddeld 10.000 ton vracht per
      jaar of gemiddeld 400 twee-as-equivalenten per jaar gedurende een periode van tenminste vijf jaar wordt verstrekt,
      en

      b. voorzover ten minste 30 procent van de kosten met niet van overheidswege verstrekte middelen wordt gefinancierd.


      [ref1]: https://wetten.overheid.nl/BWBR0007109#Artikel2
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007109
        artikel: '2'
        paragraaf: '1'
  - number: '10'
    text: |-
      De aanvrager draagt zorg voor:

      a. een overzichtelijke en doelmatige administratie met betrekking tot het project, welke een juist, volledig en
      actueel inzicht geeft in de voortgang van het project, in de projectkosten en in de besteding van de bijdrage;

      b. het bewaren van de bewijsstukken van de projectkosten gedurende ten minste vijf jaar na afloop van het project;

      c. het tonen van de bescheiden op één adres;

      d. het in acht nemen van nadere aanwijzingen van de Minister ter zake van de administratie;

      e. het op verzoek van de Minister verlenen van medewerking aan de openbaarmaking van de resultaten van het project;

      f. het op verzoek van de Minister verlenen van medewerking aan een evaluatie van deze regeling;

      g. het onverwijld aan de Minister meedelen van de indiening van een verzoek als bedoeld in [artikel 6][ref1];

      h. het onverwijld aan de Minister meedelen van overige omstandigheden die van invloed kunnen zijn op de bijdrage,
      en

      i. het overleggen van een jaarlijkse rapportage aan de Minister van de hoeveelheid lading die via de betrokken
      spoorwegaansluiting is overgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0007109#Artikel6
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007109
        artikel: '6'
        paragraaf: '3'
  - number: '11'
    text: |-
      1 De door de Minister aangewezen toezichthouders zijn bevoegd inlichtingen te verlangen en inzage te verlangen van
      zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van hun taak redelijkerwijs nodig is.

      2 Zij zijn bevoegd van de gegevens en bescheiden kopieën te maken.

      3 Indien het maken van kopieën niet ter plaatse kan geschieden, zijn zij bevoegd de gegevens en bescheiden voor dat
      doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel11
  - number: '12'
    text: |-
      1 De toezichthouders zijn bevoegd elke plaats te betreden, met uitzondering van een woning zonder toestemming van
      de bewoner, voor zover dat voor de vervulling van hun taak redelijkerwijs nodig is.

      2 Zij zijn bevoegd zich te doen vergezellen door personen die daartoe door hen zijn aangewezen, voor zover dit voor
      het doel van het betreden redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel12
  - number: '13'
    text: |-
      1 De Minister stelt de definitieve bijdrage vast binnen vier weken na de indiening van de stukken, bedoeld in
      [artikel 14, tweede lid][ref1], van het Besluit.

      2 De Minister betaalt de in het eerste lid bedoelde bijdrage uit binnen tien weken na de vaststelling, onder
      verrekening van de reeds betaalde bedragen (slotdeclaratie).

      3 Voor zover de reeds betaalde bedragen de vastgestelde bijdrage overschrijden, zijn deze terstond en zonder enige
      ingebrekestelling opeisbaar.

      4 Vaststelling vindt niet plaats zolang op een verzoek tot surséance van betaling of faillissement van de aanvrager
      niet onherroepelijk is beslist door de rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel14
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '14'
  - number: '14'
    text: |-
      Het project kan met toestemming van de Minister tussentijds worden beëindigd. Aan deze beëindiging kan de Minister
      nadere voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel14
  - number: '15'
    text: |-
      1 In ieder geval kan de Minister de bijdrage geheel of gedeeltelijk intrekken, indien:

      a. niet is voldaan aan deze regeling of aan het bepaalde bij of krachtens de [Wet Infrastructuurfonds][ref1],

      b. hij de bijdrage heeft verleend op basis van zodanig onjuiste of onvolledige informatie, dat hij een andere
      beslissing op de aanvraag zou hebben genomen, indien hem de juiste gegevens waren verstrekt;

      c. het project tussentijds wordt beëindigd;

      d. de aanvrager onherroepelijk is failliet verklaard, of

      e. de vervoersgarantie als bedoeld in [artikel 8][ref2] niet is nagekomen.

      2 De reeds betaalde bedragen zijn bij intrekking van de bijdrage terstond en zonder enige ingebrekestelling
      opeisbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006001
      [ref2]: https://wetten.overheid.nl/BWBR0007109#Artikel8
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006001
      - id: ref2
        bwb_id: BWBR0007109
        artikel: '8'
        paragraaf: '3'
  - number: '16'
    text: |-
      In 2000 brengt de Minister een rapport uit, houdende evaluatie van de doelmatigheid en doeltreffendheid van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel16
  - number: 16a
    text: |-
      De Minister geeft na 31 december 2000 geen toepassing meer aan [paragraaf 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007109#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel16a
    references:
