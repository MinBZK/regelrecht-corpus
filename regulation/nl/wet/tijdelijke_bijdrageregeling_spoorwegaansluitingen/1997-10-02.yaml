        artikel: '9'
        paragraaf: '3'
  - number: '5'
    text: |-
      1 De Minister beslist op de aanvragen in volgorde van binnenkomst, waarbij aanvragen die betrekking hebben op
      investeringen ten aanzien waarvan een eerdere aanvraag is afgewezen op grond van [artikel 7, onderdeel d][ref1],
      voorrang hebben.

      2 De Minister kan aan de verlening van een bijdrage nadere voorschriften verbinden.

      3 De Minister kan alvorens op de aanvraag te beslissen binnen een door hem gestelde termijn nadere gegevens van de
      aanvrager verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007109#Artikel7
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007109
        artikel: '7'
        paragraaf: '3'
  - number: '6'
    text: |-
      De Minister beslist niet op de aanvraag zolang op een verzoek tot surséance van betaling of faillissement van de
      aanvrager de rechter niet onherroepelijk heeft beslist.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel6
  - number: '7'
    text: |-
      De Minister wijst de aanvraag in ieder geval af, indien:

      a. niet is voldaan aan het bepaalde bij of krachtens de [Wet Infrastructuurfonds][ref1];

      b. door toepassing van [artikel 6][ref2] van deze regeling de beslistermijn, bedoeld in
      [artikel 6, eerste lid][ref3], van het Besluit zou worden overschreden;

      c. de aanvrager niet heeft aangetoond, dat hem met inbegrip van de aangevraagde bijdrage voldoende gelden ter
      beschikking zullen staan om het voorgenomen project uit te voeren;

      d. door inwilliging het subsidieplafond, bedoeld in [artikel 3][ref4], zou worden overschreden, of

      e. inwilliging van de aanvraag naar zijn oordeel niet doelmatig zou zijn ten opzichte van het vigerende verkeers-
      en vervoersbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006001
      [ref2]: https://wetten.overheid.nl/BWBR0007109#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006264#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007109#Artikel3
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006001
      - id: ref2
        bwb_id: BWBR0007109
        artikel: '6'
        paragraaf: '3'
