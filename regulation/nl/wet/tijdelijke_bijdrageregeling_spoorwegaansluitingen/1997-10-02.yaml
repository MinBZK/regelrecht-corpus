articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *spoorwegaansluiting:*


              spoorweg als bedoeld in [artikel 1, onderdeel c, van het Reglement op de Raccordementen 1966][ref1];




              *Minister:*


              Minister van Verkeer en Waterstaat;




              *Besluit:*


              [Besluit Infrastructuurfonds][ref2];




              *bijdrage:*


              bijdrage voor een investering, bedoeld in [artikel 9][ref3] van het Besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002526#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006264
      [ref3]: https://wetten.overheid.nl/BWBR0006264#Artikel9
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002526
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006264
      - id: ref3
        bwb_id: BWBR0006264
        artikel: '9'
  - number: '2'
    text: |-
      1 De Minister kan bijdragen verstrekken voor investeringen in spoorwegaansluitingen op of naar bedrijfsterreinen
      dan wel in of naar havengebieden ten behoeve van het goederenvervoer, waaronder mede begrepen de uitbreiding van
      bestaande spoorwegaansluitingen of de reactivering van in onbruik geraakte spoorwegaansluitingen.

      2 De in het eerste lid bedoelde bijdrage kan mede betrekking hebben op aanvullende investeringen in vaste
      installaties die direct samenhangen met de overslag van goederen per spoor.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel2
  - number: '3'
    text: |-
      1 De Minister stelt in het meerjarenprogramma het subsidieplafond vast dat geldt voor de uitvoering van deze
      regeling in het eerstvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel3
  - number: '4'
    text: |-
      1 De aanvraag om een bijdrage wordt ingediend door tussenkomst van de Hoofdingenieur-Directeur van Rijkswaterstaat
      in de betrokken regio.

      2 Bij een aanvraag verstrekt de aanvrager, onverminderd het bepaalde in [artikel 4, eerste lid][ref1], van het
      Besluit:

      a. een onderbouwing van het project;

      b. een overzicht van de financiering van het project;

      c. een vervoersgarantie van de aanvrager als bedoeld in [artikel 8][ref2] onderscheidenlijk [artikel 9][ref3];

      d. een overzicht van alle maatregelen die voor de totstandbrenging van de spoorwegaansluiting moeten worden
      getroffen, en

      e. een opgave van het jaar waarin het project wordt voltooid.

      3 Indien een aanvraag niet volledig is, stelt de Minister de aanvrager in de gelegenheid binnen vier weken de
      aanvraag aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007109#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007109#Artikel9
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
      - id: ref2
