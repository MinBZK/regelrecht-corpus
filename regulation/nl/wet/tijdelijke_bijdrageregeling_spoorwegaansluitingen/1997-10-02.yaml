        paragraaf: '3'
  - number: '17'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel17
  - number: '18'
    text: |-
      Deze regeling wordt aangehaald als:

      Tijdelijke bijdrageregeling spoorwegaansluitingen.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007109/1997-10-02#Artikel18
