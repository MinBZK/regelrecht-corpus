$id: uitvoeringswet_verordening_europees_bevel_tot_conservatoir_beslag_op_bankrekeningen
regulatory_layer: WET
publication_date: '2016-11-25'
valid_from: '2017-01-18'
bwb_id: BWBR0038749
url: https://wetten.overheid.nl/BWBR0038749/2017-01-18
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat Verordening (EU) Nr. 655/2014 van het Europees Parlement en de
    Raad van 15 mei 2014 tot vaststelling van een procedure betreffende het Europees bevel tot conservatoir beslag
    op bankrekeningen om de grensoverschrijdende inning van schuldvorderingen in burgerlijke en handelszaken te
    vergemakkelijken (PbEU 2014, L 189) moet worden uitgevoerd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder «de verordening»: Verordening (EU) Nr. 655/2014 van het Europees Parlement en
      de Raad van 15 mei 2014 tot vaststelling van een procedure betreffende het Europees bevel tot conservatoir beslag
      op bankrekeningen om de grensoverschrijdende inning van schuldvorderingen in burgerlijke en handelszaken te
      vergemakkelijken (PbEU 2014, L 189).
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel1
  - number: '2'
    text: |-
      1 De bevoegde instantie als bedoeld in artikel 4, veertiende lid, van de verordening is de deurwaarder als bedoeld
      in de Gerechtsdeurwaarderswet.

      2 Onverminderd de verordening, legt de deurwaarder het Europees bevel tot conservatoir beslag
      ten uitvoer, als bedoeld in artikel 23 van de verordening, overeenkomstig de [Eerste][ref1] en
      [Vierde afdeling van de Vierde titel van het Derde boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingEerste
      [ref2]: https://wetten.overheid.nl/BWBR0001827#AfdelingVierde
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        afdeling: Vierde
  - number: '3'
    text: |-
      1 Het gerecht dat bevoegd is om een Europees bevel tot conservatoir beslag uit te vaardigen, als bedoeld in artikel
      6, eerste, tweede en vierde lid, van de verordening, is de voorzieningenrechter van de rechtbank.

      2 Het gerecht dat bevoegd is om een Europees bevel tot conservatoir beslag uit te vaardigen, als bedoeld in artikel
      6, derde lid, van de verordening, is de voorzieningenrechter van de rechtbank waar de rechterlijke beslissing
      is gegeven of de gerechtelijke schikking is goedgekeurd of getroffen. Is de rechterlijke beslissing gegeven of
      de gerechtelijke schikking goedgekeurd of getroffen door een gerechtshof, dan is de voorzieningenrechter van de
      rechtbank die zich bevindt in het ressort van het gerechtshof bevoegd.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van artikel 10, tweede lid, tweede volzin, van de verordening, eindigt
      het Europees bevel tot conservatoir beslag doordat het beslag vervalt als bedoeld in
      [artikel 700, derde lid, laatste zin van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
  - number: '5'
    text: |-
      1 De informatie-instantie, als bedoeld in artikel 4, dertiende lid, van de verordening, is de deurwaarder.

      2 De deurwaarder is bevoegd een verzoek voor het verkrijgen van rekeninginformatie in te dienen bij banken, als
      bedoeld in artikel 4, tweede lid, van de verordening, gevestigd in Nederland. Deze zijn verplicht hierop met
      bekwame spoed te antwoorden.

      3 De bank die overeenkomstig het tweede lid informatie heeft verstrekt, stelt de schuldenaar niet in kennis van het
      verzoek om rekeninginformatie totdat het bevel tot conservatoir beslag is uitgevoerd door de bank.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel5
  - number: '6'
    text: |-
      1 Het gerecht dat op grond van artikel 21, tweede lid, van de verordening, bevoegd is kennis te nemen van het
      hoger beroep tegen een beslissing waarbij het verzoek om een Europees bevel tot conservatoir beslag geheel of
      gedeeltelijk wordt afgewezen, als bedoeld in artikel 21, eerste lid, van de verordening, is het gerechtshof.

      2 Het gerecht dat bevoegd is kennis te nemen van de rechtsmiddelen, als bedoeld in de artikelen 33, 34 en 35,
      eerste, derde en vierde lid, van de verordening, is de voorzieningenrechter van de rechtbank.

      3 Het gerecht dat bevoegd is kennis te nemen van het hoger beroep, als bedoeld in artikel 37 van de verordening,
      tegen de rechtsmiddelen als bedoeld in de artikelen 33, 34 en 35, eerste, derde en vierde lid, van de verordening,
      is het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel6
  - number: '7'
    text: |-
      Het hoger beroep, als bedoeld in artikel 21 van de verordening, en de rechtsmiddelen, als bedoeld in hoofdstuk 4
      van de verordening, worden, op grond van artikel 41 van de verordening, ingesteld door een advocaat.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel7
  - number: '8'
    text: |-
      1 De verklaring als bedoeld in artikel 25, eerste lid, van de verordening wordt afgegeven door de bank waaronder
      beslag is gelegd.

      2 In gevallen als bedoeld in artikel 25, tweede lid, van de verordening wordt de verklaring toegezonden aan de
      deurwaarder die het beslag heeft gelegd. De deurwaarder zendt het stuk vervolgens overeenkomstig artikel 25, tweede
      lid, van de verordening aan het gerecht en de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel8
  - number: '9'
    text: |-
      De betekening of kennisgeving aan de schuldenaar, als bedoeld in artikel 28, tweede en derde lid, van de
      verordening, geschiedt op initiatief van de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel9
  - number: '10'
    text: |-
      Een verzoek om een Europees bevel tot conservatoir beslag wordt voor de toepassing van artikel 42 van de
      verordening aangemerkt als een verzoek van onbepaalde waarde als bedoeld in de [bijlage behorend bij de Wet
      griffierechten in burgerlijke zaken](onbekend).
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel10
  - number: '11'
    text: |-
      De vergoeding, als bedoeld in artikel 44 van de verordening, die door de deurwaarder in rekening wordt
      gebracht voor de tenuitvoerlegging van een Europees bevel tot conservatoir beslag of voor de verstrekking
      van rekeninginformatie als bedoeld in artikel 14 van de verordening, wordt vastgesteld overeenkomstig het
      [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012638
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012638
  - number: '12'
    text: |-
      1 In aanvulling op hetgeen uit de verordening of uit deze wet voortvloeit, zijn de regels inzake de
      verzoekschriftprocedure van toepassing op een ingediend verzoek om een Europees bevel tot conservatoir beslag.

      2 In aanvulling op hetgeen uit de verordening of uit deze wet voortvloeit, gelden voor de rechtsmiddelen, als
      bedoeld in de artikelen 33, 34 en 35, eerste, derde en vierde lid, van de verordening, en het hoger beroep tegen
      deze rechtsmiddelen, als bedoeld in artikel 37 van de verordening, de regels die gelden voor vorderingen.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel12
  - number: '14'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet verordening Europees bevel tot conservatoir beslag op bankrekeningen.'
    url: https://wetten.overheid.nl/BWBR0038749/2017-01-18#Artikel15
