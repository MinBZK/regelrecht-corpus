---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatiebesluit_ministerie_van_financien_2020
regulatory_layer: WET
publication_date: '2026-04-02'
valid_from: '2026-01-01'
bwb_id: BWBR0043027
url: https://wetten.overheid.nl/BWBR0043027/2026-01-01
preamble:
  text: |-
    Gelet op artikel 10:3 van de Algemene wet bestuursrecht;

    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      *het ministerie van Financiën:* het kernministerie, de Belastingdienst en de inspectie belastingen, toeslagen en
      douane;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.b
    text: |-
      *het kernministerie:* de Generale Thesaurie, het directoraat-generaal Rijksbegroting, het directoraat-generaal
      Fiscale Zaken, het cluster secretaris-generaal, de regeringscommissaris en het bureau van de belangenbehartiger
      voor belastingplichtigen en toeslaggerechtigden;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.c
    text: '*de Belastingdienst:* de directoraten-generaal Belastingdienst, Toeslagen en Douane;'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.d
    text: '*de minister:* de Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.e
    text: '*de staatssecretaris:* de Staatssecretaris van Financiën;'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.f
    text: '*bewindspersoon:* de Minister of de Staatssecretaris van Financiën;'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.g
    text: |-
      *algemene leiding:* de secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal en de
      thesaurier-generaal;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.h
    text: '*mandaat:* de bevoegdheid om in naam van een bewindspersoon besluiten te nemen;'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.i
    text: |-
      *(hoofd)budgethouder:* hoofd van een organisatie-eenheid verantwoordelijk voor het financieel beheer van één of
      meer budgetten;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.j
    text: |-
      *bedrijfsvoering:* onderwerpen op de terreinen van personeel en organisatie, informatievoorziening en ict, inkoop,
      huisvesting, facilitaire zaken en beveiliging;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.k
    text: |-
      *eigenaar:* degene die oog houdt voor stabiliteit en continuïteit van een organisatie en is verantwoordelijk voor
      het inrichten en faciliteren van de governancestructuur gebaseerd op het rijksbreed toegepaste driehoeksmodel;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.l
    text: |-
      *opdrachtnemer:* degene die verantwoordelijk is voor een doelmatige, doeltreffende en rechtmatige uitvoering van
      (fiscale) wet- en regelgeving en de verantwoording hierover;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.m
    text: |-
      *opdrachtgever:* degene die verantwoordelijk is voor een uitvoerbare formulering van de beleidsopdracht, met een zo
      concreet mogelijke omschrijving van de gewenste beleidsdoelen en resultaatafspraken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: 1.n
    text: |-
      *coördinerend opdrachtgever:* degene die de integrale benadering van beleid en uitvoering bevordert via de
      coördinatie van de beleid- en opdrachtcyclus in nauwe samenwerking met de opdrachtgever en de opdrachtnemer.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel1
  - number: '2'
    text: |-
      Het ministerie werkt aan een goede financiële huishouding van Nederland, int belastingen op basis van solide
      fiscale regelgeving en ziet toe op een doelmatige besteding van overheidsgeld. Het ministerie maakt regels voor het
      goed functioneren van het financiële stelsel en werkt aan een sterke economische structuur die verankerd is in een
      economisch en financieel gezond Europa. De algemene leiding hanteert de basiswaarden van het ministerie en draagt
      zorg voor de bevordering van deze waarden onder de medewerkers. Zij stimuleert de toewijding, de deskundigheid,
      de professionaliteit en de aanspreekbaarheid van de medewerkers. De algemene leiding geeft ruimte aan talent in
      de organisatie en bevordert de samenwerking tussen dienstonderdelen en met andere ministeries. De algemene leiding
      legt over de bedrijfsvoering en het beheer van de haar toevertrouwde middelen op inzichtelijke wijze verantwoording
      af.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Overeenkomstig
      __REF000___________________________________________________________________________________________________________
      ____, is de secretaris-generaal (de SG), met inachtneming van de aanwijzingen van de Minister, belast met de
      ambtelijke leiding van al hetgeen het ministerie betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004419#Artikel1
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004419
        artikel: '1'
  - number: '3.2'
    text: |-
      De SG is verantwoordelijk voor de beleidsterreinen van de direct onder hem ressorterende directies en
      diensten, behorende tot het SG-cluster, voor de samenhang tussen die beleidsterreinen en voor de bijbehorende
      bedrijfsvoering. De SG geeft leiding aan de onder hem ressorterende directeuren.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: '3.3'
    text: 'De SG is verantwoordelijk voor de volgende organisatieonderdelen binnen het cluster SG:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: 3.3.a
    text: de directie Financieel-Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: 3.3.b
    text: de directie Algemene Financiële en Economische Politiek.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      De SG vervult de rol van eigenaar voor de zelfstandige bestuursorganen Autoriteit Financiële Markten (AFM) en De
      Nederlandsche Bank (DNB).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: '3.5'
    text: 'Bij afwezigheid van de secretaris-generaal treedt als plaatsvervanger op:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: 3.5.a
    text: |-
      de thesaurier-generaal ten aanzien van de ambtelijke leiding op het terrein van het beleid van het directoraat-
      generaal Fiscale Zaken, het directoraat-generaal Rijksbegroting, de Generale Thesaurie, de directie Financieel-
      Economische Zaken en de directie Algemene Financiële en Economische Politiek;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: 3.5.b
    text: de plaatsvervangend secretaris-generaal voor de overige verantwoordelijkheden.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel3
  - number: '4.1'
    text: Er is een bestuursraad.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      De bestuursraad overlegt regelmatig over de hoofdlijnen van beleidsontwikkeling en -uitvoering, over de hoofdlijnen
      van de departementale bedrijfsvoering en over al het andere dat nodig is voor een goed functioneren van het
      ministerie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: '4.3'
    text: 'De leden van de bestuursraad zijn:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.a
    text: de SG;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.b
    text: de directeur-generaal Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.c
    text: de directeur-generaal Toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.d
    text: de directeur-generaal Douane;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.e
    text: de directeur-generaal voor Fiscale Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.f
    text: de directeur-generaal van de Rijksbegroting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.g
    text: de thesaurier-generaal;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.h
    text: de pSG;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: 4.3.i
    text: de directeur Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: '4.4'
    text: De directie Bestuursondersteuning en Advies (BOA) verzorgt het secretariaat van de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel4
  - number: '5.1'
    text: 'De plaatsvervangend secretaris-generaal (de pSG) is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.1.a
    text: |-
      de integrale ontwikkeling en realisering van de strategische doelstellingen op bedrijfsvoeringgebied voor het
      kernministerie en de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.1.b
    text: de afstemming van de bedrijfsvoering op het primaire proces van het kernministerie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: '5.2'
    text: 'De pSG is verantwoordelijk voor de volgende organisatieonderdelen binnen het cluster SG:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.a
    text: de directie Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.b
    text: de concerndirectie Veiligheid, Toezicht en Integriteitsonderzoek;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.c
    text: de directie Juridische Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.d
    text: de directie Bestuursondersteuning en Advies;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.e
    text: de directie Communicatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.f
    text: de (tijdelijke) programmadirectie Informatie op Orde;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.g
    text: de concerndirectie Informatievoorziening en Openbaarmaking;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.h
    text: de concerndirectie Mens en Organisatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.i
    text: de Auditdienst Rijk;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.j
    text: de dienst Domeinen Roerende Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.2.k
    text: de Dienst Financieel-Economische Integriteit.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      De pSG vervult de rol van eigenaar voor de volgende organisatieonderdelen binnen het ministerie en uitvoerende- en
      toezichthoudende organisaties buiten het ministerie:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.a
    text: de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.b
    text: de Commissie Eindtermen Accountantsopleiding (CEA);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.c
    text: de Dienst Toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.d
    text: de Douane;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.e
    text: het Nederlands Bureau der Motorrijtuigverzekeraars (NBM);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.f
    text: de Stichting administratiekantoor beheer financiële instellingen (NL Financial Investments, NLFI);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.g
    text: het Waarborgfonds Motorverkeer;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.h
    text: de Waarderingskamer;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.i
    text: de Auditdienst Rijk;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: 5.3.j
    text: de dienst Domeinen Roerende Zaken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: '5.4'
    text: |-
      De pSG vervult een beheersmatige rol ten aanzien van de Auditdienst Rijk gelet op de positie van de Auditdienst
      Rijk in het controlebestel.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: '5.5'
    text: |-
      De pSG draagt zorg voor de voorbereiding van de overleggen tussen de bestuurder en de ondernemingsraad van het
      beleidsdepartement en de departementale ondernemingsraad. De pSG draagt ook zorg voor de voorbereiding van de
      overleggen tussen de bestuurder en de vakbonden.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: '5.6'
    text: De pSG vertegenwoordigt het kernministerie in interdepartementaal overleg.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel5
  - number: '6.1'
    text: De pSG is Departementaal Chief Information Officer (dCIO) voor het ministerie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: '6.2'
    text: 'De dCIO heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: 6.2.a
    text: |-
      het inrichten van het CIO-stelsel, conform [artikel 9 van het Besluit CIO-stelsel Rijksdienst 2021][ref1], voor
      het ministerie;


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel9
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '9'
  - number: 6.2.b
    text: |-
      de ontwikkeling en coördinatie van het informatievoorzienings- en digitaliseringsbeleid en het monitoren van de
      ontwikkeling en het beheer van de informatiesystemen van het ministerie conform dit beleid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: 6.2.c
    text: |-
      na overleg met de secretaris-generaal, de bewindspersonen rechtstreeks informeren, indien de taakuitoefening
      daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: 6.2.d
    text: |-
      zelf of door decentrale CIO’s uitvoering geven aan een CIO-oordeel of een externe kwaliteitstoets binnen alle fasen
      van projecten, programma’s of activiteiten met een digitaliseringsaspect of ICT-component;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: 6.2.e
    text: |-
      uitvoering geven aan de taken ten aanzien van de informatiehuishouding conform
      [artikel 5, tweede lid, van de Regeling Informatiehuishouding Financiën 2022][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046157#Artikel5
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0046157
        artikel: '5'
  - number: '6.3'
    text: |-
      Dienstonderdelen van het ministerie verstrekken de dCIO de informatie die noodzakelijk is voor de uitoefening van
      diens taken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: '6.4'
    text: De dCIO wordt ondersteund door de concerndirectie Informatievoorziening en Openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: '6.5'
    text: De directeur Informatievoorziening en Openbaarmaking is de plaatsvervangend dCIO.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      De directeur Bedrijfsvoering is Coördinerend Directeur Inkoop (CDI) en is verantwoordelijk voor het goed
      functioneren van het inkoopstelsel binnen het ministerie van Financiën en het categoriemanagement van de
      categorieën die ressorteren onder het ministerie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: '7.2'
    text: 'De CDI heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: 7.2.a
    text: het inrichten van een CDI-stelsel voor het ministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: 7.2.b
    text: |-
      vertalen en implementeren van rijksbrede afspraken, wet- en regelgeving en de organisatiedoelstellingen in kaders
      en handreikingen op het gebied van inkoop;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: 7.2.c
    text: stelselmatige toetsing van de inkoopprocessen en -procedures en de uitvoering van vastgestelde afspraken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: 7.2.d
    text: |-
      binnen het departement inrichten van een werkend systeem aan kaders en handreikingen dat voldoet aan de rijksbrede
      afspraken en wet- en regelgeving en dat bijdraagt aan de organisatiedoelen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: 7.2.e
    text: gevraagd en ongevraagd adviseren van de ambtelijke en politieke leiding over het inkoopbeleid en -beheer.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: '7.3'
    text: De CDI wordt ondersteund door een CDI Office.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel7
  - number: '8.1'
    text: Er is een bestuursraad bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      De volgende functionarissen voeren in de bestuursraad bedrijfsvoering regelmatig overleg over beleidsvoorstellen
      met betrekking tot de departementale bedrijfsvoering:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.a
    text: de pSG;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.b
    text: een plaatsvervangend directeur-generaal Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.c
    text: de plaatsvervangend directeur-generaal Toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.d
    text: de plaatsvervangend directeur-generaal Douane;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.e
    text: de plaatsvervangend directeur-generaal voor Fiscale Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.f
    text: de plaatsvervangend directeur-generaal van de Rijksbegroting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.g
    text: de plaatsvervangend thesaurier-generaal;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.h
    text: de directeur Financieel-Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.i
    text: de directeur Bestuursondersteuning en Advies;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: 8.2.j
    text: de algemeen directeur Auditdienst Rijk.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: '8.3'
    text: De pSG is voorzitter van de bestuursraad bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      De pSG beslist welke bespreekpunten worden geagendeerd in de bestuursraad, gehoord hebbende de bestuursraad
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel8
  - number: '9'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treedt de algemene leiding in
      contact met de bewindspersoon die het aangaat, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel9
  - number: '10'
    text: 'Het ministerie heeft een hoofdstructuur, bestaande uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.a
    text: het cluster secretaris-generaal (SG-cluster);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.b
    text: het directoraat-generaal Belastingdienst (DGBD);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.c
    text: het directoraat-generaal Toeslagen (DGTSL);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.d
    text: het directoraat-generaal Douane (DGD);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.e
    text: het directoraat-generaal Fiscale Zaken (DGFZ);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.f
    text: het directoraat-generaal Rijksbegroting (DGRB);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.g
    text: de Generale Thesaurie (GT);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.h
    text: de inspectie belastingen, toeslagen en douane (IBTD);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: 10.i
    text: het bureau van de belangenbehartiger voor belastingplichtigen en toeslaggerechtigden (bureau BBT).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel10
  - number: '11.1'
    text: |-
      Buiten de structuur als bedoeld in [artikel 10][ref1] kan de SG een tijdelijk directoraat-generaal voor grote
      projecten instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel10
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '10'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Passend binnen de structuur als bedoeld in [artikel 10][ref1] kan de SG of de pSG tijdelijke organisatieonderdelen
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel10
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '10'
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      De SG kan de directeuren-generaal Belastingdienst, Toeslagen en Douane ieder afzonderlijk toestemming verlenen
      om, met inachtneming van de structuur van respectievelijk het DGBD, het DGTSL en het DGD, en de taken genoemd
      in het [Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1], tijdelijke
      organisatieonderdelen in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0045076
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045076
  - number: '12.1'
    text: 'Het SG-cluster bestaat uit de volgende ministeriebrede organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.a
    text: de directie Algemene Financiële en Economische Politiek;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.b
    text: de directie Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.c
    text: de concerndirectie Veiligheid, Toezicht en Integriteitsonderzoek;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.d
    text: de directie Juridische Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.e
    text: de directie Bestuursondersteuning en Advies;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.f
    text: de directie Communicatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.g
    text: de directie Financieel-Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.h
    text: de (tijdelijke) programmadirectie Informatie op Orde;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.i
    text: de concerndirectie Informatievoorziening en Openbaarmaking;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.1.j
    text: de concerndirectie Mens en Organisatie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: '12.2'
    text: 'Het SG-cluster bestaat tevens uit de volgende Rijksbrede organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.2.a
    text: de Auditdienst Rijk;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.2.b
    text: de dienst Domeinen Roerende Zaken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: '12.3'
    text: 'De organisatieonderdelen van het SG-cluster genoemd in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.a
    text: |-
      ondersteunen de organisatieonderdelen van het ministerie op het gebied van organisatie, personeel, financiën,
      salaris, communicatie, documentaire informatievoorziening, archiefbeheer, facilitaire dienstverlening en ICT;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b
    text: 'behartigen, specifieke ministeriebrede functies inzake:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b.i
    text: algemeen juridische en Europeesrechtelijke advisering;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b.ii
    text: politiek-bestuurlijke advisering van algemene aard;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b.iii
    text: ondersteunende werkzaamheden voor de algemene leiding;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b.iv
    text: communicatiebeleid en begeleiding van communicatie-uitingen van de bewindslieden en het ministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b.v
    text: de controlfunctie voor het ministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b.vi
    text: het integriteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.3.b.vii
    text: De advisering over en onderzoek naar het te voeren financieel-economisch beleid.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: '12.4'
    text: |-
      De organisatieonderdelen van het SG-cluster als genoemd in het tweede lid behartigen ministerie- en Rijksbrede
      functies inzake:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.4.a
    text: de auditfunctie voor het ministerie en in opdracht van andere ministers de auditfunctie voor andere ministeries;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: 12.4.b
    text: het beheer en verkoop van overtollige en door overheidsinstanties in beslag genomen roerende zaken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel12
  - number: '13'
    text: 'De directie AFEP heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.a
    text: Het voorbereiden van het financieel-economisch beleid en het doen van onderzoek op dit terrein;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.b
    text: |-
      Het adviseren over, het coördineren van de behandeling van en het doen van onderzoek naar algemeen financiële en
      economische aspecten van beleid waarvoor de Minister van Financiën verantwoordelijkheid draagt;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.c
    text: |-
      Het adviseren van de Minister van Financiën over zaken die niet onder diens directe beleidsverantwoordelijkheid
      vallen, doch waarbij hij, gezien zijn algemeen financiële en sociaal-economische verantwoordelijkheid, nauw is
      betrokken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.d
    text: Het ramen van en het doen van onderzoek naar de opbrengst van de belastingen en de milieuheffingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.e
    text: Het beheer van het inkomstenkader;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.f
    text: |-
      Het volgen van internationale economische ontwikkelingen en van de economische positie van voor Nederland
      belangrijke landen, zowel ten behoeve van internationaal overleg als ten behoeve van de beleidsvoorbereiding ter
      zake van de externe positie van de Nederlandse economie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.g
    text: |-
      De vertegenwoordiging in interdepartementaal overleg en andere overlegorganen op algemeen financieel-economisch
      terrein, evenals het interdepartementaal coördineren op genoemd terrein;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.h
    text: |-
      De vertegenwoordiging in internationaal overleg met betrekking tot het algemene financiële en economische beleid en
      aspecten daarvan;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.i
    text: |-
      Het doen en entameren van beleidsgericht wetenschappelijk onderzoek op het financieel-economische terrein
      uitmondend in een geregelde stroom publicaties in wetenschappelijke tijdschriften;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: 13.j
    text: |-
      Het doen en entameren van kwantitatief beleidsgericht (wetenschappelijk) onderzoek op nationaal en internationaal
      financieel-economisch terrein, waarbij het datateam binnen AFEP (AFEP Analytics) hierbij een zelfstandige
      verantwoordelijkheid voor onderzoeksselectie, dataverzameling en -beheer, analyses, conclusies en presentaties
      draagt.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel13
  - number: '14.1'
    text: 'De directie Bedrijfsvoering heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.1.a
    text: |-
      zorgdragen voor adequate ondersteuning van het bedrijfsvoeringsproces van het kernministerie en de IBTD integraal
      op terreinen van inkoop, huisvesting, facilitaire zaken en beveiliging;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.1.b
    text: het adviseren over en uitvoeren van opdrachten van de Bestuursraad en de bestuursraad bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.1.c
    text: |-
      het zorgdragen voor de kaderstelling voor en het toezicht op de uitvoering door de uitvoerende diensten van het
      ministerie (Belastingdienst, ADR en domeinen);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.1.d
    text: regie voeren op leverende partijen binnen en buiten de Rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.1.e
    text: |-
      het ondertekenen van de rijksbrede overeenkomsten in het kader van categoriemanagement, voor zover het de
      categorieën betreft die ressorteren onder het ministerie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: '14.2'
    text: 'Onder de directie Bedrijfsvoering ressorteren naast de staf de volgende eenheden en teams:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.2.a
    text: eenheid Facilitair Huisvesting en Services (FHS);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.2.b
    text: team Financiën;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.2.c
    text: afdeling CDI Office en Categoriemanagement.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het team Financiën en de afdeling CDI Office en Categoriemanagement zijn rechtstreeks geplaatst onder de directeur
      Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: '14.4'
    text: 'De eenheid FHS heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.4.a
    text: regie voeren op het gebied van facilitaire dienstverlening en huisvesting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.4.b
    text: de rol van pandbeheerder;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.4.c
    text: vertegenwoordigen van het Ministerie van Financiën als concern in ICHF-verband;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.4.d
    text: leveren van uiteenlopende bedrijfsvoeringbrede dienstverlening.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: '14.5'
    text: 'Het team Financiën heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.5.a
    text: financieel advies en business control;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.5.b
    text: planning en control en AO/IC;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.5.c
    text: |-
      uitvoeren en mede ontwikkelen van de DG-Financiële Advies functie, de Planning & Control, Begrotingscyclus en AO/IC
      van het kernministerie en de IBTD, rekening houdend met de rol van de directie FEZ.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: '14.6'
    text: 'De afdeling CDI Office en Categoriemanagement heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.6.a
    text: |-
      beleid op het gebied van inkoop en contractmanagement formuleren en implementeren, waaronder departementaal beleid
      op het gebied van inkoop als bedoeld in het Taakbesluit CPO Rijk en het Taakbesluit CDI;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.6.b
    text: |-
      het inrichten en beheren van een inkoopstelsel en binnen de systeemverantwoordelijkheid vervullen van de
      kaderstellende en toetsende rol op het gebied van inkoop en aanbesteding voor het gehele Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.6.c
    text: |-
      beleidsmatige en vakinhoudelijke ondersteuning van de CDI bij de positie- en rolbepaling als ook de strategische
      (interdepartementale) agendasetting op het gebied van inkoop en aanbesteding;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: 14.6.d
    text: |-
      het bijdragen aan de rijksbrede strategische opdracht vanuit de categorieën waarvan het eigenaarschap is toebedeeld
      aan het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
  - number: '14.7'
    text: |-
      De directeur Bedrijfsvoering is tevens Coördinerend Directeur Inkoop (CDI) als bedoeld in [artikel 7][ref1]. Het
      afdelingshoofd CDI Office en Categoriemanagement is tevens plaatsvervangend CDI.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel7
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '7'
        hoofdstuk: '2'
  - number: '15.1'
    text: 'De directie VTI heeft binnen het Ministerie van Financiën de taak:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: 15.1.a
    text: |-
      Informatie (operationeel, strategisch en beleidsmatig) en ontwikkelingen op het terrein van de (inter)nationale
      veiligheid, criminaliteit en dreigingen te monitoren, te duiden en waar relevant te ontsluiten;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: 15.1.b
    text: |-
      Concernbreed een stevige beleidsmatige en strategische regierol te voeren op onderwerpen die zien op nationale
      veiligheid, criminaliteitsbestrijding, integrale beveiliging, toezicht en integriteitsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: 15.1.c
    text: |-
      Integraal beveiligings- en calamiteitenbeleid vorm te geven, te implementeren en te evalueren. De directie
      ondersteunt de SG, pSG en DG-en bij de integrale beveiliging en de inrichting en werking van de organisatie
      daarvan, evenals de zorg voor en de beveiliging van de te beschermen belangen voor hun dienstonderdelen.
      De directie geeft daartoe invulling aan de taken en bevoegdheden die voortvloeien uit het besluit
      beveiligingsautoriteit. De directeur vervult de functie en rol van de hierin benoemde beveiligingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: 15.1.d
    text: |-
      Vorm te geven aan (onafhankelijke) toezichtstaken die bij het Ministerie van Financiën zijn
      ondergebracht. Deze zien op (a) de functionaris gegevensbescherming, (b) de insidersregeling en (c) het
      [Besluit BVA-stelsel Rijksdienst 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044617
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0044617
  - number: 15.1.e
    text: |-
      Binnen het concern van het Ministerie van Financiën te fungeren als centraal meldpunt en onderzoeksbureau waar
      (vermoedens van) integriteitschendingen worden gemeld, beoordeeld en onderzocht.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: 15.1.f
    text: |-
      De directie fungeert als algemeen aanspreekpunt en contactpersoon voor de BVA Rijk, de AIVD, politie,
      (rijks)recherche, de NCTV en internationale organisaties (zoals EU en NAVO) over integrale aspecten betreffende de
      integrale veiligheid.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: 15.1.g
    text: |-
      Op haar taken namens het Ministerie van Financiën te participeren in inter- en intradepartementaal overleg inzake
      de integrale beveiliging, zoals het BVA-beraad en het interdepartementale overleg inzake corruptiebestrijding en
      ervoor zorgen dat politieke en ambtelijke standpuntbepaling effectief wordt uitgedragen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: '15.2'
    text: |-
      De concerndirectie Veiligheid, Toezicht en Integriteitsonderzoek bestaat uit een afdeling Integrale Veiligheid en
      Beveiliging, een afdeling Toezicht en een afdeling Integriteitsonderzoeken Financiën.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel15
  - number: '16.1'
    text: 'De directie Juridische Zaken heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.a
    text: juridisch adviseren van de politieke en ambtelijke leiding en alle directies van het ministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.b
    text: opstellen van overeenkomsten, convenanten en andere wilsuitingen van civielrechtelijke of publiekrechtelijke aard;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.c
    text: |-
      het behandelen van bezwaarschriften, (hoger) beroepschriften en daarmee samenhangende bestuursrechtelijke
      procedures voor het kernministerie, met uitzondering van arbeidsjuridische procedures en procedures die verband
      houden met de taken van de Dienst Financieel-Economische Integriteit;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.d
    text: vertegenwoordigen van het ministerie in interdepartementale gremia en juridische fora;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.e
    text: coördineren van de opdrachten aan de Landsadvocaat en andere juridische dienstverleners;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.f
    text: |-
      de (ondersteuning bij de) behandeling van aansprakelijkstellingen, alsmede de (ondersteuning bij de) behandeling en
      begeleiding van civielrechtelijke procedures, met uitzondering van arbeidsjuridische procedures;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.g
    text: |-
      het voorbereiden van wetgeving op het gebied van de [Comptabiliteitswet 2016][ref1] en overige wet- en regelgeving
      voor zover die niet behoort tot het beleidsterrein van DGFZ of de directie Financiële Markten;


      [ref1]: https://wetten.overheid.nl/BWBR0039429
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039429
  - number: 16.1.h
    text: |-
      het voorbereiden van regelgeving op het gebied van het Organisatiebesluit en het Mandaatbesluit van het Ministerie
      van Financiën en van de directoraten-generaal Belastingdienst, Toeslagen en Douane;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.i
    text: kwaliteitsbewaker van de juridische functie binnen het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: 16.1.j
    text: |-
      aangelegenheden betreffende de [Wet normering topinkomens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032249
  - number: '16.2'
    text: De directie Juridische Zaken bestaat uit een afdeling Publiekrecht en een afdeling Privaatrecht.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel16
  - number: '17.1'
    text: 'De directie Bestuursondersteuning en Advies heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.a
    text: de politiek-bestuurlijke advisering en ondersteuning van de politieke en ambtelijke top;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.b
    text: |-
      de coördinatie van de voorbereiding en advisering van de ministerraad (MR), Onderraden, het Secretarissen-Generaal
      Overleg (SGO) en de bestuursraad;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.c
    text: |-
      het interne en externe parlementaire coördinatiepunt en de parlementaire contactpersoon aangewezen op basis van de
      Aanwijzingen inzake externe contacten van rijksambtenaren;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.d
    text: het Departementaal Crisiscoördinatiecentrum (DCC);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.e
    text: |-
      de protocollaire advisering en ondersteuning aan de politieke en ambtelijke leiding, waaronder inkomende en
      uitgaande bezoeken van de politieke leiding en diens geschenkenbeleid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.f
    text: de governance en de benoemingen van de AFM en DNB;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.g
    text: de optimalisatie en logistieke afhandeling van de stukken(stroom) voor de ambtelijke en politieke leiding;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.h
    text: de secretariële ondersteuning van de politieke leiding, SG en pSG;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.i
    text: |-
      de logistieke en restauratieve voorzieningen van de politieke leiding, SG en pSG, alsook de ontvangst van hun
      gasten door de kamerbewaarders;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.j
    text: |-
      het adviseren van de SG en pSG als eigenaar over governance, continuïteit en lange termijn doelstellingen
      van de uitvoerende en toezichthoudende organisaties van of ressorterend onder het Ministerie van Financiën
      (eigenaarsperspectief); en
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: 17.1.k
    text: de departementale coördinatie en voorbereiding van parlementaire enquêtes.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: '17.2'
    text: |-
      De directie Bestuursondersteuning en Advies bestaat uit de afdelingen Advies, Bestuursondersteuning (BO),
      Eigenaarsadvisering (EA) en de tijdelijke projectafdeling Parlementaire enquêtes (PE).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel17
  - number: '18'
    text: 'De directie Communicatie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
  - number: 18.a
    text: |-
      is verantwoordelijk voor de beleidscommunicatie over het primaire proces van het kernministerie en de
      Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
  - number: 18.b
    text: |-
      adviseert en ondersteunt de politieke en ambtelijke leiding op het terrein van woordvoering en communicatie en
      is verantwoordelijk voor het departementale beleid terzake en coördineert DG-overstijgende onderwerpen in relatie
      tot woordvoering en communicatie evenals de beantwoording van vragen over verzoeken om informatie op grond van
      de [Wet open overheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: 18.c
    text: |-
      is verantwoordelijk voor de organisatiecommunicatie van het ministerie, uitgezonderd de IBTD, inclusief het bewaken
      van de huisstijl en voor de vraaggestuurde individuele voorlichting (in samenwerking met andere departementen,
      uitvoeringsinstanties etc.);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
  - number: 18.d
    text: |-
      vertegenwoordigt het ministerie, uitgezonderd de IBTD, in externe, interdepartementale en interne gremia in relatie
      tot woordvoering, voorlichting en communicatie en vervult daarbij een voortrekkersrol in samenwerkingsprocessen
      en is tevens verantwoordelijk voor de departementsbrede communicatie met het parlement, behalve ten aanzien van
      de IBTD;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
  - number: 18.e
    text: |-
      voert de hoofdredactie van de internetsite van het ministerie, mede in reactie op maatschappelijk relevante
      ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
  - number: 18.f
    text: |-
      het zorgen voor de regie op de invulling van nieuwe media/sociale media door het analyseren en ontsluiten van
      informatie voor het departement, de bewindspersonen en de SG, het doen van literatuuronderzoek en het functioneel
      beheer van digitale kranten en functioneel beheer op Rijksportaal;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
  - number: 18.g
    text: coördineert het beleid ter zake van uitnodigingen, werkbezoeken en speeches van de politieke leiding.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel18
  - number: '19.1'
    text: 'De directie Financieel-Economische Zaken heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.1.a
    text: |-
      als concerncontroller van het ministerie van Financiën een allocatieve weging uitvoeren van middelen voor het
      beleid en uitvoering en er op toezien dat uitgaven en ontvangsten binnen de budgettaire kaders passen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.1.b
    text: |-
      het opstellen van de begroting IX en meerjarenramingen van het Ministerie van Financiën, inclusief Nationale
      Schuld;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.1.c
    text: |-
      het toezien op de rechtmatige, doelmatige en doeltreffende uitvoering van deze begrotingen en op beleidsevaluaties,
      inclusief het zorgdragen voor in- en externe verantwoording daarover;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.1.d
    text: |-
      het voorbereiden en (laten) uitvoeren van het departementale beleid op het terrein van de administratieve
      organisatie en bestuurlijke informatievoorziening (AO/BIV) en diverse andere taken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.1.e
    text: |-
      kaders stellen voor en ontwikkelen van het departementale managementcontrolsysteem waarvan de begrotingscyclus, de
      departementale planning en controlcyclus en het risicomanagement deel uitmaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.1.f
    text: |-
      het indienen van bezwaar en het instellen van beroep inzake belastingaangiften, in overeenstemming met de
      secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: '19.2'
    text: 'De directie Financieel-Economische Zaken bestaat uit een staf en de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.2.a
    text: |-
      afdeling Begrotingszaken met als hoofdtaak de coördinatie van de totstandkoming van de begrotingsstukken van de
      begroting van het ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.2.b
    text: |-
      afdeling Beleidscontrol met als hoofdtaak de toetsing van beleidsvoornemens van DG’s en directies op budgettaire/
      financiële consequenties, rechtmatigheid, doeltreffendheid en doelmatigheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19.2.c
    text: |-
      afdeling Kaderstelling met als hoofdtaak de vertaling van rijksbrede kaderstelling op het terrein van financiële
      bedrijfs- en beleidsprocessen naar interne regelgeving.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19
  - number: 19a.1
    text: 'De (tijdelijke) programmadirectie Informatie op Orde heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.a
    text: |-
      het definiëren van verbetermaatregelen voor het op orde brengen van de informatiehuishouding en -voorziening voor
      het ministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.b
    text: |-
      het opstellen van een verander- en communicatieplan om kennis, houding en gedrag onderdeel te laten zijn van het
      programma Informatie Op Orde;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.c
    text: |-
      het maken van een stakeholderanalyse en bekijken welke verbinding er gezocht moet worden op het vlak van
      informatiemanagement;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.d
    text: |-
      het maken van een actieplan voor het op orde brengen van de informatiehuishouding en -voorziening, waarbij de
      uitvoerende directoraten-generaal verantwoordelijk zijn voor het opstellen van de actieplannen en planningen voor
      de primaire processen, waarover zij rapporteren aan de programmadirectie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.e
    text: het stellen van kaders voor informatiehuishouding en -voorziening en het inrichten van een pdca-cyclus hiervoor;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.f
    text: |-
      het creëren van een organisatie waarbij archivering, transparantie en het juist delen van informatie geen optie is,
      maar een gegeven;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.g
    text: |-
      het realiseren van een governance van de informatiehuishouding en -voorziening, waarbij de taken en
      verantwoordelijkheden binnen het ministerie verder zijn uitgewerkt;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.1.h
    text: het inrichten van een verplicht te gebruiken Document Management Systeem voor het ministerie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19a.2
    text: |-
      De (tijdelijke) programmadirectie is ingedeeld naar de Rijksbrede actielijnen zoals deze door het ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties zijn onderscheiden.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19a
  - number: 19b.1
    text: 'De concerndirectie Informatievoorziening en Openbaarmaking heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19b.1.a
    text: |-
      het uitvoeren van de taken van de dCIO conform [artikel 6][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel6
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '6'
        hoofdstuk: '2'
  - number: 19b.1.b
    text: |-
      invulling geven aan de rol van de CIO van het kernministerie en
      [artikel 5, derde lid, van de Regeling Informatiehuishouding Financiën 2022][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046157#Artikel5
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0046157
        artikel: '5'
  - number: 19b.1.c
    text: |-
      het onderhouden van diverse (externe) contacten waaronder de contacten met de CIO-Rijk, de Algemeen
      Rijksarchivaris, de Inspectie Overheidsinformatie en Erfgoed en het Adviescollege ICT toetsing en deze gevraagd en
      ongevraagd adviseren en/of voorzien van informatie die noodzakelijk is voor hun taakuitoefening;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19b.1.d
    text: |-
      adviseren van alle directies en bewindspersonen over het beleid ten aanzien van informatievoorziening,
      digitalisering en informatiehuishouding en implicaties van (voorgenomen) wet- en regelgeving, beleids- en
      uitvoeringstrajecten en investeringen van het kernministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19b.1.e
    text: |-
      zorgdragen voor de advisering, (beleids)kaders en de naleving hiervan op het terrein van de informatievoorziening
      en ICT, alsmede voor het bevorderen van informatiebewustzijn en het gebruik van ICT-middelen van het
      kernministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19b.1.f
    text: |-
      zorgdragen voor advisering, (beleids)kaders, uitgangspunten en de naleving hiervan op het terrein van
      informatiehuishouding van het kernministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19b.1.g
    text: zorgdragen voor specifieke en gemeenschappelijke ICT-diensten gericht op de ondersteuning van het kernministerie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19b.1.h
    text: adviseren over en besluiten op verzoeken op grond van de Algemene verordening gegevensbescherming (AVG);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19b.1.i
    text: |-
      het departementaal formuleren van beleid en stellen van kaders op het gebied van de [Wet open overheid][ref1] en de
      inlichtingenplicht, als bedoeld in [artikel 68 van de Grondwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel68
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0045754
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '68'
  - number: 19b.1.j
    text: |-
      het departementaal adviseren over en het voorbereiden en nemen van besluiten op grond van de
      [Wet open overheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: 19b.2
    text: |-
      De concerndirectie Informatievoorziening en Openbaarmaking bestaat uit een afdeling Openbaarmaking en
      Transparantie, een afdeling Informatiehuishouding, een afdeling Informatiebeleid en een afdeling Dienstverlening.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19b
  - number: 19c.1
    text: 'De concerndirectie Mens en Organisatie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.a
    text: |-
      het vervullen van een kaderstellende en controlerende rol binnen de M&O-lijn van het Ministerie van Financiën,
      gericht op het continu verbeteren van de dienstverlening binnen de rijksbrede kaders op het terrein van personeel
      en organisatie en het verbeteren van de concernbrede samenwerking;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.b
    text: |-
      interne advisering van de leiding en het management van het Ministerie van Financiën over de uitvoering van het
      personeelsmanagement, het personeelsbeleid en de ontwikkeling van de organisatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.c
    text: |-
      het coördineren en verbinden op DG- en departementoverstijgende onderwerpen op het gebied van personeel en
      organisatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.d
    text: |-
      het inspelen op interne en externe ontwikkelingen en bijdragen aan het waarborgen van de personeelscontinuïteit van
      het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.e
    text: |-
      het zorgdragen voor een samenhangend, integraal beleid sociale veiligheid en integriteit en het initiëren,
      regisseren en het toezien op een adequate uitvoering van dit beleid binnen het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.f
    text: |-
      het beheersen van doelstellingen en administratieve processen op het terrein van organisatie en personeel ten
      behoeve van de SG en pSG als eigenaar;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.g
    text: |-
      regie voeren op taken en opdrachten op het gebied van organisatie en personeel die zijn belegd bij SSC’s, en in
      voorkomende gevallen externe partijen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.h
    text: |-
      het voeren of begeleiden van bestuursrechtelijke en civielrechtelijke procedures op het gebied van het
      (collectieve) arbeidsrecht en medezeggenschapsrecht voor alle organisatieonderdelen binnen het Ministerie van
      Financiën;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.i
    text: |-
      het vertegenwoordigen van het Ministerie van Financiën in interdepartementale gremia en fora op het gebied van
      personeel en organisatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.1.j
    text: uitvoeren van het personeelsbeheer.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.2
    text: 'De concerndirectie Mens en Organisatie bestaat uit een staf en de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.2.a
    text: |-
      Afdeling Strategie en Realisatie (S&R), verantwoordelijk voor het stimuleren van een inclusieve, diverse,
      gelijkwaardige, vitale en ontwikkelgerichte organisatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.2.b
    text: |-
      Afdeling Werkgeverszaken en Integriteit (W&I), verantwoordelijk voor het invullen van het goed, modern
      werkgeverschap binnen het Ministerie van Financiën en het stimuleren van een integere organisatie met een positieve
      en veilige werkomgeving;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.2.c
    text: |-
      Afdeling Analyse en Beheersing (A&B), verantwoordelijk voor de analyse en beheersing van departementale
      doelstellingen en strategische kaders op het terrein van personeel en organisatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: 19c.2.d
    text: |-
      Afdeling M&O Advies en Ondersteuning (A&O), verantwoordelijk voor de advisering en ondersteuning van het
      kernministerie bij de uitvoering van beleid, processen en instrumenten op het terrein van personeel en organisatie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel19c
  - number: '20.1'
    text: 'De Auditdienst Rijk heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.1.a
    text: |-
      het uitvoeren van de bij de [Comptabiliteitswet 2016][ref1] en het Besluit Auditdienst Rijk opgedragen taken
      betreffende de controle van de jaarlijkse financiële verantwoording en het onderzoeken van het gevoerde financiële
      en materieelbeheer van de ministeries;


      [ref1]: https://wetten.overheid.nl/BWBR0039429
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0039429
  - number: 20.1.b
    text: het in opdracht van de ministeries uitvoeren van gevraagde onderzoeken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.1.c
    text: |-
      het op basis van de uitkomsten van uitgevoerde onderzoeken doen van aanbevelingen aan het management van de
      ministeries, in het bijzonder op het gebied van sturen, beheersen en verantwoorden;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.1.d
    text: |-
      optreden als auditautoriteit voor het Nederlandse Herstel- en Veerkrachtplan en, in lijn met [EU-verordening
      2021/241](32141R2021) en EU-verordening 2-18/1046, bij elk betaalverzoek vanuit Nederland aan de Europese Unie in
      het kader van het Nederlandse Herstel- en Veerkrachtplan een samenvatting van audits opstellen over de besteding
      van de Europese middelen voor het uitvoeren van het Herstel- en Veerkrachtplan door de lidstaat Nederland.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: '20.2'
    text: De algemeen directeur geeft sturing aan de ADR.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: '20.3'
    text: |-
      Het directieteam van de ADR bestaat uit: de algemeen directeur, de directeur onderzoek, de directeur kennis en
      ontwikkeling, vijf accountdirecteuren, vier sectormanagers en de manager van de stafafdeling bestuursondersteuning
      en vaktechniek. De directeur onderzoek is tevens plaatsvervangend algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: '20.4'
    text: De stafafdeling bestuursondersteuning en vaktechniek is rechtstreeks geplaatst onder de algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: '20.5'
    text: |-
      De stafafdeling heeft tot taak de strategische ondersteuning van de directie, de inrichting van de
      bedrijfsvoeringsprocessen en de ontwikkeling van vaktechnische kaders waarbinnen de ADR zijn werkzaamheden
      uitvoert.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: '20.6'
    text: |-
      De Auditdienst Rijk is onderverdeeld in vijf accounts, elk onder leiding van een accountdirecteur. De accounts zijn
      verantwoordelijk voor het inventariseren van de klantvragen binnen het account en het organiseren en verrichten van
      onderzoeken binnen het account. De ministeries zijn als volgt over de accounts verdeeld:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.6.a
    text: VWS, SZW en OCW;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.6.b
    text: FIN, EZK en LNV;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.6.c
    text: DEF en AZ;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.6.d
    text: BZK en J&V;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.6.e
    text: BZ en I&W.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: '20.7'
    text: |-
      De Auditdienst Rijk is onderverdeeld in vier sectoren, elk onder leiding van een sectormanager. De sectoren leveren
      capaciteit voor het uitvoeren van opdrachten. Voorts behoren ontwikkeling van kennis en innovatie op het terrein
      van de desbetreffende auditdiscipline tot de taak van de sectoren. De sectoren zijn ingedeeld naar de verschillende
      auditdisciplines:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.7.a
    text: Financial audit;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.7.b
    text: IT-audit;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.7.c
    text: Operational audit;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: 20.7.d
    text: EU-audit.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel20
  - number: '21.1'
    text: |-
      Dienst Domeinen Roerende Zaken (DRZ) is een directie van het Ministerie van Financiën. De dienst heeft twee
      hoofdtaken:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.1.a
    text: 'de verwerking van in beslaggenomen goederen, waaronder begrepen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.1.a.i
    text: |-
      het in het kader van Wetboek van Strafvordering, vervoeren van in beslag genomen goederen van Politie naar de
      werklocaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.1.a.ii
    text: het op deze locaties taxeren van de goederen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.1.a.iii
    text: |-
      het bewaren van de goederen tot opdracht van het Openbaar Ministerie verkregen wordt om met het goed te handelen.
      In dit geval kan het goed vernietigd, teruggegeven of verkocht worden;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.1.a.iv
    text: het landelijk coördineren van de aanpak ontmanteling hennepkwekerijen en verwerking van afvalstromen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.1.b
    text: 'de verwerking van door het Rijk overcompleet gestelde goederen, waaronder begrepen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.1.b.i
    text: |-
      het op basis van [artikel 4.20, tweede lid, aanhef en onder c en d, van de Comptabiliteitswet 2016][ref1] en de
      [Regeling materieelbeheer roerende zaken van het Rijk][ref2], verwerken van door het Rijk overcompleet gestelde
      goederen en het hierbij taxeren, adviseren, verkopen en vernietigen van de aangeleverde goederen;


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0040285
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0040285
  - number: 21.1.b.ii
    text: het in opdracht van de Ministerraad (December 2000) afstoten en verwerken van alle datadragers van het Rijk.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: '21.2'
    text: 'De uitvoering van de hoofdtaken is proces gestuurd ingericht en verdeeld over 4 afdelingen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.2.a
    text: de afdeling Productie, verantwoordelijk voor de fysieke verwerking van de goederenstroom;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.2.b
    text: |-
      het Klantcontactcentrum, verantwoordelijk voor de administratieve verwerking en vervoer van de goederenstroom en de
      externe contacten. De afdeling vormt samen met de afdeling Productie het DRZ Dienstencentrum;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.2.c
    text: de afdeling Bedrijfsvoering, verantwoordelijk voor de secundaire processen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21.2.d
    text: de afdeling Innovatie & ICT; verantwoordelijk voor IT-beheer, informatiebeveiliging, innovatie en projecten.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: '21.3'
    text: |-
      De organisatie van de dienst Domeinen Roerende Zaken heeft een landelijk werkgebied. Er zijn werklocaties te
      Bleiswijk, Hoogeveen, Soesterberg, Ulicoten en een locatie te Apeldoorn waarin alle administratieve taken zijn
      gecentraliseerd.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21
  - number: 21a.1
    text: 'De Dienst Financieel-Economische Integriteit heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21a
  - number: 21a.1.a
    text: |-
      Het voorkomen en bestrijden van witwassen, terrorismefinanciering en overtreding van sanctiemaatregelen via niet-
      financiële en niet-juridische poortwachters door bestuursrechtelijk toezicht;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21a
  - number: 21a.1.b
    text: |-
      Het bevorderen van transparantie van eigenaarsstructuren door handhaving van wet- en regelgeving inzake het
      Ultimate Beneficial Owner (UBO) en UBO Trust Register;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21a
  - number: 21a.1.c
    text: |-
      Het bevorderen van transparantie in het financiële verkeer door strafrechtelijke opsporing van overtredingen
      van de administratieplicht en diverse registratieplichten van de [Handelsregisterwet][ref1] en bestuurs- en
      strafrechtelijke handhaving van overtredingen van specifieke economische ordeningswetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 21a.2
    text: |-
      De Dienst Financieel-Economische Integriteit bestaat uit drie afdelingen: de afdeling Toezicht
      [Wet ter voorkoming witwassen en financieren terrorisme][ref1], de afdeling UBO & Economische Handhaving en de
      afdeling Vaktechniek, Bedrijfsvoering en Strategie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: '22.1'
    text: |-
      De directeur-generaal Belastingdienst is verantwoordelijk voor de
      taken en verantwoordelijkheden van de organisatieonderdelen genoemd in
      [artikel 4 van het Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045076#Artikel4
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045076
        artikel: '4'
  - number: '22.2'
    text: De directeur-generaal Belastingdienst heeft een plaatsvervanger die hem bij afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel22
  - number: '22.3'
    text: |-
      De directeur-generaal Belastingdienst geeft leiding aan de onder hem ressorterende directeuren
      en voorziet daartoe in de nodige ondermandaten van die directeuren zoals geregeld in het
      [Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045078
  - number: '22.4'
    text: De directeur-generaal Belastingdienst vervult de rol van opdrachtnemer in het driehoeksmodel dat van toepassing is.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel22
  - number: 23a.1
    text: |-
      De directeur-generaal Toeslagen is verantwoordelijk voor de taken
      en verantwoordelijkheden van de organisatieonderdelen genoemd in
      [artikel 7 van het Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045076#Artikel7
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0045076
        artikel: '7'
  - number: 23a.2
    text: |-
      De directeur-generaal Toeslagen geeft leiding aan de onder hem ressorterende directeuren
      en voorziet daartoe in de nodige ondermandaten van die directeuren zoals geregeld in het
      [Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0045078
  - number: 23a.3
    text: De directeur-generaal Toeslagen vervult de rol van opdrachtnemer in het driehoeksmodel dat van toepassing is.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel23a
  - number: 23b.1
    text: |-
      De directeur-generaal Douane is verantwoordelijk voor de taken
      en verantwoordelijkheden van de organisatieonderdelen genoemd in
      [artikel 9 van het Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045076#Artikel9
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0045076
        artikel: '9'
  - number: 23b.2
    text: |-
      De directeur-generaal Douane geeft leiding aan de onder hem ressorterende directeuren
      en voorziet daartoe in de nodige ondermandaten van die directeuren zoals geregeld in het
      [Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0045078
  - number: 23b.3
    text: De directeur-generaal Douane vervult de rol van opdrachtnemer in het driehoeksmodel dat van toepassing is.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel23b
  - number: '24.1'
    text: |-
      De directeur-generaal Fiscale Zaken is verantwoordelijk voor de beleidsterreinen van de onder hem ressorterende
      directies, genoemd in dit hoofdstuk, voor de samenhang tussen die beleidsterreinen en voor de bijbehorende
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel24
  - number: '24.2'
    text: De directeur-generaal Fiscale Zaken heeft een plaatsvervanger die hem bij afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel24
  - number: '24.3'
    text: De directeur-generaal Fiscale Zaken geeft leiding aan de onder hem ressorterende directeuren.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel24
  - number: '24.4'
    text: |-
      De directeur-generaal Fiscale Zaken vervult de rol van de (coördinerend) opdrachtgever in het driehoeksmodel dat
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel24
  - number: '25'
    text: 'Het directoraat-generaal voor Fiscale Zaken (DGFZ) bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel25
  - number: 25.a
    text: de directie Algemene Fiscale Politiek (AFP);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel25
  - number: 25.b
    text: de directie Verbruiksbelastingen, Douane & Internationale aangelegenheden (VD&I);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel25
  - number: 25.c
    text: de directie Directe Belastingen & Toeslagen (DB&T).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel25
  - number: '26'
    text: 'Het directoraat-generaal voor Fiscale Zaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel26
  - number: 26.a
    text: adviseert over het te voeren fiscaal beleid en bereidt de belasting- en douanewetgeving voor;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel26
  - number: 26.b
    text: adviseert over het (inter)nationale beleid op het gebied van fiscaliteit en douane;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel26
  - number: 26.c
    text: |-
      bereidt wetgeving en internationale regelingen voor op het gebied van de directe belastingen, de
      verbruiksbelastingen en wat daarmee verband houdt en adviseert over het hiermee samenhangende beleid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel26
  - number: 26.d
    text: adviseert over het beleid en bereidt wetgeving voor op het gebied van toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel26
  - number: 26.e
    text: heeft een strategie- en onderzoeksfunctie op zijn beleidsterrein;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel26
  - number: 26.f
    text: |-
      treedt op als coördinerend opdrachtgever voor het directoraat-generaal Belastingdienst, het directoraat-generaal
      Douane en het directoraat-generaal Toeslagen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel26
  - number: '27.1'
    text: 'De directie Algemene Fiscale Politiek (AFP) heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.1.a
    text: |-
      Coördinatie van en adviseren over het belastingbeleid, zowel voor de rijksbelastingen als het decentrale
      belastinggebied;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.1.b
    text: Voorbereiden en afstemmen van Europese en internationale fiscale dossiers en zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.1.c
    text: |-
      Verrichten van kwantitatieve en kwalitatieve studies en opstellen van (rekenkundige) modellen met betrekking tot
      het toekomstige algemene fiscale beleid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.1.d
    text: Evalueren van belastinguitgaven;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.1.e
    text: Ondersteunen van de directies van het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.1.f
    text: Het optreden als coördinerend opdrachtgever voor het directoraat-generaal Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: '27.2'
    text: 'De directie AFP is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.a
    text: 'de afdeling Analyse met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.a.i
    text: |-
      Verrichten van kwantitatieve en kwalitatieve analyses van het (internationale) fiscale beleid ten behoeve
      van de heffing en de inning van belastingen, waaronder het beleid met betrekking tot internationale
      gegevensuitwisselingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.a.ii
    text: |-
      In internationaal verband participeren in strategische fiscale verkenningen en vergelijkende beleidsonderzoeken
      (bijv. OESO);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.a.iii
    text: |-
      Onderzoeks- en evaluatieagenda, met als onderdeel daarvan (coördinatie van) evaluaties van fiscale regelingen op
      effectiviteit en doelmatigheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.a.iv
    text: Inzicht verschaffen in budgettaire ontwikkeling en omvang fiscale regelingen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.b
    text: 'de afdeling Strategie en Parlementaire aangelegenheden met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.b.i
    text: |-
      Adviseren over de vormgeving van het nationale fiscale beleid, hieronder valt onder meer het proactief zicht houden
      op, het betrokken zijn bij en het coördineren van fiscaal beleid en regelgeving;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.b.ii
    text: Voorbereiden van beleid en adviseren over de vormgeving van het fiscale stelsel als geheel;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.b.iii
    text: Assisteren van de bewindspersonen bij de parlementaire behandeling van fiscale voorstellen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.b.iv
    text: Een bijdrage leveren aan een doelmatig en beheerst decentraal belastinggebied.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c
    text: 'de afdeling Europese en Internationale Zaken (EIZ) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c.i
    text: |-
      Deelnemen aan internationaal en (inter)departementaal overleg over Europese (EU) en internationale fiscale
      onderwerpen (o.a. in OESO-verband);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c.ii
    text: |-
      Signaleren en beoordelen van en onderhandelen over wijzigingen in de Europese en internationale beleidsvorming
      en belastingwetgeving;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c.iii
    text: Adviseren over in internationaal verband in te nemen standpunten inzake directe en indirecte belastingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c.iv
    text: Coördineren van de behandeling van alle Europese (EU) en internationale belastingdossiers (o.a. in OESO-verband);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c.v
    text: |-
      Ontwikkelen van nationaal fiscaal beleid voor zover dit door de belastingdiscussies in Europees verband wordt
      beïnvloed;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c.vi
    text: Het coördineren en voorbereiden van fiscale staatssteunprocedures bij de Europese Commissie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.c.vi
    text: Het voorbereiden van fiscale procedures voor het Europese Hof van Justitie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.d
    text: 'de afdeling Opdrachtgeverschap:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.d.i
    text: |-
      Is verantwoordelijk voor het (coördinerend) opdrachtgeverschap van het directoraat-generaal Belastingdienst
      en de ondersteuning van het (coördinerend) opdrachtgeverschap richting het directoraat-generaal Douane en het
      directoraat-generaal Toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.d.ii
    text: |-
      Is verantwoordelijk voor de overlegcyclus tussen de opdrachtgevers van het v Belastingdienst en het directoraat-
      generaal Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.d.iii
    text: |-
      Levert een bijdrage aan de overlegcycli van de opdrachtgevers van het directoraat-generaal Douane respectievelijk
      het directoraat-generaal Toeslagen met deze uitvoerende directoraten-generaal;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.d.iv
    text: |-
      Is verantwoordelijk binnen het directoraat-generaal Fiscale Zaken voor de inhoudelijke en procesmatige
      voorbereiding van de driehoeken Belastingdienst, Douane en Toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.d.v
    text: |-
      Is binnen het directoraat-generaal Fiscale Zaken verantwoordelijk voor de advisering over de IV portfolio’s van het
      directoraat-generaal Belastingdienst, het directoraat-generaal Douane en het directoraat-generaal Toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.d.vi
    text: |-
      Is verantwoordelijk voor het opbouwen van kennis en bestuurlijke advisering op het gebied van toezicht,
      dienstverlening, uitvoeringskosten informatievoorziening en governance.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.e
    text: 'de afdeling Bestuursondersteuning met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.e.i
    text: |-
      Het ondersteunen van het traject van wetgeving en verdragen voor alle directies van het directoraat-generaal
      Fiscale Zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.e.ii
    text: |-
      Het uitzetten en afhandelen van prejudiciële vragen van het Hof van Justitie van de EG en het bijhouden van diverse
      overzichten, zoals die van lopende wet- en regelgeving, moties en toezeggingen en van te implementeren Europese
      fiscale regelgeving;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.e.iii
    text: Het beheren van overzichten van Kamervragen, Commissieverzoeken, moties en toezeggingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.e.iv
    text: Het fungeren als aanspreekpunt voor Wob-zaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: 27.2.e.v
    text: De coördinatie van planning & controlproducten.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel27
  - number: '28.1'
    text: 'De directie Verbruiksbelastingen, Douane en Internationale aangelegenheden (VDI) heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.a
    text: |-
      Het voorbereiden en het ontwikkelen van en het adviseren over bilaterale en multilaterale regelingen ter voorkoming
      van internationale dubbele belastingheffing alsmede zetelovereenkomsten van internationale organisaties in
      Nederland;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.b
    text: |-
      Het voorbereiden en ontwikkelen van en het adviseren over unilaterale regelingen ter voorkoming van internationale
      dubbele belastingheffing;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.c
    text: |-
      In multilateraal verband (OESO, VN, e.d.) bijdragen aan internationale fiscale beleidsontwikkeling inzake de
      directe belastingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.d
    text: |-
      Het uitvoeren van de taak van de bevoegde autoriteit in het kader van tot stand gekomen bilaterale of multilaterale
      regelingen ter voorkoming van dubbele belastingheffing;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.e
    text: |-
      Het beleid en de regelgeving op het terrein van fiscale vrijstelling voor functionarissen bij in Nederland
      gevestigde ambassades en bij internationale en militaire organisaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.f
    text: |-
      Voorbereiden van de door bewindspersonen of de algemene leiding van het directoraat-generaal Fiscale Zaken te nemen
      beleidsbeslissingen op het gebied van verbruiksbelastingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.g
    text: |-
      Het ontwerpen en toelichten, al dan niet in participatie met andere departementen en internationale organisaties,
      van wetgeving op het gebied van verbruiksbelastingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.h
    text: |-
      Voorbereiden van de beleidsbeslissingen op het gebied van douane, internationale regelingen en het formele
      douanerecht;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.i
    text: |-
      Het ontwerpen en toelichten, al dan niet in participatie met andere departementen, de EU en internationale
      organisaties (waaronder de WDO), van wetgeving en internationale regelingen op het gebied van douane;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.1.j
    text: Het optreden als coördinerend opdrachtgever van het directoraat-generaal Douane.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: '28.2'
    text: 'De directie VDI is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.a
    text: 'de afdeling Internationale aangelegenheden (IA) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.a.i
    text: |-
      Tot stand brengen van bilaterale verdragen ter voorkoming van dubbele belasting en ontgaan van enkelvoudige
      belasting in internationaal verband;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.a.ii
    text: |-
      In multilateraal verband (OESO, VN, e.d.) bijdragen aan internationale fiscale beleidsontwikkeling inzake de
      directe belastingen en het tot stand brengen van multilaterale verdragen op dit terrein;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.a.iii
    text: |-
      Beheren c.q. verzorgen van wijzigingen en vaststellen van de uitvoeringsregelingen en voorschriften van
      het [Besluit Voorkoming Dubbele Belasting 2001][ref1], de [Belastingregeling voor het Koninkrijk][ref2],
      de [Belastingregeling voor het land Nederland][ref3], de [Belastingregeling Nederland Curaçao][ref4] en de
      [Belastingregeling Nederland Sint Maarten][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0012095
      [ref2]: https://wetten.overheid.nl/BWBR0002464
      [ref3]: https://wetten.overheid.nl/BWBR0029675
      [ref4]: https://wetten.overheid.nl/BWBR0037077
      [ref5]: https://wetten.overheid.nl/BWBR0037547
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012095
      - id: ref2
        bwb_id: BWBR0002464
      - id: ref3
        bwb_id: BWBR0029675
      - id: ref4
        bwb_id: BWBR0037077
      - id: ref5
        bwb_id: BWBR0037547
  - number: 28.2.a.iv
    text: |-
      Adviseren over zetelovereenkomsten van internationale organisaties in Nederland, alsmede over het beleid en de
      regelgeving op het terrein van fiscale vrijstelling voor functionarissen bij in Nederland gevestigde ambassades en
      bij internationale en militaire organisaties.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.b
    text: 'de afdeling Milieubelastingen en Accijnzen (M&A) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.b.i
    text: Het adviseren over beleid en het voorbereiden, opstellen en toelichten van wetgeving op het gebied
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.b.i.1
    text: |-
      de accijnzen (accijns op alcoholhoudende dranken, tabak, minerale olie) en de verbruiksbelasting op alcoholvrije
      dranken);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.b.i.2
    text: de autobelastingen (BPM, motorrijtuigenbelasting en BZM -eurovignet-);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.b.i.3
    text: |-
      de belastingen op basis van de [Wet belastingen op milieugrondslag][ref1] (energiebelastingen, belasting op
      kolen, belasting op leidingwater, afvalstoffenbelasting, vliegbelasting, co heffing industrie, co minimumprijs
      elektriciteit);


      [ref1]: https://wetten.overheid.nl/BWBR0007168
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007168
  - number: 28.2.b.i.4
    text: fiscale vergroening in den brede.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.b.ii
    text: |-
      Het formuleren en het inbrengen in onderhandelingen van Nederlands standpunten ten aanzien van Europese voorstellen
      op bovengenoemde terreinen
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.c
    text: 'de afdeling Btw en Overdrachtsbelasting (BTW&OVB) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.c.i
    text: 'Het adviseren over beleid en het voorbereiden, opstellen en toelichten van wetgeving op het gebied van:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.c.i.1
    text: de omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.c.i.2
    text: de overdrachtsbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.c.i.3
    text: de assurantiebelasting.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.c.ii
    text: |-
      Het formuleren en het inbrengen in onderhandelingen van Nederlands standpunten ten aanzien van Europese voorstellen
      op bovengenoemde terreinen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.d
    text: 'de afdeling Douane met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.d.i
    text: Het algemene douanebeleid (inclusief BES);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.d.ii
    text: Het formele en materiële nationale (inclusief BES) en Europese douanerecht en het formaliteitenstelsel;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.d.iii
    text: Internationale verdragen op douanegebied;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.d.iv
    text: |-
      Internationale samenwerking en externe betrekkingen op douanegebied alsmede in multilateraal verband (bij de WDO,
      VN, IMO e.d.) bijdragen aan internationale beleidsontwikkeling op het gebied van douane.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.d.v
    text: Het niet-fiscale douanebeleid en wetgeving;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: 28.2.d.vi
    text: Het optreden als coördinerend opdrachtgever van het directoraat-generaal Douane.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel28
  - number: '29.1'
    text: 'De Directie Directe Belastingen & Toeslagen (DB&T) heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.1.a
    text: |-
      Voorbereiden van de door bewindspersonen of de algemene leiding van het directoraat-generaal voor Fiscale Zaken te
      nemen beleidsbeslissingen op het gebied van directe belastingen, het formele belastingrecht, het invorderingsrecht,
      de algemene wet inkomensafhankelijke regelingen en wat daarmee verband houdt;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.1.b
    text: |-
      Het ontwerpen en toelichten van wetgeving op het gebied van de directe belastingen het formele belastingrecht, het
      invorderingsrecht, de algemene wet inkomensafhankelijke regelingen en wat daarmee verband houdt;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.1.c
    text: Het optreden als coördinerend opdrachtgever voor het directoraat-generaal Toeslagen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: '29.2'
    text: 'De directie DB&T is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.a
    text: |-
      de afdeling Arbeid en Vermogen (AV) met als taken het adviseren over beleid en het, voorbereiden, opstellen en
      toelichten van wetgeving op het gebied van:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.a.i
    text: |-
      de inkomstenbelasting anders dan met betrekking tot winst uit onderneming, loon uit dienstbetrekking en het tarief
      van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.a.ii
    text: |-
      het recht van successie, schenking en overgang, alsmede de [Natuurschoonwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001939
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001939
  - number: 29.2.a.iii
    text: de kansspelbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.a.iv
    text: |-
      de [registratiewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002739
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002739
  - number: 29.2.a.v
    text: de loonbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.a.vi
    text: inkomsten uit dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.a.vii
    text: belastbare periodieke uitkeringen en verstrekkingen en uitgaven voor inkomensvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.a.viii
    text: |-
      het tarief van de inkomstenbelasting en de sociale verzekeringswetten voor zover de uitvoering daarvan is
      opgedragen aan de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.b
    text: |-
      de afdeling Winst met als taken het adviseren over beleid en het, voorbereiden, opstellen en toelichten van
      wetgeving op het gebied van:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.b.i
    text: de inkomstenbelasting wat betreft ondernemingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.b.ii
    text: de vennootschapsbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.b.iii
    text: de dividendbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.b.iv
    text: de bronbelasting op rente, royalty’s en dividenden;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.b.v
    text: de bankenbelasting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.b.vi
    text: de belastingen op de BES-eilanden.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.c
    text: |-
      de afdeling Fiscale Rechtsbeginselen en Invordering (FRI) met als taken het adviseren over beleid en het,
      voorbereiden, opstellen en toelichten van wetgeving op het gebied van:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.c.i
    text: het formele recht betreffende de heffing van belastingen met uitzondering van invoerrechten en accijnzen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.c.ii
    text: het invorderingsrecht met uitzondering van dat betreffende invoerrechten en accijnzen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.c.iii
    text: de internationale bijstandsverlening bij de heffing en inning van belastingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.c.iv
    text: |-
      de [Wet waardering onroerende zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: 29.2.c.v
    text: |-
      belastingen, premies, heffingen of inkomensafhankelijke regelingen die primair andere ministeries aangaan, doch
      waarbij wordt aangesloten bij het formele belastingrecht of het invorderingsrecht of bij directe belastingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.c.vi
    text: de heffingskortingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.c.vii
    text: de verwerkingen van gegevens door de Belastingdienst, Toeslagen en Douane.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.d
    text: |-
      de afdeling Toeslagen met als taken het adviseren over beleid en het voorbereiden, opstellen en toelichten van
      wetgeving op het gebied van:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.d.i
    text: het toeslagenstelsel;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
  - number: 29.2.d.ii
    text: |-
      het opdrachtgeverschap ten aanzien van de [Algemene wet inkomensafhankelijke regelingen][ref1] voor het
      directoraat-generaal Toeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: '30.1'
    text: |-
      De directeur-generaal Rijksbegroting is verantwoordelijk voor de beleidsterreinen van de onder hem ressorterende
      directies, genoemd in dit hoofdstuk, voor de samenhang tussen die beleidsterreinen en voor de bijbehorende
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel30
  - number: '30.2'
    text: De directeur-generaal Rijksbegroting heeft een plaatsvervanger die hem bij afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel30
  - number: '30.3'
    text: De directeur-generaal Rijksbegroting geeft leiding aan de onder hem ressorterende directeuren.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel30
  - number: '31'
    text: 'Het directoraat-generaal van de Rijksbegroting bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel31
  - number: 31.a
    text: het Bureau Directeur-Generaal;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel31
  - number: 31.b
    text: de directie Begrotingszaken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel31
  - number: 31.c
    text: de Inspectie der Rijksfinanciën.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel31
  - number: '32'
    text: 'Het directoraat-generaal van de Rijksbegroting:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32
  - number: 32.a
    text: adviseert met betrekking tot de beheersing van de collectieve uitgaven van het Rijk;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32
  - number: 32.b
    text: |-
      bevordert namens de minister, in haar rol als systeemverantwoordelijke voor het financieel beheer van het Rijk, de
      doelmatigheid, doeltreffendheid en rechtmatigheid van de collectieve uitgaven;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32
  - number: 32.c
    text: doet voorstellen voor effectieve begrotingsregels en infrastructuur van de begroting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32
  - number: 32.d
    text: voorziet in transparantie over de budgettaire besluitvorming;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32
  - number: 32.e
    text: heeft een strategie- en onderzoeksfunctie op haar beleidsterrein.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32
  - number: 32a.1
    text: Het Bureau Directeur-Generaal (BDG) staat onder leiding van de DG-secretaris.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32a
  - number: 32a.2
    text: 'Het Bureau Directeur-Generaal heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32a
  - number: 32a.2.a
    text: Bestuursadvisering;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32a
  - number: 32a.2.b
    text: Procescoördinatie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32a
  - number: 32a.2.c
    text: Bestuursondersteuning.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel32a
  - number: '33.1'
    text: 'De Directie Begrotingszaken (BZ) heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.a
    text: Adviseert over het begrotingsbeleid en over de uitvoering van de begroting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.b
    text: Adviseert over de beleidsontwikkeling van de financiële functie en de auditfunctie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.c
    text: Adviseert over interne en externe verzelfstandigingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.d
    text: Adviseert over de beleidsontwikkeling inzake het financiële beheer van en de verantwoording over Europese middelen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.e
    text: Adviseert over de regelgeving voor de financiële functie en de auditfunctie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.f
    text: |-
      Coördineert de totstandkoming van de Miljoenennota, het Financieel Jaarverslag van het Rijk en de Nationale
      Verklaring inzake Europese middelen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.g
    text: Is belast met de centrale financiële administratie van ’s Rijks schatkist;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.1.h
    text: Verzorgt opleidingen ten behoeve van de financiële functie, de auditfunctie en de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: '33.2'
    text: 'De directie Begrotingszaken is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a
    text: 'de afdeling Begrotingsbeheer (BBH) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a.i
    text: |-
      Adviseert over de beleidsontwikkeling van de financiële functie (beleidsvoering, begrotingsbeheer en financiële
      bedrijfsvoering);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a.ii
    text: |-
      Adviseert over de informatievoorziening (inhoud en presentatie) van het Parlement en andere betrokkenen met
      betrekking tot de beleidsvoering en de bedrijfsvoering bij de rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a.iii
    text: Adviseert over de beleidsontwikkeling van het schatkistbankieren;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a.iv
    text: |-
      Coördineert de totstandkoming van de regelgeving voor de financiële functie alsook het bevorderen van de kwaliteit
      van de financiële functie en verzorgt de juridische toetsing van de regelgeving van DGRB;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a.v
    text: Coördineert en houdt toezicht op het begrotings- en verantwoordingsproces;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a.vi
    text: Coördineert de totstandkoming van de Miljoenennota en het FJR;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.a.vii
    text: Coördineert de rijksbrede Financial traineeships.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b
    text: 'de afdeling Begrotingsbeleid (BBL) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b.i
    text: |-
      Adviseert over het begrotingsbeleid, waaronder de budgettaire normering van de collectieve sector en
      risicoregelingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b.ii
    text: Adviseert over de uitvoering van de begroting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b.iii
    text: Draagt inhoudelijk bij aan de Miljoenennota en de overige budgettaire nota’s;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b.iv
    text: Is belast met het analyseren van de overheidsuitgaven vanuit macro-economisch perspectief;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b.v
    text: Adviseert over de normering van het Gemeente- en het Provinciefonds;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b.vi
    text: Is belast met het begrotingsbeheer van het BTW-compensatiefonds;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.b.vii
    text: Adviseert over de beleidsontwikkeling van het schatkistbankieren.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c
    text: 'de afdeling Besturing, Bekostiging en Externe verslaggeving (BBE) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.i
    text: |-
      Adviseert over het beleid voor de aansturing, bekostiging en verantwoording van verzelfstandigde organisaties zoals
      agentschappen, ZBO’s, RWT’s en stichtingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.ii
    text: |-
      Adviseert over en begeleidt de instellings- en opheffingstrajecten (en fusies) van agentschappen, ZBO’s, RWT’s
      en stichtingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.iii
    text: Adviseert over en begeleidt de doorlichtingen (evaluaties) van verzelfstandigde organisaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.iv
    text: Adviseert over het auditbeleid en het toezicht binnen het rijk;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.v
    text: Adviseert over de beleidsontwikkeling inzake het financiële beheer van en de verantwoording over Europese middelen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.vi
    text: |-
      Coördineert jaarlijks de totstandkoming van het Nederlandse standpunt inzake de decharge EU begroting en de
      nationale verantwoording (Nationale Verklaring) inzake Europese middelen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.vii
    text: Adviseert over het Rijkssubsidiebeleid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.c.viii
    text: Coördineert de totstandkoming van de regelgeving voor de auditfunctie.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d
    text: 'de afdeling Rijkshoofdboekhouding (RHB) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d.i
    text: Is belast met de centrale financiële administratie van ’s Rijks schatkist;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d.ii
    text: Is belast met het beheer van leningen die door de Staat aan derden zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d.iii
    text: |-
      Voert die rechtshandelingen uit, die betrekking hebben op het converteren van USD naar EUR en vice versa voor zover
      deze betrekking hebben op leningen aan Curaçao en Sint Maarten in het kader van de lopende inschrijving;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d.iv
    text: |-
      Verzorgt rapportages over o.a. het EMU-saldo en over financiële activa en passiva op de Rijkssaldibalans en de
      Staatsbalans;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d.v
    text: Initieert de daadwerkelijke overboekingen van gelden die aan de EC toekomen (op basis van een signaal van EC zelf);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d.vi
    text: Is belast met de zorg voor de financiële informatiesystemen van het DG Rijksbegroting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.d.vii
    text: Vervult de functie van informatiemanagement (directie breed) en is eerste aanspreekpunt voor IT-gerelateerde zaken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.e
    text: 'de Rijksacademie voor Financiën, Economie en Bedrijfsvoering (RAFEB) met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.e.i
    text: Verzorgt opleidingen over financieel management, audit en economie en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: 33.2.e.ii
    text: Verzorgt ondersteuning van buitenlandse centrale overheidsinstanties op gebied van financieel management en audit.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel33
  - number: '34.1'
    text: 'De Inspectie der Rijksfinanciën (IRF) heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.1.a
    text: Houdt toezicht op de rijksbegroting;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.1.b
    text: |-
      Adviseert de minister en de vakdepartementen, in het bijzonder in het kader van de begrotingsvoorbereiding en
      begrotingsuitvoering;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.1.c
    text: |-
      Beoordeelt alle voorstellen in het kader van de begrotingsvoorbereiding en begrotingsuitvoering van
      vakdepartementen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.1.d
    text: Adviseert over het algemene begrotingsbeleid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.1.e
    text: Levert bijdragen aan het algemene begrotingsproces;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.1.f
    text: Verricht onderzoek naar de doelmatigheid van de Rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.1.g
    text: Adviseert over de doelmatigheid van de Rijksoverheid.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: '34.2'
    text: 'De Inspectie der Rijksfinanciën is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a
    text: 'Secties die de werkzaamheden als bedoeld in het eerste lid uitvoeren, onderverdeeld in:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.i
    text: Sectie Economische Zaken en Klimaat;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.ii
    text: Sectie Onderwijs, Cultuur en Wetenschappen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.iii
    text: Sectie Sociale Zaken en Werkgelegenheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.iv
    text: Sectie Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.v
    text: Sectie Infrastructuur en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.vi
    text: Sectie Binnenlandse Zaken en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.vii
    text: Sectie Justitie en Veiligheid, Algemene Zaken, Rechtspositie Sector Overheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.viii
    text: Sectie Landbouw, Natuur en Voedselkwaliteit;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.ix
    text: Sectie Financiën en Coördinatie Decentrale Overheden;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.a.x
    text: Sectie Defensie, Buitenlandse Zaken en Handel en Ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.b
    text: |-
      Bureau Begrotingsvoorbereiding (BBV), met als taak de coördinatie van de (interdepartementale)
      begrotingswerkzaamheden van de IRF;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.c
    text: 'Bureau Strategische Analyse (BSA), met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.c.i
    text: adviseren over strategische beleidskeuzes;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.c.ii
    text: coördineren van Interdepartementale Beleidsonderzoeken (IBO’s);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: 34.2.c.iii
    text: regelgeving maken voor beleidsevaluaties.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel34
  - number: '35.1'
    text: |-
      De thesaurier-generaal is verantwoordelijk voor de beleidsterreinen van de onder hem ressorterende directies,
      genoemd in dit hoofdstuk, voor de samenhang tussen die beleidsterreinen en voor de bijbehorende bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel35
  - number: '35.2'
    text: De thesaurier-generaal heeft een plaatsvervanger die hem bij afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel35
  - number: '35.3'
    text: De thesaurier-generaal geeft leiding aan de onder hem ressorterende directeuren.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel35
  - number: '36'
    text: 'De Generale Thesaurie bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel36
  - number: 36.a
    text: de directie Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel36
  - number: 36.b
    text: het Agentschap van de Generale Thesaurie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel36
  - number: 36.c
    text: de directie Buitenlandse Financiële Betrekkingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel36
  - number: 36.d
    text: de directie Deelnemingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel36
  - number: 36.e
    text: de programmadirectie Herstel- en Veerkrachtplan.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel36
  - number: '37'
    text: 'De Generale Thesaurie:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel37
  - number: 37.a
    text: |-
      adviseert over het beleid ten aanzien van de financiële markten en het toezicht daarop en bereidt de daartoe
      benodigde wetgeving voor;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel37
  - number: 37.b
    text: voorziet in de uitgifte en het beheer van de Nederlandse staatsschuld;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel37
  - number: 37.c
    text: adviseert over buitenlands financiële betrekkingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel37
  - number: 37.d
    text: vervult namens de bewindspersoon het aandeelhouderschap in de staatsdeelnemingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel37
  - number: 37.e
    text: adviseert over publiek-private samenwerking;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel37
  - number: 37.f
    text: heeft een strategie- en onderzoeksfunctie op zijn beleidsterrein.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel37
  - number: '38.1'
    text: 'De directie Financiële Markten (FM) kent de volgende operationele doelstellingen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.1.a
    text: |-
      Goed functionerende, stabiele financiële markten die voldoende toegankelijk en transparant zijn voor de gebruikers
      en internationaal concurrerend zijn;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.1.b
    text: Een integer financieel stelsel dat de toegang van de onderwereld tot de legale economie ontzegt;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.1.c
    text: |-
      Ongestoorde muntcirculatie door middel van muntvoorziening met als randvoorwaarde kosteneffectiviteit, alsmede het
      uitbrengen van bijzondere herdenkingsmunten.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: '38.2'
    text: 'De directie FM is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a
    text: 'Afdeling Institutioneel beleid en Integriteit met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.i
    text: 'Wetgevingskwaliteit en architectuur van toezicht:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.i.a
    text: beleidsvoorbereiding FATF;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.i.b
    text: |-
      beleidsvorming en wetgeving integriteit financiële sector inclusief antiwitwaswetgeving, terrorismebestrijding (in
      het bijzonder terrorismefinanciering), bevriezingsmaatregelen en andere financiële sancties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.ii
    text: 'Beleid en wetgeving Integriteit financiële sector:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iii
    text: 'Handhavingsvraagstukken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iii.a
    text: zorgdragen voor beleidsmatige afstemming van de taken van het Financieel expertisecentrum (FEC);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iii.b
    text: beleidsbepaling informatie-uitwisseling/geheimhouding;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iii.c
    text: tot stand brengen handhavingsarrangementen toezicht/FIOD/OM;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iii.d
    text: beleidsbepaling bevoegdheden toezichthouders;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iii.e
    text: beleidsbepaling boetes en dwangsommen,
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iv
    text: 'Muntwezen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iv.a
    text: opdracht verlenen tot/monitoren van productie euromunten;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iv.b
    text: zorgdragen (via DNB) voor muntdistributie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.iv.c
    text: verzorgen uitgifte bijzondere munten.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.a.v
    text: Coördinatie FM budgetten/onderzoeken, IX-B cyclus e.d.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.b
    text: 'Afdeling Financiële stabiliteit met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.b.i
    text: het bevorderen van de stabiliteit van het financiële stelsel;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.b.ii
    text: het bevorderen van de financiële soliditeit van aanbieders in de financiële sector;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.b.iii
    text: Het bevorderen van de betrouwbaarheid en stabiliteit van het betalingsverkeer en clearing and settlement;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.b.iv
    text: |-
      Het maken en behandelen van beleid en regelgeving voor bedrijfseconomisch toezicht op financiële instellingen, op
      nationaal en internationaal gebied;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.b.v
    text: Het zorgdragen voor een solide kader voor de financiële bedrijfsvoering in de (semi) publieke sector.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.c
    text: 'Afdeling Marktgedrag en effectenverkeer met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.c.i
    text: |-
      Het bewaken van de verhouding tussen de onderneming en kapitaalverschaffers (corporate governance, verslaggeving,
      doorlopende verplichtingen, meldingszeggenschap);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.c.ii
    text: |-
      Het bewaken van de gedragsregels tussen de spelers op de financiële markten (beurzen, giraal effectenverkeer,
      marktmisbruik);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.c.iii
    text: |-
      Het bewaken van de verhouding tussen financiële dienstverleners (aanbieders, bemiddelaars en adviseurs) en de
      consument (informatieverstrekking, zorgplicht, garantieregelingen);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: 38.2.c.iv
    text: |-
      Missing markets/overheidscoördinatie (nucleaire aansprakelijkheid, motorrijtuigen, terrorismeverzekeringen,
      collectieve sector).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel38
  - number: '39.1'
    text: 'Het Agentschap van de Generale Thesaurie heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.1.a
    text: De uitvoering van de financiering van de staatsschuld;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.1.b
    text: |-
      Het beheer van publieke middelen en de bijbehorende geldstromen door middel van schatkistbankieren en het
      betalingsverkeer van het Rijk.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: '39.2'
    text: 'Het Agentschap van de Generale Thesaurie is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.a
    text: 'de afdeling Cashmanagement en Kapitaalmarktoperaties (CMK), met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.a.i
    text: |-
      Is belast met het afsluiten van financiële transacties op de geld- en kapitaalmarkt, waaronder het plaatsen van
      staatsleningen en schatkistpapier en het afsluiten van transacties om risico’s af te dekken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.a.ii
    text: |-
      Is verantwoordelijk voor de publicaties van het Agentschap, de website van het Agentschap en onderhoudt de
      communicatie en relatie met marktpartijen inzake plaatsing van staatsleningen en schatkistpapier;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.a.iii
    text: Koopt betaaldiensten in voor de gehele Rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.a.iv
    text: |-
      Voert coördinatie over de inrichting van het betalingsverkeer van de Rijksoverheid en onderhoudt de relatie
      hierover met de banken en betaaldienstverleners;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.a.v
    text: |-
      Voert het accountmanagement uit van de deelnemers aan het schatkistbankieren en onderhoudt de relatie met de
      vakdepartementen en de banken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.a.vi
    text: |-
      Maakt beleid en richtlijnen ten aanzien van de financiering van de staatsschuld, het cashmanagement, het
      schatkistbankieren en de betaalinfrastructuur, binnen de gestelde (beleids)kaders.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b
    text: 'de afdeling Strategie, Risicomanagement en Control (SRC), met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.i
    text: |-
      Draagt zorg voor de advisering, (beleids)kaders en de naleving hiervan op het gebied van de financiering van de
      staatsschuld, het cashmanagement, het schatkistbankieren en het betalingsverkeer, inclusief het daarvoor benodigde
      analyse en onderzoek;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.ii
    text: |-
      Initieert, organiseert en coördineert periodieke evaluatieonderzoeken en andere evaluaties op de beleidsterreinen
      van het Agentschap;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.iii
    text: |-
      Bereidt deelname voor door het Agentschap aan internationale gremia (zoals het Economic and Financial Committee's
      Sub-Committee on EU Sovereign Debt Markets (ESDM) en Organisation for Economic Cooperation and Development (OECD));
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.iv
    text: |-
      Behandelt en adviseert over juridische vraagstukken voortvloeiende uit de taken van het Agentschap, inclusief zaken
      met betrekking tot naoorlogs rechtsherstel;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.v
    text: |-
      Is verantwoordelijk voor het beheer van mandaten en (voor zover niet extern belegd) voor de uitvoering van de
      compliancefunctie van het Agentschap, waarbij zij tevens tot taak heeft partijen waarmee het Agentschap samenwerkt
      te screenen op integriteit, als onderdeel waarvan persoonsgegevens, waaronder strafrechtelijke persoonsgegevens,
      kunnen worden verwerkt wanneer dat noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.vi
    text: Ontwikkelt beleid voor en adviseert over het financieel, operationeel en integriteitsrisicomanagement;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.vii
    text: Rapporteert over en beheerst de financiële, operationele en integriteitsrisico’s;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.viii
    text: Adviseert over de bedrijfsvoering van het Agentschap;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.ix
    text: Vervult de controlfunctie en is verantwoordelijk voor de planning- en controlcyclus;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.x
    text: |-
      Is betrokken bij de begrotingsvoorbereiding en -uitvoering van artikel 11 en 12 van begroting IX (Nationale Schuld
      en Kasbeheer);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.xi
    text: Is verantwoordelijk voor de financiële administratie en legt via het Jaarverslag verantwoording af;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.xii
    text: Is verantwoordelijk voor de administratieve organisatie en interne controle;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.b.xiii
    text: |-
      Is verantwoordelijk voor het samenstellen van de periodieke managementinformatie en verschillende periodieke
      rapportages voor stakeholders binnen en buiten het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c
    text: 'de afdeling Staatsschuld- en Schatkistbeheer (SSB), met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.i
    text: |-
      Voert het beheer over de portefeuille staatsschuld en draagt zorg voor de daaruit voortvloeiende rechten en
      verplichtingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.ii
    text: Draagt zorg voor het collateral management;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.iii
    text: |-
      Draagt zorg voor het voorbereiden van emissies en verzorgt de financiële en administratieve afwikkeling hiervan en
      van de in het kader van de saldoregulering afgesloten geldmarkttransacties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.iv
    text: |-
      Draagt zorg voor prognosticeren van de inkomsten en uitgaven van het Rijk en bewaakt in een continue proces dat de
      schatkiststand bij het einde van de dag tussen de daartoe aangegeven bandbreedte sluit, beheert het schatkistsaldo
      bij DNB en het kas- en het saldobeheer bij de overige banken voor de Rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.v
    text: |-
      Draagt zorg voor de registratie en de daaruit voortvloeiende rechten en verplichtingen die voortkomen uit het
      schatkistbankieren en regelt nieuwe deelnemers in;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.vi
    text: |-
      Is verantwoordelijk voor het beheer en de administratie van de garantstelling voor de uitgifte van middellang
      schuldpapier van banken;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.vii
    text: |-
      Vervult de traditionele Mid-Office functie van het Agentschap bestaande uit onder andere de controle op de
      uitvoering van transacties door de afdeling CMK en de bewaking van limieten, waarbij zij tevens tot taak heeft
      partijen waarmee het Agentschap samenwerkt te screenen op integriteit, als onderdeel waarvan persoonsgegevens,
      waaronder strafrechtelijke persoonsgegevens, kunnen worden verwerkt wanneer dat noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.c.viii
    text: |-
      Maakt beleid en richtlijnen ten aanzien van het uitvoeren van de werkzaamheden als bedoeld in de subonderdelen i.
      tot en met vii., waaronder de afwikkeling van financiële transacties en raming van de schatkiststand, binnen de
      gestelde (beleids)kaders.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d
    text: 'de afdeling Informatievoorziening en Data (IVD), met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.i
    text: Beheert de static data van het Agentschap;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.ii
    text: Beheert de autorisaties van gebruikers in Agentschap-specifieke applicaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.iii
    text: |-
      Is verantwoordelijk voor het functioneel inrichten van Agentschap-specifieke applicaties, waaronder het
      testmanagement en het beheer en onderhoud van de vereisten van deze applicaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.iv
    text: Ondersteunt gebruikers bij het gebruik van Agentschap-specifieke applicaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.v
    text: Adviseert over ontwikkelingen en innovaties ten aanzien van Agentschap- specifieke applicaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.vi
    text: |-
      Bereidt ICT-beleid voor en voert dit uit en adviseert over ICT-gerelateerde vraagstukken en projecten van het
      Agentschap;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.vii
    text: Waarborgt de kwaliteit van de informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.viii
    text: Bewaakt de beschikbaarheid, integriteit en vertrouwelijkheid van Agentschap- specifieke applicaties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.ix
    text: Is verantwoordelijk voor de domeinarchitectuur van het Agentschap;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: 39.2.d.x
    text: Is verantwoordelijk voor het data- en informatiemanagement van het Agentschap.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel39
  - number: '40.1'
    text: 'De Directie Buitenlandse Financiële Betrekkingen (BFB) heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.1.a
    text: Het voorbereiden en coördineren van het beleid inzake de internationale monetaire en financiële aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.1.b
    text: Het voorbereiden en coördineren van het standpunt van Financiën inzake Europese integratie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.1.c
    text: Het voorbereiden en coördineren van het beleid inzake internationale financiële instellingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.1.d
    text: |-
      Het adviseren omtrent andere internationale vraagstukken, en het assisteren van de departementsleiding bij
      internationale contacten;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.1.e
    text: |-
      Het voorbereiden en coördineren van nationaal en internationaal beleid op het gebied van exportkredietverzekering,
      contra- en investeringsgaranties.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: '40.2'
    text: 'De Directie Buitenlandse Financiële Betrekkingen is onderverdeeld in de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.a
    text: 'de afdeling Europese Unie met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.a.i
    text: Voorbereiden van het beleid ten aanzien van de Economische en Monetaire Unie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.a.ii
    text: |-
      Voorbereiden en coördineren van het beleid van het Ministerie van Financiën ten aanzien van samenwerking in
      EU-verband en het bevorderen van een beheerste ontwikkeling van de EU-uitgaven met het oog op aanvaardbare
      ontwikkeling van de bruto-afdrachten aan de EU en de Nederlandse positie ten aanzien van de EU;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.a.iii
    text: Het coördineren van de Technische Assistentie binnen het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.b
    text: 'de afdeling Exportkredietverzekering en Investeringsgaranties met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.b.i
    text: |-
      Voorbereiden, coördineren en uitvoeren van nationaal en internationaal beleid op het gebied van
      exportkredietverzekering, contra- en investeringsgaranties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.b.ii
    text: Regelen van schulden met landen die in betalingsmoeilijkheden zijn geraakt;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.b.iii
    text: |-
      Voorbereiden en coördineren van betrokkenheid van het Ministerie van Financiën op het gebied van internationale
      handelsvraagstukken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.c
    text: 'de afdeling Internationale Economie en Financiële Instellingen met als taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.c.i
    text: |-
      Voorbereiden van het beleid ten aanzien van internationale monetaire en betalingsbalansvraagstukken (onder meer in
      het kader van IMF en OESO);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.c.ii
    text: Voorbereiden van het beleid ten aanzien van de internationale economische en financiële ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: 40.2.c.iii
    text: |-
      Voorbereiden van het Nederlandse beleid ten aanzien van ontwikkelingsbanken en -fondsen EBRD en EIB en financiële
      aspecten ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel40
  - number: '41.1'
    text: 'De Directie Deelnemingen heeft de volgende doelstellingen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.1.a
    text: Het beheer van staatsdeelnemingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.1.b
    text: Het oprichten, aangaan en (gedeeltelijk) afstoten van staatsdeelnemingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.1.c
    text: Het onderzoeken van en adviseren over strategische en bedrijfseconomische vraagstukken rondom staatsdeelnemingen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: '41.2'
    text: 'De Directie Deelnemingen bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.2.a
    text: de afdeling Deelnemingen Financiële Instellingen, Transport & Kansspelen (Deelnemingen FTK);
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.2.b
    text: de afdeling Deelnemingen Energie, Nucleair & Projecten (Deelnemingen ENP).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: '41.3'
    text: |-
      Aan de in het vorige lid genoemde afdelingen zijn de staatsdeelnemingen toegewezen die vallen binnen de aan hun
      toegewezen sectoren. Ten aanzien daarvan hebben beide afdelingen de volgende taken:
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.3.a
    text: |-
      Formuleren, evalueren en uitvoeren van beleid gericht op het oprichten, aangaan, (gedeeltelijk) afstoten en beheren
      van staatsdeelnemingen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.3.b
    text: Voorbereiden en bijwonen van aandeelhoudersvergaderingen en nemen van (bijzondere) aandeelhoudersbesluiten;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.3.c
    text: |-
      Uitvoeren van transacties t.b.v. het oprichten, aangaan, beheren en (gedeeltelijk) afstoten van staatsdeelnemingen,
      hetzij adviseren over/bewaken van dergelijke transacties van anderen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.3.d
    text: |-
      Ontwikkelen, vastleggen en verspreiden van kennis van financiële analysemethoden, kennis van corporate governance
      en waardevermeerdering van staatsdeelnemingen ten behoeve van het oprichten, aangaan, beheren en (gedeeltelijk)
      afstoten van staatsdeelnemingen en meer specifiek kennis van verkooptransacties;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.3.e
    text: Adviseren over strategische en bedrijfseconomische vraagstukken rondom staatsdeelnemingen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41
  - number: 41.0a
    text: 'De programmadirectie Herstel- en Veerkrachtplan heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41.0a
  - number: 41.0a.a
    text: het schrijven, uitwerken en afstemmen van de onderdelen van het Nederlands Herstel- en Veerkrachtplan;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41.0a
  - number: 41.0a.b
    text: het begeleiden en coördineren van de parlementaire behandeling van het Nederlands Herstel- en Veerkrachtplan;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41.0a
  - number: 41.0a.c
    text: het indienen van het Nederlands Herstel- en Veerkrachtplan bij de Europese Commissie;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41.0a
  - number: 41.0a.d
    text: |-
      het monitoren van de voortgang van de implementatie en het coördineren van de periodieke voortgangsrapportages aan
      de Europese Commissie over het Nederlands Herstel- en Veerkrachtplan gedurende de implementatiefase;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41.0a
  - number: 41.0a.e
    text: |-
      het, in samenwerking met de betrokken departementen en bouwend op aanbevelingen van de Auditdienst Rijk, regie
      houden over het monitorings-, controle- en auditsysteem en het begeleiden van de betrokken departementen en
      beleidsdirecties bij de implementatie van het Nederlandse Herstel- en Veerkrachtplan;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41.0a
  - number: 41.0a.f
    text: |-
      het namens de Nederlandse regering indienen van de betalingsverzoeken en bijbehorende Rijksbrede beheersverklaring
      en auditrapportages aan de Europese Commissie gedurende de implementatiefase (2023 – 2026).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41.0a
  - number: 41a.1
    text: De IBTD staat onder leiding van de inspecteur-generaal belastingen, toeslagen en douane (IG).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41a
  - number: 41a.2
    text: De IBTD ressorteert rechtstreeks onder de SG.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41a
  - number: 41a.3
    text: |-
      De IG rapporteert over zijn bevindingen, oordelen, adviezen en andere relevante gegevens rechtstreeks aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41a
  - number: 41a.4
    text: De IG stelt de organisatie van de IBTD nader vast in een organisatiebesluit.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41a
  - number: 41b
    text: 'De IBTD heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41b
  - number: 41b.a
    text: |-
      het ter beoordeling van de inspecteur-generaal signaleren, onderzoeken en agenderen van structurele en incidentele
      problemen in de kwaliteit van de uitvoering door de directoraten-generaal Belastingdienst, Toeslagen en Douane.
      De inspectie houdt toezicht vanuit het perspectief van de rechtsstatelijkheid en kijkt daarbij naar het volledige
      proces van wet- en regelgeving, uitvoering inclusief rechtsbescherming en rechtspraak;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41b
  - number: 41b.b
    text: |-
      het toezicht houden op de directoraten-generaal Belastingdienst, Toeslagen en Douane, zowel op de taakuitvoering
      door die directoraten-generaal, als op de aansturing en de samenwerkingsrelaties in het kader van de uitvoering, en
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41b
  - number: 41b.c
    text: |-
      het delen van bevindingen en adviezen met de bewindspersonen over onderwerpen die hen aangaan, voor zover het het
      werkterrein van de IBTD betreft.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41b
  - number: 41c
    text: De minister stelt nadere regels omtrent de taakuitoefening en bevoegdheden van de IBTD.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41c
  - number: 41d.1
    text: Het bureau BBT staat onder leiding van de belangenbehartiger voor belastingplichtigen en toeslaggerechtigden (BBT).
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41d
  - number: 41d.2
    text: 'Het bureau BBT bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41d
  - number: 41d.2.a
    text: de afdeling Triage en Relatiebeheer;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41d
  - number: 41d.2.b
    text: de afdeling Casusbehandeling;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41d
  - number: 41d.2.c
    text: de afdeling Strategie, Communicatie en Onderzoek.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41d
  - number: 41d.3
    text: |-
      Het bureau BBT ressorteert rechtstreeks onder de SG. De BBT kan over algemene bevindingen rechtstreeks rapporteren
      aan de bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41d
  - number: 41e
    text: 'Het bureau BBT heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41e
  - number: 41e.a
    text: |-
      het doorgeleiden van aangedragen individuele casuïstiek naar het best passende kanaal voor hulp en ondersteuning
      binnen en buiten het directoraat-generaal Belastingdienst en het directoraat-generaal Toeslagen;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41e
  - number: 41e.b
    text: het adviseren over aangedragen individuele casuïstiek van een belanghebbende;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41e
  - number: 41e.c
    text: |-
      het verzamelen van algemene signalen over aangedragen individuele casuïstiek en het delen van die signalen met de
      bewindspersoon, de IBTD en met een of beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41e
  - number: 41f
    text: De minister stelt nadere regels omtrent de taakuitoefening en bevoegdheden van de BBT en het bureau BBT.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41f
  - number: 41g.1
    text: 'Rechtstreeks onder de SG ressorteert de volgende regeringscommissaris:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41g
  - number: 41g.1.a
    text: 'de Bestuurlijk regisseur integrale ondersteuning, die tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41g
  - number: 41g.1.a.i
    text: |-
      het begeleiden van een verantwoorde en breed gedragen transitie van de gemeentelijke hersteltaken naar het regulier
      sociaal domein;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41g
  - number: 41g.1.a.ii
    text: het regisseren van het proces om te komen tot nadere kaderstelling en harmonisatie van de brede ondersteuning;
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41g
  - number: 41g.1.a.iii
    text: het bevorderen van een effectievere uitvoering van de integrale ondersteuning.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41g
  - number: 41g.2
    text: |-
      Een regeringscommissaris rapporteert over zijn bevindingen, oordelen, adviezen en andere relevante gegevens
      rechtstreeks aan de verantwoordelijke bewindspersoon van het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41g
  - number: 41h
    text: |-
      Bij besluit van de verantwoordelijke bewindspersoon van het Ministerie van Financiën kunnen aanvullende regels
      worden gesteld over de taakuitoefening van een regeringscommissaris die het betreft.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel41h
  - number: '42'
    text: |-
      De SG, de DG’s, de IG en de BBT leggen, aan het eind van het verslagjaar en tussentijds, gestructureerd
      verantwoording af over de uitvoering van aan hen opgelegde taken en het gebruik van daarbij verleende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel42
  - number: '43.1'
    text: |-
      De DG’s stellen ieder jaar een jaarplan op en bespreken dit met de SG. In het jaarplan worden beleidsdoelstellingen
      opgenomen, alsmede een risicoanalyse, voorgenomen activiteiten en budgetten.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel43
  - number: '43.2'
    text: |-
      De DG’s, de IG en de BBT stellen gedurende het jaar twee uitvoeringsrapportages op en bespreken deze met de SG. In
      de uitvoeringsrapportages wordt gerapporteerd over het realiseren van beleidsdoelstellingen en activiteiten, over
      de uitputting van budgetten en over bijzonderheden in de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel43
  - number: '43.3'
    text: |-
      Op basis van de uitvoeringsrapportages van de DG’s, de IG en de BBT stelt de directeur Financieel-Economische Zaken
      tweemaal per jaar een concernrapportage op die wordt besproken in de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel43
  - number: '43.4'
    text: |-
      De DG’s, de IG en de BBT stellen na afloop van ieder jaar een afsluitende uitvoeringsrapportage en een
      managementverklaring op en bespreken deze met de SG. In de managementverklaring wordt verslag gedaan van
      afwijkingen in de bedrijfsvoering en over de risicobeheersing daarbij. Voorts bevat de managementverklaring een
      oordeel over de rechtmatigheid van de gedane uitgaven.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel43
  - number: '43.5'
    text: |-
      De SG stelt na afloop van ieder jaar een samenvattende managementverklaring (bedrijfsvoeringsparagraaf) op en
      brengt deze ter kennis van de minister.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel43
  - number: '44.1'
    text: |-
      De directeur Financieel-Economische Zaken (FEZ) ondersteunt in de vorm van toezicht en advies de SG, de DG’s, de IG
      en de BBT bij hun overkoepelende verantwoordelijkheid voor beleidsterreinen en bijbehorende bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel44
  - number: '44.2'
    text: |-
      De hoofddirecteur FEZ vervult de rol van concerncontroller – vanuit de in wet- en regelgeving, waaronder
      de [Comptabiliteitswet 2016][ref1], vastgelegde taken – bij de totstandkoming van solide begrotingen en
      verantwoordingen in het kader van de planning- en controlcyclus, en bij de beoordeling van voorstellen met
      financiële gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0039429
  - number: '44.3'
    text: |-
      De verantwoordelijkheden en bevoegdheden van de directeur FEZ zijn vastgelegd in het [Besluit taak FEZ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005333
  - number: '45.1'
    text: |-
      De directeur Auditdienst Rijk (ADR), respectievelijk de certificerend accountant van de ministeries, verschaft
      zekerheid over de rechtmatigheid van verplichtingen, de uitgaven en de ontvangsten van de aangesloten ministeries.
      Hij voert de accountantscontrole uit op de jaarverslagen van deze ministeries. Hij informeert de algemene leiding,
      de bewindspersonen en het Audit Committee over de uitkomsten van deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel45
  - number: '45.2'
    text: |-
      In opdracht van de algemene leiding of van de directeuren onderzoekt de directeur ADR, respectievelijk de
      certificerend accountant van de ministeries, de beleids- en bedrijfsvoering en rapporteert daarover aan de
      opdrachtgever en aan het Audit Committee.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel45
  - number: '45.3'
    text: De verantwoordelijkheden en bevoegdheden van de directeur ADR zijn vastgelegd in het Besluit taak DAD.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel45
  - number: '46.1'
    text: Er is een Audit Committee.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel46
  - number: '46.2'
    text: |-
      Het Audit Committee is samengesteld uit vier externe leden, de gehele bestuursraad, de Auditdienst Rijk (ADR) en de
      Algemene Rekenkamer. De SG is de voorzitter van de Audit Committee. DFEZ voert het secretariaat.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel46
  - number: '46.3'
    text: De externe leden van het Audit Committee kunnen hun bevindingen separaat aan de minister kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel46
  - number: '47.1'
    text: |-
      Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in dit besluit, wordt genomen door de
      secretaris-generaal, gehoord de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel47
  - number: '47.2'
    text: De directeur CDMO adviseert de secretaris-generaal alvorens een beslissing omtrent instemming wordt genomen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel47
  - number: '48.1'
    text: |-
      Elk onderdeel dat ressorteert onder de in [artikel 10][ref1] genoemde dienstonderdelen ontwerpt en onderhoudt een
      organisatierapport en een formatierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel10
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '10'
        hoofdstuk: '3'
  - number: '48.2'
    text: |-
      Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 5, tweede lid][ref1], is de plaatsvervangend secretaris-generaal bevoegd het document namens de
      bewindspersoon vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel5
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '5'
        hoofdstuk: '2'
  - number: '48.3'
    text: |-
      Voor zover een document als bedoeld in het eerste lid betrekking heeft op de IBTD is de IG bevoegd het document
      vast te stellen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel48
  - number: '48.4'
    text: |-
      Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad, indien er sprake is van financiële meeruitgaven of een uitbreiding van de personele formatie. De
      directeur CDMO adviseert de bestuursraad alvorens een beslissing omtrent instemming wordt genomen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel48
  - number: '48.5'
    text: |-
      Het vierde lid is niet van toepassing indien er sprake is van een uitbreiding van de personele formatie van de
      IBTD, voor zover die uitbreiding past binnen het budget van de IBTD.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel48
  - number: '49'
    text: |-
      Wijzigingen van dit besluit treden in werking per 1 januari, 1 april, 1 juli of 1 oktober, behoudens spoedeisende
      gevallen.
    url: https://wetten.overheid.nl/BWBR0043027/2026-01-01#Artikel49
