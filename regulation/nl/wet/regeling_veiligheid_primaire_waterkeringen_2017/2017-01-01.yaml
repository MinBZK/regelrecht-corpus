        artikel: '2'
      - id: ref2
        bwb_id: BWBR0039040
  - number: '4'
    text: |-
      De [Regeling veiligheid primaire waterkeringen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0022491
    url: https://wetten.overheid.nl/BWBR0039040/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022491
  - number: '5'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Wet van 2 november 2016 tot wijziging van de
      [Waterwet][ref1] en enkele andere wetten (nieuwe normering primaire waterkeringen) in werking treedt. Indien die
      wet in werking treedt na 1 januari 2017, werkt deze regeling terug tot en met die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0039040/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025458
