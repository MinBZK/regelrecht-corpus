    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0039040/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De door de beheerder te verrichten beoordeling van de veiligheid van een primaire waterkering, bedoeld in
      [artikel 2.12, vierde lid, van de Waterwet][ref1], geschiedt volgens de in [bijlage I][ref2] bij deze regeling
      opgenomen Procedure beoordeling veiligheid primaire waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039040
    url: https://wetten.overheid.nl/BWBR0039040/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0039040
  - number: '2'
    text: |-
      Bij het bepalen van de hydraulische belasting op een primaire waterkering, bedoeld in
      [artikel 2.3, eerste lid, van de Waterwet][ref1], gaat de beheerder uit van de in [bijlage II][ref2] bij deze
      regeling opgenomen Voorschriften bepaling hydraulische belastingen primaire waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039040
    url: https://wetten.overheid.nl/BWBR0039040/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0039040
  - number: '3'
    text: |-
      Bij het bepalen van de sterkte van een primaire waterkering, bedoeld in
      [artikel 2.3, eerste lid, van de Waterwet][ref1], gaat de beheerder uit van de in [bijlage III][ref2] bij deze
      regeling opgenomen Voorschriften bepaling sterkte en veiligheid primaire waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039040
    url: https://wetten.overheid.nl/BWBR0039040/2017-01-01#Artikel3
    references:
      - id: ref1
