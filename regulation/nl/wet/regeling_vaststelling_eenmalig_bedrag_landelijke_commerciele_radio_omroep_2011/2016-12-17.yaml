---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vaststelling_eenmalig_bedrag_landelijke_commerciele_radio_omroep_2011
regulatory_layer: WET
publication_date: '2016-12-16'
valid_from: '2016-12-17'
bwb_id: BWBR0029752
url: https://wetten.overheid.nl/BWBR0029752/2016-12-17
preamble:
  text: |-
    Gelet op artikel 3.3a, eerste en tweede lid, van de Telecommunicatiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
  - number: 1.1.a
    text: '*minister:* Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
  - number: 1.1.b
    text: |-
      *kavel:* de frequentie of het samenstel van frequenties voor het gebruik waarvan een vergunning kan worden
      verleend;
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
  - number: 1.1.c
    text: |-
      *vergunning voor kavel A1:* de vergunning voor kavel A1 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.d
    text: |-
      *vergunning voor kavel A2:* de vergunning voor kavel A2 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.e
    text: |-
      *vergunning voor kavel A3:* de vergunning voor kavel A3 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.f
    text: |-
      *vergunning voor kavel A6:* de vergunning voor kavel A6 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.g
    text: |-
      *vergunning voor digitale radio-omroep:* een vergunning voor het gebruik van 1/9 deel van de capaciteit van de
      frequentieruimte binnen het frequentiebereik 219,584 - 221,120 MHz.
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
  - number: '1.2'
    text: |-
      De vergunning voor kavel A2 wordt geacht mede te omvatten de vergunning inzake de steunzender 95,5 MHz te
      Hilversum.
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel1
  - number: '2.1'
    text: |-
      De verkrijger of houder van een vergunning voor landelijke commerciële radio die
      verleend is respectievelijk waarvan de geldigheidsduur is verlengd met toepassing van de
      [Regeling verlenging en digitalisering landelijke commerciële radio-omroep][ref1] is voor het gebruik van de
      desbetreffende frequentieruimte gedurende de periode van 1 september 2011 tot 1 september 2017 een eenmalig bedrag
      verschuldigd, waarvan de hoogte is:


      [ref1]: https://wetten.overheid.nl/BWBR0029751
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029751
  - number: 2.1.a
    text: 'voor de vergunning voor kavel A1 en een vergunning voor digitale radio-omroep: € 25.592.000;'
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel2
  - number: 2.1.b
    text: 'voor de vergunning voor kavel A2 en een vergunning voor digitale radio-omroep: € 12.720.000;'
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel2
  - number: 2.1.c
    text: 'voor de vergunning voor kavel A3 en een vergunning voor digitale radio-omroep: € 26.804.000;'
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel2
  - number: 2.1.d
    text: 'voor de vergunning voor kavel A6 en een vergunning voor digitale radio-omroep: € 26.473.000.'
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel2
  - number: '2.2'
    text: |-
      Indien de verlenging en verlening van vergunningen met toepassing van de
      [Regeling verlenging en digitalisering landelijke commerciële radio-omroep][ref1] plaats vindt na 1 september
      2011, is voor de resterende periode tot 1 september 2017 een eenmalig bedrag verschuldigd waarvan de hoogte wordt
      bepaald door het desbetreffende eenmalig bedrag, genoemd in het eerste lid, te vermenigvuldigen met een breuk
      waarvan de teller wordt gevormd door het aantal hele maanden dat na het tijdstip van vergunningverlening resteert
      tot 1 september 2017 en de noemer door het getal 72.


      [ref1]: https://wetten.overheid.nl/BWBR0029751
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029751
  - number: '3.1'
    text: |-
      De verkrijger of de houder van de vergunningen betaalt het op grond van [artikel 2][ref1] verschuldigde bedrag
      uiterlijk op 1 september 2011 of, indien het tijdstip van vergunningverlening later ligt dan 21 juli 2011,
      uiterlijk zes weken na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0029752#Artikel2
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029752
        artikel: '2'
  - number: '3.2'
    text: |-
      Indien op verzoek van de verkrijger of de houder van de vergunningen in afwijking van het eerste lid uitstel van
      betaling wordt verleend, worden aan de beschikking tot uitstel van betaling de voorschriften verbonden dat het
      verschuldigde bedrag wordt betaald in zes gelijke termijnen die steeds jaarlijks vervallen op 1 september, voor
      het eerst op 1 september 2011, en dat de verkrijger respectievelijk de houder van de vergunningen een waarborgsom
      verstrekt of een bankgarantie volgens het model, opgenomen in de bijlage, overlegt ter hoogte van een zesde deel
      van het verschuldigde bedrag. Indien het tijdstip van vergunningverlening later ligt dan 21 juli 2011, vervalt de
      eerste termijn uiterlijk zes weken na dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
  - number: '3.3'
    text: |-
      Voor de betaling door de verkrijger of de houder van het door hem op grond van [artikel 2][ref1] verschuldigde
      bedrag wordt mede:


      [ref1]: https://wetten.overheid.nl/BWBR0029752#Artikel2
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029752
        artikel: '2'
  - number: 3.3.a
    text: |-
      de waarborgsom aangewend die op grond van
      [artikel 3, eerste lid, van de Regeling verlenging en digitalisering landelijke commerciële radio-omroep][ref1] is
      verstrekt, of


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel3
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '3'
  - number: 3.3.b
    text: |-
      in het geval de verkrijger of de houder niet tijdig of niet
      volledig heeft betaald, de bankgarantie aangewend die op grond van
      [artikel 3, eerste lid, van de Regeling verlenging en digitalisering landelijke commerciële radio-omroep][ref1]
      is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel3
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '3'
  - number: '3.4'
    text: |-
      De betalingen worden verricht door overmaking op het bankrekeningnummer 56.99.94.039, ten name van Ministerie van
      Economische Zaken, Landbouw en Innovatie; Agentschap Telecom, onder vermelding van de desbetreffende kavel in de
      FM-band en van ‘vergunning voor digitale radio-omroep’.
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
  - number: '3.5'
    text: |-
      De minister kan een geldschuld jegens de vergunninghouder die verband houdt met een bij of krachtens
      [hoofdstuk 3 van de Telecommunicatiewet][ref1] genomen besluit, verrekenen met een vordering op grond van
      [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0029752#Artikel2
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0029752
        artikel: '2'
  - number: '3.6'
    text: |-
      Het tweede tot en met vierde lid zijn niet van toepassing op de betaling van het verschuldigde eenmalig
      bedrag voor de vergunning voor kavel A2 en een vergunning voor digitale radio-omroep, bedoeld in
      [artikel 2, eerste lid, aanhef en onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029752#Artikel2
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029752
        artikel: '2'
  - number: '4'
    text: |-
      Indien het aantal vergunningen voor digitale radio-omroep in de periode van 1 september 2011 tot 1 september 2017
      gedurende ten minste vier weken kleiner is dan negen, ontvangt de houder van een vergunning voor digitale radio-
      omroep over het verschuldigde en betaalde bedrag een restitutie, waarbij de hoogte van het bedrag van de restitutie
      wordt bepaald overeenkomstig de volgende formule: [(9 - n) : n ] * € 8.000,– * m waarbij n: het aantal vergunningen
      voor digitale radio-omroep is waarover de vergunninghouders in de desbetreffende periode beschikken; en m: het
      aantal aaneengesloten perioden van vier weken is gedurende welke het aantal vergunningen voor digitale radio-omroep
      n is.
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel4
  - number: '5.1'
    text: |-
      Indien de aanvraag op grond van de [Regeling verlenging en digitalisering landelijke commerciële radio-omroep][ref1]
      wordt afgewezen, wordt de door de aanvrager op grond van [artikel 3, eerste lid, van die regeling][ref2] verstrekte
      waarborgsom of bankgarantie door de minister teruggestort, respectievelijk teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0029751
      [ref2]: https://wetten.overheid.nl/BWBR0029751#Artikel3
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029751
      - id: ref2
        bwb_id: BWBR0029751
        artikel: '3'
  - number: '5.2'
    text: |-
      Bij toepassing van het eerste lid vergoedt de minister de rente over de gestorte waarborgsom vanaf de dag waarop
      hij de waarborgsom heeft ontvangen op het bankrekeningnummer, genoemd in [artikel 3, vierde lid][ref1], met
      dien verstande dat de rente wordt vergoed tot en met de dag voorafgaand aan de dag waarop de waarborgsom door de
      minister wordt teruggestort.


      [ref1]: https://wetten.overheid.nl/BWBR0029752#Artikel3
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029752
        artikel: '3'
  - number: '5.3'
    text: |-
      Bij toepassing van [artikel 3, derde lid, onderdeel a][ref1], vergoedt de minister de rente over de gestorte
      waarborgsom vanaf de dag waarop het besluit tot vaststelling van dit bedrag aan hem bekend is gemaakt tot en met 31
      augustus 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0029752#Artikel3
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029752
        artikel: '3'
  - number: '5.4'
    text: |-
      De rente wordt berekend volgens actual/360 op basis van de door de Europese Centrale Bank vastgestelde Euro
      Overnight Index Average, minus 4 basispunten.
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling vaststelling eenmalig bedrag landelijke commerciële radio-omroep 2011.'
    url: https://wetten.overheid.nl/BWBR0029752/2016-12-17#Artikel7
