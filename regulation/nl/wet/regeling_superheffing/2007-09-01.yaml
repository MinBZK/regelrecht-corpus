preamble:
  text: |-
    – Gelet op artikel 5 van Verordening (EG) nr. 1255/1999 van de Raad van 17 mei 1999 houdende een gemeenschappelijke
    ordening der markten in de sector melk en zuivelproducten (PbEG 1999, L 160);

    – Gelet op Verordening (EG) nr. 1782/2003 van de Raad van 29 september 2003 tot vaststelling van gemeenschappelijke
    voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk
    landbouwbeleid en tot vaststelling van de bepaalde steunregelingen voor landbouwers en houdende wijziging van de
    Verordeningen (EEG) nr. 2019/93, (EG) nr. 1452/2001, (EG) nr. 1453/2001, (EG) 1454/2001, (EG) nr. 1868/94, (EG) nr.
    1251/1999, (EG) nr. 1254/1999, (EG) nr. 1673/2000, (EEG) nr. 2358/71 en (EG) nr. 2529/2001 (PbEU 2003, L 270);

    – Gelet op Verordening (EG) nr. 1788/2003 van de Raad van 29 september 2003 tot vaststelling van een heffing in de
    sector melk en zuivelproducten (PbEU 2003, L 270);

    – Gelet op Verordening (EG) nr. 2237/2003 van de Commissie van 23 december 2003 houdende uitvoeringsbepalingen
    voor bepaalde steunregelingen die zijn ingesteld bij titel IV van Verordening (EG) nr. 1782/2003 van de Raad tot
    vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader
    van het gemeenschappelijk landbouwbeleid en tot vaststelling van de bepaalde steunregelingen voor landbouwers (PbEU
    2003, L 339);

    – Gelet op de Verordening van de Commissie houdende vaststelling van uitvoeringsbepalingen van Verordening (EG) nr.
    1788/2003 van de Raad tot vaststelling van een heffing in de sector melk en zuivelproducten;

    – Voorts gelet op de artikelen 13, 15, 19, 23, 27, en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. productschap: Productschap Zuivel;

      b. raadsverordening: [verordening (EG) nr. 1788/2003](32003R1788) van de Raad van 29 september 2003 tot
      vaststelling van een heffing in de sector melk en zuivelproducten;

      c. commissieverordening: verordening (EG) Nr. 595/2004 van de Commissie van 30 maart 2004 houdende vaststelling van
      uitvoeringsbepalingen van [Verordening (EG) nr. 1788/2003](32003R1788) van de Raad tot vaststelling van een heffing
      in de sector melk en zuivelproducten;

      d. [verordening 1782/2003](32003R1782): [Verordening (EG) nr. 1782/2003](32003R1782) van de Raad van 29 september
      2003 tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening
      in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van de bepaalde steunregelingen voor
      landbouwers;

      e. [verordening 796/2004](32004R0796): [Verordening (EG) nr. 796/2004](32004R0796) van de Commissie van 21 april
      2004 houdende uitvoeringsbepalingen inzake de randvoorwaarden, de modulatie en het geïntegreerd beheers- en
      controlesysteem waarin is voorzien bij [Verordening (EG) nr. 1782/2003](32003R1782) van de Raad tot vaststelling
      van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader van het
      gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers;

      f. [verordening 1973/2004](32004R1973): [Verordening (EG) nr. 1973/2004](32004R1973) van de Commissie van
      29 oktober 2004 houdende uitvoeringsbepalingen van [Verordening (EG) nr. 1782/2003](32003R1782) van de Raad met
      betrekking tot de bij de titels IV en IV bis van die verordening ingestelde steunregelingen en het gebruik van
      braakgelegde grond voor de productie van grondstoffen;

      g. melk, andere zuivelproducten, producent, bedrijf, koper, levering, rechtstreekse verkoop, vermarkting, nationale
      referentiehoeveelheid, individuele referentiehoeveelheid, beschikbare referentiehoeveelheid: hetgeen daaromtrent is
      bepaald in artikel 5 van de raadsverordening;

      h. heffingsperiode: tijdvak van 12 maanden dat begint op 1 april van ieder kalenderjaar en eindigt op 31 maart van
      het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel1
  - number: '2'
    text: |-
      1 De producent die in een heffingsperiode zijn beschikbare referentiehoeveelheid overschrijdt, is de op grond van
      artikel 2 van de raadsverordening geldende heffing verschuldigd.

      2 De grondslag voor de berekening van de heffing als bedoeld in het eerste lid is in geval van leveringen de totale
      hoeveelheid geleverde melk en in geval van rechtstreekse verkoop de totale hoeveelheid gebruikte of overgedragen
      melk. De hoeveelheid melk, of het equivalent daarvan, wordt bepaald met inachtneming van het bepaalde in de
      commissieverordening.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel2
  - number: '3'
    text: |-
      1 Van een natuurlijke of rechtspersoon die over individuele referentiehoeveelheden beschikt en die gedurende een
      heffingsperiode geen melk of andere zuivelproducten vermarkt, worden de referentiehoeveelheden uiterlijk met ingang
      van 1 april van het daaropvolgende kalenderjaar aan de nationale reserve toegevoegd overeenkomstig het bepaalde in
      artikel 15, eerste lid, van de raadsverordening.

      2 Overeenkomstig het bepaalde in artikel 15, tweede lid, van de raadsverordening, wordt van een producent die
      minder dan 70 procent van zijn individuele referentiehoeveelheid op de markt brengt, met ingang van 1 april van het
      daaropvolgende kalenderjaar de ongebruikte referentiehoeveelheid geheel aan de nationale reserve toegevoegd.

      3 Onder ongebruikte referentiehoeveelheid, bedoeld in het tweede lid, wordt verstaan het verschil tussen de
      individuele referentiehoeveelheid van de producent en hetgeen hij op de markt heeft gebracht in de desbetreffende
      heffingsperiode. Met een eventuele verkleining van de referentiehoeveelheid in de betrokken heffingsperiode als
      gevolg van definitieve overdracht aan een andere producent, wordt bij de toepassing van het bepaalde in het tweede
      lid rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel3
  - number: '4'
    text: |-
      1 De op grond van [artikel 3, eerste lid][ref1], aan de reserve toegevoegde referentiehoeveelheden kunnen opnieuw
      door het productschap aan de natuurlijke of rechtspersoon worden toegewezen overeenkomstig het bepaalde in artikel
      15, eerste lid, tweede volzin, van de raadsverordening.

      2 De op grond van [artikel 3, tweede lid][ref2], aan de nationale reserve toegevoegde referentiehoeveelheid
      kan opnieuw door het productschap aan de producent worden toegewezen op voorwaarde dat hij uiterlijk voor het
      einde van de tweede heffingsperiode nadat de referentiehoeveelheden aan de nationale reserve zijn toegevoegd,
      de vermarkting hervat van ten minste 70 procent van zijn individuele referentiehoeveelheid, bedoeld in
      [artikel 3, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016539#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0016539#Artikel3
