  - number: 4a
    text: |-
      De referentiehoeveelheid die de producent beschikbaar heeft op 1 april 2007, wordt met ingang van die datum
      verhoogd met 0,5%.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel4a
  - number: '5'
    text: |-
      1 Overeenkomstig het bepaalde in artikel 16, eerste lid, van de raadsverordening kan een producent in de betrokken
      heffingsperiode een deel van zijn individuele referentiehoeveelheid die hij niet voornemens is zelf te gebruiken,
      tijdelijk overdragen aan een andere producent.

      2 Voor de tijdelijke overdracht als bedoeld in het eerste lid gelden de volgende voorwaarden:

      a. een producent draagt minimaal 10.000 kg tijdelijk over;

      b. een producent kan niet in een heffingsperiode zowel referentiehoeveelheden tijdelijk overdragen als overgedragen
      krijgen.

      3 De tijdelijke overdracht van een referentiehoeveelheid wordt gemeld aan het productschap voor een door het
      productschap te bepalen datum en volgens door het productschap te stellen regels.

      4 Een aanspraakop een referentiehoeveelheid ontstaat eerst na de registratie door het productschap.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel5
  - number: '6'
    text: |-
      1 De overdracht van een individuele referentiehoeveelheid, niet zijnde een geheel bedrijf, geschiedt in samenhang
      met de overdracht van de voor de melkproductie gebruikte grond als bedoeld in artikel 17, eerste lid, van de
      raadsverordening, als overeengekomen door betrokken partijen en met inachtneming van de hierna volgende bepalingen.

      2 De over te dragen referentiehoeveelheid bedraagt niet meer dan 20.000 kg per hectare grond.

      3 De over te dragen referentiehoeveelheid omvat minimaal 20.000 kg. Dit minimum behoeft niet in acht te worden
      genomen indien de totale referentiehoeveelheid van de overdrager minder dan 20.000 kg bedraagt en deze hoeveelheid
      in zijn geheel wordt overgedragen. Voorts behoeft dit minimum niet in acht te worden genomen bij het eindigen,
      beëindigen en ontbinden van een pachtovereenkomst, die is goedgekeurd door de grondkamer vóór 1 april 1993.

      4 De ingevolge het eerste lid met een referentiehoeveelheid over te dragen grond was gedurende een periode van één
      jaar voorafgaande aan de overdracht daadwerkelijk voor de melkproductie op het betrokken bedrijf in gebruik. Voorts
      dient de met een referentiehoeveelheid over te dragen grond gedurende een periode van één jaar na de overdracht
      daadwerkelijk voor de melkproductie op het betrokken bedrijf in gebruik te blijven. In geval van beëindiging van
      een pachtovereenkomst als bedoeld in [artikel 13, tweede lid, onder a, c en d][ref1], dient de terug over te dragen
      grond gedurende een periode van één jaar voorafgaande aan de beëindiging van een pachtovereenkomst daadwerkelijk
      voor de melkproductie op het betrokken bedrijf in gebruik te zijn geweest.

      5 Het vorige lid is niet van toepassing ingeval van overdracht krachtens erfrecht of huwelijksvermogensrecht.

      6 Een producent kan, nadat met betrekking tot enige heffingsperiode een overdracht van een referentiehoeveelheid op
      zijn naam is geregistreerd, niet met betrekking tot dezelfde heffingsperiode als vervreemder een overdracht laten
      registreren.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel13
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel6
    references:
