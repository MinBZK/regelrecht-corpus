        artikel: '36'
  - number: '16'
    text: |-
      1 Overeenkomstig het bepaalde in artikel 11 van de raadsverordening is de koper verantwoordelijk voor de inning van
      de heffingen en de afdracht ervan aan het productschap.

      2 Indien tijdens een heffingsperiode blijkt dat een producent zijn beschikbare referentiehoeveelheid overschrijdt,
      kan de koper op grond van het bepaalde in artikel 11, derde lid, van de raadsverordening per 100 kilogram melk ten
      hoogste het bedrag als bedoeld in artikel 2 van de raadsverordening inhouden op de te betalen melkprijs.

      3 De producent die aan een andere koper gaat leveren of die aan meer dan een koper levert, doet daarvan opgaaf
      aan het productschap voor een door het productschap vast te stellen datum en volgens door het productschap vast te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel16
  - number: '17'
    text: |-
      1 Een koper is verplicht een administratie te voeren in overeenstemming met het bepaalde in artikel 23, tweede lid,
      en artikel 24, tweede, derde en vierde lid, van de commissieverordening.

      2 Een producent voert een administratie in overeenstemming met het bepaalde in artikel 24, vijfde respectievelijk
      zesde lid, van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel17
  - number: '18'
    text: |-
      1 Het is een producent verboden melk te leveren aan een niet-erkende koper.

      2 Het is een producent verboden melk of andere zuivelproducten van zijn bedrijf te vermarkten anders dan op eigen
      naam.

      3 Het is een koper verboden melk geleverd te krijgen, tenzij hij door het productschap is erkend als koper.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel18
  - number: '19'
    text: |-
      1 Overeenkomstig het bepaalde in artikel 23, eerste lid, van de commissieverordening, erkent het productschap op
      verzoek een koper die actief is op Nederlands grondgebied, die voldoet aan het bepaalde in de artikel 23, tweede
      lid, van de commissieverordening en

      a. die is ingeschreven in het handelsregister in de zin van [artikel 2 van de Handelsregisterwet 1996][ref1];

      b. die zich ertoe verbindt het vervoer van melk door middel van daartoe gebruikelijke transportmiddelen te laten
      verrichten, die de mogelijkheid bieden om de hoeveelheid, de herkomst en de bestemming van de getransporteerde melk
      vast te stellen alsmede het vetgehalte ervan te laten vaststellen.

      2 Indien een verzoek tot erkenning als koper wordt ingediend na een door het productschap vast te stellen datum,
      kan erkenning eerst plaatsvinden met ingang van de volgende heffingsperiode.

      3 Het productschap trekt de erkenning van de koper in, indien:

      a. de koper niet meer voldoet aan de eisen, gesteld in het eerste lid;

      b. de koper in gebreke blijft met de inning van door producenten verschuldigde heffingen als bedoeld in artikel 11
      van de raadsverordening;

      c. de koper niet zijn administratie overeenkomstig het bepaalde in artikel 24, tweede, derde of vierde lid, van de
      commissieverordening voortdurend bijwerkt;

      d. de koper niet op 1 juli zijn aangifte heeft ingediend. Artikel 8, vierde lid, van de commissieverordening is
      van toepassing;

      e. de in artikel 23, derde lid, van de commissieverordening bedoelde gevallen zich voordoen, behoudens in geval
      artikel 23, vierde lid, van de commissieverordening van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
  - number: '20'
    text: |-
      Het productschap herverdeelt overeenkomstig het bepaalde in artikel 10, derde lid, onderdeel b, respectievelijk
      artikel 12, eerste lid, van de raadsverordening het ongebruikte deel van de nationale referentiehoeveelheid
      voor leveringen onderscheidenlijk rechtstreekse verkoop over de betrokken producenten die op grond van
      [artikel 2, eerste lid][ref1], een heffing verschuldigd zijn, naar evenredigheid van de individuele
      referentiehoeveelheid van elke producent.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel2
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016539
        artikel: '2'
        paragraaf: '2'
  - number: '21'
    text: |-
      1 De producent respectievelijk de koper draagt de door hem verschuldigde onderscheidenlijk geïnde heffingen
      vóór 1 oktober af aan het productschap overeenkomstig het bepaalde in artikel 15, eerste lid, van de
      commissieverordening.

      2 Bij afdracht na 1 oktober is de producent respectievelijk de koper de rente als bedoeld in artikel 15, tweede
      lid, van de commissieverordening verschuldigd aan het productschap.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel21
  - number: '22'
    text: |-
      Voor de uitvoering van deze regeling en met name voor de vaststelling en oplegging van de heffingen, bedoeld in
      [artikel 2][ref1], wordt geen rekening gehouden met rechtshandelingen waarvan op grond van bepaalde feiten en
      omstandigheden kan worden aangenomen dat zij geen wezenlijke verandering van feitelijke verhoudingen ten doel
      hebben gehad, of dat die rechtshandelingen achterwege zouden zijn gebleven indien daarmede niet de vaststelling of
      oplegging van de heffing voor het vervolg geheel of ten dele onmogelijk zou worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel2
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016539
        artikel: '2'
        paragraaf: '2'
  - number: '23'
    text: |-
      1 Het productschap stelt overeenkomstig het bepaalde in artikel 12, eerste lid, van de commissieverordening de
      melkequivalenties vast voor andere zuivelproducten dan room en boter.

      2 Het productschap stelt ambtshalve door de producent gebruikte hoeveelheid melk vast op basis van het aantal
      door de producent gehouden koeien en de gemiddelde melkgift van de kudde, in het in artikel 12, tweede lid, van de
      commissieverordening bedoelde geval.

      3 Het productschap beslist op verzoeken tot omzetting van referentiehoeveelheid als bedoeld in artikel 3 van de
      commissieverordening. Een verzoek wordt ingediend bij het productschap volgens door het productschap te stellen
      regels en voor een door het productschap te bepalen datum.

      4 Het productschap administreert de beschikbare referentiehoeveelheden van iedere producent, alsmede iedere
      wijziging of omzetting daarvan, inclusief het vetgehalte als bedoeld in artikel 9 van de raadsverordening
      en informeert iedere producent omtrent de status van zijn individuele respectievelijk beschikbare
      referentiehoeveelheden overeenkomstig het bepaalde in artikel 5 van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel23
  - number: '26'
    text: |-
      1 Het productschap is de bevoegde autoriteit, bedoeld in de raads- en commissie-verordening en is belast met de
      vaststelling, berekening en invordering van verschuldigde heffingen.

      2 Het productschap regelt overigens, met inachtneming van raads- en commissieverordening en, zo nodig de
      aanwijzingen van de minister, al hetgeen voor een goede uitvoering van deze regeling is vereist.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel26
  - number: '27'
    text: |-
      De [Regeling superheffing 1993][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005933
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005933
  - number: '29'
    text: Deze regeling treedt in werking met ingang van 1 april 2004.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel29
  - number: '30'
    text: |-
      Deze regeling wordt aangehaald als ‘Regeling superheffing’ en wordt met de toelichting in de Staatscourant
      gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel30
