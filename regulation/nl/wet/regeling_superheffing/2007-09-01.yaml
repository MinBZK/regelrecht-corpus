  - number: '11'
    text: |-
      1 Een aanspraak op een referentiehoeveelheid wordt niet erkend indien deze in samenhang met de overdracht van
      grond, niet zijnde een geheel bedrijf, of een geheel bedrijf wordt verworven door een ander publiekrechtelijk
      lichaam dan het Bureau Beheer Landbouwgronden, of door een particuliere natuurbeschermingsorganisatie, tenzij het
      productschap anders beslist voor een daarbij vastgestelde hoeveelheid.

      2 In geval van verwerving door een ander publiekrechtelijk lichaam dan het Bureau Beheer Landbouwgronden van grond,
      niet zijnde een geheel bedrijf, of een geheel bedrijf, wordt een aanspraak op een referentiehoeveelheid erkend
      indien zeker is gesteld dat de overgedragen grond of het overgedragen bedrijf voor landbouwkundige doeleinden in
      gebruik blijft en indien de grond of het bedrijf samen met de referentiehoeveelheid door het publiekrechtelijke
      lichaam binnen een termijn van ten hoogste 6 maanden na de overdracht wordt overgedragen aan één of meer
      producenten.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel11
  - number: '12'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 6][ref1], [6a][ref2] en [7][ref3] kan ingeval van verplaatsing
      van een geheel bedrijf, de op het oude bedrijf beschikbare referentiehoeveelheid worden meegenomen naar het nieuwe
      bedrijf.

      2 Het ingevolge het eerste lid te verplaatsen bedrijf dient gedurende een periode van één jaar voorafgaand aan
      de verplaatsing daadwerkelijk in gebruik te zijn geweest voor de melkproductie. Voorts dient het nieuwe bedrijf
      gedurende een periode van één jaar na de verplaatsing daadwerkelijk voor de melkproductie in gebruik te blijven.

      3 [Artikel 9, eerste, tweede en derde lid][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel6
