  - number: '13'
    text: |-
      1 Onder overdracht wordt verstaan:

      a. overdracht in eigendom;

      b. een door de grondkamer goedgekeurde pachtovereenkomst als bedoeld in
      [artikel 311 van Boek 7 van het Burgerlijk Wetboek][ref1] betreffende los land hetwelk groter is dan één hectare of
      een hoeve geldend voor de duur van meer dan één jaar;

      c. een schriftelijke pachtovereenkomst als bedoeld in [artikel 311 van Boek 7 van het Burgerlijk Wetboek][ref2]
      betreffende los land hetwelk niet groter is dan één hectare, geldend voor de duur van meer dan één jaar;

      d. een door de grondkamer geregistreerde pachtovereenkomst als bedoeld in
      [artikel 396, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref3], geldend voor de duur van meer dan één jaar
      doch voor ten hoogste twee jaar;

      e. overdracht ingevolge vestiging, overdracht of tenietgaan van het recht van erfpacht of het recht van
      vruchtgebruik.

      2 Aan het hieronder bepaalde is het zelfde gevolg verbonden als aan de pachtovereenkomst bedoeld in het eerste lid,
      de onderdelen b, c en d;

      a. een door de grondkamer goedgekeurde beëindigingsovereenkomst van een pachtovereenkomst;

      b. een schriftelijke beëindigingsovereenkomst van een pachtovereenkomst als bedoeld in het eerste lid, onderdelen c
      en d;

      c. het eindigen van een pachtovereenkomst als bedoeld in het eerste lid onderdelen
      c en d, alsmede van een door de Grondkamers goedgekeurde pachtovereenkomst als
      bedoeld in [artikel 325, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref4],
      geldend voor de duur van meer dan één jaar, zonder dat een verzoek als bedoeld in
      [artikel 325, zesde lid, van Boek 7 van het Burgerlijk Wetboek][ref5] is ingediend, of van een pachtovereenkomst
      als bedoeld in [artikel 397, eerste en tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref6];

      d. een door de rechter uitgesproken ontbinding van een pachtovereenkomst;

      e. een toewijzing door de rechter van een vordering tot beëindiging van een pachtovereenkomst;

      f. het eindigen van een pachtovereenkomst als gevolg van een opzegging als bedoeld in
      [artikel 367, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref7], waarna niet overeenkomstig
      [artikel 369, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref8] verzet is aangetekend.

      3 Voor het tijdstip van overdracht van de referentiehoeveelheid is bepalend:

      a. de inschrijving van de desbetreffende akte in de in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref9]
      bedoelde openbare registers met dien verstande dat in het geval van het tenietgaan van het recht van erfpacht of
      van het recht van vruchtgebruik het tijdstip van het tenietgaan in aanmerking wordt genomen;

      b. de ingangsdatum van de pachtovereenkomst dan wel de datum waarop de betrokken partijen de pachtovereenkomst
      schriftelijk zijn aangegaan, voor zover deze na de ingangsdatum ligt;

      c. in geval van een overdracht op basis van [artikel 6a, eerste lid][ref10]: de datum waarop de betrokken partijen
      het formulier, bedoeld in [artikel 9, eerste lid][ref11], hebben ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel311
