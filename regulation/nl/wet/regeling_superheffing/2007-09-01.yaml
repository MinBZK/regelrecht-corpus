        artikel: '13'
        paragraaf: '4'
  - number: 6a
    text: |-
      1 In afwijking van het bepaalde in [artikel 6, eerste lid][ref1], kan een overdracht van een individuele
      referentiehoeveelheid, niet zijnde een geheel bedrijf, plaatsvinden zonder overdracht van de voor de melkproductie
      gebruikte grond, als partijen dit overeenkomen en de verkrijger daarbij verklaart dat door deze overdracht van
      referentiehoeveelheid ingevolge artikel 18, eerste lid, onder f, van de raadsverordening, de structuur van de
      melkproductie op het niveau van het bedrijf verbetert of dat deze overdracht bijdraagt tot extensivering van de
      productie.

      2 Een producent kan met toepassing van het eerste lid in een heffingsperiode ten hoogste 10% van zijn individuele
      referentiehoeveelheid, waarover hij bij de aanvang van die heffingsperiode beschikt, overgedragen krijgen, dan wel
      zoveel meer dat de referentiehoeveelheid na overdracht ten hoogste 20.000 kg per hectare voor de melkproductie op
      het betrokken bedrijf gebruikte grond bedraagt.

      3 [Artikel 6, derde lid][ref2], is van overeenkomstige toepassing.

      4 Een producent die met toepassing van het eerste lid in enige heffingsperiode een referentiehoeveelheid heeft
      overgedragen gekregen kan eerst met ingang van de derde daarop volgende heffingsperiode een referentiehoeveelheid
      overdragen op basis van het eerste lid of van [artikel 6, eerste lid][ref3].

      5 Het productschap kan van het bepaalde in het vierde lid ontheffing verlenen indien naar het oordeel van het
      productschap sprake is van naar behoren gemotiveerde bijzondere omstandigheden. Indien een aanvraag om een
      ontheffing wordt ingediend na een door het productschap te bepalen datum, wordt de eventuele aanspraak op een
      overgedragen referentiehoeveelheid eerst erkend met ingang van de daaropvolgende heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016539#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016539#Artikel6
