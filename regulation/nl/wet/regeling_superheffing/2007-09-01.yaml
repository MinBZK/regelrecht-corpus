  - number: '10'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 6][ref1], [6a][ref2] en [7][ref3] gaat door overdracht van een
      bedrijf of grond krachtens erfrecht dan wel huwelijksvermogensrecht een referentiehoeveelheid op de rechthebbende
      over, met inachtneming van de hierna volgende bepalingen.

      2 Het productschap wijzigt op verzoek van de rechthebbende of de rechthebbenden aan wie een bedrijf toekomt de
      registratie van de betrokken referentiehoeveelheid.

      3 Het productschap wijzigt op verzoek van de rechthebbende of de rechthebbenden aan wie gronden toekomen die
      ten tijde van de overdracht deel uitmaakten van een bedrijf waaraan een referentiehoeveelheid was gerelateerd,
      de registratie van de betrokken hoeveelheid als overeengekomen door de rechthebbenden, op basis van de voor de
      melkproductie gebruikte oppervlakte.

      4 Het productschap kan op verzoek de voorgaande leden overeenkomstig toepassen indien sprake is van een
      andere wijze van overdracht onder algemene titel dan is aangegeven in het eerste lid, dan wel indien sprake
      is van een overdracht onder bijzondere titel, anders dan in [artikel 6, eerste lid][ref4], dan wel indien
      sprake is van in-de-plaatsstelling of medepacht als bedoeld in de [artikelen 363][ref5], [364][ref6] en
      [366 van Boek 7 van het Burgerlijk Wetboek][ref7].

      5 Een verzoek wordt gedaan door kennisgeving door de betrokken rechthebbende of de gezamenlijke rechthebbenden aan
      het productschap. [Artikel 9, eerste, tweede en zesde lid][ref8], is van overeenkomstige toepassing.


