  - number: '7'
    text: |-
      1 Bij de overdracht van een individuele referentiehoeveelheid als bedoeld in artikel 17, eerste lid, van de
      raadsverordening in het kader van de overdracht van een bedrijf gaat de individuele referentiehoeveelheid in zijn
      geheel over, met inachtneming van de hierna volgende bepalingen.

      2 Een overdracht van een referentiehoeveelheid vindt plaats tot ten hoogste 20.000 kg per hectare overgedragen
      grond, tenzij:

      a. het gehele bedrijf wordt verworven door degene die een echtgenoot, kind, afstammeling in de tweede graad,
      echtgenoot van een kind, echtgenoot van een kleinkind, of een pleegkind is van de vervreemder;

      b. het gehele bedrijf wordt verworven door een ander dan genoemd in onderdeel a, als ten genoegen van het
      productschap is aangetoond dat het bedrijf in de twee jaren voorafgaande aan de overdracht niet substantieel is
      verkleind, althans voor zover het de melkveehouderij betreft en als het bedrijf beoordeeld naar de feitelijke
      bedrijfsvoering als een zelfstandige eenheid ongewijzigd wordt voortgezet. Ter zake van de toepassing van dit
      onderdeel kunnen nadere regelen worden gesteld door het productschap.

      3 Onder pleegkind wordt verstaan degene die duurzaam als een eigen kind is verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel7
  - number: '8'
    text: |-
      1 Indien naar het oordeel van het productschap een overdracht van grond dan wel het aangaan of beëindigen van een
      pachtovereenkomst kennelijk uitsluitend tot doel heeft gehad het maximum gesteld in [artikel 6, tweede lid][ref1],
      te ontgaan, kan het productschap binnen een tijdvak van 3 jaren na overdracht van de referentiehoeveelheid,
      besluiten dat een aanspraak op deze hoeveelheid ter zake van die overdracht geheel of gedeeltelijk niet meer wordt
      erkend, te rekenen vanaf het tijdstip van registratie, met dien verstande dat de niet-erkenning maximaal 12 maanden
      terugwerkt.

      2 Indien een aanspraak ingevolge het eerste lid geheel of gedeeltelijk niet meer wordt erkend:

      a. kan erkenning van de aanspraak op de referentiehoeveelheid bij de vervreemder plaatsvinden indien de verkrijger
      en de vervreemder overeenkomen dat de overdracht van de referentiehoeveelheid ongedaan wordt gemaakt met ingang van
      de datum waarop partijen van deze overeenkomst op een daartoe voorgeschreven formulier bij het productschap hebben
      kennisgegeven;

      b. kan erkenning van de aanspraak op de referentiehoeveelheid bij de verkrijger plaatsvinden, indien alsnog
      daadwerkelijk voor de melkproductie gebruikte grond aan hem wordt overgedragen overeenkomstig het bepaalde
      in [artikel 6][ref2] met ingang van de datum waarop de betrokken registratie overeenkomstig de procedure van
      [artikel 9][ref3] heeft plaatsgevonden.

      3 De erkenning als bedoeld in het tweede lid wordt gerelateerd aan de nog niet verstreken periode van de betrokken
      heffingsperiode.

      4 De verkrijger kan op diens verzoek voor het niet erkende deel van de referentiehoeveelheid aanspraak maken op
      een vergoeding van € 0,29 per kilogram referentiehoeveelheid. Voor zover deze vergoeding toegekend wordt, is het
      in het tweede lid bepaalde niet van toepassing. Een in de eerste volzin bedoeld verzoek wordt bij het productschap
      ingediend. De minister beslist op het verzoek.

      5 Indien bij toepassing van [artikel 7, tweede lid, onderdeel b][ref4], naar het oordeel van het productschap in
      het tijdvak van drie jaren volgend op de overdracht van de referentiehoeveelheid, het bedrijf niet of niet meer
      als een zelfstandige eenheid ongewijzigd wordt voortgezet, kan het productschap besluiten dat een aanspraak op deze
      hoeveelheid, die het maximum van 20.000 kg per overgedragen hectare te boven gaat, geheel of gedeeltelijk niet meer
      wordt erkend, te rekenen vanaf het tijdstip van registratie, met dien verstande dat de niet-erkenning maximaal 12
      maanden terugwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016539#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016539#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0016539#Artikel7
