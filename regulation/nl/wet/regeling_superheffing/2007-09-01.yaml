  - number: '9'
    text: |-
      1 Degenen die een referentiehoeveelheid op basis van [artikel 6][ref1], [6a][ref2], of [7, eerste lid][ref3],
      hebben overgedragen respectievelijk overgedragen gekregen, stellen gezamenlijk binnen zes weken nadien het
      productschap in kennis. Daarbij worden het door het productschap voorgeschreven formulier en de voorgeschreven
      documenten met betrekking tot de overdracht van de referentiehoeveelheid, en in het geval dat overdracht
      plaatsvindt op basis van [artikel 6][ref4] of [artikel 7, eerste lid][ref5], met betrekking tot de overdracht van
      de bijbehorende grond gevoegd.

      2 Er kan eerst een aanspraak op referentiehoeveelheid worden gemaakt na de registratie door het productschap.

      3 Indien de overdracht bedoeld in het eerste lid niet overeenkomstig de eisen van het eerste lid wordt aangemeld
      of na een door het productschap te bepalen datum wordt aangemeld, wordt de aanspraak op de overgedragen
      referentiehoeveelheid eerst erkend met ingang van de volgende heffingsperiode.

      4 Onverminderd het bepaalde in [artikel 7, tweede lid, onder a en b][ref6], wordt, indien het productschap
      de overdracht van een referentiehoeveelheid ter registratie krijgt aangeboden waarbij meer dan 20.000 kg per
      hectare wordt overgedragen, ten name van de verwerver de overdracht geregistreerd van 20.000 kg per hectare
      overgedragen grond. Het meerdere wordt aan de nationale reserve toegevoegd. Voor de niet ten name van de verwerver
      geregistreerde hoeveelheid wordt een vergoeding toegekend overeenkomstig de bepalingen van de daarvoor geldende
      regeling van de Stichting Ontwikkelings- en Saneringsfonds voor de Landbouw.

      5 De vergoeding, bedoeld in het vierde lid wordt toegekend aan de vervreemder van de grond, tenzij de betrokken
      partijen anders overeenkomen. In geval van ontbinding, eindigen dan wel beëindiging van een pachtovereenkomst wordt
      de vergoeding toegekend aan de verpachter en pachter gezamenlijk ieder voor de helft, tenzij de betrokken partijen
      anders overeenkomen.

      6 Indien in een heffingsperiode de tijdelijke overdracht van een referentiehoeveelheid overeenkomstig het bepaalde
      in [artikel 5][ref7] door het productschap wordt geregistreerd en nadien in dezelfde periode ten aanzien van de
      betrokken hoeveelheid een kennisgeving bedoeld in de eerste volzin van het eerste lid bij het productschap wordt
      aangemeld, wordt de aanspraak op de betrokken hoeveelheid eerst erkend met ingang van de volgende heffingsperiode.


