  - number: '14'
    text: |-
      1 De producent die melk of andere zuivelproducten rechtstreeks heeft verkocht of overgedragen doet bij
      het productschap tijdig aangifte overeenkomstig het bepaalde in artikel 11, eerste en tweede lid, van de
      commissieverordening.

      2 De producent met een beschikbare referentiehoeveelheid voor rechtstreekse verkoop doet tevens in geval hij geen
      melk of andere zuivelproducten heeft verkocht of overgedragen, aangifte, als bedoeld in het eerste lid, bij het
      productschap.

      3 Indien de producent de in het eerste of tweede lid bedoelde aangifte niet voor 15 mei heeft gedaan of een
      onjuiste aangifte heeft ingediend, legt het productschap aan de producent de sanctie als bedoeld in artikel 11,
      derde lid, van de commissieverordening, op, behoudens in geval artikel 11, vijfde lid, van de commissieverordening
      van toepassing is.

      4 Indien op 1 juli geen aangifte is ontvangen door het productschap, voegt het productschap, overeenkomstig
      het bepaalde in artikel 11, vierde lid, van de commissieverordening de referentiehoeveelheid voor rechtstreekse
      verkoop van de producent aan de nationale reserve toe, behoudens in geval artikel 11, vijfde lid, van de
      commissieverordening van toepassing is.
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel14
  - number: '15'
    text: |-
      1 De koper doet bij het productschap tijdig aangifte overeenkomstig het bepaalde in artikel 8, eerste en tweede
      lid, van de commissieverordening.

      2 Bij zijn aangifte voegt de koper een verklaring omtrent de juistheid van de in de aangifte
      vermelde gegevens van een registeraccountant, ingeschreven in het register genoemd in
      [artikel 55 van de Wet op de Registeraccountants][ref1], hetzij een accountant-administratieconsulent, ingeschreven
      in het register genoemd in [artikel 36 van de Wet op de Accountants-Administratieconsulenten][ref2].

      3 Indien geen aangifte is ontvangen op 15 mei respectievelijk op 1 juli, is de koper het bedrag, berekend
      overeenkomstig artikel 8, derde lid, van de commissieverordening verschuldigd, onderscheidenlijk wordt de erkenning
      van de koper ingetrokken door het productschap overeenkomstig het bepaalde in artikel 8, vierde lid, van de
      commissieverordening, behoudens in geval artikel 8, vijfde lid, van de commissieverordening van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0016539/2007-09-01#Artikel15
