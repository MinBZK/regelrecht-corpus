$id: subsidieregeling_volksgezondheid
regulatory_layer: WET
publication_date: '2006-06-19'
valid_from: '2005-04-08'
bwb_id: BWBR0009812
url: https://wetten.overheid.nl/BWBR0009812/2005-04-08
preamble:
  text: |-
    Gelet op de artikelen 2, derde lid, 5, 11, tweede lid, 20, 26 en 43 van het Besluit volksgezondheidssubsidies en de
    artikelen 5, 13, 14, tweede lid, 32, 36, tweede lid, en 56 van het Bekostigingsbesluit welzijnsbeleid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder 'ondersteuningssubsidie' van ten hoogste € 11 345: een instellingssubsidie in
      een gering deel van de totale kosten van het algemeen functioneren van een instelling.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel1
  - number: '2'
    text: |-
      Deze regeling is van toepassing op subsidies waarop het [Besluit volksgezondheidssubsidies][ref1] van toepassing
      is. Deze regeling is eveneens van toepassing op subsidies waarop het Bekostigingsbesluit welzijnssubsidies van
      toepassing is voorzover de activiteiten waarvoor deze worden verstrekt, samenhangen met activiteiten waarvoor de
      eerstbedoelde subsidies worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009696
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009696
  - number: '3'
    text: |-
      1 De minister kan subsidieplafonds vaststellen voor het verstrekken van instellings- en projectsubsidies.

      2 Ten aanzien van instellingssubsidies geeft de minister bij de verdeling van het beschikbare bedrag die aanvragen
      voorrang waarvan de inwilliging in vergelijking met andere aanvragen naar verwachting van meer belang is voor het
      beleid en meer zal bijdragen aan de verwezenlijking van het doel van de subsidie.

      3 Ten aanzien van projectsubsidies wordt het beschikbare bedrag verdeeld in volgorde
      van ontvangst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag is aangevuld, met betrekking tot de verdeling als de datum van ontvangst geldt. Indien met het
      oog op de onderlinge afweging van aanvragen is bepaald dat op aanvragen wordt beslist na een of meer bepaalde data
      in een kalenderjaar, geeft de minister bij de verdeling van het beschikbare bedrag die aanvragen voorrang waarvan
      de inwilliging in vergelijking met andere aanvragen naar verwachting van meer belang is voor het beleid en meer zal
      bijdragen aan de verwezenlijking van het doel van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '4'
    text: Een besluit tot vaststelling van een subsidieplafond wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel4
  - number: '5'
    text: |-
      Een instellingssubsidie bestaat uit een bedrag voor overeenkomstig een door de minister goedgekeurd
      activiteitenplan uitgevoerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel5
  - number: '6'
    text: |-
      1 Het bedrag, bedoeld in [artikel 5][ref1], wordt verlaagd met het bedrag waarmee het maximaal toegestane bedrag
      van de in [artikel 9][ref2] bedoelde reservering wordt overschreden.

      2 Het eerste lid is niet van toepassing op een ondersteuningssubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0009812#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009812#Artikel9
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009812
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009812
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '7'
    text: |-
      1 De minister verstrekt de volgende voorschotten op een verleende instellingssubsidie: in januari 8%, februari 8%,
      maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%, september 7%, oktober 8%, november 8% en december 7%
      van het voor het desbetreffende jaar verleende subsidiebedrag.

      2 Indien de minister voorschotten verstrekt voordat hij de beschikking tot subsidieverlening heeft gegeven, worden
      de percentages, bedoeld in het eerste lid, tot de datum van subsidieverlening, toegepast op het voor het voorgaande
      jaar verleende bedrag, in voorkomende gevallen bijgesteld overeenkomstig door de minister gegeven beschikkingen.
      Zodra de beschikking tot subsidieverlening voor het lopende jaar is gegeven, wordt het bedrag dat, gezien het in
      die beschikking verleende bedrag, te veel of te weinig is bevoorschot, zo spoedig mogelijk verrekend of door de
      subsidie-aanvrager terugbetaald, onderscheidenlijk door de minister betaald.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel7
  - number: '8'
    text: |-
      In het activiteitenplan, behorende bij een aanvraag van een instellingssubsidie, komen tenminste de in bijlage 1
      bij deze regeling genoemde onderwerpen aan de orde.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel8
  - number: '9'
    text: |-
      1 Voorzover het bedrag van de verleende instellingssubsidie, zonder toepassing van de in [artikel 6][ref1] bedoelde
      vermindering, na uitvoering van de gesubsidieerde activiteiten overeenkomstig de geldende verplichtingen, niet is
      besteed aan de doeleinden waarvoor het is verstrekt, wordt het gereserveerd.

      2 Voor de berekening van het in het eerste lid bedoelde te reserveren bedrag wordt het totaal van de met de
      gesubsidieerde activiteiten samenhangende baten, bestaande uit de verleende instellingssubsidie en de gerealiseerde
      overige baten, verminderd met de lasten van de gesubsidieerde activiteiten. Deze uitkomst wordt toegerekend naar
      rato van de verleende instellingssubsidie en de, in de ingediende begroting opgenomen, met de gesubsidieerde
      activiteiten samenhangende, overige baten. Het te reserveren bedrag is het aan de instellingssubsidie toegerekende
      deel.

      3 Toevoegingen aan voorzieningen als bedoeld in artikel 374, eerste lid, van Boek 2 van het Burgerlijk Wetboek, die
      samenhangen met de gesubsidieerde activiteiten, worden gerekend tot de lasten van de gesubsidieerde activiteiten,
      bedoeld in het tweede lid, tenzij de minister anders bepaalt.

      4 Indien in de ingediende begroting onder de met de gesubsidieerde activiteiten samenhangende baten een
      vrijgevallen voorziening is opgenomen, blijft deze buiten beschouwing bij de berekening van het te reserveren
      bedrag, bedoeld in het tweede lid.

      5 De verplichting, bedoeld in het eerste lid, geldt niet voor de ontvanger van een ondersteuningssubsidie.

      6 De in het eerste lid bedoelde reservering kan uitsluitend worden besteed aan doeleinden waarvoor de subsidie
      werd verstrekt.

      7 Het totaal van de in het eerste lid bedoelde reservering bedraagt ten hoogste 10% van het bedrag van de verleende
      subsidie, zonder toepassing van de in [artikel 6][ref2] bedoelde vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0009812#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009812#Artikel6
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009812
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009812
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 9a
    text: |-
      Op de balans worden de voorzieningen, gesplitst naar hun aard, en de reservering opgenomen. In de toelichting op de
      balans worden de toevoegingen en de onttrekkingen aan de voorzieningen en reservering toegelicht.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel9a
  - number: '10'
    text: |-
      Baten en lasten die door middel van interne doorberekeningen worden toegerekend, worden bepaald op
      bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voorzover hierin lasten zijn begrepen van
      materiële vaste activa, worden deze lasten op basis van aanschaffingsprijzen van die activa berekend.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel10
  - number: '11'
    text: |-
      De rapportage omtrent de naleving van de subsdiebepalingen, bedoeld in artikel 30, tweede lid, van het
      Subsidiebesluit volksgezondheid, en [artikel 36, tweede lid van het Bekostigingsbesluit welzijnsbeleid][ref1],
      geschiedt in geval van een instellingssubsidie overeenkomstig het in bijlage 2 bij deze regeling
      opgenomen controleprotocol en met gebruikmaking van de in bijlage 3 bij deze regeling opgenomen model-
      accountantsverklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel36
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '36'
  - number: '12'
    text: |-
      Een projectsubsidie bestaat uit het verschil tussen de met de gesubsidieerde activiteiten samenhangende
      werkelijke lasten, voorzover opgenomen in een door de minister goedgekeurde begroting, en de met de gesubsidieerde
      activiteiten samenhangende baten. De subsidie bedraagt niet meer dan een door de minister vast te stellen maximum.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel12
  - number: '13'
    text: |-
      1 In de beschikking tot subsidieverlening worden de hoogte en het tempo van de bevoorschotting vastgesteld.

      2 Gedurende het project bedragen de voorschotten in totaal niet meer dan 90% van het bedrag van de verleende
      projectsubsidie.

      3 Uiterlijk twee maanden na ontvangst van de volledige aanvraag voor de subsidievaststelling worden de voorschotten
      verhoogd tot het bedrag van de subsidiedeclaratie voor zover het bedrag van de subsidiedeclaratie niet hoger is dan
      het bedrag van de verleende projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel13
  - number: '14'
    text: In een projectplan komen tenminste de in bijlage 4 bij deze regeling genoemde onderwerpen aan de orde.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel14
  - number: '15'
    text: |-
      Baten en lasten van een project die door middel van interne doorberekeningen worden toegerekend, worden bepaald
      op bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voorzover hierin lasten zijn begrepen van
      materiële vaste activa, worden deze lasten op basis van aanschaffingsprijzen van die activa berekend.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel15
  - number: '16'
    text: |-
      De rapportage omtrent de naleving van de subsidiebepalingen, bedoeld in artikel 30, tweede lid, van het
      Subsidiebesluit volksgezondheid, en [artikel 36, tweede lid van het Bekostigingsbesluit welzijnsbeleid][ref1],
      geschiedt in geval van een projectsubsidie overeenkomstig het in bijlage 5 bij deze regeling
      opgenomen controleprotocol en met gebruikmaking van de in bijlage 6 bij deze regeling opgenomen model-
      accountantsverklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel36
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '36'
  - number: '17'
    text: |-
      In deze paragraaf wordt verstaan onder een 'sectorfonds' een instelling die opgericht is en bestuurd wordt
      door vertegenwoordigers van werkgevers en werknemers en die zich richt op vernieuwend arbeidsmarkt- en
      werkgelegenheidsbeleid op de terreinen van zorg en welzijn.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel17
  - number: '18'
    text: |-
      Uiterlijk 1 juni van het jaar voorafgaande aan het jaar waarop de subsidie betrekking heeft, brengt de minister een
      notitie uit waarin de criteria waaraan een aanvraag van een sectorfonds wordt getoetst, bekend worden gemaakt. Een
      subsidie aan een sectorfonds wordt slechts verstrekt voorzover de voorgenomen activiteiten voldoen aan de in deze
      notitie gestelde criteria.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel18
  - number: '19'
    text: |-
      De minister maakt uiterlijk 15 september van het jaar voorafgaande aan het jaar waarop de subsidie betrekking heeft
      het subsidiebedrag bekend dat ten hoogste aan een sectorfonds ver-strekt kan worden.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel19
  - number: '20'
    text: |-
      1 De minister voert, uiterlijk binnen zes weken na ontvangst van de subsidieaanvraag, overleg met het
      desbetreffende fondsbestuur over het activiteitenplan en de begroting. Van dit overleg wordt een verslag opgesteld
      dat binnen twee weken na het overleg aan het sectorfonds wordt toegezonden.

      2 Indien geen overeenstemming is bereikt wordt het sectorfonds in de gelegenheid gesteld om binnen zes weken na
      het overleg, doch uiterlijk vóór 31 december van het jaar voorafgaande aan het jaar waarop de subsidie betrekking
      heeft, de aanvraag toe te lichten, aan te vullen of te wijzigen.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel20
  - number: '21'
    text: |-
      Een sectorfonds zendt afschriften van zijn activiteitenplan, begroting, activiteitenverslag en jaarrekening van
      enig jaar aan de overige sectorfondsen en aan andere door de minister aan te geven organisaties op de datum van
      indiening van deze stukken bij de minister.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel21
  - number: '22'
    text: |-
      Het bedrag van de reservering, bedoeld in [artikel 9][ref1], wordt besteed in het jaar volgend op het jaar waarvoor
      de subsidie was verleend ten behoeve van in het activiteitenplan voor dat jaar opgenomen doeleinden.

      [Artikel 9, zevende lid][ref2], is niet van toepassing op de subsidie voor het jaar 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0009812#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009812#Artikel9
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009812
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009812
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '23'
    text: |-
      De minister kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken voorzover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel23
  - number: '24'
    text: Deze regeling treedt in werking met ingang van 1 augustus 1998.
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel24
  - number: '25'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling volksgezondheid.'
    url: https://wetten.overheid.nl/BWBR0009812/2005-04-08#Artikel25
