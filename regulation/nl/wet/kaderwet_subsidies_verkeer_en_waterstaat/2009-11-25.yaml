---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: kaderwet_subsidies_verkeer_en_waterstaat
regulatory_layer: WET
publication_date: '2013-01-18'
valid_from: '2009-11-25'
bwb_id: BWBR0009196
url: https://wetten.overheid.nl/BWBR0009196/2009-11-25
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt een wettelijk kader te scheppen voor de verstrekking van een aantal subsidies door de Minister
    van Verkeer en Waterstaat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel1
  - number: '2'
    text: |-
      Onze Minister kan bij regeling als bedoeld in [artikel 3, eerste lid][ref1], subsidies verstrekken voor
      activiteiten die passen in:


      [ref1]: https://wetten.overheid.nl/BWBR0009196#Artikel3
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009196
        artikel: '3'
  - number: 2.a
    text: het verkeers- en vervoerbeleid,
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel2
  - number: 2.b
    text: het luchtvaart- en luchtverkeersbeleid,
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel2
  - number: 2.c
    text: het scheepvaart- en maritiembeleid,
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel2
  - number: 2.d
    text: het waterbeleid of
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel2
  - number: 2.e
    text: het beleid terzake van de infrastructuur,
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur dan wel bij ministeriële regeling worden de activiteiten waarvoor
      subsidie kan worden verstrekt nader bepaald alsmede de criteria voor die verstrekking vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gegeven met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.a
    text: de aanvraag van de subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.b
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.c
    text: de verplichtingen van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.d
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.e
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.f
    text: de betaling van de subsidie en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.g
    text: |-
      de vergoeding die verschuldigd is bij vermogensvorming, bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 3.2.h
    text: de intrekking of wijziging van de subsidieverlening of subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.2.i
    text: |-
      de termijn van publicatie en de inrichting van het verslag over de doeltreffendheid en de effecten van de subsidie
      in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: '3.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen voorts regels worden gegeven
      ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.3.a
    text: de openbaarmaking van de resultaten van de gesubsidieerde activiteiten;
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: 3.3.b
    text: het geven van informatie aan derden over de gesubsidieerde activiteiten door de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing op subsidies die worden verstrekt op grond van een algemene maatregel
      van bestuur of ministeriële regeling als bedoeld in het eerste lid, die uitsluitend voorziet in verstrekking aan
      rechtspersonen die krachtens publiekrecht zijn ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling als bedoeld in
      [artikel 3, eerste lid][ref1], kan worden voorzien in de vaststelling van een subsidieplafond en de regeling van de
      wijze van verdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009196#Artikel3
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009196
        artikel: '3'
  - number: '5.1'
    text: |-
      Een aanvraag kan worden afgewezen en een beschikking, inhoudende de verstrekking van een subsidie op grond van deze
      wet, kan worden ingetrokken of gewijzigd ten nadele van de ontvanger voor zover de subsidieverstrekking in strijd
      is of zou zijn met ingevolge een verdrag voor de staat geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel5
  - number: '5.2'
    text: |-
      Bij de intrekking of de wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel5
  - number: '5.3'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of de wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel5
  - number: '5.4'
    text: |-
      De [artikelen 4:49][ref1], derde lid, en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet van
      toepassing op de intrekking of wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidieontvanger opgelegde verplichtingen
      zijn belast de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel6
  - number: '6.2'
    text: |-
      Aan subsidies op grond van deze wet is de verplichting verbonden dat de subsidie-ontvanger aan een toezichthouder
      alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel6
  - number: '6.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel6
  - number: '7'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel7
  - number: '8'
    text: 'Deze wet wordt aangehaald als: Kaderwet subsidies Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0009196/2009-11-25#Artikel8
