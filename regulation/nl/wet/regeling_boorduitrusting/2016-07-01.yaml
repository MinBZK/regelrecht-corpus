  - number: '8'
    text: |-
      Voor het uitvoeren van een vlucht in het vluchtinformatiegebied Amsterdam wordt een SSR-transponder als volgt
      gebruikt:

      a. wanneer het luchtvaartuig is voorzien van een bruikbare SSR-transponder schakelt de gezagvoerder deze in
      gedurende de gehele vlucht ongeacht of het luchtvaartuig zich binnen luchtruim bevindt waar de SSR-transponder
      is voorgeschreven voor luchtverkeersleidingsdoeleinden, met dien verstande dat deze verplichting niet geldt voor
      gezagsvoerders van militaire straalvliegtuigen behorende tot de Nederlandse krijgsmacht, mits:

      1° de vlucht wordt uitgevoerd in de gebieden, genoemd in
      __REF000___________________________________________________________________________________________________________
      _____________________________________________________;

      2° deze gezagsvoerders, na daartoe opdracht te hebben gekregen van de luchtverkeers- of gevechtsleiding voorafgaand
      aan de uitvoering van vluchten in de onder 1° bedoelde gebieden, de SSR-transponder in mode 3/A in werking hebben
      gesteld;

      b. behalve in geval van nood, bij verlies van tweezijdige radioverbinding of indien het luchtvaartuig is
      onderworpen aan wederrechtelijke inmenging, wordt door de gezagvoerder de hoogteuitlezing in mode C aangezet, en

      1° de mode A code geselecteerd die individueel is verstrekt door de betrokken verlener van luchtverkeersdiensten
      waarmee contact wordt onderhouden,

      2° de transponder aangezet en de mode A code geselecteerd in overeenstemming met de regionale
      burgerluchtvaartovereenkomst, of

      3° bij afwezigheid van aanwijzingen van de betrokken verlener van luchtverkeersdiensten en regionale
      burgerluchtvaartovereenkomst mode A code 2000 ingesteld, tenzij door de betreffende verlener van
      luchtverkeersdiensten een andere opdracht is verstrekt.

      c. indien de verlener van luchtverkeersdiensten vraagt de mogelijkheden van de aan boord aanwezige SSR-
      transponder te specificeren, geeft de gezagvoerder van het luchtvaartuig dit aan door de letters
      te gebruiken die voor dat doel zijn omschreven bij punt 10 van het vliegplanformulier bedoeld in
      [artikel 3, eerste lid, van de Regeling vliegplannen][ref2];

      d. indien de verlener van luchtverkeersdiensten middels de term `confirm squawk' vraagt om de geselecteerde code te
      bevestigen, verifieert de gezagvoerder de code op de SSR-transponder, stelt zo nodig de toegewezen code opnieuw in,
      en bevestigt de verlener van luchtverkeersdiensten de geselecteerde code zoals weergegeven op de SSR-transponder;

      e. de bijzondere identificatiemogelijkheid SPI of IDENT wordt uitsluitend gebruikt op verzoek van de betrokken
      verlener van luchtverkeersdiensten;

      f. indien een verlener van luchtverkeersdiensten om informatie over de vlieghoogte vraagt tijdens mondelinge
      communicatie, verstrekt de gezagvoerder deze informatie door de vlieghoogte te melden die op zijn hoogtemeter wordt
      aangegeven en wel in de dichtstbijzijnde eenheid van 30 meter of 100 voet;

      g. in luchtvaartuigen die zijn uitgerust met een SSR-transponder met mode S met de mogelijkheid om het
      luchtvaartuig te identificeren, stelt de gezagvoerder die identificatie zodanig in dat deze correspondeert met
      de identificatie die is gespecificeerd onder punt 7 van het vliegplan of, als geen vliegplan wordt ingediend, het
      nationaliteits- en inschrijvingskenmerk van het luchtvaartuig;

      h. in geval van nood stelt de gezagvoerder de SSR-transponder in op mode A code 7700, tenzij tevoren een
      individuele identificatiecode is verstrekt en ingesteld en de gezagvoerder geen bijzondere reden aanwezig acht om
      mode A code 7700 alsnog in te stellen;

      i. bij verlies van tweezijdige radioverbinding met de betrokken verlener van luchtverkeersdiensten tijdens een
      gecontroleerde vlucht stelt de gezagvoerder de transponder in op mode A code 7600;

      j. indien het luchtvaartuig is onderworpen aan wederrechtelijke inmenging, tracht de gezagvoerder de SSR-
      transponder in te stellen op mode A code 7500, tenzij de omstandigheden het gebruik van mode A code 7700
      rechtvaardigen;

      k. indien een gezagvoerder mode A code 7500 heeft geselecteerd en de verlener van luchtverkeersdiensten vraagt deze
      selectie te bevestigen, antwoordt hij afhankelijk van de omstandigheden bevestigend of helemaal niet.


