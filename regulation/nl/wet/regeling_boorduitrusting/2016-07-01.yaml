preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Defensie;

    Gelet op de artikelen 40, 44a, eerste lid, en 49, eerste lid, van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *ADF:*


              een automatische richtingzoeker aan boord van een luchtvaartuig om de richting naar een NDB te bepalen
      (automatic direction finder);




              *ASR:*


              hoogtemeter-instellingsgebied (Altimeter Setting Region);




              *Commercieel luchtvervoer:*


              vluchtuitvoering met een luchtvaartuig waarbij tegen betaling passagiers, vracht of post wordt vervoerd;




              *DME:*


              een installatie die aan boord van een luchtvaartuig de directe afstand bepaalt tussen een luchtvaartuig en
      een grondbaken (distance measuring equipment);



             ELT:

              noodradiobaken met een zendfrequentie van 406 MHz. (emergency locator transmitter);



            ELT(S):

              een ELT die van een luchtvaartuig verwijderbaar is, zodanig opgeborgen dat deze in geval van nood direct te
      gebruiken is, en handmatig geactiveerd kan worden door overlevenden (Emergency Locator Transmitter/Survival);



            ft:

              voet, de lengte gelijk aan 0,3048 m (feet);



            GAT:

              vluchten die worden uitgevoerd overeenkomstig de ICAO-regelgeving en -procedures (General Air Traffic);



            General aviation:

              vluchtuitvoering met een luchtvaartuig, anders dan commercieel luchtvervoer of luchtwerk;



            GNSS:

              wereldwijd positie- en tijdbepalingsysteem bestaande uit één of meer satellietconstellaties,
      vliegtuigontvangers en controlemiddelen op systeemintegriteit, waar nodig uitgebreid om de vereiste
      navigatieperformance te ondersteunen voor de voorgenomen operatie (Global Navigation Satellite System);



            grondkoers:

              projectie op het aardoppervlak van de vliegbaan van een luchtvaartuig waarvan de richting op enig punt
      wordt uitgedrukt in graden ten opzichte van het ware (T), het magnetische (M) of het kaartnet-noorden (G);



            hoogte:

              verticale afstand tussen een vlak, een punt of een als punt te beschouwen voorwerp en een referentievlak,
      referentiepunt of als referentiepunt te beschouwen voorwerp;




              *Minister:*


              Minister van Infrastructuur en Milieu;



            Mode S/EHS:

              een Mode S/ELS SSR-transponder waarbij aanvullend vliegtuigkenmerken via een gegevensverbinding naar
      luchtverkeersleidingssystemen en grondsystemen worden verstuurd (Enhanced Surveillance);



            Mode S/ELS:

              een SSR-transponder waarbij aan ieder luchtvaartuig een uniek ICAO 24-bits adres wordt toegekend dat
      gebruikt wordt voor selectieve ondervraging waarbij onder andere de vluchtidentificatie via een gegevensverbinding
      naar luchtverkeersleidingssystemen en grondsystemen wordt verstuurd (Elementary Surveillance);




              *NDB:*


              een rondomstralend radiobaken op de grond met een vaste antenne (non directional beacon);



            NSA Amsterdam:

              luchtverkeersgebied als opgenomen in hoofdstuk ENR 6-2.5, van de luchtvaartgids;



            overgangshoogte:

              hoogte boven gemiddeld zeeniveau waarop en waar beneden de vlieghoogte wordt uitgedrukt in hoogte boven
      gemiddeld zeeniveau;



            overgangsniveau:

              laagst beschikbare vliegniveau boven de overgangshoogte;



            QFE:

              atmosferische druk op het aardoppervlak;



            QNH:

              QFE herleid tot gemiddeld zeeniveau in de ICAO-standaardatmosfeer;




              *radiaal:*


              de richting vanuit een VOR-grondbaken ten opzichte van het magnetisch noorden ter plaatse van het
      grondbaken;




              *RNAV:*


              een navigatiesysteem in het Europese luchtruim dat luchtvaartuigen in staat stelt een route te volgen
      tussen twee willekeurige punten, binnen voorgeschreven nauwkeurigheidsgrenzen, zonder dat het nodig is om over
      specifieke navigatie-installaties op de grond te vliegen (Area Navigation);




              *RVSM luchtruim:*


              het luchtruim vanaf FL290 tot en met FL410 waarin een reductie van de verticale separatie van 2000 naar
      1000 voet tussen vliegtuigen wordt toegepast (reduced vertical separation minimum);




              *SSR-transponder:*


              een radarbeantwoordingssysteem met informatie over de identiteit en eventueel de hoogte van het
      luchtvaartuig (secondary surveillance radar-transponder);




              *Verordening (EU) nr. 1079/2012:*


              Uitvoeringsverordening (EU) nr. 1079/2012 van de Commissie van 16 november 2012 tot vaststelling van de
      eisen voor de kanaalafstand bij mondelinge communicatie in het gemeenschappelijke Europese luchtruim (pbEU 2012,
      L 320);




              *VOR:*


              een op de grond geplaatst zendsysteem dat het mogelijk maakt om een vanuit het vliegtuig geselecteerde
      radiaal te onderscheppen of te volgen door middel van fasevergelijking (very high frequency omnidirectional range).
