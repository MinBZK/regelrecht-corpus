        artikel: '1'
  - number: 13a
    text: |-
      1 De overgangshoogte in het vluchtinformatiegebied Amsterdam is voor IFR-vluchten 915 m (3000 ft) en voor VFR-
      vluchten 1070 m (3500 ft).

      2 Het overgangsniveau in het vluchtinformatiegebied Amsterdam is gelegen op of boven 1220 m (4000 ft) boven
      gemiddeld zeeniveau.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13a
  - number: 13b
    text: |-
      Het KNMI stelt elk uur het overgangsniveau, bedoeld in [artikel 13a, tweede lid][ref1], vast en meldt dit zo snel
      mogelijk aan de desbetreffende verlener van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0012538#Artikel13a
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0012538
        artikel: 13a
  - number: 13c
    text: |-
      1 In het vluchtinformatiegebied Amsterdam en de daarbuiten gelegen luchtruimten boven het Nederlandse deel van het
      continentaal plat zijn de volgende ASR’s ingesteld:

      a. ASR Amsterdam;

      b. ASR Maastricht;

      c. ASR North Sea South;

      d. ASR North Sea North.

      2 De gebieden, bedoeld in het eerste lid worden lateraal begrensd als aangegeven in de luchtvaartgids, ENR 6-1.1.

      3 Het KNMI stelt ten minste elk uur de regionale QNH van de onderstaande gebieden vast en meldt deze zo snel
      mogelijk aan de desbetreffende verlener van luchtverkeersdiensten:

      a. luchthaven Schiphol;

      b. luchthaven Maastricht Aachen;

      c. lichteiland Goeree;

      d. platform F16-A.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13c
  - number: 13d
    text: |-
      1 Vóór het opstijgen wordt ten minste één drukhoogtemeter ingesteld op de QNH van de luchthaven.

      2 Tijdens de stijgvlucht wordt bij het passeren van de overgangshoogte ten minste één drukhoogtemeter ingesteld op
      de drukwaarde van 1013.2 hPa.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13d
  - number: 13e
    text: |-
      Tijdens een vlucht op een kruishoogte op of beneden de overgangshoogte wordt ten minste één drukhoogtemeter
      ingesteld op de regionale QNH.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13e
  - number: 13f
    text: |-
      1 Tijdens de daalvlucht wordt bij het passeren van het overgangsniveau ten minste één drukhoogtemeter ingesteld op
      de QNH van de luchthaven.

      2 De in het eerste lid bedoelde instelling op QNH kan reeds vóór het passeren van het overgangsniveau plaatsvinden,
      indien de betrokken luchtverkeersleidingsdienst, na het verstrekken van de naderingsklaring, toestaat om de
      vlieghoogte uit te drukken in hoogte boven gemiddeld zeeniveau nadat de einddaling is ingezet, indien:

      a. wordt voorzien dat boven de overgangshoogte geen horizontale vlucht meer zal plaatsvinden, of

      b. de vlucht wordt uitgevoerd volgens de door de Minister vastgestelde en in de luchtvaartgids gepubliceerde
      naderingsprocedure waarbij de hoogte waarop de eindnadering wordt aangevangen is gelegen op of beneden het
      overgangsniveau.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13f
  - number: 13g
    text: |-
      1 Een horizontaal deel van een VFR-vlucht boven 1070 m (3500 ft) boven de grond of het water wordt uitgevoerd op
      een vliegniveau als aangegeven in Appendix 3 bij verordening (EU) nr. 923/2012.

      2 Een horizontaal deel van een gecontroleerde vlucht binnen een luchtverkeersleidingsgebied wordt uitgevoerd op een
      kruishoogte zoals aangegeven in Appendix 3 bij verordening (EU) nr. 923/2012.

      3 Een horizontaal deel van een IFR-vlucht buiten een luchtverkeersleidingsgebied wordt uitgevoerd op een
      kruishoogte als aangegeven in Appendix 3 bij verordening (EU) nr. 923/2012.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13g
  - number: 13h
    text: |-
      1 In afwijking van [artikel 13g][ref1] gelden binnen het vluchtinformatiegebied Amsterdam en de daarbuiten gelegen
      luchtruimte boven het Nederlandse deel van het continentaal plat de door de minister vastgestelde en in hoofdstuk
      ENR 3 van de luchtvaartgids gepubliceerde kruishoogtes.

      2 Voor de toepassing van de in het eerste lid genoemde kruishoogtes is voor IFR-vluchten op of beneden 915 m (3000
      ft) de grondkoers van het belangrijkste deel van de vlucht van toepassing.


