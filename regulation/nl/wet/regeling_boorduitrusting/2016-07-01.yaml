  - number: '9'
    text: |-
      Voor het uitvoeren van een IFR-vlucht in het vluchtinformatiegebied Amsterdam wordt, tenzij door de betreffende
      verlener van luchtverkeersdiensten een andere opdracht is verstrekt of afwijkende voorschriften van toepassing zijn
      door de aard van het luchtvaartuig of het doel van de vlucht, een SSR-transponder als volgt gebruikt:

      a. de SSR-transponder wordt onmiddellijk voorafgaande aan de opstijging in werking gesteld en in werking gehouden
      tot de landing;

      b. de SSR-transponder wordt ingesteld op de individuele identificatiecode die laatstelijk is verstrekt door de
      betrokken verlener van luchtverkeersdiensten;

      c. zolang geen individuele identificatiecode is verstrekt, wordt mode A code 2000 ingesteld;

      d. indien voor het vertrek blijkt dat de SSR-transponder niet of niet goed werkt en niet voor vertrek kan worden
      hersteld, wordt

      1º de betrokken verlener van luchtverkeersdiensten hierover zo spoedig mogelijk en bij voorkeur voorafgaand aan het
      indienen van het vliegplan ingelicht, en

      2º een vliegplan ingediend met als bestemming de dichtstbijzijnde geschikte luchthaven waar herstel kan
      plaatsvinden, met vermelding van de staat van de SSR-transponder onder punt 10;

      e. indien na het vertrek blijkt dat de SSR-transponder niet of niet goed werkt, wordt rekening gehouden met
      beperkingen bij de uitvoering van het vliegplan;

      f. na de landing wordt al het mogelijke verricht om de SSR-transponder te laten herstellen of vervangen voor de
      volgende vlucht; g. Indien herstel of vervanging ter plaatse niet mogelijk is, wordt

      1º de betrokken verlener van luchtverkeersdiensten hierover zo spoedig mogelijk en bij voorkeur voorafgaand aan het
      indienen van het vliegplan ingelicht, en

      2º een vliegplan ingediend met als bestemming de dichtstbijzijnde geschikte luchthaven waar herstel kan
      plaatsvinden, met vermelding van de staat van de SSR-transponder onder punt 10.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel9
  - number: '10'
    text: |-
      1 Voor het uitvoeren van een VFR vlucht in het vluchtinformatiegebied Amsterdam zijn de volgende voorschriften voor
      het gebruik van een SSR-transponder van toepassing:

      a. het gebruik van een SSR-transponder met mode S/ELS en met automatische hoogterapportering in mode C is verplicht
      in het luchtruim met de classificatie A, B, C, D, E of F en in de NSA Amsterdam;

      b. het gebruik van een SSR-transponder met de mode S/ELS en met automatische hoogterapportering in mode C is
      verplicht in het overige luchtruim met de classificatie G op en boven 1200 voet AMSL;

      c. mode A code 7000 wordt ingesteld.

      2 De verplichtingen, bedoeld in het eerste lid, zijn niet van toepassing wanneer door de betreffende verlener van
      luchtverkeersdiensten een andere opdracht is verstrekt of afwijkende voorschriften van toepassing zijn door de aard
      van het luchtvaartuig of het doel van de vlucht.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel10
  - number: '11'
    text: |-
      1 Alle vliegtuigen die vluchten uitvoeren als commercieel luchtvervoer en die zijn toegelaten voor het vervoer van
      meer dan 19 passagiers, zijn uitgerust met ten minste één automatische ELT of twee ELT’s van om het even welk type.

      2 Alle vliegtuigen die vluchten uitvoeren als commercieel luchtvervoer en die zijn toegelaten voor het vervoer van
      meer dan 19 passagiers, voor welk het bewijs van luchtwaardigheid is afgegeven na 1 juli 2008, zijn uitgerust met
      ten minste twee ELT’s waarvan er één ELT automatisch geactiveerd wordt.

      3 Alle vliegtuigen die vluchten uitvoeren als commercieel luchtvervoer en die zijn toegelaten voor het vervoer van
      19 passagiers of minder, zijn uitgerust met ten minste één ELT van om het even welk type.

      4 Alle vliegtuigen die vluchten uitvoeren als commercieel luchtvervoer en die zijn toegelaten voor het vervoer van
      19 passagiers of minder, voor welk het bewijs van luchtwaardigheid is afgegeven na 1 juli 2008, zijn uitgerust met
      ten minste één ELT die automatisch geactiveerd wordt.

      5 Alle vliegtuigen die vluchten uitvoeren als General Aviation, zijn uitgerust met ten minste één ELT van om het
      even welk type.

      6 Alle vliegtuigen die vluchten uitvoeren als General Aviation, voor welk het bewijs van luchtwaardigheid is
      afgegeven na 1 juli 2008, zijn uitgerust met ten minste één ELT die automatisch geactiveerd wordt.

      7 Prestatie klasse 1 en 2 helikopters die vluchten uitvoeren als commercieel luchtvervoer zijn uitgerust met ten
      minste één ELT die automatisch geactiveerd wordt, en ten minste één ELT die automatisch geactiveerd wordt en één
      ELT(S) in een reddingsvlot of reddingsvest indien de vlucht boven water wordt uitgevoerd.

      8 Prestatie klasse 3 helikopters die vluchten uitvoeren als commercieel luchtvervoer zijn uitgerust met ten minste
      één ELT die automatisch geactiveerd wordt, en ten minste één ELT die automatisch geactiveerd wordt en één ELT(S)
      in een reddingsvlot of reddingsvest indien de vlucht boven water wordt uitgevoerd met normale kruissnelheid op een
      afstand van meer dan 10 minuten vliegen vanaf land.

      9 Prestatie klasse 1 en 2 helikopters die vluchten uitvoeren als General Aviation zijn uitgerust met ten minste één
      ELT die automatisch geactiveerd wordt, en ten minste één ELT die automatisch geactiveerd wordt en één ELT(S) in een
      reddingsvlot of reddingsvest indien de vlucht boven water wordt uitgevoerd.

      10 Prestatie klasse 3 helikopters die vluchten als uitvoeren als General Aviation zijn uitgerust met ten minste één
      ELT die automatisch geactiveerd wordt, en ten minste één ELT die automatisch geactiveerd wordt en één ETL(S) in een
      reddingsvlot of reddingsvest indien de vlucht boven water wordt uitgevoerd met normale kruissnelheid op een afstand
      van meer dan 10 minuten vliegen vanaf land.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel11
  - number: '13'
    text: |-
      1 De Minister kent aan elk luchtvaartuig op aanvraag een 24-bit luchtvaartuigadres toe dat geregistreerd wordt in
      een gegevensbestand, aangehouden door de Inspectie Leefomgeving en Transport.

      2 Het digitale signaal van de ELT bevat, behoudens in uitzonderlijke gevallen, het 24-bit luchtvaartuigadres van
      het bijbehorende luchtvaartuig, ten behoeve van de identificatie.

      3 Gebruikers van luchtvaartuigen die ELT’s vervangen, plaatsen ELT’s die zijn gecodeerd met het 24-bit
      luchtvaartuigadres volgens het ‘serialized user protocol’ of het ‘standard location protocol’.

      4 De toekenning van het 24-bit luchtvaartuigadres, bedoeld in het eerste lid, geschiedt door tussenkomst van de
      inspecteur-generaal van de Inspectie Leefomgeving en Transport. Bij de aanvraag wordt het registratiekenmerk, het
      type en het serienummer van het luchtvaartuig vermeld.

      5 De codering volgens het ‘serialized user protocol’ of het ‘standard location protocol’ resulteert in een 15-digit
      hexadecimale code.

      6 De 15-digit hexadecimale codes, alsmede de wijzigingen daarin en de bijbehorende gegevens van het vliegtuig,
      de gegevens van de contactpersonen, worden door de directeur-hoofdinspecteur van het Agentschap Telecom van
      het Ministerie van Economische Zaken opgenomen in het gegevensbestand van de opsporings- en reddingsdienst
      in Nederland. Uitsluitend ELT’s die zijn geprogrammeerd op de in dit artikel bedoelde wijze worden in het
      gegevensbestand van de opsporings-en reddingsdienst in Nederland opgenomen, alsmede afwijkend geprogrammeerde ELT’s
      na verkregen toestemming van de Minister.

      7 Voor luchtvaartuigen die een 24-bit luchtvaartuigadres voor andere doeleinden in gebruik hebben, wordt dit adres
      gebruikt voor de bij het luchtvaartuig behorende ELT’s.

      8 Details ten behoeve van de registratie worden middels een AIC als bedoeld in
      [artikel 1 van de Regeling Burgerluchtvaartinlichtingen][ref1] of middels de website van de Inspectie Leefomgeving
      en Transport bekend gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010154#Artikel1
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel13
