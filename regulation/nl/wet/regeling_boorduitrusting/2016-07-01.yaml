      1 Voor het uitvoeren van een vlucht in het vluchtinformatiegebied Amsterdam is een luchtvaartuig niet zijnde een
      staatsluchtvaartuig voor zover het betreft:

      a. een vliegtuig met turbine motoren met een maximaal toegelaten startmassa boven 15.000 kg of met een goedgekeurde
      configuratie voor meer dan 30 zitplaatsen voor passagiers, of

      b. een vliegtuig met turbine motoren met een maximaal toegelaten startmassa boven 5700 kg of met een goedgekeurde
      configuratie voor meer dan 19 zitplaatsen voor passagiers met ingang van 1 januari 2005, uitgerust met een Airborne
      Collision Avoidance System van de tweede generatie (ACAS II), dat voldoet aan de eisen gesteld in bijlage 10, boek
      IV, van het Verdrag inzake de internationale burgerluchtvaart.

      2 Het eerste lid is voor een in dat lid bedoeld luchtvaartuig niet van toepassing indien de Eurocontrol-organisatie
      met betrekking tot dat luchtvaartuig een daartoe strekkende verklaring heeft afgegeven. De verklaring wordt
      meegevoerd tijdens de vlucht.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel2
  - number: '3'
    text: |-
      1 Voor het uitvoeren van een IFR-vlucht in het vluchtinformatiegebied Amsterdam is een luchtvaartuig uitgerust met:

      a. een VHF-zend/ontvangstinstallatie die voldoet aan de eisen, bedoeld in artikel 5, eerste, tweede en vierde lid,
      van Verordening (EU) nr. 1079/2012;

      b. radioapparatuur met 8,33 kHz-kanaalafstand, indien de vlucht wordt uitgevoerd in gebieden waar een omzetting
      naar 8,33 kHz-kanaalafstand heeft plaatsgevonden;

      c. navigatieboordapparatuur waarmee de vlucht kan worden uitgevoerd volgens het operationeel vliegplan waarbij
      gebruik gemaakt wordt van luchtverkeersroutes en -procedures vastgesteld door de Minister, die voldoet aan de eisen
      gesteld in bijlage 10, boek I (Radio Navigation Aids), van het Verdrag inzake de internationale burgerluchtvaart;

      d. een SSR-transponder met mode S/ELS, die voldoet aan de eisen, bedoeld in bijlage 10, boek IV (Surveillance Radar
      and Collision Avoidance Systems) van het Verdrag inzake de internationale burgerluchtvaart, en

      e. een SSR transponder met Mode S/EHS, die voldoet aan de eisen, bedoeld in bijlage 10, boek IV (Surveillance Radar
      and Collision Avoidance Systems) van het Verdrag inzake de internationale burgerluchtvaart, voor het uitvoeren van
      vluchten als GAT op vliegniveau 245 of hoger, met een luchtvaartuig met een maximum toegelaten startmassa boven
      5700 kg, of een maximum ware luchtsnelheid tijdens de kruisvlucht van meer dan 250 knopen.

      2 Onverminderd het bepaalde in het eerste lid, onderdeel a, is artikel 9, eerste tot en met het elfde lid, van de
      Verordening (EU) nr. 1079/2012, van toepassing op staatsluchtvaartuigen.

      3 Het eerste lid, onderdelen c, d en e, zijn niet van toepassing op staatsluchtvaartuigen, indien deze beschikken
      over een systeem met een gelijkwaardig veiligheidsniveau als de in die onderdelen genoemde systemen.

      4 Voor het volgen van een luchtverkeersroute op vliegniveau 100 en hoger is een luchtvaartuig niet zijnde een
      staatsluchtvaartuig uitgerust met een installatie die het mogelijk maakt om met RNAV luchtverkeersroutes te vliegen
      met een afwijking van ten hoogste 5 zeemijlen tijdens ten minste 95% van de vliegtijd en die is toegelaten op basis
      van JAA Advisory Circular Joint 20X4 ‘Airworthiness Approval and Operational Criteria for the use of Navigation
      Systems in European Airspace Designated for Basic RNAV Operations’.

      5 Voor het naderen en vertrekken van de luchthaven Schiphol is een luchtvaartuig, niet zijnde een helikopter of een
      staatsluchtvaartuig, dat navigeert op basis van instrumenten uitgerust met een installatie die het mogelijk maakt
      om met RNAV naderings- en vertrekroutes in het naderingsgebied van Schiphol te vliegen met een afwijking van ten
      hoogste één zeemijl tijdens ten minste 95 procent van de vliegtijd en die is toegelaten op basis van de eisen van
      Temporary Guidance Leaflet 10 ‘AIRWORTHINESS AND OPERATIONAL APPROVAL FOR PRECISION RNAV OPERATIONS IN DESIGNATED
      EUROPEAN AIRSPACE’ van de Joint Aviation Authorities of vergelijkbaar en gecertificeerd is door de nationale
      bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel3
  - number: 3a
    text: |-
      1 Voor het uitvoeren van een VFR-vlucht in het vluchtinformatiegebied Amsterdam is een luchtvaartuig uitgerust met
      een VHF-zend/ontvanginstallatie waarmee wordt voldaan aan artikel 5, eerste, derde en vierde lid, van Verordening
      (EU) nr. 1079/2012.

      2 Onverminderd het eerste lid, is voor het uitvoeren van een VFR-vlucht met een staatsluchtvaartuig in het
      vluchtinformatiegebied Amsterdam artikel 9, eerste tot en met het elfde lid, van Verordening (EU) nr. 1079/2012
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel3a
  - number: 3b
    text: |-
      1 De radiotelefonische berichtenwisseling tussen de Nederlandse luchtverkeersdiensten en luchtvaartuigen wordt
      gevoerd in de Engelse taal.

      2 Met betrekking tot burgerluchtvaartuigen zijn op de in het eerste lid genoemde berichtenwisseling bovendien van
      toepassing:

      a. de normen, aanbevelingen en procedures van Bijlage 10 bij het op 7 december 1944 te Chicago tot stand gekomen
      Verdrag inzake de internationale burgerluchtvaart, (Trb. 1973, 109). 'Aeronautical Telecommunications', deel II,
      hoofdstuk V 'Aeronautical Mobile Service';

      b. gebruikmaking, voor zover van toepassing, van het standaardradiotelefonie 'woordgebruik' vermeld in ICAO-
      Document 4444 (Procedures for Air Navigation Services – Air Traffic Management), hoofdstuk 12.

      3 Onverminderd het tweede lid, onderdeel b, wordt in het vluchtinformatiegebied Amsterdam boven vliegniveau 245 bij
      de verandering van vliegniveaus in de Engelse taal het woord ‘TO’ niet gebruikt.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel3b
  - number: '4'
    text: |-
      Voor het uitvoeren van een IFR-vlucht, een gecontroleerde VFR-vlucht in het vluchtinformatiegebied Amsterdam of
      een VFR-vlucht in de NSA Amsterdam is een luchtvaartuig uitgerust met telecommunicatie-installaties die ten minste
      voldoen aan de eisen, gesteld in bijlage 10 van het Verdrag inzake de internationale burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel4
  - number: '5'
    text: |-
      Voor het uitvoeren van een IFR-vlucht in het vluchtinformatiegebied Amsterdam is een luchtvaartuig uitgerust
      met navigatie-installaties die ten minste voldoen aan de eisen, gesteld in bijlage 10 van het Verdrag inzake de
      internationale burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel5
  - number: 5a
    text: |-
      Voor het uitvoeren van een IFR-kruisvlucht in de NSA Amsterdam van en naar mijnbouwinstallaties op de Noordzee
      waarbij een helikopter ten behoeve van navigatie gebruik maakt van GNSS, is de helikopter uitgerust met GNSS
      apparatuur die voldoet aan eisen gebaseerd op EASA AMC20-4.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel5a
  - number: '6'
    text: |-
      Voor het uitvoeren van een IFR-vlucht in het RVSM-luchtruim in het vluchtinformatiegebied Amsterdam is een
      luchtvaartuig niet zijnde een staatsluchtvaartuig uitgerust met navigatie-apparatuur die voldoet aan de eisen
      gesteld in JAA temporary guidance leaflet no 6, revision 1, blijkende uit een goedkeuring van het luchtvaartuig
      voor het gebruik er van in het RVSM luchtruim.
    url: https://wetten.overheid.nl/BWBR0012538/2016-07-01#Artikel6
  - number: '7'
    text: |-
      1 Voor het uitvoeren van een VFR-vlucht in het vluchtinformatiegebied Amsterdam, behalve in gebieden met de
      classificatie G beneden 1200 voet AMSL buiten de NSA Amsterdam, is een luchtvaartuig uitgerust met een SSR-
      transponder met mode S/ELS, die voldoet aan de eisen bedoeld in bijlage 10, Boek IV (Surveillance Radar and
      Collision Avoidance Systems) van het Verdrag inzake de internationale burgerluchtvaart.

      2 Het eerste lid is niet van toepassing op een zweefvliegtuig, zeilvliegtuig, schermvliegtuig of ballon tenzij een
      zweefvliegtuig, zeilvliegtuig, schermvliegtuig of ballon zich bevindt in de door de Minister in overeenstemming
      met de Minister van Defensie voor transpondergebruik aangewezen luchtverkeersgebieden en tijdelijke gebieden met
      beperkingen als bedoeld in [artikel 9 van het Besluit luchtverkeer 2014][ref1].


