regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2013-01-01'
bwb_id: BWBR0028564
url: https://wetten.overheid.nl/BWBR0028564/2013-01-01
preamble:
  text: |-
    Gelet op artikel 4.9 van het Besluit omgevingsrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Ter zake van de behandeling van een aanvraag tot verlening van een omgevingsvergunning dan wel tot wijziging van
      voorschriften van een omgevingsvergunning, heft de minister die daarvoor bevoegd gezag is rechten voor een door hem
      verstrekte dienst als bedoeld in de tarieventabel in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#Artikel1
  - number: '2'
    text: Betalingsplichtig is de aanvrager van een dienst, dan wel degene ten behoeve van wie een dienst wordt verleend.
    url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Rechten worden niet geheven voor een dienst waarvan de kosten krachtens
      [afdeling 6.4 van de Wet ruimtelijke ordening][ref1] zijn of worden verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.4
    url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.4'
  - number: '4'
    text: |-
      De rechten worden geheven overeenkomstig de heffingsmaatstaven en tarieven, opgenomen in de bij deze regeling
      behorende tarieventabel.
    url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#Artikel4
  - number: '5'
    text: De rechten worden geheven door middel van een beschikking, die deel kan uitmaken van de beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#Artikel5
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 oktober 2010.
    url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling leges omgevingsvergunning Rijksoverheid.'
    url: https://wetten.overheid.nl/BWBR0028564/2013-01-01#Artikel7
