---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_afsluiten_elektriciteit_en_gas_van_kleinverbruikers
regulatory_layer: WET
publication_date: '2007-03-07'
valid_from: '2007-12-01'
bwb_id: BWBR0020577
url: https://wetten.overheid.nl/BWBR0020577/2007-12-01
preamble:
  text: |-
    Gelet op de artikelen 95b, achtste lid, van de Elektriciteitswet 1998 en 44, achtste lid, van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder kleinverbruiker: een afnemer als bedoeld in
      [artikel 95a, eerste lid, van de Elektriciteitswet 1998][ref1] of [artikel 43, eerste lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
  - number: '2'
    text: |-
      Een netbeheerder beëindigt het transport van elektriciteit of gas naar een kleinverbruiker niet in de periode van
      1 oktober tot 1 april van enig jaar behoudens:
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel2
  - number: 2.a
    text: op verzoek van de kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel2
  - number: 2.b
    text: ingeval van fraude of misbruik door de kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel2
  - number: 2.c
    text: ingeval de onveiligheid van de installatie afsluiting noodzakelijk maakt;
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel2
  - number: 2.d
    text: ingeval op de aansluiting van de kleinverbruiker bij de netbeheerder geen vergunninghouder bekend is.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel2
  - number: '3'
    text: |-
      Een vergunninghouder beëindigt de levering van elektriciteit of gas aan een kleinverbruiker niet in de periode van
      1 oktober tot 1 april van enig jaar behoudens:
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel3
  - number: 3.a
    text: op verzoek van de kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel3
  - number: 3.b
    text: ingeval van fraude of misbruik door de kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel3
  - number: 3.c
    text: ingeval de desbetreffende overeenkomst afloopt.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel3
  - number: '4.1'
    text: |-
      Een netbeheerder of een vergunninghouder beëindigt het transport van elektriciteit of gas naar of de levering van
      elektriciteit of gas aan een kleinverbruiker in de periode van 1 oktober tot 1 april van enig jaar evenmin wegens
      wanbetaling van de kleinverbruiker:
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel4
  - number: 4.1.1°
    text: |-
      indien de kleinverbruiker binnen een door de netbeheerder of de vergunninghouder vast te stellen redelijke
      termijn na de in [artikel 5, eerste lid][ref1], bedoelde herinnering, een bewijs overlegt dat hij heeft verzocht
      om schuldbemiddeling als bedoeld in [artikel 48, eerste lid, van de Wet op het consumentenkrediet][ref2],
      of om toepassing van de schuldsaneringsregeling natuurlijke personen, bedoeld in
      [titel III van de Faillissementswet][ref3], totdat op dat verzoek negatief is beslist of, indien een
      schuldsaneringsregeling wordt getroffen, gedurende de looptijd van die regeling,


      [ref1]: https://wetten.overheid.nl/BWBR0020577#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020577
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0001860
  - number: 4.1.2°
    text: |-
      indien de vordering van de netbeheerder of de vergunninghouder binnen de in onderdeel 1° bedoelde termijn
      betrokken wordt bij een lopende schuldsaneringsregeling van de kleinverbruiker, gedurende de looptijd van die
      schuldsaneringsregeling,
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel4
  - number: 4.1.3°
    text: |-
      indien de kleinverbruiker binnen de in onderdeel 1° bedoelde termijn een verklaring overlegt van een arts die geen
      behandelend arts van de betrokkene is, die inhoudt dat de beëindiging zeer ernstige gezondheidsrisico’s tot gevolg
      zou hebben voor de kleinverbruiker of huisgenoten van de kleinverbruiker, of
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel4
  - number: 4.1.4°
    text: |-
      indien de netbeheerder of de vergunninghouder toepassing geeft aan artikel 6a, mits de desbetreffende vordering
      binnen een door de netbeheerder of de vergunninghouder vast te stellen redelijke termijn nadat aan artikel 6a
      toepassing is gegeven, is betrokken bij een schuldsaneringsregeling van de kleinverbruiker, gedurende de looptijd
      van die schuldsaneringsregeling.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel4
  - number: '4.2'
    text: |-
      Een netbeheerder of een vergunninghouder past het eerste lid uitsluitend toe nadat de in de [artikelen 5][ref1],
      [6][ref2] en, in voorkomend geval, [6a][ref3], beschreven procedure is gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0020577#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020577#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020577#Artikel6a
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020577
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020577
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020577
        artikel: 6a
        paragraaf: '2'
  - number: '4.3'
    text: |-
      In afwijking van het eerste lid, onderdelen 1º, 2º en 4º, kan de netbeheerder of de vergunninghouder het transport
      van elektriciteit of gas naar of de levering van elektriciteit of gas aan een kleinverbruiker beëindigen indien
      de vordering van de netbeheerder of de vergunninghouder betrokken is bij een schuldsaneringsregeling en de
      kleinverbruiker zijn verplichtingen met betrekking tot die vordering niet nakomt. Het tweede lid is dan niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel4
  - number: '5.1'
    text: |-
      Indien een kleinverbruiker niet binnen de gestelde termijn een vordering tot betaling van een netbeheerder of een
      vergunninghouder voldoet, doet de desbetreffende netbeheerder of vergunninghouder de kleinverbruiker ten minste
      eenmaal een schriftelijke herinnering daaromtrent toekomen.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel5
  - number: '5.2'
    text: 'De netbeheerder of de vergunninghouder:'
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel5
  - number: 5.2.a
    text: wijst de kleinverbruiker bij die herinnering op de mogelijkheden voor schuldhulpverlening,
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel5
  - number: 5.2.b
    text: |-
      vermeldt bij de herinnering dat de kleinverbruiker niet wordt afgesloten indien deze kan aantonen dat hij voldoet
      aan de eisen van [artikel 4, eerste lid, onderdelen 1°, 2°, 3° of 4°][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0020577#Artikel4
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020577
        artikel: '4'
        paragraaf: '2'
  - number: 5.2.c
    text: |-
      biedt bij de herinnering aan met schriftelijke instemming van de kleinverbruiker onder vermelding
      van diens persoonsgegevens en de hoogte van zijn schuld, schuldbemiddeling als bedoeld in
      [artikel 48, eerste lid, van de Wet op het consumentenkrediet][ref1] in te schakelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: '6'
    text: |-
      De netbeheerder of de vergunninghouder spant zich in om in persoonlijk contact te treden met de kleinverbruiker
      teneinde deze te wijzen op mogelijkheden om betalingsachterstanden te voorkomen en te beëindigen.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel6
  - number: 6a
    text: |-
      Indien een kleinverbruiker niet heeft gereageerd op het in [artikel 5, tweede lid, onderdeel c][ref1], bedoelde
      aanbod verstrekt de netbeheerder of de vergunninghouder de contactgegevens van de kleinverbruiker, diens
      klantnummer en informatie over de hoogte van diens schuld aan een schuldbemiddelingsinstantie als bedoeld in
      [artikel 48, eerste lid, van de Wet op het consumentenkrediet][ref2] met het oog op een mogelijk aanbod tot
      schuldbemiddeling door die instantie aan de betrokken kleinverbruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0020577#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0020577
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 6b
    text: |-
      Een netbeheerder of een vergunninghouder draagt er zorg voor dat het transport van elektriciteit of gas naar of de
      levering van elektriciteit of gas aan een kleinverbruiker die wegens wantbetaling is beëindigd, binnen de periode
      van 1 oktober tot 1 april wordt hervat indien de kleinverbruiker:
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel6b
  - number: 6b.a
    text: |-
      een bewijs overlegt dat de vordering van de netbeheerder of de vergunninghouder wordt betrokken bij een
      schuldsaneringsregeling, of
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel6b
  - number: 6b.b
    text: met de betrokken netbeheerder of vergunninghouder een afbetalingsregeling heeft getroffen.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel6b
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling afsluiten elektriciteit en gas van kleinverbruikers.'
    url: https://wetten.overheid.nl/BWBR0020577/2007-12-01#Artikel8
