        artikel: '80'
  - number: '4'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 12 december 1994, nr. RV 188313 (Stcrt. 252),
      Hoofddirectie van de Waterstaat, houdende vaststelling keuringsbewijs, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010803/2006-01-01#Artikel4
  - number: '5'
    text: |-
      1 Deze regeling treedt met uitzondering van [artikel 2][ref1] in werking met ingang van de tweede dag na de
      dagtekening van de Staatscourant waarin zij wordt geplaatst.

      2 Indien het bij koninklijke boodschap van 21 mei 1999 ingediende voorstel van wet tot wijziging van de
      [Wegenverkeerswet 1994][ref2] met betrekking tot de Algemene periodieke keuring, Kamerstukken II 1998/1999, 26 554,
      nrs. 1-2, nadat het tot wet is verheven, in werking treedt, vervallen op hetzelfde tijdstip de [artikelen 1][ref3]
      en [3][ref4] en treedt [artikel 2][ref5] op hetzelfde tijdstip in werking.


