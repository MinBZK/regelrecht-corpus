preamble:
  text: |-
    Gelet op artikel 72, tweede lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010803/2006-01-01#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      1

      Het model keuringsrapport als bedoeld in [artikel 72, tweede lid, onderdeel a, van de Wegenverkeerswet 1994][ref1]
      en het model vervangend keuringsbewijs als bedoeld in [artikel 80, eerste lid, van de Wegenverkeerswet 1994][ref2],
      wordt vastgesteld overeenkomstig het in de bijlage bij deze regeling opgenomen formulier.

      2 Het model als bedoeld in het eerste lid, moet voorzien zijn van een gele doorslag indien de invulling niet
      rechtstreeks plaatsvindt uit het keuringsregister


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel80
    url: https://wetten.overheid.nl/BWBR0010803/2006-01-01#Artikel2
