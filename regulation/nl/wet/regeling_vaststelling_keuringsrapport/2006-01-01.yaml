preamble:
  text: |-
    Gelet op artikel 72, tweede lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010803/2006-01-01#ArtikelAanhef
articles:
  - number: '2.2'
    text: |-
      Het model als bedoeld in het eerste lid, moet voorzien zijn van een gele doorslag indien de invulling niet
      rechtstreeks plaatsvindt uit het keuringsregister
    url: https://wetten.overheid.nl/BWBR0010803/2006-01-01#Artikel2
  - number: '4'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 12 december 1994, nr. RV 188313 (Stcrt. 252),
      Hoofddirectie van de Waterstaat, houdende vaststelling keuringsbewijs, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010803/2006-01-01#Artikel4
  - number: '5.1'
    text: |-
      Deze regeling treedt met uitzondering van [artikel 2][ref1] in werking met ingang van de tweede dag na de
      dagtekening van de Staatscourant waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0010803#Artikel2
    url: https://wetten.overheid.nl/BWBR0010803/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010803
        artikel: '2'
  - number: '5.2'
    text: |-
      Indien het bij koninklijke boodschap van 21 mei 1999 ingediende voorstel van wet tot wijziging van de
      [Wegenverkeerswet 1994][ref1] met betrekking tot de Algemene periodieke keuring, Kamerstukken II 1998/1999, 26 554,
      nrs. 1-2, nadat het tot wet is verheven, in werking treedt, vervallen op hetzelfde tijdstip de [artikelen 1][ref2]
      en [3][ref3] en treedt [artikel 2][ref4] op hetzelfde tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
      [ref2]: https://wetten.overheid.nl/BWBR0010803#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0010803#Artikel3
