articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* de Minister van Economische Zaken;

      b. *besluit:* het [Besluit stimulering duurzame energieproductie][ref1];

      c. *Wbr-vergunning:* de vergunning op grond van [artikel 2 van de Wet beheer rijkswaterstaatswerken][ref2] voor de
      bouw en exploitatie van een productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van
      windenergie op zee.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel2
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel1
    references:
