        artikel: '60'
  - number: '6'
    text: |-
      De beschikking tot verlenen van een subsidie voor de productie van hernieuwbare elektriciteit met behulp van
      windenergie op zee wordt verleend onder de opschortende voorwaarde dat binnen acht weken na afgifte van deze
      beschikking een uitvoeringsovereenkomst overeenkomstig de overeenkomst opgenomen in de bij deze regeling behorende
      [bijlage 2][ref1] tot stand is gekomen tussen de Staat en de subsidie-aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0026690
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026690
  - number: '7'
    text: De subsidie wordt voor een periode van 15 jaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel7
  - number: '8'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie voor de productie van hernieuwbare elektriciteit met behulp
      van windenergie op zee binnen 5 jaar na de datum van inwerkingtreding van de beschikking tot subsidieverlening
      in gebruik.
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel8
  - number: '9'
    text: |-
      Het maximaal aantal vollasturen voor productie-installaties voor de productie van hernieuwbare elektriciteit met
      behulp van windenergie op zee bedraagt 3180 uren per jaar.
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel9
  - number: '10'
    text: |-
      De basiselektriciteitsprijs, bedoeld in [artikel 20, eerste lid, van het besluit][ref1] bedraagt € 0,051150 per
      kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel20
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '20'
  - number: '11'
    text: |-
      De subsidie-ontvanger verstrekt tenminste eenmaal per jaar, op het tijdstip genoemd in de beschikking tot
      subsidieverlening, zowel per windmolen als per productie-installatie voor de productie van hernieuwbare
      elektriciteit met behulp van windenergie op zee, de volgende gegevens aan de Minister:

      a. de elektriciteitsproductie die per maand werd behaald bij het windaanbod in de betreffende maand;

      b. de beschikbaarheid per maand van elke afzonderlijke windmolen en van de productie-installatie voor de productie
      van hernieuwbare elektriciteit met behulp van windenergie op zee;

      c. de redenen voor en de duur van uitval;

      d. het productieverlies dat gepaard ging met de uitval;

      e. de effecten van de uitval van windmolens op de bedrijfsvoering en op het onderhoud van die windmolens.
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel11
  - number: '12'
    text: |-
      De correcties op het tenderbedrag voor de subsidie, bedoeld in [artikel 2, eerste lid][ref1], worden voor 2010 als
      volgt vastgesteld:

      a. € 0,054638 per kWh voor wat betreft de elektriciteitsprijs, bedoeld in
      [artikel 22, eerste lid, onderdeel a, van het besluit][ref2];

      b. € 0 voor wat betreft de correcties, bedoeld in [artikel 22, eerste lid, onderdeel b, van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026690#Artikel2
