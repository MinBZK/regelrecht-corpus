        bwb_id: BWBR0008331
        artikel: '2'
  - number: '2'
    text: |-
      1 De Minister verstrekt op aanvraag subsidie aan producenten van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op zee.

      2 Aanvragen om subsidie als bedoeld in het eerste lid worden ontvangen in de periode van 4 januari 2010 tot 1 maart
      2010, 17:00 uur.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      is opgenomen in de bij deze regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026690
    url: https://wetten.overheid.nl/BWBR0026690/2010-07-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026690
  - number: '3'
    text: |-
      1 Het subsidieplafond voor het verlenen van subsidie die is aangevraagd in de periode, bedoeld in
      [artikel 2, tweede lid][ref1], bedraagt € 5.384.817.810,00.

      2 De Minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van rangschikking van de aanvragen.

      3 De criteria voor rangschikking, bedoeld in
      [artikel 60, eerste lid, onderdelen c tot en met e, van het besluit][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026690#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel60
