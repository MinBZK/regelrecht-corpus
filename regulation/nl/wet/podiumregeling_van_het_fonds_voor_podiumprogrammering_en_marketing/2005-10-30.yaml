        artikel: '10'
  - number: '11'
    text: |-
      1 Het Fonds besluit na uiterlijk acht weken, gerekend vanaf de voor dat jaar vastgestelde uiterlijke
      indiendata, over de subsidieaanvraag met inachtneming van het advies van de commissie. Indien de beschikking
      tot subsidieverlening niet binnen acht weken kan worden gegeven, stelt het Fonds de aanvrager daarvan in kennis
      en noemt daarbij de termijn waarbinnen de beschikking tegemoet gezien kan worden. Het advies wordt met de
      subsidiebeschikking meegezonden. Wanneer het Fonds afwijkt van het advies van de commissie wordt dit besluit
      gemotiveerd.

      2 De beschikking vermeldt de hoogte van de verleende subsidie en voor welke activiteiten en voor welke periode de
      subsidieverlening geldt. In de beschikking kunnen nadere voorwaarden worden vermeld.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel11
  - number: '12'
    text: |-
      Het subsidieplafond kan per kalenderjaar verschillen en wordt voor het betreffende jaar gepubliceerd in de
      Staatscourant en op www.fppm.nl. Subsidie wordt slechts verleend voorzover de middelen van het Fonds toereikend
      zijn. Onder meer vanwege de beperkte hoeveelheid middelen kan het voorkomen dat het Fonds niet alle aanvragen kan
      honoreren of aanvragen met een positief advies niet voor het gevraagde bedrag kan honoreren. De wijze waarop het
      budget over de verschillende aanvragen wordt verdeeld ingeval van krapte, wordt tegelijk met de bekendmaking van
      het subsidieplafond bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel12
  - number: '13'
    text: |-
      Indien uw aanvraag wordt gehonoreerd gelden de subsidieverplichtingen die deel uitmaken van de Podiumregeling. Deze
      zijn opgenomen in Bijlage 1 – Subsidieverplichtingen Podiumregeling.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel13
  - number: '14'
    text: |-
      Een aanvrager kan bezwaar maken tegen een beslissing van het Fonds. Op de bezwaarschriftenprocedure is de
      [Algemene wet bestuursrecht][ref1] van toepassing. Indien een brief van het Fonds een beslissing bevat staan in de
      brief de rechtsmiddelen aangegeven.


