        artikel: '5'
  - number: '6'
    text: |-
      De subsidiabele kosten zijn:

        - de kosten (uitkoopsommen/partages) voor de risicovolle programmering;
        - kosten voor de in te zetten marketinginstrumenten;
        - kosten voor specifieke personele inzet ten behoeve van het project.

      In het plan dient aannemelijk te zijn gemaakt dat de beschikbare financiële middelen, met inbegrip van de
      financiële steun verleend door het fonds, voldoende zijn om het project uit te voeren.

      Voor zover de aanvrager voor dezelfde begrote uitgaven tevens financiële steun heeft aangevraagd bij één of meer
      andere bestuursorganen of particuliere fondsen of sponsors, doet hij daarvan mededeling in de aanvraag, onder
      vermelding van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.

      In de begroting zijn de uitkoopsommen/partageregelingen vermeld. Podia dienen reële afspraken met
      podiumkunstaanbieders te maken over de te betalen uitkoopsommen. Uitgangspunt daarbij wordt gevormd door de in de
      sector gangbare salaris- en honorariumregelingen.

      In de begroting wordt de verhouding tussen de eigen inkomsten (recettes en uitkoopsommen), sponsorgelden, bijdragen
      van particuliere fondsen, provinciale of lokale overheden en de uitvoeringskosten duidelijk beschreven.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel6
  - number: '7'
    text: |-
      Voor het indienen van aanvragen wordt gebruik gemaakt van het aanvraagformulier ‘Podiumregeling’ van het fonds. Dit
      formulier kan worden gedownload van www.fppm.nl of bij het fonds worden opgevraagd.

      De aanvraag dient in tienvoud naar het Fonds voor Podiumprogrammering en Marketing te worden gezonden onder
      vermelding ‘Aanvraag Podiumregeling’ op de envelop.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel7
  - number: '8'
    text: |-
      Subsidieaanvragen kunnen het gehele jaar worden ingediend. Het fonds behandelt ingediende aanvragen in zes
      subsidierondes per jaar. De uiterlijke indiendata van de subsidierondes worden vermeld op www.fppm.nl of zijn bij
      het fonds telefonisch op te vragen.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel8
  - number: '9'
    text: |-
      Aanvragen worden bij ontvangst getoetst op volledigheid. Aanvragers van wie het subsidieverzoek niet voldoet aan de
      [artikelen 3 tot en met 8][ref1] worden in de gelegenheid gesteld om de aanvraag binnen een termijn van twee weken
      aan te vullen. Aanvragen die dan nog niet volledig zijn worden niet in behandeling genomen.

      Het fonds maakt gebruik van commissies die adviseren over de subsidieaanvragen. Tijdens de behandeling van een
      aanvraag wordt over de voortgang daarvan geen informatie verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018858#Artikel3
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018858
        artikel: '3'
  - number: '10'
    text: |-
      De commissies beoordelen de aanvragen aan de hand van de onderstaande toetsingscriteria. Acceptatie van de aanvraag
      is afhankelijk van de mate waarin het project beantwoordt aan deze criteria:

      1. Programmering

      De programmering levert een bijdrage aan de meerjarige artistieke ontwikkeling van het podium/de podia.

      2. Marketing

      De marketingstrategie bevordert een gevarieerder en/of groter publieksbereik.

      3. Spreiding

      De programmering levert een bijdrage aan de spreiding van de podiumkunsten in Nederland of de regio.

      4. Bedrijfsvoering

      De kwaliteit van de aanvrager op het gebied van productie, organisatie en financieel beheer.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel10
  - number: 10a
    text: |-
      Voor aanvragen voor een tweede termijn gelden naast [Artikel 10][ref1] van de Podiumregeling de volgende
      toetsingscriteria:

      1. Ontwikkeling programmering en marketing:

      a. er wordt voortgebouwd op de programmeringsontwikkeling uit de oorspronkelijke aanvraag;

      b. er wordt voortgebouwd op de marketingontwikkeling of -ervaring uit de oorspronkelijke aanvraag;

      c. er wordt ingezet op een uitbreiding van doelgroepen of nieuwe doelgroepen;

      d. er is sprake van een wezenlijke uitbreiding van het circuit van podia waarop het project plaatsvindt;

      e. er is binnen het project sprake van een meer evenwichtige landelijke spreiding van het podiumkunstenaanbod.

      2. Financieel draagvlak:

      a. provincie en gemeente zijn op de hoogte van het project en van de FPPM-financiering en geven financiële
      ondersteuning aan het project of gaan dit doen tijdens of na de subsidieperiode van het FPPM;

      b. er zijn nieuwe financiers;

      c. de samenwerkingspartners dragen bij;

      d. het project biedt perspectief om na de tweede termijn verder te kunnen zonder de FPPM-subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0018858#Artikel10
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel10a
