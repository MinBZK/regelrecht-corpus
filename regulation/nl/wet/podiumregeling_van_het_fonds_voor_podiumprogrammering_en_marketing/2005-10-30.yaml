articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. fonds: de Stichting Fonds voor Podiumprogrammering en Marketing, gevestigd te Den Haag;

      b. commissie: de commissie die aan het fonds een advies uitbrengt als bedoeld in artikel 8 van de statuten van het
      Fonds voor Podiumprogrammering en Marketing gevestigd te Den Haag;

      c. podium:

        - een faciliteit bestemd voor de presentatie van podiumkunsten, of
        - een organisatie/vereniging zonder winstoogmerk, niet zijnde een podiumkunstaanbieder of impresario, die met
      regelmaat openbaar toegankelijke voorstellingen op het gebied van podiumkunsten programmeert of doet programmeren;
        - waar ‘podium’ staat kan ook ‘vereniging of koepelorganisatie van podia’ worden gelezen.

      d. klein podium: een klein podium programmeert een minimaal aantal concerten of voorstellingen per jaar volgens
      de categorieën podia zoals beschreven in de toelichting op deze regeling en voldoet aan minimaal twee van de
      onderstaande bepalingen:

        - het podium heeft een maximale capaciteit (zit- of staanplaatsen) van 300 bezoekers;
        - de organisatie bestaat merendeels uit vrijwilligers, eventueel onder leiding van een staf met enkele betaalde
      krachten;
        - het podium is een rechtspersoon waarvan statutair is vastgelegd dat het organiseren van culturele activiteiten
      tot de kerntaken behoort;

      e. podiumkunstaanbieder: de producent van podiumkunst (theater- of dansgezelschap; muziekensemble; individuele
      musici, dj’s, acteurs, dansers, performers);

      f. marketing: is de afstemming op de markt met behulp van instrumenten zoals product, promotie, prijs, plaats,
      personeel en partners.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel1
  - number: '2'
    text: |-
      Het doel van de subsidieregeling is om met subsidie podia in staat te stellen:

        - veelzijdigheid tot stand te brengen in de programmering van podiumkunsten;
        - in te zetten op het optimaal bereiken van (potentieel) publiek;
        - de programmering af te stemmen op een landelijke spreiding.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel2
  - number: '3'
    text: |-
      Een aanvrager voldoet aan de volgende verplichtingen:

      a. de aanvrager is in Nederland gevestigd;

      b. de aanvrager bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel3
  - number: '4'
    text: |-
      1 Subsidie kan worden aangevraagd door:

        - één podium namens enkele podia tezamen, of:
        - één podium tezamen met enkele podiumkunstaanbieders, of:
        - één podium namens enkele podia tezamen met één podiumkunstaanbieder, of:
        - één podium namens enkele podia tezamen met enkele podiumkunstaanbieders

      2 Samenwerking

      De samenwerking die wordt verwoord in het gezamenlijk project beantwoordt tenminste aan twee van de volgende
      voorwaarden:

      a. de programmeringsactiviteiten vinden plaats op alle (of het merendeel) van de podia van het
      samenwerkingsverband, of

      b. de samenwerkingspartners dragen bij aan de programmering, de organisatie, de financiën van het project, of

      c. de partners delen kennis en ervaring.

      3 Aanvragen van een klein podium

      In afwijking van lid 1 kunnen kleine podia een aanvraag bij het fonds indienen onder de volgende voorwaarden:

      a. één klein podium tezamen met één podiumkunstaanbieder, of:

      b. één klein podium met een plan voor de programmering in een bepaald genre met verschillende
      podiumkunstaanbieders, en:

      c. het aan te vragen bedrag per project bedraagt maximaal € 10.000 per seizoen/jaar.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel4
  - number: '5'
    text: |-
      1 Een subsidieaanvraag voldoet aan de volgende verplichtingen:

      a. De activiteiten worden in Nederland uitgevoerd in schouwburgen, multifunctionele centra, concertzalen, vlakke
      vloertheaters, op podia voor nieuwe en oude muziek, kamer-, jazz-, pop- en wereldmuziek;

      b. De gesubsidieerde activiteiten hebben een in de tijd beperkt karakter (minimaal twee en maximaal drie jaar);

      c. De activiteiten hebben betrekking op de presentatie van professioneel of semi-professioneel podiumkunstaanbod;

      d. De te programmeren voorstellingen en concerten zijn openbaar en in beginsel tegen betaling toegankelijk. Indien
      het betalen van een entree niet van toepassing is, wordt dit gemotiveerd in de projectbeschrijving.

      2 Bij de aanvraag overlegt u bij een eerste subsidieverzoek aan het fonds:

      a. een afschrift van de oprichtingsakte of statuten;

      b. een afschrift, niet ouder dan twaalf maanden, waaruit de inschrijving van de aanvrager in het geldende openbaar
      register blijkt.

      3 De overige partners in het samenwerkingsverband overleggen alleen op verzoek van het fonds:

      a. een afschrift van de oprichtingsakte of statuten;

      b. een afschrift, niet ouder dan twaalf maanden, waaruit de inschrijving van de aanvrager in het geldende openbaar
      register blijkt.
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel5
  - number: 5a
    text: |-
      1 Uitgangspunten bij aanvragen voor een tweede termijn zijn:

      a. er is maximaal één vervolgtermijn van drie jaar mogelijk;

      b. de subsidie wordt in de tweede termijn afgebouwd (tot nul na de subsidieperiode).

      2 Naast deze uitgangspunten gelden in aanvulling op [Artikel 5][ref1] van de Podiumregeling de volgende
      verplichtingen per subsidieaanvraag:

      a. Een aanvraag voor een tweede termijn subsidie is mogelijk als er sprake is van een aantoonbare artistieke of
      marketingontwikkeling die:

        - de moeite waard is om verder te ontwikkelen of een voorbeeldfunctie heeft, en
        - meer tijd nodig heeft om het project kans van slagen te geven, en
        - bij het wegvallen van de FPPM-subsidie een (te) groot risico loopt.

      b. De aanvraag voor een tweede termijn gaat vergezeld van een analyse van de eerste termijn die cijfermatig is
      onderbouwd. Deze analyse schetst een duidelijk beeld van:

        - de doelstellingen van de oorspronkelijke aanvraag;
        - de succesfactoren van het project: in welke mate zijn de doelstellingen gehaald, welke niet en waarom wel/niet.

      c. In de aanvraag voor een tweede termijn wordt een perspectief geschetst hoe de aanvrager het project na drie jaar
      zonder de FPPM-subsidie denkt voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0018858#Artikel5
    url: https://wetten.overheid.nl/BWBR0018858/2005-10-30#Artikel5a
    references:
