preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Veiligheid en Justitie;

    Gelet op artikel 4 van de Ambtenarenwet BES, de artikelen 21, eerste lid, en 33, eerste lid, van de Veiligheidswet
    BES, het Organisatiebesluit BZK 2010 en het Mandaatbesluit BZK 2009;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
  - number: 1.a
    text: '*de Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
  - number: 1.b
    text: '*directeur-generaal:* de directeur-generaal Bestuur en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
  - number: 1.c
    text: |-
      *gemandateerd korpsbeheerder:* de secretaris-generaal van het Ministerie van Veiligheid en Justitie aan wie de
      bevoegdheden van de Minister van Veiligheid en Justitie als korpsbeheerder van het korps politie Bonaire, Sint
      Eustatius en Saba en van het brandweerkorps Bonaire, Sint Eustatius en Saba zijn gemandateerd;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
  - number: 1.d
    text: '*directeur-generaal Politie:* de directeur-generaal Politie van het Ministerie van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
  - number: 1.e
    text: |-
      *bevoegdheden van het bevoegd gezag:* de bevoegdheden die bij of krachtens de [Ambtenarenwet BES][ref1] en de
      [artikelen 21][ref2] en [33 van de Veiligheidswet BES][ref3] aan het bevoegd gezag toekomen, voor wat betreft de
      ambtenaren in dienst van de Staat;


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel33
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028215
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '33'
  - number: 1.f
    text: '*politiekorps:* korps politie Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
  - number: 1.g
    text: '*brandweerkorps:* het brandweerkorps Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat gelijk
      gesteld de verlening van machtiging om in naam van de Minister handelingen te verrichten die noch een besluit noch
      een privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd [artikel 3.23, derde lid van het Organisatiebesluit BZK 2009][ref1] is de Rijksdienst Caribisch
      Nederland een organisatieonderdeel van het directoraat-generaal Bestuur en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0027412#Artikel3
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027412
        artikel: '3'
  - number: '3.2'
    text: De Rijksdienst Caribisch Nederland staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel3
  - number: '3.3'
    text: |-
      De Rijksdienst Caribisch Nederland heeft tot taak een structurele bijdrage te leveren aan de uitvoering van taken
      en rijkstaken op Bonaire, Sint Eustatius en Saba door middel van:
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel3
  - number: 3.3.a
    text: |-
      het uitvoeren van taken in opdracht van Nederlandse ministeries die op Bonaire, Sint Eustatius en Saba zelf taken
      gaan uitvoeren en het bieden van bedrijfsvoeringsondersteuning aan Nederlandse ministeries en overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel3
  - number: 3.3.b
    text: het uitvoeren van taken in opdracht van Nederlandse ministeries en (andere) overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel3
  - number: 3.3.c
    text: |-
      het optreden als loket voor taken die door Nederlandse ministeries uitgevoerd worden of die door instanties van
      andere (ei-)landen uitgevoerd worden.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd de [artikelen 1.2][ref1], [2.1][ref2], [3.2, onderdeel h][ref3], [4.1][ref4], [4.11][ref5] en
      [4.13 van het Mandaatbesluit BZK 2009][ref6] wordt aan de directeur-generaal Bestuur en Koninkrijksrelaties mandaat
      verleend ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0027413#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027413#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027413#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0027413#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0027413#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0027413#Artikel4
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027413
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027413
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027413
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0027413
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0027413
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0027413
        artikel: '4'
  - number: 4.1.a
    text: |-
      het leiden van het overleg met de Sectorale Overlegcommissie BES als bedoeld in
      [artikel 2.3 van het Besluit overlegstelsel BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 4.1.b
    text: de bevoegdheden van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
  - number: 4.1.c
    text: |-
      aangelegenheden die op het terrein van de Rijksdienst Caribisch Nederland zijn gelegen, voor zover deze
      aangelegenheden naar aard en inhoud niet een zodanig gewicht hebben dat zij door de Minister dienen te worden
      afgedaan.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
  - number: '4.2'
    text: |-
      Van het mandaat zijn uitgezonderd de bevoegdheden van het bevoegd gezag voor zover die betrekking hebben op de
      ambtenaren die zijn of worden geplaatst bij het politiekorps of het brandweerkorps.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
  - number: '4.3'
    text: |-
      Ten aanzien van de ondertekening van besluiten en stukken op grond van het mandaat van de directeur-generaal
      Bestuur en Koninkrijksrelaties is het [Mandaatbesluit BZK 2009][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027413
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027413
  - number: '4.4'
    text: |-
      De directeur-generaal is bevoegd tot het verlenen van ondermandaat van de in het eerste lid, bedoelde bevoegdheden,
      onderscheidenlijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
  - number: '4.5'
    text: |-
      Indien onder toepassing van het vierde lid, voor gevallen als bedoeld in het eerste lid, ondermandaat wordt
      verleend aan de Directeur van de Rijksdienst Caribisch Nederland is deze bevoegd, met uitzondering van
      de bevoegdheid als bedoeld in het eerste lid, onder a, tot het verlenen van ondermandaat aan de onder hem
      ressorterende functionarissen alsmede aan hoofden van departementale diensten in Caribisch Nederland, indien dit in
      de afgesloten dienstverleningsovereenkomst is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel4
  - number: '5'
    text: |-
      Onverminderd de [artikelen 2.1, met uitzondering van onderdeel k][ref1], en
      [3.2, onderdeel h, van het Mandaatbesluit BZK 2009][ref2] wordt aan de gemandateerd korpsbeheerder mandaat verleend
      ten aanzien van de bevoegdheden van het bevoegd gezag van de ambtenaren van politie van het politiekorps en van het
      brandweerkorps, voor zover deze aangelegenheden naar aard en inhoud niet een zodanig gewicht hebben dat zij door de
      Minister dienen te worden afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027413#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027413#Artikel3
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027413
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027413
        artikel: '3'
  - number: '6.1'
    text: |-
      Het mandaat, bedoeld in [artikel 5, eerste lid][ref1], strekt zich in ieder geval uit tot:


      [ref1]: https://wetten.overheid.nl/BWBR0031745#Artikel5
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031745
        artikel: '5'
        paragraaf: '4'
  - number: 6.1.a
    text: |-
      besluitvorming tot het aanstellen, het bevorderen, het schorsen, het opleggen van disciplinaire maatregelen en het
      ontslaan van ambtenaren die zijn of worden geplaatst bij politiekorps of het brandweerkorps;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
  - number: 6.1.b
    text: |-
      besluitvorming tot bezoldiging en het toekennen van vergoedingen en toelagen van ambtenaren die zijn of worden
      geplaatst bij politiekorps of het brandweerkorps;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
  - number: 6.1.c
    text: de beëdiging van ambtenaren die zijn geplaatst bij politiekorps of brandweerkorps;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
  - number: 6.1.d
    text: |-
      het voeren van functioneringsgesprekken en de daarop gebaseerde beoordelingen van de ambtenaren die zijn geplaatst
      bij politiekorps of het brandweerkorps;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
  - number: 6.1.e
    text: |-
      het toekennen en intrekken van enigerlei vorm van vakantie en verlof aan ambtenaren die zijn geplaatst bij
      politiekorps of het brandweerkorps;
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
  - number: 6.1.f
    text: |-
      het vertegenwoordigen van de Minister namens de Staat der Nederlanden in gerechtelijke procedures met betrekking
      tot een personele aangelegenheid van het politiekorps en van het brandweerkorps.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
  - number: '6.2'
    text: |-
      De gemandateerd korpsbeheerder is bevoegd, in overeenstemming met de minister van Binnenlandse Zaken en
      Koninkrijksrelaties, tot het verlenen van ondermandaat van de in [artikel 5][ref1] bedoelde bevoegdheden aan de
      directeur-generaal Politie, onderscheidenlijk tot het beperken of intrekken daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0031745#Artikel5
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031745
        artikel: '5'
        paragraaf: '4'
  - number: '6.3'
    text: |-
      De directeur-generaal Politie is bevoegd, in overeenstemming met de Minister, tot het verlenen van ondermandaat van
      de in het eerste lid, bedoelde bevoegdheden aan de korpschef van het politiekorps of de algemeen commandant van het
      brandweerkorps, onderscheidenlijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van het [Mandaatbesluit BZK 2009][ref1] vindt ondertekening van besluiten en stukken op grond van het
      mandaat aan de gemandateerd korpsbeheerder met betrekking tot de bevoegdheden van het bevoegd gezag op basis van
      dit besluit plaats op de volgende wijze: De Minister van Binnenlandse Zaken en Koninkrijksrelaties, namens deze,
      (handtekening) (naam) *Secretaris-generaal van het Ministerie van Veiligheid en Justitie*


      [ref1]: https://wetten.overheid.nl/BWBR0027413
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027413
  - number: '7.2'
    text: |-
      Voor zover op basis van [artikel 6, tweede lid][ref1], ondermandaat is verleend vindt in afwijking van het
      [Mandaatbesluit BZK 2009][ref2] ondertekening van besluiten en stukken op grond van het mandaat van de gemandateerd
      korpsbeheerder met betrekking tot de bevoegdheden van het bevoegd gezag op basis van dit besluit plaats op de
      volgende wijze: De Minister van Binnenlandse Zaken en Koninkrijksrelaties, namens deze, (handtekening) (naam)
      (functie)


      [ref1]: https://wetten.overheid.nl/BWBR0031745#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027413
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031745
        artikel: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0027413
  - number: '8.1'
    text: |-
      Het [Organisatie- en mandaatbesluit BZK-BES][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028832
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028832
  - number: '8.2'
    text: |-
      Het [Instellingsbesluit Regionaal Service Centrum BES-eilanden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024746
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024746
  - number: '9'
    text: |-
      Besluiten of handelingen van de directeur-generaal Politie, de korpschef van het politiekorps, de algemeen
      commandant van het brandweerkorps of de directeur van de Rijksdienst Caribisch Nederland ten aanzien van het
      bevoegd gezag van de ambtenaren die zijn geplaatst bij het politiekorps of het brandweerkorps, die zijn genomen
      of verricht in de periode van 14 oktober 2010 tot de datum van inwerkingtreding van dit besluit, zijn genomen of
      verricht namens de Minister.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel9
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Organisatie- en mandaatbesluit BZK-BES 2012.'
    url: https://wetten.overheid.nl/BWBR0031745/2012-07-04#Artikel11
