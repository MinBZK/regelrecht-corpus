  - number: '5.1'
    text: |-
      Als militaire terreinen die geen onderdeel vormen van het natuurnetwerk Nederland bedoeld in
      [artikel 2.10.2, tweede lid, van het besluit][ref1], worden aangewezen de in [bijlage 18][ref2] vermelde terreinen.
      De geometrische plaatsbepaling van de terreinen is vastgelegd in een GML-bestand bij deze regeling en verbeeld op
      de kaarten, behorende bij de voornoemde bijlage.


