  - number: '6.1'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag waarop het
      [Besluit algemene regels ruimtelijke ordening][ref1] in werking treedt.

      2 Indien bekendmaking van deze regeling geschiedt na de datum van bekendmaking van het tijdstip van
      inwerkingtreding van het [Besluit algemene regels ruimtelijke ordening][ref2], treedt deze regeling in afwijking
      van het eerste lid in werking met ingang van de eerste dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.


