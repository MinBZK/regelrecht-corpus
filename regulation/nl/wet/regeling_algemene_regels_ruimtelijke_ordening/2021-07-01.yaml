  - number: '2.1'
    text: |-
      1 Als militaire terreinen, bedoeld in [artikel 2.6.2, eerste lid, van het besluit][ref1], worden aangewezen de in
      [bijlage 1][ref2] vermelde terreinen.

      2 Als onveilige gebieden buiten militair terrein van schietterreinen, bedoeld in
      [artikel 2.6.2, tweede lid, van het besluit][ref3], worden aangewezen de in [bijlage 2][ref4] vermelde gebieden.

      3 Als militaire luchtvaartterreinen, bedoeld in [artikel 2.6.2, derde lid, van het besluit][ref5], worden
      aangewezen de in [bijlage 3][ref6] vermelde terreinen.

      4 Als geluidszones voor de militaire luchtvaartterreinen, bedoeld in
      [artikel 2.6.2, vierde lid, van het besluit][ref7], worden aangewezen de in [bijlage 4][ref8] vermelde zones.

      5 Als obstakelbeheergebieden voor de militaire luchtvaartterreinen, bedoeld in
      [artikel 2.6.2, vijfde lid, van het besluit][ref9], worden aangewezen de in [bijlage 5][ref10] vermelde gebieden.

      6 Als zend- en ontvangstinstallaties buiten militaire luchtvaartterreinen, bedoeld in
      [artikel 2.6.2, zesde lid, van het besluit][ref11], worden aangewezen de in [bijlage 6][ref12] vermelde
      installaties.

      7 Als bouwbeperkingengebieden rondom zend- en ontvangstinstallaties buiten militaire luchtvaartterreinen, bedoeld
      in [artikel 2.6.2, zevende lid, van het besluit][ref13], worden aangewezen de in [bijlage 7][ref14] vermelde
      gebieden.

      8 Als radarstations, bedoeld in [artikel 2.6.2, achtste lid, van het besluit][ref15], worden aangewezen de in
      [bijlage 8][ref16] vermelde radarstations.

      9 Als radarverstoringsgebied, bedoeld in [artikel 2.6.2, negende lid, van het besluit][ref17], worden aangewezen de
      in [bijlage 9][ref18] vermelde gebieden.

      10 Als begrenzingen van de laagvliegroutes voor jacht- en transportvliegtuigen, bedoeld in
      [artikel 2.6.2, tiende lid, van het besluit][ref19], worden aangewezen de in [bijlage 11][ref20] vermelde
      begrenzingen.

      11 Als munitieopslagplaatsen, bedoeld in [artikel 2.6.2, elfde lid, van het besluit][ref21], en bijbehorende
      veiligheidszones, bedoeld in [artikel 2.6.5, tweede lid, van het besluit][ref22] worden aangewezen de in
      [bijlage 12][ref23] vermelde opslagplaatsen en de in [bijlage 13][ref24] vermelde veiligheidszones.

      12 Van de in de het eerste tot en met elfde lid bedoelde terreinen, gebieden, zones en objecten zijn de
      geometrische plaatsbepalingen vastgelegd in het GML-bestand bij deze regeling en zijn de kaarten, waarop die
      plaatsbepalingen zijn verbeeld, in de in het eerste tot en met elfde lid bedoelde bijlagen opgenomen.


