  - number: '2.2'
    text: |-
      1 Bij de beoordeling van de veiligheidssituatie en het risico van de activiteiten in de veiligheidszones, bedoeld
      in [artikel 2.6.7, vijfde lid, van het besluit][ref1], worden de volgende elementen betrokken:

      a. de hoeveelheid gevaarlijke stoffen van de ADR klasse 1.1, 1.2 en 1.3 waarvoor:

      1°. een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] is verleend, of

      2°. een melding op grond van [artikel 1.10][ref3] in samenhang met
      [artikel 1.21b van het Activiteitenbesluit milieubeheer][ref4] is gedaan en een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder i, van de Wet algemene bepalingen omgevingsrecht][ref5] is verleend;

      b. de berekening van de effectzones (A-, B- en C-zone);

      c. de bestaande objecten en bestemmingen, met inbegrip van reeds toegestane ontwikkelingen, binnen de effectzones,
      bedoeld in onderdeel b.

      2 De beoordeling van de veiligheidssituatie en het risico van de activiteiten in de veiligheidszones wordt
      uitgevoerd aan de hand van de meest recente door de Minister van Infrastructuur en Milieu goedgekeurde versie van
      het hiervoor ontwikkelde softwarepakket (RISK-NL).

      3 De norm voor de acceptatie van een bestaande inbreuk is voor het plaatsgebonden risico 10-5.

      4 Bij de beoordeling van het risico wordt het groepsrisico mede in ogenschouw genomen.

      5 De risicoanalyse met de beoordeling van de risico’s wordt na goedkeuring door de minister van Infrastructuur en
      Milieu aangeboden aan burgemeester en wethouders van de betrokken gemeente.


