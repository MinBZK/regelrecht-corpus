  - number: '2.6'
    text: |-
      1 De Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur en Waterstaat, beoordeelt de
      aanvaardbaarheid van de gevolgen van het bouwwerk dan wel de windturbine voor de werking van de radar op basis van
      de eventuele overschrijding van de referentiewaarden voor de radardetectiekans in een radardetectiegebied.

      2 Als radardetectiegebied, bedoeld in het eerste lid, wordt aangemerkt:

      a. een gebied vanaf een hoogte van 1000 voet ten opzichte van het maaiveld tot een hoogte van het maximale bereik
      van de radar voor luchtverkeer dat ‘en route’ is, welk gebied heel Nederland omvat;

      b. een gebied vanaf een hoogte van 500 voet tot een hoogte van 1000 voet ten opzichte van het maaiveld in de
      omgeving van luchthavens voor naderingsverkeer, en

      c. een gebied vanaf een hoogte van 300 voet tot een hoogte van 500 voet ten opzichte van het maaiveld in de directe
      omgeving van en in het verlengde van start- en landingsbanen en van de schietrange voor jachtvliegtuigen.

      3 Voor een radardetectiegebied van een primaire radar als bedoeld in het tweede lid, onderdeel a, geldt voor de
      radardetectiekans een middelingsgebied met een straal van 500 meter.

      4 De referentiewaarde ingeval van een primaire radar voor de radardetectiekans binnen een radardetectiegebied
      voor verkeersleiding is 90% voor een object met een radardoorsnede van twee vierkante meter en met een
      doelfluctuatiemodel Swerling Model I.

      5 De referentiewaarde ingeval van een secundaire radar voor de toelaatbare afwijking in de azimuthoek als gevolg
      van obstakels, is een standaardafwijking van minder dan 0,08 graden.

      6 De referentiewaarde voor de radardetectiekans binnen een radardoorsnede voor gevechtsleiding is niet openbaar.

      7 De Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur en Waterstaat, kan in
      bijzondere omstandigheden afwijken van de in het eerste tot en met het zesde lid opgenomen regels.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: '3.1'
    text: |-
      1 Als reserveringsgebied ten behoeve van de mogelijke uitbreiding van een hoofdweg of delen daarvan, bedoeld in
      [artikel 2.7.2, eerste lid, van het besluit][ref1], worden aangewezen de in [bijlage 16][ref2] aangewezen gebieden
      bij de in die bijlage genoemde hoofdwegen.

      2 Als reserveringsgebied ten behoeve van de mogelijke aanleg van een nieuwe hoofdweg of landelijke spoorweg,
      bedoeld in [artikel 2.7.3, eerste lid, van het besluit][ref3], worden aangewezen de in [bijlage 17][ref4]
      aangewezen gebieden.


