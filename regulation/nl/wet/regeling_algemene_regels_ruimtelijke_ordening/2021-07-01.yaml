  - number: 2.4.1
    text: |-
      De maximale hoogte van bouwwerken in een radarverstoringsgebied wordt bepaald door elke denkbeeldige rechte lijn
      die wordt getrokken vanaf een punt op de top van de radarantenne, waarvan de hoogteligging ten opzichte van NAP
      is opgenomen in [bijlage 8][ref1], oplopend met 0,25 graden tot een punt gelegen 15 kilometer vanaf voornoemde
      radarantenne.


      [ref1]: https://wetten.overheid.nl/BWBR0031018
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0031018
  - number: 2.4.2
    text: |-
      Onverminderd het eerste lid geldt voor de tippen van de wieken van windturbines een maximale hoogte in een
      radarverstoringsgebied, die wordt bepaald door elke denkbeeldige, ten opzichte van NAP horizontale rechte
      lijn, die wordt getrokken van het uiterste punt van de lijn, bedoeld in het eerste lid, tot een punt gelegen
      60 kilometer daar vandaan. De resulterende maximale hoogte voor de tippen van de wieken van windturbines is per
      radarverstoringsgebied opgenomen in [bijlage 10][ref1] en tezamen met de omvang van het radarverstoringsgebied
      verbeeld op de kaart in [bijlage 8.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031018
      [ref2]: https://wetten.overheid.nl/BWBR0031018
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0031018
      - id: ref2
        bwb_id: BWBR0031018
  - number: 2.4.3
    text: 'De toepassing van het eerste en tweede lid wordt schematisch als volgt weergegeven:'
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.4
  - number: 2.5.1
    text: |-
      De mate waarin het radarbeeld wordt verstoord door bouwwerken dan wel windturbines die de maximale hoogte, bedoeld
      in [artikel 2.4, eerste, onderscheidenlijk tweede lid][ref1], overschrijden, wordt neergelegd in een rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0031018#Artikel2
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0031018
        artikel: '2'
        paragraaf: '2'
  - number: 2.5.2
    text: 'Het rapport bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
  - number: 2.5.2.a
    text: contactgegevens van de gemeente die het bestemmingsplan voorbereidt;
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
  - number: 2.5.2.b
    text: een omschrijving van het bouwwerk of de windturbine en de locatie waar deze is voorzien;
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
  - number: 2.5.2.c
    text: |-
      de voor de berekening van de verstoring van het radarbeeld relevante gegevens van het bouwwerk of de windturbine,
      waaronder de technische maten en contouren daarvan;
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
  - number: 2.5.2.d
    text: een berekening van de mate waarin het radarbeeld wordt verstoord.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
  - number: 2.5.3
    text: |-
      De gemeente die het bestemmingsplan voorbereidt, zorgt ervoor dat het rapport, bedoeld in het eerste lid, ter
      beoordeling aan de Minister van Defensie en waar nodig aan de Minister van Infrastructuur en Waterstaat wordt
      voorgelegd.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
  - number: 2.5.4
    text: |-
      De Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur en Waterstaat, beoordeelt de
      toereikendheid van het rapport en de aanvaardbaarheid van de gevolgen van het bouwwerk dan wel de windturbine
      voor de werking van de radar. de Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur
      en Waterstaat, deelt de uitkomst van de beoordeling mee aan burgemeester en wethouders van de gemeente, die het
      betreffende bestemmingsplan voorbereidt.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.5
  - number: 2.6.1
    text: |-
      De Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur en Waterstaat, beoordeelt de
      aanvaardbaarheid van de gevolgen van het bouwwerk dan wel de windturbine voor de werking van de radar op basis van
      de eventuele overschrijding van de referentiewaarden voor de radardetectiekans in een radardetectiegebied.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.2
    text: 'Als radardetectiegebied, bedoeld in het eerste lid, wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.2.a
    text: |-
      een gebied vanaf een hoogte van 1000 voet ten opzichte van het maaiveld tot een hoogte van het maximale bereik van
      de radar voor luchtverkeer dat ‘en route’ is, welk gebied heel Nederland omvat;
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.2.b
    text: |-
      een gebied vanaf een hoogte van 500 voet tot een hoogte van 1000 voet ten opzichte van het maaiveld in de omgeving
      van luchthavens voor naderingsverkeer, en
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.2.c
    text: |-
      een gebied vanaf een hoogte van 300 voet tot een hoogte van 500 voet ten opzichte van het maaiveld in de directe
      omgeving van en in het verlengde van start- en landingsbanen en van de schietrange voor jachtvliegtuigen.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Voor een radardetectiegebied van een primaire radar als bedoeld in het tweede lid, onderdeel a, geldt voor de
      radardetectiekans een middelingsgebied met een straal van 500 meter.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.4
    text: |-
      De referentiewaarde ingeval van een primaire radar voor de radardetectiekans binnen een radardetectiegebied
      voor verkeersleiding is 90% voor een object met een radardoorsnede van twee vierkante meter en met een
      doelfluctuatiemodel Swerling Model I.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.5
    text: |-
      De referentiewaarde ingeval van een secundaire radar voor de toelaatbare afwijking in de azimuthoek als gevolg van
      obstakels, is een standaardafwijking van minder dan 0,08 graden.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.6
    text: De referentiewaarde voor de radardetectiekans binnen een radardoorsnede voor gevechtsleiding is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 2.6.7
    text: |-
      De Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur en Waterstaat, kan in bijzondere
      omstandigheden afwijken van de in het eerste tot en met het zesde lid opgenomen regels.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.6
  - number: 3.1.1
    text: |-
      Als reserveringsgebied ten behoeve van de mogelijke uitbreiding van een hoofdweg of delen daarvan, bedoeld in
      [artikel 2.7.2, eerste lid, van het besluit][ref1], worden aangewezen de in [bijlage 16][ref2] aangewezen gebieden
      bij de in die bijlage genoemde hoofdwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031018
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031018
  - number: 3.1.2
    text: |-
      Als reserveringsgebied ten behoeve van de mogelijke aanleg van een nieuwe hoofdweg of landelijke spoorweg, bedoeld
      in [artikel 2.7.3, eerste lid, van het besluit][ref1], worden aangewezen de in [bijlage 17][ref2] aangewezen
      gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031018
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031018
  - number: '4.1'
    text: |-
      Als voorkeurstracés met aan weerszijden daarvan een zoekgebied als bedoeld in
      [artikel 2.9.2, eerste lid, van het besluit][ref1], worden aangewezen de tracés en zoekgebieden die zijn opgenomen
      in [bijlage 19][ref2]. De geometrische plaatsbepaling van de voorkeurstracés en zoekgebieden is vastgelegd in een
      GML-bestand bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031018
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031018
  - number: '5.1'
    text: |-
      Als militaire terreinen die geen onderdeel vormen van het natuurnetwerk Nederland bedoeld in
      [artikel 2.10.2, tweede lid, van het besluit][ref1], worden aangewezen de in [bijlage 18][ref2] vermelde terreinen.
      De geometrische plaatsbepaling van de terreinen is vastgelegd in een GML-bestand bij deze regeling en verbeeld op
      de kaarten, behorende bij de voornoemde bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031018
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031018
  - number: 6.1.1
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop het
      [Besluit algemene regels ruimtelijke ordening][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
  - number: 6.1.2
    text: |-
      Indien bekendmaking van deze regeling geschiedt na de datum van bekendmaking van het tijdstip van inwerkingtreding
      van het [Besluit algemene regels ruimtelijke ordening][ref1], treedt deze regeling in afwijking van het eerste lid
      in werking met ingang van de eerste dag na dagtekening van de Staatscourant waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
  - number: '6.2'
    text: 'Deze regeling wordt aangehaald als: Regeling algemene regels ruimtelijke ordening.'
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel6.2
