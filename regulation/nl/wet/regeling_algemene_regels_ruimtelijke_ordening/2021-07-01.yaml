  - number: '2.5'
    text: |-
      1 De mate waarin het radarbeeld wordt verstoord door bouwwerken dan wel windturbines die de maximale hoogte,
      bedoeld in [artikel 2.4, eerste, onderscheidenlijk tweede lid][ref1], overschrijden, wordt neergelegd in een
      rapport.

      2 Het rapport bevat ten minste de volgende gegevens:

      a. contactgegevens van de gemeente die het bestemmingsplan voorbereidt;

      b. een omschrijving van het bouwwerk of de windturbine en de locatie waar deze is voorzien;

      c. de voor de berekening van de verstoring van het radarbeeld relevante gegevens van het bouwwerk of de
      windturbine, waaronder de technische maten en contouren daarvan;

      d. een berekening van de mate waarin het radarbeeld wordt verstoord.

      3 De gemeente die het bestemmingsplan voorbereidt, zorgt ervoor dat het rapport, bedoeld in het eerste lid, ter
      beoordeling aan de Minister van Defensie en waar nodig aan de Minister van Infrastructuur en Waterstaat wordt
      voorgelegd.

      4 De Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur en Waterstaat, beoordeelt
      de toereikendheid van het rapport en de aanvaardbaarheid van de gevolgen van het bouwwerk dan wel de windturbine
      voor de werking van de radar. de Minister van Defensie, waar nodig in overleg met de Minister van Infrastructuur
      en Waterstaat, deelt de uitkomst van de beoordeling mee aan burgemeester en wethouders van de gemeente, die het
      betreffende bestemmingsplan voorbereidt.


      [ref1]: https://wetten.overheid.nl/BWBR0031018#Artikel2.4
