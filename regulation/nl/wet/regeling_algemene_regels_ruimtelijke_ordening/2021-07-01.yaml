  - number: 2.2.2
    text: |-
      De beoordeling van de veiligheidssituatie en het risico van de activiteiten in de veiligheidszones wordt uitgevoerd
      aan de hand van de meest recente door de Minister van Infrastructuur en Milieu goedgekeurde versie van het hiervoor
      ontwikkelde softwarepakket (RISK-NL).
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.2
  - number: 2.2.3
    text: De norm voor de acceptatie van een bestaande inbreuk is voor het plaatsgebonden risico 10-5.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.2
  - number: 2.2.4
    text: Bij de beoordeling van het risico wordt het groepsrisico mede in ogenschouw genomen.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.2
  - number: 2.2.5
    text: |-
      De risicoanalyse met de beoordeling van de risico’s wordt na goedkeuring door de minister van Infrastructuur en
      Milieu aangeboden aan burgemeester en wethouders van de betrokken gemeente.
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.2
  - number: '2.3'
    text: |-
      Als civiele inrichtingen voor activiteiten met explosieven, bedoeld in
      [artikel 2.6.2, twaalfde lid, van het besluit][ref1], en bijbehorende veiligheidszones, bedoeld in
      [artikel 2.6.6 van het besluit][ref2] worden aangewezen de in [bijlage 14][ref3] vermelde begrenzingen en de in
      [bijlage 15][ref4] vermelde veiligheidszones, waarvan de geometrische plaatsbepaling is vastgelegd in het GML-
      bestand bij deze regeling en waarvan in voornoemde bijlage de kaarten waarop die plaatsbepalingen zijn verbeeld,
      zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031018
      [ref4]: https://wetten.overheid.nl/BWBR0031018
    url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#Artikel2.3
