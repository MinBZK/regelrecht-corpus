  - number: '2.4'
    text: |-
      1 De maximale hoogte van bouwwerken in een radarverstoringsgebied wordt bepaald door elke denkbeeldige rechte lijn
      die wordt getrokken vanaf een punt op de top van de radarantenne, waarvan de hoogteligging ten opzichte van NAP
      is opgenomen in [bijlage 8][ref1], oplopend met 0,25 graden tot een punt gelegen 15 kilometer vanaf voornoemde
      radarantenne.

      2 Onverminderd het eerste lid geldt voor de tippen van de wieken van windturbines een maximale hoogte in een
      radarverstoringsgebied, die wordt bepaald door elke denkbeeldige, ten opzichte van NAP horizontale rechte
      lijn, die wordt getrokken van het uiterste punt van de lijn, bedoeld in het eerste lid, tot een punt gelegen
      60 kilometer daar vandaan. De resulterende maximale hoogte voor de tippen van de wieken van windturbines is per
      radarverstoringsgebied opgenomen in [bijlage 10][ref2] en tezamen met de omvang van het radarverstoringsgebied
      verbeeld op de kaart in [bijlage 8.4][ref3].

      3 De toepassing van het eerste en tweede lid wordt schematisch als volgt weergegeven:


