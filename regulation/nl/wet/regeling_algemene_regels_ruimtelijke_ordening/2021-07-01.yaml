    Handelende in overeenstemming met de Minister van Defensie,

    Gelet op de artikelen 2.6.2, 2.6.5 en 2.6.6 van het Besluit algemene regels ruimtelijke ordening;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031018/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *besluit:* [Besluit algemene regels ruimtelijke ordening][ref1];
        - *bijlage:* bij deze regeling behorende [bijlage][ref2];
        - *GML-bestand bij deze regeling:* elektronisch geografisch databestand dat is opgemaakt in Geography Markup
      Language en is gepubliceerd via www.ruimtelijkeplannen.nl, met kenmerk: a. NL.IMRO.0000.IMmr11Rarro-3000, of b.
      NL.IMRO.0000.IMmr11Rarro-3005, of c. NL.IMRO.0000.IMmr11Rarro-3010, of d. NL.IMRO.0000.IMmr11Rarro-3015, of e.
      NL.IMRO.0000.IMmr11Rarro-3020, of f. NL.IMRO.0000.IMmr11Rarro-3025, of g. NL.IMRO.0000.IMmr11Rarro-3030, of h.
      NL.IMRO.0000.IMmr11Rarro-3035, of i. NL.IMRO.0000.BZKmr11Rarro-3040, of j. NL.IMRO.0000.BZKmr11Rarro-3045, of k.
      NL.IMRO.0000.BZKmr11Rarro-3050, of l. NL.IMRO.0000.BZKmr11Rarro-3055.
        - *middelingsgebied:* cirkelvormig gebied op variabele locatie in een radardetectiegebied waarbinnen de berekende
      detectiekansen worden gemiddeld;
        - *primaire radar:* radar die voor het waarnemen van luchtvaartuigen niet afhankelijk is van door het luchtvaartuig
      met een transponder uitgezonden signalen;
        - *radardetectiegebied:* gebied waarbinnen een minimale radardetectiekans is vereist;
        - *radardetectiekans:* kans dat een object met een bepaalde radardoorsnede en radardoorsnedefluctuatie onder vaste
      omgevingscondities wordt gedetecteerd door een primaire radar;
        - *radardoorsnede:* effectieve oppervlaktemaat van een object voor het reflecteren van radiogolven in dezelfde
      richting als waar zij vandaan komen;
        - *radarrekenmodel:* rekenmodel voor het bepalen van verstoring van radars, dat voor primaire radars is beschreven
      in het rapport Radar and Radar Environment Modeling in PERSEUS, de verstoring van secundaire radars wordt
      vastgesteld door middel van een Off Boresight Error (OBE) berekening;
        - *radarverstoringsgebied:* gebied waar beperkingen gelden ten aanzien van bestemmingsplannen ten behoeve van een
      goede werking van de radar op het radarstation;
        - *secundaire radar:* radar die voor het waarnemen van luchtvaartuigen afhankelijk is van door het luchtvaartuig
      met een transponder uitgezonden signalen;
        - *Swerling Model:* mathematisch model waarmee de statistische variaties van de radardoorsnede wordt beschreven.


