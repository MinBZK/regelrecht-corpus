valid_from: '2005-12-24'
bwb_id: BWBR0010448
url: https://wetten.overheid.nl/BWBR0010448/2005-12-24
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderregeling subsidiëring natuurprojecten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      b. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      c. ooi: vrouwelijk schaap dat ten minste één keer heeft gelammerd of ten minste één jaar oud is.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel1
  - number: '2'
    text: |-
      Aanvragen tot subsidieverlening voor projecten, bedoeld in
      [artikel 2 van de Kaderregeling subsidiëring natuurprojecten][ref1], kunnen worden ingediend voor het thema
      ‘Natuurbeheer schaapskuddes’.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel2
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '2'
  - number: '4'
    text: |-
      Subsidie kan worden verstrekt voor projecten die een bijdrage leveren aan een doelmatig beheer door middel van
      gehoede schaapskuddes in natuurterreinen of op dijken.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel4
  - number: '5'
    text: De subsidie wordt verleend voor een tijdvak van één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel5
  - number: '6'
    text: |-
      1 Voor subsidieverlening komen uitsluitend in aanmerking projecten als bedoeld in [artikel 4][ref1] die voldoen aan
      de volgende voorwaarden:

      a. de kudde wordt ten minste gedurende de periode van 15 april tot 15 september gehoed door een herder, met
      gebruik van een of meer honden, gedurende ten minste 5 uren per dag, met uitzondering van perioden met extreme
      omstandigheden;

      b. de kudde bestaat uit ten minste 100 ooien;

      c. de kudde wordt gehoed in natuurterreinen of op dijken.

      2 Het begrazingsplan, bedoeld in het eerste lid, onderdeel d, omvat ten minste:

      a. een aanduiding van de eigenaar of beheerder van het terrein of de terreinen die begraasd worden;

      b. een topografische kaart met schaal 1:10.000 waarop het te begrazen gebied en de daar voorkomende vegetatietypen
      zijn aangegeven;

      c. de doelstellingen ten aanzien van het natuurbeheer;

      d. het aantal en het soort schapen waarmee, en de perioden waarin begrazing plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0010448#Artikel4
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010448
        artikel: '4'
  - number: '7'
    text: |-
      Voor subsidie komen in aanmerking:

      a. een gemeente;

      b. een stichting die ingevolge haar statutaire doelstelling activiteiten verricht ten behoeve van de instandhouding
      van schaapskuddes;

      c. een eigenaar van overige particuliere kuddes die aan de voorwaarden van [artikel 6][ref1] voldoen;

      die in 2005 een aanvraag als bedoeld in [artikel 10][ref2] hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0010448#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010448#Artikel10
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010448
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010448
        artikel: '10'
  - number: '8'
    text: |-
      De subsidie bedraagt per schaapskudde per jaar:

      a. voor kuddes tot 250 ooien: € 16.000,–;

      b. voor kuddes vanaf 250 ooien: € 28.000,–.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel8
  - number: '9'
    text: Aanvragen tot subsidieverlening worden ingediend vóór 1 mei van het jaar waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel9
  - number: '10'
    text: |-
      In afwijking van [artikel 6 van de Kaderregeling subsidiëring natuurprojecten][ref1] gaat een aanvraag tot
      verlening van subsidie vergezeld van:

      a. een afschrift van het begrazingsplan, bedoeld in [artikel 6, eerste lid, onderdeel d][ref2];

      b. bescheiden, waaruit blijkt dat voldaan is aan de voorwaarden, genoemd in
      [artikel 6, eerste lid, onderdeel a tot en met c][ref3], en

      c. een verklaring van de eigenaar of beheerder van het terrein of de terreinen, waaruit blijkt dat hij instemt met
      de begrazing.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010448#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0010448#Artikel6
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010448
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0010448
        artikel: '6'
  - number: '11'
    text: |-
      1 Een aanvraag tot subsidieverlening wordt gericht aan de minister en ingediend bij Dienst Regelingen.

      2 Bij de aanvraag wordt gebruik gemaakt van het daarvoor beschikbare aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel11
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit natuurbeheer schaapskuddes.'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel13
