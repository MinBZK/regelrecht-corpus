---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_natuurbeheer_schaapskuddes
regulatory_layer: WET
publication_date: '2006-12-21'
valid_from: '2005-12-24'
bwb_id: BWBR0010448
url: https://wetten.overheid.nl/BWBR0010448/2005-12-24
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderregeling subsidiëring natuurprojecten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel1
  - number: 1.a
    text: 'Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel1
  - number: 1.b
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel1
  - number: 1.c
    text: 'ooi: vrouwelijk schaap dat ten minste één keer heeft gelammerd of ten minste één jaar oud is.'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel1
  - number: '2'
    text: |-
      Aanvragen tot subsidieverlening voor projecten, bedoeld in
      [artikel 2 van de Kaderregeling subsidiëring natuurprojecten][ref1], kunnen worden ingediend voor het thema
      ‘Natuurbeheer schaapskuddes’.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel2
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '2'
  - number: '4'
    text: |-
      Subsidie kan worden verstrekt voor projecten die een bijdrage leveren aan een doelmatig beheer door middel van
      gehoede schaapskuddes in natuurterreinen of op dijken.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel4
  - number: '5'
    text: De subsidie wordt verleend voor een tijdvak van één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel5
  - number: '6.1'
    text: |-
      Voor subsidieverlening komen uitsluitend in aanmerking projecten als bedoeld in [artikel 4][ref1] die voldoen aan
      de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0010448#Artikel4
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010448
        artikel: '4'
  - number: 6.1.a
    text: |-
      de kudde wordt ten minste gedurende de periode van 15 april tot 15 september gehoed door een herder, met
      gebruik van een of meer honden, gedurende ten minste 5 uren per dag, met uitzondering van perioden met extreme
      omstandigheden;
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: 6.1.b
    text: de kudde bestaat uit ten minste 100 ooien;
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: 6.1.c
    text: de kudde wordt gehoed in natuurterreinen of op dijken.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: '6.2'
    text: 'Het begrazingsplan, bedoeld in het eerste lid, onderdeel d, omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: 6.2.a
    text: een aanduiding van de eigenaar of beheerder van het terrein of de terreinen die begraasd worden;
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: 6.2.b
    text: |-
      een topografische kaart met schaal 1:10.000 waarop het te begrazen gebied en de daar voorkomende vegetatietypen
      zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: 6.2.c
    text: de doelstellingen ten aanzien van het natuurbeheer;
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: 6.2.d
    text: het aantal en het soort schapen waarmee, en de perioden waarin begrazing plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel6
  - number: '7'
    text: 'Voor subsidie komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel7
  - number: 7.a
    text: een gemeente;
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel7
  - number: 7.b
    text: |-
      een stichting die ingevolge haar statutaire doelstelling activiteiten verricht ten behoeve van de instandhouding
      van schaapskuddes;
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel7
  - number: 7.c
    text: |-
      een eigenaar van overige particuliere kuddes die aan de voorwaarden van [artikel 6][ref1] voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0010448#Artikel6
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010448
        artikel: '6'
  - number: '8'
    text: 'De subsidie bedraagt per schaapskudde per jaar:'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel8
  - number: 8.a
    text: 'voor kuddes tot 250 ooien: € 16.000,–;'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel8
  - number: 8.b
    text: 'voor kuddes vanaf 250 ooien: € 28.000,–.'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel8
  - number: '9'
    text: Aanvragen tot subsidieverlening worden ingediend vóór 1 mei van het jaar waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel9
  - number: '10'
    text: |-
      In afwijking van [artikel 6 van de Kaderregeling subsidiëring natuurprojecten][ref1] gaat een aanvraag tot
      verlening van subsidie vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel6
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '6'
  - number: 10.a
    text: |-
      een afschrift van het begrazingsplan, bedoeld in [artikel 6, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010448#Artikel6
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010448
        artikel: '6'
  - number: 10.b
    text: |-
      bescheiden, waaruit blijkt dat voldaan is aan de voorwaarden, genoemd in
      [artikel 6, eerste lid, onderdeel a tot en met c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010448#Artikel6
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010448
        artikel: '6'
  - number: 10.c
    text: |-
      een verklaring van de eigenaar of beheerder van het terrein of de terreinen, waaruit blijkt dat hij instemt met
      de begrazing.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel10
  - number: '11.1'
    text: Een aanvraag tot subsidieverlening wordt gericht aan de minister en ingediend bij Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel11
  - number: '11.2'
    text: Bij de aanvraag wordt gebruik gemaakt van het daarvoor beschikbare aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel11
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit natuurbeheer schaapskuddes.'
    url: https://wetten.overheid.nl/BWBR0010448/2005-12-24#Artikel13
