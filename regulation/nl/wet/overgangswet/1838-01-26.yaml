preamble:
  text: |-
    Wij WILLEM, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg, enz.,
    enz., enz.

    Allen den genen, die deze zullen zien, of hooren lezen, salut! doen te weten:

    Alzoo Wij hebben in overweging genomen, dat, ten einde verkeerde uitleggingen en twistgedingen te voorkomen, welke
    door den overgang der vroegere tot de nieuwe wetgeving zouden kunnen geboren worden, het doelmatig is, om, bij eene
    transitoire wet, verordeningen vasttestellen, geschikt om den twijfel te doen ophouden, welke ten aanzien van deze
    en gene punten van wetgeving zoude kunnen ontstaan;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal,

    Hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan te bepalen, hetgeen volgt:
  url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De veranderingen, welke ten gevolge der nieuwe wetboeken in de burgerlijke wetgeving zijn te weeg gebragt, hebben
      geen invloed op de regten, welke onder vroegere wetgevingen waren verkregen.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel1
  - number: '2'
    text: |-
      De geldigheid der handelingen, wat haren vorm betreft, wordt beoordeeld naar de wetten welke van kracht waren op
      het tijdstip waarop die handelingen hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel2
  - number: '3'
    text: |-
      De regten uit overeenkomsten voortvloeijende, worden geregeld door de wetten welke in werking waren toen die
      overeenkomsten zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel3
  - number: '4'
    text: |-
      De regten uit uiterste wilsbeschikkingen voortvloeijende, welke vóór de invoering van het nieuwe burgerlijk wetboek
      zijn gemaakt, worden naar dat wetboek geregeld, indien na deszelfs in werking brenging de erflater is overleden.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel4
  - number: '5'
    text: |-
      Alle personen, die vóór den dag der invoering van het nieuwe burgerlijk wetboek hunne meerderjarigheid hebben
      verkregen, blijven meerderjarig, en zullen tot alle handelingen hoegenaamd, dezelfde bekwaamheid hebben, als of zij
      den vollen ouderdom van 23 jaren hadden bereikt.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel5
  - number: '6'
    text: |-
      Jonge dochters welke bij de invoering der Nederlandsche wetgeving den ouderdom van vijftien jaren hebben bereikt
      blijven ook na die invoering de bevoegdheid behouden om een huwelijk aan te gaan.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel6
  - number: '7'
    text: |-
      Minderjarigen, die vóór den dag der invoering van het nieuwe burgerlijk wetboek den ouderdom van 16 jaren hebben
      bereikt, blijven de bevoegdheid behouden hun bij artikel 904 van het Wetboek Napoleon gegeven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel7
  - number: '8'
    text: |-
      Minderjarigen voor de invoering van het nieuwe burgerlijk wetboek gehuwd, worden op den dag van die invoering
      meerderjarig.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel8
  - number: '9'
    text: |-
      De regten van minderjarigen die ingevolge de bepalingen van artikel 477 en volgende van het Wetboek Napoleon
      geëmancipeerd zijn, worden geregeld naar dat wetboek.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel9
  - number: '10'
    text: |-
      1 Meerderjarigen aan welke, ingevolge de bepalingen van den elfde titel van het eerste boek van het Wetboek
      Napoleon een geregtelijke raadsman is toegevoegd, blijven ook na de invoering der nieuwe wetgeving dien raadsman op
      denzelfde voet behouden.

      2 Het wordt echter aan den regter overgelaten om daartoe gronden vindende op daartoe gedane vordering, de
      geregtelijke adsistentie door het stellen onder curatele te vervangen. De vordering daartoe moet gedaan worden met
      in achtneming der voorschriften daartoe bij het nieuwe wetboek gegeven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel10
  - number: '11'
    text: |-
      Ten aanzien van personen, uit kracht van het besluit van den 12. Februarij 1815 (*Staatsblad* no. 25),
      geconfineerd, doch welke niet onder voogdij zijn gesteld of aan welke geen geregtelijke raadsman is toegevoegd, zal
      na de invoering der Nederlandsche wetgeving nog éénmaal prolongatie van confinement mogen verleend worden, indien
      daartoe gronden zijn, zonder dat er vooraf in hunne curatele zal behoeven te worden voorzien, mits de vordering
      daartoe gedaan worde, binnen zes maanden na die invoering.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel11
  - number: '12'
    text: |-
      Allen, die op den dag der invoering van het nieuw burgerlijk wetboek en naar aanleiding van art. 353 van het
      wetboek Napoléon, ten overstaan van den vrederegter eene akte van adoptie hebben verleden, kunnen, gedurende den
      tijd van een jaar na die invoering voortgaan met de akten, volgens het wetboek Napoléon, tot de adoptie vereischt;
      en zal alzoo, indien daartoe termen zijn, de adoptie plaats hebben.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel12
  - number: '13'
    text: |-
      Indien vóór de invoering van het nieuw burgerlijk wetboek, en naar aanleiding van art. 361 en 363 van het wetboek
      Napoléon, iemand op eene wettige wijze officieuse voogd is geworden, zullen al de bepalingen, vervat bij het tweede
      hoofdstuk van den 8sten titel van hetzelve wetboek toepasselijk zijn, zoo wel op den pupil als op den officieusen
      voogd.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel13
  - number: '14'
    text: |-
      De wettelijke hypotheken ten behoeve van getrouwde vrouwen, minderjarige, en andere onder voogdij gestelde
      personen, onafhankelijk van alle inschrijving onder de Fransche wetgeving ontstaan, het zij dezelve op de oude
      registers zijn ingeschreven of niet, zullen binnen twee jaren na de invoering der Nederlandsche wetgeving op de
      nieuwe registers worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel14
  - number: '15'
    text: |-
      1 Deze inschrijving zal niet mogen zijn algemeen op de goederen binnen den kring van het kantoor van den hypotheek-
      bewaarder gelegen, maar zij zal de bijzondere aanduiding moeten bevatten van den aard en van de ligging der
      goederen, waarop de hypotheek is gevestigd.

      2 Geene andere goederen dan die, welke bij de inschrijving bepaaldelijk zijn aangewezen, zullen door de hypotheek
      worden getroffen.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel15
  - number: '16'
    text: |-
      De borderellen zullen zijn ingerigt overeenkomstig het bepaalde bij artikel 2153 van het Wetboek Napoleon, doch met
      inachtneming tevens van de voorschriften van artikel 1231, no. 4, van het Burgerlijk Wetboek ; zij houden tevens
      in: de naam, de voornaam, en de qualiteit van den persoon, door wien de inschrijving wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel16
  - number: '17'
    text: |-
      Het bepaalde bij artikel 1232 van het nieuw Burgerlijk Wetboek is op de inschrijving dezer hypotheken van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel17
  - number: '18'
    text: |-
      1 Zij wordt genomen door de mans of door de voogden, wier goederen met deze hypotheken zijn bezwaard.

      2 De toeziende voogden zullen zorgen dat dezelve plaats hebbe, of des noods, zelve inschrijving nemen, op straffe
      van vergoeding van kosten, schaden en interessen, zoo daartoe gronden zijn.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel18
  - number: '19'
    text: |-
      Zij kan insgelijks worden genomen door de bloedverwanten van de vrouw of van de minderjarigen of andere onder
      voogdij gestelden en door de vrouw zelve, ook zonder dat deze daartoe door haren man is gemagtigd en ook door den
      minderjarigen zelf.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel19
  - number: '20'
    text: |-
      Indien binnen den tijd, bij [artikel 14][ref1] bepaald, geene inschrijving ten behoeve der minderjarigen of onder
      voogdij gestelden is genomen, zal zulks alsnog, met inachtneming der bepalingen van [artikel 15][ref2], [16][ref3]
      en [17][ref4] gedurende zes maanden van ambtswege kunnen geschieden door den officier bij de arrondissements-
      regtbank of door den kanton-regter zoo van de woonplaats van den voogd, als van de ligging der goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001834#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001834#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0001834#Artikel17
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '14'
        hoofdstuk: Vierde
      - id: ref2
        bwb_id: BWBR0001834
