      - id: ref4
        bwb_id: BWBR0001834
        artikel: '17'
        hoofdstuk: Vierde
  - number: '21'
    text: |-
      Ten gevolge der inschrijving op de bovengemelde wijze gedaan binnen den termijn bij [artikel 14][ref1] en
      [20][ref2] bepaald, blijft op de goederen, waarop dezelve is genomen, het regt van wettelijke hypotheken benevens
      de rang bij de Fransche Wetgeving toegekend, verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001834#Artikel20
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '14'
        hoofdstuk: Vierde
      - id: ref2
        bwb_id: BWBR0001834
        artikel: '20'
        hoofdstuk: Vierde
  - number: '22'
    text: |-
      De hierboven vermelde wettelijke hypotheken, welke niet binnen dien bepaalden tijd zijn ingeschreven, zullen van
      geene kracht zijn, dan te rekenen van den dag waarop die inschrijving later zal hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel22
  - number: '23'
    text: |-
      De bepalingen van artikel 391 en 397 van het nieuwe burgerlijk wetboek zijn op de hierboven vermelde hypotheken ten
      behoeven van minderjarigen en andere onder voogdij gestelde personen van toepassing.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel23
  - number: '24'
    text: |-
      Zoolang de inschrijving der hypotheken niet is geschied, is de voogd insgelijks bevoegd om overeenkomstig de
      voorschriften van artikel 390 van het nieuw burgerlijk wetboek zekerheid te stellen voor zijn beheer. Indien de
      voogd van die bevoegdheid gebruik maakt, zullen de artikelen 393, 394 en 395 van het nieuw burgerlijk wetboek van
      toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel24
  - number: '25'
    text: |-
      1 Het regt van wettelijk hypotheek der getrouwde vrouwen en der minderjarigen of andere onder voogdij gestelde
      personen blijft onafhankelijk van inschrijving, overeenkomstig de fransche wetgeving, stand houden, en wel dat der
      getrouwde vrouwen tot na den afloop van den termijn bij [artikel 14][ref1], en dat der minderjarige of andere onder
      voogdij gestelde personen tot na den afloop van dien bij [art. 20][ref2] voorgeschreven.

      2 Deze bepaling is ook van toepassing op de goederen, die na de invoering van het nieuwe Burgerlijk Wetboek doch
      vóór den afloop der hiervoren bepaalde termijnen zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001834#Artikel20
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '14'
        hoofdstuk: Vierde
      - id: ref2
        bwb_id: BWBR0001834
        artikel: '20'
        hoofdstuk: Vierde
  - number: '26'
    text: |-
      De bepalingen van artikel 2193, 2194 en 2195 van het Wetboek Napoleon, waarbij de wijze van zuivering dezer
      hypotheken is geregeld, blijven toepasselijk op de vervreemdingen welke, van de zijde der mans of voogden tot dien
      tijd toe zullen hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel26
  - number: '27'
    text: |-
      De voor de invoering der Nederlandsche wetgeving op de thans bestaande registers gedane inschrijvingen der
      wettelijke hypotheken aan den staat, de gemeenten en openbare stichtingen toegekend, mitsgaders die der
      geregtelijke hypotheken zullen ten gevolge dier inschrijving op de bestaande registers van kracht blijven,
      gedurende twee jaren, te rekenen van den dag dier invoering.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel27
  - number: '28'
    text: |-
      Iedere belanghebbende zal binnen voorgeschreven termijn, de inschrijving op de nieuwe registers kunnen vorderen,
      van de in het vorige artikel vermelde hypotheken, welke voor de invoering der Nederlandsche wetgeving op de
      bestaande registers zullen zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel28
  - number: '29'
    text: |-
      1 De bepalingen van [artikel 15][ref1] zijn toepasselijk op de inschrijving der hypotheken in [artikel 27][ref2]
      vermeld.

      2 De borderellen voor de inschrijving der wettelijke hypotheken in [artikel 27][ref3] bedoeld, moeten zijn ingerigt
      overeenkomstig de bepalingen van [artikel 16][ref4].

      3 Die voor de inschrijving der geregtelijke hypotheken, moeten zijn ingerigt overeenkomstig de voorschriften van
      art. 1231 van het nieuwe Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001834#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001834#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0001834#Artikel16
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '15'
        hoofdstuk: Vierde
      - id: ref2
        bwb_id: BWBR0001834
        artikel: '27'
        hoofdstuk: Vierde
      - id: ref3
        bwb_id: BWBR0001834
        artikel: '27'
        hoofdstuk: Vierde
      - id: ref4
        bwb_id: BWBR0001834
        artikel: '16'
        hoofdstuk: Vierde
  - number: '30'
    text: |-
      Ten gevolge der inschrijving op de bovengemelde wijze binnen den termijn bij [artikel 27][ref1] vermeld, gedaan,
      blijft op de goederen waarop dezelve is genomen het regt van wettelijke of geregtelijke hypotheek benevens de rang
      bij de Fransche wetgeving toegekend, verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel27
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '27'
        hoofdstuk: Vierde
  - number: '31'
    text: |-
      Wanneer de nieuwe inschrijving eerst na den termijn in [art. 27][ref1] vermeld, gedaan wordt, heeft de hypotheek
      slechts kracht en rang van den dag waarop die nieuwe inschrijving zal zijn geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel27
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '27'
        hoofdstuk: Vierde
  - number: '32'
    text: Het bepaalde bij art. 1232 van het nieuwe Burgerlijk Wetboek is op de nieuwe inschrijving van toepassing.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel32
  - number: '33'
    text: |-
      De wettelijke hypotheken in [artikel 27][ref1] vermeld, waarvan het regt reeds vroeger was geboren, doch welke
      voor de invoering der Nederlandsche wetgeving nog niet zijn ingeschreven, zullen op de nieuwe registers, doch na
      de voorschriften van het Wetboek Napoleon worden ingeschreven, met inachtneming echter van het vastgestelde bij
      [artikel 15][ref2] en [16][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001834#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001834#Artikel16
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '27'
        hoofdstuk: Vierde
      - id: ref2
        bwb_id: BWBR0001834
        artikel: '15'
        hoofdstuk: Vierde
      - id: ref3
        bwb_id: BWBR0001834
        artikel: '16'
        hoofdstuk: Vierde
  - number: '34'
    text: |-
      De privilegien en geregtelijke hypotheken, waarvan het regt reeds vroeger was geboren, doch die voor de invoering
      der Nederlandsche wetgeving nog niet waren ingeschreven, mitsgaders de conventionele hypotheken reeds vroeger
      verleend, doch waarvan de inschrijving voor die invoering nog niet was gedaan, zullen op de nieuwe registers, naar
      de voorschriften dier wetgeving moeten worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel34
  - number: '35'
    text: |-
      De inschrijvingen der hypotheken, welke volgens de Fransche wet voor inkorting vatbaar waren, kunnen, zoo daartoe
      gronden zijn, worden ingekort overeenkomstig de bepalingen van artikel 2161 en volgende van het Wetboek Napoleon.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel35
  - number: '36'
    text: |-
      1 De inschrijvingen der hypotheken, bij de tegenwoordige wet bedoeld, met uitzondering van die, in
      [artikel 33][ref1] en [34][ref2] vermeld, zullen geschieden zonder betaling van andere regten dan het loon van den
      hypotheek-bewaarder.

      2 De borderellen kunnen geschreven worden op ongezegeld papier.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0001834#Artikel34
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '33'
        hoofdstuk: Vierde
      - id: ref2
        bwb_id: BWBR0001834
        artikel: '34'
        hoofdstuk: Vierde
  - number: '37'
    text: |-
      De bewaarders van het kadaster zijn verpligt om de voor de belanghebbenden, tot de uitvoering dezer wet, noodige
      inzage hunner registers en andere stukken, aan hen kosteloos te verleenen, en hun tevens die inlichtingen te geven,
      welke zij zullen behoeven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel37
  - number: '38'
    text: |-
      De regten van echtelieden, vóór de invoering van het nieuw burgerlijk wetboek getrouwd, worden ten opzigten
      van hunne goederen geregeld volgens de wetten, welke op het oogenblik van het huwelijk in werking waren, of
      volgens hunne niet bij die wetten verboden huwelijksche voorwaarden, om het even op welk tijdstip het huwelijk
      is ontbonden.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel38
  - number: '39'
    text: |-
      1 Echtgenooten voor de invoering van het nieuwe Burgerlijk Wetboek gehuwd, kunnen na die invoering niet meer bij
      onderlinge toestemming hun huwelijk doen ontbinden.

      2 Indien niettemin de echtgenooten uit krachte van het vastgestelde bij artikel 281 van het Wetboek Napoleon, reeds
      voor den regter mogten zijn verschenen, kan die echtscheiding worden vervolgd, en uitgesproken, overeenkomstig de
      voorschriften van dat Wetboek en met dezelfde gevolgen.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel39
  - number: '40'
    text: |-
      Daden, welke volgens het Wetboek Napoleon eene bepaalde oorzaak tot echtscheiding, of tot scheiding van tafel en
      bed opleveren, doch bij het nieuwe burgerlijk wetboek niet als zoodanig zijn aangemerkt zullen ofschoon zij vóór
      de invoering der Nederlandsche wetgeving mogten zijn gepleegd echter na dat tijdstip geenen grond tot echtscheiding
      of tot scheiding van tafel en bed kunnen opleveren, ten ware te dier zake reeds onder de Fransche Wetgeving of zes
      maanden na de invoering der Nederlandsche, een regtsgeding ware aangevangen, of zelfs nog maar een verzoekschrift
      te dien einde aan den president der regtbank van eersten aanleg ware ingediend.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel40
  - number: '41'
    text: |-
      Daden, welke bij het nieuwe burgerlijk wetboek eene bepaalde oorzaak tot echtscheiding of tot scheiding van
      tafel en bed opleveren, doch als zoodanig, in de Fransche Wetgeving onbekend waren, zullen geene echtscheiding
      of scheiding van tafel en bed ten gevolge kunnen hebben, indien zij vóór de invoering der Nederlandsche wetgeving
      hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel41
  - number: '42'
    text: |-
      Niettemin kan de echtscheiding wegens kwaadwillige verlating welke onder de Fransche Wetgeving is aangevangen door
      de verlatene echtgenoot worden gevorderd na verloop van vijf jaren, na de invoering der Nederlandsche wetgeving.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel42
  - number: '43'
    text: |-
      Indien onder de werking van het Wetboek Napoleon of ook onder die van de Nederlandsche wetgeving, doch ten gevolge
      van een reeds voor hare invoering aangevangen rechtsgeding eene scheiding van tafel en bed is uitgesproken, zal aan
      den verweerder ook onder de Nederlandsche wetgeving de bevoegdheid blijven toekomen in artikel 310 van het Wetboek
      Napoleon gegeven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel43
  - number: '44'
    text: |-
      De bepalingen der artikelen 549, 550 en 551 van het nieuw burgerlijk wetboek, betreffende de ontbinding des
      huwelijks ten gevolge van afwezigheid, zijn toepasselijk ook op het geval dat de aldaar bedoelde afwezigheid reeds
      geheel of ten deele onder de werking van vroegere wetgevingen mogt hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel44
  - number: '45'
    text: |-
      In al de gevallen, waarin de lijfsdwang bij de nieuwe wetgeving niet is bijgehouden, zal dezelve, na de invoering
      van het nieuwe wetboek van burgerlijke regtspleging niet kunnen worden ten uitvoer gelegd, dan alleen, wanneer de
      lijfsdwang vóór die invoering door den regter uitgesproken of wettelijk door partijen bedongen mogt zijn.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel45
  - number: '46'
    text: |-
      Ten aanzien van het ontslag uit de gijzeling zijn van toepassing de wetten, welke van kracht waren, op het
      tijdstip, waarop de lijfsdwang is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel46
  - number: '47'
    text: |-
      De bewijsmiddelen zullen worden aangenomen of niet toegelaten, naar mate der bepalingen, welke van kracht waren op
      het tijdstip dat de regten en verpligtingen zouden zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel47
  - number: '48'
    text: |-
      Testamenten eene vaste dagteekening hebbende en door twee of meerdere personen in dezelfde akte, wettiglijk
      gemaakt vóór de invoering der wetten, waarbij die vorm van uiterste wilsbeschikkingen is verboden, en onder de
      Nederlandsche wetgeving met den dood bekrachtigd blijven, ten aanzien van dien vorm, van kracht.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel48
  - number: '49'
    text: |-
      1 Allen, die overeenkomstig de voorschriften van het wetboek Napoléon, olographische testamenten hebben gemaakt
      vóór de invoering van het burgerlijk wetboek, en verlangen mogten, dat dezelve van kracht blijven, zullen verpligt
      zijn dezelve, met uitzondering van die, vermeld bij artikel 982 van het Burgerlijk Wetboek, binnen het jaar na
      die invoering, naar aanleiding van de bepalingen van het nieuwe Burgerlijk Wetboek, aan een notaris in bewaring te
      geven; zullende bij gebreke van dien, zoodanige testamenten alleen van kracht zijn, indien de erflater overleden is
      binnen het jaar na die invoering.

      2 Olographische testamenten, welke onder het Wetboek Napoleon gemaakt, doch niet op de voorschreven wijze onder
      bewaring gesteld zijn, zullen nogthans daardoor niet krachteloos worden, wanneer de personen, door welke die
      testamenten zijn gemaakt, bij de invoering der nieuwe wetgeving, of binnen het jaar na die invoering, door
      krankzinnigheid of andere overmagt, tot de vereischte bewaargeving buiten staat geraakt zijn.

      3 Van deze bepalingen zijn uitgezonderd de beschikkingen vermeld bij artikel 982 van het nieuwe burgerlijk wetboek.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel49
  - number: '50'
    text: |-
      De bepaling van art. 1 van het decreet van den 24sten Januari 1812, betrekkelijk de erfstellingen over de hand, zal
      van kracht blijven in dat gedeelte van het Koningrijk waar hetzelve is executoir verklaard.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel50
  - number: '51'
    text: |-
      De regtsvordering tot tenietdoening, ter zake eener benadeeling in een verkoop, welke vóór de invoering van de
      Nederlandsche wetgeving mogt hebben plaats gehad, zal worden beoordeeld overeenkomstig de wetsbepalingen, welke van
      kracht waren op het tijdstip waarop de koop gesloten is.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel51
  - number: '53'
    text: |-
      De twistgedingen, welke op het oogenblik der invoering van het wetboek op de burgerlijke regtspleging aanhangig
      zijn, zullen worden voortgezet volgens de vormen bij dat wetboek voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel53
  - number: '54'
    text: |-
      1 De burgerlijke twistgedingen, op het oogenblik der instelling van de hoven en regtbanken aanhangig bij de
      afgeschafte hoven, regtbanken en vredegeregten, zullen door middel van eene enkele akte aan den persoon of ter
      zijner woonstede beteekend, worden overgebragt bij de regters, welke volgens de wet op de regterlijke organisatie
      en het beleid der justitie bevoegd zijn daarvan kennis te nemen om op de laatste dingtalen te worden voortgezet.

      2 Niettemin zullen de zaken, welke bij de regtbanken van eersten aanleg of van Koophandel aanhangig zijn en volgens
      de aangehaalde wet tot de bevoegdheid van den kantons-regter zouden behooren, door de arrondissements-regtbanken
      worden beslist.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel54
  - number: '55'
    text: |-
      1 De op datzelfde tijdstip onbesliste criminele, correctionele en policie-zaken, zullen worden overgebragt bij den
      regter, welke daartoe bevoegd is, naar aanleiding der wet op de regterlijke organisatie en het beleid der justitie.

      2 De bepaling van het laatste lid van het voorgaand artikel is ook op de reeds aanhangige correctionele zaken
      toepasselijk.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel55
  - number: '56'
    text: |-
      1 Na de invoering van het nieuwe [Wetboek van Strafvordering][ref1], zijn de voorschriften van dat wetboek ten
      aanzien van de wijze waarop de beleedigde partij schadevergoeding mogt vorderen voor het nadeel haar door een
      misdrijf toegebragt, ook toepasselijk op misdrijven, voor die invoering gepleegd.

      2 Indien echter reeds voor dien tijd de beleedigde partij zich ingevolge de voorschriften van het fransche regt,
      civiele partij had gesteld, zal de regtsvordering over de schadevergoeding voor den regter in strafzaken worden
      voortgezet, om het even of deze ingevolge de bepalingen van het nieuwe wetboek al dan niet bevoegd is daarvan
      kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '57'
    text: |-
      1 Het regt tot appel en cassatie van bij de invoering der regterlijke organisatie reeds aanhangige zaken wordt
      geregeld naar de vroegere wetten.

      2 De cassatien zullen gebragt worden bij den hoogen raad.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel57
  - number: '58'
    text: |-
      De arresten in burgerlijke zaken, vóór de invoering van de wet op de regterlijke organisatie, gewezen door het hoog
      geregtshof te 's-Gravenhage, zijn, volgens het besluit van den 11den December 1813, voor geen beroep in cassatie
      vatbaar.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel58
  - number: '59'
    text: |-
      De vonnissen, in het hoogste ressort gewezen door de regtbanken van eersten aanleg en de vrederegters in het
      ressort van dat hoog geregtshof, en welke vallen in de termen van art. 20 van voorsz. besluit, kunnen bij den
      hoogen raad worden overgebragt, indien de termijn niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel59
  - number: '60'
    text: |-
      Onverminderd de werkzaamheden bij de wet op de regterlijke organisatie, aan de kantons-regters opgedragen, zullen
      zij ook waarnemen hetgeen bij bijzondere wetten en verordeningen op dit oogenblik tot de werkzaamheden behoort van
      de vrederegters.
    url: https://wetten.overheid.nl/BWBR0001834/1838-01-26#Artikel60
