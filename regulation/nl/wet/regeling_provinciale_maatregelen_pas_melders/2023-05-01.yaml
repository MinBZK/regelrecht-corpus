  - number: '10'
    text: |-
      1 De provincie legt verantwoording af over de besteding van de uitkering op de wijze bepaald in
      [artikel 17a van de Financiële-verhoudingswet][ref1].

      2 De minister stelt de uitkering ambtshalve vast binnen 22 weken na ontvangst van de eindverantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
