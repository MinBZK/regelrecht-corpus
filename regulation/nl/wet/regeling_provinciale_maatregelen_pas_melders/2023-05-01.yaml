    text: |-
      1 Deze regeling treedt in werking met ingang van 1 mei 2023.

      2 Deze regeling vervalt met ingang van de eerste dag van het zesde jaar na haar inwerkingtreding, met dien
      verstande dat zij van toepassing blijft op aanvragen die zijn ingediend voor 31 augustus 2023.
