  - number: '2'
    text: |-
      1 De minister kan aan een provincie op aanvraag een specifieke uitkering verstrekken voor maatregelen die met
      voldoende zekerheid een oplossing bieden voor gemelde PAS-projecten.

      2 Per provincie kan één uitkering worden verstrekt.

      3 De uitkering kan alleen worden verstrekt voor de kosten van verplichtingen die door de provincie zijn aangegaan
      in de periode vanaf 4 augustus 2022 tot en met 31 augustus 2023 ten behoeve van maatregelen die uiterlijk
      28 februari 2025 zijn afgerond.

      4 De uitkering wordt niet verstrekt voor:

      a. uitvoeringskosten als bedoeld in de
      [Regeling specifieke uitkering voorbereidingskosten landelijk gebied, versnellingsvoorstellen en PAS-melders][ref1]
      ;

      b. de financiering van omzetbelasting als:

      1°. de provincie voor compensatie hiervan in aanmerking komt op grond van de
      [Wet op het BTW-compensatiefonds][ref2]; of

      2°. de provincie in verband met de besteding van de uitkering als ondernemer wordt aangemerkt in de zin van de
      [Wet op de omzetbelasting 1968][ref3];

      c. kosten waarvoor al uit anderen hoofde een uitkering of subsidie is of wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0047505
      [ref2]: https://wetten.overheid.nl/BWBR0013817
      [ref3]: https://wetten.overheid.nl/BWBR0002629
