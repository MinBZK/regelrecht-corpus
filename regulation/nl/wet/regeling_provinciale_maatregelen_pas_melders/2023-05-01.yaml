  - number: '8'
    text: |-
      1 Voor zover de uitkering door de provincie is aangewend voor de koop van goederen, stelt de provincie de Minister
      in één keer voor de hele uitkering, uiterlijk 15 juli 2028 gelijktijdig met de jaarlijkse verantwoording, bedoeld
      in [artikel 10, eerste lid][ref1], in kennis van de opbrengst- of restwaarde van die goederen.

      2 De restwaarde van de betrokken goederen blijkt uit een daarbij door de provincie verstrekt rapport dat is
      opgesteld door een onafhankelijke taxateur.

      3 Uiterlijk gelijktijdig met de in het eerste lid bedoelde kennisgeving verstrekt de provincie de Minister een
      vergoeding van 100% van de in het eerste lid bedoelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0048054#Artikel10
    url: https://wetten.overheid.nl/BWBR0048054/2023-05-01#Artikel8
