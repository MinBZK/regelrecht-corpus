  - number: '4'
    text: |-
      1 De uitkering kan worden aangevraagd tot en met 31 augustus 2023, 17:00 uur.

      2 De aanvraag bevat in ieder geval:

      a. de hoogte van de gevraagde uitkering, waaruit blijkt welk deel de btw betreft;

      b. de data waarop de provincie de betrokken verplichtingen is aangegaan;

      c. een beschrijving van de getroffen of voorgenomen maatregelen, inclusief de bijbehorende berekeningen met AERIUS
      Calculator en de waarde van de betrokken ondernemingen waarvoor de meldingen zijn gedaan;

      d. een beschrijving van de door de provincie aangegane verplichtingen en een verklaring dat bewijsmiddelen daarvan
      aanwezig zijn, zoals een gesloten koopovereenkomst of een gegeven beschikking tot subsidieverlening;

      e. een verklaring dat de provincie voldoet aan de verplichtingen, bedoeld in [artikel 6][ref1].

      3 De aanvraag wordt ingediend met gebruikmaking van een door de Minister ter beschikking

      gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0048054#Artikel6
    url: https://wetten.overheid.nl/BWBR0048054/2023-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0048054
        artikel: '6'
  - number: '5'
    text: |-
      1 De minister geeft binnen zes weken na het indienen van de aanvraag een beschikking omtrent verlening van de
      uitkering.

      2 De beschikking tot verlening van de uitkering vermeldt in elk geval de wijze van verantwoording over de besteding
      van de uitkering.

      3 De minister verleent bij de beschikking tot verlening een voorschot van 100% van het uitkeringsbedrag en betaalt
      dat voorschot uiterlijk op 31 december 2023.
    url: https://wetten.overheid.nl/BWBR0048054/2023-05-01#Artikel5
  - number: '6'
    text: |-
      1 De provincie spant zich in om de middelen te besteden op de meest kostenefficiënte wijze per gemeld PAS-project.

      2 De provincie besteedt voor het bieden van een oplossing voor een gemeld PAS-project niet meer middelen dan de
      waarde van de onderneming waarvoor de melding is gedaan, met een maximum van € 3.500.000, zoals bepaald door een
      onafhankelijke taxateur.

      3 De provincie houdt bij de besteding van de middelen rekening met haar in ontwikkeling zijnde programma voor de
      gebiedsgerichte aanpak voor natuur, inclusief stikstof, water en klimaat.
    url: https://wetten.overheid.nl/BWBR0048054/2023-05-01#Artikel6
  - number: '7'
    text: |-
      1 De uitkering wordt zodanig besteed dat geen sprake is van ongeoorloofde verlening van staatssteun.

      2 Voor zover de uitkering door de provincie wordt aangewend voor de koop van goederen, wordt de waarde van die
      goederen bepaald door een onafhankelijke taxateur.

      3 De provincie informeert de Minister op verzoek over de voortgang van de maatregelen waarvoor de uitkering is
      verstrekt.

      4 De provincie zorgt ervoor dat de verkregen depositieruimte die zij niet vóór 28 februari 2025 gebruikt voor
      de in [artikel 2, eerste lid][ref1], bedoelde maatregelen, beschikbaar blijft om te worden opgenomen in het
      register, bedoeld in [artikel 2.3 van de Regeling natuurbescherming][ref2], dan wel, na inwerkingtreding van de
      [Omgevingswet][ref3], [artikel 17a.4, eerste lid, van de Omgevingsregeling][ref4].

      5 De minister kan in de beschikking tot verlening verplichtingen opleggen over de wijze van vastlegging van de
      gegevens die zijn gebruikt bij het in kaart brengen van de effecten van de maatregelen waarvoor de uitkering is
      verstrekt.

      6 De minister kan in de beschikking tot verlening andere verplichtingen opleggen in het belang van het legaliseren
      van de projecten, bedoeld in [artikel 1.13a, eerste lid, van de Wet natuurbescherming][ref5], dan wel, na de
      inwerkingtreding van de [Omgevingswet][ref6], [artikel 22.21, eerste lid, van die wet][ref7].


