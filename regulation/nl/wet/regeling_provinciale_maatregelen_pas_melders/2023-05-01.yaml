        artikel: '10'
  - number: '9'
    text: |-
      1 De minister kan voor een beoordeling van de juistheid van de informatie die is verstrekt bij de indiening van
      aanvragen op grond van deze regeling gebruikmaken van de daarvoor noodzakelijke gegevens die zijn opgenomen in
      registraties op grond van de [Meststoffenwet][ref1], de [Wet dieren][ref2] en de [Landbouwwet][ref3].

      2 De minister kan gegevens die in het kader van deze regeling zijn verstrekt, ook verwerken voor:

      a. het opnemen van depositieruimte in het register, bedoeld in
      [artikel 2.3 van de Regeling natuurbescherming][ref4], dan wel, na inwerkingtreding van de [Omgevingswet][ref5],
      [artikel 17a.4, eerste lid, van de Omgevingsregeling][ref6];

      b. de toepassing van de [artikelen 1.12f][ref7], [1.13b][ref8] en [1.13c van de Wet natuurbescherming][ref9]
      en de [artikelen 2.2][ref10], [2.3][ref11] en [2.4 van het Besluit natuurbescherming][ref12], dan
      wel, na inwerkingtreding van de [Omgevingswet][ref13]: [artikel 20.1, eerste lid, van die wet][ref14],
      de [artikelen 11.68][ref15], [11.69][ref16], [11.69a][ref17], [11.69c][ref18], [12.26b][ref19]
      en [12.26c van het Besluit kwaliteit leefomgeving][ref20] en de [artikelen 10.36dc][ref21] en
      [15.5 van het Omgevingsbesluit][ref22].


