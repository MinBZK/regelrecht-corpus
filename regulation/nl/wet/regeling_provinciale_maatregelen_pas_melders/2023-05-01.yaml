preamble:
  text: |-
    Gelet op de artikelen 2a, eerste lid, onder d, en 3 van de Kaderwet EZK- en LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0048054/2023-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *gemeld PAS-project:* a. tot de inwerkingtreding van de [Omgevingswet][ref1]: project dat
      voldoet aan de voorwaarden van [artikel 2.8b van de Regeling natuurbescherming][ref2]; b. na de
      inwerkingtreding van de [Omgevingswet][ref3]: Natura 2000-activiteit die voldoet aan de voorwaarden van
      [artikel 17a.8 van de Omgevingsregeling][ref4];
        - *minister:* Minister voor Natuur en Stikstof;
        - *onafhankelijke taxateur:* taxateur die is ingeschreven in de van toepassing zijnde Kamer van het Nederlands
      Register Vastgoed Taxateurs.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2.8b
      [ref3]: https://wetten.overheid.nl/BWBR0037885
      [ref4]: https://wetten.overheid.nl/BWBR0045528#Artikel17a.8
