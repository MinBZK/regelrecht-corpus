    Gelet op artikel 52, eerste lid, van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004214/2003-03-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaren belast met het toezicht op de naleving van de [Diergeneesmiddelenwet][ref1] en de daarop berustende
      bepalingen worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0004214/2003-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '1.1'
    text: de ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij;
    url: https://wetten.overheid.nl/BWBR0004214/2003-03-20#Artikel1
  - number: '1.2'
    text: 'de ambtenaren van de Voedsel en Waren Autoriteit van het Ministerie van Volksgezondheid, Welzijn en Sport:'
    url: https://wetten.overheid.nl/BWBR0004214/2003-03-20#Artikel1
  - number: '1.3'
    text: |-
      de ambtenaren van de Inspectie Gezondheidszorg van het Ministerie van Volksgezondheid, Welzijn
      en Sport voor zover het betreft het toezicht op de naleving van het bepaalde bij of krachtens
      [hoofdstuk III van de Diergeneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004214/2003-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: III
  - number: '2'
    text: |-
      Deze beschikking treedt in werking met ingang van de tweede dag volgend op die van haar bekendmaking in de
      Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004214/2003-03-20#Artikel2
