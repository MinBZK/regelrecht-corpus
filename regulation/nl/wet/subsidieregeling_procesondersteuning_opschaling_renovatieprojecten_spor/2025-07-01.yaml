  - number: '11'
    text: |-
      1 De aanvraag tot subsidievaststelling wordt ingediend door de penvoerder van het samenwerkingsverband met
      gebruikmaking van een door de minister elektronisch beschikbaar gesteld formulier op de website van Rijksdienst
      voor Ondernemend Nederland.

      2 Een aanvraag tot subsidievaststelling bevat ten minste:

      a. indien van toepassing, de wijziging van gegevens van deelnemers binnen het samenwerkingsverband ten opzichte van
      de beschikking tot subsidieverlening, waaronder de naam, het post- en bezoekadres en eventueel de nummers waaronder
      de ondernemingen zijn geregistreerd bij de Kamer van Koophandel;

      b. indien van toepassing, gegevens van een nieuwe penvoerder, waaronder de naam, het post- en bezoekadres, het e-
      mailadres, het telefoonnummer en het bankrekeningnummer of nummers waarop het resterende subsidiebedrag dient te
      worden overgemaakt;

      c. indien van toepassing, gegevens van een nieuwe procesondersteuner waaronder de naam, adres en het nummer
      waaronder de procesondersteuner of de onderneming waar hij werkzaam is geregistreerd bij de Kamer van Koophandel;

      d. de omvang van de vast te stellen subsidie;

      e. bij een wijziging van penvoerder, een machtigingsformulier waaruit blijkt dat de penvoerder gemachtigd is te
      handelen namens de woningeigenaren die deelnemen aan het samenwerkingsverband.

      3 Onverminderd [artikel 24, eerste, tweede en derde lid, van het Kaderbesluit][ref1] gaat de aanvraag tot
      subsidievaststelling vergezeld van het geaccordeerde verduurzamingsplan waarin in ten minste is opgenomen:

      a. per woning binnen het renovatieproject van het samenwerkingsverband: adres en naam van de eigenaar;

      b. een gespecificeerde begroting, die inzicht geeft in de geraamde uitgaven voor de activiteiten en de
      energiebesparende isolatiemaatregelen van het renovatieproject;

      c. een tijdsplanning van het uitvoeren van het renovatieproject;

      d. een getekende offerte of offertes voor alle woningen van het samenwerkingsverband, van een bouwbedrijf of
      bouwbedrijven die de energiebesparende isolatiemaatregelen van het renovatieproject uitvoeren met daarin ten
      minste de meldcode voor het isolatiemateriaal dat gebruikt is en bijhorende oppervlakte, en indien er geen meldcode
      beschikbaar is gesteld: een omschrijving van het soort energiebesparende isolatiemaatregel met de naam, het type,
      het merk, de dikte, Rd-waarde van het isolatiemateriaal dat gebruikt is; en

      e. een evaluatie van het proces tot het komen van het verduurzamingsplan.

      4 In afwijking van het derde lid kan, indien het samenwerkingsverband na de beschikking tot subsidieverlening
      niet of niet binnen de gestelde termijn tot overeenstemming komen over een verduurzamingsplan, een aanvraag tot
      vaststelling van ten hoogste het voorschot worden ingediend. Deze aanvraag bevat ten minste:

      a. een schriftelijke verklaring met argumentatie van de procesondersteuner en penvoerder waarom het
      samenwerkingsverband niet tot een verduurzamingsplan is gekomen;

      b. een concept verduurzamingsplan en een korte rapportage van de procesondersteuner en penvoerder welke
      activiteiten er zijn verricht in de poging om tot een geaccordeerd verduurzamingsplan te komen; en

      c. een overzicht van de kosten die zijn gemaakt door de procesondersteuner voor het samenwerkingsverband onderbouwd
      met facturen en betaalbewijzen.


