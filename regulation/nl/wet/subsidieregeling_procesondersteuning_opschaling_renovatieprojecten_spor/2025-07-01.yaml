  - number: '9'
    text: |-
      1 De subsidieontvanger is verplicht:

      a. Voor 64 uur, of 32 uur indien de procesondersteuner eerder heeft deelgenomen aan het programma Verbouwstromen
      dan wel bij renovatieprojecten met minder dan 50 woningen, verdeeld over 24 maanden na de beschikking tot
      subsidieverlening de procesondersteuner van het samenwerkingsverband deel te laten nemen aan het programma
      Verbouwstromen;

      b. het verduurzamingsplan op te stellen binnen 24 maanden na de beschikking tot subsidieverlening;

      c. de in het kader van de subsidieverlening gevoerde administratie te bewaren tot tien belastingjaren na de datum
      van de beschikking tot subsidievaststelling;

      d. bij eventuele wijzigingen in het samenwerkingsverband één jaar na het ontvangen van de beschikking tot
      subsidieverlening met een nieuw machtiging- en intentieformulier aan tonen dat het samenwerkingsverband gewijzigd,
      uitgebreid of gereduceerd is; en

      e. één jaar na het ontvangen van de beschikking tot subsidieverlening een voortgangsverslag van de
      procesondersteuner op te sturen waarin wordt aangetoond dat de procesondersteuner bezig is met het opstellen van
      het verduurzamingsplan.

      2 Indien het opstellen van het verduurzamingsplan binnen de termijn, genoemd in het eerste lid, onderdeel b, buiten
      de schuld van de subsidieontvanger niet mogelijk is, kan de minister die termijn op schriftelijk en gemotiveerd
      verzoek van de subsidieontvanger eenmaal met ten hoogste zes maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0048856/2025-07-01#Artikel9
  - number: '10'
    text: |-
      1 Bij de verstrekking van een subsidie op grond van deze regeling van meer dan € 125.000 is
      [artikel 17 van het Kaderbesluit][ref1] van toepassing.

      2 De minister verleent bij het besluit tot subsidieverlening een voorschot van € 25.000.


