  text: |-
    Gelet op artikelen 3, eerste en tweede lid, en 4, eerste lid, van de Kaderwet overige BZK-subsidies en de artikelen
    6, vierde lid, 8, 11, 14, 20 en 21, onderdeel h, van het Kaderbesluit BZK-subsidies;

