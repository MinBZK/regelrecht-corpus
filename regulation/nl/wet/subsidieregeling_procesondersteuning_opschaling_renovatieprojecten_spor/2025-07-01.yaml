  - number: '6'
    text: |-
      1 De aanvraag voor subsidieverlening wordt door de penvoerder van het samenwerkingsverband, in de periode van
      13 november 2023 tot en met 30 september 2026 ingediend, met gebruikmaking van een door de minister elektronisch
      beschikbaar gesteld formulier op de website van Rijksdienst voor Ondernemend Nederland.

      2 De aanvraag bevat onverminderd [artikel 11, derde lid, van het Kaderbesluit][ref1] in ieder geval de volgende
      gegevens en verklaringen:

      a. gegevens van de deelnemers binnen het samenwerkingsverband, waaronder de naam, het post- en bezoekadres en
      eventueel de nummers waaronder de ondernemingen zijn geregistreerd bij de Kamer van Koophandel;

      b. gegevens over de penvoerder, waaronder de naam, het post- en bezoekadres, het e-mailadres, het telefoonnummer en
      het bankrekeningnummer of nummers waarop het subsidiebedrag dient te worden overgemaakt;

      c. de naam en adres van de procesondersteuner en het nummer waaronder de procesondersteuner of de onderneming waar
      hij werkzaam is geregistreerd bij de Kamer van Koophandel;

      d. een schatting van het aantal woningen en het adres van die beoogde woningen voor het renovatieproject binnen het
      samenwerkingsverband ten behoeve waarvan subsidie wordt aangevraagd;

      e. een machtiging- en intentieformulier waaruit blijkt dat de penvoerder gemachtigd is te handelen namens de
      woningeigenaren die deelnemer zijn aan het samenwerkingsverband;

      f. het CV en de ondertekende offerte van de procesondersteuner;

      g. een mijlpalenplanning; en

      h. twee door de minister beschikbaar gestelde ondertekende referentieformulieren over de procesondersteuner,
      waaruit blijkt dat die aantoonbare ervaring in de collectieve verduurzaming van de gebouwde omgeving of bestaande
      woningen heeft.

      3 Een aanvraag als bedoeld in het eerste lid bevat naast de gegevens en bescheiden, bedoeld in het tweede lid,
      tevens een verklaring per eigenaar van een of meerdere huurwoningen, waaruit blijkt dat deze begunstigde van
      staatssteun niet meer steun ontvangt dan is toegestaan op grond van de de-minimisverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel11
