  - number: '7'
    text: |-
      1 Het subsidiebedrag voor een samenwerkingsverband met een verduurzamingsplan voor ten minste 100 huurwoningen en
      minimaal twee woningeigenaren bedraagt € 75.000 plus € 1.000 per extra koopwoning of € 750 per extra huurwoning
      binnen het samenwerkingsverband, tot een maximum totaalbedrag van € 200.000.

      2 Het subsidiebedrag voor een samenwerkingsverband met een verduurzamingsplan voor ten minste 30 koopwoningen
      bedraagt € 30.000 plus € 1.000 per extra koopwoning of € 750 per extra huurwoning binnen het samenwerkingsverband,
      tot een maximum totaalbedrag van € 200.000.

      3 Het subsidiebedrag voor een samenwerkingsverband met een verduurzamingsplan voor ten minste 100 huurwoningen en
      minimaal 30 koopwoningen bedraagt € 105.000 plus € 1.000 per extra koopwoning of € 750 per extra huurwoning binnen
      het samenwerkingsverband, tot een maximum totaalbedrag van € 200.000.
    url: https://wetten.overheid.nl/BWBR0048856/2025-07-01#Artikel7
  - number: '8'
    text: |-
      De minister beslist afwijzend op een deel of de gehele aanvraag voor subsidie indien:

      a. een deelnemer aan het samenwerkingsverband, het samenwerkingsverband of de penvoerder reeds subsidie heeft
      ontvangen voor de kosten voor een procesondersteuner voor een woning in het renovatieproject op grond van deze
      regeling;

      b. reeds met het renovatieproject of het opstellen van het verduurzamingsplan is begonnen;

      c. gegronde redenen bestaan om aan te nemen dat de activiteiten waarvoor subsidie wordt aangevraagd niet of niet
      geheel zullen worden uitgevoerd of het samenwerkingsverband of de procesondersteuner niet of naar verwachting niet
      geheel zal voldoen aan de verplichtingen;

      d. de mijlpalenplanning niet realistisch uitgevoerd kan worden;

      e. de aanvraag voor subsidie betrekking heeft op een renovatieproject ten behoeve van het realiseren van een
      vergroting van het woonoppervlakte of de wooninhoud in ieder geval door:

      1°. het realiseren van een nieuwe aanbouw;

      2°. het realiseren van een nieuwe dakkapel;

      3°. het betrekken van een aan- of inpandige garage bij de woning;

      4°. het vergroten van het bestaande dak-, gevel-, vloer- of glasoppervlakte;

      f. de procesondersteuner niet aan de eisen, bedoeld in [artikel 6, tweede lid, onderdelen c en h][ref1] voldoet; of

      g. de procesondersteuner niet deelneemt aan het programma Verbouwstromen, bedoeld in
      [artikel 9, eerste lid, onder a][ref2].


