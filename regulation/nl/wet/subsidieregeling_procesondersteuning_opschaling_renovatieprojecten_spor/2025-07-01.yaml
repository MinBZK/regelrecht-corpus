articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *bouwbedrijf:* bedrijf dat in een handelsregister van een lidstaat van de Europese Unie of een van de overige
      staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, is ingeschreven in de sectie
      bouwnijverheid of een vergelijkbare sectie;
        - *de-minimisverordening:* [Verordening (EU) nr. 1407/2013](32013R1407) van de Commissie van 18 december 2013
      betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie
      op de-minimissteun (PbEU L 352/1), dan wel later daarvoor in de plaats tredende Europese regelgeving;
        - *energiebesparende isolatiemaatregel:* isolatiemaatregel genoemd in [artikel 5, derde lid][ref1];
        - *huurwoning:* in Nederland gelegen voor verhuur bestemde bestaande woonruimte als bedoeld
      in [artikel 233 van Boek 7 van het Burgerlijk Wetboek][ref2], die als zodanig verhuurd is
      geweest alvorens een eventuele renovatie plaatsvindt en in de basisregistratie, bedoeld in
      [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref3] met een woonfunctie is geregistreerd, niet
      zijnde een woonwagen, woonboot of een woning die wordt verhuurd in het kader van vakantiebestedingsbedrijf aan
      personen die in die woning voor een korte periode verblijf houden;
        - *Kaderbesluit:* [Kaderbesluit BZK-subsidies][ref4];
        - *koopwoning:* woning van een eigenaar-bewoner;
        - *meldcode:* code beschikbaar gesteld door de minister per soort isolatiemateriaal voor energiebesparende
      isolatiemaatregelen;
        - *mijlpalenplanning:* planning met activiteiten voor het duurzame renovatieproject;
        - *minister:* Minister van Binnenlandse Zaken en Koninkrijkrelaties;
        - *penvoerder:* woningeigenaar van één van de woningen binnen het samenwerkingsverband, natuurlijk persoon of
      rechtspersoon die als gemachtigde van het samenwerkingsverband optreedt of een medewerker van een woningcorporatie,
      niet zijnde de procesondersteuner;
        - *procesondersteuner:* natuurlijk persoon of rechtspersoon die belast is met de ondersteuning van het
      voorbereidings-, besluitvormings- en afstemmingsproces binnen een samenwerkingsverband met het doel de
      verduurzaming van woningen te bereiken;
        - *renovatieproject:* project als bedoeld in [artikel 5, tweede lid][ref5];
        - *samenwerkingsverband:* verband zonder rechtspersoonlijkheid niet zijnde een vennootschap, dat samenwerkt ten
      behoeve van de voorbereiding en uitvoering van een renovatieproject en bestaat ten minste uit twee woningeigenaren
      die in totaal ten minste 100 huurwoningen in het renovatieproject inbrengen of ten minste 30 woningeigenaren.
      Daarnaast mag een samenwerkingsverband bestaan uit twee of meer verenigingen;
        - *Verbouwstromen:* het ondersteuningsprogramma voor procesondersteuners zoals ingericht vanuit het
      uitvoeringsprogramma Verbouwstromen, bestaande uit meerdere individueel te volgen modules en een communityprogramma
      waarbinnen procesondersteuners informatie, ervaringen en leerpunten delen en kansen en knelpunten signaleren;
        - *verduurzamingsplan:* planmatige beschrijving van de energiebesparende isolatiemaatregelen die een
      samenwerkingsverband zal verrichten met het oog op verduurzaming van de woningen, inclusief planning, getekende
      offertes en een evaluatie over het samenwerkingsproces om te komen tot een verduurzamingsplan;
        - *vereniging:* vereniging van eigenaars, woonvereniging of wooncoöperatie;
        - *vereniging van eigenaars:* vereniging van de eigenaars als bedoeld in
      [artikel 112, eerste lid, onderdeel e, van Boek 5 van het Burgerlijk Wetboek][ref6];
        - *woning:* bestaande gebouwde onroerende zaak, die een zelfstandige woongelegenheid
      vormt alvorens renovatie plaatsvindt en in de basisregistratie, bedoeld in
      [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref7], met een woonfunctie is geregistreerd, dan wel
      een bestaand appartement dat een zelfstandige woongelegenheid vormt alvorens renovatie plaatsvindt en in voornoemde
      basisregistratie met een woonfunctie is geregistreerd, niet zijnde een woonwagen, woonboot of een woning die wordt
      verhuurd in het kader van vakantiebestedingsbedrijf aan personen die in die woning voor een korte periode verblijf
      houden;
        - *woningcorporatie:* krachtens [artikel 19, eerste lid, van de Woningwet][ref8] toegelaten instelling;
        - *woningeigenaar:* woningcorporatie, natuurlijk persoon of rechtspersoon die een of meer voor verhuur bestemde
      woningen in eigendom heeft, eigenaar-bewoner dan wel een vereniging.


