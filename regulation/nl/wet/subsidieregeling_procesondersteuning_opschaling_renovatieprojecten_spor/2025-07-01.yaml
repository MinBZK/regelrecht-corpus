  - number: '2'
    text: |-
      Deze regeling heeft tot doel het opschalen van duurzame renovatieprojecten van woningen te stimuleren door het
      subsidiëren van procesondersteuning voor samenwerkingsverbanden bij de bundeling van renovatieplannen voor woningen
      voorafgaande aan de uitvoering van de renovatie.
    url: https://wetten.overheid.nl/BWBR0048856/2025-07-01#Artikel2
  - number: '3'
    text: |-
      Bij verstrekking van subsidie op grond van deze regeling voor de activiteiten, bedoeld in
      [artikel 5, eerste lid][ref1], wordt toepassing gegeven aan de de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0048856#Artikel5
    url: https://wetten.overheid.nl/BWBR0048856/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0048856
        artikel: '5'
  - number: '4'
    text: |-
      1 Het subsidieplafond voor aanvragen op grond van deze regeling is:

      a. in 2023: € 3.340.000;

      b. in 2024: € 6.660.000;

      c. in 2025: € 2.000.000; en

      d. in 2026: € 1.000.000.

      2 De minister verdeelt het beschikbare bedrag op volgorde van binnenkomst van de aanvragen.

      3 Indien er meer aanvragen zijn ontvangen op één dag waarbij toekenning van al deze aanvragen zou leiden tot
      overschrijding van het betreffende subsidieplafond, wordt de onderlinge rangorde op volgorde van binnenkomst
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048856/2025-07-01#Artikel4
  - number: '5'
    text: |-
      1 De minister kan subsidie verstrekken aan de penvoerder voor de kosten voor een procesondersteuner voor het
      opstellen of het pogen op te stellen van een door alle partijen geaccordeerd verduurzamingsplan en het ondersteunen
      van een samenwerkingsverband ten behoeve van de voorbereiding van een gezamenlijk renovatieproject voor de
      verduurzaming van een aantal woningen binnen het samenwerkingsverband, mits het renovatieproject voldoet aan de
      eisen, bedoeld in het tweede lid.

      2 Een renovatieproject bestaat uit de verduurzaming van ten minste 30 koopwoningen of 100 huurwoningen met
      een bouwjaar tot 1995, waarbij voor alle woningen tenminste een combinatie van dezelfde twee energiebesparende
      isolatiemaatregelen genoemd in het derde lid, worden uitgevoerd.

      3 Energiebesparende isolatiemaatregelen zijn het door een bouwbedrijf laten aanbrengen van isolatiemateriaal,
      dat is voorzien van een prestatieverklaring of meldcode, voor één of meer van de volgende typen energiebesparende
      isolatiemaatregelen:

      a. dakisolatie dan wel zolder- of vlieringvloerisolatie, waarbij:

      1°. ten minste 20 vierkante meter van de oppervlakte van het bestaande dak in de bestaande thermische schil dan
      wel, indien de zolder of vliering onverwarmd is, van ten minste 20 vierkante meter van de oppervlakte van de
      bestaande zolder- of vlieringvloer, wordt geïsoleerd;

      2°. het isolatiemateriaal een Rd-waarde van ten minste 3,5 m2K/W heeft; en

      3°. het aanbrengen van lokaal gespoten PIR of PUR gebeurt met HFK-vrije blaasmiddelen;

      b. gevelisolatie, waarbij:

      1°. ten minste 10 vierkante meter van de oppervlakte van de binnen- of buitengevel van de bestaande thermische
      schil wordt geïsoleerd; en

      2°. het isolatiemateriaal een Rd-waarde van ten minste 3,5 m2K/W heeft;

      c. glas-, kozijnpaneel- of deurisolatie in de bestaande thermische schil door het vervangen van ten minste 8
      vierkante meter, gemeten op basis van binnenwerkse maten, door:

      1°. glas, kozijnpanelen of deuren door HR++ glas, eventueel in combinatie met nieuwe isolerende kozijnpanelen of
      nieuwe isolerende deuren met een Ud-waarde van ten hoogste 1,5 W/m2K; of

      2°. glas, kozijnpanelen of deuren door triple-glas, in combinatie met een nieuw isolerend kozijn met een Uf-waarde
      van ten hoogste 1,5 W/ m2K, eventueel in combinatie met nieuwe isolerende kozijnpanelen of nieuwe isolerende deuren
      met een Ud-waarde van ten hoogste 1,0 W/m2K;

      d. spouwmuurisolatie, waarbij:

      1°. ten minste 10 vierkante meter van de oppervlakte van bestaande spouwmuren in de bestaande thermische schil
      wordt geïsoleerd;

      2°. het isolatiemateriaal een Rd-waarde van ten minste 1,1 m2K/W heeft; en

      3°. het aanbrengen van lokaal gespoten PIR of PUR gebeurt met HFK-vrije blaasmiddelen;

      e. vloer- dan wel bodemisolatie, waarbij:

      1°. ten minste 20 vierkante meter van de oppervlakte van de bestaande vloer of de bestaande bodem in de bestaande
      thermische schil wordt geïsoleerd;

      2°. het isolatiemateriaal een Rd-waarde van ten minste 3,5 m2K/W heeft; en

      3°. het aanbrengen van lokaal gespoten PIR of PUR gebeurt met HFK-vrije blaasmiddelen.

      4 Het verduurzamingsplan is opgesteld door de procesondersteuner, en bevat ten minste één door de woningeigenaren
      getekende offerte voor alle uit te voeren energiebesparende isolatiemaatregelen bij alle woningen, van uitvoerders
      van het renovatieproject.

      5 Subsidie op grond van het eerste lid, wordt slechts eenmaal per woning die onderdeel is van een
      samenwerkingsverband verstrekt.

      6 Op grond van het eerste lid, kan ook subsidie worden verstrekt, indien de bedoelde activiteiten ook uit anderen
      hoofde zijn of worden gesubsidieerd of gefinancierd.

      7 In afwijking van het zesde lid wordt geen subsidie verstrekt, indien de begunstigde van de subsidie
      reeds subsidie heeft ontvangen voor de activiteiten, bedoeld in het eerste lid, op grond van de
      [Subsidieregeling Verduurzaming voor Vereniging van Eigenaars][ref1].

      8 In afwijking van het zesde lid wordt geen subsidie verstrekt ten behoeve van het samenwerkingsverband als blijkt
      dat een begunstigde van staatssteun meer steun ontvangt dan is toegestaan op basis van de de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0047596
