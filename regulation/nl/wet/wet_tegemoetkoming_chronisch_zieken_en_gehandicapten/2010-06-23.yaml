---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tegemoetkoming_chronisch_zieken_en_gehandicapten
regulatory_layer: WET
publication_date: '2014-07-15'
valid_from: '2010-06-23'
bwb_id: BWBR0025003
url: https://wetten.overheid.nl/BWBR0025003/2010-06-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat chronisch zieken en gehandicapten die worden
    geconfronteerd met hoge uitgaven in verband met gezondheidsproblemen hiervoor een tegemoetkoming ontvangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel1
  - number: 1.a
    text: |-
      *rechthebbende:* persoon die recht heeft op een tegemoetkoming voor chronisch zieken en gehandicapten als bedoeld
      in [paragraaf 2.1][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025003
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 1.b
    text: '*het CAK:* de besloten vennootschap CAK, gevestigd te ’s-Gravenhage;'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel1
  - number: 1.c
    text: '*Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel1
  - number: 1.d
    text: |-
      *burgerservicenummer:* het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 1.e
    text: |-
      *sociaal-fiscaalnummer:* het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '2.1'
    text: |-
      Iemand heeft jaarlijks recht op een bij algemene maatregel van bestuur vast te stellen tegemoetkoming, indien hij
      behoort tot een bij of krachtens die maatregel te bepalen groep van personen:
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2
  - number: 2.1.a
    text: |-
      die gebruik maken van hulpmiddelenzorg, farmaceutische zorg, fysiotherapie, oefentherapie en geneeskundige zorg die
      behoren tot de verzekerde prestaties op grond van de [Zorgverzekeringswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 2.1.b
    text: |-
      voor wie ingevolge [artikel 9b, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] is vastgesteld dat
      zij aanspraak hebben op zorg, of


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: 2.1.c
    text: |-
      die gebruik maken van een individuele voorziening, die beoogt hen in staat te stellen een huishouden te voeren als
      bedoeld in [artikel 4, eerste lid, onderdeel a, van de Wet maatschappelijke ondersteuning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel4
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '4'
  - number: '2.2'
    text: |-
      De tegemoetkoming, bedoeld in het eerste lid, kan voor verschillende groepen op een verschillend bedrag worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2
  - number: '2.3'
    text: |-
      De criteria, genoemd in het eerste lid, onder a tot en met c, kunnen indien dit met het oog op een betere werking
      van deze wet op korte termijn noodzakelijk wordt geacht, bij algemene maatregel van bestuur worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2
  - number: '2.4'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het derde lid vastgestelde algemene maatregel van bestuur wordt
      een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal ingediend.
      Indien het voorstel wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel
      niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel tot wet
      verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2
  - number: 2a
    text: |-
      In afwijking van [artikel 2][ref1] heeft degene die niet verzekerd is krachtens een zorgverzekering
      als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2], geen recht op
      een tegemoetkoming, tenzij hij militaire ambtenaar in werkelijke dienst is als bedoeld in
      [artikel 1, eerste lid, onderdeel a juncto onderdeel b, van de Militaire ambtenarenwet 1931][ref3], dan wel een
      militair is aan wie buitengewoon verlof met behoud van militaire inkomsten is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: '1'
  - number: '3.1'
    text: |-
      Het bestuur van het CAK stelt ambtshalve het recht op en de hoogte van de tegemoetkoming, bedoeld in
      [artikel 2, eerste lid][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '3.2'
    text: |-
      Het CAK verstrekt de tegemoetkoming, bedoeld in [artikel 2, eerste lid][ref1], voor het einde van het kalenderjaar
      volgend op het jaar waarop de tegemoetkoming betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '3.3'
    text: 'Het CAK ziet bij de uitvoering van de in het eerste en tweede lid bedoelde taak toe op:'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: 3.3.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: 3.3.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: 3.3.c
    text: de zorgvuldige behandeling van personen en instellingen die met hem in aanraking komen;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: 3.3.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: '3.4'
    text: |-
      Het CAK treft voorzieningen, waardoor personen en instellingen, die met hem in aanraking komen in verband met de
      uitvoering van de in het eerste en tweede lid bedoelde taak, in de gelegenheid zijn voorstellen tot verbetering van
      werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de uitvoering van de in het eerste en tweede lid
      bedoelde taak door het CAK. De beleidsregels worden in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: '3.6'
    text: |-
      Indien naar het oordeel van Onze Minister het CAK zijn in het eerste en tweede lid bedoelde taak ernstig
      verwaarloost, kan Onze Minister de noodzakelijke voorzieningen treffen. De voorzieningen worden, spoedeisende
      gevallen uitgezonderd, niet eerder getroffen dan nadat het CAK in de gelegenheid is gesteld om binnen een door
      Onze Minister te stellen termijn alsnog zijn taak naar behoren uit te voeren. Onze Minister stelt beide kamers der
      Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel3
  - number: '4.1'
    text: |-
      Indien iemand die meent rechthebbende te zijn of zijn erfgenaam het CAK verzoekt om informatie over
      de gronden waarop een tegemoetkoming is verleend of geweigerd, verstrekt het CAK binnen 30 dagen
      na het verzoek kosteloos en in begrijpelijke taal schriftelijk de gevraagde informatie. Het verzoek
      kan worden gedaan vanaf 1 november van het kalenderjaar volgend op het jaar waarop de tegemoetkoming
      betrekking heeft. Het CAK gaat bij dit verzoek, na toestemming van verzoeker, bij zorgverzekeraars als
      bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1], indicatieorganen als bedoeld in
      [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref2], colleges van burgemeester en wethouders of andere
      bij algemene maatregel van bestuur bepaalde instanties als bedoeld in [artikel 5, tweede lid][ref3], na onder welke
      criteria als bedoeld bij of krachtens [artikel 2, eerste lid][ref4], degene die meent rechthebbende te zijn, valt
      en deelt de uitkomst hiervan aan verzoeker mede. De verzoeker legitimeert zich desgevraagd op deugdelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0025003#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0025003
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.2'
    text: |-
      Indien iemand die meent rechthebbende te zijn of diens erfgenaam na afloop van de termijn, genoemd in het eerste
      lid, geen antwoord heeft gekregen van het CAK dan wel het antwoord onvoldoende acht, delen de in het eerste lid
      genoemde en bedoelde instanties op verzoek van hem of zijn erfgenaam binnen 30 dagen na het verzoek kosteloos en
      in begrijpelijke taal schriftelijk mede onder welke criteria, met inbegrip van de onderliggende zorggegevens, als
      bedoeld bij of krachtens [artikel 2, eerste lid][ref1], degene die meent rechthebbende te zijn, valt.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de vorm waarin de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel4
  - number: '5.1'
    text: |-
      Het CAK neemt het burgerservicenummer of, bij ontbreken daarvan, het sociaal-fiscaalnummer van rechthebbenden voor
      de uitvoering van de in [artikel 3, eerste en tweede lid][ref1], bedoelde taak in zijn administratie op.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel3
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.2'
    text: |-
      Zorgverzekeraars als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1], indicatieorganen
      als bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref2], colleges van burgemeester
      en wethouders en andere bij algemene maatregel van bestuur aangewezen instanties verstrekken aan het
      CAK persoonsgegevens van rechthebbenden, waaronder persoonsgegevens betreffende de gezondheid als
      bedoeld in de [Wet bescherming persoonsgegevens][ref3], noodzakelijk voor de uitvoering van de in
      [artikel 3, eerste en tweede lid][ref4], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0011468
      [ref4]: https://wetten.overheid.nl/BWBR0025003#Artikel3
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0011468
      - id: ref4
        bwb_id: BWBR0025003
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald tot welke gegevens de verplichtingen, bedoeld in het tweede lid,
      zich uitstrekken en in welke gevallen de gegevens, bedoeld in het eerste en tweede lid, verder worden verwerkt met
      het oog op de uitvoering van de in [artikel 3, eerste en tweede lid][ref1], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel3
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.4'
    text: 'Bij ministeriële regeling wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
  - number: 5.4.a
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
  - number: 5.4.b
    text: aan welke beveiligingseisen gegevensverwerking voldoet;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
  - number: 5.4.c
    text: |-
      de hoogte van de vergoeding voor zorgverzekeraars voor het aanleveren van gegevens noodzakelijk voor het uitvoeren
      van de in [artikel 3, eerste en tweede lid][ref1], bedoelde taak;


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel3
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.4.d
    text: op welke datum gegevens als bedoeld in het tweede lid uiterlijk worden verstrekt aan het CAK.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister is bevoegd zorgverzekeraars als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1]
      en indicatieorganen als bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref2], ter handhaving
      van het bepaalde bij of krachtens [artikel 5, tweede lid en vierde lid, onderdelen a en d][ref3], een aanwijzing
      te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0025003#Artikel5
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0025003
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '6.2'
    text: |-
      Indien een zorgverzekeraar als bedoeld in het eerste lid niet binnen vier weken aan een aanwijzing als bedoeld in
      het eerste lid, voldoet, is Onze Minister bevoegd een last onder dwangsom op te leggen.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel6
  - number: '6.3'
    text: |-
      Indien indicatieorganen als bedoeld in het eerste lid niet binnen vier weken voldoen aan een aanwijzing als bedoeld
      in het eerste lid, kan Onze Minister noodzakelijke maatregelen treffen. Onze Minister stelt beide kamers der
      Staten-Generaal onverwijld in kennis van deze door hem getroffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel6
  - number: '7.1'
    text: |-
      Het CAK zendt jaarlijks voor 15 november aan Onze Minister een begroting voor in het volgende kalenderjaar te
      verstrekken tegemoetkomingen als bedoeld in [artikel 2, eerste lid][ref1], en voor de in dat jaar met de uitvoering
      daarvan gepaard gaande beheerskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.2'
    text: |-
      Onze Minister stelt jaarlijks voor 15 december het budget vast voor de kosten van tegemoetkomingen en de
      beheerskosten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel7
  - number: '7.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting en over de wijze waarop
      en de voorwaarden waaronder het budget wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel7
  - number: '7.4'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten, doet het CAK, onder vermelding van de oorzaak van de verschillen daarvan, onverwijld
      mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel7
  - number: '7.5'
    text: Onze Minister kan besluiten het budget voor de beheerskosten, bedoeld in het eerste lid, te wijzigen.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel7
  - number: '7.6'
    text: |-
      Het CAK gaat met betrekking tot de beheerskosten, bedoeld in het eerste lid, geen verplichtingen aan en doet geen
      uitgaven die leiden tot overschrijding van het daarvoor vastgestelde budget.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel7
  - number: '8.1'
    text: |-
      Het CAK zendt jaarlijks voor 1 juli aan Onze Minister een jaarverantwoording over de verstrekking van
      tegemoetkomingen als bedoeld in [artikel 2, eerste lid][ref1], en de daarmee gepaard gaande beheerskosten over het
      afgelopen kalenderjaar, alsmede het verslag van bevindingen, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.2'
    text: 'De jaarverantwoording, bedoeld in het eerste lid, omvat:'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: 8.2.a
    text: een jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: 8.2.b
    text: |-
      een jaarverslag met betrekking tot het door het CAK gevoerde beleid, de doeltreffendheid van dat beleid en de
      bedrijfsvoering rond de uitvoering van de in [artikel 3, eerste en tweede lid][ref1], bedoelde taak en de daarmee
      gepaard gaande beheerskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel3
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.3'
    text: |-
      Het CAK legt in zijn jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over de kosten
      van tegemoetkomingen en de beheerskosten, bedoeld in [artikel 7, eerste lid][ref2], en over de rechtmatigheid en
      doelmatigheid van het beheer in het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0025003#Artikel7
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0025003
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.4'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld
      in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], die bereid is Onze Minister desgevraagd inzicht te
      geven in zijn controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '8.5'
    text: |-
      De verklaring, bedoeld in het vierde lid, heeft mede betrekking op de rechtmatige verkrijging en besteding van de
      middelen voor de kosten van tegemoetkomingen en de beheerskosten, bedoeld in [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel7
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.6'
    text: |-
      De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie van de kosten van tegemoetkomingen en de beheerskosten, bedoeld in [artikel 7, eerste lid][ref1],
      voldoen aan de eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel7
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.7'
    text: De jaarrekening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: '8.8'
    text: |-
      Onze Minister houdt toezicht op de uitvoering van de in [artikel 3, eerste en tweede lid][ref1], bedoelde taak en
      de daarmee gepaard gaande beheerskosten door het CAK.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel3
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.9'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van:'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: 8.9.a
    text: de jaarverantwoording, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: 8.9.b
    text: de verklaring omtrent de getrouwheid, bedoeld in vierde lid;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: 8.9.c
    text: het verslag van bevindingen, bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: 8.9.d
    text: het aan de verklaring en het verslag van bevindingen ten grondslag liggende onderzoek.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel8
  - number: '9.1'
    text: |-
      Het CAK verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel9
  - number: '9.2'
    text: |-
      Het CAK geeft bij het verstrekken van de in het eerste lid bedoelde inlichtingen waar nodig aan welke gegevens
      een vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan voortvloeien uit de aard van de gegevens, dan
      wel uit het feit dat natuurlijke of rechtspersonen deze aan het CAK hebben verstrekt onder het beding dat zij als
      vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel9
  - number: '10.1'
    text: |-
      De persoon die van rechtswege verzekerd is ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref1] en recht heeft
      op een uitkering in verband met een arbeidsongeschiktheid van 35% of meer en de persoon die recht heeft op een
      arbeidsongeschiktheidsuitkering naar een mate van arbeidsongeschiktheid van 35% of meer of op arbeidsondersteuning
      op grond van de [Wet werk en arbeidsondersteuning jonggehandicapten][ref2], hebben recht op een tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0008657
  - number: '10.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 4, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], verstrekt de tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: '10.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de doelgroep, de hoogte van de
      tegemoetkoming en de wijze van betaling.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel10
  - number: '11.1'
    text: |-
      De betaling van tegemoetkomingen, bedoeld in de [artikelen 2][ref1] en [10][ref2], geschiedt eenmaal per
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025003#Artikel10
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0025003
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '11.2'
    text: |-
      De bedragen van de tegemoetkomingen worden jaarlijks aangepast op een bij algemene maatregel van bestuur te bepalen
      wijze.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel11
  - number: '11.3'
    text: De tegemoetkomingen zijn niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel11
  - number: '11.4'
    text: |-
      De tegemoetkomingen blijven buiten beschouwing bij de verlening van op het inkomen of vermogen afgestemde
      publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel11
  - number: '11.5'
    text: De tegemoetkomingen en de daarmee gepaard gaande beheerskosten komen ten laste van ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel11
  - number: '19'
    text: |-
      [Artikel 4.2 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref1] komt te vervallen, met dien verstande
      dat [dit artikel][ref2] en de daarop gebaseerde bepalingen, zoals deze luidden op de dag voorafgaande aan de dag
      waarop dit wetsvoorstel, nadat het tot wet is verheven, in werking treedt, van toepassing blijven op de aanspraken
      van belastingplichtigen over de jaren voor het kalenderjaar 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018830#Artikel4
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018830
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018830
        artikel: '4'
  - number: '24.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over door de rijksbelastingdienst te verstrekken
      tegemoetkomingen specifieke zorgkosten aan belastingplichtigen met uitgaven voor specifieke zorgkosten als bedoeld
      in [afdeling 6.5 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling6.5
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '6.5'
  - number: '24.2'
    text: |-
      De uitbetaling en terugvordering van verstrekte tegemoetkomingen specifieke zorgkosten geschieden overeenkomstig
      de regels die gelden voor de invordering van inkomstenbelasting, met dien verstande dat bij de overeenkomstige
      toepassing van [artikel 24 van de Invorderingswet 1990][ref1] een uit te betalen tegemoetkoming specifieke
      zorgkosten uitsluitend kan worden verrekend met een terugvordering van een tegemoetkoming specifieke zorgkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: '25.1'
    text: |-
      Het CAK brengt uiterlijk 30 november 2009 de krachtens [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref1]
      of [artikel 15 van de Wet maatschappelijke ondersteuning][ref2] verschuldigde bijdragen over de kalenderjaren tot
      en met 2008 in rekening bij de verzekerde, bedoeld in [artikel 5 van de Algemene Wet Bijzondere Ziektekosten][ref3]
      onderscheidenlijk de persoon, bedoeld in [artikel 15 van de Wet maatschappelijke ondersteuning][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020031#Artikel15
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020031
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0020031
        artikel: '15'
  - number: '25.2'
    text: Na 30 november 2009 in rekening gebrachte bijdragen als bedoeld in het eerste lid hoeven niet te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel25
  - number: '26.1'
    text: |-
      Tot en met 31 december 2009 behoren mede tot de uitgaven voor specifieke zorgkosten, bedoeld in
      [afdeling 6.5 van de Wet inkomstenbelasting 2001][ref1], de volgende door de belastingplichtige over de
      kalenderjaren tot en met 2008 verschuldigde bijdragen, voor zover deze na 30 november 2008 aan hem in rekening zijn
      gebracht en door hem in 2009 zijn betaald of verrekend:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling6.5
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '6.5'
  - number: 26.1.a
    text: |-
      de krachtens [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref1] verschuldigde bijdragen in verband met
      het verblijf in een instelling die is toegelaten om zorg te verlenen, tot een bedrag van 25% van die bijdragen;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 26.1.b
    text: |-
      de krachtens [artikel 6, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] verschuldigde bijdragen,
      bij verblijf buiten een instelling als bedoeld in onderdeel a;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 26.1.c
    text: |-
      de krachtens [artikel 15 van de Wet maatschappelijke ondersteuning][ref1] verschuldigde bijdragen,
      voorzover de belastingplichtige deze verschuldigd is voor huishoudelijke verzorging als bedoeld in
      [artikel 1, eerste lid, onderdeel h, van die wet][ref2] of voor een daarvoor bestemd persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0020031
        artikel: '1'
  - number: '26.2'
    text: |-
      Tot en met 31 december 2009 worden de bijdragen, bedoeld in het eerste lid, mede in aanmerking genomen als uitgaven
      als bedoeld in [artikel 6.19 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '27.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip waarbij voor een of meer artikelen of
      onderdelen daarvan terugwerkende kracht mogelijk is tot en met 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel27
  - number: '27.2'
    text: |-
      Bij het begin van het kalenderjaar 2009 vindt [artikel 10.1 van de Wet inkomstenbelasting 2001][ref1]
      geen toepassing met betrekking tot de in de [artikelen 6.17, derde lid][ref2], en
      [6.20 van de Wet inkomstenbelasting 2001][ref3] vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '27.3'
    text: |-
      [Artikel 12, onderdelen G en H][ref1], vindt eerst toepassing nadat
      [artikel 10.1 van de Wet inkomstenbelasting 2001][ref2] bij het begin van het kalenderjaar 2009 is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '27.4'
    text: |-
      [Artikel 15][ref1] vindt eerst toepassing nadat [artikel 22d van de Wet op de loonbelasting 1964][ref2] bij het
      begin van het kalenderjaar 2009 is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22d
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 22d
  - number: '27.5'
    text: |-
      [Artikel 13, onderdeel B][ref1], vindt eerst toepassing nadat
      [artikel 10.1 van de Wet inkomstenbelasting 2001][ref2] bij het begin van het kalenderjaar 2010 is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '27.6'
    text: |-
      [Artikel 16][ref1] vindt eerst toepassing nadat [artikel 22d van de Wet op de loonbelasting 1964][ref2] bij het
      begin van het kalenderjaar 2010 is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22d
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 22d
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet tegemoetkoming chronisch zieken en gehandicapten.'
    url: https://wetten.overheid.nl/BWBR0025003/2010-06-23#Artikel28
