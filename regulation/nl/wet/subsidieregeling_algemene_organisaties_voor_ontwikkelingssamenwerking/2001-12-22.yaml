  - number: '7'
    text: |-
      Deze regeling vindt voor de eerste maal toepassing met het oog op subsidieverlening voor het subsidietijdvak dat
      aanvangt met ingang van 1 januari 2003. Het overleg, bedoeld in [artikel 4, derde lid][ref1], voert de minister
      met de op het tijdstip van inwerkingtreding krachtens [hoofdstuk II][ref2], [afdeling 6][ref3], paragraaf 1, van de
      Subsidieregeling Ministerie van Buitenlandse Zaken gesubsidieerde organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0013208#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010173#HoofdstukII
