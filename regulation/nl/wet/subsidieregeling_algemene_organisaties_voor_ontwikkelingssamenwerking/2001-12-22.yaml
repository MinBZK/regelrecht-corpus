  - number: '4'
    text: |-
      1 Subsidie wordt met toepassing van
      [artikel 1.1.7, derde lid, van de Subsidieregeling Ministerie van Buitenlandse Zaken][ref1] eens in de vier jaar
      als instellingssubsidie verleend voor een subsidietijdvak van vier jaar.

      2 In afwijking van [artikel 1.1.6, eerste lid, van de Subsidieregeling Ministerie van Buitenlandse Zaken][ref2]
      maakt de minister uiterlijk twaalf maanden voorafgaand aan het subsidietijdvak zijn beleidsvoornemens bekend.

      3 Aanvragen kunnen tot uiterlijk 15 april in het jaar voorafgaand aan het subsidietijdvak bij de minister worden
      ingediend.

      4 De minister legt de tijdig en volledig ingediende aanvragen om subsidie voor aan een adviescommissie.

      5 De commissie bestaat uit zeven leden. De minister benoemt de leden en wijst uit hun midden een voorzitter aan,
      gehoord de op grond van deze regeling gesubsidieerde organisaties.

      6 De minister draagt zorg dat de commissie zo is samengesteld dat een onafhankelijke en deskundige oordeelsvorming
      gewaarborgd is.

      7 De minister voegt aan de commissie een secretariaat toe. Het secretariaat staat onder leiding van een secretaris.
      De minister stelt de commissie in de gelegenheid een voordracht voor de benoeming van de secretaris te doen.

      8 De commissie stelt de minister uiterlijk vier maanden voorafgaand aan het subsidietijdvak in kennis van haar
      advies omtrent de ingediende aanvragen in het licht van de [artikelen 2][ref3] en [3][ref4] en de door de minister
      bij de toepassing van [artikel 1.1.7, derde lid, van de Subsidieregeling Ministerie van Buitenlandse Zaken][ref5]
      bekendgemaakte maatstaven, alsmede omtrent de omvang van de aan de afzonderlijke subsidieaanvragers te verlenen
      subsidie en de aan de subsidieverlening te verbinden verplichtingen.

      9 De minister beslist uiterlijk twee maanden voorafgaand aan het subsidietijdvak.


