  - number: '5'
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omvat de subsidieaanvraag
      naast een jaarplan en een jaarbegroting als bedoeld in de [artikelen 1.2.2][ref1] en
      [1.2.3 van de Subsidieregeling Ministerie van Buitenlandse Zaken][ref2] in elk geval een bedrijfsplan waarin
      de aanvrager zijn beleid, beoogde doelstellingen, resultaten , activiteiten en financiële raming voor het
      subsidietijdvak uiteenzet. De aanvrager besteedt daarbij aandacht aan de onderlinge samenhang van alle
      werkzaamheden en geeft inzicht in doeltreffendheid, doelmatigheid en beheersbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel1.2.3
