preamble:
  text: |-
    Gelet op artikel 3, eerste en tweede lid, van de Kaderwet subsidies Ministerie van Buitenlandse Zaken;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013208/2001-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:



            a

              *de Minister:*


              de Minister voor Ontwikkelingssamenwerking;



            b

              *ontwikkelingslanden:*


              landen, vermeld in deel I, Developing Countries and Territories, van de in het kader van de Organisatie
      voor Economische Samenwerking en Ontwikkeling (OESO) door het Development Assistence Committee (DAC) meest recent
      vastgestelde List of Aid Recipients.
    url: https://wetten.overheid.nl/BWBR0013208/2001-12-22#Artikel1
  - number: '2'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan structurele
      armoedebestrijding in ontwikkelingslanden door middel van de samenhangende interventiestrategieën directe
      armoedebestrijding, maatschappijopbouw en beleidsbeïnvloeding. De activiteiten omvatten de ondersteuning van
      een breed scala van thematische en op specifieke doelgroepen gerichte organisaties op meerdere continenten, per
      continent binnen meerdere landen en in diverse sectoren.
    url: https://wetten.overheid.nl/BWBR0013208/2001-12-22#Artikel2
  - number: '3'
    text: |-
      Voor subsidie op grond van deze regeling komen in aanmerking particuliere organisaties die aantoonbaar voldoen aan
      de volgende eisen:

      a. in Nederland gevestigd,

      b. rechtspersoonlijkheid naar Nederlands recht,

      c. niet op het maken van winst gericht,

      d. naar statutaire doelstelling, beleid, feitelijke werkzaamheden en bestedingspatroon geheel of overwegend geheel
      of overwegend gericht op structurele armoedebestrijding in de zin van [artikel 2][ref1],

      e. beschikt over ervaring over een tijdvak van twee of meer jaren op het terrein van structurele
      armoedebestrijding,

      f. is verankerd in de Nederlandse samenleving,

      g. beschikt over samenwerkingsrelaties met een breed en pluriform scala van particuliere organisaties of groepen op
      meerdere continenten en per continent binnen meerdere landen, zowel binnen ontwikkelingslanden als in ontwikkelde
      landen, waaronder Nederland,

      h. draagt zorg voor een doelgerichte en doelmatige uitvoering van haar werkzaamheden en beschikt daartoe over een
      afdoende professionele staf en een hoogwaardige bedrijfsvoering,

      i. is bereid en in staat om in samenwerking met andere krachtens deze regeling gesubsidieerde instellingen een
      stelsel van kwaliteitszorg te ontwikkelen en toe te passen,

      j. legt periodiek en stelselmatig verantwoording af aan leden, donateurs en andere financiers en aan de
      organisaties en groepen waarmee de organisatie samenwerkingsrelaties onderhoudt over de realisatie van haar
      doelstellingen, de bereikte resultaten, de uitvoering van haar werkzaamheden, de besteding van haar middelen en
      het voorgenomen beleid van de organisatie, mede in het licht van de uitkomsten van het stelsel van kwaliteitszorg,
      bedoeld in onderdeel i.


      [ref1]: https://wetten.overheid.nl/BWBR0013208#Artikel2
    url: https://wetten.overheid.nl/BWBR0013208/2001-12-22#Artikel3
