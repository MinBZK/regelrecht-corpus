  - number: '8'
    text: |-
      Deze regeling wordt aangehaald als: Subsidieregeling algemene organisaties voor ontwikkelingssamenwerking.

      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013208/2001-12-22#Artikel8
