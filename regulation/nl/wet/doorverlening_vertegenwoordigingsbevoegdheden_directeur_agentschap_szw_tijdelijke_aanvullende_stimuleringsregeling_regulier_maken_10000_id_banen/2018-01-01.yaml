preamble:
  text: |-
    Gelet op artikel 22, eerste en derde lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021749/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aan de directeur van het Agentschap SZW wordt mandaat en machtiging verleend tot het nemen van besluiten
      over en het vaststellen en ondertekenen van stukken die betrekking hebben op de uitvoering van de
      [Tijdelijke aanvullende stimuleringsregeling regulier maken 10.000 ID-banen][ref1], waaronder begrepen:

      a. het beoordelen van en beslissen op de aanvragen voor de subsidies;

      b. het beoordelen en vaststellen van de einddeclaraties voor de subsidies;

      c. beslissingen in bezwaar- en beroepsprocedures, met uitzondering van de beslissing op een beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0014997
    url: https://wetten.overheid.nl/BWBR0021749/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014997
  - number: '2'
    text: |-
      De directeur van het Agentschap SZW kan de bevoegdheid, bedoeld in [artikel 1, onder a en b][ref1], in een door hem
      te bepalen omvang doorverlenen aan onder hem ressorterende functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0021749#Artikel1
    url: https://wetten.overheid.nl/BWBR0021749/2018-01-01#Artikel2
