  - number: '95'
    text: Deze regeling treedt in werking met ingang van 4 april 2013.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel95
  - number: '96'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing categorieën duurzame energieproductie 2013.'
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel96
  - number: B1:1
    text: |-
      De Ondernemer verplicht zich jegens de Staat de productie-installatie tijdig in gebruik te nemen en wel binnen
      de in [artikel 61 van het Besluit stimulering duurzame energieproductie][ref1] bedoelde periode of, indien op
      grond van [artikel 62, derde lid, van het Besluit stimulering duurzame energieproductie][ref2] een ontheffing is
      verleend, binnen de in de ontheffing opgenomen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel62
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '62'
  - number: B1:2
    text: |-
      De Ondernemer verplicht zich om tot zekerheid voor de nakoming van de in artikel 1 bedoelde verplichting,
      alsmede de bij niet tijdige nakoming verschuldigde boetes, binnen acht weken nadat de Beschikking in
      werking is getreden ten behoeve van de Staat financiële zekerheid te stellen en gesteld houden voor een
      bedrag groot 2% van de maximale hoogte van de subsidie, bedoeld in de [artikelen 16][ref1], [33][ref2] en
      [49 van het Besluit stimulering duurzame energieproductie][ref3], door middel van de afgifte aan de Staat van een
      door een binnen de Europese Unie gevestigde bank afgegeven bankgarantie welke is opgemaakt onder gebruikmaking van
      het model bankgarantie.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel49
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0022735
        artikel: '49'
  - number: B1:3.1
    text: |-
      De verplichting de in artikel 2 bedoelde bankgarantie te blijven stellen vervalt uitsluitend door het schriftelijk
      bericht van de Staat aan de Bank dat de verplichting geheel of gedeeltelijk is vervallen. De Ondernemer ontvangt
      een kopie van het bericht van verval.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel3
  - number: B1:3.2
    text: Zodra de verplichting geheel is vervallen zal de Staat de bankgarantie retourneren aan de Ondernemer.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel3
  - number: B1:4.1
    text: |-
      Indien de Ondernemer de productie-installatie niet binnen de in artikel 1 bedoelde periode in gebruik heeft
      genomen, is de Ondernemer aan de Staat bij wijze van boete een bedrag verschuldigd groot 0,2% van het beschikte
      bedrag enkel door het verloop van die termijn en zonder dat enige ingebrekestelling nodig is.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel4
  - number: B1:4.2
    text: |-
      Indien de Ondernemer daarna nog in gebreke blijft met het tijdig in gebruik nemen van de productie-installatie
      is de Ondernemer maandelijks een boete van telkens 0,2% van de maximale hoogte van de subsidie, bedoeld in de
      [artikelen 16][ref1], [33][ref2] en [49 van het Besluit stimulering duurzame energieproductie][ref3], verschuldigd
      voor zover hij de productie-installatie op de eerste van elke volgende maand niet in gebruik heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel49
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0022735
        artikel: '49'
  - number: B1:4.3
    text: |-
      De boetes bedoeld in het eerste en tweede lid, waarvan de som ten hoogste 2% van het beschikte bedrag bedraagt,
      zijn telkens verschuldigd voor het enkele verloop van de termijn en zonder dat enige ingebrekestelling nodig is.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel4
  - number: B1:4.4
    text: |-
      De Ondernemer machtigt bij deze de Staat onherroepelijk tot het innen van de boetes door het inroepen van de
      bankgarantie voor het bedrag van de boete, telkens wanneer er een boete verschuldigd is geworden.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel4
  - number: B1:5.1
    text: |-
      Deze Uitvoeringsovereenkomst treedt in werking door de ondertekening daarvan door de Partijen met dien verstande
      dat de inwerkingtreding wordt opgeschort totdat de Beschikking in werking is getreden en de Staat de Ondernemer
      daarvan schriftelijk bericht heeft gestuurd.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel5
  - number: B1:5.2
    text: |-
      Deze Uitvoeringsovereenkomst eindigt van rechtswege door de teruggave van de bankgarantie door de Staat aan de
      Ondernemer.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel5
  - number: B1:6.1
    text: |-
      De Staat kiest voor uitvoering van deze Uitvoeringsovereenkomst domicilie ten kantore van Agentschap NL, agentschap
      van het Ministerie van Economische Zaken, Hanzelaan 310, 8017 JK Zwolle.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel6
  - number: B1:6.2
    text: |-
      Onverminderd het bepaalde in het Wetboek van Burgerlijke Rechtsvordering dienen alle mededelingen, aanzeggingen,
      verzoeken, toestemmingen en andere berichten uit hoofde van deze uitvoeringsovereenkomst schriftelijk te worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel6
  - number: B1:6.3
    text: |-
      Mededelingen, aanzeggingen, verzoeken, toestemmingen en andere berichten die niet in overeenstemming met het tweede
      lid zijn gedaan blijven zonder rechtsgevolg.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel6
  - number: B1:6.4
    text: De Staat is bevoegd eenzijdig van het bepaalde in het eerste lid af te wijken.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel6
  - number: B1:7.1
    text: Op deze Uitvoeringsovereenkomst is uitsluitend Nederlands recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel7
  - number: B1:7.2
    text: |-
      Alle geschillen in verband met deze uitvoeringsovereenkomst of met afspraken die daarmee samenhangen zullen worden
      beslecht door de bevoegde rechter te Den Haag.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel7
  - number: B1:8
    text: |-
      Deze Uitvoeringsovereenkomst wordt tussen partijen aangeduid als ‘Uitvoeringsovereenkomst duurzame energieproductie
      Staat/.....’. Aldus overeengekomen en in tweevoud ondertekend te ..... Ondernemer te 's-Gravenhage op ..... De
      Minister van Economische Zaken
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel8
