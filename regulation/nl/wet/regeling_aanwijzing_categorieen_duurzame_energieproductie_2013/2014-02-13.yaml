  - number: '60.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie met een nominaal thermisch vermogen groter dan of gelijk aan 0,5 MW, voor de productie
      van warmte door middel van verbranding van vaste of vloeibare biomassa als bedoeld in de NTA 8003: 2008, met
      uitzondering van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179 van de NTA 8003: 2008 in een
      ketel.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel60
  - number: '60.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel60
  - number: '60.3'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel60
  - number: '60.4'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0032881
  - number: '60.5'
    text: |-
      Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in de
      [artikelen 48, tweede lid][ref1], en [56, eerste lid, derde volzin, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel56
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '56'
  - number: '61.1'
    text: |-
      Subsidie als bedoeld in [artikel 60, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032881#Artikel60
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0032881
        artikel: '60'
        paragraaf: '5'
  - number: '61.2'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 60, eerste lid][ref1], binnen 4 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0032881#Artikel60
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0032881
        artikel: '60'
        paragraaf: '5'
