      - id: ref3
        bwb_id: BWBR0022735
        artikel: '56'
  - number: '40.1'
    text: |-
      Subsidie als bedoeld in [artikel 39, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032881#Artikel39
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel40
