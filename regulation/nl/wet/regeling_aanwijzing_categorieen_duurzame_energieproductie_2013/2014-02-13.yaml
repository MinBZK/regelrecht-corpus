  - number: '37.1'
    text: 'De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel37
  - number: 37.1.a
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van allesvergisting,
      waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel37
  - number: 37.1.b
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting en co-
      vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is, of
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel37
  - number: 37.1.c
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting van
      meer dan 95% dierlijke mest, waarbij ten minste de vergister nieuw is.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel37
  - number: '37.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0032881
  - number: '37.3'
    text: |-
      Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in de
      [artikelen 3, vijfde lid][ref1], [32, tweede en vierde lid][ref2], en [56, eerste lid, van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel56
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0022735
        artikel: '56'
  - number: '38.1'
    text: |-
      Subsidie als bedoeld in [artikel 37, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032881#Artikel37
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0032881
        artikel: '37'
        paragraaf: '4'
  - number: '38.2'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 37, eerste lid][ref1], binnen 4 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0032881#Artikel37
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0032881
        artikel: '37'
        paragraaf: '4'
  - number: '39.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een
      productie-installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt tengevolge van biologische
      afbraakreacties bij de zuivering van huishoudelijk afvalwater, bedrijfsafvalwater en afvloeiend hemelwater, waarbij
      ten minste de opwerkinstallatie waarmee biogas op aardgaskwaliteit wordt gebracht nieuw is.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel39
  - number: '39.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0032881
  - number: '39.3'
    text: |-
      Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in de
      [artikelen 3, vijfde lid][ref1], [32, tweede lid][ref2], en [56, eerste lid, derde volzin, van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel56
