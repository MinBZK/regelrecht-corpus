  - number: '40.2'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 39, eerste lid][ref1], binnen 4 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


