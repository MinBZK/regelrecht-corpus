  - number: '80.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door:
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel80
  - number: 80.1.a
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      allesvergisting, waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel80
  - number: 80.1.b
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van vergisting en
      co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel80
  - number: 80.1.c
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend
      door middel van allesvergisting, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch
      vermogen ten minste 20% van de som van het nominale warmte en elektrisch vermogen bedraagt;
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel80
  - number: 80.1.d
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend
      door middel van vergisting en co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is en waarbij
      het nominaal elektrisch vermogen ten minste 20% van de som van het nominale warmte en elektrisch vermogen bedraagt,
      of
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel80
  - number: 80.1.e
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend
      door middel van vergisting van meer dan 95% dierlijke mest, waarbij ten minste de vergister nieuw is en waarbij het
      nominaal elektrisch vermogen ten minste 20% van de som van het nominale warmte en elektrisch vermogen bedraagt.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel80
  - number: '80.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel80
    references:
