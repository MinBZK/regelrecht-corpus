  - number: '2.2'
    text: De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel2
  - number: '2.3'
    text: |-
      Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een productie-
      installatie wordt geplaatst maximaal één aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel2
  - number: '2.4'
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas of hernieuwbare warmte door een productie-installatie van een categorie als bedoeld in het eerste
      lid indien op het moment van indienen van de aanvraag geen toestemming van de eigenaar van de beoogde locatie is
      verkregen voor het plaatsen van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel2
  - number: '2.5'
    text: |-
      Een subsidie als bedoeld in het eerste lid van meer dan € 400.000.000,00 wordt verleend onder de opschortende
      voorwaarde dat binnen zes weken na afgifte van deze beschikking een uitvoeringsovereenkomst overeenkomstig de
      overeenkomst opgenomen in de bij deze regeling behorende [bijlage 1][ref1] tot stand is gekomen tussen de Staat en
      de subsidie-aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032881
  - number: '3.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie waarmee door middel van hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit
      wordt geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van
      de elektriciteitsproductie omhoog is gepompt:
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel3
  - number: 3.1.a
    text: in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, of
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel3
  - number: 3.1.b
    text: |-
      in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, die ingrijpend zijn gerenoveerd en
      waarbij ten minste de turbines nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel3
  - number: '3.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel3
