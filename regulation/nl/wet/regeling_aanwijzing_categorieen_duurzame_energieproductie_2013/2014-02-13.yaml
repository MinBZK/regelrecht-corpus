        paragraaf: '4'
  - number: '41.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een bestaande
      productie-installatie die op het moment van aanvraag ten minste 8,5 jaar oud is:
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel41
  - number: 41.1.a
    text: waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van allesvergisting, of
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel41
  - number: 41.1.b
    text: |-
      waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting en co-vergisting van dierlijke
      mest.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel41
  - number: '41.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0032881
  - number: '41.3'
    text: |-
      Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties
      als bedoeld in de [artikelen 3, eerste lid, onderdeel d, tweede lid, onderdeel a, vijfde lid][ref1],
      [32, tweede lid en vierde lid][ref2], en [56, eerste lid, van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel56
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0022735
        artikel: '56'
  - number: '42.1'
    text: |-
      Subsidie als bedoeld in [artikel 41, eerste lid][ref1], wordt voor een periode van 12 jaar, die niet eerder ingaat
      dan nadat de aanvraag om subsidie is gedaan, verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032881#Artikel41
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0032881
        artikel: '41'
        paragraaf: '4'
  - number: '42.2'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 41, eerste lid][ref1], binnen 3 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening opnieuw in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0032881#Artikel41
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0032881
        artikel: '41'
        paragraaf: '4'
  - number: '43.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biomassa als bedoeld in de NTA 8003: 2008, met uitzondering
      van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179 van de NTA 8003: 2008, door middel van
      vergassing.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel43
  - number: '43.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel43
  - number: '43.3'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref1].


