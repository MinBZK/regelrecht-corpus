        artikel: '76'
        paragraaf: '5'
  - number: '78.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, geproduceerd door een
      bestaande productie-installatie die op het moment van aanvraag ten minste 8,5 jaar oud is:
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel78
  - number: 78.1.a
    text: waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van allesvergisting, of
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel78
  - number: 78.1.b
    text: |-
      waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van vergisting en co-vergisting van
      dierlijke mest.
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel78
  - number: '78.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032881
    url: https://wetten.overheid.nl/BWBR0032881/2014-02-13#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0032881
  - number: '78.3'
    text: |-
      Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 3, eerste lid, onderdeel d, tweede lid, onderdeel a, vijfde lid][ref1], [48, tweede lid][ref2], en
      [56, eerste lid, van het besluit][ref3].


