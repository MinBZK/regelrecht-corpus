  - number: '77.2'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 76, eerste lid][ref1], binnen 3 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening opnieuw in gebruik.


