  - number: '123'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop de
      rijksbelastingdienst, het UWV, de SVB, het College zorgverzekeringen, de zorgautoriteit en de organen die
      betrokken zijn bij de uitvoering van de algemene verzekering bijzondere ziektekosten, samenwerken ten behoeve
      van een goede uitvoering van deze wet, de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de
      volksverzekeringen, de werknemersverzekeringen, de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2],
      de [Zorgverzekeringswet][ref3] en de belastingwetten, voorzover het betreft de financiering van de sociale
      verzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0018450
  - number: '124'
    text: |-
      De SVB, het UWV, het College zorgverzekeringen, de zorgautoriteit, de organen die betrokken zijn bij de
      uitvoering van de algemene verzekering bijzondere ziektekosten, de rijksbelastingdienst, het Centraal
      Planbureau en het Centraal Bureau voor de Statistiek zijn verplicht desgevraagd aan elkaar en aan Onze
      Minister, Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en Sport kosteloos
      de opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet, de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de volksverzekeringen, de werknemersverzekeringen, de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], de [Zorgverzekeringswet][ref3] en de belastingwetten,
      voorzover het betreft de financiering van de sociale verzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0013060
