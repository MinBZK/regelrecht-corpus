        bwb_id: BWBR0004045
        artikel: '24'
  - number: '108.2'
    text: |-
      Ten laste van het Uitvoeringsfonds voor de overheid komen voorts de kosten die rechtstreeks verband houdende met
      de uitvoering van [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ten aanzien van
      een betrokkene, indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf, bedoeld
      in het [achtste lid van dat artikel][ref2], een uitkering als bedoeld in het eerste lid, onderdeel d, ontvangt ten
      laste van het Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: '108.3'
    text: |-
      In afwijking van het eerste lid, onderdelen b, d en f, komen de uitkeringen, die worden betaald door
      een eigenrisicodrager als bedoeld in [artikel 40, eerste lid, onderdeel a][ref1], of een werkgever die
      een onderneming verkrijgt als bedoeld in [artikel 63b, derde lid, van de Ziektewet][ref2], en de door
      hem gemaakte kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden, bedoeld in
      [artikel 63a, eerste lid, van die wet][ref3], alsmede de op grond van enige wet over die uitkeringen verschuldigde
      premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref4] die niet op die uitkeringen in
      mindering kunnen worden gebracht, niet ten laste van het Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63b
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel108
    references:
