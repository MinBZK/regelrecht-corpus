  - number: 122a.3.a
    text: |-
      de zinsnede «vanaf de aanvang van de dienstbetrekking» in [artikel 49, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122a
    references:
