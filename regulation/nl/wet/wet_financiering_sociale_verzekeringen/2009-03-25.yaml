      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '8.3'
    text: |-
      Het premie-inkomen wordt tot geen hoger bedrag in aanmerking genomen dan het als tweede vermelde bedrag in kolom II
      van de tarieftabel in [artikel 2.10 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '9'
    text: |-
      De verschuldigde premie voor de volksverzekeringen is de premie voor de volksverzekeringen verminderd met de voor
      de premieplichtige toepasselijke heffingskorting voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel9
  - number: '10.1'
    text: |-
      De premie voor de volksverzekeringen wordt vastgesteld op de som van de percentages bedoeld in [artikel 11][ref1]
      van het premie-inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '10.2'
    text: |-
      Tot de premie bedoeld in het eerste lid behoort met ingang van de eerste dag van de maand waarin de verzekerde de
      leeftijd van 65 jaar zal bereiken niet de premie voor de algemene ouderdomsverzekering.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel10
  - number: '11.1'
    text: |-
      Het premiepercentage voor de algemene ouderdomsverzekering wordt bij regeling van Onze Minister vastgesteld. Het
      bedraagt ten hoogste 18,25.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel11
  - number: '11.2'
    text: Het premiepercentage voor de nabestaandenverzekering wordt bij regeling van Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel11
  - number: '11.3'
    text: |-
      Het premiepercentage voor de algemene verzekering bijzondere ziektekosten wordt vastgesteld bij regeling van Onze
      Minister van Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel11
  - number: '11.4'
    text: |-
      Indien een wijziging van een premiepercentage ingaat op een ander tijdstip dan 1 januari, vindt de vaststelling
      plaats in overeenstemming met Onze Minister van Financiën en kunnen daarbij regels worden gesteld omtrent de wijze
      van berekening van de premie over het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel11
  - number: '12.1'
    text: 'De heffingskorting voor de volksverzekeringen is de som van:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel12
  - number: 12.1.a
    text: |-
      indien betrokkene premieplichtig is voor de algemene ouderdomsverzekering: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1] berekende heffingskorting voor de algemene
      ouderdomsverzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: 12.1.b
    text: |-
      indien betrokkene premieplichtig is voor de nabestaandenverzekering: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1] berekende heffingskorting voor de nabestaandenverzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: 12.1.c
    text: |-
      indien betrokkene premieplichtig is voor de algemene verzekering bijzondere ziektekosten: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1] berekende heffingskorting voor de algemene verzekering
      bijzondere ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: '12.2'
    text: |-
      Indien de premie voor de volksverzekeringen bij wijze van inhouding wordt geheven, worden voor de toepassing
      van het eerste lid de heffingskortingen, genoemd in [artikel 8.2 van de Wet inkomstenbelasting 2001][ref1],
      die geen deel uitmaken van de standaardloonheffingskorting, bedoeld in
      [artikel 21c van de Wet op de loonbelasting 1964][ref2], geacht geen deel uit te maken van de
      standaardheffingskorting, bedoeld in [artikel 8.2 van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel21c
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 21c
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '8'
  - number: '13'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, kunnen nadere regels worden gesteld met betrekking tot deze afdeling.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel13
  - number: '14.1'
    text: |-
      Bij ministeriële regeling kunnen bedragen worden vastgesteld die als rijksbijdrage ten gunste komen van het
      Nabestaandenfonds en het Ouderdomsfonds.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan jaarlijks bedragen vaststellen die als rijksbijdrage ten
      gunste komen van het Algemeen Fonds Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel14
  - number: '15'
    text: |-
      Ten gunste van het Ouderdomsfonds, het Nabestaandenfonds en het Algemeen Fonds Bijzondere Ziektekosten wordt
      jaarlijks een rijksbijdrage in de kosten van de heffingskortingen voor de volksverzekeringen toegekend.
      Deze bijdrage wordt door Onze Minister vastgesteld volgens de formule: BIKKt = (BIKKt-1 + A*Kt-1)*Kt/Kt-
      1 waarbij: BIKKt = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in een bepaald
      jaar; BIKKt-1 = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in het voorafgaande
      jaar; A = het aandeel van de premie ten gunste van het fonds in het gecombineerde heffingspercentage, bedoeld
      in [artikel 8.1, onderdeel c, van de Wet inkomstenbelasting 2001][ref1], in het jaar waarvoor de bijdrage
      wordt toegekend, verminderd met het aandeel in het daaraan voorafgaande jaar; Kt = de door Onze Minister, in
      overeenstemming met Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport, geraamde totale kosten
      voor de heffingskortingen in het jaar waarvoor de bijdrage wordt toegekend; Kt-1 = de door Onze Minister, in
      overeenstemming met Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport, geraamde totale kosten
      voor de heffingskortingen in het jaar voorafgaand aan het jaar waarvoor de bijdrage wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: '16.1'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder loon verstaan het loon en de gage overeenkomstig de
      [Wet op de loonbelasting 1964][ref1], waarbij van die wet buiten toepassing blijven:


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 16.1.a
    text: |-
      [artikel 11, eerste lid, onderdelen j, onder 2° en 5°, en r, onder 4°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: 16.1.b
    text: |-
      [artikel 11, eerste lid, onderdeel j, onder 4°][ref1], en [artikel 35, derde lid, onderdeel g][ref2], voorzover
      het de bedragen betreft die worden ingehouden op grond van dit hoofdstuk;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '35'
  - number: 16.1.c
    text: |-
      [artikel 13bis][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
  - number: '16.2'
    text: 'Tot het loon behoren niet:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
  - number: 16.2.a
    text: |-
      hetgeen uit een vroegere dienstbetrekking als bedoeld in de [Wet op de loonbelasting 1964][ref1] wordt genoten met
      uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 16.2.a.1°
    text: |-
      de uitkeringen en toeslag, genoemd in het derde lid en vierde lid, en de aanvullingen daarop van degene tot wie de
      werknemer in dienstbetrekking staat,
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
  - number: 16.2.a.2°
    text: |-
      hetgeen wordt genoten op grond van de [artikelen 628][ref1], [628a][ref2] en
      [629 van Boek 7 van het Burgerlijk Wetboek][ref3], alsmede hetgeen door de werknemer met een publiekrechtelijke
      dienstbetrekking wordt genoten op grond van naar aard en strekking overeenkomstige regelingen, en de aanvullingen
      daarop van degene tot wie de werknemer in dienstbetrekking staat;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel628a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '628'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 628a
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 16.2.b
    text: |-
      eindheffingsbestanddelen als bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 16.2.c
    text: |-
      een vergoeding als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1] of een
      werkgeversbijdrage in de premie voor de ziektekostenverzekering van een persoon, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '2'
  - number: 16.2.d
    text: |-
      uitkeringen op grond van een regeling als bedoeld in
      [artikel 11, eerste lid, onderdeel j, onder 5°, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: '16.3'
    text: 'De uitkeringen en de toeslag, bedoeld in het tweede lid, onderdeel a, onder 1°, zijn:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
  - number: 16.3.a
    text: |-
      een uitkering op grond van een werknemersverzekering, al dan niet vermeerderd met een toeslag op grond van de
      [Toeslagenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 16.3.b
    text: |-
      een uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: '16.4'
    text: |-
      De toeslag die de werknemer die geen ziekengeld op grond van [artikel 29, eerste lid, van de Ziektewet][ref1]
      ontvangt, ontvangt op grond van de [Toeslagenwet][ref2], wordt voor de toepassing van het tweede lid, onderdeel a,
      onder 1°, geacht een uitkering te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004043
  - number: '17.1'
    text: |-
      Bij de berekening van het loon, waarnaar de premies op grond van dit hoofdstuk worden geheven, blijft het loon
      dat bij dezelfde werkgever meer heeft bedragen dan een door Onze Minister vastgesteld bedrag vermenigvuldigd met
      het aantal loontijdvakken van het premiebetalingstijdvak, voor dat meerdere buiten aanmerking. Voorts bedraagt het
      dagloon dat aan de uitkeringen op grond van de werknemersverzekeringen of vrijwillige werknemersverzekeringen ten
      grondslag ligt of wordt gelegd ten hoogste het bedrag, bedoeld in de eerste zin, met betrekking tot een loontijdvak
      van een dag.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel17
  - number: '17.2'
    text: |-
      Bij de berekening van het loon, waarnaar de premie op grond van [afdeling 2 van dit hoofdstuk][ref1] wordt
      geheven, blijft, wat betreft het door de werkgever en door de werknemer verschuldigde gedeelte van het deel
      van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds, het bij dezelfde werkgever genoten loon
      buiten aanmerking tot een door Onze Minister vastgesteld bedrag vermenigvuldigd met het aantal loontijdvakken
      van het premiebetalingstijdvak. Het bedrag, bedoeld in de eerste zin, kan voor de werkgever en voor de werknemer
      verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '2'
  - number: '17.3'
    text: |-
      De bedragen, bedoeld in het eerste en tweede lid, worden vastgesteld voor loontijdvakken waarvoor Onze Minister
      dit nodig acht. Indien een wijziging ingaat op een ander tijdstip dan 1 januari, vindt de vaststelling plaats in
      overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel17
  - number: '17.4'
    text: |-
      Indien voor een werknemer die van verschillende werkgevers loon heeft genoten premie is betaald over een hoger
      loonbedrag dan het bedrag, bedoeld in het eerste lid, stelt de inspecteur bij voor bezwaar vatbare beschikking
      het bedrag van de teveel betaalde premie vast. Bij die vaststelling wordt het voor de premieheffing in aanmerking
      komende loon berekend naar evenredigheid van het ten laste van die werkgevers genoten loon, en blijft bij de
      berekening van het loon waarnaar de premie op grond van [afdeling 2 van dit hoofdstuk][ref1], bedoeld in het tweede
      lid, wordt geheven, het voor premieberekening in aanmerking komende loon buiten aanmerking tot een evenredig deel
      van het bedrag, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '2'
  - number: '17.5'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen regels worden
      gesteld voor de vaststelling van het voor premieberekening in aanmerking komende loon bij samenloop van loon
      dat gelijktijdig wordt genoten uit een dienstbetrekking in de zin van de [Wet op de Loonbelasting 1964][ref1]
      en uit een vroegere dienstbetrekking in de zin van die wet dan wel bij het gelijktijdig genieten van meer dan
      één uitkering of toeslag als bedoeld in [artikel 16, derde en vierde lid][ref2]. In de te stellen regels wordt
      uitgegaan van een totaal loonbedrag, dat niet hoger is dan het bedrag in het eerste lid, waarbij niet meer dan één
      keer rekening wordt gehouden met dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '17.6'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen nadere en zo nodig van
      de vorige leden afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel17
  - number: '18.1'
    text: |-
      Het bedrag, bedoeld in [artikel 17, eerste lid][ref1], wordt herzien
      met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onderdeel c, van de Wet minimumloon en minimumvakantiebijslag][ref2] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '18.2'
    text: |-
      De dag, bedoeld in het eerste lid, en het overeenkomstig het eerste lid herziene bedrag worden door Onze Minister
      in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel18
  - number: '18.3'
    text: |-
      Het overeenkomstig het eerste lid herziene bedrag treedt in de plaats van het bedrag, bedoeld in
      [artikel 17, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '18.4'
    text: |-
      Uitsluitend voor de berekening van het loon waarnaar de premies worden geheven, blijft het bedrag, bedoeld in
      [artikel 17, eerste lid][ref1], zoals dat geldt per 1 januari van een kalenderjaar gedurende dat hele kalenderjaar
      van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '19'
    text: |-
      [Artikel 17, eerste tot en met derde lid][ref1], blijft buiten toepassing bij de berekening van het loon waarnaar
      de premies op grond van dit hoofdstuk worden geheven, ingeval in het premiebetalingstijdvak:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 19.a
    text: |-
      een werknemer zijn naam, adres, woonplaats of burgerservicenummer of, bij het ontbreken daarvan, zijn sociaal-
      fiscaalnummer niet aan de werkgever heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel19
  - number: 19.b
    text: |-
      bij een werknemer die loon uit tegenwoordige dienstbetrekking geniet, de werkgever zijn
      identiteit niet heeft vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 28, onderdeel e, van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
  - number: 19.c
    text: |-
      bij een werknemer die loon uit tegenwoordige dienstbetrekking geniet, vreemdeling is in de zin
      van de [Vreemdelingenwet 2000][ref1] en niet behoort tot de categorie werknemers die op grond van
      overeenkomsten van internationaal recht is uitgezonderd van de verplichting tot het hebben van een
      geldige verblijfsvergunning als bedoeld in die wet en een geldige tewerkstellingsvergunning als bedoeld
      in de [Wet arbeid vreemdelingen][ref2], de werkgever zijn verblijfsrechtelijke positie ter zake van
      het verrichten van arbeid niet heeft vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 28, onderdeel e, van de Wet op de loonbelasting 1964][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0007149
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '28'
  - number: 19.d
    text: |-
      de werknemer ter zake van de in de onderdelen a tot en met c bedoelde inlichtingen onjuiste gegevens heeft
      verstrekt en de werkgever dit weet of redelijkerwijs moet weten.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel19
  - number: '20.1'
    text: De werkgever mag op het loon van de werknemer het door deze verschuldigde deel van de premie inhouden.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel20
  - number: '20.2'
    text: |-
      De werkgever mag de door hem verschuldigde premie en de door de werknemer verschuldigde premie voorzover deze niet
      op diens loon is ingehouden, niet verhalen op de werknemer. Elk beding waarbij van de eerste zin wordt afgeweken,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel20
  - number: '21'
    text: |-
      Geen premies voor de werknemersverzekeringen zijn verschuldigd met ingang van de eerste dag van de maand waarin de
      verzekerde de leeftijd van 65 jaar zal bereiken.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel21
  - number: '22.1'
    text: |-
      Indien een wijziging van een premiepercentage bij ministeriële regeling op grond van dit hoofdstuk of een wijziging
      in de verdeling van de premie op grond van [artikel 25, tweede lid][ref1], ingaat op een ander tijdstip dan 1
      januari, vindt de vaststelling plaats in overeenstemming met Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel25
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '22.2'
    text: |-
      Indien een wijziging door het UWV van een premiepercentage op grond van dit hoofdstuk ingaat op een ander tijdstip
      dan 1 januari, is goedkeuring vereist van Onze Minister en Onze Minister van Financiën. Indien Onze Minister en
      Onze Minister van Financiën hun goedkeuring onthouden stellen zij het percentage zelf vast.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel22
  - number: '22.3'
    text: |-
      Onze Minister en Onze Minister van Financiën kunnen in een geval als bedoeld in dit artikel regels stellen omtrent
      de wijze van berekening van de premie over het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel22
  - number: '23.1'
    text: |-
      De financiële middelen tot dekking van de uitgaven ten laste van het Algemeen Werkloosheidsfonds en de
      sectorfondsen, alsmede de financiële middelen voor het vormen en in stand houden van reserves in deze fondsen,
      worden verkregen door het heffen van premie.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel23
  - number: '23.2'
    text: |-
      De premie wordt onderscheiden in een deel dat ten gunste komt van het Algemeen Werkloosheidsfonds en een deel dat
      ten gunste komt van het sectorfonds dat het UWV voor de betrokken sector afzonderlijk administreert.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel23
  - number: '24.1'
    text: |-
      Deze afdeling is niet van toepassing op overheidswerknemers en op overheidswerkgevers voorzover zij werkgever zijn
      van overheidswerknemers.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel24
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid is deze afdeling van toepassing ten aanzien van degenen
      die uitkering ontvangen op grond van de [Werkloosheidswet][ref1], de [Ziektewet][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      of [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5], dan wel een toeslag op grond
      van de [Toeslagenwet][ref6], indien zij die uitkering of toeslag uit hoofde van een dienstbetrekking als
      overheidswerknemer ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref6]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0004043
  - number: '25.1'
    text: |-
      De premie is verschuldigd door werkgevers en werknemers in de zin van de [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '25.2'
    text: |-
      Het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds is gedeeltelijk verschuldigd door
      de werkgever en gedeeltelijk door de werknemer. Bij ministeriële regeling wordt bepaald welk gedeelte door de
      werkgever en welk gedeelte door de werknemer is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel25
  - number: '25.3'
    text: Het deel van de premie dat ten gunste komt van een sectorfonds is verschuldigd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel25
  - number: '26'
    text: De maatstaf voor de heffing van de premie is het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel26
  - number: '27'
    text: |-
      Bij ministeriële regeling wordt het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds
      vastgesteld op een voor alle takken van bedrijf en beroep gelijk percentage van het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel27
  - number: '28.1'
    text: |-
      Het deel van de premie dat ten gunste komt van een sectorfonds wordt door het UWV vastgesteld op een percentage
      van het loon dat voor categorieën van werkgevers en werknemers die behoren tot verschillende sectoren en
      sectoronderdelen als bedoeld in [artikel 95][ref1] kan verschillen. Bij de vaststelling van het percentage blijven
      ten aanzien van eigenrisicodragers als bedoeld in [artikel 40, eerste lid, onderdeel a][ref2], uitkeringen op
      grond van [artikel 29, tweede lid, onderdelen a, b en c, van de Ziektewet][ref3], vermeerderd met een door het UWV
      vast te stellen opslag in verband met kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden,
      bedoeld in [artikel 63a, eerste lid, van die wet][ref4], alsmede de op grond van enige wet over die uitkeringen
      verschuldigde premies die niet op die uitkeringen in mindering kunnen worden gebracht, buiten beschouwing. Bij de
      vaststelling van het percentage blijven ten aanzien van Onze Minister van Defensie en Onze Minister, voorzover zij
      werkgever zijn van personen als bedoeld in [artikel 4, eerste lid, onderdelen i en j, van de Ziektewet][ref5], de
      uitkeringen bedoeld in [artikel 104, eerste lid, onderdelen c en d][ref6], alsmede de daaraan gerelateerde overige
      uitgaven uit het sectorfonds buiten beschouwing. Bij of krachtens algemene maatregel van bestuur kunnen hieromtrent
      nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '28.2'
    text: |-
      In afwijking van het eerste lid wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels
      bij ministeriële regeling over een uitkering op grond van de [Werkloosheidswet][ref1], de [Ziektewet][ref2],
      de [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5] aan de werknemer of gelijkgestelde, bedoeld
      in [artikel 3:6, eerste lid, van die wet][ref6], over een toeslag op grond van de [Toeslagenwet][ref7] en over loon
      op grond van een arbeidsovereenkomst als bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref8] voor het
      deel van de premie dat ten gunste komt van een sectorfonds een gemiddeld premiepercentage vastgesteld. Dit wordt
      bepaald op een gemiddelde van de percentages die zijn vastgesteld op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0004043
      [ref8]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0004043
      - id: ref8
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: '28.3'
    text: |-
      Het deel van de premie dat met toepassing van het tweede lid ten gunste komt van het sectorfonds, bedraagt ten
      hoogste de premie die op grond van het eerste lid is vastgesteld. Het resterende deel van deze premie komt ten
      gunste van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel28
  - number: '28.4'
    text: |-
      Het tweede lid wordt niet toegepast ingeval het UWV de uitkering, vermeerderd met de daarover door de werkgever
      verschuldigde premies en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1], betaalt aan de
      werkgever, bedoeld in [artikel 9][ref2], [10][ref3] of [12 van de Werkloosheidswet][ref4] en de [Ziektewet][ref5],
      [artikel 11 van de Wet werk en inkomen naar arbeidsvermogen][ref6] en in [artikel 8][ref7], [9][ref8] of
      [11 van de Wet op de arbeidsongeschiktheidsverzekering][ref9], onafhankelijk van het voortbestaan van de
      dienstbetrekking met die werkgever, tenzij die werkgever een werkgever is van degene die loon ontvangt uit een
      arbeidsovereenkomst als bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0001888
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0002524#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0002524#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0002524#Artikel11
      [ref10]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
