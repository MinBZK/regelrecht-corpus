  - number: '125.1'
    text: |-
      Hij die niet voldoet aan de inlichtingenplicht, bedoeld in [artikel 77][ref1], wordt gestraft met hechtenis van ten
      hoogste zes maanden of een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel77
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '77'
        hoofdstuk: '6'
        afdeling: '3'
  - number: '125.2'
    text: |-
      Hij die door hem op grond van deze wet betaalde of verschuldigde premie inhoudt op het loon van of op enige andere
      wijze verhaalt op een werknemer of gewezen werknemer, zonder dat dit bij deze wet is toegestaan, wordt gestraft met
      hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel125
  - number: '125.3'
    text: De in het eerste en tweede lid bedoelde strafbare feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel125
  - number: 125a
    text: |-
      Onze Minister zendt twee jaar na de inwerkingtreding van de [artikelen 47][ref1] en [48][ref2] over de
      premiekorting oudere werknemers, en vervolgens telkens na twee jaar, in overeenstemming met Onze Minister van
      Financiën, aan de Staten-Generaal een verslag over de doeltreffendheid van de premiekorting oudere werknemers voor
      de werkgelegenheid van oudere werknemers en de effecten van die premiekorting op de arbeidsinschakeling van oudere
      werknemers, op de omstandigheden waarin deze oudere werknemers dienstbetrekkingen aangaan en op de duur van de
      dienstbetrekkingen van oudere werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel48
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel125a
