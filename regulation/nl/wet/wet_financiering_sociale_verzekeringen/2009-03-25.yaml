        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 122b.1
    text: |-
      Tot het jaar 2013 bedraagt de korting, bedoeld in [artikel 47, derde lid][ref1], € 2 750 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122b
