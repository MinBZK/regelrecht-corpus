  - number: 122a.3
    text: |-
      Ten aanzien van de werkgever wiens werknemer na de dag van inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1] en voor de dag
      van inwerkingtreding van [artikel 1.5, onderdeel V, van die wet][ref2], recht krijgt op een uitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref3], wordt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122a
